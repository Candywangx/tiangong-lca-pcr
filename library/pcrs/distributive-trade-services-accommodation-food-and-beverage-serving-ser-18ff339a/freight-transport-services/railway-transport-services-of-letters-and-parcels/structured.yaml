      collection_method: "Actual collected cleaning stream with compatible material/chemical/residue composition/native property and receiver, distinct from actual direct release, evaporation and retained water. Water supplied is not automatically wastewater generated. Treat this scope as a mandatory identification requirement, not an exchange. Use the original node protocol and its records; separate every actual identity, gate and independent function before quantification, then apply the retained amount/basis/evidence instructions to each compatible concrete row separately. Never use an aggregate amount across heterogeneous identities or infer the native property/unit from a group label. A conclusion that no occurrence took place must be supported by evidence; unknown applicability or identity blocks completion. Apply these recording instructions only to the stated outputs/waste identity and gate (Collected mail-receptacle and rail-equipment cleaning wastewater). Activate when this process actually generates or receives the specified waste. Record material/formulation or genuine co-collected mixture, wet/dry state, container tare, origin event, stored quantities, handover gate and actual receiver. Reconcile generation + opening stock + receipts = handovers + closing stock + separately recorded onsite treatment. Different separately collected wastes require different rows; one genuine receiving mixture may remain one row, with composition as a nonadditive audit. Useful recovery, customer-retained items and waste are distinct fates; no automatic substitution credit. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Receiver-accepted native quantity of the specific waste or genuinely co-collected mixture in its measured state"
      frequency: "Every actual occurrence and each evidenced absence decision"
      temporal_coverage: "Full declared cohort and attributable asset life/linked events"
      site_scope: "Actual responsible sites/providers of this process only"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "Match generation, retained stock, onsite treatment and measured handover to receiver records. Separate mixed-stream quantity from constituent measurements; wet/dry or mass/volume conversion needs matching composition or density. Receiver transfer and direct environmental release have distinct gates. For the stated physical identity and matching input basis, apply the following quantity rule only at its specified attribution and normalization state: attributed_native_collected_cleaning_water / T Preserve original records, applied factors and resulting units. Value mode: calculated_value; Specificity: site_specific; Normalization basis: per declared reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_support; Sources: unsd-cpc3-65124; ghg-product-2011. Require original records, exact native support and per-concrete-row verification; these instructions do not supply a missing identity or numerical value. Completion gate: check_occurrence_completion."
  calculation_rules:
    - id: qualified_mail_work
      applies_to: "reference output and carrier mail segment ledger"
      rule: "T = sum(m_i_t * d_i_km) for each actual loaded rail segment i of each portion accepted at the carrier handover gate. m_i_t is actual mail article mass including intrinsic envelope/parcel packaging, excluding reusable carrier receptacle/pallet/container and rolling stock tare; update pickup/drop mass for every segment and count each portion/segment once."
      inputs:
        - m_i_t
        - d_i_km
        - accepted_handover_portions
        - cp_movement
        - cp_handling
      output: "T"
      source_ids:
        - ghg-product-2011
    - id: normalize_mail_work
      applies_to: "all inventory except final reference output"
      rule: "x_ref = sum(x_native_attributed) / T; T is positive qualified actual mail-rail work in t*km for the same period/cohort; final output is 1 tkm, exact native t*km spelling alias."
      inputs:
        - x_native_attributed
        - T
        - cp_movement
        - cp_handling
        - cp_support
        - cp_assets
      output: "x_ref"
      source_ids:
        - ghg-product-2011
    - id: exclusive_custody_stock
      applies_to: "each actual mail/receptacle/fuel account"
      rule: "opening + receipts + inward_transfers = closing + actual_delivery_or_use + outward_transfers + measured_loss; all destinations disjoint. Internal recovered/usable returns stay closing or later actual outward/use once, never another additive recovery term. Separate mail article and reusable equipment stocks; unknown shortage is not assumed delivered mail or emitted waste."
      inputs:
        - "actual opening_receipts_closing_transfer_delivery_use_loss"
        - cp_movement
        - cp_handling
        - cp_support
      output: "closed native custody ledger"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: traceability
      applies_to: "all nodes"
      requirement: "Actual contract/gate, native mass/tare/unit/state, signed handover/quality, route, equipment/provider scope and all-user allocation/uncertainty records required. No invented successful delivery from missing records."
      evidence: "Signed contracts/manifests; calibrated scales/meters; custody/provider registers"
    - id: mail_representativeness
      applies_to: "reference and mail handling"
      requirement: "Actual letters/parcels classes, operator/carrier function, receptacle/pickup/drop/rail route, agreed timeliness/custody/security and representativeness explicit. International UPU examples and one postal operator contract do not impose identical rules on domestic/private courier functions."
      evidence: "Actual contract and representative service-period evidence"
    - id: no_default_factors
      applies_to: "quantities and guardrails"
      requirement: "No universal mailpiece mass/density, bag/parcel count conversion, load factor, failure/empty ratio, receptacle cycles, asset life or emission factor supplied. Future QA guardrails require independent compatible reference samples; same batch maximum cannot validate itself, missing quantities are incomplete."
      evidence: "Completeness and independent evidence register"
validation_rules:
  - rule_id: carrier_function
    applies_to: "all nodes"
    rule: "Verify actual on-behalf postal/courier operator rail contract and carrier gates, mail article mass/tare separation, real loaded segments, operator-carrier handover condition and contracted timing/custody/security. Do not validate carrier output using posting count, bag count or final addressee delivery; resolve mail/intermodal/equipment classification overlap without double output."
    source_ids:
      - unsd-cpc3-65124
  - rule_id: quantity_quality
    applies_to: "all nodes"
    rule: "Join accepted mail portions/receptacles and transfers to actual weighed article mass and rail segment distance; account pickup/drop, stock, shortage/damage/rejection and real return/receiver without counting the same mail at two internal handovers. Gross bag/container/railcar mass cannot silently become mail work. Unknown handover quality or quantity stays incomplete, not an assumed success."
    source_ids:
      - upu-postal-transport-2024
  - rule_id: coverage_native_life
    applies_to: "all nodes"
    rule: "Check all actual propulsion, train/yard/empty/failed/handling/receptacle duties, all users/sites/periods and exclusive operator/carrier/provider coverage. Positive actual same-cohort all-user asset/receptacle life and causal share closure required; no universal reuse/life/load factor. Pool actual attributable numerators and qualified T across contributing sites then normalize, not unweighted intensity means."
    source_ids:
      - ghg-product-2011
  - rule_id: identity_projection
    applies_to: "all nodes"
    rule: "Every final implemented exchange requires verified concrete UUID/native property/unit/state/gate/receiver/medium. Reference mass-distance support is not the mail-carriage service UUID. EN/ZH functional/profile fields, ordered cards/rules/protocols, formula constants and sources must match canonical projection; disclose skipped/inconclusive checks and unresolved coverage."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_rail_movement
    applies_to: "rail_movement"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_mail_handling
    applies_to: "mail_handling"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_support_lifecycle
    applies_to: "support_lifecycle"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
