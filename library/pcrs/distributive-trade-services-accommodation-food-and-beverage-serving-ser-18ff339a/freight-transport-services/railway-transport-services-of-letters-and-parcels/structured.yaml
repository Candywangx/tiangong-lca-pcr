allocation_rules:
  - rule_id: causal_all_user
    applies_to: "all nodes"
    rule: "Directly subdivide/mail-lot/segment/car/equipment meter first. Shared train/yard/handling/security burdens follow evidenced causal physical mass/load/capacity/time/resistance or real operating drivers across all mail and other users; tonne-km reference does not mandate one allocation key. Document actual mail-class/quality capacity constraints. Economic fallback needs inability to establish physical relationship and sensitivity. Same event shares close to one."
    source_ids:
      - ghg-product-2011
  - rule_id: empty_failed_return
    applies_to: "all nodes"
    rule: "Retain causal empty/receptacle-return, shunting/waiting, failed/rejected/rescue/misrouted and redelivery duty before dividing once by positive qualified mail work T. Only actual accepted carrier-handover portions contribute their loaded segment work; no output for empty receptacle tare, missing parcels, stationary handling or unused reserved capacity. Trace reroute/return segments and custody lineage without repeated physical segment or final completion. T=0 is no finite intensity."
    source_ids:
      - ghg-product-2011
  - rule_id: life_period_reuse
    applies_to: "all nodes"
    rule: "Allocate actual native assembly manufacture and each life event by same-cohort attributable duty / positive supported total all-user useful duty, then by T. For receptacles use actual compatible all-user cycles/use with repair/retirement/loss ownership, not assumed count-to-cycle or mail-mass substitution. Preserve asset installation/refit/renewal/replacement/retirement and unfinished stocks/duties across periods; provider-covered cells replace exact owned cells once."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_custody_loss
    applies_to: "all nodes"
    rule: "Actual subcontract rail/terminal/handling native services replace only declared stage cells, no recursive finished-output input or duplicated supplier energy/assets. Damaged or returned mail remains custody until actual product/waste receiver decision; returned reusable receptacles are not new purchases or automatic waste. Actual discard/treatment and any useful secondary outputs need distinct handover and burden decision; no automatic avoided manufacture credit."
    source_ids:
      - ghg-product-2011
