      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual postal/courier operator contract, accepted mail/receptacles, rail-carrier gate and supply/asset/provider state |\n| starting_condition_role | Carrier-gate foreground facts do not erase earlier assets/supplies; operator postal stages distinct |\n| product_classification_scope | Full railway carriage of letters/parcels on behalf postal/courier operators65124 |\n| recursive_input_rule | Subcontracted native rail-carriage stages replace matching own cells once |\n| upstream_dataset_requirement | Actual postal-carrier function/native unit/gates, mode/technology/geography/period and lifecycle scope |\n| disclosure | Mail mass versus receptacle tare, actual custody/quality, full rail/handling/failed duties, all-user provider/assets and unknowns |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_postal_rail_function | all nodes | Cover all actual rail carriage of letters/parcels on behalf postal/courier operators, not only one postal brand, domestic/international lane, mail class or car type. Parent activity is rail mail carriage. Actual diesel-electric/electric/hybrid/other traction, mixed passenger/freight consists, dedicated mail trains, railcars/receptacles and handling contracts have evidence-backed input/data/quality differences; do not add every branch automatically. | unsd-cpc3-65124 |\n| carrier_operator_gates | mail_handling; rail_movement | Declare actual operator-to-carrier acceptance and carrier-to-operator/next-carrier handover responsibility, mail article/receptacle/dispatch/consignment linkage, seal/custody state when used and agreed quantity/condition/time/security outcome. Rail handover acceptance is not evidence of final addressee delivery. Real scanning/sorting/loading/transfer under this contract is included by scope; separate upstream/downstream postal-network sorting or last mile cannot be silently imported into rail product or dropped if contract responsibility exists. | upu-postal-transport-2024 |\n| whole_train_duty | rail_movement | Include attributable loaded running, wagon placement/shunting/marshalling, yard/depot waiting/idling, empty locomotive/car/receptacle positioning and return, start/stop/layover, failed/cancelled/rejected/rescue and redelivery duties. Retain all co-carried mail/non-mail freight/passenger/service users and their actual causal shares; capacity reserved or unused mail equipment is not delivered work. | ghg-product-2011 |\n| mail_not_consumed | rail_movement; mail_handling | Carried letters/parcels and their intrinsic packaging are custody objects, not material consumed to manufacture rail service. Track actual accepted/delivered/stock/short/damaged/returned portions and receiver. Exclude original content/envelope/parcel manufacture; disclose actual loss/replacement/treatment implications to the downstream postal/cargo model once. If carrier itself adds wrapping, labels/seals or receptacles, include only actual additional supplies and their responsibility, not repeat original mail article manufacture. | ghg-product-2011 |\n| receptacle_assets | support_lifecycle; mail_handling | Identify actual carrier/operator-supplied mailbags, trays, cages, pallets, containers or other reusable receptacles by one actual identity/material/state/native quantity and gate. Contents and reusable receptacle tare are separate. Reuse/return/repair/loss/cleaning/retirement and all users/cycles are collected; no assumed one-use bag, universal reuse cycles or all-plastic material. Inclusive equipment hire/service replaces its covered lifecycle cells, not additional initial assembly or duplicate cleaning. | usps-rail-transport-contract-example |\n| rail_assets_energy | support_lifecycle; rail_movement | PCR lifecycle choice includes actual locomotives/mail or shared railcars/traction batteries, track/points/signalling/contact-wire/substations and yard/depot/terminal handling/security equipment manufacture, install/refit, maintenance/renewal/replacement and retirement. Whole assembly and included initial parts are exclusive; manufacture is not whole-life service. Diesel-electric internal generation is not external AC purchase; separately bought DC/AC, network/conversion/storage/regeneration/export gates and losses have unique ownership. Actual wear/lubricant/sanding species/fates remain required, no tailpipe-zero equals lifecycle-zero assumption. | ghg-product-2011 |\n| atomic_expansion | all nodes | Each actual unrepresented energy/material/consumable/receptacle/asset/provider/waste/direct species gets a concrete row_id under one true node, direction/type, single native identity/state/property/unit/quantity, source and same-node protocol, gate/receiver/medium and uncertainty. Conditional requirement cards expand into every actual exchange, not one umbrella UUID. Fuel supply/stock/burn/spill, carbon origin, pollutant substance/compound/size and collected versus air/water/soil fates stay distinct; missing is incomplete, not zero. | ghg-product-2011 |\n\n"
