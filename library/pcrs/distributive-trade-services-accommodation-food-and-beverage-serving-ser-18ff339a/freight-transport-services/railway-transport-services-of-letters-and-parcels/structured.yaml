system_boundary:
  rules:
    - rule_id: full_postal_rail_function
      applies_to: "all nodes"
      rule: "Cover all actual rail carriage of letters/parcels on behalf postal/courier operators, not only one postal brand, domestic/international lane, mail class or car type. Parent activity is rail mail carriage. Actual diesel-electric/electric/hybrid/other traction, mixed passenger/freight consists, dedicated mail trains, railcars/receptacles and handling contracts have evidence-backed input/data/quality differences; do not add every branch automatically."
      source_ids:
        - unsd-cpc3-65124
    - rule_id: carrier_operator_gates
      applies_to: "mail_handling; rail_movement"
      rule: "Declare actual operator-to-carrier acceptance and carrier-to-operator/next-carrier handover responsibility, mail article/receptacle/dispatch/consignment linkage, seal/custody state when used and agreed quantity/condition/time/security outcome. Rail handover acceptance is not evidence of final addressee delivery. Real scanning/sorting/loading/transfer under this contract is included by scope; separate upstream/downstream postal-network sorting or last mile cannot be silently imported into rail product or dropped if contract responsibility exists."
      source_ids:
        - upu-postal-transport-2024
    - rule_id: whole_train_duty
      applies_to: "rail_movement"
      rule: "Include attributable loaded running, wagon placement/shunting/marshalling, yard/depot waiting/idling, empty locomotive/car/receptacle positioning and return, start/stop/layover, failed/cancelled/rejected/rescue and redelivery duties. Retain all co-carried mail/non-mail freight/passenger/service users and their actual causal shares; capacity reserved or unused mail equipment is not delivered work."
      source_ids:
        - ghg-product-2011
    - rule_id: mail_not_consumed
      applies_to: "rail_movement; mail_handling"
      rule: "Carried letters/parcels and their intrinsic packaging are custody objects, not material consumed to manufacture rail service. Track actual accepted/delivered/stock/short/damaged/returned portions and receiver. Exclude original content/envelope/parcel manufacture; disclose actual loss/replacement/treatment implications to the downstream postal/cargo model once. If carrier itself adds wrapping, labels/seals or receptacles, include only actual additional supplies and their responsibility, not repeat original mail article manufacture."
      source_ids:
        - ghg-product-2011
    - rule_id: receptacle_assets
      applies_to: "support_lifecycle; mail_handling"
      rule: "Identify actual carrier/operator-supplied mailbags, trays, cages, pallets, containers or other reusable receptacles by one actual identity/material/state/native quantity and gate. Contents and reusable receptacle tare are separate. Reuse/return/repair/loss/cleaning/retirement and all users/cycles are collected; no assumed one-use bag, universal reuse cycles or all-plastic material. Inclusive equipment hire/service replaces its covered lifecycle cells, not additional initial assembly or duplicate cleaning."
      source_ids:
        - usps-rail-transport-contract-example
    - rule_id: rail_assets_energy
      applies_to: "support_lifecycle; rail_movement"
      rule: "PCR lifecycle choice includes actual locomotives/mail or shared railcars/traction batteries, track/points/signalling/contact-wire/substations and yard/depot/terminal handling/security equipment manufacture, install/refit, maintenance/renewal/replacement and retirement. Whole assembly and included initial parts are exclusive; manufacture is not whole-life service. Diesel-electric internal generation is not external AC purchase; separately bought DC/AC, network/conversion/storage/regeneration/export gates and losses have unique ownership. Actual wear/lubricant/sanding species/fates remain required, no tailpipe-zero equals lifecycle-zero assumption."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic_expansion
      applies_to: "all nodes"
      rule: "Each actual unrepresented energy/material/consumable/receptacle/asset/provider/waste/direct species gets a concrete row_id under one true node, direction/type, single native identity/state/property/unit/quantity, source and same-node protocol, gate/receiver/medium and uncertainty. Conditional requirement cards expand into every actual exchange, not one umbrella UUID. Fuel supply/stock/burn/spill, carbon origin, pollutant substance/compound/size and collected versus air/water/soil fates stay distinct; missing is incomplete, not zero."
      source_ids:
        - ghg-product-2011
