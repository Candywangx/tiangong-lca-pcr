  calculation_rules:
    - id: qualified_rail_work
      applies_to: "reference output and cargo segment ledger"
      rule: "T = sum(m_i_t * d_i_km) over each actual loaded segment i of each qualified accepted delivered cargo portion; use its actual net cargo mass after pickup/drop, excluding locomotive/car/container tare. The same physical segment/portion appears once; no output for empty/stationary/failed cargo portions."
      inputs:
        - m_i_t
        - d_i_km
        - accepted_portion_ids
        - cp_movement
      output: "T"
      source_ids:
        - ghg-product-2011
    - id: normalize_rail_work
      applies_to: "all inventory except final reference output"
      rule: "x_ref = sum(x_native_attributed) / T; T is positive actual qualified refrigerated delivered cargo work in t*km of the same period/cohort; final reference output is 1 tkm."
      inputs:
        - x_native_attributed
        - T
        - cp_movement
        - cp_cold
        - cp_support
        - cp_assets
      output: "x_ref"
      source_ids:
        - ghg-product-2011
    - id: exclusive_native_ledger
      applies_to: "each actual fuel refrigerant cargo and storage account"
      rule: "opening + receipts + inward_transfers = closing + actual_use_or_delivery + outward_transfers + measured_loss; destinations are mutually exclusive. Internal recovered material stays closing or is later recorded once at actual use/outward gate, not another recovery term. If cargo moisture changes, close conserved dry matter using EACH observed wet mass/moisture and water separately with actual addition/retention/outgoing/evaporation; unknown deficit is not an inferred leak."
      inputs:
        - "actual native stocks"
        - receipts
        - transfers
        - "measured use_delivery_loss"
        - cp_movement
        - cp_cold
        - cp_support
      output: "closed native ledger"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: native_traceability
      applies_to: "all nodes"
      requirement: "Retain raw signed mass/route/quality/meter records, native support/gates, same-node protocol, source/provider scope, all-user allocation and uncertainty for every real exchange. Unknown stays incomplete."
      evidence: "Calibrations, manifests, operator/provider and waste registers"
    - id: rail_cold_representativeness
      applies_to: "reference and reefer preservation"
      requirement: "Actual consignment segment mass/distance, frozen/refrigerated state, temperature/time/quality, train/car/cooling technology, shunt/empty duty, season and provider scope required; one equipment example cannot define universal fleet behavior."
      evidence: "Actual journey chain, logger and compatible equipment records"
    - id: no_fabricated_ranges
      applies_to: "quantities and methods"
      requirement: "No universal fuel/cooling/carload/empty ratio, emission factor, refrigerant leakage or life default supplied. Future empirical guardrails need independent compatible samples; a batch maximum cannot validate the same batch. Missing quantity/identity is not zero."
      evidence: "Completeness and independent source register"
validation_rules:
  - rule_id: reference_work
    applies_to: "all nodes"
    rule: "Verify actual frozen/refrigerated goods in specially refrigerated rail cars, each actual accepted delivered cargo portion and loaded segment mass/distance, OD/gates and cold quality/time. Cargo tonnes exclude locomotive/car/container tare. T is actual qualified delivered work, not gross train tonne-km, railcar count/TEU, billed capacity, stationary time or distance double-counted at yard handoffs."
    source_ids:
      - ghg-product-2011
  - rule_id: cold_energy_balance
    applies_to: "all nodes"
    rule: "Validate actual locomotive versus reefer/terminal energy, all supply/conversion/storage/recovery gates, fuel stock/use/spill and refrigerant initial/makeup/stock/recovery/actual leak by equipment and period. Compatible actual operator instructions and quality outcomes, not default setpoints, govern collection. Unexplained missing balance is not inferred emission or cargo loss."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage_life
    applies_to: "all nodes"
    rule: "Check complete loaded/empty/shunt/yard/failed/cold duties, all users/outputs/sites/periods, exclusive provider cells and positive compatible same-cohort lifetime duty. Pool actual attributable numerators and qualified work T across real contributing sites then normalize, no unweighted intensity mean. Unknown supplier gates/asset life/quantity/receiver stays incomplete."
    source_ids:
      - ghg-product-2011
  - rule_id: identity_alignment
    applies_to: "all nodes"
    rule: "Each implemented exchange needs verified concrete UUID/native property/unit/state/gate/medium. Reference support identity is independent from service UUID. Compare all EN/ZH functional/profile fields, ordered cards/rules/protocols, constants and source references with canonical generated projection; disclose skipped/inconclusive checks."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_rail_movement
    applies_to: "rail_movement"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_reefer_preservation
    applies_to: "reefer_preservation"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_support_lifecycle
    applies_to: "support_lifecycle"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible refrigerated-car rail freight attached to cargo supply-chain LCA"
  allowed_use: "Comparable net-cargo segment mass/distance, cold quality/time and actual traction/reefer/provider/lifecycle boundaries"
  excluded_use: "Cargo manufacture, other freight functions, unsupported tonne-km equivalence, missing duty treated zero or unverified final exchanges"
  required_metadata: "All reference qualifiers, actual native source records, cargo/cold/fate/energy ownership, provider gates, allocation and all-user life"
  required_quality_disclosure: "Unknown identities/amounts, method domain, site/period representativeness, failed/rejected duty, cold media/fates, uncertainty/skipped checks"
  update_trigger: "Changed cargo/method/route/quality/control/technology/asset/provider or verified new evidence"
data_sources:
  - id: "unsd-cpc3-65121"
    type: "official_guidance"
    reference: "UNSD CPC3.0 65121; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full frozen/refrigerated goods in specially refrigerated rail cars, no numerical reference rule"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard2011,chapters6–10; https://ghgprotocol.org/sites/default/files/ghgp/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data/allocation principles; full assets and algorithms are declared PCR choices"
  - id: "up-reefer-operating-instructions"
    type: "handbook"
    reference: "Union Pacific Refrigerated Unit Operating Instructions, updated2018-12-18; https://www.up.com/content/dam/upcom/migration/uprr/customers/documents/up-pdf-nativedocs/pdf-ship-q-reefer-car.pdf"
    used_for: "Equipment-specific precondition/testing, cooling/heating/door-state and commodity controls; not universal settings"
  - id: "bnsf-reefer-equipment"
    type: "handbook"
    reference: "BNSF Refrigerated Boxcar equipment; https://www.bnsf.com/ship-with-bnsf/ways-of-shipping/equipment/refrigerated-boxcars.html"
    used_for: "Actual refrigerated-car configuration and commodity questions only; changeable provider specifications are not universal dimensions/payload or separate cooling-unit evidence"
  - id: "ipcc-mobile-2006"
    type: "official_guidance"
    reference: "IPCC2006 Guidelines Vol.2 Ch.3 Mobile Combustion railways; https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Rail combustion activity and species/method questions; no generic emission factors adopted"
