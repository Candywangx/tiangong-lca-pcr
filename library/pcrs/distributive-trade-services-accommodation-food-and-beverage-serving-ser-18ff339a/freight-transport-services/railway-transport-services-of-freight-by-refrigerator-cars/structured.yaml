system_boundary:
  rules:
    - rule_id: full_rail_scope
      applies_to: "all nodes"
      rule: "Full frozen/refrigerated goods in specially refrigerated rail cars; actual diesel-electric, electric, hybrid or other traction and actual mechanical/electric/ice/cryogenic cooling states are conditional evidence-backed implementations. Parent activity is refrigerated rail freight. Separate locomotive traction topology from car refrigeration: onboard diesel generation is not externally purchased electricity, and electric locomotive traction does not prove electric reefers or zero refrigeration fuel. Actual off-wire, generator, storage and energy-recovery interfaces retain real gates and losses."
      source_ids:
        - unsd-cpc3-65121
    - rule_id: full_duty
      applies_to: "rail_movement"
      rule: "Include loaded train movement, shunting/marshalling, yard waiting/idling, depot starts/layovers, empty locomotive/reefer reposition and returns, failed/cancelled/rescue/rejected deliveries and actual driver/auxiliary duty attributable to this service. Retain mixed consists, other freight and any jointly carried passenger/service outputs and their real causal shares. Cooling during stationary/empty/failed duties remains attributable where it supports the declared service; it does not add transport distance to output."
      source_ids:
        - ghg-product-2011
    - rule_id: cold_handoff
      applies_to: "reefer_preservation"
      rule: "The preservation boundary begins with actual preparation, testing and preconditioning attributable to the declared service, including service-responsible duty before cargo acceptance. Record the accepted cargo state/temperature as its own trace anchor; continue all actual preservation duties through real delivery temperature/time/excursions and handover acceptance decision. Record preconditioning/testing, cooling or actual heating/defrost/fan/door-open operational states, fuel/recharge/recovery and all actual cold media separately. Manufacturer/operator instructions apply only to the compatible equipment and commodity, not a universal setpoint or door-operation assumption. A stationary refrigeration-hour is not a tonne-km output."
      source_ids:
        - up-reefer-operating-instructions
    - rule_id: cargo_provider
      applies_to: "rail_movement; support_lifecycle"
      rule: "Cargo is transported custody, not consumed inventory or new goods output; original cargo manufacture is outside freight product. Track acceptance/delivery, segment pickup/drop, hold/return/loss/receiver and each actual quality outcome; downstream cargo LCA receives physical loss/replacement disclosure once. Rail carriers, yards, wagon/reefer suppliers, cold terminals and drayage operators have explicit native activity/gates and covered cells. A supplier result replaces exact owned cells once; outside-mode drayage remains separately classified and upstream/disclosed at its real gate, not silently renamed as rail."
      source_ids:
        - ghg-product-2011
    - rule_id: asset_network
      applies_to: "support_lifecycle"
      rule: "PCR lifecycle choice covers actual locomotives/reefer cars/cooling units/batteries, track/rail/sleepers/ballast/points/signalling/contact-line/substation and yard/depot/terminal/loading equipment manufacture, installation/refit, maintenance/renewal/replacements and retirement. Whole assembly versus included initial components is exclusive. Native manufacturing supply is not a whole-life rail service; same-cohort all-user useful duty supports allocation only. Actual wheel/rail/brake/collector wear, lubricant/sanding and generated waste/emissions require real material/species/fate records."
      source_ids:
        - ghg-product-2011
    - rule_id: energy_species
      applies_to: "all nodes"
      rule: "Purchased AC/contact-line DC, own conversion/generation, storage charge/discharge, regeneration and external export have distinct actual native gates. Gross/net energy, internal recovered braking and actual external export cannot be counted twice or credited as universal avoided electricity. Refrigerant supply/initial charge/makeup/stock/recovery and actual leakage are distinct. Preserve fuel carbon origin and actual burned quantity, species/compound/PM-size and air/water/soil/collected receiver; no fuel supply=burn or recharge=leak rule."
      source_ids:
        - ipcc-mobile-2006
    - rule_id: actual_expansion
      applies_to: "all nodes"
      rule: "For every actual unrepresented energy/material, cold medium, asset, provider result, waste or emitted species, create one real row_id per concrete identity/state/native property/unit with one parent node/direction/type, actual amount/source, same-node protocol, gate and receiver/medium/uncertainty. Conditional semantic requirement cards cannot be one verified umbrella exchange. Missing actual occurrence/quantity/identity remains incomplete, not zero; route alternatives remain in scope when not yet observed."
      source_ids:
        - ghg-product-2011
