allocation_rules:
  - rule_id: movement_cold_shares
    applies_to: "all nodes"
    rule: "Directly subdivide/meter train segment, consist, car and cooling unit first. Unavoidable mixed-train traction/yard burdens use evidenced causal physical gross vehicle/load/distance/resistance or other actual operating relationships across ALL users; cargo tonne-km denominator does not mandate tonne-km allocation. Car refrigeration follows actual car/compartment thermal/time/commodity causation across loads. Economic fallback requires inability to establish physical relation plus sensitivity. Same event shares close to one."
    source_ids:
      - ghg-product-2011
  - rule_id: empty_failed_quality
    applies_to: "all nodes"
    rule: "Retain attributable empty/shunting/waiting/failed/rescue/rejected and precondition/cooling duties in the causal pool before normalizing once by positive qualified delivered work T. Empty car/locomotive tare, failed cargo portions, internal rehandling and stationary cooling add no delivered cargo tonne-km. Redelivery/return legs and successful segments are traced without duplicate final output. T=0 has no finite intensity."
    source_ids:
      - ghg-product-2011
  - rule_id: all_user_life
    applies_to: "all nodes"
    rule: "Allocate each native asset manufacture and actual lifecycle event by same-cohort attributable service duty / positive supported total ALL-user useful duty, then normalize by T. Preserve actual installation/renewal/replacement/retirement and unfinished periods; fixed railcar/locomotive/track/battery life, empty ratio, cooling efficiency or refrigerant leakage factors are not supplied. Supplier-native life coverage replaces exact cells; an asset manufacture row cannot cover unrepresented operations or end-of-life."
    source_ids:
      - ghg-product-2011
  - rule_id: cargo_reject_recovery
    applies_to: "all nodes"
    rule: "Actual returned/recovered cargo, collected waste, generated residues, direct releases and useful secondary outputs have their own real state/receiver/handover. No automatic avoided burden or cargo manufacture repeat. Refrigerant internally recovered into closing stock or later outward/use transfer is counted once, never an extra recovery destination on top of those same terms."
    source_ids:
      - ghg-product-2011
