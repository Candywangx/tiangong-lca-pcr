    used_for: "Classification scope only. One-container completed-leg reference and accounting choices are explicit PCR methods."
  - id: "unece-ctu-2014"
    type: "official_guidance"
    reference: "IMO/ILO/UNECE, CTU Code, 2014, chapters 2, 4, 7. https://unece.org/transport/intermodal-transport/imoilounece-code-practice-packing-cargo-transport-units-ctu-code"
    used_for: "Reusable container versus packaging/vehicle distinction, transport-chain responsibilities and cargo-specific condition/handling context; not numerical factors or a universal reference quantity."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard, 2011, chapters 6-9. https://ghgprotocol.org/product-standard"
    used_for: "General lifecycle boundary, data disclosure and allocation principles. Expanded assets and the leg/native-demand/life formulas are PCR-designed methods."
