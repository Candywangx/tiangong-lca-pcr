      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | container_road_leg | Subdivide dedicated leg duties and directly measured resources before residual allocation. Container count alone is valid only for demonstrated comparable causation; different sizes, payloads, duty, temperature or distances need actual causal physical drivers. Do not silently average incompatible service strata. | ghg-product-2011 |\n| common_pool | container_road_leg | Enumerate every intended independently supplied cargo/container leg and any other real service at its handover. Reconcile each shared duty/site/period pool across all users. Evidence may support payload-distance, occupied capacity-time, direct energy or another causal driver; TEU, price, rated payload and equal split are not defaults. Empty/failure/return duty belongs once to its evidenced serving pool. |  |\n| life_attribution | container_road_leg | For each truck, chassis, container, battery, road or terminal asset allocate native delivered quantity by studied compatible duty divided by positive documented same-asset all-user lifetime duty, then normalize by N once. Keep manufacture, initial components, replacements, maintenance and retirement disjoint. Forecast life and uncertainty require evidence; purchase-year amounts, money, lease duration or arbitrary lifetime do not replace physical demand. |  |\n| rejected_and_recovery | container_road_leg | Identify rejected cargo/container state, actual recovery/return/rework route and producing duty. Rejected outputs cannot be completed service without independent acceptance; returned cargo is not an extra purchased transport service from oneself. Retain causal burden through loops. Recovery products, residues and wastes require separate identities and explicit attribution; no automatic avoided virgin-material or energy credit. |  |\n\n"
