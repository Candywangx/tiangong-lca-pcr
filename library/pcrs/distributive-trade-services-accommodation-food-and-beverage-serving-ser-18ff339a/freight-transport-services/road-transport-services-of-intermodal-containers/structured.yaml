product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.road-transport-services-of-intermodal-containers"
  classification_refs: "CPC 3.0 65113; exact"
  covered_products: "This PCR covers carriage by road of articles and packages assembled in purpose-built intermodal shipping containers. The service is road carriage of the containerized goods between the declared taking-in-charge and delivery interfaces. Container design, cargo type, road vehicle, propulsion, carrier geography, domestic or international route and actual handling or temperature-control conditions are declared parameters, not silent restrictions to a convenient dry-container or diesel subtype. A container does not have to change modes during the studied leg to qualify."
  excluded_products: "Exclude separately supplied rail, inland-water, sea, air or space legs; standalone forwarding, packing/unpacking, storage or terminal transfer sold as distinct functions; container/vehicle manufacture or rental as the final product; ordinary non-container freight, tank-truck, moving, letter/parcel, live-animal or refrigerated-vehicle service whose actual classification is another road subclass. Determine overlap from the actual supplied function and equipment rather than cargo name alone; the same physical event cannot be outputs of two transport categories. Actual road-haulier-controlled lift, lashing inspection, waiting, reefer connection and delivery support stay inside the leg when the contract and responsibility establish inclusion."
  representative_product: "Completed road freight leg of one laden intermodal shipping container"
  production_route: "Actual containerized cargo road pickup, carrying duties and accepted delivery; owned or subcontracted responsibility with complete attributable lifecycle."
  market_state: "Completed road freight leg of one laden intermodal shipping container"
functional_unit:
  what: "Completed road freight leg of one laden intermodal shipping container"
  how_much: "1 actual completed laden-container road leg"
  how_well: "Actual container/cargo identity, pickup/delivery scope, road distance, quality and any temperature-control requirement accepted by recipient."
  how_long_or_cycle: "Actual leg and supporting complete duty/lifecycle interval; report actual elapsed time and cohort period."
  reference_flow_link: "completed_container_road_leg"
system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "container_road_leg"
      rule: "Declare containerized articles/packages road carriage and actual pickup/delivery acceptance; maintain adjacent-mode and separately supplied terminal function boundaries."
      source_ids:
        - unsd-container-road-2025
    - rule_id: ownership
      applies_to: "container_road_leg"
      rule: "Assign each vehicle duty, container, site, supplier, phase and period one burden owner. A verified complete subcontracted carriage or handling result replaces only its documented covered foreground cells. Expand missing phases; never add a full supplier result and its covered fuel, emissions, handling or capital a second time."
      source_ids:
        - ghg-product-2011
    - rule_id: cargo_equipment
      applies_to: "container_road_leg"
      rule: "Cargo remains carried property and is not a product input consumed to create a transport service. Track cargo contents/mass and custody off the service exchange ledger. Extra cargo replacement required by actual damage is assessed at its real owner/function; ordinary cargo manufacture is not charged again by multiplying gross payload. Containers, chassis, trucks and securing devices are reusable transport assets with separate supply/use/end-of-life boundaries."
      source_ids:
        - unece-ctu-2014
    - rule_id: route_completeness
      applies_to: "container_road_leg"
      rule: "Include actual loaded and causal empty/repositioning, waiting, unsuccessful or recovery duties, dispatch/terminal support, asset manufacture, maintenance, replacements and retirement across the declared life. Diesel and electric supplies are conditional examples only; actual alternative fuel/hybrid/reefer equipment must have its own native supply, stock, operation, auxiliary, emission and fate records. Do not assume zero from absence of a UUID or measurement."
      source_ids: []
    - rule_id: physical_fates
      applies_to: "container_road_leg"
      rule: "Distinguish supplied fuel, actual burned fuel, stock changes, spills, recovery and transfers. Whole-blend supply and constituent replacement supplies are alternative representations. Internal battery discharge/regeneration is not new electricity supply. Each substance release needs actual identity, source, medium and subcompartment; unexplained losses or cargo shortage do not automatically become air emissions or waste."
      source_ids: []
    - rule_id: temperature_handling
      applies_to: "container_road_leg"
      rule: "For actual conditioned containers collect target and measured temperature/time, metered reefer energy and source, connection responsibility, preconditioning and loading intervals. Resolve which supplier owns refrigeration and refrigerant supply/leak/recovery. Preserve required handling even when it lies in another provider record; a dry-container route does not require fictional cooling."
      source_ids:
        - unece-ctu-2014
