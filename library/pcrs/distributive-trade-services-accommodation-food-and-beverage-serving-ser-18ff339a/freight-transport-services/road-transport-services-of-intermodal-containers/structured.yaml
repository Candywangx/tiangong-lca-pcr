      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual container/cargo custody and road duty records at stated pickup; compatible upstream supplier interfaces. |\n| starting_condition_role | Foreground collection interface, not zero upstream asset/supply burden. |\n| product_classification_scope | CPC 3.0 65113 |\n| recursive_input_rule | Use verified same-function subcontracted service once at native demand; expand uncovered responsibility, never purchase a self-service or create extra final output. |\n| upstream_dataset_requirement | Actual function, native demand, technology, geography, period, phases and quality compatible; explicitly complete all missing stages. |\n| disclosure | Cargo/container custody, scope/acceptance, route/energy, empty/failed duties, owned/provider cells, sites/periods, lifetime, allocation and unresolved gaps. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_gate | container_road_leg | Declare containerized articles/packages road carriage and actual pickup/delivery acceptance; maintain adjacent-mode and separately supplied terminal function boundaries. | unsd-container-road-2025 |\n| ownership | container_road_leg | Assign each vehicle duty, container, site, supplier, phase and period one burden owner. A verified complete subcontracted carriage or handling result replaces only its documented covered foreground cells. Expand missing phases; never add a full supplier result and its covered fuel, emissions, handling or capital a second time. | ghg-product-2011 |\n| cargo_equipment | container_road_leg | Cargo remains carried property and is not a product input consumed to create a transport service. Track cargo contents/mass and custody off the service exchange ledger. Extra cargo replacement required by actual damage is assessed at its real owner/function; ordinary cargo manufacture is not charged again by multiplying gross payload. Containers, chassis, trucks and securing devices are reusable transport assets with separate supply/use/end-of-life boundaries. | unece-ctu-2014 |\n| route_completeness | container_road_leg | Include actual loaded and causal empty/repositioning, waiting, unsuccessful or recovery duties, dispatch/terminal support, asset manufacture, maintenance, replacements and retirement across the declared life. Diesel and electric supplies are conditional examples only; actual alternative fuel/hybrid/reefer equipment must have its own native supply, stock, operation, auxiliary, emission and fate records. Do not assume zero from absence of a UUID or measurement. |  |\n| physical_fates | container_road_leg | Distinguish supplied fuel, actual burned fuel, stock changes, spills, recovery and transfers. Whole-blend supply and constituent replacement supplies are alternative representations. Internal battery discharge/regeneration is not new electricity supply. Each substance release needs actual identity, source, medium and subcompartment; unexplained losses or cargo shortage do not automatically become air emissions or waste. |  |\n| temperature_handling | container_road_leg | For actual conditioned containers collect target and measured temperature/time, metered reefer energy and source, connection responsibility, preconditioning and loading intervals. Resolve which supplier owns refrigeration and refrigerant supply/leak/recovery. Preserve required handling even when it lies in another provider record; a dry-container route does not require fictional cooling. | unece-ctu-2014 |\n\n"
