  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "I_x = A_x / N, where A_x is actual native quantity attributed to the compatible completed-leg cohort after causal all-user allocation. N is positive; zero-output pools retain burdens for boundary resolution."
      inputs:
        - A_x
        - N
      output: "native quantity per completed leg"
      source_ids: []
    - id: supplier_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s, with q_u the compatible provider inventory per actual native unit u, D_u the actual same-unit demand and s the evidenced cohort/all-user share. Replace covered cells before A_x / N; no automatic count-to-tkm conversion."
      inputs:
        - q_u
        - D_u
        - s
        - N
      output: "attributed native inventory"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life, where Q_asset is actual native delivered asset quantity and U_studied/U_life are compatible same-asset duty with positive documented all-user lifetime denominator. Then I_asset = A_asset / N once; separately close replacements and retirement."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - N
      output: "native asset quantity per completed leg"
      source_ids: []
    - id: stock_fate
      applies_to: "fuel/refrigerant/cleaning rows"
      rule: "Opening + supplied + transfers_in = closing + consumed + transferred_out + recovered + evidenced_release + unresolved_residual. Keep streams mutually exclusive with actual native units; recovery remaining within closing stock is not also an external recovered output; unresolved_residual is investigated, not assigned automatically to air, waste or combustion."
      inputs:
        - opening
        - supplied
        - transfers_in
        - closing
        - consumed
        - transferred_out
        - recovered
        - evidenced_release
        - unresolved_residual
      output: "reconciled event ledger"
      source_ids: []
  data_quality_requirements:
    - id: qualifier_and_acceptance
      applies_to: "reference output"
      requirement: "Original and actual amended scope, cargo/container custody, native attributes, road route and delivery acceptance must substantiate N; preserve failed/rejected duties and uncertainty."
      evidence: "cp_service"
    - id: atomic_route
      applies_to: "all actual exchanges"
      requirement: "Every actual branch/exchange requires atomic row id, actual identity/type/direction/gate, native quantity/property/unit, own-process protocol and collection/source provenance. Conditional absence requires affirmative actual evidence; missing is not zero."
      evidence: "cp_operation;cp_support;cp_maintenance;cp_emissions"
    - id: provider_life
      applies_to: "provider and asset rows"
      requirement: "Document exact covered phase/event/site/period cells, all users and positive same-asset lifetime demand. Collect construction, initial parts, replacement, maintenance and end-of-life separately where not covered. Forecasts retain basis and sensitivity."
      evidence: "cp_assets;cp_provider"
    - id: site_period_outputs
      applies_to: "shared pools"
      requirement: "Index every contributing site, vehicle/container and reporting/lifecycle period plus all intended outputs/receivers. Aggregate raw attributed quantities before dividing by coherent N, not arithmetic means of unlike intensities; reconcile whole pool and exclusions."
      evidence: "cp_service;cp_assets;cp_operation"
    - id: fates
      applies_to: "cargo and environmental transfers"
      requirement: "Trace actual rejected cargo and repair/return/recovery/disposal owner. Require actual species, carbon origin, medium/subcompartment and source/method uncertainty, not generic emission names or assumed complete refrigerant loss."
      evidence: "cp_maintenance;cp_emissions"
validation_rules:
  - rule_id: reference_complete
    applies_to: "container_road_leg"
    rule: "Verify exactly one accepted laden-container road leg as 1 Item(s), real output linkage, declared boundaries, container/cargo attributes and N>0. A count cannot be converted to tonne-distance or TEU without actual segment payload/distance and declared empty/tare treatment."
    source_ids: []
  - rule_id: coverage_closure
    applies_to: "container_road_leg"
    rule: "Check every actual route, fuel, refrigeration, handling, site, shared asset and period has one owner; covered supplier cells replace their foreground counterparts. No excluded adjacent-mode service or ordinary cargo manufacture is smuggled into the final road function."
    source_ids: []
  - rule_id: material_and_energy
    applies_to: "container_road_leg"
    rule: "Reconcile actual fuel and refrigerant stocks, burn/leak/recovery/transfer, electricity gates, cleaning-water fate, damaged goods and waste destinations. Identify chemical species/carbon origin and receiving compartment; reject duplicated particle-size totals, assumed full leakage and unexplained balance residuals treated as emissions."
    source_ids: []
  - rule_id: pool_and_lifetime
    applies_to: "container_road_leg"
    rule: "Reconcile all-user causal allocation fractions and site/period coverage, same-asset lifetime denominator and output cohort. Retain zero-output and failed-duty pools without fabricated finite intensity. Reject duplicate initial/replacement component and manufacture/end-of-life coverage."
    source_ids: []
  - rule_id: projection_and_identity
    applies_to: "container_road_leg"
    rule: "Every concrete exchange needs actual native quantity/property/unit, exact semantic identity or registered unresolved gap, one real process and same-node collection protocol. Check English/Chinese rule ids, cards, sources and current projection fingerprints. A checker pass proves neither external identity verification nor publication readiness."
    source_ids: []
  - rule_id: atomic_container_road_leg
    applies_to: "container_road_leg"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified road-container freight service inventory for downstream process/lifecyclemodel projections"
  allowed_use: "Qualified completed laden-container road legs with harmonized actual gates, box/cargo, distance, quality, temperature duties and complete attributable lifecycle after mandatory data/identity completion."
  excluded_use: "Unqualified generic tkm/TEU/vehicle trip; whole multimodal route or container/cargo manufacture; empty/failure output relabelled as successful carriage; unresolved actual inventory treated as zero."
  required_metadata: "container_identity_type_size; cargo_articles_packages_contents_net_gross_tare; pickup_delivery_and_responsibility_gates; actual_road_distance_duty_time; promised_scope_and_accepted_completion; N_comparable_completed_laden_legs; actual_vehicle_propulsion_and_empty_duty; reefer_temperature_power_responsibility_if_actual; provider_native_demand_exact_coverage; shared_asset_all_user_life_and_period; actual_substance_receiver_and_fates"
  required_quality_disclosure: "Scope and acceptance, native provider coverage, actual data gaps, causal allocation, shared lifetime forecasts, stock/fate closure and uncertainty."
  update_trigger: "Changed service/cargo/container/gates, route/propulsion/reefer, suppliers, asset life, allocation, source/fate or acceptance."
