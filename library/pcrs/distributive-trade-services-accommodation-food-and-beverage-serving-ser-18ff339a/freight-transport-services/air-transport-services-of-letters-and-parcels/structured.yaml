  calculation_rules:
    - id: qualified_count
      applies_to: "air_mail_carriage"
      rule: "One reference engagement is the originally specified air-carrier letters/parcels consignment obligation: declared postal/courier customer, manifest articles/receptacles and actual quantities/state, carrier pickup, actual air route/legs and transfer airports, custody interval, receiving operator/agent, timing/security/integrity and any actual temperature/quality conditions. Count once only on complete accepted fulfilment of that original obligation. An independently documented contemporaneous accepted segment or amended obligation may qualify on its own specified function; do not retrospectively shrink a failed manifest, lower a deadline/security/quality requirement or count original and amended services together. N is the positive count of equivalent qualified completed engagements; N=0 has no finite intensity. An article, bag, dispatch, ULD, aircraft movement or electronic message is not automatically one reference engagement. Actual article/receptacle quantities, physical payload, route/distance and duration remain mandatory; unlike obligations require strata or a declared bounded mixture."
      inputs:
        - "Actual original equivalent air-mail consignment obligations and physical accepted handoffs"
      output: "N"
      source_ids:
        - ghg-product-2011
    - id: normalize
      applies_to: "air_mail_carriage"
      rule: "Directly subdivide actual flight/phase/terminal/handler measurements. For remaining shared cells enumerate every real intended service and user, then choose evidenced physical causality appropriate to that cell: actual consistent physical payload/space constraint and route/time for carriage, actual loading/screening/cold handling needs, and same-asset all-user useful duty for assets. Passenger belly/combi mail shares the whole flight with actual passengers/baggage/other cargo and configuration; a dedicated freighter still shares with all actual cargo/empty/support duties. Do not assume belly mail is burden-free marginal weight or allocate the whole aircraft to mail. Do not import standard passenger/seat masses or generic load factors; justify actual joint-service basis and conservation, with alternatives/sensitivity and actual contemporaneous values if economic allocation is justified. Retain allocated empty, failed, diversion, return, missed-connection and recovery/support burdens with their responsible completed-service cohort; N only normalizes, not a universal causal driver. Divide attributed native quantities by positive N once."
      inputs:
        - "Actual attributed native quantities and positive N"
      output: "Native quantity per declared 1 Item(s) qualified engagement"
      source_ids:
        - ghg-product-2011
    - id: physical_payload
      applies_to: "air_mail_carriage"
      rule: "Keep actual postal-article mass (including its own envelope/parcel packaging where that is the declared article), external bag/tray/receptacle tare and ULD/pallet/net tare separately. Nested gross values are not additive: derive a consistent physical load from measured components or an evidenced gross/tare reconciliation, without adding contents already inside a measured receptacle/ULD again. Other cargo, passenger/baggage and actual flight configuration are separate real users; aircraft empty mass is not mail. Chargeable/volumetric/tariff weight is not actual material mass or automatic aircraft payload. Where space constrains carriage, use measured dimensions/volume and evidenced capacity/causality, not a universal chargeable-density factor."
      inputs:
        - "Actual article/receptacle/ULD mass/tare/volume and other co-users"
      output: "Consistent physical carried load without nested duplication"
      source_ids:
        - ghg-product-2011
    - id: custody_stock
      applies_to: "air_mail_carriage"
      rule: "Customer letters/parcels and their contents remain freight, not a material input consumed to produce air carriage. Exclude original paper/envelope/package/content manufacture and postal posting/collection/independent sorting/delivery outside carrier gates. Link item/receptacle/dispatch/consignment/ULD and flight/transfer IDs without equating them. At the actual custody boundary reconcile opening plus real inward articles/receptacles with mutually exclusive accepted outward delivery, actual outward return/transfer, actual discard, direct release and closing stock. Retained, offloaded or refused mail is closing stock until a real outward transfer; damage/loss investigation is a state, not an extra mass exit or automatic successful output. Rebagging, scanning, sorting needed for carrier handling and internal hub transfers do not create new original articles or multiple reference outputs. If actual wet/moisture/ice conditions alter mass, record each measured wet-basis fraction w and M_dry=M_wet*(1-w), or evidenced compatible conversion; wet closure includes actual water addition/uptake/drain/evaporation and exclusive delivered/returned/retained/discarded water. No assumed moisture conservation or invented loss fraction."
      inputs:
        - "Actual physical custody/quality/stock/transfer/moisture observations"
      output: "Exclusive mail/component/water fates and retained stock"
      source_ids:
        - ghg-product-2011
    - id: asset_life
      applies_to: "air_mail_carriage"
      rule: "attributed_asset = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty; include uncovered life phases once, then divide positive N. Native manufacturing gate and actual same-cohort useful-duty denominator cover all real mail/cargo/passenger/empty/other users, with actual repair/replacement/retirement records; no multiplication of complete aircraft and its already included engines/parts."
      inputs:
        - "Actual native same-asset quantity"
        - "positive all-user useful duty and coverage"
      output: "Attributed native full-life asset quantity"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: strata
      applies_to: "air_mail_carriage"
      requirement: "Enumerate actual postal/courier customers, original mail quantities/state/obligation, carrier/handler, dedicated/belly/combi/other aircraft-engine-propulsion/configuration, airport/actual legs/time/altitude, season and care/security contributors. Equivalent Count outputs require actual function/quantity/route/quality weights and distributions; unlike consignments stay stratified or a bounded mixture with disclosed comparison limits. Scheduled averages and calculator city-pairs do not replace actual nonscheduled or transferred mail scope."
      evidence: "Actual contributor original-function/quantity/route/configuration weights and coverage"
    - id: completeness
      applies_to: "air_mail_carriage"
      requirement: "Expand conditional cards into actual specific materials/species/assets/providers/receivers with native property/unit, state/grade, quantity source, actual gate, environment/altitude and exact covered cells. One source/quantity/coverage cell has one responsible owner; provider substitution adds only uncovered cells. Fixed UUIDs cover only the compatible actual branch, not broader aviation fuels, all air compartments, all polymers or all waste. Required unresolved identity/quantity/fate evidence prevents final dataset completion; conditional does not mean zero."
      evidence: "Actual source/native/gate/covered-cell and custody/stock/fate ledger"
    - id: uncertainty
      applies_to: "air_mail_carriage"
      requirement: "Require calibrated actual fuel/energy/payload/tare/time/custody/quality measurements or reviewed models applicable to actual aircraft/engine/route/phase and airport sources, independent checks, sample coverage and uncertainty. No invented fuel coefficient, corrected great-circle distance, default hub, regional load factor, passenger/seat mass, empty ratio, security/cold dose, refrigerant/spoilage loss or asset life/range. CO2-only calculator output is not a whole inventory, life-cycle result or current legal certificate."
      evidence: "Calibration, exact model/version/applicability and source/phase native QA/sensitivity"
validation_rules:
  - rule_id: scope_completion
    applies_to: "air_mail_carriage"
    rule: "Check actual scheduled/nonscheduled air transport on behalf of postal/courier services and carrier gates versus external integrated postal network. Verify original manifest quantities/route/custody/timing/security/quality and unique accepted complete function with positive N; no failed-scope retcon or unlike Count pooling without declared strata/limits."
    source_ids:
      - unsd-cpc65311
      - ghg-product-2011
  - rule_id: aircraft_allusers
    applies_to: "air_mail_carriage"
    rule: "Check actual operated flight/engine/propulsion/configuration and dedicated/belly/combi branches, every phase/terminal/transfer/empty/failed/recovery duty, all passengers/baggage/other-cargo users and nested physical payload/space. Uplifted fuel, chargeable weight or planned messages are not substitutes for actual burn, mass or completion."
    source_ids:
      - ghg-product-2011
  - rule_id: species_stocks
    applies_to: "air_mail_carriage"
    rule: "Validate actual fuel origins/upstream consumed-stock once, source/phase/altitude/medium and chemical/particle number versus mass basis. Do not universalize certification LTO to cruise, assume fossil/biogenic origins or bind known altitude to unspecified air. Reconcile actual cargo/refrigerant/gear/water stocks, measured moisture changes and exclusive actual receiver fates."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage_native_life
    applies_to: "air_mail_carriage"
    rule: "Check native units/gates and exact provider covered cells, same-cohort full all-user useful life/phase denominators, actual contributor weights/representativeness and allocation conservation, then bilingual/projection alignment. Required missing quantities, identities or actual quality/fate evidence block final dataset completion; no blanket zero or deletion to pass. Verify unique asset/component/event-to-row ownership across vessel/aircraft, reusable equipment, infrastructure, maintenance and provider cards as applicable; whole-assembly included parts and their separate supplies cannot both enter the same phase inventory."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_air_mail_carriage
    applies_to: "air_mail_carriage"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
