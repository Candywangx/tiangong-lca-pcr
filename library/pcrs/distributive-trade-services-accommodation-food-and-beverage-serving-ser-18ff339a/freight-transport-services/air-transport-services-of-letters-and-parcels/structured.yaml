          offset: 22253
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual physical air-carrier custody takeover from postal/courier operator and supporting upstream supply/asset gates |\n| starting_condition_role | Customer original letters/parcels are freight with observed inlet condition, not consumed manufacture input |\n| product_classification_scope | Cover all scheduled and nonscheduled air transportation of letters and parcels performed on behalf of postal and courier services. The foreground is the actual air carrier/handler custody and contracted receiving handoff, including direct or actual transfer routes and supporting airport operations. Dedicated freighter, passenger belly, combi, small aircraft and any other actually qualifying propulsion/configuration are conditional routes; neither jet aircraft nor international UPU-designated-operator traffic defines the whole category. |\n| recursive_input_rule | Recurse actual independent fuel/energy/material/asset/provider supplies at native gates; original mail/content manufacture and external postal network stay outside; one covered cell counted once |\n| upstream_dataset_requirement | Actual native quantity/property/unit/grade/state/provider geography/technology and exact covered operation/life phase before substitution |\n| disclosure | Actual air-carrier receiving handoff/quality and retained/returned/rejected mail fates, supporting duties and uncovered asset/waste-treatment end gates |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| completion | air_mail_carriage | One reference engagement is the originally specified air-carrier letters/parcels consignment obligation: declared postal/courier customer, manifest articles/receptacles and actual quantities/state, carrier pickup, actual air route/legs and transfer airports, custody interval, receiving operator/agent, timing/security/integrity and any actual temperature/quality conditions. Count once only on complete accepted fulfilment of that original obligation. An independently documented contemporaneous accepted segment or amended obligation may qualify on its own specified function; do not retrospectively shrink a failed manifest, lower a deadline/security/quality requirement or count original and amended services together. N is the positive count of equivalent qualified completed engagements; N=0 has no finite intensity. An article, bag, dispatch, ULD, aircraft movement or electronic message is not automatically one reference engagement. Actual article/receptacle quantities, physical payload, route/distance and duration remain mandatory; unlike obligations require strata or a declared bounded mixture. | unsd-cpc65311; upu-postal-transport-2024; ghg-product-2011 |\n| carrier_custody | air_mail_carriage | Customer letters/parcels and their contents remain freight, not a material input consumed to produce air carriage. Exclude original paper/envelope/package/content manufacture and postal posting/collection/independent sorting/delivery outside carrier gates. Link item/receptacle/dispatch/consignment/ULD and flight/transfer IDs without equating them. At the actual custody boundary reconcile opening plus real inward articles/receptacles with mutually exclusive accepted outward delivery, actual outward return/transfer, actual discard, direct release and closing stock. Retained, offloaded or refused mail is closing stock until a real outward transfer; damage/loss investigation is a state, not an extra mass exit or automatic successful output. Rebagging, scanning, sorting needed for carrier handling and internal hub transfers do not create new original articles or multiple reference outputs. If actual wet/moisture/ice conditions alter mass, record each measured wet-basis fraction w and M_dry=M_wet*(1-w), or evidenced compatible conversion; wet closure includes actual water addition/uptake/drain/evaporation and exclusive delivered/returned/retained/discarded water. No assumed moisture conservation or invented loss fraction. | upu-postal-transport-2024; ghg-product-2011 |\n| actual_air_duties | air_mail_carriage | Identify the operating carrier and actual aircraft/engine/configuration and propulsion route for each real leg: dedicated freighter, passenger belly, combi or other qualifying air carriage. Do not assume all mail flies a freighter or all propulsion is kerosene turbofan. Include responsible start/APU, pushback/taxi/queue, takeoff/climb/cruise/descent/approach/landing, turnaround/ground power, actual terminal/ramp transfers, screening, loading/unloading, transfer-airport custody and any declared cold care. Actual empty/reposition, aborted/offloaded/diverted/returned/recovery duties and supporting maintenance periods remain attributed. Record actual route, time, altitude/location and conditions; a scheduled flight, airway bill, code share or a label saying air does not prove actual movement or two distinct physical flights. Ground-only flight-truck carriage is not automatically an air-service output, although actual carrier-responsible road support/recovery burdens remain within their declared responsibility and cannot be silently omitted. | icao-freighter-2024v2; icao-passenger-2024v13-1; eurocontrol-airport-sources |\n| mail_payload | air_mail_carriage | Keep actual postal-article mass (including its own envelope/parcel packaging where that is the declared article), external bag/tray/receptacle tare and ULD/pallet/net tare separately. Nested gross values are not additive: derive a consistent physical load from measured components or an evidenced gross/tare reconciliation, without adding contents already inside a measured receptacle/ULD again. Other cargo, passenger/baggage and actual flight configuration are separate real users; aircraft empty mass is not mail. Chargeable/volumetric/tariff weight is not actual material mass or automatic aircraft payload. Where space constrains carriage, use measured dimensions/volume and evidenced capacity/causality, not a universal chargeable-density factor. | upu-postal-transport-2024; ghg-product-2011 |\n| native_energy | air_mail_carriage | Each actual propulsion/APU/GSE fuel, purchased ground AC/DC/heat/cold, charging, refrigeration/conditioning, screening/handling IT and terminal utility has its own native material/energy quantity and gate. Reconcile opening/purchase/transfer/actual consumption/spill/closing fuel or battery stocks; uplifted fuel is not automatically fuel burned. Actual consumed fuel withdrawn from an initial/customer/operator stock bears its compatible upstream once regardless of title/payer, without charging the whole stock or original mail contents. Separate jet fuel/avgas/actual SAF-blend components or other fuels and origins; ground diesel is not aviation fuel by default. Own generator/APU electricity, battery discharge, bleed-air conditioning or recovered heat is internal conversion, not an extra purchased input beside its real fuel/power/assets. Supplier-covered cells replace exact foreground cells once. Actual energy pathways require evidence; no assumed fossil-only mix, zero SAF upstream, universal fuel coefficient or engine efficiency. | ghg-product-2011 |\n| security_care | air_mail_carriage | Declare actual carrier takeover and surrender of physical custody, original ready-for-carriage/security/integrity/timing criteria, measured transfer times and receiver acceptance. Electronic advance/transport/event records are evidence linked to physical receipt/delivery, not physical completion by themselves; courier-specific equivalent records are permitted without imposing a UPU identifier or message code universally. Resolve offloads, screening alarms, resealing/rebagging, missed connections, return/recovery and actual responsible provider; only actually performed handling/security burdens belong here. For actual temperature/humidity/pressure-sensitive parcels record original conditions and calibrated cargo/air/fluid histories, ice/PCM/cryogen/refrigerant supplies/recovery/releases; not every mail shipment is cold or dangerous goods. A carrier air transport acceptance is not final delivery to the individual addressee or the whole postal network. | upu-postal-transport-2024; ghg-product-2011 |\n| species_altitude | air_mail_carriage | Separate actual aircraft/engine/phase/trajectory altitude and receiving air subcompartment from APU/taxi/GSE/stationary airport sources. Use measured quantities or reviewed models applicable to the actual engine/propulsion, fuel origin/blend, load, phase and atmosphere; certification LTO/static data are not automatically cruise or turboprop/piston/electric fuel factors. Preserve actual chemical reporting basis: NOx as NO2-equivalent differs from N or a single NO/NO2 species, aggregate HC reported as CH4-equivalent is not automatically actual methane, carbon differs from CO2, smoke number differs from particle mass, and nvPM particle number differs from mass. Match actual size/composition/native number support where required, avoiding total/constituent double counting. Fossil, biogenic and recovered-carbon fuel or cryogen origins require separate evidence. Non-CO2 climate characterization/contrail effects are not invented elementary mass exchanges or a universal CO2 multiplier; disclose actual inventory/model and LCIA scope separately. Known altitude/medium cannot be replaced by unspecified air merely to reuse a UUID. | easa-edb-introduction; eurocontrol-airport-sources; ghg-product-2011 |\n| life_period | air_mail_carriage | Actual aircraft/engine/APU/battery and installed systems, ULD/pallet/net/bag/tray, loader/tractor/scanner/cold/IT equipment, airport ramp/runway/terminal/security/fuel/ground-power/cold infrastructure require matching native manufacturing quantity/configuration/BOM and gate. Use same-cohort full all-user useful duty across actual mail, other cargo, passengers/baggage, empty/idle/failure and other actual functions/periods. Include uncovered manufacture/installation, maintenance/overhaul/replacement and retirement/treatment once; a manufacturing flow is not a whole operated carriage service. Reusable bags/ULDs/thermal packs are opening/purchase/issue/return/repair/loss/retirement/closing stocks, not new manufacture per flight. Empty bag/ULD returns have actual route/provider responsibility and shared allocation, not free transport or a second completed letters/parcels output. Do not double count installed engines/parts/initial refrigerant already inside an aircraft/equipment gate or provider/lease coverage. No assumed aircraft life, engine cycles, bag reuse count or scrap credit. | ghg-product-2011 |\n| provider_coverage | air_mail_carriage | Identify actual operating air carrier, contracted/marketing carrier, handler, airport/security/cold/ground-power and interline/road-support/waste providers. Use actual native service quantity and declared cells/gates; a postal contract, code share or lease invoice does not establish physical operation or full life-cycle coverage. Replace exact covered energy/emissions/assets/treatment cells once and add uncovered responsibilities only; do not force provider native quantity equal to one reference engagement. | ghg-product-2011 |\n| water_cold_fates | air_mail_carriage | Actual cleaning/de-icing/defrost/ice/conditioned-air/refrigeration duties require exact material/refrigerant/secondary-fluid/cryogen state and composition, opening/makeup/recovery/reuse/destruction/release/closing stock and supply gate. Closed-loop recirculation is not new consumption; all initial charge is not burned/released per flight and makeup is not automatically leakage. Purchased cold/ice and own production have exclusive energy/material coverage. Environmental water withdrawal/discharge uses actual airport/source/receiving medium and chemistry/temperature; captured oily/de-icing/cleaning wastewater sent to a receiver is not also direct air/water release. No automatic river/seawater or municipal receiver identity. | ghg-product-2011 |\n| atomic_inventory | air_mail_carriage | Expand conditional cards into actual specific materials/species/assets/providers/receivers with native property/unit, state/grade, quantity source, actual gate, environment/altitude and exact covered cells. One source/quantity/coverage cell has one responsible owner; provider substitution adds only uncovered cells. Fixed UUIDs cover only the compatible actual branch, not broader aviation fuels, all air compartments, all polymers or all waste. Required unresolved identity/quantity/fate evidence prevents final dataset completion; conditional does not mean zero. | ghg-product-2011 |\n\n"
