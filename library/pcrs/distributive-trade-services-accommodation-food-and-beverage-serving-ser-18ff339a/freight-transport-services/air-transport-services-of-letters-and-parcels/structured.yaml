  source_sha256: "sha256:2d0fa16021f66becc2f1a6039f0fc2e457657d921a1754e53dad927368334def"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_9573"
      family: "system_boundary"
      span:
        start:
          offset: 9573
