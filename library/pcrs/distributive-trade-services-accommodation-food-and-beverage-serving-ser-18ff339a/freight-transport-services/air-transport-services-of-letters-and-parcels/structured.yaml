          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| subdivide | air_mail_carriage | Directly subdivide actual flight/phase/terminal/handler measurements. For remaining shared cells enumerate every real intended service and user, then choose evidenced physical causality appropriate to that cell: actual consistent physical payload/space constraint and route/time for carriage, actual loading/screening/cold handling needs, and same-asset all-user useful duty for assets. Passenger belly/combi mail shares the whole flight with actual passengers/baggage/other cargo and configuration; a dedicated freighter still shares with all actual cargo/empty/support duties. Do not assume belly mail is burden-free marginal weight or allocate the whole aircraft to mail. Do not import standard passenger/seat masses or generic load factors; justify actual joint-service basis and conservation, with alternatives/sensitivity and actual contemporaneous values if economic allocation is justified. Retain allocated empty, failed, diversion, return, missed-connection and recovery/support burdens with their responsible completed-service cohort; N only normalizes, not a universal causal driver. Divide attributed native quantities by positive N once. | ghg-product-2011 |\n| physical_mass_space | air_mail_carriage | Keep actual postal-article mass (including its own envelope/parcel packaging where that is the declared article), external bag/tray/receptacle tare and ULD/pallet/net tare separately. Nested gross values are not additive: derive a consistent physical load from measured components or an evidenced gross/tare reconciliation, without adding contents already inside a measured receptacle/ULD again. Other cargo, passenger/baggage and actual flight configuration are separate real users; aircraft empty mass is not mail. Chargeable/volumetric/tariff weight is not actual material mass or automatic aircraft payload. Where space constrains carriage, use measured dimensions/volume and evidenced capacity/causality, not a universal chargeable-density factor. | ghg-product-2011 |\n| life_attribution | air_mail_carriage | Actual aircraft/engine/APU/battery and installed systems, ULD/pallet/net/bag/tray, loader/tractor/scanner/cold/IT equipment, airport ramp/runway/terminal/security/fuel/ground-power/cold infrastructure require matching native manufacturing quantity/configuration/BOM and gate. Use same-cohort full all-user useful duty across actual mail, other cargo, passengers/baggage, empty/idle/failure and other actual functions/periods. Include uncovered manufacture/installation, maintenance/overhaul/replacement and retirement/treatment once; a manufacturing flow is not a whole operated carriage service. Reusable bags/ULDs/thermal packs are opening/purchase/issue/return/repair/loss/retirement/closing stocks, not new manufacture per flight. Empty bag/ULD returns have actual route/provider responsibility and shared allocation, not free transport or a second completed letters/parcels output. Do not double count installed engines/parts/initial refrigerant already inside an aircraft/equipment gate or provider/lease coverage. No assumed aircraft life, engine cycles, bag reuse count or scrap credit. | ghg-product-2011 |\n| failure_fates | air_mail_carriage | Missing/damaged/security-held/offloaded/returned mail keeps actual state and custody until a documented outward receiver or closing inventory. Failed carriage, screening alarms, rerouting and recovery burdens are retained with the responsible service cohort. No automatic completed output from scanning, arrival, compensation payment, downgraded deadline or a second bill. Genuine independent recovered products need their own intended function/handoff and justified attribution; discarded mail, returned bags or recovered refrigerant do not automatically earn avoided original product, aviation fuel or recycling credit. | ghg-product-2011 |\n\n"
