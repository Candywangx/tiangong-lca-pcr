  classification_refs: "CPC 3.0 65311"
  covered_products: "Cover all scheduled and nonscheduled air transportation of letters and parcels performed on behalf of postal and courier services. The foreground is the actual air carrier/handler custody and contracted receiving handoff, including direct or actual transfer routes and supporting airport operations. Dedicated freighter, passenger belly, combi, small aircraft and any other actually qualifying propulsion/configuration are conditional routes; neither jet aircraft nor international UPU-designated-operator traffic defines the whole category."
  excluded_products: "Exclude integrated posting/collection/postal-network sorting/last-mile delivery as the reference product, passenger service, independent nonmail air freight, space freight, cargo manufacture/trade and bare aircraft/ULD rental/manufacture. Include only actual carrier-responsible handling, screening/transfer/care and support duties within the declared air carriage boundary. A common company brand or invoice does not merge the postal and air-carrier gates; independently supplied cells are assigned once by actual scope. Pure ground-only carriage cannot be silently relabeled air freight."
  representative_product: "Qualified completed air-carrier letter/parcel consignment handoff"
  production_route: "Actual carrier custody, mail/ULD mapping, scheduled/nonscheduled flight and airport transfer/handling/security/conditional care to original receiving acceptance with full attributed duty/life"
  market_state: "Original manifest/quantity/route/custody/timing/security/quality obligation completely fulfilled and accepted"
  parent_activity: "Air freight carriage supplied to postal/courier operators"
  route_delta: "Actual mail-specific carrier-custody handoffs, receptacle/consignment evidence and security/quality duties; freighter versus belly/combi and propulsion/ground-source deltas require actual topology and co-user allocation, not universal default routes"
functional_unit:
  what: "Qualified completed air-carrier letter/parcel consignment handoff"
  how_much: "1 Item(s): one originally specified qualified air-carrier mail consignment obligation, with actual manifest quantities/route and original acceptance conditions"
  how_well: "One reference engagement is the originally specified air-carrier letters/parcels consignment obligation: declared postal/courier customer, manifest articles/receptacles and actual quantities/state, carrier pickup, actual air route/legs and transfer airports, custody interval, receiving operator/agent, timing/security/integrity and any actual temperature/quality conditions. Count once only on complete accepted fulfilment of that original obligation. An independently documented contemporaneous accepted segment or amended obligation may qualify on its own specified function; do not retrospectively shrink a failed manifest, lower a deadline/security/quality requirement or count original and amended services together. N is the positive count of equivalent qualified completed engagements; N=0 has no finite intensity. An article, bag, dispatch, ULD, aircraft movement or electronic message is not automatically one reference engagement. Actual article/receptacle quantities, physical payload, route/distance and duration remain mandatory; unlike obligations require strata or a declared bounded mixture."
  how_long_or_cycle: "Actual physical carrier pickup/custody start to contracted consignee/agent custody surrender and accepted handoff; declare measured elapsed time, original service/reporting cycle, all actual flight/transfer/support periods and separately attributed all-user asset-life periods."
