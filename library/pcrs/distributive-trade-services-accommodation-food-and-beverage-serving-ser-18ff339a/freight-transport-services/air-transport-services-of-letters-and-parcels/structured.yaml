  required_quality_disclosure: "Actual original custody/acceptance/manifest and flown route/aircraft/co-users, fuel origins and phase/altitude species basis, native gates/stocks/fates/all-user life and uncertainty/unresolved"
  update_trigger: "Mail obligation/carrier/route/aircraft-engine-propulsion/configuration/security/care/provider/asset/native evidence change"
