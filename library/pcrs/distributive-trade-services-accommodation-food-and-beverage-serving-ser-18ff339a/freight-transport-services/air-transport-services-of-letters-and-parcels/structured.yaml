      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_completion | air_mail_carriage | Check actual scheduled/nonscheduled air transport on behalf of postal/courier services and carrier gates versus external integrated postal network. Verify original manifest quantities/route/custody/timing/security/quality and unique accepted complete function with positive N; no failed-scope retcon or unlike Count pooling without declared strata/limits. | unsd-cpc65311; ghg-product-2011 |\n| aircraft_allusers | air_mail_carriage | Check actual operated flight/engine/propulsion/configuration and dedicated/belly/combi branches, every phase/terminal/transfer/empty/failed/recovery duty, all passengers/baggage/other-cargo users and nested physical payload/space. Uplifted fuel, chargeable weight or planned messages are not substitutes for actual burn, mass or completion. | ghg-product-2011 |\n| species_stocks | air_mail_carriage | Validate actual fuel origins/upstream consumed-stock once, source/phase/altitude/medium and chemical/particle number versus mass basis. Do not universalize certification LTO to cruise, assume fossil/biogenic origins or bind known altitude to unspecified air. Reconcile actual cargo/refrigerant/gear/water stocks, measured moisture changes and exclusive actual receiver fates. | ghg-product-2011 |\n| coverage_native_life | air_mail_carriage | Check native units/gates and exact provider covered cells, same-cohort full all-user useful life/phase denominators, actual contributor weights/representativeness and allocation conservation, then bilingual/projection alignment. Required missing quantities, identities or actual quality/fate evidence block final dataset completion; no blanket zero or deletion to pass. Verify unique asset/component/event-to-row ownership across vessel/aircraft, reusable equipment, infrastructure, maintenance and provider cards as applicable; whole-assembly included parts and their separate supplies cannot both enter the same phase inventory. | ghg-product-2011 |\n| atomic_air_mail_carriage | air_mail_carriage | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
