normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:55998d5b966944cb3f910fceeca9b8f914e3d1c764bcefcb55e79ba9ddaec858"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5414"
      family: "system_boundary"
      span:
        start:
          offset: 5414
          line: 55
          column: 1
        end:
          offset: 10088
          line: 78
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual household inventory/condition and agreed task, responsibility and site/access facts |\n| starting_condition_role | Custody/task facts, not zero burden assets or manufacture of customer goods |\n| product_classification_scope | CPC 3.0 65115 |\n| recursive_input_rule | Exact subcontract moving/packing coverage replaces covered cells once; internal packing task is not an additional final moving engagement |\n| upstream_dataset_requirement | Native actual material/equipment/service identities, gates, periods, useful duties, geography and provider coverage |\n| disclosure | Actual branch, goods custody, equipment/packaging lifecycle, all-user shares, failures and uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope | moving_engagement | Cover household furniture and household-goods removal plus qualifying ancillary packing, carrying and in-house moving, including engagements whose actual obligation is only such an ancillary service. Road-powered, manual handling, in-house repositioning and actual lifting or packing routes remain in scope; not every engagement requires all branches. Exclude office furniture/equipment removal (65119), commodity manufacture/sale, bare equipment rental, independently scoped disposal/storage, and unrelated parcel or general freight outputs. | unsd-cpc3-65115 |\n| obligation | moving_engagement | Declare one actual service engagement and accepted obligation: inventoried items, pickup/placement rooms and floors, access/stair/lift conditions, packing/protection/disassembly/reassembly roles where actually furnished, quality and completion gate. Fulfilment may be accepted in-house movement or packing handoff without a road journey or a freight-delivery event. No forced positive km, mass-distance, truck capacity or packaged-item count. | unsd-cpc3-65115; ghg-product-2011 |\n| custody | moving_engagement | Customer goods are custody inventory, not mover-purchased manufacturing inputs. Close opening custody plus actual pickup against accepted handoff, actual outward return, discarded items/releases and closing custody, with each item/transfer/disposition exclusive. Damage is a condition, not automatically disposal or replacement manufacture; retain actual repair/return/discard/resupply responsibility and all failed/rework duty. | ghg-product-2011 |\n| packing | household_packing | Keep household_packing as the actual conditional protection/packing node: declare original unprotected or previously packed item state, actual packed/protected state and handoff. Packaging and original goods are distinct; reuse/consumption/customer-retention/discard are exclusive destinations. Internal task output transfers exactly once to moving_engagement; packing-only engagements still have one actual final engagement output, not a road freight output. Haul/carry/lifting remain parent moving duties, outside the packing activity except separately recorded packing manipulation. | ghg-product-2011 |\n| whole_duty | moving_engagement | Retain causally assigned preparation, site access, stairs/lifts, carrying, disassembly/reassembly and protection work actually furnished, loaded/empty/reposition/failed/retry duties, temporary responsible holding and post-task cleanup. No default road distance, packing recipe, handling hours, metabolic food or emissions for manual work. Actual propulsion delta under moving_engagement changes fuels, charging/native energy and assets; actual packing technologies change own-node material/support records. | ghg-product-2011 |\n| assets_provider | moving_engagement | Cover actual vehicles, handling/lifting equipment, reusable pads/boxes and responsible road/building-access/depot/site assets over manufacture, installation, maintenance, replacement and retirement. Native manufacture quantity has only verified gate coverage, allocated by same-cohort all-user useful duty; not whole-life service. Separate real subcontract move, packing, hoist, carrier or treatment provider coverage and replace exact covered cells once, no assembly/initial-part or provider/foreground duplication. | ghg-product-2011 |\n| atomic | moving_engagement | Expand every actual conditional material, asset, fuel, service, waste and pollutant into a separate row with one existing parent process, direction/type, actual identity/state/gate/medium, native unit/quantity, verified UUID or registered unresolved identity, parent-owned protocol, source and supported calculation. Missing required quantities or states are incomplete, not zero. | ghg-product-2011 |\n\n"
