system_boundary:
  rules:
    - rule_id: scope
      applies_to: "moving_engagement"
      rule: "Cover household furniture and household-goods removal plus qualifying ancillary packing, carrying and in-house moving, including engagements whose actual obligation is only such an ancillary service. Road-powered, manual handling, in-house repositioning and actual lifting or packing routes remain in scope; not every engagement requires all branches. Exclude office furniture/equipment removal (65119), commodity manufacture/sale, bare equipment rental, independently scoped disposal/storage, and unrelated parcel or general freight outputs."
      source_ids:
        - unsd-cpc3-65115
    - rule_id: obligation
      applies_to: "moving_engagement"
      rule: "Declare one actual service engagement and accepted obligation: inventoried items, pickup/placement rooms and floors, access/stair/lift conditions, packing/protection/disassembly/reassembly roles where actually furnished, quality and completion gate. Fulfilment may be accepted in-house movement or packing handoff without a road journey or a freight-delivery event. No forced positive km, mass-distance, truck capacity or packaged-item count."
      source_ids:
        - unsd-cpc3-65115
        - ghg-product-2011
    - rule_id: custody
      applies_to: "moving_engagement"
      rule: "Customer goods are custody inventory, not mover-purchased manufacturing inputs. Close opening custody plus actual pickup against accepted handoff, actual outward return, discarded items/releases and closing custody, with each item/transfer/disposition exclusive. Damage is a condition, not automatically disposal or replacement manufacture; retain actual repair/return/discard/resupply responsibility and all failed/rework duty."
      source_ids:
        - ghg-product-2011
    - rule_id: packing
      applies_to: "household_packing"
      rule: "Keep household_packing as the actual conditional protection/packing node: declare original unprotected or previously packed item state, actual packed/protected state and handoff. Packaging and original goods are distinct; reuse/consumption/customer-retention/discard are exclusive destinations. Internal task output transfers exactly once to moving_engagement; packing-only engagements still have one actual final engagement output, not a road freight output. Haul/carry/lifting remain parent moving duties, outside the packing activity except separately recorded packing manipulation."
      source_ids:
        - ghg-product-2011
    - rule_id: whole_duty
      applies_to: "moving_engagement"
      rule: "Retain causally assigned preparation, site access, stairs/lifts, carrying, disassembly/reassembly and protection work actually furnished, loaded/empty/reposition/failed/retry duties, temporary responsible holding and post-task cleanup. No default road distance, packing recipe, handling hours, metabolic food or emissions for manual work. Actual propulsion delta under moving_engagement changes fuels, charging/native energy and assets; actual packing technologies change own-node material/support records."
      source_ids:
        - ghg-product-2011
    - rule_id: assets_provider
      applies_to: "moving_engagement"
      rule: "Cover actual vehicles, handling/lifting equipment, reusable pads/boxes and responsible road/building-access/depot/site assets over manufacture, installation, maintenance, replacement and retirement. Native manufacture quantity has only verified gate coverage, allocated by same-cohort all-user useful duty; not whole-life service. Separate real subcontract move, packing, hoist, carrier or treatment provider coverage and replace exact covered cells once, no assembly/initial-part or provider/foreground duplication."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic
      applies_to: "moving_engagement"
      rule: "Expand every actual conditional material, asset, fuel, service, waste and pollutant into a separate row with one existing parent process, direction/type, actual identity/state/gate/medium, native unit/quantity, verified UUID or registered unresolved identity, parent-owned protocol, source and supported calculation. Missing required quantities or states are incomplete, not zero."
      source_ids:
        - ghg-product-2011
