  calculation_rules:
    - id: normalize
      applies_to: "moving_engagement"
      rule: "q_x = allocated_native_quantity_x / N after unique duty/provider/stock closure; N > 0; completed final engagement = 1 Item(s). Internal packing task quantities reconcile at both nodes and are not additional final outputs."
      inputs:
        - "Native records"
        - "all-user shares"
        - "equivalent completed N"
      output: "Per-reference native quantity"
      source_ids:
        - ghg-product-2011
    - id: asset_life
      applies_to: "moving_engagement"
      rule: "attributed_asset = native_asset_quantity * attributed_same_cohort_useful_duty / positive_total_all_user_same_cohort_useful_duty; then divide by N. Same rule applies separately to each reusable packaging cohort, with actual washing/repair/loss and retirement kept distinct."
      inputs:
        - "Actual same-asset native quantity and positive all-user duty"
      output: "Allocated manufacturing coverage only"
      source_ids:
        - ghg-product-2011
    - id: custody_closure
      applies_to: "moving_engagement"
      rule: "Customer goods are custody inventory, not mover-purchased manufacturing inputs. Close opening custody plus actual pickup against accepted handoff, actual outward return, discarded items/releases and closing custody, with each item/transfer/disposition exclusive. Damage is a condition, not automatically disposal or replacement manufacture; retain actual repair/return/discard/resupply responsibility and all failed/rework duty."
      inputs:
        - "Item and transfer ids"
        - "acceptance and actual dispositions"
      output: "Exclusive custody stock/transfer closure"
      source_ids:
        - ghg-product-2011
