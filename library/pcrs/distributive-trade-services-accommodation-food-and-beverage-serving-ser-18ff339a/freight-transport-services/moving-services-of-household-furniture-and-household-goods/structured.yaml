allocation_rules:
  - rule_id: subdivide
    applies_to: "moving_engagement"
    rule: "Subdivide measured work by actual engagement, journey/room/stair/access and packing task. Enumerate other households, commercial moves and other products sharing resources; office removal is outside this PCR output but remains an all-user allocation consumer. Avoid allocation where direct separation works."
    source_ids:
      - ghg-product-2011
  - rule_id: causal
    applies_to: "moving_engagement"
    rule: "Allocate indivisible shared burdens using evidenced causal workload: actual time/access/equipment duty for handling and packing, segment load-space/mass/distance constraints for actual road haul as supported. No universal equal per household, item, kg or revenue share. Reconcile shares across all users, then normalize once. Justify and test any alternative method where physical causality cannot be established."
    source_ids:
      - ghg-product-2011
  - rule_id: reuse_life
    applies_to: "moving_engagement"
    rule: "For returnable box/blanket/device cohorts use actual useful turns/duty, attrition, repair/washing, replacement and retirement; For the declared custody boundary, opening stock plus acquisition and actual external inward returns equals actual outward customer/other-boundary transfers, discard, physical losses and closing stock across all retained locations. Internal issue/return movements change location only and do not add external consumption; deployed retained devices stay inside stock. New manufacture life-share and already included reusable-provider service are exclusive. No universal cycle count, zero-burden used asset or avoided recycling credit."
    source_ids:
      - ghg-product-2011
  - rule_id: normalize
    applies_to: "moving_engagement"
    rule: "N is positive actual fulfilled equivalent engagements under the predeclared task-completion criterion. One engagement with several vans, item groups, visits or stages is not multiplied by them. Failed, aborted or reworked duty retains burdens but not a second completed output. Packing-only/in-house/road strata with differing obligations are separately reported or transparently distributed; not universally comparable Count services. N=0 gives no finite intensity."
    source_ids:
      - ghg-product-2011
