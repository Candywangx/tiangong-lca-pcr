      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_work | marine_tanker | Verify full crude and other liquid gas tanker coastal/ocean scope, actual phase/quality and all ship shore/STS duties; correct sea/inland/container/independent processing distinctions. Only original accepted completed cargo portions or independently contemporaneously accepted amended service enter W; no later fuel/lost cargo earlier automatic work, deadweight/ballast/heel/empty/duplicate output. | ghg-product-2011 |\n| cargo_fuel_fates | marine_tanker | Verify coupled component/species custody and actual fuel/energy ledgers, cargo withdrawal upstream once regardless title/purchaser, no whole cargo manufacturing input. Phase change/returned/reliquefied/retained/fuel/destroyed/waste/direct release mutually exclusive; exhaust chemical/element balance distinct original fuel mass, methane slip/nonmethane VOC compartments actual. | ghg-product-2011 |\n| native_lifecycle_water | marine_tanker | Require actual state/gate/native property unit, final TIDAS t*km alias preserved scale, same asset all user full phases and provider covered cells once. Ballast/slop/bilge/treatment water and constituent receiver paths separate; actual seawater not tap water, captured waste not same direct release. | ghg-product-2011 |\n| parity_quality | marine_tanker | Align EN ZH/projection references/rows/rules/formulas/actual conditional routes and source limits. Actual measurement/reviewed applicable model needs calibration, independent QA, uncertainty; no invented factors/quantities/ranges, missing incomplete not zero. Checker/native property pass not service UUID/scientific review. | ghg-product-2011 |\n| atomic_marine_tanker | marine_tanker | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
