system_boundary:
  rules:
    - rule_id: scope
      applies_to: "marine_tanker"
      rule: "Cover coastal and transoceanic water freight carriage of crude oil and other bulk liquids/gases in special tankers, including actual natural gas/methane/LNG, LPG, refined petroleum, chemicals and compatible food or other bulk liquids. Actual ambient/heated/refrigerated/cryogenic/pressurized containment, propulsion and ship/shore or ship-to-ship transfer configurations are conditional; neither all tankers are oil-only nor all tankers refrigerated. Exclude inland-waterway-only freight, intermodal tank-container or packaged cargo service, dry bulk, independent pipeline/land/air transport, cargo production/refining/liquefaction/trade, bare vessel hire and independent floating storage or processing functions. Actual integrated conditioning needed for this carriage remains included, with independently supplied terminals/providers scoped once."
      source_ids:
        - unsd-cpc3-65212
    - rule_id: marine_duties
      applies_to: "marine_tanker"
      rule: "Declare actual vessel/tank/cargo/voyage-leg/port/terminal responsibility from custody/loading to accepted handover/discharge, including any STS interface. Retain actual main propulsion, auxiliaries/hotel loads, manoeuvring, sea passage, anchorage/berth waiting, cargo pumps/compressors, ballasting/deballasting, empty/ballast reposition, failed/diverted/rescue and cleaning/changeover duty across all cargo/users and periods. Actual speed/draft/weather/sea-state/route/deviation and machinery topology govern measured or reviewed models, not universal tonne-km intensity. Vessel time/voyage charter, terminal, shore power/heat, tug, cargo/vapour handling or treatment providers replace exact native covered cells once; independent storage/regasification/production and nonmarine freight remain separately identified functions."
      source_ids:
        - imo-compendium-events-fuels
        - ghg-product-2011
    - rule_id: tanker_condition
      applies_to: "marine_tanker"
      rule: "For each actual crude/refined/chemical/food liquid or gas declare containment/coating/segregation/quality, loading/discharge/stripping pumps, temperature/pressure, cargo heating/cooling/refrigeration/reliquefaction and vapour/inerting/gas-freeing route. Supplied shore heat/power, own boiler/engine waste heat and purchased versus internally generated inert gas have distinct native coverage; do not count recovered heat or internally generated gas as a second purchased input. Include actual tank/hose/manifold cleaning/previous-next cargo campaigns, slop/bilge/ballast capture, scrubbers/abatement, sewage/garbage and actual reception/treatment responsibilities. Keep cargo tanks/slops versus ballast/bilge/bunker compartments separate. No assumed inert-gas dose, boiloff/vent/heat/cold duty, cargo contamination rate, mandatory prewash or discharge allowance for every service."
      source_ids:
        - imo-igc-overview
        - imo-voc-shipshore
        - imo-chemical-pollution
        - imo-oiltanker-operations
        - ghg-product-2011
    - rule_id: cargo_custody
      applies_to: "marine_tanker"
      rule: "Customer cargo is custody stock, not a newly consumed whole-cargo manufacture input. By actual material/species/lot/tank/period close opening plus actual inward cargo/vapour receipts into mutually exclusive accepted outward delivery, actual outward cargo/vapour return, actual custody withdrawal for fuel or destruction/abatement, outgoing discarded cargo/slop constituents, direct release and closing liquid/vapour/retained heel stocks. Retained heel belongs closing stock only; actual outward returns have unique transfer ids. Phase change/BOG formation, internal vapour return, reliquefaction and crude-oil wash circulation do not by themselves lose or produce mass. Component balances distinguish cargo, cleaning water/chemicals and inert gas; where water content changes use each observation measured wet-basis w and M_dry=M_wet*(1-w) or evidenced compatible basis conversion, and include actual external water additions/uptake, drainage/evaporation and stream water without forcing equal wet masses. Destruction/combustion withdrawal is measured as original cargo species mass; chemically changed exhaust has its own reaction/element balance, not a requirement that CO2 mass equal fuel mass. Residue/slop/heel is state, not an extra mass term."
      source_ids:
        - ghg-product-2011
    - rule_id: cargo_fuel_vapour
      applies_to: "marine_tanker"
      rule: "Separate purchased bunker/auxiliary fuels from cargo-derived fuel. Only actual metered cargo/BOG withdrawn and consumed for propulsion, generators, boilers or another real energy duty enters its compatible native fuel/energy supply input with attributable upstream supply burden ONCE, regardless of customer title or prior purchase. Do not input original entire cargo manufacture or charge the same fuel both as whole cargo and new bunker supply. Link actual cargo withdrawal and fuel inventory by species/state/mass/energy and source/gate; no free customer fuel, automatic substitution credit or nominal BOG rate. Vapour returned to shore, retained/reliquefied cargo, actual venting, actual flare/gas-combustion destruction and fuel combustion are exclusive actual fates. Gas-combustion/flare without useful energy is an actual destruction/abatement duty, not assumed propulsion fuel or an exported energy credit. Distinguish unburned cargo venting, engine methane slip and combustion CO2/other species by actual source, chemical basis and receiving medium; methane is not interchangeable with total non-methane VOC."
      source_ids:
        - imo-compendium-events-fuels
        - imo-voc-shipshore
        - ghg-product-2011
    - rule_id: work_gate
      applies_to: "marine_tanker"
      rule: "W_tkm = sum(m_eligible_kg_s * d_eligible_km_s) / 1000. Use actual qualified completed net cargo portions and actual unique eligible sea-leg distance, with original predeclared completion/condition/handover or independently documented contemporaneous accepted segment/amended service. Earlier sailing of later-failed, lost or fuel-withdrawn cargo is not automatically successful cargo work; no retrospectively shrinking failed scope. Exclude cargo consumed as fuel, other cargo, vessel lightship/tank/equipment, deadweight capacity, ballast, retained heel not delivered, empty/reposition/anchorage/berth loops and duplicate transshipment bills from output. Retain their actual attributable burdens. Record actual navigated route/deviation, mass/phase/quality and comparable strata; positive W only, no nominal capacity/density/boiloff factors or output from ship motion alone."
      source_ids:
        - ghg-product-2011
    - rule_id: water_waste_fates
      applies_to: "marine_tanker"
      rule: "Actual seawater/other ballast intake, retention, treatment and discharge are site/sea-region/quality/salinity/period-specific environmental transfers, not purchased tap water or cargo transport output. Record treatment electricity/chemicals/assets and actual captured sludge or released substances/organisms where evidenced. Preserve compartment and species/medium and distinguish treated discharged water, direct pollutant release and collected reception waste; no automatic zero discharge, universal treatment efficiency or ecological benefit credit. Bilge/slop/scrubber/sewage routes likewise follow actual physical capture/receiver and cannot be both outgoing waste and the same direct environmental release."
      source_ids:
        - imo-chemical-pollution
        - imo-oiltanker-operations
        - ghg-product-2011
    - rule_id: assets_providers
      applies_to: "marine_tanker"
      rule: "Retain each actual marine tanker hull/containment/insulation/coating, propulsion/auxiliary/boiler, cargo pump/compressor/reliquefaction/inerting/cleaning/ballast-treatment system and berth/jetty/manifold/tank infrastructure over manufacture/installation, maintenance/drydock/replacement and retirement/recycling. Native ship/equipment manufacturing covers its verified gate only; attribute same-cohort quantities using positive total all-user same-asset useful duty, complete uncovered lifecycle phases once and distinguish initial parts from assembly. Actual charter/provider covered vessel machinery/energy/lifecycle cells cannot also be foreground-owned assets. No universal ship life/drydock cycle/steel recovery credit or whole terminal per voyage."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic
      applies_to: "marine_tanker"
      rule: "Expand each actual bunker/cargo-derived fuel, energy/water/inert/cleaner/chemical, asset/provider, slop/residue/waste and pollutant into one actual state/gate/native unit/direction/type/receiver row with own-process protocol and source/model, verified UUID or row-addressable unresolved identity. Preserve cargo versus fuel, oil/gas phase and actual substance, origin, mass versus C/N/S, receiving air/water/soil/sea-region compartments; pressure-temperature-density conversions require actual composition/state evidence. Missing actual measurements/identity are incomplete, not zero."
      source_ids:
        - ghg-product-2011
