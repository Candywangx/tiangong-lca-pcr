      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| subdivide | marine_tanker | Directly measure/subdivide actual vessel/voyage leg/cargo/tank/port, main/auxiliary propulsion and cargo-specific pumping/heating/cooling/vapour/cleaning duties. Enumerate all intended freight/care/independent supplied outputs, their handoffs and all cargo/users; transported cargo is custody, not a newly manufactured co-product. | ghg-product-2011 |\n| causal | marine_tanker | Justify shared marine propulsion/duty by actual physical displacement/load/space/capacity and voyage conditions with reviewed model or measurements, not nominal deadweight or universal fuel per tkm. Cargo-specific temperature/pressure/reliquefaction/vapour/cleaning follows actual equipment/time/state/throughput causes, not blanket tonne km shares. Reconcile all-user/provider shares once, justify/test alternatives when physical causality unavailable. | ghg-product-2011 |\n| life_period | marine_tanker | Retain each actual marine tanker hull/containment/insulation/coating, propulsion/auxiliary/boiler, cargo pump/compressor/reliquefaction/inerting/cleaning/ballast-treatment system and berth/jetty/manifold/tank infrastructure over manufacture/installation, maintenance/drydock/replacement and retirement/recycling. Native ship/equipment manufacturing covers its verified gate only; attribute same-cohort quantities using positive total all-user same-asset useful duty, complete uncovered lifecycle phases once and distinguish initial parts from assembly. Actual charter/provider covered vessel machinery/energy/lifecycle cells cannot also be foreground-owned assets. No universal ship life/drydock cycle/steel recovery credit or whole terminal per voyage. | ghg-product-2011 |\n| normalize | marine_tanker | q_x = allocated_native_quantity_x / W_tkm for positive eligible W_tkm and reference1tkm. All attributable ballast/empty/reposition, waiting/port/hotel/cargo-care/cleaning/failure/destruction duties retain burdens even without eligible cargo work. Subdivide/evidence cargo-specific thermal/vapour/cleaning and shared ship duty before normalization; equivalent cargo/state/quality/route and actual distributions constrain comparison. | ghg-product-2011 |\n\n"
