  calculation_rules:
    - id: eligible_work
      applies_to: "marine_tanker"
      rule: "W_tkm = sum(m_eligible_kg_s * d_eligible_km_s) / 1000. Use actual qualified completed net cargo portions and actual unique eligible sea-leg distance, with original predeclared completion/condition/handover or independently documented contemporaneous accepted segment/amended service. Earlier sailing of later-failed, lost or fuel-withdrawn cargo is not automatically successful cargo work; no retrospectively shrinking failed scope. Exclude cargo consumed as fuel, other cargo, vessel lightship/tank/equipment, deadweight capacity, ballast, retained heel not delivered, empty/reposition/anchorage/berth loops and duplicate transshipment bills from output. Retain their actual attributable burdens. Record actual navigated route/deviation, mass/phase/quality and comparable strata; positive W only, no nominal capacity/density/boiloff factors or output from ship motion alone."
      inputs:
        - "Actual qualified completed net cargo kg and unique eligible sea-leg km"
      output: "W_tkm"
      source_ids:
        - ghg-product-2011
    - id: normalize
      applies_to: "marine_tanker"
      rule: "q_x = allocated_native_quantity_x / W_tkm for positive eligible W_tkm and reference1tkm. All attributable ballast/empty/reposition, waiting/port/hotel/cargo-care/cleaning/failure/destruction duties retain burdens even without eligible cargo work. Subdivide/evidence cargo-specific thermal/vapour/cleaning and shared ship duty before normalization; equivalent cargo/state/quality/route and actual distributions constrain comparison."
      inputs:
        - "Actual allocated native quantities"
        - "positive W_tkm"
      output: "Native quantities per declared 1 tkm"
      source_ids:
        - ghg-product-2011
    - id: cargo_phase_stock
      applies_to: "marine_tanker"
      rule: "Customer cargo is custody stock, not a newly consumed whole-cargo manufacture input. By actual material/species/lot/tank/period close opening plus actual inward cargo/vapour receipts into mutually exclusive accepted outward delivery, actual outward cargo/vapour return, actual custody withdrawal for fuel or destruction/abatement, outgoing discarded cargo/slop constituents, direct release and closing liquid/vapour/retained heel stocks. Retained heel belongs closing stock only; actual outward returns have unique transfer ids. Phase change/BOG formation, internal vapour return, reliquefaction and crude-oil wash circulation do not by themselves lose or produce mass. Component balances distinguish cargo, cleaning water/chemicals and inert gas; where water content changes use each observation measured wet-basis w and M_dry=M_wet*(1-w) or evidenced compatible basis conversion, and include actual external water additions/uptake, drainage/evaporation and stream water without forcing equal wet masses. Destruction/combustion withdrawal is measured as original cargo species mass; chemically changed exhaust has its own reaction/element balance, not a requirement that CO2 mass equal fuel mass. Residue/slop/heel is state, not an extra mass term."
      inputs:
        - "Actual component/species stocks/transfers/withdrawals/phases/water"
      output: "Exclusive cargo/fuel withdrawal/receiver closure"
      source_ids:
        - ghg-product-2011
    - id: cargo_fuel_once
      applies_to: "marine_tanker"
      rule: "Separate purchased bunker/auxiliary fuels from cargo-derived fuel. Only actual metered cargo/BOG withdrawn and consumed for propulsion, generators, boilers or another real energy duty enters its compatible native fuel/energy supply input with attributable upstream supply burden ONCE, regardless of customer title or prior purchase. Do not input original entire cargo manufacture or charge the same fuel both as whole cargo and new bunker supply. Link actual cargo withdrawal and fuel inventory by species/state/mass/energy and source/gate; no free customer fuel, automatic substitution credit or nominal BOG rate. Vapour returned to shore, retained/reliquefied cargo, actual venting, actual flare/gas-combustion destruction and fuel combustion are exclusive actual fates. Gas-combustion/flare without useful energy is an actual destruction/abatement duty, not assumed propulsion fuel or an exported energy credit. Distinguish unburned cargo venting, engine methane slip and combustion CO2/other species by actual source, chemical basis and receiving medium; methane is not interchangeable with total non-methane VOC."
      inputs:
        - "Actual cargo BOG fuel consumed quantity/native state/upstream coverage"
      output: "Actual consumed fuel quantity/upstream once and exclusive fates"
      source_ids:
        - ghg-product-2011
    - id: asset_life
      applies_to: "marine_tanker"
      rule: "attributed_asset = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty; then divide W_tkm, verified manufacturing coverage only and uncovered full phases once."
      inputs:
        - "Actual same asset native quantity and positive all user duty"
      output: "Attributed native manufacturing quantity"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: strata
      applies_to: "marine_tanker"
      requirement: "Enumerate all actual vessel/tank/cargo/phase/quality/temperature pressure/propulsion/route port/period/provider contributors. Aggregate only equivalent declared cargo work and state using actual weights/distributions; no universal average crude/LNG/food/chemical or ballast/laden duty comparison."
      evidence: "Contributor actual work/state/phase weights and coverage"
    - id: completeness
      applies_to: "marine_tanker"
      requirement: "Expand each actual bunker/cargo-derived fuel, energy/water/inert/cleaner/chemical, asset/provider, slop/residue/waste and pollutant into one actual state/gate/native unit/direction/type/receiver row with own-process protocol and source/model, verified UUID or row-addressable unresolved identity. Preserve cargo versus fuel, oil/gas phase and actual substance, origin, mass versus C/N/S, receiving air/water/soil/sea-region compartments; pressure-temperature-density conversions require actual composition/state evidence. Missing actual measurements/identity are incomplete, not zero."
      evidence: "Actual row level native/source/coverage/stock/fate ledger"
    - id: uncertainty
      applies_to: "marine_tanker"
      requirement: "No invented bunker mix, BOG/vent/slip/capture/heat/cold/inert dose, ballast/load/speed/weather/ship-life/discharge factors or ranges. Calibrated actual measurements or reviewed applicable machinery/cargo/route models with species/chemical basis, independent QA and uncertainty required. Sources give bounded mechanism questions, not universal defaults or current legal compliance certificate."
      evidence: "Calibration/applicability/sampling/independent checks/sensitivity"
validation_rules:
  - rule_id: scope_work
    applies_to: "marine_tanker"
    rule: "Verify full crude and other liquid gas tanker coastal/ocean scope, actual phase/quality and all ship shore/STS duties; correct sea/inland/container/independent processing distinctions. Only original accepted completed cargo portions or independently contemporaneously accepted amended service enter W; no later fuel/lost cargo earlier automatic work, deadweight/ballast/heel/empty/duplicate output."
    source_ids:
      - ghg-product-2011
  - rule_id: cargo_fuel_fates
    applies_to: "marine_tanker"
    rule: "Verify coupled component/species custody and actual fuel/energy ledgers, cargo withdrawal upstream once regardless title/purchaser, no whole cargo manufacturing input. Phase change/returned/reliquefied/retained/fuel/destroyed/waste/direct release mutually exclusive; exhaust chemical/element balance distinct original fuel mass, methane slip/nonmethane VOC compartments actual."
    source_ids:
      - ghg-product-2011
  - rule_id: native_lifecycle_water
    applies_to: "marine_tanker"
    rule: "Require actual state/gate/native property unit, final TIDAS t*km alias preserved scale, same asset all user full phases and provider covered cells once. Ballast/slop/bilge/treatment water and constituent receiver paths separate; actual seawater not tap water, captured waste not same direct release."
    source_ids:
      - ghg-product-2011
  - rule_id: parity_quality
    applies_to: "marine_tanker"
    rule: "Align EN ZH/projection references/rows/rules/formulas/actual conditional routes and source limits. Actual measurement/reviewed applicable model needs calibration, independent QA, uncertainty; no invented factors/quantities/ranges, missing incomplete not zero. Checker/native property pass not service UUID/scientific review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_marine_tanker
    applies_to: "marine_tanker"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
