      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual cargo composition/state,receipt custody and carrier duty,with real pipeline/terminal native provider gates. |\n| starting_condition_role | Foreground collection interface,not zero upstream supply or asset burden. |\n| product_classification_scope | CPC 3.0 65139 |\n| recursive_input_rule | Use actual same-function native subcontract demand once;expand required uncovered stages,no purchased self-service or extra final internal-transfer output. |\n| upstream_dataset_requirement | Actual cargo basis,function,gates,technology,geography,period,phases and native unit compatible;complete missing lifecycle. |\n| disclosure | actual_named_cargo_chemical_composition_grade_and_phase; declared_cargo_mass_basis_before_delivery; actual_slurry_solids_moisture_and_carrier_medium_separation; actual_receipt_delivery_custody_gates_and_accepted_quality; actual_pipeline_route_distance_elevation_pressure_temperature_time; batch_or_continuous_period_and_coherent_accepted_delivered_mass_M; linepack_tanks_recirc_start_stop_flush_pig_failure_return_duties; actual_native_pump_compressor_thermal_energy_and_provider_coverage; real_carrier_conditioning_preparation_dewatering_handover; all_user_same_asset_pipe_station_terminal_life_sites_periods; actual_component_water_species_stock_fate_receiver_and_carbon_origin; independent_capture_manufacture_storage_use_interfaces |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_scope | pipeline_delivery | Use full actual other-chemical, coal-slurry and other n.e.c. pipeline carriage at true receipt/delivery gates. Determine the transported product classification independently of a source example; gas or liquid phase does not make every chemical natural gas or petroleum. Steam/water mains remain outside; actual carrier medium is not an independent water-distribution product by default. | unsd-other-pipeline-2025 |\n| cargo_basis_and_gate | pipeline_delivery | Define original actual cargo composition/grade/state, mass basis, receipt/delivery custody, quality, pressure/temperature and chronological amendments. For slurry or solution distinguish contractual mixture from constituent/solids cargo and carrier medium with measured moisture/composition. Accepted delivery M includes only actual accepted cargo on that predeclared basis. If the original genuinely contracted accepted mixture includes water as its required constituent, include its actual measured constituent water once with that mixture; never add standalone makeup/flush/recirculation water as independent delivered output or include carrier water in a solids-only basis. Linepack,nominations,invoices and off-spec returns are not accepted delivery; dilution or basis changes cannot manufacture output. |  |\n| slurry_conditioning | pipeline_delivery | Record actual solid and liquid states through required carrier preparation, mixing/suspension, pumping, tanks, separation/dewatering, medium return or disposal at the actual handover. These duties are conditional on the real service; neither grinding/dewatering nor water return is universal. Independent goods formulation, mining, refining or downstream combustion is outside this transport output, while included carrier conditioning inputs/residuals cannot disappear. | ota-slurry-1978 |\n| actual_network_duties | pipeline_delivery | Preserve actual pipe segments, pumps/compressors, auxiliary heating/cooling, pressurization, agitated tanks, metering, pigging, flushing, commissioning/fill, standby, start/stop, blocked/off-spec/failure/recovery and return-medium duties. Recirculated cargo or internally recovered pressure/energy is not fresh cargo delivery or external energy supply. Real chemical compatibility, phase and technology determine actual inputs; no default pressure, slurry ratio or energy intensity. | doe-hydrogen-pipeline |\n| ownership_and_providers | pipeline_delivery | Assign one owner to each actual carrier/shipper/terminal/conditioning/medium-treatment event, supply, asset and site/period cell. Compatible whole native provider results replace exact covered cells once; complete required missing stages. CCS transport interfaces exclude independent capture/storage unless a separately declared function is actually supplied, with no automatic storage credit. Cargo title or purchased throughput alone does not establish provider lifecycle coverage. |  |\n| assets_all_user_life | pipeline_delivery | Include actual pipeline/right-of-way works, coatings/cathodic protection, pump/compressor/driver/thermal systems, tanks, valves, controls and terminal/conditioning assets at native manufacture/initial/replacement/maintenance/retirement gates and positive same-asset all-user useful lifetime demand. Every real served commodity/customer/function/site/period is part of its evidence; actual throughput, work or other compatible duty replaces nominal capacity or monetary fees. |  |\n| species_medium_fates | pipeline_delivery | Maintain actual cargo-component, carrier-medium, chemical/cleaning and native-energy ledgers. Separate retained linepack/stock, internal return/recovery, genuine external recovered product, collected wastewater/sludge/waste, and actual substance-specific air/water/soil release. A lost cargo component or unknown meter imbalance is not automatically an elementary emission; transported CO2 is not atmospheric CO2 until actually released with known origin and receiver. | phmsa-product-context |\n\n"
