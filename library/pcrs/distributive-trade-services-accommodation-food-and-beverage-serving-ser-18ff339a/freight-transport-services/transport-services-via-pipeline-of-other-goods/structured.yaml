  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "I_x = A_x / M, where A_x is the actual native quantity attributed to the comparable accepted-delivery cohort after direct and causal all-user attribution; M is positive actual accepted cargo kg on the predeclared basis. M=0 retains burden without finite intensity."
      inputs:
        - A_x
        - M
      output: "native inventory per kg accepted cargo delivery"
      source_ids: []
    - id: cargo_basis
      applies_to: "reference and component ledgers"
      rule: "M = sum(m_accepted_i * f_basis_i) for actual independent accepted delivery events/periods, where m_accepted_i is measured delivered mixture mass and f_basis_i is the actual measured fraction belonging to the predeclared contracted cargo basis; f_basis=1 only when the accepted mixture itself is that cargo. Actual native kg measurement may be used directly. Actual measured constituent water is included once only for the original genuinely contracted accepted mixture at required composition/quality,not added separately;solids/constituent-only bases exclude carrier water. No dilution or retrospective basis switching. No default moisture/solids/density factor,standalone makeup/flush/recirculation water or rejected/retained mass enters M."
      inputs:
        - m_accepted_i
        - f_basis_i
        - actual_native_kg
        - M
      output: "accepted cargo kg on declared basis"
      source_ids: []
    - id: supplier_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s, where q_u is compatible provider inventory per native unit u,D_u actual same-unit demand,and s actual evidenced cohort/all-user share. Replace exact covered cells before A_x/M once;cargo kg does not automatically convert to volume,energy or tonne-km."
      inputs:
        - q_u
        - D_u
        - s
        - M
      output: "attributed native provider inventory"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life, with actual native delivered Q_asset and compatible same-asset duties U_studied/U_life. U_life is positive documented all-user useful lifetime duty. I_asset = A_asset / M once;close replacements/maintenance/retirement separately."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - M
      output: "native asset quantity per kg delivery"
      source_ids: []
    - id: component_custody
      applies_to: "each actual cargo component and carrier medium"
      rule: "Opening + received_external = closing + accepted_external_delivery + returned_external + recovered_external + actual_waste_transfer + evidenced_direct_release + actual_consumed_or_transformed + unresolved_residual, on each compatible actual component/native basis. Internal transfers/recirculation cancel across the declared boundary. Terms are mutually exclusive;transformation products require their own actual component relation,not creation/destruction by formula. Actual cargo withdrawn for fuel belongs to its evidenced consumed/transformed term,not accepted cargo delivery,and requires upstream fuel supply at its owner once after coverage reconciliation. Stock including internal recovery is not additional recovered output;unknown residual is investigated,not assumed leak/waste/evaporation."
      inputs:
        - Opening
        - received_external
        - closing
        - accepted_external_delivery
        - returned_external
        - recovered_external
        - actual_waste_transfer
        - evidenced_direct_release
        - actual_consumed_or_transformed
        - unresolved_residual
      output: "reconciled component and medium ledger"
      source_ids: []
  data_quality_requirements:
    - id: basis_acceptance
      applies_to: "reference output"
      requirement: "Original and genuine amended composition/state/cargo basis,calibrated delivery/sampling,real gates,distance/pressure/temperature/time/quality and accepted mass substantiate compatible M. Pump totals,nominations,invoice,capacity or linepack cannot replace acceptance evidence."
      evidence: "cp_service;cp_material"
    - id: atomic_route
      applies_to: "every actual exchange"
      requirement: "Every real conditional branch must expand into atomic row identity/type/direction/state/native quantity/property/unit and own-process collection/source provenance. Absence needs actual affirmative evidence;unknown is not zero."
      evidence: "cp_operation;cp_material;cp_maintenance;cp_emissions"
    - id: provider_life
      applies_to: "providers and assets"
      requirement: "Document exact covered phase/event/site/period cells,all real consumers and positive same-asset lifetime duty with forecasts/sensitivity. Complete uncovered construction,initial/replacement/maintenance/retirement and carrier conditioning without duplicate whole provider results."
      evidence: "cp_assets;cp_provider"
    - id: sites_periods
      applies_to: "shared pools"
      requirement: "Index each actual pipe/terminal/conditioning site,driver and reporting/lifecycle period with all intended service outputs and native resource users. Aggregate attributed raw quantities before division by coherent M,not unlike intensity averages."
      evidence: "cp_service;cp_operation;cp_assets"
    - id: fates
      applies_to: "cargo medium and releases"
      requirement: "Trace actual component/moisture/carrier-medium,linepack/stock,return/recovery/waste/direct-release owner and receiver with compatible native units and uncertainty. Substance identity,carbon origin,phase and receiver medium matter;unknown imbalance is not automatic release."
      evidence: "cp_material;cp_emissions"
validation_rules:
  - rule_id: reference_basis
    applies_to: "pipeline_delivery"
    rule: "Verify accepted cargo delivery M on its predeclared measured mixture/constituent/solids basis at actual service gates and quality. Reference1kg is transport service, not manufactured goods. For an original genuinely contracted accepted mixture,include its actual measured constituent water once at required composition/quality;for solids/constituent-only bases exclude carrier water. Standalone flush/makeup/recirculation water,linepack or rejected stock cannot become independent/additional output;no opportunistic dilution/basis switch. Actual distance/state/phase/quality strata must be compatible and M positive for finite intensity."
    source_ids: []
  - rule_id: scope_and_conditioning
    applies_to: "pipeline_delivery"
    rule: "Verify full other-chemical/coal-slurry/other n.e.c. scope and actual all-phase technologies without importing natural-gas/petroleum/steam/water-mains categories or independent manufacturing/capture/storage. Necessary real carrier conditioning, pressure/thermal, slurry/dewater and terminal interfaces require actual supplies, states, residues and responsibility."
    source_ids: []
  - rule_id: stock_and_fates
    applies_to: "pipeline_delivery"
    rule: "Reconcile actual cargo components, carrier media, tanks/linepack, internal return/recirculation, external recovery, rejected/returned material, collected waste and substance/receiver-specific release without duplicate same-gate transfers. Cargo CO2 or water is not automatically environmental emission; unknown imbalance remains investigated, not inferred as leak, evaporation or combustion."
    source_ids: []
  - rule_id: native_life_provider
    applies_to: "pipeline_delivery"
    rule: "Verify actual native pump/compressor/thermal/auxiliary energy,supply/stock/use and internal recovery,including cargo actually withdrawn as fuel and compatible upstream fuel supply once at its true owner after provider coverage; whole provider cells replaced once and uncovered lifecycle complete. Check real contributing sites, all served users, positive same-asset lifetime duty and disjoint phases; M=0 retains burden without finite intensity."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "pipeline_delivery"
    rule: "Every actual atomic exchange needs a real identity/type/direction/state/native quantity/property/unit and source/receiver gate with same-process protocol or registered unresolved requirement. Verify aligned bilingual reference/cards/methods/profile and fresh generated projection. Target pass does not establish exact UUID, operating safety, scientific review or publication readiness."
    source_ids: []
  - rule_id: atomic_pipeline_delivery
    applies_to: "pipeline_delivery"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified other-goods pipeline delivery inventory for downstream process/lifecyclemodel projections"
  allowed_use: "Qualified actual accepted delivery mass of specified other goods with harmonized cargo basis,route/gates,state,pressure/temperature/time/quality and complete attributable lifecycle after required identity/data review."
  excluded_use: "Unqualified kg across unlike cargo or routes;ordinary goods manufacture,gas/petroleum/steam/water-mains categories;internal circulation/linepack as output;automatic carbon-storage or recovered-water credit;unresolved facts treated as zero."
  required_metadata: "actual_named_cargo_chemical_composition_grade_and_phase; declared_cargo_mass_basis_before_delivery; actual_slurry_solids_moisture_and_carrier_medium_separation; actual_receipt_delivery_custody_gates_and_accepted_quality; actual_pipeline_route_distance_elevation_pressure_temperature_time; batch_or_continuous_period_and_coherent_accepted_delivered_mass_M; linepack_tanks_recirc_start_stop_flush_pig_failure_return_duties; actual_native_pump_compressor_thermal_energy_and_provider_coverage; real_carrier_conditioning_preparation_dewatering_handover; all_user_same_asset_pipe_station_terminal_life_sites_periods; actual_component_water_species_stock_fate_receiver_and_carbon_origin; independent_capture_manufacture_storage_use_interfaces"
  required_quality_disclosure: "Cargo basis and acceptance,native provider coverage,actual missing data,causal pools,shared lifetime forecasts,component/medium stock-fate closure and uncertainty."
  update_trigger: "Changed actual cargo/phase/mass basis,gates/quality,network/driver/thermal or conditioning,provider coverage,asset life/allocation or actual species/fate."
