allocation_rules:
  - rule_id: direct_first
    applies_to: "pipeline_delivery"
    rule: "Assign measured dedicated commodity/batch/period and conditioning/terminal resources directly before residual common-pool attribution. All actual independently supplied cargo deliveries and other services sharing assets or native resources must be enumerated. A common kg label does not make different cargo bases, routes, phases or pressure/quality obligations comparable."
    source_ids:
      - ghg-product-2011
  - rule_id: causal_pools
    applies_to: "pipeline_delivery"
    rule: "Use supported actual causal work, compatible mass-distance, volume/time, pressure/elevation/thermal duty or metered native resource drivers for the real serving pool. Keep carrier-medium return, start/stop, line filling, standby, cleaning and failed duties in the evidenced serving pool once. Nominal pipe capacity, additive unlike commodity units, tariffs, equal fractions or default solids-to-mixture factors are not allocation evidence."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "pipeline_delivery"
    rule: "Attribute native delivered asset quantity Q_asset by actual studied compatible duty U_studied divided by positive documented same-asset all-user lifetime duty U_life, then divide by M once. Include actual other commodities, customers, transport/storage functions and periods where served, with initial manufacture, replacements, maintenance and retirement disjoint. Do not assign full construction to each batch, kg or customer."
    source_ids: []
  - rule_id: reject_recovery
    applies_to: "pipeline_delivery"
    rule: "Retain actual off-spec, failed, returned, lost or retained cargo/medium duties and producing periods with real owner and receiver. Actual reprocessing/recovery transfer, replacement cargo responsibility, waste treatment and direct release are distinct; no automatic coal/chemical production, water reuse, avoided-product or carbon-storage credit. Original-to-amended acceptance needs real chronology and comparable output, not a postfailure denominator change."
    source_ids: []
