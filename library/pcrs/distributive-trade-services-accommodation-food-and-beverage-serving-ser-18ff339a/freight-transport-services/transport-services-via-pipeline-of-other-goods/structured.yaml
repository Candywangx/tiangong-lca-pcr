product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.transport-services-via-pipeline-of-other-goods"
  classification_refs: "CPC 3.0 65139; exact"
  covered_products: "This PCR covers pipeline transport of other chemical products, coal slurry and other goods not elsewhere classified, in their actual gaseous, liquid, slurry or other qualifying state. The full category is not restricted to one chemical, water-based coal slurry or one pumping technology. Actual cargo composition, phase, carrier medium, pipeline configuration, route, distance, elevation, pressure, temperature, duration, required quality and accepted custody gates define the service. Physical examples from U.S. pipeline sources illustrate real chemical states; they do not override CPC classification."
  excluded_products: "Exclude pipeline services assigned to the natural-gas and crude/refined-petroleum subclasses, distribution of steam or water through mains, independent nonpipeline transport, and independent cargo manufacture, capture, storage, sequestration or use beyond the actual transport interface. Necessary carrier-accountable pressure/thermal support, slurry preparation, suspension, handling, dewatering or terminal duty remains included when it belongs to the actual promised carriage handover. A CCS cargo transfer is transport only; it does not automatically import capture/storage burdens or confer permanent-storage or avoided-emission credit."
  representative_product: "Pipeline delivery service for actual specified other goods"
  production_route: "Actual qualified pipeline cargo delivery with carrier-accountable pressure/thermal/slurry/terminal duties and attributable lifecycle."
  market_state: "Pipeline delivery service for actual specified other goods"
