  how_well: "Actual named composition/grade/phase,cargo basis,receipt/delivery gates,route/distance,pressure/temperature,duration and accepted original/genuine amended quality."
  how_long_or_cycle: "Actual batch or continuous accepted-delivery reporting period and attributable complete operating/lifecycle intervals."
  reference_flow_link: "accepted_pipeline_delivery"
system_boundary:
  rules:
    - rule_id: full_scope
      applies_to: "pipeline_delivery"
      rule: "Use full actual other-chemical, coal-slurry and other n.e.c. pipeline carriage at true receipt/delivery gates. Determine the transported product classification independently of a source example; gas or liquid phase does not make every chemical natural gas or petroleum. Steam/water mains remain outside; actual carrier medium is not an independent water-distribution product by default."
      source_ids:
        - unsd-other-pipeline-2025
    - rule_id: cargo_basis_and_gate
      applies_to: "pipeline_delivery"
      rule: "Define original actual cargo composition/grade/state, mass basis, receipt/delivery custody, quality, pressure/temperature and chronological amendments. For slurry or solution distinguish contractual mixture from constituent/solids cargo and carrier medium with measured moisture/composition. Accepted delivery M includes only actual accepted cargo on that predeclared basis. If the original genuinely contracted accepted mixture includes water as its required constituent, include its actual measured constituent water once with that mixture; never add standalone makeup/flush/recirculation water as independent delivered output or include carrier water in a solids-only basis. Linepack,nominations,invoices and off-spec returns are not accepted delivery; dilution or basis changes cannot manufacture output."
      source_ids: []
    - rule_id: slurry_conditioning
      applies_to: "pipeline_delivery"
      rule: "Record actual solid and liquid states through required carrier preparation, mixing/suspension, pumping, tanks, separation/dewatering, medium return or disposal at the actual handover. These duties are conditional on the real service; neither grinding/dewatering nor water return is universal. Independent goods formulation, mining, refining or downstream combustion is outside this transport output, while included carrier conditioning inputs/residuals cannot disappear."
      source_ids:
        - ota-slurry-1978
    - rule_id: actual_network_duties
      applies_to: "pipeline_delivery"
      rule: "Preserve actual pipe segments, pumps/compressors, auxiliary heating/cooling, pressurization, agitated tanks, metering, pigging, flushing, commissioning/fill, standby, start/stop, blocked/off-spec/failure/recovery and return-medium duties. Recirculated cargo or internally recovered pressure/energy is not fresh cargo delivery or external energy supply. Real chemical compatibility, phase and technology determine actual inputs; no default pressure, slurry ratio or energy intensity."
      source_ids:
        - doe-hydrogen-pipeline
    - rule_id: ownership_and_providers
      applies_to: "pipeline_delivery"
      rule: "Assign one owner to each actual carrier/shipper/terminal/conditioning/medium-treatment event, supply, asset and site/period cell. Compatible whole native provider results replace exact covered cells once; complete required missing stages. CCS transport interfaces exclude independent capture/storage unless a separately declared function is actually supplied, with no automatic storage credit. Cargo title or purchased throughput alone does not establish provider lifecycle coverage."
      source_ids: []
    - rule_id: assets_all_user_life
      applies_to: "pipeline_delivery"
      rule: "Include actual pipeline/right-of-way works, coatings/cathodic protection, pump/compressor/driver/thermal systems, tanks, valves, controls and terminal/conditioning assets at native manufacture/initial/replacement/maintenance/retirement gates and positive same-asset all-user useful lifetime demand. Every real served commodity/customer/function/site/period is part of its evidence; actual throughput, work or other compatible duty replaces nominal capacity or monetary fees."
      source_ids: []
    - rule_id: species_medium_fates
      applies_to: "pipeline_delivery"
      rule: "Maintain actual cargo-component, carrier-medium, chemical/cleaning and native-energy ledgers. Separate retained linepack/stock, internal return/recovery, genuine external recovered product, collected wastewater/sludge/waste, and actual substance-specific air/water/soil release. A lost cargo component or unknown meter imbalance is not automatically an elementary emission; transported CO2 is not atmospheric CO2 until actually released with known origin and receiver."
      source_ids:
        - phmsa-product-context
