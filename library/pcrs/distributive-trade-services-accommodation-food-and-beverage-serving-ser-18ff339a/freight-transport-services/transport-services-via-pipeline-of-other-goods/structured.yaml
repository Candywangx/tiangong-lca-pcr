      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| reference_basis | pipeline_delivery | Verify accepted cargo delivery M on its predeclared measured mixture/constituent/solids basis at actual service gates and quality. Reference1kg is transport service, not manufactured goods. For an original genuinely contracted accepted mixture,include its actual measured constituent water once at required composition/quality;for solids/constituent-only bases exclude carrier water. Standalone flush/makeup/recirculation water,linepack or rejected stock cannot become independent/additional output;no opportunistic dilution/basis switch. Actual distance/state/phase/quality strata must be compatible and M positive for finite intensity. |  |\n| scope_and_conditioning | pipeline_delivery | Verify full other-chemical/coal-slurry/other n.e.c. scope and actual all-phase technologies without importing natural-gas/petroleum/steam/water-mains categories or independent manufacturing/capture/storage. Necessary real carrier conditioning, pressure/thermal, slurry/dewater and terminal interfaces require actual supplies, states, residues and responsibility. |  |\n| stock_and_fates | pipeline_delivery | Reconcile actual cargo components, carrier media, tanks/linepack, internal return/recirculation, external recovery, rejected/returned material, collected waste and substance/receiver-specific release without duplicate same-gate transfers. Cargo CO2 or water is not automatically environmental emission; unknown imbalance remains investigated, not inferred as leak, evaporation or combustion. |  |\n| native_life_provider | pipeline_delivery | Verify actual native pump/compressor/thermal/auxiliary energy,supply/stock/use and internal recovery,including cargo actually withdrawn as fuel and compatible upstream fuel supply once at its true owner after provider coverage; whole provider cells replaced once and uncovered lifecycle complete. Check real contributing sites, all served users, positive same-asset lifetime duty and disjoint phases; M=0 retains burden without finite intensity. |  |\n| identity_projection | pipeline_delivery | Every actual atomic exchange needs a real identity/type/direction/state/native quantity/property/unit and source/receiver gate with same-process protocol or registered unresolved requirement. Verify aligned bilingual reference/cards/methods/profile and fresh generated projection. Target pass does not establish exact UUID, operating safety, scientific review or publication readiness. |  |\n| atomic_pipeline_delivery | pipeline_delivery | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
