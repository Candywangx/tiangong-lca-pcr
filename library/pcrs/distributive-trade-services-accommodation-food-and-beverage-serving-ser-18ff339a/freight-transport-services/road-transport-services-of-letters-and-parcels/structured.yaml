product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.road-transport-services-of-letters-and-parcels"
  classification_refs: "CPC 3.0 65116; exact"
  covered_products: "This PCR covers transporting letters and parcels by any qualifying mode of land transport other than railway, on behalf of a postal or courier service. The actual supplied function is a carrier carriage leg for that operator, evidenced by the transport agreement, load membership and carrier/operator custody interfaces. Road vans/trucks are examples, not a restriction to motor vehicles, diesel, long haul or one geography. Any actual qualifying nonrail land propulsion or conveyance requires its own native operation, support, assets and environmental records. A human-powered or animal-drawn carrier leg is not excluded solely by technology, but the explicitly excluded bicycle-messenger and courier/local-delivery functions cannot be relabelled as this service."
  excluded_products: "Exclude railway mail carriage, air/water/space legs, bicycle messenger services, integrated courier delivery services and local delivery services identified in the CPC note. Also exclude the whole postal/courier end-user acceptance-sorting-delivery network, standalone forwarding/warehousing/sorting/packing, equipment rental/manufacture or mail contents manufacture as the final product. Physical proximity or an urban route alone does not decide the category: determine whether the actual supplied obligation is qualifying carriage on behalf of a postal/courier operator or the excluded delivery product. Include actual loading, scanning, sorting or holding only to the extent they fulfil this carrier leg responsibility; distinctly supplied sorting/storage remains a separate interface. Never count the same event as both full courier delivery and an additional complete carrier service without a non-overlapping supply relationship."
  representative_product: "Completed nonrail land carrier consignment leg of letters and parcels for a postal or courier operator"
  production_route: "Actual nonrail land carrier custody and carriage on behalf of a postal/courier operator, accepted agreed-load delivery and complete attributable lifecycle."
  market_state: "Completed nonrail land carrier consignment leg of letters and parcels for a postal or courier operator"
functional_unit:
  what: "Completed nonrail land carrier consignment leg of letters and parcels for a postal or courier operator"
  how_much: "1 actual completed carrier consignment nonrail land leg"
  how_well: "Actual postal/courier carrier obligation, mail/receptacle/dispatch load membership, custody gates, actual nonrail land distance/time, quality/security and accepted completion."
  how_long_or_cycle: "Actual leg and supporting complete duty/lifecycle interval; report actual elapsed time and cohort period."
  reference_flow_link: "completed_mail_carrier_leg"
system_boundary:
  rules:
    - rule_id: scope_and_custody
      applies_to: "mail_carrier_leg"
      rule: "Apply the official on-behalf-of-postal/courier nonrail land carriage function at actual carrier/operator custody gates. Excluded messenger, courier/local-delivery and railway functions do not become qualifying merely because the load contains parcels."
      source_ids:
        - unsd-mail-land-2025
    - rule_id: provider_ownership
      applies_to: "mail_carrier_leg"
      rule: "Each physical duty, mail receptacle, site, supplier, phase and period has one burden owner. A complete verified subcontract carrier/handling/sorting result replaces only its exact covered cells. Retain upstream supply and lifetime stages not covered, never add provider-covered fuel, emissions, capital or support twice."
      source_ids:
        - ghg-product-2011
    - rule_id: mail_and_receptacles
      applies_to: "mail_carrier_leg"
      rule: "Letters/parcels and their contents remain carried property, not consumable product inputs creating carriage. Track custody, item/receptacle membership, net mail, packaging/receptacle tare and shortage/damage separately. Actual required loss replacement belongs to its documented owner/function; do not charge ordinary carried-content manufacture again. Mailbags, cages, pallets and containers used repeatedly have supply, maintenance, return and retirement life ledgers distinct from consumable wrapping."
      source_ids:
        - upu-transport-logistics
    - rule_id: all_actual_technologies
      applies_to: "mail_carrier_leg"
      rule: "Preserve all actual qualifying conveyance and propulsion. Combustion and electric rows are conditional examples; real human/animal-powered or other systems require own physical supplies, dedicated work support, relevant asset/service life, manure/waste and actual substance/fate records. Do not assign universal food calories, labour-energy or animal-feed factors, nor treat working animals as carried live-animal cargo. No unknown data is zero."
      source_ids: []
    - rule_id: handling_and_security
      applies_to: "mail_carrier_leg"
      rule: "Identify actual carrier loading/unloading, receptacle scans, custody controls, sorting/holding and time/security obligations from the actual agreement. Include their necessary own activities or native provider results once; independently supplied network sorting, acceptance, last-mile delivery or warehousing remains outside the carrier gate and is disclosed. Actual temperature-conditioned parcels or cab equipment require actual conditions, native energy, refrigerant/species and fate records, not assumed cooling of every mail load."
      source_ids:
        - upu-transport-logistics
    - rule_id: duty_and_fates
      applies_to: "mail_carrier_leg"
      rule: "Capture actual loaded, empty, positioning, waiting, failed, partial, misrouted, return and recovery duties with causal all-user attribution. Separate fuel supply, burning, stock, spill and recovery; whole blends and component replacement inputs are alternatives. Internal battery recovery is not fresh external supply. Identify each actual substance/medium/subcompartment, collected waste and material recovery; unexplained mail shortage or stock deficit is not an emission."
      source_ids: []
