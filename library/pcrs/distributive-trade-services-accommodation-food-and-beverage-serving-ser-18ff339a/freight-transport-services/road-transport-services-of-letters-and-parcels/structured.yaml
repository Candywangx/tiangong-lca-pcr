      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual carrier/operator mail custody and nonrail land duty records at agreed gates; compatible upstream supplier interfaces. |\n| starting_condition_role | Foreground collection interface, not zero upstream asset/supply burden. |\n| product_classification_scope | CPC 3.0 65116 |\n| recursive_input_rule | Use verified same-function subcontracted service once at native demand; expand uncovered responsibility, never purchase a self-service or create extra final output. |\n| upstream_dataset_requirement | Actual function, native demand, technology, geography, period, phases and quality compatible; explicitly complete all missing stages. |\n| disclosure | Operator/carrier function, actual load membership/custody/acceptance, nonrail land mode, empty/failed/return duties, sorting/handling ownership, native provider cells, all-user lifetime/sites/periods, fates and gaps. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_and_custody | mail_carrier_leg | Apply the official on-behalf-of-postal/courier nonrail land carriage function at actual carrier/operator custody gates. Excluded messenger, courier/local-delivery and railway functions do not become qualifying merely because the load contains parcels. | unsd-mail-land-2025 |\n| provider_ownership | mail_carrier_leg | Each physical duty, mail receptacle, site, supplier, phase and period has one burden owner. A complete verified subcontract carrier/handling/sorting result replaces only its exact covered cells. Retain upstream supply and lifetime stages not covered, never add provider-covered fuel, emissions, capital or support twice. | ghg-product-2011 |\n| mail_and_receptacles | mail_carrier_leg | Letters/parcels and their contents remain carried property, not consumable product inputs creating carriage. Track custody, item/receptacle membership, net mail, packaging/receptacle tare and shortage/damage separately. Actual required loss replacement belongs to its documented owner/function; do not charge ordinary carried-content manufacture again. Mailbags, cages, pallets and containers used repeatedly have supply, maintenance, return and retirement life ledgers distinct from consumable wrapping. | upu-transport-logistics |\n| all_actual_technologies | mail_carrier_leg | Preserve all actual qualifying conveyance and propulsion. Combustion and electric rows are conditional examples; real human/animal-powered or other systems require own physical supplies, dedicated work support, relevant asset/service life, manure/waste and actual substance/fate records. Do not assign universal food calories, labour-energy or animal-feed factors, nor treat working animals as carried live-animal cargo. No unknown data is zero. |  |\n| handling_and_security | mail_carrier_leg | Identify actual carrier loading/unloading, receptacle scans, custody controls, sorting/holding and time/security obligations from the actual agreement. Include their necessary own activities or native provider results once; independently supplied network sorting, acceptance, last-mile delivery or warehousing remains outside the carrier gate and is disclosed. Actual temperature-conditioned parcels or cab equipment require actual conditions, native energy, refrigerant/species and fate records, not assumed cooling of every mail load. | upu-transport-logistics |\n| duty_and_fates | mail_carrier_leg | Capture actual loaded, empty, positioning, waiting, failed, partial, misrouted, return and recovery duties with causal all-user attribution. Separate fuel supply, burning, stock, spill and recovery; whole blends and component replacement inputs are alternatives. Internal battery recovery is not fresh external supply. Identify each actual substance/medium/subcompartment, collected waste and material recovery; unexplained mail shortage or stock deficit is not an emission. |  |\n\n"
