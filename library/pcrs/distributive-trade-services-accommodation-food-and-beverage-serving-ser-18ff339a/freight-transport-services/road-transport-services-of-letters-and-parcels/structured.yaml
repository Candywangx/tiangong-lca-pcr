allocation_rules:
  - rule_id: direct_first
    applies_to: "mail_carrier_leg"
    rule: "Directly assign dedicated carrier-leg duties and measured resources before residual common-pool allocation. A carrier consignment is the reference output; mailpiece, bag, cage or vehicle count is not an extra final product. Different actual mail class, gates, load quantity, quality, distance and duration require coherent strata or disclosed distribution, not automatic equal-count averaging."
    source_ids:
      - ghg-product-2011
  - rule_id: causal_pool
    applies_to: "mail_carrier_leg"
    rule: "Enumerate all real independent carrier consignments and other intended services with actual handovers. Allocate residual shared duties/site resources across every user and period using supported physical causation. Actual mass-distance, occupied volume-time, measured energy or another driver may be justified; mail postage, declared value, bag count, vehicle capacity and equal shares are not defaults. Never add mass-distance and volume-time as one physical quantity."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "mail_carrier_leg"
    rule: "For each actual vehicle/conveyance, power component, reusable receptacle and site/road/charging asset, attribute native delivered quantity by studied compatible duty divided by positive documented same-asset all-user useful lifetime duty, then divide by N once. Preserve initial manufacture, replacements, maintenance, terminal phases and retirement without duplicate coverage. Life forecast, denominator and uncertainty need evidence; no arbitrary years, purchase-year depreciation or money proxy."
    source_ids: []
  - rule_id: failure_and_recovery
    applies_to: "mail_carrier_leg"
    rule: "Retain causal failed/partial/misrouted/return/empty-receptacle burdens in the appropriate serving pool without assuming accepted final output. Link rejected state and return/rework/recovery/disposal path to its actual producing duty and owner. A returned consignment needs actual independent acceptance to be another final service; internal rehandling is not self-purchased service. Real recovered products versus residues/wastes need actual identity, destination and explicit attribution; no automatic avoided-product credit."
    source_ids: []
