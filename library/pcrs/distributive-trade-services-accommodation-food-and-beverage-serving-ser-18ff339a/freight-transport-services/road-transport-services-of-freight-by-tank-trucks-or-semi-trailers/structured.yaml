normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:9ede8969c95d78ceec6c58b80c8279b7571c3222d44675ad369cbae5146046f1"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6412"
      family: "system_boundary"
      span:
        start:
          offset: 6412
          line: 55
          column: 1
        end:
          offset: 12477
          line: 79
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual special tanker, bulk liquid/gas lot, custody gates and current cargo/tank states |\n| starting_condition_role | Foreground custody fact; not a zero-burden supply or asset cut-off |\n| product_classification_scope | CPC 3.0 65112 |\n| recursive_input_rule | Exact subcontracted tanker service replaces only supported provider-covered duties once |\n| upstream_dataset_requirement | Actual supply/asset/service identity, native unit, gate, geography, period and scope; complete uncovered transport and lifecycle |\n| disclosure | Cargo state and custody, all-user duty, provider/asset boundaries, rejects, uncertainty and actual service strata |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope | tanker_delivery | The category covers road carriage of crude oil, natural gas, refined petroleum products and other bulk liquids or gases in special tank trucks or tank semi-trailers, including food liquids and dangerous or non-dangerous loads. Include actual pressure, ambient, heated or cryogenic containment and all applicable propulsion routes; none is a universal requirement. Tank-container carriage as an intermodal container service, individually transported packaged drums/cylinders, dry-bulk carriage, pipeline carriage, cargo manufacture or trading, and bare vehicle rental are different outputs. For permanently mounted tube/bundle systems, review the actual special bulk-gas tank-trailer function and official classification; the packaged-cylinder exclusion alone neither excludes nor establishes their eligibility. Resolve overlaps from actual offered carriage function and tank configuration; do not double-map one service. | unsd-cpc3-65112 |\n| custody | tanker_delivery | Start at agreed carrier custody/collection gate and end at documented accepted delivery gate. Include loading, pumping, discharge, thermal/pressure support, safety preparation, tank cleaning and required service support when owned by this carriage; separately supplied terminal responsibilities require an explicit interface. Tank filling retains bulk cargo state and is not manufacture of packaged product. Cargo remains customer inventory, not purchased fuel merely because chemically identical to vehicle fuel. | unsd-cpc3-65112; ghg-product-2011 |\n| whole_duty | tanker_delivery | Retain loaded, empty, positioning, failed delivery, rescue, waiting, border, idling and cleaning/changeover duties causally required by the output. Link each event to real journey/campaign, all consignments and other users; an empty return is not a second completed cargo delivery. No universal backhaul, loss, load factor, trip length or cleaning frequency. | ghg-product-2011 |\n| cargo_balance | tanker_delivery | Close custody mass by material/species, tank compartment, lot and period: opening cargo plus accepted pickups equals accepted delivery plus actual outward return transfers, outgoing collected waste, direct spill/vent and closing cargo. Retained heel or undelivered material aboard/on-site belongs only to closing stock. Each outward return has one transfer id; residue is a physical state assigned exclusively to closing stock, an actual outgoing return, outgoing waste or environmental release, never an extra balance term. Support volumetric conversion by actual density, temperature, pressure and composition; gas standard volume needs named reference conditions. Returned/rejected cargo is not completed delivery. Route cargo loss to actual collected waste or environmental medium separately; do not count one loss in both. Cargo production replacement is a disclosed loss-responsibility extension, never the entire carried cargo burden by default. | ghg-product-2011 |\n| thermal | tanker_delivery | For pressure or thermal support record actual pre-load state, required delivered temperature/pressure/quality, holding time and actual intervention. Heating fuel/steam/electricity, nitrogen or other actual purge medium, refrigeration and refrigerant balance enter only when present; gas venting, boil-off, residue and rejected delivery retain actual identity and fate. No assumed refrigeration because the tank transports a liquefied gas, and no assumed zero boil-off. | ghg-product-2011 |\n| assets | tanker_delivery | Complete actual truck/tractor, tank semi-trailer, compartment fittings, pump, hoses, metering, heating/pressure systems, depot/washbay and road infrastructure lifecycle responsibility. Delivered assembly manufacture is only its verified gate: attribute it using the same asset cohort useful duty, then independently cover uncovered installation, operation, maintenance, replacements and retirement. Complete assembly and its included initial components are mutually exclusive. Record all-user road/site asset shares and provider boundaries; no universal lifespan. | ghg-product-2011 |\n| provider | tanker_delivery | Create a gate-and-coverage matrix for own operation, subcontract carriage, terminal pumping, washing and treatment providers. An actual provider result in its native unit replaces exactly the covered foreground cells once, including energy/emissions/assets if already covered. Keep uncovered cells. A bill, a material flow UUID or fuel purchase alone does not prove provider lifecycle coverage. Actual cross-border legs and supply gates remain complete. | ghg-product-2011 |\n| atomic | tanker_delivery | For each conditional requirement expand every actual exchange into one row with unique row_id, same service process, direction/type, actual substance/material/service, state and supply/receiving gate, verified UUID or explicit unresolved registration, native property/unit, recorded quantity, source, protocol and calculation. Separate every fuel, maintenance component, provider, cleaning chemical, cargo residue, waste, pollutant species and receiving medium; missing evidence is incomplete, not zero. Avoid invented exchanges for labour or cargo ownership transfer. | ghg-product-2011 |\n\n"
