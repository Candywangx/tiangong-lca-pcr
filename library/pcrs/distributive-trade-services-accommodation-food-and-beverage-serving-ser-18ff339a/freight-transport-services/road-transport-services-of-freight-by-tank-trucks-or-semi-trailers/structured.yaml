  calculation_rules:
    - id: normalize
      applies_to: "tanker_delivery"
      rule: "For each actual row x, q_x = allocated_native_quantity_x / N after causal duty/provider/stock closure; N > 0. Reference final service = 1 Item(s)."
      inputs:
        - "Native records"
        - "all-user allocation"
        - "completed equivalent N"
      output: "Per-reference native quantity"
      source_ids:
        - ghg-product-2011
    - id: asset_share
      applies_to: "tanker_delivery"
      rule: "Attributed manufacture = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty; then divide by N. Only verified manufacture coverage is included in this term."
      inputs:
        - "Same asset cohort"
        - "native quantity"
        - "all-user duty"
      output: "Attributed native asset manufacture"
      source_ids:
        - ghg-product-2011
    - id: custody
      applies_to: "tanker_delivery"
      rule: "Close custody mass by material/species, tank compartment, lot and period: opening cargo plus accepted pickups equals accepted delivery plus actual outward return transfers, outgoing collected waste, direct spill/vent and closing cargo. Retained heel or undelivered material aboard/on-site belongs only to closing stock. Each outward return has one transfer id; residue is a physical state assigned exclusively to closing stock, an actual outgoing return, outgoing waste or environmental release, never an extra balance term. Support volumetric conversion by actual density, temperature, pressure and composition; gas standard volume needs named reference conditions. Returned/rejected cargo is not completed delivery. Route cargo loss to actual collected waste or environmental medium separately; do not count one loss in both. Cargo production replacement is a disclosed loss-responsibility extension, never the entire carried cargo burden by default."
      inputs:
        - "Custody stock"
        - "delivery and actual losses"
      output: "Material/species mass closure before normalization"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: completeness
      applies_to: "tanker_delivery"
      requirement: "For each conditional requirement expand every actual exchange into one row with unique row_id, same service process, direction/type, actual substance/material/service, state and supply/receiving gate, verified UUID or explicit unresolved registration, native property/unit, recorded quantity, source, protocol and calculation. Separate every fuel, maintenance component, provider, cleaning chemical, cargo residue, waste, pollutant species and receiving medium; missing evidence is incomplete, not zero. Avoid invented exchanges for labour or cargo ownership transfer."
      evidence: "Row-addressable expansion and no missing-as-zero audit"
    - id: representative
      applies_to: "tanker_delivery"
      requirement: "Enumerate actual vehicles, washbays, terminals, countries, periods and cargo/thermal/technology strata. Aggregate equivalent functions by actual completed N with disclosed distribution; route averages never silently erase non-equivalent load/distance/quality."
      evidence: "Contributing-unit register, accepted outputs and weighting evidence"
    - id: uncertainty
      applies_to: "tanker_delivery"
      requirement: "Calibration, sample coverage, stock reconciliation, model applicability and independent QA are required. No default loss, lifespan, fuel factor, allocation fraction or numerical Range. If a model is necessary retain data provenance and uncertainty before use."
      evidence: "Meter certificates, model references, uncertainty and independent sample"
validation_rules:
  - rule_id: scope_output
    applies_to: "tanker_delivery"
    rule: "Check exact full liquid/gas tanker scope, actual vehicle/tank configuration, unique final service output and predeclared completion/OD/quality/quantity/period qualifiers; no cargo, asset or container-service substitution."
    source_ids:
      - ghg-product-2011
  - rule_id: closure
    applies_to: "tanker_delivery"
    rule: "Reconcile every real journey, site, compartment, tank cleaning/changeover and period with loaded/empty/failed duty, positive N, delivered cargo stock/loss balance and full provider/asset coverage. Missing required quantities, allocation bases or fates block a complete package."
    source_ids:
      - ghg-product-2011
  - rule_id: identity
    applies_to: "tanker_delivery"
    rule: "Verify every final TIDAS exchange UUID and native property/unit/gate and every elementary species/medium. Unresolved semantic requirements remain mandatory production gates; a reference Count property is not a verified tanker-service product identity."
    source_ids:
      - ghg-product-2011
  - rule_id: parity
    applies_to: "tanker_delivery"
    rule: "Match English, Chinese and generated projection by row/rule/protocol ids and formulas, including conditional branches and no missing-as-zero. Replace uncertain models with documented measurements or retain uncertainty; retain independent QA evidence rather than validating a batch by its own maximum."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_tanker_delivery
    applies_to: "tanker_delivery"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified tanker delivery foreground package for process/lifecyclemodel use"
  allowed_use: "Equivalent actual bulk-liquid/gas tanker service with declared qualifiers and verified final exchanges"
