system_boundary:
  rules:
    - rule_id: scope
      applies_to: "tanker_delivery"
      rule: "The category covers road carriage of crude oil, natural gas, refined petroleum products and other bulk liquids or gases in special tank trucks or tank semi-trailers, including food liquids and dangerous or non-dangerous loads. Include actual pressure, ambient, heated or cryogenic containment and all applicable propulsion routes; none is a universal requirement. Tank-container carriage as an intermodal container service, individually transported packaged drums/cylinders, dry-bulk carriage, pipeline carriage, cargo manufacture or trading, and bare vehicle rental are different outputs. For permanently mounted tube/bundle systems, review the actual special bulk-gas tank-trailer function and official classification; the packaged-cylinder exclusion alone neither excludes nor establishes their eligibility. Resolve overlaps from actual offered carriage function and tank configuration; do not double-map one service."
      source_ids:
        - unsd-cpc3-65112
    - rule_id: custody
      applies_to: "tanker_delivery"
      rule: "Start at agreed carrier custody/collection gate and end at documented accepted delivery gate. Include loading, pumping, discharge, thermal/pressure support, safety preparation, tank cleaning and required service support when owned by this carriage; separately supplied terminal responsibilities require an explicit interface. Tank filling retains bulk cargo state and is not manufacture of packaged product. Cargo remains customer inventory, not purchased fuel merely because chemically identical to vehicle fuel."
      source_ids:
        - unsd-cpc3-65112
        - ghg-product-2011
    - rule_id: whole_duty
      applies_to: "tanker_delivery"
      rule: "Retain loaded, empty, positioning, failed delivery, rescue, waiting, border, idling and cleaning/changeover duties causally required by the output. Link each event to real journey/campaign, all consignments and other users; an empty return is not a second completed cargo delivery. No universal backhaul, loss, load factor, trip length or cleaning frequency."
      source_ids:
        - ghg-product-2011
    - rule_id: cargo_balance
      applies_to: "tanker_delivery"
      rule: "Close custody mass by material/species, tank compartment, lot and period: opening cargo plus accepted pickups equals accepted delivery plus actual outward return transfers, outgoing collected waste, direct spill/vent and closing cargo. Retained heel or undelivered material aboard/on-site belongs only to closing stock. Each outward return has one transfer id; residue is a physical state assigned exclusively to closing stock, an actual outgoing return, outgoing waste or environmental release, never an extra balance term. Support volumetric conversion by actual density, temperature, pressure and composition; gas standard volume needs named reference conditions. Returned/rejected cargo is not completed delivery. Route cargo loss to actual collected waste or environmental medium separately; do not count one loss in both. Cargo production replacement is a disclosed loss-responsibility extension, never the entire carried cargo burden by default."
      source_ids:
        - ghg-product-2011
    - rule_id: thermal
      applies_to: "tanker_delivery"
      rule: "For pressure or thermal support record actual pre-load state, required delivered temperature/pressure/quality, holding time and actual intervention. Heating fuel/steam/electricity, nitrogen or other actual purge medium, refrigeration and refrigerant balance enter only when present; gas venting, boil-off, residue and rejected delivery retain actual identity and fate. No assumed refrigeration because the tank transports a liquefied gas, and no assumed zero boil-off."
      source_ids:
        - ghg-product-2011
    - rule_id: assets
      applies_to: "tanker_delivery"
      rule: "Complete actual truck/tractor, tank semi-trailer, compartment fittings, pump, hoses, metering, heating/pressure systems, depot/washbay and road infrastructure lifecycle responsibility. Delivered assembly manufacture is only its verified gate: attribute it using the same asset cohort useful duty, then independently cover uncovered installation, operation, maintenance, replacements and retirement. Complete assembly and its included initial components are mutually exclusive. Record all-user road/site asset shares and provider boundaries; no universal lifespan."
      source_ids:
        - ghg-product-2011
    - rule_id: provider
      applies_to: "tanker_delivery"
      rule: "Create a gate-and-coverage matrix for own operation, subcontract carriage, terminal pumping, washing and treatment providers. An actual provider result in its native unit replaces exactly the covered foreground cells once, including energy/emissions/assets if already covered. Keep uncovered cells. A bill, a material flow UUID or fuel purchase alone does not prove provider lifecycle coverage. Actual cross-border legs and supply gates remain complete."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic
      applies_to: "tanker_delivery"
      rule: "For each conditional requirement expand every actual exchange into one row with unique row_id, same service process, direction/type, actual substance/material/service, state and supply/receiving gate, verified UUID or explicit unresolved registration, native property/unit, recorded quantity, source, protocol and calculation. Separate every fuel, maintenance component, provider, cleaning chemical, cargo residue, waste, pollutant species and receiving medium; missing evidence is incomplete, not zero. Avoid invented exchanges for labour or cargo ownership transfer."
      source_ids:
        - ghg-product-2011
