      collection_method: "Carrier custody tickets, calibrated delivery/vehicle logs and consignment acceptance; join real journey/compartment/period and provider coverage. Independently reconcile cargo mass and all service obligations before allocation and divide once by positive N. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "Item(s); kg; km; actual native units"
      frequency: "Every consignment, custody event and provider result"
      temporal_coverage: "Full declared service cohort including failed/empty duties"
      site_scope: "All actual routes, receiving sites and responsible providers"
      aggregation_rule: "per declared reference flow"
