      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| subdivide | tanker_delivery | Prefer direct measurement and subdivision by vehicle, tank compartment, journey, cargo state and delivery obligation. Enumerate all simultaneous delivered consignments, subsequent backhaul services and separately sold products; retained cargo, waste, and empty movements are not intended service outputs. | ghg-product-2011 |\n| shared | tanker_delivery | Attribute indivisible shared traction by an evidenced causal constraint such as actual segment load mass-distance when physically relevant, separately considering capacity-limited volume/compartment use, hazardous separation, pressure or thermal duties and time. No universal equal-per-consignment or revenue share. Shares cover all users, reconcile to the shared total, and are applied once before normalization. If causal relationship cannot be established, disclose and justify another allocation with sensitivity; do not silently choose a convenient default. | ghg-product-2011 |\n| period_assets | tanker_delivery | Identify every reporting period, vehicle/site cohort, replacement and retirement event. Attribute native manufacturing quantity by supported same-asset duty share over positive total all-user useful duty; operation is assigned from real period records. Terminal/washbay/road shared use and cross-period cleaning events have one owner. Disposal or recovered material has no automatic avoided-product credit. | ghg-product-2011 |\n| normalize | tanker_delivery | N is the positive number of completed equivalent qualified tanker consignment deliveries in the declared cohort. One consignment split across stops or vehicles follows the original documented delivery obligation and acceptance criterion; do not count each compartment or pump cycle as another completed service. Partial, failed or refused deliveries keep burdens but enter output only under the predeclared completion definition. N=0 gives no finite intensity. Different cargo states/routes/distances/quantities require strata or transparent distribution; Count outputs are not universally comparable. | ghg-product-2011 |\n\n"
