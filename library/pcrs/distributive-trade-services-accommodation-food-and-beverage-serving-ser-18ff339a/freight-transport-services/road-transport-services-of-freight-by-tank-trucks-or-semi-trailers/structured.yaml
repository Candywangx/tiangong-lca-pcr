  covered_products: "The category covers road carriage of crude oil, natural gas, refined petroleum products and other bulk liquids or gases in special tank trucks or tank semi-trailers, including food liquids and dangerous or non-dangerous loads. Include actual pressure, ambient, heated or cryogenic containment and all applicable propulsion routes; none is a universal requirement. Tank-container carriage as an intermodal container service, individually transported packaged drums/cylinders, dry-bulk carriage, pipeline carriage, cargo manufacture or trading, and bare vehicle rental are different outputs. For permanently mounted tube/bundle systems, review the actual special bulk-gas tank-trailer function and official classification; the packaged-cylinder exclusion alone neither excludes nor establishes their eligibility. Resolve overlaps from actual offered carriage function and tank configuration; do not double-map one service."
  excluded_products: "Packaged cargo; intermodal tank-container service; dry bulk; pipeline, rail, water, air or space carriage; cargo manufacture/trade; bare rental"
  representative_product: "Completed road tanker bulk-liquid or gas consignment delivery"
