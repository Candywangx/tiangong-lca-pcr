      record_type: "Actual primary meter/manifest/provider records"
      raw_fields: "Actual branch/gates; mail article-receptacle-dispatch-consignment and security/handover; bulk each wet mass/moisture/material/grade/size/stow/dust; tow object/config/preparation/connect-release/gear/targetduties; separate handling energy; actual supplies/reuse/stock/receiver/waste/environment and provider coverage"
      collection_method: "Collect actual interface logs/calibrated masses and states, separate custody objects/reusable assets/extra supplies; dry solids and associated water close separately: for EACH measured wet-basis moisture fraction w, M_dry = M_wet*(1-w); an actual other reported moisture basis needs an evidenced compatible conversion, never assume bare moisture is wet basis; actual environment/waste/recovery destinations disjoint Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "Each actual native cargo/material/energy/waste/species quantity and moisture/state; linked inventory reporting units: MJ (handling_ac)"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Actual commission/reporting period and linked full life phases"
      site_scope: "Actual vessels/tugs/tow targets, ports/anchorages/depots and providers"
      aggregation_rule: "per declared reference flow"
