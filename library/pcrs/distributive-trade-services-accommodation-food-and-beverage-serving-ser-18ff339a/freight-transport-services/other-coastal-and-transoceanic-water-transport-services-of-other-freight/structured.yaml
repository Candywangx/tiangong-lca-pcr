  calculation_rules:
    - id: qualified_original_count
      applies_to: "qualified_freight_commission"
      rule: "For each mandatory service stratum s and compatible functional fingerprint f, N_s,f = sum_j I(actual task j meets its original predeclared complete acceptance). Each original qualified bounded commission contributes one once; partial/failed/cancelled task contributes none, without changing task definition or losing causal burden. Final reference output is 1 Item(s); N_s,f > 0 required for finite intensity. Cargo mass-distance, tow time/distance/target configuration remain supplemental actual drivers, not substitute final output or equivalent across strata."
      inputs:
        - "original task/stratum/fingerprint"
        - "signed actual full acceptance"
        - cp_task
      output: "N_s,f; qualified_freight_commission"
      source_ids:
        - unsd-cpc3-65219
        - ghg-product-2011
    - id: exclusive_custody_stock
      applies_to: "cargo/mail/fuel/material/gear custody"
      rule: "At common actual gates/time and conserved native basis: opening + external_receipts = closing + actual_accepted_delivery_or_use + returned_or_recovered_outward + distinct_waste_outward + actual_environmental_loss + documented_residual. Terms mutually exclusive; internal recovery/reuse not extra receipt/outward/use, recovered material only closing, later actual use or one true outward destination. Equipment/customer targets/cargo stocks remain distinct. Separate actual fuel combustion/slip/carbon and actual spill recovered versus environment, never unknown difference forced as emission/zero."
      inputs:
        - "actual openclose/receipt/delivery/use/return/waste/environment"
        - cp_energy
        - cp_interfaces
        - cp_support
      output: "exclusive stock and fate reconciliation"
      source_ids:
        - ghg-product-2011
    - id: bulk_solids_water_balance
      applies_to: "actual drybulk branch"
      rule: "For EACH observation record measured moisture fraction and its actual basis: on wet basis w, M_dry = M_wet*(1-w); convert any actual other reported moisture basis using an evidenced compatible relation, never assume an unspecified basis is wet basis. On the resulting common dry-solids basis close opening dry solids + received dry solids = closing + delivered + recovered_outward + distinct_waste + environmental_dry_solids_loss + documented_residual, all destination terms exclusive. Internal recovered cargo enters closing/later delivery once, not extra loss/outward. Close associated water separately with actual added/rain/evaporated/retained/outgoing water and relevant reactions; wet-basis reporting includes actual water-change terms and never assumes equal moisture. Do not label all wet-mass difference dry cargo loss or airborne dust."
      inputs:
        - "each wet mass/moisture"
        - "actual dry-solid/water destinations"
        - cp_interfaces
      output: "dry solids and separate water ledger"
      source_ids:
        - ghg-product-2011
    - id: native_life_normalization
      applies_to: "all actual rows within compatible task stratum"
      rule: "q_row,ref,s,f = sum(q_native,event × actual causal all-user share) / N_s,f, once; asset share uses same-cohort attributable useful duty / supported positive all-user useful duty for that phase. Include causal preparation/failed/empty/weather/port and uncovered full life/provider cells. Trace actual consumed customer-owned/initial fuel or stored energy to actual withdrawal and compatible native upstream supply/charging burden once regardless of title/purchaser; purchase and withdrawal are not two fuel inputs, retained stock not consumed and whole cargo/target production remains outside. Sum compatible site/voyage numerators and N_s,f; do not pool unlike tasks or force supplier tonne-km/tug-hour into commission count."
      inputs:
        - "actual native event quantities"
        - "causal/life shares"
        - "compatible denominator indexed by stratum s and fingerprint f"
      output: "per-reference native inventory"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: task_stratum_traceability
      applies_to: "reference and branch interfaces"
      requirement: "Require original preoperation task/quantity/object/gates/quality acceptance and actual completion records, separate mandatory/finer functional strata and full causal unsuccessful duties. Mail hierarchies/tare/custody, drybulk each state/moisture and whole tow-target/config/condition are branch-specific records, not missing fields filled with unrelated cargo average."
      evidence: "Signed original contract/acceptance, calibrated raw logs, actual stratum/fingerprint registry"
    - id: actual_native_fate_scope
      applies_to: "all inputs/direct/waste/assets/providers"
      requirement: "Require actual native identity/property/unit/state/gate, all actor/site/period/life/coverage evidence and actual source/species/size/medium quantities with uncertainty. Advisory ocean towing, operator fleet and international postal/bulk examples only inform applicable actual questions, not universal numeric/technical/legal factors or mandatory identical contracts."
      evidence: "Native supplier/asset/measurement/fate records and coverage matrix"
    - id: validation_limits
      applies_to: "all nodes"
      requirement: "No universal commission size, tow speed/pull/load, mailpiece/bag ratio, bulk moisture/dust, fuel/slip/asset life or human metabolic factor. Actual application requires independent compatible QA samples; same batch maximum cannot validate itself. Missing quantities/identities remain incomplete; scientific review and final concrete bindings required despite checker pass."
      evidence: "Independent comparison/evidence register and explicit unresolved data"
validation_rules:
  - rule_id: validate_full_scope_task
    applies_to: "all nodes"
    rule: "Verify all official mail/drybulk/towpush/all listed target/n.e.c. branches and actual excluded-function overlap, plus one original bounded qualified completed task with mandatory stratum/fingerprint, actual cargo/object quantity/configuration/route/gates/acceptance. All5functional fields and native Count support required. No generic cargo tonne-km/ship manufacture, invoice/mailpiece/bag/tug count proxy or cross-stratum equivalence."
    source_ids:
      - unsd-cpc3-65219
      - ghg-product-2011
  - rule_id: validate_actual_branch_responsibility
    applies_to: "maritime_operation; cargo_tow_interfaces"
    rule: "Verify operator/carrier mail hierarchy/acceptance versus final addressee, drybulk per-observation measured moisture with explicit wet-basis w and M_dry=M_wet*(1-w), or evidenced conversion from its actual other reported basis, and separate water/dust fates, and whole tug(s)-tow target/preparation/gear/target responsible energy/support/true handover. Customer moved target manufacture distinct from true supplied service barge/gear life; target industrial work excluded. Include all actual main/aux/boiler/shore/port/weather/ballast/empty/failed duties and exact native provider cells once."
    source_ids:
      - ghg-product-2011
      - upu-postal-2024
      - imo-towing-884
  - rule_id: validate_life_stocks_providers
    applies_to: "all nodes"
    rule: "Verify disjoint opening/closing/recovery/use/delivery/outward/waste/environment ledgers and actual fuel/carbon/species; verify consumed customer-owned/initial fuel or stored-energy withdrawal and compatible native upstream supply/charging once regardless of purchaser/title, no free initial fuel, all-stock consumption or duplicate purchase/withdrawal; internal recovery not extra term, original target/cargo not consumed manufacture. Full actual manufacture/install/refit/commission/maintain/drydock/replace/retire phases and all-user same-cohort duty required; assembly/initialparts and provider-covered own cells exclusive. No assumed lifetime, manufacture-equals-life or fee/native-function conversion."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_denominator_identity
    applies_to: "all nodes"
    rule: "Require positive N_s,f only for original full task acceptance, no retrospective reset/count inflation and retain failed/zero-completion burdens; causal all-user shares close to one, compatible numerator/N aggregation and no double normalization. Every actual concrete identity/property/unit/state/gate/species/medium verified, conditional requirements expanded under same-node protocols, unresolved real final row registered. EN/ZH/structured carry all normative rules; missing incomplete not zero."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_maritime_operation
    applies_to: "maritime_operation"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_cargo_tow_interfaces
    applies_to: "cargo_tow_interfaces"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
