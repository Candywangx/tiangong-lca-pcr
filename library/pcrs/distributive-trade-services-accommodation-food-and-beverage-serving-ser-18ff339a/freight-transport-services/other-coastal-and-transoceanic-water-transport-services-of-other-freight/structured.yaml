      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| mandatory_strata_no_equivalence | all nodes | Publish separate profiles and denominators for actual mail, drybulk, tow/push and other n.e.c. strata, further subdivided by functional fingerprint: same task/object/quantity range, quality, route/gates/distance/time, tow configuration/condition and responsibility/technology where material. No cross-stratum or unlike-commission count average/equivalence. Direct meter/subdivide first; shared vessel/tug/handling/port/asset burdens use supported causal mass/space/resistance/thermal/time/capacity/energy/duty across all actual users, not automatically equal task count. Economic fallback needs absent physical relation and sensitivity; event shares sum to one. | ghg-product-2011 |\n| failed_task_attribution | all nodes | Within a compatible stratum/fingerprint retain all causal preparation/empty/ballast/weather/wait/failed/partial/rejected/rescue/rework/return and equipment-return burdens, then divide once by positive originally-qualified completed commission count N. If original task acceptance fails, no completed item is manufactured by changing destination/object or counting intermediate tug moves; actual independently specified successful tasks are tracked once. N=0 gives no finite intensity, and failed-period records remain for causal attribution rather than disappearing. | ghg-product-2011 |\n| all_user_life_period_site | all nodes | For each actual asset/life event allocate native quantity by same-cohort attributable useful duty / supported positive total all-user useful duty, then by N within a compatible task stratum. Keep manufacture/install/refit/commission/maintain/drydock/replace/retire phases, all users and cross-period stocks/events; no universal ship/towline/bag lifetime or omission of existing/leased life. Compatible voyage/site aggregation is summed attributable native quantities / summed compatible N, never simple unequal intensity means or heterogeneous task pooling. | ghg-product-2011 |\n| native_provider_recovery | all nodes | Preserve each actual native provider function/property/unit/gate/coverage; cargo tonne-km, tug-hours, vessel-km, bare charter and full commission are not interchangeable. Use supported actual activity to connect supplier quantity, never force one provider unit equal to final commission. Substitute exact covered own cells once and retain gaps. Internal transfer/recovery/recirculation is not extra outside supply/output; only actual external useful material/heat/electricity/service co-output gets receiver and subdivision/justified allocation, no automatic recovery/recycling credit. | ghg-product-2011 |\n\n"
