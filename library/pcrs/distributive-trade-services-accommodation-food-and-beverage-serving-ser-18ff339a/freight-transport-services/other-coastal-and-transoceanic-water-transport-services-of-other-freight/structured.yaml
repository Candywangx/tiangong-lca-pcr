system_boundary:
  rules:
    - rule_id: full_other_maritime_scope
      applies_to: "all nodes"
      rule: "Cover every official branch: on-behalf postal/courier letters/parcels, full drybulk cereals/flours/cement/sand/coal and others, high-sea/coastal towing/pushing, towing oil rigs/floating cranes/dredging vessels/buoys/hulls/incomplete vessels, and actual other freight n.e.c. Parent is maritime carrier commission. Branches have material differences in outputs/gates, inputs/quantities/data/quality; identify actual branch/equipment/function before inclusion, not drybulk-only or tug-only. Residual n.e.c. requires positive actual classification evidence and exclusion of specifically classified functions, never an unknown-cargo dumping category."
      source_ids:
        - unsd-cpc3-65219
    - rule_id: predeclared_task_acceptance
      applies_to: "maritime_operation; cargo_tow_interfaces"
      rule: "Record original bounded task and acceptance before operation: actual cargo amount/condition/destination or whole tow/push target configuration/destination/safe agreed handover; custody/quality/security/time and receiver evidence. Count completion against this original specification only, preserving changes, failed/partial/rejected/rescue/return lineage without retroactive goal reset. Document-only billing notice or delivery order is not assumed physical custody/acceptance; actual contractual responsibility governs remaining duties."
      source_ids:
        - ghg-product-2011
    - rule_id: postal_operator_branch
      applies_to: "cargo_tow_interfaces; maritime_operation"
      rule: "For mail, identify actual postal/courier operator-to-carrier receipt and carrier-to-operator/next-carrier handover, article/receptacle/dispatch/consignment hierarchy and signed acceptance, condition/time/security. Carrier maritime task is not integrated posting-to-addressee service or one mailpiece/bag. Reusable bag/tray/cage/container tare, supply/return/repair/cleaning/retirement and all-user cycles differ from carried article/intrinsic packaging. Actual sorting/scanning/seals/transfers and port handoff follow real carrier responsibility; UPU international examples do not impose one private/domestic contract or economic boundary."
      source_ids:
        - upu-postal-2024
    - rule_id: drybulk_branch
      applies_to: "cargo_tow_interfaces; maritime_operation"
      rule: "For drybulk identify actual material/grade/solid state and moisture at each observation, accepted quantity/quality, hold/stow/trim/ventilation and actual conveyor/grab/pneumatic/loading/discharge/cleaning interfaces. Grain and other bulk have actual applicable handling evidence, not one universal IMSBC/grain condition. Track actual dust composition/particle size and medium, spillage/washwater/collected residues, contamination or actual fumigation/treatment only where responsibility exists; cargo manufacture is not transport input. Do not assume all bulk is coal or all dust goes to air."
      source_ids:
        - imo-bulk
        - imo-grain
        - ghg-product-2011
    - rule_id: whole_tow_push_branch
      applies_to: "maritime_operation; cargo_tow_interfaces"
      rule: "For tow/push define the actual whole tug(s)-tow-target configuration, target geometry/displacement/draft/windage and tow condition, connection/release/acceptance gates, weather/route/shelter/time and each responsible actor. Include actual preparation/inspection/rigging, towing/pushing/assist propulsion, target service-responsible auxiliary power/pumps/ballast/lighting/riding-crew support and any actual target propulsion assistance, not just leading tug bunker. Target industrial drilling/dredging/production is separate. A moved customer rig/crane/buoy/hull is a custody target whose original manufacture is outside transport; a barge/platform/gear actually supplied as reusable carriage equipment is a service asset with full all-user life. Same hull cannot be both target manufacture input and duplicate transport asset for one role/event."
      source_ids:
        - imo-towing-884
        - boskalis-ocean-tugs
        - ghg-product-2011
    - rule_id: full_vessel_energy_duties
      applies_to: "maritime_operation; support_lifecycle"
      rule: "Retain all attributable main/auxiliary engines/boilers/generators/shore/battery and actual other fuel/propulsion paths, each vessel/tug/target responsible duty and onboard conversion once. Include loaded/tow/push, manoeuvre/ports/anchor/wait/ballast/empty reposition, connection/disconnection, weather shelter/diversion, standby/rescue/failure/redelivery and equipment returns. Shore power includes true upstream/connection/conversion and remaining boilers or other running sources; no zero-life assumption. Fuel stocks/reserves are not wholly consumed. Actual customer-owned or initially held cargo/target/vessel fuel or stored energy withdrawn and consumed for this transport carries compatible native upstream supply burden once regardless of purchaser, title or internal price. Trace actual withdrawal to its consumption source and upstream supply/charging provenance; do not charge purchase and stock withdrawal twice or add manufacture of the entire cargo/target. Actual alternative fuels, pilot/slip and species remain distinct."
      source_ids:
        - epa-shore-power
        - ghg-product-2011
    - rule_id: full_service_life_provider
      applies_to: "support_lifecycle"
      rule: "PCR lifecycle choice includes actual carrying vessels/tugs/service barges, propulsion/handling/winches/towlines/bridles/fenders/mail receptacles, port/berth/shore/maintenance assets manufacture/construction/install/refit/commissioning, maintenance/repair/drydock/renewal/replacement and retirement. Complete assembly and initially included parts exclusive; manufacture is not full useful life. Actual native charter/port/cargo/tow/support providers replace their exact covered input/emission/life cells once, retaining uncovered phases. Customer cargo/tow-target production stays outside, except real transport preparation material/service and target transport energy duties."
      source_ids:
        - ghg-product-2011
    - rule_id: actual_exchange_and_fates
      applies_to: "all nodes"
      rule: "Each actual unrepresented energy/material/reusable gear/asset/provider/waste/direct substance expands into one concrete row_id under one true node/direction/type, native identity/property/unit/state/gate/quantity, source/same-node protocol and receiver/medium with uncertainty. Fuel carbon origin, combustion/engine slip, cargo dust, marine spill, ballast/cooling/thermal/sewage/bilge/scrubber/antifouling/wear releases and actual ancillary refrigerant are conditional real sources, not assumed default factors. Actual chemical compound/size/phase and air/water/soil compartment differ from aggregate NOx/SOx/CO2-equivalent, collected waste or recovered useful stock. Missing evidence is incomplete, not zero."
      source_ids:
        - ghg-product-2011
