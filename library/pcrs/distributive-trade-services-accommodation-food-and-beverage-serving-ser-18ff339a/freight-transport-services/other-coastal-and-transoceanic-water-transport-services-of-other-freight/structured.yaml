allocation_rules:
  - rule_id: mandatory_strata_no_equivalence
    applies_to: "all nodes"
    rule: "Publish separate profiles and denominators for actual mail, drybulk, tow/push and other n.e.c. strata, further subdivided by functional fingerprint: same task/object/quantity range, quality, route/gates/distance/time, tow configuration/condition and responsibility/technology where material. No cross-stratum or unlike-commission count average/equivalence. Direct meter/subdivide first; shared vessel/tug/handling/port/asset burdens use supported causal mass/space/resistance/thermal/time/capacity/energy/duty across all actual users, not automatically equal task count. Economic fallback needs absent physical relation and sensitivity; event shares sum to one."
    source_ids:
      - ghg-product-2011
  - rule_id: failed_task_attribution
    applies_to: "all nodes"
    rule: "Within a compatible stratum/fingerprint retain all causal preparation/empty/ballast/weather/wait/failed/partial/rejected/rescue/rework/return and equipment-return burdens, then divide once by positive originally-qualified completed commission count N. If original task acceptance fails, no completed item is manufactured by changing destination/object or counting intermediate tug moves; actual independently specified successful tasks are tracked once. N=0 gives no finite intensity, and failed-period records remain for causal attribution rather than disappearing."
    source_ids:
      - ghg-product-2011
  - rule_id: all_user_life_period_site
    applies_to: "all nodes"
    rule: "For each actual asset/life event allocate native quantity by same-cohort attributable useful duty / supported positive total all-user useful duty, then by N within a compatible task stratum. Keep manufacture/install/refit/commission/maintain/drydock/replace/retire phases, all users and cross-period stocks/events; no universal ship/towline/bag lifetime or omission of existing/leased life. Compatible voyage/site aggregation is summed attributable native quantities / summed compatible N, never simple unequal intensity means or heterogeneous task pooling."
    source_ids:
      - ghg-product-2011
  - rule_id: native_provider_recovery
    applies_to: "all nodes"
    rule: "Preserve each actual native provider function/property/unit/gate/coverage; cargo tonne-km, tug-hours, vessel-km, bare charter and full commission are not interchangeable. Use supported actual activity to connect supplier quantity, never force one provider unit equal to final commission. Substitute exact covered own cells once and retain gaps. Internal transfer/recovery/recirculation is not extra outside supply/output; only actual external useful material/heat/electricity/service co-output gets receiver and subdivision/justified allocation, no automatic recovery/recycling credit."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "maritime_operation"
      flow_role: "Original task, mandatory stratum and qualified completion"
      record_type: "Actual primary meter/manifest/provider records"
      raw_fields: "Preoperation taskID/stratum/fingerprint; cargo quantity/condition/mailoperator or tow-target/configuration; origin/destination/gates; original quality/time/acceptance; actual route/distance/times; all vessels/tugs/target duties; completion/failure/partial/change/receiver lineage and compatible N"
      collection_method: "Link original task specification to signed actual acceptance, custody and physical activity; separate mandatory branches and finer compatible task fingerprints, no retroactive task reset/count inflation Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "Count Item(s); actual cargo mass/volume or target particulars; route distance/time"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Actual commission/reporting period and linked full life phases"
      site_scope: "Actual vessels/tugs/tow targets, ports/anchorages/depots and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Signed records; calibration; native provenance; causal allocation; uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_energy
      process_id: "maritime_operation"
      flow_role: "Whole responsible vessel/tug/target transport energy and direct substances"
      record_type: "Actual primary meter/manifest/provider records"
      raw_fields: "Each vessel/tug/target role; main/aux/boiler/PTO/battery/shore; fuel formulation/state/supply/openclose/burn/vent/leak/slip; actual customer-owned/initial fuel or stored-energy withdrawal, purchaser/title and compatible upstream supply/charging provenance linked to consumption; actual mode/duty/hour/meter; route/weather/wait/empty/assist; density/composition/carbon/sulfur/NCV; direct species/phase/size/medium and covered providers"
      collection_method: "Reconcile each actual energy path/stock and responsible actor once, not leading tug alone or target industrial work; source-specific measured/justified emissions with uncertainty and carbon/fate closure, actual consumed customer-owned/initial fuel or stored-energy supply/charging burden once independent of title/purchaser and no duplicate purchase/withdrawal; no universal fuel/slip factor Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "Actual native fuel/energy/species units; compatible state conversions; linked inventory reporting units: kg (actual_diesel_supply, fossil_co2_air, fossil_methane_air); MJ (vessel_shore_ac)"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Actual commission/reporting period and linked full life phases"
      site_scope: "Actual vessels/tugs/tow targets, ports/anchorages/depots and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Signed records; calibration; native provenance; causal allocation; uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_interfaces
