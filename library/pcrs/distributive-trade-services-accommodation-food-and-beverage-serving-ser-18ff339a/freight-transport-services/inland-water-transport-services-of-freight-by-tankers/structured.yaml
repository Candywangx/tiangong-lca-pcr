          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual cargo composition/phase,state and receipt custody with real inland tanker/tow/terminal/cargo-system native provider gates. |\n| starting_condition_role | Foreground collection interface,not zero upstream supply or asset burden. |\n| product_classification_scope | CPC 3.0 65222 |\n| recursive_input_rule | Use actual same-function native subcontract demand once;expand required uncovered stages,no purchased self-service or extra final internal-transfer output. |\n| upstream_dataset_requirement | Actual cargo basis,function,gates,technology,geography,period,phases and native unit compatible;complete missing lifecycle. |\n| disclosure | actual_named_bulk_cargo_composition_grade_and_phase; original_cargo_mass_basis_density_state_and_sampling; real_receipt_delivery_custody_gates_and_accepted_quality; actual_inland_route_distance_time_current_draft_locks_waterbody; real_tanker_tankbarge_pusher_tow_configuration; comparable_accepted_delivered_cargo_mass_M_not_capacity_or_fuelusedcargo; empty_ballast_manoeuvre_anchor_berth_failure_return_duties; native_external_fuel_shore_energy_vs_internal_generation; actual_cargo_to_fuel_withdrawal_upstream_supply_burn_slip_once; actual_thermal_pressure_reliquefaction_inert_purge_vapourreturn_cleaning_duties; heel_vapour_stock_return_recovery_waste_emission_native_custody; all_user_same_asset_vessel_tank_cargo_system_tug_port_waterway_life; native_provider_covered_phases_sites_periods_and_required_gaps; actual_source_receiver_compartment_not_default_freshwater |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_scope | inland_tanker_delivery | Apply full actual inland special-tanker bulk-liquid/gas carriage, including crude oil and other actual liquids/gases. Record real cargo/tank/propulsion or pusher/tow configuration and route/environment; no one-fuel, LNG-only, dangerous-goods-only or freshwater-only subset. Independent other-mode, initial manufacture/liquefaction and downstream functions remain distinct beyond actual gates. | unsd-inland-tanker-2025 |\n| cargo_acceptance | inland_tanker_delivery | Define original/genuine chronological amended composition, grade, phase, mass basis and actual custody/quality gates. M is actual accepted delivered cargo kg on that basis. Use calibrated direct mass or compatible measured density/state/composition; vapour return, heel, recirculation, cargo fuel withdrawal, off-spec returns and nominal capacity do not inflate accepted output. A genuine contractual mixture includes its actual required constituents once, not opportunistic dilution or denominator switching. |  |\n| inland_duty | inland_tanker_delivery | Include actual loaded/empty/ballast sailing, pusher/tow coupling and propulsion, manoeuvring, lock/bridge/port passage, current/water-level/draft constraints, waiting/anchor/berth, failed/recovery/return duties and included cargo-system support. Record actual distance/time and contributing units; a tug change, tank transfer or lock passage is not an extra final cargo delivery. |  |\n| cargo_support | inland_tanker_delivery | Record actual ship/shore loading, unloading, stripping, pumps/compression, heat/cold, pressure control, insulation/reliquefaction, inert/purge gas or steam and cargo-system cleaning/drying/degassing at real carrier/terminal gates. Actual liquid/vapour states and source/destination, including vapour return and retained stock, require native quantities and one responsibility owner. Neither every cargo needing cooling nor every vapour venting to air is presumed. These are actual-service collection requirements;regional examples do not prescribe universal operating conditions. | cdni-cargo-vapour-context |\n| cargo_fuel_energy | inland_tanker_delivery | Keep externally supplied fuel/energy separate from actual cargo-derived fuel withdrawals. Cargo actually used for useful propulsion, heat, inert-gas generation or auxiliary duty requires compatible native upstream fuel supply once after provider reconciliation, regardless of title or purchaser. Actual cargo withdrawal to energyless GCU/flare/destruction/abatement is recorded separately on original cargo-species mass, with actual abatement fuel/energy/materials and reaction/exhaust species, not useful propulsion fuel or export credit. It does not automatically add upstream manufacture of destroyed cargo; actual replacement retains its evidenced responsibility. Initial/opening/customer-owned vessel/tug fuel, electricity or battery energy needs compatible source supply/charging once regardless of title/purchaser. Source purchase, storage and subsequent withdrawal/use are linked events, not additive supplies. Internal generated electricity/steam/cold or reliquefaction is not a second external purchase or additional cargo output. No universal boil-off, density, calorific or emission factor. |  |\n| providers_life | inland_tanker_delivery | Assign one real carrier/shipper/charterer/terminal/tug/reception owner to each native event, supply, asset and phase/site/period cell. Compatible complete providers replace exact covered cells once; complete mandatory uncovered duties and lifecycle. Actual tanker/barge/tank/containment/cargo-system, pusher/tug/driver, shore/terminal/berth and relevant lock/waterway works need native construction/initial/replacement/maintenance/retirement and positive same-asset all-user lifetime demand, not full assets per voyage/kg or financial-fee allocation by default. |  |\n| fates_environment | inland_tanker_delivery | Trace actual residue/heel, vapour return/recovery/reception, tank wash/slop, oily bilge/sludge, ballast/cooling water, sewage/garbage, retired materials and direct releases at actual source/receiver and route compartment. Inland water may be fresh, brackish, marine-influenced or otherwise specified; no default receiving compartment. Collected waste and retained/recovered product are not direct emission; unknown imbalance is not automatically leak, vent, waste or complete cargo release. CDNI regional context does not impose a universal wash/vent schedule, legal limit or ownership rule. | cdni-cargo-vapour-context |\n\n"
