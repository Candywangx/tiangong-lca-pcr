      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| accepted_delivery | inland_tanker_delivery | Verify real inland special-tanker delivery service for 1 kg actual specified accepted bulk liquid/gas cargo,original/genuine amended composition/phase/quality gates and positive comparable M. Actual route/distance/time/temperature/pressure and compatible mass basis mandatory; capacity, loaded or fuel-used cargo, heel, vapour returns, invoices or off-spec stock do not establish accepted output. |  |\n| scope_support | inland_tanker_delivery | Verify full crude-oil/all-other bulk-liquid/gas tanker scope,actual self-propelled/pushed/towed and required carrier heating/cooling/pressure/reliquefaction/inerting/loading/cleaning/vapour-return duties. Independent initial manufacture/liquefaction and other modes stay outside actual transport gate. Regional or marine rules cannot be treated as universal inland law. |  |\n| fuel_provider_life | inland_tanker_delivery | Reconcile actual external energy versus cargo-fuel withdrawal,upstream native source supply/charging once regardless of title/purchaser or initial/opening stock, linked source-withdrawal-use without duplicate supply, stock/useful burn/slip/vent and separate original-species energyless abatement and internal generation without duplicate purchases/provider cells. Verify complete real duty,all users/sites/periods,positive same-asset life and exclusive construction/initial/replacement/maintenance/retirement; M=0 retains burden without finite intensity. |  |\n| cargo_fates_receiver | inland_tanker_delivery | Reconcile actual component/liquid/vapour/heel/return/recovery/useful-fuel/energyless-abatement/waste/direct-release custody and actual replacement responsibility with native mass/state and true source/receiver. Phase change inside tanks is not air emission. Actual energyless destruction withdrawal uses original cargo-species mass, with separately supported reaction/exhaust species rather than cargo mass copied as CO2. No useful-energy/export credit or automatic fresh upstream cargo manufacture follows from destruction; real abatement inputs/releases and actual replacement responsibility remain included once. Actual route receiving water/air/soil compartment required,no freshwater default or unknown balance assigned to leak/vent/waste. |  |\n| identity_projection | inland_tanker_delivery | Every real exchange needs atomic row,type/direction,state/function,native property/unit/quantity,source/receiver and same-process protocol or registered unresolved requirement. Verify bilingual references/cards/normative methods/profile and current generated projection. Target pass does not establish exact UUID,operating safety,legal compliance,scientific or publication approval. |  |\n| atomic_inland_tanker_delivery | inland_tanker_delivery | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
