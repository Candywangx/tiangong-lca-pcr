  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "I_x = A_x / M,where A_x is actual native quantity attributed to the coherent accepted-cargo delivery cohort after direct/causal all-user attribution;M is positive actual accepted delivered cargo kg on the original declared basis. M=0 retains burden without finite intensity."
      inputs:
        - A_x
        - M
      output: "native inventory per kg accepted cargo delivery"
      source_ids: []
    - id: supplier_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s,with compatible provider inventory q_u per native unit u,actual same-unit demand D_u and evidenced cohort/all-user share s. Replace exact covered cells before A_x/M once;no automatic kg/volume/tkm/voyage conversion."
      inputs:
        - q_u
        - D_u
        - s
        - M
      output: "attributed native provider inventory"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life,with actual native delivered asset quantity Q_asset and compatible same-asset duties U_studied/U_life. U_life is positive documented all-user useful lifetime duty. I_asset = A_asset / M once;construction/initial,replacements,maintenance and retirement separately close."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - M
      output: "native asset quantity per kg delivery"
      source_ids: []
    - id: cargo_component_custody
      applies_to: "each actual cargo component"
      rule: "Opening + received_external = accepted_external_delivery + returned_external + recovered_external + consumed_as_fuel + destroyed_or_abated_cargo + actual_waste_transfer + evidenced_direct_release + closing + unresolved_residual,on each compatible measured component/native basis. Terms mutually exclusive;internal liquid/vapour change,recirculation,reliquefaction and internal return cancel within the declared boundary. consumed_as_fuel is original cargo-species mass used for useful energy and requires compatible upstream fuel supply once after provider coverage regardless of title/purchaser or opening stock, without duplicate source purchase/withdrawal. destroyed_or_abated_cargo is disjoint actual original-species custody withdrawal to energyless GCU/flare/destruction, not useful fuel, accepted delivery or energy credit; it does not automatically require fresh cargo manufacturing. Actual abatement inputs and reaction/exhaust species are traced separately with supported species/element relations, not CH4 mass copied as CO2. Downstream exhaust/unburned fate from that same withdrawal is not counted again in original-cargo direct-release custody. Unknown residual is investigated,not assigned as boil-off-to-air,waste or combustion."
      inputs:
        - Opening
        - received_external
        - accepted_external_delivery
        - returned_external
        - recovered_external
        - consumed_as_fuel
        - destroyed_or_abated_cargo
        - actual_waste_transfer
        - evidenced_direct_release
        - closing
        - unresolved_residual
      output: "reconciled cargo component,phase and fuel custody"
      source_ids: []
    - id: stock_fate
      applies_to: "external fuel,refrigerant,inert gas and support materials"
      rule: "Opening + supplied + transfers_in = closing + consumed + transferred_out + recovered_external + evidenced_release + unresolved_residual. Use actual compatible native units and mutually exclusive terms;internal recovery retained in closing stock is not additional external output. Actually consumed initial/opening/customer-owned fuel or energy also needs compatible native upstream source supply/charging once regardless of title/purchaser; source purchase and withdrawal/use are linked, not additional supplies. Real conversion/combustion products require their own actual species relation;unknown residual is investigated,not automatic air,water,waste or full charge leak."
      inputs:
        - Opening
        - supplied
        - transfers_in
        - closing
        - consumed
        - transferred_out
        - recovered_external
        - evidenced_release
        - unresolved_residual
      output: "reconciled native support stock and fate ledger"
      source_ids: []
  data_quality_requirements:
    - id: basis_acceptance
      applies_to: "reference output"
      requirement: "Original/genuine amended cargo composition/phase/quality and mass basis,calibrated native quantity/state conversion,custody acceptance and actual route/distance/time/temperature/pressure substantiate comparable M. Keep capacity,loaded/heel/vapour/fuel-used or invoiced mass separate;preserve failed and off-quality burdens."
      evidence: "cp_service;cp_cargo"
    - id: atomic_route
      applies_to: "every actual exchange"
      requirement: "All real conditional propulsion/tow/cargo-support/material/fate branches require concrete atomic identity,type/direction,state/function,source/receiver,native quantity/property/unit and own-process evidence. Absence needs actual affirmative record;missing is not zero."
      evidence: "cp_operation;cp_cargo;cp_fates;cp_maintenance;cp_emissions"
    - id: provider_life
      applies_to: "provider and asset rows"
      requirement: "Document exact covered phase/event/site/period cells,actual all-user compatible duty and positive same-asset lifetime denominator. Complete uncovered construction/initial,replacement,maintenance,retirement and carrier gap responsibility;forecasts and cargo-fuel supply overlap retain evidence/sensitivity."
      evidence: "cp_assets;cp_provider"
    - id: sites_periods
      applies_to: "shared pools"
      requirement: "Index every contributing tanker/tank/pusher/tug/terminal/lock-waterway/provider and reporting/lifecycle period with all actual intended outputs/users. Aggregate attributed native raw quantities before division by coherent M,not means of unlike cargo/route/state intensities."
      evidence: "cp_service;cp_assets;cp_operation"
    - id: fates_receiver
      applies_to: "cargo,resource and environmental transfers"
      requirement: "Trace actual component liquid/vapour/heel/return/fuel/recovery/waste/release states and replacement ownership. Real water resource/source and receiving fresh/brackish/marine/other compartment,actual species/carbon origin and provider coverage required;unknown balance cannot become default environmental fate."
      evidence: "cp_cargo;cp_fates;cp_emissions"
validation_rules:
  - rule_id: accepted_delivery
    applies_to: "inland_tanker_delivery"
    rule: "Verify real inland special-tanker delivery service for 1 kg actual specified accepted bulk liquid/gas cargo,original/genuine amended composition/phase/quality gates and positive comparable M. Actual route/distance/time/temperature/pressure and compatible mass basis mandatory; capacity, loaded or fuel-used cargo, heel, vapour returns, invoices or off-spec stock do not establish accepted output."
    source_ids: []
  - rule_id: scope_support
    applies_to: "inland_tanker_delivery"
    rule: "Verify full crude-oil/all-other bulk-liquid/gas tanker scope,actual self-propelled/pushed/towed and required carrier heating/cooling/pressure/reliquefaction/inerting/loading/cleaning/vapour-return duties. Independent initial manufacture/liquefaction and other modes stay outside actual transport gate. Regional or marine rules cannot be treated as universal inland law."
    source_ids: []
  - rule_id: fuel_provider_life
    applies_to: "inland_tanker_delivery"
    rule: "Reconcile actual external energy versus cargo-fuel withdrawal,upstream native source supply/charging once regardless of title/purchaser or initial/opening stock, linked source-withdrawal-use without duplicate supply, stock/useful burn/slip/vent and separate original-species energyless abatement and internal generation without duplicate purchases/provider cells. Verify complete real duty,all users/sites/periods,positive same-asset life and exclusive construction/initial/replacement/maintenance/retirement; M=0 retains burden without finite intensity."
    source_ids: []
  - rule_id: cargo_fates_receiver
    applies_to: "inland_tanker_delivery"
    rule: "Reconcile actual component/liquid/vapour/heel/return/recovery/useful-fuel/energyless-abatement/waste/direct-release custody and actual replacement responsibility with native mass/state and true source/receiver. Phase change inside tanks is not air emission. Actual energyless destruction withdrawal uses original cargo-species mass, with separately supported reaction/exhaust species rather than cargo mass copied as CO2. No useful-energy/export credit or automatic fresh upstream cargo manufacture follows from destruction; real abatement inputs/releases and actual replacement responsibility remain included once. Actual route receiving water/air/soil compartment required,no freshwater default or unknown balance assigned to leak/vent/waste."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "inland_tanker_delivery"
    rule: "Every real exchange needs atomic row,type/direction,state/function,native property/unit/quantity,source/receiver and same-process protocol or registered unresolved requirement. Verify bilingual references/cards/normative methods/profile and current generated projection. Target pass does not establish exact UUID,operating safety,legal compliance,scientific or publication approval."
    source_ids: []
  - rule_id: atomic_inland_tanker_delivery
    applies_to: "inland_tanker_delivery"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified inland special-tanker accepted bulk-cargo delivery inventory for downstream process/lifecyclemodel projections"
  allowed_use: "Actual qualified accepted bulk-liquid/gas delivery mass with harmonized cargo composition/phase/basis,gates,route/distance/time/temperature/pressure/quality and complete attributable vessel/tow/support lifecycle after required identity/data review."
  excluded_use: "Unqualified cargo kg across unlike routes/states;ordinary goods manufacture/initial liquefaction,independent other-mode functions;heel/vapour/fuel-used/retained cargo as accepted output;freshwater or all vapour-to-air defaults;unresolved facts treated as zero."
  required_metadata: "actual_named_bulk_cargo_composition_grade_and_phase; original_cargo_mass_basis_density_state_and_sampling; real_receipt_delivery_custody_gates_and_accepted_quality; actual_inland_route_distance_time_current_draft_locks_waterbody; real_tanker_tankbarge_pusher_tow_configuration; comparable_accepted_delivered_cargo_mass_M_not_capacity_or_fuelusedcargo; empty_ballast_manoeuvre_anchor_berth_failure_return_duties; native_external_fuel_shore_energy_vs_internal_generation; actual_cargo_to_fuel_withdrawal_upstream_supply_burn_slip_once; actual_thermal_pressure_reliquefaction_inert_purge_vapourreturn_cleaning_duties; heel_vapour_stock_return_recovery_waste_emission_native_custody; all_user_same_asset_vessel_tank_cargo_system_tug_port_waterway_life; native_provider_covered_phases_sites_periods_and_required_gaps; actual_source_receiver_compartment_not_default_freshwater"
