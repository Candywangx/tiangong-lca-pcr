allocation_rules:
  - rule_id: direct_first
    applies_to: "inland_tanker_delivery"
    rule: "Directly assign actual dedicated cargo/tank/handling/condition resources before residual shared-vessel, tug, terminal or waterway pool attribution. Enumerate all independent accepted cargo deliveries and other intended functions with real gates. Entrusted goods, internal phase changes/transfers and own support tasks are not competing final services."
    source_ids:
      - ghg-product-2011
  - rule_id: causal_users
    applies_to: "inland_tanker_delivery"
    rule: "Use supported actual work, compatible mass-distance, occupied volume/time, propulsion/tow/current/draft or thermal/pressure duty and metered native resources for the real pool. All actual served cargoes/users/sites/periods participate. Empty/ballast/cleaning/degassing/failure/return duty remains in its evidenced serving pool once; nominal capacity, tariffs, equal fractions or adding unlike cargo units are not default drivers."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "inland_tanker_delivery"
    rule: "Attribute actual native delivered tanker/tank/cargo-system/pusher/tug/terminal/lock-waterway asset quantity by studied compatible duty divided by positive documented same-asset all-user useful lifetime duty, then/M once. Include all real cargoes, transport/support functions, sites and periods where served. Construction/initial, replacements, maintenance and retirement are exclusive; forecasts retain evidence and sensitivity."
    source_ids: []
  - rule_id: residue_failure
    applies_to: "inland_tanker_delivery"
    rule: "Retain off-quality, lost, failed, partial, returned or retained cargo/support duty at actual owner and period without fictitious accepted mass. Actual cargo-to-fuel supply, cargo replacement, recovered vapour/product, waste treatment and direct release are distinct and counted once. No automatic cargo-production, recovered-fuel, avoided-energy or other credit; genuine amended acceptance cannot retrospectively erase failure."
    source_ids: []
