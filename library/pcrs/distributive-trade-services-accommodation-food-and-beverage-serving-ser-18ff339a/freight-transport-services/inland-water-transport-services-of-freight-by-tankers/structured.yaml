product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.inland-water-transport-services-of-freight-by-tankers"
  classification_refs: "CPC 3.0 65222; exact"
  covered_products: "This PCR covers inland-water transport in special tankers of crude oil and other bulk liquids or gases, including actual natural gas, methane, refined petroleum products and every other qualifying bulk cargo. It is not restricted to petroleum, LNG, dangerous goods, self-propelled vessels or one region. Actual cargo composition, grade, phase, temperature/pressure, tanker or tank-barge and pusher/tow configuration, route, distance, duration, required quality and accepted custody gates define the service. Actual waterbody and receiving compartment are recorded; inland navigation does not by itself prove freshwater."
  excluded_products: "Exclude independent sea/coastal, road, rail or pipeline legs, other inland freight functions outside special-tanker bulk carriage, and independent cargo manufacture, extraction, refining, initial liquefaction or downstream storage/use beyond the actual transport interface. Necessary carrier-owned loading/unloading, stripping, heating/cooling, pressure control, actual reliquefaction, inerting/purging, vapour return, cleaning, degassing and terminal duties remain included when owed by the actual carriage function. Regional inland-waterway examples provide limited qualitative context only; no marine-specific or regional rule is imposed on every inland route."
  representative_product: "Inland tanker delivery service for actual specified bulk liquid or gas cargo"
  production_route: "Actual qualified inland special-tanker cargo delivery with owed vessel/tow/cargo-system/terminal duty and complete attributable lifecycle."
  market_state: "Inland tanker delivery service for actual specified bulk liquid or gas cargo"
functional_unit:
  what: "Inland tanker delivery service for actual specified bulk liquid or gas cargo"
  how_much: "Inland special-tanker carriage delivery of 1 kg actual accepted specified bulk liquid/gas on the predeclared cargo basis"
  how_well: "Actual named composition/grade/phase,cargo basis,receipt/delivery gates,route/distance,pressure/temperature,duration and accepted original/genuine amended quality."
  how_long_or_cycle: "Actual tanker transfer/reporting period and attributable complete voyage,condition,tow/terminal duty and lifecycle intervals."
