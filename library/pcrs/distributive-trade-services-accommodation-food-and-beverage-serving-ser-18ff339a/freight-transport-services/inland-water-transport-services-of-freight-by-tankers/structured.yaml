system_boundary:
  rules:
    - rule_id: full_scope
      applies_to: "inland_tanker_delivery"
      rule: "Apply full actual inland special-tanker bulk-liquid/gas carriage, including crude oil and other actual liquids/gases. Record real cargo/tank/propulsion or pusher/tow configuration and route/environment; no one-fuel, LNG-only, dangerous-goods-only or freshwater-only subset. Independent other-mode, initial manufacture/liquefaction and downstream functions remain distinct beyond actual gates."
      source_ids:
        - unsd-inland-tanker-2025
    - rule_id: cargo_acceptance
      applies_to: "inland_tanker_delivery"
      rule: "Define original/genuine chronological amended composition, grade, phase, mass basis and actual custody/quality gates. M is actual accepted delivered cargo kg on that basis. Use calibrated direct mass or compatible measured density/state/composition; vapour return, heel, recirculation, cargo fuel withdrawal, off-spec returns and nominal capacity do not inflate accepted output. A genuine contractual mixture includes its actual required constituents once, not opportunistic dilution or denominator switching."
      source_ids: []
    - rule_id: inland_duty
      applies_to: "inland_tanker_delivery"
      rule: "Include actual loaded/empty/ballast sailing, pusher/tow coupling and propulsion, manoeuvring, lock/bridge/port passage, current/water-level/draft constraints, waiting/anchor/berth, failed/recovery/return duties and included cargo-system support. Record actual distance/time and contributing units; a tug change, tank transfer or lock passage is not an extra final cargo delivery."
      source_ids: []
    - rule_id: cargo_support
      applies_to: "inland_tanker_delivery"
      rule: "Record actual ship/shore loading, unloading, stripping, pumps/compression, heat/cold, pressure control, insulation/reliquefaction, inert/purge gas or steam and cargo-system cleaning/drying/degassing at real carrier/terminal gates. Actual liquid/vapour states and source/destination, including vapour return and retained stock, require native quantities and one responsibility owner. Neither every cargo needing cooling nor every vapour venting to air is presumed. These are actual-service collection requirements;regional examples do not prescribe universal operating conditions."
      source_ids:
        - cdni-cargo-vapour-context
    - rule_id: cargo_fuel_energy
      applies_to: "inland_tanker_delivery"
      rule: "Keep externally supplied fuel/energy separate from actual cargo-derived fuel withdrawals. Cargo actually used for useful propulsion, heat, inert-gas generation or auxiliary duty requires compatible native upstream fuel supply once after provider reconciliation, regardless of title or purchaser. Actual cargo withdrawal to energyless GCU/flare/destruction/abatement is recorded separately on original cargo-species mass, with actual abatement fuel/energy/materials and reaction/exhaust species, not useful propulsion fuel or export credit. It does not automatically add upstream manufacture of destroyed cargo; actual replacement retains its evidenced responsibility. Initial/opening/customer-owned vessel/tug fuel, electricity or battery energy needs compatible source supply/charging once regardless of title/purchaser. Source purchase, storage and subsequent withdrawal/use are linked events, not additive supplies. Internal generated electricity/steam/cold or reliquefaction is not a second external purchase or additional cargo output. No universal boil-off, density, calorific or emission factor."
      source_ids: []
    - rule_id: providers_life
      applies_to: "inland_tanker_delivery"
      rule: "Assign one real carrier/shipper/charterer/terminal/tug/reception owner to each native event, supply, asset and phase/site/period cell. Compatible complete providers replace exact covered cells once; complete mandatory uncovered duties and lifecycle. Actual tanker/barge/tank/containment/cargo-system, pusher/tug/driver, shore/terminal/berth and relevant lock/waterway works need native construction/initial/replacement/maintenance/retirement and positive same-asset all-user lifetime demand, not full assets per voyage/kg or financial-fee allocation by default."
      source_ids: []
    - rule_id: fates_environment
      applies_to: "inland_tanker_delivery"
      rule: "Trace actual residue/heel, vapour return/recovery/reception, tank wash/slop, oily bilge/sludge, ballast/cooling water, sewage/garbage, retired materials and direct releases at actual source/receiver and route compartment. Inland water may be fresh, brackish, marine-influenced or otherwise specified; no default receiving compartment. Collected waste and retained/recovered product are not direct emission; unknown imbalance is not automatically leak, vent, waste or complete cargo release. CDNI regional context does not impose a universal wash/vent schedule, legal limit or ownership rule."
      source_ids:
        - cdni-cargo-vapour-context
