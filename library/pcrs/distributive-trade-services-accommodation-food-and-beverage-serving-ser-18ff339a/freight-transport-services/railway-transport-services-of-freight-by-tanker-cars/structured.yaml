  calculation_rules:
    - id: normalize
      applies_to: "rail_tank_carriage"
      rule: "For each actual row x, q_x = allocated_native_quantity_x / W after causal duty/provider/stock closure; W > 0. Reference final service = 1 tkm."
      inputs:
        - "Native records"
        - "all-user allocation"
        - "completed equivalent W"
      output: "Per-reference native quantity"
      source_ids:
        - ghg-product-2011
    - id: asset_share
      applies_to: "rail_tank_carriage"
      rule: "Attributed manufacture = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty; then divide by W. Only verified manufacture coverage is included in this term."
      inputs:
        - "Same asset cohort"
        - "native quantity"
        - "all-user duty"
      output: "Attributed native asset manufacture"
      source_ids:
        - ghg-product-2011
    - id: custody
      applies_to: "rail_tank_carriage"
      rule: "Customer bulk cargo remains custody inventory, separate from locomotive fuel and support supplies even if chemically identical. By actual compound/material and phase, tank/compartment and period, opening cargo plus pickups equals accepted handoff plus actual outward returns/transfers, outgoing collected waste, direct releases and closing cargo, all mutually exclusive. Retained heel belongs closing stock only; residue is a physical state classified once, not an additional balance term. Vapor returning to the consignor/recovery or remaining onboard is not atmospheric emission. Vent, boil-off, dissolved/collected material and spill need actual receiver and mass; volume/pressure changes do not by themselves prove mass loss."
      inputs:
        - "Custody stock"
        - "delivery and actual losses"
      output: "Material/species mass closure before normalization"
      source_ids:
        - ghg-product-2011
    - id: eligible_work
      applies_to: "rail_tank_carriage"
      rule: "Define qualified completed rail transport work from unique consignment/segment acceptance and actual net cargo mass with its real liquid/gas state. W_tkm = sum(m_eligible_kg_s * d_eligible_km_s) / 1000. Each actual segment/handoff is counted once under the predeclared completion boundary; m_eligible excludes retained/undelivered or lost material for later segments and never includes tank/car tare, locomotive, packaging or other cargo. Distinguish actually loaded physical payload and failed/lost service from eligible accepted work. Eligible actual route distance excludes duplicated interchange/stage counts, yard loops, empty/reposition and support-only motion. Preserve actual detours/service path and distance convention; do not add service output by needless loops. Only portions completed and accepted under the original predeclared obligation, or an independently documented contemporaneously accepted segment/amended service, may enter W_tkm. Earlier travel of cargo later failing the original obligation is not automatically successful work; never retrospectively shrink a failed scope to create accepted output. Retain all related burdens and outcomes."
      inputs:
        - "Actual eligible net cargo kg and completed rail segment km"
        - "acceptance/loss/stock records"
      output: "W_tkm"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: completeness
      applies_to: "rail_tank_carriage"
      requirement: "Expand every actual conditional energy/material/inerting agent/heating medium, asset, provider service, waste and emitted compound into an individual row with one existing process, direction/type, real identity/state/gate/receiver, native property/unit and quantity, verified UUID or registered unresolved identity, own-node protocol/source and supported calculation. Distinguish compound versus C/N/S, fossil/biogenic, actual PM size, air/water/soil and collected fates. Missing quantities or phase/gate/receiver evidence is incomplete, never zero."
      evidence: "Row-addressable expansion and no missing-as-zero audit"
    - id: representative
      applies_to: "rail_tank_carriage"
      requirement: "Enumerate actual vehicles, washbays, terminals, countries, periods and cargo/thermal/technology strata. Aggregate equivalent functions by actual completed W with disclosed distribution; route averages never silently erase non-equivalent load/distance/quality."
      evidence: "Contributing-unit register, accepted outputs and weighting evidence"
    - id: uncertainty
      applies_to: "rail_tank_carriage"
      requirement: "Calibration, sample coverage, stock reconciliation, model applicability and independent QA are required. No default loss, lifespan, fuel factor, allocation fraction or numerical Range. If a model is necessary retain data provenance and uncertainty before use."
      evidence: "Meter certificates, model references, uncertainty and independent sample"
validation_rules:
  - rule_id: scope_work
    applies_to: "rail_tank_carriage"
    rule: "Check complete official liquid/gas tank-car rail scope, actual rail configuration/cargo state and unique accepted transport-work reference. Verify W_tkm from raw segment cargo masses, eligible distances and original completion/acceptance evidence or independent contemporaneous accepted-segment/amended-service evidence; earlier travel of later-failed cargo is not automatically output, and failed scope cannot be shrunk retrospectively. No wagon tare, later lost/retained mass, duplicated stages or empty/yard-loop work output."
    source_ids:
      - ghg-product-2011
  - rule_id: closure
    applies_to: "rail_tank_carriage"
    rule: "Close all cargo species/phase custody and exclusive heel/return/waste/vapor/spill fates, loco/tank/terminal/yard duties, positive work and all-user/provider/asset coverage. Missing native quantity, phase/condition, coverage or fate makes actual package incomplete."
    source_ids:
      - ghg-product-2011
  - rule_id: native_identity
    applies_to: "rail_tank_carriage"
    rule: "Resolve final exchanges by verified actual native flow/property/unit/gate/receiver. Reference tkm notation equals the verified t*km unit, not a new basis. Native property/unit-group support does not identify rail-tanker product UUID. Actual inerting/heating/cleaning/emission species cannot inherit near-match identities."
    source_ids:
      - ghg-product-2011
  - rule_id: parity_quality
    applies_to: "rail_tank_carriage"
    rule: "Match bilingual/projection row/rule/protocol ids, formulas, constants and actual conditional rail routes; require calibrated measurements or compatible models with independent QA and uncertainty. Source domain limits are explicit; no checker pass proves external identity verification or legal/scientific readiness."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_rail_tank_carriage
    applies_to: "rail_tank_carriage"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
