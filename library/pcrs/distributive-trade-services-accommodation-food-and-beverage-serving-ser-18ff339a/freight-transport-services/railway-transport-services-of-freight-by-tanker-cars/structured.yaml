      collection_method: "Carrier custody tickets, calibrated delivery/vehicle logs and consignment acceptance; join real journey/compartment/period and provider coverage. Independently reconcile cargo mass and all service obligations before allocation and divide once by positive W. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "tkm; kg; km; actual native units"
      frequency: "Every consignment, custody event and provider result"
      temporal_coverage: "Full declared service cohort including failed/empty duties"
      site_scope: "All actual routes, receiving sites and responsible providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Custody/acceptance and calibrated cargo/route records Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_energy
      process_id: "rail_tank_carriage"
      flow_role: "energy and emissions"
      record_type: "collected_record"
      raw_fields: "event_id; locomotive_id; consist_id; tank_car_id; rail_segment_id; shunting_event_id; meter_or_fuel_stock; purchase_opening_closing_transfer_spill_burn; actual_grade_composition_density; auxiliary_and_traction_stage; native_unit; supplier_gate; gross_net_and_loss; species_medium_method_factor_uncertainty; all_user_duty"
      collection_method: "Read calibrated fuel/energy meters and opening/closing inventory; separate cargo from fuel, actual stages and supplier/native boundaries. Record measured species or reviewed compatible model with carbon/mass balance and independent QA; assign all duties and normalize once. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "kg; MJ; actual native units"
      frequency: "Every duty and meter interval"
      temporal_coverage: "Full cohort and associated operational duties"
      site_scope: "Each locomotive/consist/tank-car/yard/terminal and actual supply geography"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibrations, invoices, fuel composition, model provenance and QA Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_cleaning
      process_id: "rail_tank_carriage"
      flow_role: "tank cleaning and cargo conditioning"
