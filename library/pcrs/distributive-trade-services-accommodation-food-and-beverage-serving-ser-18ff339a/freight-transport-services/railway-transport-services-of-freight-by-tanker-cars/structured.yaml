    reference: "OTIF-hosted CEFIC Filling and discharging of rail tank-wagons, four liquid checklists. https://www.otif.org/fileadmin/user_upload/otif_verlinkte_files/05_gef_guet/07_rid_verweis/1.4.3.3-1.4.3.7.1_E_CEFIC-Checklist.pdf"
