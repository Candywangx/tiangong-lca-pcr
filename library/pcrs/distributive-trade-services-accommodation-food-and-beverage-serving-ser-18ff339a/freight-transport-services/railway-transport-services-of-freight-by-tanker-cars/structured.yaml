          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| subdivide | rail_tank_carriage | Use direct measurements/subdivision by actual locomotive/consist/tank car/cargo compound/segment, yard and terminal duty. Enumerate every co-carried product and other service user, not only eligible liquid/gas work. Mainline and switcher, loaded and empty, tank thermal and terminal duties remain distinct before shared allocation. | ghg-product-2011 |\n| causal | rail_tank_carriage | Where indivisible traction remains, justify actual causal train/segment grossload-resistance, space, route or duty allocation, distinguishing physically hauled tank/locomotive/support payload from net accepted cargo-work output. Allocate cargo-specific heating/inerting/cleaning by its actual process/time/state, not generic all-train tonnekm shares. Reconcile all-user burden shares, apply once; justify and test alternatives if physical relationship unavailable. No universal load factor, empty ratio, fuel intensity or equal-wagon share. | ghg-product-2011 |\n| life_period | rail_tank_carriage | Manufacture attributed_quantity = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty, separately per tank-car, locomotive and each infrastructure/equipment cohort. Complete other lifecycle phases once and retain actual run/campaign/period/replacement/retirement ownership. Cargo stocks and retained heels are not capital assets or free recycled product; no automatic recovery/avoided-production credit. | ghg-product-2011 |\n| normalize | rail_tank_carriage | W is positive actual qualified completed work W_tkm in the declared strata. For each native exchange q_x = allocated_native_quantity_x / W_tkm for a 1 tkm reference. Cargo/phase mass and eligible distance follow work_gate; no Count/vehicletrip/tank fill/nominal capacity/gross train tonne-km substitution. Failed/empty/cleaning/yard burdens remain causally attributable even when they produce no eligible W; W=0 yields no finite intensity. Different cargo/temperature/pressure/route/duration and provider coverage require actual strata/distribution before comparison. | ghg-product-2011 |\n\n"
