system_boundary:
  rules:
    - rule_id: scope
      applies_to: "rail_tank_carriage"
      rule: "This PCR covers railway carriage of crude oil, natural gas, refined petroleum products and other bulk liquids or gases in special tank cars, including actual ambient, heated, pressurized, liquefied or cryogenic configurations and all actual traction routes. Resolve permanently mounted gas-tube/battery equipment from actual special tank-car function and classification, not an unsupported blanket inclusion/exclusion. Exclude intermodal tank-container carriage as a container service, packaged cargo, dry-bulk tank-shaped wagons, road/pipeline/water/air/space transport, bare wagon rental and cargo manufacture/trade."
      source_ids:
        - unsd-cpc3-65122
    - rule_id: rail_duty
      applies_to: "rail_tank_carriage"
      rule: "Start at the declared rail-carrier custody/loading gate and end at accepted unloading/handover, with actual terminal/operator/lessor responsibilities. Record every actual train consist, locomotive, tank car, route segment and yard/shunting event: line haul, assembly/disassembly, coupling/braking, approach/departure, idling, waiting, border/interchange, empty return/reposition, rescue and failed carriage retain causally attributable burdens. Such operational movements are not automatically additional delivered transport work. Different carriers/yards or changed national inventory boundary do not remove actual duty."
      source_ids:
        - epa-rail-facility-operations
        - ghg-product-2011
    - rule_id: tank_terminal
      applies_to: "rail_tank_carriage"
      rule: "Record actual cargo transfer, pumping, heating/steam, pressure holding/relief, cooling/cryogenic support, inerting/purging and vapor-return or degassing paths according to actual cargo state and tank fittings; none occurs on every route. Separate locomotive traction/yard auxiliaries from tank and terminal duties. The CEFIC liquid checklist supports liquid fill/discharge interfaces only and explicitly excludes pressurized gases/solids. RID2025 examples concern its dangerous-goods jurisdiction only; actual applicable cargo/equipment rules govern. No universal filling ratio, temperature/pressure, holding time or inert-gas dose."
      source_ids:
        - cefic-rail-liquid-checklists
        - otif-rid-2025
        - ghg-product-2011
    - rule_id: cargo_stock
      applies_to: "rail_tank_carriage"
      rule: "Customer bulk cargo remains custody inventory, separate from locomotive fuel and support supplies even if chemically identical. By actual compound/material and phase, tank/compartment and period, opening cargo plus pickups equals accepted handoff plus actual outward returns/transfers, outgoing collected waste, direct releases and closing cargo, all mutually exclusive. Retained heel belongs closing stock only; residue is a physical state classified once, not an additional balance term. Vapor returning to the consignor/recovery or remaining onboard is not atmospheric emission. Vent, boil-off, dissolved/collected material and spill need actual receiver and mass; volume/pressure changes do not by themselves prove mass loss."
      source_ids:
        - ghg-product-2011
    - rule_id: work_gate
      applies_to: "rail_tank_carriage"
      rule: "Define qualified completed rail transport work from unique consignment/segment acceptance and actual net cargo mass with its real liquid/gas state. W_tkm = sum(m_eligible_kg_s * d_eligible_km_s) / 1000. Each actual segment/handoff is counted once under the predeclared completion boundary; m_eligible excludes retained/undelivered or lost material for later segments and never includes tank/car tare, locomotive, packaging or other cargo. Distinguish actually loaded physical payload and failed/lost service from eligible accepted work. Eligible actual route distance excludes duplicated interchange/stage counts, yard loops, empty/reposition and support-only motion. Preserve actual detours/service path and distance convention; do not add service output by needless loops. Only portions completed and accepted under the original predeclared obligation, or an independently documented contemporaneously accepted segment/amended service, may enter W_tkm. Earlier travel of cargo later failing the original obligation is not automatically successful work; never retrospectively shrink a failed scope to create accepted output. Retain all related burdens and outcomes."
      source_ids:
        - ghg-product-2011
    - rule_id: assets_energy
      applies_to: "rail_tank_carriage"
      rule: "Keep actual tank-car and locomotive manufacture/assembly, track/ballast/sleepers/points, wheels/bogies/brakes, electrical contact/supply, yards/terminals/pumps/hoses/heating/cleaning facilities and replacements/maintenance/retirement independently complete. Native manufacture only covers its verified gate; same-asset all-user useful duty allocates manufacture, not whole life. Avoid assembly/initial-component and net/grid/recovered-electricity duplication. Diesel/electric/battery/hydrogen/other actual routes under rail_tank_carriage require actual topology, native supply/gate and all duty; no imposed universal technology, asset lifespan or recovery credit."
      source_ids:
        - ghg-product-2011
    - rule_id: provider_cleaning
      applies_to: "rail_tank_carriage"
      rule: "Attribute actual tank cleaning/changeover/decontamination to the proper previous/next cargo campaigns, actual residues/effluent/wastes and responsible receiver; no presumed clean empty car or universal cleaning frequency. Exact railcarrier, locomotive/yard operator, tank/terminal heating, washing and treatment provider results in native units replace only their covered cells once. Retain uncovered duty and lifecycle; railwork output cannot be added again through overlapping carrier/interchange bills or tank rental."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic
      applies_to: "rail_tank_carriage"
      rule: "Expand every actual conditional energy/material/inerting agent/heating medium, asset, provider service, waste and emitted compound into an individual row with one existing process, direction/type, real identity/state/gate/receiver, native property/unit and quantity, verified UUID or registered unresolved identity, own-node protocol/source and supported calculation. Distinguish compound versus C/N/S, fossil/biogenic, actual PM size, air/water/soil and collected fates. Missing quantities or phase/gate/receiver evidence is incomplete, never zero."
      source_ids:
        - ghg-product-2011
