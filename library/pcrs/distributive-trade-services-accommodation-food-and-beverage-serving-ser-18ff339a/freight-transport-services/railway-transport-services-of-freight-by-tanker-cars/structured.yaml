  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified actual rail tank-car bulk-liquid/gas freight transport work for process/lifecyclemodel use"
  allowed_use: "Equivalent qualified rail tank-car liquid/gas freight work with actual W_tkm, conditions and verified final exchanges"
  excluded_use: "Generic railfreight or cargo manufacture, intermodal-container, road/pipeline or bare wagon asset-service substitute; unqualified comparisons across cargo states/route/coverage"
  required_metadata: "cargo_compound_composition_phase_hazard_state; tank_car_type_compartments_pressure_temperature; locomotive_consist_and_actual_traction; rail_origin_destination_eligible_segmentdistance_and_actualgrossdistance; actual_eligible_net_cargo_mass_each_segment_and_W_tkm; acceptance_completion_partial_loss_and_heel_rules; actual_thermal_pressure_inerting_vaporreturn_conditions; linehaul_yard_shunting_empty_reposition_failed_duties; tank_terminal_cleaning_previous_next_campaigns; provider_native_cells_cargo_custody_fates; asset_cohort_all_user_useful_life; tkm_native_t_star_km_alias_and_factor1000; actual_species_receiver_uncertainty"
  required_quality_disclosure: "Measured vs modelled quantities, all-user shares, coverage/uncertainty, unresolved identities and service comparability"
  update_trigger: "Changed cargo state, technology, provider gate, route, allocation, asset life or source evidence"
