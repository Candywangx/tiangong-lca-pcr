allocation_rules:
  - rule_id: subdivide
    applies_to: "rail_tank_carriage"
    rule: "Use direct measurements/subdivision by actual locomotive/consist/tank car/cargo compound/segment, yard and terminal duty. Enumerate every co-carried product and other service user, not only eligible liquid/gas work. Mainline and switcher, loaded and empty, tank thermal and terminal duties remain distinct before shared allocation."
    source_ids:
      - ghg-product-2011
  - rule_id: causal
    applies_to: "rail_tank_carriage"
    rule: "Where indivisible traction remains, justify actual causal train/segment grossload-resistance, space, route or duty allocation, distinguishing physically hauled tank/locomotive/support payload from net accepted cargo-work output. Allocate cargo-specific heating/inerting/cleaning by its actual process/time/state, not generic all-train tonnekm shares. Reconcile all-user burden shares, apply once; justify and test alternatives if physical relationship unavailable. No universal load factor, empty ratio, fuel intensity or equal-wagon share."
    source_ids:
      - ghg-product-2011
  - rule_id: life_period
    applies_to: "rail_tank_carriage"
    rule: "Manufacture attributed_quantity = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty, separately per tank-car, locomotive and each infrastructure/equipment cohort. Complete other lifecycle phases once and retain actual run/campaign/period/replacement/retirement ownership. Cargo stocks and retained heels are not capital assets or free recycled product; no automatic recovery/avoided-production credit."
    source_ids:
      - ghg-product-2011
  - rule_id: normalize
    applies_to: "rail_tank_carriage"
    rule: "W is positive actual qualified completed work W_tkm in the declared strata. For each native exchange q_x = allocated_native_quantity_x / W_tkm for a 1 tkm reference. Cargo/phase mass and eligible distance follow work_gate; no Count/vehicletrip/tank fill/nominal capacity/gross train tonne-km substitution. Failed/empty/cleaning/yard burdens remain causally attributable even when they produce no eligible W; W=0 yields no finite intensity. Different cargo/temperature/pressure/route/duration and provider coverage require actual strata/distribution before comparison."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
