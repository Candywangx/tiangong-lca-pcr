      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual declared carrier pickup/cold-custody start and supporting duty/asset upstream gates |\n| starting_condition_role | Customer cargo custody with actual inlet quality, not consumption of the original product; actual supporting supply and asset gates |\n| product_classification_scope | This PCR covers the complete inland water transport function of frozen or refrigerated goods carried in specially refrigerated compartments. It includes actual river, canal, lake and qualifying inland estuary/tidal-reach operations, self-propelled refrigerator vessels and actual refrigerated compartment/barge services in push/tow convoys. It covers all qualifying goods and actual cold technologies, not fish only, one fuel or one vessel design. Declare the actual inland/coastal interface rather than infer mode from salinity or ship flag. |\n| recursive_input_rule | Recurse actual independently supplied energy/material/asset/service quantities at their native gates, preserve one owner of each covered cell; original cargo manufacture remains outside |\n| upstream_dataset_requirement | Actual grade/state/location/technology/provider and native quantity/gate, source evidence and exact life-cycle/operation coverage before substitution |\n| disclosure | Actual receiving handoff/custody close, retained/returned/rejected cargo disposition and responsible waste/treatment/asset end-of-life gates |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| completion | inland_cold_carriage | One engagement is the originally specified inland cold-carriage obligation for a declared manifest quantity, cargo identity/state, pickup, actual inland route and custody interval, receiving handoff and temperature/time/quality acceptance. Count the engagement once only when that original obligation is completed and accepted. An independently documented contemporaneous accepted segment or amended engagement can qualify on its own declared function; do not retrospectively shrink failed scope, lower quality limits or count the original and amended service together. Partial/damaged/late/refused consignments are not automatically complete. N is the positive number of equivalent qualified completed engagements; N=0 has no finite service intensity. Actual cargo mass/volume, distance, duration and thermal conditions remain mandatory; Item(s) is a service count, not a vessel, cargo piece, tonne-km or hold-hour. | unsd-cpc65221; ghg-product-2011 |\n| cold_custody | inland_cold_carriage | Declare actual cargo chilled/frozen state and required temperature band, tolerances, permitted excursion duration, humidity/ventilation/atmosphere if relevant, calibrated hold/product sensor locations and custody start/end. Record actual inlet quality, product and air/secondary-fluid time-temperature history, doors/hold openings, loading sequence, heat sources and accepted receiver state. An air setpoint or running compressor alone does not prove product quality or completion. Separate cooling/holding/re-cooling/defrost from independent freezing/processing sold outside this carriage obligation. Prior quality damage is recorded, not reversed by icing; rescue/re-cooling and failed-service burdens remain attributed even where output is refused. No universal frozen-food or fish temperature requirement. | fao-collection; fao-ice-holds; unep-coldchains |\n| inland_duties | inland_cold_carriage | Measure actual main propulsion, pusher/tug and refrigerated barge/hold auxiliary duties separately across sailing, lock approach/passage/queue, tide/current/draft restrictions, port/loading, dwell, empty reposition, rescue and failed journeys. Cooling continues through every actual carrier-responsible interval, including stationary waits. Separate purchased shore AC/DC/heat/cold, onboard engine/generator/compressor/absorption or other evidenced cooling routes, pumps/fans/defrost and ice/PCM/cryogenic supplies. Routes coexist only where actually installed/used; alternative cold sources are not assumed simultaneously. Own generated electricity/cold and recovered heat are internal transfers, not an additional purchased input beside their actual fuel/electricity/assets. Actual fuel withdrawn and consumed from customer initial stock incurs compatible fuel upstream once regardless of title/purchaser; do not charge the whole initial stock or original cargo manufacture. Actual LNG or another propulsion fuel does not exclude an otherwise qualifying refrigerated service. No universal COP, setpoint, fuel mix or lock-wait factor. | eurostat-waterway; usace-locks; ghg-product-2011 |\n| cargo_custody | inland_cold_carriage | Cargo remains customer freight, not an input consumed to manufacture the service. Original farming, fishing, food/product manufacture and pre-existing quality damage are excluded. Record opening and actual inward cargo, exclusive accepted outward delivery, actual outward return, actual waste transfer, direct environmental release and closing stock by lot/state. Retained/undelivered goods belong only to closing stock; damage/spoilage is a state, not a second mass exit. Internal compartment transfer, re-icing or recirculation is not new cargo or another service. Physical state/component ledgers explain thaw drip, moisture uptake, evaporation, respiration or leakage where actually present; do not infer dry-solid loss from wet-mass change. At every moisture observation use measured wet-basis w and M_dry=M_wet*(1-w), or evidenced compatible basis conversion. Wet-mass closure explicitly includes actual added/absorbed water and drained/evaporated water with delivered, returned, retained and discarded water classified once; ice melt is not automatically lost cargo. Reaction-derived gas has a separate supported component/element balance, not an invented mass loss. | ghg-product-2011 |\n| cold_supplies | inland_cold_carriage | For actual refrigerant/secondary fluid/ice/PCM/cryogenic supplies record exact substance, concentration, phase, source, initial/closing stock, makeup, recovery, reuse, destruction and release by source/medium. A charged closed loop is not consumed in full each voyage; replenishment is not automatically equal to leakage, and recovered refrigerant is not the same mass released. Purchased ice includes only its matched gate; onboard ice-making is modeled with actual water/energy/assets, not also purchased ice. Melt/brine/pack contents and discarded packages have distinct exclusive component fates. Cryogenic N2 or CO2 release requires actual substance and origin; do not bind all refrigerant/biogenic/recovered CO2 to fossil engine CO2. | fao-ice-holds; ghg-product-2011 |\n| water_receivers | inland_cold_carriage | Use actual river/canal/lake/estuary/tidal reach, site, season and receiving medium for environmental intakes and discharges; inland is not proof of freshwater, and a maritime-character reach is not automatically sea transport or a marine compartment. Distinguish ballast, engine/condenser cooling, wash/defrost, melt drainage, bilge, sewage and cargo-contaminated streams with actual source, composition, temperature, treatment, receiver and fate. Recirculated secondary coolant or reused water is internal stock; gross circulation is not repeated intake. Captured wastewater/waste and direct release are exclusive. Lock water movement is an actual shared hydraulic service, not automatically consumptive water withdrawal assigned in full to each vessel. | ghg-product-2011 |\n| life_period | inland_cold_carriage | Actual vessel/pusher/tug/refrigerated barge, insulated hold, refrigeration/heat exchanger/pump/fan, battery/generator/ice plant and terminal/shore-power/lock/navigation infrastructure require matching native manufacturing quantity, configuration/BOM and covered gate. Attribute same-cohort full useful life across all relevant users and periods, including empty, idle, failed, other cargo and other functions where actually served. Include uncovered manufacture/installation, maintenance/docking, repair/replacement and retirement/treatment once. Reusable bins/pallets/liners/thermal packs are stocks with opening, purchase, return, repair, loss, retirement and closing quantities, not one new unit per use. No generic vessel age, asset occupancy, replacement life or scrap credit. | ghg-product-2011 |\n| provider_gate | inland_cold_carriage | Enumerate actual carrier, pusher/tug owner/operator, terminal, shore-power/cold/ice supplier, lock/navigation service, cleaning and waste/treatment providers. Native provider quantity is measured at its gate, not forced to one reference engagement. Replace exactly the covered foreground energy, releases, assets or treatment cells once and add only uncovered cells. Bare rental does not prove operations or full asset life included; invoices or ownership alone do not prove scope. | ghg-product-2011 |\n| atomic_inventory | inland_cold_carriage | Expand each conditional card into actual material, species, asset, waste and provider rows with native property/unit, grade/state, location/medium, gate, quantity source, responsibility and covered cells. Fixed bindings apply only to the exact compatible branch; alternatives remain explicit unresolved identities until verified. One source/quantity/coverage cell has one owner. Conditional does not mean zero, and a UUID/checker pass does not prove scientific validity or current legal compliance. | ghg-product-2011 |\n\n"
