      collection_method: "Link original contract/manifest and actual handoff/quality/custody records to each vessel/hold/route and actual carrier/support provider. Verify accepted original function and unique count before normalization; failed scopes are not retrospectively reduced. Enumerate actual independent service outputs, contributors and all-user duties; unlike engagements stay stratified or disclosed as a bounded mixture. Native providers replace only exact covered cells. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
