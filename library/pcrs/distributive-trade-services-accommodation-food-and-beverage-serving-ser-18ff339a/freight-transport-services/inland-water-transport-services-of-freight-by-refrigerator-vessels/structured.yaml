  calculation_rules:
    - id: qualified_count
      applies_to: "inland_cold_carriage"
      rule: "One engagement is the originally specified inland cold-carriage obligation for a declared manifest quantity, cargo identity/state, pickup, actual inland route and custody interval, receiving handoff and temperature/time/quality acceptance. Count the engagement once only when that original obligation is completed and accepted. An independently documented contemporaneous accepted segment or amended engagement can qualify on its own declared function; do not retrospectively shrink failed scope, lower quality limits or count the original and amended service together. Partial/damaged/late/refused consignments are not automatically complete. N is the positive number of equivalent qualified completed engagements; N=0 has no finite service intensity. Actual cargo mass/volume, distance, duration and thermal conditions remain mandatory; Item(s) is a service count, not a vessel, cargo piece, tonne-km or hold-hour."
      inputs:
        - "Original equivalent manifest/route/cold-duty obligations and independent acceptance"
      output: "N"
      source_ids:
        - ghg-product-2011
    - id: normalize
      applies_to: "inland_cold_carriage"
      rule: "Subdivide direct vessel/hold/route/terminal measurements first. Attribute remaining actual shared duties across every cargo/service and all users using evidenced physical causality: actual carried payload with nested packaging counted once for propulsion, constrained hold space and duration, measured thermal/ventilation load or handling requirements for the relevant cell. Net goods, water/ice/packaging and vessel lightship are separate quantities. N is normalization only, not a universal allocation driver. Equivalent declared engagements may be pooled with actual contributor weights; unlike manifests, route distances, cold states or quality obligations require strata or an explicitly declared mixture and comparability limits. Retain empty, return, failed, rescue, lock-delay and changeover burdens in their causal completed-service cohort; do not delete them because no accepted output occurred. Divide attributed native quantities by positive N once."
      inputs:
        - "Actual attributed native quantities and positive N"
      output: "Native quantity per declared 1 Item(s) engagement"
      source_ids:
        - ghg-product-2011
    - id: cold_stock
      applies_to: "inland_cold_carriage"
      rule: "Cargo remains customer freight, not an input consumed to manufacture the service. Original farming, fishing, food/product manufacture and pre-existing quality damage are excluded. Record opening and actual inward cargo, exclusive accepted outward delivery, actual outward return, actual waste transfer, direct environmental release and closing stock by lot/state. Retained/undelivered goods belong only to closing stock; damage/spoilage is a state, not a second mass exit. Internal compartment transfer, re-icing or recirculation is not new cargo or another service. Physical state/component ledgers explain thaw drip, moisture uptake, evaporation, respiration or leakage where actually present; do not infer dry-solid loss from wet-mass change. At every moisture observation use measured wet-basis w and M_dry=M_wet*(1-w), or evidenced compatible basis conversion. Wet-mass closure explicitly includes actual added/absorbed water and drained/evaporated water with delivered, returned, retained and discarded water classified once; ice melt is not automatically lost cargo. Reaction-derived gas has a separate supported component/element balance, not an invented mass loss."
      inputs:
        - "Actual cargo/component/moisture/water observations and exclusive fates"
      output: "Cargo dry-solid/water/state closure and receiver ledger"
      source_ids:
        - ghg-product-2011
    - id: refrigerant_stock
      applies_to: "inland_cold_carriage"
      rule: "Opening+actual inward supply=actual outward recovery/transfer+actual destruction+actual release+closing stock, using mutually exclusive substance/component quantities. Internal circulation, phase change and recovery within boundary are not outward emissions or new purchases. Purchased ice/cryogen and onboard production have exclusive source coverage, and actual melt/vent/retirement fates."
      inputs:
        - "Actual charged/makeup/returned/recovered/destroyed/released stocks"
      output: "Exclusive refrigerant and cooling-material supply/fate closure"
      source_ids:
        - ghg-product-2011
    - id: asset_life
      applies_to: "inland_cold_carriage"
      rule: "attributed_asset = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty; include only uncovered life phases once, then divide positive N. Same-cohort manufacturing gate, actual useful duty and replacement/retirement evidence are required; no invented annual vessel life or multiplication of complete asset and its included parts."
      inputs:
        - "Actual same asset native quantity"
        - "full all-user duty and covered phases"
      output: "Attributed native asset life-cycle quantity"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: strata
      applies_to: "inland_cold_carriage"
      requirement: "Enumerate actual goods, chilled/frozen quality, initial thermal state, vessel/hold/convoy, cooling topology, inland waterbody/current/lock/tidal route, season, terminal/provider and period contributors. Equivalent-function Count weighting requires mandatory manifest quantities, route/duration and acceptance; otherwise retain distinct strata or disclose explicit bounded mixtures. Do not present a generic per-engagement average as comparable across unlike cargo or cold obligations."
      evidence: "Actual contributor function/quantity/condition weights and coverage"
    - id: completeness
      applies_to: "inland_cold_carriage"
      requirement: "Expand each conditional card into actual material, species, asset, waste and provider rows with native property/unit, grade/state, location/medium, gate, quantity source, responsibility and covered cells. Fixed bindings apply only to the exact compatible branch; alternatives remain explicit unresolved identities until verified. One source/quantity/coverage cell has one owner. Conditional does not mean zero, and a UUID/checker pass does not prove scientific validity or current legal compliance."
      evidence: "Actual row source/native/property/gate/stock/fate and covered-cell ledger"
    - id: uncertainty
      applies_to: "inland_cold_carriage"
      requirement: "Use calibrated actual fuel/energy/cargo/temperature/flow/refrigerant measurements or reviewed models applicable to actual machinery, goods and inland conditions, with independent checks, sampling and uncertainty. No invented load factor, empty ratio, speed/current/lock delay, cold setpoint/COP, coolant/refrigerant loss, cargo spoilage, infrastructure life or disposal range. Qualitative sources guide bounded questions, not universal numerical factors or regulatory certification."
      evidence: "Calibration, actual model applicability, independent QA and sensitivity"
validation_rules:
  - rule_id: scope_completion
    applies_to: "inland_cold_carriage"
    rule: "Validate full specially refrigerated inland function, actual inland/coastal and adjacent service classification, original manifest and mandatory quantity/route/time/quality terms, qualified unique acceptance and positive N. No retrospective failed-scope shrinkage or pooled unequal engagement claims without strata/mixture limits."
    source_ids:
      - unsd-cpc65221
      - ghg-product-2011
  - rule_id: duties_quality
    applies_to: "inland_cold_carriage"
    rule: "Check every actual vessel/convoy/hold/lock/terminal loaded/empty/failed/return interval, quality-temperature provenance and exclusive supply topology. Include actual consumed customer-stock fuel upstream once, cold power while waiting and each responsible handoff; air setpoint is not product acceptance."
    source_ids:
      - ghg-product-2011
  - rule_id: stock_fate_native
    applies_to: "inland_cold_carriage"
    rule: "Reconcile lot/component/water/refrigerant/gear stocks, measured moisture bases and actual water changes, internal circulation, exclusive recovered/waste/direct release and actual substance/medium. Verify native property/unit/grade/gate per final row; known environment is never replaced by an unspecified or freshwater identity to obtain a pass."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage_life
    applies_to: "inland_cold_carriage"
    rule: "Check every contributor, all-user same-asset useful-life denominator and uncovered life phases, provider coverage and allocation conservation, then current EN/ZH/projection alignment. Unresolved required actual quantities, identities, fates or quality evidence block final dataset completion, not blanket deletion of conditional rows. Verify unique asset/component/event-to-row ownership across vessel/aircraft, reusable equipment, infrastructure, maintenance and provider cards as applicable; whole-assembly included parts and their separate supplies cannot both enter the same phase inventory."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_inland_cold_carriage
    applies_to: "inland_cold_carriage"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
