product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.inland-water-transport-services-of-freight-by-refrigerator-vessels"
  classification_refs: "CPC 3.0 65221"
  covered_products: "This PCR covers the complete inland water transport function of frozen or refrigerated goods carried in specially refrigerated compartments. It includes actual river, canal, lake and qualifying inland estuary/tidal-reach operations, self-propelled refrigerator vessels and actual refrigerated compartment/barge services in push/tow convoys. It covers all qualifying goods and actual cold technologies, not fish only, one fuel or one vessel design. Declare the actual inland/coastal interface rather than infer mode from salinity or ship flag."
  excluded_products: "Exclude original cargo production/harvest/fishing/processing and trading, independent storage/freezing/processing outside the declared carriage, passenger transport, coastal/ocean refrigerated carriage, and equipment manufacture/rental as the reference service. Resolve adjacent tanker bulk-liquid/gas, container or other inland freight functions from actual equipment and contractual service before classification; cooling a bulk-gas tank or carrying reefer containers does not automatically establish this specially refrigerated-compartment category. Conversely actual LNG used as vessel fuel does not make the cargo a gas-tanker service."
  representative_product: "Qualified completed inland refrigerated-compartment carriage engagement"
  production_route: "Actual inland vessel/convoy refrigerated-compartment pickup, cold custody, navigation/locks/terminal handling and original accepted handoff with attributable full duty and asset life"
  market_state: "Declared qualified completed original manifest/quantity/route/cold-quality engagement"
  parent_activity: "Inland freight carriage with a defined cold-compartment obligation"
  route_delta: "Relative to ambient inland freight: actual controlled compartment/custody, cooling source topology, quality history, refrigerant/coolant fates and insulated/refrigeration asset duty. Mechanical, ice/PCM, heat-driven or other cooling routes coexist only as evidenced; mutually exclusive supply cells are resolved."
  service_mode: "Original engagement and actual vessel/convoy voyage, hold campaign and terminal/lock/cooling periods; continuous machinery does not create repeated service outputs"
  cargo_relationship: "Customer freight under declared custody; all intended co-carriage service handoffs enumerated separately from cargo material stocks and waste"
functional_unit:
  what: "Qualified completed inland refrigerated-compartment carriage engagement"
  how_much: "1 Item(s): one declared qualified service engagement, with mandatory actual manifest amount and route/cold-duty conditions"
  how_well: "One engagement is the originally specified inland cold-carriage obligation for a declared manifest quantity, cargo identity/state, pickup, actual inland route and custody interval, receiving handoff and temperature/time/quality acceptance. Count the engagement once only when that original obligation is completed and accepted. An independently documented contemporaneous accepted segment or amended engagement can qualify on its own declared function; do not retrospectively shrink failed scope, lower quality limits or count the original and amended service together. Partial/damaged/late/refused consignments are not automatically complete. N is the positive number of equivalent qualified completed engagements; N=0 has no finite service intensity. Actual cargo mass/volume, distance, duration and thermal conditions remain mandatory; Item(s) is a service count, not a vessel, cargo piece, tonne-km or hold-hour."
  how_long_or_cycle: "Actual declared pickup/cold-custody start to final receiving handoff/custody end, measured elapsed duration and original voyage/engagement reporting cycle; supporting duty and same-asset all-user useful-life periods are declared separately. Declare actual cargo chilled/frozen state and required temperature band, tolerances, permitted excursion duration, humidity/ventilation/atmosphere if relevant, calibrated hold/product sensor locations and custody start/end. Record actual inlet quality, product and air/secondary-fluid time-temperature history, doors/hold openings, loading sequence, heat sources and accepted receiver state. An air setpoint or running compressor alone does not prove product quality or completion. Separate cooling/holding/re-cooling/defrost from independent freezing/processing sold outside this carriage obligation. Prior quality damage is recorded, not reversed by icing; rescue/re-cooling and failed-service burdens remain attributed even where output is refused. No universal frozen-food or fish temperature requirement."
  reference_flow_link: "qualified_cold_carriage"
