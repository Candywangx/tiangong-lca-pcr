      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| subdivide | inland_cold_carriage | Subdivide direct vessel/hold/route/terminal measurements first. Attribute remaining actual shared duties across every cargo/service and all users using evidenced physical causality: actual carried payload with nested packaging counted once for propulsion, constrained hold space and duration, measured thermal/ventilation load or handling requirements for the relevant cell. Net goods, water/ice/packaging and vessel lightship are separate quantities. N is normalization only, not a universal allocation driver. Equivalent declared engagements may be pooled with actual contributor weights; unlike manifests, route distances, cold states or quality obligations require strata or an explicitly declared mixture and comparability limits. Retain empty, return, failed, rescue, lock-delay and changeover burdens in their causal completed-service cohort; do not delete them because no accepted output occurred. Divide attributed native quantities by positive N once. | ghg-product-2011 |\n| thermal_attribution | inland_cold_carriage | Allocate propulsion/convoy and refrigeration/hold loads separately when causal drivers differ. Use actual metered compressor/shore load or an independently checked applicable heat balance including ambient/water temperature, product/pack load, hold insulation, doors, respiration where real, waiting and duration. Include all occupied/empty/user shares and return duties; a single cargo weight or service count does not automatically explain refrigeration. Demonstrate conservation of allocated quantities and disclose alternatives/sensitivity if causality cannot be established; justified economic allocation needs actual contemporaneous values and clear limits. | ghg-product-2011 |\n| life_attribution | inland_cold_carriage | Actual vessel/pusher/tug/refrigerated barge, insulated hold, refrigeration/heat exchanger/pump/fan, battery/generator/ice plant and terminal/shore-power/lock/navigation infrastructure require matching native manufacturing quantity, configuration/BOM and covered gate. Attribute same-cohort full useful life across all relevant users and periods, including empty, idle, failed, other cargo and other functions where actually served. Include uncovered manufacture/installation, maintenance/docking, repair/replacement and retirement/treatment once. Reusable bins/pallets/liners/thermal packs are stocks with opening, purchase, return, repair, loss, retirement and closing quantities, not one new unit per use. No generic vessel age, asset occupancy, replacement life or scrap credit. | ghg-product-2011 |\n| reject_allocation | inland_cold_carriage | Returned, downgraded, spoiled, melted or discarded cargo is classified by actual custody, quality and receiver. Keep failed cold carriage and corrective burdens with the responsible service cohort; no automatic avoided product manufacture, recovered ice/heat/refrigerant or recycling credit. Separate any genuine intended recovery product with a declared handoff and evidenced allocation/substitution boundary; damage alone does not create a co-product or successful cold-service output. | ghg-product-2011 |\n\n"
