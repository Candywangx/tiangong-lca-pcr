      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_completion | inland_cold_carriage | Validate full specially refrigerated inland function, actual inland/coastal and adjacent service classification, original manifest and mandatory quantity/route/time/quality terms, qualified unique acceptance and positive N. No retrospective failed-scope shrinkage or pooled unequal engagement claims without strata/mixture limits. | unsd-cpc65221; ghg-product-2011 |\n| duties_quality | inland_cold_carriage | Check every actual vessel/convoy/hold/lock/terminal loaded/empty/failed/return interval, quality-temperature provenance and exclusive supply topology. Include actual consumed customer-stock fuel upstream once, cold power while waiting and each responsible handoff; air setpoint is not product acceptance. | ghg-product-2011 |\n| stock_fate_native | inland_cold_carriage | Reconcile lot/component/water/refrigerant/gear stocks, measured moisture bases and actual water changes, internal circulation, exclusive recovered/waste/direct release and actual substance/medium. Verify native property/unit/grade/gate per final row; known environment is never replaced by an unspecified or freshwater identity to obtain a pass. | ghg-product-2011 |\n| coverage_life | inland_cold_carriage | Check every contributor, all-user same-asset useful-life denominator and uncovered life phases, provider coverage and allocation conservation, then current EN/ZH/projection alignment. Unresolved required actual quantities, identities, fates or quality evidence block final dataset completion, not blanket deletion of conditional rows. Verify unique asset/component/event-to-row ownership across vessel/aircraft, reusable equipment, infrastructure, maintenance and provider cards as applicable; whole-assembly included parts and their separate supplies cannot both enter the same phase inventory. | ghg-product-2011 |\n| atomic_inland_cold_carriage | inland_cold_carriage | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
