  calculation_rules:
    - id: normalize
      applies_to: "live_animal_carriage"
      rule: "After reconciling actual transport duties, animal care, provider coverage and stock balances, calculate q_x = allocated_native_quantity_x / N, with N > 0. The reference service output is 1 Item(s). Exclude lifetime animal production from normalization to this transport service."
      inputs:
        - "Actual native records"
        - "all-user shares and equivalent completed N"
      output: "Per reference native quantity"
      source_ids:
        - ghg-product-2011
    - id: asset_life
      applies_to: "live_animal_carriage"
      rule: "attributed_asset = native_asset_quantity * attributed_sameasset_usefulduty / positive_total_alluser_sameasset_usefulduty; then divide by N. Only verified asset manufacture gate, not cargo animal life or whole asset lifecycle."
      inputs:
        - "Real asset native quantity"
        - "same cohort positive all-user duty"
      output: "Allocated manufacture coverage"
      source_ids:
        - ghg-product-2011
    - id: animal_custody
      applies_to: "live_animal_carriage"
      rule: "Close animal counts/identified cohorts: opening live plus actual live pickups equals accepted live handoff, actual outward live returns/transfers, deaths and closing live custody, each event once. Separately close dead-body custody from actual deaths/receipts through outward body return/discard/other documented handoff and closing bodies; mortality is not itself a disposal transfer or service completion. For reproduction, escape, untraceable transfer or other real exceptional event use separately evidenced exclusive terms, not fabricated closure. Animal liveweight changes are not headcount changes or necessarily lost cargo; preserve actual state and all rejected/failed/partial/outcome care burdens."
      inputs:
        - "Animal cohort counts"
        - "death/body transfer and actual condition records"
      output: "Live count and separate body custody closure"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: representative
      applies_to: "live_animal_carriage"
      requirement: "Enumerate actual species/life stage/health/care/vehicle/route/weather/site/period strata and accepted obligations. Aggregate only equivalent functions by positive completed N with actual distribution; no silent terrestrial only exclusion or farm burden averaging."
      evidence: "Complete cohort/route/care/unit registry and weights"
    - id: completeness
      applies_to: "live_animal_carriage"
      requirement: "Expand every actual feed, water/support substance, bedding, medicine/disinfectant, material/asset/provider, waste and emittedspecies into one actual row with uniqueid, existingprocess/direction/type, identity/state/gate/medium, native property/unit/quantity, verifiedUUID or row-addressable unresolved, parentprotocol and supported calculation/source. Preserve moisturedry/wet, compound vs C/N/S, biological/fossil origins, actualreceivers and coverage. Captured excreta or dissolvedconstituents are not also automatic direct emissions."
      evidence: "Actualexpandedinventory, fate/provider and custodyaudits"
    - id: uncertainty
      applies_to: "live_animal_carriage"
      requirement: "Record measure/model provenance, calibration, actualcohort coverage and independentQA; maintain uncertainty for actualcare emissions/feed/water/mortality outcomes. No universal survival/loading/animalmass/dose/lifetime or numericalRange. Nonapplicable occurrence needs evidence, missing is not nonapplicable."
      evidence: "Independent samples/logs, factorapplicability and modelrecords"
validation_rules:
  - rule_id: function
    applies_to: "live_animal_carriage"
    rule: "Confirm full liveanimal-roadcargo scope, actualspecies/specificcare evidence, no originalrearing/tractionanimal asset substitution, one realqualifiedreferenceoutput and predeclared completion/quality/outcomecriteria."
    source_ids:
      - ghg-product-2011
  - rule_id: closure
    applies_to: "live_animal_carriage"
    rule: "Reconcile livecount and separate deadbody custody, actualliveweight/state, journeys/careperiods, excreta/transportwater/fuelstock/fates, allusers/providercoverage and positiveequivalent N. Missing required care/quantity/fate or unsupportedmodel blocks complete package, not silently zero."
    source_ids:
      - ghg-product-2011
  - rule_id: identity
    applies_to: "live_animal_carriage"
    rule: "Verify finalexchange nativeUUID/property/unit/state/gate and pollutantreceivingmedium. Countsupport is not liveanimaltransport serviceUUID. Conditional exactactualidentity expansions and unresolved registrations remain mandatory productiongates; no genericVOC/NOx/waste or liveanimalmanufacture substitution."
    source_ids:
      - ghg-product-2011
  - rule_id: parity_quality
    applies_to: "live_animal_carriage"
    rule: "Match EN/ZH/current projection by row/rule/protocol ids, native quantity/constants and actual conditional branches; use calibrated measurements/compatible models with uncertainty and independent QA. Scientific review and actual welfare compliance are not proved by checker pass."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_live_animal_carriage
    applies_to: "live_animal_carriage"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
