system_boundary:
  rules:
    - rule_id: scope
      applies_to: "live_animal_carriage"
      rule: "Cover actual road transportation of live animals as cargo, without restricting species, size, purpose, vehicle or containment to one convenient subtype. Terrestrial, aquatic, domestic, companion, captive/wild or other actually eligible animal cargo require their own condition evidence. Exclude animal rearing/breeding/growing, sale/ownership transfer, slaughter/product manufacture, passenger transport, non-road carriage and movement of dead cargo as a different freight function. Actual multimode providers cover only their road responsibility here."
      source_ids:
        - unsd-cpc3-65118
    - rule_id: cargo_role
      applies_to: "live_animal_carriage"
      rule: "Animals in this service are transported cargo, not working traction animals or productive capital. Record counts/ids/liveweight/condition and custody states outside manufacturing exchanges; no animal purchase, originalrearing burden or useful-life allocation of cargoanimals. Actual feed, water, life-support, sanitation, veterinary care and biological releases during carrier responsibility belong to this declared service interval, with separately disclosed loss/replacement responsibility rather than automatic entireanimal production."
      source_ids:
        - ghg-product-2011
    - rule_id: care
      applies_to: "live_animal_carriage"
      rule: "Define carrier custody/fitness/loading through accepted unloading/handover, actual species/age/state/health/compatibility, journey duration/route/weather, space/containment and actual feed/water/ventilation/thermal/rest/inspection/biosecurity/emergency care responsibilities. Include necessary preparation, restholding and cleanup according to actual care plan. WOAH2024chapter7.3 supports specified domesticated-species questions, not universalconditions for every animal; other species need applicable current conditions, no fixed dose/resthour/loading/survival default."
      source_ids:
        - woah-land-transport-2024
    - rule_id: aquatic
      applies_to: "live_animal_carriage"
      rule: "Where live aquatic cargo actually requires water/oxygen support, record real species/lifestage, transportwater source/state/volume/mass, temperature, oxygenation/gasstock, pH/salinity/quality, open/closed/dry system and actual conditioning/discharge responsibility. Preserve transportedwater payload in actual traction allocation but not as animal liveweight. FAO1986describes relevant mechanisms; none of its historical numerical recipes is adopted. Actual current care evidence determines conditions; terrestrial-only recipes cannot cover allscope."
      source_ids:
        - fao-live-fish-1986
        - ghg-product-2011
    - rule_id: custody_mortality
      applies_to: "live_animal_carriage"
      rule: "Close animal counts/identified cohorts: opening live plus actual live pickups equals accepted live handoff, actual outward live returns/transfers, deaths and closing live custody, each event once. Separately close dead-body custody from actual deaths/receipts through outward body return/discard/other documented handoff and closing bodies; mortality is not itself a disposaltransfer or servicecompletion. For reproduction, escape, untraceable transfer or other real exceptional event use separately evidenced exclusive terms, not fabricated closure. Animal liveweight changes are not headcount changes or necessarily lost cargo; preserve actual state and all rejected/failed/partial/outcome care burdens."
      source_ids:
        - ghg-product-2011
    - rule_id: whole_duty
      applies_to: "live_animal_carriage"
      rule: "Retain actual loaded/empty/reposition/wait/failed/rescue/return duties, rest/holding/loading/unloading and cleaning/biosecurity events causally assigned across all cargo/users and periods. Vehicle propulsion/containment/ventilation/waterlife-support deltas under live_animal_carriage change actual inventory/native suppliers and validation; actual passive/active routes declared without assuming all occur. No missing required care or failures treated as zero."
      source_ids:
        - ghg-product-2011
    - rule_id: assets_provider
      applies_to: "live_animal_carriage"
      rule: "Actual vehicles/containers/pens/tanks/ramps/fans/pumps/roads/restsites and sanitation assets retain manufacture/install/use/maintenance/replacements/retirement and alluser same-cohort duty. Manufacture flow supports only its verified gate, not whole life. Complete assembly vs includedinitialparts exclusive. Actual carrier/restholding/vet/cleaning/waste providers replace exact covered native cells once; uncovered responsibilities retained. Originalanimal rearing and farmassets outside transport responsibility do not enter merely because animals appear."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic
      applies_to: "live_animal_carriage"
      rule: "Expand every actual feed, water/support substance, bedding, medicine/disinfectant, material/asset/provider, waste and emittedspecies into one actual row with uniqueid, existingprocess/direction/type, identity/state/gate/medium, native property/unit/quantity, verifiedUUID or row-addressable unresolved, parentprotocol and supported calculation/source. Preserve moisturedry/wet, compound vs C/N/S, biological/fossil origins, actualreceivers and coverage. Captured excreta or dissolvedconstituents are not also automatic direct emissions."
      source_ids:
