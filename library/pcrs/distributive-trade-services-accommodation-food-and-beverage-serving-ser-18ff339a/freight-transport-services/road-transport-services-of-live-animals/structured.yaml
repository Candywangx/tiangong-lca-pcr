  - rule_id: causal
    applies_to: "live_animal_carriage"
    rule: "Allocate actual indivisible traction using evidenced causal constraints such as loaded compartment/space, vehicle duty and segment mass-distance where relevant; include actual containers, bedding and transportwater payload separately from animal liveweight. Care duties may depend on actual species/state/headtime/space or required service, not universal animalmass share. Reconcile alluser shares and apply once; justify/sensitivity another allocation when physical relation unavailable."
    source_ids:
      - ghg-product-2011
  - rule_id: life_period
    applies_to: "live_animal_carriage"
    rule: "Attribute each actual equipment/site asset native manufacture by same-cohort usefulduty over positive total alluser usefulduty, then divide by N; no universal usefullife. Operation/rest/cleaning/returnable container/retirement events have one actual period/custody owner. This applies to equipment only, never cargo animal rearing/lifetime. No automatic manurefertilizer/recovery/avoidedanimal credit."
    source_ids:
      - ghg-product-2011
  - rule_id: normalize
    applies_to: "live_animal_carriage"
    rule: "N is positive actual completed equivalent road animal-consignment carriage obligations under predeclared welfare/acceptance/completion criteria. Animalheadcount, kg liveweight, crates, vehicletrips and tkm are different measures, not arbitrary servicecount. Mortality/rejection/partialfailure and rescuecare retain burdens; determine eligible final output from predeclared actual function without concealing outcomes or inventing mortalityfree compliance. N=0 has no finiteintensity. Species/state/route/duration/care/quantity/quality strata disclosed, no universal Count comparability."
