    rule: "Prefer direct subdivision by real vehicle/compartment, cargo species/cohort/consignment, segment, care/restsite and period. Identify all other consignments and intended service outputs; customer live/deadanimal transfers, excreta or emptyvehicle movements are not new manufactured intended products."
