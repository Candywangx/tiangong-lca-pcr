  calculation_rules:
    - id: original_qualified_count
      applies_to: "Qualified completed space freight commission"
      rule: "Within mandatory stratum s and compatible original payload/destination/orbit/trajectory/time/gate fingerprint f, N_s,f = sum_j I(original commission j meets original predeclared full acceptance). One original bounded qualified commission contributes one once; partial/failed task none, no post-event payload/orbit/acceptance reset. Original independently bounded payload tasks may each qualify only to original criteria with all shared burdens allocated. Final output is 1 Item(s); N_s,f > 0 needed for finite intensity, actual payload quantity/orbit/condition remain mandatory."
      inputs:
        - "original task/payload/gates/acceptance"
        - cp_task
      output: "N_s,f; qualified_space_commission"
      source_ids:
        - unsd-cpc3-65320
        - ghg-product-2011
    - id: exclusive_material_element_balance
      applies_to: "actual material/propellant/payload/hardware ledger"
      rule: "At common actual gates/time on a conserved native material or ELEMENT basis: opening + external_receipts = closing_or_retained_in_service + actual_accepted_delivery_or_use_or_conversion + actual_outward_recovered_return + distinct_waste_outward + actual_environmental_or_orbital_exit + documented_residual. Terms mutually exclusive; internal recovery/recirculation not extra receipt/use/outward and recovered material enters only actual closing, subsequent real use or one outward destination. For chemical change balance each element across actual reactants/products/unreacted/retained/returned/waste/emitted states, do not equate kg fuel or oxidizer to kg same emitted substance or count conversion plus its resulting release as two exits in one ledger. Separate object fate and emitted chemical/particle ledgers; no whole reentered hardware assumed primitive emission. Actual initially/customer held consumed supply linked upstream once regardless title, no double purchase/withdrawal or all reserve consumed."
      inputs:
        - "actual conserved material/element and stage/object fates"
        - cp_propellant
        - cp_flight_fates
        - cp_ground
        - cp_recovery
      output: "exclusive actual chemical/element/object custody closure"
      source_ids:
        - nasa-atmosphere-2024
        - ghg-product-2011
    - id: actual_water_energy
      applies_to: "actual ground/recovery water and energy gates"
      rule: "For actual compatible measured state/unit/gates: opening_water + external_intake_excluding_separately_recorded_additions + separate_additions_not_already_intake = closing_water + outflow_by_destination + distinct_evaporation_or_other_consumptive_loss + residual. Intake includes any supplied water once; no duplicate supply/intake/pump-transfer or internal recirculation. Actual temperature/density/composition/pressure supports unit conversion, not all deluge/cooling water consumed. Energy input/conversion/use/export/loss follows actual native carriers/meters and own/provider boundaries; external AC alone uses verified 3.6 MJ/kWh, no unsupported propulsion efficiency or solar/charged energy double counting."
      inputs:
        - "actual source/destination/storage/native energy meters"
        - cp_ground
        - cp_recovery
      output: "water source-destination and native energy closure"
      source_ids:
        - ghg-product-2011
    - id: native_all_user_normalization
      applies_to: "all actual native row quantities in compatible task profile"
      rule: "q_row,ref,s,f = sum(q_native,event × supported actual causal/all-user share) / N_s,f once. Asset phase share = attributable same-cohort useful duty / supported positive total all-user useful duty for that phase; no promised reuse denominator or automatic equal payload-mass share. Include actual tests/scrubs/failure/return/recovery/full-life/provider gaps and actual shared mission/stage/orbit differences. Native supplier units linked through actual supported activity, not forced launch/slot/kg/vehicle/fee equals one commission. Pool only compatible raw attributed numerator and N_s,f."
      inputs:
        - "actual native quantity"
        - "same-cohort all-user/causal shares"
        - "compatible denominator indexed by stratum s and fingerprint f"
      output: "per-reference native exchange"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: original_mission_quality
      applies_to: "reference and all shared carrier tasks"
      requirement: "Require original preoperation payload set/net mass/volume/condition, destination/orbit/trajectory/epoch/time/quality/gates/receiver acceptance and actual outcome, mandatory strata/finer fingerprints and all co-user original tasks. Missing original acceptance or lower/wrong orbit not retrospectively success; preserve failure/scrub/partial and changed-task lineage."
      evidence: "Original physical contract/acceptance and actual tracking/receiver/campaign records"
    - id: altitude_species_model_gaps
      applies_to: "all flight/reentry/ground/support sources"
      requirement: "Actual formulation/state/native supply and direct compound/particle/size/phase/origin/altitude/time/location/receiving compartment need measurements or justified validated source-specific models with uncertainty/coverage. Report uncharacterized non-CO2/ozone/upper-atmosphere/orbital-debris effects and missing fate/compartment/model explicitly; conventional characterization pass cannot imply zero unmodeled impact or universal clean propellant. Inventory and characterization uncertainty distinct."
      evidence: "Actual source/altitude-resolved records and model/version/validation/coverage evidence"
    - id: native_life_no_defaults
      applies_to: "all quantities/providers/life and validation"
      requirement: "Require actual native quantities/gates, all-user realized life/cohorts/provider covered cells and independent compatible QA. No universal payload size/orbit equivalence, propellant recipe/ratio/reaction yield/emission/altitude factor, promised reuse count, failure probability, lifecycle or human metabolic values. Same batch maximum cannot validate itself; missing identity/quantity/model incomplete not zero and candidate scientific review still needed."
      evidence: "Native quantity provenance, realized life register, independent compatible comparison and explicit gaps"
validation_rules:
  - rule_id: validate_full_space_function
    applies_to: "all nodes"
    rule: "Verify full spacefreight plus satellite launching-and-placing, actual other delivery/return/inspace branches and true passenger/payload manufacture/post-handover operation exclusions. Reference is original qualified physical commission1Item(s),5functional fields/native Count support, mandatory strata/finer original payload/destination/orbit/trajectory/epoch/quality/time/gate acceptance. No satellite/launch/vehicle/kg/fee proxy or unlike function equivalence."
    source_ids:
      - unsd-cpc3-65320
      - nasa-lsp-services
      - esa-atv
  - rule_id: validate_whole_campaign_failure
    applies_to: "all nodes"
    rule: "Verify actual transport development/test/processing/hold/scrub/abort/failure and every responsible launch/transfer/upper/cargo carrier/ground tracking/recovery role through original acceptance and full service life. Partial/wrong-orbit original failure not reset success, separately predeclared accepted payload tasks retain original criteria and all shared causal burdens. Customer original manufacture/post-handover operation distinct; initial/customer consumed fuel/energy upstream once regardless title, not free or full reserve consumed; actual cargo propellant/water/air delivered distinct from carrier consumption, one portion not both."
    source_ids:
      - nasa-lsp-services
      - esa-handbook-landing
      - ghg-product-2011
  - rule_id: validate_native_chemistry_altitude
    applies_to: "spaceflight_delivery; ground_campaign"
    rule: "Verify every actual fuel/oxidizer/pressurant/native state/gate/source and disjoint supply/burn/vent/boiloff/reserve/return/waste/release. Actual element closure does not force supplied chemical or all object mass into emitted species. Require actual source-altitude-location-time/material-size-phase/native quantity/receiving compartment and distinct inventory/characterization models/gaps; no known-altitude unspecified-air binding, generic NOx/SOx/CO2equivalent or unknown-zero; actual attributable oxidizer upstream supply includes unburned vent/boiloff/leak/test losses and supported stock responsibility, not all loaded stock consumed. Supplied/charged flight energy products and direct environmental resource elementary inputs are distinct; internal solar/power output not purchased again, equipment full life retained."
    source_ids:
      - nasa-atmosphere-2024
      - esa-environment-2024
  - rule_id: validate_recovery_life_providers
    applies_to: "recovery_support_lifecycle; all nodes"
    rule: "Verify actual retained/recovered/reused/refurbished/requalified/retired/orbital/surviving-object/vapor/gas/particle fates without duplicate full mass; recovery not automatic zero manufacture/recycling benefit. Full phase assets/development/test and realized same-cohort all-user denominator required, no promised reuse or customer payload manufacture. Native complete launch/ground/transfer/recovery/provider units/gates/cells substitute exact own scope once with uncovered events; all co-payloads/orbits/users causal drivers, not universal mass ratio."
    source_ids:
      - esa-environment-2024
      - nasa-atmosphere-2024
      - ghg-product-2011
  - rule_id: validate_stock_water_projection
    applies_to: "all nodes"
    rule: "Verify exclusive material/element/object and water/source-destination/storage fates, external intake/additions disjoint without supply/pump/internal duplicate or all water consumed. Positive compatible original N, no double normalization/count inflation; node-owned protocols, raw native quantities/provenance/uncertainty, final concrete identity and property/unit/state/gates/compartments mandatory. Every actual conditional exchange expands and all unresolved cards including actual final output registered. EN/ZH and generated projection preserve all normative rules; missing incomplete not zero."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_spaceflight_delivery
    applies_to: "spaceflight_delivery"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_ground_campaign
    applies_to: "ground_campaign"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_recovery_support_lifecycle
    applies_to: "recovery_support_lifecycle"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
