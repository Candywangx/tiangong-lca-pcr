      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| space_task_strata_all_payloads | all nodes | Separate satellite launch-placement and other space-freight delivery/return/in-space strata, finer original payload/destination/orbit/trajectory/epoch/quality/time/gate and actual stage/technology fingerprints. Direct subdivision/meters first; shared launch/stage/campaign/orbital carrier/recovery duty across every payload and other true user uses evidence-supported causal capacity/volume/mass/energy/mission-duty relationships. Payload mass ratio is not universal, especially with different deployment orbits/sequence and responsibility. Include actual passenger/non-freight co-users without turning them into freight output; economic fallback only if no physical relation with justification/sensitivity; each event shares sum to one. | ghg-product-2011 |\n| original_failure_burden | all nodes | Retain actual qualification/test/hold/scrub/abort/failure/partial/rework/return/recovery and zero-completion period burdens causally within the compatible original-task stratum/fingerprint, then normalize once by positive originally qualified completed N. No success by redefining original orbit, payload set or acceptance; no new completed task per ignition/stage/docking/reflight. Original independently bounded payload commissions may qualify separately only against original criteria and allocate all shared causal duty. N=0 no finite intensity; records remain for supported attribution. | ghg-product-2011 |\n| all_user_reuse_life | recovery_support_lifecycle; all nodes | Allocate actual same-cohort manufacture/development/test/commission/refurbish/requalify/replace/retire events over supported actual all-user useful duty for each phase, then compatible N. Expendable stage has its actual use and disposal scope; recovered reusable hardware retains attributable full-life burden plus actual retrieval/refurbishment/termination, not zero new manufacture by arbitrary cut-off or promised repeated flights. Residual useful stock/life uncertainty and actual failed/retired cohorts explicit. No automatic recycling/avoided-launch/space-benefit credit; true external useful output needs receiver/subdivision or justified allocation. | esa-environment-2024; ghg-product-2011 |\n| native_site_period | all nodes | Enumerate all actual production/test/integration/pad/range/control/flight/transfer/recovery/maintenance sites and providers across campaign and life periods. Same native service coverage replaces exactly matched own input/direct/life cells once with uncovered phases retained; subcontracting, customer title and initial stock do not erase upstream or direct duty. Compatible pooling sums actual attributed native numerator and compatible N, never heterogeneous orbit/task averages or duplicate complete provider and own operations. | ghg-product-2011 |\n| exclusive_recovery_fates | all nodes | Material/propellant/equipment/payload custody terms and reentry species are disjoint. Internal recovery/recirculation is not new external supply, outward transfer, use or credit. Recovered material enters only actual retained stock, subsequent actual use or one real outward destination; actual waste/recipient and direct released chemical/particle/medium separate. Retained orbital objects/debris and unknown fates require physical records/model limits, not arbitrary zero or all object mass elementary emission. | nasa-atmosphere-2024; ghg-product-2011 |\n\n"
