      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_full_space_function | all nodes | Verify full spacefreight plus satellite launching-and-placing, actual other delivery/return/inspace branches and true passenger/payload manufacture/post-handover operation exclusions. Reference is original qualified physical commission1Item(s),5functional fields/native Count support, mandatory strata/finer original payload/destination/orbit/trajectory/epoch/quality/time/gate acceptance. No satellite/launch/vehicle/kg/fee proxy or unlike function equivalence. | unsd-cpc3-65320; nasa-lsp-services; esa-atv |\n| validate_whole_campaign_failure | all nodes | Verify actual transport development/test/processing/hold/scrub/abort/failure and every responsible launch/transfer/upper/cargo carrier/ground tracking/recovery role through original acceptance and full service life. Partial/wrong-orbit original failure not reset success, separately predeclared accepted payload tasks retain original criteria and all shared causal burdens. Customer original manufacture/post-handover operation distinct; initial/customer consumed fuel/energy upstream once regardless title, not free or full reserve consumed; actual cargo propellant/water/air delivered distinct from carrier consumption, one portion not both. | nasa-lsp-services; esa-handbook-landing; ghg-product-2011 |\n| validate_native_chemistry_altitude | spaceflight_delivery; ground_campaign | Verify every actual fuel/oxidizer/pressurant/native state/gate/source and disjoint supply/burn/vent/boiloff/reserve/return/waste/release. Actual element closure does not force supplied chemical or all object mass into emitted species. Require actual source-altitude-location-time/material-size-phase/native quantity/receiving compartment and distinct inventory/characterization models/gaps; no known-altitude unspecified-air binding, generic NOx/SOx/CO2equivalent or unknown-zero; actual attributable oxidizer upstream supply includes unburned vent/boiloff/leak/test losses and supported stock responsibility, not all loaded stock consumed. Supplied/charged flight energy products and direct environmental resource elementary inputs are distinct; internal solar/power output not purchased again, equipment full life retained. | nasa-atmosphere-2024; esa-environment-2024 |\n| validate_recovery_life_providers | recovery_support_lifecycle; all nodes | Verify actual retained/recovered/reused/refurbished/requalified/retired/orbital/surviving-object/vapor/gas/particle fates without duplicate full mass; recovery not automatic zero manufacture/recycling benefit. Full phase assets/development/test and realized same-cohort all-user denominator required, no promised reuse or customer payload manufacture. Native complete launch/ground/transfer/recovery/provider units/gates/cells substitute exact own scope once with uncovered events; all co-payloads/orbits/users causal drivers, not universal mass ratio. | esa-environment-2024; nasa-atmosphere-2024; ghg-product-2011 |\n| validate_stock_water_projection | all nodes | Verify exclusive material/element/object and water/source-destination/storage fates, external intake/additions disjoint without supply/pump/internal duplicate or all water consumed. Positive compatible original N, no double normalization/count inflation; node-owned protocols, raw native quantities/provenance/uncertainty, final concrete identity and property/unit/state/gates/compartments mandatory. Every actual conditional exchange expands and all unresolved cards including actual final output registered. EN/ZH and generated projection preserve all normative rules; missing incomplete not zero. | ghg-product-2011 |\n| atomic_spaceflight_delivery | spaceflight_delivery | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| atomic_ground_campaign | ground_campaign | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| atomic_recovery_support_lifecycle | recovery_support_lifecycle | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
