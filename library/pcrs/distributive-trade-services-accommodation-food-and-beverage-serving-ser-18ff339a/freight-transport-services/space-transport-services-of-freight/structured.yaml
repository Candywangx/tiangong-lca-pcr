system_boundary:
  rules:
    - rule_id: full_space_freight_scope
      applies_to: "all nodes"
      rule: "Cover space transportation of freight and launching plus placing satellites in space. Satellite deployment, other cargo delivery/return and in-space carriage are actual functional branches of the carrier parent, with original payload/destination/handover responsibilities. Actual ground/air/sea launch origin, solid/liquid/hybrid/other propulsion and multi-stage/expendable/reusable/transfer arrangements may change inventory, state, data and validation; activate only actual branches. No orbital satellite launch-only narrowing or customer-payload manufacture proxy."
      source_ids:
        - unsd-cpc3-65320
        - nasa-lsp-services
        - esa-atv
    - rule_id: original_space_gates
      applies_to: "spaceflight_delivery; ground_campaign"
      rule: "Before operation retain original bounded commission, payload set/net mass/volume/condition, destination/orbit/trajectory/epoch, quality/time and receiver handover acceptance. Distinguish original carrier acceptance of custody, launch vehicle separation, parking orbit, transfer/rendezvous/docking, final placement or return acceptance. A lower/wrong orbit, partial payload delivery or launch alone is not original success by redefinition. Post-handover satellite/station work excluded unless an actual further carrier task is declared with no overlap."
      source_ids:
        - nasa-lsp-services
        - esa-atv
        - ghg-product-2011
    - rule_id: whole_campaign_carrier
      applies_to: "ground_campaign; spaceflight_delivery"
      rule: "Include actual transport-responsible planning/qualification/development/testing and allocated shared test articles, ground logistics/processing/cleanroom/conditioning/integration/encapsulation, actual hold/scrub/retest/offload/reload and recovery from failed attempts. Include all responsible launch/booster/upper/transfer/cargo-carrier stages and ground tracking/telemetry/mission control through actual accepted handover; cargo care/thermal/power/communications only actual attributable carrier responsibility. Customer scientific mission manufacture/operation is not automatically included by sharing a launch site."
      source_ids:
        - nasa-lsp-services
        - esa-handbook-landing
        - ghg-product-2011
    - rule_id: propellant_supply_conversion
      applies_to: "spaceflight_delivery; ground_campaign"
      rule: "Record every actual fuel, oxidizer, solid/hybrid formulation, pressurant, purge gas, other energy and state/supply/storage path at each stage and test. Separate manufactured upstream supply from actual burn/reaction, vent/boiloff/leak, retained reserve, returned/recovered outward and waste/environment fates. Include actual initially/customer-held material/energy withdrawn and consumed for transport with compatible upstream supply/charging once regardless title/purchaser; no whole payload manufacture or purchase-plus-withdrawal duplication. Customer water/air/propellant transferred as freight is custody cargo, not all carrier-consumed supply: split actual delivered versus transport-consumed portions and no portion counted as both delivered cargo and consumed carrier fuel. Internal power/propulsion not another purchased product. No assumed complete reaction, all carbon fossil or all oxidizer exhausted as its input identity."
      source_ids:
        - esa-environment-2024
        - nasa-atmosphere-2024
        - ghg-product-2011
    - rule_id: actual_altitude_species
      applies_to: "spaceflight_delivery; ground_campaign; recovery_support_lifecycle"
      rule: "Collect actual stage/test/flight/reentry source, chemical composition/particle material/size/phase/carbon origin, quantity/basis, location/time/altitude distribution and real receiving compartment. Chemical inputs and elemental mass balances are not automatic emitted-substance inventories or climate equivalents. Preserve actual upper-atmosphere/ground/water/soil distinctions; known altitude/subcompartment cannot bind an unspecified-air row merely for availability. Unavailable matching compartment, emission quantification or characterization remains an explicit gap, not zero impact or a generic clean-fuel conclusion. Separate physical emission inventory from atmospheric transformation and impact model/version/coverage."
      source_ids:
        - nasa-atmosphere-2024
        - esa-environment-2024
    - rule_id: recovery_reentry_fates
      applies_to: "recovery_support_lifecycle; spaceflight_delivery"
      rule: "Include actual transport-system recovery/landing/retrieval vessels-aircraft-road support, safing/refurbishment/requalification/reflight and final disposal duties, including attributable abort/failure searches and cleanup. Track each stage/fairing/adapter/carrier/target by true role and disjoint retained-in-service, recovered outward, actual waste, remaining orbital object, ground/water surviving object and quantified vapor/gas/particle fate. Orbital retention, breakup, reentry or landing mass is not wholesale elementary emission; recovered equipment is not automatic recycling credit. Original customer cargo/satellite manufacture and post-delivery payload retirement stay outside unless actual transport responsibility changes the specific fate duty; identify uncovered downstream fate/model limits."
      source_ids:
        - nasa-atmosphere-2024
        - esa-environment-2024
        - ghg-product-2011
    - rule_id: ground_resources_interfaces
      applies_to: "ground_campaign; recovery_support_lifecycle"
      rule: "Actual external AC/fuels, cryogenic storage/conditioning, cleanroom/cooling/thermal/communications, launchpad support/deluge/cleaning/wastewater, resource sources, leaks and receiver/treatment paths follow actual responsibility and provider gates. Water intake, supplied product, recirculation, source-destination transfer and consumptive losses are distinct; actual runoff/wastewater/substances are not all evaporated, tap water or one pollutant. Human support scope declared without fabricated metabolic/diet factors; no numeric engineering settings, propellant recipe or universal performance assumptions."
      source_ids:
        - esa-environment-2024
        - nasa-lsp-services
        - ghg-product-2011
    - rule_id: full_service_assets_providers
      applies_to: "recovery_support_lifecycle"
      rule: "PCR full-life choice includes actual expendable and reusable launch/transfer/cargo vehicles/stages, adapters/fairings/containers, ground/test/range/control/communications/cryogenic/pad and recovery assets: attributable development/test articles, manufacture/construction/install/commission/maintenance/refurbishment/requalification/replacement/retirement and real associated releases/wastes/resources. Existing/leased vehicles and shared ground assets retain supported same-cohort all-user duty, actual realized reuse and termination, not promised flights or manufacture equals lifetime. Actual native launch/processing/orbital transfer/recovery/treatment services replace exact covered own supply/direct/life cells once; uncovered duties remain."
      source_ids:
        - esa-environment-2024
        - esa-handbook-landing
        - ghg-product-2011
    - rule_id: atomic_native_exchange
      applies_to: "all nodes"
      rule: "Expand each actual conditional requirement into a concrete row_id at its true process/direction/flow type with one substance/material/service identity, native property/unit/state/gate, quantity/provenance/same-node protocol and actual receiver/compartment. Separate payload custody from service output, waste status from useful equipment and direct releases from manufactured inputs/chemical transformation. No dummy output, aggregate exhaust/CO2-equivalent, orbital-debris pseudo-elementary identity, unverified fixed UUID or missing-as-zero."
      source_ids:
        - ghg-product-2011
