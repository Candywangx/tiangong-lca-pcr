product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.railway-transport-services-of-live-animals"
  classification_refs: "CPC 3.0 65126; exact"
  covered_products: "This PCR covers railway carriage of live animals, with the actual carrier-accountable care interval and accepted custody handover. The official category is not limited to cattle or other farm livestock: actual terrestrial, aquatic, companion, wild or other qualifying live-animal consignments require their own species, stage, condition, containment and care evidence. Declare actual rail vehicle/containment, train configuration, geography, propulsion, origin/destination, distance, duration and service quality. A particular domesticated-species guide or fish example does not restrict the category or prescribe conditions for every animal."
  excluded_products: "Independent road,sea,air or other nonrail carriage;animal rearing/breeding/manufacture or slaughter;independently supplied clinic,quarantine or care functions beyond the actual declared rail-care interface. Carried animals are cargo,not working traction assets or consumed feed. Necessary actual in-scope care remains included regardless of its animal-owner/carrier/provider responsibility."
  representative_product: "Completed scoped rail live-animal consignment carriage and care obligation"
  production_route: "Actual railway live-animal consignment carriage and owned care interval across rail/yard/terminal/handling/handover,accepted scoped service and full attributable lifecycle."
  market_state: "Completed scoped rail live-animal consignment carriage and care obligation"
