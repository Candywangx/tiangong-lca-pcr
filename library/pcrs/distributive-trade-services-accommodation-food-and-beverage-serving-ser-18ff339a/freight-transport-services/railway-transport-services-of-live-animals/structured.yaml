allocation_rules:
  - rule_id: direct_first
    applies_to: "rail_animal_service"
    rule: "Assign dedicated consignment,care and measured resources directly before residual common-pool attribution. Actual animal count,mass,space,time,care quality and welfare outcomes are exposure/state data,not competing service outputs or automatic survival-normalized denominators. Keep comparable species/stage/condition/gate/care strata and actual event membership."
    source_ids:
      - ghg-product-2011
  - rule_id: all_users
    applies_to: "rail_animal_service"
    rule: "Enumerate all actual independently supplied consignments and other intended services sharing train/yard/terminal/care support. Reconcile real cargo,gross/tare,space/time,traction and care native demand separately. Supported causal drivers may include actual work,mass-distance,occupied space-time,care duration or metered resources;animal count,nominal wagon capacity,money,equal fractions or adding unlike units are not defaults. Empty/failure/return burdens remain in the evidenced serving pool once."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "rail_animal_service"
    rule: "Attribute each actual locomotive,wagon,containment/tank/cage,ventilation/oxygen equipment,handling,track/catenary and terminal asset by native delivered quantity times studied compatible duty divided by positive documented same-asset all-user useful lifetime duty,then/N once. Include actual passenger/freight/other users where served;initial manufacture,replacements,maintenance and retirement are disjoint. Carried animals are not counted as carrier working-life assets."
    source_ids: []
  - rule_id: adverse_outcomes
    applies_to: "rail_animal_service"
    rule: "Keep actual rejected,injured,dead,escaped,returned or unresolved animal states and producing duties/periods with their true care and body/waste destinations. Retain attributable burden even without completed output;actual independently accepted amended/partial obligation needs original-to-amended trace and comparability,not postfailure scope shrink. Material recovery,manure/carcass product,waste and environmental release require actual identity/receiver and explicit treatment;no automatic animal-rearing,fertilizer or energy avoided-product credit."
    source_ids: []
