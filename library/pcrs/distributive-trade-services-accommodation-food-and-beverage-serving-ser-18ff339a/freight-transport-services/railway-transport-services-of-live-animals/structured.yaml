      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual live-animal consignment state/custody and carrier-care responsibility at taking-in-charge;compatible rail/keeper/terminal native provider gates. |\n| starting_condition_role | Foreground collection interface, not zero upstream asset/supply burden. |\n| product_classification_scope | CPC 3.0 65126 |\n| recursive_input_rule | Use verified same-function subcontracted service once at native demand; expand uncovered responsibility, never purchase a self-service or create extra final output. |\n| upstream_dataset_requirement | Actual function, native demand, technology, geography, period, phases and quality compatible; explicitly complete all missing stages. |\n| disclosure | Actual species/cohort/state/care interval and original/amended service acceptance,live/dead-body custody and adverse outcomes,rail/yard/terminal duties,native owner/provider covered time cells,all-user asset life,substance/medium/fates and gaps. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_and_species | rail_animal_service | Apply full railway live-animal carriage scope at actual consignment and care gates. Obtain actual species/stage/condition and relevant species-specific competence/source evidence; dated terrestrial livestock or fish guidance is context, not universal terrestrial/aquatic/wild/companion rules. | unsd-rail-live-2025 |\n| care_ownership | rail_animal_service | Declare when actual animal-owner/keeper/carrier/terminal/veterinary provider care responsibility starts and ends through pickup,loading,rail running,shunting,dwell,rest,border delay,unloading and accepted handover. One actual event,source,supplier and period has one burden owner. Complete necessary uncovered care/asset/supply phases;verified whole provider results replace only exact included native-demand cells. |  |\n| care_evidence | rail_animal_service | Collect the actual journey/care plan and real condition/fitness,loading/handling,feed/water,ventilation/temperature,rest/inspection,veterinary/emergency and cleaning/biosecurity records appropriate to the actual animal. Record observed adverse events and actual owner/responses;no veterinary dosage,fitness threshold,loading density or universal care frequency is invented by this PCR. | woah-land-2024 |\n| aquatic_and_other_species | rail_animal_service | For actual aquatic consignments identify species/stage,transport medium and containment,real water state/quantity,oxygen source or aeration,circulation/renewal,temperature,pH and relevant actual water-quality/metabolic observations. Other real wild/companion/species needs require their actual evidence,not an automatic livestock or freshwater-fish template. Supplied oxygen/air/water,environmental inputs,dissolved substances,collected water and actual environmental releases are separate native exchanges and fates. | fao-live-fish-1986 |\n| animal_custody_and_metabolism | rail_animal_service | Live animal count/state,mass,death/injury/escape/return and dead-body custody are collection ledgers,not additional final transport product exchanges. Separate received animals from supplied feed,bedding and working/carrier assets. Assess actual animal metabolism and excretion during the declared care interval once at its disclosed owner;an animal-production/provider dataset covering that actual time replaces exact cells,without charging ordinary animal rearing/manufacture again or assuming resting-baseline emissions are zero. |  |\n| rail_duty_energy_life | rail_animal_service | Preserve actual trainconsists,loaded/empty locomotives and wagons,repositioning,formation/shunting,yard dwell,waiting,failed/return/recovery and animal-care auxiliary duty. Actual traction/animal ventilation or aquatic support energy use separate meters/native gates and provider coverage. All real propulsion/configurations,locomotive/wagon/containment/lift/track/catenary/terminal assets and manufacture,initial/replacement,maintenance,retirement remain required at actual all-user lifetime demand. Internal regeneration is not new external supply;fuel supply/burn/stock/fates remain distinct. |  |\n| bodies_waste_environment | rail_animal_service | A death changes live/dead custody state,not automatically waste generation or environmental emission. Identify actual dead-body receiver,retention/return/recovery/disposal and legal/health responsibility from real records;no assumed carcass mass from headcount. Separately identify collected manure/bedding,used water/cleaning/disinfectant,retired materials and actual substance/medium/subcompartment releases. Aquatic dissolved CO2 or ammonia is not automatically air emission;manure is not automatically fertilizer or credit. Unknown shortage/stock residual is not a fate. |  |\n\n"
