  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "I_x = A_x / N, where A_x is actual native quantity attributed to the compatible completed-leg cohort after causal all-user allocation. N is positive; zero-output pools retain burdens for boundary resolution."
      inputs:
        - A_x
        - N
      output: "native quantity per completed obligation"
      source_ids: []
    - id: supplier_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s, with q_u the compatible provider inventory per actual native unit u, D_u the actual same-unit demand and s the evidenced cohort/all-user share. Replace covered cells before A_x / N; no automatic count-to-tkm conversion."
      inputs:
        - q_u
        - D_u
        - s
        - N
      output: "attributed native inventory"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life, where Q_asset is actual native delivered asset quantity and U_studied/U_life are compatible same-asset duty with positive documented all-user lifetime denominator. Then I_asset = A_asset / N once; separately close replacements and retirement."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - N
      output: "native asset quantity per completed obligation"
      source_ids: []
    - id: stock_fate
      applies_to: "fuel/refrigerant/cleaning rows"
      rule: "Opening + supplied + transfers_in = closing + consumed + transferred_out + recovered + evidenced_release + unresolved_residual. Keep streams mutually exclusive with actual native units; recovery remaining within closing stock is not also an external recovered output; unresolved_residual is investigated, not assigned automatically to air, waste or combustion."
      inputs:
        - opening
        - supplied
        - transfers_in
        - closing
        - consumed
        - transferred_out
        - recovered
        - evidenced_release
        - unresolved_residual
      output: "reconciled event ledger"
      source_ids: []
    - id: live_custody
      applies_to: "actual animal cohort"
      rule: "Opening_live + received_live + actual_births = live_handovers + deaths_during_care + actual_escapes + closing_live + unresolved_live_count. Use mutually exclusive real cohort events;unknown shortage is not presumed death or escape. Animal count/state ledger does not define completed-service N."
      inputs:
        - Opening_live
        - received_live
        - actual_births
        - live_handovers
        - deaths_during_care
        - actual_escapes
        - closing_live
        - unresolved_live_count
      output: "reconciled live-animal custody counts"
      source_ids: []
    - id: body_custody
      applies_to: "actual animal-body custody"
      rule: "Opening_dead + received_dead + deaths_during_care = nonwaste_body_returns_or_custody_transfers + actual_waste_handover + closing_dead + unresolved_body_count. A death enters the separate body ledger once;actual non-waste and waste handovers are disjoint. Measure body mass independently,not headcount times a default factor. Body ledger does not define service N."
      inputs:
        - Opening_dead
        - received_dead
        - deaths_during_care
        - nonwaste_body_returns_or_custody_transfers
        - actual_waste_handover
        - closing_dead
        - unresolved_body_count
      output: "reconciled body counts and independent measured mass"
      source_ids: []
  data_quality_requirements:
    - id: qualifier_and_acceptance
      applies_to: "reference output"
      requirement: "Original/genuine chronological amended animal/cohort/scope,care/rail gates,actual species/state/condition/quality and independent service acceptance substantiate comparable N. Animal/live/dead/survivor states are separate custody/outcome evidence;retain adverse events and failed duties."
      evidence: "cp_service"
    - id: atomic_route
      applies_to: "all actual exchanges"
      requirement: "Every actual branch/exchange requires atomic row id, actual identity/type/direction/gate, native quantity/property/unit, own-process protocol and collection/source provenance. Conditional absence requires affirmative actual evidence; missing is not zero."
      evidence: "cp_operation;cp_care;cp_fates;cp_maintenance;cp_emissions"
    - id: provider_life
      applies_to: "provider and asset rows"
      requirement: "Document exact covered phase/event/site/period cells, all users and positive same-asset lifetime demand. Collect construction, initial parts, replacement, maintenance and end-of-life separately where not covered. Forecasts retain basis and sensitivity."
      evidence: "cp_assets;cp_provider"
    - id: site_period_outputs
      applies_to: "shared pools"
      requirement: "Index every contributing rail/yard/terminal/care site,vehicle/containment and reporting/lifecycle period plus all intended outputs/receivers. Aggregate raw attributed quantities before dividing by coherent N, not arithmetic means of unlike intensities; reconcile whole pool and exclusions."
      evidence: "cp_service;cp_assets;cp_operation"
    - id: fates
      applies_to: "cargo and environmental transfers"
      requirement: "Trace actual live/dead/injured/birth/escape/returned/retained states and separate actual dead-body/manure/medium fates at true owner/receiver. Species-specific care/metabolism interval and native gas/dissolved/collected release evidence required;no animal-count mass factor or universal species emission/care default."
      evidence: "cp_maintenance;cp_emissions"
validation_rules:
  - rule_id: service_and_animal_state
    applies_to: "rail_animal_service"
    rule: "Verify one actual accepted scoped rail consignment carriage-and-care obligation as1Item(s),real output linkage,actual species/stage/cohort/gates/quality and positive comparable N. Do not substitute animal/survivor counts,mass,wagon movements,arrival/payment or death status alone for actual contractual completion;retain adverse outcomes without retrospective scope shrink."
    source_ids: []
  - rule_id: care_and_scope
    applies_to: "rail_animal_service"
    rule: "Verify actual carrier-care interval across load/run/shunt/dwell/rest/border/unload/handover and actual species-specific feed/water/ventilation/temperature/oxygen/vet/biosecurity requirements and evidence. Terrestrial domesticated and fish source contexts cannot become universal care conditions;complete necessary missing provider/asset/supply cells and avoid repeated animal-rearing coverage."
    source_ids: []
  - rule_id: custody_and_fates
    applies_to: "rail_animal_service"
    rule: "Reconcile live/dead/birth/received/transferred/escaped/retained states and separate dead-body ledger,actual mass and receiver/return/waste/recovery evidence. No dead body as elementary release,no carcass weight factor from headcount,no automatic manure fertilizer or aquatic dissolved species to air. Unknown residual remains investigated,not assigned as emission/waste."
    source_ids: []
  - rule_id: rail_energy_life_period
    applies_to: "rail_animal_service"
    rule: "Reconcile actual consists/empty/shunting/yard/failure care support,traction versus animal-condition native energy,stock/burn/internal regeneration and exact provider coverage. Check all actual users/sites/periods,positive same-asset life and disjoint initial/replacement/retirement;N=0 retains burden without finite intensity."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "rail_animal_service"
    rule: "Each real exchange needs atomic row id,one real process,direction/type,native property/unit/quantity and actual source/receiver gate with same-process protocol or registered unresolved requirement. Verify bilingual method/card/rule/profile parity and fresh generated projection;check pass is not species-specific veterinary,scientific,identity or publication approval."
    source_ids: []
  - rule_id: atomic_rail_animal_service
    applies_to: "rail_animal_service"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified rail live-animal carriage-and-care service inventory for downstream process/lifecyclemodel projections"
  allowed_use: "Qualified completed rail live-animal consignment carriage-and-care obligations with harmonized species/stage/state/cohort,care/rail gates,actual distance/duration/quality,adverse outcomes and full attributable lifecycle after mandatory identity/data/species-care review completion."
  excluded_use: "Unqualified animal/survivor/mass/wagon/tkm intensity,animal rearing or slaughter product,working-animal asset,universal livestock/fish care numbers,dead bodies as emissions,missing care/provider time cells or failed promises relabelled as completed service."
  required_metadata: "actual_species_life_stage_condition_and_cohort; live_status_at_taking_in_charge_and_native_count_mass; original_carriage_care_obligation_gates_quality; actual_rail_distance_duration_consist_wagon_and_care_interval; species_competent_plan_feed_water_ventilation_rest_vet_biosecurity; aquatic_medium_oxygen_water_quality_if_actual; genuine_chronological_amendment_and_accepted_service_completion; separate_live_dead_injury_birth_escape_return_retained_state_ledgers; N_comparable_completed_service_obligations_not_survivors; train_shunting_yard_empty_failed_return_and_gapcare; native_traction_care_supply_provider_exact_time_cells; same_asset_all_user_life_sites_periods; actual_substance_gas_dissolved_collected_fate_receiver_uncertainty"
  required_quality_disclosure: "Scope and acceptance, native provider coverage, actual data gaps, causal allocation, shared lifetime forecasts, stock/fate closure and uncertainty."
  update_trigger: "Changed actual animal species/stage/cohort/state,care requirements/gates/acceptance,rail/propulsion/containment/provider interval,asset life/allocation or substance/body/medium fate."
data_sources:
  - id: "unsd-rail-live-2025"
    type: "official_guidance"
    reference: "UNSD,CPC3.0 65126,30June2025. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/65126"
    used_for: "Official railway live-animal transport scope only;consignment carriage-and-care Count is an explicit PCR reference choice."
  - id: "woah-land-2024"
    type: "official_guidance"
    reference: "WOAH,Terrestrial Animal Health Code,dated2024 Chapter7.3,preamble and7.3.3/5/7-10. https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/2024/en_chapitre_aw_land_transpt.htm"
    used_for: "Dated terrestrial domestic-species land/rail care and responsibility context;wild and other species may differ. No universal current-law,clinical dosage,space/rest/fitness limit or numeric care factor transferred. PCR record fields are authored collection requirements."
  - id: "fao-live-fish-1986"
    type: "handbook"
    reference: "R.Berka,The transport of live fish,FAO1986,section2. https://www.fao.org/4/af000e/AF000E02.htm"
    used_for: "Historical qualitative fish-water/oxygen/temperature/metabolic context only;actual aquatic/species/medium requirements need appropriate records. No fish-specific numeric value applied to other animals or universal rail service."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,ch6-9. https://ghgprotocol.org/product-standard"
    used_for: "General functional-unit/lifecycle,disclosure and allocation framework;serviceCount1,native-demand,care-interval,custody and expanded asset-life equations are PCR methods,not animal-production or veterinary factors."
