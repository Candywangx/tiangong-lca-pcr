      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | rail_animal_service | Assign dedicated consignment,care and measured resources directly before residual common-pool attribution. Actual animal count,mass,space,time,care quality and welfare outcomes are exposure/state data,not competing service outputs or automatic survival-normalized denominators. Keep comparable species/stage/condition/gate/care strata and actual event membership. | ghg-product-2011 |\n| all_users | rail_animal_service | Enumerate all actual independently supplied consignments and other intended services sharing train/yard/terminal/care support. Reconcile real cargo,gross/tare,space/time,traction and care native demand separately. Supported causal drivers may include actual work,mass-distance,occupied space-time,care duration or metered resources;animal count,nominal wagon capacity,money,equal fractions or adding unlike units are not defaults. Empty/failure/return burdens remain in the evidenced serving pool once. |  |\n| same_asset_life | rail_animal_service | Attribute each actual locomotive,wagon,containment/tank/cage,ventilation/oxygen equipment,handling,track/catenary and terminal asset by native delivered quantity times studied compatible duty divided by positive documented same-asset all-user useful lifetime duty,then/N once. Include actual passenger/freight/other users where served;initial manufacture,replacements,maintenance and retirement are disjoint. Carried animals are not counted as carrier working-life assets. |  |\n| adverse_outcomes | rail_animal_service | Keep actual rejected,injured,dead,escaped,returned or unresolved animal states and producing duties/periods with their true care and body/waste destinations. Retain attributable burden even without completed output;actual independently accepted amended/partial obligation needs original-to-amended trace and comparability,not postfailure scope shrink. Material recovery,manure/carcass product,waste and environmental release require actual identity/receiver and explicit treatment;no automatic animal-rearing,fertilizer or energy avoided-product credit. |  |\n\n"
