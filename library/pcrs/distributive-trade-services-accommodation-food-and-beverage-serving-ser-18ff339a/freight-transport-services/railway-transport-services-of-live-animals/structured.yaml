  what: "Completed scoped rail live-animal consignment carriage and care obligation"
  how_much: "1 actual completed scoped rail live-animal consignment carriage-and-care obligation"
  how_well: "Actual live-animal species/stage/cohort,state at taking-in-charge,original care/rail gates,actual distance/duration,required condition/quality and independently accepted completion with adverse outcomes disclosed."
  how_long_or_cycle: "Actual leg and supporting complete duty/lifecycle interval; report actual elapsed time and cohort period."
  reference_flow_link: "completed_rail_animal_service"
system_boundary:
  rules:
    - rule_id: scope_and_species
      applies_to: "rail_animal_service"
      rule: "Apply full railway live-animal carriage scope at actual consignment and care gates. Obtain actual species/stage/condition and relevant species-specific competence/source evidence; dated terrestrial livestock or fish guidance is context, not universal terrestrial/aquatic/wild/companion rules."
      source_ids:
        - unsd-rail-live-2025
    - rule_id: care_ownership
      applies_to: "rail_animal_service"
      rule: "Declare when actual animal-owner/keeper/carrier/terminal/veterinary provider care responsibility starts and ends through pickup,loading,rail running,shunting,dwell,rest,border delay,unloading and accepted handover. One actual event,source,supplier and period has one burden owner. Complete necessary uncovered care/asset/supply phases;verified whole provider results replace only exact included native-demand cells."
      source_ids: []
    - rule_id: care_evidence
      applies_to: "rail_animal_service"
      rule: "Collect the actual journey/care plan and real condition/fitness,loading/handling,feed/water,ventilation/temperature,rest/inspection,veterinary/emergency and cleaning/biosecurity records appropriate to the actual animal. Record observed adverse events and actual owner/responses;no veterinary dosage,fitness threshold,loading density or universal care frequency is invented by this PCR."
      source_ids:
        - woah-land-2024
    - rule_id: aquatic_and_other_species
      applies_to: "rail_animal_service"
      rule: "For actual aquatic consignments identify species/stage,transport medium and containment,real water state/quantity,oxygen source or aeration,circulation/renewal,temperature,pH and relevant actual water-quality/metabolic observations. Other real wild/companion/species needs require their actual evidence,not an automatic livestock or freshwater-fish template. Supplied oxygen/air/water,environmental inputs,dissolved substances,collected water and actual environmental releases are separate native exchanges and fates."
      source_ids:
        - fao-live-fish-1986
    - rule_id: animal_custody_and_metabolism
      applies_to: "rail_animal_service"
      rule: "Live animal count/state,mass,death/injury/escape/return and dead-body custody are collection ledgers,not additional final transport product exchanges. Separate received animals from supplied feed,bedding and working/carrier assets. Assess actual animal metabolism and excretion during the declared care interval once at its disclosed owner;an animal-production/provider dataset covering that actual time replaces exact cells,without charging ordinary animal rearing/manufacture again or assuming resting-baseline emissions are zero."
      source_ids: []
    - rule_id: rail_duty_energy_life
      applies_to: "rail_animal_service"
      rule: "Preserve actual trainconsists,loaded/empty locomotives and wagons,repositioning,formation/shunting,yard dwell,waiting,failed/return/recovery and animal-care auxiliary duty. Actual traction/animal ventilation or aquatic support energy use separate meters/native gates and provider coverage. All real propulsion/configurations,locomotive/wagon/containment/lift/track/catenary/terminal assets and manufacture,initial/replacement,maintenance,retirement remain required at actual all-user lifetime demand. Internal regeneration is not new external supply;fuel supply/burn/stock/fates remain distinct."
      source_ids: []
    - rule_id: bodies_waste_environment
      applies_to: "rail_animal_service"
      rule: "A death changes live/dead custody state,not automatically waste generation or environmental emission. Identify actual dead-body receiver,retention/return/recovery/disposal and legal/health responsibility from real records;no assumed carcass mass from headcount. Separately identify collected manure/bedding,used water/cleaning/disinfectant,retired materials and actual substance/medium/subcompartment releases. Aquatic dissolved CO2 or ammonia is not automatically air emission;manure is not automatically fertilizer or credit. Unknown shortage/stock residual is not a fate."
      source_ids: []
