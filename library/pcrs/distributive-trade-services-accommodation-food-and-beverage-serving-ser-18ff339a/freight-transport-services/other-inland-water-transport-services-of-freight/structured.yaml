      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| task_strata_and_all_users | all nodes | Keep separate actual containerised, tug-barge/target-tow and positively evidenced other n.e.c. profiles, subdivided by original task/object/quantity/quality/gates/route/distance/time, water/current/lock and tow configuration/technology responsibility where material. No unlike task-count equivalence or pooled stratum average. Direct subdivision/meters first; shared vessel/convoy/terminal/lock/channel/life burdens use supported causal mass/space/resistance/time/energy/capacity/useful-duty drivers across all consuming users. Count reference does not mandate equal per-task or per-container allocation. Economic fallback needs no physical relationship and sensitivity; each event shares sum to one. | ghg-product-2011 |\n| failed_original_task | all nodes | Within compatible stratum/fingerprint retain causal preparation, lock queue/splitting/rejoin/assist, weather/water-level wait, empty/ballast/return and partial/failed/rejected/rescue/rework burdens before dividing once by positive originally-qualified completed count N. No new completed task per lock, container transfer, tug change or cut convoy; original independently bounded accepted tasks count once. Original failure is not erased by resetting object/destination/acceptance after event. N=0 has no finite intensity and failed-period records remain for causal attribution. | ghg-product-2011 |\n| multipurpose_lock_waterway | waterway_support_lifecycle | First identify actual navigation-purpose cells versus other waterway/dam purposes, then allocate navigation cells across all actual freight/passenger/recreational/other users using supported physical duty/lockage/space/time/capacity relationships, not one commission equals one complete lock cycle or all construction. Meter actual split lockages/queue/assist and actual water/energy/storage boundaries. Gravity, pumped, water-saving/reuse arrangements and provider-covered events differ; internal transfer not extra external supply or avoided consumption credit. No universal water-per-lock/cargo-tonne factor. | bafg-waterways; ghg-product-2011 |\n| all_life_period_site | all nodes | Allocate actual native asset/life-event quantity by same-cohort attributable useful duty / supported positive total all-user useful duty for that phase, then by compatible N. Preserve manufacture/install/refit/commission/maintain/drydock/channel works/replace/retire and true container/towgear cycles with actual stocks/events across periods. No assumed initial asset free or universal container/vessel/lock life. Compatible reach/voyage/site pooling sums attributable native quantities / summed compatible N; disclose actual water/lock/technology differences and never average incompatible task intensities. | ghg-product-2011 |\n| native_provider_recovery | all nodes | Native carrier/charter/container/lock/terminal/channel/maintenance/treatment functions and property/unit/gates/covered life/events remain explicit. A tonne-km, vessel-hour, lockage, rental day, fee or bare container is not one completed commission; connect actual supplier quantity through supported activity, no forced function/unit conversion. Exact covered own cells replaced once with gaps retained. Internal generated power/water recirculation/material recovery not extra bought supply/output; actual external useful co-output requires receiver/subdivision or justified allocation, no automatic recovery/recycling/lock-water credit. | ghg-product-2011 |\n\n"
