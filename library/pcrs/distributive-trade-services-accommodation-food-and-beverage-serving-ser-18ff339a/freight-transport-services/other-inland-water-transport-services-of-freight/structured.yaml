      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_full_inland_task | all nodes | Verify full official containerised articles/packages,tugboat barge inland/canal tow,all listed target tow,actual n.e.c. and correct inland/other-specific-function interfaces. Require original bounded qualified task, mandatory/finer strata, actual object/quantity/configuration/route/gates/acceptance and5functional fields/native Count support. No container-only scope or container/tug/lock/invoice/tonne-km/manufactured-target proxy or unlike task equivalence. | unsd-cpc3-65229; ghg-product-2011 |\n| validate_whole_actor_reach | inland_navigation; container_tow_interfaces | Verify actual cargo versus reusable container/gear and customer-target versus real service-barge asset roles, full tug(s)/barge/target preparation/connection/transport-support energy/receiver responsibilities. Inland reach/current/waterlevel/lake/tide and actual locks/queues/split-rejoin/assist/empty/weather/failed duties retained once; intermediate lock/cut/transfer not new completion. Original target/cargo production stays outside, actual initial/customer consumed fuel-energy upstream once regardless title with supply/consumption provenance and no whole-stock or purchase-withdrawal duplication. | ghg-product-2011 |\n| validate_water_purpose_life_provider | waterway_support_lifecycle | Verify actual lock/channel water intake/storage/outflow/consumptive loss and source-destination/basin ledger: intake and added water are mutually exclusive, intake excludes separately recorded precipitation/other additions and no supply/intake/pump-transfer duplicate for one physical quantity; actual compatible measured units/state/gates preserved, internal recirculation cancels, no all lock water consumed/tap-water assumption. Actual gravity/pump/control energy and all-purpose/all-user shares, full manufacture/install/commission/maintain/channelwork/drydock/replace/retire phases and native provider quantities/cells required. Navigation not all hydropower/floodcontrol/water supply/recreation; manufacture/fee/lockage not full life/commission. Actual receiver/species/medium including saline inland water preserved. Verify unique asset/component/event-to-row ownership across vessel/aircraft, reusable equipment, infrastructure, maintenance and provider cards as applicable; whole-assembly included parts and their separate supplies cannot both enter the same phase inventory. | bafg-waterways; ghg-product-2011 |\n| validate_stock_denominator_identity | all nodes | Verify mutually exclusive stock/recovery/use/outward/waste/environment and complete native species/quantity/protocols, no internal recovery extra term or captured waste all emitted. Positive compatible N_s,f only original full acceptance, no retrospective task reset/count inflation; retain failed/zero-completion burdens, all-user shares sum to one and no double normalization. Final concrete identity/property/unit/state/gate/medium verified, each actual conditional exchange expanded and unresolved final row registered. EN/ZH/structured contain every normative rule; missing incomplete not zero. | ghg-product-2011 |\n| atomic_inland_navigation | inland_navigation | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| atomic_container_tow_interfaces | container_tow_interfaces | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| atomic_waterway_support_lifecycle | waterway_support_lifecycle | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
