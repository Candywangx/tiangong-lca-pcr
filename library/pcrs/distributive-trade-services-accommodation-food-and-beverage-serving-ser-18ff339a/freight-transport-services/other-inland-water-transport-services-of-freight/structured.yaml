rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Verified native property of this substance, resource or physical emission at its actual compartment"
      frequency: "Every actual occurrence and each evidenced absence decision"
      temporal_coverage: "Full declared cohort and attributable asset life/linked events"
      site_scope: "Actual responsible sites/providers of this process only"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "Match sampling or activity and applicable factor to species, phase, origin and compartment. Keep mass, particle number, heat and elemental-equivalent bases separate where applicable; document any conversion and exclude overlapping totals. For the stated physical identity and matching input basis, apply the following quantity rule only at its specified attribution and normalization state: Each actual disjoint environmental release / N Preserve original records, applied factors and resulting units. Value mode: calculated_value; Specificity: site_specific; Normalization basis: per declared reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_support; Sources: unsd-cpc3-65229; ghg-product-2011. Require original records, exact native support and per-concrete-row verification; these instructions do not supply a missing identity or numerical value. Completion gate: check_occurrence_completion."
  calculation_rules:
    - id: qualified_original_count
      applies_to: "qualified_inland_commission"
      rule: "Within each mandatory stratum s and compatible original-task fingerprint f, N_s,f = sum_j I(task j meets its original predeclared full acceptance). Each original bounded qualified carrier commission contributes one once; partial/failed/rejected task none, without post-event task split/reset or losing causal burden. Locks/convoy cuts/rejoining/container transfers are task events, not automatically new outputs. Final output is 1 Item(s); N_s,f > 0 required for finite intensity. Supplemental actual mass/distance/time/lock/target drivers do not replace final function or establish cross-stratum equivalence."
      inputs:
        - "original task/stratum/fingerprint and actual full acceptance"
        - cp_task
      output: "N_s,f; qualified_inland_commission"
      source_ids:
        - unsd-cpc3-65229
        - ghg-product-2011
    - id: exclusive_material_custody
      applies_to: "cargo/container/target/fuel/material/gear ledgers"
      rule: "On common actual gates/time and conserved native basis: opening + external_receipts = closing + actual_accepted_delivery_or_use + returned_or_recovered_outward + distinct_waste_outward + actual_environmental_loss + documented_residual. Terms disjoint; internal recovery/reuse/recirculation is not extra receipt/outward/use, recovered material only actual closing, later actual use or one outward destination. Cargo/target custody distinct from reusable equipment manufacture/life. Link consumed initial/customer fuel/energy actual withdrawal to native upstream supply/charging once regardless title/purchaser; purchase not second withdrawal input and retained reserve not consumed. Actual species/carbon/fate balances and uncertainty required, unknown residual not emission or zero."
      inputs:
        - "actual openclose/receipt/use/delivery/return/waste/environment"
        - cp_energy
        - cp_interfaces
        - cp_support
      output: "exclusive material/custody and consumption reconciliation"
      source_ids:
        - ghg-product-2011
    - id: waterway_water_balance
      applies_to: "actual modeled facility/water reach"
      rule: "At actual defined source/facility/destination gates on compatible volume/mass/state basis: opening_water_storage + actual_external_intake + actual_added_water = closing_water_storage + actual_outflow_to_each_destination + actual_evaporation_or_other_distinct_consumptive_loss + documented_residual. The source categories are mutually exclusive: actual_external_intake is the metered/quantified intake (including any supplied water) EXCLUDING separately recorded precipitation or other additions; actual_added_water contains only independently evidenced precipitation/other additions not already in that intake. One physical inflow is not counted again under supply, pump-transfer or another label. Internal lock-chamber/reuse/recirculation transfers cancel within the chosen boundary, not repeated intake/outflow. Cross-basin/source-destination transfer is recorded explicitly, not all intake equated consumption; actual polluting species/heat and state conversions separately supported. Allocate only actual purpose/user share, no universal water-per-lock/tonne and no assumption of pumped energy for gravity or zero control/asset burden."
      inputs:
        - "actual storage/intake/addition/outflow/consumptive losses/state/basin"
        - cp_waterway
      output: "water source-destination/storage balance and actual resource attribution"
      source_ids:
        - bafg-waterways
        - ghg-product-2011
    - id: native_life_normalization
      applies_to: "all actual rows in compatible task stratum"
      rule: "q_row,ref,s,f = sum(q_native,event × supported actual purpose/all-user causal share) / N_s,f once. Same-cohort asset share is attributable useful duty / supported positive total all-user useful duty for the phase. Include actual preparation/lock/queue/split-rejoin/empty/water-weather/failed and uncovered full life/provider events. Actual supplier native quantities link through supported activity, not force a lockage/container/hour/tonne-km into one commission. Aggregate only compatible raw numerators and N_s,f with actual differences disclosed."
      inputs:
        - "actual native event quantity"
        - "purpose/all-user life/causal shares"
        - "compatible denominator indexed by stratum s and fingerprint f"
      output: "per-reference native exchange"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: original_inland_task_quality
      applies_to: "reference, branch and reach events"
      requirement: "Require original preoperation task/quantity/object/gates/acceptance and actual completion, mandatory/finer strata and full failed/partial duty records. Actual container/cargo/tare, whole tug-barge-target and actual inland reach/current/waterlevel/locks/route evidence required; no unknown freight assigned n.e.c. or assumed one-box-task."
      evidence: "Signed original contract/acceptance, calibrated quantities and actual route/convoy/facility logs"
    - id: water_native_life_scope
      applies_to: "water/energy/providers/assets/fates"
      requirement: "Actual water state/source/destination/basin/storage, energy path/initial fuel provenance, species/phase/medium and native provider/all-user purpose/life scope require measured or source-specific justified quantities with uncertainty. Historical Germany/US or CCNR examples inform actual questions, not universal lock/river/box/efficiency/legal limits; actual gravity/pumped/reuse arrangements and recipients matter."
      evidence: "Actual native meters/state/source records, purpose-user coverage and full life register"
    - id: no_default_validation
      applies_to: "all nodes and validation"
      requirement: "No universal task size/TEU conversion, tug load/speed/current ratio, water-per-lock, fuel/slip/leak or container/vessel/waterway lifetime or human metabolic factors. Independent compatible QA samples required, same batch maximum cannot validate itself. Missing quantity/identity incomplete; scientific review and each final concrete binding still required despite checker pass."
      evidence: "Independent compatible comparison and explicit unresolved evidence register"
validation_rules:
  - rule_id: validate_full_inland_task
    applies_to: "all nodes"
    rule: "Verify full official containerised articles/packages,tugboat barge inland/canal tow,all listed target tow,actual n.e.c. and correct inland/other-specific-function interfaces. Require original bounded qualified task, mandatory/finer strata, actual object/quantity/configuration/route/gates/acceptance and5functional fields/native Count support. No container-only scope or container/tug/lock/invoice/tonne-km/manufactured-target proxy or unlike task equivalence."
    source_ids:
      - unsd-cpc3-65229
      - ghg-product-2011
  - rule_id: validate_whole_actor_reach
    applies_to: "inland_navigation; container_tow_interfaces"
    rule: "Verify actual cargo versus reusable container/gear and customer-target versus real service-barge asset roles, full tug(s)/barge/target preparation/connection/transport-support energy/receiver responsibilities. Inland reach/current/waterlevel/lake/tide and actual locks/queues/split-rejoin/assist/empty/weather/failed duties retained once; intermediate lock/cut/transfer not new completion. Original target/cargo production stays outside, actual initial/customer consumed fuel-energy upstream once regardless title with supply/consumption provenance and no whole-stock or purchase-withdrawal duplication."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_water_purpose_life_provider
    applies_to: "waterway_support_lifecycle"
    rule: "Verify actual lock/channel water intake/storage/outflow/consumptive loss and source-destination/basin ledger: intake and added water are mutually exclusive, intake excludes separately recorded precipitation/other additions and no supply/intake/pump-transfer duplicate for one physical quantity; actual compatible measured units/state/gates preserved, internal recirculation cancels, no all lock water consumed/tap-water assumption. Actual gravity/pump/control energy and all-purpose/all-user shares, full manufacture/install/commission/maintain/channelwork/drydock/replace/retire phases and native provider quantities/cells required. Navigation not all hydropower/floodcontrol/water supply/recreation; manufacture/fee/lockage not full life/commission. Actual receiver/species/medium including saline inland water preserved. Verify unique asset/component/event-to-row ownership across vessel/aircraft, reusable equipment, infrastructure, maintenance and provider cards as applicable; whole-assembly included parts and their separate supplies cannot both enter the same phase inventory."
    source_ids:
      - bafg-waterways
      - ghg-product-2011
  - rule_id: validate_stock_denominator_identity
    applies_to: "all nodes"
    rule: "Verify mutually exclusive stock/recovery/use/outward/waste/environment and complete native species/quantity/protocols, no internal recovery extra term or captured waste all emitted. Positive compatible N_s,f only original full acceptance, no retrospective task reset/count inflation; retain failed/zero-completion burdens, all-user shares sum to one and no double normalization. Final concrete identity/property/unit/state/gate/medium verified, each actual conditional exchange expanded and unresolved final row registered. EN/ZH/structured contain every normative rule; missing incomplete not zero."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_inland_navigation
    applies_to: "inland_navigation"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_container_tow_interfaces
    applies_to: "container_tow_interfaces"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_waterway_support_lifecycle
    applies_to: "waterway_support_lifecycle"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
