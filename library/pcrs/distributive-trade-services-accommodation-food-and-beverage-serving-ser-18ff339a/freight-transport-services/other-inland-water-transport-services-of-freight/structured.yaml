allocation_rules:
  - rule_id: task_strata_and_all_users
    applies_to: "all nodes"
    rule: "Keep separate actual containerised, tug-barge/target-tow and positively evidenced other n.e.c. profiles, subdivided by original task/object/quantity/quality/gates/route/distance/time, water/current/lock and tow configuration/technology responsibility where material. No unlike task-count equivalence or pooled stratum average. Direct subdivision/meters first; shared vessel/convoy/terminal/lock/channel/life burdens use supported causal mass/space/resistance/time/energy/capacity/useful-duty drivers across all consuming users. Count reference does not mandate equal per-task or per-container allocation. Economic fallback needs no physical relationship and sensitivity; each event shares sum to one."
    source_ids:
      - ghg-product-2011
  - rule_id: failed_original_task
    applies_to: "all nodes"
    rule: "Within compatible stratum/fingerprint retain causal preparation, lock queue/splitting/rejoin/assist, weather/water-level wait, empty/ballast/return and partial/failed/rejected/rescue/rework burdens before dividing once by positive originally-qualified completed count N. No new completed task per lock, container transfer, tug change or cut convoy; original independently bounded accepted tasks count once. Original failure is not erased by resetting object/destination/acceptance after event. N=0 has no finite intensity and failed-period records remain for causal attribution."
    source_ids:
      - ghg-product-2011
  - rule_id: multipurpose_lock_waterway
    applies_to: "waterway_support_lifecycle"
    rule: "First identify actual navigation-purpose cells versus other waterway/dam purposes, then allocate navigation cells across all actual freight/passenger/recreational/other users using supported physical duty/lockage/space/time/capacity relationships, not one commission equals one complete lock cycle or all construction. Meter actual split lockages/queue/assist and actual water/energy/storage boundaries. Gravity, pumped, water-saving/reuse arrangements and provider-covered events differ; internal transfer not extra external supply or avoided consumption credit. No universal water-per-lock/cargo-tonne factor."
    source_ids:
      - bafg-waterways
      - ghg-product-2011
  - rule_id: all_life_period_site
    applies_to: "all nodes"
    rule: "Allocate actual native asset/life-event quantity by same-cohort attributable useful duty / supported positive total all-user useful duty for that phase, then by compatible N. Preserve manufacture/install/refit/commission/maintain/drydock/channel works/replace/retire and true container/towgear cycles with actual stocks/events across periods. No assumed initial asset free or universal container/vessel/lock life. Compatible reach/voyage/site pooling sums attributable native quantities / summed compatible N; disclose actual water/lock/technology differences and never average incompatible task intensities."
    source_ids:
      - ghg-product-2011
  - rule_id: native_provider_recovery
    applies_to: "all nodes"
    rule: "Native carrier/charter/container/lock/terminal/channel/maintenance/treatment functions and property/unit/gates/covered life/events remain explicit. A tonne-km, vessel-hour, lockage, rental day, fee or bare container is not one completed commission; connect actual supplier quantity through supported activity, no forced function/unit conversion. Exact covered own cells replaced once with gaps retained. Internal generated power/water recirculation/material recovery not extra bought supply/output; actual external useful co-output requires receiver/subdivision or justified allocation, no automatic recovery/recycling/lock-water credit."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "inland_navigation"
      flow_role: "Original inland task/stratum and qualified completion"
      record_type: "Actual primary meter/manifest/provider records"
      raw_fields: "Original preoperation taskID/stratum/fingerprint; actual cargo/container quantity/quality/tare or full tow target/configuration; inland route/reach/gates/acceptance/time; all vessels/tugs/barges; actual completion/partial/failure/change and receiver lineage; compatible N"
      collection_method: "Link original physical task specification to actual signed custody/acceptance and each reach/lock/convoy event; mandatory strata and finer compatible fingerprints, no retrofit completion definition Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "Count Item(s); actual cargo/container/target quantities; route distance/time"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Actual original task/reporting period, waterway events and full asset phases"
      site_scope: "Actual inland reaches, vessels/tugs/barges/targets, locks/lifts/terminals and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Signed records; calibration; native provenance; causal allocation; uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_energy
      process_id: "inland_navigation"
      flow_role: "All responsible navigation/tow/target energy and direct species"
      record_type: "Actual primary meter/manifest/provider records"
