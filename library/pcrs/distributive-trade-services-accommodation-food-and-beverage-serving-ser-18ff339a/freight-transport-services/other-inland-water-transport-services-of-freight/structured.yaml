system_boundary:
  rules:
    - rule_id: full_other_inland_scope
      applies_to: "all nodes"
      rule: "Cover the complete official inland functions: specially constructed handling-container carriage of assembled individual articles/packages; tugboat-provided barge towing on inland waterways/canals; towing oil rigs, floating cranes, dredging vessels, buoys, hulls and incomplete vessels; actual other freight n.e.c. Parent activity is an inland carrier commission. Actual self-propelled/container, tug-and-barge or target-tow configurations and other technologies have distinct input/quantity/data/quality/gate differences; select only real branches. Document any actual pushed arrangement within its evidenced tug-barge/carrier function rather than silently adding all industrial pushing. N.e.c. requires positive classification evidence excluding specifically classified functions."
      source_ids:
        - unsd-cpc3-65229
        - bafg-waterways
    - rule_id: original_task_and_inland_gates
      applies_to: "inland_navigation; container_tow_interfaces"
      rule: "Before operation declare original bounded task/stratum/fingerprint, actual cargo quantity/condition or tow target/configuration, inland origin/destination route/gates, agreed time/quality and original completion acceptance. Retain actual receiver/custody evidence and failed/partial/changed task lineage; no retrospective completion reset. Rivers/canals/lakes/tidal reaches and coastal/inland transitions are actual classification/geographic facts, not assumed from ship size, salinity or terminal name. Split real mixed-mode stages once with actual responsibility; paperwork/billing alone not physical acceptance."
      source_ids:
        - unsd-cpc3-65229
        - ghg-product-2011
    - rule_id: container_articles_branch
      applies_to: "container_tow_interfaces; inland_navigation"
      rule: "Identify actual articles/packages and specially constructed transport-handling container type/quantity, loading/stowage/securing and cargo net mass/volume versus reusable container/chassis/pallet tare. Do not assume every unit is a standard ISO box, TEU conversion or one task per box. Actual terminal/lift/crane/re-stow/transhipment and container supply/reuse/return/repair/cleaning/loss/retirement/cycles follow real ownership and all users. Original goods manufacture stays outside; only real added service supplies and custody damage/replacement/treatment implications enter once. Container branch acceptance is not final consumer delivery."
      source_ids:
        - unsd-cpc3-65229
        - ccnr-container-stability
        - ghg-product-2011
    - rule_id: whole_inland_tug_target
      applies_to: "inland_navigation; container_tow_interfaces"
      rule: "For tugboat barge towing and listed targets, record the complete tug(s)/pusher-assistance arrangement/barge(s)/target configuration, target geometry/displacement/draft/windage, cargo if any, connection/release/receiver and agreed safe handover. Include actual preparation/inspection/rigging, all responsible tug/assist/target propulsion and auxiliary pumps/ballast/lights/riding-crew support attributable to transport, not only the leading tug. A customer rig/buoy/hull being moved is a custody target whose manufacture is excluded; a true supplied reusable service barge/container/tow gear is an asset with full all-user life. Target dredging/drilling/production/installation is separate, not assumed a transport input."
      source_ids:
        - unsd-cpc3-65229
        - bafg-waterways
        - ghg-product-2011
    - rule_id: reach_lock_convoy_duties
      applies_to: "inland_navigation; waterway_support_lifecycle"
      rule: "Record actual reach direction/current, water level/depth/draft restrictions, free-flow/impounded/canal/lake/tidal condition, route and mode-specific time/energy. Retain real approach/queue/anchorage/lock/lift/mooring/split-convoy/rejoin/assist, port/reposition/ballast/empty/return, closure/low-water/weather diversion/wait/failure/rescue duties and actual allocation. Locks and lift stages or intermediate convoy cuts are not extra final tasks. No default lock dimensions/barge number/speed/river factor, no all routes assumed locked and no current assistance interpreted as zero lifecycle."
      source_ids:
        - bafg-waterways
        - ghg-product-2011
    - rule_id: fuel_energy_title
      applies_to: "inland_navigation; waterway_support_lifecycle"
      rule: "Trace every actual main/auxiliary/boiler/generator/PTO/battery/shore/other fuel or energy path, internal conversion and real remaining sources once. Actual cargo/target/vessel customer-owned or initial fuel/stored energy withdrawn and consumed for this transport carries compatible native upstream supply/charging burden once regardless purchaser/title/internal price; link withdrawal to consumption and supply provenance. Purchase and withdrawal not two inputs, reserve/closing stock not all consumed, whole cargo/target manufacture not imported. Actual alternative/pilot fuels, vent/leak/slip, species and carbon origin remain explicit; berth/lock shutdown does not erase upstream or still-running loads."
      source_ids:
        - epa-shore-power
        - ghg-product-2011
    - rule_id: waterway_water_support
      applies_to: "waterway_support_lifecycle"
      rule: "Actual navigation channels/locks/lifts/pumps/berths/terminals and maintenance/dredging support require their real functions, energy/material/native service quantities, ecological/material/resource/receiver scope and all-user purpose attribution. Lock filling/draining, cross-basin transfer and recirculation are not automatically water consumption or tap-water supply. Identify actual source/destination compartments, storage change, pump/gravity/control duties, losses and provider coverage; a gravity-fed lock is not evidence that controls, construction or maintenance have zero burden. Separate navigation from hydropower/flood control/water supply/recreation and other users; do not charge a whole multipurpose river/dam to one cargo task."
      source_ids:
        - bafg-waterways
        - ghg-product-2011
    - rule_id: full_assets_native_providers
      applies_to: "waterway_support_lifecycle"
      rule: "PCR lifecycle choice includes actual carrying vessels/tugs/service barges, propulsion/handling/container/towlines/rigging, waterway/channel/lock/lift/port/shore/maintenance assets manufacture/construction/install/refit/commissioning, maintenance/repair/drydock/dredging renewal/replacement and retirement. Include actual life-event direct releases/wastes/resources and covered initial parts/charge exclusively, not manufacture equals all life or assumed service lifetime. Native carrier/charter/terminal/lock/navigation/maintenance/treatment providers replace exact covered inputs/emissions/life cells once; uncovered responsibilities remain. Existing/leased/shared assets keep supported same-cohort all-user useful duty."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic_inland_exchanges
      applies_to: "all nodes"
      rule: "Each actual unrepresented input/asset/provider/waste/direct species/resource expands into one concrete row_id at one true node/direction/type, single native identity/property/unit/state/gate/quantity, source/same-node protocol and receiver/medium with uncertainty. Actual combustion, fuel/ancillary refrigerant, cargo spill/dust, container cleaning, ballast/cooling/thermal/bilge/sewage/scrubber/antifouling/wear and maintenance/dredged material fates depend on real records, not universal factors. Inland does not mean freshwater: preserve actual freshwater/brackish/marine/air/soil compartment, compound/size/phase/carbon origin and collected versus released destination. Missing is incomplete, not zero."
      source_ids:
        - ghg-product-2011
