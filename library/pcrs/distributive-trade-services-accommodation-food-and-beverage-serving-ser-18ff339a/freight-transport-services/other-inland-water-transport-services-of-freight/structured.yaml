      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Original inland task/stratum/object/gates and actual waterway/vessel/interface/provider responsibility |\n| starting_condition_role | Task receipt does not erase preparation, customer-held consumed fuel/energy or pre-existing service-asset life |\n| product_classification_scope | Full65229 containerisedarticles/packages,tugboatbarge/inlandcanal tow,all listed targets,actualothernec |\n| recursive_input_rule | Exact native provider-covered inputs/emissions/life replace matching own cells once |\n| upstream_dataset_requirement | Actual native function/property/unit/gate and branch/reach/technology/period/life scope |\n| disclosure | Original acceptance/N/strata, actual route/water/lock/convoy duties, all users/purposes/life/native provider cells, fates and missing evidence |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_other_inland_scope | all nodes | Cover the complete official inland functions: specially constructed handling-container carriage of assembled individual articles/packages; tugboat-provided barge towing on inland waterways/canals; towing oil rigs, floating cranes, dredging vessels, buoys, hulls and incomplete vessels; actual other freight n.e.c. Parent activity is an inland carrier commission. Actual self-propelled/container, tug-and-barge or target-tow configurations and other technologies have distinct input/quantity/data/quality/gate differences; select only real branches. Document any actual pushed arrangement within its evidenced tug-barge/carrier function rather than silently adding all industrial pushing. N.e.c. requires positive classification evidence excluding specifically classified functions. | unsd-cpc3-65229; bafg-waterways |\n| original_task_and_inland_gates | inland_navigation; container_tow_interfaces | Before operation declare original bounded task/stratum/fingerprint, actual cargo quantity/condition or tow target/configuration, inland origin/destination route/gates, agreed time/quality and original completion acceptance. Retain actual receiver/custody evidence and failed/partial/changed task lineage; no retrospective completion reset. Rivers/canals/lakes/tidal reaches and coastal/inland transitions are actual classification/geographic facts, not assumed from ship size, salinity or terminal name. Split real mixed-mode stages once with actual responsibility; paperwork/billing alone not physical acceptance. | unsd-cpc3-65229; ghg-product-2011 |\n| container_articles_branch | container_tow_interfaces; inland_navigation | Identify actual articles/packages and specially constructed transport-handling container type/quantity, loading/stowage/securing and cargo net mass/volume versus reusable container/chassis/pallet tare. Do not assume every unit is a standard ISO box, TEU conversion or one task per box. Actual terminal/lift/crane/re-stow/transhipment and container supply/reuse/return/repair/cleaning/loss/retirement/cycles follow real ownership and all users. Original goods manufacture stays outside; only real added service supplies and custody damage/replacement/treatment implications enter once. Container branch acceptance is not final consumer delivery. | unsd-cpc3-65229; ccnr-container-stability; ghg-product-2011 |\n| whole_inland_tug_target | inland_navigation; container_tow_interfaces | For tugboat barge towing and listed targets, record the complete tug(s)/pusher-assistance arrangement/barge(s)/target configuration, target geometry/displacement/draft/windage, cargo if any, connection/release/receiver and agreed safe handover. Include actual preparation/inspection/rigging, all responsible tug/assist/target propulsion and auxiliary pumps/ballast/lights/riding-crew support attributable to transport, not only the leading tug. A customer rig/buoy/hull being moved is a custody target whose manufacture is excluded; a true supplied reusable service barge/container/tow gear is an asset with full all-user life. Target dredging/drilling/production/installation is separate, not assumed a transport input. | unsd-cpc3-65229; bafg-waterways; ghg-product-2011 |\n| reach_lock_convoy_duties | inland_navigation; waterway_support_lifecycle | Record actual reach direction/current, water level/depth/draft restrictions, free-flow/impounded/canal/lake/tidal condition, route and mode-specific time/energy. Retain real approach/queue/anchorage/lock/lift/mooring/split-convoy/rejoin/assist, port/reposition/ballast/empty/return, closure/low-water/weather diversion/wait/failure/rescue duties and actual allocation. Locks and lift stages or intermediate convoy cuts are not extra final tasks. No default lock dimensions/barge number/speed/river factor, no all routes assumed locked and no current assistance interpreted as zero lifecycle. | bafg-waterways; ghg-product-2011 |\n| fuel_energy_title | inland_navigation; waterway_support_lifecycle | Trace every actual main/auxiliary/boiler/generator/PTO/battery/shore/other fuel or energy path, internal conversion and real remaining sources once. Actual cargo/target/vessel customer-owned or initial fuel/stored energy withdrawn and consumed for this transport carries compatible native upstream supply/charging burden once regardless purchaser/title/internal price; link withdrawal to consumption and supply provenance. Purchase and withdrawal not two inputs, reserve/closing stock not all consumed, whole cargo/target manufacture not imported. Actual alternative/pilot fuels, vent/leak/slip, species and carbon origin remain explicit; berth/lock shutdown does not erase upstream or still-running loads. | epa-shore-power; ghg-product-2011 |\n| waterway_water_support | waterway_support_lifecycle | Actual navigation channels/locks/lifts/pumps/berths/terminals and maintenance/dredging support require their real functions, energy/material/native service quantities, ecological/material/resource/receiver scope and all-user purpose attribution. Lock filling/draining, cross-basin transfer and recirculation are not automatically water consumption or tap-water supply. Identify actual source/destination compartments, storage change, pump/gravity/control duties, losses and provider coverage; a gravity-fed lock is not evidence that controls, construction or maintenance have zero burden. Separate navigation from hydropower/flood control/water supply/recreation and other users; do not charge a whole multipurpose river/dam to one cargo task. | bafg-waterways; ghg-product-2011 |\n| full_assets_native_providers | waterway_support_lifecycle | PCR lifecycle choice includes actual carrying vessels/tugs/service barges, propulsion/handling/container/towlines/rigging, waterway/channel/lock/lift/port/shore/maintenance assets manufacture/construction/install/refit/commissioning, maintenance/repair/drydock/dredging renewal/replacement and retirement. Include actual life-event direct releases/wastes/resources and covered initial parts/charge exclusively, not manufacture equals all life or assumed service lifetime. Native carrier/charter/terminal/lock/navigation/maintenance/treatment providers replace exact covered inputs/emissions/life cells once; uncovered responsibilities remain. Existing/leased/shared assets keep supported same-cohort all-user useful duty. | ghg-product-2011 |\n| atomic_inland_exchanges | all nodes | Each actual unrepresented input/asset/provider/waste/direct species/resource expands into one concrete row_id at one true node/direction/type, single native identity/property/unit/state/gate/quantity, source/same-node protocol and receiver/medium with uncertainty. Actual combustion, fuel/ancillary refrigerant, cargo spill/dust, container cleaning, ballast/cooling/thermal/bilge/sewage/scrubber/antifouling/wear and maintenance/dredged material fates depend on real records, not universal factors. Inland does not mean freshwater: preserve actual freshwater/brackish/marine/air/soil compartment, compound/size/phase/carbon origin and collected versus released destination. Missing is incomplete, not zero. | ghg-product-2011 |\n\n"
