  - rule_id: validate_preservation_and_energy
    applies_to: "vessel_operation; cargo_cooling"
    rule: "Verify before/after usable cargo state, actual preconditioning before acceptance when responsible, cold quality/time and true receiver handover; loaded/empty/port/wait/defrost/failed cold duties included. Main/aux/boiler/shore/alternative fuel and shared generation-to-cold ownership closed once; shore power not assumed zero lifecycle or zero remaining boiler. Actual refrigerant/formulation/state/compartment and service ice/atmosphere fates required."
    source_ids:
      - ghg-product-2011
      - epa-shore-power
      - imo-ods
  - rule_id: validate_stock_life_provider
    applies_to: "all nodes"
    rule: "Verify mutually exclusive stock/recovery/outward/use/waste/environment entries and assembly-included initial charge/parts; no full charge emitted or recovery double count. Require all actual ship/cold/port/maintenance/drydock/install/retire phases, supported same-cohort all-user life duty, exact native provider function/unit/cells and retained uncovered burdens. Manufacture, charter fee or ship age alone does not establish whole-life service."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_quantities_and_identities
    applies_to: "all nodes"
    rule: "Require positive T for finite intensity, same-event causal shares sum to one, summed compatible native numerator/T and no double normalization; retain failed/zero-delivery burdens. Every final concrete flow identity/property/unit/state/gate/species/medium verified and each actual conditional exchange expanded with same-node protocol. Register unresolved real final output; missing is incomplete not zero. EN/ZH and structured projection carry every normative rule/protocol/calculation."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_vessel_operation
    applies_to: "vessel_operation"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_cargo_cooling
    applies_to: "cargo_cooling"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
