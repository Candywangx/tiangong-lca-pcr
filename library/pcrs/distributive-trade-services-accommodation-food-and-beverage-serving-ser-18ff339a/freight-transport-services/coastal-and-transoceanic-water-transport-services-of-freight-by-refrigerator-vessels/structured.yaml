allocation_rules:
  - rule_id: causal_ship_cold_all_user
    applies_to: "all nodes"
    rule: "Directly subdivide/meter vessel/leg/compartment/unit/cargo/cold task first. Shared propulsion/auxiliary/boiler/port/hotel/cold burdens use evidenced causal mass/resistance/load/space/thermal duty/time/capacity drivers across all refrigerated and other users; required cargo temperature/space/schedule constraints matter. A tonne-km reference does not mandate one allocation key for cold versus propulsion. Economic fallback requires absent supported physical relationship and sensitivity. Shares for each shared event sum to one."
    source_ids:
      - ghg-product-2011
  - rule_id: empty_failed_and_output
    applies_to: "all nodes"
    rule: "Retain causal preconditioning/empty ballast/reposition/wait/port/rescue/rejected/failed/return and redelivery work before dividing once by positive qualified delivered cold work T. Only actual cold-accepted delivered cargo portions contribute their loaded physical segments once; update pickup/drop and loss lineage without full-voyage repeated weight. No output for empty equipment/tare, rejected or missing goods, stationary cold storage or reserved capacity. A genuine distinct qualified return movement needs its own contract/segment/acceptance lineage; T=0 has no finite intensity."
    source_ids:
      - ghg-product-2011
  - rule_id: life_period_site_ownership
    applies_to: "all nodes"
    rule: "Allocate each actual native asset/life-event quantity by same-cohort attributable useful duty / supported positive total all-user useful duty, then by T. Preserve manufacture/install/refit/commission/maintain/drydock/replace/retire phases and actual cross-period stocks/events, including cold plant/initial charge and reusable units. Aggregate compatible sites/voyages using summed attributable native quantities / summed compatible T, with actual route/cold/equipment differences disclosed, never average unequal intensity denominators. Existing/leased/chartered asset phases require evidence rather than omission."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_heat_recovery
    applies_to: "all nodes"
    rule: "Subcontracted ship/cold/port/handling/support/life services keep native function/unit/gates and covered inputs/emissions/life phases, replacing exact own covered cells once. Uncovered portions remain explicit. Internal generated electricity/heat/cold/recirculated coolant is not extra external supply or final product. Only actual external useful electricity/heat/cold/material output gets a documented receiver and subdivision or justified allocation; no automatic cold/recovery/recycling credit. Captured outward waste/refrigerant differs from environmental release."
    source_ids:
      - ghg-product-2011
