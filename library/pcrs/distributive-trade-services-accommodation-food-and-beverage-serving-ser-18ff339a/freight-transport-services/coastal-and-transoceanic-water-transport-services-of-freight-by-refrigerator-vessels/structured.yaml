  calculation_rules:
    - id: delivered_cold_work
      applies_to: "qualified_cold_sea_work"
      rule: "T = sum_i (m_actual_cold_accepted_delivered,i in t × d_actual_loaded_segment,i in km). Each qualified portion and physical segment counted once; update actual pickup/drop/loss and exclude rejected/retained/tare. Actual navigation records convert to km with supported unit definition. Final output is 1 tkm; T > 0 is required for finite intensity."
      inputs:
        - "actual cold-accepted mass"
        - "actual loaded maritime segment distance"
        - cp_voyage
      output: "T; qualified_cold_sea_work"
      source_ids:
        - unsd-cpc3-65211
        - ghg-product-2011
    - id: exclusive_stock_refrigerant
      applies_to: "actual cargo/fuel/cold/material ledgers"
      rule: "For each conserved substance/native basis and common actual gates/time: opening + external_receipts = closing + actual_use_or_accepted_delivery + returned_or_recovered_outward + distinct_waste_outward + direct_environmental_loss + documented_residual. Destination terms are mutually exclusive. Internal recovery/reuse/recirculation is neither new external receipt nor extra outward/use: recovered material enters actual closing, later actual use or one outward destination. Track equipment-contained charge separately from free stock; assembly-included initial charge not again external supply. Fuel use branches into separate actual combustion/slip/vent/carbon ledger, not all fuel becomes CO2 or CH4. Split loss/recovery/waste/environment by actual phase/species/state; missing residual not forced to air or zero."
      inputs:
        - "opening/receipt/closing"
        - "actual disjoint use/delivery/return/waste/environment"
        - cp_energy
        - cp_cold
        - cp_support
      output: "exclusive custody and substance stock reconciliation"
      source_ids:
        - ghg-product-2011
    - id: energy_species_life_normalization
      applies_to: "all actual inventory rows"
      rule: "Allocate each actual native event quantity q_j × causal all-user share s_j; same-cohort asset share is attributable useful duty / supported positive all-user total useful duty for that phase. Retain actual loaded/empty/port/precondition/cold/failed and uncovered full-life/provider cells. Attribute main/aux/boiler/shore energy to actual duty without double internal generation-to-cold purchase; actual direct species use source-specific measurements or justified estimates and carbon/fate closure. q_row,ref = sum(q_row,attributable) / T once; compatible voyage/site aggregation uses summed quantities / summed compatible T."
      inputs:
        - "actual native event quantity"
        - "all-user causal/life shares"
        - "exact provider cells"
        - T
      output: "per-reference actual native exchange"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: cold_voyage_traceability
      applies_to: "reference, custody and preservation"
      requirement: "Require actual contract/receipt/handover, calibrated net mass and actual track/segment evidence plus cargo temperature/condition/time logs, not setpoint/TEU/deadweight or assumed successful handover. Preserve coastal/ocean route, commodity/compartment, causal failed and empty duties and each responsible cold gate."
      evidence: "Signed custody/temperature logs; calibrated scale/track units; actual responsibility map"
    - id: native_fate_quality
      applies_to: "actual inputs/direct/waste/providers"
      requirement: "Require actual material/refrigerant/fuel composition/state/native property/unit/gate, source-specific quantity/medium and performance/uncertainty; each real cold/port/water/fuel/asset provider scope fits technology/geography/year and exact covered cells. No universal cargo temperature, ship fuel/slip/leak/charge/life or cooling-water factor."
      evidence: "Actual supplier/service/stock/species/meter records and coverage matrix"
    - id: review_limits
      applies_to: "all nodes and validation"
      requirement: "Retain actual all-user life/period/site evidence and independent compatible QA samples; same batch maximum cannot validate itself. Missing quantity or exact identity remains incomplete. Scientific review and final concrete flow bindings stay required despite checker pass; candidate unresolved identities prevent claiming publication readiness."
      evidence: "Evidence register, independent comparisons, explicit unresolved inventory and uncertainty"
