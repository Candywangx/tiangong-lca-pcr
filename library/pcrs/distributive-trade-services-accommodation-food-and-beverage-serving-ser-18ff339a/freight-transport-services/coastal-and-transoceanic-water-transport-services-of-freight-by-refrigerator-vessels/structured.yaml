    rule: "Verify full frozen/refrigerated specially-compartment coastal/transoceanic scope and65212 liquid-gas cargo exclusion, actual gate/classification overlap and independent qualified net-mass×loaded-segment function. All5functional fields and exact tkm/native t*km alias required; no container-only/general goods/ship manufacturing proxy or output from tare/capacity/stationary/empty work."
