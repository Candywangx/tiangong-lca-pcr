      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual carrier gate, frozen/chilled cargo state, ship/compartment/route and supplier responsibility |\n| starting_condition_role | Carrier receipt state does not erase responsible preconditioning, prior asset life or supplied fuel/refrigerant |\n| product_classification_scope | Full65211 coastal/ocean specially refrigerated compartments; liquid gas cargo excluded65212 |\n| recursive_input_rule | Actual native provider-covered transport/cold/port/life cells replace matching own cells once |\n| upstream_dataset_requirement | Actual native function/property/unit/state/gates and technology/geography/year/lifecycle coverage |\n| disclosure | Qualified mass/route/cold gates, all loaded/empty/port duties, fuel/refrigerant/environmental fates, full all-user asset/provider scopes and unknowns |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_cold_vessel_function | all nodes | Cover full actual coastal/transoceanic carriage of frozen/chilled goods in specially refrigerated compartments. Conventional specialised reefer holds, actual refrigerated units, mixed cargo arrangements and real cooling/propulsion/handling alternatives are evaluated by evidence and actual classification gates, not one fleet example or container-only default. LNG carried as liquid-gas cargo remains65212; actual LNG fuel is a different energy role. Distinct technology inputs, quantities and quality matter; activate only real branches. | unsd-cpc3-65211; seatrade-fleet |\n| cold_before_after_handoff | cargo_cooling; vessel_operation | Declare actual cargo usable frozen/chilled condition before preservation, contractual temperature/condition/time, acceptance and true cold handover to receiver/next carrier. Include actual service-responsible preparation/testing/preconditioning before cargo acceptance and all loaded/empty/port/anchorage/waiting/defrost/cleaning cold duties until true responsibility transfer. Shipper-side product precooling or receiver-side storage is separate unless actually this service responsibility; provider gate cannot silently omit or duplicate cold. Setpoint alone does not prove cargo temperature or acceptance, and transport is not automatically freezing warm goods. | unsd-cpc3-65211; ghg-product-2011 |\n| whole_maritime_duty | vessel_operation; support_lifecycle | Include attributable loaded passage, manoeuvring/arrival/departure, anchorage/drift/wait/berth, ballast/empty reposition and equipment returns, start/stop/idle/layover, weather/route diversion, rescue/failure/cancellation/rejection and actual redelivery. Port/terminal loading, stevedoring, cranes, tugs/pilots and transfer/cold plugs follow actual contract responsibility/provider coverage. A billed port fee is not evidence of a particular native physical service or included asset life. Stationary handling/wait and empty ballast add burden without cargo-work output. | ghg-product-2011; epa-shore-power |\n| ship_energy_cold_separation | vessel_operation; cargo_cooling | Record actual main/auxiliary engine, boiler, generator, shaft/PTO/heat-recovery, battery and shore supply paths by mode and fuel. Include cold compressors/fans/pumps/defrost/controls/controlled-atmosphere and actual safety/hotel/crew-support loads according to responsibility. Onboard generated energy transferred to cooling is not another bought AC flow; allocate real shared generation once. Shore supply includes its actual upstream grid/connection/conversion losses and remaining onboard/connection-disconnection/boiler duties, never assumed whole-life zero. Actual alternative fuels and slip/pilot fuel are distinct; no universal engine factor. | epa-shore-power; imo-ghg3 |\n| actual_refrigerant_cold_material | cargo_cooling | Identify actual refrigerant substance/formulation/blend components, charge/state and equipment, including natural or other refrigerants without defaulting to R134a. Initial assembly-contained charge, separate makeup/recharge/recovery/reuse/leak/retirement are exclusive; recovery retained or handed outward once, not all charge emitted. Trace actual ice/dry ice/brine/secondary coolants/gas atmosphere materials and water, melt/effluent/vent/waste/native medium and carbon origin where relevant. Refrigeration cargo gas exclusion does not choose the plant refrigerant. Controlled-atmosphere or cold coproduct is only actual, not a mandatory cargo intervention. | imo-ods; imo-ghg3 |\n| cargo_custody_not_material_input | vessel_operation; cargo_cooling | Carried goods are custody objects rather than material consumed to manufacture transport. Exclude original goods production; track received/accepted/delivered/lost/damaged/returned/stock states and actual recipient. Actual extra service packaging/ice/consumables and carrier-responsible recovery/treatment remain included; disclose cargo replacement/upstream implications to downstream commodity model once. Goods rejection does not erase propulsion/cold/handling burdens or automatically mean all cargo becomes emitted waste. | ghg-product-2011 |\n| whole_vessel_cold_port_life | support_lifecycle | This PCR lifecycle choice includes actual ship/hull/propulsion, cooling/insulation/compartments/refrigerated units, batteries/controls/handling equipment and relevant port/berth/shore-power/maintenance assets manufacture, construction/install/refit, commissioning, repair/maintenance/drydock/renewal/replacement and retirement/recycling. Complete assembly and initial included parts/charge are exclusive; manufacture is not whole-life operation. Shared leased/chartered or already-existing assets keep actual native provider scopes and all-user useful duty; no assumed ship age/lifetime or zero capital burden. | ghg-product-2011 |\n| actual_species_environment | all nodes | Each actual energy/material/asset/provider/waste/direct substance not represented expands to one concrete row_id at one true node/direction/type, native identity/property/unit/state/gate/quantity, same-node protocol, source and actual receiver/medium with uncertainty. Direct combustion, fuel methane slip/leak, refrigerant and actual ballast/cooling/sewage/bilge/scrubber/wear/antifouling pathways are considered only where real. Each compound/particle size/carbon origin and air/water/soil compartment is distinct from aggregate NOx/SOx/CO2-equivalent, collected waste or recovered stock. Missing remains incomplete, not zero. | ghg-product-2011; imo-ghg3 |\n\n"
