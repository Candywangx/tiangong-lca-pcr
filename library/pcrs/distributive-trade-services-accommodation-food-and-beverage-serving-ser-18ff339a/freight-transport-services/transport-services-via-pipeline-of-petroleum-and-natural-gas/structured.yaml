system_boundary:
  rules:
    - rule_id: full_pipeline_function
      applies_to: "all nodes"
      rule: "Cover crude/refined petroleum and petroleum products plus natural gas, with full actual liquid/gas composition/state and contracted pipeline function. Do not narrow to methane transmission, crude oil alone, one pressure class or pump type. Actual liquid pumps, gas compressors, electric/fuel/other drives and pressure-control/thermal/treatment variants retain evidence-backed distinct inputs, quantities and quality. Do not activate every alternative simultaneously."
      source_ids:
        - unsd-cpc3-65131
        - phmsa-pipeline-faq
    - rule_id: transport_gates
      applies_to: "pipeline_movement; station_operations"
      rule: "Declare actual receipt-to-delivery custody, meter/terminal responsibility and contractual acceptance quantity, phase/composition, pressure, temperature and time. Include service-responsible preparation/start-up, line filling/packing, control, recirculation, delivery regulation, shutdown/standby and failed/rejected/off-spec/recovery duties. Transport-role treatment/separation is not commodity production; map separate production/refining/distribution/LNG/storage providers at explicit gates without silent inclusion or omission."
      source_ids:
        - unsd-cpc3-65131
        - phmsa-pipeline-faq
    - rule_id: continuous_stock_modes
      applies_to: "all nodes"
      rule: "Index meters, linepack/opening/closing stock, batch interfaces, runs/campaigns, shared continuous periods, cleaning/pigging, product changes and shutdown/maintenance by common temporal/gate basis. Product transition slops, drained liquids, purge/vent/recompression and returns have actual species/state/receiver and causal attribution. Retain every period including zero delivery; do not count shared run or prior-period linepack as new receipt."
      source_ids:
        - epa-pipeline-blowdowns
        - ghg-product-2011
    - rule_id: commodity_custody_fuel
      applies_to: "pipeline_movement; station_operations"
      rule: "Conveyed petroleum/gas is a custody object, not all a consumed transport input: exclude original commodity manufacture from this transport product and disclose delivered/lost/returned/stock quantities for downstream commodity accounting once. Actual withdrawn own-use fuel is a separate transport fuel input with its actual upstream fuel-supply burden once, irrespective of title or free internal pricing; do not add production of the entire conveyed stream. Recovered fuel replaces only actual fuel supply it displaces; internal custody transfer is not another product output or automatic avoided-production credit."
      source_ids:
        - ghg-product-2011
        - epa-engine-exhaust
    - rule_id: energy_and_release_ownership
      applies_to: "station_operations; pipeline_movement"
      rule: "Separate bought energy, actual compressor/pump drive fuel and internal generation/conversion/export/heat recovery. Retain pressure regulation, thermal conditioning, control, seals/pneumatics and start/standby energy. Fuel upstream is distinct from combustion, fuel-line leak, unburned engine slip, process leak, intentional vent/blowdown and flare feed/products. Actual fossil carbon content, gas composition, combustion/destruction performance and species/phase/air-water-soil or collected receiver are required; no universal leak fraction, flare destruction, pure-methane composition or zero-emission assumption."
      source_ids:
        - epa-engine-exhaust
        - epa-pipeline-blowdowns
        - ipcc-2019-fugitives
    - rule_id: whole_asset_life
      applies_to: "support_lifecycle"
      rule: "This PCR lifecycle choice includes actual pipeline/lining/valves, pump/compressor/drive/control/metering/pigging/regulation/thermal equipment, stations/power connections and relevant access/site assets manufacture, installation/construction, testing/commissioning, maintenance/repair/replacement/renewal and decommissioning/retirement. Complete assembly and included initial parts are exclusive; assembly manufacture is not full operating life. Include actual excavation/construction energy/materials, leaks/purges/wastes and restoration within causal responsibility; no universal lifetime or all-throughput ownership assumption."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic_actual_exchanges
      applies_to: "all nodes"
      rule: "Each actual unrepresented input/provider/asset/waste/direct substance expands to a concrete row_id in one true node, direction/type, single native identity/property/unit/state/gate/amount, source, same-node protocol and receiver/medium with uncertainty. Conditional cards are requirements to expand, never umbrella UUIDs. Captured hydrocarbon/water/sludge, waste treatment and environmental releases are distinct fates. Missing quantity, species, property or identity is incomplete, not zero."
      source_ids:
        - ghg-product-2011
