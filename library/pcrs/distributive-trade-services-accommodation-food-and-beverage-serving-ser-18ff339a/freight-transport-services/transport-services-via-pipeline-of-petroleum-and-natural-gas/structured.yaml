      raw_fields: "requirement_id=pipeline_station_assets; process_id=support_lifecycle; required_direction=inputs; required_flow_type=product; original_collection_protocol=cp_assets; applicability_evidence; occurrence_event_id; concrete_row_id; physical_identity; formulation_or_species; phase; carbon_origin; particle_fraction; source_compartment; receiving_compartment; supply_or_handover_gate; provider_covered_cells; asset_component_event_and_lifecycle_phase; native_property; native_unit; measured_native_quantity; source_record_id; allocation_all_users; normalization_denominator; per_identity_amount_calculation; verification_evidence; unresolved_reason; occurrence_to_row_reconciliation; asset_or_reusable_id; model_configuration; included_initial_components; lifecycle_phase; manufacture_native_quantity; target_duty; all_user_same_cohort_lifetime_duty; replacement_event; provider_coverage_cells; applicability_decision_record; covered_concrete_rows; excluded_occurrence_reason; completion_evidence; observed_quantity_state; conversion_or_allocation_evidence; supply_or_service_gate; accepted_service_demand; provider_functional_unit; provider_intensity_basis; covered_lifecycle_stages"
      collection_method: "Each actual pipeline/network/station assembly and uncovered construction, maintenance, replacement or retirement event; native manufacture is not whole-life operation. All-user life denominators and coverage cells are mandatory. Treat this scope as a mandatory identification requirement, not an exchange. Use the original node protocol and its records; separate every actual identity, gate and independent function before quantification, then apply the retained amount/basis/evidence instructions to each compatible concrete row separately. Never use an aggregate amount across heterogeneous identities or infer the native property/unit from a group label. A conclusion that no occurrence took place must be supported by evidence; unknown applicability or identity blocks completion. For the physical asset or reusable item specified here, verify its supply gate, included initial parts, actual replacements, maintenance, cleaning, failure and retirement records. A lease or inclusive supplier contract requires an explicit coverage decision: where a delivered service is within this scope measure its accepted native demand and trace only uncovered asset stages. For a directly modelled asset, use same-cohort target duty over supported positive lifetime duty of all users; do not charge the whole facility to one service. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Physical asset or reusable article in its verified manufacture/supply unit; compatible duty for the same cohort; delivered service in its native functional unit where in scope"
      frequency: "Every actual occurrence and each evidenced absence decision"
      temporal_coverage: "Full declared cohort and attributable asset life/linked events"
      site_scope: "Actual responsible sites/providers of this process only"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "For an asset use the quantity at its documented supply gate times target duty / positive all-user lifetime duty for that cohort. Record configuration, commissioning, replacement and retired or remaining life. If the scope includes a delivered service, use its verified native intensity times matching delivered demand and retain the coverage record; charge uncovered phases separately. For a matching asset quantity or independently verified service result at the stated gate, apply the following quantity rule only at its specified attribution and normalization state: Actual all-user life-attributable asset/event quantity / T Preserve original records, applied factors and resulting units. Value mode: calculated_value; Specificity: site_specific; Normalization basis: per declared reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_assets; Sources: unsd-cpc3-65131; ghg-product-2011. Require original records, exact native support and per-concrete-row verification; these instructions do not supply a missing identity or numerical value. Completion gate: check_occurrence_completion."
    - protocol_id: cp_expand_support_provider
      process_id: "support_lifecycle"
      flow_role: "Mandatory identity expansion support_provider (inputs/product): Actual native support, maintenance or treatment service"
      record_type: "collected_record"
      raw_fields: "requirement_id=support_provider; process_id=support_lifecycle; required_direction=inputs; required_flow_type=product; original_collection_protocol=cp_assets; applicability_evidence; occurrence_event_id; concrete_row_id; physical_identity; formulation_or_species; phase; carbon_origin; particle_fraction; source_compartment; receiving_compartment; supply_or_handover_gate; provider_covered_cells; asset_component_event_and_lifecycle_phase; native_property; native_unit; measured_native_quantity; source_record_id; allocation_all_users; normalization_denominator; per_identity_amount_calculation; verification_evidence; unresolved_reason; occurrence_to_row_reconciliation; provider_contract; independent_function; provider_gates; native_functional_unit; delivered_quantity; covered_process_phase_cells; uncovered_foreground_rows; applicability_decision_record; covered_concrete_rows; excluded_occurrence_reason; completion_evidence; observed_quantity_state; conversion_or_allocation_evidence; provider_functional_unit; accepted_service_demand; provider_intensity_basis; covered_service_stages"
      collection_method: "Conditional actual support/inspection/repair/cleaning/waste treatment/access/site supply service with native quantity, scope and exact replaced cells; no duplicate own inputs or imposed reference conversion. Treat this scope as a mandatory identification requirement, not an exchange. Use the original node protocol and its records; separate every actual identity, gate and independent function before quantification, then apply the retained amount/basis/evidence instructions to each compatible concrete row separately. Never use an aggregate amount across heterogeneous identities or infer the native property/unit from a group label. A conclusion that no occurrence took place must be supported by evidence; unknown applicability or identity blocks completion. Apply these recording instructions only to the stated inputs/product identity and gate (Actual native support, maintenance or treatment service). Activate only for an actually contracted independent function within this PCR scope. Record provider contract, delivered service function, gates, native functional unit, measured delivered quantity and exact covered processes/life stages. Compare each covered cell with owned activities; use complete-provider coverage or the uncovered foreground activity once. Do not substitute monetary spend, a material mass or an assumed item count for the actual function. A provider of the PCR final product cannot recursively duplicate the same final service. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Verified native functional unit of the contracted delivery; Item(s) only for independently countable accepted results"
      frequency: "Every actual occurrence and each evidenced absence decision"
      temporal_coverage: "Full declared cohort and attributable asset life/linked events"
      site_scope: "Actual responsible sites/providers of this process only"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "Use the measured accepted quantity at the specified gate. Multiply supplier intensity by demand in that same native unit only when converting an intensity to a total. Record the contract scope, acceptance, native unit and covered stages. Use time only for a delivered time-based function. For an accepted service on the basis specified by its contract, apply the following quantity rule only at its specified attribution and normalization state: Actual uncovered native provider quantity / T Preserve original records, applied factors and resulting units. Value mode: calculated_value; Specificity: site_specific; Normalization basis: per declared reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_assets; Sources: unsd-cpc3-65131; ghg-product-2011. Require original records, exact native support and per-concrete-row verification; these instructions do not supply a missing identity or numerical value. Completion gate: check_occurrence_completion."
  calculation_rules:
    - id: delivered_work
      applies_to: "qualified_pipeline_work"
      rule: "T = sum_p (m_delivered_accepted,p in t × L_supported_path,p in km), summing each actual accepted delivered path portion once over the declared period. Meter/topology/validated flow routing reconciles all portions and linepack carryover; no receipt/stock/loss capacity output. Final reference output is 1 tkm; T > 0 is required for finite intensity."
      inputs:
        - "delivered accepted mass"
        - "supported physical path distance"
      output: "T; qualified_pipeline_work"
      source_ids:
        - unsd-cpc3-65131
        - ghg-product-2011
    - id: exclusive_custody_ledger
      applies_to: "pipeline custody and linepack"
      rule: "On one conserved mass/component basis and common actual gates/time: opening_stock + external_receipts = closing_stock + qualified_deliveries + rejected_or_returned_outward + own_use_fuel_withdrawal + flare_feed_withdrawal + intentional_vent_mass + fugitive_environmental_loss + other_recovered_outward + other_distinct_treatment_outward + documented_unresolved_residual. Terms are mutually exclusive boundary/destination entries. Own-use and flare withdrawals terminate custody ledger before their separate combustion/flare ledger; their exhaust is not a second custody loss. Internal recovery/recompression/recirculation is neither new receipt nor additional outward: recovered material is counted only in actual closing stock, actual later use or one actual outward destination. Liquid spill mass is partitioned into actual recovered destinations and unrecovered environment/volatilization once. Record actual water/impurity separations and mass-basis conversions; no unexplained residual forced into methane or zero."
      inputs:
        - "opening/closing"
        - "actual receipts"
        - "mutually exclusive actual destinations"
        - uncertainty
      output: "custody reconciliation and residual"
      source_ids:
        - ghg-product-2011
        - ipcc-2019-fugitives
    - id: fuel_carbon_species
      applies_to: "actual fuels, venting and direct release"
      rule: "Use each event actual state/composition to convert gas volume to mass/species; separate custody loss, own-use fuel supply, fuel combustion, unburned slip, flare feed/products and inherent CO2. Reconcile carbon among actual oxidized CO2, emitted CH4/other carbon species, recovered/exported carbon and retained material. Flare-feed mass is not entirely methane emission or entirely destroyed; actual performance and fates required. Sum only disjoint measured/source-specific emissions per actual substance/medium, no universal factor."
      inputs:
        - "actual state/composition"
        - "fuel/carbon"
        - "measured release/performance"
      output: "disjoint species release"
      source_ids:
        - epa-engine-exhaust
        - epa-pipeline-blowdowns
        - ipcc-2019-fugitives
    - id: life_and_normalization
      applies_to: "all real inventory rows"
      rule: "For an actual event j, allocate q_j × s_j to this service using supported all-user causal shares; asset share uses same-cohort attributable duty / supported positive total all-user useful duty for that life phase. Period attributable quantity includes causal failed/standby/changeover/maintenance and uncovered life/provider cells. q_row,ref = q_row,attributable / T, once. Apply exact native provider/function/unit coverage and tkm/native t*km notation equivalence without forced count or capacity conversion."
      inputs:
        - "actual native event quantity"
        - "causal all-user share"
        - T
      output: "per-reference native exchange"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: state_path_quality
      applies_to: "reference and custody"
      requirement: "Require actual gate/time-aligned calibrated meters, acceptance and supported path/network routing; each state/volume/density/composition conversion includes basis, provenance and uncertainty. Validate linepack across periods and network mass closure; unsupported path or quantity remains incomplete, not an assumed national average."
      evidence: "Meter calibration, composition/state logs; topology/model validation; custody ledger"
    - id: source_fate_quality
      applies_to: "fuel/direct/waste"
      requirement: "Require source-specific actual material/species/phase/medium and measured or justified engineering quantity; leak/vent/flare/engine slip/captured waste and each provider scope remain disjoint. Public equipment descriptions are questions for actual route, not default factors or universal operating specifications."
      evidence: "Measurement/estimate method, performance/receiver logs, native providers and uncertainty"
    - id: full_life_scope_quality
      applies_to: "all nodes"
      requirement: "Require full actual period/run and asset life/all-user denominators, included/uncovered cells, scenario/geography/year fit and transparent missing evidence. Scientific review and every final concrete identity/quantity remain pending until independently verified; a checker pass alone does not establish identity or publication readiness."
      evidence: "Asset/event register, all-user duties, coverage matrix, unresolved evidence"
validation_rules:
  - rule_id: validate_scope_reference
    applies_to: "all nodes"
    rule: "Verify full official petroleum/gas pipeline scope and exact exclusions; actual transport responsibility/gates and delivered mass×supported path function. Require all five functional fields, actual tkm/native t*km equivalence, actual phase/composition/pressure/temperature and routing evidence; no commodity/pipe manufacture, input throughput or linepack output proxy."
    source_ids:
      - unsd-cpc3-65131
      - ghg-product-2011
  - rule_id: validate_ledger_fates
    applies_to: "pipeline_movement; station_operations"
    rule: "Verify common mass/component/time/gate basis and disjoint opening/closing, receipt, delivered/rejected/returned, own-use/flare withdrawals, actual vent/leak and recovered/treatment outward terms. Internal recovery is not extra receipt/output; fuel/flare exhaust not double custody loss. Require actual separate recovered/retained/environmental spill portions, carbon/species reconciliation and explicit uncertainty/residual, no residual-equals-methane assumption."
    source_ids:
      - ghg-product-2011
      - ipcc-2019-fugitives
  - rule_id: validate_actual_energy_life
    applies_to: "all nodes"
    rule: "Verify actual pump/compressor/control/treatment and continuous/campaign/changeover/standby/failed duties, conditional branches and each concrete exchange/protocol. Own-use fuel upstream included once and conveyed commodity production separate; provider exact covered cells replace once. Full native assets each life phase and supported all-user useful duties required, no manufacture-equals-life or forced unit/function conversion."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_quantities_identity
    applies_to: "all nodes"
    rule: "Require positive T for finite intensity, causal shares closed across all users and no double normalization; zero-delivery burdens retained. Each final concrete flow identity/property/unit/gate/state and elementary medium is verified with evidence, unresolved real output rows registered and conditional requirements expanded to actual flows; missing is incomplete, not zero. EN/ZH and structured projection carry every normative rule/protocol/calculation."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_pipeline_movement
    applies_to: "pipeline_movement"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_station_operations
    applies_to: "station_operations"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_support_lifecycle
    applies_to: "support_lifecycle"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
