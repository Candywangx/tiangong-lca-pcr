allocation_rules:
  - rule_id: causal_all_user
    applies_to: "all nodes"
    rule: "Subdivide and meter actual path/station/product/batch/duty first. Shared pumping/compression/control/maintenance/network burdens follow evidenced causal hydraulic/resistance/pressure/flow/energy/time/capacity relationships across all products/users; reference tonne-km does not force a uniform tonne-km allocation for gas/liquid or different pressure services. Retain quality, reserve and standby constraints. Economic fallback requires no supported physical relationship plus sensitivity; shares for same event sum to one."
    source_ids:
      - ghg-product-2011
  - rule_id: delivered_denominator
    applies_to: "all nodes"
    rule: "Retain causal preparation, circulation, linepack management, standby, maintenance/pigging, failed/off-spec/rejected/spill/return and recovery burdens before dividing once by positive qualified delivered pipeline work T. Only actually accepted delivery with supported receipt/path lineage contributes output, not linepack retained or lost/own-used/flared mass. A genuine separately contracted qualified return movement is identified once by its own physical path and acceptance, not duplicated as initial delivery. T=0 has no finite intensity."
    source_ids:
      - ghg-product-2011
  - rule_id: life_stock_period
    applies_to: "all nodes"
    rule: "For each full native asset/life event allocate same-cohort attributable duty over supported positive all-user total useful duty, then normalize by T. Keep installation, commissioning, maintenance, replacement and retirement distinct from initial manufacture. Shared periods/products/providers, opening/closing custody stock and future delivery cohorts retain causal carryover consistently; do not charge all historic construction to one period or omit all pre-existing asset life."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_and_recovery
    applies_to: "all nodes"
    rule: "Provider transport/operation/maintenance/treatment/infrastructure must retain actual native function/unit/gate and covered phases; substitute exact covered own cells once, including embedded energy/direct emissions/lifetime scopes. Retain uncovered phases explicitly. Recompression/internal recovery is not a new external inflow, and captured outward material is not air emission. Actual external useful heat/electricity/material co-output needs explicit subdivision or justified allocation and receiver; no automatic recovery/recycling/flare credit."
    source_ids:
      - ghg-product-2011
