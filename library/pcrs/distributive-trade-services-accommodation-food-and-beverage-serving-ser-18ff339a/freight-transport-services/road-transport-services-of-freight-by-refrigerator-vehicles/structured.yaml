system_boundary:
  rules:
    - rule_id: full_road_refrigeration
      applies_to: "all nodes"
      rule: "Include frozen and refrigerated goods in specially refrigerated road trucks and cars; no diesel-only, food-only, single-temperature or one-size restriction. Distinguish intermodal-container service 65113, tanker 65112, rail 65121, warehousing and courier retail delivery by actual contract/function; do not classify solely because goods are cold."
      source_ids:
        - unsd-cpc3-65111
    - rule_id: full_duties
      applies_to: "all nodes"
      rule: "Include attributed loading, acceptance inspection, pre-cooling, loaded running, multi-stop doors-open, waiting, defrost, empty return, positioning, failed/rejected/rescue and wash duties; physically shared propulsion/refrigeration inputs have one owner across nodes. No positive completed N means no finite per-completion result."
      source_ids:
        - ghg-product-2011
    - rule_id: cold_state
      applies_to: "all nodes"
      rule: "The preservation intervention starts at actual cargo acceptance temperature/state and ends at documented delivery temperature, elapsed time, excursions and acceptance decision. Parent activity is road freight; mechanical diesel, engine-driven/electric compression, eutectic/ice and cryogenic alternatives retain actual topology, energy/cryogen supply, venting, leaks, recovery and asset obligations. Coexistence is allowed only when evidenced; alternative supplies are not all assumed present. ATP is applicable only to its actual legal/cargo scope; it supplies no universal temperature setpoint here."
      source_ids:
        - unece-atp-current
    - rule_id: cargo_boundary
      applies_to: "all nodes"
      rule: "Cargo is the object carried, not consumed transport input and not the freight-service output. Maintain custody mass/count/condition balances at every handover and receiver. Do not add original cargo production to the service; separately disclose production/replacement implications of actual loss for downstream cargo LCA. Transfer packaging/container ownership and reuse duties require explicit coverage."
      source_ids:
        - ghg-product-2011
    - rule_id: asset_provider
      applies_to: "all nodes"
      rule: "PCR lifecycle choice includes actual vehicle/body/refrigerator/charging/battery/tyre/road/depot/terminal manufacture, installation, maintenance, replacement and retirement. Each native supplier result replaces only its documented covered cells; complete assembly and included initial components cannot both be counted. Useful life is an allocation denominator, not proof that operation or end-of-life is included."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic_expansion
      applies_to: "all nodes"
      rule: "For every actual unrepresented material, supply, asset, provider result, direct pollutant, waste or fate, add a separate row_id under one real node with one actual identity/state/type/direction, native property/unit/quantity, source and same-node protocol. Species, carbon origin, PM size, air/water/soil/collected fate and receiver remain distinct. Broad residual labels are expansion obligations and cannot become final unverified exchanges. Missing evidence is incomplete, never zero."
      source_ids:
        - ghg-product-2011
