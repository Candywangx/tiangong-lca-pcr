allocation_rules:
  - rule_id: allocation_precedence
    applies_to: "all nodes"
    rule: "Avoid allocation by direct metering and process/compartment subdivision first. For unavoidable joint legs, allocate actual shared propulsion/site burdens using documented causal physical load, distance and capacity constraint evidence across all consignments/users; mass-distance is allowed only when it represents actual service causation, not a universal default. Sum shares to one over the same event. Cooling is separately attributed using actual thermal/compartment-time evidence; price allocation requires inability to establish physical causation and a sensitivity disclosure."
    source_ids:
      - ghg-product-2011
  - rule_id: failed_stock_period
    applies_to: "all nodes"
    rule: "Retain attributed failed/empty/returned duties in causal service pool before dividing once by positive eligible completed N. Count returned or redelivered consignment only at the declared accepted completion, maintaining original/return leg IDs. Preserve stocks, fuel/charge/refrigerant/cargo transfers and year-end unfinished duties across periods; do not move burdens or completion counts to a convenient year."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_lifetime
    applies_to: "all nodes"
    rule: "Allocate native asset manufacture and each distinct lifecycle event by actual same-cohort duty consumed divided by positive supported same-cohort total all-user useful duty, then by N. Record installation, refurbishment, replacement and retirement dates and all users/periods; no universal truck kilometres, road life, refrigeration leakage or empty-running percentage. Shared depot/charger/road consumers are indexed once."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_no_recursion
    applies_to: "all nodes"
    rule: "A subcontracted eligible freight leg is a provider input with actual native service unit and explicit gates, replacing matching own-operated stage cells. Do not recursively consume the same finished reference output or duplicate supplier energy/emissions/assets; cargo ownership does not determine physical burden ownership."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_movement
      process_id: "road_movement"
      flow_role: "Freight output, propulsion, direct exhaust and full duty"
      record_type: "Trip manifests, meters and dispatch records"
      raw_fields: "consignment_id; cargo_identity; mass; volume; OD; leg_distance; loaded_empty_failed_km; fuel_opening_receipts_closing_transfers; actual_burn; AC_meter; completed_N; period; quality_acceptance; allocation_share; native_unit; provider_gate; uncertainty"
      collection_method: "Link telematics, calibrated meters, fuel and signed delivery to one route/cohort; preserve all joint users and empty/failed duties; partition engine-driven refrigeration once against master pool, then calculate attributable numerator and divide once by completed N. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator. Keep non-reference rows of this protocol in their own physical units."
      unit: "Item(s); kg; MJ; km; h"
      frequency: "Each event; reconcile each period"
      temporal_coverage: "Declared reporting period and linked lifecycle years"
      site_scope: "Actual vehicles, compartments, sites and suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibrations; signed records; reconciled allocations; coverage and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_cold
      process_id: "cold_control"
      flow_role: "Cold preservation, energy, refrigerant and leakage"
      record_type: "Temperature logger, cooling meter and refrigerant service ledger"
      raw_fields: "equipment_id; compartment; acceptance_temperature; setpoint; actual_temperature_trace; door_events; hours; ambient; defrost; cooling_fuel_AC; charge_opening_makeup_recovery_closing; leak_species_medium; rejected_lot_receiver; allocation_share; period; N; native_unit; uncertainty"
      collection_method: "Calibrate logger and meter, reconcile same-equipment charge/stock/recovery, separate all actual coolant/cryogen species and fates, allocate actual cooling by thermal/compartment-time causation and divide each native quantity once by N. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "kg; MJ; h; temperature unit"
      frequency: "Each event; reconcile each period"
      temporal_coverage: "Declared reporting period and linked lifecycle years"
      site_scope: "Actual vehicles, compartments, sites and suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibrations; signed records; reconciled allocations; coverage and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_support
      process_id: "support_lifecycle"
      flow_role: "Loading, cleaning, custody loss and collected waste"
      record_type: "Supplier tickets, utility meter, custody and waste handover records"
      raw_fields: "site; event_id; provider_id; included_cells; water; handling_native_activity; cargo_in_out_stock_loss_return; waste_identity_receiver_mass; fate; period; N; allocation_share; uncertainty"
      collection_method: "Reconcile gate and custody ledger with signed handovers; keep loss, return, evaporation, collected wastewater and direct releases distinct; identify provider-covered cells and aggregate attributable native quantities before one N division. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "kg; native supplier unit"
      frequency: "Each event; reconcile each period"
      temporal_coverage: "Declared reporting period and linked lifecycle years"
      site_scope: "Actual vehicles, compartments, sites and suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibrations; signed records; reconciled allocations; coverage and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_assets
      process_id: "support_lifecycle"
      flow_role: "Vehicle, refrigeration and shared infrastructure lifecycle"
      record_type: "Asset bill of materials, supplier lifecycle scope and maintenance register"
      raw_fields: "asset_cohort; configuration; initial_components_included; native_delivered_quantity; manufacture_install_maintenance_replacement_retirement_dates; all_user_useful_duty; attributed_duty; providers_sites_periods; native_unit; N; uncertainty"
      collection_method: "Verify assembly versus component scope, each lifecycle event and all-user cohort denominator; multiply native quantity by actual attributable duty / positive total same-cohort useful duty then divide once by N, replacing provider-covered cells only. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition."
      unit: "Item(s); kg; native duty and service units"
      frequency: "Each event; reconcile each period"
      temporal_coverage: "Declared reporting period and linked lifecycle years"
