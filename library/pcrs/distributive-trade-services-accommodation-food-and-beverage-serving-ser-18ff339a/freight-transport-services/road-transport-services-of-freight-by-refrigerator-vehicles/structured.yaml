  calculation_rules:
    - id: normalize_service
      applies_to: "all inventory rows except reference output"
      rule: "x_ref = sum(x_native_attributed) / N; N is actual eligible completed consignment legs, positive and same cohort/period; reference output is 1 Item(s)."
      inputs:
        - x_native_attributed
        - N
        - cp_movement
        - cp_cold
        - cp_support
        - cp_assets
      output: "x_ref"
      source_ids:
        - ghg-product-2011
    - id: cargo_transport_activity
      applies_to: "reported supplementary tonne-distance"
      rule: "T = sum(m_i_t * d_i_km) over actual loaded segments with actual transported mass; empty distance and cooling hours are recorded separately and retain burdens. T is not a replacement for completed N."
      inputs:
        - m_i_t
        - d_i_km
        - cp_movement
      output: "T"
      source_ids:
        - ghg-product-2011
    - id: stock_reconciliation
      applies_to: "fuel, coolant and cargo by actual ledger"
      rule: "opening + receipts + inward_transfers = closing + useful_use_or_delivery + outward_transfers + measured_loss; terms are mutually exclusive boundary-ledger destinations. Internal recovered material is retained in closing stock or subsequently recorded once at its actual use/outward gate, never an additional recovery term. Split every term by actual material/equipment/period and do not infer loss from one missing term."
      inputs:
        - "actual stocks"
        - receipts
        - transfers
        - use
        - recovery
        - loss
        - cp_movement
        - cp_cold
        - cp_support
      output: "closed native ledger"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: traceability
      applies_to: "all nodes"
      requirement: "Retain raw record, calibration, native unit, gate, actual state, period/site, allocation decision and uncertainty for each exchange; supplier model comparability is explicit."
      evidence: "Signed records and meter/service logs"
    - id: temperature_quality
      applies_to: "cold_control and reference output"
      requirement: "Actual cargo-specific temperature/time and acceptance requirements, sensor position and excursions are mandatory; no default setpoint, shelf life or zero spoilage."
      evidence: "Contracts; logger records; acceptance and disposition"
    - id: missing_range
      applies_to: "quantities and factors"
      requirement: "No universal numerical fuel intensity, load factor, empty return, refrigeration leakage, asset lifetime or emission factor is supplied. Missing actual evidence remains incomplete; empirical guardrails require an independent compatible reference sample and never use this batch maximum to validate itself."
      evidence: "Data completeness register; independent sample provenance"
validation_rules:
  - rule_id: reference_gate
    applies_to: "all nodes"
    rule: "Require actual road refrigerated mode, cargo/quality/temperature/OD/distance/time and accepted completion records; N must be positive. Reject temperature-excursion cargo from qualified output until documented disposition; failed duty is retained. Equal Item(s) with different consignments or distances is not equivalent performance."
    source_ids:
      - ghg-product-2011
  - rule_id: native_fates
    applies_to: "all nodes"
    rule: "Close fuel/stock/burn/spill and refrigerant initial/recharge/recovery/stock/release ledgers by equipment and period; require species and destination before direct emissions. Match property/unit/gate and receiving medium; no charge=leak, supplied=burned, waste=direct emission or AC=DC substitution."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage_allocation
    applies_to: "all nodes"
    rule: "Validate every actual mode/duty and shared node/provider/asset/terminal cell, all-user share closure, positive compatible lifetime and normalization once. Unknown actual technology, receiver, quantity, supplier lifecycle coverage or life is incomplete. Enumerate every contributing site and period, include its eligible output and burden before pooled normalization; never average site intensities without justified weighting."
    source_ids:
      - ghg-product-2011
  - rule_id: exchange_expansion
    applies_to: "all nodes"
    rule: "Require one verified concrete UUID and compatible native support for each final implemented exchange; unresolved semantic cards and count support alone are not final service identities. Compare EN/ZH ordered IDs, formulas, qualifiers, protocols, source references and canonical projection; record all skipped/inconclusive checks."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_road_movement
    applies_to: "road_movement"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_cold_control
    applies_to: "cold_control"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
