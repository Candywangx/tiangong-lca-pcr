    - protocol_id: cp_acceptance_cohort
      process_id: "operated_passenger_vessel_hire"
      flow_role: "reference-obligation compatibility and cross-period cohort"
      record_type: "original agreement acceptance and event ledger"
      raw_fields: "obligation_id;original_amendments;function;configuration;capacity_native_unit;accepted_H;quality;technical_commercial_roles;region_duty;delivery_redelivery_gates;compatibility_decision;opening_ongoing;new_obligations;completed_accepted;failed_cancelled;closing_ongoing;event_id;contributing_node;period;pool_owner;provider_cells;quantity_method;range_evidence"
      collection_method: "Reconcile each original obligation against contract, acceptance and full-cycle events. Retain cut-off states and contributing nodes; apply reference_compatibility and completed_obligation_cohort. Ongoing burdens stay with their own obligation; failure attribution requires causal evidence. Complete actual children with occurrence or evidenced absence; row guardrails require independent compatible evidence."
      unit: "Item(s); actual time and capacity units; actual native units"
      frequency: "Each actual obligation and reporting cut"
      temporal_coverage: "Full obligation cycle and traceable reporting periods"
      site_scope: "This node reference obligations and explicitly linked contributors"
      aggregation_rule: "per declared reference flow; compatible completed-obligation cohort"
      quality_evidence: "Original agreement and chronological amendments, acceptance, calibrated meters and event ownership, independent sample and conversion evidence"
  calculation_rules:
    - id: normalize_hire
      applies_to: "all inventory rows"
      rule: "I_x = A_x / N. A_x is actual native quantity attributed to coherent accepted hire engagements after direct/causal all-user assignment;N is the actual count of independently accepted operated hire obligations with positive accepted availability time and original/genuine amended configuration/capacity/gates. N=0 retains burden without finite intensity. Apply reference_compatibility and completed_obligation_cohort before selecting the numerator and N."
      inputs:
        - A_x
        - N
      output: "native inventory per accepted hire engagement"
      source_ids: []
    - id: provider_native
      applies_to: "actual provider children"
      rule: "A_x = q_u * D_u * s. q_u is compatible provider inventory per native unit u; D_u is actual same-unit provider demand for the documented serving pool before studied-share attribution; s is the evidenced studied share of that pool. For directly dedicated demand use s = 1 and do not apply another shared fraction. Replace exact covered cells before dividing by N once. No assumption that native hour,vessel-day,Count,passenger-km or money equals this engagement."
      inputs:
        - q_u
        - D_u
        - s
        - N
      output: "attributed native provider burden"
      source_ids: []
    - id: asset_lifetime
      applies_to: "actual asset children"
      rule: "A_asset = Q_asset * U_studied / U_life;I_asset = A_asset / N. Q_asset is actual native supplied asset quantity;U_studied and positive documented U_life use compatible duty for the same asset and all real users/functions/sites/periods. Availability/capacity-time is declared from actual hire function,not default passenger throughput. Lifecycle phases exclusive;forecast provenance/sensitivity retained. A share of 1 is allowed only when evidence shows that the target hire/cohort accounts for the entire compatible all-user demand of that same asset/event over its relevant life. Reconcile shares across all real users to 1; never default to a whole-asset charge."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - N
      output: "native asset quantity per engagement"
      source_ids: []
    - id: native_stock_fate
      applies_to: "native material and energy ledgers"
      rule: "Opening + supplied + transfers_in = closing + consumed_or_transformed + transferred_out + recovered_external + evidenced_release + unresolved_residual. Use actual compatible native units and exclusive terms. Internal retained recovery belongs to closing,not extra output. Initial/opening/customer-owned consumed fuel-energy has upstream source/charging once regardless payer/title,not duplicate purchase/withdrawal. Transformation products use actual supported species relations;the same original withdrawal and its downstream exhaust are not two original-stock fates. Unknown residual is investigated,not automatic waste/leak."
      inputs:
        - Opening
        - supplied
        - transfers_in
        - closing
        - consumed_or_transformed
        - transferred_out
        - recovered_external
        - evidenced_release
        - unresolved_residual
      output: "reconciled native stock and fate"
      source_ids: []
    - id: availability_events
      applies_to: "hire acceptance and event attribution"
      rule: "Retain actual accepted availability H for each original obligation and genuine chronological amendment;H is positive for an accepted engagement. Record unavailable,failed,standby,positioning,recovery and replacement events separately with one owner/pool. Contract billing/off-hire hours do not replace physical availability evidence. Actual standby can be accepted without movement or occupancy;no universal availability fraction or cancellation threshold."
      inputs:
        - H
        - actual_contract_events
        - actual_acceptance_records
      output: "documented accepted hire and duty attribution"
      source_ids: []
    - id: reference_compatibility
      applies_to: "all actual rows and obligations"
      rule: "Before pooling or comparing per-engagement results, record a compatibility decision for every original obligation. Require the same supplied function, compatible actual configuration and hired capacity or capability with native units, equal accepted availability H for the declared per-engagement reference, equivalent acceptance quality, operating versus commercial responsibilities, delivery/redelivery gates, region and duty. Unit conversions require verified support; tolerance may cover evidenced measurement uncertainty only, not different service functions or durations. Different H, incompatible capacity, control, duty or gates remain separate strata unless a documented physical conversion to one explicitly declared common reference is supported for every affected quantity. Count, price, nominal fleet capacity and a shared CPC code never establish equivalence. Missing facts block pooling; one item remains one real original accepted obligation."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: completed_obligation_cohort
      applies_to: "reference output and linked contributing nodes"
      rule: "Use a declared completed-obligation cohort for this engagement reference. At each reporting cut retain opening ongoing obligations, new obligations, completed accepted obligations, terminal failed/cancelled obligations and closing ongoing obligations with original ids and chronological amendments. Each physical event belongs to its actual obligation and node or one evidenced shared pool. Gather the complete causal service cycle for every obligation entering N, including events before the reporting window; do not divide all calendar-period purchases or ongoing-contract activity by the count completed in that period. Keep ongoing activity with its own obligation for later reconciliation; it is not zero or an accepted fractional item. Failed/cancelled burdens remain separately traceable and enter an accepted cohort only through documented causal pool attribution, never an arbitrary shift to another product or period. Reconcile period and full-obligation ledgers without duplicated events. At N=0 retain burdens and report no finite per-item intensity. A period-based service output requires its own explicit compatible reference and review, not a silent reinterpretation of this Count."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: foreground_expansion_reconciliation
      applies_to: "all actual rows and obligations"
      rule: "For each mandatory expansion protocol keep an applicability register owned by its declared node: occurred, evidenced absent or unresolved. An occurred branch has an exhaustive concrete-child list; each child records unique row id, direction/type, actual identity/state/gate, native property/unit/quantity and method, source/receiver/fate, physical transfer id and protocol, exact provider-covered phase/event/site/period cells and asset all-user lifetime attribution where applicable. An absence decision needs dated source records and a bounded node/period/scope; missing evidence is unresolved. Reconcile actual unallocated material, water, carbon and energy ledgers at compatible stock/transform/receiver gates before burden attribution; allocated quantities are not a substitute for physical balance. Internal transfers have paired native amounts and one custody/event owner, not new external supplies or releases. Do not bind protocol labels or fabricate mixture constituents. Any unresolved actual occurrence, identity, quantity, fate or coverage blocks completion of the concrete foreground package; a PCR contract check alone does not close the register."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: conditional_range_guardrails
      applies_to: "all actual rows and obligations"
      rule: "The fixed reference output amount is the normalization definition, not an observed yield distribution. For every other actual inventory row collect an independent compatible reference sample or physical/method constraint before applying a numerical QA guardrail. Record row/node, occurrence conditions, configuration, capacity and H stratum, supplier/state/gate, native unit and conversion evidence, sample source and period, method, bounds and uncertainty. Compare like quantities on the same stated basis; a numerator per engagement cannot be compared directly with a per-hour or per-mass bound. Do not use the validation batch own minimum or maximum to validate itself. A missing compatible numerical range is an unresolved evidence need, not zero, an accepted default or proof of abnormality. Do not invent a universal per-hire interval or replace measurements with a provisional estimate. Every required row-level range decision and supporting evidence must be reviewed before promotion; an unresolved range must remain disclosed."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
  data_quality_requirements:
    - id: contract_acceptance
      applies_to: "reference output"
      requirement: "Actual supplied hire versus carriage/bareboat verified from contract/operations,original capacity/configuration/control/gates,positive actual accepted availability and coherent engagement count. Actual changes/failures/replacements preserved;payment not output proof."
      evidence: "cp_hire_acceptance"
    - id: atomic_expansion
      applies_to: "every required expansion"
      requirement: "Every mandatory cp_expand_ has occurrence/absence and exhaustive child register;each actual child has unique native identity/quantity/verified UUID/support/source/receiver/owner/provider/life evidence. Unresolved actual applicability/identity/quantity/fate blocks complete foreground production;requirements not actual exchange rows."
      evidence: "cp_expand_fuels;cp_expand_vessel_assemblies;cp_expand_collected_wastes;cp_expand_substance_releases"
    - id: all_user_life
      applies_to: "actual shared asset and provider children"
      requirement: "All real hires,own carriage,standby/support,concurrent capacity users,sites/periods and positive same-asset compatible lifetime demand evidenced. Initial/replacement/maintenance/retirement and provider-covered cells exclusive;forecasts and causal allocation retain uncertainty/sensitivity."
      evidence: "cp_expand_vessel_assemblies;cp_expand_port_support_assets;cp_expand_contracted_support"
    - id: sites_periods
      applies_to: "all contributors"
      requirement: "Index real vessel/crew/berth/shore/provider units and reporting/lifecycle periods to common hire boundary. Aggregate attributed native raw quantities before coherent N,not mean intensities of unlike hire capacity/duration/region/configuration."
      evidence: "cp_hire_acceptance;cp_native_stock;cp_expand_crew_operations"
    - id: native_fates
      applies_to: "all material and release records"
      requirement: "Original calibrated native source/stock/use/receiver records,carbon origin,actual species/phase/compartment and compatible methods required. Conditional cards need occurrence evidence and exact semantics;unknown fates not zero or default whole release."
      evidence: "cp_native_stock;cp_refrigerant_stock;cp_native_releases;cp_expand_resource_intakes;cp_expand_physical_transfers"
    - id: cohort_and_evidence_gate
      applies_to: "all contributing nodes"
      requirement: "Obligation compatibility, cross-period states, actual children and independent range evidence must be traceable. Unknown facts are not zero; ongoing obligations cannot be mixed into a completed cohort."
      evidence: "cp_acceptance_cohort"
validation_rules:
  - rule_id: hire_reference
    applies_to: "operated_passenger_vessel_hire"
    rule: "Verify full current official self-propelled passenger-vessel with-crew scope and actual operated hire function. Require original configuration/capacity/control/gates, positive actual accepted availability time and coherent accepted engagement count; no mandatory sailing/passenger/distance and no ticket, invoice, shift or replacement double output."
    source_ids: []
  - rule_id: native_boundary
    applies_to: "operated_passenger_vessel_hire"
    rule: "Verify crew, true standby/positioning/port/operating/failure/recovery/replacement and actually owed onboard/shore support. Actual consumed fuel-energy has upstream source/charging once irrespective payer/title/opening stock; native external supply differs from internal generation, and exact provider-covered cells cannot repeat."
    source_ids: []
  - rule_id: atomic_completion
    applies_to: "operated_passenger_vessel_hire"
    rule: "Reject a complete foreground package while any mandatory cp_expand_ occurrence/absence or concrete child identity/native quantity/gate/verified UUID/source/receiver/owner/provider/all-user life record is missing. Reconcile every child and event exactly once to this node and original parent requirement. Requirement labels or unresolved lists are not actual exchanges; no missing-as-zero, mixed species/media or forced generic binding."
    source_ids: []
  - rule_id: life_fate_closure
    applies_to: "operated_passenger_vessel_hire"
    rule: "Verify all actual shared functions/users/sites/periods and positive same-asset useful-life duty, exclusive lifecycle/provider cells, original hire acceptance/failure and native stock/fate ledgers. N=0 retains burden without finite intensity; unknown fate cannot be total leak/waste or automatic credit."
    source_ids: []
  - rule_id: bilingual_projection
    applies_to: "operated_passenger_vessel_hire"
    rule: "Verify bilingual ordered rules/protocols/atomic cards and current deterministic projection. Every final exchange requires concrete verified compatible identity and actual quantity; candidate PCR check pass does not close mandatory foreground expansions or prove scientific, legal, safety or publication readiness."
    source_ids: []
  - rule_id: reference_compatibility_gate
    applies_to: "all contributing nodes"
    rule: "Verify reference_compatibility against the recorded actual function, configuration/capacity, accepted H, quality, responsibility, duty and gates before pooling; retain unsupported combinations as separate strata."
    source_ids: []
  - rule_id: completed_obligation_cohort_gate
    applies_to: "all contributing nodes"
    rule: "Verify completed_obligation_cohort using cut-off status and unique full-cycle event ownership; ongoing duties and unassigned failures cannot be silently divided by completed N, and N=0 has no finite intensity."
    source_ids: []
  - rule_id: foreground_expansion_reconciliation_gate
    applies_to: "all contributing nodes"
    rule: "Verify foreground_expansion_reconciliation for every mandatory node-owned protocol, concrete child and physical ledger before attribution; unresolved applicability, identity, quantity, fate or provider overlap blocks foreground completion."
    source_ids: []
  - rule_id: conditional_range_guardrails_gate
    applies_to: "all contributing nodes"
    rule: "Verify conditional_range_guardrails separately from the fixed reference definition; numeric guardrails require independent compatible evidence, a shared basis and reviewed scope, not a self-validating batch or invented universal bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified operated passenger-vessel hire inventories for downstream process/lifecyclemodel use,not ticketed passenger transport."
  allowed_use: "Actual accepted operated-hire obligations with harmonized configuration/capacity/availability/control/gates/region/duty and complete native upstream/all-user lifecycle after mandatory atomic expansion and identity/data review."
  excluded_use: "Unqualified engagement Count,passenger/ticket/bareboat/operator-only substitution,free customer-paid fuel,positive distance/occupancy as mandatory availability gate,or unresolved expansions treated as zero."
  required_metadata: "actual_self_propelled_passenger_vessel_type_configuration; genuine_operated_hire_not_carriage_or_bareboat; original_hired_capacity_scope_and_positive_accepted_availability_time; actual_operator_master_crew_control_and_commercial_direction; real_delivery_redelivery_availability_quality_and_replacement_gates; actual_service_region_duty_standby_position_failure_recovery; all_native_fuel_energy_whichever_payer_or_owner; complete_all_user_same_asset_vessel_port_support_life; node_specific_atomic_expansions_and_verified_child_identities; provider_phase_event_site_period_coverage_and_gaps; compatibility_decision; completed_obligation_cohort; row_range_evidence_status"
  required_quality_disclosure: "Original/amended hire scope,actual availability/failure/replacement,payer-independent native supply,all-user/provider/life coverage and unresolved atomic-child/data/fate gaps with uncertainty."
  update_trigger: "Changed actual function/configuration/capacity/control/availability/gates/region/duty,provider/native energy,lifetime/allocation or actual material/species/receiver/fate."
