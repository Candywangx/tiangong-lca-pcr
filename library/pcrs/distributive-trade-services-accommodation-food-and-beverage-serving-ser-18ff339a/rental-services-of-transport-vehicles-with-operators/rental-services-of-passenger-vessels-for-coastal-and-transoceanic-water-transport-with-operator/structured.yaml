  covered_products: "This PCR covers rental services of all types of self-propelled passenger vessels for coastal and transoceanic water transport with crew. The supplied function is making the actual operated passenger vessel or genuinely hired portion available under an evidenced rental engagement, with declared capacity, time, configuration and operating responsibilities. It is not restricted to time charter, one passenger-vessel design, fuel or propulsion technology. A crewed pleasure vessel is not excluded merely because of that label when its actual function meets this passenger-vessel operated-hire scope."
  excluded_products: "Exclude vessels without crew, including no-crew vessel rental/leasing and pleasure-boat rental without crew; exclude inland passenger-vessel hire, freight-vessel hire, operator-only labour, bare asset manufacture and passenger carriage sold as transport to the immediate customer. Invoice wording such as charter, crew presence, passenger occupancy or who pays bunkers alone does not decide the function. Determine the actual supplied availability, operational/navigation control, commercial directions, acceptance and counterparties; necessary hired-vessel crew, operating and support duties remain included. Independent downstream ticket/cruise transport or hotel/entertainment services beyond the hire interface remain separate, while actually owed onboard support is retained."
  representative_product: "Accepted operated coastal or transoceanic passenger-vessel hire engagement"
  production_route: "Actual crewed self-propelled passenger-vessel availability with native operated-hire and complete attributable lifecycle."
  market_state: "Accepted operated coastal or transoceanic passenger-vessel hire engagement"
