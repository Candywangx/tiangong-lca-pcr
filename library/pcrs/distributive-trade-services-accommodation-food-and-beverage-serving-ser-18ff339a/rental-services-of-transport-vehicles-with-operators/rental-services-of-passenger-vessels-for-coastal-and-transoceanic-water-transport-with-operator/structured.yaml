      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | operated_passenger_vessel_hire | Directly assign dedicated hire/crew/vessel/support events before residual shared-pool attribution. Enumerate all independently supplied hire and other real user functions with actual handovers; do not count the same hired vessel as both output hire and a second passenger journey in this boundary. Downstream transport may consume the native hire once and must not repeat provider-covered physical burdens. | ghg-product-2011 |\n| availability_pool | operated_passenger_vessel_hire | Use actual compatible available-capacity-time, operating/standby duty, meter/work or another evidenced causal driver for each pool, including all actual concurrent partial-hire and nonhire users. Provided rental availability is the causal function; passenger count/distance, revenue, equal engagement split or nominal capacity are not defaults. Assign owed positioning/failed/replacement duty to its actual serving pool once, even without sailing or occupancy. |  |\n| same_asset_life | operated_passenger_vessel_hire | Attribute native supplied assembly/asset quantity by studied compatible duty divided by positive documented same-asset all-user useful-life duty, then normalize once by coherent accepted hire engagements. All real hire/carriage/support uses/sites/periods participate. Construction/initial, replacement, maintenance and retirement exclusive; forecasts retain provenance/sensitivity. |  |\n| failed_and_recovered | operated_passenger_vessel_hire | Keep failed/off-hire/unavailable/cancelled or interrupted duties at real owner/pool/period without fictitious accepted hire. Actual rescue/replacement/waste/recovered product and direct release have independent native responsibility and quantity once. Financial compensation is not physical replacement or avoided-impact credit; retained internal recovery is closing stock, not extra external recovered output. |  |\n\n"
