allocation_rules:
  - rule_id: direct_first
    applies_to: "operated_passenger_vessel_hire"
    rule: "Directly assign dedicated hire/crew/vessel/support events before residual shared-pool attribution. Enumerate all independently supplied hire and other real user functions with actual handovers; do not count the same hired vessel as both output hire and a second passenger journey in this boundary. Downstream transport may consume the native hire once and must not repeat provider-covered physical burdens."
    source_ids:
      - ghg-product-2011
  - rule_id: availability_pool
    applies_to: "operated_passenger_vessel_hire"
    rule: "Use actual compatible available-capacity-time, operating/standby duty, meter/work or another evidenced causal driver for each pool, including all actual concurrent partial-hire and nonhire users. Provided rental availability is the causal function; passenger count/distance, revenue, equal engagement split or nominal capacity are not defaults. Assign owed positioning/failed/replacement duty to its actual serving pool once, even without sailing or occupancy."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "operated_passenger_vessel_hire"
    rule: "Attribute native supplied assembly/asset quantity by studied compatible duty divided by positive documented same-asset all-user useful-life duty, then normalize once by coherent accepted hire engagements. All real hire/carriage/support uses/sites/periods participate. Construction/initial, replacement, maintenance and retirement exclusive; forecasts retain provenance/sensitivity."
    source_ids: []
  - rule_id: failed_and_recovered
    applies_to: "operated_passenger_vessel_hire"
    rule: "Keep failed/off-hire/unavailable/cancelled or interrupted duties at real owner/pool/period without fictitious accepted hire. Actual rescue/replacement/waste/recovered product and direct release have independent native responsibility and quantity once. Financial compensation is not physical replacement or avoided-impact credit; retained internal recovery is closing stock, not extra external recovered output."
    source_ids: []
