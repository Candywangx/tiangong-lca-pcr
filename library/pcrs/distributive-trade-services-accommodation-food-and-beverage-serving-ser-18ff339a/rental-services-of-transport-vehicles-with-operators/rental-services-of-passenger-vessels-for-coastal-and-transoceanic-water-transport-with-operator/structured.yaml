    used_for: "Actual UK tax-manual bodies illustrate loose charter labels,hire-vs-carriage substance,standby and time-charter crew/bunker payment distinctions only. Not global legal advice,CPC authority,universal hire clauses,or requirement for time charter/positive movement."
