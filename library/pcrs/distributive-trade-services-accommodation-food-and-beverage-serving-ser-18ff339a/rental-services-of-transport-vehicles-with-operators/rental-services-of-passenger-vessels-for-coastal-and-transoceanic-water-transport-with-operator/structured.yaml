      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual operated vessel delivery/availability contract with named crew/control,capacity/time and native supply/provider gates. |\n| starting_condition_role | Foreground collection interface,not zero upstream crew/support/asset/fuel burden. |\n| product_classification_scope | CPC 3.0 66021 |\n| recursive_input_rule | Actual same-function native operated-hire subcontract demand once;replace exact provider-covered cells and complete required gaps,no purchased self-service or duplicate ticket/hire output. |\n| upstream_dataset_requirement | Actual hired function,vessel/configuration/capacity/time/control/gates/region/duty,technology,period and native unit compatible;mandatory lifecycle/atomic expansion gaps remain. |\n| disclosure | actual_self_propelled_passenger_vessel_type_configuration; genuine_operated_hire_not_carriage_or_bareboat; original_hired_capacity_scope_and_positive_accepted_availability_time; actual_operator_master_crew_control_and_commercial_direction; real_delivery_redelivery_availability_quality_and_replacement_gates; actual_service_region_duty_standby_position_failure_recovery; all_native_fuel_energy_whichever_payer_or_owner; complete_all_user_same_asset_vessel_port_support_life; node_specific_atomic_expansions_and_verified_child_identities; provider_phase_event_site_period_coverage_and_gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_operated_scope | operated_passenger_vessel_hire | This PCR covers rental services of all types of self-propelled passenger vessels for coastal and transoceanic water transport with crew. The supplied function is making the actual operated passenger vessel or genuinely hired portion available under an evidenced rental engagement, with declared capacity, time, configuration and operating responsibilities. It is not restricted to time charter, one passenger-vessel design, fuel or propulsion technology. A crewed pleasure vessel is not excluded merely because of that label when its actual function meets this passenger-vessel operated-hire scope. | unsd-operated-passenger-sea-2025 |\n| contract_function | operated_passenger_vessel_hire | Verify the immediate product is actual operated vessel availability, not passenger transport or no-crew possession. Record named operating provider/master/crew employer and actual navigation, maintenance, safety and commercial-direction responsibilities from contract and operations. Neither time-charter terminology nor a particular payment allocation is mandatory. Declare whole/partial hired capacity and every real service gate. | hmrc-hire-contract-context |\n| availability_acceptance | operated_passenger_vessel_hire | Count one real completed independently accepted hire obligation with positive actual accepted availability time, original/genuine amended vessel/configuration/capacity and required quality. Permitted standby does not require positive distance, passengers or occupancy. Replacement, shift, port call, voyage and installment are not extra output unless a genuinely separate independently contracted hire obligation exists. Unavailable/failed periods retain burdens; acceptance changes cannot retrospectively erase failure. |  |\n| operating_duty | operated_passenger_vessel_hire | Include actual crew/navigation/watchkeeping and owed readiness/standby, sailing/manoeuvring, port/anchor/berth, delivery/redelivery positioning, cleaning/handover, breakdown/failed recovery and accepted replacement duty. Include actual hotel, ventilation/HVAC, refrigeration, water, sanitation, waste reception, safety/emergency and shore/tug/pilot support when required to provide the operated vessel. Actual duty, route/weather/time and operator-interface records determine attribution, not only passenger-present sailing. | imo-ship-operation-context |\n| native_supply_payers | operated_passenger_vessel_hire | Trace every actually consumed native fuel/energy source, supply, stock, withdrawal and use once regardless owner/purchaser/title, including initial/opening/customer-owned fuel and battery energy. Include compatible upstream supply/charging and actual operational releases; external electricity/heat/cold differs from onboard generation and internal recovery. Whole provider coverage replaces exact cells, never a duplicate purchaser/withdrawal input. No assumption that every vessel uses diesel or R134a. |  |\n| asset_provider_life | operated_passenger_vessel_hire | Require actual vessel assembly and propulsion/hotel/safety systems, supplied replacement components, port/berth/shore and other real support assets at native construction/initial/replacement/maintenance/retirement gates. Attribute to the studied hire through positive same-asset all-user useful-life availability/capacity-time or another evidenced compatible causal duty, not passenger throughput or full manufacture per engagement. Include all actual hires, own-operated carriage, standby/support users, sites and periods served by that asset. Exact compatible hire/crew/tug/pilot/shore providers replace only covered phases/events/sites/periods; required gaps remain. |  |\n| atomic_expansion_gate | operated_passenger_vessel_hire | Every cp_expand_ protocol is a mandatory collection requirement, not an inventory flow. For this process require exhaustive event-linked occurrence or evidenced absence and concrete child register for every actual material, supplied assembly, service, collected waste stream, substance/particle fraction and receiver. Each child requires unique row, native identity/type/direction/state/function/gate/property/unit/quantity, verified UUID, owner and exact provider/all-user life coverage. A real supplied assembly or genuinely collected mixture may remain one identity; no invented constituents or heterogeneous list binding. Missing applicability, identity, quantity, fate or coverage blocks a complete foreground package and final TIDAS exchanges. |  |\n| physical_fates | operated_passenger_vessel_hire | Record actual ballast/cooling resource intake and treatment/discharge, biofouling/coatings, bilge/oil/sludge, sewage/garbage, refrigerant recovery/leak, maintenance/retired materials and source-specific emissions at actual receiver. Collected waste, internal/retained recovery, external recovered product and direct emissions are distinct; source/compartment/carbon origin must fit native identity. No generic NOx/VOC/PM or water/air mixture UUID, unknown balance is investigated, not default total release or waste. | imo-marine-pollution-context |\n\n"
