/redelivery. Include attributable preparation,position/ferry,accepted standby,ground/APU/flight work,diversion,cleaning,deicing,off-hire failure/recovery,substitute and return. Unavailable/rejected time is not accepted H but causal burdens remain;real failed states link to repair/rework,replacement,return or retirement with concrete material/waste exits. | unsd-crewed-passenger-aircraft-2025;titan-crewed-hire-context |\n| complete_lifecycle | crewed_passenger_aircraft_hire | Include actual native fuel/energy/material supply and consumed initial/customer inventories regardless payer,crew/support/ground/deicing demands,aircraft/engines/rotors/avionics/aux systems and airport/hangar/ground equipment initial manufacture/construction/installation/commissioning,maintenance/parts/replacement/retirement,resources,waste treatment and direct exchanges. Delivery gate is not zero upstream burden. Every unknown branch requires mandatory concrete expansion. |  |\n| roles_and_provider | crewed_passenger_aircraft_hire | Declare actual lessor/operator technical,AOC,captain/safety and maintenance responsibility separately from lessee commercial programme/directions;no inferred lessee technical control or universal ACMI bundle. Compatible actual provider datasets replace only exact documented function/native demand/gate and phase/event/site/period lifecycle cells once;collect gaps without self-purchase or duplicate energy,aircraft,crew or support. | titan-crewed-hire-context;easa-role-context |\n| function_units | crewed_passenger_aircraft_hire | Index actual passenger or passenger-and-freight hire function/cohort,aircraft including helicopters/configuration/hired capacity/roles,region/duty,flight/ground/source/altitude where relevant,and each airport/base/hangar/ground/crew/provider unit and period. Resolve dual-use ambiguity and mutually exclusive states from actual obligation/operation,not payload/invoice/type alone. Retain unlike capacity/time/roles/gates strata unless common-function equivalence is evidenced. | unsd-crewed-passenger-aircraft-2025;titan-crewed-hire-context |\n\n"
