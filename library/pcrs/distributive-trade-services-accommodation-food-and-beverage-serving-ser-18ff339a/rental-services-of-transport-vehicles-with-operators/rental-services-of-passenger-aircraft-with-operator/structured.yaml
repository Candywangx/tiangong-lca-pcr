      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | crewed_passenger_aircraft_hire | Directly attribute actual aircraft/event/crew/airport/provider native records to hire obligations first. Shared Q_j uses q_ej = Q_j * d_ej / sum_all_users(d_uj),with evidenced positive compatible same-function demand. Causal availability/capacity-time or an evidenced compatible alternative must fit the asset/service;no automatic flight/passenger/cargo-throughput or invoice/price capital denominator. |  |\n| all_user_life | crewed_passenger_aircraft_hire | Attribute each actual initial aircraft/engine/rotor/avionics/aux/airport/hangar/ground assembly and every installation/commissioning/maintenance/part/replacement/retirement event over its own actual compatible life and all real users/functions/periods,including other hires,own carriage,concurrent capacity,standby and support. Preserve observed/forecast demand,uncertainty and sensitivity;no universal life or entire asset per hire. |  |\n| outputs_and_rejects | crewed_passenger_aircraft_hire | Enumerate every actual independent intended output/function/cohort and handoff or evidenced absence;direct attribution precedes evidenced native causal sharing. Unknown dual-use/output/attribution/fate blocks completion. Customer passengers,baggage and cargo are not manufactured output. Keep failed/off-hire/rejected activity burdens without accepted H/N;substitute aircraft is not extra hire Count;no automatic waste credit or counterfactual substitution. |  |\n| events_and_periods | crewed_passenger_aircraft_hire | Declare actual original/amended hire,event and fleet reporting periods. Link preparation,position/ferry,diversion,standby,cleaning/deicing,maintenance,failure,recovery,substitute and return once to origin or evidenced shared pool;retain custody transfer ids and exact provider cells. Sum compatible attributed native quantities before coherent N;do not average unlike capacities,durations,roles,regions/duties or gates. |  |\n\n"
