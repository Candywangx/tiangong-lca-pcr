published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified crewed passenger or passenger-and-freight-suitable aircraft hire inventory,including helicopters,for downstream process/lifecyclemodel use."
  allowed_use: "Actual independently accepted passenger or passenger-and-freight-suitable aircraft-with-crew hire with harmonized actual function/cohort,configuration/hired capacity,accepted availability,technical/operator/commercial roles,gates,region/duty and complete native atomic/provider/all-user-life review."
  excluded_use: "Unqualified Count;payload/invoice/type-only dual-use selection;transport,barelease,crew-only or manufacture proxy;jet/brand/fullACMI restriction;positive flight/passenger/cargo/leg gate;motor fuel aviation proxy;known altitude forced unspecified;customer initial energy as free or unknown expansion as zero."
  required_metadata: "Actual engagement id and original/genuine amended hire obligation; actual passenger or passenger-and-freight-suitable aircraft identity including helicopter and configuration; actual hired passenger or passenger-and-freight capacity with native unit; positive actual accepted availability time H; engagement/reporting periods; actual offered function and dual-use cohort decision; technical/operating/AOC/captain safety responsibility; lessee commercial direction and its limits; availability/quality/acceptance and replacement terms; delivery/redelivery gates; actual service region and duty; all-user lifecycle and exact phase/event/site/period provider coverage; compatibility_decision; completed_obligation_cohort; row_range_evidence_status"
  required_quality_disclosure: "Original/amended function/cohort and actual accepted availability/standby;separate technical/AOC/captain/commercial roles;position/diversion/failure/substitute/return;native initial/customer resources/source/altitude/compartment;exact provider/all-user full-life coverage and unresolved identity/data/fate/support uncertainty."
  update_trigger: "Changed actual hire function/cohort,aircraft/configuration/capacity,availability/roles/gates/region/duty,fuel/formulation/energy/source/altitude/receiver,provider/lifecycle/allocation or actual ground/deicing/resources/waste/non-mass physical exchanges."
