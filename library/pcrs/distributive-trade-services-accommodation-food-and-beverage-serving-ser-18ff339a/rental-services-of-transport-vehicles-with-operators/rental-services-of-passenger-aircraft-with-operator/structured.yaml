    - id: life_provider
      applies_to: "actual shared aircraft,airport and service children"
      requirement: "All actual hires,own carriage,concurrent capacity,standby/support and reporting/lifecycle periods enter positive compatible same-asset full-life demand. Initial manufacture/construction/installation/commissioning,maintenance/parts/replacement/retirement and exact provider cells are exclusive;forecasts need uncertainty/sensitivity,no guessed life or automatic cargo/flight denominator."
      evidence: "cp_expand_aircraft_assets;cp_expand_airport_assets;cp_expand_contracted_services"
    - id: sites_periods
      applies_to: "all actual contributing units"
      requirement: "Enumerate actual aircraft/engine/rotor/crew/base/airport/hangar/ground/provider contributors and phase/event/site/period ownership. Link native records to same boundaries and accepted hire cohort,retain unlike roles/configuration/capacity/time/gates/region/duty strata and justified representativeness."
      evidence: "cp_hire_acceptance;cp_native_supply;cp_expand_airport_assets"
    - id: native_sources_fates
      applies_to: "all supplies,resources,wastes,releases and physical exchanges"
      requirement: "Require calibrated actual initial/customer stock,meter/use/transfer/receiver records,real fuel grade/formulation/carbon origin,engine/APU/ground/flight source/altitude/compartment and species/particle basis. Collect deicing/effluent and non-mass source/receiver/frequency/location/period/native support. No missing-as-zero,universal density,crew/resource/emission/recovery factor or whole-stock release."
      evidence: "cp_native_supply;cp_generated_oil;cp_co2_release;cp_expand_fuels;cp_expand_substance_releases;cp_expand_physical_exchanges"
    - id: cohort_and_evidence_gate
      applies_to: "all contributing nodes"
      requirement: "Obligation compatibility, cross-period states, actual children and independent range evidence must be traceable. Unknown facts are not zero; ongoing obligations cannot be mixed into a completed cohort."
      evidence: "cp_acceptance_cohort"
