allocation_rules:
  - rule_id: direct_first
    applies_to: "operated_freight_vessel_hire"
    rule: "Directly assign dedicated hire/crew/vessel/support events before residual shared-pool attribution. Enumerate all independently supplied hire and other real user functions with actual handovers; do not count the same hired vessel as both output hire and a second freight journey in this boundary. Downstream transport may consume the native hire once and must not repeat provider-covered physical burdens."
    source_ids:
      - ghg-product-2011
  - rule_id: availability_pool
    applies_to: "operated_freight_vessel_hire"
    rule: "Use actual compatible availability/capacity-time,operating/standby duty,meter/work or another evidenced causal driver for each pool including all concurrent partial-hire and nonhire users. Cargo throughput,tow work,catch mass,revenue,equal engagement split or nominal capacity are not automatic rental drivers. Assign actual owed positioning,failed/replacement,towing/fishing/support duty to its responsible pool once even without sailing,cargo,tow success or catch."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "operated_freight_vessel_hire"
    rule: "Attribute native supplied assembly/asset quantity by studied compatible duty divided by positive documented same-asset all-user useful-life duty, then normalize once by coherent accepted hire engagements. All real hire/carriage/support uses/sites/periods participate. Construction/initial, replacement, maintenance and retirement exclusive; forecasts retain provenance/sensitivity."
    source_ids: []
  - rule_id: failed_and_recovered
    applies_to: "operated_freight_vessel_hire"
    rule: "Keep failed/off-hire/unavailable/cancelled or interrupted duties at real owner/pool/period without fictitious accepted hire. Actual rescue/replacement/waste/recovered product and direct release have independent native responsibility and quantity once. Financial compensation is not physical replacement or avoided-impact credit; retained internal recovery is closing stock, not extra external recovered output."
    source_ids: []
  - rule_id: tow_fishing_outputs
    applies_to: "operated_freight_vessel_hire"
    rule: "Enumerate actual independent transport/tow service,catch species/state handoff,recovered product,residue and waste or prove absence. Assign dedicated events directly,then justify compatible causal all-user and cross-output attribution with uncertainty. Real downstream transport/towing/fish production keeps its own native reference and consumes hire only once. Cargo tonne-km,tow completion,catch mass,revenue or equal Count is not an automatic rental/manufacture allocation driver;no counterfactual displacement."
    source_ids: []
