      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| hire_reference | operated_freight_vessel_hire | This PCR covers rental services of ALL types of self-propelled freight vessels for coastal and transoceanic water transport WITH CREW, explicitly including tankers, bulk dry cargo vessels, cargo and freight vessels, tugboats and FISHING VESSELS. The immediate supplied function is actual operated vessel availability under a genuine hire obligation, with declared vessel or hired portion, configuration, capacity, time, crew/operator responsibilities and gates. It is not limited to ordinary cargo ships, time charter or one fuel, propulsion, towing or fishing technology. Vessel type alone does not prove the function supplied to the immediate customer. Reference is one independently completed and accepted original operated freight-vessel hire engagement with positive actual accepted availability time H, original or genuinely chronologically amended configuration/capacity/control, region/duty and delivery/redelivery/quality/replacement gates. Count denotes the accepted hire obligation, not a tonne-kilometre, cargo shipment, completed tow, fish catch, voyage, invoice or crew shift. Actual permitted standby may fulfill availability with zero sailing, cargo, towing or catch. Retain H and capacity for coherent comparison and causal attribution; unlike hire durations/configurations/functions are not equivalent merely because each counts as one. An accepted replacement fulfilling the same obligation does not create another reference item. |  |\n| native_boundary | operated_freight_vessel_hire | Verify crew, true standby/positioning/port/operating/failure/recovery/replacement and actually owed onboard/shore support. Actual consumed fuel-energy has upstream source/charging once irrespective payer/title/opening stock; native external supply differs from internal generation, and exact provider-covered cells cannot repeat. |  |\n| atomic_completion | operated_freight_vessel_hire | Reject a complete foreground package while any mandatory cp_expand_ occurrence/absence or concrete child identity/native quantity/gate/verified UUID/source/receiver/owner/provider/all-user life record is missing. Reconcile every child and event exactly once to this node and original parent requirement. Requirement labels or unresolved lists are not actual exchanges; no missing-as-zero, mixed species/media or forced generic binding. |  |\n| life_fate_closure | operated_freight_vessel_hire | Verify all actual shared functions/users/sites/periods and positive same-asset useful-life duty, exclusive lifecycle/provider cells, original hire acceptance/failure and native stock/fate ledgers. N=0 retains burden without finite intensity; unknown fate cannot be total leak/waste or automatic credit. |  |\n| bilingual_projection | operated_freight_vessel_hire | Verify bilingual ordered rules/protocols/atomic cards and current deterministic projection. Every final exchange requires concrete verified compatible identity and actual quantity; candidate PCR check pass does not close mandatory foreground expansions or prove scientific, legal, safety or publication readiness. |  |\n| tow_fishing_branch | operated_freight_vessel_hire | Verify tanker,bulk/cargo,tugboat and FISHING VESSEL hire scope remains complete. Resolve actual cargo/tank/towing/fishing/gear/preservation responsibility and original capability/gates without invented occurrence or catch requirement. Every actual tow,catch/bycatch/fish residue or co-service must have concrete native child,handoff,receiver and explicit allocation or evidenced absence;rental availability remains the reference. |  |\n| reference_compatibility_gate | all contributing nodes | Verify reference_compatibility against the recorded actual function, configuration/capacity, accepted H, quality, responsibility, duty and gates before pooling; retain unsupported combinations as separate strata. |  |\n| completed_obligation_cohort_gate | all contributing nodes | Verify completed_obligation_cohort using cut-off status and unique full-cycle event ownership; ongoing duties and unassigned failures cannot be silently divided by completed N, and N=0 has no finite intensity. |  |\n| foreground_expansion_reconciliation_gate | all contributing nodes | Verify foreground_expansion_reconciliation for every mandatory node-owned protocol, concrete child and physical ledger before attribution; unresolved applicability, identity, quantity, fate or provider overlap blocks foreground completion. |  |\n| conditional_range_guardrails_gate | all contributing nodes | Verify conditional_range_guardrails separately from the fixed reference definition; numeric guardrails require independent compatible evidence, a shared basis and reviewed scope, not a self-validating batch or invented universal bounds. |  |\n\n"
