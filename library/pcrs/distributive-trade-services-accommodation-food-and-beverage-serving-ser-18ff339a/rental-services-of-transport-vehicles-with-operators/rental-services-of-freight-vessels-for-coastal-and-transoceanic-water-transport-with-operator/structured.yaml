      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual operated vessel delivery/availability contract with named crew/control,capacity/time and native supply/provider gates. |\n| starting_condition_role | Foreground collection interface,not zero upstream crew/support/asset/fuel burden. |\n| product_classification_scope | CPC 3.0 66022 |\n| recursive_input_rule | Actual same-function native operated-hire subcontract demand once;replace exact provider-covered cells and complete required gaps,no purchased self-service or duplicate ticket/hire output. |\n| upstream_dataset_requirement | Actual hired function,vessel/configuration/capacity/time/control/gates/region/duty,technology,period and native unit compatible;mandatory lifecycle/atomic expansion gaps remain. |\n| disclosure | actual_self_propelled_freight_vessel_type_including_tanker_bulk_cargo_tug_fishing_configuration; genuine_operated_hire_not_carriage_tow_outcome_fish_production_or_bareboat; original_hired_capacity_scope_positive_actual_accepted_availability_H; operator_master_crew_control_commercial_direction; original_delivery_redelivery_quality_replacement_gates; region_duty_standby_position_failure_recovery; native_fuel_energy_initial_customer_stocks_whichever_payer; full_all_user_same_asset_vessel_port_gear_life; actual_tow_fishing_catch_cargo_handoffs_or_absence; node_owned_atomic_expansions; provider_phase_event_site_period_coverage_gaps_uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_operated_scope | operated_freight_vessel_hire | This PCR covers rental services of ALL types of self-propelled freight vessels for coastal and transoceanic water transport WITH CREW, explicitly including tankers, bulk dry cargo vessels, cargo and freight vessels, tugboats and FISHING VESSELS. The immediate supplied function is actual operated vessel availability under a genuine hire obligation, with declared vessel or hired portion, configuration, capacity, time, crew/operator responsibilities and gates. It is not limited to ordinary cargo ships, time charter or one fuel, propulsion, towing or fishing technology. Vessel type alone does not prove the function supplied to the immediate customer. | unsd-operated-freight-sea-2025 |\n| contract_function | operated_freight_vessel_hire | Exclude rental/leasing of vessels WITHOUT CREW (73115), inland freight-vessel hire, passenger-vessel hire, operator-only labour and vessel manufacture. Distinguish operated availability from freight carriage, a towing outcome or fish production sold as the immediate product. Charter terminology, crew presence, cargo/tow/catch success, or fuel payer alone cannot decide classification. Record actual contract substance, operator/master/crew employment, navigation/maintenance/safety control, commercial directions, counterparties and handoffs. Independent downstream transport, towing or fishing production remains a separate boundary; genuinely owed work and support under the hire remain included. | hmrc-hire-contract-context |\n| availability_acceptance | operated_freight_vessel_hire | Reference is one independently completed and accepted original operated freight-vessel hire engagement with positive actual accepted availability time H, original or genuinely chronologically amended configuration/capacity/control, region/duty and delivery/redelivery/quality/replacement gates. Count denotes the accepted hire obligation, not a tonne-kilometre, cargo shipment, completed tow, fish catch, voyage, invoice or crew shift. Actual permitted standby may fulfill availability with zero sailing, cargo, towing or catch. Retain H and capacity for coherent comparison and causal attribution; unlike hire durations/configurations/functions are not equivalent merely because each counts as one. An accepted replacement fulfilling the same obligation does not create another reference item. |  |\n| operating_duty | operated_freight_vessel_hire | Keep actual crew/readiness, standby, positioning, sailing/manoeuvring, port/anchor/berth, delivery/redelivery, cleaning, failure/recovery and accepted replacement duties. Include actual cargo/tank/pumping/temperature-control support, towing equipment/work and fishing gear/operation/preservation only where evidenced as owed by the hire; no positive tow, catch or cargo is required. Original duties and genuine amendments retain failed/cancelled/unavailable periods and burdens. Actual consumed fuel/energy and upstream supply/charging, including initial/customer-held stocks, belong once regardless payer/title after exact provider reconciliation. No universal hire clause, manning limit, fuel factor, yield, stock quantity or lifetime is supplied. | imo-ship-operation-context |\n| native_supply_payers | operated_freight_vessel_hire | Trace every actually consumed native fuel/energy source, supply, stock, withdrawal and use once regardless owner/purchaser/title, including initial/opening/customer-owned fuel and battery energy. Include compatible upstream supply/charging and actual operational releases; external electricity/heat/cold differs from onboard generation and internal recovery. Whole provider coverage replaces exact cells, never a duplicate purchaser/withdrawal input. No assumption that every vessel uses diesel or R134a. |  |\n| asset_provider_life | operated_freight_vessel_hire | Require actual vessel assembly and propulsion/hotel/safety systems, supplied replacement components, port/berth/shore and other real support assets at native construction/initial/replacement/maintenance/retirement gates. Attribute to the studied hire through positive same-asset all-user useful-life availability/capacity-time or another evidenced compatible causal duty, not freight throughput or full manufacture per engagement. Include all actual hires, own-operated carriage, standby/support users, sites and periods served by that asset. Exact compatible hire/crew/tug/pilot/shore providers replace only covered phases/events/sites/periods; required gaps remain. |  |\n| atomic_expansion_gate | operated_freight_vessel_hire | Every cp_expand_ protocol is a mandatory collection requirement, not an inventory flow. For this process require exhaustive event-linked occurrence or evidenced absence and concrete child register for every actual material, supplied assembly, service, collected waste stream, substance/particle fraction and receiver. Each child requires unique row, native identity/type/direction/state/function/gate/property/unit/quantity, verified UUID, owner and exact provider/all-user life coverage. A real supplied assembly or genuinely collected mixture may remain one identity; no invented constituents or heterogeneous list binding. Missing applicability, identity, quantity, fate or coverage blocks a complete foreground package and final TIDAS exchanges. |  |\n| physical_fates | operated_freight_vessel_hire | Record actual ballast/cooling resource intake and treatment/discharge, biofouling/coatings, bilge/oil/sludge, sewage/garbage, refrigerant recovery/leak, maintenance/retired materials and source-specific emissions at actual receiver. Collected waste, internal/retained recovery, external recovered product and direct emissions are distinct; source/compartment/carbon origin must fit native identity. No generic NOx/VOC/PM or water/air mixture UUID, unknown balance is investigated, not default total release or waste. | imo-marine-pollution-context |\n| tow_fishing_cargo_function | operated_freight_vessel_hire | Preserve full tanker,bulk/cargo,tug and fishing-vessel scope. Record actual intended towing/fishing/cargo or preservation duties,gear/hold/tank configuration and native service/quality gates without assuming occurrence. Every actual independent tow service,catch species/state/handoff,bycatch,fish residue or recovered product requires concrete child identity,quantity,receiver and direct-first attribution or evidenced absence. Downstream outcome and the same hired availability cannot both be final outputs for one supplied obligation. Positive cargo/tow/catch is never an availability gate. |  |\n\n"
