      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | operated_freight_vessel_hire | Directly assign dedicated hire/crew/vessel/support events before residual shared-pool attribution. Enumerate all independently supplied hire and other real user functions with actual handovers; do not count the same hired vessel as both output hire and a second freight journey in this boundary. Downstream transport may consume the native hire once and must not repeat provider-covered physical burdens. | ghg-product-2011 |\n| availability_pool | operated_freight_vessel_hire | Use actual compatible availability/capacity-time,operating/standby duty,meter/work or another evidenced causal driver for each pool including all concurrent partial-hire and nonhire users. Cargo throughput,tow work,catch mass,revenue,equal engagement split or nominal capacity are not automatic rental drivers. Assign actual owed positioning,failed/replacement,towing/fishing/support duty to its responsible pool once even without sailing,cargo,tow success or catch. |  |\n| same_asset_life | operated_freight_vessel_hire | Attribute native supplied assembly/asset quantity by studied compatible duty divided by positive documented same-asset all-user useful-life duty, then normalize once by coherent accepted hire engagements. All real hire/carriage/support uses/sites/periods participate. Construction/initial, replacement, maintenance and retirement exclusive; forecasts retain provenance/sensitivity. |  |\n| failed_and_recovered | operated_freight_vessel_hire | Keep failed/off-hire/unavailable/cancelled or interrupted duties at real owner/pool/period without fictitious accepted hire. Actual rescue/replacement/waste/recovered product and direct release have independent native responsibility and quantity once. Financial compensation is not physical replacement or avoided-impact credit; retained internal recovery is closing stock, not extra external recovered output. |  |\n| tow_fishing_outputs | operated_freight_vessel_hire | Enumerate actual independent transport/tow service,catch species/state handoff,recovered product,residue and waste or prove absence. Assign dedicated events directly,then justify compatible causal all-user and cross-output attribution with uncertainty. Real downstream transport/towing/fish production keeps its own native reference and consumes hire only once. Cargo tonne-km,tow completion,catch mass,revenue or equal Count is not an automatic rental/manufacture allocation driver;no counterfactual displacement. |  |\n\n"
