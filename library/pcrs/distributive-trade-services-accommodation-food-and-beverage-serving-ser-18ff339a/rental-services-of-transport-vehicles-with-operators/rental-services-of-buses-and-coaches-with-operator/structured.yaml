      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | all nodes | Directly assign real native events/supplies first. For unavoidable shared pools select and justify same-function causal demand,then an explicit supported alternative if causal separation fails; disclose uncertainty/sensitivity and keep all actual recipients. Payment,revenue,passenger throughput and invoice shares are not automatic physical allocation. | ghg-product-2011 |\n| same_asset_full_life | lifecycle_support | For each same asset/cohort phase,attribute once over positive compatible whole-life availability/capacity-time or evidenced causal duty for every actual rental,own-carriage,standby/support user,node,site and period. Initial whole-assembly parts and separately supplied replacements exclusive. Forecast life/demand need source,sensitivity and updates; no assumed lifetime or zero for existing assets. |  |\n| failure_and_return | all nodes | Tag unavailable,failed,cancelled,returned,repair and replacement states at their actual producing node and chronology. Link recovery/rework loops and real exits to that node. Retain burdens in the responsible coherent service pool; rejected/unresolved duties are not accepted N. An accepted replacement fulfilling the original hire does not create another item; genuine scope changes retain original history. |  |\n| intended_outputs | all nodes | Enumerate actual intended outputs and handoffs,including distinct native co-services and recovered products; require explicit absence when none. Reference is the sole hire output for its obligation,not duplicate trip/ticket/customer transport. Separate intended output,residue,waste and internal recirculation. Directly assign first,then explicit supported cross-output attribution; no automatic counterfactual recovery credit. |  |\n| provider_cells | all nodes | Native provider demand replaces only exact covered phase/event/site/period cells,once. Preserve real service function,unit,gate,all-user asset life and residual supply/direct/maintenance/retirement gaps. Do not add an inclusive provider and its own already covered foreground exchanges;payer/title is not coverage. |  |\n\n"
