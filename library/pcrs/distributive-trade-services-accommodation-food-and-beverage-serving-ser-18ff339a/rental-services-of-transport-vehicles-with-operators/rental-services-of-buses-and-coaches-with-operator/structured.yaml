          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Original operated hire and actual vehicle/driver availability acceptance interface |\n| starting_condition_role | Collection gate does not erase earlier preparation, initial/customer fuel or pre-existing asset life |\n| product_classification_scope | Full66011 period operated rental, excluding64118/64223 charter |\n| recursive_input_rule | Actual native operated-hire provider replaces exact own covered cells once with gaps retained |\n| upstream_dataset_requirement | Actual function, native unit/gate, vehicle/capacity/time/control/region/duty/life/provider scope |\n| disclosure | genuine_operated_rental_not_64118_64223_charter; original_hire_obligation; positive_actual_accepted_availability_time; actual_bus_coach_fleet_configuration_capacity; renter_schedule_route_operational_direction; provider_driver_maintenance_safety_responsibility; availability_quality_replacement_delivery_redelivery_gates; actual_region_duty_standby_position_failure; fuel_energy_payer_independent_native_supply; all_user_same_asset_useful_life_capacity_time; provider_phase_event_site_period_coverage; exhaustive_node_owned_atomic_expansions; uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_rental_function | all nodes | This PCR covers buses and coaches rented with an operator for a period of time, generally not dependent on distance; the renter determines how and when the vehicles operate, including schedules, routes and other operational considerations. The supplied product is actual operated vehicle availability under the original hire obligation. Reference is one independently completed and accepted hire engagement with declared positive actual accepted availability time, vehicle or originally specified fleet, configuration, capacity, operator responsibilities, region/duty and delivery/redelivery gates. Permitted standby can fulfill availability with no passengers or distance. Unlike duration/capacity/control/duty profiles are not equivalent merely because each engagement counts as one. | unsd-cpc3-66011 |\n| carriage_exclusion | all nodes | Exclude local/urban/suburban bus or coach charter services 64118 and long-distance charter 64223, passenger carriage sold as transport, vehicle hire without operator, operator-only labour and asset manufacture. A monthly invoice, whole-vehicle booking, driver presence, distance charge or fuel payer alone does not establish operated rental; verify the actual immediate supplied function and renter operational direction. Independent downstream passenger service remains separate. Actual driver work, preparation, accepted standby, positioning, failure/recovery/replacement and required support stay inside the causal rental boundary. No universal hire, legal, vehicle-size or driver-hours clause is imposed. | unsd-cpc3-66011 |\n| whole_actual_duty | operated_hire; turnaround_support | Include actual driver/operator work and necessary dispatch/preparation/inspection, active operation, owed standby, depot/customer delivery/redelivery positioning, layover, cleaning, breakdown/search/recovery, unavailable duties and actual accepted replacement. Record renter schedule/route directions and provider driver/maintenance/safety responsibilities without implying unsafe unrestricted control. Actual readiness/HVAC/thermal/charging and ancillary loads remain even with no passengers. Human support uses real owed supplies/services without invented metabolic/diet factors. | guardian-leasing |\n| native_supply_title | all nodes | Actual consumed fuel/charged energy and attributable supply losses have compatible upstream supply/charging once regardless owner, renter or driver payment/title, including initial/opening/customer-held energy. Reconcile purchase/stock/withdrawal/use/return so purchase and withdrawal are not two supplies and reserve not all consumed. Actual diesel/electric/hybrid/gaseous/other propulsion is recorded, not all assumed present. Internal power/recovered material not a new purchased product. | ghg-product-2011 |\n| all_user_asset_life | lifecycle_support | Require actual vehicle assembly, propulsion/battery/charger/HVAC/tyre/brake components, depot/road/workshop/support infrastructure and all real life events. Preserve manufacture/construction/install/commission/maintain/repair/replace/retire and covered initial parts; a supplied whole assembly may stay one identity. Attribute same-asset cohort phases to all actual hire, own carriage and support users by supported useful-life availability/capacity-time or compatible causal duty, not passenger throughput or full manufacture per engagement. Existing/leased assets not free. Every unknown actual identity is mandatory expansion, not an inventory bucket. | ghg-product-2011 |\n| exact_native_provider | all nodes | Actual hire/subhire/driver-support/charging/cleaning/maintenance/recovery/treatment and infrastructure providers keep their native function/unit/gates and covered phases/events/sites/periods. Replace exact matching own supply/direct/life cells once; all required gaps remain. Neither subcontracting nor a fuel-included invoice proves full life or removes renter-paid energy. No duplicate final passenger carriage and rental output for one supplied obligation. | ghg-product-2011 |\n| exclusive_fates | all nodes | Use mutually exclusive opening/receipt/closing/use/return/recovered outward/waste/environment terms. Internal recovery not extra receipt/use/outward; recovered material is only retained, actually later used or sent to one destination. Distinguish actual supplied water, direct withdrawal, recirculation, runoff and evaporative consumption; actual source/receiving compartment and native state govern. Collected real mixtures may remain one identified waste stream, not all constituent mass emitted or automatic recycling credit. | ghg-product-2011 |\n| mandatory_atomic_completion | all nodes | Every cp_expand_ is a mandatory node-owned collection requirement outside inventory. For each real event require occurrence or evidenced absence and an exhaustive child register; each actual child has unique row, single identifiable product/formulation/assembly/functional service/collected waste/substance or particle fraction, actual direction/type/state/gate/native property/unit/quantity/source/same-node protocol, verified UUID, receiver and all-user/provider coverage. Split independently identified alternatives and environmental compartments; never bind a requirement label, generic exhaust/NOx/VOC/PM or assets/waste list. Real assemblies/collected mixtures need no invented constituents. Unknown applicability, identity, quantity, fate or coverage blocks complete foreground packages and final exchanges; checker pass does not resolve these facts. | ghg-product-2011 |\n\n"
