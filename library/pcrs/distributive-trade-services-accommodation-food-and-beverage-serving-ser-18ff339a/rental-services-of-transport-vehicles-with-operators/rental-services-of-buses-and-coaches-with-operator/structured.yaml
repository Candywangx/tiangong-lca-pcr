    - protocol_id: cp_acceptance_cohort
      process_id: "operated_hire"
      flow_role: "reference-obligation compatibility and cross-period cohort"
      record_type: "original agreement acceptance and event ledger"
      raw_fields: "obligation_id;original_amendments;function;configuration;capacity_native_unit;accepted_H;quality;technical_commercial_roles;region_duty;delivery_redelivery_gates;compatibility_decision;opening_ongoing;new_obligations;completed_accepted;failed_cancelled;closing_ongoing;event_id;contributing_node;period;pool_owner;provider_cells;quantity_method;range_evidence"
      collection_method: "Reconcile each original obligation against contract, acceptance and full-cycle events. Retain cut-off states and contributing nodes; apply reference_compatibility and completed_obligation_cohort. Ongoing burdens stay with their own obligation; failure attribution requires causal evidence. Complete actual children with occurrence or evidenced absence; row guardrails require independent compatible evidence."
      unit: "Item(s); actual time and capacity units; actual native units"
      frequency: "Each actual obligation and reporting cut"
      temporal_coverage: "Full obligation cycle and traceable reporting periods"
      site_scope: "This node reference obligations and explicitly linked contributors"
      aggregation_rule: "per declared reference flow; compatible completed-obligation cohort"
      quality_evidence: "Original agreement and chronological amendments, acceptance, calibrated meters and event ownership, independent sample and conversion evidence"
  calculation_rules:
    - id: normalize_once
      applies_to: "all nodes"
      rule: "q_ref = sum(q_attributed_native) / N. N is the coherent positive count of independently accepted qualified original hire engagements; do not average unlike per-hire intensities. Retain actual H,capacity,configuration,region and duty per item. Apply reference_compatibility and completed_obligation_cohort before selecting the numerator and N."
      inputs:
        - q_attributed_native
        - N
        - H
      output: "Native quantity per qualified Item(s)"
      source_ids: []
    - id: asset_phase_share
      applies_to: "lifecycle_support"
      rule: "q_asset_phase = q_native_phase * d_hire / D_all_users. Use compatible positive same-asset whole-life causal availability/capacity-time demand; all real users included and phase shares reconcile. Different asset cohorts/phases/provider cells never share an invented denominator. Passenger-km is not an automatic manufacture denominator. A share of 1 is allowed only when evidence shows that the target hire/cohort accounts for the entire compatible all-user demand of that same asset/event over its relevant life. Reconcile shares across all real users to 1; never default to a whole-asset charge."
      inputs:
        - q_native_phase
        - d_hire
        - D_all_users
      output: "Phase-attributed native asset quantity"
      source_ids: []
    - id: exclusive_stock
      applies_to: "all nodes"
      rule: "opening + external_receipts + internal_receipts + generated = closing + actual_use + outward + loss for each separately bounded compatible stock and non-overlapping interval. generated is evidenced formation into that stock,including collected waste or captured matter;it is not a second external supply. Keep all terms mutually exclusive. Pair internal receipts and dispatches with transfer ids and cancel them at the combined boundary;recirculation within the same stock gate adds neither receipt nor use. Distinguish initial fill,reserve,returns and recovery. Consumed/lost supplied products,including opening/customer stock,receive compatible upstream supply once,whoever pays;do not purchase generated waste again."
      inputs:
        - opening
        - external_receipts
        - internal_receipts
        - generated
        - closing
        - actual_use
        - outward
        - loss
      output: "Reconciled native material/energy stocks"
      source_ids: []
    - id: external_ac
      applies_to: "operated_hire; turnaround_support"
      rule: "E_MJ = 3.6 * E_kWh for compatible external AC only; native Net calorific value. Disjoint operation/charging and turnaround meters,initial stored energy,losses and provider gate coverage reconcile. Internally generated electricity is not an extra purchased product."
      inputs:
        - E_kWh
        - meter_gate
        - initial_energy
        - provider_coverage
      output: "Native external AC MJ once"
      source_ids: []
    - id: release_fates
      applies_to: "all nodes"
      rule: "For every actual substance/fraction,measure or use a compatible evidenced calculation at actual technology,duty,carbon origin and receiving compartment. Reconcile gross formation,retained stock,capture,transfer and actual release with disjoint fates; raw aggregate exhaust/NOx/VOC/PM is not species mass. A collected waste stream is not its constituents emitted; CO2e is not CO2 mass."
      inputs:
        - native_activity
        - compatible_method
        - actual_species_fraction
        - fates
      output: "Each actual compartment-specific release"
      source_ids: []
    - id: site_period_aggregation
      applies_to: "all nodes"
      rule: "Index all vehicle,driver,depot,workshop,road/support and provider contributors and actual contract/reporting/lifecycle periods. Link each physical transfer/event to one owner and shared hire boundary. Sum attributed raw quantities before normalization; justify cohort selection,weighting and representativeness,with omissions/overlaps unresolved."
      inputs:
        - site_id
        - period
        - event_owner
        - native_quantity
        - cohort
        - N
      output: "Complete coherent attributed cohort"
      source_ids: []
    - id: reference_compatibility
      applies_to: "all actual rows and obligations"
      rule: "Before pooling or comparing per-engagement results, record a compatibility decision for every original obligation. Require the same supplied function, compatible actual configuration and hired capacity or capability with native units, equal accepted availability H for the declared per-engagement reference, equivalent acceptance quality, operating versus commercial responsibilities, delivery/redelivery gates, region and duty. Unit conversions require verified support; tolerance may cover evidenced measurement uncertainty only, not different service functions or durations. Different H, incompatible capacity, control, duty or gates remain separate strata unless a documented physical conversion to one explicitly declared common reference is supported for every affected quantity. Count, price, nominal fleet capacity and a shared CPC code never establish equivalence. Missing facts block pooling; one item remains one real original accepted obligation."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: completed_obligation_cohort
      applies_to: "reference output and linked contributing nodes"
      rule: "Use a declared completed-obligation cohort for this engagement reference. At each reporting cut retain opening ongoing obligations, new obligations, completed accepted obligations, terminal failed/cancelled obligations and closing ongoing obligations with original ids and chronological amendments. Each physical event belongs to its actual obligation and node or one evidenced shared pool. Gather the complete causal service cycle for every obligation entering N, including events before the reporting window; do not divide all calendar-period purchases or ongoing-contract activity by the count completed in that period. Keep ongoing activity with its own obligation for later reconciliation; it is not zero or an accepted fractional item. Failed/cancelled burdens remain separately traceable and enter an accepted cohort only through documented causal pool attribution, never an arbitrary shift to another product or period. Reconcile period and full-obligation ledgers without duplicated events. At N=0 retain burdens and report no finite per-item intensity. A period-based service output requires its own explicit compatible reference and review, not a silent reinterpretation of this Count."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: foreground_expansion_reconciliation
      applies_to: "all actual rows and obligations"
      rule: "For each mandatory expansion protocol keep an applicability register owned by its declared node: occurred, evidenced absent or unresolved. An occurred branch has an exhaustive concrete-child list; each child records unique row id, direction/type, actual identity/state/gate, native property/unit/quantity and method, source/receiver/fate, physical transfer id and protocol, exact provider-covered phase/event/site/period cells and asset all-user lifetime attribution where applicable. An absence decision needs dated source records and a bounded node/period/scope; missing evidence is unresolved. Reconcile actual unallocated material, water, carbon and energy ledgers at compatible stock/transform/receiver gates before burden attribution; allocated quantities are not a substitute for physical balance. Internal transfers have paired native amounts and one custody/event owner, not new external supplies or releases. Do not bind protocol labels or fabricate mixture constituents. Any unresolved actual occurrence, identity, quantity, fate or coverage blocks completion of the concrete foreground package; a PCR contract check alone does not close the register."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: conditional_range_guardrails
      applies_to: "all actual rows and obligations"
      rule: "The fixed reference output amount is the normalization definition, not an observed yield distribution. For every other actual inventory row collect an independent compatible reference sample or physical/method constraint before applying a numerical QA guardrail. Record row/node, occurrence conditions, configuration, capacity and H stratum, supplier/state/gate, native unit and conversion evidence, sample source and period, method, bounds and uncertainty. Compare like quantities on the same stated basis; a numerator per engagement cannot be compared directly with a per-hour or per-mass bound. Do not use the validation batch own minimum or maximum to validate itself. A missing compatible numerical range is an unresolved evidence need, not zero, an accepted default or proof of abnormality. Do not invent a universal per-hire interval or replace measurements with a provisional estimate. Every required row-level range decision and supporting evidence must be reviewed before promotion; an unresolved range must remain disclosed."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
  data_quality_requirements:
    - id: original_hire_evidence
      applies_to: "reference product"
      requirement: "Original contract and chronological amendments prove period rental,renter schedule/route directions,operator responsibility,gates,actual accepted H and N. Payment alone does not qualify;availability may have zero distance/occupancy."
      evidence: "cp_hire"
    - id: technology_parent_delta
      applies_to: "all nodes"
      requirement: "Parent activity is operated bus/coach hire availability. Record actual drive/charging/auxiliary implementation and any topology,materials,calculation,asset-life or validation delta. Diesel,electric and hybrid are not asserted universal routes;coexistence/exclusion and native stocks/meter paths need current vehicle and operation evidence."
      evidence: "cp_expand_fuels;cp_expand_vehicle_assets"
    - id: atomic_completion
      applies_to: "every cp_expand_"
      requirement: "Exhaustive actual occurrence/absence and child register required for every mandatory node-owned requirement. Each actual child has single identity,unique native row,quantity,verified UUID/support,source/receiver/gate,and original all-user/provider/life coverage. Unknown applicability,identity,quantity,fate or coverage blocks complete foreground production."
      evidence: "all cp_expand_ protocols"
    - id: all_user_provider_life
      applies_to: "lifecycle_support"
      requirement: "Document actual whole-life users,phases,technology,initial/replacement/retirement events and exact provider cells;calibrated measurements or supported compatible methods and forecasts retain uncertainty/sensitivity. No existing leased asset or customer-paid energy is free."
      evidence: "cp_life"
    - id: sites_periods_fates
      applies_to: "all nodes"
      requirement: "All actual contributors,reporting/lifecycle periods,physical transfers,stocks and receivers link to one causal hire boundary. Prove no missing/duplicate sites,periods,events or flows;actual environmental species/medium and waste fate are preserved,not missing as zero."
      evidence: "cp_hire;cp_turnaround;cp_life"
    - id: cohort_and_evidence_gate
      applies_to: "all contributing nodes"
      requirement: "Obligation compatibility, cross-period states, actual children and independent range evidence must be traceable. Unknown facts are not zero; ongoing obligations cannot be mixed into a completed cohort."
      evidence: "cp_acceptance_cohort"
validation_rules:
  - rule_id: reference_acceptance
    applies_to: "all nodes"
    rule: "Verify full operated rental scope and64118/64223 exclusion from actual immediate function and renter directions;reference linkage,name,Count support,N,positive accepted H,configuration/capacity/control/gates/region/duty align. No positive distance,passengers or occupancy gate."
    source_ids: []
  - rule_id: atomic_final_gate
    applies_to: "all nodes"
    rule: "Every mandatory cp_expand_ must have evidenced occurrence/absence and exhaustive real children with separate atomic verified native identities/quantities/gates and same-node protocols. Unresolved actual applicability,identity,quantity,fate,source/receiver,all-user or provider coverage blocks complete foreground package and final exchanges. Requirements are not resolved inventory rows;automated PCR check pass is not actual foreground completion."
    source_ids: []
  - rule_id: route_and_native_energy
    applies_to: "all nodes"
    rule: "Parent operated hire and actual technology delta,coexistence/exclusion,stocks and meter gates must be evidenced. Conditional cards apply only to exact actual identity/state/gate. Native external AC Net calorific value MJ/kWh conversion once;no duplicate internal energy or payer exclusions."
    source_ids: []
  - rule_id: full_life_and_providers
    applies_to: "all nodes"
    rule: "Require positive compatible same-asset all-user full-life attribution,phase/period/site ownership,initial/replacement exclusivity and exact provider coverage/gaps. No passenger-throughput manufacture denominator,unsupported full-asset attribution per engagement,unsupported forecast or duplicate own/provider burden."
    source_ids: []
  - rule_id: failure_cooutputs_sites
    applies_to: "all nodes"
    rule: "Trace rejected/failed/cancelled/returned/repair/replacement duties from producing node to actual loop/exit,retain burden and exclude unresolved rejected N. Enumerate intended outputs/handoffs versus waste/residue,justify causal attribution,enumerate every site/period/user and aggregate native quantities before one normalization."
    source_ids: []
  - rule_id: native_fates
    applies_to: "all nodes"
    rule: "Reconcile stocks and all physical handoffs with actual source/receiver,substance/particle fraction,carbon origin,phase,resource/environment compartment and compatible methods. Collected waste,treatment,product recovery and environmental release are distinct;no assumed zero,full-stock release or automatic substitution credit."
    source_ids: []
  - rule_id: reference_compatibility_gate
    applies_to: "all contributing nodes"
    rule: "Verify reference_compatibility against the recorded actual function, configuration/capacity, accepted H, quality, responsibility, duty and gates before pooling; retain unsupported combinations as separate strata."
    source_ids: []
  - rule_id: completed_obligation_cohort_gate
    applies_to: "all contributing nodes"
    rule: "Verify completed_obligation_cohort using cut-off status and unique full-cycle event ownership; ongoing duties and unassigned failures cannot be silently divided by completed N, and N=0 has no finite intensity."
    source_ids: []
  - rule_id: foreground_expansion_reconciliation_gate
    applies_to: "all contributing nodes"
    rule: "Verify foreground_expansion_reconciliation for every mandatory node-owned protocol, concrete child and physical ledger before attribution; unresolved applicability, identity, quantity, fate or provider overlap blocks foreground completion."
    source_ids: []
  - rule_id: conditional_range_guardrails_gate
    applies_to: "all contributing nodes"
    rule: "Verify conditional_range_guardrails separately from the fixed reference definition; numeric guardrails require independent compatible evidence, a shared basis and reviewed scope, not a self-validating batch or invented universal bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified operated bus/coach hire foreground inventory for downstream process/lifecyclemodel projections."
  allowed_use: "Actual independently accepted period hire with renter operational direction,positive H and harmonized capacity/configuration/control/gates/region/duty after complete atomic expansion,native upstream/full all-user life and identity/data review."
  excluded_use: "64118/64223 charter/passenger carriage,bare hire,operator-only labour,unqualified Count,unlike hire averaging,free customer energy,positive distance/occupancy as mandatory availability,or unresolved expansion as zero."
  required_metadata: "genuine_operated_rental_not_64118_64223_charter; original_hire_obligation; positive_actual_accepted_availability_time; actual_bus_coach_fleet_configuration_capacity; renter_schedule_route_operational_direction; provider_driver_maintenance_safety_responsibility; availability_quality_replacement_delivery_redelivery_gates; actual_region_duty_standby_position_failure; fuel_energy_payer_independent_native_supply; all_user_same_asset_useful_life_capacity_time; provider_phase_event_site_period_coverage; exhaustive_node_owned_atomic_expansions; uncertainty; compatibility_decision; completed_obligation_cohort; row_range_evidence_status"
  required_quality_disclosure: "Original/amended hire,H/failure/replacement,native sources/stocks,all actual sites/periods/users,full asset life/provider cells and unresolved child/quantity/identity/fate gaps with uncertainty."
  update_trigger: "Changed actual function,renter/operator responsibility,configuration/capacity/time/gates/region/duty,technology/energy/provider,life/attribution,actual materials/waste/substances/compartments or fate."
