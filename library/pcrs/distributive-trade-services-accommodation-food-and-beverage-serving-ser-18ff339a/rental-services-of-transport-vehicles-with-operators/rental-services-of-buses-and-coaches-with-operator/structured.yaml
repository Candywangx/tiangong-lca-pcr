system_boundary:
  rules:
    - rule_id: full_rental_function
      applies_to: "all nodes"
      rule: "This PCR covers buses and coaches rented with an operator for a period of time, generally not dependent on distance; the renter determines how and when the vehicles operate, including schedules, routes and other operational considerations. The supplied product is actual operated vehicle availability under the original hire obligation. Reference is one independently completed and accepted hire engagement with declared positive actual accepted availability time, vehicle or originally specified fleet, configuration, capacity, operator responsibilities, region/duty and delivery/redelivery gates. Permitted standby can fulfill availability with no passengers or distance. Unlike duration/capacity/control/duty profiles are not equivalent merely because each engagement counts as one."
      source_ids:
        - unsd-cpc3-66011
    - rule_id: carriage_exclusion
      applies_to: "all nodes"
      rule: "Exclude local/urban/suburban bus or coach charter services 64118 and long-distance charter 64223, passenger carriage sold as transport, vehicle hire without operator, operator-only labour and asset manufacture. A monthly invoice, whole-vehicle booking, driver presence, distance charge or fuel payer alone does not establish operated rental; verify the actual immediate supplied function and renter operational direction. Independent downstream passenger service remains separate. Actual driver work, preparation, accepted standby, positioning, failure/recovery/replacement and required support stay inside the causal rental boundary. No universal hire, legal, vehicle-size or driver-hours clause is imposed."
      source_ids:
        - unsd-cpc3-66011
    - rule_id: whole_actual_duty
      applies_to: "operated_hire; turnaround_support"
      rule: "Include actual driver/operator work and necessary dispatch/preparation/inspection, active operation, owed standby, depot/customer delivery/redelivery positioning, layover, cleaning, breakdown/search/recovery, unavailable duties and actual accepted replacement. Record renter schedule/route directions and provider driver/maintenance/safety responsibilities without implying unsafe unrestricted control. Actual readiness/HVAC/thermal/charging and ancillary loads remain even with no passengers. Human support uses real owed supplies/services without invented metabolic/diet factors."
      source_ids:
        - guardian-leasing
    - rule_id: native_supply_title
      applies_to: "all nodes"
      rule: "Actual consumed fuel/charged energy and attributable supply losses have compatible upstream supply/charging once regardless owner, renter or driver payment/title, including initial/opening/customer-held energy. Reconcile purchase/stock/withdrawal/use/return so purchase and withdrawal are not two supplies and reserve not all consumed. Actual diesel/electric/hybrid/gaseous/other propulsion is recorded, not all assumed present. Internal power/recovered material not a new purchased product."
      source_ids:
        - ghg-product-2011
    - rule_id: all_user_asset_life
      applies_to: "lifecycle_support"
      rule: "Require actual vehicle assembly, propulsion/battery/charger/HVAC/tyre/brake components, depot/road/workshop/support infrastructure and all real life events. Preserve manufacture/construction/install/commission/maintain/repair/replace/retire and covered initial parts; a supplied whole assembly may stay one identity. Attribute same-asset cohort phases to all actual hire, own carriage and support users by supported useful-life availability/capacity-time or compatible causal duty, not passenger throughput or full manufacture per engagement. Existing/leased assets not free. Every unknown actual identity is mandatory expansion, not an inventory bucket."
      source_ids:
        - ghg-product-2011
    - rule_id: exact_native_provider
      applies_to: "all nodes"
      rule: "Actual hire/subhire/driver-support/charging/cleaning/maintenance/recovery/treatment and infrastructure providers keep their native function/unit/gates and covered phases/events/sites/periods. Replace exact matching own supply/direct/life cells once; all required gaps remain. Neither subcontracting nor a fuel-included invoice proves full life or removes renter-paid energy. No duplicate final passenger carriage and rental output for one supplied obligation."
      source_ids:
        - ghg-product-2011
    - rule_id: exclusive_fates
      applies_to: "all nodes"
      rule: "Use mutually exclusive opening/receipt/closing/use/return/recovered outward/waste/environment terms. Internal recovery not extra receipt/use/outward; recovered material is only retained, actually later used or sent to one destination. Distinguish actual supplied water, direct withdrawal, recirculation, runoff and evaporative consumption; actual source/receiving compartment and native state govern. Collected real mixtures may remain one identified waste stream, not all constituent mass emitted or automatic recycling credit."
      source_ids:
        - ghg-product-2011
    - rule_id: mandatory_atomic_completion
      applies_to: "all nodes"
      rule: "Every cp_expand_ is a mandatory node-owned collection requirement outside inventory. For each real event require occurrence or evidenced absence and an exhaustive child register; each actual child has unique row, single identifiable product/formulation/assembly/functional service/collected waste/substance or particle fraction, actual direction/type/state/gate/native property/unit/quantity/source/same-node protocol, verified UUID, receiver and all-user/provider coverage. Split independently identified alternatives and environmental compartments; never bind a requirement label, generic exhaust/NOx/VOC/PM or assets/waste list. Real assemblies/collected mixtures need no invented constituents. Unknown applicability, identity, quantity, fate or coverage blocks complete foreground packages and final exchanges; checker pass does not resolve these facts."
      source_ids:
        - ghg-product-2011
