    reference: "UNSD,CPC Version3.0,66011,current note accessed23October2026. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/66011"
    used_for: "Actual official note supports period rental,renter scheduling/routes and64118/64223 exclusions only;no energy factors,universal hire clauses or fleet defaults."
  - id: "guardian-leasing"
    type: "literature"
    reference: "Guardian Bus Lines,Bus Leasing,actual body accessed23October2026. https://guardianbuslines.ca/services/bus-leasing.php"
    used_for: "One provider example supports questions on defined-term dedicated bus with company driver,capacity/service area/maintenance and replacement;does not establish global clauses,all technologies,CPC membership or quantitative defaults."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,ch6-9. https://ghgprotocol.org/product-standard"
    used_for: "General function,lifecycle,data-quality and allocation principles only;qualified hire Count,availability/capacity-time,native stock/provider/full all-user life and atomic-completion gate are explicit PCR modelling choices,not quoted standard formulas."
