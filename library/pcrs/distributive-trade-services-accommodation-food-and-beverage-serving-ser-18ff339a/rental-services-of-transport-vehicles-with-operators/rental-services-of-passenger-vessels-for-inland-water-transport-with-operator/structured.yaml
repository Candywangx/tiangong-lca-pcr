      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual self-propelled inland passenger-vessel-plus-crew availability obligation,original configuration/hired capacity/responsibilities and native provider gates. |\n| starting_condition_role | Foreground collection interface;initial/customer energy,vessel/shore assets,crew/support,resources,waste and releases remain included. |\n| product_classification_scope | CPC 3.0 66023 |\n| recursive_input_rule | Record actual same-function operated vessel subhire in its native unit and exact provider coverage once; collect gaps without self-purchase or duplicate hire/carriage output. |\n| upstream_dataset_requirement | Actual native inland operated vessel function,configuration/hired capacity/time,crew/responsibility/gates,waterbody/duty and technology/period compatible;preserve incomplete coverage. |\n| disclosure | Actual engagement id and original/genuine amended obligation; actual self-propelled passenger vessel identity and configuration; actual hired passenger capacity with native unit; positive actual accepted availability time H; engagement/reporting periods; master/crew/provider operating responsibility; hirer employment direction/control and retained navigation responsibility; availability/quality/acceptance and replacement terms; delivery/return gates; actual inland waterbody/region and duty; standby/positioning/failure/replacement records; all-user asset life and exact native provider coverage |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| hire_function | operated_inland_passenger_vessel_hire | Begin with the actual vessel-plus-crew availability obligation and end at accepted completion/return. Include attributable preparation,empty positioning,accepted standby,propulsion/hotel/auxiliary work,cleaning,failure/recovery and accepted substitute. Unavailable/rejected time is not H,but causal burdens remain. Link real failed vessel states to repair/rework,return,replacement or retirement;material/waste exits need concrete children. | unsd-inland-passenger-hire-2025;hmrc-hire-context |\n| complete_lifecycle | operated_inland_passenger_vessel_hire | Collect actual native energy/materials regardless of payer,including consumed initial/customer onboard energy;crew/support duties,vessel/assembly and inland shore/shared infrastructure initial supply,maintenance,replacement and retirement,waste treatment,resource intakes and direct releases. Starting at delivery does not make these zero. Every unknown branch remains mandatory expansion. |  |\n| provider_interface | operated_inland_passenger_vessel_hire | A compatible actual provider dataset replaces only its documented same-function native demand/gate and exact covered lifecycle cells once;collect uncovered cells without self-purchase or duplicate fuel,vessel,crew or support burden. Include other hires,own transport,hotel/standby/support and concurrent capacity users in all-user asset demand;record real transfer ownership. |  |\n| inland_units | operated_inland_passenger_vessel_hire | Index each actual self-propelled vessel/configuration/hired capacity,master/crew,waterbody/duty,berth/shore/workshop/provider unit and reporting/lifecycle period. State actual propulsion/hotel/control and any incompatible state;retain separate strata unless common-function equivalence is evidenced. General maritime context is not a legal or numerical inland-vessel prescription. | unsd-inland-passenger-hire-2025;imo-operation-context;imo-pollution-context |\n\n"
