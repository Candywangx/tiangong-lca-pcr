  calculation_rules:
    - id: engagement_count
      applies_to: "real reference output"
      rule: "N = count(independently accepted qualifying hire obligations); H > 0. Keep actual original/genuine amended vessel/configuration/hired capacity/crew/gates. No extra N for sailing,passenger,invoice,shift or substitute."
      inputs:
        - "acceptance and actual available intervals"
      output: "coherent N and qualified H"
      source_ids: []
    - id: native_stock
      applies_to: "native consumed product"
      rule: "U = opening_stock + receipts - closing_stock - returns - outward_transfers. Include actual initial/customer stock and custody transfers;reconcile actual use/waste. Stock balance alone does not prove consumption or release."
      inputs:
        - "compatible native stocks and events"
      output: "actual attributable native U"
      source_ids: []
    - id: shared_native
      applies_to: "shared native quantity or lifecycle event"
      rule: "q_ej = Q_j * d_ej / sum_all_users(d_uj). Denominator must be positive and same-function compatible,covering actual vessel/asset life and all users/functions/periods. Assign initial/replacement/maintenance/retirement/provider cells once. A share of 1 is allowed only when evidence shows that the target hire/cohort accounts for the entire compatible all-user demand of that same asset/event over its relevant life. Reconcile shares across all real users to 1; never default to a whole-asset charge."
      inputs:
        - "actual native Q_j"
        - "evidenced all-user demands and exact coverage"
      output: "attributed native q_ej"
      source_ids: []
    - id: normalize_once
      applies_to: "coherent hire cohort inventory"
      rule: "q_ref = sum_e(q_e) / N, N > 0. Aggregate only compatible hired configuration/capacity/time/responsibility/gates/waterbody/duty;preserve other strata. Apply reference_compatibility and completed_obligation_cohort before selecting the numerator and N."
      inputs:
        - "attributed native quantities"
        - "coherent N"
      output: "quantity per declared reference flow"
      source_ids: []
    - id: ac_native
      applies_to: "externally supplied AC irrespective of payer or payment"
      rule: "E_MJ = E_kWh * 3.6. Use native Net calorific value support and actual point-of-use gate;apply conversion once and account for real losses/provider coverage."
      inputs:
        - "metered compatible AC"
      output: "MJ"
      source_ids: []
    - id: substance_release
      applies_to: "each actual emitted substance"
      rule: "Use actual species mass measurement or source/technology/native-consumption compatible evidenced method. Preserve actual carbon origin,receiving medium,oxidized/retained/transferred/treated fractions and uncertainty;no universal factor,whole-stock release or supply-equals-emission assumption."
      inputs:
        - "actual source and fate evidence"
      output: "actual native substance mass"
      source_ids: []
    - id: reference_compatibility
      applies_to: "all actual rows and obligations"
      rule: "Before pooling or comparing per-engagement results, record a compatibility decision for every original obligation. Require the same supplied function, compatible actual configuration and hired capacity or capability with native units, equal accepted availability H for the declared per-engagement reference, equivalent acceptance quality, operating versus commercial responsibilities, delivery/redelivery gates, region and duty. Unit conversions require verified support; tolerance may cover evidenced measurement uncertainty only, not different service functions or durations. Different H, incompatible capacity, control, duty or gates remain separate strata unless a documented physical conversion to one explicitly declared common reference is supported for every affected quantity. Count, price, nominal fleet capacity and a shared CPC code never establish equivalence. Missing facts block pooling; one item remains one real original accepted obligation."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: completed_obligation_cohort
      applies_to: "reference output and linked contributing nodes"
      rule: "Use a declared completed-obligation cohort for this engagement reference. At each reporting cut retain opening ongoing obligations, new obligations, completed accepted obligations, terminal failed/cancelled obligations and closing ongoing obligations with original ids and chronological amendments. Each physical event belongs to its actual obligation and node or one evidenced shared pool. Gather the complete causal service cycle for every obligation entering N, including events before the reporting window; do not divide all calendar-period purchases or ongoing-contract activity by the count completed in that period. Keep ongoing activity with its own obligation for later reconciliation; it is not zero or an accepted fractional item. Failed/cancelled burdens remain separately traceable and enter an accepted cohort only through documented causal pool attribution, never an arbitrary shift to another product or period. Reconcile period and full-obligation ledgers without duplicated events. At N=0 retain burdens and report no finite per-item intensity. A period-based service output requires its own explicit compatible reference and review, not a silent reinterpretation of this Count."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: foreground_expansion_reconciliation
      applies_to: "all actual rows and obligations"
      rule: "For each mandatory expansion protocol keep an applicability register owned by its declared node: occurred, evidenced absent or unresolved. An occurred branch has an exhaustive concrete-child list; each child records unique row id, direction/type, actual identity/state/gate, native property/unit/quantity and method, source/receiver/fate, physical transfer id and protocol, exact provider-covered phase/event/site/period cells and asset all-user lifetime attribution where applicable. An absence decision needs dated source records and a bounded node/period/scope; missing evidence is unresolved. Reconcile actual unallocated material, water, carbon and energy ledgers at compatible stock/transform/receiver gates before burden attribution; allocated quantities are not a substitute for physical balance. Internal transfers have paired native amounts and one custody/event owner, not new external supplies or releases. Do not bind protocol labels or fabricate mixture constituents. Any unresolved actual occurrence, identity, quantity, fate or coverage blocks completion of the concrete foreground package; a PCR contract check alone does not close the register."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: conditional_range_guardrails
      applies_to: "all actual rows and obligations"
      rule: "The fixed reference output amount is the normalization definition, not an observed yield distribution. For every other actual inventory row collect an independent compatible reference sample or physical/method constraint before applying a numerical QA guardrail. Record row/node, occurrence conditions, configuration, capacity and H stratum, supplier/state/gate, native unit and conversion evidence, sample source and period, method, bounds and uncertainty. Compare like quantities on the same stated basis; a numerator per engagement cannot be compared directly with a per-hour or per-mass bound. Do not use the validation batch own minimum or maximum to validate itself. A missing compatible numerical range is an unresolved evidence need, not zero, an accepted default or proof of abnormality. Do not invent a universal per-hire interval or replace measurements with a provisional estimate. Every required row-level range decision and supporting evidence must be reviewed before promotion; an unresolved range must remain disclosed."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
  data_quality_requirements:
    - id: functional_acceptance
      applies_to: "actual inland operated hire"
      requirement: "Actual agreement,qualified self-propelled vessel/configuration/hired capacity,crew responsibility/hirer direction,positive accepted H and all gates/waterbody/duty must define the same immediate hire function. Sailing/passengers and fees are not acceptance proof."
      evidence: "cp_hire_acceptance"
    - id: atomic_register
      applies_to: "all mandatory expansions"
      requirement: "Every branch needs node-owned occurrence/evidenced absence and exhaustive unique concrete children with native identity/support/quantity/source/receiver/fate and provider/all-user-life ownership. Protocols are requirements,not actual exchanges;unresolved actual child evidence blocks completion."
      evidence: "cp_expand_fuels;cp_expand_other_energy;cp_expand_crew_support;cp_expand_vessel_assets;cp_expand_shore_assets;cp_expand_maintenance_materials;cp_expand_contracted_services;cp_expand_collected_wastes;cp_expand_resource_intakes;cp_expand_substance_releases;cp_expand_physical_transfers;cp_expand_cooutputs"
    - id: life_provider
      applies_to: "actual shared vessel,shore and service children"
      requirement: "All real hires,own transport,concurrent capacities,hotel/standby/support and periods enter compatible positive same-asset all-user life demand. Initial/replacement/maintenance/retirement and provider-covered cells are exclusive;forecast uncertainty needs sensitivity,no guessed lifetime or fee-based physical demand."
      evidence: "cp_expand_vessel_assets;cp_expand_shore_assets;cp_expand_contracted_services"
    - id: sites_periods
      applies_to: "all actual contributing units"
      requirement: "List actual vessel/master/crew/berth/shore/workshop/provider contributors and their reporting/lifecycle periods,with native records and common gates. Sum attributed compatible native quantities then N;different capacities,durations,waterbodies,duties and controls require strata and representativeness evidence."
      evidence: "cp_hire_acceptance;cp_native_supply;cp_expand_shore_assets"
    - id: native_fates
      applies_to: "all supplies,resources,transfers,wastes and releases"
      requirement: "Require calibrated native initial/stock/meter/use and transfer/receiver records. Separate tap supply,direct intake,bilge/ballast/sewage/collected waste and actual species/receiving medium. Preserve antifoul/maintenance formulation and actual fates;no missing-as-zero,density,release,resource,crew-rate or recovery default."
      evidence: "cp_native_supply;cp_generated_oil;cp_co2_release;cp_expand_resource_intakes;cp_expand_physical_transfers"
    - id: cohort_and_evidence_gate
      applies_to: "all contributing nodes"
      requirement: "Obligation compatibility, cross-period states, actual children and independent range evidence must be traceable. Unknown facts are not zero; ongoing obligations cannot be mixed into a completed cohort."
      evidence: "cp_acceptance_cohort"
validation_rules:
  - rule_id: scope_reference
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Verify full self-propelled inland passenger-vessel-with-crew scope and actual operated hire substance,positive actual accepted H and every qualifier. No no-crew,operator-only,manufacture,ticket/journey transport or sea-hire substitution,no blanket crewed-pleasurecraft exclusion,and no positive sailing/passenger gate. Count independent accepted obligations,not invoice,trips,shifts or substitute vessel."
    source_ids: []
  - rule_id: native_identity
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Every actual exchange needs one compatible verified concrete UUID,native property/unit/quantity,state/gate,source/provider and uncertainty. Fixed cards require actual compatible occurrence;different fuels,energy,formulations,waste streams or compartments need independent children. Missing is unknown,never zero."
    source_ids: []
  - rule_id: atomic_completion
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Every mandatory cp_expand_ requires exhaustive occurrence or evidenced absence and a concrete child register;requirements are not aggregate inventory exchanges. Each actual child needs unique node-owned row,direction/type,identity/state/gate,verified UUID and native property/unit support,quantity/method,source/receiver/fate,provider/all-user/life/period owner and nonduplication evidence. Any unresolved actual applicability,identity,quantity,fate or ownership blocks final foreground completion and downstream publication."
    source_ids: []
  - rule_id: physical_coverage
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Reconcile initial/customer fuel and every native supply,opening/closing stock,use,resource intake,water/bilge/ballast/material transfer,waste custody/treatment and actual species release. Preserve fossil/biogenic carbon and real receiving media;no whole-stock emission assumption. Internal transfer has one owner and is not duplicate purchase/release."
    source_ids: []
  - rule_id: life_provider_sites
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Every vessel/assembly/shore/provider lifecycle cell,shared consumer/function,unit/site/reporting period and failure/repair/return/substitute path has one owner,positive same-function compatible demand and exact coverage. Resolve mutually exclusive states and every output/handoff. Missing all-user life,provider scope or representativeness blocks completion;payments,nominal capacity and sailing/passenger totals do not prove accepted hire."
    source_ids: []
  - rule_id: reference_compatibility_gate
    applies_to: "all contributing nodes"
    rule: "Verify reference_compatibility against the recorded actual function, configuration/capacity, accepted H, quality, responsibility, duty and gates before pooling; retain unsupported combinations as separate strata."
    source_ids: []
  - rule_id: completed_obligation_cohort_gate
    applies_to: "all contributing nodes"
    rule: "Verify completed_obligation_cohort using cut-off status and unique full-cycle event ownership; ongoing duties and unassigned failures cannot be silently divided by completed N, and N=0 has no finite intensity."
    source_ids: []
  - rule_id: foreground_expansion_reconciliation_gate
    applies_to: "all contributing nodes"
    rule: "Verify foreground_expansion_reconciliation for every mandatory node-owned protocol, concrete child and physical ledger before attribution; unresolved applicability, identity, quantity, fate or provider overlap blocks foreground completion."
    source_ids: []
  - rule_id: conditional_range_guardrails_gate
    applies_to: "all contributing nodes"
    rule: "Verify conditional_range_guardrails separately from the fixed reference definition; numeric guardrails require independent compatible evidence, a shared basis and reviewed scope, not a self-validating batch or invented universal bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified operated inland passenger-vessel hire inventory for downstream process/lifecyclemodel use."
  allowed_use: "Actual independently accepted self-propelled inland passenger-vessel-with-crew hire,with harmonized configuration/hired capacity/availability/responsibility/gates/waterbody/duty and complete native atomic/provider/all-user-life review."
  excluded_use: "Unqualified engagement Count,ticket/passenger-km/voyage carriage,bareboat,operator-only,manufacture or sea-hire substitution;customer initial energy as free;positive sailing/passenger gate;unresolved expansion as zero."
  required_metadata: "Actual engagement id and original/genuine amended obligation; actual self-propelled passenger vessel identity and configuration; actual hired passenger capacity with native unit; positive actual accepted availability time H; engagement/reporting periods; master/crew/provider operating responsibility; hirer employment direction/control and retained navigation responsibility; availability/quality/acceptance and replacement terms; delivery/return gates; actual inland waterbody/region and duty; standby/positioning/failure/replacement records; all-user asset life and exact native provider coverage; compatibility_decision; completed_obligation_cohort; row_range_evidence_status"
  required_quality_disclosure: "Original/amended hire and accepted stationary/sailing availability;actual crew/control/failure/substitute;native initial/customer supply and transfer ownership;all-user/provider/life coverage;actual unknown identity/data/fate and uncertainty."
  update_trigger: "Changed actual hired vessel/configuration/capacity,availability/responsibilities/gates,waterbody/duty,propulsion/hotel/native supply,provider/life/allocation or actual resources/transfers/waste/release fate."
