      raw_fields: "obligation_id;original_amendments;function;configuration;capacity_native_unit;accepted_H;quality;technical_commercial_roles;region_duty;delivery_redelivery_gates;compatibility_decision;opening_ongoing;new_obligations;completed_accepted;failed_cancelled;closing_ongoing;event_id;contributing_node;period;pool_owner;provider_cells;quantity_method;range_evidence"
      collection_method: "Reconcile each original obligation against contract, acceptance and full-cycle events. Retain cut-off states and contributing nodes; apply reference_compatibility and completed_obligation_cohort. Ongoing burdens stay with their own obligation; failure attribution requires causal evidence. Complete actual children with occurrence or evidenced absence; row guardrails require independent compatible evidence."
