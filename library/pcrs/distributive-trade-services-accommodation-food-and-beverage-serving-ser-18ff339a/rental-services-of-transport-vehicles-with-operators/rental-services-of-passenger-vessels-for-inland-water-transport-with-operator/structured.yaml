      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | operated_inland_passenger_vessel_hire | Directly attribute actual vessel/event/provider/shore records to hire obligations where possible. For shared native Q_j,use q_ej = Q_j * d_ej / sum_all_users(d_uj),with an evidenced positive same-function compatible all-user demand denominator. Availability-capacity-time is usable only when causal;passenger-km,tickets,sailing distance,tariff or port fee is not a default hire driver. |  |\n| all_user_life | operated_inland_passenger_vessel_hire | Attribute each real initial vessel/assembly/shore asset and every replacement,maintenance and retirement event over its own compatible useful life and every real user/function/period,including other hires,own transport,standby/hotel/support and concurrent capacities. Preserve observed/forecast demand,uncertainty and sensitivity;no universal lifetime or unsupported default whole-asset charge per hire. |  |\n| outputs_and_rejects | operated_inland_passenger_vessel_hire | Enumerate actual independent intended outputs and each handoff;direct attribution precedes evidenced causal sharing. Unknown output/attribution/fate decisions block completion. Passenger carriage/custody is not a second produced hire output. Keep failed/unavailable/rejected activity burdens without accepted H/N;no automatic waste credit or counterfactual substitution. |  |\n| events_and_periods | operated_inland_passenger_vessel_hire | Declare actual engagement/event/fleet reporting periods. Link preparation,cleaning/changeover,standby,positioning,failure,recovery and substitute events to the origin or evidenced shared pool once;retain physical transfer ids and provider ownership. Sum attributed native quantities before coherent N;do not average unlike capacity,duration,waterbody,duty or technology intensities. |  |\n\n"
