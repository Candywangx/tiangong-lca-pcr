allocation_rules:
  - rule_id: direct_first
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Directly attribute actual vessel/event/provider/shore records to hire obligations where possible. For shared native Q_j,use q_ej = Q_j * d_ej / sum_all_users(d_uj),with an evidenced positive same-function compatible all-user demand denominator. Availability-capacity-time is usable only when causal;passenger-km,tickets,sailing distance,tariff or port fee is not a default hire driver."
    source_ids: []
  - rule_id: all_user_life
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Attribute each real initial vessel/assembly/shore asset and every replacement,maintenance and retirement event over its own compatible useful life and every real user/function/period,including other hires,own transport,standby/hotel/support and concurrent capacities. Preserve observed/forecast demand,uncertainty and sensitivity;no universal lifetime or unsupported default whole-asset charge per hire."
    source_ids: []
  - rule_id: outputs_and_rejects
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Enumerate actual independent intended outputs and each handoff;direct attribution precedes evidenced causal sharing. Unknown output/attribution/fate decisions block completion. Passenger carriage/custody is not a second produced hire output. Keep failed/unavailable/rejected activity burdens without accepted H/N;no automatic waste credit or counterfactual substitution."
    source_ids: []
  - rule_id: events_and_periods
    applies_to: "operated_inland_passenger_vessel_hire"
    rule: "Declare actual engagement/event/fleet reporting periods. Link preparation,cleaning/changeover,standby,positioning,failure,recovery and substitute events to the origin or evidenced shared pool once;retain physical transfer ids and provider ownership. Sum attributed native quantities before coherent N;do not average unlike capacity,duration,waterbody,duty or technology intensities."
