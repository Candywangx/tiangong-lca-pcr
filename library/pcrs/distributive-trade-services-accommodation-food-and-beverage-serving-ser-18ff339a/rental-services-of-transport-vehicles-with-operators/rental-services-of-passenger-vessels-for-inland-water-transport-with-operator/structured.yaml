      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_reference | operated_inland_passenger_vessel_hire | Verify full self-propelled inland passenger-vessel-with-crew scope and actual operated hire substance,positive actual accepted H and every qualifier. No no-crew,operator-only,manufacture,ticket/journey transport or sea-hire substitution,no blanket crewed-pleasurecraft exclusion,and no positive sailing/passenger gate. Count independent accepted obligations,not invoice,trips,shifts or substitute vessel. |  |\n| native_identity | operated_inland_passenger_vessel_hire | Every actual exchange needs one compatible verified concrete UUID,native property/unit/quantity,state/gate,source/provider and uncertainty. Fixed cards require actual compatible occurrence;different fuels,energy,formulations,waste streams or compartments need independent children. Missing is unknown,never zero. |  |\n| atomic_completion | operated_inland_passenger_vessel_hire | Every mandatory cp_expand_ requires exhaustive occurrence or evidenced absence and a concrete child register;requirements are not aggregate inventory exchanges. Each actual child needs unique node-owned row,direction/type,identity/state/gate,verified UUID and native property/unit support,quantity/method,source/receiver/fate,provider/all-user/life/period owner and nonduplication evidence. Any unresolved actual applicability,identity,quantity,fate or ownership blocks final foreground completion and downstream publication. |  |\n| physical_coverage | operated_inland_passenger_vessel_hire | Reconcile initial/customer fuel and every native supply,opening/closing stock,use,resource intake,water/bilge/ballast/material transfer,waste custody/treatment and actual species release. Preserve fossil/biogenic carbon and real receiving media;no whole-stock emission assumption. Internal transfer has one owner and is not duplicate purchase/release. |  |\n| life_provider_sites | operated_inland_passenger_vessel_hire | Every vessel/assembly/shore/provider lifecycle cell,shared consumer/function,unit/site/reporting period and failure/repair/return/substitute path has one owner,positive same-function compatible demand and exact coverage. Resolve mutually exclusive states and every output/handoff. Missing all-user life,provider scope or representativeness blocks completion;payments,nominal capacity and sailing/passenger totals do not prove accepted hire. |  |\n| reference_compatibility_gate | all contributing nodes | Verify reference_compatibility against the recorded actual function, configuration/capacity, accepted H, quality, responsibility, duty and gates before pooling; retain unsupported combinations as separate strata. |  |\n| completed_obligation_cohort_gate | all contributing nodes | Verify completed_obligation_cohort using cut-off status and unique full-cycle event ownership; ongoing duties and unassigned failures cannot be silently divided by completed N, and N=0 has no finite intensity. |  |\n| foreground_expansion_reconciliation_gate | all contributing nodes | Verify foreground_expansion_reconciliation for every mandatory node-owned protocol, concrete child and physical ledger before attribution; unresolved applicability, identity, quantity, fate or provider overlap blocks foreground completion. |  |\n| conditional_range_guardrails_gate | all contributing nodes | Verify conditional_range_guardrails separately from the fixed reference definition; numeric guardrails require independent compatible evidence, a shared basis and reviewed scope, not a self-validating batch or invented universal bounds. |  |\n\n"
