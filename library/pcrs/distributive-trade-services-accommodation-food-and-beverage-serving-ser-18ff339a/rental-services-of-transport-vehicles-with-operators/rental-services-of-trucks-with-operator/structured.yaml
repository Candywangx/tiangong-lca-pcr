    reference: "Shalom Movers, Lorry Rental in Singapore with Driver, accessed 23 October 2026. https://shalom.com.sg/lorry-rental-in-singapore-with-driver/"
    used_for: "Bounded commercial example of actual vehicle/configuration matching, vehicle-plus-driver booking, duration and customer loading versus driver operation. No advertised price, dimension or minimum duration imported as universal rule."
  - id: "spiess-truck-hire"
    type: "literature"
    reference: "SPIESS, Truck Hire with Driver, accessed 23 October 2026. https://spiess.fr/en/truck-hire/"
    used_for: "Bounded commercial example of rigid/tractor/semitrailer bodies, auxiliary equipment, operator and regional/site duty variation; no published fleet list treated as complete or universal."
