allocation_rules:
  - rule_id: direct_first
    applies_to: "operated_truck_hire"
    rule: "Directly attribute event/vehicle/provider/site records to actual hire obligations where possible. For shared native quantity Q_j allocate q_ej = Q_j * d_ej / sum_all_users(d_uj), using an evidenced positive denominator of same-function compatible demand. Availability-capacity-time may be used only where causal; no cargo tonne-km default or tariff allocation."
    source_ids: []
  - rule_id: all_user_life
    applies_to: "operated_truck_hire"
    rule: "Attribute each actual initial asset and every replacement/maintenance/retirement event across its own compatible service life and all real users, including other hires, own operations, standby/support and periods. Collect observed/forecast lifetime demand and uncertainty; no universal life, occupancy or fraction, and no unsupported default whole-asset charge to one engagement."
    source_ids: []
  - rule_id: output_and_reject
    applies_to: "operated_truck_hire"
    rule: "Enumerate all actual independent intended outputs and their handoffs; direct attribution precedes evidenced causal sharing. Record unresolved output/allocation decisions as blockers. Customer cargo is not a produced hire cooutput. Do not credit waste automatically or subtract counterfactual service; retain failed/rejected activity burdens without counting failed output."
    source_ids: []
  - rule_id: runs_and_pools
    applies_to: "operated_truck_hire"
    rule: "Declare engagement/event/continuous fleet reporting mode. Link cleaning/changeover, standby, positioning and replacement events to the originating hire or evidenced shared pool once. Sum attributable native quantities before dividing by coherent accepted engagement count N; do not average unlike capacity, duration, duty or region intensities."
    source_ids: []
