  calculation_rules:
    - id: engagement_count
      applies_to: "reference output"
      rule: "N = count(independently accepted qualifying hire obligations); H > 0. Preserve original/genuinely amended function and gates. No additional N for trip, invoice, shift or replacement."
      inputs:
        - "acceptance and actual available intervals"
      output: "coherent N and qualified H"
      source_ids: []
    - id: native_stock
      applies_to: "consumed product input"
      rule: "U = opening_stock + receipts - closing_stock - returns - outward_transfers. Reconcile actual use/waste; stock balance alone does not prove consumption or release."
      inputs:
        - "compatible native stocks and events"
      output: "native attributable U"
      source_ids: []
    - id: shared_native
      applies_to: "shared native quantity or lifecycle event"
      rule: "q_ej = Q_j * d_ej / sum_all_users(d_uj). Each denominator must be positive and same-function compatible; include every real user/period. Apply initial/replacement/maintenance/retirement and provider cells once. A share of 1 is allowed only when evidence shows that the target hire/cohort accounts for the entire compatible all-user demand of that same asset/event over its relevant life. Reconcile shares across all real users to 1; never default to a whole-asset charge."
      inputs:
        - "actual native Q_j"
        - "evidenced demands and full life/provider coverage"
      output: "attributed native q_ej"
      source_ids: []
    - id: normalize_once
      applies_to: "inventory for coherent hire cohort"
      rule: "q_ref = sum_e(q_e) / N, N > 0. Aggregate only compatible configuration/capacity/time/control/gates/region/duty; retain strata when unlike. Apply reference_compatibility and completed_obligation_cohort before selecting the numerator and N."
      inputs:
        - "attributed native quantities"
        - "coherent N"
      output: "quantity per declared reference flow"
      source_ids: []
    - id: ac_native
      applies_to: "externally supplied AC irrespective of payer or payment"
      rule: "E_MJ = E_kWh * 3.6. Use native Net calorific value support; apply conversion once, with actual gate/loss/provider coverage."
      inputs:
        - "metered compatible AC"
      output: "MJ"
      source_ids: []
    - id: substance_release
      applies_to: "each actual emitted substance"
      rule: "Use actual species-specific mass measurement or evidenced compatible source-consumption method; preserve carbon origin, receiving compartment, retained/transferred/oxidized fractions and uncertainty. No universal factor or whole-stock release."
      inputs:
        - "actual source and fate evidence"
      output: "actual native substance mass"
      source_ids: []
    - id: reference_compatibility
      applies_to: "all actual rows and obligations"
      rule: "Before pooling or comparing per-engagement results, record a compatibility decision for every original obligation. Require the same supplied function, compatible actual configuration and hired capacity or capability with native units, equal accepted availability H for the declared per-engagement reference, equivalent acceptance quality, operating versus commercial responsibilities, delivery/redelivery gates, region and duty. Unit conversions require verified support; tolerance may cover evidenced measurement uncertainty only, not different service functions or durations. Different H, incompatible capacity, control, duty or gates remain separate strata unless a documented physical conversion to one explicitly declared common reference is supported for every affected quantity. Count, price, nominal fleet capacity and a shared CPC code never establish equivalence. Missing facts block pooling; one item remains one real original accepted obligation."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: completed_obligation_cohort
      applies_to: "reference output and linked contributing nodes"
      rule: "Use a declared completed-obligation cohort for this engagement reference. At each reporting cut retain opening ongoing obligations, new obligations, completed accepted obligations, terminal failed/cancelled obligations and closing ongoing obligations with original ids and chronological amendments. Each physical event belongs to its actual obligation and node or one evidenced shared pool. Gather the complete causal service cycle for every obligation entering N, including events before the reporting window; do not divide all calendar-period purchases or ongoing-contract activity by the count completed in that period. Keep ongoing activity with its own obligation for later reconciliation; it is not zero or an accepted fractional item. Failed/cancelled burdens remain separately traceable and enter an accepted cohort only through documented causal pool attribution, never an arbitrary shift to another product or period. Reconcile period and full-obligation ledgers without duplicated events. At N=0 retain burdens and report no finite per-item intensity. A period-based service output requires its own explicit compatible reference and review, not a silent reinterpretation of this Count."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: foreground_expansion_reconciliation
      applies_to: "all actual rows and obligations"
      rule: "For each mandatory expansion protocol keep an applicability register owned by its declared node: occurred, evidenced absent or unresolved. An occurred branch has an exhaustive concrete-child list; each child records unique row id, direction/type, actual identity/state/gate, native property/unit/quantity and method, source/receiver/fate, physical transfer id and protocol, exact provider-covered phase/event/site/period cells and asset all-user lifetime attribution where applicable. An absence decision needs dated source records and a bounded node/period/scope; missing evidence is unresolved. Reconcile actual unallocated material, water, carbon and energy ledgers at compatible stock/transform/receiver gates before burden attribution; allocated quantities are not a substitute for physical balance. Internal transfers have paired native amounts and one custody/event owner, not new external supplies or releases. Do not bind protocol labels or fabricate mixture constituents. Any unresolved actual occurrence, identity, quantity, fate or coverage blocks completion of the concrete foreground package; a PCR contract check alone does not close the register."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
    - id: conditional_range_guardrails
      applies_to: "all actual rows and obligations"
      rule: "The fixed reference output amount is the normalization definition, not an observed yield distribution. For every other actual inventory row collect an independent compatible reference sample or physical/method constraint before applying a numerical QA guardrail. Record row/node, occurrence conditions, configuration, capacity and H stratum, supplier/state/gate, native unit and conversion evidence, sample source and period, method, bounds and uncertainty. Compare like quantities on the same stated basis; a numerator per engagement cannot be compared directly with a per-hour or per-mass bound. Do not use the validation batch own minimum or maximum to validate itself. A missing compatible numerical range is an unresolved evidence need, not zero, an accepted default or proof of abnormality. Do not invent a universal per-hire interval or replace measurements with a provisional estimate. Every required row-level range decision and supporting evidence must be reviewed before promotion; an unresolved range must remain disclosed."
      inputs:
        - cp_acceptance_cohort
        - "actual native records"
      output: "Evidenced compatible cohort, unique attribution and row-level evidence decisions"
      source_ids: []
  data_quality_requirements:
    - id: functional_acceptance
      applies_to: "actual hire output"
      requirement: "Original/amended agreement, actual driver/vehicle availability, hired capacity, positive accepted H, renter direction and operating responsibility must support the same declared service. Missing acceptance or function is a blocker."
      evidence: "cp_hire_acceptance"
    - id: atomic_register
      applies_to: "all mandatory expansions"
      requirement: "Exhaustive node-owned occurrence/absence and concrete-child evidence are required. Actual variable identities are not represented by aggregate protocol names. Child identity/native quantity/support/provider/life/fate gaps block final data."
      evidence: "cp_expand_operating_inputs;cp_expand_vehicle_assets;cp_expand_shared_sites;cp_expand_driver_support;cp_expand_contracted_operations;cp_expand_collected_wastes;cp_expand_substance_releases;cp_expand_resource_intakes;cp_expand_cooutputs_transfers"
    - id: life_and_provider
      applies_to: "all shared assets and services"
      requirement: "All-user lifetime demand covers hires, own operation, concurrent users, standby/support, maintenance and reporting periods. Initial/replacement/maintenance/retirement and provider-covered cells have unique owners; uncertain forecasts require sensitivity and no guessed lifetime."
      evidence: "cp_expand_vehicle_assets;cp_expand_shared_sites;cp_expand_contracted_operations"
    - id: site_and_mode
      applies_to: "fleet/site/reporting cohort"
      requirement: "List every contributing vehicle, driver, depot, road/support site and provider with native records linked to common boundary. Declare event/continuous mode and actual weights; no unweighted mean of unlike hire intensities or omitted site."
      evidence: "cp_hire_acceptance;cp_native_supply;cp_expand_shared_sites"
    - id: native_fates
      applies_to: "supplies, wastes and releases"
      requirement: "Calibrated native records, compatible actual grade/state, source and receiving media, actual species basis and downstream treatment evidence are required. Preserve missingness, uncertainty and exclusions; no density, emission, manpower or recovery defaults."
      evidence: "cp_native_supply;cp_generated_oil;cp_co2_release"
    - id: cohort_and_evidence_gate
      applies_to: "all contributing nodes"
      requirement: "Obligation compatibility, cross-period states, actual children and independent range evidence must be traceable. Unknown facts are not zero; ongoing obligations cannot be mixed into a completed cohort."
      evidence: "cp_acceptance_cohort"
validation_rules:
  - rule_id: scope_reference
    applies_to: "operated_truck_hire"
    rule: "Verify actual operated-hire substance, positive actual accepted H and every reference qualifier. No bare-rental, operator-only, manufacture or consignment-carriage substitution; no positive-load/distance condition. N must count independent accepted obligations, not payments, shifts, trips or replacements."
    source_ids: []
  - rule_id: native_identity
    applies_to: "operated_truck_hire"
    rule: "Every actual exchange requires one compatible verified concrete UUID, native property/unit/quantity/gate, source/provider and uncertainty. Conditional fixed cards require compatible actual occurrence; incompatible identities require separate children. Missing data is unknown, never zero."
    source_ids: []
  - rule_id: atomic_completion
    applies_to: "operated_truck_hire"
    rule: "All mandatory cp_expand_ protocols require exhaustive occurrence or evidenced absence and concrete child registers. Each actual child needs unique row id, direction/type, identity/state/gate, verified UUID/support, native quantity, source/receiver/fate, provider/life/all-user ownership and nonduplication evidence. Any unresolved actual scope, identity, quantity, fate or ownership blocks final foreground data completion and downstream publication; requirements are not completed exchanges."
    source_ids: []
  - rule_id: coverage_and_balance
    applies_to: "operated_truck_hire"
    rule: "Reconcile native meters, opening/closing stock, purchases, use, transfers and waste; retain actual carbon source/species/medium. Every shared asset/provider cell, run/site/user/lifecycle period and failure/replacement path has one owner, evidenced compatible denominator and no overlap. Incomplete lifetime, representativeness or boundary coverage is a blocker."
    source_ids: []
  - rule_id: route_acceptance
    applies_to: "operated_truck_hire"
    rule: "Resolve actual mutually exclusive configurations, accepted versus rejected/unavailable periods, continuous/event pools and every intended output/handoff. An invoice title, fee, nominal fleet capacity or advertised duration is not physical acceptance evidence; fleet/site aggregation needs compatible function and justified weights."
    source_ids: []
  - rule_id: reference_compatibility_gate
    applies_to: "all contributing nodes"
    rule: "Verify reference_compatibility against the recorded actual function, configuration/capacity, accepted H, quality, responsibility, duty and gates before pooling; retain unsupported combinations as separate strata."
    source_ids: []
  - rule_id: completed_obligation_cohort_gate
    applies_to: "all contributing nodes"
    rule: "Verify completed_obligation_cohort using cut-off status and unique full-cycle event ownership; ongoing duties and unassigned failures cannot be silently divided by completed N, and N=0 has no finite intensity."
    source_ids: []
  - rule_id: foreground_expansion_reconciliation_gate
    applies_to: "all contributing nodes"
    rule: "Verify foreground_expansion_reconciliation for every mandatory node-owned protocol, concrete child and physical ledger before attribution; unresolved applicability, identity, quantity, fate or provider overlap blocks foreground completion."
    source_ids: []
  - rule_id: conditional_range_guardrails_gate
    applies_to: "all contributing nodes"
    rule: "Verify conditional_range_guardrails separately from the fixed reference definition; numeric guardrails require independent compatible evidence, a shared basis and reviewed scope, not a self-validating batch or invented universal bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified operated truck and other motorized freight vehicle hire inventory for process and lifecyclemodel use."
  allowed_use: "Actual independent accepted obligations with harmonized configuration/capacity/time/control/gates/region/duty and complete atomic/native/lifecycle/provider review."
  excluded_use: "Unqualified engagement count; carriage, bare rental, operator-only or manufacture substitution; customer-paid fuel as free; unresolved expansion as zero; mandatory positive distance/load."
  required_metadata: "Actual engagement id and original/amended obligation; truck or other motorized freight vehicle identity; configuration and hired capacity with native units; positive actual accepted availability time H; reporting period; driver/provider operating responsibility; renter direction/control; availability/quality/acceptance and replacement conditions; delivery and return gates; service region and duty; actual standby/positioning/failure/replacement; all-user asset life and native provider coverage; compatibility_decision; completed_obligation_cohort; row_range_evidence_status"
  required_quality_disclosure: "Actual original/amended hire scope and acceptance; failures/replacement/standby; native supplies and payer-independent boundary; all-user/provider/life coverage; actual identity/data/fate gaps and uncertainty."
  update_trigger: "Changed actual function, configuration, capacity, accepted availability/control/gates, region/duty, native energy/material, provider/life/allocation or actual release/waste fate."
