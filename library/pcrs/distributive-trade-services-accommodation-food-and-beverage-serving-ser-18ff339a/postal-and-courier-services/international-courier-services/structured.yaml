    - protocol_id: cp_support_origin_road
      process_id: "support_origin_road"
      flow_role: "u_origin_road_diesel; u_origin_road_petrol; u_origin_road_electricity; u_origin_road_road_vehicle_manufacture; u_origin_road_road_vehicle_terminal; u_origin_road_road_section_manufacture; u_origin_road_road_section_terminal; u_origin_road_replacement_tyre; u_origin_road_removed_tyre; u_origin_road_lubricant; u_origin_road_used_lubricant; u_origin_road_co2_fossil_air; u_origin_road_co_air; u_origin_road_no_air; u_origin_road_no2_air; u_origin_road_so2_air"
      record_type: "physical_exchange_and_asset_register"
      raw_fields: "event/asset/site/provider/configuration; exact product/substance; phase; Q_x,j and native unit; source intensity and activity basis; lifetime activity and f; terminal asset link and residual unit; stock and transfer IDs; original waste event/cohort; meter/calibration; all-user driver; overlap ownership; prospective route version; occurrence evidence; species identity/CAS, T and NO2-equivalent definition, source-matched molar a, molecular-mass provenance, direct species mass/factor and calibration; maintenance_year; timezone; asset_id; installed/consumed M_x,y; generated residual kg; all_user_driver_y; cohort_attributed_driver_y; causal_event/task; unused inventory/returns/transfers; road traction versus non-traction submeter; battery and meter IDs; inlet AC kWh; configuration/temperature/age-calibrated curve; opening/closing AC-equivalent stock; provenance of charged imports/exports; session gross additions and verified direct zero-addition AC; all-user leg/stop shares; cohort attribution and remaining beneficiaries; non-traction meter ID/scope, supply/voltage, direct task records, matched all-user road service/handling minutes and overlap crosswalk"
      collection_method: "Collect only active foreground physical components under foreground_interface_method; external services use cp_interface_ protocols. Independent origin road segment operation; actual contracted vehicle, energy, direct emissions, capital, maintenance, empty positioning and end-of-life, excluding air/terminal modules already owned elsewhere. Retain the service activity only in raw records and allocation; do not create a replacement activity exchange. For each physical supplier row j and matched period p, q_j = sum(X_j,p * alpha_cohort,p) / final_denominator, with calibration and all beneficiaries in alpha. If source activity is already per reference flow, first recover its original raw total and denominator; apply the matched per-activity physical intensity, attribution and original final denominator only once. All real losses, failed tasks and empty/standby capacity stay in their fixed pools. Capital and terminal residuals use the same f; no default asset mass/life or intensity. Preserve segment/waybill IDs, gross-cargo mass-distance and the current evidenced capacity constraint and empty-travel rules. Remove overlap from through-carriage before allocation; q is per Q. At each provider/source gate, collect event/asset/site/route/configuration and exact physical identity, condition of occurrence/non-occurrence, direction/type/receiving medium, raw quantity and unit, meter/tare/calibration, timestamps and timezone, complete accounting interval, source unit-inventory basis, all-user activity and cohort joins, manufacturing/installation/use/maintenance/EOL phase, original/remaining asset fractions, paired terminal residual provenance, stocks/transfers, receiver/fate and prospective-model revisions. Retain signed supplier scope and exact overlap crosswalk to existing direct rows. Obtain chemistry/BOM/species identity before adding a missing concrete row; an unbound candidate can await official identity but cannot be a plural collection. Measure all events, reconcile per local month/maintenance year as prescribed and review the complete asset/supplier inventory annually and at configuration/retirement changes. Unmeasured positive activity, unsupported future treatment or an unlisted actual exchange prevents completeness. Apply allocation_provider_maintenance_period and calc_provider_maintenance_period to this provider actual routine/causal maintenance; no whole-cohort distance in each year. Use calc_contracted_road_ac for traction. Never apply the battery formula to stationary premises AC; assign that AC from its separate measured ledger under its physical driver. Measure non-traction in its own ledger under calc_contracted_road_ac, then use its q_card or the distinct supply row as applicable."
      unit: "card-native units; raw t*km"
      frequency: "every event; local-month/maintenance-year reconciliation; annual/asset-change review"
      temporal_coverage: "full original acceptance cohort and failure/return tail, matched asset life and eventual waste evidence"
      site_scope: "same provider/site/configuration scope; all shared users"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated originals; signed scope and overlap map; asset/receipt lineage; uncertainty"
