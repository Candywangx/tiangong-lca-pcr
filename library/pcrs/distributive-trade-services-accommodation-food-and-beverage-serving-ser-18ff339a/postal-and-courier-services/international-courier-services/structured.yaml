      applies_to: "u_air_linehaul_runway_manufacture; u_air_linehaul_runway_terminal"
      rule: "Foreground physical branch only under foreground_interface_method; service quantities use their interface rule. Component of capital_air_linehaul_runway_manufacture. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators. Passenger/freight and within-leg freight shares must come from calc_air_payload_allocation; its primary mass method, zero-freight/empty branches and preallocated-data acceptance rules govern this row without another allocation choice."
      inputs:
        - cp_support_air_linehaul
        - cp_transport
        - a_transport
        - cp_cohort
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: dq_occurrence
      applies_to: "all conditional cards"
      requirement: "Confirm occurrence from dated purchase/operating/transfer and no-event records at every site. Mark not_applicable only when actual absence is demonstrated and signed; an absent UUID, invoice or missing meter never proves zero. Unknown occurrence or amount remains incomplete and blocks final conformance."
      evidence: "signed applicability and records coverage matrix"
    - id: quality_waste_origin
      applies_to: "paper_waste; carton_waste; residual_waste"
      requirement: "For every ordinary solid-waste stream verify generation responsibility, original cohort/stratum/denominator, origin-labelled stock balance, supported actual or prospective complete treatment and later-receipt replacement. Unknown origin/fate/physical loss remains an explicit gap; future dispatch alone cannot close or reassign it. Keep wastewater and amortized terminal-asset treatment on their separate methods."
      evidence: "generation/stock/transfer ledgers; supported route models; original-cohort receipt replacements"
    - id: dq_identity
      applies_to: "all inventory and reference identities"
      requirement: "Blank UUIDs are explicit semantic candidates, not validated bindings. Before database-ready use, verify exact official flow, type, state, property/unit and waste receiving route from direct official responses with hash-bound receipts; compare exact official Chinese names. Historical electricity identity observation does not establish current supply technology, current database status or methodological approval."
      evidence: "direct-response identity receipts; support-record chain; unresolved list"
    - id: dq_supplier
      applies_to: "all upstream services"
      requirement: "Obtain physical service units and primary inventory coverage, not spend-only or CO2e-only figures. Match each mode/leg, handling, storage and building service to its recorded provider boundary and explicit missing categories. Complete LCA use needs all relevant elementary species and receiving media in upstream inventories; a GHG transport guide alone cannot establish that."
      evidence: "supplier inventory/boundary matrix; actual activity; gap register"
    - id: dq_uncertainty
      applies_to: "measurements and conversion"
      requirement: "Retain raw values, unit, timestamp, calibration, source document and responsible collector; reconcile to invoices, meters, task times and transfers. Report measured/estimated/missing separately, method and uncertainty; test dominant load, passenger/freight allocation, volume constraint and lifetime assumptions. No invented default factors, zero fill, generic ranges or compliance limits."
      evidence: "calibration/estimation records; reconciliation; sensitivity results"
    - id: dq_air_nonco2
      applies_to: "activity_air_linehaul"
      requirement: "Report climate characterization method and whether aviation non-CO2 effects (including contrails and altitude effects) are covered, excluded or uncertain; disclose this limitation separately from physical fuel/emission inventory. Do not multiply CO2 or CO2e by a default uplift or claim comprehensive aviation climate coverage from a cargo activity or GHG-only factor."
      evidence: "method version; aviation scope disclosure; sensitivity where supported"
    - id: dq_bilingual
      applies_to: "both language renderings and projection"
      requirement: "Audit every card identity/direction/type/unit/formula/condition, qualifier and normative requirement in both languages; retain the same rule IDs, row IDs, protocol ownership and source links. Regenerate structured from English and compare actual projected meaning; a fingerprint alone is insufficient."
      evidence: "bilingual semantic review; projection readback"
    - id: quality_atomic_completeness
      applies_to: "all disaggregated support and species"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "scope-to-physical-row reconciliation; supplier/BOM/species originals; signed gap register"
