      rule: "q_hardware = laptop_netkg*cohort_useh/lifetime_useh/Q; q_eol = M_EOL*cohort_useh/lifetime_useh/Q. M_EOL is observed retired residual kg or explicitly prospective residual kg from measured current asset net mass, documented reuse/retention/removal and receiver plan with uncertainty; no retirement is not zero. Keep actual regulatory waste transfers separate and reconcile them to M_EOL without adding the same mass twice. q_occupancy = occupied_m2*occupied_days/days_in_year*cohort_taskshare/Q; split calendar years when needed. Its upstream common operational pools use measured whole-building/zone totals minus same-scope/period direct-card quantities, allocated by beneficiary occupied area*time before cohort allocation. Only the explicitly named activity_* terms are raw supporting-activity diagnostics, never product exchanges; retained physical product/waste terms keep their original quantities, units and exchange role. Apply the separate physical-disaggregation rules only to the removed service terms. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
