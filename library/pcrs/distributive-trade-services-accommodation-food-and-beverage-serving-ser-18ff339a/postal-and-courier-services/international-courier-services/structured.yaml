      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_scope | dataset | Verify non-USO custody at an origin and completed delivery in a different country under one contracting provider; all actual routes match the declared ambient outsourced air/road/office scope. Domestic-only, USO and leg-only data fail this PCR. | `un-cpc3-68022` |\n| validate_service_interfaces | svc_origin_road; svc_destination_road; svc_air_linehaul; svc_origin_handling; svc_destination_handling; svc_customs_brokerage; svc_bonded_storage; svc_office_occupancy; svc_hosted_tracking | Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance. |  |\n| v_cohort | delivered_service | Require Q > 0, exclusive final outcome closure, pending = 0, consistent fixed piece lists and all failures/returns/reattempts in numerator; count Q once. Incomplete customs holds cannot be deleted or declared zero. | `dhl-carriage-2024` |\n| v_inventory | inventory | Require unique activity ownership and supplier coverage, complete physical units/calculations, matched collection records, documented allocation and all actual atomic exchanges. Reject double-counted transport energy/assets/terminal work, unowned waste treatment, unresolved numerical conversions or unexplained missing quantities. Test A-period generated retained waste and B-period dispatch: original A responsibility and denominator persist, and actual evidence replaces that same event model without another B burden. | `ghg-product-2011` |\n| v_identity | database-ready implementation | An authored candidate with unresolved identities is not publish-ready. Resolve every applicable flow/property/unit identity against official evidence, retain excluded/not-applicable decisions, and report remaining gaps without claiming verified database completeness or scientific approval. |  |\n| v_language | source and guidance | Require aligned bilingual reference basis, boundaries, all applicable inventory cards, all collection/calculation/quality rules, row/protocol links and source coverage in actual generated guidance; preserve candidate lifecycle until independent review. |  |\n| validate_air_payload_allocation | all mixed/freighter/empty legs | Verify C/P/M_c, same-leg basis, all beneficiaries, load-estimation evidence and zero-freight/empty causal branches under calc_air_payload_allocation. Recompute primary w and preallocated-data deduplication. Unsupported passenger mass, a different primary algorithm or repeated p_freight blocks completion. |  |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_atomic_support | all support and emission rows | Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance. |  |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_capital_restatement | computer_hardware; computer_waste; u_origin_road_road_vehicle_manufacture; u_origin_road_road_section_manufacture; u_origin_road_road_vehicle_terminal; u_origin_road_road_section_terminal; u_destination_road_road_vehicle_manufacture; u_destination_road_road_section_manufacture; u_destination_road_road_vehicle_terminal; u_destination_road_road_section_terminal; u_air_linehaul_aircraft_manufacture; u_air_linehaul_runway_manufacture; u_air_linehaul_aircraft_terminal; u_air_linehaul_runway_terminal; u_origin_handling_terminal_building_manufacture; u_origin_handling_conveyor_manufacture; u_origin_handling_screening_unit_manufacture; u_origin_handling_forklift_manufacture; u_origin_handling_terminal_building_terminal; u_origin_handling_conveyor_terminal; u_origin_handling_screening_unit_terminal; u_origin_handling_forklift_terminal; u_destination_handling_terminal_building_manufacture; u_destination_handling_conveyor_manufacture; u_destination_handling_screening_unit_manufacture; u_destination_handling_forklift_manufacture; u_destination_handling_terminal_building_terminal; u_destination_handling_conveyor_terminal; u_destination_handling_screening_unit_terminal; u_destination_handling_forklift_terminal; u_customs_brokerage_broker_computer_manufacture; u_customs_brokerage_broker_network_manufacture; u_customs_brokerage_broker_office_manufacture; u_customs_brokerage_broker_computer_terminal; u_customs_brokerage_broker_network_terminal; u_customs_brokerage_broker_office_terminal; u_bonded_storage_warehouse_manufacture; u_bonded_storage_storage_rack_manufacture; u_bonded_storage_storage_forklift_manufacture; u_bonded_storage_warehouse_terminal; u_bonded_storage_storage_rack_terminal; u_bonded_storage_storage_forklift_terminal; u_office_occupancy_office_building_manufacture; u_office_occupancy_hvac_plant_manufacture; u_office_occupancy_office_building_terminal; u_office_occupancy_hvac_plant_terminal; u_hosted_tracking_server_manufacture; u_hosted_tracking_storage_unit_manufacture; u_hosted_tracking_network_switch_manufacture; u_hosted_tracking_datacentre_manufacture; u_hosted_tracking_cooling_plant_manufacture; u_hosted_tracking_server_terminal; u_hosted_tracking_storage_unit_terminal; u_hosted_tracking_network_switch_terminal; u_hosted_tracking_datacentre_terminal; u_hosted_tracking_cooling_plant_terminal | Check original cohorts/denominators, all-user driver, source versions, booked amounts and restatement corrections under calc_capital_restatement. Reject frozen old history with only future-denominator changes, retirement-balance transfer to unrelated current output, and negative physical exchanges. |  |\n\n"
