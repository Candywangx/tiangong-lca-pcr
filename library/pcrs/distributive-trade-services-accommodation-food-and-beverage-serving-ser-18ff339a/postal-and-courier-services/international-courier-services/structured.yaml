      raw_fields: "waste_id; material; netkg; moisture basis; sewer meter/estimate basis; generation/transfer date; stock; source asset; actual retirement/retention/reuse; observed retired residual or prospective M_EOL kg and derivation/evidence; receiver plan/route; composition; treatment included; task/lifetime share; actual-transfer versus prospective contribution flag; generation_event_id; generation_time/site; source task/cohort/stratum; original allocation shares/reference denominator; generated mass and wet/dry/composition basis; opening/closing stock by origin; internal transfer IDs and both endpoints; external dispatch; evidenced physical loss/release; receiver and destination fractions; actual/prospective route and model version; evidence/uncertainty; receipt replacement status and revision chain"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Weigh each segregated transfer with tare and receiver receipt; inspect residual composition; meter wastewater or reconcile metered inflow minus independently measured non-sewer uses; read asset retirement ledger. Aggregation detail: Measure segregated generated mass at the generating point and record the responsible task/interval before storage; if generation is reconstructed from a complete stock balance, document all transfers, losses and measurement uncertainty and preserve original event provenance. Apply allocation_waste_origin and calc_waste_origin. At each transfer and period close reconcile origin-labelled stocks against calibration and receiver evidence. Require supported storage/transport/treatment coverage for retained mass; later receipts replace the original event model, never create a second dispatch-period burden. For laptop lifecycle end-of-life use M_EOL*cohort_useh/lifetime_useh/Q, with M_EOL observed retired residual kg or explicitly prospective residual kg evidenced from measured asset mass and documented reuse/retention/removal and receiver plan. Keep the regulatory actual-transfer ledger separate from this normalized/prospective lifecycle contribution; reconcile on retirement and never add the same transfer again. Keep nonhazardous mixed residual as one measured receiver stream, not a list of unlike flows."
      unit: "kg; h"
      frequency: "each transfer; monthly stock/sewer balance; every ordinary-waste generation and monthly origin-stock reconciliation"
