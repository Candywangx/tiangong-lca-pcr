    - id: capital_air_linehaul_runway_manufacture_lifetime_quantities
      applies_to: "u_air_linehaul_runway_manufacture; u_air_linehaul_runway_terminal"
      rule: "Foreground physical branch only under foreground_interface_method; service quantities use their interface rule. Component of capital_air_linehaul_runway_manufacture. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. f_c,a=sum(V_e*w_e)/sum_all_life(V_e); denominator uses all users, the same life boundary and unit. Actual use bears idle construction capacity; do not drop it. Do not multiply the passenger/freight share again. q_build=sum(Q_a*f_c,a)/Q and q_EOL=sum(R_net,a*f_c,a)/Q, using terminal net kg without repeating historical deductions. Preserve the same asset, configuration and evidenced life; an allocated intensity must reproduce this closure, otherwise missing runway/weight evidence blocks completion. Remove exact construction, upkeep and terminal overlap with flight/handling inventories. Attribute maintenance as actual events, not a second lifetime fraction."
