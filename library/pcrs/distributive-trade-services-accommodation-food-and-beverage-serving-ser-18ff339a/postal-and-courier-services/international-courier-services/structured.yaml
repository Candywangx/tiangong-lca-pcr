        - cp_interface_destination_road
        - cp_interface_air_linehaul
        - cp_interface_origin_handling
        - cp_interface_destination_handling
        - cp_interface_customs_brokerage
        - cp_interface_bonded_storage
        - cp_interface_office_occupancy
        - cp_interface_hosted_tracking
      output: "native service units per original reference flow"
      source_ids: []
