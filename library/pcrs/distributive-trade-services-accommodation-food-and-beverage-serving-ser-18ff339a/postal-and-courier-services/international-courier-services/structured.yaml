      rule: "Component of calc_air_payload_allocation. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. This PCR selects transported payload mass as its primary physical allocation method for each unique flight leg; this is an authored candidate method, not a claim that mass exactly causes all fuel or that the cited general guidance prescribes this passenger formula. C is all freight/mail gross consignment mass including shipment packaging, across all beneficiaries; P is all carried passengers (including non-revenue passengers) plus all their carried/checked baggage. C and P are nonoverlapping kg for that leg. Exclude operating crew, aircraft/fuel and aircraft-owned reusable ULD/trolleys from payload; their burdens remain in the flight inventory. Establish C from calibrated manifest/load records, and P from a matched aggregate weighing or a documented carrier load-sheet estimate based on a validated, applicable passenger-and-baggage mass survey and actual counts/baggage records. Retain survey population, date, separate body/baggage coverage, uncertainty and applicability; do not invent a universal passenger kg or substitute ticket revenue, seats or chargeable volume for this primary mass basis."
