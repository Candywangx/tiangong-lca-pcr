      raw_fields: "asset_id; laptop netkg; acquisition/repair; actual/expected lifetime useh basis; cohort useh; retirement status; observed retired residual netkg or prospective M_EOL evidence; reuse/retention/receiver plan; occupiedm2; dates; whole-building/zone utility/cleaning/maintenance totals; all beneficiary tenant/zone direct meter quantity/period/scope overlaps; beneficiary area*time; supplier occupancy/HVAC scope; task share"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Measure net laptop configuration on calibrated balance and floor area from measured plan; inspect asset history, utilization logs and occupancy contract at opening and each change; update life estimate with recorded usage and replacements. Aggregation detail: Hardware = netkg*cohort_useh/lifetime_useh/Q; occupancy = m2*actual occupied year fraction*cohort task share/Q. Occupancy upstream operations = measured whole-building/zone utilities, cleaning and maintenance less quantities assigned to direct office cards in the identical period/scope; allocate the residual to this office by its occupied area*time divided by all beneficiary occupied area*time before office cohort allocation. Retain unmetered-central scope rather than assigning zero. No duplicated hardware inside building service; repairs require actual separate component identity or verified included coverage. For asset end-of-life define M_EOL in kg as observed retired residual mass or an explicitly prospective residual mass from measured current net mass and documented expected reuse/retention/removal, receiver route and uncertainty; absence of retirement never sets M_EOL to zero."
