product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.postal-and-courier-services.international-courier-services"
  classification_refs: "CPC 3.0 68022; narrower"
  covered_products: "Non-USO international courier delivery of ambient, non-dangerous documents or parcels under one end-to-end responsibility contract; contracted road collection/delivery and air cargo linehaul; all physical handling outsourced."
  excluded_products: "USO letters/parcels (68011/68012); domestic courier 68021; stand-alone freight legs, brokerage, intermediation and counter-only services; sea/rail-only routes, owned transport/hubs, controlled-temperature or dangerous goods, oversized cargo; manufacture/use of the customer goods."
  representative_product: "One addressed parcel accepted at an origin in country A and delivered with admissible proof at a consignee address in country B; A differs from B."
  production_route: "Contracting courier controls acceptance, routing, tracking and delivery obligations; buys road freight, air freight, terminal handling, customs brokerage and storage as individually bounded services. Own administration is an all-electric office; equipment, occupancy, utilities and waste are inventoried."
  market_state: "Qualified completed courier delivery; no default delivery time, mass, size, country pair or return rate."
functional_unit:
  what: "Complete international courier delivery, including collection, border crossing and final delivery under one responsible provider."
  how_much: "1 qualified delivered consignment; one consignment is one accepted waybill with a fixed piece list, not one package piece or one transport leg."
  how_well: "Origin/destination countries, address gates, piece count, actual gross mass and dimensions, ambient condition, contents class, contract service promise and evidence of delivery/condition must be declared. Only complete contract-compliant deliveries are qualified."
  how_long_or_cycle: "Acceptance cohort with all accepted waybills followed through final delivery, return, loss or disposal; no open/pending waybill in the final denominator. Contract duration and actual elapsed times are reported separately."
  reference_flow_link: "delivered_service"
system_boundary:
  rules:
    - rule_id: b_end_to_end
      applies_to: "all waybills"
      rule: "Start at recorded possession acceptance at the origin address; include pickup, every air and road connection, origin/destination/transit hubs, security inspection, applicable export/transit/import clearance, border storage, delivery attempts and final contractual delivery evidence. A border-crossing leg alone never meets the reference function."
      source_ids:
        - un-cpc3-68022
        - dhl-carriage-2024
    - rule_id: b_failure
      applies_to: "cohort"
      rule: "Include actual rejected-after-acceptance, customs-held, damaged, returned, lost and disposed consignments and all redelivery/return legs in the same cohort numerator; exclude them from Q unless ultimately qualified. Rejection before custody is outside acceptance cohort; its office acceptance effort is allocated overhead, and any actual carrier custody/transport triggers accepted status. Pending cases block final qualification."
      source_ids:
        - dhl-carriage-2024
    - rule_id: b_services
      applies_to: "all purchased services"
      rule: "Road and air services include their own fuel/energy supply, combustion species, vehicle/aircraft manufacture and maintenance, load-factor allocation and allocated empty repositioning. Handling includes screening, loading/unloading, terminal energy/equipment and terminal waste; storage includes its own space, utilities, equipment and waste. Supplier contracts and inventory must identify each inclusion. Do not add these burdens again as direct courier fuel, airport activity, assets or emissions. Missing provider inventory coverage is incomplete data, not zero."
      source_ids:
        - ghg-transport-2013
    - rule_id: b_partition
      applies_to: "segments and subcontractors"
      rule: "Keep a unique service ledger keyed by waybill, segment/event, country/site, provider and time. Each physical activity has exactly one inventory owner; airport handling, brokerage and storage supporting physical processes cover only work outside transport/handling providers already included. A through-air service covering road feeder or terminal work requires removal of that overlap before use; a whole international courier service cannot also be a leg input."
      source_ids:
        - ghg-product-2011
    - rule_id: b_goods
      applies_to: "contents and packaging"
      rule: "Customer goods and their original packaging enter custody as tracked cargo, not purchases of the courier; their manufacture and use are excluded but their actual gross mass affects transport. Courier-added corrugated cartons and paper labels are inventoried separately. Returned customer goods remain customer stock, not co-products; disposal requires measured material-specific waste and downstream treatment, never an invented replacement-goods credit."
      source_ids:
        - dhl-carriage-2024
    - rule_id: b_digital
      applies_to: "activity_hosted_tracking"
      rule: "Include booking, customs-document exchange, tracking, dispatch and proof/claims data operation through measured hosted application activity; do not confuse server-instance h, staff h and shipment Item(s). Supplier networks/access coverage must end at a stated demarcation; any uncovered courier network equipment or telecom activity needs a separate atomic exchange before completion."
      source_ids:
        - ghg-product-2011
    - rule_id: b_office
      applies_to: "own administration"
      rule: "Include office electricity, water, wastewater, paper, allocated laptop hardware, building occupancy, maintenance and end-of-life. Occupancy service includes building construction, fabric maintenance, HVAC plant and its refrigerant lifecycle, plus central HVAC, common lighting, cleaning and other building operations not covered by direct office cards. Exclude only the exact same utility quantity, period and physical scope already counted in the direct office meters/cards, together with separately counted laptops and direct office waste. Obtain whole-building/zone utility and cleaning/maintenance records by billing period; subtract reconciled directly assigned quantities for all beneficiary tenants/zones (not only this courier), allocate the residual common operational pool by occupied floor-area*time across all benefited tenants/zones, and retain the resulting utilities/materials/waste in the upstream occupancy inventory once. Missing central/shared operational records block completeness. No owned transport/hub, onsite fuel, dedicated refrigeration or generator is in this route; actual occurrence makes this route inapplicable unless the methodology is formally extended with separate atomic rows and protocols."
      source_ids:
        - ghg-product-2011
    - rule_id: b_unlisted
      applies_to: "completeness"
      rule: "Apply the following concrete-row requirement to actual foreground components; an external service and compatible background evidence may cover its provider-internal components under foreground_interface_coverage without new foreground rows. At each site/provider reconcile actual purchasing, waste transfers, maintenance and services against the inventory. An unlisted actual material (including label adhesive/liner/ink), asset, cleaning chemical or disposed customer-content waste must receive a separate physically specific row, mass/energy/time/activity unit, linked collection protocol and the same Q denominator before completion; do not merge it into paper or residual waste by name. Service coverage evidence may locate it in an upstream supplier once, never waive it."
      source_ids:
        - ghg-product-2011
    - rule_id: boundary_atomic_support
      applies_to: "supporting activities"
      rule: "Each active exchange represents one defined material, equipment or service object with one primary property and unit. A service is not disallowed merely because it has upstream processes. Fix responsibility by provider, contract, site, event, gate and scope component before quantification. Operator-run processes and separately commissioned onsite tasks under operator inventory responsibility use foreground physical rows. Independently provided activities outside that responsibility use their specified service-interface rows; supplier manufacture, utilities, maintenance and waste remain in the matched background service, not extra foreground exchanges. A contract alone does not turn supplier internals into foreground. Do not change the product, route, custody gates or original reference denominator. Apply foreground_interface_method and foreground_interface_coverage; boundary changes need PCR review, not a data-availability choice. Ownership here means inventory responsibility, not legal title alone: rented equipment provision may be an external service while separately metered operator-run electricity remains foreground."
      source_ids: []
    - rule_id: foreground_interface_coverage
      applies_to: "all support processes and overlaps"
      rule: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
      source_ids: []
