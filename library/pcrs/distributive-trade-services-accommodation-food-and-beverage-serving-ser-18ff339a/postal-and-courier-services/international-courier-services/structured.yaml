      applies_to: "u_air_linehaul_aviation_kerosene; u_air_linehaul_electricity; u_air_linehaul_aircraft_manufacture; u_air_linehaul_runway_manufacture; u_air_linehaul_engine_oil; u_air_linehaul_aircraft_terminal; u_air_linehaul_runway_terminal; u_air_linehaul_used_engine_oil; u_air_linehaul_co2_fossil_air; u_air_linehaul_co_air; u_air_linehaul_no_air; u_air_linehaul_no2_air; u_air_linehaul_so2_air"
      requirement: "Independent cargo flight operation, including matched aircraft/engine manufacture, flight/taxi/APU energy, maintenance, airport support, empty movement and end-of-life; preserve actual through-service exclusions."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_occupancy_driver
      applies_to: "u_air_linehaul_runway_manufacture; u_origin_handling_terminal_building_manufacture; u_destination_handling_terminal_building_manufacture; u_customs_brokerage_broker_office_manufacture; u_bonded_storage_warehouse_manufacture; u_office_occupancy_office_building_manufacture; u_hosted_tracking_datacentre_manufacture"
      requirement: "f = cohort-attributable occupied area*time / evidenced complete-life occupied area*time of ALL beneficiaries in the same actual configuration. Complete-life used occupancy bears vacancy; prospective life needs records and uncertainty, not a default. Repairs are actual maintenance-period physical events, not capital f repeated annually."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_origin_terminal_scope
      applies_to: "u_origin_handling_electricity; u_origin_handling_water; u_origin_handling_terminal_building_manufacture; u_origin_handling_conveyor_manufacture; u_origin_handling_screening_unit_manufacture; u_origin_handling_forklift_manufacture; u_origin_handling_wastewater; u_origin_handling_terminal_building_terminal; u_origin_handling_conveyor_terminal; u_origin_handling_screening_unit_terminal; u_origin_handling_forklift_terminal"
      requirement: "Independent origin terminal complete-passage execution, with actual screening/unload/sort/load operations and corresponding physical assets and wastes; no duplicated scans or in-cycle dwell."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_active_hours
      applies_to: "u_origin_handling_conveyor_manufacture; u_origin_handling_screening_unit_manufacture; u_origin_handling_forklift_manufacture; u_destination_handling_conveyor_manufacture; u_destination_handling_screening_unit_manufacture; u_destination_handling_forklift_manufacture; u_customs_brokerage_broker_computer_manufacture; u_customs_brokerage_broker_network_manufacture; u_bonded_storage_storage_rack_manufacture; u_bonded_storage_storage_forklift_manufacture; u_office_occupancy_hvac_plant_manufacture"
      requirement: "f = sum(actual physical-asset active/occupied union hours * cohort share of the uniquely linked actual service task) / evidenced complete-life active/occupied union hours of ALL beneficiaries of this same physical asset/configuration. Task links use the the fixed causal/all-beneficiary attribution for the linked service task, not additional copies for scans, simultaneous staff or tasks. All idle/unused-capacity manufacture burden remains in the full asset quantity borne by beneficiary used hours; no fictitious productive hours."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_replacement_attribution
      applies_to: "u_origin_handling_conveyor_manufacture; u_origin_handling_screening_unit_manufacture; u_origin_handling_forklift_manufacture; u_destination_handling_conveyor_manufacture; u_destination_handling_screening_unit_manufacture; u_destination_handling_forklift_manufacture; u_customs_brokerage_broker_computer_manufacture; u_customs_brokerage_broker_network_manufacture; u_bonded_storage_storage_rack_manufacture; u_bonded_storage_storage_forklift_manufacture; u_office_occupancy_hvac_plant_manufacture; u_hosted_tracking_server_manufacture; u_hosted_tracking_storage_unit_manufacture; u_hosted_tracking_network_switch_manufacture; u_hosted_tracking_cooling_plant_manufacture"
      requirement: "Original terminal residual uses exactly this f; actual component replacement events use their matched maintenance-period causal attribution; whole-asset replacements form new independently allocated asset cohorts."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_destination_terminal_scope
      applies_to: "u_destination_handling_electricity; u_destination_handling_water; u_destination_handling_terminal_building_manufacture; u_destination_handling_conveyor_manufacture; u_destination_handling_screening_unit_manufacture; u_destination_handling_forklift_manufacture; u_destination_handling_wastewater; u_destination_handling_terminal_building_terminal; u_destination_handling_conveyor_terminal; u_destination_handling_screening_unit_terminal; u_destination_handling_forklift_terminal"
      requirement: "Independent destination/transit terminal complete-passage execution, with actual screening/unload/sort/load operations and corresponding physical assets and wastes; no duplicated scans or in-cycle dwell."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_customs_scope
      applies_to: "u_customs_brokerage_electricity; u_customs_brokerage_water; u_customs_brokerage_paper; u_customs_brokerage_broker_computer_manufacture; u_customs_brokerage_broker_network_manufacture; u_customs_brokerage_broker_office_manufacture; u_customs_brokerage_wastewater; u_customs_brokerage_paper_waste; u_customs_brokerage_broker_computer_terminal; u_customs_brokerage_broker_network_terminal; u_customs_brokerage_broker_office_terminal"
      requirement: "Independent customs-declaration/inspection-coordination office execution, excluding duties, fines and tasks already in handling."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_bonded_scope
      applies_to: "u_bonded_storage_electricity; u_bonded_storage_water; u_bonded_storage_warehouse_manufacture; u_bonded_storage_storage_rack_manufacture; u_bonded_storage_storage_forklift_manufacture; u_bonded_storage_wastewater; u_bonded_storage_warehouse_terminal; u_bonded_storage_storage_rack_terminal; u_bonded_storage_storage_forklift_terminal"
      requirement: "Independent ambient bonded-stock holding operation outside included terminal dwell, with actual warehouse capital, utilities, handling/cleaning and residual treatment."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_building_scope
      applies_to: "u_office_occupancy_electricity; u_office_occupancy_water; u_office_occupancy_office_building_manufacture; u_office_occupancy_hvac_plant_manufacture; u_office_occupancy_wastewater; u_office_occupancy_office_building_terminal; u_office_occupancy_hvac_plant_terminal"
      requirement: "Independent courier-building support, separating the construction-handover building shell/fittings and manufacture-gate fixed equipment from central operating resources, component maintenance and same-cohort terminal residuals; exclude separately metered courier cards."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_tracking_scope
      applies_to: "u_hosted_tracking_electricity; u_hosted_tracking_water; u_hosted_tracking_server_manufacture; u_hosted_tracking_storage_unit_manufacture; u_hosted_tracking_network_switch_manufacture; u_hosted_tracking_datacentre_manufacture; u_hosted_tracking_cooling_plant_manufacture; u_hosted_tracking_wastewater; u_hosted_tracking_server_terminal; u_hosted_tracking_storage_unit_terminal; u_hosted_tracking_network_switch_terminal; u_hosted_tracking_datacentre_terminal; u_hosted_tracking_cooling_plant_terminal"
      requirement: "Independent configured tracking application execution, physically covering compute/storage/network and hosting site through the declared supplier-to-office access demarcation."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_it_driver
      applies_to: "u_hosted_tracking_server_manufacture; u_hosted_tracking_storage_unit_manufacture; u_hosted_tracking_network_switch_manufacture; u_hosted_tracking_cooling_plant_manufacture"
      requirement: "f = sum(actual physical-asset operating hours * cohort share of matched measured beneficiary resource-time) / evidenced complete-life physical-asset operating hours of ALL beneficiaries of this configuration. Use the same configuration-specific resource-time attribution and all-user standby share already fixed for the old IT service; retained physical apparatus count is multiplied by f, never replaced by hours. Missing provider-to-asset/resource mapping blocks completion; no invented PUE, capacity weights or life."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: v_scope
    applies_to: "dataset"
    rule: "Verify non-USO custody at an origin and completed delivery in a different country under one contracting provider; all actual routes match the declared ambient outsourced air/road/office scope. Domestic-only, USO and leg-only data fail this PCR."
    source_ids:
      - un-cpc3-68022
  - rule_id: validate_service_interfaces
    applies_to: "svc_origin_road; svc_destination_road; svc_air_linehaul; svc_origin_handling; svc_destination_handling; svc_customs_brokerage; svc_bonded_storage; svc_office_occupancy; svc_hosted_tracking"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: v_cohort
    applies_to: "delivered_service"
    rule: "Require Q > 0, exclusive final outcome closure, pending = 0, consistent fixed piece lists and all failures/returns/reattempts in numerator; count Q once. Incomplete customs holds cannot be deleted or declared zero."
    source_ids:
      - dhl-carriage-2024
  - rule_id: v_inventory
    applies_to: "inventory"
    rule: "Require unique activity ownership and supplier coverage, complete physical units/calculations, matched collection records, documented allocation and all actual atomic exchanges. Reject double-counted transport energy/assets/terminal work, unowned waste treatment, unresolved numerical conversions or unexplained missing quantities. Test A-period generated retained waste and B-period dispatch: original A responsibility and denominator persist, and actual evidence replaces that same event model without another B burden."
    source_ids:
      - ghg-product-2011
  - rule_id: v_identity
    applies_to: "database-ready implementation"
    rule: "An authored candidate with unresolved identities is not publish-ready. Resolve every applicable flow/property/unit identity against official evidence, retain excluded/not-applicable decisions, and report remaining gaps without claiming verified database completeness or scientific approval."
    source_ids: []
  - rule_id: v_language
    applies_to: "source and guidance"
    rule: "Require aligned bilingual reference basis, boundaries, all applicable inventory cards, all collection/calculation/quality rules, row/protocol links and source coverage in actual generated guidance; preserve candidate lifecycle until independent review."
    source_ids: []
  - rule_id: validate_air_payload_allocation
    applies_to: "all mixed/freighter/empty legs"
    rule: "Verify C/P/M_c, same-leg basis, all beneficiaries, load-estimation evidence and zero-freight/empty causal branches under calc_air_payload_allocation. Recompute primary w and preallocated-data deduplication. Unsupported passenger mass, a different primary algorithm or repeated p_freight blocks completion."
    source_ids: []
  - rule_id: validate_atomic_support
    applies_to: "all support and emission rows"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_capital_restatement
    applies_to: "computer_hardware; computer_waste; u_origin_road_road_vehicle_manufacture; u_origin_road_road_section_manufacture; u_origin_road_road_vehicle_terminal; u_origin_road_road_section_terminal; u_destination_road_road_vehicle_manufacture; u_destination_road_road_section_manufacture; u_destination_road_road_vehicle_terminal; u_destination_road_road_section_terminal; u_air_linehaul_aircraft_manufacture; u_air_linehaul_runway_manufacture; u_air_linehaul_aircraft_terminal; u_air_linehaul_runway_terminal; u_origin_handling_terminal_building_manufacture; u_origin_handling_conveyor_manufacture; u_origin_handling_screening_unit_manufacture; u_origin_handling_forklift_manufacture; u_origin_handling_terminal_building_terminal; u_origin_handling_conveyor_terminal; u_origin_handling_screening_unit_terminal; u_origin_handling_forklift_terminal; u_destination_handling_terminal_building_manufacture; u_destination_handling_conveyor_manufacture; u_destination_handling_screening_unit_manufacture; u_destination_handling_forklift_manufacture; u_destination_handling_terminal_building_terminal; u_destination_handling_conveyor_terminal; u_destination_handling_screening_unit_terminal; u_destination_handling_forklift_terminal; u_customs_brokerage_broker_computer_manufacture; u_customs_brokerage_broker_network_manufacture; u_customs_brokerage_broker_office_manufacture; u_customs_brokerage_broker_computer_terminal; u_customs_brokerage_broker_network_terminal; u_customs_brokerage_broker_office_terminal; u_bonded_storage_warehouse_manufacture; u_bonded_storage_storage_rack_manufacture; u_bonded_storage_storage_forklift_manufacture; u_bonded_storage_warehouse_terminal; u_bonded_storage_storage_rack_terminal; u_bonded_storage_storage_forklift_terminal; u_office_occupancy_office_building_manufacture; u_office_occupancy_hvac_plant_manufacture; u_office_occupancy_office_building_terminal; u_office_occupancy_hvac_plant_terminal; u_hosted_tracking_server_manufacture; u_hosted_tracking_storage_unit_manufacture; u_hosted_tracking_network_switch_manufacture; u_hosted_tracking_datacentre_manufacture; u_hosted_tracking_cooling_plant_manufacture; u_hosted_tracking_server_terminal; u_hosted_tracking_storage_unit_terminal; u_hosted_tracking_network_switch_terminal; u_hosted_tracking_datacentre_terminal; u_hosted_tracking_cooling_plant_terminal"
    rule: "Check original cohorts/denominators, all-user driver, source versions, booked amounts and restatement corrections under calc_capital_restatement. Reject frozen old history with only future-denominator changes, retirement-balance transfer to unrelated current output, and negative physical exchanges."
