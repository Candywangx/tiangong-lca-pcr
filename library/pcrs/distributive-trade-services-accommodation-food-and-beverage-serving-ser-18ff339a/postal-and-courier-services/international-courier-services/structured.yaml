measurement_rules:
  - id: m_count
    applies_to: "delivered_service"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "Count Q qualified waybills, not piece scans, mass, invoices or transport jobs. Reference output Q/Q = 1; all burdens are cohort totals divided once by Q > 0."
  - id: m_transport
    applies_to: "activity_origin_road; activity_air_linehaul; activity_destination_road"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: ""
    required_unit: "t*km"
    rule: "For every actual segment use measured gross consignment cargo mass including packaging in kg divided by 1000, multiplied by actual segment km; sum loaded segments and allocate upstream empty movements explicitly. Do not convert chargeable/volumetric mass to physical mass or assume shortest routing."
  - id: m_storage
    applies_to: "activity_bonded_storage"
    required_property_ref:
      name: "Mass*time"
      uuid: ""
    required_unit: "kg*d"
    rule: "Integrate actual stored cargo kg over each elapsed storage interval in days; entry/exit timestamps and changing stock determine kg*d. Neither shipment count nor a storage fee measures residence."
  - id: m_energy
    applies_to: "office_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Metered electricity kWh becomes MJ by exactly 3.6 MJ/kWh; use energy property for this confirmed identity. Do not change it to a mass flow."
  - id: m_office
    applies_to: "activity_office_occupancy"
    required_property_ref:
      name: "Area*time"
      uuid: ""
    required_unit: "m2*a"
    rule: "Measured occupied floor area multiplied by occupied calendar days divided by actual days in that year, then allocated once. No default floor area or service life."
  - id: m_mass
    applies_to: "label_paper; protective_carton; office_water; office_wastewater; paper_waste; carton_waste; residual_waste; computer_hardware; computer_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep each actual material or waste stream separate. Water volume converts using documented temperature-specific density; no unsupported volume-to-mass factor. Hardware is the physically measured net laptop mass amortized over observed service, not one laptop per delivery."
  - id: m_handling
    applies_to: "activity_origin_handling; activity_destination_handling"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Handling kg matches the supplier intensity reference unit exactly: one complete terminal cycle per actual consignment passage and cargo kg, including all subtasks declared in that cycle. Repeated scans, screening, sorting, loading and unloading inside a complete cycle do not add another kg charge. A genuinely separate single-stage service requires its own bounded atomic row and matching stage intensity before completion; repeated complete passages may exceed unique cargo mass without adding reference deliveries."
  - id: m_customs
    applies_to: "activity_customs_brokerage"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "h"
    rule: "Use recorded brokerage staff hours for actual declaration, document correction and inspection coordination; 3600 seconds = 1 h; money, taxes and declaration counts cannot replace measured hours."
