published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Quantified international ambient courier delivery within the declared contracted air/road network, country pair and service stratum after all applicability and data gates pass."
  excluded_use: "Not a universal transport emission factor; no USO/domestic/counter/stand-alone freight substitution; not whole product life-cycle impact or a verified current Tiangong dataset while gaps remain."
  required_metadata: "country pair; origin acceptance and destination delivery addresses; responsible provider and subcontractors; waybill/piece definition; gross mass and size class; contents and ambient state; air and road route segments; dates and service promise; proof/condition criteria; cohort closure and outcome counts; supplier inventory boundaries; allocation and electricity supply context; ordinary-waste generation origin, original shares/denominator, retained stocks and treatment revision chain; signed foreground/interface responsibility matrix, native service activity and background coverage; original physical activity, manufacture/terminal pairing and species basis only for foreground-owned components"
  required_quality_disclosure: "Q, A, R0 and failures; pending; cohort period and elapsed closure; supplier activity coverage; identities pending; estimates/calibration; all allocation bases and sensitivity; exclusions and unresolved actual exchanges."
  update_trigger: "Provider, mode, country pair, promise, package class, office technology, supplier inventory, quantity basis, allocation, legal customs process or identity evidence changes.; later ordinary-waste receipts/fate or generation correction update the original event/cohort model; foreground physical identity/speciation changes or external interface configuration/unit/coverage changes require applicable concrete-row review and fresh projection"
data_sources:
  - id: "un-cpc3-68022"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, 68022 International courier services; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/68022"
    used_for: "Non-USO collection, transport and delivery to international destinations; source defines a wider multi-mode category than this PCR."
  - id: "dhl-carriage-2024"
    type: "standard"
    reference: "DHL Express, Terms and Conditions of Carriage (2024), sections 1–5 and 11; https://mydhlplus.dhl.com/content/dam/downloads/global/en/t-c/terms_conditions_of_carriage_en-2024.pdf.coredownload.pdf"
    used_for: "Operational case evidence for customs, inspection, delivery, rejected/returned shipments, waybill identification and actual versus chargeable weight; not a universal legal rule or numeric LCA factor."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "GHG Protocol, Product Life Cycle Accounting and Reporting Standard (2011), chapter 9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision before physical allocation; general GHG accounting principles inform this PCR without establishing multi-impact compliance."
  - id: "ghg-transport-2013"
    type: "official_guidance"
    reference: "GHG Protocol, Technical Guidance for Calculating Scope 3 Emissions, version 1.0 (2013), category 4, pp. 53–55; https://ghgprotocol.org/sites/default/files/standards/Scope3_Calculation_Guidance_0.pdf"
    used_for: "Transport physical activity and mass/volume allocation; no default load, empty return, air factor or volumetric conversion adopted."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:0d36b92a74d2963d444c1b7a33dc0c00960ec04a192507db1fb1e2e381c3b225"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6583"
      family: "system_boundary"
      span:
        start:
          offset: 6583
          line: 60
          column: 1
        end:
          offset: 17187
          line: 91
          column: 1
      markdown: "## 5. System Boundary\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_end_to_end | all waybills | Start at recorded possession acceptance at the origin address; include pickup, every air and road connection, origin/destination/transit hubs, security inspection, applicable export/transit/import clearance, border storage, delivery attempts and final contractual delivery evidence. A border-crossing leg alone never meets the reference function. | `un-cpc3-68022`; `dhl-carriage-2024` |\n| b_failure | cohort | Include actual rejected-after-acceptance, customs-held, damaged, returned, lost and disposed consignments and all redelivery/return legs in the same cohort numerator; exclude them from Q unless ultimately qualified. Rejection before custody is outside acceptance cohort; its office acceptance effort is allocated overhead, and any actual carrier custody/transport triggers accepted status. Pending cases block final qualification. | `dhl-carriage-2024` |\n| b_services | all purchased services | Road and air services include their own fuel/energy supply, combustion species, vehicle/aircraft manufacture and maintenance, load-factor allocation and allocated empty repositioning. Handling includes screening, loading/unloading, terminal energy/equipment and terminal waste; storage includes its own space, utilities, equipment and waste. Supplier contracts and inventory must identify each inclusion. Do not add these burdens again as direct courier fuel, airport activity, assets or emissions. Missing provider inventory coverage is incomplete data, not zero. | `ghg-transport-2013` |\n| b_partition | segments and subcontractors | Keep a unique service ledger keyed by waybill, segment/event, country/site, provider and time. Each physical activity has exactly one inventory owner; airport handling, brokerage and storage supporting physical processes cover only work outside transport/handling providers already included. A through-air service covering road feeder or terminal work requires removal of that overlap before use; a whole international courier service cannot also be a leg input. | `ghg-product-2011` |\n| b_goods | contents and packaging | Customer goods and their original packaging enter custody as tracked cargo, not purchases of the courier; their manufacture and use are excluded but their actual gross mass affects transport. Courier-added corrugated cartons and paper labels are inventoried separately. Returned customer goods remain customer stock, not co-products; disposal requires measured material-specific waste and downstream treatment, never an invented replacement-goods credit. | `dhl-carriage-2024` |\n| b_digital | activity_hosted_tracking | Include booking, customs-document exchange, tracking, dispatch and proof/claims data operation through measured hosted application activity; do not confuse server-instance h, staff h and shipment Item(s). Supplier networks/access coverage must end at a stated demarcation; any uncovered courier network equipment or telecom activity needs a separate atomic exchange before completion. | `ghg-product-2011` |\n| b_office | own administration | Include office electricity, water, wastewater, paper, allocated laptop hardware, building occupancy, maintenance and end-of-life. Occupancy service includes building construction, fabric maintenance, HVAC plant and its refrigerant lifecycle, plus central HVAC, common lighting, cleaning and other building operations not covered by direct office cards. Exclude only the exact same utility quantity, period and physical scope already counted in the direct office meters/cards, together with separately counted laptops and direct office waste. Obtain whole-building/zone utility and cleaning/maintenance records by billing period; subtract reconciled directly assigned quantities for all beneficiary tenants/zones (not only this courier), allocate the residual common operational pool by occupied floor-area*time across all benefited tenants/zones, and retain the resulting utilities/materials/waste in the upstream occupancy inventory once. Missing central/shared operational records block completeness. No owned transport/hub, onsite fuel, dedicated refrigeration or generator is in this route; actual occurrence makes this route inapplicable unless the methodology is formally extended with separate atomic rows and protocols. | `ghg-product-2011` |\n| b_unlisted | completeness | Apply the following concrete-row requirement to actual foreground components; an external service and compatible background evidence may cover its provider-internal components under foreground_interface_coverage without new foreground rows. At each site/provider reconcile actual purchasing, waste transfers, maintenance and services against the inventory. An unlisted actual material (including label adhesive/liner/ink), asset, cleaning chemical or disposed customer-content waste must receive a separate physically specific row, mass/energy/time/activity unit, linked collection protocol and the same Q denominator before completion; do not merge it into paper or residual waste by name. Service coverage evidence may locate it in an upstream supplier once, never waive it. | `ghg-product-2011` |\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Customer-packed consignment accepted into courier custody at an origin address; no customer goods manufacture inside foreground. |\n| starting_condition_role | service_acceptance_gate |\n| product_classification_scope | CPC 3.0 68022 narrower: non-USO international ambient air/road courier service. |\n| recursive_input_rule | Apply boundary_atomic_support: external activities enter through a defined single-unit service interface; do not recursively expand supplier internals. Foreground physical processes retain their existing cards and rules. Custody cargo is not a manufactured input. |\n| upstream_dataset_requirement | Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners. |\n| disclosure | country pair; origin acceptance and destination delivery addresses; responsible provider and subcontractors; waybill/piece definition; gross mass and size class; contents and ambient state; air and road route segments; dates and service promise; proof/condition criteria; cohort closure and outcome counts; supplier inventory boundaries; allocation and electricity supply context |\n\n### Atomic supporting-activity boundary\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_atomic_support | supporting activities | Each active exchange represents one defined material, equipment or service object with one primary property and unit. A service is not disallowed merely because it has upstream processes. Fix responsibility by provider, contract, site, event, gate and scope component before quantification. Operator-run processes and separately commissioned onsite tasks under operator inventory responsibility use foreground physical rows. Independently provided activities outside that responsibility use their specified service-interface rows; supplier manufacture, utilities, maintenance and waste remain in the matched background service, not extra foreground exchanges. A contract alone does not turn supplier internals into foreground. Do not change the product, route, custody gates or original reference denominator. Apply foreground_interface_method and foreground_interface_coverage; boundary changes need PCR review, not a data-availability choice. Ownership here means inventory responsibility, not legal title alone: rented equipment provision may be an external service while separately metered operator-run electricity remains foreground. |  |\n| foreground_interface_coverage | all support processes and overlaps | Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners. |  |\n\n"
