allocation_rules:
  - rule_id: a_direct
    applies_to: "all activities"
    rule: "Subdivide by actual provider, country pair, service class and route before allocating; retain document/parcel and mass/volume classes as separate strata, with Q and all associated failed activity for each stratum. Do not present strata with different function, promise or gates as equivalent."
    source_ids:
      - ghg-product-2011
  - rule_id: a_transport
    applies_to: "road and air services"
    rule: "Use actual cargo t*km activity with a provider dataset matched to mode, vehicle/aircraft, fuel, region, utilization, loading constraint and empty movement coverage. Shared road multi-stop tours allocate trip burdens by per-segment cargo mass-distance; if volume is the binding constraint, use measured occupied volume-distance shares, document all cargo loads and test mass versus volume sensitivity. Allocate empty/repositioning to the serviced tour, not to zero cargo distance. For belly-hold and freighter legs use the primary mass method, raw/preallocated-data acceptance conditions and sensitivity in calc_air_payload_allocation. Supplier-method disclosure does not replace this algorithm, and a freighter dataset cannot silently substitute."
    source_ids:
      - ghg-transport-2013
      - ghg-product-2011
  - rule_id: a_hubs
    applies_to: "handling storage customs"
    rule: "Allocate directly traced complete handling cycles to consignments; shared handling by actual gross mass per complete cycle only after validating equipment demand and supplier reference-unit scope. Do not subdivide a full-cycle intensity into repeated subtask kg. Storage uses measured kg*d and capacity constraint with volume-time sensitivity where relevant, brokerage recorded staff h. Keep routine sorting, extraordinary inspection and bonded detention distinguishable. Each shared pool uses complete beneficiary totals including failed and non-study work."
    source_ids:
      - ghg-product-2011
  - rule_id: a_office
    applies_to: "office pools and assets"
    rule: "Assign dedicated records directly; shared office energy/water/occupancy/consumables use observed staff task-time share for the full acceptance cohort divided by all beneficiary task time, including pre-acceptance screening and failed cases. Hardware mass contribution equals measured laptop net mass multiplied by cohort usage h divided by evidenced total expected lifetime usage h; disclose replacement/repair records and sensitivity to remaining life. Laptop supply inventory ends before its separately inventoried end-of-life; exclude any supplier end-of-life burden already counted here. Use the full physical asset service lifetime through final retirement, including evidenced planned subsequent reuse, consistently for laptop net mass, lifetime_useh and M_EOL; retained/reused components are not current waste and have no substitution credit. No default lifetime, capacity or coefficient. Ordinary paper/carton/residual waste instead uses allocation_waste_origin with the task share of its same generation interval, preserving original-cohort responsibility. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_waste_origin
    applies_to: "paper_waste; carton_waste; residual_waste"
    rule: "Fix each ordinary solid-waste generation event to its original service cohort and stratum at generation, never at later dispatch. Directly trace the generating task first; shared generation uses the existing site/handling allocation driver over the recorded generation interval, including all customer and noncohort workloads. Preserve event ID, generation date, original shares and original reference denominator through storage and internal transfers. Acquired old waste is not new generation. Retained waste keeps its original treatment responsibility; dispatch-period service does not inherit it. For shared generation, split records at each fixed local-calendar-month boundary (68013 uses its already declared counter accounting period instead); apply the existing site task/handling driver within that exact generation interval, not the full later dispatch/cohort window. Direct event attribution takes precedence. Record site timezone before period assignment."
    source_ids: []
  - rule_id: a_waste
    applies_to: "waste and returns"
    rule: "Do not allocate service burdens away to damaged/returned goods, waste or internal handoffs; no substitution credit is assumed. A waste output transfers the physical carrier to one named receiving route; attach downstream treatment once, and do not add its contained substances again as separate waste mass or treat CO2-equivalent as an elementary emission."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_atomic_physical
    applies_to: "supporting physical inventory"
    rule: "For each provider, site, configuration, event and accounting interval, partition every measured physical total into mutually exclusive inventory owners before selecting the study cohort. Use the fixed activity driver for that support process, with all users and failed work in the denominator. Direct causal attribution precedes shared allocation. Never multiply a cohort share a second time if already attributed. Keep service-level allocation quantities as raw drivers, not exchange quantities, and do not repeat division by the final reference count. Meter/stock, installed/replaced assets, internal transfers, generated waste and fate balances must reconcile at the same physical/time boundary. A complete product gate may retain its manufacturing background, but a lump service row may not be reintroduced under a different label."
    source_ids: []
  - rule_id: allocation_atomic_capital
    applies_to: "manufacture; installation; terminal assets"
    rule: "For each physical asset serial/cohort a, Q_a is its actual manufacturing/construction-gate quantity in the card unit. Set f_c,a=attributed physical lifetime activity_c,a/evidenced full-life all-user activity_a, using the process/asset-specific driver and identical configuration/capacity units. Manufacture q=sum(Q_a*f_c,a)/N_ref; each initial and whole-asset replacement creates its own asset cohort and enters once, not an additional current-period maintenance item. Installation physical quantities outside the asset product gate use that same installed-asset fraction. Terminal residual quantity in its own declared unit, evidenced from matched retirement or a prospective residual/reuse/retention plan, uses exactly the same f_c,a and original reference denominator; actual custody transfers only verify/update it. Earlier removed parts are excluded from terminal residual. Restate life and all original beneficiary cohorts under calc_capital_restatement; lifetime estimates need evidence and sensitivity, never numeric defaults. Genuine component repairs/replacements use actual causal events or the fixed provider maintenance-year shares, not another whole-life fraction. A whole component reused as a separately commissioned capital asset instead receives its own serial/lifetime register, never both treatments."
    source_ids: []
  - rule_id: allocation_capital_restatement
    applies_to: "computer_hardware; computer_waste; u_origin_road_road_vehicle_manufacture; u_origin_road_road_section_manufacture; u_origin_road_road_vehicle_terminal; u_origin_road_road_section_terminal; u_destination_road_road_vehicle_manufacture; u_destination_road_road_section_manufacture; u_destination_road_road_vehicle_terminal; u_destination_road_road_section_terminal; u_air_linehaul_aircraft_manufacture; u_air_linehaul_runway_manufacture; u_air_linehaul_aircraft_terminal; u_air_linehaul_runway_terminal; u_origin_handling_terminal_building_manufacture; u_origin_handling_conveyor_manufacture; u_origin_handling_screening_unit_manufacture; u_origin_handling_forklift_manufacture; u_origin_handling_terminal_building_terminal; u_origin_handling_conveyor_terminal; u_origin_handling_screening_unit_terminal; u_origin_handling_forklift_terminal; u_destination_handling_terminal_building_manufacture; u_destination_handling_conveyor_manufacture; u_destination_handling_screening_unit_manufacture; u_destination_handling_forklift_manufacture; u_destination_handling_terminal_building_terminal; u_destination_handling_conveyor_terminal; u_destination_handling_screening_unit_terminal; u_destination_handling_forklift_terminal; u_customs_brokerage_broker_computer_manufacture; u_customs_brokerage_broker_network_manufacture; u_customs_brokerage_broker_office_manufacture; u_customs_brokerage_broker_computer_terminal; u_customs_brokerage_broker_network_terminal; u_customs_brokerage_broker_office_terminal; u_bonded_storage_warehouse_manufacture; u_bonded_storage_storage_rack_manufacture; u_bonded_storage_storage_forklift_manufacture; u_bonded_storage_warehouse_terminal; u_bonded_storage_storage_rack_terminal; u_bonded_storage_storage_forklift_terminal; u_office_occupancy_office_building_manufacture; u_office_occupancy_hvac_plant_manufacture; u_office_occupancy_office_building_terminal; u_office_occupancy_hvac_plant_terminal; u_hosted_tracking_server_manufacture; u_hosted_tracking_storage_unit_manufacture; u_hosted_tracking_network_switch_manufacture; u_hosted_tracking_datacentre_manufacture; u_hosted_tracking_cooling_plant_manufacture; u_hosted_tracking_server_terminal; u_hosted_tracking_storage_unit_terminal; u_hosted_tracking_network_switch_terminal; u_hosted_tracking_datacentre_terminal; u_hosted_tracking_cooling_plant_terminal"
    rule: "This PCR uses full restatement, not frozen historical shares or a retirement-period catch-up. All direct and supporting capital, reusable containers, installation outside the product gate and paired terminal sources follow calc_capital_restatement. Each specific activity rule fixes the driver and beneficiary shares; these are applied once. A complete asset background already including delivery/end-of-life follows the same restatement, without separate duplicate terminal exchanges. Routine component maintenance remains under its causal/period method."
    source_ids: []
  - rule_id: allocation_atomic_waste
    applies_to: "operational and maintenance wastes"
    rule: "Generated operational and maintenance waste retains its original generation event, provider/activity cohort, shares and original reference denominator through storage and transfers. Fixed shared-waste intervals are local calendar months with timezone declared; use same-interval causal activity and all users, unless an existing more specific maintenance-year or counter-period method applies. Reconcile closing=opening+generation+internal_in-internal_out-external_dispatch-evidenced_physical_loss on consistent material/moisture bases. Include supported eventual storage/transport/treatment for retained waste, with actual evidence or an explicitly evidenced compatible prospective route and uncertainty; unknown fate remains incomplete. Later receipts replace that original event model, not add a new dispatch-period burden. Asset terminal-waste uses its paired capital fraction instead. Waste carrier and its constituents, storage losses/releases and residual treatment cannot be counted twice; the same measured site/storage operation remains under one inventory owner."
    source_ids: []
  - rule_id: allocation_provider_maintenance_period
    applies_to: "u_origin_road_removed_tyre; u_origin_road_lubricant; u_origin_road_used_lubricant; u_destination_road_removed_tyre; u_destination_road_lubricant; u_destination_road_used_lubricant; u_air_linehaul_engine_oil; u_air_linehaul_used_engine_oil; u_origin_road_replacement_tyre; u_destination_road_replacement_tyre"
    rule: "For every shared routine supporting-provider maintenance pool, fix interval y to the site-local calendar year with timezone and exact asset/site/configuration recorded. Split a cohort crossing years into its within-year activity. Actual installed/consumed material M_x,y and its separately measured generated waste use s_c,y=cohort-attributed beneficiary driver_y/all-beneficiary driver_y for that same year, then q=sum_y(M_x,y*s_c,y)/N_ref once. The driver is the physical support-process activity fixed in activity_*; for vehicle upkeep it is actual vehicle kilometres including once-attributed empty/failure travel, for variable road upkeep it is evidenced class-specific engineering damage in the same year, and for building fabric it is reserved floor-area-calendar-hours. Other shared support equipment uses its fixed actual all-beneficiary task/cycle/union-hour driver; retain exact configuration strata and no concurrency duplication. A signed maintenance work order fixes the causal asset and task pool before calculation, not a later modeller choice. Specific accident/failure repair is allocated exclusively to its evidenced causal order/task set, never also to the annual routine pool. Genuine component consumption excludes unused opening/closing stocks, uninstalled returns and internal transfers; generated removed parts retain this original event/year/share through later custody. No assumption that input and removed-part masses are identical. Apply one annual period share, not whole-life f, to real component repairs; entire replacement assets create separate capital cohorts instead. A positive unsupported pool or zero/unknown all-user denominator blocks completeness. Apply the same rules to retained provider maintenance cards where previously referenced; independent specific generation/fate balances and exact overlap exclusions remain mandatory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_digital
      process_id: "digital"
      flow_role: "activity_hosted_tracking"
      record_type: "application_resource_log"
      raw_fields: "provider; application/configuration; instance start/end; compute/memory/storage/network; cohort/all request resource time; redundancy; supplier energy/cooling/water/asset/waste boundaries; access demarcation"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Collect provisioned-instance and resource logs at each hosting interval and configuration change; join original waybills to resource time, including unsuccessful calls; verify supplier primary activity, network coverage and allocation monthly. Full application h times cohort resource-time share; use dedicated traceable records directly and allocate standby by complete beneficiary resource-time share. Missing usage or supplier coverage blocks completion."
      unit: "h; s"
      frequency: "every hosting interval; monthly reconciliation"
      temporal_coverage: "all cohort booking through final proof, claims and terminal outcome processing"
      site_scope: "hosting provider, network/access provider and contracting courier"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier logs; configuration contract; resource-time reconciliation; complete inventory and provider network demarcation"
    - protocol_id: cp_interface_origin_road
      process_id: "support_origin_road"
      flow_role: "svc_origin_road"
      record_type: "service_interface_register"
      raw_fields: "provider; contract/version; event ID; site/route/configuration; owner; scope component; native A_s,e and unit; alpha_s,e and all-user driver; original cohort/output denominator; inclusion/exclusion matrix; meter/time/count source; calibration; background reference/unit/period/allocation; correction and overlap links"
      collection_method: "At the actual service acceptance/use interface collect sum(actual gross payload tonnes * actual loaded origin-road leg km), with original empty-leg and failure coverage. Record every executed event, including failed/reworked events required by the original method. Verify units against calibrated mass/distance/area/time records or deduplicated execution logs as applicable; reconcile to invoices without substituting money for activity. At contract start/change the service data custodian signs the boundary/ownership and background compatibility matrix; reconcile monthly and at original cohort closure. Record zero occurrence only from complete event registers. Missing activity, unit conversion, background coverage or identity remains incomplete; preserve uncertainty and evidence. Supplier internal measurements are not required for an external interface."
      unit: "t*km"
      frequency: "each event; monthly; contract change; cohort closure"
      temporal_coverage: "same complete original reference cohort and actual service-event periods"
      site_scope: "declared external service acceptance/use gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed contract/scope matrix; primary activity records; calibration; allocation and invoice reconciliation; verified background identity and documented gaps"
