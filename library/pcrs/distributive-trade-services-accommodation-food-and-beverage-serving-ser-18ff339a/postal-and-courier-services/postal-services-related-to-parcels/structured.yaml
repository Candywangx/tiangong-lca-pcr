      applies_to: "sorter_asset; it_asset; diesel_van; petrol_van; electric_van; diesel_truck; u_contract_road_diesel_van; u_contract_road_petrol_van; u_contract_road_electric_van; u_contract_road_diesel_truck; u_contract_road_eol_diesel_van; u_contract_road_eol_petrol_van; u_contract_road_eol_electric_van; u_contract_road_eol_diesel_truck; u_road_infrastructure_constructed_section; u_road_infrastructure_eol_asphalt; u_road_infrastructure_eol_concrete; u_charging_asset_service_charger_manufactured; u_charging_asset_service_installation_concrete; u_charging_asset_service_installation_ac; u_charging_asset_service_charger_eol; u_charging_asset_service_foundation_concrete_eol; u_building_asset_building_constructed; u_building_asset_demolition_concrete"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. If a supply-background or treatment-model version changes without a physical quantity change, replace the corresponding linked inventory and result for all affected original cohorts; a zero physical delta_A does not preserve the old model."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: dq_complete
      applies_to: "all rows"
      requirement: "Raw fields and protocols are mandatory; supplier names/amounts may await collection but physical assignment, formulas, denominator and de-duplication follow these fixed rules. Screen other actual materials and emissions; missing exchange blocks completeness."
      evidence: "complete occurrence and coverage register"
    - id: dq_represent
      applies_to: "cohort and allocation"
      requirement: "Use 12 consecutive acceptance months and track to final closure, covering peaks, all sites and routes. Separate service promise, mass/size, technology and location strata; disclose sampling weights and uncertainty."
      evidence: "cohort ledger; calibration; peak/nonpeak workload study"
    - id: dq_identity
      applies_to: "each selected flow"
      requirement: "Validate exact candidate identity before binding; retain unresolved candidate and block completed modelling if absent. Official names do not erase material/route/state/compartment qualifiers."
      evidence: "official response and hash-bound receipt"
    - id: dq_factors
      applies_to: "emissions and lifetime"
      requirement: "No default factor or life is specified. Record original factor/life source, version, technology, unit, boundary, uncertainty and sensitivity. Proxy requires compatible basis and explicit disclosure; unknown is not zero."
      evidence: "original source; supplier or maintenance evidence"
    - id: dq_condition
      applies_to: "conditional cards"
      requirement: "Demonstrate occurrence/non-occurrence from fuel/assets/repair/waste records, not lack of invoices alone; investigate idle assets, stock changes and outsourced tasks. Missing confirmation remains unresolved."
      evidence: "signed site/route occurrence matrix"
    - id: quality_waste_origin
      applies_to: "waste_cardboard; waste_paper; waste_pp"
      requirement: "For every ordinary solid-waste stream verify generation responsibility, original cohort/stratum/denominator, origin-labelled stock balance, supported actual or prospective complete treatment and later-receipt replacement. Unknown origin/fate/physical loss remains an explicit gap; future dispatch alone cannot close or reassign it. Keep wastewater and amortized terminal-asset treatment on their separate methods."
      evidence: "generation/stock/transfer ledgers; supported treatment scenarios; same-event receipt replacements"
    - id: quality_charge_events
      applies_to: "activity_charging_asset_service; traction_electricity"
      requirement: "Verify every occupied charging event is positive gross source addition, verified zero addition or unresolved; net SOC alone cannot decide. Reconcile mutually exclusive source/direct/causal-set/shared-day shares, all beneficiaries, hours and metered losses. Failed/cancelled zero-addition hours remain counted with no successful-output credit; unknown evidence is not zero. Verify electricity removal from the residual route pool and keep the complete-life occupied-hours denominator unchanged."
      evidence: "session/source/branch records; meter and occupancy reconciliation; all-user causal-time evidence"
    - id: quality_atomic_completeness
      applies_to: "all disaggregated support and species"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "scope-to-physical-row reconciliation; supplier/BOM/species originals; signed gap register"
    - id: quality_service_interfaces
      applies_to: "svc_contract_road; svc_road_infrastructure; svc_charging_asset_service; svc_building_asset"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "cp_interface protocols; signed coverage/ownership matrix; native-unit reconciliation; identity receipts"
    - id: scope_interface_contract_road
      applies_to: "u_contract_road_diesel; u_contract_road_petrol; u_contract_road_electricity_ac; u_contract_road_diesel_van; u_contract_road_petrol_van; u_contract_road_electric_van; u_contract_road_diesel_truck; u_contract_road_replacement_tyre; u_contract_road_lubricating_oil; u_contract_road_replacement_lfp_battery; u_contract_road_r134a_supply; u_contract_road_r134a_reclaimed_supply; u_contract_road_r134a_recovered_product; u_contract_road_spent_tyre; u_contract_road_spent_oil; u_contract_road_spent_lfp_battery; u_contract_road_eol_diesel_van; u_contract_road_eol_petrol_van; u_contract_road_eol_electric_van; u_contract_road_eol_diesel_truck; u_contract_road_r134a_recovered_waste; u_contract_road_co2_fossil; u_contract_road_co2_biogenic; u_contract_road_methane; u_contract_road_nitrous_oxide; u_contract_road_carbon_monoxide; u_contract_road_nitric_oxide; u_contract_road_nitrogen_dioxide; u_contract_road_sulfur_dioxide; u_contract_road_pm25; u_contract_road_pm_coarse; u_contract_road_tyre_pm25; u_contract_road_r134a_air; svc_contract_road"
