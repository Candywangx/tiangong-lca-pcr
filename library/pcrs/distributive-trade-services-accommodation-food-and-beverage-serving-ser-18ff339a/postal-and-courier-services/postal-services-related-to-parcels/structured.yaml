      rule: "Native activity definitions, allocation drivers and event windows also govern the matching calc_interface_ service rule; only the physical-quantity calculations and internal measurements below require the foreground physical branch under foreground_interface_method. Raw activity ledger only, not an exchange. For each actual apparatus j let B_j,c=sum_positive(H_k*a_c,k)+sum_verified_zero(H_k*z_c,k). H_k is the existing nonoverlapping apparatus-union-hour allocation over actual occupied ports; source vectors and carryover apply only to gross positive stock additions, and the existing direct/causal-set/fixed-day shares to verified zero additions. q_new_charger=1 complete apparatus*B_j,c/H_j,life/D; H_j,life uses the identical occupied-union basis across documented complete life including zero events and calendar retirement. Installation and final residual streams use the same physical-asset beneficiary fraction; maintenance uses causal event assignment where available, otherwise the evidenced apparatus-period all-user occupied-hour shares. Measured operating AC stays in E_total/E_zero/E_route and the separate standby site/road ledger once; no conversion of hours to kWh or item without actual lifetime. Retain original denominator D once. Any legacy per-reference activity diagnostic must first be restored to raw activity for physical disaggregation; never use it as an exchange or normalize twice."
