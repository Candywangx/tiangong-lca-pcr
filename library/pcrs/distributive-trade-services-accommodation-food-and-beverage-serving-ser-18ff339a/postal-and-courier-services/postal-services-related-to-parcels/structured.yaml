system_boundary:
  rules:
    - rule_id: boundary_uso
      applies_to: "Product identity"
      rule: "Apply only to parcel/package collection, road transport and delivery rendered under an evidenced universal service obligation. A commercial courier contract without that obligation is out of scope even if a postal operator performs it."
      source_ids:
        - un-cpc3-68012
    - rule_id: boundary_gates
      applies_to: "Complete chain"
      rule: "Start at physical acceptance into postal custody, including acceptance handling; finish at documented receipt by authorized recipient/collection point. Include upstream energy/material supply, own and contracted collection after acceptance, sorting, temporary holding, linehaul, last mile, redelivery, attributable returns, IT, facilities, maintenance, capital assets and treatment of operational wastes. A node-only record is an intermediate contribution."
      source_ids:
        - un-cpc3-68012
        - upu-parcel-service
        - ghg-scope3-2013
    - rule_id: boundary_exclusions
      applies_to: "Service boundary"
      rule: "Exclude goods manufacture, goods use, shipper packaging production already embodied at acceptance, customer travel before acceptance/after pickup, postal finance, standalone counter sales, letters, international/customs, air/water/rail routes and temperature-controlled carriage. Operator-added packaging is included upstream through delivery; its recipient disposal lies after this service gate and must be disclosed separately, never silently added to the service reference."
      source_ids:
        - un-cpc3-68012
    - rule_id: boundary_segment_owner
      applies_to: "Every transport leg"
      rule: "Maintain one physical segment identifier and exactly one owner/model: own fuel-electricity plus emissions plus non-operational asset, or purchased carriage with all those burdens inside. Never add carrier fuel, emissions, vehicle capital, maintenance, upstream energy or included empty runs again. Separate supplier warehousing from included hub operations by a coverage register."
      source_ids:
        - ghg-scope3-2013
    - rule_id: boundary_nonzero_gaps
      applies_to: "All required exchanges"
      rule: "Cards define atomic candidates, not an exhaustive zero-filled template. Confirm occurrence from route, invoice, asset, maintenance and waste registers; additional actual fuel, material, cloud service, refrigerant, vehicle configuration or emission compartment requires a separate physically specific card and protocol using the same methods. Missing identity/amount/factor stays unresolved and blocks a complete claim; only documented non-occurrence permits not_applicable."
      source_ids: []
    - rule_id: boundary_asset_coverage
      applies_to: "Infrastructure and maintenance"
      rule: "For every asset link verify full manufacture, maintenance and end-of-life coverage and declared life denominator. Operational energy, foreground combustion, explicitly modelled tyre/brake wear PM and explicitly modelled refrigerant releases are outside that link. The asset dataset must exclude those use-stage exchanges; if it cannot be disaggregated, the overlapping foreground exchange must not be added and matching complete coverage must be demonstrated. Replacement-tyre/brake supply and residual end-of-life treatment remain in the asset link, but residual discarded mass must deduct material already emitted as wear particles. Add separately identified replacement materials/wastes only if explicitly absent from the asset supplier boundary; never add original components of a complete vehicle or sorter twice. Missing compatible asset data is an incomplete component, not assumed negligible."
      source_ids: []
    - rule_id: boundary_counter_substitution
      applies_to: "Acceptance counter service"
      rule: "Apply foreground_interface_coverage: outside foreground use the specific service interface; the following detailed physical requirements apply only to foreground-owned components. Replace only the matched acceptance stage with itemized physical provider exchanges after matching procedure, mailpiece class, start/end handoff and responsibility. Join the session ID to each independently accepted mailpiece ID, observed work and receipt/handoff; one session may handle multiple mailpieces but is not one 68013 mailpiece output. Do not presume ordinary USO parcels match a registered/certified counter procedure. Include failed/corrective work and all served users; remove only evidenced overlapping energy, material and asset shares. No complete 68013 service product is an input. Where the gate or physical records do not match, do not substitute."
      source_ids: []
    - rule_id: boundary_atomic_support
      applies_to: "supporting activities"
      rule: "Each active exchange represents one defined material, equipment or service object with one primary property and unit. A service is not disallowed merely because it has upstream processes. Fix responsibility by provider, contract, site, event, gate and scope component before quantification. Operator-run processes and separately commissioned onsite tasks under operator inventory responsibility use foreground physical rows. Independently provided activities outside that responsibility use their specified service-interface rows; supplier manufacture, utilities, maintenance and waste remain in the matched background service, not extra foreground exchanges. A contract alone does not turn supplier internals into foreground. Do not change the product, route, custody gates or original reference denominator. Apply foreground_interface_method and foreground_interface_coverage; boundary changes need PCR review, not a data-availability choice. Ownership here means inventory responsibility, not legal title alone: rented equipment provision may be an external service while separately metered operator-run electricity remains foreground."
      source_ids: []
    - rule_id: foreground_interface_coverage
      applies_to: "all support processes and overlaps"
      rule: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Already packaged customer parcel physically tendered and accepted into postal custody"
  starting_condition_role: "Service starting state; goods and existing shipper packaging are carried objects, not manufactured inputs"
  product_classification_scope: "Domestic ambient road postal parcel service under universal service obligation; narrower than CPC 68012"
  recursive_input_rule: "Apply boundary_atomic_support: external activities enter through a defined single-unit service interface; do not recursively expand supplier internals. Foreground physical processes retain their existing cards and rules. Custody cargo is not a manufactured input."
  upstream_dataset_requirement: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
  disclosure: "Acceptance/receipt gate, closed cohort, owner/segment coverage, route technology, shared-load/space allocation, maintenance/capital coverage, exclusions and unresolved gaps"
