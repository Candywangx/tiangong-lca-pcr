  - id: "un-cpc3-68012"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, subclass 68012, and Explanatory Notes p.379. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/68012"
    used_for: "Universal-service parcel collection/transport/delivery classification; distinguishes non-USO courier"
  - id: "upu-parcel-service"
    type: "official_guidance"
    reference: "UPU, Parcel Post. https://www.upu.int/en/Postal-Solutions/Programmes-Services/Quality-of-service/Parcel-Post"
    used_for: "Postal process, tracking quality and operator delivery-time commitments; international context does not establish domestic legal obligations"
  - id: "ghg-scope3-2013"
    type: "official_guidance"
    reference: "WRI/WBCSD, Technical Guidance for Calculating Scope 3 Emissions, v1.0 (2013), category 4 pp.49–71, formulas 4.1–4.4; category 5 pp.72–80. https://ghgprotocol.org/sites/default/files/standards/Scope3_Calculation_Guidance_0.pdf"
    used_for: "Fuel/electricity/refrigerant activity; physical mass/volume allocation; carrier boundaries and waste treatment. Used as method support, not full LCA conformance or default factors"
