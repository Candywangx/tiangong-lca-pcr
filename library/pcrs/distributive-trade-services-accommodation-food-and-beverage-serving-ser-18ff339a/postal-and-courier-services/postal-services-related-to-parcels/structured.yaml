      rule: "Net issue=opening+external receipts-closing-external supplier returns-other uses-out-of-system transfers; internal unused-stock return already in closing is not deducted again; reconcile complete-label mass with liner waste and recipient-bound components; ordinary solid waste uses calc_waste_origin; site_wastewater retains its separately measured volume balance"
