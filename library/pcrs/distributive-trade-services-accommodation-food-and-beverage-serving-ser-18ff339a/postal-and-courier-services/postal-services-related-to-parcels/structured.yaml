    - protocol_id: cp_waste
      process_id: "postal_sites"
      flow_role: "waste_cardboard; waste_paper; waste_pp; site_wastewater"
      record_type: "waste transfer and water balance"
      raw_fields: "specific waste; mass or volume; timestamp/site; carrier/receiver; treatment; destination fraction; meter; retained_stock; label backing; evaporation; generation_event_id; generation_time/site; source task/cohort/stratum; original allocation shares/reference denominator; generated mass and wet/dry/composition basis; opening/closing stock by origin; internal transfer IDs and both endpoints; external dispatch; evidenced physical loss/release; receiver and destination fractions; actual/prospective route and model version; evidence/uncertainty; receipt replacement status and revision chain"
      collection_method: "Solid packaging wastes: Measure segregated generated mass at the generating point and record the responsible task/interval before storage; if generation is reconstructed from a complete stock balance, document all transfers, losses and measurement uncertainty and preserve original event provenance. Apply allocation_waste_origin and calc_waste_origin. At each transfer and period close reconcile origin-labelled stocks against calibration and receiver evidence. Require supported storage/transport/treatment coverage for retained mass; later receipts replace the original event model, never create a second dispatch-period burden. Wastewater is a separate volume balance: meter sewer outflow or measure supply minus evidenced evaporation/other uses; link sewer/treatment once on actual volume, with no solid-waste kg stock formula or constituent duplication."
      unit: "kg; m3"
      frequency: "each generation and transfer; origin stocks at monthly close"
      temporal_coverage: "full cohort activity period; trace original generation through retained stock and eventual receiver evidence"
      site_scope: "all sites and waste receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration; waste consignment/receiver evidence; sewer invoice; water balance; non-occurrence evidence"
    - protocol_id: cp_emissions
      process_id: "direct_emissions"
      flow_role: "co2_fossil; co2_biogenic; methane; nitrous_oxide; nitrogen_monoxide_urban; nitrogen_dioxide_urban; co; so2; pm25; pm_coarse; co2_fossil_rural; co2_biogenic_rural; methane_rural; nitrous_oxide_rural; nitrogen_monoxide_rural; nitrogen_dioxide_rural; co_rural; so2_rural; pm25_rural; pm_coarse_rural"
      record_type: "species and technology factor record"
      raw_fields: "physical_source; species; fuel/engine/abatement; fossil_biogenic_fraction; activity/value/unit; factor/value/unit/version/citation; compartment; measured source mass; urban/rural class; exhaust/nonexhaust coverage; species identity/CAS; direct mass or molar fraction; NO2-equivalent QA basis; molecular data source; compound/carbon basis; calibrated speciation and uncertainty; NMVOC total on its original basis, QA only, not an inventory row"
      collection_method: "Use source measurement first; otherwise cite source-specific compatible emission factors, using matching fuel/energy/km activity; distinguish tailpipe, boiler and tyre/brake sources Aggregation method: E_g=sum(activity_j×EF_gj×attribution_j)/D; factors must be species mass not CO2e; no additional carbon/content factor if EF already includes it; coarse PM=PM10-PM2.5 only on same source basis For the explicitly evidenced definition NOx=NO+NO2 expressed as NO2-equivalent, record T, its unit/basis and source-matched measured molar fraction a=n_NO/(n_NO+n_NO2). Then m_NO=a*T*M_NO/M_NO2 and m_NO2=(1-a)*T, using independently evidenced molecular masses on the same unit basis. Prefer direct substance-specific mass measurements/factors when available and do not add the QA total again. T is not ordinary NO/NO2 mixture mass; never apply a mass fraction directly to T or assign all T to NO2. If definition includes other nitrogen species, speciation or conversion evidence is missing, no two-component split is permitted: preserve the raw QA observation and block completion until actual species-specific rows and quantities are established. No numeric fraction or molecular mass is defaulted by this PCR. For each actual combustion/evaporation source, use source-matched calibrated species-resolved sampling/analysis or a traceable species-resolved factor inventory matching fuel, engine/process, control, load, cold/hot regime and period. Retain sampling recovery, calibration/response factors, detection and uncertainty, chemical identity, carbon-versus-compound basis and explicit conversions from formula/molecular data. Reconcile identified species to the measured/factor total on its original stated basis, investigating nonclosure; unidentified material is not zero and not a generic NMVOC exchange. Before completed modelling, author each actually supported species as its own named bilingual elementary card, matching compartment, quantity rule and protocol, then regenerate structured. Do not guess a fixed benzene/toluene/etc. roster, use total NMVOC as one species, or claim an exhaustive species inventory before this evidence exists."
      unit: "kg of each species; kg fuel; MJ; vehicle km"
      frequency: "each factor/technology change, monthly activity"
      temporal_coverage: "cohort periods with matching geography, engine, fuel and controls"
      site_scope: "foreground own vehicles and gas boilers only"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor original and uncertainty; stack/engine records; fuel composition; compartment evidence; include nonexhaust; no zero for missing factor"
    - protocol_id: cp_refrigerant
      process_id: "postal_sites"
      flow_role: "refrigerant_r134a; site_r134a_reclaimed_supply; site_r134a_recovered_product; site_r134a_generated_waste; r134a_air; r134a_air_rural"
      record_type: "equipment refrigerant mass balance"
      raw_fields: "site/equipment/chemical/lot IDs; local month and timezone; separate I/F/S opening/closing kg; movement ID, endpoints, title/custody; gross/tare/net/composition and calibration; virgin/external-reclaimed/own custody-return/internal-recovery sources; purchases, first installation, reuse, unused supplier returns, internal transfers, losses and actual media; original supply amount, applied/unapplied fraction and source kg before blending; upstream production/reclamation/transport scope; asset original/separate initial fill gate and lifetime fractions; original cohort and D; same-month all-user site driver/direct task; same-chemical shared-store issues by site; original waste event/shares/treatment version; product acceptance and physical dispatch; original-model correction chain ; initial/routine source tag and independent asset/source ID"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. At receipt, installation, recovery, return, transfer and waste-decision gates use calibrated batch weights, subtract tare once and convert to chemical kg with matched composition; retain actual mixed-carrier whole quantities. Reconcile purchase/title, maintenance, stock, meter and receiver records; pair I/F/S movements and source vectors under calc_r134a. Each month the original site record owner reconciles all users/original cohorts, first-supply attribution and unapplied carryover; unknown quantities/composition/media are never zero. Waste generation/treatment follows cp_refrigerant_waste_origin; initial capital fill follows cp_capital_restatement. The direct-emission process consumes this same site release ledger, partitioning urban/rural media only once."
      unit: "kg"
      frequency: "every movement/state change; reconcile each local month and original-cohort close"
      temporal_coverage: "original supply lot through use/loss/return and eventual waste treatment"
      site_scope: "all identified R134a air-conditioning equipment; vehicle AC requires separately identified card if outside asset dataset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "technician records; calibrated charging scale; purchase/recovery receipts; charge reconciliation"
    - protocol_id: cp_transport_capital
      process_id: "road_operations"
      flow_role: "activity_road_infrastructure; activity_charging_asset_service"
      record_type: "physical capital service register"
      raw_fields: "road segment/class; vehicle class; all-user traffic/lifetime allocation; actual self-operated loaded/empty km; provider construction/renewal/maintenance/end-of-life inventory; explicit direct-wear exclusions; charger serial; occupied session start/end; supported battery/activity interval; cohort/all-user activity kWh; complete lifetime occupied h; idle/standby kWh; component overlap crosswalk apparatus ID; port ID; occupancy start/end; nonoverlapping port intervals; concurrent occupied-port count; measured source-labelled session draws; event/session ID and start/release time; site timezone and calendar day; verified gross source addition I_k and its meter/BMS evidence; positive/zero/unknown classification; failure/cancellation reason; causal order/cohort or vehicle/task-set IDs; all-user attributed service elapsed hours including failed attempts/waits; shared-day beneficiary evidence; direct-event AC kWh; mutually exclusive branch/share ledger; electricity/source/capital overlap crosswalk"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Trace every self-operated segment to GPS/odometer and actual road/vehicle class. Obtain primary road lifecycle inventory and evidenced complete-life traffic by class; subdivide exclusive infrastructure first, allocate variable pavement renewal/maintenance by evidenced class-specific engineering damage demand and fixed capacity/safety/civil works by documented class-specific road-space*time demand. Reconcile shares over all road users; missing traffic, engineering allocation or inventory blocks completion, with no default equivalence between classes. Verify removal of explicit direct-wear releases from infrastructure background. For chargers read calibrated session clocks and paired energy/stock records; map each occupied session to supported activity under calc_electric_stock, including all users. Assign positive-source hours by allocation_charge_sources and verified zero-addition hours by allocation_charge_zero; trace battery carryover between periods, record unknown positive burdens as gaps. Audit complete charger inventory, lifetime occupied hours, idle power and exclusion from vehicle/building capital. Apply calc_transport_capital; no costs-to-activity conversion. Apparatus occupied time is the union of intervals with any occupied port, not the sum of concurrent session clocks. Split at every port-state change; allocate each interval hours equally across its actual occupied ports, a declared availability allocation choice within the same evidenced port/service configuration. Define H_k as the sum of these allocated apparatus-hours for session k; sum_k(H_k) equals whole-apparatus union hours. Different port classes/configurations need separate strata and capacity sensitivity. Use H_k, not raw overlapping session hours, in the capital calculation; complete lifetime denominator is the same whole-apparatus occupied union-hours. Retain every occupied attempt including failed/cancelled and verified zero-addition events. Measure gross addition separately from net stock change and concurrent draws; missing evidence stays unknown. Apply allocation_charge_sources only for positive I_k and allocation_charge_zero for verified zero I_k. Link causal dispatch/reservation and all-user service-time records; fix local timezone and split shared events at midnight. Reconcile branch hours to apparatus/bay occupancy and direct-event electricity to the same meter ledger once, with no fictitious stock source or route-energy duplication."
      unit: "vehicle*km; h; kWh"
      frequency: "each segment and charging session; period reconciliation; annual capital/supplier review"
      temporal_coverage: "complete cohort including empty/failure/return tail and evidenced infrastructure/charger life"
      site_scope: "all self-operated routes and all users of charging apparatus; purchased carriage retains its own included road capital"
      aggregation_rule: "per reference flow"
      quality_evidence: "GPS/odometer calibration; road-class/traffic/engineering inventory and allocation evidence; session clock and energy calibration; charger life/scope crosswalk; no-overlap review"
    - protocol_id: cp_support_contract_road
