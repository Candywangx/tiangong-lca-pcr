      record_type: "physical asset and lifetime register"
      raw_fields: "vehicle_id/configuration; complete original components; evidenced lifetime_vehicle_km; attributable_used_km; odometer_start/end; maintenance/replacement schedule; residual end-of-life coverage; excluded explicit wear/refrigerant emissions"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Inspect the exact own-operated vehicle configuration, odometer and maintenance records; use evidenced physical lifetime km rather than book depreciation. Verify original and replacement component supply and residual end-of-life coverage, excluding explicit foreground wear and refrigerant releases as required by boundary_asset_coverage. Aggregation method: vehicle fraction=attributable used vehicle km/evidenced lifetime vehicle km; divide by D once; original components are already included in the complete asset"
