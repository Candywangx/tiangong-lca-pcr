      record_type: "physical_exchange_and_asset_register"
      raw_fields: "event/asset/site/provider/configuration; exact product/substance; phase; Q_x,j and native unit; source intensity and activity basis; lifetime activity and f; terminal asset link and residual unit; stock and transfer IDs; original waste event/cohort; meter/calibration; all-user driver; overlap ownership; prospective route version; occurrence evidence; species identity/CAS, T and NO2-equivalent definition, source-matched molar a, molecular-mass provenance, direct species mass/factor and calibration; provider/vehicle/battery/session IDs; synchronous clock/timezone; inlet AC meter/calibration; actual capacity and DC/BMS gross addition I_k separate from draws; opening/closing calibrated stored energy; matched configuration/temperature/age AC-equivalent curve; source vectors S_bk and transfer IDs; per-source draw/loss/closing and capital carryover; positive/zero/unknown evidence; direct E_zero; causal task and all-user local-day service-time denominators; meter and scope overlap owner; maintenance_year; timezone; asset_id; installed/consumed M_x,y; generated residual kg; all_user_driver_y; cohort_attributed_driver_y; causal_event/task; unused inventory/returns/transfers; chemical/vehicle/store IDs; exclusive movement ID and endpoints; installed and recovered-store opening/closing kg separately; external supply receipt kg and installed addition; reuse; other in/out by subsystem; recovery into store; external product or waste handover kg, receiver and status; medium-specific losses; terminal residual; attribution period and all-user driver; handover time and gate, gross/tare/net batch kg, composition test and uncertainty, chemical kg, purchased new/reclaimed or own custody return, title and responsibility/receiver, original outbound/return movement IDs, lot opening/closing/issue/attributed shares/returns, upstream production or reclamation and transport scope, calibration ID; waste decision evidence/time; original generation event/lot; I/F/S state tag and location; measured generated gross/tare/net/composition and unit; original site/asset and timezone/interval; original causal task or all-user allocation fields/shares; original N and result version; retained tagged stock; movement IDs/endpoints; actual dispatch/receiver; storage loss/media; prospective treatment version and residual basis; original-model replacement/overlap evidence"
      collection_method: "Collect only active foreground physical components under foreground_interface_method; external services use cp_interface_ protocols. Replace the full purchased carrier lifecycle service on its existing exclusive segment/attempt boundary with supplier-owned physical inventories. Keep custody gates, all customers, failed/repeated attempts, empty returns, idling and terminal losses. No overlap with operator-owned legs or another supplier service. Subdivide actual supplier duty cycles by leg/technology; preserve existing loaded gross mass-distance allocation (measured physical volume only with capacity evidence), closed empty/idle-cycle and mutually exclusive last-mile service-time pools. q_x=sum(actual physical exchange x*applicable all-user cohort share)/D, once. Vehicle manufacturing q=one complete vehicle*attributed activity/evidenced whole-life activity/D. Maintenance uses actual causal events or the existing fixed local-calendar asset-year pool once; retirement uses the same lifetime beneficiary fraction and residual mass. Carrier road/charger/building products and their separate upkeep/EOL are required when in scope. Tonne-km or parcel-attempt count reconciles the supplier only; it is not a fuel/hour equivalence. At each provider/source gate, collect event/asset/site/route/configuration and exact physical identity, condition of occurrence/non-occurrence, direction/type/receiving medium, raw quantity and unit, meter/tare/calibration, timestamps and timezone, complete accounting interval, source unit-inventory basis, all-user activity and cohort joins, manufacturing/installation/use/maintenance/EOL phase, original/remaining asset fractions, paired terminal residual provenance, stocks/transfers, receiver/fate and prospective-model revisions. Retain signed supplier scope and exact overlap crosswalk to existing direct rows. Obtain chemistry/BOM/species identity before adding a missing concrete row; an unbound candidate can await official identity but cannot be a plural collection. Measure all events, reconcile per local month/maintenance year as prescribed and review the complete asset/supplier inventory annually and at configuration/retirement changes. Unmeasured positive activity, unsupported future treatment or an unlisted actual exchange prevents completeness. For the provider own vehicle/battery boundary apply calc_provider_electric_stock; require calibrated capacity/AC-equivalent empirical charge-discharge curves, chronological source-labelled transfers and balanced stocks. Charging source/capital-hour carryover follows allocation_charge_sources and allocation_charge_zero where defined, using this provider original activity ownership, not a second owned-fleet copy. This vehicle rule does not apply to separately metered workshop/site/installation AC. Apply allocation_provider_maintenance_period and calc_provider_maintenance_period to this provider actual routine/causal maintenance; no whole-cohort distance in each year. Apply calc_carrier_r134a to the same provider asset and recovered store; reconcile purchases, uninstalled/recovered stocks and beneficiary events by lot. Distinguish necessary service recovery from additional sale-product operations. Do not repeat original asset charge or covered terminal treatment. Use calc_carrier_r134a at the material or work gate for each receipt, installation, reuse, recovery, external handover, return or release. Use calibrated evidence, close monthly and reconcile lots and custody stocks to the matched asset attribution interval. Verify receipts, source states and responsibility. Use ledgers for occurrence or non-occurrence; unknown is not zero. Generated refrigerant waste quantities, shares and original denominators follow cp_refrigerant_waste_origin and calc_refrigerant_waste_origin; actual dispatch only closes custody records for that origin and does not override original responsibility."
      unit: "card-native units; raw t*km"
      frequency: "every event; local-month/maintenance-year reconciliation; annual/asset-change review and each refrigerant movement, monthly close and attribution-period reconciliation"
      temporal_coverage: "full original acceptance cohort and failure/return tail, matched asset life and eventual waste evidence"
      site_scope: "same provider/site/configuration scope; all shared users"
