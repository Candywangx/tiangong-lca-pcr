      applies_to: "u_contract_road_diesel; u_contract_road_petrol; u_contract_road_electricity_ac; u_contract_road_diesel_van; u_contract_road_petrol_van; u_contract_road_electric_van; u_contract_road_diesel_truck; u_contract_road_replacement_tyre; u_contract_road_lubricating_oil; u_contract_road_replacement_lfp_battery; u_contract_road_r134a_recovered_product; u_contract_road_spent_tyre; u_contract_road_spent_oil; u_contract_road_spent_lfp_battery; u_contract_road_eol_diesel_van; u_contract_road_eol_petrol_van; u_contract_road_eol_electric_van; u_contract_road_eol_diesel_truck; u_contract_road_co2_fossil; u_contract_road_co2_biogenic; u_contract_road_methane; u_contract_road_nitrous_oxide; u_contract_road_carbon_monoxide; u_contract_road_nitric_oxide; u_contract_road_nitrogen_dioxide; u_contract_road_sulfur_dioxide; u_contract_road_pm25; u_contract_road_pm_coarse; u_contract_road_tyre_pm25; u_contract_road_r134a_air"
