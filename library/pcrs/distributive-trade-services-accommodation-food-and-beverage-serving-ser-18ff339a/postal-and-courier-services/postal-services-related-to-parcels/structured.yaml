measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "One item is one uniquely identified delivered parcel service; D counts final receipt once. No conversion from kg to items without observed parcel counts and gross masses."
  - id: normalize_once
    applies_to: "all inventory"
    required_property_ref:
      name: "row-specific"
      uuid: ""
    required_unit: "row-specific"
    rule: "Retain raw cohort totals, attribution factors and D separately; row total attributable amount / D only once. A quantity already expressed per delivered item is not divided again."
  - id: energy_conversion
    applies_to: "site_electricity; traction_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "1 kWh = 3.6 MJ exactly; store AC-input electricity and its supply profile; no fuel-energy conversion without actual LHV and compatible fuel composition."
  - id: freight_activity
    applies_to: "activity_contract_road"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: ""
    required_unit: "t*km"
    rule: "1 t = 1000 kg; use measured gross parcel mass including shipper packaging, and declared loaded segment km; volume may support allocation but is never silently converted to mass."
  - id: physical_assets
    applies_to: "sorter_asset; it_asset; diesel_van; petrol_van; electric_van; diesel_truck"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "One item is one complete recorded physical asset configuration, not one hour. Activity/lifetime activity is a dimensionless asset fraction. All future life assumptions need source and sensitivity."
  - id: floor_time
    applies_to: "activity_building_asset"
    required_property_ref:
      name: "Area*time"
      uuid: ""
    required_unit: "m2*a"
    rule: "m2*a = measured occupied square metres × days/365; distinguish shell asset service from elementary land occupation. No unit-item substitution."
process_map:
  - id: postal_sites
    name: "Acceptance, sorting, holding and service support"
    inclusion: "required"
    inclusion_condition: "Each physical site serving the cohort"
    role: "foreground"
    quantitative_reference: "attributed cohort activity / D"
  - id: road_operations
    name: "Collection, linehaul and last-mile road movement"
    inclusion: "required"
    inclusion_condition: "Own and/or contracted disjoint segments"
    role: "foreground and linked supply"
    quantitative_reference: "attributed cohort transport / D"
  - id: direct_emissions
    name: "Owned combustion, wear and refrigerant emissions"
    inclusion: "conditional"
    inclusion_condition: "Actual own source occurs; receiving compartment identified"
    role: "foreground"
    quantitative_reference: "species mass / D"
  - id: service_completion
    name: "Final receipt and outcome reconciliation"
    inclusion: "required"
    inclusion_condition: "Closed accepted cohort, D>0"
    role: "reference output"
    quantitative_reference: "1 Item(s)"
  - id: support_contract_road
    name: "Support interface / foreground activity: Ambient road parcel carriage on a contracted leg"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace the full purchased carrier lifecycle service on its existing exclusive segment/attempt boundary with supplier-owned physical inventories. Keep custody gates, all customers, failed/repeated attempts, empty returns, idling and terminal losses. No overlap with operator-owned legs or another supplier service."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_road_infrastructure
    name: "Support interface / foreground activity: Use of a specified road section by a declared vehicle class"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace road lifecycle provision with one real complete specified constructed section at construction-completion/open-to-traffic gate; later maintenance/renewal and EOL are separate physical exchanges."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_charging_asset_service
    name: "Support interface / foreground activity: Availability of a configured charging apparatus, excluding electricity"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace lifecycle availability hours with a genuine complete factory-gate charger product plus actual external installation, replacement maintenance and EOL. H_k remains an attribution driver, not a physical flow or an item equivalence."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_building_asset
    name: "Support interface / foreground activity: Postal building shell occupancy, excluding operation utilities"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace non-operational building occupancy lifecycle service with a real completed construction-gate building product in physical m2, and separate actual repair and demolition exchanges. Site utilities remain independent."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
