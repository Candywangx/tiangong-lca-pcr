      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Inspect asset inventory and service records; use physical life and activity, not book depreciation; zone-map measured floor area; verify supplier includes each maintenance/replacement pathway Aggregation method: equipment fraction=attributed activity/lifetime activity; building=mapped attributable m2×days/365; divide by D once; never count original components again"
