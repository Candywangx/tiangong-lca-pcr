allocation_rules:
  - rule_id: allocation_cohort
    applies_to: "All burdens and output"
    rule: "Use a closed acceptance cohort by service class, weight/size band, route and promised time. A = D + R + L + X with unique accepted IDs: delivered D, finally returned R, lost/destroyed L, other documented final failure X. Open cases prevent closure and publication of a complete cohort. Include all accepted cohort burdens, including failed attempts and returns, and divide once by D > 0. A second posting is a new linked acceptance only with a distinct contract; do not duplicate the original output."
    source_ids:
      - upu-parcel-service
  - rule_id: allocation_transport
    applies_to: "Own-operated shared vehicles"
    rule: "Subdivide by physical route and technology first. For each loaded segment j allocate observed energy/emissions by cohort gross parcel mass on board / gross mass of all freight on board; integrate actual segment distance in activity. Allocate empty/idle energy to the same closed duty cycle using loaded mass-distance shares. Include all customers/products in denominators. Where capacity is demonstrably volume-limited, use measured external parcel volume consistently for all loads and report mass results plus sensitivity; do not use tariff dimensional weight without physical evidence. Zero loaded activity or absent all-load denominator is unresolved."
    source_ids:
      - ghg-scope3-2013
  - rule_id: allocation_sites
    applies_to: "Shared hubs and support"
    rule: "Direct submeter/issue assignment first. Allocate sorter energy and equipment by measured operation seconds attributable to the cohort over all-service seconds; other site utilities, IT and common support by measured accepted-cohort handling work-seconds / all-function work-seconds. The all-function denominator explicitly includes observed pre-acceptance reject_work_seconds, standalone counter work and other service work. Assign their shares outside this accepted-parcel cohort; excluding rejected IDs from A alone must not leave their site burdens inside this cohort. Building occupied area-time is assigned by mapped functional zone use, with shared zones using those work-second shares. Include idle base loads over the same period. Measure representative tasks across each site and peak/nonpeak condition; extrapolation weights follow actual task counts and must reconcile to complete site totals. No revenue split."
    source_ids: []
  - rule_id: allocation_returns
    applies_to: "Rejected items, inventory and recovered waste"
    rule: "Pre-acceptance rejected enquiries belong to the separate counter service pool; acceptance activity for the delivered service must still be assigned. Internal transfers, sort passes and in-process stock are ledger events, not delivered reference outputs. Returned parcels remain customer property, not waste; only actual operator-generated discarded material enters waste cards. Operational recycling receives treatment burden once without automatic avoided-production credit."
    source_ids: []
  - rule_id: allocation_damage_loss
    applies_to: "Lost and damaged customer parcels"
    rule: "Count a delivered damaged parcel in D only when receipt is accepted under the declared service/quality class; retain a damaged flag and disclose accepted quality. Rejected damaged delivery stays failed until final return/loss resolution. Retain repair, storage, repeated travel and actual waste-treatment service attributable to the closed cohort. Customer goods remain a carried-object mass ledger; do not insert the goods manufacture, replacement product or monetary compensation as parcel-service material. If goods are actually destroyed, record custody, mass and legally authorized disposal as a separate customer-goods treatment contribution with explicit owner and boundary, never relabel the entire parcel as operator packaging waste."
    source_ids: []
  - rule_id: allocation_charge_sources
    applies_to: "charging and battery stocks"
    rule: "For verified positive gross source additions I_k>0 only; zero-addition occupied events follow allocation_charge_zero. Use chronological weighted-average source accounting for each physical battery AC-equivalent energy stock. Retain S_bk by originating charging session/source k; each validated stock increase enters its source once. Before each withdrawal e, remove e*S_bk/sum_k(S_bk) from each source, then assign that withdrawal by the declared route/cohort shares. Battery transfers preserve this source vector and move equal quantities out/in, never new electricity. Opening stock needs evidenced source provenance; unknown origin remains a blocking gap. Carry remaining source fractions across periods; reconcile each source supplied = assigned draws/losses + exported stock + closing stock. Allocate charging-session capital/service hours by that source actual or evidenced forecast lifetime draws/losses assigned to each beneficiary divided by all such supported draws/losses; retain closing unconsumed capital/service shares with its source stock, revise estimates and reconcile on exhaustion. Forecasts require evidence, uncertainty and scenario disclosure, never arbitrary FIFO/whole-cohort distance substitution. Stored charge discarded or physically lost is a service loss assigned by that asset interval all-user activity shares, not an export credit; zero beneficiary with positive burden stays unresolved. No loss is added twice through the AC-equivalent curve and source ledger."
    source_ids: []
  - rule_id: allocation_charge_zero
    applies_to: "charging hours and direct failed-attempt electricity"
    rule: "Classify each occupied charging event by verified gross new stored-energy source addition I_k, not net SOC change: positive addition followed by withdrawal/loss remains I_k>0. Missing or unresolved meter/BMS evidence is not I_k=0. For I_k>0 use allocation_charge_sources. For verified I_k=0 create no fictitious energy source: if dispatch/reservation evidence identifies one causal order/cohort, assign its hours and measured failed-attempt electricity directly to that cause, including failed/cancelled orders without adding successful output. If only a causal vehicle/task set is known, share within that recorded causal set by its attributed actual service elapsed time, including failed attempts and charging wait, using the existing mutually exclusive route/time pools and all customers. For genuinely shared failure with no separable causal task, use one fixed apparatus/site local-calendar-day failure pool, split cross-midnight intervals first, and allocate by all evidenced beneficiary service elapsed hours that day, including failed attempts/waits and non-study work. Fix timezone and beneficiary evidence; never choose a larger window or substitute arbitrary km/revenue. Shared time is partitioned once, not copied to every order. Positive burden with missing beneficiary evidence or zero elapsed denominator remains incomplete. Direct, causal-set and shared-day assignments are mutually exclusive and shares sum to one before study selection. These zero-addition hours remain in the same complete-life occupied-hours denominator; never assign them again through a source vector. Metered AC that never enters stock is a direct event loss/operational burden under the same shares, included once and removed from any residual route-energy pool. A zero net battery change with evidenced positive gross charge is not a zero-addition failure. I_k is gross addition from this charging event only; imported charged batteries retain their previous source vector and capital carryover, never constitute a new charging source or another session hour."
    source_ids: []
  - rule_id: allocation_waste_origin
    applies_to: "waste_cardboard; waste_paper; waste_pp"
    rule: "Fix each ordinary solid-waste generation event to its original service cohort and stratum at generation, never at later dispatch. Directly trace the generating task first; shared generation uses the existing site/handling allocation driver over the recorded generation interval, including all customer and noncohort workloads. Preserve event ID, generation date, original shares and original reference denominator through storage and internal transfers. Acquired old waste is not new generation. Retained waste keeps its original treatment responsibility; dispatch-period service does not inherit it. Record site timezone before period assignment. Shared-generation intervals are fixed local calendar months: split months first and use only same-month all-user site/handling drivers, not the later dispatch period or repeated full-cohort totals."
    source_ids: []
  - rule_id: allocation_carrier_recovery
    applies_to: "contracted R134a recovery"
    rule: "An external handover meeting evidenced product acceptance is a separate physical kg output, with no substitution credit and no delivery-reference count. Use the handover cut-off: the service retains necessary vehicle maintenance, compliant recovery and safe handover work through the gate; the recipient bears onward transport, regeneration, upgrading and use. Extra separation, purification or product-specific packaging undertaken to make a saleable product belongs to that product and is physically subdivided away from delivery. If actual shared loads cannot be separated and the cut-off cannot be evidenced, block completion pending a separately reviewed multifunction allocation. The waste branch retains the compatible actual treatment burden in the service. Never classify the same batch/handover ID as both product and waste. Internal reuse is a transfer only."
    source_ids: []
  - rule_id: allocation_site_refrigerant_recovery
    applies_to: "site_r134a_recovered_product; site_r134a_generated_waste"
    rule: "An external handover meeting evidenced product acceptance is a separate physical kg output, with no substitution credit and no delivery-reference count. Use the handover cut-off: the service retains necessary HVAC asset maintenance, compliant recovery and safe handover work through the gate; the recipient bears onward transport, regeneration, upgrading and use. Extra separation, purification or product-specific packaging undertaken to make a saleable product belongs to that product and is physically subdivided away from delivery. If actual shared loads cannot be separated and the cut-off cannot be evidenced, block completion pending a separately reviewed multifunction allocation. The waste branch retains the compatible actual treatment burden in the service. Never classify the same batch/handover ID as both product and waste. Internal reuse is a transfer only. For waste-tagged stock, original generation responsibility and complete treatment follow calc_refrigerant_waste_origin; dispatch time does not reset responsibility."
    source_ids: []
  - rule_id: allocation_atomic_physical
    applies_to: "supporting physical inventory"
    rule: "For each provider, site, configuration, event and accounting interval, partition every measured physical total into mutually exclusive inventory owners before selecting the study cohort. Use the fixed activity driver for that support process, with all users and failed work in the denominator. Direct causal attribution precedes shared allocation. Never multiply a cohort share a second time if already attributed. Keep service-level allocation quantities as raw drivers, not exchange quantities, and do not repeat division by the final reference count. Meter/stock, installed/replaced assets, internal transfers, generated waste and fate balances must reconcile at the same physical/time boundary. A complete product gate may retain its manufacturing background, but a lump service row may not be reintroduced under a different label."
    source_ids: []
  - rule_id: allocation_atomic_capital
    applies_to: "manufacture; installation; terminal assets"
    rule: "For each physical asset serial/cohort a, Q_a is its actual manufacturing/construction-gate quantity in the card unit. Set f_c,a=attributed physical lifetime activity_c,a/evidenced full-life all-user activity_a, using the process/asset-specific driver and identical configuration/capacity units. Manufacture q=sum(Q_a*f_c,a)/N_ref; each initial and whole-asset replacement creates its own asset cohort and enters once, not an additional current-period maintenance item. Installation physical quantities outside the asset product gate use that same installed-asset fraction. Terminal residual quantity in its own declared unit, evidenced from matched retirement or a prospective residual/reuse/retention plan, uses exactly the same f_c,a and original reference denominator; actual custody transfers only verify/update it. Earlier removed parts are excluded from terminal residual. Restate life and all original beneficiary cohorts under calc_capital_restatement; lifetime estimates need evidence and sensitivity, never numeric defaults. Genuine component repairs/replacements use actual causal events or the fixed provider maintenance-year shares, not another whole-life fraction. A whole component reused as a separately commissioned capital asset instead receives its own serial/lifetime register, never both treatments."
    source_ids: []
  - rule_id: allocation_capital_restatement
    applies_to: "sorter_asset; it_asset; diesel_van; petrol_van; electric_van; diesel_truck; u_contract_road_diesel_van; u_contract_road_petrol_van; u_contract_road_electric_van; u_contract_road_diesel_truck; u_contract_road_eol_diesel_van; u_contract_road_eol_petrol_van; u_contract_road_eol_electric_van; u_contract_road_eol_diesel_truck; u_road_infrastructure_constructed_section; u_road_infrastructure_eol_asphalt; u_road_infrastructure_eol_concrete; u_charging_asset_service_charger_manufactured; u_charging_asset_service_installation_concrete; u_charging_asset_service_installation_ac; u_charging_asset_service_charger_eol; u_charging_asset_service_foundation_concrete_eol; u_building_asset_building_constructed; u_building_asset_demolition_concrete"
    rule: "This PCR uses full restatement, not frozen historical shares or a retirement-period catch-up. All direct and supporting capital, reusable containers, installation outside the product gate and paired terminal sources follow calc_capital_restatement. Each specific activity rule fixes the driver and beneficiary shares; these are applied once. A complete asset background already including delivery/end-of-life follows the same restatement, without separate duplicate terminal exchanges. Routine component maintenance remains under its causal/period method."
    source_ids: []
  - rule_id: allocation_atomic_waste
    applies_to: "operational and maintenance wastes"
    rule: "Generated operational and maintenance waste retains its original generation event, provider/activity cohort, shares and original reference denominator through storage and transfers. Fixed shared-waste intervals are local calendar months with timezone declared; use same-interval causal activity and all users, unless an existing more specific maintenance-year or counter-period method applies. Reconcile closing=opening+generation+internal_in-internal_out-external_dispatch-evidenced_physical_loss on consistent material/moisture bases. Include supported eventual storage/transport/treatment for retained waste, with actual evidence or an explicitly evidenced compatible prospective route and uncertainty; unknown fate remains incomplete. Later receipts replace that original event model, not add a new dispatch-period burden. Asset terminal-waste uses its paired capital fraction instead. Waste carrier and its constituents, storage losses/releases and residual treatment cannot be counted twice; the same measured site/storage operation remains under one inventory owner."
    source_ids: []
  - rule_id: allocation_provider_maintenance_period
    applies_to: "u_contract_road_replacement_tyre; u_contract_road_lubricating_oil; u_contract_road_replacement_lfp_battery; u_contract_road_r134a_supply; u_contract_road_spent_tyre; u_contract_road_spent_oil; u_contract_road_spent_lfp_battery; u_contract_road_r134a_recovered_waste; u_contract_road_r134a_recovered_product; u_road_infrastructure_asphalt_maintenance; u_road_infrastructure_concrete_maintenance; u_road_infrastructure_maintenance_diesel; u_road_infrastructure_maintenance_ac; u_road_infrastructure_maintenance_asphalt; u_road_infrastructure_maintenance_concrete; u_charging_asset_service_replacement_cable; u_charging_asset_service_maintenance_ac; u_charging_asset_service_removed_cable; u_building_asset_repair_concrete; u_building_asset_replacement_window; u_building_asset_repair_ac; u_building_asset_removed_window"
    rule: "For every shared routine supporting-provider maintenance pool, fix interval y to the site-local calendar year with timezone and exact asset/site/configuration recorded. Split a cohort crossing years into its within-year activity. Actual installed/consumed material M_x,y and its separately measured generated waste use s_c,y=cohort-attributed beneficiary driver_y/all-beneficiary driver_y for that same year, then q=sum_y(M_x,y*s_c,y)/N_ref once. The driver is the physical support-process activity fixed in activity_*; for vehicle upkeep it is actual vehicle kilometres including once-attributed empty/failure travel, for variable road upkeep it is evidenced class-specific engineering damage in the same year, and for building fabric it is reserved floor-area-calendar-hours. Other shared support equipment uses its fixed actual all-beneficiary task/cycle/union-hour driver; retain exact configuration strata and no concurrency duplication. A signed maintenance work order fixes the causal asset and task pool before calculation, not a later modeller choice. Specific accident/failure repair is allocated exclusively to its evidenced causal order/task set, never also to the annual routine pool. Genuine component consumption excludes unused opening/closing stocks, uninstalled returns and internal transfers; generated removed parts retain this original event/year/share through later custody. No assumption that input and removed-part masses are identical. Apply one annual period share, not whole-life f, to real component repairs; entire replacement assets create separate capital cohorts instead. A positive unsupported pool or zero/unknown all-user denominator blocks completeness. Apply the same rules to retained provider maintenance cards where previously referenced; independent specific generation/fate balances and exact overlap exclusions remain mandatory."
