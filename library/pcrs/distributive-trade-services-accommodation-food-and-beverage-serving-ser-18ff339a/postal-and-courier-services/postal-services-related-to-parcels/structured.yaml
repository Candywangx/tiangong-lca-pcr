      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Weigh complete labels/boxes/tape by batch and issue count; read supply water meter; record actual configurations and applicability Aggregation method: net issue=opening+external receipts-closing-external supplier returns-nonservice uses-out-of-system transfers; internal unused-stock returns enter closing and are not another deduction; reconcile label face/adhesive/liner mass and coating composition; assign direct jobs, then shared work-second share; divide by D once"
