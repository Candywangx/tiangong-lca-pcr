  calculation_rules:
    - id: calc_denominator
      applies_to: "delivered_parcel"
      rule: "A = D + R + L + X; D>0; q_output = D/D = 1"
      inputs:
        - cp_cohort
      output: "Item(s)"
      source_ids: []
    - id: foreground_interface_method
      applies_to: "svc_contract_road; svc_road_infrastructure; svc_charging_asset_service; svc_building_asset"
      rule: "Before measurement classify every event/scope component as foreground physical or external service under boundary_atomic_support, with no overlap. Apply existing physical-card formulas, component rules and cp_support protocols only to the former, never demand an external provider BOM or internal meter ledger to activate a service interface. For a service row s collect raw A_s,e in its fixed native unit and alpha_s,e from the existing named activity allocation: direct cohort events have alpha=1; genuinely shared events retain the original all-user driver, failure/empty/standby treatment and event window. Allocated service amount T_s=sum(A_s,e*alpha_s,e); if the native activity ledger already contains cohort-attributed activity, alpha is already applied and must not be multiplied again. q_s=T_s/N_ref, with N_ref the original positive cohort reference output. Preserve raw totals for zero output and mark the unit result incomplete. Do not convert time, area, count or transport activity to energy or equipment mass without a separate evidenced relationship. Do not apply physical capital life fractions again to a service inventory that already contains its capital allocation. Quantities for background linkage equal q_s times an inventory per one identical service unit, once; an emission factor is not the service exchange quantity. All old physical-only instructions and service prohibitions apply only to the foreground physical branch; the service branch follows this rule and its explicit interface protocol. Incomplete or aborted service events retain their evidenced attributable burden. Do not silently discard them because the interface counts completed units: document an equivalent native service quantity supported by the contract and execution records, or add a separately identified partial-service row before claiming completeness; never assume a full unit or zero. A supplier value already per the final reference is not a raw A_s,e: recover its original total and denominator before recomputation, or prove exact equivalent normalization without dividing by the final denominator again. Any included supplier allocation is applied only once."
      inputs:
        - cp_interface_contract_road
        - cp_interface_road_infrastructure
        - cp_interface_charging_asset_service
        - cp_interface_building_asset
      output: "native service units per original reference flow"
      source_ids: []
    - id: calc_interface_contract_road
      applies_to: "svc_contract_road"
      rule: "Apply foreground_interface_method. Native activity A_s,e (t*km): sum(actual gross payload tonnes * actual loaded leg km); retain the original closed empty/idle cycle and failed carriage in the matched service scope. Use the existing activity_contract_road beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_contract_road
        - activity_contract_road
      output: "t*km/D"
      source_ids: []
    - id: calc_interface_road_infrastructure
      applies_to: "svc_road_infrastructure"
      rule: "Apply foreground_interface_method. Native activity A_s,e (vehicle*km): actual vehicle km on the identified section/class, including empty/failure km; service covers road construction, upkeep and terminal responsibility with the existing fixed and damage allocation policy. Use the existing activity_road_infrastructure beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_road_infrastructure
        - activity_road_infrastructure
      output: "vehicle*km/D"
      source_ids: []
    - id: calc_interface_charging_asset_service
      applies_to: "svc_charging_asset_service"
      rule: "Apply foreground_interface_method. Native activity A_s,e (h): actual nonoverlapping apparatus occupancy hours assigned under the existing positive-source/verified-zero event rules, including concurrent-port shares; electricity is excluded. Use the existing activity_charging_asset_service beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_charging_asset_service
        - activity_charging_asset_service
      output: "h/D"
      source_ids: []
    - id: calc_interface_building_asset
      applies_to: "svc_building_asset"
      rule: "Apply foreground_interface_method. Native activity A_s,e (m2*a): actual occupied floor area m2 * elapsed years on the documented calendar basis, zoned and assigned by the original all-user shares. Use the existing activity_building_asset beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_building_asset
        - activity_building_asset
      output: "m2*a/D"
      source_ids: []
    - id: calc_rows
      applies_to: "all inventory"
      rule: "q_r = sum(raw total_rj × cohort attribution_rj) / D; if already attributed do not multiply again; preserve original totals and units The applicable calc_electric_stock or calc_provider_electric_stock already returns final traction MJ per D; use that value directly on its traction row with no extra share, 3.6 or division by D."
      inputs:
        - cp_energy
        - cp_material
        - cp_waste
        - cp_transport
      output: "row-specific unit per delivered item"
      source_ids: []
    - id: calc_electric
      applies_to: "site_electricity"
      rule: "q_site_MJ=3.6*site_kWh_assigned/D; exclude traction charger inlet AC from the site meter ledger. calc_electric_stock directly outputs traction MJ/D; do not convert or normalize that result again."
      inputs:
        - cp_energy
      output: "site MJ / Item(s)"
      source_ids: []
