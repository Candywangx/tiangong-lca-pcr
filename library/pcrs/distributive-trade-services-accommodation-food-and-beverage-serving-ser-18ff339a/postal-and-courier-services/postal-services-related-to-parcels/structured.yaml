    - protocol_id: cp_transport
      process_id: "road_operations"
      flow_role: "diesel_fuel; petrol_fuel; traction_electricity; activity_contract_road"
      record_type: "segment, vehicle and energy register"
      raw_fields: "segment_id; subcontractor/own; start/end; route_km; all load IDs/mass/volume; vehicle fuel/technology; fuel stocks and fuel density; charger AC_kWh; idle/empty_km; contract included processes; supplier life-cycle coverage battery/session IDs; opening/closing calibrated stored kWh and SOC; traced battery transfers; paired inlet-AC/stored-energy curve; measured usable capacity; configuration/temperature/age; synchronized times source-vector S_bk; chronological charging/draw/transfer events; per-source opening/closing kWh; actual/forecast beneficiary draws and uncertainty; capital-hour carryover ledger; event/session ID and start/release time; site timezone and calendar day; verified gross source addition I_k and its meter/BMS evidence; positive/zero/unknown classification; failure/cancellation reason; causal order/cohort or vehicle/task-set IDs; all-user attributed service elapsed hours including failed attempts/waits; shared-day beneficiary evidence; direct-event AC kWh; mutually exclusive branch/share ledger; electricity/source/capital overlap crosswalk"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Record every loaded/empty route segment and custody handoff; weigh gross parcels including shipper packaging, measure external dimensions; match fuel/charging to duty cycle and invoices; check carrier boundary Aggregation method: own: allocate loaded and empty/idle energy by allocation_transport; contracted: sum observed gross parcel kg×segment km/1000; no energy duplicate For BEVs meter inlet AC and validate DC/BMS stored energy against matched charge/discharge tests; establish an empirical AC-equivalent stored-energy curve for the same battery configuration, temperature and age. A SOC percentage times nominal capacity or a nominal efficiency is insufficient. Join batteries/session stocks and route intervals under calc_electric_stock before allocation; missing stock/curve evidence blocks completeness. Apply allocation_charge_sources to all battery imports/exports and source-to-cohort attribution; transfer direction is measured at the same energy-stock boundary, with no credit for discarded charge. Retain every occupied attempt including failed/cancelled and verified zero-addition events. Measure gross addition separately from net stock change and concurrent draws; missing evidence stays unknown. Apply allocation_charge_sources only for positive I_k and allocation_charge_zero for verified zero I_k. Link causal dispatch/reservation and all-user service-time records; fix local timezone and split shared events at midnight. Reconcile branch hours to apparatus/bay occupancy and direct-event electricity to the same meter ledger once, with no fictitious stock source or route-energy duplication. Every earlier traction/motion/stop allocation in this protocol applies only to E_route after subtracting the independently metered E_zero under the section 8 electricity rule; E_zero follows its event shares once."
      unit: "kg; km; m3; kWh; t*km"
      frequency: "each segment/duty cycle; monthly reconciliation"
      temporal_coverage: "all cohort trips through closure; same all-customer duty cycles"
      site_scope: "all owned/contracted legs, including failed delivery and returns"
      aggregation_rule: "per declared reference flow"
