validation_rules:
  - rule_id: validate_scope
    applies_to: "Service and qualifiers"
    rule: "Require evidence of USO contract/legal scope, domestic origin/destination, acceptance and receipt gates, promised service time, observed duration, weight/size distribution, distance, modality, owner split and declared technology configurations. Domestic and international, road and air, ordinary and guaranteed-time services cannot be pooled as equivalent."
    source_ids:
      - un-cpc3-68012
      - upu-parcel-service
  - rule_id: validate_service_interfaces
    applies_to: "svc_contract_road; svc_road_infrastructure; svc_charging_asset_service; svc_building_asset"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_accounting
    applies_to: "All row IDs and protocols"
    rule: "Check every card identity, process/direction/type, property/unit, protocol, observed total, attribution and exactly-one normalization. Reconcile cohort A=D+R+L+X, material stocks and issue/waste balances, meter versus invoices and all-load/handling denominators. Reject any D<=0, open cohort, double-covered route or asset component. Verify mutually exclusive positive-source/verified-zero charging branches and no double electricity allocation. Test retained waste generation in cohort A and later transfer in cohort B: treatment remains with A and later receipts replace its model, without new B waste/treatment. Check each refrigerant receipt, source batch, stock, first-use assignment, movement and external ownership/status. Verify gross/tare/net and constituent evidence, no second carrier/component exchange, and no duplicated upstream processing or retirement scope."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "Identity and missing data"
    rule: "Empty UUID is an explicitly unbound candidate, not a false identity. Before a finalized dataset, verify exact official response/receipt hashes, record state, bilingual name, qualifiers, flow type/property/unit and emission compartment for each binding; search similarity is insufficient. Missing amounts/factors require collection or a cited compatible proxy with uncertainty, never zero. No PCR default consumption, weight, density, factor or compliance limit is supplied."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "Bilingual and machine rules"
    rule: "Both languages must retain matching ordered rule IDs, row IDs, protocol references, gates, formulas, conditions, prohibitions and units. Sync from canonical Markdown and compare actual guidance units and scope, not merely schema/hash. Candidate/authored and translation aligned are structural authoring states, not scientific approval or publication."
    source_ids: []
  - rule_id: validate_atomic_support
    applies_to: "all support and emission rows"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_capital_restatement
    applies_to: "sorter_asset; it_asset; diesel_van; petrol_van; electric_van; diesel_truck; u_contract_road_diesel_van; u_contract_road_petrol_van; u_contract_road_electric_van; u_contract_road_diesel_truck; u_contract_road_eol_diesel_van; u_contract_road_eol_petrol_van; u_contract_road_eol_electric_van; u_contract_road_eol_diesel_truck; u_road_infrastructure_constructed_section; u_road_infrastructure_eol_asphalt; u_road_infrastructure_eol_concrete; u_charging_asset_service_charger_manufactured; u_charging_asset_service_installation_concrete; u_charging_asset_service_installation_ac; u_charging_asset_service_charger_eol; u_charging_asset_service_foundation_concrete_eol; u_building_asset_building_constructed; u_building_asset_demolition_concrete"
    rule: "Check original cohorts/denominators, all-user driver, source versions, booked amounts and restatement corrections under calc_capital_restatement. Reject frozen old history with only future-denominator changes, retirement-balance transfer to unrelated current output, and negative physical exchanges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate parcel service foreground with upstream energy/material/assets and operational waste-treatment links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same qualified domestic road USO service; downstream goods LCA may link this service once"
  excluded_use: "Whole CPC 68012 equivalence, courier, international, air/sea/rail, cold chain, goods production and unqualified cross-service comparisons"
  required_metadata: "All reference qualifiers; D and A/R/L/X; cohort and route stratum; methods and sources; owner/supplier coverage; raw-to-normalized audit trail; charging branch and failure-event ownership/timezone records; waste generation-origin ownership, retained stock and receiver-model revision chain; signed foreground/interface responsibility matrix, native service activity and background coverage; original physical activity, manufacture/terminal pairing and species basis only for foreground-owned components"
  required_quality_disclosure: "Unbound identities; missing quantities/factors; proxies; sampling and allocation uncertainty; lifetime sensitivity; limited scope and incomplete components"
  update_trigger: "USO or route/gate/service change; new fuel/material/refrigerant/asset; altered factor/supplier boundary; evidence correction; annual cohort refresh; charging event evidence/branch correction; later waste receipt/fate or generation correction updates the original-cohort model; foreground physical identity/speciation changes or external interface configuration/unit/coverage changes require applicable concrete-row review and fresh projection"
