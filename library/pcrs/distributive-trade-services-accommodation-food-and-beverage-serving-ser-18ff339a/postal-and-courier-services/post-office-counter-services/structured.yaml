allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "foreground_burden_allocation"
    rule: "First use dedicated meters, tagged stock issue and device/request logs to avoid allocation. For remaining shared loads, allocate by the physical driver specified below across all office functions, including excluded services; charge only the target share. Never divide the whole office burden by target successful transactions."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_session
    applies_to: "foreground_burden_allocation"
    rule: "Measure direct piece handling first, using non-overlapping active intervals for each staffed window/resource. Allocate measured genuinely common session activity equally only among the actual pieces sharing that activity when the same mail form/procedure and equivalent demand on the activity are evidenced. Preserve common-activity ID, participating piece IDs and divisor. Do not copy full session time to every piece. Sum assigned piece seconds must equal actual resource-active session seconds, including failures/rework; record waiting separately. For heterogeneous procedures or unproven equal demands, time the distinct activity by piece/procedure or retain an allocation gap; never default to equal allocation."
    source_ids: []
  - rule_id: allocation_time
    applies_to: "foreground_burden_allocation"
    rule: "For each resource j and period define tagged active handling seconds T_sj for stratum s including successful, rejected, abandoned and reworked attempts. Unknown-type attempt time is allocated to strata in proportion to their tagged active seconds; retain its amount separately. Define w_sj as adjusted stratum seconds divided by adjusted seconds for every function served by j. If no tagged active seconds exist or causality is unproven, the shared-resource result is incomplete, not zero."
    source_ids: []
  - rule_id: allocation_idle
    applies_to: "foreground_burden_allocation"
    rule: "Use w_sj to assign resource j shared standby, idle, startup, shutdown and closed-period loads along with its shared active loads; do not drop those loads or divide by opening hours and again by throughput. Directly tagged failed/rework inputs stay with their stratum. A failed attempt creates no accepted output; all attributable failure inputs remain in the period numerator for the completed-output stratum. Disclose rates and sensitivity."
    source_ids: []
  - rule_id: allocation_premises
    applies_to: "foreground_burden_allocation"
    rule: "Map occupied floor areas without overlap. For a shared lobby or support area use its area multiplied by target counter scheduled staffed-window-hours divided by all functions scheduled staffed-window-hours using that area; include the full-area total in the reconciliation. Add directly reserved counter area. Multiply resulting effective area by all calendar hours in the accounting period, including closed hours, then assign strata using v_s, the adjusted active handling seconds for stratum s divided by adjusted active seconds of every transaction class using this reserved counter footprint, including stamp/financial/retail activities actually using it; this conditional share is not the whole-office share w_sj. This is F_s in m2*h; all office functions together must recover the full occupied area-hours. Zero denominator or missing floor/work schedule prevents completion."
    source_ids: []
  - rule_id: allocation_premises_inventory
    applies_to: "foreground_burden_allocation"
    rule: "For foreground-owned premises components only, apply the following physical method. External occupancy uses svc_premises_service with the same zoned beneficiary drivers and exclusions under foreground_interface_method; supplier internals are not foreground collection. The matched premises physical inventory uses one m2*h of the same occupied estate-period as its raw source denominator, never as a product exchange. Collect each metered energy carrier and fuel, water, cleaning product, refrigerant by species, maintenance material, building fabric/capital share and waste treatment separately. Submeter zones first; allocate residual lighting/HVAC/water/cleaning by serviced floor-area-calendar-hours, capital/fabric by reserved floor-area-calendar-hours and documented asset lifetime, and actual refrigerant loss by the same HVAC zone share. Keep each fuel combustion/emission species and compartment in that background. Exclude direct counter plug electricity, standalone devices, paper and remote IT already inventoried here. Match meter coverage and remove subcontract service overlaps before dividing background totals by estate occupied m2*h once. No generic rent-price conversion or unverified bundled service substitute."
    source_ids: []
  - rule_id: allocation_device
    applies_to: "foreground_burden_allocation"
    rule: "Each device serial number is charged once as consumed lifetime fraction: calendar hours installed in this period divided by evidenced total installed calendar lifetime, multiplied by w_sj across all functions served by that device; do not multiply by a second counter-use share. The equipment lifecycle dataset includes manufacture, replacements/repair and end-of-life, excludes operating electricity and paper. Integrated scanner/printer parts included in a complete computer/device are not also separate devices; separate peripherals require separate serial records. No default lifetime, device mass or utilization. Estimates need evidence, uncertainty and alternative-life sensitivity."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "foreground_burden_allocation"
    rule: "Record actual receipt-paper and liner waste by stream and destination. Outsourced treatment is linked once to the measured waste output; do not add the same treatment as an input if it is already included in that link or premises background. No avoided-burden credit, financial revenue or waste-contained substance is added as a second physical output. Recovered paper remains a waste transfer here; apply and disclose recycled-content accounting consistently."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_waste_origin
    applies_to: "foreground_burden_allocation"
    rule: "Fix each ordinary solid-waste generation event to its original service cohort and stratum at generation, never at later dispatch. Directly trace the generating task first; shared generation uses the existing site/handling allocation driver over the recorded generation interval, including all customer and noncohort workloads. Preserve event ID, generation date, original shares and original reference denominator through storage and internal transfers. Acquired old waste is not new generation. Retained waste keeps its original treatment responsibility; dispatch-period service does not inherit it. For shared generation, split records at each fixed local-calendar-month boundary (68013 uses its already declared counter accounting period instead); apply the existing site task/handling driver within that exact generation interval, not the full later dispatch/cohort window. Direct event attribution takes precedence. Record site timezone before period assignment."
    source_ids: []
  - rule_id: allocation_atomic_physical
    applies_to: "supporting physical inventory"
    rule: "For each provider, site, configuration, event and accounting interval, partition every measured physical total into mutually exclusive inventory owners before selecting the study cohort. Use the fixed activity driver for that support process, with all users and failed work in the denominator. Direct causal attribution precedes shared allocation. Never multiply a cohort share a second time if already attributed. Keep service-level allocation quantities as raw drivers, not exchange quantities, and do not repeat division by the final reference count. Meter/stock, installed/replaced assets, internal transfers, generated waste and fate balances must reconcile at the same physical/time boundary. A complete product gate may retain its manufacturing background, but a lump service row may not be reintroduced under a different label."
    source_ids: []
  - rule_id: allocation_atomic_capital
    applies_to: "manufacture; installation; terminal assets"
    rule: "For each physical asset serial/cohort a, Q_a is its actual manufacturing/construction-gate quantity in the card unit. Set f_c,a=attributed physical lifetime activity_c,a/evidenced full-life all-user activity_a, using the process/asset-specific driver and identical configuration/capacity units. Manufacture q=sum(Q_a*f_c,a)/N_ref; each initial and whole-asset replacement creates its own asset cohort and enters once, not an additional current-period maintenance item. Installation physical quantities outside the asset product gate use that same installed-asset fraction. Terminal residual quantity in its own declared unit, evidenced from matched retirement or a prospective residual/reuse/retention plan, uses exactly the same f_c,a and original reference denominator; actual custody transfers only verify/update it. Earlier removed parts are excluded from terminal residual. Restate life and all original beneficiary cohorts under calc_capital_restatement; lifetime estimates need evidence and sensitivity, never numeric defaults. Genuine component repairs/replacements use actual causal events or the fixed provider maintenance-year shares, not another whole-life fraction. A whole component reused as a separately commissioned capital asset instead receives its own serial/lifetime register, never both treatments."
    source_ids: []
  - rule_id: allocation_capital_restatement
    applies_to: "counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer; u_premises_service_building_gate; u_premises_service_concrete_demolition; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
    rule: "This PCR uses full restatement, not frozen historical shares or a retirement-period catch-up. All direct and supporting capital, reusable containers, installation outside the product gate and paired terminal sources follow calc_capital_restatement. Each specific activity rule fixes the driver and beneficiary shares; these are applied once. A complete asset background already including delivery/end-of-life follows the same restatement, without separate duplicate terminal exchanges. Routine component maintenance remains under its causal/period method."
    source_ids: []
  - rule_id: allocation_atomic_waste
    applies_to: "operational and maintenance wastes"
    rule: "Generated operational and maintenance waste retains its original generation event, provider/activity cohort, shares and original reference denominator through storage and transfers. Fixed shared-waste intervals are local calendar months with timezone declared; use same-interval causal activity and all users, unless an existing more specific maintenance-year or counter-period method applies. Reconcile closing=opening+generation+internal_in-internal_out-external_dispatch-evidenced_physical_loss on consistent material/moisture bases. Include supported eventual storage/transport/treatment for retained waste, with actual evidence or an explicitly evidenced compatible prospective route and uncertainty; unknown fate remains incomplete. Later receipts replace that original event model, not add a new dispatch-period burden. Asset terminal-waste uses its paired capital fraction instead. Waste carrier and its constituents, storage losses/releases and residual treatment cannot be counted twice; the same measured site/storage operation remains under one inventory owner."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "accept"
      flow_role: "accepted output and handling driver"
      record_type: "event_log"
      raw_fields: "mailpiece_id; session_id; stratum; first/last gate timestamps; staffed window/resource ID; direct piece seconds; common session activity ID and seconds; participating piece IDs/count and equality evidence; allocated handling seconds; outcome; receipt_id; handoff_id; correction/attempt links; reason"
      collection_method: "Capture at counter first handling, receipt issue and handoff; join acceptance, till and custody logs by mailpiece identifier, remove duplicate successful events, retain failed/reworked/abandoned events with elapsed active time and a null-output flag. Apply allocation_session before calculating T_sj; reconcile assigned piece seconds to actual resource-active session seconds. No personal customer identifier is required. Aggregation details: N_s is unique completed events in stratum s; calculate T_sj and w_sj by allocation_time; denominator is N_s once."
      unit: "Item(s); s"
      frequency: "each event; daily reconciliation"
      temporal_coverage: "one complete stated accounting period; align all resources"
      site_scope: "same office, all functions sharing resources"
      aggregation_rule: "per reference flow"
      quality_evidence: "anonymized event/receipt/custody reconciliation; timestamp clock checks; missing logs register"
    - protocol_id: cp_interface_premises_service
      process_id: "support_premises_service"
      flow_role: "svc_premises_service"
      record_type: "service_interface_register"
      raw_fields: "provider; contract/version; event ID; site/route/configuration; owner; scope component; native A_s,e and unit; alpha_s,e and all-user driver; original cohort/output denominator; inclusion/exclusion matrix; meter/time/count source; calibration; background reference/unit/period/allocation; correction and overlap links"
      collection_method: "At the actual service acceptance/use interface collect actual counter-area m2 * occupancy h during the complete counter reporting period; retain the original shared-space allocation. Record every executed event, including failed/reworked events required by the original method. Verify units against calibrated mass/distance/area/time records or deduplicated execution logs as applicable; reconcile to invoices without substituting money for activity. At contract start/change the service data custodian signs the boundary/ownership and background compatibility matrix; reconcile monthly and at original cohort closure. Record zero occurrence only from complete event registers. Missing activity, unit conversion, background coverage or identity remains incomplete; preserve uncertainty and evidence. Supplier internal measurements are not required for an external interface."
      unit: "m2*h"
      frequency: "each event; monthly; contract change; cohort closure"
      temporal_coverage: "same complete original reference cohort and actual service-event periods"
      site_scope: "declared external service acceptance/use gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed contract/scope matrix; primary activity records; calibration; allocation and invoice reconciliation; verified background identity and documented gaps"
    - protocol_id: cp_interface_remote_acceptance_it
      process_id: "support_remote_acceptance_it"
      flow_role: "svc_remote_acceptance_it"
      record_type: "service_interface_register"
      raw_fields: "provider; contract/version; event ID; site/route/configuration; owner; scope component; native A_s,e and unit; alpha_s,e and all-user driver; original cohort/output denominator; inclusion/exclusion matrix; meter/time/count source; calibration; background reference/unit/period/allocation; correction and overlap links"
      collection_method: "At the actual service acceptance/use interface collect count unique executed request IDs at the contracted backend gate, including separately executed failed/retried requests; one item is one request execution, not one successful counter output. Record every executed event, including failed/reworked events required by the original method. Verify units against calibrated mass/distance/area/time records or deduplicated execution logs as applicable; reconcile to invoices without substituting money for activity. At contract start/change the service data custodian signs the boundary/ownership and background compatibility matrix; reconcile monthly and at original cohort closure. Record zero occurrence only from complete event registers. Missing activity, unit conversion, background coverage or identity remains incomplete; preserve uncertainty and evidence. Supplier internal measurements are not required for an external interface."
      unit: "Item(s)"
      frequency: "each event; monthly; contract change; cohort closure"
      temporal_coverage: "same complete original reference cohort and actual service-event periods"
      site_scope: "declared external service acceptance/use gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed contract/scope matrix; primary activity records; calibration; allocation and invoice reconciliation; verified background identity and documented gaps"
    - protocol_id: cp_capital_restatement
      process_id: "accept_support_premises_service_support_remote_acceptance_it"
      flow_role: "counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer; u_premises_service_building_gate; u_premises_service_concrete_demolition; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
      record_type: "versioned_asset_cohort_ledger"
      raw_fields: "asset/source ID; source phase and native unit; original cohort/stratum and causal parent; original reference denominator and revision; all-user actual driver by original interval; fixed beneficiary shares; complete-life driver forecast/version and supporting records; manufacture/installation quantity; terminal net residual/route and version; previously booked attributed raw B and normalized result; recalculated f/A/q and signed correction; zero-use commissioning responsibility; overlap exclusions"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Join serial/source asset registers, activity meters, supplier product gates and the original result ledger; apply calc_capital_restatement on each change. Recompute using the original physical driver and all-user evidence without changing physical stocks. Reconcile old/new/correction and original denominator by source and original cohort; retain versions and calibration with the original record owner."
      unit: "source-native units; original driver units; Item(s)"
      frequency: "each acquisition/commissioning, activity, life/source revision and retirement; reconcile each original reporting period"
      temporal_coverage: "complete asset life and all affected original cohorts"
      site_scope: "all users of the same asset configuration; original product gate and separate installation/terminal sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "serial/source registers; calibration; life evidence; receiver records; original-cohort results and revision chain"
    - protocol_id: cp_energy
      process_id: "accept"
      flow_role: "counter_electricity"
      record_type: "meter_log"
      raw_fields: "meter_id; circuit map; opening/closing kWh; intervals; dates; device state; direct/shared flag; T_sj; supply boundary"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Read calibrated plug/submeters by shift and period endpoints; include standby, shutdown and closed hours. Subtract only independently metered noncounter circuits and reconcile with parent supply; no invoice-minus-unknown residual. Aggregation details: direct tagged plus shared period amount times w_sj; calc_energy then calc_normalize."
      unit: "kWh; MJ"
      frequency: "interval/shift and period ends"
      temporal_coverage: "same complete accounting period"
      site_scope: "mapped counter circuits, all associated devices"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter serial/calibration and circuit inventory; supplier location/voltage/scope"
    - protocol_id: cp_stock
      process_id: "accept"
      flow_role: "receipt_paper; acceptance_label"
      record_type: "stock_ledger"
      raw_fields: "stock_code; exact construction including adhesive and liner coating; opening/closing kg; receipts; transfers in/out; supplier/out-of-scope returns with destination and movement ID; internal unused-stock return; issued rolls/labels; measured mass; void/reprint issue; stock unit"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Weigh each stock product separately with calibrated scale at issue/return and period stocktake; alternatively verify representative roll/label mass by weighing a documented sample and retain sample variation. Reconcile purchases and stock movements by unique movement ID and destination. Internal unused rolls returned to the same stock boundary are already in closing inventory, so are not subtracted again. Supplier/out-of-scope unused returns must be disjoint from transfers out; no postage-value conversion. Aggregation details: calc_stock; direct issue by stratum, shared issue by w_sj only if physically justified; calc_normalize."
      unit: "kg; roll; label"
      frequency: "each movement and period stocktake"
      temporal_coverage: "same complete accounting period"
      site_scope: "counter stores and each directly tagged stratum; other functions separately"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier construction/grammage, weighed samples, scales and stock ledger; unexplained discrepancy retained"
    - protocol_id: cp_assets
      process_id: "accept"
      flow_role: "counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer"
      record_type: "asset_register"
      raw_fields: "serial; device model; component inclusion; installation/retirement; calendar lifetime; repairs; period installed hours; all served functional workload shares; w_sj; lifecycle dataset scope"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Inspect installed assets at opening/closing stocktakes, retain procurement/repair/retirement records and verify model/component coverage against lifecycle inventory. Justify expected lifetime if not retired and quantify its uncertainty. Aggregation details: calc_device then calc_normalize; one serial one total lifetime share across all functions."
      unit: "Item(s); h"
      frequency: "each installation/repair/retirement; period check"
      temporal_coverage: "same period plus evidenced complete lifetime"
      site_scope: "all devices serving counter including shared/integrated devices"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/photos/model inventory; supplier/repair evidence; documented lifetime scenarios"
    - protocol_id: cp_premises
      process_id: "accept"
      flow_role: "activity_premises_service"
      record_type: "facility_inventory"
      raw_fields: "zone_id; measured dedicated/shared m2; calendar hours; scheduled staffed-window-hours per function; zone meters by carrier; fuel/water/cleaning-material quantities; refrigerant species opening/closing/additions/recovery; maintenance and building asset quantities/lifetimes; wastes/destinations; direct counter exclusions; v_s"
      collection_method: "Measure floor plan once and after changes; read zonal utilities at period endpoints and intervals, collect actual material issues and maintenance/refrigerant logs by event, inspect asset registers and waste records. Build the matching occupied-premises background under allocation_premises_inventory, retaining each carrier/material/species as its own exchange. Never infer absence from a missing invoice. Aggregation details: calc_premises; reconcile sum of all functions with estate occupied area-hours and zonal utilities; calc_normalize."
      unit: "m2*h; carrier-specific energy/mass/volume; asset items"
      frequency: "period; each material/service event; floor plan at changes"
      temporal_coverage: "same complete period, all calendar hours including closed hours"
      site_scope: "same occupied estate and zones serving all office functions"
      aggregation_rule: "per reference flow"
      quality_evidence: "floor survey, work schedule, meters/calibration, material and service logs, background scope/crosswalk, no-overlap check"
    - protocol_id: cp_remote
      process_id: "accept"
      flow_role: "activity_remote_acceptance_it"
      record_type: "request_log"
      raw_fields: "endpoint; provider; request_id; operation; stratum; success/failure/retry; timestamp; request count; bytes; background scope/unit"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Capture application/server request logs at execution; include successful and failed/retried calls, join to counter attempts without duplicating request IDs. Obtain provider activity inventory per matched operation with data transfer, computing/cooling and hardware boundaries. Unavailable inventory blocks full upstream coverage. Aggregation details: calc_remote then calc_normalize; request count is independent of N_s."
      unit: "Item(s) requests; byte"
      frequency: "each executed request; period reconciliation"
      temporal_coverage: "same complete accounting period"
      site_scope: "actual endpoints used for counter acceptance only"
      aggregation_rule: "per reference flow"
      quality_evidence: "redacted request counts, provider scope/unit and allocation proof; failed-request coverage"
    - protocol_id: cp_waste
      process_id: "accept"
      flow_role: "receipt_paper_waste; glassine_liner_waste"
      record_type: "waste_transfer"
      raw_fields: "stream; exact material; container tare/gross/net; stratum/direct/shared; date; destination; treatment inclusion; issued paper/liner mass; stock residual; generation_event_id; generation_time/site; source task/cohort/stratum; original allocation shares/reference denominator; generated mass and wet/dry/composition basis; opening/closing stock by origin; internal transfer IDs and both endpoints; external dispatch; evidenced physical loss/release; receiver and destination fractions; actual/prospective route and model version; evidence/uncertainty; receipt replacement status and revision chain"
      collection_method: "Measure segregated generated mass at the generating point and record the responsible task/interval before storage; if generation is reconstructed from a complete stock balance, document all transfers, losses and measurement uncertainty and preserve original event provenance. Apply allocation_waste_origin and calc_waste_origin. At each transfer and period close reconcile origin-labelled stocks against calibration and receiver evidence. Require supported storage/transport/treatment coverage for retained mass; later receipts replace the original event model, never create a second dispatch-period burden. Segregate receipt paper and liner; reconcile generated waste with net stock issue and paper/labels transferred to customers; retain incompatible material identity/fate gaps."
      unit: "kg"
      frequency: "each transfer; period balance; every ordinary-waste generation and monthly origin-stock reconciliation"
      temporal_coverage: "same complete accounting period; retain original generation ownership through eventual treatment evidence"
      site_scope: "counter-generated waste only, separately attributed to strata"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/tare logs, transfer note, treatment scope, material balance and unexplained residual"
    - protocol_id: cp_support_premises_service
      process_id: "support_premises_service"
      flow_role: "u_premises_service_electricity; u_premises_service_tap_water; u_premises_service_natural_gas; u_premises_service_hot_water_heat; u_premises_service_building_gate; u_premises_service_sanitary_wastewater; u_premises_service_concrete_demolition; u_premises_service_co2_fossil_air; u_premises_service_no_air; u_premises_service_no2_air"
      record_type: "physical_exchange_and_asset_register"
      raw_fields: "event/asset/site/provider/configuration; exact product/substance; phase; Q_x,j and native unit; source intensity and activity basis; lifetime activity and f; terminal asset link and residual unit; stock and transfer IDs; original waste event/cohort; meter/calibration; all-user driver; overlap ownership; prospective route version; occurrence evidence; species identity/CAS, T and NO2-equivalent definition, source-matched molar a, molecular-mass provenance, direct species mass/factor and calibration; gas meter volume; temperature/pressure and reference state; moisture basis; batch-specific NCV and evidence; energy basis of supply dataset and combustion factor"
      collection_method: "Collect only active foreground physical components under foreground_interface_method; external services use cp_interface_ protocols. Only the estate-period and zone-matched counter accommodation under allocation_premises_inventory; direct devices, plug loads, paper and remote IT excluded. Retain allocation_premises, allocation_premises_inventory, cp_premises, calc_premises and calc_normalize. Zone-submeter first. For residual operational lighting/HVAC/water/cleaning, use serviced floor-area-calendar-hour shares; for capital/fabric, reserved floor-area-calendar-hours plus evidenced asset lifetime. Compute F_s=(dedicated counter m2+shared m2*counter scheduled staffed-window-hours/all served functions scheduled staffed-window-hours)*all period calendar hours*v_s, where v_s is adjusted active handling seconds of stratum/all classes using this footprint. The physical provider total and its chosen zone/resource pool must recover the same estate-period; Use/maintenance q=provider same-period total*fixed pool-to-F_s share/N_s once. Capital and EOL have identical consumed-life fraction. Do not use whole-office w_sj as v_s or reapply estate intensity/F_s twice. Quantity convention: operational-period q=Q_period*a/N applies only to use and maintenance, where Q_period is a raw measured physical period/event total and a is its fixed reconciled allocation share. For production use raw manufacture/construction-gate physical asset quantity Q_a and q_prod=Q_a*f/N. For each linked terminal stream use that same asset cohort full-lifecycle terminal physical quantity Q_e and q_eol=Q_e*f/N with exactly the same f; Q_e is not a later-period whole dispatch. Here f already contains the asset lifetime-service fraction and the target cohort/stratum allocation, each once; do not multiply by a second operational share. Q_a and Q_e are never already amortised provider-period equivalents. If a supplier gives amortised equivalents, recover and verify the original asset cohort physical quantity and full-life denominator before applying this convention; never multiply an already consumed-life quantity by f again. N means the original D for 68011 or N_s for 68013, once. At each provider/source gate, collect event/asset/site/route/configuration and exact physical identity, condition of occurrence/non-occurrence, direction/type/receiving medium, raw quantity and unit, meter/tare/calibration, timestamps and timezone, complete accounting interval, source unit-inventory basis, all-user activity and cohort joins, manufacturing/installation/use/maintenance/EOL phase, original/remaining asset fractions, paired terminal residual provenance, stocks/transfers, receiver/fate and prospective-model revisions. Retain signed supplier scope and exact overlap crosswalk to existing direct rows. Obtain chemistry/BOM/species identity before adding a missing concrete row; an unbound candidate can await official identity but cannot be a plural collection. Measure all events, reconcile per local month/maintenance year as prescribed and review the complete asset/supplier inventory annually and at configuration/retirement changes. Unmeasured positive activity, unsupported future treatment or an unlisted actual exchange prevents completeness. Convert metered premises gas under calc_premises_gas_ncv. Use supply LCI and per-MJ factors on the same NCV basis; reject unconverted gross/unknown bases. Pass unallocated raw NCV MJ from the gas protocol to physical attribution. Restore same-scope raw totals from already allocated or reference-normalized supplier intensity first."
      unit: "card-native units; raw m2*h"
      frequency: "every event; local-month/maintenance-year reconciliation; annual/asset-change review"
      temporal_coverage: "The same complete counter accounting period, including failures and rework inside the counter gate. Track original asset-life and original waste-event receipt/treatment evidence separately without extending the acceptance-service gate into downstream transport or returns"
      site_scope: "same provider/site/configuration scope; all shared users"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated originals; signed scope and overlap map; asset/receipt lineage; uncertainty"
    - protocol_id: cp_support_remote_acceptance_it
      process_id: "support_remote_acceptance_it"
      flow_role: "u_remote_acceptance_it_datacentre_electricity; u_remote_acceptance_it_network_electricity; u_remote_acceptance_it_cooling_makeup_water; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
      record_type: "physical_exchange_and_asset_register"
      raw_fields: "event/asset/site/provider/configuration; exact product/substance; phase; Q_x,j and native unit; source intensity and activity basis; lifetime activity and f; terminal asset link and residual unit; stock and transfer IDs; original waste event/cohort; meter/calibration; all-user driver; overlap ownership; prospective route version; occurrence evidence; species identity/CAS, T and NO2-equivalent definition, source-matched molar a, molecular-mass provenance, direct species mass/factor and calibration"
      collection_method: "Collect only active foreground physical components under foreground_interface_method; external services use cp_interface_ protocols. Executed remote barcode validation/record-write/acknowledgement requests for the declared acceptance endpoint; includes failures/retries, excludes ongoing delivery tracking. Retain cp_remote, calc_remote and calc_normalize. Deduplicate actual request IDs and join request/stratum/endpoint/time/bytes and measured CPU/network/cooling workload. For each explicitly bounded provider-period resource pool, attribute its measured physical total by measured acceptance-operation workload/all served-operation workload, then the documented stratum request workload share; reconcile all other workloads and baseline/idle demand, never drop idle infrastructure or assume one request per accepted mailpiece. Use/maintenance q=provider same-period physical total*fixed attributable share/N_s once. For capital and EOL use the same f below, which already includes the evidenced installed-life fraction and operation share once. Request count/bytes alone is insufficient without provider evidence linking them to resource consumption; missing mapping blocks completion. Quantity convention: operational-period q=Q_period*a/N applies only to use and maintenance, where Q_period is a raw measured physical period/event total and a is its fixed reconciled allocation share. For production use raw manufacture/construction-gate physical asset quantity Q_a and q_prod=Q_a*f/N. For each linked terminal stream use that same asset cohort full-lifecycle terminal physical quantity Q_e and q_eol=Q_e*f/N with exactly the same f; Q_e is not a later-period whole dispatch. Here f already contains the asset lifetime-service fraction and the target cohort/stratum allocation, each once; do not multiply by a second operational share. Q_a and Q_e are never already amortised provider-period equivalents. If a supplier gives amortised equivalents, recover and verify the original asset cohort physical quantity and full-life denominator before applying this convention; never multiply an already consumed-life quantity by f again. N means the original D for 68011 or N_s for 68013, once. At each provider/source gate, collect event/asset/site/route/configuration and exact physical identity, condition of occurrence/non-occurrence, direction/type/receiving medium, raw quantity and unit, meter/tare/calibration, timestamps and timezone, complete accounting interval, source unit-inventory basis, all-user activity and cohort joins, manufacturing/installation/use/maintenance/EOL phase, original/remaining asset fractions, paired terminal residual provenance, stocks/transfers, receiver/fate and prospective-model revisions. Retain signed supplier scope and exact overlap crosswalk to existing direct rows. Obtain chemistry/BOM/species identity before adding a missing concrete row; an unbound candidate can await official identity but cannot be a plural collection. Measure all events, reconcile per local month/maintenance year as prescribed and review the complete asset/supplier inventory annually and at configuration/retirement changes. Unmeasured positive activity, unsupported future treatment or an unlisted actual exchange prevents completeness."
      unit: "card-native units; raw Item(s) requests"
      frequency: "every event; local-month/maintenance-year reconciliation; annual/asset-change review"
      temporal_coverage: "The same complete counter accounting period, including failures and rework inside the counter gate. Track original asset-life and original waste-event receipt/treatment evidence separately without extending the acceptance-service gate into downstream transport or returns"
      site_scope: "same provider/site/configuration scope; all shared users"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated originals; signed scope and overlap map; asset/receipt lineage; uncertainty"
  calculation_rules:
    - id: calc_energy
      applies_to: "counter_electricity"
      rule: "Period attributed energy = 3.6 * (direct tagged kWh + shared kWh * w_sj); apply calc_normalize once."
      inputs:
        - cp_energy
        - allocation_time
        - allocation_idle
      output: "MJ period total"
      source_ids: []
    - id: foreground_interface_method
      applies_to: "svc_premises_service; svc_remote_acceptance_it"
      rule: "Before measurement classify every event/scope component as foreground physical or external service under boundary_atomic_support, with no overlap. Apply existing physical-card formulas, component rules and cp_support protocols only to the former, never demand an external provider BOM or internal meter ledger to activate a service interface. For a service row s collect raw A_s,e in its fixed native unit and alpha_s,e from the existing named activity allocation: direct cohort events have alpha=1; genuinely shared events retain the original all-user driver, failure/empty/standby treatment and event window. Allocated service amount T_s=sum(A_s,e*alpha_s,e); if the native activity ledger already contains cohort-attributed activity, alpha is already applied and must not be multiplied again. q_s=T_s/N_ref, with N_ref the original positive cohort reference output. Preserve raw totals for zero output and mark the unit result incomplete. Do not convert time, area, count or transport activity to energy or equipment mass without a separate evidenced relationship. Do not apply physical capital life fractions again to a service inventory that already contains its capital allocation. Quantities for background linkage equal q_s times an inventory per one identical service unit, once; an emission factor is not the service exchange quantity. All old physical-only instructions and service prohibitions apply only to the foreground physical branch; the service branch follows this rule and its explicit interface protocol. Incomplete or aborted service events retain their evidenced attributable burden. Do not silently discard them because the interface counts completed units: document an equivalent native service quantity supported by the contract and execution records, or add a separately identified partial-service row before claiming completeness; never assume a full unit or zero. A supplier value already per the final reference is not a raw A_s,e: recover its original total and denominator before recomputation, or prove exact equivalent normalization without dividing by the final denominator again. Any included supplier allocation is applied only once."
      inputs:
        - cp_interface_premises_service
        - cp_interface_remote_acceptance_it
      output: "native service units per original reference flow"
      source_ids: []
    - id: calc_interface_premises_service
      applies_to: "svc_premises_service"
      rule: "Apply foreground_interface_method. Native activity A_s,e (m2*h): actual counter-area m2 * occupancy h during the complete counter reporting period; retain the original shared-space allocation. Use the existing activity_premises_service beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/N_s once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_premises_service
        - activity_premises_service
      output: "m2*h/N_s"
      source_ids: []
    - id: calc_interface_remote_acceptance_it
      applies_to: "svc_remote_acceptance_it"
      rule: "Apply foreground_interface_method. Native activity A_s,e (Item(s)): count unique executed request IDs at the contracted backend gate, including separately executed failed/retried requests; one item is one request execution, not one successful counter output. Use the existing activity_remote_acceptance_it beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/N_s once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_remote_acceptance_it
        - activity_remote_acceptance_it
      output: "Item(s)/N_s"
      source_ids: []
    - id: calc_stock
      applies_to: "receipt_paper; acceptance_label"
      rule: "Net consumed stock = opening + receipts + transfers in - closing - supplier/out-of-scope unused returns - transfers out, all in kg for one stock construction. External-return movements and transfers out are mutually exclusive by movement ID; internal unused-stock returns stay in closing stock and are not deducted again. Allocate net consumption to strata using tagged issues, then justified shared-driver shares; include void/reprint use."
      inputs:
        - cp_stock
      output: "kg period total"
      source_ids: []
    - id: calc_device
      applies_to: "counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer"
      rule: "Consumed device equivalents = installed calendar hours in period / evidenced total installed calendar lifetime hours * w_sj; sum by distinct device serial number, then apply calc_normalize. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
      inputs:
        - cp_assets
        - allocation_device
      output: "Item(s) lifetime equivalents period total"
      source_ids: []
    - id: calc_premises
      applies_to: "activity_premises_service"
      rule: "F_s = (directly reserved counter m2 + sum(shared-area m2 * counter scheduled staffed-window-hours / all served functions scheduled staffed-window-hours)) * accounting-period calendar hours * v_s. F_s remains raw area-time; apply the matched physical inventory intensity and fixed allocation to each physical row, then the final N_s denominator once. These are raw provider activity diagnostics only; they are not inventory exchanges. Distribute only the separately named physical rows in the corresponding support processes, using original raw activity and one final reference normalization. For gas, start from the raw NCV MJ converted under section 8, apply the premises resource-pool share and divide by N_s once."
      inputs:
        - cp_premises
        - allocation_premises
        - allocation_premises_inventory
      output: "raw activity diagnostic: m2*h period total"
      source_ids: []
    - id: calc_premises_gas_ncv
      applies_to: "u_premises_service_natural_gas"
      rule: "For each metered zone and supply interval j, Q_gas_NCV_MJ_j=matched V_m3_j*NCV_MJ_per_m3_j. Retain raw MJ already reported on an NCV basis. A GCV-only value requires a same-supply, same-state, same-period evidenced NCV/GCV ratio or original volume and NCV; otherwise incomplete. Match supply inventories and per-MJ combustion factors to NCV. Return raw supply MJ before allocation or division by N_s."
