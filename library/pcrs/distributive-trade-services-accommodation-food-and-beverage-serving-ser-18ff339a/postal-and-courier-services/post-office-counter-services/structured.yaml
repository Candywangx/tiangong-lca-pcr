system_boundary:
  rules:
    - rule_id: boundary_counter
      applies_to: "foreground_system_boundary"
      rule: "Include eligibility check, weighing, scanning/recording, receipt and any counter label actually applied, internal counter handoff, corrections and unsuccessful handling within the declared gate. A successful acceptance is not delivery."
      source_ids:
        - un-cpc-68013
        - usps-package
        - usps-extra-services
    - rule_id: boundary_mail_money
      applies_to: "foreground_system_boundary"
      rule: "Mailpiece contents, packaging and prepaid stamps arrive in customer custody and are not consumed or produced by this service. Track custody/count transitions outside exchange inventory. Record only incremental counter materials actually supplied. Postage, cash, tax and insured value are monetary records, never material or elementary flows. If supplied by the onward-postal-service dataset, remove the same counter stage there before combining."
      source_ids:
        - un-cpc-68013
        - usps-package
    - rule_id: boundary_support
      applies_to: "foreground_system_boundary"
      rule: "Include attributed counter electricity, equipment provision/upkeep/end-of-life, remote acceptance IT, premises and waste responsibilities once. Under boundary_atomic_support and foreground_interface_coverage, operator-responsible components use physical rows; independent remote IT and occupancy providers use svc_remote_acceptance_it and svc_premises_service. Keep the fixed technical scope, activity allocation and direct-scope exclusions. A compatible background service with a signed scope declaration is acceptable; an invoice alone does not establish coverage."
      source_ids:
        - ghg-product-2011
    - rule_id: boundary_exclusions
      applies_to: "foreground_system_boundary"
      rule: "Exclude customer and employee travel/commuting, human metabolic energy, onward sorting/transport/storage/delivery and standalone stamp, financial or retail services; disclose these exclusions. Keep lighting, heating/cooling and cleaning caused by waiting-area occupation inside the premises inventory; customer waiting minutes themselves are not an emission flow."
      source_ids: []
    - rule_id: boundary_extension
      applies_to: "foreground_system_boundary"
      rule: "Before quantification screen each actual route for other paper forms, inks, sealing materials, packaging, fuels, water, refrigeration and releases. Every additional present exchange needs its own specific card, physical identity, unit and protocol; the listed cards are not a completeness exemption. If integrated in premises/equipment/IT background, locate it there once and document scope. Demonstrably absent conditional rows use not_applicable with dated evidence; unknown is never zero."
      source_ids: []
    - rule_id: boundary_atomic_support
      applies_to: "supporting activities"
      rule: "Each active exchange represents one defined material, equipment or service object with one primary property and unit. A service is not disallowed merely because it has upstream processes. Fix responsibility by provider, contract, site, event, gate and scope component before quantification. Operator-run processes and separately commissioned onsite tasks under operator inventory responsibility use foreground physical rows. Independently provided activities outside that responsibility use their specified service-interface rows; supplier manufacture, utilities, maintenance and waste remain in the matched background service, not extra foreground exchanges. A contract alone does not turn supplier internals into foreground. Do not change the product, route, custody gates or original reference denominator. Apply foreground_interface_method and foreground_interface_coverage; boundary changes need PCR review, not a data-availability choice. Ownership here means inventory responsibility, not legal title alone: rented equipment provision may be an external service while separately metered operator-run electricity remains foreground."
      source_ids: []
    - rule_id: foreground_interface_coverage
      applies_to: "all support processes and overlaps"
      rule: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
      source_ids: []
