measurement_rules:
  - id: measure_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "Count completed unique mailpiece acceptance events N_s in the same stratum and period, not visits, stamps, attempted scans, financial turnover, hours or transported mass. Failed attempts and rework consume inputs without increasing N_s. N_s must be positive."
  - id: measure_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "row-specific property"
      uuid: ""
    required_unit: "row-specific unit"
    rule: "Collect raw period totals and activity drivers first. Divide each attributable period total by N_s exactly once. A source already expressed per completed mailpiece is not divided again; reconstruct its period total for reconciliation. No assumed conversion between mailpiece count, mass, time or money."
  - id: measure_units
    applies_to: "counter_electricity; receipt_paper; acceptance_label"
    required_property_ref:
      name: "Energy; Mass"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "For electricity convert recorded kWh to MJ by multiplying by 3.6 once. Paper and label mass uses calibrated weighing or verified mass per roll/label and actual stock movement. Weigh label product including its liner at purchase; separately measure liner waste. Do not apply density, moisture or dry-mass conversions without measured, applicable evidence."
