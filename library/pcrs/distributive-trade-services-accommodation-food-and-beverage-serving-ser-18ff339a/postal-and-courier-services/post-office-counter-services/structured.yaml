      applies_to: "counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer; u_premises_service_building_gate; u_premises_service_concrete_demolition; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. If a supply-background or treatment-model version changes without a physical quantity change, replace the corresponding linked inventory and result for all affected original cohorts; a zero physical delta_A does not preserve the old model."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "all inventory rows"
      requirement: "Match office, calendar period, stratum, first/last gate, provider and physical unit; disclose service quality and number of mailpieces per session. Registered and certified procedures and different mail forms are not automatically equivalent."
      evidence: "cp_acceptance; provider scope records"
    - id: quality_unknown
      applies_to: "all inventory rows"
      requirement: "Missing amount, unverified identity, absent upstream inventory, unknown destination or failed reconciliation remains an explicit gap and prevents a complete dataset claim. A provisional estimate must state source, method, bounds and sensitivity; no default numerical intensity, life, conversion factor or compliance limit is provided."
      evidence: "gap register and scenario evidence"
    - id: quality_inventory
      applies_to: "activity_premises_service; activity_remote_acceptance_it; counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer"
      requirement: "Retain disaggregated underlying service inventories, units, driver evidence and explicit scope exclusions. Test all physical sources for duplicate electricity, assets, cooling, paper, network or waste treatment. A service name, receipt or price alone is insufficient evidence."
      evidence: "supplier/foreground background crosswalk and balance"
    - id: quality_waste_origin
      applies_to: "receipt_paper_waste; glassine_liner_waste"
      requirement: "For every ordinary solid-waste stream verify generation responsibility, original cohort/stratum/denominator, origin-labelled stock balance, supported actual or prospective complete treatment and later-receipt replacement. Unknown origin/fate/physical loss remains an explicit gap; future dispatch alone cannot close or reassign it. Keep wastewater and amortized terminal-asset treatment on their separate methods."
      evidence: "generation/stock/transfer ledgers; supported route models; original-cohort receipt replacements"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Bind each eventual flow UUID only after direct-read confirmation of official name in both languages when present, flow type, state, property, unit and receiving compartment. Search similarity and historical citations are insufficient; unresolved cards remain candidates until that binding exists."
      evidence: "official response and hash-bound identity evidence"
    - id: quality_atomic_completeness
      applies_to: "all disaggregated support and species"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "scope-to-physical-row reconciliation; supplier/BOM/species originals; signed gap register"
    - id: quality_service_interfaces
      applies_to: "svc_premises_service; svc_remote_acceptance_it"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "cp_interface protocols; signed coverage/ownership matrix; native-unit reconciliation; identity receipts"
    - id: scope_interface_premises_service
      applies_to: "u_premises_service_electricity; u_premises_service_tap_water; u_premises_service_natural_gas; u_premises_service_hot_water_heat; u_premises_service_building_gate; u_premises_service_sanitary_wastewater; u_premises_service_concrete_demolition; u_premises_service_co2_fossil_air; u_premises_service_no_air; u_premises_service_no2_air; svc_premises_service"
      requirement: "For support_premises_service, svc_premises_service is the external service input under boundary_atomic_support. Its listed physical counterparts apply only to operator-owned foreground components; they are not required supplier-internal collection. For every event/component record exactly one owner and representation. Keep physical components excluded from the contracted service, and remove only evidenced overlap; partial contracts cannot suppress the whole process. Scope changes require the coverage matrix and fresh bilingual projection."
      evidence: "signed foreground/interface matrix; contract exclusions; actual component records"
    - id: scope_interface_remote_acceptance_it
      applies_to: "u_remote_acceptance_it_datacentre_electricity; u_remote_acceptance_it_network_electricity; u_remote_acceptance_it_cooling_makeup_water; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch; svc_remote_acceptance_it"
      requirement: "For support_remote_acceptance_it, svc_remote_acceptance_it is the external service input under boundary_atomic_support. Its listed physical counterparts apply only to operator-owned foreground components; they are not required supplier-internal collection. For every event/component record exactly one owner and representation. Keep physical components excluded from the contracted service, and remove only evidenced overlap; partial contracts cannot suppress the whole process. Scope changes require the coverage matrix and fresh bilingual projection."
      evidence: "signed foreground/interface matrix; contract exclusions; actual component records"
    - id: inv_premises_scope
      applies_to: "u_premises_service_electricity; u_premises_service_tap_water; u_premises_service_natural_gas; u_premises_service_hot_water_heat; u_premises_service_building_gate; u_premises_service_sanitary_wastewater; u_premises_service_concrete_demolition; u_premises_service_co2_fossil_air; u_premises_service_no_air; u_premises_service_no2_air"
      requirement: "Only the estate-period and zone-matched counter accommodation under allocation_premises_inventory; direct devices, plug loads, paper and remote IT excluded."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_ac_basis
      applies_to: "u_premises_service_electricity; u_remote_acceptance_it_datacentre_electricity; u_remote_acceptance_it_network_electricity"
      requirement: "Applies only to independently evidenced point-of-use AC; this generic UUID does not determine supplier, grid, voltage or generation technology. Meter kWh converts to MJ by 3.6 once; installation/repair AC and operating AC have disjoint meter/phase ownership."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_asset_basis
      applies_to: "u_premises_service_building_gate; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate"
      requirement: "Actual maintenance quantities use their separate period/event share, never this manufacture f. Already amortised supplier inputs require recovery of original Q_a and the full-life denominator; applying f again is prohibited."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_terminal_basis
      applies_to: "u_premises_service_concrete_demolition; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
      requirement: "Its raw Q_e is the full-lifecycle terminal physical quantity belonging to asset_suffix, before amortisation, not an amortised provider-period amount or a later-period dispatch total. Apply exactly the linked production f once and divide by the original denominator once; no extra operational allocation share."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_combustion_species
      applies_to: "u_premises_service_co2_fossil_air; u_premises_service_no_air; u_premises_service_no2_air"
      requirement: "Only documented exact combustion technology, species, factor and receiving compartment; no total-NOx substitution. Compute once from measured fuel and a single-species factor excluding upstream fuel-chain emissions."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_remote_it_scope
      applies_to: "u_remote_acceptance_it_datacentre_electricity; u_remote_acceptance_it_network_electricity; u_remote_acceptance_it_cooling_makeup_water; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
      requirement: "Executed remote barcode validation/record-write/acknowledgement requests for the declared acceptance endpoint; includes failures/retries, excludes ongoing delivery tracking. Only the actual endpoint/provider resource and independent product/receiver gate are evidenced; distinct technologies/models/zones must not be merged."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: validation_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile N_s to unique valid acceptance/receipt/handoff events; no rejection, cancellation, duplicate scan or correction is counted as another output. Reject N_s <= 0. Verify all qualifiers before applicability."
    source_ids: []
  - rule_id: validate_service_interfaces
    applies_to: "svc_premises_service; svc_remote_acceptance_it"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "foreground_dataset_conformance"
    rule: "For every resource reconcile direct + all allocated functional shares to raw period total; w_sj sums to one over served functions. Check facility occupied area-hours, stock kg and waste kg separately. Retain unexplained residual; never force a balance by changing a missing value to zero. Test A-period generated retained waste and B-period dispatch: original A responsibility and denominator persist, and actual evidence replaces that same event model without another B burden."
    source_ids: []
  - rule_id: validation_material
    applies_to: "foreground_dataset_conformance"
    rule: "The purchased composite label includes liner; label attached to mail plus liner waste plus rejects/stock changes must reconcile to consumed stock without duplicating a separate liner input. Issued paper is not also waste. Check exact label construction; unknown or different stock requires separate identification/card."
    source_ids: []
  - rule_id: validation_support
    applies_to: "foreground_dataset_conformance"
    rule: "Verify all premises, equipment, remote IT and waste-treatment technical boundaries against direct foreground inputs. Reject incomplete underlying background evidence or duplicated asset/energy/treatment scopes as incomplete; no full life-cycle or methodology-approval claim follows from this check alone."
    source_ids: []
  - rule_id: validation_projection
    applies_to: "foreground_dataset_conformance"
    rule: "All mandatory boundary, allocation, collection, calculation and quality requirements must survive the canonical structured projection with these same row/protocol/rule IDs; check bilingual meanings and current hashes, not hashes alone."
    source_ids: []
  - rule_id: validate_atomic_support
    applies_to: "all support and emission rows"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_capital_restatement
    applies_to: "counter_computer; counter_scale; barcode_scanner; receipt_printer; label_printer; u_premises_service_building_gate; u_premises_service_concrete_demolition; u_remote_acceptance_it_server_gate; u_remote_acceptance_it_network_switch_gate; u_remote_acceptance_it_retired_server; u_remote_acceptance_it_retired_network_switch"
    rule: "Check original cohorts/denominators, all-user driver, source versions, booked amounts and restatement corrections under calc_capital_restatement. Reject frozen old history with only future-denominator changes, retirement-balance transfer to unrelated current output, and negative physical exchanges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Unit-process counter-acceptance service inventory with declared upstream links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only matching attended-counter acceptance stratum, quality, location, period and gates; combine with onward service only after removing overlapping acceptance burdens"
  excluded_use: "Generic whole-CPC coverage, all office transactions, customer visit footprints, bank/retail services or completed postal delivery"
  required_metadata: "All reference qualifiers, N_s, active/idle/failure records, office-resource scope map, allocation drivers, period totals, technical background linkage and unit compatibility; ordinary-waste generation origin, original shares/denominator, retained stocks and treatment revision chain; signed foreground/interface responsibility matrix, native service activity and background coverage; original physical activity, manufacture/terminal pairing and species basis only for foreground-owned components"
  required_quality_disclosure: "Unresolved identities and upstream gaps; no zero substitution; temporal/site coverage; foreground estimates and uncertainty; service/facility/equipment boundary exclusions"
  update_trigger: "Acceptance procedure, mail form/quality, office utility boundary, equipment/IT provider, stock construction, throughput/workload or material evidence changes; later ordinary-waste receipts/fate or generation correction update the original event/cohort model; foreground physical identity/speciation changes or external interface configuration/unit/coverage changes require applicable concrete-row review and fresh projection"
data_sources:
  - id: "un-cpc-68013"
