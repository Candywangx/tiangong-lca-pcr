    reference: "USPS, How to Prepare and Send a Package; https://www.usps.com/ship/packages.htm"
    used_for: "Actual counter weighing, postage printing/attachment and mail presentation; United States example, not universal material specification"
  - id: "usps-extra-services"
    type: "official_guidance"
    reference: "USPS, Shipping Insurance and Delivery Services; https://www.usps.com/ship/insurance-extra-services.htm"
    used_for: "Registered/Certified Mail and sender receipt versus delivery proof; service-specific eligibility must be declared"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapters 7-10, especially chapter 9 allocation; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General subdivision, physical allocation, consistent recycling and uncertainty principles; the counter-specific protocols and allocation drivers are authored here, not quantitative factors prescribed by this standard"
