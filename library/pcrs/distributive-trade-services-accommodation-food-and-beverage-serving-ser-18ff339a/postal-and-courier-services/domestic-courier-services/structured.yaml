    - id: calc_assets
      applies_to: "diesel_van; petrol_van; electric_van; sorting_machine; activity_depot_building"
      rule: "Vehicle fractions=cohort vehicle-km/lifetime vehicle-km; machine fractions=cohort machine-hours/lifetime machine-hours; building m2*a=allocated occupied m2*occupied days/365. Review lifetime evidence/scenarios, asset original components, replacement maintenance and EOL inclusions before summing; each component belongs to one boundary only. Only the explicitly named activity_* terms are raw supporting-activity diagnostics, never product exchanges; retained physical product/waste terms keep their original quantities, units and exchange role. Apply the separate physical-disaggregation rules only to the removed service terms. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
