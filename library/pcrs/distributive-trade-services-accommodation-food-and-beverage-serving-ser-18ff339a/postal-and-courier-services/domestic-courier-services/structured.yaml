      rule: "A=accepted, D=conforming delivered, R=returned, L=lost, C=cancelled after acceptance, F=finally nonconforming delivered, O=open; A=D+R+L+C+F+O; require O=0 and N=D>0. Rejected before acceptance is outside A. Each accepted parcel has one mutually exclusive final status: D for conforming recipient receipt, F for finally nonconforming recipient delivery, R for physical return after network dispatch, L for confirmed loss, C only for a resolved cancellation with handback at the original intake before network dispatch; a cancelled parcel later returned after dispatch is R, not C. Unresolved disputes remain O.  repacking/splitting retains the original accepted parent ID and counts it once only after all fragments satisfy the original obligation; consolidation retains the original accepted parcel obligations without copying or deleting N by relabelling; partially delivered consignments count by parcel. Pending parcels require closing follow-up or a separate incomplete result, never silently removed."
      inputs:
        - cp_cohort
      output: "N Item(s) and closure reconciliation"
      source_ids:
        - ghg-transport-2013
    - id: foreground_interface_method
      applies_to: "svc_contracted_road; svc_contracted_attempt; svc_road_infrastructure; svc_charging_asset_service; svc_depot_building"
      rule: "Before measurement classify every event/scope component as foreground physical or external service under boundary_atomic_support, with no overlap. Apply existing physical-card formulas, component rules and cp_support protocols only to the former, never demand an external provider BOM or internal meter ledger to activate a service interface. For a service row s collect raw A_s,e in its fixed native unit and alpha_s,e from the existing named activity allocation: direct cohort events have alpha=1; genuinely shared events retain the original all-user driver, failure/empty/standby treatment and event window. Allocated service amount T_s=sum(A_s,e*alpha_s,e); if the native activity ledger already contains cohort-attributed activity, alpha is already applied and must not be multiplied again. q_s=T_s/N_ref, with N_ref the original positive cohort reference output. Preserve raw totals for zero output and mark the unit result incomplete. Do not convert time, area, count or transport activity to energy or equipment mass without a separate evidenced relationship. Do not apply physical capital life fractions again to a service inventory that already contains its capital allocation. Quantities for background linkage equal q_s times an inventory per one identical service unit, once; an emission factor is not the service exchange quantity. All old physical-only instructions and service prohibitions apply only to the foreground physical branch; the service branch follows this rule and its explicit interface protocol. Incomplete or aborted service events retain their evidenced attributable burden. Do not silently discard them because the interface counts completed units: document an equivalent native service quantity supported by the contract and execution records, or add a separately identified partial-service row before claiming completeness; never assume a full unit or zero. A supplier value already per the final reference is not a raw A_s,e: recover its original total and denominator before recomputation, or prove exact equivalent normalization without dividing by the final denominator again. Any included supplier allocation is applied only once."
      inputs:
        - cp_interface_contracted_road
        - cp_interface_contracted_attempt
        - cp_interface_road_infrastructure
        - cp_interface_charging_asset_service
        - cp_interface_depot_building
      output: "native service units per original reference flow"
      source_ids: []
    - id: calc_interface_contracted_road
      applies_to: "svc_contracted_road"
      rule: "Apply foreground_interface_method. Native activity A_s,e (t*km): sum(actual gross payload tonnes * actual loaded leg km); match the existing exclusive trunk-leg pool, including allocated empty/failure activity. Use the existing activity_contracted_road beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/N once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
