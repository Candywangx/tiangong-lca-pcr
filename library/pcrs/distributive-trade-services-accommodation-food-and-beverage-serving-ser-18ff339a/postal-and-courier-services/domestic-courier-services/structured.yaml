product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.postal-and-courier-services.domestic-courier-services"
  classification_refs: "CPC 3.0 68021; narrower"
  covered_products: "Domestic non-USO addressed ambient road parcel courier service using owned delivery vans and, where needed, separately contracted trunk transport through electrically operated depots"
  excluded_products: "Letters; bicycle messenger; international consignments; USO services; local retail/food delivery; refrigerated, frozen, dangerous or live cargo; air, rail and sea legs; fuel-fired depot heating or material handling"
  representative_product: "One qualifying parcel delivered within one declared domestic road service class"
  production_route: "Acceptance → collection → electrical sort/handling → road trunk → last mile → conforming delivery; actual repeated/return legs remain attributable"
  market_state: "Completed courier service, not ownership or production of the parcel contents"
functional_unit:
  what: "Deliver an accepted addressed parcel to its domestic contractual recipient"
  how_much: "1 conforming delivered parcel service; one parcel is one independently tracked physical handling unit"
  how_well: "Declared service class, intactness/receipt criterion, destination and promised transit window; evidence must meet the contracted acceptance test"
  how_long_or_cycle: "Full closed acceptance cohort from acceptance to final delivery, return, loss or cancellation resolution; disclose actual transit distribution"
  reference_flow_link: "delivered_parcel"
system_boundary:
  rules:
    - rule_id: boundary_service
      applies_to: "foreground_system_boundary"
      rule: "All acceptance, collection, depot handling, actual road movements, failed attempts, attributable empty running, return handling and incident resolution of the closed cohort are included. Final gate is conforming receipt; failed cases end at documented return, loss, pre-dispatch cancellation/handback or final nonconforming delivery closure and stay in the numerator."
      source_ids:
        - un-cpc-68021
        - ghg-transport-2013
    - rule_id: boundary_exclusions
      applies_to: "foreground_system_boundary"
      rule: "Exclude manufacture/use of entrusted goods and pre-existing customer packaging, recipient travel beyond the agreed gate, employee commuting and unrelated corporate services. Courier-added labels, tape and repair boxes are included. No avoided-product credits for loss or recovery."
      source_ids:
        - un-cpc-68021
        - ghg-transport-2013
    - rule_id: boundary_assets
      applies_to: "foreground_system_boundary"
      rule: "Include apportioned vehicles, sorting equipment and depot building use, maintenance/replacement and actual end-of-life treatment once. Document complete-asset dataset inclusions: original components, replacements, maintenance and EOL must not overlap separate rows. Tyre wear and refrigerant release are direct emissions when they occur. Where a complete-asset or maintenance background dataset includes use-phase wear, refrigerant releases or the same waste treatment, remove that overlapping module before adding explicit release/treatment rows; an inseparable overlap means incomplete results. Residual spent tyre/oil quantities are measured transfers, not original input masses; reconcile inputs with wear, leakage, retained stock and transferred waste so released mass is never sent again to treatment."
      source_ids:
        - un-cpc-68021
        - ghg-transport-2013
    - rule_id: boundary_occurrence
      applies_to: "foreground_system_boundary"
      rule: "This is an ambient road route with electrically operated depots, not a promise that every site fits it. Verify all fuels, chemicals, water, heating, cleaning, refrigerants, wastewater, packaging, waste and releases by bills, site walkthrough and maintenance records. Other actual atomic exchanges must be added in bilingual cards/protocols and resynced before a dataset can claim completeness; fuel-fired depots or nonroad/cold-chain legs are outside scope. Unknown occurrence is not absence."
      source_ids:
        - un-cpc-68021
        - ghg-transport-2013
    - rule_id: boundary_supplier
      applies_to: "foreground_system_boundary"
      rule: "Each leg retains its unique operator/provider, actual native activity and original allocation. For independent external carriage use svc_contracted_road or svc_contracted_attempt at their mutually exclusive leg/attempt gates. Operator-responsible physical components retain their existing supplies and releases. Under foreground_interface_coverage, never duplicate fuel, electricity, assets, maintenance, empty travel, emissions or treatment included by a service or another inventory owner. Missing scope needs a specific non-overlapping interface or foreground row; otherwise completeness is blocked."
      source_ids:
        - un-cpc-68021
        - ghg-transport-2013
    - rule_id: boundary_atomic_support
      applies_to: "supporting activities"
      rule: "Each active exchange represents one defined material, equipment or service object with one primary property and unit. A service is not disallowed merely because it has upstream processes. Fix responsibility by provider, contract, site, event, gate and scope component before quantification. Operator-run processes and separately commissioned onsite tasks under operator inventory responsibility use foreground physical rows. Independently provided activities outside that responsibility use their specified service-interface rows; supplier manufacture, utilities, maintenance and waste remain in the matched background service, not extra foreground exchanges. A contract alone does not turn supplier internals into foreground. Do not change the product, route, custody gates or original reference denominator. Apply foreground_interface_method and foreground_interface_coverage; boundary changes need PCR review, not a data-availability choice. Ownership here means inventory responsibility, not legal title alone: rented equipment provision may be an external service while separately metered operator-run electricity remains foreground."
      source_ids: []
    - rule_id: foreground_interface_coverage
      applies_to: "all support processes and overlaps"
      rule: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Sealed addressed parcel physically accepted into the non-USO domestic road service; contents and customer-supplied packaging already exist"
  starting_condition_role: "Input condition; customer goods remain an entrusted object, not an upstream courier service input"
  product_classification_scope: "Narrower than CPC 3.0 68021; excludes all routes and products listed in section 2"
  recursive_input_rule: "Apply boundary_atomic_support: external activities enter through a defined single-unit service interface; do not recursively expand supplier internals. Foreground physical processes retain their existing cards and rules. Custody cargo is not a manufactured input."
  upstream_dataset_requirement: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
  disclosure: "Declare accepted cohort, closure, route class, depot electrical scope, embodied asset/EOL coverage, outsourced inclusions, occurrence evidence and all unresolved identities or missing exchanges"
