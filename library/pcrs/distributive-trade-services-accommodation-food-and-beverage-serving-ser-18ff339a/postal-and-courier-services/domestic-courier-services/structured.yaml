    - id: calc_road_maintenance_waste
      applies_to: "spent_tyre; spent_oil; spent_battery"
      rule: "For each named material and original maintenance generation event j, G_j is measured kg at the generation gate, not later dispatch or the residual after storage loss. On one evidenced wet/dry/composition basis reconcile C=O+G+I_in-I_out-D_out-L; if reconstruction is necessary, G=C-O-I_in+I_out+D_out+L. I_in/I_out are paired internal custody transfers, not new generation; L contains only independently evidenced actual physical losses, with moisture changes separately supported by basis conversions. Direct causality takes precedence; otherwise allocation_maintenance_period fixes s_origin_j from all-user kilometres of the original asset-local year y. q=sum_j(G_j*s_origin_j)/original N once; storage and transfer preserve original event/year/shares/denominator. The generation-gate waste link uses this same G basis through storage, transport and supported final treatment; later treatment receives only the compatible residual after verified storage losses/state changes. An explicit release replaces the identical release already included in that link: do not treat full G again plus the same loss. Global allocation_atomic_waste and original-event receiver-evidence replacement remain applicable. Unknown basis, transfer endpoints, loss medium or fate remains incomplete."
      inputs:
        - cp_waste
        - allocation_maintenance_period
        - allocation_atomic_waste
      output: "original-event generated kg/N and separate custody/loss/treatment reconciliation"
      source_ids: []
