        - cp_road
        - cp_depot
      output: "allocated native kg or MJ before N"
      source_ids:
        - ghg-transport-2013
    - id: calc_releases
      applies_to: "road species and disjoint particle fractions except refrigerant"
      rule: "E_x=sum(activity_j*EF_xj), with factor substance, mass basis, technology, compartment and period verified from original. Apply composition and destination once only if not already included. Fossil CO2 excludes measured biogenic share; biogenic CO2 needs its own card when present. Total NOx is QA only; obtain separate NO/NO2 via calc_nox_speciation; PM2.5 and 2.5–10 ranges must not overlap; no PM10 addition to both. Wear is not exhaust; no additive GHG basket alongside component gases. For refrigerant use only calc_owned_r134a or calc_carrier_r134a, never this factor rule again."
