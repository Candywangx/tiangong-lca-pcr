      requirement: "Each selected UUID requires original official direct-read response and bound integrity evidence matching object, direction/type, physical state, property/unit and compartment; search hits are insufficient. Unbound rows are semantic candidates, not verified identities. Resolve every applicable row/reference flow and exact subtype before dataset completeness or publication. Electricity flow identifies point-of-use AC only, not grid/provider performance."
