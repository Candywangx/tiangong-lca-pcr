      applies_to: "svc_contracted_attempt"
      rule: "Apply foreground_interface_method. Native activity A_s,e (Item(s)): count distinct physically executed parcel-attempt IDs, successful or failed; a repeated visit is a new attempt only with a distinct execution record; exclude trunk carriage already assigned to another leg. Use the existing activity_contracted_attempt beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/N once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
