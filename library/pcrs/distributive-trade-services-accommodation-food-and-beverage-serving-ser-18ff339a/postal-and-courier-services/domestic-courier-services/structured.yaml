      applies_to: "svc_charging_asset_service"
      rule: "Apply foreground_interface_method. Native activity A_s,e (h): actual nonoverlapping apparatus occupancy hours assigned under the existing positive-source/verified-zero event rules, including concurrent-port shares; electricity is excluded. Use the existing activity_charging_asset_service beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/N once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
