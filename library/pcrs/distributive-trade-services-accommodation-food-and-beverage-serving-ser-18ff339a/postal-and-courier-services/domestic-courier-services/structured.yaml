measurement_rules:
  - id: reference_count
    applies_to: "delivered_parcel"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "Count each unique physical parcel once only at first conforming delivery. One consignment can contain multiple parcels; never count a shipment label, scan, stop, attempt or tonne-kilometre as a delivered parcel."
  - id: normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "Declared row unit"
    rule: "Use cohort-allocated raw totals A_r and N conforming delivered parcels: q_r=A_r/N, once only; N>0. Intermediate flows use their measured quantities, never automatically 1."
  - id: electricity_basis
    applies_to: "road_electricity; depot_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Point-of-use AC input: MJ=3.6*kWh at the AC meter; include charger losses once and separate traction from depot meter. Voltage, grid geography and period must be collected. Battery stored energy is not an extra product input."
  - id: mass_conversion
    applies_to: "diesel; petrol; lubricating_oil; all material/waste/emission rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For fuel measured in litres use batch-specific density at recorded temperature: kg=V_L*rho; retain blend, biofraction and lower heating value if factor conversion needs them. Do not impose a generic density or convert mass/volume/count without measured support."
  - id: asset_units
    applies_to: "diesel_van; petrol_van; electric_van; sorting_machine"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "A fractional complete asset is counted against demonstrated lifetime activity; no default lifetime. Exclude original embedded batteries/tyres/components from replacement rows. No Item(s) substitution for hours, kg or tkm."
process_map:
  - id: service
    name: "Courier service orchestration and outsourced legs"
    inclusion: "required"
    inclusion_condition: "All cohort records"
    role: "reference process"
    quantitative_reference: "N delivered_parcel; outsourced legs measured independently"
  - id: road
    name: "Owned road collection, trunk and delivery"
    inclusion: "conditional"
    inclusion_condition: "Owned physical segments only"
    role: "foreground operation"
    quantitative_reference: "Actual vehicle-km, stop/minutes, fuel/energy and parcel load, not N vehicle-km"
  - id: depot
    name: "Electrical depot sorting and handling"
    inclusion: "required"
    inclusion_condition: "Sites handling the selected cohort"
    role: "foreground operation"
    quantitative_reference: "Actual parcel handling/pass time and metered utility totals"
  - id: support_contracted_road
    name: "Support interface / foreground activity: Ambient contracted courier road carriage on a declared leg"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace the full purchased carrier lifecycle service on its existing exclusive segment/attempt boundary with supplier-owned physical inventories. Keep custody gates, all customers, failed/repeated attempts, empty returns, idling and terminal losses. No overlap with operator-owned legs or another supplier service."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_contracted_attempt
    name: "Support interface / foreground activity: One contracted courier parcel delivery attempt"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace the full purchased carrier lifecycle service on its existing exclusive segment/attempt boundary with supplier-owned physical inventories. Keep custody gates, all customers, failed/repeated attempts, empty returns, idling and terminal losses. No overlap with operator-owned legs or another supplier service."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_road_infrastructure
    name: "Support interface / foreground activity: Use of a specified road section by a declared vehicle class"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace road lifecycle provision with one real complete specified constructed section at construction-completion/open-to-traffic gate; later maintenance/renewal and EOL are separate physical exchanges."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_charging_asset_service
    name: "Support interface / foreground activity: Availability of a configured charging apparatus, excluding electricity"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace lifecycle availability hours with a genuine complete factory-gate charger product plus actual external installation, replacement maintenance and EOL. H_k remains an attribution driver, not a physical flow or an item equivalence."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
  - id: support_depot_building
    name: "Support interface / foreground activity: Courier depot shell occupancy, excluding operation utilities"
    inclusion: "conditional"
    inclusion_condition: "Apply foreground_interface_method and foreground_interface_coverage to the actual responsibility. Existing physical-detail condition, only for its foreground component: Replace non-operational building occupancy lifecycle service with a real completed construction-gate building product in physical m2, and separate actual repair and demolition exchanges. Site utilities remain independent."
    role: "support"
    quantitative_reference: "allocation to delivered_parcel"
