    - id: calc_allocate
      applies_to: "all inventory rows"
      rule: "A_r=sum_j(T_rj*s_cj); s_cj=cohort physical driver / all-customer physical driver at the same segment/task; require positive finite denominator, sum customer shares=1 and full raw total reconciliation. Use allocation_segment, allocation_lastmile and allocation_depot, never tariff revenue as the default."
