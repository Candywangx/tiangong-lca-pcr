        - cp_depot
        - cp_supplier
      output: "A_r in row native unit"
      source_ids:
        - ghg-transport-2013
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_r=A_r/N once only; delivered_parcel=N/N=1. Do not divide upstream already-per-service intensity by N again: multiply it by compatible raw contracted activity first. Intermediate quantities, losses and returns remain actual activity. The applicable calc_electric_stock or calc_provider_electric_stock already returns final traction MJ per N; use that value directly on its traction row with no extra share, 3.6 or division by N. Use the matching final reference-basis result from calc_owned_r134a or calc_carrier_r134a for road refrigerant. Its division is the same operation as the card’s A-quantity formula; do not divide by N again."
