      collection_method: "Collect only active foreground physical components under foreground_interface_method; external services use cp_interface_ protocols. Replace the full purchased carrier lifecycle service on its existing exclusive segment/attempt boundary with supplier-owned physical inventories. Keep custody gates, all customers, failed/repeated attempts, empty returns, idling and terminal losses. No overlap with operator-owned legs or another supplier service. Subdivide actual supplier duty cycles by leg/technology; preserve existing loaded gross mass-distance allocation (measured physical volume only with capacity evidence), closed empty/idle-cycle and mutually exclusive last-mile service-time pools. q_x=sum(actual physical exchange x*applicable all-user cohort share)/N, once. Vehicle manufacturing q=one complete vehicle*attributed activity/evidenced whole-life activity/N. Maintenance uses actual causal events or the existing fixed local-calendar asset-year pool once; retirement uses the same lifetime beneficiary fraction and residual mass. Carrier road/charger/building products and their separate upkeep/EOL are required when in scope. Tonne-km or parcel-attempt count reconciles the supplier only; it is not a fuel/hour equivalence. At each provider/source gate, collect event/asset/site/route/configuration and exact physical identity, condition of occurrence/non-occurrence, direction/type/receiving medium, raw quantity and unit, meter/tare/calibration, timestamps and timezone, complete accounting interval, source unit-inventory basis, all-user activity and cohort joins, manufacturing/installation/use/maintenance/EOL phase, original/remaining asset fractions, paired terminal residual provenance, stocks/transfers, receiver/fate and prospective-model revisions. Retain signed supplier scope and exact overlap crosswalk to existing direct rows. Obtain chemistry/BOM/species identity before adding a missing concrete row; an unbound candidate can await official iden