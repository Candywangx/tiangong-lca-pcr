      applies_to: "all processes"
      requirement: "For every conditional process/card document present or demonstrably absent with site records, walk-through and responsible sign-off. Unknown and missing are never zero. Add all actual atomic exchanges required by boundary_occurrence, including other fuel/refrigerant/maintenance chemicals, water/wastewater, complete asset EOL and wear species/media; retain unresolved gaps as incomplete."
