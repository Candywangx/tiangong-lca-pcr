    - protocol_id: cp_emission
      process_id: "road"
      flow_role: "fossil_co2; methane; nitrous_oxide; carbon_monoxide; nitrogen_monoxide_air; nitrogen_dioxide_air; sulfur_dioxide; exhaust_pm25; exhaust_pmcoarse; r134a_air; tyre_pm25_air; r134a_new_external; r134a_reclaimed_external; r134a_recovered_product; r134a_recovered_waste"
      record_type: "road species releases and refrigerant physical movement register"
      raw_fields: "segment_id; fuel_mass/blend; technology; emission_standard; cold_start; idle; factor_source/date; factor_value/unit; substance; compartment; PM_size; destination_fraction; composition_basis; refrigerant_type; initial/final_charge; added/recovered; wear_activity; all_customer_driver; species identity/CAS; direct mass or molar fraction; NO2-equivalent QA basis; molecular data source; compound/carbon basis; calibrated speciation and uncertainty; chemical/vehicle/store IDs; exclusive movement ID and endpoints; installed and recovered-store opening/closing kg separately; external supply receipt kg and installed addition; reuse; other in/out by subsystem; recovery into store; external product or waste handover kg, receiver and status; medium-specific losses; terminal residual; attribution period and all-user driver; handover time and gate, gross/tare/net batch kg, composition test and uncertainty, chemical kg, purchased new/reclaimed or own custody return, title and responsibility/receiver, original outbound/return movement IDs, lot opening/closing/issue/attributed shares/returns, upstream production or reclamation and transport scope, calibration ID; waste decision evidence/time; original generation event/lot; I/F/S state tag and location; measured generated gross/tare/net/composition and unit; original site/asset and timezone/interval; original causal task or all-user allocation fields/shares; original N and result version; retained tagged stock; movement IDs/endpoints; actual dispatch/receiver; storage loss/media; prospective treatment version and residual basis; original-model replacement/overlap evidence"
      collection_method: "Use source-documented uncharacterized LCI species factors or direct measurements; audit original factors, operational fit and included species; maintenance mass balance for refrigerant; occurrence register for all other releases; Aggregation operations: Apply activity*compatible factor once; multiply composition/size/destination only if absent in factor; allocate and /N; add missing species/media cards before completeness For the explicitly evidenced definition NOx=NO+NO2 expressed as NO2-equivalent, record T, its unit/basis and source-matched measured molar fraction a=n_NO/(n_NO+n_NO2). Then m_NO=a*T*M_NO/M_NO2 and m_NO2=(1-a)*T, using independently evidenced molecular masses on the same unit basis. Prefer direct substance-specific mass measurements/factors when available and do not add the QA total again. T is not ordinary NO/NO2 mixture mass; never apply a mass fraction directly to T or assign all T to NO2. If definition includes other nitrogen species, speciation or conversion evidence is missing, no two-component split is permitted: preserve the raw QA observation and block completion until actual species-specific rows and quantities are established. No numeric fraction or molecular mass is defaulted by this PCR. For each actual combustion/evaporation source, use source-matched calibrated species-resolved sampling/analysis or a traceable species-resolved factor inventory matching fuel, engine/process, control, load, cold/hot regime and period. Retain sampling recovery, calibration/response factors, detection and uncertainty, chemical identity, carbon-versus-compound basis and explicit conversions from formula/molecular data. Reconcile identified species to the measured/factor total on its original stated basis, investigating nonclosure; unidentified material is not zero and not a generic NMVOC exchange. Before completed modelling, author each actually supported species as its own named bilingual elementary card, matching compartment, quantity rule and protocol, then regenerate structured. Do not guess a fixed benzene/toluene/etc. roster, use total NMVOC as one species, or claim an exhaustive species inventory before this evidence exists. For owned R134a use the separate balances and handover branches in calc_owned_r134a, not a second generic emission factor. Total NOx is QA and an evidenced input to calc_nox_speciation only. Use calc_owned_r134a at the material or work gate for each receipt, installation, reuse, recovery, external handover, return or release. Use calibrated evidence, close monthly and reconcile lots and custody stocks to the matched asset attribution interval. Verify receipts, source states and responsibility. Use ledgers for occurrence or non-occurrence; unknown is not zero. Generated refrigerant waste quantities, shares and original denominators follow cp_refrigerant_waste_origin and calc_refrigerant_waste_origin; actual dispatch only closes custody records for that origin and does not override original responsibility."
      unit: "kg substance; stated activity unit"
      frequency: "Every activity/factor application; each refrigerant service; annual factor review and each refrigerant movement, monthly close and attribution-period reconciliation"
      temporal_coverage: "Full cohort including empty travel, idle and failures"
      site_scope: "All self-operated segments, workshops and release locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original factor tables and units, technology fit, calibration/detection limits, component balances, factor uncertainty and LCIA mapping audit ; delivery/custody/title records, batch tests, tank and service-scale calibration and upstream overlap crosswalk"
    - protocol_id: cp_refrigerant_waste_origin
