    - protocol_id: cp_transport_capital
      process_id: "road"
      flow_role: "activity_road_infrastructure; activity_charging_asset_service"
      record_type: "physical capital service register"
      raw_fields: "road segment/class; vehicle class; all-user traffic/lifetime allocation; actual self-operated loaded/empty km; provider construction/renewal/maintenance/end-of-life inventory; explicit direct-wear exclusions; charger serial; occupied session start/end; supported battery/activity interval; cohort/all-user activity kWh; complete lifetime occupied h; idle/standby kWh; component overlap crosswalk apparatus ID; port ID; occupancy start/end; nonoverlapping port intervals; concurrent occupied-port count; measured source-labelled session draws; event/session ID and start/release time; site timezone and calendar day; verified gross source addition I_k and its meter/BMS evidence; positive/zero/unknown classification; failure/cancellation reason; causal order/cohort or vehicle/task-set IDs; all-user attributed service elapsed hours including failed attempts/waits; shared-day beneficiary evidence; direct-event AC kWh; mutually exclusive branch/share ledger; electricity/source/capital overlap crosswalk"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Trace every self-operated segment to GPS/odometer and actual road/vehicle class. Obtain primary road lifecycle inventory and evidenced complete-life traffic by class; subdivide exclusive infrastructure first, allocate variable pavement renewal/maintenance by evidenced class-specific engineering damage demand and fixed capacity/safety/civil works by documented class-specific road-space*time demand. Reconcile shares over all road users; missing traffic, engineering allocation or inventory blocks completion, with no default equivalence between classes. Verify removal of explicit direct-wear releases from infrastructure background. For chargers read calibrated session clocks and paired energy/stock records; map each occupied session to supported activity under calc_electric_stock, including all users. Assign positive-source hours by allocation_charge_sources and verified zero-addition hours by allocation_charge_zero; trace battery carryover between periods, record unknown positive burdens as gaps. Audit complete charger inventory, lifetime occupied hours, idle power and exclusion from vehicle/building capital. Apply calc_transport_capital; no costs-to-activity conversion. Apparatus occupied time is the union of intervals with any occupied port, not the sum of concurrent session clocks. Split at every port-state change; allocate each interval hours equally across its actual occupied ports, a declared availability allocation choice within the same evidenced port/service configuration. Define H_k as the sum of these allocated apparatus-hours for session k; sum_k(H_k) equals whole-apparatus union hours. Different port classes/configurations need separate strata and capacity sensitivity. Use H_k, not raw overlapping session hours, in the capital calculation; complete lifetime denominator is the same whole-apparatus occupied union-hours. Retain every occupied attempt including failed/cancelled and verified zero-addition events. Measure gross addition separately from net stock change and concurrent draws; missing evidence stays unknown. Apply allocation_charge_sources only for positive I_k and allocation_charge_zero for verified zero I_k. Link causal dispatch/reservation and all-user service-time records; fix local timezone and split shared events at midnight. Reconcile branch hours to apparatus/bay occupancy and direct-event electricity to the same meter ledger once, with no fictitious stock source or route-energy duplication."
      unit: "vehicle*km; h; kWh"
      frequency: "each segment and charging session; period reconciliation; annual capital/supplier review"
      temporal_coverage: "complete cohort including empty/failure/return tail and evidenced infrastructure/charger life"
      site_scope: "all self-operated routes and all users of charging apparatus; purchased carriage retains its own included road capital"
      aggregation_rule: "per reference flow"
      quality_evidence: "GPS/odometer calibration; road-class/traffic/engineering inventory and allocation evidence; session clock and energy calibration; charger life/scope crosswalk; no-overlap review"
