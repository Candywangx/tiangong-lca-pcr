      output: "q_r per 1 delivered parcel"
      source_ids:
        - ghg-transport-2013
    - id: calc_stock_energy
      applies_to: "diesel; petrol; depot_electricity"
      rule: "Fuel consumed=opening+external receipts+inward transfers-outward transfers-closing; kg=V_L*rho(actual temperature/batch). For depot AC remove overlapping charger inlet readings, then convert the attributed depot kWh to MJ by 3.6. Output allocated native totals before N for calc_normalize. road_electricity is finalized by calc_electric_stock in MJ/N and is outside this rule and any repeat conversion."
