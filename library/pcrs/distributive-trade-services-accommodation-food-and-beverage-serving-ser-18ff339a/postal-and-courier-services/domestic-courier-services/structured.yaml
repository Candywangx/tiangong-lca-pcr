validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Fail applicability for international/USO/local-delivery products or excluded modes/cold chain/fuel-fired depots; require actual service, mass/size, route, state and time-class metadata. Different classes are not equivalent without evidence; aggregate only after stratified disclosed weighting."
    source_ids: []
  - rule_id: validate_service_interfaces
    applies_to: "svc_contracted_road; svc_contracted_attempt; svc_road_infrastructure; svc_charging_asset_service; svc_depot_building"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_accounting
    applies_to: "foreground_dataset_conformance"
    rule: "Require cohort closure, N>0, one final parcel status, no duplicate consignment/attempt outputs, complete customer allocation denominators and balances within declared measurement uncertainty. Investigate residuals; never force balance by invented emissions, losses or zero values. Verify mutually exclusive positive-source/verified-zero charging branches and no double electricity allocation. Test retained waste generation in cohort A and later transfer in cohort B: treatment remains with A and later receipts replace its model, without new B waste/treatment."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Require one actual exchange per applicable card with matched type/property/unit/medium and explicit collection protocol; reject collection selectors, unresolved applicable identities for complete datasets, asset/component duplication, waste-carrier/content duplication and supplier/owned overlap."
    source_ids: []
  - rule_id: validate_refrigerant_ledger
    applies_to: "foreground_dataset_conformance"
    rule: "Check each refrigerant receipt, source batch, stock, first-use assignment, movement and external ownership/status. Verify gross/tare/net and constituent evidence, no second carrier/component exchange, and no duplicated upstream processing or retirement scope. For retained generated waste, additionally verify original generation cohorts/denominators and later treatment replacement under calc_refrigerant_waste_origin."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "foreground_dataset_conformance"
    rule: "Require every normative boundary, allocation, calculation and quality obligation in supported structured fields; IDs/protocol references must resolve, EN/ZH rules must align and projection hashes must be current. Schema/fingerprint success alone does not establish methodology approval or complete multi-impact LCI."
    source_ids: []
  - rule_id: validate_atomic_support
    applies_to: "all support and emission rows"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_capital_restatement
