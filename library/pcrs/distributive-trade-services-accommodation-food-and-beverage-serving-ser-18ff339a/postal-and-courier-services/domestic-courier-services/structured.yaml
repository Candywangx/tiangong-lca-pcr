      applies_to: "svc_depot_building"
      rule: "Apply foreground_interface_method. Native activity A_s,e (m2*a): actual occupied floor area m2 * elapsed years on the documented calendar basis, with the original shared-space attribution. Use the existing activity_depot_building beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/N once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
