    - id: calc_replacement_materials
      applies_to: "replacement_tyre; replacement_battery; lubricating_oil"
      rule: "For each actual maintenance job, installed mass M_j=job issues minus uninstalled returns; reconcile opening unused stock+receipts+inward transfers-outward transfers-closing unused stock against all job installed amounts and retain measured unit mass for count-to-kg conversion. Lubricant uses actual new-oil fill mass, without deducting drained spent oil from new input. Attribute actual maintenance material mass to the causal vehicle and cohort using allocation_segment and allocation_lastmile: A_r=sum_j(M_j*s_cj), then q_r=A_r/N once; do not multiply by complete-vehicle lifetime fractions again. The same replacement/maintenance material already included in a complete-asset or maintenance service dataset is mutually exclusive with this rule; inseparable overlap makes results incomplete. The assignment is fixed by allocation_maintenance_period: A_r=sum_y(M_r,y*cohort_km_y/all_user_km_y) plus directly assigned causal-incident kg, never a full-cohort km numerator repeated in every year."
      inputs:
        - cp_assets
        - cp_road
        - N
      output: "kg of actually replaced tyre, LFP battery or new lubricant per delivered parcel"
      source_ids:
        - ghg-transport-2013
    - id: calc_waste_origin
      applies_to: "waste_label_paper; waste_cardboard; waste_pp"
      rule: "For each named ordinary solid-waste stream r and generation event j, A_c,r = sum_j(G_j,r*s_c,j), then q_c,r=A_c,r/original_reference_count once. G is measured generated mass, not dispatch mass. Reconcile each material and original event: closing = opening + generation + internal_in - internal_out - external_dispatch - evidenced_physical_loss. Record actual moisture/composition changes and mutually exclusive losses/releases; no invented residual and no full residual mass plus the same released constituent. Internal transfers preserve origin and do not create another exchange. Model the original cohort waste output and its required storage/transport/final treatment even while physically retained, using actual compatible receiver evidence or an explicitly evidenced material/composition/location-matched prospective route with uncertainty. Destination fractions close to one and enter once; no default recycling or zero treatment for retained mass. Unsupported fate stays incomplete. Keep observed custody stock/dispatch as a control ledger, not another inventory addition. Later receiver evidence replaces the same event prospective model and recomputes the original cohort with its original denominator; never add that mass/treatment to a later cohort. Include every necessary lifecycle leg once through a scope crosswalk; exclude site/storage energy and handling already included by site/service inventories. Capital terminal-waste lifetime fractions and wastewater balances retain their separate rules. Here original_reference_count is the original cohort N. The generated-waste exchange is at the generation gate. Its linked complete waste-management inventory takes one kg on that same generated-mass basis through storage and all subsequent fates; final-treatment input is only the compatible measured/evidenced forecast residual after storage losses/moisture conversion, not the full original kg plus separate losses. Explicit storage releases replace the same included release in that linked inventory; a storage/handling operation already in site/service pools is removed from the waste link by a recorded scope crosswalk, never counted twice."
      inputs:
        - cp_depot_waste
        - cp_cohort
      output: "generated waste kg per original reference flow; origin stock and treatment revision ledger"
      source_ids: []
    - id: calc_electric_stock
      applies_to: "road_electricity"
      rule: "Meter-plus-stock energy E_total = metered inlet AC + opening AC-equivalent stored kWh + traced stored-energy imports - closing AC-equivalent stored kWh - traced stored-energy exports. All values cover identical physical boundaries and complete intervals; validate the configuration/temperature/age-matched empirical AC-equivalent curve under the collection protocol, preserving source vectors on transfers and charging losses once. Unknown stock/conversion is incomplete, never zero. Separate measured zero-addition direct-event AC E_zero from E_total before any route allocation: E_route=E_total-E_zero. A negative unexplained residual blocks completion. Assign E_route by the existing mutually exclusive route/motion/stop pools; assign E_zero only by allocation_charge_zero, with all-user shares and no fictitious stock source. Site/noncharging electricity remains exclusively in its separate site/support cards. Define K_traction as the sum of the cohort-assigned residual-route and direct zero-event energy (unnormalized kWh); road_electricity=3.6*K_traction/N. Write this final result directly to the traction row; calc_provider_electric_stock independently finalizes contracted rows at their own boundary."
      inputs:
        - cp_road
        - cp_cohort
      output: "MJ per reference flow"
      source_ids: []
    - id: calc_transport_capital
      applies_to: "activity_road_infrastructure; activity_charging_asset_service"
      rule: "Road activity = sum(actual self-operated segment vehicle-km * its cohort share)/N, including empty/failure legs; use the declared motion/empty-tour shares, not parcel t*km as a vehicle-km substitute. Match each road/vehicle class to the cp_transport_capital infrastructure intensity once. Charger activity = [sum_positive(H_k*a_c,k) + sum_zero(H_k*z_c,k)]/N. H_k is nonoverlapping allocated apparatus-hours from cp_transport_capital. For verified gross source addition I_k>0, a_c,k is the allocation_charge_sources beneficiary share, retaining source stock carryover. For verified I_k=0, z_c,k is the mutually exclusive direct/causal-set/fixed-day share in allocation_charge_zero. Never divide zero-addition events by energy or drop their occupied hours. Source additions are gross, not net SOC changes. All-user shares close to one; no full-cohort km repeated independently per session.  Complete charger intensity uses its full lifecycle inventory/lifetime occupied apparatus-hours, with idle/underuse and calendar retirement reflected. Standby electricity is measured over occupied and idle intervals, allocated by supported activity to all beneficiaries and included once in site/road electricity, never both. Verify exact component/module removals from vehicle, building and purchased-carriage scopes; absence of compatible evidence blocks completion. Replace raw session occupied h by H_k under cp_transport_capital; use allocation_charge_sources for positive additions and allocation_charge_zero for verified zero additions. Direct-event failed-attempt AC is assigned under the same zero-event shares once and removed from residual route-energy allocation; non-event idle standby remains separately reconciled, never duplicated. These are raw provider activity diagnostics only; they are not inventory exchanges. Distribute only the separately named physical rows in the corresponding support processes, using original raw activity and one final reference normalization. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
      inputs:
        - cp_transport_capital
        - "route and cohort ledger"
        - calc_electric_stock
      output: "raw activity diagnostic: vehicle*km; occupied charging h per reference flow"
      source_ids: []
