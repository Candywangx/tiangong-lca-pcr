product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.postal-and-courier-services.postal-services-related-to-letters"
  classification_refs: "CPC 3.0 68011; narrower configuration only. The subclass also includes newspapers, periodicals, brochures, leaflets and international services under a universal service obligation (USO)."
  covered_products: "Ordinary addressed paper-letter collection, sorting, domestic surface carriage and delivery under a documented USO, with all motor-road operations purchased from carriers and electrically operated or purchased-hot-water-heated postal facilities without onsite combustion or refrigerant equipment."
  excluded_products: "Courier/express, parcels, newspapers/periodicals, advertising leaflets/brochures, registered/insured/signature products, international or air/rail/sea carriage, self-operated motor fleets, onsite combustion and refrigerant-equipped facilities."
  representative_product: "One correctly delivered ordinary addressed letter in one declared domestic origin/destination and weight/service-class stratum; no standard letter weight, distance or delivery time is assumed."
  production_route: "Acceptance/collection → address preparation and sorting → outsourced road linehaul → destination sorting → outsourced van collection/delivery rounds → correct delivery; actual redelivery, forwarding and final returns are retained in the cohort."
  market_state: "Completed postal service at the declared delivery point; the carried letter remains customer cargo and is not a manufactured product of the operator."
functional_unit:
  what: "Correct delivery of one admitted ordinary addressed letter under the declared USO and this service configuration."
  how_much: "One completed delivered-letter service."
  how_well: "Correct declared delivery point and acceptance-quality condition; disclose service class, observed transit time, lateness and damage, without equating dissimilar service levels."
  how_long_or_cycle: "One closed calendar-month acceptance cohort, followed through each actual terminal outcome; no arbitrary follow-up limit converts pending letters into delivered or lost letters."
  reference_flow_link: "delivered_letter"
system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "all processes"
      rule: "Apply only when every configuration qualifier is evidenced. USO is mandatory. Different routes or onsite fuel/refrigerant operations require a separately reviewed methodology configuration; this PCR does not authorize replacing them with zero or a generic service."
      source_ids:
        - un-cpc3-68011
    - rule_id: b_gate
      applies_to: "postal_letter_service"
      rule: "Include counter/collection, all sorting and storage, all road legs and empty repositioning, attempted deliveries, forwarding, returns, terminal disposal and attributable administration/support. Record custody transfers in the same journey ledger without creating extra completed services. Pre-custody counter rejection is included as same-service acceptance support, not as an admitted letter."
      source_ids:
        - upu-postal-ghg-2010
    - rule_id: b_no_double
      applies_to: "all inventory rows"
      rule: "Apply foreground_interface_coverage: outside foreground use the specific service interface; the following detailed physical requirements apply only to foreground-owned components. For every purchased leg include its physical fuel/electricity, direct emissions, manufacture, maintenance, infrastructure and terminal scope under mutually exclusive inventory owners exactly once. No complete transport-service input remains. Capital manufacture excludes separately metered operation and trays. Link each physical waste carrier to its compatible supported treatment once; never count whole wastewater and contained pollutant mass twice as treatment amounts."
      source_ids: []
    - rule_id: b_materials
      applies_to: "all inventory rows"
      rule: "Cards cover the declared configuration. Verify absence of unlisted direct chemicals, refrigerant losses, fuels and material wastes using procurement, maintenance and waste registers; a found unlisted exchange blocks completeness and requires an atomic card and reviewed scope before use. Never discard an actual material merely because it lacks a UUID."
      source_ids: []
    - rule_id: b_counter_interface
      applies_to: "postal_letter_service"
      rule: "Apply foreground_interface_coverage: outside foreground use the specific service interface; the following detailed physical requirements apply only to foreground-owned components. Ordinary acceptance-counter activity and its support are included. If another provider performs acceptance, use its separately identified physical inventory with matched interface and remove exact overlapping counter energy, materials and asset shares here; count acceptance once. A counter-service package is not an input. Postage is a payment, and customer letters are custody cargo rather than operator-manufactured goods."
      source_ids: []
    - rule_id: boundary_atomic_support
      applies_to: "supporting activities"
      rule: "Each active exchange represents one defined material, equipment or service object with one primary property and unit. A service is not disallowed merely because it has upstream processes. Fix responsibility by provider, contract, site, event, gate and scope component before quantification. Operator-run processes and separately commissioned onsite tasks under operator inventory responsibility use foreground physical rows. Independently provided activities outside that responsibility use their specified service-interface rows; supplier manufacture, utilities, maintenance and waste remain in the matched background service, not extra foreground exchanges. A contract alone does not turn supplier internals into foreground. Do not change the product, route, custody gates or original reference denominator. Apply foreground_interface_method and foreground_interface_coverage; boundary changes need PCR review, not a data-availability choice. Ownership here means inventory responsibility, not legal title alone: rented equipment provision may be an external service while separately metered operator-run electricity remains foreground."
      source_ids: []
    - rule_id: foreground_interface_coverage
      applies_to: "all support processes and overlaps"
      rule: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Letter accepted into operator custody at the declared mailbox, collection stop or postal counter. Collection from an admitted pickup is included; customer travel and manufacture of the carried letter/envelope are outside the postal-service gate."
  starting_condition_role: "Service-custody boundary, not zero-burden manufacture of paper. A whole-letter product LCA must add its paper/printing independently."
  product_classification_scope: "Only the domestic ordinary addressed-letter, outsourced-road, non-combustion/non-refrigerant facility configuration within CPC 3.0 68011."
  recursive_input_rule: "Apply boundary_atomic_support: external activities enter through a defined single-unit service interface; do not recursively expand supplier internals. Foreground physical processes retain their existing cards and rules. Custody cargo is not a manufactured input."
  upstream_dataset_requirement: "Keep a signed scope-ownership matrix for each service contract and background dataset: exact gates, route/configuration, place/period, native reference unit, quality, supply/operation/empty/failure/maintenance/capital/terminal coverage, all-user allocation and foreground overlaps. Background coverage must preserve the existing lifecycle obligations and candidate allocation policies; it may be documented by a compatible dataset and supplier scope declaration without obtaining every internal exchange. Purchased quantity is measured at the interface; bundled independent services or incompatible units require separate concrete rows. For partial coverage partition by evidenced event/component first. Keep operator-owned assets, separately supplied energy/materials, customer-provided parts and operator-retained waste only in their own physical rows and exclude them from the supplier inventory. Suppress only identical covered supplier components; retain excluded real components through their own specific interface/physical rows. Never add the detailed counterpart to a service covering it; never erase burden because supplier detail is unavailable. Missing service-unit conversion, identity, coverage or a required complementary component blocks completeness, not zero. Existing narrower product applicability, physical stock balances, original-cohort corrections and receipt evidence remain mandatory for their actual owners."
  disclosure: "Follow admitted letters through correct delivery or final return/loss/authorized disposal; include associated retries, rerouting, holding, zero-output operation and rejected-intake share. Exclude recipient use and customer-letter production. Require exact supplier interface and capital coverage statements."
