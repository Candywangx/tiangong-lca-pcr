  calculation_rules:
    - id: calc_close
      applies_to: "delivered_letter"
      rule: "Select a full calendar acceptance month and service stratum. Track A admitted unique letters to D delivered, T finally returned, L documented lost and X authorized destroyed/other failed terminal outcomes. Require A = D + T + L + X and pending = 0. Final data require D > 0. Reattempts/forwarding stay on the same id. Pending work retains attributed burdens in its own cohort ledger and cannot be shifted to another month's D."
      inputs:
        - A
        - D
        - T
        - L
        - X
        - cp_cohort
      output: "closed cohort; D"
      source_ids: []
    - id: foreground_interface_method
      applies_to: "svc_linehaul; svc_van_round; svc_sorting_asset; svc_premises"
      rule: "Before measurement classify every event/scope component as foreground physical or external service under boundary_atomic_support, with no overlap. Apply existing physical-card formulas, component rules and cp_support protocols only to the former, never demand an external provider BOM or internal meter ledger to activate a service interface. For a service row s collect raw A_s,e in its fixed native unit and alpha_s,e from the existing named activity allocation: direct cohort events have alpha=1; genuinely shared events retain the original all-user driver, failure/empty/standby treatment and event window. Allocated service amount T_s=sum(A_s,e*alpha_s,e); if the native activity ledger already contains cohort-attributed activity, alpha is already applied and must not be multiplied again. q_s=T_s/N_ref, with N_ref the original positive cohort reference output. Preserve raw totals for zero output and mark the unit result incomplete. Do not convert time, area, count or transport activity to energy or equipment mass without a separate evidenced relationship. Do not apply physical capital life fractions again to a service inventory that already contains its capital allocation. Quantities for background linkage equal q_s times an inventory per one identical service unit, once; an emission factor is not the service exchange quantity. All old physical-only instructions and service prohibitions apply only to the foreground physical branch; the service branch follows this rule and its explicit interface protocol. Incomplete or aborted service events retain their evidenced attributable burden. Do not silently discard them because the interface counts completed units: document an equivalent native service quantity supported by the contract and execution records, or add a separately identified partial-service row before claiming completeness; never assume a full unit or zero. A supplier value already per the final reference is not a raw A_s,e: recover its original total and denominator before recomputation, or prove exact equivalent normalization without dividing by the final denominator again. Any included supplier allocation is applied only once."
      inputs:
        - cp_interface_linehaul
        - cp_interface_van_round
        - cp_interface_sorting_asset
        - cp_interface_premises
      output: "native service units per original reference flow"
      source_ids: []
    - id: calc_interface_linehaul
      applies_to: "svc_linehaul"
      rule: "Apply foreground_interface_method. Native activity A_s,e (t*km): sum(actual gross payload tonnes * actual loaded leg km); the matched service includes its assigned empty return and vehicle lifecycle. Use the existing activity_linehaul beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_linehaul
        - activity_linehaul
      output: "t*km/D"
      source_ids: []
    - id: calc_interface_van_round
      applies_to: "svc_van_round"
      rule: "Apply foreground_interface_method. Native activity A_s,e (vehicle*km): actual complete round vehicle km including loaded, empty, failed and repeated legs; apply the retained movement/stop beneficiary shares once. Use the existing activity_van_round beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_van_round
        - activity_van_round
      output: "vehicle*km/D"
      source_ids: []
    - id: calc_interface_sorting_asset
      applies_to: "svc_sorting_asset"
      rule: "Apply foreground_interface_method. Native activity A_s,e (h): actual configured machine hours attributed by the existing run/shift ledger; includes provision, upkeep and terminal responsibility, excludes separately metered operation. Use the existing activity_sorting_asset beneficiary and event-window rules only for service activity attribution; the physical branch is not required. q_s=sum(A_s,e*alpha_s,e)/D once. A compatible supplier intensity must use exactly this unit, scope and original allocation policy; no standard activity per final output is assumed."
      inputs:
        - cp_interface_sorting_asset
        - activity_sorting_asset
      output: "h/D"
      source_ids: []
    - id: calc_interface_premises
      applies_to: "svc_premises"
