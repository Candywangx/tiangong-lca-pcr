      record_type: "physical_exchange_and_asset_register"
      raw_fields: "event/asset/site/provider/configuration; exact product/substance; phase; Q_x,j and native unit; source intensity and activity basis; lifetime activity and f; terminal asset link and residual unit; stock and transfer IDs; original waste event/cohort; meter/calibration; all-user driver; overlap ownership; prospective route version; occurrence evidence; species identity/CAS, T and NO2-equivalent definition, source-matched molar a, molecular-mass provenance, direct species mass/factor and calibration; provider/vehicle/battery/session IDs; synchronous clock/timezone; inlet AC meter/calibration; actual capacity and DC/BMS gross addition I_k separate from draws; opening/closing calibrated stored energy; matched configuration/temperature/age AC-equivalent curve; source vectors S_bk and transfer IDs; per-source draw/loss/closing and capital carryover; positive/zero/unknown evidence; direct E_zero; causal task and all-user local-day service-time denominators; meter and scope overlap owner; maintenance_year; timezone; asset_id; installed/consumed M_x,y; generated residual kg; all_user_driver_y; cohort_attributed_driver_y; causal_event/task; unused inventory/returns/transfers"
      collection_method: "Collect only active foreground physical components under foreground_interface_method; external services use cp_interface_ protocols. Actual purchased non-refrigerated road letter-mail trunk carriage; expansion describes the carrier background, not a change to operator-owned transport. Retain cp_carriage, a_transport, calc_linehaul and agg_cp_carriage. Calculate actual gross cargo tonne-km including documented tray tare on loaded legs. For each carrier vehicle/route/period, use cohort actual tonne-km /all-user actual tonne-km as its fixed share; its total physical inventory must include the closed-route empty/reposition burden and compatible utilization. Do not apply another empty-return/load factor or van allocation to the same segment. Capital and EOL share one documented lifecycle fraction with the carrier lifetime denominator matched to the provider model. Preserve failed/return/tail transport. Operational use/maintenance quantities use the period-share convention below. Quantity convention: operational-period q=Q_period*a/N applies only to use and maintenance, where Q_period is a raw measured physical period/event total and a is its fixed reconciled allocation share. For production use raw manufacture/construction-gate physical asset quantity Q_a and q_prod=Q_a*f/N. For each linked terminal stream use that same asset cohort full-lifecycle terminal physical quantity Q_e and q_eol=Q_e*f/N with exactly the same f; Q_e is not a later-period whole dispatch. Here f already contains the asset lifetime-service fraction and the target cohort/stratum allocation, each once; do not multiply by a second operational share. Q_a and Q_e are never already amortised provider-period equivalents. If a supplier gives amortised equivalents, recover and verify the original asset cohort physical quantity and full-life denominator before applying this convention; never multiply an already consumed-life quantity by f again. N means the original D for 68011 or N_s for 68013, once. At each provider/source gate, collect event/asset/site/route/configuration and exact physical identity, condition of occurrence/non-occurrence, direction/type/receiving medium, raw quantity and unit, meter/tare/calibration, timestamps and timezone, complete accounting interval, source unit-inventory basis, all-user activity and cohort joins, manufacturing/installation/use/maintenance/EOL phase, original/remaining asset fractions, paired terminal residual provenance, stocks/transfers, receiver/fate and prospective-model revisions. Retain signed supplier scope and exact overlap crosswalk to existing direct rows. Obtain chemistry/BOM/species identity before adding a missing concrete row; an unbound candidate can await official identity but cannot be a plural collection. Measure all events, reconcile per local month/maintenance year as prescribed and review the complete asset/supplier inventory annually and at configuration/retirement changes. Unmeasured positive activity, unsupported future treatment or an unlisted actual exchange prevents completeness. For the provider own vehicle/battery boundary apply calc_provider_electric_stock; require calibrated capacity/AC-equivalent empirical charge-discharge curves, chronological source-labelled transfers and balanced stocks. Charging source/capital-hour carryover follows allocation_charge_sources and allocation_charge_zero where defined, using this provider original activity ownership, not a second owned-fleet copy. This vehicle rule does not apply to separately metered workshop/site/installation AC. Apply allocation_provider_maintenance_period and calc_provider_maintenance_period to this provider actual routine/causal maintenance; no whole-cohort distance in each year."
      unit: "card-native units; raw t*km"
