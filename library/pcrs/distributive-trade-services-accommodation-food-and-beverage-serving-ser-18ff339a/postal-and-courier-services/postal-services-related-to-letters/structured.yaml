      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Verify supplier service models or construct owned-asset service models with documented complete lifecycle inventories and lifetime denominators; reconcile downtime and premature retirement. Do not invent useful life or treat cost as quantity."
      unit: "h; m2*h"
      frequency: "annual inventory with monthly utilization logs"
      temporal_coverage: "representative life-cycle records matched to cohort year"
      site_scope: "all sorting equipment and premises in scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; model coverage; engineering useful-life records; maintenance/retirement records"
