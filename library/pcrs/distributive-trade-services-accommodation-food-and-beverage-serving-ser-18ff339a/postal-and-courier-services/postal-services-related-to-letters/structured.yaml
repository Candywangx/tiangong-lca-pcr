    - id: inv_fuel_gate
      applies_to: "u_linehaul_diesel; u_linehaul_gasoline; u_van_round_diesel; u_van_round_gasoline"
      requirement: "Only where this exact fuel is documented for the in-scope provider vehicle; keep different grades separate. Fuel delivered to the vehicle tank, with matched upstream production and delivery; do not also add a combustion-service package."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_asset_basis
      applies_to: "u_linehaul_vehicle_factory_gate; u_van_round_vehicle_factory_gate; u_sorting_asset_factory_gate; u_premises_construction_gate"
      requirement: "The input Q_a is the original manufacture/construction-gate physical quantity before amortisation; apply f once as specified in lifetime_driver. Actual maintenance quantities use their separate period/event share, never this manufacture f. Already amortised supplier inputs require recovery of original Q_a and the full-life denominator; applying f again is prohibited."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_maintenance_share
      applies_to: "u_linehaul_mineral_lubricant; u_linehaul_waste_mineral_lubricant; u_van_round_mineral_lubricant; u_van_round_waste_mineral_lubricant"
      requirement: "Attribute measured actual maintenance-period/event quantities by that period/event service share; do not multiply them by capital manufacture f."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_terminal_basis
      applies_to: "u_linehaul_retired_vehicle; u_van_round_retired_vehicle; u_sorting_asset_retired_asset; u_premises_retired_asset"
      requirement: "Its raw Q_e is the full-lifecycle terminal physical quantity belonging to asset_suffix, before amortisation, not an amortised provider-period amount or a later-period dispatch total. Apply exactly the linked production f once and divide by the original denominator once; no extra operational allocation share."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_vehicle_species
      applies_to: "u_linehaul_co2_fossil_air; u_linehaul_co_air; u_linehaul_no_air; u_linehaul_no2_air; u_linehaul_n2o_air; u_linehaul_ch4_air; u_linehaul_so2_air; u_van_round_co2_fossil_air; u_van_round_co_air; u_van_round_no_air; u_van_round_no2_air; u_van_round_n2o_air; u_van_round_ch4_air; u_van_round_so2_air"
      requirement: "Only when the exact substance, fossil/biogenic qualification where applicable, receiving-air compartment and measured or fuel/technology-specific calculation are evidenced. Vehicle-use emission only, calculated once from measured fuel/operation and the documented single-species factor. Do not use NOx, total hydrocarbons, CO2e or a generic exhaust mixture as this row."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_van_scope
      applies_to: "u_van_round_diesel; u_van_round_gasoline; u_van_round_traction_electricity; u_van_round_vehicle_factory_gate; u_van_round_mineral_lubricant; u_van_round_waste_mineral_lubricant; u_van_round_retired_vehicle; u_van_round_co2_fossil_air; u_van_round_co_air; u_van_round_no_air; u_van_round_no2_air; u_van_round_n2o_air; u_van_round_ch4_air; u_van_round_so2_air"
      requirement: "Actual purchased non-refrigerated road van collection/delivery; expansion describes the carrier background, not a change to operator-owned transport."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: v_scope
    applies_to: "postal_letter_service"
    rule: "Reject application outside documented USO, ordinary domestic addressed-letter scope and specified facility/outsourced-road configuration. Do not treat narrower mapping as full CPC coverage or equate service classes, payloads, geography, distances or time performance."
    source_ids:
      - un-cpc3-68011
  - rule_id: validate_service_interfaces
    applies_to: "svc_linehaul; svc_van_round; svc_sorting_asset; svc_premises"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: v_counts
    applies_to: "delivered_letter"
    rule: "Check unique ids, A = D + T + L + X, pending = 0, D > 0, actual terminal evidence and carried burdens. Reject double-counted attempts, returns presented as delivered, abandoned pending records or cross-cohort shifting."
    source_ids:
      - usps-undeliverable-mail
  - rule_id: v_balance
    applies_to: "all inventory rows"
    rule: "Check every row unit/property, source activity, allocation sums, meter/stock/waste balance, carrier scope and one final J/D division. Inspect both languages and machine projection for all boundary/allocation/collection/quality rules and exact row/protocol links. A schema/fingerprint pass alone is insufficient. Test A-period generated retained waste and B-period dispatch: original A responsibility and denominator persist, and actual evidence replaces that same event model without another B burden."
    source_ids: []
  - rule_id: v_completion
    applies_to: "all processes"
    rule: "Incomplete foreground evidence or unverified flow identities must remain disclosed and prevent a fully verified result. Candidate authoring and aligned translation do not establish scientific review, methodology approval or publication authority."
    source_ids: []
  - rule_id: validate_atomic_support
    applies_to: "all support and emission rows"
    rule: "Verify the event/component responsibility matrix before reading row amounts. An external-service component activates its interface only; its covered detailed physical counterpart is inactive, not a measured zero. Verify one property/unit, raw native activity, original all-user allocation and single final normalization; failed/reworked/empty events follow the retained cohort rules. Test partial contracts, own energy/assets/retained wastes, already allocated supplier inventories, zero-output cohorts and missing complementary coverage. Reject double counting, invented identity/amounts, forced supplier-internal collection or an undocumented branch change. Verify all service row IDs and protocol/rule links in both languages and generated guidance."
    source_ids: []
  - rule_id: validate_capital_restatement
    applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
    rule: "Check original cohorts/denominators, all-user driver, source versions, booked amounts and restatement corrections under calc_capital_restatement. Reject frozen old history with only future-denominator changes, retirement-balance transfer to unrelated current output, and negative physical exchanges."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground service-process dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "The declared ordinary domestic letter service configuration with matched qualifiers and complete evidence."
  excluded_use: "Whole-letter paper manufacture; courier/express or parcels; full CPC 68011 coverage; unspecified average letter; other fleet/facility technologies; comparison without equivalent function and quality."
  required_metadata: "All reference qualifiers; custody cohort and terminal tail; exact supplier interfaces; allocation and capital models; data year and geography.; ordinary-waste generation origin, original shares/denominator, retained stocks and treatment revision chain; signed foreground/interface responsibility matrix, native service activity and background coverage; original physical activity, manufacture/terminal pairing and species basis only for foreground-owned components"
  required_quality_disclosure: "Completeness; sampling and measurement uncertainty; pending/failed outcomes; flow identity status; missing data and exclusions; narrower scope."
  update_trigger: "Change in USO/service class, route, carrier/fuel, facility technology, delivery gate, supplier coverage, allocation evidence or material activity.; later ordinary-waste receipts/fate or generation correction update the original event/cohort model; foreground physical identity/speciation changes or external interface configuration/unit/coverage changes require applicable concrete-row review and fresh projection"
data_sources:
  - id: "un-cpc3-68011"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0, code 68011 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/68011"
    used_for: "USO classification boundary; the present candidate deliberately covers a narrower service and operating configuration."
  - id: "upu-postal-ghg-2010"
    type: "official_guidance"
    reference: "UPU / IPC / PostEurop, GHG Inventory Standard for the Postal Sector, March 2010, PDF pp. 7, 24–25 (principles; activities and allocation). https://www.uncclearn.org/wp-content/uploads/library/upu05.pdf"
    used_for: "Postal activities and completeness/allocation context only. PCR-specific hierarchy/formulas are declared foreground methods, not quoted UPU defaults; no historical emissions factor is adopted."
  - id: "usps-undeliverable-mail"
    type: "official_guidance"
    reference: "US Postal Service, How is Undeliverable and Misdelivered Mail Handled?, undeliverable/return and delivery-point sections. https://faq.usps.com/articles/Knowledge/How-is-Undeliverable-and-Misdelivered-Mail-Handled"
    used_for: "Official operator example distinguishing delivery, return and undeliverable outcomes; not a universal national service rule or a fixed forwarding duration."
