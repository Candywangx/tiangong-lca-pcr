allocation_rules:
  - rule_id: a_hierarchy
    applies_to: "all inventory rows"
    rule: "Use direct metering and subdivision first. For a shared sorting machine allocate variable energy and asset hours by measured processing time per service stratum; allocate standby over the same period's occupied machine-hours. For shared counter activity use observed transaction handling minutes. Reconcile all service shares, including parcels and other mail, to the full measured total; no revenue allocation."
    source_ids:
      - upu-postal-ghg-2010
  - rule_id: a_facility
    applies_to: "facility_electricity, hot_water_heat, activity_premises, tap_water, sanitary_wastewater"
    rule: "After submetered process loads are removed, allocate shared lighting/space heat/premises by occupied floor-area-hours. Allocate sanitary water by staff-hours assigned to each service from duty rosters and cleaning water by cleaned floor-area-hours. Include service support/administration by the supported operations' staff-hours. Idle or rejection-related burdens remain in the period pool, not zero."
    source_ids:
      - upu-postal-ghg-2010
  - rule_id: a_transport
    applies_to: "activity_linehaul, activity_van_round"
    rule: "For trunk carriage use actual payload tonne-km and a matched carrier model that already incorporates empty return and utilization. For van rounds allocate moving-route resource by measured segment payload mass share and stopped/idling resource by measured stop service minutes, using calc_round. Count only one of these models per physical segment; retain full empty/repositioning burden and all parcel/letter/other-service shares."
    source_ids: []
  - rule_id: a_failure
    applies_to: "delivered_letter"
    rule: "Within a declared service stratum allocate the complete closed-cohort burden, including final returns, losses, authorized disposal, rejected-intake share and all retries, over D once. Return/forward/retry events are not co-products and do not create additional D. Other-service allocations occur before this division, not after it. No avoided-product credit."
    source_ids:
      - usps-undeliverable-mail
  - rule_id: a_rejected_intake
    applies_to: "postal_letter_service"
    rule: "Pre-custody rejected tenders R do not enter A, D, T, L or X. First attribute the measured counter-acceptance resource pool by requested service class/stratum and handling minutes. Include only rejection handling and its support share for tenders of this configuration in the same calendar month as the acceptance cohort, add to that cohort's other J, then divide by D once. Do not multiply by a second rejection/failure ratio or shift burdens between months. Unidentified requested class or handling time leaves allocation incomplete."
    source_ids: []
  - rule_id: a_tray_lifecycle
    applies_to: "mail_tray; tray_waste"
    rule: "For each identified tray cohort use f = cohort-attributed loaded-use cycles / evidenced complete lifetime loaded-use cycles for both manufacture and ultimate treatment. Manufacturing kg = original tray net kg * f; terminal waste kg = observed retired residual kg or an explicitly prospective residual kg from measured current mass and documented loss/reuse/removal plans, multiplied by the same f. Complete life includes all users and subsequent reuse, premature breakage and calendar retirement. Retain booked amounts and restate all original beneficiary cohorts on every life revision under calc_capital_restatement. Actual retirement/receiver records update this model and are a separate custody-control ledger, never a second current-period treatment exchange. Unknown life, residual mass or endpoint blocks completeness. Define each loaded cycle by one tray ID from first loading to final unloading; split at every cargo/owner change. Within that cycle assign its one use by each cohort/service stratum net cargo kg*residence h divided by all cargo kg*h in that same tray cycle, excluding tray tare; sum assigned cycle fractions before f. Dedicated use has share 1. Measure masses and timestamp all load/unload events; missing all-cargo coverage blocks completion. Empty return and standing periods create no extra loaded-cycle output, but remain reflected in complete life, handling/transport activity and calendar/early-retirement evidence. Final retirement restates manufacture and terminal quantities by actual complete-life beneficiary cycle shares and corrects each original cohort and original D. Retirement time triggers corrections, not a retirement-period remainder burden. A never-used tray requires evidenced sole commissioning service responsibility; otherwise allocation is incomplete. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
    source_ids: []
  - rule_id: allocation_waste_origin
    applies_to: "label_waste; letter_waste"
    rule: "Fix each ordinary solid-waste generation event to its original service cohort and stratum at generation, never at later dispatch. Directly trace the generating task first; shared generation uses the existing site/handling allocation driver over the recorded generation interval, including all customer and noncohort workloads. Preserve event ID, generation date, original shares and original reference denominator through storage and internal transfers. Acquired old waste is not new generation. Retained waste keeps its original treatment responsibility; dispatch-period service does not inherit it. For shared generation, split records at each fixed local-calendar-month boundary (68013 uses its already declared counter accounting period instead); apply the existing site task/handling driver within that exact generation interval, not the full later dispatch/cohort window. Direct event attribution takes precedence. Record site timezone before period assignment."
    source_ids: []
  - rule_id: allocation_atomic_physical
    applies_to: "supporting physical inventory"
    rule: "For each provider, site, configuration, event and accounting interval, partition every measured physical total into mutually exclusive inventory owners before selecting the study cohort. Use the fixed activity driver for that support process, with all users and failed work in the denominator. Direct causal attribution precedes shared allocation. Never multiply a cohort share a second time if already attributed. Keep service-level allocation quantities as raw drivers, not exchange quantities, and do not repeat division by the final reference count. Meter/stock, installed/replaced assets, internal transfers, generated waste and fate balances must reconcile at the same physical/time boundary. A complete product gate may retain its manufacturing background, but a lump service row may not be reintroduced under a different label."
    source_ids: []
  - rule_id: allocation_atomic_capital
    applies_to: "manufacture; installation; terminal assets"
    rule: "For each physical asset serial/cohort a, Q_a is its actual manufacturing/construction-gate quantity in the card unit. Set f_c,a=attributed physical lifetime activity_c,a/evidenced full-life all-user activity_a, using the process/asset-specific driver and identical configuration/capacity units. Manufacture q=sum(Q_a*f_c,a)/N_ref; each initial and whole-asset replacement creates its own asset cohort and enters once, not an additional current-period maintenance item. Installation physical quantities outside the asset product gate use that same installed-asset fraction. Terminal residual quantity in its own declared unit, evidenced from matched retirement or a prospective residual/reuse/retention plan, uses exactly the same f_c,a and original reference denominator; actual custody transfers only verify/update it. Earlier removed parts are excluded from terminal residual. Restate life and all original beneficiary cohorts under calc_capital_restatement; lifetime estimates need evidence and sensitivity, never numeric defaults. Genuine component repairs/replacements use actual causal events or the fixed provider maintenance-year shares, not another whole-life fraction. A whole component reused as a separately commissioned capital asset instead receives its own serial/lifetime register, never both treatments."
    source_ids: []
  - rule_id: allocation_capital_restatement
    applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
    rule: "This PCR uses full restatement, not frozen historical shares or a retirement-period catch-up. All direct and supporting capital, reusable containers, installation outside the product gate and paired terminal sources follow calc_capital_restatement. Each specific activity rule fixes the driver and beneficiary shares; these are applied once. A complete asset background already including delivery/end-of-life follows the same restatement, without separate duplicate terminal exchanges. Routine component maintenance remains under its causal/period method."
    source_ids: []
  - rule_id: allocation_atomic_waste
    applies_to: "operational and maintenance wastes"
    rule: "Generated operational and maintenance waste retains its original generation event, provider/activity cohort, shares and original reference denominator through storage and transfers. Fixed shared-waste intervals are local calendar months with timezone declared; use same-interval causal activity and all users, unless an existing more specific maintenance-year or counter-period method applies. Reconcile closing=opening+generation+internal_in-internal_out-external_dispatch-evidenced_physical_loss on consistent material/moisture bases. Include supported eventual storage/transport/treatment for retained waste, with actual evidence or an explicitly evidenced compatible prospective route and uncertainty; unknown fate remains incomplete. Later receipts replace that original event model, not add a new dispatch-period burden. Asset terminal-waste uses its paired capital fraction instead. Waste carrier and its constituents, storage losses/releases and residual treatment cannot be counted twice; the same measured site/storage operation remains under one inventory owner."
    source_ids: []
  - rule_id: allocation_provider_maintenance_period
    applies_to: "u_linehaul_mineral_lubricant; u_linehaul_waste_mineral_lubricant; u_van_round_mineral_lubricant; u_van_round_waste_mineral_lubricant"
    rule: "For every shared routine supporting-provider maintenance pool, fix interval y to the site-local calendar year with timezone and exact asset/site/configuration recorded. Split a cohort crossing years into its within-year activity. Actual installed/consumed material M_x,y and its separately measured generated waste use s_c,y=cohort-attributed beneficiary driver_y/all-beneficiary driver_y for that same year, then q=sum_y(M_x,y*s_c,y)/N_ref once. The driver is the physical support-process activity fixed in activity_*; for vehicle upkeep it is actual vehicle kilometres including once-attributed empty/failure travel, for variable road upkeep it is evidenced class-specific engineering damage in the same year, and for building fabric it is reserved floor-area-calendar-hours. Other shared support equipment uses its fixed actual all-beneficiary task/cycle/union-hour driver; retain exact configuration strata and no concurrency duplication. A signed maintenance work order fixes the causal asset and task pool before calculation, not a later modeller choice. Specific accident/failure repair is allocated exclusively to its evidenced causal order/task set, never also to the annual routine pool. Genuine component consumption excludes unused opening/closing stocks, uninstalled returns and internal transfers; generated removed parts retain this original event/year/share through later custody. No assumption that input and removed-part masses are identical. Apply one annual period share, not whole-life f, to real component repairs; entire replacement assets create separate capital cohorts instead. A positive unsupported pool or zero/unknown all-user denominator blocks completeness. Apply the same rules to retained provider maintenance cards where previously referenced; independent specific generation/fate balances and exact overlap exclusions remain mandatory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cohort
      process_id: "postal_letter_service"
      flow_role: "delivered_letter"
      record_type: "journey ledger"
      raw_fields: "unique custody id; acceptance date/site; separate pre-custody rejected-tender transaction id R, date, counter, requested service class/stratum, rejection reason and handling minutes; USO/service code; mass/size; origin/destination; each handoff/attempt/forward/return; terminal date/outcome; condition; transit time; opening/closing pending"
      collection_method: "Reconcile acceptance scans or audited tray manifests to delivery manifests and final return/loss/authorized-disposal records; require a complete acceptance and terminal-outcome register. Sampling may audit the register but cannot replace closed-cohort terminal evidence. Ordinary untracked mail without that evidence cannot yield a complete result. Reconcile R separately from rejection logs, never adding it to A. Never assume dispatch equals delivery."
      unit: "item; kg; day"
      frequency: "each event; close each acceptance month"
      temporal_coverage: "whole acceptance month plus full terminal-outcome tail"
      site_scope: "all counters, facilities and carriers used by cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "audited complete manifests; service terms; outcome evidence; rejection register; counting audit and error bounds"
    - protocol_id: cp_interface_linehaul
      process_id: "support_linehaul"
      flow_role: "svc_linehaul"
      record_type: "service_interface_register"
      raw_fields: "provider; contract/version; event ID; site/route/configuration; owner; scope component; native A_s,e and unit; alpha_s,e and all-user driver; original cohort/output denominator; inclusion/exclusion matrix; meter/time/count source; calibration; background reference/unit/period/allocation; correction and overlap links"
