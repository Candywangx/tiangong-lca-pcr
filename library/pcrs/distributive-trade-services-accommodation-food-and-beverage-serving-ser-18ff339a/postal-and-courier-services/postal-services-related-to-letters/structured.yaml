      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Read water meters and reconcile water use by purpose. Weigh labels and trays with calibrated scales and reconcile stock movements; trace tray cohorts through actual cycles, early failure and stocks, not arbitrary reuse counts. For trays apply a_tray_lifecycle to the same serial/cohort and lifetime basis; document prospective terminal mass, endpoint and uncertainty."
