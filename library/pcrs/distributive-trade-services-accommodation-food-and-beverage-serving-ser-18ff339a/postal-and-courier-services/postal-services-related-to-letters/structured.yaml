      raw_fields: "site/meter id; run/shift id; machine/counter id; cohort ids/counts and service strata handled in each run/shift, with cohort machine occupation and counter handling minutes; readings; unit; interval; sorting run/idle hours; counter handling minutes; other-service loads; floor area/hours; staff-hours; bill; calibration; heat interface"
      collection_method: "Read meters and heat meters at each facility; reconcile submeters to invoices, equipment logs and occupied space; join each run/shift meter interval to its cohort handling manifest and measured cohort machine time/counter minutes; identify all-electric/no-heat cases from plant register, not missing invoices."
      unit: "kWh; MJ; h; m2; min"
      frequency: "daily logs and monthly bill reconciliation"
      temporal_coverage: "cohort activity months and tail periods"
      site_scope: "all actual handling facilities and support share"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; duty/occupancy logs; absence evidence"
    - protocol_id: cp_carriage
      process_id: "postal_letter_service"
      flow_role: "activity_linehaul; activity_van_round"
      record_type: "carrier route record"
      raw_fields: "carrier/vehicle/fuel; subcontract boundary; leg id; loaded and empty distance; actual letter/parcel/other payload mass per segment; tray tare; moving and stopped energy; per-service stop minutes; total route energy; carrier lifetime/maintenance coverage"
      collection_method: "Obtain carrier telematics, fuel/energy records and manifests with exact service boundaries. Reconcile total measured route distance/energy, empty segments and billed activity; request primary carrier records for moving/stopped split rather than select a generic ratio."
      unit: "kg; km; t*km; vehicle*km; min; MJ"
      frequency: "each trip/round/segment; monthly reconciliation"
      temporal_coverage: "every cohort journey including return/retry tail"
      site_scope: "all purchased road legs and nested subcontractors"
      aggregation_rule: "per reference flow"
      quality_evidence: "carrier evidence; scale/telematics calibration; GPS; invoices; allocation audit"
