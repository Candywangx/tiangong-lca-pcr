    - id: calc_capital_restatement_shared_driver_controls
      applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Keep asset manufacture, installation and terminal burden on the same revised f, while gross stock, transfers and retirements remain separate physical control records. For a calendar-time asset, u is its elapsed service-capacity time assigned once to each original class/period by the existing shared/class rule, including the prescribed vacancy/failure responsibility; U covers that same all-user calendar capacity. Do not apply the class share a second time to q. Unknown history, unsupported life/endpoint or missing original denominators blocks completeness."
      inputs:
