  data_quality_requirements:
    - id: q_evidence
      applies_to: "all inventory rows"
      requirement: "Require timestamped raw records, calibrated instruments, declared spatial/temporal coverage and reconciliation residuals. Use measured uncertainty and sampling intervals; no illustrative range is a compliance limit."
      evidence: "cp_cohort; cp_facility; cp_carriage; cp_materials; cp_waste"
    - id: quality_waste_origin
      applies_to: "label_waste; letter_waste"
      requirement: "For every ordinary solid-waste stream verify generation responsibility, original cohort/stratum/denominator, origin-labelled stock balance, supported actual or prospective complete treatment and later-receipt replacement. Unknown origin/fate/physical loss remains an explicit gap; future dispatch alone cannot close or reassign it. Keep wastewater and amortized terminal-asset treatment on their separate methods."
      evidence: "generation/stock/transfer ledgers; supported route models; original-cohort receipt replacements"
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "A semantic candidate without a UUID is explicit, not a verified Tiangong identity. Before a verified data package is claimed, bind exact flow type, state, property, unit and compartment using direct-read evidence and receipt hash; preserve official names. No similar-name substitution."
      evidence: "direct identity evidence and receipt"
    - id: q_missing
      applies_to: "all processes"
      requirement: "Unknown quantities, receiver, activity occurrence, carrier coverage and allocation shares remain missing. Establish absence with registers and inspection; missing data are not zero. Report gaps and block complete/conforming result until resolved; no undisclosed generic fallback."
      evidence: "procurement/asset/waste registers and coverage audit"
    - id: quality_atomic_completeness
      applies_to: "all disaggregated support and species"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "scope-to-physical-row reconciliation; supplier/BOM/species originals; signed gap register"
    - id: quality_service_interfaces
      applies_to: "svc_linehaul; svc_van_round; svc_sorting_asset; svc_premises"
      requirement: "Completeness is branch-specific under foreground_interface_method and foreground_interface_coverage. Foreground physical exchanges need the retained exact identities, original measurements, species and stock reconciliation. External interfaces need one defined service/property/unit, measured activity, exact supplier gates and compatible background coverage, not exhaustive provider-internal BOMs or capital ledgers. Unknown occurrence is not absence; uncovered real scope is an explicit gap. Unbound interface UUID/property/unit-group identities remain row-specific candidates until direct official evidence and receipts resolve them. The interface is not permission for an undefined multi-service package or for an Item(s) substitute for hours/mass/transport activity."
      evidence: "cp_interface protocols; signed coverage/ownership matrix; native-unit reconciliation; identity receipts"
    - id: scope_interface_linehaul
      applies_to: "u_linehaul_diesel; u_linehaul_gasoline; u_linehaul_traction_electricity; u_linehaul_vehicle_factory_gate; u_linehaul_mineral_lubricant; u_linehaul_waste_mineral_lubricant; u_linehaul_retired_vehicle; u_linehaul_co2_fossil_air; u_linehaul_co_air; u_linehaul_no_air; u_linehaul_no2_air; u_linehaul_n2o_air; u_linehaul_ch4_air; u_linehaul_so2_air; svc_linehaul"
      requirement: "For support_linehaul, svc_linehaul is the external service input under boundary_atomic_support. Its listed physical counterparts apply only to operator-owned foreground components; they are not required supplier-internal collection. For every event/component record exactly one owner and representation. Keep physical components excluded from the contracted service, and remove only evidenced overlap; partial contracts cannot suppress the whole process. Scope changes require the coverage matrix and fresh bilingual projection."
      evidence: "signed foreground/interface matrix; contract exclusions; actual component records"
    - id: scope_interface_van_round
      applies_to: "u_van_round_diesel; u_van_round_gasoline; u_van_round_traction_electricity; u_van_round_vehicle_factory_gate; u_van_round_mineral_lubricant; u_van_round_waste_mineral_lubricant; u_van_round_retired_vehicle; u_van_round_co2_fossil_air; u_van_round_co_air; u_van_round_no_air; u_van_round_no2_air; u_van_round_n2o_air; u_van_round_ch4_air; u_van_round_so2_air; svc_van_round"
