      rule: "For each van round let B be measured total operating energy, B_move and B_stop its measured moving/stopped components with B = B_move + B_stop and B > 0. The pools are mutually exclusive and exhaustive; never allocate the same B separately twice. For each service stratum compute U = sum(moving segment energy times its actual payload mass share) + sum(stop energy times its measured stop-service-minute share). Attribute empty/reposition segments across all services on that round using the loaded segments' attributed moving-energy shares. Then equivalent attributed vehicle-km = full round vehicle-km times U/B; sums across all services must equal full round vehicle-km. A wholly empty round may be assigned only to its evidenced single commissioning service stratum using dispatch records; shared or unresolved responsibility leaves allocation incomplete and retains the burden, never zero. Use only the same measured-duty per-vehicle-km carrier model; non-positive B or missing split/shares blocks complete results. These are raw provider activity diagnostics only; they are not inventory exchanges. Distribute only the separately named physical rows in the corresponding support processes, using original raw activity and one final reference normalization."
