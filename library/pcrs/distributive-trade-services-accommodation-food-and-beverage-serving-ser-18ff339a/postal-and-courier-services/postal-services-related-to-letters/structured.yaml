      requirement: "For support_premises, svc_premises is the external service input under boundary_atomic_support. Its listed physical counterparts apply only to operator-owned foreground components; they are not required supplier-internal collection. For every event/component record exactly one owner and representation. Keep physical components excluded from the contracted service, and remove only evidenced overlap; partial contracts cannot suppress the whole process. Scope changes require the coverage matrix and fresh bilingual projection."
      evidence: "signed foreground/interface matrix; contract exclusions; actual component records"
    - id: inv_trunk_scope
      applies_to: "u_linehaul_diesel; u_linehaul_gasoline; u_linehaul_traction_electricity; u_linehaul_vehicle_factory_gate; u_linehaul_mineral_lubricant; u_linehaul_waste_mineral_lubricant; u_linehaul_retired_vehicle; u_linehaul_co2_fossil_air; u_linehaul_co_air; u_linehaul_no_air; u_linehaul_no2_air; u_linehaul_n2o_air; u_linehaul_ch4_air; u_linehaul_so2_air"
      requirement: "Actual purchased non-refrigerated road letter-mail trunk carriage; expansion describes the carrier background, not a change to operator-owned transport."
