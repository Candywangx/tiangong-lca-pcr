      rule: "Foreground physical branch only under foreground_interface_method; service quantities use their interface rule. Manufacture/construction row u_premises_construction_gate: Q_a is actual unamortized m2 at the declared product gate; q=sum(Q_a*f_c,a)/D. Q_a is the original complete building-shell handover floor area, before amortisation. f=target-cohort/stratum attributed occupied/reserved floor-area-hours divided by the same asset full-lifetime occupied/reserved floor-area-hours; same asset, area and calendar-hour definition are mandatory. For premises_service the numerator is F_s; for premises use its attributed cohort area-hours. q_prod=Q_a*f/D; each full-lifecycle demolition stream Q_e uses identical f/D. Cohort/stratum shares are already in f and are not applied again. Missing lifetime/area boundary blocks completion. Actual maintenance quantities use their separate period/event share, never this manufacture f. Already amortised supplier inputs require recovery of original Q_a and the full-life denominator; applying f again is prohibited. Terminal row u_premises_retired_asset: native kg, q=sum(R_a*f_c,a)/D; join the identical serial/cohort and f_c,a, R_a is the terminal net residual already excluding earlier removals; subtract historical removals once only when deriving R_a from an original gross/BOM basis, never again from measured terminal net residual. Whole replacements create their own asset cohort, never an extra maintenance whole-product flow; distinct installation beyond the product gate uses this same fraction. Static lifetime ratios describe the current version only; life/source changes and final retirement must apply calc_capital_restatement to the original cohorts, not update only future denominators."
      inputs:
        - cp_support_premises
      output: "asset-native physical unit per D; linked terminal native unit, same f"
      source_ids: []
    - id: calc_atomic_species
      applies_to: "all elementary physical rows"
      rule: "Foreground physical branch only under foreground_interface_method; service quantities use their interface rule. Each elementary row identifies one substance or physically specified particle carrier and one receiving medium/subcompartment. Collect the actual substance/CAS or verified chemical identity, factor unit and mass/molar/carbon expression, source technology/fuel/load, location and receiving medium. Apply a substance-specific measured release or compatible factor once. Factory emissions already in a complete product gate are not also direct provider-use emissions. Particle size classes and fate fractions are mutually exclusive; physically defined particles are not fictitious pure elements. NOx and NMVOC totals are QA observations only, never elementary-exchange substitutes. Every actual extra species/material needs its own concrete bilingual source row, protocol, unit, fixed calculation and normal projection before completed modelling; do not use a selector or a family-name placeholder."
      inputs:
        - cp_support_linehaul
        - cp_support_van_round
        - cp_support_sorting_asset
        - cp_support_premises
      output: "one substance or defined physical carrier per receiver"
      source_ids: []
    - id: calc_nox_speciation
      applies_to: "u_linehaul_no_air; u_linehaul_no2_air; u_van_round_no_air; u_van_round_no2_air"
      rule: "For the explicitly evidenced definition NOx=NO+NO2 expressed as NO2-equivalent, record T, its unit/basis and source-matched measured molar fraction a=n_NO/(n_NO+n_NO2). Then m_NO=a*T*M_NO/M_NO2 and m_NO2=(1-a)*T, using independently evidenced molecular masses on the same unit basis. Prefer direct substance-specific mass measurements/factors when available and do not add the QA total again. T is not ordinary NO/NO2 mixture mass; never apply a mass fraction directly to T or assign all T to NO2. If definition includes other nitrogen species, speciation or conversion evidence is missing, no two-component split is permitted: preserve the raw QA observation and block completion until actual species-specific rows and quantities are established. No numeric fraction or molecular mass is defaulted by this PCR."
      inputs:
        - cp_support_linehaul
        - cp_support_van_round
      output: "kg NO and kg NO2, never NO2-equivalent exchange"
      source_ids: []
    - id: calc_provider_electric_stock
      applies_to: "u_linehaul_traction_electricity; u_van_round_traction_electricity"
      rule: "Within each independently metered provider vehicle/battery boundary and complete interval j, E_total=inlet_AC+opening_AC_equivalent+traced_imports-closing_AC_equivalent-traced_exports (kWh). Calibrate usable capacity and empirical inlet-AC/stored-energy curves for the same configuration, temperature and age; percentage SOC or a default efficiency is insufficient. Preserve chronological source vectors on every battery transfer and charging/draw/loss/closing balance, including future beneficiaries and capital-hour carryover; unsupported conversion or unknown stock blocks completion. Remove independently metered direct verified-zero-gross-addition event AC E_zero before route allocation: E_route=E_total-E_zero; unexplained negative residual blocks completion. Allocate E_route using the fixed provider activity_* driver and all users at matching route/task intervals, including empty/failure work. E_zero belongs first to its evidenced causal order, then documented causal task set by actual elapsed service time; genuinely shared noncausal failures use a fixed site-local calendar-day all-user elapsed-service-time pool including failures/waits, splitting at midnight. Unknown gross addition is never zero. No route share is multiplied again onto E_zero. q_AC=(sum(E_route_j*s_provider_c,j)+sum(E_zero_k*z_c,k))*3.6/D, once. Do not reapply provider shares to already attributed physical totals, add another charging-loss uplift, or include workshop/site/installation electricity in this vehicle pool. A compatible supplier intensity must demonstrate this same stock/ownership closure before use; otherwise collect original raw records. Physical-capital f remains its separately fixed lifetime driver, never a second annual energy share."
      inputs:
        - cp_support_linehaul
        - cp_support_van_round
      output: "MJ per original reference flow"
      source_ids: []
    - id: calc_provider_maintenance_period
      applies_to: "u_linehaul_mineral_lubricant; u_linehaul_waste_mineral_lubricant; u_van_round_mineral_lubricant; u_van_round_waste_mineral_lubricant"
      rule: "For every shared routine supporting-provider maintenance pool, fix interval y to the site-local calendar year with timezone and exact asset/site/configuration recorded. Split a cohort crossing years into its within-year activity. Actual installed/consumed material M_x,y and its separately measured generated waste use s_c,y=cohort-attributed beneficiary driver_y/all-beneficiary driver_y for that same year, then q=sum_y(M_x,y*s_c,y)/N_ref once. The driver is the physical support-process activity fixed in activity_*; for vehicle upkeep it is actual vehicle kilometres including once-attributed empty/failure travel, for variable road upkeep it is evidenced class-specific engineering damage in the same year, and for building fabric it is reserved floor-area-calendar-hours. Other shared support equipment uses its fixed actual all-beneficiary task/cycle/union-hour driver; retain exact configuration strata and no concurrency duplication. A signed maintenance work order fixes the causal asset and task pool before calculation, not a later modeller choice. Specific accident/failure repair is allocated exclusively to its evidenced causal order/task set, never also to the annual routine pool. Genuine component consumption excludes unused opening/closing stocks, uninstalled returns and internal transfers; generated removed parts retain this original event/year/share through later custody. No assumption that input and removed-part masses are identical. Apply one annual period share, not whole-life f, to real component repairs; entire replacement assets create separate capital cohorts instead. A positive unsupported pool or zero/unknown all-user denominator blocks completeness. Apply the same rules to retained provider maintenance cards where previously referenced; independent specific generation/fate balances and exact overlap exclusions remain mandatory."
      inputs:
        - cp_support_linehaul
        - cp_support_van_round
      output: "native physical unit per original reference flow"
      source_ids: []
    - id: calc_capital_restatement_driver_revision
      applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For every asset a retain versioned all-user activity and each original beneficiary cohort/stratum c, including failed/empty work under its existing fixed responsibility rule. u_c,a is its attributed actual driver to date; U_a is evidenced complete-life all-user driver (actual to date plus supported remaining forecast), in the identical configuration and unit. U_a must be positive and at least the actual all-user total. Set f_c,a=u_c,a/U_a; do not use remaining activity as U_a. On every life, activity, beneficiary, source-quantity or terminal-route revision recompute every affected original cohort, including previously reported cohorts; do not preserve an old fraction while applying a new lifetime denominator only to later cohorts."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_source_correction
      applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For each independent source s in its native unit, A_s,c,new=Q_s,new*f_c,a. Q_s,new is its current evidenced full manufacture/installation source quantity before lifetime allocation, not a remaining unallocated balance, or matched net terminal residual/complete lifecycle source; it is not a previously allocated quantity. Retain B_s,c, the previously booked attributed raw amount, and its original normalized result/version; delta_A_s,c=A_s,c,new-B_s,c. A newly evidenced terminal source has B=0, while a correction to an existing source replaces that same source ID."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_normalization
      applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Recompute q_s,c=A_s,c,new/N_c using that original cohort current verified reference denominator N_c; if N_c itself was corrected, replace the old result rather than adding delta_A/new_N to a result based on old_N. Sum source contributions only after removing documented overlap. Record positive/negative result corrections, never negative physical transfers, substitution credits or another current-period whole-asset purchase."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_retirement
      applies_to: "mail_tray; tray_waste; u_linehaul_vehicle_factory_gate; u_linehaul_retired_vehicle; u_van_round_vehicle_factory_gate; u_van_round_retired_vehicle; u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; u_premises_construction_gate; u_premises_retired_asset"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At final retirement replace U_a by complete actual all-user driver, recompute all f and all source quantities; for positive total activity all beneficiary fractions sum to one, including non-study beneficiaries. Measured terminal net residual is not reduced again by historical removals."
      inputs:
