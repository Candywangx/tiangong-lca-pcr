      record_type: "versioned_asset_cohort_ledger"
      raw_fields: "asset/source ID; source phase and native unit; original cohort/stratum and causal parent; original reference denominator and revision; all-user actual driver by original interval; fixed beneficiary shares; complete-life driver forecast/version and supporting records; manufacture/installation quantity; terminal net residual/route and version; previously booked attributed raw B and normalized result; recalculated f/A/q and signed correction; zero-use commissioning responsibility; overlap exclusions"
      collection_method: "Apply foreground_interface_coverage to responsibility first. Interface activity, supplier gate/quality and compatibility evidence remain required; provider-internal physical/capital/species fields below are collected only for foreground-owned components. External components use the matching cp_interface_ protocol and compatible background evidence, without duplicating supplier internals. Join serial/source asset registers, activity meters, supplier product gates and the original result ledger; apply calc_capital_restatement on each change. Recompute using the original physical driver and all-user evidence without changing physical stocks. Reconcile old/new/correction and original denominator by source and original cohort; retain versions and calibration with the original record owner."
      unit: "source-native units; original driver units; Item(s)"
      frequency: "each acquisition/commissioning, activity, life/source revision and retirement; reconcile each original reporting period"
      temporal_coverage: "complete asset life and all affected original cohorts"
      site_scope: "all users of the same asset configuration; original product gate and separate installation/terminal sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "serial/source registers; calibration; life evidence; receiver records; original-cohort results and revision chain"
