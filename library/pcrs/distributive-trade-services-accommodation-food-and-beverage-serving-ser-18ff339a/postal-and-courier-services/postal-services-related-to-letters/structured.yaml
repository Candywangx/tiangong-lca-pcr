    - protocol_id: cp_waste
      process_id: "postal_letter_service"
      flow_role: "label_waste; letter_waste; tray_waste; sanitary_wastewater"
      record_type: "waste transfer record"
      raw_fields: "source; stream and condition; mass/volume; date; authorized disposal record; waste stock opening/closing; receiver; transport/treatment coverage; water balance; generation_event_id; generation_time/site; source task/cohort/stratum; original allocation shares/reference denominator; generated mass and wet/dry/composition basis; opening/closing stock by origin; internal transfer IDs and both endpoints; external dispatch; evidenced physical loss/release; receiver and destination fractions; actual/prospective route and model version; evidence/uncertainty; receipt replacement status and revision chain; destruction authorization and actual discard time; segregated destruction stock record"
      collection_method: "Measure each ordinary solid-waste stream at generation. Any later dispatch weight is solely an original-event stock and receipt control and is not new generation. Measure sewer discharge or establish a site-specific water balance with known consumptive uses. Verify authorized mail destruction and receiver treatment; unresolved receiver is a gap, not recycling. For tray_waste actual transfers verify the separate control ledger; quantify the cohort lifecycle contribution using a_tray_lifecycle, not the retirement-year transfer total. Measure segregated generated mass at the generating point and record the responsible task/interval before storage; if generation is reconstructed from a complete stock balance, document all transfers, losses and measurement uncertainty and preserve original event provenance. Apply allocation_waste_origin and calc_waste_origin. At each transfer and period close reconcile origin-labelled stocks against calibration and receiver evidence. Require supported storage/transport/treatment coverage for retained mass; later receipts replace the original event model, never create a second dispatch-period burden. Recognize discarded letters at documented authorization plus actual removal from deliverable/returnable stock; include evidenced retained waste, and use dispatch receipts only to update the original event. Pending disposition is not waste generation."
