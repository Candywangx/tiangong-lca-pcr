    - id: scope_interface_sorting_asset
      applies_to: "u_sorting_asset_factory_gate; u_sorting_asset_retired_asset; svc_sorting_asset"
      requirement: "For support_sorting_asset, svc_sorting_asset is the external service input under boundary_atomic_support. Its listed physical counterparts apply only to operator-owned foreground components; they are not required supplier-internal collection. For every event/component record exactly one owner and representation. Keep physical components excluded from the contracted service, and remove only evidenced overlap; partial contracts cannot suppress the whole process. Scope changes require the coverage matrix and fresh bilingual projection."
