allocation_rules:
  - rule_id: allocation_separate
    applies_to: "shared facility"
    rule: "Subdivide direct metered loads first; physical allocation follows the general GHG Product Standard hierarchy, while the area/time equations below are this candidate PCR's declared collection method. Allocate residual building space, lighting/heating and sanitation by measured floor-area-hours of rental space over all benefiting services; administration consumables and shared staff activity by timed rental tasks over all timed tasks. Preserve full reconciliation and exclude customer/pass-through mail from material consumption."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_capacity
    applies_to: "mailbox class"
    rule: "Keep one compartment size, construction and access schedule per dataset. All standing burden assigned to that class, including vacant or unlet capacity, rented-but-unused availability, fault repair, failed activation and cancelled applications, stays in its numerator. Divide only by N of accepted contracted availability; disclose installed, rentable, rented, vacant and unavailable hours. If N=0, no normalized dataset exists. Do not shift vacant burdens to another class or ignore unsold capacity. After division by N, do not multiply by utilization or occupancy again."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "cabinet; building; lock; key; cloth"
    rule: "Use one coherent lifecycle model per asset cohort; its matched background product includes manufacture, delivery and final treatment without duplicate terminal exchanges. For each original reporting-year/class c, first obtain that asset same-interval shared/class responsibility w_c,a from the existing calc_shared and allocation_capacity rules, including their specified vacancy/fault responsibility. Set u_c,a=t_c,a*w_c,a and f_c,a=u_c,a/L_a using the same asset complete all-user calendar life L_a. Class responsibility enters u once; do not multiply the resulting equivalents by w again. Every life/source revision and actual retirement applies calc_capital_restatement to all original years/classes and original N, without concentrating a catch-up balance in the retirement period. A zero-output original year retains unnormalized totals, never transferred to unrelated rentals. No universal life, financial depreciation or mail-volume allocation; missing all-user/class history or complete lifecycle coverage blocks completeness."
    source_ids: []
  - rule_id: allocation_capital_restatement
    applies_to: "cabinet; lock; key; cloth; building"
    rule: "This PCR uses full restatement, not frozen historical shares or a retirement-period catch-up. All direct and supporting capital, reusable containers, installation outside the product gate and paired terminal sources follow calc_capital_restatement. Each specific activity rule fixes the driver and beneficiary shares; these are applied once. A complete asset background already including delivery/end-of-life follows the same restatement, without separate duplicate terminal exchanges. Routine component maintenance remains under its causal/period method."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste outputs"
    rule: "Use a recycled-content cut-off with no avoided virgin-material credit. Operational ledger paper, pencil residues and wastewater cross the foreground waste gate and link to transport/treatment once. Physical retirements of cabinet, building, lock, key and cotton cloth are cohort/receiver control-ledger events only, since their manufacture and end-of-life are already attributed together through allocation_assets. Do not also add retired steel/brass/cloth or demolition waste as exchanges. Lifecycle backgrounds must explicitly include all relevant disposal, recycling transport and treatment without duplicate credit. If they cannot, completion is blocked until a reviewed cohort-consistent explicit lifecycle model is supplied."
    source_ids: []
  - rule_id: allocation_waste_origin
    applies_to: "waste_paper; waste_pencil"
    rule: "Fix each ordinary solid-waste generation event to its original service cohort and stratum at generation, never at later dispatch. Directly trace the generating task first; shared generation uses the existing site/handling allocation driver over the recorded generation interval, including all customer and noncohort workloads. Preserve event ID, generation date, original shares and original reference denominator through storage and internal transfers. Acquired old waste is not new generation. Retained waste keeps its original treatment responsibility; dispatch-period service does not inherit it. For shared generation, split records at each fixed local-calendar-month boundary (68013 uses its already declared counter accounting period instead); apply the existing site task/handling driver within that exact generation interval, not the full later dispatch/cohort window. Direct event attribution takes precedence. Record site timezone before period assignment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_rental
      process_id: "p_mailbox"
      flow_role: "rental_service"
      record_type: "contract_interval"
      raw_fields: "box_id; size; dimensions; schedule; timezone; activation; close; fault start/end; availability evidence; refunds and reason; recipient access acceptance"
      collection_method: "Reconcile signed rental acceptance and key handover with timestamped maintenance/access records; record secure-retention and retrieval-schedule failures separately; aggregation obligations: Nonoverlapping overlap seconds per calc_hours and calc_period; count no mail-piece outputs"
      unit: "s; h"
      frequency: "each event; daily state rollup"
      temporal_coverage: "complete reporting year plus opening/closing intervals"
      site_scope: "every compartment in one declared size/access class"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed activation/close; access calendar; fault/repair logs; privacy-safe interval audit"
    - protocol_id: cp_capital_restatement
      process_id: "p_mailbox"
      flow_role: "cabinet; lock; key; cloth; building"
      record_type: "versioned_asset_cohort_ledger"
      raw_fields: "asset/source ID; source phase and native unit; original cohort/stratum and causal parent; original reference denominator and revision; all-user actual driver by original interval; fixed beneficiary shares; complete-life driver forecast/version and supporting records; manufacture/installation quantity; terminal net residual/route and version; previously booked attributed raw B and normalized result; recalculated f/A/q and signed correction; zero-use commissioning responsibility; overlap exclusions"
      collection_method: "Join serial/source asset registers, activity meters, supplier product gates and the original result ledger; apply calc_capital_restatement on each change. Recompute using the original physical driver and all-user evidence without changing physical stocks. Reconcile old/new/correction and original denominator by source and original cohort; retain versions and calibration with the original record owner."
      unit: "source-native units; original driver units; Item(s)"
      frequency: "each acquisition/commissioning, activity, life/source revision and retirement; reconcile each original reporting period"
      temporal_coverage: "complete asset life and all affected original cohorts"
      site_scope: "all users of the same asset configuration; original product gate and separate installation/terminal sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "serial/source registers; calibration; life evidence; receiver records; original-cohort results and revision chain"
    - protocol_id: cp_utilities
      process_id: "p_mailbox"
      flow_role: "electricity; water; water_vapour"
      record_type: "meter_record"
      raw_fields: "meter_id; start/end; kWh; m3; density kg/m3; direct/residual pool; meter scope; allocation area-hours; evaporated water mass; isolated-operation water inputs and liquid-water outputs; retained water; stock change; wet/dry fractions; contamination/external water inputs"
      collection_method: "Read identified electrical/water meters at site boundary; subtract independently metered other functions; use supplier water density or dated density measurement; aggregation obligations: Convert once; allocate per calc_shared; retain leaks/faults and vacancy burdens Measure evaporation by gravimetric isolated-operation balances or independently instrumented vapour loss; partition water from solids in liquid outputs, and identify external water inputs. Never infer evaporation by subtracting unpartitioned gross sewer mass from potable water. Unmeasured contributions remain a blocking uncertainty rather than zero."
      unit: "kWh; m3; kg/m3; kg water"
      frequency: "monthly meter close and each scope change; each isolated-operation evaporation test, repeated on route/condition change"
      temporal_coverage: "same full reporting year; time-align reads or document interval allocation"
      site_scope: "rental area and every beneficiary of shared pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration/verification certificates; invoices; floor plans; pool balance"
    - protocol_id: cp_assets
      process_id: "p_mailbox"
      flow_role: "cabinet; building; lock; key; cloth"
      record_type: "asset_register"
      raw_fields: "cohort/serial; asset object/model; counts; compartment dimensions; floor area; cloth dry mass and dry fraction method; commissioning/retirement; t; L; previous allocated fraction; remaining life; supplier manufacture/delivery/renewal/end-of-life scope; receiver route; class footprint"
      collection_method: "Inspect all cabinet, building, replacement lock/key and cloth cohort registers; verify life, remaining service fraction and matched complete lifecycle background, including disposal/recycling and building demolition. Weigh dry cloth using recorded drying/moisture method. Actual retirement weights remain control records; do not repeat background end-of-life. Apply allocation_assets/calc_capital and class/shared attribution once."
      unit: "Item(s); m2; kg dry; h; fraction"
      frequency: "opening/closing year; every installation/removal; annual life review"
      temporal_coverage: "all asset service histories and reporting-year overlap"
      site_scope: "all attributed asset cohorts, including vacant capacity"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset receipts; surveyed geometry; engineer life/remaining-fraction evidence; dry-mass protocol; complete lifecycle scope and receiver records"
    - protocol_id: cp_materials
      process_id: "p_mailbox"
      flow_role: "paper; pencil"
      record_type: "stock_issue"
      raw_fields: "paper dry mass; pencil model and usable fraction; opening/closing usable stock; external receipts; external unused returns; internal store returns; transfers in/out; recipient service"
      collection_method: "Weigh dry ledger paper and count complete declared pencils with usable-length fractions. Record external returns separately from internal returns already included in closing stock. Apply calc_stock then task-time class attribution; mail and customer supplies remain custodial property."
      unit: "Item(s); kg; fraction"
      frequency: "each issue/return; monthly stock close"
      temporal_coverage: "same reporting year and opening/closing usable stocks"
      site_scope: "onsite rental administration only"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock counts; calibrated balances; dry-mass/usable-length method; external/internal transfer evidence; signed recipient attribution"
    - protocol_id: cp_wastes
      process_id: "p_mailbox"
      flow_role: "waste outputs"
      record_type: "gate_transfer"
      raw_fields: "operational paper/pencil/wastewater material; receiver; route; gate wet/dry mass; measured moisture/drying method; sewer meter; retained water; separate asset-retirement/demolition control manifest; generation_event_id; generation_time/site; source task/cohort/stratum; original allocation shares/reference denominator; generated mass and wet/dry/composition basis; opening/closing stock by origin; internal transfer IDs and both endpoints; external dispatch; evidenced physical loss/release; receiver and destination fractions; actual/prospective route and model version; evidence/uncertainty; receipt replacement status and revision chain; gross wet wastewater mass or metered volume and same-stream density/temperature; water mass fraction; direct and shared pools; rental-class share; wastewater volume m3; same-stream same-state density kg/m3; density reference and measured temperature degrees C; temperature conversion and original-reading units"
      collection_method: "Measure segregated generated mass at the generating point and record the responsible task/interval before storage; if generation is reconstructed from a complete stock balance, document all transfers, losses and measurement uncertainty and preserve original event provenance. Apply allocation_waste_origin and calc_waste_origin. At each transfer and period close reconcile origin-labelled stocks against calibration and receiver evidence. Require supported storage/transport/treatment coverage for retained mass; later receipts replace the original event model, never create a second dispatch-period burden. Ordinary paper/pencil wastes use this origin method on a consistent measured wet/dry basis. Measure moisture or dry to the evidenced test-method constant-mass criterion. Sewer wastewater keeps its measured water balance and is not subject to the solid-waste kg formula; asset/demolition retirements remain lifecycle control records only. Apply calc_waste to distinguish transferred gross wet kg from water-component kg in the water balance; do not substitute potable-water density for wastewater density. Retain field-specific kg, m3, kg/m3 and degrees C. Preserve any other original temperature scale and its evidenced conversion, and match density to that temperature and material state. The final wastewater exchange remains gross wet kg, with its water component reconciled separately using the measured mass fraction."
      unit: "kg; fraction; m3; kg/m3; °C"
      frequency: "each transfer; monthly sewer balance; every ordinary-waste generation and monthly origin-stock reconciliation"
      temporal_coverage: "same reporting year; carry stored waste explicitly; retain original generation ownership through eventual treatment evidence"
      site_scope: "rental-attributed gate and identified receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scales/meters; transfer/receiver manifests; moisture basis; documented water balance"
    - protocol_id: cp_route
      process_id: "p_mailbox"
      flow_role: "all cards"
      record_type: "site_route_audit"
      raw_fields: "site and class; material/energy list; process evidence; outsourced scope; emission/refrigerant survey; idle states; absence evidence"
      collection_method: "Walk through rentals, mechanical key access, administration and cleaning with responsible site staff; compare procurement and service contracts against every listed card; Apply boundary_deviation and record evidence distinguishing inapplicable route changes from missing in-scope exchanges."
      unit: "documented occurrence/absence; h"
      frequency: "start of period; each change; annual reconciliation"
      temporal_coverage: "whole reporting year"
      site_scope: "rental plus shared beneficiaries and upstream/downstream interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed walkthrough; photos/asset specs; procurement reconciliation; supplier inclusions; reviewed gap register"
  calculation_rules:
    - id: calc_hours
      applies_to: "rental_service"
      rule: "b=3600 accepted compartment-seconds/Item(s); N=sum(accepted_box_seconds)/b; H=sum(accepted_box_seconds)/3600 in h. Split intervals at report boundaries and class changes. A box-second counts only when the exclusive secure retention and contract-promised access schedule are fulfilled. Accepted activated rental time counts even when unused; faulty/unavailable, pre-activation, refunded unprovided and post-close time do not. An out-of-access-calendar hour counts only if the contract still provides exclusive secure retention then; a closure during promised access or a security failure removes its measured interval, even if no customer attempted pickup. A commercial refund for an already delivered interval does not erase the physical service; record its cause."
      inputs:
        - accepted_box_seconds
        - "start/end timestamps"
        - "fault intervals"
        - "contract access calendar"
      output: "N in Item(s); H in h"
      source_ids: []
    - id: calc_inputs
      applies_to: "all inputs except rental_service"
      rule: "x_j=Q_j/N after cp_materials, cp_utilities or cp_assets yields the class-attributed total. Apply kWh*3.6 for MJ once; do not divide a supplier per-unit inventory twice. Compute Q_water=V_water*rho_water using compatible m3 and kg/m3 from measured/supplier records."
      inputs:
        - Q_j
        - N
        - "meter units"
        - rho_water
      output: "input amount per reference flow"
      source_ids: []
    - id: calc_stock
      applies_to: "paper; pencil"
      rule: "Q_j=opening usable stock + external receipts + transfers in - closing usable stock - unused returns outside the accounting scope - transfers out. Internal returns to the same store are already in closing stock and are not subtracted again; exclude transfers from external receipts. Account pencil consumption by usable fraction. Lock/key/cloth issues are asset-event records, not this material consumption formula. Investigate discarded fractions, moisture and adjustments separately."
      inputs:
        - "opening/closing stock"
        - receipts
        - returns
        - transfers
        - "usable fractions"
      output: "Q_j in each card unit"
      source_ids: []
    - id: calc_capital
      applies_to: "cabinet; building; lock; key; cloth"
      rule: "Apply allocation_assets to obtain f_c,a already containing the shared/class responsibility once. C_equiv_c=sum(n_cabinet_a*f_c,a), A_equiv_c=sum(A_a*f_c,a), L_equiv_c=sum(n_lock_a*f_c,a), K_equiv_c=sum(n_key_a*f_c,a), T_equiv_c=sum(m_drycloth_a*f_c,a). Existing C_equiv/A_equiv/L_equiv/K_equiv/T_equiv card numerators are these values for the original class c; divide each by its original N_c once, without another calc_shared allocation. Life, source and retirement changes replace original-year/class results under calc_capital_restatement. Cabinet background includes initial locks/keys; separate lock/key cards include replacements only and exclude keys supplied with replacement cylinders. Each background includes its own end-of-life; do not add duplicate foreground asset-waste flows."
      inputs:
        - cp_assets
        - cp_capital_restatement
        - calc_shared
        - allocation_capacity
      output: "C_equiv/L_equiv/K_equiv in Item(s); A_equiv in m2; T_equiv in kg"
      source_ids: []
    - id: calc_capital_restatement
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Within this entry's declared applies_to scope, apply the complete ordered rule group: calc_capital_restatement_driver_revision; calc_capital_restatement_source_correction; calc_capital_restatement_normalization; calc_capital_restatement_retirement; calc_capital_restatement_zero_activity; calc_capital_restatement_shared_driver_controls; calc_capital_restatement_background_version. Use this entry's inputs, reference denominator and output; all definitions, conditions, exclusions and completion requirements across that group apply jointly. These components form one method, not additional exchanges or repeated allocation. Reading only a component is insufficient for completion. Follow the existing ownership and deduplication rules when one event appears in more than one entry."
      inputs:
        - cp_capital_restatement
        - calc_capital_restatement_driver_revision
        - calc_capital_restatement_source_correction
        - calc_capital_restatement_normalization
        - calc_capital_restatement_retirement
        - calc_capital_restatement_zero_activity
        - calc_capital_restatement_shared_driver_controls
        - calc_capital_restatement_background_version
      output: "source-native unit per original cohort N_c; separate physical controls"
      source_ids: []
    - id: calc_shared
      applies_to: "electricity; water; building; administration"
      rule: "For each shared pool, Q_class=Q_direct + Q_residual*s, where s=rental area-hours/all benefiting area-hours for standing facility burdens, or rental timed task duration/all timed task duration for administration. For shared cabinet banks use measured occupied footprint by size class over total class footprints, including vacant compartments. Shares sum to 1 across all beneficiaries; no economic allocation is permitted in this route. Capital equivalents use this rule original class shares once inside allocation_assets/calc_capital; resulting C_equiv/A_equiv/L_equiv/K_equiv/T_equiv must not enter this allocation again."
      inputs:
        - "meter pools"
        - "direct loads"
        - area-hours
        - "task times"
        - "class footprint"
      output: "class-attributed Q_j"
      source_ids: []
    - id: calc_waste
      applies_to: "waste outputs"
      rule: "Use paper and pencil results from calc_waste_origin already divided by original N; do not divide or use later dispatch mass again. For each sewer-gate stream, W_ww_j is measured gross wet kg or measured m3 times evidenced same-state wastewater density. Under calc_shared set W_ww_class to direct attributed gross wet kg plus shared gross wet kg times the applicable rental-class shares; q_ww=W_ww_class/N once. In the isolated-operation water balance use W_ww_j times the measured/evidenced water mass fraction, never gross wet wastewater or its solutes as another water-component mass. Inflow is not discharge; unknown density, fraction or fate remains unresolved. Asset retirements remain control records only."
      inputs:
        - cp_wastes
        - calc_shared
        - calc_water_emission
        - calc_waste_origin
      output: "gross wet wastewater kg/N; separate water-component kg ledger"
      source_ids: []
    - id: calc_waste_origin
      applies_to: "waste_paper; waste_pencil"
      rule: "For each named ordinary solid-waste stream r and generation event j, A_c,r = sum_j(G_j,r*s_c,j), then q_c,r=A_c,r/original_reference_count once. G is measured generated mass, not dispatch mass. Reconcile each material and original event: closing = opening + generation + internal_in - internal_out - external_dispatch - evidenced_physical_loss. Record actual moisture/composition changes and mutually exclusive losses/releases; no invented residual and no full residual mass plus the same released constituent. Internal transfers preserve origin and do not create another exchange. Model the original cohort waste output and its required storage/transport/final treatment even while physically retained, using actual compatible receiver evidence or an explicitly evidenced material/composition/location-matched prospective route with uncertainty. Destination fractions close to one and enter once; no default recycling or zero treatment for retained mass. Unsupported fate stays incomplete. Keep observed custody stock/dispatch as a control ledger, not another inventory addition. Later receiver evidence replaces the same event prospective model and recomputes the original cohort with its original denominator; never add that mass/treatment to a later cohort. Include every necessary lifecycle leg once through a scope crosswalk; exclude site/storage energy and handling already included by site/service inventories. Capital terminal-waste lifetime fractions and wastewater balances retain their separate rules. original_reference_count=N for its original cohort/stratum. The generated-waste exchange is at the generation gate. Its linked complete waste-management inventory takes one kg on that same generated-mass basis through storage and all subsequent fates; final-treatment input is only the compatible measured/evidenced forecast residual after storage losses/moisture conversion, not the full original kg plus separate losses. Explicit storage releases replace the same included release in that linked inventory; a storage/handling operation already in site/service pools is removed from the waste link by a recorded scope crosswalk, never counted twice."
      inputs:
        - cp_wastes
        - allocation_waste_origin
      output: "kg per original reference flow; origin stock/model ledger"
      source_ids: []
    - id: calc_period
      applies_to: "all inventory"
      rule: "Use one complete consecutive reporting year with daily interval records and monthly close; include opening/closing rental, stock and asset states. Carry contracts across boundaries by overlap seconds only; relets and substitutions cannot overlap for one compartment. Reconcile cancellations, refunds, wait lists, lost keys, refused applications, faults and repairs without creating accepted hours."
      inputs:
        - "year boundaries"
        - "interval ledger"
        - "monthly reconciliations"
      output: "nonoverlapping complete period totals"
      source_ids: []
    - id: calc_water_emission
      applies_to: "water_vapour"
      rule: "E_water=sum(operation water inputs + verified external water inputs - liquid water outputs - carried water - water stock increase), or directly measured vapour loss, for a documented isolated operation. All terms are kg of water on the same operation/time basis; quantify liquid water fractions rather than subtracting gross wastewater mass. Cover every identified evaporative operation and attribute shared activity once. Negative balance or an unknown term is an unresolved measurement gap, never clamped or filled with zero."
      inputs:
        - "isolated-operation water masses"
        - "measured water fractions"
        - "stock and retained water"
        - "direct vapour measurement"
      output: "E_water in kg; E_water/N per reference flow"
      source_ids: []
    - id: calc_capital_restatement_driver_revision
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For every asset a retain versioned all-user activity and each original beneficiary cohort/stratum c, including failed/empty work under its existing fixed responsibility rule. u_c,a is its attributed actual driver to date; U_a is evidenced complete-life all-user driver (actual to date plus supported remaining forecast), in the identical configuration and unit. U_a must be positive and at least the actual all-user total. Set f_c,a=u_c,a/U_a; do not use remaining activity as U_a. On every life, activity, beneficiary, source-quantity or terminal-route revision recompute every affected original cohort, including previously reported cohorts; do not preserve an old fraction while applying a new lifetime denominator only to later cohorts."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_source_correction
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For each independent source s in its native unit, A_s,c,new=Q_s,new*f_c,a. Q_s,new is its current evidenced full manufacture/installation source quantity before lifetime allocation, not a remaining unallocated balance, or matched net terminal residual/complete lifecycle source; it is not a previously allocated quantity. Retain B_s,c, the previously booked attributed raw amount, and its original normalized result/version; delta_A_s,c=A_s,c,new-B_s,c. A newly evidenced terminal source has B=0, while a correction to an existing source replaces that same source ID."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_normalization
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Recompute q_s,c=A_s,c,new/N_c using that original cohort current verified reference denominator N_c; if N_c itself was corrected, replace the old result rather than adding delta_A/new_N to a result based on old_N. Sum source contributions only after removing documented overlap. Record positive/negative result corrections, never negative physical transfers, substitution credits or another current-period whole-asset purchase."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_retirement
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At final retirement replace U_a by complete actual all-user driver, recompute all f and all source quantities; for positive total activity all beneficiary fractions sum to one, including non-study beneficiaries. Measured terminal net residual is not reduced again by historical removals."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_zero_activity
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Zero-output events retain their existing causal parent cohort and its original denominator; never seek an unrelated positive-output period. If that parent has no positive N_c, retain attributed raw totals and an unresolved normalized result. With zero lifetime activity, assign only to an evidenced sole commissioning responsibility under the same original-cohort rule; otherwise retain the unallocated source and block completeness."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_shared_driver_controls
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Keep asset manufacture, installation and terminal burden on the same revised f, while gross stock, transfers and retirements remain separate physical control records. For a calendar-time asset, u is its elapsed service-capacity time assigned once to each original class/period by the existing shared/class rule, including the prescribed vacancy/failure responsibility; U covers that same all-user calendar capacity. Do not apply the class share a second time to q. Unknown history, unsupported life/endpoint or missing original denominators blocks completeness."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: calc_capital_restatement_background_version
      applies_to: "cabinet; lock; key; cloth; building"
      rule: "Component of calc_capital_restatement. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. If a supply-background or treatment-model version changes without a physical quantity change, replace the corresponding linked inventory and result for all affected original cohorts; a zero physical delta_A does not preserve the old model."
      inputs:
        - cp_capital_restatement
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory"
      requirement: "Keep unresolved UUIDs and support records explicitly pending; a direct official row must match object, condition, property, unit and receiver/compartment before binding."
      evidence: "official direct response and hash-bound receipt"
    - id: quality_measurement
      applies_to: "all protocols"
      requirement: "Retain instrument identity, calibration range/date, unit conversions, original interval records and attribution; estimates require documented method, uncertainty and owner, never invented defaults."
      evidence: "meter/scale certificates; records; estimate justification"
    - id: quality_completeness
      applies_to: "all inventory"
      requirement: "Reconcile N, total installed hours, failures, vacant capacity, stock and waste balances monthly; a documented absence may be not_applicable, unknown occurrence is incomplete.  Apply boundary_deviation to route departures and keep missing in-scope rows incomplete."
      evidence: "cp_rental; cp_materials; cp_wastes; cp_route"
    - id: quality_waste_origin
      applies_to: "waste_paper; waste_pencil"
      requirement: "For every ordinary solid-waste stream verify generation responsibility, original cohort/stratum/denominator, origin-labelled stock balance, supported actual or prospective complete treatment and later-receipt replacement. Unknown origin/fate/physical loss remains an explicit gap; future dispatch alone cannot close or reassign it. Keep wastewater and amortized terminal-asset treatment on their separate methods."
      evidence: "generation/stock/transfer ledgers; supported route models; original-cohort receipt replacements"
    - id: quality_semantics
      applies_to: "all normative rules"
      requirement: "All boundary, allocation, collection and calculation obligations must be machine-projected and bilingual aligned; check conditions and negatives, not just IDs and hashes."
      evidence: "bilingual semantic comparison; generated guidance readback"
    - id: inv_asset_provision
      applies_to: "lock; key; cloth"
      requirement: "The amount is lifecycle-equivalent consumed provision under allocation_assets, including matched end-of-life, rather than purchased or retired count/mass in this year."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: validate_identity
    applies_to: "all cards"
    rule: "Every used UUID requires direct official name/type/property/unit evidence; unresolved names are candidates, not verified identities. Bind the reference standard service flow identity and all unresolved input/waste identities and their support before release; no lifecycle or methodology approval is implied by structural checks."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "all datasets"
    rule: "Reject an undeclared size/access schedule, unsupported route, unresolved material identity, unknown denominator, unbalanced allocation or double-counted upstream service. A broader class label is not evidence that this narrower service applies to all CPC 68019."
    source_ids:
      - un-cpc3-68019
  - rule_id: validate_completeness
    applies_to: "all quantities"
    rule: "N must be positive and finite. Keep accepted, excluded downtime, vacant and other state hours mutually exclusive with a complete installed-hours reconciliation. Missing quantities, unknown identities, uncalibrated meters and unsupported lifetime estimates remain explicit gaps; never use zero or illustrative rates as defaults. Test A-period generated retained waste and B-period dispatch: original A responsibility and denominator persist, and actual evidence replaces that same event model without another B burden."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "bilingual methodology"
    rule: "Check identical ordered row/rule/protocol/source IDs, directions, types, UUIDs, units, formulas, conditions, prohibitions and obligations in English and Chinese. Project all normative tables and card scopes into generated structured guidance; a fingerprint alone does not demonstrate semantic completeness."
    source_ids: []
  - rule_id: validate_capital_restatement
    applies_to: "cabinet; lock; key; cloth; building"
    rule: "Check original cohorts/denominators, all-user driver, source versions, booked amounts and restatement corrections under calc_capital_restatement. Reject frozen old history with only future-denominator changes, retirement-balance transfer to unrelated current output, and negative physical exchanges."
    source_ids: []
