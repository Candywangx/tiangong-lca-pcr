system_boundary:
  rules:
    - rule_id: boundary_service
      applies_to: "all processes"
      rule: "Include exclusive compartment availability from verified rental activation to interval expiry, cancellation or return; use actual provision dates, not payment dates. Ordinary upstream mail movement ends at the mailbox deposit interface and is excluded here; custodial security and the customer access interface remain included."
      source_ids:
        - usps-pobox
    - rule_id: boundary_route
      applies_to: "all processes"
      rule: "This route is mechanical-key steel mailbox rental, onsite paper administration, electric lighting/heating, no mechanical cooling, and water-only cleaning with cotton cloths. It is a real physical service variant, not a proxy for poste restante, automated parcel lockers, counter handling, transport, postal giro/savings or telecom services."
      source_ids:
        - un-cpc3-68019
    - rule_id: boundary_deviation
      applies_to: "route qualification"
      rule: "At period start and each change, inspect actual materials, equipment, energy, emissions, cleaning and auxiliary contracts. Combustion, purchased heat, mechanical cooling or its refrigerant leakage, detergent cleaning, powered lockers and digital/telecom administration depart from this configuration. Stop applying this PCR and review applicability of the actual product and route separately. Acceptance of any changed boundary requires review of canonical methodology, the ADR and classification mapping. For an omitted exchange within the existing boundary, add a reviewed bilingual atomic card, protocol and projection. Evidence absence onsite; unknown is not zero."
      source_ids: []
    - rule_id: boundary_upstream
      applies_to: "all inventory"
      rule: "Link manufacturing and delivery of consumed supplies/assets, electricity and water supply, and waste transport/treatment exactly once to boundary-matched datasets. Verify provider, technology, geography, voltage and losses rather than inferring them from the generic electricity UUID. Customer travel, letter contents and delivery-network transport belong to separately declared functions; excluded flows must remain disclosed."
