validation_rules:
  - rule_id: physical_roomnight
    applies_to: "reference"
    rule: "Require actual unique occupied indivisible room-night with privatebath/dailyhousekeeping/non-timeshare route,cycle/timezone/DST and actual guests;complimentary occupied included,unused no-show/cancellation excluded from N only,not from responsibility. Guestdeclined cleaning does not delete actual lodging. Reconcile roommoves and revision/payment reversal independently;no fixed24h,order/guestnight conversion or capacity denominator."
    source_ids:
      - unsd-63111
      - eurostat-rooms
  - rule_id: pool_closure
    applies_to: "all actual resources"
    rule: "Complete source-linked pool/consumer/output attribution including necessary standby/vacant/maintenance/failed/no-show duties;positive compatible complete drivers and same-scope N once. N0/crossperiod quantities need responsibility and receiving-period settlement closure;unassigned/carry not closed is incomplete. No occupied-only numerator against all-calendar asset denominator that deletes idle burdens."
    source_ids: []
  - rule_id: laundry_life
    applies_to: "linen/provider/assets"
    rule: "Verify actual external/central completed laundry basis/batch/dry-wet matching and rewash;unique shared transfers,stock/fates and actual full lifecycle textile/building/fitout/equipment driver closure. Completeprovider/rental/asset scopes replace matching direct duty only;actual missing stages need completed owner/nativequantity/time/coverage links before full-chain use."
    source_ids:
      - pef-hotel-intro-2026
      - hcmi-guide-2022
  - rule_id: exclusive_fates
    applies_to: "all actual streams"
    rule: "Gross S with matchedunused return OR consumed S-return with pairedoutput omitted;no double deduction. Refrigerant opening/newfactoryentry exclusive,initialcharge upstreamowner once,used recovery not unrelated supply credit. Actual useful versus Waste and contained versus directmedium distinct;real mixedstream retainedcontents nonadditive and actual unrelated streams expanded separately by receiver. Unknown is neither species emission nor zero."
    source_ids: []
  - rule_id: native_readiness
    applies_to: "all actual data"
    rule: "Actual quantities,complete native operands,applicable acceptance evidence and verified concrete UUID/property/unit support are mandatory for actual binding. Missing generic numeric Range alone is not disqualifying;disclose the gap. Source-backed specifications/intervals need traceable compatible basis;empirical QA guardrails need independent comparable reference evidence. Complete missing physical/lifecycle duties before final full-chain claim;checker pass alone proves neither external identity nor actual readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Actual foreground hotel lodging lifecycle data package;authored methodology candidate,not a measured hotel dataset"
