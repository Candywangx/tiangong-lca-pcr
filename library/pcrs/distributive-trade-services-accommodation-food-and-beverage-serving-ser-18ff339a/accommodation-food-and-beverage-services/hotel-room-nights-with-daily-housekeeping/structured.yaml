      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual ready private guestroom/privatebath and dailyhousekeeping/response regime,non-timeshare/nonselfcatering;actual external or central linen-care interface |\n| starting_condition_role | Actually operated accommodation facility and full-life service assets;no merchandise stock-loss template |\n| product_classification_scope | 63111 dailyhousekeeping actualregime;exclude63112lessfrequent/63113timeshare and unverifiedscope |\n| recursive_input_rule | A completed external/central laundry,utility,cleaning or facility service may replace ONLY matching complete owned duties;do not recursively purchase the same finished room-night as its own input |\n| upstream_dataset_requirement | Full actual energy/water/material supply,building/siteworks/fitout/FF&E/linen manufacture-transport-maintenance-replacement-EOL and provider scopes. Rentallinen manufacture/lifetime belongs once to rentalprovider OR explicit hotel asset supplement. No operational-carbon-only omission of purchases,waste treatment or assets. Stage gaps remain disclosed and must be completed before full-chain claim. |\n| disclosure | All roomnight/guest/cycle/cleaning regime and events;complete propertyoutput/consumer native drivers;actual supply/linen provider-equipment boundaries/fullassetlife/fates/species/quantity and identity gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| lodging_boundary | hotel | Actual room availability/readiness,occupied lodging,response,turnover/stayover cleaning,roomrelated linens/utilities/amenities and necessary common/backofhouse share inside. Separatelyprovided food,meeting,parking,leisure and unrelated personallaundry are actual competing outputs with their own handoffs;do not drop shared duty or roomincluded amenities. | pef-hotel-intro-2026 |\n| classification | scope | Actual dailyhousekeeping service regime and non-timeshare evidence mandatory;record each performed/requested/declined event without inventing service counts or linen replacement. Frontdesk presence,selfcheckin,star/brand or digitalcontact alone is insufficient. No universal24hresponse promise. | unsd-63111; unsd-63112; unsd-63113; hilton-housekeeping |\n| complete_lifecycle | hotel | This PCR is full lodging lifecycle methodology,not HCMI operationalGHG accounting. Complete building/fitout/equipment/textiles/supplies and actual receiver treatment once with all consumer/provider interfaces;missing actual asset/provider stages are evidence gaps,not zeros. | pef-hotel-intro-2026; hcmi-context-2020 |\n| care_route | linen | Actual external or central laundry service with completed nativequantity and complete wash-dry-finish/transport/water-chemical-energy/effluent/asset/lifetime/rentaltextile scope. Hotel direct rows contain only uncovered duties;inhouseindustrialwashing requires reviewed node,not hidden in generic roomcleaning. | hcmi-guide-2022 |\n\n\n"
