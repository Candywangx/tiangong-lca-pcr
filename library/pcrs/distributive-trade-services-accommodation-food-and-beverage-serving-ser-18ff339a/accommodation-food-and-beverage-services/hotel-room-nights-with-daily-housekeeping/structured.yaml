          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| roomnight_pool | all lodging duties | N is the sum of unique actually occupied property+indivisible_room+accommodation_night records after room-move/revision reconciliation;include physically occupied complimentary rooms,exclude unused cancellations/no-shows,available capacity and unresolved nonprovided nights. Reversal of payment alone does not erase lodging physically supplied. Record actual local cycle,start/end/timezones/DST/duration,not fixed 24 h. Two persons in one room-night remain one room-night;guest-nights are separately linked actual persons. No defaultguests/bedcapacity or ordercount conversion. Day-use/other roomtypes and partial or moved nights require an exclusive evidenced unit/cycle partition,not two references for one service. Retain canceled,no-show,vacant/out-of-order,readiness/idle/failed-cleaning resources in actual period and complete consumer attribution. N=0 retains responsibility without division. Define complete lodging supply pools by actual property,roomtype/servicepackage and responsibility period before selecting occupied records. Total pool resources include necessary vacant/readiness/idle,failed/canceled/no-show and attributable out-of-order/maintenance duties,not only occupied-event meters. Directtrace first OR compatible target-pool physical driver/positive COMPLETE allconsumer driver to assign actual competing roomtypes and separate services;record every intended output native quantity/unit/basis/method/state/time/source,handoff and exclusive membership. Only evidenced other-output/user duties leave this pool. Divide its complete attributed RAW quantity by same-pool positive actual N once;single-night alreadyperreference amount not divided again. N0 resources require identified responsibility/carry source+receiving period+settlement/closure evidence;unassigned or unclosed burdens remain incomplete,not silently zero. Guestdeclining housekeeping does not remove an actually supplied room-night. | unsd-63111; eurostat-rooms; hcmi-context-2020 |\n| physical_allocation | shared outputs | Define complete lodging supply pools by actual property,roomtype/servicepackage and responsibility period before selecting occupied records. Total pool resources include necessary vacant/readiness/idle,failed/canceled/no-show and attributable out-of-order/maintenance duties,not only occupied-event meters. Directtrace first OR compatible target-pool physical driver/positive COMPLETE allconsumer driver to assign actual competing roomtypes and separate services;record every intended output native quantity/unit/basis/method/state/time/source,handoff and exclusive membership. Only evidenced other-output/user duties leave this pool. Divide its complete attributed RAW quantity by same-pool positive actual N once;single-night alreadyperreference amount not divided again. N0 resources require identified responsibility/carry source+receiving period+settlement/closure evidence;unassigned or unclosed burdens remain incomplete,not silently zero. Guestdeclining housekeeping does not remove an actually supplied room-night. |  |\n| full_lifetime | buildings equipment textiles | For each actual building,fitout,equipment or textile,full lifecycle equivalent = target responsibility-pool driver / positive COMPLETE alluser allperiod lifetime driver,with each independent native unit,basis,method,state,time/source and conversion. Full denominator is observedhistory plus evidenced compatible remaining use OR actual terminated total,including renovations/replacements/EOL. A capacity/calendar-time driver must allocate its idle/vacant/closed shares to real supply pools too:target-period numerator includes attributable standby capacity-time,not occupiedtime alone while the lifetime denominator includes idle. A service-cycle lifetime driver needs actual completed and evidenced future cycles and full burden closure,not availablecapacity as denominator. All period/consumer shares plus evidenced remaining responsibility exhaust the fullasset burden without repeated ownership transfer. Attribute raw period burden to target pool then divide actual same-pool N once;provider/rental/fullasset-covered manufacture-maintenance-transport-EOL replaces matching direct stage only. No fixed asset or linen lifetime. | pef-hotel-intro-2026 |\n| supply_convention | independent supplies | Independent supplies use S=opening+true external NETmaterial receipts-closing,retained recovered unused stock once;receipt container tare is excluded. Gross input S plus matching same-scope unused external Product output OR consumed input S-return OMIT that output. No numeric S+return,double credit,used recovery as newreceipt or deduction of unrelated assetcharge/linen. Waste-producing consumption retains its production burden. Reusable linen has its own physical stock/piece/cycle ledger and full-life representation;an internal dirty→wash→clean transfer is not another purchase or new textile manufacture. |  |\n| fluid_roles | operating equipment | Physical fluid ledger:opening circuit+opening stored+net external receipts+newfactory-entrycharge ONLY if not already opening = closing circuit+closingstored+unusedexternalreturn+useful recoveredexport+independent containedWaste+retainedequipment-EOL/incidentcarrier content+independently evidenced directrelease+explicitunknown. Internal charge/recovery IDs cancel,opening and newentry mutually exclusive. Factorycharge production belongs once to assetdataset or explicit assetsupplement. Only source-matched UNUSEDstandalone substock S_supply=opening_unused+netexternalreceipts-closing_unused can use consumed-only deduction of its matched unusedreturn with output OMIT. Used factorycharge recovery is not unused supply or unrelatedmakeup credit;no negativeinput. Contents retained in asset/mixedwaste are nonadditive,actual independent useful/waste transfer and treatment own gates,no automaticcredit. |  |\n| rejected_and_reworked | room and linen events | Trace unusable/notprovided rooms,failed cleaning,dirty/rejected linen,rewash/repair/replacement and actual waste/return routes by originalevent and provider IDs. Rewash consumes real resources once but is not another room-night or new textile. Declinedcleaning is an actual serviceevent state,not default avoidedmass. Unique whole/part/mixed/retained physical fates and receiver transport/treatment ownership prevent repeated burdens or automatic recoverycredit. |  |\n\n\n"
