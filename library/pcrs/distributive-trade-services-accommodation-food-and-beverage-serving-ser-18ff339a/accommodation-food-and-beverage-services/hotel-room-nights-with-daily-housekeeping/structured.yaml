  calculation_rules:
    - id: night_count
      applies_to: "occupied_room_night"
      rule: "N is the sum of unique actually occupied property+indivisible_room+accommodation_night records after room-move/revision reconciliation;include physically occupied complimentary rooms,exclude unused cancellations/no-shows,available capacity and unresolved nonprovided nights. Reversal of payment alone does not erase lodging physically supplied. Record actual local cycle,start/end/timezones/DST/duration,not fixed 24 h. Two persons in one room-night remain one room-night;guest-nights are separately linked actual persons. No defaultguests/bedcapacity or ordercount conversion. Day-use/other roomtypes and partial or moved nights require an exclusive evidenced unit/cycle partition,not two references for one service. Retain canceled,no-show,vacant/out-of-order,readiness/idle/failed-cleaning resources in actual period and complete consumer attribution. N=0 retains responsibility without division."
      inputs:
        - "cp_rooms unique room/cycle and revision evidence"
      output: "N Item(s); one actual supplied room-night"
      source_ids:
        - eurostat-rooms
    - id: pool_attribution
      applies_to: "all resources"
      rule: "Define complete lodging supply pools by actual property,roomtype/servicepackage and responsibility period before selecting occupied records. Total pool resources include necessary vacant/readiness/idle,failed/canceled/no-show and attributable out-of-order/maintenance duties,not only occupied-event meters. Directtrace first OR compatible target-pool physical driver/positive COMPLETE allconsumer driver to assign actual competing roomtypes and separate services;record every intended output native quantity/unit/basis/method/state/time/source,handoff and exclusive membership. Only evidenced other-output/user duties leave this pool. Divide its complete attributed RAW quantity by same-pool positive actual N once;single-night alreadyperreference amount not divided again. N0 resources require identified responsibility/carry source+receiving period+settlement/closure evidence;unassigned or unclosed burdens remain incomplete,not silently zero. Guestdeclining housekeeping does not remove an actually supplied room-night."
      inputs:
        - "Actual raw pool resources"
        - "compatible positive complete target/allconsumer native drivers"
        - same_scope_N
      output: "Attributed raw quantity / positive same-scope N once"
      source_ids: []
    - id: energy_quantity
      applies_to: "energy rows"
      rule: "Electricity = compatible closing-opening after register/reset/revision reconciliation OR actual same-interval average power*actual duration with sourced dimensional conversions. Thermal delivery = actual meter result OR compatible massflow*specificenthalpydifference*actualduration with reference-state evidence. Fuel mass = actual measured netmass OR actual nativevolume*density at compatible temperature/pressure;no generic factors. Apply pool attribution only once."
      inputs:
        - "cp_energy complete operand native metadata and meter/thermal/fuel scope"
      output: "Actual energy or fuel quantity, not nameplate consumption"
      source_ids: []
    - id: laundry_coverage
      applies_to: "external_linen_care"
      rule: "Use actual completed provider drytextile mass or independently evidenced native service result. A wet incoming batch cannot be called dry mass without compatible actual same-batch measurement. Provider total resource allocation uses compatible actual target/complete allclient drivers,including rewash/failed duties; hotel pool share then same-scope N once. Complete wash-dry-finish/collection-delivery/energy-water-chemicals/effluent/assetlife and any rentaltextile production/EOL replace matching direct scope;actual missing stages need completed supplements with dataset/record owner and coverage links before full-chain use."
      inputs:
        - "cp_laundry batches"
        - "dry basis"
        - "shared transfers"
        - "allclient drivers and completed coverage"
      output: "Actual provider service and exclusive uncovered supplements"
      source_ids:
        - hcmi-guide-2022
    - id: textile_stock
      applies_to: "reusable_linen_lifecycle,discarded_linen"
      rule: "Unique piece/cohort opening+actual externalnew receipts = clean/soiled/inwash/repair/retainedclosing+actual useful/waste/identifiedloss exits,after internal transfer cancellation. Water wetfraction w_wet=water/asreceived; dryratio w_dry=water/matchingnonwater; only actual same-sample definitions allow w_wet=w_dry/(1+w_dry) and dry_nonwater=asreceived*(1-w_wet),after sourced native percent conversion. Drynonwater is not automatically pure fibre;LOD may include nonwater volatiles. Lifecycle equivalents follow fullassetlife rule;actual retired outputs and retainedwater not repeated purchase."
      inputs:
        - "cp_textiles physical stock"
        - "sample definitions"
        - "native counts/masses/water and complete lifetime drivers"
      output: "Exclusive textile stock fates and life equivalents"
      source_ids: []
    - id: full_asset_life
      applies_to: "facility_asset_lifecycle,reusable_linen_lifecycle"
      rule: "For each actual building,fitout,equipment or textile,full lifecycle equivalent = target responsibility-pool driver / positive COMPLETE alluser allperiod lifetime driver,with each independent native unit,basis,method,state,time/source and conversion. Full denominator is observedhistory plus evidenced compatible remaining use OR actual terminated total,including renovations/replacements/EOL. A capacity/calendar-time driver must allocate its idle/vacant/closed shares to real supply pools too:target-period numerator includes attributable standby capacity-time,not occupiedtime alone while the lifetime denominator includes idle. A service-cycle lifetime driver needs actual completed and evidenced future cycles and full burden closure,not availablecapacity as denominator. All period/consumer shares plus evidenced remaining responsibility exhaust the fullasset burden without repeated ownership transfer. Attribute raw period burden to target pool then divide actual same-pool N once;provider/rental/fullasset-covered manufacture-maintenance-transport-EOL replaces matching direct stage only. No fixed asset or linen lifetime."
      inputs:
        - "cp_assets/cp_textiles independent target"
        - observed
        - "evidenced remaining and complete alluser lifetime driver metadata"
      output: "Full lifecycle burden attributed to actual lodging pool then /N once"
      source_ids:
        - pef-hotel-intro-2026
    - id: supply_stock
      applies_to: "guest_room_consumables,cleaning_consumables,unused_supply_out; cleaning_consumables_synthetic_detergent"
      rule: "Independent supplies use S=opening+true external NETmaterial receipts-closing,retained recovered unused stock once;receipt container tare is excluded. Gross input S plus matching same-scope unused external Product output OR consumed input S-return OMIT that output. No numeric S+return,double credit,used recovery as newreceipt or deduction of unrelated assetcharge/linen. Waste-producing consumption retains its production burden. Reusable linen has its own physical stock/piece/cycle ledger and full-life representation;an internal dirty→wash→clean transfer is not another purchase or new textile manufacture."
      inputs:
        - "cp_supplies source-matched net material stock and return metadata"
      output: "Gross with return OR consumed with return output omitted"
      source_ids: []
    - id: refrigerant_ledger
      applies_to: "operating_refrigerant and actual fluid fates"
      rule: "Physical fluid ledger:opening circuit+opening stored+net external receipts+newfactory-entrycharge ONLY if not already opening = closing circuit+closingstored+unusedexternalreturn+useful recoveredexport+independent containedWaste+retainedequipment-EOL/incidentcarrier content+independently evidenced directrelease+explicitunknown. Internal charge/recovery IDs cancel,opening and newentry mutually exclusive. Factorycharge production belongs once to assetdataset or explicit assetsupplement. Only source-matched UNUSEDstandalone substock S_supply=opening_unused+netexternalreceipts-closing_unused can use consumed-only deduction of its matched unusedreturn with output OMIT. Used factorycharge recovery is not unused supply or unrelatedmakeup credit;no negativeinput. Contents retained in asset/mixedwaste are nonadditive,actual independent useful/waste transfer and treatment own gates,no automaticcredit."
      inputs:
        - "cp_refrigerant native charge/stock/recovery/receiver/assetowner links"
      output: "Exclusive actual supply, retained stock, useful/Waste export, release and explicit unknown"
      source_ids: []
    - id: physical_freight
      applies_to: "physical_goods_freight"
      rule: "Freight = sum over UNIQUE load+leg [(direct payload OR compatible gross - noncargo tare)*actual repeatcount ONLY if EACH (TOTAL unchanged)*actual distance*THAT record target/positive complete allconsumer physical share] / positive same-pool N once. All factors independently converted and sourced;already target-attributed quantity does not receive a second share. Cargo packaging/support and actual retained water stay in payload. Provider-covered legs/empty travel excluded from direct duplicate."
      inputs:
        - "cp_freight unique loads native EACH/TOTAL"
        - "gross/tare/payload/count/distance/share"
      output: "Actual compatible mass-distance per room-night"
      source_ids: []
    - id: actual_fates
      applies_to: "all useful,Waste and Elementary rows"
      rule: "Actual species mass = independently measured native species quantity OR compatible actual activity*factor;apply component/fate fractions only when not already covered. Density-temperature/pressure conversions require each operand native metadata. Distinct actual receiver streams separately expand;real physical mixed carriers remain mixed with nonadditive content audits. Contained wastewater/fluid is Waste;actual water vapour to air is Elementary. Unknown balance is not species emission or zero. Receiving transport/treatment or provider asset-EOL scope assigned once;physical waste records already covered remain linked nonburden audit unless uncovered treatment is explicitly added."
      inputs:
        - "cp_water/cp_fates/cp_releases actual independent streams"
        - "composition/fates and full coverage"
      output: "Actual exclusive Product/Waste/Elementary quantities with disclosed gaps"
      source_ids: []
