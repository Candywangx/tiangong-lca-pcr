    rule: "N is the sum of unique actually occupied property+indivisible_room+accommodation_night records after room-move/revision reconciliation;include physically occupied complimentary rooms,exclude unused cancellations/no-shows,available capacity and unresolved nonprovided nights. Reversal of payment alone does not erase lodging physically supplied. Record actual local cycle,start/end/timezones/DST/duration,not fixed 24 h. Two persons in one room-night remain one room-night;guest-nights are separately linked actual persons. No defaultguests/bedcapacity or ordercount conversion. Day-use/other roomtypes and partial or moved nights require an exclusive evidenced unit/cycle partition,not two references for one service. Retain canceled,no-show,vacant/out-of-order,readiness/idle/failed-cleaning resources in actual period and complete consumer attribution. N=0 retains responsibility without division."
