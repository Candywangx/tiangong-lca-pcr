      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| physical_roomnight | reference | Require actual unique occupied indivisible room-night with privatebath/dailyhousekeeping/non-timeshare route,cycle/timezone/DST and actual guests;complimentary occupied included,unused no-show/cancellation excluded from N only,not from responsibility. Guestdeclined cleaning does not delete actual lodging. Reconcile roommoves and revision/payment reversal independently;no fixed24h,order/guestnight conversion or capacity denominator. | unsd-63111; eurostat-rooms |\n| pool_closure | all actual resources | Complete source-linked pool/consumer/output attribution including necessary standby/vacant/maintenance/failed/no-show duties;positive compatible complete drivers and same-scope N once. N0/crossperiod quantities need responsibility and receiving-period settlement closure;unassigned/carry not closed is incomplete. No occupied-only numerator against all-calendar asset denominator that deletes idle burdens. |  |\n| laundry_life | linen/provider/assets | Verify actual external/central completed laundry basis/batch/dry-wet matching and rewash;unique shared transfers,stock/fates and actual full lifecycle textile/building/fitout/equipment driver closure. Completeprovider/rental/asset scopes replace matching direct duty only;actual missing stages need completed owner/nativequantity/time/coverage links before full-chain use. | pef-hotel-intro-2026; hcmi-guide-2022 |\n| exclusive_fates | all actual streams | Gross S with matchedunused return OR consumed S-return with pairedoutput omitted;no double deduction. Refrigerant opening/newfactoryentry exclusive,initialcharge upstreamowner once,used recovery not unrelated supply credit. Actual useful versus Waste and contained versus directmedium distinct;real mixedstream retainedcontents nonadditive and actual unrelated streams expanded separately by receiver. Unknown is neither species emission nor zero. |  |\n| native_readiness | all actual data | Actual quantities,complete native operands,applicable acceptance evidence and verified concrete UUID/property/unit support are mandatory for actual binding. Missing generic numeric Range alone is not disqualifying;disclose the gap. Source-backed specifications/intervals need traceable compatible basis;empirical QA guardrails need independent comparable reference evidence. Complete missing physical/lifecycle duties before final full-chain claim;checker pass alone proves neither external identity nor actual readiness. |  |\n\n\n"
