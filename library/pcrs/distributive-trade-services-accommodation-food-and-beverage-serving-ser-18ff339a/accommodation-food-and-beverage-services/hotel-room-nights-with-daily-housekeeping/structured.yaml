  allowed_use: "Only actual matched property/servicepackage/cycle/occupancy and complete responsibility-pool/provider/fullassetlife/fates with actual native quantities and verified bindings"
  excluded_use: "Guestnight/order/capacity/24h proxy;less-than-daily/timeshare/selfcatering/sharedbed;unreviewed inhouseindustriallaundry;HCMI-only operational-carbon or claimed PEF/brand compliance;missing duties treated zero"
  required_metadata: "Property/roomtype/privatebath/actualdailyregime/guests/cycle-timezone-DST/N/revisions;pool-allconsumer-output/standby-N0carry closure;linen batch/drywet/stock/provider coverage;fullasset history/remaining/EOL;native evidence/identities/receiver/directmedium"
  required_quality_disclosure: "Actual coverage/uncertainty/representativeness/update and remaining quantity/identity/support/stage gaps. No universal numericRange required;claimed intervals traceable compatible,empiricalguardrails independently evidenced. HCMI2020/2022 and PEF2026draft-introduction contextual scope/version limits."
  update_trigger: "Actual property/regime/servicepackage/linenprovider/asset or energy-water system change;new findings,source/identity/support revision;new measured periods and completed missing scope"
