validation_rules:
  - rule_id: bed_identity_fulfillment
    applies_to: "occupied_bed_night"
    rule: "Require actual single sleeping berth, independently supplied shared-room inventory and visitor fulfillment/local night/assignment/move/reversal sources. Same service move one ID, both resources retained; real additional supplied services distinct. Whole-room buyout/spare empty beds/booking/no-show/capacity/24hour output invalid. One actual dorm guest can qualify; complimentary fulfillment retains burden; declined cleaning alone not rejection."
    source_ids:
      - generator-barcelona-shared-bed
      - hiusa-nyc-bed-support
  - rule_id: output_and_space_closure
    applies_to: "all consumers"
    rule: "Enumerate intended outputs/handoffs/native quantities and nonoverlapping bed-space/time; actual whole private-room regime not simultaneously all included per-bed outputs. Actual other users and all periods included in physical drivers; useful exports/residues/waste distinct. No unsupported capacity/equal-room/fee/revenue allocation."
    source_ids: []
  - rule_id: necessary_pool_closure
    applies_to: "all resources"
    rule: "Actual direct task/meter trace first, OR compatible raw quantity*target_driver/positive COMPLETE all_consumer_driver for that resource scope. Enumerate all real dorm guests, private-room/buyout/ancillary/tenant users and periods. Necessary same-pool vacancy, standby, blocked-bed, failed/cancelled/no-show duties enter pool resource totals before allocation to real output responsibility. Nominal capacity, merely listing idle records, or deleting closed days cannot leave burden unowned. Crossperiod carry retains source, receiving period and final resolution links; unresolved responsibility blocks the final package. Divide assigned target total by positive EXACT same-scope N_target once; already-per-reference records are not divided again; N_target=0 retains raw resources without division."
    source_ids: []
  - rule_id: full_life_and_providers
    applies_to: "all assets services and ancillaries"
    rule: "Collect complete manufacture, installation, fitout, maintenance, actual replacement and end-of-life for buildings, beds/mattresses, furnishings, equipment, textiles and reusable supports across all users and periods. Compatible lifetime driver is observed all-user history plus sourced remaining productive-equivalent service OR actual terminated total, with each independent native quantity/equivalence/unit/basis/method/state/time/source, uncertainty, sensitivity and update. Annual occupied N_target is not lifetime. Calendar/capacity-time drivers must include idle responsibility in attributable numerators too; productive-service drivers require complete actual and sourced remaining use and full burden closure. One complete asset/provider coverage OR exclusively supplemented missing stages, never both; missing actual stages must actually be integrated once with native quantities/source/owner/coverage links before full-chain use. Actual included meals/activities need complete physical provider duties OR reviewed actual direct route; missing ingredients/cooking/waste/assets cannot be omitted by generic service label."
    source_ids: []
  - rule_id: supply_and_fluid_exclusivity
    applies_to: "material and fluid roles"
    rule: "S=assigned opening+NET external receipts-closing including retained recovery, with actual material receipts excluding container tare. Choose exactly one: gross S/N_target INPUT plus actual matched UNUSED external return/N_target separate OUTPUT; OR consumed-only (S-matched_unused_return)/N_target INPUT and OMIT that matched return OUTPUT. No adding returns to input, double deduction, unrelated negative netting or automatic avoided-production credit. Internal loops are not new external supply; spent material retains original supply burden. Reconcile opening_installed+opening_stored_total+new_factory_charge_entry+net_standalone_receipts+other_external_receipts with closing_installed+closing_stored_total+unused_external_returns+used_usable_export+contained_waste_export+retained_equipment_exit+independently_evidenced_direct_release+explicit_unknown. Stored totals INCLUDE retained recovered substock: recovery is a nonadditive view, not another stock added. Lot/charge/role IDs are exclusive; new factory entry only if not in opening or another receipt, other receipts/exits exclude all named terms, internal charging/recovery cancels. Factory-charge production is in fullasset OR an explicit missing-stage supplement once. Consumed-only deduction/OMIT applies ONLY to same-source same-state evidenced UNUSED standalone substock and its matched unused return. All USED recovered fluid, whether original factory charge or later make-up, is recorded at actual useful export state, not automatically equivalent to unused new supply, not deducted from new manufacture and not a negative input/automatic credit. Retained content in whole/part/mixed waste is nonadditive, not an additional fluid exit. Top-up, recovery or unexplained residual establishes neither direct release nor zero."
    source_ids: []
  - rule_id: receiver_species_state
    applies_to: "all exits"
    rule: "Real distinct streams expanded; true mixture/component/whole content nonadditive. Contained wastewater/refrigerant Waste; direct water actual medium, actual vapour Mass to air. Native sources/measurement/factors and exact species required, unknown residual or failed identity access not evidence of emission, absence or zero. Provider/fullasset transport/treatment not repeated."
    source_ids: []
  - rule_id: native_linen_freight
    applies_to: "all measurement"
    rule: "Dry laundry service not new textile/wet freight. Every operand native metadata, same-sample water-only wet/dry percent conversion, EACH/TOTAL actual count once; actual packed payload retains containers/support, only noncargo vehicle tare removed. THAT-record freight share INSIDE sum and positive same-scope N_target once. Unsupported actual equivalence, medium, conversion or provider stage blocks final data use."
    source_ids: []
  - rule_id: evidence_range_readiness
    applies_to: "all data"
    rule: "Final exchange needs actual identity/configuration/quantities/native evidence and verified concrete property/unit support. Missing generic numeric range or UUID alone remains disclosed candidate gap, not invented default. Claimed source interval must be traceable and physically compatible; empirical QA guardrail needs independent comparable reference evidence, not circular same-batch extrema. A check pass does not prove final binding/scientific review/publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and completeness review"
  downstream_use: "Foreground data package and process/lifecyclemodel projection for one actually fulfilled independently supplied visitor single-bed-night in shared dormitory"
  allowed_use: "Actual single sleeping berth independently supplied to visitors with real shared-room inventory/configuration/assignment/night evidence, complete all-user pool/lifetime/provider/ancillary coverage"
  excluded_use: "Private whole-room/night or bedcapacity conversion, multi-sleeper/double-bed equivalence, student/worker/camp reference, rights/bookings/unused capacity or unreviewed actual production routes; incomplete meal/provider/full-life/idle duties as zero"
  required_metadata: "Actual property/bed/bunk/room plans/configuration and independent supply regime; visitor/stay/service-night/moves/fulfillment/reversals/local time/DST/actual package; complete real users/output handoffs/native physical drivers, all asset life/laundry/provider/receiver/ancillary scope and crossperiod responsibility resolution"
  required_quality_disclosure: "Actual measurement versus estimate/native basis/source/calibration/coverage/uncertainty/sensitivity/update; unresolved flow/support identities, quantities/species/medium/lifetime/attribution and stage completion gaps; generic numeric Range absence alone not proof of error or zero"
  update_trigger: "Changed bed/room topology, buyout/shared supply regime, guest/night conventions, package/meal/activity/laundry/provider/common users, real added production route, asset life/stock/fate/identity or measurement evidence"
data_sources:
  - id: "unsd-cpc3-63114"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/63114"
    used_for: "63114 covers short daily/weekly visitor lodging in multiple-occupancy rooms such as youth hostels/refuges/cabins. Recreational camps63130, student residences63210 and workers hostels/camps63220 excluded. Classification context only; no bed-count, service quantity, occupancy, allocation or full lifecycle evidence."
  - id: "generator-barcelona-shared-bed"
    type: "extension_guidance"
    reference: "https://staygenerator.com/hostels/barcelona?lang=en-GB"
    used_for: "First-party operator explicitly offers one or more beds in shared dorm rooms, separately from private whole rooms. Shared-bed descriptions include actual bedding and room facilities, with towel extras. Current promotion may include breakfast; distinct room and bed offers coexist at one property. Qualitative product configuration only. No room capacity, price, age, meals, housekeeping frequency, linen replacement count, load factor or thermal intensity becomes PCR default. Actual booked package must establish any promotion/bundle and real supplied bed; no universal no-meal claim inferred from site."
  - id: "generator-booking-service-scope"
    type: "handbook"
    reference: "https://staygenerator.com/information/booking-terms-and-conditions"
    used_for: "A single booking may contain shared-room beds that are not guaranteed to be assigned to the same room. Booking details distinguish persons, rooms, duration and extras. Cancellation/no-show charges can be levied without actual stay. Food/drink is normally outside charges unless included by specific booking. Used only to distinguish booking/payment from physical assignments and actual delivered service scope. Not legal advice, a universal commercial requirement, a service-night duration, a default food exclusion or an LCA factor. Site-specific clock times, legal rules and prices not imported."
  - id: "hiusa-nyc-bed-support"
    type: "handbook"
    reference: "https://www.hiusa.org/hi-new-york-city-hostel-faq"
    used_for: "Actual bunk assignment is resolved on arrival; an extended stay may move bed/room. Linen and towels are included at this property; guest kitchen, actual guest laundry, free activities and separately sold cafe/bar exist. Actual site-specific qualifying evidence only; no age, price, dimension, clock, cleaning or laundry-rate defaults. Guest laundry availability does not prove operator linen treatment route; restaurant or activities existence does not establish actual bed-package inclusion."
  - id: "eurostat-rooms-bedplaces-nights"
    type: "official_guidance"
    reference: "https://ec.europa.eu/eurostat/cache/metadata/en/tour_occ_esms.htm"
    used_for: "Bedrooms are indivisible rental wholes; bedplaces measure accommodation capacity, including two capacity places for a double bed. Nights spent concern actual overnight guests. These variables have distinct meanings. Capacity and statistical occupancy rates are not PCR actual bed-service N or causal load fractions. Do not import camping four-person fallback, exclusion of closure days, default age, statistical available capacity as lifetime or actual occupancy. Target single actual assigned berth is narrower than all statistical bedplaces."
  - id: "pef-hotel-introduction-2026"
    type: "method_factor"
    reference: "2026 second public consultation introduction,3pages; https://pefhotelaccommodation.eu/system/files/document/introduction-to-the-pefcr-for-hotel-accommodation_2nd-consultation.pdf"
    used_for: "Limited qualitative hotel context for complete equipment/building/textile manufacture/use/EOL and operational supplies; adapted foreground responsibilities are explicitly collected here. Not full approved PEFCR, not hostel compliance, no defaults or source-exclusion rule imported."
