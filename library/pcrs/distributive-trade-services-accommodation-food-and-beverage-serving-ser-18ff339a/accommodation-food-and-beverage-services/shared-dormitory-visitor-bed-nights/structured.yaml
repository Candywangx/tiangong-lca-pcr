allocation_rules:
  - rule_id: fulfilled_bed_scope
    applies_to: "all lodging resources"
    rule: "N_target=count(unique fulfilled occupied single-berth service-night IDs after actual reversal and move reconciliation). Require actual visitor, independently supplied SINGLE sleeping berth, real bed/room/configuration assignment, local overnight convention and actual check-in/out/timezone/UTC-offset/DST evidence. A room may have one actual guest while retaining per-bed shared supply; do not require another guest to be present. Same fulfilled bed-service night moved between berths keeps one service ID with both real segments/resources, while genuinely additional independently delivered services have distinct IDs. Whole-room exclusive buyout, unused spare bed, reservation, guest capacity, paid no-show and fixed24hours are not this reference. Physically fulfilled complimentary stays retain responsibility, and declining cleaning alone does not erase delivered lodging."
    source_ids:
      - generator-barcelona-shared-bed
      - generator-booking-service-scope
      - hiusa-nyc-bed-support
  - rule_id: complete_output_set
    applies_to: "target and competing outputs"
    rule: "Enumerate actual independently supplied bed-service outputs, private whole-room/buyout outputs, actual other service/tenant users and their native handoff quantities before target extraction. Intended lodging/ancillary outputs differ from usable materials/residues/waste. No whole-room+included beds double output, nominal bed-capacity factor, fee/revenue/points allocation or automatic recovered-output credit. Resource-specific direct trace or evidence-compatible physical all-consumer drivers, not an unsupported universal equal split."
    source_ids:
      - generator-barcelona-shared-bed
      - generator-booking-service-scope
  - rule_id: physical_pool_closure
    applies_to: "all resources"
    rule: "Actual direct task/meter trace first, OR compatible raw quantity*target_driver/positive COMPLETE all_consumer_driver for that resource scope. Enumerate all real dorm guests, private-room/buyout/ancillary/tenant users and periods. Necessary same-pool vacancy, standby, blocked-bed, failed/cancelled/no-show duties enter pool resource totals before allocation to real output responsibility. Nominal capacity, merely listing idle records, or deleting closed days cannot leave burden unowned. Crossperiod carry retains source, receiving period and final resolution links; unresolved responsibility blocks the final package. Divide assigned target total by positive EXACT same-scope N_target once; already-per-reference records are not divided again; N_target=0 retains raw resources without division."
    source_ids: []
  - rule_id: complete_asset_life
    applies_to: "assets linen and providers"
    rule: "Collect complete manufacture, installation, fitout, maintenance, actual replacement and end-of-life for buildings, beds/mattresses, furnishings, equipment, textiles and reusable supports across all users and periods. Compatible lifetime driver is observed all-user history plus sourced remaining productive-equivalent service OR actual terminated total, with each independent native quantity/equivalence/unit/basis/method/state/time/source, uncertainty, sensitivity and update. Annual occupied N_target is not lifetime. Calendar/capacity-time drivers must include idle responsibility in attributable numerators too; productive-service drivers require complete actual and sourced remaining use and full burden closure. One complete asset/provider coverage OR exclusively supplemented missing stages, never both; missing actual stages must actually be integrated once with native quantities/source/owner/coverage links before full-chain use."
    source_ids:
      - pef-hotel-introduction-2026
  - rule_id: material_stock_choice
    applies_to: "standalone operating materials"
    rule: "S=assigned opening+NET external receipts-closing including retained recovery, with actual material receipts excluding container tare. Choose exactly one: gross S/N_target INPUT plus actual matched UNUSED external return/N_target separate OUTPUT; OR consumed-only (S-matched_unused_return)/N_target INPUT and OMIT that matched return OUTPUT. No adding returns to input, double deduction, unrelated negative netting or automatic avoided-production credit. Internal loops are not new external supply; spent material retains original supply burden."
    source_ids: []
  - rule_id: fluid_provenance_fates
    applies_to: "refrigerant supply recovery and exits"
    rule: "Reconcile opening_installed+opening_stored_total+new_factory_charge_entry+net_standalone_receipts+other_external_receipts with closing_installed+closing_stored_total+unused_external_returns+used_usable_export+contained_waste_export+retained_equipment_exit+independently_evidenced_direct_release+explicit_unknown. Stored totals INCLUDE retained recovered substock: recovery is a nonadditive view, not another stock added. Lot/charge/role IDs are exclusive; new factory entry only if not in opening or another receipt, other receipts/exits exclude all named terms, internal charging/recovery cancels. Factory-charge production is in fullasset OR an explicit missing-stage supplement once. Consumed-only deduction/OMIT applies ONLY to same-source same-state evidenced UNUSED standalone substock and its matched unused return. All USED recovered fluid, whether original factory charge or later make-up, is recorded at actual useful export state, not automatically equivalent to unused new supply, not deducted from new manufacture and not a negative input/automatic credit. Retained content in whole/part/mixed waste is nonadditive, not an additional fluid exit. Top-up, recovery or unexplained residual establishes neither direct release nor zero."
    source_ids: []
  - rule_id: failed_and_reworked_routes
    applies_to: "bed room linen and cleaning events"
    rule: "Actual off-spec bed/room/linen/cleaning states have original event IDs and evidenced reclean/repair/redeployment/usable transfer/retained-pending/discard routes. Rewash/reclean consumes actual resources once but is neither a new textile purchase nor an extra accepted bed-night. Actual unsupplied or unresolved rejected service does not enter N_target; necessary failed duties remain in responsible resource pools. Declined cleaning alone does not undo supplied lodging."
    source_ids: []
