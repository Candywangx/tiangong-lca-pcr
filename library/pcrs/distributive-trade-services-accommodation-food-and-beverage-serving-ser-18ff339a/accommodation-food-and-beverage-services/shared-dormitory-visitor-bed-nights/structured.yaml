      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `bed_identity_fulfillment` | occupied_bed_night | Require actual single sleeping berth, independently supplied shared-room inventory and visitor fulfillment/local night/assignment/move/reversal sources. Same service move one ID, both resources retained; real additional supplied services distinct. Whole-room buyout/spare empty beds/booking/no-show/capacity/24hour output invalid. One actual dorm guest can qualify; complimentary fulfillment retains burden; declined cleaning alone not rejection. | generator-barcelona-shared-bed; hiusa-nyc-bed-support |\n| `output_and_space_closure` | all consumers | Enumerate intended outputs/handoffs/native quantities and nonoverlapping bed-space/time; actual whole private-room regime not simultaneously all included per-bed outputs. Actual other users and all periods included in physical drivers; useful exports/residues/waste distinct. No unsupported capacity/equal-room/fee/revenue allocation. |  |\n| `necessary_pool_closure` | all resources | Actual direct task/meter trace first, OR compatible raw quantity*target_driver/positive COMPLETE all_consumer_driver for that resource scope. Enumerate all real dorm guests, private-room/buyout/ancillary/tenant users and periods. Necessary same-pool vacancy, standby, blocked-bed, failed/cancelled/no-show duties enter pool resource totals before allocation to real output responsibility. Nominal capacity, merely listing idle records, or deleting closed days cannot leave burden unowned. Crossperiod carry retains source, receiving period and final resolution links; unresolved responsibility blocks the final package. Divide assigned target total by positive EXACT same-scope N_target once; already-per-reference records are not divided again; N_target=0 retains raw resources without division. |  |\n| `full_life_and_providers` | all assets services and ancillaries | Collect complete manufacture, installation, fitout, maintenance, actual replacement and end-of-life for buildings, beds/mattresses, furnishings, equipment, textiles and reusable supports across all users and periods. Compatible lifetime driver is observed all-user history plus sourced remaining productive-equivalent service OR actual terminated total, with each independent native quantity/equivalence/unit/basis/method/state/time/source, uncertainty, sensitivity and update. Annual occupied N_target is not lifetime. Calendar/capacity-time drivers must include idle responsibility in attributable numerators too; productive-service drivers require complete actual and sourced remaining use and full burden closure. One complete asset/provider coverage OR exclusively supplemented missing stages, never both; missing actual stages must actually be integrated once with native quantities/source/owner/coverage links before full-chain use. Actual included meals/activities need complete physical provider duties OR reviewed actual direct route; missing ingredients/cooking/waste/assets cannot be omitted by generic service label. |  |\n| `supply_and_fluid_exclusivity` | material and fluid roles | S=assigned opening+NET external receipts-closing including retained recovery, with actual material receipts excluding container tare. Choose exactly one: gross S/N_target INPUT plus actual matched UNUSED external return/N_target separate OUTPUT; OR consumed-only (S-matched_unused_return)/N_target INPUT and OMIT that matched return OUTPUT. No adding returns to input, double deduction, unrelated negative netting or automatic avoided-production credit. Internal loops are not new external supply; spent material retains original supply burden. Reconcile opening_installed+opening_stored_total+new_factory_charge_entry+net_standalone_receipts+other_external_receipts with closing_installed+closing_stored_total+unused_external_returns+used_usable_export+contained_waste_export+retained_equipment_exit+independently_evidenced_direct_release+explicit_unknown. Stored totals INCLUDE retained recovered substock: recovery is a nonadditive view, not another stock added. Lot/charge/role IDs are exclusive; new factory entry only if not in opening or another receipt, other receipts/exits exclude all named terms, internal charging/recovery cancels. Factory-charge production is in fullasset OR an explicit missing-stage supplement once. Consumed-only deduction/OMIT applies ONLY to same-source same-state evidenced UNUSED standalone substock and its matched unused return. All USED recovered fluid, whether original factory charge or later make-up, is recorded at actual useful export state, not automatically equivalent to unused new supply, not deducted from new manufacture and not a negative input/automatic credit. Retained content in whole/part/mixed waste is nonadditive, not an additional fluid exit. Top-up, recovery or unexplained residual establishes neither direct release nor zero. |  |\n| `receiver_species_state` | all exits | Real distinct streams expanded; true mixture/component/whole content nonadditive. Contained wastewater/refrigerant Waste; direct water actual medium, actual vapour Mass to air. Native sources/measurement/factors and exact species required, unknown residual or failed identity access not evidence of emission, absence or zero. Provider/fullasset transport/treatment not repeated. |  |\n| `native_linen_freight` | all measurement | Dry laundry service not new textile/wet freight. Every operand native metadata, same-sample water-only wet/dry percent conversion, EACH/TOTAL actual count once; actual packed payload retains containers/support, only noncargo vehicle tare removed. THAT-record freight share INSIDE sum and positive same-scope N_target once. Unsupported actual equivalence, medium, conversion or provider stage blocks final data use. |  |\n| `evidence_range_readiness` | all data | Final exchange needs actual identity/configuration/quantities/native evidence and verified concrete property/unit support. Missing generic numeric range or UUID alone remains disclosed candidate gap, not invented default. Claimed source interval must be traceable and physically compatible; empirical QA guardrail needs independent comparable reference evidence, not circular same-batch extrema. A check pass does not prove final binding/scientific review/publication readiness. |  |\n\n"
