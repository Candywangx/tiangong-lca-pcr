      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actually operated shared dormitory with real single-berth inventory/configuration, visitor assignment and local-night/package duty evidence |\n| starting_condition_role | Actual lodging production and full-life assets; ready existing facilities are not a burden-free starting condition |\n| product_classification_scope | Narrower63114 actual visitor shared-bed supply, excluding student/worker/camp service regimes and private whole-room output |\n| recursive_input_rule | Do not purchase the identical final bed-night as its own input. Complete actual provider services replace only matching owned underlying duties, not the whole independent physical system twice |\n| upstream_dataset_requirement | Actual utility/material/linen/provider supply and complete building/fitout/bed/mattress/equipment/textile manufacture-install-maintain-replace-EOL, all users/periods once. Actual package meals/activities require completed provider or reviewed direct-production scope. Actual missing duties actually integrated with native quantities/source/owner/coverage before complete chain use |\n| disclosure | Actual bed-room topology/time/visitor/night/fulfillment/moves/shared-versus-buyout, all real consumers/output handoffs and necessary idle pools, native records/lifetime/provider/ancillary/receiver/species/coverage gaps |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `physical_shared_supply` | shared_bed_service | Actual independently supplied single visitor berth with own assignment and real shared-room/common-facility responsibility, not room capacity or private whole-room reference. Actual membership and overlap by bed/room/configuration/time preserve all real co-users. | unsd-cpc3-63114; generator-barcelona-shared-bed; hiusa-nyc-bed-support |\n| `full_life_responsibility` | all resources | Collect complete manufacture, installation, fitout, maintenance, actual replacement and end-of-life for buildings, beds/mattresses, furnishings, equipment, textiles and reusable supports across all users and periods. Compatible lifetime driver is observed all-user history plus sourced remaining productive-equivalent service OR actual terminated total, with each independent native quantity/equivalence/unit/basis/method/state/time/source, uncertainty, sensitivity and update. Annual occupied N_target is not lifetime. Calendar/capacity-time drivers must include idle responsibility in attributable numerators too; productive-service drivers require complete actual and sourced remaining use and full burden closure. One complete asset/provider coverage OR exclusively supplemented missing stages, never both; missing actual stages must actually be integrated once with native quantities/source/owner/coverage links before full-chain use. | pef-hotel-introduction-2026 |\n| `actual_ancillary_scope` | provider and actual direct duties | Actually included meal/activity/common-facility obligations stay inside the declared package with complete physical upstream stages. Real complete providers OR reviewed real kitchen/production-route expansion and missing-stage supplements are required before use. Presence of a restaurant, guest laundry, promotion or free activity alone neither proves every bed includes it nor licenses zero. Guest self-bought food/goods manufacture and travel outside selected lodging scope; actual operator-supplied duties and guest-origin handling retained. | generator-barcelona-shared-bed; generator-booking-service-scope; hiusa-nyc-bed-support |\n| `route_and_source_limits` | all methods | No boiler/generator/industrial laundry/food-production technology, cleaning/linen frequency, room capacity, statistical camping fallback, universal24hours, price, age, lifetime, leak rate or numeric range inferred. Actual independent operations require reviewed scope/module expansion. Eurostat capacity/occupancy distinctions and PEF2026 second-consultation hotel introduction are limited context, not a hostel PEF compliance claim, full approved standard, numerical factor or permission to erase closure-day burdens. | eurostat-rooms-bedplaces-nights; pef-hotel-introduction-2026 |\n\n"
