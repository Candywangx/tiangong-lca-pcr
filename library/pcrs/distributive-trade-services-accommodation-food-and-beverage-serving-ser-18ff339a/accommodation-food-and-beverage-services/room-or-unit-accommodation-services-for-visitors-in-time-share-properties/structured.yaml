es or periods reconcile dispatch with receipt, net change in transit stock and independently measured losses; whole and component views are nonadditive. A genuine single formulation, physical assembly or receiver mixture retains its own identity without duplicating its constituents. Apply these recording instructions only to the stated outputs/elementary identity and gate (Actual accommodation species-specific releases to documented media). Activate for an actual release to its documented receiving compartment, supported by observation or an applicable calculation. Record exact substance/form, source or receiving compartment, fossil/biogenic origin where relevant, particle fraction or count-size basis where relevant and sampling period. Preserve reported elemental versus molecular bases; conversion needs stoichiometry and compatible species evidence. Contained pollutants belong to the receiver stream until the actual environmental release boundary. Do not replace missing species with CO2, NOx, VOC, COD or a generic particulate flow. Explicit branches (activate only on actual applicable records): direct_species_co2_fossil_air, direct_species_methane_fossil_air, direct_species_nitrous_oxide_air. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
