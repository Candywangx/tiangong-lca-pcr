  calculation_rules:
    - id: whole_night_n
      applies_to: "whole_villa_night"
      rule: "N_target=count(unique actually fulfilled whole_parent_night_ids after reversals in the declared target scope). Both actual studio and one-bedroom spaces must be exclusively supplied to the same stay/night; actual guest need not sleep in every bed. Preserve local-night convention, actual start/end/UTC-offset/DST elapsed duration. Child-only, non-lock-off, available-capacity, points/no-show states not whole output. Complimentary fulfilled deliveries retain responsibility; refusal of cleaning does not remove N."
      inputs:
        - cp_stays
      output: "Actual configuration-specific whole-villa night Count"
      source_ids: []
    - id: atomic_coverage
      applies_to: "physical configuration and asset ledger"
      rule: "For every atomic_child_id and actual time segment, exactly one physical supply/blocked/idle responsibility state applies. A combined parent delivery covers both child segments once; separately supplied child segments cannot overlap that parent. Total physical space/time coverage closes with actual idle/blocked/maintenance/resolution records, not sum(parent-label nights+included child-label nights). Target output remains whole configuration; other real consumers retain their physical resource shares."
      inputs:
        - cp_stays
        - cp_assets
      output: "Exclusive physical atomic-space/time and all-consumer scope"
      source_ids: []
    - id: resource_pool_normalization
      applies_to: "all service rows"
      rule: "Assigned_target_quantity=direct actual target task/meter trace OR actual_resource_quantity*target_driver/all_consumer_driver, where all_consumer_driver>0 and complete compatible native scope includes all real users. Necessary same-pool standby/idle/no-show/cancelled/failed/closed duties enter pool totals and evidenced real-output attribution; unowned or unresolved shares block completion. Per_reference_quantity=Assigned_target_quantity/N_target only N_target>0 for EXACT same target scope; already_per_reference records not divided again, single night N=1 unchanged. Raw physical stock/provider/lifetime records remain raw. N0 retains resource-period-cohort/carry evidence, no division or dropped burden."
      inputs:
        - cp_stays
        - cp_utilities
        - cp_materials
        - cp_laundry
        - cp_providers
        - cp_assets
        - cp_refrigerants
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference service inventory"
      source_ids: []
    - id: utility_quantity
      applies_to: "electricity/purchased useful heat/water; electricity_ac"
      rule: "Use compatible (register_end-register_start+register_adjustment)*meter_multiplier*native_conversion_factor OR actual interval_quantity*native_conversion_factor; multiplier/conversion only when not already applied. Native evidence resolves resets/rollovers/valid versions and actual interval. Purchased useful thermal output retains actual delivery state/provider losses-assets coverage, not duplicate carrier/plant input. Attribute actual room/kitchen/HVAC/shared and necessary pool duties once then positive same-target N_target once."
      inputs:
        - cp_utilities
        - cp_stays
      output: "Actual supplied utility quantities"
      source_ids: []
    - id: supply_stock
      applies_to: "operating_materials/fuel/unused returns; operating_materials_synthetic_detergent"
      rule: "S=assigned opening+net_external_receipts-closing_including_recovery for the same actual material pool, NET receipts exclude container tare. Choose one: gross S/N_target INPUT plus actual matched usable_external_return/N_target separate OUTPUT; OR consumed-only (S-usable_external_return)/N_target INPUT and OMIT that matched OUTPUT. Do not add return to input or deduct twice. Internal loops/retained recovery stay stock, waste retains input burden; fuel supply not burn, no unrelated negative netting or automatic credit."
      inputs:
        - cp_materials
        - cp_stays
      output: "Exclusive normalized supply/return representation"
      source_ids: []
    - id: linen_service_water
      applies_to: "laundry and reusable linen views"
      rule: "Laundry_service_quantity is actual dry_linen_mass_processed or evidenced native provider-service result, including actual rewash with its own task/source and exclusive coverage. Item conversion only actual matched reusable items; never new textile manufacture per wash or dry throughput=wet cargo. Water-only same-sample w_wet=m_water/m_as_received gives m_nonwater=m_as_received*(1-w_wet). If r_dry=m_water/m_nonwater uses the SAME definitions/sample, w_wet=r_dry/(1+r_dry); reported percent converted to ratio first using native percent_to_ratio_factor. Other-volatile LOD not water; unknown/incompatible basis blocks conversion, not zero. Actual omitted provider duties must actually be integrated once before use."
      inputs:
        - cp_laundry
        - cp_assets
        - cp_freight
      output: "Separate laundry-service and material-state native evidence"
      source_ids: []
    - id: complete_asset_equivalent
      applies_to: "building_assets/linen_assets"
      rule: "Actual asset_equivalent derives from asset_native_quantity*driver_equivalence_factor*job_used_driver/lifetime_all_user_driver only with supported dimensional equivalence and lifetime_all_user_driver>0 in compatible native scope. Complete lifetime driver=observed_life_driver+sourced remaining_life_driver under actual termination and full all-user productive-equivalent responsibility; no annual target N or nominal capacity as lifetime. Necessary standby/unused burden is allocated to real output responsibility, not a zero-service unowned share. Full manufacture/install/fitout/maintenance/replacement/EOL inside asset/provider boundary once. Source-receiver-resolution cross-period carry and actual missing lifecycle stages need completed links/quantities/source/owner/coverage before final package. Then /positive exactly same-target N_target once unless already normalized."
      inputs:
        - cp_assets
        - cp_stays
        - cp_providers
      output: "Supported complete-life asset service per reference"
      source_ids: []
    - id: record_freight
      applies_to: "freight"
      rule: "Each unique actual load-leg uses actual payload OR compatible same-state vehicle_gross-vehicle_noncargo_tare; keep actual carried wet laundry/contents/all packs/supports. EACH multiplies evidenced repeated_load_count once, TOTAL unchanged. After native unit conversions, assigned_freight=SUM(unique load-leg: payload_kg*distance_km*that_record_share), THAT-record complete compatible target/all-user share INSIDE sum. Then /positive same-target N_target once unless already_per_reference; N0 and necessary failed pool work retained. Provider/laundry/receiver/empty-return scope once; guest travel not silently added."
      inputs:
        - cp_freight
        - cp_stays
      output: "Actual unique kg*km per reference"
      source_ids: []
    - id: charge_fates
      applies_to: "refrigerant supply/recovery/species"
      rule: "Reconcile native system charge and standalone supply records with independently evidenced charging/recovery/retained closing/usable export/waste/measured release and explicit unknown residual; balance residual or top-up alone is not emitted quantity or zero. Initial factory charge already in full asset and actual standalone supply one owner each. Factory-charge usable export recorded as actual Product transfer without offsetting unrelated current make-up/negative input/automatic credit. Only evidenced UNUSED same-source same-state standalone substock with an actual matched unused return may use consumed-only deduction with that OUTPUT OMITTED. USED recovered refrigerant from factory charge OR standalone make-up is a separately recorded actual-state usable export, not automatically equivalent to unused new supply and not deducted from new manufacture; no negative input or automatic credit. Actual contained waste to receiver is Waste Mass, not air release; direct species method separately evidenced."
      inputs:
        - cp_refrigerants
        - cp_assets
        - cp_releases
      output: "Exclusive actual refrigerant chemical/state/fate ledger"
      source_ids: []
    - id: receiver_views
      applies_to: "all waste/water/asset fates"
      rule: "Each actual distinct received stream has native identity/state/net quantity/composition/receiver/transport-treatment owner. Use whole genuine mixture OR exclusive component views, never add both; retained reusable contents and absorbed liquid are not extra free liquid. Actual contained sewer/free liquid uses Waste; direct environmental water actual medium uses Elementary, water vapour uses actual species Mass to air. Purchased supply minus unknown residual is not wastewater/vapour or zero. Asset/provider EOL/treatment already covering the same duty not repeated."
      inputs:
        - cp_fates
        - cp_assets
        - cp_refrigerants
      output: "Actual exclusive native receiver/environment interface quantities"
      source_ids: []
    - id: actual_species
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Species_quantity=measured_species_quantity OR compatible actual_activity*emission_factor with exact actual substance/particle/medium and each native operand unit/basis/method/state/sampling time/source. Complete factor already covering composition/fate fractions not multiplied again. Required composition_fraction/fate_fraction/gas conversion only when method needs once with actual temperature/pressure units/source and matching state; refrigerant blend component shares require actual emitted-composition evidence, not assumed supply composition. Chemical purchases, odour, moisture/charge residual or provider generation factor not actual release or zero. Apply actual exclusive resource attribution then same-target positive N_target once; N0 retain."
      inputs:
        - cp_releases
        - cp_refrigerants
        - cp_fates
        - cp_stays
      output: "Evidence-supported native species amount per reference"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity_and_scope
      applies_to: "all roles"
      requirement: "Resolve actual whole-parent/night/atomic plan/configuration/beneficiary/assignment and every concrete utility/material/service/asset/receiver/species identity/property/unit before final exchange. Count support only verifies counted measurement, not villa-night identity, guest-night equivalence or24hour duration. Conditional umbrellas expand zero/one/multiple actual streams, never forced fixed mixed UUID."
      evidence: "Actual operator/property plans, native records, actual detailed identity/support evidence"
    - id: native_complete_operands
      applies_to: "all calculations"
      requirement: "Every numerator/denominator/native quantity/component/conversion/density-temperature/timezone/asset job-observed-remaining-life/repetition/fate/species operand retains unit/basis/method/state/sampletime/source and scope/population. Independent component quantities need own metadata, not whole-stream unit by default. Unknown/incompatible actual data block calculation/final data use, not zero."
      evidence: "cp_stays; cp_utilities; cp_materials; cp_laundry; cp_assets; cp_refrigerants; cp_freight; cp_fates; cp_releases"
    - id: range_evidence_limits
      applies_to: "each card"
      requirement: "Row-specific Range evidence needs identify actual quantity/basis/coverage collection; no universal numeric range is mandatory. A source interval becomes an empirical guardrail only if traceable and genuinely compatible with actual object/state/unit/boundary; it also needs independent reference/comparison for QA, not circular same-record min/max as validation. Missing range identity/quantity remains a disclosed use-limited gap, never invented bounds or benchmark."
      evidence: "Actual matched independent sources/record population/method and stated applicability; no operator fee/points/schedule factor"
    - id: closed_coverage
      applies_to: "all pools/lifetimes/interfaces"
      requirement: "Include complete common-system allusers, necessary standby/idle/failed/closed responsibility, actual cleaning declined versus service delivered, complete provider/fullasset stages and source-receiver-resolution carry. Missing actual integrated stages or unowned burden block package completeness. Disclose measured/estimated coverage/lifetime uncertainty/sensitivity/update and actual site package limitations."
      evidence: "Actual coverage/phase records, completed provider supplements, lifetime evidence and independent review"
validation_rules:
  - rule_id: actual_whole_reference
    applies_to: "whole_villa_night"
    rule: "Actual member-beneficiary visitor whole two-bedroom lock-off plan, independent atomic child IDs and same-case/night exclusive delivery/assigned room/check-in-out/acceptance/reversal evidence required. Whole configuration fixed; no child-only/dedicated two-bedroom/rights/points/capacity/no-show count. Actual guest refusal of cleaning does not remove delivered N; actual complimentary fulfilled stays retain responsibility."
    source_ids:
      - dvc-home-rules-2026
  - rule_id: atomic_no_overlap
    applies_to: "physical space/time"
    rule: "Verify nonoverlapping actual child-space/time coverage and configuration transitions. Parent whole maps both included atomic spaces once, not three simultaneous physical units. Whole+child overlap, crossnight/partial child closure or actual room moves require explicit segmentation; unresolved space assignment blocks target applicability."
    source_ids:
      - dvc-home-rules-2026
      - aulani-shared-topology-2023
  - rule_id: pool_burden_closure
    applies_to: "all resource pools"
    rule: "Necessary vacant/standby/maintenance/failed/cancelled/no-show same-pool duties must actually enter resource totals and evidenced complete real-output responsibility. Merely listing records or nominal points/capacity cannot eliminate burdens. True separate other-user/output share only actual evidence; crossperiod source-receiver-resolution mandatory, unassigned share means incomplete. Positive exactly same-target N_target normalization once; N0 retained, already-per-reference no second division."
    source_ids: []
  - rule_id: complete_lifetime_provider
    applies_to: "all capital/services"
    rule: "Full shell/fitout/FF&E/HVAC/appliance/linen life manufacture-install-maintain-replace-EOL allusers observed+sourced remaining productive-equivalent drivers/termination/native units/equivalence/uncertainty/update; annual target N not lifetime. One provider OR underlying assets/operations, actual omitted stages ACTUALLY completed once with native quantity/source/owner/coverage links before use. Financial title/expense shares not physical default allocation."
    source_ids: []
  - rule_id: materials_refrigerant_fates
    applies_to: "supply/fates"
    rule: "NET materials exclude tare; gross INPUT+matchedreturn/N OUTPUT OR consumed INPUT/OMIT matched OUTPUT, no repeat or unrelated negative credit. Initial asset refrigerant charge not bought twice; recovered retained/usable export/Waste/direct species disjoint, factory-charge export cannot offset unrelated operating make-up. Consumed-only deduction/OMIT applies ONLY to evidenced UNUSED same-source same-state standalone substock with an actual matched unused return. All USED recovered refrigerant, whether factory-charge or standalone-make-up origin, keeps its actual export state, without automatic equivalence to unused new supply, deduction from new manufacture, negative input or credit. Every actual distinct waste receiver stream expands, genuine mixtures/component views nonadditive; contained liquid Waste, actual vapour air Elementary Mass, direct water actual medium. No stock residual/top-up=emission/zero or automatic recycling credit."
    source_ids: []
  - rule_id: laundry_utility_freight_native
    applies_to: "all quantities"
    rule: "Actual dry linen service throughput not new linen or wet cargo; provider complete duties/rewash once, no kg-per-night or percentage fallback. Actual utilities/register adjustments/conversions/multipliers one application, guest appliance use not assumedzero. Actual packed freight only service-boundary unique loadleg, cargo packs/supports retained, ONLY noncargo vehicle tare, EACH/TOTAL evidenced actualcount once and THAT-record share INSIDE sum before same-target positive N_target once. Every operand native6metadata, no points/fee/bill/capacity shortcuts."
    source_ids: []
  - rule_id: source_scope_unknown
    applies_to: "all methods"
    rule: "Sources support topology/operational questions only; actual site plan/service/measurement needed. No universal checkin24hour/cleaningday/point/fee/area/capacity/lifetime/species defaults. All material unresolved UUID/support/quantity/medium/lifetime/attribution and Range-evidence gaps explicitly limit use; checker pass not semantic identity or publication proof."
    source_ids:
      - dvc-home-rules-2026
      - aulani-shared-topology-2023
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
