  calculation_rules:
    - id: fulfilled_count
      applies_to: "meal_set_supply"
      rule: "N_target is unique actual compatible completed operator-loaded receipt supply IDs after required components/quality/quantity/order change/acceptance/reversal under operator_gate."
      inputs:
        - cp_service
        - output_id
        - actual_acceptance_id
      output: "N_target"
      source_ids: []
    - id: assign_resource
      applies_to: "all inventory rows"
      rule: "Direct physical trace and independent-process subdivision first. For actual shared duty assign each compatible raw record times THAT target_driver divided by positive complete all_consumer_driver, then sum. Include every customer/menu/flight/job/staff/nonfood user and period; necessary idle/failed/cancelled/closed/readiness resources remain in responsible pool. N_target=0 or zero transfer retains source/carry/receiving/final resolution without division or fake output; unresolved responsibility blocks completeness. Assigned target TOTAL still divides same positive profile N_target once; only already-per-reference quantities remain unchanged."
      inputs:
        - raw_quantity
        - target_driver
        - all_consumer_driver
      output: "assigned_target_total"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "Assigned target total divided by same positive profile N_target once; already-per-reference unchanged; N0 (zero output) requires no division and real carry/final resolution."
      inputs:
        - assigned_target_total
        - N_target
      output: "per_reference_quantity"
      source_ids: []
    - id: stock_quantity
      applies_to: "all stocks and fluids"
      rule: "Net receipts remove only tare before outbound returns. Gross drawn S=attributed opening+inbound-closing plus actual paired responsibility transfers. Use S input+matched UNUSED return output OR (S-UNUSED) input and omit that output. Used ware/food/fluids retain original burden, not virgin supply deduction or automatic credit. Stored/installed/recovered fluid roles exclusive; factory new charge absent opening is equipment entry, not another purchase. Track all actual useful/waste/whole equipment retained-content/direct-release fates; whole/component contents nonadditive, unknown balance not emission."
      inputs:
        - cp_food
        - cp_materials
        - cp_fluids
      output: "exclusive_stock_quantity"
      source_ids: []
    - id: terminal_balance
      applies_to: "food water and fates"
      rule: "Preserve actual raw/thawed/prepared/cooked/held/loaded/returned wet/dry/edible/bone/skin/water/fat/solute states, recipe and stock quantities; no universal yield. Same-sample water-only wet fraction w=water/wet and dry ratio r=water/non-water imply w=r/(1+r), percent first; loss-on-drying with other volatiles is not water. Terminal balances use actual external terminal exits plus actual closing stocks, excluding internal enduse/transfer, component contents and duplicate receiver views. Water vapour is water species to air Mass; contained effluent is Waste. Independent actual species/medium/particle/basis/factor evidence required; unknown residual not emission or zero."
      inputs:
        - cp_food
        - cp_water
        - cp_fates
        - cp_air
      output: "actual_terminal_balance_and_gaps"
      source_ids: []
    - id: freight_sum
      applies_to: "freight"
      rule: "Each unique actual leg/load uses full packed wet cargo including food/ice/pack/support/equipment; use measured packed wet payload directly, or derive it from loaded vehicle gross mass minus matched non-cargo vehicle tare once. EACH quantity repeats actual count once; TOTAL unchanged; THAT-record share inside sum. Complete matched carrier OR exclusive actual own-fleet fuel/electricity/loading/holding/maintenance/full assets/species/receiver once. Zero cargo kg*km cannot carry necessary empty/positioning/return/failed duties: include actual matched complete coverage or completed native underlying duty once, never fictitious payload or output."
      inputs:
        - cp_freight
        - packed_wet_payload
        - distance
        - repeat_count
        - record_share
      output: "assigned_transport_duty"
      source_ids: []
    - id: asset_life
      applies_to: "assets; reusables"
      rule: "Enumerate actual asset/service consumers, nodes, life phases, stock/reporting/maintenance/replacement/termination and receiver periods. Use observed all-user life plus sourced compatible remaining service OR actual terminated total; never annual targetN/nameplate capacity/invented years. Actual land occupation area*time and evidenced from-state/to-state/event/date/area are native quantities, not Count. Provider-covered land/life is not repeated; actually complete excluded stages once."
      inputs:
        - cp_assets
        - cp_providers
      output: "actual_full_life_duty"
      source_ids: []
    - id: physical_output
      applies_to: "all product outputs"
      rule: "Complete pre-attribution ALL-OUTPUT ledger keeps each outputID/recipient/gate/state/handoff time/source and its own full UNNORMALIZED native quantity, including other meal/non-meal/asset/fluid handoffs. First distinguish independent subdivision from genuine joint products; document actual PCR-specific attribution decision/physical evidence/owner/lineage/allocation_stage. In target-allocated LCI, independent other meals/services are evidence-only, not extra co-products after resource assignment. A retained genuine joint output final exchange uses SELECTED actual physical amount / same positive profile N_target once, never resource target share; already-per-reference unchanged. Separate unallocated whole pool requires full inputs+all outputs and one designated attribution step. This output rule takes precedence over generic resource rule."
      inputs:
        - cp_outputs
        - cp_service
        - native_output_quantity
        - joint_selected_quantity
      output: "selected_output_quantity"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all exchanges"
      requirement: "Every actual concrete material/service/species state/type/direction/gate/nativeproperty/unit and support identities verified before final exchange. Count only supports Item(s), not food or service identity."
      evidence: "Actual detail/support and foreground record evidence"
    - id: gate_quality
      applies_to: "meal_set_supply"
      requirement: "Count only actual complete equivalent prepared meal-set supply received by the specified operator/galley after physical loading, required component/quality/quantity checks, actual order changes and acceptance/reversal reconciliation. Actual contract gate must be evidenced; public job pages are not signed receipts. Do not substitute prepared availability, scheduled meals, flights, passengers, trolley count, invoice or eaten mass."
      evidence: "cp_service; actual contract and loading receipt"
    - id: native_quality
      applies_to: "all protocols"
      requirement: "Every numeric operand own seven fields, honest zero/gap/state/uncertainty and compatible conversion."
      evidence: "Actual source and raw-field audit"
    - id: full_scope_quality
      applies_to: "all duties"
      requirement: "Include upstream actual food/material/utilities/losses and complete site/building/fitout/kitchen/vehicle/high-loader/refrigeration/equipment/reusable/textile manufacture-install-maintain-replace-EOL. Match every physical stage to one complete provider OR direct actual duty; missing stages must be actually completed and integrated once with native amount/state/source/time/owner/coverage/exclusions before complete-scope use. Invoice, lease or future plan is insufficient."
      evidence: "Completed coverage matrix and native stage evidence"
    - id: source_quality
      applies_to: "all source use"
      requirement: "Sources are qualitative route corroboration across actual operator sites, not one observed target inventory. No public signed target contract, generic factors/recipe/yield/temperature/lifetime/range asserted. Gaps restrict use."
      evidence: "Source actual extent and target applicability"
