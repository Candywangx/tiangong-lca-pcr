      applies_to: "all stages"
      rule: "Final product is operator-loaded prepared supply, not passenger served/eaten meal. Include all ACTUAL supplier-contract-owned postgate returns, collection, sorting, food/waste disposition, wash/cleaning and receivers in its numerator. Record actual operator-owned onboard holding/reheating/plating/serving responsibility separately; do not silently claim these completed or universal whole-flight passenger traction. A claim of passenger complete-meal service requires actual reviewed expanded stages and changed gate."
      source_ids:
        - gategroup-cook-current
        - gategroup-finalizer-current
        - gategroup-transport-current
        - gategroup-equipment-current
        - gategroup-wash-current
        - ekfc-airline-current
    - rule_id: exclusive_coverage
      applies_to: "all inputs assets providers"
      rule: "Include upstream actual food/material/utilities/losses and complete site/building/fitout/kitchen/vehicle/high-loader/refrigeration/equipment/reusable/textile manufacture-install-maintain-replace-EOL. Match every physical stage to one complete provider OR direct actual duty; missing stages must be actually completed and integrated once with native amount/state/source/time/owner/coverage/exclusions before complete-scope use. Invoice, lease or future plan is insufficient."
