  calculation_rules:
    - id: fulfilled_session_n
      applies_to: "camp_participant_session"
      rule: "N_target=count(unique actually fulfilled participant-session IDs after reversals in same declared package-version/duration/profile). Actual overnight+food+recreation gate and start/end/timezone/UTC-offset/DST evidence mandatory; decline of genuinely offered service does not automatically remove N. Partial outputs remain own scope; bookings/capacity not output."
      inputs:
        - cp_camp_sessions
      output: "Actual equivalent fulfilled participant-session Count"
      source_ids: []
    - id: target_pool_once
      applies_to: "all actual resource rows"
      rule: "assigned_target_quantity=direct actual target trace OR compatible raw_quantity*target_driver/all_consumer_driver, all_consumer_driver>0 and complete actual scope. Include necessary same-pool idle/failed/cancel/no-show in totals and actual real-output responsibility. per_reference_quantity=assigned_target_quantity/positive same-profile N_target ONCE; already-per-reference unchanged, N0 retain linked source/receiver/resolution."
      inputs:
        - "All applicable node-owned CPs"
        - cp_camp_sessions
      output: "Exclusive actual per-reference physical duty"
      source_ids: []
    - id: meal_provision_handoff
      applies_to: "camp_internal_meals; kitchen_meal_handoff"
      rule: "actual_transfer_quantity=count actual fulfilled provision covers/events under one actual occasion/participant/receiver gate with prepared-ready-held-available evidence and acceptance. Scheduled menu/bookings/capacity not proof. Same transferID/state/nativequantity/finalN on both sides once. Actual served/declined/refill/prepared/offered/as-served/remaining/plate native views independent; refill not new cover by default. No assumption count=foodmass or equal nutrition."
      inputs:
        - cp_camp_meal_receipts
        - cp_kitchen_meal_deliveries
      output: "Paired actual meal-provision service quantity per final camp reference"
      source_ids: []
    - id: zero_transfer_actual_resources
      applies_to: "zero actual meal handoff"
      rule: "When actual_transfer_quantity=0, do not transport burdens by zero exchange or invent positive output. Actual necessary camp-owned kitchen duties require completed sourced native resource supplement/aggregation once, same finalN, explicit original source/receiver/owner/coverage/excluded overlap. Unresolved duty blocks full-package use."
      inputs:
        - cp_camp_meal_receipts
        - cp_kitchen_meal_deliveries
        - cp_camp_providers
        - cp_kitchen_providers
      output: "Actually integrated retained kitchen responsibility"
      source_ids: []
    - id: food_stock_native
      applies_to: "ingredients/unused supplies"
      rule: "Per actual SKU/supplied state stock, S=opening+net_external_receipts-closing_including_recovery; receipts exclude actual packaging/container tare, not food moisture/bone/skin. Actual issues/internal returns cancel external-demand ledger. Gross S/N with matched unused return/N OUTPUT OR consumed(S-return)/N and OMIT same OUTPUT. Upstream losses retain burden; prepared surplus/plate or used fluids not unused-stock returns."
      inputs:
        - cp_kitchen_food_stocks
        - cp_kitchen_supplies
        - cp_camp_supplies
      output: "Actual supplied-state upstream demand and exclusive returns"
      source_ids: []
    - id: kitchen_batch_balance
      applies_to: "real recipe/preparation/cooking batch"
      rule: "Actual opening_WIP+net_ingredient_feed+actual_added_water+other_real_composition = actual_prepared_output+actual_separation_process_waste+independently_measured_vapour_or_other_release+closing_WIP+explicit_unknown. Same native compatible batch/state boundary; real internal rework cancels external inputs. No invented yield, residual-as-vapour, dry/wet substitution or missing-as-zero. Prepared output, meal-provision service, served mass, consumed estimate and plate return are different linked nonadditive stages."
      inputs:
        - cp_kitchen_recipes
        - cp_kitchen_food_stocks
        - cp_kitchen_meal_deliveries
        - cp_kitchen_fates
        - cp_kitchen_releases
      output: "Actual batch, WIP and downstream disposition closure"
      source_ids: []
    - id: water_state_conversion
      applies_to: "food/textile water evidence"
      rule: "Only SAME sample water-only w_wet=m_water/m_as_received and r_dry=m_water/m_nonwater imply w_wet=r_dry/(1+r_dry), percent first via actual percent_to_ratio_factor. m_nonwater=m_as_received*(1-w_wet). Every independent quantity/fraction/conversion unit/basis/method/state/sampletime/source required. LOD with other volatiles not water; washing-water/process-water food content distinct."
      inputs:
        - cp_kitchen_recipes
        - cp_camp_textiles
      output: "Compatible actual water/nonwater native conversion"
      source_ids: []
    - id: utility_actual
      applies_to: "camp/kitchen utilities"
      rule: "Compatible (register_close-register_open+register_adjustment)*meter_multiplier*conversion_factor OR actual interval_quantity*conversion_factor. Apply each factor once only if not already applied. Same-interval actual average power*elapsed_duration includes cycling/holding/standby, never nameplate/instantaneous or kWh multiplied again. Useful purchased heat/cooling and underlying provider fuel/plant exclusive; recipe and operational water distinct actual use."
      inputs:
        - cp_camp_utilities
        - cp_kitchen_utilities
        - cp_kitchen_recipes
      output: "Actual exclusive supplied utilities/native burn"
      source_ids: []
    - id: full_life_native
      applies_to: "camp/kitchen assets"
      rule: "Actual asset_native_quantity*supported dimensional driver_equivalence*job_used_driver/positive complete_lifetime_driver. complete_lifetime_driver=observed_all_user_driver+sourced_remaining_driver with actual alluser scope/termination/state/time/uncertainty/update. Include necessary idle real-output duty, all manufacture-install-maintain-actual replacements-EOL. AnnualN/capacity not lifetime; actual missing stages completed once, then same finalN once unless already normalized."
      inputs:
        - cp_camp_assets
        - cp_kitchen_assets
        - cp_camp_providers
        - cp_kitchen_providers
      output: "Complete-life actual asset service"
      source_ids: []
    - id: freight_record_share
      applies_to: "actual unique freight"
      rule: "assigned_freight=SUM(unique actual load-leg: actual payload_kg*actual distance_km*THAT_record_share). Share complete compatible users inside sum. Actual packed wet food/textile/contents/supports retained; vehicle gross subtracts ONLY noncargo vehicle tare. EACH repeated count once, TOTAL unchanged. Already covered provider/receiver/empty legs once. Then same positive N_target once unless already normalized; N0 and necessary failed duty retained."
      inputs:
        - cp_camp_freight
        - cp_kitchen_freight
      output: "Actual kg*km per camp reference"
      source_ids: []
    - id: fluid_disjoint_stock
      applies_to: "actual fluid supplies/fates"
      rule: "Each opening store/installed charge, new factory receipt, standalone receipt, OTHER receipt/exit, internal recovery/charge, retained closing, usable export, contained waste, measured release and unknown has disjoint actual lot-role membership. Factory new receipt not opening/OTHER, OTHER excludes named fates, internal transfers cancel. Supply topup/residual not release or zero. USED recovery export actual-state product without new-manufacture deduction/negative input/automatic credit; only actual UNUSED same-source/state substock matched return eligible consumed deduction/OMIT output."
      inputs:
        - cp_camp_fluids
        - cp_kitchen_fluids
        - cp_camp_assets
        - cp_kitchen_assets
      output: "Exclusive native fluid ledger"
      source_ids: []
    - id: actual_species
      applies_to: "camp/kitchen direct species"
      rule: "Species quantity=actual measured species quantity OR compatible actual activity*actual emission factor with exact species/particle/medium. Needed composition/fate/native gas temperature/pressure conversion only once with each own unit/basis/method/state/sampletime/source; full factor fractions not reapplied. Unknown stock/batch residual or odour not emission/zero. Water vapour air Elementary Mass; actual contained water/fluids Waste, not direct release."
      inputs:
        - cp_camp_releases
        - cp_kitchen_releases
        - cp_kitchen_recipes
      output: "Actual evidence-supported species amount"
      source_ids: []
