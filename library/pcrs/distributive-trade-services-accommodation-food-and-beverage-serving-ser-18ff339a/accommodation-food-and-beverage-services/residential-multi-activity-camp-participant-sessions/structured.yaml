    required_property_ref:
      name: "Count and independent Mass"
      uuid: ""
    required_unit: "Actual meal-provision covers/events Item(s), independent food kg"
    rule: "Both internal sides use same transferID/state/actual native service quantity/receiver scope and same positive N_target once. Actual prepared-ready-held-available service evidence, not merely planned menu or eaten food; served, declined, refills and masses remain independent. Count is not equal nutrition or food mass."
  - id: native_food_states
    applies_to: "actual ingredients/food/waste"
    required_property_ref:
      name: "Mass; actual composition water"
      uuid: ""
    required_unit: "kg actual as-received/prepared/as-served and independent dry/water bases"
    rule: "Supplied raw/prepared/cooked state, moisture/bone/skin and actual packaging tare distinct. Only water-only SAME sample w_wet=m_water/m_as_received and r_dry=m_water/m_nonwater imply w_wet=r_dry/(1+r_dry), percent first. Loss-on-drying with other volatiles is not water. No universal yield."
  - id: native_physical_conversion
    applies_to: "actual quantities/factors"
    required_property_ref:
      name: "Actual compatible property"
      uuid: ""
    required_unit: "Native mass/volume/density/energy/time/count and factor units"
    rule: "Every independent operand carries value/unit/basis/method/state/sampletime/source. EACH item amount uses actual count once; TOTAL unchanged. Density matches actual state and temperature; kWh, MJ and fuel/calorific kinds require actual supported conversion and not double application."
  - id: once_same_target
    applies_to: "all resources"
    required_property_ref:
      name: "Native row property and Count denominator"
      uuid: ""
    required_unit: "Physical resource per Item(s) actual participant-session"
    rule: "Assign actual target duty directly OR compatible actual quantity*target_driver/positive COMPLETE all_consumer_driver, then divide positive same-profile N_target once. Include necessary same-pool idle/failure burden with real-output responsibility. Already-per-reference unchanged; N0 retains linked source/receiver/resolution, unassigned blocks completeness."
  - id: asset_life_service
    applies_to: "assets/reusables/providers"
    required_property_ref:
      name: "Actual native asset and lifetime driver"
      uuid: ""
    required_unit: "Compatible job/alluser observed+sourced remaining full-life units"
