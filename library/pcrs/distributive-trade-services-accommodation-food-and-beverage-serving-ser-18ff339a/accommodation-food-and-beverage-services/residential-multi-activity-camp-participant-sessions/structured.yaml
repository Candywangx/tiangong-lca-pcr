    type: "handbook"
    reference: "PGL Multi-Activity Camps current operator page, accessed2026-10-20, programme examples and FAQ inclusions. https://adventureholidays.pgl.co.uk/multi-activity-camps/"
    used_for: "Qualitative actual residential general multi-activity package includes accommodation/meals/activities/evening programme; variable examples not default nights/ages/meal counts/portion/lifetime."
