validation_rules:
  - rule_id: fulfilled_equivalent_bundle
    applies_to: "final reference"
    rule: "Verify actual overnight+food+recreation general multi-activity package and on-site preparation/cooking; exclude specialist sports instruction. Actual unique fulfilled same-package-version/duration/profile N after reversals, times/UTC offsets/DST and servicegate. Declines of real provision not automatic cancellation; booking/capacity not output."
    source_ids:
      - unsd-cpc3-2025
      - pgl-multiactivity-current
  - rule_id: paired_provision_not_consumption
    applies_to: "internal exchange"
    rule: "Both internal sides same transferID/state/nativeamount/receiver/occasion and same finalN once. Actual prepared-ready-held-available gate evidence, not planned menu/bookings/capacity. Served/declined/refills/foodmass/remaining/plate independent; no equalnutrition assumption. Zero handoff requires actually completed exclusive camp-owned resource integration, never zero exchange erasure or fictionalpositive output."
    source_ids:
      - pgl-menus-current
      - pgl-chefs-current
  - rule_id: food_native_closure
    applies_to: "food stocks/process/fates"
    rule: "Verify raw/prepared/cooked supplied-state net food vs packaging tare vs food moisture/bone/skin; original upstream losses remain. Actual batch/WIP/rework balance keeps explicitunknown, independent vapour not residual. Separate preparation waste/unserved discard/plate/packaging/cleaning; genuine co-collection one measured stream with nonadditive component/origin views. Gross/consumed UNUSED return representation exclusive, useful transfer actual accepted usable state."
    source_ids:
      - pgl-chef-job
  - rule_id: staff_partials_idle_allusers
    applies_to: "all allocation"
    rule: "Camp-support staffmeal duties retain actual camp responsibility. Real other sessions/visitors/partial deliveries have own physical responsibility, not automatic discarded or blindly all charged to complete sessions. Necessary same-pool failed/cancel/no-show/idle in total and actual real-output responsibility; allusers drivers native/complete. Positive exact-profile N once, already-normalized unchanged; N0/crossperiod source/receiver/resolution, unassigned blocks completeness."
    source_ids:
      - pgl-chefs-current
  - rule_id: full_life_provider_complete
    applies_to: "capital/services"
    rule: "Complete building/siteworks/fitout/FF&E/kitchen/activity/reusable/linen life observed+sourced remaining alluser productive-equivalent driver/termination/native evidence, not annualN/capacity. Full provider OR actual covered underlying duties; missing actual stages must be actually completed integrated once with source/native quantity/state/time/owner/coverage."
    source_ids: []
  - rule_id: native_freight_utility_fluid
    applies_to: "resource calculations"
    rule: "Meter resets/factors/interval-average duty/conversions apply once, fuel stock not burn, recipewater not operatingwater duplicate. Unique actual packed load-leg with EACH/TOTAL count once and THAT-record share inside SUM/N once. Fluid disjoint opening/newfactory/standalone/OTHER/internal/closing/fates; USED export no manufactureoffset/negativeinput/credit. Exact contained Waste vs actual Elementary species/medium, vapour air Mass; missing residual not release/zero."
    source_ids: []
  - rule_id: honest_evidence_identity
    applies_to: "all methods"
    rule: "Actual semantic identity/support unresolved remains explicit before final use; checker pass not external verification or publication readiness. No invented UUID/ranges/factors/yields/recipes/portions/lifetimes. Source examples do not become default physical or legal rules. Missing actual quantity/coverage/lifetime/medium/resolution blocks complete use."
    source_ids:
      - pgl-code-practice-2025
      - pgl-menus-current
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and completeness review"
  downstream_use: "One actually fulfilled equivalent residential general multi-activity participant-session with onsite food provision and full actual physical responsibility"
  allowed_use: "Actual overnight-food-recreation package with actual onsite preparation/cooking, declared programme/package-version/duration/profile, actual provision acceptance and two-node exclusive actual inventory"
  excluded_use: "Specialist sports instruction/day-only/lodging-only/capacity/bookings; unequal sessions pooled without qualifiers; food mass or nutrition inferred from count; missing kitchen responsibility via zero transfer; uncompleted asset/provider/pool/carry duties"
  required_metadata: "All17 reference qualifiers; actual participant/package/duration/timestamps/DST/acceptance/reversals/partials; actual prepared-ready-held-available mealservice/native food state/stock/batch/fates/transfer; allguest-supportstaff-visitor-othersession duties; fullasset observed+sourced remaining life/native drivers/provider exactcoverage and completed actual integration"
  required_quality_disclosure: "Actual source date/site/route/profile applicability, measured versus estimated native quantities, unresolved concrete identities/support/quantity/range/medium, unassigned alluser/carry/lifetime/provider/zero-handoff resources and uncertainty/sensitivity/update; no missing-as-zero or checker-ready publication assumption"
  update_trigger: "Changed package/duration/profile/programmepurpose/deliverygate/actual recipe or cateringroute, mealservice transfer or decline handling, actual shareduser/staff responsibility, independent processing/preservation/conversion/laundry/watertreatment, fullasset/provider lifetime/coverage/fate/nativeconversion/identity evidence"
