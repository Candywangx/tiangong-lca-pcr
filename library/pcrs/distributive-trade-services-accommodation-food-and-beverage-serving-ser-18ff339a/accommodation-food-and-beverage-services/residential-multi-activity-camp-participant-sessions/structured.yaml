    type: "handbook"
    reference: "PGL Chefs current recruitment page, accessed2026-10-20, Marchants Hill team prepares/serves guests and colleagues. https://jobs.pgl.co.uk/chefs/"
    used_for: "Primary actual on-site preparation/serving and staff-consumer scope; not proof of generic recipe/yield or universal external service."
  - id: "pgl-chef-job"
    type: "handbook"
    reference: "PGL Chef job description, undated document, first page duties; accessed2026-10-20. https://www.pgl.co.uk/Files/DocumentManagerDocuments/Recruitment/Job%20Descriptions/ChefFR23.pdf"
    used_for: "Actual storage/preparation/cooking/serving, recipes/portions and kitchen/dining cleanup for guests/staff/visitors; filename not a publicationdate or currentlegal guarantee."
  - id: "pgl-menus-current"
    type: "handbook"
    reference: "PGL Menus and Mealtimes current operator page, accessed2026-10-20. https://adventureholidays.pgl.co.uk/menus-and-mealtimes/"
    used_for: "Qualitative varied meals/selfservice/refills and possible provision greater than amount eaten support separate actual provision and consumption views; no default3meals/day, portion, nutritional equivalence or legal temperature."
  - id: "pgl-code-practice-2025"
    type: "handbook"
    reference: "PGL Code of Practice, coverJune2025; catering/accommodation/recreation sections, accessed2026-10-20. https://www.pgl.co.uk/Files/DocumentManagerDocuments/AdventureUK/PGL-Code-of-Practice.pdf"
    used_for: "Dated qualitative real catering/fullboard dining, lodging and recreation duties. Separate catering facilities alone do not prove thirdparty outsourcing; no2026 legal or universal operating/factor commitment."
