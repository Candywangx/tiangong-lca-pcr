allocation_rules:
  - rule_id: real_outputs_not_components
    applies_to: "camp/kitchen outputs"
    rule: "Final combined camp components are not co-products that remove lodging, meals or activities from the bundle. Actual other sessions/visitors/accepted usable food are real output responsibilities. Camp-support staff meals trace to actual camp support, not automatically an external output to delete. Actual partial service has its own physical scope; do not classify every failure as other product or charge every true partial product blindly to complete sessions."
    source_ids: []
  - rule_id: complete_pool_responsibility
    applies_to: "all resource pools"
    rule: "Actual direct trace OR compatible actual quantity*target_driver/positive COMPLETE all_consumer_driver. All actual guests, support staff, visitors, other programmes and periods included. Necessary same-pool idle/standby/cancel/no-show/failed work stays in total and actual responsible real outputs; nominal capacity or simply recording unassigned ledger cannot erase it. Unknown responsibility blocks complete package."
    source_ids: []
  - rule_id: once_same_profile
    applies_to: "all rows"
    rule: "After real target responsibility assignment, divide positive N_target for exactly same package-version/duration/profile once. Already-per-reference unchanged; N0 retained with source/receiving/resolution links and no division. Different profiles need own quantities/denominators, not unqualified average sessions."
    source_ids: []
  - rule_id: internal_meal_pair
    applies_to: "two-node handoff"
    rule: "Same actual transferID, provision state, real participant/occasion/receiver gate, native quantity and same finalN on kitchen_meal_handoff and camp_internal_meals. Kitchen inventory attributed through actual internal service once. Do not add a purchased complete meal for those same duties or require internal meal amount=1 camp session."
    source_ids: []
  - rule_id: zero_meal_real_integration
    applies_to: "zero actual internal output"
    rule: "Zero handoff conveys no kitchen burden. Actually needed camp-owned kitchen resources must be actually integrated once via exclusive sourced resource supplement/aggregation with native quantity/source/receiver/time/owner/coverage. No invented positive meal; incomplete integration blocks complete package."
    source_ids: []
  - rule_id: full_life_alluser
    applies_to: "assets/providers"
    rule: "Full building/fitout/FF&E/kitchen/activity/reusable life includes manufacture/install/maintain/actual replacement/EOL using compatible job/complete alluser lifetime driver, observed+sourced remaining/termination/uncertainty/update. Necessary idle belongs to real pools; annualN or nominal capacity not lifetime. Full provider OR underlying covered duties; actual missing stages completed once before use."
    source_ids: []
  - rule_id: stock_and_returns
    applies_to: "ingredients/materials/fuel"
    rule: "Same-stock S=opening+net external receipts-closing including retained recovery. Gross S/N input plus matched UNUSED same-source/state return/N output OR consumed (S-return)/N input and OMIT matched output. No double deduction, loss removal, recovered USED-fluid offset, unrelated stock netting or automatic avoided-product credit."
    source_ids: []
  - rule_id: receiver_nonadditive
    applies_to: "food/fluids/assets/fates"
    rule: "Actual distinct received streams expand by substance/state/receiver. One measured genuine co-collected mixture with nonadditive component/origin views; never sum both. Whole/part/retained contents/capture/free liquid distinct. Identical fullasset/provider receiver transport/treatment once; useful transfers require actual accepted usable state, not recycling/donation labels."
    source_ids: []
