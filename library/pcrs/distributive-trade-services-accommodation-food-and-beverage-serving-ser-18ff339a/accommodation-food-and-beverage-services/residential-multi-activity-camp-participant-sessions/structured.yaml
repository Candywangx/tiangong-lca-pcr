    - id: actual_identity_support
      applies_to: "all exchanges"
      requirement: "Expand every actual ingredient, utility, asset/service, receiver stream and exact species/medium by real supplied-state identity/property/unit; unresolved umbrella does not authorize mixed or dummy UUID. Count support proves unit only, not camp-session or meal-service identity."
