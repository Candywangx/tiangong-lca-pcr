  calculation_rules:
    - id: fulfilled_session_n
      applies_to: "camp_participant_session"
      rule: "N_target=count(unique actually fulfilled participant-session IDs after reversals in same declared package-version/duration/profile). Actual overnight+food+recreation gate and start/end/timezone/UTC-offset/DST evidence mandatory; decline of genuinely offered service does not automatically remove N. Partial outputs remain own scope; bookings/capacity not output."
      inputs:
        - cp_camp_sessions
      output: "Actual equivalent fulfilled participant-session Count"
      source_ids: []
    - id: target_pool_once
      applies_to: "all actual resource rows"
      rule: "assigned_target_quantity=direct actual target trace OR compatible raw_quantity*target_driver/all_consumer_driver, all_consumer_driver>0 and complete actual scope. Include necessary same-pool idle/failed/cancel/no-show in totals and actual real-output responsibility. per_reference_quantity=assigned_target_quantity/positive same-profile N_target ONCE; already-per-reference unchanged, N0 retain linked source/receiver/resolution."
      inputs:
        - "All applicable node-owned CPs"
        - cp_camp_sessions
      output: "Exclusive actual per-reference physical duty"
      source_ids: []
    - id: meal_provision_handoff
      applies_to: "camp_internal_meals; kitchen_meal_handoff"
      rule: "actual_transfer_quantity=count actual fulfilled provision covers/events under one actual occasion/participant/receiver gate with prepared-ready-held-available evidence and acceptance. Scheduled menu/bookings/capacity not proof. Same transfer ID/state/native quantity/final N on both sides once. Actual served/declined/refill/prepared/offered/as-served/remaining/plate native views independent; refill not new cover by default. No assumption count=food mass or equal nutrition."
      inputs:
        - cp_camp_meal_receipts
        - cp_kitchen_meal_deliveries
      output: "Paired actual meal-provision service quantity per final camp reference"
      source_ids: []
    - id: zero_transfer_actual_resources
      applies_to: "zero actual meal handoff"
      rule: "When actual_transfer_quantity=0, do not transport burdens by zero exchange or invent positive output. Actual necessary camp-owned kitchen duties require completed sourced native resource supplement/aggregation once, same finalN, explicit original source/receiver/owner/coverage/excluded overlap. Unresolved duty blocks full-package use."
      inputs:
        - cp_camp_meal_receipts
        - cp_kitchen_meal_deliveries
        - cp_camp_providers
        - cp_kitchen_providers
      output: "Actually integrated retained kitchen responsibility"
      source_ids: []
    - id: food_stock_native
      applies_to: "ingredients/unused supplies"
      rule: "Per actual SKU/supplied state stock, S=opening+net_external_receipts-closing_including_recovery; receipts exclude actual packaging/container tare, not food moisture/bone/skin. Actual issues/internal returns cancel external-demand ledger. Gross S/N with matched unused return/N OUTPUT OR consumed(S-return)/N and OMIT same OUTPUT. Upstream losses retain burden; prepared surplus/plate or used fluids not unused-stock returns."
      inputs:
        - cp_kitchen_food_stocks
        - cp_kitchen_supplies
        - cp_camp_supplies
      output: "Actual supplied-state upstream demand and exclusive returns"
      source_ids: []
    - id: kitchen_batch_balance
      applies_to: "real recipe/preparation/cooking batch"
      rule: "Actual opening_WIP+net_ingredient_feed+actual_added_water+other_real_composition = actual_prepared_output+actual_separation_process_waste+independently_measured_vapour_or_other_release+closing_WIP+explicit_unknown. Same native compatible batch/state boundary; real internal rework cancels external inputs. No invented yield, residual-as-vapour, dry/wet substitution or missing-as-zero. Prepared output, meal-provision service, served mass, consumed estimate and plate return are different linked nonadditive stages."
      inputs:
        - cp_kitchen_recipes
        - cp_kitchen_food_stocks
        - cp_kitchen_meal_deliveries
        - cp_kitchen_fates
        - cp_kitchen_releases
      output: "Actual batch, WIP and downstream disposition closure"
      source_ids: []
    - id: water_state_conversion
      applies_to: "food/textile water evidence"
      rule: "Only SAME sample water-only w_wet=m_water/m_as_received and r_dry=m_water/m_nonwater imply w_wet=r_dry/(1+r_dry), percent first via actual percent_to_ratio_factor. m_nonwater=m_as_received*(1-w_wet). Every independent quantity/fraction/conversion unit/basis/method/state/sampling time/source required. LOD with other volatiles not water; washing-water/process-water food content distinct."
      inputs:
        - cp_kitchen_recipes
        - cp_camp_textiles
      output: "Compatible actual water/nonwater native conversion"
      source_ids: []
    - id: utility_actual
      applies_to: "camp/kitchen utilities"
      rule: "Compatible (register_close-register_open+register_adjustment)*meter_multiplier*conversion_factor OR actual interval_quantity*conversion_factor. Apply each factor once only if not already applied. Same-interval actual average power*elapsed_duration includes cycling/holding/standby, never nameplate/instantaneous or kWh multiplied again. Useful purchased heat/cooling and underlying provider fuel/plant exclusive; recipe and operational water distinct actual use."
      inputs:
        - cp_camp_utilities
        - cp_kitchen_utilities
        - cp_kitchen_recipes
      output: "Actual exclusive supplied utilities/native burn"
      source_ids: []
    - id: full_life_native
      applies_to: "camp/kitchen assets"
      rule: "Actual asset_native_quantity*supported dimensional driver_equivalence*job_used_driver/positive complete_lifetime_driver. complete_lifetime_driver=observed_all_user_driver+sourced_remaining_driver with actual all-user scope/termination/state/time/uncertainty/update. Include necessary idle real-output duty, all manufacture-install-maintain-actual replacements-EOL. AnnualN/capacity not lifetime; actual missing stages completed once, then same finalN once unless already normalized."
      inputs:
        - cp_camp_assets
        - cp_kitchen_assets
        - cp_camp_providers
        - cp_kitchen_providers
      output: "Complete-life actual asset service"
      source_ids: []
    - id: freight_record_share
      applies_to: "actual unique freight"
      rule: "assigned_freight=SUM(unique actual load-leg: actual payload_kg*actual distance_km*THAT_record_share). Share complete compatible users inside sum. Actual packed wet food/textile/contents/supports retained; vehicle gross subtracts ONLY non-cargo vehicle tare. EACH repeated count once, TOTAL unchanged. Already covered provider/receiver/empty legs once. Then same positive N_target once unless already normalized; N0 and necessary failed duty retained."
      inputs:
        - cp_camp_freight
        - cp_kitchen_freight
      output: "Actual kg*km per camp reference"
      source_ids: []
    - id: fluid_disjoint_stock
      applies_to: "actual fluid supplies/fates"
      rule: "Each opening store/installed charge, new factory receipt, standalone receipt, OTHER receipt/exit, internal recovery/charge, retained closing, usable export, contained waste, measured release and unknown has disjoint actual lot-role membership. Factory new receipt not opening/OTHER, OTHER excludes named fates, internal transfers cancel. Supply topup/residual not release or zero. USED recovery export actual-state product without new-manufacture deduction/negative input/automatic credit; only actual UNUSED same-source/state substock matched return eligible consumed deduction/OMIT output."
      inputs:
        - cp_camp_fluids
        - cp_kitchen_fluids
        - cp_camp_assets
        - cp_kitchen_assets
      output: "Exclusive native fluid ledger"
      source_ids: []
    - id: actual_species
      applies_to: "camp/kitchen direct species"
      rule: "Species quantity=actual measured species quantity OR compatible actual activity*actual emission factor with exact species/particle/medium. Needed composition/fate/native gas temperature/pressure conversion only once with each own unit/basis/method/state/sampling time/source; full factor fractions not reapplied. Unknown stock/batch residual or odour not emission/zero. Water vapour air Elementary Mass; actual contained water/fluids Waste, not direct release."
      inputs:
        - cp_camp_releases
        - cp_kitchen_releases
        - cp_kitchen_recipes
      output: "Actual evidence-supported species amount"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity_support
      applies_to: "all exchanges"
      requirement: "Expand every actual ingredient, utility, asset/service, receiver stream and exact species/medium by real supplied-state identity/property/unit; unresolved umbrella does not authorize mixed or dummy UUID. Count support proves unit only, not camp-session or meal-service identity."
      evidence: "Actual native site records and candidate/detail/support verification, explicit unresolved use limits"
    - id: native_operands
      applies_to: "all calculations"
      requirement: "Each independent operand has value/unit/basis/method/state/sampletime/source including food components, wet/dry/water, density-temperature, each driver/lifetime phase, gas conversions and stock roles. Unknown/incompatible data block calculation, not zero. Actual CP fields are native single-node record keys."
      evidence: "22 node-owned CPs and actual raw source records"
    - id: complete_stage_and_pool
      applies_to: "all responsibilities"
      requirement: "Actual alluser guest/supportstaff/visitor/otherprogramme records, necessary idle/failure duties, full asset/provider stages and actual completed missing-stage/zero-handoff integration. True partial output keeps own scope; unassigned stages/shares/carry mean incomplete final package."
      evidence: "Source/receiver/owner/quantity/state/time/coverage and resolution links"
    - id: range_limits
      applies_to: "every card"
      requirement: "Row-specific Range evidence needs require actual quantity/state/basis/coverage evidence, not a universal numeric interval. A real compatible empirical guardrail needs independent source/population/comparison; same-record min/max is not independent validation. Missing range is disclosed, never invented recipe/yield/portion/lifetime benchmark."
      evidence: "Actual site-specific measurements and independently matched evidence only"
    - id: source_limits
      applies_to: "operator sources"
      requirement: "UNSD classification and PGL qualitative actual route evidence are not emissions, yields, safefood/legal thresholds, default duration/meal/day portions or assetlife. Actual site-specific applicability, evidence dates, measured/estimated portions and uncertainty/sensitivity/update disclosed."
      evidence: "Six bounded sources and actual operational records"
validation_rules:
  - rule_id: fulfilled_equivalent_bundle
    applies_to: "final reference"
    rule: "Verify actual overnight+food+recreation general multi-activity package and on-site preparation/cooking; exclude specialist sports instruction. Actual unique fulfilled same-package-version/duration/profile N after reversals, times/UTC offsets/DST and servicegate. Declines of real provision not automatic cancellation; booking/capacity not output."
    source_ids:
      - unsd-cpc3-2025
      - pgl-multiactivity-current
  - rule_id: paired_provision_not_consumption
    applies_to: "internal exchange"
    rule: "Both internal sides same transferID/state/nativeamount/receiver/occasion and same finalN once. Actual prepared-ready-held-available gate evidence, not planned menu/bookings/capacity. Served/declined/refills/foodmass/remaining/plate independent; no equalnutrition assumption. Zero handoff requires actually completed exclusive camp-owned resource integration, never zero exchange erasure or fictionalpositive output."
    source_ids:
      - pgl-menus-current
      - pgl-chefs-current
  - rule_id: food_native_closure
    applies_to: "food stocks/process/fates"
    rule: "Verify raw/prepared/cooked supplied-state net food vs packaging tare vs food moisture/bone/skin; original upstream losses remain. Actual batch/WIP/rework balance keeps explicitunknown, independent vapour not residual. Separate preparation waste/unserved discard/plate/packaging/cleaning; genuine co-collection one measured stream with nonadditive component/origin views. Gross/consumed UNUSED return representation exclusive, useful transfer actual accepted usable state."
    source_ids:
      - pgl-chef-job
  - rule_id: staff_partials_idle_allusers
    applies_to: "all allocation"
    rule: "Camp-support staffmeal duties retain actual camp responsibility. Real other sessions/visitors/partial deliveries have own physical responsibility, not automatic discarded or blindly all charged to complete sessions. Necessary same-pool failed/cancel/no-show/idle in total and actual real-output responsibility; allusers drivers native/complete. Positive exact-profile N once, already-normalized unchanged; N0/crossperiod source/receiver/resolution, unassigned blocks completeness."
    source_ids:
      - pgl-chefs-current
  - rule_id: full_life_provider_complete
    applies_to: "capital/services"
    rule: "Complete building/siteworks/fitout/FF&E/kitchen/activity/reusable/linen life observed+sourced remaining alluser productive-equivalent driver/termination/native evidence, not annualN/capacity. Full provider OR actual covered underlying duties; missing actual stages must be actually completed integrated once with source/native quantity/state/time/owner/coverage."
    source_ids: []
  - rule_id: native_freight_utility_fluid
    applies_to: "resource calculations"
    rule: "Meter resets/factors/interval-average duty/conversions apply once, fuel stock not burn, recipewater not operatingwater duplicate. Unique actual packed load-leg with EACH/TOTAL count once and THAT-record share inside SUM/N once. Fluid disjoint opening/newfactory/standalone/OTHER/internal/closing/fates; USED export no manufactureoffset/negativeinput/credit. Exact contained Waste vs actual Elementary species/medium, vapour air Mass; missing residual not release/zero."
    source_ids: []
  - rule_id: honest_evidence_identity
    applies_to: "all methods"
    rule: "Actual semantic identity/support unresolved remains explicit before final use; checker pass not external verification or publication readiness. No invented UUID/ranges/factors/yields/recipes/portions/lifetimes. Source examples do not become default physical or legal rules. Missing actual quantity/coverage/lifetime/medium/resolution blocks complete use."
    source_ids:
      - pgl-code-practice-2025
      - pgl-menus-current
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and completeness review"
  downstream_use: "One actually fulfilled equivalent residential general multi-activity participant-session with onsite food provision and full actual physical responsibility"
  allowed_use: "Actual overnight-food-recreation package with actual onsite preparation/cooking, declared programme/package-version/duration/profile, actual provision acceptance and two-node exclusive actual inventory"
  excluded_use: "Specialist sports instruction/day-only/lodging-only/capacity/bookings; unequal sessions pooled without qualifiers; food mass or nutrition inferred from count; missing kitchen responsibility via zero transfer; uncompleted asset/provider/pool/carry duties"
  required_metadata: "All17 reference qualifiers; actual participant/package/duration/timestamps/DST/acceptance/reversals/partials; actual prepared-ready-held-available mealservice/native food state/stock/batch/fates/transfer; allguest-supportstaff-visitor-othersession duties; fullasset observed+sourced remaining life/native drivers/provider exactcoverage and completed actual integration"
  required_quality_disclosure: "Actual source date/site/route/profile applicability, measured versus estimated native quantities, unresolved concrete identities/support/quantity/range/medium, unassigned alluser/carry/lifetime/provider/zero-handoff resources and uncertainty/sensitivity/update; no missing-as-zero or checker-ready publication assumption"
  update_trigger: "Changed package/duration/profile/programmepurpose/deliverygate/actual recipe or cateringroute, mealservice transfer or decline handling, actual shareduser/staff responsibility, independent processing/preservation/conversion/laundry/watertreatment, fullasset/provider lifetime/coverage/fate/nativeconversion/identity evidence"
