  unresolved_flow_identities:
    - row_id: roasted_coffee
      reason: Initial plus one supported refinement returned coffee concentrate,
        instant coffee, green beans and/or wet parchment coffee. None
        establishes solid roasted coffee supplied for espresso extraction; these
        states are not relabelled.
    - row_id: fulfilled_hot_espresso_drink
      reason: The counted physical service or internal prepared-food handoff is not
        verified by a building/equipment/material/food mass flow or an unrelated
        service. Preserve the real unit, service profile and actual handover; no
        identity is selected from search rank.
    - row_id: useful_spent_grounds
      reason: The physical source-matched material, its new/used/recovered state and
        accepted useful recipient must identify each actual transfer. No raw/new
        material UUID, avoided product or unidentified co-product replaces this
        conditional useful-output/return requirement.
    - row_id: grounds_waste
      reason: Actual edible/inedible/preparation/cooking/extraction residue identity
        and receiver must be retained. Generic human-food loss does not
        establish an exact match for bones/peels/spent oils/coffee grounds or
        grounds-maintenance material; do not infer a mixture or food fraction.
