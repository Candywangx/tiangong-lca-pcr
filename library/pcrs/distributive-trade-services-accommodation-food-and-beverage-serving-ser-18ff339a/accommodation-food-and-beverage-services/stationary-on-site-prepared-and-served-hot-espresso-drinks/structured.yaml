          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual operating stationary onsite barista establishment, declared received roasted-coffee/additions/water state and real preparation/presentation/recipient duty records |\n| starting_condition_role | Real preparation/service and complete full-life responsibility; existing/leased/customer-supplied assets not burden-free |\n| product_classification_scope | Narrower standalone hot espresso-based beverage serving within63400; no full leaf, meal-related or entertainment coverage claimed |\n| recursive_input_rule | Never purchase the same final drink service as its own input. Actual coffee/milk/components inherit upstream manufacture once; internal old-state stock/returns genealogy, not new supply. Actual complete complementary provider substitutes exactly covered stages only |\n| upstream_dataset_requirement | Complete actual supply production/losses, energy/water/material/providers/receivers and full asset/reusable/site/land manufacture-install-maintain-replace-end-of-life. Actually missing exclusive stages completed integrated once with native source/quantity/state/time/owner/coverage/exclusion before full-chain use |\n| disclosure | Actual equivalent recipe/portion/presentation/service gate and hot state, all outputs/users/periods, coffee/grounds/milk/water/steam stocks/fates, actual provider/asset/land/receiver coverage and N0 responsibility, identity/source/numeric gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| physical_route | espresso_service | One real stationary barista node owns actual composition inputs, onsite grinding/extraction/thermal milk treatment where actual, formulation, presentation/serving and cleanup. Coffee/water before extraction become actual brewed liquid plus spent wet grounds and actual losses; milk/alternatives before steaming become actual hot/foamed state with independent condensate/retention/loss records. Enumerate EVERY actual composition input role, exact recipe/version and before/after state; no forced milk/shot/ingredient amount or artificial plant. | costa-coffees-current; starbucks-espresso-2025; costa-allergens-current |\n| presentation_gate | espresso_service | Actual prepared hot liquid before presentation reaches declared recipient gate in actual supplied mug/customer cup/takeaway cup with actual required ingredients/portion/hot state. Record packaging contact/thermal/label/reuse roles, rejects/unused/used returns and end-of-use owners/receivers. Package presentation remains in actual node; supply/receiver transport is a separately declared duty, never implied last mile or package manufacture repeated per reusable use. | costa-cups-current; costa-allergens-current |\n| exclusive_coverage | all duties | Include actual upstream coffee/milk/additions/water/material/losses, operational readiness/cleaning/logistics and full assets/reusables/land/receivers. One actual complete physically matched provider OR exclusive direct stages; each actually missing stage must be completed integrated once with source/native quantity/state/time/owner/coverage/exclusions before complete-chain use. No invoice/outsourcing label, lease, customer-owned asset or future supplement erases real duty. |  |\n| stock_roles | actual input stocks and returns | As-received net removes only tare before outbound returns. Gross drawn S=attributed opening+inbound-closing plus actually paired responsibility transfers. Choose S input+matched UNUSED output OR input (S-UNUSED) and omit output, never both. USED return/recovery/dirty-item return keeps original burden and adds only actual new work/transport/wash; no new manufacture purchase, virgin deduction or automatic avoided credit. Internal same-node stocks/transfers are genealogy, not external exchanges. |  |\n| water_terminal | all water and liquid interfaces | Actual opening/closing water stocks are not meter readings. Intrinsic coffee/milk/addition water arrives within those actual material inputs, never as additional external water; keep its own nonadditive parent-source link. Trace actual supply/abstraction, water conveyed within actual coffee/milk/addition parent inputs and paired transfers to exclusive external terminal wastewater/direct liquid/vapour, water conveyed in actual exported drink/grounds/other material parent outputs, and actual closing-stock membership. Count each parent-contained intrinsic input or terminal-export water quantity ONCE in conservation with actual parent input/export/recipient/gate/state/time links; no extra material exchange. Steam condensed INTO drink is retained water content; purge-to-drain enters actual wastewater, purge-toair only actual independently evidenced vapour. Extraction/recipe/enduse/cleaning solution, drink/grounds moisture, internal fill/transfer and duplicate receiver content are nonadditive audits, not ADDITIONAL exchanges. An actual external parent drink/grounds/material handoff still conveys its water across the terminal boundary and enters the water audit once; only internal/content duplicate views are excluded from additive closure. Unknown balance is unresolved, never emission or zero. |  |\n| cleaning_roles | cleaning and actual materials | Actual supplied concentrate/formulated detergent is one material input. Prepared solution mass, active substance and dilution water each have own measured quantity/basis/state/source and nonadditive parent link; supplied-water dilution not purchased again. Capture actual steamarm purge/wipe, group/portafilter rinse/backflush and actual discarded test drink only when actual, plus jugs/mugs/cloth/working-area cleanup and actual water/chemical/energy/waste roles; no universal cleaning recipe/time. | costa-allergens-current; lamarzocco-commercial-route |\n| fluid_roles | equipment fluids | Installed/stored/recovered roles are mutually exclusive: recovered retained fluid belongs in actual installed/stored closing membership, not another additive stock. Factory-new entry absent opening is equipment content, not another independent fluid purchase. Track each source/charge/otherreceipt/paired-transfer/receiver native quantity and every useful/waste/nonair/whole-equipment retained-content exit. Whole/component content views nonadditive. Independently evidence actual air release; unknown residual is not leakage or avoided-new credit. |  |\n| full_life | assets reusables providers land | Enumerate actual owned/leased/customer/provider site/building/fitout/bar/machine/grinder/refrigeration/filter/wash/mug/jug/utensil/textile and all actual consumers/periods. Manufacture-install-maintain-actual replacement-end-of-life is complete observed history plus sourced compatible remaining use OR actual terminated total. Annual targetN, nameplate capacity or invented years never establish full life. Actual covered land/receivers not repeated; missing actual stages completed once. |  |\n| land_native | land_occupation; land_transformation_from; land_transformation_to | Actual uncovered occupation is native area*time INPUT; actual transformation FROM prior class is native area INPUT and TO resulting class native area OUTPUT, paired by real event/site/time/owner/source and independently compatible quantities. Actual coverage matrix distinguishes provider/asset-covered identical nonadditive views. No Product Count proxy, annual presumed transformation or omitted conditional inventory interface. |  |\n| species_medium | all elementary and waste interfaces | Actual substance/species/form/reporting basis/particle size and receiving medium determine each elementary identity; source/destination gate determines contained Waste versus direct Elementary. No generic air/water/soil pollutant UUID, oxygen-demand equivalence, wholefluid-loss emission or residual-as-CO2. Actual concrete property/unit/source verification required. |  |\n| scope_route | espresso_service | Selected method is stationary onsite standalone HOT espresso-based service, not beverage inside a completed meal package, cold/tea/filter/vending/sealed retail/alcoholic/entertainment/moving/offsite service or whole lodging/camp/passenger bundle. Real additional industrial production/treatment needs reviewed route/module expansion before use; ordinary actual filtering/heating/holding/refrigerating/washing duties remain included. Primary pages are qualitative product/route examples, not target recipes, legal safety limits, numeric factors, quantities or equipment identities. | unsd-cpc3-2025; costa-coffees-current; starbucks-espresso-2025 |\n\n"
