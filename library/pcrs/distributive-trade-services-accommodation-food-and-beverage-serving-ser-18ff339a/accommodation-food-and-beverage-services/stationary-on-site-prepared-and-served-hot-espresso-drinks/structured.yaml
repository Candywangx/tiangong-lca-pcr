allocation_rules:
  - rule_id: resource_once
    applies_to: "all resource duties"
    rule: "Independent process subdivision/direct physical trace first. An already target-attributed resource TOTAL is not attributed again; it still divides N_target once. For each actual shared record, native quantity*target_driver/positive COMPLETE all_consumer_driver once, then sum; every actual other drink/meal/staff/customer/nonfood/building user and period included. Necessary idle/readiness/failed/cancelled/closed/N0 duties stay in real responsible pool with source/carry/receiving/finalresolution. Assigned target TOTAL divides same positive N_target once; only already-per-reference unchanged. Missing owner/denominator/actual integration blocks completeness."
    source_ids: []
  - rule_id: freight_once
    applies_to: "supply_receiver_freight"
    rule: "Each unique actual leg/load includes wet product plus pack/support/equipment; remove only noncargo vehicle tare. Sum actual tonnes*km*(actual repeat_count only EACH; TOTAL unchanged)*THAT record_share. record_share IS the actual resource_once targetdriver/allconsumer attribution, applied ONCE inside sum. Result is assigned freight TOTAL, not rescaled by another share, then / same positive N_target once. Necessary empty return/positioning/failure duty: actual complete matched provider OR completed exclusive native operation/fuel/electricity/fullasset/species/receiver coverage once. Zero cargo t*km cannot convey empty duty; never invent payload/output."
    source_ids: []
  - rule_id: output_projection
    applies_to: "all intended output ledgers and exchanges"
    rule: "Complete PRE-ATTRIBUTION physical ledger retains EVERY output ownID/recipient/gate/state/handofftime/source and FULL UNNORMALIZED native quantity, including otherdrink/meal/nonfood/asset/fluid/usefulgrounds. Actual intended product/residue/waste classification and independent subdivision versus genuinely joint product require explicit PCR-specific actual decision, physical evidence/owner/lineage/allocation_stage. In target-allocated LCI, independent other products are evidence-only, not co-product exchanges after target resource assignment; internal components/transfers not co-products. Separate unallocated wholepool variant retains full inputs+alloutputs and ONE designated allocation step. A retained true joint or actual useful-transfer OUTPUT final exchange uses selected actual PHYSICAL native amount / same positive N_target once, NEVER resource targetshare; only already-per-reference unchanged. Raw ledger always physical unnormalized. This output rule overrides generic resource normalization and forbids mixed variants, automatic waste recovery credit or two handoffs for one final drink."
    source_ids: []
  - rule_id: production_periods
    applies_to: "runs phases and shared assets"
    rule: "Declare actual shot/recipe/batch/service/changeover/cleaning runs and continuous hot-readiness/refrigeration/site periods; link all inputs/outputs/changes/rejects. Enumerate stock/reporting periods and full manufacture/install/maintenance/replacement/termination phases, every shared asset consumer and all-user observed+sourced remaining life. Make actual mode/period/PCR-specific physical attribution decisions with precedence: direct subdivision, then real shared duty, then resource/freight/output rule. No shared-run/period/asset stage counted twice; unresolved replacement/termination or N0 carry blocks completion."
    source_ids: []
  - rule_id: reject_paths
    applies_to: "all rejected and returned states"
    rule: "Identify each rejected/offspec/failed/uncollected/partlyserved/leftover state and producing batch/node, then actual rework/reheat/redeploy/downgrade/useful/waste/retained-stock exit and native paired receiver. Retain original burden; add only actual new duty. Do not count unresolved rejected drink as accepted final output or new manufacture on internal old-state return. Actual already-supplied leftover does not reverse fulfilled gate absent evidence."
    source_ids: []
