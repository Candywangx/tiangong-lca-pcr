      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| check_gate | fulfilled_hot_espresso_drink | Require actual complete drink_gate profile/handoff after partial/reject/recook/reversal reconciliation; exactly one final service count, no meal-linked duplicate or assumed recipe equality. |  |\n| check_material_water | actual native stocks and fates | Check extraction_composition, stock_roles, water_terminal, cleaning_roles and fluid_roles actual independent operands/states/samples/closing membership/pairedreceiver; no water-content/enduse duplication or unknown-as-air. Wetgrounds solids/water and foam-volume/mass distinct. |  |\n| check_complete_life | all duties | Require actual complete provider OR exclusive completed missing-stage coverage, full all-user observed+sourced remaining/actual terminated life and actual conditional native land interfaces/pairedfromto events; missing stage, owner, replacement/termination or N0 carry/finalresolution blocks completeness. |  |\n| check_attribution | all outputs periods resources and freight | Require production_periods all runs/changes/cleaning/output linkage and actual PCR-specific decisions, resource_once/freight_once/output_projection precedence. Raw all-output native amounts unchanged; no other-product cooutput after target allocation, freightshare once, final positive sameN once. Prevent duplicate output handoffs and sharedrun/period/asset responsibility. |  |\n| check_rejects | rejected and returned states | Require reject_paths actual producing node/batch and real rework/redeploy/retained/useful/waste receiver links; unresolved rejects not accepted output, used recovery not new supply or credit. |  |\n| check_identity_units | all inventory rows | Each actual concrete exchange needs compatible verified type/direction/species/medium/identity/property/unit and native quantity. No umbrella fixed UUID, Flow Set or generic unverified support. Missing generic range/UUID alone does not justify zero; final completeness restricted until actual proof. |  |\n| check_languages_projection | EN ZH and generated projection | Compare complete mandatory identity/FU/reference/boundary/profile/DQ/source fields, all ordered rule/card/process/type/direction/unit/metadata IDs and each protocol12 fields/rawkeys in both languages; regenerate deterministic projection from canonical English and run selected target gate. Structural pass is not external identity/source/scientific review. |  |\n\n"
