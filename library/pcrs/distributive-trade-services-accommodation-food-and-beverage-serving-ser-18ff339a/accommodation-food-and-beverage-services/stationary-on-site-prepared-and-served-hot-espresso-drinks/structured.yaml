validation_rules:
  - rule_id: check_gate
    applies_to: "fulfilled_hot_espresso_drink"
    rule: "Require actual complete drink_gate profile/handoff after partial/reject/recook/reversal reconciliation; exactly one final service count, no meal-linked duplicate or assumed recipe equality."
    source_ids: []
  - rule_id: check_material_water
    applies_to: "actual native stocks and fates"
    rule: "Check extraction_composition, stock_roles, water_terminal, cleaning_roles and fluid_roles actual independent operands/states/samples/closing membership/pairedreceiver; no water-content/enduse duplication or unknown-as-air. Wetgrounds solids/water and foam-volume/mass distinct."
    source_ids: []
  - rule_id: check_complete_life
    applies_to: "all duties"
    rule: "Require actual complete provider OR exclusive completed missing-stage coverage, full all-user observed+sourced remaining/actual terminated life and actual conditional native land interfaces/pairedfromto events; missing stage, owner, replacement/termination or N0 carry/finalresolution blocks completeness."
    source_ids: []
  - rule_id: check_attribution
    applies_to: "all outputs periods resources and freight"
    rule: "Require production_periods all runs/changes/cleaning/output linkage and actual PCR-specific decisions, resource_once/freight_once/output_projection precedence. Raw all-output native amounts unchanged; no other-product cooutput after target allocation, freightshare once, final positive sameN once. Prevent duplicate output handoffs and sharedrun/period/asset responsibility."
    source_ids: []
  - rule_id: check_rejects
    applies_to: "rejected and returned states"
    rule: "Require reject_paths actual producing node/batch and real rework/redeploy/retained/useful/waste receiver links; unresolved rejects not accepted output, used recovery not new supply or credit."
    source_ids: []
  - rule_id: check_identity_units
    applies_to: "all inventory rows"
    rule: "Each actual concrete exchange needs compatible verified type/direction/species/medium/identity/property/unit and native quantity. No umbrella fixed UUID, Flow Set or generic unverified support. Missing generic range/UUID alone does not justify zero; final completeness restricted until actual proof."
    source_ids: []
  - rule_id: check_languages_projection
    applies_to: "EN ZH and generated projection"
    rule: "Compare complete mandatory identity/FU/reference/boundary/profile/DQ/source fields, all ordered rule/card/process/type/direction/unit/metadata IDs and each protocol12 fields/rawkeys in both languages; regenerate deterministic projection from canonical English and run selected target gate. Structural pass is not external identity/source/scientific review."
    source_ids: []
published_dataset_profile:
  dataset_role: "Actual complete foreground data package under hot espresso drink service methodology; process/lifecyclemodel downstream projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only actual compatible recipe/portion/hot-state/presentation/service-version/gate and completed complete-responsibility coverage with concrete exchange verification"
  excluded_use: "Missing actual quantity/identity as zero; universal coffee factor; whole63400/meal/cold/entertainment/transport/lodging substitution; incomplete chain"
