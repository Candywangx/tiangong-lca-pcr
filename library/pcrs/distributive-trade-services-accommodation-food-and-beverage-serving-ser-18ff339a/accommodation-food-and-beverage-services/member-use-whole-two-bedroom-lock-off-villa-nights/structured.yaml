      requirement: "Every numerator/denominator/native quantity/component/conversion/density-temperature/timezone/asset job-observed-remaining-life/repetition/fate/species operand retains unit/basis/method/state/sampletime/source and scope/population. Independent component quantities need own metadata, not whole-stream unit by default. Unknown/incompatible actual data block calculation/final data use, not zero."
