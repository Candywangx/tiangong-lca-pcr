      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| actual_whole_reference | whole_villa_night | Actual member-beneficiary visitor whole two-bedroom lock-off plan, independent atomic child IDs and same-case/night exclusive delivery/assigned room/check-in-out/acceptance/reversal evidence required. Whole configuration fixed; no child-only/dedicated two-bedroom/rights/points/capacity/no-show count. Actual guest refusal of cleaning does not remove delivered N; actual complimentary fulfilled stays retain responsibility. | dvc-home-rules-2026 |\n| atomic_no_overlap | physical space/time | Verify nonoverlapping actual child-space/time coverage and configuration transitions. Parent whole maps both included atomic spaces once, not three simultaneous physical units. Whole+child overlap, crossnight/partial child closure or actual room moves require explicit segmentation; unresolved space assignment blocks target applicability. | dvc-home-rules-2026; aulani-shared-topology-2023 |\n| pool_burden_closure | all resource pools | Necessary vacant/standby/maintenance/failed/cancelled/no-show same-pool duties must actually enter resource totals and evidenced complete real-output responsibility. Merely listing records or nominal points/capacity cannot eliminate burdens. True separate other-user/output share only actual evidence; crossperiod source-receiver-resolution mandatory, unassigned share means incomplete. Positive exactly same-target N_target normalization once; N0 retained, already-per-reference no second division. |  |\n| complete_lifetime_provider | all capital/services | Full shell/fitout/FF&E/HVAC/appliance/linen life manufacture-install-maintain-replace-EOL allusers observed+sourced remaining productive-equivalent drivers/termination/native units/equivalence/uncertainty/update; annual target N not lifetime. One provider OR underlying assets/operations, actual omitted stages ACTUALLY completed once with native quantity/source/owner/coverage links before use. Financial title/expense shares not physical default allocation. |  |\n| materials_refrigerant_fates | supply/fates | NET materials exclude tare; gross INPUT+matchedreturn/N OUTPUT OR consumed INPUT/OMIT matched OUTPUT, no repeat or unrelated negative credit. Initial asset refrigerant charge not bought twice; recovered retained/usable export/Waste/direct species disjoint, factory-charge export cannot offset unrelated operating make-up. Consumed-only deduction/OMIT applies ONLY to evidenced UNUSED same-source same-state standalone substock with an actual matched unused return. All USED recovered refrigerant, whether factory-charge or standalone-make-up origin, keeps its actual export state, without automatic equivalence to unused new supply, deduction from new manufacture, negative input or credit. Every actual distinct waste receiver stream expands, genuine mixtures/component views nonadditive; contained liquid Waste, actual vapour air Elementary Mass, direct water actual medium. No stock residual/top-up=emission/zero or automatic recycling credit. |  |\n| laundry_utility_freight_native | all quantities | Actual dry linen service throughput not new linen or wet cargo; provider complete duties/rewash once, no kg-per-night or percentage fallback. Actual utilities/register adjustments/conversions/multipliers one application, guest appliance use not assumedzero. Actual packed freight only service-boundary unique loadleg, cargo packs/supports retained, ONLY noncargo vehicle tare, EACH/TOTAL evidenced actualcount once and THAT-record share INSIDE sum before same-target positive N_target once. Every operand native6metadata, no points/fee/bill/capacity shortcuts. |  |\n| source_scope_unknown | all methods | Sources support topology/operational questions only; actual site plan/service/measurement needed. No universal checkin24hour/cleaningday/point/fee/area/capacity/lifetime/species defaults. All material unresolved UUID/support/quantity/medium/lifetime/attribution and Range-evidence gaps explicitly limit use; checker pass not semantic identity or publication proof. | dvc-home-rules-2026; aulani-shared-topology-2023 |\n\n\n"
