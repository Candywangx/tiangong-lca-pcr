validation_rules:
  - rule_id: actual_whole_reference
    applies_to: "whole_villa_night"
    rule: "Actual member-beneficiary visitor whole two-bedroom lock-off plan, independent atomic child IDs and same-case/night exclusive delivery/assigned room/check-in-out/acceptance/reversal evidence required. Whole configuration fixed; no child-only/dedicated two-bedroom/rights/points/capacity/no-show count. Actual guest refusal of cleaning does not remove delivered N; actual complimentary fulfilled stays retain responsibility."
    source_ids:
      - dvc-home-rules-2026
  - rule_id: atomic_no_overlap
    applies_to: "physical space/time"
    rule: "Verify nonoverlapping actual child-space/time coverage and configuration transitions. Parent whole maps both included atomic spaces once, not three simultaneous physical units. Whole+child overlap, crossnight/partial child closure or actual room moves require explicit segmentation; unresolved space assignment blocks target applicability."
    source_ids:
      - dvc-home-rules-2026
      - aulani-shared-topology-2023
  - rule_id: pool_burden_closure
    applies_to: "all resource pools"
    rule: "Necessary vacant/standby/maintenance/failed/cancelled/no-show same-pool duties must actually enter resource totals and evidenced complete real-output responsibility. Merely listing records or nominal points/capacity cannot eliminate burdens. True separate other-user/output share only actual evidence; crossperiod source-receiver-resolution mandatory, unassigned share means incomplete. Positive exactly same-target N_target normalization once; N0 retained, already-per-reference no second division."
    source_ids: []
  - rule_id: complete_lifetime_provider
    applies_to: "all capital/services"
    rule: "Full shell/fitout/FF&E/HVAC/appliance/linen life manufacture-install-maintain-replace-EOL allusers observed+sourced remaining productive-equivalent drivers/termination/native units/equivalence/uncertainty/update; annual target N not lifetime. One provider OR underlying assets/operations, actual omitted stages ACTUALLY completed once with native quantity/source/owner/coverage links before use. Financial title/expense shares not physical default allocation."
    source_ids: []
  - rule_id: materials_refrigerant_fates
    applies_to: "supply/fates"
    rule: "NET materials exclude tare; gross INPUT+matchedreturn/N OUTPUT OR consumed INPUT/OMIT matched OUTPUT, no repeat or unrelated negative credit. Initial asset refrigerant charge not bought twice; recovered retained/usable export/Waste/direct species disjoint, factory-charge export cannot offset unrelated operating make-up. Consumed-only deduction/OMIT applies ONLY to evidenced UNUSED same-source same-state standalone substock with an actual matched unused return. All USED recovered refrigerant, whether factory-charge or standalone-make-up origin, keeps its actual export state, without automatic equivalence to unused new supply, deduction from new manufacture, negative input or credit. Every actual distinct waste receiver stream expands, genuine mixtures/component views nonadditive; contained liquid Waste, actual vapour air Elementary Mass, direct water actual medium. No stock residual/top-up=emission/zero or automatic recycling credit."
    source_ids: []
  - rule_id: laundry_utility_freight_native
    applies_to: "all quantities"
    rule: "Actual dry linen service throughput not new linen or wet cargo; provider complete duties/rewash once, no kg-per-night or percentage fallback. Actual utilities/register adjustments/conversions/multipliers one application, guest appliance use not assumedzero. Actual packed freight only service-boundary unique loadleg, cargo packs/supports retained, ONLY noncargo vehicle tare, EACH/TOTAL evidenced actualcount once and THAT-record share INSIDE sum before same-target positive N_target once. Every operand native6metadata, no points/fee/bill/capacity shortcuts."
    source_ids: []
  - rule_id: source_scope_unknown
    applies_to: "all methods"
    rule: "Sources support topology/operational questions only; actual site plan/service/measurement needed. No universal checkin24hour/cleaningday/point/fee/area/capacity/lifetime/species defaults. All material unresolved UUID/support/quantity/medium/lifetime/attribution and Range-evidence gaps explicitly limit use; checker pass not semantic identity or publication proof."
    source_ids:
      - dvc-home-rules-2026
      - aulani-shared-topology-2023
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Configuration-specific whole two-bedroom lock-off villa physical accommodation unit-night, with full lodging lifecycle and actual responsibility-matched common systems"
  allowed_use: "Actual member-use visitor combined whole two-bedroom lock-off accommodation where both atomic child spaces exclusively supplied together under actual same case/local night, with native plans/assignment/occupancy/fullasset/provider evidence"
  excluded_use: "Child-only or indivisible/dedicated/larger-unit equivalence, property-interest/point/annual-dues footprint or generic wholeholiday package; unfulfilled/no-show/available-capacity reference, financial shares as physical defaults, incomplete fullasset/idle/provider stage responsibility"
  required_metadata: "All16 reference qualifiers; actual parent-child plans/time configurations/assignment/fulfilled nights/guest occupancy/acceptance/reversals; actual local duration/DST; true whole-child-hotel-common allusers and necessary pool burden closure/carry; actual tasks/laundry/utilities/materials/fullasset lifetime/refrigerant/native drivers/conversions/source/owner/receiver coverage"
  required_quality_disclosure: "Actual source age/site/configuration/package applicability, measured versus estimated native data, unresolved concrete identities/support/Range quantities/medium, unassigned pool/carry/provider/lifetime stages and uncertainty/sensitivity/update; no missingdatazero or publication-readiness assumption"
  update_trigger: "Changed topology/parent-child plans/configuration/service level/member-supply scope/overnight conventions/actual common users or responsibility, independent boiler/industrial laundry or additional operations, provider/fullasset lifetime/loss/fate/native conversion/identity evidence"
data_sources:
  - id: "unsd-cpc3-timeshare-lodging"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes30June2025, printed354,631/6311/63113 and explicit63111/63112 timeshare exclusions. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: actual visitor accommodation, not sales of property rights or proof of independent method from legal title alone."
  - id: "dvc-home-rules-2026"
    type: "handbook"
    reference: "Disney Vacation Club Home Resort Rules and Regulations, Rev09/02/2026, §§I/II;III11,15–16;VI1–3;VII1. https://documents.disneyvacationclub.com/vision-dam/digital/parks-platform/parks-global-assets/disney-vacation-club/vacation-planning/Home-Resort-Rules-and-Regulations-FINAL-09-02-2026.pdf"
    used_for: "Qualitative actual lock-off topology, physical assignment versus reservation/points/non-occupancy, service-level task questions and dues/use-year distinction. No numeric schedule/points/night-duration/chemical/lifetime or universal operating mandate."
  - id: "aulani-shared-topology-2023"
    type: "handbook"
    reference: "Aulani Hawai‘i Disclosure Statement20July2023, §4.4–4.6, printed14–16. https://cdn1.parksmedia.wdprapps.disney.com/media/dvc/en/collateral-docs/Aulani_Hawaii_Disclosure_Statement_07-20-2023.pdf"
    used_for: "Dated property-specific whole-versus-studio/one-bedroom physical topology and hotel/timeshare shared-system ownership context. Expense-allocation examples are not physical load factors; no universal areas/capacities/counts/cost shares or actual site proof."
