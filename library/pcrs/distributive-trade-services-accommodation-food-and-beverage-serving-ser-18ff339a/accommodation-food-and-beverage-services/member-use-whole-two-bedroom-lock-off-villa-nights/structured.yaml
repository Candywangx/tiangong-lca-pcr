          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| atomic_space_time_conservation | all physical occupancy/assets | Maintain one nonoverlapping atomic-space/time ledger. Whole supplied parent maps studio+one-bedroom together once; separate child users consume only actual own space/time. Configuration/asset scope cannot count parent and included children simultaneously or dilute a shared system with sum of marketed labels. Whole target configuration remains fixed; child-only deliveries are complete other-consumer responsibility, not target output. | dvc-home-rules-2026; aulani-shared-topology-2023 |\n| pool_idle_failure_closure | all resource pools | Necessary standby/unused/blocked/maintenance/no-show/failed resources of the same accommodation supply pool enter its physical resource total then are assigned under an evidenced complete rule to real output responsibility. Merely recording an idle ledger or nominal available capacity cannot erase burden. A truly separate other user/output may own its evidenced share; financial points/dues/unsold capacity alone cannot. Crossperiod source-receiver-resolution carry remains linked; unassigned shares mean incomplete package. |  |\n| complete_physical_attribution | operational providers/utilities | Choose direct actual task/meter trace OR actual period quantity*compatible target_driver/positive COMPLETE all_consumer_driver for that resource boundary. Native numerators and denominators include all actual whole/child/hotel/common/other users and pool necessity. No default point/revenue/week/guest-capacity fractions; select actual physical causal drivers per resource and disclose limitations. Assigned target total /positive exactly same-scope N_target once, already-per-reference no second division, N0 retain. |  |\n| full_life_all_users | buildings/reusables/providers | Actual asset-native quantity and supported equivalence*job_used_driver/positive COMPLETE lifetime_all_user_driver attributes full manufacture-install-maintenance-replacement-EOL. Lifetime driver includes actual observed history plus sourced remaining productive-equivalent service/termination across all users, with native units/equivalence/state/time/source/uncertainty/update. Necessary idle/standby burden has real-output responsibility, not unowned technical capacity. Annual target N is not asset lifetime. One full asset OR lifecycle-complete provider, not both; actual missing components/stages actually integrated once. |  |\n| material_stock_choice | actual consumables | S=assigned opening+NET external material receipts-closing including retained recovery, receipts exclude container tare. Choose one: gross S/N_target INPUT with actual matched unused return/N_target separate OUTPUT; OR consumed-only (S-return)/N_target INPUT with matching return OUTPUT OMITTED. Do not add return to input or deduct twice. Internal loops stay stock, wastes retain supply burden, no unrelated negative input or avoided-production credit. |  |\n| exclusive_receiver_and_charge | actual fates | Actual whole reusable/part/mixture/component/free-liquid/species views non-additive; each distinct receiver stream expanded, genuine co-collected mixtures retain their measured scope. Refrigerant factory charge in fullasset and operating supply provenance separate; initial-charge usable export never offsets unrelated make-up or creates negative input/credit. Contained recovery retained versus actual usable Product export/Waste treatment/direct species separately evidenced. Receiver transport/treatment after asset/provider coverage one owner. |  |\n\n\n"
