allocation_rules:
  - rule_id: atomic_space_time_conservation
    applies_to: "all physical occupancy/assets"
    rule: "Maintain one nonoverlapping atomic-space/time ledger. Whole supplied parent maps studio+one-bedroom together once; separate child users consume only actual own space/time. Configuration/asset scope cannot count parent and included children simultaneously or dilute a shared system with sum of marketed labels. Whole target configuration remains fixed; child-only deliveries are complete other-consumer responsibility, not target output."
    source_ids:
      - dvc-home-rules-2026
      - aulani-shared-topology-2023
  - rule_id: pool_idle_failure_closure
    applies_to: "all resource pools"
    rule: "Necessary standby/unused/blocked/maintenance/no-show/failed resources of the same accommodation supply pool enter its physical resource total then are assigned under an evidenced complete rule to real output responsibility. Merely recording an idle ledger or nominal available capacity cannot erase burden. A truly separate other user/output may own its evidenced share; financial points/dues/unsold capacity alone cannot. Crossperiod source-receiver-resolution carry remains linked; unassigned shares mean incomplete package."
    source_ids: []
  - rule_id: complete_physical_attribution
    applies_to: "operational providers/utilities"
    rule: "Choose direct actual task/meter trace OR actual period quantity*compatible target_driver/positive COMPLETE all_consumer_driver for that resource boundary. Native numerators and denominators include all actual whole/child/hotel/common/other users and pool necessity. No default point/revenue/week/guest-capacity fractions; select actual physical causal drivers per resource and disclose limitations. Assigned target total /positive exactly same-scope N_target once, already-per-reference no second division, N0 retain."
    source_ids: []
  - rule_id: full_life_all_users
    applies_to: "buildings/reusables/providers"
    rule: "Actual asset-native quantity and supported equivalence*job_used_driver/positive COMPLETE lifetime_all_user_driver attributes full manufacture-install-maintenance-replacement-EOL. Lifetime driver includes actual observed history plus sourced remaining productive-equivalent service/termination across all users, with native units/equivalence/state/time/source/uncertainty/update. Necessary idle/standby burden has real-output responsibility, not unowned technical capacity. Annual target N is not asset lifetime. One full asset OR lifecycle-complete provider, not both; actual missing components/stages actually integrated once."
    source_ids: []
  - rule_id: material_stock_choice
    applies_to: "actual consumables"
    rule: "S=assigned opening+NET external material receipts-closing including retained recovery, receipts exclude container tare. Choose one: gross S/N_target INPUT with actual matched unused return/N_target separate OUTPUT; OR consumed-only (S-return)/N_target INPUT with matching return OUTPUT OMITTED. Do not add return to input or deduct twice. Internal loops stay stock, wastes retain supply burden, no unrelated negative input or avoided-production credit."
    source_ids: []
  - rule_id: exclusive_receiver_and_charge
    applies_to: "actual fates"
    rule: "Actual whole reusable/part/mixture/component/free-liquid/species views non-additive; each distinct receiver stream expanded, genuine co-collected mixtures retain their measured scope. Refrigerant factory charge in fullasset and operating supply provenance separate; initial-charge usable export never offsets unrelated make-up or creates negative input/credit. Contained recovery retained versus actual usable Product export/Waste treatment/direct species separately evidenced. Receiver transport/treatment after asset/provider coverage one owner."
    source_ids: []
