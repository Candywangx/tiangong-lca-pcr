    - id: resource_pool_normalization
      applies_to: "all service rows"
      rule: "Assigned_target_quantity=direct actual target task/meter trace OR actual_resource_quantity*target_driver/all_consumer_driver, where all_consumer_driver>0 and complete compatible native scope includes all real users. Necessary same-pool standby/idle/no-show/cancelled/failed/closed duties enter pool totals and evidenced real-output attribution; unowned or unresolved shares block completion. Per_reference_quantity=Assigned_target_quantity/N_target only N_target>0 for EXACT same target scope; already_per_reference records not divided again, single night N=1 unchanged. Raw physical stock/provider/lifetime records remain raw. N0 retains resource-period-cohort/carry evidence, no division or dropped burden."
      inputs:
        - cp_stays
        - cp_utilities
        - cp_materials
        - cp_laundry
        - cp_providers
        - cp_assets
        - cp_refrigerants
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference service inventory"
      source_ids: []
    - id: utility_quantity
      applies_to: "electricity/purchased useful heat/water; electricity_ac"
      rule: "Use compatible (register_end-register_start+register_adjustment)*meter_multiplier*native_conversion_factor OR actual interval_quantity*native_conversion_factor; multiplier/conversion only when not already applied. Native evidence resolves resets/rollovers/valid versions and actual interval. Purchased useful thermal output retains actual delivery state/provider losses-assets coverage, not duplicate carrier/plant input. Attribute actual room/kitchen/HVAC/shared and necessary pool duties once then positive same-target N_target once."
      inputs:
        - cp_utilities
        - cp_stays
      output: "Actual supplied utility quantities"
      source_ids: []
    - id: supply_stock
      applies_to: "operating_materials/fuel/unused returns; operating_materials_synthetic_detergent"
      rule: "S=assigned opening+net_external_receipts-closing_including_recovery for the same actual material pool, NET receipts exclude container tare. Choose one: gross S/N_target INPUT plus actual matched usable_external_return/N_target separate OUTPUT; OR consumed-only (S-usable_external_return)/N_target INPUT and OMIT that matched OUTPUT. Do not add return to input or deduct twice. Internal loops/retained recovery stay stock, waste retains input burden; fuel supply not burn, no unrelated negative netting or automatic credit."
      inputs:
        - cp_materials
        - cp_stays
      output: "Exclusive normalized supply/return representation"
      source_ids: []
    - id: linen_service_water
      applies_to: "laundry and reusable linen views"
      rule: "Laundry_service_quantity is actual dry_linen_mass_processed or evidenced native provider-service result, including actual rewash with its own task/source and exclusive coverage. Item conversion only actual matched reusable items; never new textile manufacture per wash or dry throughput=wet cargo. Water-only same-sample w_wet=m_water/m_as_received gives m_nonwater=m_as_received*(1-w_wet). If r_dry=m_water/m_nonwater uses the SAME definitions/sample, w_wet=r_dry/(1+r_dry); reported percent converted to ratio first using native percent_to_ratio_factor. Other-volatile LOD not water; unknown/incompatible basis blocks conversion, not zero. Actual omitted provider duties must actually be integrated once before use."
      inputs:
        - cp_laundry
        - cp_assets
        - cp_freight
      output: "Separate laundry-service and material-state native evidence"
      source_ids: []
    - id: complete_asset_equivalent
      applies_to: "building_assets/linen_assets"
      rule: "Actual asset_equivalent derives from asset_native_quantity*driver_equivalence_factor*job_used_driver/lifetime_all_user_driver only with supported dimensional equivalence and lifetime_all_user_driver>0 in compatible native scope. Complete lifetime driver=observed_life_driver+sourced remaining_life_driver under actual termination and full all-user productive-equivalent responsibility; no annual target N or nominal capacity as lifetime. Necessary standby/unused burden is allocated to real output responsibility, not a zero-service unowned share. Full manufacture/install/fitout/maintenance/replacement/EOL inside asset/provider boundary once. Source-receiver-resolution crossperiod carry and actual missing lifecycle stages need completed links/quantities/source/owner/coverage before final package. Then /positive exactly same-target N_target once unless already normalized."
      inputs:
        - cp_assets
        - cp_stays
        - cp_providers
      output: "Supported complete-life asset service per reference"
      source_ids: []
    - id: record_freight
      applies_to: "freight"
      rule: "Each unique actual load-leg uses actual payload OR compatible same-state vehicle_gross-vehicle_noncargo_tare; keep actual carried wet laundry/contents/all packs/supports. EACH multiplies evidenced repeated_load_count once, TOTAL unchanged. After native unit conversions, assigned_freight=SUM(unique load-leg: payload_kg*distance_km*that_record_share), THAT-record complete compatible target/all-user share INSIDE sum. Then /positive same-target N_target once unless already_per_reference; N0 and necessary failed pool work retained. Provider/laundry/receiver/empty-return scope once; guest travel not silently added."
      inputs:
        - cp_freight
        - cp_stays
      output: "Actual unique kg*km per reference"
      source_ids: []
    - id: charge_fates
      applies_to: "refrigerant supply/recovery/species"
      rule: "Reconcile native system charge and standalone supply records with independently evidenced charging/recovery/retained closing/usable export/waste/measured release and explicit unknown residual; balance residual or top-up alone is not emitted quantity or zero. Initial factory charge already in fullasset and actual standalone supply one owner each. Factory-charge usable export recorded as actual Product transfer without offsetting unrelated current make-up/negative input/automatic credit. Only evidenced UNUSED same-source same-state standalone substock with an actual matched unused return may use consumed-only deduction with that OUTPUT OMITTED. USED recovered refrigerant from factory charge OR standalone make-up is a separately recorded actual-state usable export, not automatically equivalent to unused new supply and not deducted from new manufacture; no negative input or automatic credit. Actual contained waste to receiver is Waste Mass, not air release; direct species method separately evidenced."
      inputs:
        - cp_refrigerants
        - cp_assets
        - cp_releases
      output: "Exclusive actual refrigerant chemical/state/fate ledger"
      source_ids: []
    - id: receiver_views
      applies_to: "all waste/water/asset fates"
      rule: "Each actual distinct received stream has native identity/state/net quantity/composition/receiver/transport-treatment owner. Use whole genuine mixture OR exclusive component views, never add both; retained reusable contents and absorbed liquid are not extra free liquid. Actual contained sewer/free liquid uses Waste; direct environmental water actual medium uses Elementary, water vapour uses actual species Mass to air. Purchased supply minus unknown residual is not wastewater/vapour or zero. Asset/provider EOL/treatment already covering the same duty not repeated."
      inputs:
        - cp_fates
        - cp_assets
        - cp_refrigerants
      output: "Actual exclusive native receiver/environment interface quantities"
      source_ids: []
    - id: actual_species
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Species_quantity=measured_species_quantity OR compatible actual_activity*emission_factor with exact actual substance/particle/medium and each native operand unit/basis/method/state/sampletime/source. Complete factor already covering composition/fate fractions not multiplied again. Required composition_fraction/fate_fraction/gas conversion only when method needs once with actual temperature/pressure units/source and matching state; refrigerant blend component shares require actual emitted-composition evidence, not assumed supply composition. Chemical purchases, odour, moisture/charge residual or provider generation factor not actual release or zero. Apply actual exclusive resource attribution then same-target positive N_target once; N0 retain."
      inputs:
        - cp_releases
        - cp_refrigerants
        - cp_fates
        - cp_stays
      output: "Evidence-supported native species amount per reference"
      source_ids: []
