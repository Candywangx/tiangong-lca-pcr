    - id: range_evidence_limits
      applies_to: "each card"
      requirement: "Row-specific Range evidence needs identify actual quantity/basis/coverage collection; no universal numeric range is mandatory. A source interval becomes an empirical guardrail only if traceable and genuinely compatible with actual object/state/unit/boundary; it also needs independent reference/comparison for QA, not circular same-record min/max as validation. Missing range identity/quantity remains a disclosed use-limited gap, never invented bounds or benchmark."
