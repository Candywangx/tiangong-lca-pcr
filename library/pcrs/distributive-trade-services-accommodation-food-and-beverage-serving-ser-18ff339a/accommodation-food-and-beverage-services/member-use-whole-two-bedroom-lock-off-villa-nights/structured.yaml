      requirement: "Resolve actual whole-parent/night/atomic plan/configuration/beneficiary/assignment and every concrete utility/material/service/asset/receiver/species identity/property/unit before final exchange. Count support only verifies counted measurement, not villa-night identity, guest-night equivalence or24hour duration. Conditional umbrellas expand zero/one/multiple actual streams, never forced fixed mixed UUID."
      evidence: "Actual operator/property plans, native records, actual detailed identity/support evidence"
    - id: native_complete_operands
