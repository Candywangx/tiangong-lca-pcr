      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actually operable whole two-bedroom lock-off villa with traceable studio/one-bedroom atomic spaces, actual member-beneficiary reservation, room assignment, supplied service scope and time-versioned physical configuration |\n| starting_condition_role | Physical accommodation supply and full life-cycle responsibility; existing building/fitout/FF&E are capital services inside the life-cycle boundary, not automatically burden-free starting condition |\n| product_classification_scope | Narrower63113 member-use whole combined two-bedroom lock-off visitor lodging; classification ownership label does not itself establish independent method or physical factor |\n| recursive_input_rule | The actually operated villa is not purchased again as the same final accommodation output. Outsourced accommodation/cleaning/laundry/utility/assets use actual provider coverage or exclusive underlying stages, never both. Points/reservations/internal linen moves are not physical repeated service inputs. |\n| upstream_dataset_requirement | Match actual purchased utilities/materials/provider services and complete shell/fitout/FF&E/appliance/linen manufacture-install-maintain-replace-EOL over all consumers and periods. Owner/procurement/provider boundaries cannot omit stages; missing actual covered stages must be actually integrated once with native quantity/state/source/coverage/owner before complete package use. |\n| disclosure | Actual parent-child plan/configuration/time/assignment/fulfilled night/occupancy and service scope; member/rights nonphysical trace, physical common-system allusers/pool necessity/idle carry, construction/FF&E/laundry/refrigerant/freight/waste lifecycle ownership and unknowns |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| topology_not_tenure | whole_villa_stay | Material need is mutually exclusive whole-parent/child topology and configuration-specific physical delivery. Points or financial interest alone neither determines received service nor warrants a new physical methodology. Actual plans/assignment mandatory. | dvc-home-rules-2026; aulani-shared-topology-2023 |\n| complete_life_boundary | all resources | Include actual lodging operational resources and full building shell/fitout/FF&E/HVAC/appliance/reusable linen manufacture-maintain-replace-EOL, irrespective of financial payer. One lifecycle-complete provider OR underlying duties; actual missing stages must actually be integrated once with completed evidence and exclusive coverage, not just a pending list. |  |\n| shared_physical_not_fee | common systems | Actual hotel/vacation-plan/child/whole/common/other physical users determine system boundaries and justified native drivers. Legal ownership and declared expense/annual-dues/points shares are traceability, not default physical burden fractions. Included common facilities cannot be erased because separately owned. | aulani-shared-topology-2023 |\n| source_scope_limits | sources | Operator topology/service descriptions are qualitative applicability evidence. Do not use source cleaning day schedules, points, capacities, areas, fees or age as universal factor, service guarantee or current legal advice; actual site supplied package and operations govern. | dvc-home-rules-2026; aulani-shared-topology-2023 |\n\n\n"
