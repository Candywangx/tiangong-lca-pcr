validation_rules:
  - rule_id: validate_reference
    applies_to: "final output"
    rule: "Require matching real output card/name/reference link, 1 Item(s), verified Count supports and actual exclusive sleeping service qualifiers. No ticket/passenger-km/bed/seat/night equivalence, duplicate move/split output or unfulfilled/unknown episode counted."
    source_ids: []
  - rule_id: validate_rail_partition
    applies_to: "movement and shared resources"
    rule: "Require actual train-coach-segment-configuration/time/all-user ledger, formation split/join and real driver/coverage ownership. Accommodation/transport/dining shares close actual duty once; no full-train duplication or fare-driven omission. Actual idle/empty/reposition/stabling/failure ownership and N0 carry/disposition complete."
    source_ids:
      - cs-current-trains
      - cs-traction-depot-eir-2025
  - rule_id: validate_providers_life
    applies_to: "all providers and assets"
    rule: "Reject absent actual stage completion, generic outsourcing claims, pending supplements treated as actual, lifetime targetN denominator or omitted full vehicle/rail/station/depot/fitout/linen life. Check all-user observed+remaining sourced life OR actual terminated total, native driver compatibility, uncertainty and no repeated provider/own EOL or manufacturing stages."
    source_ids: []
  - rule_id: validate_native
    applies_to: "every operand/formula"
    rule: "Each independent raw/factor/share/duration/lifetime/conversion has native unit,basis,method,state,sample_time,source_ref. Reject incompatible material/time/unit/state, instant/nameplate energy, repeated integrated kWh*time, misplaced freight share/repeat and repeated normalization."
    source_ids: []
  - rule_id: validate_stock_fates
    applies_to: "actual supplies/water/refrigerants/receivers"
    rule: "External net receipt means tare removed only unless consumed choice explicit. Matched same-source/state UNUSED gross+return OR consumed-minus-return/OMIT exclusive; used recovery is not unused/virgin credit. Reject unidentified combined streams, wrong media, water vapour as liquid waste, inventory residual as emission and absent necessary collection treated as zero."
    source_ids: []
  - rule_id: validate_failed_outputs
    applies_to: "failed/partial/task states"
    rule: "Link each failed preparation/out-of-order/rejected linen/material/interruption event to actual repair/reclean/redeploy/return/held/receiver and burden owner. No failed or unresolved state as full accepted output; remedy/cleaning/handoff is not another journey."
    source_ids: []
  - rule_id: validate_package_route
    applies_to: "actual included food/support"
    rule: "Actual included goods/food/lounge/sanitation and all their physical stages remain complete once; independent dining is a real other output. Unreviewed actual independent engine/kitchen/laundry/conversion production or missing actual coverage blocks complete package use; no invented universal route or perguest quantity."
    source_ids:
      - cs-during-trip
      - nightjet-sleeping
  - rule_id: validate_evidence
    applies_to: "final data and bilingual projection"
    rule: "Same boundaries, card/rule/protocol IDs, actual units and required metadata in EN/ZH/generated projection; actual sources support claimed scope. Missing generic ranges/UUIDs remain explicit limitations and necessary actual collection; no fabricated match/factor/source or unsupported full-chain/publication claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for actual private rail sleeping-compartment accommodation, with downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset only after actual physical stage completion, source/identity verification and review for declared equivalent service/route/package"
  allowed_use: "Actual exclusive sleeping-compartment service within evidenced moving-vehicle/transport/all-user/provider/lifecycle boundary and actual native quantities"
  excluded_use: "Shared berth, seat-only, stationary room/day/night, full passenger transport or dining alone; unlike journey/package default equivalence; commercial allocation; missing actual stages/necessary quantities or unresolved final exchanges as complete verified data"
  required_metadata: "Actual operator/geography/time, train/coach/compartment service-version and all segments/configurations, exclusivity/acceptance/partials, actual users/guests/package, provider/stage/receiver/asset and land ownership, native per-operand metadata and allocation/carry/normalization representation"
  required_quality_disclosure: "Actual source coverage, physical driver alternatives/sensitivity, all-user lifetime assumptions/uncertainty, N0/idle/reposition/failure responsibility and actual disposition, actual completed missing stages/exclusions, unknown quantities/fates/identities and bounded use"
  update_trigger: "Actual service route/formation/configuration/duration/package/provider/asset/lifetime or resource/receiver/driver/source/identity change; changed native data, supported coverage or unresolved-stage resolution"
