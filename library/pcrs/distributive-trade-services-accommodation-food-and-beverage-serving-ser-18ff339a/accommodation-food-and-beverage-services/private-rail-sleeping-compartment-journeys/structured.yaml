allocation_rules:
  - rule_id: physical_precedence
    applies_to: "all quantities"
    rule: "First subdivide by actual separately metered/event/asset duty and physical stage; then use an actual justified causal driver for remaining inseparable duty, with all real consumers and periods. Document method, own native driver units/basis/state/time/source and sensitivity. No universal fare/revenue/berth/guest fraction. Different physical duties may require different drivers; compare credible alternatives and retain unsupported allocation as blocking evidence gap."
    source_ids: []
  - rule_id: rail_partition
    applies_to: "train/coach/segment/duty"
    rule: "For each actual duty k record B_k, actual segment/formation/configuration and complete consumer set. Use exclusive owner-stage partition plus evidenced target share a_target,k; every share is on that SAME duty/interval/basis, nonnegative, and all owner/consumer shares close B_k without overlap. Separate physical accommodation from passenger movement ownership within common coach/traction, rather than assigning full burden to both. Actual measured auxiliaries and separately owned prep split before shared movement allocation. Seat/day conversion uses actual configuration/time membership, not nominal bed=seat."
    source_ids:
      - cs-current-trains
      - cs-room-supplements
  - rule_id: necessary_pool
    applies_to: "idle/empty/failure/N0"
    rule: "Record actual necessity, causal responsibility and pool owner for unsold/failed/closed/stabled/empty/depot-reposition events. Allocate necessary pooled burdens with consistent all-user physical drivers across actual responsible products and periods, retaining true idle shares in numerator and denominator for calendar/capacity-time approaches. Productive-output drivers must carry full necessary idle burden to evidenced responsible products and close full pool. N_target=0 retains source/owner/stage/native quantity and actual carry/termination disposition without division; do not create journeys or hide unrelated work in target pool. Unresolved owner/final disposition blocks complete use."
    source_ids:
      - cs-traction-depot-eir-2025
  - rule_id: asset_life
    applies_to: "all assets/textiles/infrastructure"
    rule: "For actual asset/stage j use its complete uncovered burden and compatible target life-service share, based on observed all-user service history plus sourced remaining productive-equivalent service OR actual terminated total. Record actual life driver/equivalence and every independent native operand, uncertainty/sensitivity/update and period attribution. Complete all users/periods must close the whole burden; no annual targetN as whole lifetime or duplicate manufacture after repair/redeployment/internal transfer. Actual idle/native calendar allocation follows necessary_pool."
    source_ids: []
  - rule_id: provider_gate
    applies_to: "all providers and own duties"
    rule: "One completed lifecycle-matched provider OR exclusively completed uncovered underlying stages. Match physical duty/asset/stage/segment/site/time and source/receiver links; integrate real missing quantities and datasets once before complete-chain use and explicitly exclude overlap. The same final accommodation is not its own recursive input. Counted service cards require real counted physical operations; a different actual native deliverable must retain its supported unit and reviewed dimensional reconciliation."
    source_ids:
      - cs-traction-depot-eir-2025
  - rule_id: stock_exclusive
    applies_to: "unused/used supply returns"
    rule: "External receipts net of packaging/container tare still include real outbound UNUSED returns. Gross input is same-scope gross DRAWN supply S from stock_balance, not current receipts alone. EITHER input S plus matched same-source/identity/state unused return output OR input (S minus matched unused) and OMIT the return output. Never both deductions, nor net unrelated stocks. Used recovery/useful export is a separate fate with existing burden retained, not an unused new-material return or automatic avoided manufacture. Carry closing stock and earlier attribution with actual source IDs."
    source_ids: []
  - rule_id: stream_fates
    applies_to: "outputs and failures"
    rule: "Actual intended service outputs, partials, useful used materials, internal moves and waste/elementary releases retain their actual gates. Reclean/repair/return links original failed event and retained burden; no second accepted journey for correction. Split unlike material/species/medium/receiver; only genuine collected mixture is one stream with nonadditive component views. No unexplained residual or generic mixed waste as evidence of fate, zero or credit."
    source_ids: []
