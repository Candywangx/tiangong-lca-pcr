  calculation_rules:
    - id: normalize_once
      applies_to: "all nonreference exchanges"
      rule: "Q_target = sum(actual compatible Q_k * actual a_target,k) for unique real events/duties with share inside sum; Q_ref = Q_target / N_target only when same-scope N_target > 0. Already-per-reference amounts remain unchanged. Actual applicable stock_exclusive representation precedes this sum; N_target=0 follows necessary_pool without division. Each Q,share,N and conversion keeps its OWN native metadata and source."
      inputs:
        - "actual native records"
        - cp_journeys
        - rail_partition
      output: "Actual per reference quantity, or responsible unnormalized carry"
      source_ids: []
    - id: accepted_episodes
      applies_to: "reference service"
      rule: "N_target = count unique physically accepted equivalent exclusive-compartment service episodes after actual moves/formation changes/revisions/interruption/partial reconciliation. Count real accommodation fulfilment rather than price/passenger-distance. Actual unlike partials remain separately described outputs and pools, not arbitrary fractions of a complete episode."
      inputs:
        - cp_journeys
        - journey_identity
      output: "N_target"
      source_ids: []
    - id: rail_duty_closure
      applies_to: "moving/shared duties"
      rule: "Partition actual duty by actual train-coach-segment-configuration-time and ownership; sum assigned same-duty owner/consumer portions closes its full B_k. Apply physical_precedence and rail_partition before normalize_once. Stage/provider coverage and actual driver evidence determine portions; no prescribed numerical share or default transport subtraction."
      inputs:
        - cp_rail
        - cp_energy
        - cp_providers
        - "all real consumers"
      output: "Exclusive actual accommodation/other-output duty shares and closure"
      source_ids: []
    - id: lifetime_service
      applies_to: "asset stages"
      rule: "Attribute actual uncovered full-life stage burden using compatible actual target/all-user lifetime driver under asset_life. Observed history plus sourced remaining equivalent use OR actual terminated total closes full burden, including necessary idle treatment. Distinct full-life stages, annual-period allocations and current replacements do not repeat manufacture/EOL already included."
      inputs:
        - cp_assets
        - "native observed/remaining/target driver operands"
        - provider_gate
      output: "Actual completed lifecycle attribution"
      source_ids: []
    - id: stock_balance
      applies_to: "supplies and material state"
      rule: "At SAME source/material/state/burden-stage and attributed pool scope define S = attributed opening stock + inbound external receipts net of packaging/container tare ONLY + actual source-linked internal-in and signed necessary responsibility transfers - attributed closing stock - actual internal-out responsibility transfers. Closing retains real unused and recovered stock by separate compatible-state ledger; recovered stock must not also be inside standalone closing. Carry prior source/stage burden and retained stock to its actual next owner/period, without a new manufacture event. S is gross DRAWN supply, not purchases alone: stock_exclusive uses S with matched UNUSED output OR (S minus matched UNUSED) with output OMITTED. Used export/recovery/retained recovered stock retains actual old-stage burden and service carry; never net it as an unused NEW-material return or avoided new manufacture. Actual state transformations have paired transfer IDs and nonadditive parent/component audits, not arbitrary cross-state subtraction. Reconcile actual use/fates/losses and retained responsibility; unresolved difference or absent final carry blocks complete use."
      inputs:
        - cp_stock
        - cp_refrigerant
        - stock_exclusive
      output: "Compatible stock closure and exclusive exchanged quantities"
      source_ids: []
    - id: energy_quantity
      applies_to: "actual energy"
      rule: "Actual meter end-start with real resets/import/export OR actual SAME interval-average power * actual duration with dimensional conversion once. Thermal/fuel conversions use actual state and independent sourced native factors. Integrated energy never multiplied by time again; purchases are not automatically burned."
      inputs:
        - cp_energy
        - "each native energy/time/conversion operand"
      output: "Actual uncovered compatible energy/fuel quantity"
      source_ids: []
    - id: water_fates
      applies_to: "actual water"
      rule: "Within ONE declared boundary/period and compatible water/moisture state: opening stocks + actual EXTERNAL inflows = mutually exclusive actual EXTERNAL terminal exits + closing stocks + unresolved difference. Enduse is an internal intermediate view, not additional terminal exit; source supply/tank fill internal transfer and contained handover/same receiver acceptance are respectively paired single quantities, not duplicate entry/exit. Retained moisture already in closing material/water stocks is not separately added. Unique transfer IDs, internal/external and terminal/stock-membership roles prove exclusions. Actual vapour/outfall requires independent measurement or supported model; residual remains unknown. Genuine carrier mixture and species component audits are nonadditive, no supply=sewer/evaporation."
      inputs:
        - cp_water
        - "actual sample/source/tank/receiver operands"
      output: "Actual distinct water fates and disclosed unresolved difference"
      source_ids: []
    - id: refrigerant_fates
      applies_to: "actual refrigerant"
      rule: "For each SAME substance/component, boundary, phase and period use exclusive disjoint compartments: O_installed + O_standalone + O_recovered + new_factory_charge_entry + standalone_external_receipts_tare_only + other_external_receipts = C_installed + C_standalone + C_recovered + matched_UNUSED_returns + useful_USED_export + contained_waste + whole_equipment_retained_exit_charge + independently_evidenced_air_release + other_identified_external_fates + unresolved_difference. New factory entry belongs ONLY to equipment entering this boundary during period and absent from O_installed; its manufacture charge belongs once to equipment/provider, not another standalone refrigerant manufacture. Recovered O/C are SEPARATE from standalone O/C and cannot also be inside them. Internal additions/recovery transfer between compartments cancel only on the consolidated audit and do not become new input/output. Whole-equipment retained exit content is a nonadditive component of that equipment handoff, not a second charged refrigerant waste exchange. Used exports/recovery retain original burden and cannot reduce new manufacture as UNUSED return. No unmatched stock residual becomes release: absent independent fate evidence remains unresolved even if a balance closes. Reconcile native component fractions, factory/new-entry timestamps, every real external gate and covered provider stage; stock_exclusive and stock_balance determine actual manufacture/service exchange representation without duplicating this nonadditive audit."
      inputs:
        - cp_refrigerant
        - stock_balance
        - "actual charge/recovery/receiver operands"
      output: "Actual supply/useful/contained/air/stored fates without duplication"
      source_ids: []
    - id: freight_sum
      applies_to: "material cargo"
      rule: "Q_target_freight = sum(actual carried payload_k * actual leg_distance_k * actual repeat_k * actual target_share_k) over unique actual load-legs; EACH repeat only once, TOTAL unchanged. Payload includes carried wet content/packaging/supports, excludes only vehicle/noncargo tare. Apply normalize_once once after sum; actual passengers not freight cargo."
      inputs:
        - cp_freight
        - "actual independent mass/distance/repeat/share operands"
      output: "kg*km per reference on compatible units"
      source_ids: []
    - id: species_amount
      applies_to: "actual direct pollutant"
      rule: "Use actual measured substance amount OR actual activity * an independently sourced applicable factor with dimensional/state/basis conversion; concentration * SAME sample/interval flow only with compatible units. Preserve actual substance versus elemental basis, particle size, receiving medium and provider exclusions. Each actual exchange separate; missing necessary species/factors block complete use instead of default zero."
      inputs:
        - cp_emissions
        - cp_refrigerant
        - "actual native activity/factor/sample/conversion operands"
      output: "Actual species/medium amount"
      source_ids: []
    - id: land_phase
      applies_to: "actual land"
      rule: "Actual occupation = sum(nonoverlapping actual area * actual compatible interval duration) by land category/owner; actual transformation-from/to pairs share real event/footprint and are not annual/nightly repetitions. Reconcile provider/asset current/full-life land phases before attribution, native conversions and normalize_once. Unknown footprint/category/history is a collection gap."
      inputs:
        - cp_land
        - "actual native area/time/calendar/event operands"
      output: "Actual exclusive m2*a occupation and m2 transformation"
      source_ids: []
