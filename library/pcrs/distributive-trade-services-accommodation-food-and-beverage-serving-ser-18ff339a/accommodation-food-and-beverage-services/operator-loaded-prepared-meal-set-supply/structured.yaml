      requirement: "Expand each actual case under land_transformation_to into an independently identified exchange; complete all native quantity, state, source, receiver and coverage evidence from its full capture definition below before final use. Do not interpret a missing UUID or quantity as zero; retained fixed cases exclude their quantities from residual cases."
      evidence: "cp_assets"
validation_rules:
  - rule_id: gate_complete
    applies_to: "meal_set_supply"
    rule: "Count only actual complete equivalent prepared meal-set supply received by the specified operator/galley after physical loading, required component/quality/quantity checks, actual order changes and acceptance/reversal reconciliation. Actual contract gate must be evidenced; public job pages are not signed receipts. Do not substitute prepared availability, scheduled meals, flights, passengers, trolley count, invoice or eaten mass."
    source_ids: []
  - rule_id: route_complete
    applies_to: "meal_set_supply"
    rule: "Actual individual ingredients, prepared components, recipe water/ice/oils/seasonings enter real kitchen composition/preparation/cooking or cold assembly. Record before/after formulation/treatment states, actual food losses/offspec routes and protected pack state. Holding, dispatch, ground transport and customer-specified loading have separate event/owner links in this integrated provider process; no fabricated extra factory or purchased identical final supply."
    source_ids: []
  - rule_id: contract_complete
    applies_to: "all stages"
    rule: "Final product is operator-loaded prepared supply, not passenger served/eaten meal. Include all ACTUAL supplier-contract-owned postgate returns, collection, sorting, food/waste disposition, wash/cleaning and receivers in its numerator. Record actual operator-owned onboard holding/reheating/plating/serving responsibility separately; do not silently claim these completed or universal whole-flight passenger traction. A claim of passenger complete-meal service requires actual reviewed expanded stages and changed gate."
    source_ids: []
  - rule_id: scope_life_complete
    applies_to: "assets providers land"
    rule: "Include upstream actual food/material/utilities/losses and complete site/building/fitout/kitchen/vehicle/high-loader/refrigeration/equipment/reusable/textile manufacture-install-maintain-replace-EOL. Match every physical stage to one complete provider OR direct actual duty; missing stages must be actually completed and integrated once with native amount/state/source/time/owner/coverage/exclusions before complete-scope use. Invoice, lease or future plan is insufficient. Enumerate actual asset/service consumers, nodes, life phases, stock/reporting/maintenance/replacement/termination and receiver periods. Use observed all-user life plus sourced compatible remaining service OR actual terminated total; never annual targetN/nameplate capacity/invented years. Actual land occupation area*time and evidenced from-state/to-state/event/date/area are native quantities, not Count. Provider-covered land/life is not repeated; actually complete excluded stages once."
    source_ids: []
  - rule_id: native_terminal_complete
    applies_to: "all exchanges"
    rule: "Preserve actual raw/thawed/prepared/cooked/held/loaded/returned wet/dry/edible/bone/skin/water/fat/solute states, recipe and stock quantities; no universal yield. Same-sample water-only wet fraction w=water/wet and dry ratio r=water/nonwater imply w=r/(1+r), percent first; loss-on-drying with other volatiles is not water. Terminal balances use actual external terminal exits plus actual closing stocks, excluding internal enduse/transfer, component contents and duplicate receiver views. Water vapour is water species to air Mass; contained effluent is Waste. Independent actual species/medium/particle/basis/factor evidence required; unknown residual not emission or zero. Net receipts remove only tare before outbound returns. Gross drawn S=attributed opening+inbound-closing plus actual paired responsibility transfers. Use S input+matched UNUSED return output OR (S-UNUSED) input and omit that output. Used ware/food/fluids retain original burden, not virgin supply deduction or automatic credit. Stored/installed/recovered fluid roles exclusive; factory new charge absent opening is equipment entry, not another purchase. Track all actual useful/waste/wholeequipment retained-content/direct-release fates; whole/component contents nonadditive, unknown balance not emission."
    source_ids: []
  - rule_id: output_period_complete
    applies_to: "all resources"
    rule: "Direct physical trace and independent-process subdivision first. For actual shared duty assign each compatible raw record times THAT target_driver divided by positive complete all_consumer_driver, then sum. Include every customer/menu/flight/job/staff/nonfood user and period; necessary idle/failed/cancelled/closed/readiness resources remain in responsible pool. N_target=0 or zero transfer retains source/carry/receiving/finalresolution without division or fake output; unresolved responsibility blocks completeness. Assigned target TOTAL still divides same positive profile N_target once; only already-per-reference quantities remain unchanged."
    source_ids: []
  - rule_id: freight_complete
    applies_to: "freight"
    rule: "Each unique actual leg/load uses full packed wet cargo including food/ice/pack/support/equipment, removing only noncargo vehicle tare. EACH quantity repeats actual count once; TOTAL unchanged; THAT-record share inside sum. Complete matched carrier OR exclusive actual own-fleet fuel/electricity/loading/holding/maintenance/full assets/species/receiver once. Zero cargo kg*km cannot carry necessary empty/positioning/return/failed duties: include actual matched complete coverage or completed native underlying duty once, never fictitious payload or output."
    source_ids: []
  - rule_id: output_stage_complete
    applies_to: "all outputs"
    rule: "Complete pre-attribution ALL-OUTPUT ledger keeps each outputID/recipient/gate/state/handofftime/source and its own full UNNORMALIZED native quantity, including other meal/nonmeal/asset/fluid handoffs. First distinguish independent subdivision from genuine joint products; document actual PCR-specific attribution decision/physical evidence/owner/lineage/allocation_stage. In target-allocated LCI, independent other meals/services are evidence-only, not extra co-products after resource assignment. A retained genuine joint output final exchange uses SELECTED actual physical amount / same positive profile N_target once, never resource targetshare; already-per-reference unchanged. Separate unallocated wholepool requires full inputs+alloutputs and one designated attribution step. This output rule takes precedence over generic resource rule."
    source_ids: []
  - rule_id: rework_complete
    applies_to: "food pack returns"
    rule: "Link every raw/prepared/held/loaded rejected/partial/reversed or returned state to producing batch, actual rework/reheat/redeploy/retained stock/usable export/discard and real receiver. Original burden stays; add only actual new work/transport/wash/storage. Internal old-state food/dirty returns are genealogy, not new manufacture or final meal-set counts. Paired transfer has real source/receiver/gate/state/time/receipt quantity on both sides, transit differences separately evidenced. Rejects are not accepted output."
    source_ids: []
  - rule_id: bilingual_complete
    applies_to: "all methodology"
    rule: "Require same EN/ZH card/node/rule/protocol IDs, actual gates/states/native units, mandatory fields and current deterministic projection; missing concrete identities/quantities block final use, checker pass is not scientific review/publication."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Check actual elementary land occupation area*time and evidenced prior/resulting transformation interfaces, only actual uncovered responsibility. Check freight already assigned by the one record share is not reattributed."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and completeness review"
  downstream_use: "Actual operator-loaded receipt of equivalent prepared meal-set supply"
  allowed_use: "Actual equivalent protected set at evidenced loaded operator receipt with complete actual supplier responsibility"
  excluded_use: "Passenger meal/eating/wholeflight claims; unreviewed routes; absent receipt/identity/native quantities/fulllife/owner coverage"
  required_metadata: "actual_provider_kitchen_loading_operator_galley; actual_menu_recipe_components_portion_pack_service_version; actual_operator_loaded_receipt_state_time_acceptance; actual_required_quantity_quality_and_order_changes; no_assumed_flight_trolley_passenger_equivalence; actual_contract_owned_return_wash_receiver_duties; actual_food_pack_wet_cargo_stock_water_native_views; all_outputs_users_periods_idle_failed_N0_resolution; complete_alluser_asset_land_reusable_life; exclusive_completed_provider_missing_stages; each_numeric_operand_unit_basis_method_state_sample_time_source"
  required_quality_disclosure: "Actual source/site/date applicability, measured/modelled quantities, uncertainty and all identity/numeric/range/stock/species/medium/asset/land/provider/receiver gaps and restrictions"
  update_trigger: "Changed menu/component/recipe/portion/pack/state/service-version/operator gate/contract return duties, physical route, provider/assets/land/alloutput/period/fate/identity"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; accessed2026-10-20"
    used_for: "63392 covers contractual food preparation and supply for airline and other transportation companies. 63391 specific event,63393 ongoing other customer locations/concessions;63399 no-seating/mobile;63400 beverage-only. Classification scope only; cannot establish physical route, universal product, quantity or lifecycle boundary."
  - id: "gategroup-finalizer-current"
    type: "handbook"
    reference: "https://jobs.gategroup.com/en/job/inwood/flight-finalizer-24-50-weekly-pay/49234/91463570224; accessed2026-10-20"
    used_for: "Flight finalizer checks provided meal quality/quantity against customer requirements and fulfillment of order changes. Actual customer-specified version and fulfilled quantity gate is supported, rather than planned passenger or flight count. Role description supplies qualitative check, not actual customer contract, signed acceptance, food quantity, temperature or portion."
  - id: "gategroup-transport-current"
    type: "handbook"
    reference: "https://jobs.gategroup.com/en/job/new-york/transportation-supervisor/49234/102017487952; accessed2026-10-20"
    used_for: "Kitchen-driver/dock coordination; control sheets assign drivers to actual aircraft/flights; airline service updates and equipment changes; proper galley transportation, vehicle cleanliness, airline diagrams/specifications and fleet maintenance. Page posting/submit/close dates disagree; do not rely on active vacancy status. Does establish currently hosted operator duties; no quantitative route, flight factors or ownership contract."
  - id: "gategroup-wash-current"
    type: "handbook"
    reference: "https://jobs.gategroup.com/en/job/denver/dishroom-attendant-23-00-hr/49234/90811028672; accessed2026-10-20"
    used_for: "Washable trays/bowls/plates/cups/glasses/cutlery are separated, conveyor washed, retrieved and stowed; some packing follows customer diagrams. No washing water/chemical/energy cycle factor, equipment lifetime, or evidence every site uses identical machinery."
  - id: "gategroup-cook-current"
    type: "handbook"
    reference: "https://jobs.gategroup.com/en/job/seattle/specialty-cook-chinese-cuisine-28-00-hr/49234/91320795040; accessed2026-10-20"
    used_for: "Actual airline-specification menus/recipes; cooking equipment and presentation; washing/cutting foods and transfers between storage/work areas; cleaning of foodservice equipment/facilities. Specific cuisine role supports route duties, not mandatory cooking for cold components or universal recipe/yield/temperature."
  - id: "ekfc-airline-current"
    type: "handbook"
    reference: "https://www.emiratesflightcatering.com/services/airline-and-airport-services/; accessed2026-10-20"
    used_for: "Operating central commissary with bakery, customer-tailored inflight menus, equipment/inventory handling, maintenance and high-loader transport; also distinct lounge and other support services. Illustrative site-wide totals not used as PCR factors. Page does not expose actual contract gate/portion/receipt proof. Laundry/other ancillary service is distinct and not automatically complete under meal input."
  - id: "lsg-trolley-historical"
    type: "handbook"
    reference: "https://www.lsg-group.com/news/day-life-trolley-lsg-sky-chefs/; accessed2026-10-20; historical operator description, publication date not verified"
    used_for: "Historical direct operator description: used trolleys return, sorting/emptying/washing, trays/equipment wash, prepared trays packed, cooled, trucked and loaded/secured aboard aircraft. Historical corroboration only, not sole current route proof; no current universal safety temperature, wash consumption, cycle or burden factor."
  - id: "gategroup-equipment-current"
    type: "handbook"
    reference: "https://jobs.gategroup.com/en/job/schiller-park/equipment-supervisor/49234/101157537872; accessed2026-10-20"
    used_for: "Dishroom, preload, beverage and transport areas support catering; actual customer airline diagrams/specifications, customer-material inventory, daily temperature records, stock supply and machinery maintenance. Qualitative real responsibility source only; no universal airline configuration, factor, temperature limit or actual target contract. Site differs from other corroborating operator roles, not asserted one observed plant dataset."
