allocation_rules:
  - rule_id: all_user_pool
    applies_to: "resource duties"
    rule: "Direct physical trace and independent-process subdivision first. For actual shared duty assign each compatible raw record times THAT target_driver divided by positive complete all_consumer_driver, then sum. Include every customer/menu/flight/job/staff/nonfood user and period; necessary idle/failed/cancelled/closed/readiness resources remain in responsible pool. N_target=0 or zero transfer retains source/carry/receiving/finalresolution without division or fake output; unresolved responsibility blocks completeness. Assigned target TOTAL still divides same positive profile N_target once; only already-per-reference quantities remain unchanged."
    source_ids: []
  - rule_id: full_life_land
    applies_to: "assets land reusables"
    rule: "Enumerate actual asset/service consumers, nodes, life phases, stock/reporting/maintenance/replacement/termination and receiver periods. Use observed all-user life plus sourced compatible remaining service OR actual terminated total; never annual targetN/nameplate capacity/invented years. Actual land occupation area*time and evidenced from-state/to-state/event/date/area are native quantities, not Count. Provider-covered land/life is not repeated; actually complete excluded stages once."
    source_ids: []
  - rule_id: stock_return_fluid
    applies_to: "all stock pools"
    rule: "Net receipts remove only tare before outbound returns. Gross drawn S=attributed opening+inbound-closing plus actual paired responsibility transfers. Use S input+matched UNUSED return output OR (S-UNUSED) input and omit that output. Used ware/food/fluids retain original burden, not virgin supply deduction or automatic credit. Stored/installed/recovered fluid roles exclusive; factory new charge absent opening is equipment entry, not another purchase. Track all actual useful/waste/wholeequipment retained-content/direct-release fates; whole/component contents nonadditive, unknown balance not emission."
    source_ids: []
  - rule_id: output_projection
    applies_to: "all intended outputs"
    rule: "Complete pre-attribution ALL-OUTPUT ledger keeps each outputID/recipient/gate/state/handofftime/source and its own full UNNORMALIZED native quantity, including other meal/nonmeal/asset/fluid handoffs. First distinguish independent subdivision from genuine joint products; document actual PCR-specific attribution decision/physical evidence/owner/lineage/allocation_stage. In target-allocated LCI, independent other meals/services are evidence-only, not extra co-products after resource assignment. A retained genuine joint output final exchange uses SELECTED actual physical amount / same positive profile N_target once, never resource targetshare; already-per-reference unchanged. Separate unallocated wholepool requires full inputs+alloutputs and one designated attribution step. This output rule takes precedence over generic resource rule."
    source_ids: []
  - rule_id: reject_rework
    applies_to: "food pack returns and batches"
    rule: "Link every raw/prepared/held/loaded rejected/partial/reversed or returned state to producing batch, actual rework/reheat/redeploy/retained stock/usable export/discard and real receiver. Original burden stays; add only actual new work/transport/wash/storage. Internal old-state food/dirty returns are genealogy, not new manufacture or final meal-set counts. Paired transfer has real source/receiver/gate/state/time/receipt quantity on both sides, transit differences separately evidenced. Rejects are not accepted output."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "freight_empty has precedence for freight: record_share is the SAME evidenced target_driver/all_consumer_driver share, applied ONCE inside each leg sum (direct physical target trace share=1). A freight total already assigned by freight_sum is not rescaled under all_user_pool; divide by same positive compatible N_target once only. Already-per-reference freight remains unchanged. Do not multiply record_share and the identical generic target share twice."
    source_ids: []
