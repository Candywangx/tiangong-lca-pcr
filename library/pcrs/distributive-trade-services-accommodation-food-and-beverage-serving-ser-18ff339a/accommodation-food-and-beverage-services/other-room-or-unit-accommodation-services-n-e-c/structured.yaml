  calculation_rules:
    - id: normalize_once
      applies_to: "all nonreference exchanges"
      rule: "Q_target = sum(actual compatible Q_k * actual a_target,k) for unique real events/duties with share inside sum; Q_ref = Q_target / N_target only when same-scope N_target > 0. Already-per-reference amounts remain unchanged. Actual applicable stock_exclusive representation precedes this sum; N_target=0 follows necessary_pool without division. Each Q,share,N and conversion keeps its OWN native metadata and source."
      inputs:
        - "actual native records"
        - cp_journeys
        - rail_partition
      output: "Actual per reference quantity, or responsible unnormalized carry"
      source_ids: []
    - id: accepted_episodes
      applies_to: "reference service"
      rule: "N_target = count unique physically accepted equivalent exclusive-compartment service episodes after actual moves/formation changes/revisions/interruption/partial reconciliation. Count real accommodation fulfilment rather than price/passenger-distance. Actual unlike partials remain separately described outputs and pools, not arbitrary fractions of a complete episode."
      inputs:
        - cp_journeys
        - journey_identity
      output: "N_target"
      source_ids: []
    - id: rail_duty_closure
      applies_to: "moving/shared duties"
      rule: "Partition actual duty by actual train-coach-segment-configuration-time and ownership; sum assigned same-duty owner/consumer portions closes its full B_k. Apply physical_precedence and rail_partition before normalize_once. Stage/provider coverage and actual driver evidence determine portions; no prescribed numerical share or default transport subtraction."
      inputs:
        - cp_rail
        - cp_energy
        - cp_providers
        - "all real consumers"
      output: "Exclusive actual accommodation/other-output duty shares and closure"
      source_ids: []
    - id: lifetime_service
      applies_to: "asset stages"
      rule: "Attribute actual uncovered full-life stage burden using compatible actual target/all-user lifetime driver under asset_life. Observed history plus sourced remaining equivalent use OR actual terminated total closes full burden, including necessary idle treatment. Distinct full-life stages, annual-period allocations and current replacements do not repeat manufacture/EOL already included."
      inputs:
        - cp_assets
        - "native observed/remaining/target driver operands"
        - provider_gate
      output: "Actual completed lifecycle attribution"
      source_ids: []
    - id: stock_balance
      applies_to: "supplies and material state"
      rule: "At SAME source/material/state/burden-stage and attributed pool scope define S = attributed opening stock + inbound external receipts net of packaging/container tare ONLY + actual source-linked internal-in and signed necessary responsibility transfers - attributed closing stock - actual internal-out responsibility transfers. Closing retains real unused and recovered stock by separate compatible-state ledger; recovered stock must not also be inside standalone closing. Carry prior source/stage burden and retained stock to its actual next owner/period, without a new manufacture event. S is gross DRAWN supply, not purchases alone: stock_exclusive uses S with matched UNUSED output OR (S minus matched UNUSED) with output OMITTED. Used export/recovery/retained recovered stock retains actual old-stage burden and service carry; never net it as an unused NEW-material return or avoided new manufacture. Actual state transformations have paired transfer IDs and nonadditive parent/component audits, not arbitrary cross-state subtraction. Reconcile actual use/fates/losses and retained responsibility; unresolved difference or absent final carry blocks complete use."
      inputs:
        - cp_stock
        - cp_refrigerant
        - stock_exclusive
      output: "Compatible stock closure and exclusive exchanged quantities"
      source_ids: []
    - id: energy_quantity
      applies_to: "actual energy"
      rule: "Actual meter end-start with real resets/import/export OR actual SAME interval-average power * actual duration with dimensional conversion once. Thermal/fuel conversions use actual state and independent sourced native factors. Integrated energy never multiplied by time again; purchases are not automatically burned."
      inputs:
        - cp_energy
        - "each native energy/time/conversion operand"
      output: "Actual uncovered compatible energy/fuel quantity"
      source_ids: []
    - id: water_fates
      applies_to: "actual water"
      rule: "Within ONE declared boundary/period and compatible water/moisture state: opening stocks + actual EXTERNAL inflows = mutually exclusive actual EXTERNAL terminal exits + closing stocks + unresolved difference. Enduse is an internal intermediate view, not additional terminal exit; source supply/tank fill internal transfer and contained handover/same receiver acceptance are respectively paired single quantities, not duplicate entry/exit. Retained moisture already in closing material/water stocks is not separately added. Unique transfer IDs, internal/external and terminal/stock-membership roles prove exclusions. Actual vapour/outfall requires independent measurement or supported model; residual remains unknown. Genuine carrier mixture and species component audits are nonadditive, no supply=sewer/evaporation."
      inputs:
        - cp_water
        - "actual sample/source/tank/receiver operands"
      output: "Actual distinct water fates and disclosed unresolved difference"
      source_ids: []
    - id: refrigerant_fates
      applies_to: "actual refrigerant"
      rule: "For each SAME substance/component, boundary, phase and period use exclusive disjoint compartments: O_installed + O_standalone + O_recovered + new_factory_charge_entry + standalone_external_receipts_tare_only + other_external_receipts = C_installed + C_standalone + C_recovered + matched_UNUSED_returns + useful_USED_export + contained_waste + whole_equipment_retained_exit_charge + independently_evidenced_air_release + other_identified_external_fates + unresolved_difference. New factory entry belongs ONLY to equipment entering this boundary during period and absent from O_installed; its manufacture charge belongs once to equipment/provider, not another standalone refrigerant manufacture. Recovered O/C are SEPARATE from standalone O/C and cannot also be inside them. Internal additions/recovery transfer between compartments cancel only on the consolidated audit and do not become new input/output. Whole-equipment retained exit content is a nonadditive component of that equipment handoff, not a second charged refrigerant waste exchange. Used exports/recovery retain original burden and cannot reduce new manufacture as UNUSED return. No unmatched stock residual becomes release: absent independent fate evidence remains unresolved even if a balance closes. Reconcile native component fractions, factory/new-entry timestamps, every real external gate and covered provider stage; stock_exclusive and stock_balance determine actual manufacture/service exchange representation without duplicating this nonadditive audit."
      inputs:
        - cp_refrigerant
        - stock_balance
        - "actual charge/recovery/receiver operands"
      output: "Actual supply/useful/contained/air/stored fates without duplication"
      source_ids: []
    - id: freight_sum
      applies_to: "material cargo"
      rule: "Q_target_freight = sum(actual carried payload_k * actual leg_distance_k * actual repeat_k * actual target_share_k) over unique actual load-legs; EACH repeat only once, TOTAL unchanged. Payload includes carried wet content/packaging/supports, use directly measured packed payload unchanged, or subtract matched non-cargo tare once from the loaded gross measurement. Apply normalize_once once after sum; actual passengers not freight cargo."
      inputs:
        - cp_freight
        - "actual independent mass/distance/repeat/share operands"
      output: "kg*km per reference on compatible units"
      source_ids: []
    - id: species_amount
      applies_to: "actual direct pollutant"
      rule: "Use actual measured substance amount OR actual activity * an independently sourced applicable factor with dimensional/state/basis conversion; concentration * SAME sample/interval flow only with compatible units. Preserve actual substance versus elemental basis, particle size, receiving medium and provider exclusions. Each actual exchange separate; missing necessary species/factors block complete use instead of default zero."
      inputs:
        - cp_emissions
        - cp_refrigerant
        - "actual native activity/factor/sample/conversion operands"
      output: "Actual species/medium amount"
      source_ids: []
    - id: land_phase
      applies_to: "actual land"
      rule: "Actual occupation = sum(nonoverlapping actual area * actual compatible interval duration) by land category/owner; actual transformation-from/to pairs share real event/footprint and are not annual/nightly repetitions. Reconcile provider/asset current/full-life land phases before attribution, native conversions and normalize_once. Unknown footprint/category/history is a collection gap."
      inputs:
        - cp_land
        - "actual native area/time/calendar/event operands"
      output: "Actual exclusive m2*a occupation and m2 transformation"
      source_ids: []
  data_quality_requirements:
    - id: physical_service
      applies_to: "reference and qualifiers"
      requirement: "Declare actual equivalent service-version, exclusivity/sleeping readiness/access, configuration, supplied intervals/segments/package and acceptance, moves/reversals/partials; no fixed quantity or commercial proxy."
      evidence: "cp_journeys actual plans and acceptance"
    - id: native_each_operand
      applies_to: "every raw or derived operand"
      requirement: "Require per-operand native_unit,basis,method,state,sample_time,source_ref,value and uncertainty; validate dimensions/state/time/consumer compatibility before arithmetic. No shared row badge or inferred unit conversion."
      evidence: "All CP independent operand records"
    - id: actual_shared_closure
      applies_to: "moving vehicle/energy/asset/pool"
      requirement: "Actual formation and split/join/time membership, all users/outputs, chosen causal drivers and stage owners must close full duty. Necessary empty/stabled/failed/idle responsibility and N0/carry have actual final owner/disposition."
      evidence: "cp_rail; physical_precedence; necessary_pool"
    - id: full_life_actual
      applies_to: "providers and capital"
      requirement: "Actual full-chain stage matrix includes manufacture-install-maintain-replace-EOL, upstream resources and actual receivers across all users; actual missing stages completed integrated once and identical coverage excluded before complete final data."
      evidence: "cp_providers/cp_assets completed dataset/source/native owner links"
    - id: stock_state_fates
      applies_to: "materials/water/refrigerants"
      requirement: "Same-source/state UNUSED gross+return versus consumed/OMIT exclusive; used recovery retains burden; all actual mixtures/nonadditive components/medium and receiver fates evidenced, residual unresolved."
      evidence: "cp_stock/water/refrigerant/fates and actual acceptance"
    - id: uncertainty_identity
      applies_to: "ranges and identities"
      requirement: "No unsupported numerical ranges/lifetimes/factors, default absent inputs or missing-data zero. Verify actual concrete exchange identity/property/unit before final TIDAS binding; conditional umbrella expands by actual distinct material/species/state/medium."
      evidence: "Actual source/measurement and verified identities, explicit missing-data/use limits"
    - id: representative_route
      applies_to: "duration/route/package aggregation"
      requirement: "Single defined equivalent actual journey/service version; unlike actual routes/durations/packages/configurations are not silently averaged. Any reviewed physical equivalence and weighting retains every contributor, native driver/source and sensitivity."
      evidence: "Actual contribution/segment/version dataset and justified equivalence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final output"
    rule: "Require matching real output card/name/reference link, 1 Item(s), verified Count supports and actual exclusive sleeping service qualifiers. No ticket/passenger-km/bed/seat/night equivalence, duplicate move/split output or unfulfilled/unknown episode counted."
    source_ids: []
  - rule_id: validate_rail_partition
    applies_to: "movement and shared resources"
    rule: "Require actual train-coach-segment-configuration/time/all-user ledger, formation split/join and real driver/coverage ownership. Accommodation/transport/dining shares close actual duty once; no full-train duplication or fare-driven omission. Actual idle/empty/reposition/stabling/failure ownership and N0 carry/disposition complete."
    source_ids:
      - cs-current-trains
      - cs-traction-depot-eir-2025
  - rule_id: validate_providers_life
    applies_to: "all providers and assets"
    rule: "Reject absent actual stage completion, generic outsourcing claims, pending supplements treated as actual, lifetime targetN denominator or omitted full vehicle/rail/station/depot/fitout/linen life. Check all-user observed+remaining sourced life OR actual terminated total, native driver compatibility, uncertainty and no repeated provider/own EOL or manufacturing stages."
    source_ids: []
  - rule_id: validate_native
    applies_to: "every operand/formula"
    rule: "Each independent raw/factor/share/duration/lifetime/conversion has native unit,basis,method,state,sample_time,source_ref. Reject incompatible material/time/unit/state, instant/nameplate energy, repeated integrated kWh*time, misplaced freight share/repeat and repeated normalization."
    source_ids: []
  - rule_id: validate_stock_fates
    applies_to: "actual supplies/water/refrigerants/receivers"
    rule: "External net receipt means tare removed only unless consumed choice explicit. Matched same-source/state UNUSED gross+return OR consumed-minus-return/OMIT exclusive; used recovery is not unused/virgin credit. Reject unidentified combined streams, wrong media, water vapour as liquid waste, inventory residual as emission and absent necessary collection treated as zero."
    source_ids: []
  - rule_id: validate_failed_outputs
    applies_to: "failed/partial/task states"
    rule: "Link each failed preparation/out-of-order/rejected linen/material/interruption event to actual repair/reclean/redeploy/return/held/receiver and burden owner. No failed or unresolved state as full accepted output; remedy/cleaning/handoff is not another journey."
    source_ids: []
  - rule_id: validate_package_route
    applies_to: "actual included food/support"
    rule: "Actual included goods/food/lounge/sanitation and all their physical stages remain complete once; independent dining is a real other output. Unreviewed actual independent engine/kitchen/laundry/conversion production or missing actual coverage blocks complete package use; no invented universal route or perguest quantity."
    source_ids:
      - cs-during-trip
      - nightjet-sleeping
  - rule_id: validate_evidence
    applies_to: "final data and bilingual projection"
    rule: "Same boundaries, card/rule/protocol IDs, actual units and required metadata in EN/ZH/generated projection; actual sources support claimed scope. Missing generic ranges/UUIDs remain explicit limitations and necessary actual collection; no fabricated match/factor/source or unsupported full-chain/publication claim."
    source_ids: []
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for actual private rail sleeping-compartment accommodation, with downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset only after actual physical stage completion, source/identity verification and review for declared equivalent service/route/package"
  allowed_use: "Actual exclusive sleeping-compartment service within evidenced moving-vehicle/transport/all-user/provider/lifecycle boundary and actual native quantities"
  excluded_use: "Shared berth, seat-only, stationary room/day/night, full passenger transport or dining alone; unlike journey/package default equivalence; commercial allocation; missing actual stages/necessary quantities or unresolved final exchanges as complete verified data"
  required_metadata: "Actual operator/geography/time, train/coach/compartment service-version and all segments/configurations, exclusivity/acceptance/partials, actual users/guests/package, provider/stage/receiver/asset and land ownership, native per-operand metadata and allocation/carry/normalization representation"
