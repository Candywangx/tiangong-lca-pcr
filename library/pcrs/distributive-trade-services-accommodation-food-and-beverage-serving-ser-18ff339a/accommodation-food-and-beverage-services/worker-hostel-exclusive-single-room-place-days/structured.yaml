validation_rules:
  - rule_id: valid_actual_assignment
    applies_to: "worker_hostel_room_day"
    rule: "Verify physical_residential_delivery, assigned_room_reference and fulfilled_place_days against actual received room handover, ongoing readiness/access/exclusive retention and all actual absences/closures/releases/substitutions/terminations. Initial unreceived or paid-no-show output is invalid. Same resident move keeps one fulfilled time output and both real room resource segments."
    source_ids: []
  - rule_id: valid_full_output_set
    applies_to: "outputs and shared scopes"
    rule: "Enumerate all actual assigned residential, visitor/conference, tenant and other physical service outputs and handoffs with native quantities and configuration/time. Nonresident kitchen/common/dining users remain real shared-resource consumers where present. Intended lodging/ancillary outputs differ from usable materials, residues and waste. No room plus its included bed double output, no assumed resident=visitor-night, no fee/revenue/employee/student status allocation or automatic recovery credit. Resource-specific actual direct trace first or evidenced compatible complete physical drivers."
    source_ids: []
  - rule_id: valid_resource_responsibility
    applies_to: "all resources"
    rule: "Verify physical_pool_closure and actual_resource_pool, complete compatible other consumers/periods and nonadditive shared duty ownership. Necessary idle/failure/N0 duties require real carry-to-final-resolution; no unknown burden may disappear. Positive exactly same-scope N_target divides actual assigned resource total once."
    source_ids: []
  - rule_id: valid_complete_life_package
    applies_to: "assets and providers"
    rule: "Verify complete_life, complete_asset_life and actual_asset_equivalent full observed plus sourced remaining life, full real provider/underlying stage coverage and actual completed supplements. Apply actual_package_route without dropping actual included food/transport or replacing self-operated production by a generic service label. Unreviewed real production expansion or incomplete package blocks use."
    source_ids: []
  - rule_id: valid_stock_and_fluid
    applies_to: "materials and refrigerants"
    rule: "Verify actual_supply_stock and actual_fluid_ledger. Opening/receipt/closing/UNUSED returns are exclusive; gross+return and consumed-only/OMIT conventions cannot mix. USED fluid recovery/export is separate actual received state, not a deduction from new material manufacture. Internal loop/stored recovery and retained equipment contents remain nonadditive."
    source_ids: []
  - rule_id: valid_distinct_streams
    applies_to: "receiver and environment flows"
    rule: "Expand each actual distinct material/state/receiver stream. True whole mixture/component/whole-object views are nonadditive. Contained sewer/fluid is Waste; actual direct liquid outfall uses documented environment; actual water vapour is Mass to air. Named species and independent actual source/measurement or compatible factor are mandatory. Unknown balance difference or failed identity lookup proves neither absence nor zero. Provider/fullasset/freight/treatment stages occur once."
    source_ids: []
  - rule_id: valid_basis_and_operations
    applies_to: "textile utility freight and every operand"
    rule: "Actual dry-textile laundry service is not new textile or wet cargo. SAME-sample water-only dry/wet conversion and sourced percent ratio are required; EACH repetition once and TOTAL unchanged. Packed freight retains contents/support; subtract only vehicle noncargo tare. Apply THAT-record compatible all-user share inside unique load-leg sum, then positive same-scope N_target once. Unsupported actual equivalence, medium, quantity or provider stage blocks data use."
    source_ids: []
  - rule_id: valid_truthful_candidate
    applies_to: "all concrete exchanges"
    rule: "Every final exchange requires verified actual identity/state/configuration/support and native measured/source-backed quantities with declared duties complete. Missing UUID or generic numeric range may remain an explicit restricted candidate gap; inventing a value or near UUID is prohibited. Checker pass is not proof of external binding, scientific review or publication readiness."
    source_ids: []
  - rule_id: valid_land_interfaces
    applies_to: "site_land_occupation; site_land_transformation"
    rule: "Actual site/land occupation and any evidenced historical or new transformation are physical interfaces separate from Count assets. Collect actual area, occupation duration/interval, land state/source/location and any real from-to transformation state/date/area, lifecycle stage and responsible owner. Use native area*time for occupation and native area for actual transformation, with sourced native conversion only where required. Do not infer a habitat/soil class, land-type conversion factor or a transformation merely because the current site exists; unknown applicable historical/new transformation is a data gap. Land embodied in a complete building/site/provider is linked as the same physical interface and not added twice. Actually complete a real missing land duty once before full-chain use; a disclosure or asset count cannot substitute for physical area/time."
    source_ids: []
  - rule_id: validate_dedicated_classification_gate
    applies_to: "worker_hostel_room_day"
    rule: "This PCR applies only to self-catering private single-person furnished bedrooms continuously assigned to workers in a workers hostel or camp. Record the actual worker-accommodation purpose, operator/site and assignment, including seasonal or short-term arrangements without imposing a default stay duration. Student residence, visitor accommodation and unrelated residential purposes are separate outputs. A work roster, employment benefit or paid licence does not establish delivered accommodation. Hot-bedded shift sharing, shared bedrooms, whole apartments and catered camp production routes are outside this selected single-room route. Dedicated scope eligibility and the actual completed output gate must both be evidenced. Keep other classifications and incompatible configurations out of N_target, but retain all real other consumers, idle duties and full-lifecycle burdens in their appropriate resource pools. Unknown eligibility blocks use; it is not zero."
    source_ids:
      - unsd-cpc3-residential
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and completeness review"
  downstream_use: "Foreground and downstream models of one Actually delivered worker-hostel exclusive single-room place-day"
  allowed_use: "This PCR applies only to self-catering private single-person furnished bedrooms continuously assigned to workers in a workers hostel or camp. Record the actual worker-accommodation purpose, operator/site and assignment, including seasonal or short-term arrangements without imposing a default stay duration. Student residence, visitor accommodation and unrelated residential purposes are separate outputs. A work roster, employment benefit or paid licence does not establish delivered accommodation. Hot-bedded shift sharing, shared bedrooms, whole apartments and catered camp production routes are outside this selected single-room route."
  excluded_use: "Unreceived paid/no-show offers; released/closed/unusable/repurposed periods; shared bedroom/hot-bedded shift turnover/couple/family/whole self-contained units; occupied visitor-night or nominal capacity conversion; mobile sleeper or recreation camp package; true unreviewed onsite production or incomplete included meal/transport/package scope"
  required_metadata: "Actual operator/site/private bedroom/configuration and resident-assignment handover/access/readiness/exclusive-retention, actual received/absence/closure/release/substitution/termination/reversal; sourced day start/end/timezone/UTC-offset/DST/elapsed duration; real selfcatering/common/provider/package obligations; all actual resident/visitor/conference/tenant/nonresident outputs/handoffs; native all-user physical drivers, full asset/linen life/provider/receiver coverage and resolved crossperiod pools; actual land occupation area/time and evidenced historical/new transformation from/to/source/date/stage/owner with same-interface provider/asset coverage and completed missing duties"
  required_quality_disclosure: "Actual measured versus estimated raw units/bases/methods/state/sampletime/source/calibration/coverage/uncertainty/sensitivity/update; concrete/support identity, native quantity, substance/medium/lifetime/assignment/coverage gaps. No generic range alone proves error or zero; any unresolved material physical duty blocks final chain use; unresolved applicable land history/state/quantity/owner/coverage blocks full-chain use"
  update_trigger: "Actual assignment/exclusivity/room topology or service-day convention; package meal/transport/provider/laundry/common-user obligations; new actual independent production route; full asset life, stock provenance/fate/receiver, metering or identity evidence changes"
data_sources:
  - id: "unsd-cpc3-residential"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 explanatory notes30June2025,printed355–356; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only:63210 student institution residences excludes summer visitors and conferences to6311;63220 workers can be seasonal/shortterm. Does not define this physical reference or allocation formula."
  - id: "stantony-2026-27"
    type: "handbook"
    reference: "https://www.sant.ox.ac.uk/study-here/accommodation/"
    used_for: "Current2026–27 continuous residence arrangements may span Christmas/Easter; furnished rooms/shared kitchens and bathrooms support current physical scope. No licence duration, rent or furnishing default imported."
  - id: "exeter-residences"
    type: "handbook"
    reference: "https://www.exeter.ox.ac.uk/students/accommodation/"
    used_for: "Vacation room moves and conference/admissions use, shared self-catering graduate kitchens, nonresident common-facility users and separate family-flat configurations require real period/output boundaries. No default residence term, charge or lifecycle value."
  - id: "southampton-2026-27"
    type: "handbook"
    reference: "https://www.southampton.ac.uk/student-life/accommodation/fees-contracts/halls/agreement"
    used_for: "One current operator identifies actual allocated/substituted rooms, entry keys, repair/service duties, possible cancelled late-arrival reassignment and package-dependent food/transport. Payment is not physical output. No legal conclusion or legal/time/meal default is imposed."
  - id: "ucl-home-2026-27"
    type: "handbook"
    reference: "https://www.ucl.ac.uk/study/accommodation/current-residents/moving/welcome-information"
    used_for: "Current2026–27 checkin room inventory, actual lockout support/maintenance/inspection, provider shared cleaning versus resident tidying, separate paid laundry/provider and resident supplies support collection questions. No service frequency or operating hours adopted as default."
  - id: "skilouise-staff"
    type: "handbook"
    reference: "https://www.skilouise.com/contact-us/careers-employment/"
    used_for: "Current CharlestonResidence has lockable single-person bedrooms, shared equipped kitchen/living/bath/laundry and confirmed allocation/tenancy distinct from application. Other shared/couple variants and employment shuttles/benefits require actual product/package evidence; no room count, rent, roster or automatic completed service claimed."
  - id: "stayover-route-limit"
    type: "handbook"
    reference: "https://stayover.com.au/accommodation"
    used_for: "Current worker offer includes onsite chef-prepared food, variable rooms, servicing/laundry and checkout/key-return versus permanent-room exception. It limits automatic application: such real included food and production cannot be deleted or universally assumed covered by this accommodation method. Permanent-room label alone does not prove continuing access/readiness."
