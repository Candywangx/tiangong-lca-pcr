product_category_identity:
  canonical_pcr_id: "pcr.worker-hostel-exclusive-single-room-place-days"
  classification_refs: "CPC 3.0:63220 (narrower)"
  covered_products: "This PCR applies only to self-catering private single-person furnished bedrooms continuously assigned to workers in a workers hostel or camp. Record the actual worker-accommodation purpose, operator/site and assignment, including seasonal or short-term arrangements without imposing a default stay duration. Student residence, visitor accommodation and unrelated residential purposes are separate outputs. A work roster, employment benefit or paid licence does not establish delivered accommodation. Hot-bedded shift sharing, shared bedrooms, whole apartments and catered camp production routes are outside this selected single-room route."
  excluded_products: "Unreceived paid/no-show offers; released/closed/unusable/repurposed periods; shared bedroom/hot-bedded shift turnover/couple/family/whole self-contained units; occupied visitor-night or nominal capacity conversion; mobile sleeper or recreation camp package; true unreviewed onsite production or incomplete included meal/transport/package scope"
  representative_product: "Actually delivered worker-hostel exclusive single-room place-day"
  production_route: "Actual received room handover -> continuously maintained exclusive private-room residential availability plus real common services -> actual move/release/termination and physical next-use/receiver handoffs"
  market_state: "Delivered maintained residential accommodation service, not sale of room/bed/assets, ownership, employment benefit, paper licence or booking"
functional_unit:
  what: "Actually delivered worker-hostel exclusive single-room place-day"
  how_much: "1 Item(s)"
  how_well: "One established resident in one actual exclusively retained operable private single bedroom, real ongoing access/readiness and actual complete selfcatering accommodation/package duty; no human-presence-every-night requirement"
  how_long_or_cycle: "Sourced actual local residential service-day duration with actual fulfilled nonoverlapping time, timezone/UTC-offset/DST/elapsed intervals; term/vacation/roster/task/stock/reporting/full-life phases kept distinct"
  reference_flow_link: "worker_hostel_room_day"
system_boundary:
  rules:
    - rule_id: physical_residential_delivery
      applies_to: "residence_operation"
      rule: "N_target is the sum of actual nonoverlapping fulfilled exclusive resident room-place time divided by the sourced matching service-day duration in one frozen compatible site/profile. Each resident-assignment-service-day ID and its actual start/end/timezone/UTC-offset/DST/elapsed interval is reconciled once. Count only after actual initial resident handover/receipt and real entry arrangements are established, and only while that private single-person bedroom is operable, accessible, exclusively retained against other users and supported by declared accommodation duties. Temporary absence may count only with continuing actual access/readiness/retention evidence; physical presence every night is not required. Initial unreceived offers, paid no-shows, cancelled/terminated/released/closed/unusable or repurposed intervals are not fulfilled time. Actual replacement room segments under one continuing resident service make one nonoverlapping place-time output with both rooms resources retained. Do not add old/new rooms or turn two shift residents into two exclusive whole-room days. Unknown handover, condition, access, exclusivity or time blocks output, not default fulfillment. Source the local day convention and actual duration; do not assume24hours or convert fees/weeks/terms/months/occupied nights to room-days."
      source_ids:
        - southampton-2026-27
        - stantony-2026-27
        - ucl-home-2026-27
    - rule_id: complete_life
      applies_to: "all assets and resources"
      rule: "Collect complete manufacture, installation, fitout, maintenance, actual replacement and end-of-life for buildings, beds/mattresses, furnishings, equipment, textiles and reusable supports across all users and periods. Compatible lifetime driver is observed all-user history plus sourced remaining productive-equivalent service OR actual terminated total, with each independent native quantity/equivalence/unit/basis/method/state/time/source, uncertainty, sensitivity and update. Annual N_target is not lifetime. Calendar/capacity-time drivers must include idle responsibility in attributable numerators too; productive-service drivers require complete actual and sourced remaining use and full burden closure. One complete asset/provider coverage OR exclusively supplemented missing stages, never both; missing actual stages must actually be integrated once with native quantities/source/owner/coverage links before full-chain use."
      source_ids: []
    - rule_id: actual_package_route
      applies_to: "accommodation and actual providers"
      rule: "Selected route is a self-catering single-room residential accommodation operation with actual shared kitchen/dining/bathroom/common facilities, furnishing, utilities, access/support, cleaning and laundry responsibility. Resident self-prepared food purchase/manufacture and ordinary private travel are outside this selected accommodation product; actual operator-supplied package duties and resident-origin handling remain. Any real included meal, transport or other ancillary duty requires physically matched complete provider coverage or actual exclusive completion of missing underlying stages once, with native quantities, source, owner and coverage links. A true self-operated kitchen, transport, energy-conversion or industrial-laundry production route requires reviewed module/process expansion before application; a generic service card cannot swallow it. Missing quantities or coverage block a complete package. Restaurant existence, employment benefit or cash credit alone neither proves housing-package inclusion nor licenses deleting a real obligation. Current catered worker-village offers are not automatically in scope."
      source_ids:
        - exeter-residences
        - ucl-home-2026-27
        - skilouise-staff
        - stayover-route-limit
    - rule_id: complete_consumers_and_periods
      applies_to: "all resources"
      rule: "Declare all resident/visitor/conference/tenant and nonresident common consumers across term, vacation, roster, actual absence/readiness, maintenance, replacement, idle and asset-life periods. Trace direct tasks first; record compatible resource-specific physical attribution, carry source/recipient/final resolution and full pool closure. Do not use student-only occupied nights, annual N, payment or nominal room capacity as a universal all-user/lifetime denominator. Actual direct task/meter trace first, OR compatible raw quantity*target_driver/positive COMPLETE all_consumer_driver for that resource scope. Enumerate all real assigned residents, other rooms/visitor/conference/ancillary/tenant and nonresident common users and periods. Necessary same-pool vacancy, standby, blocked-room, failed/cancelled/no-show duties enter pool resource totals before allocation to real output responsibility. Nominal capacity, merely listing idle records, or deleting closed days cannot leave burden unowned. Crossperiod carry retains source, receiving period and final resolution links; unresolved responsibility blocks the final package. Divide assigned target total by positive EXACT same-scope N_target once; already-per-reference records are not divided again; N_target=0 retains raw resources without division."
      source_ids:
        - exeter-residences
    - rule_id: route_and_evidence_limits
      applies_to: "all methods"
      rule: "Sources demonstrate real room/service arrangements and collection questions only. No rent, tax, legal deadline, day length, room count/dimension, cleaning interval, meal count, useful-life value, occupancy factor or emissions factor is imposed. These are foreground collection and proposed accounting rules, not equations quoted from operators. Independent real production technologies require reviewed scope/module expansion; no boiler/chiller/generator/industrial laundry/onsite kitchen assumed."
      source_ids: []
    - rule_id: actual_land_interfaces
      applies_to: "site building and providers"
      rule: "Actual site/land occupation and any evidenced historical or new transformation are physical interfaces separate from Count assets. Collect actual area, occupation duration/interval, land state/source/location and any real from-to transformation state/date/area, lifecycle stage and responsible owner. Use native area*time for occupation and native area for actual transformation, with sourced native conversion only where required. Do not infer a habitat/soil class, land-type conversion factor or a transformation merely because the current site exists; unknown applicable historical/new transformation is a data gap. Land embodied in a complete building/site/provider is linked as the same physical interface and not added twice. Actually complete a real missing land duty once before full-chain use; a disclosure or asset count cannot substitute for physical area/time."
      source_ids: []
    - rule_id: dedicated_classification_gate
      applies_to: "worker_hostel_room_day"
      rule: "This PCR applies only to self-catering private single-person furnished bedrooms continuously assigned to workers in a workers hostel or camp. Record the actual worker-accommodation purpose, operator/site and assignment, including seasonal or short-term arrangements without imposing a default stay duration. Student residence, visitor accommodation and unrelated residential purposes are separate outputs. A work roster, employment benefit or paid licence does not establish delivered accommodation. Hot-bedded shift sharing, shared bedrooms, whole apartments and catered camp production routes are outside this selected single-room route. Dedicated scope eligibility and the actual completed output gate must both be evidenced. Keep other classifications and incompatible configurations out of N_target, but retain all real other consumers, idle duties and full-lifecycle burdens in their appropriate resource pools. Unknown eligibility blocks use; it is not zero."
      source_ids:
        - unsd-cpc3-residential
