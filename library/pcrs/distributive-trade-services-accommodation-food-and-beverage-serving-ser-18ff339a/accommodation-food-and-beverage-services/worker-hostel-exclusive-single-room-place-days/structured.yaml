  calculation_rules:
    - id: fulfilled_place_days
      applies_to: "worker_hostel_room_day"
      rule: "N_target=SUM(unique compatible resident-assignment-service-day:actual fulfilled exclusive operable room-place elapsed time/source-backed matching service-day duration). Execute physical_residential_delivery with native same-sample interval/duration units and actual local day convention. Initial handover/access/readiness/exclusivity, closures/releases and actual move/reversal ledger govern fulfillment. One resident time segment only once; no fee/month/term or default 24-hour conversion."
      inputs:
        - cp_residence
      output: "Actual delivered single-room residential place-day N_target"
      source_ids: []
    - id: actual_resource_pool
      applies_to: "all service rows"
      rule: "Execute physical_pool_closure: actual direct trace first, otherwise compatible raw_quantity*target_driver/positive_complete_all_consumer_driver for THAT resource scope; preserve necessary idle/failure/cancelled duties and actual final resolution of carry/N0. Then positive exactly same-scope N_target once unless already per reference."
      inputs:
        - cp_residence
        - cp_utilities
        - cp_tasks
        - cp_providers
      output: "Actual exclusively attributed quantities per reference"
      source_ids: []
    - id: actual_utility
      applies_to: "electricity; purchased_useful_heat; water_supply; electricity_ac; purchased_useful_heat_delivered_heat; water_supply_liquid_tap"
      rule: "Actual utility quantity uses compatible (register_end-register_start+register_adjustment)*meter_multiplier*native_conversion_factor OR interval_quantity*native_conversion_factor, never both. Apply factors only if not already applied. Actual interval-average power*matching elapsed_duration converted compatibly only if not already integrated; no nameplate default. Purchased useful thermal delivery and direct carrier/assets separate. Actual complete user attribution then positive same-scope N_target once."
      inputs:
        - cp_utilities
        - cp_residence
      output: "Actual supplied utility per residential place-day"
      source_ids: []
    - id: actual_supply_stock
      applies_to: "operating_materials; actual_fuels; unused_supply_returns; operating_materials_synthetic_detergent"
      rule: "S=assigned opening+inbound external receipts measured as net material after container tare, with NO outbound return deducted-closing including retained recovery, with actual material receipts excluding container tare. Choose exactly one: gross S/N_target INPUT plus actual matched UNUSED external return/N_target separate OUTPUT; OR consumed-only (S-matched_unused_return)/N_target INPUT and OMIT that matched return OUTPUT. No adding returns to input, double deduction, unrelated negative netting or automatic avoided-production credit. Internal loops are not new external supply; spent material retains original supply burden. Retained recovery included in closing; actual fuel burn, waste and material use are independently reconciled, not equated to purchases."
      inputs:
        - cp_supplies
        - cp_residence
      output: "Exclusive supply/UNUSED-return representation"
      source_ids: []
    - id: actual_linen_basis
      applies_to: "laundry_service; linen_lifetime; freight"
      rule: "Laundry_service is actual completed dry-textile throughput or supported actual native service result, including evidenced rewash once. For SAME-sample water-only definitions w_wet=water_mass/as_received_sample_mass and r_dry=water_mass/nonwater_mass, w_wet=r_dry/(1+r_dry) and nonwater_mass=as_received_sample_mass*(1-w_wet); percent first uses sourced percent_to_ratio_factor. Other volatiles/soil not water or clean fibre. Wet cargo is not dry service or new manufacture. Actual provider life/operations/rental/transport/effluent coverage once, missing actual duties actually completed before use."
      inputs:
        - cp_linen
        - cp_assets
        - cp_residence
      output: "Actual independent textile service state and asset evidence"
      source_ids: []
    - id: actual_asset_equivalent
      applies_to: "linen_lifetime; building_room_assets"
      rule: "With compatible supported dimensional equivalence and positive complete lifetime_all_user_driver, asset_equivalent=asset_native_quantity*driver_equivalence_factor*job_used_driver/lifetime_all_user_driver. Lifetime driver is compatible observed_life_driver+sourced remaining_life_driver OR actual terminated total, covering all users/periods. Full real lifecycle once; provider-covered stages not repeated. Idle/calendar driver responsibility retained in target numerators, not annual N or nominal capacity as lifespan. Actual missing stages and carry links completed before full-chain use; assigned period/cohort equivalents then positive same-scope N_target once, already per-reference unchanged."
      inputs:
        - cp_assets
        - cp_residence
        - cp_providers
      output: "Supported complete-life asset service per reference"
      source_ids: []
    - id: actual_provider_service
      applies_to: "contracted_support; included_ancillary_service"
      rule: "Actual provider quantity=SUM(exclusive actual native quantity*supported physical equivalence only if not already converted*actual compatible documented share only if not already attributed). Require actual_package_route complete physical duties, native service quality and all-client scope; actual completed missing stages occur once. Then divide by positive exactly same-scope N_target once unless already per reference."
      inputs:
        - cp_providers
        - cp_tasks
        - cp_residence
      output: "Complete physical provider and actual ancillary service"
      source_ids: []
    - id: actual_record_freight
      applies_to: "freight"
      rule: "For each unique actual load-leg, packed payload is measured directly OR compatible vehicle_gross-vehicle_noncargo_tare after native conversions. Retain actual wet contents/pack/support. EACH multiplies actual repeat_count once, TOTAL unchanged. Assigned_work=SUM(unique load-leg:payload*distance*THAT_record_share) in compatible native work units, where THAT-record share uses actual compatible target/positive COMPLETE all-consumer driver INSIDE sum. Then positive exactly same-scope N_target once, already attributed/per-reference not repeated. Actual provider/laundry/receiver/empty-return coverage and necessary failed pool duties retained."
      inputs:
        - cp_freight
        - cp_residence
      output: "Actual unique transport work per reference"
      source_ids: []
    - id: actual_fluid_ledger
      applies_to: "refrigerant_supply; recovered_fluid_exports; contained_refrigerant_waste"
      rule: "Reconcile opening_installed+opening_stored_total+new_factory_charge_entry+net_standalone_receipts+other_external_receipts with closing_installed+closing_stored_total+unused_external_returns+used_usable_export+contained_waste_export+retained_equipment_exit+independently_evidenced_direct_release+explicit_unknown. Stored totals INCLUDE retained recovered substock: recovery is a nonadditive view, not another stock added. Lot/charge/role IDs are exclusive; new factory entry only if not in opening or another receipt, other receipts/exits exclude all named terms, internal charging/recovery cancels. Factory-charge production is in fullasset OR an explicit missing-stage supplement once. Consumed-only deduction/OMIT applies ONLY to same-source same-state evidenced UNUSED standalone substock and its matched unused return. All USED recovered fluid, whether original factory charge or later make-up, is recorded at actual useful export state, not automatically equivalent to unused new supply, not deducted from new manufacture and not a negative input/automatic credit. Retained content in whole/part/mixed waste is nonadditive, not an additional fluid exit. Top-up, recovery or unexplained residual establishes neither direct release nor zero. Here net_standalone_receipts is inbound material mass after container tare only: no outbound UNUSED return, USED recovery export or waste exit has already been deducted. Other external receipts use the same inbound-only convention and exclude every separately named entry."
      inputs:
        - cp_refrigerants
        - cp_assets
        - cp_species
      output: "Exclusive actual fluid origin stock and fates"
      source_ids: []
    - id: actual_received_streams
      applies_to: "all receiver interfaces"
      rule: "Each actual distinct received material/state/receiver has its own native net quantity/source. Choose genuine whole mixture OR exclusive component exchanges; audit components nonadditive. Retained liquids in cloth/whole equipment not additional free-liquid exit. Contained sewer/free liquid uses Waste; actual liquid environmental outfall uses Elementary with actual medium; actual air vapour needs Mass species. Purchased water minus unknown residual is not wastewater/outfall/vapour or zero. Provider/fullasset EOL/transport/treatment once, actual missing receiver duties explicitly completed."
      inputs:
        - cp_fates
        - cp_waterstate
        - cp_assets
        - cp_providers
      output: "Actual mutually exclusive Product Waste and Elementary interfaces"
      source_ids: []
    - id: actual_species_amount
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Species_quantity=independently measured actual species quantity OR compatible actual_activity*species_factor. Every operand native unit/basis/method/state/sampletime/source and exact reported substance/particle/medium. Apply actual composition/fate/gas conversion only when required and not already covered; gas temperature/pressure each sourced in compatible units. Actual emitted blend composition is not assumed supply composition. No stock residual/top-up/purchase/odour as release or zero. Complete resource attribution and positive same-target N_target once unless already per-reference; actual provider releases not duplicated."
      inputs:
        - cp_species
        - cp_refrigerants
        - cp_residence
      output: "Evidence-supported exact native species per reference"
      source_ids: []
    - id: actual_land_quantities
      applies_to: "site_land_occupation; site_land_transformation"
      rule: "Record actual unique compatible occupation area*actual evidenced duration in source-backed native area-time, or direct actual area-time record, never both. Record actual transformation area only for its evidenced from-to event. Apply actual_land_interfaces all-stage/all-user responsibility and same-interface asset/provider overlap exclusion; then positive exactly same-scope N_target once. No land quantity-to-Count conversion or inferred land class."
      inputs:
        - cp_assets
        - cp_residence
        - cp_providers
      output: "Actual native land occupation/transformation per reference"
      source_ids: []
