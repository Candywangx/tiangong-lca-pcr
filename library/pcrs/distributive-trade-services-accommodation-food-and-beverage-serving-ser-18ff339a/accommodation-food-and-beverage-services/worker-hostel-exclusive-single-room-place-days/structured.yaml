allocation_rules:
  - rule_id: delivered_resident_scope
    applies_to: "all accommodation resources"
    rule: "Only fulfilled_place_days from physical_residential_delivery may enter N_target. Actual resident purpose, bill, nominal capacity or occupied visitor-night cannot replace the actual delivered room-place time. Same-scope physical output and complete duties are mandatory."
    source_ids: []
  - rule_id: complete_output_set
    applies_to: "target and other consumers"
    rule: "Enumerate all actual assigned residential, visitor/conference, tenant and other physical service outputs and handoffs with native quantities and configuration/time. Nonresident kitchen/common/dining users remain real shared-resource consumers where present. Intended lodging/ancillary outputs differ from usable materials, residues and waste. No room plus its included bed double output, no assumed resident=visitor-night, no fee/revenue/employee/student status allocation or automatic recovery credit. Resource-specific actual direct trace first or evidenced compatible complete physical drivers."
    source_ids: []
  - rule_id: physical_pool_closure
    applies_to: "all resources"
    rule: "Actual direct task/meter trace first, OR compatible raw quantity*target_driver/positive COMPLETE all_consumer_driver for that resource scope. Enumerate all real assigned residents, other rooms/visitor/conference/ancillary/tenant and nonresident common users and periods. Necessary same-pool vacancy, standby, blocked-room, failed/cancelled/no-show duties enter pool resource totals before allocation to real output responsibility. Nominal capacity, merely listing idle records, or deleting closed days cannot leave burden unowned. Crossperiod carry retains source, receiving period and final resolution links; unresolved responsibility blocks the final package. Divide assigned target total by positive EXACT same-scope N_target once; already-per-reference records are not divided again; N_target=0 retains raw resources without division."
    source_ids: []
  - rule_id: complete_asset_life
    applies_to: "assets textiles and providers"
    rule: "Apply complete_life and actual_asset_equivalent to complete all-user actual observed and sourced remaining life or actual terminated life, including full site/building/fitout/furniture/textile manufacture-install-maintain-replace-EOL once. Keep calendar/idle versus productive-use driver responsibilities compatible; actual missing stages must be completed, not merely disclosed."
    source_ids: []
  - rule_id: material_stock_choice
    applies_to: "standalone operating materials"
    rule: "S=assigned opening+inbound external receipts measured as net material after container tare, with NO outbound return deducted-closing including retained recovery, with actual material receipts excluding container tare. Choose exactly one: gross S/N_target INPUT plus actual matched UNUSED external return/N_target separate OUTPUT; OR consumed-only (S-matched_unused_return)/N_target INPUT and OMIT that matched return OUTPUT. No adding returns to input, double deduction, unrelated negative netting or automatic avoided-production credit. Internal loops are not new external supply; spent material retains original supply burden."
    source_ids: []
