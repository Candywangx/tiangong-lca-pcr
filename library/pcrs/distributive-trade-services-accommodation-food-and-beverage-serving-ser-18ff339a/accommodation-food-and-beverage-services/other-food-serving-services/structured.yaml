  calculation_rules:
    - id: fulfilled_count
      applies_to: "fulfilled_meal_service"
      rule: "N_target = unique completed compatible service occasion IDs after actual component/gate/reversal reconciliation under service_gate; partials retain separate scope."
      inputs:
        - service_id
        - gate_evidence
        - component_id
        - reversal_id
        - cp_service
      output: "N_target"
      source_ids: []
    - id: attribute_pool
      applies_to: "all inventory rows"
      rule: "Execute all_user_pool per record with direct trace OR compatible raw quantity times that target driver divided by complete positive all-consumer driver; then sum, retain necessary idle/N0/carry responsibility."
      inputs:
        - raw_quantity
        - target_driver
        - all_consumer_driver
        - coverage_id
      output: "assigned_target_quantity"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "Assigned same-profile target quantity divided by positive same-scope N_target once; already-per-reference unchanged; N_target=0 retains source/receiver/final resolution without division."
      inputs:
        - assigned_target_quantity
        - N_target
      output: "per_reference_quantity"
      source_ids: []
    - id: stock_returns
      applies_to: "actual supplies fluids food"
      rule: "Execute returns_exclusive from actual opening/inbound/closing and paired transfers; gross drawn with matched unused output OR net consumed with that output omitted, not both."
      inputs:
        - opening_mass
        - inbound_mass
        - closing_mass
        - paired_transfer_mass
        - unused_return_mass
      output: "exclusive_stock_quantity"
      source_ids: []
    - id: food_reconcile
      applies_to: "food stocks and fates"
      rule: "Execute food_fate_boundary on actual same-basis stock/batch food/component/water states, including actual recipe inputs, served/refill/retained/usable/waste/air fates. Internal transfer and whole/component audits nonadditive; unexplained gap remains unknown."
      inputs:
        - cp_food
        - cp_water
        - cp_fates
        - cp_air
      output: "state_balance_and_gaps"
      source_ids: []
    - id: freight_sum
      applies_to: "freight"
      rule: "Sum actual unique leg packed wet cargo times distance times EACH repetition if applicable times THAT record share inside sum; TOTAL unchanged; provider-covered leg excluded once; normalize_once only afterward."
      inputs:
        - packed_wet_payload
        - distance
        - repetition
        - record_share
        - cp_freight
      output: "attributable_freight"
      source_ids: []
    - id: asset_life
      applies_to: "asset_lifecycle; reusable_lifecycle"
      rule: "Execute full_life_land and full_life_once using complete actual life numerator and compatible observed plus sourced remaining service OR actual terminated total; preserve all users/replacements/EOL and exclusive complete provider stage coverage."
      inputs:
        - cp_assets
        - cp_land
        - cp_providers
      output: "attributable_full_life_duty"
      source_ids: []
    - id: fluid_reconcile
      applies_to: "equipment_fluid_supply; fluid fates"
      rule: "Execute fluid_roles over exclusive opening/receipt/factory entry/closing/recovery/export/release roles; factory new entry absent opening and other receipts; retained contents/whole equipment nonadditive and unknown not release."
      inputs:
        - cp_fluids
        - cp_air
        - cp_assets
      output: "exclusive_fluid_balance"
      source_ids: []
    - id: source_species
      applies_to: "direct_water_withdrawal; other_direct_species; water_vapour_to_air; other_direct_species_co2_fossil_air; other_direct_species_methane_fossil_air; other_direct_species_nitrous_oxide_air"
      rule: "Actual compatible measurement OR sourced activity/factor/composition/fate only with each own unit/basis/method/state/sampling time/source; do not manufacture factor, recipe yield, species or medium."
      inputs:
        - cp_air
        - cp_water
      output: "actual_species_quantities"
      source_ids: []
  data_quality_requirements:
    - id: identity_native
      applies_to: "all exchanges"
      requirement: "Expand conditional actual cards to concrete actual material/species/state/gate/direction/type/property/unit/receiver and verify identity before final exchange. Count support only supports Item(s), not meal equivalence or service identity."
      evidence: "Actual detail/support evidence and native record sources"
    - id: menu_gate_quality
      applies_to: "fulfilled_meal_service"
      requirement: "Actual declared menu/component/recipe/portion/service version and complete supply gate mandatory; unequal profiles not pooled by generic meal or diner count."
      evidence: "cp_service; service_gate"
    - id: native_operand_quality
      applies_to: "all protocols"
      requirement: "Every independent numeric field retains own unit/basis/method/state/sampletime/source including sample composition, factors, area/time, lifetime drivers, target/allconsumer shares and repetitions. Missing quantity is not zero."
      evidence: "Raw metadata field audit"
    - id: full_scope_quality
      applies_to: "all duties"
      requirement: "Actual complete all-output/all-period pool, full asset/land/provider/receiver stages, replaced/retained material and N0 source/receiving/finalresolution must close before complete use."
      evidence: "Coverage matrix and actual completed missing stages"
    - id: honest_source_quality
      applies_to: "all evidence"
      requirement: "Operator pages are qualitative source examples. No source-derived universal recipe/meal mass/nutrition/time/temperature/lifetime/factor/range is asserted; actual compatible site records mandatory. Unavailable identity/numerics remain gaps with restricted use."
      evidence: "Source extent and actual source date/site applicability"
validation_rules:
  - rule_id: validate_category_eligibility
    applies_to: "target reference product"
    rule: "Official CPC 63399 covers other food serving without seating or waiter service, including mobile food services and meals or snacks prepared onsite and dispensed through vending machines. It excludes vending of meals or snacks prepared elsewhere. Selected PCR scope: Only stationary onsite food preparation and related serving without seating and without waiter service, at takeaway or refreshment outlets. Exclude seated or waiter service, contract/concession/event catering classified elsewhere, mobile operations, vending routes, beverage-only service and offsite-only prepared-food supply. Stationary takeaway or refreshment outlets without vending are this PCR's selected method. Mobile and onsite-prepared vending services remain eligible CPC 63399 branches but require a different reviewed method. Verify official classification eligibility and the separate selected-method conditions before counting target output; unknown eligibility or method applicability blocks application. Other actual users remain in complete shared-resource denominators and their burdens must not disappear."
    source_ids: []
  - rule_id: reference_complete
    applies_to: "final output"
    rule: "Check actual compatible service version/portion/components and complete recipient gate, reversals/recook/partials and one positive same-scope N_target. No paid/order/capacity/eaten-only substitute."
    source_ids: []
  - rule_id: route_complete
    applies_to: "onsite_meal_service"
    rule: "Check actual ingredient formulation/treatment input/output states, actual cold/hot operation, served gate and prep/held/refill/reject/rework/retained/useful/waste paths. Excluded commissary/mobile/industrial routes cannot be hidden in generic service."
    source_ids: []
  - rule_id: native_complete
    applies_to: "all exchanges"
    rule: "Check every independent native numeric operand metadata, EACH/TOTAL once, state-compatible conversion, wet/dry/water distinction, exclusive stocks/returns/fluids and full packed freight with each share inside sum."
    source_ids: []
  - rule_id: output_period_complete
    applies_to: "all resources"
    rule: "Check all intended outputs/recipient gates/native amounts, resource-specific full all-user/period drivers and necessary idle/failed/closed duties, N0 carry/finalresolution, same positive N once. Unassigned actual responsibility blocks complete use."
    source_ids: []
  - rule_id: life_provider_complete
    applies_to: "assets providers land"
    rule: "Check full manufacture-install-maintain-replace-EOL/alluser observed+sourced remaining or terminated life; native land area/time and transformation evidence; actual missing stages completed once and precise provider exclusions. Annual N or planned supplements do not pass."
    source_ids: []
  - rule_id: fate_species_complete
    applies_to: "waste elementary"
    rule: "Check actual contained wastewater/waste receiver versus real elementary species/medium, water vapour Mass, pollutant basis/size, independent release evidence, nonadditive whole/components and terminal balance gaps. Unknown residual not emission/zero."
    source_ids: []
  - rule_id: bilingual_projection_identity
    applies_to: "all methodology"
    rule: "Check same EN/ZH IDs/gates/qualifiers/nodes/cards/native units/protocols/rules and deterministic current canonical projection; concrete identity/support unresolved gaps mandatory before final exchange. Checker pass alone not scientific review/publication readiness."
    source_ids: []
  - rule_id: output_stage_check
    applies_to: "all outputs and projections"
    rule: "Check output_role/allocation_stage/lineage/source and actual subdivision or genuine joint-coproduct decision before projection. Other independent output native amounts remain physical ledger evidence, not targetshare products or target co-products after resource allocation. Reject mixed wholepool/targetallocated basis or duplicate allocation; unallocated wholepool only complete input+output closure and one designated step."
    source_ids: []
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
