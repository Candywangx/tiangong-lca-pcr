      raw_fields: "requirement_id=contained_fluid_waste; process_id=apartment_unit_service; required_direction=outputs; required_flow_type=waste; original_collection_protocol=cp_refrigerant; applicability_evidence; occurrence_event_id; concrete_row_id; material_or_service_identity; composition; phase; source_compartment; receiving_compartment; handover_gate; provider_covered_cells; native_property; native_unit; measured_native_quantity; source_record_id; allocation_all_users; normalization_denominator; per_identity_amount_calculation; verification_evidence; unresolved_reason; existing_branch_coverage; occurrence_to_row_reconciliation; paired_transfer_id; paired_concrete_row_id; waste_origin_event; material_or_true_mixture; moisture_basis; container_tare; opening_waste_stock; generated_waste; received_waste; handover_quantity; closing_waste_stock; onsite_treatment; receiver_id; applicability_decision_record; covered_concrete_rows; excluded_occurrence_reason; completion_evidence; observed_quantity_state; conversion_or_allocation_evidence"
      collection_method: "Only independently transferred real contained fluid waste with actual identity/composition/state and receiver/treatment, not direct atmospheric species. Fluid still in a retired appliance/component follows that whole stream and is nonadditive content audit rather than an extra fluid transfer. Range evidence need: Need actual recovery/collection/transfer/source-charge ledger, mixture/components/fate/receiver and whole-asset/retained/direct exclusions, actual treatment ownership once; no default drain or leak. This is a mandatory identification requirement, not an inventory exchange. Retain all original node material, stock, failure/rework, lifecycle and release responsibilities. Create concrete rows for each actual substance/state/independent service/source or receiver/gate, verifying its own native property, unit and quantity; never quantify heterogeneous identities as one total or bind one umbrella UUID. Count occurrences already covered by existing concrete branches once. Missing records prove neither absence nor zero. Match both entries at the same handover by event, physical identity and quantity. Across different gates or periods reconcile dispatch with receipt, net change in transit stock and independently measured losses; whole and component views are nonadditive. A genuine single formulation, physical assembly or receiver mixture retains its own identity without duplicating its constituents. Apply these recording instructions only to the stated outputs/waste identity and gate (Actual contained spent refrigerant or heat-fluid waste). Activate when this process actually generates or receives the specified waste. Record material/formulation or genuine co-collected mixture, wet/dry state, container tare, origin event, stored quantities, handover gate and actual receiver. Reconcile generation + opening stock + receipts = handovers + closing stock + separately recorded onsite treatment. Different separately collected wastes require different rows; one genuine receiving mixture may remain one row, with composition as a nonadditive audit. Useful recovery, customer-retained items and waste are distinct fates; no automatic substitution credit. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Receiver-accepted native quantity of the specific waste or genuinely co-collected mixture in its measured state"
      frequency: "Each actual occurrence and evidenced absence decision"
      temporal_coverage: "Actual unit-night/stay/task/reporting periods and source-to-carry-to-resolution phases"
      site_scope: "Real property/unit/common areas and actual provider/receiver handoffs, every relevant consumer"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "Match generation, retained stock, onsite treatment and measured handover to receiver records. Separate mixed-stream quantity from constituent measurements; wet/dry or mass/volume conversion needs matching composition or density. Receiver transfer and direct environmental release have distinct gates. For a row requiring Mass / kg, verify measurement or conversion to that basis. For the stated physical identity and matching input basis, apply the following quantity rule only at its specified attribution and normalization state: actual compatible attributed independent contained-fluid waste mass/positive_same_scope_N Preserve original records, applied factors and resulting units. Value mode: foreground_record; - Specificity: site_specific; - Normalization basis: per reference flow; - Basis kind: reference_flow; - Evidence kind: collected_record; - Collection protocol: cp_refrigerant Completion gate: check_occurrence_completion."
    - protocol_id: cp_expand_direct_species_release
      process_id: "apartment_unit_service"
      flow_role: "Per-identity identification requirement direct_species_release (outputs/elementary): Actual released substance or particle to a demonstrated receiving medium"
      record_type: "collected_record"
      raw_fields: "requirement_id=direct_species_release; process_id=apartment_unit_service; required_direction=outputs; required_flow_type=elementary; original_collection_protocol=cp_environment; applicability_evidence; occurrence_event_id; concrete_row_id; material_or_service_identity; composition; phase; source_compartment; receiving_compartment; handover_gate; provider_covered_cells; native_property; native_unit; measured_native_quantity; source_record_id; allocation_all_users; normalization_denominator; per_identity_amount_calculation; verification_evidence; unresolved_reason; existing_branch_coverage; occurrence_to_row_reconciliation; paired_transfer_id; paired_concrete_row_id; substance_identity; chemical_form; environmental_compartment; carbon_origin; particle_fraction_or_count_basis; measured_or_calculated_release; species_conversion_evidence; applicability_decision_record; covered_concrete_rows; excluded_occurrence_reason; completion_evidence; observed_quantity_state; conversion_or_allocation_evidence"
      collection_method: "Conditional actual species/particle/medium umbrella, expanded into real independent exchanges. Include actual water vapour to air only when evidenced, and actual combustion/refrigerant/chemical/direct discharge species with native basis. Contained wastewater, captured material, inventory, odour or missing mass is not an elementary release or zero. Identify additional uncovered events and physical identities beyond the independently identified cases direct_species_release_co2_fossil_air; direct_species_release_methane_fossil_air; direct_species_release_nitrous_oxide_air. Record quantities solely on the concrete rows for their events and exclude events already assigned to those cases; a parent total is only a non-additive reconciliation audit. Retain every other actual material/state/source/medium and its own verified identity, native quantity and provider/receiver duty. Do not assume that a conditional case occurs, is absent or has zero quantity when records are missing. Range evidence need: Need real substance/particle definition/medium, independent mass or applicable source activity-factor and required composition/fate scope, capture/contained/asset ownership and sampling/time evidence; no unknown=zero or genericVOC mixture. This is a mandatory identification requirement, not an inventory exchange. Retain all original node material, stock, failure/rework, lifecycle and release responsibilities. Create concrete rows for each actual substance/state/independent service/source or receiver/gate, verifying its own native property, unit and quantity; never quantify heterogeneous identities as one total or bind one umbrella UUID. Count occurrences already covered by existing concrete branches once. Missing records prove neither absence nor zero. Match both entries at the same handover by event, physical identity and quantity. Across different gates or periods reconcile dispatch with receipt, net change in transit stock and independently measured losses; whole and component views are nonadditive. A genuine single formulation, physical assembly or receiver mixture retains its own identity without duplicating its constituents. Apply these recording instructions only to the stated outputs/elementary identity and gate (Actual released substance or particle to a demonstrated receiving medium). Activate for an actual release to its documented receiving compartment, supported by observation or an applicable calculation. Record exact substance/form, source or receiving compartment, fossil/biogenic origin where relevant, particle fraction or count-size basis where relevant and sampling period. Preserve reported elemental versus molecular bases; conversion needs stoichiometry and compatible species evidence. Contained pollutants belong to the receiver stream until the actual environmental release boundary. Do not replace missing species with CO2, NOx, VOC, COD or a generic particulate flow. Explicit branches (activate only on actual applicable records): direct_species_release_co2_fossil_air, direct_species_release_methane_fossil_air, direct_species_release_nitrous_oxide_air. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Verified native property of this substance, resource or physical emission at its actual compartment"
      frequency: "Each actual occurrence and evidenced absence decision"
      temporal_coverage: "Actual unit-night/stay/task/reporting periods and source-to-carry-to-resolution phases"
      site_scope: "Real property/unit/common areas and actual provider/receiver handoffs, every relevant consumer"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "Match sampling or activity and applicable factor to species, phase, origin and compartment. Keep mass, particle number, heat and elemental-equivalent bases separate where applicable; document any conversion and exclude overlapping totals. For a row requiring Mass / kg, verify measurement or conversion to that basis. For the stated physical identity and matching input basis, apply the following quantity rule only at its specified attribution and normalization state: actual compatible attributed measured species OR applicable activity-factor path with only necessary composition/fate, then /positive_same_scope_N Preserve original records, applied factors and resulting units. Value mode: foreground_record; - Specificity: site_specific; - Normalization basis: per reference flow; - Basis kind: reference_flow; - Evidence kind: collected_record; - Collection protocol: cp_environment Completion gate: check_occurrence_completion."
  calculation_rules:
    - id: occupied_n
      applies_to: "cp_stays"
      rule: "N=count_unique_eligible(delivered_unit_night_service_id) for actual active occupied visitor service after reversals and room-change reconciliation. A substitution within the same delivered service-night links all actual unit/time segments to one service_id without duplicate N; retain resources of both segments. Two separately provided units are distinct actual service_ids, not collapsed because one reservation. Use declared local service-night calendar/timezone/DST and actual interval; eligible complimentary service counts, canceled/no-show/unprovided nights do not. A declined, skipped or failed cleaning task alone does not make an actually delivered eligible accommodation night rejected. No division at N0; preserve raw pool resources through source/carry/receiving-period/resolution links; unknown responsibility blocks finalization."
      inputs:
        - "Actual delivery/night/stay/topology/occupancy/transfer records"
      output: "Actual same-scope occupied-unit-night denominator"
      source_ids: []
    - id: resource_scope
      applies_to: "cp_utilities; cp_water; cp_operations"
      rule: "For each record, raw attributed_resource=compatible_converted_raw_quantity*that_record_documented_share; already_attributed records use their actual attributed quantity unchanged. Sum mutually exclusive records for target_cohort, then q_per_reference=raw_target_cohort_quantity/positive_same_target_N only once. Already_per_reference values not divided again. Reconcile all consumers and complete periods before normalization."
      inputs:
        - "Record scope"
        - "units/conversion"
        - "native numerator/denominator"
        - "all-user records"
        - N
      output: "Actual attributed resource per one unit-night"
      source_ids: []
    - id: meter_or_average
      applies_to: "cp_utilities"
      rule: "Actual energy is directly integrated meter/import-register quantity or actual interval-average power*matching elapsed_duration after sourced native conversion. Average power must cover actual cycling/standby/fans/defrost in that interval; instantaneous/nameplate rating is not consumed energy. Already integrated kWh is not multiplied by duration. Purchased heat and fuel/on-site conversion scope exclusive; combustion species separately evidenced."
      inputs:
        - "Native import registers/factor or actual interval-average/elapsed time and coverage"
      output: "Actual site energy before attribution"
      source_ids: []
    - id: supply_stock
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing including retained recovery in closing; net_receipts=receipt_gross-container_tare only on matching actual material/state units. Gross S INPUT plus paired unused_outward_return OUTPUT OR consumed S-unused_outward_return INPUT and OMIT matching OUTPUT. EACH quantities times matching actual count once/TOTAL unchanged; actual per-piece/density-temperature conversion. Raw all-user share then same-scope N once."
      inputs:
        - "Actual net stocks"
        - "extent/count"
        - "conversions and matched unused return"
      output: "Exclusive material input/return convention"
      source_ids: []
    - id: linen_cycle
      applies_to: "cp_linen"
      rule: "Count actual distinct textile IDs/batches and real wash/change events; clean_dry_textile_mass, used_wet_loaded_mass, contamination/retained water and container tare are separate. dry_nonwater_mass=wet_sample_mass*(1-w_wet) only actual water/as-received wet fraction; compatible same-sample w_dry=water/dry_nonwater converts w_wet=w_dry/(1+w_dry) after percent-to-ratio conversion. Dry non-water may include soil and is not automatically clean fibre. Actual laundry service unit conversion and textile lifecycle driver require sourced compatible clean/used state, never nominalkg or number of beds."
      inputs:
        - "Textile/event/mass/water definitions and provider service-unit source"
      output: "Actual linen circulation/service and lifecycle allocation audit"
      source_ids: []
    - id: complete_lifetime
      applies_to: "cp_assets; cp_linen"
      rule: "lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. asset_equivalent=event_quantity*job_driver/lifetime_all_user_driver, summed over exclusive complete-life events; actual same-scope N once. Reusable linen manufacture/replacement/EOL follows observed+sourced remaining real use/care cycle service with all users and wastage retained; no new complete linen set each unit-night or annualN as lifetime."
      inputs:
        - "Complete life event/native job-observed-remaining/equivalence/owner records"
      output: "Full-life building/equipment/textile service burden"
      source_ids: []
    - id: complete_provider
      applies_to: "cp_providers"
      rule: "provider_service=sum(actual_native_quantity*physical_equivalence_if_not_already_converted*documented_share_if_not_already_attributed), with explicit raw/converted/attributed state. Native physical equivalence and all-user share must match provider unit/quality/coverage. Add actually missing upstream/material/energy/water/chemical/effluent/treatment/asset/freight stages once before complete-chain use with completed dataset/link/timezone/source/owner/quantity/coverage evidence; a pending plan is not completion. Then normalize same-scope N once."
      inputs:
        - "Real physical packages"
        - "conversion-state and complete responsibility matrix"
      output: "Actual complete disjoint upstream services"
      source_ids: []
    - id: freight_sum
      applies_to: "cp_freight"
      rule: "actual_payload=actual packed cargo mass, including actual retained textile water and all carried pack/support, use directly measured packed payload unchanged, or subtract matched non-cargo tare once from the loaded gross measurement. EACH times matching actual_count once/TOTAL unchanged. Convert each unique load+leg payload/distance to transport_work. freight_per_reference=sum_unique_load_leg(transport_work*THAT_record_actual_share)/positive_same_scope_N. Already attributed/per-reference records are not shared/divided again; actual empty/provider/receiver scope owned once."
      inputs:
        - "Native payload/gross-tare/count/distance/conversion/share/coverage records"
      output: "Actual freight t*km per unit-night"
      source_ids: []
    - id: fluid_roles
      applies_to: "cp_refrigerant"
      rule: "Reconcile each actual fluid source/stock/state: opening_installed+opening_stored+opening_recovered+factory_charge_actual_receipt_in_period+standalone_net_receipts+other_actual_receipts equals closing_installed+closing_stored+closing_recovered+unused_standalone_return+usable_recovered_export+contained_waste+direct_release+retained_in_whole_asset_waste+retained_in_part_waste+other_actual_exits, with compatible native states and internal makeup/recovery transfers netted once. opening_stored and closing_stored EXCLUDE their separately reported recovered substocks; installed/stored/recovered roles are mutually exclusive by actual lot/charge/role IDs. Factory charge enters factory_charge_actual_receipt_in_period only for actual new entry not already in opening or any other receipt; other_actual_receipts and other_actual_exits exclude every separately enumerated term. Recovery from installed charge is an internal transfer, not a new receipt. Distinguish makeup delivery from installed transfer/release; separate actual mixture/components using sourced composition/fate basis and conversions. Unknown discrepancy is unresolved, not air release/zero. Factory-charge supply owner versus standalone supply coverage remains explicit."
      inputs:
        - "Actual initial/operating stock"
        - "transfers/recovery/export/waste/direct species and source coverage"
      output: "Exclusive physical refrigerant/heat-fluid role audit"
      source_ids: []
    - id: water_receivers
      applies_to: "cp_water; cp_fates; cp_environment"
      rule: "Reconcile actual supplied/other-proven water and stocks with separately measured/sourced contained effluent, retained liquid/moisture in actual materials, actual direct water-vapour to air and demonstrated other exits. Each actual mixture/component has native compatible state/density/temperature and independent source. Do not manufacture an outlet or close unknown discrepancy as vapour, sewage or pure-water release. Retained mixed-stream components nonadditive."
      inputs:
        - "Actual water/native stocks/receiver states and independent phase quantities"
      output: "Water state/receiver audit without residual inference"
      source_ids: []
    - id: actual_outlets_species
      applies_to: "cp_fates; cp_environment"
      rule: "Actual receiver_transfer_per_reference=compatible actual independent transfer quantity attributed to same cohort/positiveN; stock/internal transfer not export, consumed-only supply matching return omitted. release_mass=actual measured species mass OR compatible activity*applicable_species_factor, only required composition/fate not already covered by complete factor. Require real substance/particle class, air/water/soil medium and capture/contained exclusions, then actual attribution/N once. No measured material inventory/odour/label/stock residual proves release or zero."
      inputs:
        - "Actual whole/component/exclusive receiver or native species-medium/factor evidence"
      output: "Actual separate transfer and direct species quantities"
      source_ids: []
  data_quality_requirements:
    - id: actual_unit_stay
      applies_to: "cp_stays"
      requirement: "Actual indivisible unit topology, kitchen/bathroom/service regime and active visitor unit-night delivery/calendar evidence; public example is not target floorplan or no-staff proof."
      evidence: "Unit plans/inventory/service records and actual stay/reversal evidence"
    - id: native_temporal_quality
      applies_to: "all protocols"
      requirement: "Native units/basis/method/state/source/sample or event time, representative periods and uncertainty; actual DST elapsed time not nominal night hours. Meter calibration/conversion and raw/allocated/perreference scope retained."
      evidence: "Raw calibrated records and complete consumer/calendar coverage"
    - id: lifecycle_provider_coverage
      applies_to: "cp_assets; cp_linen; cp_providers"
      requirement: "Full-life all-user observed+sourced remainder and real upstream/provider/receiver coverage; actual missing stages integrated with completed status/link/timezone/owner/quantity evidence before complete-chain use."
      evidence: "Complete life and disjoint physical responsibility matrix"
    - id: fate_identity_gaps
      applies_to: "cp_fates; cp_environment; cp_refrigerant"
      requirement: "Actual species/medium/receiver and independent composition/state quantities required, not residuals. Unknown not assumed zero; generic ranges not mandatory absent range claim, actual quantity/uncertainty/acceptance still needed."
      evidence: "Actual transfer/measurement/applicable factor evidence with explicit unresolved limits"
validation_rules:
  - rule_id: validate_category_eligibility
    applies_to: "foreground_dataset_conformance"
    rule: "Official CPC 63112 covers visitor rooms or accommodation units with housekeeping less often than daily; it excludes timeshare accommodation and semi-permanent rooming or boarding-house residence. Lock-off topology alone is not an official exclusion. Selected PCR scope: Only non-timeshare visitor accommodation with less-than-daily housekeeping in one indivisible private self-contained apartment/studio with kitchen and bathroom. Exclude timeshare, permanent/semipermanent residence, lock-off combinations and shared beds. The indivisible private apartment/studio, kitchen/bathroom and no-lock-off requirements are this PCR's chosen method restrictions; they do not redefine CPC 63112. Verify official classification eligibility and the separate selected-method conditions before counting target output; unknown eligibility or method applicability blocks application. Other actual users remain in complete shared-resource denominators and their burdens must not disappear."
    source_ids:
      - unsd-cpc3-63112
  - rule_id: reference_delivery
    applies_to: "foreground_dataset_conformance"
    rule: "Reference amount/name/link Count must identify one actual occupied private indivisible apartment-unit-night, after reversal; actual unit plan/bookable topology/visitor eligibility/calendar/room-change/DST evidence. Not booking/guest/available night/points or fixed24h. Unknown topology excluded."
    source_ids: []
  - rule_id: resources_not_erased
    applies_to: "foreground_dataset_conformance"
    rule: "Actual kitchen/appliance/hotwater/common-area/support and housekeeping resources included; no staff/cleaning/guest cooking zero from self-access or no meal sales. Vacant/blocked/cancelled/no-show/open intervals and N0 retain real resource/asset attribution. Necessary pool standby/failed obligations must enter the responsible accommodation pool total before real occupied N division; ledger-only disclosure is not an exclusion. A guest declining cleaning does not automatically remove an actually provided occupied night from N."
    source_ids: []
  - rule_id: complete_life_and_users
    applies_to: "foreground_dataset_conformance"
    rule: "Actual complete all-user building/fit-out/equipment/linen lifecycle, observed+sourced remainder and compatible positive drivers; every provider/carrier/ancillary/tenant and phase responsibility once. No annualN lifetime, point/fee physical driver, default area-only/equalguest split or repeated stock carry manufacture."
    source_ids: []
  - rule_id: provider_laundry
    applies_to: "foreground_dataset_conformance"
    rule: "Actual laundry textile state/service unit and full energy/water/chemicals/effluent/treatment/textile-rental/assets/transport coverage must match direct versus supplied service, native conversions and actual missing-stage completion. Guest washer availability not operator linen evidence. No unpaid/unmetered supplier scope treated zero."
    source_ids: []
  - rule_id: quantity_return_freight
    applies_to: "foreground_dataset_conformance"
    rule: "All operands retain own native units/bases/methods/states/eventtime/sources and converted/allocated scope; NET supplies exclude container tare, gross INPUT+paired OUTPUT OR consumed INPUT OMIT. EACH/TOTAL compatible actual count once, THAT-record freight share inside SUM/N once; already attributed/perreference values unchanged."
    source_ids: []
  - rule_id: actual_fates
    applies_to: "foreground_dataset_conformance"
    rule: "Actual water vapour Elementary to air distinct from contained liquid Waste/actual direct discharge species; whole/mixed/separate receiver memberships nonadditive. Refrigerant factory/standalone/unused/recovered closing/useful export/waste/direct roles explicit, no unrelated supply netting or makeup=emission. Actual receiver transport/treatment one owner; no automatic avoided-production credit. In fluid_roles, stored excludes separately counted recovered substock, factory entry excludes opening/other receipts, and other receipt/exit residual categories exclude every listed term by actual lot/charge/role partition; internal recovery is not external receipt."
    source_ids: []
  - rule_id: evidence_and_language
    applies_to: "foreground_dataset_conformance"
    rule: "Actual quantities/native source/verified concrete identity and property-unit support are needed for final exchanges; unresolved candidate identities and no generic numeric Range alone do not imply zero or invalidate the semantic method. Actually used specifications/external ranges need compatible traceable basis; empirical guardrails need independent comparable observations. ENZH rules/cards/CP raw IDs and official projection must align."
    source_ids: []
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Actual accommodation foreground production per delivered occupied apartment-unit-night, with complete upstream/infrastructure and receiver interfaces"
  downstream_use: "Combine disjoint verified actual upstream/provider/lifecycle/receiver services once; not an operating-GHG-only claim or a count of booking/tenure rights"
  allowed_use: "Must satisfy category_eligibility with actual evidence. Actual single indivisible private self-contained visitor unit, kitchen/bathroom and less-than-daily housekeeping, actual records; apply the physical method only after verifying eligible non-timeshare tenure and all selected-method conditions; unresolved tenure blocks application"
  excluded_use: "Unknown/lock-off/connecting parent-child/multi-unit combined/shared-bed topology, permanent/care/camp route, unsupported complete-chain claim or imported brand/default HCMI factor"
  required_metadata: "property_id; operator_id; unit_id; unit_plan_source; indivisible_non_lockoff_confirmation; private_kitchen_bathroom_scope; bookable_unit_inventory_link; visitor_stay_id; service_night_id; actual_guest_count; actual_arrival_departure; local_night_definition; time_zone; DST_rule_source; room_change_transfer_ids; complimentary_status; cancellation_no_show_reversal_ids; actual_housekeeping_service_regime; actual_cleaning_linen_events; included_ancillary_scope; meter_provider_coverage; reporting_period"
  required_quality_disclosure: "Actual quantities/property-unit identities, nightly/stay/guest/available-period distinction, all-user resource/raw-attributed scope/full asset observed-remainder and provider laundry/ancillary/fate coverage; uncertainty and unresolved limits"
  update_trigger: "Actual unit topology/service regime/night-calendar/amenities/guest-support/resource/linen/provider/lifecycle/receiver/species or physical allocation evidence changes"
data_sources:
  - id: "unsd-cpc3-63112"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/63112"
    used_for: "Actual title and explanatory note: less-than-daily housekeeping for visitors, excluding timeshare and semipermanent boarding in that classification. Title does not prove no staff or no cleaning."
  - id: "unsd-cpc3-63113"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/63113"
    used_for: "Separate timeshare classification, not independent proof of another physical accommodation method."
  - id: "numa-faq"
    type: "literature"
    reference: "https://pages.numastays.com/faq"
    used_for: "Public operational example: PIN access/digital reception, turnover and non-daily cleaning, actual optional extras/property-specific laundry. No universal cleaning frequency, dose, staff absence or outsourced-linen assertion."
  - id: "numa-studio-context"
    type: "literature"
    reference: "https://numastays.com/de/locations/germany/berlin/mitte/nook/extra-large-studio-with-kitchen"
