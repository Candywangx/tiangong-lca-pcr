      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_category_eligibility |  | Official CPC 63112 covers visitor rooms or accommodation units with housekeeping less often than daily; it excludes timeshare accommodation and semi-permanent rooming or boarding-house residence. Lock-off topology alone is not an official exclusion. Selected PCR scope: Only non-timeshare visitor accommodation with less-than-daily housekeeping in one indivisible private self-contained apartment/studio with kitchen and bathroom. Exclude timeshare, permanent/semipermanent residence, lock-off combinations and shared beds. The indivisible private apartment/studio, kitchen/bathroom and no-lock-off requirements are this PCR's chosen method restrictions; they do not redefine CPC 63112. Verify official classification eligibility and the separate selected-method conditions before counting target output; unknown eligibility or method applicability blocks application. Other actual users remain in complete shared-resource denominators and their burdens must not disappear. | unsd-cpc3-63112 |\n| reference_delivery |  | Reference amount/name/link Count must identify one actual occupied private indivisible apartment-unit-night, after reversal; actual unit plan/bookable topology/visitor eligibility/calendar/room-change/DST evidence. Not booking/guest/available night/points or fixed24h. Unknown topology excluded. |  |\n| resources_not_erased |  | Actual kitchen/appliance/hotwater/common-area/support and housekeeping resources included; no staff/cleaning/guest cooking zero from self-access or no meal sales. Vacant/blocked/cancelled/no-show/open intervals and N0 retain real resource/asset attribution. Necessary pool standby/failed obligations must enter the responsible accommodation pool total before real occupied N division; ledger-only disclosure is not an exclusion. A guest declining cleaning does not automatically remove an actually provided occupied night from N. |  |\n| complete_life_and_users |  | Actual complete all-user building/fit-out/equipment/linen lifecycle, observed+sourced remainder and compatible positive drivers; every provider/carrier/ancillary/tenant and phase responsibility once. No annualN lifetime, point/fee physical driver, default area-only/equalguest split or repeated stock carry manufacture. |  |\n| provider_laundry |  | Actual laundry textile state/service unit and full energy/water/chemicals/effluent/treatment/textile-rental/assets/transport coverage must match direct versus supplied service, native conversions and actual missing-stage completion. Guest washer availability not operator linen evidence. No unpaid/unmetered supplier scope treated zero. |  |\n| quantity_return_freight |  | All operands retain own native units/bases/methods/states/eventtime/sources and converted/allocated scope; NET supplies exclude container tare, gross INPUT+paired OUTPUT OR consumed INPUT OMIT. EACH/TOTAL compatible actual count once, THAT-record freight share inside SUM/N once; already attributed/perreference values unchanged. |  |\n| actual_fates |  | Actual water vapour Elementary to air distinct from contained liquid Waste/actual direct discharge species; whole/mixed/separate receiver memberships nonadditive. Refrigerant factory/standalone/unused/recovered closing/useful export/waste/direct roles explicit, no unrelated supply netting or makeup=emission. Actual receiver transport/treatment one owner; no automatic avoided-production credit. In fluid_roles, stored excludes separately counted recovered substock, factory entry excludes opening/other receipts, and other receipt/exit residual categories exclude every listed term by actual lot/charge/role partition; internal recovery is not external receipt. |  |\n| evidence_and_language |  | Actual quantities/native source/verified concrete identity and property-unit support are needed for final exchanges; unresolved candidate identities and no generic numeric Range alone do not imply zero or invalidate the semantic method. Actually used specifications/external ranges need compatible traceable basis; empirical guardrails need independent comparable observations. ENZH rules/cards/CP raw IDs and official projection must align. |  |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
