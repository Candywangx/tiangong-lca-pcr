validation_rules:
  - rule_id: check_gate
    applies_to: "fulfilled_hot_espresso_drink"
    rule: "Require actual complete drink_gate profile/handoff after partial/reject/recook/reversal reconciliation; exactly one final service count, no meal-linked duplicate or assumed recipe equality."
    source_ids: []
  - rule_id: check_material_water
    applies_to: "actual native stocks and fates"
    rule: "Check extraction_composition, stock_roles, water_terminal, cleaning_roles and fluid_roles actual independent operands/states/samples/closing membership/pairedreceiver; no water-content/enduse duplication or unknown-as-air. Wetgrounds solids/water and foam-volume/mass distinct."
    source_ids: []
  - rule_id: check_complete_life
    applies_to: "all duties"
    rule: "Require actual complete provider OR exclusive completed missing-stage coverage, full all-user observed+sourced remaining/actual terminated life and actual conditional native land interfaces/pairedfromto events; missing stage, owner, replacement/termination or N0 carry/finalresolution blocks completeness."
    source_ids: []
  - rule_id: check_attribution
    applies_to: "all outputs periods resources and freight"
    rule: "Require production_periods all runs/changes/cleaning/output linkage and actual PCR-specific decisions, resource_once/freight_once/output_projection precedence. Raw all-output native amounts unchanged; no other-product cooutput after target allocation, freightshare once, final positive sameN once. Prevent duplicate output handoffs and sharedrun/period/asset responsibility."
    source_ids: []
  - rule_id: check_rejects
    applies_to: "rejected and returned states"
    rule: "Require reject_paths actual producing node/batch and real rework/redeploy/retained/useful/waste receiver links; unresolved rejects not accepted output, used recovery not new supply or credit."
    source_ids: []
  - rule_id: check_identity_units
    applies_to: "all inventory rows"
    rule: "Each actual concrete exchange needs compatible verified type/direction/species/medium/identity/property/unit and native quantity. No umbrella fixed UUID or generic unverified support. Missing generic range/UUID alone does not justify zero; final completeness restricted until actual proof."
    source_ids: []
  - rule_id: check_languages_projection
    applies_to: "EN ZH and generated projection"
    rule: "Compare complete mandatory identity/FU/reference/boundary/profile/DQ/source fields, all ordered rule/card/process/type/direction/unit/metadata IDs and each protocol12 fields/rawkeys in both languages; regenerate deterministic projection from canonical English and run selected target gate. Structural pass is not external identity/source/scientific review."
    source_ids: []
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
