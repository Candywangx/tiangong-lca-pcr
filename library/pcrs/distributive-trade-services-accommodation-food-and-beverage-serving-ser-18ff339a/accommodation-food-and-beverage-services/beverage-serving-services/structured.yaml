  calculation_rules:
    - id: normalize_resources
      applies_to: "all inventory rows"
      rule: "Apply resource_once after stock_roles and actual compatible conversions; assigned target TOTAL / positive same-profile N_target exactly once. Already per reference flow unchanged; N0 retain responsible resolution. Apply freight_once and output_projection precedence to their rows."
      inputs:
        - "actual native quantities"
        - cp_service
        - "linked node protocol"
      output: "physical amount per reference flow"
      source_ids: []
    - id: extract_reconcile
      applies_to: "roasted_coffee; milk_alternatives; drink_additions; grounds_waste"
      rule: "Use actual matched state/sample coffee/milk/addition/water and actual supplied drink/grounds/losses/closing stocks. Whole drink, dry solids, moisture, foam volume and components are nonadditive views. No generic dissolved-solids yield, moisture, dose or foam-to-mass conversion."
      inputs:
        - cp_coffee_milk
        - cp_water
        - cp_waste
      output: "state-matched extraction formulation audit"
      source_ids: []
    - id: water_close
      applies_to: "all water and liquid rows"
      rule: "Reconcile actual supplied/abstracted water plus intrinsic water conveyed by actual coffee/milk/addition parent inputs and transfers, against exclusive external wastewater/direct water discharge/vapour PLUS actual parent-contained water exported in drinks/grounds/other materials and actual closing stock changes under water_terminal. Parent-contained water enters conservation once without an extra exchange. Exclude only internal enduse/content/receiver DUPLICATES; actual independent vapour evidence only."
      inputs:
        - cp_water
        - "actual source receiver membership"
      output: "actual terminal water closure with unresolved difference"
      source_ids: []
    - id: freight_calculate
      applies_to: "supply_receiver_freight"
      rule: "Apply freight_once to native packed wet leg records; record_share once IS actual pool attribution. Assigned freight total / same positive N_target once, no further generic share. Complete actual empty duty separately if absent provider."
      inputs:
        - cp_freight
        - cp_provider
        - cp_service
      output: "assigned freight and exclusive completed empty duties per reference flow"
      source_ids: []
    - id: life_land_complete
      applies_to: "asset_life; reusable_life; land_occupation; land_transformation_from; land_transformation_to"
      rule: "Apply full_life/land_native with observed all-user and sourced compatible remaining use OR actual termination, all life phases and actual native land event links. Identify complete provider versus exclusive direct coverage before resource_once; no annual target count proxy."
      inputs:
        - cp_life
        - cp_land
        - cp_provider
      output: "complete physical asset and native land duties per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: actual_service
      applies_to: "all inventory rows"
      requirement: "Actual equivalent recipe/portion/hot state/presentation/version recipient fulfillment and complete component acceptance/reversal evidence; no payment/output proxy"
      evidence: "cp_service; drink_gate"
    - id: native_states
      applies_to: "all inventory rows"
      requirement: "Every actual material/species/stock/sample/gate keeps exact wet/dry/solute/water/foam/temperature state and each independent numeric own7 metadata; absence is gap"
      evidence: "cp_coffee_milk; cp_water; native_operands"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Complete all-output physical ledger, actual all-user/period/life/land/provider/receiver coverage, completed missing stages and N0 source/carry/finalresolution; no planned supplement"
