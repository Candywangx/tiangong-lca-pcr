    required_unit: "kg; actual native volume"
    rule: "Keep roasted/ground/dry/wet/extracted/liquid/foamed/served/returned states and sample genealogy. Wet spent grounds require independent actual wet mass, dry solids and water; dissolved solids are not whole beverage mass. Same-sample water-only wet fraction w=water/wet and dry ratio r=water/nonwater imply w=r/(1+r), percent first; other volatile loss-on-drying is not water. Incorporated air changes foam volume, not a universal milk mass or extraction yield. Unfoamed-milk density cannot convert foamed volume without actual compatible foamed-state density/temperature evidence."
