      name: "Actual native numerator"
      uuid: ""
    required_unit: "per reference flow"
    rule: "Attribute actual responsibility once under resource_once/freight_once/output_projection, then divide assigned target TOTAL by positive same-profile N_target once. Only already-per-reference quantities remain unchanged. N0 keeps real source/carry/receiving/finalresolution without division or fictitious output."
