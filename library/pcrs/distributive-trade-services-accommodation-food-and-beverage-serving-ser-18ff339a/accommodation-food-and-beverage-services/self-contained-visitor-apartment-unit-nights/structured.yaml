allocation_rules:
  - rule_id: service_count_scope
    applies_to: "foreground_burden_allocation"
    rule: "N is unique eligible actual occupied delivered_unit_night_service_id linked to actual unit_id/service_night_id from active visitor stay records, including complimentary eligible nights but excluding canceled/no-show/unprovided/duplicate room-change nights. Local night calendar, timezone/DST and actual delivery evidence determine cutover, not24h or payment. Record actual guest occupancy/stay length separately. Normalize only positive same-scope N; N0 preserves raw actual resources."
    source_ids: []
  - rule_id: direct_and_shared
    applies_to: "foreground_burden_allocation"
    rule: "Trace actual interval/task resources directly where evidence permits. Otherwise allocate on an evidenced compatible physical causal driver across all actual unit classes, common facilities, tenants/ancillary services and periods including idle/vacancy/blocked/open events. Record complete all-user numerator/denominator quantities and native metadata. No default equal-unit, guest-count, area-only, maximum capacity, price/point or economic-margin split. Necessary standby/vacancy and failed/canceled/no-show work belonging to this actual accommodation-supply pool MUST enter that pool total before division by its real occupied N; merely listing a ledger does not remove their burdens. Separate another consumer/output only with actual responsibility evidence. N0 retains pool resources with source-to-carry-to-receiving-period-to-final-resolution links; unresolved attribution blocks the final package."
    source_ids: []
  - rule_id: turnover_period
    applies_to: "foreground_burden_allocation"
    rule: "Link each turnover/stayover/reclean/maintenance/access event to actual stay/unit/period. Turnover resources belong once to their real served stay/cohort on an explicit causal rule; not one identical cleaning event per night. Failed/canceled/no-show work and rejected linen/consumables retain original resources and real reuse/reclean/return/discard paths without a new completed output."
    source_ids: []
  - rule_id: full_life
    applies_to: "foreground_burden_allocation"
    rule: "Use complete manufacture/maintenance/replacement/retirement/EOL for building/fit-out/equipment/reusable linen. Compatible job_driver/lifetime_all_user_driver, lifetime=observed all-user history+sourced remaining service, actual equivalence and uncertainty/sensitivity/update. Annual occupied N is not whole asset life. Lifetime driver is a compatible complete all-user responsibility/service basis, never nominal saleable capacity or calendar hours while omitting corresponding idle responsibility from numerators. Every actual idle/blocked/failed obligation is assigned to its responsible pool/consumer once, not lost between lifetime denominator and occupied-output attribution. Shared ownership/lease/management/timeshare responsibility partitions actual physical lifecycle once, no duplicate provider/carrier or pre-existing asset burden."
    source_ids: []
  - rule_id: provider_ancillary
    applies_to: "foreground_burden_allocation"
    rule: "Each real laundry/digital/cleaning/ancillary provider quantity has physical unit/equivalence and matching quality/service coverage. Explicitly separate raw package quantity from already converted/attributed quantity; multiply equivalence/share only where needed. Match all included material/energy/water/chemical/effluent/assets/transport and upstream scope. Bundled extra services cannot disappear; separate property outputs use documented all-consumer responsibility, not an automatic extra output credit."
    source_ids: []
  - rule_id: supply_return
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing, including retained recovery within closing; actual NET material receipts exclude supply-container tare. Gross INPUT S with separate matched usable unused outward OUTPUT OR consumed-only INPUT S-unused_outward_return with matching OUTPUT OMITTED. Only same-scope unconsumed standalone supply is netted, not recovered installed refrigerant/linen asset or unrelated stock. Apply actual resource attribution and same-scope N once, no extra return credit."
    source_ids: []
  - rule_id: refrigerant_owner
    applies_to: "foreground_burden_allocation"
    rule: "Factory charge may already be in HVAC/appliance lifecycle. Track that source separately from standalone operating supply and installed/recovered stock. Recovery is internal transfer until real export, retained recovery is closing. Useful recovered installed charge may be exported without automatic credit; never subtract it from unrelated current makeup. Only matched unused same-scope standalone supply is eligible for consumed-only netting. Actual independent contained waste and direct species use their own quantities/fates and receiving ownership."
    source_ids: []
  - rule_id: exclusive_receivers
    applies_to: "foreground_burden_allocation"
    rule: "Actual reusable/textile/asset/supply Product exits, separate wasted materials, genuine mixed capture, contained effluent/refrigerant waste and direct species have mutually exclusive physical membership. Retained components do not add another whole stream. Receiving transport/treatment/EOL belongs once; if a complete lifecycle/provider already covers the identical event, preserve physical audit and remove duplicate treatment exchange burden only through explicit coverage evidence, not omit real fate."
    source_ids: []
