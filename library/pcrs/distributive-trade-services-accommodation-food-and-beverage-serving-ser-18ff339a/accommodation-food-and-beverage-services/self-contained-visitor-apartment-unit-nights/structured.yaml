  calculation_rules:
    - id: occupied_n
      applies_to: "cp_stays"
      rule: "N=count_unique_eligible(delivered_unit_night_service_id) for actual active occupied visitor service after reversals and room-change reconciliation. A substitution within the same delivered service-night links all actual unit/time segments to one service_id without duplicate N; retain resources of both segments. Two separately provided units are distinct actual service_ids, not collapsed because one reservation. Use declared local service-night calendar/timezone/DST and actual interval; eligible complimentary service counts, canceled/no-show/unprovided nights do not. A declined, skipped or failed cleaning task alone does not make an actually delivered eligible accommodation night rejected. No division at N0; preserve raw pool resources through source/carry/receiving-period/resolution links; unknown responsibility blocks finalization."
      inputs:
        - "Actual delivery/night/stay/topology/occupancy/transfer records"
      output: "Actual same-scope occupied-unit-night denominator"
      source_ids: []
    - id: resource_scope
      applies_to: "cp_utilities; cp_water; cp_operations"
      rule: "For each record, raw attributed_resource=compatible_converted_raw_quantity*that_record_documented_share; already_attributed records use their actual attributed quantity unchanged. Sum mutually exclusive records for target_cohort, then q_per_reference=raw_target_cohort_quantity/positive_same_target_N only once. Already_per_reference values not divided again. Reconcile all consumers and complete periods before normalization."
      inputs:
        - "Record scope"
        - "units/conversion"
        - "native numerator/denominator"
        - "all-user records"
        - N
      output: "Actual attributed resource per one unit-night"
      source_ids: []
    - id: meter_or_average
      applies_to: "cp_utilities"
      rule: "Actual energy is directly integrated meter/import-register quantity or actual interval-average power*matching elapsed_duration after sourced native conversion. Average power must cover actual cycling/standby/fans/defrost in that interval; instantaneous/nameplate rating is not consumed energy. Already integrated kWh is not multiplied by duration. Purchased heat and fuel/on-site conversion scope exclusive; combustion species separately evidenced."
      inputs:
        - "Native import registers/factor or actual interval-average/elapsed time and coverage"
      output: "Actual site energy before attribution"
      source_ids: []
    - id: supply_stock
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing including retained recovery in closing; net_receipts=receipt_gross-container_tare only on matching actual material/state units. Gross S INPUT plus paired unused_outward_return OUTPUT OR consumed S-unused_outward_return INPUT and OMIT matching OUTPUT. EACH quantities times matching actual count once/TOTAL unchanged; actual per-piece/density-temperature conversion. Raw all-user share then same-scope N once."
      inputs:
        - "Actual net stocks"
        - "extent/count"
        - "conversions and matched unused return"
      output: "Exclusive material input/return convention"
      source_ids: []
    - id: linen_cycle
      applies_to: "cp_linen"
      rule: "Count actual distinct textile IDs/batches and real wash/change events; clean_dry_textile_mass, used_wet_loaded_mass, contamination/retained water and container tare are separate. dry_nonwater_mass=wet_sample_mass*(1-w_wet) only actual water/as-received wet fraction; compatible same-sample w_dry=water/dry_nonwater converts w_wet=w_dry/(1+w_dry) after percent-to-ratio conversion. Dry nonwater may include soil and is not automatically clean fibre. Actual laundry service unit conversion and textile lifecycle driver require sourced compatible clean/used state, never nominalkg or number of beds."
      inputs:
        - "Textile/event/mass/water definitions and provider service-unit source"
      output: "Actual linen circulation/service and lifecycle allocation audit"
      source_ids: []
    - id: complete_lifetime
      applies_to: "cp_assets; cp_linen"
      rule: "lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. asset_equivalent=event_quantity*job_driver/lifetime_all_user_driver, summed over exclusive complete-life events; actual same-scope N once. Reusable linen manufacture/replacement/EOL follows observed+sourced remaining real use/care cycle service with all users and wastage retained; no new complete linen set each unit-night or annualN as lifetime."
      inputs:
        - "Complete life event/native job-observed-remaining/equivalence/owner records"
      output: "Full-life building/equipment/textile service burden"
      source_ids: []
    - id: complete_provider
      applies_to: "cp_providers"
      rule: "provider_service=sum(actual_native_quantity*physical_equivalence_if_not_already_converted*documented_share_if_not_already_attributed), with explicit raw/converted/attributed state. Native physical equivalence and all-user share must match provider unit/quality/coverage. Add actually missing upstream/material/energy/water/chemical/effluent/treatment/asset/freight stages once before complete-chain use with completed dataset/link/timezone/source/owner/quantity/coverage evidence; a pending plan is not completion. Then normalize same-scope N once."
      inputs:
        - "Real physical packages"
        - "conversion-state and complete responsibility matrix"
      output: "Actual complete disjoint upstream services"
      source_ids: []
    - id: freight_sum
      applies_to: "cp_freight"
      rule: "actual_payload=actual packed cargo mass, including actual retained textile water and all carried pack/support, excluding only true noncargo vehicle/container tare. EACH times matching actual_count once/TOTAL unchanged. Convert each unique load+leg payload/distance to transport_work. freight_per_reference=sum_unique_load_leg(transport_work*THAT_record_actual_share)/positive_same_scope_N. Already attributed/per-reference records are not shared/divided again; actual empty/provider/receiver scope owned once."
      inputs:
        - "Native payload/gross-tare/count/distance/conversion/share/coverage records"
      output: "Actual freight t*km per unit-night"
      source_ids: []
    - id: fluid_roles
      applies_to: "cp_refrigerant"
      rule: "Reconcile each actual fluid source/stock/state: opening_installed+opening_stored+opening_recovered+factory_charge_actual_receipt_in_period+standalone_net_receipts+other_actual_receipts equals closing_installed+closing_stored+closing_recovered+unused_standalone_return+usable_recovered_export+contained_waste+direct_release+retained_in_whole_asset_waste+retained_in_part_waste+other_actual_exits, with compatible native states and internal makeup/recovery transfers netted once. opening_stored and closing_stored EXCLUDE their separately reported recovered substocks; installed/stored/recovered roles are mutually exclusive by actual lot/charge/role IDs. Factory charge enters factory_charge_actual_receipt_in_period only for actual new entry not already in opening or any other receipt; other_actual_receipts and other_actual_exits exclude every separately enumerated term. Recovery from installed charge is an internal transfer, not a new receipt. Distinguish makeup delivery from installed transfer/release; separate actual mixture/components using sourced composition/fate basis and conversions. Unknown discrepancy is unresolved, not air release/zero. Factory-charge supply owner versus standalone supply coverage remains explicit."
      inputs:
        - "Actual initial/operating stock"
        - "transfers/recovery/export/waste/direct species and source coverage"
      output: "Exclusive physical refrigerant/heat-fluid role audit"
      source_ids: []
    - id: water_receivers
      applies_to: "cp_water; cp_fates; cp_environment"
      rule: "Reconcile actual supplied/other-proven water and stocks with separately measured/sourced contained effluent, retained liquid/moisture in actual materials, actual direct water-vapour to air and demonstrated other exits. Each actual mixture/component has native compatible state/density/temperature and independent source. Do not manufacture an outlet or close unknown discrepancy as vapour, sewage or pure-water release. Retained mixed-stream components nonadditive."
      inputs:
        - "Actual water/native stocks/receiver states and independent phase quantities"
      output: "Water state/receiver audit without residual inference"
      source_ids: []
    - id: actual_outlets_species
      applies_to: "cp_fates; cp_environment"
      rule: "Actual receiver_transfer_per_reference=compatible actual independent transfer quantity attributed to same cohort/positiveN; stock/internal transfer not export, consumed-only supply matching return omitted. release_mass=actual measured species mass OR compatible activity*applicable_species_factor, only required composition/fate not already covered by complete factor. Require real substance/particle class, air/water/soil medium and capture/contained exclusions, then actual attribution/N once. No measured material inventory/odour/label/stock residual proves release or zero."
      inputs:
        - "Actual whole/component/exclusive receiver or native species-medium/factor evidence"
      output: "Actual separate transfer and direct species quantities"
      source_ids: []
