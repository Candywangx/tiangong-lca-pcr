system_boundary:
  rules:
    - rule_id: real_route
      applies_to: "foreground_system_boundary"
      rule: "Include actual reservation/access/remote support, continuous unit/common-facility occupied and vacant operation, turnover and less-than-daily housekeeping, actual linen service, maintenance, supplies and real receiver handoffs. Self-check-in does not establish absence of personnel or cleaning. Actual operation, not a brand label or ownership regime, establishes resources."
      source_ids: []
    - rule_id: unit_topology
      applies_to: "foreground_system_boundary"
      rule: "Only actual single physically indivisible privately supplied self-contained visitor apartment/studio with private kitchen and bathroom. Require unit plan, independent access and bookable delivery inventory evidence. Exclude lock-off parent-child combinations, connecting or combined multi-unit products and shared-bed accommodation. Unknown topology does not default to indivisible."
      source_ids: []
    - rule_id: service_resource_boundary
      applies_to: "foreground_system_boundary"
      rule: "Actual electricity/heat/hot-cold water and operator-provided appliance/fixture use during the stay, including kitchen loads, are accommodation resources. No food provision is not proof of zero cooking energy. Guest travel and independently bought food/personal goods are outside the selected service; actual operator-provided supplies, snacks or bundled ancillary services require their real supply/coverage, not silent exclusion. Actual separately supplied outputs/common tenants remain competing responsibility records."
      source_ids: []
    - rule_id: full_chain_assets
      applies_to: "foreground_system_boundary"
      rule: "This is accommodation production, not traded-merchandise wholesale. Attribute full building/site/fit-out/furniture/HVAC/appliance/linen lifecycles, maintenance/replacement/retirement/EOL and upstream actual utility/material/provider production. A rent/management fee or a timeshare point is not physical asset service. Complete supplied service datasets replace only their proven matching physical scope. Missing real upstream stages or treatment must actually be integrated once with completed dataset/link/timezone/source/owner/quantity/coverage evidence before full-chain use; a pending plan is insufficient."
      source_ids: []
    - rule_id: period_vacancy
      applies_to: "foreground_system_boundary"
      rule: "Declare real reporting, meter, night-calendar, cleaning-run, stock and full-asset phases. Available unsold, canceled/no-show, blocked/maintenance and open-stay periods retain actual standby/cleaning/support and assets; do not manufacture occupied nights or erase N=0 resources. Paired cross-period stock/linen/asset carry retains source and prior attribution, not a new purchase, manufacture or service night."
      source_ids: []
    - rule_id: laundry_interface
      applies_to: "foreground_system_boundary"
      rule: "Use actual operator linen processing events, on-site direct resources only if actually performed within reviewed equipment/operation, OR actual complete contracted laundry scope. Guest personal laundry availability does not prove operator linen processing. Identify washing/drying/finishing, electricity/heat/fuel, chemicals, water/effluent/treatment, textile rental/manufacture, assets and transport coverage separately; expand actual missing resources once, remove overlap only when covered once elsewhere. No industrial laundry/boiler conversion technology is inferred from the accommodation label."
      source_ids: []
    - rule_id: fates_and_refrigerant
      applies_to: "foreground_system_boundary"
      rule: "Supplied water, retained moisture, separately contained liquid receiver transfer and actual direct water vapour to air are different states/roles. Actual mixed streams retain nonadditive component audits; unrelated material/species/receiver exchanges expand separately. HVAC/appliance factory charge, current standalone makeup, unused supply returns, recovered closing, useful export, contained waste and direct species remain exclusive with their own owner/native evidence. Top-up, stock discrepancy, odour or label establishes neither release nor zero."
      source_ids: []
