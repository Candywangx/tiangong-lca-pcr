validation_rules:
  - rule_id: reference_delivery
    applies_to: "foreground_dataset_conformance"
    rule: "Reference amount/name/link Count must identify one actual occupied private indivisible apartment-unit-night, after reversal; actual unit plan/bookable topology/visitor eligibility/calendar/room-change/DST evidence. Not booking/guest/available night/points or fixed24h. Unknown topology excluded."
    source_ids: []
  - rule_id: resources_not_erased
    applies_to: "foreground_dataset_conformance"
    rule: "Actual kitchen/appliance/hotwater/common-area/support and housekeeping resources included; no staff/cleaning/guest cooking zero from self-access or no meal sales. Vacant/blocked/cancelled/no-show/open intervals and N0 retain real resource/asset attribution. Necessary pool standby/failed obligations must enter the responsible accommodation pool total before real occupied N division; ledger-only disclosure is not an exclusion. A guest declining cleaning does not automatically remove an actually provided occupied night from N."
    source_ids: []
  - rule_id: complete_life_and_users
    applies_to: "foreground_dataset_conformance"
    rule: "Actual complete all-user building/fit-out/equipment/linen lifecycle, observed+sourced remainder and compatible positive drivers; every provider/carrier/ancillary/tenant and phase responsibility once. No annualN lifetime, point/fee physical driver, default area-only/equalguest split or repeated stock carry manufacture."
    source_ids: []
  - rule_id: provider_laundry
    applies_to: "foreground_dataset_conformance"
    rule: "Actual laundry textile state/service unit and full energy/water/chemicals/effluent/treatment/textile-rental/assets/transport coverage must match direct versus supplied service, native conversions and actual missing-stage completion. Guest washer availability not operator linen evidence. No unpaid/unmetered supplier scope treated zero."
    source_ids: []
  - rule_id: quantity_return_freight
    applies_to: "foreground_dataset_conformance"
    rule: "All operands retain own native units/bases/methods/states/eventtime/sources and converted/allocated scope; NET supplies exclude container tare, gross INPUT+paired OUTPUT OR consumed INPUT OMIT. EACH/TOTAL compatible actual count once, THAT-record freight share inside SUM/N once; already attributed/perreference values unchanged."
    source_ids: []
  - rule_id: actual_fates
    applies_to: "foreground_dataset_conformance"
    rule: "Actual water vapour Elementary to air distinct from contained liquid Waste/actual direct discharge species; whole/mixed/separate receiver memberships nonadditive. Refrigerant factory/standalone/unused/recovered closing/useful export/waste/direct roles explicit, no unrelated supply netting or makeup=emission. Actual receiver transport/treatment one owner; no automatic avoided-production credit. In fluid_roles, stored excludes separately counted recovered substock, factory entry excludes opening/other receipts, and other receipt/exit residual categories exclude every listed term by actual lot/charge/role partition; internal recovery is not external receipt."
    source_ids: []
  - rule_id: evidence_and_language
    applies_to: "foreground_dataset_conformance"
    rule: "Actual quantities/native source/verified concrete identity and property-unit support are needed for final exchanges; unresolved candidate identities and no generic numeric Range alone do not imply zero or invalidate the semantic method. Actually used specifications/external ranges need compatible traceable basis; empirical guardrails need independent comparable observations. ENZH rules/cards/CP raw IDs and official projection must align."
    source_ids: []
published_dataset_profile:
  dataset_role: "Actual accommodation foreground production per delivered occupied apartment-unit-night, with complete upstream/infrastructure and receiver interfaces"
  downstream_use: "Combine disjoint verified actual upstream/provider/lifecycle/receiver services once; not an operating-GHG-only claim or a count of booking/tenure rights"
  allowed_use: "Actual single indivisible private self-contained visitor unit, kitchen/bathroom and less-than-daily housekeeping, actual records; same physical method independent of matching tenure label"
  excluded_use: "Unknown/lock-off/connecting parent-child/multi-unit combined/shared-bed topology, permanent/care/camp route, unsupported complete-chain claim or imported brand/default HCMI factor"
  required_metadata: "property_id; operator_id; unit_id; unit_plan_source; indivisible_non_lockoff_confirmation; private_kitchen_bathroom_scope; bookable_unit_inventory_link; visitor_stay_id; service_night_id; actual_guest_count; actual_arrival_departure; local_night_definition; time_zone; DST_rule_source; room_change_transfer_ids; complimentary_status; cancellation_no_show_reversal_ids; actual_housekeeping_service_regime; actual_cleaning_linen_events; included_ancillary_scope; meter_provider_coverage; reporting_period"
  required_quality_disclosure: "Actual quantities/property-unit identities, nightly/stay/guest/available-period distinction, all-user resource/raw-attributed scope/full asset observed-remainder and provider laundry/ancillary/fate coverage; uncertainty and unresolved limits"
  update_trigger: "Actual unit topology/service regime/night-calendar/amenities/guest-support/resource/linen/provider/lifecycle/receiver/species or physical allocation evidence changes"
data_sources:
  - id: "unsd-cpc3-63112"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/63112"
    used_for: "Actual title and explanatory note: less-than-daily housekeeping for visitors, excluding timeshare and semipermanent boarding in that classification. Title does not prove no staff or no cleaning."
  - id: "unsd-cpc3-63113"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/63113"
    used_for: "Separate timeshare classification, not independent proof of another physical accommodation method."
  - id: "numa-faq"
    type: "literature"
    reference: "https://pages.numastays.com/faq"
    used_for: "Public operational example: PIN access/digital reception, turnover and non-daily cleaning, actual optional extras/property-specific laundry. No universal cleaning frequency, dose, staff absence or outsourced-linen assertion."
  - id: "numa-studio-context"
    type: "literature"
    reference: "https://numastays.com/de/locations/germany/berlin/mitte/nook/extra-large-studio-with-kitchen"
    used_for: "Published indexed manufacturer/operator unit context with private bathroom/kitchen; direct room-page amenities may be unhydrated. No actual target layout, non-lockoff topology, area, capacity or appliance inventory inferred; require actual unit records."
  - id: "wsha-hcmi-context"
    type: "literature"
    reference: "https://sustainablehospitalityalliance.org/resource/hotel-carbon-measurement-initiative/"
    used_for: "Public operational-carbon context: occupied-room daily metric and on-site energy/refrigerants/applicable outsourced operations. Not full LCA boundary or current full-methodology endorsement; no example/fallback/benchmark or exclusion imported."
