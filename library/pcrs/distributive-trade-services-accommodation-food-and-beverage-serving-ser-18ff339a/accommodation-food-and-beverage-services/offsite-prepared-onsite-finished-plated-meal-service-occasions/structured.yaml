validation_rules:
  - rule_id: validate_gate
    applies_to: "actual reference/output"
    rule: "Require actual complete meal-version/recipient/occasion/portion/gate and offered/supplied/declined/partial/reversal evidence. Unique physical fulfilled same-profile N_target, not contractcovers/booking/capacity/eaten mass. No unsupported equivalence across menus/service durations/food quantities."
    source_ids: []
  - rule_id: validate_route_modules
    applies_to: "both real kitchens"
    rule: "Require actual composition input roles, before/after treatment and packing/presentation states, material/service roles, protected receipt-gate handoff and final plated gate. Batch/continuous operation, run/changeover/cleaning/holding linkage and reject/rework/return path complete. No extra fictitious independent nodes or new production swallowed by generic service."
    source_ids:
      - krisp-current-commissary-event-service
      - box-current-private-dining
      - silverfeast-current-event-route
  - rule_id: validate_pairs
    applies_to: "each internal transfer"
    rule: "Same selected receipt-gate ID/quantity/state/time/owner/receiver both sides; dispatch difference actual losses separately; no fixed internal ratio to finalN. Dirty food/water/pack cargo audits nonadditive and oldstate return not virgin credit."
    source_ids: []
  - rule_id: validate_outputs_allusers
    applies_to: "all intended output/resource pools"
    rule: "Every actual intended output and handoff/native quantity, all consumers/nodes/periods and actual attribution decision; positive complete compatible driver and same positive finalN once. Necessary idle/failure/closed/cancel/N0 duty with resolved source/carry/receiver, not erased or fake output."
    source_ids: []
  - rule_id: validate_native_stocks
    applies_to: "food supplies fluids assets"
    rule: "All independent numeric operands have own unit/basis/method/state/sampletime/source. Gross draw and UNUSED output versus net draw/omitted return exclusive; used recovery/installed/stored/factory content separate; native wet/dry/percent/density/temperature/each-total and full-life fields compatible."
    source_ids: []
  - rule_id: validate_transport
    applies_to: "freight and ownfleet/provider"
    rule: "Unique actual load+leg packed wet food/ice/pack/support/equipment; remove only noncargo vehicle tare, repeats once, THAT-record share inside sum and finalN once. Complete carrier OR actual own-fleet energy/vehicle/maintenance/species/receiver/empty-duty coverage once."
    source_ids: []
  - rule_id: validate_life_coverage
    applies_to: "full physical boundary"
    rule: "Actual alluser observed+sourced compatible remaining full-life OR termination, full asset/land/stage matrix and completed missing-stage integration; pending supplements and annual target count do not close boundary. Full kitchen/venue/equipment/reusables/wash/receivers cannot be omitted under contract labels."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "food water direct species"
    rule: "Actual ingredient/prepared/served/unserved/plate/prep/return/rework fate reconciliation; terminal water balance excludes internal/duplicate receiver views; whole/component audit nonadditive. Water vapour Elementary Mass to air; contained wastewater Waste. Exact pollutants/medium, no unknown residual as release or zero."
    source_ids: []
  - rule_id: validate_identity_and_readiness
    applies_to: "final data production"
    rule: "Verify actual concrete flow/support identity/property/unit and matching state/gate/direction before final exchanges; explicit gaps restrict use. Candidate methodology and checker pass are not external UUID verification or publication readiness; quantitative source examples never default factors."
    source_ids: []
  - rule_id: validate_projection_stage
    applies_to: "all input/output variants"
    rule: "Require declared projection_variant/allocation_stage, full pre-attribution output ledger and actual independent-versus-joint-output decision. Full native output amounts/lineage/gates remain unscaled by targetshare. Target-attributed LCI excludes independent other-output evidence as exchanges/co-products; wholepool variant contains full inputs/alloutputs and one designated allocation only. Internal receipts/returns are not co-products."
    source_ids: []
  - rule_id: validate_input_role_exclusivity
    applies_to: "ingredient/internal/returned input cards"
    rule: "Check every source_input_role/internal_external/linked_input_coverage/nativequantity pair. Generic site_ingredients excludes identical physical prepared-receipt quantity/stage. Internal receipt and returned old-state food/reusables do not create second external manufacturing inputs; only actual new rework/wash/storage duty added once."
    source_ids: []
  - rule_id: validate_product_quantity_precedence
    applies_to: "output ledger and real joint exchanges"
    rule: "The raw ALL-OUTPUT ledger keeps UNNORMALIZED actual full native quantities, not targetshare-scaled or per-reference. In target-attributed LCI independent other meals/products are audit-only, not co-product exchanges. If a documented actual PCR-specific decision retains a genuine joint product as final exchange, use its SELECTED ACTUAL PHYSICAL output quantity / same positive profile N_target ONCE (already-per-reference unchanged); never apply generic resource target-driver share to that physical output. This output rule has precedence over generic resource assignment. Separate unallocated wholepool variant keeps full inputs/alloutputs and exactly one designated attribution step."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only when actual declared boundary and evidence complete"
  downstream_use: "Foreground collection package then process and lifecyclemodel projections with true physical receipt/final/return gates and same final reference"
  allowed_use: "Physically matching purpose-neutral offsite preparation/transport/onsitefinish complete plated-menu occasions; actual compatible recipient service profile and full exclusive physical chain"
  excluded_use: "Unverified concrete exchange binding; missing actual data/full-life/provider/receiver/N0 responsibility; whole event or fullCPC63391 coverage; dropoff-only/pureonsite/non-equivalent shared food; default recipes/yields/nutrition/temperatures/lifetimes"
  required_metadata: "Actual operator/sites/job/menu-recipe-composition-portion/service-version/recipient/occasion/gate/timezones; every native operand/source; all outputs/users/periods/stock/transfer/fates; full life and complete provider/receiver coverage"
  required_quality_disclosure: "Actual declared projection_variant/allocation_stage, pre-attribution all-output ledger/independent-versus-joint decision and one attribution step; actual collection/calibration/uncertainty/equivalence/attribution, completed missing-stage links and unresolved identities/ranges/source gaps; no complete-chain claim while duties unassigned"
  update_trigger: "Actual menu/portion/gate/route/packing/holding/wash/transport/provider/site/asset/receiver or lifetime/identity evidence changes; each independently expanded route reviewed"
