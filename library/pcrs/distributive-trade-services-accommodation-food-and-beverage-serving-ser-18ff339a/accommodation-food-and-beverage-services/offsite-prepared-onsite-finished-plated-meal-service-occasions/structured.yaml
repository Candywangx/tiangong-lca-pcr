allocation_rules:
  - rule_id: all_intended_outputs
    applies_to: "both nodes"
    rule: "Enumerate every actual independently intended output and its outputID/recipient/gate/state/actual handoff/time/source/native quantity before attribution. Actual same-meal course/components/internal transfers are not new final outputs. Separate other menus/jobs/staff support/food products/nonmeal duties and partials by compatible output gate; distinguish usable product, retained stock/rework, residue and waste."
    source_ids: []
  - rule_id: physical_attribution
    applies_to: "each resource/event"
    rule: "Use actual exclusively measured target duty first. Otherwise use supported compatible native physical causal driver for actual complete all-consumer pool, including staff/support/other clients/periods/idle and failure. For that record, target resource=quantity*target_driver/all_consumer_driver with positive complete denominator; then positive same-profile N_target once. Do not choose revenue/headcount/planned covers/capacity as unexplained proxy. Record reason/driver uncertainty and reject incompatible pooling."
    source_ids: []
  - rule_id: period_and_shared_life
    applies_to: "all shared operation/assets"
    rule: "Enumerate recipe/run/changeover/reporting/stock/holding/transport/service/cleaning phases and full asset manufacture-install-maintain-replace-termination/EOL phases. Link each resource/asset/output/event/consumer to actual periods. Actual shared asset/service is allocated once across every consuming node/job/user/period by sourced compatible lifetime driver: observed plus sourced remaining service or actual terminated total. Target annualN is not lifetime."
    source_ids: []
  - rule_id: rework_and_exit
    applies_to: "offspec/unused/used/return"
    rule: "Rejected or partial output never becomes accepted meal automatically. Link source batch/node/oldstate and actual rework/downgrade/useful transfer/waste exit; retain original and incremental burdens once. Useful export/recovery gets actual responsible attribution decision, not automatic virgin offset/substitution credit. Grossunused and netunused accounting are exclusive."
    source_ids: []
  - rule_id: zero_and_carry
    applies_to: "necessary idle/failed/N0 duties"
    rule: "Retain actual responsible pool, source/carry period, receiver and final resolution even when no target meal or internal transfer exists. Allocate actual necessary duty only to evidenced responsible real outputs or completed explicit linked supplement, never create fake positive output/divide by zero/drop resources. Unassigned or merely planned future resolution blocks full-chain use."
    source_ids: []
  - rule_id: projection_once
    applies_to: "all independently intended outputs"
    rule: "Apply allocation_projection: complete whole-operation output evidence before attribution; actual physical output quantity never multiplied by targetshare. Subdivide actual independent process duties before real shared attribution. Genuine jointly produced co-products need explicit actual PCR-specific decision. Target-attributed and unallocated-wholepool variants are mutually exclusive; independent other outputs cannot trigger second allocation of already target-attributed inputs."
    source_ids: []
  - rule_id: joint_output_precedence
    applies_to: "actual joint outputs retained as exchanges"
    rule: "The raw ALL-OUTPUT ledger keeps UNNORMALIZED actual full native quantities, not targetshare-scaled or per-reference. In target-attributed LCI independent other meals/products are audit-only, not co-product exchanges. If a documented actual PCR-specific decision retains a genuine joint product as final exchange, use its SELECTED ACTUAL PHYSICAL output quantity / same positive profile N_target ONCE (already-per-reference unchanged); never apply generic resource target-driver share to that physical output. This output rule has precedence over generic resource assignment. Separate unallocated wholepool variant keeps full inputs/alloutputs and exactly one designated attribution step."
    source_ids: []
