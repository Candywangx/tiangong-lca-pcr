system_boundary:
  rules:
    - rule_id: physical_route
      applies_to: "both nodes"
      rule: "Offsite multi-ingredient composition/treatment and protected packing, actual transport/receipt and onsite finishing/plated service/clear/return are real duties. Record before/after states, all input roles, handoffs and intended outputs versus residues. Mixing, cooking and packing remain in actual node; each cold/already-prepared component retains true route. Distribution is separately declared duty, not packaging."
      source_ids:
        - krisp-current-commissary-event-service
        - box-current-private-dining
        - silverfeast-current-event-route
    - rule_id: complete_exclusive_coverage
      applies_to: "all physical duties"
      rule: "Use complete physically matched provider OR direct underlying actual stages. Real missing food preparation/transport/wash/asset/receiver duties must be actually completed and integrated once, not promised future supplements or erased by an invoice. Unknown overlap/missing real duty blocks complete-chain claim."
      source_ids: []
    - rule_id: transport_owner
      applies_to: "offsite and onsite interfaces"
      rule: "Assign one actual owner per unique outbound/return/extra leg and associated holding/loading/cleaning/empty-run/asset/fuel/species responsibility. Own fleet requires actual fuel/electricity/maintenance/vehicle/site/receiver duties once; complete carrier dataset replaces exact covered portions only."
      source_ids: []
    - rule_id: return_wash_owner
      applies_to: "food and reusables returns"
      rule: "Pair actual forward and reverse transfers by ID/state/native quantity/time/receiver. Retained water/food in dirty load is nonadditive content. Wash at actual responsible node/provider and retain upstream manufacture/life; used return never unused supply credit."
      source_ids: []
    - rule_id: full_asset_land
      applies_to: "all assets and sites"
      rule: "Enumerate actual owned/leased/customer-supplied shared buildings, land, fitout, kitchens, vehicles, temporary equipment, containers/tableware/utensils/textiles and every consumer/period. Actual land native area*time and evidenced from/to transformation belong in complete asset/provider scope or separately completed interface; never convert land to Count."
      source_ids: []
    - rule_id: zero_transfer_no_erasure
      applies_to: "zero handoff or N_target"
      rule: "Zero actual prepared-food or return handoff cannot convey resources through a fake positive transfer. Retain real responsible pool and completed exclusive source/carry/receiver/supplement integration into actual final responsibility once. N0 unassigned burden or missing receiving/final resolution blocks completeness."
      source_ids: []
    - rule_id: qualitative_limits
      applies_to: "source use"
      rule: "Operator pages establish route questions only. Do not turn illustrative menu/courses/time/prices/counts into quantities, temperature/legal/nutrition/yield/lifetime/factors. Actual independently operated industrial preservation, laundry, energy generation or new production needs reviewed route expansion; actual normal holding/washing/cooking/logistics remain included."
      source_ids:
        - krisp-current-commissary-event-service
        - box-current-private-dining
        - silverfeast-current-event-route
    - rule_id: allocation_projection
      applies_to: "all output/resource projections"
      rule: "The whole-operation ALL-OUTPUT ledger is complete PRE-ATTRIBUTION evidence: every output keeps its actual FULL native quantity and lineage/recipient/gate/state/handofftime/source, never quantity*target_share. First decide actual independent-process subdivision versus genuine jointly produced co-products. For independent processes assign actual direct duties, then only real shared duty by supported physical driver. Genuine joint products require a documented PCR-specific actual attribution decision, owner and boundary; internal component/dirty/usable-return transfers are NOT co-products. Declare one projection variant and allocation_stage: (A) target-attributed LCI contains only target responsibility and actual linked internal duties; independent other-client/nonmeal outputs remain evidence-only, not extra co-products causing second allocation. (B) separately declared unallocated wholepool retains FULL inputs and ALL actual outputs and performs attribution at exactly one designated downstream step. Never mix A and B or reallocate A again."
      source_ids: []
    - rule_id: exclusive_food_input_roles
      applies_to: "food ingredient receipt and return inputs"
      rule: "site_ingredients covers ONLY actual additional externally bought independent food/ingredients not already covered by site_prepared_receipt. A paired internal receipt or usable-food return entering local stock is genealogy, not another external food manufacturing input. offsite_returned_food_receipt and dirty_receipt retain old-state original food/reusable burden, adding only actual new rework/wash/storage/transport duty. Identify source_input_role/internal_external/linked_input_coverage/nativequantity for each real input and exclude overlapping same physical food/stage from generic ingredient/reusable manufacture cards."
      source_ids: []
    - rule_id: physical_product_output_quantity
      applies_to: "all actual intended product outputs"
      rule: "The raw ALL-OUTPUT ledger keeps UNNORMALIZED actual full native quantities, not targetshare-scaled or per-reference. In target-attributed LCI independent other meals/products are audit-only, not co-product exchanges. If a documented actual PCR-specific decision retains a genuine joint product as final exchange, use its SELECTED ACTUAL PHYSICAL output quantity / same positive profile N_target ONCE (already-per-reference unchanged); never apply generic resource target-driver share to that physical output. This output rule has precedence over generic resource assignment. Separate unallocated wholepool variant keeps full inputs/alloutputs and exactly one designated attribution step."
      source_ids: []
