  calculation_rules:
    - id: food_stock
      applies_to: "food fuel materials and fluid stock"
      rule: "For one matching state/pool gross_drawn S = attributed opening + actual net receipts - attributed closing plus actually paired responsibility transfers. Net receipts remove packaging/noncargo tare only, BEFORE outbound returns. Choose S input with matching UNUSED output OR (S-UNUSED) input and OMIT that output. USED recovery/dirty return does not reduce new supply manufacture; actual returned usable/WIP burden remains linked."
      inputs:
        - "Actual opening/inbound/closing/paired unused and used return records with native operands"
      output: "Exclusive actual stock draw and return exchanges"
      source_ids: []
    - id: food_reconcile
      applies_to: "each recipe/batch/occasion"
      rule: "Reconcile actual ingredient/water additions and returned food with prepared/retained state, actual supplied/refill, usable export/rework/unserved discard/prep/cooking/spill losses, plate returns and independently supported direct water/other releases. Retained/consumed/wholemix/component views are nonadditive. No residual assumed loss/emission or fixed yield; every unresolved fate stays gap."
      inputs:
        - "Node food and paired-transfer records"
        - "actual composition/moisture and distinct food fates"
      output: "Complete state- and owner-linked food audit"
      source_ids: []
    - id: paired_handoff
      applies_to: "each actual forward/reverse transfer"
      rule: "At chosen same receipt gate offsite output amount/state/transferID equals onsite input; onsite dirty/usable return equals actual offsite receipt gate. Dispatch and receipt are separate observations reconciled with actual transit loss/holding change. Retain native measured quantities; do not fix food or dirty returns to final Count. Both nodes use same actual final-profile normalization once."
      inputs:
        - "Paired source/receiver/handoff/state/time/native measurement and loss records"
      output: "One actual linked internal quantity and responsibility"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "First retain actual exclusive direct target quantity OR calculate actual same-pool quantity*target_driver/positive complete all_consumer_driver. Sum unique compatible attributed records then divide positive same-profile N_target ONCE; already per-reference unchanged. N_target=0 carries real owner/source/receiver/final resolution without division; no fictional output."
      inputs:
        - "Each native quantity/driver with own metadata"
        - "actual all consumers/periods and N_target"
      output: "per reference flow"
      source_ids: []
    - id: freight_sum
      applies_to: "offsite_freight; site_freight"
      rule: "freight_per_reference = sum_unique_load_leg(actual_packed_wet_payload_t * actual_distance_km * actual_EACH_repeat_or_TOTAL_once * THAT_record_actual_share) / positive_same_profile_N_target. Only actual vehicle/noncargo tare is removed. Food/ice/pack/container/support/equipment carried mass retained. Complete provider OR actual exclusive ownfleet energy/assets/species/receiver/empty duty; already per-reference unchanged."
      inputs:
        - "Native gross/tare/payload/distance/repeat/share with own metadata and unique load-leg IDs"
      output: "Actual t*km and exclusive complete transport responsibility per reference flow"
      source_ids: []
    - id: exclusive_coverage
      applies_to: "all provider/direct/asset/receiver duties"
      rule: "Crosswalk physical stage/component/site/time/owner/native amount to complete matching provider dataset OR direct duties. Actually missing stages must be completed integrated once with source/native quantity/state/time/owner and explicit coverage/exclusions before complete-chain use. Overlap, unknown owner or merely planned supplement blocks completeness."
      inputs:
        - "Completed provider and direct stage matrix plus datasets/native quantities/exclusions"
      output: "Complete exclusive physical responsibility"
      source_ids: []
    - id: asset_life
      applies_to: "all actual shared assets and land"
      rule: "Attribute complete manufacture/install/maintain/replace/EOL quantity by actual target_life_driver/positive complete all_life_driver across every user/node/period. Full driver=actual observed plus sourced compatible remaining service OR actual terminated total; no double use of both. Native land area*time and evidenced transformation from/to event are separate compatible interfaces. Annual targetN/nominal capacity/default years are not complete life."
      inputs:
        - "Actual asset stages/alluser history/sourced remaining or termination and land records"
      output: "Actual full-life target responsibility once then per reference flow"
      source_ids: []
    - id: fluid_exclusivity
      applies_to: "each material/species stock and equipment"
      rule: "Keep standalone opening/new supply, stored/installed/recovered closing, matched UNUSED return, useful recovered old-state export, contained waste and independently supported direct release mutually exclusive. Each other receipt/paired inflow/paired outflow and whole-equipment retained-content exit has its own actual native quantity/metadata. Factory-new retained content absent standalone opening stays equipment responsibility. Actual wholeasset content/component audit is nonadditive; unknown difference is not emission. USED export gives no virgin manufacture subtraction or automatic credit."
      inputs:
        - "Equipment service/material stock/wholecontent/receiver/environment records with native operands"
      output: "Exclusive species/stock/content/fate audit"
      source_ids: []
    - id: terminal_reconcile
      applies_to: "water mixtures pollutants and receivers"
      rule: "Reconcile independent measured input/stock/retained/terminal outputs by matching material/species/state/owner/time. Exclude internal enduse/transfer and duplicate receiver views from terminal sum. Whole genuine mixture is one stream with nonadditive components; separate unrelated streams/species/receiving media expand independently. Water vapour to air is Elementary Mass; contained wastewater is Waste; unresolved residual stays explicit unknown."
      inputs:
        - "Native independently measured water/mixture/content/species/stock/fate records and actual receiver links"
      output: "Nonduplicated actual terminal responsibility and explicit gaps"
      source_ids: []
