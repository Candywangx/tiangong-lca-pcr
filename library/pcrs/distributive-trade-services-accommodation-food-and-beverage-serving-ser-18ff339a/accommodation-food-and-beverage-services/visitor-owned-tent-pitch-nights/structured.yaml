      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| complete_pool | all resources | Use actual direct trace OR actual resource_quantity*compatible target_driver/positive COMPLETE all_consumer_driver. Enumerate tent/RV/cabin/day/retail/common/other users and actual periods; no default equal-pitch/guest/area/fee fraction. Necessary vacant/standby/weather closure/ground recovery/failed/cancel/no-show duties of this supply pool enter pool totals before actual output attribution. Evidence alone may separate a real other consumer; ledger-only unowned idle shares block completeness. Raw assigned target total/positive EXACT same-scopeN once; already per reference no second division, N0 retains source/carry/receiving/resolution links. |  |\n| full_life | site assets/reusables | Full lifecycle service uses actual asset_native_quantity*compatible equivalence*job_used_driver/positive lifetime_all_user_driver, including observed all-user history+sourced remaining driver or actual termination, each native metadata and uncertainty/update. Annual occupiedN is not asset life. A capacity/calendar driver must include corresponding necessary idle/rest/closed responsibility in numerators and exhaust full burden across real pools/users/remaining life. One full provider OR actual underlying asset/operations/stages, not both. |  |\n| stock_and_returns | supplies/fluids | S=assigned opening+NET external receipts-closing including retained recovery, exclude supply container tare. Gross S/N INPUT plus actual matched UNUSED return/N OUTPUT OR consumed-only (S-return)/N INPUT with matched OUTPUT OMITTED. Internal recovery not receipt. Only evidenced UNUSED same-source/state standalone substock may net; USED recovered fluid/material export is actual-state transfer, not new-supply manufacture deduction, negative input or automatic credit. |  |\n| ground_rejects | failed pitch/maintenance routes | Actual wet/unsafe/closed pitch, failed preparation and rejected materials retain original resources and actual remediate/reinspect/reuse/repair/return/receiver paths linked to source event. Do not count unprovided pitch as accepted night or a repair as extra pitch output; actual delivered legitimate service is not erased by payment reversal or guest declining an optional task. |  |\n| land_responsibility | land interfaces | Current occupation uses actual disjoint polygon-area*actual compatible duration and complete actual land category/site duties for that period, with necessary idle/rest/closure burden assigned to real supply responsibility. Actual transformation from/to a single event is nonrepeated physical area, attributed through its evidenced responsible site/service lifetime once. Historical conversion cannot be inferred from current land label; provider/asset-covered identical land stage is not added again. |  |\n| receiver_ownership | all fates | Distinct actual useful/Waste/contained/direct species streams separately expand. Whole asset/part/real mixed stream/components/retained liquid are nonadditive physical views. Actual receiver transport/treatment and capital/provider EOL duty have one coverage owner; no automatic recovery/biogenic carbon/substitution credit or missing-data zero. |  |\n\n"
