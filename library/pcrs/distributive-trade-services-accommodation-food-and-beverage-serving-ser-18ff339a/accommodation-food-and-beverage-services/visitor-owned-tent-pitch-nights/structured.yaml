      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| real_reference | occupied_tent_pitch_night | Actual visitor-owned tent, exclusive designated pitch boundaries/time/configuration/fulfilled local night acceptance and reversal/move evidence; no guest/tent/area/fee/capacity/night-hour shortcut. No operator shelter/RV/shared per-person equivalent; actual surface/hookup configuration declared. |  |\n| pool_and_period | all resources | Complete all actual users and periods, necessary standby/weather closure/ground rest/vacancy/failed/cancel/no-show duties inside responsible pool totals before positive same-scopeN once. N0 source/carry/receiving/resolution complete; unowned or unresolved responsibilities block final package, not zero. |  |\n| complete_life_provider | assets/providers/land | All actual site/common-asset/reusable lifecycle and land stages covered once, observed+sourced remaining compatible all-user life/equivalence/termination and uncertainty/update. AnnualN not lifetime, capacity/calendar idle responsibility not omitted. Actual missing stages actually integrated with quantity/source/owner/coverage; pending plan insufficient. |  |\n| land_truth | land interfaces | Verify actual land category, nonoverlapping polygons, native area/duration/calendar and paired actual from/to conversion event; unknown category/history not assumed or zero. Current occupation versus historic conversion and fullasset/provider land overlap have explicit exclusive owner/stage matrix, no duplicate capital-life area*time as current land. |  |\n| stock_receiver_species | all flows | NET excludes supply tare; gross INPUT+matched UNUSED OUTPUT OR consumed INPUT/OMIT matching OUTPUT. Used recovered fluids not new supply/negative manufacture credit. Real different receiver identities expand; true mixtures/whole/components retained contents nonadditive. Contained liquid Waste, actual environmental water and air vapour own media/property; unknown residual/topup not emission/zero. |  |\n| native_load_and_source | all quantities | Every independent operand native metadata and actual conversions; EACH/TOTAL once, cargo water/packaging/supports retained, only noncargo vehicle tare, per-record share inside sum/N once. No actual load/land/species or factor invented from source examples. Generic numerical ranges alone optional; source-backed interval traceable/compatible and empirical QA guardrail independently comparable. |  |\n| actual_binding_and_route | final data use | Actual concrete identities/support, quantities, acceptance, complete actor/provider/receiver duties and land/lifetime responsibility mandatory before final binding. Conditional umbrellas expand actual zero/one/many concrete flows. Real independent generation/treatment/food/industrial operations require reviewed route/modules; missing measurement not occurrence or absence proof. |  |\n\n"
