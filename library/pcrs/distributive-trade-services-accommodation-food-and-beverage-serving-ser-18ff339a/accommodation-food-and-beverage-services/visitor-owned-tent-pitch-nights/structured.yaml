ource; tent_count; tent_count_unit; tent_count_basis; tent_count_method; tent_count_state; tent_count_sample_time; tent_count_source; vehicle_count; vehicle_count_unit; vehicle_count_basis; vehicle_count_method; vehicle_count_state; vehicle_count_sample_time; vehicle_count_source; actual_pitch_area; actual_pitch_area_unit; actual_pitch_area_basis; actual_pitch_area_method; actual_pitch_area_state; actual_pitch_area_sample_time; actual_pitch_area_source; actual_elapsed_duration; actual_elapsed_duration_unit; actual_elapsed_duration_basis; actual_elapsed_duration_method; actual_elapsed_duration_state; actual_elapsed_duration_sample_time; actual_elapsed_duration_source"
