    - id: meter_quantity
      applies_to: "purchased_electricity, purchased_thermal_service; purchased_electricity_ac; purchased_thermal_service_delivered_heat"
      rule: "Actual utility=compatible(register_end-register_start+register_adjustment)*needed meter_multiplier*native_conversion_factor OR actual interval quantity*needed native conversion; each applied only once. Actual same-interval average_power*elapsed_duration only with unit/duty evidence, not integrated kWh*time or nameplate. Actual useful heat delivery state/provider covered carrier/plant exclusive. Attribute actual duty then N once."
      inputs:
        - cp_energy
      output: "Actual utility quantity"
      source_ids: []
    - id: stock_rule
      applies_to: "cleaning_supplies, operator_guest_supplies, operating_fuel, grounds_materials, unused_supply_returns; cleaning_supplies_synthetic_detergent"
      rule: "S=assigned opening+NET external receipts-closing including retained recovery, exclude supply container tare. Gross S/N INPUT plus actual matched UNUSED return/N OUTPUT OR consumed-only (S-return)/N INPUT with matched OUTPUT OMITTED. Internal recovery not receipt. Only evidenced UNUSED same-source/state standalone substock may net; USED recovered fluid/material export is actual-state transfer, not new-supply manufacture deduction, negative input or automatic credit."
      inputs:
        - cp_materials
        - cp_energy
        - cp_grounds
      output: "Exclusive normalized supply and matched unused return"
      source_ids: []
    - id: ground_events
      applies_to: "grounds_materials, usable_grounds_residues, grounds_waste"
      rule: "Actual native event/material quantity uses matched EACH count once OR TOTAL unchanged, with native conversions. Independent same-sample water-only w_wet=m_water/m_as_received and r_dry=m_water/m_nonwater permit w_wet=r_dry/(1+r_dry) and m_nonwater=m_as_received*(1-w_wet), after actual percent-to-ratio. Other volatiles/soil/vegetation composition not automatically water/fibre. Retained mulch internal, accepted usable export or receiver Waste exclusive. Necessary failed/rest/closed event resources stay pool before N once."
      inputs:
        - cp_grounds
      output: "Actual nonadditive grounds fates and quantities"
      source_ids: []
    - id: asset_service
      applies_to: "full_life_site_assets"
      rule: "Full lifecycle service uses actual asset_native_quantity*compatible equivalence*job_used_driver/positive lifetime_all_user_driver, including observed all-user history+sourced remaining driver or actual termination, each native metadata and uncertainty/update. Annual occupiedN is not asset life. A capacity/calendar driver must include corresponding necessary idle/rest/closed responsibility in numerators and exhaust full burden across real pools/users/remaining life. One full provider OR actual underlying asset/operations/stages, not both."
      inputs:
        - cp_assets
      output: "Actual full-life site service equivalent"
      source_ids: []
    - id: provider_quantity
      applies_to: "external_support_service"
      rule: "Actual supplied service quantity*needed supported native physical_equivalence*needed compatible all-client target share, each only when not already converted/attributed; then same-scopeN once unless already per reference. Complete coverage of actual materials/utilities/assets/land/freight/receiver OR actual completed missing-stage integrations, not both or only planned list."
      inputs:
        - cp_providers
      output: "Actual complete physical provider results"
      source_ids: []
    - id: fluids_ledger
      applies_to: "maintenance_fluids, usable_recovered_fluids, contained_fluid_waste"
      rule: "Reconcile opening_installed+opening_stored+opening_recovered+new_factory_entry+net_standalone_receipts+other_exclusive_receipts = closing_installed+closing_stored+closing_recovered+matched_unused_return+used_usable_export+independent_contained_waste+retained_whole_asset_content+measured_direct_release+unknown_residual+other_exclusive_exits. Stored excludes separately listed recovery; new factory-entry not already opening/anyreceipt; other terms exclude named roles, internal transfer cancels. Native source/state/scope compatible, whole-content views nonadditive. Initial manufacture once in asset; only matched UNUSED same-source/state standalone stock may net/OMIT, all used recovery separately recorded actual-state transfer, not new manufacture deduction or automatic credit. Unknown not emission/zero."
      inputs:
        - cp_fluids
      output: "Exclusive actual fluid stock/charge/fates"
      source_ids: []
    - id: load_work
      applies_to: "supply_freight"
      rule: "Actual freight=SUM(unique load-leg: compatible payload_kg*distance_km*EACH_actual_repeatcount_if_needed*THAT_record_share)/positive same-targetN once. Payload actual direct OR gross minus ONLY noncargo/vehicle tare; TOTAL already repeated unchanged; all cargo water/packaging/supports retained. Each native conversion/source and share inside sum, no repeated already-attributed share or already-per-referenceN."
      inputs:
        - cp_freight
      output: "Actual kg*km per reference"
      source_ids: []
    - id: land_interfaces
      applies_to: "land_occupation, land_transformation_in, land_transformation_out"
      rule: "Current occupation uses actual disjoint polygon-area*actual compatible duration and complete actual land category/site duties for that period, with necessary idle/rest/closure burden assigned to real supply responsibility. Actual transformation from/to a single event is nonrepeated physical area, attributed through its evidenced responsible site/service lifetime once. Historical conversion cannot be inferred from current land label; provider/asset-covered identical land stage is not added again."
      inputs:
        - cp_land
        - cp_assets
      output: "Exclusive actual occupation and conversion interfaces"
      source_ids: []
    - id: water_fates
      applies_to: "supplied_water, actual_water_withdrawal, contained_wastewater, direct_water_outfall; supplied_water_liquid_tap"
      rule: "Use independently measured actual native supply/withdrawal/receiver/outfall quantities and true composition/state. Density-temperature conversion only applicable material/state; direct vapour needs measured/method-supported species mass. Water supply minus unknown stock/retention is not wastewater, vapour or zero. Actual different streams expand, whole/component retained views nonadditive and actual provider/receiver scope once; target attribution then N once."
      inputs:
        - cp_water
        - cp_fates
        - cp_releases
      output: "Actual evidence-supported water and receiver states"
      source_ids: []
    - id: species_amount
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Actual measured_species_mass OR compatible actual_activity*emission_factor, with exact actual species/particle/medium and each native operand unit/basis/method/state/sampletime/source. Necessary composition/fate/gas conversion only if not included in complete factor, once with actual state/temperature/pressure evidence. Unknown purchases/grass/stock/charge/water residual do not establish emission/uptake/zero or automatic biogenic credit. Provider/asset covered release not repeated; exclusive duty attribution then same-target positiveN once."
      inputs:
        - cp_releases
      output: "Actual supported species amount"
      source_ids: []
