validation_rules:
  - rule_id: real_reference
    applies_to: "occupied_tent_pitch_night"
    rule: "Actual visitor-owned tent, exclusive designated pitch boundaries/time/configuration/fulfilled local night acceptance and reversal/move evidence; no guest/tent/area/fee/capacity/night-hour shortcut. No operator shelter/RV/shared per-person equivalent; actual surface/hookup configuration declared."
    source_ids: []
  - rule_id: pool_and_period
    applies_to: "all resources"
    rule: "Complete all actual users and periods, necessary standby/weather closure/ground rest/vacancy/failed/cancel/no-show duties inside responsible pool totals before positive same-scopeN once. N0 source/carry/receiving/resolution complete; unowned or unresolved responsibilities block final package, not zero."
    source_ids: []
  - rule_id: complete_life_provider
    applies_to: "assets/providers/land"
    rule: "All actual site/common-asset/reusable lifecycle and land stages covered once, observed+sourced remaining compatible all-user life/equivalence/termination and uncertainty/update. AnnualN not lifetime, capacity/calendar idle responsibility not omitted. Actual missing stages actually integrated with quantity/source/owner/coverage; pending plan insufficient."
    source_ids: []
  - rule_id: land_truth
    applies_to: "land interfaces"
    rule: "Verify actual land category, nonoverlapping polygons, native area/duration/calendar and paired actual from/to conversion event; unknown category/history not assumed or zero. Current occupation versus historic conversion and fullasset/provider land overlap have explicit exclusive owner/stage matrix, no duplicate capital-life area*time as current land."
    source_ids: []
  - rule_id: stock_receiver_species
    applies_to: "all flows"
    rule: "NET excludes supply tare; gross INPUT+matched UNUSED OUTPUT OR consumed INPUT/OMIT matching OUTPUT. Used recovered fluids not new supply/negative manufacture credit. Real different receiver identities expand; true mixtures/whole/components retained contents nonadditive. Contained liquid Waste, actual environmental water and air vapour own media/property; unknown residual/topup not emission/zero."
    source_ids: []
  - rule_id: native_load_and_source
    applies_to: "all quantities"
    rule: "Every independent operand native metadata and actual conversions; EACH/TOTAL once, cargo water/packaging/supports retained, only noncargo vehicle tare, per-record share inside sum/N once. No actual load/land/species or factor invented from source examples. Generic numerical ranges alone optional; source-backed interval traceable/compatible and empirical QA guardrail independently comparable."
    source_ids: []
  - rule_id: actual_binding_and_route
    applies_to: "final data use"
    rule: "Actual concrete identities/support, quantities, acceptance, complete actor/provider/receiver duties and land/lifetime responsibility mandatory before final binding. Conditional umbrellas expand actual zero/one/many concrete flows. Real independent generation/treatment/food/industrial operations require reviewed route/modules; missing measurement not occurrence or absence proof."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Actual visitor-owned-tent pitch-night campsite space service with full attributable site/common-duty lifecycle and exclusive land interfaces"
  allowed_use: "Actual exclusive designated visitor-tent pitch/local-night with native plan/configuration/hookup/service-scope/occupancy evidence and completed provider/land/fullasset responsibility"
  excluded_use: "RV/operator shelter/shared per-person field/trip/wholecamp package equivalence, unused-booking or capacity reference, zero common load from no hookup, missing land/provider/asset duties, unreviewed independent production"
  required_metadata: "All16reference qualifiers, actual pitch space/time/configuration and fulfilledN, guests/tents independent; complete all-user/site-period duties, weather/rest/idle closure, native land category/area-time/event/stage-owner matrix, fullasset observed+remaining life, actual material/utility/provider/freight/fate/species evidence"
  required_quality_disclosure: "Actual source age/site/configuration scope, measured versus estimated native data, unresolved identity/support/land category/lifetime/quantity and unassigned duty/carry; uncertainty/sensitivity/update and source example limits"
  update_trigger: "Changed pitch boundaries/surface/hookup/supplied shelter or package, actual local night convention, shared users, ground/land category/events, provider/asset life/fates/concrete identities, actual independent conversion/treatment/food/recreation production"
data_sources:
  - id: "unsd-cpc3-campsites"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Official CPC3 explanatory notes30June2025, printed355 from retained exact extraction.63120 is recreational vehicle/tent/sleepingbag space provision, while63130 combines overnight, food and recreation/training package. Classification only; not actual site layout, pitch dimensions, delivered night duration, facility package or physical factors. Direct detail web page access failed; official PDF extraction is the classification evidence."
  - id: "ccc-pitch-types"
    type: "extension_guidance"
    reference: "https://www.campingandcaravanningclub.co.uk/campsites/pitch-types/"
    used_for: "Current first-party Pitch Types webpage differentiates grass pitches without electrical connections, grass/hardstanding electrical variants and serviced variants with water/drainage. Specific provider examples, including dimensional labels, are not universal pitch specifications or resource quantities. Lack of pitch hookups does not prove no shared utility/amenity duty."
  - id: "ccc-sandringham-facilities"
    type: "extension_guidance"
    reference: "https://www.campingandcaravanningclub.co.uk/campsites/uk/norfolk/sandringham/sandringham-camping-and-caravanning-club-site/"
    used_for: "Current first-party site page shows tent acceptance and non-electrical grass pitch type alongside shared toilets, hot showers, dishwashing, laundry, roads, lighting, reception/access and waste interfaces. Booking form asks camping-unit/size/arrival/departure. FAQ items explicitly carry28April2023 modification dates; page displays2026/2027 seasonal opening periods. A dated qualitative route example, not actual target-site records or assumptions that every facility is present, consumed at a fixed rate, included or free. No minimum-stay/price/capacity/checkin/area/default-cleaning or energy conversion factor is imported."
  - id: "ruby-own-tent-context"
    type: "extension_guidance"
    reference: "https://www.rubycountrycamping.co.uk/pitch-your-own"
    used_for: "First-party operator offers visitors own-tent camping on maintained meadow pitches separately from furnished bell-tent rental. The page also describes sanitation, supplied wash products, optional goods/recreation and charging/solar lighting despite no mains electricity. Context confirms physical distinction between pitch provision and tent supply and that no mains electricity is not zero energy. Do not import pitch count, guest count, prices, soil management recipe, wastewater technology or solar-generation defaults. Actual onsite conversion/treatment requires reviewed scope/modules, not inference from this example."
