        - marriott-manho-service-current
        - ikea-counter-service-current
        - mcdonalds-pickup-2023-current
    - rule_id: output_projection_once
      applies_to: "all intended output ledgers and final projections"
      rule: "The complete all-output ledger is physical pre-attribution evidence: each other customer/menu/nonfood output retains its real native handoff amount, never raw amount times targetshare as its physical quantity. Declare output_role, actual process/subdivision versus genuinely joint co-product, allocation_stage, lineage and actual PCR-specific decision. In a target-allocated LCI, other independently produced meals/services are attribution evidence and not target co-product exchanges; subordinate courses/refills/internal transfers are not co-products. Preserve unallocated whole-pool only with complete inputs AND all native outputs and allocation at one designated step. Do not combine whole-pool outputs with already target-attributed resources or allocate twice. Output-specific quantity precedence: raw ledger keeps actual UNNORMALIZED native physical amounts. Only a true joint-output exchange retained by actual decision uses selected native physical output amount divided by positive same-profile N_target once, NEVER resource targetshare; already-per-reference unchanged. This output rule overrides generic assigned-resource normalization."
      source_ids: []
    - rule_id: dedicated_classification_gate
      applies_to: "ongoing_contract_meal_service"
      rule: "This PCR applies only to ongoing onsite food preparation and serving at a customer-specified institutional, governmental, commercial or industrial location under a continuing food-service contract, including concession canteen/cafeteria operation, for customers other than transportation companies. Retain the actual client/operator division of kitchen, utilities, assets, staff and waste duties and integrate each duty once. A contract payment, guaranteed minimum or unused meal entitlement is not delivered output. Specific-event catering, transportation-company catering, offsite commissary supply and ordinary noncontract restaurant/takeaway service are outside this onsite route. Dedicated scope eligibility and the actual completed output gate must both be evidenced. Keep other classifications and incompatible configurations out of N_target, but retain all real other consumers, idle duties and full-lifecycle burdens in their appropriate resource pools. Unknown eligibility blocks use; it is not zero."
      source_ids:
