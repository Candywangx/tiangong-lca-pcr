        - component_id
        - reversal_id
        - cp_service
      output: "N_target"
      source_ids: []
    - id: attribute_pool
      applies_to: "all inventory rows"
      rule: "Execute all_user_pool per record with direct trace OR compatible raw quantity times that target driver divided by complete positive all-consumer driver; then sum, retain necessary idle/N0/carry responsibility."
      inputs:
        - raw_quantity
        - target_driver
        - all_consumer_driver
        - coverage_id
      output: "assigned_target_quantity"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "Assigned same-profile target quantity divided by positive same-scope N_target once; already-per-reference unchanged; N_target=0 retains source/receiver/finalresolution without division."
      inputs:
        - assigned_target_quantity
        - N_target
      output: "per_reference_quantity"
      source_ids: []
    - id: stock_returns
      applies_to: "actual supplies fluids food"
      rule: "Execute returns_exclusive from actual opening/inbound/closing and paired transfers; gross drawn with matched unused output OR net consumed with that output omitted, not both."
      inputs:
        - opening_mass
        - inbound_mass
        - closing_mass
        - paired_transfer_mass
        - unused_return_mass
      output: "exclusive_stock_quantity"
      source_ids: []
    - id: food_reconcile
      applies_to: "food stocks and fates"
      rule: "Execute food_fate_boundary on actual same-basis stock/batch food/component/water states, including actual recipe inputs, served/refill/retained/usable/waste/air fates. Internal transfer and whole/component audits nonadditive; unexplained gap remains unknown."
      inputs:
        - cp_food
        - cp_water
        - cp_fates
        - cp_air
      output: "state_balance_and_gaps"
      source_ids: []
    - id: freight_sum
      applies_to: "freight"
      rule: "Sum actual unique leg packed wet cargo times distance times EACH repetition if applicable times THAT record share inside sum; TOTAL unchanged; provider-covered leg excluded once; normalize_once only afterward."
      inputs:
        - packed_wet_payload
        - distance
        - repetition
        - record_share
        - cp_freight
      output: "attributable_freight"
      source_ids: []
    - id: asset_life
      applies_to: "asset_lifecycle; reusable_lifecycle"
      rule: "Execute full_life_land and full_life_once using complete actual life numerator and compatible observed plus sourced remaining service OR actual terminated total; preserve all users/replacements/EOL and exclusive complete provider stage coverage."
      inputs:
        - cp_assets
        - cp_land
        - cp_providers
      output: "attributable_full_life_duty"
      source_ids: []
    - id: fluid_reconcile
      applies_to: "equipment_fluid_supply; fluid fates"
      rule: "Execute fluid_roles over exclusive opening/receipt/factory entry/closing/recovery/export/release roles; factory new entry absent opening and other receipts; retained contents/whole equipment nonadditive and unknown not release."
      inputs:
        - cp_fluids
        - cp_air
        - cp_assets
      output: "exclusive_fluid_balance"
      source_ids: []
    - id: source_species
      applies_to: "direct_water_withdrawal; other_direct_species; water_vapour_to_air; other_direct_species_co2_fossil_air; other_direct_species_methane_fossil_air; other_direct_species_nitrous_oxide_air"
      rule: "Actual compatible measurement OR sourced activity/factor/composition/fate only with each own unit/basis/method/state/sampletime/source; do not manufacture factor, recipe yield, species or medium."
      inputs:
        - cp_air
        - cp_water
      output: "actual_species_quantities"
      source_ids: []
