product_category_identity:
  canonical_pcr_id: "pcr.ongoing-onsite-contract-canteen-meal-occasions"
  classification_refs: "CPC 3.0:63393 (narrower)"
  covered_products: "This PCR applies only to ongoing onsite food preparation and serving at a customer-specified institutional, governmental, commercial or industrial location under a continuing food-service contract, including concession canteen/cafeteria operation, for customers other than transportation companies. Retain the actual client/operator division of kitchen, utilities, assets, staff and waste duties and integrate each duty once. A contract payment, guaranteed minimum or unused meal entitlement is not delivered output. Specific-event catering, transportation-company catering, offsite commissary supply and ordinary noncontract restaurant/takeaway service are outside this onsite route."
  excluded_products: "Mobile dining/commissary-transport-onsitefinish; beverage-only; mere orders/payments/capacity; unequal recipes/portions/configurations without evidence; lodging/camp bundle"
  representative_product: "Actually completed ongoing onsite contract canteen meal occasion"
  production_route: "Actual receiving/stocks -> onsite composition/preparation/cooking/coldassembly -> holding/portioning/serving -> recipient complete gate, returns/warewashing/cleanup"
  market_state: "Physically supplied complete declared food-related service; food/component quantities and assets remain independent native views"
functional_unit:
  what: "Actually completed ongoing onsite contract canteen meal occasion"
  how_much: "1 Item(s)"
  how_well: "One declared equivalent menu/component/recipe/portion/service-version actually fully supplied to its recipient gate; actual related beverages/refills/duties included and reversals reconciled; no universal diner or dish equivalence"
  how_long_or_cycle: "Actual serviceoccasion/component/batch start-end local time/UTC-offset/timezone/DST and elapsed duration; continuous readiness, stock/reporting and full asset life separately retained; no default duration"
  reference_flow_link: "ongoing_contract_meal_service"
system_boundary:
  rules:
    - rule_id: service_gate
      applies_to: "onsite_meal_service"
      rule: "Only actual completed compatible meal service is final. Record all contracted/included components, recipient, completed handoff, state/time and deviations; optional declined/refill rights follow actual package evidence. Ordering/payment/kitchen-ready alone insufficient. Coldplate and cooked courses retain actual formulation/treatment state; no universal nutrition or portion."
      source_ids:
        - marriott-manho-service-current
        - ikea-counter-service-current
    - rule_id: actual_kitchen_boundary
      applies_to: "onsite_meal_service"
      rule: "Food ingredient/related beverage solids/liquids/oils/fats/seasonings and composition water/ice are actual composition roles; link actual recipe/formulation to prepared/cooked/held/as-served output. Same real kitchen owns input-state transformation, portion handoff and cleanup; no artificial double nodes. Actual offspec/rework/retained/useful/waste states each linked to original batch."
      source_ids:
        - ivy-kitchen-current
        - marriott-signature-kitchen-current
    - rule_id: complete_duties
      applies_to: "all duties"
      rule: "Include actual upstream supplies/losses, site/building/fitout/equipment/reusable full manufacture-install-maintain-replace-EOL and actual waste receivers. One complete provider OR exclusive underlying stages; missing actual stage must be completed integrated once, not future plan/disclosure only. Moving/commissary/independent industrial routes require reviewed expansion."
      source_ids: []
    - rule_id: food_fate_boundary
      applies_to: "food stocks and fates"
      rule: "Opening/inbound/closing raw/prepared/held/served stocks, refills/rework/preparation/unserved/plate waste, water/steam/fat/solute/packaging and real accepted useful exits remain distinct native records. Whole meals/components/retained contents and service/eaten-mass views nonadditive; exclude internal transfers/enduse duplicate receiver views from terminal balances. Unknown residual is not waste/emission."
      source_ids: []
    - rule_id: all_user_pool
      applies_to: "all shared resources"
      rule: "Direct physical trace first OR for each record compatible raw quantity*target_driver/positive COMPLETE all_consumer_driver, then sum. Include target/other menu/mode/customer/staff/event/takeaway/nonfood building users and all actual periods. Necessary idle/failed/cancel/no-show/closed/readiness duties remain in responsible pool before attribution. Retain N0 source/carry/receiving/finalresolution; unresolved owner blocks completeness. Divide assigned total by positive identical-profile N_target once, already-per-reference unchanged."
      source_ids: []
    - rule_id: full_life_land
      applies_to: "asset_lifecycle; reusable_lifecycle; land interfaces"
      rule: "Full asset/provider/site life covers all observed use plus sourced compatible remaining service OR actual terminated total with replacements/maintenance/EOL, not annual N_target/nominal capacity or invented years. Native land occupation area*time and actual evidenced transformation prior/resulting-state/date/area/owner retain exact physical coverage links. Provider/asset-covered same land not repeated; missing actual land duty completed once before complete use."
