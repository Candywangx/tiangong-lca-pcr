    - rule_id: other_output_native_gate
      applies_to: "all intended outputs and useful transfers"
      rule: "For EACH target or other meal/nonfood output record its ownID/recipient/gate/state/handofftime/source and actual other_output_native_quantity with own native metadata; do not restrict the all-output ledger to meal count/food kg. Match actual usable food/reusable/fluid transferID and its actual native transfer quantity to recipient record; whole-service and subordinate transfer audits nonadditive."
      source_ids: []
    - rule_id: terminal_water_closure
      applies_to: "all actual water interfaces"
      rule: "Record actual water stock opening/closing, paired transfers and external terminal fate/receiver IDs/native quantities. Close terminal balance only: food moisture/composition water, cleaning-solution water, enduses/fills/internal transfers and contents retained in closing stocks are nonadditive views of the same physical source, not additional inputs/exits. Independent terminal exported water/airvapour/effluent and retained closing membership remain actual linked native evidence; unknown difference not vapour."
      source_ids: []
    - rule_id: empty_duty_complete
      applies_to: "freight and actual necessary empty returns"
      rule: "Zero kg*km cannot convey necessary empty vehicle duty. Use an actual matched complete carrier/provider covering the real empty return/positioning operation OR actually integrate exclusive uncovered vehicle operation/fuel/assets/native duty quantities once with source/state/time/owner/coverage links. Required actual empty-duty asset/provider stages must be completed, not deleted or replaced by fictitious cargo/meal."
      source_ids: []
    - rule_id: fluid_native_roles
      applies_to: "equipment-fluid ledgers"
      rule: "Each charge/lot/source/receiver paired role has actual IDs and paired_transfer_quantity; other actual receipts retain role/source/native other_receipt_quantity; whole-equipment export retains actual retained-content exitID and whole_equipment_retained_content_exit quantity, nonadditive with equipment/installed stock views. Include all actual nonair fates and independent measured release, unknown_balance never emission or new-manufacture credit."
      source_ids: []
    - rule_id: presentation_boundary
      applies_to: "onsite_meal_service"
      rule: "Before presentation food is actual prepared/cooked/held ready-to-eat state; actual portioned plated/tray-presented or protected takeaway state reaches declared recipient gate with actual composition/portion/temperature/pack condition. Actual reusable plates/trays/cutlery/glassware/linen and expendable cups/boxes/wrapping/napkins have own material/reuse roles, stock/loss/cleaning/end-of-use and real receiver. Keep food/pack interface native and nonadditive. Same onsite operation owns presentation; no extra artificial node. Distribution/logistics is separately declared freight/provider duty only when actual gate/coverage requires it, not packaging activity or automatic lastmile."
