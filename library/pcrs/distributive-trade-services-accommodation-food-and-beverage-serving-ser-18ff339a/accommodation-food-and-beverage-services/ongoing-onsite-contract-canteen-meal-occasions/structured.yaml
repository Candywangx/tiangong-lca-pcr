allocation_rules:
  - rule_id: output_completeness
    applies_to: "all outputs"
    rule: "Enumerate every intended target and other actual menu/version/portion/service/customer/staff/complimentary/nonfood output with ownID/recipient/gate/state/handoff/time/source/native quantity. Distinguish useful other output from residue/waste and internal rework. No universal dish-to-service or food-mass-to-service ratio."
    source_ids: []
  - rule_id: physical_precedence
    applies_to: "all resources"
    rule: "Apply all_user_pool resource-specific direct task/meter trace first; otherwise evidence-compatible full physical drivers, record decision and sensitivity. No price, nutrition, counts of unequal meals or service-mode label substitutes actual causal evidence. Independent output handoffs cannot count same service twice."
    source_ids: []
  - rule_id: run_period_closure
    applies_to: "all runs periods assets"
    rule: "Preparation/cooking/holding/serving/cleanup/changeover batches link to continuous refrigeration/readiness periods and actual inventory closure. Shared runs and recipe changes retain compatible output attribution and original burdens; no universal yield, rejected counts as final, or second new-input burden for internal rework. Crossperiod carry has real source/recipient/finalresolution."
    source_ids: []
  - rule_id: returns_exclusive
    applies_to: "actual supplies and fluids"
    rule: "S is attributed opening plus actual inbound minus closing with paired responsibility transfers. Use gross S input plus matched UNUSED external return output OR input S minus that UNUSED and omit that return output. Net receipt only removes tare before returns. USED usable recovery retains old state/original burden and is never unused new supply or automatic credit."
    source_ids: []
  - rule_id: full_life_once
    applies_to: "assets providers land"
    rule: "Apply full_life_land and all_user_pool to complete all-user lifecycle numerator and compatible observed+sourced remaining or terminated denominator. Physical provider/underlying stage matrix prevents overlap. Calendar capacity-time attribution must retain necessary idle numerator; productive-service attribution needs full evidenced lifetime service, never target annual N."
    source_ids: []
  - rule_id: output_stage_precedence
    applies_to: "all intended products and useful transfers"
    rule: "Apply output_projection_once. First evidence real independent physical subdivision where available; genuine joint co-products require actual PCR-specific burden decision with output native quantity/quality/gate and documented precedence. Do not scale other independent physical output quantities by targetshare, create automatic co-products from all-user ledger, or allocate a target-allocated LCI again. Unallocated wholepool requires all inputs/outputs and one designated allocation step; preserve roles/stage/lineage evidence."
    source_ids: []
