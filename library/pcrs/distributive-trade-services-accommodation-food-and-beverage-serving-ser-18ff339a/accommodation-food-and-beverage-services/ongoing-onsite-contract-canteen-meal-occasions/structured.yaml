validation_rules:
  - rule_id: reference_complete
    applies_to: "final output"
    rule: "Check actual compatible service version/portion/components and complete recipient gate, reversals/recook/partials and one positive same-scope N_target. No paid/order/capacity/eaten-only substitute."
    source_ids: []
  - rule_id: route_complete
    applies_to: "onsite_meal_service"
    rule: "Check actual ingredient formulation/treatment input/output states, actual cold/hot operation, served gate and prep/held/refill/reject/rework/retained/useful/waste paths. Excluded commissary/mobile/industrial routes cannot be hidden in generic service."
    source_ids: []
  - rule_id: native_complete
    applies_to: "all exchanges"
    rule: "Check every independent native numeric operand metadata, EACH/TOTAL once, state-compatible conversion, wet/dry/water distinction, exclusive stocks/returns/fluids and full packed freight with each share inside sum."
    source_ids: []
  - rule_id: output_period_complete
    applies_to: "all resources"
    rule: "Check all intended outputs/recipient gates/native amounts, resource-specific full all-user/period drivers and necessary idle/failed/closed duties, N0 carry/finalresolution, same positive N once. Unassigned actual responsibility blocks complete use."
    source_ids: []
  - rule_id: life_provider_complete
    applies_to: "assets providers land"
    rule: "Check full manufacture-install-maintain-replace-EOL/alluser observed+sourced remaining or terminated life; native land area/time and transformation evidence; actual missing stages completed once and precise provider exclusions. Annual N or planned supplements do not pass."
    source_ids: []
  - rule_id: fate_species_complete
    applies_to: "waste elementary"
    rule: "Check actual contained wastewater/waste receiver versus real elementary species/medium, water vapour Mass, pollutant basis/size, independent release evidence, nonadditive whole/components and terminal balance gaps. Unknown residual not emission/zero."
    source_ids: []
  - rule_id: bilingual_projection_identity
    applies_to: "all methodology"
    rule: "Check same EN/ZH IDs/gates/qualifiers/nodes/cards/native units/protocols/rules and deterministic current canonical projection; concrete identity/support unresolved gaps mandatory before final exchange. Checker pass alone not scientific review/publication readiness."
    source_ids: []
  - rule_id: output_stage_check
    applies_to: "all outputs and projections"
    rule: "Check output_role/allocation_stage/lineage/source and actual subdivision or genuine joint-coproduct decision before projection. Other independent output native amounts remain physical ledger evidence, not targetshare products or target co-products after resource allocation. Reject mixed wholepool/targetallocated basis or duplicate allocation; unallocated wholepool only complete input+output closure and one designated step."
    source_ids: []
  - rule_id: validate_dedicated_classification_gate
    applies_to: "ongoing_contract_meal_service"
    rule: "This PCR applies only to ongoing onsite food preparation and serving at a customer-specified institutional, governmental, commercial or industrial location under a continuing food-service contract, including concession canteen/cafeteria operation, for customers other than transportation companies. Retain the actual client/operator division of kitchen, utilities, assets, staff and waste duties and integrate each duty once. A contract payment, guaranteed minimum or unused meal entitlement is not delivered output. Specific-event catering, transportation-company catering, offsite commissary supply and ordinary noncontract restaurant/takeaway service are outside this onsite route. Dedicated scope eligibility and the actual completed output gate must both be evidenced. Keep other classifications and incompatible configurations out of N_target, but retain all real other consumers, idle duties and full-lifecycle burdens in their appropriate resource pools. Unknown eligibility blocks use; it is not zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and completeness review"
  downstream_use: "Foreground and downstream models of one Actually completed ongoing onsite contract canteen meal occasion"
  allowed_use: "This PCR applies only to ongoing onsite food preparation and serving at a customer-specified institutional, governmental, commercial or industrial location under a continuing food-service contract, including concession canteen/cafeteria operation, for customers other than transportation companies. Retain the actual client/operator division of kitchen, utilities, assets, staff and waste duties and integrate each duty once. A contract payment, guaranteed minimum or unused meal entitlement is not delivered output. Specific-event catering, transportation-company catering, offsite commissary supply and ordinary noncontract restaurant/takeaway service are outside this onsite route."
  excluded_use: "Moving/commissary-transport-finish/independent industrial routes without review; beverage-only/lodging bundle; universal meal/nutrition/yield; incomplete gate/asset/pool/provider/identity data"
  required_metadata: "actual_site_operator_stationary_onsite_preparation; actual_menu_component_recipe_portion_version; equivalent_quality_and_service_configuration; actual_recipient_serviceoccasion_handoff_state_time; completed_all_included_food_related_beverage_service_gate; partial_declined_refill_recook_reversal_records; actual_raw_prepared_cooked_held_served_food_stocks_fates; actual_native_wet_dry_water_fat_other_component_basis; all_customer_staff_other_output_period_consumers; necessary_idle_failure_N0_source_carry_resolution; full_alluser_site_building_equipment_reusable_life; provider_direct_exclusive_completed_missing_stages; native_each_operand_unit_basis_method_state_sampletime_source; actual_receiver_species_medium_and_identity_gaps"
  required_quality_disclosure: "Actual site/date/recipe/service source applicability, measured/modelled native quantities, uncertainty, all unresolved identity/numeric/range/species/medium/lifetime/provider/pool/land/receiver gaps and restricted use"
  update_trigger: "Changed recipe/components/portion/servicegate/state/site/actual kitchen route, all-user outputs/provider/asset/land scope, replacement/termination/native conversion/fate/identity evidence"
