  calculation_rules:
    - id: food_stock
      applies_to: "food fuel materials and fluid stock"
      rule: "For one matching state/pool gross_drawn S = attributed opening + actual net receipts - attributed closing plus actually paired responsibility transfers. Net receipts remove packaging/non-cargo tare only, BEFORE outbound returns. Choose S input with matching UNUSED output OR (S-UNUSED) input and OMIT that output. USED recovery/dirty return does not reduce new supply manufacture; actual returned usable/WIP burden remains linked."
      inputs:
        - "Actual opening/inbound/closing/paired unused and used return records with native operands"
      output: "Exclusive actual stock draw and return exchanges"
      source_ids: []
    - id: food_reconcile
      applies_to: "each recipe/batch/occasion"
      rule: "Reconcile actual ingredient/water additions and returned food with prepared/retained state, actual supplied/refill, usable export/rework/unserved discard/prep/cooking/spill losses, plate returns and independently supported direct water/other releases. Retained/consumed/wholemix/component views are nonadditive. No residual assumed loss/emission or fixed yield; every unresolved fate stays gap."
      inputs:
        - "Node food and paired-transfer records"
        - "actual composition/moisture and distinct food fates"
      output: "Complete state- and owner-linked food audit"
      source_ids: []
    - id: paired_handoff
      applies_to: "each actual forward/reverse transfer"
      rule: "At chosen same receipt gate offsite output amount/state/transferID equals onsite input; onsite dirty/usable return equals actual offsite receipt gate. Dispatch and receipt are separate observations reconciled with actual transit loss/holding change. Retain native measured quantities; do not fix food or dirty returns to final Count. Both nodes use same actual final-profile normalization once."
      inputs:
        - "Paired source/receiver/handoff/state/time/native measurement and loss records"
      output: "One actual linked internal quantity and responsibility"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "First retain actual exclusive direct target quantity OR calculate actual same-pool quantity*target_driver/positive complete all_consumer_driver. Sum unique compatible attributed records then divide positive same-profile N_target ONCE; already per-reference unchanged. N_target=0 carries real owner/source/receiver/final resolution without division; no fictional output."
      inputs:
        - "Each native quantity/driver with own metadata"
        - "actual all consumers/periods and N_target"
      output: "per reference flow"
      source_ids: []
    - id: freight_sum
      applies_to: "offsite_freight; site_freight"
      rule: "freight_per_reference = sum_unique_load_leg(actual_packed_wet_payload_t * actual_distance_km * actual_EACH_repeat_or_TOTAL_once * THAT_record_actual_share) / positive_same_profile_N_target; use measured packed wet payload directly, or derive it from loaded vehicle gross mass minus matched non-cargo vehicle tare once. Food/ice/pack/container/support/equipment carried mass retained. Complete provider OR actual exclusive own-fleet energy/assets/species/receiver/empty duty; already per-reference unchanged."
      inputs:
        - "Native gross/tare/payload/distance/repeat/share with own metadata and unique load-leg IDs"
      output: "Actual t*km and exclusive complete transport responsibility per reference flow"
      source_ids: []
    - id: exclusive_coverage
      applies_to: "all provider/direct/asset/receiver duties"
      rule: "Crosswalk physical stage/component/site/time/owner/native amount to complete matching provider dataset OR direct duties. Actually missing stages must be completed integrated once with source/native quantity/state/time/owner and explicit coverage/exclusions before complete-chain use. Overlap, unknown owner or merely planned supplement blocks completeness."
      inputs:
        - "Completed provider and direct stage matrix plus datasets/native quantities/exclusions"
      output: "Complete exclusive physical responsibility"
      source_ids: []
    - id: asset_life
      applies_to: "all actual shared assets and land"
      rule: "Attribute complete manufacture/install/maintain/replace/EOL quantity by actual target_life_driver/positive complete all_life_driver across every user/node/period. Full driver=actual observed plus sourced compatible remaining service OR actual terminated total; no double use of both. Native land area*time and evidenced transformation from/to event are separate compatible interfaces. Annual targetN/nominal capacity/default years are not complete life."
      inputs:
        - "Actual asset stages/alluser history/sourced remaining or termination and land records"
      output: "Actual full-life target responsibility once then per reference flow"
      source_ids: []
    - id: fluid_exclusivity
      applies_to: "each material/species stock and equipment"
      rule: "Keep standalone opening/new supply, stored/installed/recovered closing, matched UNUSED return, useful recovered old-state export, contained waste and independently supported direct release mutually exclusive. Each other receipt/paired inflow/paired outflow and whole-equipment retained-content exit has its own actual native quantity/metadata. Factory-new retained content absent standalone opening stays equipment responsibility. Actual whole asset content/component audit is nonadditive; unknown difference is not emission. USED export gives no virgin manufacture subtraction or automatic credit."
      inputs:
        - "Equipment service/material stock/wholecontent/receiver/environment records with native operands"
      output: "Exclusive species/stock/content/fate audit"
      source_ids: []
    - id: terminal_reconcile
      applies_to: "water mixtures pollutants and receivers"
      rule: "Reconcile independent measured input/stock/retained/terminal outputs by matching material/species/state/owner/time. Exclude internal enduse/transfer and duplicate receiver views from terminal sum. Whole genuine mixture is one stream with nonadditive components; separate unrelated streams/species/receiving media expand independently. Water vapour to air is Elementary Mass; contained wastewater is Waste; unresolved residual stays explicit unknown."
      inputs:
        - "Native independently measured water/mixture/content/species/stock/fate records and actual receiver links"
      output: "Nonduplicated actual terminal responsibility and explicit gaps"
      source_ids: []
  data_quality_requirements:
    - id: reference_complete
      applies_to: "site_fulfilled_meal"
      requirement: "Actual complete compatible menu/portion/recipient/occasion supply, all components/declines/partials/reversals reconciled; Count not food equivalence."
      evidence: "Service ledger, physical gate and actual acceptance rule"
    - id: native_complete
      applies_to: "every numeric operand"
      requirement: "Own value/unit/basis/method/state/sample_time/source and actual each-total/conversion evidence; collection raw keys are individual operands, not one general provenance flag."
      evidence: "Original native instruments/records/conversion sources"
    - id: outputs_complete
      applies_to: "both actual nodes"
      requirement: "Every independently intended output and recipient/gate/state/handoff/time/source/native quantity and complete all-user driver retained; staff support not automatic excluded sales."
      evidence: "Output/consumer and allocation ledger"
    - id: physical_complete
      applies_to: "all actual lifecycle duties"
      requirement: "Complete provider OR completed exclusive missing stages for food/transport/wash/receiver/assets/land; no unsupported omission/overlap."
      evidence: "Actual stage-coverage matrix and completed integrated data links"
    - id: state_and_fate
      applies_to: "food water material fluids"
      requirement: "Actual supplied/prepared/served/stock/wetdry/retained content/waste/usable product/species/medium resolved separately; genuine whole/component audits nonadditive."
      evidence: "Paired batch/stock/sampling/receiver/environment records"
    - id: period_and_life
      applies_to: "full alluser life and N0"
      requirement: "Observed plus sourced compatible remaining or termination across all users/periods, actual idle/failure/source/carry/receiver/final resolution. Unassigned duty blocks completeness."
      evidence: "Full asset history/lifetime source and final resolved pool ledger"
    - id: identity_restriction
      applies_to: "all exchanges"
      requirement: "Each actual concrete exchange needs verified UUID/support/property/unit and gate-compatible evidence before final data use. Semantic candidate umbrellas require actual typed expansion. A verified electricity or heat flow using the ILCD energy-property label Net calorific value is allowed on its evidenced energy basis; do not substitute a fuel-specific calorific factor or an unmatched state."
      evidence: "Actual identity/detail/support verification; explicit unresolved metadata"
validation_rules:
  - rule_id: validate_category_eligibility
    applies_to: "target reference product"
    rule: "Official CPC 63391 covers contracted food preparation and supply for a specific event at customer-specified premises or locations. It excludes ongoing food-service arrangements; it does not prescribe a single preparation and delivery route. Selected PCR scope: Only contractual food preparation and supply for a specific event at a location specified by the customer, through the declared offsite-preparation/transport/onsite-finish plated complete-meal route. Exclude ongoing food-service contracts, transportation-operator contract supply and pure onsite or dropoff-only routes. Offsite preparation followed by transport, onsite finishing and plated recipient service is this PCR's selected route. Pure onsite preparation and dropoff-only routes are excluded from this method, not categorically from CPC 63391. Verify official classification eligibility and the separate selected-method conditions before counting target output; unknown eligibility or method applicability blocks application. Other actual users remain in complete shared-resource denominators and their burdens must not disappear."
    source_ids:
      - unsd-cpc3-2025
  - rule_id: validate_gate
    applies_to: "actual reference/output"
    rule: "Require actual complete meal-version/recipient/occasion/portion/gate and offered/supplied/declined/partial/reversal evidence. Unique physical fulfilled same-profile N_target, not contractcovers/booking/capacity/eaten mass. No unsupported equivalence across menus/service durations/food quantities."
    source_ids: []
  - rule_id: validate_route_steps
    applies_to: "both real kitchens"
    rule: "Require actual composition input roles, before/after treatment and packing/presentation states, material/service roles, protected receipt-gate handoff and final plated gate. Batch/continuous operation, run/changeover/cleaning/holding linkage and reject/rework/return path complete. No extra fictitious independent nodes or new production swallowed by generic service."
    source_ids:
      - krisp-current-commissary-event-service
      - box-current-private-dining
      - silverfeast-current-event-route
  - rule_id: validate_pairs
    applies_to: "each internal transfer"
    rule: "Same selected receipt-gate ID/quantity/state/time/owner/receiver both sides; dispatch difference actual losses separately; no fixed internal ratio to finalN. Dirty food/water/pack cargo audits nonadditive and oldstate return not virgin credit."
    source_ids: []
  - rule_id: validate_outputs_allusers
    applies_to: "all intended output/resource pools"
    rule: "Every actual intended output and handoff/native quantity, all consumers/nodes/periods and actual attribution decision; positive complete compatible driver and same positive finalN once. Necessary idle/failure/closed/cancel/N0 duty with resolved source/carry/receiver, not erased or fake output."
    source_ids: []
  - rule_id: validate_native_stocks
    applies_to: "food supplies fluids assets"
    rule: "All independent numeric operands have own unit/basis/method/state/sampletime/source. Gross draw and UNUSED output versus net draw/omitted return exclusive; used recovery/installed/stored/factory content separate; native wet/dry/percent/density/temperature/each-total and full-life fields compatible."
    source_ids: []
  - rule_id: validate_transport
    applies_to: "freight and ownfleet/provider"
    rule: "Unique actual load+leg packed wet food/ice/pack/support/equipment; use measured packed wet payload directly, or derive it from loaded vehicle gross mass minus matched noncargo vehicle tare once, repeats once, THAT-record share inside sum and finalN once. Complete carrier OR actual own-fleet energy/vehicle/maintenance/species/receiver/empty-duty coverage once."
    source_ids: []
  - rule_id: validate_life_coverage
    applies_to: "full physical boundary"
    rule: "Actual alluser observed+sourced compatible remaining full-life OR termination, full asset/land/stage matrix and completed missing-stage integration; pending supplements and annual target count do not close boundary. Full kitchen/venue/equipment/reusables/wash/receivers cannot be omitted under contract labels."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "food water direct species"
    rule: "Actual ingredient/prepared/served/unserved/plate/prep/return/rework fate reconciliation; terminal water balance excludes internal/duplicate receiver views; whole/component audit nonadditive. Water vapour Elementary Mass to air; contained wastewater Waste. Exact pollutants/medium, no unknown residual as release or zero."
    source_ids: []
  - rule_id: validate_identity_and_readiness
    applies_to: "final data production"
    rule: "Verify actual concrete flow/support identity/property/unit and matching state/gate/direction before final exchanges; explicit gaps restrict use. Candidate methodology and checker pass are not external UUID verification or publication readiness; quantitative source examples never default factors."
    source_ids: []
  - rule_id: validate_projection_stage
    applies_to: "all input/output variants"
    rule: "Require declared projection_variant/allocation_stage, full pre-attribution output ledger and actual independent-versus-joint-output decision. Full native output amounts/lineage/gates remain unscaled by targetshare. Target-attributed LCI excludes independent other-output evidence as exchanges/co-products; wholepool variant contains full inputs/alloutputs and one designated allocation only. Internal receipts/returns are not co-products."
    source_ids: []
  - rule_id: validate_input_role_exclusivity
    applies_to: "ingredient/internal/returned input cards"
    rule: "Check every source_input_role/internal_external/linked_input_coverage/native quantity pair. Generic site_ingredients excludes identical physical prepared-receipt quantity/stage. Internal receipt and returned old-state food/reusables do not create second external manufacturing inputs; only actual new rework/wash/storage duty added once."
    source_ids: []
  - rule_id: validate_product_quantity_precedence
    applies_to: "output ledger and real joint exchanges"
    rule: "The raw ALL-OUTPUT ledger keeps UNNORMALIZED actual full native quantities, not targetshare-scaled or per-reference. In target-attributed LCI independent other meals/products are audit-only, not co-product exchanges. If a documented actual PCR-specific decision retains a genuine joint product as final exchange, use its SELECTED ACTUAL PHYSICAL output quantity / same positive profile N_target ONCE (already-per-reference unchanged); never apply generic resource target-driver share to that physical output. This output rule has precedence over generic resource assignment. Separate unallocated wholepool variant keeps full inputs/alloutputs and exactly one designated attribution step."
    source_ids: []
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
