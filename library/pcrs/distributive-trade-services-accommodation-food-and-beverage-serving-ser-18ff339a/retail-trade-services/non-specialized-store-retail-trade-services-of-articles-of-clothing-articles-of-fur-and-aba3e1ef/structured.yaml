system_boundary:
  rules:
    - rule_id: scope
      applies_to: "all"
      rule: "This candidate module covers one actual homogeneous new white crew-neck cotton fine-knit T-shirt SKU, size and unaltered receiving BOM in a walk-in non-specialized store; a feasible specimen is manufacturer Original T0610820 white. Its fabric label is not a complete garment/packaging BOM: record sewing thread, neck/brand/care labels, print/finishes, tags and actual receiving packaging. The manufacturer fabric areal weight is not garment net mass. Fur, artificial fur, other apparel/accessories, used garments, online delivery, cutting, alterations, printing, washing, steaming and ironing are outside this fixed route. cp_completion requires positive occurrence/absence evidence; if any excluded processing occurs or is unknown, this route cannot support a complete dataset without explicit bilingual atomic-card/protocol/background extension."
      source_ids:
        - un-cpc-62133
        - fotl-original-t
    - rule_id: gate
      applies_to: "garment"
      rule: "Start at the recorded store receiving gate, then inspect/count/weigh, manually move/restock, hang/display, fit/re-hang, checkout and customer carry-out. Acceptance requires correct recorded SKU/size, complete new saleable garment without unacceptable defect/soiling, intact required original labels and completed handover for the buyer own use, with all subsequent acceptance revocations adjudicated by the declared cutoff. Rejection, repeated fitting and restoration to the same saleable state consume resources but create no extra service. Personal customer travel and post-final-acceptance garment use/disposal remain outside."
      source_ids:
        - ghg-product-2011
    - rule_id: goods_responsibility
      applies_to: "garment"
      rule: "Retail service excludes successful garment production/receiving packaging/inbound carriage B_s but includes final retailer-responsible failed-goods background B_f at the identical gate. calc_goods assigns each original garment background once among successful S, retailer failure F, continuing supplier/internal transfer T, and open unresolved O, regardless of physical carrier fate. Returned stock retains its source ID; resale does not create new production. A failed garment retained outside has recipient/state and continuing responsibility, not automatically a retailer waste exchange. Supplier return does not erase background or grant credit."
      source_ids:
        - ghg-product-2011
    - rule_id: partial_completion
      applies_to: "all"
      rule: "This is an incremental department module, not a complete store LCA. Known excluded common modules are building shell/site works/fixed wiring, common HVAC and general/security lighting, shared IT/payment networks/security, common toilet/cleaning, staff travel and common handling/transport assets. cp_completion and calc_completion prescribe exact raw collection, ownership, drivers, lifetime and aggregation for each. Each actual common utility/material/asset/waste/emission needs a named atomic extension with its own property/unit and protocol, or specific evidenced absence; unknown is not zero. Common-module burden and successful-goods bridge B_s/N must be supplied before any completed retail-plus-merchandise result."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - rule_id: carriers
      applies_to: "all"
      rule: "Complete garments/devices and a real mixed sweepings/effluent carrier remain whole measurable exchanges; never mechanically duplicate their contained materials. Original packaging in the garment supply background, retailer-added bags/receipt/tags, retained original labels, removed tags and actual terminal wastes use unique source-component IDs and disjoint scopes. Hangers remain reusable assets when retained; a hanger transferred with a sale is a separately measured actual transfer with its residual lifetime responsibility, not both an asset fraction and new whole item for the same exposure."
      source_ids:
        - ghg-product-2011
    - rule_id: air
      applies_to: "clean"
      rule: "Screen actual lint/cleaner releases, spills and refrigeration in cp_completion. Captured lint in sweepings or wastewater is not another elementary air output; room sources are not exterior environmental transfers. Actual species emissions require named substance/receiving-medium cards and measured final exterior balance, storage change, capture and carrier export; no automatic zero, generic dust factor or unexplained negative output."
      source_ids:
        - jrc-retail-2013
