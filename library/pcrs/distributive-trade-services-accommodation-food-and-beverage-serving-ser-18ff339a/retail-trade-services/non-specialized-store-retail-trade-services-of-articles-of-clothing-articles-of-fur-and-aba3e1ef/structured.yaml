    - id: calc_common_refrigerant
      applies_to: "all"
      rule: "Define one complete species control volume over actual circuits, bottles, indoor air and capture stores: S_open = circuit_open+bottle_open+air_open+capture_open and S_close likewise. External imports are disjoint I_factory_newdevice, I_other_contained_device (excluding the same new-device factory charge), I_external_cylinder and I_external_recovered; each source ID appears once. Existing factory charge already in S_open is not a period import. Internal makeup/recovery/reuse between circuit, bottle and capture is an internal transfer, never another external input or export. Recovered gas export, retained gas in exported equipment, capture-carrier export and transformed species are disjoint; a recovered export is not also subtracted as contained-equipment gas. Choose one exclusive exterior-release mode: A direct calibrated actual exterior species flux, with full species stock balance as independent check; B verified closed balance release = S_open+sum(disjoint imports)-S_close-contained_device_export-recovered_export-captured_export-other_disjoint_species_export-transformed_species, requiring actual exterior path and resolved uncertainty/residuals before any air-emission row. Capture is an internal transfer to capture stock, not a second subtraction; air/capture opening and closing must be measured, not presumed0. Negative/unresolved balance is investigated and blocks completion. The purchased makeup product numerator is actual externally sourced refrigerant consumed/lost for the pool from its original-source inventory: opening_external_source_stock+external_purchases-closing_external_source_stock-unused_external_returns-transfers_to_other_beneficiaries, with source IDs/stock history and all-beneficiary attribution once; do not use all purchases or add initial-charge manufacture/internal reuse again. Externally recovered/reclaimed supply remains a distinct actual product identity. Factory-charge production already included in the complete equipment background is not another refrigerant-production input; its terminal species responsibility follows the asset lifetime, while actual operating replenishment/release uses measured HVAC load/standby across all beneficiaries."
      inputs:
        - species
        - circuit_id
        - exclusive_mode_A_or_B
        - circuit_open
        - circuit_close
        - bottle_open
        - bottle_close
        - air_open
        - air_close
        - capture_open
        - capture_close
        - I_factory_newdevice
        - I_other_contained_device
        - I_external_cylinder
        - I_external_recovered
        - original_source_ID
        - internal_makeup_recovery_reuse
        - contained_device_export
        - recovered_export
        - captured_export
        - other_disjoint_species_export
        - transformed_species
        - direct_exterior_flux
        - actual_exterior_path
        - uncertainty
        - residual
        - opening_external_source_stock
        - external_purchases
        - closing_external_source_stock
        - unused_external_returns
        - transfers_to_other_beneficiaries
        - all_beneficiary_HVAC_load_standby
        - asset_lifetime
        - N
      output: "Species-specific makeup product input/air release/contained transfer raw kg with disjoint lifetime or operating attribution"
      source_ids:
        - ghg-product-2011
    - id: calc_exterior_flux
      applies_to: "all"
      rule: "For each actual lint fraction/volatile cleaner species fix substance/state, indoor air A plus captured-material species stock K as one combined control volume, and actual exterior receiving medium. Exclusive measured sublot modes are absolute matched inlet/outlet species kg/h (net=out-in), already differential species kg/h, or already blank-corrected species kg/h. Use differential/blank-corrected values directly without subtracting their already removed inlet/background again. Integrate actual rate*duration; concentration/airflow conversion must match actual wet/dry, T and P and laboratory species conversion. An additional independent contemporaneous control is removed only when not already corrected in that mode, once. Complete species reconciliation: internal_source_generation + inlet + contained_species_import = outlet + captured_export + other_disjoint_contained_export + transformed_species + (A_close-A_open) + (K_close-K_open). Capture from indoor air into K is an internal transfer, not an additional right-side subtraction; captured material exported later is captured_export once, not also another capture deduction. Record each exported effluent/sweepings/filter carrier source portion without another elementary species output. Foreign dirt/water is not garment-source kg. Determine true garment/cleaning attribution from source-specific matched observations, not a ventilation emission factor. A room source is not automatically environmental release. Investigate signed negative or unclosed results with their uncertainty and block completion; never zero-clamp/credit. Real uptake needs separately reviewed matching input identity."
      inputs:
        - species
        - particle_fraction
        - state
        - indoor_air_control_volume
        - exterior_medium
        - exclusive_sublot_mode
        - absolute_inlet_kg_h
        - absolute_outlet_kg_h
        - differential_kg_h
        - blank_corrected_kg_h
        - already_removed_inlet_background
        - duration_h
        - concentration
        - actual_airflow
        - wet_dry_basis
        - temperature
        - pressure
        - laboratory_conversion
        - independent_control
        - source_attribution
        - internal_source_generation
        - contained_species_import
        - captured_export
        - other_disjoint_contained_export
        - transformed_species
        - A_open
        - A_close
        - K_open
        - K_close
        - source_carrier_portions
        - uncertainty
        - N
      output: "Reviewed species-specific exterior raw kg and separate source-garment mass reconciliation, /N once"
      source_ids:
        - ghg-product-2011
    - id: calc_clean_container
      applies_to: "cleaner; cleaner_container; cleaner_container_waste; effluent"
      rule: "Fix the actual formulation supplier/batch and one exact original single-use container model/BOM; verify actual single-use status, closure/label/dispensing components, material and net mass with supplier receipts and physical inspection. Unknown packaging is not absent; an actual returnable/reusable route needs the existing whole-life asset method and concrete bilingual container/transfer cards, not this single-use assumption. For each original container j record net formulation supplied, unused stock/returns, formulation actually dispensed, spilled, rinsed and retained in its terminal container. Reconcile formulation_source_kg = used_kg + spill_kg + rinsate_kg + terminal_retained_kg + unused_closing_or_returned_kg, with measured uncertainty and disjoint source IDs. Attribute each j manufacturing responsibility once across all actual formulation beneficiaries and remaining unused stock by source-formulation kg; failure/spill/residue remains with the responsible same configuration pool, not erased. Y_container_att sums the attributable complete-container manufacturing equivalents only for provider-excluded scope; a documented supplier background already including that manufacture contributes no additional manufacture via this card, without deleting its actual end-of-life. If provider inclusion is unknown, quantity/background completion is blocked. D_cleaner_container_att is actual whole net dispatched carrier kg under calc_dispatch and once-only source-beneficiary attribution; generation and awaiting-dispatch stock reconcile independently. Terminal retained formulation is not also included in effluent. Only actual rinsate discharged separately enters directly measured effluent, with its source portion no longer retained in terminal carrier. Never subtract residual again from directly weighed complete container or effluent; do not mechanically output cap/label contents as duplicate wastes. In the formulation_source_kg balance, every used_kg, spill_kg, rinsate_kg, terminal_retained_kg and unused_closing_or_returned_kg term is exclusively kg originating from that same original supplied formulation, not whole diluted rinsate or newly added water/foreign dirt. Determine original-formulation kg in rinsate by actual paired weighing/composition measurements or verifiable original-source component ledger, retaining uncertainty and source IDs. These source portions are mutually exclusive final responsibility destinations: an original portion already assigned to used_kg is not added again as rinsate_kg when later washed out; reclassify its original source ledger destination if required, without increasing the source total. The actual whole rinsate carrier, including newly added water and actual dirt, enters directly measured effluent once; its measured whole kg is not multiplied by the source-composition fraction again."
      inputs:
        - container_id
        - supplier
        - batch
        - exact_model
        - actual_BOM
        - single_use_evidence
        - net_container_mass
        - closure_label_dispensing_state
        - formulation_source_kg
