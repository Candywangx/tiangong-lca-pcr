  data_quality_requirements:
    - id: identity
      applies_to: "all"
      requirement: "Each unresolved card is a specific candidate, not adopted Tiangong identity. Bind its exact bilingual name, type/direction, state/medium, qualifiers, reference property/unit and one compatible background from an official original response plus matching integrity receipt; quantities alone do not resolve identity. Reference-service output must be independently bound before final release."
      evidence: "Original response hashes and direct dataset/property/unit readback, plus provider scope and foreground protocol records"
    - id: bilingual
      applies_to: "all"
      requirement: "English and Chinese must agree on each object, direction, type, unit, formula, denominator, conditional absence, ownership and mandatory duty; stable IDs and array fields remain aligned. New repair/process/common-module rows need both languages and regenerated structured output before completion."
      evidence: "Bilingual row/rule/protocol/calculation field audit and parser output arrays"
    - id: balance
      applies_to: "garment"
      requirement: "Resolve physical count/kg and original-background S/F/T/O independently. Investigate shrinkage, label removal, damaged external retention and discrepancies with evidence; do not force them to zero or classify every non-sale as waste. Fix sampling/census coverage and measurement uncertainty prospectively; report actual limits and calibration without unsupported tolerance defaults."
      evidence: "Calibrated stock/mass ledger and recipient/ownership audit with discrepancy resolution"
    - id: coverage
      applies_to: "all"
      requirement: "Every actual conditional card has occurrence evidence and a quantity, or documented site-specific absence. A missing meter, unknown composition/provider boundary, unobserved repair/steam/alteration or missing common module is unresolved and blocks completeness. Preserve partial scope and raw burdens until resolved; no numerical default is specified by this PCR."
      evidence: "Signed occurrence/completion matrix, quantity and binding gaps, correction version"
    - id: source_limits
      applies_to: "all"
      requirement: "The manufacturer sheet demonstrates a plausible white fine-knit cotton T-shirt and distinguishes fabric label from garment mass. Its plastic-free, certification, zero-landfill and pack-count claims are not verified lot data, current certifications, LCA factors or measured weights. JRC identifies retail energy/water/chemical/transport/waste aspects; GHG guidance supports explicit units/allocation, not approval of these design choices or whole-standard conformity."
      evidence: "Actual supplier lot/BOM and foreground records; scoped external source statements"
validation_rules:
  - rule_id: reference
    applies_to: "retail_service"
    rule: "Require final N>0 for normalization and exactly1 Item(s) service output per reference flow. Verify same configuration, declared pool and final acceptance/revocation linkage. Entirely N=0 remains raw and unnormalizable."
    source_ids:
      - ghg-product-2011
  - rule_id: raw_once
    applies_to: "all"
    rule: "Every inventory numerator must have an original raw quantity, state/unit, attribution driver and exactly one /N; externally normalized values must be restored using evidenced D_old first. Check all card IDs, real single-process protocols and calculation Applies-to IDs exist; no orphan normalized IDs or duplicated source IDs."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_check
    applies_to: "assets"
    rule: "For every actual asset sum historical/current/residual fractions<=1 and reconcile the whole manufacture/installation burden and corrected terminal carrier. Signed historical life corrections replace prior allocations; terminal mass times lifetime responsibility once. Missing asset history or provider scope blocks full completion."
    source_ids:
      - ghg-product-2011
  - rule_id: fates
    applies_to: "garment"
    rule: "Keep physical transfer and ownership quantities separate; supplier returns/internal transfers/failed external retention create no service or negative production credit. Reject double background for resale or multiple waste descendants. Reconcile received count and actual mass independently; an assumed fabric fraction cannot close missing garment mass."
    source_ids:
      - ghg-product-2011
  - rule_id: completeness
    applies_to: "all"
    rule: "Report identity, activity, provider and partial-common-module coverage separately. Candidate unbound identities or unknown conditional occurrence/quantities are not zero or complete. A finished dataset requires all actual named atomic cards and documented absences, compatible backgrounds, source-ID deduplication and bilingual structured verification; the module retains its partial label until common completion is attached."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "partial_incremental_retail_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same specified garment department incremental attributional inventory with explicit partial scope and documented completion bridge"
  excluded_use: "Full garment life cycle, all apparel/fur, altered/online route, current certification/compliance, substitution credits, complete store claim without common modules"
  required_metadata: "Site/route/SKU/size/full BOM/lot; actual mass states; gates/N/pool/cutoff; raw ledgers and source IDs; provider/identity bindings; partial completion matrix and corrections"
  required_quality_disclosure: "Sampling/calibration/uncertainty; unresolved UUID/activity/provider/common modules; all-beneficiary life/idle and source limits; no unknown zero"
  update_trigger: "Changed SKU/BOM/route/formulation/asset/provider/life estimate, return adjudication, measured state or new source evidence"
