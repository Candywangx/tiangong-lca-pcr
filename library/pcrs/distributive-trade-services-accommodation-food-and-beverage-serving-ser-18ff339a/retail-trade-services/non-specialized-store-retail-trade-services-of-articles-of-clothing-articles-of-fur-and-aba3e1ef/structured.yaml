 actual_building_BOM; historical_area_h; remaining_area_h; complete_device_ID; capacity_h; carrier_meter; equipment_load; standby; actual_fuel_kg; composition; NCV; heat_MJ; treated_area; cleaning_frequency; employee_journey_id; travel_mode; vehicle_occupancy; passenger_km; idle_hours; employee_working_reserved_hours; all_beneficiaries; provider_scope; N; species; circuit_id; exclusive_mode_A_or_B; circuit_open; circuit_close; bottle_open; bottle_close; air_open; air_close; capture_open; capture_close; I_factory_newdevice; I_other_contained_device; I_external_cylinder; I_external_recovered; original_source_ID; internal_makeup_recovery_reuse; contained_device_export; recovered_export; captured_export; other_disjoint_species_export; transformed_species; direct_exterior_flux; actual_exterior_path; uncertainty; residual; opening_external_source_stock; external_purchases; closing_external_source_stock; unused_external_returns; transfers_to_other_beneficiaries; all_beneficiary_HVAC_load_standby; asset_lifetime; N; species; particle_fraction; state; indoor_air_control_volume; exterior_medium; exclusive_sublot_mode; absolute_inlet_kg_h; absolute_outlet_kg_h; differential_kg_h; blank_corrected_kg_h; already_removed_inlet_background; duration_h; concentration; actual_airflow; wet_dry_basis; temperature; pressure; laboratory_conversion; independent_control; source_attribution; internal_source_generation; contained_species_import; captured_export; other_disjoint_contained_export; transformed_species; A_open; A_close; K_open; K_close; source_carrier_portions; uncertainty; N"
      collection_method: "Walk through receiving/display/fitting/POS/cleaning and inspect equipment, meters, maintenance and supplier contracts; retain timestamped occurrence/absence evidence for each route/process. For each common module collect original raw records and all beneficiary drivers by the fixed methods in calc_completion; verify full boundary and shared asset history. Independently sample/audit actual external species pathway when relevant; record unknowns instead of absent claims. Mandatory raw-field expansions are exactly the Inputs listed in calc_common_services, calc_common_refrigerant and calc_exterior_flux. Collect each actual circuit/species at import/export and pool boundaries from calibrated weighing/service recovery logs, factory charge documentation and physical stock census; direct release/flux uses calibrated instruments, matched inlet/outlet/control sample times, lab species/state conversions and actual duration. Preserve all mutually exclusive mode flags and already-corrected status. Measure staff-mode/occupancy/GPS and employee-hour beneficiary logs per journey. These records and all common-module events cover every interval and all lifetime beneficiaries; quantities/provider coverage missing remain incomplete. Use paired boundary indoor-air species sampling and calibrated capture-store/net-carrier weighing for A/K opening/closing, circuit/bottle scale stock censuses and source-ID import/export logs. Capture internal transfers and later carrier exports retain the same species/source IDs and cannot both be external deductions. Direct/differential/blank-corrected instrument certificates state which corrections are already applied. External refrigerant source inventory includes unused returns and beneficiary transfers; verify no new-device factory/import duplication. Aggregation duty: calc_completion restores raw denominators and sums compatible disjoint numerators by exact source IDs before one /N"
      unit: "original row-specific units; Item(s); kg; MJ; h"
      frequency: "Initial site route audit, all pool intervals/events and every change"
      temporal_coverage: "Complete pool and all raw-source/asset histories required for N"
      site_scope: "All known common store modules and actual uncovered route additions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed completion matrix; original meters/BOM/contracts/versions; sample/calibration logs; quantified uncertainty; named bilingual cards/protocols and actual matching UUID evidence before complete claims"
  calculation_rules:
    - id: calc_goods
      applies_to: "garment"
      rule: "N = count_distinct(original_id with one valid final qualified customer acceptance at cutoff). Resolve the complete ordered acceptance/revocation/physical-return/resale history first; a revoked then resold garment with valid final acceptance contributes1, never2, and one already-final N is not reduced by revocations again. Physical goods count: opening_goods + receipts + customer_physical_returns + internal_in = gross_customer_handoffs + supplier_physical_handoffs + internal_out + goods_to_residue_parent_count + closing_goods + investigated_count_difference. closing_goods includes all saleable, refused/damaged and quarantined goods still in goods custody, but excludes goods already transferred at a recorded goods_to_residue event. Separate source-garment kg balance adds measured signed environmental/moisture uptake or loss and subtracts source-garment portions transferred to residues, removed components and captured lint; whole outside dirt/cleaner/containers are not garment kg. Residue stock separately: opening_residue + generated_source_portions + measured_external_added_material = actual_dispatch + closing_residue + investigated_difference. Generation removes goods and enters residue stock at the same timestamp; dispatch does not remove goods a second time. B_total=B_s+B_f+B_t+B_open assigns each original receiving-gate background once, independent of these physical fates; failed_background=B_f/N and successful downstream background=B_s/N. Explicit source-garment mass equation: opening_goods_kg + receipts_kg + physical_returns_kg + internal_in_kg + signed_environmental_moisture_kg = gross_handoffs_kg + supplier_handoffs_kg + internal_out_kg + goods_to_residue_source_kg + removed_source_component_kg + captured_source_lint_kg + closing_goods_kg + investigated_mass_difference. Every source-origin portion enters only one right-side term; a removed component still in a transferred whole carrier is not added again."
      inputs:
        - original_id
        - event_id
        - SKU
        - size
        - BOM
        - event_time
        - opening
        - received
        - returns
        - transfers_in
        - gross_handovers
        - supplier_handoffs
        - transfers_out
        - waste_dispatch
        - closing
        - discrepancy
        - acceptance_status
        - revocations
        - recipient
        - responsibility
        - B_total
        - B_s
        - B_f
        - B_t
        - B_open
        - N
        - final_valid_acceptance
        - ordered_event_history
        - goods_to_residue_event
        - goods_to_residue_parent_count
        - closing_goods
        - source_garment_kg
        - signed_environmental_moisture_kg
        - removed_source_component_kg
        - captured_source_lint_kg
        - opening_residue
        - generated_source_portions
        - measured_external_added_material
        - actual_dispatch
        - closing_residue
        - opening_goods_kg
        - receipts_kg
        - physical_returns_kg
        - internal_in_kg
        - signed_environmental_moisture_kg
        - gross_handoffs_kg
        - supplier_handoffs_kg
        - internal_out_kg
        - goods_to_residue_source_kg
        - removed_source_component_kg
        - captured_source_lint_kg
        - closing_goods_kg
        - investigated_mass_difference
      output: "N and raw responsibility ledger; one service per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_energy
      applies_to: "electricity"
      rule: "E_att = sum(E_dedicated + E_shared*d_target/sum(d_all)); E values are raw kWh, drivers cover all actual beneficiaries and standby/idle reserved capacity; sum target shares equals each raw shared meter total. Electricity=3.6*E_att/N MJ. Do not subtract a disjoint department circuit from a separate meter."
      inputs:
        - E_dedicated
        - E_shared
        - meter_boundary
        - d_target
        - d_all
        - kW
        - operating_hours
        - standby_hours
        - calibration
        - N
      output: "electricity MJ per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_material
      applies_to: "paper_bag; receipt; hangtag"
      rule: "For paper_bag and hangtag only, X_r = opening_r + purchases_r + recovered_returns_r - closing_r - unused_supplier_returns_r - transfers_out_r, using net component kg; verify against issued/damaged/retained records. Purchase counts convert using measured same-batch unit net mass, not nominal fabric areal weight. Track printed intermediates in the separate receipt WIP ledger below. Once attributed to all beneficiaries, row quantity=X_r_att/N. For receipt specifically, input is net unprinted thermal paper, excluding actual core/tube/outer packaging. Unused-roll balance: R_new = opening_unprinted_net_paper + new_net_paper + returned_unused_net_paper - closing_unprinted_net_paper - unused_returns_out - unused_transfers_out. Already printed receipt/intermediate stock is not an unused roll and is never subtracted in that balance. Keep a separate printed-WIP count/net-paper/source-ID and embodied printing-electricity ledger. Assign source paper and printing energy once to their final beneficiary pool; newly printed WIP carries unassigned original responsibility forward, prior WIP released carries its same original paper/energy responsibility in, without new paper consumption or new printing energy. Printing scrap/rejects remain attributed to the same configuration pool. Current pool shares are drawn from these original batch histories with signed revisions; raw roll consumption is not normalized then added again."
      inputs:
        - component_id
        - batch
        - opening_r
        - purchases_r
        - recovered_returns_r
        - closing_r
        - unused_supplier_returns_r
        - transfers_out_r
        - unit_mass
        - attribution_driver
        - N
        - opening_unprinted_net_paper
        - new_net_paper
        - returned_unused_net_paper
        - closing_unprinted_net_paper
        - unused_returns_out
        - unused_transfers_out
        - R_new
        - printed_WIP_source_ID
        - printed_WIP_net_paper
        - original_printing_energy
        - final_beneficiary_pool
        - signed_revision
        - core_BOM
        - core_net_mass
        - core_provider_inclusion
      output: "X_r_att/N kg per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_clean
      applies_to: "water; cleaner; effluent; sweepings"
      rule: "W_att = sum(actual imported water kg * cleaning attribution once), measured kg or imported m3*rho_water(T); C_att = actual formulation consumption kg attributed once. For L_att use either direct net discharge weighing or actual discharge m3*rho_effluent(T,composition), never both; no evaporation/storage/cleaner subtraction from directly measured liquid. Imported water, formulation-contained water, evaporation, captured cloth liquid, external solids and storage are separate supply-balance checks, not a second correction to discharge. Metered reuse is not subtracted from import again. Use calc_dispatch for sweepings."
      inputs:
        - water_mode
        - imported_kg
        - imported_m3
        - rho_water
        - water_temperature
        - formulation_consumption
        - composition
        - concentration
        - cleaning_area
        - cleaning_frequency
        - all_beneficiaries
        - discharge_mode
        - discharge_kg
        - discharge_m3
        - rho_effluent
        - effluent_temperature
        - storage_change
        - evaporation
        - captured_liquid
        - foreign_solids
        - N
      output: "W_att/N; C_att/N; L_att/N kg per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_dispatch
      applies_to: "failed_garment; corrugated_waste; paper_waste; sweepings; receipt_waste; bag_waste"
      rule: "D_r = sum(actual dispatched gross mass - actual consignment container tare) attributed once to its original source IDs and beneficiaries; row=D_r_att/N. Generation + opening waste stock - closing waste stock is an independent dispatch reconciliation, not an additional subtraction from measured dispatch. Document moisture and contamination at actual handoff and recipient treatment boundaries."
      inputs:
        - source_id
        - consignment_id
        - dispatch_date
        - gross_kg
        - tare_kg
        - moisture
        - contamination
        - recipient
        - treatment_scope
        - generated_kg
        - opening_waste_kg
        - closing_waste_kg
        - attribution
        - N
      output: "D_r_att/N kg per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_asset
      applies_to: "rack; hanger; mirror; pos; luminaire; mop"
      rule: "For asset a, H_a = sum(all historical beneficiary exposure) + remaining expected all-beneficiary exposure including idle; current F_a,b = e_a,b/H_a. Exposure is item-position*h for racks/hangers, reserved area*h for luminaires, observed occupancy*h plus reserved idle for mirrors/mop/POS. One fixed driver per actual asset version applies to every beneficiary. Manufacturing input=sum(F_a,b)/N complete Item(s). If H changes replace each old e/H_old by e/H_new with signed difference; never add another full asset. At retirement use actual total H_final and allocate residual1-sum(F_history) over actual beneficiary exposures, correcting former versions. Stock counts validate acquisition/retirement, not a second consumed-asset input. At retirement recompute every historical beneficiary/pool share as its actual exposure divided by H_final, replace all prior versions by signed differences, and reconcile the complete sum to1 across the complete actual lifetime beneficiaries. Only after that replacement, allocate any rounding/unassigned residual over those same actual lifetime beneficiaries by their actual exposure, never solely to the current period; unknown historic exposures prevent closure."
      inputs:
        - asset_id
        - model
        - original_BOM
        - installation_scope
        - acquisition_date
        - historical_e
        - historical_F
        - remaining_expected_e
        - idle_e
        - beneficiary_id
        - current_e
        - H_old
        - H_new
        - version
        - retirement_date
        - H_final
        - N
      output: "F_a/N complete Item(s) per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_asset_terminal
      applies_to: "rack_waste; hanger_waste; mirror_waste; pos_waste; luminaire_waste; mop_waste"
      rule: "Z_a = terminal_net_mass_a * f_life_a,b; f_life_a,b is this pool share of the same corrected all-beneficiary asset lifetime exposure. Apply this responsibility fraction once, not times another manufacture fraction. Direct mass after removal and original-BOM minus evidenced removed-component masses are exclusive modes; direct net weighing must not subtract those components again. Interim forecast mass/treatment must be explicit and replaced with actual retirement evidence. Actual replacement parts, their manufacture and discarded carriers need separate event-based named atomic cards before completion; included original parts are not repeated."
      inputs:
        - asset_id
        - terminal_mode
        - direct_net_mass
        - BOM_mass
        - removed_component_ids
        - removed_component_masses
        - f_life
        - beneficiary_exposures
        - forecast_status
        - recipient
        - treatment_scope
        - N
      output: "Z_a/N kg per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_route
      applies_to: "truck_loaded; truck_empty"
      rule: "Choose exactly one loaded attribution mode per source/segment. target_consignment: K_att=sum(target_gross_kg/1000*actual_km) where target_gross_kg is already the measured actual target consignment gross payload; NEVER multiply shared-load share or allocation_once. unassigned_vehicle: K_att=sum(vehicle_total_gross_kg/1000*actual_km*target_payload_kg/vehicle_total_gross_kg) only for unassigned whole-vehicle activity and a compatible actual mass-basis t*km provider. Target plus other actual gross payload kg must reconcile to the same-segment vehicle total with known positive denominator. Keep a provider already-attributed target quantity unchanged; reconstruction is QA only. Retain raw/target attribution level and provider reference unit. Do not reduce target-kg-derived t*km by another occupied-volume share; volume-capacity allocation of a whole-vehicle environmental vector needs a matching actual provider and separate atomic activity, not a correction to target kg. Retain uncovered actual empty vehicle*km, allocating once by all-beneficiary actual route-capacity reservations. Retain stationary powered idle h/fuel in matching named completion cards; never erase them by zero load/distance. Original goods inbound and treatment-contained actual legs occur once; unknown coverage blocks completeness. Normalize once by final reference denominator N."
      inputs:
        - leg_id
        - vehicle_model
        - loaded_mass_kg
        - actual_km
        - empty_leg_km
        - capacity
        - all_beneficiary_capacity_distance
        - idle_hours
        - fuel_logs
        - reserved_capacity_hours
        - provider_coverage
        - allocation_once
        - N
        - loaded_attribution_mode
        - target_gross_kg
        - vehicle_total_gross_kg
        - target_payload_kg
        - all_other_payload_kg
        - provider_reference_unit
        - provider_attribution_level
      output: "K_att/N t*km; J_att/N km per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_completion
      applies_to: "all"
      rule: "For every missing common module fix this same site/SKU/cohort/version and N. Collect raw activity: whole meters by carrier incl HVAC/general/security lighting; actual chemicals/water/effluent and solid carriers; actual shared routes/fuel/idle time; complete building/IT/security/handling asset IDs, original BOM, installation and whole-life exposures. Direct meters first; shared energy/cleaning/route use the specified calc_energy/calc_clean/calc_route drivers; buildings use occupied+reserved area*h across all historical and remaining beneficiaries; shared IT/security/handling use reserved capacity*h, retaining idle, and calc_asset and calc_asset_terminal. Add separate species/medium emissions from measured terminal flux with capture/storage/carriers reconciled. Existing normalized external result v_r with evidenced raw denominator D_old is restored to raw v_r*D_old, assigned to this pool once by its causal driver, then summed only with identical compatible flow/property/unit/boundary raw numerators, deduplicating original source IDs. Re-express all modules at the common N and divide once. Never add kg to MJ or normalized values to raw totals. If an external denominator, scope, original ID or quantity is unavailable, the total remains incomplete, not zero."
      inputs:
        - module_id
        - source_ID
        - site
        - SKU
        - pool
        - version
        - N
        - raw_activity
        - all_beneficiary_drivers
        - asset_history
        - lifetime
        - idle_hours
        - provider_scope
        - v_r
        - D_old
        - flow_identity
        - property
        - unit
        - boundary
        - duplicate_IDs
      output: "Compatible completed raw numerator by row; divided by N once"
      source_ids:
        - ghg-product-2011
    - id: calc_transfers
      applies_to: "supplier_return; internal_transfer; failed_retention"
      rule: "Count actual physical handoffs T_supplier_phys, T_internal_phys and F_external_phys by original garment/event/recipient IDs; report each raw count divided by N. These are not B_t/B_f ownership amounts: a background reassignment creates no physical flow. An acceptance revocation with no physical return changes N and S/F ownership but creates no second outward handoff. A returned and later resold garment retains its original ID and production history."
      inputs:
        - original_id
        - event_id
        - recipient_id
        - handoff_time
        - garment_state
        - T_supplier_phys
        - T_internal_phys
        - F_external_phys
        - acceptance_revocation
        - physical_return
        - ownership
        - N
      output: "Physical transfer Item(s) per reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_common_services
      applies_to: "all"
      rule: "Common building manufacture/installation and terminal carriers use the complete actual building/BOM, excluding separately inventoried department assets, and calc_asset with all historical+remaining occupied/reserved area*h. Common HVAC/general/security lighting use actual carrier-separated meters and measured equipment load/standby under calc_energy; actual fuel is net kg at measured composition/NCV, and purchased heat remains measured MJ, each with a named atomic card. Common water/cleaning uses actual surface-area*frequency and calc_clean with direct whole-effluent mass. Shared IT/security/payment equipment uses actual complete device models and calc_asset at reserved capacity*h, operation metered separately; repair events are disjoint. Staff travel uses each actual mode, vehicle/occupancy, measured passenger-km and idle logs; assign each employee journey once to all actual benefited work by recorded employee working+reserved idle hours, then /N. Actual shared handling/vehicle assets use capacity*h lifetime and event fuel/idle, not tonne-km0. Provider vehicle/operation/idle/manufacture/treatment scopes are checked before adding any row. No module is completed by naming it alone."
      inputs:
        - module_id
        - actual_building_BOM
        - historical_area_h
        - remaining_area_h
        - complete_device_ID
        - capacity_h
        - carrier_meter
        - equipment_load
        - standby
        - actual_fuel_kg
        - composition
        - NCV
        - heat_MJ
        - treated_area
        - cleaning_frequency
        - employee_journey_id
        - travel_mode
        - vehicle_occupancy
        - passenger_km
        - idle_hours
        - employee_working_reserved_hours
        - all_beneficiaries
        - provider_scope
        - N
      output: "Common module raw quantities attributed once, compatible rows aggregated then /N"
