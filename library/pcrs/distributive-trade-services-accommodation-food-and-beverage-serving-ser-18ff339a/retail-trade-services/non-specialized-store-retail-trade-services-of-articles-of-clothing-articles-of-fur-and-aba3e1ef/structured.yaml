        - paired_weighing
        - actual_rinsate_composition
        - source_component_ledger
        - source_fraction_uncertainty
        - new_rinse_water_kg
        - foreign_dirt_kg
        - source_destination_reclassification
        - whole_actual_rinsate_kg
      output: "Container manufacturing Item(s)/N only if uncovered; actual whole residue-bearing container waste kg/N; formulation/effluent source portions disjoint"
      source_ids:
