allocation_rules:
  - rule_id: pool
    applies_to: "all"
    rule: "Declare one site/SKU/size/BOM/route configuration, start/end dates, opening stock, final-return adjudication cutoff and revision schedule prospectively. Keep failed, closed/idle and zero-sale periods in the same configuration pool. Entirely N=0 pools remain reported as raw totals and are unnormalizable. Late returns and acceptance revocations replace the original N, background ownership and every affected raw numerator using actual event dates; do not allocate them again to a new pool. Pure refunds/discounts with valid acceptance do not alter N."
    source_ids:
      - ghg-product-2011
  - rule_id: shared
    applies_to: "all"
    rule: "Prefer dedicated measurement/subdivision. Shared electricity uses measured equipment kW*time including standby; cleaning uses actual treated area*frequency; racks/hangers use occupied positions*time; mirror/fitting uses observed fitting occupancy*time; POS uses measured task active time and evidenced reserved standby capacity. Assign retained idle/closed capacity across all reserved actual beneficiaries by positive known capacity-hours. Sum allocated raw amounts to the complete parent total; subtract a submeter only if included in that parent. Revenue, a default percentage and a zero driver are not substitutes."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_lifetime
    applies_to: "assets"
    rule: "Use calc_asset across the whole asset life and every beneficiary, including historical allocations, remaining exposure, idle and terminal residual. Manufacture/initial installation/initial delivery are one defined input scope; operation, actual later repairs and retirement are disjoint. Lifetime changes replace historical allocation versions by signed corrections instead of restarting manufacture. A transferred whole asset carries the unassigned residual to the next owner; cumulative fractions never exceed1. Final residual must be allocated once across the actual lifetime beneficiaries."
    source_ids:
      - ghg-product-2011
  - rule_id: no_credit
    applies_to: "all"
    rule: "No coproduct substitution or avoided virgin-production credit is assigned to garments, tags, cardboard, sweepings or recovered equipment. Record actual treatment and transfer responsibility. Failed-goods production B_f is not subtracted when the waste treatment is added; credits from a separate consequential study cannot enter this attributional module."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "garment"
      flow_role: "garment custody; acceptance; background; waste"
      record_type: "Measured foreground ledger with supporting records"
      raw_fields: "original_id; event_id; SKU; size; supplier_lot; complete_BOM; label_and_tag_state; actual_net_mass; mass_state; received; opening; closing; gross_handovers; physical_customer_returns; supplier_handoffs; internal_transfers; recipient; event_date; acceptance_status; defect; fitting_event; failed_retention; actual_waste_gross; container_tare; moisture; B_s; B_f; B_t; B_open; receiving_background_scope; inbound_route; return_cutoff; correction_version; final_valid_acceptance; ordered_event_history; goods_to_residue_event; goods_to_residue_parent_count; closing_goods; source_garment_kg; signed_environmental_moisture_kg; removed_source_component_kg; captured_source_lint_kg; opening_residue; generated_source_portions; measured_external_added_material; actual_dispatch; closing_residue; T_supplier_phys; T_internal_phys; F_external_phys; opening_goods_kg; receipts_kg; physical_returns_kg; internal_in_kg; gross_handoffs_kg; supplier_handoffs_kg; internal_out_kg; goods_to_residue_source_kg; closing_goods_kg; investigated_mass_difference"
      collection_method: "Scan unique garment/source-lot IDs at receiving, each fitting/restock, checkout, return and final fate; count complete garments and weigh a traceable same-lot sample on a calibrated balance excluding packaging, with actual moisture/conditioning and sampling uncertainty. Supplier BOM/receipts independently identify label/trim/pack components; audit POS against physical counts and customer acceptance/return records. Weigh dispatched waste, record recipient manifests and scope. Record goods-to-residue source parent, actual source-kg and timestamp at generation; count closing goods including quarantine until that transfer, and separately census waiting-for-dispatch residue stock. Measure removed source components/lint and actual moisture/environmental mass changes by calibrated paired condition/weighing records; record observed signed kg and uncertainty, not a default dry-matter correction. Determine final valid acceptance over the ordered whole original-ID history before distinct counting. Aggregation duty: calc_goods, calc_transfers and calc_dispatch; retain raw count/kg and S/F/T/O separately; normalize attributable numerator by N once"
      unit: "Item(s); kg"
      frequency: "Each receipt/event; stock census at both boundaries and cutoff; every late correction"
      temporal_coverage: "Complete declared pool plus linked historic sources and post-pool return adjudication"
      site_scope: "One actual store/SKU/size/BOM; all failed and zero-sale lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "Timestamped scans; scale calibration/tare/sample log; manufacturer and actual supplier BOM; POS/acceptance audit; signed recipient/return responsibility; reconciled stock count and kg; unknown gaps block completeness"
    - protocol_id: cp_energy
      process_id: "energy"
      flow_role: "electricity"
      record_type: "Measured foreground ledger with supporting records"
      raw_fields: "meter_id; meter_boundary; start_kWh; end_kWh; timestamp; dedicated_or_shared; equipment_kW; operating_hours; standby_hours; circuit_overlap; target_driver; all_beneficiary_drivers; outage; calibration; N"
      collection_method: "Read sealed calibrated import/submeters at circuit boundary; log lighting/fitting/POS load and standby using calibrated power logger. Map each submeter to parent wiring; reserve-capacity/time observations include closed hours. Incomplete equipment load coverage requires measured residual reconciliation, not nameplate-only extrapolation. Aggregation duty: calc_energy; sum raw driver shares to parent, then MJ/N once"
      unit: "kWh; kW; h"
      frequency: "Continuous logger or each meter interval, boundary reads and outage events"
      temporal_coverage: "Entire pool including idle/closed intervals"
      site_scope: "Department lighting/POS circuits and complete shared parent beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; wiring/circuit map; interval invoices; logger calibration; driver observations; no missing interval recorded as zero"
    - protocol_id: cp_clean
      process_id: "clean"
      flow_role: "water; cleaner; effluent; sweepings"
      record_type: "Measured foreground ledger with supporting records"
      raw_fields: "event_id; location; treated_area; frequency; all_beneficiaries; import_mode; imported_kg_or_m3; rho_water; temperature; cleaner_supplier; composition_CAS; concentration; formulation_opening_purchase_closing; effluent_mode; discharge_kg_or_m3; rho_effluent; effluent_composition; effluent_temperature; evaporation; storage_change; captured_cloth_liquid; foreign_solids; sweepings_gross_tare; recipient; source_ID; N; container_id; supplier; batch; exact_model; actual_BOM; single_use_evidence; net_container_mass; closure_label_dispensing_state; formulation_source_kg; used_kg; spill_kg; rinsate_kg; terminal_retained_kg; unused_closing_or_returned_kg; provider_manufacturing_inclusion; included_transport_scope; source_beneficiaries; remaining_stock_responsibility; Y_container_att; dispatch_gross; outside_sack_tare; D_cleaner_container_att; generation; opening_terminal_stock; closing_terminal_stock; recipient; treatment_scope; uncertainty; N; original_formulation_source_kg; paired_weighing; actual_rinsate_composition; source_component_ledger; source_fraction_uncertainty; new_rinse_water_kg; foreign_dirt_kg; source_destination_reclassification; whole_actual_rinsate_kg"
      collection_method: "Measure each cleaning batch at department boundary: calibrated import/discharge meter or net balance, density sample at actual state, detergent weighed as supplied and supplier specification. Log actual treated surfaces, spills and reusable-mop recovery. Measure whole actual effluent and sweepings at dispatch; separately reconcile import/formulation/stock/carrier liquid. Do not infer drain flow from water supply. Inspect and photograph each actual formulation container/closure/label/dispensing model and supplier batch/BOM; weigh net formulation and complete empty/residue-bearing carrier on a calibrated balance at use/end/dispatch. Measure retained residue with a traceable paired empty-container or analytical material balance while preserving complete-carrier dispatch net mass. Record supplier manufacturing/transport inclusion explicitly, source-beneficiary allocations, actual residual/rinsate split, sealed terminal-stock census and signed collector/treatment contract. No container material/shape or absence is inferred from formulation kg. Apply calc_clean_container explicitly to container count/manufacturing coverage and original-formulation source portions. Measure each original container count in Item(s); obtain original-formulation rinsate kg from paired actual weighing/composition or verified source-component records, excluding new rinse water and foreign dirt. Keep used/spilled/rinsed/retained/unused source portions mutually exclusive with original source IDs, reclassifying any later fate without counting used formulation again. Whole actual rinsate is separately directly measured as effluent once, without another source-fraction multiplication. Aggregation duty: calc_clean and calc_dispatch, per-row raw state units and attribution then /N once"
      unit: "kg; m3; kg/m3; m2; h; Item(s)"
      frequency: "Each cleaning/spill and discharge; inventory at pool boundaries"
      temporal_coverage: "All department/fitting cleaning over the pool, including unsold-garment attempts"
      site_scope: "Department and actual shared cleaning beneficiaries only; common facilities via cp_completion"
      aggregation_rule: "per reference flow"
      quality_evidence: "Balance/meter/density calibration; cleaner batch/SDS composition; cleaning logs; receiver manifest; documented absence or unresolved unknown for every conditional exchange"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "bag; receipt; hangtag; carton and removed paper waste"
      record_type: "Measured foreground ledger with supporting records"
      raw_fields: "source_component_id; SKU; material; dimensions; coating; composition; supplier; batch; opening; purchases; recovered_returns; closing_unused; closing_printed; transfers; supplied_original_or_retail_added; same_batch_unit_mass; gross; tare; retained_or_removed; moisture; receiver; treatment_transport_scope; N; opening_unprinted_net_paper; new_net_paper; returned_unused_net_paper; closing_unprinted_net_paper; unused_returns_out; unused_transfers_out; printed_WIP_source_ID; printed_WIP_net_paper; original_printing_energy; final_beneficiary_pool; signed_revision; actual_core_present; core_material; core_net_mass; core_original_BOM; core_provider_inclusion; core_final_carrier; core_recipient"
