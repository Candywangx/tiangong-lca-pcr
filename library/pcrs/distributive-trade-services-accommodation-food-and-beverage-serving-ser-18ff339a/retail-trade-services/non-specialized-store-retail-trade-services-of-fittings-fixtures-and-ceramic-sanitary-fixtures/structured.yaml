allocation_rules:
  - rule_id: a_pool
    applies_to: "all inventory rows"
    rule: "Declare the prospective same-configuration reporting pool and return follow-up horizon before outcomes are known; retain all failed and zero-sale periods. Q is count of distinct original kit IDs with final-valid complete acceptance at cutoff, including resolved return/resale history only once. Revocation removes that ID even without physical return; financial refund alone does not remove valid acceptance. Resale never duplicates original kit background. Late returns replace the original pool numerator/fates and Q version with actual event dates; do not charge a new pool again. Q=0 is unnormalizable, retain raw totals and aggregate only under the predeclared compatible pool."
    source_ids:
      - ghg-product-2011
  - rule_id: a_asset
    applies_to: "all inventory rows"
    rule: "Each shelf, trolley and terminal card binds exactly one evidenced complete homogeneous model/configuration and lifecycle contract boundary; record model and source_vector_id before binding. Different models/contracts require separate bilingual cards/protocol views and sync before completeness; never add unlike Item(s) fractions under one flow. Packages contain manufacture, installation and end-of-life only; operation, repairs, building/fixed lights and consumables are disjoint. Prove no repair or add event-specific atomic repair cards. For asset a and historical beneficiary-period h, e_a_h is shelf reserved m2*h, trolley reserved trolley-hours, or terminal reserved terminal-hours, including stationary idle/closed periods. L_a is expected all-beneficiary lifetime exposure in that SAME unit, E_a=sum all actual historical e_a_h. While operating f_new_a_h=e_a_h/L_a; require L_a>=E_a and L_a>0. On any lifetime revision replace every prior historical f_old with f_new and issue delta=f_new-f_old to the original pool/source version; never restart manufacture. At retirement E_a>0: f_final_a_h=e_a_h/E_a. Always compute delta_a_h=f_final_a_h-f_old_a_h from corrected actual historical exposures and replace every old value. R_a=1-sum_h(f_old_a_h) is QA only: sum_h(delta_a_h)=R_a; never distribute R_a proportionally on top of old fractions, because corrected old exposure proportions may differ. Require sum_h f_final=1 and cumulative assigned fraction<=1. If E_a=0 or unknown preserve full unassigned package/residual and block final attribution until documented actual beneficiaries/exposures are recovered; never divide by zero or erase the asset. Provider-contained terminal carriers are not additional waste outputs; direct terminal net weighing and component reconstruction are exclusive."
    source_ids:
      - ghg-product-2011
  - rule_id: a_energy
    applies_to: "all inventory rows"
    rule: "Core electricity is checkout terminal/controller AC only; manual trolley needs no powered handling. Use disjoint directly metered own circuits first; subtract a submeter only from a parent containing it. For shared core circuits time-tag the meter and terminal event log into four disjoint measured kWh pools: E_retail for SKU checkout/return work, E_admin for common terminal administration, E_idle for powered idle and E_fixed for separately measured always-on checkout controller. Reconcile their sum to the included parent. For E_retail use t_b, measured occupied terminal seconds of each actual SKU beneficiary b, including failed/reversed events; multi-SKU common transaction time is split by measured line-handling seconds, and events with no identifiable retail lines enter E_admin. Allocate E_admin/E_idle/E_fixed by r_b, actual prospectively reserved terminal-hours for every SKU beneficiary across the same interval, including closed/zero-sale periods. E_core=E_retail*t_s/sum_b(t_b)+(E_admin+E_idle+E_fixed)*r_s/sum_b(r_b). t and r never mix. A directly evidenced zero-kWh pool contributes zero without evaluating a zero driver ratio; unknown kWh is not such evidence. Positive source pools require known positive driver totals and complete beneficiary schedules; unsupported reservation/zero totals block allocation, not default zero. Lighting/HVAC/network/security remain disjoint support modules."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_carrier
      process_id: "trade"
      flow_role: "external_damaged; supplier_damaged"
      record_type: "Damaged physical product handoff"
      raw_fields: "original_id; handoff_id; recipient; state; date; gross_kg; tare_kg; D_external; D_supplier; T; F; source_vector_id"
      collection_method: "At each real damaged handoff weigh actual full carrier gross minus tare using calibrated scale, record which ceramic fragments/accessories/packaging remain and actual recipient accepted responsibility; mutually exclusive with intact kit handoff and retailer waste dispatch. Carrier is not declared waste by default. D_external and D_supplier are actual disjoint net kg; each /Q per reference flow, custody satellite only; no additional production or waste characterization."
      unit: "kg"
      frequency: "Each handoff"
      temporal_coverage: "Full pool including linked corrections"
      site_scope: "Actual external and supplier gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed recipient/state/source responsibility; scale calibration"
    - protocol_id: cp_completion
      process_id: "trade"
      flow_role: "all inventory rows"
      record_type: "Completion modules and raw source vectors"
      raw_fields: "module_id; site; period; source_vector_id; U_core_x; U_j_x; u_j_x; d_j; Q; scope; version; beneficiary; floor_m2_h; conditioned_m2_h; cleaned_m2; staff_person_h; CPU_seconds; transmitted_bytes; payment_occupied_seconds; reserved_port_h; protected_m2_h; admin_task_person_h; reserved_staff_capacity_h; fuel_name; fuel_opening; fuel_received; fuel_closing; density; temperature; LHV; refrigerant_species; control_volume_id; vessel_ids; opening_contained; closing_contained; added_standalone; added_equipment_containers; import_event_id; recovered_export; contained_export; export_event_id; internal_transfer_id; inventory_uncertainty; absence_evidence; U_pool_x; d_s_x; d_b_x; reserved_device_h; source_internal_kg; path_id; sampling_interval; c_out_k; V_out_k; c_in_k; V_in_k; measurement_mode; gas_temperature; gas_pressure; wet_dry_basis; delta_room_kg; delta_capture_stock_kg; nonair_export_kg; nonair_import_kg; capture_event_id; room_inventory_start; room_inventory_end; capture_stock_start; capture_stock_end; boundary_coverage; flux_uncertainty; equipment_boundary_event_ids; nonair_boundary_event_ids; carrier_measurement_mode; species_kg; net_carrier_kg; species_mass_fraction; composition_method; composition_uncertainty; concentration_raw_unit; volume_raw_unit; actual_flow_rate_m3_s; duration_s; cumulative_actual_m3; unit_conversion_method; conversion_evidence; attribution_level; original_beneficiary_period; original_pool_id; prior_source_version"
      collection_method: "At every reporting interval survey actual facilities, ICT/network/payment/security/admin accounts, signed provider scope and supplier included activity/capital/transport; prove absence by physical/account inspection. Collect each b_support/b_support_drivers driver in its named unit, every beneficiary and pool numerator, calibrate area/time/volume/mass meters. Match actual fuel/refrigerant records and atomic completion cards. Recover original provider denominator and preserve already-attributed scope; reconcile source-ID overlaps with core. For refrigerant outdoor-air completion use only b_refrigerant_air absolute full-site path measurements on matching gas state, calibrated species instruments/airflow meters and full interval coverage; inspect room/capture/non-air species inventories and unique transfer IDs. Equipment deficit remains QA. Retain signed no-system inspection or block unknowns. nonair_export_kg and nonair_import_kg are ONLY species kg crossing the site boundary in sorbent/capture/other non-air carriers OUTSIDE the equipment control volume. Explicitly exclude ALL equipment/cylinder/recovery-container imports/exports already counted in added_standalone, added_equipment_containers, recovered_export or contained_export, including actually dispatched recovered-gas cylinders and gas-containing equipment. Preserve equipment_boundary_event_ids and nonair_boundary_event_ids as mutually exclusive sets and reconcile shared source/transfer histories; no event or same species portion enters both ledgers. Obtain each non-air species quantity by exactly one exclusive mode: direct measured species_kg OR measured net_carrier_kg*measured species_mass_fraction for that same actual consignment/state. Retain calibrated mass data, representative composition sampling, method and uncertainty. Whole carrier kg is not species kg; already measured species kg is never multiplied by composition again. Unknown composition/species mass blocks closure and final emission. For this sole primary mode c_out_k and c_in_k MUST be species mass concentration in kg/m3; V_out_k and V_in_k MUST be cumulative actual air volume in m3 over the SAME observed interval and measured temperature/pressure/wet-dry state. Their product is species kg. A raw actual flow rate is not V: integrate actual_flow_rate_m3_s over measured duration_s (or interval-resolved equivalent) to obtain cumulative_actual_m3 before multiplying c. Preserve concentration_raw_unit, volume_raw_unit, raw flow/duration records, and the exact one-time unit conversion. Pure scale conversions such as g to kg or hours to seconds are allowed once. ppm, standard-volume versus actual-volume or other state-dependent conversions cannot be substituted directly: require source-supported validated matching species/state conversion with actual measured conditions and retained conversion_evidence, or block calculation and refer for PCR method review. Never assume density, temperature or pressure. Verify c_transport has assigned independent asset lifecycle transport to the original historical beneficiary/pool once and carton inbound transport to first-use or unused source ownership before adding U_j_x. Retain provider already-attributed levels and original pool corrections, never allocate twice. c_completion preserves each exchange unit and source numerator, then divides Q once; no scalar sum of unlike exchanges."
      unit: "mixed"
      frequency: "Each module reporting interval and revision"
      temporal_coverage: "Same site/pool/time as core"
      site_scope: "All required building/facilities sources under b_complete"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed scope, measured activity and source deduplication ledger"
    - protocol_id: cp_goods
      process_id: "trade"
      flow_role: "source_failure; service; customer_kit; supplier_kit"
      record_type: "Original kit and acceptance ledger"
      raw_fields: "original_id; lot; configuration; package_ids; actual_BOM; source_vector_id; receipt_date; gross_handover_id; physical_return_id; acceptance_status; revocation_date; recipient; S; F; T; O; N_F; Q; H_intact; R_supplier; goods_open; goods_close; receipts; physical_returns; all_handover; supplier_transfers; condemnation; demonstrator; ceramic_kg; accessory_kg; packaging_kg; kit_net_kg; gross_kg; tare_kg; F_whole_i; whole_kit_source_id; component_source_id; component_original_quantity; component_property_unit; component_vector_id; component_fate"
      collection_method: "Scan original kit IDs at receiving, inspection, all handovers and returns; reconcile supplier complete-kit/component vector including original packaging and inbound transport. Weigh received ceramic/parts/packaging separately using calibrated scale with tare and state. Preserve two-package link, acceptance evidence and actual final recipient. source_failure is restricted to F responsibility equivalents of the actual complete homogeneous original kit and its matching whole-kit supplier vector only. For those original whole-kit sources i, N_F=sum_i(F_whole_i); never derive F_whole_i from selected components or from waste mass. A split descendant fate that assigns basin/trap/accessory/packaging source vectors separately among S/F/T/O cannot be represented by N_F times the whole-kit vector: environmental inventory vectors are generally not proportional. Before completeness, add a real separate component-source input card for every F component, with its actual original component quantity/property/unit, original component supplier vector, source IDs and linked protocol; preserve each component original amount and vector across S/F/T/O. Do not put component LCI into the complete-kit flow identity or rebuild it with one common scalar fraction. Exclude those component-source portions from source_failure and reconcile all original vector IDs to avoid duplication. Normal complete whole-kit sources remain intact and need no mechanical component split; unknown supplier component vectors/amounts block the split path and completeness. Apply a_pool and b_ownership; N_F=sum_i(F_whole_i) for whole-kit vectors only, then N_F/Q per reference flow; service=1. Split component quantities/vectors require separate real component input cards and protocols before completeness, and never enter whole-kit N_F. Receipts/returns are QA only."
      unit: "Item(s)"
      frequency: "Every event; daily reconciliation; follow returns through cutoff"
      temporal_coverage: "All pool periods including failures and late corrections"
      site_scope: "Receiving and pickup gates for one SKU/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed acceptance/fate evidence; supplier vectors; calibration and stock reconciliation"
    - protocol_id: cp_energy
      process_id: "trade"
      flow_role: "electricity"
      record_type: "Meter and beneficiary ledger"
      raw_fields: "meter_id; parent_boundary; date; opening_kWh; closing_kWh; E_retail; E_admin; E_idle; E_fixed; t_b; t_s; r_b; r_s; beneficiary; line_handling_seconds; transaction_common_seconds; reservation_start; reservation_end; E_core"
      collection_method: "Calibrated checkout/controller circuits and synchronized per-line terminal timers classify four non-overlapping source pools under a_energy. Retain every SKU beneficiary and actual measured occupied seconds, failed/return tasks, reserved terminal-hour schedules including closure; reconcile parent and sum of attributed kWh. Do not infer hours from sales count. E_core uses exact a_energy seconds/hour formulas then 3.6*E_core/Q MJ per reference flow once; source IDs excluded from support."
      unit: "kWh"
      frequency: "Each meter interval and event change"
      temporal_coverage: "Whole reporting pool including closure"
      site_scope: "Disjoint core circuits only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; parent balance; beneficiary driver completeness"
    - protocol_id: cp_carton
      process_id: "trade"
      flow_role: "extra_carton"
      record_type: "Additional protective carton stock"
      raw_fields: "carton_source_id; first_use_event; prior_pool; prior_version; material; coating; lot; opening_unused_kg; opening_used_kg; received_new_kg; closing_unused_kg; transfer_unused_kg; return_unused_kg; C_in; customer_handover_kg; retained_used_kg; held_waste_kg; reuse_event; recipient"
      collection_method: "Calibrated net weighing and source-tagged stock counts distinguish new unused versus already-used cartons at each opening/closing and receipt/transfer/return. Match unique first-use events; inspect reuse/cleaning/repair transport records and maintain original burden history under b_carton_stock. Exclude original merchandise carton. C_in=opening_unused_kg+received_new_kg-closing_unused_kg-transfer_unused_kg-return_unused_kg; C_in/Q once; used and reusable carton kg never enter manufacturing consumption again."
      unit: "kg"
      frequency: "Each receipt/use and daily stock"
      temporal_coverage: "Full pool"
      site_scope: "Additional packaging only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale checks; purchase/dispatch IDs; material declaration"
    - protocol_id: cp_waste
      process_id: "trade"
      flow_role: "broken_kit; carton_waste"
      record_type: "Actual waste consignment"
      raw_fields: "consignment_id; source_original_ids; carrier_state; ceramic_kg; accessory_kg; packaging_kg; gross_kg; tare_kg; W_kit; W_carton; opening_held; generated; closing_held; destination; treatment_scope; receiver_contract_id; accepted_constituents; accepted_state; treatment_dataset_id; treatment_constituent_scope; included_collection_transport; downstream_separation_mass"
      collection_method: "At dispatch use calibrated gross-minus-tare and retain actual source-linked composition/state. Check signed receiver contract expressly admitting ceramic shards plus actual accessories/original packaging against complete matching treatment dataset scope under b_mixed_acceptance; reconcile any constituent separation. Weigh separate carton disjointly. Inspect actual included transport scope before adding transport modules; licenses/photos alone do not qualify. W_kit and W_carton are direct disjoint dispatched net kg, each /Q per reference flow. Stock balance is QA only; treatment/transport matched once; no generation correction to dispatched mass."
      unit: "kg"
      frequency: "Every dispatch; monthly held-stock reconciliation"
      temporal_coverage: "Full pool and subsequent linked dispatch"
      site_scope: "Store residual dispatch gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated tickets; signed mixed-constituent acceptance; complete treatment and disjoint transport scope; carrier/source and separation reconciliation."
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "shelf; trolley; terminal"
      record_type: "Persistent lifetime asset ledger"
      raw_fields: "asset_id; model; configuration; contract_id; complete_package_scope; source_vector_id; e_a_h; L_a; E_a; f_old_a_h; f_new_a_h; f_final_a_h; R_a; delta_a_h; delta; beneficiary; exposure_unit; period; prior_version; f_shelf; f_trolley; f_terminal; retirement; repair_events"
      collection_method: "Read complete model/contract and transport/lifecycle scope; collect shelf reserved m2*h and trolley/terminal reserved hours for all historical beneficiaries including idle. Enforce one homogeneous model/source per card; different models require separate cards/protocols. Retain all historical exposures and old fractions, revisions and final retirement date; calibrate time/area measurements and reconcile sum exposures and package fractions. Compute a_asset exact f_new or f_final and replace all prior versions; same-model fractions only, each /Q once. Unknown/zero total exposure preserves unassigned full package and blocks final attribution."
      unit: "Item(s)"
      frequency: "Each exposure interval, repair and life revision"
      temporal_coverage: "All lifetime beneficiaries and current pool"
      site_scope: "Core equipment excluding building/fixed lights"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scope/BOM verification; exposure logs; cumulative fractions; no-repair evidence"
    - protocol_id: cp_transport
      process_id: "trade"
      flow_role: "all inventory rows"
      record_type: "Source-bound added transport"
      raw_fields: "transport_source_id; provider_scope; already_attributed; consignment_id; carton_source_id; asset_id; vehicle_model; trip_id; segment_id; loaded_vehicle_km; empty_vehicle_km; stationary_idle_h; A_trip_k; H_trip_k; v_b_trip_k; v_s_trip_k; payload_t; distance_km; responsible_dispatch; original_denominator; version; included_fuel_capital_maintenance; attribution_level; U_asset_x; f_a_h; U_asset_h_x_new; U_asset_h_x_old; delta_U_asset_h_x; original_beneficiary_period; original_pool_id; carton_original_quantity; carton_first_consumed_quantity; carton_unused_quantity; carton_transfer_return_quantity; transport_assigned_vector; transport_unassigned_vector; prior_source_version"
      collection_method: "For each actual carton/asset inbound, asset retirement and residual route inspect signed source boundary and full loaded/empty/idle provider scope. Use traceable route/GPS/odometer/time records and measured packed reserved cubic volumes across all beneficiaries, retaining initiating reservation for empty return and stationary idle. Calibrate volume and distance/time records and reconcile to provider trip totals. No extra transport where already included. Asset lifecycle transport is not ordinary current-period freight. First obtain U_asset_x, the complete transport source numerator belonging to actual asset_id a, by actual consignment allocation under c_transport; if provider already attributes to that asset retain it without another reserved-volume fraction. Then attribute that asset transport source to every original historical beneficiary-period h exactly once: U_asset_h_x=f_a_h*U_asset_x using the SAME asset a_asset operating/final fractions and lifecycle source version. On lifespan/exposure or transport-vector revision replace each old U_asset_h_x with the new value and post delta_U_asset_h_x=U_asset_h_x_new-U_asset_h_x_old back to the original h/pool. Never charge the whole asset transport to retirement/current Q, multiply another manufacture fraction, or add transport already included in the complete asset/lifetime package. A verified provider value already attributed to h is restored with its own original denominator and retained without another f_a_h. Preserve attribution_level (trip/asset/beneficiary-period) and exact source IDs so no level is applied twice. Additional carton inbound transport follows carton_source_id and the b_carton_stock first-use convention: an actual homogeneous source batch transport vector follows its original carton quantities, all measured as net carton kg at the same original receiving state; only the first-consumed carton portion receives that source once in its first-use pool, measured unused stock carries the unassigned source portion to later use, and unused transfers/returns transfer that same unassigned portion to a named continuing owner. Already-used/reused cartons retain their previously assigned source reference without a new transport charge. Reconcile original carton quantity and assigned/unassigned transport vector portions; do not charge the full new-receipt transport now and copy it again on future consumption. Distinct actual reuse/return transport is a separate event/source, never a duplicate incoming source; transport included in the carton receiving-gate manufacturing vector is QA only and is not added. c_transport retains already-attributed raw provider numerator, otherwise allocates vehicle-km and idle-h separately by reserved m3, then restores module denominator and c_completion /Q once."
      unit: "mixed"
      frequency: "Every trip/segment and linked idle interval"
      temporal_coverage: "Full source cohort including failures and empty legs"
      site_scope: "Explicit carton/asset/waste gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed route scopes; full trip reconciliation; source-ID dedup and no unassigned empty/idle activity"
  calculation_rules:
    - id: c_custody
      applies_to: "customer_kit; supplier_kit; external_damaged; supplier_damaged"
      rule: "H_intact and R_supplier count actual disjoint intact handoff events, not final-valid Q; D_external and D_supplier=sum disjoint damaged carrier net gross_kg-tare_kg. Normalize each /Q once. These four named custody satellite rows are non-characterized; manufacturing follows source_failure and S/T/O ownership, treatment only follows actual waste."
      inputs:
        - H_intact
        - R_supplier
        - D_external
        - D_supplier
        - gross_kg
        - tare_kg
        - Q
      output: "Four custody satellite quantities per reference flow"
      source_ids:
        - ghg-product-2011
    - id: c_q
      applies_to: "service"
      rule: "Q=count distinct original_id with final-valid complete acceptance; use latest replacement ledger, not accepted count minus the same revocations twice."
      inputs:
        - original_id
        - acceptance_status
        - revocation_date
        - Q
      output: "Q and one service per reference flow"
      source_ids:
        - ghg-product-2011
    - id: c_failure
      applies_to: "source_failure"
      rule: "N_F=sum_i(F_whole_i); q_failure=N_F/Q. Each included source is one actual complete homogeneous original kit vector including original packaging and upstream transport to store receiving gate, counted once. source_failure is restricted to F responsibility equivalents of the actual complete homogeneous original kit and its matching whole-kit supplier vector only. For those original whole-kit sources i, N_F=sum_i(F_whole_i); never derive F_whole_i from selected components or from waste mass. A split descendant fate that assigns basin/trap/accessory/packaging source vectors separately among S/F/T/O cannot be represented by N_F times the whole-kit vector: environmental inventory vectors are generally not proportional. Before completeness, add a real separate component-source input card for every F component, with its actual original component quantity/property/unit, original component supplier vector, source IDs and linked protocol; preserve each component original amount and vector across S/F/T/O. Do not put component LCI into the complete-kit flow identity or rebuild it with one common scalar fraction. Exclude those component-source portions from source_failure and reconcile all original vector IDs to avoid duplication. Normal complete whole-kit sources remain intact and need no mechanical component split; unknown supplier component vectors/amounts block the split path and completeness."
      inputs:
        - F_whole_i
