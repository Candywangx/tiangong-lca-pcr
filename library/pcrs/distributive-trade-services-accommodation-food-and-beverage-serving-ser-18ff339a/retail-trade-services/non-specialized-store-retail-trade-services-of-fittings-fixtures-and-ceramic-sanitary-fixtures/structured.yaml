    - id: c_asset
      applies_to: "shelf; trolley; terminal"
      rule: "Operating f_new_a_h=e_a_h/L_a with L_a>=E_a=sum_h(e_a_h)>0; retirement f_final_a_h=e_a_h/E_a, replacing all old allocations by delta=f_final_a_h-f_old_a_h. The sole terminal method is corrected actual f_final_a_h=e_a_h/E_a and delta_a_h=f_final_a_h-f_old_a_h for every historical beneficiary-period. R_a=1-sum_h(f_old_a_h) checks sum_h(delta_a_h)=R_a only; it is never an allocation shortcut. Current same-model card=sum current beneficiary f/Q; no cross-model Item(s) summation. Unknown/zero exposure leaves unassigned full package and blocks final attribution."
