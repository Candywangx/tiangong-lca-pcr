    - id: c_transport
      applies_to: "all inventory rows"
      rule: "For each actual trip/segment k, A_s_k=A_trip_k*v_s_trip_k/sum_b(v_b_trip_k) vehicle-km; H_s_k=H_trip_k*v_s_trip_k/sum_b(v_b_trip_k) stationary idle hours. Loaded and empty segments retain actual km and responsible dispatch reservation, never cargo t*km substitution. For already-attributed complete provider services keep supplied raw numerator unchanged; no second capacity fraction. Source-bound compatible transport numerators enter c_completion once. Asset lifecycle transport is not ordinary current-period freight. First obtain U_asset_x, the complete transport source numerator belonging to actual asset_id a, by actual consignment allocation under c_transport; if provider already attributes to that asset retain it without another reserved-volume fraction. Then attribute that asset transport source to every original historical beneficiary-period h exactly once: U_asset_h_x=f_a_h*U_asset_x using the SAME asset a_asset operating/final fractions and lifecycle source version. On lifespan/exposure or transport-vector revision replace each old U_asset_h_x with the new value and post delta_U_asset_h_x=U_asset_h_x_new-U_asset_h_x_old back to the original h/pool. Never charge the whole asset transport to retirement/current Q, multiply another manufacture fraction, or add transport already included in the complete asset/lifetime package. A verified provider value already attributed to h is restored with its own original denominator and retained without another f_a_h. Preserve attribution_level (trip/asset/beneficiary-period) and exact source IDs so no level is applied twice. Additional carton inbound transport follows carton_source_id and the b_carton_stock first-use convention: an actual homogeneous source batch transport vector follows its original carton quantities, all measured as net carton kg at the same original receiving state; only the first-consumed carton portion receives that source once in its first-use pool, measured unused stock carries the unassigned source portion to later use, and unused transfers/returns transfer that same unassigned portion to a named continuing owner. Already-used/reused cartons retain their previously assigned source reference without a new transport charge. Reconcile original carton quantity and assigned/unassigned transport vector portions; do not charge the full new-receipt transport now and copy it again on future consumption. Distinct actual reuse/return transport is a separate event/source, never a duplicate incoming source; transport included in the carton receiving-gate manufacturing vector is QA only and is not added."
      inputs:
        - A_trip_k
        - H_trip_k
        - v_s_trip_k
        - v_b_trip_k
        - responsible_dispatch
        - already_attributed
        - original_denominator
