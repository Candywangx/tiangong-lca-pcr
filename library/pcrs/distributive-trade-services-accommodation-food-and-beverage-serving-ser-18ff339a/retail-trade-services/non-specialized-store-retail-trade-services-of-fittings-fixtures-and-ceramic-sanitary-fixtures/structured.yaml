      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Rule | Applies to | source_ids |\n| --- | --- | --- | --- |\n| a_pool | Declare the prospective same-configuration reporting pool and return follow-up horizon before outcomes are known; retain all failed and zero-sale periods. Q is count of distinct original kit IDs with final-valid complete acceptance at cutoff, including resolved return/resale history only once. Revocation removes that ID even without physical return; financial refund alone does not remove valid acceptance. Resale never duplicates original kit background. Late returns replace the original pool numerator/fates and Q version with actual event dates; do not charge a new pool again. Q=0 is unnormalizable, retain raw totals and aggregate only under the predeclared compatible pool. | all inventory rows | ghg-product-2011 |\n| a_asset | Each shelf, trolley and terminal card binds exactly one evidenced complete homogeneous model/configuration and lifecycle contract boundary; record model and source_vector_id before binding. Different models/contracts require separate bilingual cards/protocol views and sync before completeness; never add unlike Item(s) fractions under one flow. Packages contain manufacture, installation and end-of-life only; operation, repairs, building/fixed lights and consumables are disjoint. Prove no repair or add event-specific atomic repair cards. For asset a and historical beneficiary-period h, e_a_h is shelf reserved m2*h, trolley reserved trolley-hours, or terminal reserved terminal-hours, including stationary idle/closed periods. L_a is expected all-beneficiary lifetime exposure in that SAME unit, E_a=sum all actual historical e_a_h. While operating f_new_a_h=e_a_h/L_a; require L_a>=E_a and L_a>0. On any lifetime revision replace every prior historical f_old with f_new and issue delta=f_new-f_old to the original pool/source version; never restart manufacture. At retirement E_a>0: f_final_a_h=e_a_h/E_a. Always compute delta_a_h=f_final_a_h-f_old_a_h from corrected actual historical exposures and replace every old value. R_a=1-sum_h(f_old_a_h) is QA only: sum_h(delta_a_h)=R_a; never distribute R_a proportionally on top of old fractions, because corrected old exposure proportions may differ. Require sum_h f_final=1 and cumulative assigned fraction<=1. If E_a=0 or unknown preserve full unassigned package/residual and block final attribution until documented actual beneficiaries/exposures are recovered; never divide by zero or erase the asset. Provider-contained terminal carriers are not additional waste outputs; direct terminal net weighing and component reconstruction are exclusive. | all inventory rows | ghg-product-2011 |\n| a_energy | Core electricity is checkout terminal/controller AC only; manual trolley needs no powered handling. Use disjoint directly metered own circuits first; subtract a submeter only from a parent containing it. For shared core circuits time-tag the meter and terminal event log into four disjoint measured kWh pools: E_retail for SKU checkout/return work, E_admin for common terminal administration, E_idle for powered idle and E_fixed for separately measured always-on checkout controller. Reconcile their sum to the included parent. For E_retail use t_b, measured occupied terminal seconds of each actual SKU beneficiary b, including failed/reversed events; multi-SKU common transaction time is split by measured line-handling seconds, and events with no identifiable retail lines enter E_admin. Allocate E_admin/E_idle/E_fixed by r_b, actual prospectively reserved terminal-hours for every SKU beneficiary across the same interval, including closed/zero-sale periods. E_core=E_retail*t_s/sum_b(t_b)+(E_admin+E_idle+E_fixed)*r_s/sum_b(r_b). t and r never mix. A directly evidenced zero-kWh pool contributes zero without evaluating a zero driver ratio; unknown kWh is not such evidence. Positive source pools require known positive driver totals and complete beneficiary schedules; unsupported reservation/zero totals block allocation, not default zero. Lighting/HVAC/network/security remain disjoint support modules. | all inventory rows | ghg-product-2011 |\n\n"
