      markdown: "## 9. Validation Rules\n\n| rule_id | Rule | Applies to | source_ids |\n| --- | --- | --- | --- |\n| v_identity | All unresolved rows require an official direct-read flow with matching direction/type/state, product qualifiers, property/unit chain and compartment (if elementary). Generic mass/count supports do not establish a kit, asset, waste or service identity. Verify supplier LCI boundary and actual kit BOM; no catalogue compliance claim or default mass. | all inventory rows | ghg-product-2011; ikea-bjorkan-kit |\n| v_balance | Reconcile separate kit-count, ceramic/accessory/packaging mass, waste-stock and acceptance ledgers. Waste closing = opening + actual condemnation/packaging removal - measured dispatch; do not correct direct dispatch again. Count is not kg; gross two-package weight is not basin net kg. Weigh actual received kit and components on calibrated scales with tare/state; no unmeasured mass by catalogue subtraction. Unknowns remain unresolved, not zero; original sources, satellite custody records and characterized exchanges must be explicitly identified. | all inventory rows | ghg-product-2011; ikea-bjorkan-kit |\n| v_route | Require pickup receipt proving complete kit handover and no installation/delivery/demonstration. Consumer travel/use/disposal and successful S merchandise manufacturing belong to downstream fixed responsibilities and must be disclosed; this service is not whole-product cradle-to-grave. No avoided-product/recycling credit without a separately reviewed method. Review absence evidence and b_complete source deduplication before any complete-service claim. | all inventory rows | ghg-product-2011; ikea-bjorkan-kit |\n\n"
