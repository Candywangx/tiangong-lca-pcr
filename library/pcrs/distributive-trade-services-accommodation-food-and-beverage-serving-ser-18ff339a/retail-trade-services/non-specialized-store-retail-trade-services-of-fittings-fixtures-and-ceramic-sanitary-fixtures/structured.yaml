    - id: c_completion
      applies_to: "all inventory rows"
      rule: "For each compatible exchange x, q_complete_x=(U_core_x+sum disjoint U_j_x)/Q; U_j_x=u_j_x*d_j. Restore raw original denominators and source versions, remove duplicated source IDs before adding same-unit vectors. Unknown omitted modules prohibit completeness. U_j_x entering this sum is already assigned to the selected original beneficiary/pool h: asset transport must first pass c_transport asset lifecycle f_a_h and version replacement; carton transport must first pass carton-source first-use/unused ownership. Restore provider-normalized values at their recorded attribution_level before any missing allocation, never repeat supplied h attribution or f. Each historical correction replaces that original pool numerator and uses that pool's own final-valid Q, never current retirement Q."
      inputs:
