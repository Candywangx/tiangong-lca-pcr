    - id: c_refrigerant
      applies_to: "all inventory rows"
      rule: "For each actual species/site control volume, source_internal_kg=opening_contained+added_standalone+added_equipment_containers-closing_contained-recovered_export-contained_export, an equipment-to-site net internal-source QA value only, never an outdoor elementary emission. All vessel stocks and import/export events follow b_support; import/export IDs are disjoint, internal_transfer_id contributes no boundary term. Retain as QA for c_refrigerant_air closure; never allocate it as an outdoor emission. Unknown or unreconciled balances block completeness; a signed net internal recovery source is investigated and not turned into a negative elementary flow."
      inputs:
