    - id: c_refrigerant_air
      applies_to: "all inventory rows"
      rule: "Primary absolute mode F_air_kg=sum_k(c_out_k*V_out_k)-sum_k(c_in_k*V_in_k); source_internal_kg=F_air_kg+delta_room_kg+delta_capture_stock_kg+nonair_export_kg-nonair_import_kg is independent species closure QA. Follow b_refrigerant_air same-state interval integration, complete paths, single inlet correction and disjoint stock/export definitions. Only verified actual positive outdoor species flux receives conditioned-zone m2*h allocation under b_support and then /Q once through c_completion; negative/unknown/unclosed cases remain unresolved, not zero or uptake credit. nonair_export_kg and nonair_import_kg are ONLY species kg crossing the site boundary in sorbent/capture/other non-air carriers OUTSIDE the equipment control volume. Explicitly exclude ALL equipment/cylinder/recovery-container imports/exports already counted in added_standalone, added_equipment_containers, recovered_export or contained_export, including actually dispatched recovered-gas cylinders and gas-containing equipment. Preserve equipment_boundary_event_ids and nonair_boundary_event_ids as mutually exclusive sets and reconcile shared source/transfer histories; no event or same species portion enters both ledgers. Obtain each non-air species quantity by exactly one exclusive mode: direct measured species_kg OR measured net_carrier_kg*measured species_mass_fraction for that same actual consignment/state. Retain calibrated mass data, representative composition sampling, method and uncertainty. Whole carrier kg is not species kg; already measured species kg is never multiplied by composition again. Unknown composition/species mass blocks closure and final emission. For this sole primary mode c_out_k and c_in_k MUST be species mass concentration in kg/m3; V_out_k and V_in_k MUST be cumulative actual air volume in m3 over the SAME observed interval and measured temperature/pressure/wet-dry state. Their product is species kg. A raw actual flow rate is not V: integrate actual_flow_rate_m3_s over measured duration_s (or interval-resolved equivalent) to obtain cumulative_actual_m3 before multiplying c. Preserve concentration_raw_unit, volume_raw_unit, raw flow/duration records, and the exact one-time unit conversion. Pure scale conversions such as g to kg or hours to seconds are allowed once. ppm, standard-volume versus actual-volume or other state-dependent conversions cannot be substituted directly: require source-supported validated matching species/state conversion with actual measured conditions and retained conversion_evidence, or block calculation and refer for PCR method review. Never assume density, temperature or pressure."
      inputs:
