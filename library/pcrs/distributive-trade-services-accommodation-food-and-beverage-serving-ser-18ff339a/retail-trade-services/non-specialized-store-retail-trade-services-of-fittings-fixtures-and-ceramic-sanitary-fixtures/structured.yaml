      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual new complete kit at store receiving gate |\n| starting_condition_role | boundary_condition |\n| product_classification_scope | Only ceramic washbasin kit retail subset of 62162 |\n| recursive_input_rule | Do not insert the same pickup service recursively; supplier manufacturing and distinct upstream logistics are separate source-bound products |\n| upstream_dataset_requirement | For each original kit source ID partition its original supplier vector at the same receiving gate into S final successful customer responsibility, F irrecoverable service failure, T explicitly named continuing recipient responsibility and O open stock. S+F+T+O=1 per original source; not fractions of current waste mass. Whole-kit allocation follows its single final fate. For mixed descendant fates require supplier component inventory vectors and source conservation; mass fractions cannot divide an environmental vector. source_failure input carries F original-kit equivalents once, including original packaging and inbound transport. Returns to supplier and unaccepted goods retained externally require signed T owner, destination/state and source ID, otherwise remain O unresolved. source_failure is restricted to F responsibility equivalents of the actual complete homogeneous original kit and its matching whole-kit supplier vector only. For those original whole-kit sources i, N_F=sum_i(F_whole_i); never derive F_whole_i from selected components or from waste mass. A split descendant fate that assigns basin/trap/accessory/packaging source vectors separately among S/F/T/O cannot be represented by N_F times the whole-kit vector: environmental inventory vectors are generally not proportional. Before completeness, add a real separate component-source input card for every F component, with its actual original component quantity/property/unit, original component supplier vector, source IDs and linked protocol; preserve each component original amount and vector across S/F/T/O. Do not put component LCI into the complete-kit flow identity or rebuild it with one common scalar fraction. Exclude those component-source portions from source_failure and reconcile all original vector IDs to avoid duplication. Normal complete whole-kit sources remain intact and need no mechanical component split; unknown supplier component vectors/amounts block the split path and completeness. |\n| disclosure | Before complete-service use add a site-specific building/facilities module covering structure/fitout, fixed lighting/fans/HVAC, operation including fuel/refrigerant/water, cleaning and wastewater, maintenance and end-of-life. Name each real atomic exchange or an evidenced complete contracted service package with signed scope. Survey equipment, fuel bills, refrigerant logs, drains and cleaning contracts for presence/absence; unknown blocks completeness. Direct subdivision first. Otherwise use the exact source-to-driver mapping in b_support and b_support_drivers, including their separate active and idle/availability pools and every beneficiary. No downstream choice of another driver is authorized; unsupported observations require PCR revision. Do not sum incompatible drivers. For each module retain raw numerator exchange vector U_j, original denominator d_j, site/pool/time/source IDs, background boundary and version. Recover normalized module u_j as U_j=u_j*d_j. Remove source-ID overlaps, combine compatible same-flow/property/unit raw core and module numerators once, divide common Q once. Downstream modeller owns this completion, not a silent exclusion; without it label partial core and prohibit whole-store comparison. |\n\n| rule_id | Rule | Applies to | source_ids |\n| --- | --- | --- | --- |\n| b_gate | Begin at actual store receiving gate, end at final-valid complete customer pickup and actual residual dispatch. Included core: handling/checkout electricity, extra corrugated protection, original failed-kit manufacturing responsibility, actual waste dispatch and lifetime shelf/manual trolley/checkout equipment packages. The building/facilities module is mandatory for a complete retail service; b_complete fixes its method. Merchandise successfully retained by the customer carries its own original production/packaging/inbound transport background in the downstream product system, outside this incremental service. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_ownership | For each original kit source ID partition its original supplier vector at the same receiving gate into S final successful customer responsibility, F irrecoverable service failure, T explicitly named continuing recipient responsibility and O open stock. S+F+T+O=1 per original source; not fractions of current waste mass. Whole-kit allocation follows its single final fate. For mixed descendant fates require supplier component inventory vectors and source conservation; mass fractions cannot divide an environmental vector. source_failure input carries F original-kit equivalents once, including original packaging and inbound transport. Returns to supplier and unaccepted goods retained externally require signed T owner, destination/state and source ID, otherwise remain O unresolved. source_failure is restricted to F responsibility equivalents of the actual complete homogeneous original kit and its matching whole-kit supplier vector only. For those original whole-kit sources i, N_F=sum_i(F_whole_i); never derive F_whole_i from selected components or from waste mass. A split descendant fate that assigns basin/trap/accessory/packaging source vectors separately among S/F/T/O cannot be represented by N_F times the whole-kit vector: environmental inventory vectors are generally not proportional. Before completeness, add a real separate component-source input card for every F component, with its actual original component quantity/property/unit, original component supplier vector, source IDs and linked protocol; preserve each component original amount and vector across S/F/T/O. Do not put component LCI into the complete-kit flow identity or rebuild it with one common scalar fraction. Exclude those component-source portions from source_failure and reconcile all original vector IDs to avoid duplication. Normal complete whole-kit sources remain intact and need no mechanical component split; unknown supplier component vectors/amounts block the split path and completeness. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_physical | Use a goods-only physical stock ledger: closing goods = opening goods + receipts + physical customer returns - all gross customer handovers - physical supplier transfers - internal condemnation into held waste - demonstrator transfer. All gross handovers include never-accepted events exactly once. Condemnation is an internal goods-to-waste change; waste dispatch removes held waste later and never subtracts goods again. Damaged goods retained externally are not store waste. Background transfers do not create physical movements. Permanent demonstrators retain the SAME original source under T in the asset ledger; this route requires none or explicit asset extension. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_complete | Before complete-service use add a site-specific building/facilities module covering structure/fitout, fixed lighting/fans/HVAC, operation including fuel/refrigerant/water, cleaning and wastewater, maintenance and end-of-life. Name each real atomic exchange or an evidenced complete contracted service package with signed scope. Survey equipment, fuel bills, refrigerant logs, drains and cleaning contracts for presence/absence; unknown blocks completeness. Direct subdivision first. Otherwise use the exact source-to-driver mapping in b_support and b_support_drivers, including their separate active and idle/availability pools and every beneficiary. No downstream choice of another driver is authorized; unsupported observations require PCR revision. Do not sum incompatible drivers. For each module retain raw numerator exchange vector U_j, original denominator d_j, site/pool/time/source IDs, background boundary and version. Recover normalized module u_j as U_j=u_j*d_j. Remove source-ID overlaps, combine compatible same-flow/property/unit raw core and module numerators once, divide common Q once. Downstream modeller owns this completion, not a silent exclusion; without it label partial core and prohibit whole-store comparison. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_states | No kit unpacking for sale except inspection that returns the complete original kit; no extra plastic wrap, tape, printed receipt or powered handling is permitted without named atomic extension. Actual broken ceramic and original mixed accessories/packaging collected together may be one real measured mixed sanitary-kit waste carrier; separately collected carton uses its own card and must be removed from that carrier boundary. Original package manufacturing is in the original supplier vector, never again in extra_carton. Additional actual exchanges require bilingual cards/protocols/sync before completeness. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_support | Facilities completion includes necessary ICT/network, payment processing, security and administration, not just the shop shell. For each actual provider retain signed package scope and atomic source IDs, activity/availability unit, original denominator, operational utilities, capital, maintenance and transport/end-of-life inclusions. A verified provider-already-attributed service numerator is retained without a second driver allocation. Otherwise subdivide source numerators: site structure/fitout and fixed lighting use beneficiary occupied/reserved floor m2*h; HVAC energy and refrigerant external leakage use conditioned-zone m2*h; cleaning materials/water/effluent use measured beneficiary cleaned m2 per event; shared staff sanitary-water pools use logged beneficiary staff person-hours. Structure capital uses the same historical-exposure retirement/replacement method as a_asset with floor m2*h. Direct zone meters supersede shared allocation. All floor/cleaned-area/person-hour denominators include every actual beneficiary, failed/closed periods as applicable, and must be known positive for positive sources. Fuel consumption is measured by named actual fuel receipts/opening/closing stock and calibrated meter; volume converts only with actual temperature/density and, for MJ, actual LHV. For each refrigerant species define one site control volume containing ALL actual equipment circuits, storage cylinders and recovery containers. Opening/closing contained inventory includes every such vessel in kg. Added mass is the sum of ALL boundary imports: measured standalone recharge/cylinder imports plus measured charge arriving inside new/transferred equipment or other containers, with disjoint import event IDs. recovered_export is recovered refrigerant physically dispatched across the site boundary; contained_export is disjoint remaining charge leaving inside whole equipment/other containers, never the same recovered dispatch. Internal transfers between circuits/storage/recovery vessels are neither imports nor exports. Equipment net internal species source QA kg = opening_contained+added_standalone+added_equipment_containers-closing_contained-recovered_export-contained_export. This equipment deficit is not an outdoor elementary flow; b_refrigerant_air alone defines the outdoor-air method. Retained recovery remains closing inventory; whole-equipment contained export is not a leak. Unknown vessel inventories/imports/exports are unresolved, never zero; negative or unreconciled balances require investigation with uncertainty and prohibit final emission or uptake claims. Add actual species cards and full source fields before complete use. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_support_drivers | For unallocated ICT services separate variable compute source pools (measured beneficiary CPU-seconds), variable network pools (actual transmitted beneficiary bytes), payment-processing active pools (logged payment-terminal occupied seconds including refused/reversed attempts), and each fixed availability pool (prospectively reserved beneficiary device/port-hours); do not add bytes, CPU-seconds or hours into one driver. Security camera/alarm complete packages use protected beneficiary floor m2*h including closure. Administration active source pools use recorded beneficiary task person-hours, while common idle/availability administration pools use predeclared reserved staff-capacity hours by beneficiary including zero-sale periods. Reconcile each same-unit source pool and all beneficiaries before q_s=U_pool*d_s/sum_b(d_b). Direct tasks and provider-included utilities/capital are not added again. Cloud/network/payment packages may remain complete contracted services when actual signed scope is evidenced; unknown provider attribution or absent exposure/positive denominator blocks completeness. Survey invoices, service accounts, network/terminal/security equipment, task times and signed absence records at each reporting interval; a missing invoice is not evidence of absence. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_transport | Original kit background reaches the actual store receiving gate including all actual domestic/cross-border upstream legs. Extra carton and asset inbound transport must be either explicitly included once in the verified manufacturing/lifetime provider vector to that gate or added as disjoint completion transport modules; asset retirement transport is either inside its end-of-life package or a separately source-bound lifetime module, never both. Waste modules must state collection/transport/treatment start and end gates and actual mixed-carrier acceptance. For every added transport service record vehicle/model, route segment/trip, loaded and empty vehicle-km, stationary idle hours, packaged consignment reserved m3 for all beneficiaries and the dispatch reservation responsible for empty/repositioning/idle segments. Where the provider already attributes actual consignment activity with proven loaded/empty/idle scope, keep its raw numerator and allocation unchanged. Otherwise use actual vehicle-km pools A_trip_k and idle-hour pools H_trip_k separately, allocate each by contemporaneous reserved cubic volume v_b_trip_k/sum_b(v_b_trip_k), retain the initiating dispatch reservation on associated empty legs and stationary idle. Loaded mass in t and distance give supplementary t*km QA only, never substitute zero t*km for nonzero empty travel. Unassigned empty or idle activity, unknown capacity reservation or incomplete provider coverage blocks completeness. For separate movement and idle services prove vehicle-km provider scope excludes the idle-hour fuel/operation represented in H; if it already includes actual idle, omit the extra H service and retain the complete provider numerator. Unknown overlap blocks completeness. Do not model carrier fuel/maintenance/capital again if the evidenced complete transport service includes them. Asset lifecycle transport is not ordinary current-period freight. First obtain U_asset_x, the complete transport source numerator belonging to actual asset_id a, by actual consignment allocation under c_transport; if provider already attributes to that asset retain it without another reserved-volume fraction. Then attribute that asset transport source to every original historical beneficiary-period h exactly once: U_asset_h_x=f_a_h*U_asset_x using the SAME asset a_asset operating/final fractions and lifecycle source version. On lifespan/exposure or transport-vector revision replace each old U_asset_h_x with the new value and post delta_U_asset_h_x=U_asset_h_x_new-U_asset_h_x_old back to the original h/pool. Never charge the whole asset transport to retirement/current Q, multiply another manufacture fraction, or add transport already included in the complete asset/lifetime package. A verified provider value already attributed to h is restored with its own original denominator and retained without another f_a_h. Preserve attribution_level (trip/asset/beneficiary-period) and exact source IDs so no level is applied twice. Additional carton inbound transport follows carton_source_id and the b_carton_stock first-use convention: an actual homogeneous source batch transport vector follows its original carton quantities, all measured as net carton kg at the same original receiving state; only the first-consumed carton portion receives that source once in its first-use pool, measured unused stock carries the unassigned source portion to later use, and unused transfers/returns transfer that same unassigned portion to a named continuing owner. Already-used/reused cartons retain their previously assigned source reference without a new transport charge. Reconcile original carton quantity and assigned/unassigned transport vector portions; do not charge the full new-receipt transport now and copy it again on future consumption. Distinct actual reuse/return transport is a separate event/source, never a duplicate incoming source; transport included in the carton receiving-gate manufacturing vector is QA only and is not added. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_carton_stock | C_in counts first consumption of extra cartons only: opening_unused_kg+received_new_kg-closing_unused_kg-transfer_unused_kg-return_unused_kg. Track carton_source_id and first_use_event. opening_used_kg and all previously charged used/reusable cartons never enter C_in; their reuse transfers the SAME recorded manufacturing/source responsibility without a new production input. Unused transfers/returns carry their untouched original source to a named recipient; unused closing stock retains its source for a later first use. Any used carton retained into later periods carries its already charged source IDs and exact old pool/version; it is not charged again on reuse. The declared first-use allocation keeps the single manufacturing charge in its original first-use pool; later reuse carries the traceable already-assigned source reference, not a copied vector or another production input, and claims no avoided manufacture credit. Actual cleaning/repair/transport for reuse needs disjoint modules and fixed transport method. Used-carton customer handover, retained stock and waste dispatch are mutually exclusive destination states; replace old state/version on movement, not another manufacturing charge. Unknown prior use/source history blocks C_in and completeness. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_mixed_acceptance | broken_kit applies only when an actual recipient contract explicitly accepts the observed ceramic shards together with the actual included metal/polymer/rubber accessories and original packaging and names the allowed condition/composition and complete downstream treatment scope. Preserve signed acceptance, carrier/source IDs, actual net mass, destination and treatment dataset showing treatment of every admitted constituent; licensing or photos alone are insufficient. Separate carton already in carton_waste is excluded. A mixed-carrier treatment/transport service included in the contract must not be duplicated by material treatment or route modules. If recipient separates constituents, retain its evidenced full separation/treatment package or add disjoint actual downstream component paths whose measured masses reconcile to the same carrier; do not apply whole-carrier kg to every constituent process. Absent contract/matching treatment blocks this carrier and completeness; retain measured held waste, acquire valid receiver/scope or extend bilingual atomic cards before use. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n| b_refrigerant_air | Use one primary outdoor-air method only: actual absolute species concentration and actual air-volume measurements at EVERY site outdoor outlet and inlet over the full reporting pool. F_air_kg=sum_k(c_out_k*V_out_k)-sum_k(c_in_k*V_in_k), integrated by observed sampling intervals with concentration and volume on the same measured temperature/pressure/wet-dry basis. Include all mechanical and fugitive boundary paths; unmeasured paths or incomplete coverage block outdoor emission and complete-service claims. Absolute inlet background is removed once; already differential or blank-corrected readings cannot enter this absolute mode or receive another subtraction. They require a separately reviewed mutually exclusive method before use. Retain actual start/end room-air species stock, sorbed/filter/capture species stocks outside the equipment control volume, and actual species kg in non-air boundary carriers. Check source_internal_kg=F_air_kg+delta_room_kg+delta_capture_stock_kg+nonair_export_kg-nonair_import_kg with uncertainty. Internal capture/recovery transfers cancel by shared event ID; recovery inside equipment/storage/recovery-container inventory is not also capture export. Capture still retained is stock change; capture exported is a non-air export once, not both. Thus condensation/capture/room retention cannot default zero or all equipment losses be assumed outdoors. Signed negative flux is retained for investigation, never clamped zero or used as an uptake credit; actual uptake needs a separately reviewed matching input identity. Prove no refrigerant system by complete facility/equipment/service inspection and signed absence evidence; unknown system presence is not zero. nonair_export_kg and nonair_import_kg are ONLY species kg crossing the site boundary in sorbent/capture/other non-air carriers OUTSIDE the equipment control volume. Explicitly exclude ALL equipment/cylinder/recovery-container imports/exports already counted in added_standalone, added_equipment_containers, recovered_export or contained_export, including actually dispatched recovered-gas cylinders and gas-containing equipment. Preserve equipment_boundary_event_ids and nonair_boundary_event_ids as mutually exclusive sets and reconcile shared source/transfer histories; no event or same species portion enters both ledgers. Obtain each non-air species quantity by exactly one exclusive mode: direct measured species_kg OR measured net_carrier_kg*measured species_mass_fraction for that same actual consignment/state. Retain calibrated mass data, representative composition sampling, method and uncertainty. Whole carrier kg is not species kg; already measured species kg is never multiplied by composition again. Unknown composition/species mass blocks closure and final emission. For this sole primary mode c_out_k and c_in_k MUST be species mass concentration in kg/m3; V_out_k and V_in_k MUST be cumulative actual air volume in m3 over the SAME observed interval and measured temperature/pressure/wet-dry state. Their product is species kg. A raw actual flow rate is not V: integrate actual_flow_rate_m3_s over measured duration_s (or interval-resolved equivalent) to obtain cumulative_actual_m3 before multiplying c. Preserve concentration_raw_unit, volume_raw_unit, raw flow/duration records, and the exact one-time unit conversion. Pure scale conversions such as g to kg or hours to seconds are allowed once. ppm, standard-volume versus actual-volume or other state-dependent conversions cannot be substituted directly: require source-supported validated matching species/state conversion with actual measured conditions and retained conversion_evidence, or block calculation and refer for PCR method review. Never assume density, temperature or pressure. | all inventory rows | jrc-retail-2013; ghg-product-2011 |\n\n"
