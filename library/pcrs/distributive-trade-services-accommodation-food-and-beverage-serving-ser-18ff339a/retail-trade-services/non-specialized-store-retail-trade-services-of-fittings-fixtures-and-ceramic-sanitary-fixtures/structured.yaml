    - id: c_support
      applies_to: "all inventory rows"
      rule: "For each unallocated same-unit source pool x, U_s_x=U_pool_x*d_s_x/sum_b(d_b_x). Use the exact source-to-driver mapping b_support/b_support_drivers: floor/conditioned/protected m2*h, cleaned m2, staff/admin person-hours, CPU-seconds, bytes, payment seconds or reserved device/port/staff hours as separately named. Never sum these driver dimensions. Provider-already-attributed U_s_x is retained. Each module vector then enters c_completion."
      inputs:
