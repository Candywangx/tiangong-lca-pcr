  data_quality_requirements:
    - id: q_bom
      applies_to: "source_failure; service"
      requirement: "Verify actual same kit configuration and original complete package/background source; included tool/trap not independently manufactured twice. source_failure is restricted to F responsibility equivalents of the actual complete homogeneous original kit and its matching whole-kit supplier vector only. For those original whole-kit sources i, N_F=sum_i(F_whole_i); never derive F_whole_i from selected components or from waste mass. A split descendant fate that assigns basin/trap/accessory/packaging source vectors separately among S/F/T/O cannot be represented by N_F times the whole-kit vector: environmental inventory vectors are generally not proportional. Before completeness, add a real separate component-source input card for every F component, with its actual original component quantity/property/unit, original component supplier vector, source IDs and linked protocol; preserve each component original amount and vector across S/F/T/O. Do not put component LCI into the complete-kit flow identity or rebuild it with one common scalar fraction. Exclude those component-source portions from source_failure and reconcile all original vector IDs to avoid duplication. Normal complete whole-kit sources remain intact and need no mechanical component split; unknown supplier component vectors/amounts block the split path and completeness."
      evidence: "Actual lot/component inventory and supplier boundary; whole-kit source/quantity binding or component original quantity/vector and explicit added-card conservation"
    - id: q_complete
      applies_to: "all inventory rows"
      requirement: "All quantity inputs must be known with coverage and uncertainty, route absence proved, pools and denominator reconciled; complete-service use additionally requires b_complete and c_completion with new bilingual atomic modules."
      evidence: "Meter/scale calibration, recipient records, all-beneficiary and module source ledger"
    - id: q_refrigerant
      applies_to: "all inventory rows"
      requirement: "For any refrigerant completion module inspect the full equipment/cylinder/recovery-container register and physical inventory, weigh all charge arriving inside equipment/containers as well as separate imports, and reconcile unique boundary event IDs. Every recovered dispatch is excluded from contained_export; internal moves appear only in vessel reconciliation. Missing stocks/events or negative/unclosed balances block completion pending investigation and uncertainty review; no default zero or uptake credit."
      evidence: "Complete vessel register, calibrated species kg inventory, equipment delivery charge evidence, unique import/export ledger and balance uncertainty"
    - id: q_refrigerant_air
      applies_to: "all inventory rows"
      requirement: "Equipment charge deficit alone cannot establish an outdoor-air elementary flow. Require all actual site inlet/outlet/fugitive path species mass measurements and indoor/capture/non-air stock/export closure with shared transfer IDs and uncertainty. Unverified capture/room storage is never zero; differential or corrected readings are excluded from the absolute mode. No-system absence needs complete inspection evidence, not missing purchase invoices. nonair_export_kg and nonair_import_kg are ONLY species kg crossing the site boundary in sorbent/capture/other non-air carriers OUTSIDE the equipment control volume. Explicitly exclude ALL equipment/cylinder/recovery-container imports/exports already counted in added_standalone, added_equipment_containers, recovered_export or contained_export, including actually dispatched recovered-gas cylinders and gas-containing equipment. Preserve equipment_boundary_event_ids and nonair_boundary_event_ids as mutually exclusive sets and reconcile shared source/transfer histories; no event or same species portion enters both ledgers. Obtain each non-air species quantity by exactly one exclusive mode: direct measured species_kg OR measured net_carrier_kg*measured species_mass_fraction for that same actual consignment/state. Retain calibrated mass data, representative composition sampling, method and uncertainty. Whole carrier kg is not species kg; already measured species kg is never multiplied by composition again. Unknown composition/species mass blocks closure and final emission."
      evidence: "Calibrated species/airflow raw data, full-path/state/time coverage, room/capture inventory and carrier-species records, closure/uncertainty and signed absence checks; mutually exclusive equipment/non-air boundary event sets and direct-species or net-carrier/composition measurement evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "All unresolved rows require an official direct-read flow with matching direction/type/state, product qualifiers, property/unit chain and compartment (if elementary). Generic mass/count supports do not establish a kit, asset, waste or service identity. Verify supplier LCI boundary and actual kit BOM; no catalogue compliance claim or default mass."
    source_ids:
      - ghg-product-2011
      - ikea-bjorkan-kit
  - rule_id: v_balance
    applies_to: "all inventory rows"
    rule: "Reconcile separate kit-count, ceramic/accessory/packaging mass, waste-stock and acceptance ledgers. Waste closing = opening + actual condemnation/packaging removal - measured dispatch; do not correct direct dispatch again. Count is not kg; gross two-package weight is not basin net kg. Weigh actual received kit and components on calibrated scales with tare/state; no unmeasured mass by catalogue subtraction. Unknowns remain unresolved, not zero; original sources, satellite custody records and characterized exchanges must be explicitly identified."
    source_ids:
      - ghg-product-2011
      - ikea-bjorkan-kit
  - rule_id: v_route
    applies_to: "all inventory rows"
    rule: "Require pickup receipt proving complete kit handover and no installation/delivery/demonstration. Consumer travel/use/disposal and successful S merchandise manufacturing belong to downstream fixed responsibilities and must be disclosed; this service is not whole-product cradle-to-grave. No avoided-product/recycling credit without a separately reviewed method. Review absence evidence and b_complete source deduplication before any complete-service claim."
    source_ids:
      - ghg-product-2011
      - ikea-bjorkan-kit
published_dataset_profile:
  dataset_role: "Candidate incremental retail service core"
  downstream_use: "secondary_dataset; background_dataset"
