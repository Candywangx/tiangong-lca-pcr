    - row_id: internal_transfer_kit
      completion_condition: Bind intact sealed full-kit Product transfer state with count property/unit; prove named T custody/asset and SAME original source vector; later activation requires separate route extension.
    - row_id: intact_kit_waste
      completion_condition: Bind intact complete sealed whole-kit Waste output with Mass/kg, actual direct net consignment weighing, all constituent receiver acceptance and matching full treatment; incomplete/opened devices require separate state-specific cards.
