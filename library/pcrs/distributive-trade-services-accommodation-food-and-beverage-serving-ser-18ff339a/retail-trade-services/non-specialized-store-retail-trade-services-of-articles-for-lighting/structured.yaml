      elementary:
        []
allocation_rules:
  - rule_id: a_pool
    applies_to: "all inventory rows"
    rule: "Declare the observation horizon, SKU/configuration and beneficiary pools before measuring. Retain closed, idle, failed and zero-sale periods in the same configuration pool; carry their raw numerators forward under source IDs. An entirely zero-output pool remains unnormalizable with raw totals disclosed. Late returns replace both numerator fate/background and final-valid Q in the original version; never charge a subsequent resale pool again. No recycling or avoided-sale credit is assumed."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: a_meters
    applies_to: "bench_electricity"
    rule: "Prefer dedicated meters and direct event subdivision. Where the bench serves multiple products, directly measured test-event energy goes to its original item pool. Allocate remaining measured idle/standby energy by prospectively recorded reserved bench-hours across every actual beneficiary, including closed-hour reservations. Sum allocated amounts equals the full meter total. Positive known all-beneficiary drivers and containment are mandatory; unknown or zero total drivers block the result."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: a_lifetime
    applies_to: "demo_lamp_input; demo_bulb_input; demo_lamp_waste; demo_bulb_waste"
    rule: "Maintain one persistent ledger per actual asset including all periods and beneficiaries. Exposure e_ap is installed reserved hours including idle/off/closed periods attributable to beneficiary p. Expected total lifetime exposure L_a comes from dated purchase, condition, operating and retirement evidence, not advertised bulb life. Versioned responsibility f_ap=e_ap/L_a; cumulative fractions never exceed1. Revising L_a replaces every prior beneficiary allocation and posts signed differences to those original pools, never restarts manufacture. At actual retirement set L_a=sum actual lifetime exposures and reconcile final residual across all original beneficiaries. Terminal carrier responsibility uses final f_ap once, with no second manufacture fraction. Unknown life/exposure or retirement with no positive lifetime driver blocks completeness."
    source_ids:
      - ghg-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_sale
      process_id: "sale"
      flow_role: "retail_service"
      record_type: "Custody and acceptance event ledger"
      raw_fields: "pool_id; version; original_item_id; SKU; supplier_revision; original_receipt_id; pack_BOM_id; opening_stock; received; physical_handover; physical_return; internal_transfer; demo_conversion; supplier_dispatch; local_waste_dispatch; external_retention; closing_stock; acceptance_id; acceptance_status; revocation_event_date; financial_only_flag; cutoff; correction_parent; original_item_id; final_acceptance_status; cutoff; physical_event_ledger; opening_stock; receipts; physical_returns; physical_handovers; supplier_dispatch; local_waste_dispatch; demo_conversion; net_internal_transfers; goods_opening_count; receipts_count; physical_returns_count; physical_handovers_count; supplier_goods_dispatch_count; goods_to_residue_count; demo_conversion_count; net_internal_transfers_count; goods_closing_count; held_waste_opening_kg; waste_generated_kg; waste_dispatched_kg; held_waste_closing_kg"
      collection_method: "Scan each original ID at every custody event; supplier pack list and visual sealed-pack inspection; signed acceptance and returns review. Keep physical counts independent of final service status. Aggregation method: c_accept; count distinct final-valid original IDs once; all physical events reconcile to stock; no subtraction of revocations a second time. The appended stable fields are the formula raw or verified derived quantities; retain verification/allocation status and do not equate unverified with zero. Original-ID goods count and waste-carrier kg are separate; residue conversion removes goods count, waste dispatch removes held-waste kg only."
      unit: "Item(s)"
      frequency: "Each event and cutoff correction"
      temporal_coverage: "Full declared horizon and later known corrections"
      site_scope: "One store, SKU and configuration pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dated scans, supplier BOM, acceptance and return evidence"
    - protocol_id: cp_bench
      process_id: "bench"
      flow_role: "bench_electricity"
      record_type: "Plug-meter and event reservation log"
      raw_fields: "pool_id; version; source_event_id; meter_id; calibration; opening_kWh; closing_kWh; gap_kWh; event_kWh; tested_original_id; energized_start_end; measured_power; reservation_hours_each_beneficiary; idle_hours; closed_hours; parent_meter_id; containment_map; voltage; provider_id; supply_boundary; opening_kWh; closing_kWh; verified_gap_kWh; direct_event_kWh_all; reserved_hours_all; Q"
      collection_method: "Calibrated plug energy meter with interval logging; identify actual lamp and bulb and compatibility; capture actual test energy including failed tests and standby. Reconcile register total, event energies and gaps; investigate signed negative differences without zero clamp. Aggregation method: c_energy; raw meter total first, direct events then residual reservation allocation, MJ conversion then /Q once. The appended stable fields are the formula raw or verified derived quantities; retain verification/allocation status and do not equate unverified with zero."
      unit: "kWh; h; W"
      frequency: "Continuous intervals plus every test"
      temporal_coverage: "Full pool including closed and idle"
      site_scope: "Actual bench plug and all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, topology, raw logs and all-beneficiary reservations"
    - protocol_id: cp_assets
      process_id: "bench"
      flow_role: "demo_lamp_input; demo_bulb_input"
      record_type: "Persistent asset lifetime ledger"
      raw_fields: "asset_id; model; supplier_revision; full_BOM; provider_id; provider_scope; original_purchase; delivery; installation_date; installed_reserved_hours_by_period_beneficiary; expected_lifetime_exposure; life_evidence; retirement_date; lifetime_version; previous_allocations; replacement_deltas; residual; condition; repair_event_id; asset_id; e_ap_all; L_a; lifetime_version; previous_allocations; Q"
      collection_method: "Trace each actual whole demonstrator and each separate bulb from supplier evidence through installation, actual reserve-time observation and retirement; collect supplier full actual BOM and disjoint provider stages. Revisions retain and replace all prior allocations. Aggregation method: c_assets; use exposure/lifetime fractions once, retain acquisition/retirement stock only as control evidence. The appended stable fields are the formula raw or verified derived quantities; retain verification/allocation status and do not equate unverified with zero."
      unit: "Item(s); h"
      frequency: "Each event; interval exposure; each revision"
      temporal_coverage: "Entire asset life across all periods"
      site_scope: "All actual beneficiaries, not only this SKU"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier complete BOM, provider contract, logs, retirement and correction receipts"
    - protocol_id: cp_failure
      process_id: "failure"
      flow_role: "failed_background; supplier_sealed; supplier_opened; retained_sealed; retained_opened; stock_lamp_waste; carton_waste"
      record_type: "Original source, fate and dispatch ledger"
      raw_fields: "pool_id; source_event_id; original_item_id; receiving_background_id; original_B_j; B_sj; B_fj; B_oj; B_tj; responsibility_signoff; recipient; physical_state; sealed_opened; complete_BOM_check; lamp_present; bulb_removed; supplier_transfer_count; external_retained_count; waste_consignment; net_scale_kg; gross_kg; tare_kg; scale_calibration; carton_BOM; dry_state; opening_waste_stock; generated; closing_waste_stock; treatment_provider; included_transport; correction_version; original_background_id; B_j; B_sj; B_fj; B_oj; B_tj; owner_signoff; original_item_id; physical_event_id; recipient; state; measurement_mode; consignment_id; gross_kg; tare_kg; net_kg; carrier_state; Q; source_kind; source_asset_id; packaging_source_id; W_stock_lamp; W_stock_carton; W_demo_carton_a; f_ap_version; lifetime_version; condition_status; presence_absence_evidence"
      collection_method: "Link actual original received IDs to each final fate and signed continuing background owner; direct net weigh each local dispatch. Record externally retained/supplier goods physically and background responsibility independently. Verify complete-device/carton state before selecting the card. Aggregation method: c_background; c_transfers; c_waste. Dispatch net kg is the output; opening+generated-dispatched=closing is a separate check. No production burden twice for the same original item or packaging. The appended stable fields are the formula raw or verified derived quantities; retain verification/allocation status and do not equate unverified with zero. Split original packaging disposal by stock/demo source; demo carton and other original packaging carrier treatment follows its original asset lifetime fraction once, replacing every old portion at revision."
      unit: "Item(s); kg"
      frequency: "Each fate/consignment and revision"
      temporal_coverage: "All failures including zero-sale periods"
      site_scope: "Actual recipients, store and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original receipt BOM/background, signed fate/owner, scale and transfer/treatment receipts"
    - protocol_id: cp_retirement
      process_id: "retirement"
      flow_role: "demo_lamp_waste; demo_bulb_waste"
      record_type: "Asset terminal carrier ledger"
      raw_fields: "asset_id; terminal_event_id; model; state; complete_device; removed_bulb_id; removed_component_ids; measurement_mode; direct_net_kg; BOM_component_net_kg; gross_kg; tare_kg; scale_calibration; final_lifetime_exposure; final_f_ap; owner_pool_ids; provider_id; provider_scope; duplicate_source_keys; measurement_mode; W_a; component_net_kg; final_f_ap; lifetime_version; Q"
      collection_method: "Calibrated direct whole-device net weighing excluding the removed bulb, or exclusive complete-component reconstruction; whole bulb separately weighed. Confirm provider does not already include terminal handling inside an input package. Aggregation method: c_terminal; actual net carrier * final lifetime responsibility once, /Q once; final revisions replace all old versions. The appended stable fields are the formula raw or verified derived quantities; retain verification/allocation status and do not equate unverified with zero."
      unit: "kg; h"
      frequency: "Each retirement and final life correction"
      temporal_coverage: "Whole actual asset life"
      site_scope: "All original beneficiary pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/BOM evidence, asset linkage, final fractions and provider acceptance"
    - protocol_id: cp_completion
      process_id: "sale"
      flow_role: "all inventory rows"
      record_type: "Mandatory external completion module ledger"
      raw_fields: "module_id; pool_id; version; source_event_id; original_denominator; normalized_flag; exchange_id; property; unit; raw_total; allocated_total; source_BOM; supplier_scope; meter_topology; main_kWh; contained_submeter_kWh; independent_meter_kWh; all_beneficiary_area_hours; reserved_operating_hours; stationary_idle_hours; checkout_minutes; cleaned_area; supply_water_kg; formula_source_kg; cloth_kg; actual_effluent_volume; effluent_density; solid_carrier_kg; route_mass_t; loaded_km; empty_vehicle_km; vehicle_capacity; provider_empty_scope; asset_exposure; lifetime_evidence; terminal_mass; completion_status; normalized_flag; normalized_value; original_denominator; raw_total; allocation_status; causal_fraction; source_event_keys; exchange_identity; property; unit; corrected_Q; condition_status; site_absence_records; no_HVAC; no_refrigerant_circuit; no_combustion; no_powered_internal_handling; cleaning_formulation_id; source_formula_kg_unused; source_formula_kg_used; source_formula_kg_spilled; source_formula_kg_in_wipe; source_formula_kg_in_container; source_formula_kg_in_effluent; source_formula_kg_still_open_used; used_destination_reclassification_version; container_whole_terminal_net_kg; container_retained_formulation_source_kg; detergent_packaging_BOM; wipe_dry_input_kg; wipe_whole_terminal_kg; effluent_mode; effluent_temperature; trip_id; full_trip_provider_scope; loaded_km; empty_vehicle_km; moving_h; stationary_idle_h; fuel_L; fuel_density; fuel_LHV; segment_id; beneficiary_id_b; reserved_volume_p_r_s_m3; moving_h_r_s; idle_h_r_s; empty_segment_reservation_evidence; d_pr_all_b; f_pr_all_b; provider_allocation_status; provider_attributed_numerator; original_packaging_asset_id; f_ap_version"
      collection_method: "Execute every fixed admission and method in b_completion. Cleaning allows only whole effluent direct net kg OR measured V*rho, mutually exclusive; reconstruction is prohibited. All extra atomic rows and actual BOMs require bilingual projection; obtain full-period absence evidence for site combustion, refrigerant circuit, mechanical HVAC and powered internal handling; unknown fails. Full-trip transport retains trip_id, segment_id, every beneficiary_id_b, reserved_volume_p_r_s_m3, moving_h_r_s and actual idle_h_r_s; preserve actual empty-segment reservation evidence, actual fuel/provider coverage and provider_allocation_status. Calculate d_pr and f_pr within each trip r exactly as b_completion; never sum the denominator across trips or reapply f_pr to an already provider-attributed amount. Unknown coverage or zero same-trip all-beneficiary driver total blocks. Record original formulation-source kg in container/effluent/wipe/spill/unused/still-open-used destinations disjointly; later used-status reclassification replaces the same source kg. Directly measure the actual whole container plus retained formulation terminal carrier net kg. Demo-origin original packaging disposal uses original asset version fraction once and replaces all old portions. Restore actual original denominators under c_completion, deduplicate and add only identical exchange/property/unit numerators then divide common Q once."
      unit: "row-specific original units"
      frequency: "Each module interval/event and correction"
      temporal_coverage: "Same declared service pool; full asset lives"
      site_scope: "Entire store and actual linked providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete named module receipts, raw activity, boundary reconciliation and atomic bilingual cards"
  calculation_rules:
    - id: c_accept
      applies_to: "retail_service"
      rule: "Q=count(distinct original_item_id with final-valid accepted sealed-pack status at the corrected cutoff). Do not subtract revocations again. goods_closing_count=goods_opening_count+receipts_count+physical_returns_count-physical_handovers_count-supplier_goods_dispatch_count-goods_to_residue_count-demo_conversion_count+net_internal_transfers_count. Remove each original item count from goods stock when converted to residue; held waste has its own carrier-kg stock and later waste dispatch does not subtract goods count again. external_retention is a subset fate of earlier physical handover, never a second stock subtraction."
      inputs:
        - cp_sale
        - original_item_id
        - final_acceptance_status
        - cutoff
        - goods_opening_count
        - receipts_count
        - physical_returns_count
        - physical_handovers_count
        - supplier_goods_dispatch_count
        - goods_to_residue_count
        - demo_conversion_count
        - net_internal_transfers_count
      output: "Q; independent physical stock reconciliation"
      source_ids:
        - ghg-product-standard-2011
    - id: c_energy
      applies_to: "bench_electricity"
      rule: "E_total=closing_kWh-opening_kWh+verified_gap_kWh. E_p=direct_event_kWh_p+(E_total-sum_all_direct_event_kWh)*reserved_hours_p/sum_all_reserved_hours. E_bench=3.6*E_p MJ. Preserve measured failed tests and closed/idle portions. Output E_bench/Q only after attribution; unsupported gaps or nonpositive driver totals block."
      inputs:
        - cp_bench
        - opening_kWh
        - closing_kWh
        - verified_gap_kWh
        - direct_event_kWh_all
        - reserved_hours_all
        - Q
      output: "MJ per reference flow"
      source_ids:
        - ghg-product-standard-2011
    - id: c_assets
      applies_to: "demo_lamp_input; demo_bulb_input"
      rule: "f_ap=e_ap/L_a, where e_ap is actual installed reserved hours for beneficiary p over the pool and L_a is evidenced expected total lifetime installed reserved hours. Sum f_ap across every period/beneficiary <=1. At a new lifetime version replace each previous f_ap and post new-minus-old to the original pool. Actual retirement uses L_a=sum_all_actual_lifetime_e and allocates final residual; acquisition amount=sum actual whole-asset f_ap, then /Q."
      inputs:
        - cp_assets
        - asset_id
        - e_ap_all
        - L_a
        - lifetime_version
        - previous_allocations
        - Q
      output: "Whole lamp or whole bulb Item(s) per reference flow"
      source_ids:
        - ghg-product-standard-2011
    - id: c_background
      applies_to: "failed_background"
      rule: "For each original source j, B_j=B_sj+B_fj+B_oj+B_tj. B_fj is original receiving-item-equivalent responsibility, not discarded kg or duplicate descendants. Input=sum_j B_fj/Q with one original full-pack receiving-gate provider each; matching downstream goods adds sum_j B_sj/Q separately. Late corrections replace these partitions and original pool version."
      inputs:
        - cp_failure
        - original_background_id
        - B_j
        - B_sj
        - B_fj
        - B_oj
        - B_tj
        - owner_signoff
        - Q
      output: "Original receiving-pack Item(s) responsibility per reference flow"
      source_ids:
        - ghg-product-standard-2011
    - id: c_transfers
      applies_to: "supplier_sealed; supplier_opened; retained_sealed; retained_opened"
      rule: "N_state=count actual unique physical handoffs in the named state with dated recipient evidence; each earlier handover enters one final fate only. N_state/Q is physical output; S/F/O/T remains a separate responsibility reconciliation."
      inputs:
        - cp_failure
        - original_item_id
        - physical_event_id
        - recipient
        - state
        - Q
      output: "Physical transfer Item(s) per reference flow"
      source_ids:
        - ghg-product-standard-2011
    - id: c_waste
      applies_to: "stock_lamp_waste; carton_waste"
      rule: "For each actual disjoint consignment carrier W=gross_kg-tare_kg OR direct_net_kg, with exclusive modes. stock_lamp_waste=W_stock_lamp/Q. carton_waste=(W_stock_carton+Sum_a W_demo_carton,a*f_ap(version))/Q. Demo cartons retain original asset/packaging-event IDs and use that same asset lifetime fraction once; every life revision replaces all original-pool portions and actual retirement sets final fractions, never all demo carton kg charged to current Q. Ordinary stock carton uses its actual stock-source full responsibility. Opening+generated-dispatched=closing is an independent waste-kg check, not another correction to actual dispatch; packaging manufacture is already in the matching original provider."
      inputs:
        - cp_failure
        - measurement_mode
        - consignment_id
        - source_kind
        - source_asset_id
        - packaging_source_id
        - W_stock_lamp
        - W_stock_carton
        - W_demo_carton_a
        - f_ap_version
        - lifetime_version
        - gross_kg
        - tare_kg
        - net_kg
        - carrier_state
        - Q
      output: "Dispatched net carrier kg per reference flow"
      source_ids:
        - jrc-retail-bemp-2013
    - id: c_terminal
      applies_to: "demo_lamp_waste; demo_bulb_waste"
      rule: "W_a is net kg of the actual complete integral-BOM terminal carrier excluding only the separate bulb, by direct net weighing OR complete retained-component BOM reconstruction. Other removed integral components require a specific remaining-carrier extension and cannot use the complete lamp card. Never subtract the bulb twice. Terminal numerator=sum_a W_a*f_ap(final); output numerator/Q. No second manufacture fraction or provider-contained disposal."
      inputs:
        - cp_retirement
        - measurement_mode
        - W_a
        - component_net_kg
        - final_f_ap
        - lifetime_version
        - Q
      output: "Lifetime-attributed terminal kg per reference flow"
      source_ids:
        - ghg-product-standard-2011
    - id: c_completion
      applies_to: "all inventory rows"
      rule: "For each module row r restore R_r=normalized_value_r*original_denominator_r when normalized, otherwise R_r=raw_total_r. Apply the evidenced full-pool causal fraction once to R_r if not already allocated. Remove only duplicate identical source-event keys with identical scope/version; conflicts block. Match exchange identity, property and unit; add disjoint compatible numerators by row, then divide common corrected Q once. Store residual electricity subtracts only contained bench circuits. All module lifetime revisions follow a_lifetime."
      inputs:
        - cp_completion
        - module_id
        - version
        - normalized_flag
        - normalized_value
        - original_denominator
        - raw_total
        - allocation_status
        - causal_fraction
        - source_event_keys
        - exchange_identity
        - property
        - unit
        - corrected_Q
      output: "Completed compatible row numerators and once-normalized service inventory"
      source_ids:
        - ghg-product-standard-2011
        - jrc-retail-bemp-2013
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Bind each unresolved atomic flow only after original official public record and property/unit/medium/type/name verification. Whole luminaire, bulb, pack and carton candidates cannot inherit a material-only UUID. Preserve unknown identity and matching provider completion conditions."
      evidence: "Official original, hash/integrity receipt and row-specific semantic comparison"
    - id: q_measure
      applies_to: "all inventory rows"
      requirement: "Retain calibration, original record IDs, full interval coverage and uncertainty. No unsupported numerical ranges, nominal masses, rated activity or zero defaults. Important-flow range evidence remains unresolved pending comparable records; this candidate supplies collection methods instead."
      evidence: "Raw logs, scale records, supplier complete BOM and explicit evidence gaps"
    - id: q_completion
      applies_to: "all inventory rows"
      requirement: "Partial module status remains explicit until every b_completion module, actual atomic extension, S/F/O/T responsibility and conditional true/false/unknown check is resolved. Consumer operation is not part of bench energy. No asserted whole-standard conformity or scientific approval."
      evidence: "Named completion matrix, provider overlap review and bilingual business-array audit"
validation_rules:
  - rule_id: v_reference
    applies_to: "retail_service"
    rule: "Reject mixed SKUs or units, opened/damaged service acceptance, missing original IDs, missing cutoff or Q<=0 normalization. Reconcile distinct final-valid IDs independently from gross custody stock."
    source_ids:
      - ikea-tertial-70355455
      - ghg-product-standard-2011
  - rule_id: v_balance
    applies_to: "all inventory rows"
    rule: "Reconcile stock event balance, B_s+B_f+B_o+B_t=B, all meter attribution=raw total and asset lifetime fractions<=1. Externally retained failures have recipient/state/background responsibility; supplier returns keep continuing responsibility. No duplicated original background or dispatch carrier."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: v_completion
    applies_to: "all inventory rows"
    rule: "Unknown presence, identity, meter containment, provider coverage, full BOM, lifetime driver or external module boundary blocks complete claims. Confirm all referenced IDs exist in actual generated business arrays, bilingual directions/types/formulas/qualifiers agree, actual extra flows have atomic cards, and only compatible once-restored numerators are aggregated."
    source_ids:
      - ghg-product-standard-2011
      - jrc-retail-bemp-2013
published_dataset_profile:
  dataset_role: "Partial incremental retail-service foreground module; completed only after b_completion."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same SKU/configuration and declared route with actual data and compatible completed modules."
  excluded_use: "Whole CPC leaf, bulb manufacture, illumination service, consumer operation, products outside the declared family, or uncompleted comparative total."
  required_metadata: "store and country; SKU white and supplier revision; complete lamp and original packaging BOM; original item IDs and receiving-gate background IDs; ambient walk-in route; pool horizon and acceptance cutoff; final-valid Q and correction version; bench lamp and clear bulb805.914.47 identity and compatibility; meter containment and all-beneficiary allocation; partial boundary and completion module versions; failed retained goods recipient and background responsibility; provider and terminal-treatment boundaries"
  required_quality_disclosure: "Candidate method, partial boundary, identity/BOM/provider/range gaps, uncertainty, late-return/lifetime replacements and all module versions."
  update_trigger: "Changed SKU, supplier revision/BOM, route/bench bulb, meters, providers, acceptance status, asset life or completion scope."
