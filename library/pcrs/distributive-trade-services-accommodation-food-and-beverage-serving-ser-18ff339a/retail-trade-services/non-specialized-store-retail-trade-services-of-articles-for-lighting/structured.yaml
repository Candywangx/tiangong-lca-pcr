system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_gates
      applies_to: "all inventory rows"
      rule: "Fix the receiving gate at store unloading acceptance: original complete lamp plus actual original packaging and pre-gate inbound transport. The incremental module covers bench operation/assets, failed-goods receiving-gate background and actual dispatched residuals. Successful merchandise manufacture/packaging/inbound transport remain in downstream goods background B_s; consumer use and consumer disposal remain outside retail. Include no bulb in merchandise background."
      source_ids:
        - ikea-tertial-70355455
        - ghg-product-standard-2011
    - rule_id: b_background
      applies_to: "failed_background"
      rule: "For each original item source j, partition its receiving-gate background exactly once into S final-valid successful customer responsibility, F irrevocable failure assigned to this retail pool, O still-open responsibility and T named transferred responsibility. B_j=B_sj+B_fj+B_oj+B_tj in original receiving-item equivalents. Resale retains the same original source ID. Demonstration conversion binds T to the same original receiving background in the asset ledger and charges that demo supply background once; it cannot also enter F or create another whole lamp. Charge only B_f/Q here; downstream product aggregation adds B_s/Q once. Supplier return and external retention do not erase background: signed continuing responsibility or F is required. No new physical exchange is created by responsibility transfer."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: b_state
      applies_to: "retail_service; supplier_sealed; supplier_opened; retained_sealed; retained_opened; stock_lamp_waste"
      rule: "Keep gross physical receipts, handovers, returns, supplier dispatch, external retained failures, local waste dispatch, internal stock transfers, demonstration conversions and opening/closing stock as separate dated events. Final acceptance revocation removes the service even without physical return; financial-only refund with valid acceptance leaves it. External retention without qualified acceptance is not output service or local waste. Sealed complete and opened nonfunctional complete return states have separate cards; missing parts/fragments or different states need a named state-specific atomic extension before completeness."
      source_ids:
        - ikea-tertial-70355455
        - ghg-product-standard-2011
    - rule_id: b_assets
      applies_to: "demo_lamp_input; demo_bulb_input; demo_lamp_waste; demo_bulb_waste"
      rule: "Demo lamp includes its actual clamp, cable, plug, socket and switch; the removable bulb is separate. Lamp and bulb input providers cover manufacture, full actual original acquisition packaging and delivery to store only, excluding operation, maintenance and end-of-life. A measured terminal lamp without bulb and a removed whole bulb are disjoint carriers. Repairs are event-based named component inputs and removed-component carriers; never a second whole-lamp manufacturing burden. Never infer complete BOM from the manufacturer steel/ABS/glass list."
      source_ids:
        - ikea-tertial-70355455
        - ikea-solhetta-80591447
    - rule_id: b_conditions
      applies_to: "all inventory rows"
      rule: "For each process/card record true, false or unknown with dated inspection, meter, invoice, dispatch or signed operator evidence. False requires evidence of absence over the full pool; unknown blocks completeness and is never zero. The bench is required for this route; no bench or different demo model changes applicability. Actual cleaning, repairs, additional packaging, printed receipts, bags or old-product takeback invoke b_completion plus named atomic bilingual cards before a complete dataset."
      source_ids:
        - jrc-retail-bemp-2013
    - rule_id: b_completion
      applies_to: "all inventory rows"
      rule: "This is a partial incremental foreground module. The admitted site is a naturally ventilated ambient store with no on-site combustion, refrigeration/refrigerant circuit or mechanical HVAC; signed site equipment/utility records and full-period inspection must prove these absences. Unknown or observed presence excludes this route and blocks completeness, never becomes zero. Mandatory external modules are building, shelf, bench support, checkout terminal/receipt printer manufacture-installation-maintenance-retirement; general electric lighting/checkout/network/receipt paper/bags; actual cleaning; manual internal handling, contracted return dispatch and terminal treatment; original lamp inserts/wrapping outside carton_waste and demo bulb packaging disposal. Acquisition providers already contain original packaging manufacture. For stationary assets use persistent exposure e/L across every beneficiary with all a_lifetime revisions; building/shelf/general lighting use actual reserved area-hours including closed periods; checkout assets use reserved operating plus actual stationary idle hours, checkout operation actual transaction minutes. Main-meter residual kWh equals measured main minus only actually contained bench circuits; independent meters are not subtracted. All residual energy remains kWh until row-specific conversion, and no unknown driver or zero all-beneficiary driver total passes. Cleaning admits actual homogeneous mild aqueous detergent with supplier full formulation and packaging BOM, metered imported dilution water and actual single-use cellulose wipe; each exact formulation/package/wipe must acquire its own named atomic bilingual card before completion. Water meters already exclude internal reuse. Cleaner original-formulation-source kg is measured by the original container net stock balance and assigned to disjoint final destinations: unused retained stock, terminal-container-retained formulation, effluent, wipe, spill, and still-open used stock, excluding added water/dirt. Used is an intermediate status, not an additional final sink: later destination evidence replaces that status and reclassifies the same original source kg without a new input or duplicate responsibility. Unused retained stock excludes a container already dispatched to treatment; never multiply whole effluent by source composition again. Whole cleaning effluent uses either direct calibrated carrier net kg OR actual metered discharge volume times measured whole-effluent density at recorded temperature; modes are exclusive, and reconstruction is prohibited. Used whole wipe carrier net kg includes retained liquid/dirt and is disjoint from the measured effluent; its original dry input and final carrier are distinct quantities. The original detergent-container terminal carrier is the actual complete container, closure, label and retained original formulation, measured together as net carrier kg, not an assumed empty container or pure body-polymer kg. Its retained formulation-source kg is disjoint from effluent/wipe/spill/unused-stock source kg and is not a second physical formulation output. Packaging manufacture is already in detergent supply. Terminal treatment providers start at each accepted named carrier gate, exclude duplicate cleaning/supply and disclose included pickup/transport. Contracted return transport uses an actual complete vehicle-trip provider package covering actual fuel (including actual idling), driver, vehicle manufacture/maintenance/retirement, loaded and empty legs once; retain trip loaded_km, empty_vehicle_km, moving_h, stationary_idle_h, fuel_L, density and lower heating value evidence, cargo IDs and all beneficiaries. For each fixed trip r and its segments s, calculate d_pr=sum_segments_s(reserved_volume_p,r,s*(moving_h_r,s+idle_h_r,s)) for beneficiary p, with reserved volume in m3 and moving/actual stationary idle duration in h. Set f_pr=d_pr/sum_b d_br, summing only over all actual beneficiaries b of that same trip r, never across trips. Include evidenced reservations for actual empty segments and stationary idle segments. Apply f_pr once only to a trip-package numerator not already allocated to p; a provider-attributed amount retains its recorded allocation and is not multiplied again. No t*km=0 erases an empty trip. Unknown package fuel/idle/empty coverage or nonpositive total driver blocks completion; no overlapping fuel, truck or treatment trip may be added. Internal handling is manual only, supported by a full-period absence record for powered equipment; other equipment changes route. Every module returns atomic exchange/property/unit/source-event numerators, original denominator and version. Restore normalized rows by their actual original denominator, allocate once, reject duplicate source-event scope/version keys, add only compatible identical exchange/property/unit numerators and divide common corrected Q once. Demo-origin packaging disposal follows the same source asset lifetime fraction and all prior-version replacements as its manufacture; ordinary stock packaging disposal uses its actual stock-source responsibility. All actual extra rows, full BOM/provider boundaries and raw quantity evidence are mandatory before completeness."
      source_ids:
        - jrc-retail-bemp-2013
        - ghg-product-standard-2011
