product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.retail-trade-services.non-specialized-store-retail-trade-services-of-footwear"
  classification_refs: "CPC 3.0 62134; narrower subset of non-specialized store retail trade services, of footwear"
  covered_products: "One declared homogeneous SKU, colour, size system, size and width of new matched left/right low casual shoes, leather upper and rubber outer sole; actual animal species, tanning/coating, lining, sock, laces, adhesive and sole compound declared from supplier BOM. Leather is not proof of bovine origin."
  excluded_products: "Sports, protective, orthopaedic, skating, asbestos or second-hand footwear; sandals, boots, parts, loose insoles, mixed sizes and mixed materials; online delivery, repair, polishing, manufacture and consumer wearing."
  representative_product: "A supplier-verified matched pair of one leather-upper rubber-sole casual-shoe SKU. Historical Clarks Stratton Way 26102520/26102519 illustrates this construction only; it supplies no current SKU, animal species, mass or BOM default."
  production_route: "Ambient all-electric non-specialized store with electric resistance fan heating and natural ventilation, no mechanical cooling or refrigerant circuit; manual stock handling and disposable cellulose floor wipes; receiving, pair/size inspection, dry storage/display, supervised indoor try-on, counter checkout and handover, return inspection and disjoint residual dispatch. No shoe treatment or on-site manufacture. Personal employee meals, sanitation and commuting, and consumer travel/use are outside this incremental service; disclose this exclusion without claiming a whole-store or shoe life-cycle inventory."
  market_state: "New dry finished shoes; indoor-tried but still saleable status explicitly inspected. Original pair box and stuffing remain a receiving-background component until physically discarded; replacement store packaging is separate."
functional_unit:
  what: "Retail inspection, fitting assistance and qualified counter handover of the declared shoe pair"
  how_much: "1 completed pair-service; 1 Item(s) is one service for exactly one matching left shoe and right shoe, never one single shoe"
  how_well: "Both shoes match SKU, size, width, colour and declared construction; inspection records condition and fit decision; recipient accepts possession and agreed condition. Price/payment alone does not prove acceptance."
  how_long_or_cycle: "One prospectively fixed same-configuration accounting pool through the declared return-maturation cutoff, retaining all operating, idle, failed and zero-sale intervals; late events revise that original pool."
  reference_flow_link: "retail_service"
system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "all"
      rule: "The declared construction and route are eligibility gates. Only original matched pairs qualify: retain original_pair_id and left/right_source_id. Re-pairing shoes from different original pairs is outside this route and blocks completeness until a separately reviewed extension allocates each original shoe background and all leftover singles. Same-label shoes with different animal species, sole compounds, sizes or widths form separate homogeneous pools; no sport/part/service expansion from classification breadth."
      source_ids:
        - src_un
        - src_clarks
        - src_label
    - rule_id: b_operations
      applies_to: "all"
      rule: "Include receipt inspection, storage, fitting bench/mirror, try-on resources, lighting, checkout/POS, electric resistance fan heating, cleaning, packaging, returns and actual residual transfers. The all-electric route excludes combustion only with signed site inspection and utility evidence; all observed outgoing supplier/internal handover and waste-carrier backgrounds must declare whether pickup/haul and treatment are included. Verify provider actual loaded and empty routes, distance, gross load and idle time; an empty route is not zero activity because t*km=0. Missing provider transport scope or additional observed substances/transport require atomic cards, single-process protocols and bilingual sync before completeness."
      source_ids:
        - src_retail
    - rule_id: b_assets
      applies_to: "assets"
      rule: "Each asset card is one evidenced complete-unit lifecycle provision package: manufacturing, installation, non-operational maintenance/replacements and terminal treatment for the specified asset only. Exclude its operating electricity, cleaning and merchandise from that package. Building shell excludes all separately listed fixtures, bench, mirror, POS, luminaires and fan-heater. Maintenance replacements mean parts only, never a complete successor asset: a whole replacement gets its own new serial and lifetime history, with no duplicate package-contained part exchange. No package is presumed available: missing signed scope/model, lifecycle mass/carrier evidence or missing actual equipment blocks completed dataset use."
      source_ids:
        - src_retail
        - src_ghg
    - rule_id: b_background
      applies_to: "retail; residual"
      rule: "Maintain original receiving backgrounds once per uniquely traced shoe and packaging component: B_in+B_opening=B_S+B_F+B_T+B_O. Money credits cannot move physical goods or change ownership without evidence. No-sale failures remain in the prospectively fixed pool. Unworn transfer and damaged waste/retained-failure carriers have different actual destinations/states; do not infer waste from a refund."
      source_ids:
        - src_ghg
    - rule_id: b_completion
      applies_to: "all"
      rule: "Mandatory common support modules cover actual administrative/back-office work, transaction-network/remote IT, omitted facility support and actual extra equipment. For each module: fix provider/site/process and same pool/version; enumerate atomic actual utilities/materials/carriers, direct raw meters/invoices/stock and event ledgers, actual complete-unit assets under c_assets, provider operation/maintenance/EOL scope and absence evidence. Record collector/time/unit/calibration/coverage and all beneficiaries. Direct subdivision first; shared active administration by observed task seconds and remote transaction service by actual message/transaction counts; retain idle support via occupied support area-hours and all closed/failed periods. Unknown scope or zero/unknown all-beneficiary driver blocks completion. No unnamed combined resource flow may stand in for these module exchanges; each module must expose parsed cards, protocols, formulas, raw numerators and evidence before aggregation."
      source_ids:
        - src_ghg
        - src_retail
boundary_abstraction:
  declared_starting_condition: "Shoes and original packaging physically received at the store gate with supplier manufacture and inbound freight backgrounds identified separately; gross receiving events are not the service output."
  starting_condition_role: "Incremental retail service with explicit receiving-gate merchandise background coupling; not a shoe-manufacturing dataset."
  product_classification_scope: "Only the declared narrower 62134 construction and counter route; groups 294/295/296 do not become equivalent to this scope."
  recursive_input_rule: "No same-category retail-service input is silently replaced by the current output. External retail steps require a separately delimited service and no overlap."
  upstream_dataset_requirement: "Attach each receiving lot original product/packaging and inbound freight background at actual gate, original quantity and version. Successful sold goods stay separately attachable as B_S/Q; retail-caused irrecoverable failure B_F/Q enters this service. Supplier/internal transfer B_T and open stock B_O retain an explicit signed owner, never disappear."
  disclosure: "Publish incremental service plus separate B_S, B_F, B_T, B_O reconciliation, original gross events, actual dates and cutoff/version; no full shoe life-cycle or legal conformity claim."
