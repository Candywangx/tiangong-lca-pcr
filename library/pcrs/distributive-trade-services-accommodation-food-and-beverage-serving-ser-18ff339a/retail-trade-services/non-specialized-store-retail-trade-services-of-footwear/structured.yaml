  - id: m_count
    applies_to: "retail_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Q counts actual matched pairs; no automatic 2 shoes=1 pair without matching identities and final acceptance."
  - id: m_mass
    applies_to: "water; cleaner; cleaner_container; receipt_core; receipt_wrap; receipt_carton; floor_wipe; tryon_socks; receipt; bag; box; stuffing; film; unworn_transfer; failed_retained; cleaner_bottle_waste; shoe_waste; cardboard_waste; mixed_dry_waste; effluent"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use measured net kg in the declared material state. g/1000; a count conversion uses actual batch component kg/count and rejects mixed batches. A matched pair mass M_pair=m_left+m_right excluding packaging, not a fixed conversion for other sizes or single failures."
  - id: m_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "1kWh=3.6MJ; apply conversion once after raw meter reconciliation, before one division by Q."
  - id: m_asset
    applies_to: "building; shelf; bench; mirror; pos; luminaire; hvac"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "An item is a complete identified asset lifecycle package; fractional amount is exposure/lifetime, not kg of repair parts or hours labelled as count."
  - id: selected_freight_identity
    applies_to: "van_loaded; truck_loaded"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "The selected road-freight identity uses the official goods-transport property/unit.1kg*km=0.001t*km; preserve the declared original quantity/attribution mode and convert only once. Actual vehicle, cargo conditions and provider stages remain independent applicability gates, with no assumed background or extra loaded share."
