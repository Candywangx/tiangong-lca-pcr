allocation_rules:
  - rule_id: a_shared
    applies_to: "all"
    rule: "Subdivide and directly meter first. For residual shared fixed lighting/fan-heater/building/cleaning pools use declared occupied floor-area-hours including closed/idle intervals, summed over every actual beneficiary; POS use observed checkout-active seconds plus remaining standby distributed by beneficiary service-support area-hours. Allocate direct trial/packaging events by pair ID. Sum all beneficiary allocations back to full measured pools, retain no-sale beneficiaries and missing-driver uncertainty. No driver or zero all-beneficiary driver means unresolved allocation, not zero burden."
    source_ids:
      - src_ghg
  - rule_id: a_assets
    applies_to: "assets"
    rule: "Use persistent asset serial a, exposure e_a,p and signed expected total lifetime exposure L_a,v covering past, current and future beneficiaries: w_a,p,v=e_a,p/L_a,v. Manufacturing provision is w complete package units, never a new whole purchase per period. Revisions replace prior allocations using delta=w_new-w_old for each historical beneficiary; cumulative fractions must not exceed1. At retirement replace forecast L with the measured sum of all lifetime exposures, recompute and replace every past beneficiary allocation with e_p/sum_all_lifetime_e, then reconcile only the remaining rounding/model residual once over those same actual lifetime shares; never assign1-prior only to the last period. Terminal package carrier kg is actual whole-device kg times its lifetime responsibility once, not again by manufacturing fraction. Removed parts are separate within supplier package model; direct net terminal weighing never subtracts them again."
    source_ids:
      - src_ghg
  - rule_id: a_pool
    applies_to: "all"
    rule: "Use one common final Q for all raw attributed numerators; never divide an already normalized row again. Different exchange identities/properties/units cannot be added. Return/resale follows original unique shoe history; a revoked old service removes its old output even with no physical return. A later qualifying resale creates only its actual new service, never another merchandise manufacture background. No substitution/recycling credit is automatic."
    source_ids:
      - src_ghg
dataset_production:
  collection_protocols:
    - protocol_id: cp_retail
      process_id: "retail"
      flow_role: "retail_service and operational inputs"
      record_type: "event_meter_stock_ledger"
      raw_fields: "pool_id; version; cutoff; SKU; animal_species; BOM; size_system; size; width; colour; pair_id; original_pair_id; left_id; right_id; left_source_id; right_source_id; lot; event_id; event_date; physical_state; gross_received_shoes; gross_handover_shoes; gross_return_shoes; internal_in_shoes; supplier_out_shoes; internal_out_shoes; physical_waste_shoes; to_held_waste; waste_open; generated_from_goods; waste_close; source_portion_kg; external_moisture_dirt_kg; measured_source_loss_kg; mass_uncertainty; actual_count; paired_match; tryon_attempt_id; tryon_foot_side; trial_result; goods_open; goods_close; opening_stock; closing_stock; accepted_pair_event; revoked_event; old_event_id; financial_only_flag; destination; B_in; B_S; B_F; B_T; B_O; original_gate_quantity; supplier_side_allocation; side_composition; mass_allocation_justification; sensitivity; M_left; M_right; meter_id; parent_meter_scope; read_start; read_end; kWh; all_beneficiary_area_hours; active_seconds; standby_seconds; imported_water_volume; water_density; temperature; material_batch; bottle_source_id; bottle_complete_BOM; bottle_body_kg; closure_liner_tamper_kg; label_adhesive_kg; complete_dry_bottle_kg; actual_solution_residue_kg; detached_part_source_id; receipt_roll_id; roll_gross_kg; core_id; core_material; core_full_dry_kg; actual_nonpaper_adjunct_kg; actual_net_thermal_paper_kg; wrapping_BOM; wrapping_dry_kg; transport_carton_BOM; transport_carton_dry_kg; opening_unprinted_paper_kg; closing_unprinted_paper_kg; opening_printed_WIP_kg; closing_printed_WIP_kg; printed_WIP_source_ID; original_paper_source_ID; printing_meter_ID; printing_energy_share_MJ; prior_assigned_paper_kg; prior_assigned_printing_MJ; unallocated_WIP_paper_kg; unallocated_WIP_printing_MJ; original_pool_version; replacement_contribution_ID; issued_receipt_kg; test_void_scrap_kg; transferred_printed_kg; all_beneficiary_paper_draw_kg; all_beneficiary_solution_draw_kg; component_background_scope_ids; provider_mode; original_package_id; original_package_quantity; original_package_unit; package_background_scope_id; gross_kg; tare_kg; issue_kg; unused_return_kg; printed_stock; SDS; concentration; measured_kg_per_count; presence_absence_status"
      collection_method: "Receiving/checkout supervisor logs every shoe and trial/handover/return/revocation with original IDs and timestamps; utilities technician reads matched disjoint meters; warehouse keeper weighs input/return stocks by material batch and calibrates balance with traceable check masses. Supplier confirms species/BOM and original backgrounds. Signed site survey confirms each present/absent route, no blank means absent."
      unit: "Item(s); kg; kWh; m3; s; m2*h"
      frequency: "Every physical or acceptance event; daily stocks and meter reads, continuous electricity logger for shared circuits; batch conversions before use"
      temporal_coverage: "Whole fixed pool, all shifts, closure and idle; follow every original shoe through cutoff and later corrections"
      site_scope: "Receiving gate, stockroom, fitting area, checkout and full shared store beneficiary ledger"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed gate/acceptance/return slips, supplier BOM/ownership and inbound-freight evidence, meter map/calibration, stock weighings and all-beneficiary reconciliation; unknown stays unknown"
    - protocol_id: cp_residual
      process_id: "residual"
      flow_role: "state-specific transfers and terminal carriers"
      record_type: "consignment_ledger"
      raw_fields: "pool_id; event_id; original_shoe_id; original_pack_component_id; bottle_source_id; complete_dry_bottle_kg; actual_solution_residue_kg; detached_part_source_id; core_id; receipt_roll_id; source_component_kg; kraft_bag_source_id; wrapping_carton_source_id; collection_contract_id; admitted_materials; sorted_composition_kg; retained_component_stock_kg; customer_handover_kg; recipient; state; gross_kg; tare_kg; consignment_net_kg; opening_waste_stock; generation_kg; closing_waste_stock; actual_dispatch; waste_open; generated_from_goods; waste_close; transfer_acceptance; provider_scope; loaded_route_km; empty_route_km; load_kg; idle_seconds; transport_activity_id; treatment_id; B_F; B_T; responsibility_signature; effluent_volume; effluent_density; temperature; composition; contamination; measured_water_supply; evaporation; storage_change; cleaning_solution_water; f_water_effluent; W_open; W_import; W_cleaner; W_other_source; W_solid_dispatched; W_evaporated; W_close; source_portion_water_id; balance_uncertainty; presence_absence_status"
      collection_method: "Dispatch officer weighs every consignment on calibrated scale and records recipient custody/treatment; separate intact shoe, damaged externally retained shoe, whole waste shoe, paperboard, mixed solid carrier and liquid. Technician directly meters/collects full liquid discharge and measures representative density/temperature/composition per cleaning batch."
      unit: "kg; m3; kg/m3"
      frequency: "Every dispatch and cleaning batch; daily residual stock"
      temporal_coverage: "Same original pool and all later linked dispatch/return corrections"
      site_scope: "Named store waste/return gates and actual receiving contractor"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale checks, consignment receipts, photos/material-state audit, signed ownership/treatment and water balance; unknown destination/absence blocks completeness"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "each identified complete asset lifecycle provision"
      record_type: "serial_lifetime_ledger"
      raw_fields: "asset_serial; package_id; package_version; exact_model; unit_count; installed_whole_kg; BOM; manufacture_scope; installation_scope; operational_exclusions; maintenance_event_id; replaced_parts; terminal_carrier_net_kg; terminal_measurement_mode; expected_total_lifetime_exposure; historical_exposure; current_exposure; future_exposure; all_beneficiaries; allocation_version; signed_revision; previous_allocations; delta_corrections; retirement_date; presence_absence_status"
      collection_method: "Facility engineer inventories building shell and every shelf, bench, mirror, POS, luminaire and fan-heater serial/model; verifies supplier complete-lifecycle package model, disjoint scopes and terminal carriers; measures asset-specific exposure under each card, signed total-life forecast and every revision against historical allocations."
      unit: "Item(s); kg; m2*h; m3*h; s"
      frequency: "At installation, monthly exposure, every maintenance/revision and retirement"
      temporal_coverage: "Full asset history across all past/current/future periods and beneficiaries, not only current shop reporting window"
      site_scope: "Whole installed asset and exact contracted lifecycle package, excluding separately metered operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed engineering forecast, full-life history/beneficiary totals, supplier stage/maintenance/EOL model and net whole-device/BOM-mode checks; no unverified package assumed complete"
    - protocol_id: cp_transport
      process_id: "logistics"
      flow_role: "Actual carrier transfer vehicle activities"
      record_type: "route_ledger"
      raw_fields: "pool_id; route_id; vehicle_id; vehicle_class; fuel_type; consignment_id; actual_payload_kg; loaded_leg_km; empty_leg_km; stationary_idle_seconds; route_start_end; all_beneficiary_payload; reserved_capacity_kg; reservation_seconds; benefiting_loaded_legs; provider_scope; original_background_id; treatment_scope_id; included_empty_idle; exact_overlap_ids; presence_absence_status"
      collection_method: "Dispatcher records every loaded/empty leg and stationary idling interval from odometer/GPS and engine logger, actual calibrated payload scale and signed consignment; provider signs exact fuel/vehicle/capital/empty/idle/pickup/treatment boundaries. Reviewer removes exact overlap only, with all-beneficiary drivers."
      unit: "kg; km; s; t*km; vehicle*km; h"
      frequency: "Every leg and idle event"
      temporal_coverage: "All actual outward carrier routes including failures and no-sale periods"
      site_scope: "Van supplier/internal transfers and rigid-truck collection routes; other observed vehicle types require matching cards"
      aggregation_rule: "per reference flow"
      quality_evidence: "GPS/odometer checks, engine logs, payload-scale checks, signed provider scope and exact activity-ID deduplication"
    - protocol_id: cp_completion
      process_id: "support_completion"
      flow_role: "Mandatory common administrative, remote IT and facility support modules"
      record_type: "support_module_ledger"
      raw_fields: "module_id; provider; site; process; original_pool; cutoff; version; atomic_exchange_id; state; medium; property; unit; direct_raw; shared_raw; meter_invoice_stock_ids; collector; timestamp; calibration; coverage; administrative_task_seconds; transaction_message_count; occupied_support_area_hours; all_beneficiary_drivers; asset_serial; lifetime_version; original_denominator_D_m; prior_contributions; exact_overlap_source_activity_ids; Q; presence_absence_status"
      collection_method: "Support manager obtains every actual module raw meter/invoice/stock, task/network activity and complete asset ledger under b_completion, verifies each atomic exchange identity/provider stage and module-specific parsed protocol, signed whole-pool/beneficiary attribution and exact overlap IDs."
      unit: "kg; MJ; Item(s); s; m2*h"
      frequency: "Every support activity, monthly whole-pool reconciliation and every version update"
      temporal_coverage: "Same original pool including closed/failed/no-sale intervals, full asset histories"
      site_scope: "Every actual local and remote common support beneficiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw module/provider evidence, parsed cards/protocols, calibrations, signed attribution and c_completion reconciliation"
  calculation_rules:
    - id: c_accept
      applies_to: "retail_service"
      rule: "Q=count_distinct(original_pair_id having exactly one final valid qualifying acceptance at cutoff/version), after applying each linked revocation once to its original acceptance. Retain gross acceptances/revocations separately; do not subtract revocations again from this already final-valid count. Repeated scans and trials are not extra service. Pure financial adjustment with valid acceptance changes neither Q nor physical stock. Wrong size, left-left or mismatched pair and recipient retention without qualified acceptance contribute no service. Zero-output whole pools are retained unnormalizable, never dropped."
      inputs:
        - accepted_pair_event
        - revoked_event
        - old_event_id
        - original_pair_id
        - pair_id
        - left_id
        - right_id
        - SKU
        - size
        - width
        - financial_only_flag
        - "cutoff/version"
      output: "Q Item(s) and corrected original-pool version"
      source_ids:
        - src_ghg
    - id: c_stock
      applies_to: "retail; residual"
      rule: "For each shoe ID/state: goods_open+gross_received+gross_return+internal_in=gross_handover+supplier_out+internal_out+to_held_waste+goods_close. Separate held-waste control volume: waste_open+generated_from_goods=actual_dispatch+waste_close; never count generation and dispatch as two goods exits. Acceptance revocation is not physical return. Track original shoe source portions through fragments and held waste; separate packaging ledger. These count/identity equations do not establish kg closure: net measured shoe/pack source kg plus measured external moisture/dirt gains equals outgoing source portions, remaining stock, waste generation and measured source-material/moisture losses in one declared control volume, with uncertainty. Actual removed source portions enter exactly one carrier; unresolved mass changes are investigated, not set to zero. Q is independent."
      inputs:
        - opening_stock
        - gross_received_shoes
        - gross_return_shoes
        - gross_handover_shoes
        - "supplier/internal movements"
        - to_held_waste
        - waste_open
        - generated_from_goods
        - actual_dispatch
        - waste_close
        - goods_close
        - original_pack_component_id
        - source_portion_kg
        - external_moisture_dirt_kg
        - measured_source_loss_kg
        - mass_uncertainty
      output: "Count and measured kg reconciliations by physical state"
      source_ids:
        - src_retail
    - id: c_background
      applies_to: "retail; residual"
      rule: "For split single-shoe fates, first subdivide supplier manufacture and inbound load by actual left/right source records; if unavailable, declare measured same-original-pair net-mass allocation m_side/(m_left+m_right), with both actual masses, composition and physical-basis justification plus sensitivity, never default1/2. Original packaging already serving its intended shoe-protection function follows the parent shoe background fate, not automatic F merely because unboxed; its actual waste treatment stays here. Partition each original receiving product/packaging and inbound freight background once among final S successful, F retailer-responsible failed, T transferred-owner and O open. For each source dataset/version z, B_z,k is an original-gate activity quantity in the declared unit of that source (pair, shoe, kg or freight unit); keep source/unit coordinates separate, never sum kg, counts or impacts. B_S/Q remains separately attachable to goods; B_F/Q is explicitly added to service; B_T/B_O retained with owner and original quantities. Resale never duplicates original production; failure descendants inherit shares summing original, not one whole background each. Late corrections update original numerator, ownership and Q together."
      inputs:
        - original_gate_quantity
        - original_shoe_id
        - original_pack_component_id
        - "supplier product/packaging and inbound-freight dataset/version"
        - B_in
        - B_S
        - B_F
        - B_T
        - B_O
        - "signed ownership"
        - "actual dates"
        - "supplier left/right manufacturing allocation"
        - "actual m_left/m_right"
        - "allocation justification/sensitivity"
      output: "B_S/Q; B_F/Q; retained B_T and B_O with original units, no duplicate physical carrier"
      source_ids:
        - src_ghg
    - id: c_mass
      applies_to: "retail; residual"
      rule: "For each batch/material state m=gross-tare, or observed count*same-batch measured kg/count; these are exclusive modes. For consumables other than receipt paper and its source packaging, raw consumption=opening+receipts-unused returns-closing usable stock, retaining scrap/voids. Receipt paper/WIP and complete source packaging must use c_consumables rather than that unprinted-stock shortcut. Direct dispatch kg is already net and uses no generation/stock correction. Pair M=m_left+m_right excludes package. No area/volume-based material label percentage is a mass fraction."
      inputs:
        - gross_kg
        - tare_kg
        - measured_kg_per_count
        - "actual count"
        - batch
        - state
        - M_left
        - M_right
        - "opening/receipt/unused_return/closing/printed stock"
      output: "Raw batch kg, no normalization yet"
      source_ids:
        - src_label
    - id: c_shared
      applies_to: "electricity; water; cleaner; cleaner_container; receipt_core; receipt_wrap; receipt_carton; floor_wipe; tryon_socks; receipt; bag; box; stuffing; film; effluent"
      rule: "x_p=x_direct,p+sum(x_shared_pool*d_p/sum_all d). Use disjoint meter totals; subtract submeter only when its parent actually contains it. d=area-hours for fixed store support; checkout active-seconds plus standby area-hour share as a_shared. Direct events have d=actual pair/event allocation. Unknown driver or coverage prevents completion; retain closures, failures and all beneficiaries. E_MJ=3.6*E_kWh once."
      inputs:
        - "raw disjoint meter totals"
        - parent_meter_scope
        - "direct event kg"
        - all_beneficiary_area_hours
        - active_seconds
        - standby_seconds
        - "full-pool totals"
      output: "Attributed raw kg and MJ, reconciled to full pool"
      source_ids:
        - src_ghg
        - src_retail
    - id: c_liquid
      applies_to: "water; effluent"
      rule: "Imported water m=V_water*rho_water(T). Direct full effluent m=V_eff*rho_eff(T,composition); measured discharge already reflects storage/evaporation. Independent water-species QA uses W_open+W_import+W_cleaner+W_other_source=J*f_water_effluent+W_solid_dispatched+W_evaporated+W_close, all kg water; J is direct whole liquid kg, f_water_effluent is measured water mass fraction. Match water source portions and mutually exclusive destinations: wipe absorbed water belongs to measured retained stock or one solid dispatch or one liquid discharge, never several. Include original wet material water only when it crosses this control volume. No reconstruction replaces J or corrects it a second time. Unknown dissolved dirt or carrier coverage blocks closure, not zero."
      inputs:
        - imported_water_volume
        - water_density
        - effluent_volume
        - effluent_density
        - temperature
        - composition
        - cleaning_solution_water
        - f_water_effluent
        - W_open
        - W_import
        - W_cleaner
        - W_other_source
        - W_solid_dispatched
        - W_evaporated
        - W_close
        - source_portion_water_id
        - uncertainty
      output: "Direct raw kg water and whole-liquid carrier with independent QA balance"
      source_ids:
        - src_retail
    - id: c_assets
      applies_to: "building; shelf; bench; mirror; pos; luminaire; hvac"
      rule: "For each actual serial unit w=e_current/L_total,v; raw provision=sum w. e and L use the same card-specific exposure unit. L=past+current+forecast future across all beneficiaries, signed/versioned. Recompute and replace historical shares at revision, record deltas; at retirement first recompute/replace all historical allocations using the actual full-life denominator; distribute only any final rounding/model residual once across all lifetime shares, not to the last period alone. Count one complete package per actual asset over full history, not acquisition stock plus consumed provision."
      inputs:
        - asset_serial
        - current_exposure
        - historical_exposure
        - future_exposure
        - expected_total_lifetime_exposure
        - all_beneficiaries
        - signed_revision
        - previous_allocations
        - package_version
        - installed_whole_kg
        - "maintenance and terminal_carrier_net_kg/mode"
      output: "Raw complete-unit provision Item(s), plus full-life carrier/scope reconciliation"
      source_ids:
        - src_ghg
    - id: c_normalize
      applies_to: "all"
      rule: "For each compatible actual exchange x_i attributed raw amount, q_i=x_i/Q once. Reference q_service=1. If an external package is normalized, first recover its raw numerator by its evidenced original denominator/pool/version; deduplicate exact activity/stage IDs, sum only identical exchange/property/unit raw numerators, divide common Q once. Supplier package carriers remain internal. Q<=0 is retained unnormalizable; unknown values never become zero."
      inputs:
        - Q
        - "each attributed raw kg/MJ/Item(s)"
        - "external original denominator/pool/version"
        - "exact activity and scope IDs"
      output: "Per one final accepted matching-pair service inventory"
      source_ids:
        - src_ghg
    - id: c_transport
      applies_to: "van_loaded; van_empty; van_idle; truck_loaded; truck_empty; truck_idle"
      rule: "Loaded raw activity=sum(actual payload kg/1000*actual loaded leg km), attributed by actual consignment load. Empty vehicle*km=sum actual empty leg km; idle h=sum stationary idle seconds/3600, never empty t*km=0. Direct-purpose route allocation first; shared empty/idle use the documented benefiting loaded-leg payload*distance shares, retaining every beneficiary and failed trip. If all loaded drivers are zero, use positive evidenced reserved capacity kg*reservation seconds over all intended beneficiaries; unknown or all-zero drivers block completion. When signed provider activity already includes actual empty/idle, keep those records as QA and do not add separate activity; otherwise add only uncovered actual phases via their specific cards, with no fuel/capital/pickup/treatment duplicate. All attributed raw activities divide Q once."
      inputs:
        - actual_payload_kg
        - loaded_leg_km
        - empty_leg_km
        - stationary_idle_seconds
        - all_beneficiary_payload
        - benefiting_loaded_legs
        - reserved_capacity_kg
        - reservation_seconds
        - provider_scope
        - included_empty_idle
        - original_background_id
        - treatment_scope_id
        - exact_overlap_ids
        - Q
      output: "Attributed raw t*km, vehicle*km and h separately, then each / Q"
      source_ids:
        - src_ghg
        - src_retail
    - id: c_completion
      applies_to: "all"
      rule: "For support module m and atomic exchange i: X_m,i=direct_raw_m,i+shared_raw_m,i*d_m,p/sum_allbeneficiary_d_m. d is actual administrative task seconds, remote transaction/message count, or occupied support area-hours for idle/fixed facility support under b_completion; retain failed/no-sale periods and reconcile allocations to measured full module totals. Restore a normalized source module using its evidenced original denominator D_m and version: raw=normalized_value*D_m, once. Match common original pool/cutoff/version and replace revised old contributions, remove exact source-activity/provider-stage overlaps. Add only identical exchange identity/state/medium/property/unit raw numerators to foreground; capital uses c_assets over its full lifetime. Divide the final compatible raw sum by the same final Q once. No completed retail claim without every actual support module and signed compatibility/deduplication reconciliation."
      inputs:
        - module_id
        - "provider/site/process"
        - "original_pool/cutoff/version"
        - atomic_exchange_id
        - state
        - medium
        - property
        - unit
        - direct_raw
        - shared_raw
        - administrative_task_seconds
        - transaction_message_count
        - occupied_support_area_hours
        - all_beneficiary_drivers
        - "asset_serial/lifetime_version"
        - original_denominator_D_m
        - prior_contributions
        - exact_overlap_source_activity_ids
        - Q
      output: "Complete compatible raw sum and one common-Q normalization, or explicit incomplete status"
      source_ids:
        - src_ghg
        - src_retail
    - id: c_consumables
      applies_to: "cleaner_container; cleaner_bottle_waste; receipt; receipt_core; receipt_wrap; receipt_carton; bag; mixed_dry_waste"
      rule: "Bottle input is the directly weighed complete empty dry assembly; its checked BOM body+closure/liner/tamper ring+label/adhesive must reconcile to that mass. Final bottle carrier is actual complete remaining assembly+actual residue, directly weighed once; detached source parts and drained residue go to their measured actual carrier only. Allocate bottle manufacturing once across all source-bottle solution draws by actual solution kg, retaining failed/idle pools; retained bottle/solution stock keeps unconsumed responsibility. Receipt route is verified paperboard-core rolls with actual paper wrapping and corrugated transport-carton assemblies; plastic/unknown/coreless states are not presumed equivalent or zero and require matched extension/absence evidence. Roll net paper=actual roll gross minus actual whole core and any measured non-paper adjunct, excluding separate wrapping/carton tare; do not subtract thermal coating, which belongs to paper. Current raw paper consumption=opening_unprinted+received_net_paper-unused_returns-closing_unprinted+opening_printed_WIP-closing_printed_WIP-transferred_printed; reconcile to issued_receipts+test_void_scrap+actual paper losses with uncertainty. Printing WIP is never treated as an unused roll or counted again as a new supply. Carry each printed-WIP source_ID with both its original-paper responsibility and the corresponding actually metered printing-energy share across periods. Amounts already assigned to a beneficiary are never charged again; unallocated paper/printing-energy responsibility follows that original WIP source into its evidenced later use. Attribution corrections replace the prior contribution in the same original pool/version, not add a new duplicate. The printing-meter share cannot remain charged to the old pool and be charged a second time on WIP withdrawal; reconcile all periods and beneficiaries to the original paper quantity and actual printing-meter total, keeping site standby allocation separate. Measure core/wrap/carton whole dry kg per source lot, trace all component source IDs and allocate their manufacture once by the actual net-paper draw of each beneficiary divided by all net-paper draws supported by that source component; retain open component responsibility and replace old shares at final audited disposal. Before completed use select exactly one evidenced provider mode for each bottle/roll source: component mode requires disjoint solution/complete-bottle or net-paper/core/wrap/carton manufacturing scopes attached once to the corresponding physical rows; whole-package mode attaches the verified complete source-package manufacture once at its measured original package quantity, while the component rows are physical quantity/stock reconciliation only with no second component background. This original package binding and physical component records must be explicitly linked; a package cannot also be applied as net-paper kg or solution kg. Unknown mode/scope blocks completeness. Never combine the two modes for one source package; no gross packaged-roll kg is labelled net paper, and no bundled original manufacture is added beside its component manufacture. Every known input-derived discard including kraft bags and receipt components must reconcile to held stock, actual customer handover or the contract-admitted mixed solid carrier; single consignment component audit establishes coverage and per-source attribution, not additional duplicate constituent waste outputs. Unknown core/BOM/provider/contract coverage blocks completeness, never zero. Attribute compatible raw quantities, then divide the common Q once."
      inputs:
        - bottle_source_id
        - bottle_complete_BOM
        - bottle_body_kg
        - closure_liner_tamper_kg
        - label_adhesive_kg
        - complete_dry_bottle_kg
        - actual_solution_residue_kg
        - detached_part_source_id
        - receipt_roll_id
        - roll_gross_kg
        - core_id
        - core_material
        - core_full_dry_kg
        - actual_nonpaper_adjunct_kg
        - actual_net_thermal_paper_kg
        - wrapping_BOM
        - wrapping_dry_kg
        - transport_carton_BOM
        - transport_carton_dry_kg
        - opening_unprinted_paper_kg
        - closing_unprinted_paper_kg
        - opening_printed_WIP_kg
        - closing_printed_WIP_kg
        - printed_WIP_source_ID
        - original_paper_source_ID
        - printing_meter_ID
        - printing_energy_share_MJ
        - prior_assigned_paper_kg
        - prior_assigned_printing_MJ
        - unallocated_WIP_paper_kg
        - unallocated_WIP_printing_MJ
        - original_pool_version
        - replacement_contribution_ID
        - unused_return_kg
        - issued_receipt_kg
        - test_void_scrap_kg
        - transferred_printed_kg
        - all_beneficiary_paper_draw_kg
        - all_beneficiary_solution_draw_kg
        - component_background_scope_ids
        - provider_mode
        - original_package_id
        - original_package_quantity
        - original_package_unit
        - package_background_scope_id
        - source_component_kg
        - collection_contract_id
        - admitted_materials
        - sorted_composition_kg
        - retained_component_stock_kg
        - customer_handover_kg
        - Q
      output: "Disjoint raw complete bottle/core/wrap/carton and net-paper kg; one manufacturing attribution and source-carrier reconciliation before /Q"
      source_ids:
        - src_bottle_spec
        - src_receipt_roll
        - src_ghg
  data_quality_requirements:
    - id: q_identity
      applies_to: "all"
      requirement: "Each unbound row requires original official response/receipt, exact hash, observed state, bilingual name, product/waste/elementary type, qualifiers, compartment, property-unit chain and matching foreground provider. Electricity identity does not identify a grid supplier. No invented UUID or batch mass."
      evidence: "Row-specific binding checklist and source/provider matrix; unresolved is unverified, not zero"
    - id: q_measurement
      applies_to: "all"
      requirement: "All protocols require complete raw records, identified collector/responsible reviewer, timestamp, coverage, calibration/check mass, meter topology and uncertainty. Missing/absent/observed zero are distinct. Signed survey supports each excluded route; additional actual materials or equipment need named atomic cards before completed use."
      evidence: "Signed raw ledgers, calibration and scope reconciliation over all beneficiaries and complete pool"
    - id: q_assets
      applies_to: "assets"
      requirement: "Complete-unit packages must be evidenced stage by stage for actual whole installed object and all maintenance/EOL carriers; no double-counted building/fixture/device components or operating electricity. Missing model, whole-mass history, positive known full-life exposure, signed revision or beneficiary coverage blocks completeness."
      evidence: "Engineer/supplier signed exact package scope, serial ledger and lifetime version/delta ledger"
    - id: q_bilingual
      applies_to: "all"
      requirement: "Both languages must preserve each card identity, direction/type/state, condition, negation, unit, denominator, formula, responsibility and mandatory completion condition. Parsed arrays, protocol process IDs and stable references must all agree."
      evidence: "Actual bilingual semantic review and parsed business-array comparison"
validation_rules:
  - rule_id: v_accept
    applies_to: "all"
    rule: "Reject mixed/unknown construction, unmatched pairs, missing acceptance or inconsistent corrected Q; keep zero pools explicitly unnormalizable. Physical stock, background S/F/T/O and financial ledgers reconcile independently with actual dates."
    source_ids:
      - src_un
      - src_ghg
  - rule_id: v_inventory
    applies_to: "all"
    rule: "Require every present row and route, complete raw attribution, one final normalization, no overlapping meter/package/provider scope and complete observed destinations. Conditional absence requires signed evidence; unknown quantity/identity/destination/package is incomplete, not not_applicable or zero."
    source_ids:
      - src_retail
      - src_ghg
  - rule_id: v_assets
    applies_to: "assets"
    rule: "Reconcile all serial exposures and lifecycle package stages over every beneficiary; cumulative responsibility<=1, signed lifetime revision replaces old allocations, terminal residual once. A complete capital package cannot coexist with duplicate component/EOL foreground exchanges."
    source_ids:
      - src_ghg
published_dataset_profile:
  dataset_role: "candidate partial incremental foreground retail methodology with mandatory common-support completion"
  downstream_use: "secondary_dataset; background_dataset after identity, collection, provider and methodology review"
  allowed_use: "One declared same-configuration matching-pair service with separate receiving-background coupling"
  excluded_use: "All-footwear equivalence, sole production, consumer wearing, automatic legal compliance or unverified completed inventory"
  required_metadata: "All reference qualifiers, pool/cutoff/version, physical history, BOM/species/state, S/F/T/O original-gate responsibility, scope/provider IDs, asset lifetime and measurement uncertainty"
  required_quality_disclosure: "Unbound identities, missing raw/provider evidence, absent-route proof, allocation uncertainty, zero pools and package lifetime revisions"
  update_trigger: "SKU/species/size/construction, route/provider/cleaner/packaging, return gate, meter scope, asset/revised lifetime or source change"
data_sources:
  - id: "src_un"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0, subclass62134 explanatory note, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62134"
    used_for: "Classification includes groups293–296; this PCR is a narrower construction/route, not full equivalence"
  - id: "src_clarks"
    type: "literature"
    reference: "Clarks SS16 In-Season Catalogue2016, PDF35/printed33, Stratton Way26102520/26102519; https://clarks.scene7.com/is/content/clarks/Americas/US/B2B/Marketing/SS16/Catalog/Dual%20Gender%20Independent%20CatalogSS16.pdf"
    used_for: "Historical leather-upper rubber-sole casual construction and multiple sizes/widths; no current supply, bovine species, mass, formulation or return-policy default"
  - id: "src_label"
    type: "official_guidance"
    reference: "UK Government, Footwear labelling, web snapshot2026-10-28; https://www.gov.uk/guidance/footwear-labelling"
    used_for: "UK-market guidance distinguishes upper, lining/sock, outer sole; material labels do not supply a mass BOM or universal legal approval. Actual applicability/jurisdiction separately checked."
  - id: "src_retail"
    type: "official_guidance"
    reference: "European Commission JRC, Best Environmental Management Practice in the Retail Trade Sector, EUR25998EN2013, executive summary and energy/waste/water chapters; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Retail scope relevance of electricity, water, chemicals, logistics and waste; no inventory benchmarks. Specific gates, cleaner route and collection/allocation equations are declared PCR designs requiring foreground evidence."
  - id: "src_ghg"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard2011, chapters6–7,9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Unit-of-analysis and allocation hierarchy principles; PCR-specific asset/ownership equations are disclosed design choices, no full-standard conformity claim"
  - id: "src_bottle_spec"
    type: "literature"
    reference: "Heres Plastics, HP7013 Bottle2000ml product specification, original web snapshot2026-10-28; https://www.heresplastics.com/en/products/bottles/1195-bottle-2000ml-hdpe-hp7013"
    used_for: "Manufacturer lists HDPE body, tamper-evident closure and label dimensions separately; supports component-scope checking only. It does not prove this store bottle/closure/label BOM or complete dry mass, and no stated weight or capacity is adopted."
  - id: "src_receipt_roll"
    type: "literature"
    reference: "Wedderburn, Thermal Receipt Roll57x45x12, original web snapshot2026-10-28; https://www.wedderburn.com.au/product/available-for-purchase/consumables/thermal-receipt-roll/"
    used_for: "Supplier describes thermal paper mounted on cardboard core; supports paper/core distinction only. No paper/core mass, printer compatibility, actual grade or wrapping/carton BOM default is transferred; those remain source-lot foreground measurements."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:9b8364401159c9926104cca97a66759e03bca6447d8b001e863ded2baeb5b01b"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6343"
      family: "system_boundary"
      span:
        start:
          offset: 6343
          line: 56
          column: 1
        end:
          offset: 11422
          line: 77
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Shoes and original packaging physically received at the store gate with supplier manufacture and inbound freight backgrounds identified separately; gross receiving events are not the service output. |\n| starting_condition_role | Incremental retail service with explicit receiving-gate merchandise background coupling; not a shoe-manufacturing dataset. |\n| product_classification_scope | Only the declared narrower 62134 construction and counter route; groups 294/295/296 do not become equivalent to this scope. |\n| recursive_input_rule | No same-category retail-service input is silently replaced by the current output. External retail steps require a separately delimited service and no overlap. |\n| upstream_dataset_requirement | Attach each receiving lot original product/packaging and inbound freight background at actual gate, original quantity and version. Successful sold goods stay separately attachable as B_S/Q; retail-caused irrecoverable failure B_F/Q enters this service. Supplier/internal transfer B_T and open stock B_O retain an explicit signed owner, never disappear. |\n| disclosure | Publish incremental service plus separate B_S, B_F, B_T, B_O reconciliation, original gross events, actual dates and cutoff/version; no full shoe life-cycle or legal conformity claim. |\n\n| rule_id | Rule | Applies to | source_ids |\n| --- | --- | --- | --- |\n| b_scope | The declared construction and route are eligibility gates. Only original matched pairs qualify: retain original_pair_id and left/right_source_id. Re-pairing shoes from different original pairs is outside this route and blocks completeness until a separately reviewed extension allocates each original shoe background and all leftover singles. Same-label shoes with different animal species, sole compounds, sizes or widths form separate homogeneous pools; no sport/part/service expansion from classification breadth. | all | src_un; src_clarks; src_label |\n| b_operations | Include receipt inspection, storage, fitting bench/mirror, try-on resources, lighting, checkout/POS, electric resistance fan heating, cleaning, packaging, returns and actual residual transfers. The all-electric route excludes combustion only with signed site inspection and utility evidence; all observed outgoing supplier/internal handover and waste-carrier backgrounds must declare whether pickup/haul and treatment are included. Verify provider actual loaded and empty routes, distance, gross load and idle time; an empty route is not zero activity because t*km=0. Missing provider transport scope or additional observed substances/transport require atomic cards, single-process protocols and bilingual sync before completeness. | all | src_retail |\n| b_assets | Each asset card is one evidenced complete-unit lifecycle provision package: manufacturing, installation, non-operational maintenance/replacements and terminal treatment for the specified asset only. Exclude its operating electricity, cleaning and merchandise from that package. Building shell excludes all separately listed fixtures, bench, mirror, POS, luminaires and fan-heater. Maintenance replacements mean parts only, never a complete successor asset: a whole replacement gets its own new serial and lifetime history, with no duplicate package-contained part exchange. No package is presumed available: missing signed scope/model, lifecycle mass/carrier evidence or missing actual equipment blocks completed dataset use. | assets | src_retail; src_ghg |\n| b_background | Maintain original receiving backgrounds once per uniquely traced shoe and packaging component: B_in+B_opening=B_S+B_F+B_T+B_O. Money credits cannot move physical goods or change ownership without evidence. No-sale failures remain in the prospectively fixed pool. Unworn transfer and damaged waste/retained-failure carriers have different actual destinations/states; do not infer waste from a refund. | retail; residual | src_ghg |\n| b_completion | Mandatory common support modules cover actual administrative/back-office work, transaction-network/remote IT, omitted facility support and actual extra equipment. For each module: fix provider/site/process and same pool/version; enumerate atomic actual utilities/materials/carriers, direct raw meters/invoices/stock and event ledgers, actual complete-unit assets under c_assets, provider operation/maintenance/EOL scope and absence evidence. Record collector/time/unit/calibration/coverage and all beneficiaries. Direct subdivision first; shared active administration by observed task seconds and remote transaction service by actual message/transaction counts; retain idle support via occupied support area-hours and all closed/failed periods. Unknown scope or zero/unknown all-beneficiary driver blocks completion. No unnamed combined resource flow may stand in for these module exchanges; each module must expose parsed cards, protocols, formulas, raw numerators and evidence before aggregation. | all | src_ghg; src_retail |\n\n"
