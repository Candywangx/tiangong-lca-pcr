allocation_rules:
  - rule_id: full_pool
    applies_to: "all inventory rows"
    rule: "Subdivide by meters and unique events first. For a shared source total Q and causal driver x, attributable Q_i = Q*x_i/sum(x_j) over every actual beneficiary, including other store departments, failed cohorts, idle and closed periods. Use cold occupied m3-hours with declared vacancy standby capacity, sanitation measured task-time and store lighting occupied m2-hours; verify the physical relationship and include every beneficiary in the denominator. Do not allocate merely by successful apple sales or omit zero-driver intervals."
    source_ids:
      - ghg-product
  - rule_id: idle_zero
    applies_to: "all inventory rows"
    rule: "Prospectively declare a same-cultivar/grade/route/configuration pool and observation period covering complete receiving cohorts and return resolution. Assign zero-driver standby by reserved capacity shares declared before outcomes; reconcile full Q including idle/closed time. Keep all failed and zero-sale cohorts and their actual burdens in this pool. A wholly zero-output pool has raw totals and unresolved normalization, never a zero service intensity or deletion; combine only with a prospectively justified same-configuration pool."
    source_ids: []
  - rule_id: persistent_assets
    applies_to: "assets"
    rule: "Maintain one persistent asset and package ledger across every period and beneficiary: unique serial/package ID, full manufacturing/installation burden, actual service history, expected lifetime capacity, earlier cumulative fractions and residual. Assign period fractions against total life capacity; cumulative fractions must not exceed one, and allocate the terminal residual with documented beneficiaries. A lifetime revision recalculates remaining responsibility and corrections to earlier allocations without restarting manufacture. Manufacture/installation, operation, inspection, replacements and end-of-life scopes are disjoint. maintenance_service represents evidenced purchased inspection labour h ONLY; complete work-order count is not its quantity. Actual travel, consumables, tool manufacture/terminal carriers and replacement parts use their specific separate cards. Labour background excludes those sources; reverse the old full package before installing the split, never retain both. Attribute inspection labour and its actual event physical sources by all-beneficiary asset exposure during the supported work-order cycle, without another whole-device manufacturing-lifetime fraction; an inspection tool own manufacture/terminal follows its separate all-history lifetime ledger. Quantify physical replacements by their own complete-product cards."
    source_ids: []
  - rule_id: no_coproduct_credit
    applies_to: "retail"
    rule: "The physical apple carriers are not additional retail services or allocation co-products. Donation, markdown, supplier credit, disposal proceeds and financial refund do not create a second functional output or an avoided-production credit. Keep physical return events separate from money events."
    source_ids: []
  - rule_id: split_attribution
    applies_to: "maintenance_service; split_inspection_glove; split_inspection_glove_waste; split_leak_detector; split_leak_detector_waste; split_support_electricity; split_support_travel"
    rule: "Prefer exclusive direct measurements. For shared cleaning events attribute each raw physical quantity by actual cleaned area-events across all beneficiaries; for maintenance use the repaired asset physical driver over all beneficiaries of the actual supported work-order cycle. Retain idle, failed, closed and zero-driver loads and their original carryover rules, never discard them using sales. New tool manufacture/retirement uses persistent lifetime ledgers and historical revision deltas; installed replacement parts are charged once to their actual maintenance event, not again as an original whole-asset acquisition. Do not reapply a share to an already-attributed source or charge terminal tools only to the retirement period. Remove any contained quantity from its old background or replace the entire package with this split; never characterize both."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "failed_apples; retail_service"
      record_type: "traceable cohort/event and weighing ledger"
      raw_fields: "site; pool; cohort; unique lot/sub-lot; cultivar; grade; origin; receiving condition; wet mass; tare; receipt time; sale/physical-return/resale IDs and times; net accepted mass; financial refund flag; final fate; paired receiving/fate weight; moisture sample; dry matter; respiratory correction; B_s; B_f; opening/closing stock; background boundary"
      collection_method: "Calibrated net scales at receiving and checkout; identity-linked paired sublot weighing and representative moisture/dry-matter tests at each change; scan every movement; retain quality acceptance and supplier background records. Aggregation obligations: Close all stock and fate histories; calc_service and calc_goods_background establish D and disjoint gate responsibility; per 1 kg reference flow after one normalization."
      unit: "kg"
      frequency: "every receipt, handoff and return; daily stock; matched state-change sampling"
      temporal_coverage: "all receiving cohorts to final fate, with retrospective late-return updates"
      site_scope: "receiving gate, cold room, display, checkout and returns desk of one store"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration/test weights; POS-to-stock reconciliation; sample representativeness; signed acceptance; complete original/corrected pool ledger"
    - protocol_id: cp_fates
      process_id: "retail"
      flow_role: "donated_apples; supplier_return_apples; apple_waste; carton_waste; pe_bag_waste"
      record_type: "dispatch and residual ledger"
      raw_fields: "site; pool; cohort; event_ID; date; carrier; condition; wet/gross/tare/net kg; moisture; recipient; onward function; treatment route; custody; background owner; package source_ID"
      collection_method: "Calibrated weighing at each donation, supplier or waste handoff; inspect carrier segregation and obtain signed receiver/treatment records; reconcile with cp_goods original event IDs. Aggregation obligations: Sum each physical carrier once by unique event, attribute to original pool and divide once by D under calc_normalize."
      unit: "kg"
      frequency: "every handoff; daily segregated-residual checks"
      temporal_coverage: "complete pool including failed/zero-sale cohorts and late returns"
      site_scope: "store dispatch and waste collection handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; moisture evidence; receiver signatures; waste contracts; upstream package overlap check"
    - protocol_id: cp_retail_energy
      process_id: "retail"
      flow_role: "retail_electricity"
      record_type: "single-process meter view"
      raw_fields: "meter_ID; parent_meter_ID; circuit; timestamp; opening/closing kWh; calibration; full beneficiary drivers; vacancy standby; excluded circuit IDs"
      collection_method: "Read circuit logger at store, check against utility invoice/main meter, inspect coverage; retain original meter events but select only this process view. Aggregation obligations: calc_electricity then full_pool allocation and calc_normalize; views must not duplicate source kWh."
      unit: "kWh"
      frequency: "continuous logger; interval and invoice reconciliation monthly"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "named retail circuits"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter certification; missing-interval log; full denominator; main/submeter reconciliation"
    - protocol_id: cp_cold_energy
      process_id: "cold"
      flow_role: "cold_electricity"
      record_type: "single-process meter view"
      raw_fields: "meter_ID; parent_meter_ID; circuit; timestamp; opening/closing kWh; calibration; full beneficiary drivers; vacancy standby; excluded circuit IDs"
      collection_method: "Read circuit logger at store, check against utility invoice/main meter, inspect coverage; retain original meter events but select only this process view. Aggregation obligations: calc_electricity then full_pool allocation and calc_normalize; views must not duplicate source kWh."
      unit: "kWh"
      frequency: "continuous logger; interval and invoice reconciliation monthly"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "named cold-room circuit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter certification; missing-interval log; full denominator; main/submeter reconciliation"
    - protocol_id: cp_consumables
      process_id: "retail"
      flow_role: "sodium_carbonate; pe_bag"
      record_type: "material issue and stock records"
      raw_fields: "site; lot; product; formulation; dry/wet basis; moisture; active concentration; beginning/purchased/ending stock; issue; actual bag mass; beneficiary task; event_ID"
      collection_method: "Weigh actual pure anhydrous powder and LDPE bags separately; verify supplier composition; inventory-balance each material; record unused/damaged bags separately. Aggregation obligations: Reconcile initial + purchased - closing - external transfers to actual consumption; allocate each material once then calc_normalize."
      unit: "kg"
      frequency: "each issue and delivery; period-end stock count"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "apple bag dispenser and sanitation store"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scale; composition sheet; receipts; stock reconciliation; absence inspection"
    - protocol_id: cp_water
      process_id: "retail"
      flow_role: "cleaning_water; cleaning_effluent"
      record_type: "independent supply/discharge meter and balance"
      raw_fields: "meter_ID; date; actual whole wastewater m3; import m3; temperature; measured density kg/m3; wastewater composition; w_water; opening/closing stored water; internal reuse; measured evaporation; other water transfers; allocation tasks"
      collection_method: "Read separate store supply and sewer-handoff meters, sample density and composition for corresponding conditions, calibrate meters and cross-check supply invoice; inspect sanitation-only route. Aggregation obligations: Direct whole-liquid metering and water-component reconciliation under calc_water only; missing measurements are incomplete; full_pool attribution and calc_normalize once."
      unit: "m3; kg/m3; kg"
      frequency: "each meter interval and cleaning event; representative condition-change samples"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "store inlet, apple cleaning task and sewer handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/density calibration; samples; invoice; complete supply/storage/evaporation/discharge reconciliation"
    - protocol_id: cp_respiration
      process_id: "retail"
      flow_role: "respiration_oxygen; fruit_water_vapour; respiration_co2; fruit_ethylene"
      record_type: "matched sublot respiration and moisture observations"
      raw_fields: "sublot_ID; cultivar; state; maturity; timestamp; actual trial wet/dry mass m_trial; M_state_t inventory kg; temperature; humidity; gas_temperature; gas_pressure; absolute C_in_s and C_out_s; F_in and F_out; measured gas-conversion chain; signed r_blank_s; detection limit; residence interval_ID"
      collection_method: "Use the raw absolute-concentration, calibrated matched sublot method and exact trial-mass/rate/exposure conversion in calc_respiration. Preserve measured raw inlet/outlet, blank and kg wet trial mass; output raw E_s internal source kg for calc_air_boundary only, never terminal elementary kg. Aggregation obligations: Raw source E_s remains linked to the final per 1 kg reference flow protocol view; only validated actual terminal kg is attributed and divided by D once under calc_air_boundary."
      unit: "kg; h; degree C; kg/m3; m3/h; kg/(kg*h)"
      frequency: "continuous environmental log; matched trials at each state/configuration change"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "apple sublots, cold room and ambient display"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "instrument zero/span and gas standards; blanks; representativeness; water/carbon/dry-matter closure; uncertainty"
    - protocol_id: cp_refrigerant
      process_id: "cold"
      flow_role: "r134a_charge; r134a_recovered; r134a_air"
      record_type: "species stock and maintenance balance"
      raw_fields: "asset_ID; cylinder_ID; species/composition; tare; dates; opening/closing equipment/cylinder kg; acquired; recovery; sealed transfers; commissioning; calibration; beneficiary cold capacity; T_nonrecovery dispatch_IDs; R_recovered dispatch_IDs; disjoint-set check; recovery-vessel opening/closing stock; capture_stage; capture_already_in_balance_IDs; additional_capture_IDs; actual exterior species flux; room-air stock change"
      collection_method: "Weigh cylinders and recovered refrigerant and obtain equipment charge/service records; independently check equipment stocks and all transfers at same cutoff. The cold-process view of the shared original exterior-air ledger verifies R134a only, retaining distinct source/terminal and capture IDs without duplicating retail species records; use calc_air_boundary. Aggregation obligations: calc_refrigerant; retain full-system balance then full_pool share and calc_normalize; no netting recovered material twice."
      unit: "kg"
      frequency: "every charge/recovery/transfer; period-end full stock"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "R134a plant and connected cylinders in cold-room service"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "label/composition; calibrated scales; service signoff; cylinder register; closed stock balance"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "cold_assembly; cold_assembly_waste; retail_building; checkout_pos; weighing_scale; apple_display_rack"
      record_type: "persistent asset and bounded package ledger"
      raw_fields: "serial/package_ID; full equipment specification; original burden; dry complete mass; refrigerant exclusion; installation scope; all beneficiaries/periods; capacity; life revisions; cumulative fraction; remaining fraction; work order; replaced parts; disposal receipt; asset_kind; reserved_capacity; exposure_interval; H_a_i; actual past exposure; remaining justified exposure; L_a; f_a_i; terminal component fates; module overlap matrix; terminal_mass_mode; direct_remaining_net_kg; full_dry_component_BOM; removed_part_IDs/masses; same-equipment boundary; tare/calibration"
      collection_method: "Inspect nameplate/specification and supplier package, weigh whole terminal assembly after documented gas recovery; audit lifetime ledger and signed inspection events against invoices. Inventory every building, POS, weighing scale, rack and complete cold room including shared/leased assets. Measure full lifetime exposure and actual terminal whole-asset quantity; obtain disjoint manufacture/installation/terminal boundaries for each module. Enforce the exclusive direct-net versus measured-BOM modes in calc_assets; a directly weighed remaining assembly is not reduced again for removed parts or recovered gas. Aggregation obligations: calc_assets then calc_normalize; manufacturing fraction, event inspection and terminal mass remain disjoint; persistent cumulative fractions at most one."
      unit: "Item(s); kg"
      frequency: "each asset/inspection/disposal event; each period and lifetime revision"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "one store asset and all prior/current/future beneficiaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original supplier boundary; serial ledger; cross-period reconciliation; complete-unit scale; work orders and treatment acceptance"
    - protocol_id: cp_store_air
      process_id: "retail"
      flow_role: "respiration_oxygen; fruit_water_vapour; respiration_co2; fruit_ethylene"
      record_type: "actual exterior species flux and source-to-terminal reconciliation"
      raw_fields: "species; source_sublot_ID; raw E_s; boundary_path_ID; actual time; gas temperature/pressure; absolute inlet/outlet concentration kg/m3; inlet/outlet flow m3/h; calibration; other-store-source_ID; capture_ID; captured species kg; carrier_ID; opening/closing gas, condensate and sorbent stock; transformation evidence; original pool_ID"
      collection_method: "Measure actual exterior paths with calibrated species/flow instruments and temperature/pressure conversions, matched non-fruit source observations and source-linked capture/stock samples. Link cp_respiration source records without repeating chamber corrections. Inspect all ventilation, recirculation, evaporator, drain and capture devices; unknown paths/capture are incomplete. Aggregation obligations: calc_air_boundary verifies net external species kg before full_pool attribution and one calc_normalize; each source, capture, stock and carrier event is used once."
      unit: "kg; kg/m3; m3/h; h"
      frequency: "continuous matched source/exterior intervals; every capture/drain event; opening/closing stocks"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "store exterior air boundary and traced indoor apple-source compartments"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "species/flow calibration and gas standards; whole-path coverage; signed drain/capture records; independently closed source-to-terminal mass balance; uncertainty"
    - protocol_id: cp_cold_water
      process_id: "cold"
      flow_role: "cold_condensate"
      record_type: "condensate and defrost liquid handoff ledger"
      raw_fields: "drain_ID; event_ID; date/time; whole-liquid m3; actual density kg/m3; temperature; dissolved/suspended composition; measured water fraction; opening/closing condensate/ice stock kg; fruit-source capture attribution; source split meters; common carrier_ID; direct weighed kg; calibration"
      collection_method: "Directly weigh the actual sewer-handoff liquid, or directly meter whole-liquid volume and condition-specific measured density using one exclusive mode. Sample its water/species fractions and retained ice/liquid, reconcile defrost and drain events. If physically co-mingled with cleaning_effluent at one meter, preserve upstream actual source meters and the one common carrier, assign disjoint shares once and reconcile their sum; missing split evidence is incomplete. Aggregation obligations: Measured net whole-liquid carrier kg, with capture/storage reconciliation under calc_air_boundary; full_pool attribution then one calc_normalize; never add captured species kg as duplicate carrier mass."
      unit: "kg; m3; kg/m3"
      frequency: "each defrost/drain event and meter interval; opening/closing liquid/ice stock"
      temporal_coverage: "all operating, idle, closed and failure intervals in the declared pool period"
      site_scope: "cold-room evaporator drain through actual sewer handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scale/drain meter and density samples; water/species analysis; defrost logs; stock reconciliation; common-carrier dedup proof"
    - protocol_id: cp_split_labour_assets
      process_id: "assets"
      flow_role: "maintenance_service"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
    - protocol_id: cp_split_support
      process_id: "split_support"
      flow_role: "split_inspection_glove; split_inspection_glove_waste; split_leak_detector; split_leak_detector_waste; split_support_electricity; split_support_travel"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
