  calculation_rules:
    - id: calc_service
      applies_to: "retail_service"
      rule: "D is the sum of final accepted net wet apple kg at the customer gate in the closed pool, reversing physically returned acceptance, then adding a resale only at its new final acceptance. Refusal, repeated handling, internal transfers, failed sales and donations are not service output; money-only refunds do not change D. Reference output is 1 kg."
      inputs:
        - accepted_mass
        - physical_returns
        - resale_acceptance
        - cp_goods
      output: "D; reference output"
      source_ids: []
    - id: calc_goods_background
      applies_to: "failed_apples"
      rule: "For each traced receiving cohort k, use calibrated paired receiving and fate weights plus measured moisture/dry-matter observations on matched sublots to assign receiving-equivalent B_s,k to ultimately sold fruit; report the measured transition relation including respiratory dry-matter loss and moisture change. Do not treat shrink water as wet discarded apples or assume final kg equals receiving kg. B_f,k = R_k - B_s,k after all unique fruit in that closed cohort reaches final fate; R_k is actual received wet kg. Retain all lost units, rejected/donated/supplier-returned fruit and receiving-equivalent shrink not attributable to ultimately successful fruit in B_f,k. Document a disjoint receiving-mass ownership partition with B_s + B_f = R, including shrink of successful fruit in B_s, not also B_f. Direct identity-linked paired weighing is preferred; a dry-matter mapping may be used only with independently measured respiratory dry-matter changes, representative sampling and uncertainty. Missing transition evidence blocks background coupling."
      inputs:
        - R_k
        - fate_mass
        - paired_weights
        - moisture
        - respiratory_dry_loss
        - cp_goods
        - cp_respiration
      output: "B_s; B_f; B_f/D service background; B_s/D downstream coupling"
      source_ids: []
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For each non-reference row divide its complete attributed raw total by D exactly once after state/unit conversions. Record raw source total, allocation share, attributed numerator and final result; a preallocated or already normalized supplier amount must be restored to a consistent raw basis or documented as final, never allocated/normalized twice. D must be positive."
      inputs:
        - raw_total
        - attributable_share
        - D
        - cp_goods
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: calc_electricity
      applies_to: "retail_electricity; cold_electricity"
      rule: "Convert measured point-of-use kWh to MJ using 1 kWh = 3.6 MJ before allocation and one division by D. Subtract the evidenced cold-room circuit from the retail main-meter pool before retail allocation; do not deduct it from a retail submeter already excluding it. Specify supplier geography, year, voltage, supply mix and transmission-loss boundary in the linked background."
      inputs:
        - kWh_retail
        - kWh_cold
        - source_meter_boundary
        - D
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: calc_water
      applies_to: "cleaning_water; cleaning_effluent"
      rule: "Supply mass = V_import*rho_supply; whole wastewater handoff mass = V_discharge*rho_discharge, using separate direct meters and measured densities at recorded temperature/composition. Direct wastewater volume is the entire liquid waste mixture, including dissolved detergent and entrained apple solids, not an inferred water volume. Sample its water mass fraction w_water for the separate water-component balance: imported water + opening stored water = closing stored water + water component of whole effluent + independently measured evaporation + other documented water transfers; internal reuse cancels. Use water component = whole effluent mass*w_water, never replace whole effluent exchange by this water component. Imports already exclude internal reuse, and directly measured discharge is not reduced again for evaporation. This PCR permits direct discharge metering only: missing meter/density/composition records make the result incomplete; no reconstructed effluent amount is authorized."
      inputs:
        - V_import
        - rho_supply
        - V_discharge
        - rho_discharge
        - w_water
        - temperature
        - stored_water
        - measured_evaporation
        - other_water_transfers
        - D
        - cp_water
      output: "kg water and kg effluent per 1 kg reference flow"
      source_ids: []
    - id: calc_refrigerant
      applies_to: "r134a_charge; r134a_recovered; r134a_air"
      rule: "R134a released = opening equipment and cylinder stock + acquisitions - closing equipment and cylinder stock - T_nonrecovery - R_recovered. Weigh all terms in kg of pure R134a at one cutoff. T_nonrecovery means only sealed refrigerant transfers sent out for direct reuse/sale without reclamation; R_recovered means only weighed material sent out for reclamation under r134a_recovered. These are disjoint dispatch event-ID sets and their intersection must be empty; recovered dispatch is never deducted in T_nonrecovery. Internal cylinder/equipment/recovery-vessel transfers cancel and are not outward dispatches. Resolve commissioning, residues and terminal stock; keep purchases and recovery as distinct measured inventory exchanges. Attribute species release and acquisitions to full beneficiaries, then divide by D once; equipment manufacture excludes charge. This stock balance is the raw kg source reaching room air after any capture already represented by the same contained stocks or recovery dispatches; identify those capture event IDs explicitly. It is not automatically an exterior elementary emission. Include recovery-vessel stocks at both cutoffs, reconcile stage of capture, and pass the raw balance to calc_air_boundary for external release and room-air storage corrections. Do not subtract in calc_air_boundary a capture already included in closing contained stock or R_recovered; any additional measured capture outside this stock ledger must have a disjoint event ID."
      inputs:
        - opening_stock
        - acquired
        - closing_stock
        - T_nonrecovery
        - R_recovered
        - dispatch_event_IDs
        - D
        - cp_refrigerant
      output: "R134a supplied/recovered kg per reference; raw stock-balance source kg for calc_air_boundary"
      source_ids: []
    - id: calc_respiration
      applies_to: "respiration_oxygen; fruit_water_vapour; respiration_co2; fruit_ethylene"
      rule: "Use one raw-absolute-concentration mode only. For each instrumented sublot/condition interval measure absolute species mass concentrations C_in,s and C_out,s in kg/m3 and matched inlet/outlet volumetric flows F_in and F_out in m3/h at actual recorded gas temperature/pressure; retain the measured conversion from instrument mole/volume fractions to these concentrations. r_s = sigma_s*(F_out*C_out,s - F_in*C_in,s) - r_blank,s in kg/h for the entire measured sublot; sigma_s=+1 for CO2, ethene and water vapour and -1 for oxygen uptake. r_blank,s is the matched empty-chamber net rate with the same sign convention. Subtract inlet concentration and blank once each; do not additionally subtract ambient background, and do not use a supplier rate already inlet/blank corrected in this raw mode. Measure the sublot current wet mass m_trial in kg for that interval; k_s = r_s/m_trial in kg species/(kg wet apples*h). For each matching actual inventory state integrate E_s = integral k_s(state,t)*M_state(t) dt over actual wet apple inventory kg and residence hours, retain the resulting E_s as raw internal fruit source/uptake kg for calc_air_boundary; do not yet normalize or treat it as external emission. M_state(t) includes failed/returned and zero-sale inventory, never only final sold mass; each sublot measurement interval and actual inventory interval is used once. Independently check wet/dry-matter/water/carbon balance; blank mismatch, negative unexplained net rates, unsupported gas conversion or missing representative state data remain unresolved. No further division by trial mass, final apple mass, or occupancy is permitted."
      inputs:
        - C_in_s
        - C_out_s
        - F_in
        - F_out
        - gas_temperature
        - gas_pressure
        - measured_gas_conversion
        - sigma_s
        - r_blank_s
        - m_trial
        - M_state_t
        - residence_intervals
        - cp_respiration
        - D
      output: "E_s raw internal source/uptake kg; k_s kg species/(kg wet apples*h)"
      source_ids: []
    - id: calc_assets
      applies_to: "cold_assembly; cold_assembly_waste; retail_building; checkout_pos; weighing_scale; apple_display_rack"
      rule: "For each asset a and period-beneficiary i, measure exposure H_a,i as reserved-capacity*time over every actual operating, idle, closed and failed interval. Use cold-room reserved internal m3*h, building reserved gross floor m2*h, POS reserved checkout-station h, scale reserved weighing-station h and rack reserved shelf m2*h. All beneficiaries, including other store departments, enter the same asset ledger. L_a is the declared complete lifetime exposure in the same units: measured past exposure plus justified remaining exposure; f_a,i = H_a,i/L_a. Apply f_a,i once to the one complete asset manufacturing/installation burden. For the cold-room terminal waste carrier, q_terminal,a,i = measured whole dry terminal assembly kg*f_a,i using the same fraction, not another period share; its treatment burden is linked once. Building, POS, scale and rack full asset background modules include their own evidenced terminal deconstruction/treatment with actual whole-asset quantities and component fates; apply f_a,i once to each full module, never add their terminal waste/treatment again to foreground. At actual retirement set L_a to measured total lifetime exposure, reconcile sum_i H_a,i=L_a and sum_i f_a,i=1, allocate residual and issue versioned differences correcting prior fractions. Each revised L_a recalculates all cumulative fractions and the remaining ledger; never restart a full asset or allocate a terminal burden twice. Actual signed inspection events are separate, attributed over full period beneficiaries by reserved cold capacity and normalized once. Missing asset totals, past fractions, remaining exposure or terminal boundary evidence blocks completeness. Terminal mass uses one recorded exclusive mode: direct calibrated net weighing W_direct is the remaining whole assembly after refrigerant and removed parts have already left; do not subtract their mass again. Only when direct weighing is unavailable may a measured component-BOM reconstruction use W_BOM = sum(full dry component masses) - sum(uniquely removed dry component masses); document the same equipment, recovery/tare boundary and remaining parts, never deduct refrigerant from an already refrigerant-free dry BOM. Do not combine W_direct and W_BOM or apply removed_part corrections to W_direct. Set terminal_mass to the one selected net quantity, then apply f_a,i and D once; removed components have separate actual carrier accounting with no duplicate whole-assembly share. maintenance_service uses purchased labour h only under cp_split_labour_assets and c_split_quantity, never asset lifetime fractions or package counts."
      inputs:
        - asset_ID
        - H_a_i
        - L_a
        - f_a_i
        - past_exposure
        - remaining_exposure
        - full_asset_module
        - terminal_mass
        - inspection_events
        - D
        - cp_assets
        - terminal_mass_mode
        - W_direct
        - measured_full_dry_components
        - uniquely_removed_components
      output: "attributable items and kg per 1 kg reference flow"
      source_ids: []
    - id: calc_late_return
      applies_to: "all inventory rows"
      rule: "A late physical return reopens the original cohort/pool version: reverse its earlier accepted kg, append actual reverse-handling, storage, sanitation, packaging, disposal and other incremental burdens to that original numerator, revise B_s/B_f and physical fates, then recompute every normalized row. Keep event dates, prior values and delta receipts; do not also allocate those events to a new cohort. Resale preserves the same unique goods history and counts only its final acceptance. Money-only refunds update finance, not physical fate or D."
      inputs:
        - original_cohort_ID
        - return_event_ID
        - original_numerator
        - incremental_events
        - revised_D
        - revised_fates
      output: "versioned corrected original-pool exchanges"
      source_ids: []
    - id: calc_air_boundary
      applies_to: "respiration_oxygen; fruit_water_vapour; respiration_co2; fruit_ethylene; r134a_air"
      rule: "The store exterior is the elementary-flow boundary; fruit-to-indoor-air, cold-room-to-sales-floor, evaporator condensation and recirculation are internal transfers. Retain the wet-state mapping and raw absolute-concentration formula in calc_respiration. Use G_s=E_s for fruit CO2, ethene and water source kg, and G_O2=-E_O2 for oxygen uptake; for R134a use the raw source from calc_refrigerant with its already-captured event set identified. For each species close N_s,air = G_s - C_s,additional - DeltaS_s - K_s, where C_s,additional is measured net species kg removed across a non-air boundary and not already deducted in G_s, DeltaS_s is closing minus opening attributable species inventory in indoor air, retained condensate/defrost water, absorbed/captured media and other declared internal stocks, and K_s is independently evidenced net chemical/biological transformation not already present in the fruit source. Document sign, source attribution and uncertainty for every term; uptake uses a signed oxygen deficit/stock change relative to the measured matched background. Captured but retained material is DeltaS, captured material discharged in a carrier is C, never both; internal cold-room/store recirculation cancels. Check this source-to-terminal balance against independently measured actual external inlet/outlet mass fluxes integral(F_out*C_out,s - F_in*C_in,s)dt at recorded gas temperature/pressure and every actual exterior vent/leak path, with measured non-fruit/store sources separated and attributed consistently. Concentrations must be absolute in the exterior verification too; ventilation volume alone is never a species emission factor. The chamber inlet/blank correction is already in E_s and must not be applied again to E_s; exterior inlet subtraction concerns the separate actual exterior-flux check, with other sources removed once by unique records. For positive release species inventory only verified N_s,air as elementary output; oxygen elementary input is verified -N_O2,air. Attribute the terminal kg across full beneficiaries and divide by D once. Unknown capture, unmeasured storage/transformation, missing boundary paths, unexplained sign or unclosed source-to-terminal balance is incomplete, not zero. Record actual absence of capture/transformation with equipment/operating evidence. Captured species in wastewater is part of its one measured whole-liquid carrier, not an additional elementary emission or duplicate solute waste."
      inputs:
        - E_s
        - G_s
        - C_s_additional
        - captured_event_IDs
        - DeltaS_s
        - K_s
        - actual_exterior_inlet_outlet_flux
        - other_store_sources
        - cp_store_air
        - cp_cold_water
        - cp_refrigerant
        - D
      output: "verified terminal species kg per 1 kg reference flow"
      source_ids: []
    - id: c_split_quantity
      applies_to: "maintenance_service; split_inspection_glove; split_inspection_glove_waste; split_leak_detector; split_leak_detector_waste; split_support_electricity; split_support_travel"
      rule: "For each exact identity r in its single unit, restore normalized source q_source with its original denominator D_source as x_raw=q_source*D_source; already-raw quantities are not restored again. Apply only missing attribution once under split_attribution, deduplicate source/event/version and reverse old package and historical versions. Sum disjoint raw quantities as X_r; q_r=X_r/D, dividing by the final reference denominator once. Labour uses measured purchased h only, never old order counts/area; in-house hours are QA only. Calculate asset counts, material kg, electricity kWh, vehicle*km and waste-carrier kg separately; never add across properties or multiply already-measured physical quantities by labour hours. Unknown quantity/identity/background blocks completeness."
      inputs:
        - X_r
        - D_source
        - q_source
        - D
        - cp_split_labour_assets
        - cp_split_support
      output: "q_r"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Verify each named flow against official state/type/name/medium/property/unit and actual use; retain candidate gaps explicitly. Electricity identity is provider-free point-of-use energy, not an electricity supply factor."
      evidence: "direct original identity records and row-specific binding decisions"
    - id: q_goods_state
      applies_to: "failed_apples; retail_service"
      requirement: "Do not release a complete result without traceable receiving-to-final wet-state mapping, dry-matter/respiration evidence, closed unique goods history and B_s+B_f=R ownership. Normal water loss and successful fruit respiration remain with the same successful fruit receiving equivalent."
      evidence: "paired calibrated weights, moisture trials, cohort ledger, background links"
    - id: q_coverage
      applies_to: "all processes"
      requirement: "Reconcile every meter, material, fate and asset source to full beneficiaries and the closed pool. Retain missing intervals as unknown; measured zero needs detection/absence evidence. Actual additional flows trigger atomic extension before completeness."
      evidence: "full source reconciliations, absence inspection, unresolved register and uncertainty"
    - id: q_traceability
      applies_to: "all inventory rows"
      requirement: "Keep location, actual period, method, calibration, original event IDs, conversions, allocation numerator/denominator, background boundary, correction version and one final normalization for each row. Protocol views never duplicate source events."
      evidence: "auditable raw-to-final calculation workbook and signed custody records"
    - id: q_media_boundary
      applies_to: "respiration_oxygen; fruit_water_vapour; respiration_co2; fruit_ethylene; r134a_air; cold_condensate"
      requirement: "Fruit respiration source terms and equipment stock losses are not exterior elementary emissions. Require species-specific source-to-terminal closure with measured capture, indoor/liquid/sorbent stock changes and independently verified exterior flux. Unknown capture/transformation is not zero. Condensed/defrosted water and dissolved captured species cross as one whole-liquid waste carrier; physically shared cleaning discharge is metered/attributed once. Direct terminal asset net weight is never reduced a second time for removed components."
      evidence: "raw source, exterior flux, capture/drain/stock and direct-net/BOM-mode evidence with unique IDs"
    - id: q_quantity_failed_apples
      applies_to: "failed_apples"
      requirement: "B_f / D by calc_goods_background and calc_normalize; retain receiving-state kg."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_goods"
    - id: q_quantity_retail_electricity
      applies_to: "retail_electricity"
      requirement: "Use the attributed raw total under calc_normalize; cp_goods fixes D."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_retail_energy"
    - id: q_quantity_cleaning_water
      applies_to: "cleaning_water"
      requirement: "V_import * rho_supply attributed once / D by calc_water; do not subtract internal reuse."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_water"
    - id: q_quantity_sodium_carbonate
      applies_to: "sodium_carbonate"
      requirement: "Use the attributed raw total under calc_normalize; cp_goods fixes D."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_consumables"
    - id: q_quantity_pe_bag
      applies_to: "pe_bag"
      requirement: "Use the attributed raw total under calc_normalize; cp_goods fixes D."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_consumables"
    - id: q_quantity_respiration_oxygen
      applies_to: "respiration_oxygen"
      requirement: "Only the verified actual terminal species kg under calc_air_boundary, after capture and internal stock/transformation reconciliation, attributed and divided by D once. Raw fruit source E_s is not this exchange."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_store_air"
    - id: q_quantity_retail_service
      applies_to: "retail_service"
      requirement: "1 kg of reference flow; calc_service; cp_goods."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_goods"
    - id: q_quantity_donated_apples
      applies_to: "donated_apples"
      requirement: "Use the attributed raw total under calc_normalize; cp_goods fixes D."
      evidence: "Raw source, attributed numerator, exact state conversion and final per-reference result; cp_fates"
    - id: q_quantity_supplier_return_apples
      applies_to: "supplier_return_apples"
