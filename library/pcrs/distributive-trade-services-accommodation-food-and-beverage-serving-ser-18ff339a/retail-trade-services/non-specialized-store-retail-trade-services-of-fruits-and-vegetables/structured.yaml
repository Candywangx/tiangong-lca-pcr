validation_rules:
  - rule_id: v_scope
    applies_to: "all processes"
    rule: "Confirm cultivar/grade/state, ordinary-air R134a cold holding, ambient display and checkout net-mass gates; incompatible processing, mixed cultivar or refrigerant is outside scope."
    source_ids: []
  - rule_id: v_reference
    applies_to: "retail_service"
    rule: "Require positive D, unique final accepted goods history, exact 1 kg service output and one normalization. Refusal, physical return, resale, money-only refund, internal transfer and donation must remain distinguishable."
    source_ids: []
  - rule_id: v_balance
    applies_to: "all inventory rows"
    rule: "Reject unclosed stock, wet-state transition, water, refrigerant, source-meter or persistent asset balances; verify B_s+B_f=R and successful downstream coupling exactly once. Retain zero-output pools as unnormalizable."
    source_ids: []
  - rule_id: v_complete
    applies_to: "all inventory rows"
    rule: "A target mechanical check does not approve methodology or unresolved identities. Complete datasets require bound row-specific UUID/property/unit/medium, actual quantities and background, all conditional occurrence decisions, additional actual atomic flows and bilingual alignment; no unsupported defaults."
    source_ids: []
  - rule_id: v_returns
    applies_to: "all inventory rows"
    rule: "Audit late-return corrections against original numerators, D, wet-state mapping, background and fates, with dates and deltas; ensure reverse-handling events are not also charged to a later cohort."
    source_ids: []
  - rule_id: split_completeness
    applies_to: "all inventory rows"
    rule: "Check every exact identity and single reference property, all actual work-order constituents, disjoint measurements, old-package reversal, no duplicated source/asset terminal scope, all-beneficiary historical attribution and one final normalization. Unverified sources, uncarded actual exchanges, unknown quantities or a mere claim of contract inclusion are incomplete."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground incremental retail service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared apple-service route with reviewed applicability and completed bindings, measured quantities, balances and uncertainty"
  excluded_use: "Whole classification coverage; fruit production reference; blanket retail comparisons; complete result while any identity, state conversion or denominator is unresolved"
  required_metadata: "Required qualifiers; named conditional exchanges; reference throughput; upstream successful/failed receiving-state partition; exact supplier-package boundary; single-process protocol views"
  required_quality_disclosure: "Source periods/geography; sample representation; missingness; instrument uncertainty; zero-output pools; original and late-corrected results; unresolved UUID/background and candidate limitations"
  update_trigger: "Cultivar/grade/state, processing/holding/refrigerant/channel, supplier background, actual flow, return outcome, asset life or source evidence changes"
data_sources:
  - id: "un-cpc"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 62121, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62121"
    used_for: "Classification includes vegetables, fruits/nuts and prepared/preserved groups; supports narrower declaration only"
  - id: "cde-apples"
    type: "official_guidance"
    reference: "California Department of Education, Apples, Storage section, reviewed 2026-08-17, https://www.cde.ca.gov/ls/nu/fd/apples.asp"
    used_for: "Apple cold/dry storage and avoiding pre-use rinsing support this declared route; school-food guidance, no retail compliance threshold or loss factor"
  - id: "jrc-retail"
    type: "official_guidance"
    reference: "Schönberger, Gálvez Martos and Styles (2013), Best Environmental Management Practice in the Retail Trade Sector, EUR 25998 EN, doi:10.2791/1775; section 1.2 direct/indirect aspects, refrigeration and food-waste sections; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Relevance of electricity, refrigeration, sanitation, packaging and residual management; no borrowed numerical benchmark or complete SRD conformity claim"
  - id: "ghg-product"
    type: "standard"
    reference: "WRI/WBCSD (2011), Product Life Cycle Accounting and Reporting Standard, chapter 9, printed page 63, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General subdivision and physical-allocation hierarchy only; pool, wet-state background ownership, return correction and asset ledger are explicit PCR design decisions, not source-mandated factors"
