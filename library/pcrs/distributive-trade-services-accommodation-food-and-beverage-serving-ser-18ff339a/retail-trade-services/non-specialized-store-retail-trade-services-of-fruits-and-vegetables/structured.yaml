system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_route
      applies_to: "all processes"
      rule: "Apply only to in-store non-specialized retail of fresh whole dessert apples (Malus domestica), one declared cultivar/grade/receiving state per dataset, using ordinary-air R134a refrigerated holding and ambient display, sold by calibrated net mass. Exclude frozen, dried, canned, juiced, cut, washed/waxed on site, mixed-cultivar composite references, controlled atmosphere, home delivery and other produce. Customer self-bagging in specified LDPE bags is included."
      source_ids:
        - un-cpc
        - cde-apples
    - rule_id: service_gates
      applies_to: "retail"
      rule: "Start at documented store receiving gate after inbound transport; end at final customer acceptance at checkout with agreed cultivar, net mass, grade, freedom from visible decay and recorded condition. Declare the actual quality contract and temperature/humidity/time specification prospectively; no literature value becomes a universal acceptance limit. Include receiving, sorting, cold holding, ambient display, checkout, sanitation, reversals, residual handling and attributable assets. No on-site produce processing occurs."
      source_ids:
        - cde-apples
    - rule_id: goods_responsibility
      applies_to: "failed_apples"
      rule: "This incremental retail service excludes production and inbound transport for successful merchandise from its burden numerator; downstream links that receiving-gate background exactly once using B_s/D receiving-state kg, not 1 kg of newly produced apples. Include B_f/D receiving-state background for all permanently failed goods, spoilage, shrink and non-sale external transfers, including donation and supplier return. Keep retailer responsibility for these failed cohorts; no displacement credit or supplier refund removes it. A failed external handoff must state recipient, physical state, onward function and treatment responsibility and is never automatically waste. Upstream dataset boundary must include actual cultivar/origin/harvest/storage/packing and inbound transport through the same gate; subtract evidenced overlaps only."
      source_ids: []
    - rule_id: physical_boundary
      applies_to: "retail"
      rule: "The service inventory is not an all-receipts apple production model. cp_goods nevertheless closes all physical receiving, storage, sold, returned, donated, supplier-returned, wasted, respiration and moisture histories. Successful goods are documented carriers outside the service reference product; donor and supplier product outputs are physical carriers with no burden credit. Only failed_apples imports ancillary failed-goods background. Waste carriers link treatment once, never both treatment-service and its emissions. Upstream carton manufacture follows merchandise gate ownership; retailer carton treatment remains included."
      source_ids: []
    - rule_id: conditional_completeness
      applies_to: "all processes"
      rule: "For each conditional exchange retain equipment register, purchase/work-order search and operating inspection proving presence or absence for the whole period. Absence is not inferred from a blank invoice. Unknown occurrence, missing quantity, unverified identity, undefined background or unclosed balances block a complete dataset. Additional actual chemicals, bags, replacements, spills, waste carriers, cleaning evaporation or emissions need named atomic cards, matched single-process protocols and bilingual regeneration before completeness. Fruit washing or another refrigerant requires scope revision before use."
      source_ids:
        - jrc-retail
    - rule_id: external_chain
      applies_to: "donated_apples; supplier_return_apples; failed_apples"
      rule: "A supplier return or donation is failure to provide this store retail service, not automatic physical destruction. Track unique fruit to documented recipient acceptance, condition, onward sale/use/treatment and ultimate background owner. Under this PCR original receiving-gate production and inbound transport for external non-sale transfers remain B_f responsibility of the origin service. Every recipient transfer record must carry an origin-cohort ID and production-already-borne marker with the exact B_f receiving-equivalent amount and original background reference; onward recipient models add only post-handoff actions and must not import that original production again. A recipient cannot silently reassign it through a financial credit. If the same fruit returns and is finally resold by this store, reopen the original pool, change B_s/B_f, D and actual numerator under calc_late_return, and reverse the external marker version. Unresolved recipient fate or ownership is incomplete."
      source_ids: []
    - rule_id: asset_completeness
      applies_to: "assets"
      rule: "Required retail capital is explicit: cold_assembly, retail_building, checkout_pos, weighing_scale and apple_display_rack, including leased/shared counterparts. Allocate each real asset through calc_assets; not owning it does not remove its responsibility. Building module includes structural shell, finishes, fixed wiring/plumbing, fixed general lighting and building ventilation, but excludes the cold-room assembly and movable POS/scale/rack. Cold-room complete assembly includes insulated wall/ceiling/floor panels, doors, internal lights, compressor/condenser/evaporator, piping and controls plus dedicated installation; excludes building shell, R134a charge, operation, maintenance and disposal. The separate terminal carrier matches that same full physical assembly after measured refrigerant recovery. The other four asset modules each cover one complete actual asset with manufacture, installation and its explicitly measured terminal treatment, excluding operation and maintenance. Verify supplier boundaries so no panel, control, light, wiring, structural element, installation or terminal treatment appears in two modules. Include actual asset maintenance/replacements via named atomic additions with no physical quantity retained inside the labour-only inspection card; missing necessary asset evidence is incomplete, not exclusion."
      source_ids: []
    - rule_id: external_air_and_condensate
      applies_to: "all processes"
      rule: "Elementary air exchanges occur only across the actual exterior store boundary. Fruit respiration/moisture trials define internal source terms; no indoor source is automatically emitted to the environment. Cold-room condensation/defrost water is a separate actual waste carrier under cold_condensate, measured at its sewer handoff. If it physically joins cleaning_effluent before one common meter, declare that actual common carrier and allocate its measured whole liquid once between the disjoint process views using upstream condensate and cleaning source meters/composition; the sum must equal the one common-meter mass. Do not record the full common mass in both cards, or record captured fruit water both as vapour and wastewater. Missing source split or capture evidence makes the relevant result incomplete. For retained liquid use stock change until an actual handoff occurs. Other captured species/carriers require their own atomic actual carrier cards when present."
      source_ids: []
    - rule_id: split_exchange_identity
      applies_to: "all inventory rows"
      rule: "Each card has exactly one concrete exchange identity and one reference measurement property/unit; a unit group is not a second property, and auxiliary measurements are conversion evidence only. Labour cards no longer carry bundled materials/energy/equipment/wastes. Retained complete homogeneous assets, original packaged goods and real mixed waste carriers require matching actual whole-scope background/receiver treatment and full composition; heterogeneous collections or selectors are prohibited. An original exchange enters one core card or one split source only; reverse all old package characterization when replacing it and combine only disjoint raw quantities with identical identity/property/unit. Every other actual substance, part, fuel, refrigerant, emission and treatment gap requires a named bilingual card and process protocol; unknown is never zero or complete."
      source_ids: []
