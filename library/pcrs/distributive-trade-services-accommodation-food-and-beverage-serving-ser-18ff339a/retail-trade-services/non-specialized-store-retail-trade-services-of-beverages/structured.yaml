system_boundary:
  rules:
    - rule_id: route
      applies_to: "all inventory rows"
      rule: "Only sealed, unflavoured, non-carbonated spring water, nominal 500 mL single-use PET, cap and label specification and homogeneous SKU are eligible. Receive already bottled goods in dry corrugated cases and LDPE shrink film; hand carry individual bottles to the complete steel shelf; no carts, pallet trucks, motors, chilling, dispensing, opening, on-site re-packing or vehicle delivery inside this module. Supplier label/instructions and actual temperature/expiry/seal inspection govern acceptance; no invented temperature or legal limit."
      source_ids:
        - evian-faq
        - evian-500ml
    - rule_id: gates
      applies_to: "all inventory rows"
      rule: "Start at signed store receiving acceptance; include the stated shelf operation through final qualified customer acceptance and original-cohort return closure, including failed/idle periods and residual handling. Receipt refusal before the start gate stays supplier responsibility with evidence; store-caused damage after signed receipt remains in this pool. Customer possession or payment alone is not qualified acceptance."
      source_ids:
        - ghg-product-2011
    - rule_id: partial_completion
      applies_to: "all inventory rows"
      rule: "This is a partial manual shelf-retail module. A full retail result MUST add identified modules for building manufacture/installation/maintenance/end-of-life, ambient lighting and HVAC electricity/refrigerant/plant, checkout/POS and communications, any trolley/pallet-truck use and capital, common sanitation/water/chemicals/drains, personnel-support/site activities, inbound transport and successful-goods production. A named responsible data producer shall keep a source-ID/module overlap matrix, identical cohort/version/N and compatible reference basis; retain failed, idle and zero-output shares. Complete shelf capital, dry wipes, replacement bolts and these waste carriers belong only here. Other modules may not include them again. No full-retail footprint claim until every required module has evidence, raw activity, allocations and disjoint handoff/readback; unknown module coverage blocks that claim."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - rule_id: absence_extension
      applies_to: "all inventory rows"
      rule: "At each reporting pool and every incident, verify route absence from site walk-through, equipment register, receipts, cleaning and damage records. An opened/leaking bottle, liquid discharge, evaporation from a spill, wet cleaning, other packaging, powered handling, dedicated light or other actual exchange requires a named specific bilingual card/protocol and supported calculation before that affected pool can be complete. Retain its original event and numerator; never assign an undocumented zero, omit it or silently substitute a whole-bottle carrier. Air, sewer, captured liquid and retained stock must close by actual receiving medium; no source-to-room quantity automatically becomes exterior emission."
      source_ids:
        - jrc-retail-2013
    - rule_id: carrier_background
      applies_to: "failed_goods_background; cardboard; shrink_film; whole_bottle_waste"
      rule: "A received goods background is one original filled bottle plus its evidenced share of original transit case/film and inbound freight to this same gate. Successful backgrounds B_success/N are coupled downstream once; only final store-responsibility failed backgrounds B_service/N enter failed_goods_background. Supplier continuation, resale and unresolved stock keep lineage, not a second production charge or recycling credit. Waste treatment is added only at the actual collection handoff; verify whether provider includes onward transport and treatment and add a named uncovered service if needed. Carrier contents are not extra exchanges."
      source_ids:
        - ghg-product-2011
