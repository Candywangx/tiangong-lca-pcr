allocation_rules:
  - rule_id: shared
    applies_to: "all inventory rows"
    rule: "Directly identify the SKU/task/container first. For shared dry wipe/bolt events use recorded shelf-area-hours of all actual beneficiaries during the whole event coverage: a_i=x_i/sum(x_all); assign complete raw amount once. Include vacant reserved capacity as an explicitly assigned idle beneficiary and failed cohorts. If all drivers are zero/unknown, retain an unresolved raw pool; no automatic equal split or zero. All assigned shares reconcile to the raw total before division by N. Human metabolic energy and working time are not material exchanges; data/equipment used to execute PCR measurement are not operating inputs of the shelf."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_ledger
    applies_to: "shelf_asset; terminal_shelf"
    rule: "Maintain one persistent complete-shelf ledger over all beneficiaries and periods. calc_asset fixes manufacture and terminal responsibility by shelf-area-hours, including reserved/idle intervals; revise prior allocations when expected lifetime changes, never restart manufacturing. Current replacement-bolt purchase/removal belongs to its actual maintenance event, not a second lifetime fraction. No substitution credit, avoided production or price allocation is allowed."
    source_ids:
      - ghg-product-2011
  - rule_id: return_pool
    applies_to: "all inventory rows"
    rule: "Prospectively fix one configuration/site/SKU cohort pool, its reporting dates and contractual return/acceptance closure rule before collection; retain zero-sale and failed-only periods in that pool. Late returns reopen that original version: revise N, every attributable operating/material/asset numerator, ownership and terminal fate; signed negative corrections replace old amounts, not an extra new-cohort burden. Financial-only credit does not change physical stock or qualified acceptance unless evidence changes it. A resale gets one final service and one successful background across its unique history."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "shelf"
      flow_role: "Bottle identity, acceptance, stock and background ownership"
      record_type: "stock_acceptance_ledger"
      raw_fields: "site; market region/date; supplier current SKU/bottle/cap/label composition and recycled-content records if modeled; SKU/label/photos; spring source; nominal500mL; PET/cap/label; lot; unique bottle or reconciled batch IDs; original receipt ID/count; opening/closing stock; gross handovers H; physical returns U; rework/resale links; final qualified IDs; failed/continuing/provisional IDs; recipient; ownership; signed receipt; expiry; ambient temperatures; final closure date/version; original background/provider and inlet transport scope; original receiving filled-bottle net/gross kg, dry bottle/cap/label tare/BOM, original filled contents kg and sampling uncertainty"
      collection_method: "Count scan/receipt/stock-check at receiving, every handover/return and daily shelf close; retain failed and supplier-return acknowledgements. Each original bottle is partitioned by calc_goods; nominal capacity is label specification only, not actual kg or accepted count. At receipt obtain configuration-matched supplier filled-product records/BOM or calibrate same-lot gross weighing and destructive dry component tare sampling; original fill kg is gross minus measured dry package tare, with sampling/temperature and uncertainty documented. Do not derive composition, fill kg or packaging kg from nominal500mL; obtain the original compatible complete-item production/inbound background or block background completion. Obtain customer contractual acceptance evidence and track end-of-return-window or documented final resolution. calc_reference; calc_goods; raw physical movements first, final N separate; each amount per reference flow once"
      unit: "Item(s); kg; degC"
      frequency: "Every movement and daily close; closure and each late event"
      temporal_coverage: "Complete prospective pool plus original-cohort corrections"
      site_scope: "Store receiving point, shelf and customer/supplier handoff records"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed slips; scan audit; daily count reconciliation; label and instruction evidence; final customer and recipient records; background overlap matrix"
    - protocol_id: cp_shelf
      process_id: "shelf"
      flow_role: "Actual dry wipes and replacement bolts"
      record_type: "material_event_ledger"
      raw_fields: "source_event_id; shelf_id; SKU/task; opening/purchases/transfers/closing dry material mass; wipe grade; bolt material/spec; fitted/removed ID; tare; scale resolution/calibration; all-beneficiary area-hours; idle shares; no-spill/no-wet-cleaning/equipment evidence"
      collection_method: "Weigh stock and actual issues/returns with calibrated balance; inspect unused versus consumed materials, hand-tightening job sheets and daily route absence. Dry-mass weighing is as supplied with actual humidity/state declared, no assumed dry fraction. Separate unrelated material grades or actual new chemicals as named cards before completeness. calc_material; assign raw totals once then /N per reference flow"
      unit: "kg"
      frequency: "Each issue/return/maintenance event; daily absence; opening/closing inventory"
      temporal_coverage: "Whole pool including idle and failure periods"
      site_scope: "Assigned shelf and disjoint source bins"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration certificate/check weights; supplier composition; stock reconciliation; job IDs and allocation ledger"
    - protocol_id: cp_asset
      process_id: "shelf"
      flow_role: "Complete shelf manufacture/installation responsibility"
      record_type: "asset_lifetime_ledger"
      raw_fields: "asset_id/configuration; original installation/provider scope; initial net kg; each component boundary; calibrated scale; beneficiary shelf area and reserved interval; opening date; expected total lifetime area-hours L_j; version; prior fractions; idle/failure ownership; maintenance removals/additions; terminal plan"
      collection_method: "Weigh complete installed shelf net of transport packaging before service or use traceable configuration-matched original weighing. Record actual occupied/reserved area intervals across all beneficiaries daily, including empty/closed periods; review L_j at every reporting close and confirmed retirement. No arbitrary default shelf kg or lifetime. calc_asset; complete original kg times current fraction then /N per reference flow"
      unit: "kg; m2*h"
      frequency: "Initial configuration; daily exposure; every lifetime revision"
      temporal_coverage: "Entire asset lifetime and every reporting pool"
      site_scope: "Same identified complete shelf"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete provider BOM/scope; original weighing/calibration; persistent lifetime versions and summed fractions"
    - protocol_id: cp_residual
      process_id: "residual"
      flow_role: "Actual separated physical waste carriers"
      record_type: "waste_handoff_ledger"
      raw_fields: "source_event/container/portion IDs; stream identity; intact seal; complete bottle count and gross/net kg; carton/LDPE/used wipe/bolt kg; tare; opening/closing stored waste; transfers; recipient; destination/treatment; provider transport/treatment scope; shared all-beneficiary driver; scale calibration"
      collection_method: "Segregate each named stream at shelf and weigh every actual handoff and stored balance on calibrated scales. Whole sealed bottle waste is one carrier; count links to original failed IDs and weigh entire contents without nominal-volume-to-mass assumption. Document absence with inspections and collection manifests, not missing invoices. calc_waste; physical stock closure before allocation and /N per reference flow; no contained-component double count"
      unit: "kg; Item(s)"
      frequency: "Each waste event/handoff and opening/closing storage"
      temporal_coverage: "Entire original cohort including late return fates"
      site_scope: "Shelf collection point through documented receiver handoff"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weigh tickets; receiver receipt; calibration; polymer/BOM records; original bottle-ID and container-portion reconciliation"
    - protocol_id: cp_asset_end
      process_id: "residual"
      flow_role: "Whole terminal shelf carrier and life responsibility"
      record_type: "terminal_asset_ledger"
      raw_fields: "asset_id; actual retirement; whole remaining carrier net kg; tare; retained feet/bolts/replacements; removal IDs; actual lifetime area-hours and all beneficiaries; final fraction versions/corrections; receiver; treatment/provider scope"
      collection_method: "At actual retirement directly weigh complete remaining shelf net, reconcile past event removals and additions by IDs and link its verified receiver. No terminal waste is invented at an arbitrary reporting close; reserve disclosed expected responsibility with actual planned carrier boundary until retirement confirms mass and f_terminal, then revise original versions. Unknown terminal data remain provisional. calc_asset; actual complete net carrier times f_terminal then /N per reference flow, exactly once"
      unit: "kg; m2*h"
      frequency: "At confirmed retirement and each plan/revision review"
      temporal_coverage: "Whole asset lifetime and original beneficiary versions"
      site_scope: "Same asset at actual waste handoff"
      aggregation_rule: "per reference flow"
      quality_evidence: "Terminal weigh/calibration; transfer manifest; original and replacement-component reconciliation; final lifetime sum"
    - protocol_id: cp_completion_operations
      process_id: "shelf"
      flow_role: "Collection view for separately completed common premises, lighting/HVAC, checkout and personnel-support modules"
      record_type: "completion_meter_task_ledger"
      raw_fields: "source_event_id; module/component/circuit/provider ID; original cohort/N/version; complete parent and submeter circuit map; actual opening/closing readings and units/calibration; direct SKU/task readings; covered dates; all beneficiary floor-area/reserved-idle hours; checkout task seconds and declared idle-capacity assignment; staff-support presence/task/standby seconds; actual refrigerant species, raw charge/recovery/air-capture stocks and transfers; factory-charge provider boundary; exterior flux and receiver evidence"
      collection_method: "Collect disjoint actual site records for each omitted module and retain their exact flow/provider definitions; this view creates no generic exchange in the shelf inventory. Subdivide/direct-meter first, then apply completion_operations to measured residuals. Record every operating, closed, failed and idle interval and every refrigerant event; inspect absent processes with equipment/incident records. Quantities unknown remain unresolved. per reference flow"
      unit: "native meter units; kg; m2*h; s"
      frequency: "Each meter interval/task/incident; whole-pool opening/closing"
      temporal_coverage: "Same prospective cohort and every original-version correction"
      site_scope: "Disjoint documented external completion modules at the same store"
      aggregation_rule: "per reference flow"
      quality_evidence: "Circuit containment; calibrated meters; floor/time/task logs; complete-beneficiary and provider-overlap reconciliation"
    - protocol_id: cp_completion_housekeeping
      process_id: "residual"
      flow_role: "Collection view for separately completed common housekeeping water, specific chemicals and whole effluent"
      record_type: "completion_liquid_carrier_ledger"
      raw_fields: "source/event/container/portion/module IDs; inlet and drain meter boundaries/readings; actual density/temperature; every declared cleaning formulation and chemical concentration/mass; cleaner/product dissolved portions; measured stored water/liquid stocks; reuse circuit; evaporation/capture/other discharge measurements; exported retained portions traced to this liquid pool, excluding newly added outside dry cloth/container mass; beneficiary cleaned-area/pass records; whole effluent recipient/treatment and provider scope; exclusive direct-or-reconstruction mode"
      collection_method: "Measure inlet imports and each actual chemical separately, and weigh or meter actual entire discharged liquid. Apply completion_housekeeping; do not infer whole effluent from a water-only balance. Keep drain-sharing portions disjoint from any other actual carrier; instrument calibration, measured solution composition and absence/incident coverage are required. Add specific cards in the completed module, not a generic combined cleaning row here. per reference flow"
      unit: "kg; m3; kg/m3; degC"
      frequency: "Each cleaning/chemical issue and discharge; opening/closing stored liquid"
      temporal_coverage: "Same whole pool including closed, failed and late correction periods"
      site_scope: "Mapped site inlet, cleaning points and actual drain/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Inlet/drain map; calibration; cleaner supplier composition; measured complete liquid balance; unique container portions and receiver tickets"
    - protocol_id: cp_completion_assets
      process_id: "shelf"
      flow_role: "Collection view for disjoint omitted capital and maintenance modules"
      record_type: "completion_asset_event_ledger"
      raw_fields: "module/asset/component/provider/contract IDs; exact complete asset configuration and manufacturing/installation boundary; initial contained fluids/parts; actual original quantity/BOM/weighing; current/past/remaining lifetime driver and all beneficiaries/idle; version/correction/residual ledger; actual terminal carrier and receiver; maintenance event date/support interval; homogeneous contract/service type/package version/unit; included parts/utilities/technician travel/removed-part treatment; excluded items and overlap IDs"
      collection_method: "Obtain actual complete asset/service definitions, original and terminal measurements, maintenance work orders and lifetime records; use completion_assets. Provider scope must be verified before choosing one complete package or disjoint named components. Heterogeneous event counts cannot stand in for a homogeneous contract unit. Collect original-cohort signed revisions across every beneficiary; no reset at a new report. per reference flow"
      unit: "actual defined asset/service unit; kg; m2*h; s"
      frequency: "Initial acquisition/configuration; each event/report/revision; actual retirement"
      temporal_coverage: "Full asset lifetime and each original cohort version"
      site_scope: "Documented completed building/HVAC/POS/handling/support assets, disjoint from shelf"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete BOM/provider contract; original/terminal weighing; event scope; whole-life fractions and correction/reconciliation records"
    - protocol_id: cp_completion_transport
      process_id: "shelf"
      flow_role: "Collection view for actual omitted inbound/return/handling transport"
      record_type: "completion_route_handling_ledger"
      raw_fields: "source/trip/leg/task/vehicle/module/provider IDs; all consignments and actual loaded kg at each leg; actual leg km including empty legs; fuel/electricity/idle readings and provider tkm/vehiclekm boundaries; actual stationary idle/standby interval duration and reserved capacity; shipment gate; original goods IDs/background owner; loaded and empty positioning/return handling seconds; reserved idle intervals; all beneficiaries; maintenance/capital/service inclusions"
      collection_method: "Collect actual route/load and operating logs or verified provider activities, not straight-line guesses. Apply completion_transport; prove which measured empty/idle legs the provider activity covers. Human individual-bottle carriage in the declared shelf route remains without a machine exchange; any separately completed handling equipment uses actual loaded plus empty time and its own disjoint asset record. per reference flow"
      unit: "kg; km; t*km; vehicle*km; s; actual fuel/energy units"
      frequency: "Each trip leg/task/idle period and pool boundary"
      temporal_coverage: "Same original goods/cohort pool including failures and returns"
      site_scope: "Exact supplier-to-receipt or actual return leg and documented handling route"
      aggregation_rule: "per reference flow"
      quality_evidence: "Route/GPS/odometer and loading evidence; calibrated fuel/energy; all-beneficiary load and empty coverage; original background overlap matrix"
  calculation_rules:
    - id: calc_reference
      applies_to: "retail_service"
      rule: "N = count(unique finally qualified accepted original bottle IDs after original-cohort returns/resale closure). H and U are gross physical counts, not N. Return/resale does not create multiple services for the same original bottle. N must be positive for normalization; N=0 retains the entire raw pool and required reassignment/aggregation within the prospectively fixed identical configuration, never a fictitious 1 or omitted pool."
      inputs:
        - H
        - U
        - final_ids
        - cp_goods
      output: "N"
      source_ids:
        - ghg-product-2011
    - id: calc_goods
      applies_to: "failed_goods_background; supplier_return; external_failed"
      rule: "O_original comprises only unserved original opening bottles; R_original counts first receipts of previously uncounted original bottles, excluding physical returns/resale loops. Original bottle partition: O_original + R_original = B_success + B_service + B_continue + B_open; B_service = F_store + F_external; B_continue includes evidenced supplier-return with named next owner; other actual transfer C_other requires its own named card and protocol before completeness, and unresolved ownership remains provisional; B_open is unresolved store stock. B_success=N only because the same original sealed homogeneous bottle survives to qualified acceptance, evidenced by unique IDs and seal checks; no 500mL-to-kg equality. A failed later-resold bottle leaves F and enters success once, with original background corrections. Gross physical stock independently: S_open + R_gross + U = S_close + H + C_supplier + C_other + W_count; externally retained failures are already in H, never subtract F_external again. Reconcile old-customer returns to original IDs, not fresh receipts. B_service/N goes to failed_goods_background; B_success/N complete original goods background is added downstream once. Unknown final ownership remains B_open/provisional with blocked closure; financial refunds alone alter neither balance."
      inputs:
        - original_ids
        - ownership
        - stock
        - H
        - U
        - cp_goods
      output: "B_service; B_success; C_supplier; F_external"
      source_ids:
        - ghg-product-2011
    - id: calc_material
      applies_to: "dry_wipe; replacement_bolt"
      rule: "Raw consumed kg = opening usable kg + receipts kg + inward transfers kg - closing usable kg - outward usable transfers kg. Reconcile to weighed actual consumption/fitted events. Assign direct or a_i shared-event share once to obtain A_wipe or A_bolt, then /N once. Used-wipe dust mass need not equal purchased dry-wipe mass; actual waste is independently weighed."
      inputs:
        - material_stock
        - event_share
        - N
        - cp_shelf
      output: "A_wipe/N; A_bolt/N"
      source_ids:
        - ghg-product-2011
    - id: calc_waste
      applies_to: "cardboard; shrink_film; whole_bottle_waste; used_wipe; removed_bolt"
      rule: "For each disjoint carrier: generated kg + opening stored kg + actual inward kg = outgoing handed-off kg + closing stored kg + actual outward other transfer kg. Inventory quantity W_stream is attributed actual outgoing carrier kg for its measured recipient and treatment; disclose remaining storage with original future treatment responsibility. Use unique container/portion IDs; destination shares, if used, sum to 1 and multiply carrier amount once only. Full sealed carrier mass is measured, never label500mL*density. Whole-bottle W_count matches store-failed original IDs; external failed retained goods are not W_count."
      inputs:
        - waste_stock
        - handoff
        - recipient
        - N
        - cp_residual
      output: "W_carton/N; W_film/N; W_bottle/N; W_wipe/N; W_bolt/N"
      source_ids:
        - jrc-retail-2013
    - id: calc_asset
      applies_to: "shelf_asset; terminal_shelf"
      rule: "For asset j, x_j,p = sum(reserved shelf area_m2 * actual interval_h assigned to beneficiary pool p); L_j = prospectively documented expected lifetime sum of all beneficiaries x, including unoccupied reserved/idle time assigned to its responsible pool. Require L_j>0 with actual lifetime planning evidence; otherwise retain an unresolved asset pool. f_j,p=x_j,p/L_j; all versions sum fractions <=1 with a full future residual ledger. At lifespan revision replace all old f versions and record signed corrections against original pools; do not purchase the asset again. At retirement L_actual=sum(all actual x); f_terminal_j,p=x_j,p/L_actual and final revised manufacture fractions use that same full-life denominator; reconcile summed final fractions=1 and replace previous estimates. Manufacturing quantity=sum(f_j,p*m_initial_j)/N; actual terminal quantity=sum(f_terminal_j,p*m_terminal_j)/N once; do not multiply manufacture and terminal fractions together. Direct net terminal weighing excludes removed parts already; no additional subtraction. Prior manufacture burden is corrected by difference only."
      inputs:
        - x_j
        - p
        - L_j
        - m_initial_j
        - m_terminal_j
        - N
        - cp_asset
        - cp_asset_end
      output: "asset_kg/N; terminal_kg/N"
      source_ids:
        - ghg-product-2011
    - id: calc_complete
      applies_to: "all inventory rows"
      rule: "Each inventory amount uses an unnormalised original raw quantity, then disjoint attribution, then one division by the same N. No volume-to-mass, moisture, concentration, density or count-to-kg conversion is a default. Use calibrated actual net weighing for mass rows, labelled nominal capacity only to identify bottles. Before full-retail aggregation convert any external kg service by a measured matching sealed-bottle kg per finally qualified bottle with method, sample and uncertainty; never equate unlike package/state/service scopes or reuse already normalized numerator totals."
      inputs:
        - raw_quantities
        - attribution
        - N
        - cp_goods
      output: "coherent quantities per reference flow"
      source_ids:
        - ghg-product-2011
    - id: completion_operations
      applies_to: "all inventory rows"
      rule: "For each actual omitted lighting/HVAC/checkout/support utility circuit, first assign direct measured beneficiary quantities. For a parent containing the verified child meters, R_parent=P_parent-sum(disjoint included children); subtract each included child once only. An independent disjoint meter is unchanged. Allocate residual lighting/HVAC quantity by a_i=(floor area_m2*covered reserved hours)_i/sum(all actual beneficiary area-hours), including assigned idle/closed/reserved capacity. Checkout residual uses b_i=(actual task seconds_i+assigned declared idle-capacity seconds_i)/sum(all beneficiary task+idle-capacity seconds). Personnel-support residual uses measured attributable staff task/presence seconds plus assigned standby seconds, reconciled over all site beneficiaries. Idle capacity is recorded and assigned to the prospectively responsible pools by their reserved capacity/time, not erased or assigned only to sales. Unknown/zero total driver leaves an unresolved raw pool. Each circuit assigns all raw units once, removes only proven containing-side provider overlap, converts units on measured documented bases, then divides by original corrected N once. Actual fuels/heat and refrigerant species need their own specific exchanges in the completed module. For each refrigerant close physical raw circuit first: L_internal=opening charge+external makeup+reused recovery-closing charge-circuit recovery-other contained transfer. Commissioning factory charge belongs once to asset-contained opening stock/provider manufacturing, not a second purchased makeup input. Recovery-store opening+circuit recovery=recovery-store closing+sent recovery+reused recovery+other contained transfer, with unique source portions. Exterior species emission E=L_internal-net air storage change-net captured storage change-captured-air export; actual capture is disjoint from circuit recovery. Independently verify actual exterior inlet/outlet flux/background at consistent T/P/wet-dry units; room release is not automatically E and unknown capture/storage is not zero. Allocate only after raw closure; record whole transferred carrier and species portions without duplication."
      inputs:
        - meter_map
        - direct_readings
        - area_hours
        - checkout_seconds
        - staff_seconds
        - refrigerant_stocks
        - N
        - cp_completion_operations
      output: "disjoint completed utility quantities/N"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: completion_housekeeping
      applies_to: "all inventory rows"
      rule: "Use actual imported water M_import=V_in*rho_in at measured temperature; an inlet import meter already excludes internal reuse, so never subtract reuse again. Record each actual cleaning formulation/chemical separately by net consumed mass and measured composition/concentration; background already including its ingredients is not supplemented by those same ingredients. For shared cleaning assign direct tasks first; remaining event quantities by actual cleaned floor area_m2*actual pass count over every beneficiary, including closed/failed/reserved areas actually cleaned. Choose mutually exclusive effluent methods: (A) actual outgoing whole-liquid M_eff=V_drain*rho_eff (or direct net weighing), with no second evaporation/storage deductions; (B) whole-liquid kg balance M_eff=M_import+M_other_actual_liquid+M_dissolved_actual_material+S_open-S_close-M_actual_evaporated-M_other_disjoint_outgoing_liquid-M_retained_export, with every term measured at consistent whole-carrier boundaries. M_retained_export means only the measured liquid or solid portions originating in this source liquid pool and exported within another actual carrier; exclude newly introduced outside dry cloth, container and other carrier mass. Its exported source portions are mutually exclusive with other liquid exports and closing retained stock at the same closure. Opening/closing quantities remain the separately time-stamped stock terms of this balance, never an additional retained-material deduction. Subtract each exported source portion once only, never again as a second solids deduction. Internal reuse cancels inside this boundary. Whole incoming cleaning solutions are in M_other_actual_liquid including their existing solutes; M_dissolved_actual_material contains only newly introduced dry material not already inside any measured liquid/carrier term. Include solutes and merchandise portions once, never infer full liquid from a water-only volume balance or multiply it by unrelated density. Condensate, capture, stored liquid and common-drain portions have unique mutually exclusive source/container IDs. Allocate raw carrier once then /N; destination fractions sum to1 and apply once. Unknown terms or drain coverage block completion."
      inputs:
        - inlet_water
        - actual_chemicals
        - direct_effluent
        - liquid_stocks
        - retained_export_source_portions
        - cleaned_area_passes
        - N
        - cp_completion_housekeeping
      output: "completed water/chemical/whole-effluent quantities/N"
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - id: completion_assets
      applies_to: "all inventory rows"
      rule: "Use disjoint complete-asset ledgers: building shell/fixed fabric excludes shelf, HVAC plant, dedicated lamps, POS and handling equipment; HVAC plant includes its evidenced original integrated controls/refrigerant charge and excludes building/POS/handling; POS includes defined terminal/printer/scanner/network package only with exact provider component boundary; each actual trolley/pallet-truck is a separate complete asset, including original contained fluid where evidenced. Dedicated lighting/support assets require their own named definition if outside those packages. Never include shelf_asset, replacement_bolt, dry_wipe or their waste again. For building/HVAC/lighting use all-beneficiary reserved floor-area-hours; POS uses task plus assigned idle-capacity seconds; handling uses actual loaded+empty positioning/return seconds plus assigned reserved-idle seconds; personnel-support assets use staff presence/task plus assigned standby seconds. For asset j, L_j=current confirmed past lifetime driver+documented expected remaining driver across every beneficiary, including idle; require L_j>0. f_j,p=current original-pool driver/L_j; complete original manufacture/installation quantity times f_j,p is assigned once. Revisions replace prior fractions by signed delta on each original cohort, preserving cumulative sum<=1 and explicit future residual, never resetting acquisition. At actual retirement use full actual lifetime sum and f_terminal_j,p=original-pool driver/full actual driver, reconcile final fractions sum=1, replace prior estimates and multiply the actual complete net terminal carrier by f_terminal once only, never again by manufacturing fraction; direct net terminal weighing already excludes prior removals. Initial fluid/parts are inside original package; later additions and removed components are separate actual events, and retained terminal components remain inside complete terminal carrier. Maintenance is separately recorded as an exact homogeneous actual contract_id/work_scope/service_type/package_version/unit and supported event interval. Direct event attribution first; common event shares use the relevant asset driver over its documented support interval for all beneficiaries, then divide by N. Different work scopes must be stratified into named compatible cards/services, not generic event-count Items. Verify included parts, utilities, technician travel and removed-part treatment and remove overlap from one proven containing side; do not mechanically split an evidenced complete package. Unknown coverage/driver/carrier/contract basis blocks completion."
      inputs:
        - asset_boundary
        - past_driver
        - remaining_driver
        - current_driver
        - initial_quantity
        - terminal_quantity
        - maintenance_contract
        - support_interval
        - N
        - cp_completion_assets
      output: "completed asset/maintenance/terminal quantities/N"
      source_ids:
        - ghg-product-2011
    - id: completion_transport
      applies_to: "all inventory rows"
      rule: "First verify each provider/goods background gate and included inbound/return transport, manufacture, energy, maintenance and treatment. Original-goods inbound freight remains with the one original bottle background under calc_goods and must not be added again. For uncovered actual transport the exclusive mode is fixed by evidence: use complete measured actual vehicle fuel/energy logs across all loaded, empty and idle legs whenever available, allocated by verified provider all-consignment responsibility; only when complete direct logs are unavailable use a compatible verified provider vehicle-distance/freight activity covering those exact legs with no duplicate fuel; absence of both blocks completion. Raw laden leg tkm=sum(actual carried consignments kg/1000*actual leg km); keep actual empty leg vehiclekm>0 even though tkm=0. Allocate actual laden freight burdens by consignment tkm across all beneficiaries; For moving empty/return legs, allocate burdens by documented reserved vehicle capacity*actual leg distance only when that actual predeclared contract assigns reserved capacity. For stationary idle/standby intervals under that reservation contract, allocate actual nonzero fuel/energy by reserved vehicle capacity*actual interval duration, never by zero distance. Each mode retains a positive sum of its actual all-beneficiary driver; unknown durations/capacity or zero/unknown total driver leave that raw pool unresolved. Without evidenced reservation, allocate both moving empty/return and stationary idle burdens by the actual route consignments outbound laden tkm with a positive all-beneficiary denominator; actual idle fuel/energy remains in that assigned route total. Record the contractual mode before collection; it is not a discretionary downstream choice. If a route has no loaded consignment and no evidenced reservation driver, retain its raw fuel/vehiclekm unresolved, never erase or assign zero. Provider tkm coverage must explicitly include observed empty/idle legs; if absent add a named compatible empty-vehicle-distance service once, removing overlapping legs and fuel. Handling equipment activity is actual loaded+empty positioning/return time plus declared reserved-idle time, shared over all beneficiaries using the same complete task/time pool; weight-zero handling never disappears. Capital/maintenance are disjoint under completion_assets and provider inclusion. Original failure/return duties stay with their original ownership/version and every final quantity divides corrected original N once. Unknown route/provider/empty coverage blocks completeness."
      inputs:
        - route_legs
        - actual_loads
        - vehiclekm
        - tkm
        - fuel_energy
        - stationary_idle_duration
        - reserved_capacity
        - loaded_empty_idle_seconds
        - provider_scope
        - N
        - cp_completion_transport
      output: "completed transport/handling quantities/N"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
  data_quality_requirements:
    - id: identity_completion
      applies_to: "all inventory rows"
      requirement: "Each concrete flow is presently unbound. Before dataset completeness, bind its exact material/service, direction/type, whole-carrier boundary, state and receiver to an official original flow response and matching hash receipt; verify property/unit/compartment and official bilingual names. If no compatible flow exists retain unresolved status; a search match is not binding evidence. Count/mass support UUIDs identify properties only, not these specific exchanges. Require actual market/region/date/SKU and current supplier bottle/cap/label specifications and recycled-content evidence if modeled: the US product page claims100% recycled plastic excluding caps/labels, while international FAQ reports40% average rPET across a range excluding caps/labels. These are different market/time/range statements, not evidence for the studied SKU; adopt neither as a default or provenance/compliance/factor claim."
      evidence: "Original responses; receipts; official naming and state/property/unit audit; row-specific mapping"
    - id: data_closure
      applies_to: "all inventory rows"
      requirement: "Retain source raw fields, daily coverage, instrument resolution/checks/calibration, attribution versions, inventories, receipts and receivers. Explain uncertainty and signed residuals; measurement tolerance must be justified from actual instruments/sampling, not invented compliance limits. Missing, unknown, unopened/leaking status or unconfirmed non-occurrence is not zero; block affected completion until resolved with evidence."
      evidence: "Full ledgers; calibration; incident and absence records; quantified uncertainty and residual reconciliation"
    - id: projection_translation
      applies_to: "all inventory rows"
      requirement: "All scope/gates/ownership, card amount/protocol, calculations, conditions and completion/dedup duties must exist in supported structured rules, and source and guidance readback must agree. Compare every nonempty EN/ZH business field, ordered IDs, card identity, quantity formula/input/unit and qualifier; markers do not certify methodology, official binding or independent approval."
      evidence: "Fresh projection/fingerprint/schema; semantic bilingual comparison and exact guidance readback"
    - id: completion_methods
      applies_to: "all inventory rows"
      requirement: "The named completion protocols and equations are mandatory PCR methods for a later full-retail aggregate; the shelf boundary and its13specific exchanges remain unchanged. Collect actual quantities/providers in the separate completed modules with named specific flow cards and matching identities, not a generic missing-module flow. The responsible data producer must demonstrate every omitted module, full raw-to-driver-to-quantity-to-corrected-N chain, all-beneficiary idle/failed/zero pools, signed original-version corrections and provider/source/event/component overlap removal. Unknown inclusion, circuit containment, terminal responsibility or conversion prevents complete aggregate status."
      evidence: "Actual completed-module inventories and protocols; meters and containment; lifetime/event/route/carrier ledgers; exact source-ID overlap matrix and same-cohort/N/version readback"
validation_rules:
  - rule_id: scope_check
    applies_to: "all inventory rows"
    rule: "Require actual same sealed bottle/SKU/route and measured absence conditions; CPC62126 is broader than this module, so use narrower mapping only after separate acceptance. No other beverages or whole-store service may be inferred."
    source_ids:
      - un-cpc62126
  - rule_id: quantity_check
    applies_to: "all inventory rows"
    rule: "Require positive final N, raw physical and original-background partitions, all failed/zero/late pools, one normalization, lifetime and event reconciliation, actual whole carriers and no double-counted contents, prior corrected fractions or included provider services. Any unresolved relationship or missing terminal/continuation responsibility blocks complete result."
    source_ids:
      - ghg-product-2011
  - rule_id: partial_check
    applies_to: "all inventory rows"
    rule: "Require explicit partial boundary and named missing-module handoff matrix in metadata. Only a separately reconciled complete module set may support full-retail use; this partial module alone cannot support complete product footprint, compliance, release or comparative claims."
    source_ids:
      - jrc-retail-2013
      - ghg-product-2011
  - rule_id: completion_method_check
    applies_to: "all inventory rows"
    rule: "A full-retail aggregate must enforce completion_operations, completion_housekeeping, completion_assets and completion_transport with their raw evidence and same corrected original N; downstream agents may collect field values and provider identities but may not select alternative allocation/denominator/asset/residual/empty-route methods silently. No full-retail completeness claim if a required named module or any actual specific card/receiver is missing. This does not add those exchanges to the partial shelf module."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset"
  allowed_use: "Partial shelf service on the same sealed500mL PET spring-water bottle/manual ambient route; full retail only after partial_completion"
  excluded_use: "Complete store or water life-cycle footprint, other drinks/formats/routes, compliance/publication/comparative claims, unverified identities or unresolved quantities treated as verified data"
