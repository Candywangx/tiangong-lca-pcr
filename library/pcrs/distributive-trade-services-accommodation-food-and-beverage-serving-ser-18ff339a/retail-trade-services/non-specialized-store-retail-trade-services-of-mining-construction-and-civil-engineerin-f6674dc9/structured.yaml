      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `v_gate` | retail; failure; custody | Reject application outside b_scope/b_exclusions, incomplete supplier pack evidence, manufacturer specification conflicts without actual revision evidence, or reopened/powered/assembled merchandise. Do not change classification solely from product title. | un62187; un444; kushlan350; kushlanmanual |\n| `v_ledgers` | service_output; failed_original; supplier_handover; failed_retention | Require latest distinct accepted IDs, gross physical events and typed stock equations independently, and S/F/T/O conservation per original source. Final acceptance revocation reduces Q even without physical return. Financial adjustment with valid acceptance does not. Returned resale retains one original ID; Q=0 cannot publish a normalized value. |  |\n| `v_units` | all inventory rows | Service and package counts remain Item(s), electricity remains MJ. Exact reference amount and service_output=1 must agree. No machine mass from catalog and no nameplate kW×opening hours substitute for meter readings. supplier_handover and failed_retention are audit satellites without second upstream providers/credits. |  |\n| `v_sources` | all inventory rows | Unbound service/package identities, missing original provider vectors, omitted inbound F, unsupported physical state, unknown mandatory modules or missing raw module denominators force explicit partial/inconclusive disclosure. Required UUID and original source evidence must be rechecked before binding; no nominal performance or source snippet proves field quantities. |  |\n| `v_versions` | retail; failure; custody | Require all beneficiary historical replacements for asset lifetime changes, original-pool late acceptance corrections, unique provider constituent scopes and one final Q. Audit complete numerator/source overlap and retain open/missing/failed cohorts. A passing finite unit check does not remove these data and review obligations. | ghg2011 |\n\n"
