  data_quality_requirements:
    - id: q_route
      applies_to: "retail; failure; custody"
      requirement: "Verify actual mixed physical retail, exact 350DD revision, no stand, complete original pack, unopened state, no site merchandise assembly/power/consumables, full-period b_facility_gate absence and actual receipt/pickup. Manufacturer nominal data is identity evidence only; uncertainty in packing or lubrication is not zero."
      evidence: "cp_goods; site-manager signed route, original packing list, revision/nameplate and seal evidence"
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Bind each currently unbound row only after direct official product-flow UUID read with official EN/ZH names, public state, exact package/service gate and reference property/unit chain; a catalog model or count property cannot bind an actual package/service. Electricity UUID is historical identity only and supplies no grid mix/voltage/provider impact data."
      evidence: "Official direct response and hash receipt; explicit per-row binding/quantity/provider conditions"
    - id: q_balance
      applies_to: "retail; failure; custody"
      requirement: "Reconcile independent goods count, held-waste kg, final-valid Q and whole-source S/F/T/O. Keep confirmed missing separate from signed unexplained residual; never suppress a zero-output/failure cohort. Unknown state, recipients or driver totals block completion."
      evidence: "cp_goods; cp_failure; cp_custody; c_pool; c_stock; c_goods"
    - id: q_measurement
      applies_to: "all inventory rows"
      requirement: "Retain raw values, physical units, timestamp/timezone, calibrated instrument ID/accuracy and responsible recorder; quantify uncertainty and coverage. Missing values and negative residuals require investigation and remain unresolved, never zero clamp or invented credits. No empirical ranges are supported for this candidate; future range claims require compatible independent evidence."
      evidence: "All collection protocols; meter/test-weight certificates; complete interval audit and uncertainty register"
    - id: q_completion
      applies_to: "retail; failed_original"
      requirement: "Partial status remains until every actual transport, capital/repair/end-of-life, digital/security/admin and facility cleaning source is included or signed absent, and all required atomic rows, process protocols and providers are aligned in both languages. Full standard conformity or methodology approval is not implied."
      evidence: "cp_merge; b_partial through b_clean; source/event overlap register and final producer signoff"
validation_rules:
  - rule_id: v_gate
    applies_to: "retail; failure; custody"
    rule: "Reject application outside b_scope/b_exclusions, incomplete supplier pack evidence, manufacturer specification conflicts without actual revision evidence, or reopened/powered/assembled merchandise. Do not change classification solely from product title."
    source_ids:
      - un62187
      - un444
      - kushlan350
      - kushlanmanual
  - rule_id: v_ledgers
    applies_to: "service_output; failed_original; supplier_handover; failed_retention"
    rule: "Require latest distinct accepted IDs, gross physical events and typed stock equations independently, and S/F/T/O conservation per original source. Final acceptance revocation reduces Q even without physical return. Financial adjustment with valid acceptance does not. Returned resale retains one original ID; Q=0 cannot publish a normalized value."
    source_ids: []
  - rule_id: v_units
    applies_to: "all inventory rows"
    rule: "Service and package counts remain Item(s), electricity remains MJ. Exact reference amount and service_output=1 must agree. No machine mass from catalog and no nameplate kW×opening hours substitute for meter readings. supplier_handover and failed_retention are audit satellites without second upstream providers/credits."
    source_ids: []
  - rule_id: v_sources
    applies_to: "all inventory rows"
    rule: "Unbound service/package identities, missing original provider vectors, omitted inbound F, unsupported physical state, unknown mandatory modules or missing raw module denominators force explicit partial/inconclusive disclosure. Required UUID and original source evidence must be rechecked before binding; no nominal performance or source snippet proves field quantities."
    source_ids: []
  - rule_id: v_versions
    applies_to: "retail; failure; custody"
    rule: "Require all beneficiary historical replacements for asset lifetime changes, original-pool late acceptance corrections, unique provider constituent scopes and one final Q. Audit complete numerator/source overlap and retain open/missing/failed cohorts. A passing finite unit check does not remove these data and review obligations."
    source_ids:
      - ghg2011
published_dataset_profile:
  dataset_role: "Partial incremental foreground service core; complete only after all specified evidence/module gates"
  downstream_use: "secondary_dataset; background_dataset only with explicit partial/complete coverage and verified providers"
  allowed_use: "Exact declared site/configuration original-pack pickup service; completed service excludes successful S goods manufacture/inbound"
  excluded_use: "Complete unqualified retail footprint; mixer LCA; concrete production; use-phase or safety approval; assembly/rental/delivery; custody satellite as environmental provider"
  required_metadata: "Required qualifiers; actual direct sources/providers; Q history; physical ledgers and source S/F/T/O; raw original module denominators, owners and versions; absence/presence register"
  required_quality_disclosure: "Partial modules and unbound rows; no empirical amount ranges; historical identity observations; actual packing/nameplate conflicts; uncertainty and all open residuals"
  update_trigger: "Any configuration, route, package state, acceptance, original responsibility, supplier scope, lifetime, provider or calibration revision"
