        - capture_raw_or_normalized_i
        - capture_source_unit_i
        - capture_source_vector_i
        - capture_original_denominator_i
        - capture_source_version_i
      output: "N_capture_i_h; N_network_h; N_event_h; storage_byte_seconds_i_h; N_packet_h: raw capture-production/network/event sources and camera byte-second quantities with exact original packet-to-capture-to-beneficiary ownership"
      source_ids:
        - ghg2011
    - id: c_clean
      applies_to: "service_output"
      rule: "For each original formulation source s measure m0_s net formulation kg at receipt, excluding its separate container. Physical source-origin conservation over the entire history is m0_s=cumulative_final_external_source_kg+current_factorysealed_unused_source_kg+current_opened_unused_source_kg+current_mixed_solution_source_kg+current_surface_film_source_kg+current_tool_bound_source_kg+current_held_waste_source_kg+confirmed_missing_source_kg+signed_residual_source_kg. Final external exports are mutually exclusive actual discharge/dispatch/other reviewed terminal paths, each with original source portions; each current state has a named location/carrier and source-origin kg excluding added water/dirt. A used surface portion subsequently rinsed changes from film to solution or exported carrier: replace the prior state and never add both. Any actual unlisted current state/path must be explicitly named and quantified before completeness. Allocation is independent: m0_s=sum_all_h(G_use_sh+G_preF_sh)+unused_transfer_source_kg+current_unassigned_source_kg+signed_unassigned_residual_kg, using disjoint cumulative first-use withdrawals and pre-use losses. Each original source_portion_ID enters G once only; reapplication, recovery or rinsing of that same portion never creates another first-use demand. G_sh=G_use_sh+G_preF_sh; raw N_mfg_sh=(G_sh/m0_s)*V_mfg_s and N_in_sh=(G_sh/m0_s)*V_in_s. V_mfg_s is the original m0_s formulation manufacture-at-dispatch vector only; V_in_s is the evidenced formulation-source share of actual inbound consignment only. Separate complete container/consumable vectors and their inbound shares by evidenced original sources and binding-capacity allocation, never split environmental vectors by formulation mass or duplicate a whole consignment. Unknown stage/source separation blocks completeness. Keep every historical original owner/pool/version; any G, m0 or vector revision replaces all prior records using delta_h=(G_new_h/m0_new)*V_new-(G_old_h/m0_old)*V_old, separately for manufacture and inbound. Whole single-use container manufacture/inbound uses actual complete homogeneous container count assigned once to its first-opening owner or disjoint pre-opening loss, including body/closure/liner/label/adhesive, never G/m0. Single-use consumable counts similarly follow actual first consumption; unused units retain their sources. This cleaning route admits single-use containers only; actual refill/reuse or unknown container life blocks complete status until a specific reviewed reusable-container extension, rather than choosing an arbitrary mass split. For reusable cloth/mops, cleaned m2 is measured area of each actual unique cleaning pass event across all beneficiaries including failed/zero-sale pools, not future sales or a purchase count. Their vectors instead use f_h=cleaned_m2_recorded_h/L_cleaned_m2_expected; at retirement f_final_h=cleaned_m2_actual_h/sum_all_h(cleaned_m2_actual_h), replacing every historical fV under a_assets, with repair/EOL/freight once. Acquisition and retirement counts only reconcile that tool ledger and are not another current whole-item input. Actual tool washing water/cleaner/treatment events are distinct sources with overlaps removed. Actual waste dispatch kg=weighed gross-tare; direct whole_effluent_kg=discharged_m3*same_state_density_kg_m3. Carrier whole kg and contained original-source kg are independent; do not repeat source fractions or stock deductions on measured dispatch."
      inputs:
