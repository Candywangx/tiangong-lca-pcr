    - unit_id: "normative_22292"
      family: "allocation"
      span:
        start:
          offset: 22292
          line: 188
          column: 1
        end:
          offset: 25060
          line: 197
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `a_electricity` | electricity | First use disjoint direct meters. A parent-meter subtraction is allowed only for a circuit actually inside that parent boundary; never subtract an independent meter. Allocate active equipment source kWh by measured task seconds, idle/reserved equipment kWh by all-beneficiary reserved equipment seconds, and fixed physical space kWh by measured served area×time. Separate these actual source pools and retain closed/failure/zero-sale beneficiaries. For each source, assigned raw kWh must sum to the measured source; a missing/zero all-beneficiary driver with positive energy blocks normalization, not default zero. | ghg2011 |\n| `a_assets` | retail | For each homogeneous asset vector V_v, beneficiary h uses original measured exposure e_recorded_h and evidenced expected total lifetime L_v: f_old_h=e_recorded_h/L_v. Maintain every historical pool record and cumulative fractions<=1, never restarting manufacture after a lifetime change. On every lifetime/vector revision replace all prior records with delta_h=f_new_h*V_new-f_old_h*V_old. At actual retirement use f_final_h=e_actual_h/sum_all_h(e_actual_h), replacing every historical allocation; residual1-sum_old_f is QA only. Terminal complete carrier and independent repair/retirement freight follow this same fraction once; already final-owner-attributed provider quantities skip repeat attribution only with exact owner/pool/version evidence. | ghg2011 |\n| `a_goods` | failed_original; supplier_handover; failed_retention | Use whole-source ownership only for the complete same-configuration original package. Do not split a mixed environmental vector by component mass. If components diverge in ownership, replace the whole-source card with actual separate component original quantities, properties/units and supplier vectors, conserve S/F/T/O for each, and exclude those quantities from the whole package. Physical return counts are not F or T fractions; each responsibility decision requires its independent signed final state. No recycling substitution or avoided-production credit is allowed in this core. | ghg2011 |\n| `a_once` | retail; failure; custody | Keep all original quantities raw through c_pool, c_energy, c_goods and c_merge; apply final Q once. Never sum normalized module intensities directly into raw totals or add unlike exchange/property/unit quantities. A zero-output pool remains in its predeclared same-configuration pooling history with raw numerator; if aggregate Q=0 it is unnormalizable. Late returns revise original-pool operations, fates and responsibility versions, never silently charge another current sales cohort. | ghg2011 |\n\n"
