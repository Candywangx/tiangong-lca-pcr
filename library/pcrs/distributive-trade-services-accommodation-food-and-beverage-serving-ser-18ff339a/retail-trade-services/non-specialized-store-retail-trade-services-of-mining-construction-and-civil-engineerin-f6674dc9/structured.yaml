      output: "Versioned raw historical asset numerators"
      source_ids:
        - ghg2011
    - id: c_digital
      applies_to: "service_output"
      rule: "Network: N_network_h=source_h*reserved_endpoint_seconds_h/all_endpoint_seconds, where all_endpoint_seconds=sum of measured reserved endpoint-connection seconds for all beneficiaries of that unique source interval, including empty/failed reservations. Payment/admin: N_event_h=event_source*line_processing_seconds_h/all_event_line_seconds, where all_event_line_seconds=sum of actual source-line processing seconds in that unique attempt/batch, including failed attempts and every beneficiary. Both denominators must be positive and known for a positive source; exact all_* field names are used throughout. For each original camera capture_ID i, build a_i_h=footprint_m2_i_h*coverage_seconds_i_h from actual disjoint beneficiary footprint and recorded coverage, including all empty/failed reservations. all_capture_area_seconds_i=sum_all_h(a_i_h) must be positive and known; freeze f_i_h=a_i_h/all_capture_area_seconds_i with capture_map_version_i and all original beneficiary IDs, never remap by later sales. Capture production is an independent original source: N_capture_i_h=actual_source_i*f_i_h in capture_source_unit_i, using the verified per-original-capture capture_production_source_ID_i, capture_source_vector_i, capture_original_denominator_i and capture_source_version_i. actual_source_i is the raw original capture-production source amount; if supplied normalized, restore it first as actual_source_i=capture_z_i*capture_original_denominator_i with the exact original unit/vector and evidence, otherwise retain the measured raw value directly. Never allocate capture production by later retention bytes or durations. An indivisible production total across captures is incomplete until each original capture source amount is verifiable; no alternative driver may be chosen. For each actual fixed-byte retention interval of capture i, retained_byte_seconds_i=retained_bytes_i*retention_seconds_i; variable byte inventories are split into actual timestamped intervals first. storage_byte_seconds_i_h=retained_byte_seconds_i*f_i_h. storage_provider_total_p denotes actual storage-provider activity only, never capture-production activity. Choose exactly one storage-provider attribution mode per original storage_source_packet_ID p: direct_capture only when the provider packet covers exactly that capture/retention interval, or aggregate_captures when it covers several actual captures. In direct_capture mode raw storage quantity is storage_byte_seconds_i_h, and a raw provider source storage_provider_total_p in its evidenced original unit is assigned storage_provider_total_p*f_i_h once. In aggregate_captures mode, first collect each actual member capture byte-second amount b_p_i from those same original retention records, reconcile all_packet_byte_seconds_p=sum_all_i(b_p_i)>0 to the exact packet membership and time scope, and assign raw packet source N_packet_h=storage_provider_total_p*sum_all_i((b_p_i/all_packet_byte_seconds_p)*f_i_h). Each original capture map is applied once after the packet-to-capture share, never substitute a pooled current-sales map. All actual packet members and capture beneficiaries must be included; unknown membership, bytes, duration, frozen maps or positive-source zero/unknown denominators block completeness without renormalizing known shares. Provider quantities labelled exact final_owner may skip only the corresponding already-completed packet/capture/beneficiary attribution level with matching original owner/pool/version evidence; consignment/capture-only attribution does not skip a missing beneficiary map. Preserve raw_or_normalized, storage_provider_total_p original denominator storage_original_denominator_p, original unit, constituent scope and source versions, restoring normalized source to raw before c_merge. Direct and aggregate modes are mutually exclusive for the same source event. Byte-seconds are the physical allocation driver, not a second exchange added beside the attributed provider source; the final atomic provider activity and its original unit determine the one retained exchange representation. Exclude covered on-site electricity, asset and network constituents already counted."
