        - capacity_unit
        - reservation_interval
        - all_beneficiary_reservation_map
        - d_loaded_h
        - d_empty_h
        - d_idle_h
        - sum_all_mode_driver
        - F_i
        - asset_ID
        - owner
        - original_pool
        - attribution_level
        - version
      output: "Raw loaded/empty vehiclekm and idle vehicleh numerators, separately attributed"
      source_ids:
        - ghg2011
    - id: c_assets
      applies_to: "service_output"
      rule: "Use a_assets with raw e_recorded_h, L_v, all historical exposure records and exact V_v object/stages. At final retirement E_actual=sum_all_h(e_actual_h), f_final_h=e_actual_h/E_actual. Replace all historical raw fV records and record delta; add actual repair/terminal carriers/freight only if not inside V. Do not add separate replacement manufacture beside a complete package including it."
