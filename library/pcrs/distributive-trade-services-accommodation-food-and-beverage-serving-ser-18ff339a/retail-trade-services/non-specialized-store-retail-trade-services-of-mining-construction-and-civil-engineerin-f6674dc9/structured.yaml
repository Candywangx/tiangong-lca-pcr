    - id: c_merge
      applies_to: "service_output; failed_original"
      rule: "cp_merge is the retail service_output view and cp_merge_failure is the failure failed_original view of the same original ledger_ID/record_ID/source_ID and source denominator/version; the merge deduplicates these views before one normalization. The producer restores each external normalized module z_jr to raw original numerator N_jr=z_jr*D_j using its evidenced original denominator/pool/version; raw modules retain N_jr directly. Apply only missing source→consignment→original-owner fractions. Core raw numerators are3.6*E_h MJ, F_count Item(s) and Q service Item(s), never their already-normalized card values. For each identical exchange UUID/property/unit/state/medium and compatible lifecycle boundary r, N_r=N_core_r+sum_j N_jr after exact source/event/object/time/stage overlap removal. Exclude custody satellites, S goods manufacture/inbound, and provider-contained utilities/repair/terminal carriers already counted. Then normalized_r=N_r/Q once. Do not sum kg with MJ, activity counts with asset mass, or normalized values with raw quantities. Missing D, scope, atomic extension or provider binding blocks completeness."
