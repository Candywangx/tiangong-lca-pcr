system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "retail; failure; custody"
      rule: "Use only a non-specialized physical store selling mixed product families to final users and the original complete unassembled 350DD without optional tripod stand. Keep original lot/serial, supplier order, motor/gearbox revision, the actual steel frame, polyethylene drum, motor/gearbox, mixing blades, wheel/axle/handle/hardware assembly, manual, contained factory lubricant and shrink wrap plus actual outer/protective packaging as one homogeneous configuration. Manufacturer manual pages12–13 and18–19 establish a complete machine requiring assembly, not a separate drum, motor or retailer assembly service. The Home Depot exact product listing demonstrates the model in a mixed retail channel; it does not establish local availability or this site's sealed stock. A site manager must verify the actual mixed-store route and supplier signed packing list before use."
      source_ids:
        - un62187
        - un444
        - kushlan350
        - kushlanmanual
        - hd350
    - rule_id: b_gate
      applies_to: "retail; failure; custody"
      rule: "Start at the store receiving gate after the separate upstream consignment ends. End with documented customer acceptance and physical pickup of the correct undamaged unopened complete package. Completeness at acceptance requires supplier original packing control plus external package/label/lot inspection; this is not an operating or safety test. Use one prospective pool per site/configuration and declared observation period, retaining failure-only days and closed/idle reservations. Subsequent return or acceptance revocation replaces the original record and original pool numerator/denominator; an intact resale uses the same original ID and never earns a second final-valid service. Financial refund or discount alone does not revoke acceptance."
      source_ids:
        - kushlanmanual
    - rule_id: b_exclusions
      applies_to: "retail; failure; custody"
      rule: "Do not open, unpack, assemble, install, energize, demonstrate, mix, lubricate, repair, inflate, repackage, rent, or deliver the merchandise on this route. No retail-added bags, straps, labels or receipt paper: use the verified original package and electronic receipt. Factory lubricant identity and quantity must be evidenced for the actual motor/gearbox batch; the manual contains permanent-grease language and separate assembly oil-leak language, which do not establish this batch. Factory lubrication, component state and factory testing belong to the actual original goods vector; no on-site activity does not mean factory absence. Verify the actual 350DD motor/gearbox revision because manufacturer webpage values and manual lubrication passages conflict; do not adopt catalog power, mass, voltage or packaging defaults. Any opened/damaged-content/partly missing returned unit, leakage or site waste requires a concrete state-specific card, raw protocol and bilingual revision before completeness."
      source_ids:
        - kushlan350
        - kushlanmanual
    - rule_id: b_partial
      applies_to: "retail; failure; custody"
      rule: "The supplied core is a partial incremental service inventory: metered retail electricity, failed-original manufacture responsibility, service output and two physical custody audit satellites. It is not a complete retail footprint. The dataset producer must complete b_transport, b_assets, b_digital and b_clean with all actual atomic exchanges and matching providers, then apply c_merge. Unknown module activity or identity blocks complete status. Do not silently treat known facility, handling, ICT, network, payment, administration, security, cleaning or asset lifecycles as zero."
      source_ids:
        - ghg2011
    - rule_id: b_goods
      applies_to: "failed_original; supplier_handover; failed_retention"
      rule: "Each original whole package has one signed manufacture/original-packing vector V at supplier dispatch, excluding inbound transport. Apply the cumulative final responsibility F once through failed_original. S is the final-valid customer-goods owner and is excluded from the retail-service vector; T is an identified continuing recipient that signed acceptance of background responsibility; O remains open with the original vector. Per original ID S+F+T+O=1 with no unknown share renormalized. A merely financial supplier refund is not T. Goods eventually resold never repeat manufacture. Confirmed lost original packages have F with the investigation record even without a physical waste output. A supplier vector bundling inbound transport requires verified stage separation; unknown separation is incomplete. A downstream GOODS study may add S manufacture and S inbound once, separately disclosed."
      source_ids:
        - ghg2011
    - rule_id: b_custody
      applies_to: "supplier_handover; failed_retention"
      rule: "These two outputs are measured physical package handovers, independent of S/F/T/O. Keep their recipient, location, date, intact unopened state and actual original source IDs. supplier_handover is the gross dispatch to a supplier, whether its continuing background is T or remains O/F; failed_retention is the gross handover whose final acceptance is invalid while the recipient retains the intact unopened package. Neither creates a second manufacture demand, waste treatment, recycling credit or environmental credit. Keep them in a separately labelled audit satellite, excluded from environmental aggregation c_merge. A physical package later returned changes custody but not by itself the service or responsibility decision."
      source_ids:
        - ghg2011
    - rule_id: b_transport
      applies_to: "retail; failed_original"
      rule: "The producer must inventory actual upstream inbound, supplier-return and internal handling sources separately. For inbound, allocate each trip source to its actual consignment, then to original F responsibility once; S belongs to GOODS and T/O keep their owners. Store transfers and retail-caused returns stay retail operations regardless of T merchandise manufacture. Use three disjoint measured provider service modes: loaded_vehiclekm from loaded segment odometer/GPS, empty_vehiclekm from actual empty segment odometer/GPS, and stationary_idle_vehicleh from stationary powered-state start/end timestamps. Each provider must cover the actual mode, energy and exhaust at that load/idle state; unknown coverage blocks completeness. Loaded sources use measured consignment kg*loaded_km only when weight capacity is demonstrably binding, or occupied_m3*loaded_km when volume capacity is binding. Empty sources use the same trip reservation map with d_empty_h=reserved_capacity_h*empty_km; stationary idle uses d_idle_h=reserved_capacity_h*idle_h. Capacity is consistently kg or m3 according to the evidenced binding constraint, includes all reserved beneficiaries, and cannot mix units. A positive empty distance or idle duration requires its own positive raw source and positive known all-beneficiary driver total; zero tkm does not remove it. Internal electric/manual handling uses measured task seconds including actual idle reservations; on-site fuel handling is excluded by b_facility_gate. Asset/repair/end-of-life freight first belongs to its asset and follows a_assets historical fractions."
      source_ids:
        - ghg2011
    - rule_id: b_facility_gate
      applies_to: "retail"
      rule: "This narrow route requires documented absence throughout every observation interval of on-site fuel combustion/use, fuel-powered handling or backup plant, refrigerant-containing equipment and HVAC/purchased heating or cooling for every included store zone and its leased/shared/landlord-served facilities. The facility manager must sign a full-period plant and service inventory covering opening/closed/idle periods, temporary equipment, maintenance events, landlord/shared supplies and source-bound coverage, not a single inspection. Record actual equipment_ID, owner, served_zone, interval, fuel/refrigerant/HVAC presence, supplier service scope and evidence of absence. Unknown or actual presence blocks this route and full dataset status until a specific extension defines each real fuel/refrigerant species, amount/state, stock and actual external destination/medium, disjoint provider coverage and matching atomic cards/protocols. No site emission is assumed zero merely because the merchandise remains unplugged. External fuel-powered vehicles must remain outside the included facility gate; actual on-site presence violates this narrow gate. External transport is governed separately by b_transport."
      source_ids: []
    - rule_id: b_assets
      applies_to: "retail"
      rule: "The producer must inventory actual building structure, shelf/bay, manual/electric handling device, checkout terminal, lamp, non-refrigerated ventilation fan, router and security camera as separate homogeneous model/BOM/scope vectors. The no-fuel/no-refrigerant/no-HVAC route requires b_facility_gate over the full period including shared and landlord services; absence is not inferred from an unused mixer. Manufacturing/installation, operation, event repair and end-of-life are disjoint; a complete lifecycle package may remain intact only with signed exact object/stages/exclusions and original denominator. Otherwise use evidenced component manufacture exclusively, add actual event replacement quantities and complete terminal treatment carriers without repeated included parts/freight. Use a_assets: structures/shelves use measured reserved served area*time; checkout, lamps/fans, handling and ICT devices use measured all-beneficiary reserved equipment time including idle periods. Reusable cleaning cloths/mops use measured cleaned-area exposure under c_clean, never whole acquisition at first use. Unknown actual assets or lifetime remain explicit incompleteness."
      source_ids:
        - ghg2011
    - rule_id: b_digital
      applies_to: "retail"
      rule: "The producer must separately cover actual network access, payment processing, electronic receipt/admin backend and security storage, or verify an exact complete contracted bundle. Unique network intervals allocate provider source-hours using the exact all_endpoint_seconds denominator defined in c_digital; interval existence alone does not allocate to this SKU. Basket payment and admin batches allocate each unique attempt by measured within-event source-line processing seconds shares summing1, retaining failed attempts. Camera capture-production sources use each actual original capture source times its frozen f_i_h under c_digital; future retention never reallocates production. Only actual storage-provider totals use the mutually exclusive direct/aggregate storage-packet modes, including every original empty/failed beneficiary. Preserve the frozen original map/version even after sales or deletion; indivisible capture-production totals are incomplete until each original capture source is verifiable. Use 1 GB=10^9 bytes and 1 GiB=2^30 bytes explicitly. On-site ICT electricity already in electricity is excluded from backend providers. Provider operation, asset and network constituent overlap must be checked by event/time/object/stage, not by distinct provider IDs alone."
      source_ids:
        - ghg2011
    - rule_id: b_clean
      applies_to: "retail"
      rule: "The producer must complete actual facility cleaning while merchandise cleaning is prohibited. Under c_clean, formulation net source mass excludes the separate container; source-origin current solution, surface-film, tool-bound and held-waste inventories remain distinct from unused formulation and final external exports. Water import and direct effluent are separately measured; direct effluent kg=actual discharged m3*same-state measured density, with no second reuse subtraction. Every formulation, complete single-use container, disposable consumable, reusable cloth/mop and terminal carrier needs its own actual atomic card/provider before complete status. Follow the explicit original-source G/m0 manufacture/inbound and historical replacement rules; reusable tools use cleaned_m2 lifetime exposure. Actual complete mixed carriers require signed acceptance of their actual constituents/state and complete treatment scope. Direct consignment waste kg is gross minus tare, never reduced again by retained stock or multiplied again by source composition. Any actual source loss/chemical species or destination not covered by real carrier/provider evidence requires a specific extension; unknown is not zero."
      source_ids:
        - ghg2011
