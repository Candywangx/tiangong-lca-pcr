  calculation_rules:
    - id: c_pool
      applies_to: "service_output"
      rule: "Q=count distinct original_ID whose latest signed final_valid_acceptance=true within the prospective site/configuration pool. The declared fixed service reference is1 Item(s) when Q>0. Count each once; latest revoked IDs are already absent and must not be subtracted again. Preserve actual attempt dates, repeated/refused/pending events and original source history."
      inputs:
        - original_ID
        - pool_ID
        - attempt_ID
        - event_date
        - acceptance_version
        - final_valid_acceptance
        - revocation_date
        - configuration
        - cutoff
      output: "Q in Item(s); service_output=1 Item(s) only when Q>0"
      source_ids: []
    - id: c_stock
      applies_to: "supplier_handover; failed_retention"
      rule: "Goods-only custody: predicted_closing_count=opening_count+new_receipts+customer_physical_returns+supplier_physical_returns+transfer_in-gross_customer_pickups-gross_supplier_dispatch-transfer_out-confirmed_missing-condemnation_count. signed_residual_count=closing_count-predicted_closing_count, where closing_count is observed physical stock; positive is unexplained observed excess and negative is unexplained shortage. Confirmed missing is already removed once and is not the signed residual. Condemnation changes goods to held waste internally, not actual dispatch. The independent kg ledger uses predicted_closing_kg=opening_kg+actual_condemned_kg-dispatch_kg-known_missing_kg; signed_residual_kg=closing_kg-predicted_closing_kg with the same sign convention. Link condemnation count/kg by event_ID, never equate Item(s) and kg. On-site condemnation/disposal blocks this route until concrete extensions. External retained failure is inside gross pickup, not another stock subtraction."
      inputs:
        - opening_count
        - new_receipts
        - customer_physical_returns
        - supplier_physical_returns
        - transfer_in
        - gross_customer_pickups
        - gross_supplier_dispatch
        - transfer_out
        - confirmed_missing
        - condemnation_count
        - closing_count
        - predicted_closing_count
        - signed_residual_count
        - event_ID
        - opening_kg
        - actual_condemned_kg
        - dispatch_kg
        - closing_kg
        - predicted_closing_kg
        - known_missing_kg
        - signed_residual_kg
      output: "Independent physical count and kg reconciliation with observed-minus-predicted residual signs"
      source_ids: []
    - id: c_energy
      applies_to: "electricity"
      rule: "E_h=sum disjoint direct_kWh_h + sum_source(source_kWh*driver_h/sum_all_driver). Use the exact active/idle/fixed drivers in a_electricity; source imports already exclude internal reuse and provider electricity overlap. electricity=3.6*E_h/Q MJ."
      inputs:
        - meter_ID
        - parent_boundary
        - interval
        - start_kWh
        - end_kWh
        - multiplier
        - disjoint_direct_kWh
        - source_kWh
        - source_mode
        - task_seconds
        - reserved_equipment_seconds
        - served_area_m2
        - coverage_hours
        - all_beneficiary_drivers
        - original_pool
        - version
        - Q
      output: "Raw E_h kWh; normalized electricity MJ"
      source_ids: []
    - id: c_goods
      applies_to: "failed_original"
      rule: "For each original package i, latest S_i+F_i+T_i+O_i=1. F_count=sum_i(F_i) for this exact homogeneous configuration; failed_original=F_count/Q Item(s). Demand F_i*V_i manufacture/original packing once; separately require original inbound_i*F_i through b_transport. Replace prior F_i*V_i on every decision/version change. S_count/Q is only a downstream GOODS coupling, never core service input."
      inputs:
        - original_ID
        - original_quantity
        - configuration
        - packing_BOM
        - vector_ID
        - dispatch_gate
        - vector_version
        - S_i
        - F_i
        - T_i
        - O_i
        - recipient
        - responsibility_signature
        - prior_FV
        - new_FV
        - inbound_source_ID
        - Q
      output: "Failed manufacture responsibility count and separate inbound requirement"
      source_ids: []
    - id: c_satellites
      applies_to: "supplier_handover; failed_retention"
      rule: "supplier_handover=actual gross supplier package dispatch count/Q; failed_retention=gross_invalid_retained/Q where gross_invalid_retained counts only actual handover event_IDs whose external custody interval remains open at cutoff, latest acceptance is invalid and intact external retention is evidenced; previously returned custody intervals are closed and excluded. Link actual dates and state replacement; these satellite quantities cannot be used as F_i or T_i and are excluded from c_merge."
      inputs:
        - original_ID
        - gross_supplier_dispatch
        - gross_customer_pickups
        - gross_invalid_retained
        - custody_interval_ID
        - custody_open_date
        - custody_close_date
        - cutoff
        - event_ID
        - final_valid_acceptance
        - intact_external_retention
        - recipient
        - physical_date
        - current_state
        - Q
      output: "Two independently typed physical custody outputs"
      source_ids: []
    - id: c_transport
      applies_to: "service_output; failed_original"
      rule: "cp_transport is the retail service_output view and cp_transport_failure is the failure failed_original view over the same original ledger_ID/record_ID/source_ID, denominator and version. Measure each source once; view selection does not create another observation or normalization. For each mode and trip keep disjoint raw provider activity: A_loaded=loaded_vehiclekm, A_empty=empty_vehiclekm and A_idle=stationary_idle_vehicleh. Obtain loaded/empty odometer/GPS boundaries and idle powered-state start/end timestamps; a positive observed mode requires a positive measured activity and matching complete provider. For loaded k use d_loaded_h=consignment_kg_h*loaded_km under a measured weight constraint or occupied_m3_h*loaded_km under a measured volume constraint. For empty k use d_empty_h=reserved_capacity_h*empty_km; for stationary idle use d_idle_h=reserved_capacity_h*idle_h, with actual positive idle_h even at distance0. Freeze actual all-beneficiary reservation capacity by the same evidenced kg or m3 basis for that trip; include empty/failed reservations, require positive known sum_all_h(d_mode_h), and do not replace it with future sales. N_mode_h=A_mode*d_mode_h/sum_all_h(d_mode_h). Then consignment-to-original F applies once to inbound; retail return/handling follows original affected pool; asset freight follows a_assets. Record attribution_level raw_trip, consignment or final_owner and skip only an already-applied exact matching level. Zero/unknown driver totals with positive activity block completeness."
      inputs:
        - cp_transport
        - cp_transport_failure
        - ledger_ID
        - record_ID
        - trip_ID
        - mode_ID
        - segment_start
        - segment_end
        - odometer_start_km
        - odometer_end_km
        - GPS_segment
        - loaded_vehiclekm
