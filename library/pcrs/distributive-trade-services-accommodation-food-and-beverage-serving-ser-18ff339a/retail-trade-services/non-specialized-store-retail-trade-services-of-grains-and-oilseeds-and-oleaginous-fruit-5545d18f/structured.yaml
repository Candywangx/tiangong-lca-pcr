system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_scope
      applies_to: "retail"
      rule: "Only the declared sealed dry whole-food-wheat physical-store route is covered. Keep each quality/specification stratum separate; neither the shared CPC label nor equal kg makes food wheat equivalent to seeds, feed or oilseeds. The classification association is narrower."
      source_ids:
        - un-cpc3-62111
    - rule_id: b_gates
      applies_to: "retail"
      rule: "Start at retailer receipt, including unloading/acceptance effort, quarantine, sealed storage/display, checkout, cleaning, stock administration, buyer handover, returns attributable to that service, and downstream treatment of retailer waste. End at buyer handover for qualified goods and verified treatment boundaries for waste. Supplier delivery up to receipt is outside foreground and is in the matched goods background; exclude buyer travel, consumption and buyer packaging disposal."
      source_ids:
        - jrc-retail-2013
    - rule_id: b_goods_loss
      applies_to: "wheat_loss_input"
      rule: "Qualified goods production and their original packs remain in the downstream goods system. Within this service, include only L/Q kg of packaged wheat background for irreversible retailer losses L, at the same delivered-receipt gate, including the lost share of original packaging and supplier transport. Do not include all incoming goods here. A downstream product-plus-service result adds 1 kg of the matched delivered-receipt goods background plus this service, so lost goods production is included once. Supplier returns with documented recovery remain transferred stock; unrecovered or unknown disposition is not assumed recovered."
      source_ids: []
    - rule_id: b_stock
      applies_to: "retail"
      rule: "Keep merchandise ledgers separate from inventory exchanges. Record opening stock, supplier receipts, customer returns, closing stock, supplier returns, gross buyer handovers, damaged grain and moisture change by lot. Internal moves are not new receipts, sales or outputs. Distinguish physical customer returns R from financial refunds/discounts. Q = H - R - F, where H is physical buyer-handover mass, R is physically returned mass reversing that cohort handover, and F is final disqualified handover mass retained by the buyer without a physical return. A price concession with unchanged acceptance does not change physical mass or Q. Trace all reversals to original handover IDs. Failed customer-retained wheat is not automatically retailer grain waste: record its actual recipient, status and final disposition, include its lost-goods background in L, and add the specific terminal transfer or treatment card under b_expansion before completeness. Do not count F as qualified service. Resale enters only the new handover after reversal of the original. Positive Q is required for normalization; retain every Q=0 burden in an unnormalized report or the prospectively declared same-configuration 12-month pool, never delete it or select a pool retrospectively to improve the result."
      source_ids: []
    - rule_id: b_capital
      applies_to: "building_input,pallet_input,till_input,lighting_input,broom_input"
      rule: "Include manufacture, maintenance and terminal treatment of the complete building shell and fixed infrastructure, wooden pallets, complete tills, complete LED luminaires and complete brooms used by the service. Use manufacture-to-installed/commissioned-gate asset backgrounds, including construction/installation and upstream delivery, but excluding operation, maintenance and terminal treatment. The building package excludes every separately modelled till, pallet, broom and LED luminaire whether fixed or movable. A background containing terminal treatment must have that module verifiably removed before use with the paired terminal card; otherwise it is incompatible and blocks completion. Complete devices include their components; do not add their steel, electronics, lamps or wood again. Use asset cohorts and documented service-life allocation in c_capital, with paired terminal flows for that same cohort; no second charge for actual period retirement. Include refurbishment and maintenance replacements using separate exact material/device cards when they are not already included in a verified complete-asset background. Ownership versus lease does not remove responsibility; a verified leased supply may replace, never overlap, the owned asset scope."
      source_ids: []
    - rule_id: b_expansion
      applies_to: "all inventory rows"
      rule: "Inspect equipment, contracts, invoices, safety sheets, maintenance and waste records for each reporting period. Any actual fuel, heat, refrigeration/refrigerant, chemical cleaner, pest-control agent, powered transport, additional packaging, information/telecom service, consumable, asset, maintenance part, direct dust/emission or waste not represented by a card blocks completeness until a specific card with direction/type, state, property/unit, measurement protocol, quantity, attribution and treatment/receiving medium has been added to both languages and resynced. No generic other-material/other-service row or omission is allowed. Evidence-confirmed absence is not_applicable; unknown is unresolved and cannot be zero. Opening bags, grain treatment, repacking, cooking or buyer delivery falls outside this route and requires a separate applicability decision."
      source_ids: []
    - rule_id: b_waste
      applies_to: "grain_waste,paper_waste,film_waste,wastewater"
      rule: "Follow each actual waste carrier to its recipient and treatment. Grain waste excludes separately measured bag/liner mass; paper and polyethylene wastes contain only those actual streams. A contaminated or inseparable composite requires its own identified waste card rather than fictional pure-material splitting. Sewage is a waste output to treatment, never an elementary emission to water. Do not add constituent emissions to the untreated carrier; treatment datasets own their emissions unless that treatment is explicitly expanded. Sold recoverable goods remain goods only with quality, acceptance and destination evidence; no automatic recycling/substitution credit."
      source_ids: []
