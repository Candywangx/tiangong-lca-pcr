      flow_role: "reference throughput and merchandise stock"
      record_type: "ledger"
      raw_fields: "lot; original handover/event ID; physical period; service cohort; supplier; species; food grade; pack; net kg; moisture wet basis; opening/closing; receipt; physical handover H; physical return R; final failed retained F; financial concession; onsite loss W; final disposition; dates"
      collection_method: "At store receiving and checkout reconcile calibrated net weighing/verified pack net weights to batch invoices and transaction/return IDs; count sealed packs and independently check sample weights; collect batch certificate or documented moisture sample, inspect pack integrity and quarantine records. Detailed aggregation: c_stock gives Q and L; retain all other-category counts for shared drivers; persist original-event ownership and all later actual return/replacement/waste numerator corrections; reconcile each physical period once across original and new-service cohorts"
      unit: "kg; moisture fraction"
      frequency: "each movement; period-end physical count"
      temporal_coverage: "same full reporting period plus traced later returns"
      site_scope: "whole store and wheat stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; lot certificates; receipts; dated sales/returns; signed stock reconciliation"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "meter ID; start/end kWh; interval; circuit; power; run/idle hours; all-user shares; provider; voltage; delivery gate"
      collection_method: "Read point-of-use meter at store and relevant circuits; use logged equipment power-time study across open/closed hours where not separately metered; reconcile to invoice and whole-store circuit sum. Detailed aggregation: convert kWh to MJ once, apply a_subdivision and c_electricity"
      unit: "kWh; h"
      frequency: "interval readings and monthly reconciliation"
      temporal_coverage: "same full reporting period including closed hours"
      site_scope: "all store electricity end uses and other-category users"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; circuit map; study raw logs; invoice and balanced shares"
    - protocol_id: cp_water
      process_id: "retail"
      flow_role: "potable cleaning water and sewage"
      record_type: "meter"
      raw_fields: "water meter; inlet/outlet volume; mass or density; temperature; evaporation/retention; cleaned area-time; recipient carrier_id; discharge_state; effluent_water_mass_fraction w_water; water_fraction_assay_and_uncertainty; water_in_purchased_formulations_materials; opening/closing water stocks by location; other export water components; external water vapour; signed_water_residual"
      collection_method: "Measure dedicated cleaning draws and discharged effluent at store; calibrate vessel/scale or meters, measure relevant water/effluent density if volume converted; separate staff/other-product use by measured cleaned area-time and reconcile water balance. Detailed aggregation: attribute once, then c_waste and c_normalize; unresolved loss balance blocks completion Measure whole-effluent density and its representative water fraction independently at the same discharge state; retain sampling, dry-solids/composition method and water in other actual sources/exports. Close the water-component control volume under c_waste; whole carrier kg is never a substitute for water kg."
      unit: "kg; m3; kg/m3"
      frequency: "each cleaning batch; monthly check"
      temporal_coverage: "same full reporting period"
      site_scope: "store wet-cleaning points and sewer handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; mass/volume test; cleaning log; water balance; sewer acceptance"
    - protocol_id: cp_packaging
      process_id: "retail"
      flow_role: "extra kraft bag and original-pack wastes"
      record_type: "weighing"
      raw_fields: "material; composition; tare kg; issued bags; opening/purchases/closing; lost packs; recipient; linked grain lot"
      collection_method: "Weigh each exact bag/liner material at store; reconcile extra issued kraft carry bags to stock and packaging waste to damaged/rejected grain lots. Retained original packs of qualified goods are outside the service burden; lost original packs are already upstream in wheat_loss_input. Detailed aggregation: extra issued bag kg / Q; carrier waste separately / Q; avoid duplicate manufacture of lost original packs"
      unit: "kg"
      frequency: "each material batch and waste dispatch"
      temporal_coverage: "same full reporting period"
      site_scope: "checkout and store waste bins"
      aggregation_rule: "per reference flow"
      quality_evidence: "tare calibration; material specifications; bag ledger; linked waste tickets"
    - protocol_id: cp_assets
      process_id: "retail"
      flow_role: "complete capital assets and terminal cohorts"
      record_type: "asset_register"
      raw_fields: "asset cohort; exact complete configuration; count; commissioned date; original/revised service life; period years; all-period/all-beneficiary fraction ledger; previously assigned and remaining provision; premature retirement; replacement cohort; owner/lease; manufacture-only boundary; repair; all-user driver including idle; terminal plan and recipient"
      collection_method: "At store inventory the complete building shell/fixed infrastructure, pallets, till, LED luminaires and brooms; inspect owner plans, purchase and maintenance records, expected/actual service life and specific terminal route. Match upstream full-device scope to component exclusions. Record actual maintenance; expand uncovered parts before use. Detailed aggregation: c_capital pairs manufacture and terminal provision on same cohort; separately collect maintenance not already in background"
      unit: "Item(s); years; driver units"
      frequency: "at commissioning/repair/retirement; annual audit"
      temporal_coverage: "same reporting period and supported asset lifetime"
      site_scope: "entire asset cohort and all shared users"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset IDs; measured configuration; supported life study; owner terminal plan; full-scope supplier evidence"
    - protocol_id: cp_waste
      process_id: "retail"
      flow_role: "grain, packaging and complete-asset waste"
      record_type: "weighing_and_transfer"
      raw_fields: "carrier identity; kg or complete Item(s); batch/cohort; treatment; recipient; destination fractions; transport gate; measured contamination"
      collection_method: "At retailer exit weigh each grain/paper/film stream excluding separate components; retain recipient acceptance and treatment scope. For complete assets use exact cohort count and verified complete-device dismantling/treatment dataset; count one intact defined asset, never an undefined pile. Terminal cohort amounts use c_capital; audit actual disposal records to update life and route, not as a second exchange. Detailed aggregation: c_waste or c_capital once; each carrier destination fractions total one"
      unit: "kg; Item(s)"
      frequency: "every physical dispatch; annual cohort-plan audit"
      temporal_coverage: "same period for operational waste; declared lifetime for capital"
      site_scope: "store to identified treatment boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scale; recipient tickets; transport/treatment dataset gates; coherent cohort terminal plan"
    - protocol_id: cp_conditions
      process_id: "retail"
      flow_role: "actual route and absence/completeness decisions"
      record_type: "site_audit"
      raw_fields: "equipment; contracts; chemical sheets; fuel/heat; refrigeration; transport; telecom; packaging; maintenance; emissions; occurrence; evidence; gap; responsible person"
      collection_method: "At start and end of period and on any operational change inspect site, invoices, equipment and service contracts; cross-check operator interview with records. For every b_expansion condition record present, evidenced absent or unknown; present requires exact additional exchange and protocol before dataset completion. Detailed aggregation: no numerical normalization; apply b_expansion and v_complete to all conditions"
      unit: "occurrence record"
      frequency: "period start/end and every change"
      temporal_coverage: "entire reporting period"
      site_scope: "whole store, contractors and wheat stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "dated inspection; signed occurrence register; invoices; safety sheets; unresolved gap register"
  calculation_rules:
    - id: c_normalize
      applies_to: "all inventory rows"
      rule: "For each exchange, normalized amount = service_cohort_amount / Q; service_cohort_amount is the attributable service-cohort exchange quantity and Q is net completed kg from cp_stock. The numerator includes original-period operations plus all later actual return, replacement, handling and waste activity attributable to those original handovers. Persist event-to-cohort ownership, correct original-period Q and every affected numerator, and remove the same events from later-period new-service pools. Reconcile cohort allocations to each physical period meter and waste ledger once, even for cross-period events. Convert source units once before attribution; do not divide a per-kg background inventory by Q again. Physical inflows, wastes and internal stock are not forced to 1 kg."
      inputs:
        - service_cohort_amount
        - Q
        - cp_stock
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: c_electricity
      applies_to: "electricity_input"
      rule: "Electricity MJ = metered kWh x 3.6, then apply a_subdivision once and divide by Q. Meter reconciliation includes lighting, ventilation, checkout and other electric loads inside the declared route; a supply dataset includes generation and network losses only to the declared delivery gate."
      inputs:
        - cp_energy
        - Q
      output: "MJ per reference flow"
      source_ids: []
    - id: c_stock
      applies_to: "wheat_loss_input,grain_waste,retail_service"
      rule: "Opening + supplier receipts + physical customer returns R = closing + supplier returns + physical buyer handovers H + physical grain waste W + measured moisture/outlier adjustment, all kg on the same wet basis. Q = H - R - F, with F the final disqualified buyer-retained mass excluding physically returned R; financial-only concessions with unchanged acceptance do not alter H, R or F. Explain every residual against instrument uncertainty, do not classify residual as an emission or set a default tolerance. L = W + F: measured irreversible onsite grain loss W plus final failed buyer-retained mass F; include proven destructive rejection/returned grain in W, excluding recoverable supplier returns and moisture-only change. Trace F to its documented final transfer/treatment route without inventing onsite waste. Keep physical-period stock reconciliation separate from corrected service-cohort attribution; include all later actual loss/return activities in the original cohort numerator once. Loss background = L/Q."
      inputs:
        - cp_stock
        - cp_waste
      output: "Q; L; kg loss background per reference flow"
      source_ids: []
    - id: c_capital
      applies_to: "building_input,pallet_input,till_input,lighting_input,broom_input,building_waste,pallet_waste,till_waste,lighting_waste,broom_waste"
      rule: "For each identical asset cohort, attributable lifetime provision = complete asset count x reporting-period years / supported service-life years x causal service share; divide by Q. Maintain a persistent ledger across every period and beneficiary for each commissioned cohort: cumulative assigned manufacture and paired terminal fractions must each remain at most one and close to one on final retirement. Apply the same ledger fraction and service share to that cohort terminal full-asset waste quantity. On revised service life, distribute only the previously unassigned residual across supported remaining use; never restart the complete asset. On premature retirement, allocate residual provision to actual historical beneficiaries using their persisted causal-use shares and correct their cohort reports; missing historical drivers retain unresolved residual, never zero or a new service-life reset. A replacement is a separately identified new asset cohort. Do not substitute actual-period retirements for the prorated terminal provision or add them twice. Maintenance not in the asset background uses actual period quantities / Q. Record service-life evidence, uncertainty, repair history and planned/actual terminal route; unknown life or terminal route blocks completion, never adopt an arbitrary default."
      inputs:
        - cp_assets
        - Q
      output: "Item(s) per reference flow"
      source_ids: []
    - id: c_waste
      applies_to: "grain_waste,paper_waste,film_waste,wastewater"
      rule: "Use measured separated carrier kg, each divided by Q. Whole effluent m_effluent=actual V_discharge*measured same-state whole-effluent rho_effluent, with no evaporation/retention deduction. Maintain an independent WATER-COMPONENT ledger: m_water,out=m_effluent*w_water, where w_water is the measured water mass fraction of that same actual discharged carrier; dissolved/suspended dry matter is not water. For one control volume reconcile all imported water components (separate water supply, water in purchased formulations/materials, and opening water stock)=water in effluent+water in other actual exports+actual external water-vapour transfer+closing water stock+signed investigated residual. Internal reuse is an internal transfer and cancels. A directly source-resolved water-kg amount receives no additional w_water. Determine each outlet water component from actual composition/traceable measurements; unknown water fractions or residuals block a water-closure claim, never correct direct effluent kg by that residual. Grain and packaging destination shares sum to one for each actual carrier; apply once. Already substance-based amounts/factors receive no additional composition fraction."
      inputs:
        - cp_water
        - cp_waste
        - Q
        - V_discharge
        - rho_effluent
        - w_water
        - water_in_formulations
        - opening_water_stock
        - closing_water_stock
        - other_export_water
        - external_vapour_water
        - signed_water_residual
      output: "kg per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Before concrete dataset completion, bind every actual card to one verified flow and verify name, physical state, type, property/unit and receiving medium, including the reference service. Unbound candidate identities remain explicit, not zero and not approved; no proxy UUID is silently substituted. Confirm supplier/recipient and full gate scope separately from generic flow identity."
      evidence: "Direct record and supplier/recipient scope evidence"
    - id: q_quality
      applies_to: "retail_service"
      requirement: "Declare buyer acceptance requirements, species, grade, net weight and moisture wet basis; verify incoming certification/lot checks and sealed-pack integrity. Collect moisture from a documented representative lot sample or traceable supplier batch certificate; do not open sale packs solely to create an inventory convention. Do not import generic FAO moisture, temperature or pest-treatment recommendations as default settings, food-safety limits or verified compliance."
      evidence: "Lot acceptance record and cp_stock"
    - id: q_uncertainty
      applies_to: "all inventory rows"
      requirement: "Prospectively declare one same-configuration 12-consecutive-month reporting pool covering season, idle/no-sale intervals and stock carry-over; separate changed configurations. Keep every failed or Q=0 subperiod burden in that pool. If the complete pool has no positive Q, issue an unnormalized burden report and incomplete status; never erase the burden or choose future pooling after seeing the result. Use actual complete reporting-period records. Record instrument IDs, calibration, sampling error, missing intervals and replacement methods; a replacement estimate needs explicit basis, uncertainty and sensitivity. Missing identity, amount, driver, route or evidence blocks complete/approved output; preserve it as unknown pending collection. No numerical default consumption, yield, life or screening range is supplied."
      evidence: "Meter/scale calibration and gap register"
validation_rules:
  - rule_id: v_reference
    applies_to: "retail_service"
    rule: "Require Q > 0, one linked output of 1 kg mass-throughput retail service, complete required qualifiers and consistent per-reference denominators in both languages. The service must never resolve to a wheat commodity UUID."
    source_ids: []
  - rule_id: v_responsibility
    applies_to: "wheat_loss_input,grain_waste"
    rule: "Reconcile cp_stock, loss makeup L/Q, packaging and recipient records; demonstrate that downstream goods background at 1 kg plus service covers qualified and lost goods once. Unknown supplier-return recovery or later returns prevents a final claim until corrected. No missing production burden or duplicate whole-receipt charge is allowed."
    source_ids: []
  - rule_id: v_complete
    applies_to: "all inventory rows"
    rule: "Pass only after every applicable exchange, upstream gate, shared allocation, asset cohort, treatment route and conditional expansion under b_expansion is measured or explicitly evidenced; verify all row/protocol/rule links and source hashes after sync. A schema/fingerprint pass or the atomic/localized marker is not scientific, translation or publication approval. Absent processes require positive absence evidence; unresolved scope is incomplete."
    source_ids: []
published_dataset_profile:
  dataset_role: "Incremental receipt-to-handover retail service dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Combine only with 1 kg qualified food-wheat background at the declared gate, retaining service loss makeup; apply only to the same store route and qualified stratum"
  excluded_use: "Not wheat production, whole CPC 62111 coverage, seed/feed or online delivery, food-safety certification or approved methodology"
  required_metadata: "non-specialized store and country; reporting dates; food wheat species and grade; supplier pack and net mass; delivered-receipt supply gate; moisture wet basis; acceptance specification; opening/closing stock; returns cut-off and corrections; residence time; energy supply and building/asset configuration; waste recipients; allocation evidence"
  required_quality_disclosure: "Flow identities, sources, allocation, loss responsibility, asset life/terminal scope, collection gaps, uncertainty and reconciliations; candidate methodology and unbound identities do not establish completed data"
  update_trigger: "Update on grade/pack, store route, supply gate, assets, energy, returns, life/treatment, measurement or classification evidence change"
data_sources:
  - id: "un-cpc3-62111"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, subclass 62111; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62111"
    used_for: "Official classification and narrower relation; no retail methodology or consumption default"
  - id: "fao-storage-management"
    type: "handbook"
    reference: "FAO, Manual of the prevention of post-harvest grain losses, section 5.2 Store management; https://www.fao.org/4/x5065e/x5065E0a.htm"
    used_for: "Storage acceptance, holding, hygiene, movement records and moisture context; agricultural store guidance is not a retail-route default procedure or limit"
  - id: "jrc-retail-2013"
    type: "official_guidance"
    reference: "Schoenberger et al., Best Environmental Management Practice in the Retail Trade Sector, EUR 25998 EN (2013), DOI 10.2791/1775, sections 1.2, 2.1.6.5, 2.4.6; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Retail energy, store monitoring and waste-scope context; no transfer of benchmark numbers, performance claims or legal compliance"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:b66ce9843c09fb1131f7a03a7df102ffb6560a034293c90cdb7dad65a5100147"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_4049"
      family: "system_boundary"
      span:
