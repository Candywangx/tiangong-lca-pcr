allocation_rules:
  - rule_id: a_subdivision
    applies_to: "all inventory rows"
    rule: "First meter or record the actual task and subdivide dedicated use. Allocate each remaining shared end use using its determining physical driver: measured equipment power-time for electricity; occupied floor-area-time for building and general lighting; pallet position-time for pallets; checkout handling time for till; cleaned area-time for water/broom. Determine driver shares over all products using that end use, including other categories, with shares summing to one. Reconcile all shares to the total meter/asset pool before dividing by Q. Include idle, closed and no-sale intervals in each end-use pool. Allocate building-related common/base-load energy and circulation/office floor pools using measured occupied department floor-area-time across all categories; allocate equipment idle provision using its same full-pool causal user shares, including failed-service/return handling. Zero annual driver or an unassignable common pool remains unresolved with the full burden retained, never discarded or divided by an invented driver. Do not allocate the complete store solely over wheat sales or multiply a driver share twice."
    source_ids: []
  - rule_id: a_unresolved
    applies_to: "all inventory rows"
    rule: "If a causal driver or full shared-use denominator is missing, collect a time-and-motion/submeter study covering operating and idle periods and all users; until then retain unresolved attribution and block a complete dataset. Do not default to turnover, purchase value, equal shares or zero. No co-product allocation or negative burden is introduced for rejects; disposal costs or recovery revenue are disclosed separately from physical quantities."
    source_ids: []
