system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope
      applies_to: "store_sale"
      rule: "Only a demonstrably non-specialized mixed-assortment store, one homogeneous unused primary alkaline LR6 four-cell consumer SKU with intact original paperboard packaging, and walk-in handover qualify. Preserve manufacturer/order number, actual GTIN, cell model, four-cell count, lot/date, packaging full BOM and acceptance specification. VARTA4906 order04906 121414 (catalogue GTIN4008496559435) is a representative specification, not an LCI or a default mass. Brand non-exclusivity alone does not establish a non-specialized store. Exclude tyre, tube, instrument, rechargeable/lithium/other-size cell, loose-cell, repacking, installation, testing/discharge and delivery services."
      source_ids:
        - un-cpc-62159
        - varta-catalogue-2025
    - rule_id: route
      applies_to: "all processes"
      rule: "Use an ambient naturally ventilated store route with manual handling and electrically powered lighting, fan, radiant heating and checkout only where actual site survey confirms no refrigerant circuit, combustion fuel, purchased heat, on-site charging or powered handling. These are applicability conditions, never zero assumptions. Include actual shared building circuits through electricity allocation. Any different necessary source needs a named atomic extension with protocol, calculation and aligned translation before completeness; otherwise report this route inapplicable."
      source_ids:
        - jrc-retail-2013
    - rule_id: gates
      applies_to: "store_sale; residual"
      rule: "Start at supplier-delivered store receiving after original merchandise production and inbound transport, including its original consumer pack and allocated transport packaging. End at final-valid customer acceptance or the evidenced actual final fate; include storage, display, checkout, returns, failure handling, hygiene, capital and waste handover/treatment. Customer travel, use and normal post-sale disposal belong downstream. No customer bag/wrap is assumed: require actual no-additional-packaging policy and issue records, or add its measured material and fates."
      source_ids:
        - jrc-retail-2013
    - rule_id: ownership
      applies_to: "failed_pack; service_output"
      rule: "For each original pack source s fix S/F/O/T responsibility at the same receiving gate. S is an original eventually delivered with final-valid acceptance and remains a purchaser merchandise background; F is a failed/lost original whose production plus inbound responsibility remains this service; O is open stock; T transfers the SAME original source responsibility to a named supplier, external recipient or internal asset with evidence. Sum the fractions for each original to1. The actual failed_pack product input carries sum_s whole_mode_s*original_pack_count_s*F_s/Q and links the whole-mode original supplier vector exactly once; component mode follows source_integrity and its actual component cards, with whole_mode_s=0. A supplier refund does not erase production. A supplier return requires named continuing responsibility and actual transport records. Downstream whole-mode goods completion is sum_s (whole_mode_s*original_pack_count_s*S_s/Q)*the verified original supplier vector_s at that same gate, added to this incremental service once; retain O/T in their named owners, never add all receipts. Unknown recipient/responsibility is incomplete, never zero."
      source_ids: []
    - rule_id: source_integrity
      applies_to: "failed_pack; residual"
      rule: "Whole-pack mode stays intact when the entire original four-cell paperboard pack has one S/F/O/T owner: failed_pack=N_F/Q links its actual full supplier receiving-gate vector once. Component mode is permitted ONLY with verified supplier component inventory vectors and original quantity units that exactly reconstruct that original pack, assembly and inbound boundary. Use component_cell input for original LR6 cells in Item(s), component_board for the complete original printed/coated/adhesive paperboard consumer-package object in Item(s), component_assembly for the actual one-pack assembly service in Item(s), and component_inbound for the actual original-pack receiving-gate freight provision in Item(s) with exact consignment/route/load/empty-leg coverage. Each is one actual verified supplied object/service, never a guessed mass fraction of an environmental vector. For original s and component c record original amount n_s_c and mutually exclusive S_s_c/F_s_c/O_s_c/T_s_c fractions summing1; its foreground input is sum_s n_s_c*F_s_c/Q, while downstream S/T/O retains that SAME source vector and amount. Explicitly set whole_mode_s=0 for every component-mode original, so its whole-pack F input is excluded; whole-pack N_F=sum_s whole_mode_s*original_pack_count_s*F_s. Supplier assembly/inbound responsibilities must themselves be assigned and conserved, not omitted when cells/packaging differ. Different actual component models/vectors require distinct model-specific rows. No mechanical component splitting of a normal whole-pack original; no catalogue mass, LCI mass split or duplicated descendant background."
      source_ids:
        - varta-catalogue-2025
    - rule_id: custody
      applies_to: "residual"
      rule: "Maintain a goods-only count ledger: opening goods + receipts + physical customer returns + internal inward = closing goods + ALL gross customer handovers + physical supplier returns + internal outward + condemnation + unexplained loss. Gross customer handovers include accepted and never-accepted physical exits exactly once. Condemnation moves goods to held waste internally; subsequent waste dispatch removes held waste, never goods again. Count cells and packaging kg separately after opening; late revocation without movement reclassifies acceptance only. Physical externally retained failed intact packs use external_pack; external_partial/external_spent cover evidenced externally retained partly used/spent cells; opened unused externally retained cells require an actual state-specific additional card before completeness. No automatic retailer waste."
      source_ids: []
    - rule_id: takeback_boundary
      applies_to: "takeback"
      rule: "Keep the actual collector-admitted mixed old portable-battery carrier and its program/chemistry/state contract separate from new stock/returns. Takeback creates no new-pack output, virgin input or avoided-production credit. PCR allocation is fixed: directly segregated event/source records go to their evidenced beneficiary; a genuinely shared takeback program uses d_p=sum_intervals reserved_admitted_capacity_kg_p*reservation_hours_p and alpha_p=d_p/sum_all_b d_b across ALL actual retail cohorts/program sponsors/standalone collection beneficiaries. The capacity is actual reserved collector-admitted kg, not received kg, sales count, revenue or an unchosen downstream rule. Preserve idle/closed/zero-sale reservations; all-beneficiary denominator must be known positive. A standalone collection beneficiary keeps its own numerator rather than passing it to new-pack retail. Isolate actual program operation source totals first, then apply alpha ONCE to shared operation, received/dispatched old carrier kg and collection/treatment contract numerators; their raw physical stock ledger remains whole, not allocated twice. Do not multiply again by handler time or general-store allocation. For the bin use its OWN lifetime e/L or final e/E over all period/beneficiary reserved kg*h directly, never multiply the bin fraction by alpha again. New-stock returns remain in residual, not takeback. Unknown program, capacity, beneficiary or treatment prevents completeness."
      source_ids: []
    - rule_id: asset_coverage
      applies_to: "support"
      rule: "Premises is ONE actual complete physical building model/BOM including shell, floor, fixed lighting, fan, electric heater and wiring, manufacture/installation, actual maintenance and terminal treatment. Shelf, manual trolley, manual pallet jack, checkout station, network gateway, security system and administration workstation each have their OWN physically bounded model card. Shelf excludes every trolley/pallet jack; no shelf-handling bundle is presumed. Keep a multi-object package only if an actual single complete contract/model and measurable whole object are evidenced and all component/operation exclusions are explicit; otherwise separate actual objects with distinct rows and full vectors. Checkout includes its actual counter, terminal, scanner, printer, drawer, supplies/cables; gateway includes actual router/modem/switch/cabling; security includes actual cameras/alarm/controller; admin includes actual desk/computer/display. Each card instance binds one actual model and full vector, not an undefined item proxy. Exclude operational electricity, telecom/payment/monitoring/bookkeeping service, paper, cleaning and merchandise from these capital vectors. Complete life includes only that same object manufacture/installation, model-specific maintenance/replacements and terminal treatment/transport. Uncovered necessary devices require their concrete model-specific cards before completeness."
      source_ids:
        - jrc-retail-2013
    - rule_id: leak_response
      applies_to: "hygiene; residual"
      rule: "New-product leak response uses actually identified sepiolite granules and nitrile gloves only where actual safety procedure permits. Keep recovered electrolyte in whole contaminated absorbent/wipe carriers separate from remaining discarded cells; weigh terminal net carriers including retained contamination. No drain flushing, evaporation factor or automatic elementary release is allowed. Record observed escaped liquid, stocks, capture and final destination. Any uncontained release requires measured species/compartment and additional atomic cards; unresolved release cannot be zero. Third-party incident response not covered by the declared inputs requires a separate bounded service card."
      source_ids: []
    - rule_id: return_transport
      applies_to: "supplier_return_transport"
      rule: "Raw-segment supplier-return freight capacity choice is fixed by the actual contract constraint: use kg only when payload mass is the evidenced binding reservation constraint and cube/loading positions are nonbinding; use usable m3 only when cube/loading positions are evidenced binding and payload mass nonbinding. Record those proofs per segment. Where both bind, neither is known or a heterogeneous service cannot be physically partitioned into independently measured single-constraint segments, raw allocation is unavailable: obtain a provider already-attributed actual consignment vector with verified physical allocation/empty/idle coverage, otherwise incomplete. For each eligible segment use actual km times reserved capacity_p/sum_all_b reserved capacity_b in that fixed unit. Dedicated/empty reserved legs keep actual vehicle km and their booking capacity ownership, never zero tonne-km. Quantitatively verify actual stationary idle fuel in the matched full trip service vector; unknown coverage blocks completeness. Provider-attributed quantity is used directly without a second driver. Original inbound/waste/takeback transport already in other physical boundaries is excluded by physical route/stage/load and vector evidence, not different source IDs."
      source_ids: []
    - rule_id: support_services
      applies_to: "support"
      rule: "Include actual ICT/broadband access, attempted-payment authorization, remote security monitoring and bookkeeping service through named cards below, plus actual on-site gateway/security/admin capital cards. Each is conditional only on a signed site topology, contracts/invoices and activity records proving actual presence or absence across ALL pool/idle periods; a necessary missing provider or capital object is incomplete, never an assumed zero. cp_support_services fixes active/fixed allocation. Provider full vectors must cover their actual remote network/datacenter/office electricity and capital and exclude on-site AC, gateway/checkout/security/admin hardware already modeled. Record a physical coverage matrix by object serial/model, meter circuit, route/stage, time period, service function and supplier vector components. Match intersections even when source IDs differ; remove an overlap only through a verified original provider subvector/quantity, never an arbitrary percentage. Unknown overlap or inability to separate a provider-full package blocks completion. Add each real additional named card/protocol/calculation before complete data; no general expansion sentence waives these duties."
      source_ids: []
    - rule_id: transport_source_ownership
      applies_to: "support; store_sale; hygiene; residual; takeback"
      rule: "A full asset vector V_a_v includes actual delivery/installation, maintenance replacement freight and terminal removal/treatment transport for THAT asset. If separately sourced, measure and verify the original transport vector and bind it first to that asset source/version before constructing V_a_v; allocate by the same current e/L or final e/E and DeltaV for ALL historical beneficiaries. Never charge independent asset freight entirely to the current Q. Paper, cleaner formulation and complete packaging delivery vectors follow their original material source and first-consumption/stock responsibility fractions (paper_responsibility_l_pool or measured formulation consumption/original fill), including WIP carryover; original goods inbound follows whole/component S/F/O/T. Actual waste receiver vectors must explicitly cover each dispatch collection vehicle/empty return, treatment and necessary container life; missing transport/container becomes a concrete measured additional card before completeness. Record route/stage/consignment/time/object and physical vector overlaps. A different ID or invoice does not make duplicate freight disjoint. Normalize each original compatible numerator only after these responsibilities/version replacements."
      source_ids: []
