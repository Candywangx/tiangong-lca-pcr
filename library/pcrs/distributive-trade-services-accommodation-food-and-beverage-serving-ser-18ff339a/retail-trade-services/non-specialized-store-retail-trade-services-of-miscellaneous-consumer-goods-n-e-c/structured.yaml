allocation_rules:
  - rule_id: denominator
    applies_to: "service_output"
    rule: "Prospectively fix one same-SKU same-configuration reporting pool and retain every idle/closed/failed/zero-sale interval. Q is the count of DISTINCT original pack IDs with final-valid acceptance at the disclosed closure, not cell count, transaction count, revenue or gross handover. A returned original resold after revocation has one eventual service, with all attempts in its original pool. Later revocation removes that original ID from Q even without physical return; pure price adjustment with acceptance valid does not. Replace the original numerator/fates/denominator version using actual event dates; do not count corrections in a new cohort. Entirely zero-Q pools remain unnormalizable with raw totals and are merged only by a prospectively stated same-configuration rule."
    source_ids: []
  - rule_id: shared
    applies_to: "store_sale; hygiene; residual; takeback"
    rule: "Prefer physical subdivision/meters. Split each actual source j into measured disjoint active/idle/fixed numerator pools R_j_k, sum_k equal the parent in one source unit. Use one fixed same-unit driver per pool across ALL beneficiaries: lighting/premises=reserved floor m2*h; security active/continuous/standby=protected floor m2*h; hygiene=actual cleaned m2; storage=occupied/reserved shelf m3*h; checkout active=actual processing seconds including failed/reversed attempts; checkout idle/fixed/startup=reserved checkout-position seconds, whose interval ownership is resolved by each beneficiary actual reserved display m3 divided by all-beneficiary reserved display m3. The resulting seconds alone are the driver, not seconds+m3. Gateway/ICT active power=actual attributable transmitted bytes; gateway fixed/idle power=reserved subscriber-position*h with ownership resolved by those same interval display-volume shares. Administration active source=actual task seconds including returns/failures; admin fixed/idle device source=reserved workstation-position*h with that same display-reservation ownership. Telecom, monitoring and payment/bookkeeping provider service numerators follow their own cp_support_services drivers and exclude already assigned on-site power/capital. Allocate each R_j_k*d_j_k_p/sum_all_b d_j_k_b once; retain closed/failure/zero-sale periods. Known positive full drivers required; no source disappears for zero/unknown driver. Program-isolated takeback pools use only the takeback alpha, not this second driver. Subtract a submeter only if its physical circuit is contained in its parent; different IDs do not establish disjointness."
    source_ids:
      - ghg-product-2011
  - rule_id: lifetime
    applies_to: "premises; shelving; manual_trolley; manual_pallet_jack; checkout; gateway_asset; security_asset; admin_asset; takeback_bin"
    rule: "Each asset card instance binds ONE actual asset a and one homogeneous model/BOM/full-package vector V_a_v in version v. For an open life use f_a_p_v=e_a_p_v/L_a_v; e is actual pool p exposure, L is evidenced expected TOTAL lifetime exposure over ALL actual beneficiaries in the exact same driver unit. At retirement use E_a=sum_all_p e_a_p and f_a_p_final=e_a_p/E_a for EVERY historical pool. E_a must be known positive; preserve zero-exposure periods and investigate unjustified unassigned exposures. Replace every prior allocation with f_new*V_new, recording DeltaV_a_p=f_a_p_new*V_a_new-f_a_p_old*V_a_old row by row only for matching exchange/property/unit and physical source boundary; do not add Delta as a fresh full manufacture. Revise all original pools and their Q versions. Cumulative fractions<=1 in every version and sum=1 at final closure. Different model/BOM/maintenance/full vectors cannot accumulate under one Item(s) card: create distinct actual model-specific cards/rows and source vectors before completeness. Premises driver=reserved usable m2*h; shelf=reserved usable storage m3*h; trolley/pallet jack=reserved rated payload kg*h; checkout/network/admin terminal=reserved device-position*h; security system=protected floor m2*h; bin=reserved admitted waste capacity kg*h. Idle/closed reservation stays with all actual reserved beneficiaries. Unknown lifetime, positive-total driver or full vector blocks completeness."
    source_ids:
      - ghg-product-2011
  - rule_id: single_normalization
    applies_to: "all inventory rows"
    rule: "Keep raw measured totals, attributed source numerators and final inventory distinct. Every final exchange is its attributed numerator/Q once. Restore any provider normalized module to its evidenced original raw denominator/pool/version, deduplicate exact source IDs against core and other modules, add only compatible same-flow/property/unit raw numerators and divide by the common Q once. Keep failed_pack and AC among core numerators. No kg+MJ sums, no raw+normalized sums, no manufacture fraction on top of a full-life package fraction and no waste-recycling substitution credit. Physical satellites external_pack/external_partial/external_spent are non-characterized custody records only; failed_pack is always an actual background-linked input."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_sale
      process_id: "store_sale"
      flow_role: "service_output; failed_pack"
      record_type: "Original pack event and background ledger"
      raw_fields: "pool_id; original_pack_id; SKU; actual GTIN; manufacturer; cell_model; cell_count4; paperboard_BOM; batch; receipt_event_id; event_date; gross_handover_id; acceptance_valid; revocation_date; physical_return_id; original_pool; S_s; F_s; O_s; T_s; original_pack_count_s; N_F; Q; supplier_vector_id; inbound_route; source_version; whole_mode_s; component_mode_original_ids; physical_overlap_matrix"
      collection_method: "At receiving inspect actual four-cell sealed pack and match supplier full BOM/vector, weigh actual received pack/cell/packaging samples on calibrated scale without catalogue defaults. Record each receipt/handover/return/revocation/refusal/loss separately at event time, original IDs and actual final recipient/state; reconcile stock and source vector through disclosed closure and subsequent return corrections. Aggregation calculation: Raw Q and N_F by source ID; final Q/Q and N_F/Q per reference flow, never count a revocation twice"
      unit: "Item(s); kg"
      frequency: "Every event and closing reconciliation"
      temporal_coverage: "Whole declared pool including closed/failure periods and later corrections"
      site_scope: "One SKU/store configuration; all original-pack sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier invoices/BOM/LCI boundary, calibrated sample records, dated acceptance/return logs and signed source-responsibility transfer"
    - protocol_id: cp_energy
      process_id: "store_sale"
      flow_role: "ac"
      record_type: "Meter topology and allocation ledger"
      raw_fields: "pool_id; meter_id; parent_id; submeter_id; included_in_parent; start_reading; end_reading; kWh; R_j_k; d_j_k_pool; d_j_k_b; beneficiary_id; active_idle_fixed; E_pool; geography; year; voltage; provider; mix; source_id; source_device_serial; source_active_idle_fixed; checkout_processing_seconds_p; checkout_position_seconds; reserved_display_m3_p; reserved_display_m3_b; transmitted_bytes_p; transmitted_bytes_b; subscriber_position_hours; administration_task_seconds; administration_reserved_position_hours; protected_floor_m2_h; physical_overlap_matrix; takeback_program_source_id; takeback_alpha_applied"
      collection_method: "Read calibrated meters each interval at point of use, identify parent/submeter boundaries and all sale/hygiene/takeback circuits. Partition same-unit source pools and record every beneficiary driver with floor/shelf geometry and duration or checkout seconds. Record idle/closed operation and bills; independent meters are disjoint, not subtracted. Follow shared exactly: checkout active seconds, idle/fixed/startup reserved position-seconds with interval display-volume ownership; ICT active bytes and idle subscriber-position*h; admin active task seconds and idle reserved position*h. Keep source components separate and reconcile parent circuits; physical overlap matrix, not differing IDs, establishes disjointness. Takeback program-isolated source uses alpha only. Aggregation calculation: E_pool = sum_j_k R_j_k*d_j_k_pool/sum_b d_j_k_b; 3.6*E_pool/Q per reference flow"
      unit: "kWh; MJ"
      frequency: "Interval metering and billing reconciliation"
      temporal_coverage: "Every interval in pool including closed and zero-sale"
      site_scope: "Full relevant store and shared-building circuits/all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, circuit map, bills, driver logs and source-provider boundary"
    - protocol_id: cp_paper
      process_id: "store_sale"
      flow_role: "receipt"
      record_type: "Paper stock and WIP source ledger"
      raw_fields: "pool_id; source_id; roll_id; supplier_spec; net_paper_kg; core_kg; separate_wrap_kg; opening_blank; receipts; closing_blank; printed_WIP_open; printed_WIP_close; WIP_original_electricity; customer_handover_kg; discard_kg; P_pool; paper_source_kg_l; paper_responsibility_l_pool; unused_return; blank_transfer_in; blank_transfer_out; source_version; original_delivery_vector; first_consumption_source_fraction; stock_responsibility_version; physical_overlap_matrix"
      collection_method: "Weigh actual direct-thermal paper on calibrated scale excluding measured cores and separate wrap/carton, retaining coating. Record printer withdrawals and customer/cancelled/duplicate receipts. Blank roll stock and already-printed WIP are separate. Carry original paper AND actual printing-electricity source IDs across periods and replace old pool allocations on later WIP use, never charge twice. Actual cores/wrap require their own named cards unless supplier provides verified return with continuing responsibility. Paper_source_kg_l is actual net original paper kg; paper_responsibility_l_pool is its evidenced pool fraction, cumulative across handover/discard/WIP recipients<=1. Opening blank+receipts+blank transfers in=closing blank+unused return+blank transfers out+actual printing withdrawals; printing withdrawals+opening printed WIP=customer handover+discard+closing printed WIP, each source preserved. Independently billed material/package delivery joins the original source vector before applying its actual first-consumption/stock fractions; preserve WIP/retained source versions and physical route overlaps even with different source IDs. Aggregation calculation: P_pool = attributed net paper consumption after exclusive WIP source transfer; P_pool/Q per reference flow; paper + electricity source responsibility conserved"
      unit: "kg"
      frequency: "Each roll/event and pool close"
      temporal_coverage: "Pool plus cross-period WIP history"
      site_scope: "Actual printer and every beneficiary checkout"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale calibration, roll/BOM invoices, printer logs, WIP versions and customer/discard reconciliation"
    - protocol_id: cp_hygiene
      process_id: "hygiene"
      flow_role: "water; cleaner; wipe; glove; absorbent; effluent; wet_wipe; used_glove; used_absorbent; cleaner_container; cleaner_bottle"
      record_type: "Cleaning and incident full-carrier/source ledger"
      raw_fields: "reconstruction_full_liquid_inputs; dissolved_solids; opening_liquid_stock; closing_liquid_stock; source_pool_carrier_exports; evaporation; mode_selector; pool_id; event_id; source_id; batch; supplier_formulation; SDS; bottle_full_BOM; whole_package_vector; source_duplicate_ids; package_count; bottle_count_s; formulation_consumed_s_pool; original_fill_kg_s; bottle_source_fraction_s_pool; B_pool; V_in_i; rho_in_i; V_out_i; rho_out_i; temperature; concentration; opening_formulation; formulation_added; formulation_to_effluent; formulation_to_wipe; formulation_to_glove; formulation_to_absorbent; formulation_container_dispatch; formulation_retained; unused_return; rinse_water; dirt; captured_electrolyte; dry_sheet_kg; glove_net_kg; dry_granule_kg; carrier_net_kg; W_pool; C_pool; D_pool; G_pool; A_pool; J_pool; H_pool; K_pool; U_pool; Z_pool; cleaned_m2; all_beneficiary_cleaned_m2; receiver; waste_stock; actual_leak; escape_destination; original_delivery_vector; first_consumption_source_fraction; stock_responsibility_version; physical_overlap_matrix"
      collection_method: "At each actual clean/incident weigh inputs and separately whole wet terminal carriers on calibrated scales; read actual inlet/discharge meters and measured batch-temperature densities. Identify real neutral nonionic formulation and whole bottle/closure/BOM; split supplier packaging source vector only with evidence. Direct liquid mode is V_out*rho_out without supply deductions. If discharge unmetered, exclusively use a full-liquid kg balance with measured all imported liquids, dissolved solids, whole liquid opening/closing stocks, captured exports, evaporation and storage; no water-only volume reconstruction. Record measured source-origin formulation destinations separately from carrier kg and independently added rinse water/dirt. Observe actual leakage/capture and final fate; no unmeasured elementary flux. Independently billed material/package delivery joins the original source vector before applying its actual first-consumption/stock fractions; preserve WIP/retained source versions and physical route overlaps even with different source IDs. Aggregation calculation: Attribute raw same-unit totals by direct use or cleaned area; each named pool total/Q per reference flow. Opening formulation+added = mutually exclusive final effluent/wipe/glove/absorbent/container-dispatch/retained/unused-return source-origin kg; reused intermediate states replaced, never added twice. Whole carriers measured independently. Allocate each original bottle manufacturing vector by its measured formulation consumed/original fill fraction across all users/periods; cumulative<=1, final residual/revisions replace prior versions. Allocate the actual bottle terminal-carrier mass to those same source users once, with dispatch mass independent of source formulation residue; no second manufacturing fraction. Imported complete liquid already includes its dissolved solids; additional dissolved_solids in reconstruction means only independently added dry source matter not already counted."
      unit: "kg; m3; kg/m3; m2"
      frequency: "Every event and monthly/pool reconciliation"
      temporal_coverage: "All operation/idle incidents and retained/reused stocks across pools"
      site_scope: "Store hygiene and actual beneficiaries; leak/new/old stock identities separate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, density/temperature, SDS, full bottle BOM/LCI source dedup, cleaning/incident log, receiver records and source/whole-carrier balances"
    - protocol_id: cp_assets
      process_id: "support"
      flow_role: "premises; shelving; manual_trolley; manual_pallet_jack; checkout; gateway_asset; security_asset; admin_asset"
      record_type: "Persistent complete-asset exposure register"
      raw_fields: "asset_id; model; package_BOM; source_id; source_version; installation; maintenance_events; replacement_model; included_EOL; exclusions; e_a_pool; L_a; beneficiary_id; reserved_usable_m2; reserved_capacity_m3; operating_positions; reserved_hours; lifetime_exposure; cumulative_fraction; residual; previous_allocations; revised_allocations; retirement_date; asset_serial; homogeneous_vector_hash; e_a_pool_v; L_a_v; E_a; e_a_pool_final; f_a_pool_v; V_a_old; V_a_new; f_a_p_old; f_a_p_new; DeltaV_a_p; rated_payload_kg; device_positions; protected_floor_m2; independent_transport_vector; asset_transport_source_version; physical_overlap_matrix"
      collection_method: "Verify ONE actual serial/model/BOM/full vector per card instance; separate different model/BOM/vector rows. Shelf excludes every separately listed manual handling object. Measure the actual prescribed exposure by asset: premises usable m2*h; shelf usable m3*h; manual trolley/pallet jack rated payload kg*h; checkout/gateway/admin reserved device-position*h; security protected m2*h. Include all idle/closed reserved beneficiaries. Independently sourced delivery/maintenance/end transport is measured and first bound to this same asset source/version, then included in V_a_v. Open f=e/L; at actual retirement E=sum_all actual beneficiary exposure and f=e/E for all historical pools. Replace every prior pool vector with f_new*V_new and record Delta=f_new*V_new-f_old*V_old by matched physical exchange/property/unit; reconcile every original Q version, cumulative<=1 and final sum1. No full current-period charge for independent freight or model revision. Aggregation calculation: One actual asset/card uses f_a_pool_v/Q, with open e/L and retirement e/E; all historical f_new*V_new-f_old*V_old replacements, final sum1."
      unit: "Item(s); m2*h; m3*h; kg*h; device-position*h"
      frequency: "Every exposure interval, maintenance/revision and retirement"
      temporal_coverage: "Full lifetime and current pool, never restart ledger"
      site_scope: "Actual separately bounded premises, shelf, manual trolley, manual pallet jack, checkout, gateway, security or administration model; all lifetime beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed complete lifecycle model/BOM boundary, survey, capacity/hour logs, invoices, maintenance/EOL and versioned full allocation ledger"
    - protocol_id: cp_residual
      process_id: "residual"
      flow_role: "external_pack; new_cells; returned_partial; returned_spent; pack_board; transport_board; receipt_waste; external_partial; external_spent"
      record_type: "New-product custody and waste dispatch"
      raw_fields: "pool_id; original_pack_id; source_id; event_id; receipt_date; gross_handover; customer_return; supplier_return; internal_in; internal_out; condemnation; unexplained_loss; opening_goods; closing_goods; cell_count; pack_BOM; held_waste_open; held_waste_generated; held_waste_close; dispatch_id; net_kg; receiver; treatment; X_pool; C_cell; C_partial; C_spent; X_partial; X_spent; C_board; C_carton; C_receipt; captured_electrolyte; external_state; recipient; continuing_responsibility; inbound_packaging_source; receiver_transport_vector; empty_return_coverage; necessary_container_life_vector; physical_overlap_matrix"
      collection_method: "Record each physical event once separately from acceptance. Weigh actual waste consignments net of external transport container with calibrated scale, identify remaining cell contents and disjoint captured electrolyte, pack paperboard and carton; use actual receiver treatment/transport contract. Intact pack discarded as a whole requires a matching whole-pack waste card before completeness, or evidenced safe separation into actual measured cell/board carriers. Supplier returns need actual custody/recipient/transport and same original background transfer, not another input. Unknown material or mixed hazardous carrier needs its actual admitted named card. Receiver vectors explicitly cover actual dispatch transport/empty return, treatment and necessary container life. Match physical routes/stages/objects/time, even differing IDs; actual missing coverage needs a named measured additional card before completeness. Aggregation calculation: Attribute C_cell/C_partial/C_spent/C_board/C_carton/C_receipt and X_pool from actual events, divide each by Q per reference flow once; held-waste opening+generation=dispatch+closing independently validates direct dispatch"
      unit: "Item(s); kg"
      frequency: "Every custody event/dispatch and pool-close"
      temporal_coverage: "Original history and held waste until actual dispatch"
      site_scope: "Actual new-product/receipt waste and external recipients"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated net weigh tickets, new-cell state, transport/treatment manifests, source ownership, stock event partition and signed external receipt"
    - protocol_id: cp_takeback
      process_id: "takeback"
      flow_role: "old_received; old_dispatched; takeback_bin"
      record_type: "Old-battery takeback and bin lifetime ledger"
      raw_fields: "pool_id; consignment_id; program_id; mixture_chemistry; actual_state; collector_acceptance; opening_waste_kg; received_net_kg; dispatched_net_kg; closing_waste_kg; receiver; transport_treatment_contract; obligation_beneficiary; allocation_rule; T_in_pool; T_out_pool; bin_id; bin_full_BOM; liner_spec; bin_lifecycle_vector; source_id; e_bin_pool; L_bin; reserved_capacity_kg; reserved_hours; lifetime_exposure; previous_allocations; revised_allocations; residual; reserved_admitted_capacity_kg_p; reservation_hours_p; d_p; d_b; alpha_p; whole_received_kg; whole_dispatched_kg; program_operation_source_total; collector_contract_vector; actual_direct_beneficiary; E_a; e_a_pool_final; f_a_pool_v; V_a_old; V_a_new; f_a_p_old; f_a_p_new; DeltaV_a_p; homogeneous_vector_hash; bin_transport_vector; bin_source_version; physical_overlap_matrix; e_a_pool_v; L_a_v"
      collection_method: "Weigh actual old mixed battery receipts/dispatches separately using calibrated scale; inspect collector contract admitting actual mixture/state and signed responsibility for bundled operation. Reconcile opening+received=dispatch+closing without new-stock merging. Survey absence with complete program/event ledger if no takeback. Obtain full model-specific bin/liner manufacture-maintenance-EOL package, exclude collected contents and collection/treatment. Track all beneficiaries reserved kg*h and full lifetime revisions/residual as lifetime rule. Extra actual containers/treatment not in contract require additional named card. Apply the PCR-fixed takeback_boundary hierarchy: direct segregated event/source to its evidenced beneficiary, otherwise d_p=sum reserved admitted kg*reservation h and alpha=d_p/sum_all_b d_b across every retail/program/standalone beneficiary including idle/no-sale. Attribute program-isolated operation, actual whole-carrier receiving/dispatch and full collector transport/treatment numerator by alpha ONCE; raw stock stays whole. Do not apply handler-time/general shared driver again. Bin ONE actual model/full vector uses its own lifetime e/L or final e/E over all reserved kg*h directly, including independent bin delivery/maintenance/end freight; update every historical vector by f_new*V_new-f_old*V_old, no extra alpha and no current-Q freight charge. Aggregation calculation: Shared program physical/service numerators receive alpha once, then /Q; direct beneficiary mode exclusive; one model bin f/Q uses lifetime e/L or final e/E with every historical vector replacement and no alpha."
      unit: "kg; Item(s); kg*h"
      frequency: "Every receipt/dispatch, interval and lifetime revision"
      temporal_coverage: "All takeback and stock periods including zero-sale"
      site_scope: "Actual program/receiver and all bin/operation beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, collector mixture acceptance, treatment/transport manifest, signed obligation/allocation, bin BOM/model and lifetime ledger"
    - protocol_id: cp_return_transport
      process_id: "residual"
      flow_role: "supplier_return_transport"
      record_type: "Supplier-return freight segment record"
      raw_fields: "pool_id; trip_id; segment_id; distance_t_s; reserved_capacity_t_s_pool; reserved_capacity_t_s_b; capacity_unit; actual_stationary_idle_hours; actual_idle_fuel_in_contract; empty_leg; idle_reservation; beneficiary_id; provider_attribution_mode; provider_quantity; R_return; Q; full_contract_boundary; original_pack_id; source_id; duplicate_transport_ids; binding_payload_mass_evidence; binding_cube_loading_position_evidence; nonbinding_other_constraint_evidence; raw_mode_eligibility; provider_physical_allocation; physical_overlap_matrix"
      collection_method: "Read actual vehicle odometer/GPS and signed consignment/reservation logs on each supplier-return segment. Record capacity in one kg or m3 basis per segment, all beneficiaries, empty legs and stationary reservation duration. Verify contract covers actual diesel vehicle/fuel/upstream/maintenance and empty return; separate provider-attributed and raw-segment modes, remove exact duplicated original inbound/waste/takeback contract source IDs. Allocation of a trip with an unknown/zero full driver is unresolved. Fixed capacity unit is kg ONLY for proved mass-binding/cube-nonbinding, usable m3 ONLY for proved cube-binding/mass-nonbinding. Both/unknown constraints forbid raw mode; provider already-attributed actual consignment vector with verified physical allocation or incomplete. Record actual full-trip idle fuel and empty-route coverage. Different source IDs do not prove transport disjointness. Aggregation calculation: per reference flow"
      unit: "vehicle*km; kg; m3; h"
      frequency: "Every actual trip/segment and pool close"
      temporal_coverage: "All return segments including failed/empty/idle"
      site_scope: "Actual supplier-return freight and all consignment beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Odometer/GPS, contract and source-boundary checklist, capacity/reservation logs and receiver custody"
    - protocol_id: cp_components
      process_id: "store_sale"
      flow_role: "component_cell; component_board; component_assembly; component_inbound"
      record_type: "Verified original supplier component-vector ledger"
      raw_fields: "original_pack_id; original_source_s; whole_mode_s; supplier_component_vector_id; component_model; component_BOM; component_unit; n_s_cell; F_s_cell; S_s_cell; O_s_cell; T_s_cell; n_s_board; F_s_board; S_s_board; O_s_board; T_s_board; n_s_assembly; F_s_assembly; S_s_assembly; O_s_assembly; T_s_assembly; n_s_inbound; F_s_inbound; S_s_inbound; O_s_inbound; T_s_inbound; original_route; consignment; actual_empty_idle_coverage; reconstructed_original_vector; whole_original_vector; physical_overlap_matrix; Q"
      collection_method: "Read actual signed supplier component/assembly/inbound inventories with original quantities and units; verify one model-specific vector per actual card. For cell originals n_s_cell is actual four-cell source quantity; paperboard is one actual COMPLETE printed/coated/adhesive package, not pure body mass. Verify exact vector sum reconstructs full original pack and receiving-gate boundary without missing assembly or freight. Track component original S/F/O/T and actual recipient through every state; exclude same original whole-pack F through whole_mode_s=0. No mass ratio decomposes a whole environmental vector. Different actual vectors need distinct authored cards before completeness. Aggregation calculation: per reference flow"
      unit: "Item(s)"
      frequency: "Each original/source change and pool closure"
      temporal_coverage: "All originals in component mode and later corrections"
      site_scope: "Actual source original, all supplier vectors and their physical boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed supplier vectors/BOM/quantities, reconstruction with matched exchange/property/unit, original gate transport and source-state conservation"
    - protocol_id: cp_support_services
      process_id: "support"
      flow_role: "broadband; payment; monitoring; bookkeeping"
      record_type: "Actual ICT/payment/security/administration provider boundary ledger"
      raw_fields: "pool_id; interval_id; provider_id; contract; service_model; source_vector; physical_overlap_matrix; subscriber_hours; reserved_display_m3_p; reserved_display_m3_b; H_net_pool; payment_event_id; original_pack_id; payment_attempt_count; checkout_line_seconds_attempt_p; checkout_line_seconds_attempt_b; attempted_authorizations; N_pay_pool; protected_floor_m2_h_p; protected_floor_m2_h_b; monitoring_hours; H_security_pool; admin_case_id; processing_seconds_p; processing_seconds_b; common_fixed_hours; H_admin_pool; idle_closed_hours; presence_absence_evidence; all_beneficiaries; Q; reserved_display_m3_h_p; reserved_display_m3_h_b"
      collection_method: "Read actual topology, provider contracts/invoices, activity logs and full remote electricity/capital vector boundaries. Separate active event sources from fixed/idle sources physically and by period. Broadband actual subscriber hours use each interval reserved display m3 share across all beneficiaries, including idle/closed reservations. Payment uses actual attempted authorizations linked to original IDs, refused/reversed included; each shared basket attempt is attributed by actual measured checkout line-processing seconds for this pool divided by ALL basket beneficiaries line-processing seconds, known positive, once. Unavailable basket timing leaves allocation incomplete; do not count one whole attempt for every original pack. Monitoring hours use protected floor m2*h shares. Bookkeeping direct actual case seconds include returns/failures; common fixed provider hours use reserved display m3*h shares, never add seconds and m3*h. Full denominator known positive. Program-isolated takeback provider sources instead use takeback alpha once. Identify same device/circuit/route/function intersections even under different source IDs; remove overlaps only using verified original provider subvector, else incomplete. Signed absence requires full period topology/contract/activity evidence. Aggregation calculation: per reference flow"
      unit: "h; Item(s)"
      frequency: "Every event/interval and billing reconciliation"
      temporal_coverage: "Full pool including idle/closed/failed/zero-sale"
      site_scope: "All actual provider services and all benefiting cohorts/functions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Contracts/invoices, event/time logs, physical scope and actual capital/power overlap matrix, source subvector evidence and absence survey"
  calculation_rules:
