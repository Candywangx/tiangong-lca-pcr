validation_rules:
  - rule_id: identity_gate
    applies_to: "all inventory rows"
    rule: "Before a complete dataset bind each unverified row to an actual Tiangong flow and matching property/unit, type, state and provider/treatment boundary. Preserve historical identity observation limits. Confirm AC supplier geography/year/voltage/mix separately; its generic UUID does not supply a grid model. Exact product specification, paperboard full BOM and pack-count service remain mandatory even with a generic flow UUID."
    source_ids: []
  - rule_id: closure_gate
    applies_to: "all processes"
    rule: "Reconcile goods-only count, new-cell count, source ownership, all waste stocks/dispatch, receipt paper, cleaning formulation-origin mass and all-beneficiary meter allocation. Counts, kg and service Q never substitute each other. Unknown is not zero; missing absence evidence, unresolved leak, provider gap, unsupported asset exposure or denominator<=0 prevents complete normalized data. Record actual uncertainty and calibration; no invented numerical acceptance limits."
    source_ids: []
  - rule_id: additional_gate
    applies_to: "all processes"
    rule: "Every actual additional material, energy, package, repair, transport or emission must have one named state-specific atomic card, executable raw protocol and calculation, responsibility and aligned Chinese before claiming completeness. Presence/absence survey covers all conditional cards including no-sale periods and third-party takeback. Candidate methodology is not scientific approval, legal compliance, a whole-product footprint or complete GHG-standard conformity."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Incremental service for specified actual pack/route plus explicit downstream S merchandise production/inbound; compatible same-boundary comparisons"
  excluded_use: "Whole product footprint, battery electricity supply, entire62159 or regulatory conformity without additional evidence"
  required_metadata: "SKU and actual GTIN; cell model and chemistry LR6 alkaline; exactly four unused cells; original paperboard packaging full BOM; lot/date and actual mass records; actual mixed assortment evidence; walk-in ambient electric-only route survey; receiving gate and original supplier vector; pool/closure and return horizon; Q and all-beneficiary drivers; S/F/O/T source ownership; old-battery program and disjoint carrier states; provider/treatment/source versions"
  required_quality_disclosure: "Unbound rows, original source vectors, full asset/takeback model boundaries, uncertainty and Q/late-correction versions"
  update_trigger: "SKU/BOM/route/provider/asset lifetime/takeback/acceptance or source-boundary change"
