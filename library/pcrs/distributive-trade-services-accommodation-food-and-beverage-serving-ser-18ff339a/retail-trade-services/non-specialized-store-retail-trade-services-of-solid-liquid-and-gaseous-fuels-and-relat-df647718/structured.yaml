  data_quality_requirements:
    - id: q_route
      applies_to: "retail"
      requirement: "Verify b_route and b_facility before applicability; original lot/closure/BOM and actual Q evidence cannot be inferred from a generic stock page or no-smoke claim."
      evidence: "Signed site/route audit and actual source/transaction evidence"
    - id: q_moisture
      applies_to: "failure; residual"
      requirement: "Enforce c_moisture method/state eligibility, sealed source chain, qualified SOP, water-specific recovery and replicate/heterogeneity uncertainty; retain failed results and no unsupported temperature/time/limit defaults."
      evidence: "Original laboratory protocol/raw weights, blanks/recovery and uncertainty/resampling records"
    - id: q_sources
      applies_to: "failure; custody; residual"
      requirement: "Coal dry-matter source conservation, complete-bag binary ownership, goods-count and whole wet-carrier ledgers reconcile separately; known missing and signed residual remain distinct. Unknown receiver/source/vector/subdivision blocks completion, not zero or a mass split."
      evidence: "Original source/version and mutually exclusive current/final-state reconciliation"
    - id: q_air
      applies_to: "air"
      requirement: "Air paths/particle coverage, source discrimination and matched humidity background must be complete with uncertainty and actual storage/capture/liquid paths. Unknown negative or unmeasured conditions are inconclusive, never emissions zero or credit."
      evidence: "Calibrated raw control-volume data, source/blank modes and independent carrier/source closure"
    - id: q_completion
      applies_to: "retail; failure; custody; residual; air"
      requirement: "Every actual conditional process is present, evidenced absent or unresolved with reason/owner/coverage. Full status requires real identities, support atomic cards/protocols, full treatment/transport scopes and c_merge source deduplication. No default factor/range/unknown zero is adopted."
