    reference: "Blaschak Anthracite, Residential Uses, https://www.blaschakanthracite.com/residential-uses/ ; web snapshot2026-10-30"
    used_for: "Actual pre-washed/sized anthracite original40lb handled bag identity only; marketing no-smoke/emissions is not zero emission, measured LCI or safety proof."
  - id: "coles"
    type: "handbook"
    reference: "Cole’s Hardware, 40 LB RICE COAL, SKU7788700/MPN RICE, https://www.coleshardware.com/40-lb-rice-coal-7788700 ; web snapshot2026-10-30"
    used_for: "Specific Rice listing/mixed assortment lead; online-pickup and stock banners do not establish actual qualifying site inventory/transaction."
  - id: "astm-moisture"
    type: "standard"
    reference: "ASTM D3302/D3302M-22a, Standard Test Method for Total Moisture in Coal, DOI10.1520/D3302_D3302M-22A, https://store.astm.org/d3302_d3302m-22a.html ; public catalog Scope1.1–1.4 and Significance5.1–5.2 inspected2026-10-30"
    used_for: "Coarse-coal method eligibility and referee-method selection; full licensed procedure not acquired/verified here. It excludes slurry/sludge and pulverized products below0.5mm; fine-state water-specific assay is a separately declared PCR protocol, not claimed as ASTM compliance."
  - id: "ghg2011"
    type: "standard"
    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard2011, chapter9 PDFpage65/printed63, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General subdivision/physical-allocation consistency only. Detailed coal/bag source ownership, drivers, support scope, air-water protocols and equations are declared PCR design; no whole-standard conformity claim."
