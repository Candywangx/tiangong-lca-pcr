published_dataset_profile:
  dataset_role: "Candidate methodology for an incremental foreground retail service; no completed dataset is supplied."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only matched physical site/lot/configuration service after all applicable supported completion rules and actual flow/provider binding."
  excluded_use: "Whole CPC leaf, merchandise manufacture, heat/combustion, online pickup, wholesale or full-business claims from this partial core."
  required_metadata: "All reference qualifiers, actual source/owner/pool/version, original denominators, route and completeness register."
  required_quality_disclosure: "Historic UUID observation, unbound rows, moisture/SOP and source-vector verification, measured coverage/calibration/uncertainty, stock residuals and pending scientific/translation release review."
  update_trigger: "Actual source/lot/BOM/route change, late acceptance/fate, moisture/dust assay or uncertainty change, asset lifetime/provider scope or identity correction."
