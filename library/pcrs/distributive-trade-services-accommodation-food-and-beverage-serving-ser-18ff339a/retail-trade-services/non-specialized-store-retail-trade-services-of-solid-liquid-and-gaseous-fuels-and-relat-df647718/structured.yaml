      rule: "Use all actual exterior paths of an isolated known original-pool coal control volume over timestamped intervals. Record original source/pool membership; indistinguishable mixed-pool ownership is unresolved until actual physical subdivision, never a guessed allocation. Calibrated aerosol/filter sampling must preserve actual size coverage and matching air volume V_t in m3 at the same T/P/wet-dry basis.  Filter conditioning alone does not establish dry particulate mass. Under the c_moisture water-specific matrix-validated branch, record loaded-filter and matched blank-filter initial/final as-is kg and independent whole-filter-equivalent water kg with their actual paired/split sample evidence. Define M_raw=conditioned_filter_final_kg-filter_initial_kg and matched_filter_blank_kg=blank_filter_final_kg-blank_filter_initial_kg as measured as-is mass increments, not dry mass. M_net_as_is=M_raw-matched_filter_blank_kg; delta_W_loaded=loaded_filter_final_water_kg-loaded_filter_initial_water_kg; delta_W_blank=blank_filter_final_water_kg-blank_filter_initial_water_kg; W_net=delta_W_loaded-delta_W_blank; M_corr=M_net_as_is-W_net in dry-particulate kg. This equals the loaded dry-mass increment minus the matched blank dry-mass increment. Because the net as-is mass already subtracts the blank increment, subtract only the net water difference W_net, never loaded water alone or the blank-water amount a second time. Match every mass and water observation to the same represented filter/deposit/time scope; initial-water paired references and final aliquots need the c_moisture matrix/recovery/representativeness/scaling evidence, not assumed zero water or total loss-on-drying. Unexplained negative or uncertain water corrections remain unresolved; no zero-clamping. ICP elemental y_e and every coal/noncoal reference A_ej must be expressed as kg element/kg actual dry particulate/reference using this independently established water-free denominator, with explicit original assay u