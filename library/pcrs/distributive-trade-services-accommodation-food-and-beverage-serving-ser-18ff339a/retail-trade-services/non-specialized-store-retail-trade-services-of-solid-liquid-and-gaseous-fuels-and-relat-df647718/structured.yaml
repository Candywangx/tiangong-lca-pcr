      rule: "For each actual formulation/receipt/label/overwrap source s retain original net m0_s in its actual source unit excluding separate cores/containers. Persistent conservation is original receipt=cumulative final exports+current exclusive unused/opened/WIP/solution/film/tool/held-waste source-origin states+known missing+signed residual; replace state transitions and exclude added rinse water/dirt from source kg. Fix each shared first-use event before attribution: q_first_event_s is its measured actual withdrawal from that original source, linked to first_use_event_ID/source_portion_ID. For a cleaning pass, d_clean_h=actual_cleaned_m2_h+exclusive_failed_reserved_cleaned_m2_h, disjoint measured footprints of that same unique pass across all beneficiaries including zero-sale/failed reserved zones; a failed reservation is eligible only for area actually cleaned in that pass, never an additional overlapping footprint. G_first_sh=q_first_event_s*d_clean_h/sum_all_cleaned_driver_m2 for positive known total. For receipt/label paper use actual printed_line_rectangle_m2_h, meaning the physical paper rectangle assigned to that source line/attempt including failed blank lines, not inked pixels. The actual job/layout area is a mutually exclusive complete partition: line rectangles, exclusive blank/cut and shared blank/cut are disjoint; blank/cut contains only measured remainder OUTSIDE all line rectangles. A failed blank line already inside a line rectangle is never added again as blank/cut. Sum of all line rectangles plus exclusive blank/cut plus shared blank/cut must equal actual_job_used_paper_m2 for that same original-source job, with measured web width/advance and layout/partition-membership version; disagreement beyond documented area uncertainty blocks completeness, never forced renormalization. Assign exclusive blank/cut area directly; allocate actual shared_blank_cut_m2 by those line rectangles: d_paper_h=printed_line_rectangle_m2_h+exclusive_blank_cut_m2_h+shared_blank_cut_m2*printed_line_rectangle_m2_h/sum_all_line_rectangle_m2. Then G_first_sh=q_first_event_s*d_paper_h/sum_all_paper_driver_m2. Freeze actual job/layout/line ownership, include all attempts and blank/cut members, and require positive known denominators; do not charge a whole shared roll to each line or renormalize known members. A source material directly measured for one identified owner is the single-beneficiary case of its actual event, not permission to invent a shared driver. Disjoint pre-use loss q_pre_loss_s uses actual same-source-unit reserved_quantity_s_h recorded before the loss across ALL beneficiaries: G_pre_sh=q_pre_loss_s*reserved_quantity_s_h/sum_all_reserved_quantity_s; absence/unknown reservation ownership blocks completion, never future sales/equal shares. G_sh=sum first-use event allocations+sum disjoint pre-use loss allocations across the original source history; each source_portion_ID first-use withdrawal is counted once, reuse/rinsing/reapplication is not another manufacture demand. Raw manufacture and independent inbound vectors are (G_sh/m0_s)*V_mfg_s and (G_sh/m0_s)*V_in_s; every original owner/pool/version revision replaces old historical numerators. Net paper excludes actual cores/wrappers; printed WIP retains its original paper AND printing-energy source ownership. Shared print/laboratory provider or run quantities X_event in their actual original unit use N_event_h=X_event*actual_resource_processing_seconds_h/sum_all_resource_processing_seconds. Processing seconds are measured resource occupancy/processing intervals of each actual source line or laboratory sample on the SAME homogeneous resource/stage, including failed attempts and its real reserved processing time; include every event member/slot. Laboratory sample_ID retains its actual original coal source/pool; later reuse of its result does not buy another assay. Freeze event membership/resource/stage/timing/version and original denominator. Heterogeneous resources/stages must have disjoint measured source quantities before this equation; unknown membership, undecomposed source scope or positive-source zero/unknown denominator is incomplete, not an alternative count/menu. Each complete single-use container is separately counted at first opening or disjoint pre-opening loss. For a shared first opening n_open, allocate complete-container count n_open*d_event_h/sum_all_event_driver using that same identified opening event driver with a fixed event-type mapping: cleaning uses d_clean_h, receipt/label paper uses d_paper_h, printing/laboratory uses actual_resource_processing_seconds_h. Preserve opening_event_type and the matching same-unit denominator; no discretionary driver choice or mixed-unit sum. Do not use G_sh/m0_s or formulation kg to split container manufacture. Pre-opening lost complete containers use actual reserved_container_count_h/sum_all_reserved_container_count. Keep unique container_ID/open_or_loss_event, full BOM, original owner and source history, sum allocated counts equals actual count; manufacture and independent inbound follow that same count once. Actual reusable containers and cloth/mops use c_assets matching exposure/life; no additional whole-item demand beside exposure. Actual wash water/chemical/treatment remain separate sources. Whole liquid dispatch is direct weighed gross-tare or actual discharged m3*same-state measured density, mutually exclusive; never deduct reuse/retention again. Defined whole mixed carriers require signed actual constituent/state receiver acceptance and complete treatment; contained coal source QA is not another whole waste output. Actual lab/sample materials and disposal retain original ownership and disjoint provider scope."
