        - un621
        - coles
    - rule_id: b_sources
      applies_to: "failure; residual; air"
      rule: "Coal and complete original bag need separate supplier vectors under c_origin. Coal vector includes extraction/preparation/washing/sizing and actual filling activity to supplier dispatch, excludes separately inventoried bag manufacture. Bag vector covers complete actual body/handle/closure/liner/printing/label/adhesive, excludes coal. Verified supplier stage subdivision is required, never a mass split of a whole environmental vector or an assumed polymer/tare. Successful S backgrounds belong only to a separately declared GOODS system; F inputs below remain characterized. Actual inbound transport including F is separately mandatory under c_transport; bundled stages require verified separation before completion."
      source_ids:
        - ghg2011
    - rule_id: b_incidents
      applies_to: "retail; residual; air"
      rule: "Unopened is not leakproof or moisture-invariant. Inspect receipt, every move/pickup and incident for rupture, wetness, air/drain paths, loose coal, dust and sampling. Quarantine damaged/unknown states and exclude them from intact accepted Q. Execute c_mass/c_moisture/c_dust/c_water for actual states/paths, including coal versus bag fate separation. Floor/tray/filter transfer is internal stock, not outside-air emission. Any real unlisted liquid, recovered Product or emission must obtain its specific state/medium card and protocol before full status, using the fixed original-source, direct-carrier and single-normalization methods, never assumed zero."
      source_ids: []
    - rule_id: b_facility
      applies_to: "retail"
      rule: "Require signed full-period absence of merchandise combustion, on-site fossil-fuel plant/handling, refrigerants and HVAC/purchased heating/cooling in all included leased/shared/landlord zones and temporary/backup equipment. Inventory equipment/owner/served zone/intervals/contracts. Unknown or real presence blocks this narrow route until a reviewed species/state/medium extension; external fuel vehicles remain outside its facility gate and are counted as transport. Coal merchandise is not an on-site combustion input."
      source_ids: []
    - rule_id: b_support
      applies_to: "retail"
      rule: "Full service must complete actual transport/handling, receipt/pallet/overwrap materials, building/storage/shelves/scales/trolleys/checkout/lighting/ventilation/ICT/dust-control capital, repair/EOL, network/payment/admin/security and facility cleaning/laboratory sampling. Use c_transport/c_assets/c_digital/c_material/c_merge; inventory each homogeneous actual object/provider with its own atomic cards/protocols and signed present/absent/unknown register. These concrete required methods are not a fictitious combined service flow. Unknown actual constituents/providers/amounts block completeness."
      source_ids:
        - ghg2011
