      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_electricity | electricity | Subdivide disjoint measured active, reserved-idle device and fixed-facility raw kWh sources, reconciling sum to the parent. Active scale/checkout/handling/ventilation tasks use measured device processing seconds; reserved powered devices/lamps/fans use reserved device seconds; fixed facility uses served reserved area*time. Each source N_h=E_source*d_h/sum_all_driver with one same-unit driver and all actual beneficiaries including failed/closed/empty reservations. Sum compatible attributed kWh only. Subtract a submeter only when the parent contains it. Positive source with zero/unknown driver is incomplete, not reassigned to future sales. | ghg2011 |\n| a_once | retail; failure; custody; residual; air | No displacement/recycling credit or negative-emission benefit is assigned. supplier_return/external_retained/internal_transfer are physical QA, not new goods demands. original_coal/original_bag are characterized F inputs and must not be excluded as custody satellites. Actual waste treatment remains included. Use c_origin/c_transport/c_assets/c_digital/c_material/c_merge with full original source ownership; different provider IDs alone do not prove nonoverlap. | ghg2011 |\n\n"
