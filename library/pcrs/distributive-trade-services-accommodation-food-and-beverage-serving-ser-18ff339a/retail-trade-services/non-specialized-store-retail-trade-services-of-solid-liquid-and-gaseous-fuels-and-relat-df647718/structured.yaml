    - id: c_merge
      applies_to: "service_output; original_coal; original_bag"
      rule: "Core raw numerators are3.6*E_h MJ, B_F_wet kg, N_F_bag Item(s), Q service Item(s), actual custody counts, W_coal/W_full/W_empty kg and D_air/J_water_out/J_water_in kg. Keep external raw module N_jr directly or restore normalized z_jr to N_jr=z_jr*D_j using its exact original denominator/pool/version; apply only missing original-owner shares. Reconcile event/object/time/stage overlap. For each identical exchange/property/unit/state/medium and compatible lifecycle boundary r, N_total_r=N_core_r+sum_j N_jr, amount_r=N_total_r/Q once. Do not add heterogeneous units or raw and normalized amounts. Exclude S goods production/inbound; a separately declared GOODS system may add actual S coal/bag original vectors once, never nominal1bag or40lb by default. Custody outputs are physical QA only; actual F inputs and actual waste treatment remain characterized. Full status requires all real support/carrier/identity/provider bindings and source/stock/air-water reconciliations, not only schema/fingerprint."
