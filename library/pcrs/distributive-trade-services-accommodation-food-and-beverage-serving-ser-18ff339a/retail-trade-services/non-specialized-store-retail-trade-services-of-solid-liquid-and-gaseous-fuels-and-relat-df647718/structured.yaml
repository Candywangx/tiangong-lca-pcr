  calculation_rules:
    - id: c_q
      applies_to: "service_output"
      rule: "Q=count distinct original_bag_ID with latest final_valid_acceptance=true in the prospective site/lot/configuration pool. Count each once after returns/resale; a revocation already absent is not subtracted again. Financial adjustment alone does not revoke acceptance. Preserve failed/zero-sale original pools and actual event dates. Q=0 is unnormalizable, never erased."
      inputs:
        - original_bag_ID
        - pool_ID
        - event_ID
        - event_date
        - final_valid_acceptance
        - acceptance_version
        - cutoff
        - Q
      output: "Final-valid service count"
      source_ids: []
    - id: c_custody
      applies_to: "supplier_return; external_retained; internal_transfer"
      rule: "N_supplier counts actual gross signed supplier handovers, N_internal actual gross signed internal handovers. N_external counts distinct original bags currently held externally without final valid acceptance at cutoff, linked to an earlier gross handover, not another movement. Record final recipient/state and continuing coal/bag background owner. Damaged/opened states are not covered by intact cards and require their specific actual state card before completion."
      inputs:
        - original_bag_ID
        - event_ID
        - recipient
        - state
        - final_valid_acceptance
        - original_owner
        - original_pool
        - N_supplier
        - N_internal
        - N_external
        - cutoff
      output: "Raw numerator"
      source_ids: []
    - id: c_mass
      applies_to: "service_output; collected_coal; complete_bag_waste; empty_bag_waste"
      rule: "Goods-only bag count: predicted_close_n=open_n+new_receipts_n+customer_returns_n+supplier_returns_n+transfer_in_n-gross_customer_handover_n-gross_supplier_handover_n-transfer_out_n-condemned_n-confirmed_missing_n; signed_residual_n=observed_close_n-predicted_close_n, positive unexplained excess and negative shortage. Gross customer handovers include accepted and never-accepted exits; revocation/external retention never subtract again. Condemnation is goods-to-held-waste, not dispatch. Independent physical waste-carrier kg: predicted_close_w=open_w+generated_w+returned_waste_kg+documented_state_mass_change_w-dispatched_w-confirmed_missing_w; signed_residual_w=observed_close_w-predicted_close_w. Every returned load retains original_carrier_ID, original_portion_ID, original_dispatch_ID, dispatch_attempt_ID and return_event_ID; weigh actual return gross-tare at its real state/time, record retained/changed portions and prior receipt, never create new condemnation or manufacture. documented_state_mass_change_w is separately measured same-carrier moisture/state mass change, not an assumed correction or an air emission. Whole/fines/empty carriers have disjoint state ledgers; transferred changed state replaces the original state. All physical outbound/return attempts enter this stock QA, not the treatment numerator automatically. For carrier kind x, W_x=sum distinct final_original_portion_ID net_whole_load_kg only with actual final same-state dispatch, named full_scope_provider_ID, complete matching treatment_scope and verified full_treatment_completed evidence. Deduplicate its original portion across every rejected/returned/retried attempt; direct net kg is never reduced by return/retained stock or multiplied by coal composition again. Mere acceptance or a refused/returned unprocessed load is not full treatment; keep pending/unknown kg explicitly and block complete status. Actual failed transport and partial processing activity are retained as separate actual event/source/stage quantities under c_merge, never set zero or relabelled a whole-treatment provider. If partial processing changes the carrier/state or removes constituents, record actual stage activity and remainder/new carrier with specific state cards/providers; no unchanged whole-bag card or full original treatment quantity may cover it."
      inputs:
        - open_n
        - new_receipts_n
        - customer_returns_n
        - supplier_returns_n
        - transfer_in_n
        - gross_customer_handover_n
        - gross_supplier_handover_n
        - transfer_out_n
