      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Original coal and complete original bag supplier-dispatch sources, then actual store receiving and accepted physical retail service. |\n| starting_condition_role | foreground_boundary |\n| product_classification_scope | Only this evidenced anthracite subset of the accepted classification; no whole-leaf equivalence. |\n| recursive_input_rule | Exclude successful S goods production/inbound from incremental retail; retain separate characterized original F coal/bag inputs. Only named custody outputs are uncharacterized physical QA. Never recurse the same retail service into itself. |\n| upstream_dataset_requirement | Actual supplier coal/filling and complete-bag manufacture vectors with verified boundaries, property/unit and original source quantities; full inbound/support/treatment modules with c_merge denominator and scope evidence. Unbound sources remain incomplete. |\n| disclosure | Original lot/specification, site/period/route, Q, S/F/T/O by original coal and bag, all conditioning/incident/moisture/dust paths, partial scope, uncertainties and unresolved identities. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | retail | Verify a named actual physical store with wide mixed assortment, self-selection from display and cashier payment followed by handover, using dated layout/photos, signed site audit, stock and transaction receipt. Online/mail orders, including online pickup at the same counter, wholesale and delivery are outside this route. Web stock and BuyOnlinePickupInStore banners are not field proof. Original bag state and acceptance terms must be evidenced before observing the pool. | un621; coles |\n| b_sources | failure; residual; air | Coal and complete original bag need separate supplier vectors under c_origin. Coal vector includes extraction/preparation/washing/sizing and actual filling activity to supplier dispatch, excludes separately inventoried bag manufacture. Bag vector covers complete actual body/handle/closure/liner/printing/label/adhesive, excludes coal. Verified supplier stage subdivision is required, never a mass split of a whole environmental vector or an assumed polymer/tare. Successful S backgrounds belong only to a separately declared GOODS system; F inputs below remain characterized. Actual inbound transport including F is separately mandatory under c_transport; bundled stages require verified separation before completion. | ghg2011 |\n| b_incidents | retail; residual; air | Unopened is not leakproof or moisture-invariant. Inspect receipt, every move/pickup and incident for rupture, wetness, air/drain paths, loose coal, dust and sampling. Quarantine damaged/unknown states and exclude them from intact accepted Q. Execute c_mass/c_moisture/c_dust/c_water for actual states/paths, including coal versus bag fate separation. Floor/tray/filter transfer is internal stock, not outside-air emission. Any real unlisted liquid, recovered Product or emission must obtain its specific state/medium card and protocol before full status, using the fixed original-source, direct-carrier and single-normalization methods, never assumed zero. |  |\n| b_facility | retail | Require signed full-period absence of merchandise combustion, on-site fossil-fuel plant/handling, refrigerants and HVAC/purchased heating/cooling in all included leased/shared/landlord zones and temporary/backup equipment. Inventory equipment/owner/served zone/intervals/contracts. Unknown or real presence blocks this narrow route until a reviewed species/state/medium extension; external fuel vehicles remain outside its facility gate and are counted as transport. Coal merchandise is not an on-site combustion input. |  |\n| b_support | retail | Full service must complete actual transport/handling, receipt/pallet/overwrap materials, building/storage/shelves/scales/trolleys/checkout/lighting/ventilation/ICT/dust-control capital, repair/EOL, network/payment/admin/security and facility cleaning/laboratory sampling. Use c_transport/c_assets/c_digital/c_material/c_merge; inventory each homogeneous actual object/provider with its own atomic cards/protocols and signed present/absent/unknown register. These concrete required methods are not a fictitious combined service flow. Unknown actual constituents/providers/amounts block completeness. | ghg2011 |\n\n"
