system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "retail"
      rule: "Verify a named actual physical store with wide mixed assortment, self-selection from display and cashier payment followed by handover, using dated layout/photos, signed site audit, stock and transaction receipt. Online/mail orders, including online pickup at the same counter, wholesale and delivery are outside this route. Web stock and BuyOnlinePickupInStore banners are not field proof. Original bag state and acceptance terms must be evidenced before observing the pool."
