allocation_rules:
  - rule_id: a_electricity
    applies_to: "electricity"
    rule: "Subdivide disjoint measured active, reserved-idle device and fixed-facility raw kWh sources, reconciling sum to the parent. Active scale/checkout/handling/ventilation tasks use measured device processing seconds; reserved powered devices/lamps/fans use reserved device seconds; fixed facility uses served reserved area*time. Each source N_h=E_source*d_h/sum_all_driver with one same-unit driver and all actual beneficiaries including failed/closed/empty reservations. Sum compatible attributed kWh only. Subtract a submeter only when the parent contains it. Positive source with zero/unknown driver is incomplete, not reassigned to future sales."
    source_ids:
      - ghg2011
  - rule_id: a_once
    applies_to: "retail; failure; custody; residual; air"
    rule: "No displacement/recycling credit or negative-emission benefit is assigned. supplier_return/external_retained/internal_transfer are physical QA, not new goods demands. original_coal/original_bag are characterized F inputs and must not be excluded as custody satellites. Actual waste treatment remains included. Use c_origin/c_transport/c_assets/c_digital/c_material/c_merge with full original source ownership; different provider IDs alone do not prove nonoverlap."
    source_ids:
      - ghg2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "service_output"
      record_type: "Original-bag acceptance and count ledger"
      raw_fields: "original_bag_ID; pool_ID; event_ID; event_date; final_valid_acceptance; acceptance_version; cutoff; Q; open_n; new_receipts_n; customer_returns_n; supplier_returns_n; transfer_in_n; gross_customer_handover_n; gross_supplier_handover_n; transfer_out_n; condemned_n; confirmed_missing_n; observed_close_n; predicted_close_n; signed_residual_n; open_w; generated_w; returned_waste_kg; documented_state_mass_change_w; dispatched_w; confirmed_missing_w; observed_close_w; predicted_close_w; signed_residual_w; original_carrier_ID; original_portion_ID; original_dispatch_ID; current_carrier_ID; parent_carrier_ID; dispatch_attempt_ID; return_event_ID; return_gross_kg; return_tare_kg; return_state; return_time; original_receipt; state_transition_ID; final_original_portion_ID; net_whole_load_kg; full_scope_provider_ID; treatment_scope; full_treatment_completed; pending_treatment_kg; unknown_treatment_kg; partial_processing_event_ID; actual_partial_activity; failed_transport_source_ID; gross; tare; W_coal; W_full; W_empty; ledger_ID; record_ID; source_ID; original_denominator; source_version; condition_status; absence_evidence; measurement_calibration; responsible_person"
      collection_method: "Store receiver/cashier scans persistent original bag IDs and actual lot/closure; records each physical move and signed final acceptance/revocation at its real time. At cutoff and every late notice separately reconcile goods counts and Q; retain actual physical store selection/payment evidence, not online order status. Calibrated counts/scales and independent stocktake control the ledger. Aggregation method: Execute c_q; c_mass; retain raw source/attribution then divide final Q once."
      unit: "Item(s); kg QA"
      frequency: "Every receipt/move/attempt/return; daily and cutoff reconciliation; late corrections"
      temporal_coverage: "Entire prospective original site/lot/configuration pool including failed/zero-sale histories"
      site_scope: "Actual mixed store receipt, display, cashier and handover gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed receipts/site audit, original packing/lot images and stocktake discrepancy investigation"
    - protocol_id: cp_origin
      process_id: "failure"
