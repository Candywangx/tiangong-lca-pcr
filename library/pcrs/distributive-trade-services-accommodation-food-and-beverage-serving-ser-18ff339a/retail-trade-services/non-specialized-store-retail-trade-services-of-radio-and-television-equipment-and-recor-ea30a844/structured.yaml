        - discharge_volume
        - density
        - cleaner_retained_kg
        - carrier_provider_exclusions
        - raw_source_id
        - provider_boundary
        - Q_pool_version
        - original_source_final_partition
        - reclassification_event_id
        - previous_source_destination
        - replacement_source_destination
        - container_complete_BOM
        - container_retained_liquid_kg
        - container_net_dispatch_kg
        - e_area
        - L_area_v
        - all_beneficiary_cleaned_area
        - cloth_lifetime_version
        - every_prior_cloth_version
        - cloth_remaining_life_evidence
        - actual_cloth_laundry_event
        - cloth_laundry_provider_boundary
        - cloth_repair_event
        - cloth_terminal_carrier
        - final_actual_area
      output: "Disjoint attributable original cleaning exchanges and whole carriers before c_merge"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: q_identity
      applies_to: "all"
      requirement: "Unbound service/product/waste flows remain candidate only. Before dataset completeness bind each actual model/material/state to official direct-read UUID/name/type/property/unit and qualifiers, retain original response/integrity receipts and public-state observation; a count property is not a retail-service identity. AC UUID only identifies point-of-use electricity, not supplier geography, mix, voltage or environmental performance."
      evidence: "Row-specific original identity receipts and supplier/state coverage matrix"
    - id: q_quantity
      applies_to: "all"
      requirement: "Record what/where/when, actual raw totals, calibration, exact source IDs, one attribution and final Q; retain uncertainty and nonzero stock discrepancies for investigation. Nominal manufacturer product, nett, gross and tare weights are distinct specification coordinates, not measured receiving/cell/carrier weights; never substitute one for another or use audio RMS power as electrical input."
      evidence: "Scale/meter logs, full BOM, event balance and signed uncertainty investigation"
    - id: q_presence
      applies_to: "cp_completion; demo"
      requirement: "Each conditional activity has dated present/absent evidence. Unknown demo, cell chemistry, leakage, replacement, extra carrier or provider coverage blocks completeness. Inspect actual maintenance, spillage and customer return state; add specific atomic cards, protocols, calculations and aligned Chinese before use. Never use a selector exchange or generic expansion promise as completed inventory."
      evidence: "Dated walkthrough, cell/model photographs, carrier and provider audit"
    - id: q_coverage
      applies_to: "cp_completion"
      requirement: "Partial core dataset must carry missing-module status. Full retail-service result requires c_modules and c_merge completed with all original evidence, compatible Q versions and supplier S/F/T/O closure. No assumption of full GHG Product Standard compliance follows from citing selected principles."
      evidence: "Module completion matrix and source-level deduplicated aggregation report"
validation_rules:
  - rule_id: v_scope
    applies_to: "all"
    rule: "Verify homogeneous SKU/BOM, counter route, exact reference output name and required qualifiers; other classification products remain excluded. Reject delivery/install/repair or ex-demo sale under this route. Require dated proof of natural ventilation and absence of all store-boundary fuel combustion/refrigerant circuits; unknown/present equipment is outside this fixed route."
    source_ids:
      - philips-tar1506-2024
      - un-cpc3-62142
  - rule_id: v_ledgers
    applies_to: "service; failure_pack; supplier_return"
    rule: "Require Q>0 and distinct final-valid original IDs, independently balanced gross physical stock, exclusive S/F/T/O source responsibility, actual supplier transfers/retention states, and original-pool version replacement after late returns/revocations. Q=0 is unnormalizable."
    source_ids:
      - ghg-product-2011
  - rule_id: v_providers
    applies_to: "all"
    rule: "Reconcile every supplier BOM and complete provider to receiving gate; include all actual accessories and factory batteries once; disjoint demo cell, device manufacture, maintenance, operation and end-of-life coverage. Retain no unbound identity, unknown denominator or missing actual carrier in a complete result."
    source_ids:
      - ghg-product-2011
  - rule_id: v_exposure
    applies_to: "demo; residual"
    rule: "Check all historical asset/cell beneficiaries and lifetime versions, actual positive exposure, shares<=1, retirement replacement and final residual closure. Terminal carriers receive one final responsibility fraction; direct net weighing cannot subtract removed parts twice."
    source_ids:
      - ghg-product-2011
  - rule_id: v_completeness
    applies_to: "cp_completion"
    rule: "Permit only explicitly labelled partial results until every module in c_modules has disjoint original coverage or evidenced absence and c_merge restores actual denominators, deduplicates and normalizes once. Quantity checks do not establish methodological approval or UUID verification."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Explicitly partial incremental radio counter service, or completed declared route-module inventory only after all c_modules/c_merge gates; common network/IT, security and administration remain excluded"
  excluded_use: "Radio manufacture/use footprint, whole CPC leaf, delivery/install/repair, scientific approval or full-standard conformity claim"
  required_metadata: "Model/EAN/BOM; receiving/end gate; source IDs and supplier coverage; pool/configuration/date/Q version; conditional presence; module completeness; S/F/T/O ledger"
  required_quality_disclosure: "Unresolved identities, missing modules, supplier gaps, calibration, uncertainty, late-event replacement and lifetime residuals"
  update_trigger: "Any BOM/route/provider/cell-model change, returns/revocations, corrected raw total, lifetime revision or retirement"
data_sources:
  - id: "philips-tar1506-2024"
    type: "standard"
    reference: "Philips TAR1506/00 Portable Radio, issue 2024-10-14, v5.2.7, pages 1–2; https://www.documents.philips.com/assets/20241014/1f55ad86fb9f4159af28b20900bb715c.pdf"
    used_for: "Actual model, box/accessory and power-spec identity; no consumption, BOM or battery-inclusion assumption"
  - id: "ghg-product-2011"
