system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "service"
      rule: "Start at documented store receiving gate after inbound delivery, finish at qualified physical counter handover. This is a partial incremental service. Customer travel, post-handover use and product end of life belong to the downstream goods system; record this handoff explicitly. Necessary store and logistics modules remain mandatory under c_modules before any complete service claim. Common network/IT, security and administration are expressly excluded business functions of this partial boundary. Completing the current module matrix establishes only the declared route-module inventory, not whole-store or all-business retail coverage; these exclusions remain disclosed and prevent any such full-coverage claim."
      source_ids:
        - ghg-product-2011
    - rule_id: b_package
      applies_to: "goods"
      rule: "Fix actual supplier, model, EAN, pack revision and item-level receiving evidence. Obtain supplier full product and packaging BOM or a complete model-specific lifecycle provider with signed exact coverage. Include radio electronics/enclosure/speaker/antenna, supplied documents, all actual factory accessories, factory batteries if any, box/liners/labels/adhesives and inbound gate. The specification alone proves neither battery inclusion nor absence. Factory-included objects occur once in the pack; separately bought demo cells are disjoint. Unknown composition/coverage blocks completeness, never becomes zero."
      source_ids:
        - philips-tar1506-2024
    - rule_id: b_background
      applies_to: "goods"
      rule: "Maintain unique original-pack source IDs through opening, return, resale, failure and transfers. Supplier production plus inbound logistics at the same receiving gate is partitioned into S finally accepted goods, F retailer-responsible failure/loss, T explicit continuing named internal-demo or external responsibility and O unresolved/open stock. S is handed downstream once; add F/Q to service, retain T with actual recipient and signed continuing responsibility, carry O without erasure. A failed external handover is not waste by default. Losing identity or supplier return does not erase production. Background responsibility changes create no physical exchange or avoided-burden credit. A stock-to-demonstrator assignment transfers its original source to named internal T asset and cell IDs at the actual event date; it is not F and not a new physical purchase. Before separating factory cells from the battery-free radio/box/documents package, obtain supplier-verifiable component inventory vectors with identical receiving-gate coverage, so original package vector V_pack = V_battery_free_package + sum V_factory_cell + other evidenced component vectors. Unknown component coverage blocks completeness. Do not divide environmental vectors by arbitrary mass, price or item fractions. Reuse those exact original component source IDs/providers in demo_package/demo_cell and remove their old goods allocation; newly bought cells have separate source IDs."
      source_ids:
        - ghg-product-2011
    - rule_id: b_demo
      applies_to: "demo"
      rule: "A permanent demonstrator has an asset ID and is never sale throughput. Its complete original package manufacture/installation is separated from operation cells, event maintenance and terminal treatment. This route uses actual primary alkaline LR03 AAA 1.5 V cells, no charging or mains radio supply. Log powered, switched-off and installed idle exposure and all cell changes; do not infer battery energy from 100 mW audio output or nominal life. Added headphones, security tags, mains adapters, rechargeable cells, bags, printed receipts, repair or separated carrier states require specific bilingual cards/protocols and reconciled providers before completeness. Natural ventilation and absence of every fuel burner and refrigerant circuit must be established by dated building/equipment walkthrough, plant register and landlord/provider boundary declaration. Unknown or present combustion/refrigerant equipment makes this route inapplicable, rather than a zero emission assumption."
      source_ids:
        - philips-tar1506-2024
    - rule_id: b_carriers
      applies_to: "residual"
      rule: "Dispatch only actual physical states: complete battery-free radio, spent LR03 cells, complete discarded original box assembly, and dry printed-paper carrier. Each carrier excludes transport container tare and separately dispatched components. The box assembly requires real full box/liner/label/adhesive BOM; it is not assumed pure paperboard. If broken into separately dispatched materials, extend with each actual atomic card. Provider treatment covers collection transport and treatment only if evidenced; do not duplicate contained constituents or emissions."
      source_ids:
        - ghg-product-2011
