    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard (2011), chapters 6–7 and 9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Selected unit-of-analysis, boundary transparency and allocation principles; executable route/ledger methods here are declared foreground design choices, no full-conformity claim"
  - id: "un-cpc3-62142"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, subclass 62142 explanatory note; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62142"
