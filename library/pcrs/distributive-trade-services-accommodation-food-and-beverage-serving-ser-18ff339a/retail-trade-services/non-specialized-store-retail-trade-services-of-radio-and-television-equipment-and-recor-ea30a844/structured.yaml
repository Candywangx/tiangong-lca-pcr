allocation_rules:
  - rule_id: a_pool
    applies_to: "all"
    rule: "Declare fixed store/configuration pool dates and the latest version before collection; include unsuccessful attempts, returns, closed/idle days and zero-sale subcohorts. Extend only prospectively to a declared same-configuration pool, never select successful days retrospectively. A wholly Q=0 pool retains raw burdens and remains unnormalizable. Late returns/revocations replace original pool numerator, denominator and fate ledger at actual event dates; resales do not charge original production twice."
    source_ids:
      - ghg-product-2011
  - rule_id: a_direct
    applies_to: "electricity"
    rule: "Use disjoint direct metering first. Shared residual meter totals use documented activity-linked checkout ready-hours, including idle/failed service, over every actual beneficiary. Subtract child meters only when included in the parent measured boundary. Reconcile shares to full pool total; unknown or zero all-beneficiary driver blocks allocation, not a default weight."
    source_ids:
      - ghg-product-2011
  - rule_id: a_assets
    applies_to: "demo"
    rule: "For each complete demo asset or primary cell retain acquisition/BOM/provider, installed intervals, every beneficiary and versioned expected total lifetime exposure L_v. Allocate its embodied package by e_p/L_v as c_exposure, then normalize once. Never input full acquisition again beside that share. At retirement or revised lifespan, replace every historical beneficiary version, reconcile cumulative shares <=1 and allocate final residual over actual full-life exposure, including idle exposure. Maintenance is actual event-based with disjoint provider coverage. Terminal carrier mass uses its own final lifetime responsibility fraction once, not an additional manufacturing factor."
    source_ids:
      - ghg-product-2011
  - rule_id: a_no_credit
    applies_to: "residual"
    rule: "No recycling, supplier return or refund credit is assumed. Financial refunds or discounts with valid acceptance do not alter Q. Actual acceptance revocation removes the original ID even without return; Q already counts distinct final-valid IDs and revocations are not subtracted again."
    source_ids:
      - ghg-product-2011
