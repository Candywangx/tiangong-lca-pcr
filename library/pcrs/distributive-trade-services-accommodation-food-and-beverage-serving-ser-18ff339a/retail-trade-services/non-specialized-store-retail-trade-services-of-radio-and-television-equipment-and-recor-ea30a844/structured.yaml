      raw_fields: "module_id; raw_source_id; source_version; original_denominator; original_unit; normalized_value; actual_raw_total; property_uuid; exchange_uuid; flow_type; direction; compartment; provider_boundary; all_beneficiary_driver; empty_trip; stationary_idle_hours; freight_capacity_occupied_hours; asset_e_p; asset_L_v; every_prior_version; area; reserved_hours; shelf_capacity; service_ready_hours; actual_meter_data; cleaner_mass; discharge_volume; density; trip_fuel; charging; source_background_owner; attribution_fraction; physical_event; opening_closing_stocks; uncertainty; Q_pool_version; natural_ventilation_evidence; no_combustion_evidence; no_refrigerant_evidence; no_purchased_heat_cooling_evidence; cleaning_event; cleaned_area; all_cleaned_area; water_import_kg; original_formulation_model; original_formulation_kg; supplier_composition; solution_kg; original_source_destination_kg; rinse_water_kg; dry_cloth_source; cloth_lifetime; cloth_net_wet_dispatch_kg; cleaner_container_BOM; whole_liquid_net_kg; discharge_volume; density; cleaner_retained_kg; carrier_provider_exclusions; component_source_id; supplier_component_vectors; original_source_final_partition; reclassification_event_id; previous_source_destination; replacement_source_destination; container_complete_BOM; container_retained_liquid_kg; container_net_dispatch_kg; e_area; L_area_v; all_beneficiary_cleaned_area; cloth_lifetime_version; every_prior_cloth_version; cloth_remaining_life_evidence; actual_cloth_laundry_event; cloth_laundry_provider_boundary; cloth_repair_event; cloth_terminal_carrier; final_actual_area; segment_id; capacity_kg; reserved_h; driver_unit; all_beneficiary_segment_drivers; provider_allocation_status; consignment_attributed_quantity; fixture_asset_id; fixture_complete_BOM; fixture_building_provider_coverage; fixture_reserved_zone_area_m2; fixture_reserved_h; fixture_all_beneficiary_area_hours; fixture_L_area_h_v; fixture_lifetime_version; fixture_previous_beneficiary_versions; fixture_final_actual_area_h; fixture_maintenance_event; fixture_provider_exclusions; partial_excluded_business_functions"
      collection_method: "Collect whole-store/module originals, subcontractor full fuel/distance/idle records, meter diagrams and asset exposure; bind each real exchange before aggregation; c_modules and c_merge; unknown presence/coverage is a blocking gap; absence needs dated inspection/provider proof"
      unit: "source-specific units; h; m2"
      frequency: "Every module period and revision"
      temporal_coverage: "Same configuration pool plus full-life source histories"
      site_scope: "Building, shelving, checkout hardware, lighting/HVAC, housekeeping and actual logistics"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed disjoint boundary matrix, original units/denominators, all-beneficiary driver and exact source-ID deduplication"
  calculation_rules:
    - id: c_acceptance
      applies_to: "service"
      rule: "Q = count(distinct original_id with final valid acceptance in the original pool version). Require actual paid/order-linked handover of the exact complete pack, customer acceptance of correct model/quantity/state and declared return assessment closure date. Refused, lost, demo, cancelled and revoked acceptance IDs do not count. Returning then reselling the same unit leaves at most one final valid service. Financial adjustment alone does not revoke acceptance. Correct the original pool, never subtract revocations a second time. Final external retention without acceptance is separate physical custody and S/F/T/O fate, not sale or automatic waste. Use disjoint physical states G=saleable goods, D=permanent demonstration devices and H=held condemned devices. G_to_H and D_to_H are dated internal condemnation transfers, not physical dispatches. Close G: G_open+G_receipts+G_customer_returns+G_internal_in = G_close+G_gross_customer_handover+G_supplier_return+G_internal_out+G_to_D+G_to_H+G_loss. Close D: D_open+D_direct_acquisition+G_to_D+D_internal_in = D_close+D_to_H+D_external_transfer+D_loss. Close H: H_open+G_to_H+D_to_H+H_external_in = H_close+H_dispatch+H_loss. Count each original device once per transfer; maintain a separate cell ledger rather than adding cell counts to device counts. Paper/box states have their own kg stock QA. Actual waste dispatch occurs only at H_dispatch consignment date; radio_waste uses measured kg then, not condemnation count. All physical external transfers/retention require named recipient and state-specific cards before completeness. Reconcile source-linked device/cell/box/paper kg separately at measured moisture/state and actual component BOM; never mix kg with these count balances."
      inputs:
        - original_id
        - event_id
        - actual_date
        - acceptance_evidence
        - acceptance_status_version
        - gross_handover
        - return
        - revocation
        - final_recipient
        - opening
        - receipt
        - closing
        - internal_transfer
        - demo_assignment
        - loss
        - waste
        - G_open
        - G_receipts
        - G_customer_returns
        - G_internal_in
        - G_close
        - G_gross_customer_handover
        - G_supplier_return
        - G_internal_out
        - G_to_D
        - G_to_H
        - G_loss
        - D_open
        - D_direct_acquisition
        - D_internal_in
        - D_close
        - D_to_H
        - D_external_transfer
        - D_loss
        - H_open
        - H_external_in
        - H_close
        - H_dispatch
        - H_loss
        - state_transfer_date
        - source_original_or_asset_id
        - component_source_id
        - carrier_state
        - moisture_state
        - component_BOM
        - internal_T_asset_cell_id
      output: "Q Item(s) and independent gross custody balance"
      source_ids:
        - ghg-product-2011
    - id: c_background
      applies_to: "failure_pack"
      rule: "For every original supplier source s in Item(s), B_R_s = B_S_s + B_F_s + B_T_s + B_O_s. Compute B_x_s = original source_pack_quantity_s * exclusive responsibility_fraction_x_s once; fractions sum to 1. Sum B_F_s for failure_pack amount B_F/Q; join model-specific complete provider at receiving gate. Transfer B_S/Q to the downstream goods model exactly once. B_T retains identified internal asset/cell or external custodian/continued background; B_O blocks final closure. Original source equivalents do not equal fragment count or mass: descendant carriers share the original source partition and never each obtain one pack. Source production and inbound transport have same ownership. Event dates and provider version replace original numerator when fate changes. failure_pack admits only a full original source whose entire receiving-gate environmental vector belongs to F; use responsibility fractions 0 or 1 for that whole source. If only particular components have F responsibility, the whole-pack card is unavailable: first obtain the actual supplier component vectors and add named component-specific cards, never a nominal mass/count fraction of V_pack. A demo-assigned source is internal T; its exact disaggregated original vectors pass to c_exposure and cannot also enter B_F."
      inputs:
        - source_background_id
        - source_pack_quantity
        - S_F_T_O
        - responsibility_fraction
        - supplier_BOM
        - provider_coverage
        - event_date
        - provider_version
        - component_source_id
        - supplier_component_vectors
        - internal_T_asset_cell_id
        - state_transfer_date
        - source_vector
        - source_vector_conservation
      output: "B_F Item(s), S/T/O separate backgrounds at original gate"
      source_ids:
        - ghg-product-2011
    - id: c_transfer
      applies_to: "supplier_return"
      rule: "N_supplier_intact is the actual distinct complete intact original packs in supplier consignment receipts, measured before division by Q. Do not derive physical transfers from B_T or financial credit. Opened/damaged/externally retained goods need state/recipient-specific extension or remain explicitly incomplete. Preserve corresponding background responsibility through all transfers."
      inputs:
        - consignment_id
        - original_id
        - physical_state
        - recipient
        - actual_date
        - N_supplier_intact
        - source_background_owner
      output: "N_supplier_intact Item(s)"
      source_ids:
        - ghg-product-2011
    - id: c_electricity
      applies_to: "metered_ac"
      rule: "E_attr_kWh = E_direct_disjoint + E_shared_residual * h_pool / sum_all_beneficiaries(h). E_shared_residual = parent_end - parent_start - included_disjoint_children only for proven included child circuits. Direct independent meters receive no parent subtraction. h is actual assigned checkout ready-hours including idle, failure and closed standby responsibility. Require known positive shared denominator and reconciliation to total including all beneficiaries; unknown is not zero. Convert 1 kWh = 3.6 MJ; amount = 3.6*E_attr_kWh/Q. Demo primary-cell energy is already in demo_cell, not AC. Meter actual checkout off/standby intervals; no nominal watt defaults."
      inputs:
        - meter_id
        - parent_boundary
        - start_kWh
        - end_kWh
        - included_disjoint_children
        - E_direct_disjoint
        - h_pool
        - all_beneficiary_ready_hours
        - Q
      output: "MJ per 1 Item(s) service"
      source_ids:
        - ghg-product-2011
    - id: c_exposure
      applies_to: "demo_package; demo_cell"
      rule: "For each a, e_p_a is actual installed responsibility duration in h for beneficiary p, including off/idle reserved exposure; L_v_a is documented expected total lifetime installed responsibility h across all beneficiaries, never audio power or arbitrary lifespan. For removed stored cells, retain custody and add actual reserved storage exposure consistently to both e and L. Document L_v from actual model-specific inspection/remaining-life evidence and observed usage states, including cell depletion and storage; no assumed cell count per demonstration. Require L_v >= cumulative actual exposure; otherwise revise all historical allocations first. f_p_a=e_p_a/L_v_a; sum f<=1. Replace, never add, every previous beneficiary allocation when L changes. At retirement L_final=sum_all_actual e and replace all prior allocations so sum f_final=1; unexplained residual/zero lifetime blocks closure. Device package sum f / Q and cell sum f / Q are separate complete physical products; actual package factory cells excluded from device provider and linked to cell ledger once. Maintenance events require actual replacement-specific quantities; acquisition stocks are checks, not extra inputs. For a device transferred from G, manufacturing/installation numerator comes from the same verified battery-free original component vector and source IDs transferred to internal T, not a new whole-pack acquisition. Its physically separate factory cells use the matching original cell component vectors under their own cell IDs; separate replacement cells use their actual new source providers. The package means the complete battery-free radio, original box assembly and supplied documents as a defined model-specific physical product package; exclude cell manufacture, operation, maintenance and treatment. If other factory accessories exist, obtain exact component coverage and extend the named package/cards before completeness."
      inputs:
        - asset_or_cell_id
        - e_p
        - all_beneficiary_exposure
        - L_v
        - lifetime_version
        - previous_allocation_versions
        - removed_storage_hours
        - idle_beneficiary
        - final_actual_exposure
        - final_residual
        - factory_inclusion
        - manufacture_provider_exclusions
        - Q
        - component_source_id
        - supplier_component_vectors
        - internal_T_source_id
        - source_vector
        - source_vector_conservation
      output: "Attributable complete asset or cell Item(s) per service"
      source_ids:
        - ghg-product-2011
    - id: c_dispatch
      applies_to: "radio_waste; spent_cell; box_waste; paper_waste"
      rule: "For each real consignment k, W_net_k = gross_kg - actual transport_container_tare_kg, or use direct calibrated net measurement exclusively. Direct radio net mass after removal already excludes cells; do not subtract removed cells again. For sold-stock-derived carriers W_attr = sum W_net owned by source pool; for demo/cell carriers W_attr_p = sum(W_net_k * f_final_p_k) once, with final lifetime responsibility from c_exposure. No second manufacture fraction. Original pack components remain disjoint among actual carrier dispatch, customer handover, supplier transfer and retained stock. Opening+generation=dispatch+closing is an independent check, never a further deduction from actual dispatch. Treatment and transport attach only once to their evidenced carrier, no default avoided credit."
      inputs:
        - consignment_id
        - carrier_state
        - source_original_or_asset_id
        - gross_kg
        - transport_container_tare_kg
        - net_kg
        - weighing_mode
        - removed_parts
        - final_life_responsibility
        - opening_carrier_stock
        - generated
        - closing_carrier_stock
        - recipient
        - provider_boundary
        - Q
      output: "Actual attributable kg per carrier / Q"
      source_ids:
        - ghg-product-2011
    - id: c_modules
      applies_to: "cp_completion"
      rule: "Mandatory completion matrix: (1) building shell manufacture/installation and terminal treatment excluding separately modelled fittings/HVAC, by assigned floor-area*reserved-hours / all-beneficiary full-life floor-area*hours; (2) shelving manufacture/installation/terminal, excluding building and goods, by reserved occupied shelf-capacity*hours / all-beneficiary lifetime capacity*hours; (3) complete checkout hardware manufacture/installation/terminal excluding AC, consumables and maintenance, by assigned service-ready hours / all-beneficiary lifetime ready-hours; (4) actual lighting and ventilation-fan AC only, excluding metered_ac circuits: use disjoint meters then actual illuminated/ventilated floor-area*reserved-hours across all beneficiaries, including closed/idle responsibility. This fixed route has evidenced no fuel combustion, refrigerant equipment or purchased heat/cooling; unknown or present equipment makes it inapplicable; (5) actual housekeeping and spill/failure cleaning under c_cleaning, allocated by directly cleaned area per event including all beneficiaries; (6) handling/inbound/supplier-return/waste logistics with source ownership per c_background: verified full provider includes actual loaded/empty travel, loading and stationary idle. Otherwise collect fuel/charging and actual vehicle operation by actual segment_id. Use one physical coordinate for every beneficiary on that same segment: d_p_segment=actual reserved payload capacity_kg*reserved_h in kg*h. Never mix volume, item counts or their hours into that driver. Allocate the complete measured segment activity by d_p_segment/sum_all_beneficiaries d_segment, including actual stationary idle duration and empty-return reserved capacity. Every beneficiary driver must be known and the segment total positive; unknown/zero totals block allocation, not a zero t*km claim for empty travel. Record provider_allocation_status. If a signed provider has already attributed the actual quantity to this consignment, use consignment_attributed_quantity directly; segment capacity/time details are QA only and no driver or attribution fraction is multiplied again. Exclude logistics already in supplier receiving-gate or carrier treatment provider. Modules1–3 use c_exposure with respective measured drivers and replace every prior beneficiary on actual retirement/lifetime revision. Every actual maintenance/replacement and new carrier requires event-specific atomic bilingual rows/protocols and providers. No complete service claim until all modules measured or absence evidenced. Actual complete lighting fixtures and ventilation-fan hardware require model-specific full BOM manufacture, installation, event maintenance and terminal responsibility. Count these once inside the actual building provider only when signed exact provider coverage proves all applicable stages and exclusions. Otherwise an independent mandatory fixture-asset module is required: e_fixture_p=actual reserved_zone_area_m2*reserved_h for beneficiary p, and L_fixture_v is evidenced expected total full-life area-hours in m2*h over every beneficiary. Use f_fixture_p=e_fixture_p/L_fixture_v once for manufacture/installation, require known positive lifetime/total exposure and cumulative fractions<=1, and replace every historical beneficiary allocation after any lifetime revision. At actual retirement set L_fixture_final=sum_all_actual e_fixture, replace all prior versions and close final residuals. Cover actual event maintenance separately by actual beneficiary reserved zone area-hours for that event, excluding provider-contained maintenance. Keep operation AC in module4 disjoint from fixture manufacture/installation, maintenance and end-of-life. Attach actual complete terminal fixture-carrier net mass and treatment once using its final lifetime responsibility fraction, not another manufacturing factor; exclude any terminal carrier/treatment already in the building provider. Unknown full BOM, stage coverage or provider overlap blocks completeness, never becomes zero."
      inputs:
        - module_id
        - raw_source_id
        - source_version
        - provider_boundary
        - all_beneficiary_driver
        - area
        - reserved_hours
        - shelf_capacity
        - service_ready_hours
        - asset_e_p
        - asset_L_v
        - every_prior_version
        - actual_meter_data
        - cleaner_mass
        - discharge_volume
        - density
        - trip_fuel
        - charging
        - empty_trip
        - stationary_idle_hours
        - freight_capacity_occupied_hours
        - source_background_owner
        - Q_pool_version
        - segment_id
        - capacity_kg
        - reserved_h
        - driver_unit
        - all_beneficiary_segment_drivers
        - provider_allocation_status
        - consignment_attributed_quantity
        - fixture_asset_id
        - fixture_complete_BOM
        - fixture_building_provider_coverage
        - fixture_reserved_zone_area_m2
        - fixture_reserved_h
        - fixture_all_beneficiary_area_hours
        - fixture_L_area_h_v
        - fixture_lifetime_version
        - fixture_previous_beneficiary_versions
        - fixture_final_actual_area_h
        - fixture_maintenance_event
        - fixture_provider_exclusions
        - partial_excluded_business_functions
      output: "Disjoint raw source/module quantities in original units and denominator"
      source_ids:
        - ghg-product-2011
    - id: c_merge
      applies_to: "cp_completion"
      rule: "Restore each external normalized exchange n_i to its evidenced raw original numerator R_i=n_i*D_i using actual original denominator D_i, pool and replacement version; use actual raw total instead when supplied and never multiply twice. Apply only its one justified attribution fraction. Reject unknown original denominator, incompatible pool/version or overlapping provider scope. Deduplicate exact source_id+version+physical-event+provider-boundary, replace superseded values, then add only identical exchange UUID/type/direction/compartment, flow property and unit numerators row by row; convert known equivalent units once. Never add kg to MJ or raw to normalized values. Divide all compatible merged raw attributable numerators by common corrected Q once. Keep S downstream coupling separate from incremental service F; reconcile source origins and disclose module completeness."
      inputs:
        - module_id
        - raw_source_id
        - source_version
        - original_denominator
        - original_unit
        - normalized_value
        - actual_raw_total
        - attribution_fraction
        - exchange_uuid
        - flow_type
        - direction
        - compartment
        - property_uuid
        - provider_boundary
        - physical_event
        - Q_pool_version
      output: "One normalized inventory per common accepted service, with explicit completion coverage"
      source_ids:
        - ghg-product-2011
    - id: c_cleaning
      applies_to: "cp_completion"
      rule: "For each actual cleaning event, collect imported water in kg by direct net weighing or supply volume times measured density, actual purchased original cleaner formulation/model kg, exact supplier composition, separately added dilution/rinse water, every cloth and cleaner-container source/BOM and real dispatch/retained state. Direct meter imports already exclude internal reuse: never subtract reuse again. Measure complete liquid discharge exclusively by calibrated whole-liquid net kg or actual discharge V*rho at measured density/temperature; do not reconstruct it from water balance or subtract evaporation/retention from an already measured dispatch. Record original-formulation-source kg in used/spilled/rinsed/retained/unused destinations as mutually exclusive final source-responsibility portions, excluding added rinse water/dirt. A used or spilled intermediate later rinsed or retained is reclassified by replacing its previous destination for the same source kg and event ID, never added as another source quantity; the final portions reconcile to original formulation input. Composition partitions source QA once, not the measured full-liquid carrier again. Outside cloth/container mass is a separate actual carrier, not original formulation export. A container terminal carrier is the directly measured net complete actual container assembly, including actual body/closure/liner/label/adhesive components and any retained residual liquid, excluding transport-container tare. Its retained liquid is partitioned to that container carrier and cannot also enter liquid effluent or wet-cloth dispatch; the same rule prevents any residual liquid duplication between all three carriers. For each reusable cloth, use a separate area-based equation: f_area_p=e_area_p/L_area_v, where e_area_p is its actual cleaned area in m2 for beneficiary p and L_area_v is its evidenced expected total lifetime cleaned area in m2 over every beneficiary; the h-based e_p/L_v definition for radio/cells is not applied to cloth. Retain cloth model/BOM, remaining-life evidence, every historical beneficiary/version and all failed/spill cleaning area; unknown or nonpositive lifetime/total driver blocks allocation. Replace every historical cloth allocation after any lifetime revision. At actual retirement set L_area_final=sum_all_actual e_area and replace all prior versions so final fractions sum to 1; disclose and resolve residuals. Allocate complete cloth manufacture/installation once by f_area_p and divide Q once, not full purchase again. Actual cloth laundering and repair are event-specific disjoint source packages or atomic water/electricity/cleaner/material rows, allocated to actual event beneficiaries by cleaned area with known positive totals, excluding quantities already in the cloth lifecycle provider. Cloth end-of-life treatment and its actual whole terminal carrier are separate from manufacture/operation; multiply the measured terminal carrier by final f_area once and exclude provider-contained duplicates. A measured wet-cloth consignment carries its actual whole mass including retained liquid; the same liquid cannot also be discharge. Single-use cloth inputs, actual container production, separately discharged containers, liquid treatment and carriers require named atomic bilingual cards/protocols matched to real composition/state before completeness. A verified complete supplier event package may substitute only with exact signed inclusion of these quantities and disjoint water/electricity/chemical/cloth/container/transport/treatment scopes; remove every duplicated foreground/provider quantity by exact source ID, never assume coverage. Attribute each raw event exchange once by cleaned_area/sum_all_cleaned_area with positive known total, or direct subdivision first, then c_merge and divide Q once."
      inputs:
        - cleaning_event
        - cleaned_area
        - all_cleaned_area
