allocation_rules:
  - rule_id: direct_first
    applies_to: "all inventory rows"
    rule: "Core electricity is ONLY the glass-bay lighting circuit; checkout/IT and other support electricity belong to support modules. Take interval meter readings at every lighting on/off or beneficiary-reservation change. Partition measured kWh into mutually exclusive customer-active, lit-idle, and closed/standby interval pools k; their sum equals the circuit total. The fixed driver for EACH pool is reserved lit floor-area*time d_g_k = sum_i(A_reserved_g_i*duration_i) in m2*h, measured from marked bay/aisle plans and dated reservation logs for every merchandise beneficiary. Partition common aisle area into nonoverlapping reservations before collection; include empty-but-reserved floor area. Charge unused idle/closed capacity to the beneficiaries retaining that reservation, including zero-sale/failed cohorts. No unassigned common area or unowned idle is zero: require a prospective all-beneficiary reservation schedule, or block allocation. E_g = sum_k(E_k*d_g_k/sum_b d_b_k). Dedicated glass-only circuit has fraction one only with exclusive-reservation evidence. Reconcile all beneficiaries to measured total; never mix driver dimensions or allocate a provider-already-attributed quantity again."
    source_ids:
      - jrc-retail-2013
  - rule_id: prospective_pool
    applies_to: "glass_service"
    rule: "Declare same-SKU/site/route cohort window prospectively; retain all failures and zero-sale subperiods. Q is distinct final-valid original-sheet net kg after revision, not gross sales revenue or repeated handovers. An entirely zero-Q pool is unnormalizable and carried visibly pending its declared follow-up; never merge configurations to hide it. Reopen original version for late events and replace all affected numerators/denominators with actual event dates."
    source_ids:
      - jrc-retail-2013
  - rule_id: support_drivers
    applies_to: "glass_service"
    rule: "For every actual support source first use measured dedicated records, then separate active/idle/fixed source-numerator pools with exclusive event and meter boundaries. For each pool x_g_pool = x_pool*d_g_pool/sum_b d_b_pool using the fixed same-unit drivers below; reconcile sum_g x_g_pool=x_pool and retain every idle/failed beneficiary. Checkout/payment active source is allocated by measured processing seconds per beneficiary and all failed/reversed attempts; reserved idle terminal/network/security device electricity by reserved device-capacity*h across ALL beneficiaries including closed periods. Provider-attributed transaction processing is taken unchanged with transaction/event coverage; do not reallocate it by seconds. Network active source uses actual transferred bytes only when the provider source is byte-dependent; its idle/fixed source uses reserved bandwidth*h, never bytes plus hours. Store security and administration shared fixed sources use measured reserved store floor m2*h for every merchandise beneficiary; directly timed admin tasks use actual task seconds in a separate measured source pool. Cleaning consumable/water/effluent sources use measured cleaned floor m2 per event, with formulation-origin kg separate from added water/dirt; actual wet effluent discharge is measured carrier net kg or V_discharge*rho measured at discharge, with no supply-balance deduction. HVAC operational source uses metered conditioned-zone capacity*m2*h reservations separately by same thermal zone/setting; refrigerant/combustion presence requires specific species/fuel/leak/contained-transfer cards before completeness, not generic zero. Fixed building/lamps, checkout/network/security/HVAC assets use asset_fraction replacement/final-residual equations with separate actual model and exposure unit: m2*h for building/lighting/zone plant and reserved device-capacity*h for IT/security; never pool these different dimensions. Original reusable shipping stillage uses actual reserved load-capacity_kg*h per asset including empty return/idle reservation and the same lifetime equations. One-use original packaging uses actual complete package or exclusive full BOM vector once, allocated to its actual receiving source then S/F/T/O fate with signed owner; include retained/returned/customer/waste fates, never auto-dispose on receipt. Additional retailer paper manufacturing/supply remains core first-issue P_used; support transport is added only for a proven omitted transport stage."
    source_ids:
      - jrc-retail-2013
dataset_production:
  collection_protocols:
    - protocol_id: cp_glass
      process_id: "retail"
      flow_role: "glass_service; failed_original_glass; glass_cullet; supplier_glass_transfer; external_damaged_glass"
      record_type: "foreground_record"
      raw_fields: "pool_id; original_id; supplier_lot; composition; dimensions; thickness; net_kg; packaging_tare; scale_id; acceptance; final_acceptance; event_date; receipts; customer_returns; gross_customer_handovers; supplier_handoffs; external_handoffs; damaged_external_handoff; condemned; dispatched_cullet; Goods_open; W_open; B_S; B_F; B_T; B_O; recipient; state; original_vector; inbound_transport; Goods_close; W_close; confirmed_missing_goods; confirmed_missing_waste; unresolved_goods_delta; unresolved_waste_delta; stocktake; investigation_signoff"
      collection_method: "Tag each original sheet/fragment lineage at receipt; weigh glass net excluding measured packaging/rack tare on calibrated scale, document paired lot weights if individual safe weighing is unavailable. Log every custody movement and acceptance independently. Direct waste dispatch is consignment net mass, stock balance is QA only. Actual broken external handoffs remain separate from in-store waste. No nominal area*density conversion; unknown kg blocks service denominator. Match supplier original production/inbound vector to S/F/T/O receiving-gate equivalents. Stocktake both usable and held-waste glass at opening/closing. Confirm missing quantities only through signed lineage investigation; retain unknown signed residuals and block completeness under glass_stock."
      unit: "kg"
      frequency: "Each event; meters at interval boundaries"
      temporal_coverage: "Whole prospective pool including closures and late corrections"
      site_scope: "Named store glass bay and all actual beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dated original records; calibrated instruments; calibration uncertainty and reconciliation signed by collector"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "rack_electricity"
      record_type: "foreground_record"
      raw_fields: "meter_id; interval_start; interval_end; interval_state; E_k; A_reserved_g_i; duration_i; d_g_k; d_b_k; reservation_owner; floor_plan; all_beneficiaries; parent_boundary; voltage; supplier_year; geography; delivery_loss_boundary"
      collection_method: "Read calibrated actual glass-bay lighting circuit meter at each state/reservation transition. Photograph marked floor/aisle areas and measure m2; record reserved beneficiary and start/end hours even if empty or store closed. Interval E_k belongs to exactly one active/lit-idle/closed-standby state. Use the same m2*h reservation driver in each measured pool under direct_first. Reconcile total to circuit and bill boundary; assign every idle reservation and include zero-sale cohorts. Checkout/payment/network/security/admin and shared-building electricity are excluded here and collected under cp_modules; no nameplate or assumed off-state consumption. Unknown scope or unassigned reservation blocks allocation."
      unit: "kWh"
      frequency: "Each event; meters at interval boundaries"
      temporal_coverage: "Whole prospective pool including closures and late corrections"
      site_scope: "Named store glass bay and all actual beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dated original records; calibrated instruments; calibration uncertainty and reconciliation signed by collector"
    - protocol_id: cp_paper
      process_id: "retail"
      flow_role: "kraft_interleaf; waste_kraft; customer_kraft"
      record_type: "foreground_record"
      raw_fields: "source_id; paper_grade; coating; net_kg; moisture_state; P_open; P_received; P_close; P_customer; P_waste; held_used_stock; dispatch_id; P_unused_transfer; P_first; U_open; U_received; U_close; U_transfer; confirmed_missing_paper; unresolved_paper_delta; first_issue_owner; first_charge_receipt; supply_transport_scope"
      collection_method: "Only actual additional uncoated kraft interleaf introduced by retailer, not supplier-original interleaf. Weigh conditioned actual material net excluding cores/wrap. Track unused, reuse, customer transfer and waste independently; contaminated/mixed waste requires specific replacement card and provider before completeness. Separate never-issued P stock from already-used U stock on each count. Link first issue to original manufacturing/supply-transport charge receipt and continuing owner; no re-charge on reuse across periods. Follow paper_balance for unused transfers, used transfers and actual final fate; unknown residual blocks."
      unit: "kg"
      frequency: "Each event; meters at interval boundaries"
      temporal_coverage: "Whole prospective pool including closures and late corrections"
      site_scope: "Named store glass bay and all actual beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dated original records; calibrated instruments; calibration uncertainty and reconciliation signed by collector"
    - protocol_id: cp_assets
      process_id: "retail"
      flow_role: "glass_rack_package"
      record_type: "foreground_record"
      raw_fields: "asset_id; model; BOM; provider_vector_version; lifecycle_scope; original_vector; occupied_kg_a_g_i; reserved_unused_kg_a_g_i; duration_h_i; e_a_g; L_a_v; H_a; f_a_g_old; f_a_g_final; V_a_old; V_a_new; repair_event; replacement_event; retirement_dispatch; all_beneficiaries; previous_allocations; usable_rated_capacity_kg; reservation_owner"
      collection_method: "Verify actual rack model/BOM, rated usable capacity and signed complete-package vector, including manufacturing/installation, actual maintenance and terminal treatment plus their transport boundaries. Each occupancy/reservation change logs time, occupied kg and disjoint unused reserved kg for every beneficiary; assign entire usable capacity including idle/closed reservation. Evidence expected lifetime exposure using dated usage history and documented retirement plan, not assumed calendar years. At repair/retirement retain old version, actual event invoices/carrier records and replacement-vector scope map; remove the superseded modeled event, update V, then execute asset_fraction across ALL previous beneficiaries. No acquisition, repair, transport or retirement may appear both inside the package and outside it. One model/identical-vector group per card; otherwise add separate bilingual cards and sync before completeness."
      unit: "Item(s); kg*h"
      frequency: "Each event; meters at interval boundaries"
      temporal_coverage: "Whole prospective pool including closures and late corrections"
      site_scope: "Named store glass bay and all actual beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dated original records; calibrated instruments; calibration uncertainty and reconciliation signed by collector"
    - protocol_id: cp_modules
      process_id: "retail"
      flow_role: "glass_service"
      record_type: "foreground_record"
      raw_fields: "module_id; module_version; normalized_j_m; original_denominator_m; source_id; core_numerator_j; B_F; B_S; original_goods_vector_S_j; Q; actual_source_event_asset; lifecycle_scope; coverage_overlap_map; active_source; idle_source; fixed_source; processing_seconds; task_seconds; transferred_bytes; reserved_bandwidth; reserved_device_capacity; floor_area_m2; conditioned_zone_capacity; reservation_duration_h; all_beneficiaries; cleaned_area_m2; cleaner_origin_kg; externally_supplied_water; V_discharge; discharge_density; actual_wet_effluent_kg; utility_meter; fuel_species; refrigerant_species; leak_record; contained_transfer; waste_consignment; packaging_mode; complete_pack_BOM; original_pack_id; S_F_T_O_owner; first_charge_receipt; stillage_asset; stillage_reserved_capacity_kg; stillage_empty_return; trip_id; segment_id; provider_mode; provider_scope; measured_load_tonnes; actual_km; reserved_payload_capacity; duration_h; empty_vehicle_km; stationary_idle_h; measured_fuel; measured_energy; source_stage_overlap; x_pool; d_g_pool; d_b_pool; asset_id; model; exposure_unit; e_a_g; L_a_v; H_a; f_a_g_old; f_a_g_final; V_a_old; V_a_new; repair_event; retirement_dispatch; previous_allocations; absence_evidence; x_transport_a_v; f_a_g_v; e_a_g_actual; x_transport_a_old; x_transport_a_new; f_a_g_new; original_pool_id; original_pool_version; Q_g; prior_transport_attribution; first_issue_owner; P_first loaded_attribution_mode; target_gross_kg; whole_vehicle_gross_kg; target_payload_kg; all_other_payload_kg; provider_reference_basis; source_attribution_level"
      collection_method: "At opening and each configuration change perform signed site walkthrough and reconcile contracts/invoices to actual building/lighting/checkout/IT/network/payment/security/admin/cleaning/HVAC assets and services; record specific absence evidence for each nonpresent item, never infer zero from no invoice alone. Read dedicated meters and timestamped active/idle/fixed events. Measure floor/zone reservations in m2 and h, task/transaction seconds, bytes/bandwidth and device-capacity reservations separately; log every beneficiary and failed/zero-sale/closed interval. Apply fixed support_drivers, not a selectable driver menu. For each original packaging source verify actual full BOM/model or signed whole-package boundary exclusively, quantities, receiving/source/fate/first-charge records and actual empty stillage returns; no added-paper double charge. Collect trip-segment odometer/load/reservation/idle-fuel evidence and inspect provider coverage under support_transport for packaging/asset/repair/waste movements. Collect waste actual net consignment and treatment boundary, including transport coverage; subtract only proven overlap. Compare actual constituent/stage/time/event maps even if provider IDs differ. Any present unknown fuel/refrigerant/effluent or missing specific support exchange requires bilingual atomic cards/protocols and normal sync before full-service completion. For each asset/repair omitted transport trip, record asset_id, original transport-vector scope and prior attribution, and restore its historical asset exposure ledger. Apply support_transport to asset raw numerator, then asset_fraction exactly once; post replacements/deltas to original pool/version and revised Q_g. Check V-contained transport and prior historical allocation before any addition. Link paper supply to first-issue owner/P_first and packaging transport to original_pack_id/source ownership; reconcile receipt stock records to first-charge receipts without a second supply charge."
      unit: "source-specific"
      frequency: "Each event; meters at interval boundaries"
      temporal_coverage: "Whole prospective pool including closures and late corrections"
      site_scope: "Named store glass bay and all actual beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dated original records; calibrated instruments; calibration uncertainty and reconciliation signed by collector"
  calculation_rules:
    - id: accepted_mass
      applies_to: "glass_service"
      rule: "Q = sum of measured net kg of distinct final-valid original sheets in pool; acceptance revocations reclassify original IDs, do not subtract twice. Gross handovers/returns are separate physical events."
      inputs:
        - original_id
        - net_kg
        - final_acceptance
        - event_date
        - pool_id
      output: "Q"
      source_ids:
        - jrc-retail-2013
    - id: glass_stock
      applies_to: "glass_cullet"
      rule: "Goods_close = Goods_open+receipts+customer_returns-gross_customer_handovers-supplier_handoffs-external_handoffs-condemned-confirmed_missing_goods+unresolved_goods_delta; W_close = W_open+condemned-dispatched_cullet-confirmed_missing_waste+unresolved_waste_delta. All terms kg with disjoint movement IDs. Confirmed missing kg needs dated stocktake, original lineage and investigation signoff; it receives F original-source responsibility absent a signed continuing T owner, but is never invented as dispatched waste. Missing held waste retains its already assigned original F responsibility and never creates a second original manufacturing input. Unknown signed residual deltas are disclosed, investigated and block completeness, never default zero or automatically classified F. gross_customer_handovers includes all customer exits including damaged/unaccepted; external_handoffs only noncustomer nonsupplier exits. damaged_external_handoff tags a subset, not another subtraction. Condemnation moves goods to held waste internally; dispatch removes held waste once."
      inputs:
        - Goods_open
        - receipts
        - customer_returns
        - gross_customer_handovers
        - supplier_handoffs
        - external_handoffs
        - damaged_external_handoff
        - condemned
        - W_open
        - dispatched_cullet
        - confirmed_missing_goods
        - confirmed_missing_waste
        - unresolved_goods_delta
        - unresolved_waste_delta
        - stocktake
        - investigation_signoff
        - original_id
      output: "Goods_close; W_close; unresolved_goods_delta; unresolved_waste_delta"
      source_ids:
        - jrc-retail-2013
    - id: energy_total
      applies_to: "rack_electricity"
      rule: "For interval source pools fixed by direct_first, E_g_k = E_k*d_g_k/sum_b d_b_k with E_k measured kWh and d_g_k measured m2*h reserved lighting exposure. E_MJ = 3.6*sum_k E_g_k. All state pools and beneficiaries reconcile to total meter kWh. Nested subtraction only with actual parent inclusion; disjoint meters are never subtracted. Then E_MJ/Q once."
      inputs:
        - meter_id
        - interval_state
        - E_k
        - A_reserved_g_i
        - duration_i
        - d_g_k
        - d_b_k
        - parent_boundary
        - all_beneficiaries
        - Q
      output: "E_MJ/Q"
      source_ids:
        - jrc-retail-2013
    - id: asset_fraction
      applies_to: "glass_rack_package"
      rule: "Retain one actual rack a per card, or aggregate only identical model/BOM, complete lifecycle scope and identical provider-vector version; unequal rack models or vectors require separate atomic cards. For each asset ledger, interval e_a_g = sum_i((occupied_kg_a_g_i+reserved_unused_kg_a_g_i)*duration_h_i), with occupied and unused reservations disjoint and all rated usable capacity assigned to actual beneficiaries even idle/closed. L_a_v is evidenced expected total lifetime exposure in the same kg*h and must be at least accumulated all-beneficiary exposure; unknown/zero L blocks. f_a_g_v = e_a_g/L_a_v; R = sum_a f_a_g_v only within the identical group. At retirement H_a = sum_g e_a_g_actual, f_a_g_final = e_a_g_actual/H_a; residual r_a = 1-sum_g f_a_g_old; delta_a_g = f_a_g_final-f_a_g_old, with sum_g delta_a_g=r_a and sum_g f_a_g_final=1. Replace every prior beneficiary record by new numerator f_a_g_new*V_a_new, recording delta vector f_new*V_new-f_old*V_old, never adding a second whole asset. Actual dated repair/replacement and terminal dispatch update the complete package vector V_a_new and replace modeled events of the same scope; recalculate all history, including retired/zero-output beneficiaries. Different resulting provider vectors remain separate cards. End-of-life transport/carrier and maintenance already inside V are not separate foreground exchanges."
      inputs:
        - asset_id
        - model
        - BOM
        - provider_vector_version
        - occupied_kg_a_g_i
        - reserved_unused_kg_a_g_i
        - duration_h_i
        - e_a_g
        - L_a_v
        - H_a
        - f_a_g_old
        - f_a_g_final
        - V_a_old
        - V_a_new
        - repair_event
        - retirement_dispatch
        - all_beneficiaries
        - previous_allocations
      output: "R; delta_a_g; revised_asset_numerators"
      source_ids:
        - jrc-retail-2013
    - id: complete_modules
      applies_to: "glass_service"
      rule: "For each identical exchange identity/property/unit j, restore support module raw numerator u_j_m = normalized_j_m*original_denominator_m and attribute once under support_drivers. Complete retail-service numerator T_j = core_numerator_j+sum_m u_j_m, including core F/AC/paper/rack and disjoint support; complete_retail_j = T_j/Q. B_S is excluded from BOTH partial and complete retail-service. Only a separately declared downstream GOODS system uses goods_system_j = (T_j+original_goods_vector_S_j)/Q. original_goods_vector_S_j is the original receiving-gate vector weighted by B_S; inbound goods freight is already in that vector. Never add S to retail or twice to a downstream system. Compare actual physical source/event/asset, process interval, constituents and lifecycle-stage coverage for every module pair even when IDs differ. Remove proven overlapping subvector once with signed coverage/quantity map; differing IDs do not establish disjointness. Unknown nonseparable overlap blocks assembly. Preserve original source IDs, raw denominator/pool/version; never sum unlike units or add F twice. Omitted asset/repair transport under support_transport enters the historical pool g already assigned by the SAME asset lifetime ledger, using that pool revised Q_g; correction deltas replace that original pool version, not the current pool. Already lifetime-attributed transport and V-contained transport receive no second lifetime multiplier or duplicate module."
      inputs:
        - normalized_j_m
        - original_denominator_m
        - source_id
        - core_numerator_j
        - B_F
        - B_S
        - original_goods_vector_S_j
        - allocation_driver
        - module_version
        - coverage_overlap_map
        - Q
        - original_pool_id
        - original_pool_version
        - Q_g
        - prior_transport_attribution
      output: "complete_retail_j; goods_system_j"
      source_ids:
        - jrc-retail-2013
    - id: paper_balance
      applies_to: "kraft_interleaf"
      rule: "P_open and P_close contain ONLY never-issued unused retailer-added paper source stock. P_first = P_open+P_received-P_close-P_unused_transfer, with independently measured unused returns/transfers P_unused_transfer; charge its manufacturing and supply transport once at first issue: P_used = P_first. Already-used opening stock U_open is not P_open. U_close = U_open+P_first+U_received-P_customer-P_waste-U_transfer-confirmed_missing_paper+unresolved_paper_delta; all destinations disjoint, reuse within custody is internal and cancels. Each used-paper source retains its signed first-issue manufacturing owner across pools; later reuse adds only actual new handling burden, never repeats manufacturing or avoided-production credit. Custody transfer includes source/first-charge receipt, and actual terminal treatment belongs to its dispatching pool or signed customer owner. Unused transfer keeps original background with the continuing owner, not first-use input. Unknown residual blocks completion. Divide final corresponding row numerators by Q once."
      inputs:
        - P_open
        - P_received
        - P_close
        - P_unused_transfer
        - P_first
        - U_open
        - U_received
        - U_close
        - P_customer
        - P_waste
        - U_transfer
        - confirmed_missing_paper
        - unresolved_paper_delta
        - first_issue_owner
        - first_charge_receipt
        - source_id
        - Q
      output: "P_used/Q; P_customer/Q; P_waste/Q; U_close"
      source_ids:
        - jrc-retail-2013
    - id: support_transport
      applies_to: "glass_service"
      rule: "Use one mutually exclusive provider mode per actual trip/segment: (A) take an already-attributed complete consignment transport amount with proof it covers actual loaded, empty-return and stationary idle portions; do not multiply another allocation fraction. (B) collect loaded activity under the exclusive target_consignment or unassigned_vehicle modes defined below; reserved payload-capacity*time applies only to a matching unassigned whole-vehicle source vector. For empty vehicle segments use actual vehicle*km, and for stationary engine/equipment idle use actual h and measured fuel/energy, each with its own matching provider, allocated by same-unit reserved payload-capacity*time over that segment; never zero tonne*km as empty-trip evidence. Include empty shipping-stillage return reservation. Do not sum unlike driver units or activity units. Verify payload, empty and idle provider boundaries are disjoint, or remove exact overlapping fuel/energy/source stage once; unknown provider coverage blocks completion. Goods inward freight is charged solely with original goods vectors; packaging/asset/repair and waste transports are charged once in their actual package/treatment or explicit omitted-stage module. Apply complete_modules after actual source attribution. For an omitted asset/repair transport stage, trip attribution first assigns the raw transport source numerator to actual asset_id, x_transport_a; then the SAME asset ledger assigns x_transport_a_g_v = x_transport_a_v*f_a_g_v using its existing e_a_g/L_a_v or final e_a_g_actual/H_a. Return each attributed raw numerator to its ORIGINAL beneficiary pool g and divide by that pool revised Q_g only in complete_modules; never charge an asset retirement/repair trip wholly to current Q. A transport-vector revision replaces every original-pool numerator with x_transport_a_new*f_a_g_new and books delta x_transport_a_new*f_a_g_new-x_transport_a_old*f_a_g_old back to that original pool and version, with historical denominator corrections. If transport is already inside V_a, it follows the V_a replacement and is NOT an omitted-stage addition. If a provider quantity already belongs to a historical beneficiary, retain that attribution and do not multiply f again. Retailer-added paper omitted supply transport follows its first-issue manufacturing owner and P_first quantities under paper_balance; receipt is stock evidence, not a second charge. Original packaging omitted transport follows the SAME original package/source and its signed S/F/T/O or returnable-asset lifetime ownership, with prior attributed stages preserved. No receiving-pool charge followed by a repeated consumption-pool charge. Loaded t*km has exclusive modes: target_consignment=measured target_gross_kg*segment_km/1000, with NO further shared fraction; unassigned_vehicle=whole_vehicle_gross_kg*segment_km/1000*(target_payload_kg/whole_vehicle_gross_kg), only for a compatible mass-based provider with complete same-segment actual payload reconciliation and positive denominator. A provider exact target quantity stays unchanged. Reserved payload-capacity*time allocates only an otherwise unallocated WHOLE-VEHICLE source vector or the separately measured empty/idle source, not target-consignment t*km. Different provider activity/property units need actual separate atomic cards; never rename a vehicle-km vector as target t*km. Record loaded_attribution_mode and provider_reference_basis; the loaded mode must match its actual source and provider basis."
      inputs:
        - trip_id
        - segment_id
        - provider_mode
        - provider_scope
        - measured_load_tonnes
        - actual_km
        - reserved_payload_capacity
        - duration_h
        - all_beneficiaries
        - empty_vehicle_km
        - stationary_idle_h
        - measured_fuel
        - measured_energy
        - source_stage_overlap
        - original_vector_scope
        - Q
        - asset_id
        - x_transport_a_v
        - f_a_g_v
        - e_a_g_actual
        - x_transport_a_old
        - x_transport_a_new
        - f_a_g_old
        - f_a_g_new
        - e_a_g
        - L_a_v
        - H_a
        - original_pool_id
        - original_pool_version
        - Q_g
        - prior_transport_attribution
        - first_issue_owner
        - P_first
        - original_pack_id
        - S_F_T_O_owner
      output: "attributed_transport_raw_sources"
      source_ids:
        - jrc-retail-2013
  data_quality_requirements:
    - id: quality_mass
      applies_to: "glass_service"
      requirement: "No area/nominal thickness mass surrogate; calibrated net weights and exact same-SKU continuity mandatory."
      evidence: "Traceable primary ledgers and signed boundary reconciliation"
    - id: quality_fates
      applies_to: "glass_cullet"
      requirement: "Waste treatment provider must accept actual clear-glass cullet contamination/state; weigh dispatch net and separately track container. No assumed recycling credit."
      evidence: "Traceable primary ledgers and signed boundary reconciliation"
    - id: quality_module
      applies_to: "glass_service"
      requirement: "Partial core must be labelled partial until support_completion and complete_modules are evidenced, including original packaging and fixed lighting capital."
      evidence: "Traceable primary ledgers and signed boundary reconciliation"
validation_rules:
  - rule_id: complete_identity
    applies_to: "all inventory rows"
    rule: "No completeness claim until each row has verified exact physical identity, property/unit chain, provider boundary and original quantity evidence. An absent UUID remains an identity gap. Electricity UUID specifies AC only: collect voltage, supplier/year/geography and delivery/loss boundary. No environmental factors, densities, lifetimes or loss rates are defaulted."
    source_ids:
      - jrc-retail-2013
  - rule_id: reconcile
    applies_to: "glass_service"
    rule: "Close glass goods and held-waste balances separately; reconcile responsibility partition, packaging fate, all supplier/provider boundaries, meter pools and final-valid IDs. Include outside damaged retention with actual state/recipient, not assumed waste. Confirm no double source, no area-as-mass substitution, no cutting route leakage, and complete_modules before a full-service claim. Unknowns block completeness."
    source_ids:
      - jrc-retail-2013
