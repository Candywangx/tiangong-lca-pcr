system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "glass_service"
      rule: "Admit one actual homogeneous SKU per pool: clear uncoated monolithic annealed float glass, supplier-cut rectangular stock sheets at original receiving dimensions, unchanged through sale. Record manufacturer/lot, composition declaration, measured net kg and length/width/thickness, edges, packaging and acceptance specification. Different thicknesses, sizes or treatments require separate pools. Non-specialized means evidenced mixed merchandise assortment; brand licensing is irrelevant. Other construction materials, mirrors, glass fibre, coated/toughened/laminated/insulating glass, cutting, grinding, installation and retailer delivery are outside this route."
      source_ids:
        - un-cpc30-62161
        - guardian-clear-2021
        - guardian-types-2019
    - rule_id: service_gate
      applies_to: "glass_service"
      rule: "Start at physical retailer receiving gate; end at documented customer collection and final valid acceptance of intact specified sheets. This is incremental retail service per 1 kg finally accepted glass, not glass production. The customer owns use/installation and post-handover transport. Record defects, failed pickup and acceptance revocation even without physical return. Discount/refund alone does not revoke acceptance. Repeated handovers of the same original sheet cannot create duplicate final-valid service."
      source_ids:
        - jrc-retail-2013
    - rule_id: goods_responsibility
      applies_to: "failed_original_glass"
      rule: "For each original source lot partition receiving-gate-equivalent glass kg B = B_S+B_F+B_T+B_O with unique source IDs. S finally accepted retains goods production plus inbound transport for downstream addition B_S/Q. F irrecoverably failed/lost and without continuing named owner is included as failed_original_glass B_F/Q with its original production and inbound transport vector. T transfers the SAME original vector to a signed supplier/external owner or internal use; O remains open inventory. A refund alone cannot move responsibility. Revise original pool on late returns; replace prior vectors, never add production again for resale. Only supplier_glass_transfer, external_damaged_glass and customer_kraft are non-characterized custody satellites. glass_cullet and waste_kraft are treatment-only waste outputs with actual collection/transport/treatment responsibility; never remove their treatment as satellites. None gives a new manufacture burden or avoided-production credit."
      source_ids:
        - jrc-retail-2013
    - rule_id: route_presence
      applies_to: "all inventory rows"
      rule: "Require observation and invoices proving no retailer glass cutting, wet processing, on-site combustion, refrigeration or motorized handling in this manual rack/pickup core. Unknown is not zero. Breaking during storage is included, not a cutting yield. Actual additional materials/operations need state-specific atomic cards/protocols in both languages and sync before completion; powered handling or cutting requires a separately reviewed route."
      source_ids:
        - jrc-retail-2013
    - rule_id: package_boundary
      applies_to: "glass_rack_package"
      rule: "The complete actual reusable glass A-frame rack package includes frame, pads, fasteners and initial finish, manufacturing/installation, evidenced maintenance and terminal treatment in one signed lifecycle model. Exclude operations electricity and merchandise/original shipping packaging. An evidenced complete rack is not steel kg. If package coverage cannot be demonstrated, completion is blocked until disjoint component/event modules replace it. No second rack acquisition or retirement waste exchange beside this package."
      source_ids:
        - jrc-retail-2013
    - rule_id: support_completion
      applies_to: "glass_service"
      rule: "Mandatory support modules cover building/fixed lamps and signs, checkout/IT/network and payment processing, security, store administration, cleaning/sanitation, HVAC, original shipping packaging/crates/returnable stillages, retailer-added paper supply, and all actual asset/repair/waste/empty-return transport. Prove occurrence/nonoccurrence by dated site walkthrough, contracts, meters, invoices, equipment ledger and consignment records; missing evidence is not zero. Core lighting and rack package are specifically isolated; include remaining actual support under support_drivers, support_transport, cp_modules and complete_modules. Goods inward freight is already in original S/F/T/O vector; it is not a second support trip. Original supplier packaging production and terminal fates are kept outside the original glass-only vector and inside retail support; if supplier vector contains packaging, expose and remove that exact subvector once before its separate module. Complete supplier-pack package and constituent-BOM modes are mutually exclusive per original package; all body/interleaf/pads/straps/crate constituents and disposal/return coverage must match actual source. Store rack and shipping stillage are different assets. No full retail-service claim until actual module-specific atomic cards/protocols and bilingual projection are supplied for every present support exchange; these fixed methods do not make uncollected modules complete."
      source_ids:
        - jrc-retail-2013
