allocation_rules:
  - rule_id: a_pool
    applies_to: "all inventory rows"
    rule: "Prospectively declare one same-configuration site pool and observation/return policy; retain every refused, failed, idle, closed and zero-sale interval in that pool. Q=0 leaves measured raw numerators and original responsibility intact and is unnormalizable; never delete it or borrow a successful SKU denominator. Late evidence replaces old versions across all affected pools; a historical burden cannot remain charged to its old pool and be charged again to a new one. No revenue or silver-price allocation is admitted."
    source_ids:
      - ghg-product-2011
  - rule_id: a_electric
    applies_to: "cabinet_electricity"
    rule: "Prefer direct cabinet circuit subdivision. If the cabinet serves multiple configurations, attribute each measured cabinet interval kWh by reserved usable shelf area m2 times actual reservation hours for ALL beneficiaries. Include empty reserved slots, closed/idle periods and unused cabinet area as an operator beneficiary; allocate that operator residual across all store service pools by store reserved area m2*h in the SAME interval. All weights have identical units and sum to one. Never sum task counts and area-time. Parent store residual subtracts cabinet submeter only if topology proves inclusion; independent disjoint meters are added without subtraction."
    source_ids:
      - ghg-product-2011
  - rule_id: a_asset
    applies_to: "cabinet_manufacture; cabinet_retirement"
    rule: "Maintain one persistent cabinet asset ledger for every historical period/beneficiary. e_ap is reserved shelf area m2*h attributed by a_electric (including redistributed operator area-time); L_a is expected lifetime usable shelf area m2*h from measured area, calendar lifetime and reservation plan. Manufacture share f_ap=e_ap/L_a, cumulative shares <=1. At a changed lifetime/BOM, REPLACE every prior beneficiary share and post differences against the same source version, never restart manufacture. At actual retirement use actual lifetime exposure as L_a and reconcile all beneficiary shares to one, allocating final unused time by the same operator rule. Retirement quantity is measured whole carrier kg times this final responsibility f_ap ONCE, never times another manufacture fraction. Terminal carrier occurs once; provider-contained treatment cannot be duplicated."
    source_ids:
      - ghg-product-2011
  - rule_id: a_support
    applies_to: "counter"
    rule: "M_shop uses measured all-beneficiary interval residual electricity and allocates by reserved store floor area m2*h including stock, refused and closed-time reservations; unused operator area is redistributed across all actual service pools by their positive same-interval reserved area-time. M_clean subdivides measured cleaning batches then uses cleaned area m2 of all benefited zones; common zones use the same store-area-time weights. M_pay splits measured active operation, idle, and network source-numerator pools first: active energy by measured device-active seconds, idle energy by reserved terminal hours, network energy by actual transferred bytes; each pool has its own same-unit all-beneficiary denominator including failures. Reconcile numerator pools to parent meters before allocation. M_build uses each complete asset actual reserved area-time e/L, with all-history replacement/final residual rules of a_asset; device assets use reserved h/h lifetime, never m2*h divided by h. M_repair uses actual event material/service quantities assigned by repair cause then the same beneficiary exposure fractions; no assumed annual rates. M_treat links each actual carrier kg to a provider covering only its evidenced transport/treatment boundary once."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
  - rule_id: a_transport
    applies_to: "counter"
    rule: "For each actual segment s of post-receipt logistics, obtain actual consumed fuel/energy and provider full segment lifecycle transport service including empty/idle travel. Its verified source boundary must include actual vehicle manufacture/installation, actual maintenance/replacements, vehicle end-of-life and operation fuel/energy plus its upstream supply, each source once; a fuel-only provider is incomplete. Actual measured fuel is QA rather than another characterized input when already included in the provider. Disjoint lifecycle sources may be assembled only with exact source-boundary overlap removal before applying the segment weight. Allocate raw segment numerator X_s to beneficiary j using w_js = reserved payload kg_js * actual reserved h_js divided by the sum of reserved payload kg_bs * actual reserved h_bs across ALL beneficiaries b in that SAME segment. Empty unused payload reservation is the operator beneficiary and is redistributed over all actual service pools by their positive same-segment reserved kg*h; a wholly empty segment remains operator raw responsibility until a documented causative service pool is attached, never zero t*km. Store distance and idle hours separately for QA. A provider already attributed to this consignment is used directly; its segment allocation is QA only and is not multiplied again. Original supplier-to-store inbound embedded in U_i is excluded here for S/F/O/T. Return/supplier/waste legs are new actual segments, counted once; verify provider includes empty route or add measured vehicle-km activity with overlap removed."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "counter"
      flow_role: "physical custody and service states"
      record_type: "event ledger"
      raw_fields: "original_id; SKU; size; packaging_revision; pool_id; event_id; actual_date; supplier; recipient; physical_state; opening_goods; opening_held_waste; N_new_receipt; N_customer_return; N_customer_handover; acceptance_state; acceptance_qualification; revocation_id; financial_only; N_supplier_handoff; N_successor_handoff; N_confirmed_missing; N_dispatch_originals; closing_goods; closing_held_waste; observation_cutoff; prior_version; S; F; O; T; Q"
      collection_method: "Barcode/tag each complete original packet; count signed physical events at receiving, cabinet, counter and actual recipients. Reconcile daily counts to POS/return/investigation records independently of payment. Inspect SKU/size/package and non-specialized channel evidence; no scanner event without physical/acceptance evidence. Retain no-sale/closed periods and investigate missing originals. Actual tampering/opening blocks the intact-card route. per reference flow; derive disjoint gross custody counts and final-state distinct Q separately using calc_custody and calc_service; no second revocation subtraction"
      unit: "Item(s); date"
      frequency: "Each event; daily reconciliation"
      temporal_coverage: "Full prospectively declared pool plus linked late events"
      site_scope: "Same site/counter/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed events; physical stock audits; return/recipient records; version reconciliation"
    - protocol_id: cp_source
      process_id: "counter"
      flow_role: "complete original background"
      record_type: "supplier source ledger"
      raw_fields: "original_id; U_i_source_id; U_i_version; supplier_lot; ring_alloy_certificate; actual_mass_kg; plating; solder; package_revision; complete_component_BOM; origin_gate; original_inbound_segment_id; original_inbound_included; N_received; N_S; N_F; N_O; N_T; background_owner; fate; recipient; original_denominator; source_boundary"
      collection_method: "Obtain signed supplier complete packet inventory and original inbound segment service; inspect mass/BOM against actual lot and package. Website is specification only. Link each original ID and partition S/F/O/T; reconcile source inventories, units and original receiving gate. Missing quantified complete background or recipient is unresolved, not zero. per reference flow; calc_ownership; N_F/Q receives complete U_i once; S/O/T retain original source responsibility outside this incremental service"
      unit: "Item(s); kg"
      frequency: "Each lot and fate change"
      temporal_coverage: "All originals including opening sources and late revisions"
      site_scope: "Supplier to same store gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier signed BOM/inventory; package photos; alloy evidence; freight boundary; identity bindings"
    - protocol_id: cp_energy
      process_id: "counter"
      flow_role: "cabinet electricity"
      record_type: "interval meter"
      raw_fields: "meter_id; topology; parent_includes_submeter; interval_start; interval_end; opening_kWh; closing_kWh; E_counter_kWh; shelf_area_m2; reserved_h; all_beneficiaries; operator_unused_m2h; store_reserved_m2h; closed_idle_failure; provider; geography; voltage; line_loss_boundary; calibration; uncertainty"
      collection_method: "Read calibrated circuit meter each interval; audit wiring and compare measured parent/child boundaries; integrate every closed/idle/failure interval. Measure shelf geometry and actual reservation histories for all beneficiaries. Apply a_electric once; store independent-meter sums separately. Resolve provider/voltage supply before complete use. per reference flow; calc_electricity converts attributed E_counter_kWh to MJ then divides Q once"
      unit: "kWh; m2*h"
      frequency: "Each interval over entire pool"
      temporal_coverage: "All measured study intervals"
      site_scope: "Actual cabinet and all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; raw reads; topology; reservation and full reconciliation"
    - protocol_id: cp_asset
      process_id: "counter"
      flow_role: "cabinet lifetime manufacture"
      record_type: "persistent asset ledger"
      raw_fields: "asset_id; model; complete_BOM; installed_count; provider_source_id; provider_boundary; install_date; shelf_area_m2; reservation_calendar; e_ap; L_a; f_ap; all_prior_beneficiaries; original_source_version; lifetime_revision; replacement_allocation_version; operator_residual; repair_event_ids; retirement_date"
      collection_method: "Inspect actual complete wired cabinet and provider signed manufacture/installation boundary; measure usable shelf area and preserve every beneficiary reservation period. Establish evidenced expected lifetime calendar, not a default. Recompute all historical versions after revisions and actual retirement under a_asset. Acquire/stock ledger validates installed count only. per reference flow; calc_asset; current e_ap/L_a is manufacturing unit share; historical updates replace old allocations"
      unit: "Item(s); m2*h"
      frequency: "Each reservation period, revision and retirement"
      temporal_coverage: "Full asset life and all previous periods"
      site_scope: "Actual complete cabinet; all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Provider signed BOM/boundary; dimension measurements; calendar; all-history corrections"
    - protocol_id: cp_terminal
      process_id: "retirement"
      flow_role: "cabinet terminal carrier"
      record_type: "actual retirement consignment"
      raw_fields: "asset_id; retirement_event_id; carrier_state; direct_or_BOM_mode; gross_kg; tare_kg; measured_removed_component_kg; m_cabinet_terminal_kg; moisture_state; final_L_a; final_e_ap; f_ap; dispatch_date; receiver; treatment_source_id; transport_included; provider_overlap; calibration"
      collection_method: "At actual retirement weigh the complete remaining dry cabinet net on calibrated scale OR reconstruct from actual weighed retained components; retain mutually exclusive mode. Do not deduct removed parts again from direct net weights. Record receiver/provider transport and treatment; if live, retain asset register and no-retirement evidence. Use final all-history responsibility from cp_asset once. per reference flow; calc_asset_terminal; actual whole carrier kg multiplied by final f_ap once then divided Q"
      unit: "kg; m2*h"
      frequency: "Each actual retirement"
      temporal_coverage: "Full actual lifetime and terminal event"
      site_scope: "Same cabinet asset"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; weighing; removed-parts partition; receipt; complete provider scope"
    - protocol_id: cp_dispatch
      process_id: "counter"
      flow_role: "discarded complete ring packet"
      record_type: "actual waste consignment"
      raw_fields: "original_id; source_id; condemnation_date; opening_held_waste; closing_held_waste; dispatch_id; actual_date; complete_packet_state; gross_kg; tare_kg; m_packet_dispatch_kg; N_dispatch_originals; dry_state; receiver; whole_package_sorting_contract; treatment_boundary; transport_boundary; calibration"
      collection_method: "Net weigh actual complete dry packet consignment at dispatch with calibrated scale; reconcile individual original IDs and whole-package receiver contract. Held-waste opening plus condemnation minus closing independently checks dispatch count/mass; never alter measured dispatch by subtracting closing again. Separate added outside containers/tare. Missing parcels are investigated, not fictitious dispatch. per reference flow; calc_dispatch; actual net consignment kg/Q; source count links F once"
      unit: "kg; Item(s)"
      frequency: "Each consignment and period stocktake"
      temporal_coverage: "All dispatches and held stock"
      site_scope: "Same counter and named receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; consignment weights; receiver record; stock/source reconciliation"
    - protocol_id: cp_completion
      process_id: "counter"
      flow_role: "all mandatory support modules"
      record_type: "source and allocation ledger"
      raw_fields: "module_id; atomic_row_id; flow_identity; property; unit; state; direction; source_id; source_version; event_id; original_boundary; y_mr; D_m; X_mr; original_pool; current_pool; compatible_version; overlap_portion; raw_numerator; active_energy; idle_energy; network_energy; active_seconds; reserved_h; bytes; cleaned_m2; store_m2h; e_asset; L_asset; repairs; water_volume; water_density; formulation_kg; source_fraction_s; source_fraction_c; input_component_c_kg; species_raw_s_kg; blank_s_kg; species_corrected_s_kg; origin_ratio_c_s; component_origin_c_kg; molecular_weight_s; stoichiometry; exterior_port_id; interval_t; interval_h_t; flux_mode; J_out_st; J_in_st; J_blank_st; J_diff_st; J_corr_st; J_net_st; source_attribution_mode; J_source_st; source_origin_fraction_st; J_attributed_st; exterior_species_kg; internal_generation_kg; internal_uptake_kg; condensate_kg; exterior_inlet_kg; exterior_outlet_kg; air_stock_change_kg; capture_stock_change_kg; capture_export_kg; blank_mode; retained_origin_kg; dispatched_origin_kg; wet_carrier_kg; residue_closing_kg; residue_dispatched_kg; absence_evidence; fuel_refrigerant_gate; Q"
      collection_method: "Inspect every named M_shop/M_clean/M_pay/M_build/M_repair/M_freight/M_treat source with actual meter/BOM/event/recipient boundaries. Keep original raw denominators and source-version/event overlap map; apply b_clean/a_support/a_transport exactly. For cleaning verify original formulation source mass destinations against actual whole wet carriers, density and blank mode; unknown mass/species/stock remains unresolved. Verify all-electric/no-fuel/no-refrigerant gate using complete landlord/plant records. New actual module exchanges get atomic bilingual cards/protocols before complete use. per reference flow; calc_completion; restore raw numerator, remove exact overlaps, attribute fixed drivers, sum compatible quantities only, divide Q once"
      unit: "original row unit; m2*h; m2; h; seconds; bytes; kg"
      frequency: "Each source, interval and revision"
      temporal_coverage: "Whole pool plus all affected historical versions"
      site_scope: "All shop/landlord/provider beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Source originals; actual parent reconciliation; zero/absence evidence; signed completion audit"
    - protocol_id: cp_freight
      process_id: "counter"
      flow_role: "actual post-receipt logistics"
      record_type: "segment provider ledger"
      raw_fields: "segment_s; trip_id; beneficiary_j; actual_fuel_energy_X_s; provider_boundary; vehicle_model; vehicle_manufacture_install_source; vehicle_maintenance_source; vehicle_terminal_source; operation_upstream_source; lifecycle_source_overlap; provider_already_attributed; consignment_source_id; reserved_payload_kg_js; actual_reserved_h_js; all_beneficiary_kg_h; operator_unused_kg_h; empty_distance_km; idle_h; actual_vehicle_km; positive_causative_pool; original_inbound_source_id; overlap_removed; attributed_quantity; Q"
      collection_method: "Read actual route/time/payload reservations, fuel/energy and provider signed service for the same segment and all beneficiaries; use kg*h capacity allocation only where raw shared numerator remains. Already-attributed provider quantities retain their attribution; segment fields are QA. Verify empty-route coverage and actual idle duration, remove overlap with original inbound and treatment transport. Whole empty/zero-driver routes remain raw unresolved responsibility until causative allocation is evidenced. per reference flow; calc_transport; attributed actual original service numerator divided Q once; no extra factor for already-attributed providers"
      unit: "provider original unit; kg*h; km; h"
      frequency: "Each segment and revision"
      temporal_coverage: "All actual post-receipt logistics"
      site_scope: "Same segment/all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Route logs; reservation evidence; fuel records; provider/empty/idle scope; source deduplication"
  calculation_rules:
    - id: calc_service
      applies_to: "retail_service"
      rule: "Q = count distinct original IDs in final-valid acceptance state; reference output = Q/Q = 1 Item(s), only Q>0. Use b_acceptance and replace late versions."
      inputs:
        - Q
        - cp_custody
      output: "1 Item(s)"
      source_ids:
        - ghg-product-2011
    - id: calc_custody
      applies_to: "packet_receipt; packet_customer_return; packet_customer_handover; packet_supplier_return; packet_successor"
      rule: "For each named physical satellite, normalized amount = its disjoint gross physical event count / Q. Apply b_physical total-custody equation as independent QA; never use corrected Q as gross custody exits."
      inputs:
        - N_new_receipt
        - N_customer_return
        - N_customer_handover
        - N_supplier_handoff
        - N_successor_handoff
        - Q
        - cp_custody
      output: "satellite Item(s) per reference flow"
      source_ids: []
    - id: calc_ownership
      applies_to: "failed_original_packet"
      rule: "N_F = count distinct F original IDs; failed original amount = N_F/Q Item(s). Attach each exact U_i once; conserve N_received=N_S+N_F+N_O+N_T."
      inputs:
        - N_received
        - N_S
        - N_F
        - N_O
        - N_T
        - U_i_source_id
        - U_i_version
        - Q
        - cp_source
      output: "failed complete packets per reference flow"
      source_ids: []
    - id: calc_electricity
      applies_to: "cabinet_electricity"
      rule: "E_counter_kWh = sum attributed measured interval kWh using a_electric; final electricity = 3.6*E_counter_kWh/Q MJ. The 3.6 converts kWh to MJ, not an emission factor."
      inputs:
        - E_counter_kWh
        - shelf_area_m2
        - reserved_h
        - operator_unused_m2h
        - store_reserved_m2h
        - Q
        - cp_energy
      output: "MJ per reference flow"
      source_ids: []
    - id: calc_asset
      applies_to: "cabinet_manufacture"
      rule: "f_ap=e_ap/L_a under a_asset; manufacturing amount=f_ap/Q Item(s). Expected lifetime revisions replace every old historical fraction; terminal L_a is actual full-life exposure."
      inputs:
        - e_ap
        - L_a
        - f_ap
        - original_source_version
        - replacement_allocation_version
        - Q
        - cp_asset
      output: "complete installed cabinet units per reference flow"
      source_ids: []
    - id: calc_asset_terminal
      applies_to: "cabinet_retirement"
      rule: "Final carrier amount = m_cabinet_terminal_kg*f_ap/Q kg; f_ap is the final all-history lifetime responsibility under a_asset, applied once. Direct whole net weighing and component reconstruction are exclusive."
      inputs:
        - m_cabinet_terminal_kg
        - f_ap
        - final_L_a
        - final_e_ap
        - Q
        - cp_terminal
      output: "kg per reference flow"
      source_ids: []
    - id: calc_dispatch
      applies_to: "packet_waste"
      rule: "Final discarded packet carrier = m_packet_dispatch_kg/Q kg; actual net dispatch is gross minus actual tare. Opening/condemnation/closing stock checks are independent, not additional dispatch corrections."
      inputs:
        - m_packet_dispatch_kg
        - N_dispatch_originals
        - Q
        - cp_dispatch
      output: "kg per reference flow"
      source_ids: []
    - id: calc_completion
      applies_to: "counter"
      rule: "For each module row r restore X_mr=y_mr*D_m (or retain evidenced raw X_mr), remove exact source/version/event/boundary overlap once, attribute by a_support/a_transport, then final compatible exchange = (core raw numerator + sum attributed compatible X_mr)/Q. Preserve each row unit/direction/state/provider boundary; do not combine incompatible exchanges. M_clean applies b_clean and b_clean_species: input_component_c_kg=formulation_kg*source_fraction_c; exterior_species_kg=sum J_attributed_st*interval_h_t using exactly one absolute/raw-differential/already-corrected mode and one source-resolved/source-fraction mode; component_origin_c_kg=exterior_species_kg*origin_ratio_c_s with actual molecular weights/stoichiometry excludes externally added atoms. Independent complete air/capture control-volume checks never re-subtract stocks or capture from measured exterior flux; direct wet carrier kg stays separate."
      inputs:
        - X_mr
        - y_mr
        - D_m
        - overlap_portion
        - raw_numerator
        - active_energy
        - idle_energy
        - network_energy
        - active_seconds
        - reserved_h
        - bytes
        - cleaned_m2
        - store_m2h
        - e_asset
        - L_asset
        - water_volume
        - water_density
        - formulation_kg
        - source_fraction_s
        - source_fraction_c
        - input_component_c_kg
        - species_raw_s_kg
        - blank_s_kg
        - species_corrected_s_kg
        - origin_ratio_c_s
        - component_origin_c_kg
        - molecular_weight_s
        - stoichiometry
        - exterior_port_id
        - interval_t
        - interval_h_t
        - flux_mode
        - J_out_st
        - J_in_st
        - J_blank_st
        - J_diff_st
        - J_corr_st
        - J_net_st
        - source_attribution_mode
        - J_source_st
        - source_origin_fraction_st
        - J_attributed_st
        - exterior_species_kg
        - internal_generation_kg
        - internal_uptake_kg
        - condensate_kg
        - exterior_inlet_kg
        - exterior_outlet_kg
        - air_stock_change_kg
        - capture_stock_change_kg
        - capture_export_kg
        - retained_origin_kg
        - dispatched_origin_kg
        - wet_carrier_kg
        - residue_closing_kg
        - residue_dispatched_kg
        - Q
        - cp_completion
      output: "completed row-specific normalized amount"
      source_ids: []
    - id: calc_transport
      applies_to: "counter"
      rule: "Raw shared segment mode: w_js=reserved_payload_kg_js*actual_reserved_h_js/sum all beneficiary reserved kg*h in same segment; attributed X_js=X_s*w_js with operator empty/unused handling in a_transport. Already-attributed-provider mode: keep actual provider consignment amount; w_js is QA only. Divide attributed original service quantity by Q once. Modes are exclusive."
      inputs:
        - actual_fuel_energy_X_s
        - vehicle_manufacture_install_source
        - vehicle_maintenance_source
        - vehicle_terminal_source
        - operation_upstream_source
        - lifecycle_source_overlap
        - reserved_payload_kg_js
        - actual_reserved_h_js
        - all_beneficiary_kg_h
        - operator_unused_kg_h
        - provider_already_attributed
        - positive_causative_pool
        - actual_vehicle_km
        - idle_h
        - Q
        - cp_freight
      output: "provider original unit per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_trace
      applies_to: "all inventory rows"
      requirement: "Retain original evidence, calibration/uncertainty, actual date/site/lot, exact source versions and every source-ID/overlap decision; source hash does not prove scientific applicability."
      evidence: "Originals and audit ledger"
    - id: dq_service
      applies_to: "retail_service"
      requirement: "Keep final service count separate from merchandise mass, price, physical stock and gross transaction count; do not infer actual qualifying acceptance from payment alone."
      evidence: "Original-ID physical and final-state ledgers"
    - id: dq_partial
      applies_to: "counter"
      requirement: "Disclose unquantified modules and all identity gaps; partial incremental results cannot be presented as complete retail business, whole-leaf coverage, full LCA, or conformity to the complete GHG Product Standard."
      evidence: "Signed scope/completion and gate audit"
    - id: dq_background
      applies_to: "failed_original_packet"
      requirement: "Actual lot and complete package U_i must be quantified; specification text, silver price, assumed purity, catalogue tare or an unrelated silver/kg dataset cannot replace it."
      evidence: "Supplier inventory/BOM and original inbound service"
    - id: dq_support
      applies_to: "counter"
      requirement: "For every conditional module collect presence/absence over the whole pool and all landlord beneficiaries. Zero-driver and unknown fuel/refrigerant, moisture/density, source fraction or recipient block completeness; no invented numeric tolerances or uncertainty-free defaults."
      evidence: "Registers; measurements; reconciliations; named provider records"
validation_rules:
  - rule_id: v_scope
    applies_to: "counter"
    rule: "Require actual channel gate b_scope, same SKU/size/state/package revision and supported source gates. No whole-leaf, brand-store, gemstone, clock, part, other size or altered-package substitution."
    source_ids:
      - un-cpc-62154
      - tiffany-ring-spec
  - rule_id: v_ledgers
    applies_to: "counter"
    rule: "Reconcile each original-ID history, total-custody equation, final-valid Q, S/F/O/T partition and actual event-date revisions independently. Refusal, no-return acceptance revocation, physical return, financial-only refund, resale, supplier return, missing packet and condemnation must each have explicit test cases in the production ledger. A missing final recipient/state is unresolved, never automatic waste."
    source_ids: []
  - rule_id: v_source
    applies_to: "failed_original_packet"
    rule: "Require quantified U_i with exact supplier model/lot/pack BOM and original inbound boundary per original ID. failed_original_packet must carry every N_F original once. One intact packet transfers one complete original vector; never divide its environmental vector using arbitrary silver mass or box count fractions. F descendants do not each inherit U_i. S/O/T vectors must remain with their named downstream owners."
    source_ids: []
  - rule_id: v_complete_package
    applies_to: "cabinet_manufacture; cabinet_retirement; packet_waste"
    rule: "Verify complete package/provider boundaries, actual dry net whole-carrier kg, disjoint removed components, provider transport/treatment overlap and no duplicate manufacture. Direct dispatch weights are not corrected again using opening/closing stock."
    source_ids: []
  - rule_id: v_lifetime
    applies_to: "cabinet_manufacture; cabinet_retirement"
    rule: "Recompute e/L from actual dimensions/time for all historical beneficiaries, sum shares <=1 and exactly one at actual terminal reconciliation. Lifetime revisions replace every affected prior version. Terminal f appears once; stock acquisition is QA, not another full-unit input."
    source_ids: []
  - rule_id: v_measurement
    applies_to: "all inventory rows"
    rule: "Every final row basis.kind is reference_flow and its actual numerator is divided by the same Q once; intermediate raw totals remain in protocols. Required property/unit rules apply only to their named rows. Keep MJ, Item(s), kg, m2*h, h and kg*h distinct; no currency-to-silver or count-to-kg default. Q=0 fails normalized output with raw evidence retained."
    source_ids: []
  - rule_id: v_completion
    applies_to: "counter"
    rule: "A complete result requires all named modules in b_completion, b_support_gate passed, atomically named rows/protocols and identity/provider bindings before sync. cp_completion restores each normalized external result y_mr to its evidenced original numerator X_mr=y_mr*D_m, removes only exact duplicate source ID/version/event/boundary portions, attributes by fixed a_support/a_transport, sums only matching flow identity/property/unit/state/direction/source-boundary quantities with core raw numerators, then divides once by common Q. Unknown D_m, incompatible pool/version, missing fuel/refrigerant absence, zero shared driver, or unquantified module blocks completeness. Preserve partial status otherwise; never add normalized external rows directly to raw rows or sum kg with MJ."
    source_ids: []
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Unbound rows remain specific candidates. Before a complete foreground dataset bind original direct-read flow/property/unit records and matched integrity receipts, confirm observed public state, official bilingual names, type, qualifiers and provider/treatment boundary. Historical identity observations do not prove current availability or provider performance. No invented UUID, range or numerical default."
    source_ids: []
  - rule_id: v_additional
    applies_to: "counter"
    rule: "Actual additional exchanges, altered merchandise/pack state, cleaning compounds, repair materials or direct emissions require named atomic cards, correct direction/type/state/property/unit, collection and calculation fields in BOTH languages and fresh sync before completeness. Unknown presence is not not_applicable. Preserve uncertainty/calibration and investigate negative/residual balances rather than zero-clamping."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Specified partial incremental service, completed only by this fixed protocol"
  allowed_use: "Same configuration and evidenced non-specialized channel; incremental comparison with same boundary; complete result only after v_completion"
  excluded_use: "Whole jewellery/watch retail, original ring footprint alone, brand-store claims, consumer stages or complete standard conformity"
  required_metadata: "All qualifiers, source IDs/versions/gates, Q and raw totals, S/F/O/T owners, provider boundaries, remaining modules and lifetime correction history"
  required_quality_disclosure: "Partial/complete state, measured coverage, unverified identities, missing/zero drivers, uncertainty and no-sale raw pools"
  update_trigger: "Actual SKU/pack/channel/route/provider change, late acceptance reversal, source revision, asset lifetime/retirement, new support activity"
data_sources:
  - id: "un-cpc-62154"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 code62154, explanatory note: https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62154"
    used_for: "Classification scope includes groups382 and484; no whole-leaf equivalence"
  - id: "tiffany-ring-spec"
    type: "standard"
