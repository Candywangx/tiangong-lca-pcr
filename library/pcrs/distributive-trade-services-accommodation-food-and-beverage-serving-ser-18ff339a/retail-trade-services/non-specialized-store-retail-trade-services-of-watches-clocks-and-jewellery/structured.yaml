system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_scope
      applies_to: "all inventory rows"
      rule: "Admit documented non-specialized mixed-assortment stores, not specialist jewellery/brand boutiques. The product family is original closed-box sterling-silver band rings without gemstones or personalization; different brands and ring sizes are eligible in separate homogeneous pools. Verify actual lot, size, alloy purity, plating, solder and every box/pouch/liner/label/adhesive component. A sterling-silver name does not establish a complete Ag925 recipe or packaging BOM. Retained official commercial examples establish real products, not quantitative LCI or class-wide defaults."
      source_ids:
        - un-cpc-62154
        - tiffany-ring-spec
    - rule_id: b_gates
      applies_to: "counter"
      rule: "Start at the store receiving gate with counted individually identified complete packets; end at the final-valid customer counter acceptance for that original ID. No retailer opening, try-on, polishing, tarnish removal, resizing, engraving, battery operation, added bag or new gift wrap is admitted. Incoming transport packaging removal is outside this incremental counter but mandatory in completion. Record intactness and packaging revision on every movement; a damaged/opened configuration requires concrete state-specific cards and bilingual sync before completeness. Customer travel/use/end-of-life are excluded; no delivery-to-home service output is claimed."
      source_ids:
        - tiffany-ring-spec
    - rule_id: b_acceptance
      applies_to: "retail_service"
      rule: "cp_custody keeps gross physical movements and a separate acceptance-state history. Q is the count of distinct original packet IDs with one final-valid qualified counter handover at the stated observation cutoff. Refused/unaccepted handovers, revoked acceptance without physical return, internal transfers, missing packets and open stock do not enter Q. A financial refund/discount with still-valid acceptance does not remove Q. Physical return alone does not prove revocation. Repeated sale/return/resale before cutoff retains the same original ID and at most one final-valid service. Late revocation replaces the original pool denominator AND all its attributed numerators/fates, with actual event dates and version links; never subtract revocations again from an already final-state count."
      source_ids:
        - ghg-product-2011
    - rule_id: b_ownership
      applies_to: "failed_original_packet"
      rule: "At the SAME store receiving gate bind each original packet to one complete supplier vector U_i including ring plus evidenced complete original packaging and original supplier-to-store inbound transport exactly once. Partition original IDs into disjoint S (final-valid accepted), F (irrecoverable retail failure, discarded, genuinely lost or externally retained without acceptance), O (open stock) and T (named supplier/internal successor retaining the original background). N_received = N_S + N_F + N_O + N_T for the declared receipt cohort, including opening-stock source IDs. failed_original_packet is an actual characterized Product input N_F/Q of that complete receiving-gate packet, linking each F source once; it is not a custody satellite. Original production for S/O/T is outside this incremental service and stays with named merchandise/successor ledgers. Supplier return does not erase U_i; resale uses the same U_i. F recipients, physical condition and treatment/continuing responsibility must be known; lost is an investigation status, not an air emission or automatic waste dispatch."
      source_ids:
        - ghg-product-2011
    - rule_id: b_physical
      applies_to: "counter"
      rule: "Use TOTAL-CUSTODY counts (goods plus held waste): opening + new receipts + physical customer returns = closing + all gross customer handovers + supplier handoffs + internal successor handoffs + confirmed missing originals + actual waste dispatch. All gross handovers include both accepted and never-accepted events once; a later no-movement revocation reclassifies an existing event, never adds a second exit. Condemnation is an internal goods-to-held-waste state change and does not exit total custody; waste dispatch exits later. Opening/closing held waste and measured original-packet masses independently reconcile dispatch tickets. Named physical satellite cards are non-characterized custody transfers only; do not attach a second manufacturing dataset or transport to them. F background and treatment inputs remain characterized."
      source_ids: []
    - rule_id: b_core
      applies_to: "counter"
      rule: "This is a PARTIAL incremental secure-counter service: core includes separately metered cabinet electricity, the complete model-specific cabinet manufacturing/installation lifetime portion, cabinet retirement carrier, F original-packet background and actual complete discarded-packet dispatch. Core excludes common shop operation, cleaning, payment/receipt infrastructure, common building/fixed fixtures, shared security, maintenance/replacements and post-receipt freight. These remain mandatory completion modules b_completion through a_transport, never zero or assumed included. Counter electricity covers all wired LED/lock loads and idle/closed/failed periods; meter topology must distinguish included parent submeter from disjoint meters. The electricity flow specifies no provider/voltage; supply geography, voltage, losses and contract source require separate actual evidence."
      source_ids:
        - jrc-retail-2013
    - rule_id: b_asset
      applies_to: "cabinet_manufacture; cabinet_retirement"
      rule: "Admit one single actual complete wired steel/glass lockable display cabinet asset_id for this pool (installed_count=1), with verified full hardware/LED/lock/wiring BOM, no battery, and a signed provider boundary for manufacture plus installation. Exclude building, room lighting, payment terminal, external network, operation electricity, cleaning, repairs/replacements and end-of-life from that provider. cp_asset fixes complete installed-unit count, measured whole retirement carrier kg and actual component removals. Whole retirement direct net weighing already excludes removed parts; BOM reconstruction is an exclusive alternative with component weighed sums, never subtract removed parts twice. Repair/LED/lock replacement events are separate mandatory completion sources unless evidenced inside the original complete package; do not hide them in cabinet kg or charge a second full cabinet."
      source_ids: []
    - rule_id: b_completion
      applies_to: "counter"
      rule: "Completion responsibility belongs to the dataset producer before any whole-store retail-service claim. Create named atomic rows/protocols in both languages for each actual module exchange, bind its identity/provider and sync before declaring completeness. Required source modules: M_shop residual store electricity and landlord electricity; M_clean actual cleaning inputs and carriers; M_pay actual payment/receipt/network operation; M_build complete building plus room lighting/fan/fixed shelves/security infrastructure manufacture, maintenance and terminal carriers; M_repair actual cabinet and support-device repair/replacement events; M_freight all post-receipt store handling/returns/waste logistics excluding embedded original inbound; M_treat actual discarded-packet and cabinet treatment. Evidence of absence is required per module; unknown is not absence. Keep this PCR partial until every required module is quantified and passes v_completion; a list of missing modules alone cannot become a complete-business result."
      source_ids:
        - jrc-retail-2013
    - rule_id: b_support_gate
      applies_to: "counter"
      rule: "The ONLY admitted completion configuration is all-electric shop/landlord support with documented absence of all on-site/landlord fuel combustion, purchased heat/cooling and refrigerant-containing systems serving this service, including backup, security and fire systems. Inspect plant registers, landlord signed scope, nameplates, service/refrigerant records, fuel/heat invoices and every study-period change. A heat pump or unknown refrigerant record fails this gate; no default zero refrigerant/fuel or deferred choice of estimation method is allowed. A different actual configuration requires separately authored species/fuel/emission cards and a complete executable method, reviewed and synced before any complete result."
      source_ids: []
    - rule_id: b_clean
      applies_to: "counter"
      rule: "M_clean must measure each actual supplied cleaning formulation separately in original-formulation kg: opening + receipts = closing unused + final retained used origin + dispatched liquid-origin + dispatched wipe-origin + dispatched container-residue-origin + measured spill/air-species origin. Intermediate used-to-rinsed changes REPLACE states, not add destinations. Complete original solution includes its water once. The source component input is original-formulation kg times verified component mass fraction once; this is original component kg, NOT an exterior molecular species emission. Original formulation kg, original component kg, exterior molecular species kg and whole wet carrier kg remain distinct. Actual whole wet rinsate/wipe/container dispatch is directly net weighed; never multiply it by original formulation fraction. Keep retained container residue distinct from actually dispatched container residue. Water input meters exclude internal reuse: do not subtract reuse. Metered wastewater = actual discharge volume times measured same-state density, with no evaporation/storage deduction. No volume-balance reconstruction is admitted by this completion route. Missing meter/density or unresolved origin/carrier balance blocks completion; source fractions/analytical blanks are applied once. For each original component c retain input_component_c_kg=formulation_kg*source_fraction_c once and disjoint original-component-origin destination kg. Species molecule kg is not original-component kg when chemical reaction adds/removes atoms: require actual reaction/tracer source-origin coefficient origin_ratio_c_s, with molecular weights/stoichiometry documented; component_origin_c_kg=species_corrected_s_kg*origin_ratio_c_s. Sum only conserved source-origin component kg, not whole wet or species molecule kg. Purchased solution water stays inside formulation input; separately metered tap/rinse water is additional only once."
      source_ids:
        - jrc-retail-2013
    - rule_id: b_clean_species
      applies_to: "counter"
      rule: "For each actual exterior port/species s and matched interval t collect kg/h and actual interval_h_t. Mutually exclusive flux modes: absolute mode J_net_st=J_out_st-J_in_st-J_blank_st; raw differential mode J_net_st=J_diff_st-J_blank_st; already-blank-corrected differential mode J_net_st=J_corr_st with no second background/blank subtraction. Record exactly which inlet/background and instrument blank are included; do not duplicate them. For source attribution choose one exclusive mode: actual source-resolved J_source_st directly OR measured net port flux times one evidenced source_origin_fraction_st; never apply component composition fractions to infer an exterior flux. Exterior attributed molecular species kg=sum J_attributed_st*interval_h_t over matched ports/intervals. Actual air/capture stock changes, internal generation/uptake, inlet, capture/condensate/export and outlet form an independent complete control-volume check; they are NOT subtracted again from already measured exterior flux. Internal capture/condensation is not exterior emission; whole wet condensate is a disjoint actual liquid carrier. Original component-origin accounting excludes atoms added from outside reactions: actual origin_ratio_c_s and molecular weights/stoichiometry map measured molecular species to conserved original component-origin kg; never divide every species by source concentration to reconstruct whole formulation. Investigate negative fluxes with uncertainty; no zero clamp, negative output or automatic uptake credit. Unknown ports, stocks, source attribution or origin coefficients block completion."
      source_ids: []
