system_boundary:
  rules:
    - rule_id: scope_route
      applies_to: "all"
      rule: "Only one prospectively declared SKU configuration: chilled never-frozen raw boneless pork tenderloin in intact vacuum PA/PE pouches, no retailer repacking, cutting, cooking, added ice, carrier bags or delivery. Record species, cut, supplier, pouch construction/tare, pack size, temperature acceptance specification and actual time-temperature history. A failed specification is not qualified service. Changed species, frozen route, open meat, absorbent pads or added packaging require a separately authored and checked configuration before use."
      source_ids:
        - un-cpc62123
        - fao-cold02
        - fao-cold04
    - rule_id: gates
      applies_to: "all"
      rule: "Foreground starts at physical receipt of already chilled packed goods at the store door and ends at qualified customer carryout or documented terminal fate. Cover receipt, storage/display, checkout, refusals/returns, cleaning, utility provision, refrigerant and waste handling plus all six named asset classes. Include shared staff sanitation, office and closed/idle/failure periods. Customer travel/use is excluded and disclosed; no retailer vehicle route occurs in this configuration."
      source_ids:
        - jrc-retail2013
        - ghg-product2011
    - rule_id: goods_coupling
      applies_to: "failed_goods_background"
      rule: "Keep the original-gate responsibility of finally successful merchandise outside this incremental service, including its original primary/transit packaging and inbound transport. Downstream full product aggregation adds B_s/Q original-gate kg per actual finally accepted kg Q, never a default 1 kg/kg. This service includes B_f/Q only; open B_open and evidenced successor B_t retain their traceable owners and cannot be dropped. Assign each whole original pack to one exclusive final responsibility class; failed-pack descendants share that one parent background and do not receive separate original manufacture. Receipt-equivalent closure is independent of physical endpoint mass. Supplier returns retain original ownership until evidenced successor responsibility, including reverse-route responsibility. External unqualified retention F has recipient, physical state, destination and original-background owner; it is not automatic retailer waste."
      source_ids:
        - ghg-product2011
    - rule_id: no_double_carriers
      applies_to: "all"
      rule: "All actual exchanges need presence/absence evidence. R290 is the sole specified refrigeration species; electric resistance/ventilation HVAC without refrigerant circuit, no combustion/ice or transport is an eligibility condition, not a zero assumption. An additional actual chemical, repair part, refrigerant, transport leg, waste destination or direct external species requires a named atomic bilingual card, process protocol, amount calculation and provider exclusion audit before completeness. Unknown presence/quantity/provider scope blocks completeness."
      source_ids:
        - jrc-retail2013
    - rule_id: provider_scope
      applies_to: "all"
      rule: "Every supply, treatment and asset provider must match state, geography, reference quantity and gate. Treatment includes verified actual pickup/haul and terminal processing; utilities, operation, maintenance, replacement and end-of-life are excluded from manufacture providers unless explicitly integrated and removed from foreground once. Provider empty-haul coverage requires observed vehicle-distance evidence even with zero tonne-km. Unknown coverage is unresolved."
      source_ids:
        - ghg-product2011
