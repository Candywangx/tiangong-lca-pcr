allocation_rules:
  - rule_id: subdivision
    applies_to: "all"
    rule: "Use disjoint direct meters/subdivision first. For each remaining shared total T_j, define actual beneficiaries b and causal exposures d_bj: cold allocated occupied pack volume-hours with site heat-load validation; non-cold store power and building/HVAC floor-area-hours; checkout POS powered transaction-time; shelving volume-hours; truck loaded plus empty handling-time; hygiene cleaned area-events. Allocate A_bj=T_j*d_bj/sum_b(d_bj). Include idle/closed/failure totals, all beneficiaries and zero-sale cohorts. For zero-driver intervals use prospectively reserved capacity-time over all beneficiaries and disclose; do not discard intervals. Reconcile sum A=T."
    source_ids:
      - ghg-product2011
  - rule_id: asset_ownership
    applies_to: "assets"
    rule: "Keep persistent serial asset ledger across all periods and beneficiaries. With measured mass m_a, expected total lifetime causal exposure D_a and current beneficiary exposure e_ap, f_ap=e_ap/D_a. Lifetime revisions replace all previously booked fractions with e_history/D_new and book signed corrections to the original cohorts; never restart manufacture. Cumulative fractions cannot exceed 1; at final retirement allocate the remaining residual once to all lifetime beneficiaries by their measured cumulative exposure, including idle reserved capacity. Apply each fraction once to manufacture and once to that asset terminal carrier. Events outside a cohort retain their dates and original attribution."
    source_ids:
      - ghg-product2011
  - rule_id: asset_partition
    applies_to: "assets"
    rule: "Building covers envelope/foundation and fixed wiring/plumbing/lighting, excluding separately listed HVAC/cabinet/shelf/POS/truck. Complete dry cabinet excludes free R290 but includes initial complete compressor and its sealed factory mineral lubricant; replacement compressor provider likewise includes factory-sealed lubricant, never added again as oil supply. Complete cart_asset includes initial hydraulic fill and its manufacture once; hydraulic_oil is actual later additions only. A removed compressor is only refrigerant-evacuated, not assumed oil-drained. Sealed oil retained in a complete removed/terminal device stays in that real complete carrier. If physically drained, the separate measured compressor oil goes to used_compressor_oil; pallet-truck hydraulic oil goes only to waste_oil. For final original-fluid removal use the corresponding whole-asset f_cabinet or f_cart once; actual during-life oil/repair events use matched event attribution separately. Direct net weighing of the complete remaining device already excludes drained fluids/removed parts; component reconstruction is exclusive and cannot subtract them again. No second initial oil manufacture, full-device manufacture or extra terminal manufacture fraction."
    source_ids:
      - jrc-retail2013
  - rule_id: service_pool
    applies_to: "all"
    rule: "Declare site/SKU/equipment configuration and contiguous reporting pool before observing outcomes. Retain all failure and zero-sale cohorts in that same pool, including their goods backgrounds and resources. Q is finally qualified accepted net contents, not gross physical handovers, revenue or refunds. Late physical returns revise the original numerator resources, lost backgrounds, Q and fates, with actual dates, never duplicate them in a new cohort. Financial refunds/discounts without physical return or qualification change do not reverse Q. No co-product credit, avoided-production credit or automatic waste substitution."
    source_ids:
      - ghg-product2011
dataset_production:
  collection_protocols:
    - protocol_id: sale_ledger
      process_id: "retail"
      flow_role: "service_output"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "pool_id; SKU; original_lot_id; unique_pack_id; event_id; event_time; gross_handovers_H; returns_R; qualified_mass; reversal_mass; F; receipt_net; closing_stock; supplier_return; losses; pack_tare; temperature; seal; acceptance_spec; receiving_g_i; source_parent_ids; paired_receipt_final_weights; B_s_i; B_f_i; B_open_i; B_t_i"
      collection_method: "Scan every receipt, movement, handover, refusal and return; calibrated gross scales minus configuration-specific measured dry pouch tare; retained purge belongs to net contents; verify sampled tare and receipt/customer scales; temperature log and seal acceptance per pack/lot; no statutory default is set. This retail view and fate_ledger view share the same immutable event/pack IDs; no duplicate measurement, responsibility or normalization. Pair the actual receipt and acceptance state, never infer equal wet masses. Use calc_stock and calc_q once; follow unique packs through resale, record physical and financial events separately; keep late revisions in original pool."
      unit: "kg"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, scale checks, supplier specification, label/lot photos, POS and signed acceptance/return evidence."
    - protocol_id: cold_meter
      process_id: "holding"
      flow_role: "cold_power"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "meter_id; circuit_tree; kWh_start; kWh_end; time; occupancy_volume_hours; idle_time; beneficiary_ids; outage"
      collection_method: "Read cabinet/defrost/fan circuit meter continuously with interval closure checks; verify calibration and circuit containment; missing intervals stay unknown. Allocate measured totals by subdivision then subdivision rule; convert 3.6 MJ/kWh and divide by Q once."
      unit: "kWh"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, wiring diagram and full beneficiary reconciliation."
    - protocol_id: store_meter
      process_id: "retail"
      flow_role: "store_power"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "meter_id; parent_contains_cold; total_kWh; cold_submeter_kWh; all_other_beneficiary_exposure; floor_area_hours; POS_time; period"
      collection_method: "Read independent store meter or parent meter with verified contained cold submeter. Subtract cold only from a parent actually containing it; never subtract from disjoint meter. Include HVAC, offices, toilets, checkout, illumination and closed time. Reconcile all store circuits once, causal attribution under subdivision, then calc_normalize."
      unit: "kWh"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Bills, calibrated meters, containment topology and full-year interval coverage disclosure."
    - protocol_id: refrigerant
      process_id: "holding"
      flow_role: "r290_supply; r290_recovery; propane_air"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "source_serial_j; service_event; charge_in/out_j_once; device_stocks_j; room_stocks_j; capture_stocks_j; capture_export/import_j; source_tracer_or_apportionment; other_sources_and_owners; whole_room_absolute_inlet/outlet_species_kg_h; mode; blank; interval; all_cabinet_beneficiaries"
      collection_method: "Weigh every device/cylinder/captured stock and transfer by source serial and date with calibrated scales. Independently monitor whole-room exterior propane flux. Isolate cabinet-origin exterior contribution by source-resolved balances or validated source-specific tracer/direct exterior flux; do not relabel whole-room total as cabinet loss. Resolve other sources and their distinct stock/capture histories. Record actual capture retained net change and capture export/import separately; source uncertainty blocks completion. Reconcile isolated source exterior balance against independently measured whole-room flux across all actual sources, then attribute only this cabinet pool once across its own beneficiaries and normalize /Q. Direct source flux and source balance are exclusive; device recovery and room capture cannot be same carrier."
      unit: "kg"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "R290 plate/SDS, cylinder scale checks, recovery tickets, calibrated flux and room/capture measurements."
    - protocol_id: hygiene
      process_id: "cleaning"
      flow_role: "tap_water; alkaline_cleaner; hypochlorite; cleaning_effluent"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "event_id; site; import_volume; water_density_temperature; solution_kg; NaOH_concentration; NaOCl_concentration; dilution_water; discharge_volume; effluent_density_temperature; dissolved_purge_kg; drainage_portions; cleaned_area_events; calibration"
      collection_method: "Meter incoming water and full discharge; weigh each supplier-formulated chemical separately, record batch SDS/concentration and density where volume converts to mass. Measure effluent as full liquid carrier including dissolved additives/purge. Water reuse is internal and not subtracted from import. Include staff sanitation share with same water and actual effluent composition or add separate atomic carrier before use. Use calc_water direct mode only; reconcile supply balance separately, distinguish condensate drain share, allocate full totals by cleaned-area events then /Q once."
      unit: "kg; m3"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/scale calibration, density samples and temperature, product SDS, drain plan and treatment acceptance."
    - protocol_id: condensate_meter
      process_id: "holding"
      flow_role: "condensate"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "interval; cabinet_id; total_liquid_kg; drain_id; common_drain_cleaning_share; room_humidity; packaging_leak; stock_exposure"
      collection_method: "Collect and weigh whole condensate/defrost carrier per cabinet or validated segregated common-drain intervals. Record infiltration, room moisture and product leakage contributors; do not infer meat evaporation from condensate alone. Disjoint drain portions + cleaning_effluent = measured total common drain; allocate actual carrier once under subdivision then /Q."
      unit: "kg"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weighing, drain segregation test, full-liquid balance and treatment receipt."
    - protocol_id: fate_ledger
      process_id: "residual"
      flow_role: "failed_goods_background; packed_pork_waste; carton_waste"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "unique_original_pack_id; measured_receiving_g_i; event_id/time; actual_final_wet_net/tare; paired_receipt_final_state; source_parent_ids; source_composition_observations; final_exclusive_class_k_i; B_s_i; B_f_i; B_open_i; B_t_i; Q_actual; F; terminal_carrier_ids/gross_mass; external_water/chemical_share; native_source_species_release; successor_whole_pack_background_owner; reverse_route_owner; recipient; uncertainty"
      collection_method: "Pair calibrated original receiving weights with actual final wet weights and seal/acceptance state for each unique unopened original pack; dry pouch tare is measured by representative same-SKU/lot companion packs, not by opening sale packs. Do not assume equal receipt and final wet kg. Keep every failed-pack separated carrier linked to the same parent original g_i and one final background class. Use actual source tracing/composition measurement to distinguish meat/purge/original-source species-water from foreign cleaning water, chemicals and environmental moisture; where destructive composition sampling is needed, use representative same-supplier/lot companion packs and paired actual source/carrier samples with calibrated validated lab method and uncertainty, no default ratio. This source characterization supports physical source mass only, not a dry-matter food-background allocation. Whole terminal carriers are weighed as actual mixtures. Verify successor continuation for the entire original-pack background and reverse route; waste receiver alone does not establish B_t. Close original-equivalent B_s+B_f+B_open+B_t to original g_i independently of actual wet stock and Q. One original-pack background once across failed parent and separated terminal carriers; service B_f/Q and downstream B_s/Q. Legitimate B_open and evidenced supplier/whole-pack B_t retain this pool operational/return/asset resources and signed later corrections. Independent background-owning portions are outside this scope until a separately reviewed method exists."
      unit: "kg"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed recipient/return/waste tickets, original supplier gate datasets, packaging BOM, calibrated mass and transport coverage."
    - protocol_id: asset_ledger
      process_id: "assets"
      flow_role: "building_asset; building_terminal; hvac_asset; hvac_terminal; cabinet_asset; cabinet_terminal; shelf_asset; shelf_terminal; pos_asset; pos_terminal; cart_asset; cart_terminal"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "serial; asset_class; installed_mass; BOM_scope; commissioning; expected_lifetime_exposure_D; e_pool; all_beneficiaries_history; prior_fraction_version; revision; final_residual; terminal_mass; removed_parts; mode; recipient; initial_factory_oil_inclusion; actual_retained_or_drained_fluid; matched_fluid_terminal_fraction"
      collection_method: "Survey all building, HVAC, cabinet, shelf, POS and truck serials. Obtain complete installed masses by calibrated weighing or signed construction/installed BOM with matching provider. Collect causal exposures every interval and preserve the lifetime ledger; terminal direct net weighbridge OR explicit remaining-component BOM mass, exclusive. No invented lifetime. Cabinet/replacement-compressor factory lubricant and truck initial hydraulic fill are included in their complete device provider once; free R290 is excluded from dry cabinet. Retained oil remains in full terminal carrier; separately drained oil uses source-specific oil card and the same whole-asset terminal fraction once. calc_asset with signed replacement of prior allocations and final residual; manufacture scopes disjoint by asset_partition. Reconcile complete package BOM and terminal carrier once."
      unit: "kg; exposure hours"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Asset register, installed BOM/weighing, provider scope sheet, lifetime/exposure history, signed retirement and receiver evidence."
    - protocol_id: maintenance
      process_id: "assets"
      flow_role: "compressor_replacement; removed_compressor; hydraulic_oil; waste_oil; compressor_oil_supply; used_compressor_oil"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "event_id; serial; date; complete_device_mass; retained_factory_oil; R290_removed_once; compressor_oil_added/drained; hydraulic_oil_added/drained; oil_source_grade; initial_factory_fill_provider; direct_net_or_BOM_mode; terminal_or_service_event; matched_f_cabinet/f_cart_or_event_share; recipient; provider_scope"
      collection_method: "Read work orders and manufacturer mineral-oil grade; separately weigh each actual compressor oil and pallet-truck hydraulic oil addition/removal, never mix the two ledgers or waste identities. Complete cabinet/replacement compressor manufacture includes factory-sealed lubricant and truck manufacture includes initial hydraulic fill; collect supplier package inclusion and actual fluid presence. A refrigerant-evacuated compressor retains sealed oil unless actual draining is weighed and evidenced. Device direct net weighing already excludes separately drained fluid; do not subtract again. Unknown oil type, factory inclusion or retained/drained state is unresolved. Manufacturing initial oil once in complete package; actual maintenance additions/removals use event allocation; final separately drained carrier uses matching whole-asset lifetime fraction once and retained oil stays in whole terminal device. Then normalize each disjoint carrier /Q once."
      unit: "kg"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Work orders, scale checks, supplier device scope and treatment/transport receipts."
    - protocol_id: store_air
      process_id: "retail"
      flow_role: "water_vapour_air"
      record_type: "Primary measured event/interval ledger"
      raw_fields: "period; boundary; absolute_inlet_species_kg_h; absolute_outlet_species_kg_h; blank_mode; room_opening_water; room_closing_water; cleaning_evaporation; product_escape; other_beneficiaries; condensate_capture; sampling_time; calibration"
      collection_method: "Measure real exterior humidity species mass flux and room stock/capture over representative full operation/idle/failure intervals, calibrated flow and humidity instruments with air density/temperature/pressure basis. Raw absolute inlet/outlet, already differential and already blank-corrected rates are exclusive modes, remove background once. Attribute full building flux across all actual beneficiaries; product sublot kg/h estimates require measured residence/stock exposure before pooling. Use exterior flux equation; positive net service water release only is water_vapour_air. Negative transfer requires separately authored elementary uptake card before completeness; unknown flux cannot be zero. Separate already captured whole liquid condensate/effluent."
      unit: "kg"
      frequency: "Every event and each meter interval; periodic verified inventory closure"
      temporal_coverage: "Complete declared pool plus linked late/final lifetime corrections"
      site_scope: "Declared site and all actual shared beneficiaries, including idle/failure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated inlet/outlet observations, blank/mode record, moisture balance, sublot exposure and full beneficiary reconciliation."
  calculation_rules:
    - id: calc_stock
      applies_to: "sale_ledger; fate_ledger"
      rule: "Track physical movements at their actual event state, separately from Q and receipt-equivalent background. For the original-content source ledger: S_open_src + receipts_src + R_src + transfers_in_src = S_close_src + H_src + supplier_returns_src + transfers_out_src + separated_food_or_purge_src + source_species_release_from_contents. Record meat/purge transfers separately from water/species leaving the contents into room or collection. Each source release crosses the contents boundary once; later condensation, mixing or external emission does not remove that source mass again. All endpoint carrier gross masses are separately measured, with source-content fractions versus cleaning water, imported room moisture, chemical and packaging identified by paired measurement/composition evidence. Full cleaning effluent or full condensate cannot stand for original meat, purge or source water loss. Physical handovers H and returns R are gross movements independent of acceptance; external F is already in H, never another physical outflow. Unknown source apportionment or balance residual is unresolved, never zero."
      inputs:
        - S_open_src
        - receipts_src
        - R_src
        - transfers_in_src
        - S_close_src
        - H_src
        - supplier_returns_src
        - transfers_out_src
        - separated_food_or_purge_src
        - source_species_release_from_contents
        - carrier_gross_mass
        - measured_source_composition
      output: "Actual-state original-content source balance and separate whole-carrier ledger"
      source_ids:
        - ghg-product2011
    - id: calc_q
      applies_to: "service_output"
      rule: "Q=sum qualified accepted net wet contents - sum reversals of those same acceptance events. Each final accepted pack contributes once after linked returns/resales; reversal without physical return records F separately. Retained purge remains net contents; no mass deduction from price discounts alone."
      inputs:
        - qualified_mass
        - reversal_mass
        - unique_pack_id
        - acceptance_spec
      output: "Q kg finally accepted contents"
      source_ids:
        - ghg-product2011
    - id: calc_goods
      applies_to: "failed_goods_background"
      rule: "For each unique original pack i retain measured receiving net wet contents g_i and paired actual receipt-to-final-state weights, seal/specification evidence, event IDs and uncertainty. Assign one final original-background responsibility class k_i: s for finally qualified success, f for finally failed/lost or externally unqualified retained under this service responsibility, open for stock/unresolved fate, or t for evidenced continuation of the entire original-pack background by a successor including supplier return. B_k,i=g_i if k=k_i, otherwise 0 only when the mutually exclusive class is evidenced; B_s,i+B_f,i+B_open,i+B_t,i=g_i. Unknown class or missing g_i is unresolved, never a zero. These B quantities are original-receiving-gate equivalents, not final wet contents q_i; final Q is measured separately. Moisture change does not create a new original manufacture or imply B_s=Q. The finally accepted intact pack inherits its original g_i even if actual wet mass changed. A failed parent pack and any separated meat, purge, original-source water/species or residual pouch remain one B_f parent background, not another g_i for each terminal carrier. Failure waste collection/transport/treatment stays within this service responsibility even if physically separated for handling; it does not transfer the original production background. Only a verified whole-original-pack continuation with explicit successor original-background and reverse-route ownership qualifies for B_t. Splitting original contents into independently sold, reused, donated or background-owning portions is outside this intact-pack PCR and blocks completeness until a separately reviewed partition/aggregation method is adopted; never substitute endpoint wet kg or an unsupported dry-matter ratio. Sum B_k by unique packs/provider lots. Service includes B_f/Q; successful downstream adds B_s/Q original-gate kg per actual accepted kg. Original packaging and inbound transport follow that same whole-pack responsibility once. Supplier continuation B_t and legitimate B_open do not erase this pool operation, handling, return, asset, failure or zero-sale resources. Late returns/reclassification replace the original pack class, original service numerator and successful-background join with signed corrections under the same parent, never create another manufacture."
      inputs:
        - unique_original_pack_id
        - measured_receiving_g_i
        - paired_actual_receipt_final_weights
        - final_Q
        - final_exclusive_class_k_i
        - acceptance_and_seal_evidence
        - successor_whole_pack_owner
        - reverse_route_owner
        - B_s_i
        - B_f_i
        - B_open_i
        - B_t_i
        - parent_terminal_carrier_ids
        - uncertainty
        - original_gate_provider_scope
      output: "B_s; B_f; B_open; B_t original-gate kg, whole-pack one-owner closure, B_s/Q downstream and B_f/Q service"
      source_ids:
        - ghg-product2011
    - id: calc_normalize
      applies_to: "all inventory rows except service_output"
      rule: "q_r=A_r/Q for Q>0; A_r is the already attributed pool absolute amount. Raw totals first, causal attribution second, one final normalization last. Do not reapply composition/destination/allocation fractions already present in A_r. kWh to MJ is 3.6 exactly by adopted energy unit support."
      inputs:
        - raw_totals
        - beneficiary_exposures
        - A_r
        - Q
      output: "Row-specific units per kg final qualified accepted contents"
      source_ids:
        - ghg-product2011
    - id: calc_water
      applies_to: "tap_water; cleaning_effluent; condensate"
      rule: "Supply M_import=V_import*rho_water(T). Direct effluent M_eff=V_discharge*rho_effluent(T) only, with full-carrier density; do not subtract evaporation/storage or multiply a water-only balance by effluent density. Supply closure independently accounts for evaporated water, stock change, actual water in products and actual drains. No reconstruction mode is authorized here. M_common_drain=M_eff_cleaning_share+M_condensate_share with disjoint measured portions; actual dissolved cleaner/purge is already in full liquid mass, never added again."
      inputs:
        - V_import
        - rho_water
        - V_discharge
        - rho_effluent
        - T
        - disjoint_drain_portions
      output: "Distinct actual liquid-carrier kg before allocation"
      source_ids:
        - jrc-retail2013
    - id: calc_gas
      applies_to: "r290_supply; r290_recovery; propane_air"
      rule: "For each cabinet/source serial j, L_j=opening_charge_j+contained_in_j-closing_charge_j-contained_out_j_once; device recovery never enters room release. Target-source exterior balance is E_j=L_j+room_open_j-room_close_j-(capture_close_j-capture_open_j)-capture_exports_j+capture_imports_j. Room/capture stocks and transfers must be source-resolved; net captured-stock change and actual external export/import are separate non-overlapping terms. An export from prior captured stock is canceled by its stock decrease, never another capture subtraction. A target-source tracer/direct exterior flux is an exclusive alternative to that source balance. Independently measure the whole-room exterior propane net flux E_room from absolute inlet/outlet species kg/h over intervals, OR already differential/blank-corrected rates; modes exclusive, background removed once. Require sum of all independently resolved source E_j to reconcile E_room and measured uncertainty; other room sources receive their own matched ownership and are excluded from this cabinet target, not added to it and allocated by cabinet exposure. Only after isolating this cabinet E_j may its complete pool be attributed once across all actual cabinet beneficiaries by the declared causal driver. If source tracing/apportionment, mixed room/capture storage or any other source remains unresolved, target emission completeness is unresolved. Contained refrigerant recovery is one device contained_out term; room capture is a different physical transfer with its own stock/export records, never the same mass twice. The current r290_recovery card covers device-contained refrigerant only; any actual room-capture export needs a distinct atomic carrier card matching its measured physical medium, protocol/process and amount before completeness. Do not label sorbent, mixed condensate or a captured mixture as pure recovered propane; evidenced no-capture remains an absence record, not an assumed zero."
      inputs:
        - source_serial_j
        - opening_charge_j
        - contained_in_j
        - closing_charge_j
        - contained_out_j_once
        - room_open_j
        - room_close_j
        - capture_open_j
        - capture_close_j
        - capture_exports_j
        - capture_imports_j
        - source_apportionment_evidence
        - whole_room_exterior_flux
        - mode
        - all_cabinet_beneficiaries
      output: "Source-isolated cabinet exterior propane kg, independently reconciled with whole-room flux"
      source_ids:
        - fao-cold04
    - id: calc_asset
      applies_to: "building_asset; hvac_asset; cabinet_asset; shelf_asset; pos_asset; cart_asset; building_terminal; hvac_terminal; cabinet_terminal; shelf_terminal; pos_terminal; cart_terminal"
      rule: "f_ap=e_ap/D_a; A_manufacture=m_a*f_ap; A_terminal=w_a*f_ap. On D revision replace old f_history by e_history/D_new, book signed differences to old cohorts and apply final retirement residual once across full lifetime exposure. Sum lifetime f<=1 before closure, =1 after closure. Terminal direct net weighing w_a already excludes actual removed compressor, separately drained oil and recovered refrigerant; sealed lubricant still present remains in measured whole device. Exclusive BOM mode sums only actual remaining components/contained fluids. Do not subtract removed parts twice or multiply terminal mass by another manufacture fraction."
      inputs:
        - m_a
        - w_a
        - e_ap
        - D_a
        - previous_allocations
        - terminal_mode
        - remaining_components
      output: "Attributable complete asset manufacture and terminal carrier kg"
      source_ids:
        - ghg-product2011
    - id: calc_exterior_water
      applies_to: "water_vapour_air"
      rule: "Absolute mode E=sum[(outlet_water_kg_h-inlet_water_kg_h)*interval_h] after one evidenced blank correction where not already removed. Differential or blank-corrected rate modes integrate the recorded kg/h once with no repeated subtraction. Reconcile E=actual_internal_water_sources+room_opening_water-room_closing_water-actual_captured_liquid, excluding imported environmental moisture already canceled in net inlet/outlet and excluding non-service beneficiary contributions once. Sublot kg/h times measured residence hours gives that sublot mass; kg-based rates multiply matching measured kg-hours once; sum all sublots then allocate and /Q once. Condensed water is liquid carrier, never also air emission."
      inputs:
        - absolute_or_differential_mode
        - inlet_water_kg_h
        - outlet_water_kg_h
        - interval_h
        - blank
        - room_stocks
        - actual_internal_water_sources
        - actual_captured_liquid
        - beneficiary_shares
        - measured_sublot_exposure
      output: "Reconciled exterior service-attributable net water kg"
      source_ids:
        - fao-cold04
        - ghg-product2011
    - id: calc_oil_ownership
      applies_to: "compressor_replacement; removed_compressor; hydraulic_oil; waste_oil; compressor_oil_supply; used_compressor_oil; cabinet_asset; cabinet_terminal; cart_asset; cart_terminal"
      rule: "Initial factory oil manufacture is included once in complete cabinet/compressor/truck provider mass and scope, with no separate initial-oil input. A_added_event=m_added*event_share; A_removed_event=m_removed*event_share. At final retirement, A_drained_cabinet_oil=m_actual_drained*f_cabinet and A_drained_truck_oil=m_actual_drained*f_cart; each carrier once, not another manufacture fraction. If oil remains sealed, it stays in directly measured complete terminal device mass w_a and has no separate waste-oil exchange. Track each source oil: opening+actual_additions=closing_retained+actual_separated_removals+measured_other_fate; cross-device oils never substitute for each other. Whole terminal direct net weighing and reconstructed component/BOM mode are exclusive; direct measured remaining mass already excludes actual drained oil. Unknown oil presence/type/provider inclusion, retained/separated fate or ledger discrepancy blocks completeness."
      inputs:
        - factory_fill_inclusion
        - oil_source_serial
        - opening
        - actual_additions
        - closing_retained
        - actual_separated_removals
        - measured_other_fate
        - event_share
        - f_cabinet
        - f_cart
        - direct_net_or_BOM_mode
      output: "Disjoint source-specific oil manufacture, event and terminal responsibility"
      source_ids:
        - ghg-product2011
  data_quality_requirements:
    - id: configuration
      applies_to: "all"
      requirement: "Document route eligibility with inspection evidence: sealed PA/PE pork tenderloin SKU, no absorbent pad/additional retailer packaging, no ice/freezing/delivery/combustion, actual R290 cabinet and electric HVAC. Supplier and local food safety criteria determine recorded acceptance; this PCR supplies no numeric legal threshold. Record monitoring interval adequacy against holding duration and excursions."
      evidence: "Supplier specification, seals, inspection, cold log, equipment plate and local acceptance decision."
    - id: inventory_complete
      applies_to: "all"
      requirement: "Keep every actual flow individually identified with real process, direction/type, state/medium, property/unit, quantity, collection and provider boundaries. Non-empty inventory cards do not prove actual occurrence. Conditional absence needs invoices, inspection or ledger evidence; unresolved quantity, identity, fate or missing measurement prevents complete dataset use."
      evidence: "Row binding register, calibrated raw records, conditional absence evidence and provider scope exclusions."
    - id: periods
      applies_to: "all"
      requirement: "Declare contiguous reporting dates before outcomes, complete seasonal/site coverage, cutoff and late-return revision window. Keep actual event time and original cohort attribution, full beneficiaries and all zero-sale cohorts; retain unnormalizable pools and all uncertainty. No unsupported default amount, lifetime or concentration."
      evidence: "Timestamped ledger, coverage/missingness report, lifetime register and signed corrections."
validation_rules:
  - rule_id: identity_binding
    applies_to: "all"
    rule: "Before complete dataset use, independently bind each non-electricity flow (including service) to one appropriate Tiangong flow; verify public state, exact bilingual name, type, state, medium, property/unit and provider against original direct-read evidence. Mass support does not establish a pork/service flow. Historical electricity identity does not establish supplier mix or current availability. Preserve all unresolved identities and quantities explicitly; unknown is never zero."
    source_ids:
      - ghg-product2011
  - rule_id: balances
    applies_to: "all"
    rule: "Require source-resolved actual-state contents stock and distinct corrected Q, plus original-gate-equivalent B_s/B_f/B_open/B_t closure; never equate endpoint wet kg with original production kg. Every native meat/purge transfer and species-water release has original source attribution; cleaning water, chemicals and environmental moisture are excluded from original content source mass. Terminal liquid whole-carrier mass is not a source-food loss. Require target propane source E_j independently reconciled to whole-room all-source flux, net capture stocks and disjoint exports. Require complete device/factory oil inclusion, retained/separately drained oil evidence and source-specific oil carrier fractions. Missing source/composition, stock, owner or uncertainty closure blocks completeness."
    source_ids:
      - fao-cold04
      - ghg-product2011
  - rule_id: zero_output
    applies_to: "all"
    rule: "Normalize only when Q>0 and every required row/conditional absence has evidence. Entirely zero-output pools retain absolute exchanges, failed goods and unresolved fates, report unnormalizable and are never erased or assigned a fabricated denominator. A target PCR mechanical check is not scientific approval or standard-conformity certification."
    source_ids:
      - ghg-product2011
published_dataset_profile:
  dataset_role: "Incremental retail-service process dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matched declared chilled sealed pork-tenderloin configuration only, after all quantity/identity/fate/asset completion; join successful merchandise B_s/Q original-gate background once per actual accepted kg, never default 1 kg/kg."
  excluded_use: "All-meat retail average; slaughter/manufacture; frozen or open meat; whole consumed-pork footprint without downstream product aggregation; safety certification."
  required_metadata: "All reference qualifiers, provider gates, reporting/return dates, measured Q and absolute pool ledger, original-gate goods responsibility, all six asset histories and treatment routes."
  required_quality_disclosure: "All unbound identities, missing quantities/coverage, uncertainty, failed/zero-output cohorts, corrections, provider exclusions and independent review status."
  update_trigger: "SKU/pack/state/temperature acceptance changes, route or refrigerant change, asset lifetime revision, late return/fate correction or improved provider evidence."
data_sources:
  - id: "un-cpc62123"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0, subclass 62123, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62123"
    used_for: "Classification meaning: retail services related to group 211; not service methodology."
  - id: "fao-cold02"
    type: "handbook"
    reference: "FAO, Manual on meat cold store operation and management, Cold preservation of meat products, https://www.fao.org/4/t0098e/T0098E02.htm"
    used_for: "Qualitative chilled versus frozen meat and packaging/preservation context; no temperature, duration or shrink factor adopted."
  - id: "fao-cold04"
    type: "handbook"
    reference: "FAO, Manual on meat cold store operation and management, Refrigeration equipment, https://www.fao.org/4/t0098e/T0098E04.htm"
    used_for: "Temperature monitoring, equipment, humidity and evaporation context; not an R290 leakage factor or shelf-life mandate."
  - id: "jrc-retail2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Environmental Management Practice in the Retail Trade Sector, 2013, EUR25998 EN, section 1.2 pp.4-6, https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Qualitative direct retail energy/water/chemical/waste screening and upstream/consumer separation; no numeric default."
  - id: "ghg-product2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard, 2011, chapters 6-7 and 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Unit of analysis, transparent boundary and allocation hierarchy guidance; specific ledger formulas are PCR foreground design choices, not quoted standard mandates or full conformity."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:46e928269cb5867752f327a46f132e2ee8422324e4cd329c6e339a9f2ef1f8eb"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5291"
      family: "system_boundary"
      span:
        start:
          offset: 5291
          line: 53
          column: 1
        end:
          offset: 9701
          line: 74
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Already chilled intact vacuum-packed pork tenderloin physically received at the retail door. |\n| starting_condition_role | Declared incremental retail gate; upstream goods remain traceable for loss coupling. |\n| product_classification_scope | Narrower service subset of CPC 3.0 62123; goods group 211 context only. |\n| recursive_input_rule | Do not recurse service into itself for internal moves or resales. Transfer linked packs with original background ownership. |\n| upstream_dataset_requirement | Match original receiving-gate packed pork background with actual primary/transit packaging and inbound cold transport; verify asset, utility and waste-treatment provider boundaries. |\n| disclosure | Incremental service excludes finally successful goods production; full product users add B_s/Q original-gate kg per actual accepted kg, while B_f/Q failed/lost original-gate background is already included here; B_s is not assumed equal to Q. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| scope_route | all | Only one prospectively declared SKU configuration: chilled never-frozen raw boneless pork tenderloin in intact vacuum PA/PE pouches, no retailer repacking, cutting, cooking, added ice, carrier bags or delivery. Record species, cut, supplier, pouch construction/tare, pack size, temperature acceptance specification and actual time-temperature history. A failed specification is not qualified service. Changed species, frozen route, open meat, absorbent pads or added packaging require a separately authored and checked configuration before use. | un-cpc62123; fao-cold02; fao-cold04 |\n| gates | all | Foreground starts at physical receipt of already chilled packed goods at the store door and ends at qualified customer carryout or documented terminal fate. Cover receipt, storage/display, checkout, refusals/returns, cleaning, utility provision, refrigerant and waste handling plus all six named asset classes. Include shared staff sanitation, office and closed/idle/failure periods. Customer travel/use is excluded and disclosed; no retailer vehicle route occurs in this configuration. | jrc-retail2013; ghg-product2011 |\n| goods_coupling | failed_goods_background | Keep the original-gate responsibility of finally successful merchandise outside this incremental service, including its original primary/transit packaging and inbound transport. Downstream full product aggregation adds B_s/Q original-gate kg per actual finally accepted kg Q, never a default 1 kg/kg. This service includes B_f/Q only; open B_open and evidenced successor B_t retain their traceable owners and cannot be dropped. Assign each whole original pack to one exclusive final responsibility class; failed-pack descendants share that one parent background and do not receive separate original manufacture. Receipt-equivalent closure is independent of physical endpoint mass. Supplier returns retain original ownership until evidenced successor responsibility, including reverse-route responsibility. External unqualified retention F has recipient, physical state, destination and original-background owner; it is not automatic retailer waste. | ghg-product2011 |\n| no_double_carriers | all | All actual exchanges need presence/absence evidence. R290 is the sole specified refrigeration species; electric resistance/ventilation HVAC without refrigerant circuit, no combustion/ice or transport is an eligibility condition, not a zero assumption. An additional actual chemical, repair part, refrigerant, transport leg, waste destination or direct external species requires a named atomic bilingual card, process protocol, amount calculation and provider exclusion audit before completeness. Unknown presence/quantity/provider scope blocks completeness. | jrc-retail2013 |\n| provider_scope | all | Every supply, treatment and asset provider must match state, geography, reference quantity and gate. Treatment includes verified actual pickup/haul and terminal processing; utilities, operation, maintenance, replacement and end-of-life are excluded from manufacture providers unless explicitly integrated and removed from foreground once. Provider empty-haul coverage requires observed vehicle-distance evidence even with zero tonne-km. Unknown coverage is unresolved. | ghg-product2011 |\n\n"
