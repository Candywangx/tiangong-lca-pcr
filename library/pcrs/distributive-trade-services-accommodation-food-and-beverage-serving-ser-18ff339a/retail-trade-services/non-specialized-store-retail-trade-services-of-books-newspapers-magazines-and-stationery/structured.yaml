      markdown: "## 9. Validation Rules\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| validate_identity | Verify each UUID against retained official original response, public state, bilingual name, type, property/unit chain and actual boundary. Reference service and complete-book custody/waste identities remain unbound candidates, never substituted by a generic book or manufacturing flow. Supply original supplier/BOM and route evidence plus quantity records and final responsibility before binding; unknown is not zero. |  |\n| validate_ledgers | Require unique original IDs and gross event IDs, physical total-custody reconciliation, mass/count cross-check of dispatched whole books, Q from final acceptance and original G/H source partition. Lost and externally retained invalid books keep F/O/T responsibility without invented physical waste. Verify late-version replacements and absence of duplicate background, revocation and normalization. |  |\n| validate_completion | Partial candidate remains incomplete until every necessary source is measured/bound, each conditional process has positive or evidenced absent status, all S/F/O/T recipients and backgrounds are resolved, Q>0 and complete_modules passes. Obtain full-year/declared-cycle all-beneficiary support data, exact asset lifetime revisions and route empty/idle coverage. Present cards alone cannot certify complete LCA, GHG Product Standard conformity, scientific approval or quantitative performance. |  |\n\n"
