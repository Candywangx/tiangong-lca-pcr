validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Verify each UUID against retained official original response, public state, bilingual name, type, property/unit chain and actual boundary. Reference service and complete-book custody/waste identities remain unbound candidates, never substituted by a generic book or manufacturing flow. Supply original supplier/BOM and route evidence plus quantity records and final responsibility before binding; unknown is not zero."
    source_ids: []
  - rule_id: validate_ledgers
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique original IDs and gross event IDs, physical total-custody reconciliation, mass/count cross-check of dispatched whole books, Q from final acceptance and original G/H source partition. Lost and externally retained invalid books keep F/O/T responsibility without invented physical waste. Verify late-version replacements and absence of duplicate background, revocation and normalization."
    source_ids: []
  - rule_id: validate_completion
    applies_to: "foreground_dataset_conformance"
    rule: "Partial candidate remains incomplete until every necessary source is measured/bound, each conditional process has positive or evidenced absent status, all S/F/O/T recipients and backgrounds are resolved, Q>0 and complete_modules passes. Obtain full-year/declared-cycle all-beneficiary support data, exact asset lifetime revisions and route empty/idle coverage. Present cards alone cannot certify complete LCA, GHG Product Standard conformity, scientific approval or quantitative performance."
    source_ids: []
published_dataset_profile:
  dataset_role: "partial_incremental_service_inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Transparent partial counter-service data; complete_modules required before completed incremental service assembly"
  excluded_use: "Whole-store, whole-leaf or full product footprint from cards alone; approval or standard conformity claims"
  required_metadata: "All reference qualifiers; original source/denominator/version; custody and final acceptance; S/F/O/T; actual modules and omissions"
  required_quality_disclosure: "Identity/quantity/background gaps; no invented zeros; uncertainty; Q=0 and open responsibilities; partial boundary"
  update_trigger: "Actual edition/route/provider change, late acceptance/return, corrected meter/source data, changed asset life or final fate"
