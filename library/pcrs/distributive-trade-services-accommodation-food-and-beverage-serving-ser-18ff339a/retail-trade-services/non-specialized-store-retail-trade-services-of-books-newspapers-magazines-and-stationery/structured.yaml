          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| allocate_events | Prospectively declare one same-configuration pool and closure policy including all unsuccessful and zero-sale periods. Q counts distinct original IDs whose final customer acceptance remains valid at closure, once each; it is not transactions, units scanned, gross handovers minus a second revocation, sales value or physical custody stock. Acceptance revocation removes the ID even without physical return; purely financial refund/discount with valid acceptance does not. A genuine later acceptance restores the same ID at most once. Late events replace the original pool numerator, Q and fates using actual dates; do not allocate the correction again to the new period. Entire Q=0 pools stay unnormalized with all numerators and must enter the next prospectively permitted same-configuration pool or remain explicitly unnormalizable. |  |\n| allocate_counter | Subdivide dedicated counter meters first. For a shared counter split the measured parent energy into disjoint active, standby and closed-idle energy subpools in the same kWh unit; reconcile their sum to parent energy. Allocate active subpool by recorded handling/checkout seconds for all actual merchandise including failed events; allocate standby/closed-idle by reserved counter seconds across all beneficiaries. Each subpool uses one seconds/seconds driver. Retain failures and idle reservation; unknown or zero total driver blocks allocation. Sum attributed kWh, then convert once to MJ and divide once by Q. Subtract a nested meter only if the parent includes it; an independent disjoint meter cannot be subtracted again. | wri-product-allocation |\n| allocate_support | Mandatory completion of store-operation sources uses measured disjoint source pools: floor lighting/shared HVAC by reserved floor-area-time (m2*h/m2*h), dedicated storage by occupied shelf-volume-time (m3*h/m3*h), digital receipt/payment by directly metered task activity or a provider-attributed task inventory with declared boundary. For each source j and physical subpool k, N_jb=sum_k X_jk*d_bjk/sum_all_b d_bjk. Never sum seconds, m2*h, m3*h or tasks into one driver. Retain closed/idle/failure periods and all other departments as beneficiaries. Establish source topology and remove counter energy only from a genuinely inclusive store meter. Unknown operation or cleaning presence prevents full completion. The no-combustion/no-purchased-thermal/no-refrigerant whole-site route requires boundary_ambient absence evidence; positive presence is inapplicable, not a downstream method choice. Apply allocate_cleaning for every actual cleaning source before completeness. | wri-product-allocation |\n| allocate_transport | Transport completion fixes actual route R, trip/segment s, complete measured source inventory X_s and every beneficiary b. Direct provider-attributed consignment inventory retains its existing allocation; segment records then only verify coverage. Otherwise the fixed driver is actual reserved payload kg times actual reserved segment h: d_sb=r_sb_kg*t_sb_h; X_sb=X_s*d_sb/sum_all_b d_sb. Record actual capacity kg and utilized kg for reconciliation; do not reduce X_s by unused-capacity fractions, and retain all nonproductive source activity. For empty return and stationary idle segments use each route beneficiary actual contracted reserved payload kg times the full actual empty/idle segment h, allocated by the same ratio; retain actual empty km and stationary idle h even at zero load t*km. The whole measured X_s remains allocated to actual all-route beneficiaries, including failed/zero-sale reservations; unknown or zero total reservation requires review, never deletion. Provider must cover observed empty/idle source numerators or add separately measured vehicle-distance/time source rows with overlaps removed; never invent zero activity from t*km=0. Sum only compatible exchange numerators. Original H first inbound sources cannot re-enter these modules; actual reverse/internal transport outside H retains source IDs and recipient gates. |  |\n| allocate_asset | Capital completion locates actual building shell/installation and fixed lighting/HVAC fixtures in one verified complete facility package or disjoint explicit assets; shelf, counter, scanner, terminal and router assets are separate unless the signed complete package includes their exact models. Keep manufacture/installation, operation, event-based repairs/replacements and terminal end-of-life scopes disjoint. For each asset a use e_ab/L_a with the same exposure unit in numerator and expected whole-life denominator: reserved floor-area-time for facility, shelf-volume-time for shelves and reserved equipment h for checkout devices, including idle/failure and all historical beneficiaries. The lifetime ledger allocates N_ab=X_a*e_ab/L_a, never a new X_a each period. Every life revision replaces all prior allocations, cumulatively <=1; at retirement allocate final residual to actual all-history beneficiaries and reconcile total to X_a. Terminal whole-device/package net mass times this final lifetime responsibility fraction once; no extra manufacture fraction, no repeated subtraction of removed components from already net weights. No guessed life, device mass or repair mass hidden inside a complete device. |  |\n| allocate_waste | Use directly weighed dispatched complete-book carrier kg without transport outer tare as the waste row; intact books are a real ink/paper/adhesive/cover mixture, not pure paper. Do not add their components as duplicate waste. Retain waste book count and retained held-waste kg separately. Condemnation is an internal goods-to-held-waste state change, not dispatch. Supplier returned saleable stock is product custody, not waste or a recycling credit. Waste treatment and actual transport remain separate verified completion modules with no automatic avoided-production credit. |  |\n| allocate_cleaning | For completion, identify each actual aqueous cleaning formulation j and record its supplier original full composition and purchased formulation kg P_j; do not use active-ingredient kg as full solution. Record imported mains/rinse water separately by inlet volume and measured density; internal reuse is not subtracted from the inlet and formulation water is not added twice. Maintain original formulation-source kg ledger P_j+opening_source_j=unused_return_j+held_source_j+final_liquid_source_j+final_wipe_source_j+spill_source_j+other_final_source_j, all disjoint and excluding later rinse water/dirt. Used-to-rinsed transfer replaces an intermediate state, never another final destination. For original cleaning-formulation containers, other_final_source_j includes container_dispatch_residue_source_j, the formulation-origin kg actually dispatched as terminal waste residue inside the original container, excluding unused-product returns already assigned to unused_return_j; it excludes container_held_residue_source_j still retained in containers at closure, which remains within held_source_j. Record those two quantities separately by original container ID and dispatch/closure date. Weigh the actual complete original container with its residue as one carrier: original_container_with_residue_net_kg = original_container_gross_dispatch_kg - original_container_external_tare_kg; only outside transport tare is removed, not the original container body, closure or residue. This directly measured carrier is mutually exclusive with separately dispatched free aqueous liquid and wet-wipe carriers, and must not also be recorded as a bare original-container waste output. Apply its verified terminal treatment/transport once using direct carrier kg, with no additional multiplication by formulation-source fraction. Original container manufacture follows its actual complete-package or exclusive component-BOM source inventory; source-origin residue kg is a separate responsibility/reconciliation quantity, not a second carrier amount. Weigh actual whole aqueous liquid carrier dispatch gross minus measured container tare, in kg only: no evaporation or reused-water subtraction from direct dispatch, no water-balance reconstruction. Collect dissolved formulation/merchandise/dirt source portions for reconciliation, not a second multiplier on carrier kg. Retain complete wet cotton-wipe carrier dispatch kg, with source portions disjoint from liquid carrier; dry reusable cotton-cloth manufacture and actual rinse operation are separate from its terminal wet carrier, and apply its own measured cleaned-area m2 / expected all-life cleaned-area m2 lifetime ledger. Reusable complete cleaning bucket manufacture uses reserved-use h / all-life reserved-use h; terminal whole bucket net kg uses final same lifetime responsibility once. Disposable containers and actual extra chemical identities need atomic cards/protocols before completion, with their original complete-package production or component BOM mode exclusive. Allocate shared cleaning source numerators by measured cleaned-area m2 across every actual beneficiary, retaining no-sale/idle-period cleaning; whole-carrier treatment/transport provider scope must exclude duplicate inputs and utilities. Unknown formulation, source fate, carrier quantity, lifetime or treatment coverage blocks completion. |  |\n| allocate_incoming_carton | Incoming packaging completion uses actual one-way complete corrugated shipping carton and its closure as one bounded physical package: supplier model and full body/fluting/liner/adhesive/ink/closure BOM must be verified, with actual complete package count and net mass excluding books. Choose a supplier complete-package manufacturing inventory per actual package or a component-BOM reconstruction, never both; count-to-kg uses this measured complete package only. Allocate each actual shipment package source numerator to all contents by reserved payload kg*reserved shipment h, retaining empty/failed reserved activity and reconciling all contents. Actual waste carton/closure net dispatch kg is one complete carrier excluding retained book mass and nonincluded transport carrier; do not add contained components again as foreground waste. Add named packaging manufacture and terminal-carrier cards with original source IDs before completion. This route excludes palletized/film-wrapped and reusable shipping packages unless an explicit reviewed state-specific extension supplies disjoint source/asset/return duties; uncertain package scope blocks completion. |  |\n\n"
