system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "foreground_system_boundary"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: boundary_scope
      applies_to: "foreground_system_boundary"
      rule: "Apply only to physical non-specialized stores selling complete new mass-market paperbacks: one ISBN-13, publisher imprint, edition/printing, binding, page specification and receiving condition per homogeneous pool. Use the Signet 352-page ISBN actual edition ISBN as an evidenced representative, not as evidence for all editions. Record actual edition changes even under the same ISBN. Exclude used books, hardbacks, newspapers, magazines, maps, stationery, e-books, subscriptions, printing, cover-stripping and page separation."
      source_ids:
        - un-cpc-paperback-retail
        - prh-paperback-specification
    - rule_id: boundary_service
      applies_to: "foreground_system_boundary"
      rule: "Start with complete books at the first retailer receiving gate and end with valid customer acceptance at the counter, including inspection, shelving, browsing-related handling, checkout, refusal, rework, stockholding and reverse handling through the declared closure date. Require actual unwrapped complete books with no separate unit wrap/bellyband. No home delivery, gift wrap, retail bag or printed receipt is permitted in this route: issue an electronic receipt without assuming its network burden is zero. Screen actual practice; any such activity requires an explicit bilingual atomic extension before route completeness."
      source_ids: []
    - rule_id: boundary_partial
      applies_to: "foreground_system_boundary"
      rule: "This is a partial incremental counter-service inventory: cards contain satellite physical custody bookkeeping, measured counter AC and actual complete-book waste dispatch. All custody product cards are satellite observations, never technosphere upstream manufacturing inputs or additional service products; they must be flagged/excluded from impact-linking. This partial boundary excludes original book production and first inbound transport for both S and F books; completion of incremental service must add original F backgrounds, shared store operation, inbound/return/internal transport, facility and checkout/shelf capital, upstream AC supply, receipt/payment digital services, incoming packaging and waste treatment. Those are necessary completion responsibilities, not zero burdens. Apply complete_modules and the fixed methods in allocate_support, allocate_transport, allocate_asset and validate_completion; no complete store, cradle-to-gate or cradle-to-grave claim from these cards alone."
      source_ids: []
    - rule_id: boundary_background
      applies_to: "foreground_system_boundary"
      rule: "At each original first receiving ID retain the actual complete-book supplier production inventory vector G_i and first inbound transport vector H_i, with original quantities, denominator, boundaries, source IDs and versions. Match actual paper, printed ink, binding adhesive and cover/finish inventory or a verified whole-book supplier package; page count or retail price is not a manufacturing quantity. Supplier package and component construction are mutually exclusive. Never apply a new G_i or H_i to returned/resold custody cards."
      source_ids: []
    - rule_id: boundary_fates
      applies_to: "foreground_system_boundary"
      rule: "Assign every original book exactly once to current S (finally accepted), F (permanent retailer-responsible failure/loss), O (open retail stock or unresolved final status) or T (named receiving system with continuing original background responsibility). Track physical recipient/state independently, including supplier-return intact saleable books, internal transfers, lost books and invalid acceptance with external retention. T requires signed receiving ownership and original source-ID handoff; a supplier credit alone does not establish T. Unknown recipient/responsibility remains O and blocks completion; no automatic waste for external retention."
      source_ids: []
    - rule_id: boundary_failure
      applies_to: "foreground_system_boundary"
      rule: "The partial card set excludes G_i+H_i of F as well as S. Completion assembly of incremental service must add original G_i+H_i of F once using original_background and complete_modules; retain S backgrounds as excluded merchandise vectors for downstream product-plus-service assembly. O carries forward and T passes to its named system. Later resale of an F/O book replaces the old fate and original service numerator/denominator version: reverse its former F background allocation before assigning S, never retain an F charge and add manufacturing again. Full product-plus-service assembly adds S originals once and F originals once, and excludes O/T pending responsibilities."
      source_ids: []
    - rule_id: boundary_ambient
      applies_to: "foreground_system_boundary"
      rule: "This route requires a dry ambient store with no on-site combustion, no purchased heat/cooling and no refrigerant-containing equipment in the service or relevant shared landlord scope. Obtain signed whole-site/landlord equipment, fuel-purchase and utility-boundary evidence at start and each change, including other departments whose source pools would be shared. Unknown or positive presence makes this route inapplicable until a separately reviewed route fixes actual fuel/refrigerant external-release methods; it cannot be recorded as zero or silently excluded. Water-based manual surface cleaning is completed by allocate_cleaning."
      source_ids: []
