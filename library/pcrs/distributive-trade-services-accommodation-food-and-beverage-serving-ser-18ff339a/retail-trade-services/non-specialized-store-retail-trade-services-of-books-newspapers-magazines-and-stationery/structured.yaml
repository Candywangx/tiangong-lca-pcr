  data_quality_requirements:
    - id: quality_scope
      applies_to: "All actual route operations"
      requirement: "Retain prospectively fixed pool, exact edition and conditions; unknown activity/identity/quantity is not zero."
      evidence: "Store survey; source documents; explicit unresolved register"
    - id: quality_measurement
      applies_to: "All collected records"
      requirement: "Calibrated meters/scales, signed counts and actual event time cover every day including closed, idle and failed periods. Investigate discrepancies with uncertainty, never automatic zero balancing."
      evidence: "Calibration certificates; daily reconciliation; missing-data and uncertainty log"
    - id: quality_completion
      applies_to: "accepted_service"
      requirement: "Bind original G/H and all mandatory completion sources with actual raw denominators and exact source overlap checks. Remain partial while any gap exists."
