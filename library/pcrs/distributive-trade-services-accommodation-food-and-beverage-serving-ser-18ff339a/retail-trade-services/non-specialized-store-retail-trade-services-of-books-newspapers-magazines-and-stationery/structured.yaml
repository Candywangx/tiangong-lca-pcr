    - protocol_id: cp_events
      process_id: "counter"
      flow_role: "original_receipt; customer_return; customer_handover; accepted_service"
      record_type: "foreground_records"
      raw_fields: "pool_id; configuration; ISBN; imprint; edition; printing; binding; pages; condition; original_id; event_id; crossing_id; event_date; first_receipt_gate; direction; recipient; state; crossing_count; acceptance_state; revocation_reason; financial_only; opening_saleable; opening_held_count; first_receipts; returns_count; closing_saleable; closing_held_count; handovers_count; loss_count; closure; final_acceptance_state"
      collection_method: "Scan original physical copy IDs at each receiving/sale/return crossing, reconcile daily counter logs to signed acceptance and stock counts; ISBN alone is not a copy ID. Inspect actual edition/condition, track refused/repeated and no-sale events. Retain actual chronology and late version replacements. Gross each-row crossing count / Q; final accepted distinct count gives Q, then accepted_service=1 per reference flow."
      unit: "Item(s)"
      frequency: "Every event/interval; daily reconciliation; on configuration/life change"
      temporal_coverage: "Whole pool and all linked original/history versions, no deletion of failed/closed/zero-sale periods"
      site_scope: "Named store, provider boundaries and actual all-beneficiary scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed receiver/acceptance records; daily stock reconciliation; immutable event version ledger"
    - protocol_id: cp_energy
      process_id: "counter"
      flow_role: "counter_ac"
      record_type: "foreground_records"
      raw_fields: "meter_id; circuit_topology; start/end timestamp; parent_kWh; active_kWh; standby_kWh; idle_kWh; all beneficiary IDs; active_seconds; reserved_seconds; E_attributed_kWh; supplier; voltage; geography; period; calibration; Q"
      collection_method: "Read calibrated true-energy meters each interval and at daily opening/closing; match time-stamped checkout and reservation records. Measure the full counter supply including scanner/terminal standby; test circuit inclusions before meter subtraction. Allocate complete disjoint source pools using allocate_counter; 3.6 * E_attributed_kWh / Q MJ per reference flow."
      unit: "kWh"
      frequency: "Every event/interval; daily reconciliation; on configuration/life change"
      temporal_coverage: "Whole pool and all linked original/history versions, no deletion of failed/closed/zero-sale periods"
      site_scope: "Named store, provider boundaries and actual all-beneficiary scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration and circuit audit; pool sum equals parent; all-beneficiary seconds ledger"
    - protocol_id: cp_residual
      process_id: "residual"
      flow_role: "supplier_return; internal_transfer; whole_book_waste"
      record_type: "foreground_records"
      raw_fields: "original_id; crossing_id; event_date; recipient; state; crossing_count; supplier_count; transfer_count; consignment_id; gross_kg; outer_tare_kg; waste_count; opening_held_kg; generation_kg; closing_held_kg; condemnation_count; closure; fate; Q"
      collection_method: "At each actual supplier/internal handoff count and sign complete copies. At actual waste dispatch weigh gross carrier and measured outer tare using calibrated scale; include real bound book constituents, inspect for nonbook contamination and separate it. Daily retain held-waste count and kg; reconcile condemnation and dispatch without subtracting twice. Removed-cover or separated-page routes need new cards before completeness. Direct dispatch kg / Q for whole_book_waste; actual gross handoff counts / Q for supplier_return and internal_transfer. No physical exchange for ownership change alone."
      unit: "kg; Item(s)"
      frequency: "Every event/interval; daily reconciliation; on configuration/life change"
      temporal_coverage: "Whole pool and all linked original/history versions, no deletion of failed/closed/zero-sale periods"
      site_scope: "Named store, provider boundaries and actual all-beneficiary scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale checks; tare evidence; signed consignment and destination/state records; physical no-event evidence if absent"
    - protocol_id: cp_background
      process_id: "counter"
      flow_role: "accepted_service"
      record_type: "foreground_records"
      raw_fields: "original_id; source_id; version; first gate; supplier_original_quantity; supplier_original_denominator; G_i; H_i; complete book BOM; whole-package exclusions; raw source quantities; S; F; O; T; recipient_signature; late-event replacement; Q"
      collection_method: "Collect actual supplier complete-book production and first inbound inventory before attaching background; independently verify edition, physical copy, full component coverage and original denominators. Reconcile every original source to one current fate and signed continuing ownership. Review each closure and late event; unresolved quantities or identities stay explicit. Retain G/H raw compatible vectors by original ID; apply original_background once, with S and F both excluded from the partial cards; F enters incremental-service completion once."
      unit: "source-native units"
      frequency: "Every event/interval; daily reconciliation; on configuration/life change"
      temporal_coverage: "Whole pool and all linked original/history versions, no deletion of failed/closed/zero-sale periods"
      site_scope: "Named store, provider boundaries and actual all-beneficiary scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier original inventory and complete model/BOM evidence; original route records; signed responsibility ledger"
    - protocol_id: cp_support
      process_id: "counter"
      flow_role: "accepted_service"
      record_type: "foreground_records"
      raw_fields: "module_id; source_id; version; boundary; operation/presence survey; provider-covered scopes; normalized_value_jm; original_denominator_m; raw_numerator; X_jk; d_bjk; all beneficiary IDs; driver_unit; trip/segment s; X_s; r_sb_kg; t_sb_h; capacity_kg; utilized_kg; route_reservation_kg; loaded_km; empty_km; idle_h; P_j; opening_source_j; unused_return_j; held_source_j; final_liquid_source_j; final_wipe_source_j; spill_source_j; other_final_source_j; container_dispatch_residue_source_j; container_held_residue_source_j; original_container_id; original_container_dispatch_date; original_container_closure_date; original_container_gross_dispatch_kg; original_container_external_tare_kg; original_container_with_residue_net_kg; mains_volume; water_density; liquid_gross_kg; liquid_container_tare_kg; wet_wipe_kg; cloth_cleaned_m2; cloth_lifetime_m2; bucket_reserved_h; bucket_lifetime_h; carton_model; carton_BOM; carton_count; carton_net_kg; carton_carrier_dispatch_kg; shipment_reserved_kg; shipment_reserved_h; Q"
      collection_method: "Survey actual store, packaging, digital provider and routes at start/change; collect full declared-cycle meters and all-beneficiary physical drivers each interval, every trip/idle event and supplier inventory originals. Record presence/absence evidence and package exclusions; unknown methods block full completion. At each actual original-container dispatch, use a calibrated scale for gross complete container-plus-residue carrier kg and external transport tare kg, retain original container ID and dispatch date, and independently determine formulation-origin residue kg from traceable formulation/mass records. At closure record retained-container residue source kg separately; reconcile these disjoint source quantities to other_final_source_j and held_source_j respectively without scaling direct carrier kg. Obtain signed whole-site and landlord no-fuel/no-purchased-thermal/no-refrigerant evidence under boundary_ambient; positive/unknown presence is inapplicable. Apply allocate_cleaning source-kg, direct whole-carrier-kg and all-life cloth/bucket methods, and allocate_incoming_carton complete-package/BOM and measured-carrier method; actual cleaning identities/carriers need named atomic cards/protocols before integration. Restore and allocate unallocated source numerators using allocate_support, allocate_transport, allocate_cleaning and allocate_incoming_carton, deduplicate then complete_modules, divide final Q once."
      unit: "source-native units; same-unit drivers"
      frequency: "Every event/interval; daily reconciliation; on configuration/life change"
      temporal_coverage: "Whole pool and all linked original/history versions, no deletion of failed/closed/zero-sale periods"
      site_scope: "Named store, provider boundaries and actual all-beneficiary scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/route reconciliation; empty/idle provider evidence; all-department denominator; original source-ID overlap matrix"
    - protocol_id: cp_assets
      process_id: "counter"
      flow_role: "accepted_service"
      record_type: "foreground_records"
      raw_fields: "asset_id; actual model; package scope; source_id; version; X_a; manufacture/install quantity; acquisition date; all historical beneficiaries; e_ab; exposure_unit; L_a; life_version; old allocations; repair/replacement event IDs; retirement_date; terminal_net_kg; removed-parts mode; final residual; Q"
      collection_method: "Read signed supplier whole-asset inventories/BOM and actual installation records; log reservation exposure every interval including idle, across all beneficiaries for the whole life. Reassess life on real events, replace all historic versions and weigh terminal complete assets separately from event-based removed parts using calibrated scale. Use allocate_asset independently per same-unit asset ledger, then restore compatible numerator by complete_modules and divide Q once."
      unit: "m2*h; m3*h; h; kg; source-native units"
      frequency: "Every event/interval; daily reconciliation; on configuration/life change"
      temporal_coverage: "Whole pool and all linked original/history versions, no deletion of failed/closed/zero-sale periods"
      site_scope: "Named store, provider boundaries and actual all-beneficiary scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "All-life source allocation checksum; life-version replacement audit; actual terminal net mass; signed complete-package exclusions"
  calculation_rules:
    - id: service_count
      applies_to: "accepted_service"
      rule: "Q = count distinct original IDs with final valid acceptance; output accepted_service = 1 Item(s) per reference flow when Q>0. Use allocate_events without a second revocation subtraction."
      inputs:
        - original_id
        - final_acceptance_state
        - closure
        - cp_events
      output: "Q; accepted_service"
      source_ids: []
    - id: custody_normalize
      applies_to: "original_receipt; customer_return; customer_handover; supplier_return; internal_transfer"
      rule: "Each custody row amount = its gross physical crossing count / Q; count actual repeated crossings, but never infer Q or another manufacturing input from these counts."
      inputs:
        - crossing_id
        - original_id
        - direction
        - recipient
        - state
        - crossing_count
        - Q
        - cp_events
        - cp_residual
      output: "custody_Item(s)_per_reference"
      source_ids: []
    - id: energy_normalize
      applies_to: "counter_ac"
      rule: "E_MJ = 3.6 * E_attributed_kWh; row amount = E_MJ / Q after allocate_counter, with upstream supply attached once using actual provider/geography/period."
      inputs:
        - parent_kWh
        - active_kWh
        - standby_kWh
        - idle_kWh
        - active_seconds
        - reserved_seconds
        - E_attributed_kWh
        - Q
        - cp_energy
      output: "MJ_per_reference"
      source_ids: []
    - id: waste_normalize
      applies_to: "whole_book_waste"
      rule: "W_kg = sum actual consignment gross_kg - actual outer_tare_kg; row amount = W_kg / Q. Waste generation + opening held waste - closing held waste is an independent reconciliation, not another correction to W_kg."
      inputs:
        - consignment_id
        - gross_kg
        - outer_tare_kg
        - waste_count
        - opening_held_kg
        - generation_kg
        - closing_held_kg
        - Q
        - cp_residual
      output: "kg_per_reference"
      source_ids: []
    - id: stock_balance
      applies_to: "original_receipt; customer_return; customer_handover; supplier_return; internal_transfer; whole_book_waste"
      rule: "Choose total-custody count ledger: opening saleable+held-waste count + first receipts + physical customer returns = closing saleable+held-waste count + gross customer handovers + actual supplier handoffs + internal transfers out + waste dispatch book count + evidenced physical losses. Condemnation stays inside custody and is not another subtraction; F/S/O/T ownership and Q remain separate."
      inputs:
        - opening_saleable
        - opening_held_count
        - first_receipts
        - returns_count
        - closing_saleable
        - closing_held_count
        - handovers_count
        - supplier_count
        - transfer_count
        - waste_count
        - loss_count
        - cp_events
        - cp_residual
      output: "count_reconciliation"
      source_ids: []
    - id: original_background
      applies_to: "accepted_service"
      rule: "For each original receiving ID i, choose exactly one S/F/O/T. F_vector=sum_F(G_i+H_i); excluded_S_vector=sum_S(G_i+H_i). Original vectors reconcile S+F+O+T to all original sources, without multiplying by custody counts or a second composition/fate fraction. The partial card set excludes F_vector and excluded_S_vector. Incremental-service completion adds F_vector/Q once; product-plus-service adds excluded_S_vector/Q once in addition."
      inputs:
        - original_id
        - G_i
        - H_i
        - supplier_original_quantity
        - supplier_original_denominator
        - source_id
        - version
        - final_fate
        - Q
        - cp_background
      output: "F_vector; excluded_S_vector; O_vector; T_vector"
      source_ids: []
    - id: complete_modules
      applies_to: "accepted_service"
      rule: "For every compatible exchange j, restore each external module m to its evidenced raw source pool using N_jm = normalized_value_jm * original_denominator_m (or retain an already raw numerator). Apply only unallocated causal shares from allocate_support/allocate_transport/allocate_asset/allocate_cleaning/allocate_incoming_carton. Deduplicate exact original source IDs/boundaries/versions against G/H, counter energy, provider-contained operations and waste; replace old versions. Sum compatible same-direction/type/identity/property/unit numerators row by row with F_vector, then divide once by common final Q. Do not add kg to MJ, raw to normalized values, or multiply provider-attributed data by another share. New actual exchanges require named atomic cards, protocols and bilingual sync before complete dataset status."
      inputs:
        - module_id
        - source_id
        - version
        - boundary
        - normalized_value_jm
