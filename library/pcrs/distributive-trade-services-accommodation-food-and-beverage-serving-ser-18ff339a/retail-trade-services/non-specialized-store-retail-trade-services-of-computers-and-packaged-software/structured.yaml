allocation_rules:
  - rule_id: a_pool
    applies_to: "all inventory rows"
    rule: "Prospectively fix one configuration, site, receiving-gate scope and observation period pool, retaining every failed/closed/idle/zero-sale subcohort. Q is count of distinct original serials with final-valid qualified acceptance at cutoff; reacceptance of same serial counts once, actual revocation removes validity even without physical return, financial adjustment with valid acceptance does not. Q=0 is explicitly unnormalizable, retains raw burdens and must not be deleted or pooled retrospectively for convenience. Late returns replace original pool versions of Q, F/S/T/O and all numerators at actual event dates; they do not charge the new cohort again."
    source_ids:
      - ghg-product2011
  - rule_id: a_shared
    applies_to: "store_ac"
    rule: "Measure disjoint circuit electricity first. Where a parent contains a child circuit subtract it once; independent meters are not subtracted. Split residual measured kWh source pools into active equipment, reserved idle/fixed equipment and facility fixed components with complete sums matching parent; never sum unlike drivers. Active equipment uses logged occupied equipment-seconds; its idle/fixed pool uses measured reserved equipment-seconds across all beneficiaries including failed/empty reservations. Lighting/fan/facility pools use disjoint served floor-area m2 times actual duration h across all beneficiaries including empty reservations. For each source c and pool h, w_c_h=d_c_h/sum_all_h(d_c_h), E_h=sum_c(E_c*w_c_h). Positive source with zero/unknown total driver blocks completeness. Preserve closures and avoid repeating digital-module electricity already covered by provider."
    source_ids:
      - ghg-product2011
  - rule_id: a_assets
    applies_to: "custody; checkout; residual"
    rule: "For every actual homogeneous asset model/BOM/stage vector V_a, collect e_recorded_a_h in its ORIGINAL beneficiary pool: measured reserved device-hours for checkout/ICT/handling equipment and powered lighting/fan fixtures, each separate homogeneous model/source pool; served m2*h for building shell/passive fixed structures/shelving, in separate same-unit pools; actual cleaned m2 for a reusable wiping asset. Define matching expected lifetime exposure L_a in the same unit, f_a_h=e_recorded_a_h/L_a, retaining cumulative fractions<=1; neither nominal life nor expected exposures replace recorded numerator. At retirement E_actual_a=sum_all_h(e_actual_a_h) over ALL historical beneficiaries, f_final_a_h=e_actual_a_h/E_actual_a. Every lifetime/vector revision replaces all historic records with delta_a_h=f_new_a_h*V_new_a-f_old_a_h*V_old_a. A residual fraction is QA, never a shortcut for changed exposures. Separate manufacture at dispatch, installation, maintenance events and retirement; whole-package included stages exclude duplicate modules. A demonstrator converted from original goods transfers the SAME original V_s to T and asset ledger, never full F plus new manufacture; removed original packaging and all asset transport follow the same versioned historical fractions."
    source_ids: []
  - rule_id: a_digital
    applies_to: "custody; checkout"
    rule: "For an internet provider interval i retain unique actual start/end, sourceh_i and all reserved endpoint-connection seconds r_i_h; n_i_h=sourceh_i*r_i_h/sum_all_h(r_i_h), including failed/empty reservations. Intervals never overlap or also become another active/idle/fixed source-hour. One payment authorization or administrative batch event j is retained once; measured actual processing seconds of its disjoint lines give p_j_h=t_j_h/sum_all_h(t_j_h), sum_h(p_j_h)=1, and allocate that event vector once. Internet does not cover unrelated backend processing. Camera source capture map uses timestamped actual field-of-view beneficiary footprint area times covered duration, disjoint zone/time, all beneficiaries/empty reservations, frozen original map/version; For each original capture zone/interval i, camera_fraction_i_h=(capture_area_m2_i_h*capture_duration_h_i_h)/sum_all_h(capture_area_m2_i_h*capture_duration_h_i_h). Allocate its capture-source vector by that fraction once; retention_source_i_h=(captured_bytes_i*retention_h_i)*camera_fraction_i_h with the original map despite later sale/retention. Collect real bytes and durations; 1GB=10^9bytes and1GiB=2^30bytes. Unknown scope/positive source with zero driver blocks completion. Skip owner allocation only for evidence already attributed to exact final owner/pool/version; provider interval/consignment attribution alone does not suffice."
    source_ids: []
  - rule_id: a_transport
    applies_to: "receive; custody; checkout; residual"
    rule: "Keep trip/segment c -> actual consignment/material/asset s -> final owner/pool/version h. Loaded source q_c uses one evidenced binding capacity: actual m_s/sum(m_s) for a demonstrated mass-constrained segment or v_s/sum(v_s) for demonstrated volume constraint, with measured gross mass/occupied volume and vehicle loading evidence; unknown/other binding constraint requires review and blocks complete use. Empty return source and stationary idle source are separately positive, allocated by measured reserved capacity*h with actual empty travel/idle duration and all beneficiaries; zero distance never erases idle fuel. q_h=sum_c_s(q_c*w_c_s*owner_s_h). Provider consignment-attributed q_c_s skips w only; source already assigned exact final owner/pool/version skips owner only. For goods inbound at receiving gate use original S/F/T/O: service includes F inbound once, S follows separate GOODS, T/O retain source responsibility. First-use supplies (including outer transit packaging not already in supplier scope) and asset/maintenance/retirement transport follow respective original owner fractions; asset transport is corrected over all historical beneficiaries. Exclude transport already included in original supplier/manufacturing/treatment package."
    source_ids:
      - ghg-product2011
  - rule_id: a_cleaning
    applies_to: "custody; residual"
    rule: "Completion for actual cleaning first adds one card per actual complete formulation input, entry water, reusable cloth/model and actual wet waste carrier. Fix each homogeneous original formulation source b by supplier lot, original measured net formulation m_b kg and manufacturing-at-dispatch vector V_b. V_b/m_b is its kg-basis background; signed source scope must state whether original bottle/closure/label manufacture is included, and excluded packaging needs its own actual source card without overlap. Keep the original source and all historical beneficiary pools through first use and final disposal. At each cutoff/version v, original-source conservation is m_b=sum_j(M_b_j_v)+confirmed_missing_b_v+signed_source_residual_b_v. M_b_j_v are mutually exclusive ORIGINAL formulation-origin kg, classified by actual final state and original owner: cumulative used-exported, spilled-exported, rinsate-origin-exported, dispatched-container-residue, measured other final export, currently retained-in-use, currently retained-opened-or-damaged residue, never-used-undamaged-factory-sealed stock, unused supplier return and unused onward transfer. Retained unused source can remain unassigned even when opened; the operational state and unassigned/first-use owner are independent recorded fields. Export totals accumulate from original receipt, while held states use current measured stock: do not drop earlier exports each period or count an intermediate used->rinsed/retained state twice. Every new event or correction replaces the affected original state/version, preserving source ID and all earlier event IDs; revise all affected historical owner records instead of recharging the current period. Apply c_clean_source for manufacture/inbound ownership. Never add newly introduced rinse water/dirt as formulation kg. Imports already exclude reuse: do not subtract reuse. Direct full-liquid dispatch mass is actual metered V_discharge*rho at measured temperature/composition or net weighing; no stock/evaporation deduction from direct dispatch. Whole wet cloth/container/liquid carriers require receiver acceptance of actual constituents and matching treatment; separate carriers are disjoint. Actual unknown fate/source residual blocks completeness. Add actual emission cards only with measured species/path/exterior medium; internal air and product labels never establish environmental discharge."
    source_ids: []
  - rule_id: a_carriers
    applies_to: "kit_waste; carton_waste; wrap_waste"
    rule: "Keep three distinct levels: actual same-state carrier/consignment total -> original source s within that carrier -> final owner/original pool/version h. Use exclusive direct_exact or source_share mode. In direct_exact, allocated_i_h=exact_owner_net_kg_i_h, the actual measured net kg already evidenced for that precise original source and final owner/original pool/version; do not multiply another source or owner fraction. In source_share, a_i_s=measured_source_origin_same_state_kg_i_s/sum_all_s(measured_source_origin_same_state_kg_i_s), sum_s(a_i_s)=1 and the complete sum of those source-origin kg reconciles to actual gross_kg_i-tare_kg_i. Then allocated_i_h=(gross_kg_i-tare_kg_i)*a_i_s*owner_s_h. Provider attribution to the carrier/consignment TOTAL does NOT remove a_i_s: the carrier can contain several original sources/SKUs. Only evidence already assigned to that particular original source permits provider_source_net_kg_i_s*owner_s_h without another a_i_s; only evidence assigned to the exact final owner/original pool/version permits skipping the already-proven owner factor. Record provider_attribution_level and its original-source/owner/pool/version evidence. Positive unassigned or unknown original-source/owner portions block completeness; retain them explicitly, never default zero or renormalize known shares to hide them. No additional composition/stock correction. Actual carrier treatment covers that whole carrier; separately modelled source components cannot repeat it. Outer cartons/film already used by supplier retain original supplier source-stage ownership; unwrapping never creates a new first use or another manufacture. Retailer-new supplies follow first actual use, unused stock/transfers carry their unassigned source."
    source_ids: []
  - rule_id: a_completion
    applies_to: "all inventory rows"
    rule: "Complete one compatible exchange/property/unit at a time: retain core raw numerator C_x_h (including failed_pack N_F and store_ac MJ, never their already divided display), external raw module R_x_k_h directly, or normalized external z_x_k_h restored by its evidenced ORIGINAL D_k_h. N_complete_x_h=C_x_h+sum_k(R_x_k_h)+sum_k(z_x_k_h*D_k_h); q_complete_x_h=N_complete_x_h/Q_h once. Raw and normalized modes are exclusive per original source ID. Apply still-missing final owner attribution before addition under a_assets/a_digital/a_transport. Verify source constituent/time/object/stage disjointness and original version; do not add kg to MJ, combine heterogeneous asset Items, lose included F/AC, repeat F or divide a module by Q twice. Report all missing atomic rows and completeness blockers."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receiving
      process_id: "receive"
      flow_role: "failed_pack"
      record_type: "Serial and source ledger"
      raw_fields: "source_id; original_serial; actual_part_number; hardware_revision; lot; region; seal_photo; original_BOM; contained_cell_state; N_source_s; S_s; F_s; T_s; O_s; V_s; final_owner; original_pool; pool_version; G_open; receipts; customer_returns; internal_in; gross_customer_handover; initially_accepted; never_accepted; supplier_handover; internal_out; condemnation_count; confirmed_missing_count; observed_G_close; event_id; cutoff"
      collection_method: "Responsible receiving officer scans each actual serial/lot, documents complete original package and changed state, independently weighs source/transport packaging if needed; supplier-signed manufacturing dispatch vector and inbound stage map must reconcile to actual configuration. Count inventory at both cutoffs and follow every original source through return/resale."
      unit: "Item(s) and separate kg evidence"
      frequency: "Every event and both cutoffs"
      temporal_coverage: "Full original pool and late corrections"
      site_scope: "Receiving dock and original supplier gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed serial counts/BOM/vector boundaries; calibrated scale if used; officer and reviewer signature"
    - protocol_id: cp_checkout
      process_id: "checkout"
      flow_role: "retail_service"
      record_type: "Acceptance ledger"
      raw_fields: "original_serial; acceptance_event; final_valid_serials; revocation_event; physical_return_event; financial_only_event; gross_customer_handover; initially_accepted; never_accepted; cutoff; pool_version; actual_site; mixed_assortment; seal_state; power_on_history"
      collection_method: "Checkout officer matches serial/configuration, factory seal and complete listed contents from supplier receiving evidence; records actual handover and qualified acceptance separately from payment. No opening/power-on check is performed as sealed acceptance. Audit late revocations and actual returns separately."
      unit: "Item(s)"
      frequency: "Every attempt and cutoff review"
      temporal_coverage: "Whole declared pool including failed attempts"
      site_scope: "Named actual mixed-assortment store handover point"
      aggregation_rule: "per reference flow"
      quality_evidence: "Time-stamped acceptance/return ledger, actual site assortment and no-operation evidence; responsible cashier/reviewer"
    - protocol_id: cp_electricity
      process_id: "custody"
      flow_role: "store_ac"
      record_type: "Metered electricity and driver intervals"
      raw_fields: "circuit_id; source_id; start; end; E_kWh_c; meter_unit; parent_contains_child; occupied_equipment_seconds; reserved_equipment_seconds; served_area_m2; duration_h; d_c_h; w_c_h; provider_included_scope; original_pool; pool_version"
      collection_method: "Meter each disjoint receiving/holding/checkout supply circuit, include idle/closed intervals; operator maps parent/child boundary and logs every actual beneficiary reservation/served zone. Record supply geography/voltage/provider separately; check meter calibration, clock alignment and full source reconciliation."
      unit: "kWh; equipment s; m2*h"
      frequency: "Continuous interval data and period reconciliation"
      temporal_coverage: "Full pool including zero-sale/idle"
      site_scope: "Named circuits at actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration/unit log, circuit map, all-beneficiary driver schedule, accountable facilities officer"
    - protocol_id: cp_fates
      process_id: "residual"
      flow_role: "supplier_sealed; external_sealed; external_opened; kit_waste; carton_waste; wrap_waste"
      record_type: "Recipient state and terminal consignment ledger"
      raw_fields: "event_id; original_serial; actual_recipient; actual_state; physical_handover_count; sealed_retained_count; opened_complete_retained_count; gross_kg; tare_kg; carrier_type; carrier_mode; attribution_level; measured_source_origin_same_state_kg_i_s; a_i_s; owner_s_h; source_id; final_owner; original_pool; pool_version; carrier_state; receiver; consignment_id; W_open; generated_kg; received_waste_kg; dispatched_kg; internal_waste_transfer_kg; confirmed_waste_missing_kg; observed_W_close; condemnation_count; generated_kit_kg; provider_attribution_level; provider_original_source_id; provider_final_owner; provider_original_pool; provider_pool_version; provider_source_net_kg_i_s; exact_owner_net_kg_i_h; unknown_source_origin_kg; unknown_owner_kg"
      collection_method: "Returns officer records each actual recipient and sealed/opened complete-kit state. Waste officer directly weighs each entire dispatched same-state carrier with calibrated scale and measured tare, keeps outer corrugated cartons and PE film disjoint from original retail package. Receiver signs actual constituents/contained-cell state and treatment/transport boundary. No default waste classification or license-only acceptance."
      unit: "Item(s); separate kg"
      frequency: "Every state/event/consignment and cutoff"
      temporal_coverage: "Original pool plus later recipient corrections"
      site_scope: "Store return/held-waste zone and named receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/tare calibration, signed manifests, recipient treatment model, count-kg event map; responsible waste officer"
    - protocol_id: cp_support
      process_id: "custody"
      flow_role: "store_ac"
      record_type: "Mandatory completion source ledger"
      raw_fields: "source_id; stage; object_model; actual_BOM; original_unit; original_denominator; mode; source_boundary; included_stages; provider_included_scope; final_owner; original_pool; pool_version; e_recorded_a_h; L_a; e_actual_a_h; E_actual_a; V_old_a; V_new_a; f_old_a_h; f_new_a_h; sourceh_i; interval_start; interval_end; endpoint_id; r_i_h; t_j_h; event_line_id; capture_area_m2; capture_duration_h; capture_area_m2_i_h; capture_duration_h_i_h; captured_bytes_i; retention_h_i; capture_map_version; captured_bytes; retention_h; trip_c; segment_c; q_c; w_c_s; owner_s_h; attribution_level; m_s; v_s; capacity_constraint_evidence; reserved_capacity; empty_duration_h; idle_duration_h; formulation_source_kg; final_source_state; gross_kg; tare_kg; V_discharge; rho; measured_temperature; C_x_h; R_x_k_h; z_x_k_h; D_k_h; Q; absence_register; formulation_source_id; original_supplier_lot; m_b; V_b; I_b; source_scope_version; packaging_included_scope; original_receipt_date; cutoff_version_v; source_event_id; source_portion_id; state_before; state_after; original_owner; owner_assignment_status; M_b_j_v; cumulative_export_origin_kg; current_retained_origin_kg; unused_supplier_return_origin_kg; unused_transfer_origin_kg; confirmed_missing_b_v; signed_source_residual_b_v; virgin_first_use_withdrawal_kg; irreversible_pre_use_loss_kg; unused_condemnation_kg; g_first_b_h; G_first_b_h; f_b_h; f_old_b_h; f_new_b_h; V_old_b; V_new_b; actual_event_date; prior_source_version"
      collection_method: "Facilities/IT/accounts/logistics officers jointly capture original records for a_assets/a_digital/a_transport/a_cleaning/c_clean_source; use calibrated meters/scales, synchronized event clocks, measured space/time and provider constituent boundaries. This custody view retains the source matrix; every added atomic card receives a matching single-process view, never a multi-process protocol cell. Raw quantities retain original units; authors add bilingual cards and recompute before completeness.  Record original net formulation kg using calibrated mass records, each source-origin portion/state/owner transition and all historical first-use events; reconcile original receipt to cumulative exports plus current stocks, signed losses and unresolved residuals."
      unit: "Actual unit per homogeneous source; seconds; m2*h; bytes*h; kg; m3"
      frequency: "Every event/interval; each lifetime version and final retirement"
      temporal_coverage: "All original historical beneficiaries and observation periods"
      site_scope: "Actual store plus supplier/backend/transport/receiver boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed matrix, calibration, original models, all-beneficiary shares, historic replacement deltas and reviewer evidence"
  calculation_rules:
    - id: c_accept
      applies_to: "retail_service"
      rule: "Q=count_distinct(final_valid_serials); output=Q/Q only when Q>0. Valid set is already corrected; do not subtract revoked IDs again."
      inputs:
        - final_valid_serials
        - original_serial
        - acceptance_event
        - revocation_event
        - physical_return_event
        - financial_only_event
        - cutoff
        - pool_version
        - cp_checkout
      output: "One accepted retail service"
      source_ids: []
    - id: c_goods_balance
      applies_to: "failed_pack"
      rule: "Goods-only count balance: G_close=G_open+receipts+customer_returns+internal_in-gross_customer_handover-supplier_handover-internal_out-condemnation_count-confirmed_missing_count; signed_goods_residual=observed_G_close-G_close. gross_customer_handover partitions initially_accepted and never_accepted exits without overlap. Revocation without movement is no second exit. Condemnation changes goods to held waste; dispatch is not another goods subtraction."
      inputs:
        - G_open
        - receipts
        - customer_returns
        - internal_in
        - gross_customer_handover
        - initially_accepted
        - never_accepted
        - supplier_handover
        - internal_out
        - condemnation_count
        - confirmed_missing_count
        - observed_G_close
        - original_serial
        - event_id
        - cp_receiving
      output: "Independent goods-count reconciliation"
      source_ids: []
    - id: c_source
      applies_to: "failed_pack"
      rule: "For original supplier source s, N_source_s=S_s+F_s+T_s+O_s; N_F=sum_s(F_s); failed_pack=N_F/Q. Keep actual F source-equivalent original package counts separate from physical return/recipient counts and waste kg. Retained externally without valid service remains F unless signed continuing T responsibility is established. Original complete vector V_s and original inbound source follow b_goods/a_transport."
      inputs:
        - N_source_s
        - S_s
        - F_s
        - T_s
        - O_s
        - V_s
        - source_id
        - original_serial
        - final_owner
        - original_pool
        - pool_version
        - Q
        - cp_receiving
      output: "Original whole-package production input per reference flow"
      source_ids: []
    - id: c_energy
      applies_to: "store_ac"
      rule: "E_MJ=3.6*sum_c(E_kWh_c*w_c_h); store_ac=E_MJ/Q. Apply a_shared to full metered pools; do not derive electricity from155W, CPU throughput or RAM/SSD capacity."
      inputs:
        - E_kWh_c
        - circuit_id
        - parent_contains_child
        - occupied_equipment_seconds
        - reserved_equipment_seconds
        - served_area_m2
        - duration_h
        - d_c_h
        - w_c_h
        - Q
        - cp_electricity
      output: "Attributable measured MJ per reference flow"
      source_ids: []
    - id: c_custody
      applies_to: "supplier_sealed; external_sealed; external_opened"
      rule: "Each satellite amount=sum(actual distinct physical event counts of its stated recipient/state)/Q. supplier handoff, sealed external retention and opened complete-kit external retention are disjoint event/state records. Background T/F labels do not create movements; physical customer handover with accepted service is in raw checkout ledger only."
      inputs:
        - event_id
        - original_serial
        - actual_recipient
        - actual_state
        - physical_handover_count
        - sealed_retained_count
        - opened_complete_retained_count
        - Q
        - cp_fates
      output: "Physical satellite counts per reference flow"
      source_ids: []
    - id: c_waste
      applies_to: "kit_waste; carton_waste; wrap_waste"
      rule: "D_carrier=sum(allocated_i_h) from a_carriers; D_kit/D_carton/D_wrap are respectively its kit/carton/wrap carrier_type values; amount=D_carrier/Q. No retained/reused stock deduction from directly dispatched kg. Independently W_close=W_open+generated_kg+received_waste_kg-dispatched_kg-internal_waste_transfer_kg-confirmed_waste_missing_kg; signed_waste_residual=observed_W_close-W_close. Actual kit condemnation_count links measured generated_kit_kg by event, never equating Item(s) to kg. Missing waste is not fictional dispatch/treatment."
      inputs:
        - gross_kg
        - tare_kg
        - carrier_type
        - carrier_mode
        - attribution_level
        - measured_source_origin_same_state_kg_i_s
        - a_i_s
        - owner_s_h
        - source_id
        - final_owner
        - original_pool
        - pool_version
        - carrier_state
        - receiver
        - consignment_id
        - W_open
        - generated_kg
        - received_waste_kg
        - dispatched_kg
        - internal_waste_transfer_kg
        - confirmed_waste_missing_kg
        - observed_W_close
        - condemnation_count
        - generated_kit_kg
        - event_id
        - Q
        - cp_fates
        - provider_attribution_level
        - provider_original_source_id
        - provider_final_owner
        - provider_original_pool
        - provider_pool_version
        - provider_source_net_kg_i_s
        - exact_owner_net_kg_i_h
        - unknown_source_origin_kg
        - unknown_owner_kg
      output: "Direct dispatch kg and separate typed waste-stock check"
      source_ids: []
    - id: c_clean_source
      applies_to: "custody; residual"
      rule: "For each original formulation source b, g_first_b_h is newly assigned original kg = virgin first-use withdrawal + irreversible pre-use spill/loss + unused-source condemnation, using disjoint event/portion IDs; a withdrawn portion spilled or rinsed later never enters g_first again. G_first_b_h=sum_original_history(g_first_b_h); f_b_h=G_first_b_h/m_b, sum_all_h(G_first_b_h)<=m_b. Remaining unassigned unused stock/return/transfer keeps its original manufacturing/inbound responsibility with its named continuing owner. The actual formulation Product input is G_first_b_h/Q kg with background V_b/m_b; equivalent raw manufacturing burden f_b_h*V_b is a calculation check, NEVER another input or second multiplier. Original inbound source I_b follows the SAME f_b_h, unless evidence already assigns exact final owner/original pool/version; transport consignment-only attribution does not remove that owner fraction. Reuse/retained/rinsed descendants retain their first-use owner and never repeat manufacture/inbound. For any source mass/vector/ownership correction replace every affected historical allocation by delta_b_h=f_new_b_h*V_new_b-f_old_b_h*V_old_b and replace inbound analogously; record actual event date and original version. Final source-state conservation uses a_cleaning, not a current-period-only balance. All raw manufacture/inbound numerators enter a_completion before one Q."
