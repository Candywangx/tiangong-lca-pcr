system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_scope
      applies_to: "receive; custody; checkout; residual"
      rule: "Apply to new complete compact desktop-computer packages, unused and factory-sealed at customer acceptance, in the declared mixed-store channel. Any manufacturer, processor architecture, memory/storage capacity, colour or regional supply configuration is eligible within this physical product family, using separate homogeneous BOM/source strata. Record actual part number, hardware/firmware revision, serial, region and lot. Verify the actual processor, board, memory, storage, enclosure, power supply or adapter, cord, contained cells, accessories, inserts, labels, inks, adhesives and closures as one complete original supplier BOM; no component is inferred present or absent from the specimen. Preinstalled operating-system/application provisioning is not a second retail output. Additional actual components require specific cards where they are separately represented; never duplicate an included supplier stage."
      source_ids:
        - apple-mini-spec
    - rule_id: b_channel
      applies_to: "receive; checkout"
      rule: "Start at store receiving custody gate, end at documented physical customer handover and valid acceptance, retaining later corrections. Actual site must sell a mixed non-specialized assortment, with dated floor plan, assortment and warehouse transaction evidence for this configuration. The retained Costco menu demonstrates mixed product categories only; it establishes neither the actual desktop-computer configuration nor local availability. Actual named-branch stock and onsite handover for this configuration require field evidence. This is a narrower hardware route within CPC3.0 62184 goods452, not the whole452/478 leaf. Classification acceptance remains governed by external mapping and ADR records."
      source_ids:
        - un-cpc62184
        - costco-mixed-mini
    - rule_id: b_core
      applies_to: "all inventory rows"
      rule: "The partial incremental core includes failed original-package production responsibility failed_pack, isolated store operational electricity store_ac, retail output retail_service, the explicitly named physical custody satellites supplier_sealed/external_sealed/external_opened, and actual terminal carriers kit_waste/carton_waste/wrap_waste. Only the three named Product custody satellites are non-characterized physical accounting outputs. Waste carriers require complete treatment. Original receipts and gross customer movement are raw QA, not additional characterized inputs. Failed_pack is a characterized Product input and is never excluded as custody. Complete service requires b_completion and a_completion; partial results must retain the partial label."
      source_ids: []
    - rule_id: b_goods
      applies_to: "failed_pack; retail_service"
      rule: "For every original homogeneous supplier package vector V_s at manufacturer dispatch, establish exclusive count-equivalent ownership S_s+F_s+T_s+O_s=N_source_s. S is finally valid accepted goods, F is confirmed lost/condemned/nonservice-retained goods whose original background remains charged to this service pool, T transfers original responsibility to a named continuing owner (including supplier-return owner or demonstrator asset), O is unresolved/open stock. Whole-package mode requires all constituents of each original unit to share that ownership. failed_pack=N_F/Q links the complete original manufacturing vector including original packaging, cord and factory provisioning exactly once. S production is excluded from this retail service; a distinct downstream GOODS system adds sum(S_s*V_s)/Q once. T and O cannot be relabelled zero burden. Missing supplier vector/BOM blocks quantified completeness."
      source_ids:
        - apple-mini-spec
    - rule_id: b_components
      applies_to: "failed_pack; kit_waste; external_opened"
      rule: "Opening, diagnostic use, charging, software download/activation, replacement, repacking, resale as used or component separation cannot count as sealed output. Record actual changed state and actual contained-cell condition; neither maximum155W nor CPU/memory/storage specifications establish measured electricity or complete LCI. Whole original damaged kit may remain one actual waste carrier only when receiver signs acceptance for the full actual constituents/state including contained cells and packaging with matching treatment boundary. If constituents acquire different S/F/T/O owners, first add specific component Product inputs using verified original supplier component vectors and actual component quantities/units; remove those exact vectors from failed_pack. Never split environmental vectors by arbitrary mass/count shares or duplicate an adapter/cord/cell already included."
      source_ids:
        - apple-mini-spec
    - rule_id: b_route_absence
      applies_to: "receive; custody; checkout; residual"
      rule: "Admit only electrically operated receiving/holding/checkout with no foreground combustion appliance, fuel handling, refrigerant-containing HVAC/cooling or on-site chemical cleaning in this core. Responsible operator shall inspect equipment register, all occupied/shared service spaces, service contracts and full-period event records and sign presence/absence by equipment/species/stage. Unknown is not absence. Real shared HVAC, fuel, cleaning, spill or additional carrier requires b_completion atomic expansion and route review before complete results; no default zero emission, leak or safe-handling approval follows from a specification."
      source_ids: []
    - rule_id: b_completion
      applies_to: "receive; custody; checkout; residual"
      rule: "Before any complete retail-service claim, complete a signed source/stage matrix covering building shell/fitout/lighting/fans, shelving/handling/checkout assets, ICT/network, payment backend, security camera/retention, administration, cleaning, capital manufacture/installation/maintenance/retirement and all required transport, plus outer transit packaging manufacture/first-use/inbound responsibility. Each actual homogeneous object/service/material/carrier must have named bilingual atomic cards, real process/direction/type, property/unit, amount, protocol, original vector and included-stage exclusions, synchronized before completeness. Existing complete signed packages can remain whole with their measured denominator and actual scope; constituent event/time/object overlap, not different provider IDs, decides deduplication. Apply a_shared/a_assets/a_digital/a_transport/a_cleaning/a_carriers/a_completion. Missing actual source or unknown condition blocks completeness rather than allowing modeller-selected methods."
      source_ids: []
