      output: "Compatible completed raw numerators then one common normalization"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Unbound flow identity remains row-specific and unverified. Before quantitative complete use obtain official direct original response plus matching hash receipt, observed state, bilingual names/qualifiers, type, property/unit chain and compartment; then match actual supplier/treatment background. Count/unit support does not establish service or package identity. AC historical identity does not establish current supply technology or geography."
      evidence: "Original records, signed completeness matrix and bilingual parser/read audit"
    - id: dq_quantities
      applies_to: "all inventory rows"
      requirement: "Actual field evidence, full pool coverage, responsible collector, dated site/period, calibration and signed reconciliation are required. Manufacturer specifications are configuration evidence only: no actual lot BOM, measured mass/energy, quantified LCI, environmental credit, safety/compliance approval or universal warehouse stock is inferred. All unknowns remain explicit; no invented range/default/factor."
      evidence: "Original records, signed completeness matrix and bilingual parser/read audit"
    - id: dq_completion
      applies_to: "receive; custody; checkout; residual"
      requirement: "Report partial core and missing modules until b_completion matrix, every actual atomic added card/protocol, signed no-combustion/refrigerant applicability, receiver treatment and a_completion source reconciliation are complete. A presence/absence checkbox without full equipment/period evidence is insufficient. Cross-language audit includes actual parsed fields, source use, rule scope, Inputs, units, negations and exceptions."
      evidence: "Original records, signed completeness matrix and bilingual parser/read audit"
validation_rules:
  - rule_id: v_accept
    applies_to: "retail_service; failed_pack"
    rule: "Reject homogeneous sealed service applicability when configuration/region/part number/seal/unused state or actual mixed-store handover is unknown; retain altered returns as explicit physical fate, never sealed output. Validate final-valid distinct set, physical handover partition, typed goods and waste balances, S/F/T/O conservation and zero-Q failure."
    source_ids: []
  - rule_id: v_sources
    applies_to: "all inventory rows"
    rule: "Check every card raw total -> fixed attribution -> one Q; protocol process/flow_role must contain its row. No AC background factor from a generic identity; no F omission or S duplication; direct dispatch and signed residuals remain independent. Nonzero unexplained residual, missing waste, changed component ownership or unknown receiver/provider scope prevents a complete result."
    source_ids: []
  - rule_id: v_completion
    applies_to: "all inventory rows"
    rule: "A complete-service result must pass b_completion and a_completion including all historic asset replacements, all-beneficiary digital/space drivers, empty/idle transport sources, complete actual treatment and precise source-stage deduplication. Candidate metadata/aligned translation and mechanically passing projection never establish scientific, translation-review or publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Partial incremental retail-service foreground dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same exact configuration/route core; completed service only after b_completion/a_completion; distinct GOODS may add S once"
  excluded_use: "Whole CPC leaf; standalone software/download/license; computing service; product-carbon-neutrality or safety claim; full business comparison from partial core"
  required_metadata: "b_scope; b_channel; Q; original pool/version; S/F/T/O; source/stage boundaries; actual BOM and source identities"
  required_quality_disclosure: "Partial scope/missing modules; unbound rows; unknowns; typed balance residuals; all-beneficiary/lifetime correction coverage"
  update_trigger: "Configuration/BOM/site/route/provider change; late return/revocation; asset-life revision/retirement; original evidence or identity change"
data_sources:
  - id: "un-cpc62184"
    type: "official_guidance"
    reference: "United Nations CPC Version3.0 subclass62184 explanatory note — https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62184"
    used_for: "Includes goods452 and478; narrower hardware scope only"
  - id: "apple-mini-spec"
    type: "standard"
    reference: "Apple, Mac mini(2024) Tech Specs — https://support.apple.com/en-us/121555"
    used_for: "Real configuration and box contents; stated specifications and limitations only, no quantified LCI/actual BOM/approval"
  - id: "costco-mixed-mini"
    type: "official_guidance"
    reference: "Costco, retained Compare Products page menu — https://www.costco.com/CompareProductsDisplay?partNumbers=4000225148"
    used_for: "Mixed product-category menu only; no Mac SKU/configuration or local-availability evidence; actual named-site route is a field gate"
  - id: "ghg-product2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard(2011), chapters6,7,9 — https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Service-unit and subdivision/physical-allocation concepts only; PCR equations are declared collection methods; no whole-standard conformity claim"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:da4773ad128fe0fe49d599881e897a8baf44af0a05a1028359ba27f995831949"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_3837"
      family: "system_boundary"
      span:
        start:
          offset: 3837
          line: 56
          column: 1
        end:
          offset: 12321
          line: 80
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual homogeneous original package received into store custody; manufacturer dispatch vector and inbound responsibility retained under b_goods |\n| starting_condition_role | Partial incremental retail service with explicit failed-goods background input |\n| product_classification_scope | narrower; b_channel; external accepted mapping authority |\n| recursive_input_rule | No recursive retail-service input; original whole-goods failed_pack remains characterized under b_core/b_goods |\n| upstream_dataset_requirement | Original supplier manufacturing-at-dispatch vectors and separately evidenced inbound transport; no specification-derived LCI |\n| disclosure | Partial core, missing sources/stages, actual scope, identity gaps, uncertainty and fixed completion duties |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_product_family | all inventory rows | This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval. |  |\n| b_scope | receive; custody; checkout; residual | Apply to new complete compact desktop-computer packages, unused and factory-sealed at customer acceptance, in the declared mixed-store channel. Any manufacturer, processor architecture, memory/storage capacity, colour or regional supply configuration is eligible within this physical product family, using separate homogeneous BOM/source strata. Record actual part number, hardware/firmware revision, serial, region and lot. Verify the actual processor, board, memory, storage, enclosure, power supply or adapter, cord, contained cells, accessories, inserts, labels, inks, adhesives and closures as one complete original supplier BOM; no component is inferred present or absent from the specimen. Preinstalled operating-system/application provisioning is not a second retail output. Additional actual components require specific cards where they are separately represented; never duplicate an included supplier stage. | apple-mini-spec |\n| b_channel | receive; checkout | Start at store receiving custody gate, end at documented physical customer handover and valid acceptance, retaining later corrections. Actual site must sell a mixed non-specialized assortment, with dated floor plan, assortment and warehouse transaction evidence for this configuration. The retained Costco menu demonstrates mixed product categories only; it establishes neither the actual desktop-computer configuration nor local availability. Actual named-branch stock and onsite handover for this configuration require field evidence. This is a narrower hardware route within CPC3.0 62184 goods452, not the whole452/478 leaf. Classification acceptance remains governed by external mapping and ADR records. | un-cpc62184; costco-mixed-mini |\n| b_core | all inventory rows | The partial incremental core includes failed original-package production responsibility failed_pack, isolated store operational electricity store_ac, retail output retail_service, the explicitly named physical custody satellites supplier_sealed/external_sealed/external_opened, and actual terminal carriers kit_waste/carton_waste/wrap_waste. Only the three named Product custody satellites are non-characterized physical accounting outputs. Waste carriers require complete treatment. Original receipts and gross customer movement are raw QA, not additional characterized inputs. Failed_pack is a characterized Product input and is never excluded as custody. Complete service requires b_completion and a_completion; partial results must retain the partial label. |  |\n| b_goods | failed_pack; retail_service | For every original homogeneous supplier package vector V_s at manufacturer dispatch, establish exclusive count-equivalent ownership S_s+F_s+T_s+O_s=N_source_s. S is finally valid accepted goods, F is confirmed lost/condemned/nonservice-retained goods whose original background remains charged to this service pool, T transfers original responsibility to a named continuing owner (including supplier-return owner or demonstrator asset), O is unresolved/open stock. Whole-package mode requires all constituents of each original unit to share that ownership. failed_pack=N_F/Q links the complete original manufacturing vector including original packaging, cord and factory provisioning exactly once. S production is excluded from this retail service; a distinct downstream GOODS system adds sum(S_s*V_s)/Q once. T and O cannot be relabelled zero burden. Missing supplier vector/BOM blocks quantified completeness. | apple-mini-spec |\n| b_components | failed_pack; kit_waste; external_opened | Opening, diagnostic use, charging, software download/activation, replacement, repacking, resale as used or component separation cannot count as sealed output. Record actual changed state and actual contained-cell condition; neither maximum155W nor CPU/memory/storage specifications establish measured electricity or complete LCI. Whole original damaged kit may remain one actual waste carrier only when receiver signs acceptance for the full actual constituents/state including contained cells and packaging with matching treatment boundary. If constituents acquire different S/F/T/O owners, first add specific component Product inputs using verified original supplier component vectors and actual component quantities/units; remove those exact vectors from failed_pack. Never split environmental vectors by arbitrary mass/count shares or duplicate an adapter/cord/cell already included. | apple-mini-spec |\n| b_route_absence | receive; custody; checkout; residual | Admit only electrically operated receiving/holding/checkout with no foreground combustion appliance, fuel handling, refrigerant-containing HVAC/cooling or on-site chemical cleaning in this core. Responsible operator shall inspect equipment register, all occupied/shared service spaces, service contracts and full-period event records and sign presence/absence by equipment/species/stage. Unknown is not absence. Real shared HVAC, fuel, cleaning, spill or additional carrier requires b_completion atomic expansion and route review before complete results; no default zero emission, leak or safe-handling approval follows from a specification. |  |\n| b_completion | receive; custody; checkout; residual | Before any complete retail-service claim, complete a signed source/stage matrix covering building shell/fitout/lighting/fans, shelving/handling/checkout assets, ICT/network, payment backend, security camera/retention, administration, cleaning, capital manufacture/installation/maintenance/retirement and all required transport, plus outer transit packaging manufacture/first-use/inbound responsibility. Each actual homogeneous object/service/material/carrier must have named bilingual atomic cards, real process/direction/type, property/unit, amount, protocol, original vector and included-stage exclusions, synchronized before completeness. Existing complete signed packages can remain whole with their measured denominator and actual scope; constituent event/time/object overlap, not different provider IDs, decides deduplication. Apply a_shared/a_assets/a_digital/a_transport/a_cleaning/a_carriers/a_completion. Missing actual source or unknown condition blocks completeness rather than allowing modeller-selected methods. |  |\n\n"
