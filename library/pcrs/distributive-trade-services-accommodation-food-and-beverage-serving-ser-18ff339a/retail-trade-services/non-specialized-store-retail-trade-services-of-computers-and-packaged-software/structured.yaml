      output: "Original formulation manufacturing/inbound numerator and persistent source conservation"
      source_ids: []
    - id: c_extension
      applies_to: "all inventory rows"
      rule: "Use a_assets/a_digital/a_transport/a_cleaning/c_clean_source with cp_support for each new actual atomic exchange. Final aggregation is a_completion, with original-source raw or normalized mode recorded; same source never enters both."
      inputs:
