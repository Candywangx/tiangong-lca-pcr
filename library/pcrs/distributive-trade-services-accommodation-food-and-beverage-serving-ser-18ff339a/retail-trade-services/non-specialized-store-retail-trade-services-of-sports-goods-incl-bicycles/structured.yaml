        - xprt-spec
    - rule_id: ownership
      applies_to: "failed_original; customer_pair; supplier_pair; external_damaged; damaged_pair_waste"
      rule: "Assign each original_id exactly once to S finally valid sold responsibility, F irrecoverable retailer responsibility including loss, O original open stock, or T named transferred responsibility. Original vector includes manufacture+full original package+transport to receiving gate once. S leaves that vector with the sold-goods life cycle; O carries it; T transfers the same source to the identified supplier/recipient with written continuing responsibility; only F enters failed_original. Never recharge resale or count each failed descendant as another original. Unknown fate/owner blocks completeness. Financial refund alone does not change acceptance."
      source_ids:
        - ghg-product
    - rule_id: satellites
      applies_to: "customer_pair; supplier_pair; external_damaged"
      rule: "Only customer_pair, supplier_pair and external_damaged are physical custody satellite outputs without another manufacturing/background supplier. Their counts are gross movements, never service or background multipliers. This exclusion does not apply to failed_original, AC, service_output or waste treatment. Supplier physical handoff does not create a second T allocation."
      source_ids:
        - ghg-product
    - rule_id: support_gate
      applies_to: "retail"
      rule: "Complete-service qualification requires an equipment walkdown, landlord utility boundary diagram, bills and signed current absence evidence for every on-site/landlord combustion fuel, refrigerant-containing HVAC/refrigerator and purchased heat or purchased cooling route. This PCR admits only evidenced absent stationary combustion, refrigerants, purchased heat and purchased cooling. Unknown or present fails this route and requires a separate reviewed atomic-method revision; never assume zero from a tenant electricity bill. Lighting/fans/checkout operation and capital remain required even if electric only."
      source_ids:
        - jrc-retail
    - rule_id: completion
      applies_to: "retail; custody"
      rule: "Until support_gate and complete_packaging, complete_cleaning, complete_transport, complete_assets, complete_digital and merge_modules are fulfilled, label the result partial core; no complete-business or comparative claim. Every added real exchange must receive an atomic named state/direction/type/unit card with verified identity or explicit candidate gap, protocol and bilingual sync. Absence needs dated records; an unknown cannot be omitted. These methods fix quantities and responsibility; downstream choice of denominator or allocation is prohibited."
      source_ids:
        - jrc-retail
