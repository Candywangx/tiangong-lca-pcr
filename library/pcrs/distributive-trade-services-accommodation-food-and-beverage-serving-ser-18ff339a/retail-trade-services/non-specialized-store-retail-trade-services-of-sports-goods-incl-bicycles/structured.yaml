    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62155"
    used_for: "Category boundary:384 sports goods,494 boats,49921 non-motorized cycles; not product LCI"
  - id: "xprt-spec"
    type: "handbook"
    reference: "https://xprtfitness.com/products/rubber-hex-dumbbells"
    used_for: "5 LB pair configuration; material and complete-object identity only; no LCI or package BOM"
  - id: "ghg-product"
    type: "standard"
    reference: "https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Service/reference and physical allocation principles only; PCR equations are declared foreground methods, no standard-conformity claim"
  - id: "jrc-retail"
    type: "official_guidance"
    reference: "https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Retail support/waste process screening, not numerical inventory defaults; actual route evidence required"
