      raw_fields: "original_id; SKU; pair_members; pool_id; event_id; actual_date; acceptance_date; rescission_date; final_valid; refund_only; version; correction_source_ids"
      collection_method: "Reconcile electronic sale, signed counter acceptance and returns daily; retain revoked/no-return events and distinguish financial adjustments. Prospective pool dates and later correction linkage are mandatory. Aggregation method: Q=count distinct final_valid original_id; raw ledger then per reference flow once under calc_core"
      unit: "Item(s)"
      frequency: "Daily and each correction"
      temporal_coverage: "All pool dates and all later corrections"
      site_scope: "Single store and exact pair"
      aggregation_rule: "per reference flow"
      quality_evidence: "Auditable event IDs; two-member match; version supersession"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "ac_input"
      record_type: "meter_allocation"
      raw_fields: "source_id; parent_meter_id; included_submeters; disjoint_meter_ids; start_kWh; end_kWh; E_p_kWh; active_idle_fixed; all_beneficiary_ids; d_b_p; d_target_p; task_seconds; reserved_m2h; reserved_terminal_h; closure_hours; unused_operator; calibration; alpha_p; E_target_kWh"
      collection_method: "Read calibrated mapped meters over the complete pool; task loggers for active pools, mapped area-time or terminal-time reservations for fixed pools. Reconcile all beneficiaries and source subpool sums to bills; electric_allocation fixes driver by source type. Aggregation method: Attribute E_target_kWh, convert kWh*3.6 to MJ, divide Q once; per reference flow"
      unit: "kWh; s; m2*h; terminal*h"
      frequency: "Interval and daily reconciliation"
      temporal_coverage: "All pool active/idle/closed/failure dates"
      site_scope: "Whole mapped source and every beneficiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; topology; bills; time records; residual investigation"
    - protocol_id: cp_ownership
      process_id: "retail"
      flow_role: "failed_original"
      record_type: "original_source_ledger"
      raw_fields: "original_id; supplier_lot; original_pair_BOM; actual_pair_net_kg; package_component_kg; source_id; source_version; original_source_denominator; source_unit; manufacture_boundary; inbound_segment_ids; S; F; O; T; N_F; continuing_owner; responsibility_evidence; correction_version"
      collection_method: "At receipt inspect both members and record actual calibrated net pair/package masses and supplier BOM. Read supplier actual inventory and inbound records to receiving gate; bind sources and responsibility per unique original; do not infer LCI from web specification. Aggregation method: Restore complete original source denominator; S/F/O/T conserve it; N_F/Q per reference flow"
      unit: "Item(s); kg"
      frequency: "Each receipt and fate/correction"
      temporal_coverage: "All original histories and later reversals"
      site_scope: "Original supplier-to-store receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual source model/BOM; package coverage; segment dedup; signed owner evidence"
    - protocol_id: cp_custody
      process_id: "custody"
      flow_role: "customer_pair; supplier_pair; external_damaged"
      record_type: "gross_movement_ledger"
      raw_fields: "original_id; event_id; actual_date; opening_goods; receipt_ids; physical_return_ids; H_intact; H_damaged; H_supplier; handover_state; recipient; original_package_present; held_waste_open; condemnation_ids; dispatch_ids; loss_ids; closing_goods; held_waste_close; original_acceptance_id; initial_handover_state; final_external_state; final_recipient; final_owner"
      collection_method: "Scan original pair and both members at every physical crossing; photograph complete-state condition, original package and recipient signatures. H_intact and H_damaged are disjoint gross customer handover events, including never-accepted cases. A no-movement revocation updates acceptance only; retain initial handover state and separately observed final external state/recipient/owner. Post-handover state observations do not add another gross crossing. If actual state is outside the explicit complete-pair states, a concrete extension is required before completeness. Aggregation method: calc_custody balances gross physical stock; each actual output/Q per reference flow; Q is separate"
      unit: "Item(s)"
      frequency: "Every movement; daily close"
      temporal_coverage: "Opening through final close and correction history"
      site_scope: "Store goods and separately held waste; every recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scanner audit; state photos; recipient proof; investigated mismatch"
    - protocol_id: cp_waste
      process_id: "custody"
      flow_role: "damaged_pair_waste"
      record_type: "dispatch_weighing"
      raw_fields: "consignment_id; original_id; condemnation_id; gross_kg; tare_kg; W_pair_kg; complete_members; container_kg; package_kg; actual_dispatch_date; receiver; treatment_source_id; transport_source_ids; held_waste_open; held_waste_close"
      collection_method: "Weigh complete damaged pair net on calibrated scales at actual dispatch; exclude all container/package tare. Get treatment acceptance and transport coverage. Condemnation is an internal goods-to-held-waste transfer, not dispatch. Aggregation method: W_pair_kg=sum actual consignment net kg; do not correct direct dispatch by opening/closing again; W_pair_kg/Q per reference flow"
      unit: "kg"
      frequency: "Every consignment"
      temporal_coverage: "Complete pool and pending waste stock"
      site_scope: "Store gate to actual treatment recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale calibration; tare; photos; signed consignment; no transport overlap"
    - protocol_id: cp_completion
      process_id: "retail"
      flow_role: "support modules"
      record_type: "completion_source_ledger"
      raw_fields: "module_id; module_version; source_id; source_version; original_denominator; original_unit; source_unit; original_pool; boundary; exchange_id; property; unit; event_id; q_raw; q_normalized; attributed_raw; Q; equipment_register; landlord_map; absence_proof; package_origin_id; cleaner_source_id; destination_state; whole_carrier_kg; reserved_payload_kg; reserved_h; segment_id; all_beneficiaries; provider_already_allocated; e_history; L_version; prior_allocations; retirement; residual; E_target_kWh; N_F; H_intact; H_supplier; H_damaged; W_pair_kg; opening_goods; receipt_ids; physical_return_ids; condemnation_ids; dispatch_ids; loss_ids; held_waste_open; closing_goods; held_waste_close; component_BOM; actual_component_kg; opening_kg; receipt_kg; closing_kg; customer_kg; supplier_kg; dispatched_net_kg; loss_kg; treatment_source_id; transport_source_ids; origin_kg_c; w_c_s; component_content_kg_c_s; opening_unused_kg; closing_unused_kg; dispatched_liquid_origin_kg; dispatched_wipe_origin_kg; dispatched_container_origin_kg; exterior_origin_kg; retained_used_origin_kg; closing_container_origin_kg; loss_origin_kg; inlet_m3; inlet_density_kg_m3; effluent_m3; effluent_density_kg_m3; whole_wipe_kg; whole_container_kg; cleaned_area_m2; A_t; A_unit; reserved_payload_kg_b_t; actual_reserved_h_b_t; d_b_t; d_target_t; alpha_t; operator_unused_capacity; empty_route; idle_duration; provider_boundary; provider_stage_coverage; asset_id; e_a_b; L_a; driver_unit; all_history; lifetime_version; operator_unused_exposure; retirement_date; whole_net_kg; removed_part_ids; measurement_mode; maintenance_event_ids; species_id; mode; subinterval_id; R_out_abs_s_h; R_in_abs_s_h; R_diff_s_h; R_blank_s_h; R_bc_s_h; dt_h; calibration_id; g_ext_s; source_fraction_target_s; g_target_s; air_stock_kg; capture_export_kg; condensate_kg; storage_change_kg; provider_id; D_provider; active_source_numerator; idle_source_numerator; processing_seconds; reserved_bandwidth_Mbps_h; unused_operator; target_event_ids; stage_coverage; excluded_point_of_use_ids; D_module; initial_handover_state; final_external_state; final_recipient; final_owner; inlet_temperature_C; effluent_temperature_C; density_calibration_id; volume_calibration_id; actual_retry_event_ids"
      collection_method: "Use fixed calculation methods complete_packaging/complete_cleaning/complete_transport/complete_assets/complete_digital/merge_modules. Retain original raw source units, full beneficiaries/history and signed boundary coverage; add single-process protocol views if a new process is added. Never use multi-process process_id. Aggregation method: Restore raw source numerator; deduplicate by original source ID/boundary; divide Q once per reference flow"
      unit: "kg; MJ; m2*h; m3*h; terminal*h; kg*h"
      frequency: "Every event and source version"
      temporal_coverage: "Full pool plus all lifetime and correction history"
      site_scope: "All actual beneficiaries and support boundaries"
