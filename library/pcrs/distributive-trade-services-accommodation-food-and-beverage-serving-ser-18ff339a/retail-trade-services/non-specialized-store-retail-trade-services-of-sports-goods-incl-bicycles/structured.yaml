allocation_rules:
  - rule_id: service_pool
    applies_to: "service_output"
    rule: "Q = count of distinct original_id with final_valid=1 in the original pool as of version date. Rescinded acceptance, even without physical return, sets final_valid=0; count the set once, never subtract rescissions again. A pure refund/discount with valid acceptance stays in Q. Repeated attempts/resale of the same original never add another Q. Recompute the original numerator, ownership, fates and Q on late corrections using actual event dates and replacement versions; no duplicate charge in a new pool. Retain failures/idle/zero-sale days in a prospectively fixed same-configuration pool. Q=0 is unnormalizable and remains reported."
    source_ids:
      - ghg-product
  - rule_id: electric_allocation
    applies_to: "ac_input"
    rule: "Use disjoint direct circuit measurements first. For each complete active source pool allocate by measured task-active seconds across every actual beneficiary; each idle/fixed pool uses reserved floor-area*mapped hours for shared lighting/fans or reserved terminal-hours for checkout. First split measured active/idle/fixed source numerators and reconcile their sum to parent kWh; never add incompatible drivers. For each source subpool p, alpha_p = d_target_p/sum_all_beneficiaries(d_b_p); E_target_kWh = sum_p(E_p_kWh*alpha_p). Closed/failed/idle and unused capacity stay assigned to the operator, not discarded. Zero/unknown total driver blocks completion; do not spread it only among successful sales. Subtract a submeter only from a parent that includes it; disjoint meters are not subtracted."
    source_ids:
      - ghg-product
      - jrc-retail
  - rule_id: background_once
    applies_to: "failed_original"
    rule: "N_F counts unique F original pairs. Apply each actual source-equivalent complete original-pair vector once; if source unit differs, restore the supplier original denominator and match the entire original pair/package/inbound boundary. Use supplier component inventory vectors only when evidenced and source-conserving; never divide an environmental vector by steel/rubber mass fractions. S/F/O/T source fractions reconcile to 1 per original_id. An internally retained demonstrator is outside this route; never charge F plus new asset manufacture. No avoided-product or recycling credit is assumed."
    source_ids:
      - ghg-product
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "retail"
      flow_role: "service_output"
