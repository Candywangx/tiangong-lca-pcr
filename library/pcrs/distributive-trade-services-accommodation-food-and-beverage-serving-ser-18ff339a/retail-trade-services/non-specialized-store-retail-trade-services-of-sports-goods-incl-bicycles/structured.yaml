system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "retail; custody"
      rule: "Apply only to the single documented complete-pair configuration and counter route. Presence of retail-added bags/paper receipts, assembly, demonstration, repair, external sales delivery, incomplete pairs, component shedding or materially different SKU requires concrete atomic cards, aligned protocols and bilingual revision before completeness; unknown is blocking, not absent."
