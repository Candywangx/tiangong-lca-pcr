    - id: calc_custody
      applies_to: "customer_pair; supplier_pair; external_damaged; damaged_pair_waste"
      rule: "Goods closing = goods opening + receipts + physical customer returns - H_intact - H_damaged - H_supplier - condemnations - goods losses; held-waste closing = held-waste opening + condemnations - actual waste dispatches - held-waste losses. Both equations count complete pairs on original event IDs. Condemnation is subtracted only from goods; dispatch only from held waste. Acceptance revocation without movement never appears as another stock exit. Investigate all residuals; counts do not replace measured waste kg."
      inputs:
        - opening_goods
        - receipt_ids
        - physical_return_ids
        - H_intact
        - H_damaged
        - H_supplier
        - condemnation_ids
        - dispatch_ids
        - loss_ids
        - held_waste_open
        - closing_goods
        - held_waste_close
        - cp_custody
        - cp_waste
      output: "Separate gross goods/held-waste reconciliations; no Q adjustment"
      source_ids:
        - ghg-product
    - id: complete_packaging
      applies_to: "retail; custody"
      rule: "For each original package component retain original source/BOM ID and actual kg in opening+receipts=closing+customer handover+supplier return+dispatch+loss. Full body/closure/liner/label/adhesive and transit separators are covered when present, with actual material and state; unknown BOM blocks completion. Original package manufacture remains solely in original S/F/O/T vector, never another retail input. Actual removed packaging becomes named material/state waste cards at dispatch net kg, treatment and transport once. No retail-added bag, paper receipt or repacking is allowed under scope_gate."
      inputs:
        - package_origin_id
        - source_id
        - component_BOM
        - actual_component_kg
        - opening_kg
        - receipt_kg
        - closing_kg
        - customer_kg
        - supplier_kg
        - dispatched_net_kg
        - loss_kg
        - treatment_source_id
        - transport_source_ids
        - cp_completion
      output: "Disjoint package fate raw kg and attributable treatment numerators"
      source_ids:
        - jrc-retail
    - id: complete_cleaning
      applies_to: "retail"
      rule: "Measure imported mains water at inlet (m3*density_kg_m3); measure each actual liquid carrier density at its recorded metered/sample temperature with calibrated density and volume instruments, never substitute pure-water density for whole effluent; internal reuse is not subtracted from that import meter. For each actual identified cleaner formulation source c weigh opening+receipt-closing unused to obtain issued source kg; closing unused excludes the separately tracked unusable container residue. The admitted cleaning route requires source-composition-conserving cleaning with no unquantified reaction products; present or unknown reactions require a concrete reviewed species/mass-balance extension before completeness. Partition original formulation-origin kg disjointly into final dispatched liquid, final dispatched wipe, final dispatched container residue, traced original-formulation-origin external transfer, retained used liquid/wipe, and closing container residue, plus investigated loss. Used intermediate states are replaced by their final rinsed/retained state, not summed. Container residue is either closing stock or dispatched, never both. For formulation component s use component_content_kg_c_s=origin_kg_c*w_c_s from measured original formulation composition once: it is source-origin component content, not an actual exterior species emission. Original-source component accounting excludes atoms supplied by outside air/rinse water/dirt; use measured tracer/source fractions for its disjoint destinations, not external molecule kg. Rinse water/dirt/new cloth/container are excluded from formulation-origin kg. Direct drain effluent=measured whole effluent m3*density_kg_m3 with no storage/evaporation deductions; this direct mode is mandatory here. Weigh whole wet wipes and wet containers separately (whole kg includes actual carrier and residue), and record separate named waste cards with actual treatment. No species kg is added to a whole carrier already containing it. Use calc_exterior_flux for actual exterior molecular-species kg independently of component content. Internal generation is not an elementary emission; air/capture/storage closure is QA only and is not deducted again from measured exterior flux. Unknown chemistry/destination/flux blocks completion, no zero default. Allocate each raw cleaning source by actually cleaned area m2 over all beneficiaries including closed areas, then divide Q once."
      inputs:
        - cleaner_source_id
        - origin_kg_c
        - w_c_s
        - component_content_kg_c_s
        - opening_unused_kg
        - receipt_kg
        - closing_unused_kg
        - dispatched_liquid_origin_kg
        - dispatched_wipe_origin_kg
        - dispatched_container_origin_kg
        - exterior_origin_kg
        - retained_used_origin_kg
        - closing_container_origin_kg
        - loss_origin_kg
        - inlet_m3
        - inlet_density_kg_m3
        - effluent_m3
        - effluent_density_kg_m3
        - whole_wipe_kg
        - whole_container_kg
        - cleaned_area_m2
        - all_beneficiaries
        - source_id
        - cp_completion
      output: "Disjoint source kg, species kg, whole-carrier kg and attributed module numerators; per reference flow only after merge"
      source_ids:
        - jrc-retail
    - id: complete_transport
      applies_to: "custody"
      rule: "Inbound manufacture-to-receiving transport is already in the original S/F/O/T source; do not add it again. For every actual after-gate supplier return, waste pickup and source route segment t retain source/activity quantity A_t and the actual verified complete provider LCI boundary: vehicle manufacture/installation, operation including fuel and empty travel/stationary idle, event maintenance/replacements, and terminal treatment. Obtain a signed source-stage coverage matrix; missing stages block completeness. Deduplicate all provider-contained capital/maintenance/terminal carriers and the original receiving-gate source; the full provider vector is used once. For unallocated source pools use d_b_t=reserved_payload_kg_b_t*actual_reserved_h_b_t on each actual segment; alpha_t=d_target_t/sum_all_beneficiaries(d_b_t), and attributable numerator=sum_t(A_t*alpha_t) in each A unit. Include unused/empty capacity as operator beneficiary; on empty idle use actual reserved payload capacity and actual idle duration, not zero tonnes or zero distance. All segment beneficiaries reconcile to full provider capacity-time. If provider amounts are already consignment-allocated, retain them unchanged and use segment records as QA only, never multiply alpha again. Missing empty/idle coverage blocks completeness. Bind carrier transport and treatment scope to avoid duplicate pickup."
      inputs:
        - segment_id
        - source_id
        - A_t
        - A_unit
        - reserved_payload_kg_b_t
        - actual_reserved_h_b_t
        - d_b_t
        - d_target_t
        - alpha_t
        - all_beneficiaries
        - operator_unused_capacity
        - empty_route
        - idle_duration
        - provider_already_allocated
        - provider_boundary
        - cp_completion
      output: "Attributed original-unit transport source numerator with empty/idle covered"
      source_ids:
        - ghg-product
        - jrc-retail
    - id: complete_assets
      applies_to: "retail"
      rule: "Required capital modules are complete building/fit-out including fixed lighting and fans, load-bearing dumbbell shelf/rack, checkout terminal, actual network router/switch/communications cabinet, security camera/alarm package, and handling trolley. Verify the actual equipment register; dated absent-equipment evidence is required for a demonstrably absent item, unknown presence blocks completeness. If an evidenced complete building/terminal/provider package already contains one of these, locate the exact original source IDs and exclude a second module. Use verified complete supplier lifecycle vectors with exact installation/operation/maintenance/retirement exclusions. Building e/L uses reserved floor m2*h; rack uses reserved storage m3*h; terminal uses reserved terminal*h; network equipment uses reserved port*h, security uses covered m2*h, handling trolley uses reserved payload kg*h. Each has its own same-unit all-beneficiary e and L, including empty/unused reservations. For each asset a and every historical beneficiary/period b let f_a_b=e_a_b/L_a, where L_a is evidenced expected total lifetime exposure in the same driver unit including operator unused/closed exposure. Retain persistent original asset/source IDs and all history; sum f<=1. On lifetime revision replace ALL historical f allocations and post differences to their original pools, never restart manufacture. At retirement allocate residual 1-sum f across full actual historical e proportions, replace prior versions and close total=1. A terminal whole asset carrier net mass is multiplied by its final lifetime responsibility fraction once; no second manufacture fraction. Direct whole-asset net weighing already excludes removed parts; component reconstruction is an exclusive evidenced alternative. Event replacements/maintenance are separately weighed actual parts and dated source IDs unless the complete evidenced package includes them; never sum unrelated repair mass as one complete asset input or double-count provider-contained carriers. Allocate demo-free scope only; no merchandise conversion to assets allowed."
      inputs:
        - asset_id
        - source_id
        - original_denominator
        - e_a_b
        - L_a
        - driver_unit
        - all_history
        - all_beneficiaries
        - prior_allocations
        - lifetime_version
        - operator_unused_exposure
        - retirement_date
        - whole_net_kg
        - removed_part_ids
        - measurement_mode
        - maintenance_event_ids
        - residual
        - cp_completion
      output: "Persistent asset source fractions and attributed capital/terminal numerators"
      source_ids:
        - ghg-product
        - jrc-retail
    - id: calc_exterior_flux
      applies_to: "retail"
      rule: "Choose exactly one measured exterior control-volume mode per species and matched subinterval h: absolute mode g_ext_s=sum_h((R_out_abs_s_h-R_in_abs_s_h)*dt_h), where R_out_abs_s_h and R_in_abs_s_h are raw absolute species-molecule kg/h rates subject only to documented instrument zero calibration; neither rate is environmental-background-subtracted. The formula subtracts raw inlet from raw outlet to remove environmental background exactly once; absolute mode makes no additional environmental-background subtraction; differential mode g_ext_s=sum_h((R_diff_s_h-R_blank_s_h)*dt_h), where raw differential already removes inlet background and matched blank is removed once; already-blank-corrected mode g_ext_s=sum_h(R_bc_s_h*dt_h), with inlet/background and blank already removed and no further subtraction. Every rate is actual species-molecule kg/h and dt_h is the matching actual hours; never multiply a sublot rate by another stock kg or residence time. Keep the modes exclusive and evidence rate definitions and calibration. For source-resolved target cleaning rates g_target_s=g_ext_s; otherwise require measured source_fraction_target_s and g_target_s=g_ext_s*source_fraction_target_s once, that fraction includes target-beneficiary attribution. Do not apply cleaned-area attribution again to g_target_s. Never substitute original formulation component_content_kg for molecular external kg or include outside reactant atoms in source-origin component ledgers. Air, capture/export, condensation and storage stocks close independently as QA; no subtraction of capture/storage from measured exterior flux. Internal recovered gas is not both external flux and another subtraction; externally exported captured carrier receives one separate real waste/product card and treatment. Negative/uncertain observations require investigation; do not clamp to zero or claim credit; real uptake requires a reviewed matching input identity. Unknown mode, time match, source fraction or exterior boundary blocks completeness. Final actual molecular output is g_target_s/Q per reference flow."
      inputs:
        - species_id
        - mode
        - subinterval_id
        - R_out_abs_s_h
        - R_in_abs_s_h
        - R_diff_s_h
        - R_blank_s_h
        - R_bc_s_h
        - dt_h
        - calibration_id
        - boundary
        - g_ext_s
        - source_fraction_target_s
        - g_target_s
        - air_stock_kg
        - capture_export_kg
        - condensate_kg
        - storage_change_kg
        - Q
        - cp_completion
      output: "Actual exterior molecular kg and per-reference-flow amount"
      source_ids:
        - jrc-retail
    - id: complete_digital
      applies_to: "retail"
      rule: "Electronic-only transactions still require actual network and payment operation modules. Bind each actual provider to its exact service, source ID/version, original reference unit and denominator D_provider in its actual source pool. Restore provider normalized vectors by multiplying D_provider once. For unallocated active source subpools attribute by measured processing seconds across all actual beneficiaries; idle/fixed subpools use reserved bandwidth Mbps*h across all beneficiaries including operator unused capacity. Split source numerators first; never sum seconds with capacity-time. If the provider vector is already transaction-allocated, retain that allocation and use these records only for QA. Record actual target payment/network event IDs; deduplicate repeated records of the same event, while real retry attempts retain distinct IDs and all actual activity; their original observed activity, including failure, remains in the original pool. Exact source scope must state provider electricity, network/server capital, maintenance and terminal coverage. Missing source-stage coverage blocks completeness. Merchant terminal/router operating electricity already in ac_input is excluded from the provider module at the identical point-of-use boundary. Merchant network/security/handling capital follows complete_assets; verified provider/building/terminal-contained objects are excluded once by exact source-ID coverage. Restore and merge only through merge_modules and divide the common corrected Q once."
      inputs:
        - provider_id
        - source_id
        - source_version
        - D_provider
        - source_unit
        - original_pool
        - active_source_numerator
        - idle_source_numerator
        - processing_seconds
        - reserved_bandwidth_Mbps_h
        - all_beneficiaries
        - unused_operator
        - target_event_ids
        - provider_already_allocated
        - stage_coverage
        - excluded_point_of_use_ids
        - cp_completion
      output: "Attributed network/payment raw source numerators"
      source_ids:
        - ghg-product
        - jrc-retail
    - id: merge_modules
      applies_to: "retail; custody"
      rule: "For each module/exchange restore normalized amount q_normalized to its evidenced raw original denominator D_module in its original pool/version: q_raw=q_normalized*D_module; or use raw totals directly, never both. Attribute fixed drivers once where needed. Deduplicate by original source_id, exchange boundary, event and replacement version across core and all modules; S/F/O/T original backgrounds and point-use AC must not recur. Add only identical exchange identity/property/unit compatible attributed raw numerators, then divide the common corrected Q once. Do not add kg to MJ, lifetime fractions to material kg, or raw totals to normalized values. Transport provider-allocated values keep their original allocation. Record omitted, unsupported and absent modules distinctly; completeness requires all mandatory modules and receipts, not a list of intentions."
      inputs:
        - module_id
        - source_id
        - exchange_id
        - property
        - unit
        - boundary
        - event_id
        - source_version
        - original_pool
        - D_module
        - q_normalized
        - q_raw
        - attributed_raw
        - Q
        - cp_completion
      output: "One corrected normalized exchange vector per reference flow"
      source_ids:
        - ghg-product
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Unbound specific identities remain candidate only. Binding needs official original direct-read UUID, public state, exact bilingual names, product/waste type, complete pair/package/state and property/unit chain; no nominal-mass or generic steel proxy. Service reference identity is unresolved independently of count property."
      evidence: "Original responses and matching integrity receipts; supplier actual background and boundary evidence"
    - id: measurement_quality
      applies_to: "all inventory rows"
      requirement: "Record what/where/when and complete temporal coverage, calibration uncertainty, raw units, all source/beneficiary/event IDs and replacement versions. Unknown quantities or absent proof never become zero. Investigate residuals with measurement uncertainty; no invented pass tolerance."
      evidence: "Calibrations; invoices; custody/acceptance/owner reconciliations; complete raw ledgers"
    - id: completion_quality
      applies_to: "retail; custody"
      requirement: "Execute all fixed completion calculations with raw inputs, source IDs and original denominators. cp_completion is only a retail-process ledger view; each added custody/other process needs its own single-process view of same original records without remeasurement or second normalization. Unknown equipment/fuel/refrigerant presence fails support_gate."
      evidence: "Signed equipment/landlord survey; source coverage; complete package/cleaning/route/asset records; row-by-row merge audit"
validation_rules:
  - rule_id: reference_check
    applies_to: "service_output"
    rule: "Require exact original pair configuration, final-valid distinct Q>0 and one Item(s) service. Q=0 report unnormalizable. Check every final amount.basis.kind=reference_flow and per-reference-flow text; only row-specific units apply."
    source_ids:
      - ghg-product
  - rule_id: reconciliation_check
    applies_to: "all inventory rows"
    rule: "Check source S/F/O/T conservation, actual F input backgrounds, separate gross goods/held-waste balances, disjoint customer states, late corrections and complete source-ID deduplication. Physical external failure requires recipient/state/owner; never infer waste from failed acceptance."
    source_ids:
      - ghg-product
  - rule_id: completeness_check
    applies_to: "retail; custody"
    rule: "Core-only results stay partial. Block complete-service use on unbound required flow/background, missing original BOM/packaging/inbound evidence, unknown quantity, present/unknown forbidden support route, or unfinished module. Verify real source types/units/boundaries and mandatory atomic card/protocol additions in both languages. Passing mechanical candidate check is not scientific approval."
    source_ids:
      - jrc-retail
published_dataset_profile:
  dataset_role: "partial_incremental_retail_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Explicit partial-core screening with reported gaps; complete service only after mandatory source-bound completion and review"
  excluded_use: "Whole CPC leaf; merchandise manufacture; full business claim from core; mass-normalized product impact; comparative assertion without review"
  required_metadata: "SKU and two-component configuration; supplier original_id and source_ids; original package BOM and measured mass; store/channel and pool dates; original acceptance event and correction dates; final_valid flag; gross custody event IDs; S/F/O/T ownership; actual coating/handle condition; meter hierarchy and all beneficiaries; completion module versions; uncertainty and unresolved identities"
  required_quality_disclosure: "Candidate/unbound service and five physical/background identities; source dates; partial modules; uncertainty; zero-output pools; all correction versions"
  update_trigger: "SKU/BOM/package/state/channel change; new fuel/refrigerant; new asset/route; source lifetime revision; late acceptance or fate correction"
