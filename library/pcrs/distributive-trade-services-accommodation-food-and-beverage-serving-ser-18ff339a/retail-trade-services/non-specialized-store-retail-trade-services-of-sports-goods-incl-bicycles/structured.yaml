  calculation_rules:
    - id: calc_core
      applies_to: "ac_input; failed_original; service_output; customer_pair; supplier_pair; external_damaged; damaged_pair_waste"
      rule: "For Q>0 final amounts are 3.6*E_target_kWh/Q MJ; N_F/Q Item(s); Q/Q=1 Item(s); H_intact/Q Item(s); H_supplier/Q Item(s); H_damaged/Q Item(s); W_pair_kg/Q kg, respectively. Raw quantities are unnormalized pool totals; apply attribution once before one Q division."
      inputs:
