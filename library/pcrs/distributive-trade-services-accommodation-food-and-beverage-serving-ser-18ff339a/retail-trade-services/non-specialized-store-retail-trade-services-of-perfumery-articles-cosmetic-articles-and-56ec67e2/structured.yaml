validation_rules:
  - rule_id: admissibility
    applies_to: "all inventory rows"
    rule: "Require scope_gate/state_gate, source/BOM evidence and actual no-opening route observations; missing incidents or supplier evidence is unknown, never zero. Fuel/combustion and refrigerants are outside the admitted ambient core; full service support requires signed actual equipment/building provider records proving no uncovered combustion/refrigerant stage or verified covered complete provider package. An uncovered fuel/refrigerant needs real species/carrier methods and atomic bilingual extension before completeness, not a default emission factor."
    source_ids: []
  - rule_id: identity_gate
    applies_to: "all inventory rows"
    rule: "Every unbound row remains individually unverified. Before characterization bind one actual public Tiangong original response/receipt with recomputed hash and matching observed UUID, official bilingual name, flow type, direction, qualifiers, compartment/property/unit chain and background stage; identity binding alone proves no quantity, applicability or safety. The service output must remain candidate-unbound until its actual output row identity is verified. No UUID-shaped external label is a Tiangong identity."
    source_ids: []
  - rule_id: closure
    applies_to: "all inventory rows"
    rule: "Complete dataset requires Q>0, independent count/kg balances, closed S/F/T/O source ownership, direct meter and waste receipts, complete support inventory and source deduplication. Maintain all failures and zero-output pools; signed residuals are not automatic missing-goods quantities, credits or zeros. Reject missing treatment, state-specific carrier, owner, capacity, measurement, calibration or lifetime history. Report partial scope and unresolved evidence without a complete-business claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "partial_incremental_retail_foreground"
  downstream_use: "secondary_dataset; background_dataset only after all completion and identity gates"
  allowed_use: "Same physical-store original-wrapped OBBA05 configuration and gates, with pool/version-specific completion disclosure."
  excluded_use: "No complete-business, full3532, perfume/refill/tester, safety/compliance, supplier LCI or customer-use claim from this candidate."
  required_metadata: "All required qualifiers, Q, original supplier/source versions, S/F/T/O, actual site/channel, complete support scope, calibration and ownership corrections."
  required_quality_disclosure: "Candidate unverified row identities; missing foreground/BOM/provider/treatment evidence; partial scope, uncertainty, zero-output pools and historical replacements."
  update_trigger: "Lot/formula/wrapper, route/state, store/provider, source ownership, acceptance outcome, asset lifetime/retirement or new actual exchange changes."
