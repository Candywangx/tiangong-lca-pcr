system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "all inventory rows"
      rule: "Admit only physically verified OBBA05/UPC018787782057 original-wrapped intact bars in the defined non-specialized store route. Record lot label, actual net soap and whole-pack mass, wrapper composition/printing/adhesive and supplier full finished formulation/BOM. Current page lists feed ingredients and explains sodium hydroxide is consumed; do not model a finished bar as pure oil or sodium hydroxide. Historical label and current page are different editions; reconcile actual lot (including Jojoba Oil/Wax naming) before background use. No ingredient mass fractions or package tare are inferred from ingredient order, nominal5oz/140g or online shipping weight."
      source_ids:
        - bronner-product
        - bronner-label
        - un-cpc62175
    - rule_id: state_gate
      applies_to: "failed_original_bar; customer_pack; supplier_return; condemned_pack"
      rule: "cp_stock records actual intactness, moisture change, contamination, missing units and incident history at each gate. Original paper wrap is not a zero-emission assumption. Any opening, wrapper damage, breakage, spill, measurable loss, suspected leakage/volatilization, testing or water contact suspends this route completeness. Before inclusion add real state-specific atomic carrier and species cards, single-process protocols, mass/state reconciliation, final recipient and complete treatment/background responsibility in BOTH languages; unresolved species, external pathway or state blocks a complete result. Internal store-air transfer is not automatically an elementary outdoor emission. Do not force an opened bar into an intact carrier or infer zero from no incident log."
      source_ids:
        - bronner-product
    - rule_id: goods_responsibility
      applies_to: "failed_original_bar; customer_pack; supplier_return; condemned_pack"
      rule: "cp_stock preserves original source IDs from receiving through all resale/return events. Partition each original whole-source vector into final S (accepted goods), F (service failure/loss), T (named internal asset or supplier/other recipient responsibility) and O (open responsibility), fractions summing1 with no overlap. For this intact homogeneous route each individual original bar has one final owner; no mass split of its environmental vector. Charge failed_original_bar only actual N_F source-equivalent whole bars with supplier V and inbound source once. S is added once only in a separately declared downstream GOODS system. T keeps named receiving owner/source/version; transfer does not create a new manufacture. O remains unresolved and blocks complete characterization. A real supplier return physical movement and T responsibility are independent. If components acquire different owners, require verified supplier component inventory vectors, separate real component input cards and conserved original boundary/source IDs; exclude those portions from whole-pack F."
      source_ids: []
    - rule_id: carrier_boundary
      applies_to: "customer_pack; supplier_return; condemned_pack"
      rule: "Only customer_pack and supplier_return are non-characterized physical custody satellites, retaining actual intact states/recipient. condemned_pack is a real Waste output: direct consignment net kg of intact soap with original printed wrapper, only when receiver signs acceptance of exact soap/wrapper constituents/state and the verified treatment dataset covers this complete carrier. A license/photo alone is insufficient. Do not split the accepted complete carrier into soap and paper again or add treatment utilities/transport already included by provider. Missing treatment or rejection needs real disposition and blocks completion; a financial refund or externally retained unaccepted bar is never automatically retailer waste."
      source_ids: []
    - rule_id: support_gate
      applies_to: "all inventory rows"
      rule: "Before complete service reporting cp_support must inventory every actual facility, shelf, checkout, ICT, network, payment, security, administration, cleaning, capital and independent transport source. Core checkout electricity covers only its metered circuit. For each actual object and constituent lifecycle stage record present/absent/unknown, provider boundary and source IDs. Absence needs signed site inspection and equipment/contract evidence for the entire pool. Unknown blocks completion. Actual building, lighting, fan/HVAC, shelf, scanner/terminal, router, camera/storage, payment/admin backend and cleaning cannot disappear because they lack core cards. Apply fixed methods support_operating, support_assets, support_transport, support_cleaning and completion_join; add named real atomic cards and single-process protocols before a dataset is complete. Complete provider bundles may remain one genuine measurable service only with exact actual signed scope, original denominator and constituent/stage overlap checks; internet access does not include payment/admin/security backend by implication. This PCR does not leave boundary/driver/denominator choices to the modeller."
      source_ids: []
