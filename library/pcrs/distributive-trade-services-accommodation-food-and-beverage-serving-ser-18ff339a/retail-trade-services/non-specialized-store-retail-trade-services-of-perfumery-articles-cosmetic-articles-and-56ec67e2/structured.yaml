    - id: stock_balance
      applies_to: "customer_pack; supplier_return; condemned_pack; failed_original_bar"
      rule: "Goods-only count balance: G_close=G_open+received_count+physical_customer_return_count+physical_supplier_return_in_count-gross_customer_handover_count-supplier_handover_out_count-internal_transfer_out_count-condemnation_count-confirmed_missing_count+signed_unresolved_goods_residual. Gross customer handovers already include never-accepted handovers; do not subtract those again. Revocation with no movement is no new exit. Condemnation is an internal goods->held-waste change, not physical dispatch. Independent held-waste kg balance: W_close=W_open+measured_condemnation_kg+other_measured_waste_receipts_kg-dispatched_net_kg-confirmed_missing_waste_kg+signed_unresolved_waste_residual_kg. Link condemnation_count and measured_condemnation_kg by event IDs and actual scale, never equate them. Direct dispatched_net_kg is unchanged by opening/closing stock corrections. Count and mass residuals remain signed and investigated; any unresolved residual or unknown background owner blocks complete results."
      inputs:
        - G_open
        - G_close
        - received_count
        - physical_customer_return_count
        - physical_supplier_return_in_count
        - gross_customer_handover_count
        - supplier_handover_out_count
        - internal_transfer_out_count
        - condemnation_count
        - confirmed_missing_count
        - signed_unresolved_goods_residual
        - W_open
        - W_close
        - measured_condemnation_kg
        - other_measured_waste_receipts_kg
        - dispatched_net_kg
        - confirmed_missing_waste_kg
        - signed_unresolved_waste_residual_kg
        - event_id
      output: "independent goodsCount and held-wastekg reconciliation"
      source_ids: []
    - id: core_amounts
      applies_to: "checkout_ac; failed_original_bar; customer_pack; supplier_return; condemned_pack"
      rule: "Raw core numerators remain raw: E_core=sum direct metered checkout MJ attributed under support_operating; N_F=sum original whole bars finally assigned F once by source; H_customer=gross intact customer physical handovers; H_supplier=intact supplier physical handovers; W_dispatch=direct same-state consignment net kg. Final displayed amounts are respectively E_core/Q, N_F/Q, H_customer/Q, H_supplier/Q, W_dispatch/Q. accepted_service=Q/Q=1 Item(s) for Q>0. Satellite handovers never define Q. F Product input N_F/Q links each supplier whole-source vector once, and is not replaced by waste kg. Inbound transport already inside V is excluded from external transport."
      inputs:
        - E_core
        - N_F
        - H_customer
        - H_supplier
        - W_dispatch
        - Q
        - original_source_id
        - V
        - ownership_version
      output: "core per-reference quantities"
      source_ids: []
    - id: completion_join
      applies_to: "all inventory rows"
      rule: "For each compatible exact exchange identity/property/unit j in final original pool h: R_j_h=raw_core_j_h+sum verified_raw_external_j_h+sum(z_normalized_j_k*D_original_k*owner_fraction_k_h); final_j_h=R_j_h/Q_h. External raw numerators retain their actual source attribution directly; normalized modules first restore their evidenced original D, unit, source/pool/version. owner_fraction applies only where final owner/pool/version is not already allocated, under support_operating/support_assets/support_transport; otherwise it is1 with exact evidence. Keep raw_core_j_h even when core card display already shows /Q; never insert its normalized display as raw. Deduplicate actual overlapping source constituents/event/time/asset/stage before sum; distinct provider IDs alone do not prove disjointness. Add only identical compatible units row-by-row, never kg+MJ. Carry numerator replacements into historical pool h before one common Q division. New real rows/protocols, verified binding and supplier boundaries are required; a generic external-modules card is forbidden. A separate GOODS system adds verified S vectors exactly once after service responsibility conservation."
      inputs:
        - raw_core_j_h
        - verified_raw_external_j_h
