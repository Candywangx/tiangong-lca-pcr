    - id: source_quality
      applies_to: "all inventory rows"
      requirement: "No quantified LCI, packaging tare or on-site quantity is established by the manufacturer webpage/label. Require signed actual lot formulation and packaging vector/BOM, stage coverage, geography/time, uncertainty and custody photos/weights; disclose primary-source version conflicts."
      evidence: "supplier original data and actual lot records"
    - id: calibration_quality
      applies_to: "all inventory rows"
      requirement: "For every measured quantity retain instrument ID/unit, method, calibration validity, check-weight/reading, sampling coverage, uncertainty, raw event dates and responsible operator; close all gaps before a complete result. No silent zero or estimated default."
      evidence: "cp_stock; cp_electricity; cp_support; signed reconciliation"
    - id: translation_quality
      applies_to: "all inventory rows"
      requirement: "Compare every row, direction/type, selected identity, unit, expression, basis kind, condition, negation, protocol raw field and formula inputs across both languages and actual generated projection."
