allocation_rules:
  - rule_id: support_operating
    applies_to: "all inventory rows"
    rule: "Use cp_support source-numerator pools per exchange/property/unit. Submeter direct active work first; subtract a submeter only from a parent that actually contains it. Split active, idle and fixed components into mutually exclusive measured same-unit numerator pools that sum to the parent. Active device pools use measured task-reserved equipment seconds; idle/fixed checkout, ICT and network device pools use actual reserved equipment seconds across ALL beneficiaries including empty/closed reservations. Facility lighting/HVAC/fixed operation pools use measured served floor-area*m2*time*h as m2*h, with disjoint zone/time footprints and explicit empty reservations. Each pool uses e_h/sum_all(e_h) with e in that pool same driver unit, strictly positive/known total, retaining failures and zero-output cohorts. Never add seconds to m2*h or kWh to any driver. For network connection-hour service, each unique actual connection interval k has measured provider network_source_hours_k in h and beneficiary h has measured endpoint_reserved_connection_seconds_k_h in s. Allocate network_attributed_source_hours_k_h=network_source_hours_k*endpoint_reserved_connection_seconds_k_h/all_beneficiary_reserved_connection_seconds_k, where the denominator is the known positive sum of actual reserved endpoint connection seconds across ALL beneficiaries in interval k, including empty and failed reservations; shares sum1. First attribute these actual source-hours to the original SKU/pool/version; skip this attribution only when provider evidence already binds the exact final owner/pool/version, never merely an endpoint or consignment. Count the unique source connection service once; exclude equipment electricity or other operations already contained in that same provider scope, and do not treat connection-service h as overlapping active/idle/fixed equipment electricity hours. Payment authorization attempts and administrative batches are unique shared events: allocate actual line-level processing seconds within each event, shares sum1 including failed lines; a basket event cannot be whole-counted for every SKU. Security capture uses actual timestamped camera field-of-view beneficiary footprint m2*coverage h in disjoint zone/time plus empty reservations; freeze original source/pool/version map and allocate storage byte*h by that original map through all retention periods. Measured GB=10^9 bytes and GiB=2^30 bytes are distinct. Reject missing causal evidence rather than fall back to revenue or sales count."
    source_ids:
      - ghg-allocation
  - rule_id: support_assets
    applies_to: "all inventory rows"
    rule: "cp_support identifies each homogeneous actual model/BOM/scope asset vector V separately: complete building excludes separately modelled shelves, lights/fans/HVAC and electronic devices unless verified included; each separate shelf/fixture/terminal/router/camera module excludes operations and independently modelled maintenance/EOL/transport. Declare complete-package versus disjoint stage mode from signed supplier scope; never both. For each asset and historical beneficiary-period h, e_h is actual task-reserved equipment h for electronic devices, actual occupied served m2*h for buildings/fixtures/shelves, and actual cleaned m2 for a reusable cleaning implement. Its expected L has exactly the same unit and spans all beneficiaries/lifetime. Provisional f_h=e_h/L; store all historical allocations, cumulative fractions<=1 and revise L before exceeding1, without dropping service intervals. At actual retirement replace EVERY historical allocation by f_final_h=e_actual_h/sum_all_h(e_actual_h). For each original pool/version post delta_h=f_new_h*V_new-f_old_h*V_old, including earlier periods; use the same replacement for packaging, independent asset/repair/retirement transport and terminal whole-device waste. Residual1-sum_old_f is QA only, never a current-period shortcut. Do not restart complete manufacture after replacement/lifetime revision, sum heterogeneous models as one Item(s), or charge manufacture plus the same complete lifecycle package. Measured whole terminal carrier excludes removed parts already; BOM reconstruction is a separately evidenced exclusive mode. Whole included treatment carriers and provider-contained components have no second foreground waste."
    source_ids:
      - ghg-allocation
  - rule_id: support_transport
    applies_to: "all inventory rows"
    rule: "cp_support transport attribution has three levels: measured trip/segment source -> actual consignment/asset/material source -> final S/F/T/O or first-use/asset beneficiary-period owner. Preserve attribution_level, exact source, owner, pool and version. Trip source uses actual vehicle-km including measured empty distance and idle reserved vehicle h with nonzero fuel; never turn zero-load t*km into zero trip. For loaded capacity allocation fix driver to measured occupied m3 on that segment only when signed actual cube/volume capacity is binding and measured mass limit is satisfied; if actual mass constraint binds use separately reviewed mass-capacity route, not this volume route, before completeness. All beneficiary occupied/reserved m3 shares sum1, with empty capacity reserved to evidenced beneficiaries. Provider consignment allocation removes only repeat trip share. Only exact final owner/pool/version attribution skips owner fraction; original goods transport follows F fraction, unused support material follows its first-use owner, and asset transport follows all historical asset fractions. Include actual distance and background transport unit conversion supported by provider scope; measured litre fuel or vehicle-km is not automatically t*km. Compare constituents/time/event/stage, not different provider IDs, to remove overlaps. Unknown capacity or empty/idle coverage blocks completion."
    source_ids: []
  - rule_id: support_cleaning
    applies_to: "all inventory rows"
    rule: "Actual cleaning modules must add one specific real formulated input per product, imported supply water separately, and each actual complete terminal wet wipe/container/liquid waste carrier with receiver/treatment evidence. cp_support measures formulation-origin kg among unused retained, used retained, dispatched wipe, dispatched container residue, rinsate and confirmed loss as disjoint final destinations; intermediate used->rinsed is replacement, not another destination. Added rinse water/dirt is excluded from formulation kg; direct wet carrier kg is measured independently and not multiplied by formulation share again. Unused input stock carries original manufacture/inbound sources until first use; reused implements never repeat them. Import water meters already exclude internal reuse. Direct effluent mode is actual V_discharge*rho only, with measured same-state density, not supply minus reuse/storage. This route admits only direct measurement, no water-only reconstructed full-liquid carrier. Unknown discharge, spray/species or carrier composition requires actual atomic extension before completeness."
    source_ids: []
