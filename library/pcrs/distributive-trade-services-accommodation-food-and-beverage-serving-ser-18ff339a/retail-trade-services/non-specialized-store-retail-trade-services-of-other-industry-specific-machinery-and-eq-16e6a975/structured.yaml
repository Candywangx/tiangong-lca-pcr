    - id: c_species
      applies_to: "service_output"
      rule: "For each actual homogeneous served zone z and measured interval t, subdivide facility heat/cold/HVAC operational sources from active handling/checkout device sources. All disjoint facility-HVAC electricity, fuel, purchased heat/cold and actual facility species raw quantities use the SAME measured w_z_t_h=served_reserved_m2_seconds_z_t_h/sum_all_h(served_reserved_m2_seconds_z_t_h), including failed/zero-sale/closed beneficiaries. A positive source requires a positive known denominator; preserve original source/zone/interval/owner/version. a_power uses this facility driver for HVAC circuits; its active-device and reserved-device drivers remain distinct. Never add delivered thermal energy to its provider-included electricity/fuel, or operate an overlapping second energy module. For each actual fuel first retain its measured original physical amount/unit and state. If the matching provider requires mass, m_fuel_kg=V_fuel_m3*rho_same_state_kg_m3; liquid density and volume have the same measured temperature/composition, gas volume and density have the same absolute temperature/pressure/moisture/composition and reference state. If the provider instead requires energy, E_fuel_MJ=m_fuel_kg*NCV_actual_MJ_kg for the measured same moisture/composition mass basis. Never convert already-mass amounts by density, already-energy amounts by NCV again, or use HHV as NCV; measured mass alone does not require an energy conversion. Purchased thermal amount is actual supplier delivered MJ and exact stage scope, not fuel input inferred from a generic efficiency. Each fuel/upstream provider and combustion operation scope is disjoint. Direct combustion species use ONLY a measured absolute inlet/outlet mass-flux mode, not an emission-factor mode or already differential export. At each actual external exhaust and matched inlet, record synchronized interval absolute raw species concentrations C_raw_g_out_i/C_raw_g_in_i in mg per dry reference m3, independent instrument blanks B_g_out_i/B_g_in_i and integrated volumes V_out_dry_ref_i/V_in_dry_ref_i. C_corr=C_raw-B is applied once per channel; actual inlet background then subtracts once. For each measured volume interval all instruments must use the same declared T_ref/P_ref, dry basis, composition and no oxygen-normalized concentration. If a meter exports actual wet m3, convert once as V_dry_ref=V_wet_actual*(P_actual/P_ref)*(T_ref/T_actual)*(1-y_H2O)*(Z_ref/Z_actual), absolute K/Pa, actual measured water mole fraction and evidenced compressibility; do not re-correct already-dry-reference volumes. Integrated external net species kg N_comb_g=sum_i(C_corr_g_out_i*V_out_dry_ref_i-C_corr_g_in_i*V_in_dry_ref_i)*1e-6. Time-resolve changing flows/concentrations and integrate their matched increments, never multiply unrelated average states. The control boundary covers all actual inlet/outlet ducts and retained/captured species changes; any unmeasured outlet, capture/stock change or unexplained negative result makes this narrow direct mode incomplete until a specific measured matching extension. Negative results remain uncertainty, not zero clamp or uptake credit. Fuel provider combustion species already covered excludes this direct mode for the same original event/species/stage; separate actual upstream/operation coverage is mandatory. Raw absolute, blank-corrected and background-differential quantities cannot be mixed; already processed data without recoverable raw/blank records are incomplete under this mode. For each actual refrigerant species g use one fixed independent external-flux measurement mode refrigerant_flux_mode=absolute_inlet_outlet_massflux. At every actual control-volume external vent/containment exit and matched external inlet measure synchronized raw absolute refrigerant concentrations refrigerant_C_raw_g_out_i/refrigerant_C_raw_g_in_i and independent instrument blanks refrigerant_B_g_out_i/refrigerant_B_g_in_i, all mg per dry reference m3, plus measured integrated refrigerant_V_out_dry_ref_i/refrigerant_V_in_dry_ref_i over those same intervals. Use exactly the previously defined dry reference state, wet-volume conversion only where needed, no oxygen normalization and each channel blank/background subtraction once. F_external_measured_g=sum_i((refrigerant_C_raw_g_out_i-refrigerant_B_g_out_i)*refrigerant_V_out_dry_ref_i-(refrigerant_C_raw_g_in_i-refrigerant_B_g_in_i)*refrigerant_V_in_dry_ref_i)*1e-6 kg. Resolve changing concentrations/flows into synchronized increments; do not use unmatched average states, a modeller-selected rate/factor mode or residual-derived flux. All actual external openings and sampling intervals must be covered; unknown flux, state or inlet/outlet coverage is incomplete. Preserve actual external medium and measured retained/captured stocks; equipment-to-room leakage is internal, not that external flux. Reconcile R_g=opening_control_stock_g+imports_g-closing_control_stock_g-nonair_external_exports_g-F_external_measured_g, all same-interval species kg. R_g>0 is unexplained missing species and R_g<0 unexplained excess; neither is automatically an air emission or credit. Recovery and whole-equipment contained exports are nonair external exports only at actual external gates, each source portion once; internal recovery/transfers only replace internal locations. Do not also subtract the same recovery as another capture export. Attribute measured F_external_measured_g and eligible direct N_comb_g by the facility w_z_t_h once; exact final-owner quantities skip only the proven prior layer. Every actual fuel/refrigerant/emission/carrier needs named atomic cards, property/unit/actual medium and protocols/providers before completeness. Full-period actual plant/service presence/absence/unknown includes leased/shared/landlord equipment; absence requires signed evidence and unknown is not zero."
      inputs:
        - equipment_ID
        - equipment_owner
        - served_zone
        - interval
        - presence_state
        - source_ID
        - source_stage
        - source_version
        - original_owner
