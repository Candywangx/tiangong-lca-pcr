allocation_rules:
  - rule_id: a_power
    applies_to: "retail"
    rule: "Prefer disjoint calibrated meters. Split each measured electricity source into nonoverlapping active equipment, reserved-idle equipment and fixed facility pools, reconciling their kWh sum to the parent. Active checkout/handling uses measured event equipment-seconds; idle devices/lighting/fans use reserved device-seconds including zero-sale/closed beneficiaries; fixed facility pools, including HVAC electricity, use actual served reserved m2*seconds under c_species. For each homogeneous pool k, E_k_h=E_k*d_k_h/sum_all_h(d_k_h), with positive known denominator when E_k>0. Sum only compatible attributed kWh, E_h=sum_k E_k_h. Never sum seconds and area-time as one driver. Subtract a submeter only when physically inside that parent, never from an independent disjoint source."
    source_ids:
      - ghg2011
  - rule_id: a_assets
    applies_to: "retail"
    rule: "Keep a persistent ledger per actual homogeneous asset/model/BOM/scope vector V_v. Structures/shelves use measured reserved served-area seconds; powered handling/checkout/ICT/lamp/fan/HVAC devices use measured reserved device-seconds; reusable cleaning tools use actual cleaned m2 per pass. Current raw N_asset_h=(e_recorded_h/L_expected_v)*V_v, where measured e and evidenced expected lifetime L have the same unit and all beneficiaries are retained. Any L/V/source revision replaces every prior original-owner/pool record with delta=f_new_h*V_new-f_old_h*V_old; never restart acquisition. At retirement E_actual=sum_all_h(e_actual_h)>0 and f_final_h=e_actual_h/E_actual replaces every historical fV record. Acquisition/retirement counts reconcile stock only. Actual repair/replacements, asset freight and terminal carriers first belong to the asset, then follow its same historical f once; included whole-lifecycle package constituents are not added again. Unknown lifetime/BOM/stage separation blocks completeness."
    source_ids:
      - ghg2011
  - rule_id: a_once
    applies_to: "retail; failure; custody"
    rule: "Use original source/event/object/time/stage keys before module aggregation. Keep successful GOODS background outside the incremental retail service; F manufacture is the actual failed_original input, not an excluded custody satellite. Only supplier_return, external_retention and internal_transfer Product outputs are physical custody QA, without replacement credit or additional manufacturing demand. Actual waste requires its complete treatment, never a blanket satellite exclusion. Unknown fractions are not renormalized to known portions; no avoided-product credit is assumed."
    source_ids:
      - ghg2011
