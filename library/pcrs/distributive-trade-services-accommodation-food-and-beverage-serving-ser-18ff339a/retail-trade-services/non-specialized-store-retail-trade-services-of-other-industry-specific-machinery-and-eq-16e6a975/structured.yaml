      rule: "Use a_power to obtain raw attributed E_h kWh, including actual disjoint store receiving/storage/order/checkout/dispatch/return handling sources. E_MJ=3.6*E_h, ac_retail=E_MJ/Q MJ. A delivery-provider service already including vehicle charging excludes that charging from added facility electricity; retain source-meter/event evidence. No nominal150W times assumed runtime, no machine operation in this route. Unknown supply provider/geography/mix/voltage, grid losses or overlapping landlord billing remains explicit provider completion; the AC flow identity does not supply a generation dataset."
