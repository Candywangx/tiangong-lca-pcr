  calculation_rules:
    - id: c_pool
      applies_to: "service_output"
      rule: "Prospectively define one site/configuration cohort pool and observation cutoff before any outcomes. Q=count distinct original_ID with final_valid_acceptance=true after the latest signed acceptance/revocation history. Qualified delivery requires exact unopened package/nameplate-linked identity, actual named final-user physical receipt, accepted complete original state and no unresolved mismatch. Cashier payment alone is not Q. A financial refund with acceptance still valid changes no Q; revocation removes an ID even without physical return, already absent from this count and never subtracted again. Repeat deliveries/returns/resale of that original count once. Preserve event dates and all failed/zero-sale cohorts; later facts replace original pool numerator/denominator/fates with version deltas. Q=0 is unnormalizable, never deleted. The declared service exchange is1 Item(s) only when Q>0."
