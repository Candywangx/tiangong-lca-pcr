    - id: c_clean
      applies_to: "service_output"
      rule: "Facility cleaning is separate from prohibited machine cleaning. For each original formulation source measure net m0_s excluding its container. Persistent physical balance: m0_s=cumulative_final_exports_source_kg+current_sealed_unused_source_kg+current_opened_unused_source_kg+current_solution_source_kg+current_film_source_kg+current_toolbound_source_kg+current_heldwaste_source_kg+confirmed_missing_source_kg+signed_residual_source_kg. These source-origin portions exclude added water/dirt; every state transition replaces the old state, final exports and current stocks are exclusive, all history is retained. Each original portion_ID enters first_use_kg_s_h once; repeated application/rinsing/recovery creates no new first use. G_s_h=first_use_kg_s_h+disjoint_preuse_loss_kg_s_h. Allocate raw manufacture and inbound separately as (G_s_h/m0_s)*V_manufacture_s and (G_s_h/m0_s)*V_inbound_s, with total original-source ownership conserved across all historical owners, unused transfers and still-unassigned source stock/residual. Revise every prior owner with delta=(G_new/m0_new)*V_new-(G_old/m0_old)*V_old. Independent complete single-use containers including body/closure/liner/label/adhesive use actual count assigned once to first-opening owner or disjoint pre-opening loss, not G/m0; actual reusable container requires reviewed a_assets exposure method. Cleaning event shared source uses actual cleaned m2 per pass plus disjoint reserved failed/empty cleaning area, all beneficiaries in the same-unit denominator. Cloth/mop uses a_assets cleaned-m2 lifetime, washing events distinct. Water import is measured separately; direct whole effluent kg=actual_discharge_m3*same_state_measured_density_kg_m3, no reuse/storage subtraction. Actual waste carrier net kg is direct gross-tare; formulation portions and whole wet carriers are different quantities, no repeated composition fraction. Actual source loss/species/receiver not supported by real complete carrier/provider evidence is