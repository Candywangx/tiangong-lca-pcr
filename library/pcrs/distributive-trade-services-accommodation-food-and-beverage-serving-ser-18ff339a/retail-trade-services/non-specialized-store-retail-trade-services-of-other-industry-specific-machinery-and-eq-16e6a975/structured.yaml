    - id: c_failure
      applies_to: "failed_original"
      rule: "Apply b_original per unique original j and retain W_j manufacture/original packing strictly at supplier dispatch, excluding I_j receiving freight. N_F=count originals assigned F; W_F=sum_j F_j*W_j and I_F=sum_j F_j*I_j, across carried-in/new sources and every original revision. failed_original=N_F/Q Item(s), expanding once with its exact aggregated source-equivalent W_F/N_F, only when N_F>0. At N_F=0 no division and no manufacture source. Do not additionally add W_F beside that expanded input; add disjoint I_F via c_transport/c_complete once. Positive W_F or I_F with unknown original source/type/configuration or denominator blocks completeness. If supplier bundles manufacturing/inbound, obtain verified stage separation, never omit or duplicate the segment."
