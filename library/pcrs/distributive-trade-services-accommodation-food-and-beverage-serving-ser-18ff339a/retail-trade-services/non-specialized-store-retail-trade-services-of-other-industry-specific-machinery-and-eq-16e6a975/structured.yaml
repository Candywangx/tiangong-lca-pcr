    - id: c_transport
      applies_to: "service_output"
      rule: "Per actual vehicle source/leg k use three disjoint measured modes: loaded vehiclekm, empty vehiclekm and stationary powered idle vehicleh. Match each mode to an actual provider in the same original activity unit with complete actual energy/exhaust coverage. For a proven mass-binding leg set c_k_h=measured consignment kg; for a proven volume-binding leg use occupied m3, never both or an unevidenced menu. Loaded driver d_k_h=c_k_h*loaded_km; empty driver d_k_h=reserved_capacity_k_h*empty_km; idle driver d_k_h=reserved_capacity_k_h*idle_h. Reserve capacity consistently in the evidenced same kg or m3 unit across all actual beneficiaries, including failed/empty reservations; positive raw activity A_k requires positive known sum_all_h(d_k_h). Raw N_k_h=A_k*d_k_h/sum_all_h(d_k_h). Apply only missing original-owner fractions after actual consignment assignment: F_j for merchandise inbound, all actual service delivery/return activity for this retail pool, first-use material owners under c_material/c_clean, and asset historical f under a_assets. Exact already-final-owner/pool/version skips only that evidenced layer; consignment-only attribution does not skip final owner. Internal electric/manual handling uses actual task seconds including idle reservations, not vehicle tkm. Unknown mode/provider/capacity/owner coverage is incomplete."
