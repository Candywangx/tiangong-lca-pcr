    - id: c_stock
      applies_to: "supplier_return; external_retention; internal_transfer; sealed_slicer_waste"
      rule: "Goods-only predicted_closing_count=opening_count+new_receipts+customer_returns+supplier_returns+transfer_in-gross_customer_handovers-gross_supplier_handovers-transfer_out-condemnation_count-confirmed_missing_count. Gross handovers include every physically handed-over accepted or unaccepted event once; acceptance revocation without movement is no new exit. signed_residual_count=observed_closing_count-predicted_closing_count: positive unexplained excess, negative unexplained shortage. Condemnation is internal goods-to-held-waste, not dispatch. Independently, predicted_held_kg=opening_held_kg+condemned_kg+returned_waste_kg-dispatched_kg-known_missing_waste_kg; signed_residual_kg=observed_held_kg-predicted_held_kg with the same sign. Link count and weighed kg by event_ID without equating them. dispatched_kg and returned_waste_kg record every actual physical waste exit/return for stock QA only, regardless of receiver acceptance or treatment status. W_dispatch_kg=sum_unique_terminal_originals(final_treatment_gross_kg-final_treatment_tare_kg) includes only unique original-package portions with final actual complete whole-package treatment, measured directly at that matching terminal gate with treatment_receipt_ID, original_ID, complete treatment evidence and same-scope provider. It is not all attempted dispatch mass and has no additional stock/reuse deduction. Rejected/returned attempts, receipt without treatment and partial treatment cannot receive the complete-treatment provider or enter W_dispatch_kg as completed treatment. Retain their actual transport, handling and processing activities with actual scope under c_transport/c_complete; partial treatment or changed/opened states require concrete matching atomic extensions before completeness, never zero. Acceptance/status revisions without physical movement replace the original treatment/ownership record and all affected versions, not new stock exits or duplicate terminal original IDs. External retention N_ext counts distinct originals physically outside at cutoff without valid acceptance, not a second gross movement. Supplier N_ret and internal N_transfer count actual signed handover events; responsibility changes alone create no physical flow."
