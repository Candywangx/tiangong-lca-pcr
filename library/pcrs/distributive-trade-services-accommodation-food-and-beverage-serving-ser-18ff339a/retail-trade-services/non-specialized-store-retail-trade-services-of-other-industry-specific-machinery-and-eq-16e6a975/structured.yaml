      collection_method: "Scan originals at each actual custody gate and confirm intact complete factory seal from external evidence. Count physical events independently of acceptance and background ownership. Calibrated/tare-checked scale weighs actual complete waste consignments and held stock; receiver must sign actual constituent/state acceptance and complete treatment. Separately record each attempted dispatch/return and final unique-original complete-treatment gate, measured terminal net kg, treatment status/version and same-scope provider under c_stock. No full-treatment amount is inferred from a shipment alone. Investigate count/kg missing and residuals under c_stock; no virtual dispatch from a financial event. Aggregation method: Raw independent balances; N/Q or direct net kg/Q once"
      unit: "Item(s); kg; timestamps"
