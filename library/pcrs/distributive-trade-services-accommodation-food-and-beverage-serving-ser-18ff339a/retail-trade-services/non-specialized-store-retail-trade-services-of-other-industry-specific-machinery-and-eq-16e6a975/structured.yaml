validation_rules:
  - rule_id: v_applicability
    applies_to: "retail; failure; custody"
    rule: "Reject use if b_route/b_machine gates or required qualifiers lack evidence; exclude internet/wholesale, different hardware and open/powered routes. A catalogue match is insufficient."
    source_ids: []
  - rule_id: v_measure
    applies_to: "retail; failure; custody"
    rule: "Require Q>0, one normalized reference denominator, correct per-card property/unit and protocol process/row links. Check original F expansion once, actual direct waste kg and typed stock balances; do not replace count with net/shipping mass."
    source_ids: []
  - rule_id: v_provider
    applies_to: "retail; failure; custody"
    rule: "Reject complete status on unresolved actual flow/provider/medium, missing source/denominator, positive-source unknown/zero driver totals, unknown fates, unsupported carrier or overlapping source stages; preserve partial core disclosure and uncertainty."
    source_ids: []
  - rule_id: v_updates
    applies_to: "retail; failure; custody"
    rule: "Any late acceptance, physical return, source fate, packing/revision, provider scope or asset lifetime change replaces all affected original records and regenerates bilingual guidance/projection; no silent independent new pool."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only the exact qualified delivered retail service after actual support completion; a GOODS+service system adds S upstream once separately"
  allowed_use: "Review-required partial-core scenario until all named completion/identity/field-data conditions pass"
  excluded_use: "Complete store footprint, machine life cycle/use, internet/wholesale/specialized-store service, other configurations, avoided-product claims or safety/compliance certification"
  required_metadata: "All reference qualifiers, actual original source/recipient/channel/stages, unit/denominator, method/version and complete presence/provider register"
  required_quality_disclosure: "Candidate methodology, partial core, each unverified flow/provider/quantity and conflict, original-data period/uncertainty, historical identity observation and scientific review status"
  update_trigger: "Late acceptance/return/fate, original config/BOM, provider scope, method, lifetime or boundary change under v_updates"
data_sources:
  - id: "un621"
    type: "official_guidance"
    reference: "UNSD CPC3.0 subclass-group621 explanatory note, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/621"
    used_for: "Physical non-specialized store channel; excludes unproven online delivery as evidence of that channel"
  - id: "un62188"
    type: "official_guidance"
    reference: "UNSD CPC3.0 62188 and group445, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62188 ; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/445"
    used_for: "Group445 actual commercial food-processing-machine subset; no full-leaf coverage claim"
  - id: "eurodib-hbs"
    type: "handbook"
    reference: "Eurodib HBS-250L manufacturer product and regional locking-system pages, https://eurodib.com/product/hbs-250l/ ; https://eurodib.com/en-us/product/hbs-250l-can-en-us/"
    used_for: "Actual commercial model/functions and separately sold blade; conflicting regional information requires actual batch evidence"
  - id: "eurodib-manual"
    type: "handbook"
    reference: "Eurodib Operation Instructions for Meat Slicer,2020, PDFpages3–7 and8–12, https://eurodibproductimages.blob.core.windows.net/eurodib-product-images/Eurodib/HBS250L/EURODB_HBS250L_UserManual_Bilingual_2020.pdf"
    used_for: "Original HBS-250L identity/components and excluded downstream operating/cleaning/oiling/sharpening; conflicting cheese/waterproof claims remain unresolved, no retail runtime defaults"
  - id: "eurodib-spec"
    type: "handbook"
    reference: "Eurodib HBS Slicers sheet linked as2020, actual PDFmetadata2018 and 10in image labelledHBS-250JS, https://eurodibproductimages.blob.core.windows.net/eurodib-product-images/Eurodib/HBS250L/EURODIB_HBS250L_SpecSheet_EN_2020.pdf"
    used_for: "Counterevidence to automatic variant/spec/net-versus-shipping equivalence; not actual BOM, LCI or measured mass"
  - id: "costco-hbs"
    type: "handbook"
    reference: "Costco Business Delivery, Eurodib10in slicer Item294577/modelHBS-250L, https://www.costcobusinessdelivery.com/p/-/eurodib-commercial-10-electric-meat-slicer/4201068265"
    used_for: "Real model listing and retailer delivery/return terms only; no proof of actual qualifying physical-store retail transaction or branch availability"
