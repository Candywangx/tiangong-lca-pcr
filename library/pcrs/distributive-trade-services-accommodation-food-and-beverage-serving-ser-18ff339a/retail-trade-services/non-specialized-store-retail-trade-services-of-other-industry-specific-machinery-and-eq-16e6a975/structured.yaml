system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "retail; failure; custody"
      rule: "Applicability requires actual evidence of a non-specialized physical store with mixed goods displayed for selection and cashier payment, a receipt linking that on-site selection/payment to this unique package, and final-user rather than wholesale/resale purpose. Record store_ID, floor/display evidence, purchase_channel, cashier_receipt_ID, customer_use and delivery_order_ID. Internet/mail, wholesale and specialized-store transactions are excluded even when supplied by the same brand. The Costco delivery listing is model/channel discovery only: it does not prove a qualifying physical-store transaction, branch stock or retail rather than wholesale. Unknown channel blocks applicability, not a modeller choice."
      source_ids:
        - un621
        - un62188
        - costco-hbs
    - rule_id: b_machine
      applies_to: "retail; failure; custody"
      rule: "Verify one actual HBS-250L region/revision/nameplate and complete original packing BOM. Standard installed blade/guard/sharpener and original packing remain one whole source; separately sold Teflon/replacement blades are excluded. The linked spec labels its 10in image HBS-250JS whereas the manual names HBS-250L; nominal thickness, dimensions/net mass and cheese claims conflict. Do not resolve those by choosing convenient catalogue numbers. Obtain actual supplier revision/configuration proof without opening retail goods. The route excludes opening, blade adjustment, powered testing, food contact, cleaning, oiling, sharpening and installation; any occurrence requires a state-specific reviewed extension with actual food/oil/cleaner/water/energy/waste cards before completeness. Manufacturer operating intervals are not retail energy defaults, machine waterproofing, food-use permission or safety approval."
      source_ids:
        - eurodib-hbs
        - eurodib-manual
        - eurodib-spec
    - rule_id: b_original
      applies_to: "failure; custody"
      rule: "For each unique original package j retain dispatch-manufacture/original-packaging vector W_j and separate actual receiving-inbound vector I_j. New original acquisition and carried-in originals are disjoint; return/retry/resale never reacquires manufacture. Assign each original source once among S final successful goods, F failed/lost goods charged to this service, T a named successor/asset original owner, and O still open/unassigned; S+F+T+O=1 per original. No fractional component ownership is admitted by this homogeneous whole-package route. Retail excludes S manufacture and I_S; a separate downstream GOODS system may add each once. Include W_F through failed_original and I_F through mandatory transport completion. Supplier return is not automatically a credit: a signed named T successor or unresolved O is required. Missing original identity/background never becomes zero."
      source_ids:
        - ghg2011
    - rule_id: b_delivery
      applies_to: "retail; failure"
      rule: "Include all retailer-arranged dispatch, failed attempt, redelivery, empty return and actual linked customer/supplier-return transport and internal handling sources, including successful deliveries. Merchandise receiving-inbound is included only for F under b_original. Keep actual legs/event_ID and lifecycle scope disjoint; merchandise transport and asset/material transport keep separate original owners under c_transport/a_assets. A delivered-price label never proves activity quantity, stage coverage or allocation. No customer self-collection route is interchangeable with this delivered service."
      source_ids:
        - ghg2011
        - costco-hbs
    - rule_id: b_support
      applies_to: "retail"
      rule: "This record is an explicit partial incremental core. Complete retail-service additionally requires actual facility/building/shelf, handling, checkout, lighting/fan/HVAC assets; facility heat/cooling/combustion/refrigerants; network/payment/receipt/admin/security; site cleaning and paper/extra delivery packaging/treatment. Determine actual presence, absence or unknown for every named source over all opening/closed/idle intervals, including leased/shared/landlord services. Use fixed c_transport/a_assets/c_digital/c_clean/c_material/c_species methods and actual atomic cards/protocols/providers before complete status. Complete contracted packages may remain intact only with verified exact objects, constituents/stages, physical activity/denominator and exclusions; distinct providers do not prove nonoverlap. Unknown presence, source identity or scope is explicit incompleteness."
      source_ids:
        - ghg2011
    - rule_id: b_identity
      applies_to: "retail; failure; custody"
      rule: "Only the adopted AC identity and count/mass/energy support chains have historical official direct-read evidence. AC is at use with unspecified voltage/provider/supply mix, not a verified electricity process. Bind each unverified service/goods/waste flow only after direct official UUID/status/name/state/type/property/unit/compartment and actual object matching. For actual losses or gas transfers bind the actual external receiver/medium, never infer outdoor emissions from internal leakage. UUID absence in this candidate is disclosed and blocks complete dataset identity, not an invented UUID."
      source_ids: []
