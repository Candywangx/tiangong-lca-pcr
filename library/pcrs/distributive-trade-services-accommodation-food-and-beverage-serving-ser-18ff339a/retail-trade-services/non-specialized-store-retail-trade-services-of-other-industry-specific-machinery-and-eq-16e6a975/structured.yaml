    - id: c_digital
      applies_to: "service_output"
      rule: "Allocate each unique actual network source-hours by reserved_endpoint_seconds_h/sum_all_endpoint_seconds, and each unique payment/admin source-event by actual line_processing_seconds_h/sum_all_line_processing_seconds; preserve failed events, empty reservations and all beneficiaries. For each original camera capture i freeze f_i_h=(footprint_m2_i_h*coverage_seconds_i_h)/sum_all_h(footprint_m2_i_h*coverage_seconds_i_h), with disjoint actual zone/time and original owner map/version. Capture production raw N_capture_i_h=actual_capture_source_i*f_i_h using its own original source_ID/unit/denominator/vector; normalized capture z_i restores raw z_i*D_i first. Indivisible multi-capture production totals remain incomplete until each actual original capture source is verifiable; no later retention driver. Storage raw bytehours_i=actual_retained_bytes_i*actual_retention_h_i, splitting variable stocks into fixed-byte intervals. For a single-capture storage provider raw total P_p assign P_p*f_i_h. For a multi-capture storage-only packet assign N_storage_p_h=P_p*sum_i((bytehours_p_i/sum_all_i(bytehours_p_i))*f_i_h), with actual complete packet members/time and original unit/vector/denominator. Single/aggregate storage modes are exclusive per source. Bytehours are a driver, not a second exchange beside provider activity. All positive sources require known positive denominators; missing members/maps remain incomplete without renormalizing known shares. GB=10^9bytes, GiB=2^30bytes. Skip only proven exact already-final owner/pool/version layers; remove included onsite electricity/assets/network before aggregation."
