  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Every unbound row remains unverified until official direct-read identity, public state, exact bilingual name/type/property/unit and qualifiers/compartment agree with its actual state. Bind service_pickup as this retail service, failed_kit as the complete original manufacturing product, custody satellites as actual boxed goods, and waste_kit as the accepted full mixed carrier with matching treatment. AC identity does not establish supplier grid mix/voltage or life-cycle performance; collect actual supply."
      evidence: "Official original responses and integrity receipts; actual supplier/treatment gate records"
    - id: quality_methods
      applies_to: "all inventory rows"
      requirement: "Collector, instrument, site, timestamps/timezone, raw IDs/units/frequency/period, calibration and uncertainty are required for every real field. Responsible source owner and independent reviewer reconcile raw -> fixed causal attribution -> compatible numerator -> one /Q. Unknown values/driver denominators, unresolved signed residuals, source omissions or treatment gaps block complete status; no invented defaults or zero clamp."
      evidence: "Signed source ledgers, calibration, reconciliation and open-issue register"
    - id: quality_boundary
      applies_to: "all inventory rows"
      requirement: "Declare partial core until every boundary_completion object is evidenced absent or present with actual method-complete atomic cards, scope-safe provider vector, required property/unit and identities. Whole mixed waste needs receiver signed actual constituent/state acceptance and complete treatment. Unknown refrigerant/fuel/store assembly/pre-sale tyre inflation/changed product state fails the narrow route. No overall environmental comparison or whole-business claim from this partial core."
      evidence: "Signed completeness matrix and full-period equipment/service survey; completed bilingual inventory"
    - id: quality_history
      applies_to: "all inventory rows"
      requirement: "Retain original and replacement versions for Q, S/F/T/O, all raw source IDs and all historical fV allocations, including zero-output pools. Final asset actual E replaces every historical allocation; late acceptance changes replace original source responsibilities and numerators. Do not append corrections without cancelling superseded amounts."
      evidence: "Version graph, all-beneficiary history, reconciled replacement deltas and original-pool reissue"
validation_rules:
  - rule_id: validation_scope
    applies_to: "all inventory rows"
    rule: "Reject a missing mixed-store channel, original lot/configuration/BOM, unopened-state evidence, Q qualification or full-period route absence proof. A manufacturer advertised load/speed/tyre pressure is product information only, not a PCR legal/safe-use acceptance limit or reference denominator."
    source_ids:
      - un-cpc62182
      - un-cpc49930
      - gorilla-gor4ps-manual
  - rule_id: validation_balance
    applies_to: "all inventory rows"
    rule: "Require separate Item(s) goods-only, kg held-waste and final-valid service ledgers; reconcile original event partitions and actual same-ID count/mass links. Signed residuals remain independent of confirmed missing. Direct dispatch cannot be stock-corrected again; background T cannot create a physical transfer."
    source_ids:
      - ghgp-product-2011
  - rule_id: validation_normalize
    applies_to: "all inventory rows"
    rule: "Q>0 is required for normalization. All displayed inventory amounts use reference_flow and one final common/Q; calculated numerators use calculated_value and calculated_from_collection, while service_pickup is fixed1 Item(s) with method_formula after count_service establishes Q>0. Verify raw core restoration, source/driver units, all-beneficiary shares1, source deduplication and every original-pool replacement. Zero-output and unknown remain explicit."
    source_ids:
      - ghgp-product-2011
  - rule_id: validation_complete
    applies_to: "all inventory rows"
    rule: "Do not mark a dataset complete while any actual necessary completion object, exchange binding, accepted waste treatment or quantity/background scope is unverified. Every added card must enter its actual one-process collection view, calculation Inputs and row scope; sync the aligned bilingual contract. Classification mapping decisions remain external; passing a finite check does not approve methodology or safe operation."
