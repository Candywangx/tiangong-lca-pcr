allocation_rules:
  - rule_id: ownership_original
    applies_to: "failed_kit; customer_return; customer_handover; supplier_handover; waste_kit"
    rule: "For each original homogeneous kit source s at supplier dispatch, conserve original manufacturing vector V_s and source ID/version across exclusive S/F/T/O responsibilities summing1. S is finally valid customer goods, F is destroyed/confirmed missing/non-service failed original responsibility retained by retailer, T is specifically acknowledged supplier/internal/other system responsibility, O is outstanding stock or unresolved responsibility carried forward. Whole original kits have 0/1 source ownership. Do not split V_s by component mass/count. A genuine split requires supplier original component quantities and environmental vectors, per-component S/F/T/O, separate real Product input cards for F and exclusion of those vectors from failed_kit. F includes originally lost/failed externally retained goods, not only retailer waste; never duplicate eventual resale manufacture. Inbound transport has a separate source at receiving gate and follows the same final original owner; manufacture dispatch excludes inbound. A supplier return moves custody but moves background to T only with signed responsibility; otherwise retain O/F as evidenced."
    source_ids:
      - ghgp-product-2011
  - rule_id: allocation_pools
    applies_to: "all inventory rows"
    rule: "Prospectively freeze one actual site/manually pulled transport-cart-version/year pool, beneficiary map and update versions. Include receiving failures, refused attempts, repeat handling, closed/idle and zero-sales periods; do not retain only successful transactions. A zero-Q pool remains unnormalizable with all raw burdens and cannot be silently dropped. Reopening and late revocation replace original Q, source fates and every original attributed numerator; do not charge correction again to a new cohort. Prefer directly measured subdivision; all shares for each full source pool sum1 across actual beneficiaries including failed/empty reservations. No price or sales-count default driver."
    source_ids:
      - ghgp-product-2011
  - rule_id: allocation_utilities
    applies_to: "retail_ac"
    rule: "Apply source_drivers to disjoint measured AC source pools, not to mixed driver dimensions. Direct cart-handling/checkout active circuits use measured cart-task device-seconds over all actual task device-seconds in that source; idle/fixed checkout/ICT equipment use measured reserved device-seconds over all actual reserved device-seconds including failures and empty reservations. Facility lighting/fans use served beneficiary footprint m2 multiplied by covered duration h over all beneficiaries and explicitly reserved empty areas. Separate equipment and facility pools before allocation. Reconcile each kWh pool and all attributed kWh to the actual parent meters; subtract a child only if that parent physically contains it, never from an independent disjoint meter. Electricity in external packages is excluded from retail_ac only by documented constituent/time/circuit boundaries."
    source_ids:
      - jrc-retail-2013
      - ghgp-product-2011
  - rule_id: allocation_asset
    applies_to: "all inventory rows"
    rule: "Apply asset_history to omitted capital and complete lifecycle packages. Keep each actual homogeneous model/BOM/scope vector independent. Measured original-pool exposure e_recorded divided by evidenced expected total lifetime exposure L_expected gives provisional f; cumulative f cannot exceed1 and unknown/insufficient L needs review. Use building fabric/structural package served m2*h (exclude separately modelled lamps/fans and other equipment); rack/pallet occupied m2*h; handling equipment measured device-use seconds; lighting/fan/checkout/ICT/router/camera equipment measured reserved device-seconds; reusable cleaning cloth measured cleaned m2. Manufacture, installation, operation, maintenance and EOL scopes must be disjoint. At retirement final E=sum actual exposure across ALL historical beneficiaries and f_final_h=e_actual_h/E. For EVERY historical owner/pool/version replace f_old_h*V_old with f_new_h*V_new and record delta; residual1-sum_old_f is QA only. Asset transport, repairs and EOL first belong to that asset and follow the SAME historical fractions/version replacements unless already attributed to exact final owner/pool/version. No current-retirement-Q shortcut, duplicated complete-package EOL carrier, new acquisition input besides lifetime fraction or sum of unrelated repair masses masquerading as a whole device."
    source_ids:
      - ghgp-product-2011
  - rule_id: allocation_services
    applies_to: "all inventory rows"
    rule: "Offsite network/payment/admin/security sources use service_ownership. Internet access never proves backend payment/admin/storage inclusion. Network source-hours have one real interval/provider denominator and allocate by each beneficiary measured reserved endpoint-connection seconds divided by all beneficiaries endpoint-seconds including failed/empty reservations; original sourceh and unique intervals are retained. One shared basket payment attempt or admin batch is one event allocated by measured within-event line processing seconds whose shares sum1; source labels alone do not assign the whole event. Camera captures freeze actual timestamped field-of-view beneficiary footprints*coverage duration, disjoint zone/time and all beneficiaries/empty reservations; storage byte*h follows the ORIGINAL frozen capture map, never later sales. 1GB=10^9 bytes, 1GiB=2^30 bytes. Preserve active/idle/fixed source subpools with one causal same-unit driver each. Only proven exact final owner/pool/version attribution skips repeat owner fraction."
    source_ids:
      - ghgp-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_events
      process_id: "retail"
      flow_role: "service_pickup; customer_return; customer_handover; supplier_handover"
      record_type: "Original kit custody and acceptance ledger"
      raw_fields: "original_kit_id; manually pulled transport-cart_variant; regional_variant; lot_id; four_wheel_BOM; carton_packing_declaration; wheel_revision; full_supplier_BOM; original_closure_state; factory_tyre_state; factory_tyre_pressure_evidence; no_presale_inflation_log; site_assortment; pool_dates; original_pool_id; audit_cutoff; acceptance_event_id; final_valid_acceptance; revocation_event_id; physical_event_id; recipient_id; physical_state; financial_only; G_open; R_new; U_customer; I_in; G_close; H_all; R_supplier; I_out; C_condemn; M_goods; epsilon_goods"
      collection_method: "Custodian scans unique carton/lot IDs at receipt, every physical handover/return and count at period boundaries; buyer records actual acceptance and reasons; finance separately flags pure financial changes. Reconcile carton seals and supplier packing declaration without claiming an unopened-kit inspection proves every internal part."
      unit: "Item(s)"
      frequency: "Every event and daily reconciliation; audit cutoff and any late-return update"
      temporal_coverage: "Complete prospective pool plus linked earlier/later corrections"
      site_scope: "Actual mixed-assortment store receiving, holding and pickup counter"
      aggregation_rule: "per reference flow"
      quality_evidence: "Custodian/acceptance signatures; dated stock takes; missing-ID investigations; measurement supervisor checks count completeness"
    - protocol_id: cp_original
      process_id: "retail"
      flow_role: "failed_kit"
      record_type: "Original source responsibility register"
      raw_fields: "original_kit_id; source_id; source_version; source_gate; original_owner; original_pool_id; n_original_s; V_s; full_supplier_BOM; f_S_s; f_F_s; f_T_s; f_O_s; signed_T_receipt; physical_event_id; physical_state; recipient_id"
      collection_method: "Supplier identifies whole original kit manufacturing vector at dispatch and complete lot BOM including packaging; analyst traces each original ID through acceptance, missing/discard and signed transfer. Validate all components and pack scopes; no web-weight-based background."
      unit: "Item(s)"
      frequency: "Every source receipt/fate change and pool reconciliation"
      temporal_coverage: "Whole original-source life across all pools and corrections"
      site_scope: "Supplier-dispatch evidence linked to retailer gate and final recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed supplier vectors/BOM; S/F/T/O sums1; responsibility and historical replacement audit"
    - protocol_id: cp_power
      process_id: "retail"
      flow_role: "retail_ac"
      record_type: "Actual electricity source/circuit records"
      raw_fields: "meter_id; parent_meter_id; child_contains; source_subpool_id; source_mode; start_time; end_time; kWh_j; task_device_seconds; reserved_device_seconds; served_m2_h; d_pool_j; sum_all_d_j; empty_reservation; beneficiary_id; included_external_scope; E_AC"
      collection_method: "Energy manager reads calibrated revenue/submeters for all sites/circuits through complete period including closure. Record active equipment task timers, fixed/idle reserved device time separately from facility surveyed served area*time. Circuit diagrams prove containment; never use rated cart payload or nominal device power as measured consumption."
      unit: "kWh; s; m2*h"
      frequency: "Meter interval and each task/reservation; monthly bill reconciliation"
      temporal_coverage: "All operation, idle, closed and failed intervals in pool"
      site_scope: "Retailer actual grid import and named disjoint circuits"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration certificate/zero/time checks; bill/circuit reconciliation; all shares1; missing intervals block completeness"
    - protocol_id: cp_waste
      process_id: "residual"
      flow_role: "waste_kit"
      record_type: "Unopened complete rejected kit carrier consignments"
      raw_fields: "waste_event_id; original_kit_id; physical_state; actual_constituents; original_pack_present; dispatch_consignment_net_kg; tare_kg; W_open; W_condemned; W_other_in; W_close; W_transfer; M_waste; epsilon_waste; C_condemn; carrier_net_kg_same_ID; receiver_id; signed_acceptance; treatment_scope; transport_scope"
      collection_method: "Waste manager weighs each real entire unopened kit-plus-original-pack carrier on a calibrated scale at dispatch, with actual tare and receiver weighing where available. Measure same-ID condemnation net kg and held stocks independently. Receiver signs actual steel/polymer/rubber/pack constituents and state with matching full treatment boundary; a photo/license alone is insufficient."
      unit: "kg; Item(s)"
