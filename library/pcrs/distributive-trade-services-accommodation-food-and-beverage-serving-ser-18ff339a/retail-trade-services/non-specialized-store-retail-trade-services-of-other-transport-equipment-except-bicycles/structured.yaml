  calculation_rules:
    - id: count_service
      applies_to: "service_pickup"
      rule: "Q=count distinct original_kit_id with final_valid_acceptance=true at audit cutoff in original pool. A later revocation reclassifies the original ID even without physical movement. A refund/discount with acceptance still valid does not change Q. A return/resale contributes at most one final-valid original ID; never subtract revocations from an already final-valid count. service_pickup=Q/Q for Q>0."
      inputs:
        - original_kit_id
        - final_valid_acceptance
        - audit_cutoff
        - original_pool_id
        - acceptance_event_id
        - revocation_event_id
        - physical_event_id
        - financial_only
        - Q
      output: "service_pickup"
      source_ids:
        - ghgp-product-2011
    - id: stock_goods
      applies_to: "customer_return; customer_handover; supplier_handover; failed_kit"
      rule: "Goods-only count balance: G_open+R_new+U_customer+I_in=G_close+H_all+R_supplier+I_out+C_condemn+M_goods+epsilon_goods. H_all contains ALL gross customer handovers (initially accepted AND never accepted) with disjoint physical event IDs; do not add another failed-handover exit. U_customer records actual complete return entries. Revocation without movement is not another exit. C_condemn moves goods into held waste internally; physical waste dispatch is not a second goods exit. M_goods is confirmed missing count, epsilon_goods is signed unresolved count residual. Both remain explicit; internal transfers never create service."
      inputs:
        - G_open
        - R_new
        - U_customer
        - I_in
        - G_close
        - H_all
        - R_supplier
        - I_out
        - C_condemn
        - M_goods
        - epsilon_goods
        - physical_event_id
        - original_kit_id
      output: "goods_balance"
      source_ids:
        - ghgp-product-2011
    - id: background_f
      applies_to: "failed_kit"
      rule: "For original kit source s, N_F=sum_s n_original_s*f_F_s; failed_kit=N_F/Q. Each n_original_s is actual whole original kit count and f_F_s follows ownership_original. Link the supplier-dispatch V_s once; distinct source vectors remain separate model/lot cohorts. Source-equivalent original count is not waste kg or a new physical receipt. S/F/T/O and F revisions replace old source records."
      inputs:
        - n_original_s
        - f_F_s
        - f_S_s
        - f_T_s
        - f_O_s
        - V_s
        - source_id
        - source_gate
