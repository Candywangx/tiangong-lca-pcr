    - id: completion_materials
      applies_to: "all inventory rows"
      rule: "For each actual homogeneous original formulation source c, D_c=source_original_kg is the measured original formulation kg, excluding its separately modelled container. At each audit cutoff conserve the entire source history: D_c=unused_sealed_kg+unused_opened_kg+unused_damaged_retained_kg+first_used_cumulative_kg+preuse_dispatched_source_kg+preuse_confirmed_missing_source_kg+neverused_transfer_source_kg+signed_unused_residual_kg. Unopened never-used undamaged stock, opened never-used usable stock and damaged never-used retained stock are exclusive real states and never default zero. Starting at first actual use, retain a cumulative original-source ledger: first_used_cumulative_kg=consumed_no_recoverable_source_kg+used_retained_working_source_kg+used_retained_container_source_kg+used_damaged_retained_source_kg+dispatched_container_residue_source_kg+rinsate_origin_source_kg+used_transfer_source_kg+postuse_confirmed_loss_source_kg+signed_used_residual_kg. Consumed_no_recoverable excludes all other recoverable/dispatched destinations. Every use, spill, rinse, retention, dispatch and correction replaces the source's prior state/destination records through the entire history, never appending the same used quantity again on rinsing or forgetting prior periods. Added water/dirt/container mass is excluded from formulation-origin kg; directly measured entire wet carrier kg is a different physical quantity. For manufacturing/inbound responsibility, u_first_c_h is the actual original quantity crossing first-use gate for original owner/pool h; f_preuse_c_h is disjoint actual original quantity finally assigned F before first use, including evidenced condemned retained quantity or confirmed missing/dispatch, not unresolved damaged stock. Require sum_h u_first_c_h=first_used_cumulative_kg; the f_preuse owner records are an exclusive responsibility classification of the actual before-use failed portions, not another physical destination. Across all historical owners sum_h(a_use_c_h+a_preuse_c_h)<=1, with unassigned/acknowledged transferred remainder explicit. Set a_use_c_h=u_first_c_h/D_c and a_preuse_c_h=f_preuse_c_h/D_c; manufacturing numerator=(a_use_c_h+a_preuse_c_h)*V_manufacture_c and inbound numerator=(a_use_c_h+a_preuse_c_h)*V_inbound_c, each once, unless already assigned to exact final owner/pool/version. V_manufacture_c is formulation-only at dispatch and V_inbound_c is its disjoint original receiving source. Keep unassigned never-used stock/transfer/return sources carried forward. Reuse adds no manufacture/inbound; correct original historical a*V records and original pools if evidence changes. For a real homogeneous ancillary package source apply the same first-use/failure equation using D_c=source_original_count in Item(s), its source_quantity_unit and matching whole-package vectors, separately from formulation kg; never partition a full heterogeneous bottle/cart/kit environmental vector by mass. Original manually pulled transport-cart kit packaging already in V_s is excluded from ancillary inputs. Direct actual whole effluent carrier uses V_discharge*rho_measured, without composition multiplication or evaporation/storage deductions; supply-meter m3 already excludes internal reuse. Require matching water/chemical/package/tool cards and treatment; no water-only reconstruction of whole liquid. Reusable cloth uses measured cleaned m2 and asset_history."
