    - id: source_drivers
      applies_to: "retail_ac"
      rule: "For each disjoint metered source subpool j, A_j=kWh_j*d_pool_j/sum_all_d_j; retain direct-source ownership as share1 only with measured scope evidence. d is actual task-device seconds for active equipment, reserved-device seconds for idle/fixed equipment, or served m2*h for facility pools as allocation_utilities fixes. Sum_all_d_j must be known positive and include all failed/empty beneficiaries. E_AC=3.6*sum_j A_j; retail_ac=E_AC/Q. Keep raw kWh_j and attributed A_j separately; no dimensionally mixed driver."
