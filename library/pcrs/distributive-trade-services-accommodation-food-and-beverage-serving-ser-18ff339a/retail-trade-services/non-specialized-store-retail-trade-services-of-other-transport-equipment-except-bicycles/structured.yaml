    - id: transport_chain
      applies_to: "all inventory rows"
      rule: "Use trip/segment j -> actual consignment or asset c -> final original owner/pool h. For documented mass-limited loaded service, w_c_j=actual_load_kg_c_j/sum_all_load_kg_j; for documented volume-limited loaded service, w_c_j=actual_occupied_m3_c_j/sum_all_occupied_m3_j. Retain actual capacity eligibility, segment manifests and binding constraint proof; unknown/another constraint blocks this choice. Empty travel has positive vehicle-km with measured reserved capacity*distance shares; stationary idle is a separate positive source measured in vehicle-h and reserved capacity*h shares, including all empty/failed reservations and actual fuel/provider coverage. Never make t*km0 cover empty/idle activity. A_c_j=raw_trip_source_j*w_c_j; final A_c_j_h=A_c_j*owner_fraction_c_h. Provider consignment attribution skips w only, not still-missing F/first-use/asset-history owner fraction. Only exact original final owner/pool/version skips that fraction. Provider source boundaries must exclude any duplicate loaded/empty/idle fuel, fleet capital, return/asset repair/waste transport already included elsewhere."
