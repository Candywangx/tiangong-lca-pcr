    - id: waste_dispatch
      applies_to: "waste_kit"
      rule: "W_dispatch=sum actual dispatch_consignment_net_kg for the unchanged complete unopened kit-plus-original-pack carrier; waste_kit=W_dispatch/Q. Direct weighed dispatch kg is never reduced again by closing stock, reused stock or source composition. Independent held-wastekg QA: W_open+W_condemned+W_other_in=W_close+W_dispatch+W_transfer+M_waste+epsilon_waste. Link C_condemn Item(s) to W_condemned kg by actual same-ID net carrier weighings, never nominal cart mass. M_waste is confirmed missing held-waste kg; epsilon_waste is a separate signed unresolved residual. Neither becomes fictitious treatment."
