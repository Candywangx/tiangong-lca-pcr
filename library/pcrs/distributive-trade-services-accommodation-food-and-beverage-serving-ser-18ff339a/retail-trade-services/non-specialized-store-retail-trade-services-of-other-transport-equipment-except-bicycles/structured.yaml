      rule: "Network A_network=sourceh_interval*endpoint_seconds_pool/sum_all_endpoint_seconds for each unique interval, with original interval and all-beneficiary reservations retained. Provider interval-hours do not equal each SKU hours. Shared event A_event=raw_event_quantity*line_processing_seconds_pool/sum_event_line_seconds for each unique payment attempt/admin batch. Camera f_capture=footprint_duration_pool/sum_all_footprint_duration in frozen disjoint zone/time map; A_storage=sum captured_source_bytes*retention_h*f_capture. Preserve byte conversion, capture/map versions and all empty reservations. Keep each provider source amount/property/unit separate; a bundle stays intact only with actual common denominator, constituent lifecycle/electricity/backend exclusions and ownership. Exact final owner/pool/version attribution alone permits omitting an already applied owner share."
