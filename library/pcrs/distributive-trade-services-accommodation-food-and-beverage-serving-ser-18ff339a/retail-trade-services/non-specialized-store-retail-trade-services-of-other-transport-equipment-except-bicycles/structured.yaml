    - id: asset_history
      applies_to: "all inventory rows"
      rule: "For each asset/source vector a and original historical beneficiary h, provisional f_a_h=e_recorded_a_h/L_expected_a. Record actual measured exposure unit from allocation_asset and supporting expected lifetime evidence. At retirement E_a=sum_h e_actual_a_h across the entire history, f_final_a_h=e_actual_a_h/E_a. Recompute every historical numerator as f_new_a_h*V_new_a and record delta_a_h=f_new_a_h*V_new_a-f_old_a_h*V_old_a. Apply the same owner fraction once to separate attributable asset transport/repair/retirement sources; actual terminal carrier kg is independently measured, then its lifecycle responsibility fraction once. Entire-package contained EOL is not emitted again. Each affected original pool is renormalized once by its own revised Q."
