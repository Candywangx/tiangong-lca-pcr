    - id: completion_restore
      applies_to: "all inventory rows"
      rule: "For each SAME exchange identity/property/unit and original source/owner/pool/version, retain raw external numerator X directly; if and only if a module supplies normalized z per its original evidenced denominator D, first recover X=z*D. Restore only missing trip/owner/asset attribution layers using recorded attribution_level, never an already-applied layer. Check actual event/time/constituent/lifecycle scope overlaps even if provider IDs differ. Freeze compatible raw core numerators N_core (N_F, E_AC, W_dispatch and custody totals) before their displayed /Q. Final compatible amount_i=(N_core_i+sum disjoint correctly attributed X_external_i)/Q once. Do not add normalized cards to raw modules, add unlike properties/units, drop raw F/AC, duplicate F or count physical satellites as new production. Completion remains partial until all boundary_completion objects have actual atomic cards, protocols, identities and verified raw numerator reconciliation."
