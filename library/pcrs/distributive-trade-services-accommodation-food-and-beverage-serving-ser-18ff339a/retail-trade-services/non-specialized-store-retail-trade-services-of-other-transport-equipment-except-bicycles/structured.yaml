    - id: custody_amounts
      applies_to: "customer_return; customer_handover; supplier_handover"
      rule: "customer_return=U_customer/Q; customer_handover=H_all/Q; supplier_handover=R_supplier/Q. Use actual complete unopened original-kit physical event totals from stock_goods, with recipient and state per event. Failed external retention remains within H_all and changes acceptance/background, not another physical exit or retailer waste."
      inputs:
