system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: boundary_scope
      applies_to: "all inventory rows"
      rule: "The starting gate is physical retailer receipt of the complete unopened kit. Core inventory covers attributed point-of-use AC for receiving, holding, checkout and residual handling, failed original kit manufacture at supplier dispatch, and actual whole-kit waste dispatch. It is a PARTIAL incremental retail-service core until boundary_completion is satisfied. Successful-goods S manufacture is excluded from this service and may enter a separately declared downstream GOODS system exactly once."
      source_ids:
        - ghgp-product-2011
        - jrc-retail-2013
    - rule_id: boundary_model
      applies_to: "all inventory rows"
      rule: "Freeze the actual manually pulled transport-cart regional variant separately: manually pulled transport-cart, -C and AU are not interchangeable; TW0345-3 for lot<335623 and TW0377 wheels must be verified from actual lot and all four wheel assemblies, not treated as one source vector. Actual carton packing records and signed supplier declarations must establish the unassembled kit contents; assembled webpage images cannot establish sealed contents. Admit only real manually pulled transport-cart kit lots whose supplier signed inventory covers all cart components, coatings, wheel/tyre/tube/valve variants, fixings, instructions, and carton/liners/ties/labels/adhesives. Choose one complete supplier-dispatch manufacturing vector per original kit or a verified disjoint original component-vector reconstruction, never both. Manufacturer specifications establish object and intended hand-pulled goods-vehicle use, not field quantities, complete BOM/LCI, compliance or approval. No payload, website weight or assembled dimensions substitute for received kit count, net carrier mass or carton volume."
      source_ids:
        - gorilla-gor4ps
        - gorilla-gor4ps-manual
        - un-cpc49930
    - rule_id: boundary_state
      applies_to: "all inventory rows"
      rule: "Admission requires lot packing confirmation and intact original closure at receipt and each customer/supplier handover. A visibly damaged but still unopened complete rejected kit may use waste_kit only if the entire original configuration remains together. Opened, missing-component, assembled, demo, changed tyres, store/pre-sale tyre inflation, repaired or wet/contaminated goods require state-specific atomic cards, original-vector conservation and bilingual sync before completeness; they cannot disappear or be relabelled as unopened. Factory tyres may already contain air: collect actual lot-specific factory tyre condition and pressure/closure evidence; do not infer a deflated factory state or exclude original factory inflation. No actual transaction is asserted by this PCR."
      source_ids:
        - gorilla-gor4ps
        - gorilla-gor4ps-manual
    - rule_id: boundary_route
      applies_to: "all inventory rows"
      rule: "This narrow route has manual handling, electronic receipts, grid AC and non-refrigerated ambient holding. Site manager must inventory every actual facility/leased/service-controlled device over the whole period: lighting, fans, heating/HVAC, material handling, checkout, ICT, security, cleaning, backup power and fire equipment. Complete dated equipment/service logs must establish no on-site combustion, fuel, refrigerant-containing operation or release, store assembly/pre-sale tyre inflation or paper/bag issue within scope. Present or unknown facts block this route as complete; add actual species/state/medium methods and cards through reviewed bilingual revision or use an applicable PCR. Upstream contracted transport can contain fuel/emissions only inside its verified complete provider boundary."
      source_ids:
        - jrc-retail-2013
    - rule_id: boundary_satellites
      applies_to: "customer_return; customer_handover; supplier_handover; failed_kit; waste_kit"
      rule: "Only customer_return, customer_handover and supplier_handover are physical custody Product satellites without additional manufacturing characterization. Raw receipts remain QA. failed_kit is an actual characterized Product INPUT carrying original F manufacture, never a satellite exclusion. waste_kit is a characterized Waste OUTPUT requiring complete matching treatment. Background ownership T does not manufacture a physical movement; use actual recipient/state/event, whether or not acceptance survives."
      source_ids:
        - ghgp-product-2011
    - rule_id: boundary_completion
      applies_to: "all inventory rows"
      rule: "Before complete-service use, inventory every necessary omitted source using cp_completion and calculations completion_restore, source_drivers, asset_history and transport_chain. Required completion objects are inbound/return/waste/asset transport; building and fixtures including lighting/fans; racks/pallets/manual handling devices; checkout/ICT/router/network/cameras and storage; payment and administration backends; cleaning water, actual detergent and reusable cleaning tool lifecycle; ancillary packaging and actual associated wastes. For each actual homogeneous object create its own named atomic card (building_model_life, lamp_model_life, fan_model_life, rack_model_life, handling_model_life, checkout_model_life, ict_model_life, router_model_life, camera_model_life, storage_service, network_access, payment_processing, admin_processing, water_in, detergent_formula, cloth_model_life, cleaning_effluent, plus actual source-specific packaging/wastes/transport). These are completion role names, not fictitious exchanges already supplied by this core. Record actual model/composition/state, flow/type/direction/property/unit, raw numerator and provider boundary, relevant protocol and frozen owner. Split heterogeneous models, formulations and destinations; a real documented complete lifecycle/service package may stay intact with exact constituents/exclusions. Retain a signed present/absent/unknown matrix; absence needs evidence, unknown blocks completeness. Author required actual cards in both languages, bind identities and verify treatment/background scopes before sync and check. Do not merely append an unquantified module list."
      source_ids:
        - jrc-retail-2013
        - ghgp-product-2011
