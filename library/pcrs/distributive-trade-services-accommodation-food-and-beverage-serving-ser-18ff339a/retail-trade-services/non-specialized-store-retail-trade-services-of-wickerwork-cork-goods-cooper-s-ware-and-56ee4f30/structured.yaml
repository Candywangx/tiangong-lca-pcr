system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: material_gate
      applies_to: "custody"
      rule: "The manufacturer material table specifies rattan with clear lacquer for basket/binding and polyethylene with galvanized steel for feet, but bamboo appears in same-source descriptive/image wording. This conflict is not resolved by the catalog. At receiving obtain lot-linked supplier BOM and physical material identification; retain botanical species/provenance or explicitly unresolved identity, lacquer formulation/dry coating mass, complete binding/feet and any liner/adhesive/label, wet/dry basis and moisture test conditions. Confirm the actual route before use; unknown material/composition blocks complete modelling. Do not treat bamboo and rattan as environmentally equivalent. The package weight 0.96kg is not measured net basket mass or a composition fraction."
      source_ids:
        - ikea-snidad
    - rule_id: partial_boundary
      applies_to: "retail; residual"
      rule: "The assessed core includes only attributable point-of-use electricity and actual whole-basket/original-carton/PE-film waste handoff plus service-attributable original-goods failure background. basket_receipt is the characterized responsibility input for F original receiving-gate goods background. basket_handover, basket_supplier_return and basket_external_retention are mandatory physical satellite outputs excluded from characterized environmental summation and upstream linking. This is a partial incremental module: whole-store occupancy/building, lighting fixtures, checkout equipment/software, cleaning, heating/cooling/ventilation, staff travel and customer travel remain outside this core; required support completion is fixed by complete_support and asset_lifetime. A core result must retain these gaps and cannot be called complete retail service. Supplier production and inbound transport to the same receiving gate for finally accepted goods attach downstream through B_S/Q, never through the F responsibility input or satellite outputs."
      source_ids: []
    - rule_id: route_gate
      applies_to: "retail"
      rule: "Use observed manual floor-display and customer-takeaway records. Retailer-added bags, receipts on paper, tape, treatment chemicals, cleaning of baskets, electric handling equipment, repairs, stripping, replacement feet or other actual added exchanges require specifically named atomic cards, linked protocols and aligned bilingual projection before completeness. They do not become zero by this route definition. Absence must be evidenced by site inspection, purchasing/stock records and staff confirmation for the entire pool; unknown presence blocks route applicability or remains a disclosed partial gap. Consumer dry-cloth care and possible recycling/energy recovery are not evidence of retailer cleaning, actual treatment or an avoided-burden credit."
      source_ids:
        - ikea-snidad
    - rule_id: custody_state
      applies_to: "custody; residual"
      rule: "Use a goods-only count balance with disjoint supplier_received and physical_customer_returns, initially accepted gross_customer_handovers (including later revocations) and initially nonaccepted external exits: G_close=G_open+supplier_received+physical_customer_returns-gross_customer_handovers-supplier_handoffs-external_nonaccepted_handoffs-condemned-internal_asset_transfers-lost. Condemnation moves one original from goods into held waste; held_waste_close=held_waste_open+condemned-waste_dispatch in original-ID equivalents. Dispatch removes held waste only and is never subtracted again from goods. Record mass separately; moisture/storage changes do not change object count. Lost/stolen IDs are separate goods exits with investigation and responsibility, not fictitious dispatched waste. Actual waste consignment kg is measured directly, not corrected again using generation/stock balance. Each physical event ID belongs to exactly one inflow or outflow category. A later-revoked handover stays only in original gross_customer_handovers; external_nonaccepted_handoffs counts additional actual exits never already recorded in gross. supplier_received excludes rereceipts already recorded as physical_customer_returns."
      source_ids: []
    - rule_id: background_ownership
      applies_to: "custody"
      rule: "For each original j preserve the entire receiving-gate upstream inventory vector B_j including basket materials/coating/feet, actual original packaging and manufacturing plus transport to that gate. Allocate each whole original once to mutually exclusive final ownership S(final-valid accepted), F(service-attributable failure/loss including retailer-responsible external retention), O(open stock/held waste pending responsibility) or T(named supplier/internal asset/other continuing responsibility). Responsibility is not a physical movement. Supplier return retains original source/version and named owner; no automatic disappearance or credit. Accepted and resold originals carry one B_j, never another manufacturing charge. Partial-component separation needs verified supplier component inventory vectors and exact source-boundary conservation, never mass fractions of B_j. Record T to permanent display assets under the same original source and lifetime ledger without charging F and a new acquisition."
      source_ids: []
    - rule_id: state_carriers
      applies_to: "residual"
      rule: "Whole condemned-basket waste includes actual lacquer, binding and feet physically present; do not also output constituent rattan/steel/polyethylene. Retain original-ID and gross/tare/net weighing plus recipient treatment contract accepting this complete coated mixed-material carrier. An opened/damaged basket sent to a supplier is not described by an intact basket transfer: author a state-specific card before complete reporting. Externally retained nonaccepted baskets require actual recipient, condition, acceptance revocation and background owner; they are not automatically retailer waste. Original carton and film cards include only verified disjoint consignment portions. Unknown package BOM, another carrier, absent recipient coverage or unknown treatment blocks completeness."
      source_ids: []
