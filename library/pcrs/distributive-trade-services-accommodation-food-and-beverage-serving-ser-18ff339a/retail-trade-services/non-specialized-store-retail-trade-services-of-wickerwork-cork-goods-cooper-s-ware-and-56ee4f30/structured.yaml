allocation_rules:
  - rule_id: final_service
    applies_to: "retail_service"
    rule: "Q is the cardinality of distinct original IDs whose last valid acceptance remains in force at the cutoff. A physical return followed by resale can contribute at most one final-valid ID. Revocation removes validity even without physical return; do not subtract revocations again from this already final-valid set. Refund/discount alone with acceptance still valid does not remove output. Keep gross custody, event counts, rejected attempts and returns separate. Retain repeated work, failed and zero-sale periods in the prospectively fixed same-configuration pool. If Q=0 retain raw totals as unnormalizable; do not discard or transfer selectively to successful periods. Late returns replace original pool numerator, Q and B ownership/fates with dated version corrections, never a second charge in the receiving pool."
    source_ids: []
  - rule_id: pool_allocation
    applies_to: "retail_electricity"
    rule: "First use a dedicated meter for actual handling/display/checkout electricity within the declared core; if a parent meter includes that circuit, subtract it once when preparing disjoint support. Never subtract it from an already disjoint meter. For unavoidable shared electricity split measured active, idle and fixed source-numerator pools and reconcile their kWh to parent. Allocate active pool by measured powered transaction seconds among all beneficiaries; idle/fixed pool by measured reserved floor area*time among all beneficiaries including closed/failed periods. Each pool has one same-unit driver and positive known total. Do not add seconds to m2*h, use sales revenue or let zero driver hide idle energy. Sum compatible attributed kWh only after allocation; divide by Q once. If the causal driver or pool split is unknown, retain unallocated measured kWh and block complete service result."
    source_ids:
      - ghg-product-allocation
  - rule_id: asset_lifetime
    applies_to: "support_completion"
    rule: "For each complete actual store shell/fitout, fixed lighting, display support and checkout asset a obtain model/BOM or verified complete provider lifecycle package, acquisition/source IDs, installation, all previous beneficiary exposures and replacement versions. With one declared causal unit per asset, f_ab=e_ab/L_a where e_ab is current beneficiary exposure and L_a expected total lifetime exposure including all past/current/future beneficiaries. Area*time may govern shell/fixtures, transaction seconds checkout; never sum unlike drivers. Allocate each manufacturing/installation inventory vector by f_ab; cumulative lifetime fractions<=1. At retirement replace every historical beneficiary fraction using actual total lifetime exposure and post residual/corrections; lifespan changes replace all prior versions, never restart full manufacture. Terminal whole-asset net carrier times the same final lifetime fraction once; direct whole-device net weighing and BOM reconstruction are exclusive. Actual replacements/maintenance use event-specific sources and all event beneficiaries; exclude manufacturer-included repair/EOL and provider-included utility scopes to prevent duplicate acquisitions, maintenance, operation and retirement."
    source_ids: []
  - rule_id: complete_support
    applies_to: "support_completion"
    rule: "Before a full-service claim, complete a fixed occupancy package covering actual building/fixtures/display/POS capital and lifetime retirement, shared lighting/checkout electricity excluded from the core meter, verified natural ventilation without combustion/refrigeration/purchased heat or cold, sanitary/cleaning operation and actual maintenance for the same site/pool. Obtain a signed provider LCI scope and original quantity basis or author each actual atomic exchange and protocol; an invoice alone is insufficient. Restore provider normalized row x by its evidenced original denominator D_x to raw same-pool numerator N_x=x*D_x, allocate using the disjoint meters/pool_allocation or asset_lifetime as applicable, then aggregate only identical flow identity/property/unit/boundary with exact source-ID/version deduplication and divide total raw numerators by final Q once. Do not add MJ to kg or normalized to raw. Core electricity and waste sources cannot be inside this package again. Unknown operation or provider coverage remains a named blocking gap, not zero."
    source_ids: []
  - rule_id: support_operation
    applies_to: "support_completion"
    rule: "This PCR permits only an evidenced naturally ventilated, unconditioned store route with no onsite combustion, no refrigeration/heat pump/refrigerant-containing operating equipment and no purchased heat or cold within the store support control boundary. Before applying this route inspect all site/shared landlord equipment, utility contracts/bills, purchase/maintenance registers and the complete pool dates; supplier/landlord attestations must cover shared support as well as the basket area. Unknown status or any such present equipment/energy makes this route inapplicable: author and independently review a specific expanded route with complete fuel/refrigerant initial charge, operation, recovery, contained transfers, room/control volume and external compartment methods before use. Do not merely mark an unknown equipment item zero. Actual electricity remains metered under pool_allocation. Natural ventilation is not evidence of zero product emission; internal room generation cannot be reported as an elementary external-air transfer. Any claimed goods-derived species emission/capture requires a separate reviewed measured inlet/outlet/air-stock/merchandise-stock/capture control-volume module and actual external medium, with terminal capture carrier deduplication; until supplied, no emission factor or negative credit is inferred and result stays explicitly partial."
    source_ids: []
  - rule_id: cleaning_completion
    applies_to: "support_completion"
    rule: "For the required site-cleaning support collect actual formulation identity/concentration and original supplied formulation kg, water meter boundary and density/state, container/cloth inventories and dated cleaning events. Final original-formulation mass destinations are mutually exclusive: unused closing stock, container-retained residue, wet-cloth-retained formulation, drained formulation and separately captured solid; used is an intermediate state replaced by these later fates, never another additive destination. Exclude added rinse water/dirt from formulation-origin kg. Whole effluent amount is exclusively direct gross-minus-tare net liquid weighing or metered actual whole-effluent volume*measured same-carrier density; do not reconstruct from water balance or subtract evaporation/reuse again. Supply meters already exclude internal reuse. Wet cloth, container-residue and drain consignments each use actual complete net carrier mass, with disjoint source portions; wet mass is not source formulation kg. Author actual identified formulation, water, cloth lifecycle and complete waste-carrier atomic cards/protocols before claiming support completeness; unknown identification or receiver acceptance blocks completion."
    source_ids: []
  - rule_id: transport_completion
    applies_to: "support_completion; residual; custody"
    rule: "For each actual transport source define trip/segment p, vehicle/provider, loaded distance km, actual complete consignment gross payload kg, travel h and stationary idle h, capacity kg, reserved capacity C_pb kg and reservation time t_pb h for every actual beneficiary b including operator/unused capacity responsibility. Loaded tonne-km=payload_kg*distance_km/1000 is activity QA, not a complete empty-trip measure. Preserve observed empty reposition and idle segments. If provider already attributes its exact consignment inventory, restore its original basis and retain allocation; segment records are QA and must not apply another share. Otherwise obtain complete disjoint raw segment inventory vector N_p, with explicit vehicle manufacture/installation/maintenance/end-of-life and operational electricity/fuel/upstream scopes; verify each stage covered once, excluding scopes already in B_j or waste provider package. Allocate each segment once by w_pb=C_pb*t_pb, share=w_pb/sum_b(w_pb), so all denominator terms have kg*h. Include actual travel and stationary-idle reservation time, even with zero payload/distance; reservations and beneficiaries must reconcile to contract/route capacity and duration. Unknown or zero total reservation while activity exists blocks completion, not an assignment of zero. Sum only compatible attributed exchange units, then divide common Q once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "custody"
      flow_role: "F-original product responsibility input and independent custody satellite"
      record_type: "original foreground records"
      raw_fields: "original_id; receipt_lot; supplier_model/BOM/material_test; botanical_identity/provenance; bamboo/rattan_conflict_resolution; moisture_value/method/wet_dry_basis; actual_lacquer/binding/feet/liner/label; original_pack_BOM; gross/tare/net_basket_kg; event_id/date/state/recipient; goods_open/supplier_received/physical_customer_returns/initially_accepted_handovers/supplier_handoffs/external_nonaccepted/condemned/internal_asset/lost/goods_close; held_waste_open/condemned/dispatch/close; B_j/source/version/receiving_gate; S/F/O/T_owner; component_inventory_vectors; N_F; F_original_ids; original_supplier_inventory_vector; original_pack_BOM; mutually_exclusive_event_category"
      collection_method: "Receive and barcode every original; inspect lot-linked material and complete BOM including lacquer/feet. Weigh on calibrated scale excluding separately recorded packaging; record moisture instrument, calibration, temperature/time and dry/wet basis. Reconcile dated movements with supplier/customer receipts and separate goods/held-waste states. Obtain original receiving-gate supplier inventory and inbound transport boundary; whole vector transfers only unless supplier verified components exist. Independently identify each F original and link its receiving-gate B_j once through basket_receipt N_F/Q responsibility input; physical rereceipt counts do not define this amount. Audit disjoint event categories; late revocation without movement only reclassifies the original gross handover final state."
      unit: "Item(s); kg"
      frequency: "each event and period close"
      temporal_coverage: "all originals including failures and unsold stock"
      site_scope: "same site/configuration; source-parent history"
      aggregation_rule: "per reference flow"
      quality_evidence: "lot BOM, photographs, material identification, scale/moisture calibration, inventory-source receipts and signed responsibility"
    - protocol_id: cp_acceptance
      process_id: "retail"
      flow_role: "final-valid reference service"
      record_type: "original foreground records"
      raw_fields: "pool_id/version/start/end/cutoff; original_id; sale/physical_handover/return/revocation/resale/refund_event_id/date; final_valid_acceptance; rejected_attempt; source_pool_correction; Q"
      collection_method: "Join sales and dated acceptance/return records by original_id, inspect actual acceptance conditions, independently recompute last valid state; preserve event history and late correction versions."
      unit: "Item(s)"
      frequency: "each event; close and late-event revision"
      temporal_coverage: "entire declared pool including zero output"
      site_scope: "same store and basket configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "POS/acceptance receipts, dated return state, unique-ID audit"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "point-of-use electricity"
      record_type: "original foreground records"
      raw_fields: "pool/version; meter_id/circuit_boundary/start/end/kWh/calibration; core_submeter_in_parent; active/idle/fixed_kWh; beneficiary_id; powered_seconds; reserved_m2; duration_h; corrections; Q"
      collection_method: "Read calibrated meters over full pool; document circuit diagram and overlapping parent/submeters. Verify active/idle/fixed kWh source split and complete all-beneficiary same-unit drivers. Preserve idle/closed/failure periods and dated corrections."
      unit: "kWh; s; m2*h"
      frequency: "interval readings and period reconciliation"
      temporal_coverage: "all open/closed/zero-sale intervals"
      site_scope: "core circuit; all actual shared beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, circuit diagram, interval logs and allocation reconciliation"
    - protocol_id: cp_waste
      process_id: "residual"
      flow_role: "actual dispatch of complete basket and disjoint original packaging"
      record_type: "original foreground records"
      raw_fields: "consignment/date/recipient/provider_contract/treatment/transport_boundary/loaded_empty_idle_coverage/provider_allocation_status; source_original_id/B_owner; state/components; gross/tare/net_kg/scale/calibration/moisture; original_pack_BOM/material; carton_kg; PE_film_kg; whole_basket_kg; opening/generated/held/dispatch/closing; retained/customer_transferred_pack; overlap_ids; Q; trip_id/segment_p/beneficiary_b; payload_kg/distance_km/travel_h/idle_h/capacity_kg/C_pb/t_pb; provider_already_attributed; N_p/source_phase_boundaries"
      collection_method: "Weigh each actual segregated carrier consignment using calibrated gross/tare scales; identify complete coated basket components and actual packaging polymer/fibre. Verify recipient contract accepts the exact carrier and covers transport/treatment or obtain a separate nonoverlapping transport module. The actual provider must cover observed loaded, empty and stationary-idle activity; a zero-load trip is not zero transport. Already attributed consignment inventories retain their allocation; segment records are QA only, not another multiplication. Unknown empty/idle coverage blocks completeness. Independently reconcile held waste and original material states, never adjust actual dispatched net kg a second time. Without provider-attributed coverage, use transport_completion raw segment vectors and same-unit kg*h allocation; loaded tonne-km cannot stand for empty/idle activity."
      unit: "kg"
      frequency: "each dispatch; stock at period close"
      temporal_coverage: "all consignments and held stock"
      site_scope: "same pool with original source lineage"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh tickets, photographs, provider scope and source-ID deduplication"
    - protocol_id: cp_support
      process_id: "support_completion"
      flow_role: "fixed missing support completion"
      record_type: "original foreground records"
      raw_fields: "module/site/pool/version/owner; original_provider_LCI/source_id; normalized_row/flow/property/unit/D_x; raw_N_x; duplicate_source_scope; parent/submeter_scope; active/idle/fixed_pools/drivers; asset_id/model/BOM/installation/acquisition/lifetime_versions/all_past_beneficiary_e/L; retirement_net_or_BOM_mode; replacement_event; terminal_carrier; actual_electricity; cleaning_formulation/source_kg/fates; water/effluent_meter/density; wet_carrier_kg; room_species_inlet/outlet/storage/capture; operation_presence/absence_evidence; Q; natural_ventilation_inspection; no_combustion/no_refrigeration/no_purchased_heat_cold_evidence; landlord_shared_equipment_scope; cleaning_formulation_identity/concentration/supplied_kg/unused_stock/container_residue/wetcloth_retained/drained/capturedsolid; used_intermediate_reclassification; whole_effluent_mode/gross/tare/volume/density; cloth/container/drain_carrier_ids; trip_id/segment_p/beneficiary_b; vehicle/provider; payload_kg/distance_km/travel_h/idle_h/capacity_kg/C_pb/t_pb; provider_already_attributed; N_p/source_phase_boundaries"
      collection_method: "Obtain exact signed provider package or collect named individual source records for the complete fixed support register. Verify actual operating equipment/purchases/maintenance to identify fuel/refrigerant/cleaning and absence evidence. Restore original raw denominators; audit all historical asset beneficiaries and revised versions. Missing source, species, original basis, causal exposure or provider exclusion blocks completion rather than choosing a default. Route is limited to verified whole-site/landlord no-combustion/no-refrigeration/no-purchased-heat-cold natural ventilation; presence or unknown is inapplicable. Use cleaning_completion disjoint final formulation fates and direct complete-liquid measurement; use transport_completion segment raw sources and kg*h all-beneficiary reservations."
      unit: "source-specific unchanged"
      frequency: "each original source/event; period and life revision"
      temporal_coverage: "whole fixed module register; all asset history"
      site_scope: "same site/pool and exact provider boundaries"
      aggregation_rule: "Apply complete_support, asset_lifetime and support_operation; raw compatible rows only, source/version dedup, final Q once."
      quality_evidence: "provider LCI and original basis, asset/BOM ledger, operation/absence checks, corrections and scope reconciliation"
  calculation_rules:
    - id: service_count
      applies_to: "retail_service"
      rule: "Compute Q as count of distinct original_id with final_valid_acceptance=true at cutoff. Apply final_service version replacements. Output one service item for Q>0, otherwise retain unnormalized raw pool."
      inputs:
        - original_id
        - final_valid_acceptance
        - cutoff
        - source_pool_correction
        - cp_acceptance
      output: "Q; one reference service item"
      source_ids: []
    - id: background_sum
      applies_to: "basket_receipt; basket_handover; basket_supplier_return; basket_external_retention; retail_service"
      rule: "B_S=sum of whole B_j assigned S; B_F=sum of whole B_j assigned F; retain B_O/B_T separately. Service background=B_F/Q; downstream sold-goods background=B_S/Q attached once outside incremental service. B_S+B_F+B_O+B_T=sum original B_j componentwise in identical exchange units. Do not multiply whole B_j by basket kg fractions, dispatch fraction or normalized custody counts. N_F=count distinct F original IDs; basket_receipt input N_F/Q carries B_F/Q through each original supplier B_j source, so do not separately add B_F/Q again. Gross receipt events remain custody QA and do not determine this input amount."
      inputs:
        - B_j
        - receiving_gate
        - "source/version"
        - "S/F/O/T_owner"
        - component_inventory_vectors
        - Q
        - cp_custody
        - cp_acceptance
        - N_F
        - F_original_ids
        - original_supplier_inventory_vector
        - original_pack_BOM
      output: "source-conserved background vectors per reference flow"
      source_ids: []
    - id: electricity_sum
      applies_to: "retail_electricity"
      rule: "For each disjoint source pool p in kWh use E_pb=E_p*d_pb/sum_b(d_pb). Active d is powered_seconds; idle/fixed d is reserved_m2*duration_h. Reconcile sum_b(E_pb)=E_p, then E_core=sum_p(E_pb); row amount=E_core/Q. Different driver units never enter one sum. Dedicated-meter E_core bypasses shared allocation."
      inputs:
        - "active/idle/fixed_kWh"
        - powered_seconds
        - reserved_m2
        - duration_h
        - beneficiary_id
        - core_submeter_in_parent
        - Q
        - cp_energy
      output: "kWh per reference flow"
      source_ids:
        - ghg-product-allocation
    - id: dispatch_sum
      applies_to: "whole_basket_waste; carton_waste; film_waste"
      rule: "For each actual identified carrier take consignment_net_kg=gross_kg-tare_kg and sum disjoint accepted consignments. Dispatch row=sum(consignment_net_kg)/Q. Opening+generation-dispatch=closing is an independent held-waste check only; do not use it to subtract dispatch twice or replace a measured consignment."
      inputs:
        - consignment_id
        - gross_kg
        - tare_kg
        - "carrier_identity/state"
        - overlap_ids
        - provider_contract
        - Q
        - cp_waste
      output: "kg per reference flow for each carrier"
      source_ids: []
    - id: support_restore
      applies_to: "support_completion"
      rule: "Restore each source row raw_N_x=normalized_row_x*D_x for evidenced original denominator; apply same-pool disjoint allocation or f_ab=e_ab/L_a for complete lifecycle assets, replacing every old beneficiary/version at life revision. Add only compatible source-deduplicated raw exchange numerators, including the core F responsibility input, without separately adding B_F again, then divide by Q once. No raw/normalized mixing. Follow complete_support and support_operation; missing module remains partial. Follow cleaning_completion and transport_completion within the verified route fixed by support_operation."
      inputs:
        - normalized_row_x
        - D_x
        - raw_N_x
        - "source_id/version"
        - duplicate_source_scope
        - e_ab
        - L_a
        - all_past_beneficiary
        - lifetime_versions
        - replacement_event
        - terminal_carrier
        - actual_operation_sources
        - Q
        - cp_support
        - natural_ventilation_absence_evidence
        - whole_effluent_mode
        - formulation_final_fates
        - segment_p
        - beneficiary_b
        - N_p
        - C_pb
        - t_pb
        - provider_already_attributed
      output: "completed compatible inventory per reference flow, or explicit partial status"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "custody"
      requirement: "Resolve actual rattan/bamboo material conflict, species/provenance and complete supplier BOM, coating, feet, liner and original pack before a complete dataset; preserve unresolved lineage explicitly. No catalog0.96kg-to-net or dry-matter default."
      evidence: "lot-linked supplier declarations, physical identification and calibrated measurements"
    - id: q_time
      applies_to: "retail; custody; residual"
      requirement: "Cover full prospectively declared period and all failure/unsold/closed events; late-event original-pool replacement is mandatory. Record observed dates separately from posting dates."
      evidence: "immutable event IDs and versioned reconciliations"
    - id: q_uncertainty
      applies_to: "retail_electricity; whole_basket_waste; carton_waste; film_waste"
      requirement: "Retain instrument uncertainty, meter coverage, moisture states and recipient coverage. No category-specific industry ranges are established by the sources; measured data and unresolved range evidence remain explicit, with no invented numeric factors."
      evidence: "calibration records, raw interval tickets and provider contracts"
    - id: q_support
      applies_to: "support_completion"
      requirement: "Partial module gaps must accompany every result. Completion requires signed exact provider scope/raw denominator or newly authored actual atomic cards, all historical asset versions, operation records and same-source deduplication. Necessary fixed lighting/fixtures cannot disappear beside electricity. Whole-site/landlord absence evidence under support_operation is mandatory; presence or unknown makes the route inapplicable, rather than continuing with unspecified fuel/refrigerant."
      evidence: "fixed register, original provider inventory, asset history and bilingual projection audit"
validation_rules:
  - rule_id: identity_check
    applies_to: "custody; retail"
    rule: "Require original-ID/lot reconciliation, material-conflict resolution, complete actual BOM and moisture/packaging basis. A missing UUID remains explicitly unbound; confirm name/type/property/unit/state/medium from official original before binding, with no inferred equivalence. No approved methodology, full-standard conformity or quantitative industry range follows from this candidate."
    source_ids: []
  - rule_id: denominator_check
    applies_to: "retail_service"
    rule: "Recompute final-valid set independently of gross handover count. Match every return/revocation/resale/loss to original source and pool correction. Reconcile goods-only count balance, held-waste state ledger and measured waste consignments independently. Investigate discrepancies and uncertainty; do not clamp unexplained negative amounts or invent a waste destination."
    source_ids: []
  - rule_id: source_conservation
    applies_to: "custody; residual; support_completion"
    rule: "Verify sum of whole-original S/F/O/T background vectors equals original B with unique source/version responsibility and actual inbound/packaging boundaries. B_F enters service once and B_S enters sold-goods downstream once; O remains open and T has a named continuing model. Ensure physical recipient/state outputs do not substitute for background ownership. Verify complete basket waste versus separated package portions and actual provider treatment/transport coverage without credits."
    source_ids: []
  - rule_id: completeness_gate
    applies_to: "support_completion"
    rule: "Retain missing module/identity/quantity/range evidence explicitly. Full reporting requires exact provider/raw pool/version receipts, all-asset lifetime replacements, all same-unit beneficiaries, defined support operations and new atomic cards for every actual unrepresented exchange, followed by bilingual synchronization. Until then report only the partial core with its original Q and unnormalized zero-output pools. Q=0, unknown owner, missing source boundary or unknown provider coverage prohibits a normalized complete result."
    source_ids: []
published_dataset_profile:
  dataset_role: "partial incremental retail service; custody is satellite ledger"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Combine actual configuration with goods B_S/Q at same receiving gate and completed disjoint support; disclose partial boundary"
  excluded_use: "Whole-leaf coverage, basket manufacturing footprint, bamboo/rattan equivalence, furniture retail, complete business/service claim or default recycling credits"
  required_metadata: "store/channel; pool/version and dates; original basket ID and receipt lot; supplier complete BOM/material verification resolving bamboo/rattan conflict; botanical identity and moisture method; lacquer and binding/feet/liner specification; actual original packaging BOM; net basket mass distinct from package mass; final acceptance rule/cutoff; custody/state/fate ledger; S/F/O/T background ownership; missing-support register and completion status; verified whole-site/landlord no-combustion/no-refrigeration/no-purchased-heat-cold natural-ventilation evidence"
  required_quality_disclosure: "All unbound identities, material/BOM/quantity/range gaps, missing support, instrument uncertainty, zero-Q pools and historical corrections"
  update_trigger: "Material/configuration/packaging/site/route/acceptance/background ownership/lifetime/provider-boundary changes and late returns"
