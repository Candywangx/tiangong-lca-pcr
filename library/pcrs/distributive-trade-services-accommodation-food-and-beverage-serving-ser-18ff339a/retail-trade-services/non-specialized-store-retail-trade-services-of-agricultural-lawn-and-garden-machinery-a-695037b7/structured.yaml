      applies_to: "retail; custody; residual"
      rule: "Apply a_shared/a_assets/a_transport/a_digital/a_cleaning with the actual measured raw fields in cp_support_retail, cp_support_custody and cp_support_residual. Retain source_id, inclusion boundary, attribution_level, original_owner/pool/version and raw module denominator. Calculate numerator vectors only; no source is normalized to Q here. Unknown measurements or source overlap remain incomplete."
