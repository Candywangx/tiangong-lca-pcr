  data_quality_requirements:
    - id: q_lot
      applies_to: "custody"
      requirement: "One actual regional kit/lot with signed factory pack/BOM and closure records; distinguish complete-kit catalog specification from actual local stock and factory assembly/precharge. No duplicate battery/charger/blade/background."
      evidence: "Supplier records; serialized receiving images; source-stage inventory audit"
    - id: q_coverage
      applies_to: "retail; custody; residual"
      requirement: "All events, closed/idle days and zero-sale cohorts of the fixed pool remain; late events replace old versions. Measurements have SI conversion, calibration uncertainty and period completeness. Missing is unknown."
      evidence: "Meter/scale calibration certificates and check logs; exception ledger"
    - id: q_completion
      applies_to: "retail; custody; residual"
      requirement: "No complete service until all b_completion modules, exact external boundaries, original owner histories and carrier treatment are evidenced and de-duplicated. Additional real exchanges enter named bilingual cards and supported fields."
      evidence: "Source-ID scope matrix; provider originals; versioned completion and row binding register"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Before dataset completeness bind every currently unbound row to a direct-read Tiangong identity with matching package/service/waste state, direction/type, official bilingual names, property/unit and appropriate compartment; retain official original response and exact hash receipt. Electricity binding confirms only point-of-use AC product energy, not grid performance. Never substitute generic machinery for the complete kit or a merchandise flow for service. Confirm all Required qualifiers and supplier lot BOM."
    source_ids:
      - ego-lm2135sp
      - ego-mower-manual
  - rule_id: v_reconcile
    applies_to: "custody; retail; residual"
    rule: "Execute c_acceptance/c_goods/c_background/c_electricity/c_waste/c_support/c_aggregate with real complete periods, calibration evidence and original IDs. Test gross physical stock, held-waste kg, final-valid Q and S/F/T/O independently. Preserve signed discrepancies, uncertainty and unknown quantities; do not clamp them to zero or create a negative elementary emission/automatic credit. Unknown or zero full allocation drivers, missing late-return revisions, missing supplier stage separation and uncharacterized waste block completeness."
    source_ids:
      - ghg-product-2011
  - rule_id: v_extension
    applies_to: "custody; retail; residual"
    rule: "Record positive presence/absence evidence for retailer opening, assembly, battery insertion or charging, mains testing, blade replacement, damaged/partial packages, added packaging, cleaning and delivery. Any occurrence changes this core route: retain event sources and original burdens, add actual state-specific atomic cards/processes and collection/calculation fields, align both languages and regenerate before a complete result. Unknown occurrence is not absent. Customer use instructions do not authorize retailer operations. No unsupported numeric defaults, conformity claims or methodology approval arise from this PCR."
    source_ids:
      - ego-mower-manual
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching unopened regional kit counter-pickup service with b_completion/c_aggregate completion and separate physical satellites/backgrounds; disclosed partial incremental studies may use only their stated scope"
  excluded_use: "Mower manufacture or use; other battery/region kits; delivery/assembly/charging/testing; full service claims from this partial core alone; GHG-standard conformity or scientific approval"
  required_metadata: "All reference qualifiers; original source/pool/version IDs; final acceptance/cut-off; SI conversion; full module gates; separate goods satellites"
  required_quality_disclosure: "Unbound rows; lot/BOM gaps; partial core and missing modules; signed residuals; zero-Q raw pools; calibration/uncertainty; S/F/T/O; historical identity observation dates"
  update_trigger: "Any configuration/lot/route/provider change; new exchanges; calibration failure; revised lifetime, acceptance or late physical event; changed source scope"
