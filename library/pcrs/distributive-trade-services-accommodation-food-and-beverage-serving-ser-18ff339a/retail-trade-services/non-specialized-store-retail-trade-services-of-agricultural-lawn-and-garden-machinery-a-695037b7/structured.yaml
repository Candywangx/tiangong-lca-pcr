allocation_rules:
  - rule_id: a_pool
    applies_to: "custody; retail; residual"
    rule: "Prospectively fix one homogeneous regional kit configuration, store/channel, observation interval, cut-off, return policy and pool ID before observing sales. Include every same-configuration success, refusal, revoked acceptance, repeated attempt, internal transfer, loss, idle and zero-sale cohort. Q is the distinct original IDs whose latest acceptance remains valid at the cut-off; no count for an invalid acceptance, financial-only adjustment with valid acceptance leaves Q unchanged, and revocations are not subtracted a second time. Keep physical gross handovers/returns independent. A later physical return or acceptance revocation replaces the original pool numerator, denominator, fate and background version using the actual event date; never shift its old burden to a convenient later sales pool or duplicate resale. Q=0 is explicitly unnormalizable with the full raw numerator retained; never delete the cohort or invent a denominator."
    source_ids:
      - ghg-product-2011
  - rule_id: a_shared
    applies_to: "retail; custody; residual"
    rule: "First subdivide actual sources/meters. For a remaining raw shared source X_e use X_ep=X_e*d_ep/sum_b(d_eb), once, over all actual beneficiaries including empty reservations, failures and closed periods. Collect positive/known full drivers and reconcile sum_p X_ep=X_e. Handling activity uses measured reserved handling-equipment seconds; powered devices, checkout, lamps and fans use measured reserved device-time including idle; physical facility fixed pools and shelves use separately measured served area*time; This core route admits no store/landlord heating/cooling, fuel or refrigerant source without the b_scope extension; there is no unspecified thermal-driver method. These are distinct source scopes. A zero or unknown complete driver sum is unresolved, not a licence to erase the source or allocate equally. Freeze original event/beneficiary/pool/version links so later stock or sales cannot reassign old overhead. This PCR chooses these declared measured causal drivers; the GHG standard supports subdivision/physical relationships, not any invented numerical default."
    source_ids:
      - ghg-product-2011
  - rule_id: a_assets
    applies_to: "retail; custody; residual"
    rule: "For each actual building, shelf, trolley, checkout, ICT, lamp and reusable cleaning-tool asset (and HVAC only after the b_scope extension) retain exact model/BOM or verified complete-package vector A_a at manufacturing/installation gate, separately bounded inbound, operation, event repairs and end-of-life. Package-contained scopes are excluded from separate modules. Current original-pool responsibility f_apv=e_recorded_ap/L_expected_av uses MEASURED cumulative beneficiary exposure e_recorded_ap, and evidenced expected total lifetime exposure L_expected_av across every beneficiary; use building/shelf served area*time, powered or handling equipment reserved device-time, not area for a powered lamp. For each reusable cleaning tool use e_recorded_ap=sum measured cleaned surface m2 for its actual individual passes, retaining repeated passes, and L_expected_av in the SAME cumulative cleaned m2 over all lifetime users; measure pass boundaries/area rather than equating it to a floor-plan default. Enforce nonnegative fractions and sum historical fractions<=1. A lifetime revision replaces all previous beneficiary fractions and their booked vectors, rather than charging another full A_a or correcting only the current pool. At retirement set L_final=sum all measured lifetime exposures and replace every allocation using e_recorded_ap/L_final, accounting for the full residual. An unopened stock kit moved to demonstrator receives its same original W_j/I_j via T. For actual repair, asset delivery/relocation/retirement transport and end-of-life treatment events, first assign the raw event vector to the exact asset ID: a single-asset event is direct; a shared repair/treatment event uses measured processing seconds for each serviced asset divided by the positive known all-asset processing-seconds sum, while transport uses a_transport. Then apply the same full asset historical beneficiary fractions f_apv, replacing every historical allocation after lifetime revision/retirement. Do not assign the whole event only to the current sales pool. Retain source/asset/event/beneficiary/version IDs and exclude any event already contained in a complete provider package. Real repair material or a complete repaired-object service remains its actual exchange; repair-material kg cannot pose as a complete asset. Terminal whole-device direct net weighing already excludes removed parts: use direct weighing or a BOM reconstruction exclusively. Multiply its real terminal carrier kg by final lifetime owner fraction once, never again by a manufacture fraction. Asset acquisition/retirement counts validate that ledger, not a second consumed-item input."
    source_ids:
      - ghg-product-2011
  - rule_id: a_transport
    applies_to: "custody; residual; retail"
    rule: "For supplier inbound, actual returns, internal transfers and waste/asset/material routes retain trip/leg/source IDs, dates, loaded and empty distance, measured fuel or provider activity, real consignment mass/volume and capacity constraint evidence. Prefer a provider inventory for the exact actual consignment with proven fuel, infrastructure and empty-return coverage. Otherwise allocate raw trip vector first to consignments using measured tonne*km only where mass is evidenced binding, or occupied volume*km where volume binds; an unknown or different binding constraint requires reviewed matching measurement. Retain actual empty-leg vehicle_km>0 and actual stationary idle_hours from timestamps and operating state, with its measured fuel/provider source; zero tonne-km or zero travelled distance cannot erase either source. A provider may contain those exact observed empty/idle periods only with source-scope evidence; exclude overlapping separate fuel/activity. Otherwise for each empty-leg source vector X_empty allocate to linked original route reservations using r_empty_p=sum reserved_capacity_p*empty_km_p, X_empty_p=X_empty*r_empty_p/sum_b r_empty_b. For each stationary-idle source vector X_idle use r_idle_p=sum reserved_capacity_p*idle_hours_p and X_idle_p=X_idle*r_idle_p/sum_b r_idle_b. Reserved capacity is measured reserved kg where mass binds or reserved m3 where volume binds, with one same unit for every beneficiary and explicit actual eligibility evidence. Keep all actual beneficiary and empty/failed reservations, positive known driver sums, measured empty distance and stationary idle duration, source/consignment/owner versions and fuel; unknown sums/capacity coverage block completeness. These source vectors are disjoint from loaded movement and one another. Then assign the consignment source to its original goods/asset/material responsibility and beneficiary-pool/version under b_background/a_assets/a_shared. Provider consignment attribution only skips repeated vehicle allocation; it does not skip original source/owner attribution. Exact final-owner/pool quantities may bypass that owner step only with evidence. Keep attribution_level, original_owner and source portions summing to actual carrier. Known shares are not renormalized to conceal an unknown portion."
    source_ids:
      - ghg-product-2011
  - rule_id: a_digital
    applies_to: "retail"
    rule: "Collect actual disjoint provider scopes for payment authorization, administration, communications and security backend; an internet-access packet alone does not cover the others. For each shared basket authorization/admin event e, X_event_ep=X_event_e*processing_seconds_ep/sum_b processing_seconds_eb, with measured per-line processing seconds for every beneficiary including failed attempts and empty reservations, one source ID and a positive known full sum; shares sum1, never a full multi-SKU event per pool. For each unique original network interval i, H_ip=source_hours_i*endpoint_seconds_ip/sum_b endpoint_seconds_ib, using all-beneficiary measured reserved endpoint-connection seconds including empty/failed reservations and a positive known full sum. Link H_ip to the exact provider source vector/denominator, not a fictitious SKU-exclusive connection. Do not count those same provider source-hours again as overlapping fixed/active/idle source-hours. For each camera capture c, a_cp=sum disjoint zones/times area_cpzt*duration_czt in m2*s over all beneficiaries and empty reservations; alpha_cp=a_cp/sum_b a_cb with positive known full sum, and X_capture_cp=X_capture_c*alpha_cp. Freeze that original capture/clip beneficiary map. Storage activity B_cp=sum disjoint retained clip intervals bytes_ci*retention_seconds_ci*alpha_cp in byte*s, using actual bytes in each interval and the same frozen capture map, not later sales. 1 GB=10^9 bytes, 1 GiB=2^30 bytes; unknown footage shares or source coverage block completeness. Retain source_hours, endpoint_seconds, capture_map, original_owner/pool/version and complete provider denominator. Restore normalized packets to raw vectors by c_aggregate and do owner attribution once."
    source_ids:
      - ghg-product-2011
  - rule_id: a_cleaning
    applies_to: "retail; custody; residual"
    rule: "For actual retailer cleaning record each exact original formulation source and its complete original container/BOM at receipt, active ingredients and concentration only where supplier evidence supports them. Use the persistent original-source equation m0_j=sum historical final source_origin_export_jk+sealed_unused_kg_j+opened_residue_kg_j+retained_other_kg_j, where all current states and historical final external exports are mutually exclusive and cover the original formulation only. retained_other includes measured original-source film on cleaned surfaces until actually exported; unknown film is not zero. Every state transition replaces the old state with historical owner/pool versions preserved. Newly added water/dirt or an outside cloth/container is not original formulation kg. Use/withdrawal is an internal event, never a second final export. Spilled/rinsed denotes final source-origin exports only: a spill still on-site is current retained stock and, when collected in rinsate, replaces its old state rather than counting both. Direct measured whole rinsate/waste kg is a different carrier, not multiplied again by source composition. For original source j with measured original formulation m0_j, record first-use withdrawal u_jp and disjoint pre-use loss/condemnation l_jp, with final owner fraction h_jp=(u_jp+l_jp)/m0_j. Apply the full actual original formulation/container manufacturing and separate inbound vector once by h_jp to the original beneficiary-pool/version; neither rinse water nor new dirt enters h_jp. Preserve every partial original-source portion, carrier/event ID, first-use or pre-use-F owner, original pool and replacement version across periods, including later carrier treatment; never reattribute an old source portion on a later cleaning event. Preserve all earlier allocations and unwithdrawn stock; replace historical allocations on correction and reconcile cumulative fractions<=1 with final residual responsibility. A terminal original container is actual measured carrier kg multiplied by the final source-owner fraction once, not a second manufacture input. Import-water meters already exclude internal reuse; do not subtract reuse again. Direct effluent is actual metered V_discharge*rho at measured conditions; keep supply/evaporation/storage balance independent, with no speculative reconstruction. Collect every actual formulation, water, carrier, cloth, original and added container and final treatment as separate named exchanges or one verified real service package with exact scopes; unmeasured or unknown presence blocks completeness. Do not double charge solution water or waste constituents beside a full carrier."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "custody"
      flow_role: "supplier_receipt; returned_kit; handover_kit; supplier_return_kit; internal_asset_kit"
      record_type: "Serialized custody and original background ledger"
      raw_fields: "original_id; physical_event_id; acceptance_event_id; event_date; recipient; package_state; regional_model; factory_BOM; closure_evidence; factory_assembly; factory_precharge; site_hvac_presence; landlord_hvac_presence; fuel_presence; refrigerant_presence; facility_scope_evidence; N_open; N_R; N_C; N_close; N_H; N_T; N_I; N_K; N_missing; signed_r_goods; W_j; I_j; stage_separation; s_j; f_j; t_j; o_j; original_owner; pool_id; version"
      collection_method: "Scan every original carton/serial ID at receipt, counter movement, return and transfer; use signed supplier complete-kit pack/closure evidence without opening. Inventory physical goods at both cut-offs, independently retrieve acceptance history and supplier-dispatch W_j plus separate inbound I_j. Link condemnation count to cp_residual measured kg by actual ID. Calibrate scanners/count controls by independent double count and audit invoices; investigate missing IDs and signed residuals."
      unit: "Item(s); original inventory vector by each native unit"
      frequency: "Every movement plus both cut-off counts and each late-event revision"
      temporal_coverage: "Full fixed-pool interval and earlier original-source history; late-event revisions retained"
      site_scope: "Actual non-specialized store receiving, counter, named transfer recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed lot/BOM, closure photographs, invoices, recipient signatures and reconciled scans"
    - protocol_id: cp_retail
      process_id: "retail"
      flow_role: "failed_original_kit; retail_ac; service_output"
      record_type: "Acceptance events and circuit meter records"
      raw_fields: "original_id; acceptance_event_id; event_date; latest_valid_acceptance; cut_off; pool_id; version; N_F; W_F; I_F; W_j; I_j; f_j; original_id_background; stage_separation; meter_id; circuit_scope; meter_start; meter_end; multiplier; E_raw; d_ep; d_eb; parent_contains_child; original_owner; operator_action; route_absence_evidence; site_hvac_presence; landlord_hvac_presence; fuel_presence; refrigerant_presence; facility_scope_evidence"
      collection_method: "Read calibrated circuit meters at both interval ends and each circuit change; maintain actual circuit parent/child diagram, multipliers and at least monthly bill reconciliation. Record every acceptance, refusal and revocation linked to physical IDs without treating refunds as returns. Observe opening/assembly/charging/test absence at every handling event and reconcile CCTV/work orders; inspect facility/lease/equipment records for onsite/landlord HVAC, fuel and refrigerant absence over the complete period; unknown route status stays unresolved. Independent meter check at period start/end and after repair with traceable standard; log accuracy/uncertainty, failed readings and retained idle time."
      unit: "kWh raw; MJ after 3.6; accepted services Item(s)"
      frequency: "Each acceptance event; interval meter endpoints; monthly invoice check"
      temporal_coverage: "Full fixed-pool interval including zero sales and idle; all later acceptance revisions"
      site_scope: "Named counter and actual declared circuits"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter certificates, traceable check readings, event log and route evidence"
    - protocol_id: cp_residual
      process_id: "residual"
      flow_role: "whole_kit_waste"
      record_type: "Whole-kit waste consignment and held-stock ledger"
      raw_fields: "consignment_id; original_id; condemnation_package_id; measured_condemnation_kg; N_K; gross_kg; tare_external_overpack_kg; package_state; W_open; W_generated; W_waste_in; W_close; W_waste_transfer; signed_r_waste; known_missing_waste_kg; recipient; treatment_scope; source_id; original_owner; pool_id; version"
      collection_method: "Weigh each complete original kit or intact consignment on a calibrated scale; weigh external overpack tare separately, retain original kit packaging. Daily zero/check-mass checks, period-start/end and post-repair traceable calibration with resolution/uncertainty. Match IDs to condemnation counts, both held-waste stock takes and signed treatment manifests. Direct dispatch net is final carrier quantity; inspect original closure without opening; unknown/damaged state needs extension."
      unit: "kg for whole carrier; separate Item(s) linkage"
      frequency: "Each condemnation, movement and consignment; both cut-offs"
      temporal_coverage: "Entire fixed pool and held-waste history including late revisions"
      site_scope: "Named waste store and recipient; actual treatment chain"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale checks, closure images, treatment acceptance and scope evidence"
    - protocol_id: cp_support_retail
      process_id: "retail"
      flow_role: "failed_original_kit; retail_ac; service_output"
      record_type: "External completion source and allocation record"
      raw_fields: "source_id; source_scope; raw_X_mk; z_mk; D_m_original; provider_scope; direction; flow_type; property; unit; attribution_level; source_share; owner_fraction; original_owner; pool_id; version; X_e; d_ep; d_eb; A_a; e_recorded_ap; L_expected_av; L_final; lifetime_version; asset_id; asset_event_id; asset_processing_seconds_p; asset_processing_seconds_all; cleaned_surface_m2; pass_id; trip_id; leg_id; consignment_id; loaded_km; empty_km; idle_hours; vehicle_km; fuel; reserved_capacity_p; reserved_capacity_unit; capacity_eligibility; r_empty_p; r_empty_b; r_idle_p; r_idle_b; X_empty; X_idle; mass_kg; volume_m3; capacity_constraint; source_hours; source_hours_i; endpoint_seconds; endpoint_seconds_ip; endpoint_seconds_ib; H_ip; X_event_e; processing_seconds_ep; processing_seconds_eb; within_event_share; capture_map; capture_id; clip_id; area_cpzt; duration_czt; a_cp; a_cb; alpha_cp; X_capture_c; bytes; bytes_ci; retention_seconds; retention_seconds_ci; B_cp; formulation_source_kg; m0_j; u_jp; l_jp; h_jp; original_formulation_container_vector; separate_inbound_vector; source_origin_exports; source_origin_export_jk; original_source_portion_kg; carrier_id; first_use_event_id; preuse_loss_event_id; sealed_unused_kg; opened_residue_kg; retained_other_kg; V_discharge; rho; parent_contains_child; Q"
      collection_method: "For the actual retail process collect b_completion provider originals and source-scope matrix before use; read calibrated activity meters, trip logs, measured exposure/area/device-time, event shares, original camera map, endpoint seconds and cleaning stock/effluent measurements. Preserve raw source fields and native units, actual times and all beneficiaries. Check meter/scale zero and known standards daily where used and obtain traceable period-start/end/post-repair calibration; retain certificate uncertainty. Verify signed model/BOM/contract scopes and lifetime evidence, freezing original owner histories; test duplicate source IDs and provider-contained scopes. Each process protocol is a view of the SAME source ledger, not another measurement or allocation. Unknown presence/quantity requires a named extension and blocks complete service."
      unit: "Native exchange units and driver SI units; provider denominators explicit"
      frequency: "Each source event and interval; reconcile at least monthly and each lifetime/late-event revision"
      temporal_coverage: "Full pool plus all prior asset/source beneficiaries and terminal residual"
      site_scope: "Actual retail sources; complete provider gate and shared beneficiaries"
      aggregation_rule: "c_support then c_aggregate; restore external denominator only once; exact source-ID deduplication; never aggregate dissimilar units"
      quality_evidence: "Original provider vectors, raw activities, calibration, historical fractions, source/owner reconciliation"
