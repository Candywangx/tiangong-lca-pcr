  calculation_rules:
    - id: c_acceptance
      applies_to: "service_output"
      rule: "Q=count_distinct(original_id with latest_valid_acceptance=true at cut_off); service_output=Q/Q=1 Item(s) only if Q>0. Financial-only events preserve acceptance. Actual revocation changes the latest state once, irrespective of physical return."
      inputs:
        - original_id
        - acceptance_event_id
        - event_date
        - latest_valid_acceptance
        - cut_off
        - pool_id
        - version
      output: "Q; service_output"
      source_ids:
        - ghg-product-2011
    - id: c_goods
      applies_to: "supplier_receipt; returned_kit; handover_kit; supplier_return_kit; internal_asset_kit"
      rule: "Goods-only count balance: N_open+N_R+N_C=N_close+N_H+N_T+N_I+N_K+N_missing+signed_r_goods. N_K is internal condemnation, N_missing is a confirmed loss, and signed_r_goods remains investigated with uncertainty. Waste dispatch is absent from this goods-only equation. Cards use their independent gross event totals divided by Q once, never final-valid Q in place of physical N_H."
      inputs:
        - N_open
        - N_R
        - N_C
        - N_close
        - N_H
        - N_T
        - N_I
        - N_K
        - N_missing
        - signed_r_goods
        - original_id
        - physical_event_id
        - recipient
        - package_state
        - Q
        - cp_custody
      output: "gross custody cards; goods stock reconciliation"
      source_ids:
        - ego-lm2135sp
    - id: c_background
      applies_to: "supplier_receipt; returned_kit; handover_kit; supplier_return_kit; internal_asset_kit; failed_original_kit"
      rule: "For each j require s_j+f_j+t_j+o_j=1 with one current 0/1 ownership state. Original responsibility vectors B_S=sum_j s_j*(W_j+I_j), B_F=sum_j f_j*(W_j+I_j), B_T=sum_j t_j*(W_j+I_j), B_O=sum_j o_j*(W_j+I_j); their sum equals the unique original-source vector. N_F=sum_j f_j, W_F=sum_j f_j*W_j and I_F=sum_j f_j*I_j; failed_original_kit=N_F/Q with source-specific weighted manufacturing vector W_F/N_F when N_F>0. This is the same W_F counted once, not extra burden beside raw B_F; I_F is a separate inbound source and B_F=W_F+I_F. Downstream merchandise uses evidenced B_S/Q, never an assumed one-new-kit-per-service. Keep T recipient continuity and O inventory, and replace all historical versions upon return/resale."
      inputs:
        - original_id
        - W_j
        - I_j
        - N_F
        - W_F
        - I_F
        - s_j
        - f_j
        - t_j
        - o_j
        - original_owner
        - pool_id
        - version
        - stage_separation
        - cp_custody
        - cp_retail
      output: "B_S; B_F; B_T; B_O; N_F; W_F; I_F"
      source_ids:
        - ghg-product-2011
        - ego-lm2135sp
    - id: c_electricity
      applies_to: "retail_ac"
      rule: "E_raw=(meter_end-meter_start)*multiplier in kWh for the actual disjoint circuit; E_p=sum_e E_raw_e*d_ep/sum_b d_eb using a_shared only where not already attributed to this exact original pool. retail_ac=3.6*E_p/Q MJ. The 3.6 conversion applies once. Preserve parent_contains_child and source scopes; do not subtract an independent submeter."
      inputs:
        - meter_start
        - meter_end
        - multiplier
        - E_raw
        - d_ep
        - d_eb
        - parent_contains_child
        - original_owner
        - pool_id
        - version
        - Q
        - cp_retail
      output: "retail_ac MJ per reference flow"
      source_ids:
        - ghg-product-2011
    - id: c_waste
      applies_to: "whole_kit_waste"
      rule: "W_dispatch=sum actual outgoing gross_kg-tare_external_overpack_kg for the complete original kit consignment; whole_kit_waste=W_dispatch/Q kg. Do not deduct retained stock from directly measured dispatch. Independently reconcile W_open+W_generated+W_waste_in=W_close+W_dispatch+W_waste_transfer+known_missing_waste_kg+signed_r_waste, with measured N_K-linked kg. Actual dispatch treatment covers the full contained kit; no second cell or packaging treatment."
      inputs:
