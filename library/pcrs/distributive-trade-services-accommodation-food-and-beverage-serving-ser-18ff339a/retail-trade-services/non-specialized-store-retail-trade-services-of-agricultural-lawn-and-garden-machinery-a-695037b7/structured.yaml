    - id: c_aggregate
      applies_to: "retail; custody; residual"
      rule: "For each exact module m with normalized inventory z_mk restore raw original vector X_mk=z_mk*D_m_original, using its evidenced original denominator, pool and version; if actual raw X_mk is retained, use it directly and do NOT multiply D again. Apply the required source-to-consignment-to-final-owner fractions once unless exact final-owner/pool attribution is evidenced. For each identical exchange k, property, unit, direction and type, add compatible raw core E/treatment numerator, raw B_F represented by the same failed_original_kit manufacture expansion W_F plus separate I_F, and disjoint raw support X_mk after exact source-ID deduplication, then x_final_k=N_final_k/Q once. Exclude gross custody satellite counts and S/T/O merchandise backgrounds from this service burden sum. Keep goods satellites as separate linked physical ledger, not duplicate demands. Never add kg to MJ, normalized values to raw values or incompatible provider boundaries. A full dataset requires no unknown missing modules; otherwise publish only disclosed partial incremental results with raw unnormalizable Q=0 pools."
      inputs:
        - z_mk
        - D_m_original
        - X_mk
        - source_id
        - provider_scope
        - direction
