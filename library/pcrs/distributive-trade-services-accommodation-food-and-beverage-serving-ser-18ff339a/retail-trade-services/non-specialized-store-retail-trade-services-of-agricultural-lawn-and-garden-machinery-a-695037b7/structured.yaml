system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_scope
      applies_to: "custody; retail; residual"
      rule: "This narrower scope covers only a documented non-specialized physical store and counter pickup of the single declared regional battery-powered lawnmower kit configuration, new and unopened by the retailer. Bare-tool kits without supplied battery/charger, used machines, separately sold cells, delivery, assembly, charging, test mowing, fuelling and repair are outside this route. The official product page identifies a mower kit with a 7.5Ah battery, Rapid charger and blade system; the linked LM2130SP tool manual lists bag, frame, preinstalled mulching insert, chute and blades. They establish product scope, not current stock, a lot BOM or a retailer operation. Coming Soon is not stock evidence. Require signed lot packing/BOM, original closure, exact regional machine/cell/charger/accessory identities, original factory assembly and precharge states; absent information is unknown. The retailer does not open a package to prove the sealed route. This narrowly selected core additionally requires documented absence of onsite and landlord-supplied space heating/cooling, combustion fuel and refrigerant equipment serving the declared store area. Inspect the complete facility/lease/equipment records, including backrooms, rather than inferring absence from no mower preparation. Any present or unknown HVAC, fuel, purchased heat or refrigerant requires a route-specific extension with exact carrier/species/medium cards and measured activity/leak/stock data before completeness; no zero combustion or refrigerant emission is inferred."
      source_ids:
        - un-cpc62186
        - un-cpc44121
        - ego-lm2135sp
        - ego-mower-manual
    - rule_id: b_gates
      applies_to: "custody; retail; residual"
      rule: "The incremental service starts when this original complete package is physically received by the retailer and ends at final-valid counter acceptance, with residual and late-return histories retained to the declared cut-off. Supplier manufacture and original packing end at supplier dispatch; inbound transport to receipt is a separate mandatory source. Consumer mowing, post-acceptance charging and consumer end-of-life remain downstream. Physical custody satellite flows supplier_receipt, returned_kit, handover_kit, supplier_return_kit and internal_asset_kit are a separate goods ledger: never connect their gross incoming counts as additional manufacturing demands in the incremental service. b_background assigns original embodied sources once. The failed_original_kit input represents the original F manufacture at supplier dispatch; operational retail electricity and actual waste dispatch also enter the incremental service, while all omitted support sources must be completed under b_completion before a full-service claim."
      source_ids:
        - ghg-product-2011
    - rule_id: b_background
      applies_to: "custody; retail; residual"
      rule: "For every original package ID j retain W_j, the full manufacturing/original-packing inventory vector strictly at supplier dispatch, including actual contained battery, charger, installed and spare blades, accessories and actual full packaging BOM. Add separately verified inbound vector I_j to the retailer receiving gate. If a provider bundles inbound, require evidenced stage separation and count that segment once; unknown separation blocks completeness. Never substitute bare-tool mass or Ah-scaled battery impacts, and never add a second component source already included in W_j. At each cut-off give that same original source exactly one current responsibility S (final-valid sale; merchandise vector remains downstream), F (failed/lost/condemned or retained externally without valid acceptance; charged to its original retail pool), T (supplier or named internal asset custodian with continuing background), or O (still open stock/history). S/F/T/O are exclusive background ownership states, not physical counts. Return/resale replaces the old state and never manufactures another kit; transfer to demonstration moves the SAME W_j and I_j to T, not full F plus new manufacture. F background stays even if no physical waste is dispatched; a waste carrier receives no duplicate W_j. failed_original_kit is this same original dispatch-manufacturing demand, expanded by W_F/N_F only once, with actual F inbound I_F added separately; never add the expanded W_F again beside that input."
      source_ids:
        - ego-lm2135sp
        - ego-mower-manual
        - ghg-product-2011
    - rule_id: b_completion
      applies_to: "custody; retail; residual"
      rule: "This core is an explicitly partial incremental inventory. Before claiming a complete retail service, attach disjoint measured modules for receiving/handling and storage; building structure, shelves, handling trolley and checkout/ICT/lighting/HVAC assets; their actual operation and maintenance; cleaning/water/effluent and packaging actually added by the retailer; payment, communications, administration and security backend; supplier inbound, actual supplier-return/internal/waste transport and complete waste treatment. Apply a_shared, a_assets, a_transport, a_digital, a_cleaning and c_aggregate. A complete provider package may remain intact only with its real model/contract, reference denominator, original source scope and exact included manufacture, installation, fuel/electricity, repair, transport and end-of-life exclusions. Otherwise collect named atomic cards, applicable protocols, quantities and bilingual sync for actual missing exchanges before completeness. Named modules without those data are not a complete dataset; missing quantities/providers are unknown, never zero. Parent/submeter deductions occur only when the parent really contains the child. Do not double count a utility, transport leg, contained component or provider-contained terminal carrier."
      source_ids:
        - ghg-product-2011
    - rule_id: b_residual
      applies_to: "whole_kit_waste; supplier_return_kit; handover_kit"
      rule: "Condemnation is an internal goods-to-held-waste state change: remove N_K from goods once, not again at waste dispatch. Direct W_dispatch is the actual consignment net kg after real external overpack tare, without subtracting retained/reused stock again. Complete-package weighing includes its original packaging and contained cell; separate cell or blade outputs cannot also be added. W_open + W_generated + W_waste_in = W_close + W_dispatch + W_waste_transfer + known_missing_waste_kg + signed_r_waste is an independent kg reconciliation linked to the count ledger by actual package IDs and measured condemnation kg, not a count-to-kg assumption. Preserve known missing held-waste kg separately from unresolved signed residuals. Require recipient treatment coverage for cell, machine, charger, accessories and original pack, all transport and actual emissions/residues, with provider overlaps excluded. Unknown or opened/damaged/dismantled state requires a specific extension and blocks completeness. External unaccepted retention has its actual recipient/state and F background; it is not automatically retailer waste."
      source_ids:
