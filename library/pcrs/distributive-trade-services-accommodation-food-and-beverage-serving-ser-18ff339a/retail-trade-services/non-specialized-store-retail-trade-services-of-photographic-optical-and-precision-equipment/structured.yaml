allocation_rules:
  - rule_id: allocation_pool
    applies_to: "all processes"
    rule: "Declare pool P prospectively by store, same SKU/kit version, sealed route, calendar interval and acceptance horizon. Retain closed, idle, refused, reversed, failed and zero-sale periods in the same configuration pool. No successful-period selection. Q is the count of DISTINCT original kit IDs with final-valid acceptance in P at the stated cut-off; revoke acceptance even without a physical return, but retain acceptance for purely financial refunds/discounts. Do not subtract revocations again from that distinct final-valid set. One original resold kit yields at most one final service. Late events replace original-pool Q, numerator and S/F/O/T history with actual dates, not a new charge in the resale pool. Q=0 leaves the entire raw pool unnormalizable and reportable."
    source_ids: []
  - rule_id: allocation_direct
    applies_to: "pos_electricity; all completion modules"
    rule: "Subdivide and directly meter before allocation. For shared sources, separate measured active, idle and fixed-component numerator pools first and reconcile their same-unit sum to the parent. Allocate each pool using its own causal same-unit driver over ALL actual beneficiaries: active checkout seconds, reserved idle seconds, occupied floor-area×hours for premises, or device-reservation hours for IT. Record causality and positive/known total driver; never add unlike drivers or discard zero-driver periods. Allocate a fixed/idle pool by observed reservation duration including closed periods; if no beneficiary/reservation evidence exists, completeness is blocked. Sum only compatible attributed exchange amounts, then divide by Q once. No turnover/revenue allocation or avoided-production credit."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "counter_retail"
      flow_role: "retail_service; failed_kit; gross_handover; continuing_transfer"
      record_type: "event ledger"
      raw_fields: "pool_ID; store; SKU; kit_version; supplier_BOM; passive_no_cell_confirmation; original_ID; serial_or_seal_ID; original_receipt_date; event_ID; event_type; event_date; physical_recipient; state; acceptance_cutoff; final_valid_original_ID; acceptance_revocation_date; financial_only_flag; C_open; R_supplier; R_customer; H_gross; X_continue; D_condemn; L_missing; C_close; held_waste_open; held_waste_close; W_dispatch_count; responsibility_S_F_O_T; source_vector_ID; original_inbound_ID; original_owner_version; N_F; Q"
      collection_method: "At store receiving door and counter, scan each actual supplier kit/seal ID and separately every customer return and physical outward event; signed acceptance and revocation records with original-ID links. Exterior check only; supplier BOM/specification confirms actual intact kit, no cell/electronics and no split contents. Every event including refusal/no-return revocation/failure/loss remains. Inventory counts independently checked by two-person stocktake. Calibration is not applicable to ID scans; test scanner/readability against retained labels. Retain packing lists, signed supplier/recipient ownership, source vectors, actual inbound scope and loss investigation."
      unit: "Item(s)"
      frequency: "every event and opening/closing stocktake"
      temporal_coverage: "entire declared P plus all later corrections linked to P"
      site_scope: "single declared SKU/store; all original IDs and final recipients"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier BOM; scan audit; signed acceptance/ownership; source-ID conservation"
    - protocol_id: cp_energy
      process_id: "counter_retail"
      flow_role: "pos_electricity"
      record_type: "meter record"
      raw_fields: "meter_ID; meter_boundary; meter_open; meter_close; meter_multiplier; source_pool_ID; source_pool_kWh; beneficiary_ID; active_seconds; reserved_seconds; all_beneficiary_driver_seconds; interval_dates; calibration_certificate; Q"
      collection_method: "Dedicated plug/submeter at POS power supply, read at interval start/end including standby, refused transactions and closed periods. Record actual kWh and meter multiplier, mains interruptions, UTC timestamps, calibrated meter trace and circuit diagram. For shared POS, collect all beneficiaries active/reserved seconds and reconcile allocated kWh to measured full pool; measure rather than use nominal power. No optical battery/test energy exists only after boundary_route evidence."
      unit: "kWh"
      frequency: "interval readings with event/time logs"
      temporal_coverage: "all P including idle/closed/failed periods"
      site_scope: "actual POS circuit and every shared beneficiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration certificate; circuit inclusion proof; parent reconciliation"
    - protocol_id: cp_waste
      process_id: "residual"
      flow_role: "kit_waste"
      record_type: "consignment weighing"
      raw_fields: "consignment_ID; original_ID; dispatch_date; gross_kg; external_container_tare_kg; W_kit; W_dispatch_count; held_waste_open; held_waste_close; D_condemn; destination; carrier_state; provider_scope; scale_ID; calibration_certificate; Q"
      collection_method: "At actual outgoing waste consignment, weigh whole unopened same-model kit(s), original accessories and packaging on calibrated scale and tare only external reusable collection container. Link each original ID and waste stock; recipient confirms no contents separation and actual treatment acceptance. Lost or externally held goods are not this stream. Open/dismantled kits require new state-specific cards before a complete result. Retain gross/tare slips, scale check weights, date and treatment/transport contract; generation and held stock are independently reconciled."
      unit: "kg"
      frequency: "each actual consignment"
      temporal_coverage: "P dispatch dates plus original source/history"
      site_scope: "store waste dispatch and actual receiving treatment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable scales; gross/tare; carrier-state and destination receipts"
    - protocol_id: cp_completion
      process_id: "support_completion"
      flow_role: "mandatory partial-boundary completion"
      record_type: "module ledger"
      raw_fields: "parent_meter_kWh; wiring_boundary; included_submeters_kWh; disjoint_meter_kWh; source_pool_ID; E_k; d_bk; all_beneficiaries; reserved_idle_seconds; occupied_m2_hours; device_reserved_hours; asset_ID; model; complete_BOM; provider_scope; source_vector_ID; B_j; installation_ID; e_jbt; L_j_v; lifetime_version; all_prior_allocations; retirement_date; terminal_net_kg; final_beneficiaries; maintenance_event_ID; formulation_source_ID; formulation_kg; concentration; source_origin_kg_by_final_destination; original_container_closing_residual_source_kg; dispatched_container_residual_source_kg; container_plus_residual_net_kg; imported_water_kg; imported_water_m3; actual_density_kg_m3; water_temperature; internal_reuse_record; retained_stock_open_close; liquid_gross_kg; liquid_external_tare_kg; wet_wipe_net_kg; cleaner_container_net_kg; consignment_ID; cleaned_m2; scale_calibration; trip_ID; segment_ID; provider_attribution_scope; actual_loaded_km; actual_empty_km; actual_active_h; actual_empty_h; actual_idle_h; full_vehicle_payload_capacity_kg; reserved_payload_kg_bi; actual_reserved_h_bi; d_bi; A_i; A_bi; all_beneficiaries; unused_operational_responsibility_ID; fuel_or_electricity_amount; source_pool_split; q_mr; D_m; original_pool_ID; original_version; raw_A_mr; source_exchange_ID; source_overlap_register; A_core_r; Q; absence_register; site_landlord_equipment_register"
      collection_method: "At site/landlord utilities, asset locations, cleaning stores/drain dispatch and actual route/provider boundary, collect original meter/scale/time/route/provider source records and all driver units. Survey presence/absence before P and verify changes each interval. Collect entire operational P and all asset historical beneficiaries; retain official/supplier source documents and independent meter/stock checks. Calibrate each relevant meter/scale, time synchronization and capacity measure with dated certificates/checks. Fixed module calculations are in completion_energy; completion_assets; completion_cleaning; completion_transport; completion_sum; raw fields retain original source IDs and replacement versions. Add actual bilingual atomic cards before aggregation; unknown presence/identity/quantity/source coverage blocks completeness."
      unit: "original unit per separate source pool"
      frequency: "each source interval/event and each lifetime revision"
      temporal_coverage: "all P and complete asset/source allocation history"
      site_scope: "all beneficiaries, site, landlord and provider included boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original boundaries/BOM; signed absence; all-beneficiary reconciliation; prior-version correction"
  calculation_rules:
    - id: service_q
      applies_to: "retail_service"
      rule: "Q = count(distinct final_valid_original_ID); service amount = Q/Q = 1 Item(s) per reference flow; if Q=0 no normalized result."
      inputs:
        - final_valid_original_ID
        - acceptance_cutoff
        - pool_ID
        - cp_custody
      output: "Q; retail_service"
      source_ids: []
    - id: energy_mj
      applies_to: "pos_electricity"
      rule: "E_POS = sum(attributed measured kWh for P); amount = 3.6 * E_POS / Q MJ per reference flow. Attribution follows allocation_direct; no device rated power or optical magnification substitutes for electricity."
      inputs:
        - meter_open
        - meter_close
        - meter_multiplier
        - source_pool_kWh
        - active_seconds
        - reserved_seconds
        - all_beneficiary_driver_seconds
        - Q
        - cp_energy
      output: "pos_electricity MJ per reference flow"
      source_ids: []
    - id: failure_supply
      applies_to: "failed_kit"
      rule: "N_F = count(distinct original IDs with F responsibility); amount = N_F/Q Item(s) per reference flow. Expand each original F supply vector once at first receiving gate; actual loss does not require physical waste. S/F/O/T partitions all original supplies including opening stock."
      inputs:
        - original_ID
        - source_vector_ID
        - original_inbound_ID
        - responsibility_S_F_O_T
        - original_owner_version
        - N_F
        - Q
        - cp_custody
      output: "failed_kit Item(s) per reference flow"
      source_ids: []
    - id: physical_outputs
      applies_to: "gross_handover; continuing_transfer"
      rule: "H_gross/Q and X_continue/Q Item(s) per reference flow are separate actual outward event totals; cp_custody maintains both goods and held-waste balances. Responsibility-only T is absent from X_continue."
      inputs:
        - event_ID
        - event_type
        - original_ID
        - H_gross
        - X_continue
        - C_open
        - R_supplier
        - R_customer
        - D_condemn
        - L_missing
        - C_close
        - held_waste_open
        - held_waste_close
        - W_dispatch_count
        - Q
        - cp_custody
      output: "gross_handover; continuing_transfer"
      source_ids: []
    - id: waste_dispatch
      applies_to: "kit_waste"
      rule: "W_kit = sum(actual consignment gross kg - actual external reusable container tare kg); amount = W_kit/Q kg per reference flow. Net weighing retains the entire unopened device/accessories/original packaging carrier. Do not subtract parts already absent; do not substitute 575 g device specification or apply a composition fraction. Waste generation/stock is a separate check, not a correction of dispatched kg."
      inputs:
        - consignment_ID
        - original_ID
        - gross_kg
        - external_container_tare_kg
        - dispatch_date
        - destination
        - W_kit
        - Q
        - cp_waste
      output: "kit_waste kg per reference flow"
      source_ids:
        - nikon-p3-spec
    - id: completion_energy
      applies_to: "all completion modules"
      rule: "For every electricity numerator pool k and beneficiary b, E_bk = E_k*d_bk/sum_b(d_bk); use only one same-unit causal driver per k per allocation_direct. Meter coverage fixes whether E_k is a disjoint reading or parent less proven included POS submeter. Preserve idle/closed periods and full parent reconciliation. E_bk is kWh; raw utility MJ = 3.6*sum_k(E_bk), with no division by Q before completion_sum. Electricity source mix, voltage, geography and upstream delivery losses require actual provider evidence; point-of-use flow identity supplies none."
      inputs:
        - parent_meter_kWh
        - wiring_boundary
        - included_submeters_kWh
        - disjoint_meter_kWh
        - source_pool_ID
        - E_k
        - d_bk
        - all_beneficiaries
        - reserved_idle_seconds
        - occupied_m2_hours
        - device_reserved_hours
        - cp_completion
      output: "attributed raw utility MJ by source pool before division by Q"
      source_ids:
        - ghg-product-2011
    - id: completion_assets
      applies_to: "all completion modules"
      rule: "Maintain one persistent ledger per real complete asset j and all historical beneficiaries b,t. For each version v, a_jbt(v)=e_jbt/L_j(v), with sum_b,t(e_jbt)<=L_j(v); use device h, building occupied m2*h, shelf occupied m3*h, and reusable-cloth cleaned m2 as separate same-unit ledgers. L is positive evidenced expected total lifetime exposure, never a new lifetime each pool; unknown L blocks completion, and exposure exceeding L requires a replacement lifetime version before allocation. Source vector B_j times a_jbt is manufacturing/installation responsibility; every revision REPLACES all old historical allocations and posts differences. At retirement set L to actual total exposure, replace all versions, and assign any rounding/residual to documented final beneficiaries so total=1. Terminal whole-asset carrier kg is actual net kg times that SAME a_jbt once, not times another manufacturing fraction. Whole-net weighing and verified component reconstruction are exclusive; removed components cannot be subtracted twice. Operation and actual event maintenance/replacement are separate vectors unless a signed complete lifecycle package explicitly contains them; then remove duplicates. Included capital must name building shell, lighting/fan fixtures, shelf, security, POS and network hardware, foundations/installations and terminal scope. A stock kit made demonstrator transfers its SAME original source to T and this ledger rather than charging F and new acquisition. Such a changed route requires revised cards first."
      inputs:
        - asset_ID
        - model
        - complete_BOM
        - provider_scope
        - source_vector_ID
        - B_j
        - installation_ID
        - e_jbt
        - L_j_v
        - lifetime_version
        - all_prior_allocations
        - retirement_date
        - terminal_net_kg
        - final_beneficiaries
        - maintenance_event_ID
        - cp_completion
      output: "raw asset manufacturing/installation/terminal and actual maintenance responsibility before division by Q"
      source_ids:
        - ghg-product-2011
    - id: completion_cleaning
      applies_to: "all completion modules"
      rule: "For each actual formulation source lot s collect kg introduced and final mutually exclusive source-origin kg in unused return, retained stock, dry residue, wet wipe, free liquid and dispatched original-container residual. Original-container closing residual belongs to retained stock; residual actually dispatched is a separate final source-origin destination assigned ONLY to the container source share, never also to free liquid or wet wipe. The complete original container plus dispatched residual is another directly measured terminal carrier net kg and is NOT multiplied by its source-origin fraction. Used-to-rinsed is a replacement state, not another destination; sum final source-origin kg = source kg. Added water/dirt/container is excluded from source-origin kg. Imported water kg uses actual weighing or mass meter; volume readings convert only by imported_water_kg=imported_water_m3*actual_density_kg_m3 at recorded temperature. The import meter already excludes internal reuse; do not subtract reuse again. Whole liquid terminal carrier uses DIRECT net kg weighing only (gross less actual external container tare), not water-volume balance or source kg. Wet wipe and original cleaner container each use separate actual whole-carrier net kg and disjoint consignments; no double export with liquid. Record exact formulation/concentration, state, source, mass scales/calibration, water-meter boundary, dates, retained opening/closing stocks and destination. Reusable cloth manufacturing uses its own cleaned-m2 e/L asset ledger; its measured retirement carrier follows the same fraction once. Add each real cleaner, water, wipe, container and terminal stream as separately named cards before completion; unknown composition/destination is incomplete, never zero."
      inputs:
        - formulation_source_ID
        - formulation_kg
        - concentration
        - source_origin_kg_by_final_destination
        - original_container_closing_residual_source_kg
        - dispatched_container_residual_source_kg
        - container_plus_residual_net_kg
        - imported_water_kg
        - imported_water_m3
        - actual_density_kg_m3
        - water_temperature
        - internal_reuse_record
        - retained_stock_open_close
        - liquid_gross_kg
        - liquid_external_tare_kg
        - wet_wipe_net_kg
        - cleaner_container_net_kg
        - consignment_ID
        - cleaned_m2
        - scale_calibration
        - cp_completion
      output: "raw atomic cleaning inputs and disjoint complete terminal carrier kg before division by Q"
      source_ids: []
    - id: completion_transport
      applies_to: "all completion modules"
      rule: "Keep first-store inbound in the original S/F/O/T supply source once. For each actual separate return/transfer/waste segment i and beneficiary b, measure reserved_payload_kg_bi and actual_reserved_h_bi and fix d_bi=reserved_payload_kg_bi*actual_reserved_h_bi in kg*h for ALL beneficiaries. Split measured loaded, empty and stationary-idle source numerator pools; for each pool allocate A_bi=A_i*d_bi/sum_b(d_bi). Include unused operational responsibility as an identified beneficiary with evidenced payload-capacity kg and actual reserved hours; empty payload0 does not make reserved capacity0, and idle hours never use distance0. Record full vehicle payload capacity, dated reservations, actual loaded/empty km and active/empty/idle hours; no default capacity and no selection of another capacity unit. Every pool requires positive known same-unit total driver, full beneficiary and source reconciliation; unknown reservations/capacity/coverage block completion. A provider-already-attributed consignment vector is adopted once; segment and kg*h evidence is QA only and never multiplies it again. Verify empty/idle coverage in the actual provider scope; missing coverage requires a separately measured vehicle-km or vehicle-h service source with overlap removed before the SAME kg*h attribution."
      inputs:
        - trip_ID
        - segment_ID
        - consignment_ID
        - source_vector_ID
        - provider_attribution_scope
        - actual_loaded_km
        - actual_empty_km
        - actual_active_h
        - actual_empty_h
        - actual_idle_h
        - full_vehicle_payload_capacity_kg
        - reserved_payload_kg_bi
        - actual_reserved_h_bi
        - d_bi
        - A_i
        - A_bi
        - all_beneficiaries
        - unused_operational_responsibility_ID
        - fuel_or_electricity_amount
        - source_pool_split
        - cp_completion
      output: "raw source-specific attributed transport exchange quantities before division by Q"
      source_ids:
        - ghg-product-2011
    - id: completion_sum
      applies_to: "all inventory rows"
      rule: "For each external module m restore its normalized exchange q_mr to raw numerator A_mr=q_mr*D_m using its evidenced original denominator D_m, original pool/version and source/exchange identity. A provider-already-raw A_mr is not multiplied again. Reconcile all beneficiaries first; replace superseded lifetime/late-return versions. Merge only identical exchange identity+property+unit+boundary numerators, excluding exact source-ID overlaps; never add kg to MJ, custody outputs to manufacturing burden, or raw to normalized values. For each compatible row r final q_r=(A_core_r+sum_m A_mr)/Q. The failed_kit F source including original inbound is already in A_core_r; never add it again as a missing completion module. The customer product system adds sum(original S supply vectors)/Q with actual original source/inbound IDs, separately from this service, with no overlap of F/O/T; do not apply the service denominator to source vectors twice. Full retail completeness requires every named module, binding, source boundary and reconciliation evidence."
      inputs:
        - q_mr
        - D_m
        - original_pool_ID
        - original_version
        - raw_A_mr
        - source_exchange_ID
        - source_overlap_register
        - A_core_r
        - Q
        - cp_completion
      output: "complete compatible row quantities per reference flow; explicit unresolved-module list"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify each bound flow from official original response plus matching hash receipt, observed state, bilingual name, flow type, qualifiers, property/unit chain and carrier state. Unbound reference service, kit and waste identities remain unverified; before dataset completion obtain row-specific binding plus complete actual BOM, quantities and supply/treatment boundaries. Generic count property does not identify a service."
      evidence: "official responses and receipts; supplier BOM; source/destination scope"
    - id: quality_pool
      applies_to: "all processes"
      requirement: "Keep raw records, actual event dates and all later replacement versions; record uncertainty, exclusions and closure delay. Every Q has an auditable distinct-ID final-valid set; every pool and source numerator reconciles including Q=0. No numerical loss, package mass, allocation factor, useful life or compliance threshold is supplied by this PCR."
      evidence: "event/stock reconciliation; version log; uncertainty register"
    - id: quality_scope
      applies_to: "support_completion"
      requirement: "Disclose partial coverage until all fixed completion modules and corresponding bilingual cards are evidenced. Presence surveys cover the actual entire store/landlord boundary, not just selected merchandise. Battery absence requires supplier confirmation and actual model/BOM check, not silence in a public specification. Actual sealed nitrogen is contained product inventory, not inferred air discharge."
      evidence: "signed site/landlord survey; supplier confirmation; complete module/source audit"
validation_rules:
  - rule_id: validate_reference
    applies_to: "retail_service"
    rule: "Require exact same SKU/kit version and sealed state, Q final-valid original-ID set, dates/horizon and evidence of supplier passive/no-cell configuration. Reference display must equal retail_service selected name; it is a service identity, not binocular manufacture."
    source_ids:
      - nikon-p3-spec
  - rule_id: validate_responsibility
    applies_to: "all processes"
    rule: "Require goods and held-waste balances, signed continuing recipients, conserved original source S/F/O/T, original F input and original inbound once. Nonaccepted external retention does not count as accepted service or automatic retailer waste. Late revocation corrects original numerator and Q even without return. Gross customer handovers are never reduced again by already included nonacceptance."
    source_ids: []
  - rule_id: validate_modules
    applies_to: "all inventory rows"
    rule: "Check each final basis.kind is reference_flow, amounts use common Q, process/protocol scope is one existing ID and sources resolve. Complete claims require compatible source restoration, no duplicate source IDs, full historical asset correction, empty/idle transport and cleaning source/whole-carrier reconciliation. Unknowns or opened/damaged-content state require specific atomic bilingual extension and recheck, not an assumed zero or a silently broader kit card."
    source_ids: []
published_dataset_profile:
  dataset_role: "Partial incremental retail service unit process, with explicit F supply responsibility."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same evidenced passive sealed-kit route with fixed mandatory completion and separate customer-product S supply."
  excluded_use: "Whole-leaf coverage; opened/electronic/calibrated merchandise; complete retailer footprint while modules remain missing; product manufacturing identity; unsupported comparative or compliance claim."
  required_metadata: "All qualifiers, original source/recipient boundaries, P/Q version, gross custody balances, S/F/O/T, provider scope and module completeness."
  required_quality_disclosure: "Unbound identities; missing actual BOM/quantity/background; partial boundary, unknown presence and zero-Q pools; calibration and all historical replacement corrections."
  update_trigger: "SKU/BOM/seal/route/source changes, added powered test or cell, new module evidence, late acceptance/return or asset-lifetime revision."
