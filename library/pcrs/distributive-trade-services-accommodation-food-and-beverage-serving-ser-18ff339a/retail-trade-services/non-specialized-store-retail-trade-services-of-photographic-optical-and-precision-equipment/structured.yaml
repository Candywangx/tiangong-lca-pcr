system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all processes"
      rule: "Apply only after supplier specification/BOM and full-store plus landlord survey confirm passive non-stabilized optics without cell/electronics, sealed contained nitrogen, no optical bench/calibration lamp/target, no demonstrator, no lens-cleaning media, no printed receipt/label or retailer packaging. This route admits only all-electric unconditioned dry premises: no combustion fuel, refrigerant equipment, refrigerated stock, heat network or gas service anywhere in the allocated site/landlord boundary. Record equipment register, utility contracts and dated walkthrough; an unknown or present excluded source blocks this route, never establishes zero. Nitrogen sealed inside the device is not an elementary emission."
      source_ids:
        - nikon-p3-spec
    - rule_id: boundary_gate
      applies_to: "failed_kit; gross_handover; continuing_transfer; kit_waste"
      rule: "Keep each original kit ID and supplier lot through every receipt, handover and return. Original complete manufacturing and supplier-to-store inbound transport belong together at first store receipt and are conserved once per original ID as S/F/O/T responsibility: S finally valid customer product, F retailer loss/condemnation or externally retained nonaccepted product, O open stock, T signed continuing supplier/other-system responsibility. A resale changes that SAME original owner, never creates manufacture again. The failed_kit input is the actual F supply share, including original accessories/package and inbound transport once; it is not excluded as a custody satellite. S background stays in the downstream customer product system, O stays deferred with the original source, and T carries its signed background onward; a supplier return cannot erase it. Retain the full original source vector by source ID; component splits require verified supplier vectors conserving that boundary, never arbitrary mass fractions."
      source_ids: []
    - rule_id: boundary_physical
      applies_to: "gross_handover; continuing_transfer; kit_waste"
      rule: "Use a goods-only custody count balance: C_close = C_open + R_supplier + R_customer - H_gross - X_continue - D_condemn - L_missing. All terms are actual event counts; supplier receipt and customer return are separate gross inflows. H_gross includes every physical customer handover including unaccepted and repeat handovers, so never subtract external_nonaccepted again. X_continue contains mutually exclusive actual supplier/internal-system outward events, not background-only owner changes. Condemnation moves goods to held waste internally; held-waste close = held-waste open + D_condemn - W_dispatch_count, with actual waste dispatch not deducted twice from goods. Reconcile original IDs, counts and measured whole-kit kg independently. Only gross_handover and continuing_transfer physical product outputs are custody satellites excluded from co-product characterization; service and failed_kit input remain characterized. Lost goods and external nonacceptance have named final recipient/state and responsibility; neither automatically creates waste dispatch."
      source_ids: []
    - rule_id: boundary_complete
      applies_to: "all processes"
      rule: "This is a partial incremental counter-service dataset. Before a complete retail claim, mandatory completion modules are whole-premises lighting/fan/IT utility remainder, building/fixtures/shelves/security/checkout/network capital, cleaning and sanitary activity, actual return/transfer/waste transport, and waste treatment. All necessary actual devices, cleaners, media, carriers and maintenance enter named atomic bilingual cards/protocols and synced projection before completeness. No generic other-input row is allowed. Fixed calculation rules completion_energy, completion_assets, completion_cleaning, completion_transport and completion_sum govern those modules; absence must be evidenced and signed across site/landlord/provider boundaries. Unknown modules remain incomplete. The measured POS electricity is disjoint from the utility remainder; exclude it from a parent only when wiring/meter evidence shows that parent includes it. No subtraction from an independent disjoint meter."
      source_ids:
        - ghg-product-2011
