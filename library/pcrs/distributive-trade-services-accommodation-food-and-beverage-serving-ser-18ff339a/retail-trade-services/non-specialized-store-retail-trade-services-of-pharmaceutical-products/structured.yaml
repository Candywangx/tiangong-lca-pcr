system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "all inventory rows"
      rule: "Apply to actual mixed-assortment non-specialized physical stores and manual ambient receipt/shelf/quarantine/counter handover of original sealed finished acetaminophen tablet bottles in complete retail cartons. Any brand and product code within that family is eligible; separate supplier, formulation, strength, tablet count, lot and complete package/source-vector version per pool. This is finished solid formulation, never raw API or a combination-active product. No opening, counting, dispensing, compounding, prescription review, clinical advice, online order or delivery is included. Verify actual storage and seal requirements against the actual label and lot; neither this PCR nor the example label approves use of a medicine. A different product code requires its own data matching, not exclusion by brand."
      source_ids:
        - un-cpc3-62173
        - dailymed-tylenol-37806
    - rule_id: partial_scope
      applies_to: "all inventory rows"
      rule: "This is an explicitly partial incremental custody/checkout module. It includes core_ac and original failure background through failed_pack, plus measured physical satellite outputs gross_handover and supplier_handover and actual sealed pharmaceutical waste dispatch sealed_waste. Only gross_handover and supplier_handover are non-characterized custody satellites. Actual original receipts and physical returns are raw QA events. failed_pack is a characterized Product input, never excluded as a satellite. Successful merchandise production S is outside this service, and consumer use/travel/end-of-life is outside. No complete-business result is permitted until completion_gate and completion_sum pass."
      source_ids:
        - ghg-product-2011
    - rule_id: lot_gate
      applies_to: "service_out; failed_pack; gross_handover; supplier_handover; sealed_waste"
      rule: "Assign immutable original_pack_id, source_id, lot, expiry, actual NDC/carton/bottle/seal configuration, receiving date and original source vector to each pack. Read actual label and supplier lot/BOM; original tablets plus excipients/coating, bottle body/closure/liner/foil/label/adhesive/carton and actual included inserts form the complete source. Nominal100 count or500mg cannot substitute measured original complete pack mass, contents mass, packaging BOM or receiving background. A whole-pack supplier vector is valid only for its full identical object. Component manufacturing vectors are an exclusive alternative requiring supplier-specific quantities and conserved original IDs, never mass fractions of a whole environmental vector."
      source_ids:
        - dailymed-tylenol-37806
    - rule_id: state_gate
      applies_to: "service_out; gross_handover; supplier_handover; sealed_waste"
      rule: "Record actual unopened carton and inner foil seal, visible damage, expiry, recall notice and temperature history at every receipt/release/return/quarantine event. Final service requires documented valid handover acceptance for this actual pack; re-release of a return requires independently recorded eligibility and authorized decision, never presumed from a refund or intact appearance. Recall, expiry or other invalidation can revoke acceptance without a physical return. A purely financial adjustment with valid acceptance does not revoke it. Never-opened intact expired/recalled packs may enter the specified waste card only under actual receiver acceptance; broken/opened/wet/contaminated packs or loose tablets require a state-specific atomic extension, bilingual sync and new matching receiver/provider evidence before completeness."
      source_ids:
        - dailymed-tylenol-37806
    - rule_id: source_fates
      applies_to: "failed_pack"
      rule: "At the same original receiving gate partition every original whole-source pack into exactly one current responsibility S successful final accepted goods, F retail-pool-owned failure, T named continuing recipient/asset responsibility or O unresolved/open source stock. S backgrounds are excluded from the incremental service; a separately declared GOODS system adds original S vectors exactly once. F includes original manufacturing and transport to this gate exactly once via failed_pack. T needs signed source continuation and recipient/version; a supplier physical handover does not itself prove T. O blocks final source completeness and is never zero. Final failure may remain at a customer without accepted service; record real recipient, intact state, source ownership and treatment continuation, never create retailer waste merely from a revoked acceptance."
      source_ids:
        - ghg-product-2011
    - rule_id: pool_gate
      applies_to: "all inventory rows"
      rule: "Prospectively fix site/configuration/SKU/service-period pooling including closed, idle, refused, failed, lost and zero-sale cohorts. Retain costs and quantities in the same-configuration pool until an evidenced denominator exists; Q=0 is unnormalizable and must be reported with raw numerators. Do not erase or transfer a zero-output cohort merely to improve the result. A late return, recall or revocation replaces the original pool numerator, Q, fate and version using actual event dates; do not charge its background again to a new resale cohort. Distinct final-valid original IDs determine Q, with at most one final-valid service per original ID."
      source_ids:
        - ghg-product-2011
    - rule_id: utility_gate
      applies_to: "core_ac"
      rule: "Core electricity is measured only for explicitly identified custody/checkout circuits and the mains-powered temperature logger, with boundary map excluding external completion circuits. The allowed foreground route has no combustion, refrigeration, refrigerant charge, compressed-gas use, powered goods testing or tablet release. Signed equipment/site walkthrough, utility map and storage records must substantiate absence, including shared support; an unknown or actual occurrence blocks this route until a reviewed state/species/path-specific extension. External grid/provider emissions remain their upstream scope. No empty gas template, assumed zero leak or internal-air-to-outdoor equivalence is allowed."
      source_ids:
        - jrc-retail-2013
    - rule_id: completion_gate
      applies_to: "all inventory rows"
      rule: "Before any complete retail-service claim, cp_completion must contain a signed presence/absence and boundary/overlap matrix for premises/building and fixed lighting/ventilation/resistance-heating fixtures, shelf/quarantine cabinet, checkout/temperature logger, ICT/network, payment backend, camera/security/archive, administration, cleaning/water/materials, receipts/bags/transport packaging and all waste/asset/transport stages. Each actual homogeneous model or bounded real provider packet needs its own bilingual atomic cards and single-process protocol, actual provider contract/model/BOM, measured raw unit and inventory vector/source version; generic names are not complete modules. Evidence of a real complete bundle may preserve it intact only when its exact constituents, denominator, installation/operation/maintenance/end-of-life and exclusions are contractually evidenced. Absent modules require signed observations; missing quantities, identity, receiver or scope block completeness. Apply completion_drivers, asset_life, consumable_owner, transport_owner, liquid_carriers and completion_sum; downstream modeller may supply measurements but cannot choose another denominator/ownership rule."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
