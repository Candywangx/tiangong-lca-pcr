    used_for: "Product identity and storage/seal context only: package06 is one carton containing one plastic bottle of100 caplets; nominal500mg is ingredient strength. Neither complete BOM/LCI, actual lot quantities, therapeutic advice, legality nor safety approval follows."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Service unit, transparent boundaries and subdivision before physical allocation. The source does not prescribe this PCR loss/asset/completion equations or prove complete-standard conformity."
