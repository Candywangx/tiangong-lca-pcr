allocation_rules:
  - rule_id: core_partition
    applies_to: "core_ac"
    rule: "Direct subdivision/meters first. Partition each actual source circuit numerator into separately measured active, stationary-idle and fixed source pools whose kWh sum equals the parent. For dedicated pack scan/handling active load use measured line-active device seconds; shared multi-SKU actions use actual line-processing seconds with shares summing1 per unique event. Idle checkout/logger/custody fixed load uses reserved equipment seconds per beneficiary (including closed/idle/error periods) from prospective reservation logs. Do not sum active seconds, area-hours and bytes into one driver. All beneficiaries and failed/no-sale reservations remain; unknown/zero total driver with nonzero source blocks final allocation. Subtract a submeter only from a parent that actually contains it, never again from an already disjoint source."
    source_ids:
      - ghg-product-2011
  - rule_id: completion_drivers
    applies_to: "all inventory rows"
    rule: "For completion electricity/material/provider numerator source classes, first measure disjoint active/idle/fixed pools in the source unit and reconcile to the full parent. Facility fixed lighting/ventilation/resistance heat uses actual served-zone m2*h reservations across all beneficiaries; dedicated task energy uses measured device-active seconds, idle devices reserved seconds. ICT active processing and administration use actual line/task processing seconds; a real shared homogeneous administration batch is allocated by measured source-line processing seconds divided by total seconds of every actual beneficiary, shares summing1 per unique batch, never the whole batch per SKU. Idle/fixed backend uses reserved service-capacity seconds. A payment attempt serving a basket is one event with measured source-line processing seconds/total seconds, never a full attempt per SKU; failed authorizations remain. Network packet uses either actual provider traffic GB with GB=10^9bytes (GiB=2^30bytes) or uniquely reserved bandwidth Mbps*h if that is the actual contractual denominator; mutually exclusive, no overlap with its included electricity. Build each camera capture-period beneficiary map from time-stamped actual shooting-zone/field-of-view drawings and measured served beneficiary display/custody footprint m2 within that field, multiplied by its actual covered seconds. Allocate each captured-byte source by those same-unit m2*s coverage quantities across ALL actual beneficiaries in that shooting interval, retaining overlapping beneficiaries only through a documented disjoint zone/time partition and including empty reserved space in its original beneficiary reservation. Freeze source IDs, interval, zone geometry, complete driver totals and map version for that original capture period; unknown coverage blocks allocation. Camera active source allocation uses measured captured bytes with this frozen map; storage uses actual byte*h retained with the same capture map, including no-sale periods, not later sales. Internet access alone cannot stand for payment/security/admin services. For every source class c and beneficiary h use q_c_h=x_c*d_c_h/sum_all_h(d_c_h) with one same-unit driver; sum compatible attributed quantities only after allocation."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
  - rule_id: asset_life
    applies_to: "all inventory rows"
    rule: "Every actual homogeneous asset/model/BOM/scope has a persistent all-beneficiary lifetime ledger. Use exposed reserved operating hours e_a_h and expected lifetime hours L_a for devices/cabinet; served area*time e_a_h and expected lifetime area*time L_a for a complete building; cleaned-area m2 for reusable cloth, never copy incompatible units. Provisionally f_old_h=e_a_h/L_a and cumulative fractions<=1. At final retirement replace EVERY historical beneficiary fraction with f_new_h=e_actual_a_h/E_a where E_a=sum_all_h(e_actual_a_h); update every original pool by delta_h=f_new_h*V_new-f_old_h*V_old, with all intermediate version replacements recorded. A residual1-sum_old_f is QA only, not final allocation. Separate manufacturing/installation V, measured operations, actual event repairs and actual terminal carriers. A complete life package evidenced to include a stage excludes the matching separate stage. Actual independent asset/repair/retirement transport first belongs to that same asset/event then follows the same historical fractions and replacements, never all current retirement Q. Whole terminal direct net weighing and complete BOM reconstruction are exclusive; do not subtract removed parts twice or turn unrelated repair masses into a complete device."
    source_ids:
      - ghg-product-2011
  - rule_id: consumable_owner
    applies_to: "all inventory rows"
    rule: "Additional actual receipt paper, bags and transport packaging require specific model/material/component or evidenced complete-package cards before completeness. Assign manufacturing AND inbound transport once at first actual use to its original pool; unopened unused stocks/returns/transfers retain unassigned original source. Separate unused rolls/sheets from printed WIP; reused packaging never repeats first manufacture/inbound. Printed WIP transfers actual original paper and printing-meter sources with IDs/version replacement, so later withdrawal never charges again. Net paper excludes actual cores and separate wrap/cartons, not thermal coating. Direct actual net waste dispatch kg is the exchange; generation/opening/closing held waste is QA only. Cover source-derived discards in measured retained stock/customer handover or contract-admitted real mixed carrier; separate carriers are disjoint."
    source_ids:
      - jrc-retail-2013
  - rule_id: transport_owner
    applies_to: "all inventory rows"
    rule: "Each transport source records attribution_level: unallocated_trip, consignment, parent_owner or exact_pool, plus trip/segment, loaded mass and distance, actual capacity unit, stationary idle and empty routes, all beneficiaries and provider included stages. Subdivide first. For a shared trip source X_j in its own unit use measured reserved capacity*time d_j_s including empty/idle reservations to allocate X_j_s=X_j*d_j_s/sum_all_s(d_j_s); d uses one actual capacity unit times hours, stationary idle duration is positive. Already-consignment attribution skips trip allocation only. Next assign original goods S/F/T/O, consumable first-use or asset historical fractions under their own rules. Skip owner multiplication only with evidence already assigned to the exact original responsibility/pool/version. Loaded t*km alone does not cover actual empty km; require provider empty/idle inclusion or a separate measured vehicle-km/h card with overlap removed. Failed_pack includes F inbound once; actual independent waste dispatch transport belongs to that waste source, without reapplying F to already-direct waste kg."
    source_ids:
      - ghg-product-2011
  - rule_id: liquid_carriers
    applies_to: "all inventory rows"
    rule: "Site cleaning completion uses actual individually identified formulation and equipment cards with supplier composition and measured acquisition/first-use. Keep source-formulation kg in used/spilled/rinsed/retained-container/dispatched-container-residue/unused/returned fates disjoint by final state and original IDs; used-to-rinsed is replacement, not two destinations. Added rinse water/dirt is not formulation-origin kg. Water import is actual inlet-meter volume and internal reuse is not subtracted again. Effluent exchange uses direct net carrier weighing or actual discharge V*rho with same-state density and temperature, mutually exclusive; no water-only balance substituted as whole liquid. Entire wet liquid/wipe/container kg differs from formulation kg and is not multiplied again by source composition. Unknown discharge/evaporation/storage remains a separate supply check, never silently zero. Actual mixed waste requires signed receiver acceptance of constituents/state and matching complete treatment scope, not a photo/license."
    source_ids:
      - jrc-retail-2013
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "custody"
      flow_role: "failed_pack; service_out; gross_handover; supplier_handover"
      record_type: "immutable pack/custody/source ledger"
      raw_fields: "original_pack_id; source_id; lot; NDC; configuration; seal; expiry; recall_id; temperature_history; receipt_date; event_id; event_date; event_type; physical_recipient; physical_state; original_pool; acceptance_version; final_valid; cutoff; supplier_vector_id; V_s; N_original_s; N_S_s; N_F_s; N_T_s; N_O_s; G_close; G_open; N_receipt; N_customer_return; N_transfer_in; N_gross_customer_handover; N_supplier_handover; N_transfer_out; N_condemn; N_confirmed_missing; R_goods; measured_original_pack_mass_kg; measured_contents_mass_kg; actual_component_BOM; receiver_source_continuation; method_mode"
      collection_method: "Scan/read actual SKU/lot/seals and supplier BOM/receiving documents per original pack. Weigh traced complete original packs and any component checks on calibrated balances without replacing complete mass by active strength; do not open service stock to infer formulation LCI. Link POS acceptance, recall/expiry/return/retention records and signed continuation to the same immutable IDs. Full stocktake plus all movements, including no-sale events; unknowns remain open. Retain raw counts/masses and typed physical_stock; valid_count gives Q; failure_source gives N_F/B_F; one_reference divides once per reference flow. cp_waste links condemnation event IDs without repeating raw count collection."
      unit: "Item(s); kg"
      frequency: "Every movement/acceptance revision; daily stock reconciliation; cutoff recheck"
      temporal_coverage: "Complete declared pool and late-event revision history"
      site_scope: "One declared mixed-store SKU configuration; all original sources and recipients"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original labels and lot photos; calibrated weighing records; POS event versions; signed stock/recipient/source reconciliations"
    - protocol_id: cp_meter
      process_id: "custody"
      flow_role: "core_ac"
      record_type: "meter/source-class driver ledger"
      raw_fields: "source_meter_id; source_id; source_class; parent_boundary; meter_start; meter_end; K_c; d_c_h; all_beneficiary_id; active_seconds; reserved_seconds; closed_idle_seconds; event_id; line_processing_seconds; attribution_level; original_pool; version; calibration; missing_intervals"
      collection_method: "Boundary-audit each circuit and log calibrated interval/plug meters through occupied/closed/idle/failure periods. Synchronize unique line actions and all beneficiary reservation clocks. Directly measure source-class pools; verify their kWh sum and driver units before allocation. No theoretical nameplate energy or unexplained zero missing intervals. core_partition then electricity_total yields raw attributable E_core_MJ; one_reference E_core_MJ/Q per reference flow."
      unit: "kWh; s"
      frequency: "Continuous interval metering; event clock; each bill/cutoff reconciliation"
      temporal_coverage: "Entire same-configuration pool including zero output"
      site_scope: "Only mapped custody/checkout and mains logger circuits"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration and circuit diagram; actual operating logs; full-source/driver reconciliation"
    - protocol_id: cp_waste
      process_id: "quarantine"
      flow_role: "sealed_waste"
      record_type: "typed quarantine and actual dispatch ledger"
      raw_fields: "event_id; original_pack_id; source_id; waste_state; expiry_recall_reason; seal; receiver_id; acceptance_contract; constituent_scope; provider_treatment_scope; tare_kg; gross_kg; W_dispatch_kg; W_open_kg; W_close_kg; W_condemn_kg; W_received_kg; W_other_exit_kg; W_missing_kg; R_waste_kg; transport_source_id; attribution_level; actual_recipient; dates; calibration"
      collection_method: "Quarantine without changing original source IDs; obtain actual signed receiver acceptance for intact full formulation/bottle/carton and provider scope. Directly weigh each complete dispatched net carrier on calibrated scale (gross minus actual separately measured outside tare). Independently weigh condemnation/opening/closing waste; link to cp_goods event counts, not count=kg. No dispatch inferred from generation. Direct W_dispatch_kg is numerator; physical_stock mass balance is QA; one_reference divides by common Q once per reference flow."
      unit: "kg"
      frequency: "Every condemnation and dispatch; daily held-stock record; cutoff reconciliation"
      temporal_coverage: "All quarantine and waste stock over declared pool and revisions"
      site_scope: "Actual segregated intact pharmaceutical carrier and real receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale records; signed consignments/receiver acceptance; original pack and event links; treatment/transport exclusions"
    - protocol_id: cp_completion
      process_id: "support"
      flow_role: "completion extensions"
      record_type: "mandatory applicability/module/asset/provider ledger"
      raw_fields: "module_id; source_id; actual_model; complete_BOM; real_contract; signed_presence_absence; boundary_constituents; process_id; flow_role; actual_property_unit; raw_numerator; z_m_j; D_m; U_m_j; U_m_j_h; C_core_j_h; Q; source_class; x_c; d_c_h; all_beneficiaries; served_zone_m2_h; active_seconds; reserved_seconds; payment_event_id; line_processing_seconds; byte; byte_h; GB_GiB_mode; Mbps_h; capture_period_map; shooting_zone; field_of_view; covered_footprint_m2; covered_seconds; disjoint_zone_time_partition; capture_map_version; administration_batch_id; all_line_processing_seconds; asset_id; e_a_h; L_a; e_actual_a_h; E_a; f_old_a_h; f_new_a_h; V_old_a; V_new_a; A_old_h; original_pool; version; event_id; lifecycle_stage; first_use_id; unused_stock; printed_WIP; printing_source; formulation_origin_kg; dispatched_container_residue_kg; water_import_V; discharge_V; rho; temperature; wet_carrier_mass_kg; transport_source; attribution_level; trip_segment; actual_capacity; loaded_mass; distance; stationary_idle_h; empty_km; owner_fraction; receiver_acceptance; measurement_calibration; missing_fields"
      collection_method: "Inspect entire actual store/support providers and sign the exact module matrix in completion_gate. For each real homogeneous object/packet collect model/BOM/contract, calibrated original source quantities, complete all-beneficiary drivers, lifetime history and direct consignment evidence. Expand into atomic cards with a new single-process protocol view carrying the same original record/source IDs and exact flow_role list; cp_completion is an intake/gate protocol, not a fictitious combined flow. Apply fixed completion_drivers, asset_life, consumable_owner, transport_owner and liquid_carriers. Unknown presence/quantity/contract or a generic bundle blocks completion."
      unit: "Separate actual source units; never sum unlike dimensions"
      frequency: "Every source event; continuous operation clocks; each period and lifetime revision"
      temporal_coverage: "Full module history including closed/failed/no-sale and all historical pools"
      site_scope: "All actual necessary facilities, ICT, payment, security, administration and consumables"
      aggregation_rule: "Keep raw source numerators, perform one fixed ownership attribution then completion_sum with core numerators; divide once by Q per reference flow after same-unit source deduplication."
      quality_evidence: "Signed actual contracts/scope matrix, real model/BOM, calibration, all-source/beneficiary reconciliation, historical version replacements, extension cards/protocol parse review"
  calculation_rules:
    - id: valid_count
      applies_to: "service_out"
      rule: "Q=count(distinct original_pack_id having current final-valid qualified service at cutoff). Return/resale histories keep the same ID. Revoked acceptances are absent from that set; do not subtract them again. A valid financial adjustment stays in the set."
      inputs:
        - original_pack_id
        - acceptance_version
        - final_valid
        - cutoff
        - cp_goods
      output: "Q"
      source_ids: []
    - id: physical_stock
      applies_to: "gross_handover; supplier_handover; sealed_waste"
      rule: "Goods-only count balance: G_close=G_open+N_receipt+N_customer_return+N_transfer_in-N_gross_customer_handover-N_supplier_handover-N_transfer_out-N_condemn-N_confirmed_missing+R_goods. N_gross_customer_handover contains ALL physical customer handovers including never-accepted; do not subtract unaccepted handovers again. A no-movement revocation creates no stock exit. Condemnation is internal goods-to-held-waste change. Independently W_close_kg=W_open_kg+W_condemn_kg+W_received_kg-W_dispatch_kg-W_other_exit_kg-W_missing_kg+R_waste_kg. Link N_condemn to independently weighed W_condemn_kg by event IDs, never equate Item(s) and kg. Signed unresolved R values remain investigated with uncertainty; confirmed missing has separate evidence."
      inputs:
        - G_close
        - G_open
        - N_receipt
        - N_customer_return
        - N_transfer_in
        - N_gross_customer_handover
        - N_supplier_handover
        - N_transfer_out
        - N_condemn
        - N_confirmed_missing
        - R_goods
        - W_close_kg
        - W_open_kg
        - W_condemn_kg
        - W_received_kg
        - W_dispatch_kg
        - W_other_exit_kg
        - W_missing_kg
        - R_waste_kg
        - event_id
        - cp_goods
        - cp_waste
      output: "typed_stock_checks"
      source_ids: []
    - id: failure_source
      applies_to: "failed_pack"
      rule: "For each original homogeneous receiving-source vector V_s, N_original_s=N_S_s+N_F_s+N_T_s+N_O_s with exactly one current source responsibility per pack. The raw failed_pack input is N_F=sum_s(N_F_s), and background B_F=sum_s(N_F_s*V_s), where V_s is per one actual complete original pack delivered to the receiving gate. Keep differing vectors in separate rows/datasets, not one count multiplier. A whole-pack mode and component-vector mode are exclusive; per-component responsibilities require separate actual component Product input cards with original quantities/units/providers, conserved sources and excluded whole-pack portions. A downstream GOODS system separately adds B_S=sum_s(N_S_s*V_s) once. No environmental vector is partitioned by an arbitrary component mass fraction."
      inputs:
        - N_original_s
        - N_S_s
        - N_F_s
        - N_T_s
        - N_O_s
        - V_s
        - source_id
        - original_pack_id
        - cp_goods
      output: "N_F; B_F; B_S"
      source_ids:
        - ghg-product-2011
    - id: electricity_total
      applies_to: "core_ac"
      rule: "K_core_h=sum_c(K_c*d_c_h/sum_all_h(d_c_h)); each K_c is disjoint measured kWh under core_partition and d_c_h is its fixed same-unit source-class driver. E_core_MJ=3.6*K_core_h. Meter readings are raw before attribution; an exact-pool provider reading is not allocated again."
      inputs:
        - K_c
        - d_c_h
        - source_class
        - source_meter_id
        - parent_boundary
        - attribution_level
        - cp_meter
      output: "E_core_MJ"
      source_ids: []
    - id: asset_replace
      applies_to: "all inventory rows"
      rule: "Provisional f_a_h=e_a_h/L_a; final f_a_h=e_actual_a_h/E_a; E_a=sum_all_h(e_actual_a_h). For each original historical pool and each version replace A_new_h=f_new_a_h*V_new_a and post delta_h=A_new_h-A_old_h. Apply the identical parent-asset fraction once to terminal carrier and independent parent-owned transport; actual event maintenance has disjoint event source/beneficiary ledger."
      inputs:
        - e_a_h
        - L_a
        - e_actual_a_h
        - E_a
        - f_old_a_h
        - f_new_a_h
        - V_old_a
        - V_new_a
        - A_old_h
        - asset_id
        - original_pool
        - version
        - cp_completion
      output: "A_new_h; delta_h"
      source_ids:
        - ghg-product-2011
    - id: completion_sum
      applies_to: "all inventory rows"
      rule: "For each exchange j restore each external module to its evidenced original raw numerator U_m_j=z_m_j*D_m only when z_m_j is normalized; retain raw U_m_j directly otherwise. Apply the fixed class/first-use/asset/source-owner allocation exactly once to obtain attributable U_m_j_h. Deduplicate actual source/event/time/asset/lifecycle constituents, not only provider IDs. Then q_final_j=(C_core_j_h+sum_disjoint_m(U_m_j_h))/Q for identical exchange identity/property/unit and compatible scope. C_core includes E_core_MJ, N_F with its supplier vector, and direct dispatch kg where relevant; never omit core or add F twice. Do not add kg to MJ, raw to normalized, or gross satellite counts to service output. Q=0 blocks division. Partial modules keep exclusions/unfinished obligations explicit until all actual atomic cards/protocols and this aggregation are verified."
      inputs:
        - C_core_j_h
        - U_m_j
        - U_m_j_h
        - z_m_j
        - D_m
        - Q
        - source_id
        - event_id
        - asset_id
        - lifecycle_stage
        - attribution_level
        - original_pool
        - version
        - cp_completion
      output: "q_final_j"
      source_ids:
        - ghg-product-2011
    - id: one_reference
      applies_to: "all inventory rows"
      rule: "Each final row amount=q_owned_row/Q per reference flow; q_owned_row retains its own numerator unit and all attribution already applied. service_out=Q/Q=1 Item(s). gross_handover=N_gross_customer_handover/Q and supplier_handover=N_supplier_handover/Q are non-characterized physical satellites only. sealed_waste=W_dispatch_kg/Q is direct actual net consignment kg with stock QA, no F fraction or stock correction repeated."
      inputs:
        - q_owned_row
        - Q
        - N_gross_customer_handover
        - N_supplier_handover
        - W_dispatch_kg
        - cp_goods
        - cp_meter
        - cp_waste
      output: "final_inventory_amount"
      source_ids: []
  data_quality_requirements:
    - id: lot_trace
      applies_to: "service_out; failed_pack"
      requirement: "Original SKU/lot/seal/storage/expiry/recall state and complete source vector must be traced to the same immutable IDs; nominal counts/strength are not mass or LCI."
      evidence: "Actual labels, signed supplier lot/BOM/vector and complete event history"
    - id: source_quality
      applies_to: "all inventory rows"
      requirement: "Use actual geography/time/technology/provider scope, uncertainty, calibration and completeness disclosure. No official label, historical UUID observation or general method is a quantitative site LCI."
      evidence: "Provider inventories and original activity records; uncertainty and missing-field register"
    - id: completeness_quality
      applies_to: "all inventory rows"
      requirement: "A core partial module remains labelled partial even with finite measurement passing. New actual states/exchanges need atomic bilingual cards and exact process/protocol/raw/calculation linkage before a complete claim."
      evidence: "Signed completion matrix and actual parsed projection; unresolved identities and all omitted modules"
validation_rules:
  - rule_id: identity_complete
    applies_to: "all inventory rows"
    rule: "Candidate UUID gaps remain explicit by exact row_id. Before a numerical usable dataset, bind each exchange to independently direct-read official bilingual identity/type/property/unit/medium and matching actual provider; official property UUID is not a flow UUID. Point-of-use AC identity proves no grid/provider performance. Reject mismatched SKU/state/BOM or a supplier vector inferred from the public label; retain actual quantities/uncertainties, no invented factors or zero defaults."
    source_ids:
      - dailymed-tylenol-37806
  - rule_id: custody_integrity
    applies_to: "service_out; failed_pack; gross_handover; supplier_handover; sealed_waste"
    rule: "Reconcile distinct-valid Q, complete original-ID event history, typed stock balances, S/F/T/O source conservation, source-vector whole/component exclusivity, receiving gate and inbound scope. Investigate missing and signed residuals separately. Every never-accepted or revoked retained-customer pack requires real recipient/state/background continuation even without physical return. Seal/expiry/recall/temperature uncertainty blocks qualified service, never permits dispensing or automatic resale."
    source_ids:
      - dailymed-tylenol-37806
  - rule_id: waste_integrity
    applies_to: "sealed_waste"
    rule: "Actual receiver acceptance must match the entire unopened expired/recalled pharmaceutical formulation plus original bottle/closure/seal/carton carrier and its measured net kg. No default hazard category, treatment, recycling credit or safe-use/legal approval. Opening, leakage, external contamination, mixed contents, new disposal container or missing carrier requires a concrete state-specific card/provider extension. Included provider collection/treatment/packaging/transport is excluded from separate duplicates. Physical supplier return and responsibility T remain independent."
    source_ids:
      - jrc-retail-2013
  - rule_id: module_integrity
    applies_to: "all inventory rows"
    rule: "Core measurement completeness does not establish complete retail business. Require actual completion matrix, real cards/protocols, raw field coverage, source-class same-unit driver reconciliations, provider attribution levels, all historical asset revisions, first-use stock and exact once-only completion aggregation before completeness. Unknown support electricity, necessary capital, payment/admin/security scope or transport empty/idle coverage is a blocking gap, not zero or a generic service name."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
  - rule_id: bilingual_projection
    applies_to: "all inventory rows"
    rule: "Both languages must preserve reference denominator, object/state/type/direction, row/protocol IDs, conditional gates, source IDs, formulas and obligations. Final cards use basis_kind reference_flow. Generate structured projection through normal sync; compare actual parsed inputs and each card protocol process_id/flow_role including completion extensions. A finite measurement check is not scientific, identity, translation or drug safety approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; explicitly partial incremental service until mandatory support completion"
  downstream_use: "Inventory-only partial module for one specified original pack; complete retail system only through fixed completion_sum, separately declared GOODS background S if requested"
  allowed_use: "Transparent source responsibility/lot-controlled service studies with measured matching source vectors and explicit completion status"
  excluded_use: "Whole CPC leaf, clinical/dispensing/therapeutic/safe-use/legal claims; equating formulation to API or other pack/route; complete-business comparisons from partial core; unverified provider impacts"
  required_metadata: "All qualifiers; exact source/version/property/unit/state; pool and cutoff history; raw/Q distinction; S/F/T/O and failure input; original gate transport; module matrix and all exclusions"
  required_quality_disclosure: "Measured versus unresolved; actual calibration/coverage/uncertainty; historical identity observation; partial support gaps, non-normalizable pools and signed residuals; no approval inferred"
  update_trigger: "Label/SKU/formulation/pack/BOM/lot state, channel, storage/seal/recall acceptance, late events, supplier vectors, module scope, asset exposure/lifetime/retirement or provider attribution changes"
