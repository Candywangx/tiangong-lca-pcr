    - id: calc_carton
      applies_to: "carton_input"
      rule: "N_carton_p=sum_first_use n_carton_source*paint_gross_kg_contents/sum_all_contents(gross_kg_contents); carton_input=N_carton_p/Q_p. Keep first-use source assignment and opening/closing unused and previously-used stock; returned unused carries source forward."
      inputs:
