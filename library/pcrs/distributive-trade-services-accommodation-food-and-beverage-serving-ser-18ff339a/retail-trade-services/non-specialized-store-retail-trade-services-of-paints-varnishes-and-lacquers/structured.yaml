    - id: calc_transport
      applies_to: "loaded_transport; empty_transport; idle_transport"
      rule: "For every disjoint transport_source_id/stage record require attribution_level with evidence. unassigned_vehicle: calculate L_s/U_s/I_s exactly by al_transport, then apply owner_fraction_s_p. source_only: use provider_attributed_loaded_tkm/empty_vehicle_km/idle_vehicle_h as L_s/U_s/I_s already assigned to original_source_id s; do not repeat vehicle mass/capacity allocation, but STILL multiply the matching owner_fraction_s_p. final_owner_pool: only when the provider documents exact original_source_id, owner_pool_id p, responsibility class F/carton/asset-historical/event and owner_allocation_version, use its quantities as final_owner_loaded_p/final_owner_empty_p/final_owner_idle_p unchanged; do not multiply vehicle share or owner_fraction again. Missing final-owner evidence is never final_owner_pool. owner_fraction_s_p is fixed by source_owner_mode: original_goods=F_s/original_source_q_s with S excluded; carton=carton_first_use_fraction_s_p with unused stock carried; asset=sum_h_in_p f_a_h with EVERY historical allocation replaced and delta_a_h=f_new_a_h*V_new_a-f_old_a_h*V_old_a; retail_waste_or_return=event_source_fraction_s_p from the original event ledger. N_loaded_p=sum_source_records L_s*owner_fraction_s_p+sum_final_owner_records final_owner_loaded_p; analogously N_empty_p=sum_source_records U_s*owner_fraction_s_p+sum_final_owner_records final_owner_empty_p and N_idle_p=sum_source_records I_s*owner_fraction_s_p+sum_final_owner_records final_owner_idle_p. Keep units separate and each source/stage in exactly one attribution mode. Every asset lifespan/vector revision or retirement revalidates/replaces provider-final-owner receipts for ALL original historical pools, or reconstructs source-level history; it never freezes outdated f or charges retirement/current Q. Already-included V/provider stages are not added. Divide each final quantity by Q_p once; asset stage construction and whole-asset expansion remain exclusive views under al_complete."
      inputs:
