    - id: calc_complete
      applies_to: "all inventory rows"
      rule: "N_final_r=N_core_r+sum_disjoint_m N_m_r; N_m_r=q_m_r*D_m for previously normalized modules only; q_final_r=N_final_r/Q_p. Preserve source IDs, module versions and asset historical delta_a_h; combine identical exchange/property/unit only, and apply unassigned attribution once."
      inputs:
