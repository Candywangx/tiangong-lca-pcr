validation_rules:
  - rule_id: vr_acceptance
    applies_to: "service_output"
    rule: "Q_p=count of distinct original_can_id with final valid sealed-can acceptance in p. Record gross physical handovers, physical returns, refusals, repeated attempts and acceptance revocations separately. Revoke acceptance even without a return; financial refunds/discounts with valid acceptance do not revoke it. Never subtract revocations again after counting final-valid IDs. Return/resale retains original ID and source; late events replace original denominator AND numerator/fate attribution with dated versions, not a new cohort charge."
    source_ids: []
  - rule_id: vr_balance
    applies_to: "failed_original; supplier_handoff; external_retained; sealed_paint_waste"
    rule: "Use two dimensional ledgers linked by condemnation_event_id and original_can_id. Goods-only counts in Item(s): opening_goods+receipts+physical_customer_returns=closing_goods+all_gross_customer_handovers+supplier_handoffs+internal_transfers+condemnation_count+confirmed_missing_count+signed_unresolved_count. All gross handovers include never-accepted movements; never subtract them again. Condemnation is an internal goods-to-held-waste state change. Separately weigh the complete current carrier at that event: condemned_kg=sum_event(current_gross_kg-current_tare_kg), with can body/closure and wet contents included, outer weighing container excluded. Held-waste kg: opening_waste_kg+condemned_kg=closing_waste_kg+actual_dispatch_kg+confirmed_missing_waste_kg+signed_unresolved_waste_kg. Each term has the same carrier scope, time and kg unit; carton waste uses its own carrier balance. No count is added to kg, no nominal count-to-mass default, and waste dispatch is never subtracted from goods counts. Keep wet-paint net kg independent from complete-carrier kg. Signed unresolved residuals and missing evidence block completeness."
    source_ids: []
  - rule_id: vr_identity
    applies_to: "all inventory rows"
    rule: "Every unbound row requires actual exact bilingual flow identity, product/waste/elementary type, property/unit and applicable compartment/provider matching before quantified use. The historically verified AC Product flow is provider/voltage unspecified and does not establish a supply mix. Blank UUID is unresolved, never a manufactured identifier or a property UUID used as a flow. Complete wet original can input needs actual paint net mass and full packaging BOM/vector, not nominal litres or SDS ingredients."
    source_ids: []
  - rule_id: vr_waste
    applies_to: "sealed_paint_waste; carton_waste"
    rule: "Measure actual consignment net full-carrier kg with calibrated scales and receiver receipt. Intact wet paint can plus closure is one actual mixed carrier only when receiver signed acceptance names exact wet formulation and full package state and treatment covers them; photos/licence alone do not establish this. Do not add its paint and metal masses as duplicate waste. Dispatched cardboard excludes separately dispatched constituents and paint cans. Actual used, unused, customer-held, retained and dispatch states reconcile; unknown route is not zero, credit or benign disposal."
    source_ids:
      - bm-f551-2025
      - jrc-retail-2013
  - rule_id: vr_completeness
    applies_to: "all inventory rows"
    rule: "No dataset is complete until cp_route, every present card, support-provider boundary, raw-to-final formula and original source ownership reconcile. Required support asset models must be independently bound or explicitly contained in a verified other model with source-ID deduplication. Actual additional model, repair, consumable or waste requires its own bilingual card and protocol before completion. Preserve uncertainty and candidate review-required state; no safety/legal/VOC-limit conformity is inferred."
    source_ids: []
  - rule_id: split_completeness
    applies_to: "all inventory rows"
    rule: "Check every exact identity and single reference property, all actual work-order constituents, disjoint measurements, old-package reversal, no duplicated source/asset terminal scope, all-beneficiary historical attribution and one final normalization. Unverified sources, uncarded actual exchanges, unknown quantities or a mere claim of contract inclusion are incomplete."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One incremental retail service after actual source completion; optional separate GOODS system adds S once"
  allowed_use: "Same measured product/pack/route service studies with explicit boundary and uncertainty"
  excluded_use: "Whole group351 or all-store comparisons; coating manufacture/application equivalence; safety/legal/VOC compliance; incomplete support as complete business"
  required_metadata: "Required qualifiers; pool and final Q; all original sources and module versions; provider/stage scope; every unresolved identity"
  required_quality_disclosure: "Actual completeness and unknowns; original field methods; measured stock/ownership closure; lifetime and late-return corrections"
  update_trigger: "SKU/formulation/pack/channel change; any opening/leak; new support model/constituent; late return; asset retirement or source revision"
data_sources:
  - id: "un-cpc3-62164"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 subclass62164 explanatory note; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62164"
    used_for: "Classification scope: actual note links group351; no quantity or full-leaf applicability"
  - id: "bm-f551-2025"
    type: "handbook"
    reference: "Benjamin Moore Regal Select Premium Interior Paint & Primer Semi-Gloss F551, F551 CE040225; https://media.benjaminmoore.com/WebServices/prod/assets/production/datasheets/TDS_0551/F551_TDS_CE.pdf"
    used_for: "Pages1–2: real white acrylic-vehicle waterborne product and nominal3.79L specification; distinction from opening, thinning and application. No actual fill/BOM/LCI, emission factor or regulatory conclusion adopted."
  - id: "jrc-retail-2013"
    type: "official_guidance"
    reference: "JRC Best Environmental Management Practice in the Retail Trade Sector, EUR25998EN, 2013; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "PDF pages18,149–150,351,361–362: retail utility, lighting, packaging and waste process coverage only. PCR equations are declared methods with field collection, not JRC numerical benchmarks or complete-standard conformity."
