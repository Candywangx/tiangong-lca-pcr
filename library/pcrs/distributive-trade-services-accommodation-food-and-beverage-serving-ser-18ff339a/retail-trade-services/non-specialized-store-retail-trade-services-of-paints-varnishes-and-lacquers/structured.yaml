system_boundary:
  rules:
    - rule_id: sb_scope
      applies_to: "all inventory rows"
      rule: "Admit only a documented non-specialized mixed-assortment walk-in store, one actual SKU and original package model: factory-white waterborne acrylic-dispersion interior paint, one sealed nominal 3.79 L can, no retailer-added tint, dilution or shaking. F551 White(01) is a real specification anchor, not a mandatory brand. A different formulation, sheen, pack or route is a separate pool and applicability review. Manufacturer 100% acrylic describes the binder vehicle, not the whole wet formulation or solids fraction. Record actual lot identity and package BOM; no manufacturer nominal weight substitutes for field quantity."
      source_ids:
        - un-cpc3-62164
        - bm-f551-2025
    - rule_id: sb_gates
      applies_to: "all inventory rows"
      rule: "Start at store receipt and finish at final valid customer acceptance of the still-sealed original can. Include all same-configuration receiving, storage, merchandising, checkout, failures, closure and idle periods prospectively in pool p. No customer travel, home delivery, application, dry film, consumer cleanup or household disposal. Never confuse non-specialized mixed merchandise with non-exclusive brand authorization. CPC explanatory note covers group351; this PCR covers a narrower paint subset, not artists colours, ink, varnish or lacquer."
      source_ids:
        - un-cpc3-62164
    - rule_id: sb_route_gate
      applies_to: "all inventory rows"
      rule: "cp_route must establish no opened/leaking cans, tinting, decanting, retailer shaking, spraying, solvent cleaning, combustion, refrigerant equipment, powered handling, paper receipts, retailer bags or customer packaging. Electric resistance heat and ventilation may be included in electricity and the fixed-building asset. An unobserved condition is unknown, not absent. Any actual excluded activity blocks complete applicability until named state/species/material cards, raw protocols, conversions and bilingual projection are independently added and reviewed; do not assume sealed storage has a VOC emission factor, dry-film solids conversion or regulatory approval."
      source_ids:
        - bm-f551-2025
    - rule_id: sb_original_sources
      applies_to: "failed_original"
      rule: "The service excludes successful merchandise source S. For each original can source s, q_s and its complete supplier vector V_s include actual wet paint plus full original body/closure/liner/label/adhesive and upstream transport to this receiving gate. Partition original-source responsibility S_s+F_s+T_s+O_s=q_s; S is ultimately accepted goods, F is unrecovered loss/failed goods charged through failed_original, T is named continuing recipient/internal asset, O is actual open stock. Retain physical missing versus unresolved signed residual separately. A whole homogeneous original can may use one count vector. If components have different responsibility, replace the whole input by actual separately measured component cards and verified supplier component vectors, conserving the original vector; never split impacts by mass fraction. No acquisition for S is in the service; a separately declared downstream GOODS study may add S once."
      source_ids: []
    - rule_id: sb_custody
      applies_to: "supplier_handoff; external_retained; sealed_paint_waste"
      rule: "Only supplier_handoff and external_retained are non-characterized physical custody satellites; failed_original remains a characterized Product input. For supplier return record actual store dispatch gate/time and named supplier receiving gate/time, consignment and signed transport-responsibility party. Original goods source T continues at the signed receiving party; that change does not erase return movement. If the store provides/commissions the return, include its disjoint store-gate-to-supplier-receipt transport under cp_transport; if supplier-provided already in an evidenced supplier package, retain its source/boundary/responsible system and do not add it again. Uncovered or unknown transport responsibility blocks completeness. External retention without valid acceptance has actual named recipient/state and F/T responsibility, not automatic store waste. Actual intact cans dispatched as waste require measured full wet-carrier kg and accepted matching treatment. Responsibility transfer never creates a new physical movement."
      source_ids: []
    - rule_id: sb_complete_support
      applies_to: "operations; support_assets"
      rule: "Include actual local lighting/ventilation/electric heating, checkout/scanner, router, payment, security and administration electricity and the seven complete actual support-asset models. network_service is connectivity only by default. A genuine indivisible same-contract connection-hour package may contain payment/admin/security remote processing only when its exact service list, one unique connection-hour denominator, actual full remote operation/electricity/capital inventories and source IDs are evidenced. Otherwise use payment_processing_service, admin_ledger_service and security_retention_service for the actual remote activities, with complete actual provider inventories and disjoint source scope; local-only activity requires evidence of no remote service. These conditional rows are inactive only with signed inclusion-in-network or actual-absence proof, never assumed covered by connectivity. The original cleaning-provider inventory must expose actual water/detergent/tool/transport/wet-carrier/treatment quantities for separate cards. Any unsupported stage, constituent, overlap or service blocks complete-service use. cleaning_service is now purchased labour h only; the complete cleaning-provider inventory above is raw evidence for mandatory split_exchange_identity expansion of actual water, formulation, tools, travel and carriers, with old full-package characterization reversed."
      source_ids:
        - jrc-retail-2013
    - rule_id: sb_provider
      applies_to: "all inventory rows"
      rule: "Each background has object/model/BOM, geography, technology, original source-ID, lifecycle stages, period and exact operations. A different provider ID does not prove disjoint scope. Do not add electricity inside operating-service packages again; exclude outside transport, maintenance or end-of-life already in complete asset vectors and collection/treatment already in waste contracts. Provider gaps require actual atomic extension cards before completion. The network service excludes local powered devices/electricity; cleaning_service excludes store building and store-metered electricity."
      source_ids: []
    - rule_id: split_exchange_identity
      applies_to: "all inventory rows"
      rule: "Each card has exactly one concrete exchange identity and one reference measurement property/unit; a unit group is not a second property, and auxiliary measurements are conversion evidence only. Labour cards no longer carry bundled materials/energy/equipment/wastes. Retained complete homogeneous assets, original packaged goods and real mixed waste carriers require matching actual whole-scope background/receiver treatment and full composition; heterogeneous collections or selectors are prohibited. An original exchange enters one core card or one split source only; reverse all old package characterization when replacing it and combine only disjoint raw quantities with identical identity/property/unit. Every other actual substance, part, fuel, refrigerant, emission and treatment gap requires a named bilingual card and process protocol; unknown is never zero or complete."
      source_ids: []
