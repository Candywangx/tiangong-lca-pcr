  - rule_id: al_drivers
    applies_to: "electricity; cleaning_service"
    rule: "Allocate each disjoint source subpool c only by its fixed same-unit driver: lighting/ventilation/electric heat and premises fixed standby use occupied-and-reserved floor m2*h including closed reservation; checkout/payment active use measured service seconds; their idle and fixed/closed continuous subpools each use reserved terminal h; local router electricity active use measured data bytes; its idle and fixed/closed continuous subpools each use reserved local-device h; camera and admin active pools use measured supported task seconds, while their idle and fixed/closed continuous subpools each use reserved device h. Never add these dimensions. Connection-hour quantities use calc_network exclusively. Cleaning uses actual cleaned m2, not store sales. Allocate A_c_p=A_c_total*d_c_p/sum_all_b(d_c_b), including all actual merchandise/other beneficiaries. Positive known full denominators and parent-meter reconciliation are mandatory; unknown/zero driver with nonzero source requires investigation and subdivision, never silent zero."
    source_ids: []
  - rule_id: al_assets
    applies_to: "support_assets"
    rule: "For each homogeneous actual asset/model/BOM/scope source a keep complete disjoint lifecycle vector V_a: manufacture, installation, actual repairs, asset-related transport and retirement; exclude operation electricity already metered. Initial fraction f_a_h=e_a_h/L_a uses same-unit exposures: building/fixtures m2*h; shelf reserved shelf-volume m3*h; checkout/payment/admin/camera/router reserved device h. L is evidenced expected lifetime total across all beneficiaries; retain unused reservation and idle service. At retirement f_final_a_h=e_actual_a_h/sum_all_h(e_actual_a_h). Every lifespan, exposure, repair or vector revision replaces EVERY historical beneficiary numerator by delta_a_h=f_new_a_h*V_new_a-f_old_a_h*V_old_a. Do not charge all final repairs/transport to retirement sales or use 1-sum_old_f as an allocation shortcut. Track cumulative fractions<=1 and reconcile final sum=1. Separate model cards before aggregating; do not sum unlike devices as Item(s)."
    source_ids: []
  - rule_id: al_carton
    applies_to: "carton_input; carton_waste"
    rule: "A complete actual transport carton model includes board, seams/adhesive, printing and any attached closure. Use either the supplier whole-package vector or verified component vectors exclusively. Its manufacture and receiving transport follow first use: unused cartons and supplier returns carry unassigned source; at first opening allocate the complete source by actual original-can gross mass among all contents; reused cartons never repeat manufacture/inbound. Keep unused, previously used reusable, returned and discarded carton stock separately. carton_waste is directly weighed dispatch kg, not carton-input count times a catalog tare."
    source_ids: []
  - rule_id: al_complete
    applies_to: "all inventory rows"
    rule: "For any mandatory supplier module, accept only actual inventory with source-ID, module version, original denominator D_m, beneficiary ledger and complete covered stages. Recover raw numerator N_m_r=q_m_r*D_m only if normalized, or retain supplied raw N_m_r; apply a still-unassigned beneficiary share once, retaining already-attributed modules unchanged. Deduplicate by physical source/event/period/asset/stage, not provider name; add compatible core N_core_r and disjoint N_m_r only when exchange identity/property/unit match, then divide (N_core_r+sum_m N_m_r)/Q_p once. Keep unlike kg/MJ/m2 exchanges separate. Includes failed_original; never lose or add F twice. Missing actual cards, protocols, source field or stage blocks a complete-service claim."
    source_ids: []
  - rule_id: al_transport
    applies_to: "transportation"
    rule: "For an actually omitted independent road-transport stage admit only one verified mass-capacity-limited truck/model/provider vector per card. Record every loaded segment i, true empty segment i and stationary idle interval j with actual gates, km/h and kg payload-capacity reservation. Loaded tkm L_s=sum_i actual_source_gross_kg_s_i*distance_km_i/1000. Empty vehicle-km U_s=sum_i empty_distance_km_i*reserved_capacity_kg_s_i/sum_all_b(reserved_capacity_kg_b_i); stationary vehicle-h I_s=sum_j idle_h_j*reserved_capacity_kg_s_j/sum_all_b(reserved_capacity_kg_b_j). Measured source gross payloads reconcile to actual_payload_kg_i and must not exceed actual_available_payload_capacity_kg; reservation sums must not exceed that actual same-stage available kg capacity. Positive known all-beneficiary reservation denominators retain zero-load and idle sources. No idle distance0 denominator, empty tkm0 deletion or volume-limited route substitution. For each stage distinguish attribution_level: unassigned_vehicle, source_only and final_owner_pool under calc_transport. Source-only quantities skip vehicle allocation but still need original-source owner_fraction; only evidenced exact-final-owner/pool quantities skip that owner step; loaded-only, empty-only and idle-only vectors must be evidenced disjoint. A complete provider vector already covering those stages makes outside stage cards inactive with actual inclusion proof. Unknown inclusion or different capacity-limiting route blocks completion pending actual reviewed cards. Owner rules: original-goods inbound source follows S/F/T/O at its original receiving gate, with F_s/q_s charged to service and S excluded; original carton inbound follows the same first-use source fraction as carton manufacture, unused source remains stock; asset acquisition/repair/retirement transport belongs to that actual asset V and follows EVERY historical f_a_h and delta_a_h under al_assets, never all current/retirement Q. Waste/return transport belongs to the original event/source pool, with historical replacements for late events; supplier return gates/responsible party follow sb_custody. Exact-final-owner quantities never receive owner_fraction twice; original-source attribution alone is not final service/F/asset-history ownership. No separate stage if already in original V or provider package."
    source_ids: []
  - rule_id: al_backend
    applies_to: "payment_processing_service; admin_ledger_service; security_retention_service"
    rule: "Use one homogeneous complete actual provider service/vector per admitted service class, excluding local assets/electricity and network-contained sources. Payment request_id identifies one real authorization attempt, including each real refused/retry attempt; only an exclusive single-source attempt receives count1 directly. For a shared multi-SKU attempt allocate that ONE count by measured item-line processing seconds over all actual item lines under calc_backend; source tags alone do not establish a whole count. One exclusive homogeneous stock-ledger record event may be directly assigned; a genuine multi-source batch-event allocates its ONE event by measured record-line processing seconds across the complete batch, with distinct processing classes/vectors kept separate. Security footage exclusively protecting one evidenced source may be direct; shared capture fixes source ownership once from the actual protected area and original capture interval, including idle/reserved and all other beneficiaries. Retained bytes inherit that original capture/source/history map through every later storage interval, never current sales shares. Provider quantities already assigned to the exact final owner/pool are not multiplied again. Unknown line timing, area mapping, source denominator or full remote operation/electricity/capital inventory blocks completeness; additional services require actual named cards/protocols."
    source_ids: []
  - rule_id: split_attribution
    applies_to: "cleaning_service; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
    rule: "Prefer exclusive direct measurements. For shared cleaning events attribute each raw physical quantity by actual cleaned area-events across all beneficiaries; for maintenance use the repaired asset physical driver over all beneficiaries of the actual supported work-order cycle. Retain idle, failed, closed and zero-driver loads and their original carryover rules, never discard them using sales. New tool manufacture/retirement uses persistent lifetime ledgers and historical revision deltas; installed replacement parts are charged once to their actual maintenance event, not again as an original whole-asset acquisition. Do not reapply a share to an already-attributed source or charge terminal tools only to the retirement period. Remove any contained quantity from its old background or replace the entire package with this split; never characterize both."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_route
      process_id: "retail"
      flow_role: "service_output; failed_original; supplier_handoff; external_retained"
      record_type: "foreground ledger"
      raw_fields: "store_id; mixed_assortment_evidence; pool_id; window; SKU; batch; formulation_id; binder_type; sheen; colour; nominal_pack; seal_state; actual_BOM; receiving_net_wet_kg; actual_L; gross_kg; tare_kg; density_kg_L; temperature; actual_solids_method; excluded_activity_presence; absence_records; support_scope"
      collection_method: "Before pool entry inspect receiving and every shift for sb_route_gate; retain store assortment and route evidence. Weigh each actual lot or traceable representative homogeneous fill/tare sample with calibrated scales and uncertainty; supplier verified batch net-fill records are allowed when traceable to the same actual lot. Keep can intact during sale; destructive tare/solids tests use a separate representative QC sample outside sold IDs and retain its own fate/source. If only measured volume is used, net_wet_kg=actual_L*density_kg_L at matching batch/temperature; nominal3.79L is a SKU label only. Solids/density may describe comparability but never convert the service to dry-film mass or derive releases."
      unit: "Item(s); kg; L; kg/L; degC"
      frequency: "Entry and every shift; every batch/configuration change"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "Assigned store and all admitted stock"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed observations; calibrated-scale records; batch fill/BOM evidence; route and absence register"
    - protocol_id: cp_sales
      process_id: "retail"
      flow_role: "service_output; failed_original; supplier_handoff; external_retained"
      record_type: "foreground ledger"
      raw_fields: "pool_id; original_can_id; source_id; q_s; V_s; S_s; F_s; T_s; O_s; receipt_id; receipts; physical_customer_returns; all_gross_customer_handovers; supplier_handoffs; internal_transfers; event_id; actual_event_date; gross_handover; physical_return; final_valid; refusal; revocation; financial_adjustment; recipient_id; seal_state; supplier_handoff; store_dispatch_gate; store_dispatch_time; supplier_receiving_gate; supplier_receipt_time; return_consignment_id; transport_responsibility_party; signed_return_contract; N_supplier_physical; N_external_unaccepted_physical; opening_goods; closing_goods; internal_transfer; condemnation_event_id; condemnation_count; confirmed_missing_count; signed_unresolved_count; old_version; new_version; numerator_correction; Q_p"
      collection_method: "Scan original-can IDs at each custody/acceptance event; record receipt lot and evidence-backed whole-source supplier vector through the same receiving gate. Review final state after declared return observation cutoff, retain later reopening. Execute vr_acceptance, vr_balance and sb_original_sources; do not infer physical return from refund or failure from a discount. Source state replacement keeps original IDs and historical dates."
      unit: "Item(s); kg"
      frequency: "Every event; pool closure and every late revision"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "All actual can sources and external recipients; not just successful sales"
      aggregation_rule: "per reference flow"
      quality_evidence: "POS acceptance evidence; signed recipient records; stock counts; supplier actual complete source inventory"
    - protocol_id: cp_operations
      process_id: "operations"
      flow_role: "electricity; network_service"
      record_type: "foreground ledger"
      raw_fields: "source_id; module_version; period; meter_id; parent_meter_id; submeter_id; E_kWh_c_total; d_c_p; d_c_b; driver_unit; active_idle_fixed; reserved_area_m2; reserved_h; task_seconds; bytes; connection_id; interval_id; start_i; end_i; h_i; reserved_connection_h_i_p; reserved_connection_h_i_b; h_i_p; provider_attributed_connection_h; network_mode; same_contract_id; remote_service_list; remote_inventory_source_ids; remote_capital_scope; provider_attributed; area_m2_event; cleaned_area_event_p; cleaned_area_event_b; share_event_p; water_kg; V_discharge; rho_discharge; water_meter_id; detergent_formulation_id; detergent_origin_kg; tool_model; wet_carrier_kg; receiver; treatment_scope; cleaning_provider_inventory; network_provider_inventory; Q_p"
      collection_method: "Read calibrated meter start/end data and circuit inclusion diagrams; separately measure active/idle/fixed source subpools and all beneficiaries under al_drivers, including closed reservations. For connectivity log unique connection IDs and disjoint real start/end intervals including idle/fixed reservation; collect all same-interval beneficiary reservations and execute calc_network once. Do not recreate hours by electricity activity mode. Inspect actual signed same-contract service list, one common connection-hour denominator and full remote operation/electricity/capital inventories. Mere internet access/fee does not prove backend coverage; apply sb_complete_support and cp_backend for uncovered actual remote services. For every actual cleaning event verify signed cleaned area and complete provider raw inventory: inlet water meter/actual density, exact detergent wet-origin mass, tools, disjoint wet-carrier dispatch and treatment. Supplier method must conserve original detergent-origin kg by mutually exclusive FINAL used/rinsed/retained/dispatched-container-residue destinations: intermediate used-to-rinsed/retained is a replacement of state, never quantities added twice. Keep original formulation-origin kg separate from complete wet-carrier kg; import meter excludes internal reuse already. Direct wastewater=measured actual V_discharge*rho_discharge without stock/evaporation deductions. No unknown chemical/emission is silently omitted. If provider cannot supply complete verified quantities, actual atomic extension is mandatory under vr_completeness."
      unit: "kWh; h; s; bytes; m2; kg"
      frequency: "Meter interval and each service event; pool reconciliation"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "All site electricity and actual network/cleaning provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; complete source reconciliation; signed full provider inventory; exact detergent identity and carrier acceptance"
    - protocol_id: cp_assets
      process_id: "support_assets"
      flow_role: "building_asset; shelf_asset; checkout_asset; router_asset; payment_asset; camera_asset; admin_asset"
      record_type: "foreground ledger"
      raw_fields: "asset_id; source_id; model; BOM; scope; period; beneficiary_id; exposure_unit; e_a_h; L_a; e_actual_a_h; f_a_h; f_old_a_h; f_new_a_h; V_old_a; V_new_a; N_asset_a_p; delta_a_h; manufacture; installation; repair_event_id; transport_event_id; retirement_event_id; provider_inclusions; original_history_version; Q_p"
      collection_method: "Inventory every actual building/fixed fixture and model/serial device. Verify complete source V by signed model/BOM/stage inventories, including repairs/transport/EOL and excluded operational electricity. Geometric survey and reserved-hour logs measure al_assets exposure across EVERY actual beneficiary. Record evidence-based L and update complete history at each revision and actual retirement. Use the same historical asset fractions for its independent transport/repair/EOL, not retirement-period Q. A contained complete component is not another input or terminal waste. Unknown missing model or lifecycle stage blocks completion; reconstruct actual atomic stage cards and project them before use."
      unit: "Item(s); m2*h; m3*h; h"
      frequency: "Every reserved interval, asset event and lifetime revision"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "All seven actual support asset model sources and all historical beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset/source register; signed complete model inventory; measured geometry; exposure and final-life reconciliation"
    - protocol_id: cp_carton
      process_id: "cartons"
      flow_role: "carton_input"
      record_type: "foreground ledger"
      raw_fields: "source_id; carton_model; actual_BOM; n_carton_source; first_use_id; paint_gross_kg_contents; gross_kg_contents; unused_open; unused_close; used_open; used_close; supplier_return; transfer; discard; inbound_source; Q_p"
      collection_method: "Count actual complete carton models and record supplier whole-package or verified component vector exclusively. Weigh original contents on calibrated scales at first use; keep source assignment and unused versus used stock through reuse/return. Reconcile actual cartoning and absence separately; supplier included original can packaging is not this transport carton."
      unit: "Item(s); kg"
      frequency: "Each receipt, first use, reuse and return"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "Actual carton sources and every original contents beneficiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete package BOM; calibrated contents weights; first-use genealogy and stock reconciliation"
    - protocol_id: cp_waste
      process_id: "residual"
      flow_role: "sealed_paint_waste; carton_waste"
      record_type: "foreground ledger"
      raw_fields: "waste_mode; dispatch_id; source_id; original_can_id; condemnation_event_id; carrier_state; receiver_id; accepted_constituents; treatment_scope; collection_transport_included; current_gross_kg; current_tare_kg; condemned_kg; direct_source_net_kg_w_p; gross_kg_w; tare_kg_w; carrier_net_kg_w; current_carrier_net_kg_w_p; current_carrier_net_kg_w_b; share_w_p; provider_attributed_net_kg; opening_waste_kg; closing_waste_kg; actual_dispatch_kg; confirmed_missing_waste_kg; signed_unresolved_waste_kg; Q_p"
      collection_method: "At every actual condemnation scan original_can_id/condemnation_event_id and weigh the full current wet can on a calibrated scale, removing only external weighing-container tare; retain individual current_gross_kg/current_tare_kg and sum condemned_kg, independently of condemnation_count. Separately count goods and weigh held waste at opening/closing. At dispatch select and document one calc_waste mode per source/consignment: direct source-separated net weighing first; otherwise actual current homogeneous whole-carrier source kg with complete all-source reconciliation; already-attributed net kg unchanged. Preserve calibration, receiver net receipt, missing-waste investigation and signed residual. Obtain exact wet-formulation/full-package or carton state acceptance and treatment inventory. Different states/compositions are never pooled under one flow. Collection transport already inside the actual treatment package is QA only; independent omissions execute al_transport/calc_transport and cp_transport before completeness. No inferred recycling credit or second stock deduction."
      unit: "kg"
      frequency: "Each actual dispatch and pool stock count"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "Actual held waste and accepted treatment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weighbridge/scales; signed receiver consignment and treatment inventory; actual state photos support but do not replace acceptance"
    - protocol_id: cp_completion
      process_id: "retail"
      flow_role: "service_output; failed_original; supplier_handoff; external_retained"
      record_type: "foreground ledger"
      raw_fields: "source_id; module_version; exchange_id; flow_type; property; unit; N_core_r; N_m_r; q_m_r; D_m; delta_a_h; all_beneficiary_driver; attributed_status; stage; period; overlap_event_ids; Q_p"
      collection_method: "Read each actual module original inventory and source bindings; apply al_complete/calc_complete at source level. This retail protocol is the integration view of the same operations/assets/carton/waste source records, not a second collection or another process. Each added module card must have its own real process protocol. Verify all mandatory scope in sb_complete_support, including remote payment/security/admin support, before completeness."
      unit: "row-specific original units"
      frequency: "Each module version, pool closure and history replacement"
      temporal_coverage: "Full prospective pool, including returns and all historical corrections"
      site_scope: "All actual suppliers and core sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original inventories; full provenance; overlap map; actual parsed card/protocol coverage"
    - protocol_id: cp_backend
      process_id: "operations"
      flow_role: "payment_processing_service; admin_ledger_service; security_retention_service"
      record_type: "foreground ledger"
      raw_fields: "request_id; request_source_id; request_owner_mode; pay_line_start; pay_line_end; pay_line_id; pay_line_original_pool_id; pay_line_seconds_r_p; pay_line_seconds_r_b; pay_share_r_p; event_id; event_source_id; ledger_owner_mode; ledger_line_start; ledger_line_end; ledger_record_id; ledger_line_original_pool_id; ledger_line_seconds_e_p; ledger_line_seconds_e_b; admin_share_e_p; processing_class; capture_owner_mode; capture_source_evidence; capture_cohort_id; capture_start_k; capture_end_k; capture_h_k; protected_polygon_id; protected_area_m2_k_p; protected_area_m2_k_b; exclusive_protected_area_m2_k_p; common_protected_area_m2_k; reserved_protected_footprint_m2_k_p; reserved_protected_footprint_m2_k_b; capture_share_k_p; source_id; origin_pool_id; capture_history_version; retained_bytes_i_k; retention_interval_id; retention_h_i; provider_attributed_request_count; provider_attributed_event_count; provider_attributed_GBh; provider_final_owner_pool_id; network_contained; Q_p; module_version; provider_id; service_class; same_contract_id; absence_evidence; request_time; request_result; event_time; retention_start_i; retention_end_i; remote_operation_inventory; remote_electricity_inventory; remote_capital_inventory; original_denominator; excluded_local_scope; overlap_source_ids"
      collection_method: "For each actual remote contract retain complete operation/electricity/capital inventories, homogeneous processing class and original denominator. Inspect whether each real payment attempt is exclusive or shared; measure every item-line processing start/end in seconds, retain line IDs and original pool IDs, and reconcile all allocated shares to that one attempt including refused/retries. For a stock-ledger single-record event establish sole ownership; for a real homogeneous batch-event measure each actual record-line processing seconds, retain the complete batch membership and allocate one event under calc_backend, not count1 per tag. Zero or missing shared timing blocks completeness. Survey camera protection polygons and original capture-period beneficiary footprints/reservations, including shared zones, other beneficiaries and idle reservations; reconcile disjoint mapped area to the whole polygon. Freeze capture cohort/source/original-pool fractions and history before retention. Measure actual retained bytes by capture cohort at each state change and exact disjoint retained hours; retain source genealogy through deletion/re-encoding and later intervals. Do not use transmitted-but-unstored bytes or recalculate owners using current sales. Provider already-final-owner quantities require exact pool/source/allocation-version evidence and are not multiplied again. Corrections replace original historical source allocations. Signed same-network-package inclusion or real route absence can deactivate a row; otherwise missing remote LCI/identity/scope blocks completeness."
      unit: "Item(s); s; m2; bytes; h; GB*h"
      frequency: "Each actual request/event and every retention-state interval"
      temporal_coverage: "Full pool plus remote source lifetime/period coverage"
      site_scope: "Actual remote provider and all source-tagged beneficiary events"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed complete provider inventory; source-tagged logs; overlap map and original denominator"
    - protocol_id: cp_transport
      process_id: "transportation"
      flow_role: "loaded_transport; empty_transport; idle_transport"
      record_type: "foreground ledger"
      raw_fields: "transport_source_id; provider_id; truck_model; mass_capacity_limited_evidence; actual_available_payload_capacity_kg; source_id; source_owner_mode; origin_pool_id; stage_mode; attribution_level; attribution_evidence; original_source_id; owner_pool_id; owner_responsibility_class; owner_allocation_version; final_owner_loaded_p; final_owner_empty_p; final_owner_idle_p; provider_attributed_loaded_tkm; provider_attributed_empty_vehicle_km; provider_attributed_idle_vehicle_h; segment_id; actual_origin_gate; actual_destination_gate; dispatch_time; signed_receipt_time; responsibility_party; actual_source_gross_kg_s_i; actual_payload_kg_i; distance_km_i; empty_distance_km_i; reserved_capacity_kg_s_i; reserved_capacity_kg_b_i; idle_interval_id; idle_h_j; reserved_capacity_kg_s_j; reserved_capacity_kg_b_j; included_stage_source_ids; original_source_q_s; F_s; carton_first_use_fraction_s_p; unused_source_stock; asset_id; e_a_h; L_a; f_a_h; f_old_a_h; f_new_a_h; V_old_a; V_new_a; delta_a_h; event_source_fraction_s_p; owner_fraction_s_p; L_s; U_s; I_s; N_loaded_p; N_empty_p; N_idle_p; history_version; Q_p"
      collection_method: "Obtain actual disjoint provider stage inventory and real gate/consignment/telematics records. Collect calibrated source/payload kg, verified segment km, stationary elapsed idle h with energy/fuel retained, and all-beneficiary same-kg capacity reservations under al_transport. For every source/stage record read provider attribution evidence: unassigned_vehicle needs the vehicle allocation; source_only identifies actual original_source_id and skips that allocation but still follows its F/carton/asset-history/event owner fraction; final_owner_pool requires exact original_source_id, owner_pool_id, responsibility class and allocation-version proof, and skips both already-completed steps. Never infer final-owner status from a consignment or original source ID alone. Preserve stage units and original owner/history, and execute calc_transport. Revalidate/replace all final-owner historical asset receipts at each lifespan/vector revision/retirement or reconstruct source-level history; no second f and no retirement-only charge. Included complete-provider/V stages are QA only. Supplier returns retain actual store dispatch/supplier receipt gates and signed transport party. Asset stage construction is not a parallel addition beside V containing it. Unknown capacity, scope or attribution blocks completeness."
      unit: "kg; km; h; t*km; vehicle*km; vehicle*h"
      frequency: "Every segment, empty trip, stationary interval and source/history revision"
      temporal_coverage: "All original source/event pools and asset historical beneficiaries"
      site_scope: "Actual gates, truck model and all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weights; verified trip/time logs; signed gate receipt and responsibility; exact stage/provider inventory"
    - protocol_id: cp_split_labour_operations
      process_id: "operations"
      flow_role: "cleaning_service"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
    - protocol_id: cp_split_support
      process_id: "split_support"
      flow_role: "split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
  calculation_rules:
    - id: calc_service
      applies_to: "service_output"
      rule: "Q_p=count(distinct final_valid original_can_id); service_output=Q_p/Q_p=1 Item(s) when Q_p>0."
      inputs:
        - original_can_id
        - final_valid
        - pool_id
        - cp_sales
      output: "service_output"
      source_ids: []
    - id: calc_source
      applies_to: "failed_original"
      rule: "N_F=sum_s F_s; failed_original=N_F/Q_p. Each F_s original can carries its own complete original source V_s once; retain S_s/F_s/T_s/O_s and actual source-equivalent count, not count multiplied by package nominal mass."
      inputs:
        - q_s
        - S_s
        - F_s
        - T_s
        - O_s
        - V_s
        - Q_p
        - cp_sales
      output: "failed_original"
      source_ids: []
    - id: calc_custody
      applies_to: "supplier_handoff; external_retained"
      rule: "supplier_handoff=N_supplier_physical/Q_p; external_retained=N_external_unaccepted_physical/Q_p. These are disjoint actual state/event IDs, not T or F responsibility counts."
      inputs:
        - N_supplier_physical
        - N_external_unaccepted_physical
        - Q_p
        - cp_sales
      output: "custody satellite quantities"
      source_ids: []
    - id: calc_energy
      applies_to: "electricity"
      rule: "E_p=sum_c E_kWh_c_total*d_c_p/sum_all_b(d_c_b); electricity=3.6*E_p/Q_p MJ. Subtract a submeter only from a parent that actually includes it; retain direct disjoint meters without subtraction."
      inputs:
        - E_kWh_c_total
        - d_c_p
        - d_c_b
        - parent_meter_id
        - submeter_id
        - Q_p
        - cp_operations
      output: "electricity"
      source_ids: []
    - id: calc_network
      applies_to: "network_service"
      rule: "For one actual homogeneous connection-hour provider vector, deduplicate connection_id and disjoint interval i: h_i=(end_i-start_i) in h. Each real connection interval appears once, including idle/fixed reservation. Allocate h_i_p=h_i*reserved_connection_h_i_p/sum_all_b(reserved_connection_h_i_b); N_net_p=sum_i h_i_p; network_service=N_net_p/Q_p. Reservations are recorded for all actual beneficiaries in the same interval and denominator is positive/known. Active/idle/fixed electricity subpools do not create extra connection hours; byte/task drivers never allocate this h quantity. Already-attributed connection h are used directly with reservation evidence as QA. Distinct vectors/contracts or overlapping distinct services need separate actual cards; no summing unlike complete-service h vectors."
      inputs:
        - connection_id
        - interval_id
        - start_i
        - end_i
        - h_i
        - reserved_connection_h_i_p
        - reserved_connection_h_i_b
        - h_i_p
        - provider_attributed_connection_h
        - network_mode
        - Q_p
        - cp_operations
      output: "network_service"
      source_ids: []
    - id: calc_cleaning
      applies_to: "cleaning_service"
      rule: "Record actual purchased labour h per event and attribute it once by the original cleaned_area_event_p/sum_all_b(cleaned_area_event_b) driver; area is not labour quantity. Attribute each raw physical quantity independently under cp_split_support and reverse the old complete cleaning package; cleaning_service=attributed labour h/Q_p. Normalize once with c_split_quantity, without a full-package background or duplicate store electricity."
      inputs:
        - measured_purchased_labour_h_event
        - cleaned_area_event_p
        - cleaned_area_event_b
        - Q_p
        - cp_split_labour_operations
      output: "cleaning_service h per reference flow"
      source_ids: []
    - id: calc_asset
      applies_to: "building_asset; shelf_asset; checkout_asset; router_asset; payment_asset; camera_asset; admin_asset"
      rule: "For each a and original beneficiary h: f_a_h=e_a_h/L_a; N_asset_a_p=sum_h_in_p f_a_h for one homogeneous complete asset source. At retirement use e_actual_a_h/sum_all_h(e_actual_a_h); replace all historical vector allocations by delta_a_h=f_new_a_h*V_new_a-f_old_a_h*V_old_a. Each asset card=N_asset_a_p/Q_p Item(s); preserve actual vector deltas for calc_complete."
      inputs:
