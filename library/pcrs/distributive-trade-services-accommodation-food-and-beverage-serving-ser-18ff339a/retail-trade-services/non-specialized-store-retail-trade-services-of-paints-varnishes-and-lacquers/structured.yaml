    - id: calc_waste
      applies_to: "sealed_paint_waste; carton_waste"
      rule: "For each actual consignment w and one identical accepted carrier/state r, use direct source-separated calibrated net weighing first: N_waste_r_p=sum_w direct_source_net_kg_w_p. Only if the SAME real homogeneous carrier is shared and unassigned: carrier_net_kg_w=gross_kg_w-tare_kg_w; share_w_p=current_carrier_net_kg_w_p/sum_all_b(current_carrier_net_kg_w_b); N_waste_r_p=sum_w carrier_net_kg_w*share_w_p. current_carrier_net_kg is measured for each original-source portion in its current complete wet-carrier state, same consignment/time, and sums to carrier_net_kg_w. Already-attributed provider net kg are used unchanged; allocation evidence becomes QA only. These three modes are exclusive per source/event, and waste_r=N_waste_r_p/Q_p. Original can counts, dry solids and previous-state mass never substitute for this current-carrier share. Different compositions/states need separate matched cards/consignments. Stock balances under vr_balance are independent QA, not another correction of directly measured dispatch."
      inputs:
        - waste_mode
        - dispatch_id
        - receiver_id
        - direct_source_net_kg_w_p
        - gross_kg_w
        - tare_kg_w
        - carrier_net_kg_w
