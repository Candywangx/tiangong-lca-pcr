        - N_m_r
        - q_m_r
        - D_m
        - source_id
        - module_version
        - delta_a_h
        - Q_p
        - cp_completion
      output: "q_final_r"
      source_ids: []
    - id: calc_backend
      applies_to: "payment_processing_service; admin_ledger_service; security_retention_service"
      rule: "For each distinct request attempt r, exclusive single-source pay_share_r_p=1 for its sole original pool; otherwise pay_share_r_p=pay_line_seconds_r_p/sum_all_b(pay_line_seconds_r_b), where each line seconds=pay_line_end-pay_line_start, summed by its original pool; each measured item-line is mapped once and all lines are included. N_pay_p=sum_r pay_share_r_p. For each distinct actual ledger event e, exclusive single-record admin_share_e_p=1; a homogeneous multi-source batch-event uses admin_share_e_p=ledger_line_seconds_e_p/sum_all_b(ledger_line_seconds_e_b), where each actual record-line seconds=ledger_line_end-ledger_line_start is summed by original pool, and N_admin_p=sum_e admin_share_e_p. Each shared denominator must be known positive, sum_all_p(pay_share_r_p)=1 and sum_all_p(admin_share_e_p)=1; all-pool counts reconcile to real requests/events, not number of source tags. Keep different processing classes/vectors separate. At original capture cohort k, exclusive protection has capture_share_k_p=1; shared protection uses capture_share_k_p=protected_area_m2_k_p*capture_h_k/sum_all_b(protected_area_m2_k_b*capture_h_k). Survey the actual camera protection polygon and original beneficiary footprint/reservation map: disjoint dedicated zones use actual area; common protected zones split once by those original beneficiaries measurable reserved protected-footprint m2, including other goods, operations and idle reservation; Use protected_area_m2_k_p=exclusive_protected_area_m2_k_p+common_protected_area_m2_k*reserved_protected_footprint_m2_k_p/sum_all_b(reserved_protected_footprint_m2_k_b); common-zone denominator must be positive/known. Resulting area shares reconcile to the actual whole protected polygon without double-counting overlap. Freeze capture_share_k_p with original source_id/origin_pool_id and capture_history_version; later byte changes inherit it. N_video_p=sum_i sum_k(retained_bytes_i_k/1e9)*retention_h_i*capture_share_k_p in GB*h for disjoint actual retention intervals. Never allocate later retained GB*h again by current sales or current protected area. Evidence-backed already-final-owner provider request/event counts or GB*h are used unchanged; their allocation logs are QA only. Revisions replace the original historical pool/source mapping rather than charge a new pool. Network-contained sources are not added. Each service quantity divides Q_p once."
      inputs:
