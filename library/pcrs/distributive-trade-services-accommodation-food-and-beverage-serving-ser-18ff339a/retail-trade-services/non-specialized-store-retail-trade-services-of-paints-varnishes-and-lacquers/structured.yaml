  data_quality_requirements:
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Calibrate scales/meters and record units, time coverage, uncertainty, missing records and actual source boundaries; unknown quantities remain unresolved. No invented fill, lifetime, emission or zero default."
      evidence: "Calibration certificates; complete raw interval/source records"
    - id: dq_translation
      applies_to: "all inventory rows"
      requirement: "Keep identical ordered row/rule/protocol IDs, direction/type, UUIDs, units, formula variables, conditions and obligation strength in both languages; every mandatory formula input and protocol process/flow_role must parse."
