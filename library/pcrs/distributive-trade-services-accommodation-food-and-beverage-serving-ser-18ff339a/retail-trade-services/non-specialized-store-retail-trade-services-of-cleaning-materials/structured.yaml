allocation_rules:
  - rule_id: pool_allocation
    applies_to: "core_electricity; cleaner_pack; wash_water; dry_wipe; rinsate; wet_wipe; used_bottle"
    rule: "Prefer disjoint direct meters and event subdivision. Allocate each measured same-unit source pool X_c separately: X_ch=X_c*d_ch/sum_all_h(d_ch). Active equipment uses measured occupied device seconds; idle/fixed device electricity uses actual reserved equipment seconds including closed/failed/zero-sale reservations; fixed physical facility sources use surveyed served-area*m2 time h. Do not add these drivers or create one mixed driver. Split measured active/idle/fixed source numerators first and reconcile their sum to the parent in its own unit. An independent disjoint meter is not subtracted again; subtract a child only from a parent that physically includes it. Same-configuration prospective pool retains failed and zero-output cohorts. Zero total driver or Q=0 is unnormalizable, never discarded. Hygiene direct spill events follow their origin pool; actual shared tray washing uses measured wetted tray area m2 within that washing batch, with all beneficiaries retained."
    source_ids:
      - ghg-product
  - rule_id: asset_lifetime
    applies_to: "retail; hygiene"
    rule: "For each actual homogeneous asset/model/BOM/scope vector V_a separately, manufacturing/installation exposure e_ah/L_a uses occupied plus reserved device h for checkout/ICT/camera, measured occupied shelf-volume m3*h for shelving, served floor m2*h for building/lighting/fans, and measured cumulative cleaned wetted m2 for reusable spill trays; same-unit lifetime L_a includes all historical/current/future beneficiaries and empty reservations. Keep manufacture, operation, repair and EOL disjoint. At revised life/vector replace EVERY prior beneficiary amount with f_new_ah*V_new_a and record delta=f_new_ah*V_new_a-f_old_ah*V_old_a; at final retirement f_final_ah=e_actual_ah/sum_all_h(e_actual_ah). Residual1-sum_old_f is QA only, never all charged to retirement period. Separate repair and asset transport/EOL sources first belong to the asset then follow those SAME historical fractions/version replacements once. Whole terminal-device net weight and BOM reconstruction are exclusive; direct net weight already excludes removed parts. Whole packages containing repair/transport/EOL exclude duplicate modules. Cumulative finalized fractions sum1; provisional fractions must not exceed1."
    source_ids: []
  - rule_id: digital_events
    applies_to: "retail"
    rule: "Payment authorizations and administrative batches are unique original events; allocate their measured processing time to actual source-line work shares w_eh=t_eh/sum_all_h(t_eh), sum_h(w_eh)=1, including declined attempts/failed/other-SKU lines; no basket event is charged fully to every SKU. Admin employee source h uses measured task h; reserved idle employee h uses actual roster-reserved beneficiary h. Network active sources use measured transferred bytes; device idle/fixed sources use unique reserved device h. Retain provider connection source-hours connection_source_h in the unique actual nonoverlapping connection_interval_id ledger with its own evidenced measured denominator, not additional electricity. For each original source interval assign to this SKU/pool by connection_share_h=reserved_endpoint_connection_s_h/sum_all_h(reserved_endpoint_connection_s_h), the measured reserved endpoint-connection seconds of ALL beneficiaries; shares sum1 including empty reservations and failed events, without duplicate endpoint/interval seconds. Multiply actual source-hours by that share once; skip this owner reassignment only with exact final owner_id/pool_id/version evidence exact_final_owner_pool_version, not merely provider-level or connection-level attribution. Zero total seconds or unknown coverage blocks completeness. Camera capture source map is frozen at original capture: actual timestamped field-of-view disjoint beneficiary footprint m2*coverage h including empty reservations and all beneficiaries, mutually exclusive zone/time cells. Actual byte*h retention carries that original capture map, never current sales. Record original source/pool/map/version; GB=10^9 bytes and GiB=2^30 bytes, convert explicitly. No mixed bytes+h+tasks driver."
    source_ids: []
  - rule_id: transport_ownership
    applies_to: "retail; hygiene"
    rule: "For each actual trip segment t first assign source s by actual occupied mass kg share only where signed capacity records prove mass-limited carriage and volume nonbinding; volume m3 share only where volume binds and mass is nonbinding. Otherwise unknown/dual constraint blocks this method pending reviewed matching transport method. Preserve vehicle class, actual load/capacity units, route/distance, mass/volume, stationary idle duration h and all consignments. Allocate empty returning vehicle-km by measured reserved cargo-capacity*time per beneficiary for that actual segment; stationary idle fuel/service by reserved capacity*actual idle h; zero laden t*km never erases these. Next assign each actual source to final owner/pool/version by F share, cleaner first-use share or historical asset fraction. attribution_level=consignment skips only trip allocation; only exact final owner/pool/version evidence skips owner attribution. Verify provider covers actual empty/idle legs and included fuel/maintenance; add disjoint vehicle-km/idle-h source cards if absent, never overlap the loaded service."
    source_ids: []
  - rule_id: consumable_sources
    applies_to: "retail; hygiene"
    rule: "For each actual homogeneous paper/label/case/film/wipe-wrap source separately, measure net first-used material quantity x_use_s (paper includes its real coating and excludes separately measured core/wrapping). Assign its manufacturing plus inbound source to that first-use event/pool once; unused stock/returns/transfers carry unassigned original source, reuse never repeats manufacture/inbound. Printed intermediate stock retains BOTH original paper and measured printing-source responsibility with original source IDs/pool/version; later withdrawal replaces original allocations rather than charging twice. Where one actual material event serves several lines, assign measured material area/mass portions within that same homogeneous source with shares summing1. Record source and destination stock independently; directly measured dispatched waste kg is not corrected by stock again. Actual mixed carrier requires signed receiver constituent/state acceptance under state_gate; separately dispatched components remain disjoint."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "failed_original; service_output; customer_pack; supplier_pack; transfer_pack; external_pack; failed_bottle"
      record_type: "event_stock_source"
      raw_fields: "initially_accepted_handover_count; never_accepted_at_handover_count; raw_X_r; attributed_X_r; pool_id; original_id; supplier_source_id; lot; SKU; complete_BOM; label; seal; actual_fill_kg; tare_kg; gross_handover_id; physical_return_id; acceptance_id; final_acceptance; cutoff; return_link; prior_version; version; Q; owner_id; S; F; T; O; N_F; N_S; V_s; attribution_level; G_open; receipts; physical_customer_returns; gross_customer_handover; supplier_handover; internal_handover; condemnation_count; confirmed_missing_count; signed_goods_residual; W_open; condemned_actual_kg; other_waste_received_kg; dispatched_actual_kg; confirmed_missing_waste_kg; signed_waste_residual; receiver_state; inspection; scale_id; calibration"
      collection_method: "Trace unique original pack and source through receipts/scans/returns; weigh actual lot fill and full package/component BOM by traceable calibrated scales, supplier signed vector/scope and receiving documents; no catalog-tare default. Count event IDs and directly weigh each dispatched waste consignment; inspect intactness every shift and each incident. Follow service_count, physical_ledgers, failed_source and source_ownership; raw receipts are QA, not another characterized manufacture input. Final amounts per reference flow; keep zero-sale cohorts."
      unit: "Item(s); kg"
      frequency: "Every event, shift inspection, closing reconciliation and late correction"
      temporal_coverage: "Entire declared period including closed/failed/late corrections"
      site_scope: "Actual store and named provider original sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales/count scans, supplier vectors and labels, signed recipient/acceptance/revocation, daily inspection, full historical version links; unknown blocks completeness."
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "core_electricity"
      record_type: "meter_source"
      raw_fields: "X_c; d_ch; raw_X_r; attributed_X_r; pool_id; source_id; meter_start; meter_end; meter_boundary; active_kWh; idle_kWh; fixed_kWh; occupied_device_s; reserved_device_s; all_beneficiaries; parent_child_map; calibration; version"
      collection_method: "Read dedicated stock/checkout circuit meters at consistent boundaries; log intervals and measured active/idle/fixed splits, occupied and reserved equipment seconds. Verify parent topology and meter calibration; do not infer watts from nameplates. Apply pool_allocation then direct_quantities; raw X_electricity remains kWh before final per reference flow."
      unit: "kWh; s"
      frequency: "Each meter interval, all open/closed shifts"
      temporal_coverage: "Entire declared period including closed/failed/late corrections"
      site_scope: "Actual store and named provider original sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Full all-beneficiary same-unit sum=parent; nonoverlap proof and uncertainty; unknown coverage blocks."
    - protocol_id: cp_hygiene
      process_id: "hygiene"
      flow_role: "cleaner_pack; wash_water; dry_wipe; rinsate; wet_wipe; used_bottle"
      record_type: "cleaning_source_carrier"
      raw_fields: "X_c; d_ch; raw_X_r; attributed_X_r; pool_id; source_id; bottle_initial_seal_state; first_open_at; damaged_at; cutoff_state; state_transition_id; source_measurement_id; measured_source_portion_id; retained_origin_kg; source_class; source_original_id; failed_original_parent_id; janitorial_original_id; first_open_id; complete_BOM; first_open_count; m_src_j; retained_unused; retained_wipe; retained_bottle; dispatched_bottle_residue; dispatched_wipe_origin; dispatched_rinsate_origin; verified_species_transfer; source_residual; water_volume; rho_actual; temperature; discharge_mode; direct_net_kg; first_use_mass; wetted_tray_m2; all_beneficiaries; spill_goods_original_id; dry_wipe_composition; actual_soil_kg; wet_carrier_id; receiver_state; calibration; version"
      collection_method: "Inspect and record each bottle initial seal, first opening, damage and cutoff state; under cleaning_origin assign each original source measurement ID/portion uniquely to retained_unused or retained_bottle, replacing the old record on each state transition. Identify merchandise-spill and janitorial original sources independently; independently receive janitorial packs; weigh first-opening source liquid and actual dose transfers; retain source-origin assay/tracer/validated transfer records for exclusive destinations. Weigh dry first-use cellulose wipes; meter entrance water with actual density/temperature. Directly weigh whole discharge liquid and wet carriers (or exclusive direct liquid volume*density); never reconstruct liquid from supply balance. Survey actual wetted tray area in shared batches; inspect absence/presence each shift and incident. Apply cleaning_origin, direct_quantities, pool_allocation and state_gate. Separate origin kg from wet kg and full-pack Count; all final card quantities per reference flow."
      unit: "Item(s); kg; m3; kg/m3; m2"
      frequency: "Each opening/dose/washing/dispatch, daily stock, late correction"
      temporal_coverage: "Entire declared period including closed/failed/late corrections"
      site_scope: "Actual store and named provider original sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/meter calibration and blanks, measured moisture/density/soil, signed receiver actual-constituent acceptance and complete treatment, source/stock reconciliation; unknown is not zero."
    - protocol_id: cp_modules
      process_id: "retail"
      flow_role: "core_electricity; failed_original"
      record_type: "completion_extension"
      raw_fields: "X_c; d_ch; all_beneficiaries; source_amount_e; trip_amount; source_share; owner_share; original_source_id; raw_X_r; attributed_X_r; x_use_s; material_source_id; first_use_event; unused_stock; printed_WIP; original_print_source; measured_material_portions; cleaned_wetted_m2_lifetime; function_register; actual_presence; signed_absence; source_id; constituent_scope; event_id; time; asset_id; lifecycle_stage; exchange_identity; property; unit; boundary; N_core_raw_r; N_external_raw_r; z_external_r; D_original_r; Q; owner_id; pool_id; version; V_a; e_ah; L_a; e_actual_ah; f_old_ah; f_new_ah; V_old_a; V_new_a; historical_pool; delta; served_m2h; occupied_m3h; reserved_device_h; task_h; roster_reserved_h; authorization_id; t_eh; w_eh; network_bytes; connection_source_h; reserved_endpoint_connection_s_h; all_connection_beneficiaries; connection_interval_id; exact_final_owner_pool_version; connection_interval; capture_map; field_of_view; zone_time; capture_m2h; retained_byteh; GB_or_GiB; trip_id; segment_id; capacity_kg; capacity_m3; actual_mass_kg; actual_volume_m3; capacity_binding_evidence; route_km; empty_vehicle_km; stationary_idle_h; reserved_capacity_time; attribution_level; original_denominator; provider_inclusions; species_control_volume"
      collection_method: "Survey functions and actual equipment/contracts with signed custodian; measure sources with calibrated meters/scales/timers, instrument byte and camera retention logs, survey area/volume/capture footprints with timestamps; obtain actual provider scope/vector and all historical beneficiaries, trip capacity and loaded/empty/idle records. For each unique connection interval collect actual provider source h and denominator; use calibrated synchronized clocks, endpoint connection logs and reservations to collect all-beneficiary reserved connection seconds including empty/failed reservations, deduplicating and reconciling each endpoint/interval; verify exact_final_owner_pool_version before omitting owner reassignment. Install real extension cards and their own one-process protocol views before completeness; cp_modules is a core audit view, not a fictitious module exchange. Follow module_completion, pool_allocation, asset_lifetime, digital_events, transport_ownership and completion_aggregation; retain raw original unit and denominator, then final per reference flow once."
      unit: "Each original source unit separately; connection source h; reserved endpoint-connection s"
      frequency: "Continuous operational intervals, each asset revision/event/trip, every original pool correction"
      temporal_coverage: "Entire declared period including closed/failed/late corrections"
      site_scope: "Actual store and named provider original sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed scope/exclusion matrix, calibration, full historical exposures, all-beneficiary totals, frozen capture map and capacity constraint proof; unknown or unsupported source blocks complete SERVICE."
  calculation_rules:
    - id: service_count
      applies_to: "service_output"
      rule: "Q=count distinct original IDs with final-valid qualified acceptance at cutoff, after linked late-return/revocation replacements; count each ID once even after resale, never subtract revocations again from an already final-valid set. Gross handover, refund, physical return, rehandling and final validity are separate records. Qualify only correct SKU/lot intact closed bottle, correct physical counter recipient and accepted quantity/condition; no customer possession alone. Late returns revise the original pool numerator, denominator and S/F/T/O versions at actual event dates; new pools do not repeat allocations."
      inputs:
        - original_id
        - final_acceptance
        - cutoff
        - return_link
        - prior_version
        - pool_id
      output: "Q"
      source_ids: []
    - id: physical_ledgers
      applies_to: "customer_pack; supplier_pack; transfer_pack; external_pack; failed_bottle"
      rule: "Goods-only Count balance: G_close=G_open+receipts+physical_customer_returns-gross_customer_handover-supplier_handover-internal_handover-condemnation_count-confirmed_missing_count+signed_goods_residual. gross_customer_handover=initially_accepted_handover_count+never_accepted_at_handover_count, disjoint immutable actual event IDs. customer_pack reports the former and external_pack the latter, never a subset duplicated in both. Later acceptance/revocation or return changes final service/source responsibility, not the original physical event direction or initial handover category. Revocation without movement reclassifies original event only. Condemnation changes goods into held waste internally. Independent held-waste kg: W_close=W_open+condemned_actual_kg+other_waste_received_kg-dispatched_actual_kg-confirmed_missing_waste_kg+signed_waste_residual. Count is never kg. Link condemnation IDs to separately weighed whole carrier kg; dispatch directly uses actual consignment net kg, never deduct opening/closing or retained stock again. Signed unknown residuals remain investigated and block completeness."
      inputs:
        - G_open
        - receipts
        - physical_customer_returns
        - gross_customer_handover
        - initially_accepted_handover_count
        - never_accepted_at_handover_count
        - supplier_handover
        - internal_handover
        - condemnation_count
        - confirmed_missing_count
        - signed_goods_residual
        - W_open
        - condemned_actual_kg
        - other_waste_received_kg
        - dispatched_actual_kg
        - confirmed_missing_waste_kg
        - signed_waste_residual
      output: "G_close; W_close"
      source_ids: []
    - id: failed_source
      applies_to: "failed_original"
      rule: "N_F=sum_s original whole-bottle units assigned final F; input amount=N_F/Q. Bind the actual supplier full-formulation/full-container V_s once per original unit, including original receiving-gate inbound transport by transport_ownership. No pure surfactant or net-liquid-kg proxy for a complete pack. Successful S excluded from SERVICE; downstream GOODS may add N_S*V_s/Q once; T retains named responsibility and O retains open source. Failed original never disappears through satellite exclusions."
      inputs:
        - original_id
        - V_s
        - N_F
        - N_S
        - Q
        - attribution_level
        - owner_id
        - pool_id
        - version
      output: "failed_original"
      source_ids: []
    - id: cleaning_origin
      applies_to: "cleaner_pack; wash_water; dry_wipe; rinsate; wet_wipe; used_bottle"
      rule: "For EACH original source j separately retain source_class=goods_F or janitorial; a spilled merchandise source retains its same failed_original parent and receives no second cleaner_pack background. Janitorial cleaner uses different purchased original IDs from merchandise, even if the same formula is chosen for utility-sink washing of spill trays. Never convert retail goods to janitorial stock within this route. Charge the complete original janitorial pack manufacturing plus inbound source once to its first-opening event pool; shared first-opening events use that batch measured wetted tray-area shares summing1. Later withdrawals/reuse retain the same source and do not repeat manufacture/inbound. Unused closed stock/returns/transfers carry unassigned source. Independently allocate each source original liquid m_src_j kg to actual exclusive final destinations; link dispatched_bottle_residue to failed_bottle for goods_F and used_bottle for janitorial: retained unused; retained in wet wipe; retained in bottle; dispatched bottle residue; dispatched wet wipe; dispatched rinsate; verified outside species transfer. At cutoff classify each source ID and measured source portion once: retained_unused is original liquid stock only in never-used, undamaged, factory-sealed original bottles; retained_bottle is original liquid residue retained on site in already-opened or damaged original bottles, whether or not dosed yet, excluding retained_unused. Record each bottle initial seal, first opening, damage and cutoff state and original source measurement ID; the same measured source portion enters only one cutoff state. Unknown seal/state blocks completeness; a state transition replaces the old state for the same source and measured portion, never retains both old and new buckets. Used is intermediate: when used becomes rinsed replace its state, do not add a second destination. Use each source cumulative ledger through cutoff: m_src_j=retained_unused+retained_wipe+retained_bottle+dispatched_bottle_residue+dispatched_wipe_origin+dispatched_rinsate_origin+verified_species_transfer+source_residual, keeping original quantity and all historical destinations/version corrections; downstream period withdrawals do not create a new original source. New rinse water/dirt/dry wipe are not m_src_j. Require source-origin mass assay/tracer/validated actual dosing-transfer record; do not infer original formulation kg from whole wet carrier kg or label active%. No signed source residual may be hidden. Actual wet carrier kg, source-origin kg and full-pack count are distinct."
      inputs:
        - bottle_initial_seal_state
        - first_open_at
        - damaged_at
        - cutoff_state
        - state_transition_id
        - source_measurement_id
        - measured_source_portion_id
        - retained_origin_kg
        - source_class
        - source_original_id
        - janitorial_original_id
        - first_open_id
        - m_src_j
        - retained_unused
        - retained_wipe
        - retained_bottle
        - dispatched_bottle_residue
        - dispatched_wipe_origin
        - dispatched_rinsate_origin
        - verified_species_transfer
        - source_residual
        - Q
      output: "source_origin_balance"
      source_ids: []
    - id: direct_quantities
      applies_to: "core_electricity; wash_water; dry_wipe; failed_bottle; rinsate; wet_wipe; used_bottle"
      rule: "Retain actual raw direct/attributed numerators X_r first. Electricity is meter-end minus meter-start in kWh, converted once by3.6MJ/kWh if needed; wash-water input is actual entrance m3*rho_actual kg/m3, no second subtraction of internally reused water. Rinsate is DIRECT whole-liquid net mass kg at discharge (or exclusive direct discharge-volume*rho at measured temperature), never a supply-balance reconstruction. Failed_bottle, wet_wipe and used_bottle are direct dispatched whole-carrier net kg; no stock or source-composition factor applied again. Dry wipe original mass uses first-use weights excluding independent wrapping; unused stock/returns retain source and reused wipes never repeat manufacture. External labels/density/active percentage never replace actual calibrated measurements. Each final card amount=X_r/Q exactly once."
      inputs:
        - meter_start
        - meter_end
        - meter_boundary
        - water_volume
        - rho_actual
        - temperature
        - discharge_mode
        - direct_net_kg
        - first_use_mass
        - source_id
        - pool_id
        - Q
      output: "X_r/Q"
      source_ids: []
    - id: completion_aggregation
      applies_to: "all inventory rows"
      rule: "For each compatible exchange identity/property/unit/boundary r and original source/pool/version, N_complete_r=N_core_raw_r+sum disjoint N_external_raw_r+sum disjoint z_external_r*D_original_r. Preserve raw external numerators directly; only already normalized z is multiplied by its evidenced original D to restore raw. Apply pool_allocation, digital_events, asset_lifetime and transport_ownership at their actual source levels before aggregation. N_core_raw includes failed_original N_F and core_electricity raw numerator, not their displayed /Q card amounts. Compare constituents/event/time/asset/stage across source IDs to remove overlaps; different provider IDs alone prove nothing. Convert only compatible units, never kg+MJ or raw+normalized; final amount=N_complete_r/Q once. Omitted/unbound actual modules prevent a complete-business claim."
      inputs:
        - N_core_raw_r
        - N_external_raw_r
        - z_external_r
        - D_original_r
        - exchange_identity
        - property
        - unit
        - boundary
        - source_id
        - owner_id
        - pool_id
        - version
        - Q
      output: "N_complete_r/Q"
      source_ids: []
    - id: card_numerators
      applies_to: "all inventory rows"
      rule: "X_core_electricity=attributed metered kWh; failed_original raw numerator=N_F; X_customer_pack=initially_accepted_handover_count; X_supplier_pack=actual intact supplier-return count; X_transfer_pack=actual intact interstore count; X_external_pack=never_accepted_at_handover_count; X_failed_bottle=direct dispatched damaged whole-bottle kg. X_cleaner_pack=attributed first-open janitorial complete-pack count; X_wash_water=attributed entrance water kg; X_dry_wipe=attributed first-use dry cellulose kg; X_rinsate=attributed actual whole-liquid discharge kg; X_wet_wipe=attributed dispatched whole wet-wipe kg; X_used_bottle=attributed dispatched whole used-janitorial-bottle kg. Record raw direct amounts, then attributable amounts under source_allocation; final amount for each displayed X is X/Q, N_F/Q for failed_original, and exactly1Item(s) for service_output. No source-origin composition or stock correction multiplies direct terminal kg again."
      inputs:
        - gross_customer_handover
        - supplier_handover
        - internal_handover
        - initially_accepted_handover_count
        - never_accepted_at_handover_count
        - dispatched_actual_kg
        - first_open_count
        - water_volume
        - rho_actual
        - first_use_mass
        - raw_X_r
        - attributed_X_r
        - N_F
        - Q
      output: "card_raw_and_final_amounts"
      source_ids: []
    - id: source_allocation
      applies_to: "all inventory rows"
      rule: "For pool_allocation use X_ch=X_c*d_ch/sum_all_h(d_ch) with exact same-unit eligible source driver and all beneficiaries; direct source keeps original ownership without repeating this share. For digital_events use w_eh=t_eh/sum_all_h(t_eh), source_amount_h=source_amount_e*w_eh; camera/retention apply the frozen original capture_m2h share once. Connection sources use connection_share_h=reserved_endpoint_connection_s_h/sum_all_h(reserved_endpoint_connection_s_h), attributed_connection_h=connection_source_h*connection_share_h; only exact_final_owner_pool_version under digital_events omits repeat owner allocation. For asset_lifetime use provisional f_ah=e_ah/L_a and final f_ah=e_actual_ah/sum_all_h(e_actual_ah), replacing each historical pool delta=f_new_ah*V_new_a-f_old_ah*V_old_a. For transport_ownership use attributed_trip_source_amount=trip_amount*source_share and final_owner_amount=attributed_trip_source_amount*owner_share, skipping a level only with exact corresponding attribution_level evidence. These are source-numerator calculations, never another final/Q."
      inputs:
        - connection_source_h
        - reserved_endpoint_connection_s_h
        - all_connection_beneficiaries
        - connection_interval_id
        - exact_final_owner_pool_version
        - X_c
        - d_ch
        - all_beneficiaries
        - t_eh
        - source_amount_e
        - capture_m2h
        - e_ah
        - L_a
        - e_actual_ah
        - f_old_ah
        - f_new_ah
        - V_old_a
        - V_new_a
        - trip_amount
        - source_share
        - owner_share
        - attribution_level
        - original_source_id
        - owner_id
        - pool_id
        - version
      output: "attributed_X_r; historical_delta"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual identity, state, lot, source and complete BOM/background scope separately from manufacturer specification; each presently unbound row must satisfy identity_gate."
      evidence: "Direct official originals/receipts plus supplier site records"
    - id: q_coverage
      applies_to: "retail; hygiene"
      requirement: "Cover all periods and beneficiaries, including closed/failed/zero-sale pools, late replacements, raw source amounts and signed absence; unknowns and material residuals block completeness."
      evidence: "All event/meter/source/version ledgers and calibration uncertainties"
    - id: q_modules
      applies_to: "all inventory rows"
      requirement: "Enforce module_completion with atomic bilingual cards and real collection fields before complete SERVICE; no downstream choice of driver, numerator boundary or final denominator is allowed."
      evidence: "Source-constituent overlap matrix and row/protocol reconciliation"
validation_rules:
  - rule_id: complete_gate
    applies_to: "all inventory rows"
    rule: "Reject completeness when Q<=0, acceptance/source/stock ledgers unresolved, actual source/recipient/state unverified, any needed module missing, unsupported driver, missing original denominator, duplicated provider scope or UUID identity not directly verified. Retain all zero-sale records and uncertainty. No safety, legal compliance, full GHG-standard conformity, scientific approval or publication approval follows from this candidate."
    source_ids: []
  - rule_id: identity_gate
    applies_to: "all inventory rows"
    rule: "All rows presently have no adopted Tiangong UUID. Before dataset completion bind each exact row using directly read official original response with matching recalculated-hash integrity receipt: public state, bilingual baseName, Product/Waste/Elementary direction/type, exact formulation/package or service boundary, reference property/unit chain and outside compartment where relevant. A search hit, UUID-shaped external UFI or manufacturer specification is not a flow binding or quantified LCI. Incompatible identity requires a different verified row, not silent substitution."
    source_ids: []
  - rule_id: incident_gate
    applies_to: "retail; hygiene"
    rule: "Require signed daily presence/absence inspection and actual incident reconciliation for contained and uncontained losses. Internal room-air detergent/alcohol source is not automatically outside elementary emission. Any occurring species needs species-specific measured inlet/outlet and air/capture stocks, actual recovery/nonair exports and final external medium; raw absolute, differential and blank-corrected measurements are exclusive modes with background removed once. Unknown or unexplained signed negative difference blocks completion; no zero clamp, automatic emission, uptake credit or sealed-pack default. Retain actual original formulation origin and measured terminal carriers without duplicated captures."
    source_ids: []
published_dataset_profile:
  dataset_role: "partial_incremental_retail_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Incremental service for matching actual SKU/state/route; complete SERVICE only after fixed-method completion; GOODS adds S separately once"
  excluded_use: "Dishwashing-function comparison; whole-leaf coverage; merchandise life cycle or complete-business claims without completion; different formulation/channel"
  required_metadata: "Original IDs/lot/BOM/store/period/Q/original sources and versions/mapping authority/module status"
  required_quality_disclosure: "All unbound identities, uncertainties, actual absences, completion gaps, residuals and zero-output pools"
  update_trigger: "Actual configuration/source/route/acceptance/life/vector/late-return change, replacing all affected historical versions"
