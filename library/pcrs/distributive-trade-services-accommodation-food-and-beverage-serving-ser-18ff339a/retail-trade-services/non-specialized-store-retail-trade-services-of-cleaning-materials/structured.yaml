system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "retail; hygiene"
      rule: "Admit only abrasive hard-surface scouring cream original sealed bottle, one actual complete formulation/closure/label/liner lot per pool. Manufacturer page establishes hard-surface cleaning micro-particles; its linked 2021-09-19 v05.2 SDS lists calcium carbonate but is not a complete current-batch formula. Verify actual current label/SDS and supplier full BOM evidence of scouring particles; never adopt old SDS percentages or nominal density. A nonabrasive washing preparation containing only dissolved surfactants is outside this route and needs classification review. Nominal 2 L, ingredient ranges, marketing and recommended use never establish measured kg/dose or compliance limits. Require actual store, complete original pack, current use and classification compatibility."
      source_ids:
        - un-cpc62176
        - un-cpc35334
        - cif-product
        - cif-sds
    - rule_id: channel_gate
      applies_to: "retail"
      rule: "Require actual mixed-assortment physical supermarket planogram, store address and timestamped receipts for this SKU. The manufacturer product page and its distributor links establish a real product only, not an eligible mixed physical branch, local stock, purchase or customer use. Walk-in selection, ambient intact storage and counter handover only; online fulfilment, refill/decanting, demonstrations, dilution for sale, customer delivery and detergent manufacturing are excluded routes. Verify dedicated route has no combustion or refrigerant-bearing equipment; shared facility HVAC remains a required completion module. Unknown route evidence blocks applicability."
      source_ids:
        - cif-sds
        - cif-product
    - rule_id: core_boundary
      applies_to: "retail; hygiene"
      rule: "This is a partial incremental core from inspected store-receiving gate to qualified physical counter acceptance, including rehandling, reverse events, dedicated metered electricity, failed-original background and the specified spill-tray hygiene. Successful merchandise manufacturing and its upstream transport belong to downstream GOODS, excluded from SERVICE. The necessary facility, ICT, network, payment, security, administration, other cleaning, capital and transport modules must be completed under module_completion before complete retail SERVICE is claimed. Actual Waste outputs always require treatment; only customer_pack and supplier_pack and transfer_pack and external_pack are physical non-characterized custody satellites. failed_original is an actual characterized Product input."
      source_ids:
        - jrc-retail
        - ghg-product
    - rule_id: source_ownership
      applies_to: "failed_original; customer_pack; supplier_pack; transfer_pack; external_pack"
      rule: "For every original homogeneous whole-pack manufacturing plus inbound-transport source vector V_s at receiving, conserve original unit IDs exactly in S/F/T/O: S final accepted customer goods; F failed-source responsibility in this SERVICE; T named continuing owner; O unresolved/open stock. Rehandling/resale never repeats V_s. Physical supplier return needs actual signed receiving owner and background continuation, otherwise retain O. Theft, confirmed missing and unopened external failure carry original-source F unless a documented continuing T accepts it. Revoked acceptance without physical return transfers the original event from S to F or evidenced T; money-only adjustment with acceptance intact leaves S. Full-pack source F follows its original source once even if several later physical waste carriers descend from it; do not duplicate original backgrounds per carrier. If component responsibilities differ, replace the whole-pack input by verified component-quantity Product cards and supplier component vectors conserving V_s; mass fractions never split an environmental vector."
      source_ids: []
    - rule_id: state_gate
      applies_to: "retail; hygiene"
      rule: "Inspect seals and weigh/look for leaks every handling shift and every incident; sealed does not imply zero evaporation/leakage. Existing custody satellites admit intact original bottles only. Failed_bottle admits actual contained damaged bottle with liquid and original cap/label, only when receiver signs acceptance of those actual constituents/state. Wet_wipe, used_bottle and rinsate similarly require signed state/constituent acceptance and complete treatment boundary; no license/photo alone. Opened external transfer, free detergent liquid, dry powder, unidentified gas release, different wipe material, unknown recipient/state or unresolved mass residual blocks completeness until a named state-specific atomic card, protocol, identity and bilingual projection are added. Do not turn unknown into zero or mix an incompatible waste by wording."
      source_ids: []
    - rule_id: module_completion
      applies_to: "retail; hygiene"
      rule: "Before claiming complete SERVICE, inventory actual necessary functions and install named atomic extension cards under their real process, direction, type and property/unit, with cp_modules evidence and this PCR fixed methods. Facility electricity/heat/imported water, lighting and fan fixtures, shell fit-out, shelving, reusable spill trays, checkout/printer, ICT hardware/server operation, network access, payment processing, cameras/capture-storage, administration, actual receipts/labels, opened receiving cases/film, wipe outer wrapping, other actual cleaning, repairs, capital retirement and every actual transport leg require positive inclusion or signed physical/provider absence evidence. Consumables follow consumable_sources; capital follows asset_lifetime. A contract bundle may remain one service only with exact provider object, measured denominator and enumerated included energy/transport/maintenance/EOL, mutually exclusive with constituent cards. Internet access does not include payment/admin/security backend by assumption. Unknown fuel/refrigerant scope blocks completion: inspect equipment/species and service records; include actual equipment loss, capture, nonair transfer, stocks and final outside medium through separately reviewed species-specific cards/control-volume protocols, or prove this source absent. Never substitute generic zero gas factors."
      source_ids:
        - jrc-retail
