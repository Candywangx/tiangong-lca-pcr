validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Every unbound row requires a fresh direct official identity read before a characterized dataset: verify exact object/state, input/output Product/Waste type, official bilingual names, property/unit chain, qualifiers, treatment boundary and environmental compartment if relevant. cp_identity records actual source/receipt hash. Historical AC identity establishes only unspecified point-of-use AC and the verified energy chain, not a local supply mix. No marketing/source/standard UUID may become a flow binding."
    source_ids: []
  - rule_id: v_account
    applies_to: "all inventory rows"
    rule: "Require cp_goods source conservation, distinct final-valid Q, goods-count and held-waste-kg balances, actual state-specific recipient evidence and c_complete compatible row aggregation. Confirmed missing goods/waste are separate from signed unexplained residuals; neither becomes fictional treatment. Unknowns, zero Q, unmatched mass/property, incomplete provider coverage or omitted actual module prohibit a complete claim."
    source_ids: []
  - rule_id: v_qa
    applies_to: "all inventory rows"
    rule: "Named store inventory owner signs each cohort, site energy technician signs meter hierarchy/calibration and circuit scope, supplier signs configuration/BOM/LCI, receiving/treatment providers sign physical state/scope and reviewer independently reconciles original IDs and all versions before delivery. Record data periods, sampling coverage, meter uncertainty/resolution, missing intervals and measured reconciliation residual without invented acceptance thresholds. Any unmet route gate remains unavailable rather than zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "Candidate incremental retail-service dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only exact declared narrow route after actual binding/measurement; complete claim only after b_completion"
  excluded_use: "Whole CPC leaf, cabinet production/function, delivery/installation, whole-business claim from partial core"
  required_metadata: "Configuration/BOM, branch evidence, pool/Q, original source/version/correction ledgers, support boundaries and all unresolved fields"
  required_quality_disclosure: "Partial/incomplete modules, identity observations, uncertainty, missingness, zero pools and methodological review state"
  update_trigger: "Any configuration/channel/state change, late acceptance event, supplier boundary or lifetime/module revision"
