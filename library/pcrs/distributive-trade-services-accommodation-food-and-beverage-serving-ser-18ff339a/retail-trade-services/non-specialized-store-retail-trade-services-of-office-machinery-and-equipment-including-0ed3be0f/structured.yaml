allocation_rules:
  - rule_id: a_goods
    applies_to: "failed_pack; service; goods_handover; supplier_return; transfer_out; external_failure; packaged_waste"
    rule: "Use cp_goods and c_goods. Declare same-configuration pool prospectively by branch, route and study period; include every attempted/failed and zero-sale cohort. Q is number of distinct original package IDs whose pickup acceptance is final-valid at cutoff; repeated collection, resale and reissue of one original never create another final service. Later acceptance revocation changes that original status even without physical return; purely financial refund with valid acceptance does not. Recompute original pool Q, F and all attributed numerators/version deltas; do not charge a late return again to a new pool. Q=0 is unnormalizable and retained with raw burdens, not deleted or transferred to successful days. Supplier returns retain signed continuing dispatch manufacturing/original-package responsibility and the separate original inbound-transport responsibility; a physical return does not collapse those source boundaries."
    source_ids: []
  - rule_id: a_energy
    applies_to: "operating_ac"
    rule: "First directly subdivide actual AC circuits and source intervals. For each overlapping parent/submeter subtract only verified physically included child energy once; disjoint meters are not subtracted. Split measured active, idle and fixed source-numerator pools with identical kWh units, reconciling their sum to the full parent including closed/failure/standby periods. Active handling/checkout/ICT pools allocate by measured equipment active task seconds; idle/fixed equipment pools by measured reserved equipment seconds including failed/empty reservations. Physical facility lighting/fan/fixed pools allocate by measured served area m2 × duration h, including vacant reserved space and all beneficiaries. For each source j use n_j=measured_kWh_j*driver_pool_j/sum_all_beneficiary_drivers_j. Drivers within one pool have one unit, never seconds plus m2*h or bytes. Positive source with unknown/zero total driver is unassigned and incomplete; no zero default. AC_MJ=3.6*sum(n_j); operating_ac=AC_MJ/Q. Require source technology/location/voltage delivery and upstream supply matched separately; no duplicate operating AC in provider or asset packages."
    source_ids:
      - ghg-product
  - rule_id: a_asset
    applies_to: "all inventory rows"
    rule: "For each actual homogeneous asset/model/BOM and disjoint lifecycle-stage vector V, retain a permanent ledger across all beneficiaries h and periods. Measured original-pool exposure actual_e_recorded_h is device reserved operating/idle seconds for handling, checkout, ICT, lighting/fan fixtures and other powered tools; physical building/rack exposure is actual served area m2*h. Each asset uses its own same-unit expected lifetime L (evidenced future device seconds or m2*h) and f_h=actual_e_recorded_h/L; expected future exposure is never the numerator. Keep sum(f_h)<=1. Final retirement fixes actual_E=sum_all_h(actual_e_recorded_h), then replaces EVERY historical f_h*V by the SAME original-pool numerator actual_e_recorded_h/actual_E*V_final. Every lifetime/vector revision similarly records replacement and delta=f_new_h*V_new-f_old_h*V_old for each original pool/version; residual 1-sum(old f) is QA only. Actual manufacture/installation, repair-event parts/service, retirement treatment and independent asset transport belong to the asset first then follow these same historical fractions once; already exact-final-owner/pool/version quantities skip repeat ownership only. Verify complete building versus separate light/fan/rack capital coverage explicitly; provider-included maintenance/EOL excludes duplicate terminal carriers. A transferred stock cabinet converted to demonstrator transfers its SAME original B_o to asset T, never full F plus new manufacture; demonstration is outside this route until extended."
    source_ids:
      - ghg-product
  - rule_id: a_digital
    applies_to: "all inventory rows"
    rule: "For each unique original network interval j collect actual provider source connection-hours source_H_j and measured reserved endpoint-connection seconds endpoint_s_hj across ALL beneficiaries including failed/empty reservations; n_hj=source_H_j*endpoint_s_hj/sum_all_h(endpoint_s_hj), with positive known sum. Interval/source identity and provider scope must be unique; exact final owner/pool/version attribution alone avoids repeat owner allocation. Network hours are service activity, not another electricity interval; remove actual electricity/capital already inside a verified provider lifecycle package. Payment authorization and administrative batches are unique original events; record actual within-event source-line processing shares w_hj measured from processing seconds with sum_all_h(w_hj)=1, including failed attempts; one multi-SKU basket is never one whole event for each SKU. Separate actual backend services unless one evidenced same-contract package covers their complete constituents and denominator. Camera source allocation freezes the original capture-period map: actual timestamped field-of-view footprints m2*covered duration h, disjoint zones/times, all beneficiary and vacant reservations. For EACH original capture source i freeze w_i_h=(footprint_m2_i_h*coverage_h_i_h)/sum_all_h(footprint_m2_i_h*coverage_h_i_h), with an actual measured, known positive denominator across ALL beneficiaries including vacant/empty reservations, disjoint zones/times and source/version. Attributed capture numerator is capture_source_numerator_i*w_i_h. The actual retained storage activity from that capture is storage_bytehours_i_h=stored_bytes_i*retention_h_i*w_i_h; keep the SAME frozen map across later retention periods, never recompute it from later sales. Match byte-hour activity to the actual provider storage source denominator and complete boundary before applying its vector; raw provider totals spanning several captures first allocate among those captures by their measured stored_bytes_i*retention_h_i/sum_all_i(stored_bytes_i*retention_h_i), then apply each frozen w_i_h once. Exact final owner/pool/version attribution skips only the already performed corresponding level. Record 1 GB=10^9 bytes and 1 GiB=2^30 bytes explicitly. Apply each provider source numerator and owner once; cp_support retains source_H_j, endpoint_s_hj, event seconds, byte-hours, map, scope and versions."
    source_ids: []
  - rule_id: a_transport
    applies_to: "all inventory rows"
    rule: "Apply trip/segment j -> actual consignment or asset/material o -> final original responsibility/pool/version h. For raw source_trip_numerator_j, attributed_raw_j_o_h=source_trip_numerator_j*driver_j_o/sum_all_o_driver_j_o*owner_fraction_o_h; each factor is omitted only at its already-evidenced attribution level, never twice. Define driver_j_o below and retain exact level in cp_support. Measure source numerator (fuel, vehicle-km or complete provider trip vector), actual route/empty/idle segments, signed load limits and actual binding capacity. Verified mass-limited loaded segment uses actual source mass*segment distance divided by all consignments mass*same distance; verified volume-limited uses actual occupied transport m3*distance in that same unit. Another/unknown binding limit needs a reviewed matching extension. Empty travel is a separate positive vehicle-km source allocated by measured capacity reservation*actual empty distance, not zero t*km; stationary idle is a separate positive duration source allocated by same-unit reserved capacity*measured idle seconds. Keep all beneficiaries and positive known denominator. Provider already assigned to consignment skips only vehicle allocation, then applies source F/first-use/asset historical owner fraction. Only exact final owner/pool/version scope skips that fraction. The core failed_pack input and its B_o exclude inbound transport. Mandatory completion must add the actual F dispatch-to-receiving transport sources, allocated with the same original F ownership and actual atomic cards/protocols before completeness; S inbound stays in GOODS and T/O follows continuing original responsibility. Match any supplier-bundled exact inbound segment under b_gate: separate its verified stage vector from dispatch B_o and use it once in completion, never duplicate that segment or silently call it core. Match asset lifecycle legs independently. Actual return/waste shipments are physical events independent of background transfers; no duplicate provider legs or treatment transport."
    source_ids:
      - ghg-product
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "failed_pack; service; goods_handover; supplier_return; transfer_out; external_failure"
      record_type: "Original-package event and responsibility ledger"
      raw_fields: "branch_id; cohort_id; original_id; model; configuration; lot; BOM_version; original_pack_state; source_id; B_o; supplier_dispatch_vector_id; supplier_dispatch_scope; supplier_transport_included_segment_ids; verified_segment_vector_id; receiving_segment_id; N_F; Q; receipt_count; opening_goods_count; gross_customer_handover_count; initially_accepted_physical_handover_count; never_accepted_physical_handover_count; externally_retained_unaccepted_original_ids; physical_customer_return_count; supplier_handoff_count; transfer_handoff_count; condemnation_count; closing_goods_count; confirmed_missing_goods_count; signed_goods_residual; final_valid_original_ids; revoked_original_ids; never_accepted_handover_ids; financial_only_adjustment_ids; S_o; F_o; T_o; O_o; N_customer; N_supplier; N_transfer; N_external; recipient_id; acceptance_time; event_time; cutoff; source_version; original_pool; correction_version"
      collection_method: "Scan every actual package and movement at store receiving, holding, pickup and return; link supplier signed packing/BOM, dated mixed-assortment branch audit and final acceptance/revocation. Record gross customer handovers as the disjoint sum of initially_accepted_physical_handover_count and never_accepted_physical_handover_count; current external-unaccepted retention is a separate responsibility state. Do not subtract a handover class a second time. Goods-only count balance uses actual movements and condemnation_count; held waste uses its own kg ledger cp_waste. Inventory owner signs cutoff and late-correction trail."
      unit: "Item(s); event IDs; original supplier vector units"
      frequency: "Every event and cutoff revision"
      temporal_coverage: "Whole prospectively declared period including zero-sale and late events"
      site_scope: "Named physical mixed store and same original lot/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed receipts, BOM, event-ID audit, configuration photographs and independent ledger reconciliation"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "operating_ac"
