        - opening_held_waste_kg
        - condemned_measured_kg
        - actual_waste_received_kg
        - actual_waste_returned_kg
        - confirmed_missing_waste_kg
        - closing_held_waste_kg
        - signed_waste_residual
        - Q
        - cp_waste
      output: "dispatch_kg/Q; signed_waste_residual"
      source_ids: []
    - id: c_support
      applies_to: "all inventory rows"
      rule: "Apply a_asset to actual_e_recorded_h/expected_L and at final retirement actual_e_recorded_h/actual_E, replacing every historical fV. Apply a_digital source_H_j*endpoint_s_hj/sum_all(endpoint_s_hj), processing_seconds_hj/processing_seconds_all_j and frozen capture map to byte-hours. Apply a_transport only at missing attribution levels and b_completion cleaned_area_pool_m2/cleaned_area_all_m2. Retain raw exchange numerators and exact source/owner/pool/version before c_complete; no denominator choices are delegated."
