    - id: c_complete
      applies_to: "all inventory rows"
      rule: "Per identical exchange identity/direction/type/property/unit and exact original pool/version, restore a normalized external module normalized_z by normalized_z*its evidenced original_D; already raw modules remain raw. First supply any missing trip->source->final-owner attribution under a_transport/a_asset/a_digital. Recover raw core numerators (N_F for dispatch manufacturing/original packing only, AC_MJ, physical N and dispatch_kg) from original ledgers, not a second already divided value. The core contains no F inbound-transport numerator: require its separately attributed inbound_F_raw_row from actual transport sources/cards under b_gate/a_transport, then include it once in disjoint external_raw_row. Record any matched supplier-bundled segment once in that completion and remove it from dispatch B_o; unresolved separation blocks completeness. final_row=(raw_core_row+sum(disjoint attributed external_raw_row))/Q. Compare actual constituent/event/time/asset/lifecycle scope to deduplicate exact original sources; distinct provider IDs alone do not prove independence. No kg+MJ, no raw+normalized, no double F, no omitted core. Record S dispatch manufacture/original packing sum(S_o*B_o)/Q and separately attributed inbound_S_raw_row/Q only in the separate GOODS system outside this service."
