  calculation_rules:
    - id: c_goods
      applies_to: "failed_pack; service; goods_handover; supplier_return; transfer_out; external_failure"
      rule: "Q=count(distinct final_valid_original_ids); N_F=sum(F_o); N_customer=initially_accepted_physical_handover_count; N_supplier=supplier_handoff_count; N_transfer=transfer_handoff_count; N_external=never_accepted_physical_handover_count; gross_customer_handover_count=initially_accepted_physical_handover_count+never_accepted_physical_handover_count with disjoint event IDs. Goods-only balance: opening_goods_count+receipt_count+physical_customer_return_count-gross_customer_handover_count-supplier_handoff_count-transfer_handoff_count-condemnation_count-confirmed_missing_goods_count-closing_goods_count=signed_goods_residual. A revoked status alone adds no movement. b_source conservation is separate; service=1 Item(s) and other cards use their raw N/Q once."
      inputs:
        - final_valid_original_ids
        - revoked_original_ids
        - never_accepted_handover_ids
        - financial_only_adjustment_ids
        - F_o
        - S_o
        - T_o
        - O_o
        - opening_goods_count
        - receipt_count
        - physical_customer_return_count
        - gross_customer_handover_count
        - initially_accepted_physical_handover_count
        - never_accepted_physical_handover_count
        - externally_retained_unaccepted_original_ids
        - supplier_handoff_count
        - transfer_handoff_count
        - condemnation_count
        - confirmed_missing_goods_count
        - closing_goods_count
        - signed_goods_residual
        - N_external
        - Q
      output: "N_F; Q; N_customer; N_supplier; N_transfer; N_external; signed_goods_residual"
      source_ids: []
    - id: c_energy
      applies_to: "operating_ac"
      rule: "n_j=measured_kWh_j*driver_pool_j/sum_all_beneficiary_drivers_j under a_energy; AC_MJ=3.6*sum(n_j); final=AC_MJ/Q."
      inputs:
        - measured_kWh_j
        - driver_pool_j
        - sum_all_beneficiary_drivers_j
        - n_j
        - AC_MJ
        - Q
        - cp_energy
      output: "AC_MJ/Q"
      source_ids: []
    - id: c_waste
      applies_to: "packaged_waste"
      rule: "dispatch_kg=sum(gross_kg-tare_kg) of actual accepted dispatches, final=dispatch_kg/Q. Independent held-waste balance in kg: opening_held_waste_kg+condemned_measured_kg+actual_waste_received_kg-actual_waste_returned_kg-dispatch_kg-confirmed_missing_waste_kg-closing_held_waste_kg=signed_waste_residual. Condemnation_count is never kg; no stock subtraction from directly measured dispatch."
