system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_gate
      applies_to: "all inventory rows"
      rule: "Start at signed physical receipt of the complete original package into the named store; B_o and failed_pack include supplier manufacture plus original packaging at dispatch only and exclude inbound transport. Transport from that dispatch gate to actual receiving is a mandatory separate completion source under a_transport and b_completion, with actual atomic transport exchange cards and protocols before completeness. If an offered supplier dataset bundles that exact segment, require verified stage-separated dispatch B_o and the matched segment source vector, and count the segment once in the inbound completion; never leave it inside failed_pack or add a second segment. Unseparable or unknown bundled scope is incomplete. End at final-valid store pickup acceptance or the actual recipient/state exit. Exclude customer travel and subsequent cabinet installation/use. Store operation for failures and zero-sale periods remains included. Protocol cp_goods establishes gates and configuration."
      source_ids:
        - un-cpc-62183
        - hon-pricer
        - hon-storage
    - rule_id: b_source
      applies_to: "failed_pack; service; goods_handover; supplier_return; transfer_out; external_failure; packaged_waste"
      rule: "Apply a persistent original source ledger per original package ID. For each homogeneous full supplier manufacturing/original-package vector B_o at supplier dispatch (no inbound transport), partition source-equivalent quantities S_o/F_o/T_o/O_o exactly once: S final-valid customer original; F failed responsibility retained by this retail pool including confirmed lost original, condemned original and externally retained unaccepted original unless a signed continuing responsibility assigns it T; T signed continuation to supplier/another pool/asset; O unresolved or unsold stock retained open. S+F+T+O equals UNIQUE original acquired source equivalents with versioned corrections; physical return and resale never acquire B_o again. The goods balance receipt_count means external physical stock receipts only, excluding the separately counted physical_customer_return_count. Original ownership follows b_source regardless of a repeated physical receipt. Final-valid S production is outside incremental service and belongs once to a separately declared GOODS system; failed_pack is the real Product input N_F/Q and carries sum(F_o*B_o)/Q once for dispatch manufacture/original packaging only. Its F portion of dispatch-to-receiving transport is excluded from this core card and must be added as a distinct actual completion source under b_gate and a_transport; S inbound belongs to GOODS, while T/O original transport responsibility continues with the same original source ledger. Physical supplier_return, transfer_out, external_failure and goods_handover are explicitly uncharacterized custody satellites only, not extra manufacturing inputs; packaged_waste is a characterized Waste output requiring complete treatment. A responsibility transfer is not a new physical movement. Physically verified O stock carries its unassigned original source to the next period without reacquisition; unknown O identity/amount/fate blocks completeness; no automatic waste assumption for customer retention."
      source_ids: []
    - rule_id: b_package
      applies_to: "failed_pack; packaged_waste"
      rule: "B_o must match actual factory-assembled office filing cabinet full cabinet and original packing: steel case/drawers/reinforcements and suspension, aluminium pulls/label holders, locks/keys, follower blocks, coatings and every actual original packing constituent. Require signed supplier model/lot inventory and the exact dispatch manufacturing/original-package boundary excluding inbound transport; whole-package vector is used exclusively. Do not model a full cabinet as pure steel kg or infer a component environmental vector by mass fraction. If actual component responsibility differs, this whole-package method is unavailable until an extension supplies verified component original vectors, quantity/property/unit cards and source conservation with those parts removed from the whole vector. Real complete packaged waste may stay intact only with signed receiver acceptance of its actual constituents/state and matching complete treatment; otherwise add disjoint actual state/material cards before completeness."
      source_ids:
        - hon-pricer
        - hon-storage
    - rule_id: b_absence
      applies_to: "all inventory rows"
      rule: "This route admits no on-site fuel combustion, purchased heat/steam, refrigerant equipment, product processing, unboxing, added customer packaging, printing or wet cleaning within its core. cp_support requires a dated all-equipment/all-period audit including landlord/shared plant, handling and standby equipment, circuits and cleaning contractor scopes. True occurrence or unknown absence means this narrow route cannot claim completeness: first extend the PCR with real atomic species/carrier cards, executable measurement and outside-environment transfer methods where relevant, bilingual rules and normal projection. An appliance name or an electricity meter does not prove absence. Electricity supply and provider-background plant impacts remain in their matched datasets."
      source_ids: []
    - rule_id: b_completion
      applies_to: "all inventory rows"
      rule: "The core is partial and omits F inbound transport. The mandatory completion must supply its actual segment source, atomic exchange cards and protocols under b_gate/a_transport before any complete retail-service claim; supplier-bundled exact segments are separated and counted only once as specified in b_gate. Before complete retail-service use, cp_support must enumerate every actual facility, light/fan, shelf/rack, handling aid, checkout/ICT/network endpoint, payment/admin/security backend, cleaning system and capital source with its actual object/model/BOM, site/time, source/pool/version, included stages and overlap check. Add actual atomic exchange cards/protocols to this PCR in both languages and sync; a list of module names is insufficient. Apply a_energy to all operating AC, a_asset to each homogeneous capital package and its disjoint maintenance/retirement/asset transport, a_digital to network/payment/admin/camera and a_transport to receiving/return/waste/support transport. Cleaning uses an actual verified full contractor lifecycle service with measured cleaned-area m2 per event and allocation of the source vector by this pool cleaned area / all served cleaned area for that event; require full actual constituents/operation/capital/treatment coverage, exclude those included sources from other modules, and no fictitious generic cleaning bundle. Other necessary exchanges not covered by those methods block completeness until a concrete extension. Use c_complete to combine original raw numerators and disjoint completion numerators once; original S merchandise remains excluded."
      source_ids:
        - ghg-product
