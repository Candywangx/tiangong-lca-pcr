allocation_rules:
  - rule_id: pool_and_acceptance
    applies_to: "retail"
    rule: "Before observations fix site, exact SKU/pack/source version, route, calendar interval, stock-origin IDs and closure/return horizon as a same-configuration pool. Retain all failed, idle, closed and zero-sale periods. Q counts distinct original package IDs whose final in-person acceptance is valid at the stated horizon; repeated handovers/resales count that original at most once. A revoked acceptance removes it even without physical return; a purely financial refund/discount with valid acceptance does not. Do not subtract revocations again after counting final-valid IDs. A late return replaces original-pool Q, fate/background and attributable numerator versions with actual dates; never charge the same event to a later pool. Q=0 is unnormalizable and is retained in the declared pool/extension with its burdens, never deleted or divided."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_shared
    applies_to: "all inventory rows"
    rule: "Prefer disjoint measured source circuits/events. For each actual circuit first partition measured E_direct, E_active, E_idle and E_fixed in kWh from logged states, reconciling sum to parent meter. Subtract a submeter only when contained in that parent. Direct records carry actual original pool. Shared active handling/checkout kWh use measured equipment-occupied minutes for every beneficiary. Equipment idle/fixed checkout/ICT/security/trolley-associated kWh use actual reserved equipment-hours; place lighting/fan idle/fixed kWh use reserved floor-area-hours including closed and zero-sale periods. Keep these actual source numerator pools disjoint, require their complete measured state/source scopes and reconcile compatible kWh to the parent. Each disjoint source uses one same-unit driver d and a_h=d_h/sum_all(d); denominators must be known and positive. Allocate source quantity once, then sum compatible attributed kWh. Never sum minutes with equipment-h, m2*h or electricity as one driver; unmeasured state partition or all-zero driver blocks allocation, not equal-share/default zero."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
  - rule_id: digital_completion
    applies_to: "all inventory rows"
    rule: "Internet connection intervals are unique Mbps*h reserved-capacity records across all beneficiaries; provider quantities in connection-hours use that interval fraction once. Do not duplicate them as overlapping active/idle/fixed electricity hours. Remote payment/admin active compute uses measured task CPU-ms by original line; a shared basket authorization is split by actual logged line CPU-ms summing to its event total, never one whole attempt per SKU. Remote fixed compute capacity uses reserved core-hours, remote security retention uses actual byte-hours: record bytes and capture period. Fix a_capture_h=protected_display_m2_h*coverage_h/sum_all(protected_display_m2_h*coverage_h) from actual beneficiary protected/display area within the original field of view times covered duration; partition overlapping views into disjoint area-time cells, retain vacant reservations and all beneficiaries. Freeze original capture cell/beneficiary IDs and map version; subsequent retained byte*h follows that original map, never later sales. Shares sum1; GB=10^9 bytes and GiB=2^30 bytes. Separate source numerator pools for each dimension and state. Network access alone does not include payment/security/admin backend. If counters or actual provider scope are missing, retain gap, not a fictional SKU-exclusive connection or complete bundle."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_history
    applies_to: "all inventory rows"
    rule: "For each actual homogeneous model/BOM/scope asset vector V_a separate manufacturing/installation, operation, maintenance and terminal treatment. Building shell/fitout including fixed lighting/fans uses beneficiary reserved m2*h / expected lifetime m2*h; shelf uses reserved shelf-m2*h / expected lifetime shelf-m2*h; trolley/checkout/ICT use actual reserved operating h / expected total lifetime reserved operating h; retain stationary idle reservation h, not distance0. e_a_h/L_a gives provisional f_old across every historic pool. At retirement replace EVERY historic share with f_new_h=e_actual_h/E_actual where E_actual=sum_all_h(e_actual_h), and replace vectors when scope/life changes: delta_h=f_new_h*V_new-f_old_h*V_old; never restart manufacture. Maintain cumulative fractions<=1, all beneficiaries and residual QA; residual is not a shortcut for changed exposures. Repairs are real dated material/service events unless signed complete package covers them. Terminal carrier and asset-associated inbound/repair/retirement transport follow the same historic f once, not f twice or current retirement Q. A directly weighed terminal whole device already excludes removed parts; component reconstruction is exclusive. Provider-contained EOL/carriers are not extra foreground waste."
    source_ids:
      - ghg-product-2011
  - rule_id: transport_ownership
    applies_to: "all inventory rows"
    rule: "Map each transport source trip/segment to actual consignment first and then original source owner/pool/version. Loaded road segment activity is measured gross consignment t*km, allocated source-to-consignment by d_consignment_segment=reserved_capacity_t*segment_km when sharing; retain capacity tonnes and all consignments. This driver requires evidence of actual mass-constrained capacity and reserved tonnes for that segment; unknown or volume-constrained activity requires a reviewed matching capacity method before completeness, never an invented tonne reservation. Empty reserved segments use actual vehicle-km allocated by reserved tonne-capacity share, stationary idle fuel/time by reserved tonne*h share, not zero t*km. Match an actual provider covering each observed loaded/empty/idle state, adding disjoint vehicle-distance or stationary service only when absent from provider. Unknown coverage blocks completion. A provider assigned to consignment skips only repeat trip allocation; apply F/first-use/asset historic ownership still unless already assigned to exact final responsibility/pool. Original goods receiving transport follows S/F/T/O at the same gate; asset transport follows asset_history; material transport follows first-use ownership. Compare actual events/time/assets/stages, not merely different provider IDs."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
  - rule_id: materials_completion
    applies_to: "all inventory rows"
    rule: "For actual cleaning/water/material sources retain formulation/model/lot and separate never-used stock from previously-used stock. Acquisition and inbound transport follow measured first-use source quantities; unused transfer/return retains unassigned original source, reused material never repeats manufacture/transport. Metered facility water is imported volume and already excludes internal reuse; do not subtract reuse. Direct effluent is actual V_discharge*rho_discharge with measured density and whole liquid-carrier net mass; do not subtract evaporation/storage again. Cleaning formulation-origin kg partition mutually exclusive unused/used-retained/customer/solid-export/container-residue/liquid-export destinations; used-to-rinsed is a replacement state. Added rinse water/dirt are not original formulation. Direct wet wipe/container/effluent kg are distinct whole-carrier measurements, not multiplied again by origin fractions. Collect source constituents/receiver acceptance and separate dispatch from generation/stock. Unknown chemical/species/state requires named atomic extension before completeness."
    source_ids:
      - jrc-retail-2013
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "failed_original_pack; retail_service; customer_pack_handover; supplier_pack_handover"
      record_type: "Original package/event/source ledger"
      raw_fields: "original_id; event_id; event_date; pool_id; pool_version; original_pool; original_denominator; SKU; lot; formulation; prill_state; seal_condition; inspection_date; inspector; temperature_log; moisture_exposure; current_SDS_id; incident_id; incident_species; incident_state; incident_quantity; incident_unit; internal_external_path; route_gate_evidence; mixed_assortment_evidence; electronic_receipt_evidence; equipment_survey; absent_equipment_evidence; scale_id; calibration; uncertainty; bag_model; complete_BOM; actual_fill_kg; actual_whole_pack_kg; gross_kg; tare_kg; moisture_basis; supplier_id; V_c; source_version; receiving_gate; N_c; S_c; F_c; T_c; O_c; responsibility_evidence; acceptance_state; final_valid_original_ids; revocation_date; horizon; G_open; R_supplier; R_customer; H_customer; H_supplier; C_condemn; T_internal; M_missing; epsilon_G; G_close; external_recipient; external_state; failed_cause; original_background_transport_scope"
      collection_method: "Scan a persistent original ID at each receiving/physical exit/return/acceptance event and final horizon. Record actual custody, reason and responsible recipient; retain all failures and original source history. Audit representative same-lot gross/tare/content/whole-bag weighing on calibrated scales; manufacturer label is only identity. Obtain supplier full inventory vectors or leave background unresolved. Daily stock inspection, source reconciliation at close and every late amendment; no invented measured0."
      unit: "Item(s); kg; date"
      frequency: "Every event; daily inspection; close and late amendment"
      temporal_coverage: "Whole declared pool and original receipt-to-return history"
      site_scope: "Actual mixed-assortment store and exact SKU receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scans; signed acceptance/revocation; invoices; source/BOM vectors; calibration; photographs and stock counts"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "electricity"
      record_type: "Circuit/submeter and state ledger"
      raw_fields: "meter_id; parent_id; circuit_scope; reading_start; reading_end; calibration; source_mode; d_source_h; source_version; timestamp; E_direct; E_active_c; E_idle_c; E_fixed_c; a_active_c; a_idle_c; a_fixed_c; active_minutes; reserved_equipment_h; reserved_m2h; all_beneficiaries; measured_state; provider; voltage; geography; loss_boundary; Q; pool_version"
      collection_method: "Read calibrated cumulative meters at pool boundaries and interval states. Map loads including fan, lighting, checkout, ICT/security; measured active logs and area reservations cover all beneficiaries, closed periods and zero-sales. Reconcile disjoint components to parent; subtract contained child once only. Record gaps and actual supply interface."
      unit: "kWh; min; m2*h"
      frequency: "Interval readings; pool close"
      temporal_coverage: "All pool intervals including idle/closed/failure"
      site_scope: "All included on-site AC loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter certificates; circuit diagram; state log; all-beneficiary driver reconciliation"
    - protocol_id: cp_waste
      process_id: "retail"
      flow_role: "whole_pack_waste"
      record_type: "Condemnation/held-waste/dispatch ledger"
      raw_fields: "original_id; event_id; consignment_id; receiver_id; cause; unchanged_prill_state; sealed_bag; accepted_constituents; treatment_scope; W_open; K_condemn; K_dispatch; K_transfer; K_missing; epsilon_W; W_close; gross_dispatch_kg; outside_tare_kg; scale_id; calibration; timestamp; Q"
      collection_method: "Link condemned package IDs to separately weighed whole bags in held-waste stock. Weigh each dispatch with actual outside tare; retain receiver signed acceptance of complete contents/bag components/state and treatment continuation. Record missing, held and physically transferred waste independently; do not derive dispatch by subtracting stock twice."
      unit: "kg; date"
      frequency: "Every condemnation and dispatch; stock at close"
      temporal_coverage: "Full pool and later linked dispatch/return revisions"
      site_scope: "Same store held-waste area and named receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale records; original IDs; signed receiver constituents/state contract; stock audit"
    - protocol_id: cp_completion
      process_id: "retail"
      flow_role: "failed_original_pack; electricity; retail_service; customer_pack_handover; supplier_pack_handover; whole_pack_waste"
      record_type: "Completion source/module ledger"
      raw_fields: "module_id; source_id; source_version; constituent_id; event_id; asset_id; stage; scope_manifest; provider_contract; actual_model; BOM; manufacturing_scope; installation_scope; operation_scope; maintenance_scope; terminal_scope; original_pool; original_denominator; attribution_level; quantity_mode; y_m_r; D_m; X_m_r; X_core_r; E_attr; electricity_MJ; F_c; K_dispatch; H_customer; H_supplier; Q; e_h; L_a; e_actual_h; E_actual; f_old_h; f_new_h; V_new; V_old; beneficiary_id; allocation_version; active_CPU_ms; basket_id; line_CPU_ms; core_hours; stored_bytes; retention_h; interval_start; interval_end; byte_hours; capture_period; capture_cell_id; capture_map_version; protected_display_m2_h; coverage_h; a_capture_h; capture_area_share; GB_or_GiB; connection_interval; reserved_Mbps_h; trip_id; segment_id; capacity_t; reserved_capacity_t; segment_km; mass_capacity_evidence; capacity_constraint; reserved_t; all_reserved_t; reserved_t_h; all_reserved_t_h; consignment_gross_t; distance_km; empty_vehicle_km; stationary_h; driver_unit; all_beneficiaries; material_origin_kg; unused_stock; used_stock; first_use; V_import; V_discharge; rho_discharge; rinse_water; outside_dirt; dispatched_container_residue; formulation_id; cleaner_lot; source_concentration; unused_origin_kg; used_retained_origin_kg; customer_origin_kg; solid_export_origin_kg; container_residue_origin_kg; liquid_export_origin_kg; discharge_density_temperature; wet_wipe_kg; wet_container_kg; effluent_kg; absence_evidence"
      collection_method: "For each named necessary module acquire actual primary logs/provider source inventory, boundary and original denominator. Survey building/fitout/fan/lighting, shelf/trolley/checkout/ICT/security assets; remote internet/compute/payment/admin/security and cleaning/water/materials/waste/transport. Measure counters/exposures per digital_completion, asset_history, transport_ownership and materials_completion, with calibrated scales/meters and original event/source IDs. Fixed modules require actual complete scope list, not a marketing bundle. Unknown absence is not0. Retain all historical beneficiary allocations and final retirement replacements."
      unit: "Source-specific kg; MJ; h; m2*h; CPU-ms; byte*h; Mbps*h; t*km; vehicle-km"
      frequency: "Each original event/interval; version change; final retirement"
      temporal_coverage: "All modules and lifetime history; same original service pool revisions"
      site_scope: "Actual store, remote providers and named logistics/waste receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Primary inventory; signed scope/contract; calibration; complete event/asset/all-beneficiary ledger; original-denominator reconciliation"
  calculation_rules:
    - id: final_q
      applies_to: "retail"
      rule: "Q = count_distinct(final_valid_original_ids); revise original pool versions for late changes before final normalization. No second revocation subtraction; Q=0 remains unnormalizable."
      inputs:
        - final_valid_original_ids
        - original_id
        - acceptance_state
        - revocation_date
        - horizon
        - pool_version
      output: "Q"
      source_ids:
        - ghg-product-2011
    - id: goods_count_balance
      applies_to: "retail"
      rule: "Goods-only count: G_close=G_open+R_supplier+R_customer-H_customer-H_supplier-C_condemn-T_internal-M_missing+epsilon_G. Each event ID occurs once; gross H_customer already contains unaccepted handovers. C_condemn removes goods once; later waste dispatch is not another goods exit. Confirmed missing M_missing is distinct from signed unresolved residual epsilon_G."
      inputs:
        - G_open
        - R_supplier
        - R_customer
        - H_customer
        - H_supplier
        - C_condemn
        - T_internal
        - M_missing
        - epsilon_G
        - event_id
      output: "G_close"
      source_ids:
        - ghg-product-2011
    - id: held_waste_balance
      applies_to: "retail"
      rule: "Held-waste kg: W_close=W_open+K_condemn-K_dispatch-K_transfer-K_missing+epsilon_W. K_condemn is actual whole-package kg linked to condemned original IDs, never a count in kg. K_dispatch is direct weighed net whole-carrier kg; this stock equation is QA only. Unknown residual blocks completeness; preserve signed values without zero-clamping."
      inputs:
        - W_open
        - K_condemn
        - K_dispatch
        - K_transfer
        - K_missing
        - epsilon_W
        - original_id
        - event_id
        - scale_id
      output: "W_close"
      source_ids:
        - jrc-retail-2013
    - id: source_partition
      applies_to: "failed_original_pack"
      rule: "For each c require N_c=S_c+F_c+T_c+O_c; q_failed_c=F_c/Q. Attach full matching V_c exactly once, excluding S/T/O portions. Physical transport and handovers do not alter the equation without responsibility evidence. Sum only identical whole-source model vectors; heterogeneous source versions remain separate."
      inputs:
        - N_c
        - S_c
        - F_c
        - T_c
        - O_c
        - V_c
        - Q
        - original_id
        - source_version
        - responsibility_evidence
      output: "q_failed_c"
      source_ids:
        - ghg-product-2011
    - id: electricity_quantity
      applies_to: "electricity"
      rule: "E_attr=E_direct+sum_c(E_active_c*a_active_c+E_idle_c*a_idle_c+E_fixed_c*a_fixed_c); electricity_MJ=3.6*E_attr/Q. Use the disjoint source and driver definitions of allocation_shared; MJ conversion once."
      inputs:
        - E_direct
        - E_active_c
        - E_idle_c
        - E_fixed_c
        - a_active_c
        - a_idle_c
        - a_fixed_c
        - active_minutes
        - reserved_equipment_h
        - reserved_m2h
        - meter_id
        - parent_id
        - Q
      output: "electricity_MJ"
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - id: terminal_quantity
      applies_to: "whole_pack_waste"
      rule: "q_waste=K_dispatch/Q; each dispatch net mass is measured gross minus actual reusable/outside tare for that consignment. No stock correction or extra content/composition/lifetime multiplier. treatment scope must exclude duplicate source manufacture and actual outside transport already included."
      inputs:
        - K_dispatch
        - gross_dispatch_kg
        - outside_tare_kg
        - consignment_id
        - receiver_id
        - treatment_scope
        - Q
      output: "q_waste"
      source_ids:
        - jrc-retail-2013
    - id: custody_quantities
      applies_to: "customer_pack_handover; supplier_pack_handover"
      rule: "q_customer=H_customer/Q; q_supplier=H_supplier/Q. These are gross physical satellite movements, including repeated events, independent of final service Q and S/F/T/O ownership; never use gross handovers as Q."
      inputs:
        - H_customer
        - H_supplier
        - event_id
        - original_id
        - Q
      output: "q_customer; q_supplier"
      source_ids:
        - ghg-product-2011
    - id: module_asset_replacement
      applies_to: "all inventory rows"
      rule: "f_old_h=e_h/L_a; f_new_h=e_actual_h/E_actual; E_actual=sum_all_h(e_actual_h); delta_h=f_new_h*V_new-f_old_h*V_old. Apply each historical delta to its original raw source numerator/pool and denominator version, including capital, terminal carrier and asset-owned transport, per asset_history."
      inputs:
        - e_h
        - L_a
        - e_actual_h
        - E_actual
        - f_old_h
        - f_new_h
        - V_new
        - V_old
        - asset_id
        - beneficiary_id
        - original_pool
        - original_denominator
        - allocation_version
      output: "delta_h"
      source_ids:
        - ghg-product-2011
    - id: complete_aggregation
      applies_to: "all inventory rows"
      rule: "For each external module m declare quantity_mode and use exactly one mode: if supplied as normalized y_m_r restore raw attributed compatible exchange numerator X_m_r=y_m_r*D_m using its evidenced original denominator D_m; if supplied as original raw X_m_r retain that amount directly, never multiply by D_m again. Both modes bind the actual pool/source/version and attribution_level. Resolve prior allocation/ownership once using allocation_shared, digital_completion, asset_history, transport_ownership and materials_completion. Replace historic versions rather than add them. For each identical flow identity/type/property/unit/boundary r: q_complete_r=(X_core_r+sum_disjoint_m(X_m_r))/Q; X_core_r uses raw core electricity3.6*E_attr MJ, failed-original F_c Item(s), whole-waste K_dispatch kg and respective custody H counts. electricity_MJ is already divided by Q and must be restored by its original Q or use raw3.6*E_attr exclusively, never divide it a second time. Never omit F/AC or add them twice. Do not add kg to MJ or raw to normalized amounts. Deduplicate actual constituent/event/time/asset/stage IDs; distinct providers are insufficient. Complete scope requires source-by-source matched atomic cards and all required modules, not an unverified bundle name."
      inputs:
        - quantity_mode
        - y_m_r
        - D_m
        - X_m_r
        - X_core_r
        - E_attr
        - electricity_MJ
        - F_c
        - K_dispatch
        - H_customer
        - H_supplier
        - Q
        - module_id
        - source_id
        - original_pool
        - original_denominator
        - attribution_level
        - source_version
        - constituent_id
        - event_id
        - asset_id
        - stage
      output: "q_complete_r"
      source_ids:
        - ghg-product-2011
    - id: shared_source_fractions
      applies_to: "electricity"
      rule: "For each disjoint measured source use a_source_h=d_source_h/sum_all(d_source_h). Active source d is actual occupied equipment minutes; equipment idle/fixed d is reserved_equipment_h; place lighting/fan idle/fixed d is reserved_m2h. All beneficiaries including idle/closed/zero-sale retained; sum shares1 and same-unit source reconciliation mandatory. No source mode change without new evidence/version."
      inputs:
        - source_mode
        - d_source_h
        - active_minutes
        - reserved_equipment_h
        - reserved_m2h
        - all_beneficiaries
        - meter_id
        - source_version
      output: "a_source_h"
      source_ids:
        - ghg-product-2011
    - id: digital_source_fractions
      applies_to: "all inventory rows"
      rule: "Only under completion_gate: partition remote source quantities before allocation. Basket active share=line_CPU_ms/sum_basket(line_CPU_ms); fixed compute share=core_hours/sum_all(core_hours); link share=reserved_Mbps_h/sum_all(reserved_Mbps_h) on a unique connection_interval. Retention share a_capture_h=protected_display_m2_h*coverage_h/sum_all(protected_display_m2_h*coverage_h); allocate actual stored_bytes*retention_h along frozen original capture_cell_id/capture_map_version after disjoint area-time partition. Each original source is attributed once; GB and GiB conversions are exclusive explicit modes."
      inputs:
        - active_CPU_ms
        - basket_id
        - line_CPU_ms
        - core_hours
        - reserved_Mbps_h
        - connection_interval
        - stored_bytes
        - retention_h
        - protected_display_m2_h
        - coverage_h
        - capture_cell_id
        - capture_map_version
        - all_beneficiaries
        - GB_or_GiB
        - source_version
      output: "digital_source_share"
      source_ids:
        - ghg-product-2011
    - id: transport_source_fractions
      applies_to: "all inventory rows"
      rule: "Only under completion_gate: loaded d_consignment_segment=reserved_capacity_t*segment_km under evidenced mass capacity constraint; trip source share=d_consignment_segment/sum_all(d_consignment_segment). Empty distance shares=reserved_t/all_reserved_t; stationary idle shares=reserved_t_h/all_reserved_t_h. Actual loaded service=consignment_gross_t*distance_km. Provider quantity already at consignment level skips repeat trip-source share; original F/first-use/asset owner fraction remains unless already at exact final responsibility/pool. Missing positive driver/provider coverage blocks completeness."
      inputs:
        - trip_id
        - segment_id
        - reserved_capacity_t
        - segment_km
        - mass_capacity_evidence
        - capacity_constraint
        - reserved_t
        - all_reserved_t
        - reserved_t_h
        - all_reserved_t_h
        - consignment_gross_t
        - distance_km
        - empty_vehicle_km
        - stationary_h
        - attribution_level
        - original_pool
        - source_version
        - all_beneficiaries
      output: "transport_source_share"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: identity_complete
      applies_to: "all inventory rows"
      requirement: "Unbound rows require direct official Product/Waste flow read with exact identity, public state, bilingual name, reference property/unit chain and actual state/interface; retain original/receipt hashes. Service output must remain a service, not a fertilizer flow or property UUID. Before deployment resolve quantity protocol, provider boundary and background for each row; no search hit establishes identity."
      evidence: "Official original response, matching integrity receipt and row/provider scope assessment"
    - id: metrology
      applies_to: "all inventory rows"
      requirement: "Use calibrated scales/meters and synchronized event clocks; retain serial, calibration dates/range/resolution, uncertainty, missing interval and replacement versions. Record actual kg/Item(s)/kWh separately; label data are specification checks only. No invented fill, bag tare, formulation assay, density, emission factor or legal threshold."
      evidence: "Calibration certificates, raw logs, label/lot and mass-balance review"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Zero means measured/evidenced absence within scope, not unknown. Keep open source responsibility, signed physical residuals, failed cohorts and unknown receiver/provider scope explicit; publish partial core disclosure until completion_gate is satisfied. Chinese must translate every field, condition, negation, formula and duty with matching stable IDs."
      evidence: "Scope survey, same-source closure ledger, bilingual audit and module source reconciliation"
validation_rules:
  - rule_id: validate_scope
    applies_to: "all inventory rows"
    rule: "Reject completeness if mixed-assortment store status, exact prilled formulation/pack BOM/lot, manual ambient route, original seal/state and equipment/receipt applicability gates lack evidence; a change in SKU, route or source vector requires a separate compatible pool and review."
    source_ids:
      - un-cpc3-62172
      - yara-complex
      - yara-storage
  - rule_id: validate_ledgers
    applies_to: "all inventory rows"
    rule: "Check final_q, goods_count_balance and held_waste_balance independently with linked event IDs, same original source S/F/T/O and no duplicate customer exits. Every confirmed missing package is assigned F or evidenced T; unresolved residual/open source is not zero. Late return/revocation revisions replace original denominator and numerator histories together."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_projection
    applies_to: "all inventory rows"
    rule: "All final card amounts use reference_flow basis and one Q division, except output service fixed1. Verify actual parsed protocols point to this process and include every linked row, calculation Inputs preserve bare variables and both languages have equal corresponding arrays and complete translated content. Sync normally twice with byte-stable second output."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_completion
    applies_to: "all inventory rows"
    rule: "Core-only results shall state partial incremental core; prohibit complete-business, fertilizer-production, nutrient-equivalence, crop benefit, safe-use/legal-conformity or full-standard-conformance claims. Full retail extension requires complete_aggregation, actual matched providers, exact source deduplication, historical asset corrections and reviewed state-specific incidents. Unverified flow or missing module remains an explicit limitation."
    source_ids:
      - ghg-product-2011
      - jrc-retail-2013
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Partial incremental core retail service; complete retail extension only through completion_gate and complete_aggregation"
  allowed_use: "Same verified SKU/route core comparison with identical disclosed scope; explicit downstream GOODS adds successful S background once"
  excluded_use: "Whole CPC leaf, fertilizer production, farm application, nutrient-equivalence, agronomic benefit, legal/safety approval or whole-standard conformity"
  required_metadata: "Exact SKU/lot/BOM; manufacturer specification and current applicable SDS; site/time/horizon; original IDs; source/pool/denominator versions; actual amounts; boundaries and module status"
  required_quality_disclosure: "Candidate; unverified service/commodity/custody/waste flow IDs; historical AC identity observation; full provider matching and source/module closure pending actual measurements"
  update_trigger: "SKU/formulation/pack/source/route change, late acceptance/return, incident, asset retirement/life revision or source-provider boundary revision"
