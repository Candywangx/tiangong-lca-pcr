system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "all inventory rows"
      rule: "Use one actual homogeneous YaraMila COMPLEX 25 kg-labelled original-bag SKU, prilled nitrophosphate/SOP formulation 12-11-18 with Mg/S/micronutrients, one actual packaging model/BOM and supplier receiving boundary per pool. A real mixed-assortment walk-in store must document other merchandise classes; a non-exclusive brand agreement does not establish a non-specialized store. No actual site or stock is asserted by the representative manufacturer specification."
      source_ids:
        - un-cpc3-62172
        - yara-complex
    - rule_id: route_gate
      applies_to: "all inventory rows"
      rule: "This is a partial incremental core: all attributed on-site AC electricity, failed original-package upstream responsibility and intact bag disposition. Receipt to final valid in-person acceptance is covered, including holding, failed/refused attempts, returns and closures. Exclude blending, repacking, open-bag sales, pesticide/liquid fertilizer, 600 kg bags, delivery to customers and farm application. The core is not complete retail business; completion_gate and complete_aggregation are mandatory before that claim."
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - rule_id: fertilizer_state
      applies_to: "all inventory rows"
      rule: "Record actual seals, bag integrity, prill condition, moisture exposure, temperature history, lot label and current applicable SDS; manufacturer dust-free wording or an intact seal is not measured zero release. Record daily inspections and every incident. Broken/opened bags, dust escape, wet/dissolved fertilizer, decomposition, fire or uncertain mass loss block route completeness; preserve actual quantities, species/state, internal/external path and recipient and author reviewed matching atomic cards/protocols in both languages before inclusion. Never apply agricultural N2O/NH3 factors, label nutrient percentages or legal limits as measured retail emissions. No default compliance, no default zero."
      source_ids:
        - yara-complex
        - yara-storage
    - rule_id: goods_ownership
      applies_to: "failed_original_pack"
      rule: "For each original whole-package source vector V_c at the same receiving gate conserve S_c+F_c+T_c+O_c=N_c in original packages: S is the unique finally valid customer-held original; F is confirmed failure/loss with retailer background responsibility (including retained waste and external failed retention); T is evidenced continuing responsibility accepted by supplier or a named successor; O is still-open/unresolved responsibility. Successful S manufacture, original package and upstream receiving transport are outside this incremental core; downstream GOODS may add S once. failed_original_pack is the real Product input F_c/Q linked to full V_c including actual contents, whole bag body/closure/liner/label/adhesive and receiving transport. T retains those same original source IDs and obligations with the receiver; O is not zero or discarded. A supplier return physically moving a bag does not by itself prove T. A later resale transfers the same original source rather than creating manufacture again."
      source_ids:
        - ghg-product-2011
    - rule_id: whole_source
      applies_to: "failed_original_pack; whole_pack_waste"
      rule: "A whole-source package is permitted only with actual supplier inventory and signed boundary/model evidence for the exact contents and complete package. Web specifications establish feasible product/form, not quantified LCI, bag polymer purity, actual fill, bag tare, legal compliance or provider completeness. Do not treat 25 kg nominal fill as actual receipt or whole-package mass; weigh traceable same-lot net content and whole package separately with gross/tare and moisture basis. Use either whole-source V_c or verified separate component supplier vectors, never both. Different component responsibilities require concrete separate cards and source-conserving vector decomposition, not a mass fraction of a heterogeneous environmental vector."
      source_ids:
        - yara-complex
        - ghg-product-2011
    - rule_id: physical_satellites
      applies_to: "customer_pack_handover; supplier_pack_handover"
      rule: "Only customer_pack_handover and supplier_pack_handover are non-characterized custody satellites. They document actual gross intact-package movements and do not generate a second manufacturing background. failed_original_pack is expressly not a satellite. All receiving/returning raw events remain in cp_goods for physical reconciliation. Customer gross handovers include unaccepted events; do not subtract the never-accepted subset again. External retained failures remain a named recipient/state with F or evidenced T responsibility, never automatically retailer waste. Revocation without movement reclassifies original acceptance, not another physical exit."
      source_ids:
        - ghg-product-2011
    - rule_id: waste_boundary
      applies_to: "whole_pack_waste"
      rule: "The terminal carrier is one actual unopened intact original bag containing unchanged prilled product condemned unsaleable for a documented reason. Receiver must sign acceptance of actual contents, bag components and state, with matching complete treatment boundary. Direct consignment net kg includes product plus its original bag, excludes reusable transport pallets and outside containers; no parallel bag/component/contents waste rows. Condemnation is goods-to-held-waste transfer, not dispatch. Dispatch kg are directly measured, not reduced again by stock corrections. If contents/state differ or receiver splits the carrier outside this boundary, document provider continuation or extend the method before completion. No recycling credit by default."
      source_ids:
        - yara-storage
        - jrc-retail-2013
    - rule_id: completion_gate
      applies_to: "all inventory rows"
      rule: "A complete retail-service dataset must add disjoint actual source modules for building shell/fitout/fixed lighting and fan capital, shelving/manual trolley/checkout and ICT/security capital, remote internet/compute/payment/security/admin operations, cleaning/water/materials and their terminal carriers, maintenance and independent source/asset/material/waste transport. All on-site electricity already belongs to core electricity and is excluded from modules. For each named module use cp_completion, allocation_shared, asset_history, transport_ownership and complete_aggregation; retain actual scope manifest, original denominators, full constituent/event/time/asset/stage source IDs, versions and evidenced absence. Missing evidence leaves partial core, not complete business. Before exporting extra exchanges require concrete atomic flow cards, protocols, bilingual translation and normal structured sync."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - rule_id: route_equipment
      applies_to: "all inventory rows"
      rule: "The selected manual-handling ambient route requires evidenced absence of on-site combustion, refrigerant equipment, powered vehicle handling, agricultural use and new sales packaging/receipt paper. Document actual equipment survey, connected circuits, cleaning method, electronic receipt records and customer collection at store. Natural ventilation is not proof of zero fertilizer loss. If a relevant excluded route exists, do not silently omit its gas/refrigerant/fuel/paper/material burdens; suspend completeness pending a measured state-specific reviewed extension. Do not add unrelated generic gas cards to represent unknowns."
      source_ids:
        - yara-storage
        - jrc-retail-2013
