      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_scope | all inventory rows | Reject completeness if mixed-assortment store status, exact prilled formulation/pack BOM/lot, manual ambient route, original seal/state and equipment/receipt applicability gates lack evidence; a change in SKU, route or source vector requires a separate compatible pool and review. | un-cpc3-62172; yara-complex; yara-storage |\n| validate_ledgers | all inventory rows | Check final_q, goods_count_balance and held_waste_balance independently with linked event IDs, same original source S/F/T/O and no duplicate customer exits. Every confirmed missing package is assigned F or evidenced T; unresolved residual/open source is not zero. Late return/revocation revisions replace original denominator and numerator histories together. | ghg-product-2011 |\n| validate_projection | all inventory rows | All final card amounts use reference_flow basis and one Q division, except output service fixed1. Verify actual parsed protocols point to this process and include every linked row, calculation Inputs preserve bare variables and both languages have equal corresponding arrays and complete translated content. Sync normally twice with byte-stable second output. | ghg-product-2011 |\n| validate_completion | all inventory rows | Core-only results shall state partial incremental core; prohibit complete-business, fertilizer-production, nutrient-equivalence, crop benefit, safe-use/legal-conformity or full-standard-conformance claims. Full retail extension requires complete_aggregation, actual matched providers, exact source deduplication, historical asset corrections and reviewed state-specific incidents. Unverified flow or missing module remains an explicit limitation. | ghg-product-2011; jrc-retail-2013 |\n\n"
