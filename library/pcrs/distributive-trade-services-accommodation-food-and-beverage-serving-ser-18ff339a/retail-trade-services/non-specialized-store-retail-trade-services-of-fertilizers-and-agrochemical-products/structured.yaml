      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| pool_and_acceptance | retail | Before observations fix site, exact SKU/pack/source version, route, calendar interval, stock-origin IDs and closure/return horizon as a same-configuration pool. Retain all failed, idle, closed and zero-sale periods. Q counts distinct original package IDs whose final in-person acceptance is valid at the stated horizon; repeated handovers/resales count that original at most once. A revoked acceptance removes it even without physical return; a purely financial refund/discount with valid acceptance does not. Do not subtract revocations again after counting final-valid IDs. A late return replaces original-pool Q, fate/background and attributable numerator versions with actual dates; never charge the same event to a later pool. Q=0 is unnormalizable and is retained in the declared pool/extension with its burdens, never deleted or divided. | ghg-product-2011 |\n| allocation_shared | all inventory rows | Prefer disjoint measured source circuits/events. For each actual circuit first partition measured E_direct, E_active, E_idle and E_fixed in kWh from logged states, reconciling sum to parent meter. Subtract a submeter only when contained in that parent. Direct records carry actual original pool. Shared active handling/checkout kWh use measured equipment-occupied minutes for every beneficiary. Equipment idle/fixed checkout/ICT/security/trolley-associated kWh use actual reserved equipment-hours; place lighting/fan idle/fixed kWh use reserved floor-area-hours including closed and zero-sale periods. Keep these actual source numerator pools disjoint, require their complete measured state/source scopes and reconcile compatible kWh to the parent. Each disjoint source uses one same-unit driver d and a_h=d_h/sum_all(d); denominators must be known and positive. Allocate source quantity once, then sum compatible attributed kWh. Never sum minutes with equipment-h, m2*h or electricity as one driver; unmeasured state partition or all-zero driver blocks allocation, not equal-share/default zero. | ghg-product-2011; jrc-retail-2013 |\n| digital_completion | all inventory rows | Internet connection intervals are unique Mbps*h reserved-capacity records across all beneficiaries; provider quantities in connection-hours use that interval fraction once. Do not duplicate them as overlapping active/idle/fixed electricity hours. Remote payment/admin active compute uses measured task CPU-ms by original line; a shared basket authorization is split by actual logged line CPU-ms summing to its event total, never one whole attempt per SKU. Remote fixed compute capacity uses reserved core-hours, remote security retention uses actual byte-hours: record bytes and capture period. Fix a_capture_h=protected_display_m2_h*coverage_h/sum_all(protected_display_m2_h*coverage_h) from actual beneficiary protected/display area within the original field of view times covered duration; partition overlapping views into disjoint area-time cells, retain vacant reservations and all beneficiaries. Freeze original capture cell/beneficiary IDs and map version; subsequent retained byte*h follows that original map, never later sales. Shares sum1; GB=10^9 bytes and GiB=2^30 bytes. Separate source numerator pools for each dimension and state. Network access alone does not include payment/security/admin backend. If counters or actual provider scope are missing, retain gap, not a fictional SKU-exclusive connection or complete bundle. | ghg-product-2011 |\n| asset_history | all inventory rows | For each actual homogeneous model/BOM/scope asset vector V_a separate manufacturing/installation, operation, maintenance and terminal treatment. Building shell/fitout including fixed lighting/fans uses beneficiary reserved m2*h / expected lifetime m2*h; shelf uses reserved shelf-m2*h / expected lifetime shelf-m2*h; trolley/checkout/ICT use actual reserved operating h / expected total lifetime reserved operating h; retain stationary idle reservation h, not distance0. e_a_h/L_a gives provisional f_old across every historic pool. At retirement replace EVERY historic share with f_new_h=e_actual_h/E_actual where E_actual=sum_all_h(e_actual_h), and replace vectors when scope/life changes: delta_h=f_new_h*V_new-f_old_h*V_old; never restart manufacture. Maintain cumulative fractions<=1, all beneficiaries and residual QA; residual is not a shortcut for changed exposures. Repairs are real dated material/service events unless signed complete package covers them. Terminal carrier and asset-associated inbound/repair/retirement transport follow the same historic f once, not f twice or current retirement Q. A directly weighed terminal whole device already excludes removed parts; component reconstruction is exclusive. Provider-contained EOL/carriers are not extra foreground waste. | ghg-product-2011 |\n| transport_ownership | all inventory rows | Map each transport source trip/segment to actual consignment first and then original source owner/pool/version. Loaded road segment activity is measured gross consignment t*km, allocated source-to-consignment by d_consignment_segment=reserved_capacity_t*segment_km when sharing; retain capacity tonnes and all consignments. This driver requires evidence of actual mass-constrained capacity and reserved tonnes for that segment; unknown or volume-constrained activity requires a reviewed matching capacity method before completeness, never an invented tonne reservation. Empty reserved segments use actual vehicle-km allocated by reserved tonne-capacity share, stationary idle fuel/time by reserved tonne*h share, not zero t*km. Match an actual provider covering each observed loaded/empty/idle state, adding disjoint vehicle-distance or stationary service only when absent from provider. Unknown coverage blocks completion. A provider assigned to consignment skips only repeat trip allocation; apply F/first-use/asset historic ownership still unless already assigned to exact final responsibility/pool. Original goods receiving transport follows S/F/T/O at the same gate; asset transport follows asset_history; material transport follows first-use ownership. Compare actual events/time/assets/stages, not merely different provider IDs. | ghg-product-2011; jrc-retail-2013 |\n| materials_completion | all inventory rows | For actual cleaning/water/material sources retain formulation/model/lot and separate never-used stock from previously-used stock. Acquisition and inbound transport follow measured first-use source quantities; unused transfer/return retains unassigned original source, reused material never repeats manufacture/transport. Metered facility water is imported volume and already excludes internal reuse; do not subtract reuse. Direct effluent is actual V_discharge*rho_discharge with measured density and whole liquid-carrier net mass; do not subtract evaporation/storage again. Cleaning formulation-origin kg partition mutually exclusive unused/used-retained/customer/solid-export/container-residue/liquid-export destinations; used-to-rinsed is a replacement state. Added rinse water/dirt are not original formulation. Direct wet wipe/container/effluent kg are distinct whole-carrier measurements, not multiplied again by origin fractions. Collect source constituents/receiver acceptance and separate dispatch from generation/stock. Unknown chemical/species/state requires named atomic extension before completeness. | jrc-retail-2013; ghg-product-2011 |\n\n"
