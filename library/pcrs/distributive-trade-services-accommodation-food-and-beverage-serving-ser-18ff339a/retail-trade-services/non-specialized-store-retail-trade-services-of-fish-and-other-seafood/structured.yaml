allocation_rules:
  - rule_id: same_configuration_pool
    applies_to: "retail_service"
    rule: "Declare prospective site/cabinet/species/cut/pack configuration and observation window; include failed, closed, idle and zero-sale cohorts. Retain cross-period stock and late returns by original goods ID. Q = successful accepted net flesh; reverse physically returned or later disqualified quantities in their original Q and revise original numerator/fates too. A refund/discount alone changes neither physical stock nor Q. Repeated handling/resale is not new net service for a previously counted mass unless the earlier acceptance was reversed. Entire zero-Q pools remain unnormalizable and are carried to the declared same-configuration pool; never erase them."
    source_ids:
      - ghg-product-2011
  - rule_id: causal_allocation
    applies_to: "all inventory rows"
    rule: "Prefer disjoint direct meters and event subdivision. Allocate shared refrigeration using measured occupied shelf-volume-hours across all beneficiaries, supported by load/temperature evidence; allocate idle periods by predeclared reserved capacity-hours, retaining losses and failures. Full beneficiary shares must sum to one and reconcile to each measured pool. If the driver is absent or unjustified, report unresolved allocation. Count allocation once before dividing by D; financial revenue and default equal shares are not substitutes."
    source_ids:
      - ghg-product-2011
  - rule_id: persistent_assets
    applies_to: "cabinet_asset; cabinet_waste"
    rule: "Keep asset ID ledger across periods and beneficiaries. f = f_v = e_bp / E_life_v where e includes allocated idle/reserved capacity-hours and E is documented expected lifetime total installed-capacity-hours; replace all old-version allocations after any lifetime revision rather than restart manufacture. Cumulative manufacturing fractions <= 1; at retirement distribute the remaining 1-sum(previous corrected fractions) by final measured lifetime beneficiary exposure. Terminal f_end is the final corrected lifetime beneficiary share, applied to terminal carrier once, never multiplied by manufacture f again. Record corrections in original cohort versions."
    source_ids:
      - ghg-product-2011
  - rule_id: fates_no_credit
    applies_to: "rejected_pack_waste; external_failed_goods"
    rule: "Do not allocate service output to failed goods, donor retention or supplier return before qualified acceptance. External refusal is F with actual recipient/state and continuing gate responsibility, not automatic retailer waste. Recycling/disposal treatment belongs to actual carrier and recipient; keep provider transport, recovery and treatment boundary disjoint; no speculative energy, recycling or resale credit."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "cold_retail"
      flow_role: "Goods acceptance, stock, loss and background"
      record_type: "original foreground record"
      raw_fields: "goods_id; supplier_lot; species; origin; cut; pack; dates; gross_pack_kg; tare_kg; free_drip_kg; net_drained_flesh_kg; Q_original; Q_reversed; H_gross; R_phys; S; F; recipient; state; final_owner; gate_background; SKU; label_net_kg; sample_id; age_stratum; drain_time; drain_mesh; drain_temperature; sample_flesh_kg; sample_pack_pad_kg; sample_free_liquid_kg; r_f; sample_recipient; uncertainty; R_i; R_flesh; d_i; k_i; w_is; w_if; w_iopen; w_iF; B_s; B_f; B_open; B_f_service; B_f_continuing; B_f_provisional; F_receipt; consumer_pack_sourced_removed_mass; source_component_matrix"
      collection_method: "At receiving, each handover, return, loss and closing count, scan each pack and calibrated scale record. Verify net flesh by representative destructive sampling within same SKU, supplier lot and receipt/dispatch storage-age strata: first weigh intact unopened pack, then pair net flesh, pack/absorbent and free liquid weights under a declared fixed drain time, mesh and temperature without squeezing; measure ice separately, and any ice invalidates this never-frozen route. Define r_f = sum(sample drained flesh)/sum(matched sample labelled net content) within stratum; estimate unopened sale-pack flesh as labelled net content*r_f. Reconcile paired gross pack = flesh + pack/pad + free liquid and propagate scale, sampling and within-stratum variation uncertainty to D, F, loss and stock; invent neither precision nor sample count. Receiving-gate background must use the same net-flesh basis; a juice-inclusive production basis cannot be combined with juice-exclusive D without conversion. Retain each sampled pack as a physical removal event with original ID, sample recipient/state and final disposition; samples are not service, external retention is F or actual disposal uses its whole carrier, never deleted. Actual sale packs remain sealed; unseparated drip accompanies goods and is not retailer effluent/loss. Record actual acceptance specification, temperature/history, integrity and shelf-life decision; no numerical compliance default. Apply calc_service and calc_background; one final division by positive D; keep original cohort corrections and free-liquid ledger separate Pair source-resolved receipt and terminal samples within SKU/lot/storage-age strata to measure R_i-to-d_i k_i and every final-fate mapping; intact packs follow IDs, true splits use measured flesh and its derived liquid portions to derive w fractions. Use identical draining procedure at receiving and terminal; record design, variation and uncertainty for longitudinal representative packs or matched same-lot controls, never default conversion one. Attribute original receiving flesh of an intact accepted pack, including its later contained drip, to B_s; each R_i fate shares close to one, unknown remains B_open rather than loss. Build original-consumer-pack source matrix for actual waste/drain portions; imported water/cleaner in J, bags and cases cannot enter pack stock closure."
      unit: "kg"
      frequency: "Each event and each supplier lot audit; inventory closure daily"
      temporal_coverage: "All receiving, refused and successful packs, zero-sale intervals and late returns through cohort reconciliation"
      site_scope: "Receiving gate to pickup desk and all actual recipients"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration with traceable masses before/after campaign; lot audit design, uncertainty, stock reconciliation, traceability and acceptance evidence"
    - protocol_id: cp_energy
      process_id: "cold_retail"
      flow_role: "Cabinet electricity"
      record_type: "original foreground record"
      raw_fields: "meter_id; circuit_map; timestamps; kWh_start; kWh_end; reset; cabinet_id; temperature; occupied_volume_hours; reserved_capacity_hours; beneficiaries"
      collection_method: "Read dedicated cabinet meter with cumulative registers and interval logging; log product temperature continuously with excursion/event links and compare receiving/dispatch checks. Identify compressor/fan/defrost/integral lights; validate circuit inclusion before any subtraction. calc_energy after causal_allocation; once per 1 kg reference flow"
      unit: "kWh; h; m3*h"
      frequency: "Continuous interval logging with daily register reconciliation"
      temporal_coverage: "Full campaign including nights, closed days, idle and repair"
      site_scope: "One cabinet and every actual shared beneficiary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter accuracy/calibration certificate, timestamp/reset audit and temperature probe check against traceable reference"
    - protocol_id: cp_liquids
      process_id: "cold_retail"
      flow_role: "Cleaning supply and combined drain"
      record_type: "original foreground record"
      raw_fields: "event_id; fresh_volume; water_temperature; water_density; cleaner_product; SDS; concentration; cleaner_mass; outlet_volume; effluent_density; fish_drip; condensate; reuse; storage"
      collection_method: "Meter cabinet fresh-water branch and actual drain; weigh whole cleaner solution dispensed. Measure density with calibrated mass/volume at recorded temperature; take representative whole-liquid composite each cleaning/defrost regime and record dissolved fish/cleaner for characterization. Route defrost to the measured shared drain or document separately captured carrier with added card. calc_liquids after direct attribution; actual J once per 1 kg reference flow; separate supply reconciliation"
      unit: "m3; kg; kg/m3"
      frequency: "Each cleaning and defrost event; daily cumulative meter readings"
      temporal_coverage: "Full campaign and all regimes including spill/repair events"
      site_scope: "Cabinet cleaning branch and final drain transfer, not whole-site sewer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, calibrated scales/volumetric vessel, sample chain, density temperature and drain recipient/treatment acceptance"
    - protocol_id: cp_materials
      process_id: "cold_retail"
      flow_role: "Added bag and discarded complete carriers"
      record_type: "original foreground record"
      raw_fields: "event_id; product_lot; bag_count; sample_net_mass; opening; purchase; closing; Z; K; U; full_carrier_mass; composition; recipient; treatment; provider_transport"
      collection_method: "Weigh each waste dispatch on calibrated scale, tare external collection bins; intact rejected packs stay whole with recorded fish/pack/drip composition. Weigh same-lot complete bags and reconcile count ledger; segregate removed cardboard from consumer packs. calc_materials after one attribution; per 1 kg reference flow"
      unit: "kg; count"
      frequency: "Each issue/dispatch; each bag lot sampling; daily ledger closure"
      temporal_coverage: "Full campaign, all fates including failed sales"
      site_scope: "Retailer control to actual carrier recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale checks, sampling coverage/uncertainty, receipts and waste-provider scope excluding duplicate transport/treatment"
    - protocol_id: cp_assets
      process_id: "cold_retail"
      flow_role: "Complete cabinet lifetime, repairs and terminal"
      record_type: "original foreground record"
      raw_fields: "asset_id; manufacturer; model; serial; A; installation_scope; capacity; e_bp; E_life_v; life_version; prior_fractions; G; H; A_end; terminal_mode; removed_parts; factory_charge; recovery"
      collection_method: "Obtain traceable whole installed cabinet weighing or manufacturer complete-machine mass verified to configuration; never invent mass. Record cumulative capacity-hours across sites/users, actual repairs and complete gaskets with calibrated net weights; at retirement directly weigh drained cabinet, or use documented component-BOM reconstruction exclusively. calc_asset for A/A_end and calc_materials for G/H, one final D division; never restart old manufacture"
      unit: "kg; m3*h"
      frequency: "Installation, every period and repair, every lifetime revision and terminal event"
      temporal_coverage: "Entire life ledger retained including earlier/future beneficiary corrections"
      site_scope: "One physical cabinet including integral components; excludes common premises modules"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Mass certificates, bill of components, dated lifetime evidence, fractions sum audit, repair invoices, recovery and terminal treatment receipt"
    - protocol_id: cp_refrigerant
      process_id: "cold_retail"
      flow_role: "Propane custody and final atmospheric transfer"
      record_type: "original foreground record"
      raw_fields: "installed_gate_id; installed_gate_time; installed_charge_raw; initial_factory_charge_raw; pre_gate_commissioning_charge_raw; pre_gate_commissioning_loss_raw; commissioning_provider_scope; purchased_makeup_raw; asset_id; event_id; species; opening_charge_raw; T_raw; closing_charge_raw; R_raw; other_circuit_transfer_raw; recovery_store_open_raw; recovery_store_close_raw; R_circuit_sent_raw; reused_recovery_raw; other_recovery_transfer_raw; air_storage_start_raw; air_storage_end_raw; capture_storage_start_raw; capture_storage_end_raw; captured_air_sent_raw; custody_id; C_in_kg_m3_raw; C_out_kg_m3_raw; F_in_m3_h_raw; F_out_m3_h_raw; blank_mode; blank_concentration; temperature; pressure; dry_wet_basis; regime_duration_h; beneficiary_event_share; f_end"
      collection_method: "At every intervention retain unallocated raw technician calibrated cylinder before/after weights and custody plus circuit/recovery storage. Measure air-species and air-capture-only storage at start/end separately as signed disjoint inventory changes; capture storage excludes R_raw already extracted from the circuit. Actual outside flux uses synchronized absolute inlet/outlet C (kg/m3) times respective F (m3/h), converted to the same gas temperature, pressure and dry/wet basis. Blank mode chooses either one blank deduction from raw concentration or already blank-corrected concentration; never both. outside_flux_raw = integral(C_out_corrected*F_out-C_in_corrected*F_in) dt, summed over each actual vent and measured emitting regime in hours to kg; inlet already accounts for room/ambient background, never subtract it again. Do not multiply undefined air-mass flow by volume concentration. Reconcile with L_out_raw and measured storage/capture changes; retain instrument coverage, detection limits and gap uncertainty; unknown below-limit flux is not zero. Close raw quantities under calc_refrigerant first, then apply explicit event/terminal beneficiary shares, and divide by D once. At the post-initial-commissioning installed handover gate record gate ID/time and measured contained installed_charge_raw; this is first-interval opening_charge_raw once, with closing stock carried thereafter, never an additional factory-charge input. Retain original factory/initial-commissioning charge and pre-gate loss evidence plus actual manufacture/installation provider-package scope; pre-gate responsibility is counted once there, and unknown coverage cannot be assumed. For each post-gate event separately weigh purchased_makeup_raw from new supply and reused_recovery_raw; reconcile T_raw to their sum, and only purchased_makeup_raw enters numerator T. Actual post-gate repair/recommissioning losses belong to foreground outside flux, verifying the provider does not also include the same event; terminal retained charge is never another new input."
      unit: "kg; kg/h; h"
      frequency: "Every intervention; synchronized continuous absolute concentration/volume-flow in each emitting regime and start/end storage measurements"
      temporal_coverage: "Full campaign and terminal recovery; retain gaps as unresolved"
      site_scope: "Cabinet circuit, store air and actual outside transfer planes"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Cylinder/flowmeter calibration, gas analyzer standards, blank/inlet data, measured temperature/pressure, custody IDs and gap/uncertainty report"
    - protocol_id: cp_transport
      process_id: "cold_retail"
      flow_role: "Actual outbound loaded and empty legs"
      record_type: "original foreground record"
      raw_fields: "trip_id; leg_id; vehicle; route; load_kg; loaded_km; empty_km; timestamps; recipient; shared_load_driver; provider_scope; inbound_gate_exclusion loaded_attribution_mode; target_gross_kg; vehicle_total_gross_kg; target_payload_kg; all_other_payload_kg; provider_reference_unit; provider_attribution_level"
      collection_method: "Read GPS/odometer and weigh gross carrier loads for every actual supplier-return/waste trip. Retain failed collection/positioning/return legs and test loaded-provider coverage of the observed empty route; obtain operational/manufacture and refrigeration scope. Provider transport inside treatment is excluded by explicit trip IDs. calc_transport; assign shared activity once and divide once per 1 kg reference flow Tag every scale reading as whole vehicle or target consignment before calculation; check both modes against the same full manifest, provider basis and actual segment. An already target-attributed kg/t*km quantity receives no second allocation."
      unit: "kg; km; t*km; vehicle*km"
      frequency: "Every trip and leg"
      temporal_coverage: "All actual campaign outbound legs including empty/failed legs"
      site_scope: "Retail gate to named supplier or waste recipient; inbound excluded"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated payload scale, odometer/GPS checks, route invoices, provider declarations and no-overlap trip register"
  calculation_rules:
    - id: calc_service
      applies_to: "retail_service; external_failed_goods"
      rule: "D = sum(Q_original-Q_reversed); F = terminal drained flesh externally retained without qualified acceptance. Close the complete consumer-pack gross-mass ledger: opening+receipts+R_phys = closing+H_gross+S+consumer_pack_sourced_removed_mass. H_gross, R_phys and S include all original flesh, free liquid, absorbent and pack actually handed over/returned/transferred. The last term contains full Z for intact discarded packs, plus ONLY measured source-resolved portions originating in those original consumer packs for actual samples, separated/leaked liquids and other exits. It must exclude imported water/cleaner within J, added LDPE bags, outer cardboard cases and all other separately imported material. A whole J carrier cannot enter this consumer-pack balance. Keep a source-component matrix that reconciles each original-pack portion once to actual full carriers and recipients; full wastewater/waste exchanges retain their whole-carrier mass separately. Removed outer cases and added bags have separate purchase/stock/fate ledgers. Internal transfers cancel. Unseparated drip accompanies customer goods physically but is excluded from D and is not automatically retailer waste/loss. Track the measured receiving-equivalent mapping in calc_background; D must be positive before final normalization."
      inputs:
        - Q_original
        - Q_reversed
        - F
        - H_gross
        - R_phys
        - S
        - opening
        - receipts
        - closing
        - Z
        - consumer_pack_sourced_removed_mass
        - source_component_matrix
        - cp_goods
      output: "D; F; physical_closure"
      source_ids:
        - fao-fish-2013
    - id: calc_background
      applies_to: "failed_goods_background"
      rule: "Measure R_i as receiving-gate drained flesh for original pack ID i from matched receipt SKU/lot samples. At each storage-age/final-fate stratum measure paired receipt-equivalent and terminal drained flesh plus contained drip; for an intact finally accepted pack k_i = R_i / d_i and its successful gate requirement is k_i*d_i = R_i, not d_i. No default k_i=1. For split/leaked/sampled packs derive disjoint receiving-flesh fate fractions w_is, w_if and w_iopen from paired source-specific flesh/liquid measurements and unique history; include flesh-derived drip with its originating goods fate, never automatically as loss. Require measured mapping and propagated uncertainty; unavailable mapping blocks completeness. B_s = sum(R_i*w_is); B_f = sum(R_i*w_if); B_open = sum(R_i*w_iopen). During open reconciliation R_flesh = B_s+B_f+B_open; at final closure B_open=0 and R_flesh = B_s+B_f. D is terminal accepted drained flesh after reversals. Successful-goods downstream coupling MUST add B_s/D kg receiving-equivalent flesh with original packaging and actual inbound transport to the identical gate, not a default 1 kg; this partial service excludes that successful-goods production. Partition B_f = B_f_service+B_f_continuing+B_f_provisional by final background owner: true service-caused irrecoverable losses and assigned nonaccepted F enter service responsibility; reusable supplier-return/F retain traced continuing owner; unresolved F stays provisional and blocks final completeness. B = B_f_service+B_f_provisional is the failed_goods_background input numerator. Receiving-equivalent F_receipt = sum(R_i*w_iF) is a tracked subset of B_f, while physical F/D remains terminal net flesh. Revise original B_s/B_f, D and ownership on late return/resale; never charge successful goods production twice or delete a continuing responsibility."
      inputs:
        - R_i
        - R_flesh
        - d_i
        - k_i
        - w_is
        - w_if
        - w_iopen
        - w_iF
        - B_s
        - B_f
        - B_open
        - B_f_service
        - B_f_continuing
        - B_f_provisional
        - F_receipt
        - final_owner
        - cp_goods
        - D
      output: "B; B_s; B_f; F_receipt"
      source_ids:
        - jrc-retail-2013
    - id: calc_energy
      applies_to: "electricity"
      rule: "E = sum(cabinet meter kWh assigned by causal_allocation). Convert kWh to MJ with 3.6 once, then divide by D. Submeter subtraction is allowed only from the parent measured boundary containing it; independent disjoint meters are added without subtraction. Include closed hours, alarms, maintenance downtime and defrost."
      inputs:
        - meter_start
        - meter_end
        - interval
        - beneficiary_exposure
        - cp_energy
        - D
      output: "E; MJ_per_reference"
      source_ids:
        - jrc-retail-2013
    - id: calc_liquids
      applies_to: "cleaning_water; cleaner; effluent"
      rule: "W = sum(fresh imported volume * measured supply density); C = sum(whole supplied cleaner solution mass); J = sum(actual outlet volume * measured whole-effluent density) after attribution. Do not subtract evaporation, stock, reuse or cleaner from directly metered J. Separate supply balance tracks purchased-solution water, captured defrost/ambient condensate, fish drip, evaporation and storage. No reconstruction alternative is authorized. Dissolved cleaner/fish already in J must not be output again; sampling concentration is characterization, not another carrier quantity."
      inputs:
        - supply_volume
        - supply_density
        - cleaner_mass
        - concentration
        - outlet_volume
        - effluent_density
        - condensate
        - drip
        - storage
        - cp_liquids
        - D
      output: "W; C; J"
      source_ids:
        - jrc-retail-2013
    - id: calc_materials
      applies_to: "carry_bag; door_gasket; rejected_pack_waste; case_waste; bag_waste; gasket_waste"
      rule: "P,G,Z,K,U,H are disjoint observed whole-item/whole-carrier masses assigned once to the pool, then each divided by D. For bags, count * measured same-lot mean complete bag mass is allowed with tare and sampling coverage; never sum unrelated repair parts as a complete gasket. Reconcile purchased + opening - closing = handed out + discarded for bags; match waste recipient, state, actual treatment and transport exclusions."
      inputs:
        - P
        - G
        - Z
        - K
        - U
        - H
        - item_count
        - tare
        - sample_mass
        - recipients
        - cp_materials
        - cp_assets
        - D
      output: "material_mass_per_reference"
      source_ids:
        - jrc-retail-2013
    - id: calc_asset
      applies_to: "cabinet_asset; cabinet_waste"
      rule: "Manufacture A*f/D and terminal A_end*f_end/D follow persistent_assets separately. Direct terminal drained whole-device net weighing already excludes removed parts and recovered charge: do not subtract these twice. Alternative BOM reconstruction sums only components physically present at terminal, excludes recovered charge and removed components once, and is mutually exclusive with direct net weighing. Event repair inputs/outputs use calc_materials, not manufacture fractions; supplier package excludes repairs and terminal treatment."
      inputs:
        - A
        - A_end
        - e_bp
        - E_life_v
        - f
        - f_end
        - historical_fractions
        - lifetime_version
        - cp_assets
        - D
      output: "asset_mass_per_reference"
      source_ids:
        - ghg-product-2011
    - id: calc_refrigerant
      applies_to: "propane_topup; propane_recovery; propane_air"
      rule: "Establish whole-equipment physical closure with unallocated species-kg raw data: L_internal_raw = opening_charge_raw+T_raw-closing_charge_raw-R_raw-other_circuit_transfer_raw. Fix the installed gate at documented handover after initial commissioning, declaring installed_gate_id and time. For the first foreground interval opening_charge_raw = installed_charge_raw: enter actual asset-contained charge measured at that gate once as opening stock, never add initial_factory_charge_raw again; subsequent intervals carry forward prior closing_charge_raw. Factory and initial-commissioning charge supply, manufacture/installation handling and actual pre-gate commissioning losses belong to the cabinet manufacture/installation background with evidenced actual provider scope, once only; unknown coverage blocks completeness, never reinsert them into foreground T or outside emissions. After the gate T_raw = purchased_makeup_raw+reused_recovery_raw, where purchased_makeup_raw is only new purchased makeup supply actually charged into the circuit after that gate, excluding factory/initial-commissioning charge already contained in the asset; R_raw is extraction directly from the circuit, never air capture. Any post-gate recommissioning/repair losses enter this raw balance and actual outside flux as foreground responsibility, with provider-included handling scope removed to avoid overlap. Terminal remaining charge continues through closing_charge_raw/recovery history, never as another initial or makeup input. Circuit-recovery storage closure is recovery_store_open_raw+R_raw = recovery_store_close_raw+R_circuit_sent_raw+reused_recovery_raw+other_recovery_transfer_raw. Do not equate extraction with external dispatch. Independently L_out_raw = L_internal_raw-delta_air_storage_raw-delta_air_capture_retained_raw-captured_air_sent_raw. Both delta terms are measured signed end-minus-start inventories; air storage excludes capture storage, and capture storage excludes circuit-recovered charge. captured_air_sent_raw is actual pure propane recovered from leaked room air and dispatched, with custody IDs disjoint from R_raw and R_circuit_sent_raw; never deduct a circuit-recovery event twice. Recovery output raw custody total is R_sent_raw = R_circuit_sent_raw+captured_air_sent_raw. Other sorbent/mixed capture carriers require their own named cards before completeness. Only after raw balances and independent outside flux reconcile, allocate external replenishment T = allocated(purchased_makeup_raw), actual recovery export R = allocated(R_sent_raw), and L_out = allocated(L_out_raw) to beneficiaries once. Maintenance uses actual current-beneficiary event shares; terminal residual charge/recovery and associated outside transfer use final lifetime f_end once, never manufacture f again. Then divide T, R and L_out by D. Keep all raw stocks, corrections and historical beneficiary revisions; unresolved or negative incompatible closure blocks completeness."
      inputs:
        - installed_gate_id
        - installed_gate_time
        - installed_charge_raw
        - initial_factory_charge_raw
        - pre_gate_commissioning_charge_raw
        - pre_gate_commissioning_loss_raw
        - commissioning_provider_scope
        - purchased_makeup_raw
        - opening_charge_raw
        - T_raw
        - closing_charge_raw
        - R_raw
        - other_circuit_transfer_raw
        - recovery_store_open_raw
        - recovery_store_close_raw
        - R_circuit_sent_raw
        - reused_recovery_raw
        - other_recovery_transfer_raw
        - delta_air_storage_raw
        - delta_air_capture_retained_raw
        - captured_air_sent_raw
        - R_sent_raw
        - f_end
        - beneficiary_event_share
        - outside_flux_raw
        - cp_refrigerant
        - D
      output: "T; R; L_out"
      source_ids:
        - jrc-retail-2013
    - id: calc_transport
      applies_to: "loaded_transport; empty_transport"
      rule: "Choose exactly one loaded attribution mode per source/segment. target_consignment: V_load=sum(target_gross_kg/1000*loaded_leg_km) where target_gross_kg is already the measured actual target consignment gross payload; NEVER multiply shared-load share or allocation_once. unassigned_vehicle: V_load=sum(vehicle_total_gross_kg/1000*loaded_leg_km*target_payload_kg/vehicle_total_gross_kg) only for unassigned whole-vehicle activity and a compatible actual mass-basis t*km provider. Target plus other actual gross payload kg must reconcile to the same-segment vehicle total with known positive denominator. Keep a provider already-attributed target quantity unchanged; reconstruction is QA only. Retain raw/target attribution level and provider reference unit. Do not reduce target-kg-derived t*km by another occupied-volume share; volume-capacity allocation of a whole-vehicle environmental vector needs a matching actual provider and separate atomic activity, not a correction to target kg. Retain uncovered actual empty vehicle*km, allocating once by all-beneficiary actual route-capacity reservations. Retain stationary powered idle h/fuel in matching named completion cards; never erase them by zero load/distance. Original goods inbound and treatment-contained actual legs occur once; unknown coverage blocks completeness. Normalize once by final reference denominator D."
      inputs:
        - load_kg
        - loaded_leg_km
        - empty_vehicle_km
        - route_share
        - provider_scope
        - cp_transport
        - D
        - loaded_attribution_mode
        - target_gross_kg
        - vehicle_total_gross_kg
        - target_payload_kg
        - all_other_payload_kg
        - provider_reference_unit
        - provider_attribution_level
      output: "V_load; V_empty"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: q_scope
      applies_to: "all inventory rows"
      requirement: "Keep walkdown presence/absence and scope matrix for each actual exchange, disjoint provider stages and named downstream completion modules; reject entire-leaf coverage claims."
      evidence: "Dated walkdown, supplier scope, route/pack photos and join manifest"
    - id: q_records
      applies_to: "all inventory rows"
      requirement: "Keep original timestamps, IDs, raw units, calibration, sample plan and missing-data uncertainty; no defaults, implied zero or invented threshold. Retain all zero-driver intervals and prospectively declared cohort pool."
      evidence: "Original meters, logs, calibration and signed reconciliation including unresolved differences"
    - id: q_acceptance
      applies_to: "retail_service"
      requirement: "Use declared actual local/customer acceptance specification without claiming Codex legal conformity. Continuous temperature/integrity/rotation evidence supplements shipment checks; raw chilled fish is not ready-to-eat."
      evidence: "Pack labels, original specifications, temperature excursions and actual disposition"
    - id: q_history
      applies_to: "cabinet_asset; cabinet_waste; retail_service"
      requirement: "Preserve versioned lifetime, original cohort revisions and final background ownership; no silent reassignment, reset or loss deletion."
      evidence: "Lifetime/stock revision ledger and corrected prior outputs"
validation_rules:
  - rule_id: identity_binding
    applies_to: "all inventory rows"
    rule: "No dataset completeness until each applicable row resolves to one official flow original and matching receipt, public state, exact bilingual name, type, state/medium and property-unit chain. An unbound service cannot reuse a salmon production UUID. AC UUID establishes point-of-use energy identity only; supplier/grid/voltage background remains to be evidenced."
    source_ids: []
  - rule_id: denominator_closure
    applies_to: "retail_service"
    rule: "Check positive D, physical mass closure independently, unique pack history, late-return numerator and denominator correction, all zero-sale pools retained, and final owner/background for F. Financial refunds cannot substitute for physical evidence."
    source_ids: []
  - rule_id: measurement_completeness
    applies_to: "all inventory rows"
    rule: "Check actual quantity, uncertainty, calibration, full frequency/coverage, matching protocol process and one final normalization. J is complete carrier V*rho without supply deductions; propane final outside flux requires measured capture/storage closure. Conditional absence needs evidence; unknown never passes."
    source_ids: []
  - rule_id: scope_no_overlap
    applies_to: "all inventory rows"
    rule: "Verify asset cumulative fractions <=1, final residual correction, exclusive terminal modes, repair event boundaries, full carrier treatment, actual loaded/empty route coverage and no duplicated upstream goods/transport/refrigerant recovery. Report partial incremental scope until every named common-premises completion module is joined; no conformity or published approval is established by these checks."
    source_ids: []
published_dataset_profile:
  dataset_role: "Partial incremental foreground service; candidate methodology"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Incremental service comparison within identical scope; total retail model requires named completion modules first"
