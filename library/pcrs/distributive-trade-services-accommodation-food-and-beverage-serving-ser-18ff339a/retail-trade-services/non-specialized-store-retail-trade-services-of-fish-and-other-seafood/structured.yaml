system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "retail_service"
      rule: "Only non-specialized-store pickup service for supplier-sealed, raw, chilled, never-frozen, skinless boneless Salmo salar fillets in ordinary air packs. Record farm/wild origin, species, cut, pack formulation, net-drained-mass procedure and acceptance criteria before pooling. Exclude whole fish, live organisms, molluscs, frozen/thawed, cooked, smoked, salted, vacuum/MAP, filleting, repacking and delivery routes."
      source_ids:
        - fao-fish-2013
    - rule_id: partial_completion
      applies_to: "retail_service"
      rule: "This is a partial incremental cabinet-service dataset. Before claiming total retail service, join measured common building shell and fit-out, building maintenance and end-of-life, room HVAC, general lighting, shelves outside the cabinet, checkout hardware and power, trolley/pallet-jack handling, shared toilets and cleaning, staff/administrative equipment and customer carrier-bag end-of-life modules on the same cohort/D. Require a scope matrix assigning manufacture/installation, operation, maintenance, terminal and transport to exactly one module; subtract a cabinet submeter only from a parent that actually contains it. Missing join is incomplete, never zero."
      source_ids:
        - jrc-retail-2013
    - rule_id: gate_background
      applies_to: "failed_goods_background"
      rule: "Goods production, supplier consumer/outer packaging and inbound transport to the identical retail receiving gate are excluded for finally accepted goods and continuing reusable goods. Couple B for service-caused irrecoverable fish loss and nonaccepted external retention at that exact gate. Keep customer/supplier continuation responsibility and final fate for all F; unresolved F stays provisionally charged in B and blocks final completeness. Release the provisional charge only through evidenced reassignment, never disappearance. No automatic avoided-product credit."
      source_ids:
        - jrc-retail-2013
    - rule_id: internal_environment
      applies_to: "propane_air; effluent"
      rule: "Fish drip retained inside an intact pack remains goods mass, not wastewater; record free drip separately from accepted drained flesh. No live-stock survival balance applies. Internal water vapour/condensation is not an elementary emission. Ice/direct icing and meltwater are excluded by this dry-cabinet route; site evidence of icing invalidates route and needs a revised atomic inventory. A measured combined drain is one carrier, not its contained water/cleaner/fish constituents again."
      source_ids:
        - fao-fish-2013
    - rule_id: extra_exchanges
      applies_to: "all inventory rows"
      rule: "Determine presence/absence of every conditional card from walkdown, invoices, logs and provider scope. Unknown is unverified. Additional real chemical, packaging, replacement, emission or carrier requires its own named card, one-process protocol and bilingual synchronization before completeness. Treat actual whole equipment, sealed rejected packs and mixed drain carriers as complete exchanges; do not mechanically split their contained materials into duplicate flows."
      source_ids:
        - jrc-retail-2013
