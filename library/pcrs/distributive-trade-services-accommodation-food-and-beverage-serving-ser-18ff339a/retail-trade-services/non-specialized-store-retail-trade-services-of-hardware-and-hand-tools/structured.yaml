allocation_rules:
  - rule_id: fixed_pool
    applies_to: "all inventory rows"
    rule: "Before observation fix pool ID, same SKU/package configuration, site, source dates and closure rule; include closed, idle, failed and zero-sale periods. Q is not gross stock throughput. Late returns/revocations/fate changes replace all affected original-pool numerator/source/denominator versions using actual dates; later resale of the same original ID never adds another manufacturing vector. Q=0 pools remain raw and explicitly unnormalizable; carry them within the prospectively defined same-configuration pool, never delete or silently allocate them to an unrelated successful period."
    source_ids:
      - ghg-product-2011
  - rule_id: source_drivers
    applies_to: "store_electricity"
    rule: "Use direct disjoint meters first. Draw the circuit tree; subtract a child only if included in its parent. Separately meter lighting/fan fixed source pools and allocate by reserved lit/fanned display footprint m2*h including idle/closed reservation; checkout active source by logged terminal active seconds; ICT/network active source by measured source-specific byte processing activity; security continuous source by protected footprint m2*h; administrative active source by recorded task seconds. Reconcile each active/idle/fixed kWh subpool to its parent; allocate terminal/network/admin idle AND fixed/closed continuous-source subpools by beneficiary reserved device seconds, never by zero active use or zero sales. Before each observation interval register every actual beneficiary cohort/pool and its device reservation share, including failed, zero-sale and closed-period reservations; retain timestamped reservation versions rather than retrospectively selecting successful sales. reserved_device_seconds_h equals measured available device seconds times the predeclared reservation share_h; shares across all actual beneficiaries sum to1 for each device interval, and reserved seconds reconcile to the full source duration. Unknown beneficiaries, unassigned reservations or missing closed-period coverage block completion. Do not sum incompatible drivers or energy with area/time/bytes. Unknown or zero all-beneficiary driver totals block allocation until measured reservation and beneficiaries reconcile."
    source_ids:
      - ghg-product-2011
  - rule_id: source_materials
    applies_to: "all inventory rows"
    rule: "Any additional store packaging, receipt paper, cleaning formulation or maintenance material requires actual named atomic cards and cp_modules fields. Fix source manufacture and source inbound transport to first actual use; never-used stock and transfers retain unassigned sources. Already-used reusable stock never repeats manufacture/inbound. Printed intermediate stock retains both original paper and printing-meter source IDs with historical replacement versions. For cleaning track original formulation-origin kg into mutually exclusive used-final, spilled, rinsed-final, carrier-residue-dispatched, retained and unused states; used→rinsed is replacement, not a second destination. Actual entire wet carrier kg is independently weighed, not formulation kg; added water/dirt/cloth/container is not source formulation."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_versions
    applies_to: "all inventory rows"
    rule: "For every homogeneous actual asset/model/BOM/scope vector V and every historical beneficiary-period h collect exposure e_h in its own fixed unit: building and security protected footprint m2*h; fixed lights lit footprint m2*h; fixed fans fanned footprint m2*h; other fixed fixtures their evidenced served footprint m2*h; shelving reserved shelf-position*h; checkout/ICT/network/admin equipment reserved device*h; each actual hand trolley or manually operated handling-equipment model reserved handling-device*h; reusable cleaning cloth cleaned m2. Assign each actual fixed light/fan/fixture model and its complete vector either to an evidenced complete building package or to its own homogeneous asset module, exclusively. For handling equipment, e_h=sum_t(reserved_handling_device_hours_t*handling_reservation_share_h_t) across active, idle and closed intervals; define all receiving/handling beneficiary pools and timestamped reservation shares before observation, including failed/zero-sale cohorts. Shares sum to1 for every whole-device interval, so idle/closed exposure follows its reserved beneficiaries and never disappears with zero movements. reserved_handling_device_hours_t is the whole-device reserved interval duration before beneficiary attribution, so multiply its reservation share once. Record actual intervals, hours, shares, model/BOM/scope and matching same-unit lifetime L; unknown or unassigned capacity blocks completion. Expected lifetime exposure L has the SAME unit; f_old_h=e_h/L_old and provisional summed fractions must not exceed1. At actual retirement set E=sum_all_h actual e_h and f_new_h=e_h/E for EVERY historical h, sum=1. A life/BOM/background change replaces all historical fractions/vectors by delta_h=f_new_h*V_new-f_old_h*V_old, with signed numerator correction to each original pool. No restart or residual-only shortcut. Retirement carrier follows f_new_h once, not a second manufacture fraction. Whole-device net weighing and BOM reconstruction are exclusive; never subtract removed components twice."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_transport
    applies_to: "all inventory rows"
    rule: "Independent asset acquisition/repair/retirement transport belongs first to that named asset source and follows the SAME complete historical f_h/version corrections as that source; never charge every retirement trip to current Q. Material first-use transport follows source_materials. Provider-already-attributed asset or period transport keeps its fraction and receives no second fraction. A complete package containing transport/maintenance/EOL excludes duplicate modules."
    source_ids:
      - ghg-product-2011
  - rule_id: transport_driver
    applies_to: "all inventory rows"
    rule: "For each actual vehicle segment/trip t preserve route, measured distance d_t, stationary/idle duration tau_t, load and all beneficiary reservations. Separate measured movement and idle source numerators. Allocate movement by reserved payload kg*d_t for the evidenced mass-limited vehicle; allocate empty movement by reserved payload capacity kg*d_t of the originating reservations, never zero delivered tonnes. Allocate stationary/idle source by reserved payload capacity kg*tau_t. No mixing kg*km with kg*h. Require positive known same-unit total drivers and whole-trip reconciliation. Provider consignment amounts already allocated retain that amount; segment evidence is QA, not another multiplication. Empty/idle coverage unknown blocks completeness."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "counter"
      flow_role: "failed_original; retail_service"
      record_type: "source/acceptance/custody ledger"
      raw_fields: "pool_id; prospective_start/end; pool_version; original_id; source_id; actual SKU/EAN; lot; factory_package_BOM/configuration; actual_original_package_count N_s; actual gross/net kg; supplier_vector V_s; inbound_transport_scope; S_s; F_s; T_s; O_s; final_valid_acceptance; closure_date; event_id/date; all_gross_handovers; customer_returns; supplier_handoffs; internal_asset_transfers; condemnation; opening/closing_goods_count; opening/closing_held_waste_count; confirmed_missing; signed_unresolved_residual; recipient/state/responsibility"
      collection_method: "Scan each actual complete package and lot before sale; establish persistent original IDs, count physical events independently of acceptance, calibrate scales and verify actual package/BOM against invoice and supplier signed inventory. Audit sealed state without assuming tool net mass equals complete-package mass. Obtain actual full supplier vector and separate packaging/inbound boundaries; catalogue is only product specification. Keep raw S/F/T/O and gross stock; final_service Q and failed_background n_failed per reference flow, once. Do not normalize raw audit balances."
      unit: "Item(s); kg; event date"
      frequency: "every receipt/event; daily stock closure"
      temporal_coverage: "entire prospectively fixed pool plus linked historical corrections"
      site_scope: "receiving, counter and original supplier boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed supplier BOM/vector; scans; acceptance/revocation evidence; calibrated weights; source ownership conservation"
    - protocol_id: cp_energy
      process_id: "counter"
      flow_role: "store_electricity"
      record_type: "meter and all-beneficiary driver ledger"
      raw_fields: "meter_id; parent_includes_child; source_subpool k; active/idle/fixed_mode; start/end kWh; K_k; beneficiary h; reserved_lit/fanned_m2; protected_m2; hours; terminal_active_seconds; network_bytes_processed; administrative_task_seconds; reserved_device_seconds_h; prospective_beneficiary_register; device_reservation_interval; available_device_seconds; reservation_share_h; reservation_version/effective_date; beneficiary_failed/zero_sale/closed_status; d_hk; K_hk; K_h; supply_geography/technology/voltage/loss_scope; calibration; Q"
      collection_method: "Read calibrated interval meters and instrument each material active/idle/fixed component; circuit tree proves overlaps. Before observation register actual beneficiary pools, device reservation shares and effective versions; log active, idle and fixed/closed intervals, including failed/zero-sale reservations, and reconcile all device seconds under source_drivers. Collect exact fixed dimensions in source_drivers; reconcile source pools to bills and all beneficiaries. Provider-contained electricity is removed by physical source scope. electricity_allocate returns MJ per reference flow; source subpools use a single same-unit driver each, reconcile before summation."
      unit: "kWh; m2*h; seconds; bytes separately"
      frequency: "interval readings and every task/reservation"
      temporal_coverage: "same entire pool including idle/closed periods"
      site_scope: "store circuits and all connected beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; meter tree; raw logger/bill; component source reconciliation"
    - protocol_id: cp_terminal
      process_id: "fates"
      flow_role: "rejected_external; supplier_handoff; failed_pack_waste"
      record_type: "actual terminal/custody consignment ledger"
      raw_fields: "pool_id; pool_version; event_id; original_id; dispatch_date; recipient; actual unopened_state; actual constituents; gross_kg; tare_kg; dispatch_net_kg; scale_calibration; N_external_rejected; N_supplier_handoff; receiver_signed_composition_acceptance; full_treatment_scope; provider_contains_transport; onward_background_responsibility; held_waste_stock; confirmed_missing; signed_unresolved_residual; Q"
      collection_method: "Count physical transfers by unique event IDs and trace original source IDs; weigh actual whole waste consignment on a calibrated scale, deduct actual tare once. Keep supplier/customer transfers and waste disjoint; obtain signed actual mixed composition/state acceptance plus treatment contract. Forward independent transport records to cp_modules with original asset/material/source responsibility. terminal_carriers yields per reference flow once; stock is independent QA; process views retain the same original record IDs without duplicating measurement."
      unit: "kg; Item(s)"
      frequency: "every actual consignment and fate revision"
      temporal_coverage: "whole pool and later original-source fate updates"
      site_scope: "counter/store departure and named receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed weighbridge/net record; actual constituent acceptance; recipient/state; treatment/provider scope"
    - protocol_id: cp_modules
      process_id: "counter"
      flow_role: "all inventory rows"
      record_type: "mandatory module and source/asset completion register"
      raw_fields: "module_id; actual_presence/absence_evidence; operation/capital_stage; actual_model/BOM/scope; source_id; original_provider_boundary; actual_exchange_card_id; protocol_id/process_id; property/unit; x_jc; D_j; pool_id/version; source_pool_active/idle/fixed; raw_total; all_beneficiaries; exact_driver/unit; prospective_handling_beneficiary_register; actual_handling_asset_model/BOM/scope; handling_reservation_interval; reserved_handling_device_hours_t; handling_reservation_share_h_t; handling_reservation_version/effective_date; handling_active/idle/closed_status; fixed_light/fan/fixture_model_and_served_footprint; e_h; e_actual_h; L_old; E; f_old_h; f_new_h; V_old; V_new; delta_h; installation/repair/retirement_event; asset_stock; actual_carrier_kg; material_receipt/unused/first_use/reuse/destination; original_formulation_kg; dispatched_container_residue; transport_trip/segment; actual_d_t; idle_tau_t; payload_kg; reserved_capacity_kg; provider_allocation; actual_water_meter; actual_effluent_meter/density; calibration; overlap_constituents/event/time/stage; Q"
      collection_method: "Inspect the full site and contracts monthly and at change, and retain signed coverage evidence for every support_coverage module. Meter all real operation sources; apply fixed source_drivers units (direct subdivision first), preserving idle/failure periods. Obtain actual asset model/BOM vectors and same-unit exposures/lifetime across ALL past beneficiaries; register receiving/handling equipment reservations before observation and retain actual reserved handling-device hours, shares and active/idle/closed periods under asset_versions; verify fixed light/fan/fixture capital is in exactly one complete building package or its own actual-model module; recover every historical numerator version under asset_versions. For materials collect receipt/unused/used/final state and first-use sources. For reverse/waste/material/asset transport retain measured segment distance, stationary duration, reserved capacity and provider boundary, then transport_driver. Water input from the site inlet meter already excludes reuse: never subtract reuse again. Direct actual effluent is independently measured V_discharge*rho at measured state; no water-only reconstruction masquerades as full liquid mass. No combustion/refrigerant source is admitted under an absent gate; any actual source requires a separate reviewed state/species/path method and cards before completeness. complete_modules restores x_jc*D_j and compatible source numerators, applies asset_replace, and final/Q exactly once. This master register does not replace an actual single-process protocol linked from each added atomic card."
      unit: "native exchange units; each driver/lifetime unit separate"
      frequency: "every event; monthly coverage; every lifetime/provider revision"
      temporal_coverage: "full source pool plus complete asset and material source history"
      site_scope: "entire site and contracted utilities/ICT/payment/security/admin, assets and transport"
      aggregation_rule: "complete_modules restores x_jc*D_j and compatible source numerators, applies asset_replace, and final/Q exactly once. This master register does not replace an actual single-process protocol linked from each added atomic card."
      quality_evidence: "signed complete coverage matrix; raw meter/driver data; calibrated weighing; original denominators/source IDs; full version/asset histories; overlap audit"
  calculation_rules:
    - id: final_service
      applies_to: "retail_service"
      rule: "Q=count distinct original_id with final_valid_acceptance at closure; retail_service=1 Item(s). Version the final-valid set; do not subtract revocations after already filtering that set."
      inputs:
        - original_id
        - final_valid_acceptance
        - closure_date
        - pool_version
        - cp_goods
      output: "Q; retail_service"
      source_ids:
        - ghg-product-2011
    - id: failed_background
      applies_to: "failed_original"
      rule: "n_failed=N_F/Q; B_F=sum_s(F_s*V_s); failed_original carries each actual homogeneous whole-source supplier vector once. If supplier source vectors differ, disaggregate source-specific exchange instances under this one homogeneous package identity; never substitute scalar count for unknown vector composition. S background belongs only to downstream GOODS; T retains named continuing responsibility; O blocks closure."
      inputs:
        - N_F
        - Q
        - F_s
        - V_s
        - S_s
        - T_s
        - O_s
        - cp_goods
      output: "n_failed; B_F"
      source_ids:
        - ghg-product-2011
    - id: electricity_allocate
      applies_to: "store_electricity"
      rule: "For each disjoint source subpool k and beneficiary h, K_hk=K_k*d_hk/sum_h(d_hk); K_h=sum_k K_hk; store_electricity=3.6*K_h/Q MJ. K_k is metered kWh; d_hk uses the single fixed driver for that source in source_drivers. The conversion1 kWh = 3.6 MJ changes numerator units only. Reconcile sum_h K_hk=K_k."
      inputs:
        - K_k
        - d_hk
        - K_hk
        - K_h
        - available_device_seconds
        - reservation_share_h
        - reserved_device_seconds_h
        - Q
        - cp_energy
      output: "store_electricity"
      source_ids:
        - ghg-product-2011
    - id: terminal_carriers
      applies_to: "failed_pack_waste; rejected_external; supplier_handoff"
      rule: "failed_pack_waste=sum actual dispatch consignment net kg/Q; rejected_external=N_external_rejected/Q; supplier_handoff=N_supplier_handoff/Q. The three physical event sets are disjoint at a given event; serially linked events retain the same original source without acquiring another vector. Direct waste dispatch kg is not reduced again by stock change. Goods-only and held-waste balances independently validate it."
      inputs:
        - dispatch_net_kg
        - N_external_rejected
        - N_supplier_handoff
        - event_id
        - original_id
        - Q
        - cp_goods
        - cp_terminal
      output: "terminal quantities per reference flow"
      source_ids:
        - ghg-product-2011
    - id: complete_modules
      applies_to: "all inventory rows"
      rule: "For each mandatory support module j restore every normalized exchange x_jc to its evidenced raw numerator X_jc=x_jc*D_j using original denominator D_j, pool, source IDs and version. Remove overlaps using physical_overlap, not provider IDs. Split operation active/idle/fixed measured source pools; apply the EXACT source_drivers dimensions, direct subdivision first. Apply asset_versions separately for each actual model/BOM/V and actual event material/transport rules. Raw core X_core_c includes N_F actual failed_original input instances linked to their V_s (which yields B_F once, never an additional B_F exchange) and the AC numerator; completion X_total_c=X_core_c+sum_j disjoint compatible X_jc including all historical deltas. Only add identical exchange/property/unit numerators, never kg to MJ or raw to normalized values. Final x_total_c=X_total_c/Q once; do not add F or AC again. No numerical completion is allowed until actual atomic cards and same-process protocols for every added exchange have been authored in both languages and synced, or true absence evidenced."
      inputs:
        - x_jc
        - D_j
        - X_jc
        - X_core_c
        - X_total_c
        - Q
        - source_id
        - pool_id
        - pool_version
        - delta_h
        - cp_modules
      output: "x_total_c"
      source_ids:
        - ghg-product-2011
    - id: asset_replace
      applies_to: "all inventory rows"
      rule: "For each actual homogeneous asset vector apply asset_versions: f_old_h=e_h/L_old; at retirement E=sum_all_h e_actual_h and f_new_h=e_actual_h/E. Record delta_h=f_new_h*V_new-f_old_h*V_old to EVERY original historical pool before its own final/Q. Sum_final_f=1. Track manufacture/installation, operation, maintenance and terminal treatment disjointly; independent transport follows asset_transport, with provider allocation not repeated. Acquisitions and retirements validate asset stock, not an additional consumed-item input besides exposure/lifetime."
      inputs:
        - e_h
        - e_actual_h
        - reserved_handling_device_hours_t
        - handling_reservation_share_h_t
        - L_old
        - E
        - f_old_h
        - f_new_h
        - V_old
        - V_new
        - delta_h
        - cp_modules
      output: "historical raw asset numerator replacements"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: q_binding
      applies_to: "all inventory rows"
      requirement: "Require exact type, complete object/state, property/unit and route binding; identity alone does not supply LCI or actual quantity. Unbound cards remain pending until direct-read evidence and matching supplier/treatment protocol are complete."
      evidence: "official direct-read receipts; supplier/receiver signed specification; protocol records"
    - id: q_temporal
      applies_to: "all inventory rows"
      requirement: "Keep original source IDs, dates, denominator sets and revision histories. No unobserved period, negative residual, unknown module or zero pool can be silently deleted or clamped to zero."
      evidence: "full signed stock/source reconciliation and corrections"
    - id: q_completeness
      applies_to: "all inventory rows"
      requirement: "Actual support exchange additions must have bilingual atomic cards, correct process/direction/type, raw fields, exact formula Inputs, one reference_flow basis and full historical deduplication before claiming complete retail-service data."
      evidence: "coverage matrix; actual parsed guidance/protocol/card audit; complete_modules outputs"
validation_rules:
  - rule_id: v_scope_identity
    applies_to: "all inventory rows"
    rule: "Verify actual model/EAN, lot, full tool-plus-package BOM, unopened state and non-specialized counter channel. Each unbound flow requires direct official binding with matching type/state/property/unit and supplier/treatment boundary, not a property UUID used as flow. Historical AC identity observation is not a live supplier/background verification."
    source_ids:
      - un-cpc3-62165
      - bahco-pliers-catalogue
  - rule_id: v_sources_counts
    applies_to: "failed_original; retail_service"
    rule: "Audit original IDs once, Q set and gross custody independently; reconcile S/F/T/O whole-source vectors at receiving gate. Q>0 is required for normalized dataset; zero-output and unresolved/open sources stay explicit. Acceptance revocation without return is included; price-only refunds cannot alter Q. All original failed B_F must be represented by failed_original; no loss is omitted or manufacture repeated at resale."
    source_ids:
      - ghg-product-2011
  - rule_id: v_terminal
    applies_to: "failed_pack_waste; rejected_external; supplier_handoff"
    rule: "Waste dispatch requires calibrated actual carrier net weighing and signed acceptance of the exact mixed tool-plus-package constituents/state with matching full treatment. Confirm missing separately from signed unresolved residual. External retention and supplier transfer need recipient/state/continuing responsibility and no automatic waste or credit. Never split the same intact waste carrier into component waste again."
    source_ids:
      - ghg-product-2011
  - rule_id: v_modules
    applies_to: "all inventory rows"
    rule: "Check every mandatory module in support_coverage using cp_modules and complete_modules, including complete fixed lighting/fan/fixture capital, ICT/network/payment/security/admin operation and capital. Named missing modules alone are incomplete. Added actual cards must have correct single process protocols, raw fields, units, exact calculation inputs and complete bilingual semantics before sync. Reconcile all source pools/beneficiaries including closed and failure periods."
    source_ids:
      - ghg-product-2011
  - rule_id: v_lifetime
    applies_to: "all inventory rows"
    rule: "Audit per-model homogeneous V, source boundaries, same-unit e/L and final e/E, all historical numerator replacements and asset/material transport history. Sum provisional f<=1 and final f=1; final residual1-sum_old_f is QA only. Complete-provider overlap and all previous versions must reconcile. No asset restart or all-current-retirement charging."
    source_ids:
      - ghg-product-2011
  - rule_id: v_normalization
    applies_to: "all inventory rows"
    rule: "Every final amount has Basis kind reference_flow; raw protocols retain original units and one final/Q. Unknown is never zero. No invented weight, LCI, range, UUID, component percentage, safe-use limit or scientific approval. Candidate methodology requires independent scientific and translation review before promotion."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Review-required incremental service plus completed compatible support modules. A GOODS system can add successful S source background once, explicitly separately."
  allowed_use: "Same evidenced homogeneous factory package and mixed-assortment counter route with complete source/asset history and final accepted denominator."
  excluded_use: "Entire62165 coverage, manufacturing of goods, powered tool service, demonstrations, repair, opened or incomplete package routes, complete-business claims from core only, conformity or safety approval."
  required_metadata: "All reference qualifiers; original pool/IDs; provider/source vectors and boundaries; module cards/protocols; Q; full historical replacement versions."
  required_quality_disclosure: "Unbound identities; historical AC observation; supplier lot/BOM/LCI gaps; zero/open pools; incomplete modules; allocation/calibration uncertainty and actual coverage."
  update_trigger: "Any actual configuration, package, route, acceptance/fate, provider boundary, lifetime/BOM, driver or source revision; replace all affected prior versions."
data_sources:
  - id: "un-cpc3-62165"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 explanatory note62165; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62165 ; retrieved2026-10-29"
    used_for: "Hand-tool and machine-tool category boundaries; narrower mapping inference, no inventory factor."
  - id: "bahco-pliers-catalogue"
    type: "handbook"
    reference: "BAHCO Plier Catalogue, PLIERS-ENG-20; https://media.bahco.com/media/media-download/catalogue/Bahco%20Plier%20Catalogue_UK.pdf ; pp.7-8 and14; retrieved2026-10-29"
    used_for: "Actual2101G-180 model/EAN,180mm, black finish, complete hand tool and ERGO context. Nominal 230 g is not used for field mass; actual lot/BOM/package and LCI require supplier evidence."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard2011; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf ; ch.6,7,9"
    used_for: "Service unit, attributable boundary, allocation hierarchy and physical drivers inform the explicit PCR design. No full-standard-conformity claim or source mandate for these exact equations."
  - id: "jrc-retail-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Environmental Management Practice in the Retail Trade Sector2013, EUR25998EN; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf ; executive summary and lighting/waste sections"
    used_for: "Retail energy/lighting, water/chemicals, waste and transport coverage; no benchmark copied as a site inventory/default."
