system_boundary:
  rules:
    - rule_id: route_gate
      applies_to: "all inventory rows"
      rule: "Admit only an evidenced mixed-assortment store with sealed homogeneous original packages and the declared counter route. Record invoices, photographs, assortment, package mass/BOM and configuration revision. Actual additional wrapping, printing, cleaning, powered demonstration, delivery, combustion or refrigerant equipment cannot be assumed absent: cp_modules determines coverage and adds mandatory specific cards/protocols under complete_modules. Unknown presence blocks dataset completeness. If a stock package becomes a permanent demonstrator, transfer the SAME original V_s to a named internal asset T, never charge full F plus a new asset manufacture; author the actual opened tool/packaging states and module before completeness."
      source_ids:
        - un-cpc3-62165
        - bahco-pliers-catalogue
        - jrc-retail-2013
    - rule_id: source_ownership
      applies_to: "failed_original; retail_service"
      rule: "For every original package source s fix N_s and the matching whole supplier vector V_s at the same receiving gate. Partition source-equivalent whole IDs into final-valid S_s, service-responsible failed F_s, named continuing transfer T_s and unresolved/open O_s, with N_s=S_s+F_s+T_s+O_s. No arbitrary material mass shares of environmental vectors. This route keeps the complete package intact, so one original ID has one whole final responsibility. N_F=sum_s F_s. Failed unreturned customer-held goods and confirmed missing goods remain F with evidenced responsibility; unknown missing residual remains O and blocks closure. Supplier returns are T only with named continuing responsibility, never an automatic credit."
      source_ids:
        - ghg-product-2011
    - rule_id: acceptance_custody
      applies_to: "retail_service; failed_pack_waste; rejected_external; supplier_handoff"
      rule: "Keep goods-only stock and held-waste stock separate. G_close=G_open+receipts+physical_customer_returns-ALL_gross_customer_handovers-physical_supplier_handoffs-internal_asset_transfers-condemnations-confirmed_goods_missing+signed_unresolved_goods_residual. ALL handovers already include accepted and never-accepted exits; do not subtract a second unaccepted set. Condemnation moves goods into held waste; W_close=W_open+condemnations-waste_dispatch-confirmed_waste_missing+signed_unresolved_waste_residual. No second goods exit on waste dispatch. Q=count distinct original IDs with final-valid acceptance; revocations without return reclassify the old acceptance, not a new movement or a second subtraction from Q. A monetary refund/discount does not revoke acceptance by itself."
      source_ids:
        - ghg-product-2011
    - rule_id: failure_carriers
      applies_to: "failed_pack_waste; rejected_external; supplier_handoff"
      rule: "Separate ownership from physical fate: F does not create a waste shipment. Measure actual whole unopened failed package waste dispatch kg including tool, grips, spring/joint and actual packaging; retain signed receiver acceptance of actual constituents/state and matching complete treatment scope. Keep the real carrier intact, with no parallel steel, plastic or packaging constituent waste rows. Physical retained external nonconforming packages and supplier transfers use their own event IDs and are never retailer waste automatically; record recipient, state, quantities and continuing treatment/background responsibility. An opened or contaminated carrier requires a state-specific extension, not this unopened carrier identity."
      source_ids:
        - ghg-product-2011
    - rule_id: whole_source
      applies_to: "failed_original"
      rule: "The complete original package input uses Number of items, not tool net kg or catalogue 230 g. Bind a supplier vector for the actual tool-plus-package configuration, including all actual handle/steel/coating/joint/spring and packaging constituents. Whole-source mode excludes component inputs for the same vector. If constituents acquire different responsibilities, this route is incomplete until separate actual component product cards and verified supplier component vectors conserve the original vector; mass fractions cannot split an environmental vector. Factory packaging never receives a second full manufacture burden through terminal waste."
      source_ids:
        - bahco-pliers-catalogue
        - ghg-product-2011
    - rule_id: physical_overlap
      applies_to: "all inventory rows"
      rule: "Before adding providers compare physical constituents, event IDs, asset IDs, dates, sites and lifecycle stages. Distinct provider IDs do not prove disjoint activity. A complete background containing electricity, transport, repair or treatment excludes the same outside activity. No waste-treatment credit, reuse credit or negative emission is inferred. Satellite outputs rejected_external and supplier_handoff carry no avoided-production credit; their original V stays under source_ownership."
      source_ids:
        - ghg-product-2011
    - rule_id: support_coverage
      applies_to: "all inventory rows"
      rule: "The core covers failed_original, store_electricity, retail_service and the three actual terminal/transfer carriers only. cp_modules must cover receiving handling, storage/display, shared building, lights/fans/fixed fixtures, checkout/payment, ICT/network, security, administration, cleaning, utilities, reverse/waste/material/asset transport, maintenance and end-of-life. These are mandatory completion modules, not an optional omission list. For each actual module create a signed source/operation/capital coverage matrix, name actual atomic exchange cards and same-process protocols, collect required fields, apply complete_modules and asset_versions; each module must be complete or evidenced absent. No complete-business dataset may be delivered from the uncompleted core."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
