allocation_rules:
  - rule_id: allocate_pool
    applies_to: "foreground_burden_allocation"
    rule: "Prefer direct event attribution and submeters. Allocate only the residual shared pool among all actual beneficiaries: lighting/comfort electricity by measured occupied floor-area hours, handling/checkout by observed task seconds, bags/boxes by occupied packed volume, cleaning by logged cleaned area and events. Retain idle/closed/failure/zero-driver quantities. Distribute idle residual within a prospectively declared same-site/configuration annual pool using cumulative occupied area-hours; if all drivers are zero, keep the pool unallocated and incomplete. Sum allocated quantities equals each full measured pool, no sales-only denominator or economic fallback."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_ledger
    applies_to: "foreground_burden_allocation"
    rule: "For each persistent asset a and each period/beneficiary cohort k, record complete manufacturing/installation burden B_a, measured exposure x_a,k, total expected lifetime exposure L_a and the posted fraction. The provisional current fraction is f_a,k = x_a,k / L_a; the capital quantity is 1 complete asset * f_a,k / D_k and its upstream burden is B_a * f_a,k / D_k. Keep L_a no smaller than cumulative actual exposure and total posted fractions no greater than 1. After exposure or lifetime revision, compute corrected f_new = x_new / L_new for every affected historical cohort and post signed correction (f_new - f_posted) to that original cohort numerator; revise its normalization if D_k also changes. Never restart B_a. At retirement compute R_a = 1 - sum(corrected lifetime fractions), and distribute that final residual to the same previously declared full-lifetime beneficiaries using w_a,k = x_a,k / sum(all actual lifetime exposures), including idle and failed cohorts; write R_a * w_a,k back to each original capital numerator. Final responsibility h_a,k = corrected f_a,k + R_a * w_a,k must sum to 1. A zero total exposure or entirely zero-output beneficiary pool remains explicit and unnormalizable. For each actual terminal carrier use its measured whole mass or complete count * h_a,k / D_k exactly once; never multiply by f_a,k again. Reconcile the sum of all terminal allocations to the one actual terminal carrier; replace prior future scenarios by signed actual-minus-posted corrections to their original cohorts. Maintenance/replacements are dated actual events with specific cards unless evidenced inside a disjoint supplier package."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "accepted_service; failed_goods_background; external_refusal; supplier_return; donated_jar"
      record_type: "event_ledger"
      raw_fields: "jar_id; SKU; species; extraction_style; floral_origin; declared_fill; measured_gross_mass; matched_tare; seal_state; moisture_state; receive_gate; supplier; receipt_id; original_cohort; actual_event_date; stock_open; stock_close; acceptance; external_retained_refusal_F; price_refund; physical_return; resale; loss; final_recipient; final_fate; upstream_owner; inbound_and_return_transport"
      collection_method: "Scan unique jars and reconcile POS, physical stock and receiver confirmations; calibrate scales with check weights and retain tare sample linkage. Log seal, leakage and fermentation inspection; crystallization is a state observation, not automatic spoilage. Track supplier returns until named final responsibility. Apply denominator and goods_responsibility to unique records; preserve raw totals and normalize applicable rows once per reference flow"
      unit: "Item(s); kg"
      frequency: "Every receipt, movement and fate event; physical stock at period boundaries"
      temporal_coverage: "Entire prospectively declared annual same-SKU pool, including closed/idle/failed/zero-sales periods and late corrections"
      site_scope: "Receiving gate through store customer handover and continuing failure-fate chain"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed receipt/POS exports, scales calibration, stock reconciliation, background gate/scope matrix and recipient confirmations"
    - protocol_id: cp_retail_power
      process_id: "retail"
      flow_role: "retail_power"
      record_type: "meter_record"
      raw_fields: "meter_id; opening_kWh; closing_kWh; timestamp; circuit_map; climate_submeter; beneficiary; area_hours; task_seconds; idle_residual; provider_scope; meter_mode; contains_climate; actual_overlap"
      collection_method: "Read calibrated main/circuit/submeters and reconcile utility invoices. Verify the circuit map and declare one mode: main retail meter contains climate, subtract the matched climate quantity once; disjoint retail/climate submeters, do not subtract. Remove package-supplied energy only from a proven containing reading or package and never from already disjoint quantities. Survey all loads, voltage, location and provider delivery boundary. Convert using physical_conversion, allocate_pool, divide once by D per reference flow"
      unit: "kWh; MJ"
      frequency: "At least each billing interval and configuration change"
      temporal_coverage: "Full annual pool with idle and closed periods"
      site_scope: "Store receiving, display and checkout circuits"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, bills, circuit map and allocation reconciliation"
    - protocol_id: cp_consumables
      process_id: "retail"
      flow_role: "cleaner; cellulose_wipe; kraft_bag; receipt_paper"
      record_type: "stock_and_event_record"
      raw_fields: "material_id; formulation; concentration; unit_mass; opening_stock; receipts; closing_stock; unused_returns; spill_id; jar_id; issue_count; printed_length; packed_volume; cleaned_area; beneficiary"
      collection_method: "Weigh each actual material/formulation separately with calibrated scale; stock balance and event issue logs identify actual consumption and absence. Cleaner is one real aqueous product, not an invented mixture of other cleaning agents. Raw consumed mass, direct events then residual allocate_pool; no duplicate composition fraction; divide once by D per reference flow"
      unit: "kg; Item(s)"
      frequency: "Each issue/spill; stock per interval"
      temporal_coverage: "Full annual pool including unsuccessful handling and repeats"
      site_scope: "Honey aisle and actual shared beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier composition, stock invoices, calibration, issue records and absence survey"
    - protocol_id: cp_waste
      process_id: "retail"
      flow_role: "broken_jar_waste; discarded_jar_waste; cardboard_waste; used_wipe_waste"
      record_type: "handover_record"
      raw_fields: "carrier_id; spill_id; jar_id; receiver; fate; date; gross_mass; container_tare; moisture; separated_components; absorbed_liquid; transport_scope; treatment_scope; beneficiary"
      collection_method: "Weigh each physically segregated carrier at transfer with calibrated scale; reconcile signed weighbridge/receiver tickets and jar fates; document actual whole mixture and contaminants, avoiding double constituent rows. Sum net carrier masses once, allocate shared cardboard and cleaning carrier by allocate_pool, divide once by D per reference flow"
      unit: "kg"
      frequency: "Every spill/collection/handover"
      temporal_coverage: "Full annual pool plus late-return corrections"
      site_scope: "Store waste exit to named receiving transport/treatment system"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, tare checks, transfer notes, photos, fate ledger and treatment scope matrix"
    - protocol_id: cp_water
      process_id: "retail"
      flow_role: "clean_water; wash_effluent"
      record_type: "meter_and_balance_record"
      raw_fields: "inlet_meter; discharge_meter; volume; timestamp; temperature; measured_density; mode; solution_mass; honey_in_liquid_mass; wipe_retention_mass; waste_retention; evaporation; storage_change; other_exports; reuse_loop; cleaning_event; beneficiary; sewer_receiver"
      collection_method: "Read calibrated separate inlet/discharge meters; sample actual effluent density at recorded temperature. If reconstructing, measure every correction and disclose uncertainty; never mix modes. Identify reused internal water separately from fresh imports and actual sewer discharge. Apply water_balance exclusively, allocate_pool once, divide by D once per reference flow"
      unit: "m3; kg"
      frequency: "Each cleaning event or bounded metering interval"
      temporal_coverage: "Full annual pool including spill failures and closed-period cleaning"
      site_scope: "Store inlet and actual sewer outlet"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, density method, balance uncertainty, sewer records and mode declaration"
    - protocol_id: cp_climate
      process_id: "climate"
      flow_role: "climate_power; r32_topup; r32_air; r32_recovery"
      record_type: "equipment_meter_and_mass_balance"
      raw_fields: "equipment_id; R32_identity; charge_open; charge_close; additions; recoveries; cylinder_tare; service_date; commissioning; retirement; meter_kWh; zone_area_hours; idle_residual; beneficiary"
      collection_method: "Inspect nameplate and service logs; calibrate electricity meters and refrigerant scales. Close charge/addition/recovery balance with actual recovery receivers; resolve negative or unknown residuals. Absence requires equipment survey and invoices, not a zero placeholder. Closed mass balance for air release, kWh conversion; allocate_pool including all zones, divide once by D per reference flow"
      unit: "kWh; MJ; kg"
      frequency: "Each service/charge/retirement and meter interval"
      temporal_coverage: "Full annual equipment operation including idle periods"
      site_scope: "Documented R32 comfort heat pump serving actual store zones"
      aggregation_rule: "per reference flow"
      quality_evidence: "Nameplate, calibration, service/recovery certificates, zone survey and full pool reconciliation"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "heatpump_capital; building_capital; shelf_capital; pos_capital; heatpump_eol; building_eol; shelf_eol; pos_eol"
      record_type: "persistent_asset_ledger"
      raw_fields: "asset_id; configuration; manufacture_installation_boundary; B; acquisition_date; beneficiary; exposure; L; prior_fraction; residual; revision; maintenance_event; terminal_count; terminal_net_mass; receiver; treatment_scope; x_a,k; L_a; f_posted; f_new; signed_correction; R_a; w_a,k; h_a,k; terminal_prior_scenario"
      collection_method: "Inventory actual whole building shell, shelf, POS and R32 heat pump separately; heat pump capital includes factory charge, terminal unit mass excludes separately recovered gas. Retain supplier whole-asset inventory and package exclusions; survey floor-area hours for shell/shelf, conditioned-zone area-hours for the heat pump and checkout active time for POS including attributed idle exposure. Establish L from dated design-life evidence, service history and measured/planned exposure with disclosed uncertainty, revise prospectively with historical corrections and retain final residual; never assume a default life. Weigh terminal whole carriers or use traceable whole-object records. Record dated maintenance/replacement and add actual atomic cards unless evidenced inside a disjoint package. Apply asset_ledger f=x/L to whole-asset capital, retain signed original-cohort historical corrections and retirement R*w residual postings; terminal whole-carrier quantities use h exactly once without another f, then divide each attributed amount once by original D per reference flow"
      unit: "Item(s); kg; m2*h; s"
      frequency: "Each acquisition, period allocation, revision, maintenance and terminal event"
      temporal_coverage: "Every historical and future lifetime period, never resetting on study rollover"
      site_scope: "All beneficiaries of the same identified asset, beyond honey and beyond current site if moved"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register, original supplier scope, cumulative allocation proof, revision log, terminal tickets and mass/count reconciliation"
    - protocol_id: cp_transport
      process_id: "retail"
      flow_role: "external_transport; empty_road_movement"
      record_type: "consignment_route_record"
      raw_fields: "consignment_id; jar_ids; original_cohort; actual_date; sender; receiver; gross_tonnes; loaded_km; empty_km; all_route_loads; allocation; provider_package_boundary; upstream_owner; empty_trip_id; empty_vehicle_km; provider_empty_coverage; dispatch_driver; corresponding_overlap; transport_mode"
      collection_method: "Use actual waybills, load weighing, GPS/odometer and dispatch routes to reconcile every loaded and empty trip, including a trip with zero tonnes and zero t*km. Verify fuel, exhaust, vehicle capital/maintenance/end-of-life and measured empty-route coverage in the selected provider dataset. Declare mutually exclusive provider-covered or separate vehicle-km mode. If covered, retain actual empty-trip/dispatch-to-provider coverage evidence; otherwise calculate the explicit empty_road_movement row and subtract the same evidenced empty burden from loaded provider inventory once. Unknown coverage, unquantified subtraction or zero causal dispatch drivers blocks completion. Preserve all actual travel and never use zero t*km to erase it; no duplicated inbound freight. Sum gross tonnes times distance; allocate full route once, divide once by D per reference flow"
      unit: "t*km; vehicle*km"
      frequency: "Every actual consignment and route"
      temporal_coverage: "Full annual pool and late fate revisions"
      site_scope: "Actual store to supplier or donation receiver by declared road route"
      aggregation_rule: "per reference flow"
      quality_evidence: "Waybills, scale checks, route log, receiver confirmations and provider scope matrix"
  calculation_rules:
    - id: denominator
      applies_to: "accepted_service"
      rule: "D = unique finally accepted same-SKU jars after physical reversals, with one surviving acceptance per jar; financial price-only refunds leave D unchanged and external retained refusal F is excluded. Record actual event date and original cohort. A late return corrects original D, all attributable retail/climate/asset numerators, upstream coupling and fate records; never place its burdens only in a new cohort. Carry failures and unsold stock into a prospectively fixed same-configuration annual pool. Entirely zero-output pools retain quantities and are not normalized."
      inputs:
        - jar_id
        - cohort_id
        - acceptance
        - physical_return
        - actual_event_date
      output: "D"
      source_ids:
        - ghg-product-2011
    - id: normalize_service
      applies_to: "all inventory rows"
      rule: "For each exchange, aggregate raw quantities by unique record, perform physical conversion, attribute once using allocate_pool or asset_ledger, then divide once by D. The service output is 1 Item(s). Raw totals, attribution fractions and final amounts remain separately auditable. D must be positive; unknown inputs are not zero."
      inputs:
        - raw_quantity
        - attribution_fraction
        - D
      output: "exchange_per_reference_flow"
      source_ids:
        - ghg-product-2011
    - id: water_balance
      applies_to: "clean_water; wash_effluent"
      rule: "Choose exactly one discharge mode. Metered: effluent_kg = V_discharge * rho_effluent, with no evaporation correction. Reconstructed, only if discharge meter unavailable: effluent mass = imported water mass + actual cleaning-solution mass + honey mass entering liquid - liquid retained in wipes/waste - evaporated mass - net liquid-storage mass increase - other measured liquid-export mass. Convert volumes to mass using each measured density at recorded temperature, and keep dry wipe mass outside this liquid balance; do not add internal recirculation. Measure all corrections and uncertainty; unresolved terms block use. Inlet water remains inlet_volume * rho_water and never subtracts reuse."
      inputs:
        - inlet_volume
        - V_discharge
        - rho_water
        - rho_effluent
        - correction_fields
        - discharge_mode
      output: "clean_water_kg; effluent_kg"
      source_ids:
        - jrc-retail-2013
    - id: physical_conversion
      applies_to: "retail_power; climate_power; cleaner; failed_goods_background; broken_jar_waste; discarded_jar_waste"
      rule: "Electricity_MJ = metered_kWh * 3.6. Honey net mass is measured gross jar mass minus matched empty-jar/lid/label tare at actual moisture state; do not use water density for honey. Package/waste whole-carrier mass is distinct from honey net mass. Cleaner whole-solution mass is not multiplied by concentration again. Count-to-mass conversions use measured same-SKU mass and recorded uncertainty, never a default fill mass."
      inputs:
        - metered_kWh
        - gross_mass
        - matched_tare
        - solution_mass
        - concentration
      output: "converted_quantity"
      source_ids:
        - fao-honey-1996
  data_quality_requirements:
    - id: quality_asset_scopes
      applies_to: "heatpump_capital; building_capital; shelf_capital; pos_capital; heatpump_eol; building_eol; shelf_eol; pos_eol"
      requirement: "Define mutually exclusive complete assets: building shell includes foundations, structure and fixed envelope only, excluding heat pump, movable shelves, POS, operating utilities and separately recorded repairs. Shelf is the complete unpowered steel shelf only, excluding building/POS/heat pump and lighting. POS is the complete terminal only, excluding premises, shelf, heat pump and separately identified peripherals. Heat pump is the complete installed unit including factory R32 charge only, excluding building shell, shelf, POS, replacement refrigerant, operating electricity and terminal gas recovery/treatment. Manufacturing inputs exclude all terminal treatment represented by waste outputs; maintenance and replacements remain dated actual events with separate atomic cards when present. Survey other fixed equipment and add its explicit mutually exclusive scope before completeness; unknown composition or supplier package overlaps block use."
      evidence: "Asset component scope matrix; supplier inventory; installation records; package exclusions; maintenance survey"
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Declare one SKU with species Apis mellifera, natural extracted honey, no added ingredients, recorded floral/geographic origin, net fill/tare, jar/lid/label specification, liquid/crystallized condition, seal, ambient storage history and acceptance evidence. Do not combine different fill masses, package types or transformations in one D. No numerical food-safety limits or source-mandated temperature defaults are introduced."
      evidence: "Supplier specification; jar sampling; environment log; inspection and acceptance records"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Collect full site/calendar coverage with missing intervals and uncertainty disclosed; reconcile every conditional process presence/absence. Actual unlisted exchanges must gain named atomic cards, matching process protocols and bilingual projection before completeness. Bind all unresolved identities and actual provider/treatment data; methodology leaves quantities to site measurement, not zeros or invented ranges."
      evidence: "Coverage calendar; equipment/material survey; row-level binding dossier; uncertainty register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Every binding requires an original official flow response and integrity receipt verifying UUID, public state, bilingual name, product/waste/elementary type, state/medium, property/unit chain and reference role. Generic count/mass properties do not identify a honey retail service or complete asset. Unbound cards remain explicitly unresolved and block quantitative dataset completeness until one compatible identity and provider/treatment boundary are confirmed."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_goods
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile each unique jar: opening stock + receipts + physical customer returns = gross physical customer handovers + external retained refusal F + supplier returns + donations + discarded/lost departures + closing stock, with internal movements cancelling; gross accepted handovers include subsequently returned departures, exclude F, and differ from corrected unique D. Deduplicate resale history for D only. Distinguish payments, price refunds and physical movements. Reconcile net honey and whole-package masses separately, record residue transfers to wipes/effluent without duplication. No crystallization-only automatic loss: inspect actual acceptance and fate."
    source_ids:
      - fao-honey-1996
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive D, corrected late-event cohort numerators, complete annual zero-output retention, full shared-pool reconciliation, persistent asset fractions and terminal residual allocation, exact supplier-package scope deduplication and actual water-mode consistency. Any missing quantity, unknown conditional activity, unclosed fate/background responsibility or unsupported identity is an explicit incomplete result, not zero or compliance. Add actual additional exchanges before completeness."
    source_ids:
      - ghg-product-2011
