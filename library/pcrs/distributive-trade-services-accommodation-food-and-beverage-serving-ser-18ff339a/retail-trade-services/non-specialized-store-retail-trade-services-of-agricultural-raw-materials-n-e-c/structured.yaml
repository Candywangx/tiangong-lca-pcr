system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "foreground_system_boundary"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: retail_gate
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins at recorded receipt of sealed honey jars at the store receiving gate, includes inspection, manual internal transfer, ambient storage/display, checkout, spill cleaning and final acceptance or documented non-sale fate. Beekeeping, extraction, filtration, filling and primary packing are upstream. No opening, heating, dilution, blending or repacking is permitted in this route."
      source_ids:
        - unsd-cpc62119
        - fao-honey-1996
    - rule_id: goods_responsibility
      applies_to: "foreground_system_boundary"
      rule: "Successful-jar production, primary/supplier packaging and inbound transport to the receiving gate are excluded from the incremental service and must be coupled once by the downstream merchandise user at that exact gate. Keep an upstream responsibility ledger for every jar. Failed/lost/discarded/donated jars receive that same complete background once through failed_goods_background; never multiply all receipts by a loss rate or charge an eventually resold jar twice. Supplier returns and failed external handovers retain receipt ID, recipient, actual state, return/delivery transport, final fate and continuing background owner. A transfer of responsibility requires a named coupled dataset and proof, otherwise carry the unresolved upstream burden and block completeness."
      source_ids:
        - ghg-product-2011
    - rule_id: provider_dedup
      applies_to: "foreground_system_boundary"
      rule: "Bind each waste output to transport and treatment of its exact carrier at the actual receiver; no assumed recycling credit. Purchased complete packages must expose scope by component and event. Exclude overlapping electricity, transport, packaging production, maintenance or end-of-life from one side only, with a scope matrix and retained amount. Unknown package scope blocks completion. Exclude customer travel/use and disposal of successfully sold jars with explicit downstream responsibility."
      source_ids:
        - jrc-retail-2013
    - rule_id: route_presence
      applies_to: "foreground_system_boundary"
      rule: "Use an all-electric store with manual goods handling and one ambient honey SKU in sealed glass jars; building comfort conditioning, if present, is R32 heat-pump based, not honey cold storage. Survey equipment, invoices and spill/maintenance logs. Document absence of other fuels, purchased heat, cold rooms, powered handling, other refrigerants, disinfection agents and emissions. If present, add specific atomic cards, protocols and bilingual sync before claiming dataset completeness; never hide actual exchanges in a generic row."
      source_ids:
        - jrc-retail-2013
