system_boundary:
  rules:
    - rule_id: route_gate
      applies_to: "all inventory rows"
      rule: "Require a complete real set including all three vehicles, detachable parts, magnets, coatings/adhesives/fasteners and original package body, closure, insert, label and printing. Supplier records plus inspection/weighing must resolve each material/state and net mass; website package shipping weight is not toy or package tare. Never use pure beech kg for the complete toy. Manufacturer age3+ and CE statements are descriptive statements only: retain actual labels and jurisdiction evidence, do not claim verified compliance or prescribe a safety limit. Any opening, missing piece, battery, assembly, testing, demo or added bag/receipt/pallet requires a concrete state-specific atomic card/protocol in both languages before dataset completeness."
      source_ids:
        - ikea-lillabo-spec
    - rule_id: custody_boundary
      applies_to: "receipt; customer_return; customer_handover; supplier_transfer; internal_transfer; external_retention; toy_waste"
      rule: "Use goods-only stock G separately from held waste W. Gross event balance: G_open+N_receipt+N_return=G_close+N_handover+N_supplier+N_internal+N_external+C_condemned+L_missing. N_handover is an initially qualified customer handover; N_external is an initially never-accepted external handover. Their eventID sets are disjoint and each physical exit appears once. A later acceptance revocation without return changes no physical count. Count every physical return/handover event even for the same originalID. Condemnation moves goods to held waste once; W_open+kg_condemned+kg_other_admitted=W_close+kg_dispatch. Actual dispatch is weighed net carrier kg, never subtracted from goods again. L_missing is a discrepancy requiring investigation, not an environmental emission or waste exchange; unresolved recipient/state blocks completeness. External retention without qualified acceptance remains a failed event and uses its actual recipient/state transfer, not retailer waste."
      source_ids: []
    - rule_id: source_responsibility
      applies_to: "all inventory rows"
      rule: "At first store receiving bind each originalID to its full supplier source vector G_i, in original complete-set units, containing toy, original package and supplier-to-store transport exactly once with separate component/source locators. Partition original source responsibility into disjoint S (final accepted), F (retailer failed/lost responsibility), O (open inventory), T (named supplier/internal/external continuing owner); G_total=G_S+G_F+G_O+G_T, component by component. These are environmental source ownership ledgers, not extra physical exchanges. The partial service includes G_F exactly once through failed_supply; it excludes G_S, G_O and G_T. Each originalID has one whole final responsibility; partial component ownership requires a supplier-inventory-vector extension before completeness. Downstream sold product couples G_S/Q separately; O and T carry their sources forward by signed ownership. Supplier return never deletes burden. A retained failed item, stolen/lost item or acceptance revoked without return keeps its same original source; F unless evidenced continuing T owner accepts it. No new production on resale; demo conversion transfers the same source to an asset T and is outside this route."
      source_ids: []
    - rule_id: boundary_completion
      applies_to: "all inventory rows"
      rule: "This is explicitly a partial custody/checkout module, including gross goods movements, service, dedicated local checkout AC, actual whole toy-waste dispatch and G_F background through failed_supply. Complete retail requires disjoint modules for (1) premises operation: storage/lighting/natural ventilation fans and cleaning water/formulation/wipe/effluent carriers, under the evidenced no-combustion/no-refrigerant/no-HVAC/no-purchased-heat/cold route; (2) ICT/network and digital receipt service, separating measured local AC; (3) full capital: building including fixed luminaires/fan, shelves, checkout hardware and handling equipment, installation, actual maintenance and terminal carriers; (4) all post-gate supplier/internal/waste transport and actual empty/idle trips; (5) waste treatment after this dispatch gate. G_F is already included and must not be added again. Supplier-to-store freight stays solely in G_i and is excluded from module4. Source BOMS and package identity are mandatory for G_i even though sold-G_S manufacture is outside incremental service. Execute completion_collect, lifetime_share, transport_complete and completion_sum with the same pool/version and Q. No claim of complete business, whole-product LCA or standard conformity is allowed for this module alone."
      source_ids:
        - ghg-product2011
