      output: "toy_waste kg/Q"
      source_ids: []
    - id: source_responsibility
      applies_to: "failed_supply"
      rule: "N_F=count distinct final whole F originalIDs; q_F=N_F/Q original complete-pack equivalents. Couple each ID actual G_i once, not a generic average if suppliers differ; conserve G_total=G_S+G_F+G_O+G_T by original sourceID/version. G_S/Q belongs only to the separate sold-product downstream coupling."
      inputs:
        - "all originalID"
        - "G_i supplier/component/package/inbound vectors"
        - "S/F/O/T final whole ownership"
        - N_F
        - "sourceID/version"
        - Q
        - cp_supply
      output: "failed_supply Item(s)/Q with actual source links"
      source_ids: []
    - id: completion_collect
      applies_to: "boundary_completion"
      rule: "Restore each provider module to its original pool raw exchange vector R_m=z_m*D_m only when z_m is normalized and D_m is its evidenced original denominator; raw inventories remain unchanged. Subdivide source pools and attribute to this pool by shared_subdivision. For premises cleaning retain each actual purchased formulation kg with mutually exclusive final formulation-origin destinations: unused closing stock, used solution/wipe/container-residue closing stock, dispatched liquid/wipe/container, actual product carryout and measured original-formulation component/element mass transferred outside. Keep actual outside molecular species kg separate from original-formulation component/element kg. Source-origin mass excludes atoms acquired from outside reactants, added water or dirt. Use one evidenced disjoint component or element accounting basis across destinations; never add component totals to their constituent element totals or substitute partial elemental kg for whole formulation kg. For species s and source component/element c, retain actual molecular composition w_c_s (kg of c per kg of molecular species), source_attribution_mode and its evidence. In source_resolved mode use the directly measured original-source c kg unchanged. In source_fraction mode apply one evidenced source_fraction_c_s to the measured c mass once: g_origin_c_s=q_out_s*w_c_s*source_fraction_c_s, where q_out_s is outside molecular species s kg and g_origin_c_s is formulation-origin component/element c kg for that species; source_fraction is the share of that measured c mass from the identified formulation lot, not formulation concentration. Do not apply it again to source-resolved data. Never divide each species kg by formulation concentration to reconstruct whole formulation kg and then sum those reconstructed values across species. Complete source composition and conservation are required before reconstructing any whole-formulation source-mass total; otherwise retain the unresolved component/element vector. correction_mode and source_attribution_mode are independent recorded states: already blank-corrected data receive no further background subtraction, and already source-resolved data receive no further source-fraction multiplication. Used is an intermediate state replaced by its final destination, never an additional destination; retained and dispatched portions of the same container are disjoint; added rinse water/dirt is excluded from formulation-origin kg. Actual whole wet liquid/wipe/container kg is separate, never multiplied again by formulation fractions. Imported metered water is already net of internal reuse: no reuse subtraction. Direct effluent is actual V_discharge*rho of whole liquid; no evaporation/storage deductions; supply/stock balance is independent. Require measured full-liquid composition including dissolved formulation/dirt; do not turn water-only volume into whole carrier by an unrelated density. On-site fuel/refrigerant/HVAC and purchased heat/cold are prohibited by this route; verify complete store/landlord equipment and utility evidence or stop applicability. Transport fuel/species remain inside the complete transport provider inventory. Species emissions require actual species kg crossing the outside air/water/soil boundary from inlet/outlet mass flux, reconciled air/capture/storage changes; internal room generation is not outside release. Use either raw absolute inlet/outlet flux minus one background or already differential/blank-corrected data unchanged; never subtract blank twice. Retain capture/condensate in its actual whole carrier once; any discovered refrigerant equipment makes this route inapplicable. For each species and measured external-boundary interval t, integrate q_out_raw=sum_t((F_out,t-F_in,t)*dt) in kg, with measured F in kg/h and dt in h. In raw absolute mode remove the matched measured background/blank once; differential mode uses the observed net rate unchanged; already blank-corrected mode removes nothing further. Direct external flux is not reduced again by capture or storage; measured internal air/capture/storage is an independent mass-conservation check and each actual captured export is a disjoint carrier. Negative/unknown outside flux requires investigation, not clamp/credit."
      inputs:
        - moduleID
        - z_m
        - D_m
        - "raw R_m"
        - "sourceID/version"
        - "source pool drivers"
        - "actual formulation-origin kg by exclusive final destinations"
        - "formulation lot and complete source composition"
        - "disjoint component/element mass basis"
        - "outside molecular species q_out_s kg"
        - "molecular composition w_c_s"
        - "measured source-resolved c kg"
        - "source_fraction_c_s and measured-c-mass basis"
        - source_attribution_mode
        - "independent correction_mode"
        - "source attribution/composition/blank evidence"
        - "container held/dispatch split"
        - "whole wet carrier kg"
        - "import/discharge meters"
        - "liquid rho/composition"
        - "supply/storage check"
        - "complete store/landlord absence evidence"
        - "species identity/medium"
        - "interval start/end"
        - "measured inlet/outlet F kg/h"
        - "dt h"
        - "integrated net kg"
        - "correction mode"
        - "background/blank"
        - "air/capture/storage/carryout"
        - cp_completion
      output: "Compatible attributed raw atomic exchange numerators; completion gaps"
      source_ids:
        - ghg-product2011
    - id: lifetime_share
      applies_to: "boundary_completion"
      rule: "For each actual asset and beneficiary p use f_ap=e_ap/L_a and vector A_ap=A_a*f_ap with same-unit lifetime exposure and full historical replacement-version correction under allocation rule lifetime_share. Use actual terminal net kg*f_ap once, with final retirement denominator; maintenance source vectors are separate events."
      inputs:
        - assetID
        - "full A_a source vector and BOM"
        - e_ap
        - "all beneficiary history"
        - "L_a expected/revised/actual unit"
        - "old/new versions"
        - "actual terminal net kg and mode"
        - "maintenance events"
        - cp_completion
      output: "Attributed raw capital/maintenance/terminal vectors"
      source_ids:
        - ghg-product2011
    - id: transport_complete
      applies_to: "boundary_completion"
      rule: "Use one signed complete actual consignment-attributed provider life-cycle inventory for every post-gate trip, including all observed loaded, empty-return and stationary-idle legs, actual fuel/species and vehicle manufacturing/maintenance/retirement. Provider allocation evidence must retain segment-specific reserved payload kg and reservation h for every actual beneficiary, including operator unused capacity and empty/idle reservations; full-trip source totals and all positive same-unit kg*h driver totals must reconcile. Preserve the already attributed consignment vector unchanged, without another driver multiplication. A provider inventory excluding actual empty/idle legs, incomplete lifecycle scope or unknown allocation is unavailable; this route has no substitute-distance or unmeasured-fuel fallback. Original supplier-to-first-store segments remain only in G_i."
      inputs:
        - "trip/segmentID"
        - "signed consignment source inventory and full lifecycle/empty/idle scope"
        - "original provider denominator and allocation evidence"
        - "all beneficiary reserved payload kg"
        - "reservation h"
        - "operator unused/empty/idle reservations"
        - "positive kg*h driver totals"
        - "full-trip sources"
        - "fuel/species/vehicle sourceIDs"
        - "inbound overlap"
        - cp_completion
      output: "Attributed raw post-gate transport exchange vector"
      source_ids:
        - ghg-product2011
    - id: completion_sum
      applies_to: "all inventory rows"
      rule: "For each matching flow identity/type/state/compartment/property/unit r, q_complete,r=(X_core,r+sum_m X_attributed,mr)/Q. Restore normalized provider vectors by completion_collect first, then sum only compatible raw numerators with exact sourceID/version deduplication and disjoint gates. Never add count to kg, kg to MJ, raw to normalized, or satellite goods movements to represented environmental source inputs. G_F is already in failed_supply; G_S/Q remains an explicitly separate downstream product coupling. Require identical pool/configuration/version and Q across modules; retain partial status until all fixed modules and additional actual atomic cards are complete."
      inputs:
        - X_core
        - r
        - "all X_attributed"
        - mr
        - "restored z_m/D_m"
        - "flow/property/unit matching"
        - "sourceID/version dedup ledger"
        - Q
        - cp_completion
      output: "Complete per-reference atomic inventory, only after coverage acceptance"
      source_ids: []
  data_quality_requirements:
    - id: q_configuration
      applies_to: "all inventory rows"
      requirement: "Obtain real full supplier BOM and actual receiving toy/package/component masses; inspect cell/motor absence and complete magnets/paint/label components; actual age labels and signed no-demo/no-assembly/no-repack route evidence are required, not assumed."
      evidence: "Supplier revision; inspection photos; calibrated scale; labels; gate/event records"
    - id: q_coverage
      applies_to: "all inventory rows"
      requirement: "Cover full prospective pool including refused/failed/closed/idle events, opening/closing stocks, no-return revocations and later corrections. Retain sampling/uncertainty/calibration and raw originals; unexplained missing events or source ownership remain gaps."
      evidence: "Event completeness and stock/source reconciliation; version ledger"
    - id: q_partial
      applies_to: "all inventory rows"
      requirement: "Core custody rows receipt, customer_return, customer_handover, supplier_transfer, internal_transfer and external_retention are explicitly satellite physical flows without production links. failed_supply alone represents G_F. Disclose each excluded completion module, actual present/absent evidence, unbound identities and fixed completion results; partial core cannot be substituted for full retail."
      evidence: "Module coverage matrix; provider contracts; sourceID deduplication; actual atomic extensions"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Unbound flow identities block database binding and publication, not a license to invent UUIDs. Before complete dataset use, direct-read each selected type, state, compartment and property/unit chain; retain original exact-byte hash and matching receipt. AC UUID is a point-of-use identity only and does not select grid/provider/voltage/loss. Require the actual upstream electricity source and country/time."
    source_ids: []
  - rule_id: v_balances
    applies_to: "all inventory rows"
    rule: "Reconcile gross physical event balance, goods-to-waste count/mass conversion by originalID and actual mass, held-waste balance, final acceptance ledger and G_i source ownership independently. Weigh toy, package and mixed complete waste carriers separately; no nominal webpage mass, unknown-zero or mass fraction split of an environmental vector. S/F/O/T ownership may change without physical movement. Check that every card uses reference_flow and exactly one final /Q; do not multiply source/destination or lifetime fractions twice."
    source_ids: []
  - rule_id: v_completeness
    applies_to: "all inventory rows"
    rule: "For each conditional card/module retain site inspection, provider contract and event/meter evidence of presence or evidenced absence for the complete pool. Unknown is unresolved. Missing BOM/magnets/packaging/cell inspection, source G_i, asset history, air/liquid fate, failed external recipient or provider empty-trip coverage blocks completeness. Additional actual exchanges require named atomic cards, raw protocols, calculations and bilingual sync before completeness; do not silently omit them. Publish partial scope and skipped modules even if numeric totals are available."
    source_ids: []
  - rule_id: v_versions
    applies_to: "all inventory rows"
    rule: "Require one source-version ledger across raw totals, attributed numerators, Q and all completion modules. Preserve original measurements; corrections replace earlier versions for every affected pool/beneficiary. Validate units before row-by-row sum, sourceID deduplication, provider boundaries and final acceptance chronology. This candidate is methodology guidance, not verified safety or environmental approval."
    source_ids: []
