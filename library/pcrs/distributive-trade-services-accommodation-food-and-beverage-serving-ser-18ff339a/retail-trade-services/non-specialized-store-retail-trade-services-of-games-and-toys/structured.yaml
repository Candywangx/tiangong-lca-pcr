      output: "six distinct count/Q exchanges"
      source_ids: []
    - id: electricity_allocate
      applies_to: "checkout_ac"
      rule: "E_checkout_attributed_kWh=sum_j(E_j*d_pj/sum_b d_bj); direct dedicated mode uses measured E_checkout unchanged. Modes are exclusive. q_AC=3.6*E_checkout_attributed_kWh/Q MJ. Meter overlaps removed only once using shared_subdivision."
      inputs:
        - E_j
        - d_pj
        - "all d_bj and same unit"
        - "meter mode/overlap"
        - "direct E_checkout"
        - Q
        - cp_power
      output: "checkout_ac MJ/Q"
      source_ids:
