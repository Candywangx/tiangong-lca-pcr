allocation_rules:
  - rule_id: pool_acceptance
    applies_to: "accepted_service"
    rule: "Prospectively fix one site/channel/article/BOM/operational configuration pool with start/end dates and correction cutoff, retaining all failed, refused, idle and zero-sale cohorts. Q is the count of distinct originalIDs with final-valid qualified complete sealed-set acceptance at cutoff; do not subtract revoked IDs a second time. Financial refunds/discounts with valid acceptance do not change Q. Revocation without physical return removes acceptance. Repeated handover or resale of the same ID yields at most one final service; record all attempts. Late events replace original pool numerator, Q, stock/fates and S/F/O/T version using actual dates; do not charge a new period again. Q=0 is unnormalizable, carried visibly into the predeclared same-configuration pool, never dropped."
    source_ids: []
  - rule_id: shared_subdivision
    applies_to: "checkout_ac; all completion modules"
    rule: "Use dedicated meters/subdivision first. For a shared electricity parent split measured active, idle and fixed source-numerator pools E_j that reconcile to parent kWh. Within each j allocate E_j*d_pj/sum_b(d_bj) using one causal driver in the same unit for every actual beneficiary: active equipment measured busy h, idle equipment reserved h, premises fixed operation occupied/reserved m2*h. Closed/zero-sale reservations remain. Never sum h with m2*h or incompatible counts. Require known positive all-beneficiary denominators or retain unresolved. Subtract a submeter once only where its physical circuit is inside that parent; an independent disjoint meter needs no subtraction. Convert attributed kWh to MJ by3.6 and divide Q once."
    source_ids:
      - ghg-product2011
  - rule_id: lifetime_share
    applies_to: "all capital completion modules"
    rule: "For each actual asset retain full manufacturing/installation source vector A_a, complete object BOM and explicit operation/maintenance/end-of-life exclusions. Asset e_ap is beneficiary exposure and L_a is expected total lifetime exposure in the same unit: shelf/building reserved m2*h; checkout/handling equipment reserved device*h, including idle/closed reservations and all beneficiaries/history. f_ap=e_ap/L_a; A_ap=A_a*f_ap. After every life revision replace every historical beneficiary allocation with the new L_a, never restart full A_a. Cumulative fractions must not exceed1; at actual retirement use actual total lifetime exposure and replace all prior allocations so final fractions sum1. Actual maintenance events allocate by their evidenced beneficiary exposure, separate from manufacturing. Whole terminal carrier net kg multiplies its final lifetime fraction once, not a second manufacturing fraction; direct net weighing and BOM reconstruction excluding previously removed parts are exclusive. Provider lifecycle package requires signed model scope and sourceIDs; do not add its contained retirement again."
    source_ids:
      - ghg-product2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "retail"
      flow_role: "receipt; customer_return; customer_handover; supplier_transfer; internal_transfer; external_retention"
      record_type: "goods-only event register"
      raw_fields: "originalID; eventID; article; lot; BOMrevision; package seal/state; three vehicle/part presence; cell/motor inspection; event time; opening/closing goods; gross receipt/return/handover counts; initially qualified versus initially never-accepted disjoint exit eventIDs; condemnation count and actual kg; missing count; named recipient; physical handover signoff; owner S/F/O/T; sourceIDs"
      collection_method: "Scan originalID at each physical gate; inspect seal/parts and labels; reconcile stock counts, calibrated net weighing and signed handovers. Record financial/acceptance changes separately; do not invent a physical event. Aggregation detail: Raw gross totals by event type; apply custody_boundary; divide attributed event numerator by Q once"
      unit: "Item(s); kg"
      frequency: "Each event and period close"
      temporal_coverage: "Whole pool, including opening inventory and late corrections"
      site_scope: "Store receiving to final custody gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Unique event IDs; photos; signed recipient/stock records; scale calibration; correction versions"
    - protocol_id: cp_acceptance
      process_id: "retail"
      flow_role: "accepted_service"
      record_type: "final acceptance ledger"
      raw_fields: "originalID; poolID; gross handover links; complete sealed acceptance test and evidence; accept/revoke timestamps; physical return yes/no; financial adjustment only flag; cutoff; final valid state; prior versions; Q"
      collection_method: "Join acceptance and custody by originalID without using payment as acceptance. Apply acceptance_count to distinct final-valid IDs after corrections. Aggregation detail: Q=count distinct valid IDs; output1 Item(s); Q=0 unnormalizable"
      unit: "Item(s)"
      frequency: "Every acceptance/correction and cutoff"
      temporal_coverage: "Whole pool and reopened original versions"
      site_scope: "Same article/BOM/site/channel"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed/traceable acceptance criterion; correction history; gross ledger reconciliation"
    - protocol_id: cp_power
      process_id: "retail"
      flow_role: "checkout_ac"
      record_type: "meter and causal allocation register"
      raw_fields: "meterID; circuit diagram; time; start/end kWh; calibration; parent/submeter overlap; E_j active/idle/fixed kWh; all-beneficiary driver d_bj and unit; checkout attributable kWh; closed/failed/zero-sale hours; source/provider country/time; uncertainty"
      collection_method: "Use calibrated submeter for exact checkout circuit; subdivide shared parent only by measured pool and one common causal driver per pool; reconcile full parent. Aggregation detail: electricity_allocate yields attributed raw kWh then MJ/Q once"
      unit: "kWh; h; m2*h"
      frequency: "Interval readings plus each configuration change"
      temporal_coverage: "Entire pool including idle/closed"
      site_scope: "Dedicated measured checkout boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration and diagram; all-beneficiary reconciliation; provider boundary"
    - protocol_id: cp_waste
      process_id: "retail"
      flow_role: "toy_waste"
      record_type: "whole carrier dispatch and held-waste ledger"
      raw_fields: "consignmentID; originalIDs; condemnation times and count/kg; W_open/W_close kg; actual full toy/package material/BOM; dry state; cells absent; whole gross/tare/net kg; carrier/container exclusion; removed parts; receiver; transport/treatment scope; sourceIDs"
      collection_method: "Calibrated consignment net weighing at dispatch excluding outside container. Reconcile held-waste stock independently; do not reconstruct direct dispatched kg from generation balance. Aggregation detail: waste_dispatch; sum actual nonduplicated net dispatch kg/Q"
      unit: "kg; Item(s)"
      frequency: "Each condemnation, dispatch and stock close"
      temporal_coverage: "Whole pool with opening/closing held waste"
      site_scope: "Store waste holding to signed dispatch gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/tare records; photographs; manifests; recipient acceptance; cells/parts audit"
    - protocol_id: cp_supply
      process_id: "retail"
      flow_role: "failed_supply"
      record_type: "original supply and final responsibility ledger"
      raw_fields: "originalID; complete article/BOM/package; supplier sourceID and version; G_i original boundary/unit; production/original packaging/inbound segment source locators; actual supply units; S/F/O/T signed owner; N_F; no-return revocations; loss recipient/state investigation; stock transfer links"
      collection_method: "Obtain complete supplier inventory or reconstruct from verified supplier component inventories and actual BOM, including magnets/coating/packaging and actual inbound freight; preserve component source conservation. Bind final whole originalID ownership before applying N_F/Q. Missing data remain unresolved. Aggregation detail: Sum G_F from unique final F IDs once; receipt and other custody rows have no background link; divide Q once"
      unit: "Item(s); kg; source-vector units"
      frequency: "Each receipt, ownership change and correction"
      temporal_coverage: "All original sources and current/historical pools"
      site_scope: "Cradle through first store receiving"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original provider inventories; full BOM/weighings; freight scope; ownership signatures; version conservation"
    - protocol_id: cp_completion
      process_id: "retail"
      flow_role: "boundary_completion"
      record_type: "disjoint external completion module ledger"
      raw_fields: "moduleID; sourceID/version; actual atomic flow identity/type/state/medium/property/unit; provider boundary; original denominator D_m; original raw numerator or normalized z_m; pool dates/site/configuration; all-beneficiary meters/drivers; capital A_a/e_ap/L_a/history/final carriers; complete store/landlord no-combustion/no-refrigerant/no-HVAC/no-purchased-heat/cold evidence; actual cleaning formulation final origin-destination kg and exclusive container retained/dispatch/wet carriers; formulation lot and complete source composition; disjoint component/element basis and units; outside molecular species q_out_s kg; molecular composition w_c_s; directly measured source-resolved c kg; source_fraction_c_s and source-fraction basis; source_attribution_mode; correction_mode; source attribution/composition/blank evidence; water/effluent meters; species identity/medium and external-boundary interval start/end, inlet/outlet F kg/h, dt h, correction mode, integrated net kg/capture/storage; actual trip/segment all-beneficiary reserved payload kg/reservation h/operator unused/empty/idle data and signed complete consignment inventory; dedup links; Q"
      collection_method: "Collect signed complete inventories for the fixed boundary_completion list. Verify measured species molecular composition and original formulation-lot source attribution against laboratory/source records; preserve component/element units and independent source_attribution_mode/correction_mode, excluding outside reaction atoms and avoiding repeated fractions or blank subtraction. Use prescribed completion_collect/lifetime_share/transport_complete; retain actual absence evidence. Add actual named atomic cards and bilingual protocols for each present exchange before a completed dataset is claimed. Aggregation detail: Restore compatible raw module numerators, attribute then completion_sum; no mixed-unit scalar"
      unit: "original module units"
      frequency: "Each source event/version, meter interval and pool close"
      temporal_coverage: "Same full pool plus complete asset history"
      site_scope: "Each explicitly excluded module with nonoverlapping gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed provider inventory/scope; source hashes; meters/calibration; full driver denominators; asset correction ledger; receiver records"
  calculation_rules:
    - id: acceptance_count
      applies_to: "accepted_service"
      rule: "Q = count(distinct originalID with final valid qualified acceptance at cutoff); output=Q/Q=1 Item(s). Revoked IDs are absent from the final set, not subtracted again. Late changes replace original numerator and denominator together."
      inputs:
        - originalID
        - "final valid state"
        - "accept/revoke timestamps"
        - cutoff
        - cp_acceptance
      output: "Q; 1 Item(s) accepted_service"
      source_ids: []
    - id: custody_normalize
      applies_to: "receipt; customer_return; customer_handover; supplier_transfer; internal_transfer; external_retention"
      rule: "For each event type r, q_r = N_r/Q using the gross actual physical event count once. Validate custody_boundary first; source ownership or no-return revocation creates no additional physical N_r."
      inputs:
        - N_receipt
        - N_return
        - N_handover
