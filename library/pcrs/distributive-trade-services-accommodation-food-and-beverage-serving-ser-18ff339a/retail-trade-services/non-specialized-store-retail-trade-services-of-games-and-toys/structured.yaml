    - id: waste_dispatch
      applies_to: "toy_waste"
      rule: "kg_dispatch=sum actual (gross_kg-tare_kg) over unique dispatched consignments; q_waste=kg_dispatch/Q. Held-waste balance is an independent check, not another correction. No constituent kg duplicated beside the admitted whole carrier."
