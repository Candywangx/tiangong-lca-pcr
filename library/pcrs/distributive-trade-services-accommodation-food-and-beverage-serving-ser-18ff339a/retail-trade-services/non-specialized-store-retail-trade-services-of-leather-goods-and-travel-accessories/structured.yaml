allocation_rules:
  - rule_id: a_reference
    applies_to: "all inventory rows"
    rule: "Before activity, define one same-configuration12-month receiving/service pool and closing date plus return observation window; retain every failed and zero-sale period. Q is the count of distinct original IDs with exactly one final-valid qualified customer acceptance in that pool. A later revocation, including without physical return, reclassifies that ID and revises the original numerator, denominator and fates using dated replacement versions. Do not subtract revocations again from the final-valid set. A refund/discount with acceptance still valid leaves Q unchanged. Re-sale of a returned original creates no second ID or service. Q=0 makes the pool unnormalizable; carry its raw burdens into its predeclared same-configuration continuation, never delete it or switch products."
    source_ids:
      - ghg-product-2011
  - rule_id: a_original
    applies_to: "failed_original"
    rule: "For each received original u, mutually exclusive S/F/O/T ownership coefficients sum to1. S is final-valid sold background, F is retailer-responsible failure/loss/external retention without qualified acceptance, O is still-open stock/background and T is documented transfer to supplier or named internal asset. For whole original packs use one0/1 owner, never split the environmental vector by component mass. Sum B_u_S goes to a separately disclosed successful-merchandise module; N_F source-equivalent packs feed failed_original and each links its actual matching B_u_F exactly once. Retain separate original-source strata and actual N_F_source counts on this card; attach each distinct supplier vector only to its matching stratum, then sum compatible characterized numerators. A common SKU does not make different supplier vectors identical. O carries original versions; T retains signed continuing recipient responsibility, never vanishes. Physical supplier handover and background T are separate ledgers. Lost originals have F responsibility even with no waste carrier; unknown physical fate blocks completed use. Revise every historic ownership version; no raw receipt, custody output or waste descendant gets B_u again."
    source_ids:
      - ghg-product-2011
  - rule_id: a_support
    applies_to: "all inventory rows"
    rule: "Complete support assembly starts from disjoint original source numerators: site HVAC/lighting/security/socket electricity, network/payment provider services, cleaning, assets and waste treatment. Direct meter/subdivision precedes allocation. Parent meter subtraction is allowed only for physically included counter circuits; an independent disjoint meter is never subtracted. Split active and fixed/idle source pools with measured same-unit reconciliation. Allocate each source pool by one same-unit causal driver across all store beneficiaries: counter service active seconds, site area_m2*actual_h(m2*h), network active transaction seconds and fixed reserved_port_count*actual_h(port*h). For each disjoint source pool m use f_m=d_target_m/sum_all_b(d_b_m), with known positive same-unit denominator and all residual/unused shares assigned to the operator; all shares sum to1. If an active pool has no driver, keep it unresolved rather than invent a share. Include closed/idle/failed and unused capacity assigned to operator; never sum unlike drivers. For each external module retain source ID/version, original denominator d_m, unrounded normalized exchange x_mj and beneficiary share f_m. Restore raw compatible numerator n_mj=x_mj*d_m*f_m; if already beneficiary-attributed set f_m=1 and use driver records only as QA. Assemble each compatible exchange/property/unit numerator as X_core_j+sum disjoint external_n_mj, using source-ID/event/component exact deduplication; X_core_AC=3.6*E_counter, and the failed_original original-source strata already carry each F-owned B_u once, so no separate F vector is added. Physical custody satellites are not environmental vectors and never enter that sum. Restore any normalized core row by its original Q first, never add normalized rows to raw sources. Include the separately owned successful-merchandise module only when total product-through-retail is requested; divide by common final Q only once. Incompatible quantities stay separate. No arbitrary model choice is deferred to data producers."
    source_ids:
      - jrc-retail-2013
      - ghg-product-2011
  - rule_id: a_assets
    applies_to: "all inventory rows"
    rule: "For each actual complete building/fixtures package, shelf/cabinet, lighting/fan/heater and counter/scanner/payment/network device, fix a signed full-BOM manufacturing/installation vector with explicit package exclusions. Cover necessary objects in exactly one evidenced package or separate module. Persistent ledger holds every historical beneficiary exposure e_b and expected lifetime exposure L in the same unit: building/fixtures reserved m2*h, individual devices reserved h. Manufacturing/installation, operation, event maintenance and end-of-life are disjoint source scopes; a package containing end-of-life cannot also receive another terminal treatment vector. Current allocation is e_b/L; a new lifetime version replaces all prior allocations, never restarts manufacture. Fractions across all historical beneficiaries cannot exceed1. At actual retirement replace expected L by total actual exposure and allocate residual to all historic beneficiaries once; terminal complete-object carrier kg follows that final responsibility fraction once, without a second manufacture fraction. Direct net terminal weighing and BOM reconstruction are exclusive; removed parts are not subtracted twice. Operation electricity is separate; actual replacement/repair components are event-specific unless signed included in the complete package."
    source_ids:
      - ghg-product-2011
  - rule_id: a_clean
    applies_to: "all inventory rows"
    rule: "Allowed cleaning is measured water-only reusable microfiber wiping of actual store surfaces, no detergent/solvent/cream/polish. Signed site/landlord procurement and cleaning logs must establish absence of such formulations across the pool; any presence requires specific formulation/constituent and carrier cards before use under this PCR. Meter imported water W_in in kg; do not subtract internal reuse from an import meter. Use complete-cloth manufacturing and e_b/L cleaned-area m2 attribution with all historic versions as a_assets. Record actual dispensed water, whole wet spent cloth, retained wet cloth, and directly weighed whole collected cleaning liquid as disjoint final carriers. Intermediate used cloth later rinsed is a replacement state, not an additional terminal output. For each water source, imported-origin kg in retained cloth, dispatched cloth, collected liquid, evaporation and retained stock are mutually exclusive and sum to source kg; do not treat whole cloth/liquid kg as source-water kg. A separately added dry cloth is not water export. Measure whole final collected cleaning liquid by exactly one direct mode: W_liquid=gross_liquid_kg-tare_container_kg, or W_liquid=V_discharge*rho_measured using density sampled for that actual whole carrier at recorded temperature; the modes are mutually exclusive, with no water-balance reconstruction and no later evaporation/storage subtraction from the measured dispatch. Keep retained liquid/bucket residue and dispatched liquid/container residue separate; whole-container, wet-cloth and liquid terminal carriers have disjoint actual consignment IDs and no shared residue. Establish source-water-origin kg independently from water-content assays on each final carrier and source-linked opening/closing stocks, not from its whole-carrier kg; unknown other-water contribution blocks attribution. Unknown sinks or non-water cleaning block completeness."
    source_ids:
      - jrc-retail-2013
  - rule_id: a_transport
    applies_to: "all inventory rows"
    rule: "No retailer delivery is included. Original supplier-to-store transport is in B_u; waste collection and actual supplier-return transport are separate support sources with measured segments. For each actual segment s and beneficiary b allocate raw vehicle activity A_s by f_bs=(reserved_payload_kg_bs*actual_reserved_h_bs)/sum_b(reserved_payload_kg_bs*actual_reserved_h_bs). Record all beneficiaries, unused capacity assigned operator and empty/idle actual reserved hours; use observed distance for driving, observed stationary hours for time-based idle, never distance0 as zero activity. Empty trips require separately measured vehicle-km unless already evidenced in provider service. Provider-already-attributed consignment activity retains its allocation and uses this segment ledger only as QA. Reject missing coverage and double inclusion in B_u."
    source_ids:
      - jrc-retail-2013
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "goods and service"
      record_type: "custody_event_ledger"
      raw_fields: "pool_id; original_id; SKU; supplier_lot; species; complete_BOM; package_configuration; original_vector_id; vector_version; receiving_gate; B_u; event_id; event_date; physical_state; recipient; acceptance_status; revocation_date; original_pool; C_open; I; R_i; R_d; H_i; H_d; T_i; T_d; D; L; C_close; Q; N_F; N_F_source; S; F; O; T; W_dispatch; gross_kg; tare_kg; uncertainty; correction_version"
      collection_method: "Scan every movement and acceptance by immutable original/event ID at receiving/counter/returns/waste gate, including refusals, re-sales and no-return revocations. Calibrated count reconciliation and scale net consignment weighing; supplier full component/BOM and delivered-original vector audit. Investigate discrepancy rather than replace with balance-derived dispatch."
      unit: "Item(s); kg"
      frequency: "every event and closing correction"
      temporal_coverage: "entire fixed12-month pool and all later correction versions"
      site_scope: "store and actual external recipients"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed supplier records; acceptance log; calibrated scale; actual carrier receipt; source ownership audit"
    - protocol_id: cp_power
      process_id: "retail"
      flow_role: "counter electricity"
      record_type: "dedicated_meter"
      raw_fields: "meter_id; circuit_boundary; start_kWh; end_kWh; E_counter; read_dates; downtime; calibration; supply_location; voltage; provider; included_circuits; source_id; version; Q"
      collection_method: "Measure dedicated counter/scanner/payment circuit through active, closed, failed and idle periods. Retain calibrated start/end kWh and outage gap records; no nameplate energy substitution. Exclude separately metered facility circuit; include only documented counter devices."
      unit: "kWh"
      frequency: "continuous; monthly reconciliation"
      temporal_coverage: "same full pool including idle"
      site_scope: "declared counter circuit"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; circuit map; supplier bill"
    - protocol_id: cp_support
      process_id: "retail"
      flow_role: "required completion modules"
      record_type: "source_module_ledger"
      raw_fields: "source_id; version; component; d_m; x_mj; n_mj; external_n_mj; X_core_j; X_core_AC; E_counter; B_u; N_F_source; f_m; d_target_m; d_b_m; area_m2; actual_h; reserved_port_count; already_attributed; property; unit; beneficiary; active_pool; idle_pool; driver_unit; driver_value; all_beneficiaries; absence_evidence; asset_id; full_package_BOM; e_b; L; lifetime_version; all_historic_allocations; retirement_mass; direct_or_BOM_mode; W_in; final_water_origin_destinations; wet_cloth_mass; dry_cloth_mass; W_liquid; gross_liquid_kg; tare_container_kg; V_discharge; rho_measured; density_temperature; direct_mode; water_content_assay; source_water_origin_kg; opening_liquid; closing_liquid; retained_bucket_residue; dispatched_container_residue; carrier_consignment_id; segment_id; A_s; reserved_payload_kg_bs; actual_reserved_h_bs; empty_km; stationary_h; provider_boundary; Q"
      collection_method: "Collect actual meter/provider/cleaning/weighing/asset/segment evidence under a_support/a_assets/a_clean/a_transport. Establish whole-store and landlord absence of fuel/refrigerants and non-water cleaners. No source may enter two modules; unknown absence, incomplete history, provider scope or carrier identity blocks completion."
      unit: "source-specific kg; MJ; h; m2; vehicle-km"
      frequency: "each event; continuous meters; monthly pool reconciliation"
      temporal_coverage: "entire pool and all asset history"
      site_scope: "all actual beneficiaries and operator unused capacity"
      aggregation_rule: "per reference flow"
      quality_evidence: "original provider denominator; full bill/meter balance; signed package boundaries; lifetime versions; no-overlap register"
  calculation_rules:
    - id: c_service
      applies_to: "retail_service"
      rule: "Q=count(distinct final-valid original_id); retain final validity at correction version, not gross sales minus twice-counted revocations; output1 per reference flow."
      inputs:
        - original_id
        - acceptance_status
        - correction_version
        - Q
        - cp_goods
      output: "1 Item(s)"
      source_ids:
        - ghg-product-2011
    - id: c_goods
      applies_to: "failed_original; returned_intact; returned_damaged; handover_intact; handover_damaged; supplier_intact; supplier_damaged; discarded_pack"
      rule: "Use each explicit card numerator/Q once; N_F is the number of whole original packs with F ownership and matching B_u, not all received packs. W_dispatch=gross_kg-tare_kg is directly measured complete waste consignment net kg; do not add generation or apply stock corrections again. SFOT and custody checks use a_original and v_conserve without inventing physical exchanges."
      inputs:
        - N_F
        - N_F_source
        - B_u
        - R_i
        - R_d
        - H_i
        - H_d
        - T_i
        - T_d
        - W_dispatch
        - gross_kg
        - tare_kg
        - Q
        - cp_goods
      output: "normalized card quantities"
      source_ids:
        - ghg-product-2011
    - id: c_power
      applies_to: "counter_ac"
      rule: "E_counter=end_kWh-start_kWh; electricity_MJ=3.6*E_counter/Q. The3.6MJ/kWh conversion changes numerator units only; retain all original-period electricity after later Q correction."
      inputs:
        - E_counter
        - start_kWh
        - end_kWh
        - Q
        - cp_power
      output: "electricity_MJ"
      source_ids: []
    - id: c_completion
      applies_to: "all inventory rows"
      rule: "Apply fixed a_support/a_assets/a_clean/a_transport methods: n_mj=x_mj*d_m*f_m; external_n_mj=n_mj for the disjoint external modules; final_exchange_j=(X_core_j+sum compatible disjoint external_n_mj)/Q. X_core_AC=3.6*E_counter; failed_original already links every actual F-owned B_u once, no additional F vector; exclude physical custody satellites from environmental-vector aggregation. Already attributed f_m=1; restore source denominators and replace historical versions before summing. Only explicitly declared identical exchange/property/unit records combine."
      inputs:
        - X_core_j
        - X_core_AC
        - E_counter
        - B_u
        - N_F_source
        - x_mj
        - d_m
        - f_m
        - d_target_m
        - d_b_m
        - n_mj
        - external_n_mj
        - Q
        - cp_support
      output: "final_exchange_j"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
  data_quality_requirements:
    - id: q_product
      applies_to: "failed_original"
      requirement: "Verify exact SKU and actual full lot BOM/pack configuration, not marketing composition or another country/model. Record missing values and supplier-gate-equivalent inventory source per original."
      evidence: "signed supplier BOM and original vector boundary"
    - id: q_history
      applies_to: "all inventory rows"
      requirement: "Keep immutable events and replacement calculations with measured uncertainty, calibration, zero-output pools, late returns, all beneficiaries and supplier-background continuity; never delete adverse periods."
      evidence: "dated ledgers and balance exceptions"
    - id: q_partial
      applies_to: "all inventory rows"
      requirement: "Mandatory unbound-row quantities/identities and support completion cannot be inferred from a finite candidate measurement check. Publish every limitation, absence gate and unfinished module."
      evidence: "flow receipts; module denominator/dedup register; signed absence evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Each unbound row must resolve independently to an official record matching actual type, complete object/state and property/unit with original bytes and integrity-bound receipt before completed use. Historical verified property/unit support is not evidence that the specific service, goods, waste or provider flow exists. AC is point-of-use energy only; collect actual supply geography/voltage/provider and background before use."
    source_ids:
      - ghg-product-2011
  - rule_id: v_conserve
    applies_to: "all inventory rows"
    rule: "Reconcile total-custody count: C_close=C_open+I+R_i+R_d-H_i-H_d-T_i-T_d-D-L. H_i and H_d partition all gross customer exits, including never-accepted exits; they never overlap a separate refused-exit deduction. D is counted original packs actually dispatched as waste; condemnation is only goods-to-held-waste state change, not another exit. L is investigated physical loss with unknown recipient/state; no invented waste dispatch. Monetary adjustments and no-return acceptance revocations create no physical exit. Keep goods and held-waste substocks plus measured package/bag mass checks independently."
    source_ids:
      - ghg-product-2011
  - rule_id: v_complete
    applies_to: "all inventory rows"
    rule: "Pass only when Q>0; complete dated custody/SFOT and original vectors reconcile; every actual card has quantity/binding/provider evidence; zero-output periods persist; required support modules and absence gates are verified; compatible numerators and denominators deduplicate. Partial/inconclusive stays explicitly partial and cannot support complete-business, standard-conformity or comparative marketing claims. Do not infer species/BOM, zero emissions or methodology approval from this candidate check."
    source_ids:
      - jrc-retail-2013
      - ghg-product-2011
