      applies_to: "returned_intact; returned_damaged; handover_intact; handover_damaged; supplier_intact; supplier_damaged; discarded_pack"
      rule: "Only these seven named physical custody/waste rows are satellite physical accounting without another goods-production vector. They retain real recipient/state and count or actual whole-carrier mass. This exception does not cover failed_original, counter_ac, retail_service or any support/treatment input. Incoming original packs are raw receipt QA, not another characterized input. Repeated custody does not create another original B_u."
