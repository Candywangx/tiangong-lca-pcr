    - protocol_id: cp_split_support
      process_id: "split_support"
      flow_role: "split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_support_electricity; split_support_travel"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
  calculation_rules:
    - id: calc_goods
      applies_to: "service; failed_original"
      rule: "Q=count(distinct final-valid original_id). For s in U_whole only, N_F_whole=sum_s q_s*f_F_s in Item(s) and B_F_whole=sum_s q_s*f_F_s*V_s; failed_original=N_F_whole/Q links ONLY B_F_whole/Q. Each divergent original source is excluded from U_whole, never partly retained on that whole-roll row. Each actual new component/state card separately owns N_F_c_s=q_c_s*f_F_c_s in q_c_s native unit and B_F_c_s=N_F_c_s*V_c_s, amount N_F_c_s/Q. Component background vectors enter calc_completion only through those component cards, not failed_original. Preserve sum_owner f_owner_s=1 for S/F/T/O and each original/component vector; T/O retain the same unassigned source. Missing component source or card blocks completion."
      inputs:
        - original_id
        - valid_acceptance
        - revocation_date
        - U_whole
        - q_s
        - f_F_s
        - V_s
        - q_c_s
        - component_native_unit
        - f_F_c_s
        - V_c_s
        - N_F_whole
        - B_F_whole
        - N_F_c_s
        - B_F_c_s
        - S_F_T_O_owner
        - Q
      output: "Q; N_F_whole/Q; B_F_whole/Q; component_card_N_F_c_s/Q; component_card_B_F_c_s/Q"
      source_ids:
        - ghg-product-2011
    - id: calc_shared
      applies_to: "electricity"
      rule: "For each active/idle/fixed source class use its fixed driver from pool_allocation: d_k_active_h=measured processing seconds for counter/printer/payment; d_k_idle_h=R_k_idle_h and d_k_fixed_h=R_k_all_h for their reserved device seconds. R_k_c_h=sum_i device_seconds_k_c_i*A_h_i/sum_g A_g_i. Other source classes use the explicitly listed same-unit driver. K_trade=sum_k_c X_k_c*d_k_c_trade/sum_all_h d_k_c_h plus disjoint directly measured trade kWh; sum_c X_k_c equals parent kWh and all beneficiary allocations reproduce each X_k_c. Never add class drivers. Convert MJ=3.6*K_trade; final electricity=MJ/Q."
      inputs:
        - X_k_c
        - processing_s_k_h
        - device_seconds_k_c_i
        - A_h_i
        - A_g_i
        - R_k_idle_h
        - R_k_all_h
        - d_k_c_trade
        - d_k_c_h
        - all_beneficiaries
        - directly_measured_trade_kWh
        - containing_parent
        - submeter_id
        - K_trade
        - Q
      output: "K_trade; MJ/Q"
      source_ids:
        - ghg-product-2011
    - id: calc_consumables
      applies_to: "receipt_paper; carry_bag"
      rule: "M_first=sum first_use_net_kg by distinct original source; M_failed_unused=sum never_used_condemned_kg+never_used_confirmed_missing_kg. Reconcile never_used_opening+purchases=never_used_closing+never_used_transfer_return+M_first+M_failed_unused+signed_residual; any unresolved residual blocks completion. Reconcile first-used source kg to customer handover+used stock+actual discard+confirmed missing+signed residual. Printed WIP retains original paper and actual printing-energy source numerator/version; withdrawal replaces its original ownership version, never charges source twice. Final rows (M_paper_first+M_paper_failed_unused)/Q and (M_bag_first+M_bag_failed_unused)/Q."
      inputs:
        - never_used_opening
        - purchases
        - never_used_closing
        - never_used_transfer_return
        - confirmed_missing
        - signed_residual
        - customer_handover
        - used_stock
        - actual_discard
        - printed_WIP
        - prior_vector_version
        - M_paper_first
        - M_bag_first
        - M_paper_failed_unused
        - M_bag_failed_unused
        - first_use_net_kg
        - never_used_condemned_kg
        - never_used_confirmed_missing_kg
        - Q
      output: "(M_paper_first+M_paper_failed_unused)/Q; (M_bag_first+M_bag_failed_unused)/Q"
      source_ids:
        - ghg-product-2011
    - id: calc_assets
      applies_to: "capital"
      rule: "For checkout/printer/payment e_j_h is busy plus disjoint reserved idle/closed device-seconds; for trolley it is measured rated-payload-capacity-hours in kg*h under asset_allocation; other asset units stay as specified there. For every asset j and historical pool h, f_j_h=e_j_h/L_j; F_row=sum matching_j f_j_h. At actual retirement E_j=sum_all_h e_actual_j_h and f_final_j_h=e_actual_j_h/E_j. For every historical h replace old numerator: delta_j_h=f_new_j_h*V_new_j-f_old_j_h*V_old_j, including asset-owned independent transport. No residual shortcut. Record old and new Q_h and replace normalized version only after complete raw numerator correction. Final physical product package quantity=F_row/Q; terminal carrier source amount in V_j multiplied by same f once."
      inputs:
        - e_j_h
        - L_j
        - e_actual_j_h
        - E_j
        - f_old_j_h
        - f_new_j_h
        - V_old_j
        - V_new_j
        - independent_transport
        - old_version
        - new_version
        - Q_h
        - Q
        - F_row
        - busy_device_s_j_h
        - reserved_idle_device_s_j_h
        - A_h_i
        - A_g_i
        - trolley_capacity_kg
        - trolley_job_gross_kg_h
        - trolley_job_duration_h
        - trolley_empty_return_reservation
        - trolley_idle_duration_h
      output: "F_row/Q; historical_corrected_numerator"
      source_ids:
        - ghg-product-2011
    - id: calc_support
      applies_to: "support"
      rule: "H_clean is actual purchased labour h attributed once using the all-beneficiary cleaned area-event driver under cp_split_labour_support and c_split_quantity; A_clean remains a driver only. For each shared connection-period p, H_network_h=sum_p H_connection_p*R_port_p_h/sum_g R_port_p_g, where R_port_p_h is reserved supported device-port-seconds assigned across beneficiaries by measured busy time plus prospective idle/closed area shares; one physical port second is partitioned once. For each actual processing attempt a, b_a_h=processing_s_a_h/sum_g processing_s_a_g; N_payment_h=sum_a b_a_h, including failed/reversed attempts once. Shared basket overhead is assigned to lines in the same measured processing-second shares; sum_h b_a_h=1 and sum_h N_payment_h equals actual distinct attempts, never one full attempt per SKU pool. For each administration task t, active task hours are split by actual task-seconds_h/sum_g task-seconds_g; shared idle/closed reserved administration hours split by reserved supported workstation-seconds_h/sum_g reserved supported workstation-seconds_g from the prospective area map. H_admin_h sums those disjoint active and reserved-idle service hours; never give full office hours to every SKU. Preserve already provider-attributed beneficiary quantities and source vectors without another fraction; these equations apply only to unallocated shared service quantities. Restore provider active/idle/fixed source numerators separately: network active/idle/fixed uses reserved port-seconds, payment active uses processing seconds and idle/fixed reserved terminal-seconds, admin active task-seconds and idle/fixed reserved workstation-seconds. Reconstruct a matching beneficiary-specific provider vector from those raw attributed source numerators before linking the attributed service quantity; do not multiply a common whole-contract vector by a different share. A positive provider numerator with zero attributed service output remains a raw zero-output module in the prospective same-configuration pool and blocks normalized package use until actual compatible service quantity exists or a separately evidenced availability-service card is completed; never discard it. Divide each attributed service quantity by common Q once."
      inputs:
        - accepted_clean_area_each_pass
        - A_h_i
        - A_g_i
        - H_connection_p
        - R_port_p_h
        - R_port_p_g
        - processing_s_a_h
        - processing_s_a_g
        - b_a_h
        - payment_attempt_ID
        - failed_attempts
        - reversed_attempts
        - task_active_h_t
        - task_seconds_t_h
        - task_seconds_t_g
        - admin_reserved_idle_h
        - reserved_workstation_s_h
        - reserved_workstation_s_g
        - already_attributed_quantity_h
        - already_attributed_vector_h
        - X_k_c
        - d_k_c_h
        - reserved_terminal_s_h
        - all_beneficiaries
        - Q
        - measured_purchased_labour_h
        - cp_split_labour_support
      output: "H_clean/Q; H_network_h/Q; N_payment_h/Q; H_admin_h/Q"
      source_ids:
        - ghg-product-2011
    - id: calc_transport
      applies_to: "trade; custody; residual; capital; support"
      rule: "For an unallocated shared trip first verify the mass-constrained gate in transport_gate; capacity_unit is kg, never selected later from alternatives. For trip t segment s split measured same-unit source X_t_s into moving/idle pools. Moving driver=actual reserved gross payload kg_t_s_h*segment_km_t_s; idle driver=actual reserved gross payload kg_t_s_h*idle_hours_t_s. Empty returns preserve the originating signed job reservation to beneficiaries despite zero actual payload t*km; stationary idle uses actual duration. Sum_all_h allocations reproduce each source and positive sources require positive known total drivers. Actual volume/position-constrained routes require the separate supported extension before this method is usable. Provider already-attributed quantity keeps its native unit and original allocation; never multiply another reservation fraction. Asset transport first attaches to V_j then historical calc_assets f; original-goods inbound to S/F/T/O. Bind actual specific transport cards before completeness."
      inputs:
        - trip_t
        - segment_s
        - X_t_s
        - moving_source
        - idle_source
        - capacity_unit_kg
        - mass_constraint_evidence
        - reserved_gross_payload_kg_t_s_h
        - segment_km_t_s
        - idle_hours_t_s
        - originating_job_reservation
        - all_beneficiaries
        - provider_original_allocation
        - asset_j
        - V_j
        - f_j_h
        - S_F_T_O_owner
        - Q
      output: "transport_raw_numerator; original_source_attachment"
      source_ids:
        - ghg-product-2011
    - id: calc_completion
      applies_to: "all"
      rule: "For each actual core or added module m and identical exchange/property/unit x, restore N_m_x=normalized_m_x*D_original_m from the verified original pool/version. If already raw use it directly, never multiply twice. N_complete_x=N_core_x+sum_m N_disjoint_m_x after proven source/event/stage overlap removal. I_x=N_complete_x/Q. N_core includes B_F_whole through failed_original, each B_F_c_s through its own completed component card, and AC once; exclude merchandise S. Add and bind missing actual atomic cards/protocols/provider vectors in both languages, including component-divergent source, off-site/repair/transport or new actual wastes. A name list alone cannot complete the system."
      inputs:
        - normalized_m_x
        - D_original_m
        - original_pool
        - original_version
        - N_core_x
        - B_F_whole
        - B_F_c_s
        - AC
        - N_disjoint_m_x
        - source_id
        - overlap_event
        - lifecycle_stage
        - Q
      output: "I_x=N_complete_x/Q"
      source_ids:
        - ghg-product-2011
    - id: c_split_quantity
      applies_to: "floor_cleaning; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_support_electricity; split_support_travel"
      rule: "For each exact identity r in its single unit, restore normalized source q_source with its original denominator D_source as x_raw=q_source*D_source; already-raw quantities are not restored again. Apply only missing attribution once under split_attribution, deduplicate source/event/version and reverse old package and historical versions. Sum disjoint raw quantities as X_r; q_r=X_r/Q, dividing by the final reference denominator once. Labour uses measured purchased h only, never old order counts/area; in-house hours are QA only. Calculate asset counts, material kg, electricity kWh, vehicle*km and waste-carrier kg separately; never add across properties or multiply already-measured physical quantities by labour hours. Unknown quantity/identity/background blocks completeness."
      inputs:
        - X_r
        - D_source
        - q_source
        - Q
        - cp_split_labour_support
        - cp_split_support
      output: "q_r"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all"
      requirement: "Every row has either verified actual flow/type/property/unit/provider scope or explicit unresolved identity and completion condition; no generic collection selector."
      evidence: "Direct native identity records and matching property/unit chains; supplier signed inventories"
    - id: collection
      applies_to: "all"
      requirement: "Calibrated instruments, complete period/event coverage including zero/failure/idle; unknown is not zero; important amounts have actual records rather than invented ranges."
      evidence: "Calibration and source totals; failures and residual register"
    - id: package
      applies_to: "capital; support"
      requirement: "Complete asset or bounded service package is permitted only with signed constituent/stage inventory, real quantity denominator and explicit exclusions; unknown package contents prevent completeness."
      evidence: "Actual models/contracts, original provider vectors/denominators and overlap matrix"
    - id: stock
      applies_to: "all"
      requirement: "Separate never-used and used/WIP stocks, goods-only balance and held waste, physical handover and acceptance ledger; every original source conserves S/F/T/O."
      evidence: "Original IDs, signed owners and version replacement history"
validation_rules:
  - rule_id: validate_scope
    applies_to: "all"
    rule: "Require actual channel/assortment, sealed SKU/lot/BOM and no unreviewed cut/opened/wet/heat/refrigerant route. All required qualifiers are mandatory dataset fields. Manufacturer/retailer specifications establish product feasibility only, not field quantity, supply LCI, safe-use approval or whole-leaf coverage."
    source_ids:
      - tempaper-moire
      - target-moire
      - un-cpc62163
  - rule_id: validate_source
    applies_to: "all"
    rule: "Check each original and component vector conservation, physical satellite scope, F actual product input, S excluded once, T/O named continuing owner; late versions replace complete original numerators and Q. Require actual final-valid ID count and independent gross physical stock balance."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_quantity
    applies_to: "all"
    rule: "Reject missing/unknown numerator, nonpositive Q, orphan protocol/process/card, contradictory basis, mixed-unit addition or repeated allocation/composition fractions. Q=0 remains unnormalizable raw inventory. Every final card has reference_flow basis. No nominal installed coverage, shipping weight, density, lifetime, loss rate or treatment factor can replace measurement."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_complete
    applies_to: "all"
    rule: "Verify complete support packages and actual necessary model/module coverage, source-specific active/idle/fixed driver totals, all historical e/L→e/E corrections, independent transport attachment, actual receiver mixture acceptance and calc_completion raw restoration. Unknown identity/provider/range evidence remains disclosed and blocks affected use; method candidate status is not scientific approval. Do not claim complete service while any actual required module/card/source remains unfinished."
    source_ids:
      - ghg-product-2011
  - rule_id: split_completeness
    applies_to: "all inventory rows"
    rule: "Check every exact identity and single reference property, all actual work-order constituents, disjoint measurements, old-package reversal, no duplicated source/asset terminal scope, all-beneficiary historical attribution and one final normalization. Unverified sources, uncarded actual exchanges, unknown quantities or a mere claim of contract inclusion are incomplete."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Incremental counter-service input for this exact store/SKU/channel/configuration only after completion gates"
  allowed_use: "Disclosed actual complete incremental service; partial modules only with calc_completion and explicit incompleteness"
  excluded_use: "Installed wall-area function, all62163, specialist/cut-to-length route, successful-goods S manufacture, unbound complete-business claims"
  required_metadata: "Required qualifiers; original supplier and asset vectors; measured raw denominators/pools/versions; source/event deduplication; Q and channel evidence"
  required_quality_disclosure: "Identity/provider and empirical-range gaps; temporal/geographic representativeness; actual measured uncertainty; no default numeric ranges in this candidate"
  update_trigger: "SKU/BOM/lot/channel/route/provider/model changes; new sources; final acceptance returns; asset lifetime/retirement revisions"
