    reference: "Target, Tempaper Moire Dots Black/White, UPC651784106428; https://www.target.com/p/-/A-92367713"
    used_for: "Primary retail specification corroboration; mixed-retailer product listing, not proof of particular physical store availability or eligible route."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard(2011), chapters6 and9, PDFpp29–32,64–65; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Unit of analysis/reference flow and allocation hierarchy. The source does not mandate this PCR’s counter-service scope, causal drivers, S/F/T/O or lifetime equations; these are explicit candidate method choices with collection duties, no full-standard conformity claim."
  - id: "jrc-retail-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Environmental Management Practice in the Retail Trade Sector(2013), EUR25998EN, PDFpp18–19; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Retail energy, water/chemicals, waste, transport, packaging, lighting and value-chain process identification only; no numerical defaults or benchmark limits."
