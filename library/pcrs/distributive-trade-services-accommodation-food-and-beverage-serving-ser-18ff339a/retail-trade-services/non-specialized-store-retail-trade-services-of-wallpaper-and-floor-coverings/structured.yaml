allocation_rules:
  - rule_id: pool_allocation
    applies_to: "all"
    rule: "Declare the same-store/SKU/configuration reporting pool and all beneficiaries prospectively. Keep failure/zero-sale/closed periods. For each source k split active/idle/fixed X_k_c in the SAME source unit, reconcile their sum to the parent, and allocate each class separately. Counter/printer/payment active sources use measured beneficiary processing seconds. Their idle sources use reserved idle device-seconds and fixed sources reserved all-state device-seconds, never zero transaction seconds. Before each interval i map actual dedicated/reserved selling-and-storage floor area A_h_i in m2 to every beneficiary, including failed/zero-sale cohorts and reserved empty slots; sum_h A_h_i covers all eligible dedicated/reserved area. Common aisles follow these same shares. Reserved idle/all-state device seconds R_k_c_h=sum_i device_seconds_k_c_i*A_h_i/sum_g A_g_i; include closed stationary intervals and require positive known area totals. This map cannot be retrospectively changed to erase failures. Rack/display/lighting/building idle/fixed sources use measured occupied/reserved floor-area-hours. Router/CCTV/admin sources use reserved supported workstation-hours. Dedicated direct sources retain measured attribution. Never add unlike driver dimensions; reconcile all beneficiaries back to every original X_k_c. Positive source with zero/unknown required driver total blocks completion."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_allocation
    applies_to: "capital"
    rule: "For each physical homogeneous asset j, f_j_h=e_j_h/L_j in the SAME exposure unit across all past/future beneficiaries. Building/rack/luminaire/fan use occupied/reserved floor-area-hours. Checkout/printer/payment use full lifecycle device-seconds: e_j_h=busy_device_s_j_h+reserved_idle_device_s_j_h over disjoint busy versus idle/closed intervals; busy seconds use actual per-beneficiary processing shares, idle/closed seconds use the prospective A_h_i area map in pool_allocation. Include zero-transaction reserved time; never sum overlapping fixed and active exposure. Router/CCTV/admin computer use reserved supported workstation-hours. Trolley uses rated payload-capacity-hours in kg*h: for each measured job i assign its actual rated C_j_kg*duration_i_h by each beneficiary actual loaded gross kg share; the same job reservation follows its empty return. Idle/closed capacity C_j_kg*idle_duration_i_h uses the prospective A_h_i shares. Require actual trolley rating, weighed complete loads and all interval reservations; no floor-area-hour proxy for its handling exposure. L_j is expected total lifetime exposure in the corresponding same unit. Keep sum f<=1 and unassigned exposure explicit. Lifetime/BOM/provider revision replaces EVERY historical numerator by f_new_j_h*V_new_j-f_old_j_h*V_old_j. At actual retirement E_j=sum_all_h e_actual_j_h and f_final_j_h=e_actual_j_h/E_j; replace all historical allocations. Residual1-sum_old_f is QA only. Manufacture never restarts; terminal carrier and asset-owned independent transport follow the same f once."
    source_ids:
      - ghg-product-2011
  - rule_id: return_replacement
    applies_to: "all"
    rule: "Late returns/revocations replace the ORIGINAL pool Q, all original operational/capital/transport numerators and S/F/T/O ownership versions, using actual event dates. Retract the old normalized version before installing the corrected one. Goods returning and resold keep one original supply vector. Retain zero-output pools as unnormalizable raw inventories and carry them in the prospectively fixed same-configuration reporting pool; entirely zero-output pools cannot publish a normalized1-service inventory. No economic credit or allocation by selling price."
    source_ids:
      - ghg-product-2011
  - rule_id: completion_allocation
    applies_to: "all"
    rule: "calc_completion is mandatory: restore every external normalized module to its evidenced raw original denominator/pool/version; compare actual constituent/event/time/asset/lifecycle stage and source-ID to remove only proven overlaps. Add compatible identical exchange/property/unit raw core numerators (including failed_original whole source plus separately completed component cards and AC) and disjoint external raw numerators row by row, then divide common Q once. Never add kg to MJ, raw to normalized quantities, S merchandise background to this service, or F twice. Until every necessary actual module has atomic bilingual cards, protocols, identity/provider evidence and compatible raw reconstruction, disclose partial incremental inventory and reject complete-retail-service use."
    source_ids:
      - ghg-product-2011
  - rule_id: split_attribution
    applies_to: "floor_cleaning; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_support_electricity; split_support_travel"
    rule: "Prefer exclusive direct measurements. For shared cleaning events attribute each raw physical quantity by actual cleaned area-events across all beneficiaries; for maintenance use the repaired asset physical driver over all beneficiaries of the actual supported work-order cycle. Retain idle, failed, closed and zero-driver loads and their original carryover rules, never discard them using sales. New tool manufacture/retirement uses persistent lifetime ledgers and historical revision deltas; installed replacement parts are charged once to their actual maintenance event, not again as an original whole-asset acquisition. Do not reapply a share to an already-attributed source or charge terminal tools only to the retirement period. Remove any contained quantity from its old background or replace the entire package with this split; never characterize both."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "trade"
      flow_role: "failed_original; service"
      record_type: "Original goods and acceptance ledger"
      raw_fields: "original_id; SKU; lot; seal/state; nominal_spec; actual_length_m; actual_width_m; measured_gross_kg; facing_adhesive_liner_core_wrap_kg; supplier_BOM; q_s; V_s; source_id; source_version; receiving_gate; inbound_vector; q_c_s; V_c_s; f_F_s; f_F_c_s; source_component_id; source_fraction_S_F_T_O; S_F_T_O_owner; N_F_whole; gross_handover_id; return_id; valid_acceptance; revocation_date; pool_id; Q; U_whole; B_F_whole; component_native_unit; N_F_c_s; B_F_c_s"
      collection_method: "Barcode and original-ID scan at receiving/every movement; supplier lot-specific measured BOM and background boundary; calibrated scale/length instrument checks on received lots without counting destructively opened QA samples as sealed output; signed counter acceptance and dated replacement versions. service_gate; goods_responsibility; component_gate; calc_goods; one final Q"
      unit: "Item(s); kg; m"
      frequency: "Every event; stock close each period"
      temporal_coverage: "Complete prospective reporting period and historical corrections"
      site_scope: "Actual store; one homogeneous SKU/BOM pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier signed full component vector; calibrated instrument IDs; duplicate-free event trace and S/F/T/O conservation"
    - protocol_id: cp_custody
