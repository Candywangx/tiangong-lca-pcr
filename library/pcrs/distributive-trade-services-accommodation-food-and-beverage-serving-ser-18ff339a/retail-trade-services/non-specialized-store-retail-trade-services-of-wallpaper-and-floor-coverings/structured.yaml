system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "all"
      rule: "Apply only the sealed single-roll route in section1. Any opened/part-used customer return is a distinct actual state, never a qualifying sealed sale. Quarantine it by original ID, measured whole-carrier kg, remaining face/liner/core/wrap quantities and recipient; complete its state-specific card/provider before dataset completeness. A full original package remains one exchange while all of its components share the same final source responsibility."
      source_ids:
        - un-cpc62163
        - tempaper-moire
    - rule_id: service_gate
      applies_to: "service"
      rule: "Q is the count of distinct original roll IDs with final valid acceptance in the prospective same-store/SKU/configuration pool. Customer retention without qualified acceptance, refusal, repeat attempts, refund alone, internal transfer and lost stock are not extra service. Revocation removes the original ID from Q even without movement; a financial adjustment with valid acceptance leaves Q unchanged. Count each final-valid ID once; do not subtract revocations again. A later resale of the same roll corrects that original history, not another manufactured roll."
      source_ids:
        - ghg-product-2011
    - rule_id: goods_responsibility
      applies_to: "failed_original; service"
      rule: "At the same store receiving gate retain each original supplier vector V_s including complete facing/adhesive/liner/core/original wrap and upstream transport, with received quantity q_s in its native unit. Partition original responsibility S/F/T/O, sum fractions1 per original source: S final-valid customer goods; F irreversible retail failure including confirmed loss or retained external unaccepted goods; T named continuing supplier/internal custodian; O open stock. The incremental retail service excludes S production/inbound vector. failed_original includes F once; T/O carry the unassigned same source to their named future owner, never a zero or deleted burden. A downstream GOODS system may add S once separately. Receiving all goods is raw custody QA, not a second purchase input beside F."
      source_ids:
        - ghg-product-2011
    - rule_id: component_gate
      applies_to: "failed_original"
      rule: "A normal complete original roll remains one product. U_whole contains only original sources whose complete facing/adhesive/liner/core/wrap share one final S/F/T/O responsibility. If an opened pack has divergent component owners, remove its affected original source entirely from U_whole and failed_original, obtain supplier original component quantities/native units and component inventory vectors, and create each real component/state input card. That component card owns N_F_c_s=q_c_s*f_F_c_s in its own native unit and B_F_c_s=N_F_c_s*V_c_s; its amount N_F_c_s/Q links only B_F_c_s/Q, never a whole-roll identity. Original vectors and S/F/T/O must reconcile across all components; mass/count fractions cannot split an environmental vector. Without complete supplier vectors, concrete cards, protocols and bilingual sync the component mode is blocked."
      source_ids:
        - ghg-product-2011
    - rule_id: custody_gate
      applies_to: "supplier_return; external_damaged; roll_waste"
      rule: "Use goods-only stock: opening+receipts+all physical customer returns+internal receipts = closing goods+all gross customer handovers+physical supplier handoffs+internal exits+condemnation+confirmed missing+signed unresolved residual. Every physical event ID appears in one term; gross handovers already include never-accepted events. Revocation without movement only reclassifies an existing event. Condemnation moves goods internally to held-waste stock; waste dispatch removes held waste later, not goods twice. Reconcile held waste separately. Background T is not a physical transfer. supplier_return and external_damaged are named non-characterized physical custody satellites only; never exclude failed_original with them. External retained damage names recipient/state and its F or continuing T source, not automatic retailer waste."
      source_ids:
        - ghg-product-2011
    - rule_id: support_gate
      applies_to: "trade; custody; residual; capital; support"
      rule: "Cover all actual necessary premises, rack/trolley, lighting/fan, checkout/printer/payment, router/CCTV/admin computer, cleaning and off-site network/payment/admin service using the named cards and source ledger. Every complete lifecycle product package needs actual homogeneous model/BOM, installation, repair and terminal treatment inventories plus signed provider scope. It excludes operational electricity and other listed assets; actual included independent asset transport is removed from the separate transport module. Unknown model, boundary, quantity or package content blocks completion; no package may stand for unrelated summed repair masses. Additional actual model/formulation/waste state needs its own atomic card, protocol and aligned bilingual sync before completeness."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - rule_id: power_gate
      applies_to: "electricity"
      rule: "Use at-point-of-use AC/MJ with actual provider voltage/geography/year/mix/loss gate. Sum direct disjoint meters and attributed shared source pools only. A submeter is subtracted only from a parent meter demonstrably containing it, once; an independent disjoint meter is never subtracted. Exclude contractor electricity only where the cleaning/provider package demonstrably includes the same measured activity; retain zero-sale/idle/closed consumption. No fuel/heat/refrigerant default is inferred from this identity."
      source_ids:
        - ghg-product-2011
    - rule_id: consumables_gate
      applies_to: "receipt_paper; carry_bag; paper_waste; film_waste"
      rule: "Record actual coated receipt-paper net kg excluding core and separate wrapping; coating remains paper. Fix one actual thermal-paper grade and one actual LDPE carry-bag configuration per pool. First use or irreversible unused condemnation/confirmed loss owns manufacturing and upstream transport once; never-used opening/purchased/closing/transfer/return stock carries its unassigned source. Already-used paper/WIP and reused bags carry original source-ID/version responsibility, not repeated manufacture or inbound. Supplier shipping cartons/film removed from S rolls during retail become separate source components only with supplier inventory vectors, or remain within an accepted complete mixed carrier whose treatment covers them. Do not charge full F pack and its source components again."
      source_ids:
        - ghg-product-2011
    - rule_id: carrier_gate
      applies_to: "roll_waste; paper_waste; film_waste"
      rule: "Waste cards are directly weighed consignment net kg at actual external dispatch, with distinct source/held-stock/event IDs. Do not adjust dispatch again by opening/closing stock. roll_waste is a whole condemned original vinyl-wallpaper roll carrier containing its actual remaining adhesive/liner/core/wrap; signed receiver acceptance must name actual constituents/state and compatible complete treatment. A photo/license alone is insufficient. Separately removed paper or film is disjoint; no constituent subtraction from direct whole-carrier net weighing. No default hazardous class, recycling credit, treatment yield or emission factor. Unknown waste, stock residual or provider coverage remains unresolved, never zero. Original-seal storage does not prove zero merchandise emissions: retain supplier packaging/barrier and site incident evidence; any actual escape/capture needs its specific species/state/path atomic card and original source responsibility before completeness, without nominal ventilation/VOC factors."
      source_ids:
        - ghg-product-2011
    - rule_id: transport_gate
      applies_to: "trade; custody; residual; capital; support"
      rule: "Counter handover excludes customer travel/home delivery/installation; original-goods inbound stays in its S/F/T/O receiving vector. Independent asset/repair/retirement transport belongs to its asset source then all historical fractions/version replacements. This PCR fixes capacity_unit=kg for allocation of unallocated shared trips ONLY when the actual contract, rated payload and dispatch loading evidence show mass-reserved payload capacity is the binding resource; use measured reserved gross payload kg including actual packaging. Volume-, pallet-position- or floor-space-constrained trips cannot substitute kg or choose another unit: complete a supported route extension with its own fixed capacity rule and atomic cards first. Already provider-attributed consignment quantities retain their actual native unit and allocation, with segment data only QA, not a new capacity fraction. Empty and stationary-idle reservations follow calc_transport. Additional replenishment/return/waste transport outside provider packages needs its actual atomic transport card before completeness. Compare constituent/event/time/asset/stage to exclude overlaps; different provider IDs alone prove nothing."
      source_ids:
        - ghg-product-2011
    - rule_id: split_exchange_identity
      applies_to: "all inventory rows"
      rule: "Each card has exactly one concrete exchange identity and one reference measurement property/unit; a unit group is not a second property, and auxiliary measurements are conversion evidence only. Labour cards no longer carry bundled materials/energy/equipment/wastes. Retained complete homogeneous assets, original packaged goods and real mixed waste carriers require matching actual whole-scope background/receiver treatment and full composition; heterogeneous collections or selectors are prohibited. An original exchange enters one core card or one split source only; reverse all old package characterization when replacing it and combine only disjoint raw quantities with identical identity/property/unit. Every other actual substance, part, fuel, refrigerant, emission and treatment gap requires a named bilingual card and process protocol; unknown is never zero or complete."
      source_ids: []
