      raw_fields: "asset_j; model; serial; actual_BOM; package_scope; N_j; V_old_j; V_new_j; old_version; new_version; installation; repair_event_id; terminal_carrier_kg; removed_parts; independent_transport; provider_inclusions; beneficiary_h; e_old_j_h; e_new_j_h; L_old_j; L_new_j; f_old_j_h; f_new_j_h; actual_retirement; E_j; prior_pool_Q; delta_j_h; e_actual_j_h; capacity_unit; trip_t; segment_s; X_t_s; moving_source; idle_source; reserved_capacity; segment_km; idle_hours; d_t_s_h; provider_original_allocation; transport_event_id; F_building; F_rack; F_trolley; F_luminaire; F_fan; F_checkout; F_printer; F_payment_terminal; F_router; F_camera; F_admin_computer; busy_device_s_j_h; reserved_idle_device_s_j_h; A_h_i; A_g_i; prospective_area_map_id; trolley_capacity_kg; trolley_job_gross_kg_h; trolley_job_duration_h; trolley_empty_return_reservation; trolley_idle_duration_h; capacity_unit_kg; mass_constraint_evidence; reserved_gross_payload_kg_t_s_h; segment_km_t_s; idle_hours_t_s; originating_job_reservation"
      collection_method: "Inventory each physical asset/model and signed complete provider lifecycle vector; measured floor/workstation reservation, disjoint busy and idle/closed device-seconds, actual trolley payload rating, per-job gross load and reserved duration assigned by asset_allocation; measured terminal whole net kg or verified BOM reconstruction exclusively. Inspect replacements/repairs and all historical beneficiary exposures; never reuse a nominal lifespan default. calc_assets; final e/E replaces all e/L versions; transport follows same fractions once"
      unit: "Item(s); kg; m2*h; device*s; workstation*h; kg*h"
      frequency: "Every acquisition/repair/revision/retirement; every beneficiary-period"
      temporal_coverage: "Complete prospective reporting period and historical corrections"
      site_scope: "All actual historical/future asset beneficiaries and original sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed BOM/scope, complete lifecycle inventories, calibration, prior allocation register and full historical correction receipts"
    - protocol_id: cp_support
      process_id: "support"
      flow_role: "network_service; payment_service; admin_service"
      record_type: "Contract-defined bounded support service"
      raw_fields: "contract_id; provider; boundary; actual_model_inventory; constituents; source_id; original_denominator; pool_version; accepted_clean_area_each_pass; A_clean; X_k_c; d_k_c_h; all_beneficiaries; included_energy; included_capital; included_waste_treatment; exclusions; overlap_event; route_absence; processing_s; reserved_terminal_h; supported_workstation_h; reserved_connection_h; admin_task_h; A_h_i; A_g_i; prospective_area_map_id; H_connection_p; R_port_p_h; R_port_p_g; processing_s_a_h; processing_s_a_g; b_a_h; task_active_h_t; task_seconds_t_h; task_seconds_t_g; admin_reserved_idle_h; reserved_workstation_s_h; reserved_workstation_s_g; reserved_terminal_s_h; already_attributed_quantity_h; already_attributed_vector_h; H_network_h; N_payment_h; H_admin_h"
      collection_method: "Signed actual accepted dry-cleaning pass geometry; network reserved connection hours; distinct actual processing-attempt IDs including failed/reversed requests; actual admin task hours. Obtain provider original source totals and active/idle/fixed split, complete upstream/capital/waste scope and device/utility exclusions; contract price never substitutes quantity. calc_support and calc_completion; no duplicated store energy/capital"
      unit: "m2; h; Item(s); s; port*s; terminal*s; workstation*s"
      frequency: "Every pass/task/period, including idle and failed work"
      temporal_coverage: "Complete prospective reporting period and historical corrections"
      site_scope: "Actual store and declared external provider control volume"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed service acceptance; original inventories/denominators; full beneficiary driver ledger; scope and overlap proof"
    - protocol_id: cp_split_labour_support
      process_id: "support"
      flow_role: "floor_cleaning"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
