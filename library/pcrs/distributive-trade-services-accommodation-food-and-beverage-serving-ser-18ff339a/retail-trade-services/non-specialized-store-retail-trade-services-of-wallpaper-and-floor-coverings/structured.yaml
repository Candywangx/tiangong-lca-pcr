      collection_method: "Scan each physical handoff; signed receiving evidence; scale-weigh actual remaining whole carrier; reconcile goods-only and held-waste ledgers independently. No movement is invented for acceptance revocation. custody_gate; raw stock balance is independent from corrected Q"
