allocation_rules:
  - rule_id: prospective_pool
    applies_to: "retail; failures"
    rule: "Before observations fix a same-SKU/configuration/site/route pool and event cutoff. Include idle/closed periods, refused orders, repeated attempts, reversed acceptance and every failed or zero-sale subcohort. Attribute raw numerators before dividing once by final Q. Link late return/acceptance changes to original IDs and replace the original numerator, Q and fates together with version history; never shift them to a new successful cohort. Q=0 is explicitly unnormalizable with all raw amounts retained."
    source_ids:
      - retail-foreground-protocol
  - rule_id: power_allocation
    applies_to: "retail_power"
    rule: "Use disjoint direct meters first. For a shared source separate measured active, idle and fixed lighting/fan numerator pools E_c in kWh, reconciling sum E_c to the parent after only included submeter deductions. Allocate each pool across every actual beneficiary b using a single causal same-unit positive driver d_bc: task-active seconds for active POS, reserved terminal-hours including idle for terminal idle, illuminated floor-area-hours for lighting, served floor-area-hours for a fan. No mixed driver sum; no numeric zero driver for a period with energy. Use electricity_calc. Keep all failed events as beneficiaries in the original pool."
    source_ids:
      - ghg-product-2011
      - retail-foreground-protocol
  - rule_id: physical_transfer_allocation
    applies_to: "supplier_handoff_package; external_retained_package"
    rule: "These cards preserve actual physical product custody outputs only; they are not co-products or additional functions for allocation. Do not allocate retail numerators away from Q to these transfers or treat product outputs as negative background demand. Keep source responsibility S/F/O/T, actual terminal treatment and physical transfer quantities separate; the final source owner carries the original burden once without substitution or recycling credits."
    source_ids:
      - retail-foreground-protocol
  - rule_id: asset_responsibility
    applies_to: "completion_modules"
    rule: "For each separately evidenced complete building, rack, POS terminal, lighting fixture, fan and handling trolley, choose direct subdivision or one causal beneficiary exposure e_jb in its declared unit and expected total lifetime exposure L_j in that SAME unit. Allocate manufacturing/installation vector V_j by e_jb/L_j; building/rack uses reserved m2*h, POS and fan/fixture/trolley use actual reserved service h including idle. Record all beneficiaries and historical versions, ensure cumulative fractions <=1, replace every previous allocation when L_j changes, and at actual retirement set final L_j=sum all lifetime exposures and correct all prior allocations. Separate event maintenance and actual terminal waste; no full asset purchase again beside exposure. Whole retired mass is direct net weighing OR exact component reconstruction, exclusive modes. Apply its final responsibility fraction once, never again a manufacture fraction."
    source_ids:
      - ghg-product-2011
      - retail-foreground-protocol
