    - id: q_vectors
      applies_to: "failed_original_package"
      requirement: "Manufacturer brochure supports identity, not a complete manufacturing vector or package mass. Require same-gate actual complete supplier vector, conserved S/F/O/T responsibility and no later resale duplicate."
