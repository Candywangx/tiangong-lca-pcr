    - id: completion_modules
      applies_to: "retail"
      rule: "Complete-service use requires separate actual modules for (1) complete building and fixed premises; (2) rack/counter, POS, lighting fixture, fan and trolley capital, installation, event maintenance and end-of-life; (3) actual store cleaning and heating/cooling; (4) post-receipt external stock-transfer/supplier-return/failed-stock transport and waste treatment not already in V_s or terminal provider. For each module identify actual model/BOM or signed bounded provider, raw ledger source IDs, pool/version, numerator unit, its original denominator and all beneficiaries; absence requires plans and records. Capital uses asset_responsibility and lifetime_calc, never omissions beside electricity. Only an evidenced electric-resistance/ventilation-only thermal route may complete this no-fuel/no-refrigerant design: meter kWh and allocate disjoint measured source pools by same-unit served m2*h; any actual fuel or refrigerant plant makes the route incomplete pending explicit atomic extension. Cleaning applies cleaning_completion using actual formulation-specific purchased kg, added water kg, retained unused kg and mutually exclusive source-origin destinations; direct weighed whole wet-waste carrier kg is separate from formulation-origin kg. Used-to-rinsed/retained is a replacement state, never another source destination. Water import is metered without subtracting internal reuse; direct effluent is V_discharge*rho at measured temperature, without evaporation/storage correction. Cleaning material, cloth, water, cleaner, effluent and terminal carriers each need specific bilingual cards and provider boundaries before completion."
