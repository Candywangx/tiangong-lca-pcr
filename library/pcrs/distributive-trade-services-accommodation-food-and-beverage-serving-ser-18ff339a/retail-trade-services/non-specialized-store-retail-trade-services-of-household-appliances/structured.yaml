    - id: q_scope
      applies_to: "retail; failures"
      requirement: "Document actual eligible variant, seals, untouched configuration, ambient route, absence observations and every needed support module; no unknown may be coded absent."
      evidence: "Supplier BOM/label/seal photos, site plans and event logs"
    - id: q_period
      applies_to: "retail; failures"
      requirement: "Report prospective pool, event dates, cutoff, idle/failure subcohorts, Q and raw totals, late corrections and versions. Unresolved custody, O or Q=0 forbids final normalized result."
