      record_type: "original-ID acceptance and custody event ledger"
      raw_fields: "pool_id; original_id; event_id; model_variant; supplier_lot; BOM_version; seal_state; receiving_gate; source_id; event_time; physical_recipient; physical_state; H; R; U; K; L; I; G_open; G_close; W_open; D; W_close; package_kg; X_final; gross_handover_id; physical_return_id; continuing_owner; background_responsibility; final_acceptance; revocation; financial_only; cutoff"
      collection_method: "Prospectively freeze pool/route and cutoff. Scan each closed-box serial/traceable original ID on receipt, each physical handover/return, condemnation, waste dispatch and acceptance change; retain seal photos, supplier completeness warranty, signed acceptance and supplier/custodian receipt. Calibrated scale records actual whole-package kg separately. Investigate missing IDs and retained external unaccepted goods; do not infer waste. accepted_count and custody_balance; preserve gross movements and finally valid Q independently; per reference flow"
      unit: "Item(s); kg"
      frequency: "Every event and opening/closing stock"
      temporal_coverage: "Whole declared pool plus linked later corrections"
      site_scope: "Actual ambient receiving/rack/pickup footprint and all recipient states"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale, timestamped scans, signed acceptance and chain of custody"
    - protocol_id: cp_power
      process_id: "retail"
      flow_role: "retail_power"
      record_type: "meter and shared driver ledger"
      raw_fields: "pool_id; component_id; meter_id; calibration; meter_boundary; start_kWh; end_kWh; parent_kWh; included_submeter_ids; E_c; direct_kWh; beneficiary_id; d_bc; d_pc; driver_unit; active_s; reserved_terminal_h; illuminated_m2h; served_m2h; source_id; provider; voltage; geography; losses; Q"
      collection_method: "Read calibrated cumulative meters at opening/closing and source-component interval changes; map actual circuits and all beneficiaries. Direct meters or separately measured/reconciled active, idle and fixed-component numerator pools are exclusive. Log same-unit driver for every beneficiary and idle/closed/failure period; retain source and supply boundary records. Do not energize kettles to estimate retail power. electricity_calc; allocate raw kWh then convert 3.6 MJ/kWh and divide Q once; per reference flow"
      unit: "kWh; s; h; m2*h"
      frequency: "Meter intervals and each activity/reservation interval"
      temporal_coverage: "All operating and idle hours in pool"
      site_scope: "Only included circuits, no support-module duplication"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, circuit walkdown, all-beneficiary driver reconciliation and electricity invoices"
    - protocol_id: cp_background
      process_id: "failures"
      flow_role: "failed_original_package"
      record_type: "source-vector and final background-owner ledger"
      raw_fields: "pool_id; original_id; source_id; source_originals; actual_model_BOM; V_s; receiving_gate; inbound_transport_coverage; B_s_S; B_s_F; B_s_O; B_s_T; continuing_owner; physical_recipient; physical_state; replacement_version; Q"
      collection_method: "Obtain supplier primary inventory for one complete actual sealed configuration including original package and inbound transport to the declared gate, or exact manufacturing/component vectors with conserved source IDs; do not infer from main-body steel. Match each original ID and final responsibility to custody events. Supplier-return T retains named ongoing burden; failed external retention requires actual recipient/state and responsibility. Replace old source allocations on late events. original_background; source counts and vectors once; per reference flow"
      unit: "Item(s); source vector"
      frequency: "Every original source and fate change"
      temporal_coverage: "Original receipt history through final disposition"
      site_scope: "Same model, package, receiving gate and named source owners"
      aggregation_rule: "per reference flow"
