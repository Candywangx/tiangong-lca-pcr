      raw_fields: "pool_id; original_id; event_id; U; X_final; physical_recipient; physical_state; seal_state; component_completeness; gross_handover_id; physical_return_id; final_acceptance; revocation; source_id; continuing_owner; background_responsibility; Q"
      collection_method: "Read the same original cp_custody ledger and signed recipient records; verify closed complete original package at actual supplier dispatch or final unaccepted external retention. Retain actual handover ID and any return/revocation; do not remeasure or duplicate the original event. Complete source/background responsibility is linked separately without a physical credit."
