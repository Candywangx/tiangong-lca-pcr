validation_rules:
  - rule_id: check_scope
    applies_to: "retail; failures"
    rule: "Reject complete-service claims from this partial module. Confirm actual closed original package, route and required qualifiers; reconcile supported absence records and every named module. If opening, actual new consumable, test or damaged carrier exists, add specific measured atomic cards/protocols in both languages before declaring that dataset complete. No mandatory actual exchange may be dropped as an unknown zero."
    source_ids:
      - retail-foreground-protocol
  - rule_id: check_denominator
    applies_to: "pickup_service"
    rule: "Require Q>0 and distinct final-valid original IDs. Recompute all late-event replacements; do not subtract revoked IDs twice after filtering final-valid IDs. Compare physical goods-only and held-waste balances independently; service acceptance without physical return changes Q/background only, not gross stock movement."
    source_ids:
      - retail-foreground-protocol
  - rule_id: check_background
    applies_to: "failed_original_package; sealed_package_waste"
    rule: "Conserve every original source and exact complete configuration across S/F/O/T; retain final recipient/state evidence for external unaccepted goods and named owner of T. Unknown O or custody loss cannot establish a final result. Whole original-box waste may use sealed_package_waste only when actual whole closed carrier and treatment admission match; opened, dismantled, burnt or leaking carriers need distinct extensions. No double original production for later resale, supplier return or an asset transfer."
    source_ids:
      - retail-foreground-protocol
  - rule_id: check_measurement
    applies_to: "retail_power; sealed_package_waste"
    rule: "Require calibrated complete-period meters and consignment gross/tare/net records. Reconcile parent boundaries, pool allocation sums and units, source IDs, provider overlap and one normalization. The electricity UUID does not specify generation mix, voltage or losses. Nominal kettle power, two-year guarantee, packaging dimensions and recycled-content promotion are not measured store activity, lifetime, full BOM or conformity limits."
    source_ids:
      - philips-hd9350-spec
      - retail-foreground-protocol
  - rule_id: check_identity
    applies_to: "pickup_service; failed_original_package; sealed_package_waste"
    rule: "Unbound candidate rows remain specific unresolved identities. Before use as bound exchanges require independently read official original flow response plus matching integrity receipt, public state, bilingual names, product/waste type, configuration/route, property/unit and compartment match. Supplier background and treatment provider must match actual object, receiving gate and terminal carrier. A search result, catalogue similarity or service count unit does not prove identity or environmental background."
    source_ids:
      - retail-foreground-protocol
published_dataset_profile:
  dataset_role: "Partial incremental store-operation module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Comparable same-configuration sealed pickup after explicit applicability and required support completion"
  excluded_use: "Full store/full appliance life cycle or all group448 goods; uncompleted standalone results as complete retail service; safety certification"
  required_metadata: "Every required qualifier, pool/Q/source/owner ledger, event cutoff, electricity provider and module boundaries"
  required_quality_disclosure: "Partial scope, identities, unresolved supplier/BOM data, actual presence evidence, missing modules, uncertainty and unnormalizable pools"
  update_trigger: "Actual variant/package/channel change; new exchange; late acceptance/return; asset lifetime or provider-boundary revision"
data_sources:
  - id: "un-cpc62144"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 62144, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62144"
    used_for: "Classification only: non-specialized-store services for group448 goods; narrower product/service case, no full-leaf claim"
  - id: "philips-hd9350-spec"
    type: "handbook"
    reference: "Philips HD9350/90 specification, issue 2023-03-12, version 7.7.1, pp.1–3, https://www.documents.philips.com/assets/20211219/a86748c87fd3478ebc96ae03005308a5.pdf"
    used_for: "Actual appliance identity and complete-device distinction only; no operating energy, mass, lifetime or supplier full inventory inferred"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapter9 p.63, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision before allocation and physical relationship principles only; specific drivers are PCR foreground protocol choices, no complete-standard conformity claim"
  - id: "retail-foreground-protocol"
    type: "method_factor"
    reference: "PCR-defined prospective foreground measurement/reconciliation method in sections4–9; dataset-specific source records must still be collected"
    used_for: "Declared service/custody/source ownership, actual meter/scale collection and explicit partial-module completion methods; authored design, no supplied numeric observations"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:08c72f923b82b7acdbb42be075cdf559f79c3f5d64dd570b1535ba099ca959bd"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5639"
      family: "system_boundary"
      span:
        start:
          offset: 5639
          line: 55
          column: 1
        end:
          offset: 10349
          line: 76
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual intact original box at store receiving gate with complete supplier source identity |\n| starting_condition_role | declared_supply_chain_entry |\n| product_classification_scope | Narrower sealed-kettle pickup case within CPC 62144 group448 goods |\n| recursive_input_rule | No recursive retail-service input; preserve supplier production source and receiving-gate transport separately |\n| upstream_dataset_requirement | Same complete original package and gate-specific source for F, exact S vector for downstream coupling; unresolved supplier data block completeness |\n| disclosure | Partial operation module; all necessary support modules, excluded S background and downstream completion obligations disclosed |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| scope_gate | retail; failures | Require closed original boxes of one evidenced HD9350/90 market configuration. Complete original package includes the entire kettle, base, cord, filter, control and lid assemblies, all supplied accessories/instructions and every actual original packaging component. Supplier BOM/source boundary must confirm this configuration; catalogue dimensions and recycled-content claims cannot establish masses or production vectors. Never split the original source vector by arbitrary component mass or count fractions. | philips-hd9350-spec |\n| service_gate | pickup_service | Start at documented store receipt of the closed box; finish at actual physical handover plus qualified acceptance of that same original ID. Q counts distinct finally valid original IDs, with seal, correct SKU and complete supplier configuration warranted by traceable supplier records; no internal opening is presumed. Repeated handovers and resale of the same returned ID count once. Revocation removes its prior acceptance even without physical return; a financial discount/refund alone does not remove still-valid acceptance. Retention without qualified acceptance is not service. | retail-foreground-protocol |\n| custody | retail; failures | Maintain a goods-only count balance: G_open + I + R = H + U + K + L + G_close, using gross customer physical handovers H and gross physical returns R, supplier handover U, internal condemnation K and actual external custody loss L. K transfers goods into held-waste stock, not outside custody. Separately W_open + K = D + W_close for intact whole-package waste counts; dispatch D removes held waste once, not goods twice. Track measured whole-package kg separately from counts; no service denominator is a stock-balance term. Unknown discrepancy or external recipient/state blocks physical completeness. Any observed external custody-loss L event lies outside these supplier/customer state-specific cards and requires an exact recipient/state extension before completeness; retain the entire original pool and its loss burden, never delete that cohort or relabel it as a customer retention. | retail-foreground-protocol |\n| background_ownership | failed_original_package | At the identical receiving gate, assign each original supplier source once to S (final accepted goods), F (retailer-responsible irreversible failure), O (still open/held) or T (named continuing custodian/background owner), with S+F+O+T conserving each original source. Same-item returns replace prior states. The incremental service carries only F/Q of complete original manufacturing plus inbound-to-receiving transport in failed_original_package; S is excluded and downstream product systems must restore its exact source vector S/Q. O remains pending and T has named continuing responsibility including supplier return. Background reassignment creates no physical movement. No avoided-production credit on supplier returns. An unauthorized permanent demonstrator retains the SAME original source as T to the named asset; never F plus a second full new asset; such events block this no-demo route pending extension. | retail-foreground-protocol |\n| route_absence | retail | Require site plans, circuit walkdown, purchase/service logs and event observations proving no kettle energization, added packaging/printing, fuel combustion or refrigerant equipment inside this module. Customer travel/use and delivery/installation are outside the route. Actual store heating/cooling, cleaning and infrastructure do not disappear: only the explicitly partial completion_modules method may exclude them here. Unknown presence is not zero; a refrigerant/fuel route is ineligible until a fully specified extension exists, not a choice of an unspecified future fuel. | retail-foreground-protocol |\n\n"
