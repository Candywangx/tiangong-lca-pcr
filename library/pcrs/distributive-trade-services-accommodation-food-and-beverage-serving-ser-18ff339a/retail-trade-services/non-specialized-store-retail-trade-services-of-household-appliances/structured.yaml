      raw_fields: "pool_id; consignment_id; original_id; seal_state; component_completeness; gross_kg; tare_kg; calibration; D; W_open; W_close; terminal_provider; treatment_admission; provider_transport_coverage; source_id; Q"
      collection_method: "At actual waste handover weigh the full closed appliance-box carrier on a calibrated scale and deduct only actual external consignment tare, not original package. Match complete contents and intact sealed state to original IDs and terminal acceptance. Held condemnation alone is not dispatch. Opened, leaking or stripped devices cannot use this card. waste_dispatch; actual net dispatched kg/Q once; per reference flow"
