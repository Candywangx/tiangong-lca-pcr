    - id: original_background
      applies_to: "failed_original_package"
      rule: "For source s retain its complete original manufacturing+inbound-to-receiving vector V_s per one actual original package and final source-equivalent counts B_s_S; B_s_F; B_s_O; B_s_T. Their sum equals source originals. Service raw failure vector = sum_s B_s_F*V_s; downstream accepted-product vector = sum_s B_s_S*V_s/Q; T is named continuing responsibility, O is unresolved. Candidate input count = sum_s B_s_F/Q, linked separately to each actual V_s. No arbitrary kg apportionment of V_s; verified component source vectors are required for any later component separation."
