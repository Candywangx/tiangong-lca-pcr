    - id: q_measure
      applies_to: "retail_power; sealed_package_waste"
      requirement: "Preserve calibration, resolution, uncertainty and missing interval flags, all raw numerator units and actual provider/terminal scope. Do not clamp unexplained differences or substitute ratings as metering."
      evidence: "Calibration certificates, reconciled meter/scale ledgers and provider evidence"
