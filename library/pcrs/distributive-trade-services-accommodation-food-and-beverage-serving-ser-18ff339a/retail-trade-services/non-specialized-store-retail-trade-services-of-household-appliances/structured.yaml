system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "retail; failures"
      rule: "Require closed original boxes of one evidenced HD9350/90 market configuration. Complete original package includes the entire kettle, base, cord, filter, control and lid assemblies, all supplied accessories/instructions and every actual original packaging component. Supplier BOM/source boundary must confirm this configuration; catalogue dimensions and recycled-content claims cannot establish masses or production vectors. Never split the original source vector by arbitrary component mass or count fractions."
      source_ids:
        - philips-hd9350-spec
    - rule_id: service_gate
      applies_to: "pickup_service"
      rule: "Start at documented store receipt of the closed box; finish at actual physical handover plus qualified acceptance of that same original ID. Q counts distinct finally valid original IDs, with seal, correct SKU and complete supplier configuration warranted by traceable supplier records; no internal opening is presumed. Repeated handovers and resale of the same returned ID count once. Revocation removes its prior acceptance even without physical return; a financial discount/refund alone does not remove still-valid acceptance. Retention without qualified acceptance is not service."
      source_ids:
        - retail-foreground-protocol
    - rule_id: custody
      applies_to: "retail; failures"
      rule: "Maintain a goods-only count balance: G_open + I + R = H + U + K + L + G_close, using gross customer physical handovers H and gross physical returns R, supplier handover U, internal condemnation K and actual external custody loss L. K transfers goods into held-waste stock, not outside custody. Separately W_open + K = D + W_close for intact whole-package waste counts; dispatch D removes held waste once, not goods twice. Track measured whole-package kg separately from counts; no service denominator is a stock-balance term. Unknown discrepancy or external recipient/state blocks physical completeness. Any observed external custody-loss L event lies outside these supplier/customer state-specific cards and requires an exact recipient/state extension before completeness; retain the entire original pool and its loss burden, never delete that cohort or relabel it as a customer retention."
      source_ids:
        - retail-foreground-protocol
    - rule_id: background_ownership
      applies_to: "failed_original_package"
      rule: "At the identical receiving gate, assign each original supplier source once to S (final accepted goods), F (retailer-responsible irreversible failure), O (still open/held) or T (named continuing custodian/background owner), with S+F+O+T conserving each original source. Same-item returns replace prior states. The incremental service carries only F/Q of complete original manufacturing plus inbound-to-receiving transport in failed_original_package; S is excluded and downstream product systems must restore its exact source vector S/Q. O remains pending and T has named continuing responsibility including supplier return. Background reassignment creates no physical movement. No avoided-production credit on supplier returns. An unauthorized permanent demonstrator retains the SAME original source as T to the named asset; never F plus a second full new asset; such events block this no-demo route pending extension."
      source_ids:
        - retail-foreground-protocol
    - rule_id: route_absence
      applies_to: "retail"
      rule: "Require site plans, circuit walkdown, purchase/service logs and event observations proving no kettle energization, added packaging/printing, fuel combustion or refrigerant equipment inside this module. Customer travel/use and delivery/installation are outside the route. Actual store heating/cooling, cleaning and infrastructure do not disappear: only the explicitly partial completion_modules method may exclude them here. Unknown presence is not zero; a refrigerant/fuel route is ineligible until a fully specified extension exists, not a choice of an unspecified future fuel."
      source_ids:
        - retail-foreground-protocol
