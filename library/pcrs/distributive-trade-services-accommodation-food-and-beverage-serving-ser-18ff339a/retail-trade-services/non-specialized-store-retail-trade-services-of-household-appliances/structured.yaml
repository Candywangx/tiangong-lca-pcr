    - id: cleaning_completion
      applies_to: "completion_modules"
      rule: "For each actual formulation source j collect opening unused O_j, purchased I_j, supplier-return U_j, closing unused C_j and mutually exclusive final formulation-origin destinations E_j (effluent), W_j (actual wet-wipe carrier source kg by carrier_id), A_jk (each emitted species k as actual formulation-origin component kg, never inverse-concentration whole-mixture equivalent). O_j+I_j+H_open_j+Z_open_j=U_j+C_j+E_j+W_j+D_j+Z_dispatch_j+H_close_j+Z_close_j+sum_k A_jk; H_open_j/H_close_j are actual used/rinsed unresolved formulation-origin kg retained at opening/closing; Z_open_j/Z_close_j are original-source kg retained in used containers/residue stock; D_j is a separately measured actual dispatched dry-carrier source portion. Z_open_j/Z_close_j include only residues still physically held in containers; actual dispatched container residue enters Z_dispatch_j, measured as original formulation-source kg by carrier_id, never still in closing stock. W_j covers wet-wipe-origin portions only; the same residue cannot also enter E_j or W_j. The directly weighed whole dispatched container-plus-residue net kg is a separate treatment-carrier quantity including the actual container, not formulation-source kg; preserve its carrier_id, original source attribution and measured residue evidence without multiplying source fraction twice. Unknown residue/source partition blocks closure. These destinations are mutually exclusive, retain their original source IDs and exclude external water/dirt/container and external reaction atoms; used-to-rinsed/held is a replacement state, not another consumption. Actual component/element source conservation establishes A_jk once; never divide species kg by a formulation fraction and sum multiple whole-formulation equivalents. Unknown source portions block closure. Collect actual composition, concentration, species conversion, dilution-water kg and external dirt/cloth/container mass separately; absent species require formulation/process evidence, unknown blocks the module. Measure water import as V_supply*rho_supply and direct whole liquid discharge as V_discharge*rho_discharge at actual measured temperature; do not reconstruct whole effluent from a water-only balance, subtract evaporation or reuse from direct meters, or include outside cloth/container mass in source-origin kg. An internal volatile source is not an external elementary emission. For each species k separately reconcile actual source generation G_k plus measured raw inlet mass with measured external air outlet, actual external capture-carrier export, other actual exits and changes in both air and capture stocks; internal capture is not also an external export. Raw absolute inlet/outlet and already differential or blank-corrected readings are exclusive modes, removing the same background/blank once. Fix gas sampling to matched intervals i with actual delta_h_i in h and one declared mutually exclusive mode: mass-rate mode integrates each measured port species kg/h as M_port_k=sum_i rate_port_kgph_ki*delta_h_i; concentration mode integrates M_port_k=sum_i concentration_mgpm3_ki*airflow_common_m3ph_i*delta_h_i/1000000. Concentration and airflow must share the same actual or documented reference temperature, absolute pressure and wet/dry gas basis. When conversion is necessary, record kelvin T, absolute P and measured water mole fractions for both states and use airflow_common=airflow_measured*(P_measured_abs/P_common_abs)*(T_common_K/T_measured_K)*(1-water_mole_measured)/(1-water_mole_common), only with verified applicability of that gas-volume conversion; already matched volumes receive no conversion. Record calibration, port, interval, sampling coverage and conversion evidence; missing gas state or water data blocks concentration-mode conversion. Absolute inlet/outlet port integrations feed the control-volume balance separately; an already differential rate is integrated once without subtracting inlet again; an already blank-corrected rate is not blank-subtracted again. For uncorrected data integrate the matched blank kg/h over the same intervals and remove it once. Source attribution is either already source-resolved measured data or one evidenced source_fraction applied once to the corresponding integrated external species quantity; the modes are exclusive and already source-resolved/blank-corrected values receive no repeated fraction/correction. An assumed source fraction, catalogue ventilation rate or cleaner consumption cannot substitute for these raw measurements. Elementary atmosphere rows require actual external species kg, source attribution and complete control-volume evidence, not cleaner consumption or unknown zero. Investigate negative signed net observations, without zero clamp or unreviewed uptake credit. Actual external molecular species kg and formulation-origin component kg remain distinct; missing species/capture/stock/boundary data block completion. Source-origin quantities allocate manufacturing only; direct measured whole wet carrier mass determines treatment, not source composition multiplied again. For each complete reusable cloth record actual cleaned area a_b and total lifetime area L_area in m2; use f_b=a_b/L_area for its exact whole-cloth source, lifetime revisions replacing all historical beneficiaries and whole terminal kg*f_b once. No h unit for cloth area and no separate cloth acquisition beside its allocated source. Contracted laundering must specify actual cloth kg/event, provider-covered detergent/water/heat/electricity/effluent/transport stages and source IDs, excluding them from the store module; unknown provider coverage blocks completion."
      inputs:
