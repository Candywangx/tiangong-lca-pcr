      applies_to: "retail"
      requirement: "This module alone is partial. Complete background use requires completed support modules, actual row-specific identities and quantities, aligned bilingual cards and exact-source/version/denominator aggregation. Do not infer compliance with a complete GHG or electrical safety standard."
