      collection_method: "Inventory every named actual support object and operation with plans, contracts, measured raw records and all beneficiaries. Collect calibrated masses/meters, same-unit exposures, lifetime versions and actual terminal receipts for each complete asset; cleaning formulation/water/destination and container-residue dispatch by carrier_id; gas source/port interval rate or concentration/airflow records with actual temperature, absolute pressure, wet/dry basis and blank/source-attribution mode under cleaning_completion; and route mass/distance/capacity/empty/idle and provider boundaries. No actual observation is supplied by this PCR. Require missing specific atomic bilingual cards and identities before completion; absence requires source records. completion_modules; cleaning_completion; lifetime_calc; transport_completion; combine_modules; retain each raw numerator and original denominator, deduplicate exact sources and normalize once to Q; per reference flow"
