      rule: "Supplier output = U/Q using actual gross supplier dispatch count. External unaccepted output = X_final/Q, where X_final counts distinct actual externally retained original IDs with invalid final acceptance, evidenced intact sealed configuration and a named recipient, linked to the original H event and without a recorded return. A later reversal replaces that original state/output version; do not add another handover or repeat source manufacture. Keep accepted service Q, gross physical H/R/U and final X_final distinct. These physical product outputs have no automatic substitution or recycling credit; require named continued burden T or explicit retailer failure F, with exact original-source conservation."
