system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_goods
      applies_to: "loss_plant"
      rule: "Include receiving-gate production and inbound transport for B = L + F unique plants without final qualified sale, once via loss_plant. L is actual on-site loss; F is final unqualified outward custody, not automatic waste. Downstream adds sold-plant receiving-gate backgrounds only for unique plants finally sold with N; surviving F plants carry an explicit already-accounted production flag if used in another model, avoiding a second identical production claim. Supplier returns retain their production with returned stock; retailer-controlled handling and return transport remain in the service. An unresolved final fate prevents closure."
      source_ids:
        - unsd-cpc62112
        - ghg-product-standard
    - rule_id: b_closure
      applies_to: "cp_cohort"
      rule: "Close each original receipt cohort after physical fates and acceptance/return windows are resolved. Physical customer returns and financial POS reversals are separate events linked to original plant identity; neither is inferred from the other. A goodwill refund alone does not cancel a retained qualified acceptance. A cancelled unreturned or unaccepted outward plant is F, not L. Repeated return/resale events remain in the same identity history: only its final accepted retained sale contributes N, while all failed effort remains. Include every predeclared receipt-period cohort including zero-sale/all-loss cohorts. Late physical returns require correction/reopening of prior closure, never an unrelated new zero-burden receipt. When a late return reopens the original cohort, retain actual activity dates and add all subsequent transport back, care, checkout/resale and treatment to that original cohort numerator as well as correcting N/L/F/S. In each actual activity-period meter/service pool, the reopened original cohort remains an explicit beneficiary even if it has no new receipts that period. Revise the original cohort dataset with versioned adjustments, and reconcile the current-period totals; do not charge the same activities to a new receipt cohort."
      source_ids:
        - unsd-cpc62112
        - ghg-product-standard
    - rule_id: b_scope
      applies_to: "holding; sale; residual"
      rule: "Include unloading/handling, holding, watering, seasonal electric conditioning, checkout, wrapping, failed sales, floor cleaning, attributed premises/equipment lifecycle use and residual treatment. Exclude customer travel/use, cultivation, chemical treatment and other declared excluded routes. Where an excluded route occurs, this PCR is not sufficient: stop completion and select appropriate additional methodology; never silently omit it."
      source_ids:
        - unsd-cpc62112
        - ghg-product-standard
    - rule_id: b_split
      applies_to: "all inventory rows"
      rule: "Utilities supplied to the zone and physical consumables are separate exchanges. The defined premises service includes building fabric and fixed installation manufacture, maintenance and retirement only, excluding utilities, cleaning, checkout terminal and movable racks. Purchased checkout/cleaning services include only their explicitly contracted operations; subtract their included utility/material shares from other rows. Cleaning labour and physical quantities follow split_exchange_identity and cannot remain contained in checkout or premises backgrounds. Retain premises and checkout only as a genuine homogeneous use service with same-property service quantity, complete provider background and actual contract evidence; add cards for all actual uncovered resources."
      source_ids:
        - unsd-cpc62112
        - ghg-product-standard
    - rule_id: b_waste
      applies_to: "residual"
      rule: "Track the complete discarded plant/substrate/original-pot stream once when these remain physically combined. If separated, replace that stream by measured individual streams and preserve a mass reconciliation. Send wastewater and solid streams to actual recipient treatment datasets once; do not add the carrier and its included constituents twice. No default biogenic uptake, respiration credit, avoided disposal or recycling credit is allowed."
      source_ids:
        - ghg-product-standard
    - rule_id: split_exchange_identity
      applies_to: "all inventory rows"
      rule: "Each card has exactly one concrete exchange identity and one reference measurement property/unit; a unit group is not a second property, and auxiliary measurements are conversion evidence only. Labour cards no longer carry bundled materials/energy/equipment/wastes. Retained complete homogeneous assets, original packaged goods and real mixed waste carriers require matching actual whole-scope background/receiver treatment and full composition; heterogeneous collections or selectors are prohibited. An original exchange enters one core card or one split source only; reverse all old package characterization when replacing it and combine only disjoint raw quantities with identical identity/property/unit. Every other actual substance, part, fuel, refrigerant, emission and treatment gap requires a named bilingual card and process protocol; unknown is never zero or complete."
      source_ids: []
