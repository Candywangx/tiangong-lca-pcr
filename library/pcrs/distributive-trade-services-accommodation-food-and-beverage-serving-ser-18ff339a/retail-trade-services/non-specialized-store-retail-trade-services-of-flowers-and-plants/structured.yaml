allocation_rules:
  - rule_id: a_direct
    applies_to: "all inventory rows"
    rule: "First subdivide/submeter the SKU holding zone and checkout operation. Assign measured SKU-specific water, wrapping and loss directly. Retain burdens of spoiled stock and failed sales in the SKU cohort; do not allocate them to an imaginary saleable coproduct."
    source_ids:
      - ghg-product-standard
  - rule_id: a_shared
    applies_to: "electricity; premises; rack; checkout; cleaning"
    rule: "Subdivide/submeter first. For residual holding/premises/rack pools use actual occupied area-hours of every beneficiary in that same pool and period, so d_all is the sum of actual all-beneficiary drivers, not full-floor theoretical capacity. Retain idle, closed-store and empty-display burdens in the pool and allocate to the period beneficiaries by these shares. Checkout pools use all beneficiary transaction seconds including failed and reversal operations; cleaning uses actual beneficiary cleaned area-events. For a zero-driver interval, carry its unavoidable availability/standby burden into the same asset/zone documented operating-cycle pool and allocate over that complete cycle, including off-season and zero-sale cohorts. Predeclare cycle dates, retain every interval and reconcile all allocated shares to the complete measured pool. If the full cycle still has no beneficiary driver, or recorded drivers are not causally representative, do not invent a denominator or discard load: report the pool unresolved and block complete dataset status. This common-pool attribution does not multiply the complete rack/can manufacturing or retirement quantities: those use exactly one lifetime share under a_asset_ledger. The asset protocol aggregation and card equations describe that same single attribution, not a second multiplication."
    source_ids:
      - ghg-product-standard
  - rule_id: a_assets
    applies_to: "rack; watering_can; premises; checkout"
    rule: "For complete steel rack and HDPE can inputs use manufacturing-gate measured complete-asset mass only, with their documented actual lifetime beneficiary shares. Do not include repair mass or retirement in that manufacturing input/background. Whole-asset retirement is a distinct measured waste output attributed with the same lifetime shares. Missing asset mass/lifetime/service quantities prevent completion; no invented defaults. Premises and checkout service lifecycle boundaries remain explicit and must not include these movable assets."
    source_ids:
      - ghg-product-standard
  - rule_id: a_maintenance
    applies_to: "rack; watering_can; rack_retirement; can_retirement"
    rule: "Each actual repair is a separately dated event with actual replacement component/material, work, energy and removed-part waste identities, quantities and supplier gate. Before completing an affected dataset, add each concrete exchange independently and exclude amounts already inside a complete purchased repair service. Attribute that event once to all beneficiaries in the documented maintenance accounting cycle using the repaired asset driver and the idle/zero-driver rule; do not spread it over the original asset entire lifetime or merge it into complete-asset mass. Multiple repairs remain multiple traceable events."
    source_ids:
      - ghg-product-standard
  - rule_id: a_asset_ledger
    applies_to: "rack; watering_can; rack_retirement; can_retirement"
    rule: "Maintain one persistent ledger per physical asset id across all periods and all beneficiaries, including reopened cohorts. For rack use lifetime occupied area-hours; for can use lifetime delivered watering volume. Each cohort receives one fraction f_asset,cohort of complete manufacturing mass and one corresponding fraction of actual whole-asset retirement. Posting is by delta against previously posted quantities: never restart full manufacturing/retirement burden when period or service-life estimate changes. Cumulative fractions across all beneficiaries must remain within 0..1; a final retired asset reconciles to1. Keep numerator, lifetime denominator, prior/new lifetime version, cumulative posted fraction, correction delta and recipient cohort. A revised lifetime triggers explicit reversal/reposting of affected prior cohorts, with conserved full asset mass. Replacement uses a new physical asset id; retirement subtracts parts already removed and retains actual transport/treatment. Unknown future/lifetime support remains unresolved, not a fresh allocation baseline. The cp_assets aggregation and rack/can card formulas are views of this one ledger calculation; do not apply c_shared again."
    source_ids:
      - ghg-product-standard
  - rule_id: split_attribution
    applies_to: "cleaning; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
    rule: "Prefer exclusive direct measurements. For shared cleaning events attribute each raw physical quantity by actual cleaned area-events across all beneficiaries; for maintenance use the repaired asset physical driver over all beneficiaries of the actual supported work-order cycle. Retain idle, failed, closed and zero-driver loads and their original carryover rules, never discard them using sales. New tool manufacture/retirement uses persistent lifetime ledgers and historical revision deltas; installed replacement parts are charged once to their actual maintenance event, not again as an original whole-asset acquisition. Do not reapply a share to an already-attributed source or charge terminal tools only to the retirement period. Remove any contained quantity from its old background or replace the entire package with this split; never characterize both."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cohort
      process_id: "holding"
      flow_role: "loss_plant"
      record_type: "Cohort ledger"
      raw_fields: "original plant/lot id; receipt gate/cohort; SKU/species/pot; physical receipt/return/outward timestamps; gross physical handovers; POS sale/reversal/refund event ids and amounts; accepted final retained sale N; on-site irreversible loss L; unqualified final external fate F; supplier return S; stock/transfer counts; final receiver/fate; production-accounted flag; return-window dates; reopened original cohort; late-return actual activity dates; care/transport/resale/treatment adjustment ids; original and revised dataset version"
      collection_method: "Trace the same original plant through every physical and financial event separately; match proof of custody, contractual acceptance, POS/refund and fate evidence. A refund is not evidence of physical return or death. Obtain receiving-gate backgrounds for L and F and record whether a recipient background has already been charged."
      unit: "Item(s)"
      frequency: "Each event and cohort closure"
      temporal_coverage: "Receipt through final fate and return-window closure; representative full operating seasons"
      site_scope: "One SKU, actual store gate and its retained cohorts"
      aggregation_rule: "per reference flow"
      quality_evidence: "Stocktakes, POS receipts, refunds, loss photos, supplier gates and delivered-plant background Shared underlying record family: cp_cohort. This process-scoped view is not an additional physical quantity or burden."
    - protocol_id: cp_cohort_sale
      process_id: "sale"
