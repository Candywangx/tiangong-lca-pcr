      raw_fields: "original plant/lot id; receipt gate/cohort; SKU/species/pot; physical receipt/return/outward timestamps; gross physical handovers; POS sale/reversal/refund event ids and amounts; accepted final retained sale N; on-site irreversible loss L; unqualified final external fate F; supplier return S; stock/transfer counts; final receiver/fate; production-accounted flag; return-window dates; reopened original cohort; late-return actual activity dates; care/transport/resale/treatment adjustment ids; original and revised dataset version"
