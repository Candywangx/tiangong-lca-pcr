  calculation_rules:
    - id: c_can
      applies_to: "watering_can"
      rule: "K_kg = measured complete-can manufacturing-gate mass * cohort watering volume / documented lifetime watering volume. Repairs and retirement remain independent actual exchanges under a_maintenance and cp_assets."
      inputs:
        - cp_assets
        - cp_water
      output: "K_kg"
      source_ids:
        - ghg-product-standard
    - id: c_normalize
      applies_to: "all inventory rows except retail_service"
      rule: "q_i = Q_i / N; Q_i is the final attributed cohort total in its row unit, N is qualified services from cp_cohort. Do not divide an already normalized background factor by N again."
      inputs:
        - Q_i
        - N
        - cp_cohort
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_energy
      applies_to: "electricity"
      rule: "Q_electricity = 3.6 * E_kWh; meter total equals direct plus all allocated users plus documented residual; residual is investigated, not erased."
      inputs:
        - E_kWh
        - cp_energy
      output: "Q_electricity"
      source_ids:
        - ghg-product-standard
    - id: c_losses
      applies_to: "loss_plant; retail_service"
      rule: "B = L + F; Q_loss_plant = B; Q_retail_service = N; q_retail_service = 1 Item(s). N, L, F and S are mutually exclusive final states of unique original receipt identities under cp_cohort; no POS-only subtraction creates N or L."
      inputs:
        - B
        - L
        - F
        - N
        - S
        - cp_cohort
      output: "q_loss_plant; retail_service"
      source_ids:
        - ghg-product-standard
    - id: c_shared
      applies_to: "premises; checkout; cleaning; electricity"
      rule: "Q_i = Q_direct_i + Q_complete_pool_i * d_SKU / sum(d_all_actual_beneficiaries). Include idle/off-season loads in the complete same-cycle pool under a_shared. Zero-driver intervals carry to that documented complete cycle; if its full denominator remains zero, status is unresolved and completion fails. All beneficiary allocations must sum to the full measured pool; then divide by N only once."
      inputs:
        - Q_direct_i
        - Q_pool_i
        - d_SKU
        - d_all
        - cp_assets
        - cp_checkout
        - cp_cleaning
      output: "Q_i"
      source_ids:
        - ghg-product-standard
    - id: c_waste
      applies_to: "drainage; dead_pot; plant_trim; waste_paper; waste_pp"
      rule: "For each actual waste stream record measurement_mode, measurement plane and disjoint event IDs. final_dispatch_direct uses actual mass/volume at the final discharge gate; remove actual external collection-vessel tare once where applicable, NEVER subtract internal reuse, evaporation or storage again. pre_diversion_reconstruction applies only to an observed pre-diversion source total, subtracting evidenced actual internal-reuse diversion and other nonexport portions once in the same control volume; do not also enter the final outlet reading. Reconstruction is eligible only when final direct measurement is absent and diversion/stock evidence is complete. Modes are exclusive per source/period. Mass streams retain whole-carrier kg; volume streams retain the matching provider unit or convert with actual same-state whole-carrier density. Reconcile discharge, water-component and supply ledgers separately; unknown is not zero. Attribute and normalize once, matching treatment basis without another included composition/route fraction."
      inputs:
        - cp_water
        - cp_residual
        - measurement_mode
        - measurement_plane
        - pre_diversion_quantity
        - reuse_diversion
        - direct_final_discharge
        - whole_carrier_density
      output: "Q_stream"
      source_ids:
        - ghg-product-standard
    - id: c_fresh_water
      applies_to: "water"
      rule: "Choose one mutually exclusive mode for the same boundary and period. external_meter: W_m3 = attributed external municipal meter imports; subtract no internal reuse. application_reconstruction: W_m3 = total recorded application volume - source-identified internal-reuse application volume + measured net fresh-water storage increase + measured fresh-water losses before application. Subtract reuse once only in this reconstruction; it is not a deduction from an external import meter. Include independently measured non-watering fresh-water uses once. Missing source/stock/spill reconciliation prevents completion rather than implying zero. Do not sum the two modes. D_m3 is independently measured actual discharge; W_m3 is not D_m3. The reconstructed or directly metered gross source total is BEFORE row ownership. Partition that total by original source/meter/event into disjoint plant-water, other non-cleaning fresh-water and cleaning-water portions, reconciling all portions to the parent. W_m3 on water is plant-water plus other non-cleaning portions ONLY; cleaning-water is represented only on split_cleaning_water in kg=its measured m3*actual supply-water density. A shared event receives one measured all-beneficiary attribution; already-attributed portions receive none again. Mixed-use unknown portions remain unresolved, never copied to both rows or deleted. Same source in m3 and kg is not disjoint."
      inputs:
        - cp_water
        - method
        - external_meter
        - application_volumes
        - internal_reuse
        - storage_change
        - spills
        - water_source_id
        - parent_meter_id
        - row_owner
        - plant_water_m3
        - other_nonclean_water_m3
        - cleaning_water_m3
        - actual_supply_density
      output: "W_m3"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_cohort
      applies_to: "loss_plant"
      rule: "Physical balance: opening+receipts+physical customer returns+transfers in = gross physical customer handovers+supplier returns+on-site losses+other physical outward transfers+transfers out+closing. POS reversals are not physical balance entries. After internal transfer elimination, a closed original-plant cohort must satisfy unique received plants = N+L+F+S, with closing=0 and each original identity in one final state. Derive N from final retained acceptance, not gross handovers minus financial reversals. B=L+F. Repeated physical return/resale does not create another original production. Late returns revise both fate counts and all subsequent actual numerator activities of the original cohort; preserve actual period and current-pool beneficiary reconciliation, without creating a duplicate new cohort. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_cohort
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_cohort_sale
      applies_to: "retail_service"
      rule: "Physical balance: opening+receipts+physical customer returns+transfers in = gross physical customer handovers+supplier returns+on-site losses+other physical outward transfers+transfers out+closing. POS reversals are not physical balance entries. After internal transfer elimination, a closed original-plant cohort must satisfy unique received plants = N+L+F+S, with closing=0 and each original identity in one final state. Derive N from final retained acceptance, not gross handovers minus financial reversals. B=L+F. Repeated physical return/resale does not create another original production. Late returns revise both fate counts and all subsequent actual numerator activities of the original cohort; preserve actual period and current-pool beneficiary reconciliation, without creating a duplicate new cohort. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_cohort_sale
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_energy
      applies_to: "electricity"
      rule: "Sum direct kWh plus shared pool times area-hour share; remove double-counted service energy; convert once Include idle and zero-driver intervals under a_shared and reconcile the complete pool, never theoretical empty-capacity shares. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_energy
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_water
      applies_to: "water"
      rule: "Determine W_m3 exclusively by c_fresh_water; external-meter totals receive no reuse subtraction. Separately sum D_m3 from actual discharge. Reconcile imports, reuse loops, storage, plant/substrate retention, evaporation, spills and discharge without equating W and D or treating unknown terms as zero. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_water
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_water_residual
      applies_to: "drainage"
      rule: "Determine W_m3 exclusively by c_fresh_water; external-meter totals receive no reuse subtraction. Separately sum D_m3 from actual discharge. Reconcile imports, reuse loops, storage, plant/substrate retention, evaporation, spills and discharge without equating W and D or treating unknown terms as zero. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_water_residual
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_assets
      applies_to: "premises; rack; watering_can"
      rule: "Premises is only the retained occupancy service in m2*a: attribute its measured area-time once using c_shared; do not apply rack/can manufacturing mass or lifetime mass fractions to premises. Rack and watering-can manufacturing mass, and their separately measured whole-asset retirement, use only the respective persistent lifetime beneficiary fraction under a_asset_ledger. Post differences against prior ledger postings; this protocol aggregation and the card formula describe one allocation, never a second multiplication. Repairs remain independent actual events in their documented maintenance cycle. Retain mass/treatment identities and all idle/zero-driver rules. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_assets
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_assets_residual
      applies_to: "rack_retirement; can_retirement"
      rule: "Premises is only the retained occupancy service in m2*a: attribute its measured area-time once using c_shared; do not apply rack/can manufacturing mass or lifetime mass fractions to premises. Rack and watering-can manufacturing mass, and their separately measured whole-asset retirement, use only the respective persistent lifetime beneficiary fraction under a_asset_ledger. Post differences against prior ledger postings; this protocol aggregation and the card formula describe one allocation, never a second multiplication. Repairs remain independent actual events in their documented maintenance cycle. Retain mass/treatment identities and all idle/zero-driver rules. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_assets_residual
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_checkout
      applies_to: "checkout"
      rule: "Sum attributable seconds including failures; divide by 3600; reconcile total users before N normalization Include idle and zero-driver intervals under a_shared and reconcile the complete pool, never theoretical empty-capacity shares. Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_checkout
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_packaging
      applies_to: "kraft_wrap; pp_sleeve; paper_tag"
      rule: "Opening+purchases-unopened returns-closing; allocate direct issue to SKU; product attachments already in plant background are not new purchases Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_packaging
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_cleaning
      applies_to: "cleaning"
      rule: "Cleaning card is purchased labour h only: attribute measured hours once per event using all-beneficiary cleaned area-events, then divide by N once. Physical exchanges are independently measured under cp_split_support and c_split_quantity; no complete cleaning package remains."
      inputs:
        - cp_cleaning
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_aggregate_cp_residual
      applies_to: "dead_pot; plant_trim; waste_paper; waste_pp; waste_tag"
      rule: "Sum each physical stream once; link treatment and transport once per consignment; material with continued sale/use is transferred stock, not automatic waste Normalize the resulting attributed quantity once per reference flow using c_normalize."
      inputs:
        - cp_residual
        - N
      output: "q_i"
      source_ids:
        - ghg-product-standard
    - id: c_split_quantity
      applies_to: "cleaning; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
      rule: "For each exact identity r in its single unit, restore normalized source q_source with its original denominator D_source as x_raw=q_source*D_source; already-raw quantities are not restored again. Apply only missing attribution once under split_attribution, deduplicate source/event/version and reverse old package and historical versions. Sum disjoint raw quantities as X_r; q_r=X_r/N, dividing by the final reference denominator once. Labour uses measured purchased h only, never old order counts/area; in-house hours are QA only. Calculate asset counts, material kg, electricity kWh, vehicle*km and waste-carrier kg separately; never add across properties or multiply already-measured physical quantities by labour hours. Unknown quantity/identity/background blocks completeness."
      inputs:
        - X_r
        - D_source
        - q_source
        - N
        - cp_split_labour_residual
        - cp_split_support
      output: "q_r"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve specific supplier/recipient/flow identity, state, property and unit before declaring a usable completed dataset. Unbound identities remain explicit; no zero or invented UUID."
      evidence: "Direct records, linked background boundaries and identity checks"
    - id: dq_conditions
      applies_to: "holding; residual"
      requirement: "Inspect all conditional operations, including pests, trimming, humidification, electric heating, watering and wrapping. Absence requires logs/inspection; presence outside the selected route blocks completion until additional methodology is applied."
      evidence: "Equipment/operation register and recorded non-occurrence"
    - id: dq_missing
      applies_to: "all inventory rows"
      requirement: "Missing meters, lifetimes, stock closure, receiver identity or background coverage are unresolved data needs, not zero. Disclose uncertainty, representativeness and correction actions; do not publish a complete footprint from unresolved material exchanges."
      evidence: "Gap register, completeness review and correction log"
validation_rules:
  - rule_id: v_reference
    applies_to: "retail_service"
    rule: "Require homogeneous declared SKU and all reference qualifiers, positive N, closed cohort balance and return-window closure; final service amount must equal 1 Item(s)."
    source_ids:
      - ghg-product-standard
  - rule_id: v_loss
    applies_to: "loss_plant"
    rule: "Reconcile unique original plants as N+L+F+S, physical movements separately from financial events, and L separately from actual waste. Require evidence of final F receiver/fate and receiving-gate background, including inbound transport; F is not automatic whole-pot waste. Check repeated returns/resales and downstream backgrounds for duplicate or omitted production."
    source_ids:
      - ghg-product-standard
  - rule_id: v_cards
    applies_to: "all inventory rows"
    rule: "Require each selected exchange to retain process, direction, type, state, unit, amount, protocol and actual conditional occurrence. Resolve actual additional materials/waste streams as individual exchanges before completing the dataset; do not hide them under a collection label."
    source_ids:
      - ghg-product-standard
  - rule_id: v_double
    applies_to: "all inventory rows"
    rule: "Check utilities inside service backgrounds, fixed versus movable assets, nursery attachments, complete-pot constituents, waste transport/treatment and normalization for double counting. No assumed carbon or recycling credits."
    source_ids:
      - ghg-product-standard
  - rule_id: v_quality
    applies_to: "all inventory rows"
    rule: "Require calibration, stock/utility reconciliation, seasonal coverage, complete allocation denominators, receiver evidence and supported background boundary. Report unknown identities, open cohorts and absent routes separately; unresolved material scope prevents a complete result."
    source_ids:
      - ghg-product-standard
  - rule_id: v_asset_ledger
    applies_to: "rack; watering_can; rack_retirement; can_retirement"
    rule: "Check persistent physical asset identity, all-period/all-beneficiary ledger, cumulative fraction<=1, final retirement closure=1, lifetime revision delta postings, replacement id and no second c_shared multiplier. Reopened-cohort activity adjustments must reconcile both old dataset versions and actual activity-period pools."
    source_ids:
      - ghg-product-standard
  - rule_id: split_completeness
    applies_to: "all inventory rows"
    rule: "Check every exact identity and single reference property, all actual work-order constituents, disjoint measurements, old-package reversal, no duplicated source/asset terminal scope, all-beneficiary historical attribution and one final normalization. Unverified sources, uncarded actual exchanges, unknown quantities or a mere claim of contract inclusion are incomplete."
    source_ids: []
published_dataset_profile:
  dataset_role: "partial retail-service foreground dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Combine with same-SKU receiving-gate background of finally sold plants and downstream customer use, while preserving the loss accounting boundary"
  excluded_use: "Standalone plant cradle-to-grave footprint, all-CPC62112 coverage, comparisons across different SKU/grade/cohorts or excluded routes, methodology approval"
  required_metadata: "species/cultivar; SKU; plant size/health grade; pot material/volume; substrate; receipt gate; store/channel; cohort/season; holding days; watering method; thermal regime; accepted handover; return window; loss-background boundary; packaging; allocation drivers"
  required_quality_disclosure: "Cohort closure, N/L/F/S/B, loss-background coupling, reference configuration, conditional route register, utilities/services overlap, allocation, uncertainties and unbound identities"
  update_trigger: "SKU/species/pot, service gate/returns policy, thermal route, watering/packaging, supplier/receiver, assets, loss fate or material data-quality change"
data_sources:
  - id: "unsd-cpc62112"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 subclass 62112 — https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62112"
    used_for: "Official broader trade-service scope; this PCR intentionally covers only potted ornamental living plants"
  - id: "isu-houseplant-care"
    type: "extension_guidance"
    reference: "Iowa State University Extension and Outreach, How to Care for Houseplants — https://yardandgarden.extension.iastate.edu/how-to/how-care-houseplants"
    used_for: "Qualitative care-process screening: water demand depends on conditions/species/season; drainage, light and temperature; no numeric dose or universal care limit adopted"
  - id: "ghg-product-standard"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapters 6–9 — https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Function/reference-flow definition, transparent partial boundary and process subdivision/allocation. The specific retail service boundary/drivers here are PCR operational choices supported by declared collection; no whole-standard conformance claim."
