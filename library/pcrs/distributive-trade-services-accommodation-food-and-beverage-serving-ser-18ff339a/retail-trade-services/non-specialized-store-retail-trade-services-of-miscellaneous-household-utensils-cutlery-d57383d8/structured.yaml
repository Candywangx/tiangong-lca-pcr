      collection_method: "Weigh actual whole carrier net at dispatch with separate measured container tare. Record intact vs fragments and actual adhered components/contaminants, packaging material, provider acceptance and source IDs. Keep generated/held waste movements separate from goods count and dispatch. Aggregation detail: waste_calc; stock equation is independent QA; direct weight and reconstruction exclusive"
      unit: "kg"
      frequency: "each generation/transfer/consignment and pool close"
      temporal_coverage: "full pool plus opening/closing held stock"
      site_scope: "named actual store waste holding and provider handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/tare tickets; photos; signed treatment boundary; carrier ledger"
    - protocol_id: cp_support
      process_id: "retail"
      flow_role: "support_completion"
      record_type: "completion module and persistent asset ledger"
      raw_fields: "module_id; source_id; source_boundary; all_beneficiary_driver; driver_unit; e_jbt; L_j; historical_versions; actual_replacement_event_id; final_carrier_kg; formulation_kg; formulation_destination_kg; source_parent_id; formulation_previous_state; imported_water_m3; effluent_mode; free_liquid_direct_net_kg; discharge_m3; effluent_density_kg_m3; density_temperature; outside_transport_container_tare_kg; whole_wet_wipe_kg; intrinsic_container_residue_carrier_kg; tool_id; tool_exposure; tool_total_lifetime; actual_component_BOM; complete_module_unit; custody_event_id; recipient_state; no_thermal_equipment_evidence; no_combustion_evidence; no_refrigerant_evidence; no_purchased_heat_cooling_evidence; electric_vehicle_evidence; transport_trip_id; transport_segment_id; transport_beneficiary_id; actual_loaded_tonnes_btl; actual_segment_km_tl; empty_vehicle_km_tl; idle_electricity_MJ_tl; payload_reserved_kg_btl; actual_reserved_h_btl; actual_payload_capacity_kg; unreserved_capacity_kg; provider_inclusions; Q; exchange_identity_r; property_r; unit_r; q_m; x_m; X_included_r; X_target_mr; accepted_source_S_r; attribution_version; source_overlap_map; completeness_status"
      collection_method: "Read actual complete cleaning/capital/electric-logistics contracts and direct measurements under support_calc. Verify site/building/logistics absence of thermal conditioning, combustion, refrigerant equipment and purchased heating/cooling. Collect actual carrier, formulation-parent, same-segment capacity-reservation and lifetime records at each event; no generic reconstruction. Retain all beneficiaries, historical versions and unknown coverage as incomplete."
      unit: "each actual exchange unit; same-unit e/L and driver per pool"
      frequency: "each interval, event, replacement, lifetime revision and final retirement"
      temporal_coverage: "all historical versions and entire future lifetime responsibility"
      site_scope: "actual store and external module providers with boundary mapping"
      aggregation_rule: "per reference flow"
      quality_evidence: "verified contracts; calibration; historical correction register; module overlap audit"
  calculation_rules:
    - id: service_calc
      applies_to: "accepted_service"
      rule: "Q = count(distinct original_plate_id with final_valid_acceptance=true at cutoff); service amount = Q/Q = 1 when Q>0. Gross custody and revocation counts are diagnostic, not subtracted again from the final-valid ID count."
      inputs:
        - original_plate_id
        - acceptance_version
        - final_valid_acceptance
        - cutoff
        - gross_handover_event_id
        - revocation_event_id
      output: "Q and one-service output"
      source_ids: []
    - id: electricity_calc
      applies_to: "electricity"
      rule: "E_MJ = 3.6*E_kWh; E_target = E_direct + sum_c(E_component_c*d_target_c/sum_b(d_bc)); normalized = E_target/Q. Component meters and direct meters are disjoint. Raw-to-attributed-to-normalized occurs once."
      inputs:
        - E_kWh
        - meter_id
        - parent_boundary
        - E_direct
        - E_component_c
        - component_interval_id
        - d_target_c
        - d_bc
        - driver_unit_c
        - Q
      output: "MJ per service"
      source_ids: []
    - id: source_calc
      applies_to: "failed_supply"
      rule: "For each verified supply source s: N_s = S_s+F_s+O_s+T_s; failed_supply = sum_s F_s/Q only within the single identical service specification. Retain separate source-resolved exchanges for different supplier packages. Actual background vector F_s*V_s/Q is coupled once at the receiving gate. Completion adds S_s*V_s/Q once; O remains carried; T follows documented recipient with no avoided-production credit. One original source follows resales, breakage and returns."
      inputs:
        - source_id
        - supply_contract_id
        - complete_BOM
        - provider_boundary
        - source_vector_V_s
        - N_s
        - S_s
        - F_s
        - O_s
        - T_s
        - owner_id
        - prior_version
        - Q
      output: "source-equivalent Item(s) per service and background-coupling ledger"
      source_ids: []
    - id: transfer_calc
      applies_to: "supplier_return; external_unaccepted"
      rule: "For each card separately, use count of actual unique physical event_id with matching original_plate_id/state/recipient, then divide by Q. A returned-and-resent plate has multiple real custody events but at most one final-valid accepted service. Later revocation with no movement adds no transfer."
      inputs:
        - event_id
        - original_plate_id
        - gross_physical_count
        - state
        - recipient_id
        - Q
      output: "Item(s) per service for each distinct transfer card"
      source_ids: []
    - id: waste_calc
      applies_to: "intact_plate_waste; plate_fragment_waste; cardboard_waste; pe_film_waste"
      rule: "For each actual carrier k and consignment v, M_kv = gross_kg_kv - measured_container_tare_kg_kv; M_target_k = sum_v M_kv*attribution_kv; amount=M_target_k/Q. Direct dispatch weighing and original component reconstruction are exclusive. A direct net carrier is not reduced again for attached components or held-stock movement. Weigh whole fragments, contaminants and adhered label within the actual provider-admitted carrier. Keep intact vs fragment carriers disjoint."
      inputs:
        - carrier_id
        - consignment_id
        - gross_kg_kv
        - measured_container_tare_kg_kv
        - attribution_kv
        - source_plate_ids
        - held_open_kg
        - generated_kg
        - received_kg
        - held_close_kg
        - other_transfer_kg
        - measurement_mode
        - Q
      output: "kg per service per carrier"
      source_ids: []
    - id: support_calc
      applies_to: "retail"
      rule: "Complete supports only under the fixed no-thermal-conditioning route: verify no combustion, refrigerant-containing equipment or purchased heating/cooling in the store, its building service and any included logistics service. Do not estimate refrigerant emissions from a circuit-loss balance. Unknown/present thermal systems make this PCR inapplicable; another reviewed method is required. Nonthermal ventilation fans remain measured electricity and complete capital, with all historical versions. Cleaning: measure every actual full formulation kg and imported water separately. Used formulation is an intermediate state; later rinsed/retained events replace it under the same source parent, never add another destination. Reconcile formulation-origin kg once among mutually exclusive final unused/returned, free-liquid, wet-wipe and intrinsic-container-residue destinations; added rinse water/dirt are not formulation origin. Keep three actual physical carrier ledgers disjoint: free cleaning effluent, whole wet wipe, whole intrinsic cleaning container plus retained residue. For free liquid choose exactly one direct method per consignment: calibrated whole net liquid kg excluding measured external reusable collection vessel tare, OR actual discharge volume m3 times measured representative whole-effluent density kg/m3 at recorded conditions. No mass-balance reconstruction, water-supply inference or duplicate V*rho is allowed. Whole wet-wipe carrier is directly weighed including wipe and adhered water/cleaner/dirt; whole intrinsic container-residue carrier includes the complete actual container/closure/label and remaining liquid. Exclude only measured outside transport-bin tare, never subtract the intrinsic wipe/container again. Formulation-origin accounting is QA of destinations, never a second physical export or another fraction on the whole carrier. Define each actual cleaning tool/wipe full BOM, acquisition source, own same-unit tool_exposure/tool_total_lifetime and complete lifetime replacement history; whole lifecycle service and separate constituent sources are exclusive. Capital includes the actual complete building/fit-out, shelves, carts, POS, lighting/fans and cleaning tools with no thermal equipment. Assign a=e_jbt/L_j to the one verified manufacturing/installation source, replace every historical beneficiary allocation on lifetime revision, use actual maintenance/replacement event vectors separately, and apply final lifetime responsibility once to the actual complete terminal carrier. Never split a source vector by component mass without independent component inventory vectors. Transport is restricted to an evidenced electric road-vehicle service with no combustion or refrigerant/thermal cargo system. For each actual loaded trip t/segment l/beneficiary b, A_btl=actual loaded tonnes_btl*actual segment_km_tl. Verify provider coverage of the actual loaded, empty return and stationary idle activities. If the provider has already attributed the consignment including those activities, use its supplied amount once; reconstruction is QA only. Otherwise use disjoint actual electric vehicle-km activities for uncovered empty movement and measured MJ for uncovered stationary idle. For each empty segment allocate its actual vehicle_km_tl by w_btl/sum_b w_btl, where w_btl=payload_reserved_kg_btl*actual_reserved_h_btl over that same segment. For each stationary-idle interval use the same ratio with actual positive idle reserved hours; allocate the measured idle MJ, not zero t*km. Record the actual payload kg capacity, all reservations/beneficiaries and unreserved capacity; allocate all source numerators without a zero-driver discard, carry an unresolved residual/zero driver as incomplete. Do not sum payload kg with hours or use catalogue capacity/mass as measured activity. Loaded, empty and idle provider boundaries must be disjoint; unknown coverage blocks completion."
      inputs:
        - module_id
        - source_id
        - source_boundary
        - all_beneficiary_driver
        - driver_unit
        - e_jbt
        - L_j
        - historical_versions
        - actual_replacement_event_id
        - final_carrier_kg
        - formulation_kg
        - formulation_destination_kg
        - source_parent_id
        - formulation_previous_state
        - imported_water_m3
        - effluent_mode
        - free_liquid_direct_net_kg
        - discharge_m3
        - effluent_density_kg_m3
        - density_temperature
        - outside_transport_container_tare_kg
        - whole_wet_wipe_kg
        - intrinsic_container_residue_carrier_kg
        - tool_id
        - tool_exposure
        - tool_total_lifetime
        - actual_component_BOM
        - complete_module_unit
        - custody_event_id
        - recipient_state
        - no_thermal_equipment_evidence
        - no_combustion_evidence
        - no_refrigerant_evidence
        - no_purchased_heat_cooling_evidence
        - electric_vehicle_evidence
        - transport_trip_id
        - transport_segment_id
        - transport_beneficiary_id
        - actual_loaded_tonnes_btl
        - actual_segment_km_tl
        - empty_vehicle_km_tl
        - idle_electricity_MJ_tl
        - payload_reserved_kg_btl
        - actual_reserved_h_btl
        - actual_payload_capacity_kg
        - unreserved_capacity_kg
        - provider_inclusions
        - Q
      output: "raw support numerators by exchange and source with partial status"
      source_ids: []
    - id: completion_calc
      applies_to: "retail"
      rule: "For every omitted module retain actual unit/BOM/provider/reference denominator q_m, normalization version, source_id and its all-beneficiary raw numerator. Reverse a normalized external exchange x_m back to its documented raw numerator X_m=x_m*q_m before compatible target attribution. For each identical exchange identity/property/unit r add only nonoverlapping target raw numerators: X_complete_r = X_included_r + sum_m X_target_mr + accepted_source_S_r. Deduplicate exact source IDs, utilities, transport, capital, packaging and treatment at boundaries; replace prior versions, never add them. Normalize once X_complete_r/Q. Never add kg to MJ or Item(s), different carrier/species or raw to normalized values. Staff/customer travel must be explicitly included with actual routes and all modes, or retain a named partial exclusion. Full-business claim requires all actual necessary modules with state-specific atomic cards, bilingual protocols and verified boundaries, not this subtotal alone."
      inputs:
        - module_id
        - source_id
        - exchange_identity_r
        - property_r
        - unit_r
        - q_m
        - x_m
        - X_included_r
        - X_target_mr
        - accepted_source_S_r
        - attribution_version
        - source_overlap_map
        - completeness_status
        - Q
      output: "completed compatible exchange values or explicitly partial subtotal"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "retail"
      requirement: "Record actual manufacturer/SKU/lot and supplied complete plate/label/coating/packaging BOM; supplier evidence must distinguish tempered opal glass from ceramics. No inferred pure silica or unspecified set. OEM page supports identity/care only, not site quantities, complete manufacturing inventory or packaging tare."
      evidence: "Receiving photos; supplier specifications; actual configuration comparison"
    - id: measure_quality
      applies_to: "retail; waste"
      requirement: "Retain calibrated meter/scale IDs, uncertainty, resolution, timestamps and tare records; verify whole period and stock closure. Unknown is not zero; investigate signed discrepancies. Every flow has raw totals, attributed numerator and one Q normalization."
      evidence: "Calibration records; consignment receipts; meter map; reconciliation"
    - id: closure_quality
      applies_to: "retail"
      requirement: "Audit all original IDs and source N=S+F+O+T versions through late events, zero-output periods and physical goods/waste separation. Terminal supplier/customer/waste recipients must accept the actual state. Reject double background, double dispatch or duplicate acceptance."
      evidence: "Versioned cohort ledger; signed recipient records; independent event checks"
    - id: completion_quality
      applies_to: "retail"
      requirement: "All missing modules retain explicit PARTIAL status and their concrete evidence gaps. For each unbound card obtain official original flow response and integrity receipt, public state, bilingual name, type/state/medium, property-unit chain and matching background/treatment boundary before binding. Absent identity is candidate-only and not usable as a complete secondary dataset."
      evidence: "Official originals; module contracts; overlap map; independent method and bilingual review"
validation_rules:
  - rule_id: scope_check
    applies_to: "retail"
    rule: "Reject applicability outside this SKU/individual-piece/material/non-conditioned store/electric nonthermal logistics route. Present or unknown thermal conditioning, combustion, refrigerant systems or purchased heating/cooling makes this fixed route ineligible, not a deferred optional fuel/species choice. Other unknown packaging, washing, receipt printing or added bag is a blocking scope gap; a separately reviewed supported extension is required before applying any changed route."
    source_ids: []
  - rule_id: quantity_check
    applies_to: "retail"
    rule: "Require Q>0 for normalization and exact final-valid original ID audit; separately reconcile gross goods custody, held-waste and source ownership. Confirm acceptance revocation without return removes service but invents no physical event."
    source_ids: []
  - rule_id: source_check
    applies_to: "failed_supply"
    rule: "Require complete source contract and N=S+F+O+T closure at one receiving gate; no source vector mass split without independent component vectors. Keep accepted S upstream responsibility for completion and O/T continuation."
    source_ids: []
  - rule_id: allocation_check
    applies_to: "electricity; waste"
    rule: "Reconcile same-unit all-beneficiary pools, direct/shared disjointness, meter nesting, consignment tare and single normalization. A zero/unknown driver or unassigned residual blocks complete attribution."
    source_ids: []
  - rule_id: completion_check
    applies_to: "retail"
    rule: "Do not claim full retail until all actual modules and accepted-source S are restored by completion_calc with source deduplication, asset full lifetime revisions, disjoint actual maintenance and terminal carriers, empty/idle transport and evidence of the fixed no-thermal/no-combustion/no-refrigerant route. Unbound identity, unknown quantity/provider coverage or omitted travel remains explicit partial/inconclusive. No default standard compliance follows from this PCR."
    source_ids: []
