      collection_method: "Scan receipts and assign durable per-piece IDs; reconcile photos, custody signatures, acceptance/return records and supplier source documents. Do not infer acceptance from payment alone. Aggregation detail: service_calc; source_calc; transfer_calc; custody and source ledgers kept distinct"
