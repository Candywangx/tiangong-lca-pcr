allocation_rules:
  - rule_id: pool
    applies_to: "retail"
    rule: "Declare one same-configuration pool before observations; include idle, closed, failed and zero-sale intervals. Entirely Q=0 pools retain all raw numerators as unnormalizable and must join the next prospectively declared compatible pool or remain disclosed without per-service values. Do not remove failure intervals or select only successful transactions. Late returns/acceptance/source revisions replace original pool Q, every affected numerator and fate version; carry a correction ledger, never charge the revised amount again to a new cohort."
    source_ids: []
  - rule_id: electricity_allocation
    applies_to: "electricity"
    rule: "Prefer disjoint direct meters. For shared parent meter split actual measured active checkout, display lighting and idle components with nonoverlapping meter/interval IDs; reconcile component MJ to parent MJ. Allocate checkout active component by seconds of actual service including failed attempts; display component by occupied shelf-area*h for all goods; idle component by reserved shelf-area*h for all beneficiaries. Each component uses its own same-unit driver, never seconds plus m2*h. If a driver total is zero/unknown, carry the complete component pool to its declared compatible period or fail attribution; no disappearance. Subtract a submeter only if it lies inside the parent; an independent meter is not subtracted."
    source_ids: []
  - rule_id: source_allocation
    applies_to: "failed_supply"
    rule: "F_s is a source-equivalent original plate count for the exact whole-supply service contract. The service provider must evidence full component source vectors, actual packaging and inbound boundary per original plate before N_s can multiply a background. Elect either the verified whole-supply package or actual component-supply vectors plus inbound transport, exclusively. If separate component source vectors are unavailable do not split the plate environmental vector by glass/label/adhesive mass. Source responsibility transfer retains the same source ID and all historical corrections; an internal display item cannot receive a second manufacturing source."
    source_ids: []
  - rule_id: support_allocation
    applies_to: "retail"
    rule: "For each excluded necessary support retain separate complete raw source pools and exact source IDs; prefer direct subdivision before causal allocation. Use area*h for each separate space/lighting/nonthermal-fan occupancy pool and measured task seconds for each cleaning/checkout activity pool, including all beneficiaries, closed/idle/failure intervals. Loaded electric road activity is actual tonnes_btl*segment_km_tl with documented source/provider attribution. For each uncovered empty segment and stationary-idle interval use the fixed same-segment payload_reserved_kg_btl*actual_reserved_h_btl weights of support_calc to distribute its complete vehicle-km or measured idle MJ numerator. Never add different driver dimensions or loaded/empty/idle activities together. A provider already-attributed consignment is used once; reconstruction is QA only. Every source pool reconciles to its measured parent; zero/unknown weights or unresolved residuals block completion."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "retail"
    rule: "Completion capital register includes actual complete building/fit-out, shelf, cart, checkout device, installed lighting/fan and nonthermal fan assemblies, full BOM/installation boundary, lifetime replacement history and final carrier. Assign each asset j/source/version once: a_jbt=e_jbt/L_j, where e and expected total lifetime L have the same unit (e.g. m2*h for building, shelf-area*h for shelf, operating h for device). Reconcile across every beneficiary and period: cumulative a<=1; at retirement replace every historical allocation using actual lifetime exposure and allocate final residual, preserving source numerator conservation. A revised L replaces previous versions rather than restarting manufacture. Separate manufacture/installation, operation, actual maintenance replacements and end-of-life; a verified whole package excludes its included components from separate charges. Final full carrier kg times final responsibility fraction once; do not multiply by manufacture fraction again."
    source_ids: []
