system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: route
      applies_to: "retail"
      rule: "Apply only to a prospectively fixed store/SKU/supplier configuration and pool interval: receiving, unheated ambient display and manual handling, staffed checkout, customer collection and actual waste handover. No store plate washing, food demonstration, repair, retailer-added packaging, paper receipts or delivery is allowed in this route. Establish presence/absence with receiving observation, POS configuration, work instructions and meter map. A changed or unknown route blocks use until named atomic cards, protocols and aligned rules are added; supplier transport packaging remains in scope. Eligibility also requires documented absence of thermal conditioning, combustion, refrigerant equipment and purchased heating/cooling in the store/building service, and evidenced electric nonthermal road logistics. Unknown or present excluded systems make this fixed PCR route inapplicable, not zero."
      source_ids: []
    - rule_id: partial
      applies_to: "retail"
      rule: "Included subtotal: stock/acceptance records, attributable point-of-use display/checkout electricity, failed-original-goods receiving-gate supply responsibility and actual specified waste handovers. It excludes building and fit-out manufacture/installation/end-of-life, shelves, carts, checkout device, lighting and fan capital, cleaning operation/tools, off-site logistics, staff/customer travel and accepted-goods production. These necessary supports are not zero. Dataset must retain PARTIAL status until completion_calc and support_calc are executed for every actual support; never market this subtotal as complete retail or complete plate life cycle."
      source_ids: []
    - rule_id: acceptance
      applies_to: "accepted_service"
      rule: "Assign a persistent original plate ID (supplier lot plus per-piece ledger ID), custody event IDs and acceptance versions. Q is the count of distinct original plate IDs with final-valid agreed acceptance at the disclosed cutoff, once per original plate, after checking intact specified SKU, no scratches/chips and recorded customer handover. Repeated checkout/resale never creates a second service for that original. Revocation removes validity even without physical return; pure refunds/discounts with valid acceptance do not. Retention without acceptance is excluded. Cutoff and late-event policy are prospective foreground choices, never a default manufacturer return period."
      source_ids:
        - ikea-oftast-30258913
    - rule_id: custody
      applies_to: "retail"
      rule: "Use goods-only stock count, not accepted Q: G_open + N_receipt + N_customer_return = G_close + H_gross + U_supplier + C_condemned + L_missing + T_internal. H_gross includes every physical customer handover including failed/repeated handovers; returned physical items enter N_customer_return. C_condemned is internal goods-to-held-waste conversion and is removed once from goods. Waste dispatch is not another goods subtraction. Link lost items and internal demonstrators to original IDs and terminal owner; a T source transfer is not an invented physical exchange."
      source_ids: []
    - rule_id: source_ownership
      applies_to: "failed_supply"
      rule: "At the same actual receiving gate identify each source s for the complete original plate, including actual glass/additives, surface treatments and attached labels/adhesives, its actual original transport packaging and inbound transport. Obtain supplier full model/BOM and exact service denominator and boundary. For each source-equivalent plate N_s preserve N_s = S_s + F_s + O_s + T_s: finally accepted S; irrecoverably failed or unaccepted externally retained responsibility F; physically/source-owned open inventory O; documented transferred responsibility T. Classify fractions by original identity/history, not arbitrary mass splitting of environmental vectors. Supplier return without documented continuing owner is unresolved, never automatic T or credit. Failed fragments inherit one original source only."
      source_ids: []
    - rule_id: waste_states
      applies_to: "waste"
      rule: "Keep intact condemned plates, fragmented plate material, corrugated-board packaging and polyethylene wrapping as distinct measured carriers. Determine actual receiving packaging composition; PE identity needs supplier/physical evidence, not visual guess. A glass carrier includes measured attached labels/coatings and contamination admitted by its named provider; never substitute pure silica. Unknown materials or a different mixed carrier require an additional concrete card before completeness. Record held waste by carrier: W_open + W_generated + W_received = W_close + W_dispatched + W_other_transfer; net consignment mass is already dispatched mass and is not corrected again by the stock balance."
      source_ids: []
    - rule_id: external_states
      applies_to: "supplier_return; external_unaccepted"
      rule: "supplier_return covers only intact same-SKU plates physically returned to the named supplier; not broken returns. external_unaccepted covers only intact same-SKU plates physically handed to a customer but retained without final-valid acceptance; the ledger records actual recipient, location, condition and ongoing background responsibility. Revocation without return changes Q/source versions but creates no new physical transfer. Broken externally retained goods, donated goods or damaged supplier returns require separate state-specific cards and responsibility before completeness; never turn them automatically into store waste."
      source_ids: []
    - rule_id: scope_presence
      applies_to: "retail"
      rule: "No numerical plate mass, loss rate, density, compliance limit or recycling credit applies by default. Manufacturer package weight is not net plate mass; consumer care is not a store operation. Verify no thermal conditioning, combustion, refrigerant-containing equipment or purchased heating/cooling across the store, building support and logistics route. Map ordinary electricity, actual nonthermal ventilation fans and complete capital. Unknown or present thermal/combustion/refrigerant systems fail eligibility; do not defer a fuel/species choice to later modellers."
      source_ids:
        - ikea-oftast-30258913
