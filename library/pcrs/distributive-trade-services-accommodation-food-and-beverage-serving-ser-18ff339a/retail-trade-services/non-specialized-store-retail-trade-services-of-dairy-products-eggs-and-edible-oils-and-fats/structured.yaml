allocation_rules:
  - rule_id: subdivide
    applies_to: "retail; cleaning"
    rule: "Use direct meters and event attribution before shared allocation. For a residual shared pool L_k, assign L_k*d_ik/sum_i(d_ik) across every actual beneficiary, including other merchandise. Use measured occupied shelf-volume-hours for storage/lighting space, observed checkout task seconds for POS, and cleaned area-event exposure for sanitation, only after documenting causal relevance. Allocate closed/idle residuals over the same declared beneficiaries, not only successful sales. Zero-driver periods retain a suspense balance and use prospectively documented capacity-time exposure across all beneficiaries; unknown drivers block completion. Reconcile the full measured parent pool; subtract a submeter only when its load is included in that parent, never from an independent disjoint meter."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_life
    applies_to: "assets"
    rule: "For asset a at ledger version v, expected total lifetime exposure E_av includes past actual and projected remaining exposure to all beneficiaries. Current beneficiary fraction f_aiv=e_aiv/E_av; e uses occupied area-hours for building, shelf-volume-hours for shelving, task seconds for POS. Trolley exposure is source_task_ID-linked loaded handling minutes plus actual empty-return/positioning minutes, with declared idle/reserved-capacity responsibility retained as attributed minutes. Assign shared empty movements through documented task responsibility and reconcile every observed minute across all beneficiaries; zero payload never erases actual movement. Use the same responsibility rules in past actual and projected remaining exposure. Acquisition quantity N_a*f_aiv is the complete asset count share. On a lifespan/exposure revision recalculate desired cumulative shares using the revised denominator and post delta=desired cumulative share minus all prior posted shares; replace old allocations, never restart manufacture. Maintain cumulative shares <=1 across periods/owners and assign measured final residual at retirement. Terminal package quantity uses its single final lifetime responsibility fraction g_ai once, not g_ai*f_ai."
    source_ids:
      - ghg-product-2011
  - rule_id: maintenance_event
    applies_to: "assets"
    rule: "Each of the four maintenance cards measures ONLY actual purchased labour h, bound to signed contract_id/work_order_ID, service_type, scope_version and actual start/end/hours; a 1 Item work-order package is no longer a quantity on any maintenance labour flow. Sum only h of the same actual labour type/scope/unit/background; heterogeneous work needs named specific cards. Parts, event utilities, travel, tools and removed-part treatment use independent actual quantities/cards/protocols; exclude them from labour background. Reverse the former full service package; complete-package and split views cannot both be characterized. Retain event IDs and its supported interval from this event to the next repair/replacement of the same function or retirement. Allocate labour h and each separate event source once across ALL beneficiaries using that interval exposure; forecast future exposure and replace it with actuals through the persistent delta ledger. Never multiply another whole-device manufacturing-lifetime fraction; tool own manufacture/terminal uses its independent lifetime ledger. Exclude acquisition-warranty and provider-contained sources. Labour h is neither order count nor material kg; already-attributed sources receive no further share."
    source_ids:
      - ghg-product-2011
  - rule_id: no_credit
    applies_to: "residual"
    rule: "The service has no assumed co-product credit. Keep actual donation, supplier return and recovery recipient/responsibility separate; sale revenue, scrap price or refund is not a physical driver by default. A real co-product requires a reviewed allocation extension and disjoint receiving background before completeness."
    source_ids:
      - ghg-product-2011
  - rule_id: split_attribution
    applies_to: "building_maintenance; shelf_maintenance; pos_maintenance; trolley_maintenance; split_building_led; split_shelf_bolt; split_pos_psu; split_trolley_wheel; split_removed_led; split_removed_bolt; split_removed_pos_psu; split_removed_trolley_wheel; split_support_electricity; split_support_travel"
    rule: "Prefer exclusive direct measurements. For shared cleaning events attribute each raw physical quantity by actual cleaned area-events across all beneficiaries; for maintenance use the repaired asset physical driver over all beneficiaries of the actual supported work-order cycle. Retain idle, failed, closed and zero-driver loads and their original carryover rules, never discard them using sales. New tool manufacture/retirement uses persistent lifetime ledgers and historical revision deltas; installed replacement parts are charged once to their actual maintenance event, not again as an original whole-asset acquisition. Do not reapply a share to an already-attributed source or charge terminal tools only to the retirement period. Remove any contained quantity from its old background or replace the entire package with this split; never characterize both."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_events
      process_id: "retail"
      flow_role: "Accepted service and gross physical movements"
      record_type: "Lot and unique bottle/event ledger"
      raw_fields: "origin_ID; bottle_ID; SKU/lot; event_ID/date; pool_ID; gross_handover; physical_return; qualification/reversal; recipient/state; gross/tare/net oil; fill_volume; density/temperature; opening/closing stock; transfer_ID"
      collection_method: "At receiving, shelf and checkout scan every event; calibrated traceable scale measures gross and matched empty bottle/cap/pourer/label tare; homogeneous lot measured sampling plan requires uncertainty/coverage and rejects unproven nominal-fill shortcuts; volume mode uses lot-specific measured/verified density at matching temperature; check current supplier label and temperature/light/moisture logs Aggregation detail: calc_oil_mass and calc_acceptance produce Q; calc_physical independently closes gross stock. retail_service=1 kg per 1 kg reference flow; never normalize physical and accepted ledgers together twice"
      unit: "kg oil; L; kg/L; degC; events"
      frequency: "Every receipt/handover/return; daily stock and storage review"
      temporal_coverage: "Full declared pool, stock carryover and subsequent actual late returns"
      site_scope: "Assigned oil shelf, checkout, store gates and unique recipient records"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration/verification; label photos; density test; transaction/return links; balance residual and uncertainty investigation"
    - protocol_id: cp_electricity
      process_id: "retail"
      flow_role: "Store AC import and attributable service use"
      record_type: "Meter topology and energy ledger"
      raw_fields: "meter/circuit_ID; parent inclusion; start/end reads; timestamps; kWh; outage; shelf-volume-hours; POS seconds; all-beneficiary drivers; idle capacity; supplier/grid/voltage; provider boundary"
      collection_method: "Calibrated site import/submeters with wiring map and interval readings; directly isolate loads where possible; observe time/space drivers, verify independent meters before subtraction; retain outage/closed intervals Aggregation detail: calc_shared attributes full pool once; calc_energy converts 3.6 MJ/kWh then divides by Q once, per 1 kg reference flow"
      unit: "kWh; MJ; m3*h; s"
      frequency: "Interval metering and every configuration/driver change"
      temporal_coverage: "All open/idle/closed hours of pool and actual late-return processing assigned back to original pool"
      site_scope: "Entire supporting store with all actual beneficiaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills reconciliation; topology; load/driver survey; supplier geography/voltage and loss coverage"
    - protocol_id: cp_checkout
      process_id: "retail"
      flow_role: "Receipts, bags, emptied cartons and paper waste"
      record_type: "Material and issue/waste ledger"
      raw_fields: "material_ID/specification; opening/purchased/closing mass; issued/voided quantity; bag count/measured unit mass; gross/tare waste; SKU/event_ID; contractor/route; stock card"
      collection_method: "Weigh each material separately using verified scale; counts convert only with actual homogeneous mass samples; distinguish retailer waste from customer-retained packaging and invoices; record carton origin and provider scope Aggregation detail: Raw material/waste mass attributed by direct events or calc_shared; calc_normalise divides by Q once, per 1 kg reference flow"
      unit: "kg; counts converted to kg"
      frequency: "Each issue/waste event; daily stock reconciliation"
      temporal_coverage: "Full pool including failures and stock changes"
      site_scope: "Oil checkout and carton unpacking area"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale check; material/SDS specification; invoices; issue-stock match; waste receipt and no-issue/zero-event proof"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "Complete assets and terminal scope; maintenance labour h only"
      record_type: "Persistent asset/exposure and provider-scope ledger"
      raw_fields: "asset_ID; package version/BOM; source_task_ID; loaded/empty/idle/reserved task state; beneficiary; task start/end; loaded_minutes; empty_return_positioning_minutes; assigned_idle_reserved_minutes; task_responsibility; contract_id; work_order_ID; service_type; package_version; work_scope; homogeneous_unit; measurement_boundary; compatible_background_flow; execution_ID; work_order_count_QA_only; purchased_labour_h; labour_scope; labour_background_exclusions; installed count; site/owner; manufacture/installation boundary; commissioning/retirement; E_av/e_aiv; historical postings; ledger version; maintenance event/scope/parts IDs; terminal carrier gross/tare/direct net mass; removed-part IDs; route/recipient; provider inventory; g_ai"
      collection_method: "Preserve the original persistent asset life and all historical beneficiaries. Reconcile each work-order purchased labour start/end h and every raw physical constituent; labour uses cp_split_labour_assets, physical quantities cp_split_support. Every different substance/part/carrier needs an exact card, excluded from the labour background. Direct net terminal weighing and BOM reconstruction remain exclusive; earlier removed repair parts are excluded from the remaining whole-asset terminal scope."
      unit: "Asset Item(s); maintenance h; terminal kg"
      frequency: "Every asset/event/owner/lifetime revision; interval exposure; final retirement reconciliation"
      temporal_coverage: "Full asset life, all periods and beneficiaries; current-pool postings with prior versions retained"
      site_scope: "Full supporting building, steel shelving, complete POS and manual trolley; none assumed outside due to lease"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Commissioning/condition/lifetime evidence; BOM/photos; exposure audit; cumulative <=1 ledger; final residual; provider boundary and terminal mass/recipient tickets; no-event evidence"
    - protocol_id: cp_cleaning
      process_id: "cleaning"
      flow_role: "Tap water, specified SDS solution, pads, whole effluent and used pads"
      record_type: "Cleaning/spill event liquid-carrier ledger"
      raw_fields: "event_ID/date; floor/area; water meter V_in and temperature/rho; solution batch/concentration/formulation/mass; dry-pad mass; whole used-pad net mass/oil/water; effluent mode/V_out/rho_eff; oil-to-drain mass; opening/closing liquid stock; evaporation; removed liquid; capture; sewer/treatment receipt; calibration"
      collection_method: "At defined impermeable cleaning/spill area, separately meter imported water and discharge or use verified whole-carrier reconstruction. Weigh solution and pad inputs/outputs; measure cleaning interval exposure across all beneficiaries; sample effluent density at discharge composition/temperature; SDS ingredient record and measured oil/solid retention complete balance. Document actual final medium, sewer route and any outside escape; internal release alone cannot establish elementary flow Aggregation detail: calc_effluent chooses one mode; directly attributed or calc_shared masses; divide by Q once per 1 kg reference flow. Shared spill IDs with cp_fates reconcile oil destinations, not duplicate quantities"
      unit: "kg; L; kg/L; degC; m2*events"
      frequency: "Every cleaning/spill event and liquid stock change"
      temporal_coverage: "Full pool with failed/zero-output events retained"
      site_scope: "Whole defined sanitation area and actual sewer boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/meter calibration; density sample; SDS; photos of containment/drain; stock/carrier closure; sewer/waste manifest; no-event evidence"
    - protocol_id: cp_fates
      process_id: "residual"
      flow_role: "Failed receiving-gate background and disjoint terminal merchandise carriers"
      record_type: "Origin-linked responsibility and fate ledger"
      raw_fields: "origin_ID; original pool/event/return_ID; initial packaged net oil; receiving gate/provider; qualified/stock/failure mass; recipient/state; external-retention/donation/supplier-return event IDs; final qualification; signed burden transfer; supplier-return continuation; eventual resale link; F_gate; whole bottle net waste mass; separated oil mass; glass carrier net mass/adhered oil; pad/effluent portion IDs; transport/treatment provider boundary"
      collection_method: "At every failure/return/theft/stock disposition follow the same unique oil mass and record actual recipient/state and responsibility. Independently weigh each disjoint whole carrier after tare on calibrated scale; test relevant adhered-oil balance; reconcile cp_events physical mass and cp_cleaning oil portions by original IDs. Failed goods held externally stay a transfer, not automatic retailer waste. Retailer supplier-return vehicle use is outside chosen route: occurrence requires dedicated transport/empty-trip cards before completeness Aggregation detail: calc_failure allocates receiving-gate background once; each actual carrier attributed once then /Q per 1 kg reference flow. Reuse original event ledgers from cp_events/cp_cleaning as single-process views, not fresh stock or repeated normalization"
      unit: "kg oil; kg whole carrier; responsibility fractions"
      frequency: "Every event, fate change and subsequent linked resale; daily closure"
      temporal_coverage: "Original pool plus all actual late-event dates and unresolved follow-through"
      site_scope: "Receiving gate, store residual handling and named external recipients/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed transfer/fate receipts; theft/damage evidence; upstream package gate/primary packaging/inbound coverage; gross/tare tickets; all-origin oil closure; no-event proof; unknown fate blocks completion"
    - protocol_id: cp_split_labour_assets
      process_id: "assets"
      flow_role: "building_maintenance; shelf_maintenance; pos_maintenance; trolley_maintenance"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
    - protocol_id: cp_split_support
      process_id: "split_support"
      flow_role: "split_building_led; split_shelf_bolt; split_pos_psu; split_trolley_wheel; split_removed_led; split_removed_bolt; split_removed_pos_psu; split_removed_trolley_wheel; split_support_electricity; split_support_travel"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
  calculation_rules:
    - id: calc_oil_mass
      applies_to: "retail_service"
      rule: "For each homogeneous lot use net_oil=gross_package-matched_empty_package_tare, or exclusive volume mode net_oil=measured_fill_L*rho_oil(T) in kg/L. Nominal 1000 mL and crude-oil density tables are not measurement substitutes. Keep bottle/cap/pourer/label outside net oil."
      inputs:
        - gross_package
        - matched_empty_package_tare
        - measured_fill_L
        - "rho_oil(T)"
        - cp_events
      output: "Net oil kg per unique bottle/event"
      source_ids:
        - spack-refined-oil
        - spack-packaging
    - id: calc_acceptance
      applies_to: "retail_service"
      rule: "Q=sum unique net oil with final qualified acceptance after reversals/reacceptance. Gross physical handovers H and returns R remain separate; only a qualification reversal removes that bottle from Q. One origin mass resold after return contributes at most once at final state."
      inputs:
        - net_oil
        - event_ID
        - qualification_state
        - reversal_link
        - cp_events
      output: "Q kg finally accepted service throughput"
      source_ids:
        - ghg-product-2011
    - id: calc_physical
      applies_to: "retail_service; failed_oil_background"
      rule: "Opening oil stock + external receipts + physical customer returns = gross physical customer handovers + physical supplier/internal transfers out + oil in retailer waste/pads/effluent/actual releases + closing oil stock + investigated theft/other loss. Qualification Q is not substituted for gross handovers; a return or resale is an event on the same origin."
      inputs:
        - opening
        - receipts
        - physical_returns
        - gross_handovers
        - transfers
        - carrier_oil
        - closing
        - theft
        - cp_events
        - cp_fates
        - cp_cleaning
      output: "Closed physical oil ledger with investigated residual"
      source_ids:
        - ghg-product-2011
    - id: calc_failure
      applies_to: "failed_oil_background"
      rule: "F_gate=sum unique non-qualified/finally failed oil kg for which this service retains receiving-gate responsibility. Subtract only documented eventual qualified resale/stock carryover or signed continuing-background transfer; retain unresolved mass as provisional service responsibility and incomplete fate. Link one receiving-gate dataset containing production, exact primary package and inbound transport. Downstream total=service inventory (including F_gate/Q) + successful-merchandise receiving-gate background once + customer downstream stages, with stock/resale responsibility reconciled."
      inputs:
        - origin_ID
        - receiving_gate
        - responsibility_owner
        - final_state
        - resale_link
        - signed_transfer
        - cp_fates
      output: "F_gate kg and explicit downstream assembly responsibility"
      source_ids:
        - ghg-product-2011
    - id: calc_shared
      applies_to: "store_electricity; cleaning_water; sds_cleaner; absorbent_pad; cleaning_effluent; oily_pad_waste; receipt_paper; carrier_bag; receipt_waste; bag_waste; corrugated_waste"
      rule: "X_i=X_direct_i+sum_k L_k*d_ik/sum_all_beneficiaries(d_jk). Parent residual L_k excludes only contained known submeters/direct parts once; independent disjoint meters are added, not subtracted. Use the documented causal driver and retained idle/zero-driver capacity-time method; sum allocated X_i over all beneficiaries equals full measured total."
      inputs:
        - X_direct_i
        - L_k
        - d_ik
        - all_beneficiaries
        - meter_topology
        - idle_capacity
      output: "Attributed raw quantity X_i before normalization"
      source_ids:
        - ghg-product-2011
    - id: calc_energy
      applies_to: "store_electricity"
      rule: "E_MJ=3.6*E_kWh; amount=E_MJ/Q after attribution. The conversion is exact energy units, not an emission factor."
      inputs:
        - E_kWh
        - Q
        - cp_electricity
      output: "MJ per 1 kg reference flow"
      source_ids:
        - ghg-product-2011
    - id: calc_asset
      applies_to: "building_acquisition; shelf_acquisition; pos_acquisition; trolley_acquisition"
      rule: "E_av=past_actual_exposure+projected_remaining_exposure across all beneficiaries; f_aiv=e_aiv/E_av. For trolley, e_trolley_i=sum(source_task_ID-attributed loaded_minutes + actual empty_return_positioning_minutes) + assigned_idle_reserved_minutes; E_trolley uses the same loaded/empty/idle/reserved responsibility basis across the whole lifetime and every beneficiary. Shared empty time is assigned once by recorded task responsibility and reconciles to actual observed time; zero load never sets actual time to zero. Post N_a*f_aiv for current exposure; on version change post desired_cumulative_new minus prior_posted_total. Keep complete object count, final residual and cumulative <=1."
      inputs:
        - N_a
        - e_aiv
        - E_av
        - source_task_ID
        - loaded_minutes
        - empty_return_positioning_minutes
        - assigned_idle_reserved_minutes
        - task_responsibility
        - ledger_version
        - prior_posted_total
        - cp_assets
      output: "Attributed complete asset/package count before /Q"
      source_ids:
        - ghg-product-2011
    - id: calc_maintenance
      applies_to: "building_maintenance; shelf_maintenance; pos_maintenance; trolley_maintenance"
      rule: "The four maintenance cards each measure actual purchased labour h for their respective asset only. Attribute measured h once per work order using its supported-cycle all-beneficiary asset driver; material, replacement, energy, travel and removed waste are independent cp_split_support quantities. Zero events require dated evidence; unknown is not zero. Divide by Q once under c_split_quantity; completed-package counts and complete maintenance-package backgrounds are no longer used."
      inputs:
        - work_order_ID
        - measured_labour_h
        - supported_interval_beneficiary_exposure
        - all_supported_beneficiaries
        - cp_split_labour_assets
      output: "Attributed labour h, final division by Q once"
      source_ids:
        - ghg-product-2011
    - id: calc_terminal
      applies_to: "building_terminal; shelf_terminal; pos_terminal; trolley_terminal"
      rule: "X_terminal=Nend_a*g_ai, where g_ai=cumulative lifetime exposure of beneficiary i / total lifetime exposure across every beneficiary and owner, using the current evidence-based whole-life forecast before retirement and final actual exposures at retirement. Version corrections replace prior postings and final g shares sum to one. Multiply once; do not multiply manufacture fraction again. Direct net carrier mass already excludes removed parts; BOM-only reconstruction subtracts parts once as the alternative. Match terminal package inventory to actual complete remaining object and all separately removed parts without duplicating maintenance treatment."
      inputs:
        - Nend_a
        - g_ai
        - full_carrier_mass
        - removed_parts
        - provider_scope
        - cp_assets
      output: "Attributed terminal-service package count before /Q"
      source_ids:
        - ghg-product-2011
    - id: calc_effluent
      applies_to: "cleaning_effluent"
      rule: "Choose one mode. Direct: W=V_out*rho_eff(T,composition), with no water-supply evaporation/storage deduction. Reconstruction: W=kg_imported_water+kg_delivered_cleaner_solution+kg_oil_entering_liquid+kg_other_measured_dissolved_or_suspended_material+opening_liquid_stock-closing_liquid_stock-kg_actual_evaporation-kg_liquid_removed_in_pads_or_separate_carriers. All terms are kg whole-carrier contributions, solution water is not repeated as imported water, and carrier-retained oil is not added twice. Missing terms block reconstruction."
      inputs:
        - effluent_mode
        - V_out
        - rho_eff
        - kg_imported_water
        - kg_delivered_cleaner_solution
        - kg_oil_entering_liquid
        - kg_other_material
        - opening_liquid_stock
        - closing_liquid_stock
        - kg_actual_evaporation
        - kg_liquid_removed
        - cp_cleaning
      output: "Raw whole effluent mass W kg before attribution and /Q"
      source_ids:
        - jrc-retail-2013
    - id: calc_normalise
      applies_to: "receipt_paper; carrier_bag; receipt_waste; bag_waste; corrugated_waste; building_acquisition; building_maintenance; building_terminal; shelf_acquisition; shelf_maintenance; shelf_terminal; pos_acquisition; pos_maintenance; pos_terminal; trolley_acquisition; trolley_maintenance; trolley_terminal; cleaning_water; sds_cleaner; absorbent_pad; cleaning_effluent; oily_pad_waste; failed_oil_background; external_retention; supplier_return; donated_oil; discarded_bottle; decanted_oil; broken_glass"
      rule: "Each already attributed raw exchange X_i is divided by the same corrected Q exactly once. Asset/event/terminal shares and destination/composition fractions already applied upstream are not reapplied. Reference output is 1 kg. For Q=0 keep raw pools and disclose unnormalizable service rather than omit them or assign zero."
      inputs:
        - X_i
        - Q
        - pool_ID
        - prior_allocation_versions
      output: "Inventory amount per 1 kg reference flow"
      source_ids:
        - ghg-product-2011
    - id: c_split_quantity
      applies_to: "building_maintenance; shelf_maintenance; pos_maintenance; trolley_maintenance; split_building_led; split_shelf_bolt; split_pos_psu; split_trolley_wheel; split_removed_led; split_removed_bolt; split_removed_pos_psu; split_removed_trolley_wheel; split_support_electricity; split_support_travel"
      rule: "For each exact identity r in its single unit, restore normalized source q_source with its original denominator D_source as x_raw=q_source*D_source; already-raw quantities are not restored again. Apply only missing attribution once under split_attribution, deduplicate source/event/version and reverse old package and historical versions. Sum disjoint raw quantities as X_r; q_r=X_r/Q, dividing by the final reference denominator once. Labour uses measured purchased h only, never old order counts/area; in-house hours are QA only. Calculate asset counts, material kg, electricity kWh, vehicle*km and waste-carrier kg separately; never add across properties or multiply already-measured physical quantities by labour hours. Unknown quantity/identity/background blocks completeness."
      inputs:
        - X_r
        - D_source
        - q_source
        - Q
        - cp_split_labour_assets
        - cp_split_support
      output: "q_r"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Bind each specific unbound flow only after official direct read proves bilingual name, state/type, qualifiers and property/unit/medium fit; reference service cannot borrow commodity-oil UUID. Bound electricity identity does not identify its supply mix or provider."
      evidence: "Official originals/integrity records and per-row applicability plus provider/quantity evidence"
    - id: q_mass
      applies_to: "retail_service; failed_oil_background; external_retention; supplier_return; donated_oil; discarded_bottle; decanted_oil; broken_glass; cleaning_effluent; oily_pad_waste"
      requirement: "Reconcile net oil, gross packaging and all carrier oil portions independently; preserve measurement uncertainty and investigate residuals without forcing closure to zero. Specified nominal bottle size never supplies mass/density by default."
      evidence: "Calibrated scales/meters; lot density/tare; event stock and carrier balances"
    - id: q_boundary
      applies_to: "assets; retail; residual"
      requirement: "Each maintenance card must use actual purchased labour h; work-order count is QA only, consistently with split_labour_time/maintenance_event. Actual parts/utilities/travel/treatment have separate cards and are excluded from labour background. Verify each maintenance card has one signed contract/work-order-defined homogeneous unit, fixed service_type/package_version/work_scope/measurement boundary and compatible background flow; heterogeneous actual packages need named cards and matching protocol views before completeness. Verify every complete provider package and remove overlap with separately metered electricity, maintenance, terminal care, primary merchandise package and inbound delivery. Any unknown route/asset/provider coverage is incomplete."
      evidence: "Signed scope/BOM/process inventory; route/recipient receipts; topology and site survey"
    - id: q_collection
      applies_to: "all inventory rows"
      requirement: "Use the exact linked single-process protocol; raw records specify what/where/when, IDs, method/unit/frequency/coverage, calibration, evidence, allocation and reconciliation. Conditional absence requires dated stock/site/event proof; missing data never imply zero. Additional actual exchanges require atomic cards/protocols and bilingual resync before completeness."
      evidence: "Complete source ledgers and presence/absence checklist with accountable reviewer"
    - id: q_temporal
      applies_to: "retail; assets; residual"
      requirement: "Keep complete same-configuration periods and every failure/idle/closed/zero-driver cohort. Reopen original numerators/denominators/background/fates for actual late returns or lifetime changes; never erase prior work or restart full capital."
      evidence: "Prospective pool declaration; immutable origin/event links; versioned asset corrections and suspense balances"
    - id: q_sources
      applies_to: "all inventory rows"
      requirement: "Use manufacturer examples only for refined-oil/bottle/storage feasibility; use JRC only to identify retail activity obligations and GHG Product Standard only for transparent unit/boundary/allocation logic. Foreground choices are this PCR design, not universal source mandates; no quantitative factor or compliance limit is imported."
      evidence: "Current labels and applicability/source-field audit; explicit uncertainty and gaps"
validation_rules:
  - rule_id: v_service
    applies_to: "retail_service"
    rule: "Require one service reference flow with 1 kg final accepted net-oil throughput, linked to retail_service. Reject commodity UUID substitution, gross-bottle denominators, nominal-volume density assumptions, duplicate resale or purely financial adjustments to Q."
    source_ids:
      - ghg-product-2011
  - rule_id: v_ledgers
    applies_to: "retail; residual; cleaning"
    rule: "Require independent gross physical stock closure and final-acceptance ledger, unique oil lineage, disjoint terminal carriers and background owner at the same gate including inbound transport. External failed retention/supplier returns need recipient/state and continuing responsibility. Unresolved fate means incomplete, not automatic waste or zero burden."
    source_ids:
      - ghg-product-2011
  - rule_id: v_assets
    applies_to: "assets"
    rule: "Require all four full assets and distinct acquisition/event-maintenance/terminal coverage, lifetime exposure equation and cumulative revision ledger; final fractions reconcile across beneficiaries/owners. Reject capital restart, second manufacture multiplier on terminal carriers, duplicate removed-part subtraction and unsupported complete packages."
    source_ids:
      - ghg-product-2011
  - rule_id: v_collection
    applies_to: "all inventory rows"
