product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.retail-trade-services.non-specialized-store-retail-trade-services-of-dairy-products-eggs-and-edible-oils-and-fats"
  classification_refs: "CPC 3.0 62122; narrower: only the specified vegetable-oil retail route, not the whole subclass"
  covered_products: "Retail service for unopened 1000 mL nominal dark-green Marasca glass bottles of refined conventional sunflower seed oil, Helianthus annuus; sole ingredient sunflower oil; no added flavouring; actual bottle/cap/pourer/label specification recorded"
  excluded_products: "Oil manufacture, filling or repacking; crude/cold-pressed/high-oleic/mid-oleic oils; oil blends, other fats and oils; dairy, whey and eggs; oil-cake/residues; bulk dispensing; online ordering, delivery and refrigerated or heated merchandise holding"
  representative_product: "One kg net oil content successfully retailed in the specified sealed bottles; mass is a service-throughput coordinate, not a manufactured-oil reference flow"
  production_route: "Retailer receiving gate → manual trolley put-away → ambient steel shelf → customer self-selection → staffed POS checkout → accepted walk-in handover; no retailer vehicle leg after receipt"
  market_state: "Shelf-stable unopened liquid oil in intact food-contact glass packaging, cool/dry/dark to current supplier label; no universal temperature, shelf life or density assigned"
functional_unit:
  what: "Provide the specified in-store retail service, retaining bottle integrity, traceability and declared supplier storage conditions"
  how_much: "1 kg net oil content finally accepted through this service, Q > 0"
  how_well: "Correct SKU/lot and sealed intact bottle, readable identity/date label, documented compliance with current supplier storage instructions, accepted by customer; price discount or refund alone changes neither physical status nor Q"
  how_long_or_cycle: "Prospectively declared complete same-configuration reporting pool, from receiving through resolved handover/return/fate; actual residence and failed/idle/closed periods retained; late events reopen original pool"
  reference_flow_link: "retail_service"
system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "retail"
      rule: "Apply only to a walk-in non-specialized store with manual handling, natural ventilation, mains-powered lighting/POS, no HVAC, cold room, lift, standby generator or retailer transport after receipt. Verify every absence by dated equipment/route survey. Other actual equipment or exchanges require named atomic cards, collection protocols and bilingual projection before completeness; unknown presence is not absence."
      source_ids:
        - jrc-retail-2013
        - un-cpc62122
    - rule_id: oil_storage
      applies_to: "retail"
      rule: "Keep unopened refined conventional sunflower oil and exact current package identity separate from crude, cold-pressed and fatty-acid variants. Record label-specific cool/dry/dark conditions, lot/date/closure integrity and measured dwell; manufacturer examples support feasibility only, not a mandatory temperature, density, shelf life or a universal packaging composition."
      source_ids:
        - spack-refined-oil
        - spack-packaging
    - rule_id: merchandise_owner
      applies_to: "retail; residual"
      rule: "Exclude background production, primary packaging and pre-receipt inbound delivery only for eventual qualified merchandise output or documented saleable stock carried forward. The service owns the same receiving-gate background for all irrecoverable loss, damage, theft and failed external retention and supplier returns until a signed continuing-responsibility transfer or verified future qualified resale assigns it once. Record recipient, state, receiving-gate burden owner and unique origin on each transfer; an unresolved transfer blocks completeness. Never assign waste merely because an order fails."
      source_ids:
        - ghg-product-2011
    - rule_id: return_pool
      applies_to: "retail; residual"
      rule: "Declare the pool before results; retain failed and zero-sale cohorts and all idle/closed periods. Q counts final qualified acceptance once per unique merchandise mass, less reversed acceptance, plus only reacceptance needed to restore the same mass once. Financial refunds without reversed qualification do not subtract Q; internal transfers and external retention without qualification never create Q. Late returns revise the original Q, service numerator, fate and background responsibility using actual event dates; prior retail work remains in that original pool and cannot be reassigned as new work. Q=0 pools remain unnormalizable and carried with their burden records."
      source_ids:
        - ghg-product-2011
    - rule_id: asset_packages
      applies_to: "assets"
      rule: "Include full building shell/fixed lighting/wiring/plumbing construction-and-installation package, steel shelf assembly, complete POS workstation (scanner/printer/payment device) and manual trolley. Each has distinct acquisition, event maintenance and terminal-service cards. Building excludes the three movable devices; device acquisition excludes operation/maintenance/terminal care. Terminal services include actual collection/transport/treatment of the complete remaining object and documented removed parts; no additional waste-treatment dataset for the same carrier. Required material, utility and emissions inside an evidenced complete provider package are not separately duplicated. Unsupported package coverage blocks completeness."
      source_ids:
        - jrc-retail-2013
        - ghg-product-2011
    - rule_id: carrier_media
      applies_to: "cleaning; residual"
      rule: "Measure each actual waste carrier and treatment route. Whole discarded bottles, decanted oil, glass fragments with adhered oil, oily polypropylene pads and sewer-bound cleaning effluent are disjoint terminal portions. Do not count oil on pads or in effluent again as decanted oil or environmental emission. Indoor spill is not an elementary release; verify impermeable containment and sewer routing. An observed final release to air/water/soil requires a specific substance/medium card and direct mass reconciliation before completeness; no default emission or zero escape is assumed."
      source_ids:
        - jrc-retail-2013
    - rule_id: split_exchange_identity
      applies_to: "all inventory rows"
      rule: "Each card has exactly one concrete exchange identity and one reference measurement property/unit; a unit group is not a second property, and auxiliary measurements are conversion evidence only. Labour cards no longer carry bundled materials/energy/equipment/wastes. Retained complete homogeneous assets, original packaged goods and real mixed waste carriers require matching actual whole-scope background/receiver treatment and full composition; heterogeneous collections or selectors are prohibited. An original exchange enters one core card or one split source only; reverse all old package characterization when replacing it and combine only disjoint raw quantities with identical identity/property/unit. Every other actual substance, part, fuel, refrigerant, emission and treatment gap requires a named bilingual card and process protocol; unknown is never zero or complete."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Retailer custody at documented store receiving gate of sealed refined sunflower oil bottles; all pre-gate production/primary packaging/inbound transport remain in packaged-merchandise background ledger"
  starting_condition_role: "Incremental retail service with explicit failed-merchandise coupling and full supporting-store asset attribution"
  product_classification_scope: "CPC 3.0 62122 includes vegetable oils among several groups; this is a narrower service for the defined oil, bottle and store route"
  recursive_input_rule: "An incoming retail-service dataset is not the oil. Reuse only a disjoint upstream service with its gate disclosed; never recurse by adding this service to itself. Supplier-return and resale histories retain one merchandise-origin ID"
  upstream_dataset_requirement: "Successful merchandise background is aggregated once by downstream product modeller; failure/background row covers the same receiving gate including primary package and inbound delivery. Electricity, capital, maintenance, terminal and waste providers need explicit disjoint boundaries"
  disclosure: "Report service-only boundary and downstream assembly equation, Q and gross physical ledgers, unsuccessful external retention, unresolved fate/identity, all provider coverage and site restrictions; no oil footprint or full-standard conformity is implied"
