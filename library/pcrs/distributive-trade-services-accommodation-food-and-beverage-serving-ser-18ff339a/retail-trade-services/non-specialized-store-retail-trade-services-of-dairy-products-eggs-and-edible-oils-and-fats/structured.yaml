measurement_rules:
  - id: net_service_mass
    applies_to: "retail_service; failed_oil_background"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure net oil, excluding all packaging, using calc_oil_mass and cp_events; keep the service/reference flow distinct from traded oil."
  - id: electric_energy
    applies_to: "store_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert kWh to MJ by 3.6 only after causal attribution; no reference-mass rule applies to this electricity numerator."
  - id: package_count
    applies_to: "building_acquisition; building_terminal; shelf_acquisition; shelf_terminal; pos_acquisition; pos_terminal; trolley_acquisition; trolley_terminal"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "Count one explicitly specified complete physical device/construction/event/terminal package. Never substitute repair-material mass, operating time or distance for an item. Exposure fractions retain their own units in the ledger."
  - id: whole_carrier
    applies_to: "discarded_bottle; decanted_oil; broken_glass; cleaning_effluent; oily_pad_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual whole-carrier mass with its specified moisture/oil content, not net product mass or duplicated constituents; direct and reconstructed modes are mutually exclusive."
  - id: split_labour_time
    applies_to: "building_maintenance; shelf_maintenance; pos_maintenance; trolley_maintenance"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "h"
    rule: "Use signed actual purchased labour hours only; order counts, area and asset counts cannot replace h. Materials, energy, tools, travel and wastes are independent exchanges. In-house hours are QA only, with no invented purchased exchange; normalize attributed hours once by the original final reference denominator."
  - id: selected_energy_identity
    applies_to: "split_support_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "The selected AC identity has one reference energy property. Keep actual attributed quantities in the row unit;1kWh=3.6MJ in its unit group. Convert once before combining with a source expressed in another energy unit or supplying the reference-MJ exchange; never convert the same numerator twice or infer a supplier mix."
