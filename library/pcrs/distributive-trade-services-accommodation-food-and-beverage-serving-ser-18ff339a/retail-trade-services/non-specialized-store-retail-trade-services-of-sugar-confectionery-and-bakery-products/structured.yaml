  what: "Provide the declared partial dry-stock retail service to a final-use customer"
  how_much: "One finally accepted and retained intact bag of the single declared nominal 1 kg SKU; count is the service basis, not a conversion of actual sugar kg"
  how_well: "Seal and current lot quality specification satisfied at handover; documented acceptance remains valid after the contractual physical-return window and recorded late corrections"
