allocation_rules:
  - rule_id: pool_allocation
    applies_to: "electricity_input"
    rule: "Use a dedicated measured light circuit first. Where the declared meter also serves other displays, allocate each interval k by permanently assigned illuminated shelf area A_ck divided by all beneficiaries A_allk, including reserved empty sugar space. E_c=sum(E_k*A_ck/A_allk). Retain closed, idle and zero-sale intervals; no driver means pending assignment, not deletion. Reconcile all beneficiaries to the whole meter. Do not subtract this circuit from an independent disjoint parent meter; common-store completion removes it only where a traced parent includes it."
    source_ids:
      - ghg-product
      - jrc-retail
  - rule_id: completion_method
    applies_to: "retail_service"
    rule: "Completion modules use direct subdivision/meters, then declared causal drivers: premises/common light area-hours, HVAC conditioned-area-hours with actual zones, POS/receipt measured transaction events, sanitation event/area records, handling measured loaded plus empty active minutes and reserved/idle ledger. Allocate every full shared pool across all beneficiaries; unknown route/coverage is unresolved. Asset manufacture uses f_c=x_c/L: measured current beneficiary exposure x_c divided by evidenced expected total all-beneficiary lifetime exposure L in the same driver, including pre-period history and reserved/idle use. Keep one persistent asset ledger, replace old-version allocations on life revision, cumulative fractions <=1 and allocate final residual once. Actual maintenance is event-specific with exact homogeneous contract/work scope or separate materials/services; original complete asset components, replacements and provider-covered energy/transport/treatment are disjoint. At retirement R=1-sum(f_posted across all historical beneficiaries); w_c=x_lifetime_c/sum(x_lifetime_all); h_c=f_posted_c+R*w_c with signed corrections to original pools. L revisions replace old fractions through delta=f_new-f_posted, never reset the asset. Terminal full-carrier mass/count uses h_c once, not an extra manufacture fraction. Actual terminal direct weighing and component reconstruction are exclusive; direct net weighing does not subtract already removed parts again. For external transport record actual gross tonnes including packaging times actual loaded km; verify provider coverage of every actual empty trip. Where empty travel is not demonstrably included, add separately measured empty vehicle-km with exact overlapping burden removed from the loaded provider once; unknown coverage blocks completeness and zero tonnes cannot erase a trip. For air completion measure raw internal source, outside inlet/outlet flux at matching temperature/pressure/wet-dry basis, net room/capture stocks and actual terminal exports; unknown capture/outside paths are not zero. Whole sewer mass uses direct measured V*rho or an exclusive full-liquid mass reconstruction including solutes; no water-only reconstruction or duplicate reuse/evaporation correction."
    source_ids:
      - ghg-product
      - jrc-retail
  - rule_id: no_credit
    applies_to: "failed_background; recovered_sugar; supplier_transfer"
    rule: "No avoided-production or recycling credit is claimed. Actual recovered sugar is a physical transfer with measured recipient/state and subsequent responsibility; it does not undo the original bag failure. Supplier transfers retain acknowledged continuing backgrounds. Normalize attributable raw totals once by N only after all within-pool attribution and revisions. A wholly zero-output pool is unnormalizable and disclosed; prospectively declared same-configuration pooling retains its entire burdens and never selects only selling periods."
    source_ids:
      - ghg-product
  - rule_id: raw_attribution
    applies_to: "containment_input; recovered_sugar; case_waste; film_waste; whole_bag_waste; sweep_waste"
    rule: "Assign direct sugar-parent events/carriers to their original pool. For a shared actual transport case/film, first weigh the exclusive whole discarded carrier, then allocate once by the declared SKU actual packed gross volume divided by the measured total packed gross volume of all original beneficiaries in that source case/consignment. Use actual dimensions and packed counts, not nominal sugar kg or sales value; retain failure/zero-sale parents. Reconcile fractions to one and carrier mass to measured totals. A dedicated sugar-containment bag/sweep carrier is direct; an actual mixture with other goods needs its own concrete flow/protocol and source-portion records before completion, not a hidden generic selector. Unknown source composition or zero/missing volume driver is unresolved."
    source_ids:
      - jrc-retail
      - ghg-product
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "original parents and final service"
      record_type: "receipt, custody, acceptance and fate ledger"
      raw_fields: "parent_id; manufacturer; SKU; lot; nominal size; supplier current signed specification; exact closure and bag BOM; actual original net/gross mass; packaging tare; source/background gate and scope; stock_open; stock_close; receipts; terminal_parent_removals; supplier_return_back_entries; S; H; C; N; F; F_keep; T; T_supplier; U_keep; T_keep; O_keep; O; timestamps; reason; recipient; return-window close; late revisions"
      collection_method: "Scan/count each original bag at every custody event. Weigh gross and determine original net fill with calibrated scales using traceable supplier lot records or prospectively stratified destructive matched-bag sampling by lot/pack line; weigh actual emptied packaging, record sample count, dispersion, representativeness and actual sampled-parent fate. Verify material layers, inks/adhesives and whole-pack scope from supplier BOM and test/document evidence; photographs do not prove composition. Never infer net fill from nominal label or gross mass alone. Preserve unique original history through returns/resale."
      unit: "Item(s); kg"
      frequency: "each receipt/event and every closure/revision"
      temporal_coverage: "entire prospective pool plus physical-return window and later known corrections"
      site_scope: "one actual SKU at store receipt/stock/customer/recipient gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrations; signed supplier/BOM/background; paired sample records; serial event history; acknowledgment and reconciliation"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "dedicated display lighting"
      record_type: "meter and beneficiary map"
      raw_fields: "meter_id; circuit diagram; start/end/register rollover; kWh interval; A_ck; A_allk; reserved/idle area; driver version; tariffs/provider; parent-meter inclusion"
      collection_method: "Read a calibrated meter continuously or at every declared interval boundary; verify actual circuit with isolation tests and floorplan. Log all hours including closed/no-sales periods. Allocate by pool_allocation only where needed; document provider and voltage separately from the generic flow."
      unit: "kWh; m2"
      frequency: "every meter interval; circuit/space change"
      temporal_coverage: "full pool including idle/closed and failed cohorts"
      site_scope: "declared dedicated lighting circuit and every beneficiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, circuit tests, readings and full-beneficiary balance"
    - protocol_id: cp_containment
      process_id: "retail"
      flow_role: "retailer HDPE bags"
      record_type: "purchase, empty-bag weighing and use ledger"
      raw_fields: "bag_id; supplier; material specification; empty mass; opening/purchase/closing stock; used count; event/parent/carrier IDs; included provider scope"
      collection_method: "Verify actual HDPE material and weigh representative empty bags of each homogeneous batch on calibrated scales; record sampling variability. Reconcile actual consumption to stock and carrier events, not purchases alone. A zero requires stock/incident evidence of no use; unknown material is unresolved."
      unit: "kg; Item(s)"
      frequency: "each batch and use/stock event"
      temporal_coverage: "full pool including quarantine and residual storage"
      site_scope: "retailer-added dry containment only"
      aggregation_rule: "per reference flow"
      quality_evidence: "material declaration; calibrated weighing; stock and carrier reconciliation"
    - protocol_id: cp_residual
      process_id: "retail"
      flow_role: "actual transfer and residual carriers"
      record_type: "split, weighing, inventory and handover ledger"
      raw_fields: "parent/component/carrier IDs; event/time; source type; whole gross/tare/net kg; composition including sugar, packaging, moisture and foreign material; opening/closing residual stock; split matrix; recovered recipient/state; treatment recipient/route; packaging manufacture ownership; provider transport/treatment scope; source consignment/case_id; actual packed gross-volume shares and all beneficiary quantities; attribution version; uncertainty"
      collection_method: "Weigh actual exclusive carriers on calibrated scales at removal/storage and terminal handover, taking container tare once. Identify actual cardboard and LDPE by supplier specification; do not infer from appearance. Whole failed bags and split descendants are mutually exclusive. Quantify composition through traced original BOM and matched sample/separation measurements, retaining full physical carrier mass. Reconcile all residual stocks and descendants to each original event. Any wet cleanup, fugitive dust/moisture or unknown missing material triggers the named completion module; it is not a default zero or assumed emission."
      unit: "kg"
      frequency: "every split, storage movement and handover"
      temporal_coverage: "full pool and retained residual stock through final disposition"
      site_scope: "store removal/quarantine and actual recipient gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scale/tare; original IDs; photos plus material/BOM proof; manifests and recipient acceptance; treatment/transport contract"
    - protocol_id: cp_conditions
      process_id: "retail"
      flow_role: "custody conditions and actual route"
      record_type: "continuous conditions and occurrence/absence inspection"
      raw_fields: "logger_id; temperature; RH; calibration; timestamp; shelf/stock location; seal/caking/odor/contamination; current signed acceptance condition; alarm/action; floorplan; actual equipment; process/incident/invoice evidence; missing intervals"
      collection_method: "Use calibrated time-aligned temperature/RH loggers over the actual storage/display locations, retain continuous raw records and clock checks; inspect as scope_gate requires. Trace every incident to original bags and actual response. Verify excluded/conditional activity occurrence with logs/invoices; no-event assertion needs the same full period coverage. Missing intervals require documented reconstruction with independent records and uncertainty or unresolved status, never zero."
      unit: "degC; %RH; time; status"
      frequency: "continuous log; receipt/daily/every handover and incident"
      temporal_coverage: "complete receipt-to-final-fate custody and pool"
      site_scope: "actual stock/display/quarantine sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrations; full logs; signed specifications; inspection and incident trail"
  calculation_rules:
    - id: calc_parent
      applies_to: "retail_service; failed_background; supplier_transfer; failed_retained"
      rule: "N=count(unique finally accepted retained parents); receipt/opening parent responsibility = S+F+T+O with mutually exclusive final original IDs; S=N for a closed single-service pool. F=terminal_failed_originals+F_keep, each original once; U_keep=F_keep+T_keep+O_keep with disjoint ownership and no second physical output; q_failed=F/N, q_supplier=T_supplier/N, q_unqualified_keep=U_keep/N. T_supplier counts only actual supplier handoff events, not T; other acknowledged continuing systems remain with their actual recipient/state and existing physical carrier. Gross count stock audit: stock_open+receipts+C=H+T_supplier+terminal_parent_removals+stock_close; internal movements cancel. H includes actual failed external handovers and repeated sales events; receipts and returns count physical entry events while the original-background partition counts unique original IDs only. U_keep is the finally retained subset of H after actual C, not another outward event. N is separately corrected, never substituted into the gross stock equation. O blocks final closure; no N=0 division."
      inputs:
        - N
        - S
        - F
        - F_keep
        - T
        - T_supplier
        - U_keep
        - T_keep
        - O_keep
        - O
        - H
        - C
        - stock_open
        - stock_close
        - receipts
        - terminal_parent_removals
        - cp_goods
      output: "normalized_parent_counts"
      source_ids:
        - ghg-product
    - id: calc_energy
      applies_to: "electricity_input"
      rule: "E_c=sum(E_k*A_ck/A_allk) only for an evidenced shared circuit; otherwise E_c=dedicated measured kWh. q_energy=3.6*E_c/N MJ. Meter rollovers and clock/circuit changes are corrected before attribution. A_allk includes reserved/idle beneficiaries; a missing driver or meter interval remains unresolved."
      inputs:
        - E_k
        - A_ck
        - A_allk
        - N
        - cp_energy
      output: "q_energy"
      source_ids:
        - ghg-product
        - jrc-retail
    - id: calc_mass
      applies_to: "containment_input; recovered_sugar; case_waste; film_waste; whole_bag_waste; sweep_waste"
      rule: "q_mass=m_attributed/N kg. Obtain m_attributed from raw actually consumed HDPE or actual exclusive terminal carrier gross minus container tare, summed by original event and recipient after unique attribution; never set internal quantities to N or nominal 1 kg. Direct whole-carrier weighing and BOM reconstruction are exclusive methods; direct net mass already excludes removed portions. Packaging constituents remain inside their actual carrier. Retained residual stock is measured and carried to actual later fate in the original pool revision, not treated as dispatched. Missing fate/quantity blocks closure, never zero."
      inputs:
        - m_attributed
        - N
        - cp_containment
        - cp_residual
      output: "q_mass"
      source_ids:
        - jrc-retail
        - ghg-product
    - id: calc_background
      applies_to: "failed_background; retail_service; supplier_transfer"
      rule: "For each original bag i retain actual receiving net sugar mass n_i, original consumer-bag and attributable source transport-case/film packaging BOM p_ij and complete supplier background P_i at the same gate, including documented inbound transport. B_F=sum(P_i for i in F), B_S=sum(P_i for i in S), B_T=sum(P_i for i in T), B_O=sum(P_i for i in O); these are background responsibilities, not kg sums. The count flow F/N is valid only for this one homogeneous actual bag/provider configuration; if lots have different original fills/BOM/backgrounds, sum actual lot-specific B_F/N, never replace with nominal-fill factors. Downstream adds B_S/N once and the fixed completion modules. Supplier transfers carry B_T intact; B_O blocks closed results. A broken parent background is not multiplied by waste carrier fractions, destination fractions or actual final moisture a second time."
      inputs:
        - n_i
        - p_ij
        - P_i
        - S
        - F
        - T
        - O
        - N
        - cp_goods
      output: "background_responsibility_and_coupling"
      source_ids:
        - ghg-product
  data_quality_requirements:
    - id: identity_completion
      applies_to: "all inventory rows"
      requirement: "All selected flows except electricity_input remain unverified specific candidates. Before any final dataset, verify actual manufacturer/SKU/state, flow type/direction, property/unit and receiving medium/recipient against original official flow/support responses and matching hashes; bind exact identity or retain unavailable status. A similar search hit is insufficient. Historical electricity evidence establishes only generic product-flow identity and MJ conversion, not a current supplier factor."
      evidence: "original official record/status/hash chain; supplier/recipient identity and scope; row-specific completion"
    - id: execution_quality
      applies_to: "all inventory rows"
      requirement: "Record all raw units, timestamp/ID, calibration, sample design and uncertainty; reconcile actual pool/stock/circuit/carriers. Missing values, unknown identity/material, unacknowledged transfer and unmeasured paths remain unresolved. Never import example values, source ranges, prices or estimates as defaults or compliance limits. Define and justify the measurement uncertainty and reconciliation tolerance from instrument/sampling evidence before judging residuals; do not force closure by assigning the residual to air or waste."
      evidence: "raw files and signed corrections; calibration/sampling uncertainty; balance and exception log"
    - id: completion_evidence
      applies_to: "retail_service"
      requirement: "Partial module completion and total-retail completion are distinct. The integrator documents every completion_modules item, actual occurrence/absence, named additional exchanges/protocols, fixed attribution method, source cohort/N and overlap removal. Unknown provider coverage blocks closure for its actual handover; missing common-store/capital/air modules block total-retail claims, not an honest explicitly partial report."
      evidence: "gate/cohort/row/provider matrix; actual completion measurements; unresolved list"
validation_rules:
  - rule_id: validate_reference
    applies_to: "retail_service; failed_background"
    rule: "Require one actual homogeneous bag configuration, original measured fill/BOM/background evidence, final qualification and return-closure records, N>0, no O or unresolved final residual fate. Check the count parent partition and separate gross handover/return stock equation; do not confuse nominal kg with measured content or count service."
    source_ids:
      - ghg-product
      - sugar-spec
  - rule_id: validate_exchange
    applies_to: "all inventory rows"
    rule: "Every used card has one actual identity, declared provider/recipient boundary, unit, linked real-process protocol, original raw quantity, one attribution and one division by N. Audit complete carriers/constituents, supplier transfers and background ownership for overlap. Unknown or incompatible material/route requires a specific new card and sync, never substitution into a similar flow."
    source_ids:
      - jrc-retail
      - ghg-product
  - rule_id: validate_disclosure
    applies_to: "retail_service"
    rule: "Label every output as this partial dry-stock module, state all exclusions and unverified rows, and require the fixed completion matrix plus B_S/N before any complete retail or goods-plus-retail use. Candidate markers and technical checks do not establish scientific approval, legal compliance, current supplier identity or publication readiness."
    source_ids:
      - ghg-product
      - jrc-retail
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only the declared partial dry-stock retail service for the exact single bag configuration, with source-period and responsibility context retained"
  allowed_use: "Add B_S/N original successful-goods backgrounds and all measured completion_modules once with the gate/cohort/N overlap matrix; retain failed-parent backgrounds already here"
  excluded_use: "Whole CPC leaf; cane sugar or other product/pack; total store retail without completion; sugar production flow; legal compliance or consumer waste forecast"
  required_metadata: "manufacturer and SKU; nominal size and measured original fill; original bag BOM and supplier background scope; factory closure and lot specification; actual receipt and final condition; store and period; dedicated-light meter boundary; prospective pool and return closure; original-parent fate IDs; residual recipients and treatment; completion-module matrix; unverified identities and uncertainty"
  required_quality_disclosure: "Partial boundary, original fill/BOM sampling, uncertainty, condition/return closure, provider scope, zero-output cohorts, late revisions, missing data and every unverified identity"
  update_trigger: "SKU/pack/construction/closure/source/route change; actual extra process; provider boundary or instrument change; new returns; receipt/fate correction; reviewed identity evidence"
data_sources:
  - id: "un-cpc"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, subclass 62125; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62125"
