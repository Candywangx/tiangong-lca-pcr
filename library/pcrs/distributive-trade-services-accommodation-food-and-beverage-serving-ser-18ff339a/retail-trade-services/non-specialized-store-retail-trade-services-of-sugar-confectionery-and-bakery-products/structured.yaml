    used_for: "Retail lighting, energy and waste scope context; no benchmark amounts, allocation fractions, compliance or full-retail completeness inferred"
  - id: "ghg-product"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapters6,7,9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Functional unit/reference flow, transparent boundaries and subdivision/causal allocation context. Specific parent, pool, partial-module and completion equations are this PCR design, not quoted requirements or a full standard-conformity claim"
