system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "retail_service"
      rule: "Apply only to the declared single intact factory-bag SKU and manual ambient route. Record actual receipt, stock, quarantine, handover, return and closure timestamps; do not equate sealed with vapor-impermeable. Current signed supplier/lot conditions govern acceptance; use cp_conditions to measure temperature and relative humidity throughout custody and inspect seal, caking, odor and contamination at receipt, daily holding review and every handover. No source numerical ranges or legal conformity are adopted as defaults."
      source_ids:
        - sugar-spec
        - sugar-products
    - rule_id: reference_ownership
      applies_to: "retail_service"
      rule: "N is the number of unique original parents finally qualified and retained for final use. Gross handovers H and physical returns C are separate events. Pure price refunds, credits and discounts without physical reversal do not reduce N only while final qualification and acceptance remain valid. An actual final acceptance revocation without return removes that parent from N and records the physically retained unqualified bag as U_keep. Return then resale of the same intact parent produces at most one final service. An externally retained unqualified intact bag is physically U_keep, not N or automatic waste; U_keep=F_keep+T_keep+O_keep partitions its original background responsibility, not additional physical handovers. Reopening an original period must revise its numerators, N and fate allocation together, never charge its complete burden again to a later pool."
      source_ids:
        - ghg-product
    - rule_id: goods_background
      applies_to: "failed_background"
      rule: "Each original bag is assigned exactly once to successful S, irrevocable failed F, continuing supplier/other-system transfer T, or open responsibility O. One broken bag retains one full original background regardless of the number of waste/recovery descendants; no allocation credit to recovered sugar. F includes destroyed originals and externally retained unqualified originals whose background remains with this service. T carries original production, pack and receipt-transport responsibility to a named supplier or other receiving system under signed acknowledgment; absent acknowledgment it remains O, not zero. T is a mutually exclusive original-background partition, never a count of all supplier handoff events. Independently record actual physical supplier handoffs T_supplier and retained unqualified U_keep, with recipient/state/event IDs. T_keep belongs to U_keep already; moving an externally retained parent from F_keep/O_keep to T_keep changes background ownership only, without a second physical output. A genuinely new outward object/state needs its own specific card. S backgrounds are excluded here and must be coupled once downstream as S/N original bags using their actual receiving net fill/BOM. Never substitute the nominal 1 kg for measured original fill or assume receipt mass equals final mass."
      source_ids:
        - ghg-product
    - rule_id: terminal_carriers
      applies_to: "whole_bag_waste; sweep_waste; recovered_sugar"
      rule: "Use actual whole-carrier net mass at each exclusive terminal handover. A complete failed bag includes its contained sugar and original packaging; do not add those constituents again as separate waste. After a real split, retain component/parent/fate IDs and weigh actual separated recovered sugar and actual whole sweep carrier, including any containment bag. Empty containment packaging is not also discarded separately. Record residual inventory at both ends and actual moisture/contamination changes; count balance is not a kg conservation assumption. Treatment and transport providers must declare included scope, destination, carrier composition and accepted unit; add named missing activities before completeness. Do not multiply an already destination-specific weighed amount by a destination fraction again."
      source_ids:
        - jrc-retail
        - ghg-product
    - rule_id: completion_modules
      applies_to: "retail_service"
      rule: "Before using this partial module in a total retail result, the integrator must assemble an exact gate/cohort/N responsibility matrix and separately measure: (1) premises manufacture/installation/maintenance/end-of-life and common HVAC, lighting and other utilities; (2) display shelf and dedicated luminaire manufacture/maintenance/end-of-life; (3) receiving/stock handling tools, pallets, trolleys and all loaded, empty return, repositioning and reserved/idle use; (4) checkout/POS, receipts and customer bags; (5) common sanitation, pest control, actual wet spill response, water/chemicals/whole effluent; (6) supplier-return, residual and other actual transport outside evidenced provider packages; (7) store-air/exterior transfers from sugar dust or moisture, with internal generation, retained/captured stocks and exclusive terminal carriers distinguished. These are excluded here, not assumed absent or zero. Complete these actual modules with named flows/protocols and the fixed methods in completion_method; an unresolved module blocks total-retail completeness."
      source_ids:
        - jrc-retail
        - ghg-product
    - rule_id: conditional_extension
      applies_to: "retail_service"
      rule: "Confirm occurrence/absence through floorplans, equipment and activity logs, invoices and incident records for every period. A different bag construction, carrier, chemical, on-site processing or unknown route cannot be hidden in an existing card. Add specific bilingual cards/protocols and regenerate before representing the affected activity as complete; preserve actual observations and uncertainty while unresolved."
      source_ids:
        - jrc-retail
