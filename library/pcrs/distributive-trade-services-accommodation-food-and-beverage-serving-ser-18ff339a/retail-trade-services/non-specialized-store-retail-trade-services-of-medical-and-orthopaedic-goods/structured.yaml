system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "retail; reverse; support"
      rule: "Apply only to an actual walk-in, mixed-assortment non-specialized store selling the declared adult aluminium axillary crutch configuration, one original complete pair per retail pack, at ambient conditions. Verify actual non-sterile supply and unopened factory condition from lot label and supplier declaration; the manufacturer sheet alone does not establish sterility. No opening, trial, handgrip/height adjustment, assembly, installation, prescription, fitting, rental, repair, disinfection, clinical use or home delivery is included. A youth model, single crutch, left/right-specific part, customized device, opened return or partly missing kit is a different configuration requiring a state-specific method/card and review before completeness. Do not infer clinical suitability, safety, legal approval or complete BOM/LCI from the sheet."
      source_ids:
        - un-cpc-62174
        - drive-rtl10400
    - rule_id: goods_ownership
      applies_to: "retail; failed_original; goods_inbound"
      rule: "At the actual retailer receiving gate assign each original supplier vector once to mutually exclusive S (eventually final-valid sold), F (retailer-responsible failed/lost original), T (named continuing recipient/internal asset owner) or O (still open stock or unresolved). Fractions sum1 per original vector, not per descendant waste carrier. S manufacture and original inbound transport are excluded from this incremental service and may be added once only by a separately declared downstream GOODS system; failed_original and goods_inbound explicitly include F manufacture/packaging and F original inbound. T carries the same original sources to the named owner, including supplier return; a movement or refund alone does not transfer responsibility. O is retained, never zero or silently F/S. Close/revise original cohorts when fate becomes known. An original whole-pack scalar is permitted only if both crutches, all factory attachments and the entire retail package have the same responsibility. If they differ, obtain supplier component inventory vectors with conserved source IDs and actual component amounts, create matching atomic input cards and remove those portions from whole-pack input; material mass fractions cannot split an environmental vector."
      source_ids:
        - ghg-product-standard
        - drive-rtl10400
    - rule_id: physical_states
      applies_to: "retail; reverse"
      rule: "Keep goods-only custody and held-waste ledgers separate. Use all gross customer handovers once, including never-accepted ones. Subsequent revocation with no movement reclassifies the original event, not a new physical exit. Condemnation moves goods to held waste internally and is not dispatch. Record unopened supplier returns, externally retained unaccepted packs, confirmed missing goods and signed unresolved residuals individually. None is automatically waste. Physically opened, damaged, broken or partial carriers require their own state-specific rows, recipient and matching treatment/background before completion; retain their actual measurements even if the narrow service denominator is unchanged. Only supplier_pack and external_retained_pack are non-characterized physical custody satellites; do not recursively add their original manufacture. rejected_pack and carton_waste are actual waste outputs requiring complete matched treatment and disjoint transport, never excluded as satellites. failed_original remains a characterized Product input for original F manufacture."
      source_ids:
        - ghg-product-standard
    - rule_id: route_evidence
      applies_to: "retail; reverse; support"
      rule: "Prospectively fix the store/configuration/reporting pool and observation cut-off. Include quiet, closed, refused, reversed, repeated and zero-sale intervals and associated resource use in the same pool; do not select only successful days. Q=distinct original pair-pack IDs with final-valid counter acceptance at cut-off. A revoked acceptance removes that ID even without return; do not subtract revocations again from this final-valid count. Financial-only discounts/refunds with valid acceptance do not remove it. One returned/resold original ID has one final service, while all repeated handling resources remain. Late evidence replaces original numerator and denominator versions with actual event dates; never shifts burdens to a new cohort merely because the adjustment is late. Q=0 leaves a retained unnormalizable pool, not a zero inventory."
      source_ids:
        - ghg-product-standard
    - rule_id: core_limits
      applies_to: "retail; reverse; support"
      rule: "The listed core is a partial incremental service inventory, not a complete store operation. Mandatory completion under complete_support supplies every actual supporting facility, cleaning/sanitation, staff welfare, capital, ICT/network, payment, security and administration source. Core electricity includes every actual on-site AC circuit in the audited store boundary; external modules exclude that same AC. Route eligibility requires signed asset/site/utility surveys showing no on-site combustion, gas/steam/purchased heat, refrigerant-containing equipment, batteries, merchandise demos, printing or added customer bags. If any exists, completeness is blocked until a reviewed explicit source-specific method and bilingual cards/protocols cover it; do not assign zero or invent an emission factor. Customer travel, post-handover clinical use/cleaning and end-of-life of S goods are outside this retail-service boundary and separately disclosed."
      source_ids:
        - jrc-retail-bemp
        - ghg-product-standard
    - rule_id: intact_waste
      applies_to: "rejected_pack"
      rule: "Rejected unopened original pack waste is one real complete mixed-product carrier: two aluminium crutches with actual tips/pads/handgrips/fasteners and retained original retail enclosure. It is not pure aluminium scrap or medical infectious waste by name. Require signed receiver acceptance of actual whole-carrier constituents and non-contaminated state, with complete matched transport/treatment scope and original consignment ID. Use directly weighed consignment net kg, not component kg plus the same whole pack. Weigh retained waste separately; dispatch kg is not corrected a second time by opening/closing stocks. No default recycling credit."
      source_ids:
        - drive-rtl10400
        - jrc-retail-bemp
    - rule_id: support_scope
      applies_to: "support"
      rule: "Mandatory support survey must locate the actual building shell, lighting/fan/fixed fixtures, storage shelf, checkout/scanner, network equipment, access/security equipment, remote payment/security/storage/admin backends, cleaning service and staff welfare. For each model separate manufacturing/installation, operation, repair events and terminal carrier/EOL scopes; building complete packages must explicitly include actual lighting/fans/fixed fixtures or those become separate lifetime modules. Premises and cleaning operational sources are measured actual AC (excluded if already core), supplied water, each exact formulated cleaner, reusable cloth/tool model, and each actual solid/liquid carrier. Water import is actual import-meter volume*density at recorded temperature, with no internal-reuse subtraction. Effluent uses mutually exclusive direct modes: actual discharge-meter volume*measured same-stream density, or calibrated net weighing of the same actual entire effluent carrier; no evaporation/stock/reuse deductions. Water and formulation-origin balances remain independent QA and cannot reconstruct or add to directly measured whole effluent. Cleaner formulation-origin kg partitions once among unused stock, actual use/discharge, spill, retained residue and dispatched-container residue; reused/intermediate states replace prior states, not additional use. Wet cloth/container/rinsate whole kg differs from formulation-origin kg. Tools/cloths use asset_lifetime with cleaned-area m2 exposure, buildings m2*h, shelf m3*h, electronics h; actual repairs and terminal carriers are event-based and follow historical fractions. Actual mixed wastes require signed constituent/state acceptance and matched treatment. Acquisition/use/retirement stock checks never add manufacture beside a lifetime package. Transport at each source remains under transport_ownership. Collect each actual flow specifically; unknown or unbound identities/quantities/provider scopes remain blocking, not generic utility/waste selector rows."
      source_ids:
        - jrc-retail-bemp
        - ghg-product-standard
