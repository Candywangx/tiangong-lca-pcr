allocation_rules:
  - rule_id: electricity_pools
    applies_to: "retail_ac"
    rule: "First subdivide actual circuit MJ sources into disjoint active, idle and fixed pools, whose sum reconciles to the store import meter. Subtract a submeter only when the parent includes it; independent disjoint meters need no subtraction. Active checkout/handling MJ uses measured SKU-line staff/device active seconds, including failures; idle reserved checkout MJ uses measured reserved terminal-seconds; lighting/ventilation/fixed MJ uses measured dedicated display/storage/support floor-area*time in m2*h across all beneficiaries, with common access area assigned by their dedicated m2*h shares. Never sum seconds and m2*h into one driver. Within each pool source c allocate X_c*d_c_h/sum_all_h(d_c_h), then sum compatible MJ only. Retain closed/idle intervals; all-beneficiary driver coverage must be known and positive, otherwise the attribution remains unresolved. No revenue, nominal rated power or successful-sales default."
    source_ids:
      - ghg-product-standard
      - jrc-retail-bemp
  - rule_id: asset_lifetime
    applies_to: "support"
    rule: "For each actual homogeneous asset/model/BOM/scope vector V_a, use measured beneficiary exposure e_a_h in its own unit and expected whole-life exposure L_a in that same unit: f_a_h=e_a_h/L_a. Keep one persistent all-period/all-beneficiary ledger, cumulative provisional shares <=1, including idle reservations and closed intervals. At actual retirement replace EVERY historical share by f_final_a_h=e_actual_a_h/E_a where E_a=sum_all_h(e_actual_a_h), with E_a positive/known; do not merely charge a residual to the last pool. Each revised source and historical beneficiary has delta_a_h=f_new_a_h*V_new_a-f_old_a_h*V_old_a; replace old records and preserve both versions. Same equation applies to actual model-specific manufacture/installation, independent repair events and independent terminal carriers/transport using that asset exposure history; never multiply terminal carrier by another manufacturing fraction. Whole-device actual net retirement weighing already excludes removed parts; component-BOM reconstruction is an exclusive alternative. A complete package evidenced to include maintenance/transport/end-of-life excludes those outside modules. No sum of heterogeneous models as one Item(s), no full re-acquisition after a life estimate change."
    source_ids:
      - ghg-product-standard
  - rule_id: transport_ownership
    applies_to: "goods_inbound; service_transport; support"
    rule: "Use trip/segment source -> actual consignment/asset/material -> original responsibility and beneficiary pool as separate attribution levels. This route uses actual road-lorry complete-operation vehicle-km providers; require signed scope covering actual fuel/vehicle operation and declared upstream/vehicle capital, and identify included empty and stationary idle events. This volume-driven route is eligible only with actual lorry volume-limiting load evidence or an actual reserved-volume capacity contract reconciled to cargo space; unknown or mass-limited trips require a reviewed matching driver method before completeness. Loaded trip source vehicle-km allocates by measured occupied cargo m3*segment-km across all real consignments; empty repositioning source vehicle-km allocates by measured reserved m3*empty-km to the causing consignments; stationary idle source operation is allocated by reserved m3*idle-hours within its own time source, never summed with distance. If the provider vehicle-km does not include actual stationary fuel, add a separately measured actual fuel/idle-time operation module, without duplicate source scope. Unknown empty/idle provider coverage blocks completeness. Goods receipt sources then follow S/F/T/O; goods_inbound includes F only. Reverse service trips are attributed to original service pools, not re-multiplied by F. Independent capital/repair/end-of-life transport belongs first to that asset and follows asset_lifetime historical fractions. Provider already assigned to consignment skips repeat trip allocation only; only an amount already assigned to exact original responsibility/pool/version skips the owner fraction. Different provider IDs do not prove activity is disjoint."
    source_ids:
      - ghg-product-standard
  - rule_id: support_drivers
    applies_to: "support"
    rule: "Apply complete_support to actual external service sources separately: premises/fixtures use m2*h; shelf use actual reserved shelf envelope m3*h; checkout terminal/scanner use active seconds and separately reserved idle seconds; staff administration/welfare use recorded task staff-hours including failed work; access control uses protected-zone m2*h; security capture/storage uses actual camera capture seconds assigned by protected-zone m2*h at original capture time, then retained GB*h preserves that original beneficiary map. GB=10^9 bytes, GiB=2^30 bytes; use actual byte/time integrals. Network unique connection-interval source-hours allocate by recorded reserved endpoint-connection-seconds across all beneficiaries; active packet processing uses actual byte counts in a separate source pool; neither repeats on-site AC. Payment actual unique attempts use measured basket line processing-seconds shares summing1 per attempt, including declines/reversals; one multi-SKU authorization is never wholly assigned to each SKU. Remote administration uses actual processing task-seconds; split independent fixed backend capacity by reserved processing-seconds. All totals reconcile to actual complete service sources across all beneficiaries; identify original source/pool/version and retain idle/zero-sale periods. Cleaning operational source jobs allocate by actual cleaned-area m2 across all beneficiaries of that same job; all job drivers are measured and sum to the provider original job area, not later sales. No fictitious SKU-exclusive camera bytes, no duplicate network intervals or sums of unlike drivers."
    source_ids:
      - ghg-product-standard
      - jrc-retail-bemp
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "retail"
      flow_role: "retail_service"
      record_type: "acceptance_ledger"
      raw_fields: "original_id; SKU; model; pair_count; actual_package_BOM; factory_seal; sterility_declaration; size; left_right_configuration; event_id; event_time; gross_handover; physical_return; acceptance_status; final_valid_original_ids; cut_off; original_pool_id; version"
      collection_method: "Link POS handover and supplier receiving IDs; inspect external labels without opening; match original pair/configuration and acceptance/return history each event. Count final-valid distinct IDs, not transaction count; record failed and reversed events too."
      unit: "Item(s)"
      frequency: "each event and cut-off"
      temporal_coverage: "all original cohorts including late returns"
      site_scope: "same mixed store/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed acceptance/fate; supplier label/BOM; audit trail"
    - protocol_id: cp_original
      process_id: "retail"
      flow_role: "failed_original"
      record_type: "original_source_ledger"
      raw_fields: "N_j; f_F_j; V_j; original_id; source_id; S; F; T; O; component_vector_mode; complete_BOM; retail_enclosure; supplier_gate; source_version; G_open; receipt_count; customer_return_count; gross_customer_handover_count; supplier_handoff_count; internal_transfer_count; condemnation_count; confirmed_missing_count; signed_goods_residual"
      collection_method: "For every receiving lot count actual intact pair packs and audit supplier complete package source inventory; keep original source-vector responsibility and typed goods custody equation. No nominal net mass, material percentage or spec sheet substitutes for actual source vector."
      unit: "Item(s)"
      frequency: "every receipt/fate change"
      temporal_coverage: "full source history"
      site_scope: "same receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier primary LCI/BOM and signed receiver responsibility"
    - protocol_id: cp_ac
      process_id: "retail"
      flow_role: "retail_ac"
      record_type: "meter_and_activity_ledger"
      raw_fields: "X_c; d_c_h; D_c; source_class; meter_topology; meter_unit; meter_id; interval_start; interval_end; reading_start; reading_end; calibration; active_seconds; reserved_idle_seconds; dedicated_area_m2; interval_h; all_beneficiary_ids; original_source_id; pool_id; version"
      collection_method: "Read calibrated import/submeters each interval and map circuit nesting; synchronize POS/task seconds and measured occupied area/time across all store goods. Integrate actual closed/idle intervals. Derive disjoint MJ sources and separate same-unit drivers under electricity_pools."
      unit: "MJ"
      frequency: "each metering interval"
      temporal_coverage: "complete pool including closed/idle"
      site_scope: "all AC at audited site gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/topology; supplier delivery geography/voltage/mix"
    - protocol_id: cp_transport_in
      process_id: "retail"
      flow_role: "goods_inbound"
      record_type: "trip_source_ledger"
      raw_fields: "trip_id; segment_id; source_id; actual_vehicle_km; volume_limited_evidence; reserved_volume_contract; actual_capacity_m3; occupied_cargo_m3; segment_km; reserved_empty_m3; empty_km; reserved_idle_m3; idle_hours; actual_idle_fuel; provider_scope; attribution_level; T_original_j; f_F_j; T_service_original_pool; consignment_id; owner_id; original_pool_id; version"
      collection_method: "Measure actual route/segment distances, cargo dimensions and idle reservations for all consignments; verify provider original denominator, empty/idle and lifecycle scope. The two protocol views share original trip IDs but partition event/owner scopes; never duplicate trip or owner allocation."
      unit: "vehicle*km"
      frequency: "every trip/segment"
      temporal_coverage: "all relevant inbound/reverse and zero-sale events"
      site_scope: "actual road routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "route logs; signed provider scope; all-beneficiary capacity/time reconciliation"
    - protocol_id: cp_transport_reverse
      process_id: "reverse"
      flow_role: "service_transport"
      record_type: "trip_source_ledger"
      raw_fields: "trip_id; segment_id; source_id; actual_vehicle_km; volume_limited_evidence; reserved_volume_contract; actual_capacity_m3; occupied_cargo_m3; segment_km; reserved_empty_m3; empty_km; reserved_idle_m3; idle_hours; actual_idle_fuel; provider_scope; attribution_level; T_original_j; f_F_j; T_service_original_pool; consignment_id; owner_id; original_pool_id; version"
      collection_method: "Measure actual route/segment distances, cargo dimensions and idle reservations for all consignments; verify provider original denominator, empty/idle and lifecycle scope. The two protocol views share original trip IDs but partition event/owner scopes; never duplicate trip or owner allocation."
      unit: "vehicle*km"
      frequency: "every trip/segment"
      temporal_coverage: "all relevant inbound/reverse and zero-sale events"
      site_scope: "actual road routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "route logs; signed provider scope; all-beneficiary capacity/time reconciliation"
    - protocol_id: cp_reverse
      process_id: "reverse"
      flow_role: "supplier_pack; external_retained_pack"
      record_type: "custody_event_view"
      raw_fields: "event_id; original_id; event_time; original_pool_id; recipient_id; intact_unopened_state; actual_unopened_supplier_handoff_count; actual_unaccepted_unopened_external_retention_count; acceptance_status; S; F; T; O; responsible_owner; G_open; receipt_count; customer_return_count; gross_customer_handover_count; supplier_handoff_count; internal_transfer_count; condemnation_count; confirmed_missing_count; signed_goods_residual; version"
      collection_method: "Use same original custody records as cp_original; obtain signed receiver and actual unopened/state evidence without double-recording handover. Reconcile goods count independently of final-valid Q and held-waste kg."
      unit: "Item(s)"
      frequency: "each event and close"
      temporal_coverage: "all return/retention histories"
      site_scope: "store and named external recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "receiver sign-off and fate ownership; no unexplained residual"
    - protocol_id: cp_waste
      process_id: "reverse"
      flow_role: "rejected_pack"
      record_type: "whole_carrier_dispatch"
      raw_fields: "event_id; original_id; consignment_id; receiver_id; whole_carrier_BOM; non_contaminated_state; calibration; gross_kg; tare_kg; direct_dispatched_net_kg; dispatched_net_kg; W_open; condemned_kg; condemnation_count; other_actual_waste_receipt_kg; confirmed_missing_waste_kg; signed_waste_residual_kg; W_close; transport_treatment_scope; version"
      collection_method: "Calibrated tare/gross weigh each actual unopened complete-pack consignment at dispatch; independently weigh retained held waste and link condemnation count/kg by event ID. Confirm actual complete composition/state acceptance and provider treatment; no inferred infectious classification."
      unit: "kg"
      frequency: "each condemnation/dispatch and close"
      temporal_coverage: "all held waste and later dispatch"
      site_scope: "store-to-receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; signed actual acceptance; complete treatment manifest"
    - protocol_id: cp_carton
      process_id: "retail"
      flow_role: "outer_carton"
      record_type: "case_first_use_dispatch_ledger"
      raw_fields: "carton_source_id; original_pack_ids; actual_case_BOM; first_use_carton_kg; packing_volume_share; unused_carton_stock_kg; used_carton_stock_kg; carton_dispatch_net_kg; carton_handover_kg; carton_missing_kg; signed_carton_residual_kg; calibration; actual_closure_label_adhesive; transport_scope; receiver_acceptance; original_pool_id; version"
      collection_method: "At case first unpacking weigh actual separate complete case and verify supplier BOM/source boundary; record real pack-volume shares and receiving transport. Track unused/used stock separately and directly weigh actual waste consignments; these views share case IDs with no duplicate source assignment."
      unit: "kg"
      frequency: "each first use/dispatch and close"
      temporal_coverage: "all case cycles and retained reuse stock"
      site_scope: "receiving/store/reverse gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/BOM; transport exclusions; signed receiver; stock reconciliation"
    - protocol_id: cp_carton_reverse
      process_id: "reverse"
      flow_role: "carton_waste"
      record_type: "case_first_use_dispatch_ledger"
      raw_fields: "carton_source_id; original_pack_ids; actual_case_BOM; first_use_carton_kg; packing_volume_share; unused_carton_stock_kg; used_carton_stock_kg; carton_dispatch_net_kg; carton_handover_kg; carton_missing_kg; signed_carton_residual_kg; calibration; actual_closure_label_adhesive; transport_scope; receiver_acceptance; original_pool_id; version"
      collection_method: "At case first unpacking weigh actual separate complete case and verify supplier BOM/source boundary; record real pack-volume shares and receiving transport. Track unused/used stock separately and directly weigh actual waste consignments; these views share case IDs with no duplicate source assignment."
      unit: "kg"
      frequency: "each first use/dispatch and close"
      temporal_coverage: "all case cycles and retained reuse stock"
      site_scope: "receiving/store/reverse gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/BOM; transport exclusions; signed receiver; stock reconciliation"
    - protocol_id: cp_support
      process_id: "support"
      flow_role: "complete_support"
      record_type: "mandatory_source_register"
      raw_fields: "module_id; constituent_list; original_source_id; original_pool_id; version; provider_boundary; attribution_level; b_m; z_m; X_m; d_c_h; D_c; e_a_h; L_a; E_a; f_old_a_h; f_new_a_h; V_old_a; V_new_a; core_raw_k; disjoint_attributed_raw_m_k; exchange_key_k; task_staff_hours; dedicated_area_m2_h; shelf_envelope_m3_h; active_seconds; reserved_idle_seconds; payment_attempt_id; basket_line_processing_seconds; protected_zone_m2_h; camera_capture_seconds; capture_period_map; retained_bytes_h; unique_connection_intervals; connection_hours; processing_bytes; remote_task_seconds; water_import_m3; water_density; water_temperature; discharge_m3; discharge_density; effluent_mode; effluent_direct_net_kg; formulation_received_kg; formulation_history_start; formulation_history_end; formulation_open_unused_kg; formulation_close_unused_kg; formulation_actual_discharge_kg; formulation_spill_kg; formulation_retained_residue_kg; formulation_dispatched_container_residue_kg; formulation_signed_residual_kg; wet_carrier_kg; cleaned_area_m2; actual_model_BOM; repair_event_id; terminal_net_kg; lifecycle_exclusions; Q"
      collection_method: "Survey every actual support resource and signed absence at site and provider; measure source quantity at its actual gate, calibrate meters/scales and synchronize full interval logs. Complete support_scope, support_drivers, asset_lifetime and transport_ownership; audit every actual contract constituent against the deduplication register before restoring original denominators. Each actual atomic row gets one process-scoped protocol view over this same ledger, avoiding duplicate measurement/normalization."
      unit: "native source units separately"
      frequency: "every source event/interval and historical revision"
      temporal_coverage: "whole pool and complete asset history"
      site_scope: "all actual supporting sites/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed exact scope/absence; calibrated readings; full source-ID and history reconciliation"
  calculation_rules:
    - id: acceptance
      applies_to: "retail_service"
      rule: "Q=count_distinct(final_valid_original_ids). Keep final acceptance status separate from all gross handover/return events. For Q>0 service output is exactly1 Item(s); for Q=0 retain raw pool and block normalization."
      inputs:
        - final_valid_original_ids
        - acceptance_status
        - cut_off
        - original_pool_id
        - event_id
      output: "Q; retail_service"
      source_ids:
        - ghg-product-standard
    - id: custody
      applies_to: "retail; reverse"
      rule: "Goods counts: G_close=G_open+receipt_count+customer_return_count-gross_customer_handover_count-supplier_handoff_count-internal_transfer_count-condemnation_count-confirmed_missing_count+signed_goods_residual. Gross handover includes never-accepted events once. Held waste kg: W_close=W_open+condemned_kg+other_actual_waste_receipt_kg-dispatched_net_kg-confirmed_missing_waste_kg+signed_waste_residual_kg. Link measured condemned_kg and condemnation_count by event IDs; do not convert count to kg with a nominal weight. Residuals remain signed unresolved quantities under investigation, never confirmed losses by default."
      inputs:
        - G_open
        - receipt_count
        - customer_return_count
        - gross_customer_handover_count
        - supplier_handoff_count
        - internal_transfer_count
        - condemnation_count
        - confirmed_missing_count
        - signed_goods_residual
        - W_open
        - condemned_kg
        - other_actual_waste_receipt_kg
        - dispatched_net_kg
        - confirmed_missing_waste_kg
        - signed_waste_residual_kg
        - event_id
      output: "G_close; W_close"
      source_ids:
        - ghg-product-standard
    - id: original_f
      applies_to: "failed_original; goods_inbound"
      rule: "For original source j retain actual whole-pack receiving count N_j and matched complete supplier manufacture/retail-pack vector V_j. N_F=sum_j(N_j*f_F_j), with S/F/T/O source partition conserved. failed_original=N_F/Q Item(s), each homogeneous original vector linked once; do not use primary catalogue specifications as V_j. goods_inbound=sum_j(T_original_j*f_F_j)/Q vehicle-km after transport_ownership trip-to-consignment allocation; original manufacture and original inbound retain the same ownership. No new original burden on intact resold returns. Wholepack and component-vector modes are exclusive under goods_ownership."
      inputs:
        - N_j
        - f_F_j
        - V_j
        - T_original_j
        - source_id
        - original_id
        - attribution_level
        - Q
      output: "N_F; failed_original; goods_inbound"
      source_ids:
        - ghg-product-standard
    - id: ac_total
      applies_to: "retail_ac"
      rule: "retail_ac=sum_c(X_c*d_c_h/D_c)/Q MJ; D_c=sum_all_h(d_c_h) with each c a same-unit electricity source/driver class under electricity_pools. Measured kWh converts to MJ by3.6 once. Parent/submeter topology and active/idle/fixed source sums reconcile; do not treat rated capacity as measured consumption."
      inputs:
        - X_c
        - d_c_h
        - D_c
        - meter_topology
        - source_class
        - meter_unit
        - Q
      output: "retail_ac"
      source_ids:
        - ghg-product-standard
    - id: reverse_totals
      applies_to: "supplier_pack; external_retained_pack; rejected_pack; service_transport; outer_carton; carton_waste"
      rule: "Use supplier_pack=actual_unopened_supplier_handoff_count/Q and external_retained_pack=actual_unaccepted_unopened_external_retention_count/Q as disjoint physical satellites. rejected_pack=direct_dispatched_net_kg/Q kg; receiver weighed dispatch is direct and stocks are QA only. service_transport=T_service_original_pool/Q vehicle-km following transport_ownership. outer_carton=first_use_carton_kg/Q; allocate each actual upstream corrugated case manufacture/inbound source to its contained original packs by measured occupied packing volume shares, then to original service pool at first unpacking; actual unused cartons retain unassigned source, reused cartons never reacquire it. Used/unused carton stock and actual handover/waste/missing outputs reconcile separately. Carton dispatch is direct actual net kg/Q on carton_waste and never a second manufacturing allocation."
      inputs:
        - actual_unopened_supplier_handoff_count
        - actual_unaccepted_unopened_external_retention_count
        - direct_dispatched_net_kg
        - T_service_original_pool
        - first_use_carton_kg
        - packing_volume_share
        - carton_source_id
        - unused_carton_stock_kg
        - used_carton_stock_kg
        - carton_dispatch_net_kg
        - carton_handover_kg
        - carton_missing_kg
        - Q
      output: "supplier_pack; external_retained_pack; rejected_pack; service_transport; outer_carton; carton_waste"
      source_ids:
        - ghg-product-standard
    - id: complete_support
      applies_to: "support"
      rule: "Create a disjoint measured-source register before any complete-service claim. Each actual support module must return atomic exchange numerators, exact original denominator b_m, original pool/site/time/version, source IDs, complete actual constituent/activity list, same-property/unit amounts and provider lifecycle exclusions. For a normalized module z_m restore raw source X_m=z_m*b_m; for raw data X_m is already raw. Apply support_drivers and asset_lifetime once at the missing attribution level. For each compatible exchange key k=(flow identity, direction/type, state/medium, property, unit, provider boundary), full_amount_k=(core_raw_k+sum_m(disjoint_attributed_raw_m_k))/Q. core_raw includes actual F originals, F inbound, AC, reverse and carton sources once. Add only compatible numerators, never kg+MJ, Item(s)+kg or raw+normalized. Deduplicate by actual source event/asset/time/lifecycle constituent, not merely provider ID. Same-contract packages may remain intact only when actual complete constituent list, one real measured denominator and signed exclusions prove whole-package coverage with no overlap. Otherwise subdivide and add specific atomic bilingual cards/protocols before completeness; an internet-access invoice does not cover payment/security/admin backends. Any missing original denominator, unknown resource, overlap or incomplete module blocks complete-service status."
      inputs:
        - b_m
        - z_m
        - X_m
        - d_c_h
        - D_c
        - e_a_h
        - L_a
        - E_a
        - f_old_a_h
        - f_new_a_h
        - V_old_a
        - V_new_a
        - core_raw_k
        - disjoint_attributed_raw_m_k
        - exchange_key_k
        - original_source_id
        - original_pool_id
        - version
        - Q
      output: "full_amount_k; delta_a_h"
      source_ids:
        - ghg-product-standard
        - jrc-retail-bemp
    - id: support_quantity_modes
      applies_to: "support"
      rule: "Water kg=water_import_m3*water_density at actual water_temperature. Effluent kg=discharge_m3*discharge_density OR effluent_direct_net_kg under one declared effluent_mode; no summing modes. Cleaner original-source conservation is formulation_open_unused_kg+formulation_received_kg=formulation_close_unused_kg+formulation_actual_discharge_kg+formulation_spill_kg+formulation_retained_residue_kg+formulation_dispatched_container_residue_kg+formulation_signed_residual_kg. This is cumulative from each formulation original-source receiving gate, not a new period-consumption equation; pre-existing already-used/residue stock carries the original full history and reuse replaces its destination. All destinations are mutually exclusive original-formulation kg, exclude added rinse water/dirt, and share original IDs; wet_carrier_kg is separately directly measured, never source-formulation kg or subtracted again. Whole measured carrier treatment enters once; retained container residue is not dispatched-container residue. Raw original support source numerators then follow complete_support."
      inputs:
        - water_import_m3
        - water_density
        - water_temperature
        - discharge_m3
        - discharge_density
        - effluent_mode
        - effluent_direct_net_kg
        - formulation_open_unused_kg
        - formulation_received_kg
        - formulation_close_unused_kg
        - formulation_actual_discharge_kg
        - formulation_spill_kg
        - formulation_retained_residue_kg
        - formulation_dispatched_container_residue_kg
        - formulation_signed_residual_kg
        - wet_carrier_kg
        - original_source_id
      output: "actual_water_kg; actual_effluent_kg; formulation_balance"
      source_ids:
        - jrc-retail-bemp
        - ghg-product-standard
  data_quality_requirements:
    - id: primary_identity
      applies_to: "retail_service; failed_original"
      requirement: "Check actual adult model, unopened pair, complete accessories/enclosure and actual non-sterile supply. Retain conflicts against manufacturer edition and original lot, no catalogue-weight default or material-vector split."
      evidence: "lot label; signed supplier BOM/LCI; actual gate/quantity"
    - id: measurement_coverage
      applies_to: "all inventory rows"
      requirement: "Calibrate actual meters/scales and retain clock alignment, precision/uncertainty, full time coverage and all-beneficiary totals. Compare direct and reconstructed modes only as independent QA, never sum both."
      evidence: "calibration; topology; raw unedited interval/event records"
    - id: complete_provider_scope
      applies_to: "support; reverse"
      requirement: "Signed actual source packages and receiver acceptance list complete constituents, one denominator, gate/lifecycle inclusions/exclusions and allocation level; supplier IDs alone do not prove disjointness. Disclose all unresolved identities/quantities and partial core status."
      evidence: "source register; actual contract/model/BOM; receiver manifests; disjointness audit"
validation_rules:
  - rule_id: identity_gate
    applies_to: "all inventory rows"
    rule: "Unresolved UUIDs are row-specific and never substituted by a property UUID. Before dataset completeness verify direct official flow original/receipt, exact observed state/date/hash, bilingual name, type, state/medium, property/unit chain and actual provider match. Historical verification is not a live read. retail_service must bind an actual service identity, never merchandise production."
    source_ids:
      - ghg-product-standard
  - rule_id: finite_quantity
    applies_to: "all inventory rows"
    rule: "Require Q>0, full original event/source history, all applicable card quantities, independent goods/waste/case balances and signed explanation of residuals. Unknown quantities/recipients/provider scope never mean zero. Final card basis kind is reference_flow for every normalized exchange. Do not add item count and kg, or normalize twice."
    source_ids:
      - ghg-product-standard
  - rule_id: coverage_gate
    applies_to: "support; retail; reverse"
    rule: "A complete-service dataset passes scope_gate/core_limits and fully executes complete_support, including actual facilities, ICT/payment/security/admin, cleaning/welfare and all necessary capital/transport scopes. Each added actual source has a specific atomic bilingual card, actual process/protocol role, raw inputs and matched provider before completeness. Evidence of absence is allowed only for truly absent source, not missing measurement. Partial core output must retain partial disclosure and cannot be offered as full retail service. All mandatory EN/ZH methods/card conditions must appear in supported projection fields and agree substantively."
    source_ids:
      - jrc-retail-bemp
      - ghg-product-standard
  - rule_id: source_conservation
    applies_to: "failed_original; goods_inbound; support; reverse"
    rule: "Audit S/F/T/O conservation and actual F Product input against original manufacture and inbound sources, exclusive wholepack/component mode, and source/event/asset/time/lifecycle deduplication. Physical satellite outputs carry no second manufacture or automatic credits. Asset retirement/life/supplier changes replace every historical f*V allocation; original cohort late return revisions replace old numerator/Q, with original/adjustment dates. Failed/zero-sale pools and all unnormalizable Q=0 records remain visible."
    source_ids:
      - ghg-product-standard
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Incremental unopened adult crutch-pair counter retail service; GOODS system may add S original manufacture/inbound once with owner/source linkage."
  allowed_use: "Same homogeneous actual configuration, channel and explicit partial/completed boundary after applicability review."
  excluded_use: "Clinical care/fitting advice, safety/compliance approval, whole medical leaf, specialized retail, use/EOL of sold goods, or full-service claims from partial core."
  required_metadata: "Required qualifiers; original source/pool/version/gates; Q; S/F/T/O; supplier vectors; actual support constituents/denominators; providers; allocation levels; asset history."
  required_quality_disclosure: "All unbound identities, uncertainty, partial core status, missing modules/receivers/BOM and unnormalizable pools; no unknown-as-zero."
  update_trigger: "Model/package/state/channel change; actual returns/fate/source revision; asset life/retirement; provider scope or support-source change; new primary evidence."
data_sources:
  - id: "un-cpc-62174"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version3.0, subclass62174 explanatory note, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62174"
    used_for: "Non-specialized store trade of group481 medical/surgical equipment and orthopaedic appliances; classification context only, not authority for this whole-leaf methodology."
  - id: "drive-rtl10400"
    type: "handbook"
    reference: "Drive DeVilbiss Healthcare, Retail Packaged Aluminum Crutches with Accessories, RTL10400 manufacturer specification, https://shop.drivemedical.com/us/en/products/mobility/crutches/underarm/retail-packaged-aluminum-crutches-with-accessories/p/RTL10400/downloadPdf"
    used_for: "Actual adult pair product identity and original complete-device route; not actual lot net mass, complete material BOM, LCI, sterility, clinical advice or regulatory/safety approval. Tall RTL10402 is excluded."
  - id: "ghg-product-standard"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapters6-9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Unit of analysis, boundary/process subdivision and physical allocation principles. Specific equations and partial-service responsibilities are PCR design choices; no complete-standard conformity or numerical default is claimed."
  - id: "jrc-retail-bemp"
    type: "official_guidance"
