  classification_refs: "CPC 3.0 62114; narrower"
  covered_products: "On-site retail service for weaned domestic guinea pigs (Cavia porcellus) in a non-specialized store, using dry hay, vitamin-C-fortified pellets and wood-shaving litter; customer collection."
  excluded_products: "Other species, animal breeding, wholesale, specialist pet stores, slaughter, long-term boarding, home delivery, on-site pharmaceutical treatment, fresh-produce feeding, combustion heating and refrigerant cooling; an actual different route needs a separately reviewed inventory extension."
  representative_product: "Retail handover services for weaned domestic guinea pigs; actual supplier, SKU/configuration, lot and complete original BOM verified separately for each homogeneous stratum."
  production_route: "Reception and identity checks; temporary dry-feed holding, feeding and care; cleaned reusable housing with fans/resistance heating where needed; purchaser suitability check and care information; accepted collection and return-window closure."
  market_state: "Live, weaned, identified, fit for transfer under applicable local requirements; no numerical age, weight, residence duration or welfare compliance is assumed."
functional_unit:
  what: "Retail selection, temporary custody, care, purchaser information and accepted on-site handover of one identified weaned domestic guinea pig."
  how_much: "1 completed retail handover service; N is the number of final non-reversed accepted individual-animal handovers in a closed preregistered accounting pool."
  how_well: "Traceable acquisition and health observations; suitable housing, feed/water, documented buyer information and signed acceptance. Failed or refused sales are not output."
  how_long_or_cycle: "From recorded in-store receipt to final disposition and expiry of the declared return window for every animal of the cohort; all custody intervals and repeat attempts included."
  reference_flow_link: "retail_service"
system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope
      applies_to: "all processes"
      rule: "Include receipt checks, every holding day including weekends, care, hygiene, enclosure wear, attributed store utilities, final handover and post-return repeat care through cohort closure. Animal reproduction and successful animals upstream production are outside this incremental retail-service boundary; retain their product links."
      source_ids: []
    - rule_id: loss_background
      applies_to: "animal background responsibility"
      rule: "Allocate upstream production of dead or irrecoverably lost acquired animals to loss_animal input L / N. Link N successful animals separately in the downstream animal-plus-retail system, exactly once each, with their upstream production and delivery through signed in-store receipt. For L, use a delivered-animal background including that delivery once; if its producer dataset ends earlier, attach the missing transport within that background before linking loss_animal. Intact supplier returns retain their product background with the identified supplier; prove continuing responsibility and include all store custody and return-operation burdens here. Unknown disappearance is unresolved L, never zero."
      source_ids: []
    - rule_id: exclusions
      applies_to: "gate and supporting datasets"
      rule: "Supplier-to-store animal delivery before signed receipt is part of the separately linked delivered-animal background (including L under loss_background), while customer travel/use and final pet end-of-life are outside this store-gate operating service and must be disclosed and linked separately when the downstream study includes them. Consumable production, enclosure manufacture and treatment after waste handover require compatible upstream/downstream datasets; actual treatment emissions are not also store emissions. Building construction and employee commuting are excluded and disclosed, not claimed negligible."
      source_ids: []
    - rule_id: route_check
      applies_to: "conditional activities"
      rule: "Record daily care and environment checks, feeding, hygiene, buyer information and animal register under the process-scoped cp_custody/cp_custody_handover and cp_material/cp_material_hygiene/cp_material_handover views. Defra supports the activity list for England; actual local welfare duties and enclosure/temperature/feed requirements must be checked for the site. This PCR supplies no universal welfare thresholds or feeding amounts. Absence of veterinary visits, transport or deaths requires reconciled event logs; a missing log is unknown. New medicines, food types, fuels, refrigerants, disinfectants or waste pathways outside listed cards block use until individually extended and reviewed."
      source_ids:
        - defra-pet-sale-2026
    - rule_id: failed_external
      applies_to: "physical disposition versus commercial reversal"
      rule: "Maintain separate physical-return and commercial-refund events. N is determined by final qualifying acceptance, not money received. A pure price concession, goodwill refund or other financial adjustment with contractual acceptance still valid does not alter physical disposition or N. Final F requires actual cancellation/revocation of acceptance or a genuinely nonqualifying external handover, with the animal demonstrably retained by an identified external recipient; F is not a service output N, a supplier return R, a death or an automatic carcass. Require signed retained-custody evidence and assign its delivered-animal production background exactly once to that recipient product system regardless of price; unresolved responsibility blocks closure. Include its failed service operating burden in the preregistered pool. Final L comprises actual deaths D plus irrecoverably lost acquired animals M; only documented D can create carcass waste. A physically returned animal is not terminal F: preserve its one individual history through quarantine, repeated care, refund and resale and assign one final disposition."
      source_ids: []
    - rule_id: partial_boundary
      applies_to: "incremental boundary and life-cycle completion"
      rule: "This is a partial incremental store-operation service inventory, not a complete retail life-cycle footprint or GHG Product Standard conformity claim. Till electricity is included as an operating utility share; building construction, store/till/IT capital manufacture, their maintenance/end-of-life and employee commuting remain excluded without claiming insignificance. A complete retail study must separately inventory these missing responsibilities using actual asset lifetime/use ledgers and allocated whole-store area-/operating-hours, link manufacture, replacement, maintenance and disposal once, reconcile with enclosure and utility coverage, and review the extended boundary. Retain successful and F recipient animal backgrounds, pre-gate delivery, customer travel/use, carrier disposal and pet end-of-life in the linked product system at their stated gates. Report partial results separately until these duties and any jurisdiction-specific attributable activities are assessed and supplied."
      source_ids: []
    - rule_id: gas_screen
      applies_to: "all store emissions and speciation"
      rule: "Screen actual housing, wet litter, drains, disinfectant use, stock and all equipment for other relevant emissions, including nitrous oxide and any refrigerant or combustion gases. Use a documented source-pathway/species matrix, actual operating/waste conditions and representative multi-gas monitoring or original source-specific emission evidence; non-detection needs detection limits and coverage. A plausible or observed unlisted substance requires its own species/air-or-water-medium card, measurement protocol, bilingual rule and regenerated projection before completeness; do not invent its UUID or assert zero. Existing concentration units mg/m3 mean mass of the named molecule, never N-, C- or CO2-equivalent. Instruments reporting N/C equivalents require an explicit traceable molecular-mass conversion and independent check before integration. Calibrate zero/span and airflow, preserve inlet/outlet/background data, investigate negative differentials without clipping and carry detection-limit intervals and sampling-coverage uncertainty."
      source_ids: []
    - rule_id: method_basis
      applies_to: "method provenance"
      rule: "GHG Product Life Cycle Accounting and Reporting Standard (2011), chapters 6, 7 and 9 supports defining a service function/reference flow, documenting connected life-cycle boundaries and exclusions, and preferring subdivision before justified physical allocation. Its GHG scope screening also informs gas_screen. The particular accepted-handover unit, closed pool, animal-hours, area-hours, failed-sale treatment and asset/event rules here are explicit PCR design choices requiring scientific review, not mandates or numeric defaults asserted from that source. Defra supports species-care activity selection only. The additional terminal species conservation balance, matched source-exposure accounting and exterior verification are explicit foreground measurement designs, not empirical capture factors or claimed mandates from these sources."
      source_ids:
        - ghg-product-2011
    - rule_id: protocol_views
      applies_to: "all cards and collection protocols"
      rule: "Each protocol declares exactly one existing process ID. cp_material, cp_material_hygiene and cp_material_handover are holding, hygiene and handover views of the same stock/issue ledger; cp_custody and cp_custody_handover are holding and handover views of the same individual-event ledger. Preserve common source_record_id/ledger_id/event_id in all views. Each exchange reads only its own process view; reconciling a common record is not another exchange, stock issue, measurement or normalization. N is the same final pool denominator across both custody views. Require every row collection_protocol_id to resolve to its actual process ID, not a concatenated process label."
      source_ids: []
    - rule_id: diet_applicability
      applies_to: "hay; pellets; actual diet"
      rule: "The inspected Defra Part F basic-diet paragraphs identify a continuous hay-based primary diet with adequate vitamin C; the hay card means fresh-quality uncontaminated dried grass hay, not fresh growing grass. Fortified pellets supplement hay and cannot replace its primary role. The separate required-higher-standard paragraph calls for suitably sourced identified forage foods and describes commercial dried forage as supplementary; this PCR does not infer that grass hay alone satisfies that higher-standard obligation or certify any site rating. Confirm the actual site diet and applicable tier with care records and competent veterinary advice. If additional forage, fresh vegetables, supplements or a different food is actually required or used, add its specific atomic card and process-scoped protocol view, align both languages and resync before claiming complete coverage; unknown diet identity or quantity remains blocking."
      source_ids:
        - defra-pet-sale-2026
    - rule_id: terminal_env_boundary
      applies_to: "ammonia; methane; biogenic_co2; wastewater; soiled_litter"
      rule: "Each gas elementary card is the attributable net transfer of its named molecular species across the actual whole-store exterior air boundary, not the housing/litter source plane or indoor recirculation. Keep raw internal source G_s separate from terminal E_s. Trace actual source-to-room-to-exterior paths, capture, temporary retained stocks, exported carriers and independently evidenced species formation/consumption. No capture apparatus or fraction is assumed. Source-plane position and any capture already included in a measurement/factor must be explicit; do not subtract that capture a second time. Unknown path, stock, transformation or capture occurrence/absence evidence prevents complete emissions coverage. Apply the terminal balance and independently measured exterior flux on the same attributed species/period; only the reconciled terminal species kg is allocated to the pool and divided by N once. Store custody ends at each waste handover; downstream treatment emissions remain outside these store gas cards."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified weaned live guinea pigs received and accepted into temporary in-store custody; record supplier, procurement responsibility, acquisition background and rejection disposition."
  starting_condition_role: "Incremental store retail service, not animal production."
  product_classification_scope: "Narrower than CPC 3.0 62114; only the declared guinea-pig route."
  recursive_input_rule: "Do not add another whole retail service for an internal transfer or a refunded/resold animal. Purchased prior services require explicit different gates and no repeated animal production."
  upstream_dataset_requirement: "Retain supplier animal background for N successful animals and F recipient animals outside service and L losses inside service; match species, weaned state and custody gate. Match diet, electricity supply, solution concentration and complete enclosure boundaries before linking."
  disclosure: "Report all exclusions, legal ownership/procurement responsibility, closed cohort period, failed attempts, unresolved identities, inventory completeness and background-link responsibilities."
