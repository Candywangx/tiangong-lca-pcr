allocation_rules:
  - rule_id: subdivide
    applies_to: "shared utility meters and consumables"
    rule: "Use dedicated submeter/issue records first. For shared housing care allocate measured pooled quantities by animal-hours; shared store lighting/space conditioning by occupied allocated area-hours including vacant readiness time assigned to this department. Keep the whole-store denominator, occupied areas, hours and allocation fractions; fractions must sum to one. Non-animal departments retain their share."
    source_ids:
      - ghg-product-2011
  - rule_id: cohort
    applies_to: "successful sales and failed custody"
    rule: "Allocate all cohort operating burdens including unsold residence, refused sales, deaths, supplier returns and repeated sale attempts across N final accepted handovers. Never remove the burdens of failed outcomes or grant mortality credits. No final positive N means no normalized service dataset. Refund and resale are one linked animal history: reverse the first counted handover and count only final unrevoked acceptance. A late physical return after closure reopens the original accounting pool and corrects every subsequent actual numerator, final N and disposition/background partition, including repeat care, transport, losses and any final resale. Preserve original and correction links; do not assign the same animal history or event burden to a new pool or count a new copy of its upstream background."
    source_ids: []
  - rule_id: packages
    applies_to: "enclosures; veterinary service; carriers; waste"
    rule: "Complete reusable enclosure includes base, lid, bowl, bottle and permanent hide; measure lifetime-use share and do not add those components again. Record replacements separately only after inventory extension. A veterinary consultation Item is one documented completed episode including administered medicines, clinic utilities and bundled travel only when its supplier dataset includes these. Charge separately purchased road carriage only when excluded from that package. Packaging transferred with the animal is part of service, not a credit or coproduct. Waste-carrier treatment includes contained excreta/feed residues; do not book their mass or downstream emissions again."
    source_ids: []
  - rule_id: pool_allocation
    applies_to: "cohort pooling and zero-success burdens"
    rule: "Before outcomes are known, preregister one accounting-cohort pool containing every reception cohort from the same store, guinea-pig/diet/housing configuration and fixed acquisition-date window. The pool closes only after every included animal has final disposition and all return windows expire. N and every q_i refer to this complete pool. Include the entire operating and loss-background burden of reception cohorts with zero successful handovers in that pool; never delete them or select only successful cohorts. If the whole pool has N = 0, retain its unnormalized quantities, responsibility ledger and failed-output status, prohibit division and any complete service dataset claim. Pool windows/configuration cannot be changed retrospectively to erase failures."
    source_ids: []
  - rule_id: asset_ledger
    applies_to: "enclosure lifetime and all beneficiaries"
    rule: "Keep one persistent ledger per complete enclosure from commissioning through retirement across all beneficiaries, departments, pools and calendar periods. Total service-life hours are elapsed commissioned-life hours, including occupied use, idle/readiness hours and maintenance downtime, never a denominator reset for each pool. Assign every interval once: occupied shared hours by beneficiary animal-hours; empty readiness and maintenance-downtime hours to the designated department and its preregistered pool by allocated enclosure area-hours. Record actual cohort-use hours on the identical lifetime basis, require nonoverlapping interval allocation and cumulative manufacture shares <= 1. At retirement allocate any unassigned manufacturing remainder to all historical beneficiaries using their recorded allocated lifetime hours; correct affected prior datasets, retaining immutable original and correction links. Lifetime forecasts/revisions update the same ledger and cumulative background balance, never purchase another full manufacturing background. Manufacture, maintenance and end-of-life package boundaries must be evidenced; maintenance not included must be separately inventoried by actual material/service and end-of-life allocated by the same lifetime shares before completeness. A complete enclosure package excludes separately recorded replacement parts from its overlapping period/coverage; no package-plus-component duplication."
    source_ids: []
  - rule_id: carriage_coverage
    applies_to: "carriage and zero-distance physical work"
    rule: "Use t*km only with an evidenced supplier service factor whose boundary covers actual idling, failed visits/loading attempts and allocated empty return legs. Retain event IDs, loaded/empty distance, duration and measured fuel/electricity for each event. If t*km = 0 but the event consumed energy, or the factor omits these activities, do not assign zero: isolate the actual event fuel/electricity and supplier activity in a separate purchased transport-event service with its own explicit event unit, component inventory and allocation; extend with one atomic card per missing carrier/service and linked protocol, independently review and resync before claiming completeness. Do not also apply the t*km factor to the same included event fuel. Until that event model and provider scope are supplied, the dataset is incomplete; downstream modellers cannot choose a silent cut-off."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "holding"
      flow_role: "cohort, N and L"
      record_type: "individual register and signed transfer"
      raw_fields: "animal ID; species; weaned status; supplier; procurement/custody responsibility; receipt, checks, location and disposition timestamps; first sale; commercial refund amount/reason; final qualifying acceptance and explicit acceptance-revocation/cancellation state and evidence; physical return; external retained-custody F and recipient responsibility; resale; rejection; death D; missing M; intact supplier return R; preregistered pool ID, configuration and fixed window; acceptance and care-information receipt; return deadline; upstream background link; source_record_id; ledger_id; event_id; view_process_id"
      collection_method: "This holding view filters one authoritative raw ledger by holding process and the named row role; record source_record_id, ledger_id and event_id without duplicating source measurements. Record every custody event at store, daily census and care/environment observations; trace each refund to original sale. Close only when all individuals have final disposition and all accepted-sale return windows expire. Reopen/correct the original pool for late physical returns and all subsequent actual quantities, N and disposition/background changes; preserve version links and prohibit duplicate reassignment to a new pool. Pure financial concessions without acceptance revocation do not change N or physical disposition. Aggregation: Reconcile acquired = final accepted N + intact supplier returns R + deaths/irrecoverable losses L + documented failed external retained-custody F; no births in this route and no closing stock at closure; no unknown balance. Pre-acceptance rejected arrivals stay outside A with supplier product responsibility, but their measured store reception/rejection work is assigned to this cohort and included in q_i; retain rejection records and do not erase these burdens. Sum complete custody hours; normalize only after closure."
      unit: "Item(s); h"
      frequency: "every event and daily"
      temporal_coverage: "entire cohort life including returns"
      site_scope: "one declared store and acquisition cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed supplier/buyer/return records; death logs; daily count; background responsibility chain"
    - protocol_id: cp_custody_handover
      process_id: "handover"
      flow_role: "final accepted service and N"
      record_type: "individual register and signed transfer"
      raw_fields: "animal ID; species; weaned status; supplier; procurement/custody responsibility; receipt, checks, location and disposition timestamps; first sale; commercial refund amount/reason; final qualifying acceptance and explicit acceptance-revocation/cancellation state and evidence; physical return; external retained-custody F and recipient responsibility; resale; rejection; death D; missing M; intact supplier return R; preregistered pool ID, configuration and fixed window; acceptance and care-information receipt; return deadline; upstream background link; source_record_id; ledger_id; event_id; view_process_id"
      collection_method: "This handover view uses the same cp_custody authoritative raw ledger and source_record_id/ledger_id/event_id; filter only handover records for the named row role. Cross-view reconciliation reuses those IDs, not a second measurement or second q_i/N normalization. Record every custody event at store, daily census and care/environment observations; trace each refund to original sale. Close only when all individuals have final disposition and all accepted-sale return windows expire. Reopen/correct the original pool for late physical returns and all subsequent actual quantities, N and disposition/background changes; preserve version links and prohibit duplicate reassignment to a new pool. Pure financial concessions without acceptance revocation do not change N or physical disposition. Aggregation: Reconcile acquired = final accepted N + intact supplier returns R + deaths/irrecoverable losses L + documented failed external retained-custody F; no births in this route and no closing stock at closure; no unknown balance. Pre-acceptance rejected arrivals stay outside A with supplier product responsibility, but their measured store reception/rejection work is assigned to this cohort and included in q_i; retain rejection records and do not erase these burdens. Sum complete custody hours; normalize only after closure."
      unit: "Item(s); h"
      frequency: "every event and daily"
      temporal_coverage: "entire cohort life including returns"
      site_scope: "one declared store and acquisition cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed supplier/buyer/return records; death logs; daily count; background responsibility chain"
    - protocol_id: cp_material
      process_id: "holding"
      flow_role: "hay, feed, water, litter, cleaner, carrier"
      record_type: "weighed issue and stock ledger"
      raw_fields: "material identity; lot; composition/concentration; moisture; initial/closing stocks; receipts; issues; unused returns; loss; net/gross/tare; kg or volume; density conditions; species/cohort tags; conditional occurrence; source_record_id; ledger_id; event_id; view_process_id element_coverage claim; source_portion_id; element C/N; actual same-state material kg; measured dry_matter_fraction; dry-basis elemental_fraction and assay; live original-ID opening/closing mass and supported whole-body C/N; full external element paths; signed element residual and uncertainty; included-carrier overlap map"
      collection_method: "This holding view filters one authoritative raw ledger by holding process and the named row role; record source_record_id, ledger_id and event_id without duplicating source measurements. Weigh at each feed preparation, water refill, litter change, cleaning dilution and carrier issue with calibrated scales or meter plus traceable density; retain disinfectant label suitability and veterinary diet instructions. Purchases alone cannot establish use. Aggregation: opening + receipts - closing - unused outward returns = material use; separate feed/nesting tags, allocate shared use, retain discarded material once in soiled litter. Sum q_i then q_i / N."
      unit: "kg"
      frequency: "each issue and weekly stock reconciliation"
      temporal_coverage: "all custody intervals and final cleanout"
      site_scope: "dedicated cohort or allocated pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; invoices; lot/label; moisture/density evidence; inventory reconciliation"
    - protocol_id: cp_material_hygiene
      process_id: "hygiene"
      flow_role: "sodium hypochlorite solution"
      record_type: "weighed issue and stock ledger"
      raw_fields: "material identity; lot; composition/concentration; moisture; initial/closing stocks; receipts; issues; unused returns; loss; net/gross/tare; kg or volume; density conditions; species/cohort tags; conditional occurrence; source_record_id; ledger_id; event_id; view_process_id"
      collection_method: "This hygiene view uses the same cp_material authoritative raw ledger and source_record_id/ledger_id/event_id; filter only hygiene records for the named row role. Cross-view reconciliation reuses those IDs, not a second measurement or second q_i/N normalization. Weigh at each feed preparation, water refill, litter change, cleaning dilution and carrier issue with calibrated scales or meter plus traceable density; retain disinfectant label suitability and veterinary diet instructions. Purchases alone cannot establish use. Aggregation: opening + receipts - closing - unused outward returns = material use; separate feed/nesting tags, allocate shared use, retain discarded material once in soiled litter. Sum q_i then q_i / N."
      unit: "kg"
      frequency: "each issue and weekly stock reconciliation"
      temporal_coverage: "all custody intervals and final cleanout"
      site_scope: "dedicated cohort or allocated pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; invoices; lot/label; moisture/density evidence; inventory reconciliation"
    - protocol_id: cp_material_handover
      process_id: "handover"
      flow_role: "corrugated-board carrier"
      record_type: "weighed issue and stock ledger"
      raw_fields: "material identity; lot; composition/concentration; moisture; initial/closing stocks; receipts; issues; unused returns; loss; net/gross/tare; kg or volume; density conditions; species/cohort tags; conditional occurrence; source_record_id; ledger_id; event_id; view_process_id"
      collection_method: "This handover view uses the same cp_material authoritative raw ledger and source_record_id/ledger_id/event_id; filter only handover records for the named row role. Cross-view reconciliation reuses those IDs, not a second measurement or second q_i/N normalization. Weigh at each feed preparation, water refill, litter change, cleaning dilution and carrier issue with calibrated scales or meter plus traceable density; retain disinfectant label suitability and veterinary diet instructions. Purchases alone cannot establish use. Aggregation: opening + receipts - closing - unused outward returns = material use; separate feed/nesting tags, allocate shared use, retain discarded material once in soiled litter. Sum q_i then q_i / N."
      unit: "kg"
      frequency: "each issue and weekly stock reconciliation"
      temporal_coverage: "all custody intervals and final cleanout"
      site_scope: "dedicated cohort or allocated pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; invoices; lot/label; moisture/density evidence; inventory reconciliation"
    - protocol_id: cp_utility
      process_id: "holding"
      flow_role: "electricity and store allocation"
      record_type: "meter and allocation register"
      raw_fields: "meter ID; initial/final kWh; dates; supplier; voltage; equipment; area; operation/readiness hours; all-store denominator; animal-hours; allocation fractions"
      collection_method: "Read submeter daily and at cohort transitions; reconcile bills and all departments; capture continuous climate-control duty and cleaning/till share; use observed operation rather than rated power unless validated by measurements. Aggregation: Apply subdivide to q_kWh, then q_i = 3.6 * q_kWh and q_i / N; allocated totals reconcile to meters."
      unit: "kWh; MJ"
      frequency: "daily and each billing period"
      temporal_coverage: "entire occupancy including nights and empty readiness"
      site_scope: "whole store with separate department pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; floor plan; dated operating logs"
    - protocol_id: cp_asset
      process_id: "holding"
      flow_role: "complete enclosure and maintenance boundary"
      record_type: "asset service-life register"
      raw_fields: "asset ID; complete configuration; included parts; install/retire dates; actual/expected lifetime hours and evidence; commissioning and all-beneficiary interval ledger; occupied/readiness hours; cumulative manufacture fractions; retirement remainder and corrections; cohort-use hours; repair service coverage; end-of-life destination"
      collection_method: "Inspect housing configuration on intake and changes, collect supplier complete-unit manufacture/maintenance/end-of-life dataset boundary and actual asset history; disclose censored lifetime and sensitivity; no invented lifespan. Aggregation: Follow asset_ledger; sum allocated occupied/readiness cohort-use hours / the same persistent documented total service-life hours by complete unit, then divide by N; no components counted again. Missing maintenance/end-of-life coverage blocks complete dataset until the compatible service dataset is supplied."
      unit: "Item(s); h"
      frequency: "installation, change and retirement; each cohort"
      temporal_coverage: "complete asset life with disclosed forecast"
      site_scope: "housing assets used by cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "serial asset records; supplier bill of materials and boundary; retirement evidence"
    - protocol_id: cp_event
      process_id: "holding"
      flow_role: "veterinary episodes and purchased carriage"
      record_type: "completed service invoice and trip record"
      raw_fields: "animal IDs; event date; vet reason; completed episode ID; treatment/package inventory; travel inclusion; supplier; gross consignment kg; actual loaded/empty distance; idling duration; failed attempt; event fuel/electricity and scope; empty-leg allocation; return purpose; absence attestation"
      collection_method: "Capture each completed visit and post-receipt trip, verify supplier service scope against invoices and care logs; verify no-event claims with complete logs. Do not include separately invoiced onsite drugs in this route. Aggregation: Count completed vet episodes once; sum allocated kg * km / 1000 for carriage only outside vet package; divide each q_i by N."
      unit: "Item(s); kg; km; t*km"
      frequency: "every event and weekly no-event review"
      temporal_coverage: "all custody and return attempts"
      site_scope: "attributable animals and external service suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "provider scope confirmation; invoices; travel logs; treatment reconciliation"
    - protocol_id: cp_waste
      process_id: "hygiene"
      flow_role: "wastewater; litter; carcass"
      record_type: "weighing and receiver transfer"
      raw_fields: "stream ID; animal/death links; net/gross/tare; wet mass; composition; moisture; wastewater volume/density; receiver; treatment route; storage time; transfer manifest; captured-species portion ID and analytical form; actual exported portion versus retained closing stock; same cp_air join IDs"
      collection_method: "Weigh each removed litter container and carcass before authorized transfer; measure wastewater discharge and reconcile water retained in litter, animals and evaporation. Verify actual treatment boundary. No carcass event needs zero-death and no-missing reconciliation. Aggregation: Sum each wet waste carrier q_i, allocate before q_i / N. Contents are composition only; split only an actual separately collected/treated stream. Route fractions per waste stream sum to one, applied once. Cross-check actual carrier transfer and named-species composition with cp_air; captured material still retained is a stock, not an export. Direct measured whole carrier mass already contains dissolved/adsorbed species: do not add a separate constituent exchange or subtract exterior gas kg again. Actual additional capture media require a specifically measured carrier card/protocol and bilingual sync before completeness; no equipment or capture fraction is presumed."
      unit: "kg"
      frequency: "every removal, death and discharge; daily closure"
      temporal_coverage: "all holding and final cleanout"
      site_scope: "store to named receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated weights/meters; receiver acceptance and treatment descriptions; water/material ledger"
    - protocol_id: cp_air
      process_id: "holding"
      flow_role: "raw internal named-species source and terminal exterior gas balance"
      record_type: "ventilation and species-specific gas record"
      raw_fields: "gas identity; air receiving medium; concentration in/out mg/m3 as named molecular mass, not N/C equivalent; other-species screen including N2O; ventilation m3/h; duration h; animal occupancy; background/human separation; reading_mode absolute_or_corrected_difference; instrument subtraction components and time/flow basis; same-species indoor incremental background concentration and raw source evidence; target net concentration; correction uncertainty; detection limit; calibration; waste-storage conditions; source/control-volume IDs and sampling-plane location; raw G_s and rate/exposure basis; species-portion/source_record IDs; S_open_s/S_close_s compartments and dates; disjoint exported capture carrier IDs, receiver and actual transfer mass/speciation; F_s/D_s reaction/speciation evidence; exterior inlet/outlet/leakage path IDs; actual volumetric versus air-mass versus species-mass-rate flow; temperature, pressure, wet/dry basis and density conversion; Q_non_target_s evidence; occurrence/absence and uncertainty reconciliation element_coverage claim; source_portion_id; element C/N; actual same-state material kg; measured dry_matter_fraction; dry-basis elemental_fraction and assay; live original-ID opening/closing mass and supported whole-body C/N; full external element paths; signed element residual and uncertainty; included-carrier overlap map"
      collection_method: "For raw internal G_s, use representative occupied housing and store litter holding measurements across full operating conditions; retain inlet and indoor non-target-source background increment evidence for the same species, flow and period; derive each gas separately under exactly one reading mode. For absolute readings subtract inlet once and only the additional indoor non-target increment not yet removed. For instrument-corrected differences retain the instrument correction ledger and subtract only still-unremoved indoor non-target increments; never subtract inlet or the same background again. Unknown correction state or missing increment evidence remains unresolved, never zero. An alternative original factor requires species, diet, waste state, temperature, measurement plane and time/exposure match plus independent review. Its documented boundary must identify raw internal source versus already terminal exterior release and all included capture/storage/transformation corrections; apply each correction once, never reprocess a terminal factor as G_s. No factor or capture fraction is a default here. Aggregation: first integrate raw source G_s with air_mass, retain stocks/carriers/transformations, then reconcile terminal_species_balance against independent exterior_flux. Prefer full actual pool measurements. For sampled source sublots retain r_s_j in kg of named species/h per exactly described enclosure/animal-occupancy configuration and actual matched sublot exposure H_j in h; sum G_s = sum(r_s_j * H_j) once across disjoint source/period strata. Do not multiply a measured sublot rate by animal count again; different occupancy/configuration needs its own measured stratum. Attribute only reconciled terminal E_s to the pool once, then q_i / N. Below detection is a bounded uncertainty interval; unknown source coverage, stock/pathway or closure is unresolved."
      unit: "mg/m3; m3/h; kg-air/h; kg-air/m3; mg-species/h; kg-species/h; h; kg"
      frequency: "continuous or stratified samples spanning each operating condition"
      temporal_coverage: "all source/stock/exterior intervals through each actual waste handover"
      site_scope: "declared internal source planes plus whole-store actual exterior boundary; exclude downstream treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "instrument calibration; raw concentration/airflow series; detection limits; representativeness and origin evidence; independent exterior-flow cross-check; signed stock/carrier balance; reaction/speciation and source-attribution records"
  calculation_rules:
    - id: normalize
      applies_to: "all non-reference rows"
      rule: "q_ref = q_i / N; first assign measured quantities to the closed cohort under subdivide, then normalize exactly once. loss_animal uses L / N. retail_service = N / N = 1 Item(s)."
      inputs:
        - q_i
        - N
        - L
        - cp_custody
        - cp_custody_handover
      output: "exchange amount per reference flow"
      source_ids: []
    - id: air_mass
      applies_to: "ammonia; methane; biogenic_co2"
      rule: "G_s = sum(C_target * V * dt) * 0.000001. Absolute-reading mode: C_target = C_out - C_in - B_increment. B_increment is only the indoor non-target-source concentration increment of the same molecular species on the same flow/time basis still present after inlet correction; it excludes outdoor background already removed through C_in. Instrument-corrected-difference mode: C_target = D_instrument - B_remaining, where the documented instrument subtraction ledger identifies inlet and background components already removed; B_remaining includes only still-unremoved indoor non-target increments. The two modes are mutually exclusive; never subtract C_in or the same background twice, and unknown corrections cannot be set to zero. Concentration mg/m3, V m3/h, dt h, G_s raw internal kg of the named molecular species; calibrate zero/span and volume flow and convert any reported N/C equivalent explicitly before integration. Do not clamp unresolved negative net values to zero; investigate background/uncertainty. Do not multiply a direct gas-mass factor again by nutrient fraction. This is source-plane integration only; carry raw G_s without normalization to terminal_species_balance, not directly to the elementary card. In source-stratified sampling, r_s_j * H_j uses disjoint measured configuration-specific source exposure once, as recorded in cp_air. The concentration-difference form uses V only when actual source inlet/outlet flow compatibility is evidenced. Otherwise use actual separate source inlet/outlet absolute volume fluxes and an independently evidenced non-target kg correction with the same consistent mass-flux algebra as exterior_flux, evaluated at the declared internal source planes; do not assume equal flows. Preserve the two mutually exclusive correction modes."
      inputs:
        - reading_mode
        - C_out
        - C_in
        - B_increment
        - D_instrument
        - B_remaining
        - correction_ledger
        - V
        - dt
        - cp_air
      output: "raw internal named-species G_s kg, unnormalized"
      source_ids: []
    - id: animal_partition
      applies_to: "cohort products and service"
      rule: "A = N + R + L + F after closure; A = received acquired animals; R = intact supplier returns with retained responsibility; L = actual deaths D plus irrecoverable losses M; F = documented external retained-custody animals after commercial reversal under failed_external. Animal background responsibility = N individually linked successful animals + F individually linked external recipient animals outside service + L loss_animal inside service; R continues at supplier, never an avoided-production credit."
      inputs:
        - A
        - N
        - R
        - L
        - F
        - D
        - M
        - cp_custody
        - cp_custody_handover
      output: "closed background responsibility partition"
      source_ids: []
    - id: terminal_species_balance
      applies_to: "ammonia; methane; biogenic_co2"
      rule: "E_s = G_s + S_open_s - S_close_s - X_s + F_s - D_s, all terms kg of the same actual named molecular species over one matched store-custody interval. G_s is the raw attributed net transfer from declared housing/litter source planes into the downstream indoor-air/capture control volume; it is not normalized. S_open_s and S_close_s are attributable stocks in that downstream indoor air, surfaces or actual capture inventory, entering with plus opening and minus closing signs; original un-emitted feed/litter contents are not such capture stocks. X_s is only disjoint named-species mass physically exported in actual technosphere carriers during the interval, excluding closing stock and previous recorded exports. Internal transfers or recirculation are neither X_s nor exterior release. F_s and D_s are independently evidenced formation and consumption of this molecule in downstream transport/storage/capture; require measured speciation, reaction/pathway evidence and traceable stoichiometric molecular-mass conversion, not an assumed loss fraction. A converted species such as ammonium is not automatically molecular ammonia: use its evidenced transformation and actual carrier composition, without counting the same captured portion in both X_s and D_s. A carrier already records the whole measured dissolved/adsorbed constituent mass as composition; never add it again as a constituent waste or air output or deduct E_s again from directly measured carrier mass. Retained capture is S_close_s until physically exported, then only X_s on the corresponding interval; carry S_close_s into next S_open_s with the same IDs and original source/pool responsibility. Later release/export or transformation of that stock corrects the original pool actual numerator; do not attribute the same portion again to a later pool. A retained closing stock does not prove zero future release; unresolved final fate prevents a complete custody/lifetime emissions claim. A new actual carrier or direct water/soil environmental transfer outside existing waste cards requires its own specific atomic card/protocol and bilingual sync before completeness, not an invented generic capture flow. Reconcile E_s against exterior_flux; retain and investigate signed values and uncertainty, with no unsupported uptake/avoided-emission credit. Inventory q_i is the reconciled attributable E_s sum for the original pool; normalize q_i / N once. This species-specific equation establishes only the named-species control-volume closure, not total carbon or nitrogen closure. A TOTAL C/N claim additionally requires the complete measured element ledger under element_coverage; until that ledger passes, disclose total-element coverage as unverified and do not infer it from animal count or gas balance."
      inputs:
        - G_s
        - S_open_s
        - S_close_s
        - X_s
        - F_s
        - D_s
        - cp_air
        - cp_waste
      output: "reconciled terminal E_s kg before allocation/normalization"
      source_ids: []
    - id: element_coverage
      applies_to: "holding"
      rule: "For e=C and N separately and one complete period/control volume verify I_e+S_open_e=O_e+S_close_e+R_e. I/O are actual element kg in every external source/exit: feed, litter, water/formulations, received/handed-over/transferred live animals, carcasses, actual manure/urine/mixed carriers and separate air/water/soil paths; S covers animals, unused feed/litter, held residuals and actual air/capture stocks. Derive element kg from actual same-state material kg times measured dry-matter fraction and evidenced dry-basis elemental mass fraction, OR direct element measurement, exclusively and once. For animals obtain same-original-ID opening/closing mass and supported whole-body elemental composition; growth is QA of these stock changes, not an extra exit. A source portion/species/capture already contained in a complete mixed carrier or stock cannot enter the element sum again. Convert molecular exports using their actual chemical composition to element kg, excluding other atoms. Internal transfers cancel; cover or substantiate the measurement/materiality screen for all actual C/N imports and other species including possible N2. Respiratory CO2/ammonia do not replace the full element total. R_e is a signed investigated residual assessed against calibrated uncertainty, never a default emission or credit. Missing composition/outlets/stocks or unexplained residual blocks a total-element closure claim; retain the specifically completed species-level coverage, with no invented elemental factor."
      inputs:
        - cp_material
        - cp_air
        - source_element_kg
        - animal_open_close_mass
        - dry_matter_fraction
        - elemental_fraction
        - all_external_element_paths
        - I_e
        - O_e
        - S_open_e
        - S_close_e
        - R_e
      output: "named C/N closure or explicitly unverified coverage"
      source_ids: []
    - id: exterior_flux
      applies_to: "ammonia; methane; biogenic_co2"
      rule: "Independently measure actual exterior ventilation, leakage and other documented air-crossing paths. Absolute mode: E_check_s = 0.000001 * sum((C_ext_out_s * V_ext_out - C_ext_in_s * V_ext_in) * dt) - Q_non_target_s; use each actual inlet/outlet flow, not an assumed equal ventilation volume. Concentrations are actual molecular mg/m3, V actual m3/h on matching temperature/pressure and wet/dry basis, dt h and Q_non_target_s independently evidenced indoor non-target species kg over the same interval, not outdoor background already removed at the inlet. Corrected-difference mode may use instrument net species mg/h or kg/h integrated in time: multiply integrated mg/h * h by 0.000001 for kg, while kg/h * h already gives kg; its correction ledger must identify prior inlet and indoor-background removal, subtract only still-unremoved components and never multiply an already mass-rate signal by another airflow. Differential concentration requires documented compatible matched flow before conversion. If the instrument reports air mass flow kg-air/h, convert to m3/h using measured air density kg-air/m3 at the same conditions before multiplying mg-species/m3; alternative mass concentration mg/kg-air needs its own consistent measured basis. Mutually exclusive modes and unit conversions apply at each measurement plane. Unknown exterior paths, volume basis or background attribution are incomplete, not zero. Compare independently attributed E_check_s to terminal_species_balance on identical boundaries and intervals; do not force agreement with an invented capture fraction."
      inputs:
        - C_ext_out_s
        - V_ext_out
        - C_ext_in_s
        - V_ext_in
        - dt
        - Q_non_target_s
        - correction_ledger
        - air_density
        - cp_air
      output: "independent actual exterior E_check_s kg"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all exchanges"
      requirement: "Bind a UUID only after original official record plus matching receipt establish public state, type, property/unit and exact object; retain official Chinese baseName. Blank flow UUID is unverified, not evidence of absence. Service identity is distinct from animal identity."
      evidence: "direct-read evidence and binding audit"
    - id: completeness
      applies_to: "conditional rows and unknowns"
      requirement: "Document observed presence or evidenced absence for every conditional card. Unknown quantities, pathways, service-package contents and emitted gases remain unresolved and block a complete dataset; never replace them by zero. Keep estimates, detection intervals and sensitivity distinct from verified observations."
      evidence: "coverage matrix and unresolved ledger"
    - id: period
      applies_to: "all records"
      requirement: "Use one closed preregistered accounting pool under pool_allocation with explicit timestamps and return policy; inventory quantities and N have identical lifetime coverage. Store-period data must be allocated using recorded animal-/area-hours and cannot use current-month sales to erase earlier or later holding costs."
      evidence: "cohort closure; meter and stock reconciliations"
    - id: gas_terminal_closure
      applies_to: "ammonia; methane; biogenic_co2; wastewater; soiled_litter"
      requirement: "For each named gas, retain source-plane, room/duct/capture stock and actual exterior inlet/outlet records with compatible time intervals, temperature, pressure and wet/dry volume basis. Each measured carrier/species portion has one source_record_id and one exclusive fate: closing stock, actual exported carrier, evidenced transformation or exterior net flux. Reconcile G_s, signed opening/closing stock contributions, X_s, F_s, D_s and independently measured exterior E_check_s within documented propagated uncertainty; unresolved imbalance or species/source attribution blocks completeness, never becomes zero. Separate outdoor inlet correction and actual indoor non-target store/human sources once at each independently defined measurement plane; exterior verification is not another subtraction from the internal source balance."
      evidence: "source/stock/carrier/speciation ledger and independent exterior flux with common IDs"
validation_rules:
  - rule_id: check_basis
    applies_to: "reference and all rows"
    rule: "Require reconciled cp_custody/cp_custody_handover closure, N > 0, A = N + R + L + F, exact 1 Item(s) service reference and one q_i / N conversion per row. No kg animal substitution or phantom output for death, refused sale, refund, internal transfer or supplier return."
    source_ids: []
  - rule_id: check_scope
    applies_to: "scope, identity and evidence"
    rule: "Verify actual species and dry-feed/fan-resistance route, non-specialized store classification, supplier responsibility and all conditional logs; outside-route activities require extension. Check every row type, unit, direction, official UUID chain and bilingual counterpart. Unbound identities remain candidate completion conditions, never verified or published methodology."
    source_ids: []
  - rule_id: check_double_count
    applies_to: "background, packages and emissions"
    rule: "Reconcile successful-animal upstream links plus L background exactly once, package inclusion, carrier contents, treatment gate, stock balances and utility allocations. Require gas coverage and explicit biogenic-carbon accounting without unsupported zero or credit. Verify all named rows, protocols and rules project into structured guidance."
    source_ids: []
  - rule_id: check_terminal_species
    applies_to: "ammonia; methane; biogenic_co2; wastewater; soiled_litter"
    rule: "For every gas row, require terminal species balance and independent actual whole-store exterior flux agreement within evidenced uncertainty, a complete source/capture/stock/transformation/actual-carrier fate ledger and matched named-molecule units/conditions. Assert raw internal G_s is not directly emitted or normalized twice; captured retained versus exported portions are disjoint and already contained in measured carriers, and factor boundary corrections occur once. Unknown occurrence, attribution, pathway or unresolved closure fails completeness and cannot be zero-filled."
    source_ids: []
published_dataset_profile:
  dataset_role: "Partial incremental foreground unit-process retail service inventory; not a complete retail life-cycle footprint."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Incremental guinea-pig retail service at the declared store gate; combine with N successful animal product backgrounds using animal_partition."
  excluded_use: "Animal production footprint; whole pet lifetime; all live-animal species or all CPC 62114 routes; welfare certification; complete results while identity/quantity gaps remain."
  required_metadata: "Required qualifiers; all protocol coverage; source period; supplier scopes; background links; allocation denominators; conditions; reference and row identities."
  required_quality_disclosure: "Unbound UUIDs; missing gases/measurements; lifetime forecasts; loss/return uncertainty; excluded building/customer gates; treatment and maintenance coverage."
  update_trigger: "Species, feed, housing, heating/cooling, disinfectant, supplier scope, return policy, waste route or authoritative evidence changes; correction after late returns."
data_sources:
  - id: "defra-pet-sale-2026"
    type: "official_guidance"
    reference: "Defra, Selling animals as pets licensing: statutory guidance for local authorities, updated 1 June 2026, Parts A/B/F. https://www.gov.uk/government/publications/animal-activities-licensing-guidance-for-local-authorities/selling-animals-as-pets-licensing-statutory-guidance-for-local-authorities--2"
    used_for: "Species-specific retail care and record activities only; England scope, no LCA default amounts, allocation formula or universal compliance threshold."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapters 6, 7, 9; printed pp.27–35, 62–65. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General service functional-unit, boundary disclosure, GHG screening and subdivision/physical-allocation framework; PCR-specific pools, drivers and partial scope are author choices, not source mandates or whole-standard conformity."
