system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_scope
      applies_to: "all processes"
      rule: "Eligible configuration is a non-specialized store, one actual side-table SKU/colour/dimensions/receipt BOM and unchanged unopened original sales pack, manual handling and customer collection at the store exit. The table is composite board furniture, not a metal-frame seat; CPC62141 covers group381 except38111 and3812. The chosen table is a narrower subset; do not infer coverage of all furniture or all wood products."
      source_ids:
        - un-cpc62141
        - ikea-lack-spec
    - rule_id: b_gates
      applies_to: "retail"
      rule: "Start at physical receipt of the complete sales pack at the store receiving gate, including unloading custody; end at verified final-valid customer acceptance after the declared follow-up observation date, with later reversals reopening the original cohort. Include storage, picking, checkout, manual handover, failed attempts, customer self-returns and losses. Observe each real custody event on its actual date. Customer travel, including all roads travelled for self-collection/self-return, is explicitly outside this incremental store-gate service. Supplier physical handback and cross-store/internal logistics are not admitted: signed movement and purchase/returns registers must prove their absence. If either occurs, completeness stops until separate exact original-state product-transfer cards and route activity/protocols are authored bilingually before use."
      source_ids: []
    - rule_id: b_service
      applies_to: "service_output"
      rule: "Output is a completed retail service for one unique original package ID, still unopened at qualified handover. Q counts distinct final-valid original IDs; unsuccessful attempts, acceptance revoked without return, internal moves and unaccepted external retention produce no output. A financial adjustment alone does not revoke physical acceptance. Repeated handling or resale of the same original ID cannot create a second completed service in the linked lifetime retail ledger."
      source_ids: []
    - rule_id: b_merchandise
      applies_to: "loss_supply; failed_pack"
      rule: "Sold merchandise manufacturing, complete original packaging and inbound freight to the SAME store receiving gate remain the accepted-goods companion, not production for every receipt in the incremental service. Each original ID has one B_i covering actual table/fasteners/all coatings/foils/edging and original packaging, using supplier complete BOM or a verified complete-SKU dataset. Receiving-gate inbound freight belongs to B_i; store unloading is here. Original background ownership partitions S accepted, F retailer-responsible failure/loss, O open, T documented named next owner; sum indicators=1. Only F enters loss_supply; disclose V_S/Q downstream, carry O/T responsibility forward. T may be a documented ownership handover without movement, never evidence of physical dispatch. Supplier physical returns/cross-store transfers are prohibited by b_gates. Eventual resale replaces earlier F/O/T by S and reverses original F charges once. unqualified_retained is the actual original exit, reclassified when acceptance is invalid; n_R is never added as a second exit to the physical balance. Verify original unopened complete state and recipient; opened/split or unknown externally retained state requires concrete state-specific cards before completeness. Never infer a waste stream from financial or ownership changes."
      source_ids: []
    - rule_id: b_configuration
      applies_to: "all processes"
      rule: "Eligibility requires documented absence of retailer assembly, unpacking, samples/display models, repacking, added labels/bags/paper receipts, powered handling, retailer delivery, fuels, purchased heat and refrigeration/heat-pump equipment. Building heating is electric resistance with meter-covered ventilation/lighting. Signed site survey, utility drawings, sales/returns procedures and purchase ledgers establish absence; unknown is not zero. Any occurrence requires actual atomic exchange cards, protocols, calculation and aligned translations before dataset completeness; consumer care/assembly instructions and manufacturer return policy are not store activity data."
      source_ids:
        - ikea-lack-spec
    - rule_id: b_provider
      applies_to: "assets; cleaning"
      rule: "Use only evidence-backed complete lifecycle packages for each named physical asset, not summed unrelated repair masses disguised as equipment. Every package owns manufacturing, transport/installation, actual event-based maintenance and retirement treatment including its complete contained components; it excludes all site operating electricity and contracted cleaning. Building includes structure, fixed resistance heating, ventilation, lighting, fire and electrical infrastructure; it excludes racks, checkout station, manual pallet truck and customer trolley. Each other asset package excludes those building components and all other listed assets. Checkout is one documented complete installed station with exact terminal/scanner/payment-device BOM. No asset package terminal carrier or repair part is also a foreground waste/input. Require model/BOM, provider boundary, actual maintenance events and terminal evidence, replacing expected lifetime records when realized. Missing package coverage blocks completeness; a lease price is not lifecycle evidence."
      source_ids: []
    - rule_id: b_cleaning
      applies_to: "cleaning"
      rule: "cleaning_work is purchased cleaning labour h with signed time records only. Actual water, each cleaning formulation, wipes, complete tool acquisition/retirement, work electricity, travel, waste/effluent and emissions are separate split_support or named-extension exchanges; none remain inside the labour background. Deduplicate store electricity and existing provider sources, reverse the old full package and normalize once with c_split_quantity. Merchandise cleaning remains excluded. Never deduct internal reuse/evaporation from independently measured discharge. Unknown composition/fate blocks completeness."
      source_ids: []
    - rule_id: b_waste
      applies_to: "failed_pack"
      rule: "The sole merchandise waste card is a real segregated consignment of complete original failed table packages including their original packaging, possibly physically broken but with every original component still in that carrier. Record actual net dispatch kg by consignment, recipient/treatment, composition and source IDs; no assumed waste from refunds, stock shortages or supplier returns. Opened/split source components and third-party mixed refuse are outside this card and require state-specific extension before completeness. Product background ownership and physical waste carrier are different ledgers; the same F original background is charged once, not once per component. No recycling substitution credit is implicit."
      source_ids: []
    - rule_id: b_waste_transport
      applies_to: "failed_pack"
      rule: "The downstream failed_pack provider owns collection/loading after signed store dispatch, actual loaded and empty road segments to the treatment plant, unloading and treatment. Provider raw records must bind each consignment ID to net complete carrier kg, actual route distances/load shares, gross payload including containers, vehicle/fuel/capacity, empty km, any return leg, and treatment quantity/version. Use two mutually exclusive provider modes. In signed complete-consignment mode the provider has already attributed actual collection, loaded/empty/return travel, stationary idle and treatment to this consignment kg; all following segment calculations are QA only, never another fraction or additional activity. Otherwise reconstruct the unallocated provider vector using disjoint loaded-forward, empty/return and stationary-idle segment classes, with original segment/source IDs. For each positive-distance loaded-forward segment s, driver d_bs=actual beneficiary payload_kg including containers*segment_km, and share f_bs=d_bs/sum_b(d_bs) over ALL beneficiaries; loaded activity is payload_kg/1000*km, with distance counted once. For each empty/return segment and each stationary-idle interval separately, driver r_bs=prospectively documented positive reserved payload capacity_kg*reserved duration_h within that exact segment/interval; share g_bs=r_bs/sum_b(r_bs), across ALL beneficiaries using the same kg capacity basis and exact start/end times. Reservations include failed consignments and retained idle capacity; unknown, inconsistent or all-zero total drivers block completion. Actual empty/return vehicle-km and stationary vehicle-hours are nonzero activities where observed, never erased by zero tonne-km. Apply the respective share once to each original segment/interval provider vector covering its actual vehicle-km, hours and measured fuel; no second distance, fuel or treatment activity is charged beside those contained vectors. Reconcile every segment/interval and all-beneficiary attributed vectors to full actual vehicle-km/h/fuel totals, including return legs, before completion. Link this complete waste transport+treatment provider once to dispatched carrier kg; do not also charge store meters, inbound merchandise freight or cleaning/asset carriers. Store-side manual staging before dispatch remains in retail/assets."
      source_ids: []
    - rule_id: b_partial_support
      applies_to: "all processes"
      rule: "This is a partial incremental physical store-gate service. Listed building/checkout packages are physical asset lifecycle capacity, not an assertion of complete common IT, security or back-office operations. Employee private commuting and customer travel/use/end-of-life are explicitly excluded from this PCR without a claim of complete product-system coverage. Actual necessary shared IT/network/cloud, staffed security and store administration that are not demonstrably within an existing provider are separately incomplete support modules; do not treat absence of a card as zero. Completion follows calc_support_completion with actual named provider/service orders and original denominators, all beneficiaries and source-ID deduplication. Until those actual modules are added with atomic bilingual cards/protocols and verified provider scope, disclose this partial boundary and never call it a complete retail-business dataset."
      source_ids: []
    - rule_id: split_exchange_identity
      applies_to: "all inventory rows"
      rule: "Each card has exactly one concrete exchange identity and one reference measurement property/unit; a unit group is not a second property, and auxiliary measurements are conversion evidence only. Labour cards no longer carry bundled materials/energy/equipment/wastes. Retained complete homogeneous assets, original packaged goods and real mixed waste carriers require matching actual whole-scope background/receiver treatment and full composition; heterogeneous collections or selectors are prohibited. An original exchange enters one core card or one split source only; reverse all old package characterization when replacing it and combine only disjoint raw quantities with identical identity/property/unit. Every other actual substance, part, fuel, refrigerant, emission and treatment gap requires a named bilingual card and process protocol; unknown is never zero or complete."
      source_ids: []
