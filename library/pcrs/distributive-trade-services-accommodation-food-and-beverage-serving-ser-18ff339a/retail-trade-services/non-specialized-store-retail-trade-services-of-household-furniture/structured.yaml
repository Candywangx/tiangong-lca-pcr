allocation_rules:
  - rule_id: a_pool
    applies_to: "all processes"
    rule: "Prospectively declare SKU/configuration/site/channel pool and reporting/follow-up windows before seeing sales. Retain idle, closed, failed and zero-sale intervals in their same pool; do not select only selling days. An entirely Q=0 pool remains an unnormalizable retained raw inventory and is joined only under the predeclared same-configuration pooling rule, not erased or divided by1. Late acceptance revocation revises Q and every original-pool normalized numerator; no old-version charge persists beside the replacement."
    source_ids: []
  - rule_id: a_shared
    applies_to: "electricity; cleaning_work; assets"
    rule: "Direct subdivision and dedicated measurements precede allocation. For a shared pool X_t, assign X_pt=X_t*d_pt/sum_b(d_bt) across ALL actual beneficiaries b, including other merchandise, failed stock, idle/closed reservations. For electricity first establish disjoint measured component kWh pools for active equipment, stationary standby and fixed lighting/heating circuits, reconciling their complete sum to the actual parent meter with contained and disjoint circuits identified. Allocate each component pool independently: active equipment by beneficiary measured kW*h, each same-configuration standby pool by beneficiary reserved device*h, and each fixed lighting/heating zone pool by beneficiary reserved m2*h over its exact period. Driver numerator and all-beneficiary denominator must have the same unit within that pool. Only resulting attributable electrical MJ numerators may be summed; never sum kWh, device*h or m2*h as one driver. Unknown component decomposition or unexplained parent-meter residual blocks completion and cannot become zero. Cleaning uses the explicit calc_cleaning source mode; racks use occupied/reserved volume-time, checkout measured occupied/reserved station-time, trucks/trolleys occupied/reserved device-time, building exclusive/reserved floor-area-time. Idle reserves are prospectively assigned to their service users and retained; unknown or zero all-beneficiary total blocks allocation. Do not use zero distance to erase stationary capacity or price as a physical driver. Reconcile full measured totals; do not multiply a share twice. This is PCR design using GHG allocation principles, not a claim that this standard mandates these exact drivers. Cleaning uses calc_cleaning event/source subdivision: within one homogeneous pass use measured cleaned m2, then sum attributed event quantities. An independently metered duration-dependent source uses its own measured m2*h pool exclusively; the two drivers are never alternatives for the same source. Every source has one fixed measured driver mode."
    source_ids:
      - ghgp-product-2011
  - rule_id: a_assets
    applies_to: "building_life; rack_life; pallet_life; trolley_life; checkout_life"
    rule: "For asset a retain one persistent serial/BOM/lifetime ledger across all periods and beneficiaries. Define e_ap as measured beneficiary exposure with the a_shared driver and L_a(v) as evidenced expected TOTAL lifetime exposure in the same unit including pre-existing beneficiaries and idle reserves. Current package fraction f_ap(v)=e_ap/L_a(v), never a new whole asset at each period. Cumulative f across beneficiaries/periods cannot exceed1. At revision replace ALL historical allocations with e_ap/L_a(new), issuing signed deltas and superseding versions, not restarting manufacturing. At retirement replace expectation by actual lifetime exposure E_a, recompute every beneficiary e_ap/E_a so total=1, including the final residual and actual maintenance/retirement model. Apply the fraction once to the complete package; terminal material is already inside that package and takes no extra manufacturing fraction. If a supplier lacks full service package, construct an explicit separate component/event model with atomic cards before use; do not claim completeness."
    source_ids: []
  - rule_id: a_no_credit
    applies_to: "all processes"
    rule: "The sole functional output is service_output. Financial margin, supplier refunds and resale revenue are not environmental co-products. Record physical transfers and final ownership without avoided-production credits. All merchandise failure burden F and failed handling stay in the declared cohort even if no service succeeds."
    source_ids: []
  - rule_id: split_attribution
    applies_to: "cleaning_work; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
    rule: "Prefer exclusive direct measurements. For shared cleaning events apply the explicit calc_cleaning source mode across all beneficiaries; for maintenance use the repaired asset physical driver over all beneficiaries of the actual supported work-order cycle. Retain idle, failed, closed and zero-driver loads and their original carryover rules, never discard them using sales. New tool manufacture/retirement uses persistent lifetime ledgers and historical revision deltas; installed replacement parts are charged once to their actual maintenance event, not again as an original whole-asset acquisition. Do not reapply a share to an already-attributed source or charge terminal tools only to the retirement period. Remove any contained quantity from its old background or replace the entire package with this split; never characterize both. Cleaning uses calc_cleaning event/source subdivision: within one homogeneous pass use measured cleaned m2, then sum attributed event quantities. An independently metered duration-dependent source uses its own measured m2*h pool exclusively; the two drivers are never alternatives for the same source. This explicit source-mode rule replaces the previous undifferentiated cleaning area-time/area-event wording."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "retail"
      flow_role: "service acceptance and physical custody"
      record_type: "event ledger"
      raw_fields: "pool ID; custody event ID; original package ID; SKU; colour; dimensions; receipt BOM revision; actual receiving count/gross mass; original packaging configuration/tare/component BOM; opening/closing IDs; receipt; gross handover; return; refusal; acceptance status/date; revocation date/reason; supplier handoff; internal transfer; external loss recipient/state; final follow-up; original/new version links; partial-support module register; disjoint measured provider component pool/source ID; parent source quantity/property/unit and reconciliation; exact component interval; beneficiary raw driver value/unit; unknown decomposition flag; goods/held-waste opening and closing package IDs; internal waste-classification event; actual source/material/moisture-conditioned kg; documented mass additions/removals and moisture changes"
      collection_method: "Scan unique IDs at receiving, checkout/exit and each return; inspect original closure and exact SKU, verify qualified acceptance evidence and reconcile physical stock independently; use calibrated scale/component inspection for actual mass and supplier signed BOM for background completeness. Public package weight is not a measurement. Aggregation method: calc_accept; calc_stock; calc_normalize; retain raw failed and Q=0 pools"
      unit: "Item(s); kg; support source quantity retains its own exchange/property/unit; each support-pool driver has its separate declared unit"
      frequency: "each custody/acceptance event; daily reconciliation"
      temporal_coverage: "whole prospective cohort plus later reversals"
      site_scope: "receiving gate to store customer exit, actual return route"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed receipts/acceptance; stock audits; scale calibration; supplier complete BOM; version history"
    - protocol_id: cp_meter
      process_id: "retail"
      flow_role: "electricity"
      record_type: "interval meter ledger"
      raw_fields: "meter/circuit ID; topology; parent containment; start/end kWh; dates; calibration; circuit load; active power-time; stationary standby kWh; zone-area-time; beneficiary drivers; full total; allocation version; supply provider/voltage/geography; delivery losses; disjoint component pool ID/class; actual component kWh; parent meter and same-unit reconciliation; exact interval; each raw beneficiary driver value and unit; active kW*h; same-configuration standby device*h; fixed-zone m2*h; unexplained residual"
      collection_method: "Read calibrated meters over all intervals including closure; map every circuit to measured parents, isolate disjoint circuits, verify a_shared drivers with equipment ratings and measured standby; reconcile bills without provider-contained duplication. Aggregation method: calc_energy; calc_shared; calc_normalize once per reference flow"
      unit: "electrical numerators kWh then MJ; separate per-pool drivers kW*h OR device*h OR m2*h, never added"
      frequency: "interval readings and each topology change"
      temporal_coverage: "all operating/idle/closed periods"
      site_scope: "same prospective store pool and all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; circuit drawing; bill reconciliation; driver evidence"
    - protocol_id: cp_ownership
      process_id: "residual"
      flow_role: "original merchandise background responsibility"
      record_type: "source-ownership ledger"
      raw_fields: "original ID; receiving gate; complete SKU/BOM/pack source vector B_i; source denominator/unit/version; inbound freight coverage; S/F/O/T state; ownership date; named next owner; physical handoff IDs separately; loss fate/recipient; prior charge; replacement delta; original cohort Q; original exit custody-event ID; n_R; retained recipient; current unopened complete-package state; acceptance/revocation evidence; independent no supplier/cross-store physical movement evidence"
      collection_method: "Trace every original complete package and actual supplier source model to the common gate; verify complete components and transport boundary. Follow actual retained/lost packages through recipient/state/continuing responsibility; T records an ownership-only handover at this site without admitted supplier or cross-store physical dispatch. Check those prohibited movements only as eligibility screens. Never infer physical waste from an ownership state. Aggregation method: calc_background; calc_restore; calc_normalize; S/Q companion and O/T carry-forward separately"
      unit: "Item(s); original vector units"
      frequency: "each receipt and final-state/revision event"
      temporal_coverage: "entire original history, not only sale period"
      site_scope: "common receiving gate, all final owners"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier complete-BOM model; freight evidence; transfer acceptance; responsibility agreement"
    - protocol_id: cp_waste
      process_id: "residual"
      flow_role: "complete original failed package carrier"
      record_type: "weighbridge/consignment ledger"
      raw_fields: "consignment ID; original package IDs; physical state; full original component presence; gross kg; tare kg; net kg; dispatch date; actual recipient/treatment; opening/generation/closing waste stock; composition; uncertainty; waste-classification package count; held-waste opening/closing IDs; provider loading/loaded/empty/return segment IDs; payload kg including containers; distance km; vehicle/fuel/capacity; all-consignment shares; treatment provider version; exclusive provider mode; signed complete-consignment-kg attribution and covered route/idle scope; segment source IDs/class and actual start/end; beneficiary loaded payload_kg; actual loaded segment_km; predeclared reserved payload capacity_kg and reserved duration_h for each beneficiary of each empty/return segment and idle interval; actual vehicle_km; actual vehicle_h; actual fuel by segment/interval; full all-beneficiary totals; provider vector and source version; allocation versus QA flag"
      collection_method: "Calibrated net weighing and signed recipient consignment; inspect complete source-package composition; direct dispatch mode only, with independent generation/stock reconciliation. Do not subtract stock again from measured net dispatch. Aggregation method: calc_waste; calc_normalize; provider treatment attaches once to measured kg"
      unit: "kg"
      frequency: "each dispatch and stock audit"
      temporal_coverage: "all original cohort dispatches including later corrections"
      site_scope: "segregated carrier at store gate to treatment handoff"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; tare; photos/component audit; consignment and treatment record"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "five individually defined complete lifecycle packages"
      record_type: "persistent serial asset/provider ledger"
      raw_fields: "asset ID/type; exact full BOM/serial; provider package ID/version/vector; original denominator; exclusions; installation date; maintenance event IDs/actual parts; retirement state/recipient; historic beneficiaries; occupied/reserved exposure e_ap; idle/closed duration; total lifetime exposure L_a; actual final E_a; old/new allocation versions; signed deltas; cumulative fraction"
      collection_method: "Inspect every building/rack/manual pallet truck/customer trolley/checkout package individually against b_provider. Measure site floor area-time, reserved rack volume-time and each device reserved/occupied time over full life. Audit provider component/event/treatment models and disjoint electricity/cleaning boundaries; update realized maintenance/retirement, never infer full lifecycle from equipment mass or lease cost. Aggregation method: calc_assets; calc_restore; calc_normalize once per reference flow; one view per row, no duplicate source IDs"
      unit: "Item(s); m2*h; m3*h; device*h"
      frequency: "continuous reservation/time records, each maintenance/lifetime revision/retirement"
      temporal_coverage: "all historical/current/future beneficiaries until final correction"
      site_scope: "all five asset types and all their users"
      aggregation_rule: "per reference flow"
      quality_evidence: "BOM/provider signed boundary; exposure ledger; actual maintenance records; lifetime rationale; full-history deltas"
    - protocol_id: cp_cleaning
      process_id: "cleaning"
      flow_role: "cleaning_work"
      record_type: "Cleaning labour and physical-source QA"
      raw_fields: "order ID/version; zone; actual area; start/end; method; provider vector and denominator; actual water/cleaner composition; cloth/equipment wear; provider travel; whole wastewater/waste carrier; treatment; store-electricity exclusion; all-beneficiary actual pass cleaned m2; original pool; cleaning_pass_id; driver_mode; cleaned_m2; all_beneficiary_cleaned_m2; independently_measured_time_dependent_source; source_m2h; all_beneficiary_source_m2h"
      collection_method: "Verify actual labour hours and reconcile every raw physical constituent; use cp_split_labour_cleaning and cp_split_support respectively, never complete cleaning-work-order equivalents. Fix the source mode before measurement under calc_cleaning; retain each actual pass duration and area without mixing whole-pool area-time with per-pass area."
      unit: "h"
      frequency: "each actual work order"
      temporal_coverage: "whole prospective pool including idle cleaning"
      site_scope: "recorded retail zones and full provider boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed work order; quantity records; chemistry; wastewater/treatment records; exclusions audit"
    - protocol_id: cp_split_labour_cleaning
      process_id: "cleaning"
      flow_role: "cleaning_work"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources; cleaning_pass_id; driver_mode; cleaned_m2; all_beneficiary_cleaned_m2; independently_measured_time_dependent_source; source_m2h; all_beneficiary_source_m2h"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates. Fix the source mode before measurement under calc_cleaning; retain each actual pass duration and area without mixing whole-pool area-time with per-pass area."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
    - protocol_id: cp_split_support
      process_id: "split_support"
      flow_role: "split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
      record_type: "Separate raw-exchange ledger"
      raw_fields: "event_id; source_id; occurrence/absence evidence; exact substance/model; actual composition/SDS; reference property; unit; raw quantity; original denominator; labour start/end; meter interval/containment; density/temperature; whole-carrier net mass; receiver/treatment scope; tool asset_ID; original/replacement part; lifetime/all historical beneficiaries; historical revision delta; all-beneficiary driver; direct/already-attributed status; old-package reversal; overlapping sources; cleaning_pass_id; driver_mode; cleaned_m2; all_beneficiary_cleaned_m2; independently_measured_time_dependent_source; source_m2h; all_beneficiary_source_m2h"
      collection_method: "Verify actual supply and dispatch per event; use signed start/end labour records, measured material/waste weights, disjoint electricity meters and actual vehicle-route km. Resolve original denominator, composition, background, receiver/treatment and every beneficiary; apply split_attribution and c_split_quantity. A different actual formulation/model or additional emission requires an exact new card; never default to these candidates. Fix the source mode before measurement under calc_cleaning; retain each actual pass duration and area without mixing whole-pool area-time with per-pass area."
      unit: "One property/unit per card"
      frequency: "Every event and source revision"
      temporal_coverage: "Original full source cycle and all beneficiary history"
      site_scope: "Actual work order and disjoint site/provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed time, calibration, composition, deduplication and receipt evidence"
  calculation_rules:
    - id: calc_accept
      applies_to: "service_output"
      rule: "Q = cardinality of distinct original IDs whose final acceptance is valid as of the declared observation version. Retain all failed/zero-sale cohorts; do not subtract revocations again after selecting final-valid IDs. Update original version on later reversal."
      inputs:
        - original_ID
        - final_acceptance_status
        - observation_version
        - cp_service
      output: "Q"
      source_ids: []
    - id: calc_stock
      applies_to: "retail; residual"
      rule: "C0_goods+C0_held_waste+receipts+customer_physical_returns = gross_customer_handovers+waste_package_dispatches+otherwise_unrecorded_external_exits+C1_goods+C1_held_waste (all Item(s)). Gross handovers include the original departure of unqualified_retained exactly once. Classification as waste changes goods/held_waste state only: W0_count+new_failed_packages-dispatched_failed_packages=W1_count. Separately reconcile source/material/condition kg: opening_mass+received_mass+returned_mass+documented_added_mass+documented_moisture_gain = handover_mass+dispatch_mass+external_exit_mass+closing_mass+documented_removed_mass+documented_moisture_loss. Count and mass ledgers never mix; measure actual condition-specific kg and investigate uncertainty/residuals. No supplier/cross-store movement is admitted."
      inputs:
        - C0_goods
        - C0_held_waste
        - receipts
        - customer_physical_returns
        - gross_customer_handovers
        - waste_package_dispatches
        - otherwise_unrecorded_external_exits
        - C1_goods
        - C1_held_waste
        - W0_count
        - new_failed_packages
        - dispatched_failed_packages
        - W1_count
        - opening_mass
        - received_mass
        - returned_mass
        - documented_added_mass
        - documented_moisture_gain
        - handover_mass
        - dispatch_mass
        - external_exit_mass
        - closing_mass
        - documented_removed_mass
        - documented_moisture_loss
        - cp_service
        - cp_waste
      output: "balanced physical ledger"
      source_ids: []
    - id: calc_background
      applies_to: "loss_supply"
      rule: "For each original source i, indicator states S_i+F_i+O_i+T_i=1. Original package failure count n_F=sum_i F_i. Raw failed background vector V_F=sum_i F_i*B_i at receiving gate. Accepted companion V_S=sum_i S_i*B_i; retain V_O and V_T responsibilities. One original vector follows its final ownership, not every descendant carrier. Eventual resale replaces the prior state and every prior charged vector by a versioned delta."
      inputs:
        - S_i
        - F_i
        - O_i
        - T_i
        - B_i
        - source_denominator
        - prior_vector
        - source_version
        - cp_ownership
      output: "n_F; V_F; V_S; V_O; V_T"
      source_ids: []
    - id: calc_energy
      applies_to: "electricity"
      rule: "E_raw_MJ = 3.6 * E_raw_kWh. For a measured parent subtract only contained independently attributable excluded subcircuits once; sum disjoint meters once. Allocate the resulting complete interval pool under calc_shared, preserving standby/closed periods."
      inputs:
        - start_kWh
        - end_kWh
        - topology
        - contained_exclusions_kWh
        - disjoint_kWh
        - interval
        - driver
        - cp_meter
      output: "attributable_MJ"
      source_ids: []
    - id: calc_shared
      applies_to: "electricity; cleaning_work; building_life; rack_life; pallet_life; trolley_life; checkout_life"
      rule: "X_pt = X_t*d_pt/sum_b(d_bt), using the exact row-specific a_shared physical driver. Sum all beneficiary allocations to X_t. Directly measured exclusive X_pt bypasses allocation; never multiply it by another share. Unknown/all-zero total drivers block completion, including idle/closed periods."
      inputs:
        - X_t
        - d_pt
        - d_bt
        - beneficiary_list
        - reservation_rule
        - cp_meter
        - cp_assets
        - cp_cleaning
      output: "attributable raw row numerator"
      source_ids:
        - ghgp-product-2011
    - id: calc_assets
      applies_to: "building_life; rack_life; pallet_life; trolley_life; checkout_life"
      rule: "f_ap(v)=e_ap/L_a(v); raw package equivalents=sum_a f_ap(v). Restore complete provider package vector to one exact asset first. Every L_a revision replaces ALL prior allocations, delta=e_ap/L_a(new)-e_ap/L_a(old) for every prior beneficiary/period. At retirement set L_a=E_a(actual), recompute all beneficiaries, attribute final residual so sum f=1 and replace expected maintenance/retirement by actual event vector. Do not restart manufacturing or multiply terminal carriers twice."
      inputs:
        - e_ap
        - L_a_old
        - L_a_new
        - E_a_actual
        - asset_ID
        - complete_provider_vector
        - source_denominator
        - source_version
        - prior_allocations
        - actual_maintenance_events
        - retirement_vector
        - cp_assets
      output: "raw package equivalents; corrected provider vector; signed historic deltas"
      source_ids: []
    - id: calc_cleaning
      applies_to: "cleaning_work"
      rule: "For labour and each actual raw cleaning source, first subdivide actual exclusive events. Where shared, allocate within the SAME homogeneous cleaning pass by each beneficiary actual cleaned_m2, with all-beneficiary shares summing one. Across events attribute each independently measured raw event quantity first, then sum; area-events means summing actual pass areas, never pooling unequal-duration events as one uniform intensity. ONLY an independently measured duration-dependent source pool uses that pool beneficiary cleaning m2*h; do not also apply area-events to it. Record driver_mode and source/event IDs, with positive known complete denominators, consistently with split_attribution. Labour quantity is measured purchased h, not area/count/material. Attribute every other physical quantity separately; already-attributed amounts receive no further share. Reverse old complete package, then normalize once by Q."
      inputs:
        - work_order_ID
        - measured_purchased_labour_h
        - cleaning_pass_id
        - driver_mode
        - cleaned_m2
        - all_beneficiary_cleaned_m2
        - independently_measured_time_dependent_source
        - source_m2h
        - all_beneficiary_source_m2h
        - cp_split_labour_cleaning
      output: "attributed purchased labour h before one /Q"
      source_ids: []
    - id: calc_waste
      applies_to: "failed_pack"
      rule: "W_dispatch = sum_consignment(gross_kg-tare_kg), or directly certified net kg in exclusive alternative mode. Independent opening+generation-dispatch=closing stock check does not alter measured dispatch. Attach actual complete carrier treatment once, no source-background component duplication. Transport provider calculation follows b_waste_transport: signed complete-consignment mode has already attributed route/idle/treatment to kg and segment figures are QA only. In exclusive reconstruction mode use d_bs=payload_kg*segment_km and f_bs=d_bs/sum_b(d_bs) for each loaded-forward segment; use r_bs=reserved_capacity_kg*reserved_duration_h and g_bs=r_bs/sum_b(r_bs) separately for each empty/return segment and stationary-idle interval. Apply each share once to its complete original actual vehicle-km/h/fuel provider vector and reconcile all-beneficiary totals. Unknown/inconsistent/all-zero drivers block completion."
      inputs:
        - measurement_mode
        - gross_kg
        - tare_kg
        - certified_net_kg
        - consignment_ID
        - opening_waste
        - generation_waste
        - closing_waste
        - treatment_vector
        - cp_waste
        - provider_mode
        - signed_consignment_kg_scope
        - segment_ID
        - segment_class
        - source_ID
        - actual_start_end
        - payload_kg
        - segment_km
        - reserved_capacity_kg
        - reserved_duration_h
        - all_beneficiary_drivers
        - actual_vehicle_km
        - actual_vehicle_h
        - actual_fuel
        - complete_provider_vector
        - source_version
        - allocation_QA_flag
      output: "raw net dispatched kg"
      source_ids: []
    - id: calc_restore
      applies_to: "loss_supply; failed_pack; building_life; rack_life; pallet_life; trolley_life; checkout_life"
      rule: "For each external module row r already normalized by D_source, restore raw_original_r=normalized_r*D_source at its exact pool/version, then multiply only its compatible attributable source share once. Sum only identical exchange identity/property/unit numerators after exact source-ID deduplication and replacement-version selection. Keep merchandise V_S companion outside incremental service and terminal asset carriers inside their provider. Final common-Q normalization occurs only in calc_normalize."
      inputs:
        - normalized_r
        - D_source
        - source_pool
        - source_version
        - attributable_source_share
        - exchange_identity
        - property
        - unit
        - source_ID
        - replacement_links
        - cp_ownership
        - cp_waste
        - cp_assets
        - cp_cleaning
      output: "compatible deduplicated raw numerators"
      source_ids: []
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q>0 each row amount = its deduplicated attributable raw numerator / Q, one final division per reference flow. service_output=Q/Q=1 Item(s). Q=0 is retained and unnormalizable; do not invent a divisor. Late corrections replace original numerator and Q together and propagate to companion vectors."
      inputs:
        - Q
        - raw_row_numerator
        - source_ID
        - original_pool
        - replacement_version
        - cp_service
      output: "exchange amount per reference flow"
      source_ids: []
    - id: calc_support_completion
      applies_to: "retail"
      rule: "For every actual necessary support module k not already in a verified provider, collect its exact provider/order/model, original pool/window/version/denominator D_k, atomic exchange identity/property/unit numerators and full boundary. Restore normalized source rows by multiplying D_k. Prefer exclusive measurement. Otherwise first split each measured provider source numerator into mutually exclusive active-compute, active-network, idle-compute and idle-network component pools, with exact source row IDs/units, period and parent source numerator; their complete same-unit sum must reconcile to that parent. Active-compute pools each contain one exact homogeneous compute-capacity class and use measured active CPU-core*h, including failed/interrupted execution; active-network pools use measured transferred bytes, including bytes of failed transactions. Idle-compute pools use prospectively reserved CPU-core*h and idle-network pools use prospectively reserved Mb/s*h, each within one documented homogeneous capacity class and exact common interval. Allocate each component pool separately across ALL actual beneficiaries using that pool one same-unit driver ratio, retaining closed/idle/failure reservations with positive known total. Security remains its separate measured raw source pool using protected m2*h, and administration its separate measured raw source pool using actual task*h. Never add tasks, bytes, CPU-core*h, Mb/s*h, m2*h or task*h into one driver or add incompatible source exchange quantities. Unknown provider-component decomposition or unexplained residual blocks completion, never defaults to zero. Actual completion-module protocols must retain each disjoint pool numerator/identity/property/unit, parent reconciliation, raw beneficiary driver values/unit and exact interval. Sum only resulting identical-exchange/property/unit attributed raw numerators. Exclude site electricity/asset lifecycle/cleaning already charged using explicit provider exclusions and source-ID reconciliation. Add only identical exchange/property/unit raw attributed numerators with unique original source IDs under calc_restore; then use common final Q once. Unknown providers or non-reconcilable drivers block completed support. Exact observed module cards and single-process protocols must be authored bilingually and synced before claiming completion; this formula alone does not add exchanges."
      inputs:
        - provider_model
        - service_order
        - D_k
        - source_pool
        - source_window
        - source_version
        - atomic_exchange
        - property
        - unit
        - component_pool_ID
        - component_class
        - component_raw_source_numerator
        - parent_raw_source_numerator
        - parent_reconciliation
        - exact_compute_capacity_class
        - active_CPU_core_hours
        - transferred_network_bytes
        - reserved_CPU_core_hours
        - reserved_network_Mbps_hours
        - protected_zone_m2_hours
        - administrative_task_hours
        - driver_unit
        - interval_start_end
        - all_beneficiary_driver_values
        - provider_exclusions
        - source_ID
        - Q
      output: "attributable compatible support raw numerators; explicit partial/complete boundary"
      source_ids: []
    - id: c_split_quantity
      applies_to: "cleaning_work; split_cleaning_wipe; split_cleaning_broom; split_used_wipe; split_sweepings; split_broom_waste; split_cleaning_water; split_cleaning_sds; split_cleaning_mop; split_cleaning_effluent; split_mop_waste; split_cleaner_bottle; split_cleaner_bottle_waste; split_support_electricity; split_support_travel"
      rule: "For each exact identity r in its single unit, restore normalized source q_source with its original denominator D_source as x_raw=q_source*D_source; already-raw quantities are not restored again. Apply only missing attribution once under split_attribution, deduplicate source/event/version and reverse old package and historical versions. Sum disjoint raw quantities as X_r; q_r=X_r/Q, dividing by the final reference denominator once. Labour uses measured purchased h only, never old order counts/area; in-house hours are QA only. Calculate asset counts, material kg, electricity kWh, vehicle*km and waste-carrier kg separately; never add across properties or multiply already-measured physical quantities by labour hours. Unknown quantity/identity/background blocks completeness."
      inputs:
        - X_r
        - D_source
        - q_source
        - Q
        - cp_split_labour_cleaning
        - cp_split_support
      output: "q_r"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Bind each row to one matching product/waste identity with property/unit chain and physical/service scope; confirm official bilingual names and qualifiers from retained original reads. Electricity is provider-free point-of-use only. No unresolved service, goods, asset/cleaning package or waste identity can be presented as verified; completion requires exact supporting provider model and actual quantities."
      evidence: "direct identity originals; chain; complete model/BOM/provider scope and row audit"
    - id: q_sources
      applies_to: "all processes"
      requirement: "The manufacturer identifies a real representative configuration, not this store route or complete BOM. Its material headings include Top, Leg AND Panel, with paper foil, coatings, melamine foil and plastic edging; do not simplify into pure wood. Package weight3.59kg is not net furniture mass, maxload10kg is not table mass, and nominal dimensions are not foreground quantities. Actual supplier part/fastener/pack BOM and calibrated receipt measurements control."
      evidence: "actual SKU/colour/configuration; supplier BOM; weighing and packaging inspection"
    - id: q_absence
      applies_to: "all processes"
      requirement: "Record eligibility survey and every conditional asset/failure/waste occurrence or evidenced absence, with date, inspector, photographs, drawings and procurement coverage. Unknown equipment, provider omissions, open waste state or unresolved beneficiary driver cannot become zero."
      evidence: "signed site survey; drawings; purchases; conditional inclusion decisions"
    - id: q_time
      applies_to: "all processes"
      requirement: "Retain complete observation windows, idle/closed/failed intervals, original stock and late return histories, versioned correction receipts and all-beneficiary asset/service allocation ledgers. Report uncertainty and sensitivity to expected lifetime, causal driver and final ownership; no unsupported numerical defaults or completeness claim."
      evidence: "cohort register; calibration; error bounds; delta receipts; sensitivity models"
validation_rules:
  - rule_id: v_reference
    applies_to: "service_output"
    rule: "Verify one actual SKU/configuration and an unopened qualified handover; count unique final-valid original IDs Q. Q equals the output ledger without subtracting revocations twice. Verify final follow-up and late-revision linkage, physical returns versus financial-only changes and no duplicate original-ID service."
    source_ids: []
  - rule_id: v_balance
    applies_to: "retail; residual"
    rule: "For the admitted route reconcile C0_goods+C0_held_waste+receipts+customer_physical_returns = gross_customer_handovers+actual_waste_package_dispatches+otherwise_unrecorded_external_exits+C1_goods+C1_held_waste, using original ID plus custody-event ID and COUNT units throughout. Gross handovers include both valid accepted and unqualified externally retained original exits once; final-state reclassification does not create another movement. Customer returns are new dated inward events. Supplier/cross-store movements must be evidenced absent under b_gates. Waste generation is an internal goods-to-held-waste state change, not a second custody exit: separately reconcile opening held-waste package count+newly classified failed complete packages-dispatched waste packages=closing held-waste package count. Independently reconcile measured material/source/condition kg with actual moisture changes and component additions/removals; no count term is added to kg. Unknown recipient/state/background or unexplained residual blocks completion."
    source_ids: []
  - rule_id: v_electricity
    applies_to: "electricity"
    rule: "Check meter topology, circuit overlaps, interval coverage/calibration and MJ=3.6*kWh exactly once. Subtract a submeter only when inside the parent measured boundary; a disjoint meter is added once, never subtracted. Require actual supply location/voltage/time/provider and delivery losses for background linking; generic electricity UUID establishes no grid mix."
    source_ids: []
  - rule_id: v_complete
    applies_to: "all processes"
    rule: "Every conditional row requires signed presence/absence evidence. All flow UUIDs except electricity and all package provider models remain subject to row-specific identity/completeness verification; blank is not zero or approval. Validate each complete asset/cleaning package boundary against b_provider/b_cleaning and actual invoices/maintenance/treatment. Uncovered routes, constituents, emissions or extra exchanges require concrete atomic bilingual additions and re-sync; they cannot be hidden in a generic expansion clause."
    source_ids: []
  - rule_id: v_normalize
    applies_to: "all processes"
    rule: "Every card carries one raw attributable numerator and one final division by Q under calc_normalize. Asset/package fractions, composition shares and allocation shares occur once only. Normalized external modules must be restored with original denominator/pool/version to raw quantities; deduplicate exact source IDs and compatible exchange/property/unit numerators only, then divide common final Q once. Never add kg to MJ or raw totals to normalized values. Preserve uncertainty, calibration, model versions and replacement deltas; source specifications provide no site defaults."
    source_ids: []
  - rule_id: split_completeness
    applies_to: "all inventory rows"
    rule: "Check every exact identity and single reference property, all actual work-order constituents, disjoint measurements, old-package reversal, no duplicated source/asset terminal scope, all-beneficiary historical attribution and one final normalization. Unverified sources, uncarded actual exchanges, unknown quantities or a mere claim of contract inclusion are incomplete."
    source_ids: []
published_dataset_profile:
  dataset_role: "incremental_retail_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same configured customer-collected retail service with explicit V_S/Q merchandise companion and complete downstream product-system stages"
  excluded_use: "Furniture manufacturing dataset; generic retail sector average; complete retail-business dataset without support completion; delivered/assembled/used furniture; approved complete product footprint"
  required_metadata: "All reference qualifiers; original-ID/Q ledger; S/F/O/T companion vectors; process/card/provider boundaries; units; source hashes/versions; pooling and lifetime corrections"
  required_quality_disclosure: "Partial physical store-gate boundary and actual shared IT/security/back-office completion gaps; actual measurement uncertainty, absence evidence, model completeness and all unverified identities; expected versus actual lifetime; no standard-conformity claim"
  update_trigger: "Acceptance reversal, final ownership/fate change, SKU/BOM/pack/site/meter/provider change, asset lifetime/maintenance/retirement or newly observed exchange"
data_sources:
  - id: "un-cpc62141"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 subclass62141; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62141"
    used_for: "Classification boundary: group381 except38111 and3812; no method or factor"
  - id: "ikea-lack-spec"
    type: "standard"
    reference: "IKEA UK, LACK side table white55×55cm, article304.499.08; https://www.ikea.com/gb/en/p/lack-side-table-white-30449908/"
    used_for: "Manufacturer representative material/configuration headings only; no complete BOM, site inventory, return horizon or allocation factor"
  - id: "ghgp-product-2011"
    type: "standard"
    reference: "WRI/WBCSD (2011), Product Life Cycle Accounting and Reporting Standard, Chapter9, printed p63; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision before allocation; underlying physical relationships and consistent treatment. Specific retail drivers and lifecycle corrections are this PCR design, not mandated values or full conformity"
