  calculation_rules:
    - id: c_goods
      applies_to: "paper_retail_service; supplier_return_ream; external_retained_ream"
      rule: "Q=count(distinct original_ream_ID with final valid acceptance). goods_predicted_close=goods_open_count+received_count+physical_customer_return_count-gross_customer_handover_count-supplier_handover_count-internal_transfer_count-condemnation_count-confirmed_missing_count; R_goods_count=goods_predicted_close-goods_close_count=signed_residual_count. R>0 is unexplained shortage; R<0 is unexplained surplus. Gross customer handovers already include all unaccepted physical handovers once, so never subtract N_external again. Nonmovement revocations replace final status only. N_return counts unique signed actual (original_ream_ID, supplier_handover_event_ID) pairs in the period: each physically moved intact original ream contributes1, so one signed consignment containing multiple reams contributes its actual distinct ream-event pairs rather than1 consignment. Repeated real outward movements of the same original ream have distinct physical handover event IDs and may each count; duplicate documents or no-movement status changes never do. N_return equals the actual qualifying intact-unopened subset of supplier_handover_count, not N_T and not manufacture/service. N_external counts distinct original IDs in intact-unopened external custody with no final valid acceptance at cutoff; it is a cutoff state, not a new exit or number of movements. Apply supplier_return_ream=N_return/Q and external_retained_ream=N_external/Q; service amount=Q/Q=1 Item(s). Preserve raw physical events independently of final custody/acceptance states.  received_count includes only actual supplier receipts not counted elsewhere in this equation (including actual supplier-to-store physical returns) and internal-transfer-in; physical_customer_return_count includes customer returns only; internal_transfer_count includes internal-transfer-out only. Movement counts use actual original-ream units with disjoint event classes and retain original_ream_ID/transfer_ID; no revocation/status-only change or condemnation enters these receipt/return/transfer counts. Condemnation appears only in its own term. On an aggregate including both store sides, the matching transfer_ID out and in cancel; preserve the same original source and create no new manufacture/source."
      inputs:
        - original_ream_ID
        - final_acceptance_status
        - goods_open_count
        - received_count
        - physical_customer_return_count
        - gross_customer_handover_count
        - supplier_handover_count
        - internal_transfer_count
        - condemnation_count
        - goods_close_count
        - confirmed_missing_count
        - goods_predicted_close
        - R_goods_count
        - signed_residual_count
        - supplier_handover_event_ID
        - supplier_handover_signed
        - supplier_handover_state
        - duplicate_document_ID
        - external_custody_cutoff
        - external_custody_original_ID
        - external_custody_state
        - N_return
        - N_external
        - Q
        - cp_goods
        - transfer_ID
      output: "Final-valid service count and independent goods-only physical stock QA"
      source_ids:
        - un-cpc62194
    - id: c_source
      applies_to: "failed_ream"
      rule: "For every original homogeneous source vector N_in=N_S+N_F+N_T+N_O; all fractions use original source-equivalent reams. failed_ream=N_F/Q and provider unit vector=W_F/N_F when N_F>0, so background contribution=W_F/Q exactly once; N_F=0 with demonstrated absence gives no source expansion, not division0. W_F is the sum of the actual original dispatch manufacture/inner-packing vectors assigned F, excluding inbound and outer carton. Add disjoint F inbound from a_transport; preserve S/T/O vectors and replacements. No dry/wet kg or component-mass fraction splits an environmental vector."
      inputs:
        - N_in
        - N_S
        - N_F
        - N_T
        - N_O
        - W_dispatch
        - W_F
        - responsibility_signoff
        - Q
        - cp_goods
        - cp_support
      output: "N_F/Q Product input with one original background expansion"
      source_ids:
        - ghg-product2011
    - id: c_paper
      applies_to: "failed_ream; paper_retail_service"
      rule: "water_mass_kg is the instrument result with reagent/oven blank removed once under b_paper; w=water_mass_kg/wet_sample_kg; m_dry=paper_wet_kg*(1-w). Actual net paper wet kg=gross_pack_kg-wrapper_net_kg only for directly matched same-state complete samples, excluding cartons. Scale separately measured water/sample portions by actual matched recovery/scaling_factor and propagate uncertainty; no numeric factory default, no nominal gsm-to-waste conversion. These are independent QA fields and never replace Q or direct waste net kg."
      inputs:
        - water_mass_kg
        - wet_sample_kg
        - paper_wet_kg
        - gross_pack_kg
        - wrapper_net_kg
        - sample_recovery
        - scaling_factor
        - uncertainty
        - w
        - KF_oven_temperature_C
        - KF_extraction_time_s
        - KF_water_standard
        - KF_reagent_oven_blank
        - KF_matrix_spike_recovery
        - KF_blank_correction_status
        - cp_paper_state
      output: "Wet/dry paper and moisture QA with unchanged service denominator"
      source_ids:
        - doublea-catalogue
    - id: c_power
      applies_to: "site_ac"
      rule: "For each compatible energy source apply a_shared: e_s_h=E_s*d_s_h/all_beneficiary_driver; E_h=sum_s(e_s_h) in MJ with kWh conversion3.6 once; site_ac=E_h/Q. Raw core numerator is E_h, not the displayed E_h/Q."
      inputs:
        - E_active_s
        - E_idle_s
        - E_fixed_s
        - d_s_h
        - all_beneficiary_driver
        - kWh
        - E_h
        - Q
        - cp_power
      output: "Attributed raw MJ and one normalized electricity amount"
      source_ids:
        - ghg-product2011
