    - id: c_source_history
      applies_to: "carton_input; retail"
      rule: "Keep physical source tracing and ownership independent. Physical predicted_current_ref_kg=m0_source_ref_kg-source_export_net_ref_kg-source_confirmed_missing_ref_kg; source_export_net_ref_kg=source_gross_export_ref_kg-source_actual_return_ref_kg; source_current_ref_kg=source_current_neverused_ref_kg+source_current_used_ref_kg+source_current_held_waste_ref_kg; R_source_physical_kg=predicted_current_ref_kg-source_current_ref_kg, where current is the disjoint never-used/used/held-waste source-reference portions and net exports subtract actual original-source returns once. These are traceable original-reference quantities by source portion/state, not current wet weighing or new LCI production; current carton wet kg remains separate QA. Ownership predicted_owner_unassigned_kg=m0_source_ref_kg-sum_all_h(G_source_h)-unassigned_transfer_ref_kg-unassigned_missing_ref_kg; R_source_owner_kg=predicted_owner_unassigned_kg-unassigned_neverused_ref_kg, the independently observed never-used unassigned remainder. Positive R is unexplained shortage/unlocated responsibility; negative R surplus/overassignment. G is cumulative unique first use plus assigned pre-use loss, including any known loss already assigned; unknown-owner confirmed pre-use loss appears only in unassigned_missing_ref_kg, never also G. Already-used physical losses stay in the physical ledger but do not create G again. Reclassification replaces the prior state/owner record atomically; do not renormalize known fractions over unknown portions. For each original source, B_manufacture_s_h=(G_source_h/m0_source_ref_kg)*V_manufacture_s and B_inbound_s_h=(G_source_h/m0_source_ref_kg)*V_inbound_s, independent verified stage vectors once each. V_inbound_s must first have actual trip/consignment source scope; final-owner attribution is applied once only. On every source quantity/state, owner or vector revision, replace EVERY historical beneficiary contribution: delta_man_s_h=(G_new_s_h/m0_new_s)*V_manufacture_new_s-(G_old_s_h/m0_old_s)*V_manufacture_old_s; delta_inbound_s_h=(G_new_s_h/m0_new_s)*V_inbound_new_s-(G_old_s_h/m0_old_s)*V_inbound_old_s. Keep all original pools/versions; do not charge a new full source to current Q. Original complete disposable-container vectors use C_container_h/C0_container_count independently, with the same all-history replacement method, not a formulation-mass share.  For disposable complete containers, C_container_h includes disjoint first opening and before-first-open irreversible damage/confirmed loss under c_material_event; post-use damage adds no new count. R_container_owner_count=C0_container_count-sum_all_h(C_container_h)-C_transfer_unassigned_count-C_unassigned_missing_count-C_unopened_count, the predicted minus independently observed unopened unassigned count; positive shortage/unlocated responsibility, negative surplus/overassignment. Unknown preopen-loss ownership remains unassigned. On C/C0/vector revision replace every historical contribution: delta_container_man_s_h=(C_new_s_h/C0_new_s)*V_manufacture_new_s-(C_old_s_h/C0_old_s)*V_manufacture_old_s; delta_container_inbound_s_h=(C_new_s_h/C0_new_s)*V_inbound_new_s-(C_old_s_h/C0_old_s)*V_inbound_old_s, using the original complete-container source vectors independently of formulation kg."
