    - id: c_held_state
      applies_to: "damaged_ream_waste; carton_waste"
      rule: "For every original held carrier_ID and state interval, measured_delta_held_state_kg is signed actual net mass change of the SAME identified retained portion: positive gain, negative loss. Split intervals at every physical dispatch/return/sample event. In each interval compare the same identified retained portion with unchanged traced solid constituents and no physical input/output: delta_k=(held_state_after_gross_kg-held_state_after_tare_kg)-(held_state_before_gross_kg-held_state_before_tare_kg); measured_delta_held_state_kg=sum_k(delta_k). A newly partial carrier gets a new retained_portion_ID and measured baseline after the physical event. Never count dispatch/return/sample removal as state change. Independently verify the water contribution with b_paper/c_paper fixed oven-transfer coulometric Karl Fischer method, separately matrix-validated for actual paper, wrapper and carton construction: matched distinct sacrificial initial/terminal samples with measured recovery/scaling, one reagent/oven blank correction, endpoint time/temperature/RH and uncertainty. For each actually representative matched matrix, initial_scaling_factor=initial_retained_matrix_wet_kg/initial_sample_wet_kg and terminal_scaling_factor=terminal_retained_matrix_wet_kg/terminal_sample_wet_kg; initial_scaled_water_kg=initial_sample_water_kg*initial_scaling_factor and terminal_scaled_water_kg=terminal_sample_water_kg*terminal_scaling_factor, with already blank-corrected measured water and validated recovery/representativeness. state_change_water_kg=sum_matrix(terminal_scaled_water_kg-initial_scaled_water_kg), compared with the independently weighed delta within recorded propagated uncertainty. Do not reuse a destroyed sample, infer water from wet-weight change alone, or treat unmeasured change as zero. A gross/water mismatch remains investigated unknown state change and blocks complete stock/environmental claims; no inferred air/emission or fabricated water path. sample_final_removed_kg is actual weighed final analytical-sample exit from this held inventory with unique sample_ID/original carrier_ID/recipient, counted only when NOT already in dispatch_kg. Temporarily withdrawn samples remain in separately traced held-sample stock and closing kg until actual final irreversible consumption/export or documented physical return; replace status versions without a second removal. Temporary sample location returns are internal to this held inventory, not physical_return_kg; a true re-entry after a recorded final exit is a separately weighed physical_return_kg event with its actual state and prior final-exit ID, not cancellation of real movement. Sampling already-condemned held waste never adds condemnation/generation/F again; sampling goods records the original goods condemnation once and generation only for material actually entering held stock. Actual sample treatment/transport and changed partial carriers require matching actual completion, not a second whole-carrier treatment. These wet-state/sample QA corrections never change frozen original-reference carton G_source_h/m0_source_ref_kg or duplicate original manufacturing ownership."
