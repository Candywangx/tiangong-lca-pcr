    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "All row names are specific semantic candidates with no verified Tiangong UUID. Bind only after locally retained original direct responses and exact-hash receipts establish public status, official EN/ZH name, type, state/medium, property and unit chain. Never substitute standard identifiers, search snippets or another author conclusion. Each actual extension has the same requirement."
      evidence: "Per-row original direct-read and support-row integrity evidence; unresolved list remains in manifest."
    - id: q_measure
      applies_to: "all inventory rows"
      requirement: "Record operator, time, original instrument, resolution, calibration/drift, tare/sample recovery, units, raw coverage and uncertainty. Reconcile measured parent totals, actual original-source balance, independent goods Item(s), held-waste kg and final-valid Q; no conversion of condemnation_count into kg. Missing data remain explicit uncertain gaps and block completeness."
      evidence: "Instrument and typed-ledger audit; R=predicted closing/current quantity minus independently observed closing/current quantity. Positive R is unexplained shortage; negative R unexplained surplus, consistently under b_waste/c_goods/c_source_history/c_support_material. Keep units and physical-versus-ownership ledgers separate, with investigation and correction history."
    - id: q_completion
      applies_to: "retail; residual"
      requirement: "Each necessary operation/asset/material/treatment must have presence/absence evidence, exact provider source scope and fixed rule completion. Unknown is not absent; actual unsupported state requires matching atomic extension before dataset completeness. Distinct provider IDs never prove scope independence."
      evidence: "Signed module register linked to cp_support and all actual new one-process protocols/cards."
    - id: q_bilingual
      applies_to: "all inventory rows"
      requirement: "Compare both full renderings for objects, direction/type, qualifiers, formulas/variables, units, reference denominator, conditional gates, exclusions and deduplication. Structural parity and aligned status alone are insufficient. Keep scientific applicability independently reviewable."
      evidence: "Actual bilingual reading and parser array/card/protocol/rule comparison against source."
validation_rules:
  - rule_id: v_scope
    applies_to: "all inventory rows"
    rule: "Pass b_route/b_channel with actual material/BOM/branch/on-site transaction and exclusion evidence before use; catalogue and parsed listing are specifications/leads, not quantified LCI, lot proof or complete conformity."
    source_ids:
      - un-cpc62194
      - doublea-catalogue
      - fairmart-888
  - rule_id: v_quantity
    applies_to: "all inventory rows"
    rule: "Require Q>0, every final card reference_flow basis, independent raw/attributed/final stages, conservation with investigated signed residuals and unit-compatible formulas. No nominal ream kg, constant-moisture inference, missing=0, duplicate original service or source expansion."
    source_ids:
      - ghg-product2011
  - rule_id: v_source
    applies_to: "failed_ream; carton_input; retail; residual"
    rule: "Verify per-source S/F/T/O and first-use obligations, independent inbound, whole-vector/component exclusivity, direct waste weights, true final treatment and every historical asset/digital replacement. Unknown provider separation/empty transport/capture basis blocks completeness."
    source_ids:
      - ghg-product2011
  - rule_id: v_delivery
    applies_to: "all inventory rows"
    rule: "A synchronized candidate may guide collection with unverified identities disclosed; it does not approve methodology or establish a complete business inventory. A completed dataset must satisfy c_complete and q_identity/q_completion with actual atomic extensions and independently reviewed scope."
    source_ids:
      - ghg-product2011
published_dataset_profile:
  dataset_role: "Incremental original-ream retail service; declared core until mandatory completion."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual same-configuration admitted route, explicit uncertainty and completed source/identity/coverage gates."
  excluded_use: "Whole CPC leaf; printing/cutting; nominal kg estimates; complete-business or GOODS claim from incomplete RETAIL core."
  required_metadata: "All reference qualifiers; original sources/denominators; material/BOM; pool/version; owner/stage/provider and completion register."
  required_quality_disclosure: "Unverified identities; actual incomplete modules; raw coverage/calibration/uncertainty; signed balances and all late/historical replacement versions."
  update_trigger: "SKU/BOM/coating/region/route/equipment/provider/return-policy changes; late return; revised asset lifetime/vector or original responsibility."
