iner_loss_e_h=reserved_container_count_e_h/all_reserved_container_count_e from the frozen actual pre-loss same-unit original-container reservation map, including failed/unused reservations. Require known positive all-beneficiary count for the occurring shared loss event; unknown owner/count remains C_unassigned_missing_count, never zero or renormalized known shares. Per container_ID assign first open OR preopen loss once; later post-use damage/reuse never adds manufacture/inbound. Container manufacture and independent inbound each use C_container_h/C0_container_count once, separately from formulation kg, and every C/C0/vector revision replaces all historical original owner/pool records under c_source_history. A complete cleaning service uses each pass actual m2 service numerator with these same shares; provider normalized z is restored by its actual original D before one final Q, complete scope/dedup mandatory."
