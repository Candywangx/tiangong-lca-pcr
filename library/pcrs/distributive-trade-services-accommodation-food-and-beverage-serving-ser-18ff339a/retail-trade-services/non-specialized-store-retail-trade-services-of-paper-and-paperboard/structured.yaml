          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_shared | site_ac; retail | Subdivide source meters before allocation. For each source s split measured active E_active_s, idle E_idle_s and fixed E_fixed_s in the same energy unit and reconcile their sum to its parent including closed/failure periods. Active checkout/handling/device energy uses measured engaged device seconds by every beneficiary; idle/fixed checkout/ICT/light/fan device sources use measured reserved device seconds, including empty reservations. Physical room/facility fixed sources use measured served floor m2×hours by disjoint zones/intervals, including reserved empty stock space. e_s_h=E_s*d_s_h/sum_all_h(d_s_h), then E_h=sum_s(e_s_h); never add unlike driver dimensions or divide by successful sales within a source. Unknown/unassigned drivers and a zero all-beneficiary sum block completion, not become zero energy. Meter subtraction is allowed only within a parent that includes the submeter, with circuit evidence. kWh×3.6=MJ once. | ghg-product2011 |\n| a_digital | retail | Use separate verified source vectors/units for network, payments, administration, camera capture production and retained storage. Network source connection-hours in each unique interval allocate by measured all-beneficiary reserved endpoint-connection seconds; a consignment/source tag is not final pool attribution. Payment authorizations and admin batches are unique events: measured line/task processing seconds give within-event shares summing1 over all beneficiaries, including failed attempts. Capture-production quantities must be measured in each real source unit and original capture denominator; freeze each capture source map using actual timestamped field-of-view beneficiary footprint m2×coverage seconds, disjoint zone/time and empty reservations. Retention never reallocates capture production. Storage direct-attributed mode uses verified bytes×seconds by original capture ID; aggregate-provider mode allocates the complete matching storage packet by byte-seconds then that capture's frozen original map once. Modes are exclusive. GB=10^9 bytes and GiB=2^30 bytes. Verify original provider scope; internet alone does not include payments/security/admin, and provider-covered local electricity/capital/transport must be removed from outside duplicates by actual source constituents/time/asset/stage, not provider-ID inequality. | ghg-product2011 |\n| a_assets | retail | For each homogeneous actual building/shelf/light/fan/trolley/checkout/ICT/camera model and BOM vector V, keep manufacturing at dispatch, installation, transport, event repairs and retirement stages disjoint with actual complete-package evidence. Building and shelf exposures are measured served m2×hours; powered devices and trolley use measured reserved device-hours; no guessed lives. f_expected_h=e_recorded_h/L_expected with evidenced same-unit total lifetime L. On every lifetime/vector revision replace f_old_h*V_old for EVERY historical beneficiary by f_new_h*V_new and record delta; final retirement sets f_final_h=e_actual_h/sum_all_h(e_actual_h) over the entire persistent history. Residual1-sum_old_f is QA, not an allocation shortcut. Independent repair/acquisition/retirement transport first belongs to that asset then follows these same historical fractions; an already-final-pool-attributed quantity receives no second fraction. Terminal carrier kg times f once, never times another manufacturing fraction; provider-contained retirement is not an additional foreground waste. Unknown scope/exposure blocks completion. | ghg-product2011 |\n| a_transport | retail; residual | Keep actual truck/source/trip/segment, payload and reserved original consignment map for receiving/F inbound, supplier returns, waste, assets and materials. This narrow route requires evidenced binding mass capacity and distinct same-truck loaded t*km, positive empty vehicle-km and stationary powered idle vehicle-hour source scopes; fuel/utilities must not be counted outside a provider that already includes them. c_transport fixes separate trip→consignment shares: loaded uses actual payload kg; empty uses prospectively reserved kg times actual empty km; stationary powered idle uses the same-trip reserved kg times actual powered idle hours. Include failed/unused reservations and require each known positive all-beneficiary denominator. Zero payload never erases an empty/idle source. Verified provider consignment attribution skips only the trip-share layer; provider coverage alone never proves allocation. Exact original final owner/pool/version attribution skips only its completed owner layer. An undecomposed trip bundle without the needed mode numerators/shares remains incomplete. Apply F/first-use/source owner fraction after consignment attribution; independent asset freight first belongs to its actual asset then follows the same all-history a_assets fractions and replacement versions once. Successful S manufacture/inbound remains with GOODS; T/O keep their actual original sources. Retain every failed/returned transport and handling operation. | ghg-product2011 |\n| a_material | carton_input; retail | Use a persistent original-source ownership ledger separate from the physical-state ledger. For each full-construction source s keep actual original dispatch/reference quantity m0_source_ref_kg and reference state, per carton/source_portion_ID, matching its supplier vector; whole-carton manufacture remains one full-construction source. Current wet kg is physical QA, never a new source manufacture quantity: first opening retrieves each original measured reference quantity, not its then-current wet weight. Missing original quantity/state blocks source coupling; no nominal box mass or constant-moisture inference. c_material_event fixes event→beneficiary subdivision/shares for cartons, cleaning passes, tasks, pre-use loss and complete containers. G_source_h counts first use plus disjoint irreversibly pre-use-lost portions assigned to h once; used/reused stocks never acquire source manufacture/inbound again. Confirmed loss already in G is not added again as unassigned loss; missing portions with unknown owner retain unassigned original responsibility. c_source_history conserves both ledgers independently and replaces all historical G/m0/vector allocations on revision. Separate actual manufacture and independent inbound source vectors, applying G_source_h/m0_source_ref_kg once to each. Whole original disposable-container manufacture/inbound follows its independent mutually exclusive first-open or before-first-open irreversible damage/loss count under c_material_event, with its fixed actual event shares, never formulation kg. Real reusable containers require a reviewed lifetime source under a_assets. A genuine complete m2 cleaning contract may remain intact only with signed full constituent/equipment/water/utility/transport/treatment scope, actual original denominator and the fixed per-pass cleaned-area shares; otherwise add actual atomic supplies/water/effluent. Preserve exclusive source-origin formulation states, current whole wet carrier kg and direct water/effluent methods in c_support_material; no extra customer bag without actual no-bag absence proof. | ghg-product2011 |\n\n"
