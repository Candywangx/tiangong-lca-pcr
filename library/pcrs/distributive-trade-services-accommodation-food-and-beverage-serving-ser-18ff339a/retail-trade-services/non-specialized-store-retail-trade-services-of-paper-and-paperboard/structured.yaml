system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_route
      applies_to: "all inventory rows"
      rule: "Apply only to one verified manufacturer/region/revision and original 500-sheet A4 210×297 mm 80 gsm white copier-paper SKU per pool. The evidenced example is Double A Copy Paper 80 gsm Pack500 in the manufacturer catalogue p2. Require lot-specific fibre/filler/sizing/coating declaration and complete original wrapper/closure/liner/label/adhesive BOM; these are not established by a pack photograph or this catalogue. Record the actual coating status, including absence, and do not infer uncoated from whiteness or copy suitability. Exclude coated art/thermal/self-adhesive papers, preprinted stationery, carton-board sales, pulp, wallpaper and window transparencies (32194). A conflicting/unknown material declaration blocks applicability."
      source_ids:
        - un-cpc62194
        - un-cpc32194
        - doublea-catalogue
    - rule_id: b_channel
      applies_to: "all inventory rows"
      rule: "Require dated site assortment register showing materially mixed merchandise, paper shelf selection and ordinary consumer checkout linked to actual branch/SKU/lot receipts. Fairmart888 is only a channel lead, not proof of on-site selection, stock or retail rather than wholesale. Admit physical shelf selection, cashier payment/electronic receipt and customer carry-out only; exclude specialist/wholesale, online order, click-and-collect, retailer delivery and customer journeys. Throughout the ENTIRE observation period, every served receiving/storage/display/checkout/admin/cleaning zone must have actual absence evidence for on-site printing/cutting/repacking, humidification/drying, combustion/gas, purchased heat/cold, non-refrigerant heating, refrigeration and refrigerant HVAC. Include landlord/leased/shared/off-site supplied conditioning and temporary/backup/maintenance sources, open/closed/idle intervals. Require period-complete utility bills/meter/service records, landlord/provider scope and equipment/temporary-work logs, tied to dated inspections and zone/interval coverage; a commissioning walk or change check alone is insufficient. Any actual present source or unknown interval/scope blocks this admitted route until another reviewed route applies; never record unknown as zero. Ambient storage, electric lights/fans and necessary support remain included."
      source_ids:
        - un-cpc62194
        - fairmart-888
    - rule_id: b_gate
      applies_to: "retail"
      rule: "Start at retailer receiving of finished original reams and separate shipping cartons. End each original ID at final valid customer acceptance or its documented non-service fate. Accept only the matching complete unopened undamaged count/specification and documented consumer acceptance; record moisture/damage/quantity refusal reasons. No opened ream, sheet splitting, test print or repack can become this service. Keep every attempted, refused, returned, repeated, lost, condemned and transferred event, including no-sale periods, in a prospectively fixed same-configuration pool. Close on the declared return-policy horizon with ongoing late-event revision. Q counts distinct original IDs with final valid acceptance once; revocation without movement removes that ID, financial changes alone do not. Repeated resale of one original ID never yields a second service. An all-zero Q pool remains unnormalizable and transfers no unexplained burden away."
      source_ids:
        - doublea-catalogue
    - rule_id: b_source
      applies_to: "failed_ream"
      rule: "Keep a source-parent ledger for each homogeneous original ream: supplier dispatch manufacture and original inner packing vector W_dispatch only, excluding outer shipping carton and all receiving/inbound transport. Partition original source-equivalent counts N_in=N_S+N_F+N_T+N_O. S follows finally accepted goods and is excluded from the complete incremental RETAIL service; only a separately labelled GOODS system may add W_S/Q once. F includes irreversibly failed/confirmed-lost original goods and external unaccepted retention without transferred background responsibility; failed_ream is an actual Product input N_F/Q expanded by W_F/N_F once, not a second W_F addition. F inbound transport is mandatory separately. T requires signed continuing manufacturer/inbound responsibility at the identical gate, including supplier returns/internal transfers; physical movement alone is insufficient. O retains open-stock responsibility. A returned then resold original changes the original ownership record, without repeating manufacture."
      source_ids:
        - ghg-product2011
    - rule_id: b_components
      applies_to: "failed_ream; residual"
      rule: "Use one whole original paper-plus-inner-wrapper supplier vector only when its entire environmental vector has one S/F/T/O fate. Physical paper/wrapper descendants never acquire the whole vector again. When components have different ownership, obtain actual separate supplier component vectors and original measured property quantities, add separate matching Product input cards, remove exactly those constituents from the whole source, and conserve each vector independently. Do not split a vector by component mass. Separate outer shipping cartons always have their own manufacturing/inbound source; cartons are not included in failed_ream. Paper net kg excludes wrapper, cartons and pallets but includes actual fillers/sizing/coating."
      source_ids:
        - doublea-catalogue
    - rule_id: b_paper
      applies_to: "retail; residual"
      rule: "No nominal sheet-area×gsm, catalogue pack kg or factory moisture may replace receiving/dispatch/waste weighing. Sample each actual lot at receiving and cutoff plus every damage/return change: retain separately identified sacrificial matched reams for paper and wrapper net kg, sample seal/time/temperature/RH and oven-transfer coulometric Karl Fischer water determination, validated for the actual paper matrix, yielding wet-basis fraction w. Sampling consumes those originals and becomes F if no valid service. m_dry=paper_wet_kg*(1-w) is stock QA only; never normalize Q by dry mass or infer paper loss/environmental water emission from wet-weight loss. Unopened packaging does not establish constant w. Use certified water standards, reagent/oven blanks and matrix spike recovery at documented validated oven temperature/extraction time. water_mass_kg is the already blank-corrected instrument water result; do not subtract the same blank again. Changed moisture requires measured endpoint sample scaling/recovery and uncertainty, no invented re-use of destroyed aliquots. Record leaks/condensate/room-transfer pathways if observed; unknown water fate stays an investigated balance gap and blocks a complete environmental claim until a reviewed matching transfer/carrier extension exists."
      source_ids:
        - doublea-catalogue
        - xerox-paper-storage
    - rule_id: b_core
      applies_to: "all inventory rows"
      rule: "The displayed core covers attributed site AC, failed original ream manufacture, outer-carton first use, measured specified waste carriers and service output. It is a partial incremental foreground until c_complete restores every mandatory support module under a_shared, a_digital, a_assets, a_transport and a_material. Required support includes receiving/handling/return transport; building, shelf, lights/fans, manual trolley, checkout and ICT/camera assets; payment/network/security/admin operations; cleaning and actual store-consumed supplies. Each actual additional exchange must have an atomic bilingual card, actual process protocol, identity/property/unit/state and provider boundary before dataset completeness. No numerical Item aggregate for unlike devices or sum of repair-material kg is a complete asset."
      source_ids:
        - ghg-product2011
    - rule_id: b_waste
      applies_to: "damaged_ream_waste; carton_waste"
      rule: "Waste quantities are direct actual consignment net kg at current state, with tare/scale and actual constituents. Do not subtract retained/reused stock from direct dispatch kg. damaged_ream_waste admits only a real whole discarded paper-plus-original-wrapper carrier with signed receiver acceptance of all actual constituents/state and a matching full-treatment boundary; carton_waste is separate flattened corrugated shipping carton with its actual adhesive/ink. A license or collection receipt is not full treatment. Use unique finally completely treated same-state net carrier kg for treatment provider coupling; keep all rejected/returned/partially treated dispatch, handling and transport. held_predicted_close_kg=opening_held_kg+generation_kg+physical_return_kg+measured_delta_held_state_kg-dispatch_kg-sample_final_removed_kg-confirmed_missing_held_kg; R_held_kg=held_predicted_close_kg-closing_held_kg=signed_residual_kg. Positive R means unexplained shortage; negative R means unexplained surplus. Opening/inflows/exits and independently observed closing remain typed actual kg; no residual becomes fictional dispatch or treatment. Condemnation is goods→held waste once, not a second goods exit at waste dispatch. Changed/partial carriers and separated wrapper/paper need matching atomic extensions before completeness; no automatic recycling credit.  Apply c_held_state for independently measured signed moisture/state change and final sample removal not already in dispatch; unknown state change is not zero. These are current wet-kg stock corrections only, never corrections to frozen original-reference carton G/m0."
      source_ids:
        - ghg-product2011
