      collection_method: "Read actual provider source quantities/scopes, event direct subdivisions, measured per-pass disjoint cleaning m2 including failed cleaned zones, same-configuration enclosed ream IDs, actual task processing seconds and frozen pre-event source reservations. Record original source m0/reference state, independent complete-container count, manufacture/inbound vectors and every historical replacement under c_material_event/c_source_history. For transport retain actual loaded/empty/stationary-powered-idle mode numerators, all same-trip payload/reserved-kg map and separate source-coverage/allocation layers under c_transport. For all observation intervals and served zones obtain bills/meters/landlord/shared/leased and temporary-backup/maintenance source records and dated inspections proving b_channel exclusions throughout open/closed/idle periods; unknown intervals block route. Existing core-linked views read originals once; actual atomic extensions get real one-process views without repeated measurement/normalization.  Track each complete disposable container_ID from unopened state to either first opening or mutually exclusive preopen irreversible damage/confirmed loss, recording signed exclusive owner or frozen same-unit reserved-container-count map and all historical C/C0/vector replacements under c_material_event/c_source_history. Post-use damage is not another original source."
