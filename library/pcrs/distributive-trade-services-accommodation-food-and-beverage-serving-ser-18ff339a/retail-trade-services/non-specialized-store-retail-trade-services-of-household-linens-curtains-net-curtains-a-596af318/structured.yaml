    - id: calc_transport
      applies_to: "completion modules"
      rule: "For each actual loaded trip calculate sum(cargo_kg * route_km)/1000 t*km with declared cargo/capacity allocation over all beneficiaries; bulky towel loads may require measured occupied-volume/capacity allocation with explicit evidence. Verify provider includes actual empty legs and stationary idling. If not, add non-overlapping measured empty vehicle-km and stationary idle hours with actual fuel/operation source records; zero t*km never makes empty activity zero. Use either provider transport package with evidenced fuel/assets/maintenance scope OR expanded actual fuel, vehicle operation and asset rows, removing overlaps by trip ID. Upstream successful-goods receiving trips stay with parent; failure fraction follows calc_background once."
      inputs:
        - cp_transport
        - cp_modules
        - trip_id
        - cargo_mass_by_beneficiary
        - occupied_volume
        - rated_capacity
        - route_km
        - "loaded/empty"
        - stationary_idle_h
        - fuel_id
        - fuel_kg
        - provider_included_return_empty
        - overlap_ids
        - Q
      output: "disjoint actual raw transport activity source rows"
      source_ids:
        - ghg-product-2011
    - id: calc_complete
      applies_to: "all processes"
      rule: "Mandatory modules are premises/building manufacture-installation/retirement; shelves; checkout terminal; lighting; HVAC; reusable floor-cleaning tools and their actual maintenance/laundering; non-overlapping logistics; waste/effluent transport and treatment; and B_F upstream manufacture/original packaging/receiving transport. For every module m and atomic source row j, restore raw R_mj = normalized_x_mj * original evidenced denominator D_m, or use evidenced raw R_mj directly, never both. For a source-wide total apply the justified all-beneficiary driver once to obtain A_mj; already attributed rows keep A_mj = R_mj. Remove exact duplicate source_exchange_id/version/pool and all overlaps in circuit/asset/trip/treatment registers. Sum only identical actual exchange, direction, flow type, property, unit, state and boundary: N_j = A_direct_j + sum(A_mj). Convert compatible units explicitly, retain distinct species/carriers, and calculate final N_j/Q once. Never sum kg with MJ, impacts with activities, or raw with normalized rows. Append actual atomic cards/protocols/calculations in both languages and sync before a complete dataset claim. Missing raw denominator, original source rows, method, route or provider boundary blocks completion; maintain partial label and list unresolved modules."
