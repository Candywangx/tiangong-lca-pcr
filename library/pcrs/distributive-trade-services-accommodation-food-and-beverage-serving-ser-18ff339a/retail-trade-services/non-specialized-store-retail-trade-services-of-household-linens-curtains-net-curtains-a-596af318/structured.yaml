allocation_rules:
  - rule_id: alloc_direct
    applies_to: "all inventory rows"
    rule: "Prefer disjoint direct meters and event attribution. For shared counter operation use observed active transaction seconds; for stock space use occupied volume-hours; for floor cleaning use actually cleaned area-times per event; allocate the complete shared pool over all actual beneficiaries. Keep closed/idle/failure periods in the prospectively fixed same-configuration pool. Zero total drivers block allocation unless a physically justified positive capacity/reservation-time driver was declared prospectively before opening the pool and covers every beneficiary including idle periods; a zero-output pool is unnormalizable and is not discarded."
    source_ids:
      - ghg-product-2011
  - rule_id: alloc_assets
    applies_to: "completion modules"
    rule: "For building, shelf, checkout terminal, lighting, HVAC and reusable mop/bucket, calc_assets uses persistent asset IDs and all-beneficiary lifetime exposure. Separate manufacture/installation from actual operation, maintenance events and terminal treatment. Device acquisition/retirement counts validate the ledger; they are not additional consumed devices beside lifetime fractions. No automatic credit for scrap, donation, supplier returns or resale."
    source_ids:
      - ghg-product-2011
  - rule_id: alloc_normalize
    applies_to: "all inventory rows"
    rule: "First retain raw event/meter totals, then attribute once, then divide the attributable numerator once by final Q. Apply no second SKU, destination, composition or responsibility fraction to a quantity already selected for that cohort. No allocation by sales price is prescribed."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_stock
      process_id: "receiving"
      flow_role: "Original towel lineage and physical fates"
      record_type: "event_ledger"
      raw_fields: "pool_id; item_id; SKU; supplier_lot; pack_BOM; cotton/trim composition; finish; colour; dimensions; gsm; moisture/state; event_id; actual_date; receiving_net_kg; gross_handover; physical_return; acceptance; revocation; refund_only; supplier_return; external_retention; stock_open; stock_close; losses; waste_ticket; tare; recipient; responsibility_owner; B_S; B_F; B_T; B_O; stock_open; stock_close; receiving_net_kg; gross_handover; physical_return; supplier_return; external_retention; losses; waste_ticket; consignment_gross; tare; waste_open; generation; waste_close; receiving_gate; original_receiving_equivalent_kg; original_m_i; p_ik; z_iS; z_iF; z_iT; z_iO; P_zk; lot_moisture_at_each_gate; repeated_net_weights; signed_environmental_exchange_kg; E_env; carrier_component_masses; whole_pack_handover_net_kg; moisture_drift_kg; uncertainty; unique_background_parent_id; responsibility_owner; pack_BOM; B_S; B_F; B_T; B_O"
      collection_method: "At receiving bay weigh actual lot on a calibrated scale, retain tare and pack-BOM evidence; scan each handover/return/quarantine/dispatch and investigate count/mass mismatches. Measure lot moisture with a calibrated method suitable for the actual finish and retain paired repeated calibrated net weights at receiving, storage and dispatch; record ambient exposure, observed mass drift, other actual transfers and signed uncertainties independently from counted losses. Moisture condition is observed, not an assumed dry factor."
