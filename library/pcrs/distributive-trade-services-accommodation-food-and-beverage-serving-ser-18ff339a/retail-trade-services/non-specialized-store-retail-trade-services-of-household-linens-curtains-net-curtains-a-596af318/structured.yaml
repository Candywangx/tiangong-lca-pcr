system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: bound_scope
      applies_to: "all processes"
      rule: "Apply only the section 2 route and qualifiers. Confirm original label/tie/wrapper composition and handover state per lot; visible stains, odour, dampness, mould, tears or an altered required pack trigger quarantine and recorded disposition. No retail laundering or disinfection of merchandise is assumed. If such treatment occurs, this route is inapplicable until a separately reviewed transformation extension is authored in both languages and synced."
      source_ids:
        - ikea-towel-spec
    - rule_id: bound_partial
      applies_to: "all processes"
      rule: "Direct foreground includes measured counter circuits, newly added bag/receipt, actual original-pack waste, failed towel fates and floor cleaning. It excludes merchandise manufacture and inbound transport for successful goods, customer travel/use/end-of-life and all unexpanded facilities/assets/logistics modules. This is a partial increment; a complete retail service requires calc_complete, calc_assets, calc_transport and calc_background without overlapping direct rows."
      source_ids:
        - jrc-retail-2013
    - rule_id: bound_ownership
      applies_to: "receiving"
      rule: "Keep unique receiving lot/item lineage through internal moves, return, reopening and resale. Sold merchandise manufacture and transport to the same receiving gate remain a separately disclosed parent responsibility B_S. Assign original-gate-equivalent kg/BOM burdens once among B_S, retailer failure B_F, transfer B_T and open B_O. Supplier-return and externally retained failure require named recipient, physical state, responsibility contract and continuation; neither is automatically waste. Original packaging production follows the same parent ownership, but actual retail removal treatment remains here."
      source_ids:
        - ghg-product-2011
    - rule_id: bound_extensions
      applies_to: "all processes"
      rule: "Prove presence/absence for each conditional row with invoices, stock records, site walk and waste tickets. Other real material, cleaning reagent, wrapping, contamination, direct outside release or changed towel state requires a named atomic card, single-process protocol, property/unit, fate and upstream owner in both languages before completeness. Unknown is not zero. A complete real device, defined mixture or evidenced homogeneous service stays one exchange; do not add its constituents again."
      source_ids:
        - jrc-retail-2013
