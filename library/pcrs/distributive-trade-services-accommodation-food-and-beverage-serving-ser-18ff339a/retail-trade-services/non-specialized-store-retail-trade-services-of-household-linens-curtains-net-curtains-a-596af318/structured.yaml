  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Reference service and each unbound row need official direct-read UUID/type/state/property/unit/medium verification plus matching supplier formulation/specification and quantity/background evidence before dataset release. No service identity can use a towel-production UUID. Counter AC identity alone supplies no provider mix."
      evidence: "Direct original records and integrity receipts; supplier SKU/BOM/SDS; quantities and compatible background boundary"
    - id: quality_cohort
      applies_to: "service_out; all processes"
      requirement: "Declare prospective pool and cutoff before allocation; retain failed/zero-sale events and reconcile late acceptance changes to original numerator and denominator. Unknown retained/customer failure state or background owner blocks full inventory."
      evidence: "Item/event lineage, acceptance history, stock and responsibility ledgers, change log"
    - id: quality_measurement
      applies_to: "all inventory rows"
      requirement: "Calibrated raw measurements and uncertainty must cover actual period, configuration, moisture and temperature. Manufacturer nominal dimensions/gsm/package masses, shrinkage/care limits or first-wash advice are not inventory defaults, retail loss factors or claims that washing occurred. Investigate residuals, never silently set unknowns to zero."
      evidence: "Calibration, lot weights, observation, original field records and signed residual investigation"
    - id: quality_completion
      applies_to: "all processes"
      requirement: "Each conditional card has positive/negative presence evidence. Complete inventory needs disjoint modules and actual row expansion under calc_complete. Asset residuals, maintenance parts, empty transport, HVAC final outside fates and whole-liquid balances must reconcile; unknowns remain explicit and prevent complete status."
      evidence: "Module/source-row register, lifecycle ledger, trip records, treatment tickets, bilingual actual cards and overlap audit"
validation_rules:
  - rule_id: valid_reference
    applies_to: "service_out"
    rule: "Require one declared actual SKU/configuration, unique positive Q and exact service/reference-output display match. Q = 0 is an explicit unnormalizable result; do not publish normalized values. Unresolved service UUID is candidate identity only, not verified dataset identity."
    source_ids: []
  - rule_id: valid_accounting
    applies_to: "all processes"
    rule: "Require calc_stock physical balance separate from calc_background ownership and calc_accept denominator, plus original-cohort late corrections. Confirm every original item background is assigned once and no ancestor burden is duplicated among waste descendants."
    source_ids:
      - ghg-product-2011
  - rule_id: valid_projection
    applies_to: "all inventory rows"
    rule: "Require all mandatory duties in supported rule/protocol/calculation/quality fields, matching bilingual IDs, formulas, qualifiers and conditions. Every card links exactly one real protocol process. Preserve verified UUID/property/unit chain and unresolved identities; unknown quantities, absent sources and partial modules are not passed completeness."
    source_ids: []
  - rule_id: valid_module
    applies_to: "all processes"
    rule: "Before claiming full service, apply calc_complete and independently verify raw-denominator restoration, source-row unit compatibility, exact-ID deduplication, final single normalization, persistent assets, actual empty legs, HVAC external destinations and whole-liquid evidence. Disclose exclusions and unresolved uncertainty, never a complete-standard conformity claim from these design rules."
    source_ids:
      - jrc-retail-2013
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "Partial incremental foreground retail service; only calc_complete-qualified expansion may claim complete retail service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Combine with disclosed B_S/Q successful-goods parent and non-overlapping modules on the same final denominator"
  excluded_use: "Textile manufacture, towel use/washing/drying, broad CPC leaf equivalence, curtain installation, specialist stores or delivery services"
  required_metadata: "actual supplier SKU and lot; colour; dimensions and surface density; cotton composition including attached trims; finish; measured receiving net mass and moisture condition; original tag/tie/wrapper BOM and configuration; receiving gate; store and counter route; pool dates and configuration; final acceptance and return cutoff; final fate and background owner; partial boundary and completion-module versions"
  required_quality_disclosure: "Original measurements, unknowns and identities; cohort corrections; asset/version ledgers; module coverage and missing rows; geography/technology/period; uncertainty and parent background responsibility"
  update_trigger: "SKU/pack/state change, route or supplier change, late return, meter correction, lifetime revision or new module/provider evidence"
data_sources:
  - id: "ecover-cleaner-formulation"
    type: "handbook"
    reference: "ECOVER Belgium N.V., Technical Data Sheet, 24/05/2017, formulation3000714, 5L barcode5412533000061; https://cdn-s1.lyreco.com/staticswebshop/sds/ITIT/TS_ITIT_4192577_2018-04-03.pdf"
    used_for: "One historical real formulated floor cleaner and physical container; actual batch/SDS/formulation and package must match before use. No dose, concentration fraction, package weight, density or present-day formulation equivalence adopted"
  - id: "ikea-towel-spec"
    type: "handbook"
    reference: "IKEA Taiwan, VÅGSJÖN 405.762.55; https://www.ikea.com.tw/en/products/bath-textiles/towels/vagsjon-art-40576255"
    used_for: "Real illustrative cotton terry object and nominal specification only; actual receiving mass, packaging, composition and retail route require primary collection; care advice is outside retail process"
  - id: "jrc-retail-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Environmental Management Practice in the Retail Trade Sector, EUR 25998 EN, 2013, executive summary and lighting section; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Qualitative retail energy, supply-chain, logistics and waste scope; no benchmark values or claim that this source mandates the PCR equations"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard, 2011, chapter 9 p.63; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision before allocation and physical relationships; specific cohort, asset and completion equations are declared PCR collection design, not quotations or full-standard conformity"
