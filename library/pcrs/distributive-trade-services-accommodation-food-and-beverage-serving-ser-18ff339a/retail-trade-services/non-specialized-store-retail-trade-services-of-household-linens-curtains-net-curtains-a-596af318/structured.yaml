  calculation_rules:
    - id: calc_accept
      applies_to: "service_out"
      rule: "Q = count of unique original-item lineages with valid final qualified acceptance at the declared cutoff. Gross handovers, refusal, repeated scans, internal transfers and revoked acceptance are not new output. Resale after return has at most one final valid service for that original item. Revoke Q even if customer retains the failed item; financial refund/discount alone does not revoke acceptance. Late returns/decisions revise original-pool Q, costs and fates with actual dates; do not export the correction into a fresh pool. Q = 0 remains an unnormalizable disclosed pool."
      inputs:
        - cp_counter
        - cp_stock
        - final_acceptance_id
        - revocation_date
        - refund_only
        - item_id
      output: "Q"
      source_ids:
        - ghg-product-2011
    - id: calc_stock
      applies_to: "supplier_towel; external_towel; waste_towel"
      rule: "Reconcile physical item and actual state-specific mass ledgers: opening + new receipts + physical customer returns + internal_in = closing + gross physical customer handovers + supplier handovers + actual stock losses + internal_out. External retained failure is a classified subset of earlier gross handovers, never another removal. Internal moves cancel between linked locations and do not acquire another manufacture burden. Count closure and mass closure are separate. For each consistent actual-state carrier kg balance, add signed independently measured net environmental exchange E_env once to the left side; observed moisture/storage drift is an independent check on that exchange, never a second balance term. Keep towel-body kg and every original-pack carrier kg in separate ledgers; an intact packaged handover card is a whole physical carrier, whose recorded component masses reconcile to the same whole weight without adding the whole and its constituents as duplicate exchanges. Measure lot moisture and calibrated repeated net weights at receiving, storage and dispatch, record water uptake/loss and other actual transfers with signed uncertainty. Do not force a kg residual into towel loss, even for a dry unused towel. Unexplained residual blocks mass closure. Waste dispatch is a separate consignment ledger; historical receiving-equivalent background mass is not a present physical handover."
      inputs:
        - cp_stock
        - stock_open
        - stock_close
        - receiving_net_kg
        - gross_handover
        - physical_return
        - supplier_return
        - external_retention
        - losses
        - lot_moisture_at_each_gate
        - repeated_net_weights
        - signed_environmental_exchange_kg
        - E_env
        - carrier_component_masses
        - whole_pack_handover_net_kg
        - moisture_drift_kg
        - uncertainty
      output: "reconciled physical fates"
      source_ids: []
    - id: calc_share
      applies_to: "counter_ac; cleaning_water; cleaning_detergent; cleaning_effluent"
      rule: "For a measured shared pool X, X_c = X * d_c / sum(d_all), with all beneficiaries included and sum attributed quantities = X. Use active transaction seconds for checkout, cleaned area-times for cleaning and occupied volume-hours for storage; direct subdivision precedes sharing. Include idle/closed/failed periods in the prospective configuration pool. If the driver is unknown or zero, use only the positive, physically justified all-beneficiary capacity/reservation-time driver prospectively declared before opening that pool, covering closed/idle/failure intervals; absent such evidence the allocation is incomplete, never zero. Directly attributed X_c receives no second fraction."
      inputs:
        - cp_counter
        - cp_cleaning
        - cp_modules
        - raw_pool_X
        - d_c
        - d_all
        - "idle/closed_seconds"
      output: "attributable raw numerator"
      source_ids:
        - ghg-product-2011
    - id: calc_meter
      applies_to: "counter_ac"
      rule: "kWh_raw = (meter_end - meter_start) * traceable multiplier after reset corrections. Subtract a submeter only if its circuit is inside the measured parent boundary and remove it exactly once. Disjoint circuit readings are added without subtraction. Apply calc_share only to the remaining measured shared pool, convert 3.6 MJ/kWh and divide by Q once; independently reconcile whole-store electricity to direct circuits plus completion-module circuits."
      inputs:
        - cp_counter
        - "meter_start/end"
        - multiplier
        - parent_meter_id
        - circuit_id
        - reset_correction
        - Q
      output: "counter_ac in MJ per reference flow"
      source_ids: []
    - id: calc_material
      applies_to: "bag_ldpe; receipt_paper"
      rule: "Bag raw consumption = opening unused stock + acquisitions + unused returns - closing unused stock - intact unused supplier returns; reconcile actual issued, discarded and missing quantities, retaining rejected transactions. Paper raw consumed mass uses the same unused-roll balance on net-paper kg only: actual gross roll kg minus measured external tare and measured empty core kg for the actual BOM. Keep core acquisition/stock/dispatch in a separate carrier ledger. A supplier background per net-paper kg includes attributable core manufacture once; if that provider excludes core, the mandatory completion adds an explicit paperboard-core production row with actual attributed core kg and compatible provider, removing all overlap. Do not use catalogue roll weight or assume a coreless roll without actual evidence. LDPE consumption includes issued, discarded and unresolved missing bags; actual discarded bags enter waste_bag and do not gain another production input. Core kg and discarded bag kg have independently measured consignment/tare/fates. Printed opening/closing intermediate stocks are distinct from unused paper-roll stock; printed opening/closing intermediate stocks reconcile issued and failed prints separately, not as unused-roll stock. If the bag/paper mass is directly issued and attributable, do not apply the stock consumption balance a second time. Record actual formulation and unit mass from calibrated lot weighing. Attribute raw consumption once then divide by Q."
      inputs:
        - cp_counter
        - unused_stock_open
        - acquisitions
        - unused_returns
        - unused_stock_close
        - supplier_returns
        - "printed_stock_open/close"
        - paper_issued
        - failed_print_kg
        - roll_id
        - roll_BOM
        - roll_gross_kg
        - external_roll_tare_kg
        - actual_core_material
        - empty_core_net_kg
        - net_paper_kg
        - core_stock_open
        - core_acquired_kg
        - core_stock_close
        - core_dispatch_net_kg
        - core_background_mode
        - provider_roll_scope
        - actual_discarded_bag_consignment_net_kg
        - actual_paperboard_core_consignment_net_kg
        - bag_waste_generation_kg
        - "bag_waste_stock_open/close"
        - Q
      output: "bag and paper kg per reference flow"
      source_ids: []
    - id: calc_dispatch
      applies_to: "waste_carton; waste_film; waste_tag; waste_towel; waste_receipt; waste_bag; waste_receipt_core; waste_cleaner_bottle"
      rule: "For each actual state-specific consignment, dispatched kg = measured gross - actual tare. Sum attributed consignment net masses then divide by Q once. Independently check opening waste + generation - dispatched - closing waste = investigated residual; do not subtract stocks or generation again from actual dispatch. Tag+fastener is one whole carrier only where physically collected together; do not count components again. Original packaging production remains with its merchandise parent, but these real removal/treatment quantities remain."
      inputs:
        - cp_stock
        - cp_counter
        - waste_ticket
        - consignment_gross
        - tare
        - waste_open
        - generation
        - waste_close
        - Q
      output: "each actual waste carrier kg per reference flow"
      source_ids:
        - jrc-retail-2013
    - id: calc_liquid
      applies_to: "cleaning_water; cleaning_detergent; cleaning_effluent"
      rule: "Choose and record one effluent mode: direct whole-carrier net kg, OR measured discharged m3 * actual whole-effluent density kg/m3, OR full-liquid reconstruction in kg. Reconstruction = opening source-pool liquid + imported water + measured concentrate_to_liquid_kg + measured dirt/other source-pool mass entering liquid - closing source-pool liquid - measured evaporation - separately exported source-pool solution mass - other measured source-pool liquid exports. All terms are whole liquid/source-origin masses; exclude new external dry cloth/container mass and do not repeat water contained in concentrate. A volume water balance alone cannot reconstruct whole effluent mass. Direct discharge modes receive no evaporation/storage subtraction; supply balance is independent. Concentrate stock consumption = opening usable formulation + acquisitions - closing usable formulation - intact supplier returns; reconcile it to concentrate_to_liquid_kg + actual bottle_residue_kg + other evidenced formulation fates. Bottle residue is included once in whole bottle waste and is not cleaning effluent. Retain source formulation boundary and source package production once. Record out-of-pool liquid imports separately, allocate their treatment responsibility without presenting them as source-pool generation. Apply cleaned-area attribution once and /Q once."
      inputs:
        - cp_cleaning
        - effluent_mode
        - effluent_net_kg
        - effluent_m3
        - density_kg_m3
        - temperature
        - "liquid_open/close"
        - imported_water_kg
        - concentrate_kg
        - "cleaner/dirt_import_kg"
        - evaporation_kg
        - separately_exported_solution_kg
        - whole_liquid_exports
        - out_of_pool_import_kg
        - concentrate_to_liquid_kg
        - concentrate_stock_open
        - concentrate_acquired_kg
        - concentrate_stock_close
        - concentrate_supplier_return
        - bottle_residue_kg
        - Q
      output: "actual source-pool attributable whole-carrier kg per reference flow"
      source_ids: []
    - id: calc_background
      applies_to: "supplier_towel; external_towel; waste_towel; service_out"
      rule: "For original item i retain measured receiving net towel mass original_m_i (kg) and separate original pack BOM p_ik (kg of each physical carrier k per item). Assign exclusive original-item ownership indicators z_iS/z_iF/z_iT/z_iO summing to 1; do not turn descendants or internal moves into new original items. B_z = sum_i(original_m_i * z_iz), measured original-gate towel-kg equivalent, and P_zk = sum_i(p_ik * z_iz), separate original pack-carrier kg. Thus B_total = B_S + B_F + B_T + B_O and each P_total,k = sum_z(P_zk). These are physical activity amounts, never impact burdens; connect each to matching provider process per source unit only after compatibility checks. No impact value is added to kg/BOM, and one service Item(s) has no fixed kg. B_S/Q is disclosed separately for downstream successful-merchandise production and receiving transport; never assume 1 towel or nominal kg equals measured parent background. Add B_F/Q with actual upstream production, original packaging and same-gate inbound transport for retailer-responsible failed goods to completed retail service. B_T requires explicit recipient continuation; if unknown retain unresolved responsibility, not a zero or automatic credit. Return/resale revises this partition once, not a new receiving burden. Descendant waste carriers do not each reacquire the original towel background."
      inputs:
        - cp_stock
        - cp_transport
        - cp_modules
        - receiving_net_kg
        - original_m_i
        - p_ik
        - z_iS
        - z_iF
        - z_iT
        - z_iO
        - P_zk
        - pack_BOM
        - B_S
        - B_F
        - B_T
        - B_O
        - responsibility_owner
        - upstream_parent_trip
        - Q
      output: "disjoint successful-parent disclosure and failure background"
      source_ids:
        - ghg-product-2011
    - id: calc_assets
      applies_to: "completion modules"
      rule: "For each complete building/shelf/POS/lighting/HVAC/mop/bucket asset a, use current beneficiary exposure e_ac divided by expected total all-beneficiary lifetime exposure L_a: f_ac = e_ac/L_a, with persistent cumulative fractions <= 1 and L_a >= observed total exposure. Building exposure is occupied floor-area-hours including closure; shelf is occupied capacity-volume-hours; terminal/lighting/HVAC/tools use justified all-beneficiary capacity-hours including idle periods. Physically justified capacity/reservation-time drivers and every idle-period beneficiary are prospectively declared before the pool opens; do not choose a convenient retrospective fallback. On life revision, recompute and replace earlier version allocations; book signed beneficiary/period differences, never restart manufacture. At retirement use actual total all-life exposure E_a = sum(e_ab over every beneficiary and period), recompute every final fraction e_ab/E_a and replace all historical beneficiary allocations with signed corrections; distribute any rounding remainder over those same actual all-life exposures, never give 1 - prior fractions only to the latest period. Reconcile all final fractions = 1. Apply f_ac once to disjoint manufacture/installation source rows and separately once to actual terminal carrier/treatment responsibility, never f_ac squared. Direct terminal net weighing already excludes removed parts; component-BOM reconstruction is an exclusive alternative and removes evidenced parts once. Maintenance replacements, mop laundering, consumables and removed parts use actual event records, not unrelated masses combined into a fictitious complete device. Provider-included operations/maintenance/retirement are excluded from separate rows."
      inputs:
        - cp_assets
        - cp_modules
        - asset_id
        - exposure_current
        - expected_lifetime_total_exposure_L
        - allocation_version
        - prior_allocations
        - residual
        - terminal_mode
        - terminal_net_carrier_kg
        - component_BOM
        - maintenance_event_id
        - prospective_driver_version
        - pool_open_date
        - exposure_all_periods_beneficiaries
        - actual_all_life_exposure_E_a
        - signed_historical_corrections
        - Q
      output: "raw attributed asset/event/terminal source rows for calc_complete"
      source_ids:
        - ghg-product-2011
    - id: calc_hvac
      applies_to: "completion modules"
      rule: "Expand actual lighting/HVAC operating circuits, purchased heat or each fuel, each refrigerant species and maintenance/treatment carrier into distinct real cards with state, property/unit, direct records and provider exclusions. A leak into store air is an internal source, not automatically an elementary outside emission. For each actual species and circuit, choose one initial gate: recorded period-opening contained charge OR commissioning factory charge at commissioning gate, never both. A whole charged device entering during the pool starts its own initial-gate record; its contained receipt is not another refill on a pre-existing circuit. Circuit balance is opening_charge + measured virgin_charge_from_supply + measured_reused_recovery - closing_charge - measured_circuit_extraction - X_intact = total_circuit_loss. X_intact is actual species kg still contained in a complete device leaving at recorded retirement/transfer handoff. For each physical portion, contained-charge handoff and circuit extraction are mutually exclusive; actual partial extraction and residual intact handoff can coexist only as measured disjoint portions. Verify X_intact from traceable qualified service/charge records or calibrated recovery-characterisation measurements on a comparable independently sampled portion, with device ID, actual gate, state, uncertainty and named recipient; a nameplate maximum is not measured retained charge. Export X_intact inside the actual complete-device carrier/treatment boundary once, never as an elementary release or a second refrigerant transfer beside that whole carrier. Unknown contained charge blocks closure, not zero. Partition this measured residual by actual leak location into measured store_internal_source, direct_outside_source and unresolved_loss; do not assume an outdoor-unit leak enters room air. Recovery inventory separately closes recovered_open + circuit_extraction_received + external_recovery_received - recovered_close - reused_to_circuit - recovery_shipped_out - measured_recovery_losses = residual. Virgin supply inventory separately closes supply_open + purchases - supply_close - charge_to_circuit - supplier_returns - measured_supply_losses = residual. Link actual extraction and receipt IDs once; recovery_shipped_out leaves recovery inventory only, not the circuit again. Factory initial-charge production is included once in the complete-asset manufacture background; exclude it from separate operational refrigerant acquisition. Verify that asset provider includes the actual initial charge; if excluded, complete its manufacture module with the actual first-charge production source once and retain that boundary correction. Keep on-site internal stock/reuse internal and do not re-add original manufacture for reuse. For externally purchased reclaimed product refrigerant, use a declared recycled-content boundary: assign actual supplier recovery/reclamation, purification/conditioning and delivery to the recovered input kg; earlier virgin manufacture stays with its original prior owner and is not re-added. Verify supplier scope and remove included overlaps once. An external received waste refrigerant carrier is not a reclaimed product: record its actual recovery treatment and responsibility before any reusable product output, with separate verified state/type cards. Unknown provenance or provider scope blocks completion, never a zero-production assumption. Partition actual recovery/supply losses by their measured indoor/outside location too. Reconcile only store_internal_source plus actual indoor recovery/supply losses and measured other internal sources to store-air opening/closing species storage, captured/condensed species with actual terminal carrier, and measured outlet flux. For the raw absolute inlet/outlet mode, measure species concentration, calibrated carrier flow, gate, actual temperature/pressure and time coverage at both inlet and outlet; compute net room-to-outside transfer = integrated actual outlet species kg - integrated actual inlet/background species kg on the same declared basis. Actual inlet/background is measured or supported by bounded actual sampling with uncertainty, never assumed zero. Final outside flux is actual direct_outside_source plus that measured net room-to-outside transfer and actual outside recovery/supply losses, without adding internal generation again. A final differential or already background-corrected measurement is an exclusive mode and must not receive inlet/background subtraction again. Unresolved loss location or state blocks completion. Calibrated cylinder scales and each service interval capture additions/extractions/stocks; calibrated species-specific concentration/flow sampling at final outlet spans all actual operation and idle modes, with sampling uncertainty and nonzero unknown modes blocking completion. Direct final differential measurements or already blank-corrected rates are exclusive alternatives to inlet/outlet subtraction; remove background once, retain signed negative findings for investigation, and do not clamp or credit them. Recovery sent out is not another contained-transfer subtraction. Condensate entering cleaning drain is a disjoint measured whole carrier or explicit portion of that drain, never both an air emission and liquid export. Unknown final destination, recovery or provider scope blocks complete inventory."
