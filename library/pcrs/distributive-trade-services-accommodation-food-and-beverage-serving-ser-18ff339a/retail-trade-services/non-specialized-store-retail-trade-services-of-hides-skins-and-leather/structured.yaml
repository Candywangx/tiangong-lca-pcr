    - id: calc_removed_load_cell
      applies_to: "removed_load_cell"
      rule: "terminal_fraction = lifetime_pool_capacity / lifetime_all_capacity; T_removed_load_cell = sum((gross_kg - tare_kg) * terminal_fraction); removed_load_cell_per_service = T_removed_load_cell / N. Use only this actually removed part’s lifetime capacity-time through its matched scale_load_cell work-order removal date, including allocated idle responsibility; no later future beneficiaries exist. Reconcile maintenance_id and removed_part_id against the paired installed part and one-to-one removed/replacement counts. Do not independently include an original cell still present inside retired_scale. Final fractions sum to one. Replace prior_terminal_attribution for the original pool with the revised T, record the delta separately, and do not add both versions or the delta to T. Never subtract earlier_removed_kg from an already net carrier or multiply a manufacture fraction again."
