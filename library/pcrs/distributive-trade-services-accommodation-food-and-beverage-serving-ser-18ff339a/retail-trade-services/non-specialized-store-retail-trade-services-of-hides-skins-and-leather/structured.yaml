    - id: calc_scale_load_cell
      applies_to: "scale_load_cell"
      rule: "event_beneficiary_fraction = beneficiary_driver / all_beneficiary_driver from actual scale tasks, with documented idle responsibility retained; Part_attr = sum(actual installed_count * event_beneficiary_fraction); part_per_service = Part_attr / N. A provider including installation cannot be paired with a duplicate installation service."
