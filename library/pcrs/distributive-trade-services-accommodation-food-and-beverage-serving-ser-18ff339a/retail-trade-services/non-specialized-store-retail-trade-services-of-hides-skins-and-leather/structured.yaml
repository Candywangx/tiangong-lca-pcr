    - id: calc_steel_rack
      applies_to: "steel_rack"
      rule: "F_steel_rack = (1 - prior_attributed_fraction) * pool_capacity / remaining_all_capacity; steel_rack_per_service = F_steel_rack / N. prior_attributed_fraction is the finalized cumulative fraction strictly before this pool’s current period; pool_capacity is this current pool’s assigned capacity-time including idle responsibility. At that same ledger snapshot, remaining_all_capacity includes this current pool plus every remaining future beneficiary exposure, all in the same asset-specific dimension. A revised current-pool fraction replaces its prior version and is never added to it. Allocate scale available minutes by recorded tasks plus documented idle responsibility, rack capacity-hours and shell area-hours consistently. Carry prior finalized fractions across periods, reconcile capacities to measured availability, and assign final residual once. On revised lifetime replace affected historical fractions and remaining capacity in a versioned complete ledger, rather than adding a fresh whole asset or applying a second beneficiary share."
      inputs:
        - asset_id
        - ledger_snapshot_at
        - current_pool_start
        - prior_attributed_fraction
        - pool_capacity
        - remaining_all_capacity
        - revised_life_capacity
        - N
        - cp_steel_rack
      output: "steel_rack_per_service"
      source_ids:
