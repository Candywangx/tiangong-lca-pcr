    - protocol_id: cp_service
      process_id: "retail"
      flow_role: "service"
      record_type: "measured_event_ledger"
      raw_fields: "pool_id; hide_id; configuration_id; receipt_event; original_sale_event; presentation_event; event_date; accepted; qualified_acceptance; refused; externally_retained_refused_F; physical_return; refund_only; resale; transfer; final_state; final_recipient; closure_date; receipt_net_kg; accepted_net_kg; grade; species; preservation; hair_state; moisture_method; salt_state"
      collection_method: "Scan each whole-hide identity from receiving through final fate. Reconcile till, acceptance signature, stock count and physical return records at every event and pool closure. Count each qualified accepted and ultimately retained hide once. A refused hide still physically held by an external person is F, not output N; record actual recipient, state and continuing background responsibility independently. Refusal, internal transfer and repeated presentation create no output. Financial-only refunds or price discounts do not change N without a physical or qualification reversal. Record actual dates of late physical returns; reopen the original pool numerator and denominator and link resale without recounting its earlier burdens."
      unit: "Item(s)"
      frequency: "Every event and reconcile at pool closure"
      temporal_coverage: "Full pool including failures, closed/idle intervals and late-return revisions"
      site_scope: "Declared site/configuration; retain original event IDs and all beneficiaries"
