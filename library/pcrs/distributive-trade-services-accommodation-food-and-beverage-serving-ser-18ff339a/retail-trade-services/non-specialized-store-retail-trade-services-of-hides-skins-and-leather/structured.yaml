system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: boundary_receipt
      applies_to: "service; lost_hide_supply; discarded_hide; receipt_board"
      rule: "At the same receiving gate, fix the goods-system owner of production, preservation, supplier packing and inbound transport for every hide. Successful/resold goods retain that owner; do not add provision for every input hide to this service. Service-caused irrecoverable losses transfer that original-gate background once through lost_hide_supply, including the matched inbound transport. Goods supplier returns require named continuing background ownership and verified fate; a credit or a refund does not prove recovery."
      source_ids:
        - ghg-product-2011
    - rule_id: boundary_terminal
      applies_to: "all inventory rows"
      rule: "Include all service operation, hygiene, packing, actual maintenance, relevant complete-asset manufacture/installation and terminal responsibility. Treatment providers begin at measured handover and identify collection/transport and treatment exactly once. Supplier datasets for assets exclude operation, replacement and end-of-life represented here."
      source_ids:
        - jrc-retail-2013
    - rule_id: boundary_screen
      applies_to: "all inventory rows"
      rule: "Screen utilities, refrigeration, combustion, chemical/pest treatment, transport, drainage, direct emissions, incoming packaging and all assets with site inspection, contracts and ledgers for the full pool. Only evidenced absence permits conditional exclusion; unknowns require collection. Actual exchanges outside named cards require bilingual atomic extension before dataset completeness."
      source_ids:
        - jrc-retail-2013
    - rule_id: boundary_external_fate
      applies_to: "service; lost_hide_supply; discarded_hide"
      rule: "Keep externally retained but refused goods as F with actual custodian and physical state; F is never N and is not automatically discarded_hide. Identify who continues production/preservation/inbound-transport background and whether a service-caused irreversible loss transfers that burden through lost_hide_supply. Until qualified acceptance, verified resale/return or confirmed disposal, keep fate and responsibility unresolved; a price discount alone changes neither goods fate nor N."
      source_ids:
        - ghg-product-2011
    - rule_id: boundary_capital_components
      applies_to: "building_shell; steel_rack; digital_scale; scale_load_cell; removed_load_cell; retired_scale; retired_rack; shell_demolition"
      rule: "The building_shell complete physical package includes its foundations, structural fabric, roof/walls/floors, permanent partitions, doors/windows, fixed electrical wiring/control distribution and permanently mounted luminaires, together with their initial installation. It excludes the independently represented steel_rack, digital_scale and all load cells, and excludes other movable/plug-in equipment, subsequent replacements/repairs, operation and terminal treatment. This fixed package scope is mandatory, not a later modeller choice. The shell_demolition carrier has the same component scope, limited to actual remaining material; rack, scale and separately removed parts never re-enter its terminal mass. If fixed components are separately removed, add the actual specific atomic carrier/event cards and reconcile the remaining shell carrier without subtracting already-net removed mass twice. Match supplier package bill/specification to this scope and an explicit cross-card overlap matrix; unknown composition, omission or overlap blocks dataset completeness until resolved."
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
