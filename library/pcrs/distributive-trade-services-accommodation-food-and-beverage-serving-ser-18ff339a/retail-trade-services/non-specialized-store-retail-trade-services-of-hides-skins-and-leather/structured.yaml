    reference: "Leach I. and Wilson R.T. (2009), Higher value addition through hides and skins, FAO Diversification booklet 8, pp.13-15 and22-23; https://www.fao.org/4/i0523e/i0523e.pdf"
    used_for: "Qualitative context for preservation states, raw-hide/leather distinction, grading and labelling only; no numeric defaults or complete technical procedure"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD (2011), Product Life Cycle Accounting and Reporting Standard, sections6.3.2,6.3.4 and chapter9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General basis for service magnitude, quality/duration and subdivision/physical allocation; specific gates, pooling and formulas are this method’s declared foreground design, without full-standard conformity claim"
  - id: "jrc-retail-2013"
    type: "official_guidance"
    reference: "European Commission JRC (2013), Best Environmental Management Practice in the Retail Trade Sector, EUR25998 EN, chapter1.2, pp.4-6, Table1.2; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Screening direct retail energy, water, chemicals, packing/wastes and the indirect goods chain; no factors, industry ranges or presumption that a listed activity necessarily occurs"
