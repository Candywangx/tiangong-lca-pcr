      collection_method: "Read imported-water meter at cleaning events and reconcile to supply invoice and all beneficiaries. Obtain density for recorded temperature from traceable site or supplier measurement. Metered imports already exclude internal reuse; do not subtract reuse again. Distinguish hygiene from hide processing, which is outside this route."
