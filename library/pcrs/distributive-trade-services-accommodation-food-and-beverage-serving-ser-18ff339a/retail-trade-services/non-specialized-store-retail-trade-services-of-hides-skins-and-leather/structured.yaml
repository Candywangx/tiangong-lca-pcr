    - id: calc_water_vapour
      applies_to: "water_vapour"
      rule: "B = opening_net_kg * opening_water_fraction - closing_net_kg * closing_water_fraction - moved_water_kg; Water_positive_kg = sum(B only for identified-air intervals where B > uncertainty); water_vapour_per_service = Water_positive_kg / N. moved_water_kg = measured outgoing carried water - measured incoming carried water, covering receipt, physical returns, dispatch, waste salt/waste hides and any measured runoff water. Keep premises-hygiene water outside the native-hide balance. Accept an air-transfer amount only when its sign exceeds stated uncertainty and the cause is identified; unknown or within-uncertainty residuals remain unresolved, not zero or automatic air exchange. Any actual runoff requires its own atomic carrier card. This does not measure simultaneous gross exchange."
      inputs:
        - opening_net_kg
        - closing_net_kg
        - opening_water_fraction
        - closing_water_fraction
        - moved_water_kg
        - uncertainty
        - N
        - cp_water_vapour
      output: "water_vapour_per_service"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_air_water
      applies_to: "air_water"
      rule: "B = opening_net_kg * opening_water_fraction - closing_net_kg * closing_water_fraction - moved_water_kg; Water_negative_kg = sum(-B only for identified-air intervals where B < -uncertainty); air_water_per_service = Water_negative_kg / N. moved_water_kg = measured outgoing carried water - measured incoming carried water, covering receipt, physical returns, dispatch, waste salt/waste hides and any measured runoff water. Keep premises-hygiene water outside the native-hide balance. Accept an air-transfer amount only when its sign exceeds stated uncertainty and the cause is identified; unknown or within-uncertainty residuals remain unresolved, not zero or automatic air exchange. Any actual runoff requires its own atomic carrier card. This does not measure simultaneous gross exchange."
      inputs:
