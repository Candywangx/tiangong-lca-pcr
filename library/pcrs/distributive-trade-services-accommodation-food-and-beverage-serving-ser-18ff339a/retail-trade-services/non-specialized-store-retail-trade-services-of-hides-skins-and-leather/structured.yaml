  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify each real atomic flow, direction, type, state, medium, property/unit and bilingual name. Blank UUIDs remain unresolved; a similar good or mass property cannot complete service identity. Complete supplier background and measured quantities before claiming dataset completeness."
      evidence: "Official originals, integrity records, supplier specifications and per-card review"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Record present, evidenced absent or unknown per card; unknown is not zero. Reconcile all actual exchanges outside named cards and extend atomic cards and bilingual protocols."
      evidence: "Full-pool inspection, contracts, consumable/maintenance ledgers, drainage and waste fates"
    - id: event_history
      applies_to: "service; lost_hide_supply; discarded_hide"
      requirement: "Maintain unique hide histories; distinguish physical returns from refunds only; recompute original numerator, denominator and final responsibility together, without recreating background at resale."
      evidence: "Versioned event ledger, stock, acceptance and supplier/treatment confirmations"
    - id: mass_state
      applies_to: "all inventory rows"
      requirement: "Declare measured hair, adherent salt, loose salt, net mass, water and contamination states; reconcile tissue solids, salt, water and packing separately. Unidentified loss is not evaporation or waste; subtract container tare once."
      evidence: "Same-tag weighing, representative moisture/salt analysis, stocktake and uncertainty"
    - id: asset_history
      applies_to: "capital; maintenance; retirement"
      requirement: "Keep manufacture/installation, operation, replacement and retirement disjoint, with traceable complete-asset specifications/fractions; lifespan revisions correct history across all beneficiaries. Unknown terminal mass/fate must be disclosed and collected, not zeroed."
      evidence: "Persistent asset ledger, work orders, complete-product supplier scope, terminal carrier and fate confirmations"
    - id: capital_package_scope
      applies_to: "building_shell; steel_rack; digital_scale; scale_load_cell; removed_load_cell; retired_scale; retired_rack; shell_demolition"
      requirement: "Supplier/manufacturer complete-package identity and bill must match boundary_capital_components; verify included permanent wiring/luminaires and excluded independent rack/scale/load cells and repairs. Require the same original/remaining component scope at shell demolition. Unresolved supplier scope or overlap is a blocking coverage gap."
      evidence: "Supplier bill and installation specification, asset IDs, cross-card component/overlap matrix, removal work orders and measured terminal carrier reconciliation"
    - id: normalization
      applies_to: "all inventory rows"
      requirement: "Make full-pool raw quantities and single attribution reproducible; divide by N only at the end, with zero-output pools unnormalizable; reconcile all fractions to measured totals without repeated composition/destination multipliers."
      evidence: "Numerator, N, complete drivers, allocation totals, formula units and revision deltas"
