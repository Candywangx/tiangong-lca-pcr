      raw_fields: "spool_id; dispensed_kg; unused_return_kg; other_use_kg; measured_m; measured_kg_per_m; event_id; material_spec"
      collection_method: "Weigh issued spools and unused returns; match consumption and cut-offs to the same service events. Verify fibre and coating composition. Use measured length times supplier-verified measured linear mass only when direct mass is unavailable; retain the calibration sample."
      unit: "kg"
      frequency: "Every event and reconcile at pool closure"
      temporal_coverage: "Full pool including failures, closed/idle intervals and late-return revisions"
      site_scope: "Declared site/configuration; retain original event IDs and all beneficiaries"
