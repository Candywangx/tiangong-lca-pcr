allocation_rules:
  - rule_id: allocation_pool
    applies_to: "all inventory rows"
    rule: "Declare a prospective pool by configuration, site and interval before outcomes are known. Retain unsuccessful, zero-sale, closed and idle cohorts in the same configuration pool; a pool with N=0 retains its numerator and is explicitly unnormalizable. Do not join unrelated configurations to manufacture output. Later physical returns and resale revise the original pool service numerator, N and fates using actual event dates; never allocate the same history to a new pool as fresh work."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_drivers
    applies_to: "all inventory rows"
    rule: "Prefer direct subdivision and meters. Attribute shared lighting/holding by measured occupied area-hours across all actual goods; scale/checkout equipment and repair by recorded task-minutes; hygiene by measured affected area and cleaning events; rack by occupied capacity-hours; building shell by area-hours. Reconcile direct plus shared allocation to full measured totals, retaining common idle/closed/failure burdens. Declare continuing capacity beneficiaries before zero-driver intervals; missing beneficiary or zero total driver remains unresolved. Do not substitute sales value or sold-hide count for a demonstrated physical driver."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_asset
    applies_to: "steel_rack; digital_scale; building_shell; scale_load_cell; removed_load_cell; retired_scale; retired_rack; shell_demolition"
    rule: "Keep one persistent ledger per complete asset for all beneficiaries and periods. Allocate only the attributable remaining manufacture/installation fraction, carry past attribution and final residual, and correct histories after lifespan revisions without restarting the whole burden. Keep operations, actual replacements and terminal carrier accounting disjoint. Terminal responsibility uses its own reconciled full-life fractions; applying both that fraction and a manufacturing fraction to the same terminal mass is prohibited."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_fate
    applies_to: "all inventory rows"
    rule: "There is no saleable co-product credit in this route. Contaminated salt, hides and packaging are actual carriers linked to receiving treatment; record reuse or supplier return only with recipient/state/continuing ownership evidence. No automatic waste or avoided-product credit for refused goods or failed handover. Any recovered saleable output needs a named card, actual function and independently reviewed allocation before use."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_electricity
      process_id: "retail"
      flow_role: "electricity"
      record_type: "measured_event_ledger"
      raw_fields: "meter_id; interval_id; opening_kWh; closing_kWh; direct_kWh; common_kWh; beneficiary_id; area_hours; staff_task_minutes; outage; closed_period"
      collection_method: "Read verified meters every interval and reconcile billing and submeter boundaries. Separate direct task electricity from common lighting; allocate the latter by measured occupied area-hours across all merchandise beneficiaries including idle stock. Use recorded staff task minutes only for checkout equipment. Preserve closed, failed and zero-driver intervals with a documented continuing-capacity beneficiary; missing driver is unresolved."
      unit: "MJ"
      frequency: "Every event and reconcile at pool closure"
      temporal_coverage: "Full pool including failures, closed/idle intervals and late-return revisions"
      site_scope: "Declared site/configuration; retain original event IDs and all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, raw readings, stocktake, specification, signed acceptance, allocation and versioned reconciliation"
    - protocol_id: cp_ldpe_sheet
      process_id: "retail"
      flow_role: "ldpe_sheet"
      record_type: "measured_event_ledger"
      raw_fields: "roll_id; opening_kg; receipts_kg; closing_kg; issued_kg; unused_return_kg; shared_use_kg; event_id; offcut_id"
      collection_method: "Weigh issued rolls and unused returns on a calibrated scale and reconcile to hide events, including wasted wraps and rewrapping. Quantity uses issue minus unused return minus independently recorded other-beneficiary use. Opening stock plus receipts minus closing stock is an independent reconciliation only; internal returns are already in closing stock and cannot be subtracted again from net stock depletion. Confirm polymer and additives with supplier specification; another laminate needs its own card."
      unit: "kg"
      frequency: "Every event and reconcile at pool closure"
      temporal_coverage: "Full pool including failures, closed/idle intervals and late-return revisions"
      site_scope: "Declared site/configuration; retain original event IDs and all beneficiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, raw readings, stocktake, specification, signed acceptance, allocation and versioned reconciliation"
    - protocol_id: cp_cotton_twine
