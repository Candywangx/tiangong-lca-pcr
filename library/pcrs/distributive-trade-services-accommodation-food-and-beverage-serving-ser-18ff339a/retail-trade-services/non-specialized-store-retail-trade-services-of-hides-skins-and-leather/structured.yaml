  calculation_rules:
    - id: calc_electricity
      applies_to: "electricity"
      rule: "E_attr = direct_kWh + sum(common_kWh * eligible_driver / all_beneficiary_driver); electricity_MJ = 3.6 * E_attr / N. The kWh-to-MJ conversion is applied once after attribution."
      inputs:
        - direct_kWh
        - common_kWh
        - eligible_driver
        - all_beneficiary_driver
        - N
        - cp_electricity
      output: "electricity_MJ"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_ldpe_sheet
      applies_to: "ldpe_sheet"
      rule: "LDPE_attr = issued_kg - unused_return_kg - shared_use_kg; LDPE_per_service = LDPE_attr / N."
      inputs:
        - opening_kg
        - receipts_kg
        - closing_kg
        - issued_kg
        - unused_return_kg
        - shared_use_kg
        - N
        - cp_ldpe_sheet
      output: "LDPE_per_service"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_cotton_twine
      applies_to: "cotton_twine"
      rule: "Twine_attr = dispensed_kg - unused_return_kg - other_use_kg; twine_per_service = Twine_attr / N. If length is used, dispensed_kg = measured_m * measured_kg_per_m."
      inputs:
        - dispensed_kg
        - unused_return_kg
        - other_use_kg
        - measured_m
        - measured_kg_per_m
        - N
        - cp_cotton_twine
      output: "twine_per_service"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_service
      applies_to: "service"
      rule: "N = count(unique hide_id with qualified acceptance and final customer retention in the declared same-configuration pool); service_output = 1 Item(s). Later physical reversals revise original N and all attributable service totals, not only the denominator. An ultimately resold hide is counted once at its latest retained acceptance with its entire connected history."
      inputs:
        - hide_id
        - configuration_id
        - accepted
        - qualified_acceptance
        - physical_return
        - resale
        - final_state
        - closure_date
        - cp_service
      output: "N"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_water
      applies_to: "water"
      rule: "import_kg = direct_import_kg in quantity_mode=mass or imported_m3 * density_kg_per_m3 in quantity_mode=volume, mutually exclusive; Water_attr_kg = sum(import_kg * allocated_fraction); water_per_service = Water_attr_kg / N. Directly measured mass replaces volume-density conversion, never adds to it."
      inputs:
        - quantity_mode
        - direct_import_kg
        - imported_m3
        - density_kg_per_m3
        - allocated_fraction
        - N
        - cp_water
      output: "water_per_service"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_hypochlorite_solution
      applies_to: "hypochlorite_solution"
      rule: "solution_kg is measured issued solution mass in quantity_mode=mass or measured_solution_m3 * density_kg_per_m3 in quantity_mode=volume, mutually exclusive; Solution_attr_kg = sum((solution_kg - unused_return_kg) * allocation_fraction); solution_per_service = Solution_attr_kg / N; auxiliary_active_kg = Solution_attr_kg * active_mass_fraction. Apply no second active-content multiplier to the solution exchange."
      inputs:
        - quantity_mode
        - solution_kg
        - measured_solution_m3
        - density_kg_per_m3
        - unused_return_kg
        - allocation_fraction
        - active_mass_fraction
        - N
        - cp_hypochlorite_solution
      output: "solution_per_service"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_saline_wastewater
      applies_to: "saline_wastewater"
      rule: "Effluent_attr_kg = sum(discharge_m3 * effluent_density_kg_per_m3 * allocated_fraction); effluent_per_service = Effluent_attr_kg / N. This measured-discharge mode does not add a supply-minus-evaporation reconstruction."
      inputs:
        - discharge_m3
        - effluent_density_kg_per_m3
        - allocated_fraction
        - N
        - cp_saline_wastewater
      output: "effluent_per_service"
      source_ids:
        - ghg-product-2011
        - jrc-retail-2013
    - id: calc_lost_hide_supply
      applies_to: "lost_hide_supply"
      rule: "L = count(unique permanently lost hide_id with service background responsibility); loss_provision = L / N. A mass-based supplier model uses sum(original_receipt_net_kg for those hide_id) once, converted to the same whole-hide provision, without applying the loss fraction again."
      inputs:
