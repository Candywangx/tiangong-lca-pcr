allocation_rules:
  - rule_id: subdivide_sources
    applies_to: "alternating_current; all inventory rows"
    rule: "Prefer disjoint direct meters and task records. For each same-unit source pool a split measured active, idle and fixed component numerators before attribution; their sum must reconcile to the parent (subtract a submeter only when contained). Allocate active receiving/scan equipment energy by metered task kWh; idle/fixed equipment, checkout and ICT sources by measured reserved device-hours of all beneficiaries including failed/empty reservations. Physical lighting/HVAC/facility fixed pools use measured served-area m2 times duration h across disjoint zones. Never add kWh, hours, m2*h, bytes or event counts as one driver. Allocate each same-unit pool q_a by e_a_c/sum_c(e_a_c), retain all periods, require positive known driver totals, then sum compatible exchange numerators."
    source_ids:
      - ghg-allocation
  - rule_id: asset_history
    applies_to: "all inventory rows"
    rule: "Each homogeneous actual asset model/BOM/lifecycle vector V has its own lifelong ledger. Manufacturing+installation, operational utilities, event maintenance/replacements and terminal treatment are disjoint scopes; an evidenced complete package excludes its contained stages from outside modules. Building/fixtures use m2*h exposure; equipment/checkout/ICT use reserved equipment h. Reusable cleaning tools use actual cleaned surface m2 for each beneficiary; both e_recorded_h and L_expected and final e_actual_h/E_actual_all use cleaned m2 for that same tool model, never h. For each historical beneficiary pool h initially f_old_h=e_recorded_h/L_expected in that asset driver unit. e_recorded_h is the actual exposure of that original pool from calibrated measurement logs, never forecast future exposure; L_expected is the evidenced expected total lifetime exposure in the same unit; conserve all beneficiary/unused exposure, cumulative fractions<=1. On life/vector revision recompute every historical f_new_h and replace numerator by delta_h=f_new_h*V_new-f_old_h*V_old. At actual final retirement define E_actual_all=sum_all_h(e_actual_h), the measured exposure total across the complete history and every beneficiary, then f_final_h=e_actual_h/E_actual_all and apply replacement to EVERY historical pool. Never restart manufacturing or dump residual into current Q. Residual1-sum_old_f is QA, not replacement. Actual whole terminal net carrier already excludes removed parts; exclusive BOM reconstruction requires measured components, not another subtraction. Asset/repair/retirement transport first belongs to that exact asset and follows the same historical fractions/versions; already final-owner-attributed transport is not fractioned again."
    source_ids:
      - ghg-allocation
  - rule_id: backend_events
    applies_to: "all inventory rows"
    rule: "Payment authorizations and administration batches are unique actual events j. Within each event measure source-line processing times t_j_c, freeze w_j_c=t_j_c/sum_c(t_j_c) with sum_c(w_j_c)=1 including failed attempts; allocate that event provider numerator once. Dedicated single-line events have measured share1; tagging a source is not whole-event ownership. Network provider packets use their actual single contract denominator and scope. For each unique original connection interval j measure actual reserved endpoint-connection seconds net_s_j_c by beneficiary including idle/failed reservations; w_net_j_c=net_s_j_c/sum_c(net_s_j_c), sum_c(w_net_j_c)=1 with positive known total. Apply this share to that interval provider-source numerator once, preserving original interval/pool/version. Do not count the same connection interval again or multiply it into overlapping active/idle/fixed device-electricity pools. For camera capture source j freeze a timestamped map of actual field-of-view protected/display area A_j_c_zone times coverage duration h_j_zone over disjoint zone-time, all beneficiaries and empty reservations: w_j_c=sum_zone(A_j_c_zone*h_j_zone)/sum_c_zone(A_j_c_zone*h_j_zone). Shared retention byte-hours retain this original source/version map, not later sales; GB=10^9 bytes, GiB=2^30 bytes. Provider internet access alone does not include payment, administration or security backends."
    source_ids: []
  - rule_id: transport_ownership
    applies_to: "all inventory rows"
    rule: "Use trip/segment k -> consignment source s -> final responsibility owner/pool/version h. With documented binding mass capacity use measured consignment mass-times-carried distance; with documented binding volume capacity use actual occupied volume-times-distance. Split measured moving-loaded, moving-empty and stationary-idle source numerators before allocation. Loaded driver d_loaded_k_s is mass_kg_s*carried_km_s or occupied_volume_m3_s*carried_km_s in the evidenced capacity mode; allocate each source numerator by d_loaded_k_s/sum_s(d_loaded_k_s). Empty source driver d_empty_k_s=reserved_capacity_k_s*empty_km_k and idle source driver d_idle_k_s=reserved_capacity_k_s*idle_h_k, using the actual prebooked kg or m3 capacity reserved by every beneficiary including failed consignments; allocate each separate source pool by its own driver sum. Freeze reservation records and require positive known totals; never sum these three driver dimensions. Empty trips retain measured vehicle-km and idle fuel/time even when t*km=0; unknown capacity or provider empty-route coverage blocks completion. A provider consignment-attributed amount skips only vehicle attribution; still multiply F, first-use or historical asset-owner fraction as applicable. Skip owner_fraction only when attribution_level already identifies exact original source, final owner, pool and version. Receiving transport of S follows excluded GOODS; F follows failed_original; T/O responsibility persists."
    source_ids:
      - ghg-allocation
  - rule_id: materials_cleaning
    applies_to: "all inventory rows"
    rule: "Completion materials use actual homogeneous original source quantities; unused stock/return/transfer retains unassigned manufacturing and inbound transport. Assign manufacture/inbound once at first use; used/reused stock never repeats them. Cleaning imported water is actual external inflow, not reduced again by internal reuse. Record actual supplied formulation kg and mutually exclusive original-formulation destinations: used export, spill export, retained, unused and dispatched container residue; intermediate used-to-rinsed is replacement state. Whole wet wipe/container/rinsate kg is a distinct measured carrier, excluding no water by assumption and never multiplied again by source fraction. Direct effluent is measured V_discharge*rho at recorded temperature with calibration, not a supply-water reconstruction. Each actual chemical/water/carrier needs its own atomic card; real mixed carriers require receiver acceptance and complete treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_events
      process_id: "retail"
      flow_role: "retail_service; customer_handover; supplier_handover; internal_handover"
      record_type: "Original-unit custody and acceptance ledger"
      raw_fields: "original_id; lot_id; manufacturer_sku; UPC; configuration; closure; included_pieces; actual_store_id; assortment_evidence; pool_id; observation_window; timestamp; timezone; event_id; recipient; state; H; R_receive; R_customer; R_supplier; J_internal; C_condemned; L_missing; G_open; G_close; epsilon_goods; final_valid; revocation_no_movement; financial_only; correction_version"
      collection_method: "At supplier dispatch and receiving inspect each actual unit/lot against markings, original components, signed packing list/drawing and packaging; resolve manufacturer/retailer length conflict by drawing and measured geometry. At each receipt/return/handover/refusal/transfer capture event and recipient; at window close verify acceptance and unique original ID, then preserve actual-date late corrections. Scan IDs and count; no vehicle-use km. Count opening/closing goods independently. Use service_count, custody_count and physical_fates; raw events first, each attributed numerator divided by Q once per reference flow."
      unit: "Item(s)"
      frequency: "Every event; physical stock at opening/closing; review at window end and every later correction"
      temporal_coverage: "Full prospective pool including closed/failed/zero-sale days and late corrections"
      site_scope: "Actual mixed-assortment physical store and identified supplier dispatch"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed stock count, barcode audit, lot photos/drawing, acceptance/return receipts and conflict resolution"
    - protocol_id: cp_sources
      process_id: "retail"
      flow_role: "failed_original"
      record_type: "Original supplier source-vector responsibility ledger"
      raw_fields: "original_id; lot_id; source_id; n_original_s; source_vector_s; original_gate; exact_pack_BOM; component_vector_ids; manufacturing_scope; vector_gate; exact_excluded_inbound_stages; inbound_transport_source_id; S_s; F_s; T_s; O_s; recipient; state; final_owner_id; pool_id; version"
      collection_method: "Obtain supplier primary lot/BOM/manufacturing inventory and actual supply-pack boundaries at receiving; freeze original source ID and separately evidenced inbound transport. Each fate/correction updates exclusive S/F/T/O; physical transfer is independently linked to cp_events. Whole-source F uses complete original units only. If actual original components diverge, supplier component inventories and new atomic cards precede any complete result. source_f and original_source give raw N_F; keep S/T/O external to service; N_F/Q once per reference flow."
      unit: "Item(s); original vector units"
      frequency: "Each received source and every fate/version change"
      temporal_coverage: "Original dispatch through final ownership, across periods"
      site_scope: "Actual supplier lot and all original-unit custodians"
      aggregation_rule: "per reference flow"
      quality_evidence: "Primary vector provenance; source conservation; actual receipt/BOM; unresolved gaps signed"
    - protocol_id: cp_energy
      process_id: "retail"
      flow_role: "alternating_current"
      record_type: "Disjoint receiving and checkout electricity metering"
      raw_fields: "source_pool_id; parent_meter_id; meter_contains_submeter; circuit_scope; equipment_id; meter_serial; calibration; resolution; start_kWh; end_kWh; kWh_a; active_idle_fixed; e_a_pool; e_a_c; all_beneficiaries; reserved_device_h; served_area_m2; duration_h; timestamp; uncertainty; provider; voltage; geography; delivery_boundary"
      collection_method: "At each actual receiving/checkout circuit use calibrated cumulative readings and interval/task log; map parent/submeters and disjoint scope. Record active kWh, idle/fixed source pools and all actual reserved equipment hours. Allocate facility fixed loads separately by measured served m2*h under subdivide_sources; retain closed hours. Verify voltage/provider background without inferring them from generic AC identity. energy_pool raw MJ; reconcile parent and each same-unit source; N_AC/Q once per reference flow."
      unit: "kWh; h; m2"
      frequency: "Cumulative opening/closing plus interval and each task/state change"
      temporal_coverage: "Full pool including idle, closed, failures"
      site_scope: "Mapped core receiving/checkout circuits only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, interval export, circuit plan, reservations, bills and source-pool reconciliation"
    - protocol_id: cp_waste
      process_id: "retail"
      flow_role: "damaged_unit_waste"
      record_type: "Complete condemned-unit waste dispatch ledger"
      raw_fields: "condemnation_event_id; original_id; original_pieces; packaging_state; constituents; carrier_id; dispatch_id; receiver; acceptance_scope; treatment_scope; gross_kg; tare_kg; scale_id; calibration; timestamp; W_open; W_close; W_generated; W_dispatch; W_transfer; W_missing_confirmed; waste_incident_id; epsilon_waste; missing_residual; background_id"
      collection_method: "At condemnation count original units and weigh generated held waste; at actual dispatch tare and weigh each complete accepted carrier on a calibrated scale. Record actual original components and package constituents/state, signed receiver acceptance and complete treatment contract. Observe held-stock opening/closing separately; do not deduct these again from direct dispatch. Incomplete/opened carriers trigger atomic extension before use. waste_dispatch yields raw N_W; independent physical_fates kg QA; N_W/Q once per reference flow."
      unit: "kg; Item(s)"
      frequency: "Every condemnation/dispatch; held-waste opening/closing"
      temporal_coverage: "Full pool and later corrected original consignments"
      site_scope: "Retail held-waste location and actual receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale calibration, tare/weight ticket, signed receiver acceptance, chain of custody and complete treatment match"
    - protocol_id: cp_completion
      process_id: "retail"
      flow_role: "failed_original; alternating_current; retail_service; customer_handover; supplier_handover; internal_handover; damaged_unit_waste"
      record_type: "Mandatory source-stage closure and module register"
      raw_fields: "module_id; actual_process_id; actual_row_id; direction; flow_type; state; medium; property; unit; source_id; event_id; stage; boundary; provider_scope; raw_or_normalized; N_core_raw_r; N_external_raw_m_r; z_normalized_m_r; D_original_m; B_external_m_r; A_external_m_r; exact_final_owner_attribution; pool_id; owner_id; version; Q; active_idle_fixed; e_a_c; asset_model; asset_driver_unit; cleaned_surface_m2; cleaned_area_lifetime_m2; exact_BOM; V_old; V_new; e_recorded_h; L_expected; e_actual_h; E_actual_all; f_old_h; f_new_h; f_final_h; delta_h; terminal_carrier_kg; attribution_level; owner_fraction; trip_id; segment_id; consignment_id; capacity_basis; capacity_evidence; mass_kg; occupied_volume_m3; distance_km; empty_km; idle_h; idle_fuel; moving_loaded_numerator; moving_empty_numerator; stationary_idle_numerator; reserved_capacity_k_s; reservation_capacity_unit; carried_km_s; empty_km_k; idle_h_k; d_loaded_k_s; d_empty_k_s; d_idle_k_s; t_j_c; w_j_c; unique_connection_interval_id; net_s_j_c; w_net_j_c; network_contract_denominator; network_provider_numerator; camera_source_id; A_j_c_zone; h_j_zone; byte_h; GB_or_GiB; original_capture_map; first_use_id; formulation_source_kg; formulation_destinations; container_residue_kg; wet_carrier_kg; V_discharge; rho; temperature; calibration; absence_evidence; overlap_constituents"
      collection_method: "Before completeness and on every source/configuration change inspect actual facility, asset/circuit register, contracts, invoices, dispatches and all period records. For every required module in partial_completion create actual atomic card and single-process protocol before sync. Apply fixed methods subdivide_sources, asset_history, backend_events, transport_ownership and materials_cleaning with measured fields listed here; do not choose a new denominator or driver downstream. Freeze original camera map and event shares, all-beneficiary exposure, transport attribution levels and supplier boundaries; require matching source-scope evidence and recorded absence signoff. Apply the narrow no-combustion/no-refrigerant applicability gate in partial_completion to all supporting facility equipment and contracts. A positive or unknown condition cannot be completed under this route and remains explicitly outside-scope/incomplete, never a zero emission assumption. Damaged solid goods still require actual state/path-specific extension under waste_boundary. completion_sum retains raw and restores normalized original module numerators, deduplicates actual stages, final/Q once per reference flow."
      unit: "Actual row-specific units; separate same-unit pools"
      frequency: "Every module event/interval; asset history on every revision/retirement; closure before result"
      temporal_coverage: "All mandatory support modules throughout original pool and full asset/source history"
      site_scope: "Actual store and all supplier/provider/receiver boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed module inventory; measured drivers; source/owner/version receipts; all-history replacement audit; scope-overlap matrix; absent/unknown register"
  calculation_rules:
    - id: service_count
      applies_to: "retail_service"
      rule: "Q=count_distinct(original_id with final_valid=true); do not subtract revoked IDs again. Freeze pool/window, carry zero-output periods and version late returns."
      inputs:
        - original_id
        - final_valid
        - pool_id
        - observation_window
        - correction_version
      output: "Q"
      source_ids: []
    - id: source_f
      applies_to: "failed_original"
      rule: "N_F=sum_s(n_original_s*F_s). Whole-source F is0 or1 for each indivisible original unit; source_vector_s follows that same source once. S_s+F_s+T_s+O_s=1. Separate component vectors are mandatory before differing component fates."
      inputs:
        - n_original_s
        - S_s
        - F_s
        - T_s
        - O_s
        - source_vector_s
      output: "N_F"
      source_ids: []
    - id: energy_pool
      applies_to: "alternating_current"
      rule: "N_AC=3.6*sum_a(kWh_a*e_a_pool/sum_c(e_a_c)); direct disjoint kWh has share1. Apply subdivide_sources to actual same-unit source pools; never assume fixed-zero load."
      inputs:
        - kWh_a
        - e_a_pool
        - e_a_c
        - source_pool_id
        - active_idle_fixed
        - parent_meter_id
      output: "N_AC MJ"
      source_ids: []
    - id: custody_count
      applies_to: "customer_handover; supplier_handover; internal_handover"
      rule: "N_H=H; N_R=R_supplier; N_J=J_internal from gross physical event IDs, independent of Q and source ownership; physical_fates count and kg ledgers reconcile separately."
      inputs:
        - H
        - R_supplier
        - J_internal
        - G_open
        - G_close
        - R_receive
        - R_customer
        - C_condemned
        - L_missing
        - epsilon_goods
      output: "N_H; N_R; N_J"
      source_ids: []
    - id: waste_dispatch
      applies_to: "damaged_unit_waste"
      rule: "N_W=sum_dispatch(gross_kg-tare_kg). Use direct whole-carrier net mass once; W_close=W_open+W_generated-W_dispatch-W_transfer-W_missing_confirmed+epsilon_waste is independent QA. Link C_condemned count to measured W_generated by event ID, not nominal kg per item."
      inputs:
        - gross_kg
        - tare_kg
        - dispatch_id
        - W_open
        - W_close
        - W_generated
        - W_dispatch
        - W_transfer
        - W_missing_confirmed
        - waste_incident_id
        - epsilon_waste
        - condemnation_event_id
      output: "N_W kg"
      source_ids: []
    - id: completion_sum
      applies_to: "all inventory rows"
      rule: "For compatible exchange/property/unit/state/medium/boundary r: First restore each external source numerator B_external_m_r=N_external_raw_m_r in raw mode or z_normalized_m_r*D_original_m in normalized mode. If it is not already attributed to the exact final original owner/pool/version, apply the fixed subdivide_sources, asset_history, backend_events, transport_ownership or materials_cleaning first-use method as applicable exactly once to obtain A_external_m_r; if exact attribution is evidenced set A_external_m_r=B_external_m_r without repeating owner fractions. Then N_total_r=N_core_raw_r+sum_m(A_external_m_r) and x_r=N_total_r/Q once. Preserve raw core N_F/N_AC/N_W etc before their card division; external raw stays raw. Restore normalized modules only with evidenced original D and exact original source/pool/owner/version. Deduplicate actual constituents/events/time/assets/lifecycle stages, not just provider IDs; exclude overlapping F/AC. An incompatible unit/identity remains a separate row, never add kg to MJ or raw to normalized."
      inputs:
        - N_core_raw_r
        - N_external_raw_m_r
        - z_normalized_m_r
        - D_original_m
        - B_external_m_r
        - A_external_m_r
        - exact_final_owner_attribution
        - attribution_level
        - owner_fraction
        - e_recorded_h
        - L_expected
        - e_actual_h
        - E_actual_all
        - subdivide_sources
        - asset_history
        - backend_events
        - transport_ownership
        - materials_cleaning
        - cp_completion
        - source_id
        - pool_id
        - owner_id
        - version
        - Q
      output: "x_r"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "No exact unbound row is verified. Before operational use direct-read matching official public flow and receipt; check UUID, bilingual names, state, type, qualifiers, property/unit and medium; bind an actual geographically/temporally suitable background and measured quantity. A catalog count property does not verify a retail-service or merchandise identity."
      evidence: "Row-specific binding record; original response hash; supplier vector; meter/weighing record."
    - id: complete_scope
      applies_to: "all inventory rows"
      requirement: "Partial core remains partial until cp_completion closes every mandatory module with atomic cards, actual protocols and both-language sync. Missing/unknown coverage or failed acceptance evidence blocks a complete-service result."
      evidence: "Signed source-to-stage register, overlap matrix and absence proofs."
    - id: measurements
      applies_to: "all inventory rows"
      requirement: "Use traceable meter/scale serial, calibration validity, resolution, zero/tare, timestamp/timezone, uncertainty and complete period records. Missing quantity is unknown, not zero. Preserve negative signed residuals for investigation; no automatic clamp or credit."
      evidence: "Calibration certificates; reconciliation; signed investigations; frozen versions."
validation_rules:
  - rule_id: scope_acceptance
    applies_to: "retail_service"
    rule: "Reject changed SKU/state/channel or unresolved length/configuration conflicts; require actual store assortment and original-lot identity. Q must be positive and final-valid unique IDs; finite measurement pass does not approve scientific applicability."
    source_ids:
      - un-cpc-62181
      - curt-model
      - runnings-channel
  - rule_id: balances
    applies_to: "all inventory rows"
    rule: "Require physical_fates, original_source, source_f and all same-unit pool/asset history reconciliations. Confirm every true conditional exchange has a card/protocol/background; unknown remains incomplete. Satellite exclusions apply only to the three named Product custody outputs, never failed_original or Waste."
    source_ids: []
  - rule_id: aggregation_gate
    applies_to: "all inventory rows"
    rule: "Verify actual Inputs and raw fields for every applied rule, one source attribution and one Q division. Match protocol process_id and flow_role to actual row IDs. Complete claims require closure and no double-counted module constituents; candidate status is not scientific, translation-review or publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "candidate partial retail-service inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same actual SKU/configuration/store route after applicability and binding review; complete service only after mandatory closure"
  excluded_use: "Whole-store or all62181 coverage; vehicle-use impact; installation; safety certification; methodology-approved claim"
  required_metadata: "Reference qualifiers; original source vectors; actual pool/Q; correction versions; all required modules and identity gaps"
  required_quality_disclosure: "Partial core and any unknown module; measured uncertainty; historical UUID observations; original product-page limitations and unresolved length/pack evidence"
  update_trigger: "SKU/pack/route change; late return; supplier background or asset lifetime revision; calibration/identity correction"
