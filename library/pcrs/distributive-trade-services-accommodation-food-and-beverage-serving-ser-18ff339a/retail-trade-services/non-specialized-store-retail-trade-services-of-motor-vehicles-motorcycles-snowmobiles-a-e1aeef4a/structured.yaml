system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "retail"
      rule: "Admit only the scope and gates above. Receiving, complete-unit holding and counter handover are the core. Record prospectively the same configuration, site and period pool; retain closed, failed and zero-sale periods. Q is distinct final-valid original-unit IDs, at most one service per original unit; physical returns and resale do not create new original IDs. Revocation removes final validity even without physical movement; financial-only adjustment does not. Q=0 is unnormalizable and cannot be deleted or replaced by a successful period."
      source_ids:
        - un-cpc-62181
        - un-goods-49129
        - runnings-channel
    - rule_id: original_source
      applies_to: "failed_original; retail_service; customer_handover; supplier_handover; internal_handover; damaged_unit_waste"
      rule: "At the original supplier dispatch gate retain one actual whole-unit supplier manufacturing vector V_s and a separate inbound transport source. V_s is strictly manufacture and original supply packaging through supplier dispatch and EXCLUDES inbound transport. The core failed_original input carries only that dispatch-gate vector; F inbound transport is a mandatory omitted module under partial_completion and transport_ownership. An already transport-inclusive vector is inadmissible unless supplier inventory evidence separates those exact source stages; never add it beside the same independent inbound module. Original components, coatings, fasteners, instructions and lot packaging belong to that vector; the product webpage is not LCI or complete BOM. Partition each original source exactly once into S final-valid customer ownership, F failed service responsibility (destroyed, confirmed missing or failed externally retained), T named transferred responsibility, and O continuing original stock/unresolved ownership, with S+F+T+O=1. Service excludes S manufacturing and its inbound transport; a separate GOODS system may add S once. failed_original is an actual Product input N_F/Q of whole original units carrying their matching F vectors, not a custody satellite; include confirmed lost units despite no waste. Supplier returns carry named continuing T/O ownership and actual physical handover separately. Never infer F from cash refunds. An actual component divergence requires supplier component vectors and separate atomic input cards; exclude those exact source portions from the whole-unit vector, never split environmental vectors by mass. Prohibit completeness until resolved."
      source_ids:
        - curt-model
    - rule_id: physical_fates
      applies_to: "customer_handover; supplier_handover; internal_handover; damaged_unit_waste"
      rule: "customer_handover, supplier_handover and internal_handover are exclusively named non-characterized physical Product custody satellites; no new manufacturing background is attached there. All gross external customer handovers H include accepted and never-accepted handovers once; a later no-movement revocation only changes the original event status. Goods-count balance is G_close=G_open+R_receive+R_customer-H-R_supplier-J_internal-C_condemned-L_missing+epsilon_goods. Condemnation is goods to held-waste conversion linked by event IDs and measured kg, not waste dispatch. Held-waste balance W_close=W_open+W_generated-W_dispatch-W_transfer-W_missing_confirmed+epsilon_waste in kg. W_dispatch is directly measured consignment net carrier kg without subtracting closing stock again. W_missing_confirmed is independently confirmed missing held-waste kg; epsilon_waste is a distinct signed unexplained residual. Both require incident IDs and fate investigation; unknown receiver/treatment remains incomplete and cannot create fictional dispatch/treatment. Count cannot be inserted into kg. Failed external retention retains recipient/state and F responsibility, never fictional retailer waste. Late returns replace the original pool numerator, Q, source ownership and fates with actual event dates; do not charge a new pool again."
      source_ids: []
    - rule_id: partial_completion
      applies_to: "all inventory rows"
      rule: "These core cards are a declared partial incremental inventory, not complete store operation. Before any complete-service claim, cp_completion must activate named atomic cards with actual process/direction/Product-Waste-elementary identity, state, medium, property/unit, measured numerator, protocol, background scope and bilingual sync for every actual omitted exchange. Required closure register: building/fixed fixtures/shelf/lighting/fan/HVAC capital and operation; receiving equipment; checkout/payment hardware; ICT/network; camera/security; administration; cleaning and imported water/effluent; mastercase/receipt/bag materials and wastes; goods/asset/material/waste transport. Evidence absence by site walk, circuit/asset plans, contracts, purchase/dispatch records and responsible signoff for the full period. The admitted facility route is electric receiving/checkout with ordinary unconditioned shelf holding; only electric-resistance/fan ventilation facility support may be completed here. Verify absence of combustion and refrigerant equipment serving this beneficiary by full-period equipment/contract/maintenance records and site inspection, including forklifts, backup generators and HVAC. Presence is outside this facility route, not zero; unknown absence blocks closure. Actual leakage, broken coating or opened packaging cannot default zero: add actual state-specific material/waste/species-path cards and measured carrier balances before completeness."
      source_ids: []
    - rule_id: waste_boundary
      applies_to: "damaged_unit_waste"
      rule: "Only an actually complete, unused condemned 45036 unit with its same actual supply packaging and all original pieces may use damaged_unit_waste. Measure the whole carrier, not nominal steel or the manufacturer shipping weight. Signed receiver acceptance must cover its actual steel, plating, coating, plastic/paper packaging and state, with a matching complete collection/treatment boundary. Do not also dispatch its components on other cards. Opened, partly missing, leaking or separately dispatched packaging requires distinct atomic extensions and measured disjoint carriers. Actual Waste output is characterized by treatment; it is not a physical Product satellite and has no automatic avoided-product credit."
      source_ids:
        - curt-model
