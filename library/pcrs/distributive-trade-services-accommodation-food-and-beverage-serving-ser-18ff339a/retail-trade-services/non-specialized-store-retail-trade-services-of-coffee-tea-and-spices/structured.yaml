system_boundary:
  rules:
    - rule_id: scope_route
      applies_to: "all"
      rule: "This is one partial incremental retail module for non-specialized walk-in stores: supplier-filled, opaque heat-sealed PET/aluminium/PE laminate pouches, nominal net 250 g, containing only dried unflavoured black tea leaves of Camellia sinensis. Fix one manufacturer, SKU, tea grade, pouch construction and acceptance specification per dataset. Record the actual net tea mass and moisture basis of each receipt lot; 250 g is the format identifier, never an assumed measured mass. Receive at the store receiving gate, inspect and place unopened packets on a dry ambient shelf, then hand them over at an attended checkout for the buyer’s own use. There is no retailer brewing, tasting, grinding, blending, repacking, delivery, refrigeration or dehumidification within this module. Coffee, spices, green/oolong/instant tea, flavoured tea, tea bags, cans and loose bulk sales are excluded. Actual incidents and failed cohorts remain in the pool; an excluded operational route cannot be made equivalent by renaming it. The module includes dedicated shelf/checkout electricity, receipt paper and the specified residual carriers. Known common premises, assets and housekeeping are excluded here only under the mandatory completion matrix below. The partial result must never be described as the whole retail footprint."
      source_ids:
        - un-cpc-62127
        - tea-board-storage
    - rule_id: gates
      applies_to: "all"
      rule: "Start when the retailer accepts physical custody at the store receiving gate; end at qualified final handover after the prospectively declared physical return/acceptance observation window, or a recorded terminal/continuing failed fate. Record gate dates, custody, seal/label/lot/condition, buyer acceptance and destination. Payment alone is not qualified acceptance. Internal shelf movement is not a second receipt or service. Retailer transport after receipt is outside this route; any actual trip requires a separate completed route module before aggregation."
      source_ids:
        - un-cpc-62127
        - ghg-product-2011
    - rule_id: partial_completion
      applies_to: "all"
      rule: "Before any whole-retail claim, the responsible assembler must attach a source-ID and boundary-matched completion matrix for (i) shared premises lighting, HVAC, ventilation and office/checkout IT operation not on the dedicated meter plus actual payment and communication services; (ii) building including shell, fixed wiring/luminaires and installed common systems; (iii) shelf, checkout/POS and actual loaded plus empty handling trolley/pallet equipment; (iv) all housekeeping water, each detergent/cloth, wastewater and other residuals; (v) maintenance, installation and terminal asset carriers and actual transport. For every module use this same cohort and final denominator Q, record meter/provider intersections and exclude duplicates by event/asset/component IDs. Retain failed, idle, closed and zero-output periods. Unknown coverage blocks completeness, never equals zero. Required measurement and allocation methods are fixed in completion_calc and completion_protocol; modellers may supply actual quantities and suppliers, not choose another denominator or cut-off. No excluded asset burden is silently declared insignificant."
      source_ids:
        - ghg-product-2011
    - rule_id: goods_responsibility
      applies_to: "failed_background; service; supplier_transfer; external_failure; continuing_transfer"
      rule: "The service is distinct from tea manufacture. Successful merchandise manufacture, its original pouch, actual share of supplier transit cartons/LDPE film and inbound transport to this receiving gate belong once to the downstream successful-goods background, exactly one original packet per finally successful unique packet. Include in failed_background only original packets whose terminal failed-goods background is assigned to this service under goods_calc. Supplier returns, stock and other continuing recipients retain an explicit continuing full upstream responsibility chain; no avoided-production credit. A returned packet later resold successfully receives one goods background, not one per attempt. Final failed external retention/consumption has an identified recipient and responsibility, never automatic retailer waste. Physical transfer outputs do not add another upstream background."
      source_ids:
        - ghg-product-2011
    - rule_id: tea_integrity
      applies_to: "all"
      rule: "The opaque moisture-barrier pouch remains unopened for sale. Tea Board advice concerns cool/dry protection and avoiding odours, not a numeric legal storage limit or this particular packaging specification. Obtain signed SKU/lot acceptance conditions, shelf-life/date coding and actual supplier packaging declaration; record shelf temperature/RH, odour/contamination checks and seal integrity each operating day and each receipt/return/fate event. No default moisture, permeability, shelf life or compliance limit is supplied. Counted service cannot increase merely because tea absorbs water. Do not infer zero moisture/volatile transfer from a nominal airtight claim. Changes that affect condition, mass reconciliation or environmental transfers require measured bounds; unknown material transfer prevents closure."
      source_ids:
        - tea-board-storage
    - rule_id: incident_extension
      applies_to: "tea_waste; pouch_waste; sealed_waste"
      rule: "Routine sales involve unopened complete packets; damaged, opened-returned and sampled packets are never counted as an unopened successful packet. Preserve their whole original-packet background responsibility even if residual mass is less after a documented external consumption. Keep intact disposed packets in sealed_waste. For a physically separated incident weigh actual loose tea and empty pouch separately, never count their original intact carrier again. Tea_waste contains only collected dry tea as actually moist, not cleaning water; pouch_waste contains actual emptied laminate with measured adhering tea assigned once. Record any third carrier, spill collection material, cleaning, leachate, humidity/volatile flux or offsite sample treatment with named cards/protocols in both languages and normal sync before a complete dataset. Fix species identity, actual inlet/outlet medium, raw boundary mass and recipient attribution first; unknown incident fate is unresolved, not zero or an invented air emission."
      source_ids:
        - ghg-product-2011
    - rule_id: waste_boundary
      applies_to: "cardboard_waste; film_waste; sealed_waste; tea_waste; pouch_waste; receipt_core_waste; receipt_waste"
      rule: "Weigh each actual dispatched carrier; retain opening/closing bins and collection dates. Treatment backgrounds must match each carrier and actual recipient and include evidenced pickup transport and treatment boundaries. Waste output links to that treatment background once; do not also enter an input for the same treatment, contained tea/laminate or provider fuel. Obtain provider route/loaded/empty-leg coverage; uncovered empty distance cannot disappear as zero tonne-km, and requires separately measured vehicle-distance route activity with overlaps removed. Fractions of destinations sum to one on one raw carrier pool, applied once. No recycling or avoided-material credit. Unknown recipient, carrier composition needed for treatment, or provider overlap blocks completeness."
      source_ids:
        - ghg-product-2011
    - rule_id: identity_completion
      applies_to: "all"
      rule: "Only the displayed electricity UUID is bound; it is generic point-of-use AC with provider and voltage unspecified and no emission factor. All other flow identities remain concrete unbound candidates. Before a completed foreground dataset, bind each row to an exact official product/waste identity and compatible property/unit, or retain an explicit unresolved finding and disallow completeness. Direct official response plus matching integrity receipt must establish UUID, state, official names, qualifiers and property/unit chain. Search hits or similar names do not bind identity. Match actual suppliers, composition and treatment. Candidate availability is not scientific or release approval."
      source_ids:
        - ghg-product-2011
