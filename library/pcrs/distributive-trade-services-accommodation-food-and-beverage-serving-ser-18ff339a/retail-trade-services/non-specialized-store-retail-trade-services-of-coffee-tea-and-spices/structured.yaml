allocation_rules:
  - rule_id: pool
    applies_to: "all"
    rule: "Prospectively fix one store/configuration/SKU cohort and consecutive reporting windows, including failed receipt lots, idle/closed days and zero-sale subperiods. Each original packet has one parent ID, all attempts and final fate. Correct service count Q counts unique finally accepted unopened packets only. A price adjustment alone does not reverse Q. Physical refusal, later qualified resale and final return revise original numerator and Q together. Entirely Q=0 pools are retained with unnormalized totals and cannot yield per-service values; combine only prospectively declared same-configuration adjacent pools, never cherry-pick successful periods. Unknown final acceptance/fate remains provisional."
    source_ids:
      - ghg-product-2011
  - rule_id: shared_driver
    applies_to: "electricity; receipt_paper; all"
    rule: "Use dedicated submetering or direct event material attribution before sharing. For shared checkout operation use measured attended seconds across all actual beneficiaries; assign idle/closed intervals by declared staffed-capacity reservation seconds across all beneficiaries, not by successful sales alone. For dedicated shelf light use measured occupied packet-slot-hours, reserve idle shelf capacity by assigned slot-hours; all beneficiaries and failure/stock exposures remain. Apply shares to raw totals first, reconcile sum allocated=raw pool including residual, then divide by Q once. A parent meter may subtract a submeter only if the documented circuit topology includes it; disjoint meters are not subtracted. Split circuits or compatible named route modules before combining heterogeneous drivers."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_completion
    applies_to: "all"
    rule: "For omitted asset modules fix disjoint complete-object boundaries: building shell/fixed installations exclude separately counted shelf, POS and trolleys; complete POS includes its supplied computer/display/scanner/printer; trolley includes wheels and bearings; shelf includes its original fasteners. Provider-included manufacture, installation, fluids, transport or maintenance must not be repeated. Real replacement parts and actual maintenance are event-attributed unless an evidenced homogeneous signed contract package contains them. One Item(s) of maintenance is allowed only for one fixed contract_id, work_scope, service_type and package_version with compatible background, never a mixed job count. Terminal direct net weighing and component-BOM reconstruction are exclusive; direct net mass already excludes removed components. Lifetime allocation and terminal correction are fixed by completion_calc."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "handling"
      flow_role: "Packet custody, service and background"
      record_type: "Original packet/event/lot ledger"
      raw_fields: "cohort_id; packet_id; original_lot; supplier_SKU; gross_handover_id; physical_return_id; attempt_id; receipt_date; final_acceptance_date; condition; seal_status; final_fate; recipient; background_owner; original_net_tea_kg; pouch_tare_kg; moisture_basis; uncertainty"
      collection_method: "Scan unique original packet IDs at receipt, every attempt, return and fate; signed custody and acceptance records distinguish financial events. Weigh calibrated gross packet samples and matched emptied pouch tare from each homogeneous receipt lot; measure actual net tea and wet-basis moisture on the same documented sample method, with sample fate recorded. Keep sample size/selection by lot/receipt date and certificate, calibration/zero/check weights. Verify full source background covers actual supplier tea, this pouch, actual allocated supplier transit carton/LDPE film and inbound gate, with actual per-packet mass and uncertainty. acceptance_calc and goods_calc; unique parent-packet partition, preserve provisional records; same original IDs reused without recounting"
      unit: "Item(s); kg; fraction; timestamp"
      frequency: "Each custody/attempt/fate event and each receipt lot sample"
      temporal_coverage: "Entire declared cohort including observation tail and late corrections"
      site_scope: "Receiving gate, shelf, checkout and named recipients"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed receipt/acceptance/recipient logs; inventory snapshots; scale/moisture QA and laboratory uncertainty; supplier background scope"
    - protocol_id: cp_energy
      process_id: "handling"
      flow_role: "Dedicated circuit electricity"
      record_type: "Circuit interval register"
      raw_fields: "meter_id; topology; timestamp; kWh_open; kWh_close; multiplier; circuit_scope; task_seconds; reservation_seconds; packet_slot_hours; all_beneficiaries; outage; missing_interval"
      collection_method: "Read sealed calibrated dedicated shelf and checkout circuit meters at least daily and at configuration changes; preserve raw interval differences, polarity, meter multiplier and bills. Record actual task/idle reservation and occupied/reserved slots across all beneficiaries. Audit the parent/submeter topology before subtraction. No bill-wide residual may be assigned as dedicated use. energy_calc; all-beneficiary shares then MJ conversion and /Q once; missing intervals explicit bounded estimate with evidence, never zero"
      unit: "kWh; s; slot*h"
      frequency: "Each interval, at least daily"
      temporal_coverage: "All open, idle, closed and failure intervals of cohort"
      site_scope: "Documented shelf/checkout circuits only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, topology, interval exports, task/reservation logs and all-beneficiary reconciliation"
    - protocol_id: cp_paper
      process_id: "handling"
      flow_role: "Receipt paper consumption"
      record_type: "Roll and print ledger"
      raw_fields: "roll_id; supplier_spec; net_paper_kg; core_tare; spent_core_kg; core_background_ratio; opening_stock; received; closing_stock; sent_unused; print_event_id; length; paper_width; areal_mass; printed_receipt_open; printed_receipt_close; destination"
      collection_method: "Weigh actual roll net paper with calibrated scale; inventory opening/receipt/closing/unused transfers. Link each print event including failure, tests and zero-sale days. Prefer directly weighed event batches; alternative actual length*width*measured areal mass, with coating included, is exclusive. Count cores separately. Inventory unused paper rolls and already printed retained receipts as distinct physical stocks. paper_calc; direct event or causal shared print-length fractions once; consumed paper reconciles store waste, customer dispatch and stock"
      unit: "kg; m; m2; kg/m2"
      frequency: "Each roll change and print event; period inventory"
      temporal_coverage: "Complete cohort including corrections"
      site_scope: "Assigned checkout printers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale checks, supplier paper construction, spool/print logs and destination balance"
    - protocol_id: cp_residual
      process_id: "residual"
      flow_role: "Named physical waste carriers"
      record_type: "Carrier and destination register"
      raw_fields: "carrier_id; original_packet_id; material; seal_state; gross_kg; bin_tare_kg; opening_bin_kg; closing_bin_kg; dispatch_kg; other_carrier_transfer_kg; date; recipient; treatment; destination_fraction; provider_scope; loaded_distance; empty_distance; composition; uncertainty"
      collection_method: "Segregate named carriers and weigh net actual dispatch, bin contents and incident streams with calibrated scales. Record composition/seal/state and packet origin; sampling of tea moisture and pouch adhesion at actual fates. Collect signed weigh tickets and recipient/treatment route declarations including loaded and empty legs. Document source portions if one bin serves many beneficiaries. Never manufacture a component waste from an unsplit whole carrier. waste_calc; raw carrier reconciliation first, attribution/destination once, /Q once; match provider event IDs to avoid duplicated treatment/transport"
      unit: "kg; km; fraction"
      frequency: "Every bin inventory, dispatch and incident"
      temporal_coverage: "All cohort fates and delayed dispatch/corrections"
      site_scope: "Store residual storage to verified receiving facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales, bin sheets, signed recipient tickets, composition/condition evidence and provider boundary declaration"
    - protocol_id: completion_protocol
      process_id: "handling"
      flow_role: "Required external completion modules"
      record_type: "Boundary/asset/meter responsibility matrix"
      raw_fields: "module_id; source_id; asset_id; component_id; contract_id; provider_scope; beneficiary_id; lifetime_exposure_version; current_exposure; remaining_exposure; cumulative_fraction; final_residual; maintenance_event; terminal_carrier; meter_intersection; effluent_mode; V_discharge; rho; I_piped_water; I_delivered_cleaner_solution; I_other_liquid; I_separate_dry_solid; S_open; S_close; E_vapour; E_product_pool_portion; E_other_carrier_pool_portion; E_separated_solid; missing_data; uncertainty"
      collection_method: "Responsible assembler inventories all five partial_completion groups on site at opening and every change/event. Record physical providers/assets and complete-package boundaries; collect original manufacture/installation records, observed current all-beneficiary exposures, forecast remaining exposures with documented assumptions and revision history, actual maintenance and terminal carriers. Handling exposure includes loaded, empty return/positioning and reserved idle capacity; building/shelf exposure uses assigned area/slot-hours; POS/HVAC use actual attended/load and reserved-capacity hours across beneficiaries. Homogeneous actual payment/communication provider units use metered time or traceable transaction records and signed provider scope, excluding already supplied utilities/IT. Housekeeping measures each actual input and full effluent carrier before allocation; no water-reuse deduction from import meter, and actual effluent V*rho has no second evaporation deduction. completion_calc; separate raw module totals, current allocation and one common /Q; retain original IDs and explicit overlap exclusions; unknowns block whole-retail claim"
      unit: "kg; Item(s); MJ; h; m2*h; slot*h; fraction"
      frequency: "Opening inventory, every event/change, each period and terminal closure"
      temporal_coverage: "All beneficiaries and asset life including zero-output/closed intervals"
      site_scope: "All omitted known retail groups, matched store and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed matrix, asset/provider scopes, calibration, lifelong beneficiary ledger and revised balance, maintenance contracts, terminal weigh records"
  calculation_rules:
    - id: acceptance_calc
      applies_to: "service"
      rule: "For each parent packet i set s_i=1 only at qualified final acceptance after the declared observation tail, otherwise s_i=0 or unresolved; Q=sum_i s_i. Multiple sale attempts never add extra s_i. A later physical reversal replaces the original s_i and corrects all original cohort numerators/fates; append dated corrections rather than booking it only into a new pool. Q=0 retains raw totals with no /Q. Financial refund without physical acceptance change has no automatic s_i effect."
      inputs:
        - packet_id
        - attempt_id
        - final_fate
        - final_acceptance_date
        - physical_return_id
        - cohort_id
      output: "Q unique finally accepted packet services"
      source_ids:
        - ghg-product-2011
    - id: goods_calc
      applies_to: "failed_background; supplier_transfer; external_failure; continuing_transfer; all"
      rule: "Partition each original packet once: s_i (final success), t_i (terminal failed background assigned here), c_i (supplier/other continuing responsibility), o_i (open provisional stock/fate), with s_i+t_i+c_i+o_i=1 and no unresolved partition closed by assumption. B_terminal=sum t_i; successful downstream background=sum s_i original packets, continuing background=sum c_i and provisional=sum o_i; their sum equals original packet receipts plus distinct opening stock, never repeated attempts. A whole failed original packet has t_i=1 even if actual residuals split or prior external consumption reduced remaining mass; assign actual component treatment only, no credit and no invented waste. Record N_supplier,N_transfer and terminal/continuing N_external as distinct physical final fates; external continuing counts belong to c_i, external terminal to t_i, not two backgrounds. The physical packet ledger independently balances opening+receipts+actual customer returns = gross physical handovers+supplier transfers+other custody transfers+packets retired into residual/consumption+closing, each unique event once; gross handover is not Q. Tea original kg linkage, only when needed by the supplier background, uses sum original measured lot net masses of the same selected parent packets and actual pouch masses; never 0.25*count by default or final moisture-corrected kg as original tea kg. This count service does not allocate original goods to partial retail sale fractions: any packet opened for samples/incident is a failed whole original packet; no partial successful service is claimed."
      inputs:
        - packet_id
        - original_lot
        - final_fate
        - recipient
        - background_owner
        - original_net_tea_kg
        - pouch_tare_kg
        - gross_handover_id
        - physical_return_id
      output: "Unique terminal background B_terminal and physical output counts; separate gross stock balance"
      source_ids:
        - ghg-product-2011
    - id: energy_calc
      applies_to: "electricity"
      rule: "For each homogeneous circuit/interval E_raw=(close-open)*verified multiplier. Separate shelf and checkout intervals; use shared_driver measured causal shares a_j with sum across all beneficiaries=1, retain idle/reserved residuals. E_attr=sum E_raw*a_target; negative/unread intervals require correction or an evidenced uncertainty estimate. Convert kWh to MJ once (1 kWh=3.6 MJ), then /Q once. Generic AC identity supplies no grid factor."
      inputs:
        - kWh_open
        - kWh_close
        - multiplier
        - task_seconds
        - reservation_seconds
        - packet_slot_hours
        - all_beneficiaries
        - topology
      output: "3.6*E_attr/Q MJ"
      source_ids:
        - ghg-product-2011
    - id: paper_calc
      applies_to: "receipt_paper; receipt_waste"
      rule: "P_raw=opening_net_paper+received_net_paper-closing_net_paper-unused_sent; tare/core never included. Use either direct consumed mass or actual length*width*measured coated areal_mass, not their sum. Attribute known events directly and shared tests/idle prints by the corresponding all-beneficiary observed print-length or declared capacity shares, not Q alone. P_attr=sum attributed raw paper; /Q once. Reconcile consumed paper = store paper waste + paper handed to customers + (closing_printed_receipts-opening_printed_receipts) with unique event IDs; printed receipt stock is physically distinct from unused roll stock already removed in P_raw, so never apply unused roll stock twice; store waste is measured separately, not presumed equal to input."
      inputs:
        - opening_stock
        - received
        - closing_stock
        - sent_unused
        - net_paper_kg
        - length
        - paper_width
        - areal_mass
        - printed_receipt_open
        - printed_receipt_close
        - destination
      output: "P_attr/Q kg and independent paper fate balance"
      source_ids:
        - ghg-product-2011
    - id: waste_calc
      applies_to: "cardboard_waste; film_waste; sealed_waste; tea_waste; pouch_waste; receipt_core_waste; receipt_waste"
      rule: "For each carrier W_dispatched=sum(gross-bin_tare) of actual outbound consignments; raw generated mass satisfies G+opening_bin=dispatched+closing_bin+other documented carrier transfer, not an automatic addition of stored mass to dispatch. Use raw source-specific weighing or measured composition fractions to attribute shared bins; apply destination fractions to that same attributed pool once, then /Q once. Keep stock-carrier responsibility at the originating cohort through later dispatch. Intact tea+pouch carrier and its split descendants are mutually exclusive by packet and event IDs. Gross commodity mass balance uses original packet gross measurements and actual returns/handover/residual portions, separately from Q; do not replace lost tea by whole wastewater, water gain, missing mass or pouch tare. If mass changes, measure tea moisture and actual recipient/export/environmental transfers and their uncertainty; unresolved imbalance prevents completeness."
      inputs:
        - carrier_id
        - gross_kg
        - bin_tare_kg
        - opening_bin_kg
        - closing_bin_kg
        - dispatch_kg
        - other_carrier_transfer_kg
        - destination_fraction
        - original_packet_id
        - composition
      output: "Attributed dispatched carrier kg/Q and unallocated carrier checks"
      source_ids:
        - ghg-product-2011
    - id: completion_calc
      applies_to: "all"
      rule: "For each omitted module retain physical raw totals before allocation. For asset a and forecast version v, lifetime exposure L_a,v = cumulative actual all-beneficiary exposure through current period + expected remaining all-beneficiary exposure, on the same physical driver stated in completion_protocol. Current manufacture share f_target,p,v=x_target,p/L_a,v. Maintain one asset ledger across every period/beneficiary; sum all shares<=1. A forecast revision replaces prior shares and posts signed differences to original cohorts, never starts a second manufacture life. At terminal closure set remaining exposure=0 and reconcile residual shares to observed lifetime exposure; final terminal carrier is actual carrier mass/count*f_target,total exactly once, with no second manufacture fraction. Actual maintenance/replacement event quantities use event beneficiaries once, excluding evidenced provider inclusions. For other shared operating pools use measured subdivision or the stated capacity/exposure fractions including idle/closed failures; quantities raw→attributed→/Q exactly once. Direct liquid effluent is measured actual V_discharge*rho at matching conditions. Alternative reconstruction is allowed only when direct metering is unavailable and is exclusive with direct V_discharge*rho. Reconstruct full discharged liquid-carrier kg including dissolved/entrained solids as W=I_piped_water+I_delivered_cleaner_solution+I_other_liquid+I_separate_dry_solid+S_open-S_close-E_vapour-E_product_pool_portion-E_other_carrier_pool_portion-E_separated_solid. Measure each term in kg at its actual control-volume crossing. Piped-water import excludes internal reuse; delivered cleaner solution is its whole measured mass including its water and dissolved matter, and those constituents must not be added again as piped water or separate dry solids. I_other_liquid and I_separate_dry_solid contain only disjoint actual additions not already inside another input. S_open/S_close are the same whole liquid-pool inventory; outgoing vapour/volatile, product portions, other-carrier portions and separated solids are mutually exclusive mass portions from this same pool. An export in a wipe/carrier subtracts only the pool-derived liquid/solid portion already included in this balance, never the dry carrier introduced outside the liquid pool; do not also subtract that portion as separated solids or another export. Internal reuse does not cross this balance boundary. Keep whole carrier dispatch weights and composition/retention evidence separate. Direct actual V_discharge*rho never receives these reconstruction deductions, and a water-only balance must never be multiplied by effluent density. Original IDs, physical boundaries and provider intersections must reconcile before combination with this partial module."
      inputs:
        - asset_id
        - component_id
        - beneficiary_id
        - lifetime_exposure_version
        - current_exposure
        - remaining_exposure
        - cumulative_fraction
        - final_residual
        - maintenance_event
        - terminal_carrier
        - meter_intersection
        - effluent_mode
        - V_discharge
        - rho
        - I_piped_water
        - I_delivered_cleaner_solution
        - I_other_liquid
        - I_separate_dry_solid
        - S_open
        - S_close
        - E_vapour
        - E_product_pool_portion
        - E_other_carrier_pool_portion
        - E_separated_solid
      output: "Required source-bound omitted module quantities using same Q"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: q_evidence
      applies_to: "all"
      requirement: "Retain raw calibrated readings, sampling selections, chain of custody, supplier construction/acceptance declarations and actual uncertainty at store/lot/period scope. Unknown and missing data need a labelled gap, bounded evidence-based estimate with sensitivity or explicit incomplete result; never zero. No example, source advice or estimated range is a default or legal compliance limit."
      evidence: "Original meter/scale/lab records, dated deviations and uncertainty report"
    - id: q_absence
      applies_to: "all"
      requirement: "At opening, each operating day and every change, confirm sealed route and absence/presence of retailer processing, delivery, heating/cooling/dehumidifying, cleaning and incident carriers using site walkthrough, staff signoff, purchase/circuit records and incident/return logs. A conditional zero requires actual absence evidence; unknown is unresolved. Existing common services are omitted modules under partial_completion, not absent processes."
      evidence: "Signed configuration/absence register and completion matrix"
    - id: q_translation
      applies_to: "all"
      requirement: "Compare every populated English business field and corresponding Chinese field including actual formulas, inputs, qualifiers, source use, obligation strength and exceptions; stable identifiers and single-process protocol references must match. Localized identity audit and semantic translation review are separate from simple Chinese presence."
      evidence: "Field/array comparison plus substantive bilingual reading record"
validation_rules:
  - rule_id: v_reference
    applies_to: "all"
    rule: "Require Q>0, one homogeneous defined packet-service unit, all qualifiers, final physical acceptance evidence and closed receipt/attempt/fate ledgers. Q cannot equal gross dispatch, invoice count, kg, tea mass gain or retained refused packets. Check goods_calc unique-partition closure and moisture/mass uncertainty separately. Unknowns block closure."
    source_ids:
      - ghg-product-2011
  - rule_id: v_rows
    applies_to: "all"
    rule: "Verify every actual card’s process/direction/type, one carrier or product identity, unit, raw rule, attribution, source IDs, original evidence, protocol and single final /Q. Check provider overlap and original supplier-packet background count once. No unknown input, route, capture, stock or destination is zero by default; any actual new exchange requires named bilingual cards and supported protocols before sync and completeness."
    source_ids:
      - ghg-product-2011
  - rule_id: v_projection
    applies_to: "all"
    rule: "Compare both languages for every constraint, qualifier, condition, exception, formula and denominator; retain exact row/rule/protocol identities. Regenerate structured from canonical Markdown, and compare actual machine guidance for all obligations including completion duties. A fingerprint/schema pass is not a semantic review or methodology approval. Report this partial module and unresolved identities separately from checks performed and checks not completed."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only this measured partial service module per one finally accepted defined tea packet, after row identities and complete source data are resolved"
  allowed_use: "Explicit modular combination using partial_completion and completion_calc with same Q and source-bound overlap exclusions"
  excluded_use: "Whole-retail footprint without completion; tea manufacture replacement; other tea/coffee/spices or channels; legal conformity or published methodology claim"
  required_metadata: "All reference qualifiers, original packet/lot lineage, actual gates, Q and corrections, completion matrix, supplier/background responsibilities, raw allocations, provider overlap and sources"
  required_quality_disclosure: "Partial boundary; unresolved identities; actual missing data and uncertainty; temporal/geographic/site applicability; checks performed versus incomplete checks; no invented defaults"
  update_trigger: "SKU/package/route/gate changes; new incident/carrier; late acceptance/fate correction; source/provider/asset changes or resolved identity"
data_sources:
  - id: "un-cpc-62127"
    type: "official_guidance"
    reference: "UNSD CPC3.0 explanatory note 62127, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62127"
    used_for: "Class2391 coffee/tea and2392 processed spices establish classification context only; this PCR is narrower"
  - id: "tea-board-storage"
    type: "official_guidance"
    reference: "Tea Board India FAQ, How should we store tea at home?, https://teaboard.gov.in/TEABOARDCSM/NDQ%3D"
    used_for: "Qualitative moisture/light/odour protection only; retail implementation is PCR design, no numeric limit or specific pouch validation"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard (2011), chapters6–7 and9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Unit-of-analysis/service and allocation hierarchy as general method context. The specific gates, formulas, partial module and collection duties are PCR design, not a claim of full standard conformity or mandated numeric values."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:860af68b5ff39996291f3d2cfc2f87b52371c71cbb0bdeea182717d2e10126c2"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5199"
      family: "system_boundary"
      span:
        start:
          offset: 5199
          line: 58
          column: 1
        end:
          offset: 14128
          line: 83
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Retailer custody of the supplier-filled sealed pouch at store receipt; only subsequent specified incremental module activities |\n| starting_condition_role | foreground_gate |\n| product_classification_scope | Narrower subset of CPC 3.0 62127 tea retail, not coffee or processed spices |\n| recursive_input_rule | Do not recursively add another retail service for the same packet/gate. Failed goods production and transfer ownership follow goods_calc; no second successful-goods production input here. |\n| upstream_dataset_requirement | Traceable actual receiving-gate packet production/primary and supplier transit packaging/inbound transport, complete named operation/material/treatment providers; precise unresolved identities prevent dataset completeness |\n| disclosure | Partial shelf/checkout service; five fixed completion groups, unresolved candidate flows, actual exclusions and no total-retail claim |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_route | all | This is one partial incremental retail module for non-specialized walk-in stores: supplier-filled, opaque heat-sealed PET/aluminium/PE laminate pouches, nominal net 250 g, containing only dried unflavoured black tea leaves of Camellia sinensis. Fix one manufacturer, SKU, tea grade, pouch construction and acceptance specification per dataset. Record the actual net tea mass and moisture basis of each receipt lot; 250 g is the format identifier, never an assumed measured mass. Receive at the store receiving gate, inspect and place unopened packets on a dry ambient shelf, then hand them over at an attended checkout for the buyer’s own use. There is no retailer brewing, tasting, grinding, blending, repacking, delivery, refrigeration or dehumidification within this module. Coffee, spices, green/oolong/instant tea, flavoured tea, tea bags, cans and loose bulk sales are excluded. Actual incidents and failed cohorts remain in the pool; an excluded operational route cannot be made equivalent by renaming it. The module includes dedicated shelf/checkout electricity, receipt paper and the specified residual carriers. Known common premises, assets and housekeeping are excluded here only under the mandatory completion matrix below. The partial result must never be described as the whole retail footprint. | un-cpc-62127; tea-board-storage |\n| gates | all | Start when the retailer accepts physical custody at the store receiving gate; end at qualified final handover after the prospectively declared physical return/acceptance observation window, or a recorded terminal/continuing failed fate. Record gate dates, custody, seal/label/lot/condition, buyer acceptance and destination. Payment alone is not qualified acceptance. Internal shelf movement is not a second receipt or service. Retailer transport after receipt is outside this route; any actual trip requires a separate completed route module before aggregation. | un-cpc-62127; ghg-product-2011 |\n| partial_completion | all | Before any whole-retail claim, the responsible assembler must attach a source-ID and boundary-matched completion matrix for (i) shared premises lighting, HVAC, ventilation and office/checkout IT operation not on the dedicated meter plus actual payment and communication services; (ii) building including shell, fixed wiring/luminaires and installed common systems; (iii) shelf, checkout/POS and actual loaded plus empty handling trolley/pallet equipment; (iv) all housekeeping water, each detergent/cloth, wastewater and other residuals; (v) maintenance, installation and terminal asset carriers and actual transport. For every module use this same cohort and final denominator Q, record meter/provider intersections and exclude duplicates by event/asset/component IDs. Retain failed, idle, closed and zero-output periods. Unknown coverage blocks completeness, never equals zero. Required measurement and allocation methods are fixed in completion_calc and completion_protocol; modellers may supply actual quantities and suppliers, not choose another denominator or cut-off. No excluded asset burden is silently declared insignificant. | ghg-product-2011 |\n| goods_responsibility | failed_background; service; supplier_transfer; external_failure; continuing_transfer | The service is distinct from tea manufacture. Successful merchandise manufacture, its original pouch, actual share of supplier transit cartons/LDPE film and inbound transport to this receiving gate belong once to the downstream successful-goods background, exactly one original packet per finally successful unique packet. Include in failed_background only original packets whose terminal failed-goods background is assigned to this service under goods_calc. Supplier returns, stock and other continuing recipients retain an explicit continuing full upstream responsibility chain; no avoided-production credit. A returned packet later resold successfully receives one goods background, not one per attempt. Final failed external retention/consumption has an identified recipient and responsibility, never automatic retailer waste. Physical transfer outputs do not add another upstream background. | ghg-product-2011 |\n| tea_integrity | all | The opaque moisture-barrier pouch remains unopened for sale. Tea Board advice concerns cool/dry protection and avoiding odours, not a numeric legal storage limit or this particular packaging specification. Obtain signed SKU/lot acceptance conditions, shelf-life/date coding and actual supplier packaging declaration; record shelf temperature/RH, odour/contamination checks and seal integrity each operating day and each receipt/return/fate event. No default moisture, permeability, shelf life or compliance limit is supplied. Counted service cannot increase merely because tea absorbs water. Do not infer zero moisture/volatile transfer from a nominal airtight claim. Changes that affect condition, mass reconciliation or environmental transfers require measured bounds; unknown material transfer prevents closure. | tea-board-storage |\n| incident_extension | tea_waste; pouch_waste; sealed_waste | Routine sales involve unopened complete packets; damaged, opened-returned and sampled packets are never counted as an unopened successful packet. Preserve their whole original-packet background responsibility even if residual mass is less after a documented external consumption. Keep intact disposed packets in sealed_waste. For a physically separated incident weigh actual loose tea and empty pouch separately, never count their original intact carrier again. Tea_waste contains only collected dry tea as actually moist, not cleaning water; pouch_waste contains actual emptied laminate with measured adhering tea assigned once. Record any third carrier, spill collection material, cleaning, leachate, humidity/volatile flux or offsite sample treatment with named cards/protocols in both languages and normal sync before a complete dataset. Fix species identity, actual inlet/outlet medium, raw boundary mass and recipient attribution first; unknown incident fate is unresolved, not zero or an invented air emission. | ghg-product-2011 |\n| waste_boundary | cardboard_waste; film_waste; sealed_waste; tea_waste; pouch_waste; receipt_core_waste; receipt_waste | Weigh each actual dispatched carrier; retain opening/closing bins and collection dates. Treatment backgrounds must match each carrier and actual recipient and include evidenced pickup transport and treatment boundaries. Waste output links to that treatment background once; do not also enter an input for the same treatment, contained tea/laminate or provider fuel. Obtain provider route/loaded/empty-leg coverage; uncovered empty distance cannot disappear as zero tonne-km, and requires separately measured vehicle-distance route activity with overlaps removed. Fractions of destinations sum to one on one raw carrier pool, applied once. No recycling or avoided-material credit. Unknown recipient, carrier composition needed for treatment, or provider overlap blocks completeness. | ghg-product-2011 |\n| identity_completion | all | Only the displayed electricity UUID is bound; it is generic point-of-use AC with provider and voltage unspecified and no emission factor. All other flow identities remain concrete unbound candidates. Before a completed foreground dataset, bind each row to an exact official product/waste identity and compatible property/unit, or retain an explicit unresolved finding and disallow completeness. Direct official response plus matching integrity receipt must establish UUID, state, official names, qualifiers and property/unit chain. Search hits or similar names do not bind identity. Match actual suppliers, composition and treatment. Candidate availability is not scientific or release approval. | ghg-product-2011 |\n\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 320
              line: 10
              column: 1
            end:
              offset: 414
