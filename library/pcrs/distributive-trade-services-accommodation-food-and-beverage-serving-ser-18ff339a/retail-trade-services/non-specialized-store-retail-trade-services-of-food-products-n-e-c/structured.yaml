      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Supplier-unloaded cartons containing original intact same-SKU dry pasta PP packs accepted into retailer-controlled receiving stock; actual original fill/BOM and inbound responsibilities recorded |\n| starting_condition_role | foreground_collection_gate |\n| product_classification_scope | Narrower than CPC3.0 62129; specified group237 spaghetti retail route only |\n| recursive_input_rule | Do not recursively add the same retail service to its merchandise/asset/waste input. Keep original receiving merchandise background, distinct complete asset provision and actual waste route identities; F is included here, S/T responsibility is separately carried once. |\n| upstream_dataset_requirement | One actual compatible source-pack receiving background including measured fill/BOM/inbound gate; evidenced complete seven-object lifetime models; actual supply mixes and whole-carrier waste collection/treatment routes. Unresolved boundaries/identities block final verified completeness. |\n| disclosure | Disclose exact scope/gates, excluded human/consumer activities, F versus S/T background split, count basis and real original masses/BOM, all package inclusion evidence, allocation/idle/lifetime versions, unknown identities and unnormalizable zero-output pools. This is retail service, not whole pasta life cycle. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| route | all inventory rows | Apply the declared route and scope exactly. Supplier unloading, pallet return and incoming transport finish before the receiving gate and remain in the original receiving background. After-gate retailer work, energy, material use, failed attempts, stock holding, waste separation and contracted downstream waste management are included. Customers collect on site. Human labor/metabolism, employee commuting and consumer travel/use/cooking/final consumer-package disposal are excluded and disclosed; these are not zero-impact claims. | src_un; src_pasta; src_retail; src_method |\n| qualifying_service | service_out | Count a pack once only after intact seal, correct SKU/lot, agreed product state, declared contractual release/quality conditions and documented final-use acceptance hold. Re-sale after revoked acceptance is not an additional service for that same source pack. A purely financial refund/discount with acceptance remaining valid leaves N unchanged; actual acceptance revocation changes N even without physical return. Broken, wet, pest-affected, refused, sampled or externally retained without qualifying acceptance is not successful output. | src_pasta; src_method |\n| pool | all inventory rows | Use a prospective receipt pool of 12 consecutive calendar months for this unchanged site/SKU/configuration, with start/end dates fixed before sales are observed. Follow every source pack until all physical and S/F/T/O responsibilities resolve; the final cutoff is no earlier than the last applicable contractual return/revocation deadline and closure of every pending claim/fate. A configuration change ends that configuration pool at the actual change event and retains every preceding failure/idle interval; never merge unlike configurations. Define configuration/site/receipt cohorts and a follow-up policy before observing sales. Retain every failed, idle, closed and zero-sale interval in the same-configuration pool. N is the corrected distinct final-accepted pack count, not gross checkout events or receipts. Close only when every original pack has a resolved S/F/T/O responsibility; O must be zero for a final closed dataset. For N=0 retain absolute inventories as unnormalizable and extend the prospectively declared pool or report incompleteness, never drop it. Later events version and replace original numerator, denominator, backgrounds and fates with signed differences; do not charge a new cohort twice. | src_method |\n| goods_background | failed_background; service_out; supplier_return; stock_transfer; failed_retained | Separate physical movement from original-pack responsibility. S is one receiving pack whose final qualifying service is here; F is one irreversibly failed original pack whose background remains with this service, including destroyed tests and failed external retention unless a signed continuing-responsibility handoff exists; T is one original pack with documented supplier/other-stock handoff and continuing background; O is unresolved/open stock. An actual supplier return requires supplier identity, gate receipt, state and ownership; internal transfer is not supplier return. Financial credits do not prove either. Failed external retention needs recipient, state, ownership, next fate and responsibility. No failure background is written off because the carrier is outside the store. A source pack split into waste descendants still carries one whole original background; never one background per fragment. | src_method |\n| upstream_once | failed_background; service_out | The service includes only F receiving-background coupling, evaluated from actual receiving fill, packaging BOM, manufacturer supply and inbound delivery/unloading for each original pack. A downstream full sold-product model must add the S backgrounds once using the same original gates and source-pack records, plus this service; it must not add all received goods again. T backgrounds continue in the signed receiving stock system; O blocks closure. Do not substitute nominal 0.5 kg, final pack weight, equal wet/dry mass or equal per-pack impact for original receiving inventories. Actual whole-pack responsibility avoids an invented dry-matter allocation. | src_method |\n| assets | building_life; shelf_life; trolley_life; cashbox_life; broom_life; mop_life; pen_life | Each asset card is one homogeneous complete lifecycle-provision product for one uniquely specified object, measured as Item(s) of that complete lifetime. Before binding, require a signed scope/BOM and one compatible provider/model identity covering manufacture, initial finishes/components, installation, actual lifetime maintenance/replacements, their utilities/travel/wastes, decommissioning and final treatment/transport. This is not an arbitrary collection of repair jobs. Building includes structure/envelope/floors, fixed plumbing/wiring and complete fixed lighting; excludes shelving, trolley and cashbox. Each of the other six objects excludes the building and every other asset class. Occupied-store operation utilities/materials are excluded from all seven packages and appear in operation cards. Packaged maintenance and terminal carriers must not be added again in foreground. If a full package cannot be evidenced, it is unresolved, not zero: author disjoint named component/material/service/waste cards and protocols before dataset completion. | src_method; src_retail |\n| waste_boundary | intact_pasta_waste; loose_pasta_waste; pp_waste; carton_waste; receipt_waste; cleaning_effluent | Use actual whole physical carriers at their collection/handoff gates. Intact discarded PP-bag pasta is one measured composite carrier, not that carrier plus its contained pasta/PP. Only actual separated loose pasta and emptied PP go to their separate cards. Cartons retain adhered tape; do not also count contained tape. Distinct waste carrier IDs, measured compositions, storage, handoff and recipient route distinguish recycling, treatment and retained stock; no avoided-production or recycling credit is assumed. Each matched downstream waste process must cover observed collection, haulage including actual empty legs/idle and treatment once, or add named separately measured transport/treatment cards before completeness. Zero payload does not erase vehicle movement. Waste sewer is a technosphere carrier, not an elementary water emission; provider treatment emissions belong downstream. | src_retail; src_method |\n| changes | all inventory rows | Daily route inspection, incident/maintenance records and utility/equipment register determine presence or absence. Unknown chemicals, pest treatment, moisture damage, mechanical ventilation, extra packaging or transport are not zero. Collect names, composition/state, amounts, supplier/recipient and causes immediately, quarantine applicability and add bilingual atomic cards/protocols with fixed method, property/unit and one denominator before claiming complete guidance/data. A prior marker, schema check or source citation does not establish scientific approval. | src_retail; src_method |\n| supplies | cleaner; receipt_paper; pen_life; broom_life; mop_life | Cleaner is a single aqueous sodium-dodecyl-sulfate formulation, with actual concentration and no other active ingredient confirmed from supplier composition/SDS; its background includes the evidenced actual delivery and supply-container lifecycle, not an assumed zero package. Unknown formulation or disposable supply-container wastes require named extra cards. Plain uncoated paper and complete oil-based ballpoint pens are separate products; no ink fraction is multiplied into the whole-pen input. A spent complete pen is one carrier, not pen plus cartridge/ink. Broom is one complete polypropylene-bristle manual broom including its actual handle; mop is one complete cotton-head manual mop including its actual handle. Their complete lifecycle packages must satisfy assets; routine in-store washing water/cleaner/effluent are excluded from the packages and included in operations/residue. Use measured cleaned-area*event exposure including failure cleanup and reserved idle for each tool in calc_lifetime; update its all-beneficiary lifetime ledger and final residual by the same equation. | src_retail; src_method |\n\n\n"
