          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_hierarchy | all inventory rows | Use dedicated measured quantities first. For unavoidable shared raw pool X, subtract a submeter only when verified physically inside the parent boundary; select disjoint meter cuts. Attribute the remaining complete pool to all actual beneficiaries using declared physical drivers: lit/reserved floor-area-hours for lighting/building; occupied plus reserved shelf-volume-hours for shelving; measured active loaded plus empty/positioning minutes plus causally reserved idle for trolley; actual checkout-task minutes plus declared reserved idle for cashbox; actual cleaned floor-area times cleaning frequency/dose for common cleaning. Beneficiary ledgers include unsuccessful goods and closed/idle intervals. Allocate residual idle/closed demand using the same prospective reserved-capacity shares; never successful sales shares or unexplained zero. For paper, trace dedicated task receipts directly; shared handwritten sheets use measured source-linked written area, with measured common headers/footers/blanks apportioned by the same written-area shares across all actual task beneficiaries, including failures. Record the area-per-line sampling and uncertainty rather than assuming equal line lengths. All driver totals and shares must reconcile to the original measured pool. If no causal driver can be measured, completeness is blocked. | src_method; src_retail |\n| lifetime | building_life; shelf_life; trolley_life; cashbox_life; broom_life; mop_life; pen_life | Apply calc_lifetime to each complete asset lifetime, all actual past/present/future beneficiaries and periods. Current raw exposure and declared reserved-idle exposure cannot omit failed goods or empty movements. Maintain cumulative previous allocations, version expected lifetime exposure and replace historical fractions with signed corrections on revision; never restart the whole asset burden. At actual retirement, reconcile every beneficiary and allocate the final residual exactly once. The seven complete provision packages already contain their own maintenance and end-of-life responsibilities: no additional asset manufacturing or terminal carrier multiplier is allowed. | src_method |\n| no_credit | all inventory rows | No retail co-product or substitution credit is defined for this intact-pack route. Monetary refunds are not negative product flows. Internal stock, supplier returns, externally failed retention, waste and actual recycled carriers retain their separate recorded states. Count each service original once; count each raw material/energy/waste pool once; normalize allocated totals by N once with calc_normalize. | src_method |\n\n\n"
