allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "all inventory rows"
    rule: "Use dedicated measured quantities first. For unavoidable shared raw pool X, subtract a submeter only when verified physically inside the parent boundary; select disjoint meter cuts. Attribute the remaining complete pool to all actual beneficiaries using declared physical drivers: lit/reserved floor-area-hours for lighting/building; occupied plus reserved shelf-volume-hours for shelving; measured active loaded plus empty/positioning minutes plus causally reserved idle for trolley; actual checkout-task minutes plus declared reserved idle for cashbox; actual cleaned floor-area times cleaning frequency/dose for common cleaning. Beneficiary ledgers include unsuccessful goods and closed/idle intervals. Allocate residual idle/closed demand using the same prospective reserved-capacity shares; never successful sales shares or unexplained zero. For paper, trace dedicated task receipts directly; shared handwritten sheets use measured source-linked written area, with measured common headers/footers/blanks apportioned by the same written-area shares across all actual task beneficiaries, including failures. Record the area-per-line sampling and uncertainty rather than assuming equal line lengths. All driver totals and shares must reconcile to the original measured pool. If no causal driver can be measured, completeness is blocked."
    source_ids:
      - src_method
      - src_retail
  - rule_id: lifetime
    applies_to: "building_life; shelf_life; trolley_life; cashbox_life; broom_life; mop_life; pen_life"
    rule: "Apply calc_lifetime to each complete asset lifetime, all actual past/present/future beneficiaries and periods. Current raw exposure and declared reserved-idle exposure cannot omit failed goods or empty movements. Maintain cumulative previous allocations, version expected lifetime exposure and replace historical fractions with signed corrections on revision; never restart the whole asset burden. At actual retirement, reconcile every beneficiary and allocate the final residual exactly once. The seven complete provision packages already contain their own maintenance and end-of-life responsibilities: no additional asset manufacturing or terminal carrier multiplier is allowed."
    source_ids:
      - src_method
  - rule_id: no_credit
    applies_to: "all inventory rows"
    rule: "No retail co-product or substitution credit is defined for this intact-pack route. Monetary refunds are not negative product flows. Internal stock, supplier returns, externally failed retention, waste and actual recycled carriers retain their separate recorded states. Count each service original once; count each raw material/energy/waste pool once; normalize allocated totals by N once with calc_normalize."
    source_ids:
      - src_method
dataset_production:
  collection_protocols:
    - protocol_id: cp_goods
      process_id: "retail"
      flow_role: "Source-pack service, goods background and physical transfer"
      record_type: "receiving_acceptance_fate_ledger"
      raw_fields: "site_id; pool_version; SKU; lot; ingredient_species; pack_id; source_pack_id; receipt_id/date; original_gate; actual_net_fill_m_i; gross_kg; tare_kg; actual_PP_ink_BOM; carton_tape_BOM; upstream_dataset_scope; inbound_route; source_background; supplier; receipt/checkout/return/revocation/price-adjustment event_id/time; final_accepted; quality_release; seal_state; temperature; humidity; control_pack_mass_time; physical_handover_count/mass; recipient; owner; fate; continuing_handoff; S/F/T/O; cutoff"
      collection_method: "Assign traceable original pack IDs at receipt, maintain every event and final status through cutoff. Weigh stratified same-SKU/lot receipt packs and matched emptied-bag tare with calibrated scale; destructive samples are actual failed goods with recorded descendants. Record selection frame, sample count, all observations, uncertainty and changed-lot remeasurement; never replace fill by label. Reconcile supplier BOM and inbound background scope against original records. Observe seal/product release and signed contractual acceptance; collect actual physical handovers separately. Record same-lot unopened controls at receipt and each stock census under logged temperature/humidity; use actual net exchange uncertainty in calc_stock. Aggregation and calculations: Apply calc_service, calc_background and calc_stock to original raw records; transfer counts use actual gate events, final responsibility count uses unique sources. Final allocated numerator / N per reference flow under calc_normalize."
      unit: "Item(s); kg; date/time; degC; relative_humidity"
      frequency: "Every receipt and event; stock census daily and pool endpoints; controls at each census; sample every lot/change"
      temporal_coverage: "Full prospective pool including all prior opening-stock provenance, idle/failures and late corrections through cutoff"
      site_scope: "Receiving, shelf/backroom and cash-handover gates of the declared store only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale calibration/check weights; sample sheets; package photos/BOM; supplier background boundary; signed gate receipts/acceptance; original immutable event IDs; complete S/F/T/O and stock reconciliation"
    - protocol_id: cp_operations
      process_id: "retail"
      flow_role: "Retail operation inputs"
      record_type: "meter_stock_and_task_ledger"
      raw_fields: "site_id; pool_version; meter_id/parent diagram; start/end/time/readings; kWh; V_import; measured temperature; rho_water; SKU/source task; all beneficiaries; lit/reserved_m2_h; cleaned_area; cleaning_events; opened/closed/idle intervals; actual dose; supplier/SDS/concentration_c; cleaner opening/purchases/closing/exports; cleaner delivery/container scope; paper opening/purchases/closing/waste; paper area/grammage; source_written_area; common_header_footer_blank_area; area_per_line_sample; complete_pen opening/purchases/closing/exports; pen issue/retirement; actual written_lines; raw task driver; calibrated method; uncertainty"
      collection_method: "Read calibrated dedicated meters first; verify parent/submeter diagrams and full interval coverage. Weigh cleaner/paper inventories and actual receipts/exports; verify paper mass directly or measured area*grammage, not sheet count without conversion. Supplier composition fixes formulated cleaner identity. Trace complete-pen purchases/stock/issue/retirement as source evidence and lifetime-capacity checks only. The pen_life exchange is exclusively current attributable written-line exposure divided by the complete all-beneficiary lifetime capacity under calc_lifetime, then N once; do not additionally enter consumed/purchased pen count/N. Preserve remaining usable capacity and signed lifetime corrections, including failed records. Inspect actual receipts and cleaning routes and record no-occurrence with log evidence. Aggregation and calculations: Raw totals to one physical attribution using calc_share; conversions in calc_energy/calc_water; paper consumed totals attributed once; complete-pen stock/counts check the source/lifetime only and pen_life quantity exclusively uses calc_lifetime; allocated total / N per reference flow using calc_normalize."
      unit: "kWh; m3; kg; Item(s); written_lines; m2*h"
      frequency: "Meters each operating/closed interval and pool endpoints; cleaning/task/issue every event; stock daily and endpoints"
      temporal_coverage: "Complete pool and all interval overlaps; match original-cohort late corrections"
      site_scope: "Actual store lighting, cleaning and handwritten checkout; supplier/container backgrounds explicitly outside operation meters"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, utility invoices, scope diagrams, complete metered reconciliation, supplier SDS/BOM/container scope, weighed stocks, written-line samples and full task ledger with idle assignments"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "Seven distinct complete lifecycle-provision objects"
      record_type: "asset_lifetime_scope_ledger"
      raw_fields: "asset_id; class; serial/configuration; package_unit; signed scope/BOM; provider/model_id; package_version; manufacture/installation/initial_parts; all lifetime maintenance/replacements/utilities/travel/waste; terminal treatment/transport; operation exclusions; all beneficiaries; expected_lifetime_L; current_exposure_x; past_x/f; idle/reserved share; loaded/empty/positioning trolley minutes; building_m2_h; shelf_m3_h; checkout_minutes; broom/mop cleaned_m2_events; retirement; actual_lifetime_exposure; corrections; unknown_scope; pen written_lines; actual_remaining_writing_capacity"
      collection_method: "Audit one actual object/package identity at a time using signed applicable complete supply scope or a verified complete object background model with BOM and actual event records. Test every maintenance work order and replacement/terminal handoff against inclusion fields; unknown scope is incomplete. A future maintenance allowance without a substantiated model cannot become verified inclusion. Record missing object-specific event/material identities and author distinct input/output cards, raw protocols and one-normalization rules before completion if outside package. Measure exposure using timed task/area-volume occupancy records; include actual empty trolley runs and reserved idle; do not infer activity from payload. Aggregation and calculations: Apply calc_lifetime to complete one-object lifetime quantities, including tool exposures fixed in supplies; keep complete model upstream, no duplicate foreground maintenance/EOL; lifetime-attributable Item(s) / N per reference flow once."
      unit: "Item(s); m2*h; m3*h; min; m2*events; written_lines"
      frequency: "On acquisition, every use/reservation/maintenance/replacement and terminal event; lifetime review at least every pool close/change"
      temporal_coverage: "Whole actual/expected lifetime and all beneficiaries/periods, versioned signed corrections"
      site_scope: "Store building, complete steel shelf, manual hand trolley, steel cashbox, PP-bristle broom, cotton-head mop; disjoint scopes; complete oil-based ballpoint pen"
      aggregation_rule: "per reference flow"
      quality_evidence: "Applicable signed complete contract or independently audited complete model; BOM/work orders; original/replacement scope matrix; exposure evidence and cumulative <=1 ledger; retirement residual agreement; all gaps explicitly block"
    - protocol_id: cp_residue
      process_id: "residue"
      flow_role: "Six distinct actual residual carriers"
      record_type: "carrier_handoff_and_liquid_ledger"
      raw_fields: "carrier_id; source_pack_id; portion_id; parent_carrier; state; process; recipient; route; owner; date; gross_kg; tare_kg; actual_composition; source_component_matrix; stock_open/close; V_actual_discharge; rho_full_liquid; liquid_temperature; reconstruction_mode; imported_water; measured_cleaner_mass; measured_goods_or_other_material_entering_liquid; opening_liquid_inventory; closing_liquid_inventory; measured_whole_liquid_exports; actual_evaporated_species_mass; other_measured_nonsewer_fates; provider collection/haulage/treatment scope; empty_distance; idle_duration; calibrated_method; uncertainty"
      collection_method: "Weigh individual carrier net masses before each handoff using calibrated scales and trace all source descendants; distinguish intact-bag, dry-loose-pasta and emptied-PP routes by actual separation. Record carton adhered tape as a contained component of that carton only. Pen stock/retirement and final-recipient records are retained solely to verify the included pen_life upstream package, not another foreground carrier or part of carton/other waste. If an actual pen terminal route is outside that evidenced package, exclude it from the package and author its separate actual-state named card/protocol before completeness, never duplicate it. Collect full effluent volume with composition/temperature-matched density or all kg terms of exclusive calc_water reconstruction, including mop retained-liquid stock. Sample all actual cleaning/accident regimes and document sampling coverage/uncertainty; never adopt a literature density or water-only balance. Confirm downstream provider boundary and actual empty/idle activity; named missing activities must be added before completeness. Aggregation and calculations: Apply calc_carriers and calc_water; whole-carrier attributed net kg / N per reference flow using calc_normalize. Reuse source IDs solely for goods physical reconciliation, never duplicate a carrier/contained species or normalize twice."
      unit: "kg; m3; degC; km; h"
      frequency: "Each separation/spill/waste handoff; every discharge/cleaning event; stock at daily and pool endpoints"
      temporal_coverage: "Full pool including delayed handoffs, stored carriers and original-cohort corrections"
      site_scope: "Actual retailer residual accumulation gates and sewer connection; supplier handling/treatment boundaries evidenced"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weigh tickets, actual composition samples, unique source/portion matrix, recipient receipts, provider-scope/route logs and mass/liquid balance with measured stock/uncertainty"
  calculation_rules:
    - id: calc_service
      applies_to: "service_out"
      rule: "N = count_distinct(source_pack_id with final_accepted = true); remove revoked acceptances even if physically retained outside; preserve valid acceptance after pure price adjustment. One final qualifying original gives one service; N/N = 1 Item(s). Gross checkout attempts, return events and copies of receipts are not N."
      inputs:
        - source_pack_id
        - final_accepted
        - acceptance_revocation_id
        - price_adjustment_id
        - cp_goods
      output: "N; service_out"
      source_ids:
        - src_method
    - id: calc_background
      applies_to: "failed_background; service_out; supplier_return; stock_transfer; failed_retained"
      rule: "Partition every original receiving pack i into exactly one final S, F, T or O state; G = S_count + F_count + T_count + O_count for unique original receipts, including opening stock with its original gate. B_F = sum_i[1(F_i) * original_pack_background_i]; B_S analogously for S. failed_background uses F_count/N Item(s) only for a homogeneous actual original-pack identity, with original fill m_i and complete packaging BOM retained in its background. If lot fills/BOM/backgrounds differ, stratify into named row identities and use their F_count/N; never average unlike items into a false identical background. Downstream complete sold-product assembly adds B_S/N once, not 0.5 kg or all G backgrounds. T carries original backgrounds onward with a signed handoff; O blocks final closure. Whole source-pack failure assigns one original background regardless of multiple waste descendants."
      inputs:
        - source_pack_id
        - original_receiving_gate
        - original_pack_background_i
        - m_i
        - packaging_bom
        - responsibility_state
        - continuing_handoff
        - cp_goods
      output: "B_F; B_S; F_count; S_count; T_count; O_count"
      source_ids:
        - src_method
    - id: calc_stock
      applies_to: "supplier_return; stock_transfer; failed_retained; intact_pasta_waste; loose_pasta_waste; pp_waste"
      rule: "Keep a separate gross physical ledger: opening gross goods stock + received gross goods + physical customer returns + measured net environmental mass uptake = closing gross goods stock + all gross customer handovers + actual supplier handovers + actual other-stock transfers + intact discarded goods + source-goods portions of separated carriers. A gross handover includes failed external retention and later-revoked sales; N never replaces it. Weigh receiving/current gross packs and matched emptied-bag tare on calibrated scales; collect same-lot control-pack mass/time/temperature/humidity to quantify actual exchange or its uncertainty, not a nominal zero. Include negative net exchange as a signed term. Separate carton/tape, added cleaner/water and unrelated receipts from goods-derived mass. Unknown residue, theft, moisture or recipient mismatch remains a visible unresolved residual and blocks closure; never force it into waste or sales."
      inputs:
        - gross_stock_open
        - gross_receipts
        - customer_return_mass
        - net_environment_exchange
        - gross_stock_close
        - gross_customer_handover
        - supplier_handover
        - other_stock_handover
        - source_carrier_mass
        - cp_goods
        - cp_residue
      output: "gross_physical_balance; unresolved_residual"
      source_ids:
        - src_method
    - id: calc_share
      applies_to: "electricity; cleaning_water; cleaner; receipt_paper; building_life; shelf_life; trolley_life; cashbox_life"
      rule: "For each disjoint measured pool X and driver ledger, X_service = X_dedicated + X_shared * d_service / sum_all_beneficiaries(d). Meter boundary diagrams must prove any included-submeter subtraction; never subtract an independent meter. The declared drivers in allocation_hierarchy include reserved idle/closed shares and failed goods. Retain zero-sale periods and full remainder; missing driver/coverage is unknown, not zero. Do not multiply the same beneficiary share again during calc_normalize."
      inputs:
        - X_dedicated
        - X_shared
        - d_service
        - d_all
        - meter_boundary
        - source_written_area
        - common_header_footer_blank_area
        - area_per_line_sample
        - cp_operations
        - cp_assets
      output: "X_service"
      source_ids:
        - src_method
    - id: calc_energy
      applies_to: "electricity"
      rule: "E_MJ = 3.6 * allocated_kWh; use calc_share on raw metered energy first, then E_MJ/N once. No emission factor is multiplied into the physical electricity exchange. The point-of-use AC identity does not identify grid mix/provider/voltage; collect the actual supplier boundary and match a separate background."
      inputs:
        - meter_kWh
        - allocated_kWh
        - supplier
        - voltage
        - cp_operations
      output: "E_MJ"
      source_ids:
        - src_method
    - id: calc_water
      applies_to: "cleaning_water; cleaner; cleaning_effluent"
      rule: "Imported cleaning-water kg = sum(V_import * rho_water at measured temperature); water meters already exclude internal reuse, so never deduct reuse again. Cleaner consumption kg = opening sealed/usable cleaner + purchases - closing usable cleaner - actual returns/export, with spills separately traced; supplier concentration c is identity/quality data, not a multiplier on formulated-cleaner kg. Effluent direct mode J = sum(V_actual_discharge * rho_full_liquid at sampled temperature/composition) with no evaporation/reuse/stock subtraction. Exclusive reconstruction mode, if direct collection impossible: J = imported_water + measured_cleaner_mass + measured_goods_or_other_material_entering_liquid + opening_liquid_inventory - closing_liquid_inventory - measured_whole_liquid_exports - actual_evaporated_species_mass - other_measured_nonsewer_fates, all kg at the same boundary and period. Include cleaner carrier water/solutes and measured dissolved pasta in whole J; do not turn a water-only volume remainder into whole effluent using density. Cleaning-tool retained liquid has measured opening/closing stock. Source-goods portions are used only in calc_stock, not a second waste exchange. If any unknown route, source or stock remains, block reconstructed J; no assumed evaporation, capture or zero residue. Reconstruction terms are strictly at the defined mixed-liquid pool: imported_water is measured water actually entering that pool, not all inlet-meter water if some bypasses it; measured_cleaner_mass is actual whole formulation entering it, excluding unused returned/closing stock and spills that never entered. Collect bypass/entry routing by source/event IDs, never guessed shares. Every export/other-fate kg is only the portion derived from the declared liquid-pool inputs and opening inventory, including their solutes/suspended material. Exclude the dry mop/cloth/container, outside carried material that never entered the pool and an entire wet carrier weighed without component evidence. Dry tool fibers or other matter actually released into the pool enter measured_goods_or_other_material_entering_liquid first. Source-component matrices and exclusive stock/export/vapor/other-fate IDs prevent subtracting any pool portion twice; separated dry pool-origin residue is an other fate, not a second whole wet-carrier subtraction. Net closing/opening retained liquid inside a mop is inventory, not also an export. Pool evaporation is internal source removal, not automatically elementary exterior emission; actual capture/storage and exterior transfer require their own traced balances/named cards before completeness when present. Unknown source-pool portions block reconstruction."
      inputs:
        - V_import
        - rho_water
        - cleaner_open
        - cleaner_purchases
        - cleaner_close
        - cleaner_exports
        - concentration_c
        - V_actual_discharge
        - rho_full_liquid
        - imported_water
        - measured_cleaner_mass
        - measured_goods_or_other_material_entering_liquid
        - opening_liquid_inventory
        - closing_liquid_inventory
        - measured_whole_liquid_exports
        - actual_evaporated_species_mass
        - other_measured_nonsewer_fates
        - cp_operations
        - cp_residue
      output: "cleaning_water_kg; cleaner_kg; J"
      source_ids:
        - src_method
    - id: calc_lifetime
      applies_to: "building_life; shelf_life; trolley_life; cashbox_life; broom_life; mop_life; pen_life"
      rule: "For asset a, f_a,c,p = x_a,c,p / L_a, where x is the current cohort/beneficiary exposure including assigned idle and L_a is versioned expected total lifetime exposure across all beneficiaries/periods in the same physical driver units. Use building lit/reserved m2*h, shelf occupied/reserved m3*h, trolley loaded+empty+positioning+reserved minutes, cashbox checkout+reserved minutes. One lifetime package contributes f_a,c,p Item(s); divide by N once. Maintain historical cumulative f and x. Any L revision recomputes affected old f, replaces them through signed adjustments and reconciles cumulative responsibilities <=1; never add a fresh complete burden. At retirement replace expected total with actual complete lifetime exposure and correct all past assignments; assign the final residual once with recipient agreement so complete lifetime sum f = 1. Include observed maintenance/EOL in the same complete upstream package version; no second f on its already allocated terminal burden. Missing lifetime, package completeness or beneficiary exposure blocks completion. For broom/mop use cleaned-area*events plus declared reserved exposure; for pen use actual written lines including failed receipts/records. L uses the same units, all beneficiaries and actual remaining usable tool/pen capacity, updated by the same signed lifetime correction; one line is a documented consistent line-definition across all pen users, not assumed ink kg. f_<row_id> denotes f_a,c,p for that card object."
      inputs:
        - asset_id
        - package_scope
        - package_version
        - x_a_c_p
        - L_a
        - historical_f
        - historical_x
        - actual_retirement_exposure
        - beneficiary_ledger
        - cp_assets
      output: "f_a_c_p; lifetime_correction"
      source_ids:
        - src_method
    - id: calc_carriers
      applies_to: "intact_pasta_waste; loose_pasta_waste; pp_waste; carton_waste; receipt_waste; cleaning_effluent"
      rule: "For each physical carrier, net kg = gross scale kg - actual container tare; keep measured wet/as-received state and composition. Allocate directly traced target-source masses first, then any real common remainder by measured source contribution/cleaned-area driver under calc_share. Sum actual unique handoff masses by recipient and route; stock not yet handed off remains stock. Intact and separated routes are mutually exclusive for each portion/source ID; source/component matrices reconcile whole carrier kg without duplicating constituents. Waste provider includes measured loading, haulage with nonzero empty/idle activity and treatment, or named additional activities are required; quantities and route shares apply once."
      inputs:
        - carrier_id
        - source_pack_id
        - portion_id
        - gross_kg
        - tare_kg
        - composition
        - source_matrix
        - carrier_stock
        - recipient
        - route
        - provider_boundary
        - empty_distance
        - idle_duration
        - cp_residue
      output: "carrier_kg; handoff_reconciliation"
      source_ids:
        - src_method
        - src_retail
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_j = A_j / N for each raw-to-attributed total A_j, in that row physical numerator unit per reference flow; service_out = 1 Item(s). A_j already contains exactly one applicable source/beneficiary/lifetime share. N is from calc_service and must be >0. Do not divide raw meters by gross handovers first, multiply composition/destination shares twice or normalize an already per-service upstream dataset again. Keep absolute X, attributable A_j, N, q_j, pool/version and corrections available for audit."
      inputs:
        - X
        - A_j
        - N
        - q_j
        - pool_version
        - correction_id
      output: "q_j"
      source_ids:
        - src_method
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Every unbound row needs one exact actual object/state, property/unit and suitable direct-read identity evidence before usable final data. Official AC is only a historical observed product identity with energy basis, not provider performance. Recheck UUID, state, official bilingual name and property-unit chain/role against original response plus integrity receipt. Candidate unbound identity is disclosed, never declared verified."
      evidence: "Original responses/receipts; row-by-row identity matrix; matching actual specification and no unresolved completion gaps"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Require every protocol field, actual event/stock/meter coverage and complete asset-model inclusion evidence. Negative evidence must tie to route inspections, maintenance/events and equipment/meter registers. Unknown identities/quantities/provider boundaries, open O, unresolved residuals or missing actual occurrence prevent a complete result. Retain uncertain measurements with methods, calibration, error bounds and sensitivity; never substitute zero or invented numerical limits/defaults."
      evidence: "Signed completeness matrix, missing-data register, original calibrations, coverage and quantified uncertainty; configuration/pool versions"
    - id: reconciliation
      applies_to: "all inventory rows"
      requirement: "Perform source-pack S/F/T/O, gross physical goods, common-meter, formulation stock, full-liquid, carrier and cumulative asset-lifetime reconciliations independently. Trace every normalized row to raw X, one attributed A_j and same N; verify formulas/units and all exact-case IDs/protocol references. Check no original/part, intact/separated, package/operation, meter/submeter or treatment/transport duplication. Method fixes are PCR responsibilities; a later modeller may supply actual amounts/parties, not choose denominator or allocation rules anew."
      evidence: "Source/portion/pool/lifetime matrices, balance residuals, executable arithmetic, versioned corrections and bilingual semantic review"
validation_rules:
  - rule_id: eligibility
    applies_to: "all inventory rows"
    rule: "Reject application if product/SKU/pack/channel/manual-ambient route or stated gates differ, or actual occurrence/absence is unknown. A broader CPC label is not permission to expand this PCR. Verify actual original fill/BOM and contractual release/acceptance; the 2022 manufacturer sheet is a format example, not present supplier conformity or quantity evidence."
    source_ids:
      - src_un
      - src_pasta
  - rule_id: quantity
    applies_to: "all inventory rows"
    rule: "Require N>0, all original packs resolved with O=0, actual gross movement and independent original-background partition, calibrated raw totals and finite conversions. Raw totals must precede physical allocation and exactly one division by N. Explicitly check revoked-but-retained packs, pure-price adjustments, samples, failed periods and late original-numerator revisions. Unbalanced unknown residuals prevent closure."
    source_ids:
      - src_method
  - rule_id: coverage
    applies_to: "all inventory rows"
    rule: "Require actual complete object-package evidence or the source-authored disjoint missing-component inventory and protocols, plus full beneficiary lifetime correction/residual ledgers. Audit no hidden unknown maintenance, skipped empty/idle activity, source-pack/constituent double counting or duplicated provider utilities/transport/treatment. Any unresolved UUID, actual supplier/composition, missing factor or collection field remains an explicit completion blocker for final verified data."
    source_ids:
      - src_method
      - src_retail
  - rule_id: projection
    applies_to: "all inventory rows"
    rule: "Compare substantive English/Chinese object, role, conditions, obligation, formula, denominator, unit, UUID and source scope. All mandatory boundary/allocation/collection/calculation/quality/validation duties must remain in supported source fields and regenerated structured guidance, with exact-case row/protocol/rule references and actual one-process protocols. Check generated semantic fields, not only fingerprints. Candidate, localized/atomic markers and passing checks are not methodology approval/publication."
    source_ids:
      - src_method
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared manual ambient retail-service module, per one final-accepted original pack. Add actual S receiving backgrounds once for a full sold-product system under upstream_once; this is not a whole-food footprint."
  allowed_use: "Same actual SKU/specification/gates/route with complete collection, identity and package proofs; compare only equivalent service boundary and responsibility state"
  excluded_use: "Other foods/routes or assumed 0.5kg equivalents; total pasta footprint without S upstream and actual consumer stages; final verified/published data while any identity/package/quantity gap remains"
  required_metadata: "actual SKU and ingredient/species declaration; nominal 500-g PP-bag format with actual receiving fill/BOM and lot; non-specialized walk-in final-use channel; supplier-unloaded receiving gate and acceptance gate; manual ambient route and absence evidence; prospective configuration pool and follow-up cutoff; final acceptance with revocation and physical fate histories; source-pack backgrounds and S/F/T/O ownership; complete asset-package scopes and lifetime ledger; direct/common meter boundaries and idle allocation; waste-carrier recipients and included transport/treatment; unresolved flow identities and uncertainty"
  required_quality_disclosure: "Raw totals, source-pack histories/actual fills/BOM, responsibility partition and all physical gates; all unknown IDs, original evidence, provider scopes, attribution/lifetime/idle ledgers, balances, coverage/uncertainty, corrections and source applicability limits"
  update_trigger: "Any SKU, ingredients, film/BOM/fill, gates, acceptance/revocation, route/equipment, package/provider scope, meter/driver, lifetime/maintenance/retirement, recipient/transport, evidence or late event changes require source-level bilingual review, correction and normal structured regeneration."
data_sources:
  - id: "src_un"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0, subclass 62129 explanatory note; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/62129"
    used_for: "Groups231,232,237 and class2399 establish classification coverage. Group237 contains this pasta subset; no environmental factor or product-quality limit."
  - id: "src_pasta"
    type: "literature"
    reference: "Paone Distribuzione Srl, Spaghetti item210220 data sheet, Rev00, 20 January2022, hosted by Italian Trade Agency; https://www.ice.it/en/my-home/repository/vetrine/546920/1674645309.69.pdf"
    used_for: "Two-page historical manufacturer example supports dry durum-semolina spaghetti and nominal500g PP-film pack with taped cardboard outer case; actual foreground SKU/fill/BOM/quality remain to be collected. No nutrition, moisture, legal-limit, shelf-life, cooking or logistics figures are inventory defaults or current compliance evidence."
  - id: "src_retail"
    type: "literature"
    reference: "European Commission JRC, Best Environmental Management Practice in the Retail Trade Sector, EUR25998EN,2013; https://susproc.jrc.ec.europa.eu/activities/emas/documents/RetailTradeSector.pdf"
    used_for: "Executive-summary input/output scope and sections2.1.6.7,2.4.6.1–2.4.6.2 support inspection of lighting, water/chemicals and actual waste handling. Historical sector context only; no benchmarks, energy shares, losses or factors adopted. Specific route, packages and equations are this PCR design and require foreground evidence."
  - id: "src_method"
    type: "method_factor"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard,2011, chapters6,7,9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Unit-of-analysis, boundary and subdivision-before-allocation principles inform the disclosed service. This PCR fixes its own source-pack responsibility, drivers, lifetime equations and collection protocols; the standard does not prescribe these retail formulas. No full-standard-conformity claim or quantitative default."
