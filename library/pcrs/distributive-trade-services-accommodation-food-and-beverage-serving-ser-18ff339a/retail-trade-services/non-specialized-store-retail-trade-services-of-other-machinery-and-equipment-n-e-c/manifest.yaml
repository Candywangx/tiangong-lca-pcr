    - row_id: intact_valve_waste
      completion_condition: Bind actual complete original-unit Waste output in exact intact state, Mass/kg and direct gross-tare consignment; require full valve/platings/PTFE/packing/individual-package receiver acceptance and matching complete treatment, not pure brass scrap. Rejected/returned attempts retain actual original IDs and net kg without new manufacture; final Waste quantity/provider must match unique finally accepted and actually completely treated net carriers, while all failed/return transport remains. No-movement status revisions replace originals; partial treatment or altered state needs actual state-specific atomic extensions and matched receiver scope before completeness. Opened/dismantled states need separate reviewed cards.
