      applies_to: "service_output"
      rule: "Each actual homogeneous model/BOM/stage vector V_v has measured original beneficiary exposure e_h and evidenced expected lifetime L_v in the SAME unit. Buildings/shelves use reserved served m2*h; checkout, lights/fans, handling and ICT/security devices use reserved device seconds; reusable cloth/mop uses actual cleaned m2 per unique pass. Provisional f_h=e_h/L_v, with persistent all-history source/pool records, sum fractions<=1 and investigated excess. At final retirement E=sum_all_h(e_actual_h)>0 and f_final_h=e_actual_h/E; replace EVERY historical fV record with delta_h=f_new_h*V_new-f_old_h*V_old for each lifetime/vector revision, not a new whole acquisition. Apply actual event repairs/replacement and complete terminal carrier/freight to that asset and the same historical fractions unless verified already in V. Direct complete retirement mass gross-tare excludes removed parts already; no second subtraction. Complete package and component vectors are exclusive, and acquisition/retirement counts only reconcile custody, not additional current consumption. Each repair/replacement/treatment event records its measured homogeneous source_quantity in source_unit, actual component/carrier model/state and signed scope; no repair material mass is renamed as another complete device."
