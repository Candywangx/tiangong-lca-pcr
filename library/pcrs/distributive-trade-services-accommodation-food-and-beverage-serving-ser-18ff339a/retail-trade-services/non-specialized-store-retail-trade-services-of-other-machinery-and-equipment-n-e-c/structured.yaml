system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: b_route
      applies_to: "retail; custody; residual"
      rule: "Apply to original complete unused full-port threaded lever-operated ball valves in separate actual supplier/lot/revision/diameter/material/handle/BOM strata. Preserve actual body/end cap, ball, seats, stem/packing, nuts, handle and original packaging. Record actual individual-versus-master-carton quantities; a photo does not prove a factory seal or composition. Different brands, diameters and manual handle configurations are eligible within this class with their own complete source vectors; do not treat them as burden-equivalent. Exclude solder/press, powered, used or dismantled products. The retained commercial specification illustrates material changes between size groups; nominal mass, carton counts and pressure/temperature ratings are not measured quantities, LCI or adopted compliance limits. Actual brass/plating/steel/PTFE or other component materials must follow the actual BOM and atomic extensions, not a pure-metal proxy."
      source_ids:
        - nibco-item
        - nibco-spec
    - rule_id: b_channel
      applies_to: "retail"
      rule: "Start when the actual mixed-assortment physical store takes custody of this original configuration; end at an identified customer physically taking the selected unit through an attended cashier with signed valid acceptance. Require actual dated assortment/display evidence, customer choice, cashier/payment and custody events. Online/mail-order/wholesale, delivery, installation, pressure/leak/flow testing, valve actuation demonstration, thread sealant/tape application, machining, washing, lubrication and disassembly are outside this route. Public product listings establish no actual branch stock or completed transaction. Factory manufacture/testing remains inside its original supplier source, not assumed absent."
      source_ids:
        - un621
        - un62189
    - rule_id: b_source
      applies_to: "retail; custody; residual"
      rule: "This is an incremental retail-service core. Exclude successful-merchandise S manufacture and its inlet transport from the service; the separately declared downstream GOODS system adds their same original S sources once. Include F original merchandise manufacture through failed_original and separate actual F inlet transport under c_transport. For each actual original unit source j retain W_j for manufacture including original individual packaging at supplier dispatch, and I_j for inlet transport separately; bundled stages require evidenced separation, otherwise incomplete. For each indivisible original valve source S/F/T/O are one-hot0/1 final responsibility flags, not component-mass fractions, and sum1: S has final valid service; F is irreversible retail responsibility not carried by another goods/asset system; T has a signed named successor carrying the same W_j/I_j; O is open/unresolved responsibility. Physical supplier returns alone do not imply T or a credit. Missing/lost goods retain F or explicit O, never disappear. A transferred demonstrator retains the SAME original source in asset T; no duplicate full F or new acquisition. Repeated receipts/returns never acquire W_j/I_j again."
      source_ids:
        - ghg2011
    - rule_id: b_facility
      applies_to: "retail"
      rule: "This bounded dry route requires full-period documented absence of on-site fuel combustion/backup/handling, refrigerant equipment and HVAC/purchased heat/cold over every included leased/shared/landlord-served zone. The facility manager must inventory actual equipment, owner, served area, temporary plant and service contracts during open/closed/idle/maintenance periods and sign applicable/absent/unknown. External fuel vehicles remain outside the included site gate. Unknown or actual presence blocks this route until a reviewed extension defines real species, activity, state, actual external medium and disjoint cards/protocols; an unplugged valve does not prove facility absence."
      source_ids: []
    - rule_id: b_completion
      applies_to: "retail"
      rule: "Core cards do not constitute a complete retail inventory. Before complete status add actual transport/handling, building/shelf, checkout/lighting/ICT/security and reusable cleaning-tool capital, event repairs/terminal carriers, network/payment/admin/camera capture and storage, facility water/cleaning formulation/containers/consumables and treatment, and actual receipt/extra wrapping sources using the fixed c_transport/c_assets/c_digital/c_clean/c_material/c_merge methods. Each actual homogeneous source needs its own atomic card, exact original unit, single-process protocol, provider scope and bilingual sync before completeness. Record named actual occurrence, signed absence or unknown; no generic combined exchange or discretion to choose another denominator/driver. A genuine complete contract bundle may remain intact only with signed object/constituent/stage/denominator coverage and no second included utilities, transport, repair or treatment."
      source_ids:
        - jrc-retail
