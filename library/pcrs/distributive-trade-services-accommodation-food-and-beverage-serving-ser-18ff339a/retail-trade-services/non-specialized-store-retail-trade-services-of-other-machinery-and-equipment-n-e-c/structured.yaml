    - id: c_stock
      applies_to: "supplier_return; internal_transfer; external_retention; intact_valve_waste"
      rule: "Goods-only predicted_close=opening+new_receipts+physical_customer_returns+physical_supplier_returns+transfer_in-gross_pickups-gross_supplier_returns-transfer_out-confirmed_missing-condemned_count. signed_count_residual=observed_close-predicted_close, positive excess and negative shortage. gross_pickups includes accepted and never-accepted exits once; external_retention/revocation with no new movement is not another exit. Condemnation internally changes goods to held waste. Independent kg ledger: predicted_waste_close=opening_waste_kg+condemned_kg+returned_waste_kg-dispatched_waste_kg-known_missing_waste_kg; signed_waste_residual=observed_waste_close_kg-predicted_waste_close. Link count and measured kg by condemnation_event_ID, never equate them. Each actual rejected/returned waste movement records original_ID, original_consignment_ID, waste_attempt_ID and return_event_ID; returned_waste_kg=sum actual returned_gross_kg-returned_tare_kg at the return gate. It adds to held waste, never new condemnation or a newly manufactured source. dispatched_waste_kg=sum actual (gross_consignment_kg-tare_kg) over every unique physical_dispatch_event_ID for stock reconciliation, including rejected attempts; it is distinct from treatment quantity. For each unique finally processed original unit record final_processed_net_kg=final_processed_gross_kg-final_processed_tare_kg from matched actual receiving/processing evidence, and W_out=sum final_processed_net_kg over unique processed_original_IDs with verified complete matching treatment. A mere dispatch, acceptance without actual processing, rejected/returned attempt or unresolved final_treatment_status does not receive a full-treatment provider. A no-movement acceptance/status revision replaces the original treatment_receipt_ID/receipt_version without another inventory movement. Partial treatment or altered physical state requires actual state-specific atomic cards, matched receiver/stage scope and original-source conservation before completeness; never assume zero or charge the whole attempt for partial work. All actual failed/rejected/return transport and handling activity remains under c_transport even when final W_out=0. W_out is direct finally processed net carrier quantity, with no second stock/reuse/composition/destination correction; W_out/Q and the full-treatment provider use this same actual mass and boundary once."
