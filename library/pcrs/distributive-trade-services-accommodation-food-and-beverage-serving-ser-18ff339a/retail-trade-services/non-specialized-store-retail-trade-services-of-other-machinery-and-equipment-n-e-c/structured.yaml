      raw_fields: "opening; new_receipts; physical_customer_returns; physical_supplier_returns; transfer_in; gross_pickups; gross_supplier_returns; transfer_out; confirmed_missing; condemned_count; observed_close; predicted_close; signed_count_residual; condemnation_event_ID; opening_waste_kg; condemned_kg; dispatched_waste_kg; known_missing_waste_kg; observed_waste_close_kg; predicted_waste_close; signed_waste_residual; gross_consignment_kg; tare_kg; W_out; Q; module_ID; raw_or_normalized; z_j_r; D_j; N_j_r; N_core_r; N_r; E_h; N_F; exchange_identity; property; unit; state; medium; source_ID; event_ID; object_ID; time_interval; stage; constituent_scope; attribution_level; original_pool; version; ledger_ID; record_ID; supplier_BOM; lot_ID; revision_ID; instrument_ID; calibration_evidence; uncertainty; event_date; original_ID; waste_attempt_ID; original_consignment_ID; physical_dispatch_event_ID; return_event_ID; returned_original_ID; returned_gross_kg; returned_tare_kg; returned_waste_kg; treatment_receipt_ID; final_treatment_status; final_processed_gross_kg; final_processed_tare_kg; final_processed_net_kg; processed_original_IDs; treatment_scope; receipt_version; no_movement_revision"
      collection_method: "At each condemnation record original_ID/event_ID and count separately from actual whole-carrier kg. At actual dispatch weigh calibrated gross and tare, retain receiver acceptance of entire valve, all included seats/packing/platings and original packaging, plus complete compatible treatment scope. Reconcile held waste daily/cutoff with known missing and signed residual separately; no count-to-kg nominal substitution or second stock subtraction. Shared ledger IDs retain one original source. Opened/dismantled/mixed contaminated carriers need a state-specific reviewed extension. Aggregation method: c_stock actual W_out/Q once; count balance independent; per reference flow At each actual rejection/physical return weigh actual returned gross/tare and link original_ID, original consignment, attempt and return event; record actual finally processed original IDs, complete treatment evidence, final gross/tare and latest status/receipt version under c_stock. Retain all failed/return transport sources under c_transport. Repeated attempts do not create condemnation/manufacture; no-movement status revisions replace the original record. Partial treatment/state changes require actual state-specific atomic extension and matched receiver scope before completeness."
      unit: "kg; Item(s) QA only; timestamps"
      frequency: "Every condemnation/dispatch/return and daily/cutoff stock"
      temporal_coverage: "Full original pool including held waste through terminal receipt; actual final treatment status and every return/revision"
      site_scope: "Actual condemnation/storage/dispatch and named receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated tare scale, constituent acceptance, signed treatment contract and held-stock/missing reconciliation; original consignment/return IDs and actual final-treatment reconciliation"
  calculation_rules:
    - id: c_q
      applies_to: "service_output"
      rule: "Q=count distinct original_ID with latest signed final_valid_acceptance=true in the prospective same-site/configuration pool at cutoff. Service output is fixed1 Item(s) only when Q>0. A revoked ID is already absent; do not subtract it again. Retain gross pickup and every failed/repeated/refused attempt independently. Pure refunds with valid acceptance do not remove Q. Late reversals replace original Q and all original-pool numerators at actual dates; never shift to a new profitable pool. Q=0 stays unnormalizable with raw sources retained."
      inputs:
        - original_ID
        - pool_ID
        - site_ID
        - configuration
        - acceptance_version
        - final_valid_acceptance
        - cutoff
        - event_date
        - gross_pickup_count
