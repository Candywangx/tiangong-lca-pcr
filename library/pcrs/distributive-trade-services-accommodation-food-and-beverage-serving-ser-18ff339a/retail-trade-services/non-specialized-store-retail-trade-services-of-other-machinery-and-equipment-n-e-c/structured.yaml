    - id: c_digital
      applies_to: "service_output"
      rule: "Network raw source_hours allocate by beneficiary reserved_endpoint_seconds/all_endpoint_seconds for each unique source interval, including failed/empty reservations. Payment/admin unique attempts allocate event_source_raw*line_seconds_h/all_event_line_seconds including failed attempts. Positive sources need positive known all-beneficiary totals. For each original capture i freeze f_i_h=(footprint_m2_i_h*covered_seconds_i_h)/all_capture_area_seconds_i using actual disjoint footprints/time and every beneficiary. Capture production N_capture_i_h=actual_capture_raw_i*f_i_h in its verified original unit/vector/denominator; restore normalized capture_z_i*D_capture_i first. Undecomposed capture-production totals stay incomplete until each original capture source is verifiable; future retention cannot reallocate production. Storage fixed-byte interval b_i=retained_bytes_i*retention_seconds_i; split actual byte changes by timestamps. Exactly one mode per storage source p: direct per-capture raw_storage_p*f_i_h, OR actual aggregate storage total raw_storage_p*sum_i((b_p_i/all_packet_byte_seconds_p)*f_i_h). All packet members/time scope and positive sum b_p_i must reconcile. Frozen original maps never follow later sales/deletion. Direct raw byte-seconds and provider activity are alternative representations of the SAME storage exchange, not added together; preserve provider actual units/D/vector and distinct capture/storage IDs. 1GB=10^9bytes; 1GiB=2^30bytes. Skip only an already-applied exact final owner/pool/version layer; unknown shares block, no renormalization. Remove covered onsite electricity/network/asset overlap."
