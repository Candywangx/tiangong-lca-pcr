    - id: c_material
      applies_to: "service_output"
      rule: "Original individual packaging remains with each complete merchandise source W_j/I_j and must not appear again as an input. A master carton used for several valves is a separate actual homogeneous original source; record actual contained unit_IDs and verified packaging manufacture/inlet source vectors. At actual first carton opening assign the complete carton vector to those actual contents by equal unit count ONLY when all units have the same actual configuration and packaging service, otherwise this bounded route is incomplete until a specific reviewed causal method. Preserve S/F/T/O original carton shares and all later unit fates/versions, allocating its F share to retail and S to GOODS once; no environmental-vector split by estimated cardboard mass. Actual extra receipt paper/retail wrap each has original measured net source quantity excluding core/outer wrap, cumulative final exports and exclusive current unused/printed-WIP/used-retained/held stocks, missing and signed residual. First use/preuse loss assigns original manufacture and inbound once; unused transfers retain unassigned source, reuse never reacquires it. Printed WIP carries paper and actual printing source_IDs across periods with replacement versions. Direct dispatched carrier mass is independent. All actual extra material cards require explicit composition/condition and actual carrier/receiver before completeness. Keep each homogeneous material receipt and first-use/preuse-loss quantity in the same measured original unit. For each event e, its actual material quantity G_e_h is traced to the served original unit/pool; for a shared homogeneous print/label job, assign its measured consumed source quantity by actual printed line area_h/all_printed_line_area, not basket value or future sales, and retain blank/cut margins in the same job. A pre-use loss has a named actual responsible pool or remains explicitly unassigned. Source contribution=(G_e_h/source_receipt_quantity)*original_source_vector, separately for manufacture and inlet. Retain all historical allocations and replace changed quantity/source fractions using the same delta method as c_clean; only current unassigned stock transfers, not first-used stock, may carry an unassigned manufacturing source."
