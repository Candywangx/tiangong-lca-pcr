      output: "Q; service_output"
      source_ids:
        - ghg2011
    - id: c_goods
      applies_to: "failed_original; supplier_return; internal_transfer; external_retention"
      rule: "For each original source j apply b_source once. N_F=sum_j(F_j) Item(s); W_F=sum_j(W_j*F_j). The actual failed_original exchange is N_F/Q, with manufacture-only provider per original-source equivalent W_F/N_F when N_F>0; expanding it yields W_F/Q once, never add W_F again. N_F=0 has no provider division. I_F=sum_j(I_j*F_j) is separate actual inbound completion. Preserve carried_in_source_IDs and genuinely_new_source_IDs as disjoint sets. Physical outputs use actual gross supplier return N_R/Q and internal transfer N_T/Q. External retention N_X/Q is distinct original IDs physically outside at cutoff without valid acceptance, a state QA view of original pickup, not a new movement or second stock subtraction. Each needs named recipient/current intact state and S/F/T/O responsibility; T is not inferred from movement."
