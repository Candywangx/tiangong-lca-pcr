    - id: c_transport
      applies_to: "service_output; failed_original"
      rule: "For each actual trip/segment collect separate raw loaded_vehiclekm, empty_vehiclekm and stationary_idle_vehicleh with matching provider original unit and energy/exhaust scope. Loaded mode driver d_h=consignment_kg_h*loaded_km only under evidenced binding weight capacity, or occupied_m3_h*loaded_km under binding volume; never combine kg and m3. Empty driver=reserved_capacity_h*empty_km; idle driver=reserved_capacity_h*idle_h using the SAME trip evidenced kg or m3 reservation map and actual powered idle duration. N_mode_h=A_mode*d_h/sum_all_h(d_h), including all beneficiaries and failed/empty reservations. Positive actual mode requires its own positive provider source and known positive driver total. Apply source→consignment→final original F/asset/material owner layers once; a provider consignment total skips only trip allocation, not missing final-owner shares. Asset/repair/retirement freight first belongs to its asset then c_assets historical fractions. Handling uses actual measured task/reserved seconds, no zero-tkm disappearance."
