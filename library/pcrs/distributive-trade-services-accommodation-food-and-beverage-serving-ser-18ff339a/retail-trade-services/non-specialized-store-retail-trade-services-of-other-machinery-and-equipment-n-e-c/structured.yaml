    - id: c_clean
      applies_to: "service_output"
      rule: "Facility cleaning never washes/solvent-treats merchandise. For each formulation source s measure receipt net m0_s excluding its separate container. Persistent physical balance: m0_s=cumulative_final_export_s+current_factorysealed_unused_s+current_opened_unused_s+current_solution_s+current_surface_film_s+current_tool_bound_s+current_held_waste_s+known_missing_s+signed_residual_s. Every term is source-origin formulation kg, excluding added water/dirt; final exports are mutually exclusive named actual terminal paths. State changes replace the earlier stock; rinsing a film never adds a second original portion. Ownership independently uses unique source_portion_ID first_use_s_h plus disjoint pre_use_loss_s_h: G_s_h=(first_use_s_h+pre_use_loss_s_h), raw manufacture=G_s_h/m0_s*V_mfg_s and raw inlet=G_s_h/m0_s*V_in_s. m0_s=sum_all_h(G_s_h)+unused_transfer_s+current_unassigned_s+signed_unassigned_s. Keep all historical original owner/pool/version; revise each record by delta=(G_new/m0_new)*V_new-(G_old/m0_old)*V_old, manufacture/inlet separately. Unknown source stage separation is incomplete. Complete single-use containers including closure/liner/label/adhesive use actual homogeneous count once at first opening or disjoint preopening loss, not formulation kg fraction; actual refill/reuse needs a reviewed lifetime extension. Reusable cloth/mop follows c_assets cleaned_m2 exposure with separate actual tool washing sources. Water import is actual inlet m3; internal reuse is not another input or another deduction. Direct whole effluent kg=actual discharged_m3*same_state_measured_density_kg_m3, no supply-balance subtraction. Actual whole wet waste carrier netkg is measured gross-tare independently from contained source-origin kg, without another composition/destination fraction. Signed full-constituent receiver acceptance and complete treatment scope are required for a genuine mixed carrier; unmatched species/path needs concrete extension before completeness. Where a