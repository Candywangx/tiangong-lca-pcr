allocation_rules:
  - rule_id: a_once
    applies_to: "retail; custody; residual"
    rule: "Prefer direct measured subdivision; for each remaining same-unit source pool k allocate N_k_h=N_k*d_k_h/sum_all_h(d_k_h). All actual beneficiaries, failed/zero-sale/empty reservations and closed periods remain. Require measured positive known denominator for positive N_k; unknown is not zero and known shares are not renormalized. Separate incompatible driver classes and reconcile their raw source pools to the parent. Do not add electricity, area-time and event seconds as one driver. No substitution/recycling credit is granted by custody or waste transfer."
    source_ids:
      - ghg2011
  - rule_id: a_power
    applies_to: "electricity"
    rule: "Use disjoint calibrated circuit/source intervals. Active cashier/label-printer tasks allocate measured active kWh by actual within-event unit-line processing seconds; idle/fixed checkout, router, camera, lamp/fan electricity uses reserved equipment seconds including empty/failed periods. Fixed facility common circuits use served area_m2*covered_h. Keep each class raw kWh separate and reconcile sum to its parent; subtract a submeter only if that parent includes it. E_h is the sum of compatible attributed kWh, excluding all merchandise operation prohibited by b_channel."
    source_ids:
      - ghg2011
