  data_quality_requirements:
    - id: q_identity
      applies_to: "retail; custody; residual"
      requirement: "Verify exact original full-port threaded lot/standard lever/individual package and actual 621 in-store choice/cashier route, not online listing or another near-name model. Unknown BOM, opened/reworked goods or unresolved source state blocks completeness."
      evidence: "cp_retail; supplier lot/BOM, display and signed physical transaction"
    - id: q_measurement
      applies_to: "all inventory rows"
      requirement: "Retain raw quantity/unit/denominator, calibrated method, coverage, owner/pool/version and uncertainty. Investigate signed residuals and missing/unknown fields; never zero-fill, clamp or fabricate defaults. No empirically verified range is supplied; sensitivity scenarios must remain labelled and cannot satisfy a missing actual source."
      evidence: "Instrument checks, raw source ledger, variance investigation and explicit incomplete register"
    - id: q_complete
      applies_to: "retail"
      requirement: "Dataset producer must reconcile every named b_completion source with actual homogeneous cards/protocols/provider identities and exact stage overlap, including all zero-sale/failed/idle activity. Manager signatures establish actual absence only for their covered place/time. Historical official identities are not fresh observations; scientific review, actual measurements and provider bindings remain separate."
      evidence: "Complete occurrence/absence/unknown matrix, source scope contracts and c_merge exchange audit"
validation_rules:
  - rule_id: v_reference
    applies_to: "service_output"
    rule: "Require Q>0, latest acceptance evidence, exact reference display/link/count unit and every qualifier; otherwise no normalized service."
    source_ids: []
  - rule_id: v_sources
    applies_to: "failed_original; intact_valve_waste"
    rule: "Require original-source S/F/T/O conservation, separate F manufacture/inlet and actual complete carrier provider. Custody-only rows do not carry an environmental supplier; actual Waste treatment is mandatory and not a custody exemption."
    source_ids: []
  - rule_id: v_projection
    applies_to: "all inventory rows"
    rule: "Require bilingual object/direction/type/UUID/unit/formula/basis/obligation alignment, every protocol actual process and affected row, current normal generated projection and original evidence match. A schema/fingerprint pass or localized/atomic marker does not establish scientific or release approval."
    source_ids: []
  - rule_id: v_completion
    applies_to: "retail"
    rule: "Apply b_facility, b_completion and c_merge; missing actual identity, named support source, raw denominator, route absence, treatment scope or independent review is disclosed. Never declare this partial core a complete merchandise life cycle or full CPC coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
