system_boundary:
  rules:
    - rule_id: b_product_family
      applies_to: "all inventory rows"
      rule: "This PCR applies to the declared product family across manufacturers and brands. Brand, model, catalogue article, SKU and trade name identify actual study data, not an exclusive eligibility condition. The material/function, product state, fixed format where specified, process/channel and gate conditions below still apply. Establish separate homogeneous supplier/configuration/edition/package-BOM strata and their matching original background vectors; do not multiply a mixed-SKU count by one specimen vector. Use actual measured quantities and supported conversions. Manufacturer examples and their masses, dimensions, ratings, formulation or packaging claims are illustrative only, never class-wide defaults or complete BOM/LCI. Any actually different component, support chemical, package or carrier requires its concrete atomic card, matched property/unit, collection and nonoverlapping source boundary before completeness; an actual state or route outside the declared family requires a separately reviewed extension. Unknown applicability, identity or evidence remains unresolved. This candidate generalization does not establish independent scientific or translation approval."
      source_ids: []
    - rule_id: scope
      applies_to: "all"
      rule: "Use the declared narrow SKU, intact consumer-pack and manual-cabinet route only. Cigars, loose/rolling tobacco, smokeless tobacco, heated-tobacco consumables, electronic cigarettes, nicotine liquids, vending, self-service access, online delivery, refrigerated/humidified storage and retailer processing are outside this applicability. An observed excluded route cannot be treated as zero; stop applicability and create reviewed bilingual named cards/protocols for a separately disclosed extension before use."
      source_ids:
        - un-cpc62128
        - pmi-manufacture
        - fda-retail
    - rule_id: gates
      applies_to: "all"
      rule: "Start at retailer acceptance of identified sealed packs at the store receiving dock, after inbound supplier transport; record supplier acceptance/rejection and actual timestamps. Supplier production, consumer packaging and inbound carriage are outside the incremental module but fixed to the same receiving gate in calc_background. Include dedicated cabinet occupation, all retrieval/return/restocking and dry dusting, cabinet/set acquisition and actual replacement locks, dedicated residuals and terminal asset treatment. End service after physical handover, intact-pack/specification acceptance and final adjudication of linked returns. Failed external retention has no service output."
      source_ids:
        - ghg-product-2011
        - fda-retail
    - rule_id: partial_completion
      applies_to: "all"
      rule: "This module excludes common premises and fixed wiring, general lighting, HVAC, common security/IT, checkout equipment/payment/receipt paper, common cleaning/water/sewer, shared handling equipment, staff travel and retailer-controlled transport after the receiving gate. These are known completion modules, not insignificant or zero. cp_completion and calc_completion fix their collection, ownership, drivers, asset life and one-time aggregation to this same N and cohort. A total retail result requires every listed module either actually quantified with named atomic cards or evidenced absent at this site; partial-module output alone must retain the partial label. Consumer smoking and post-accepted-sale disposal remain outside even the completed retail boundary and must be separate consumer modules."
      source_ids:
        - ghg-product-2011
    - rule_id: goods_ownership
      applies_to: "goods_account"
      rule: "The final service is not cigarette manufacture. Attribute each original accepted source pack once to successful own-use sale, final retailer-responsible failure, continuing supplier/internal-transfer responsibility, or unresolved/open stock. The successful original production/packaging/inbound background B_s travels with the sold goods and is excluded here; the retailer-failure background B_f is included through failed_background. Do not also add all incoming goods. Actual returned or transferred goods retain one continuing owner; no negative recycling/return credit and no automatic waste classification. The original pack’s full background follows all waste descendants once, not once per component or carrier."
      source_ids:
        - ghg-product-2011
    - rule_id: cohort
      applies_to: "all"
      rule: "Before collection, fix a same-site/same-SKU/same-configuration responsibility pool, inventory opening and closing dates, return-adjudication cutoff and correction schedule. Keep all unsuccessful, idle and zero-sale cohorts in that pool. An entirely zero-N pool is unnormalizable and remains reported with raw burdens. Late physical returns or adjudication changes replace the original pool’s N, goods responsibility and every affected numerator; record actual occurrence dates and versioned corrections, with no second burden allocated to a new cohort. Financial refunds/discounts without changed physical acceptance do not cancel a service."
      source_ids:
        - ghg-product-2011
    - rule_id: provider_carriers
      applies_to: "all"
      rule: "Provider scope must distinguish original complete assets from later lock replacements, manufacturing/installation/initial transport from operation, and waste collection from treatment. Match each receiving product or waste-service background to the actual gate, composition, state and destination. A complete sealed cigarette pack or mixed carton/dust carrier is weighed whole; do not add its contained tobacco, nicotine, foil, adhesive or metal as additional waste exchanges. Distinct physically separated carriers require distinct named cards and original component IDs, not an invented split fraction. Treatment includes only evidenced provider utilities/transport; uncovered stages require explicit completion, never duplicate inclusion."
      source_ids:
        - ghg-product-2011
    - rule_id: air_completion
      applies_to: "cabinet"
      rule: "No cigarette combustion occurs in this module, so smoking smoke and ash are outside; this is not a zero-emission claim for stored tobacco. Pack-film permeability, damage, dust release and store/exterior air transfers must be screened in cp_completion. Cabinet dust captured as solid is not also an elementary air output. Any quantified volatile/dust release requires one actual species/receiving medium card and a terminal exterior-flux balance including internal storage, capture and exported carriers; an internal cabinet source is not automatically environmental emission. Unknown evidence remains incomplete."
      source_ids:
        - pmi-manufacture
        - ghg-product-2011
