  calculation_rules:
    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique final actual merchant-owned/resold B2B consignment acceptance IDs after actual acceptance reversals; require merchant identity/ownership-resale evidence, business buyer, gate and acceptance source, not supplier receipt alone. No sheets/stacks/racks/fragments/m2 or money as service count."
      inputs:
        - "cp_sheets actual consignment/acceptance/state/time"
      output: "N and 1 Item(s) service reference"
      source_ids: []
    - id: sheet_geometry
      applies_to: "nonexchange glass audit"
      rule: "For evidenced rectangular original sheet, A_each=converted_width_m*converted_height_m; otherwise use actual representative area measurement. EACH area times compatible actual count once, TOTAL area remains total. Native thickness/geometry variation and units/conversion/source retained."
      inputs:
        - "cp_sheets actual geometry/count/extent/native units/conversion"
      output: "Actual original sheet area/volume audit without universal dimensions"
      source_ids: []
    - id: glass_mass
      applies_to: "nonexchange glass audit"
      rule: "Derived glass_mass_kg=compatible_area_m2*compatible_thickness_m*actual_density_kg_per_m3 only for supported representative actual geometry/density/state; retain density method/source/sample-time/temperature-unit and uncertainty. Distinguish actual weighed net glass and derived estimate, no hidden default density or packaging mass."
      inputs:
        - "cp_sheets native area/thickness/density/state/method/source/conversion"
      output: "Traceable glass net mass audit, not consumed material"
      source_ids: []
    - id: original_gate_demand
      applies_to: "commodity outside service"
      rule: "commodity_source_gate_demand=assigned_source_gate_quantity; evidenced direct assignment OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers using actual complete compatible terminal-exit records and positive denominator, including closing/usefulothers/returns/real loss. Actual native source/state/equivalence/owner/existing coverage reconciled once outside.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "cp_sheets source quantities/native all-terminal drivers/conversion/coverage"
      output: "Quantified original finished-supply-sheet demand and exclusive loss interface"
      source_ids: []
    - id: supply_convention
      applies_to: "actual new supplies"
      rule: "S=opening+net_receipts-closing; gross S/N plus actual paired usable_outward_return/N output OR consumed-only (S-usable_outward_return)/N and OMIT paired output. No inherited glass/interleave/rack credit against current supplies."
      inputs:
        - "cp_supplies native stock/quantity/extent/conversion/same-supply receiver pairing"
      output: "Exclusive actual supply and outward return exchanges"
      source_ids: []
    - id: utility_allocation
      applies_to: "actual utilities"
      rule: "service_driver_share=service_driver/all_user_driver on matching causal native-unit basis; allocated_utility=native_interval_quantity*service_driver_share/N after compatible conversion."
      inputs:
        - "cp_utilities native meter interval and all-user driver sources"
      output: "Actual measured or allocated utility per service"
      source_ids: []
    - id: provider_allocation
      applies_to: "provider_packages"
      rule: "provider_quantity=actual_native_package_quantity*documented_share/N after physical equivalent and exclusive coverage; documented_share=share_numerator/share_denominator with compatible native driver/basis/source."
      inputs:
        - "cp_provider actual scope/equivalent/native share/owner"
      output: "Disjoint actual provider service per consignment"
      source_ids: []
    - id: asset_allocation
      applies_to: "shared_assets"
      rule: "asset_equivalent=job_driver/lifetime_all_user_driver/N; lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. Complete lifecycle actual manufacture/maintenance/replacement/retirement/EOL owned once; native equivalence/uncertainty/sensitivity/update explicit."
      inputs:
        - "cp_assets matched complete lifecycle/history/remainder/native driver sources"
      output: "All-user full-life asset attribution per service"
      source_ids: []
    - id: cargo_work
      applies_to: "freight"
      rule: "EACH cargo_total=actual_each_compatible_cargo_mass*actual_compatible_count; TOTAL cargo_total=actual_total_compatible_cargo_mass unchanged. Cargo retains actual interleave/pack/carried support; subtract only noncargo vehicle/container tare. actual_transport_work=cargo_total_tonnes*actual_distance_km OR evidenced equivalent native carrier work; freight_quantity=actual_transport_work*documented_service_share/N once."
      inputs:
        - "cp_freight actual cargo/tare/extent/count/distance/conversion/share/coverage"
      output: "Actual carrier work per service with no repeated multiplier/share/N"
      source_ids: []
    - id: actual_outlets
      applies_to: "physical transfers"
      rule: "outlet_quantity=actual_compatible_net_quantity/N; EACH quantity multiplies matching count once, TOTAL unchanged. Whole physical stream includes retained components/fluid; separately transferred fragments/pack/containedliquid/actual species and whole sheets are exclusive."
      inputs:
        - "cp_outlets whole/native/component/extent/parent/receiver/fate records"
      output: "Real receiver transfer, not inferred cullet or duplicate component"
      source_ids: []
    - id: actual_release
      applies_to: "direct_species"
      rule: "release_quantity=actual_measured_species_quantity/N OR compatible_activity*applicable_factor*required_composition*required_release_fraction/N. Omit extra multipliers already in complete species-release factor and exclude captured/contained material."
      inputs:
        - "cp_environment native measurement/activity/factor/composition/fate/medium sources"
      output: "Actual identified species and receiving medium, no stain/breakage default"
      source_ids: []
