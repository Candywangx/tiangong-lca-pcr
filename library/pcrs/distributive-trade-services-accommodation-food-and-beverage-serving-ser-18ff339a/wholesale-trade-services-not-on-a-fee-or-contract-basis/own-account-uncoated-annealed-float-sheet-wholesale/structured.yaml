allocation_rules:
  - rule_id: stocks_attempts_genealogy
    applies_to: "foreground_burden_allocation"
    rule: "Record original sheet/stack/pack/rack and actual fragment parentage by period: opening/receipt/closing, useful commercial return/other useful exits, retained reject and real receiver loss. Internal moves/retained recovery are not outward transfers. N counts actual final owned/resold B2B accepted service only after reversals; reversal/rejection retains real resource event/period attribution without duplicating another N; open/rejected attempts retain carried resource attribution and explicit downstream path. Normalize by N only when N>0 and actual final acceptance evidence exists; otherwise retain unfinished/rejected resources with event/period attribution, no fabricated service reference or division."
    source_ids: []
  - rule_id: original_source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Use evidenced direct source-to-target mapping OR complete compatible source cohort: assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers. Actual compatible all-terminal-exit records include closing, useful other exits, returns and actual loss, with native units/bases/methods/sources/owners and original-sheet equivalence. Denominator must be positive/complete; no accepted-only denominator, omitted competing records or shard count as original sheet equivalent."
    source_ids: []
  - rule_id: commodity_gate_demand
    applies_to: "foreground_burden_allocation"
    rule: "commodity_source_gate_demand=assigned_source_gate_quantity at actual original finished supply-size state, including evidenced state-change share. Native original source/assigned unit/state/source/conversion/allocation and real loss adjustment/unit/basis/source/owner/already-included coverage mandatory. Final delivery mass plus waste does not substitute original demand. Original commodity system owns once-only upstream loss adjustment outside service.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: supply_and_return
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing includes retained recovered unused supply. Select gross S/N input and separately record actual paired unused outward return OR consumed-only (S-usable_outward_return)/N input and OMIT its matched output. Same independent supply identity/scope pairing required; no inherited interleave/rack/glass netting against unrelated new material and no second credit."
    source_ids: []
  - rule_id: all_consumer_resources
    applies_to: "foreground_burden_allocation"
    rule: "Allocate actual meter/native resources by evidenced causal same-unit service/all-user space-time/handling/other physical drivers over all consumers/periods incl relevant idle/hygiene/open attempts. Record numerator/denominator/unit/basis/source and uncertainty. Equal consignments/sheet count/glass mass needs actual causality evidence; money not physical driver."
    source_ids: []
  - rule_id: complete_asset_life
    applies_to: "foreground_burden_allocation"
    rule: "One matching lifecycle covers manufacture, actual maintenance/replacement/retirement/EOL, all-user observed history plus sourced remaining driver with native unit/basis/equivalence/source/uncertainty/sensitivity/update. Attribute job_driver/lifetime_all_user_driver then /N once. No new rack per movement, no duplicate supplier/merchant rental/provider/carrier ownership."
    source_ids: []
  - rule_id: one_owner_nonadditive
    applies_to: "foreground_burden_allocation"
    rule: "Direct/provider/carrier/asset/receiver treatment matrix assigns one physical event owner. Freight cargo retains actual interleave/pack/carried support; only noncargo scale tare subtracts, and EACH/TOTAL then actual physical share/N applies once. Whole sheets/fragments/packing/cleanup/fluid/component views and treatment do not duplicate; actual useful transfer no automatic substitution credit."
    source_ids: []
