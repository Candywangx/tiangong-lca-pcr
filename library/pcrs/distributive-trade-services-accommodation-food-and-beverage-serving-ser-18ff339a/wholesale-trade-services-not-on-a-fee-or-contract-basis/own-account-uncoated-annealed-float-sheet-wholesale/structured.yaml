validation_rules:
  - rule_id: reference_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Actual merchant ownership/resale and business-buyer identity plus acceptance gate/source/reversal records verify N after reversals; supplier receipt alone is insufficient. Actual reference name/link/Count amount and unique final buyer-accepted N agree with real source sheet/geometry/grade/pack/condition/period qualifiers."
    source_ids: []
  - rule_id: source_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual complete original finished uncoatedannealed supply-size gate, missing upstream stages outsideonce and native direct mapping OR complete positive all-terminal exit allocation inclclosing/usefulothers/returns/actual loss, owner/equivalence/source/coverage. No rawsilica-only or finalmass+waste substitute.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: scope_check
    applies_to: "foreground_dataset_conformance"
    rule: "No hidden merchant cutting/edge/grind/polish/toughen/laminate/coat/glasswash/remediate/install/climate intervention, including contracted work. Original spacing/ambient records do not alone establish active preservation."
    source_ids: []
  - rule_id: state_stream_check
    applies_to: "foreground_dataset_conformance"
    rule: "Breakage/stain/unknown stock difference is not loss/discard/recycling/species/zero. Actual original-sheet→fragment genealogy, receiver classification, whole/component/interleave/pack/cleanup/liquid exclusivity and species medium/fate need evidence."
    source_ids: []
  - rule_id: resource_extent_check
    applies_to: "foreground_dataset_conformance"
    rule: "Check native geometry-density/measurement distinction and EACH/TOTAL count, actual cargo retains carried pack/support subtracting only noncargo tare, same-basis physical share/N once. All-user full asset observed+sourced remainder/EOL/uncertainty and supply gross+pairedout OR consumed-only OMITout agree with one-owner matrix."
    source_ids: []
  - rule_id: actual_binding_check
    applies_to: "foreground_dataset_conformance"
    rule: "Final exchange needs actual quantity/conversion/source and concrete verified identity/property/unit. Keep candidate unresolved identities and quantitative ranges disclosed; no publication/full-chain-ready inference from checker pass."
    source_ids: []
published_dataset_profile:
  dataset_role: "Service add-on foreground for actual accepted own-account original uncoated annealed float sheet consignment."
  downstream_use: "Combine disjoint service with matched original finished supply-sheet commodity system and quantified exclusive original demand/loss outside service once."
  allowed_use: "Actual declared original supplier sheet/grade/geometry/uncoatedannealed pack/rack state ambient merchant route with native resource and receiver records."
  excluded_use: "Standalone complete glass footprint; raw production or processed/installed glass; merchant chemical remediation/washing/processing/climate intervention; retail or fee agency."
  required_metadata: "Actual original supplier gate/sheet-stack-pack-rack IDs/geometry/count/area/netmass/density basis/interleave/tare/condition/ambient/hold/acceptance/time/site-period, native original demand/all-terminal exits/owner/coverage and service resource/asset/carrier/treatment scopes."
  required_quality_disclosure: "Actual identity/support/quantity/range unresolved, measured versus geometry-derived mass/density uncertainty, original-sheet fragment genealogy and stock unknowns, allocation/asset remainder sources and each-total/cargo-tare conversion evidence."
  update_trigger: "Actual sheet state/grade/size/source gate, merchant operation/climate/provider/asset/receiver/species change, revised geometry/density/allocation/loss source or verified concrete identity."
data_sources:
  - id: "pilkington-ats104"
    type: "handbook"
    reference: "Pilkington North America ATS-104, Protecting Flat Glass Surfaces,2013-01-14. https://www.pilkington.com/-/media/pilkington/site-content/usa/window-manufacturers/technical-bulletins/ats104protectingflatglasssurfaces20130114.pdf"
    used_for: "Qualitative actual moisture/abrasion/spacing/hold condition questions; not universal RH/duration, cleaning/remediation recipe, chemical diagnosis, release quantity or strength/lifetime promise."
  - id: "pilkington-float"
    type: "literature"
    reference: "Pilkington Optifloat Clear, UK manufacturer product page. https://www.pilkington.com/en-GB/united-kingdom/architectural-and-technical-glass/product-categories/thermal-insulation/pilkington-optifloat-clear"
    used_for: "Qualitative float product versus further toughening/laminating/coating distinction; actual uncoatedannealed supplier state separately evidenced. No numeric dimension/density/performance/compliance/recycling default."
