          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual supplier-finished uncoated annealed float sheets at original released supply dimensions, with declared original interleave/pack/rack/support and condition. |\n| starting_condition_role | Original finished sheet supplier-release gate for merchant service add-on, not raw silica/cullet or a later cut/toughened/installed product. |\n| product_classification_scope | CPC 3.0:61061 narrower own-account flat-glass merchant service;37113 commodity context, not reference service quantity. |\n| recursive_input_rule | Purchased/resold same-category sheets remain nonexchange stock. Trace compatible original gate commodity demand outside service instead of recursively feeding a wholesale service as glass. |\n| upstream_dataset_requirement | Linked commodity covers actual raw materials, melting/float/annealing, supplier cut-to-original-supply-size and finish/inherited interleave/pack through actual source gate once. Raw silica/cullet alone or unmatched downstream fabricated glass is incomplete; reconcile missing real stages outside service. |\n| disclosure | Declare original gate/state/grade/geometry/unit/source, original assigned quantity and actual conversion/direct assignment or complete competing-exit cohort, real loss owner/adjustment/existing coverage and missing stages. Service alone cannot establish complete product-chain inventory. |\n\n### Boundary Rules\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| merchant_scope | Include actual receipt/stock/pack/condition records, ordinary ambient hold/electric handling, warehouse hygiene/incident containment, real new external transit protection, allocated infrastructure/freight and actual waste handling/treatment. Inherited supplier spacing and ambient monitoring alone establish neither the occurrence nor the absence of a merchant preservation intervention; require actual action and responsibility records. |  |\n| no_processing | No cutting/edge working/grinding/polishing/toughening/lamination/coating/glass washing/remediation/installation or dedicated climate intervention assumed. Actual such operation, including contracted work, needs reviewed scope extension. Manufacturer further-processing applications do not create merchant operations. | pilkington-float |\n| condition_context | Glass storage-condition literature supports actual moisture/abrasion/spacing observations and relevant hold records only. No universal numeric humidity/storage duration or stain removal recipe, chemical identity, emission factor or assumed strength/recyclability outcome is imposed. | pilkington-ats104 |\n| commodity_outside_once | All sheet production, original supply-size operations and inherited pack/interleave upstream including embodied real lost commodity remains outside service. Mandatory quantified linked original-gate assigned demand and exclusive real loss adjustment/native basis/source/owner/existing coverage once precede complete-chain use. Actual service disposal/treatment stays here once; unknown loss is not zero. |  |\n| physical_fates | Actual intact sheet, parent-linked fragments, separated pack, mixed cleanup and contained liquid transfers are exclusive. Component/retained-fluid views remain inside whole stream, not extra species. Break/stain/unknown mass does not imply whole-sheet discard, cullet recycling, emissions or avoided production credit. |  |\n\n\n"
