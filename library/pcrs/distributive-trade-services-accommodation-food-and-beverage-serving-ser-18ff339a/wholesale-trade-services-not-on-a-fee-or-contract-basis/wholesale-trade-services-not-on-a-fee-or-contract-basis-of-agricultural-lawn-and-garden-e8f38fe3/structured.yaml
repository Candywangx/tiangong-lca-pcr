uct it twice. Internal loops/recovery remain closing; no inherited mower grease/parts/pack recovery against unrelated inputs, negative netting or automatic credit. |  |\n| asset_complete_life | assets/providers | Actual used_driver/COMPLETE lifetime_all_consumer_driver with compatible native unit/basis/method/state/time/source assigns full manufacture/maintenance/real replacement/EOL to every consumer-period. Observed+sourced remaining/termination uncertainty/sensitivity/update; one asset-equivalent OR lifecycle-complete provider/N once. Traded mower/warranty/ratedarea not asset-lifetime evidence. |  |\n| exclusive_receiver_fates | all fates | Wholekit/mower retaining members/contents/finish versus independent part/pack, mixedcleanup carrier-absorbedliquid-fragments, free contained liquid and directspecies are exclusive/nonadditive views. Each actual receiver transport/treatment one owner after provider coverage. Quarantine/return/pending not automatic waste/release/recoverycredit. Semisolid grease not assumed free liquid or drained. |  |\n| commodity_link_scope | nonexchange commodity interface | Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link. |  |\n\n\n"
