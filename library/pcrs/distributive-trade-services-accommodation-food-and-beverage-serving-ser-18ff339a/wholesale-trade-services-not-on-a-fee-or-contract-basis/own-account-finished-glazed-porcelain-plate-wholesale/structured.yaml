  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_plate
      output: "One actual complete commercial service with finishedplate/pack/state/gate qualifiers"
      source_ids: []
    - id: plate_pack_audit
      applies_to: "non-exchange commodity"
      rule: "net_plate_mass=gross_quantity-separator_tare-primary_wrap_tare-carton_tare-transported_support_tare on matching actual native boundaries. Platepiece count and stack/carton membership real; no shard-to-plate count or manufacturer packaging mass=net plate inference. Body/glaze/component analyses do not add again to wholeplate."
      inputs:
        - cp_plate
      output: "Actual plate body+glaze/net/tare and count-state audit"
      source_ids: []
    - id: original_gate_demand
      applies_to: "non-exchange original commodity"
      rule: "assigned_source_gate_quantity=direct_assignment_quantity only with evidenced source-to-target link and compatible source state/unit, OR cohort_source_quantity*target_exit_driver/sum_exit_drivers after compatible sourced native conversions and complete mutually exclusive all_exit_driver_records. Denominator includes other useful exits/returns/closing/actual loss routes, not only accepted output; driver-equivalence to original plate state supported, never shard count. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service; actual compatible loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once without double allocation."
      inputs:
        - cp_plate
        - N
      output: "Actual complete factorygate assigned demand and compatible upstream loss once"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service new supplies and unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross S/N with separate matched usable_outward_return/N OR consumed-only (S-usable_outward_return)/N omitting matching return exchange. Retained recovery in closing, actual same-scope/native conversion sources required."
      inputs:
        - cp_supplies
        - N
      output: "Actual service supply and selected unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for disjoint all-user periods including idle/hygiene/failed/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual warehouse purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only for actual matching completed physical package and complete resource ownership once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent completed package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver in compatible native units with all-user full lifecycle/history+sourced remainder/real replacements/EOL, one view/no double normalization."
      inputs:
        - cp_assets
        - N
      output: "Actual complete asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=plate_payload_mass+inherited_separator_pack_mass+inherited_carton_mass+added_pack_mass+transported_support_mass on real exclusive components; freight_work=whole_payload_mass*route_distance*load_share/N after native conversions/exclusive return-empty coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual packed-plate complete-load freight work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "plate_waste=actual_discard_stream_mass/N on actual whole/chipped plate plus transferred pack scope. Other outlet_quantity=(gross_quantity-tare_quantity)/N in actual native stream unit OR volume/N with source-backed density-temperature conversion. Wholeplate/fragments/pack/mixedcleanup/liquid and component analyses nonduplicate; retained stocks/internal moves not exports, treatment once."
      inputs:
        - cp_plate
        - cp_outlets
        - N
      output: "Actual exclusive receiver streams/state and quantities per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible source-backed native conversion; choose one. factor_complete prevents extra composition/fate, whole-stream/species outputs not duplicated."
      inputs:
        - cp_environment
        - N
      output: "Actual direct species mass with receiving medium per reference flow"
      source_ids: []
