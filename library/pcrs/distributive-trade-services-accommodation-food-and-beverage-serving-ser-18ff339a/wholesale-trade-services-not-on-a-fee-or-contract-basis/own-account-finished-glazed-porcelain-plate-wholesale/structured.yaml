      collection_method: "Measure actual collected fragment, separated pack, mixed hygiene or cleaning liquid in its real native state with source/parent/transfer identity. Wholeplate/body/glaze/retained component/fluid nonadditive; exclude already transferred whole/chipped plates or other streams. Actual component method/source/sampletime and unit/basis explicit. Receiver classification/acceptance/treatment once; no fracture-driven emission or wash-sludge default. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
