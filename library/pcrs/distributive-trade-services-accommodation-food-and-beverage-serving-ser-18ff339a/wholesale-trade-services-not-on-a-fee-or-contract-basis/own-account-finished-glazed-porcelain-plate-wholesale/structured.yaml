allocation_rules:
  - rule_id: source_quantity_attribution
    applies_to: "plate merchandise"
    rule: "Retain actual original finished/glazed/packed source quantity/unit/state/source and map its demand to every real exit. Use documented direct source-to-target assignment OR compatible complete-cohort target_exit_driver/sum_exit_drivers with native driver units/basis/source and source-state conversions. Include accepted target, other useful exits, commercial returns, closing and actual loss coverage exclusively; no accepted-only denominator or shard count as original plates. Actual assigned source demand and compatible irreversible loss adjustment/owner/existing coverage once outside service. Unknown quantity/condition not default loss/species/zero."
    source_ids: []
  - rule_id: all_consumer_service
    applies_to: "actual service periods"
    rule: "Actual all-user source periods and causal handling/space-time or other justified driver, with native unit/source/rationale, include idle/hygiene/failed/open resources. Equal consignments or plate counts/mass splits are not presumed; unfinished work retains attribution without fictitious N."
    source_ids: []
  - rule_id: new_supply_returns
    applies_to: "new service supplies"
    rule: "S=opening_supply+net_receipts-closing_supply. Gross input S/N plus separately recorded matched native unused outward-return output OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted and no extra deduction. Same-scope standalone supplystock pairing; retained recovery is closing. Inherited pack/merchandise or asset components cannot offset unrelated current inputs."
    source_ids: []
  - rule_id: full_asset_life
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N for one compatible complete asset/all users/periods. Include manufacture/maintenance/real replacements/retirement/EOL, observed history+sourced remainder and uncertainty/sensitivity/update. Direct/provider/carrier/current-event overlap removed only once same burden actually owned elsewhere; no per-turn new support, duplicate rent/service+wholeasset or repeated normalization."
    source_ids: []
  - rule_id: actual_transfer_views
    applies_to: "real fates"
    rule: "Useful commercial returns/retained or marketable downgrades remain distinct commodity exits. Actual whole/chipped plate stream with associated pack vs separate fragments/packing/mixed hygiene/liquid are exclusive physical transfers with real receiver. Body/glaze/component/retained-fluid analysis does not create duplicate physical or species outflows. Actual service handling/treatment once, no assumed material substitution benefit."
    source_ids: []
