      record_type: "Lifecycle and consuming-driver ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; asset_id; asset_configuration; event_date; phase_id; acquisition_record; manufacture_dataset; maintenance_record; replacement_id; end_of_life_record; consumer_id; driver_unit; driver_used; driver_lifetime; observed_driver; evidenced_remaining_driver; lifetime_source; termination_assumption; attribution_view; uncertainty; sensitivity; update_trigger"
      collection_method: "Identify all consumers and periods; reconcile driver use against full lifecycle burden and support evidenced remaining use/replacements/termination; retain one allocation view."
      unit: "Item(s) or actual lifecycle-service native unit"
      frequency: "Each asset event and period review"
      temporal_coverage: "All actual and evidenced remaining asset life"
      site_scope: "All consumers, jobs and periods of the actual asset"
      aggregation_rule: "per reference flow"
      quality_evidence: "Lifecycle-complete coverage, observed service records and evidenced remaining-use scenarios"
    - protocol_id: cp_freight
      process_id: "wholesale"
      flow_role: "freight"
      record_type: "Leg and load ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; leg_id; event_date; provider_id; route; transport_mode; net_load; load_unit; load_conversion_factor; load_conversion_factor_unit; load_conversion_source; distance; distance_unit; distance_conversion_factor; distance_conversion_factor_unit; distance_conversion_source; native_service_unit; attribution_driver; attribution_driver_unit; all_consumer_driver; attribution_share; empty_return_method; upstream_coverage; duplicate_leg_check; uncertainty"
      collection_method: "Record actual leg loads and distances; convert to compatible kg*km using explicit conversion, preserve mode/load/empty-return and upstream coverage before attribution."
      unit: "kg*km"
      frequency: "Each transport leg"
      temporal_coverage: "All included legs and returns"
      site_scope: "Declared transport responsibility boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Transport documents, load/distance provenance and coverage check"
    - protocol_id: cp_environment
      process_id: "wholesale"
      flow_role: "environmental_water, other_wastes, contained_wastewater, water_outfalls, species_releases"
      record_type: "Measured fate and receiver ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; event_id; event_date; time_zone; source_id; material_state; collected_wastewater_volume; received_wastewater_volume; wastewater_volume_unit; concentration; concentration_unit; concentration_basis; concentration_source; species; particle_fraction; receiving_medium; temperature; temperature_unit; measured_quantity; native_unit; measurement_method; waste_receiver; treatment_dataset_id; treatment_coverage; water_source; outfall_id; combustion_activity; activity_unit; species_factor; factor_unit; factor_basis; factor_source; composition_fraction; composition_basis; composition_source; release_fraction; fate_basis; fate_source; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Expand actual material, species/particle fraction and receiver; use direct measurement or actual compatible activity times species-specific factor. Whole-fluid release times measured composition/fate is an alternative only when it does not duplicate an already complete species factor. Carrier water, contained waste and substance views remain non-additive where appropriate. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "Actual native unit"
      frequency: "Each release, waste movement and relevant measured interval"
      temporal_coverage: "Whole attributed operation and events"
      site_scope: "Actual direct boundaries and contracted treatment receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual receiver proof, measurement/factor provenance and non-overlap check"
  calculation_rules:
    - id: count_and_attribution
      applies_to: "all inventory rows"
      rule: "Collect actual operational totals using actual consignment, campaign and period keys. Attribute shared burdens with documented all-consumer physical drivers, then divide the attributed quantity by N once. Rejected/cancelled attempts retain attributable burdens but do not increase N."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_providers
        - cp_assets
        - cp_freight
        - cp_environment
      output: "Operational exchange quantity per reference flow"
      source_ids: []
    - id: grain_dry_balance
      applies_to: "grain memorandum and waste_grain; waste_grain_atomic_case"
      rule: "For each actual state D = net as-is mass times (1 - wet-basis moisture fraction). Dry opening + dry external receipts + dry buyer returns - dry closing - dry physical dispatch - dry supplier returns - dry useful other exits - dry contained waste - independently measured dry direct loss = unexplained residual. Internal transfers cancel. Investigate residual with uncertainty; do not label it emission or loss automatically. Water gain/loss is tracked separately and never equated with dry matter."
      inputs:
        - cp_grain
      output: "Stock reconciliation and identified dry-matter loss L per linked commodity consignment"
      source_ids: []
    - id: commodity_link
      applies_to: "grain memorandum"
      rule: "For actual attributed irrecoverable dry-grain loss L and accepted outbound dry-grain quantity G, send L / N to the commodity model. If G > 0 and the same loss is not already included upstream, commodity dry-grain demand is G + L, or multiplier (G + L) / G. Convert using actual upstream reference moisture and preserve responsibility/coverage. Treatment already in this service stays excluded from this production-only adjustment. Unknown loss, receiver or coverage blocks complete-chain finalization."
      inputs:
        - cp_grain
        - cp_consignment
      output: "Linked upstream commodity-loss adjustment, outside service exchanges"
      source_ids: []
    - id: fuel_and_species
      applies_to: "fuel_supply and species_releases; fuel_supply_diesel_supply; species_releases_co2_fossil_air; species_releases_methane_fossil_air; species_releases_nitrous_oxide_air"
      rule: "Upstream supply follows stock-adjusted input convention. Actual burn is measured or reconstructed from a complete disjoint fate ledger: carried closing, usable external return, contained nonburned waste, unrecovered nonburned loss and actual burn. A total spill tally is audit-only when its recovered/remaining fates already appear. Species release equals actual compatible activity times a species/medium-specific factor, or actual whole-fluid release times evidenced composition and fate. Do not multiply composition/fate again into a complete species factor."
      inputs:
        - cp_energy
        - cp_supplies
        - cp_environment
      output: "Actual supply, burn and identified species release views with once-only coverage"
      source_ids: []
    - id: freight_service
      applies_to: "freight"
      rule: "For each actual leg use net load in kg times distance in km; convert actual mass and length units before multiplication. Attribute included empty returns and provider coverage once; total attributable kg*km is expressed per reference flow."
      inputs:
        - cp_freight
        - cp_consignment
      output: "Actual kg*km per reference flow"
      source_ids: []
