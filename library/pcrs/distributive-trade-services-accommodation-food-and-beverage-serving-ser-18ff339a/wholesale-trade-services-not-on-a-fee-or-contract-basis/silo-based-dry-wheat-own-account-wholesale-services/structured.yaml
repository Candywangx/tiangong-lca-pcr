    - protocol_id: cp_grain
      process_id: "wholesale"
      flow_role: "grain stock and waste_grain"
      record_type: "Lot-linked physical stock and loss ledger"
      raw_fields: "site_id; silo_id; campaign_id; period_id; lot_id; consignment_id; transfer_id; state; event_date; time_zone; storage_start; storage_end; residence_duration; residence_duration_unit; moisture_basis; moisture_source; gross_mass; tare_mass; mass_unit; moisture_fraction_wet_basis; moisture_method; temperature; temperature_unit; opening_mass; receipts_mass; buyer_returns_mass; supplier_returns_mass; physical_dispatch_mass; net_accepted_dispatch_mass; useful_other_exit_mass; closing_mass; contained_waste_mass; measured_direct_loss_mass; loss_method; residual; loss_receiver; commodity_dataset_id; commodity_loss_coverage; linked_loss_adjustment_owner; linked_loss_adjustment_status; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Use calibrated net weighing and representative moisture sampling at each actual state; pair internal transfers, reconcile dry matter, investigate unknown residual and preserve actual waste receiver proof. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "kg"
      frequency: "Each receipt, transfer, return, stocktake and dispatch"
      temporal_coverage: "All stock periods and actual silo residence"
      site_scope: "Actual silo lots and their actual external handoffs"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale/moisture method, grain stock reconciliation and linked commodity-loss interface"
    - protocol_id: cp_energy
