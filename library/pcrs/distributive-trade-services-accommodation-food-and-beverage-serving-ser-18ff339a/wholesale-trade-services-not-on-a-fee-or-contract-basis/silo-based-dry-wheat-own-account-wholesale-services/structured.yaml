validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Confirm actual own-account B2B resale, unique accepted consignment, N > 0, actual mass/moisture/quality/storage time and agreed gate. Rejected/cancelled output is excluded and invoice splits cannot inflate count."
    source_ids: []
  - rule_id: validate_grain
    applies_to: "grain memorandum"
    rule: "Reconcile all grain dry-matter and water states, actual usable returns, downgrades, waste and independently identified loss; do not convert unexplained residual to an elementary emission. Record linked commodity production-only loss adjustment and its coverage once before complete-chain claims."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "all inventory rows"
    rule: "Every actual exchange has native unit, node-owned protocol and quantity/fate evidence. Expand actual provider, supply, waste and species umbrellas; missing coverage cannot be assumed absent. Direct/provider and commodity/service boundaries must not overlap."
    source_ids: []
  - rule_id: validate_assets_periods
    applies_to: "shared_assets"
    rule: "Check all asset consumers and lifecycle phases, observed plus evidenced remaining driver, maintenance/replacement/end-of-life, period linkage, idle treatment, uncertainty and one attribution view. An unsupported lifetime is a data gap."
    source_ids: []
  - rule_id: validate_species
    applies_to: "species_releases; species_releases_co2_fossil_air; species_releases_methane_fossil_air; species_releases_nitrous_oxide_air"
    rule: "Verify actual species/particle fraction, receiving medium, compatible activity and factor/composition/fate sources. Captured dust or container contents are not direct emissions; measured fuel supply is not burn; no duplication of carrier-water and species views."
    source_ids: []
  - rule_id: validate_reject_mode
    applies_to: "wholesale"
    rule: "Link each batch/campaign/period, failed attempt, cleaning/changeover, reject return and disposal to the originating lot and one owner. Internal transfers and grain returns must reconcile stock and cancellation without creating new production or multiple accepted service counts."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete identity and foreground completeness review"
  downstream_use: "Wholesale-service add-on combined with separately matched commodity production and commodity-loss adjustment"
  allowed_use: "Declared own-account dry wheat wholesale consignment route with matching physical/commercial gate and actual mass/storage qualifiers"
  excluded_use: "Standalone delivered-wheat footprint; wheat cultivation or processing; all-grains average; fee agency; retail; monetary factor; a complete-chain claim without linked upstream commodity loss"
  required_metadata: "Actual consignment/lot, merchant/site, period, wheat class/grade, mass/moisture/state, ownership, buyer role, gate, residence time, transport and treatment coverage, linked commodity adjustment owner and status"
  required_quality_disclosure: "Concrete identities and unresolved gaps; sampling/measurement and stock uncertainty; shared drivers and complete asset lifecycle assumptions; omitted coverage; independent range evidence and linked loss accounting"
  update_trigger: "Changed supplier/route/gate or grain quality; new drying/processing; changed assets, provider scope, loss coverage, monitoring method, period or data-quality evidence"
data_sources:
  - id: "unsd-cpc3-wholesale-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes (30 June 2025), division 61 and subclass 61011. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: own-account wholesale is distinguished from agency and commodity production; wheat service is a narrower subset."
  - id: "fao-bulk-storage"
    type: "official_guidance"
    reference: "FAO, Agricultural engineering in development: Bulk storage. https://www.fao.org/4/t0522e/t0522e0d.htm"
    used_for: "Commercial bulk receipt/handling, silo storage monitoring and dispatch roles; qualitative route evidence, not a numeric recipe or mandatory treatment."
  - id: "fao-grain-aeration"
    type: "official_guidance"
    reference: "FAO, Grain storage techniques: Bulk storage, Aeration. https://www.fao.org/4/t1838e/T1838E1b.htm"
    used_for: "Ambient aeration and moisture/temperature monitoring; cooling and moisture changes differ. No airflow, hours, temperature or loss factor transferred as default."
  - id: "fao-wheat-storage"
    type: "official_guidance"
    reference: "T. S. Payne, Harvest and storage management of wheat, FAO Bread wheat improvement and production. https://www.fao.org/4/y4011e/y4011e0u.htm"
    used_for: "Wheat storage deterioration depends on physical, biological and technical conditions; no reported historical loss rate is a universal guardrail."
