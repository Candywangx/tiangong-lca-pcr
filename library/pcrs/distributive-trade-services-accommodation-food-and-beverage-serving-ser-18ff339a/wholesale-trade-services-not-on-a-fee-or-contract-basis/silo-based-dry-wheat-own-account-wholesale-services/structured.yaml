      record_type: "Submeter and combustion ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; asset_id; event_id; event_date; time_zone; duration; duration_unit; energy_type; meter_id; opening_reading; closing_reading; reading_unit; attribution_driver; all_consumer_driver; actual_burn; burn_unit; burn_method; nonburned_return; nonburned_waste; unrecovered_loss; carried_closing; provider_coverage; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Meter actual energy and measured burn; if burn is reconstructed, require a complete disjoint native-unit fate ledger with uncertainty and unknown-loss investigation. Fuel delivered is not burn. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "Native energy or fuel unit"
      frequency: "Meter interval and each burn/handling event"
      temporal_coverage: "Entire attributed campaign and relevant periods"
      site_scope: "Direct silo, handling and support assets"
      aggregation_rule: "per reference flow"
