allocation_rules:
  - rule_id: alloc_meter
    applies_to: "wholesale"
    rule: "Prefer actual submeter and event assignments. Allocate remaining documented common operating burdens to all actual consumers by an evidenced compatible physical driver, such as handling mass for conveying or occupied grain-volume-time for space-related holding. Choose driver by causal use, keep total-consumer denominator and failed/rejected attempts, explain idle-capacity treatment; invoice value and equal consignment count are not default drivers. Divide attributable totals by N once."
    source_ids: []
  - rule_id: alloc_assets
    applies_to: "shared_assets"
    rule: "Identify asset and every consuming lot/site/period. Attribute its complete manufacture, actual maintenance, replacements and end-of-life burden by driver_used / driver_lifetime. Establish lifetime driver from observed use or observed history plus evidenced remaining use, replacement and termination assumptions, uncertainty and sensitivity. Use either asset-equivalent fraction / N OR lifecycle-complete provider quantity in native units / N, never both and never normalize twice."
    source_ids: []
  - rule_id: alloc_supplies
    applies_to: "operating supplies"
    rule: "For one actual native-unit SKU/state, S = attributed opening stock + external receipts - closing stock. Choose gross-with-outlets S / N and retain usable external returns, or consumed-only (S - usable external returns) / N with matched return omitted from credited exchange. Closing stock includes usable recovered closing stock; wastage and uncontained loss are not usable returns and retain upstream supply burden. Internal issues/returns do not create external purchases."
    source_ids: []
  - rule_id: alloc_commodity_loss
    applies_to: "grain memorandum"
    rule: "Keep all wheat-production burdens outside this service. Send attributed irrecoverable grain dry-matter loss L, accepted outbound grain dry matter G and existing commodity-dataset loss coverage to the linked commodity system. If G > 0 and its commodity baseline excludes this loss, upstream dry-wheat demand = G + L (factor (G + L) / G). Convert at the actual upstream reference moisture; for service linkage provide L / N. If matching losses are already included, reconcile instead of multiplying again. Waste treatment included here must not be repeated there. Unknown loss or attribution blocks complete-chain claims, never defaults to zero."
    source_ids: []
  - rule_id: alloc_outlets
    applies_to: "wholesale"
    rule: "No substitution credit from unusable grain, usable supply returns or unsold merchandise. Downgraded but usable sold grain retains actual state and receiving transaction; it is a documented physical merchandise exit, not an automatically burden-free coproduct. If genuinely independent intended co-products or processing appear, declare and review a new attribution boundary before final dataset use."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Here G is net completed accepted outbound grain after actual cancellations and buyer-return reversals, not all physical dispatches. The physical stock balance separately retains gross physical dispatch and actual return receipts. Buyer-returned grain that remains merchant stock is not irrecoverable L. Storage-water changes must be reconciled at the actually measured state, including moisture sampling uncertainty."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_consignment
      process_id: "wholesale"
      flow_role: "accepted_service"
      record_type: "Ownership and handover ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; seller_id; buyer_id; buyer_business_role; contract_id; ownership_start; resale_risk; dispatch_id; handover_gate; handover_date; time_zone; storage_start; storage_end; residence_duration; residence_duration_unit; accepted_net_mass; mass_unit; moisture_fraction_wet_basis; grain_grade; quality_criteria; acceptance_record; cancellation_id; N"
      collection_method: "Reconcile unique actual commercial consignments against dispatch, acceptance, cancellation and ownership records; exclude duplicate invoice/truck splits."
      unit: "Item(s)"
      frequency: "Every consignment and cancellation"
      temporal_coverage: "Actual receipt-to-handover and relevant reporting periods"
      site_scope: "Merchant silo and linked business-buyer gate"
      aggregation_rule: "per reference flow"
