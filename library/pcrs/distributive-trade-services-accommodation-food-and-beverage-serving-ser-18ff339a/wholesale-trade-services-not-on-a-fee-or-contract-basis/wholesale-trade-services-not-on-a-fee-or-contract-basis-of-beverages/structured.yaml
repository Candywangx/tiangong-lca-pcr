validation_rules:
  - rule_id: reference_check
    applies_to: "accepted_service"
    rule: "N>0 final unique commercial buyer accepted consignment with actual source/state/pack/count/contents/tare/density-temperature/time/condition qualifiers; not bottle/case or kg reference."
    source_ids: []
  - rule_id: no_hidden_processing
    applies_to: "whole route"
    rule: "No extraction/treatment/filling/opening/resealing/carbonation/returnable bottle processing or unreviewed dedicated climate intervention; contracted physical processing remains real route scope."
    source_ids: []
  - rule_id: commodity_stock_gate
    applies_to: "merchandise and actual exits"
    rule: "Verify actual original released filled/sealed baseline covers upstream water+container+filling, assigned originalgate demand/actual loss units/state/source/owner/existingcoverage outside service once, exclusive returns/closing/other exits, no stock residual=release."
    source_ids: []
  - rule_id: physical_resource_owners
    applies_to: "all resources"
    rule: "Actual all-user periods/driver units, idle/hygiene/open attempts, supply returns and full asset lifecycle/remainder/EOL; provider/carrier/treatment scopes once, no per-turn pallet manufacture or double normalization."
    source_ids: []
  - rule_id: intact_breach_release
    applies_to: "all actual outlets"
    rule: "Usable commercial return differs from intact waste, actual breach/separated pack/mixed cleanup/liquid and environmental species. No simultaneous intact whole pack and component outflows, no commodity-water abstraction/utility/purewater emission assumption."
    source_ids: []
  - rule_id: bilingual_projection
    applies_to: "all cards/rules"
    rule: "Actual output reference name/link and raw six fields, qualifiers, seven profile fields, card/evidence/property-unit/protocol operands/sourceURL and ordered rules align bilingual and projection; pass alone does not verify site quality or final UUID."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after complete actual foreground collection and concrete exchange verification"
  downstream_use: "Ambient merchant physical service add-on linked to separate released filled/sealed mineral-water commodity system with actual compatible demand/loss once; not full bottled-water delivered footprint"
  allowed_use: "Declared one-wayPET suppliersealed noncarbonated natural-mineralwater ambient own-account wholesale cohort and actual accepted B2B gate"
  excluded_use: "Bulk/sparkling/flavoured water or otherdrinks, extraction/filling/containerproduction, climate-intervention route without review, returnable bottle processing, feeagency/retail/standalonewarehouse; health/safety/shelflife guarantee"
  required_metadata: "Merchant/source/SKU/lot/pack/release and buyer gates; actual bottle/case/labelvolume/contentsquantity densitytemperature and PETclosurelabelouter/support tare; ambient/exposure/period records; all-user resources/providers/carriers/full-life assets and actual waste receiver; originalgate assigned quantity/state/unit/source/allocation/conversion/lossowner/existingcoverage"
  required_quality_disclosure: "Actual measurement/calibration and count-volume-mass/tare compatibility; intact/breach/cleanup/unknown differences; all-user causal drivers and full-life sourced remainder; physical package/treatment overlap; originalgate commodity demand/loss adjustment; actual exchange support/identity/range gaps"
  update_trigger: "Supplier/source/noncarbonated/pack state or criteria change; new opening/refilling/resealing/climate intervention; warehouse/handling/asset/provider/carrier/treatment route change; breach/reject/loss/release or material evidence update"
data_sources:
  - id: "codex-packaged-water-hygiene"
    type: "official_guidance"
    reference: "Codex, Code of Hygienic Practice for Collecting, Processing and Marketing of Natural Mineral Waters, CAC/RCP33-1985 revised2011, section8. https://www.fao.org/input/download/standards/224/CXP_033e.pdf"
    used_for: "Historical primary packaged distribution exposure/context: freezing/container failure, condensation/label-secondarypack damage, excessive heat/cold concerns. No numeric defaults, current legal-compliance claim, chemical recipe or upstream production step adopted."
  - id: "codex-mineral-water-state"
    type: "standard"
    reference: "Codex Standard for Natural Mineral Waters, CODEXSTAN108-1981 amended2011, sections2.2.2 and5. https://www.fao.org/input/download/standards/223/CXS_108e.pdf"
    used_for: "Historical primary distinction of noncarbonated mineral-water and hermetic packaged state; actual supplier/source evidence remains required, no purity/density/composition/health threshold or inferred current law."
