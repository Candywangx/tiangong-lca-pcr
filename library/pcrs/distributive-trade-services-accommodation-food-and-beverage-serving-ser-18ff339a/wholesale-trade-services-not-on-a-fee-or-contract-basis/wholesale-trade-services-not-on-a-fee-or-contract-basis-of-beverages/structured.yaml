allocation_rules:
  - rule_id: commodity_gate_demand
    applies_to: "merchandise"
    rule: "Trace actual original filled/sealed supplier-gate input and assigned quantity to the accepted consignment/cohort with compatible water-and-pack state/unit/source and evidenced allocation/conversion. Include evidenced originally supplied water not recovered after real breach and matching inherited packaging. Returns, closing and other exits have exclusive assignments. Dispatch net water plus discarded PET cannot substitute source-gate filled-pack demand. All upstream stages and loss adjustment are owned once outside service with existing-loss coverage; stock deficit alone cannot determine lost water, waste or release."
    source_ids: []
  - rule_id: all_consumer_resources
    applies_to: "actual warehouse period"
    rule: "Use actual all-consumer source periods and causal handling/occupied-space-time/other justified drivers, with native units and rationale, including idle, hygiene, failed/repeated attempts and open cohorts. Equal consignment or water-mass ratios are not presumed. Unfinished service resources carry forward without inventing N."
    source_ids: []
  - rule_id: supply_return_convention
    applies_to: "service new supplies"
    rule: "S=opening_supply+net_receipts-closing_supply. Choose gross input S/N plus separately recorded matching actual native unused outward-return output, OR consumed-only input (S-usable_outward_return)/N with that return exchange omitted and no extra deduction. Deduction requires evidenced same-scope standalone supplystock; retained recovered stock belongs to closing. Inherited merchandise/asset contents do not reduce unrelated current supply."
    source_ids: []
  - rule_id: full_asset_equivalent
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N for one compatible complete whole asset and all consumers/periods. Include manufacture, maintenance, actual replacement/retirement/end-of-life, observed history plus sourced remainder and uncertainty/sensitivity/update. Current-event/provider overlaps removed only when those same burdens have one actual owner elsewhere. No per-turn new pallet or rent/asset duplicate view."
    source_ids: []
  - rule_id: actual_outlet_once
    applies_to: "wastes and actual returns"
    rule: "Intact usable commercial return remains commodity; intact filled-pack waste is one physical whole-state transfer. On actual breach, separately assign water, separated pack and mixed cleanup stocks/outputs using measured state and receiver. No duplicate water/pack components under intact waste, no extra whole-stream/species outflow, no assumed avoided-production/recycling credit. Treatment belongs once to service or receiver package coverage."
    source_ids: []
