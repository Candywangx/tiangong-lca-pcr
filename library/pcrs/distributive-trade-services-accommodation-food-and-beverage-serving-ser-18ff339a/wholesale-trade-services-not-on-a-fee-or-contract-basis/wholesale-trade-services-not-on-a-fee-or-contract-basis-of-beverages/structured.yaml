      flow_role: "actual whole-load transport"
      record_type: "shipment_work_record"
      raw_fields: "shipment_id; carrier_id; mode; supplier_gate; destination_gate; cohort_id; consignment_id; period_id; actual_start; actual_end; water_payload_mass; pet_closure_label_mass; inherited_outer_mass; added_pack_mass; transported_pallet_support_mass; mass_unit; whole_payload_mass; route_distance; distance_unit; load_share; share_basis; share_source; multi_drop_coverage; empty_leg_coverage; return_coverage; native_work_unit; work_conversion; conversion_source; carrier_energy_scope; carrier_asset_scope; direct_overlap; uncertainty"
      collection_method: "Reconcile actual transported water plus inherited/added packing and pallet/support load at agreed gates. Multiply compatible whole payload and actual route distance with actual disjoint shipment/consignment share. State empty/multi-drop/return and carrier energy/assets coverage."
      unit: "kg*km; actual payload/distance/native-work units"
      frequency: "each real shipment and return leg"
      temporal_coverage: "Actual agreed transport gates and associated empty/return periods"
      site_scope: "Named carrier work with embedded energy/asset owners"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual load/route/share records and source-backed unit conversions"
    - protocol_id: cp_outlets
      process_id: "ambient_wholesale"
      flow_role: "contained damaged pack cleanup solids and liquids"
      record_type: "outlet_receiver_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; stream_id; material_identity; stream_state; classification; gross_quantity; tare_quantity; net_quantity; quantity_unit; remaining_contents; remaining_contents_unit; composition; composition_basis; composition_source; water_merchandise_fraction; utility_water_fraction; retained_cleanup_fluid; inherited_pack_inclusion; separate_stream_exclusion; density; density_unit; density_temperature; density_source; volume; volume_unit; conversion; conversion_source; pollutant_load; pollutant_unit; load_source; collection_method; receiver; transfer_id; receiver_acceptance; treatment_route; treatment_scope; provider_coverage; direct_release_exclusion; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure each actual separated pack, mixed cleanup solid or contained liquid in its actual stream state and native unit; define remaining contents and nonadditive component views. Verify receiver/treatment and provider ownership once, exclude already-transferred intact packs and retained closing material. Composition and pollutant load require actual independent evidence. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg; m3; actual stream native units"
      frequency: "each actual collection/transfer and receiver acceptance"
      temporal_coverage: "All actual loss/cleaning/receiver periods with stock retained separately"
      site_scope: "Actual contained physical receiver interface, no automatic direct release"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measured net quantity/density/state, actual composition/load basis and receiver treatment evidence"
    - protocol_id: cp_environment
      process_id: "ambient_wholesale"
      flow_role: "actual direct species and receiving medium"
      record_type: "direct_species_measurement_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; substance_identity; receiving_medium; release_state; measured_mass; measured_mass_unit; measured_volume; measured_volume_unit; activity; activity_unit; species_factor; factor_unit; factor_source; factor_scope; factor_complete; measured_whole_stream_release; whole_stream_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; temperature; temperature_unit; pressure; pressure_unit; density; density_source; conversion; conversion_source; retained_captured_quantity; receiver_treatment_coverage; applicability; calibration; uncertainty"
      collection_method: "Establish actual species and receiving medium before identity choice. Select measured species mass OR justified matched activity/factor OR measured whole-stream composition/fate. A complete species factor is not multiplied by composition/fate again. Collected streams/retained stock differ from actual environment release; uncontained whole liquid needs appropriate separate native identity and no pure-water assumption."
      unit: "kg species; all raw native activity/concentration/stream units"
      frequency: "each actual event or justified matched monitoring interval"
      temporal_coverage: "Actual release period and source applicability, no inferred opening/closing residual"
      site_scope: "Named direct environmental interface excluding contained receiver treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement/calibration or justified factor applicability/composition/fate sources and conversion uncertainty"
  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_waterpack
      output: "One complete actual commercial service with actual contents/count/pack/state/time qualifiers"
      source_ids: []
    - id: contents_pack_views
      applies_to: "non-exchange commodity"
      rule: "contents_net_mass=whole_pack_gross-pet_tare-closure_tare-label_tare-outer_pack_tare-pallet_support_tare on actual compatible boundary; OR contents_net_mass=actual_volume*density with compatible measured volume/density-temperature evidence. Labelled volume, bottle count and actual contents are separately recorded nonadditive views."
      inputs:
        - cp_waterpack
      output: "Actual water/pack/tare audit, no constant litre-to-kg factor"
      source_ids: []
    - id: source_gate_demand
      applies_to: "non-exchange commodity"
      rule: "assigned_source_gate_quantity=actual compatible evidenced allocation/conversion of source_gate_input_quantity to accepted cohort, with originally supplied unrecovered water and matching packaging where evidenced, exclusive returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service; actual loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once. Unknown stock difference is not loss."
      inputs:
        - cp_waterpack
        - N
      output: "Separate source-gate filled/sealed demand and once-only commodity loss interface"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service new supplies; unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross input S/N plus actual matched outward return usable_outward_return/N OR consumed-only (S-usable_outward_return)/N and omit matching return exchange. Recoveries retained included in closing; use actual native units and conversion sources."
      inputs:
        - cp_supplies
        - N
      output: "Actual service supply and selected one return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading with actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N on disjoint scopes and complete all-user periods, retaining idle/hygiene/open work."
      inputs:
        - cp_utilities
        - N
      output: "Actual purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only for evidenced actual matching package; embedded physical resource owners reconciled."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver in compatible units, sourced full-life coverage and remainder, all consumers included. No duplicate per-driver service view."
      inputs:
        - cp_assets
        - N
      output: "One compatible actual full-lifecycle asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=water_payload_mass+pet_closure_label_mass+inherited_outer_mass+added_pack_mass+transported_pallet_support_mass on actual disjoint load components; freight_work=whole_payload_mass*route_distance*load_share/N after actual unit conversions and exclusive empty/return coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual whole-load transport work per reference flow"
      source_ids: []
    - id: actual_contained_outlets
      applies_to: "intact_pack_waste; empty_pack_waste; cleanup_waste; contained_wastewater; empty_pack_waste_plastic_pack; intact_pack_waste_atomic_case"
      rule: "intact_pack_waste=intact_waste_transfer_mass/N for actual intact whole pack. Other outlet_quantity=(gross_quantity-tare_quantity)/N or actual volume/N with compatible density/temperature conversion as needed. Separate whole streams and components; receiver/treatment counted once, retained closing/internal movements not exports."
      inputs:
        - cp_waterpack
        - cp_outlets
        - N
      output: "Actual disjoint contained outlets in recorded native states per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible source-backed conversions; choose one method. factor_complete forbids extra composition/fate; no whole-stream/species duplicate physical output."
      inputs:
        - cp_environment
        - N
      output: "Actual species mass and receiving medium per reference flow"
      source_ids: []
