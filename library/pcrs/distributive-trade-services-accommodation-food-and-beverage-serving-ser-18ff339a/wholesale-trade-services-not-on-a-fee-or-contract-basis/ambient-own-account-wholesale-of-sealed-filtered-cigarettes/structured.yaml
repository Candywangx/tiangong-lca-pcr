    used_for: "61028 includes group250 tobacco products; classification only,not process quantities."
  - id: "hmrc-selling-storing"
    type: "official_guidance"
    reference: "HMRC.Selling and storing tobacco products,last updated1July2022; https://www.gov.uk/guidance/selling-and-storing-tobacco-products"
    used_for: "UK examples of arrival/departure/return and aggregation identities plus distinct lost/stolen/destroyed records; no global obligation,numeric timing,tax or physical loss factor."
  - id: "hmrc-id-issuer"
    type: "official_guidance"
    reference: "HMRC.Register with the ID issuer if you are in the tobacco product supply chain; https://www.gov.uk/guidance/register-with-the-id-issuer-if-youre-in-the-tobacco-product-supply-chain"
