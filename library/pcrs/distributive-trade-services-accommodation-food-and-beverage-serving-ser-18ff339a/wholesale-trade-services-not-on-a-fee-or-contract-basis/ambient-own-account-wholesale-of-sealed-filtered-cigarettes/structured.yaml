allocation_rules:
  - rule_id: allocation_cohort
    applies_to: "all inventory"
    rule: "Use positive actual unique accepted N and causal physical period/cohort shares. Include failed/cancelled/quarantined/returned-order,standby,cleanup and unfinished cross-period duties; no activity disappears when period N is zero. Tax/excise/margin/currency are not physical denominators."
    source_ids: []
  - rule_id: allocation_stock
    applies_to: "merchandise nonexchange ledger"
    rule: "Reconcile attributed opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,known discard and other external exits with exclusive states; quarantine and aggregation are internal moves. Map assigned finished-cigarette demand/loss to original gate with measured component/moisture/primary tare conversion,unit/basis/source and owner/already-included coverage. Raw cured leaf alone is not a finished-cigarette baseline."
    source_ids: []
  - rule_id: allocation_supply
    applies_to: "actual supplies and usable_supply_return"
    rule: "S=attributed opening+true external net receipts-closing including retained recovered supplies. Choose gross supply INPUT S plus separate same-scope matched usable return OUTPUT OR consumed-only INPUT S-return with matching outward exchange omitted. Internal recovery is not new receipt; no numeric S+return input,second deduction or removal of waste/spill upstream burden."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "power/providers/assets/freight"
    rule: "Measured compatible-period resource share=cohort physical driver/all-consumer driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across all users/periods; include manufacture,maintenance/cleaning,replacements and EOL once. Use observed lifetime or history plus evidenced remainder/termination,driver units,sources,sensitivity/update. A complete provider representation is an alternative to own covered burdens."
    source_ids: []
  - rule_id: allocation_outlets
    applies_to: "actual waste and releases"
    rule: "Use actual mutually exclusive whole-unit or separated components with receiver/treatment and transport once. A wet stream and its contents/components are alternate composition views,not additive physical exits. No automatic recycling/substitution credit or upstream supply subtraction for waste. Direct identified substances need actual receiving media and supported fate."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
