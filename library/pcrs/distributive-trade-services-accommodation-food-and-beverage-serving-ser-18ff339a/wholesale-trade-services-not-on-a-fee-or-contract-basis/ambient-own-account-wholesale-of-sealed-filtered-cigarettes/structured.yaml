validation_rules:
  - rule_id: validate_completion
    applies_to: "accepted_service"
    rule: "Require actual own-account commercial B2Bacceptance,all qualifiers and positive unique N; warehouse scan,pack count,payment and excise do not alone complete the reference service."
    source_ids: []
  - rule_id: validate_hierarchy
    applies_to: "stock and traceability"
    rule: "Reconcile actual tracked parent-child identities and native sticks/pack/carton quantities with measured factors; no duplicated parent plus child merchandise quantities or fictitious stick identifiers. HMRC guidance is a jurisdiction-specific record example,not universal law,issuer,deadline or tax rule."
    source_ids:
      - hmrc-selling-storing
      - hmrc-id-issuer
  - rule_id: validate_loss
    applies_to: "commodity linkage"
    rule: "Require compatible released sealed finished-cigarette production/primarypack baseline with missing stages assembled once outside service,assigned original-gate loss quantity/unit/state/conversion/source and existing coverage owner/integration result. Theft or residual imbalance does not prove physical fate or dry-tobacco emission."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "physical coverage"
    rule: "Verify native units/support,full asset life/all-user compatible drivers and own/provider/carrier/receiver boundaries once. Actual additional operated conditioning/fuel/fluids triggers scope expansion; no generic Energy substitute,fee-to-Count or blanket zero."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "actual outputs"
    rule: "Require measured exclusive whole/part waste and actual receiver/treatment; specific direct species/activity/factor/composition/fate sources must be compatible. Nicotine content,odour,missing identifiers and moisture deficits are not release quantities."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual quantitative and identity evidence"
  downstream_use: "Additive physical ambient own-account wholesale service for complete released sealed filtered-cigarette commodity chain"
  allowed_use: "Actual declared SKU/style,pack hierarchy,net mass/moisture/tare,period/condition and accepted B2Broute"
  excluded_use: "Standalone whole-cigarette footprint,manufacture,rawleaf,other nicotine devices,smoking,retail/agency,active conditioning/reprocessing or monetary/tax proxy"
  required_metadata: "All reference qualifiers; actual physical stock hierarchy and periods; source-gate assigned demand/loss conversion/owner/coverage/integration; full provider/carrier/asset/receiver scope"
  required_quality_disclosure: "Unresolved actual identities/support,quantities,Range evidence and actual physical fates; source jurisdiction limits and lifetime/conversion uncertainty"
  update_trigger: "Changed SKU/style/pack hierarchy,warehouse operation,provider/asset/transport/treatment,acceptance,loss/fate evidence or source-gate scope"
