      raw_fields: "utility_id; provider; geography; meter_id; native_interval_quantity; quantity_unit; quantity_source; interval_start; interval_end; time_zone; service_driver; all_user_driver; driver_unit; driver_basis; driver_source; service_driver_share; density; density_unit; density_temperature; density_temperature_unit; density_source; conversion_factor; conversion_unit; conversion_source; included_provider_scope; overlap_exclusions; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use meter/native invoices, interval coverage and actual all-user space-time/handling shares; no equipment consumer electricity. Aggregation detail: Interval quantity times actual causal service share /N, keep direct versus allocated and provider overlap explicit. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh,m3 and native driver/time/conversion units"
      frequency: "Each meter/driver interval"
      temporal_coverage: "Complete collection period including idle/open resources"
      site_scope: "Actual shared warehouse and handling meters"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter scope, all-user driver records/native units, method and source"
    - protocol_id: cp_provider
      process_id: "ambient_wholesale"
      flow_role: "Disjoint real contracted package"
      record_type: "Physical provider scope record"
      raw_fields: "package_id; provider; physical_scope; native_package_quantity; package_unit; quantity_source; physical_equivalence; equivalence_unit; equivalence_source; documented_share; share_driver_unit; share_driver_basis; share_driver_source; covered_events; covered_energy; covered_materials; covered_assets; covered_transport; covered_treatment; excluded_scope; direct_resource_owner; service_period; all_users; evidence_record; N"
      collection_method: "Obtain native physical equivalent, covered resources/assets/carrier/treatment and event owner matrix; do not hide excluded processing. Aggregation detail: Native quantity times evidenced share/N only after excluding duplicate direct/carrier/asset/treatment scopes."
      unit: "Native physical package unit and share driver units"
      frequency: "Each contract service/event and change"
      temporal_coverage: "Actual provider service interval"
      site_scope: "Actual provider events linked merchant node"
      aggregation_rule: "per reference flow"
      quality_evidence: "Provider scope/equivalence statement and exclusive event matrix"
    - protocol_id: cp_assets
      process_id: "ambient_wholesale"
      flow_role: "Full asset lifecycle share"
      record_type: "Asset and complete lifecycle driver register"
      raw_fields: "asset_id; asset_dataset_scope; manufacture_coverage; maintenance; replacement_events; retirement; end_of_life; event_quantity; event_unit; event_source; job_driver; job_driver_unit; job_driver_source; observed_all_user_driver; observed_driver_unit; observed_driver_source; remaining_driver; remaining_driver_unit; remaining_basis; remaining_source; lifetime_all_user_driver; lifetime_driver_unit; driver_equivalence; equivalence_unit; equivalence_source; all_consumers; all_periods; idle_and_open_use; uncertainty; sensitivity; update_trigger; provider_carrier_overlap; N"
      collection_method: "Collect matched manufacture/maintenance/replacement/retirement/EOL coverage, observed all-user use and sourced future remainder with unit equivalence/uncertainty. Aggregation detail: job_driver/lifetime_all_user_driver/N; include all-user history/remainder, update sensitivity and exclude embodied assets in provider packages."
      unit: "Native asset equivalents and compatible job/life driver units"
      frequency: "Each asset event and period update"
      temporal_coverage: "Full observed plus evidenced remaining lifetime and all users"
      site_scope: "Merchant infrastructure and actual disjoint provider responsibility"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset dataset boundary, service logs, remainder source, native units and uncertainty"
    - protocol_id: cp_freight
      process_id: "ambient_wholesale"
      flow_role: "Actual carrier work"
      record_type: "Segment payload and route record"
      raw_fields: "segment_id; mode; carrier; origin; destination; route_scope; whole_pack_payload; payload_unit; payload_source; payload_conversion; payload_conversion_unit; payload_conversion_source; distance; distance_unit; distance_source; distance_conversion; distance_conversion_unit; distance_conversion_source; actual_transport_work; work_unit; work_source; service_share; share_driver_unit; share_driver_basis; share_driver_source; empty_return_coverage; carrier_fuel_assets; warehouse_overlap; N"
      collection_method: "Collect actual full packed-kit payload, route distance and carrier native work, empty legs and covered fuels/assets. Aggregation detail: Convert compatible units and apply actual physical service share/N; do not repeat embedded carrier or warehouse resources."
      unit: "Native payload,distance,work and converted t*km"
      frequency: "Each actual segment"
      temporal_coverage: "All included inward/outward/return segments and their real periods"
      site_scope: "Actual route/carrier boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge/packing list, route/unit conversion, carrier dataset scope"
    - protocol_id: cp_outlets
      process_id: "ambient_wholesale"
      flow_role: "Actual useful/waste physical transfers"
      record_type: "Receiver accepted transfer and stream measurement"
      raw_fields: "transfer_id; receiver; receiver_classification; treatment_boundary; treatment_owner; source_kit_ids; parent_part_ids; stream_identity; physical_state; native_quantity; quantity_unit; quantity_basis; quantity_method; quantity_source; transfer_time; whole_kit_exclusion; separate_part_exclusion; separate_pack_exclusion; retained_content_identity; retained_content_quantity; retained_content_unit; retained_content_state; retained_content_basis; retained_content_method; retained_content_source; retained_content_sample_time; retained_content_fate; component_identity; component_quantity; component_unit; component_basis; component_method; component_source; component_sample_time; retained_moisture; retained_moisture_unit; retained_moisture_basis; retained_moisture_method; retained_moisture_source; retained_moisture_sample_time; retained_fluid; retained_fluid_unit; retained_fluid_basis; retained_fluid_source; density; density_unit; density_temperature; density_temperature_unit; density_source; conversion_factor; conversion_unit; conversion_source; usable_transfer_record; waste_acceptance_record; source_stock_pairing; no_double_credit; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Identify whole kit versus actual detached part/packing/mixed hygiene/liquid, measure native whole quantity and independent retained component/content audit with units/bases/source/fate. Aggregation detail: actual compatible net_quantity/N; content is inside whole transfer unless independently transferred and exclusively allocated. Count actual useful returns separately from waste, no presumed release/credit. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Native stream Item(s),kg,m3 and independently stated component/content units"
      frequency: "Each actual external transfer and incident"
      temporal_coverage: "Transfer interval and retained closing stocks explicitly separate"
      site_scope: "Actual merchant outlet and documented receiver/treatment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receiver/classification acceptance, measured net/tare/state, parent linkage and exclusive contents/treatment"
    - protocol_id: cp_environment
      process_id: "ambient_wholesale"
      flow_role: "Conditional real direct release"
      record_type: "Species and receptor measurement or justified factor record"
      raw_fields: "event_id; species_identity; particle_basis; receiving_medium; direct_measurement; measurement_unit; measurement_method; measurement_source; sample_time; activity; activity_unit; activity_source; factor; factor_unit; factor_basis; factor_source; factor_scope_complete; composition; composition_unit; composition_basis; composition_source; release_fraction; fate_basis; fate_source; whole_stream_quantity; whole_stream_unit; whole_stream_source; density; density_unit; density_temperature; density_temperature_unit; density_source; conversion_factor; conversion_unit; conversion_source; retained_captured_quantity; retained_captured_unit; retained_captured_basis; retained_captured_source; contained_transfer_exclusion; inherited_content_provenance; stock_unknowns; provider_overlap; N"
      collection_method: "Identify actual species/medium, trace measurement or applicable activity/factor and needed composition/fate, excluding retained/captured/contained transfer and unknown inherited content. Aggregation detail: Measured species/N OR supported activity factor with required composition/fate/conversions/N; complete factors not re-multiplied."
      unit: "kg species plus native activity/factor/composition/temperature units"
      frequency: "Each actual measured or supported release event"
      temporal_coverage: "Actual event/sample intervals and representativeness"
      site_scope: "Actual release receptor outside merchant boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Sampling/analytical method or applicable factor/source, actual activity/state and independent receptor evidence"
  calculation_rules:
    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique actual buyer-accepted commercial consignment IDs at the declared final gate; do not count actual kits/pairs as service outputs."
      inputs:
        - "cp_binocular buyer_acceptance_id/consignment_id/state/time"
      output: "N and 1 Item(s) service reference"
      source_ids: []
    - id: kit_mass_audit
      applies_to: "merchandise nonexchange"
      rule: "whole_pack_mass=actual_net_kit_mass+actual_included_pack_tare only on same scope/state/method; body+included accessories are a nonadditive kit decomposition, not another service supply."
      inputs:
        - "cp_binocular native quantities/configuration/unit/method/source"
      output: "Native kit and actual pack quantity audit, no default model weight"
      source_ids: []
    - id: original_gate_demand
      applies_to: "commodity outside"
      rule: "Preserve actual raw original-gate demand and loss/stage integration at its physical assignment scope. Record assignment_scope_ids, quantity_basis=raw_target_cohort or per_reference, same_target_scope_N and source. Directtrace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers uses complete compatible mutually exclusive all-exit records, actual state-change share and original-state equivalence. For an actual raw target-cohort quantity, commodity_source_gate_demand=assigned_source_gate_quantity remains the unnormalized physical ledger amount; actual external stage/loss integration and stock closure use that raw amount once. ONLY when combining with the 1 Item(s) service, derive q_per_reference=raw_assigned_to_that_same_scope/positive same_target_scope_N. Already per-reference quantities keep their normalization and are not divided again; a single-case raw scope has N=1. N=0 produces no normalized value. Require quantity/unit/state/source/allocation/conversion/sole owner and already-included loss coverage; finaldispatch-plus-waste or a stock residual does not establish source demand/loss."
      inputs:
        - "cp_binocular original source quantities/native all-exit drivers/equivalence/owner/coverage"
      output: "Quantified complete supplier-gate commodity demand and exclusive once-only linked loss adjustment outside service"
      source_ids: []
    - id: supply_convention
      applies_to: "actual supplies"
      rule: "S=opening+net_receipts-closing; select gross S/N input plus separate matched usable_outward_return/N OR consumed-only (S-usable_outward_return)/N input and OMIT paired output."
      inputs:
        - "cp_supplies source stock/pairing/unit/conversion"
      output: "Exclusive input/unused outward return convention without second credit"
      source_ids: []
    - id: utilities
      applies_to: "actual utilities"
      rule: "allocated_utility=native_interval_quantity*service_driver_share/N after compatible conversion; service_driver_share=service_driver/all_user_driver on evidenced causal same-unit basis."
      inputs:
        - "cp_utilities interval and all-user native driver records/source"
      output: "Actual utility per service, measured/allocated distinction"
      source_ids: []
    - id: provider_scope
      applies_to: "actual packages"
      rule: "provider_quantity=actual_native_package_quantity*documented_share/N only after physical scope/equivalence and exclusive event reconciliation."
      inputs:
        - "cp_provider native equivalents/share units/source/coverage"
      output: "Disjoint real provider package per service"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=job_driver/lifetime_all_user_driver/N; lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. Document actual replacements and EOL in matched complete life; evaluate uncertainty/sensitivity/update."
      inputs:
        - "cp_assets complete lifecycle and native driver/conversion/source"
      output: "Full-life all-user asset attribution per service"
      source_ids: []
    - id: transport_work
      applies_to: "freight"
      rule: "actual_transport_work=compatible_whole_pack_payload_tonnes*compatible_distance_km for actual mass-distance service, then multiply actual service_share/N; native carrier work takes precedence when equivalent."
      inputs:
        - "cp_freight native payload/distance/conversions/share/empty-leg scope"
      output: "Disjoint actual freight work per service"
      source_ids: []
    - id: outlets
      applies_to: "actual transfers"
      rule: "outlet_quantity=actual_compatible_net_quantity/N, whole stream with retained content. Parent-kit/part/packing/component audits are nonadditive; retained content is not independent release or recovery."
      inputs:
        - "cp_outlets whole/native/component/content/state/receiver records"
      output: "Exclusive actual receiver transfer quantity; retained stock and unknowns separately disclosed"
      source_ids: []
    - id: release
      applies_to: "direct_species"
      rule: "release_quantity=actual_measured_species_quantity/N OR compatible_activity*applicable_factor*required_composition*required_release_fraction/N; omit extra factors already included in complete species-release factor."
      inputs:
        - "cp_environment native activity/factor/composition/fate/conversion/receptor evidence"
      output: "Actual species and receiving-medium quantity, no default sealed charge/leak"
      source_ids: []
