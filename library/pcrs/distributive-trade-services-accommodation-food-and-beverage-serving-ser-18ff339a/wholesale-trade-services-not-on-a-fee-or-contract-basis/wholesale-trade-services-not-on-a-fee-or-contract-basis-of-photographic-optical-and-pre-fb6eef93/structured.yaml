allocation_rules:
  - rule_id: stock_and_attempts
    applies_to: "foreground_burden_allocation"
    rule: "Reconcile opening/receipts/closing, actual useful commercial returns, other useful exits, retained rejects and actual discard by serial/lot/configuration and period. Internal movements and recovered closing stock are not outward transfers. N includes final accepted commercial service only; open/rejected attempts retain real resource links and carried attribution."
    source_ids: []
  - rule_id: source_quantity_attribution
    applies_to: "foreground_burden_allocation"
    rule: "Original commodity demand uses evidenced direct source-to-target assignment OR a complete compatible source cohort: assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers. Native all-exit driver records include useful other exits, returns, closing and actual loss with compatible original-kit equivalence/state and documented conversions. Never allocate a whole source cohort only over accepted target services or infer original kits from fragments."
    source_ids: []
  - rule_id: original_gate_demand
    applies_to: "foreground_burden_allocation"
    rule: "Preserve actual raw original-gate demand and loss/stage integration at its physical assignment scope. Record assignment_scope_ids, quantity_basis=raw_target_cohort or per_reference, same_target_scope_N and source. Directtrace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers uses complete compatible mutually exclusive all-exit records, actual state-change share and original-state equivalence. For an actual raw target-cohort quantity, commodity_source_gate_demand=assigned_source_gate_quantity remains the unnormalized physical ledger amount; actual external stage/loss integration and stock closure use that raw amount once. ONLY when combining with the 1 Item(s) service, derive q_per_reference=raw_assigned_to_that_same_scope/positive same_target_scope_N. Already per-reference quantities keep their normalization and are not divided again; a single-case raw scope has N=1. N=0 produces no normalized value. Require quantity/unit/state/source/allocation/conversion/sole owner and already-included loss coverage; finaldispatch-plus-waste or a stock residual does not establish source demand/loss."
    source_ids: []
  - rule_id: new_supply_returns
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing includes actual retained recovery. Either model gross supply S/N and separately record actual matched unused outward return, OR consumed-only (S-usable_outward_return)/N and OMIT that return exchange. Pair same standalone supply identity/scope; never deduct inherited accessory/pack/content against unrelated current supply or apply another credit."
    source_ids: []
  - rule_id: all_consumer_service
    applies_to: "foreground_burden_allocation"
    rule: "Use measured direct resources or real causal space-time/handling/native physical drivers across all consumers/periods; include attributable idle/hygiene/open-attempt resources. Declare native driver units/source and allocation uncertainty. Mass, kit count or equal consignment shares require evidence; financial margins are no physical driver."
    source_ids: []
  - rule_id: full_asset_life
    applies_to: "foreground_burden_allocation"
    rule: "One matched complete asset lifecycle includes manufacture, actual maintenance/replacement, retirement and end-of-life. lifetime_all_user_driver includes observed all-user history plus sourced remaining driver, units/equivalence, basis/source/uncertainty/sensitivity/update. Attribute job_driver/lifetime_all_user_driver once, not a new asset each turn; provider rents/carrier assets may already own it."
    source_ids: []
  - rule_id: physical_scope_once
    applies_to: "foreground_burden_allocation"
    rule: "Keep provider/direct/carrier/asset/treatment responsibility matrix disjoint. Actual whole kit, parts, retained content/components, separate packing and mixed spent cleanup views are nonadditive. Actual receiver classification and treatment dataset boundary decide exchanges; no automatic avoided production credit."
    source_ids: []
