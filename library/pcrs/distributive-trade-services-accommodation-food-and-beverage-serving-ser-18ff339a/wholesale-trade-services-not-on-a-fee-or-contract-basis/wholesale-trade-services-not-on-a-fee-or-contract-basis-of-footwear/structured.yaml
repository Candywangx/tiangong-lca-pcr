allocation_rules:
  - rule_id: actual_operations
    applies_to: "all service inventory"
    rule: "Assign actual direct event use first; shared warehouse/handling/support uses evidenced compatible physical drivers across ALL users/periods including idle/rejected/unfinished jobs. Divide actual attributed total by positive accepted N once, no automatic equal pair/order or monetary share."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "shared_assets"
    rule: "Use complete manufacture/maintenance/replacement/end-of-life and compatible actual used/lifetime drivers. Lifetime is observed history plus sourced evidenced remaining/termination with uncertainty/sensitivity/update; one asset-equivalent or lifecycle-complete provider view, never both or twice per-N."
    source_ids: []
  - rule_id: supply_stock
    applies_to: "operating supplies"
    rule: "Per actual native standalone SKU/state S=attributed opening+net external receipts-closing including retained recoveries. Gross-with-outlets uses S/N and actual matched usable external return; consumed-only uses (S-matched return)/N and OMITs that return exchange. Waste/loss retains production, internal loops stay stock, no unrelated/negative netting."
    source_ids: []
  - rule_id: original_boxed_gate
    applies_to: "merchandise"
    rule: "Trace actual complete originally boxed shoe-gate quantity assigned to accepted demand, actual proven discard/state-change shares, closing and useful returns/other exits using original unit/state/component-to-pair conversion and exclusive allocations. One missing or returned single does not automatically mean a whole-pair loss. Additional linked demand=actual required original-gate demand minus identical existing demand/loss coverage in baseline, compatible stages and state once outside service; assemble missing shoe components/assembly/boxing if only leather/PU material data exist. No age, moisture or nominal-pair-weight multiplier."
    source_ids: []
  - rule_id: receiver_views
    applies_to: "all actual outlets"
    rule: "Treat whole mixed shoe-pack waste, component audits, cleanup carrier plus absorbed contents and free liquid as non-additive physical views; actual receiver/treatment has one owner. Useful shoe/box returns remain merchandise audit, no automatic avoided-manufacture credit. Unknown stock/source/receiver scope blocks complete-chain use."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
