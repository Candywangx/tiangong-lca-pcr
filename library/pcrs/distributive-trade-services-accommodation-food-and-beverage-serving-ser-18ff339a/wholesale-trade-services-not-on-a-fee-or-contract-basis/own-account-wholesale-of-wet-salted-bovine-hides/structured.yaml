  calculation_rules:
    - id: per_consignment
      applies_to: "all inventory rows"
      rule: "Report attributed physical exchange quantity / N once; accepted_trade is 1 Item(s). N counts uniquely accepted consignments, not hide units."
      inputs:
        - "attributed quantity"
        - N
        - "linked protocol"
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: allocate_period
      applies_to: "electricity; external_jobs; freight; electricity_ac"
      rule: "Multiply measured complete period quantity by cohort compatible driver / all-consumer driver; sum disjoint periods and apply per_consignment."
      inputs:
        - "period quantity"
        - "cohort driver"
        - "all-consumer driver"
        - units
        - "coverage owner"
      output: "attributed physical quantity"
      source_ids: []
    - id: asset_equivalent
      applies_to: "warehouse_assets"
      rule: "Divide cohort compatible driver by actual complete lifetime driver to obtain asset equivalents; apply per_consignment. Use one asset-equivalent or one complete per-driver service representation."
      inputs:
        - "complete asset lifecycle"
        - "cohort driver"
        - "lifetime driver"
        - units
        - history
        - "evidenced remainder"
        - termination
        - cp_assets
      output: "attributed asset equivalents"
      source_ids: []
    - id: supply_stock
      applies_to: "liquid_diesel; hygiene_preparations; packing_material; usable_supply_return; hygiene_preparations_synthetic_detergent; packing_material_pe_film"
      rule: "S = assigned opening + external net receipts - closing including recovered closing. Use gross-with-outlets S and matched unused outward return OR consumed-only S minus matched return with the matched usable-return exchange OMITTED. Retain nonburned fuel waste/spill and actual combustion as separate fates."
      inputs:
        - opening
        - "gross receipts"
        - "receipt tare"
        - "net receipts"
        - closing
        - "usable external return"
        - "chosen representation"
        - burn
        - cp_fuel
        - cp_supplies
      output: "consistent upstream supply and nonadditive usable-return view"
      source_ids: []
    - id: hide_loss_link
      applies_to: "discarded_hides; discarded_hides_atomic_case"
      rule: "Map actual discarded hide quantities to the original commodity reference gate using lot/analytical salt-moisture-state and evidenced conversion. Quantify excluded upstream loss burden in the separate commodity chain with owner and once-only integration proof; no universal wet-to-green or collagen conversion."
      inputs:
        - "source lot"
        - "upstream gate and dataset"
        - "actual hide count and compatible mass"
        - "salt moisture free brine bases"
        - "conversion quantity/unit/basis/source"
        - "loss owner and already-included scope"
        - "integration result"
        - cp_trade
      output: "quantified separate original-gate commodity loss adjustment"
      source_ids: []
