allocation_rules:
  - rule_id: alloc_count
    applies_to: "all inventory"
    rule: "Attribute the real complete service burden to the actual accepted cohort N with causal period/lot drivers; retain failed,rejected,unfinished and cleanup responsibilities and define cross-period carry rather than divide by zero or delete activity. No price/margin-to-physical conversion."
    source_ids: []
  - rule_id: alloc_goods
    applies_to: "merchandise audit"
    rule: "Reconcile hide counts and state-compatible mass across opening,net receipts,buyer returns,closing,sales,supplier returns,downgrades and discards. A water or salt change is not automatically lost hide; collagen/organic hide-equivalent quantity requires its own actual definition and analysis, not dry mass by subtraction. Trace the quantified original-gate lost amount,conversion source,dataset,boundary owner and integration proof outside this service."
    source_ids: []
  - rule_id: alloc_stock
    applies_to: "service supplies and usable_supply_return"
    rule: "For each native supplied item, S = assigned opening + external net receipts - closing including recovered closing; obtain net receipts from measured gross/tare as appropriate. Internal issue is not another purchase. Choose gross-with-outlets S plus matched usable external return OR consumed-only S minus usable external return with the matched usable-return exchange OMITTED, and normalize once. Closing stock is not external return; nonreturned waste/spill retains upstream supply burden."
    source_ids: []
  - rule_id: alloc_assets
    applies_to: "warehouse_assets"
    rule: "Use complete manufacture,maintenance,replacement and end-of-life per actual asset. Cohort asset equivalents = cohort compatible driver / whole-life driver, across all users and periods; normalize by N once. Evidence may be observed lifetime or observed history plus evidenced remainder and termination, with driver units,source,sensitivity and updates. Alternative full-life per-driver services are not added to the same asset-equivalent view."
    source_ids: []
  - rule_id: alloc_period
    applies_to: "shared own/provider resources"
    rule: "For each reporting or cleaning/receipt/dispatch period, allocate actual complete resource quantity by cohort driver / all-consumer driver with compatible units and evidence; reconcile idle and changeover burdens and prevent repeating shared resources across overlapping consignments. Carry stock and lifetime responsibilities across periods once."
    source_ids: []
  - rule_id: alloc_reject
    applies_to: "rejects and outlets"
    rule: "Keep saleable downgrade/supplier return in merchandise audit; actual discarded hides are Waste only at documented receiver. Keep brine/salt/contact/packing streams separate and use actual disposal/recovery burden without automatic coproduct or avoided-material credit."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
