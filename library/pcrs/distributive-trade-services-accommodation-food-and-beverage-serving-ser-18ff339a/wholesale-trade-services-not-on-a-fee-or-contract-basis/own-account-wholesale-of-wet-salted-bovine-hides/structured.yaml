system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins with documented already-preserved hides received into wholesale ownership and ends at the declared accepted B2B handover. One node owns the bounded holding intervention: usable preserved intake condition, maintained actual condition and inspected buyer gate. This narrow route requires an actually operated and monitored ventilated holding intervention with contained drainage and inspected lot rotation; a passive label or unmonitored stockpile alone does not establish it. Additional cooling is included only if actually operated, never inferred solely from a wet-salted label. Cleaning/contact-material use, saline drainage containment, inspection rejects and all real service overhead are inside."
      source_ids: []
    - rule_id: scope_addon
      applies_to: "whole service"
      rule: "Exclude ALL traded-hide upstream production, including upstream burden of losses, from this additive service. Require a separate quantified original-gate lost-commodity adjustment and saleable-commodity burden exactly once in the linked commodity chain before whole-chain completeness. Include actual handling,treatment and service resources for losses here."
      source_ids: []
    - rule_id: scope_preserved
      applies_to: "salted_hide_trade"
      rule: "Document before/after hide condition, operated ventilation/contained-drainage intervention, condition monitoring and stock rotation, actual holding environment, inspection criteria and accepted gate. Sorting for trade is not tanning or manufacturing; actual new curing/soaking/trimming changes require explicit operation/scope review before final dataset."
      source_ids:
        - fao-hides-value-2009
        - jrc-hide-reception-2013
    - rule_id: scope_outlets
      applies_to: "actual inventory"
      rule: "Assign actual brine/drips,loose salt,damaged hides,packing and cleanup streams to their distinct origins and receivers. Contained wastes are not direct environmental emissions; actual abstraction/outfalls/substances must be expanded explicitly with real medium and no assumed zero."
      source_ids: []
    - rule_id: scope_overlap
      applies_to: "all responsibilities"
      rule: "Record once-only ownership for own equipment,external services,transport,temperature control and receiving treatment, including resources already embedded in an upstream provider or commodity dataset. Unknown coverage is a final-data blocker."
      source_ids: []
