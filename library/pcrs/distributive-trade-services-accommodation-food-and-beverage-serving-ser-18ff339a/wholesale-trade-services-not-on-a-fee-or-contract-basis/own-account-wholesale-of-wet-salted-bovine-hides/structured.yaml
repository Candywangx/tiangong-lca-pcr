    - id: q_identity
      applies_to: "all exchanges"
      requirement: "Before final exchange use verify exact concrete UUID,property/unit group and actual gate; unresolved semantics and support remain explicit."
      evidence: "Detailed compatibility and support evidence"
    - id: q_condition
      applies_to: "cp_trade"
      requirement: "Differentiate actual wet-salted state and grade from fresh,dry,tanned or newly re-cured product; record inspection and scope-change disposition."
      evidence: "Intake/gate/condition and operation records"
    - id: q_quantity
      applies_to: "merchandise and fluids"
      requirement: "Use measured counts,gross/tare/drained states,composition bases and actual outlets; never equate kg saline waste to kg collagen or fresh-hide input."
      evidence: "Calibrated weighing,analyses,draining and linked supplier conversion evidence"
