  calculation_rules:
    - id: service_normalization
      applies_to: "all inventory rows"
      rule: "Assign actual direct and evidenced shared quantities to actual consignments and periods using compatible all-consumer physical drivers. Divide attributable total by positive accepted N once; failed/rejected/cancelled attempts retain actual responsibility without adding accepted counts."
      inputs:
        - cp_consignment
        - cp_apples
        - cp_energy
        - cp_refrigerant
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual operational quantity per reference flow"
      source_ids: []
    - id: fruit_state_reconciliation
      applies_to: "fruit memorandum"
      rule: "Reconcile actual same-state net fruit and physical stock events: opening + external receipts + buyer returns - closing - physical dispatch - supplier returns - useful other exits - measured discarded fruit, with independently evidenced water/physiological/state changes kept as their own compatible physical views and unexplained residual investigated. Internal transfers cancel. Different wet-state masses cannot form a dry-matter or CO2 balance; gas uptake and substance fate require their own model if used."
      inputs:
        - cp_apples
        - cp_releases
      output: "Actual fruit stock/state reconciliation, not inferred species or production loss"
      source_ids: []
    - id: original_gate_demand
      applies_to: "fruit memorandum"
      rule: "Trace actual original-gate quantities from each lot to accepted consignments, closing stock, supplier/useful exits and actual attributed irrecoverable/state-change shares, using explicit original-state conversion evidence. Link the actual attributable original-gate quantity to the commodity dataset outside service; reconcile any identical loss already embedded in that baseline, adding missing demand only once. Do not set original-gate loss equal to present mass deficit, prescribe a generic multiplier or duplicate service waste treatment."
      inputs:
        - cp_apples
        - cp_consignment
      output: "Original-gate commodity quantity/loss interface outside service exchanges"
      source_ids: []
    - id: refrigerant_fates
      applies_to: "refrigerant_supply, recovered_refrigerant, spent_refrigerant and refrigerant_releases"
      rule: "On an explicitly common installed-system plus applicable-container boundary, opening inventory + actual external net receipts - closing inventory - usable external recovery - contained external waste - other documented external exits = balance requiring measured/evidenced release and uncertainty investigation. Internal charge/recovery cancels. Do not automatically label an unexplained balance leakage or use recharge alone as release. Exact blend-to-species conversion requires actual composition/fate evidence and is applied once; a complete species factor is not multiplied again."
      inputs:
        - cp_refrigerant
      output: "Actual supplied/recovered/waste/released fluid views per reference flow"
      source_ids: []
    - id: physical_species
      applies_to: "environmental_gases, respiration_releases and other_releases; respiration_releases_biogenic_co2_air; respiration_releases_vapour_air; other_releases_co2_fossil_air; other_releases_methane_fossil_air; other_releases_nitrous_oxide_air"
      rule: "Use actual species/medium measurement or a validated actual cultivar/state/temperature/time physical model with explicit substrate, intake/release roles, all operands and uncertainty. Fruit water loss and respiration are separate state effects, not mass-deficit labels. Actual combustion species use measured or fully reconciled burn and a compatible source-specific factor; do not turn total supply, cleaning chemistry or safety limit into emission quantity."
      inputs:
        - cp_apples
        - cp_energy
        - cp_releases
      output: "Actual identified intake and release quantities without overlap"
      source_ids: []
    - id: freight_quantity
      applies_to: "freight"
      rule: "For each actual kg*km leg multiply net load converted to kg by actual distance converted to km; preserve exact unit factors/sources, cold-chain resource scope and empty returns. If the actual provider uses another physical unit, retain its matching quantity and burden instead; no count/price proxy."
      inputs:
        - cp_freight
      output: "Actual compatible freight quantity per reference flow"
      source_ids: []
