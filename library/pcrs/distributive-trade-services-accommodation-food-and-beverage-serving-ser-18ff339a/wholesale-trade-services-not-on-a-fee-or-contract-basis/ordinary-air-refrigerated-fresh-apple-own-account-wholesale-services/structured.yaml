validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_service"
    rule: "Verify actual ownership resale, business buyer, unique accepted consignment N > 0 and all actual cultivar/grade/net mass/state/thermal-time/commercial qualifiers. Boxes, trucks and cancelled attempts cannot increase count."
    source_ids: []
  - rule_id: validate_preservation
    applies_to: "apple_cold_wholesale"
    rule: "Check usable before-state, actual ordinary-air cold-room intervention, maintained still-intact accepted after-state and all reject/loss/return exits with actual input roles. No CA/MA, chemical treatment, washing, processing or numeric regime inferred."
    source_ids: []
  - rule_id: validate_fruit
    applies_to: "fruit memorandum"
    rule: "Reconcile physical fruit/packaging states and actual original-gate assigned demand/loss coverage; resolve unexplained differences with compatible methods, never mass-deficit species. A missing commodity link blocks complete-chain readiness."
    source_ids: []
  - rule_id: validate_refrigerant
    applies_to: "refrigerant_supply, recovered_refrigerant, spent_refrigerant and refrigerant_releases"
    rule: "Check one installed/storage boundary, actual chemical/blend and every supply/stock/recovery/waste/transfer/release fate with uncertainty. No top-up or nameplate times default annual rate; no extra species fractions on complete factors."
    source_ids: []
  - rule_id: validate_real_exchanges
    applies_to: "all inventory rows"
    rule: "Every actual expanded native-unit exchange needs node-owned protocol and identity/state/receiver evidence; do not count inherited boxes as new supplies, reusable assets as new per-trip manufacture, or contained waste/water as direct emissions. Actual environmental input/gas/species roles require separate evidence, never silent zero."
    source_ids: []
  - rule_id: validate_allocation_period
    applies_to: "shared_assets and apple_cold_wholesale"
    rule: "Check all actual consumers/periods, actual lot campaigns/continuous room operation, idle/failed/cleaning attribution and full asset lifecycle/observed plus evidenced remaining service. One physical resource has one owner and one per-N normalization."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete identity and actual foreground completeness review"
  downstream_use: "Ordinary-air refrigerated apple wholesale-service add-on linked to separately matched commodity production/original-gate adjustment"
  allowed_use: "Actual merchant-owned intact fresh apple room-cooled/held consignment with matching cultivar/quantity/state/thermal-time and accepted commercial gate"
  excluded_use: "Standalone apple footprint or orchard production; all-fruit average; CA/MA/fruit treatment/processing/retail/agency; monetary service proxy; full-chain claim without actual commodity adjustment"
  required_metadata: "Actual merchant/site/room/period/lot/consignment, ownership, cultivar/grade, net fruit/tare/moisture/state, received/maintained temperature/humidity/time/quality, actual package/refrigeration/provider/freight/treatment scope and commodity-link owner/status"
  required_quality_disclosure: "Concrete identities/support and unresolved actual data, stock/state/physiology and refrigeration uncertainty, all-consumer/full-life asset assumptions, missing coverage/methods and independent range limits"
  update_trigger: "Changed actual cultivar/grade/room/atmosphere/route/gate, cooling/quality evidence, refrigerant/asset/provider scope, packaging, loss-state/commodity coverage or recording method"
data_sources:
  - id: "unsd-cpc3-fruit-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 explanatory notes, division61/subclass61021 (30 June 2025). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Own-account fruit/vegetable wholesale classification only; this intact refrigerated apple service is a narrower subset."
  - id: "fao-temperature-humidity"
    type: "official_guidance"
    reference: "FAO, Small-Scale Postharvest Handling Practices: A Manual for Horticultural Crops, section6 Temperature and relative humidity control. https://www.fao.org/4/x5403e/x5403e08.htm"
    used_for: "Qualitative room refrigeration, respiration/water-loss and cultivar/chilling-state questions; no temperature, energy, duration, physiological factor or shelf-life value adopted."
  - id: "fao-horticultural-storage"
    type: "official_guidance"
    reference: "FAO, Small-Scale Postharvest Handling Practices: A Manual for Horticultural Crops, section7 Storage of horticultural crops. https://www.fao.org/4/x5403e/x5403e09.htm"
    used_for: "Actual received quality, circulation/humidity and co-storage compatibility questions; numeric storage tables and CA examples are not this route defaults."
