  calculation_rules:
    - id: normalize
      applies_to: "all service rows"
      rule: "Assign actual direct and compatible all-user shares, retaining failed/rejected/unfinished/idle activity; divide assigned actual cohort total by positive accepted N only once."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference inventory"
      source_ids: []
    - id: whole_part_stock
      applies_to: "merchandise"
      rule: "Reconcile actual same-state fixture/part/package stocks separately: opening+external receipts+buyer returns-closing-physical dispatch-supplier returns-useful other exits-actual discard=unexplained residual. Pair internal movements and map included parts to complete fixture, keeping separately sold items outside that completeness definition. Independently reconcile actual net/gross/tare/state with uncertainty; missing one part or pack damage cannot identify whole-fixture loss or emissions."
      inputs:
        - cp_luminaires
      output: "Audited actual whole-part/pack state and fates"
      source_ids: []
    - id: source_assignment
      applies_to: "merchandise interface"
      rule: "Map actual complete original boxed-fixture gate quantities to accepted-demand and exclusive proven discard/state-change, closing/useful return/other-exit shares in original units/state. Any whole-part conversion and assignment/baseline/additional demand unit/state/source require actual evidenced compatibility and exclusive drivers. Additional linked demand accounts for identical existing stage/loss coverage once outside service; missing fixture assembly/boxing beyond module/material predecessors assembled outside."
      inputs:
        - cp_luminaires
        - cp_consignment
      output: "Explicit separately linked complete original-gate demand"
      source_ids: []
    - id: transport_quantity
      applies_to: "freight"
      rule: "Actual kg*km=actual included fixture/components/packing/tare cargo converted to kg×real distance converted to km with source factors/bases and non-overlap provider/shared scope once. Other native freight units retain exact supporting service."
      inputs:
        - cp_freight
      output: "Actual native freight per reference"
      source_ids: []
    - id: release_evidence
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Use actual species/medium measurement or compatible actual activity/burn and source-specific factor with required composition/fate/concentration/gas pressure/temperature conversions once. A complete factor is not multiplied again. An unpowered fixture label, broken part or unknown mass deficit provides no species amount."
      inputs:
        - cp_releases
        - cp_energy
        - cp_luminaires
      output: "Actual evidenced species per reference"
      source_ids: []
