validation_rules:
  - rule_id: accepted_gate
    applies_to: "accepted_service"
    rule: "Verify actual ownership resale and unique positive accepted consignment count with scientific species, complete frozen/glazed/sealed supplier gate, netfish/glaze/pack/time and actual buyer acceptance. Duplicate packs/invoices and cancelled attempts never add accepted count."
    source_ids: []
  - rule_id: frozen_node
    applies_to: "frozen_cod_wholesale"
    rule: "Check the usable before-state, actual freezer intervention, maintained still-frozen/sealed accepted after-state and all actual reject/return/disposal exits. No new glazing/repacking/thaw-refreeze/cutting or automatic normal release after thermal/seal failure."
    source_ids: []
  - rule_id: component_and_loss
    applies_to: "fish/glaze/pack memorandum"
    rule: "Reconcile actual same-state packs, sampled/verified components, stock/return/discard and original supplier-gate demand with existing loss/stage coverage. No glaze loss=lost net fish, no mass deficit=waste/species, no inherited glaze=new utility."
    source_ids: []
  - rule_id: fluid_and_returns
    applies_to: "all refrigerant and usable-return roles"
    rule: "Check common stock boundary and every actual fluid fate/receiver, original upstream owner and matched same-scope supply; no factory recovery against unrelated makeup, no negative input and no extra return exchange under consumed-only."
    source_ids: []
  - rule_id: real_exchanges
    applies_to: "all inventory rows"
    rule: "Require actual native-unit identity/state/protocol/receiver for each expanded exchange. Separate whole food-pack waste from component audit, vapour from outfall/contained water and new service packaging from inherited primary product pack; each physical burden has one owner."
    source_ids: []
  - rule_id: asset_provider_period
    applies_to: "shared_assets and frozen_cod_wholesale"
    rule: "Verify all actual consumers/periods, continuous cold room versus consignment/campaign events, complete asset manufacture/maintenance/replacement/EOL and compatible used/lifetime drivers with observed/evidenced remainder. Direct/provider cold/freight/treatment scopes and single per-N normalization must not overlap."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete exchange identity and actual foreground completeness review"
  downstream_use: "Frozen cod-fillet wholesale-service add-on linked to separately complete supplier-gate frozen/glazed/primary-packed commodity and actual assigned demand/loss coverage"
  allowed_use: "Actual maintained-frozen sealed Gadus morhua fillet wholesale consignment with matching netfish/glaze/package/thermal-time/commercial gate"
  excluded_use: "Standalone fillet footprint; live/caught fish or primary processing/freezing/glazing/repacking; all-seafood average; retail/agency/storage-only; universal fish-safety testing factor or whole-chain claim with missing supplier stages"
  required_metadata: "Actual species/fillet/lot/merchant/freezer/period/consignment/ownership, supplier release and complete gate, actual netfish/glaze/pack/sample bases, thermal/seal/acceptance, refrigeration/assets/provider/freight/treatment scope and commodity-adjustment owner/status"
  required_quality_disclosure: "Actual identity/support gaps, supplier and component sampling/state uncertainty, unresolved thermal/fate/receiver/method coverage, all-consumer full-asset assumptions and independent range limitations"
  update_trigger: "Changed species/presentation/supplier gate/glaze/pack/frozen state, thermal/acceptance criteria, processing/repacking need, source-stage/loss coverage, refrigeration/assets/provider scope or measurement/sample method"
data_sources:
  - id: "unsd-cpc3-seafood-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes, division61/subclass61024 (30 June 2025). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: frozen prepared/preserved fish can be wholesaled in this leaf; selected cod fillet route is narrower, not live-fish production."
  - id: "codex-frozen-fillets-190"
    type: "standard"
    reference: "Codex Standard for Quick Frozen Fish Fillets, CODEX STAN190-1995, source amendments2011/2013/2014, §§6.2 and7.3/7.3.1. https://www.fao.org/input/download/standards/115/CXS_190e.pdf"
    used_for: "Net food versus glaze/packaging and representative sample/physical state distinctions; historical source, no copied numeric temperature/AQL/histamine/testing-every-pack default."
  - id: "fao-frozen-fish-after-freezing"
    type: "official_guidance"
    reference: "FAO, Freezing and refrigerated storage in fisheries, chapter6 Treatment of fish after freezing, §§6.1/6.2. https://www.fao.org/4/v3630e/v3630e07.htm"
    used_for: "Inherited glaze protection/sublimation versus tissue dehydration and primary/secondary/tertiary packaging; glazing heat/removal is upstream here, no glaze percentage or universal storage rate adopted."
