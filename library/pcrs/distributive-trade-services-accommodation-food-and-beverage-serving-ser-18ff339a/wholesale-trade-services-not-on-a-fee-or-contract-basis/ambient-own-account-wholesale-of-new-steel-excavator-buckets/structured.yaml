  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "Per reference inventory=actual assigned native physical quantity/positive N. N is unique source-verified FINAL owned-resold business acceptance after reversal,not receipt or bucket/member count. At N=0 retain actual duties and disclose no normalized result."
      inputs:
        - "actual native duty quantities"
        - "final gate/reversals"
      output: "native quantity per1 Item(s) service"
      source_ids: []
    - id: shipping_mass_members
      applies_to: "nonexchange merchandise"
      rule: "Unique complete net bucket mass=sum actual unique shipped parent/child packages(gross-external pack/support tare),using actual EACH repeat count once or TOTAL unchanged. Count included loose teeth/adapters/edges/pins/coupler once within actual supplier-defined complete SKU;do not add parent and member mass. Intentional finish/preservative is product,not transport tare. Internal bucket capacity cannot convert to steel mass or actual soil payload."
      inputs:
        - cp_buckets
        - "native count/gross/tare/member/BOM evidence"
      output: "unique complete SKU netmass/member audit"
      source_ids: []
    - id: original_source
      applies_to: "commodity outside service"
      rule: "Use direct trace OR assigned_source=original_gate_quantity*numerator_driver/positive complete source_all_exit_driver. Record every exclusive terminal demand including closing/unsold/damaged retained,useful-other,returns and actual whole/part/mixed/liquid losses,each compatible native unit/basis/method/state/time/source/owner/original-source link and numerator membership. No accepted-only denominator. Match original/assigned/loss/baseline-covered/additional finished-SKU state quantities/conversions and coverage owner;complete additional uncovered source demand integration outside service once."
      inputs:
        - cp_buckets
        - "complete source terminal/coverage/conversion records"
      output: "completed external original-gate demand/loss integration"
      source_ids: []
    - id: content_fate
      applies_to: "actual stock and fates"
      rule: "Audit original source contents to retained accepted/returned/closing,retained wholeWaste/partWaste/mixedWaste,independent useful/nonusable/liquid exports and actual direct species plus explicit unknown. Every term native unit/basis/method/state/time/source/conversion;retained contents do not add physical outlets. Separate actual new contaminants/water/oxide from original steel/finish state equivalent with supported chemistry;no rustkg=steelkg,automatic O2input or deficit=release. Real wet/dry moisture conversion only matching definitions/native factors in cp_fates."
      inputs:
        - cp_buckets
        - cp_fates
        - cp_water
        - cp_species
        - "linked carrier records"
      output: "exclusive source/receiver physical closure"
      source_ids: []
    - id: supplies_assets
      applies_to: "independent supplies and assets"
      rule: "Supply S=opening+net_receipts-closing,NET receipts exclude container tare,retained closing/recovery counted once. Gross input S with separately recorded matched unused output OR consumed S-return input OMIT output. Asset allocation=full_life_burden*compatible cohort_used_driver/complete_lifetime_driver;complete life=observed_history_driver+sourced remaining_driver OR evidenced terminated total over all users/periods. Every equivalent/driver/burden has native metadata;positive compatible denominator,uncertainty/sensitivity/update required."
      inputs:
        - cp_supplies
        - cp_assets
        - "native stock/lifetime histories"
      output: "assigned net supplies and full-life asset burden"
      source_ids: []
    - id: freight_sum
      applies_to: "packed_freight"
      rule: "Freight=sum unique load+leg[(converted actual payload OR converted gross-noncargo tare,retaining cargo supports/pack)*(actual sourced repeat count only for EACH;TOTAL unchanged)*converted actual distance*THAT record physical causal share]/positive N. Each independent operand has native unit/basis/method/state/time/source/conversion. Share inside each summand,N once,parent-child cargo and provider-covered/empty legs exclusive;capacity not actual load."
      inputs:
        - cp_freight
        - "unique native load-leg/driver records"
      output: "actual kg*km per1 Item(s) service"
      source_ids: []
