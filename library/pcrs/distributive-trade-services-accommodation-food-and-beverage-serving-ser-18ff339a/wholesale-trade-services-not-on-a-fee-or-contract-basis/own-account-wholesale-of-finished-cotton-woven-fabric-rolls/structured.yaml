validation_rules:
  - rule_id: accepted_count
    applies_to: "accepted_service"
    rule: "Verify actual merchant resale final positive accepted consignment N and every physical qualifier; no roll/metre/m2/kg equivalence."
    source_ids: []
  - rule_id: roll_compatibility
    applies_to: "merchandise"
    rule: "Check actual length/full-or-usable-width/selvage, net/core/wrap tare, moisture/temperature/conditioning/sample/GSM method and matched conversion; inconsistent basis or nonrepresentative swatch cannot establish lot mass."
    source_ids:
      - astm-woven-length
      - astm-fabric-width
      - astm-fabric-gsm
  - rule_id: route_exits
    applies_to: "fabric_wholesale"
    rule: "Require actual accepted/rejected/damaged/sample/return/downgrade/discard state and receiver; do not silently introduce cutting/rerolling or count unresolved rejected roll as accepted."
    source_ids: []
  - rule_id: upstream_interface
    applies_to: "merchandise"
    rule: "Match complete actual finished original-gate states/assigned demand/conversions/closing/useful exits and identical already-covered losses once outside; cotton/lint/yarn alone is insufficient."
    source_ids: []
  - rule_id: all_period_owners
    applies_to: "all service obligations"
    rule: "Enumerate all users/periods/events, complete asset phases and compatible used/lifetime drivers with observed/evidenced remainder. Failed and unfinished work retains burden; no double provider, treatment, freight, per-N or return credit."
    source_ids: []
  - rule_id: physical_evidence
    applies_to: "all rows"
    rule: "Require actual native quantities, receiver and source/unit/basis conversion and species proof; omit matched return under consumed-only and retain non-additive whole-roll/component/water/species views."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after identity and actual completeness review"
  downstream_use: "Finished original-roll cotton woven wholesale add-on linked separately to complete finished-fabric supplier gate and actual assigned demand/loss"
  allowed_use: "Actual merchant-owned ambient original-roll finished cotton woven consignment with compatible dimensions/mass/conditioning and actual buyer acceptance"
  excluded_use: "Standalone fabric footprint; cotton/lint/yarn or knitted/special fabric; manufacturing/cutting/rerolling; paid-test compliance recipe; agency/retail/storage-only"
  required_metadata: "Actual SKU/composition/weave/finish/roll/lot/merchant/buyer/site/period, length/width/selvage/area/net/tare/GSM/moisture/conditioning/sample/defect/acceptance, finished gate and demand/loss owner, actual provider/asset/freight/treatment scope"
  required_quality_disclosure: "Actual flow/support gaps, dimensional/conditioned mass/sample representativeness and range uncertainty, missing upstream stages/baseline loss coverage, unexplained stock/fates and all-user/lifetime assumptions"
  update_trigger: "Changed fibre/finish/presentation/measurement/sample/state/acceptance or processing, dedicated preservation, supplier gate/loss interface, asset/provider/freight/treatment responsibilities"
data_sources:
  - id: "unsd-cpc3-fabric-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30 June2025), printed pages301–302,61031/group266. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: cotton woven fabric merchant service is a narrower yarn/fabrics wholesale subset."
  - id: "astm-woven-length"
    type: "standard"
    reference: "ASTM D3773/D3773M-10(2024), public publisher abstract/scope only. https://store.astm.org/d3773_d3773m-10r24.html"
    used_for: "Full rolls/bolts and actual length-method distinction; no paid procedure or obligatory wholesale remeasurement adopted."
  - id: "astm-fabric-width"
    type: "standard"
    reference: "ASTM D3774-18(2024), public publisher scope only. https://store.astm.org/d3774-18r24.html"
    used_for: "Full/usable width and declared selvage/roll-or-specimen extent; no universal width, sampling or conditioning values."
  - id: "astm-fabric-gsm"
    type: "standard"
    reference: "ASTM D3776/D3776M-20(2025), public publisher abstract/scope only. https://store.astm.org/d3776_d3776m-20r25.html"
    used_for: "Mass-per-area, specimen/conditioning/selvage basis and limited small-swatch representativeness; actual adopted complete method/lot evidence required, no fixed GSM."
