allocation_rules:
  - rule_id: direct_shared
    applies_to: "all service rows"
    rule: "Attribute direct event use first; shared warehouse/handling/support requires evidenced compatible physical drivers across ALL consumers/periods, including rejected/unfinished/idle use. Divide attributed total by actual positive accepted N once, no default equal rolls/revenue share."
    source_ids: []
  - rule_id: asset_life
    applies_to: "shared_assets"
    rule: "Use complete manufacture/maintenance/replacement/end-of-life, compatible actual used/lifetime driver with observed history plus evidenced remaining/termination, uncertainty and sensitivity. One asset-equivalent fraction or lifecycle-complete provider service, never both or double per-N division."
    source_ids: []
  - rule_id: stock_returns
    applies_to: "operating supplies"
    rule: "For actual native standalone SKU/state S=attributed opening+net external receipts-closing. Choose exactly one: (1) gross S/N as INPUT and actual matched usable external return/N as a separate OUTPUT; (2) consumed-only (S-matched usable return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice. Retained recovery stays closing, waste/loss retains upstream burden, no unrelated/negative netting."
    source_ids: []
  - rule_id: finished_gate
    applies_to: "merchandise"
    rule: "Trace actual complete finished-roll original-gate quantity assigned to accepted consignments and proven discard/state-change shares, closing and useful returns/other exits, with original unit/state and evidenced conversions. Additional linked demand=actual required gate demand minus identical already-covered demand/loss in baseline, matching stage/state/extent once outside service. Missing spinning/weaving/finishing from cotton/lint/yarn-only upstream must be assembled outside; no universal GSM, moisture/shrinkage or defect-to-loss multiplier."
    source_ids: []
  - rule_id: exit_owner
    applies_to: "all outlets"
    rule: "Actual receiving treatment must have one owner; whole discarded-roll/component views cannot duplicate waste. Useful goods returns/downgrades remain merchandise audit, no automatic avoided manufacture credit. Unknown original-gate or receiving scope blocks full-chain readiness."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
