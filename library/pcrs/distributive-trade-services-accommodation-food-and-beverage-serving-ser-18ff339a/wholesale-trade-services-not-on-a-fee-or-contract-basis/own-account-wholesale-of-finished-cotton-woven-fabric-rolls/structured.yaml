        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference service quantity"
      source_ids: []
    - id: dimension_mass
      applies_to: "roll audit"
      rule: "For compatible actual same-state/extent segments, area=sum(length_i×included_width_i) after actual conversions to m. Keep full and usable/selvage area separate. Net fabric mass=gross roll minus actual core/wrap/other tare. Area×measured GSM converts to mass only when specimen/lot/selvage/conditioning basis and unit factor agree; otherwise preserve distinct measurements and discrepancy, no default density/GSM/regain."
      inputs:
        - cp_rolls
      output: "Actual roll length/area/net mass with compatibility and uncertainty"
      source_ids:
