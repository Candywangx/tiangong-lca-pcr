  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "q=attributed actual physical quantity / positive N once;reference accepted_service is 1 Item(s). N is unique FINAL source-verified merchant-owned/resold B2B acceptance after reversals,not supplier receipt. Canceled/reversed/failed/unfinished resources retain actual period/cohort responsibilities;N=0 means do not divide."
      inputs:
        - "actual attributed quantity"
        - "verified final N"
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: net_roll_area_mass
      applies_to: "nonexchange roll stock"
      rule: "For each unique original parent roll,use compatible source-verified net width*full length (converted native length units once) for actual area,or documented directly measured source area; do not unroll by assumption. Net layered-flooring mass=actual gross roll mass-actual core tare-actual other external packing tare on compatible native bases. Alternatively area*actual matched construction/state areal mass with documented unit conversion/source and uncertainty. EACH measurement multiplies actual count once;TOTAL remains total. Backing/wear layers remain flooring,not tare;layer/content views are nonadditive. Nominal thickness*generic PVC density cannot replace actual areal mass/BOM."
      inputs:
        - "unique parent roll"
        - "width/length/area/arealmass/gross/core/pack native units"
        - bases
        - methods
        - state
        - time
        - sources
        - "EACH/TOTAL"
        - cp_rolls
      output: "nonduplicated net flooring area and composite mass audit"
      source_ids: []
    - id: original_gate_assignment
      applies_to: "commodity outside service"
      rule: "Original assigned source quantity is directly traced/measured with evidence OR original gate quantity * compatible cohort driver / positive complete all-terminal driver sum. Record each competing accepted transfer,closing/unsold/damaged retained,useful other exit,return and actual whole/part/mixed loss with native quantity/unit/basis/method/state/time/source,owner,original lot/cohort/period/conversion/exclusivity and numerator links. All refer to same compatible complete source cohort;no accepted-only denominator or intermediate movement twice."
      inputs:
        - "actual original quantity/unit/state/source"
        - "direct evidence OR compatible source cohort and complete terminal records"
        - "allocation/conversion/native units/bases/methods/sources/owners"
        - "assigned quantity/loss/coverage/integration"
        - cp_rolls
      output: "assigned complete finished-roll source demand/loss outside add-on"
      source_ids: []
    - id: supply_stock
      applies_to: "independent supplies"
      rule: "S=attributed opening+true external net receipts-closing including recovered retained supplies. Gross INPUT S with separate matched same-scope unused external OUTPUT OR consumed INPUT S-return with that OUTPUT omitted. No numerical S+return,double credit,new receipt from internal recovery or removal of nonreturned waste upstream burden. Inherited core/pack never reduces unrelated current supplies."
      inputs:
        - opening
        - "external net receipts"
        - "recovered closing"
        - "same-scope matched unused outward"
        - "chosen convention"
        - cp_supplies
      output: "nonduplicated supply and return quantities"
      source_ids: []
    - id: full_life_share
      applies_to: "assets and resources"
      rule: "Resource share uses compatible actual cohort/all-user causal drivers. Asset equivalents use actual job/cohort used driver / complete all-user all-period lifetime driver,observed/history+sourced remaining use/termination. Every operand has native unit/basis/method/state/time/source and compatible conversion;full manufacture/maintenance-cleaning/replacements/EOL,uncertainty/sensitivity/update included. Complete provider replaces matching own scope."
      inputs:
        - "job/cohort used"
        - "allusers observed/history"
        - "sourced remaining/termination"
        - "complete lifetime"
        - "native equivalence units/bases/methods/sources"
        - cp_assets
      output: "attributed complete asset equivalents/resources"
      source_ids: []
    - id: packed_load_leg_sum
      applies_to: "packed_freight"
      rule: "Sum over unique load_id+leg_id [(actual compatible packed payload kg)*(actual count ONLY if EACH,otherwise 1)*(actual converted distance km)*(THAT record actual causal share)] / positive N. TOTAL load unchanged. Payload is directly measured actual cargo OR compatible gross minus evidenced vehicle/noncargo tare;retain actual shipped core,wrapping and cargo supports. Gross/tare/payload/distance/count each has independent native unit,basis,method,state,time,source and compatible conversion factor/unit/source. Per-record share derived from actual compatible cohort/all-user drivers stays inside each summand,N once. Never add parent roll and its layers/core/pack again if already in gross cargo."
      inputs:
        - "unique load/leg"
        - "EACH/TOTAL"
        - count
        - "gross/noncargo tare/direct payload and actual cargo support/pack"
        - "distance/conversions"
        - "per-record causal drivers/share"
        - N
        - cp_freight
      output: "kg*km per service reference"
      source_ids: []
