validation_rules:
  - rule_id: preservation_gate_check
    applies_to: "accepted_service"
    rule: "N>0 unique accepted merchant consignments, actual inspected completed-primary-chilled before-state and maintained chilled buyer gate, real carcass net quantities/tare/IDs and full temperature/time/condition records. Half count/kg/invoice/rail transfer is not service reference."
    source_ids: []
  - rule_id: excluded_processing
    applies_to: "all scope"
    rule: "Check no disguised primary-chill completion, cutting/deboning/freezing/thawing/deliberate ageing or other processing. Natural postmortem change is not asserted absent; actual history and acceptance criteria govern. Outsourced processing needs separate route review."
    source_ids: []
  - rule_id: carcass_and_loss
    applies_to: "merchandise and outlets"
    rule: "Reconcile actual body/tare/state and matched stocks/returns/closing/internal transfers, real drips/evaporation/discard and unresolved shrink. Confirm compatible original-gate loss adjustment occurs once outside service; no default loss zero or shrink=discarded meat/pollutant."
    source_ids: []
  - rule_id: cold_and_lifecycle
    applies_to: "all consumers/periods/providers/assets"
    rule: "Validate real hook/space-time or justified thermal/mass driver and units, full consumers/idle/cleaning coverage and one owner for direct/provider/transport/treatment. Asset complete manufacture/charge/maintenance/replacement/end-of-life with remainder/source uncertainty; no duplicate normalization or new-supply return subtraction."
    source_ids: []
  - rule_id: refrigerant_and_water
    applies_to: "all fluids and direct_species"
    rule: "Separate new supplies, installed charge, unused new returns, recovered retained/recharged/useful-exported fluid, dedicated unusable recovered refrigerant Waste and other actual spent waste and actual releases. Top-up is not emission. Distinguish contained cleaning effluent, drip/condensate/defrost and direct outfall; species/medium/factor/composition/fate independently evidenced and nonadditive."
    source_ids: []
  - rule_id: bilingual_projection
    applies_to: "all cards/rules/protocols"
    rule: "Raw bilingual six reference fields, actual output card link/name, row properties/units/evidence/protocol raw operands, source URLs and ordered rules must align with generated canonical projection. Automated consistency does not verify actual food quality or final exchange identity."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after complete actual foreground collection and concrete exchange verification"
  downstream_use: "Cold-preservation own-account wholesale-service add-on linked once to a separate original-gate carcass commodity system with compatible measured loss adjustment; not a whole delivered beef footprint."
  allowed_use: "The declared inspected primary-chilled bovine half-carcass merchant room/rail/consignment and actual accepted buyer gate, with real body quantities/tare, conditions/times and physical resource scope."
  excluded_use: "Live cattle or slaughter/primary-chilling manufacture; boneless cuts/offal as reference; deliberate ageing/cutting/freezing/thawing; fee agency/retail/standalone warehousing; safety/shelf-life guarantee or untracked loss interface."
  required_metadata: "Merchant ownership/site/room; carcass/source/consignment/cohort/period; inspection and completed-primary-chill release; gross/tare/body mass/bone-in state and halves; actual slaughter/receipt/hold/dispatch/acceptance times and core/surface conditions; real all-user cold/rail/provider/carrier/asset/refrigerant/water/waste scope; original-gate loss quantity/state/unit/source/sole owner and existing coverage"
  required_quality_disclosure: "Probe/scale calibration and actual accepted criteria; natural condition change, excursions and unknown shrink investigation; all-consumer physical driver rationale and full asset/provider/period coverage; actual circuit supply/charge/recovery/fate and species evidence; actual effluent/drip/treatment and compatible commodity-loss link; identity and numerical range gaps"
  update_trigger: "Changed received carcass/chill state, buyer criterion/condition or product history; added processing/ageing; changed room/cooling/circuit/rail/asset life/provider/carrier/water hygiene route; observed loss/excursion/release evidence or material source change"
