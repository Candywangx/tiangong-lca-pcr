allocation_rules:
  - rule_id: causal_service_share
    applies_to: "foreground_burden_allocation"
    rule: "Direct actual event-to-consignment trace, else supported physical handling/space-time causal drivers over every consumer/period including idle/open/reject work. documented_share=numerator_driver/denominator_driver, native compatible basis and positive denominator. No automatic bale count, wet mass, price or assumed fibre-yield share."
    source_ids: []
  - rule_id: prior_secondary_burden
    applies_to: "foreground_burden_allocation"
    rule: "Record the reviewed prior-system treatment at actual recovery handoff: method, decision/source/owner/time, included/excluded prior product and collection/preparation stages, burden_transfer_quantity/native basis and prior_burden_dataset_link/coverage. Preserve that treatment across carry and final delivery. Prior-system burdens or credits already assigned to prior product or buyer must not also enter the service or source link. No universal all-virgin or zero-burden default."
    source_ids: []
  - rule_id: original_source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Use actual direct source-target trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers only from positive complete compatible all-terminal records incl final closing/useful-other exits/returns/proven loss, each native quantity/unit/basis/method/state/time/source/link/owner. commodity_source_gate_demand=assigned_source_gate_quantity at original sorted-baled/pack state including evidenced state-change share, not final shipped mass+discard. Internal closing-opening carry preserves original source quantity/state/owner, never new source demand or duplicate terminal driver. Native baseline/additional/loss coverage outside once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: net_supply_returns
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing including retained recovery; receipts are actual NET materials excluding supply-container tare. Gross INPUT S/N plus separately matched actual usable unused OUTPUT OR consumed-only (S-usable_outward_return)/N and OMIT matching return exchange. Same-scope standalone supply only, no inherited OCC/wire/pack deduction or second credit."
    source_ids: []
  - rule_id: complete_life_assets
    applies_to: "foreground_burden_allocation"
    rule: "Full manufacture/maintenance/replacement/retirement/EOL attributed by compatible job_driver/lifetime_all_user_driver. Lifetime=observed all-user use+sourced remaining service, all consumers/periods/native equivalence/uncertainty/sensitivity/update; provider/carrier one owner and total/N once. No new support per bale."
    source_ids: []
  - rule_id: unique_freight_receiver
    applies_to: "foreground_burden_allocation"
    rule: "Each unique load+leg its documented_service_share=numerator_driver/denominator_driver INSIDE SUM then /N once. Cargo actual wet bale/wire/staples/nonpaper/pack/support on exclusive measured membership; EACH compatible count once/TOTAL unchanged, only true noncargo tare excluded. Receiver transport/treatment and whole/component views one owner once, no automatic recovery or avoided-production credit."
    source_ids: []
