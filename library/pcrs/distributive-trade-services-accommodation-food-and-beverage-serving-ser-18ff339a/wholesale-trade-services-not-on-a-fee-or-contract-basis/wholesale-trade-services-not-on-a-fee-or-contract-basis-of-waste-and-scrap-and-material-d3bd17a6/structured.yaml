  calculation_rules:
    - id: completed_count
      applies_to: "cp_occ"
      rule: "N=count_unique_final_owned_resold_B2B_acceptances_after_reversals. Actual merchant ownership/resale, industrial business buyer/final gate/source/reversal required, N>0 before division. Opening/closing carry not a new N; open/rejected/reversed resources stay in real periods/cohorts."
      inputs:
        - "Actual ownership/buyer/acceptance/reversal/time/bale records"
      output: "Unique completed service denominator N"
      source_ids: []
    - id: wet_bale_components
      applies_to: "cp_occ"
      rule: "Use actual bale_gross_mass/net_received_OCC_mass/external_pack_tare with declared wire/staple/nonpaper/water scope. EACH compatible mass*actual_count once/TOTAL unchanged, actual native units/conversions. Do not subtract wires twice or assume gross minus binding equals dry paper. Commercial useful OCC exits remain nonexchange stock/source records, not extra service-product exchanges."
      inputs:
        - "Actual bale count/native gross-net/member/pack measurements"
      output: "Qualified as-received OCC and component ledger"
      source_ids: []
    - id: water_nonwater
      applies_to: "cp_occ"
      rule: "dry_nonwater_mass=wet_sample_mass*(1-w_wet), only actual water/as-received wet mass fraction on identified same sample/component. Compatible same-definition dry water/nonwater ratio converts w_wet=w_dry/(1+w_dry), after actual percent_to_ratio_factor. Ambiguous humidity or LOD with other volatiles not water fraction. Dry nonwater still includes nonpaper/wires where sampled; dry_paper_mass needs independent component evidence, no assumed fibre yield or merchant opening/sorting."
      inputs:
        - "Actual sample/component water definitions/native quantities/method/state/source/time"
      output: "Water and dry-nonwater audit, distinct from actual dry paper/yield"
      source_ids: []
    - id: original_source_demand
      applies_to: "cp_occ"
      rule: "Actual direct trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers using positive complete compatible final-terminal native records incl final closing/useful-other/returns/proven loss. commodity_source_gate_demand=assigned_source_gate_quantity at original sorted-baled/pack state including evidenced state-change share; not dispatch+discard. One cohort horizon, internal closing-opening pair carries carry_original_source_quantity/state/source/owner unchanged, not new source demand, N or two terminal drivers. Quantify baseline_quantity/additional_stage_quantity/loss_adjustment_quantity with original basis, coverage/owner once outside.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "Actual original source/all-terminal/carry/native baseline/additional/loss records"
      output: "Exclusive original sorted-baled commodity demand/loss"
      source_ids: []
    - id: secondary_integration
      applies_to: "cp_occ"
      rule: "Actual origin/recovery handoff and reviewed cutoff_or_inheritance_decision govern prior_burden_dataset_link/coverage and burden_transfer_quantity, neither automatic full virgin-box nor zero/credit. ACTUAL missing collection/sort/bale/pack stages/additional demand MUST be integrated outside service exactly once before complete-chain use; completed status/dataset-link/timezone/source/owner/integrated native quantity and stage/loss/once evidence required, pending plan insufficient. Prior/current/buyer duplicate exclusion retained."
      inputs:
        - "Actual prior-system decision/handoff and completed integration records"
      output: "Completed linked secondary-source treatment without duplicate burden"
      source_ids: []
    - id: utility_share
      applies_to: "cp_utilities"
      rule: "documented_share=numerator_driver/denominator_driver on positive compatible native all-consumer causal basis. utility_per_service=sum(actual_utility_quantity*documented_share)/N after real interval/conversion/provider exclusions; no baler/pulping/recycling factor."
      inputs:
        - "Actual meter/native share/conversion/coverage"
      output: "Actual warehouse kWh and conditional site water m3 per service"
      source_ids: []
    - id: net_supply_stock
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing with retained recovery, receipts actual NET material excluding containers. Gross S/N INPUT plus separate paired usable unused OUTPUT OR consumed (S-usable_outward_return)/N INPUT and OMIT matching return exchange. EACH count once/TOTAL unchanged, sourced per-piece/density conversion, documented_share=numerator_driver/denominator_driver; no inherited wire/paper credit."
      inputs:
        - "Actual NET supply stock/native conversions/paired return/share drivers"
      output: "Exclusive actual supplied/consumed material convention"
      source_ids: []
    - id: provider_share
      applies_to: "cp_provider"
      rule: "provider_per_service=sum(actual_native_package_quantity*documented_share)/N with actual physical_equivalence/coverage. documented_share=numerator_driver/denominator_driver, own native units/basis/method/state/source/time and positive compatible denominator, not price or assumed pulp yield."
      inputs:
        - "Actual package/equivalence/coverage/native shares"
      output: "Actual disjoint physical contracted service"
      source_ids: []
    - id: asset_lifetime_share
      applies_to: "cp_assets"
      rule: "lifetime_all_user_driver=observed_all_user_driver+remaining_driver after native compatibility/equivalence and sourced remainder. Apply job_driver/lifetime_all_user_driver to full manufacture/maintenance/replacement/retirement/EOL, all users/periods/uncertainty/sensitivity/update/provider-carrier exclusions; sum then /N once."
      inputs:
        - "Actual complete-life events/native job-observed-remainder-equivalence"
      output: "All-user full-life asset equivalents"
      source_ids: []
    - id: unique_freight_sum
      applies_to: "cp_freight"
      rule: "Actual whole cargo includes received water/wire/staples/nonpaper/pack/carried supports once. EACH compatible mass*actual_count once/TOTAL unchanged, only noncargo tare. Native mass/distance to actual_transport_work and documented_service_share=numerator_driver/denominator_driver. freight_per_service=sum_unique_load_leg(actual_transport_work*documented_service_share)/N, each share inside SUM then N once, actual empty/provider/receiver scope disjoint."
      inputs:
        - "Actual unique loadleg/net-gross/cargo/count/distance/conversion/share records"
      output: "Actual freight t*km per service"
      source_ids: []
    - id: actual_outlets_release
      applies_to: "cp_outlets; cp_environment"
      rule: "outlet_per_service=actual_compatible_native_transfer_quantity/N after sourced EACH/TOTAL/net-tare/density conversion. Whole bale and separate material/pack/capture/liquid/retained components exclusive; actual receiver status/treatment once, closing stock not export, consumed-only supplies OMIT paired return. release_mass=measured_species_mass OR compatible activity*applicable_species_factor with only necessary composition/release_fraction; complete species factor already covering proportions must not multiply them again. Actual medium/native source/sample/capture exclusions then /N once; no automatic dust/decay/sequestration/virgin-paper credit."
      inputs:
        - "Actual native transfers/contents/status/receiver or independent species-medium-factor chain"
      output: "Exclusive actual receiver and species quantities"
      source_ids: []
