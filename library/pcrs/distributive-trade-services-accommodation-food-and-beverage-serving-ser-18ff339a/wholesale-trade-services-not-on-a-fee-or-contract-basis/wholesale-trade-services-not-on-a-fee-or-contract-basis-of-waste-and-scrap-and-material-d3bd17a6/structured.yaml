      raw_fields: "native_quantity; native_quantity_unit; native_quantity_basis; native_quantity_method; native_quantity_state; native_quantity_source; native_quantity_sample_time; count_multiplier; count_multiplier_unit; count_multiplier_basis; count_multiplier_method; count_multiplier_state; count_multiplier_source; count_multiplier_sample_time; component_quantity; component_quantity_unit; component_quantity_basis; component_quantity_method; component_quantity_state; component_quantity_source; component_quantity_sample_time; retained_paper; retained_paper_unit; retained_paper_basis; retained_paper_method; retained_paper_state; retained_paper_source; retained_paper_sample_time; retained_nonpaper; retained_nonpaper_unit; retained_nonpaper_basis; retained_nonpaper_method; retained_nonpaper_state; retained_nonpaper_source; retained_nonpaper_sample_time; retained_wire_staples; retained_wire_staples_unit; retained_wire_staples_basis; retained_wire_staples_method; retained_wire_staples_state; retained_wire_staples_source; retained_wire_staples_sample_time; retained_moisture; retained_moisture_unit; retained_moisture_basis; retained_moisture_method; retained_moisture_state; retained_moisture_source; retained_moisture_sample_time; retained_fluid; retained_fluid_unit; retained_fluid_basis; retained_fluid_method; retained_fluid_state; retained_fluid_source; retained_fluid_sample_time; density; density_unit; density_basis; density_method; density_state; density_source; density_sample_time; density_temperature; density_temperature_unit; density_temperature_basis; density_temperature_method; density_temperature_state; density_temperature_source; density_temperature_sample_time; conversion_factor; conversion_factor_unit; conversion_factor_basis; conversion_factor_method; conversion_factor_state; conversion_factor_source; conversion_factor_sample_time; event_id; transfer_id; parent_bale_source_ids; fragment_material_ids; whole_bale_exclusion; separate_material_exclusion; separate_pack_exclusion; mixed_capture_exclusion; free_fluid_exclusion; component_identity; water_sample_component_scope; water_definition_source; receiver_id; receiver_legal_Product_Waste_status; receiver_status_evidence; receiver_classification; treatment_owner; retained_content_fate; usable_supply_return_link; actual_export_not_closing; no_automatic_credit; period_id; time_zone; time_source; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
