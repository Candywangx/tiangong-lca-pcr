validation_rules:
  - rule_id: final_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Reference output/name/link Count equals actual owned/resold industrial B2B final gate/source/reversals N>0; origin/grade/bale/net-state/legal status and source-decision qualifiers. Open/quarantine/reject resources retained."
    source_ids: []
  - rule_id: secondary_source_treatment
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual postconsumer origin/recovery handoff, reviewed prior-system inheritance/cutoff/allocation decision/source/owner/time/coverage, complete actual collection-sort-bale-pack gate and duplicate prior/current/buyer exclusion. Neither automatic full virgin-box burden nor zero/credit."
    source_ids: []
  - rule_id: completed_integration
    applies_to: "foreground_dataset_conformance"
    rule: "Original direct OR positive complete compatible final-terminal native drivers incl closing/usefulothers/returns/provenloss with baseline/additional/loss coverage owner outside once. ACTUAL missing stages/additional demand MUST already integrate outside once with completed status/link-timezone-source-owner/integrated native quantity/coverage/once evidence; pending plan insufficient.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: carry_and_water
    applies_to: "foreground_dataset_conformance"
    rule: "Same-stock closing-to-opening carries original quantity/state/source/owner, not new source demand/N/two terminal exits; one horizon and final closing once. Actual water-only wet/dry definitions/sample/percent factor; ambiguous humidity or LOD not water. Dry nonwater not fibre/yield, whole component memberships exclusive."
    source_ids: []
  - rule_id: resources_and_actual_fate
    applies_to: "foreground_dataset_conformance"
    rule: "No hidden merchant collection/sort/open/bale-rebale/pulp/recycle/use/climate route. NET material receipts exclude tare, own native numerator/denominator, gross INPUT+matched OUTPUT OR consumed OMIT, complete all-user asset observed+sourced remainder, each unique freight share inside SUM/N once. Actual receiver legal status/classification/medium/native species evidence, no automatic recycling/credit/stockgap-to-emission/zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground own-account merchant-service add-on per final accepted industrial B2B consignment"
