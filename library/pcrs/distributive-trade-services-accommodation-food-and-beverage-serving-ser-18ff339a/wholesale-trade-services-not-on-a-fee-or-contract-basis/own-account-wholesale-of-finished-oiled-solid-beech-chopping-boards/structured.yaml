allocation_rules:
  - rule_id: event_shared
    applies_to: "all service inventory"
    rule: "Assign direct event use first, then evidenced compatible physical shared drivers across ALL real users/periods including rejected/unfinished/idle work. Divide assigned accepted-cohort total by positive N once; no automatic equal-board/order or financial share."
    source_ids: []
  - rule_id: asset_full_life
    applies_to: "shared_assets"
    rule: "Use complete manufacture/maintenance/actual replacements/end-of-life with compatible actual used/lifetime drivers, observed history plus sourced evidenced remaining/termination and uncertainty/sensitivity/update. Choose one asset-equivalent or lifecycle-complete provider view, not both or repeated per-N."
    source_ids: []
  - rule_id: supply_stock_returns
    applies_to: "operating supplies"
    rule: "For actual native standalone SKU/state S=assigned opening+net external receipts-closing including retained recovery. Gross-with-outlets uses S/N and real matched external usable return; consumed-only uses (S-matched return)/N and OMITs that outlet. Internal loops stay stock, waste/loss retains upstream, no unrelated or negative netting; inherited finish cannot offset current equipment lubricant."
    source_ids: []
  - rule_id: original_finished_gate
    applies_to: "merchandise"
    rule: "Choose exactly one assignment view for each actual source lot/state: directly traced/measured assigned quantity with unit/state/source and source-to-exclusive-exit record evidence; OR Qassigned_target = Qsource_actual × Dtarget / Dall_exits, with Qsource actual quantity/unit/state/source, Dall_exits >0 and complete compatible source-exit records. Each accepted/useful-other-exit/return/closing-carry/proven-loss record has quantity/unit/basis/source/link and one target owner; Dall_exits equals the sum of all competing record drivers. If a target groups accepted demand with an attributed proven-loss share, identify those exclusive loss records and allocation evidence once, removing them from all other targets. Do not use accepted-only denominator, infer missing loss as zero, or overlay direct and driver-assignment views. Assigned/additional/baseline demand must match original unit/state after sourced conversion; original finished manufacturing stays outside service. Additional linked demand = actual required original-gate demand minus identical already-covered baseline demand/loss, matching stage/state once outside service. Raw wood or finish-only predecessors need missing finished-board stages assembled outside; no nominal mass/density/moisture/oil multiplier."
    source_ids: []
  - rule_id: fate_views
    applies_to: "all actual outlets"
    rule: "Whole finished-board/pack waste and wood/moisture/finish component audits, cleanup dry carrier+absorbed liquid/fragments and free liquid are non-additive receiver views. One treatment owner, useful board/finish/pack exits stay commodity audit, no automatic avoided-manufacture/recycling credit. Unknown source or receiver scope blocks complete-chain readiness."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
