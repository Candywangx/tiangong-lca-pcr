validation_rules:
  - rule_id: commercial_acceptance
    applies_to: "accepted_service"
    rule: "Require actual unique own-account final B2B accepted consignment N>0 and all species/form/finish/quantity/state/time/gate qualifiers, not board-piece or kg identity."
    source_ids: []
  - rule_id: finished_components
    applies_to: "merchandise"
    rule: "Verify finished net versus gross/pack/tare and any independent wood/water/oil native component units/bases/method/state/sampletime/source. Factory finish remains inherited commodity, not service oil; unknown residual is no loss/species or default zero."
    source_ids:
      - ikea-beech-oiled-board
  - rule_id: actual_route_exits
    applies_to: "board_wholesale"
    rule: "Check actual ambient handling and crack/warp/contamination/sample/return/downgrade/discard paths; do not hide merchant drying/oiling/sanding/sanitation/food testing/consumer washing in providers."
    source_ids: []
  - rule_id: original_finished_source
    applies_to: "commodity interface"
    rule: "Require actual source quantity/unit/state/source and exactly one direct-trace or recomputable driver assignment. Recompute Dall_exits as complete accepted/useful-other/return/closing-carry/proven-loss record drivers, each with quantity/unit/basis/source/link; denominator positive and compatible, all records exclusively assigned, no accepted-only denominator or direct+driver overlap. Validate target loss shares once, original-unit/state conversions and identical baseline stage/loss coverage outside. Unknown records/loss cannot default zero."
    source_ids: []
  - rule_id: all_users_asset
    applies_to: "all service resources"
    rule: "Require actual events/periods/all consumers and complete asset manufacture/maintenance/replacement/EOL, compatible used/lifetime units with observed+sourced remaining/termination and one per-N/provider/asset view; no-acceptance burdens retained."
    source_ids: []
  - rule_id: nonadditive_stock_fates
    applies_to: "all actual inventory"
    rule: "Verify measured native supplies/return provenance/receiver/conversions, consumed-only matched-return omission and whole board/component/mixed cleanup/free-liquid/direct-species non-overlap with one treatment owner and no automatic credits."
    source_ids: []
  - rule_id: packed_freight
    applies_to: "freight"
    rule: "Validate unique load/leg IDs, EACH-versus-TOTAL/count provenance, measured packed-cargo or vehicle-gross-minus-noncargo-tare exclusive view, retained cargo packs/oil/moisture, native factor units/sources, complete allocation share and one final per-N normalization."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Finished oiled solid-beech chopping-board merchant service add-on, separately linked to complete finished source product and actual assigned demand/loss coverage"
  allowed_use: "Actual supplier-complete oiled solid-beech kitchen board ambient own-account B2B consignment with compatible native finished/component/pack/state evidence"
  excluded_use: "Standalone board footprint, raw wood or other materials; merchant drying/sanding/oiling/food-contact testing/washing; consumer food use; retail/agency/storage-only"
  required_metadata: "Actual SKU/species/solid form/finish/geometry/board-pack IDs/count/net-tare/moisture and independent component-unit/basis/method/state/sampletime/source, actual condition/time/acceptance/site/period, complete finished-gate demand/loss and each service/asset/provider/freight/treatment owner"
  required_quality_disclosure: "Identity/support/component/sampling/state and quantity uncertainty, inherited finish versus actual service supply, original-demand/baseline coverage/receiver gaps and unexplained stock, all-user lifetime remainder assumptions and independent range limitations"
  update_trigger: "Changed wood species/form/finish/presentation/moisture/component measurement/acceptance or active drying/oiling/treatment, source gate/loss coverage, provider/asset/freight/treatment or native conversion method"
data_sources:
  - id: "unsd-cpc3-woodware-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30 June2025),31912 wood kitchenware and61046/group319. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: finished wood kitchenware within a narrower woodenware merchant service, not31913 or raw timber manufacture."
  - id: "ikea-beech-oiled-board"
    type: "official_guidance"
    reference: "IKEA, PROPPMATT chopping board302.334.18, current public manufacturer product/materials/pack body. https://www.ikea.com/ma/en/p/proppmaett-chopping-board-beech-30233418/"
    used_for: "Qualitative actual finished solid-beech/oil form and net-versus-pack questions only; no dimension/weight/moisture/oil recipe/life/food-use assurance or consumer washing as merchant operation."
