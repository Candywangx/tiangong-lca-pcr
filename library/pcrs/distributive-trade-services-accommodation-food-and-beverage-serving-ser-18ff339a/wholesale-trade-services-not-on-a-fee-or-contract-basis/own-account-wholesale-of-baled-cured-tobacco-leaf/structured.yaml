      inputs:
        - cp_utilities
        - N
      output: "Actual delivered utility quantity per reference flow"
      source_ids: []
    - id: provider_complete
      applies_to: "provider_packages"
      rule: "provider_quantity=quantity/N for actual completed native-Count package with matching upstream unit and full scope; otherwise expand actual native exchanges before final dataset. Add missing_scope once; remove direct_overlap."
      inputs:
        - cp_provider
        - N
      output: "Actual complete provider service per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; require compatible driver units and lifecycle-complete matching dataset for each asset."
      inputs:
        - cp_assets
        - N
      output: "Attributed whole-lifecycle asset-equivalent Item(s) per reference flow"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "freight_work=sum(load_kg*distance_km*attribution_share)/N; preserve actual conversion and empty-service/provider coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual kg*km per reference flow with independently covered empty services"
      source_ids: []
    - id: outlets
      applies_to: "tobacco_waste; other_wastes; wastewater; usable_supply_returns; tobacco_waste_atomic_case"
      rule: "outlet_quantity=net_quantity/N by actual material/state/receiver. Tobacco waste comes from actual cp_merchandise waste_quantity records, not an unexplained stock difference. Pair receiving treatment scope once, no avoided-product credit."
      inputs:
        - cp_merchandise
        - cp_outlets
        - cp_supplies
        - N
      output: "Actual physical outlets per reference flow"
      source_ids: []
    - id: species_release
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR whole_release*composition*fate/N after compatible basis/unit conversion. Choose one valid path; factor_complete forbids multiplying composition/fate again."
      inputs:
        - cp_environment
        - N
      output: "Actual species kg per reference flow and actual receiving medium"
      source_ids: []
