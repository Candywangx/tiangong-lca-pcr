      collection_method: "Reconcile actual purchases/title, bale/lot weights and moisture samples, warehouse movement ledgers and business-buyer signed acceptance; sample/grade specification is contract-specific. N is the final unique accepted_consignment_ids at reference_gate_id. Preserve unfinished consignment resource attribution in open-cohort/period carry links; no artificial acceptance or unexplained dropped burden. Track rejected attempts, customer returns, closing inventory, usable supplier returns, commercial downgraded outlets and contained wastes distinctly. Link compatible dry-matter balances and commodity loss adjustment outside this service.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Item(s); merchandise kg in specified moisture basis"
      frequency: "each commercial acceptance, receipt, dispatch, rejection and period stocktake"
      temporal_coverage: "Whole selected consignment cohort from receipt through actual buyer gate and linked prior/later stock; all attempts and attributable cleaning intervals"
