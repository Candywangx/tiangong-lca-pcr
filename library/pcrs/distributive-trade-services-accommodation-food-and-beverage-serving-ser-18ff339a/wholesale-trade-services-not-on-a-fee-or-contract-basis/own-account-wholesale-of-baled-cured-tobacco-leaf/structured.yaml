      site_scope: "Actual warehouse boundary and receiving treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Transfer/treatment tickets, calibration, composition/receiving-state and coverage evidence"
    - protocol_id: cp_environment
      process_id: "wholesale_operation"
      flow_role: "actual direct species and receiving medium"
      record_type: "species_release_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; lot_id; consignment_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; exchange_id; resource_or_substance; species; particle_basis; receiving_medium; source_event; measured_mass; mass_unit; activity; activity_unit; species_factor; factor_unit; factor_scope; factor_source; factor_complete; whole_release; whole_release_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; conversion_factor; conversion_unit; conversion_source; temperature; temperature_unit; pressure; pressure_unit; capture_state; provider_inclusion; detection_limit; calibration; uncertainty"
      collection_method: "Identify actual direct substance and receiving medium before quantification. Use calibrated measured mass, compatible activity factor or measured whole release with source-backed composition/fate as exclusive paths; keep captured material, whole-fluid and species views nonadditive. No chemical inventory/residual or SDS hazard is release evidence."
      unit: "kg by actual substance and medium"
      frequency: "each actual release and relevant measurement interval"
      temporal_coverage: "All selected-operation direct release events and attribution periods"
      site_scope: "Actual emitting warehouse source; excludes provider-included emissions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Species/compartment evidence, detection limits/calibration and factor/composition/fate compatibility"
  calculation_rules:
    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique accepted_consignment_ids at the declared final reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_merchandise
      output: "One actual commercial consignment reference, with actual mass/moisture/grade/time qualifiers"
      source_ids: []
    - id: supply_stock
      applies_to: "packaging_supplies; cleaning_supplies; usable_supply_returns; cleaning_supplies_synthetic_detergent"
      rule: "net_receipts=gross_receipts-tare_receipts; S=opening+net_receipts-closing; gross_input=S/N OR consumed_input=(S-usable_outward_return)/N. Choose one convention; retain the matched return output ONLY for gross_input; consumed_input MUST OMIT that output exchange. recovered_closing belongs to closing; nonreturned waste/loss supply remains included."
      inputs:
        - cp_supplies
        - N
      output: "Actual native supply and separately recorded outward returns per reference flow"
      source_ids: []
    - id: merchandise_balance
      applies_to: "merchandise audit; tobacco_waste; tobacco_waste_atomic_case"
      rule: "For each lot reconcile compatible measured opening, receipts, dispatches, actual external returns, closing and all actual outlet fates. Compute dry_matter=net_mass*(1-moisture_wet_fraction) only with matched moisture observations and documented fraction conversion; use summed dry matter by actual lot, never sum unadjusted wet kg across moisture states. Investigate unexplained discrepancy; do not infer waste, evaporation or emission. Keep netting of paired internal transfers nonadditive.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - cp_merchandise
      output: "Non-exchange merchandise audit and actual commodity-system loss-adjustment evidence, not an added leaf manufacturing exchange"
      source_ids: []
    - id: utilities
      applies_to: "electricity; supplied_water; electricity_ac; supplied_water_liquid_tap"
