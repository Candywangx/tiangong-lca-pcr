validation_rules:
  - rule_id: reference_gate
    applies_to: "accepted_service"
    rule: "Check N>0 final unique accepted consignment IDs and all required qualifiers; 1 Item(s) is normalization only. No kg/bale/invoice/fee equivalence or unresolved rejection counted as acceptance."
    source_ids: []
  - rule_id: stock_moisture
    applies_to: "merchandise and supplies"
    rule: "Check unit/state-specific stock and matched moisture/dry-matter balances, internal transfers, closing including recovered closing, actual external returns, commercial scrap and contained wastes. No unexplained-residual emission/loss, double outward-return subtraction or default loss zero."
    source_ids: []
  - rule_id: commodity_interface_check
    applies_to: "service and linked commodity system"
    rule: "Require explicit all-merchandise-upstream exclusion and actual loss-fate/quantity/basis link to named commodity dataset/gate with one owner; validate that upstream loss adjustment occurs exactly once outside service before complete-chain/finalpackage claim.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: scope_and_asset
    applies_to: "all operations and periods"
    rule: "Check actual electrical-only/unchanged-bale route, period/event coverage, complete provider/asset life scope, all consumers and exact native units/physical results, including freight/reject/return/idle/cleaning and waste treatment. Missing scope is incomplete rather than zero."
    source_ids: []
  - rule_id: species_and_water
    applies_to: "direct_species; supplied_water; wastewater; supplied_water_liquid_tap"
    rule: "Separate purchased water, contained wastewater and any actual direct environmental exchange. Verify actual species/medium/particle basis and measurement/factor/composition/fate evidence without duplicate pathways; no chemical hazard or moisture residual as release."
    source_ids: []
  - rule_id: bilingual_projection
    applies_to: "all rules and cards"
    rule: "Compare ordered IDs, actual native property/unit, amount basis, node-owned collection protocol/raw operands, source URLs and reference card association across both languages and generated projection. Final UUIDs and source-backed ranges require distinct verification."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after complete foreground collection and concrete exchange verification"
  downstream_use: "Service-only wholesale add-on linked once to a separate compatible cured-leaf commodity system and its measured loss adjustment."
  allowed_use: "One declared electrically handled baled-cured-leaf own-account wholesale cohort/site/gate, actual accepted consignment and all qualifiers; compare only equivalent scope and physical quantities."
  excluded_use: "Whole delivered tobacco product footprint; cultivation/curing/conditioning/manufacture; retail, agency, storage-only; untracked commodity-loss burden or universal lotmass/grade thresholds."
  required_metadata: "operator and site; cohort/consignment/lot IDs; ownership/resale and buyer gate; tobacco type/curing/grade/cropyear/origin; net mass and moisture sampling/basis; intact bale form; arrival/departure/storage conditions; actual provider/transport/asset/period boundaries; linked commodity dataset/loss adjustment and sole owner"
  required_quality_disclosure: "Calibration and moisture/grade sampling coverage; discrepancy/loss investigations; all scope and native-unit gaps; full-life asset driver/remainder uncertainty; provider coverage; actual loss-treatment and commodity-system once-only interface; concrete UUID and quantitative range evidence limits"
  update_trigger: "Changed product state, conditioning route, commercial gate, source/site/transport/provider/asset life, moisture/grade method, stock/loss pattern or material evidence; any direct combustion/treatment/abstraction needs boundary and exchange review"
data_sources:
  - id: "inrae-tobacco-storage"
    type: "extension_guidance"
    reference: "INRAE ePhytia, Recommendations for curing and storage. https://ephytia.inrae.fr/en/C/11065/Tobacco-Recommendations-for-curing-and-storage"
    used_for: "Qualitative dry/dark/off-ground bale storage and debris/hygiene context only. Curing advice is outside this service. No wholesale energy, lifetime, moisture or loss factor."
  - id: "usda-tobacco-grades"
    type: "official_guidance"
    reference: "USDA AMS, Tobacco grades and standards. https://www.ams.usda.gov/grades-standards/tobacco"
    used_for: "Actual declared leaf class/type/grade as commercial quality context; choose applicable contract scheme rather than universally impose US categories."
  - id: "usda-tobacco-scrap"
    type: "official_guidance"
    reference: "USDA AMS, Flue-Cured Tobacco Nondescript and Scrap grades. https://www.ams.usda.gov/grades-standards/flue-cured-tobacco-us-types-11-12-13-14-foreign-type-92-nondescript-n-group-and"
    used_for: "Warehouse handling can create commercially defined scrap. Grade injury/waste tolerance is not a physical warehouse loss rate or proof that all scrap is waste."
