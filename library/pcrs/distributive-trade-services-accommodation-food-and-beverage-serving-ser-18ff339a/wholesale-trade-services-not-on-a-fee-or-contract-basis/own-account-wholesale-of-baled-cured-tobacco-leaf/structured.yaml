      collection_method: "Weigh or use calibrated native-unit stock/delivery records by actual SKU and state; opening+net receipts-closing is S. Under gross-with-outlets use S/N and pair actual outward returns; under consumed-only use (S-usable_outward_return)/N and OMIT the matched outward-return output exchange entirely. Recovered closing already belongs in closing; retain nonreturned waste/loss supply burdens. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
