allocation_rules:
  - rule_id: commodity_interface
    applies_to: "merchandise and losses"
    rule: "Keep all merchandise manufacture outside the service. Quantify actual compatible-basis irrecoverable leaf loss and its fate; record linked commodity dataset/gate, explicit adjustment quantity/basis and sole commodity-loss owner. Downstream integration must supply loss-related upstream leaf burden exactly once in that commodity system; neither missing loss adjustment nor duplicating it in this service is acceptable. No default zero loss or inferred dry mass residual.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: cohort_attribution
    applies_to: "all wholesale resources"
    rule: "One service output type. Attribute shared operations across all actual contracts/lots and periods using evidence-supported causal drivers, not equal consignment shares by default. Record the chosen driver, every consumer and numerator/denominator units. Rejected/repeated operations retain their real burdens; no automatic scrap or return credit."
    source_ids: []
  - rule_id: asset_lifecycle
    applies_to: "shared_assets"
    rule: "Use asset_equivalent=(job_driver/life_driver)/N for one matching whole lifecycle including manufacture, maintenance, replacements and end-of-life. life_driver covers every consumer/period. Use observed completed life or documented history plus evidenced remainder and actual replacement/termination treatment with uncertainty/sensitivity/update. Do not also add a per-driver service view or divide twice."
    source_ids: []
  - rule_id: returns
    applies_to: "supplies and merchandise"
    rule: "For current supply S=opening+net_receipts-closing, choose gross-with-outlets S/N plus paired unused outward return ledger OR consumed-only (S-usable_outward_return)/N and OMIT the matched return output exchange entirely. Closing includes recovered closing. Lost/spent supply burdens remain. Merchandise returns stay in the separate commodity ledger with actual owner and loss interface."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Unfinished consignments retain their attributed resources in linked open-cohort/period records until their actual acceptance or final reject fate is established. They never create a completed reference count or disappear from period accounting; do not shift their burdens arbitrarily to accepted consignments."
    source_ids: []
dataset_production:
