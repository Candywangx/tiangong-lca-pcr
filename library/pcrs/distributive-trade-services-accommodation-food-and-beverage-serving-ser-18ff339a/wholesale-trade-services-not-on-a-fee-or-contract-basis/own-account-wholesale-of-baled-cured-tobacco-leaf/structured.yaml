system_boundary:
  rules:
    - rule_id: service_addon
      applies_to: "all scope"
      rule: "This is a wholesale-service add-on, not a cradle-to-gate leaf product. Exclude upstream cultivation, curing and all traded-merchandise manufacture, including embodied upstream burdens of lost merchandise, from every service exchange. Link the commodity-system loss adjustment exactly once outside this add-on before any complete-chain or final package claim."
      source_ids: []
    - rule_id: starting_leaf
      applies_to: "merchandise"
      rule: "Start with actually bought already-cured intact baled leaf and its inherited grade, moisture and package records. No redrying, reconditioning, fermentation, stemming, blending or tobacco manufacture. Commodity merchandise movements stay in the audit ledger; the service output is the completed commercial consignment, not tobacco kg."
      source_ids: []
    - rule_id: operation_scope
      applies_to: "wholesale_operation"
      rule: "Include actual receiving/verification, electric handling, monitored storage, order consolidation without leaf transformation, dispatch/acceptance, attributable hygiene/idle resources, rejected attempts and matched loss treatment. Supplier/retailer/fee-agent and separate storage-only work are excluded."
      source_ids: []
    - rule_id: provider_scope
      applies_to: "actual services and exchanges"
      rule: "Declare actual all-consumer meter/asset boundaries, contracted provider responsibility, actual freight legs and wastewater/waste treatment. Missing upstream scope is supplied once; no direct/provider duplication. No direct leaf treatment/onsite combustion/environmental abstraction in this route; actual occurrence requires scope revision and appropriate concrete exchange expansion."
      source_ids: []
    - rule_id: period_and_reject
      applies_to: "stocks and rejected material"
      rule: "Enumerate receipt-to-buyer cohort periods, opening/closing and actual returns/rejections/downgrades with lot/event/transfer links. Usable commercial leaf/scrap return or resale is not automatic Waste, avoided production credit, or second reference acceptance. Unresolved commercial acceptance or outlet blocks finalization."
      source_ids: []
