      collection_method: "Use actual import/export source interval OR matched direct submeter and disjoint physical scopes, with real all-user causal handling/space-time or justified drivers including idle/hygiene/failed/open periods. No powering TVs or consumer energy ratings, no unreviewed dedicated climate load. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh; m3; actual meter/driver units"
      frequency: "each actual matched source/consumer/event interval"
      temporal_coverage: "All service source periods/users/idle/hygiene/open cohorts"
      site_scope: "Actual direct utility/supply treatment boundary excluding provider overlap"
      aggregation_rule: "per reference flow"
      quality_evidence: "Source meter calibration/real direction/period and complete causal driver evidence"
