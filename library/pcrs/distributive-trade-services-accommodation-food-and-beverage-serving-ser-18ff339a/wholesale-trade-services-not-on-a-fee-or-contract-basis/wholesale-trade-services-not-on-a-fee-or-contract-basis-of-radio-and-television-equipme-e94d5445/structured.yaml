validation_rules:
  - rule_id: reference_gate_check
    applies_to: "accepted_service"
    rule: "N>0 actual unique final unpowered commercial accepted consignment, actualmodel/serial/kit/stand/remote/cells/netmass/pack/state/time; no TVpiece or barepanel Count reference."
    source_ids: []
  - rule_id: no_power_processing
    applies_to: "whole route"
    rule: "No foreground activation/demo/electricaltest/software/repair/disassembly/standassembly/mount/install/routineprimaryrebox or unreviewed climate intervention, including contracted work. Consumer usepower and factorytest not service utility."
    source_ids: []
  - rule_id: commodity_gate_check
    applies_to: "non-exchange goods"
    rule: "Complete actualfactory kit/inheritedpack manufacturing upstream coverage, sourcegate assignedquantity nativeunits/source/allocation/conversion/exclusiveexits and actualcompatible loss owner/existingcoverage outside once. Includedcell/accessory not newconsumedserviceinput, unknownstate not loss/emission/zero."
    source_ids: []
  - rule_id: resource_owner_check
    applies_to: "all service resources"
    rule: "Allusers/periods/causal native driver units and idle/hygiene/openattempts, supplygross+outward OR consumedonlyomitreturn, completeassetlife observed+sourcedremainder/EOL/uncertainty and direct/provider/carrier/receiver scope once."
    source_ids: []
  - rule_id: outlet_species_check
    applies_to: "actual fates"
    rule: "ActualwholeTV/associatedkitpack vs detachedparts/containedincidentmaterial/separatepack/mixedhygiene/wastewater disjoint with realreceiver classification/treatment. No damage-to-chemical or battery/panel composition-to-release default, no automatic salvagecredit."
    source_ids: []
  - rule_id: bilingual_raw_contract
    applies_to: "all content"
    rule: "Raw identity7/FU5/boundary6/reference6/profile7 and all8CP12fields/10calculationbody-output nonempty; exactorderedIDs/rawoperands/propertyunits/evidence/sourceURLs and deterministic projection align withoutpreprocessing. Pass not actualquality/finalUUIDproof."
    source_ids: []
