    source_ids:
      - elexon-metering-context
  - rule_id: source_completed
    applies_to: "nonexchangeenergy"
    rule: "Directactualtrace OR positiveCOMPLETE compatible allphysicalterminal native6metadata/link/owner, notacceptedonly/certificate/inventedstock. Actualgeneration-gridgate-loss responsibility-baselinecoverage then requiredmissingstage/additional ACTUALLY outsidecompleted once nativeqty-status-link-timezone-source-owner-stage-losscoverage beforechainready, notplanned."
    source_ids: []
  - rule_id: resource_owners
    applies_to: "all"
    rule: "Tradedenergy NONEXCHANGE notownfacilityserviceelectricity/directrelease; actualofficeICT-meter resources and lifecyclecompleteprovider/asset exclusivefullalluser observed+sourcedremaining-life drivers/N once. NETsupplies excludecontainertare gross S/N INPUT with matched unused return/N OUTPUT OR consumed-only (S-return)/N INPUT with matched return OUTPUT OMITTED, nevertradedstock. Actualmixedmaterials/equipment/freewater/directspecies exclusive receivertransporttreatment afterassetprovidercoverage once; noautomaticcredit/residual=species/zero."
    source_ids: []
  - rule_id: scope_limits
    applies_to: "method"
    rule: "No merchantgeneration/storage/networkoperation/warehouse/truck/pallet template imported. Electricitystorage exists. Elexon GBqualitative context not universalinterval/legal/mix/lossfactor; unsupported identities/nativecoverage remainexplicitgaps."
    source_ids:
