  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "Attributed actual physical quantity / positive unique N once; accepted_service is 1 Item(s)."
      inputs:
        - "attributed quantity"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: supply_stock
      applies_to: "materials and unused_supply_return"
      rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Choose gross INPUT S with separate same-scope matched usable OUTPUT OR consumed-only INPUT S-return omitting that output. Internal recovery is not receipt;no numeric S+return,double deduction or removal of nonreturned waste/spill upstream burden. Book merchandise returns and original covers are not service-supply credits."
      inputs:
        - opening
        - "true net external receipts"
        - "closing including retained recovery"
        - "same-scope matched unused outward"
        - representation
        - cp_materials
      output: "nonduplicated supplied/returned material"
      source_ids: []
    - id: shared_life_share
      applies_to: "resources/assets/providers"
      rule: "Compatible-period complete resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across users/periods,including manufacture,maintenance/cleaning,replacements and EOL. Evidence observed life or history plus sourced remainder/termination,driver units,uncertainty/sensitivity/update. Complete provider scope replaces covered own resources/assets rather than adding them."
      inputs:
        - "actual period/resource scope"
        - "cohort/all-user/lifetime drivers/units"
        - "observed/history/remainder/termination/source"
        - cp_assets
      output: "attributed complete resources/asset equivalents"
      source_ids: []
    - id: finished_book_net_mass
      applies_to: "nonexchange copy stock"
      rule: "Net finished-book mass=sum actual unique stock/package readings(gross-external packaging tare),converted once with native factor/unit/source and edition/sample representativeness. Covers/binding/ink remain product,not external tare. Use per-instance readings OR documented total,never total times copy/carton count again; parent set and its bound volumes are alternate views. Page count/nominal sheet mass alone cannot supply net copy mass."
      inputs:
        - "edition/source-unit equivalence"
        - "unique stock records"
        - "gross/external tare"
        - "each/total"
        - "native mass factor/unit/source"
        - "sample representativeness"
        - cp_books
      output: "net finished-copy mass,nonexchange audit"
      source_ids: []
    - id: original_gate_assignment
      applies_to: "commodity outside service"
      rule: "Use actual directly measured/traced assigned source quantity/unit/state/source and direct-assignment evidence; otherwise assigned source quantity=actual original-gate quantity*compatible source cohort driver/source all-exit driver with positive complete denominator,units,allocation method/source. Do not combine direct and allocated views. For allocated source assignment,retain source_all_exit_driver_records for every competing accepted transfer,external return,closing carry/unsold or damaged-retained stock,usable other exit and actual whole/fragment loss. Each mutually exclusive end-state/exit driver record has quantity,unit,basis,source,original-source/edition link,cohort/period and exclusivity key; reconcile intermediate return movements to their final state rather than counting both. Numerator and complete denominator must refer to the same compatible original-source cohort and driver basis. Denominator=sum these complete mutually exclusive records,including unsold/closing carry and useful exits,never accepted-only; missing destination coverage blocks allocated assignment. Match actual edition/source-unit and whole/fragment loss/state conversion with coverage owner/exclusive exits before once-only integration outside service; no fragments/pulp/pages-to-copy factor without real evidence."
      inputs:
        - "originalgate quantity/unit/state/source"
        - "direct evidence OR allocation method/source/cohort/allexitdrivers/units"
        - "assigned source"
        - "edition equivalence"
        - "loss conversions/owner/coverage/exits/integration"
        - cp_books
      output: "reproducible assigned finished-copy demand/loss quantity"
      source_ids: []
    - id: packed_load_freight
      applies_to: "packed_freight"
      rule: "For actual legs,sum[(actual packed payload native load*load-to-kg factor)*(actual distance*distance-to-km factor)*actual attribution share]/positive N. Cargo includes actual books/covers/binding and factory/additional cargo packing; subtract only evidenced vehicle/noncargo tare. Factors/shares carry compatible units/bases/sources and all-user drivers where allocated. Never add same parent carton and contained copies or net paper and complete bound book."
      inputs:
        - "actual packed load/state or gross/noncargo tare"
        - "native distance"
        - "load/distance factors/units/sources"
        - "actual share/all-user drivers"
        - N
        - cp_transport
      output: "kg*km per service reference"
      source_ids: []
