validation_rules:
  - rule_id: commercial_reference
    applies_to: "actual declared scope"
    rule: "Source verify ownership purchase/resale,B2B buyer and final acceptance/reversal records. Count unique FINAL commercial N after reversals;not bag/tonne/invoice or supplier receipt. Canceled/reversed/failed/unfinished events retain actual cohort/period resources;N=0 no division and no erased duties."
    source_ids: []
  - rule_id: native_grade
    applies_to: "actual declared scope"
    rule: "Verify actual grade/homopolymer pellet/formulation/feedstock/moisture source,net as-received product mass versus bag/external packing,wet-dry/component method/sample/state/units/source and actual density kind/temperature. No universal neat/virgin/additive-free,bag kg,solid-density-to-bag-volume,MFR or molding conversion."
    source_ids: []
  - rule_id: source_chain
    applies_to: "actual declared scope"
    rule: "Use directly traced actual assigned original-gate quantity/unit/state/source OR original quantity * compatible source-cohort driver / positive complete all-terminal driver sum. Each competing accepted/closing-unsold-damaged/usefulother/returned/actual whole-contained-mixed-liquid-loss record has native quantity/unit/basis/method/state/time/source,owner,original lot/cohort/period/conversion/exclusivity and numerator link;no accepted-only denominator or intermediate movement twice. Original-gate loss conversion matches actual grade/formulation/wet-dry state,not whole spilled-bag kg as neat PP. Record total required source demand,compatible baseline-covered source quantity and actual additional uncovered quantity with stage/loss coverage and owner;integrate additional demand once outside,never subtract unrelated coverage or create credit from negative mismatch."
    source_ids: []
  - rule_id: native_complete
    applies_to: "actual declared scope"
    rule: "Require actual resource/provider/carrier/asset full-life native driver and exclusive receiver coverage. Freight unique load-leg EACH/TOTAL,sourced repeatcountonce,actual cargo packing/support retained and THAT-record share inside sum/N once. Unknown stock/moisture or missing pellet mass is not loss/emission/disposal/zero;actual contained/whole/mixed/free-liquid/direct paths close with source owner once."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and quantitative completion"
  downstream_use: "Physical own-account original-sealed-bag finishedPP-homopolymer-pellet wholesale add-on within complete actual grade chain"
  allowed_use: "Actual manufacturer/grade/formulation/feedstock/moisture/bag-lot/netmass/packing/condition/period and final business acceptance"
  excluded_use: "Standalone polymer footprint;other resin/bulk-silo/rawmonomer/manufacture/dry/melt/extrude/compound/regranulate/rebag/pneumatictransfer/mold;retail/agency;bag/kg/value service proxy"
  required_metadata: "All qualifiers;grade/formulation/feedstock/moisture/bagpack/native mass/stock/fates;source original/assigned/loss/baseline/additional quantities/terminal records/conversions/owner/coverage/integration;full resources/providers/assets/carriers/receivers"
  required_quality_disclosure: "Unresolved identities/support and meaningful Range evidence;native formulation/wetdry/density/fate/source and full-life uncertainty"
  update_trigger: "Changed grade/formulation/feedstock/moisture/packing/source,fates or actual operation,provider/asset/carrier/receiver/final acceptance or loss coverage"
