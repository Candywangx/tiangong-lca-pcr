    applies_to: "actual declared scope"
    rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Gross INPUT S plus separate same-scope matched unused external OUTPUT OR consumed INPUT S-return omitting OUTPUT. No numerical S+return,double credit,new receipt from internal recovery or removal of unreturned waste burden. Inherited resin/additives/packing never nets unrelated operating supplies."
