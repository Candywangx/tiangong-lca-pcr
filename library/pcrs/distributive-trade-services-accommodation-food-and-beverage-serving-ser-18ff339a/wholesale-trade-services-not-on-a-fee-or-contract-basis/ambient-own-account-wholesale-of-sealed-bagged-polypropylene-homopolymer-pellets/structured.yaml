    type: "handbook"
    reference: "LyondellBasell Packed product storage guidelines,EU supplied polymers,current4page document: https://www.lyondellbasell.com/globalassets/lyb/suppliers/supply-chain/packed-product-storage-guidelines_eu.pdf"
    used_for: "Qualitative actual packed-bag/overwrap/support condition and source-instruction questions. No universal stack height,bag mass,pallet load,climate energy or lifetime/reuse quantity. Cool-dry text is not proof of operated air conditioning. PCR stock/source/full-life/freight math is separately declared foreground method,not numerical factors from this guide."
