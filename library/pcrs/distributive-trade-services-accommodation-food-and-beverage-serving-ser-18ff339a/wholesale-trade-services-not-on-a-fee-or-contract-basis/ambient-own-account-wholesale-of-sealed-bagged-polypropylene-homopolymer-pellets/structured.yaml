  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "Attributed actual quantity / positive unique FINAL N once;accepted_service is 1 Item(s). Source-owned/resold business completion after reversals,not supplier receipt. Preserve unfinished/reversed/failed cohort-period resources;if N=0 do not divide."
      inputs:
        - "attributed actual native quantity"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: pellet_net_and_state
      applies_to: "nonexchange commodity"
      rule: "Net as-received pellet formulation mass=actual gross bag/load mass-actual bag/liner tare-other actual external pack tare on compatible native bases. EACH multiplies actual count once,TOTAL unchanged. For a source-supported water-free matching formulation view,define w_wet=actual water mass/actual as-received product mass and w_dry=actual water mass/actual matching nonwater formulation mass. dry mass=matching as-received mass*(1-w_wet). Only actual compatible same-sample wet/dry definitions permit w_wet=w_dry/(1+w_dry),after independently sourced native unit-to-ratio factor/method. Dry here means that matching nonwater formulation,not assumed oven residue;loss-on-drying including other volatiles is not automatically water. Record actual water/nonwater/species/method/state/sampletime/representativeness and conversion sources. Component/additive fractions apply only their actual matching basis,not whole bag/mixed waste or an assumed neat polymer. Solid-resin density is not bulk bag/load density;volume-to-mass only actual matching measured bulk/mixture state,density units/temp/source. Views nonadditive;no prescribed bag opening/drying or universal moisture/density."
      inputs:
        - "actual gross/bag/liner/other tare/net"
        - "EACH/TOTAL"
        - "actual moisture/components/density-kind/temp and native units"
        - bases
        - methods
        - state
        - sampletime
        - "sources/conversions"
        - cp_bags
      output: "net native asreceived/dry/component audit,not new service exchanges"
      source_ids: []
    - id: source_gate_assignment
      applies_to: "commodity outside service"
      rule: "Use directly traced actual assigned original-gate quantity/unit/state/source OR original quantity * compatible source-cohort driver / positive complete all-terminal driver sum. Each competing accepted/closing-unsold-damaged/usefulother/returned/actual whole-contained-mixed-liquid-loss record has native quantity/unit/basis/method/state/time/source,owner,original lot/cohort/period/conversion/exclusivity and numerator link;no accepted-only denominator or intermediate movement twice. Original-gate loss conversion matches actual grade/formulation/wet-dry state,not whole spilled-bag kg as neat PP. Record total required source demand,compatible baseline-covered source quantity and actual additional uncovered quantity with stage/loss coverage and owner;integrate additional demand once outside,never subtract unrelated coverage or create credit from negative mismatch."
      inputs:
        - "original/assigned/loss/baseline-covered/additional quantity-unit-state-basis-method-source"
        - "direct trace OR compatible complete source allterminal driver records and positive denominator"
        - "coverage/owner/conversion/integration"
        - cp_bags
      output: "complete grade-bagged source demand/loss integrated outsideonce"
      source_ids: []
    - id: supplies_stock
      applies_to: "independent supplies"
      rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Gross INPUT S plus separate same-scope matched unused external OUTPUT OR consumed INPUT S-return omitting OUTPUT. No numerical S+return,double credit,new receipt from internal recovery or removal of unreturned waste burden. Inherited resin/additives/packing never nets unrelated operating supplies."
      inputs:
        - opening
        - "true external net receipts"
        - "recovered closing"
        - "matched unused outward"
        - convention
        - cp_supplies
      output: "nonduplicated supplied and returned quantities"
      source_ids: []
    - id: shared_lifetime
      applies_to: "resources and assets"
      rule: "Resource share uses actual compatible cohort/all-user causal driver. Full asset equivalent=compatible job/cohort used driver / complete lifetime all-user all-period driver,with observed-history+sourced remaining use/termination. Every operand has native unit/basis/method/state/time/source/conversion. Include full manufacture/maintenance-cleaning/replacements/EOL,uncertainty/sensitivity/update;complete provider replaces matching own coverage."
      inputs:
        - "native job/cohort equivalent"
        - "alluser used/observed-history/remaining/termination/lifetime driver units/bases/methods/state/time/source"
        - cp_assets
      output: "complete attributed resource/asset equivalents"
      source_ids: []
    - id: freight_sum
      applies_to: "packed_load_freight"
      rule: "Sum over unique load_id+leg_id [(actual converted packed payload kg)*(actual sourced repeat count ONLY for EACH,otherwise 1)*(actual converted distance km)*(THAT record actual causal share)] / positive N. TOTAL unchanged;N once. Payload is direct measured cargo OR compatible gross-noncargo vehicle tare;keep actual bag/liner/overwrap/cargo supports. Each gross/tare/payload/count/distance native operand has independent unit/basis/method/state/time/source and conversionfactor/unit/source. Per-record share from native compatible cohort/alluser driver stays inside summand;no bag gross+pellet/pack content double load."
      inputs:
        - "unique load/leg"
        - "EACH/TOTAL/count"
        - "gross/noncargo tare/direct payload"
        - "cargo pack/support"
        - "distance/conversions"
        - "THAT-record share/drivers"
        - N
        - cp_freight
      output: "kg*km per service reference"
      source_ids: []
