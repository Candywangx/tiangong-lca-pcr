system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The single foreground responsibility preserves received usable cut flowers under a documented species-specific refrigerated/wet-or-dry regime and hands over an accepted wholesale consignment. Its before-state is purchased fresh cut flowers at intake, its maintained after-state is flowers meeting the declared buyer gate. Intake condition failures, cold-chain excursions, treatment events, cleaning/changeovers and all actual reject/return exits stay attributed to this responsibility. Asset manufacture, maintenance, replacements and end-of-life span the actual service periods."
      source_ids: []
    - rule_id: boundary_service
      applies_to: "all inventory"
      rule: "This is a service add-on. Exclude upstream production of saleable AND lost merchandise. Keep all actual service resources, direct releases and loss-handling/treatment burdens. Before a whole-chain package is complete, quantify and link lost-commodity upstream burdens exactly once in the separate commodity system; this service alone is not a full cut-flower footprint."
      source_ids: []
    - rule_id: boundary_preservation
      applies_to: "preserved_wholesale"
      rule: "Declare actual species-specific preserved state, room and lot temperature/humidity records, ethylene control, hydration/dry route and actual chemical identity. Source examples do not impose a universal temperature, concentration, shelf life or treatment permission."
      source_ids:
        - umass-cutflower-handling
        - ucdavis-gladiolus-2004
    - rule_id: boundary_coverage
      applies_to: "all actual responsibilities"
      rule: "Register the owner of each on-site, provider, freight, refrigeration, maintenance and disposal burden; include each actual resource exactly once. Unknown provider or direct environmental scope blocks final data completeness."
      source_ids: []
    - rule_id: boundary_outlets
      applies_to: "all outlets"
      rule: "Track saleable/downgraded/returned merchandise only in the merchandise ledger; neither returns nor discards generate a second wholesale-service output. Actual uncontained water/chemical/fuel losses require dedicated actual medium/substance exchanges and evidence, not silence or assumed zero."
      source_ids: []
