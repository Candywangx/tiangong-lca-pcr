validation_rules:
  - rule_id: validate_completion
    applies_to: "accepted_service"
    rule: "Require actual own-account B2B accepted commercial completion,all qualifiers and positive unique N. Appliance Count,pack Count,energy labels and refrigerant charge are not this Count service."
    source_ids: []
  - rule_id: validate_unpowered
    applies_to: "normal operation"
    rule: "Evidence manufacturer/model/serial,unpowered state,actual pack/transit/circuit/constituent condition. No user operating energy,cooling/defrosting,installation,recovery or repair is assumed; actual extra work requires declared reviewed inventory."
    source_ids:
      - bosch-fridge-safety
  - rule_id: validate_factory_fates
    applies_to: "incident and inherited materials"
    rule: "Factory source material/species/quantity/unit/state/provenance and actual retained/usable/waste/absorbed/direct fates must be supported. Risk label,charge amount,odour or deficit is not release. Require explicit quantities/units/states/sources/conversions and transfer/exclusion links for material retained in whole-appliance Waste and part Waste; these are content audits,not extra fluid outputs. Every other source/fate quantity must have joined native unit/state/source/conversion evidence or explicitly documented compatible shared-source applicability. No factory production duplicated as makeup,unknown discrepancy set to zero,whole and part/fluid outputs doubled,or useful transfer netted from unrelated supplies."
    source_ids: []
  - rule_id: validate_chain
    applies_to: "commodity outside service"
    rule: "Use actual complete released packed household fridge-freezer baseline including cabinet/compressor/electrical/circuit/charge/foam/accessories/pack as actually supplied or assemble missing production once outside service. Original-gate assigned demand/state/loss quantities/conversions/source and exclusive exits/coverage owner/integration must match actual appliance/material states; direct release and receiving treatment inside service once."
    source_ids: []
  - rule_id: validate_native_scope
    applies_to: "all physical duties"
    rule: "Verify concrete native identity/property/unit and complete provider/carrier/shared full-life asset/receiver scope with all-user driver evidence. Actual independent and inherited sources remain distinct; no fuel-specific NCV/GCV factors for generic electricity,no fee-to-Count or consumer appliance life as warehouse-life default. Verified electricity using an ILCD reference property named Net calorific value is allowed on its independently confirmed electrical-energy basis and unit group; the label does not authorize fuel heating-value factors."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete identity and quantitative evidence review"
  downstream_use: "Physical ambient unpowered-appliance own-account wholesale add-on to complete released appliance commodity chain"
  allowed_use: "Actual declared model/serial/configuration,pack/unpowered/circuit/sourcecharge states,period,acceptance and incident strata"
  excluded_use: "Standalone full appliance footprint; operation/demo/coldchain/install/charge/recovery/disassembly/repair; commoditymanufacture; retail/agency; charge=leak or appliance=service conversion"
  required_metadata: "All qualifiers; actual serial/sourcecharge/constituent/pack stock and incident fates; originalgate demand/state/loss/conversion/coverage owner/integration; complete resources/provider/carrier/assets/receiver scopes"
  required_quality_disclosure: "Unresolved actual identities/support,foreground quantities/Range evidence,sourcecharge/fate discrepancies and actual receiver scope,manufacturer user-source limits,lifetime/conversion uncertainty"
  update_trigger: "Changed model/configuration/constituents/charge/source/pack,warehouse operation,actual incident/intervention,provider/asset/carrier/receiver scope,acceptance or loss/fate evidence"
