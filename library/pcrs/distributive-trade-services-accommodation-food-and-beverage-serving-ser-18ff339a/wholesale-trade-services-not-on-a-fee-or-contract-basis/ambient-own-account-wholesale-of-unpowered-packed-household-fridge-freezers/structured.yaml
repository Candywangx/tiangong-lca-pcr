  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "Actual assigned physical quantity / positive unique N once; accepted_service is 1 Item(s)."
      inputs:
        - "assigned quantity"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: supply_stock
      applies_to: "independent supplies and unused_supply_return"
      rule: "S=assigned opening+true external net receipts-closing including retained recovered independent supplies. Gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting the matched output. Internal recovery is not new receipt,no numeric S+return,double deduction or removal of waste/spill upstream burden. Inherited factory-material export belongs to its separate source ledger,never subtracted from independent makeup/cleaning inputs."
      inputs:
        - opening
        - "true receipts"
        - "recovered closing"
        - "matched unused outward"
        - representation
        - cp_materials
      output: "nonduplicated independent supply/return quantities"
      source_ids: []
    - id: full_life_share
      applies_to: "resources/assets/providers"
      rule: "For compatible metered periods,use cohort physical driver/all-user driver on complete resource scope. Complete asset equivalent=compatible cohort driver/complete lifetime driver across users/periods; include manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remainder/termination,units,uncertainty/sensitivity/update. Complete provider representation replaces overlapping own coverage rather than adding it."
      inputs:
        - "meterperiod/resource scope"
        - "cohort/all-user/lifetime driver and unit"
        - "observed/history/remainder/termination/source"
        - cp_assets
      output: "attributed complete resource/asset equivalents"
      source_ids: []
    - id: net_appliance_mass
      applies_to: "nonexchange serial/package"
      rule: "Net appliance mass=sum actual unique physical package instance(gross-original shipping-package tare),converted once by actual mass factor/unit/source. Keep retained charge/foam/accessories inside net product,not another added mass. Use either each-instance data or documented total,not total times count again."
      inputs:
        - "serial/physical package"
        - "gross/tare"
        - "native mass conversion/source"
        - cp_appliances
      output: "net appliance commodity mass,nonexchange audit"
      source_ids: []
    - id: original_gate_assignment
      applies_to: "commodity outside service"
      rule: "Use actual directly measured/traced assigned source quantity/unit/state/source with direct evidence; otherwise assigned quantity=actual original-gate quantity*compatible source cohort driver/source all-exit driver,with positive complete denominator,units,allocation method/source. Do not add direct and allocated views. Original-gate whole/partial demand/loss matches actual appliance/material states and source conversions/coverage owner,integration once outside service."
      inputs:
        - "originalgate quantity/unit/state/source"
        - "direct evidence OR method/source/cohort/allexitdrivers/units"
        - assignedquantitysource
        - "conversion/loss/coverage owner"
        - cp_appliances
      output: "reproducible source-gate assigned commodity quantity"
      source_ids: []
    - id: packed_freight
      applies_to: "actual_freight"
      rule: "For actual legs,sum[(measured packed cargo native load*load-to-kg factor)*(actual distance*distance-to-km factor)*actual share]/N. Packed cargo includes factory/additional cargo packing and retained constituents; measured vehicle/noncargo tare role excludes only noncargo,not product packing. Factors and allocated share have compatible units/source/all-user drivers; no appliance plus constituent cargo double count."
      inputs:
        - "actual packedload/state or gross-noncargo tare"
        - "native load/distance"
        - "factors/units/sources"
        - "share/all-user drivers"
        - N
        - cp_transport
      output: "kg*km per reference service"
      source_ids: []
    - id: inherited_constituent_fates
      applies_to: "cp_incident and actual inherited outlets"
      rule: "For each actual source material/species,state and period,source retained/opening+actual received-in-appliance quantity=accepted/returned/closing retained quantity+material retained in actual whole-appliance waste+material retained in actual part waste+actual usable separate export+independent contained waste+absorbed contents already in other waste+actual direct release+explicit unresolved discrepancy,using exclusive compatible native units and evidence. Internal recovery/transfer is internal,not a new receipt/export. Quantify release by direct measurement or supported compatible actual activity*factor; only an incomplete whole-fluid factor needs actual component/fate fractions,not a complete species-specific factor. Retained-in-whole/part-waste terms are nonadditive content audits of linked existing physical Waste outlets,not new fluid Waste exchanges or a second mass/treatment quantity. No discrepancy is automatically air or destroyed; receiver-treatment emissions including those retained materials remain receiver scope once. Each source/received/retained/accepted/returned/closing/whole-waste-content/part-waste-content/usable/contained/absorbed/direct/unknown quantity operand must have an identified fate record with native unit,state,source and actual compatible conversion factor/unit/source. A shared source unit/state is permitted only with explicit applicability and compatibility evidence for every joined operand; no unit/state/source is inferred."
      inputs:
        - "source species/quantity/unit/state/source"
        - "retained stocks"
        - "material retained in whole-appliance and part Waste with transfer/exclusion links"
        - "real exports/waste/absorption exclusions"
        - "per-operand native unit/state/source/conversion record"
        - "direct measurement OR activity/factor/composition/fate units/bases/sources"
        - "receiver owner"
        - cp_incident
      output: "nonduplicated inherited stock/fate quantities and actual species release"
      source_ids: []
