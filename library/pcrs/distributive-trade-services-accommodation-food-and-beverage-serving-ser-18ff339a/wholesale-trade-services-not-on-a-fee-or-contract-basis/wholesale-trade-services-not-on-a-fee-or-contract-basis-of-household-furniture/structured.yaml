    rule: "Reconcile attributed opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,other exits,actual whole/part discard and retained usable parts without double counting parent and children. Internal quarantine/incomplete movements are not external exits. Quantify original finished-kit demand/loss and state conversion by actual package/component material/mass/tare evidence,owner/existing loss coverage and actual integration result outside service. Raw wood/board alone omits finished parts,coatings,hardware and packaging."
