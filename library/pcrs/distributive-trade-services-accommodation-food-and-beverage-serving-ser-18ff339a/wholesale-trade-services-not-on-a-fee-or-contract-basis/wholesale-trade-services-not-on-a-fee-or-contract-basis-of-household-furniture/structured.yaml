validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Actual title purchase/resale,B2B acceptance,all qualifiers and positive unique N required. Neither finished-kit Count,child-package Count nor hardware piece Count binds the service reference."
    source_ids: []
  - rule_id: validate_configuration
    applies_to: "kit stock"
    rule: "Require manufacturer configuration,required versus separately sold parts,actual parent/child links,package/component quantities and mass/tare/material state; no universal package number or missing-part-to-wholekit loss factor."
    source_ids:
      - ikea-platsa-kit-public
  - rule_id: validate_chain
    applies_to: "commodity outside addon"
    rule: "Original baseline must match actual released finished packaged unassembled kit and include relevant board/wood processing,finish/lamination,part/hardware manufacture,preparation/completeness and original packaging once,assembling missing stages outside service. Assigned original-gate demand/state/loss quantity/unit/basis/conversion/source,exclusive exits,owner/already-covered loss and actual integration result must close."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "all service duties"
    rule: "Actual native units/support and full resource/provider/carrier/full-life asset/receiver coverage are mandatory. No user assembly/wall fix/care process or product operating lifetime becomes merchant data. Extra actual treatment/repair/conditioning needs reviewed expansion."
    source_ids:
      - ikea-platsa-kit-public
  - rule_id: validate_physical_fates
    applies_to: "actual outputs"
    rule: "Require actual mutually exclusive whole/part/material/retained-fluid records and receiver treatment. Stock deficit,odour,product resin content and dampness are not measured waste,formaldehyde,VOC,dust or evaporation. Verify actual species/activity/factor/composition/fate units,bases and sources."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity and quantitative review"
  downstream_use: "Ambient physical own-account wholesale add-on for complete released flatpack bedside-kit commodity chain"
  allowed_use: "Actual declared manufacturer configuration,package/part/hardware completeness,mixed-material/net/tare/state and commercial acceptance stratum"
  excluded_use: "Standalone whole furniture footprint; raw wood/board or furniture manufacture; office/seating; assembly/install/repair/repack or productuse; retail/agency; package/kit-to-service or money proxy"
  required_metadata: "All qualifiers; actual parent/child stock and fates; original-kit assigned demand/state/loss conversion/exits/coverage owner/integration; complete resources/assets/providers/carriers/receivers"
  required_quality_disclosure: "Unresolved actual identities/support,foreground quantities/Range evidence,configuration/material/state/fate/source limits and lifetime/conversion uncertainty"
  update_trigger: "Changed kit/configuration/package/hardware/material,warehouse operation,actual extra treatment,provider/asset/carrier/receiver scope,acceptance or demand/loss conversion evidence"
data_sources:
  - id: "unsd-cpc3-furniture"
    type: "official_guidance"
    reference: "UNSD.CPC3.0 explanatory notes,division61,61041; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Household furniture381 excluding38111and3812; wooden bedroom38170 fits narrower category,classification only."
