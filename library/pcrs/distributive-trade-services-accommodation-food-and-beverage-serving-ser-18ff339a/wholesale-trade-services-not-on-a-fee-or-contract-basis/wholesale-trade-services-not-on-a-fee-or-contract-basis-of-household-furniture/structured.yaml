  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "Actual attributed physical quantity / positive unique N once; accepted_service is 1 Item(s)."
      inputs:
        - "attributed quantity"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: supply_stock
      applies_to: "supplies and unused_supply_return"
      rule: "S=assigned opening+true external net receipts-closing including retained recovered supplies. Choose gross supply INPUT S with separate same-scope matched unused external OUTPUT OR consumed-only INPUT S-return omitting that same outward exchange. Internal recovery is not receipt; no numerical S+return input,double deduction,unrelated negative input or removal of waste/spill upstream burden."
      inputs:
        - opening
        - "true external net receipts"
        - "closing including retained recovery"
        - "matched same-scope return"
        - representation
        - cp_materials
      output: "nonduplicated supplied/returned quantity"
      source_ids: []
    - id: fullscope_share
      applies_to: "resources/assets/providers/freight"
      rule: "Compatible-period resource attribution uses cohort physical driver/all-user driver on complete actual scope. Asset equivalent uses compatible cohort driver/complete lifetime driver across all users/periods with full manufacture,maintenance/cleaning,replacements and EOL. Evidence observed life or history plus sourced remaining use/termination,units,uncertainty,sensitivity/update. Complete external provider is an alternative to covered own resources/assets,not another additive burden."
      inputs:
        - "actual period/resource"
        - "cohort/all-user/lifetime drivers/units"
        - "history/remainder/termination sources"
        - "scope owner"
        - cp_assets
      output: "attributed resources and full-life asset equivalents"
      source_ids: []
    - id: original_kit_demand_loss
      applies_to: "commodity outside service"
      rule: "ALL finished furniture/component/hardware and inherited packaging manufacture,including lost commodity upstream,is excluded from service exchanges. Before whole-chain completeness,integrate the complete compatible released flatpack-kit baseline and quantified original-gate assigned demand/state change/whole-part loss,other exits,owner/already-included coverage exactly once outside this add-on. Actual handling and receiving treatment of real losses remain inside once. Reconcile attributed opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,other exits,actual whole/part discard and retained usable parts without double counting parent and children. Internal quarantine/incomplete movements are not external exits. Quantify original finished-kit demand/loss and state conversion by actual package/component material/mass/tare evidence,owner/existing loss coverage and actual integration result outside service. Raw wood/board alone omits finished parts,coatings,hardware and packaging."
      inputs:
        - "original finished dataset/gate"
        - "assigned demand quantity/unit/state"
        - "kit/child/part fates"
        - "material/net/tare conversion/source"
        - "other exits/coverage/owner/integration result"
        - cp_kits
      output: "quantified original-gate finished demand/loss burden outside service"
      source_ids: []
    - id: calc_net_kit_mass
      applies_to: "nonexchange kit physical mass"
      rule: "Net complete-kit mass = sum over actual unique physical child-package instances of (gross package mass - actual original-package tare),each converted once to compatible kg by its evidenced factor/unit/source. Use either per-instance readings OR documented total expanded to unique instances,never multiply an already-total mass by package quantity. Net kit includes actual hardware/mixed finished components,not only board. Parent kit and constituent component/material views are not added again; missing instance prevents a complete-kit mass claim until resolved."
      inputs:
        - "unique physical package instance"
        - "each/total flag"
        - "gross/tare"
        - "native mass/conversion units/factor/source"
        - "component/hardware inclusion"
        - cp_kits
      output: "nonduplicated net finished-kit kg,nonexchange stock audit"
      source_ids: []
    - id: calc_original_assignment
      applies_to: "original commodity gate outside service"
      rule: "If direct assigned source quantity is actually measured/traced,use that quantity/unit/state/source and direct-assignment evidence. Otherwise assigned source quantity = actual original-gate quantity * compatible source cohort driver / source all-exit driver,with declared allocation method/source,positive complete denominator,units and exclusive exit coverage. Do not add direct and allocated representations. Convert whole/partial component losses to the same actual finished-kit gate using measured conversion/state sources; source demand and already-covered loss integrate once outside service."
      inputs:
        - "original gate quantity/unit/state/source"
        - "direct assignment evidence OR allocation method/source/cohort and all-exit drivers/units"
        - "assigned quantity source"
        - "source conversions"
        - cp_kits
      output: "reproducible attributed original-gate commodity quantity,not service exchange"
      source_ids: []
    - id: calc_packed_freight
      applies_to: "assigned_freight"
      rule: "For each actual leg,freight per reference = sum [(actual packed payload in native load unit * evidenced load-to-kg factor) * (actual distance * evidenced distance-to-km factor) * actual attribution share] / positive N. Establish packed payload by measured complete packed cargo,or measured gross load minus vehicle/noncargo tare with declared tare role; retain factory and added cargo packaging in payload. Each factor/share has compatible unit/basis/source and all-user driver evidence where allocated. Never add kit parent and child loads,substitute assembled dimensions/net board mass,or repeat carrier-owned included resources."
      inputs:
        - "actual gross/vehicle-noncargo tare or packed payload/state"
        - "native load/distance"
        - "conversion factors/units/sources"
        - "actual share/all-user drivers"
        - N
        - cp_transport
      output: "assigned kg*km per service reference"
      source_ids: []
