      raw_fields: "site_id; cohort_id; period_id; meter_id; utility_source; provider; meter_unit; opening_reading; closing_reading; import_quantity; export_quantity; direct_submeter_quantity; conversion; conversion_source; all_consumers; all_periods; consumer_driver; total_driver; driver_unit; driver_basis; driver_source; allocation_rationale; handling_events; occupied_space; space_unit; start_time; end_time; duration; duration_unit; idle_quantity; hygiene_event_id; breach_cleanup_event_id; equipment_charging_coverage; actual_water_source; recirculation; actual_makeup; provider_overlap; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use actual source import/export or matched submeter and disjoint interval. Attribute all-consumer causal handling/space-time or justified driver including idle/hygiene/failed/open work. No manufacturing dryer/cooking-water load or unreviewed dedicated climate intervention. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh; m3; actual meter/driver units"
      frequency: "each matched actual meter/consumer/event interval"
      temporal_coverage: "All service source intervals, consumers and idle/cleaning/open cohorts"
      site_scope: "Actual direct utility and supply treatment boundary excluding provider overlap"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration/source directions and real all-user driver evidence/rationale"
    - protocol_id: cp_provider
      process_id: "ambient_wholesale"
      flow_role: "actual physical service package"
      record_type: "physical_package_record"
      raw_fields: "provider_id; package_id; native_quantity; native_unit; package_definition; equivalent_conversion; conversion_source; site_id; cohort_id; event_id; period_id; actual_start; actual_end; duration; duration_unit; included_energy; included_materials; included_assets; included_transport; included_treatment; excluded_resources; direct_overlap; other_provider_overlap; actual_completion; uncertainty"
      collection_method: "Obtain actual complete physical package/native unit and completed quantity, with full resource/result scope. Match direct/provider/carrier/treatment/asset owners once. Actual pasta treatment/repacking is outside and must be reviewed, not hidden in package."
      unit: "Item(s) equivalent or actual separately expanded native unit"
      frequency: "each completed physical provider event"
      temporal_coverage: "Actual package source/operation/treatment periods"
      site_scope: "Named actual physical provider package and explicit exclusions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual contract/completion/native conversion and scope matrix"
    - protocol_id: cp_assets
      process_id: "ambient_wholesale"
      flow_role: "full-life warehouse/handling infrastructure"
      record_type: "asset_lifetime_driver_record"
      raw_fields: "asset_id; asset_type; asset_identity; asset_equivalent_unit; dataset_scope; manufacture_coverage; maintenance_coverage; replacements; replacement_unit; retirement; end_of_life; history_start; history_end; observed_driver; observed_driver_unit; remaining_driver; remaining_driver_unit; remainder_source; life_driver; life_driver_unit; job_driver; job_driver_unit; all_consumers; all_periods; driver_basis; driver_source; reuse_cycles; actual_turns; uncertainty; sensitivity; update_trigger; direct_event_scope; provider_asset_coverage; carrier_asset_coverage; overlap_owner; conversion; conversion_source"
      collection_method: "Identify actual whole assets and matching full-life dataset. Include complete manufacture, maintenance, actual replacement/retirement/EOL, observed all-user history plus evidenced remainder and uncertainty/sensitivity/update. Compatible job/life driver units and direct/provider/carrier scope avoid per-turn pallet manufacture or rent duplicate."
      unit: "Item(s) equivalent; actual compatible all-consumer lifetime driver units"
      frequency: "each actual asset period/maintenance/replacement/retirement review"
      temporal_coverage: "Full manufacture-to-EOL history/remainder and all consumers/periods"
      site_scope: "One actual complete asset responsibility with explicit overlap ownership"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset coverage/history/source-backed remainder and driver units/uncertainty"
    - protocol_id: cp_freight
