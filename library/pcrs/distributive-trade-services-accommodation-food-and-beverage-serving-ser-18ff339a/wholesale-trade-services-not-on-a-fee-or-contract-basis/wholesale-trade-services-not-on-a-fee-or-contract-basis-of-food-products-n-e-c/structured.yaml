      record_type: "shipment_work_record"
      raw_fields: "shipment_id; carrier_id; mode; supplier_gate; destination_gate; cohort_id; consignment_id; period_id; actual_start; actual_end; as_transported_pasta_mass; primary_pack_mass; inherited_outer_mass; added_pack_mass; transported_pallet_support_mass; mass_unit; whole_payload_mass; route_distance; distance_unit; load_share; share_basis; share_source; multi_drop_coverage; empty_leg_coverage; return_coverage; native_work_unit; work_conversion; conversion_source; carrier_energy_scope; carrier_asset_scope; direct_overlap; uncertainty"
      collection_method: "Collect actual as-transported pasta plus disjoint primary/inherited/added pack and supports, real route distance and matched load share. Record empty/multi-drop/return coverage and native work conversions; carrier embedded energy/assets counted once."
      unit: "kg*km; actual payload/distance/native-work units"
      frequency: "each actual shipment and real return leg"
      temporal_coverage: "Actual agreed transport gates including matching empty/return periods"
      site_scope: "Named carrier work dataset coverage and exclusions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Real load/route/share records and compatible conversions"
    - protocol_id: cp_outlets
      process_id: "ambient_wholesale"
      flow_role: "collected pasta/pack/cleanup/liquid outlets"
      record_type: "outlet_receiver_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; stream_id; material_identity; stream_state; classification; gross_quantity; tare_quantity; net_quantity; quantity_unit; moisture_value; moisture_basis; moisture_method; moisture_source; remaining_pasta; remaining_pasta_unit; composition; composition_basis; composition_source; retained_fluid; intact_pack_exclusion; loose_pasta_exclusion; separate_pack_exclusion; density; density_unit; density_temperature; density_source; volume; volume_unit; conversion; conversion_source; pollutant_load; pollutant_unit; load_source; collection_method; receiver; transfer_id; receiver_acceptance; treatment_route; treatment_scope; provider_coverage; direct_release_exclusion; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Measure actual separated loose pasta, packaging, mixed cleanup solids or contained cleaning liquid in native state. Declare moisture/remaining contents and nonadditive composition view; avoid intact whole-pack/component duplicates and retained-stock exports. Receiver classification/acceptance/treatment and provider boundary once; pollutant load independent evidence. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "kg; m3; actual stream-state/native units"
      frequency: "each actual collection/transfer and receiver acceptance"
      temporal_coverage: "All actual cleanup/loss/receiver periods with retained stocks separate"
      site_scope: "Actual contained receiver interface, not direct environmental emission"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual net measures/moisture/density/composition/load sources and receiver treatment"
    - protocol_id: cp_environment
      process_id: "ambient_wholesale"
      flow_role: "actual direct species and receiving medium"
      record_type: "direct_species_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; substance_identity; particle_size; receiving_medium; release_state; measured_mass; measured_mass_unit; activity; activity_unit; species_factor; factor_unit; factor_source; factor_scope; factor_complete; measured_whole_stream_release; whole_stream_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; temperature; temperature_unit; pressure; pressure_unit; density; density_source; conversion; conversion_source; retained_captured_quantity; receiver_treatment_coverage; applicability; calibration; uncertainty"
      collection_method: "Establish actual species/particle size where relevant and receiving medium before identity selection. Choose measured species mass OR applicable matched activity/factor OR actual whole-stream composition/fate with native conversions. Complete species factor forbids extra composition/fate. Captured fines/contained waste/unknown weight deficit are not direct release."
      unit: "kg species; all actual activity/whole-stream/concentration native units"
      frequency: "each actual release event or justified matched monitoring interval"
      temporal_coverage: "Actual release period and evidence applicability, no stock-residual proxy"
      site_scope: "Named direct environment interface excluding receiver-contained treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement/calibration or matched factor/composition/fate sources and conversion uncertainty"
  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_pasta
      output: "One actual completed service qualified by product/pack/date/moisture/time/gate"
      source_ids: []
    - id: pasta_content_moisture
      applies_to: "non-exchange pasta audit"
      rule: "net_pasta_mass=gross_quantity-primary_pack_tare-outer_pack_tare-pallet_support_tare on compatible boundary. Convert actual reported moisture to fraction with source; dry_matter_quantity=net_pasta_mass*(1-moisture_fraction) only for wet-basis fraction, OR net_pasta_mass/(1+moisture_fraction) for dry-basis moisture. Use actual stated basis/method/sample/time; dry-matter and as-received views are not additive exchanges."
      inputs:
        - cp_pasta
      output: "Actual contents/tare and moisture-basis analytical audit"
      source_ids: []
    - id: finished_gate_demand
      applies_to: "non-exchange source gate"
      rule: "assigned_source_gate_quantity=actual compatible evidenced source_gate_input_quantity allocation/conversion to accepted cohort, including evidenced assigned_moisture_state_change_share while excluding quantities exclusively assigned to returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service. Reconcile actual loss_adjustment_quantity/unit/basis/source/owner with already_included_loss_coverage once; final mass+discard shortcut and wet-deficit loss inference prohibited."
      inputs:
        - cp_pasta
        - N
      output: "Separate finished dried/packed demand and actual compatible upstream-loss interface"
      source_ids: []
    - id: new_supply_stock
      applies_to: "hygiene/packing supplies; unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross input S/N plus separate matching usable_outward_return/N OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted. Retained recovery included in closing; actual native conversion sources required."
      inputs:
        - cp_supplies
        - N
      output: "Actual supply and chosen unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for disjoint all-user intervals including idle/hygiene/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only with actual matching physical completed unit and complete resource scope once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver in compatible units and complete all-consumer history/evidenced remainder with actual replacement/EOL; one view, no duplicate normalization."
      inputs:
        - cp_assets
        - N
      output: "Compatible complete asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=as_transported_pasta_mass+primary_pack_mass+inherited_outer_mass+added_pack_mass+transported_pallet_support_mass with disjoint real load components; freight_work=whole_payload_mass*route_distance*load_share/N after actual native conversion and exclusive empty/return coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual complete-load transport work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "intact_pack_waste=intact_waste_transfer_mass/N for actual intact whole-pack transfer. Other outlet_quantity=(gross_quantity-tare_quantity)/N in actual native stream units or actual volume/N, with moisture/composition/density-temperature basis as needed. Whole-stream and component views do not duplicate; retained stock/internal movement not outward transfer."
      inputs:
        - cp_pasta
        - cp_outlets
        - N
      output: "Disjoint actual contained outlet quantities and receiver treatment per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible sourced native conversions, one method selected. factor_complete prevents extra composition/fate, whole-stream/species outputs not physically duplicated."
      inputs:
        - cp_environment
        - N
      output: "Actual species mass with receiving medium per reference flow"
      source_ids: []
