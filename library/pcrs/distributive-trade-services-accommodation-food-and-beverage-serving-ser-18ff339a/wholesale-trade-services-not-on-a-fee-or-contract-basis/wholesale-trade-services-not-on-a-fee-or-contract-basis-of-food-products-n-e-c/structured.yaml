allocation_rules:
  - rule_id: source_gate_quantity
    applies_to: "merchandise"
    rule: "Assign actual finished dried/packed original-gate input to accepted consignment/cohort on compatible state/unit/moisture basis with source and explicit allocation/conversion. Include evidenced originally supplied material and ordinary moisture/state-change share without assuming it is dry pasta loss; returns/closing/other exits exclusively assigned. Final dispatch mass plus measured discarded dry material cannot replace original-gate demand. Quantify compatible actual loss adjustment once outside service under one owner and check already-included loss coverage. Unknown wet-weight deficit is unresolved, not default loss or zero."
    source_ids: []
  - rule_id: all_consumer_driver
    applies_to: "warehouse periods"
    rule: "Use actual source interval and all-consumer/event/period causal handling/occupied-space-time or other justified driver with native unit/source/rationale, including idle/hygiene/failures/open cohorts. Equal consignment or pasta mass shares not presumed; unfinished resources carry without fictitious N."
    source_ids: []
  - rule_id: new_supply_returns
    applies_to: "new service supplies"
    rule: "S=opening_supply+net_receipts-closing_supply. Gross input S/N with actual matching native unused outward return separately output OR consumed-only (S-usable_outward_return)/N with that return exchange omitted and no additional deduction. Require same-scope standalone supplystock match; retained recoveries belong to closing, inherited merchandise/asset content cannot reduce unrelated current supply."
    source_ids: []
  - rule_id: full_lifetime_assets
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N for compatible complete whole asset across all consumers/periods. Include manufacture/maintenance/actual replacements/retirement/end-of-life and observed history plus source-backed remainder, uncertainty/sensitivity/update. Remove direct/provider current-event overlaps only when same physical burden covered once elsewhere; no new pallet every turn or duplicate rent/asset view."
    source_ids: []
  - rule_id: actual_fates
    applies_to: "all real outlets"
    rule: "Usable commercial return and retained rejection are commodity stocks/exits, not negative service. Intact whole-pack waste and actual separate loose pasta/pack/mixed cleanup/liquid streams are exclusive physical states. Record actual native composition/fate/receiver; component analyses do not add duplicate physical transfers or species. Treatment ownership once, no assumed recycling/substitution credit."
    source_ids: []
