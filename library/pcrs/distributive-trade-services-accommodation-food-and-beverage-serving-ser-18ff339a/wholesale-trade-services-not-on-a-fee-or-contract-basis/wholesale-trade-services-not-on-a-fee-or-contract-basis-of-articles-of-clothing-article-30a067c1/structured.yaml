      raw_fields: "site_id; cohort_id; period_id; meter_id; utility_source; provider; meter_unit; opening_reading; closing_reading; import_quantity; export_quantity; direct_submeter_quantity; conversion; conversion_source; all_consumers; all_periods; consumer_driver; total_driver; driver_unit; driver_basis; driver_source; allocation_rationale; handling_events; occupied_space; space_unit; start_time; end_time; duration; duration_unit; idle_quantity; hygiene_event_id; equipment_charging_scope; actual_water_source; recirculation; actual_makeup; provider_overlap; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use actual import/export interval or matched submeter and disjoint scopes. Attribute complete all-user handling/space-time or justified driver, including idle/hygiene/failed/open resources. No garment wash/steam or unreviewed dedicated climate load; actual water supply separately evidenced. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh; m3; actual meter/driver units"
      frequency: "each matched actual meter/user/event interval"
      temporal_coverage: "All service source periods/users and idle/hygiene/open cohorts"
      site_scope: "Actual direct utility/supply treatment scope excluding provider overlap"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated real source direction/interval and full causal consumer-driver evidence"
    - protocol_id: cp_provider
      process_id: "ambient_wholesale"
      flow_role: "physical warehouse provider packages"
      record_type: "physical_package_record"
      raw_fields: "provider_id; package_id; native_quantity; native_unit; package_definition; equivalent_conversion; conversion_source; site_id; cohort_id; event_id; period_id; actual_start; actual_end; duration; duration_unit; included_energy; included_materials; included_assets; included_transport; included_treatment; non_product_contact_scope; excluded_resources; direct_overlap; other_provider_overlap; actual_completion; uncertainty"
      collection_method: "Collect actual completed equivalent physical unit and full resource/result scope. Non-product-contact monitoring/sanitation distinguished from real garment treatment/opening/repair, which requires route extension. Direct/provider/carrier/asset/receiver ownership reconciled once."
      unit: "Item(s) equivalent or actual appropriately expanded native unit"
      frequency: "each completed actual provider event"
      temporal_coverage: "All package source/operation/treatment periods"
      site_scope: "Named physical warehouse provider scope with explicit exclusions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual completion/native conversion/contract resource and overlap matrix"
    - protocol_id: cp_assets
      process_id: "ambient_wholesale"
      flow_role: "full-life warehouse/reusable handling infrastructure"
      record_type: "asset_lifetime_driver_record"
      raw_fields: "asset_id; asset_type; asset_identity; asset_equivalent_unit; dataset_scope; manufacture_coverage; maintenance_coverage; replacements; replacement_unit; retirement; end_of_life; history_start; history_end; observed_driver; observed_driver_unit; remaining_driver; remaining_driver_unit; remainder_source; life_driver; life_driver_unit; job_driver; job_driver_unit; all_consumers; all_periods; driver_basis; driver_source; reuse_cycles; actual_turns; uncertainty; sensitivity; update_trigger; direct_event_scope; provider_asset_coverage; carrier_asset_coverage; overlap_owner; conversion; conversion_source"
      collection_method: "Identify actual warehouse/racks/handlers/reusable bins/pallets/scales/monitor assets with matching full lifecycle manufacture/maintenance/real replacement/retirement/EOL. Observe complete all-user history and source remainder; compatible job/life driver units, uncertainty/update and physical overlaps explicit. No per-turn manufacture or rent duplication."
      unit: "Item(s) equivalent; actual compatible lifetime/job-driver native units"
      frequency: "each actual asset period/maintenance/replacement/retirement review"
      temporal_coverage: "Full manufacture-to-EOL and all users/periods with history+sourced remainder"
      site_scope: "One real complete asset burden owner, direct/provider/carrier overlaps once"
      aggregation_rule: "per reference flow"
      quality_evidence: "Full scope/history/remainder source, native drivers and uncertainty/sensitivity"
    - protocol_id: cp_freight
      process_id: "ambient_wholesale"
      flow_role: "complete as-transported garment load"
      record_type: "shipment_work_record"
      raw_fields: "shipment_id; carrier_id; mode; supplier_gate; destination_gate; cohort_id; consignment_id; period_id; actual_start; actual_end; garment_payload_mass; integral_trim_scope; primary_pack_mass; inherited_outer_mass; added_pack_mass; transported_support_mass; mass_unit; whole_payload_mass; route_distance; distance_unit; load_share; share_basis; share_source; multi_drop_coverage; empty_leg_coverage; return_coverage; native_work_unit; work_conversion; conversion_source; carrier_energy_scope; carrier_asset_scope; direct_overlap; uncertainty"
      collection_method: "Collect real as-transported whole garment mass including trims, disjoint primary/inherited/added packing/supports, actual route distance/share and empty/return/multi-drop scope. Avoid wool fraction or dry-fibre replacing payload and avoid carrier energy/assets duplicated directly."
      unit: "kg*km; actual payload/distance/native work units"
      frequency: "each actual shipment/return leg"
      temporal_coverage: "Agreed real gates and corresponding empty/return periods"
      site_scope: "Named actual carrier work/resource coverage"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual compatible load/route/share and native conversions"
    - protocol_id: cp_outlets
      process_id: "ambient_wholesale"
      flow_role: "actual separated packing/hygiene/liquid receivers"
      record_type: "outlet_receiver_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; stream_id; material_identity; stream_state; classification; gross_quantity; tare_quantity; net_quantity; quantity_unit; remaining_garment_inclusion; transferred_pack_exclusion; composition; composition_basis; composition_source; retained_fibre; retained_fibre_unit; retained_moisture; retained_moisture_unit; retained_moisture_basis; retained_moisture_method; retained_moisture_source; retained_moisture_sample_time; retained_fluid; retained_fluid_unit; retained_fluid_basis; retained_fluid_source; density; density_unit; density_temperature; density_temperature_unit; density_source; volume; volume_unit; conversion; conversion_source; pollutant_load; pollutant_unit; load_source; collection_method; receiver; transfer_id; receiver_acceptance; treatment_route; treatment_scope; provider_coverage; direct_release_exclusion; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure actual separately damaged/removed outer pack, mixed used hygiene solids/captured fibres or contained surface-cleaning liquid in declared native stream state. Component/retained-fibre/moisture analyses nonadditive; actual garment-associated pack transferred already excluded. Receiver classification/acceptance/treatment and resource scope once, no laundry/washing inferred. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg; m3; actual native stream units"
      frequency: "each actual collection/transfer/receiver acceptance"
      temporal_coverage: "Real residue/cleaning/receiver periods, retained stock separate"
      site_scope: "Actual contained receiver interface excluding direct environmental releases"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measured net stream/density/composition/moisture/load and real receiver treatment evidence"
    - protocol_id: cp_environment
      process_id: "ambient_wholesale"
      flow_role: "actual direct species and receiving medium"
      record_type: "direct_species_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; substance_identity; particle_size; receiving_medium; release_state; measured_mass; measured_mass_unit; activity; activity_unit; species_factor; factor_unit; factor_source; factor_scope; factor_complete; measured_whole_stream_release; whole_stream_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; temperature; temperature_unit; pressure; pressure_unit; density; density_unit; density_source; conversion; conversion_source; retained_captured_quantity; receiver_treatment_coverage; applicability; calibration; uncertainty"
      collection_method: "Identify actual species/particle/medium before exchange identity. Measured species mass OR justified matched activity/factor OR measured whole-stream composition/fate with native conversion and applicability. Complete factor not multiplied by composition/fate again. Captured/contained materials, garment blend labels and moisture/condition observations alone do not establish a direct release or its absence. Actual species/medium and release evidence remain required; do not assume zero."
      unit: "kg species; actual native activity/whole-stream/concentration units"
      frequency: "each actual direct event or justified matched observation interval"
      temporal_coverage: "Real release periods and source applicability, no inventory-residual proxy"
      site_scope: "Named actual direct environmental interface excluding contained receiver treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated measurement or matched factor/composition/fate and conversion evidence"
  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_garment
      output: "One actual complete commercial service with garment/style/size/composition/condition/time qualifiers"
      source_ids: []
    - id: garment_component_audit
      applies_to: "non-exchange garment"
      rule: "net_garment_mass=gross_quantity-primary_pack_tare-external_label_insert_tare-outer_pack_tare-pallet_support_tare, keeping actual integral trims/internal labels in garment net mass. Component dry mass, if genuinely needed and representatively measured, uses actual component_mass and compatible component moisture_fraction: component_dry_mass=component_mass*(1-moisture_fraction) for wet basis OR component_mass/(1+moisture_fraction) for dry basis. Apply actual component_fibre_fraction only on matching declared fraction_basis; do not multiply whole as-received trimmed garment by label wool percentage. Analytical views nonadditive."
      inputs:
        - cp_garment
      output: "Actual whole garment/tare/component/composition/moisture audit, no new manufacturing exchange"
      source_ids: []
    - id: finished_gate_demand
      applies_to: "non-exchange commodity"
      rule: "assigned_source_gate_quantity=actual compatible evidenced source_gate_input_quantity allocation/conversion to accepted cohort, including evidenced assigned_moisture_state_change_share, excluding exclusive returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service. Actual loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once. Unknown differences not actual loss or species."
      inputs:
        - cp_garment
        - N
      output: "Separate factory-finished packed demand and quantified compatible upstream-loss interface"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service supplies and unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross supply S/N with separate matched usable_outward_return/N OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted; retained recovery in closing, original scope/native units and conversion sources matched."
      inputs:
        - cp_supplies
        - N
      output: "Actual supplies and one selected unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for real disjoint all-user periods including idle/hygiene/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual attributable purchased utilities per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only for actual matching physically complete package, resources owned once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent completed packages per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver with compatible native units, all-user full history/sourced remainder and actual lifecycle coverage, one view/no double normalization."
      inputs:
        - cp_assets
        - N
      output: "Complete actual asset equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=garment_payload_mass+primary_pack_mass+inherited_outer_mass+added_pack_mass+transported_support_mass with garment integral trims already included and all components disjoint; freight_work=whole_payload_mass*route_distance*load_share/N after real conversion/exclusive return/empty coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual complete-load transport work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "garment_waste=actual_discard_stream_mass/N on actual garment+associated-pack state if transferred together. Other outlet_quantity=(gross_quantity-tare_quantity)/N in actual native unit or actual volume/N with supported density-temperature as needed. Exclude already-transferred garment/pack and retained stock; components are nonadditive, receiver treatment once."
      inputs:
        - cp_garment
        - cp_outlets
        - N
      output: "Actual exclusive contained outlets in declared state per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible native source-backed conversion; select one. factor_complete forbids extra composition/fate; no whole-stream/species duplicate physical output."
      inputs:
        - cp_environment
        - N
      output: "Actual direct species mass with receiving medium per reference flow"
      source_ids: []
