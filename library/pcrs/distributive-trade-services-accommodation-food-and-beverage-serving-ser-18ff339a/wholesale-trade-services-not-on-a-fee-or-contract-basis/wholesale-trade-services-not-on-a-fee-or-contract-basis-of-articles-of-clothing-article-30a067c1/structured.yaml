validation_rules:
  - rule_id: reference_check
    applies_to: "accepted_service"
    rule: "N>0 unique final B2B accepted service with actual factory style/size/woolblend/garmentcount/net incltrims/tare/moisture/source/condition/time, not onejumper or woolkg."
    source_ids: []
  - rule_id: processing_check
    applies_to: "whole route"
    rule: "No garment manufacturing/wash/steam/ironing/repair/redye/pesttreatment/primary openingrepack or unreviewed dedicatedclimate operation, including contracted physical actions; no mandatory householdcare."
    source_ids: []
  - rule_id: commodity_gate_check
    applies_to: "non-exchange garment"
    rule: "Complete actual finishedpacked baseline includes missing actual postgreasywool and blend manufacturing stages once outside service; sourcegate assignedquantity/statechanges/exclusiveexits and actualcompatible lossunit/basis/source/owner/existingcoverage mandatory. No labelwool%=wholegarmentfibrekg or massdeficit=loss/species."
    source_ids: []
  - rule_id: resource_owner_check
    applies_to: "all service resources"
    rule: "All users/periods/drivernativeunits, idle/hygiene/open attempts, gross-plus-return OR consumed-only omitreturn, completeassetlife observed+sourcedremainder/EOL and direct/provider/carrier/treatment scope once."
    source_ids: []
  - rule_id: fate_species_check
    applies_to: "actual outlets"
    rule: "Usable commercialreturn/retainedreject vs realdiscard; garmenttransferredpack vs separatelyremovedpack/mixedhygiene/liquid disjoint. Actualspecies/medium independent, no householdchemical/condition/capturedfibre inferredrelease or automaticcredit."
    source_ids: []
  - rule_id: bilingual_raw_contract
    applies_to: "all authored content"
    rule: "Raw identity7/FU5/boundary6/reference6/profile7, all8CP12fields and10calculationbodies/output nonempty; orderedIDs/propertyunit/evidence/rawoperands/sourceURLs and deterministic projection align withoutpreprocessing. Pass not actualquality/finalUUIDproof."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after actual foreground completion and concrete identity verification"
  downstream_use: "Physical ambient folded wool-knit jumper merchant add-on linked to complete factory-finished/packed commodity demand and actual compatible loss once; not total delivered garment footprint"
  allowed_use: "Actual declared factory-finished folded/packed wool-containing knitted jumper style/size/SKU/lot and B2B acceptance cohort with composition/trim/moisture/condition/period qualifiers"
  excluded_use: "Greasy wool/yarn/garment manufacture, otherapparel/fur, wash/steam/repair/treatment/repack or climate intervention withoutreview, retail/agency/standalonewarehousing; householdcare mandate or durability/safety guarantee"
  required_metadata: "Supplier/style/size/SKU/lot/factorypackrelease/merchant/buyer; wool-blend composition basis/source; actual garmentpieces/net includingtrims, externalpacktare, component/moisturemethod/basis/source/sampletime/representativeness; condition/stock/fates/periods; all-user service/provider/asset/carrier/receiver scope; originalgate assigned quantity/state/unit/source/allocation/conversion/lossowner/existingcoverage"
