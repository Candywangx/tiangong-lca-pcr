allocation_rules:
  - rule_id: original_gate_assignment
    applies_to: "garment merchandise"
    rule: "Assign actual complete factory-finished/packed source input to accepted cohort in compatible native state/unit/composition/moisture basis with source/allocation/conversion. Include evidenced original material and ordinary moisture/state-change share without treating it as fibre loss; returns/closing/other exits exclusive. Final dispatched garment mass plus waste is not automatically original-gate demand. Actual compatible loss adjustment and existing coverage owned once outside service; unknown mass/count differences unresolved, not default loss or zero."
    source_ids: []
  - rule_id: all_user_attribution
    applies_to: "actual service periods"
    rule: "Use real all-consumer source periods and causal handling/occupied-space-time or other justified native driver, with units/source/rationale, including idle/hygiene/failed/open attempts. Equal consignments, garment count or wool mass splits are not presumed. Unfinished work retains attribution without fictitious N."
    source_ids: []
  - rule_id: supply_return_convention
    applies_to: "new direct supplies"
    rule: "S=opening_supply+net_receipts-closing_supply. Gross input S/N with separately recorded actual matched native unused outward-return output OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted and no extra deduction. Require same-scope standalone stock pairing; retained recovery is closing, inherited garment/asset contents do not reduce unrelated current supply."
    source_ids: []
  - rule_id: complete_asset_life
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N for one compatible complete asset and every user/period. Manufacture/maintenance/real replacements/retirement/end-of-life, observed history+sourced remainder and uncertainty/sensitivity/update explicit. Direct/provider/carrier overlaps removed only after same burden has one owner elsewhere; no per-turn new bin/pallet or duplicate rent/service+asset view."
    source_ids: []
  - rule_id: actual_transfer_states
    applies_to: "real returns/wastes"
    rule: "Usable commercial returns/retained rejects remain commodity states. Actual discarded garment stream includes only associated pack actually transferred together; separately removed pack/mixed hygiene/liquid streams are exclusive. Components/moisture/fibre analyses are nonadditive, no duplicate physical or species output. Receiver/treatment scope once, no default recycling/substitution benefit."
    source_ids: []
