      applies_to: "all recorded operands"
      requirement: "Each independent original/assigned/baseline/additional quantity, component/stock/fate, asset-used-observed-remaining-lifetime driver and freight gross/tare/cargo/distance/share needs compatible native unit/basis/method/state/time/source and explicit conversions. Representative sample/density-temperature evidence is required where used, never invented."
      evidence: "cp_basins; cp_assets; cp_fates; cp_freight; cp_supplies; cp_releases"
    - id: completeness_unknowns
      applies_to: "all interfaces"
      requirement: "Disclose actual final-acceptance/reversal/cohort uncertainty, missing source/BOM/state/equivalence or terminal records, unknown stock/loss/fates and provider/receiver/asset-life gaps. N=0 resources remain. Per-card evidence needs and sensitivity/update statements are limitations, not quantitative defaults or final readiness."
