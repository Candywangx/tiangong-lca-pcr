  calculation_rules:
    - id: final_resource_normalization
      applies_to: "all service cards"
      rule: "N=unique FINAL real business acceptances after reversals for actual merchant ownership/resale. Attribute actual direct event OR quantity×compatible target_driver/positive complete all_consumer_driver with native unit/basis/method/state/time/source and all no-acceptance/other-user/period burdens. Assigned total/N once only if N>0; N=0 retains resource/period/cohort records without division."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference physical service inventory"
      source_ids: []
    - id: basin_stock_state
      applies_to: "commodity audit"
      rule: "At compatible native state, opening+supplier_external_receipts+buyer_returns-closing-business_buyer_dispatch-supplier_returns-useful_other_exits-actual_discard-net_sample_removal=unknown_residual. Supplier receipts exclude buyer-return/internal movement, buyer dispatch excludes other exits, internal moves cancel. Actual intact/fragment/body/glaze/part/pack genealogy and independently measured components remain separate non-additive views; no missing fitting/chip/residual=whole-basin loss/waste/species or zero."
      inputs:
        - cp_basins
      output: "Actual stock, exclusive exits and explicit unknown state"
      source_ids: []
    - id: finished_source_demand
      applies_to: "commodity interface"
      rule: "Choose sourced direct measured/traced original-gate assigned quantity and exclusive terminal evidence OR Qsource_actual×Dtarget/Dall_terminal. Dall_terminal>0 equals complete compatible competing FINAL-accepted/useful-other/returns/closing-carry/proven-loss terminal records, each quantity/unit/basis/method/state/time/source/link/owner. No accepted-only, unknown-loss zero or direct+driver overlay. Source/assigned/baseline/additional native quantity/unit/basis/method/state/time/source and original-gate conversion must be compatible; record exclusive loss owner and subtract only identical already-covered baseline stage/loss demand before linking required additional complete fired-glazed-packaged demand outside once."
      inputs:
        - cp_basins
        - cp_consignment
      output: "Separate quantified complete original-gate demand/loss interface"
      source_ids: []
    - id: per_record_packed_freight
      applies_to: "freight"
      rule: "For each unique load-leg use measured packedcargo OR same-state gross minus ONLY vehicle/noncargo tare, retaining all cargo packaging/included parts/state and excluding duplicate component views. EACH multiplies evidenced repeated count once, TOTAL unchanged. After compatible native conversions, assigned kg*km=sum(unique load,leg: actual_packed_payload_kg×actual_distance_km×that_record_share). The share belongs INSIDE each record sum with complete compatible all-user driver evidence. Divide assigned sum by positive FINAL N once unless already per reference; retain N=0 resources without division."
      inputs:
        - cp_freight
        - cp_consignment
      output: "Actual unique per-reference physical freight"
      source_ids: []
    - id: actual_release_method
      applies_to: "direct_species"
      rule: "Actual species/particle/medium quantity=measurement OR compatible actual activity×factor with native unit/basis/method/state/time/source and factor coverage. Apply required composition/fate or gas/concentration conversions once with temperature/pressure units/source; no ceramic/glaze or missing-mass release assumption."
      inputs:
        - cp_releases
        - cp_energy
        - cp_basins
      output: "Actual evidenced per-reference species"
      source_ids: []
