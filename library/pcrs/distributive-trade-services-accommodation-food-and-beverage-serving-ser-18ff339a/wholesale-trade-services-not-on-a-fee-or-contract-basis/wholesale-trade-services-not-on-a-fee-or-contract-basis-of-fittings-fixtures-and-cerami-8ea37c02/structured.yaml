    applies_to: "basin_wholesale"
    rule: "Link all actual batch/period receipt/check/cleanup/changeover/idle/cancelled/failed/rejected/unfinished/dispatch/FINAL events, actual missing included part/breakage/chip/carton damage/sample to unique quarantine/return/useful-other/discard paths. No presumed repair/crushing/wash/repack/install; unknown residual never whole-basin loss, emission or zero."
