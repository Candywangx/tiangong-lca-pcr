    - id: complete_identity
      applies_to: "all roles"
      requirement: "Final exchanges require actual basin/model/BOM/body-glaze/component/source/receiver/provider/service/species identity and compatible native support. Count property/group is independent measurement support, not the completed commercial-service identity."
      evidence: "Actual supplier/lot/commercial evidence, detail/support verification"
