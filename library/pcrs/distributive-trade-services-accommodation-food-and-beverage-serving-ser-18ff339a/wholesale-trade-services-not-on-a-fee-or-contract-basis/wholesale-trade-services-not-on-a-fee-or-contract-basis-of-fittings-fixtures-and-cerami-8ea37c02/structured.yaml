lazed underside/no faucet hole/no overflow/separate faucet-drain informs actual model-content checks only. Dimensions/color/hole design, required installation accessories, cutout template/cabinet width and install directions are not universal inventory/operation/material defaults. | kohler-vessel-basin |\n| separate_fates | state audit | Cracks, glaze chips/fragments, whole-basin discard, pack damage, unknown deficit and direct release are distinct. No crack=whole-basin loss, ceramic/glaze content=emitted species, or automatic recycling credit. |  |\n\n\n"
