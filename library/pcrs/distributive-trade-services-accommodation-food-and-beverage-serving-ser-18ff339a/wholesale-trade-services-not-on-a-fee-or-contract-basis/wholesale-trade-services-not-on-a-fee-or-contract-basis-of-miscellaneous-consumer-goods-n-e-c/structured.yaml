validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Verify source evidence of merchant ownership purchase/resale and actual business buyer;require final unique commercial acceptances after documented reversals,all qualifiers and positive N for division. Supplier receipt alone is insufficient. Reversal/unfinished resource events keep period/cohort responsibility;do not divide if N=0. Tyre/set/package Count,age,kg or financial transaction is not this service completion."
    source_ids: []
  - rule_id: validate_state_material
    applies_to: "commodity and actual fates"
    rule: "Verify actual new passenger-car model/size/source-lot/unmounted/uninflated/no-road-use state,count/net composite mass and actual pack presence/tare. Manufacturer BOM/analysis and sample/state/unit/source evidence determine actual material fractions,not generic rubber percentages or all-rubber kg. Whole/component views cannot add duplicate physical mass."
    source_ids:
      - michelin-tyre-materials
  - rule_id: validate_ordinary
    applies_to: "actual operations"
    rule: "No consumer wheel-removal/wash/pressure,winter/fuel/use instructions or universal ageing/life/temperature limit becomes merchant operation or quantity. Real mounting/inflation/balancing/retread/repair/testing/conditioning requires separately reviewed full scope."
    source_ids:
      - michelin-tyre-storage
  - rule_id: validate_chain
    applies_to: "commodity outside service"
    rule: "Complete actual finished-tyre source includes actual compound/rubber/fillers/additives,reinforcements,manufacture/cure/finish and supplier packing as relevant,or missing stages once outside service. Originalgate quantity/unit/state/source,direct trace OR compatible positive complete source-cohort driver records including closing/useful exits/returns/loss,actual loss/conversion/exits/coverage owner/integration must match source tyre,not raw rubber or recipe alone."
    source_ids: []
  - rule_id: validate_fates_scope
    applies_to: "all physical duties"
    rule: "Age/cracks/deformation/ozone exposure,missing stock or unknown residual do not establish tread loss,disposal or species. Actual Product/Waste/direct decisions,receivers and whole/part/retained-composite/fluid exclusions required. Verify native identity/property/unit/source conversion and full resource/provider/carrier/all-user asset life/receiver coverage once;no road-use abrasion or negative ozone proxy."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual concrete identity and quantitative review"
  downstream_use: "Physical ambient new-unmounted-tyre own-account wholesale add-on for complete actual finished passenger-car tyre chain"
  allowed_use: "Actual new unmounted/uninflated passenger-car model/size/lot/date/composite-BOM/net mass/actual tare/condition/period and accepted route"
  excluded_use: "Standalone tyre footprint; used/retread/other tyre categories/rims; manufacture,mount/inflate/balance/wash/repair/retread/road use; batteries/music; retail/agency; tyre/set/age-to-service or all-rubber proxy"
  required_metadata: "All qualifiers; actual model/lot/new-unmounted-uninflated/composite mass/BOM/pack presence/tare/condition/stock/fates; originalgate demand/loss/full competing source records/conversions/coverage owner/integration; full resources/provider/assets/carrier/receivers"
  required_quality_disclosure: "Unresolved actual identities/support,foreground quantities/Range evidence,material-BOM/condition/fate/source limits and lifetime/conversion uncertainty"
  update_trigger: "Changed model/size/source/composite BOM/pack,warehouse operation,actual treatment,provider/asset/carrier/receiver scope,acceptance or loss/fate evidence"
data_sources:
  - id: "unsd-cpc3-consumer-tyres"
    type: "official_guidance"
    reference: "UNSD.CPC3.0 explanatory notes,division61,61059; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "361rubbertyres includes36111new passenger-car tyres within61059;classification only."
  - id: "michelin-tyre-storage"
    type: "handbook"
    reference: "Michelin.Tout sur le pneu.Le stockage,French public text; https://toutsurlepneu.michelin.com/stockage"
    used_for: "Unused ageing/crack/deformation and light/weather/chemical/ozone,mounted/unmounted qualitative condition context only. Vehicle washing/removal/pressure and winter/fuel/numeric-life/temperature advice not merchant procedure or measured loss/release."
  - id: "michelin-tyre-materials"
    type: "handbook"
    reference: "Michelin.Tout sur le pneu.Les matériaux,French public text; https://toutsurlepneu.michelin.com/les-materiaux"
    used_for: "Qualitative compound and metal/textile reinforcement distinction,not actual model BOM or generic ingredient count/percent recipe,production/use energy or emissions."
