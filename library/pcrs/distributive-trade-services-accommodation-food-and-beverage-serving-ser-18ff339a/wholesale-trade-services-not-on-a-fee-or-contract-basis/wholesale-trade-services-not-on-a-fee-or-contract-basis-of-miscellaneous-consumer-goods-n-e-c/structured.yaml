          column: 1
      markdown: "## 5. System Boundary\n\nThis is a physical wholesale add-on,not a standalone tyre footprint or operated tyre/vehicle service. Michelin public text is qualitative product/storage context only;complete-stock/source assignment,full-life and freight calculations below are declared PCR methods,not Michelin numerical loss/recipe/energy factors.\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual factory-finished new rubber pneumatic passenger-car tyre,unmounted/uninflated,model/size/lot/date/condition and actual composite/pack basis known |\n| starting_condition_role | Nonexchange merchandise stock/throughflow including inherited compound/reinforcements/retained constituents and actual original packing |\n| product_classification_scope | Narrower36111new passenger-car tyre subset inside61059rubbertyres361,not music383or batteries464 |\n| recursive_input_rule | Actual physical providers require complete disjoint gates; no same-sale recursion or duplicate resources/assets/carrier/receiver treatment |\n| upstream_dataset_requirement | Complete actual finished new model/size/composite tyre manufacturing gate including relevant compound/reinforcement/manufacture/cure/finish and supplier pack,or missing stages once outside service. Raw rubber/steel/textile/compound recipe alone is incomplete. Actual resource/provider/receiver native scope must match |\n| disclosure | All qualifiers; actual new/unmounted/uninflated state/model/size/lot/net composite mass/BOM/pack presence/tare/condition/stock/fates; originalgate demand/loss/full competing source records/conversions/coverage owner/integration; full resource/provider/asset/carrier/receiver scope |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_addon | all inventory | ALL finished tyre manufacture,complete rubber compound/reinforcement/retained constituents and original packing for sold AND lost merchandise stays outside service exchanges. Complete compatible actual factory-finished new passenger-car tyre baseline plus original-gate assigned demand/state/loss/other exits/conversions/coverage owner must integrate once outside before whole-chain use. Actual service loss handling/receiving treatment stays inside once. Raw rubber,steel,textile or an ingredients basket alone omits finished tyre manufacture. |  |\n| boundary_composite | product and content views | A complete tyre is a composite;actual model/lot BOM or representative analysis defines material identity/fractions/basis,not an all-rubber mass or generic ingredient count/percentage. Whole tyre,compound layers,steel/textile reinforcement and retained constituents are nonadditive views of the same physical stock/output. Added supplies and actual packaging have separate proven origins. | michelin-tyre-materials |\n| boundary_operations | normal merchant route | Receive and resell new unmounted uninflated tyres,without rims,road use,mounting/balancing/inflation,wheel/tyre washing,repair,retreading,shredding or active treatment. Actual additional operation/conditioning/fuel needs separately reviewed complete scope,not omission or zero. No compressed gas or wheel/vehicle service is inferred. |  |\n| boundary_storage | qualitative condition evidence | Michelin French storage text supports actual unused ageing/crack/deformation,light/weather/chemical/ozone and mounted-versus-unmounted condition questions only. Vehicle wheel cleaning/removal/pressure,road fuel/winter advice,numeric temperatures/lifetime or prescribed housing/chemical treatment are not this merchant operation or loss factor. Actual manufacturer/buyer/site evidence governs. | michelin-tyre-storage |\n\n\n"
