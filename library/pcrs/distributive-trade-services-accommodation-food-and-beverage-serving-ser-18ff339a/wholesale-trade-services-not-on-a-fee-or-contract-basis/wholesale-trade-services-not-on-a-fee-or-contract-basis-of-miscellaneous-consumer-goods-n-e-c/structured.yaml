          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_service | all duties | Use positive actual unique accepted commercial N with causal physical cohort/period shares. Failed/canceled/quarantined/returned orders,idle/cleanup and unfinished periods retain responsibilities even if current N=0. Tyre/set count,mass or margin alone is not service count. |  |\n| allocation_goods | nonexchange composite stock | Reconcile actual opening,net receipts,buyer returns,closing unsold/damaged retained,accepted transfers,supplier returns,useful other exits,whole/part/mixed-content losses and actual direct material exits by exclusive source-lot/piece states. Internal quarantine/moves are not exits;age/condition/missing status or discrepancy is not physical loss/disposal/species. Original finished-tyre demand/state/loss matches actual source quantity/unit/state/conversion/source/owner/already-included coverage and integrates once outside service,not raw-rubber equivalents by assumption. |  |\n| allocation_source_records | allocated original source | For allocated assignment,retain source_all_exit_driver_records for every competing accepted transfer,external return,closing carry/unsold or damaged retained stock,useful other exit and actual whole/part/mixed-content loss. Each record has quantity/unit/basis/source,original-source lot/cohort/period links,conversion and exclusivity key. Numerator identified records and denominator=sum complete mutually exclusive terminal-state/exit drivers use the same compatible full original-source cohort/basis,including closing/useful exits/returns/loss,never accepted-only. Intermediate movements reconcile to final states,not double counts; missing coverage blocks allocation. |  |\n| allocation_supplies | independent supply and unused_supply_return | S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Choose gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting that OUTPUT. No numerical S+return,double deduction,internal recovery as receipt or removal of nonreturned waste/spill upstream burden. Tyres/compound/inherited packs cannot reduce unrelated service-material inputs. |  |\n| allocation_full_life | resources/assets/providers | Compatible-period complete-resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across users/periods,including manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remaining use/termination,units,uncertainty/sensitivity/update. Complete provider coverage replaces overlapping own resources/assets,not another additive burden. |  |\n| allocation_material_fates | actual useful/waste/direct flows | Whole tyres,separately transferred useful composite,nonusable parts,packing,absorbed-fluid/debris cleanup solids and independent liquid are exclusive physical streams. Rubber/steel/textile/retained-fluid fractions are linked nonadditive content audits,not extra outputs or upstream burdens. Actual receiver/transport/treatment once,no assumed recycling/retread/substitution credit or rubber loss factor. Only actual named direct substances/media use supported evidence; receiver emissions stay receiver scope once. |  |\n\n\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| source_scope_normalization | nonexchange commodity and service combination | Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division. |  |\n\n"
