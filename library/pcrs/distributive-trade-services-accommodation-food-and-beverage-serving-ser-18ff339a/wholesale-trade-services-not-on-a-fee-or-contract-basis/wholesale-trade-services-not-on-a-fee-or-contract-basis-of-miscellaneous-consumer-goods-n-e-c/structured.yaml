  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "Verify source merchant ownership purchase/resale and business buyer,then N counts unique FINAL commercial acceptances after linked reversals,never supplier receipts. Attributed actual physical quantity / positive unique N once; accepted_service is 1 Item(s). Reversal/failed/unfinished resource events retain actual period/cohort attribution;if N=0 do not divide and carry their responsibility to the identified cohort."
      inputs:
        - "attributed quantity"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: net_complete_tyre_mass
      applies_to: "nonexchange tyre stock"
      rule: "Net complete-tyre mass=sum actual unique tyre/lot gross readings minus actual external shipping-pack tare on a common native basis,converted once by documented factor/unit/source. Use per-piece OR documented total with representativeness,not total multiplied by count again. Steel/textile/compound and retained constituents stay within tyre product;absence of packaging/zero tare requires actual evidence. Ingredient views do not add to whole mass."
      inputs:
        - "unique piece/lot"
        - "actual gross/external tare/presence"
        - "each/total/sample"
        - "native mass method/factor/unit/source"
        - cp_tyres
      output: "nonduplicated complete composite kg,nonexchange audit"
      source_ids: []
    - id: original_gate_assignment
      applies_to: "commodity outside service"
      rule: "Use actual directly measured/traced assigned original quantity/unit/state/source and direct evidence OR assigned quantity=actual originalgate quantity*compatible source cohort driver/source all-exit driver,with declared allocation method/source and positive complete denominator. Numerator identified records and complete mutually exclusive terminal records refer to the same compatible full source lot/cohort/basis,including closing/unsold/damaged retained,useful other exits,returns and actual whole/part/mixed-content loss,never accepted-only. Each record includes quantity/unit/basis/source/lot/cohort/period/conversion/exclusivity links. Match actual finished-tyre demand/state/loss/coverage owner/exits and integration once outside service;no ageing or raw-rubber factor substitutes actual source conversion."
      inputs:
        - "originalgate quantity/unit/state/source"
        - "direct evidence OR method/source/cohort/all-exit records/units/bases/links"
        - "assigned source"
        - "actual loss/conversion/coverage owner/exits/integration"
        - cp_tyres
      output: "reproducible original finished-tyre assigned demand/loss"
      source_ids: []
    - id: supply_stock
      applies_to: "independent supplies and unused_supply_return"
      rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Choose gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting that OUTPUT. No numerical S+return,double deduction,internal recovery as receipt or removal of nonreturned waste/spill upstream burden. Tyres/compound/inherited packs cannot reduce unrelated service-material inputs."
      inputs:
        - opening
        - "true external net receipts"
        - "recovered retained closing"
        - "matched same-scope unused outward"
        - representation
        - cp_materials
      output: "nonduplicated supplied/returned quantities"
      source_ids: []
    - id: shared_lifetime_share
      applies_to: "resources/assets/providers"
      rule: "Compatible-period complete-resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across users/periods,including manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remaining use/termination,units,uncertainty/sensitivity/update. Complete provider coverage replaces overlapping own resources/assets,not another additive burden."
      inputs:
        - "actual period/resource scope"
        - "cohort/all-user/lifetime driver units"
        - "observed/history/remainder/termination/source"
        - cp_assets
      output: "attributed resources/full-life asset equivalents"
      source_ids: []
    - id: packed_freight_share
      applies_to: "actual_packed_freight"
      rule: "For each unique load_id+leg_id,keep independent native gross,tare and payload units/bases/methods/sources and documented compatible conversions: packed payload=gross minus evidenced noncargo vehicle tare OR directly measured cargo. A load extent EACH reading multiplies its actual sourced repeat count once; a TOTAL load reading is unchanged,not multiplied again. Sum over unique load+leg records [(compatible converted payload kg)*(actual repeat count ONLY for EACH,otherwise 1)*(converted actual distance km)*(THAT record actual causal share)] / positive N. Record-specific share stays inside each summand,not one shared factor outside the sum; N is applied once. Repeat count has native unit,basis,method,source and actual cargo support/pack stays inside payload. Payload includes complete composite tyres and actual cargo packing/protection;gross-minus-tare removes only evidenced vehicle/noncargo tare. Factors/shares require compatible units/bases/sources and all-user driver evidence where allocated. Never add tyre count mass and its BOM components as separate cargo or use an assumed rubber-only payload."
      inputs:
        - "unique load/leg"
        - "EACH/TOTAL"
        - "repeat count/unit/basis/method/source"
        - "independent native gross/tare/payload unit/basis/method/source/conversions"
        - "actual cargo packing"
        - "native distance"
        - "actual causal share/all-user driver unit/basis/method/source"
        - N
        - cp_transport
      output: "kg*km per service reference"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory"
      requirement: "Confirm actual concrete flow,state/gate,property/unit and medium before final use;actual tyre/model/material/receiver configuration remains explicit."
      evidence: "Full detail/support proof"
    - id: quality_composite_condition
      applies_to: "commodity/fates"
      requirement: "Actual new/unmounted/uninflated state,complete composite mass/BOM basis,actual pack presence/tare and observed condition with method/sample/source. No generic percentages,all-rubber mass or condition-to-loss inference."
      evidence: "Manufacturer/model/lot BOM,weight/condition/receiver records"
    - id: quality_complete
      applies_to: "all duties"
      requirement: "Complete original finished-tyre demand/state/loss integration outside service with full competing source records;actual resource/provider/carrier/full-life asset/receiver scope/fates once with uncertainty/update."
      evidence: "Originalgate/drivers/conversion/coverage/integration,meter/lifetime/receiver evidence"
