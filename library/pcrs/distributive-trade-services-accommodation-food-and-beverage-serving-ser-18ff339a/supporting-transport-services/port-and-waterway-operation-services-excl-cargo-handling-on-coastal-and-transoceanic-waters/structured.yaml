          description: "Conditional on actually established copper release from disturbance/leaching; require measured or validated fate evidence and marine receiving compartment. Sediment total content and moved waste mass alone do not establish released copper."
          amount:
            expression: "Attributable measured exchange amount per reference flow; cp_release."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_release
              source_ids: []
            ranges: []
allocation_rules:
  - rule_id: allocate_function
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide berth, terminal, hydraulic and aid functions before attribution. Use actual berth length-time/vessel dimensions, passenger-facility use, lock head/cycle/water activity or aid coverage/availability as causal drivers; retain failed cycles and standby. Unlike functions/counts are not pooled by fees or ship calls."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Maintain persistent quay/terminal/lock/lift/weir/sluice/aid asset ledgers with supported whole-life service denominators. Allocate only actual navigation shares of multipurpose structures; no whole dam or whole aid fleet per vessel. Observed-period accounting distributes only the attributed period share; lifetime fractions across all users/periods cannot exceed one or reset annually. Unknown life/denominator requires review and sensitivity."
    source_ids: []
  - rule_id: allocate_dredging
    applies_to: "foreground_burden_allocation"
    rule: "Attribute actual maintenance campaign by the supported channel/berth service population and interval benefited, with actual volume/material/destination. Initial capital dredging belongs to construction and cannot be repeated each maintenance period. Multipurpose dredging and reusable sediment require traced shares and actual routes; no automatic avoided-disposal or virgin-material credit."
    source_ids: []
  - rule_id: allocate_scope
    applies_to: "foreground_burden_allocation"
    rule: "A supplier inventory replaces covered operations/assets once. Customer fuel, shore electricity sold as energy, cargo/passengers and navigation fees are not co-products of this support count. Split handling/storage/pilot/tug services and other water-management uses with transparent boundary reconciliation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_activity
      process_id: "port_operation"
      flow_role: "port_block"
      record_type: "Completed function and extent ledger"
      raw_fields: "family; facility/aid/channel; vessel/passenger population; dimensions/draft; berth length/time; lock/lift head/cycle; weir/sluice regulation; aid coverage/duty/availability; actual start/end; acceptance; exclusions"
      collection_method: "Match actual facility logs and interfaces to one defined block from section 1. Count homogeneous completed blocks only; retain actual extent, incomplete/retry activity and component/whole-block relationships."
      unit: "Item(s)"
      frequency: "each block or actual availability interval"
      temporal_coverage: "full declared service and assigned support"
      site_scope: "all actual owners/operators/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "berth/lock/aid logs; timing; coverage; acceptance; population reconciliation"
    - protocol_id: cp_energy
      process_id: "port_operation"
      flow_role: "terminal_power; lock_power; aid_power"
      record_type: "End-use electrical ledger"
      raw_fields: "meter; kWh; supply/voltage; terminal loads; gate/lift/pump cycles/head; aid duty; standby; charging/battery loss; shore delivery; provider coverage"
      collection_method: "Submeter actual activities or reconcile measured equipment duty with total meters. Separate customer shore supply, cargo equipment and actual provider-covered energy; do not estimate lock energy from ship count alone."
      unit: "kWh"
      frequency: "each operation/meter interval"
      temporal_coverage: "all included operation and standby"
      site_scope: "actual marine facilities/aid sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated meters; duty/cycle logs; shore/provider reconciliation"
    - protocol_id: cp_fuel
      process_id: "port_operation"
      flow_role: "diesel"
      record_type: "Port-owned fuel balance"
      raw_fields: "craft/generator ID; fuel grade; actual kg; receipts/stocks; duty; density/temperature if converted; customer bunker delivery"
      collection_method: "Measure actual port-owned operation fuel and reconcile stocks; distinguish light-vessel/maintenance craft from customer vessels and excluded tug/pilot tasks. Supplier-covered fuel is not repeated."
      unit: "kg"
      frequency: "each actual use and stock period"
      temporal_coverage: "full attributable operation"
      site_scope: "identified operator equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel logs; stock balance; actual vessel/equipment duty"
    - protocol_id: cp_material
      process_id: "port_operation"
      flow_role: "water; cleaner; hydraulic_oil; lubricant"
      record_type: "Specific material balance"
      raw_fields: "individual substance; kg/m3; grade/composition; issue/return; stock; cleaning/maintenance event; actual leaks; water delivered to ship"
      collection_method: "Meter/weigh each specific exchange and reconcile stocks/returns. Keep ship commodity supply and natural hydraulic water separate from facility consumption."
      unit: "kg; m3"
      frequency: "each actual event/stock period"
      temporal_coverage: "all attributable maintenance and cleaning"
      site_scope: "actual port/aid assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "material records; calibrated weighing/meters; maintenance balance"
    - protocol_id: cp_assets
      process_id: "port_operation"
      flow_role: "quay_share; terminal_share; lock_share; lift_share; weir_share; sluice_share; lighthouse_share; buoy_share; lightship_share"
      record_type: "Persistent marine asset ledger"
      raw_fields: "actual asset ID/type/geometry; m/m2/items; construction/manufacture; initial capital dredging; supported whole-life utilization; actual navigation/other-purpose share; cumulative prior fraction; period fraction; renewals"
      collection_method: "Match real assets to upstream inventories and supported whole-life service denominators. Keep initial and maintenance boundaries distinct, allocate only actual navigation service share and conserve cumulative fractions across all periods/users. Unknown life/denominator remains under review."
      unit: "m; m2; Item(s)"
      frequency: "each allocation and asset/maintenance update"
      temporal_coverage: "supported whole life and declared observation interval"
      site_scope: "identified marine facilities/aid assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "engineering/asset records; actual utilization; supported life; multipurpose/cumulative reconciliation"
    - protocol_id: cp_dredging
      process_id: "port_operation"
      flow_role: "dredging; dredged_sand; copper_silt"
      record_type: "Dredging and sediment fate ledger"
      raw_fields: "campaign; capital/maintenance; source area; in-situ volume; measured wet/dry mass/moisture/density; grain size; specific contaminant tests; supplier coverage; actual transport/distance; treatment/placement/reuse site; material destination; benefited service population/period"
      collection_method: "Use actual surveys/weighing and representative sediment characterization with provenance. Trace every material stream to actual transport and destination, retain treatment/placement records and avoid supplier overlap. Sediment tests do not establish release fraction or ecological approval by themselves."
      unit: "m3; kg"
      frequency: "each campaign/material transfer"
      temporal_coverage: "actual campaign and supported benefited service interval"
      site_scope: "source channel/berth and all actual destinations"
      aggregation_rule: "per reference flow"
      quality_evidence: "surveys; test reports; transport/placement tickets; wet/dry balance; supplier inventory"
    - protocol_id: cp_lockwater
      process_id: "port_operation"
      flow_role: "sea_abstraction; river_abstraction; water_sea"
      record_type: "Source-resolved hydraulic balance"
      raw_fields: "source/receiving compartment; salinity; head; chamber/ship displacement; actual gate/pump cycle; measured intake/return; recirculation; actual freshwater loss"
      collection_method: "Measure actual flows or use validated hydraulic geometry/cycle balances with actual head and losses. Keep seawater, freshwater, recirculation and receiving destinations distinct; do not infer consumption from gross throughput."
      unit: "m3"
      frequency: "each hydraulic cycle and monitoring interval"
      temporal_coverage: "all represented navigation-water operation"
      site_scope: "actual coastal structure and water sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated flow records; geometry/head; source/return balance"
    - protocol_id: cp_waste
      process_id: "port_operation"
      flow_role: "used_hydraulic; washwater"
      record_type: "Specific maintenance waste ledger"
      raw_fields: "stream; kg/m3; composition; event; recipient; actual treatment; leak distinction"
      collection_method: "Weigh/meter each collected stream and trace actual treatment. Environmental oil/chemical leakage requires its own substance and receiving-compartment evidence."
      unit: "kg; m3"
      frequency: "each transfer/discharge period"
      temporal_coverage: "all actual attributable maintenance"
      site_scope: "facility and treatment gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste tickets; composition; treatment and material balance"
    - protocol_id: cp_release
      process_id: "port_operation"
      flow_role: "fossil_co2; copper_sea"
      record_type: "Species/compartment release ledger"
      raw_fields: "actual pollutant species; kg; air/seawater compartment; fuel consumed; carbon/oxidation; sediment mobilization/leaching measurements; fate model; provider/customer boundary; uncertainty"
      collection_method: "Use actual emissions measurements or a reviewed source-specific method. For marine contaminants distinguish total content, particulate transport, dissolved release and actual bioavailability assumptions. Do not assume all transferred copper is emitted; screen other actual species and ecological mechanisms separately."
      unit: "kg"
      frequency: "each actual source/event and representative monitoring"
      temporal_coverage: "full represented emitting operation"
      site_scope: "actual operator/source and receiving compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "measurements; validated scope/fate; fuel and material reconciliation; uncertainty"
  calculation_rules:
    - id: block_attribution
      applies_to: "all inventory rows"
      rule: "Assign measured operation/support to one homogeneous function/extent, then divide by actual completed blocks with standby/retries included in attributed totals. Reference output is exactly 1 Item(s)."
      inputs:
        - cp_activity
        - "attributable measured totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: maintenance_attribution
      applies_to: "dredging; dredged_sand; copper_silt"
      rule: "Allocate actual campaign quantities to the documented channel/berth service interval/population benefited. Preserve material identity, actual volume/dry-wet mass conversion and destination; do not repeat initial capital work each period."
      inputs:
        - cp_dredging
        - cp_activity
      output: "actual campaign amount per reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "quay_share; terminal_share; lock_share; lift_share; weir_share; sluice_share; lighthouse_share; buoy_share; lightship_share"
      rule: "Apply the supported block fraction to actual upstream construction/manufacture and conserve cumulative navigation/other-purpose shares; period observations distribute only the already attributed period share."
      inputs:
        - cp_assets
        - cp_activity
      output: "asset amount per reference flow"
      source_ids: []
    - id: source_fate
      applies_to: "fossil_co2; copper_sea"
      rule: "Use actual fuel-carbon/oxidation or measured/validated marine-release evidence for the specific source. Sediment contaminant content is an input to fate analysis, not an automatic elementary emission."
      inputs:
        - cp_release
        - cp_fuel
        - cp_dredging
      output: "specific release per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_extent
      applies_to: "port_block"
      requirement: "Require one exact function, geography, extent, duration/cycle and completed population; unlike berth/passenger/lock/aid blocks cannot be pooled by count."
      evidence: "cp_activity"
    - id: quality_sediment
      applies_to: "dredging; dredged_sand; copper_silt"
      requirement: "Characterize actual sediment by source, grain size, contamination, wet/dry basis and destination. Uncharacterized sediment is not assumed clean, reusable or automatically harmless."
      evidence: "cp_dredging; epa-sediment"
    - id: quality_lifecycle
      applies_to: "all asset rows"
      requirement: "Support life/service denominators, navigation-only shares, initial/maintenance distinction and conserved allocation; missing life/upstream evidence prevents complete lifecycle claims."
      evidence: "cp_assets; cp_dredging"
    - id: quality_ecology
      applies_to: "all inventory rows"
      requirement: "Disclose chemical/species, hydraulic, seabed/habitat/turbidity/noise evidence gaps and actual impact-method coverage; a chemical inventory is not complete ecological assessment."
      evidence: "cp_release; cp_lockwater; site evidence"
validation_rules:
  - rule_id: validate_block
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique port_block output equal to 1 Item(s) with one physically defined function and actual extent; reject generic port-call or fee equivalence across service families."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Verify coastal/transoceanic function, customer/provider/owner interface and exclusions for cargo, storage, pilotage/tug berthing and inland-waterway services."
    source_ids:
      - un-cpc-coastal-port
  - rule_id: validate_sediment
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile dredging campaign volumes/masses, tests, transport and actual destinations once; reject assumed clean material, omitted placement/treatment and conversion of total contaminant content directly to release."
    source_ids:
      - epa-sediment
  - rule_id: validate_sources_assets
    applies_to: "foreground_dataset_conformance"
    rule: "Separate port-owned fuel, customer vessel exhaust, shore-energy delivery and upstream grid/provider emissions. Check hydraulic sources/returns, atomic flows, life denominators and cumulative shares at most one; retain identity/evidence/ecological coverage gaps explicitly."
    source_ids: []
published_dataset_profile:
  dataset_role: "coastal_port_waterway_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Specified coastal/oceanic facility-service component with compatible function, extent, ship/passenger and maintenance scope"
  excluded_use: "Complete voyage/port ecosystem footprint, cargo/storage/pilot/tug footprint, inland service or unqualified count-based comparison"
  required_metadata: "one service family and block definition; exact physical extent and actual completed population; coastal/transoceanic location; facility/aid/channel ID and coverage; actual interfaces/timestamps/duration; vessel/passenger dimensions and population when applicable; berth length/time or lock/lift head/cycle or navigation-aid availability; actual water source/return; asset ownership; operator/ship/provider split; cargo/storage/pilot/tug exclusions; shore energy and commodity-delivery boundary; maintenance dredging area/volume/mass/contamination/destination; asset life and allocation; actual quality/availability limits; geography and period"
  required_quality_disclosure: "Identity/measurement gaps; vessel/provider split; sediment characterization/fate limits; hydraulic and ecological coverage; asset life and upstream omissions"
  update_trigger: "Changed function/extent, vessel limits, navigation structure/aid, source/return waters, dredging/placement route, energy, provider ownership or asset-life evidence"
data_sources:
  - id: "un-cpc-coastal-port"
    type: "official_guidance"
    reference: "UNSD CPC3.0 67511 explanatory note; consistent with draft PDF pp374–375. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67511"
    used_for: "Coastal/oceanic port, locks/lifts/weirs/sluices and aid scope; explicit handling/storage/pilot/tug exclusions; no factors"
  - id: "epa-port-sources"
    type: "official_guidance"
    reference: "US EPA Port Emissions Inventory Guidance overview, current page read 2026-10-23. https://www.epa.gov/state-and-local-transportation/port-emissions-inventory-guidance"
    used_for: "Port/vessel/mobile-source separation and inventory scoping only; no default engine, fuel, MOVES assumption or factor adopted"
  - id: "epa-sediment"
    type: "official_guidance"
    reference: "US EPA Dredged Material Testing and Evaluation, current web page read 2026-10-23. https://www.epa.gov/marine-protection-permitting/dredged-material-testing-and-evaluation-permitting-under-marine"
    used_for: "Sediment contamination characterization and destination-specific evaluation rationale; US permitting context is not global approval or an emission/reuse factor"
