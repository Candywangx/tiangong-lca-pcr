system_boundary:
  rules:
    - rule_id: boundary_port
      applies_to: "foreground_system_boundary"
      rule: "Include actual facility power, hydraulic operations, lighting, navigation aids, passenger support, drainage, standby and attributable cleaning/maintenance. Select actual routes; a buoy does not inherit a whole passenger terminal."
      source_ids:
        - un-cpc-coastal-port
    - rule_id: boundary_vessel
      applies_to: "foreground_system_boundary"
      rule: "Separate customer vessel engines, cargo equipment, rail/road and port-owned maintenance/light vessels by actual activity and ownership. EPA source-sector guidance supports separating sources; it does not assign all harbor emissions to a port service. Meter shore supply and water/fuel delivery separately from port overhead."
      source_ids:
        - epa-port-sources
    - rule_id: boundary_dredging
      applies_to: "foreground_system_boundary"
      rule: "Distinguish initial capital works and actual navigation maintenance. Characterize each dredged stream and actual transport, containment, treatment/reuse/placement destination before modelling its fate. EPA testing guidance supports characterization and route scrutiny, not assumed clean status or universal legal approval."
      source_ids:
        - epa-sediment
    - rule_id: boundary_releases
      applies_to: "foreground_system_boundary"
      rule: "Screen actual dredging disturbance, contaminant mobilization, oil leaks, air emissions and water returns. Transferred sediment/waste is not automatically an elementary emission; sediment total contaminant content is not released mass. Habitat/seabed changes, turbidity and underwater noise require explicit site evidence and an appropriate impact method; chemical-flow cards alone cannot establish complete ecological coverage."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing coastal/oceanic facility and customer vessel/passengers at the declared interface; actual port assets/utility upstream burdens are retained"
  starting_condition_role: "foreground_start"
