functional_unit:
  what: "Provide the declared specialized support function for an identified space-transport operation"
  how_much: "One completed accepted task/block of specified function, facility/link capacity, campaign extent and exact interval"
  how_well: "Document achieved readiness, coverage, continuity, data/command quality, safety interfaces and acceptance criteria appropriate to the selected function"
