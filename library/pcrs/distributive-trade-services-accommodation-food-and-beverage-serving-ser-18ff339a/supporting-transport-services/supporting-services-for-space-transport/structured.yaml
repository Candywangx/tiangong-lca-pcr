validation_rules:
  - rule_id: validate_task
    applies_to: "foreground_dataset_conformance"
    rule: "Require one unique support_output of 1 item with all functional qualifiers, actual duration, acceptance and family processes. Reject universal per-launch/per-kg payload factors and mixing unlike tasks."
    source_ids: []
  - rule_id: validate_interface
    applies_to: "foreground_dataset_conformance"
    rule: "Audit ground/vehicle material handover and supplier interfaces; exclude customer rocket flight and payload manufacture, track actual support losses once, and preserve unsuccessful attempts in their attributable boundary."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Check each actual utility, gas, chemical, asset, waste and species against records and compatible per-task basis; disclose unknown identities/lifetimes/releases and incomplete upstream inventory. Mechanical pass does not establish full space-mission environmental or scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "specialized_space_transport_support"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching configured specialized transport-support component with explicit ground/range/control function and service extent"
  excluded_use: "Whole launch/spacecraft/payload footprint; universal mission factor; unrelated satellite communication/navigation/scientific operation"
  required_metadata: "All qualifiers; conditional routes; actual interval and success/acceptance distinction; customer gas/propellant interfaces; allocation, supplier and asset scope; primary records"
  required_quality_disclosure: "Task comparability; scrubs and standby; missing gases/species; custody and supplier overlap; life denominator; upstream/land/noise/water evidence gaps"
  update_trigger: "Changed mission phase, support extent/configuration, gas/propellant interface, utility supply, utilization/life, supplier route or measured releases"
data_sources:
  - id: "un-cpc3-67640"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0, subclass67640 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67640"
    used_for: "Specialized support category only; detailed functional boundaries are declared foreground applicability rules, not a UN enumerated subtype list"
