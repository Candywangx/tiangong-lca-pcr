allocation_rules:
  - rule_id: allocate_function
    applies_to: "foreground_burden_allocation"
    rule: "Direct meters, gas balances, instrument schedules and actual workload take priority. For multi-user range/building/control facilities split transport versus unrelated users by causal metered or measured function-time/capacity use; do not automatically allocate by launch count, contract value or payload mass."
    source_ids: []
  - rule_id: allocate_attempts
    applies_to: "foreground_burden_allocation"
    rule: "Attribute necessary preparation, rehearsal, deployment, scrub, abort, standby and retry to the defined accepted support task even if a flight is delayed or fails. A successfully delivered support block can exist without successful flight; never delete associated actual burdens or count failed trials as extra accepted outputs."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use actual asset quantity multiplied by actual attributable utilization divided by independently supported lifetime utilization, with compatible units and cumulative scope capped at one asset life. Reconcile whole-facility versus component manufacture/replacement/retirement; no invented lifetimes, masses or universal tasks per asset."
    source_ids: []
  - rule_id: allocate_interface
    applies_to: "foreground_burden_allocation"
    rule: "Reconcile customer flight inputs and upstream supplier inventories at handover. Returned/recovered gases and equipment are stocks/interfaces, not avoided-launch or recycling credits. Any reused material treatment/substitution must follow explicitly documented upstream allocation without automatic benefit."
    source_ids: []
