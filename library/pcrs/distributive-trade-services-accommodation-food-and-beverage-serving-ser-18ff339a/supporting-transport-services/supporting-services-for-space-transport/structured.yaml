  calculation_rules:
    - id: calc_task
      applies_to: "all inventory rows"
      rule: "Attribute actual matched exchanges to the specified support function, extent and interval; divide comparable summed inventory by accepted task/block count only after configuration/quality equivalence is established. No automatic launch/payload/hour conversion."
      inputs:
        - cp_task
        - "actual process protocols"
      output: "per reference flow"
      source_ids: []
    - id: calc_gas
      applies_to: "nitrogen; helium; air; nitrogen_air; helium_air"
      rule: "External receipt + opening stock = closing stock + flight/customer transfer + offsite returned/recovered material + actual ground release + other evidenced terminal fate, accounting for chemical transformation and consistent species/state boundaries. Internal recovery/reuse does not create another boundary input/output. Ground-use metering is an activity account reconciled with each terminal fate, never an independent mass sum added to release or recovery; keep flight material upstream allocation explicit."
      inputs:
        - "gas and release protocols"
        - cp_task
      output: "species mass per reference flow"
      source_ids:
        - nasa-gases
    - id: calc_assets
      applies_to: "umbilical; pump; building; radar; server; antenna"
      rule: "Multiply actual asset quantity by task-attributable utilization divided by supported lifetime utilization; reconcile units, replacement and cumulative complete/component scope before normalization."
      inputs:
        - "asset protocols"
        - cp_task
      output: "asset share per reference flow"
      source_ids: []
