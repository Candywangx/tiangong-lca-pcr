    type: "official_guidance"
    reference: "NASA, Propellants, Life Support Branch Fuels NASA Missions, June27 2023, paragraphs on ground gases, transfer and scrubbers. https://www.nasa.gov/centers-and-facilities/kennedy/propellants-life-support-branch-fuels-nasa-missions/"
    used_for: "Ground nitrogen/helium/breathing-air support and separation of handled flight commodities; qualitative route evidence only, no quantities/doses/factors adopted"
  - id: "nasa-wallops"
    type: "official_guidance"
    reference: "NASA, Wallops Range Users Handbook,840-HDBK-0004 Version4, April1 2024, sections3.2.7–3.2.8 and3.3.1–3.3.8. https://www.nasa.gov/wp-content/uploads/2023/09/wallopsrangeusershandbook-2024.pdf"
    used_for: "Range control, mobile power, telemetry and tracking support examples; apply only actual space-transport share, not unrelated aircraft/science uses; no equipment size, service life or energy factors adopted"
