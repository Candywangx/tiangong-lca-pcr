system_boundary:
  rules:
    - rule_id: boundary_support
      applies_to: "foreground_system_boundary"
      rule: "Select the actual ground/range/control processes needed by the accepted transport-support task; keep unrelated science, aviation, production and general communication activities outside or allocate their shared scope explicitly."
      source_ids:
        - un-cpc3-67640
        - nasa-wallops
    - rule_id: boundary_custody
      applies_to: "foreground_system_boundary"
      rule: "Record customer vehicle/payload and flight propellants as custody/interface records, not newly produced support output. Separate delivered flight material, actual ground purge/vent, return, recovery, stock change and physical loss. Allocate upstream propellant supply once at the agreed customer interface; handling energy and losses must not disappear or be duplicated."
      source_ids:
        - nasa-gases
    - rule_id: boundary_increment
      applies_to: "foreground_system_boundary"
      rule: "Exclude rocket plume, ascent/reentry emissions, flight propellant combustion and vehicle manufacture from direct support. Ground engine/hot-fire testing requires a separately declared actual support purpose and exhaustive species/fuel inventory; no flight emission factor or default plume chemistry."
      source_ids: []
    - rule_id: boundary_lifecycle
      applies_to: "foreground_system_boundary"
      rule: "Include support-installation construction, GSE, instruments, computing, maintenance and retirement shares. Actual vacuum, cryogenic or gas-generation equipment requires both its supported lifecycle share and measured energy, unless those same burdens are already included in a purchased complete service; do not count both. Add every additional actual gas, reagent, refrigerant, water stream, waste and emission as an individual exchange; screen land, water, noise/ecological effects and remote deployment rather than treating this card list as exhaustive."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified transport campaign phase and support installation initially available in its recorded condition"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Specialized support to actual space transportation, with ground/range/control family qualifiers"
  recursive_input_rule: "Same-category subcontracted support enters as a scoped supplier input; use either its complete inventory or an explicitly replacing disaggregation, never both"
  upstream_dataset_requirement: "Actual utilities, individual gases/materials, support facilities/equipment lifecycle and specific waste management; external network/relay support only for its actual transport share"
  disclosure: "Exact campaign/phase/function/interval and handovers; ground consumption versus flight custody; supplier overlap; life/utilization and release evidence"
