functional_unit:
  what: "Provide one exactly specified aircraft-support function"
  how_much: "One family/mode-specific block defined in section 1, never pooled across modes"
  how_well: "Actual recorded task, protection, custody or accepted-position criteria and outcome; no assumed safety certification or guaranteed avoided accident"
