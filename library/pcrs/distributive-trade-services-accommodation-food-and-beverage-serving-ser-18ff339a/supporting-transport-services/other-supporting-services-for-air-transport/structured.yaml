  calculation_rules:
    - id: family_attribution
      applies_to: "all inventory rows"
      rule: "Assign actual individual exchanges to the declared family/mode and actual output population; divide attributable resources by completed same-scenario blocks. Reference output is exactly 1 Item(s), never a family-average count."
      inputs:
        - cp_completion
        - "actual meters"
      output: "individual exchange per reference flow"
      source_ids: []
    - id: time_attribution
      applies_to: "support_output"
      rule: "Standby blocks equal measured same-capability coverage hours divided by 1 hour; hangar blocks equal actual one-aircraft custody hours divided by 24 hours, retaining fractions and footprint. Do not convert fees into time."
      inputs:
        - cp_completion
      output: "actual time-block quantity"
      source_ids: []
    - id: asset_attribution
      applies_to: "fire_vehicle; fire_station; upkeep_testset; hangar_building; tow_tug; tow_bar"
      rule: "Apply supported actual block share of asset whole-life utilization to actual construction/manufacture and distinct renewals; conserve cumulative shares and remove supplier duplication."
      inputs:
        - cp_assets_fire
        - cp_assets_upkeep
        - cp_assets_hangar
        - cp_assets_towing
        - cp_completion
      output: "asset amount per reference flow"
      source_ids: []
    - id: species_accounting
      applies_to: "fire_co2; fire_no; fire_no2; upkeep_co2; hangar_co2; tow_co2; tow_no; tow_no2"
      rule: "Use actual species mass or independently verified source/duty/fuel-specific evidence with unit and oxidation/speciation convention documented in the dataset. No numerical emission factor or duty default is provided."
      inputs:
        - cp_release_fire
        - cp_release_upkeep
        - cp_release_hangar
        - cp_release_towing
        - cp_energy_fire
        - cp_energy_upkeep
        - cp_energy_hangar
        - cp_energy_towing
      output: "individual species per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_function
      applies_to: "support_output"
      requirement: "Require all family/mode-specific functional extent, duration, aircraft configuration and completion conditions; no cross-family equivalence or PCR safety approval."
      evidence: "cp_completion"
    - id: quality_fire
      applies_to: "fire"
      requirement: "Actual product/agent formulation, test method, containment and composition/fate evidence are needed. No presumed PFAS species absence/presence or accidental-fire frequency."
      evidence: "cp_fire_material; cp_waste_fire"
    - id: quality_upkeep
      applies_to: "upkeep"
      requirement: "Document a non-repair work order and applicable actual task procedure. Exclude repair/cleaning and separate transferred customer materials from actual service consumption."
      evidence: "cp_upkeep_material"
    - id: quality_lifecycle
      applies_to: "all asset rows"
      requirement: "Support exact equipment/facility numerator, actual utilization and whole-life denominator with cumulative conservation; unsupported life prevents complete lifecycle claims."
      evidence: "cp_assets_fire; cp_assets_upkeep; cp_assets_hangar; cp_assets_towing"
    - id: quality_gaps
      applies_to: "all inventory rows"
      requirement: "Disclose missing identities, actual energy/material/agent/species, accident contamination distinction, waste receiver and noise/ecological method scope. Missing data and non-characterized impacts are not zero."
      evidence: "cp_energy_fire; cp_energy_upkeep; cp_energy_hangar; cp_energy_towing; cp_waste_fire; cp_waste_upkeep; cp_waste_hangar; cp_waste_towing; cp_release_fire; cp_release_upkeep; cp_release_hangar; cp_release_towing"
validation_rules:
  - rule_id: validate_output
    applies_to: "foreground_dataset_conformance"
    rule: "Unique support_output product output must equal 1 Item(s) and match one exact completed task/event or actual coverage/custody block. Separate standby/event, task types and families."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Enforce non-repair and cleaning/disinfection/brokerage/air-sea-rescue/flight-training/runway-cleaning-snow exclusions. A hangar location cannot change excluded repair into covered support."
    source_ids:
      - un-cpc-air-support
  - rule_id: validate_sources
    applies_to: "foreground_dataset_conformance"
    rule: "Separate actual support-equipment combustion, integral non-repair checks and customer flight/APU/accident sources. Require actual agent formulation and separately quantified chemical releases; do not infer PFAS or avoided-fire/pollution benefits."
    source_ids: []
  - rule_id: validate_atomic_life
    applies_to: "foreground_dataset_conformance"
    rule: "Require one specific exchange per card with its own correct property/unit, actual applicability and receiver; conserved life shares and supplier coverage. Unknown identities/denominators remain explicit and prevent unsupported completeness claims."
    source_ids: []
  - rule_id: validate_upkeep_count
    applies_to: "foreground_dataset_conformance"
    rule: "For upkeep, one block is one accepted, specifically named non-repair upkeep task on one identified aircraft. Record the aircraft ID, task ID, exact procedure/extent, start/end and acceptance for each completed block. Split a work order covering several aircraft into its actual aircraft-task records; repeat attempts within the same task are numerator activity, not extra outputs. Several separately defined tasks on one aircraft are separate scenario populations, not interchangeable units, and a bundled task cannot also count its included subtasks as complete outputs."
    source_ids: []
  - rule_id: validate_protocol_partition
    applies_to: "foreground_dataset_conformance"
    rule: "Each collection protocol must name one existing process_id and only its listed flow rows; each inventory card must link to that protocol for its actual process. Keep one source_record_id and exchange_id for each physical reading, delivery, transfer, emission or asset allocation. Where a source record serves several processes or datasets, record the allocation driver, original total, each assigned share and any out-of-scope residual in one common period ledger; assigned quantities plus the residual must reconcile to the original total. Splitting protocols does not replicate the full reading, create a new service output or restart an asset lifetime allocation. Preserve one matched output denominator for each declared scenario; use process quantities as attribution evidence, not additional normalization. Reconcile internal transfers once and retain cumulative asset shares across all users and periods."
    source_ids: []
published_dataset_profile:
  dataset_role: "other_aircraft_support"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "One compatible aircraft-fire, non-repair upkeep, hangar or towing component with the same function/mode, physical extent and actual interfaces"
  excluded_use: "Cross-family benchmarks, whole aircraft flight/lifetime, repair/cleaning, rescue, training, airport-wide burden or implied safety/airworthiness authorization and avoided-fire claims"
  required_metadata: "one family and service mode; actual task/aircraft/site/date; start/end/acceptance interfaces; actual duration and physical extent; provider/customer responsibility; fire standby protection area/capability/actual hours or event footprint/response/recovery and agent formulation/containment; non-repair upkeep work order and task/procedure/equipment with repair exclusion; hangar aircraft dimensions/occupied area/actual hours/climate/ventilation/security and supplier scope; towing aircraft mass/gear/tow mode/tug powertrain/load/actual route distance and all phases; actual meters/materials/species/receivers; shared facilities/assets and whole-life denominator; uncertainty"
  required_quality_disclosure: "Task/aircraft/time representativeness, actual meters/agent and species evidence, pre-existing contamination, supplier/customer ownership, asset-life/receiver gaps and impact-method omissions"
  update_trigger: "Changed family/mode/task/aircraft/route, readiness capability, hangar state/energy, agent formulation/test/containment, provider scope, real equipment configuration or life evidence"
data_sources:
  - id: "un-cpc-air-support"
    type: "official_guidance"
    reference: "UNSD CPC3.0 67630 explanatory note, shared draft PDF pp377–378. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67630"
    used_for: "Four named families and explicit exclusions; open residual title does not establish universal coverage"
  - id: "faa-ground-service"
    type: "official_guidance"
    reference: "FAA AC00-34B, Aircraft Ground Handling, Servicing, and Marshalling, 17 July 2024, especially section13. https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_00-34B.pdf"
    used_for: "Task/aircraft/equipment-specific servicing and towing context; not an emission factor, global safety rule or classification of all ground operations"
  - id: "faa-arff-test"
    type: "official_guidance"
    reference: "FAA Part139 CertAlert26-03, AFFF and Synthetic Fluorine Free Foam testing, 5 August 2026. https://www.faa.gov/airports/airport_safety/certalerts/part_139_certalert_26_03"
    used_for: "Actual AFFF/F3 equipment and testing distinctions; no adoption of US intervals, universal formulation or quantitative release factors"
