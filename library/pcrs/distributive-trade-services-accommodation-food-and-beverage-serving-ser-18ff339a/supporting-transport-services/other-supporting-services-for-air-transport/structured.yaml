allocation_rules:
  - rule_id: allocate_family
    applies_to: "foreground_burden_allocation"
    rule: "Direct-meter actual mission/task/custody or readiness resources. Allocate shared support using documented causal duty, covered capacity/area-time, equipment runtime or task records and actual same-scenario output population. Do not use fee ratios or combine heterogeneous families as equivalent counts."
    source_ids: []
  - rule_id: allocate_standby
    applies_to: "foreground_burden_allocation"
    rule: "For a readiness-hour dataset include attributable checks/training/maintenance that sustain the specified readiness over the observed coverage period, separating general flight training. Event datasets identify whether capacity/readiness share is included; do not charge the same station hour twice through both supplier and owned service. No assumed accident probability."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use supported whole-life actual service utilization to divide identified construction/manufacture and renewals. Retain area-time for buildings and appropriate duty/time/cycle use for equipment. All users/periods cumulative shares cannot exceed one life inventory; no annual reset, invented life or per-task whole asset."
    source_ids: []
  - rule_id: allocate_pollution
    applies_to: "foreground_burden_allocation"
    rule: "Distinguish accident-origin fuel/fire/contamination from additional firefighting resources, captured transfers and incremental releases. Include actual service waste management once without inventing initial pollutant production burdens, avoided fire/pollution credit or automatic recycling substitution."
    source_ids: []
  - rule_id: allocate_supplier
    applies_to: "foreground_burden_allocation"
    rule: "Purchased hangar, ARFF, towing or ground-power services must expose exact included utilities/assets/maintenance/response scope; reconcile owned rows and supplier coverage before summing. Keep customer aircraft propulsion and transferred fuel/gas custody separate from provider combustion."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_completion
      process_id: "completion"
      flow_role: "support_output"
      record_type: "Family-specific completion/coverage ledger"
      raw_fields: "one family and service mode; actual task/aircraft/site/date; start/end/acceptance interfaces; actual duration and physical extent; provider/customer responsibility; fire standby protection area/capability/actual hours or event footprint/response/recovery and agent formulation/containment; non-repair upkeep work order and task/procedure/equipment with repair exclusion; hangar aircraft dimensions/occupied area/actual hours/climate/ventilation/security and supplier scope; towing aircraft mass/gear/tow mode/tug powertrain/load/actual route distance and all phases; actual meters/materials/species/receivers; shared facilities/assets and whole-life denominator; uncertainty"
      collection_method: "Reconcile actual completed named tasks/events with acceptance records. Upkeep uses one identified aircraft and one accepted named non-repair task per block under validate_upkeep_count; retain aircraft-task records for multi-aircraft work orders. Standby count is measured qualified coverage hours divided by 1 hour; hangar count is actual identified-aircraft custody hours divided by 24. Preserve fractions, aircraft footprint, actual capability and all task phases. No fee or entry-count proxy."
      unit: "Item(s)"
      frequency: "each task/event or actual coverage/custody interval"
      temporal_coverage: "complete observed same-scenario service period"
      site_scope: "actual selected function and responsibility gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance log; work order; dispatch/coverage record; timestamps; population reconciliation"
    - protocol_id: cp_energy_fire
      process_id: "fire"
      flow_role: "fire_diesel; fire_power"
      record_type: "End-use/source-specific meter ledger"
      raw_fields: "source/grade; meter start/end; actual fuel deliveries/stock changes; temperature/density or gas calorific basis; kWh/MJ/kg; actual phase time/distance/load; charging losses; supplier overlap; shared support; actual blocks; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Meter each actual energy exchange and trace vehicle, equipment, boiler, station or space end use. Reconcile inventories and observed actual same-scenario blocks; cover idling, waiting, return and restoration where in scope. Retain actual densities/calorific values with units and uncertainty. Customer aircraft fuel delivery is not service combustion; actual integral functional checks are separately identified. Apply this protocol only to its listed fire exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "kg; kWh"
      frequency: "each actual phase and representative observation period"
      temporal_coverage: "all in-scope direct and shared energy"
      site_scope: "actual equipment/space/source"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated meters; fuel balance; phase logs; actual allocation; supplier scope"
