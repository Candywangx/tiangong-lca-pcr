system_boundary:
  rules:
    - rule_id: boundary_fire
      applies_to: "foreground_system_boundary"
      rule: "Include actual aircraft-fire prevention/standby resources or the specified response/containment/restoration event. Allocate genuine readiness testing and support on measured coverage; do not invent an incident or foam discharge for an uneventful hour. Exclude air-sea rescue and unrelated public functions."
      source_ids:
        - un-cpc-air-support
    - rule_id: boundary_foam
      applies_to: "foreground_system_boundary"
      rule: "Record actual concentrate, water, equipment test method, captured runoff and individual uncaptured chemicals. Current FAA guidance distinguishes AFFF/F3 systems and optional testing methods; it supplies no universal discharge factor. Actual batch analysis/formulation and fate are required before naming PFAS species; historical contamination is separate."
      source_ids:
        - faa-arff-test
    - rule_id: boundary_upkeep
      applies_to: "foreground_system_boundary"
      rule: "Include only documented non-repair maintenance/upkeep, actual consumables and integral checks. Identify each task against the applicable aircraft procedure; general FAA ground-service descriptions do not classify every servicing activity into this PCR. Separate excluded cleaning/repair and independent refuelling, and do not manufacture the customer aircraft again."
      source_ids:
        - un-cpc-air-support
        - faa-ground-service
    - rule_id: boundary_hangar
      applies_to: "foreground_system_boundary"
      rule: "Include declared covered-space custody and actual lighting/ventilation/heating/doors/security, facility upkeep and life shares. Separately contracted aircraft upkeep/towing/fire service enters once only if part of the declared package; a hangar location does not turn repairs into hangar service."
      source_ids:
        - un-cpc-air-support
    - rule_id: boundary_towing
      applies_to: "foreground_system_boundary"
      rule: "Include equipment dispatch, hookup, actual tow/pushback, waiting, acceptance, empty return and attributable support. Match aircraft mass/configuration and tug mode to actual route. Customer propulsion/APU is separately disclosed with explicit inclusion if integral, not assigned to tug combustion; independent flight/taxi stays outside."
      source_ids:
        - faa-ground-service
boundary_abstraction:
  declared_starting_condition: "Defined aircraft/support request and actual protection, work-order, hangar-custody or tow-release gate; retain actual upstream support inputs/assets"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Four reviewed named support families with non-repair and other explicit exclusions"
  recursive_input_rule: "Subcontracted same-function support enters once with exact provider boundary and physical extent, removing overlapping owned inputs/assets"
  upstream_dataset_requirement: "Actual fuels/electricity/water/agent/material supply, specific support equipment/facilities and actual waste treatment"
  disclosure: "Family/mode, actual interfaces/duration/extent, customer aircraft status/ownership, provider overlap, restoration/rework, agents/contamination, asset-life evidence and omissions"
