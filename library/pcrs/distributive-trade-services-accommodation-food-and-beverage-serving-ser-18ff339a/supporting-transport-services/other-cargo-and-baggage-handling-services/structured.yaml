allocation_rules:
  - rule_id: allocation_meter
    applies_to: "foreground_burden_allocation"
    rule: "Use task submetering and job records first. Where shared equipment is unavoidable, use measured task energy or fuel; a documented operating-time/load proxy requires calibration and uncertainty. Allocate support lighting by evidenced occupied area-time only where a causal relationship exists."
    source_ids: []
  - rule_id: allocation_mass
    applies_to: "foreground_burden_allocation"
    rule: "Only within the same declared cargo class and route may a justified throughput-mass allocation be used. Preserve loading/unloading counts, idle work, failures and rejected consignments; never average baggage with bulk cargo or infer mass from fees."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate each asset manufacturing and retirement burden by recorded service utilization divided by a documented lifetime utilization denominator. Record period shares and cap cumulative attribution at one asset life; no full crane is consumed per reference transfer. Avoid double counting supplier-included asset burdens."
    source_ids: []
  - rule_id: allocation_custody
    applies_to: "foreground_burden_allocation"
    rule: "Cargo remains customer goods; it is not a co-product. Record damage, spills and their attributable treatment without adding the full manufacture of all handled goods to the service reference. Any incremental replacement scenario is separately declared. No default substitution or recycling credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_activity
      process_id: "handling"
      flow_role: "handled_output"
      record_type: "weighing_record"
      raw_fields: "job_id; cargo_class; gross_mass; tare_mass; accepted_net_mass; start; end; bag_count; rejection; rehandling"
      collection_method: "Use calibrated scale and custody tickets; for baggage retain actual batch mass and bag count. Reconcile receipt and handoff IDs."
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same declared observation period"
      site_scope: "declared terminal route and cargo scenario"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; tickets; mass reconciliation"
    - protocol_id: cp_utilities
      process_id: "handling"
      flow_role: "electricity; diesel; lpg; water"
      record_type: "meter_record"
      raw_fields: "row_id; meter_start; meter_end; task; timestamp; unit; load; stock_change"
      collection_method: "Task meter, weigh issue/return fuel and reconcile stock; segregate each utility and idle operation."
      unit: "row unit"
      frequency: "each job and reconciled period"
      temporal_coverage: "same period as cp_activity"
      site_scope: "owned handling equipment and support"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; stock balance"
    - protocol_id: cp_materials
      process_id: "handling"
      flow_role: "hydraulic_oil; sling"
      record_type: "issue_return_record"
      raw_fields: "specific material; composition; issued; returned; stock; reuse cycles; task"
      collection_method: "Weigh specific issued and returned materials; document reuse attribution and maintenance work."
      unit: "kg"
      frequency: "each maintenance/job"
      temporal_coverage: "same period as cp_activity"
      site_scope: "declared equipment only"
      aggregation_rule: "per reference flow"
      quality_evidence: "issue tickets; maintenance records"
    - protocol_id: cp_assets
      process_id: "handling"
      flow_role: "forklift; crane; conveyor; concrete"
      record_type: "asset_record"
      raw_fields: "asset_id; configuration; manufacturing quantity; lifetime use; actual use; prior shares; end_of_life"
      collection_method: "Asset register, construction bills and hour meters; validate lifetime denominator and supplier burden coverage."
      unit: "row unit"
      frequency: "asset update and reporting period"
      temporal_coverage: "lifetime and same-period task use"
      site_scope: "actually used facilities and equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; utilization ledger; denominator evidence"
    - protocol_id: cp_wastes
      process_id: "handling"
      flow_role: "waste_oil; waste_sling; wastewater"
      record_type: "waste_transfer_record"
      raw_fields: "row_id; mass; composition; contamination; treatment; destination; date; task_share"
      collection_method: "Weigh segregated streams and reconcile waste manifests and actual treatment; retain rejected/damaged-goods streams separately."
      unit: "kg"
      frequency: "each transfer and period"
      temporal_coverage: "same period as cp_activity"
      site_scope: "attributable handling wastes"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing tickets; treatment manifests"
    - protocol_id: cp_emissions
      process_id: "handling"
      flow_role: "fossil_co2; nitrogen_dioxide; pm25"
      record_type: "emission_record"
      raw_fields: "species; source; compartment; engine_id; fuel; operating_hours; test; method; factor_source; capture"
      collection_method: "Measure emissions or use an explicitly cited equipment-specific model with measured activity. Record actual hours and load; no default factors adopted here."
      unit: "kg"
      frequency: "test and matched activity period"
      temporal_coverage: "same period as cp_activity"
      site_scope: "onsite sources only"
      aggregation_rule: "per reference flow"
      quality_evidence: "test report; model version; activity records"
  calculation_rules:
    - id: calc_activity
      applies_to: "handled_output"
      rule: "Net accepted mass is gross minus the evidenced tare, counted once per completed transfer. Divide period attributable exchanges by the number of 1,000 kg accepted-mass reference flows; all cards use that same reference."
      inputs:
        - cp_activity
        - "task records"
      output: "per reference flow"
      source_ids: []
    - id: calc_assets
      applies_to: "forklift; crane; conveyor; concrete"
      rule: "Apply allocation_assets to documented manufacturing quantity and the actual-use/lifetime-use share; distribute the resulting period share on the same reference basis. Unsupported life or utilization remains an uncertainty requiring review."
      inputs:
        - cp_assets
        - cp_activity
      output: "asset share per reference flow"
      source_ids: []
    - id: calc_emissions
      applies_to: "fossil_co2; nitrogen_dioxide; pm25"
      rule: "Use measured species masses or a traceable cited model with matched activity and control efficiency; preserve each species and compartment. Factor choice, units and conversion must be recorded; no NOx-to-NO2 or mass-to-impact shortcut."
      inputs:
        - cp_emissions
        - cp_activity
      output: "species mass per reference flow"
      source_ids:
        - epa-che
  data_quality_requirements:
    - id: dq_mass
      applies_to: "handled_output"
      requirement: "Reconcile net mass, accepted jobs and duplicated handling; no default baggage mass. A service label or price alone is insufficient."
      evidence: "cp_activity"
    - id: dq_routes
      applies_to: "all inventory rows"
      requirement: "Same terminal, period and scenario basis across meters, task records, waste and emission data. Include idle and failed attributable work."
      evidence: "cp_activity; cp_utilities"
    - id: dq_assets
      applies_to: "forklift; crane; conveyor; concrete"
      requirement: "Document lifetime denominator, period boundary, previous shares and sensitivity; no invented service life, equipment mass or automatic zero."
      evidence: "cp_assets"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify exact flow, property, unit and language against Tiangong direct reads before use; unresolved identity does not justify pooled exchanges or a claim of complete validation."
      evidence: "Direct records and gap disclosure"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require 1000 kg accepted net handling activity and one unique handled_output product row. Reject containerized freight, tonne-kilometres, generic service counts and warehouse mass-time as substitutes."
    source_ids:
      - un-cpc3-67190
  - rule_id: validate_separation
    applies_to: "foreground_dataset_conformance"
    rule: "Do not combine passenger baggage, bulk and breakbulk into one average. Verify route qualifiers, measured baggage mass, source/destination interfaces and one-count handoff reconciliation."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Check each present utility, material, equipment, maintenance item, emission species and waste individually; verify upstream and subcontract coverage without double counting. Disclose all missing UUIDs, factors and asset denominators; no complete lifecycle or methodology approval claim from a check alone."
    source_ids: []
published_dataset_profile:
  dataset_role: "handling_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Identified non-container handling input to a declared freight or baggage chain with matched route and mass basis"
  excluded_use: "Universal cargo/baggage average; complete freight transport or goods footprint; carbon-neutrality or classification approval"
  required_metadata: "All reference qualifiers; actual period; scenario; custody boundaries; upstream datasets; allocation; subcontract coverage"
  required_quality_disclosure: "Identity gaps; activity uncertainty; engine method/factors; asset denominator; missing upstream burdens; rejected/damaged goods and scenario limits"
  update_trigger: "Changed cargo scenario, terminal route, equipment, energy supply, contract handoff, emission method or supported asset lifetime"
data_sources:
  - id: "un-cpc3-67190"
    type: "official_guidance"
    reference: "UNSD, Explanatory Notes of the Central Product Classification, Version 3, 10 February 2025, subclass 67190. https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf"
