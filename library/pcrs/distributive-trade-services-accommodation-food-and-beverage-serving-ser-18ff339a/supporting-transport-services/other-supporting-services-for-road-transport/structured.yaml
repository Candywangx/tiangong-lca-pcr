allocation_rules:
  - rule_id: allocate_task
    applies_to: "foreground_burden_allocation"
    rule: "Prefer task-specific fuel, charging and equipment records. Shared preparation, dispatch and standby require measured role/time/activity drivers and reconciliation to the same company period."
    source_ids: []
  - rule_id: allocate_team
    applies_to: "foreground_burden_allocation"
    rule: "Separate independently delivered lead/rear/team scopes; do not allocate by cargo value or call each escort car another complete team task. Multiple escorted loads need explicitly documented shared-task boundaries."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate actual vehicles, tyres and equipment by supported lifetime utilization and task use; identify included fit-out/battery and maintenance. Do not assume lifetime or recovery credit."
    source_ids: []
  - rule_id: allocate_return
    applies_to: "foreground_burden_allocation"
    rule: "Retain empty approach, return, standby and failed-task burden; justify sharing across successive assignments and avoid inventing a successful task for cancelled work."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "escort"
      flow_role: "escort_service"
      record_type: "foreground record"
      raw_fields: "order; positive classification rationale; exact role/team; route; load envelope; vehicle IDs; start/end; duties; acceptance; exceptions"
      collection_method: "Verify signed function-specific work order and completion/handoff with actual trip/communication logs; assess competing carriage/security/public functions."
      unit: "item"
      frequency: "each task"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed task and completion; route/duty log"
    - protocol_id: cp_energy
      process_id: "escort"
      flow_role: "gasoline; diesel; electricity"
      record_type: "foreground record"
      raw_fields: "vehicle/fuel; tank opening/closing; deliveries; charging; loss; route-review/escort/idle/return; attribution"
      collection_method: "Use actual fuel/charging measurements reconciled to escort vehicle trip logs and support meters; exclude carrier truck consumption."
      unit: "kg; kWh"
      frequency: "trip and meter interval"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; fuel/charging records; odometer logs"
    - protocol_id: cp_material
      process_id: "escort"
      flow_role: "oil; flag"
      record_type: "foreground record"
      raw_fields: "specific material; issue/return; actual use; maintenance coverage; task share"
      collection_method: "Reconcile material stock and service issues with actual task/maintenance allocation, retaining each material identity."
      unit: "kg"
      frequency: "issue and period balance"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock cards; formulation; supplier service boundary"
    - protocol_id: cp_asset
      process_id: "escort"
      flow_role: "tyre; petrol_car; diesel_pickup; electric_car; radio; beacon; height_pole"
      record_type: "foreground record"
      raw_fields: "specific asset; fit-out boundary; installation/replacement; actual distance/time/task use; lifetime evidence"
      collection_method: "Bind assets to upstream production and retirement; observe actual utilization and document supported physical life; avoid included-component duplication."
      unit: "item"
      frequency: "asset event and period"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; maintenance records; lifetime evidence"
    - protocol_id: cp_road
      process_id: "escort"
      flow_role: "road_service"
      record_type: "foreground record"
      raw_fields: "escort vehicle; actual road segments; lengths; class; passage count; upstream transport/infrastructure boundary"
      collection_method: "Reconcile actual escort approach/task/return routes with compatible road-operation datasets; preserve segment extent and avoid duplicate road shares."
      unit: "item"
      frequency: "each route segment"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "trip record; upstream boundary verification"
    - protocol_id: cp_waste
      process_id: "escort"
      flow_role: "waste_oil; waste_tyre; waste_flag"
      record_type: "foreground record"
      raw_fields: "specific waste; amount; receiver; treatment; event; task share"
      collection_method: "Measure actual separate wastes, reconcile maintenance coverage and receiver documents; no automatic substitution credit."
      unit: "kg; item"
      frequency: "each transfer"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste manifests; receiver evidence"
    - protocol_id: cp_emission
      process_id: "escort"
      flow_role: "co2_air; co_air; no_air; no2_air; pm25_air"
      record_type: "foreground record"
      raw_fields: "escort engine; fuel; duty; measured exhaust or justified factor/version/unit; species/fraction; task share"
      collection_method: "Use actual escort duty and exhaust or explicitly justified engine/fuel factors; resolve species and avoid overlapping PM; disclose unquantified tyre/brake wear."
      unit: "kg"
      frequency: "duty interval and task"
      temporal_coverage: "same declared operating period"
      site_scope: "actual assigned escort role/team"
      aggregation_rule: "per reference flow"
      quality_evidence: "exhaust/fuel tests; factor applicability; load/units evidence"
  calculation_rules:
    - id: task_denominator
      applies_to: "escort_service"
      rule: "N = completed accepted tasks of the exact declared role/team and extent; require N positive. Constituent warning/communication events are not extra outputs."
      inputs:
        - cp_task
      output: "N"
      source_ids: []
    - id: exchange_allocation
      applies_to: "all inventory rows"
      rule: "Attribute each measured numerator to the complete assigned cycle using explicit physical drivers, then divide by N; preserve actual escort miles/hours and shared return rules."
      inputs:
        - cp_task
        - cp_energy
        - cp_material
        - cp_road
        - cp_waste
      output: "exchange per reference flow"
      source_ids: []
    - id: asset_allocation
      applies_to: "tyre; petrol_car; diesel_pickup; electric_car; radio; beacon; height_pole"
      rule: "Assign production/maintenance/retirement by supported lifetime utilization and actual task use, excluding components already embedded in a supplier inventory; divide attributable share by N."
      inputs:
        - cp_asset
        - cp_task
      output: "asset share per reference flow"
      source_ids: []
    - id: emission_allocation
      applies_to: "co2_air; co_air; no_air; no2_air; pm25_air"
      rule: "Resolve measured or explicitly justified species/fraction mass for actual escort duty, sum non-overlapping intervals and divide allocated mass by N; missing factors/speciation remain gaps."
      inputs:
        - cp_emission
        - cp_energy
        - cp_task
      output: "species per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_function
      applies_to: "escort_service"
      requirement: "Positive physical role/task evidence plus documented residual classification and exclusions; an invoice or unrelated NAICS code is insufficient."
      evidence: "cp_task; un-cpc-67490"
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Same exact role/team, route/extent and period; all actual vehicle travel, standby, equipment and provider coverage reconciled."
      evidence: "cp_task; cp_energy; cp_asset"
    - id: dq_species
      applies_to: "co2_air; co_air; no_air; no2_air; pm25_air"
      requirement: "Real escort source, factor/duty units and atomic species; no generic NOx mass as each nitrogen species or duplicated PM fractions."
      evidence: "cp_emission"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve actual flow identities before database-linked use; historical count support does not verify product flows."
      evidence: "direct identity verification"
validation_rules:
  - rule_id: validate_applicability
    applies_to: "foreground_dataset_conformance"
    rule: "Require documented noncarrier road-movement assistance and reviewed residual classification, including the competing-classification checks. Reject unexamined other service families and the explicit CPC exclusions."
    source_ids:
