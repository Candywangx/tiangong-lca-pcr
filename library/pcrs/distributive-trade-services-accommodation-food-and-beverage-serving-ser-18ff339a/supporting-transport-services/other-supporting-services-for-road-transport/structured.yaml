    used_for: "Assignment, route and actual equipment preparation logic; qualitative technical evidence, not CPC mapping or current legal specification."
  - id: "fhwa-escort-movement"
    type: "official_guidance"
    reference: "FHWA-HOP-16-051, Pilot/Escort Best Practices, chapter III. https://ops.fhwa.dot.gov/publications/fhwahop16051/ch3.htm"
    used_for: "Distinct lead/rear warning/communication role and actual load-movement conditions; no numerical safety factor adopted."
  - id: "fhwa-escort-posttrip"
    type: "official_guidance"
    reference: "FHWA-HOP-16-050, Pilot/Escort Training Manual, module6. https://ops.fhwa.dot.gov/publications/fhwahop16050/m6.htm"
    used_for: "Task closeout, actual mileage/time and condition logs; no default consumption or lifetime."
  - id: "un-cpc-counterclasses"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes, 6511 road freight, 85240 armoured car, 85250 guarding, 91260 police. https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf"
    used_for: "Competing-function exclusions; no automatic crosswalk between escort and residual class."
