system_boundary:
  rules:
    - rule_id: boundary_multimodal
      applies_to: "foreground_system_boundary"
      rule: "For a multimodal logistics plan, specify at least two modelled modes, each planned leg/carrier/terminal interface, handoff constraints, scenario assumptions and accepted plan/support deliverable. Do not undertake client forwarding or carrier procurement as a presumed eligible plan; modelled interfaces are not execution of carriage. Classify by actual function and separability, not fees or vehicle ownership."
      source_ids:
        - un-cpc-67910
        - un-cpc-85630
    - rule_id: boundary_plan
      applies_to: "foreground_system_boundary"
      rule: "For consulting/support, specify transportation/warehouse/distribution problem, sites/network, horizon, scenarios, constraints, input-data quality and accepted plan or operational-support deliverable. Actual implementation/warehouse operation is a separately identified module."
      source_ids: []
    - rule_id: boundary_documents
      applies_to: "foreground_system_boundary"
      rule: "For independent non-intermediary issue/acquisition, record issuer/requester, type, consignment link, unique identifier, master/house relationship, version, copies, authorization and delivery/receipt. Positively establish the separate document function; exclude documents inseparable from client forwarding, carrier procurement or customs brokerage. Obtaining a carrier document does not itself make the service carrier or prove67910 eligibility. Corrections, replicas and repeated electronic submission are not duplicate new support outputs."
      source_ids:
        - ec-efti-context
    - rule_id: boundary_supplier
      applies_to: "foreground_system_boundary"
      rule: "Map hosting/network/specialist supplier responsibilities, time/configuration and included power, cooling, hardware and document processing. Either use the complete purchased service or its justified decomposition once; fees and whole-freight invoices are not physical quantities."
      source_ids: []
    - rule_id: boundary_actual
      applies_to: "foreground_system_boundary"
      rule: "Include attributable site/IT, printing, travel, maintenance and assets for the actual family; screen actual heating/cooling gases, other fuels, storage/data services and waste, adding each real atomic exchange. Unknown consumption is not zero."
      source_ids: []
    - rule_id: boundary_resource_placement
      applies_to: "foreground_system_boundary"
      rule: "Resource placement does not restrict eligibility to one service family: include actual task-related fieldwork/coordination travel for an independent document job and actual printing for a planning/support deliverable. Apply each card and protocol to the real eligible task, retain all corrections/retries and common-resource attribution once, and do not create an extra planning or document reference output. Digital-only tasks have no assumed paper use; absent travel needs documented applicability rather than an invented trip."
      source_ids: []
