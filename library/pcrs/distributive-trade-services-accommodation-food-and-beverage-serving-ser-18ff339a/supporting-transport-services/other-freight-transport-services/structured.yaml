allocation_rules:
  - rule_id: allocate_direct
    applies_to: "foreground_burden_allocation"
    rule: "Prefer direct job logs, metering and runtime/document records. Allocate shared office/IT by documented causal capacity/time/activity drivers; retain standby, administration, rejected attempts and rework attributable to delivery."
    source_ids: []
  - rule_id: allocate_families
    applies_to: "foreground_burden_allocation"
    rule: "Partition genuinely different families, complexity/route/network/document scopes and channels before repeat-job normalization. A combined contract is not multiplied into a multimodal plan, other planning support and document output each carrying the whole burden."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use supported physical service lives and actual utilization for office, laptops, printing, UPS batteries and staff vehicles; financial depreciation is not assumed life. Respect hosted/rental-service included equipment and initial charges."
    source_ids: []
  - rule_id: allocate_goods
    applies_to: "foreground_burden_allocation"
    rule: "Cargo, existing documents and information remain custody objects; no cargo sale/co-product allocation. Link each actual carrier/warehouse/handling burden once downstream; no automatic avoided freight, inventory, paper or fuel credit from the recommended plan."
    source_ids: []
  - rule_id: allocate_gas
    applies_to: "foreground_burden_allocation"
    rule: "Separate actual recovered/transferred refrigerant from atmospheric loss; document recycling treatment without assumed substitution credit."
    source_ids:
      - epa-gas-balance
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "support"
      flow_role: "support_job"
      record_type: "foreground record"
      raw_fields: "job/family/package; client instructions; modes/legs/consignments/handoffs; plan sites/horizon/scenarios/constraints; document identifiers/versions/copies/channels; actual effort/start/end; acceptance/rework"
      collection_method: "Reconcile delivered scope against contract and client acceptance; use positive role/separability proof, planned provider/carrier interface matrix, plan-review record or authorized independent document receipt as applicable; retain revisions and failed work."
      unit: "item"
      frequency: "each engagement and revision"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "accepted delivery, change-control and cross-party reconciliation"
    - protocol_id: cp_supplier
      process_id: "support"
      flow_role: "planning_subcontract"
      record_type: "foreground record"
      raw_fields: "subcontractor role/output; modes/extent; functional boundary; own/provider split; included documents/IT/carriage; quantity"
      collection_method: "Direct-read actual independent planning/support deliverable and supplier upstream boundary; exclude client forwarding, carrier procurement, customs brokerage and carriage, rather than converting a total invoice into support quantity."
      unit: "item"
      frequency: "each supplier task"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier deliverable, boundary and duplication check"
    - protocol_id: cp_energy
      process_id: "support"
      flow_role: "electricity"
      record_type: "foreground record"
      raw_fields: "meter/time; task/site/circuit; local IT/cooling/UPS and office support; allocation; supplier supply"
      collection_method: "Measure actual local consumption and physical task allocation; reconcile site totals without importing hosted-provider energy twice."
      unit: "kWh"
      frequency: "meter period and job"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, bills and job utilization"
    - protocol_id: cp_digital
      process_id: "support"
      flow_role: "host_compute; network_data"
      record_type: "foreground record"
      raw_fields: "provider/region/configuration; instance-runtime; storage inclusion; data bytes; job/call/document ids; power/hardware/cooling coverage"
      collection_method: "Reconcile actual configured runtime and transmitted bytes with task records; separate replicas/retries from new outputs and supplier aggregates from component inventories."
      unit: "h; GB"
      frequency: "job/runtime and billing period"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "usage exports and supplier boundary/version"
    - protocol_id: cp_documents
      process_id: "support"
      flow_role: "paper; toner"
      record_type: "foreground record"
      raw_fields: "deliverable/job id; eligible planning/support or independent transport-document purpose; type/version/copies; print pages; paper size/grammage or mass; toner net/tare; issue/return/spoil; digital route"
      collection_method: "Track actual material balances for eligible planning/support printouts or independent transport documents, including corrections and authorized copies. Count the accepted support_job once rather than printed copies, and retain actual inputs used by rejected versions."
      unit: "kg"
      frequency: "each job/print and stock period"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "print/stock logs, measured net material and version audit"
    - protocol_id: cp_travel
      process_id: "support"
      flow_role: "petrol; rail_travel; air_travel"
      record_type: "foreground record"
      raw_fields: "purpose/job; actual itinerary/passengers; route distance; vehicle/class; fuel stock/use; shared trip; purchased-service coverage"
      collection_method: "Collect only actual staff support journeys; reconcile fuel or passenger-distance separately by mode and attribute shared trips using documented task purpose, never cargo tonne-kilometres."
      unit: "kg; pkm"
      frequency: "each journey"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "journey records, fuel evidence and supplier scope"
    - protocol_id: cp_asset
      process_id: "support"
      flow_role: "laptop; office_building; lead_battery; car_asset; printer"
      record_type: "foreground record"
      raw_fields: "asset/configuration/capacity; floor area; actual life/utilization; initial components; replacement/retirement; supplier inclusions"
      collection_method: "Bind actual assets and physical lifetime evidence to job use; allocate manufacture/maintenance/retirement while excluding duplicated upstream service coverage."
      unit: "item; m2"
      frequency: "asset event and period"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/maintenance records and supported life/utilization"
    - protocol_id: cp_gas
      process_id: "support"
      flow_role: "r134a_input; r134a_air"
      record_type: "foreground record"
      raw_fields: "species; opening/closing stored inventory; acquisitions; offsite/recovery transfers; equipment charge start/end; function share"
      collection_method: "Reconcile actual species stocks and equipment content with contractor records; additions from existing site stock are not additional acquisitions; loss and upstream supply are different quantities."
      unit: "kg"
      frequency: "each transfer and period boundary"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "cylinder/service/recovery records and complete balance"
    - protocol_id: cp_waste
      process_id: "support"
      flow_role: "waste_paper; waste_laptop; waste_battery; waste_cartridge"
      record_type: "foreground record"
      raw_fields: "specific waste; mass/unit configuration; residual content; source task; receiver/reuse/treatment; allocated share"
      collection_method: "Measure each real waste separately, retaining data-confidentiality handling and receiver boundary; reconcile whole cartridge/battery units and residual material without duplication."
      unit: "kg; item"
      frequency: "each transfer"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste/take-back receipts and receiver evidence"
    - protocol_id: cp_emission
      process_id: "support"
      flow_role: "co2_air; co_air; no_air; no2_air; pm25_air"
      record_type: "foreground record"
      raw_fields: "controlled vehicle/fuel/duty; actual fuel; species/fraction; measured exhaust or factor/version/unit; attribution"
      collection_method: "Measure actual species or use justified vehicle/fuel/duty evidence; convert NOx only with defensible speciation and distinguish upstream passenger/freight emissions."
      unit: "kg"
      frequency: "actual controlled journey and period"
      temporal_coverage: "same declared job/reporting period"
      site_scope: "identified actual site/provider and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel/exhaust evidence, factor applicability and species audit"
  calculation_rules:
    - id: job_denominator
      applies_to: "support_job"
      rule: "N is the count of compatible accepted jobs in the explicitly defined family/configuration and extent. One actual job has N=1; require N positive, exclude duplicate versions/copies and record incomplete work disposition."
      inputs:
        - cp_service
      output: "N"
      source_ids: []
    - id: physical_allocation
      applies_to: "all inventory rows"
      rule: "Attribute each measured numerator directly to the job or by documented causal site/runtime/activity shares, then divide by N. Sum allocation shares within the measured supplier/site period to its reconciled total. No fees, freight tkm or nominal number of documents substitute for measured resource use."
      inputs:
        - cp_service
        - cp_energy
        - cp_digital
        - cp_documents
        - cp_travel
      output: "exchange per reference flow"
      source_ids: []
    - id: gas_loss
      applies_to: "r134a_air"
      rule: "Actual loss = opening stored stock + acquisitions + opening equipment content - closing stored stock - offsite transfers - closing equipment content. Recovery remains in closing stock or offsite transfer once; investigate negative/unclosed balances, then allocate measured job share per N. If actual content is unavailable, any capacity-based approximation must explicitly assess undercharge and uncertainty rather than claim exact physical closure."
      inputs:
        - cp_gas
        - cp_service
      output: "species loss per reference flow"
      source_ids:
        - epa-gas-balance
    - id: asset_share
      applies_to: "laptop; office_building; lead_battery; car_asset; printer"
      rule: "Allocate actual asset manufacture, maintenance and retirement using supported physical life and actual utilization; attribute period job shares per N. Do not infer replacement intervals or multiply hosted-provider hardware twice."
      inputs:
        - cp_asset
        - cp_service
      output: "asset share per reference flow"
      source_ids: []
    - id: benefit_separation
      applies_to: "logistics plan or digital-route benefit claims"
      rule: "Any claimed saved fuel, distance, stock or paper requires a separately defined baseline/counterfactual with equal delivered function, actual adoption, boundaries and uncertainty. Keep comparison outside the positive support inventory; no default negative exchange."
      inputs:
        - cp_service
        - "comparison study"
      output: "separate comparison disclosure"
      source_ids: []
  data_quality_requirements:
    - id: dq_deliverable
      applies_to: "support_job"
      requirement: "Verify family, accepted physical extent/complexity and completion evidence; invoice title, fee or a file count alone is inadequate."
      evidence: "cp_service"
    - id: dq_interfaces
      applies_to: "planning_subcontract"
      requirement: "Modelled modes/legs/carrier and terminal interface constraints with duplicate-plan/document checks; prove supplier independent planning role, not forwarding or brokerage."
      evidence: "cp_supplier; cp_service"
    - id: dq_inputs
      applies_to: "host_compute; network_data; paper; toner"
      requirement: "Match instance configuration, actual runtime/bytes, paper/toner balance and revision/retry scope; preserve independent provider processing versus own work."
      evidence: "cp_digital; cp_documents"
    - id: dq_lifecycle
      applies_to: "all inventory rows"
      requirement: "Report actual geography/period, supplier/asset lives, gas/travel uncertainty and upstream omissions; unknown or unresolved data is not zero."
      evidence: "cp_energy; cp_asset; cp_gas; cp_travel"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve each flow and applicable support identity before linked production; historical reference-count support does not resolve inventory flow UUIDs."
      evidence: "direct identity verification"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require positively evidenced logistics consulting/planning/support or separable independent non-intermediary transport-document issue/acquisition. Exclude85610/85630 roles including sea/air freight agents, on-behalf-client organization/forwarding and customs brokerage. Fees, non-ownership of vehicles or coordination wording do not establish applicability."
    source_ids:
      - un-cpc-67910
      - un-cpc-85630
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique support_job at1 item, positive N, complete family-specific extent/complexity/time/interfaces and acceptance. Reject pooled unrelated jobs, duplicate document/copy outputs and a fee/tkm-based output."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Verify actual computing/network/document/field-work resources and each atomic exchange; reconcile supplier power/hardware, original assets and hosted service, materials/wastes and gas stocks without duplication."
    source_ids: []
  - rule_id: validate_system
    applies_to: "foreground_dataset_conformance"
    rule: "A support-only boundary must disclose separately linked actual carrier/storage/handling burdens in the freight system, never imply transport is emission-free. No default optimization/paperless credit or certification follows."
    source_ids: []
  - rule_id: validate_unit_export
    applies_to: "foreground_dataset_conformance"
    rule: "Treat item only as the singular local alias of the formal Number of items unit Item(s). Export Item(s) with the same numerical count and the fully qualified service definition; changing the display token does not change the flow property, service extent or normalization denominator. Do not convert a service item to time, mass, distance or a different family by relabelling its unit, or normalize an already per-reference quantity again."
    source_ids: []
published_dataset_profile:
  dataset_role: "Unit-process defined freight-support engagement"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same positively evidenced non-intermediary planning/document family or eligible package, responsibility, completion, complexity/extent and physical boundaries; separate actual freight modules"
  excluded_use: "Universal per-consignment/document/tkm fee factor; client forwarding/carrier procurement/customs brokerage; all67910 arranging; whole freight-chain footprint; assumed optimization savings"
  required_metadata: "All required qualifiers; accepted N and actual effort; planning mode/handoff interface matrix and role/separability proof; planning acceptance or document-version reconciliation; runtime/material/travel/asset data and supplier coverage"
  required_quality_disclosure: "UUID/support gaps; job comparability limits; cancelled/rework allocation; supplier/asset duplication audit; carrier/storage links; digital/gas/travel/lifetime uncertainties"
  update_trigger: "Family/contract/route/mode/network/consignment or document-system change; hosting configuration/region, supplier boundary, material/travel/asset/lifetime or data-quality change"
data_sources:
  - id: "un-cpc-67910"
    type: "official_guidance"
    reference: "UNSD CPC3.0 67910. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67910"
    used_for: "Three support-service families and passenger/freight intermediation exclusions."
  - id: "un-cpc-85630"
    type: "official_guidance"
    reference: "UNSD CPC3.0 explanatory notes, PDF pages453-454,85630. https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf"
    used_for: "Counterevidence: freight agents, client consignment organization/forwarding and customs brokerage are included in intermediation; conservative functional separation."
  - id: "ec-efti-context"
    type: "official_guidance"
    reference: "European Commission, Towards Paperless Freight Transport: EU takes a step forward with eFTI Regulation implementation,2025-01-09. https://transport.ec.europa.eu/news-events/news/towards-paperless-freight-transport-eu-takes-step-forward-efti-regulation-implementation-2025-01-09_en"
    used_for: "Technical context for paper/electronic freight information and integrated IT data exchange; no implementation date, cost saving, universal certification or LCA reduction factor adopted."
  - id: "epa-gas-balance"
    type: "official_guidance"
    reference: "US EPA, Direct Fugitive Emissions from Refrigeration, Air Conditioning, Fire Suppression, and Industrial Gases,2020,section2.3. https://www.epa.gov/sites/default/files/2020-12/documents/fugitiveemissions.pdf"
    used_for: "Species/stock/acquisition/equipment/offsite balance principle for actual cooling; physical-content and capacity approximation distinguished; no default leakage factor or GWP."
