    - protocol_id: cp_release_layup
      process_id: "layup"
      flow_role: "layup_co2"
      record_type: "Source/species-specific emission ledger"
      raw_fields: "family/source; actual fuel/engine/load; carbon/sulfur/oxidation; measured species kg; NO/NO2 speciation/equivalent basis; air compartment; method applicability; uncertainty; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Measure actual species or use independently verified source/duty/fuel-specific methods. Keep customer voyages, excluded public duties and upstream electricity separate. Record each other actual release/leak and receiver individually; do not copy NOx totals into two species. Apply this protocol only to its listed layup exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "kg"
