  calculation_rules:
    - id: family_attribution
      applies_to: "all inventory rows"
      rule: "Assign actual resources/maintenance/support to one qualified family/extent and divide by its actual completed blocks. No cross-family count averaging. Reference output is exactly 1 Item(s)."
      inputs:
        - cp_completion
        - "actual family records"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: layup_blocks
      applies_to: "support_output"
      rule: "For layup only, divide measured vessel custody hours by 24 to obtain actual blocks, retaining partial days and vessel state/footprint. Do not derive time from fees or an assumed annual occupancy."
      inputs:
        - cp_layup
        - cp_completion
      output: "actual layup block quantity"
      source_ids: []
    - id: layup_electricity_balance
      applies_to: "layup_power; layup_diesel; layup_co2"
      rule: "At consistent interfaces and over the same custody interval, reconcile external electrical deliveries + onsite/onboard generation output = included preservation end uses + excluded/export deliveries + conversion/distribution/storage losses + closing stored energy - opening stored energy. Count only losses not already included in another metered term; retain signed storage change, uncertainty and unexplained differences. Internal generation/storage transfers do not create purchased-electricity inputs. Account for actual generation fuel, direct emissions, maintenance and in-scope dedicated assets once, either within layup or in an explicitly connected generation subprocess, never also through a complete external-electricity dataset for that energy. Allocate to actual preservation scope and normalize once through family_attribution. Carry documented energy-source identity and upstream burdens of opening and closing stored electricity through the same service/period allocation; do not discard opening-stock burdens or assign all closing-stock burdens to the current service."
      inputs:
        - cp_layup
        - cp_completion
      output: "Reconciled external supply and internal preservation-energy ledger"
      source_ids: []
    - id: asset_attribution
      applies_to: "ice_ship_share; registry_workstation; registry_building; layup_berth; hardstanding; cradle"
      rule: "Apply supported family/block share of whole-life utilization to actual manufacture/construction, conserving cumulative fractions and separating already included renewals and other-purpose work."
      inputs:
        - cp_assets_icebreaking
        - cp_assets_registration
        - cp_assets_layup
        - cp_completion
      output: "asset amount per reference flow"
      source_ids: []
    - id: species_accounting
      applies_to: "ice_co2; ice_co; ice_no; ice_no2; ice_so2; layup_co2"
      rule: "Use actual species mass or verified engine/fuel/duty evidence with explicit factors/units and NOx-equivalent conversion documented in the dataset. No numerical load, fuel or emission default is supplied."
      inputs:
        - cp_release_icebreaking
        - cp_release_layup
        - cp_ice_energy
        - cp_layup
      output: "individual species per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_family
      applies_to: "support_output"
      requirement: "Declare one function/extent and completion type; no universal other-support invoice, cross-family count equivalence or claimed legal/safety approval."
      evidence: "cp_completion"
    - id: quality_physical
      applies_to: "icebreaking; layup"
      requirement: "Require actual ice/craft duty or vessel-storage state/time/active-system records; no office-only substitute or default energy per ship."
      evidence: "cp_ice_energy; cp_layup"
    - id: quality_registry
      applies_to: "registration"
      requirement: "Preserve case transaction/outcome, actual processing evidence, first-delivery endpoint and archive boundary. Submission/fee does not prove completed registration."
      evidence: "cp_registry"
    - id: quality_lifecycle
      applies_to: "all asset rows"
      requirement: "Support whole-life service denominator, multi-role attribution, initial/renewal boundary and cumulative conservation; unknown life/upstream scope prevents complete lifecycle claims."
      evidence: "cp_assets_icebreaking; cp_assets_registration; cp_assets_layup"
    - id: quality_gaps
      applies_to: "all inventory rows"
      requirement: "Disclose identity/species/receiver/treatment, ice/habitat/noise and material-preservation evidence gaps and uncertainty; missing is not zero."
      evidence: "cp_waste_icebreaking; cp_waste_registration; cp_waste_layup; cp_release_icebreaking; cp_release_layup; site records"
validation_rules:
  - rule_id: validate_output
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique support_output product output equal to 1 Item(s) with one physically defined completed family block; forbid mixing missions, registry cases and lay-up days into one average."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude vessel cleaning/disinfection/brokerage/public rescue/fire/safety/oil-spill fighting; separate public or multipurpose icebreaker duties by actual logs."
    source_ids:
      - un-cpc-other-water
  - rule_id: validate_process
    applies_to: "foreground_dataset_conformance"
    rule: "Select the actual family-specific process and complete its physical/administrative evidence. Icebreaking does not create assumed passenger/freight outputs; registry does not imply authority approval; lay-up requires actual custody hours and state/preservation scope."
    source_ids: []
  - rule_id: validate_atomic_lifecycle
    applies_to: "foreground_dataset_conformance"
    rule: "Require specific exchanges with correct own properties/units and actual applicability, conserved asset shares, supplier overlap control and real waste receivers. Unknown identities/method evidence remain explicit; no publication readiness or ecological completeness is inferred."
    source_ids: []
  - rule_id: validate_layup_energy
    applies_to: "foreground_dataset_conformance"
    rule: "For lay-up, verify external supply versus onboard/onsite generation, actual AC/DC delivery identity, storage/loss balance and responsible operator. Internal generation/storage discharge cannot be added as purchased electricity; fuel, direct emissions, in-scope generation assets and supplier-covered burdens occur once. Retain original exclusions for unrelated propulsion and customer-vessel manufacture; disclose unresolved power/asset evidence."
    source_ids: []
  - rule_id: validate_protocol_partition
    applies_to: "foreground_dataset_conformance"
    rule: "Each collection protocol must name one existing process_id and only its listed flow rows; each inventory card must link to that protocol for its actual process. Keep one source_record_id and exchange_id for each physical reading, delivery, transfer, emission or asset allocation. Where a source record serves several processes or datasets, record the allocation driver, original total, each assigned share and any out-of-scope residual in one common period ledger; assigned quantities plus the residual must reconcile to the original total. Splitting protocols does not replicate the full reading, create a new service output or restart an asset lifetime allocation. Preserve one matched output denominator for each declared scenario; use process quantities as attribution evidence, not additional normalization. Reconcile internal transfers once and retain cumulative asset shares across all users and periods."
    source_ids: []
published_dataset_profile:
  dataset_role: "other_water_transport_support"
