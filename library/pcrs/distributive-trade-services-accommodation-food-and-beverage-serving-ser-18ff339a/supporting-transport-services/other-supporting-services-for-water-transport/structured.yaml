      raw_fields: "individual stream; actual kg/m3; composition/contamination; source family/event; reuse/regeneration; onboard/shore reception; actual treatment/disposal; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Weigh/meter each stream separately and trace its real receiver/treatment. No presumed hazardousness, direct water release, reception, recycling or avoided burden. Other actual wastes require their own specific rows. Apply this protocol only to its listed registration exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "kg"
