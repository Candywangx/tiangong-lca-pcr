      record_type: "Specific waste/reception ledger"
      raw_fields: "individual stream; actual kg/m3; composition/contamination; source family/event; reuse/regeneration; onboard/shore reception; actual treatment/disposal; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Weigh/meter each stream separately and trace its real receiver/treatment. No presumed hazardousness, direct water release, reception, recycling or avoided burden. Other actual wastes require their own specific rows. Apply this protocol only to its listed layup exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "kg; m3"
      frequency: "each actual transfer/discharge period"
      temporal_coverage: "all attributable actual waste"
      site_scope: "actual family providers and treatment gates"
