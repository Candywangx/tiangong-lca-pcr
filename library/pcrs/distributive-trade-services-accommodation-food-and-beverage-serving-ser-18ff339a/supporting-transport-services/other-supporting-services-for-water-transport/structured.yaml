allocation_rules:
  - rule_id: allocate_family
    applies_to: "foreground_burden_allocation"
    rule: "Separate the three service families and unlike extents before any division. Ice missions use measured craft/engine duty and actual cleared/assisted extent; registry cases use actual processing/IT effort and case type; lay-up uses actual vessel footprint/time and preservation state. Counts across families are not interchangeable."
    source_ids: []
  - rule_id: allocate_ice
    applies_to: "foreground_burden_allocation"
    rule: "Trace convoy/shared-route, positioning/return and seasonal standby to the actual navigation service population with a supported causal method. Separate public rescue, resupply, research, flood control and unrelated multipurpose work. No passenger/cargo transport co-product is presumed from escort or an icebreaker voyage."
    source_ids: []
  - rule_id: allocate_layup
    applies_to: "foreground_burden_allocation"
    rule: "Attribute actual holding resources by compatible vessel footprint/time/state, and transition/inspection events by actual supported service use. Retain partial custody days and empty-facility support transparently. Do not allocate a full stored-vessel manufacturing inventory to each day or assume a preservation credit/extended life."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Maintain persistent icebreaker, IT, office, berth, hardstanding and cradle ledgers with supported whole-life activity/service denominators. Observed periods distribute only already attributed period shares; cumulative manufacture/construction fractions across all jobs/users/periods cannot exceed one or reset annually. Separate actual renewal included upstream; unknown life/denominator requires review and sensitivity."
    source_ids: []
  - rule_id: allocate_provider
    applies_to: "foreground_burden_allocation"
    rule: "A supplier hosting/preservation/icebreaking inventory replaces its covered resource and asset burdens once. Fees, registry legal rights, customer vessels and the mere state of storage are not extra co-products. Actual collected waste receives no automatic recycling/avoided-production credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_completion
      process_id: "completion"
      flow_role: "support_output"
      record_type: "Family-specific completion ledger"
      raw_fields: "selected family; exact block; mission/case/vessel ID; physical extent; actual start/end; accepted output/outcome; operator/provider components; actual custody hours"
      collection_method: "Verify exactly one completed mission or completed specified registry case, or derive actual vessel-storage blocks from custody hours divided by 24. Keep families, types, outcomes and extents separate; no fee or nominal capacity as quantity."
      unit: "Item(s)"
      frequency: "each completion/custody interval"
      temporal_coverage: "complete selected service boundary"
      site_scope: "actual selected-family providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "mission log; formal case decision/delivery; custody timestamps; population reconciliation"
    - protocol_id: cp_ice_energy
      process_id: "icebreaking"
      flow_role: "ice_diesel; ice_shore_power"
      record_type: "Mission ice/duty/energy ledger"
      raw_fields: "mission route/cleared area; actual ice type/thickness/concentration/ridging; weather; convoy/vessel; craft/engine/power; fuel kg/grade/density; charging kWh; assist/transit/idle/wait/return/standby times; actual completion"
      collection_method: "Measure actual engine fuel and electrical supply, reconcile mission/convoy/shared and non-navigation duties. Use actual ice observations and operational logs, not a default fuel per route kilometre or ship escorted."
      unit: "kg; kWh"
      frequency: "each mission phase/meter interval"
      temporal_coverage: "whole actual mission and allocated support"
      site_scope: "actual icebreaking operators/craft"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel/charge meters; ice/route logs; engine duty; shared-task reconciliation"
    - protocol_id: cp_registry
      process_id: "registration"
      flow_role: "registry_power; registry_paper; registry_hosting"
      record_type: "Case processing and initial-delivery ledger"
      raw_fields: "jurisdiction; case/transaction type; vessel; submitted evidence; actual checks/rework; decision/outcome/date; actual staff/IT activity; kWh; paper kg; provider service hours/capacity/region; first delivery; archive cutoff"
      collection_method: "Match actual case workflow and completed decision/delivery; submeter/reconcile actual IT/office activity and paper. Supplier hosting needs actual scope and inventory, not kWh inferred from case count. Keep incomplete work in progress explicit and ongoing registry/archives separately bounded."
      unit: "kWh; kg; h"
      frequency: "each case step and completion"
      temporal_coverage: "actual case through first delivery"
      site_scope: "actual registry and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "case log; recorded decision/document; meters; IT/provider scope; delivery evidence"
    - protocol_id: cp_layup
      process_id: "layup"
      flow_role: "layup_power; layup_diesel"
      record_type: "Custody/state and preservation-energy ledger"
      raw_fields: "vessel dimensions/footprint; afloat/dry site; custody start/end/hours; actual hot/cold/state plan; active systems; staffing; measured ventilation/dehumidification/heating/monitoring/battery loads; actual generator fuel; responsible owner/provider; external delivery meter/AC-DC/voltage/source; onsite/onboard generated kWh; opening/closing stored energy; conversion/charging/discharging losses; excluded/export kWh; generation/supplier boundary and asset coverage; stored-energy source and charge-period IDs; attributed upstream supply inventory"
      collection_method: "Verify real custody and approved-in-context preservation plan; meter actual energy for maintained systems and separate unrelated propulsion/cleaning. Retain partial days, actual equipment cycling and supplier/customer responsibilities; no universal cold/hot energy assumption. Measure external delivery, generation output and end uses separately and reconcile layup_electricity_balance. Internal generation and storage discharge do not enter layup_power. Count actual generator fuel, direct emissions, maintenance and additional dedicated preservation-generation/storage assets once; identify parts already covered by supplier inventories or excluded customer-vessel manufacture, and do not charge them twice."
      unit: "kWh; kg"
      frequency: "each custody/condition/meter interval"
      temporal_coverage: "actual stored period and attributed transitions"
      site_scope: "actual vessel/site and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "custody/state logs; meter/fuel records; preservation execution; scope reconciliation; delivery diagram; electricity/storage balance; generation and supplier-coverage evidence"
    - protocol_id: cp_material_icebreaking
      process_id: "icebreaking"
      flow_role: "ice_hydraulic"
      record_type: "Specific support-material balance"
      raw_fields: "individual chemical/material grade; measured kg; issue/return; replacement/regeneration; actual use/lifetime fraction; stock; recovery; actual leaks; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Weigh each specific material and attribute actual maintenance/preservation use by supported service utilization. Separate vessel cleaning/disinfection from in-scope state preservation; no full rope or oil-change inventory per block. Apply this protocol only to its listed icebreaking exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "kg"
      frequency: "each actual material/maintenance event"
      temporal_coverage: "actual support/preservation assigned"
      site_scope: "actual selected family assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; compatibility/grade; stock/material balance; use records"
    - protocol_id: cp_material_layup
      process_id: "layup"
      flow_role: "preservation_oil; silica_gel; mooring_rope"
      record_type: "Specific support-material balance"
      raw_fields: "individual chemical/material grade; measured kg; issue/return; replacement/regeneration; actual use/lifetime fraction; stock; recovery; actual leaks; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Weigh each specific material and attribute actual maintenance/preservation use by supported service utilization. Separate vessel cleaning/disinfection from in-scope state preservation; no full rope or oil-change inventory per block. Apply this protocol only to its listed layup exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "kg"
      frequency: "each actual material/maintenance event"
      temporal_coverage: "actual support/preservation assigned"
