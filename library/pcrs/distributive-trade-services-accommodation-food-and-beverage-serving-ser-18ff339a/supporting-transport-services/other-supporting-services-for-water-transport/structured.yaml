      collection_method: "Match actual family assets and supported whole-life service utilization; conserve cross-job/user/period shares and avoid double counting renewals included upstream. Stored customer-vessel manufacture is outside the storage-service asset numerator. Unknown life/denominator requires explicit review. Apply this protocol only to its listed icebreaking exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "Item(s)"
