system_boundary:
  rules:
    - rule_id: boundary_ice
      applies_to: "foreground_system_boundary"
      rule: "Include actual ice-route/harbour clearance, escort/convoy assistance, dispatch, positioning, waiting, retries, return and support only to the extent attributable to navigation icebreaking. Canadian Coast Guard examples establish actual route/harbour/convoy distinctions; broader public program tasks remain separately scoped."
      source_ids:
        - ccg-icebreaking
    - rule_id: boundary_registry
      applies_to: "foreground_system_boundary"
      rule: "Include actual receipt, evidence processing, checks, decision/record update and first delivery for the declared transaction. Separate initial/renewal/change/cancellation and outcome complexity; a completed processing decision does not make this PCR an authority to register a ship. Scope ongoing post-case archive/registry operation separately and avoid unlimited default retention."
      source_ids:
        - uk-registry
    - rule_id: boundary_layup
      applies_to: "foreground_system_boundary"
      rule: "Include actual storage custody, monitoring/mooring and agreed state-preservation systems with operator/customer responsibility explicit. Record hot/cold/other state as actually specified rather than default energy. Preservation energy is included once when within the selected service even if a customer-owned generator supplies it; exclude unrelated propulsion, vessel manufacture and separate cleaning/disinfection/recommissioning. DNV public guidance supports site/mooring/preservation planning, not an unread recommended-practice limit."
      source_ids:
        - dnv-layup
    - rule_id: boundary_releases
      applies_to: "foreground_system_boundary"
      rule: "Screen actual fuels, refrigerants, preservation chemicals, bilge/sewage, leaks, water/ice disturbance, wake and noise by actual receiving waterbody. Collected waste is not automatically released to sea. Chemical cards alone do not establish complete ice/habitat or local ecological coverage."
      source_ids: []
