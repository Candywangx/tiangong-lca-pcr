      raw_fields: "asset ID/configuration; construction/manufacture; actual item/m2/m; actual family use; supported lifetime service denominator; multipurpose share; prior cumulative fraction; period fraction; renewals/sensitivity; source_record_id; exchange_id; process_id; attribution driver; assigned share; reporting period"
      collection_method: "Match actual family assets and supported whole-life service utilization; conserve cross-job/user/period shares and avoid double counting renewals included upstream. Stored customer-vessel manufacture is outside the storage-service asset numerator. Unknown life/denominator requires explicit review. Apply this protocol only to its listed layup exchanges. Reconcile shared records under validate_protocol_partition."
      unit: "m; m2; Item(s)"
      frequency: "each allocation and asset/renewal update"
      temporal_coverage: "supported whole life and actual observation period"
      site_scope: "identified craft/IT/office/storage assets"
      aggregation_rule: "per reference flow"
