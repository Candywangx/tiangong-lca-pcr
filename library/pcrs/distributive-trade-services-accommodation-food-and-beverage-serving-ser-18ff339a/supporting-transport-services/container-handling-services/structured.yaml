system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "foreground_system_boundary"
      rule: "Include actual lifting, internal tractor moves, retries, standby, relevant yard lighting/control and attributable maintenance through the recorded end-interface handover. Select the real equipment route rather than assuming that every terminal uses diesel cranes."
      source_ids:
        - epa-che
    - rule_id: boundary_custody
      applies_to: "foreground_system_boundary"
      rule: "Carry the identities and actual gross mass of goods/container through the activity ledger; do not import their full manufacture into a handling service or create duplicate goods outputs. Separate external haulage and contracted storage."
      source_ids:
        - un-cpc-container
    - rule_id: boundary_assets
      applies_to: "foreground_system_boundary"
      rule: "Screen equipment manufacture, yard pavement construction/renewal and terminal support; add one specific exchange for each other actual asset or utility. Disclose upstream exclusions; absent evidence is not a zero burden."
      source_ids: []
    - rule_id: boundary_releases
      applies_to: "foreground_system_boundary"
      rule: "Screen each actual fuel, pollutant species, oil leak, maintenance waste and washwater; keep emissions to air, waste sent to treatment and upstream electricity emissions separate. A NOx total requires a reviewed species treatment and cannot populate both NO and NO2 rows."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Container is accepted at the defined start interface (vessel, vehicle or identified stack position) with existing goods, container and installed terminal; upstream resources and assets are not assumed burden-free"
  starting_condition_role: "foreground_start"
  product_classification_scope: "The specified container handling cycle only; no automatic extension to freight transport or storage"
  recursive_input_rule: "Subcontracted handling within the same cycle enters once as its defined service share with upstream inventory; remove the overlapping owned energy/equipment operations"
  upstream_dataset_requirement: "Geographically and technically matched utilities, fuels, maintenance, specific equipment manufacturing, pavement construction and treatment inventories"
  disclosure: "Exact custody endpoints and dwell cutoff; all operators/sites/periods; lifts, fuels, utilities, assets, waste and emission screen; upstream gaps and explicit exclusions"
