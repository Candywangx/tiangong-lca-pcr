allocation_rules:
  - rule_id: allocate_meter
    applies_to: "foreground_burden_allocation"
    rule: "Submeter the specific route first. Where shared, allocate reconciled actual energy/support totals using measured equipment load-time and documented cycle activity; retain standby and failed attempts. Split unlike routes before division by accepted cycles; neither TEU nor revenue alone proves equal work."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Maintain a persistent asset ledger. Attribute equipment and the identified pavement section by supported lifetime service utilization and actual cycle use; observed-period accounting distributes only the already attributed period share. Cumulative allocated manufacturing/construction shares across all cycles and periods must not exceed one. Do not reset at each reporting year; unknown lifetime or denominator remains explicit review."
    source_ids: []
  - rule_id: allocate_overlap
    applies_to: "foreground_burden_allocation"
    rule: "A service provider inventory replaces its covered operating/asset burdens once. Reconcile port support, paid storage and other services before allocation; service price and custody goods are not co-products. Segregated maintenance waste receives no automatic avoided-production credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_activity
      process_id: "handling"
      flow_role: "accepted_cycle"
      record_type: "Custody activity ledger"
      raw_fields: "container ID; type; loaded state; gross mass; endpoints/times; modes; lifts; rehandles; internal distance; dwell; acceptance"
      collection_method: "Match start/end records for the same box and completed declared stage; retain unsuccessful operations in its inventory"
      unit: "Item(s)"
      frequency: "each cycle"
      temporal_coverage: "full cycle including retry and intermediate dwell"
      site_scope: "all included terminal operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "custody receipts; terminal operating system events; accepted totals reconciliation"
    - protocol_id: cp_energy
      process_id: "handling"
      flow_role: "electricity; reefer_electricity"
      record_type: "Meter and equipment log"
      raw_fields: "meter; interval; kWh; voltage; grid; equipment hours; standby; charging loss; shared support; reefer connection times and temperature; separate reefer meter; allocations"
      collection_method: "Submeter or reconcile interval meters with measured load-time; do not use rated power without actual duty evidence"
      unit: "kWh"
      frequency: "each meter interval/cycle"
      temporal_coverage: "full cycle plus attributable standby/support"
      site_scope: "included terminal and subcontractors"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated meters; activity logs; supplier boundary reconciliation"
    - protocol_id: cp_fuel
      process_id: "handling"
      flow_role: "diesel"
      record_type: "Fuel balance"
      raw_fields: "fuel grade; receipts; stock; measured kg; actual litres/density/temperature; equipment; route share"
      collection_method: "Reconcile issues and stock changes; preserve measured fuel identity and any density conversion"
      unit: "kg"
      frequency: "each issue and reporting interval"
      temporal_coverage: "full attributable operation"
      site_scope: "actual fuel-burning equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel invoices; tank readings; density records; consumption reconciliation"
    - protocol_id: cp_material
      process_id: "handling"
      flow_role: "hydraulic_oil"
      record_type: "Maintenance material balance"
      raw_fields: "grade; issued/returned oil kg; stock; maintenance event; asset; recovered oil; leak"
      collection_method: "Weigh or use traceable actual product density; assign actual maintenance to supported service use"
      unit: "kg"
      frequency: "each maintenance event"
      temporal_coverage: "maintenance supporting the declared service period"
      site_scope: "included terminal assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "maintenance and stock ledger; supplier specifications"
    - protocol_id: cp_water
      process_id: "handling"
      flow_role: "water"
      record_type: "Water meter"
      raw_fields: "meter; m3; cleaning event; support allocation; wastewater destination"
      collection_method: "Meter attributable supply, separating cargo cleaning outside scope"
      unit: "m3"
      frequency: "each cleaning/meter interval"
      temporal_coverage: "all actual cleaning/support"
      site_scope: "included terminal"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter records; cleaning log; water balance"
    - protocol_id: cp_assets
      process_id: "handling"
      flow_role: "crane_share; tractor_share; pavement_share"
      record_type: "Persistent asset utilization ledger"
      raw_fields: "asset ID/type/configuration; manufacturing or construction inventory; item count or pavement area m2; actual service utilization; supported lifetime service denominator; prior cumulative share; period share; renewal events"
      collection_method: "Link real equipment/section to its upstream inventory and use ledger. Assign only the actual cycle fraction; conserve cumulative shares across periods; no default lifespan or asset mass"
      unit: "Item(s); m2"
      frequency: "each cycle allocation and asset update"
      temporal_coverage: "full supported asset life with declared observation period"
      site_scope: "actual owned crane/tractor and identified asphalt yard section"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset records; construction plans; operating logs; denominator support; sensitivity; cumulative fraction reconciliation"
    - protocol_id: cp_waste
      process_id: "handling"
      flow_role: "used_oil; wire_rope; oily_washwater"
      record_type: "Segregated waste ledger"
      raw_fields: "individual stream; measured kg or m3; composition; maintenance event; recipient; treatment; attributable share"
      collection_method: "Weigh each solid/oil stream and meter washwater separately; reconcile actual treatment and overlap"
      unit: "kg; m3"
      frequency: "each waste transfer"
      temporal_coverage: "full attributable maintenance/cleaning"
      site_scope: "actual terminal and treatment handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh tickets; transfer notes; waste composition; treatment inventory"
    - protocol_id: cp_release
      process_id: "handling"
      flow_role: "fossil_co2; nitrogen_monoxide; nitrogen_dioxide; carbon_monoxide"
      record_type: "Species-specific release record"
      raw_fields: "pollutant species; kg; air compartment; fossil origin; equipment/load; sampling; actual fuel; supported factor and basis if calculated"
      collection_method: "Use actual species measurements or reviewed fuel/equipment-specific calculation evidence; maintain NO and NO2 distinction and uncertainty; no default emission factor"
      unit: "kg"
      frequency: "each monitored operation or representative supported interval"
      temporal_coverage: "all actual onsite emitting operations"
      site_scope: "included terminal equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "measurement reports; documented factors; fuel/load reconciliation; uncertainty"
  calculation_rules:
    - id: cycle_attribution
      applies_to: "all inventory rows"
      rule: "Assign directly measured cycle exchanges first; for a homogeneous declared route divide reconciled attributable period totals by actual completed cycle count. Failed operations remain in numerator. Reference output is exactly 1 Item(s)."
      inputs:
        - cp_activity
        - "actual attributable totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "crane_share; tractor_share; pavement_share"
      rule: "Multiply the specific upstream asset inventory by the supported cycle fraction of whole-life service. Reconcile prior and current fractions; do not allocate a whole asset in every observation period."
      inputs:
        - cp_assets
        - "supported lifetime denominator"
        - "cycle use"
      output: "asset amount per reference flow"
      source_ids: []
    - id: pollutant_accounting
      applies_to: "fossil_co2; nitrogen_monoxide; nitrogen_dioxide; carbon_monoxide"
      rule: "Calculate each species only from its verified equipment/fuel/activity basis when direct measurement is absent; record actual factor, units and uncertainty in the dataset. Do not copy NOx to individual species or upstream electricity CO2 to onsite release."
      inputs:
        - cp_release
        - cp_fuel
        - "reviewed species evidence"
      output: "individual release amount per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_cycle
      applies_to: "accepted_cycle"
      requirement: "Demonstrate matched stage handovers and all reference qualifiers; when loading and unloading are separate stages, prevent counting their sum again as an additional full transfer. Distinguish boxes, TEU, lifts and cycles; report incomparable routes separately."
      evidence: "cp_activity"
    - id: quality_coverage
      applies_to: "all inventory rows"
      requirement: "Reconcile complete fuel/energy/material/waste activity and operator boundaries, conditional absence and actual upstream datasets; unresolved evidence is disclosed, never zero."
      evidence: "cp_energy; cp_fuel; cp_material; cp_water; cp_waste; cp_release"
    - id: quality_assets
      applies_to: "crane_share; tractor_share; pavement_share"
      requirement: "Verify supported life/service denominator and conserved cumulative share. Unknown denominator prevents a complete lifecycle claim; report sensitivity and future reconciliation."
      evidence: "cp_assets"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify each semantic flow, property, unit group and compartment against direct identity evidence before adopting a UUID; keep unsupported identities separate from verified records."
      evidence: "actual identity evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require one unique accepted_cycle product output equal to 1 Item(s) and matched start/end handovers of one declared handling stage for a container with the declared type, length, loaded state and conditioning requirement. Reject TEU, lifts, tonnes, tkm and goods outputs as substitute reference counts."
    source_ids:
