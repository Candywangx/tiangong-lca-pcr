allocation_rules:
  - rule_id: allocate_mission
    applies_to: "foreground_burden_allocation"
    rule: "Directly attribute task fuel/charging and scene operation first. Shared legs require actual route/time/load evidence; allocate approach and post-delivery repositioning consistently, without assuming every task returns to base."
    source_ids: []
  - rule_id: allocate_failures
    applies_to: "foreground_burden_allocation"
    rule: "Retain task-attributable waiting, cancelled attempts and rework in matched comparable mission totals, and divide by accepted completed tasks. Zero completed output cannot support a fabricated per-task intensity."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate actual configured truck, winch and maintenance manufacture/retirement by documented use over supported lifetime use; reconcile initial/replacement components and cumulative shares capped at one life. No assumed truck mass, lifetime kilometres or winch capacity."
    source_ids: []
  - rule_id: allocate_custody
    applies_to: "foreground_burden_allocation"
    rule: "Customer vehicles are service objects, not co-products or newly produced vehicles. Allocate actual recovery-caused damage/spill treatment transparently and keep subsequent repair/storage/scrapping in separate linked scopes. No avoided-damage or recycling credit by default."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "towing"
      flow_role: "towing_output"
      record_type: "mission_record"
      raw_fields: "task/vehicle ID; incident; vehicle mass/class/powertrain; method; origin/destination; dispatch/approach/load/tow/unload/handoff; empty/reposition distance; waiting; failed attempts; acceptance"
      collection_method: "Reconcile GPS/odometer, dispatch log, scene records and signed handoff by unique task; keep loaded and empty phases and caller cancellation distinct."
      unit: "item"
      frequency: "each mission"
      temporal_coverage: "full task and matched support period"
      site_scope: "one declared vehicle/incident/method scenario"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch/GPS; handoff; vehicle evidence"
    - protocol_id: cp_energy
      process_id: "towing"
      flow_role: "diesel; petrol; electricity; water"
      record_type: "meter_record"
      raw_fields: "row; vehicle/engine; fuel stock; measured fuel; charger readings; phase distance/hours; idling/PTO; depot task share; density/conditions"
      collection_method: "Use actual vehicle fuel/charging and water records with stock reconciliation; separate drive and PTO energy only when meters support the split. Volume conversion needs fuel-specific evidence."
      unit: "row unit"
      frequency: "each task and fuel/charging period"
      temporal_coverage: "same period as cp_task"
      site_scope: "actual towing fleet and support"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; fuel/charger ledger; phase log"
    - protocol_id: cp_materials
      process_id: "towing"
      flow_role: "hydraulic_oil; engine_oil; wire_rope; strap; tyre"
      record_type: "maintenance_record"
      raw_fields: "specific material/part; issued/returned mass; replacement; reuse/life use; configuration; task share"
      collection_method: "Weigh actual maintenance/material quantities and document supported utilization shares; reconcile initial components and outsourced service contents."
      unit: "kg"
      frequency: "maintenance event and period"
      temporal_coverage: "same fleet period as tasks"
      site_scope: "identified towing equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "work orders; stock; reuse ledger"
    - protocol_id: cp_assets
      process_id: "towing"
      flow_role: "tow_truck; winch"
      record_type: "asset_record"
      raw_fields: "asset ID; configuration; powertrain; manufacture/component scope; actual use; supported lifetime use; previous shares; retirement"
      collection_method: "Reconcile asset register, upstream manufacture and odometer/hour ledger with supported lifetime denominator; separately identify embedded winch/rope components."
      unit: "item"
      frequency: "asset update and matched period"
      temporal_coverage: "asset life plus task period"
      site_scope: "actual towing equipment only"
      aggregation_rule: "per reference flow"
      quality_evidence: "register; component scope; denominator evidence"
    - protocol_id: cp_waste
      process_id: "towing"
      flow_role: "waste_hydraulic; waste_engine_oil; waste_rope; waste_tyre; wastewater"
      record_type: "waste_record"
      raw_fields: "specific stream; mass; composition; contamination; origin; treatment; destination; date; task/fleet share"
      collection_method: "Measure segregated maintenance/cleaning streams and reconcile manifests; customer spills and tyres left on the vehicle are not automatically operator waste."
      unit: "kg"
      frequency: "each waste event"
      temporal_coverage: "same period as maintenance/task share"
      site_scope: "attributable towing operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; manifests; responsibility"
    - protocol_id: cp_emissions
      process_id: "towing"
      flow_role: "fossil_co2; methane; nitrous_oxide; nitrogen_dioxide; pm25"
      record_type: "emission_record"
      raw_fields: "species; fuel/carbon origin; engine/technology/year; activity; phase; model/test; source factor; control; compartment"
      collection_method: "Use actual measurements or cited vehicle/engine-specific methods with matched fuel and phase records. Preserve each species, origin and receiving compartment; keep supply emissions separate."
      unit: "kg"
      frequency: "test and matched mission period"
      temporal_coverage: "same period as cp_task"
      site_scope: "actual mobile/support sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "test/model source; fuel and phase records"
  calculation_rules:
    - id: calc_task_intensity
      applies_to: "all inventory rows"
      rule: "Reconcile complete attributable mission exchanges and consistent approach/repositioning/support shares; divide matched comparable totals by accepted completed tasks. Phases cannot be omitted because no customer is onboard."
      inputs:
        - cp_task
        - cp_energy
        - cp_materials
        - cp_waste
      output: "per reference flow"
      source_ids: []
    - id: calc_assets
      applies_to: "tow_truck; winch"
      rule: "Apply allocate_assets using actual utilization and supported lifetime denominator, then normalize attributable period shares on cp_task. Unproven life or component overlap remains a disclosed review gap."
      inputs:
        - cp_assets
        - cp_task
      output: "per reference flow"
      source_ids: []
    - id: calc_emission_species
      applies_to: "fossil_co2; methane; nitrous_oxide"
      rule: "Use measured species mass or a cited fuel-/technology-specific method with actual phase activity and documented control. Fuel-based CO2 and activity-based CH4/N2O must retain their own actual bases; no universal fuel economy, mileage-only idling proxy, NOx-to-NO2 shortcut or default impact factor."
      inputs:
        - cp_emissions
        - cp_energy
        - cp_task
      output: "species mass per reference flow"
      source_ids:
        - epa-mobile-combustion
    - id: calc_other_pollutants
      applies_to: "nitrogen_dioxide; pm25"
      rule: "Use pollutant-specific measurement or an independently cited equipment/technology method with actual activity; preserve NO2 speciation and PM2.5 size cutoff. The GHG mobile-combustion source does not establish these pollutant factors."
      inputs:
        - cp_emissions
        - cp_energy
        - cp_task
      output: "species mass per reference flow"
      source_ids: []
