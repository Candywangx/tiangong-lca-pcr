system_boundary:
  rules:
    - rule_id: boundary_tow
      applies_to: "foreground_system_boundary"
      rule: "Include actual service stages and vehicle relocation for breakdown or other towing reasons. Keep customer vehicle manufacture/routine use and independent repair/storage outside; only actual attributable recovery activity enters."
      source_ids:
        - un-cpc3-67440
    - rule_id: boundary_configuration
      applies_to: "foreground_system_boundary"
      rule: "Declare the actual configured recovery equipment, including lifting/loading apparatus and winch where present. One method is not presumed suitable or energetically equivalent for every customer vehicle."
      source_ids:
        - dvsa-recovery-equipment
    - rule_id: boundary_energy
      applies_to: "foreground_system_boundary"
      rule: "Record fuel by actual tow-vehicle/engine and activity, including idling and empty phases. Separate purchased electric energy and upstream energy supply from direct mobile combustion."
      source_ids:
        - epa-mobile-combustion
    - rule_id: boundary_atomic
      applies_to: "foreground_system_boundary"
      rule: "Add every actual separately identified fuel, refrigerant, maintenance part, spill-cleanup material, waste and emission species omitted from the initial cards. Check depot dispatch/cleaning and asset burden coverage; absent equipment needs recorded applicability."
      source_ids: []
