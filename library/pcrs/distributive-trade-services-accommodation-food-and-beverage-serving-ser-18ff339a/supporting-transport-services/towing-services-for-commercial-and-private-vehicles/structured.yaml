      applies_to: "all inventory rows"
      requirement: "Reconcile full empty/loaded/scene/waiting/cleanup and failed-attempt coverage; maintain actual configuration and matched periods across fuel, charging and support."
      evidence: "cp_task; cp_energy"
    - id: dq_assets
      applies_to: "tow_truck; winch"
      requirement: "Require evidenced lifetime/utilization and initial/replacement scope, with sensitivity for uncertain denominators."
      evidence: "cp_assets"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify exact flow/property/unit and official Chinese name before adoption. Missing UUIDs remain individual gaps, never a pooled fuel/material label or proof of full validation."
      evidence: "Direct-read support and unresolved register"
validation_rules:
  - rule_id: validate_task
    applies_to: "foreground_dataset_conformance"
    rule: "Require one towing_output of 1 item linked to one accepted vehicle relocation with declared start/end and method. Reject tonne-km, fees or repair-only jobs as substitutes."
    source_ids:
      - un-cpc3-67440
  - rule_id: validate_phase_boundary
    applies_to: "foreground_dataset_conformance"
    rule: "Verify dispatch, empty approach, scene work, loaded towing, handoff and actual repositioning attribution, including waits/retries. Reconcile subcontract stages and customer/repair/storage boundaries without double counting."
    source_ids: []
  - rule_id: validate_atomicity
    applies_to: "foreground_dataset_conformance"
    rule: "Each actual fuel, utility, part, asset, waste and emitted species requires its own specific exchange and same reference denominator. Audit component overlap, life shares and identity/upstream gaps; a parser pass is not methodology publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "vehicle_towing_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified towing/recovery task component in an identified incident, vehicle-operation or enforcement scenario"
  excluded_use: "Universal tow factor independent of vehicle/method/distance; original customer vehicle manufacture; complete repair, storage or scrapping footprint"
  required_metadata: "All task qualifiers; phase distances/times; mission/support/subcontract allocation; energy origin; actual asset/component scope; upstream identities"
  required_quality_disclosure: "Failed task and repositioning coverage; vehicle-mass/phase uncertainty; emissions method; life denominator; missing UUIDs/upstream inventory; damage and responsibility limits"
  update_trigger: "Changed incident/vehicle class, route, towing apparatus, powertrain, fleet operation, contract boundary, maintenance or lifetime evidence"
