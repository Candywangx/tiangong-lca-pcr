allocation_rules:
  - rule_id: allocation_direct
    applies_to: "foreground_burden_allocation"
    rule: "Use direct submetering and actual event/task records first. Ticket IT follows measured terminal/session activity; custody equipment follows actual consignment duration/occupancy; station space support uses evidenced occupied area-time and passenger use where causal."
    source_ids: []
  - rule_id: allocation_complete
    applies_to: "foreground_burden_allocation"
    rule: "Distribute matched-period support including attributable standby, low-use hours and failures over completed comparable events. Do not erase idle facility burdens, equate tickets sold with all station visitors, or count passengers once at each internal checkpoint."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "foreground_burden_allocation"
    rule: "For each real asset use actual utilization divided by supported lifetime utilization, reconcile period/previous shares and cap cumulative attribution at one full life. No arbitrary building life or equipment mass; supplier-covered manufacture is not counted twice."
    source_ids: []
  - rule_id: allocation_interfaces
    applies_to: "foreground_burden_allocation"
    rule: "Keep bus operation, carrier idling, independent baggage loading, tenants and contractor scopes reconciled. A separately reported carrier-idling scenario stays linked to carriage and must not also be embedded in station service."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_events
      process_id: "terminal"
      flow_role: "terminal_output"
      record_type: "event_record"
      raw_fields: "event_id; subtype; included functions; passenger count; start/end; success; transaction/consignment; dwell; opening hours; operator split"
      collection_method: "Reconcile access counts and completed office/custody logs by unique event; keep failed actions and internal checkpoints distinct. For custody retain actual bag count, mass and period without equating it to loading service."
      unit: "item"
      frequency: "each event and reconciled period"
      temporal_coverage: "whole matched operating period"
      site_scope: "one declared service scenario"
      aggregation_rule: "per reference flow"
      quality_evidence: "event ledger; access counts; completed records"
    - protocol_id: cp_utilities
      process_id: "terminal"
      flow_role: "electricity; natural_gas; diesel; water"
      record_type: "meter_record"
      raw_fields: "row; readings; unit; stock; region; voltage; operating schedule; hall/platform; tenant/carrier share"
      collection_method: "Read calibrated meters and fuel/water bills with task/zone allocation; retain standby and separate vehicle energy and tenant loads."
      unit: "row unit"
      frequency: "meter interval and billing period"
      temporal_coverage: "same period as events"
      site_scope: "operator service scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; bills; zone diagrams"
    - protocol_id: cp_materials
      process_id: "terminal"
      flow_role: "ticket_paper; tissue; cleaner"
      record_type: "material_record"
      raw_fields: "specific material; issued/returned mass; formulation; concentration; stock; task"
      collection_method: "Weigh actual material use and reconcile stock; preserve cleaning-solution versus active-ingredient basis and issued paper versus sold goods."
      unit: "kg"
      frequency: "each issue and period"
      temporal_coverage: "same period as events"
      site_scope: "actual station consumables"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock ledger; weighing; supplier composition"
    - protocol_id: cp_assets
      process_id: "terminal"
      flow_role: "building; ticket_terminal; hvac; locker"
      record_type: "asset_record"
      raw_fields: "asset_id; configuration; manufacture scope; construction inventory; actual use; lifetime utilization; previous shares; retirement"
      collection_method: "Use actual asset/construction records and equipment/space utilization; independently justify life denominator and supplier component coverage."
      unit: "item"
      frequency: "asset changes and period"
      temporal_coverage: "asset life and current events"
      site_scope: "actually used station assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "register; life evidence; utilization ledger"
    - protocol_id: cp_waste
      process_id: "terminal"
      flow_role: "waste_paper; wastewater; waste_tissue"
      record_type: "waste_record"
      raw_fields: "stream; mass; contamination; source; destination; treatment; date; allocation"
      collection_method: "Measure segregated streams and reconcile treatment manifests, including paper already in sewage to prevent double counting."
      unit: "kg"
      frequency: "each disposal and period"
      temporal_coverage: "same period as events"
      site_scope: "station scope excluding tenant/vehicle wastes"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; manifests; sewage records"
    - protocol_id: cp_emissions
      process_id: "terminal"
      flow_role: "fossil_co2"
      record_type: "emission_record"
      raw_fields: "species; source; fuel; carbon content; test/model; activity; compartment"
      collection_method: "Use measured station-source emissions or a cited fuel-specific method and measured activity; vehicle emissions remain in carrier inventories."
      unit: "kg"
      frequency: "test and activity period"
      temporal_coverage: "same period as events"
      site_scope: "actual station boiler/generator"
      aggregation_rule: "per reference flow"
      quality_evidence: "test; fuel record; method source"
    - protocol_id: cp_refrigerant
      process_id: "terminal"
      flow_role: "r134a_supply; r134a_air"
      record_type: "refrigerant_balance"
      raw_fields: "species; beginning/end stock; acquisitions; disbursements; beginning/end equipment charge; servicing; recovery; contractor coverage"
      collection_method: "Apply individual-species material balance with documented stock and installed-charge changes; distinguish supply, recovery and emissions. Supplier/manufacturer-filled charge is reconciled to avoid double counts."
      unit: "kg"
      frequency: "each service and reporting period"
      temporal_coverage: "same period as events"
      site_scope: "actual station refrigerant equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "service invoices; cylinder weighing; stock/charge ledger"
  calculation_rules:
    - id: calc_completed_events
      applies_to: "terminal_output"
      rule: "Count unique completed comparable events with stated extent, excluding internal duplicate records and failed/cancelled events; their attributable work remains in inputs. Divide matched-period allocated exchanges by completed event count."
      inputs:
        - cp_events
        - cp_utilities
        - cp_materials
      output: "per reference flow"
      source_ids: []
    - id: calc_asset_share
      applies_to: "building; ticket_terminal; hvac; locker"
      rule: "Apply allocation_assets to supported manufacture/retirement inventory and measured service utilization; normalize period share over cp_events without counting the whole asset per event."
      inputs:
        - cp_assets
        - cp_events
      output: "per reference flow"
      source_ids: []
    - id: calc_refrigerant
      applies_to: "r134a_air"
      rule: "Use the species balance: beginning stored stock plus acquisitions plus beginning equipment charge, minus ending stored stock, disbursements and ending equipment charge. Reconcile actual recovery and equipment changes; investigate negative or unexplained balances before attributing release. No leakage percentage or GWP is prescribed."
      inputs:
        - cp_refrigerant
        - cp_events
      output: "species mass per reference flow"
      source_ids:
        - epa-refrigerant-balance
  data_quality_requirements:
    - id: dq_event
      applies_to: "terminal_output"
      requirement: "Functional extent and accepted completion are mandatory; one ticket is not automatically one visitor and one booking group is not automatically one passenger."
      evidence: "cp_events"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Same station/period/scenario and operating/tenant/carrier boundaries for event counts, utilities and waste. Retain standby and low occupancy."
      evidence: "cp_events; cp_utilities"
    - id: dq_assets
      applies_to: "building; ticket_terminal; hvac; locker"
      requirement: "Use actual life/utilization records with sensitivity and component overlap checks; no assumed asset mass or life."
