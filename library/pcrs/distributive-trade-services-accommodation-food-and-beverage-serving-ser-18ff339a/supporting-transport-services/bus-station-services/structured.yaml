    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Flow identity, reference properties, units and localized displays must be verified before use; empty flow UUIDs remain individually disclosed, not fictional resolved services."
      evidence: "Direct-read support and unresolved register"
validation_rules:
  - rule_id: validate_event
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique terminal_output of 1 item with complete event subtype, functional extent, service quality and start/end; reject passenger-km, bus trips, prices or unexplained transaction averages as substitutes."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "foreground_dataset_conformance"
    rule: "Verify all terminal-office functions in scope, distinct luggage custody versus 67190 loading, and carrier/contractor/tenant interfaces. A full visit and its included office actions cannot both count as full terminal outputs."
    source_ids:
      - un-cpc3-67410
  - rule_id: validate_atomicity
    applies_to: "foreground_dataset_conformance"
    rule: "Check each actual utility, material, asset, waste and emitted species independently; reconcile refrigerant supply/recovery/charge changes. Disclose identity and upstream gaps; parser pass alone does not establish full lifecycle completeness or methodology approval."
    source_ids: []
  - rule_id: validate_unit_export
    applies_to: "foreground_dataset_conformance"
    rule: "Treat item only as the singular local alias of the formal Number of items unit Item(s). Export Item(s) with the same numerical count and the fully qualified service definition; changing the display token does not change the flow property, service extent or normalization denominator. Do not convert a service item to time, mass, distance or a different family by relabelling its unit, or normalize an already per-reference quantity again."
    source_ids: []
