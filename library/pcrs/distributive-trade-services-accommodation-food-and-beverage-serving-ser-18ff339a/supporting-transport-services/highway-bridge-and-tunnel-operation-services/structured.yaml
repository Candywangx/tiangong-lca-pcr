    - protocol_id: cp_release
      process_id: "operate"
      flow_role: "co2_air; no_air; no2_air; pm25_air; chloride_water; sodium_water; calcium_water; magnesium_water"
      record_type: "release measurement"
      raw_fields: "operator source; species; receptor; concentration; discharge volume; upstream background; retention/recovery; fuel/exhaust evidence"
      collection_method: "Quantify operator releases by measured discharge/species or justified balances; reconcile salt inputs and all recipients without assuming complete immediate runoff."
      unit: "kg"
      frequency: "discharge/event and period"
