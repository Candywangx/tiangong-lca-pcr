allocation_rules:
  - rule_id: allocate_activity
    applies_to: "foreground_burden_allocation"
    rule: "Use segment/circuit meters first; split traffic-independent availability loads and demand-sensitive loads with documented physical drivers, then assign to class-specific completed passages. Reconcile class shares to facility totals."
    source_ids: []
  - rule_id: allocate_wear
    applies_to: "foreground_burden_allocation"
    rule: "For pavement/structure wear, require observed maintenance and justified vehicle loading/damage evidence; no universal axle-power factor or passenger-car equivalence is imposed. Weather/calendar aging remains separately allocated."
    source_ids: []
  - rule_id: allocate_life
    applies_to: "foreground_burden_allocation"
    rule: "Use supported physical service life, lifetime traffic and condition scenarios for construction/end-of-life shares. Separate current maintenance already present in the asset dataset; test uncertain lifetime/traffic explicitly without inventing default years."
    source_ids:
      - fhwa-pavement-lca
  - rule_id: allocate_recovery
    applies_to: "foreground_burden_allocation"
    rule: "Declare actual removed pavement and treatment/recycling boundary; no automatic avoided material or disposal credit. Preserve operator and supplier service boundaries."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_traffic
      process_id: "operate"
      flow_role: "passage_service"
      record_type: "traffic record"
      raw_fields: "segment gates; mode/class; entries/exits; completed counts; length; direction; axle/mass observations; operating/closure period"
      collection_method: "Match counters/toll/traffic sensors to completed segment passages; validate duplicates, exemptions and class identification."
      unit: "item"
      frequency: "each passage and period"
      temporal_coverage: "same declared reporting period"
      site_scope: "named segment and class allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "counter calibration; gate reconciliation"
    - protocol_id: cp_utility
      process_id: "operate"
      flow_role: "electricity; diesel"
      record_type: "utility record"
      raw_fields: "circuit; import/export; fuel stock; deliveries; actual ventilation/lighting/pumping; operator vehicle idle; allocation"
      collection_method: "Use calibrated meters and fuel balances; reconcile operator-controlled consumption only."
      unit: "kWh; kg"
      frequency: "meter interval"
      temporal_coverage: "same declared reporting period"
      site_scope: "named segment and class allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; utility invoices; fuel stock"
    - protocol_id: cp_material
      process_id: "operate"
      flow_role: "water; sodium_chloride; calcium_chloride; magnesium_chloride; grit; asphalt; concrete; steel"
      record_type: "material event"
      raw_fields: "specific formulation; concentration/hydration; issue/return; applied/repaired quantity; segment; date; maintenance boundary"
      collection_method: "Measure net actual use by product and operation; preserve salt purity, mixture designs and repaired section."
      unit: "kg; m3"
      frequency: "each application/repair"
      temporal_coverage: "same declared reporting period"
      site_scope: "named segment and class allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock records; supplier specifications; work orders"
    - protocol_id: cp_asset
      process_id: "operate"
      flow_role: "road_asset; bridge_asset; tunnel_asset"
      record_type: "asset lifecycle"
      raw_fields: "segment; length/width/lanes; upstream module boundary; construction; replacement; life evidence; lifetime traffic; class drivers"
      collection_method: "Bind physical infrastructure to upstream inventories and documented lifetime traffic/condition scenarios; isolate overlapping maintenance."
      unit: "m"
      frequency: "asset change and annual reconciliation"
      temporal_coverage: "same declared reporting period"
      site_scope: "named segment and class allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset registry; construction inventory; inspection/life evidence"
    - protocol_id: cp_waste
      process_id: "operate"
      flow_role: "waste_asphalt; drain_sludge; wash_wastewater"
      record_type: "waste transfer"
      raw_fields: "specific waste; amount; moisture; composition; receiver; treatment; period; allocation"
      collection_method: "Measure each actual waste, preserve wet/dry basis and verify destination/treatment once."
