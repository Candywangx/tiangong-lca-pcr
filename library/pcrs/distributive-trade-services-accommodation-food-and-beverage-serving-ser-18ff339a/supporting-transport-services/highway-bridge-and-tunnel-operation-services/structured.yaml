    - id: dq_balance
      applies_to: "all inventory rows"
      requirement: "Match facility activity/traffic periods, total shares and upstream boundaries; no arbitrary intensity, default traffic or physical lifetime."
      evidence: "cp_utility; cp_asset; cp_traffic"
    - id: dq_discharge
      applies_to: "chloride_water; sodium_water; calcium_water; magnesium_water"
      requirement: "Retain species, source, background and receiving-compartment evidence; unresolved runoff is a gap, not zero release."
      evidence: "cp_release"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve each actual flow identity before database-linked use; archived support verification is not a fresh flow lookup."
      evidence: "direct identity verification"
