    type: "official_guidance"
    reference: "US EPA, Winter is Coming! And with it, tons of salt on our roads (2020). https://www.epa.gov/snep/winter-coming-and-it-tons-salt-our-roads"
    used_for: "Separate actual deicer formulations and receiving-environment screening; no reported amount, comparative performance, release fraction or toxicity threshold adopted."
