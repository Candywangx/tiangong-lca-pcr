  calculation_rules:
    - id: passage_denominator
      applies_to: "passage_service"
      rule: "N is positive completed passage count for the exact segment, mode/class and period; do not combine entry and exit as two outputs."
      inputs:
        - cp_traffic
      output: "N"
      source_ids: []
    - id: exchange_allocation
      applies_to: "all inventory rows"
      rule: "Assign actual numerator using documented segment/class physical shares, then divide by positive N. Retain standby, closure and maintenance burdens over the same service period."
      inputs:
        - cp_traffic
        - cp_utility
        - cp_material
        - cp_waste
      output: "exchange per reference flow"
      source_ids: []
    - id: release_balance
      applies_to: "co2_air; no_air; no2_air; pm25_air; chloride_water; sodium_water; calcium_water; magnesium_water"
      rule: "For each source/species/receiver, use actual measured release or an independently justified complete balance; separate background and retained/recovered mass, attribute the operator share, then divide by N. Do not copy salt product mass into ionic species or user emissions into operator exhaust."
      inputs:
        - cp_release
        - cp_material
        - cp_traffic
      output: "species per reference flow"
      source_ids: []
    - id: asset_share
      applies_to: "road_asset; bridge_asset; tunnel_asset"
      rule: "Allocate evidenced lifecycle inventory by segment and relevant lifetime service utilization/class drivers, then actual reporting-period share per N; document lifetime traffic uncertainty and avoid maintenance overlap."
      inputs:
        - cp_asset
        - cp_traffic
      output: "infrastructure share per reference flow"
      source_ids: []
