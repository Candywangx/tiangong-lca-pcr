system_boundary:
  rules:
    - rule_id: boundary_functions
      applies_to: "foreground_system_boundary"
      rule: "Include only actual operations needed for the declared block: passenger terminal administration/custody, infrastructure access/signalling, non-handling freight-terminal support, technical-point support or fuel-stop operation. Select and document the real function rather than assuming every block uses every facility."
      source_ids:
        - un-cpc-rail-support
    - rule_id: boundary_traction
      applies_to: "foreground_system_boundary"
      rule: "Separate traction electricity delivered to trains from support-facility electricity and identify actual distribution losses. Metered customer traction is a distinct energy account; UK billing practice is evidence of this interface, not a global tariff or emission factor."
      source_ids:
        - networkrail-metering
    - rule_id: boundary_custody
      applies_to: "foreground_system_boundary"
      rule: "Customer fuel, train water and baggage/goods remain separately metered custody deliveries; they do not become site combustion or consumed commodity production merely by passing through the facility. Integrated fuel/energy-supply datasets retain their physical input/output exchanges and upstream burdens separately; this support-only service cannot claim that entire integrated footprint."
      source_ids: []
    - rule_id: boundary_actual
      applies_to: "foreground_system_boundary"
      rule: "Include actual attributable standby, failed attempts, cleaning, maintenance, utilities and construction shares. Screen every real fuel, refrigerant, pollutant species and waste stream; add a specific row when present. No assumed zero burden for unlisted operations or upstream gaps."
      source_ids: []
