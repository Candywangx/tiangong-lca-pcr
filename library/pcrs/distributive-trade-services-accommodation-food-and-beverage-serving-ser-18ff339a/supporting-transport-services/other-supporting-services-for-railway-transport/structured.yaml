allocation_rules:
  - rule_id: allocate_functions
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide service families and physical extent first. Allocate shared electricity/heat/support with measured load-time, occupied area-time, facility use and block logs; reconcile all uses and retain standby. Do not divide unlike passenger visits, train passages and refuelling transactions by one combined count."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use persistent construction/manufacturing ledgers and supported whole-life service denominators. Track passenger-floor use, infrastructure train/axle use and technical/fuel equipment use separately. Period accounting distributes only the already attributed period share; cumulative fractions across all blocks/customers/periods cannot exceed one or reset annually. Unknown life/denominator requires review and sensitivity."
    source_ids: []
  - rule_id: allocate_renewals
    applies_to: "foreground_burden_allocation"
    rule: "Distinguish initial track/facility construction from separately recorded actual renewal steel, ballast and sleepers. Use either an upstream inventory already covering a renewal or explicit renewal rows for that same activity, never both. Separate actual recovered materials and no automatic recycling credit."
    source_ids: []
  - rule_id: allocate_scope
    applies_to: "foreground_burden_allocation"
    rule: "A provider inventory replaces its covered resources/assets once. Customer fuel/energy, ticket revenue, custody goods and passenger transport are not co-products of this support count. Allocate a true service bundle by traced component work, preserving the whole bundle only if its exact components and extent are fixed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_activity
      process_id: "support"
      flow_role: "support_block"
      record_type: "Accepted service/block ledger"
      raw_fields: "service family; exact function; physical extent; passengers/trains/consignments; baggage pieces/mass and custody time; track segment/length; axle class; availability capacity/time; work order; fuel delivery; gates/timestamps; acceptance"
      collection_method: "Verify completed function against the section 1 definition; record actual extent and separate component/whole bundle identities. Count only homogeneous accepted blocks and retain failed work in their inventory."
      unit: "Item(s)"
      frequency: "each block"
      temporal_coverage: "full defined block and allocated support"
      site_scope: "declared facilities and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "work orders; station/access logs; custody records; signed acceptance; exact population reconciliation"
    - protocol_id: cp_energy
      process_id: "support"
      flow_role: "electricity; heat"
      record_type: "Energy and customer-delivery ledger"
      raw_fields: "actual kWh and MJ separately; meter; voltage/region; times; task; measured load; standby; traction delivery and actual distribution losses; provider coverage"
      collection_method: "Submeter actual support functions, reconcile building/signalling/pump utilities and customer traction separately; allocate shared support from measured causal use, not ticket price."
      unit: "kWh; MJ"
      frequency: "each task/meter interval"
      temporal_coverage: "full block and assigned standby"
      site_scope: "actual facilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; task/duty logs; supplier/customer energy reconciliation"
    - protocol_id: cp_fuel
      process_id: "support"
      flow_role: "diesel"
      record_type: "Consumed-fuel versus delivered-fuel balance"
      raw_fields: "fuel grade; facility consumption; generator/machine duty; receipts/stocks; metered customer transfers; density/temperature; actual losses"
      collection_method: "Reconcile facility fuel consumption independently from customer dispensing and stored fuel. Use calibrated mass or traceable measured density conversion; keep customer-delivery supply outside site combustion."
      unit: "kg"
      frequency: "each use/transfer and stock period"
      temporal_coverage: "all actual included consumption"
      site_scope: "facility fuel equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "tank/dispensing meters; stock balance; actual duty logs"
    - protocol_id: cp_material
      process_id: "support"
      flow_role: "water; ticket_paper; cleaner; lubricant"
      record_type: "Specific-material ledger"
      raw_fields: "individual material; actual kg or m3; issued/returned stock; function; composition; customer water transfer; event"
      collection_method: "Measure each named exchange separately and reconcile stock/returns; separate custody water and actual consumption. Add every other present chemical/material individually."
      unit: "kg; m3"
      frequency: "each issue/use and monitoring period"
