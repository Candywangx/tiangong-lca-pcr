      applies_to: "building_share; track_share; signal_share; pump_share"
      requirement: "Support asset life, initial/renewal boundary and conserved cross-period allocation. Unresolved lifetime or upstream inventory prevents a complete lifecycle claim."
      evidence: "cp_assets; cp_maintenance"
    - id: quality_gaps
      applies_to: "all inventory rows"
      requirement: "Disclose identity, measurement, species, control and upstream gaps; missing values are not zero. Preserve actual geography/period and no unsupported default factors."
      evidence: "actual records and applicability review"
validation_rules:
  - rule_id: validate_block
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique support_block output equal to 1 Item(s), one fixed function/extent, exact interface times and acceptance. Reject fees, tickets sold alone without function definition, passenger-km and tonne-km as service-count equivalents."
    source_ids: []
  - rule_id: validate_classification
    applies_to: "foreground_dataset_conformance"
    rule: "Check the selected terminal/infrastructure/technical/fuel support function against the official scope and exclude separately modelled cargo/baggage handling, shunting and intermediation."
    source_ids:
      - un-cpc-rail-support
  - rule_id: validate_energy
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile site versus customer fuel/traction energy; do not burn all dispensed fuel in the support model. Keep facility use, pass-through custody, actual losses and upstream supply distinct."
    source_ids: []
  - rule_id: validate_atomic_lifecycle
    applies_to: "foreground_dataset_conformance"
    rule: "Require every inventory row to be a specific exchange with actual applicability. Verify conserved asset shares, non-overlapping renewals, provider scope and actual waste/pollutant treatment. Unresolved identities or evidence remain explicit and no publication readiness is inferred."
    source_ids: []
published_dataset_profile:
  dataset_role: "railway_support_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "The specified railway-support function component with compatible physical extent and custody/access gates"
  excluded_use: "Complete rail transport/traction or fuel-supply footprint; unqualified comparison/pooling across function families; implied technical/safety approval"
  required_metadata: "service family and one specific function; block definition and exact physical extent; station/line/terminal/technical point/fuel-stop ID; start/end interfaces and timestamps; actual served passenger/train/consignment population; actual duration; track length and train/axle configuration when relevant; cargo/baggage exclusion; transferred customer fuel/water/electricity; operator/provider split; energy supply and traction separation; facility and asset scope; actual quality/safety specification and completion; period and geography"
  required_quality_disclosure: "Identity and measurement gaps; function/extent limits; customer-energy and provider boundary; asset life/renewal uncertainty; omitted upstream scope"
  update_trigger: "Changed function/extent, facility/line configuration, support equipment, customer-energy interface, service quality, asset life or allocation evidence"
