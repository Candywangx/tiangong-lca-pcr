      applies_to: "support_block"
      requirement: "Fix one service family/function and exact extent, start/end and acceptance; retain original passenger/train/time/length/fuel records. No undefined generic block."
      evidence: "cp_activity"
    - id: quality_scope
      applies_to: "all inventory rows"
      requirement: "Audit excluded transport/handling/intermediation and customer-energy boundaries; document component/bundle and owned/provider overlaps."
      evidence: "un-cpc-rail-support; cp_activity; cp_energy; cp_fuel"
