  calculation_rules:
    - id: block_attribution
      applies_to: "all inventory rows"
      rule: "Assign actual exchange totals to a homogeneous function/extent scenario, then divide by its actual accepted block count. Keep failed work and standby in the attributed totals. Reference output is exactly 1 Item(s)."
      inputs:
        - cp_activity
        - "attributable measured totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "building_share; track_share; signal_share; pump_share"
      rule: "Apply the supported block fraction to actual construction/manufacturing inventories and conserve whole-life fractions. Separate initial asset and explicit renewal scope, with no annually reset full asset."
      inputs:
        - cp_assets
        - cp_maintenance
        - "actual function utilization"
      output: "asset amount per reference flow"
      source_ids: []
    - id: customer_energy_reconciliation
      applies_to: "diesel; electricity"
      rule: "Reconcile actual facility consumption separately from customer fuel/electricity delivery and actual distribution losses. No delivered litre or traction kWh becomes a facility combustion quantity."
      inputs:
        - cp_fuel
        - cp_energy
        - "custody meters"
      output: "facility exchange amount per reference flow"
      source_ids: []
