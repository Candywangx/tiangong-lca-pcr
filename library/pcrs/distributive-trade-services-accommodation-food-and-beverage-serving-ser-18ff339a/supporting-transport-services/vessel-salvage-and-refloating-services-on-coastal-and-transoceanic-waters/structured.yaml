allocation_rules:
  - rule_id: allocation_tasks
    applies_to: "foreground_burden_allocation"
    rule: "Directly meter actual task engines, tools, gas issue and services first. Shared fleet/mobilization/standby requires actual task time/load/route attribution, retaining weather waits, failed attempts and necessary support."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate actual vessel/crane/pump/bag/sling manufacture and retirement using documented utilization over supported life use, with cumulative shares capped at one life. Reconcile supplier-covered and complete-asset/component burdens."
    source_ids: []
  - rule_id: allocation_casualty
    applies_to: "foreground_burden_allocation"
    rule: "Keep original casualty damage and pre-existing pollution inventory distinct from additional salvage activity/releases. Count actual attributable treatment of recovered contaminated fluid once, without relabelling all collected contamination as a new release."
    source_ids: []
  - rule_id: allocation_property
    applies_to: "foreground_burden_allocation"
    rule: "Recovered customer vessel/cargo is not automatically a co-product of service production. Record ownership/transfer, recovered mass, waste status and actual downstream route; do not grant default steel-recycling, avoided replacement or avoided-spill credits."
    source_ids: []
  - rule_id: allocation_completion
    applies_to: "foreground_burden_allocation"
    rule: "Retain unsuccessful work within the stated accepted task. A wholly unsuccessful operation has no accepted-success denominator and must report its actual activity/outcome separately, rather than fabricate a completed recovery or erase its burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "salvage"
      flow_role: "salvage_output"
      record_type: "casualty_task_record"
      raw_fields: "casualty/task; vessel/cargo; initial state/location/pollution; water depth; weather/tide/current; objective; route; team; activity/wait/retry; completion/handoff"
      collection_method: "Reconcile task plan and actual shift/equipment/custody records with objective completion evidence; record success, partial recovery and failure without fee-based inference."
      unit: "item"
      frequency: "each task/shift and acceptance"
      temporal_coverage: "full mobilization to handoff/demobilization scope"
      site_scope: "identified marine casualty only"
      aggregation_rule: "per reference flow"
      quality_evidence: "actual logs; surveys; acceptance and custody"
    - protocol_id: cp_energy
      process_id: "salvage"
      flow_role: "marine_gasoil; diesel; electricity"
      record_type: "energy_record"
      raw_fields: "fuel/meter; engine/tool; batch/specification; stock; phase hours/load; route; electricity region/voltage; supplier-covered scope"
      collection_method: "Measure actual task fuel and grid supply, reconcile stock and distinguish internal generator output. Include standby/retries and actual demobilization."
      unit: "row unit"
      frequency: "each shift/task and supply period"
      temporal_coverage: "same scope as task"
      site_scope: "actual operator energy"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; fuel ledgers; engine logs"
    - protocol_id: cp_materials
      process_id: "salvage"
      flow_role: "oxygen; acetylene; breathing_air; steel_sling; hydraulic_oil; sorbent"
