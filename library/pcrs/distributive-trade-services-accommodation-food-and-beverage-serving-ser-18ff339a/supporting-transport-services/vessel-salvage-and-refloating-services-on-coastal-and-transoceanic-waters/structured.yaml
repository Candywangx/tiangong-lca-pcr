  calculation_rules:
    - id: calc_task_inventory
      applies_to: "all inventory rows"
      rule: "Sum actual attributable mobilization, operation, waiting, retries, waste management and demobilization exchanges for the accepted specified task, using documented supplier/shared-task allocation. Do not divide by recovered scrap mass or monetary award."
      inputs:
        - cp_task
        - "actual task protocols"
      output: "per reference flow"
      source_ids: []
    - id: calc_asset_share
      applies_to: "workboat; floating_crane; pump; lifting_bag; steel_sling"
      rule: "Apply supported actual-use/lifetime-use shares to manufacturing/retirement inventory, reconcile cumulative shares and supplier overlap, then attribute to cp_task. Uncertain life remains explicit rather than a default weight/lifetime."
      inputs:
        - cp_assets
        - cp_materials
        - cp_task
      output: "asset share per reference flow"
      source_ids: []
    - id: calc_pollution_transfer
      applies_to: "benzene; oily_water; spent_sorbent"
      rule: "Reconcile initial pollutant stock plus actual task additions with recovered/treated transfers, remaining stock and measured incremental releases. Keep water, pad and substance masses distinct; unexplained balance is uncertainty, not automatic avoided pollution."
      inputs:
        - cp_pollution
        - cp_waste
        - cp_task
      output: "substance or managed-stream mass per reference flow"
      source_ids: []
