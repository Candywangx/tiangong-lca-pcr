validation_rules:
  - rule_id: validate_salvage
    applies_to: "foreground_dataset_conformance"
    rule: "Require one salvage_output of 1 item linked to actual accepted vessel/cargo recovery, raising/righting/refloating objective. Reject standalone towing, inland-water tasks and public rescue/fire/police as this reference."
    source_ids:
      - un-cpc3-67531
  - rule_id: validate_boundary
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile failed attempts, standby, support services and supplier included burdens; original customer property is not newly manufactured output. Separate subsequent repair/storage/scrapping."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Audit each emitted substance and contaminated managed stream, baseline attribution, actual treatment and asset life shares. Do not count collected oil simultaneously as newly leaked oil and avoided leakage; disclose all identity/upstream/attribution gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "marine_salvage_service"
