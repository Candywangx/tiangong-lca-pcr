system_boundary:
  rules:
    - rule_id: boundary_recovery
      applies_to: "foreground_system_boundary"
      rule: "Include actual necessary mobilization, surveys, recovery work, supportive movement, pollution-control work through accepted handoff and attributable demobilization. Separate standalone towing, public rescue and subsequent repair/scrapping."
      source_ids:
        - un-cpc3-67531
    - rule_id: boundary_environment
      applies_to: "foreground_system_boundary"
      rule: "Record actual pollution-control actions and monitored environmental conditions as part of the task. Recognition or payment for environmental protection is not a numerical avoided-impact coefficient; counterfactual benefit claims require a separate evidenced scenario."
      source_ids:
        - imo-salvage-environment
    - rule_id: boundary_energy
      applies_to: "foreground_system_boundary"
      rule: "Track each actual workboat/support-engine fuel and operating/standby phase; shore electricity has a separate supply boundary. Do not treat shore power as zero lifecycle burden or duplicate generator electricity and its fuel."
      source_ids:
        - epa-harbor-craft
    - rule_id: boundary_atomic
      applies_to: "foreground_system_boundary"
      rule: "Include actual equipment manufacture/retirement shares and screen every specific gas, fuel, breathing mixture, repair material, sediment/cargo waste, released substance and habitat disturbance separately. No standard salvage technique, volume, asset mass or lifetime is imposed."
      source_ids: []
