system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "foreground_system_boundary"
      rule: "Select one actual liquefaction or regasification route with specified physical states. IFC describes a broader LNG chain; only applicable actual conversion processes and necessary conditioning are included here. Independent transport, storage, handling and upstream gas production remain separately scoped."
      source_ids:
        - un-cpc-transport-phase
        - ifc-lng-2017
    - rule_id: boundary_bog
      applies_to: "foreground_system_boundary"
      rule: "Reconcile actual BOG generation, return/recondensation/reliquefaction, internal fuel, external return/sale, stock change, venting, flaring and fugitive loss by composition and destination. Internal transfers are not fresh external purchases or duplicate finished output. Fuel use and emissions remain in the responsible service stage even when gas is customer-owned."
      source_ids:
        - ifc-lng-2017
    - rule_id: boundary_heat_water
      applies_to: "foreground_system_boundary"
      rule: "Identify actual compressors/refrigerant cycle or ORV/SCV/air/intermediate-fluid vaporizer and heat source. Keep electricity, fuels, steam and purchased heat separate. Measure source-specific water intake/return quantity, location, temperature/thermal change and residual chemistry; no default temperature limit or claim of zero impact for ambient heat."
      source_ids:
        - ifc-lng-2017
    - rule_id: boundary_emissions
      applies_to: "foreground_system_boundary"
      rule: "Include actual combustion, flare incomplete oxidation/slip, vent, fugitives, separated-feed contaminants and refrigerant loss as individual species/compartments. Do not assume complete flare destruction, assign total gas to methane, merge NOx species or use an aggregate VOC exchange."
      source_ids:
        - ifc-lng-2017
    - rule_id: boundary_assets
      applies_to: "foreground_system_boundary"
      rule: "Retain construction/manufacture, necessary process-buffer assets, maintenance, replacements and real waste receivers with supported life utilization. Storage sold independently, carrier propulsion and customer gas-chain assets do not become process conversion assets."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual customer gas/LNG at the agreed conversion inlet with measured composition/state and custody ownership"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Transport-purpose natural-gas liquefaction or regasification only"
  recursive_input_rule: "Purchased same-function conversion enters once with compatible route/states/output basis and provider coverage; remove overlapping owned utilities/assets"
  upstream_dataset_requirement: "Actual externally consumed energy/material/refrigerant, process assets/renewals and actual treatment; customer commodity custody and internal BOG are tracked separately"
  disclosure: "transport purpose; liquefaction OR regasification; actual site/date/route and provider; inlet/outlet custody gates; feed and delivered composition including methane/higher hydrocarbons/CO2/N2/water and relevant contaminants; actual inlet/outlet phase, temperature, pressure and quality/acceptance; net qualifying delivered kg and observation period; actual feed, stock changes, process buffer time, internal recycle, fuel diversion, recovered/exported BOG and each loss fate; compressor/refrigeration cycle or ORV/SCV/air/intermediate-fluid vaporizer and source energy; onshore/floating asset scope; utility source/temperature/pressure; actual water intake/return temperature/chemistry/location; each chemical/refrigerant; emissions/fugitive/flare efficiency evidence; coproduct/provider overlap; real whole-life output denominator and uncertainty"
