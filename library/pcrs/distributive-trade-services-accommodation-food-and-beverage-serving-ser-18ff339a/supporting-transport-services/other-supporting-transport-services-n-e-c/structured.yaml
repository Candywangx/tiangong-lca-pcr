measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_mass to measure actual net qualified outlet mass corresponding to this service. Exactly 1 kg is the reference output; route, composition/state and quality are mandatory and not interchangeable."
  - id: gas_conversion
    applies_to: "service_output; liq_fuelgas; regas_fuelgas"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Mass/volume conversion requires actual composition, pressure, temperature and verified density or metered equation of state. State standard-volume reference conditions explicitly; no universal LNG density or expansion ratio."
  - id: thermal_energy
    applies_to: "liq_steam; regas_steam; regas_heat"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Use actual net delivered enthalpy and supply/return states with supplier losses boundary; do not infer heat from water volume alone or conflate electricity and fuel energy."
  - id: component_mass
    applies_to: "ref_methane; ref_ethane; ref_propane; ref_ethylene; ref_nitrogen; amine; hypochlorite"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep actual chemical component mass distinct from total refrigerant mixture or aqueous solution; record verified composition and stock/recovery. No aggregate VOC/PFAS/refrigerant selector is an atomic exchange."
