allocation_rules:
  - rule_id: allocate_route
    applies_to: "foreground_burden_allocation"
    rule: "Direct-meter each actual route and qualifying output. Shared compression/BOG/utilities use documented physical duty, net enthalpy, measured runtime or causal throughput, with actual startup/shutdown and stock reconciliation. Do not average liquid and gas route kg, nameplate capacities or fees."
    source_ids: []
  - rule_id: allocate_custody
    applies_to: "foreground_burden_allocation"
    rule: "Track customer gas custody and internal fuel/BOG separately from purchased external fuel; actual consumed customer gas causes real source emissions and a gas-chain replacement obligation, not a zero emission or duplicate gas-production input here. Full chain authors link commodity production/losses once."
    source_ids: []
  - rule_id: allocate_recovery
    applies_to: "foreground_burden_allocation"
    rule: "Returned/reliquefied/recondensed BOG is an internal balance once. Qualifying gas delivered at the route outlet counts once; gas exported in another state is separately reported with function/burden allocation if it is a co-service, not silently added to the denominator or given an avoided product credit."
    source_ids: []
  - rule_id: allocate_coproduct
    applies_to: "foreground_burden_allocation"
    rule: "For actual integrated conditioning that produces recovered NGL/sulfur or another co-output, first separate the actual functional processes and meters, then document a causal physical allocation and mass/energy reconciliation if separation is impossible. Add each identified co-output individually; no automatic credit for cold/heat/BOG utilization."
    source_ids: []
  - rule_id: allocate_life
    applies_to: "foreground_burden_allocation"
    rule: "Divide actual asset manufacture/construction and distinct maintenance/renewal inventory by supported whole-life actual qualifying service utilization. Use expected route output with evidence on capacity, utilization, downtime, yield, degradation and life; conserve all user/period shares without annual reset. No invented life or whole facility per kg."
    source_ids: []
  - rule_id: allocate_supplier
    applies_to: "foreground_burden_allocation"
    rule: "Reconcile utility/plant/BOG/storage supplier coverage with owned rows before summing. Floating regasification plant construction may be attributable, but carrier voyage or independent storage is separately scoped. Process buffer is counted once at actual inventory/time and cannot be sold again as unreported free storage."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "completion_management"
      flow_role: "service_output"
      record_type: "Composition-resolved custody and conversion ledger"
      raw_fields: "transport purpose; liquefaction OR regasification; actual site/date/route and provider; inlet/outlet custody gates; feed and delivered composition including methane/higher hydrocarbons/CO2/N2/water and relevant contaminants; actual inlet/outlet phase, temperature, pressure and quality/acceptance; net qualifying delivered kg and observation period; actual feed, stock changes, process buffer time, internal recycle, fuel diversion, recovered/exported BOG and each loss fate; compressor/refrigeration cycle or ORV/SCV/air/intermediate-fluid vaporizer and source energy; onshore/floating asset scope; utility source/temperature/pressure; actual water intake/return temperature/chemistry/location; each chemical/refrigerant; emissions/fugitive/flare efficiency evidence; coproduct/provider overlap; real whole-life output denominator and uncertainty"
      collection_method: "Use calibrated inlet/outlet mass metering or traceable volume conversion with actual composition, temperature, pressure and density/equation-of-state evidence. Reconcile customer feed plus actual external gas and opening inventory against qualified delivered mass, ending inventory, fuel diversion, separately exported gas/co-output and individual vent/flare/fugitive losses. Internal BOG return/recondensation and refrigerant loops cancel as internal transfers, not additional purchases/production. Measure actual qualifying net outlet only, correcting off-spec/rework/returned material and avoiding repeated throughput count. Retain component and carbon balances, actual buffer custody time and uncertainties."
      unit: "kg"
      frequency: "continuous/batch meters and each custody period"
      temporal_coverage: "whole actual conversion/delivery period including startups and stock changes"
      site_scope: "actual selected inlet/outlet and buffer gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated mass/quality meters; gas analyses; stock/fuel/BOG records; component balance"
    - protocol_id: cp_energy
      process_id: "liquefaction_regasification"
      flow_role: "liq_power; liq_fuelgas; liq_steam; regas_power; regas_fuelgas; regas_steam; regas_heat"
      record_type: "Actual source/end-use utility ledger"
      raw_fields: "route/technology; actual meter start/end; external fuel composition/kg and calorific basis; internal customer/BOG fuel separately; kWh/MJ; supply/return state/enthalpy; compressor/pump/vaporizer duty; startup/shutdown; charging/provider scope; actual qualified outlet mass"
      collection_method: "Meter actual external electricity, each external fuel, steam and heat separately. Reconcile source-specific internal-fuel combustion against cp_mass without duplicate purchase; include actual generation efficiency/losses once. Measure real thermal supply/return enthalpy, actual throughput and all attributable operating phases; no specific-energy or SCV/ORV default."
      unit: "kg; kWh; MJ"
      frequency: "each meter/phase and reconciled observation period"
      temporal_coverage: "all actual route utilities and attributable downtime"
      site_scope: "actual compression/refrigeration/vaporizer and supplies"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; actual fuel/BOG/stock balance; state data; provider overlap; allocation"
    - protocol_id: cp_refrigerant
      process_id: "liquefaction"
      flow_role: "ref_methane; ref_ethane; ref_propane; ref_ethylene; ref_nitrogen"
      record_type: "Loop/component refrigerant ledger"
      raw_fields: "actual cycle/loop; each chemical composition; initial charge/life share; additions/recovery/opening/closing stock kg; leak/vent source and receiver; actual route output"
      collection_method: "Resolve actual mixed/cascade refrigerants into specific chemical components and measure net externally supplied makeup with stock/recovery balance. Circulating mass is not consumption. Attribute initial charge and replacement to supported actual life/use without duplicating supplier stock; quantify each actual chemical loss/receiver, and add a separate route-specific row for another refrigerant."
      unit: "kg"
      frequency: "each refill/recovery and reconciled period"
      temporal_coverage: "whole actual loop operating/maintenance interval"
      site_scope: "actual chemical loops and suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "component certificates; charge/recovery records; stocks; leak evidence"
    - protocol_id: cp_chemical
      process_id: "liquefaction_management"
      flow_role: "amine; sieve; mercury_carbon; hypochlorite; nitrogen_purge; lubricant"
      record_type: "Specific chemical/medium ledger"
      raw_fields: "route/end use; exact chemical/formulation/grade; measured actual kg and active fraction; separate water; replacement/regeneration; impurities captured; purge pressure; supplier scope"
      collection_method: "Measure each actual chemical or medium; distinguish active substance, solution carrier and mixed product components without duplicate supply. Link to real contaminant/task evidence and actual replacement interval, not a compulsory recipe. Track regeneration energy, contaminants removed and resulting waste/release separately."
      unit: "kg"
      frequency: "each actual issue/replacement/regeneration interval"
      temporal_coverage: "actual period and supported replacement share"
      site_scope: "actual process/supplier gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "purchase/stock/formulation records; actual mass balance; maintenance"
    - protocol_id: cp_water
      process_id: "regasification_management"
      flow_role: "regas_seawater; regas_riverwater; regas_sea_return; regas_river_return; process_water"
      record_type: "Source/receiver-specific water and thermal ledger"
      raw_fields: "source waterbody/product; actual volume/flow; inlet/outlet temperature/pressure/salinity; season/location; cooling/heating duty; evaporation/retention/return; biocide residuals and reaction products; actual receiver/treatment"
      collection_method: "Meter actual source/product separately from recirculation and match actual returns/consumption. Record measured thermal change/heat flux and local receiving conditions without universal temperature limits. Chemical residues require their own species/compartment rows and actual treatment, not a volume-only proxy. Actual seawater, river, groundwater or another source is not interchangeable."
      unit: "m3; temperature; thermal state"
      frequency: "continuous/representative actual intake and return periods"
      temporal_coverage: "whole applicable route and actual season/receiving context"
      site_scope: "actual sources and receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "flow meters; temperature/chemistry samples; seasonal receiving evidence; water balance"
    - protocol_id: cp_assets
      process_id: "liquefaction_regasification_management"
      flow_role: "liq_train; regas_train; buffer_tank"
      record_type: "Whole-life process asset ledger"
      raw_fields: "configuration/BOM/construction; plant/buffer scope; ownership/provider; manufacture/maintenance/renewals; supported years and actual throughput/utilization/yield/downtime; life qualifying outlet kg; cumulative allocation"
      collection_method: "Identify actual process assets and supported whole-life qualifying output, distinguishing one route/state and independent storage/transport assets. Apply attributable share of construction/manufacture plus distinct maintenance/renewals; conserve cumulative user/period shares. Nameplate throughput times arbitrary lifetime is not evidence; unknown denominators require explicit review."
      unit: "Item(s)"
      frequency: "each allocation and configuration/renewal update"
      temporal_coverage: "supported whole life and actual observed service period"
      site_scope: "actual conversion train/buffer and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "construction/BOM; actual utilization and yield; life evidence; cumulative shares"
    - protocol_id: cp_waste
      process_id: "management"
      flow_role: "spent_amine; spent_sieve; spent_carbon; used_oil; oily_water"
      record_type: "Specific waste/receiver ledger"
      raw_fields: "single stream; actual kg/m3; solution/adsorbate/mercury/oil composition; originating route; actual transfer/treatment/reclamation/disposal; provider coverage"
      collection_method: "Weigh/meter each real stream and trace real final receiver/treatment with actual constituent basis and no presumed harmlessness, destruction, recycling or avoided burden. Keep spent medium distinct from removed contaminant releases; add other actual specific streams separately."
      unit: "kg; m3"
      frequency: "each actual waste transfer/period"
      temporal_coverage: "all attributable actual waste"
      site_scope: "actual origin and receiving treatment gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer tickets; actual analyses; regeneration/disposal scope; balance"
    - protocol_id: cp_release
      process_id: "management"
      flow_role: "methane; ethane; propane; ethylene; co2; co; no; no2; so2; h2s"
      record_type: "Source/component-resolved gas fate ledger"
      raw_fields: "route/source; actual gas composition and mass; combustion/fuel/flare efficiency and oxidation; vent/fugitive/refrigerant leak; named species kg and receiver; removed acid gas route; actual monitoring/factors/speciation; carbon/sulfur balance"
      collection_method: "Measure/speciate actual source streams and reconcile with cp_mass and refrigerant/chemical balances. Calculate actual source-specific combustion and flare emissions using independently verified composition/efficiency methods; report unburned methane and other species rather than assuming complete destruction. Keep CO2 already in feed distinct from oxidation CO2; NO/NO2 from a NOx-equivalent total require documented speciation, never duplicate total. Add every actual other chemical and receiver separately; missing emission evidence is not zero."
      unit: "kg"
      frequency: "each source operation/upset and representative monitoring"
      temporal_coverage: "all represented normal/upset sources in actual period"
      site_scope: "actual source/compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "metering/leak measurements; actual composition; verified methods; gas/carbon/sulfur balance"
  calculation_rules:
    - id: service_attribution
      applies_to: "all inventory rows"
      rule: "Divide actual attributable exchange by actual qualified net outlet kg of the same route/state/quality and period, with stock/loss/rework reconciliation. Unique service output is exactly 1 kg."
      inputs:
        - cp_mass
        - "actual exchange protocols"
      output: "individual exchange per reference flow"
      source_ids: []
    - id: gas_fate_balance
      applies_to: "service_output; methane; ethane; propane; co2; co; so2; h2s"
      rule: "Close actual component mass and carbon/sulfur balances across custody, fuel, BOG, losses and stock; cancel internal returns and count qualified delivery once. Document measured conversion/composition and any unresolved residual, not forced zero."
      inputs:
        - cp_mass
        - cp_release
        - cp_refrigerant
      output: "component fate and reconciled net delivery"
      source_ids: []
    - id: asset_attribution
      applies_to: "liq_train; regas_train; buffer_tank"
      rule: "Apply supported attributable route-output share of actual asset whole-life utilization to actual manufacture/construction and distinct renewals; retain cumulative conservation across all periods/providers."
      inputs:
        - cp_assets
        - cp_mass
      output: "asset amount per reference flow"
      source_ids: []
    - id: species_fate
      applies_to: "methane; ethane; propane; ethylene; co2; co; no; no2; so2; h2s"
      rule: "Use actual species measurement or verified source composition, combustion/flare efficiency and speciation with explicit dataset units and uncertainty. No numerical fuel, leak, flare destruction or recovery factor is supplied."
      inputs:
        - cp_release
        - cp_mass
        - cp_energy
      output: "individual species per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_route
      applies_to: "service_output"
      requirement: "Actual transport purpose, route, net qualified mass, inlet/outlet state/composition and acceptance are mandatory; no pooling two phase-conversion routes."
      evidence: "cp_mass"
    - id: quality_bog
      applies_to: "management"
      requirement: "Require actual BOG/fuel/vent/flare/fugitive and stock records and component balance; internal recovery does not become fresh purchase or default credit."
      evidence: "cp_mass; cp_release"
    - id: quality_thermal
      applies_to: "regasification; liquefaction"
      requirement: "Keep actual technology, heat source, refrigerant components, water source/return thermal state and chemistry; absent applicable thermal/ecological characterization is disclosed, not zero impact."
      evidence: "cp_energy; cp_refrigerant; cp_water"
    - id: quality_life
      applies_to: "all asset rows"
      requirement: "Support actual inventory and life-output denominator with capacity/utilization/downtime/yield/life evidence and supplier overlap review. Unknown life prevents a complete lifecycle claim."
      evidence: "cp_assets"
    - id: quality_gaps
      applies_to: "all inventory rows"
      requirement: "Disclose missing identities, component/flare/receiver evidence, upstream gas-chain links, co-output allocation and actual site noise/water/ecological method gaps; missing is not zero."
      evidence: "cp_waste; cp_release; cp_mass"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Only transport-purpose gas liquefaction/regasification is covered; exclude type-rating/GPS/navigation and other residual functions, independent storage/transport and upstream gas commodity production."
    source_ids:
      - un-cpc-transport-phase
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Unique service_output must equal 1 kg and match measured net qualified outlet mass with mandatory route/state/composition/T/P/quality and actual period. Internal recycle, off-spec stock, fuel and losses are not qualified delivered output."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile custody, external fuel, internal BOG, stock and each species destination; no duplicate gas purchase, double qualified output, complete-flare assumption or implicit cold/heat/BOG credit. Service-only boundary does not assert zero upstream commodity burden in the complete gas chain."
    source_ids: []
  - rule_id: validate_atomic_life
    applies_to: "foreground_dataset_conformance"
    rule: "Every row must be one actual exchange with its own correct property/unit and compartment, including source/return water thermal evidence. Verify life fractions and provider coverage; leave unknown identities/method gaps explicit rather than declare publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "transport_natural_gas_phase_conversion_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "One compatible transport-purpose liquefaction or regasification component with the same physical route/states and gas-mass service basis, linked once into the gas chain"
  excluded_use: "Generic industry support, type-rating/navigation, complete gas commodity lifecycle, unrelated storage/transport, cross-route kg equivalence or automatic avoided cold/heat/BOG benefits"
  required_metadata: "transport purpose; liquefaction OR regasification; actual site/date/route and provider; inlet/outlet custody gates; feed and delivered composition including methane/higher hydrocarbons/CO2/N2/water and relevant contaminants; actual inlet/outlet phase, temperature, pressure and quality/acceptance; net qualifying delivered kg and observation period; actual feed, stock changes, process buffer time, internal recycle, fuel diversion, recovered/exported BOG and each loss fate; compressor/refrigeration cycle or ORV/SCV/air/intermediate-fluid vaporizer and source energy; onshore/floating asset scope; utility source/temperature/pressure; actual water intake/return temperature/chemistry/location; each chemical/refrigerant; emissions/fugitive/flare efficiency evidence; coproduct/provider overlap; real whole-life output denominator and uncertainty"
  required_quality_disclosure: "Actual meters/route/composition representativeness, commodity custody and upstream links, internal fuel/BOG/species balance, thermal/water/receiver gaps and supported asset-life denominator"
  update_trigger: "Changed transport use, route/technology, feed/outlet composition/state/quality, duty/load, BOG/flare/recovery, heat/water/chemical supply, provider/buffer boundary or life-output evidence"
data_sources:
  - id: "un-cpc-transport-phase"
    type: "official_guidance"
    reference: "UNSD CPC3.0 67990 explanatory note; shared draft PDF p378. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67990"
    used_for: "Natural-gas liquefaction/regasification for transportation; type-rating/navigation remain outside the reviewed narrower method"
  - id: "ifc-lng-2017"
    type: "official_guidance"
    reference: "IFC/World Bank Group, Environmental, Health, and Safety Guidelines: Liquefied Natural Gas Facilities, 11 April 2017, pp1–2,5–9,21–23. https://www.ifc.org/content/dam/ifc/doc/mgrt/20170406-final-lng-ehs-guideline-april-2017.pdf"
    used_for: "Qualitative actual-route/process, BOG/fuel/flare/fugitive, water/thermal/chemical and waste-source context only. No numerical limits, LNG density, expansion ratio, efficiency or emission factors adopted; wider LNG transport/storage scope is not automatically included"
