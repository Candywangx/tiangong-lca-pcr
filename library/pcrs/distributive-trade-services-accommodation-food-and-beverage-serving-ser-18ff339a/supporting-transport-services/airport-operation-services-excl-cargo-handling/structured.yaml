      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_terminal_assets
      process_id: "terminal"
      flow_role: "building; boarding_bridge; hvac"
      record_type: "asset_record"
      raw_fields: "asset/configuration; construction quantity; component scope; actual use; supported life use; prior shares; replacement/retirement"
      collection_method: "Reconcile actual building/pavement/equipment registers, bills and utilization with independently supported lifetime denominators and upstream component coverage."
      unit: "row unit"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_terminal_energy
      process_id: "terminal"
      flow_role: "terminal_electricity; natural_gas; water"
      record_type: "meter_record"
      raw_fields: "row; meter; actual energy/water; source; operating period; function/tenant share; stock; density conditions"
      collection_method: "Use calibrated meters, supply records and task/zone attribution; reconcile actual stock and operator/airline boundaries."
      unit: "row unit"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_terminal_refrigerant
      process_id: "terminal"
      flow_role: "r134a_supply; r134a_air"
      record_type: "refrigerant_balance"
      raw_fields: "species; start/end stored stock; acquisition/disbursement; equipment charge change; service; recovery"
      collection_method: "Reconcile species stock and equipment-charge/service/recovery to quantify actual release; no default percentage or purchase-equals-leak."
      unit: "kg"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_terminal_waste
      process_id: "terminal"
      flow_role: "sanitary_wastewater"
      record_type: "waste_record"
      raw_fields: "specific stream; measured mass; composition; contamination; source; treatment; destination; supplier coverage"
      collection_method: "Measure segregated flows and reconcile treatment/transfer records; distinguish sanitary, pavement and aircraft sources and upstream included treatment."
      unit: "kg"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
  calculation_rules:
    - id: calc_operation
      applies_to: "all inventory rows"
      rule: "Attribute actual measured/collected exchanges to the exact facility/function/interval and apply documented shared-scope allocation. Normalize matched comparable totals by accepted events without automatically replacing the denominator with passengers, movements or hours."
      inputs:
        - cp_event
        - "actual process protocols"
      output: "per reference flow"
      source_ids: []
    - id: calc_assets
      applies_to: "concrete; asphalt; building; runway_light; boarding_bridge; hvac"
      rule: "Use actual construction/equipment quantities, current service use and independently supported lifetime utilization; reconcile cumulative and component shares before attribution to the event. Unknown life/utilization remains explicit."
      inputs:
        - "asset protocols"
        - cp_event
      output: "asset share per reference flow"
      source_ids: []
    - id: calc_runoff_species
      applies_to: "potassium_acetate; sodium_formate; deicer_runoff; ammonia"
      rule: "Reconcile whole formulation/active composition, collection, treatment and actual residual discharge with site records. Convert concentration with actual matched flow only; product mass, COD or total nitrogen cannot replace one emitted chemical species."
      inputs:
        - "materials/waste/runoff protocols"
        - cp_event
      output: "specific product/stream/species per reference flow"
      source_ids:
        - epa-airport-deicing
  data_quality_requirements:
    - id: dq_extent
      applies_to: "airport_output"
      requirement: "Require whole-airport versus facility extent, accepted interval, actual availability, passenger/movement definitions and operator boundary; a fee or airport name is insufficient."
      evidence: "cp_event"
    - id: dq_support
      applies_to: "sweeping_service; snow_service; potassium_acetate; sodium_formate"
      requirement: "Prove support-service inclusion and alternative aggregate/decomposed accounting; preserve standalone cleaning exclusion and chemical specificity."
      evidence: "supplier and material records"
    - id: dq_assets
      applies_to: "concrete; asphalt; building; runway_light; boarding_bridge; hvac"
      requirement: "Actual life/utilization, construction and component scope must be documented, with uncertainty and missing upstream burdens disclosed."
      evidence: "asset protocols"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm exact flow/property/unit and Chinese names before adoption; unresolved flows remain individual and actual additional exchanges must be added atomically."
      evidence: "Direct support and unresolved register"
validation_rules:
  - rule_id: validate_operation
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique airport_output of 1 item with accepted infrastructure-operation extent, functional quality and interval. Reject cleaning actions, automatic passenger/movement equivalence and aircraft carriage as substitutes."
    source_ids:
      - un-cpc3-67610
  - rule_id: validate_scopes
    applies_to: "foreground_dataset_conformance"
    rule: "Verify conditional terminal/airfield processes and complete-airport shared attribution; exclude baggage/cargo handling, ATC and independently sold runway cleaning/snow. Do not duplicate supplier support and expanded chemical/fuel/waste burdens."
    source_ids:
      - un-cpc3-67610
  - rule_id: validate_actual_flows
    applies_to: "foreground_dataset_conformance"
    rule: "Audit each actual utility, chemical, refrigerant, asset, waste and released substance with matched period/basis. Disclose identity, asset-life, runoff-treatment and upstream gaps; parser pass is not a full airport environmental or methodology approval."
    source_ids: []
  - rule_id: validate_unit_export
    applies_to: "foreground_dataset_conformance"
    rule: "Treat item only as the singular local alias of the formal Number of items unit Item(s). Export Item(s) with the same numerical count and the fully qualified service definition; changing the display token does not change the flow property, service extent or normalization denominator. Do not convert a service item to time, mass, distance or a different family by relabelling its unit, or normalize an already per-reference quantity again."
    source_ids: []
published_dataset_profile:
  dataset_role: "airport_infrastructure_operation"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified airport/terminal/airfield operating component in a scenario matching declared functions, interval and actual utilization"
  excluded_use: "Complete flight/passenger footprint; standalone cleaning/snow service; universal per-passenger/per-movement airport factor; aircraft maintenance/towing/ATC"
  required_metadata: "All reference qualifiers; conditional processes; actual counts/availability; supplier and tenant split; assets and upstream identities; chemical/runoff support boundaries"
  required_quality_disclosure: "Event comparability; utilization and standby; life denominator; support overlap; water/refrigerant/runoff uncertainty; missing UUIDs/upstream/noise/land evidence"
  update_trigger: "Changed facility scope/configuration, operating interval/passenger or movement profile, operator contract, maintenance/deicer route, energy, asset life or discharge evidence"
data_sources:
  - id: "un-cpc3-67610"
    type: "official_guidance"
    reference: "UNSD, Explanatory Notes of CPC Version3.0, subclass67610, February2025, with adjacent67620/67630 context. https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf"
    used_for: "Passenger-terminal/airfield/runway operation scope and explicit cargo/baggage/standalone runway-cleaning exclusions; no factors"
  - id: "epa-airport-deicing"
    type: "official_guidance"
    reference: "US EPA, Airport Deicing Environmental Impact and Benefit Assessment, April2012, EPA-821-R-12-003, sections1.2–1.4 and2.1. https://www.epa.gov/sites/production/files/2015-06/documents/airport-deicing_environmental-impact-and-benefit-assessment-final-2012.pdf"
    used_for: "Pavement versus aircraft chemical formulations and runoff pathways; site-specific monitored chemicals/treatment, no regulatory percentages, default doses or impact factors adopted"
