system_boundary:
  rules:
    - rule_id: boundary_airport
      applies_to: "foreground_system_boundary"
      rule: "Include actual passenger-terminal and airfield/runway operating functions and facility upkeep in the declared event. A terminal-only service does not include an entire airport; shared whole-airport inventory must not be attached again to each runway/terminal."
      source_ids:
        - un-cpc3-67610
    - rule_id: boundary_support
      applies_to: "foreground_system_boundary"
      rule: "Standalone runway cleaning/snow removal remains outside the reference. Necessary upstream support is recorded once through supplier inventory or its explicitly replaced decomposition."
      source_ids:
        - un-cpc3-67610
    - rule_id: boundary_runoff
      applies_to: "foreground_system_boundary"
      rule: "Distinguish pavement versus aircraft deicing sources, actual chemical formulation, collected effluent, treatment and directly discharged substances. Site-specific fate matters; no regulatory collection percentage or impact factor becomes a default inventory parameter."
      source_ids:
        - epa-airport-deicing
    - rule_id: boundary_assets
      applies_to: "foreground_system_boundary"
      rule: "Include actual facility construction, replacement, maintenance and retirement shares with documented life/utilization. Screen additional actual chemicals, refrigerants, consumables, noise/land/ecological effects and wastes individually; a short card list is not a zero-burden exemption."
      source_ids: []
