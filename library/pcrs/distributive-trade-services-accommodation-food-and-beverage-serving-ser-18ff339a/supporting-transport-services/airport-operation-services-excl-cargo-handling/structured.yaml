allocation_rules:
  - rule_id: allocate_facilities
    applies_to: "foreground_burden_allocation"
    rule: "Use direct facility/function meters and actual space-time/activity records first. Public airport common burdens require causal allocation between terminal, runway, apron, tenants and airlines; do not automatically allocate by revenue, passengers or movements."
    source_ids: []
  - rule_id: allocate_period
    applies_to: "foreground_burden_allocation"
    rule: "Retain attributable standby, closure, low-utilization and failed support in the defined operating event. Match all counts and meters to the same interval; terminal passengers and aircraft movements are separate dimensions, not universal equivalents."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Apply actual-use/supported-lifetime-use shares to facility construction/equipment manufacture and retirement; reconcile complete-building/pavement/component scope and cumulative shares capped at one life. No invented runway structure, asset mass or life."
    source_ids: []
  - rule_id: allocate_support
    applies_to: "foreground_burden_allocation"
    rule: "Supplier cleaning/snow support and its expanded chemical/fuel/waste inventory are alternatives for the same scope. Track operator/contractor responsibility and avoid counting the same runoff treatment or deicer burden twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_event
      process_id: "shared"
      flow_role: "airport_output"
      record_type: "operation_event_record"
      raw_fields: "event; facility/contract extent; functions; start/end; duration; opening/closure; availability; actual passengers; movements and counting rules; operator/tenant/airline split"
      collection_method: "Reconcile accepted operating/service interval with facility records and matched actual counts; retain sub-event interfaces without multiplying full airport outputs."
      unit: "item"
      frequency: "each event and interval"
      temporal_coverage: "full specified operating interval"
      site_scope: "declared airport/facility extent"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance; operations records; matched counts"
    - protocol_id: cp_airfield_assets
      process_id: "airfield"
      flow_role: "concrete; asphalt; runway_light"
      record_type: "asset_record"
      raw_fields: "asset/configuration; construction quantity; component scope; actual use; supported life use; prior shares; replacement/retirement"
      collection_method: "Reconcile actual building/pavement/equipment registers, bills and utilization with independently supported lifetime denominators and upstream component coverage."
      unit: "row unit"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_airfield_energy
      process_id: "airfield"
      flow_role: "airfield_electricity"
      record_type: "meter_record"
      raw_fields: "row; meter; actual energy/water; source; operating period; function/tenant share; stock; density conditions"
      collection_method: "Use calibrated meters, supply records and task/zone attribution; reconcile actual stock and operator/airline boundaries."
      unit: "row unit"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_airfield_materials
      process_id: "airfield"
      flow_role: "potassium_acetate; sodium_formate"
      record_type: "formulation_record"
      raw_fields: "specific product; whole mass; active fraction; supplier; application; collection; upstream-service coverage"
      collection_method: "Weigh actual issues/returns and obtain formulation evidence; direct support chemicals replace the aggregated supplier scope, not supplement it."
      unit: "kg"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_airfield_runoff
      process_id: "airfield"
      flow_role: "ammonia"
      record_type: "runoff_species_record"
      raw_fields: "substance; outfall; flow; concentration; timing; receiving compartment; treatment; pavement/aircraft source; attribution"
      collection_method: "Use actual paired flow/concentration or measured species mass with treatment and source attribution; distinguish total nitrogen, ammonia and oxygen-demand indicators."
      unit: "kg"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_airfield_services
      process_id: "airfield"
      flow_role: "sweeping_service; snow_service"
      record_type: "supplier_service_record"
      raw_fields: "provider; actual hours; task/area/weather; chemical/vehicle/waste inclusion; cleaning/snow scope"
      collection_method: "Match necessary upstream support to supplier primary inventory; hours are activity only, not an emission factor, and decomposition replaces supplier aggregates."
      unit: "h"
      frequency: "actual task/meter/maintenance interval"
      temporal_coverage: "same interval as cp_event"
      site_scope: "declared process and operator/supplier scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records; calibration/stock; scope reconciliation"
    - protocol_id: cp_airfield_waste
      process_id: "airfield"
