allocation_rules:
  - rule_id: allocate_tasks
    applies_to: "foreground_burden_allocation"
    rule: "Use direct meters and task records first. Handling energy follows actual lifts, hours and load; preservation energy follows measured zone/commodity use. Mass-time allocation is allowed only within equivalent declared conditions when the causal basis is justified."
    source_ids: []
  - rule_id: allocate_space
    applies_to: "foreground_burden_allocation"
    rule: "Common lighting/building burdens may use measured occupied area-time where causal, then normalize on measured mass-time. Keep standby/empty-space burdens attributable to the operating storage system; do not erase low occupancy by counting only powered hours."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Attribute each asset by actual use over a documented lifetime utilization denominator, reconcile previous/current shares and cap cumulative attribution at one full asset life. Rented assets and outsourced service burdens require the same boundary reconciliation."
    source_ids: []
  - rule_id: allocate_goods_loss
    applies_to: "foreground_burden_allocation"
    rule: "Goods ownership and embodied manufacture remain separate from the service reference. Record actual loss, moisture change, customer/operator responsibility and treatment. Additional replacement-production scenarios must be separately declared; no automatic credit or full inventory of all stored goods is assigned to storage."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stock
      process_id: "storage"
      flow_role: "storage_output"
      record_type: "stock_time_record"
      raw_fields: "batch; commodity; measured net mass; moisture basis; receipt/release time; stock corrections; condition log; losses"
      collection_method: "Calibrated weighing and inventory reconciliation with timestamped batch balances. Integrate net tonnes over elapsed days; retain partial intervals and actual stock changes. Do not add output for internal moves."
      unit: "tday"
      frequency: "each batch event"
      temporal_coverage: "full declared custody/reporting period"
      site_scope: "one commodity/condition scenario"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; stock ledger; time logs"
    - protocol_id: cp_utilities
      process_id: "storage"
      flow_role: "electricity; diesel; natural_gas; water"
      record_type: "meter_record"
      raw_fields: "row; meter readings; unit; stock; task; zone; temperature; humidity; occupancy; operating hours"
      collection_method: "Submeter or measured task attribution reconciled to supplier bills and stock; keep utilities separate. Fuel density/composition conversion requires actual evidence."
      unit: "row unit"
      frequency: "matched billing/task period"
      temporal_coverage: "same period as stock integral"
      site_scope: "storage and actual support"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; bills; zone records"
    - protocol_id: cp_materials
      process_id: "storage"
      flow_role: "hydraulic_oil; stretch_film; wood_pallet; aluminium_phosphide"
      record_type: "issue_return_record"
      raw_fields: "specific material; formulation; issued/returned mass; reuse; repair; treatment record; task"
      collection_method: "Weigh actual material issue/return and record stock/reuse allocation. For pest treatment retain exact active ingredient, actual authorization and service coverage; no dosage default."
      unit: "kg"
      frequency: "each issue and period"
      temporal_coverage: "same period as stock integral"
      site_scope: "actual warehouse materials"
      aggregation_rule: "per reference flow"
      quality_evidence: "issue record; stock and reuse ledger"
    - protocol_id: cp_assets
      process_id: "storage"
      flow_role: "building; rack; forklift; grain_fan"
      record_type: "asset_record"
      raw_fields: "asset ID; configuration; manufacturing scope; construction quantity; lifetime utilization; actual use; prior shares; maintenance; retirement"
      collection_method: "Reconcile asset register, construction scope, occupied area-time and hour meters with supported lifetime denominators and supplier coverage."
      unit: "item"
      frequency: "asset change and period"
      temporal_coverage: "asset life plus reporting period"
      site_scope: "used building and equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "register; building bill; denominator evidence"
    - protocol_id: cp_waste
      process_id: "storage"
      flow_role: "waste_film; waste_pallet; waste_oil; spent_fumigant; wastewater; spoiled_wheat"
      record_type: "waste_record"
      raw_fields: "row; mass; composition; contamination; destination; loss cause; custody; treatment; date"
      collection_method: "Weigh segregated streams and reconcile disposal manifests; distinguish customer goods, moisture loss and operator consumables."
      unit: "kg"
      frequency: "each waste event"
      temporal_coverage: "same period as stock integral"
      site_scope: "attributable storage losses and waste"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale; manifests; responsibility records"
    - protocol_id: cp_emissions
      process_id: "storage"
      flow_role: "fossil_co2; biogenic_co2; phosphine_air"
      record_type: "emission_record"
      raw_fields: "species; source; compartment; activity; measurement; carbon balance; formulation; recovery; model/factor source"
      collection_method: "Measure the actual species or apply a traceable cited site-specific model and activity. Keep respiration, combustion and treatment distinct; do not equate chemical input with emitted mass."
      unit: "kg"
      frequency: "test and activity period"
      temporal_coverage: "same period as stock integral"
      site_scope: "onsite actual sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "tests; model and factor documentation"
  calculation_rules:
    - id: calc_stock_integral
      applies_to: "storage_output"
      rule: "For every batch interval multiply actual net mass in tonnes by elapsed days, then sum intervals once. Reconcile ingress, egress, moisture change and stock corrections. Divide attributable period exchanges by the resulting number of tday reference flows."
      inputs:
        - cp_stock
      output: "per reference flow"
      source_ids: []
    - id: calc_utilities
      applies_to: "electricity; diesel; natural_gas; water"
      rule: "Apply allocate_tasks and allocate_space to metered period amounts, retaining standby and shared scope; normalize on cp_stock. No energy-from-floor-area or pallet-mass default."
      inputs:
        - cp_utilities
        - cp_stock
      output: "per reference flow"
      source_ids: []
    - id: calc_asset_share
      applies_to: "building; rack; forklift; grain_fan"
      rule: "Allocate supported asset production/retirement inventory by actual-use/lifetime-use share; cap cumulative life attribution and normalize the period share on cp_stock. Unknown life or utilization remains a stated review gap."
      inputs:
        - cp_assets
        - cp_stock
      output: "per reference flow"
      source_ids: []
    - id: calc_emission_species
      applies_to: "fossil_co2; biogenic_co2; phosphine_air"
      rule: "Use observed species masses or a cited method with measured activity and actual capture/recovery. Record carbon origin and compartment and preserve measurement units; no default respiration, fumigation release or carbon-neutral assumption."
      inputs:
        - cp_emissions
        - cp_stock
      output: "per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_stock
      applies_to: "storage_output"
      requirement: "Mass/time ledger must reconcile batch events and inventory; moisture basis cannot silently switch from wet to dry. No mass inference from pallet count or rated capacity."
      evidence: "cp_stock"
    - id: dq_preservation
      applies_to: "all inventory rows"
      requirement: "Retain actual commodity, condition and period coverage; record failed preservation and losses rather than treating all received goods as successfully preserved."
      evidence: "cp_stock; condition records"
    - id: dq_assets
      applies_to: "building; rack; forklift; grain_fan"
      requirement: "Require supported lifetime/utilization and component boundaries; disclose uncertainty and missing upstream burdens."
      evidence: "cp_assets"
    - id: dq_identity
