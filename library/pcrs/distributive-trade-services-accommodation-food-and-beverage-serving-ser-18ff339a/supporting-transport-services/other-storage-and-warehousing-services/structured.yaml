system_boundary:
  rules:
    - rule_id: boundary_storage
      applies_to: "foreground_system_boundary"
      rule: "Include attributable receipt/release checking, in-store movements, lighting, ventilation, humidity control, cleaning, maintenance and actual preservation. Grain aeration depends on ambient conditions and moisture; it is not mandatory for all grain."
      source_ids:
        - fao-grain-aeration
    - rule_id: boundary_energy
      applies_to: "foreground_system_boundary"
      rule: "Screen actual lighting, space heating, equipment drives, charging and control loads. The EIA building survey is contextual evidence only; no national energy intensity or end-use share is imposed on a site."
      source_ids:
        - eia-warehouse-energy
    - rule_id: boundary_assets
      applies_to: "foreground_system_boundary"
      rule: "Include allocated manufacture, maintenance and retirement of actual building, racks and handling/preservation equipment. Declare whether building upstream inventory already includes components to prevent double counting."
      source_ids: []
    - rule_id: boundary_atomic
      applies_to: "foreground_system_boundary"
      rule: "Add every actually present separate fuel, refrigerant, pesticide formulation, maintenance part, packaging component, pollutant and waste as one atomic exchange. This list is not permission to omit an actual exchange; absent operations require documented applicability."
      source_ids: []
