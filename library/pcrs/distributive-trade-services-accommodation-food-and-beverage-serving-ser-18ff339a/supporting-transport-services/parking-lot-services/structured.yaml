system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "foreground_system_boundary"
      rule: "Include actual access control, occupied-space operation, lighting, underground/enclosed ventilation, mechanical lifts, drainage, cleaning, operator support and attributable standby. Open-air or unpowered modes retain their actual non-energy activities without assumed fan/lift use."
      source_ids: []
    - rule_id: boundary_metering
      applies_to: "foreground_system_boundary"
      rule: "Use actual end-use and facility utility metering with documented allocation and reconcile building versus parking use. General DOE metering guidance supports end-use measurement, not a parking energy factor, ventilation rate or operating requirement."
      source_ids:
        - doe-metering
    - rule_id: boundary_customer
      applies_to: "foreground_system_boundary"
      rule: "Keep customer propulsion, idling and charging-supply inventories separate from facility overhead; garage air-quality concentrations are not facility emission mass. Ventilation transfers customer exhaust rather than generating another emission. For an explicitly combined system add customer operations once and disclose that expanded boundary."
      source_ids: []
    - rule_id: boundary_role
      applies_to: "foreground_system_boundary"
      rule: "A fee-only operator includes its actual meters/payment/administration and allocated support; parking-space construction and operation supplied by another party remain an explicit upstream component for complete-system claims. Do not allocate the whole road/building to one curb fee or erase actual parking infrastructure because ownership is external."
      source_ids: []
    - rule_id: boundary_exchange_completeness
      applies_to: "foreground_system_boundary"
      rule: "Add every actual cleaning chemical, refrigerant, maintenance material, waste stream and pollutant species absent from the initial cards as its own specific conditional exchange, with the applicable property/unit and linked collection protocol. Confirm actual applicability from records; missing identity or quantity is an explicit gap, not zero. Generic mixed-waste or energy labels are not selected flows."
