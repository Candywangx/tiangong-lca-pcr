allocation_rules:
  - rule_id: allocate_time
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide vehicle class, actual space geometry, facility zone and service role. Allocate holding/lighting/space burdens using actual measured occupied space-time and relevant capacity, retaining justified unoccupied support. Allocate access/lift/payment event costs from actual events to their measured stay before hourly normalization. No equal-entry, fee or universal car/bicycle ratio."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use persistent pavement/garage/lift/meter ledgers with supported whole-life service denominators and actual parking shares. Keep structural floors and external asphalt areas non-overlapping; separate initial construction and actual renewals. Observed-period allocation distributes only that period manufacturing/construction share; cumulative shares across all uses/periods may not exceed one or reset annually. Unknown life/denominator requires review and sensitivity."
    source_ids: []
  - rule_id: allocate_scope
    applies_to: "foreground_burden_allocation"
    rule: "Separate vehicle charging, customer transport, building tenants and any valet service from parking overhead. A supplier support inventory replaces its covered burdens once. Fees and stored customer vehicles are not co-products; actual removed asphalt/oil receives no automatic avoided-production credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_activity
      process_id: "parking"
      flow_role: "parking_block"
      record_type: "Actual occupancy and service-role ledger"
      raw_fields: "vehicle class/dimensions; actual stall area; arrival/departure/occupancy timestamps; actual elapsed occupied hours; zone; provider role; facility functions; lift/access/payment events; fee rounding; stay distribution"
      collection_method: "Match actual occupancy observations, not just paid tickets or entry counts; compute elapsed occupied hours including partial hours and reconcile clock/occupancy gaps. One counted block is one actual occupied hour for one declared vehicle/space. Retain event burdens and actual duration distribution."
      unit: "Item(s)"
      frequency: "each stay/occupancy change"
      temporal_coverage: "complete stays and assigned standby/support"
      site_scope: "identified lot/garage/curb zones"
      aggregation_rule: "per reference flow"
      quality_evidence: "occupancy/entry-exit observations; clock calibration; space map; paid-versus-actual reconciliation"
    - protocol_id: cp_energy
      process_id: "parking"
      flow_role: "lighting; ventilation; lift_energy; drain_energy; meter_energy; heat"
      record_type: "End-use energy meter and duty log"
      raw_fields: "separate kWh/MJ; supply region/voltage; lighting schedule; fan duty/zone; lift events; drainage; fee IT; standby; charging delivery and conversion losses; other building use"
      collection_method: "Submeter actual end uses or reconcile shared meters with measured equipment duty and zone occupancy. Separate EV energy delivered, parking overhead and other tenants; retain safety/ventilation operating conditions and uncertainty, without default energy or ventilation factors."
      unit: "kWh; MJ"
      frequency: "each meter/duty interval and event"
      temporal_coverage: "all represented operation and standby"
      site_scope: "actual facility zones and suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; measured loads; control logs; customer-energy/tenant reconciliation"
    - protocol_id: cp_fuel
      process_id: "parking"
      flow_role: "diesel"
      record_type: "Operator fuel balance"
      raw_fields: "fuel grade; kg; receipts/stocks; generator/maintenance operation; density and temperature if converted; actual consumption"
      collection_method: "Reconcile actual facility consumption from calibrated mass measurements or traceable batch density. Customer fuel/driving is separate."
      unit: "kg"
      frequency: "each actual use and stock interval"
      temporal_coverage: "all actual operator fuel use"
      site_scope: "actual generator/maintenance equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel meters/invoices; stock balance; actual duty"
    - protocol_id: cp_material
      process_id: "parking"
      flow_role: "water; cleaner; hydraulic_oil"
      record_type: "Individual supply/maintenance ledger"
      raw_fields: "actual chemical/material; supplied kg or water m3; composition/grade; issues/returns; stock; cleaning/maintenance event"
      collection_method: "Meter/weigh each specific exchange and reconcile stocks/returns. Distinguish actual cleaning water from runoff and car washing; capture oil recovery and actual losses."
      unit: "kg; m3"
      frequency: "each issue/cleaning/service event"
      temporal_coverage: "all attributable maintenance and support"
      site_scope: "declared parking facilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "supply records; calibrated meters/scales; maintenance balance"
    - protocol_id: cp_maintenance
      process_id: "parking"
      flow_role: "asphalt"
      record_type: "Actual pavement renewal ledger"
      raw_fields: "section/area; material grade; mass; renewal event; machine activity; initial construction/upstream renewal scope; service allocation"
      collection_method: "Measure actual renewed material and match the affected parking section; add actual application-machine energy separately and remove already included upstream renewal."
      unit: "kg"
      frequency: "each actual renewal"
      temporal_coverage: "actual work assigned to represented service"
      site_scope: "identified parking section"
      aggregation_rule: "per reference flow"
      quality_evidence: "work orders; material weighing; area plans; upstream scope"
    - protocol_id: cp_assets
      process_id: "parking"
      flow_role: "building_share; pavement_share; lift_share; meter_share"
      record_type: "Persistent asset and utilization ledger"
      raw_fields: "asset ID/configuration; m2 or Item(s); actual parking share; construction/manufacturing boundary; initial/renewal split; actual use; supported lifetime service denominator; cumulative prior fractions; period share; uncertainty"
      collection_method: "Assign actual asset inventories using supported whole-life utilization and transparent time/space/event drivers. Conserve cumulative shares across all users/periods, avoid structural/pavement overlap, and review unsupported lifetime estimates."
      unit: "m2; Item(s)"
      frequency: "each allocation/asset update"
      temporal_coverage: "supported whole life and declared observation period"
      site_scope: "actual parking-related assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "construction/asset records; actual utilization; life evidence; share reconciliation"
    - protocol_id: cp_waste
      process_id: "parking"
      flow_role: "used_oil; washwater; waste_asphalt"
      record_type: "Specific waste/treatment ledger"
      raw_fields: "individual stream; measured kg/m3; composition; source event; recipient; treatment; recovered quantity"
      collection_method: "Weigh removed asphalt/oil separately and meter actual washwater; identify composition and treatment. Uncaptured runoff or a leak requires separate substance/compartment evidence rather than a waste-transfer assumption."
      unit: "kg; m3"
      frequency: "each actual transfer/discharge"
      temporal_coverage: "all attributable wastes"
