      applies_to: "all inventory rows"
      requirement: "Disclose customer-energy and exhaust exclusions, provider roles, omitted species/materials, identity/measurement gaps and uncertainty; missing is not zero."
      evidence: "actual records and scope review"
validation_rules:
  - rule_id: validate_block
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique parking_block output equal to 1 Item(s) with explicit one-vehicle/one-space/one-actual-hour meaning and complete qualifiers. Reject entrance count, fee rounding, reservation time and unlike vehicle/facility pooling as occupied-time evidence."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude lock-up garage rental and valet. Separate fee-only and full space provision; confirm actual upstream parking infrastructure when a full-system claim is made."
    source_ids:
      - un-cpc-parking
  - rule_id: validate_customer
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile vehicle charging sold as energy and customer transport/exhaust independently. Facility ventilation electricity is included but customer exhaust is not generated twice or treated as operator fuel use."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Require atomic exchanges, actual conditional applicability, conserved asset shares, non-overlapping structural/pavement/renewal scopes and documented waste treatment. Identity and evidence gaps remain explicit; no publication readiness follows from the draft."
    source_ids: []
