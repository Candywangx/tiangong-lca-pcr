  calculation_rules:
    - id: occupied_time
      applies_to: "parking_block"
      rule: "Sum actual elapsed occupied hours within each declared vehicle/space/facility scenario. One counted block has one actual occupied hour; retain fractional blocks and do not round to billed hours."
      inputs:
        - cp_activity
      output: "actual one-hour block quantity"
      source_ids: []
    - id: parking_attribution
      applies_to: "all inventory rows"
      rule: "Assign event-driven actual costs to the observed stay first and holding/support totals by measured space-time/causal use, then divide by actual occupied one-hour blocks in that qualified scenario. Reference output is exactly 1 Item(s)."
      inputs:
        - cp_activity
        - "attributable measured totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "building_share; pavement_share; lift_share; meter_share"
      rule: "Multiply actual upstream construction/manufacture by the supported reference-block share of whole-life service, preserving period and cumulative conservation and avoiding separately recorded renewal overlap."
