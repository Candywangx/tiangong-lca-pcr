      applies_to: "foreground_system_boundary"
      rule: "Screen building, refrigeration plant, pallets, maintenance and end-of-life burdens; assign actual upstream shares and disclose gaps. Never count an asset component both within an aggregate provider dataset and separately."
      source_ids: []
    - rule_id: boundary_losses
      applies_to: "foreground_system_boundary"
      rule: "Track missing/spoiled goods by lot and cause; disclose custody loss and its treatment separately. Where upstream replacement production is included in the study boundary, identify its separate product dataset; do not relabel lost goods as an emission or storage output."
      source_ids: []
    - rule_id: boundary_species
      applies_to: "foreground_system_boundary"
      rule: "Screen every actual refrigerant and release. The example species cards are conditional; add one chemically specific card for each other actual refrigerant and each elementary constituent released from a blend."
      source_ids:
        - epa-refrigerant-balance
