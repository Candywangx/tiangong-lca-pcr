    used_for: "Cold-store activity and energy records; distinction between financial depreciation and working life. Meat context; no numeric cost, lifetime or energy factor adopted."
  - id: "fao-cold-equipment"
    type: "official_guidance"
    reference: "FAO, Manual on meat cold store operation and management, Refrigeration equipment. https://www.fao.org/4/t0098e/T0098E04.htm"
    used_for: "Temperature, humidity and air-circulation monitoring relevance; no meat-specific temperature imposed on other goods."
  - id: "epa-refrigerant-balance"
    type: "official_guidance"
    reference: "US EPA, Direct Fugitive Emissions from Refrigeration, Air Conditioning, Fire Suppression, and Industrial Gases, section 2.3, equations 4–5. https://www.epa.gov/sites/default/files/2020-12/documents/fugitiveemissions.pdf"
    used_for: "Species-specific refrigerant material-balance logic; not a product LCA boundary, leakage factor, GWP or jurisdictional applicability claim."
