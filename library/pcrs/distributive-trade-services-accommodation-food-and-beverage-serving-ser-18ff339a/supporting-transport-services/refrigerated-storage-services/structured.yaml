allocation_rules:
  - rule_id: allocation_meters
    applies_to: "foreground_burden_allocation"
    rule: "Prefer room/circuit submetering and subdivide receipt, storage and dispatch where separately sold. For shared utilities, document measured heat loads and operating drivers; do not allocate refrigerated and ambient activity by revenue or mass alone without causal justification. Reconcile all allocated shares to the facility total."
    source_ids: []
  - rule_id: allocation_service
    applies_to: "foreground_burden_allocation"
    rule: "Within one equivalent condition stratum, divide its attributable inventory by actual delivered tonne-days; allocate common idle-room/support burdens transparently over the same reporting period. Distinct temperature bands require separate measured or engineering-supported shares."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use observed asset utilization and supported lifetime delivered service for manufacturing/maintenance/end-of-life shares; preserve a separate denominator for pallet use or building area before mapping its burden to tonne-days. Do not invent lifetimes or copy financial amortization."
    source_ids:
      - fao-cold-operation
  - rule_id: allocation_recovery
    applies_to: "foreground_burden_allocation"
    rule: "Report actual refrigerant transfers to recovery separately in the balance. Recovered stock is not an air emission and is not automatically a negative emission or virgin-production credit."
    source_ids:
      - epa-refrigerant-balance
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "cold_store"
      flow_role: "storage_service"
      record_type: "warehouse log"
      raw_fields: "lot; commodity; state; net mass; arrival/release timestamps; temperature band; exceptions; internal transfers"
      collection_method: "Reconcile calibrated net-weight records, custody timestamps and monitored condition history; split records when mass or condition changes."
      unit: "tday"
      frequency: "each lot and condition interval"
      temporal_coverage: "complete declared reporting period"
      site_scope: "named room and equivalent condition stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; timestamp audit; temperature logger calibration; contract acceptance"
    - protocol_id: cp_freezing
      process_id: "cold_store"
      flow_role: "freezing_electricity"
      record_type: "freezing batch record"
      raw_fields: "batch and lot IDs; net batch mass; incoming/outgoing temperature and state; freezer meter opening/close; freezer duration; allocation share; linked storage lots"
      collection_method: "Submeter the actual freezing operation, reconcile freezer bills and batch mass to the stored lots, record actual freezing acceptance and prevent overlap with holding refrigeration. Include each associated circuit in the species-specific refrigerant balance and asset ledger."
      unit: "kWh"
      frequency: "each freezing batch"
      temporal_coverage: "same period and lot chain as cp_service"
      site_scope: "associated freezer and its actual stored lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated meter; batch log; temperature record; storage linkage and utility reconciliation"
    - protocol_id: cp_utilities
      process_id: "cold_store"
      flow_role: "electricity; water"
      record_type: "meter record"
      raw_fields: "meter ID; opening/closing readings; room; circuit; operating period; share driver; supply specification"
      collection_method: "Use calibrated submeter differences; reconcile site invoices and shared-load shares; distinguish fresh water from recirculation."
      unit: "kWh; m3"
      frequency: "meter interval"
      temporal_coverage: "same period as cp_service"
      site_scope: "same room/condition stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; invoices; meter coverage diagram; allocation reconciliation"
    - protocol_id: cp_refrigerant
      process_id: "cold_store"
      flow_role: "ammonia_input; r134a_input; co2_input; ammonia_air; r134a_air; co2_air"
      record_type: "mass balance"
      raw_fields: "species; opening/closing cylinder stock; acquisition; offsite transfer; recovery; equipment charge at period start/end; service event; actual discharge compartment"
      collection_method: "Weigh/verify each species stock and equipment charge; reconcile purchases, contractor additions, recovery and charge changes. Avoid counting a contractor transfer and site-stock withdrawal twice."
      unit: "kg"
      frequency: "each transfer and period opening/close"
      temporal_coverage: "same period as cp_service"
      site_scope: "named holding/freezer refrigeration circuit and allocated condition stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "cylinder weighing; service records; recovery certificates; balance reconciliation"
    - protocol_id: cp_materials
      process_id: "cold_store"
      flow_role: "lubricant; sodium_hydroxide; ldpe_film"
      record_type: "material record"
      raw_fields: "chemical/polymer identity; concentration; issued amount; returns; opening/closing stock; lot allocation"
      collection_method: "Reconcile stores issues, returns and physical consumption by named material; preserve concentration and supplier evidence."
      unit: "kg"
      frequency: "each issue and period balance"
      temporal_coverage: "same period as cp_service"
      site_scope: "storage contract operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock cards; invoices; formulation specifications"
    - protocol_id: cp_assets
      process_id: "cold_store"
      flow_role: "pallet_share; compressor_share; building_share"
      record_type: "asset service record"
      raw_fields: "asset ID; upstream dataset boundary; production burden; observed utilization; installation/retirement; maintenance; lifetime service evidence; allocated share"
      collection_method: "Link each asset to production and disposal inventories; record actual activity and documented lifetime service; review uncertain life scenarios separately."
      unit: "item; m2"
      frequency: "asset change and annual reconciliation"
      temporal_coverage: "documented lifetime and reporting period"
      site_scope: "owned assets attributable to the room"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; maintenance logs; supplier inventories; service-life evidence"
    - protocol_id: cp_waste
      process_id: "cold_store"
      flow_role: "cleaning_wastewater; spent_lubricant; waste_ldpe"
      record_type: "waste transfer record"
      raw_fields: "specific waste; amount; receiving process; composition; date; treatment boundary; lot/site share"
      collection_method: "Meter/measure each waste separately and reconcile transfer notes to actual treatment; include treatment once."
      unit: "kg; m3"
      frequency: "each transfer"
      temporal_coverage: "same period as cp_service"
      site_scope: "storage operations and named receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste manifests; treatment contract; laboratory composition where needed"
  calculation_rules:
    - id: service_integral
      applies_to: "storage_service"
      rule: "S = sum of net lot tonnes multiplied by residence days for each unchanged condition interval; use actual elapsed hours divided by 24. Delivered reference output is 1 tday."
      inputs:
        - cp_service
      output: "delivered service S"
      source_ids: []
    - id: inventory_attribution
      applies_to: "all inventory rows"
      rule: "For each exchange, allocate the measured numerator to the declared condition stratum and divide by its positive delivered service S. Preserve numerator units and one common tonne-day denominator."
      inputs:
        - cp_service
        - cp_utilities
        - cp_materials
        - cp_waste
      output: "exchange amount per reference flow"
      source_ids: []
    - id: species_loss
      applies_to: "ammonia_air; r134a_air; co2_air"
      rule: "For each species, release = opening stored stock + acquisitions + opening equipment charge - closing stored stock - offsite transfers - closing equipment charge. Include recovered refrigerant in closing stock or offsite transfers once; investigate negative/unreconciled balances instead of clipping them. Divide attributable release by the same S."
      inputs:
        - cp_refrigerant
        - cp_service
      output: "species mass to air per reference flow"
      source_ids:
        - epa-refrigerant-balance
    - id: asset_attribution
      applies_to: "pallet_share; compressor_share; building_share"
      rule: "Attribute the asset production, maintenance and disposal inventory using documented service utilization and lifetime delivered service, then the declared condition share and positive S. State uncertainty and prevent duplicate aggregate/component burdens."
      inputs:
        - cp_assets
        - cp_service
      output: "asset quantity share per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_conditions
      applies_to: "storage_service"
      requirement: "Complete lot mass-time and calibrated condition history; declare failures, missing intervals and goods losses without silently creating compliant output."
      evidence: "cp_service"
    - id: dq_closure
      applies_to: "all inventory rows"
      requirement: "Reconcile purchased utilities, material stock, waste destination, equipment shares and delivered service over matching periods; no assumed default ranges."
      evidence: "cp_utilities; cp_materials; cp_assets; cp_waste"
    - id: dq_refrigerant
      applies_to: "ammonia_air; r134a_air; co2_air"
      requirement: "Balance each actual species with charge and recovery changes; distinguish zero observed release from missing data; blend components need separate elementary identities."
      evidence: "cp_refrigerant; epa-refrigerant-balance"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve flow/property/unit-group identities before database-linked use; a semantic atomic label does not establish a verified UUID."
      evidence: "supplier specifications; direct identity verification"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require one output linked as storage_service, 1 tday, positive delivered service and all condition/custody qualifiers; tonne-kilometres, pallet counts and nominal capacity cannot substitute for measured tonne-days."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
