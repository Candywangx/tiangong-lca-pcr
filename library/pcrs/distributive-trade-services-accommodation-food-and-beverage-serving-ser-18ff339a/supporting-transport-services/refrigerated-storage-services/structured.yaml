system_boundary:
  rules:
    - rule_id: boundary_service
      applies_to: "foreground_system_boundary"
      rule: "Include attributable refrigeration and room support from acceptance through release; include associated blast freezing as a distinct metered operation with recorded batch mass and incoming/outgoing state. Its energy and support burdens are attributed to the same lot storage service; freezing does not itself create extra storage tonne-days. Independently sold specialized food freezing is excluded."
