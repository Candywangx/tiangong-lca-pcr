system_boundary:
  rules:
    - rule_id: boundary_task
      applies_to: "foreground_system_boundary"
      rule: "Include actual preparation/dispatch, pilot transfer/boarding/landing, tug positioning/connection/assist/release, actual wait/retry and allocated return/reposition, base support and task-related maintenance. Do not invent a pilot boat for shore boarding or a tug for pilot-only service."
      source_ids:
        - un-cpc-inland-pilotage
    - rule_id: boundary_interfaces
      applies_to: "foreground_system_boundary"
      rule: "Retain actual agreed passage/task plan, pilot/master/tug communication, aided-vessel particulars and handover endpoints as task-definition evidence. UK MCA guidance informs record/interface structure; local inland water levels, currents, shallow reaches and bridge/lock clearance limits come from actual local records and are not imported numerical defaults."
      source_ids:
        - mca-task-interfaces
    - rule_id: boundary_energy
      applies_to: "foreground_system_boundary"
      rule: "Separate service-craft fuel/charging/auxiliaries from customer ship propulsion and port facilities. Actual shore connection can replace an auxiliary-engine activity, but grid and charging burdens remain; do not claim zero lifecycle emissions from zero onboard combustion. EPA harbor-craft guidance is route evidence, not an inland fleet/factor default."
      source_ids:
        - epa-harbor-craft
    - rule_id: boundary_receiver
      applies_to: "foreground_system_boundary"
      rule: "Screen actual cooling-water return, bilge/sewage reception, oil leaks, antifouling constituents, wake/propeller disturbance and underwater noise. Assign actual river/lake/brackish receiver and species; collected wastewater is not assumed direct river discharge. Chemical rows do not establish complete local ecological coverage."
      source_ids: []
