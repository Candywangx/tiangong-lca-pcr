allocation_rules:
  - rule_id: allocate_task
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide pilot, tug and package scopes and unlike vessel/environment tasks first. Assign actual craft/engine fuel and charging by measured duty/time; distribute multi-job launch trips, return/reposition and standby by documented causal dispatch use and reconcile all jobs. Do not multiply a full fleet/day or full return voyage into every task."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Maintain persistent tug, pilot-boat, fender, rope and base ledgers with supported whole-life activity/cycle denominators. Attribute only the actual task fraction and actual renewal share; cumulative manufacturing fractions across all jobs/periods must not exceed one or reset annually. Observed-period allocation distributes only the already attributed period share. Unknown lifespan/denominator requires review and sensitivity; no invented vessel mass."
    source_ids: []
  - rule_id: allocate_provider
    applies_to: "foreground_burden_allocation"
    rule: "A contracted pilot/tug/transfer inventory replaces its covered fuel, equipment and waste once. Avoid fender/rope renewal already covered by the craft inventory. Customer propulsion, cargo, fees and successful vessel movement are not additional co-products; actual waste recycling receives no automatic credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_activity
      process_id: "inland_task"
      flow_role: "pilotage_task"
      record_type: "Task, local-condition and dispatch ledger"
      raw_fields: "variant/package; work order; aided vessel dimensions/draft/load/propulsion; actual inland route/berth; local water level/current; depth/bridge/lock clearance records; task gates/times; pilot transfer; craft IDs; actual assist/idle/reposition/return; shared dispatch; completion"
      collection_method: "Match actual task plan, pilot/master/tug handover and dispatch/position records. Retain measured local conditions and actual accepted task interfaces; count homogeneous tasks only and keep component/package lineage, wait/retry and return attribution."
      unit: "Item(s)"
      frequency: "each actual task/phase"
      temporal_coverage: "full task and assigned support phases"
      site_scope: "all actual pilot/tug/transfer operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "task plans; handovers; AIS/GNSS or equivalent route logs; local hydrology; completion and dispatch reconciliation"
    - protocol_id: cp_fuel
      process_id: "inland_task"
      flow_role: "diesel"
      record_type: "Craft/engine fuel and duty ledger"
      raw_fields: "craft/engine ID; power; actual duty/load/time; main/auxiliary fuel; grade; metered kg; stock; density/temperature if converted; assist/idle/transit phases"
      collection_method: "Use actual flow meters/stock balances by engine and task where possible. Reconcile duty logs, waiting and deadhead; a supported engine-specific load-time fuel method is allowed only with verified local parameters and uncertainty. No universal power-distance coefficient."
      unit: "kg"
      frequency: "each phase and monitoring interval"
      temporal_coverage: "all represented service-craft operation"
      site_scope: "actual engines and operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel meters; stock reconciliation; actual engine/duty records; parameter evidence"
    - protocol_id: cp_energy
      process_id: "inland_task"
      flow_role: "craft_power; base_power"
      record_type: "Electricity/charging and support ledger"
      raw_fields: "meter; kWh; voltage/region; charger input/output/loss; actual vessel/base use; duty; standby; supplier coverage; customer electricity separation"
      collection_method: "Meter actual shore/charging/base loads and assign task share with measured dispatch/use. Avoid fuel/charging overlap in hybrid phases and keep upstream power generation separate from onboard releases."
      unit: "kWh"
      frequency: "each charging/base interval and phase"
      temporal_coverage: "full represented operation and standby"
      site_scope: "actual craft/base/supply"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated meters; charge logs; supply records; task allocation"
    - protocol_id: cp_material
      process_id: "inland_task"
      flow_role: "engine_oil; hydraulic_oil; towline; water"
      record_type: "Specific material and maintenance ledger"
      raw_fields: "individual grade/material; kg/m3; rope diameter/mass; issue/return; actual replacement; life/use evidence; stock; recovery and leaks"
      collection_method: "Measure each specific material separately and assign supported actual usage/replacement share. Do not allocate a full rope or oil change to every job; record recovery and waste destinations."
      unit: "kg; m3"
      frequency: "each supply/maintenance/stock event"
      temporal_coverage: "all attributable service support"
      site_scope: "actual service craft/base"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; stock/service logs; supplier composition; usage and material balance"
    - protocol_id: cp_transfer
      process_id: "inland_task"
      flow_role: "pilot_road_transfer"
      record_type: "Actual pilot-transfer journey ledger"
      raw_fields: "route/mode; petrol vehicle; actual km; occupants; passenger share; purpose; package/provider overlap"
      collection_method: "Read actual task-related journeys and passenger-distance; another transport mode needs a separate flow. Reconcile shared transfers and provider-included travel rather than assuming one journey per job."
      unit: "person*km"
      frequency: "each actual journey"
      temporal_coverage: "full actual task transfer scope"
      site_scope: "actual transfer operator"
      aggregation_rule: "per reference flow"
      quality_evidence: "journey/dispatch logs; distance and occupancy records"
    - protocol_id: cp_assets
      process_id: "inland_task"
      flow_role: "fender; tug_share; pilot_boat_share; base_share"
      record_type: "Persistent craft/equipment/base ledger"
      raw_fields: "asset ID/configuration; manufacture inventory; Item(s)/m2; task activity; supported lifetime/cycle denominator; actual renewal; prior cumulative fractions; period share; sensitivity"
      collection_method: "Link actual hull/engine/fender/base inventories to supported whole-life service utilization. Keep separately modelled consumables/renewals non-overlapping and conserve allocation fractions across all jobs and periods; unknown denominator requires review."
      unit: "Item(s); m2"
      frequency: "each allocation and asset/renewal update"
      temporal_coverage: "supported whole life and declared observation period"
      site_scope: "actual pilot/tug/shore assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset and utilization records; supported life; scope/cumulative reconciliation"
    - protocol_id: cp_waste
      process_id: "inland_task"
      flow_role: "used_engine_oil; bilge_water; sewage; worn_rope"
      record_type: "Segregated vessel-waste reception ledger"
      raw_fields: "individual stream; measured kg/m3; oil/chemical composition; event; collection; onboard treatment; shore recipient; treatment/disposal"
      collection_method: "Measure each actual collected waste separately and trace onboard/shore treatment once. Do not treat delivered waste as a direct freshwater release or assume reception/treatment without records."
      unit: "kg; m3"
      frequency: "each actual transfer/discharge period"
      temporal_coverage: "all attributable service waste"
      site_scope: "actual craft and reception/treatment providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "reception tickets; weighing/meters; composition; treatment inventory"
    - protocol_id: cp_cooling
      process_id: "inland_task"
      flow_role: "river_water; river_return"
      record_type: "Actual freshwater cooling balance"
      raw_fields: "source/receiving river; actual m3; temperatures; open/closed circuit; recirculation; loss; contamination; task duty"
      collection_method: "Measure actual intake/return and temperature, reconcile recirculation and consumed fraction; use actual local waterbody compartment. Thermal/ecological effects need explicit site evidence beyond volume balance."
      unit: "m3"
      frequency: "each operating/monitoring interval"
      temporal_coverage: "actual open cooling operation"
      site_scope: "actual inland river/craft"
      aggregation_rule: "per reference flow"
      quality_evidence: "flow/temperature records; circuit configuration; water balance"
    - protocol_id: cp_release
      process_id: "inland_task"
      flow_role: "fossil_co2; carbon_monoxide; nitrogen_monoxide; nitrogen_dioxide; sulfur_dioxide"
      record_type: "Species-specific service-engine emission ledger"
      raw_fields: "engine/fuel identity; actual load/time; fuel carbon/sulfur; measured species kg; air compartment; NO/NO2 speciation/equivalent basis; control conditions; method/factor applicability; uncertainty"
      collection_method: "Use actual species measurements or independently verified engine/fuel/duty-specific evidence. Separate main/auxiliary and customer/provider scopes; never copy NOx into both NO and NO2 or apply coastal fuel defaults. Other actual emissions/leaks require their own species/receiver records."
      unit: "kg"
      frequency: "each actual duty and representative monitoring"
      temporal_coverage: "all represented onboard/operator emissions"
      site_scope: "actual service engines and receiving air"
      aggregation_rule: "per reference flow"
      quality_evidence: "measurement reports; local fuel/engine evidence; duty/carbon/sulfur reconciliation"
  calculation_rules:
    - id: task_attribution
      applies_to: "all inventory rows"
      rule: "Assign actual operation, transfer, standby and maintenance to one homogeneous task variant/extent; divide by actual completed task count while retaining failed/retry work. Reference output is exactly 1 Item(s)."
      inputs:
        - cp_activity
        - "attributable measured totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "fender; tug_share; pilot_boat_share; base_share"
      rule: "Apply the supported task fraction of whole-life service to actual asset manufacture and actual renewal scope; period observations distribute only the attributed period share, conserving all cumulative fractions."
      inputs:
        - cp_assets
        - cp_activity
      output: "asset amount per reference flow"
      source_ids: []
    - id: engine_species
      applies_to: "fossil_co2; carbon_monoxide; nitrogen_monoxide; nitrogen_dioxide; sulfur_dioxide"
      rule: "Use actual species mass or verified engine/fuel/duty evidence; record every applied factor/unit and NOx-equivalent-to-species conversion basis in the dataset. No numerical factor or load default is supplied by this PCR."
      inputs:
        - cp_release
        - cp_fuel
      output: "individual species release per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_task
      applies_to: "pilotage_task"
      requirement: "Verify variant, actual inland water domain, vessel configuration, local current/water-level/clearance records and task gates. Keep pilot-only, tug-only and package results distinct."
      evidence: "cp_activity"
    - id: quality_duty
      applies_to: "all energy rows"
      requirement: "Reconcile actual assist, transit, idle, standby, transfer and reposition. Do not infer consumption solely from distance, tug rated power or customer vessel displacement."
      evidence: "cp_activity; cp_fuel; cp_energy"
    - id: quality_lifecycle
      applies_to: "all asset rows"
      requirement: "Substantiate life/cycle denominators and conserved craft/fender/base shares with maintenance overlap removed; unknown life/upstream scope prevents complete lifecycle claims."
      evidence: "cp_assets; cp_material"
    - id: quality_water
      applies_to: "all inventory rows"
      requirement: "Verify actual freshwater/other inland receivers and real waste reception, chemical/leak identity, thermal/wake/noise coverage and uncertainty. Do not copy marine compartments or present missing evidence as zero."
      evidence: "cp_waste; cp_cooling; cp_release"
validation_rules:
  - rule_id: validate_task
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique pilotage_task output equal to 1 Item(s), with one fixed variant, actual vessel/river conditions, task interfaces and complete craft/transfer scope. No unqualified equal-task factor."
    source_ids: []
  - rule_id: validate_classification
    applies_to: "foreground_dataset_conformance"
    rule: "Reject transport towing/pushing, non-tug shore towing, coastal pilotage and salvage/handling/storage disguised as inland berthing. Validate pilot/tug package component lineage and prevent double count."
    source_ids:
      - un-cpc-inland-pilotage
  - rule_id: validate_boundaries
    applies_to: "foreground_dataset_conformance"
    rule: "Separate customer propulsion, port infrastructure and supplier-covered fuel/assets from service-craft operation. Verify actual whole-task return/standby allocation and conserved asset life shares, not full craft inventories per job."
    source_ids: []
  - rule_id: validate_atomic_water
    applies_to: "foreground_dataset_conformance"
    rule: "Require specific fuel/rope/fender/waste/pollutant exchanges and verified actual applicability. Preserve NO/NO2 distinctions, water source/receiver and real treatment scope; identity and ecological gaps remain explicit without implying publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "inland_pilotage_berthing_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A compatible inland pilotage/berthing task component with declared vessel, river conditions, interfaces and variant"
  excluded_use: "Inland transport tow or full voyage, coastal pilotage, customer propulsion/port-infrastructure footprint, unqualified task comparisons or operational safety approval"
  required_metadata: "pilot_only/tug_berthing_only/combined_package; exact completed task and component gates; inland river/lake/port and actual water classification; route/start/end/berth; aided vessel length/beam/draft/displacement/load/propulsion status; actual water level/current/direction, weather/visibility, under-keel and bridge/lock clearance observations and local operating limits; actual transit/assist/idle/standby/reposition/return distances and times; pilot transfer route; tug/pilot-boat IDs and power/engine/bollard-pull configuration; actual engine duty and number of craft; lines/fenders; customer propulsion boundary; supply/shore power; operator/provider split; actual completion/quality and safety record; asset life and maintenance scope; location and period"
  required_quality_disclosure: "Identity/measurement and duty gaps; task/transfer/provider boundaries; freshwater/thermal/wake/noise scope; species factors; asset life and missing upstream evidence"
  update_trigger: "Changed task variant, aided vessel, river conditions or clearance, route/berth, service craft/powertrain, fuel/supply, transfer plan, waste reception, provider or life/allocation evidence"
data_sources:
  - id: "un-cpc-inland-pilotage"
    type: "official_guidance"
    reference: "UNSD CPC3.0 67522 explanatory note, consistent with draft PDF pp375–376. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67522"
    used_for: "Inland pilotage/pilot-vessel and tug docking/undocking scope; transport tow exclusion; no task factor"
  - id: "mca-task-interfaces"
    type: "official_guidance"
    reference: "UK MCA, A guide to good practice on port and marine facilities, sections on pilotage, towage and passage planning, updated 15 April 2025. https://www.gov.uk/government/publications/a-guide-to-good-practice-on-port-marine-operations/a-guide-to-good-practice-on-port-and-marine-facilities"
    used_for: "Task planning, pilot/master/tug coordination and handover record structure only; local inland operating limits are not inferred from UK examples"
  - id: "epa-harbor-craft"
    type: "official_guidance"
    reference: "US EPA Harbor Craft Best Practices to Improve Air Quality, harbor-craft description and shore-power sections, web read 2026-10-23. https://www.epa.gov/ports-initiative/harbor-craft-hc-best-practices-improve-air-quality"
    used_for: "Actual tug/pilot-craft and shore-power route separation; no universal inland engine, load, sulfur, voltage threshold or emission factor adopted"
