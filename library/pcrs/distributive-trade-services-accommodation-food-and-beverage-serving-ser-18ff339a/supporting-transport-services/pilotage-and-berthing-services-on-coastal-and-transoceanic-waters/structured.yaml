        - cp_energy
        - cp_material
        - cp_waste
      output: "exchange per reference flow"
      source_ids: []
    - id: asset_allocation
      applies_to: "pilot_launch; tug_asset"
      rule: "Attribute manufacturing, overhaul and retirement by supported lifetime utilization and actual task share, then divide by N, retaining battery/component boundaries and uncertainty."
      inputs:
        - cp_asset
        - cp_task
      output: "craft share per reference flow"
      source_ids: []
    - id: emission_allocation
      applies_to: "co2_air; co_air; no_air; no2_air; so2_air; pm25_air; methane_air"
      rule: "Resolve actual species mass for each main/auxiliary/duty interval from measurement or explicitly justified compatible factors, sum non-overlapping intervals, allocate actual craft/task share and divide by N."
      inputs:
