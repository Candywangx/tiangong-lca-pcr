allocation_rules:
  - rule_id: allocate_subtype
    applies_to: "foreground_burden_allocation"
    rule: "Separate pilotage-only, tug-only and integrated contract output. In an integrated task allocate actual craft activity once; do not add full pilot and tug tasks as extra complete outputs."
    source_ids: []
  - rule_id: allocate_craft
    applies_to: "foreground_burden_allocation"
    rule: "Prefer craft/engine/time fuel and energy meters; shared standby, empty repositioning, pilot transfers and retries use documented actual task activity and must reconcile to fleet totals. No tariff/GT proxy for fuel."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate craft production, overhaul, batteries, ropes and fenders by supported physical service life and actual utilization; distinguish replacement material from quantities embedded in an all-life supplier dataset."
    source_ids: []
  - rule_id: allocate_wastes
    applies_to: "foreground_burden_allocation"
    rule: "Keep collected bilgewater, recovered oil and actual receiving-environment discharge distinct; no automatic recycling credit or bilgewater-to-ocean-emission equivalence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "task"
      flow_role: "marine_service"
      record_type: "foreground record"
      raw_fields: "subtype; job ID; vessel/GT/dimensions/draught/condition; water limits; berth/endpoints; pilot/tug interfaces; roster; distance/time; weather/tide; attempts; acceptance"
      collection_method: "Reconcile job order, pilot/master/tug records, actual craft track and signed completion; split inland or transport-tow stages before counting."
      unit: "item"
      frequency: "each task"
      temporal_coverage: "same task/reporting period"
      site_scope: "actual assigned craft and service boundary"
