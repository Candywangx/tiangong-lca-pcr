allocation_rules:
  - rule_id: allocate_project
    applies_to: "foreground_burden_allocation"
    rule: "Prefer stage/equipment-specific meters and logs; assign shared mobilization, standby, high-water delays and retries by documented actual project activity, then accepted task extent. Do not allocate by salvage award or cargo value."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate working craft, crane/pontoon, pump, diving/cutting rig, sling and lift bags by supported lifetime utilization and actual task use; aggregate supplier assets and included components cannot both be charged."
    source_ids: []
  - rule_id: allocate_custody
    applies_to: "foreground_burden_allocation"
    rule: "Recovered vessel/cargo is original property, not a newly produced co-product. Keep recovery amounts/fate outside an automatic revenue allocation or avoided-manufacture credit; independently model any further recycling/dismantling study boundary."
    source_ids: []
  - rule_id: allocate_pollution
    applies_to: "foreground_burden_allocation"
    rule: "Record pre-existing casualty pollution separately from operator combustion, new spills and disturbance-induced releases. A removed pollutant mass is not a negative emission; no default avoided future release."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "recovery"
      flow_role: "recovery_service"
      record_type: "foreground record"
      raw_fields: "task/object/cargo IDs; initial state/mass; depth/current/water level; bridge/lock limits; plan/stages; equipment; actual activity; attempts; acceptance/handoff; actual waterbody ID/type/location; hydrological connection and salinity with units where relevant"
      collection_method: "Reconcile survey, actual recovery plan, equipment/stage logs and signed recovered-state/custody handoff; retain incomplete/failed scope explicitly."
      unit: "item"
      frequency: "each stage/task"
      temporal_coverage: "same declared task/reporting period"
      site_scope: "actual inland recovery site and assigned equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "survey; photographs; stage records; signed handoff; receiving-waterbody characterization"
    - protocol_id: cp_energy
      process_id: "recovery"
      flow_role: "diesel; petrol; electricity"
      record_type: "foreground record"
      raw_fields: "engine/tool ID; fuel/stock; delivery/return; shore meter; actual power/load/duration; standby/retry/travel; share"
      collection_method: "Measure actual operator fuel and purchased electricity by source; reconcile full task cycle without reusing casualty fuel as purchased supply."
      unit: "kg; kWh"
      frequency: "duty interval/task"
      temporal_coverage: "same declared task/reporting period"
      site_scope: "actual inland recovery site and assigned equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; fuel balance; duty logs"
    - protocol_id: cp_material
      process_id: "recovery"
      flow_role: "water; hydraulic_oil; sorbent; steel_sling; breathing_air; oxygen; acetylene"
      record_type: "foreground record"
      raw_fields: "specific substance/product; composition; cylinder/stock mass; issued/returned; consumed/retired; task/stage source"
      collection_method: "Use actual stock/cylinder weighing or traceable delivered quantity; keep breathing/cutting gases and internally generated supply distinct; record material service-life shares."
      unit: "kg; m3"
      frequency: "issue/event and period"
      temporal_coverage: "same declared task/reporting period"
      site_scope: "actual inland recovery site and assigned equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock/cylinder records; composition; supplier boundary"
    - protocol_id: cp_asset
      process_id: "recovery"
      flow_role: "boom; workboat; lift_bag; floating_crane; pump; diving_system; cutting_rig"
      record_type: "foreground record"
      raw_fields: "asset ID/configuration; upstream boundary; actual use; maintenance/retirement; lifetime evidence; task share"
      collection_method: "Bind working equipment to upstream manufacture and retirement; document physical lifetime and actual stage utilization without double-counting included components."
      unit: "item; m"
      frequency: "asset event/period"
      temporal_coverage: "same declared task/reporting period"
      site_scope: "actual inland recovery site and assigned equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/maintenance registers; utilization/life evidence"
    - protocol_id: cp_waste
      process_id: "recovery"
      flow_role: "oily_water; sediment; spent_oil; oily_sorbent; waste_sling; cut_offcut"
      record_type: "foreground record"
      raw_fields: "specific waste; original/new source; amount; water/oil/solids composition; wet/dry basis; receiver; treatment; share"
      collection_method: "Measure each collected stream and custody; distinguish recovered customer property, retained original pollutant, operator waste and treated discharge."
      unit: "kg; m3"
      frequency: "each collection/transfer"
      temporal_coverage: "same declared task/reporting period"
      site_scope: "actual inland recovery site and assigned equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste manifests; sampling; receiver records"
    - protocol_id: cp_release
      process_id: "recovery"
      flow_role: "co2_air; co_air; no_air; no2_air; so2_air; pm25_air; benzene_water"
      record_type: "foreground record"
      raw_fields: "source/stage; baseline; actual species/fraction; fuel/exhaust or concentration/flow; actual receiving medium/waterbody/type/location; relevant salinity/hydrological evidence; flow-library compartment definition and LCIA mapping/applicability; retained/removed pollutant; evidence/factor units"
      collection_method: "Measure actual operator/incremental release or use explicit justified source/activity factors; separate pre-existing pollution. Match every release to its actual receiver and supported flow-library compartment under boundary_actual; record the mapping and LCIA applicability or unresolved gap. Use benzene_water only for supported freshwater reception, with separate specific rows for other receiving media. Unresolved mass-balance differences remain gaps."
      unit: "kg"
      frequency: "event/duty and task"
      temporal_coverage: "same declared task/reporting period"
      site_scope: "actual inland recovery site and assigned equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "baseline/discharge tests; mass balance; factor applicability; receiver characterization; documented compartment/LCIA mapping and limitations"
  calculation_rules:
    - id: task_denominator
      applies_to: "recovery_service"
      rule: "N = accepted completed recovery tasks of the exact initial-state/endpoint scope; require N positive. Component lifts and recovered tonnes do not increase task count."
      inputs:
        - cp_task
      output: "N"
      source_ids: []
    - id: exchange_allocation
      applies_to: "all inventory rows"
      rule: "Assign each measured numerator to actual stages/equipment and full task activity using documented physical drivers, then divide by N. Preserve failed attempts, standby and return."
      inputs:
        - cp_task
        - cp_energy
        - cp_material
        - cp_waste
      output: "exchange per reference flow"
      source_ids: []
    - id: asset_allocation
      applies_to: "boom; workboat; lift_bag; floating_crane; pump; diving_system; cutting_rig"
      rule: "Allocate production/maintenance/retirement by supported lifetime utilization and actual task share; keep shared pontoon/crane/boat boundaries and divide attributable quantity by N."
      inputs:
        - cp_asset
        - cp_task
      output: "asset share per reference flow"
      source_ids: []
    - id: source_release
      applies_to: "co2_air; co_air; no_air; no2_air; so2_air; pm25_air; benzene_water"
      rule: "Resolve each actual operator or incremental species/fraction release using source-specific measurement/balance or justified factors, separate background/casualty origin and captured mass, then divide attributable quantity by N. Do not turn recovered contamination into negative emissions."
      inputs:
        - cp_release
        - cp_waste
        - cp_task
      output: "species per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_object
      applies_to: "recovery_service"
      requirement: "Initial vessel/cargo identity and condition, inland geography and accepted recovery endpoint/custody are complete; standalone towing not silently selected."
      evidence: "cp_task"
    - id: dq_route
      applies_to: "all inventory rows"
      requirement: "Actual lifting/dewatering/diving/cutting route and energy/gas/equipment logs, not a universal salvage bill of materials or lifespan."
      evidence: "cp_energy; cp_material; cp_asset"
    - id: dq_pollution
      applies_to: "oily_water; sediment; benzene_water"
      requirement: "Pre-operation baseline and actual collected/released pollutant/species with evidenced receiving waterbodies/compartments. Record flow-library and LCIA mapping applicability, including unresolved inland brackish/saline-water cases; distinguish unknown from zero."
      evidence: "cp_waste; cp_release"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Flow/property/unit support must be verified before linked data production; archive count support is not fresh flow confirmation."
      evidence: "direct identity verification"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require identified inland vessel/cargo recovery, raising/righting/refloating endpoint; reject coastal scope, independent transport tow, public life rescue/police/fire and standalone shipbreaking/clean-up."
    source_ids:
      - un-cpc-67532
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique recovery_service at 1 item and positive N with actual initial condition/stages/equipment and signed handoff; no duplicate stage/whole-task or recovered-property production outputs."
    source_ids: []
  - rule_id: validate_release
    applies_to: "foreground_dataset_conformance"
    rule: "Require separate old-contamination and new-release evidence, each specific substance and actual receiving environment, supported flow-library compartment mapping and actual waste destination. Use the freshwater benzene card only for supported freshwater reception; require separate specific rows for other media. Reject freshwater inferred from inland classification or marine assignment inferred from salinity alone, assumed avoided pollution, scrap substitution and whole-oil-as-one-species shortcuts. Disclose unresolved compartment/LCIA coverage."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual source-linked fuel/gas/assets and full task-cycle allocation; unknown baseline, stage or treatment coverage is disclosed. A target check pass is not a safe salvage/diving/cutting approval."
    source_ids: []
  - rule_id: validate_unit_export
    applies_to: "foreground_dataset_conformance"
    rule: "Treat item only as the singular local alias of the formal Number of items unit Item(s). Export Item(s) with the same numerical count and the fully qualified service definition; changing the display token does not change the flow property, service extent or normalization denominator. Do not convert a service item to time, mass, distance or a different family by relabelling its unit, or normalize an already per-reference quantity again."
    source_ids: []
published_dataset_profile:
  dataset_role: "Unit-process inland vessel/cargo recovery task; narrower non-standalone-tow scope"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same actual recovery subtype, initial state, inland site conditions, equipment and accepted endpoint/custody boundary"
  excluded_use: "Independent towing; coastal/public rescue; generic per-vessel/tonne recovery factor; avoided pollution/steel credit; unqualified recycling"
  required_metadata: "All task qualifiers; N; stage duty/gases/energy; asset life; custody original ship/cargo; contamination baseline; waste receivers; actual receiving waterbody/type/location and relevant salinity/hydrological evidence; release measurements and documented flow-compartment/LCIA mapping or unresolved gaps"
  required_quality_disclosure: "Narrower scope and standalone-tow exclusion; UUID gaps; actual route/extent; baseline/new-release uncertainty; treatment and upstream omissions"
  update_trigger: "Initial casualty/river condition, recovery success endpoint, method/equipment, pollution baseline, supplier boundary or material data-quality change"
data_sources:
  - id: "un-cpc-67532"
    type: "official_guidance"
    reference: "UNSD CPC3.0 67532. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67532"
    used_for: "Unambiguous inland recovery/raising/righting/refloating scope and public-rescue exclusions; standalone towing not selected."
  - id: "usace-mcalpine-salvage"
    type: "official_guidance"
    reference: "USACE Louisville District, Salvage efforts to retrieve sunken barges continue at McAlpine Dam (2019). https://www.lrd.usace.army.mil/Media/News/Article/3637047/salvage-efforts-to-retrieve-sunken-barges-continue-at-mcalpine-dam/"
    used_for: "Observed inland staged recovery, cargo lightening, crane/cutting and variable river levels; case evidence only, no generic machinery count, fuel, yield or duration."
  - id: "hse-inland-diving"
    type: "official_guidance"
    reference: "HSE, Commercial diving projects inland/inshore, L104 second edition2014, official scope description. https://www.hse.gov.uk/pubns/books/l104.htm"
    used_for: "Inland commercial-diving applicability screening only; full code procedures, legal compliance and numeric gas/depth requirements not inferred."
  - id: "fao-water-areas"
    type: "official_guidance"
    reference: "FAO CWP Handbook of Fishery Statistics, Main water areas, Marine and inland waters, read 2026-10-26. https://www.fao.org/cwp-on-fishery-statistics/handbook/general-concepts/main-water-areas/en/"
    used_for: "Supports only the distinction between inland/marine geography and freshwater/saline conditions. This fisheries-statistics guidance does not define CPC applicability or an LCI/LCIA compartment, salinity threshold or characterization factor; actual receiver mapping still requires the declared flow-library and impact-method evidence."
