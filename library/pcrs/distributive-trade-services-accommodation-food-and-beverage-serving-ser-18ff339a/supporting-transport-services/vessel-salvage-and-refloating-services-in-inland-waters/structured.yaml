      rule: "Screen all actual energy, lifting/diving/cutting gas and materials, support movements, rigging/boom/asset shares, water/soil disturbance, each waste and species release. Add each present exchange atomically. For water releases, identify the actual receiving waterbody. Select each release compartment using the actual receiving environment, documented flow-library definitions and LCIA applicability. Inland service classification does not imply freshwater, and salinity alone does not establish a marine compartment for an inland lake. Preserve the physical receiver and measured release where compartment mapping or characterization remains unresolved; do not force freshwater/seawater or treat unknown impact as zero."
