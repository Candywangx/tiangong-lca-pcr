allocation_rules:
  - rule_id: allocate_subdivision
    applies_to: "foreground_burden_allocation"
    rule: "Prefer task-level fuel/energy metering and subdivide traction, approach, idle and auxiliary operation. Shared switcher operation is assigned using measured activity/load and documented causal drivers, not cargo revenue."
    source_ids: []
  - rule_id: allocate_complete_cycle
    applies_to: "foreground_burden_allocation"
    rule: "Include attributable failed moves, return positioning and common standby in the supported service population. Reconcile task shares to the same fleet/site totals; idle time is not burden-free."
    source_ids:
      - epa-rail-facility
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Attribute locomotive, track and replacement burdens using documented lifetime utilization and the task use share. Identify track maintenance and locomotive overhaul boundaries, with no assumed service life or automatic recycling benefit."
    source_ids: []
  - rule_id: allocate_regeneration
    applies_to: "foreground_burden_allocation"
    rule: "Record imported electricity and returned energy with separate meter evidence and receiving system. Do not net unverified regeneration or count electricity generated internally from diesel as an additional purchased input."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_task
      process_id: "push_tow"
      flow_role: "pushing_service"
      record_type: "task event log"
      raw_fields: "order; subtype; vehicle IDs; endpoints; submoves; tare/cargo/gross mass; distance; gradient; loaded/empty approach; start/finish; failures; acceptance"
      collection_method: "Reconcile signed task completion, consist manifest, dispatch log, calibrated mass evidence and odometry/GNSS; retain each constituent movement once."
      unit: "item"
      frequency: "each task"
      temporal_coverage: "complete declared operating period"
      site_scope: "identified yard/route and task configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed completion; task log; scale evidence; odometry calibration"
    - protocol_id: cp_energy
      process_id: "push_tow"
      flow_role: "diesel; traction_electricity"
      record_type: "meter and fuel balance"
      raw_fields: "locomotive/engine; fuel type; tank opening/closing; fuel deliveries; electricity import/export; traction/idle/auxiliary time; supply; task share"
      collection_method: "Use calibrated fuel-flow/tank balance and electrical meters including charging loss; reconcile traction states, auxiliary consumption and facility totals."
      unit: "kg; kWh"
      frequency: "meter interval and task"
      temporal_coverage: "same period as cp_task"
      site_scope: "actual locomotive/circuit and task cycle"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; fuel stock reconciliation; electricity invoices; state logs"
    - protocol_id: cp_material
      process_id: "push_tow"
      flow_role: "lubricant; coolant; urea_solution; water; sand"
      record_type: "material balance"
      raw_fields: "specific product; concentration; issue/return; opening/closing stock; service event; task share"
      collection_method: "Measure net material use, preserve formulation, and attribute maintenance/cleaning to actual operating activity."
      unit: "kg; m3"
      frequency: "each issue/service event"
      temporal_coverage: "same period as cp_task"
      site_scope: "assigned locomotive and operation"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock cards; invoices; supplier formulation; maintenance logs"
    - protocol_id: cp_asset
      process_id: "push_tow"
      flow_role: "diesel_locomotive; electric_locomotive; track_share"
      record_type: "asset service record"
      raw_fields: "asset ID; upstream boundary; lifetime evidence; utilization; task activity; maintenance; replacement; retirement"
      collection_method: "Link specific assets to upstream production and end-of-life inventories; document physical lifetime and actual utilization; prevent aggregate/component duplication."
      unit: "item; m"
      frequency: "asset event and period reconciliation"
      temporal_coverage: "evidenced life and operating period"
      site_scope: "actual locomotive and used track segment"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; maintenance/replacement records; supplier inventories"
    - protocol_id: cp_waste
      process_id: "push_tow"
      flow_role: "waste_oil; waste_coolant; wastewater; waste_filter"
      record_type: "waste transfer log"
      raw_fields: "specific waste; amount; composition; destination; treatment boundary; service period; share"
      collection_method: "Measure each waste, reconcile transfer documentation and treatment coverage; distinguish retained fluids from filter material."
      unit: "kg; m3"
      frequency: "each disposal event"
      temporal_coverage: "same period as cp_task"
      site_scope: "assigned locomotive and actual receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste manifest; receiver contract; composition evidence"
    - protocol_id: cp_emission
      process_id: "push_tow"
      flow_role: "co2_air; co_air; no_air; no2_air; so2_air; pm25_air"
      record_type: "exhaust measurement or documented calculation"
      raw_fields: "engine; fuel carbon/sulfur; measured exhaust; species; size fraction; duty/load; time; factor reference/version/units if used; task share"
      collection_method: "Use actual exhaust measurements or explicitly justified engine/fuel/duty factors; resolve species and overlapping fractions; never use legal limits as measured emissions."
      unit: "kg"
      frequency: "duty interval and task attribution"
      temporal_coverage: "same period as cp_task"
      site_scope: "named engine/task and receiving air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "measurement report; fuel assay; factor applicability; unit and load reconciliation"
  calculation_rules:
    - id: task_denominator
      applies_to: "pushing_service"
      rule: "Count completed independently specified task orders N for the declared equivalent configuration; N must be positive. Constituent pushes and wagons are task descriptors, not additional complete outputs."
      inputs:
        - cp_task
      output: "completed tasks N"
      source_ids: []
    - id: exchange_attribution
      applies_to: "all inventory rows"
      rule: "Attribute each measured exchange numerator to the same complete task boundary, then divide by positive N. Retain diesel/electric routes, empty approach and idle records; heterogeneous task configurations need distinct datasets or explicit activity distributions."
      inputs:
        - cp_task
        - cp_energy
        - cp_material
        - cp_waste
      output: "exchange amount per reference flow"
      source_ids: []
    - id: emission_attribution
      applies_to: "co2_air; co_air; no_air; no2_air; so2_air; pm25_air"
      rule: "Resolve actual species mass for each duty interval from measurement or the explicitly sourced factor and matching measured activity; sum only non-overlapping intervals and divide attributable amount by N. Do not invent factors or speciation shares."
      inputs:
        - cp_task
        - cp_emission
        - cp_energy
      output: "species mass per reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "diesel_locomotive; electric_locomotive; track_share"
      rule: "Assign upstream asset production, maintenance and retirement by documented lifetime utilization and task share, with separate component boundaries; divide the attributed inventory by N."
      inputs:
        - cp_task
        - cp_asset
      output: "asset share per reference flow"
      source_ids: []
