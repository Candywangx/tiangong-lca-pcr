measurement_rules:
  - id: storage_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Mass*time"
      uuid: "b3f0f892-c5a3-4c66-a432-c09e3d1e9bd6"
    required_unit: "tday"
    rule: "Use cp_storage and stock_time to integrate only eligible customer working-stock mass over elapsed custody time. Exclude dedicated cushion/base inventory and minimum operating heel irrespective of ownership; a customer working-stock heel remains included when supported by operating limits and delivery obligations. tday maps exactly to t*d. Normalize attributable exchanges once to one such reference flow."
  - id: density_basis
    applies_to: "storage_service"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Mass derived from liquid volume requires measured substance/batch density at recorded temperature and pressure. Gas volume additionally requires absolute pressure, temperature, composition and applicable compressibility. Never assume a generic oil/wine/gas density."
  - id: stock_reconciliation
    applies_to: "storage_service"
    required_property_ref:
      name: "Mass*time"
      uuid: ""
    required_unit: "tday"
    rule: "Maintain separate customer working-stock, dedicated support-stock and fuel ledgers. Reconcile opening stock plus receipts and documented role transfers against withdrawals, consumption, actual losses and closing stock; internal role transfers cancel in the facility balance and never place the same mass in both stock roles. Use operating limits and delivery obligations to justify classification, including any heel."
