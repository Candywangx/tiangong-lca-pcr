allocation_rules:
  - rule_id: allocate_direct
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide tanks, substance batches and operating regimes first. Assign receipt/withdrawal energy from actual transfers, holding energy from actual condition-maintenance activity, and shared support from measured causal utilization; reconcile the full facility total before stock-time normalization. Stock-time alone cannot represent pumping or vapor-control work."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use a persistent asset ledger for tank, pump, compressor and cavern. Allocate construction/manufacture and actual renewals by supported whole-life service utilization, with cycle and calendar limits disclosed. Period accounting distributes only the already attributed period share; cumulative shares across customers and periods may not exceed one or reset annually. Unknown life/denominator requires review and sensitivity."
    source_ids: []
  - rule_id: allocate_losses
    applies_to: "foreground_burden_allocation"
    rule: "Retain actual losses, capture and flare within the storage route. Customer commodity is not a service co-product. Exported recovered material requires actual identity, composition and measured quantity plus a justified allocation convention; do not claim avoided-production credit by default. Internal recovery retains its burden and creates no independent product output."
    source_ids: []
  - rule_id: allocate_provider
    applies_to: "foreground_burden_allocation"
    rule: "Remove any utilities, maintenance or assets already included in a supplier service inventory. Allocate empty-tank standby, cleaning and terminal support transparently across the supported storage service population; no default price-based split."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_storage
      process_id: "storage"
      flow_role: "storage_service"
      record_type: "Custody and stock-time ledger"
      raw_fields: "substance/batch; composition; mass timestamps; initial/final stock; receipts; withdrawals; losses; phase; temperature; pressure; density; heel/cushion inventory; actual gate timestamps"
      collection_method: "Use calibrated custody mass meters, weighing or calibrated level/volume with measured batch density. Gas conversion also records absolute pressure, temperature and applicable compressibility. Integrate actual inventory mass over elapsed custody time; resolve events sufficiently to represent filling and withdrawal. Reconcile material balance."
      unit: "tday"
      frequency: "every stock change plus justified monitoring intervals"
      temporal_coverage: "complete declared custody interval including partial days"
      site_scope: "declared tanks/vessels/caverns and all operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; stock records; measured density/composition; event timing; balance reconciliation"
    - protocol_id: cp_energy
      process_id: "storage"
      flow_role: "electricity; heat"
      record_type: "Energy meter and operation log"
      raw_fields: "separate kWh and MJ; supply; timestamps; pump/compressor/cooling/heating duty; standby; actual shared allocation"
      collection_method: "Meter each actual energy carrier separately. Assign transfer versus holding tasks by measured causal activity and preserve both original units."
      unit: "kWh; MJ"
      frequency: "each meter interval and transfer"
      temporal_coverage: "all actual included support and operation"
      site_scope: "declared storage facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; duty logs; supplier scope; facility totals"
    - protocol_id: cp_fuel
      process_id: "storage"
      flow_role: "methane_fuel"
      record_type: "Fuel component balance"
      raw_fields: "fuel mass; actual gas composition; pilot/heating duty; gas removed from stock; meter; stock difference"
      collection_method: "Meter actual supplied/consumed methane and each additional fuel component; distinguish stock withdrawal for fuel from commercial stored stock and reconcile carbon fate."
      unit: "kg"
      frequency: "each fuel issue/operating interval"
      temporal_coverage: "all actual onsite fuel use"
      site_scope: "actual heating and control equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel meters; composition analysis; stock records"
    - protocol_id: cp_material
      process_id: "storage"
      flow_role: "nitrogen; water; activated_carbon; lubricant"
      record_type: "Individual material ledger"
      raw_fields: "individual substance; supplied mass or volume; stock change; cleaning/control event; actual return/recovery"
      collection_method: "Measure each named material separately; record composition and any density conversion, reconcile reuse and stock change."
      unit: "kg; m3"
      frequency: "each supply/use and stock interval"
      temporal_coverage: "full actual service support"
      site_scope: "declared equipment and operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; calibrated meters/scales; stock and maintenance records"
    - protocol_id: cp_refrigerant
      process_id: "storage"
      flow_role: "ammonia_charge; ammonia_air"
      record_type: "Refrigerant-specific charge balance"
      raw_fields: "ammonia initial/final circuit charge; additions; recovery; disposal; repairs; measured loss"
      collection_method: "Reconcile each actual circuit charge and transfer; additions alone do not prove leakage. Assign verified loss to the specific chemical and air compartment; other refrigerants require separate records."
      unit: "kg"
      frequency: "each service event and monitoring period"
      temporal_coverage: "complete represented refrigeration operation"
      site_scope: "actual refrigeration circuit"
      aggregation_rule: "per reference flow"
      quality_evidence: "service records; charge weighing; leak tests; mass balance"
    - protocol_id: cp_assets
      process_id: "storage"
      flow_role: "tank_share; pump_share; compressor_share; cavern_share"
      record_type: "Persistent asset ledger"
      raw_fields: "asset ID/configuration; actual item or effective cavern m3; construction inventory; actual use; supported lifetime utilization; capacity constraints; prior cumulative fraction; current period share; renewals"
      collection_method: "Link actual manufacturing/construction inventory to a supported life-service denominator and persistent allocation ledger. Assign only the relevant observed period share, conserve lifetime fractions and report unsupported life estimates and sensitivity."
      unit: "Item(s); m3"
      frequency: "each allocation and asset update"
      temporal_coverage: "whole supported life with declared observation period"
      site_scope: "identified physical containment and equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/engineering records; utilization evidence; supported life; cumulative share reconciliation"
    - protocol_id: cp_waste
      process_id: "storage"
      flow_role: "spent_carbon; used_oil; tank_washwater"
      record_type: "Segregated waste transfer"
      raw_fields: "stream composition; individual kg or m3; event; storage scenario; recipient; treatment; actual regeneration"
      collection_method: "Weigh or meter each stream separately and identify contamination and treatment. Exclude captured substance counted again as an air release."
      unit: "kg; m3"
      frequency: "each actual transfer"
      temporal_coverage: "all attributable cleaning/maintenance"
      site_scope: "storage and treatment handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer tickets; composition; waste balance; treatment inventory"
    - protocol_id: cp_species
      process_id: "storage"
      flow_role: "methane_air; ethane_air; propane_air; butane_air; ethanol_air; benzene_air; toluene_air; hexane_air; fossil_co2; carbon_monoxide"
      record_type: "Component-specific fate ledger"
      raw_fields: "actual composition; vapor/air sampling; temperature; pressure; fill/withdrawal cycles; capture; return; vent; flare; oxidation/slip; pollutant species; mass; compartment; actual method applicability"
      collection_method: "Measure actual species releases or apply a reviewed method valid for the declared substance, phase and controls. Speciate vapor using valid observed or supported vapor composition; reconcile all destinations and control activity. EPA liquid guidance is not a blanket cryogenic-gas model."
      unit: "kg"
      frequency: "each event plus representative monitored interval"
      temporal_coverage: "routine, cleaning, abnormal and emergency events represented"
      site_scope: "all actual storage/control equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "species analysis; calibrated flow meters; method scope; fate/carbon balance; uncertainty"
  calculation_rules:
    - id: stock_time
      applies_to: "storage_service"
      rule: "Integrate actual stock mass in tonnes over elapsed days; the result is actual t*d storage activity. Use event-resolved or justified interpolated stock records and retain partial days. tday maps to t*d; no fixed occupancy or density."
      inputs:
        - cp_storage
        - "measured mass history"
        - "elapsed time"
      output: "tday activity"
      source_ids: []
    - id: service_normalization
      applies_to: "all inventory rows"
      rule: "Assign attributable actual exchanges to the represented homogeneous storage scenario, then divide by its measured stock-time activity. Retain all allocated support and losses. Reference output is exactly 1 tday."
      inputs:
        - cp_storage
        - "attributable exchange totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: component_fate
      applies_to: "methane_air; ethane_air; propane_air; butane_air; ethanol_air; benzene_air; toluene_air; hexane_air; fossil_co2; carbon_monoxide"
      rule: "Use species-specific measured composition and destination balances. Internal return is not release; captured material and destruction are not both emitted. Derive combustion products only from actual feed carbon and supported oxidation/slip, recording method and uncertainty."
      inputs:
        - cp_species
        - cp_fuel
        - "measured control performance"
      output: "individual chemical release per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_basis
      applies_to: "storage_service"
      requirement: "Require measured stock-time and composition/thermodynamic configuration. Distinguish throughput, capacity and actual custody mass; do not infer gas mass from unqualified standard volume."
      evidence: "cp_storage"
    - id: quality_species
      applies_to: "all inventory rows"
      requirement: "Identify every actual loss species and control fate; aggregated VOC/BOG remains unresolved until speciated. Record method applicability and uncertainty; no universal leak, flare or evaporation factor."
      evidence: "cp_species; epa-tanks-faq"
    - id: quality_assets
      applies_to: "tank_share; pump_share; compressor_share; cavern_share"
      requirement: "Support life/service denominator and conserved allocation ledger; unknown asset life or upstream inventory prevents a complete lifecycle claim."
      evidence: "cp_assets"
    - id: quality_representative
      applies_to: "all inventory rows"
      requirement: "Disclose facility, period, substance/phase, actual support coverage, extreme events, omissions and identity gaps. Do not transfer a liquid organic method to gas/cryogenic or inorganic scenarios without independent evidence."
      evidence: "cp_storage; cp_energy; cp_species"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique storage_service output equal to 1 tday, corresponding to one t*d of measured mass-time and explicit substance/conditions. Reject nominal capacity, throughput, billable time alone and unqualified volume as substitute denominator."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile custody stock, receipts, withdrawals, heel/cushion inventory and losses. Separate onsite consumed fuel, commodity production, liquefaction/regasification, transport and storage-only support without omissions or duplication."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Check every actual emission, vent/BOG route and control destination with component identities. Reject VOC, gases and boil-off-gas aggregate selected flows; do not assume zero loss or perfect flaring."
    source_ids:
      - epa-tanks-faq
  - rule_id: validate_lifecycle
    applies_to: "foreground_dataset_conformance"
    rule: "Check asset cumulative shares at most one, justified life/service denominators, actual upstream scope and provider overlap. Identity/measurement/factor gaps stay explicit; draft methodology and count checks are not publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "bulk_storage_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A specified bulk-storage stage of a traceable supply chain with compatible substance, phase, conditions and custody gates"
  excluded_use: "Complete commodity footprint; production liquefaction/regasification/transport; unqualified oil/wine/gas pooling; implied safety or methodology approval"
  required_metadata: "All reference qualifiers; measured stock-time; exact unit mapping; actual routes and species; asset/provider coverage; loss/replacement responsibility; upstream versions; allocation"
  required_quality_disclosure: "Identity and measurement gaps; vapor-method limits; unmeasured species/control efficiency; density uncertainty; asset life and missing upstream data"
  update_trigger: "Changed substance/composition/phase; temperature/pressure; containment; fill cycles; loss/control route; utility supply; asset life or custody scope"
