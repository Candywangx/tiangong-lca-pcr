allocation_rules:
  - rule_id: allocate_direct
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide tanks, substance batches and operating regimes first. Assign receipt/withdrawal energy from actual transfers, holding energy from actual condition-maintenance activity, and shared support from measured causal utilization; reconcile the full facility total before stock-time normalization. Stock-time alone cannot represent pumping or vapor-control work."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Use a persistent asset ledger for tank, pump, compressor and cavern. Allocate construction/manufacture and actual renewals by supported whole-life service utilization, with cycle and calendar limits disclosed. Period accounting distributes only the already attributed period share; cumulative shares across customers and periods may not exceed one or reset annually. Unknown life/denominator requires review and sensitivity."
    source_ids: []
  - rule_id: allocate_losses
    applies_to: "foreground_burden_allocation"
    rule: "Retain actual losses, capture and flare within the storage route. Customer commodity is not a service co-product. Exported recovered material requires actual identity, composition and measured quantity plus a justified allocation convention; do not claim avoided-production credit by default. Internal recovery retains its burden and creates no independent product output."
    source_ids: []
  - rule_id: allocate_provider
    applies_to: "foreground_burden_allocation"
    rule: "Remove any utilities, maintenance or assets already included in a supplier service inventory. Allocate empty-tank standby, cleaning and terminal support transparently across the supported storage service population; no default price-based split."
    source_ids: []
  - rule_id: allocate_fuel_supply
    applies_to: "foreground_burden_allocation"
    rule: "Include actual upstream fuel supply once and preserve its supplied product identity. For fuel transferred from customer custody stock, transfer the corresponding actual supply burden to the storage fuel account and record an equal removal from the customer's supply allocation; reconcile mass, source dataset and responsibility at the dataset interface. Fuel transferred from support stock is an internal use: its original acquisition remains in the support-stock ledger, and it creates no second external fuel-supply input. Record all actual fuel combustion and losses through cp_species. If the customer transfer or source identity is unproven, disclose the unresolved interface; do not assume a conventional gas or pure-component supply or claim a complete lifecycle result."
    source_ids: []
  - rule_id: allocate_support_inventory
    applies_to: "foreground_burden_allocation"
    rule: "Dedicated cushion/base inventory and minimum operating heel support the facility rather than increase customer working-stock service. Keep a persistent product-specific ledger separating initial/augmentation supply, in-situ retained stock, transfers, routine replacements, actual losses and retirement recovery. Allocate actual initial/augmentation supply burdens over the supported whole-life eligible working-stock time served by each supply cohort; conserve cumulative shares across periods/customers without annual reset. Assign routine loss-replacement supply to the actual responsible operating period once; do not count a replacement again as initial supply. In-situ retained stock is physical opening stock, not fictitious purchased or injected gas: include actual preparation, later injections and evidenced transferred prior burdens, and disclose missing provenance. Add actual support-product inputs/outputs separately by identity and link cp_support_inventory; remove quantities/burdens already included in customer, asset or supplier inventories. Retain actual losses, internal fuel use and recovery/disposal operations; report actual recovered-product or waste quantities and ownership at retirement under allocate_losses, with no credit for anticipated recovery, no automatic reversal of initial supply and no unsupported avoided-production credit. Absence of a purchase does not establish zero upstream burdens: actual later extraction, fuel use or export of in-situ stock must record the relevant resource-acquisition/production boundary, real quantity and supporting evidence."
    source_ids:
      - eia-storage-basics
dataset_production:
  collection_protocols:
    - protocol_id: cp_storage
      process_id: "storage"
      flow_role: "storage_service"
      record_type: "Separate custody, support-stock and stock-time ledgers"
      raw_fields: "substance/batch; composition; customer working-stock and dedicated support-stock mass timestamps; ownership and delivery obligations; technical minimum inventory; opening/final stocks; receipts; withdrawals; losses; role transfers and timestamps; phase; temperature; pressure; density; actual gate timestamps"
      collection_method: "Use calibrated custody mass meters, weighing or calibrated level/volume with measured batch density. Gas conversion also records absolute pressure, temperature and applicable compressibility. Classify stock using operating limits and delivery obligations; integrate only eligible customer working-stock mass. Record cushion/base and minimum operating heel separately, and identify any customer working-stock heel that remains eligible. Resolve filling, withdrawal and role-transfer events; reconcile each ledger and the facility total."
      unit: "tday"
      frequency: "every stock change plus justified monitoring intervals"
      temporal_coverage: "complete declared custody interval including partial days"
      site_scope: "declared tanks/vessels/caverns and all operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; stock records; measured density/composition; event timing; operating limits; delivery contracts; balance reconciliation"
    - protocol_id: cp_energy
      process_id: "storage"
      flow_role: "electricity; heat"
      record_type: "Energy meter and operation log"
      raw_fields: "separate kWh and MJ; supply; timestamps; pump/compressor/cooling/heating duty; standby; actual shared allocation"
      collection_method: "Meter each actual energy carrier separately. Assign transfer versus holding tasks by measured causal activity and preserve both original units."
      unit: "kWh; MJ"
      frequency: "each meter interval and transfer"
      temporal_coverage: "all actual included support and operation"
      site_scope: "declared storage facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters; duty logs; supplier scope; facility totals"
    - protocol_id: cp_fuel
      process_id: "storage"
      flow_role: "methane_fuel; natural_gas_fuel"
      record_type: "Actual supplied-fuel product and responsibility ledger"
      raw_fields: "fuel product and source dataset; supplied/used mass; composition and heating-value basis; phase and delivery temperature/pressure; supply gate; pilot/heating duty; opening/closing fuel stock; custody/support-stock withdrawals; transfers; combustion and non-combustion losses; customer/supplier upstream burden transfer"
      collection_method: "Meter and reconcile use of each actual supplied fuel product separately. Preserve natural gas as its specified product; component mass, energy and carbon records are calculation data, not additional constituent product inputs. Reconcile customer withdrawals with matched upstream responsibility transfers and support-stock withdrawals with their already recorded acquisition under allocate_fuel_supply. Separate internal use from new external supply, exclude purchased-heat overlap and reconcile actual carbon fate. Apply fuel_product_balance to distinguish physical fuel use from attributable supply, and pass the unnormalized period quantity to service_normalization."
      unit: "kg"
      frequency: "each fuel issue/operating interval"
      temporal_coverage: "all actual onsite fuel use"
      site_scope: "actual heating and control equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel meters; supplier/product specification; composition analysis; heating-value basis; stock records; upstream dataset and matched responsibility-transfer records"
    - protocol_id: cp_material
      process_id: "storage"
      flow_role: "nitrogen; water; activated_carbon; lubricant"
      record_type: "Individual material ledger"
      raw_fields: "individual substance; supplied mass or volume; stock change; cleaning/control event; actual return/recovery"
      collection_method: "Measure each named material separately; record composition and any density conversion, reconcile reuse and stock change."
      unit: "kg; m3"
      frequency: "each supply/use and stock interval"
      temporal_coverage: "full actual service support"
      site_scope: "declared equipment and operators"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; calibrated meters/scales; stock and maintenance records"
    - protocol_id: cp_refrigerant
      process_id: "storage"
      flow_role: "ammonia_charge; ammonia_air"
      record_type: "Refrigerant-specific charge balance"
      raw_fields: "ammonia initial/final circuit charge; additions; recovery; disposal; repairs; measured loss"
      collection_method: "Reconcile each actual circuit charge and transfer; additions alone do not prove leakage. Assign verified loss to the specific chemical and air compartment; other refrigerants require separate records."
      unit: "kg"
      frequency: "each service event and monitoring period"
      temporal_coverage: "complete represented refrigeration operation"
      site_scope: "actual refrigeration circuit"
      aggregation_rule: "per reference flow"
      quality_evidence: "service records; charge weighing; leak tests; mass balance"
    - protocol_id: cp_assets
      process_id: "storage"
      flow_role: "tank_share; pump_share; compressor_share; cavern_share"
      record_type: "Persistent asset ledger"
      raw_fields: "asset ID/configuration; actual item or effective cavern m3; construction inventory; actual use; supported lifetime utilization; capacity constraints; prior cumulative fraction; current period share; renewals"
      collection_method: "Link actual manufacturing/construction inventory to a supported life-service denominator and persistent allocation ledger. Assign only the relevant observed period share, conserve lifetime fractions and report unsupported life estimates and sensitivity."
      unit: "Item(s); m3"
      frequency: "each allocation and asset update"
      temporal_coverage: "whole supported life with declared observation period"
      site_scope: "identified physical containment and equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/engineering records; utilization evidence; supported life; cumulative share reconciliation"
    - protocol_id: cp_support_inventory
      process_id: "storage"
      flow_role: "storage_service"
      record_type: "Persistent support-stock supply and burden ledger"
      raw_fields: "actual product/composition and delivery state; inventory role and technical minimum; origin as purchased/injected, in-situ retained or documented transfer; initial/augmentation cohort mass and dates; actual upstream scope; routine replacement mass and responsibility; opening/closing stock; actual losses and internal fuel use; recovery/disposal destination and ownership; supported lifetime working-stock time; period working-stock time; prior/current allocation fractions; customer/asset/supplier overlap; cohort closure date; actual completed lifetime service; acquired, allocated, transferred and residual supply burdens"
      collection_method: "Reconcile physical stock separately from attributed upstream quantities. Each actual support-product supply/export requires its own identified card linked to this protocol; no generic support-gas collection card. Preserve provenance, responsibility and upstream transfers; apply support_inventory_attribution without inventing supply for in-situ stock. Collect actual retirement recovery rather than presumed future credit. This protocol supports storage_service and creates no additional reference output."
      unit: "kg; tday"
      frequency: "each supply, role transfer, replacement, allocation update and retirement event"
      temporal_coverage: "supported whole life with declared observation period"
      site_scope: "identified containment and actual support stocks"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier and injection records; technical minimum and origin records; contracts and matched transfers; stock/loss balances; supported life-service denominator; cumulative allocation ledger; actual recovery/disposal records; cohort-closure reconciliation"
    - protocol_id: cp_waste
      process_id: "storage"
      flow_role: "spent_carbon; used_oil; tank_washwater"
      record_type: "Segregated waste transfer"
      raw_fields: "stream composition; individual kg or m3; event; storage scenario; recipient; treatment; actual regeneration"
      collection_method: "Weigh or meter each stream separately and identify contamination and treatment. Exclude captured substance counted again as an air release."
      unit: "kg; m3"
      frequency: "each actual transfer"
      temporal_coverage: "all attributable cleaning/maintenance"
      site_scope: "storage and treatment handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer tickets; composition; waste balance; treatment inventory"
    - protocol_id: cp_species
      process_id: "storage"
      flow_role: "methane_air; ethane_air; propane_air; butane_air; ethanol_air; benzene_air; toluene_air; hexane_air; fossil_co2; carbon_monoxide"
      record_type: "Component-specific fate ledger"
      raw_fields: "actual composition; vapor/air sampling; temperature; pressure; fill/withdrawal cycles; capture; return; vent; flare; oxidation/slip; pollutant species; mass; compartment; actual method applicability"
      collection_method: "Measure actual species releases or apply a reviewed method valid for the declared substance, phase and controls. Speciate vapor using valid observed or supported vapor composition; reconcile all destinations and control activity. EPA liquid guidance is not a blanket cryogenic-gas model."
      unit: "kg"
      frequency: "each event plus representative monitored interval"
      temporal_coverage: "routine, cleaning, abnormal and emergency events represented"
      site_scope: "all actual storage/control equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "species analysis; calibrated flow meters; method scope; fate/carbon balance; uncertainty"
  calculation_rules:
    - id: stock_time
      applies_to: "storage_service"
      rule: "S = sum(M_work,j * delta_t_j), using eligible customer working-stock mass M_work,j in tonnes and elapsed time delta_t_j in days; use justified integration/interpolation for varying mass. Exclude dedicated cushion/base inventory and minimum operating heel irrespective of ownership; retain customer working-stock heel supported by delivery obligations and technical limits. Apply role changes only from documented timestamps, never count both roles, and retain partial days. tday maps to t*d; no fixed occupancy or density. S must be positive for normalization; allocate idle support to the evidenced served population under allocate_provider rather than inventing storage output."
      inputs:
        - cp_storage
        - "separate stock histories"
        - "operating limits"
        - "delivery obligations"
        - "elapsed time"
      output: "eligible working-stock tday activity"
      source_ids:
        - eia-storage-basics
    - id: service_normalization
      applies_to: "all inventory rows"
      rule: "Assign actual exchanges and the period share of initial/augmentation support supply to the represented homogeneous storage scenario, then divide once by its positive eligible working-stock time S from stock_time. Retain all allocated operating support, actual losses and applicable replacements; dedicated support-stock mass never enters S. Reference output is exactly 1 tday."
      inputs:
        - cp_storage
        - cp_support_inventory
        - "attributable exchange totals"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: component_fate
      applies_to: "methane_air; ethane_air; propane_air; butane_air; ethanol_air; benzene_air; toluene_air; hexane_air; fossil_co2; carbon_monoxide"
      rule: "Use species-specific measured composition and destination balances. Internal return is not release; captured material and destruction are not both emitted. Derive combustion products only from actual feed carbon and supported oxidation/slip, recording method and uncertainty."
      inputs:
        - cp_species
        - cp_fuel
        - "measured control performance"
      output: "individual chemical release per reference flow"
      source_ids: []
    - id: fuel_product_balance
      applies_to: "methane_fuel; natural_gas_fuel"
      rule: "For each actual product, physical fuel use equals opening fuel stock plus receipts and documented stock-to-fuel transfers, less closing fuel stock and non-fuel transfers; reconcile this use with combustion and actual fuel losses. The fuel-product supply input excludes internal support-stock transfers whose acquisition is already attributed under cp_support_inventory, but their actual combustion/losses remain in cp_species. Include customer-stock transfers only with the matched upstream responsibility treatment in allocate_fuel_supply. Composition fractions reconcile mass, energy, carbon and releases; they create neither pure-product purchases nor additional mixture inputs. Pass the attributable period fuel-product supply total to service_normalization; do not divide in this rule."
      inputs:
        - cp_fuel
        - cp_storage
        - "cp_support_inventory where applicable"
        - "actual product supply records"
      output: "attributable period fuel-product quantity in kg, reconciled with total physical fuel use"
      source_ids: []
    - id: support_inventory_attribution
      applies_to: "actual named support-product input rows"
      rule: "For each product, Q_support,p = sum(Q_c * f_c,p) + Q_replace,p. Q_c is actual initial/augmentation supply or evidenced burden-bearing transfer for cohort c, excluding fictitious supply for in-situ retained stock; f_c,p = S_c,p / S_c,life uses evidenced period and whole-life eligible working-stock time supported by that cohort. Conserve cumulative f_c,p at most one; revise supported life with the persistent ledger without resetting prior allocations. Q_replace,p is actual routine replacement assigned to period p under documented responsibility, not already in Q_c or a supplier/customer inventory. Divide Q_support,p by S only in service_normalization. Keep physical stock changes, actual emissions, internal fuel use and retirement recovery separate; initial stock mass is not annual consumption, additions are not proof of leakage and recovery is not an automatic negative input. Missing provenance or lifetime denominator remains a gap, not a default quantity. At actual cohort closure, reconcile the full initial/augmentation acquisition burden to cumulative storage-service allocations plus any evidenced allocation to actual recovered outputs under allocate_losses. Assign any unallocated remainder to the evidenced completed service population, preserving the allocation ledger; do not park it in hypothetical future service, cancel it against expected recovery or invent a positive denominator. If the closure cannot be evidenced, retain an explicit gap and withhold a complete-lifecycle claim."
      inputs:
        - cp_support_inventory
        - cp_storage
        - "supported lifetime service and responsibility records"
      output: "attributed period support-product quantity in kg with physical-stock reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: quality_basis
      applies_to: "storage_service"
      requirement: "Require measured eligible working-stock time and composition/thermodynamic configuration. Evidence the boundary between customer working stock and dedicated operating support, including heel classification and role transfers. Distinguish throughput, capacity and physical total stock; do not infer gas mass from unqualified standard volume. Require support-stock source and lifetime-allocation evidence where applicable; unknown support acquisition or life-service denominator prevents a complete lifecycle claim."
      evidence: "cp_storage; cp_support_inventory"
    - id: quality_species
      applies_to: "all inventory rows"
      requirement: "Identify every actual loss species and control fate; aggregated VOC/BOG remains unresolved until speciated. Record method applicability and uncertainty; no universal leak, flare or evaporation factor."
      evidence: "cp_species; epa-tanks-faq"
    - id: quality_assets
      applies_to: "tank_share; pump_share; compressor_share; cavern_share"
      requirement: "Support life/service denominator and conserved allocation ledger; unknown asset life or upstream inventory prevents a complete lifecycle claim."
      evidence: "cp_assets"
    - id: quality_representative
      applies_to: "all inventory rows"
      requirement: "Disclose facility, period, substance/phase, actual support coverage, extreme events, omissions and identity gaps. Do not transfer a liquid organic method to gas/cryogenic or inorganic scenarios without independent evidence."
      evidence: "cp_storage; cp_energy; cp_species"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique storage_service output equal to 1 tday, corresponding to one t*d of measured eligible customer working-stock time and explicit substance/conditions. Reject dedicated cushion/base inventory or minimum operating heel in the denominator, and reject excluding a qualifying customer working-stock heel solely by name. Reject nominal capacity, throughput, billable time alone, nonpositive S and unqualified volume as substitute denominators."
    source_ids:
      - eia-storage-basics
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile customer working stock, dedicated support stock and fuel separately and then to the facility total, including receipts, withdrawals, role transfers and actual losses. Verify operating-limit and delivery evidence for cushion/heel classification. Separate onsite fuel, commodity production, liquefaction/regasification, transport and storage-only support without omissions or duplication."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Check every actual emission, vent/BOG route and control destination with component identities. Reject VOC, gases and boil-off-gas aggregate labels as selected elementary release flows; do not assume zero loss or perfect flaring. A specified actual mixture product may remain a product input, but neither constituent calculations nor an aggregate observation creates an additional supply exchange."
    source_ids:
      - epa-tanks-faq
  - rule_id: validate_lifecycle
    applies_to: "foreground_dataset_conformance"
    rule: "Check asset cumulative shares at most one, justified life/service denominators, actual upstream scope and provider overlap. Identity/measurement/factor gaps stay explicit; draft methodology and count checks are not publication approval."
    source_ids: []
  - rule_id: validate_fuel_support
    applies_to: "foreground_dataset_conformance"
    rule: "Verify methane_fuel is an actually supplied methane product and natural_gas_fuel retains its actual mixture product identity, composition, delivery state and supply scope. Reject mixture-plus-constituent supply duplication, assumed pure-component substitutes and fuel already included in purchased heat. Verify matched customer upstream responsibility transfers and reconcile internal support-stock fuel use with its original acquisition rather than a second supply input; retain an explicit gap where evidence is missing. For support inventory require actual product-specific cards, cp_support_inventory and supported initial/augmentation lifetime shares with cumulative fractions at most one; distinguish routine replacements, in-situ stock and actual retirement quantities. Reject fictitious initial purchases, annual recharge of the whole support stock, duplicate supplier/asset/customer burdens, assumed leakage from additions and unsupported recovery/avoided-production credits. Require full acquisition-burden reconciliation for closed cohorts."
    source_ids: []
  - rule_id: validate_unit_export
    applies_to: "foreground_dataset_conformance"
    rule: "Treat tday only as the local display alias of the formal Mass*time unit t*d: 1 tday = 1 t*d. Export the formal unit t*d, retaining the same physical quantity and reference denominator. If a receiving system requires the unit-group reference kg*a, apply the verified unit-group conversion once and retain its factor and provenance; never relabel an unchanged number as kg*a or normalize an already per-reference quantity again."
    source_ids: []
published_dataset_profile:
  dataset_role: "bulk_storage_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A specified bulk-storage stage of a traceable supply chain with compatible substance, phase, conditions and custody gates"
  excluded_use: "Complete commodity footprint; production liquefaction/regasification/transport; unqualified oil/wine/gas pooling; implied safety or methodology approval"
  required_metadata: "All reference qualifiers; measured eligible working-stock time; support-stock exclusion and heel-classification evidence; exact unit mapping; actual fuel products and matched upstream responsibility transfers; actual routes and species; asset/provider coverage; support-stock origin, lifetime allocation and retirement ledger; loss/replacement responsibility; upstream versions; allocation"
  required_quality_disclosure: "Identity and measurement gaps; vapor-method limits; unmeasured species/control efficiency; density uncertainty; asset life and missing upstream data"
  update_trigger: "Changed substance/composition/phase; temperature/pressure; containment; fill cycles; loss/control route; utility supply; asset life or custody scope"
data_sources:
  - id: "un-cpc-bulk-storage"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 code 67220 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/67220"
    used_for: "Bulk liquid and gas storage including oil/products/wine; classification scope only, no mass-time denominator or factors"
  - id: "epa-tanks-faq"
    type: "official_guidance"
    reference: "US EPA AP-42 Chapter 7: TANKS Software Frequent Questions, heated tanks, speciated emissions, nitrogen blanket, controls, cleaning and variable liquids; current web statement read 2026-10-23. https://www.epa.gov/air-emissions-factors-and-quantification/ap-42-chapter-7-tanks-software-frequent-questions"
    used_for: "Organic-liquid vapor properties/composition and controls require explicit conditions; no quantitative factor, gas/cryogenic model or generic zero-loss claim adopted"
  - id: "eia-storage-basics"
    type: "official_guidance"
    reference: "US Energy Information Administration, The Basics of Underground Natural Gas Storage. https://www.eia.gov/naturalgas/storage/basics/"
    used_for: "Supports the distinction between working gas and base/cushion gas retained for operation. The eligible-working-stock denominator, liquid-heel treatment and upstream/lifetime allocation rules are explicit PCR method choices, not EIA LCA prescriptions; no default inventory ratio, lifetime or emission factor is adopted"
