system_boundary:
  rules:
    - rule_id: boundary_storage
      applies_to: "foreground_system_boundary"
      rule: "Include actual acceptance, storage, withdrawal, meters, standby, pressure/temperature maintenance, vapor recovery and attributable cleaning/maintenance; separate production liquefaction and downstream regasification."
      source_ids:
        - un-cpc-bulk-storage
    - rule_id: boundary_vapors
      applies_to: "foreground_system_boundary"
      rule: "Screen tank heating, actual composition, changing levels, nitrogen blanket, vapor controls and cleaning. Use chemical-specific data; EPA organic-liquid guidance does not establish cryogenic-gas losses or universal control performance."
      source_ids:
        - epa-tanks-faq
    - rule_id: boundary_fate
      applies_to: "foreground_system_boundary"
      rule: "Trace each actual component from generation to capture, internal return, product export, flare and atmosphere. Internal boil-off return is not an exported product or elementary release. Only actual residual component discharge enters an air row; flare CO2 and unburned methane are separate."
      source_ids: []
    - rule_id: boundary_complete
      applies_to: "foreground_system_boundary"
      rule: "Screen actual refrigerants, chemicals, fuels, maintenance wastes and storage-specific assets. Add every present exchange individually; unknown composition, loss or asset denominator is a declared gap rather than zero."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing bulk substance accepted at storage gate and installed containment; inherited commodity production is outside the storage-only service while actual utilities and assets retain upstream burdens"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Bulk liquids and gases storage, with composition/conditions-specific datasets"
  recursive_input_rule: "Subcontracted storage enters once with defined stock-time and complete upstream scope; remove overlapping owned utilities/assets. Internal transfers within one custody boundary do not create another full storage output."
  upstream_dataset_requirement: "Actual electricity/heat/fuel, nitrogen, water, chemical, tank/pump/compressor/cavern construction and waste-treatment inventories appropriate to the declared scenario"
  disclosure: "Actual gates, stock-time population, fill/empty operations, conditioning, heel/cushion inventory, losses, species, provider/asset boundaries, upstream omissions and conversion exclusions"
