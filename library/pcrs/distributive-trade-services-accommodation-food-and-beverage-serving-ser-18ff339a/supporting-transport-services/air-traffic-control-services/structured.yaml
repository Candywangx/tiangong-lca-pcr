            ranges: []
allocation_rules:
  - rule_id: allocate_subdivision
    applies_to: "foreground_burden_allocation"
    rule: "Prefer circuit/function/position/sensor subdivision; shared airport or control-center assets and utilities require documented measured function/time/capacity drivers. Never assign the whole en-route network to local tower blocks."
    source_ids: []
  - rule_id: allocate_duration
    applies_to: "foreground_burden_allocation"
    rule: "Within one compatible configuration/coverage condition, allocate actual period inventory to delivered blocks B; keep redundancy, low-traffic standby, maintenance and backup tests as real service-support burdens. Traffic distribution remains explicit."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate building/radar/IT/radio/UPS/cooling manufacture and disposal using supported physical service life and utilization; replacements and initial batteries/gas already inside upstream inventories are not counted again."
    source_ids: []
  - rule_id: allocate_gas
    applies_to: "foreground_burden_allocation"
    rule: "Separate gas recovered or transferred from atmospheric loss; no automatic avoided leakage or battery recycling credit."
    source_ids:
      - epa-gas-balance
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "control"
      flow_role: "control_block"
      record_type: "foreground record"
      raw_fields: "facility/functions/coverage; actual staffed/available interval; delivered minutes; arrivals/departures/transits; traffic mix; outage/degradation; acceptance"
      collection_method: "Verify actual operating and traffic logs with function/handoff boundaries; split configuration/degraded changes and record delivered minutes, without asserting legal/safety approval."
      unit: "item"
      frequency: "service interval and period"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "operating/traffic logs; timestamp and coverage reconciliation"
    - protocol_id: cp_energy
      process_id: "control"
      flow_role: "electricity; diesel"
      record_type: "foreground record"
      raw_fields: "meter/circuit; imports; UPS/cooling losses; generator fuel stock/flow; actual run/test; allocation; supply"
      collection_method: "Use calibrated actual electricity and fuel measurements; reconcile function/period totals and no double count of internal generation."
      unit: "kWh; kg"
      frequency: "meter and backup event"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; fuel/test logs"
    - protocol_id: cp_material
      process_id: "control"
      flow_role: "water; engine_oil"
      record_type: "foreground record"
      raw_fields: "specific product; issue/return; stock; consumption; generator/cooling source; share"
      collection_method: "Reconcile actual net material/water consumption to supported maintenance/utility operations, separating recirculated water."
      unit: "kg; m3"
      frequency: "issue/period balance"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and meter records; service coverage"
    - protocol_id: cp_gas
      process_id: "control"
      flow_role: "r134a_input; sf6_input; r134a_air; sf6_air"
      record_type: "foreground record"
      raw_fields: "species; opening/closing cylinder stock; acquisitions; offsite/recovery transfers; actual equipment charge start/end; task/function share"
      collection_method: "Weigh/reconcile each actual gas stock, equipment charge and transfers; avoid double counting service-contractor charge from site stock; purchases are not emissions."
      unit: "kg"
      frequency: "each transfer and period boundary"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "cylinder/service/recovery records; complete balance"
    - protocol_id: cp_asset
      process_id: "control"
      flow_role: "server; radio; tower_building; chiller; radar_asset; ups; lead_battery; lfp_battery; generator"
      record_type: "foreground record"
      raw_fields: "asset/configuration; capacity; manufacture; battery/gas/component coverage; actual utilization; lifetime; replacement/retirement"
      collection_method: "Bind actual installed assets to upstream inventories with documented physical life and function/time use; distinguish hardware, initial charges and replacements."
      unit: "item; m2"
      frequency: "asset event and period"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; maintenance/replacement logs; life evidence"
    - protocol_id: cp_waste
      process_id: "control"
      flow_role: "waste_server; waste_lead; waste_lfp; spent_oil; wastewater"
      record_type: "foreground record"
      raw_fields: "specific waste; capacity/chemistry/composition; amount; receiver/treatment; period/share"
      collection_method: "Measure each waste and verify actual receiving treatment; distinguish chemistry and same-capacity battery units; treatment counted once."
      unit: "item; kg; m3"
      frequency: "each transfer"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste/recycling receipts; composition; receiver boundary"
    - protocol_id: cp_emission
      process_id: "control"
      flow_role: "co2_air; co_air; no_air; no2_air; pm25_air"
      record_type: "foreground record"
      raw_fields: "actual generator/fuel; run/test/load; species/fraction; exhaust measurement or explicit factor/version/unit; allocation"
      collection_method: "Measure or use explicitly justified actual engine/fuel/duty factors; resolve individual species/PM fractions and exclude aircraft exhaust."
      unit: "kg"
      frequency: "backup duty and period"
      temporal_coverage: "same declared service/reporting period"
      site_scope: "identified facility/function allocation"
      aggregation_rule: "per reference flow"
      quality_evidence: "fuel/exhaust tests; factor applicability; units audit"
  calculation_rules:
    - id: block_denominator
      applies_to: "control_block"
      rule: "B = actual delivered minutes /60 within compatible stated configuration and coverage; B must be positive. Retain fractional blocks and actual traffic/availability records."
      inputs:
        - cp_service
      output: "B"
      source_ids: []
    - id: exchange_allocation
      applies_to: "all inventory rows"
      rule: "Attribute each measured period numerator by documented facility/function physical shares, then divide by B. Preserve shared standby, redundancy, maintenance and tests; no automatic per-aircraft denominator."
      inputs:
        - cp_service
        - cp_energy
        - cp_material
        - cp_waste
      output: "exchange per reference flow"
      source_ids: []
    - id: gas_loss
      applies_to: "r134a_air; sf6_air"
      rule: "For each actual gas, loss = opening stored stock + acquisitions + opening equipment charge - closing stored stock - offsite transfers - closing equipment charge. Recovery remains in closing stock or an offsite transfer once; investigate negative/unreconciled balances, then allocate actual function share and divide by B."
      inputs:
        - cp_gas
        - cp_service
      output: "gas loss per reference flow"
      source_ids:
        - epa-gas-balance
    - id: asset_allocation
      applies_to: "server; radio; tower_building; chiller; radar_asset; ups; lead_battery; lfp_battery; generator"
      rule: "Allocate upstream asset manufacturing/replacement/retirement by supported physical life and actual function/time utilization, then the period share per B; no default battery replacement cycle."
      inputs:
        - cp_asset
        - cp_service
      output: "asset share per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_function
      applies_to: "control_block"
      requirement: "Actual block duration, functions/coverage, traffic mix and degraded status complete; same sixty minutes does not establish cross-facility equivalence."
      evidence: "cp_service"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Match metering, backup tests, maintenance, gas balances and delivered periods; reconcile shared supplier/airport totals."
      evidence: "cp_energy; cp_gas; cp_asset"
    - id: dq_gases
      applies_to: "r134a_air; sf6_air"
      requirement: "Species and stock/equipment/recovery evidence complete; unknown loss is not zero, and added charge is not automatically atmospheric release."
      evidence: "cp_gas"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve flow/support identities before linked production; archived count support is not fresh product-flow verification."
      evidence: "direct identity verification"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require airport tower-control or airport-located radar function; exclude navigation-aid67990 and unreviewed extension to whole en-route service."
    source_ids:
      - un-cpc-67620
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique control_block at 1 item, fixed sixty-minute definition, positive delivered B and all functions/traffic/coverage/availability qualifiers. Reject unavailable intervals counted as normal output and per-flight equivalence without a separate explicit model."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "foreground_dataset_conformance"
    rule: "Require each fuel, gas, battery chemistry, hardware, waste and emitted species independently; balance refrigerant/insulating stock and recovery, and avoid duplicate installed gas/initial batteries."
    source_ids: []
  - rule_id: validate_limits
    applies_to: "foreground_dataset_conformance"
    rule: "Disclose actual standby/backup/cooling, lifetime allocations and upstream gaps; a PCR check cannot establish ATC safety certification, operational approval or aircraft emission savings."
    source_ids: []
published_dataset_profile:
  dataset_role: "Unit-process airport tower/radar service block"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same qualified function configuration, sixty-minute block definition, coverage, traffic/availability condition and supplier/asset boundaries"
  excluded_use: "Universal per-flight factor; radio-navigation aid; all en-route ATC; airline operation; safety approval or avoided aircraft-fuel credit"
  required_metadata: "All block qualifiers; delivered B/minutes and traffic; equipment/circuit map; backup/gas/battery records; lifetime and shared-function allocations"
  required_quality_disclosure: "UUID gaps; coverage/traffic distribution; degraded/outage treatment; gas/backup uncertainties; asset/supplier overlap; upstream omissions"
  update_trigger: "Facility/function/coverage or traffic regime change; equipment/radar relocation; power/cooling/gas/battery change; asset life or data-quality change"
