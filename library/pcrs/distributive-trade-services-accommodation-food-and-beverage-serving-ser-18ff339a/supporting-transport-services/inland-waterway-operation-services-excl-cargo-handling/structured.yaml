  calculation_rules:
    - id: calc_service
      applies_to: "all inventory rows"
      rule: "Attribute actual measured period exchanges to the declared accepted service subtype and extent, applying documented shared-function and event attribution. Divide matched comparable totals by accepted events; do not convert availability periods to passages without actual evidence."
      inputs:
        - cp_service
        - "actual functional records"
      output: "per reference flow"
      source_ids: []
    - id: calc_water
      applies_to: "river_water; returned_water"
      rule: "Reconcile external inflow, external return, storage changes, evaporation and other actual losses, recording internal lock transfers and reuse separately. Report basin/time-specific withdrawal and return, not a default net consumptive volume."
      inputs:
        - cp_water
        - cp_service
      output: "volume per reference flow"
      source_ids:
        - crt-water-management
    - id: calc_sediment
      applies_to: "riverbed_sediment; dredged_sediment; suspended_sediment"
      rule: "Use measured solids fraction to separate sediment dry mass and slurry water; reconcile in-situ removal with managed outputs, stock and actual suspended release. Contaminant releases require each measured species and compartment separately."
      inputs:
        - cp_sediment
        - cp_service
      output: "dry-solid mass per reference flow"
      source_ids: []
    - id: calc_assets
      applies_to: "concrete; steel; lock_drive; boat_lift; tractor; locomotive; buoy; light_vessel; dredger"
      rule: "Apply supported lifetime-use and actual navigation-use shares to construction/manufacture/retirement inventory; reconcile components and normalized current service attribution. Unknown future use or life remains an explicit review gap."
      inputs:
        - cp_assets
        - cp_service
      output: "asset share per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_extent
      applies_to: "navigation_output"
      requirement: "Require reach, service subtype, passage/interval, vessel/traffic and delivered navigation condition; a fee or generic kilometre is insufficient."
      evidence: "cp_service"
    - id: dq_water
      applies_to: "river_water; returned_water"
      requirement: "Document source/return basin, timing and water quality; distinguish internal transfer, withdrawal and consumption."
      evidence: "cp_water"
    - id: dq_sediment
      applies_to: "riverbed_sediment; dredged_sediment; suspended_sediment"
      requirement: "Characterize actual solids and destination; no assumed clean sediment, generic disposal factor or default beneficial use."
      evidence: "cp_sediment"
    - id: dq_multiuse
      applies_to: "all inventory rows"
      requirement: "Require supported navigation versus other-function shares and actual life/utilization evidence, with uncertainty/sensitivity and upstream omissions."
      evidence: "functional records; cp_assets"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify exact flow/property/unit and Chinese name before adoption. Each missing UUID remains individual; parser success does not prove water/sediment identity or complete ecological coverage."
      evidence: "Direct support and unresolved register"
validation_rules:
  - rule_id: validate_service
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique navigation_output of 1 item with complete declared subtype/extent, navigation quality and interval. Reject freight tonne-km and undefined lock/pass counts as substitutes."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm all selected inland operation/maintenance routes, including non-tugboat towpath traction. Exclude cargo handling, warehousing, docking pilotage/tugs and customer vessel fuel/exhaust from this service."
    source_ids:
      - un-cpc3-67512
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile water and sediment balances, actual shared-lock attribution, navigation/other-purpose allocation and infrastructure lifetime shares. Missing identity, emission, upstream or habitat-impact evidence must remain disclosed before a complete lifecycle claim."
    source_ids: []
  - rule_id: validate_unit_export
    applies_to: "foreground_dataset_conformance"
    rule: "Treat item only as the singular local alias of the formal Number of items unit Item(s). Export Item(s) with the same numerical count and the fully qualified service definition; changing the display token does not change the flow property, service extent or normalization denominator. Do not convert a service item to time, mass, distance or a different family by relabelling its unit, or normalize an already per-reference quantity again."
    source_ids: []
