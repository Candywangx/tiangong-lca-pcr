allocation_rules:
  - rule_id: allocation_direct
    applies_to: "foreground_burden_allocation"
    rule: "Directly meter and attribute lock/lift, pump, traction, aid and dredging tasks first. Shared lockages require actual vessel/occupancy and operating evidence; do not assign a whole chamber cycle separately to every vessel."
    source_ids: []
  - rule_id: allocation_multiuse
    applies_to: "foreground_burden_allocation"
    rule: "Separate navigation from hydropower, flood management, irrigation and recreation using causal engineering/operation evidence. Do not split by revenue or grant avoided-electricity credits by default; justify residual allocation and sensitivity."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate actual infrastructure/equipment manufacture and retirement over supported lifetime service utilization and current actual service share. Reconcile construction/replacement and complete-asset/component scope; cumulative shares cannot exceed one full life."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "foreground_burden_allocation"
    rule: "Keep passage-based and accepted maintenance/availability-period events separate. Traffic-based attribution needs actual traffic and service quality; retain standby, navigation closures and unsuccessful work attributable to maintained service. Do not divide by an invented future vessel count."
    source_ids: []
  - rule_id: allocation_sediment
    applies_to: "foreground_burden_allocation"
    rule: "Dredged material is a managed physical stream, not a default co-product. Keep dry solids, carrier water, managed output and actual suspended release reconciled; independently justify any beneficial-use/product route without automatic substitution credit."
    source_ids:
      - epa-inland-sediment
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "navigation"
      flow_role: "navigation_output"
      record_type: "service_event_record"
      raw_fields: "event ID; subtype; reach/asset; vessel/traffic extent; draft/load; route length; water level; lockages; shore traction; aid condition; accepted interval; completion"
      collection_method: "Reconcile actual passage/lock/traction records or independently contracted maintenance/availability acceptance; keep complete event stages and actual served extent."
      unit: "item"
      frequency: "each event and period"
      temporal_coverage: "full declared service interval"
      site_scope: "one declared subtype/reach scenario"
      aggregation_rule: "per reference flow"
      quality_evidence: "traffic/lock logs; surveys; acceptance"
    - protocol_id: cp_energy
      process_id: "navigation"
      flow_role: "electricity; diesel"
      record_type: "energy_record"
      raw_fields: "meter/fuel; asset; task; operating/idle hours; power source; lock/pump/traction/dredging/aids; stock changes"
      collection_method: "Measure separate actual functional energy and reconcile supplier/stock records; isolate customer-vessel energy and shared non-navigation functions."
      unit: "row unit"
      frequency: "matched task and billing period"
      temporal_coverage: "same period as cp_service"
      site_scope: "operator assets and declared support"
