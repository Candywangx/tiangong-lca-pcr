system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all inventory rows"
      rule: "Apply only to own-account distribution of chemically undosed liquid-water heating through a declared closed supply/return mains network with specified delivered network asset inputs. Exclude steam, chilled water, cooled air, chemically dosed/glycol networks, heat production and fee/contract distribution under CPC 86340; these routes are not equivalent per MJ."
      source_ids:
        - un-cpc-69220
    - rule_id: boundary_gates
      applies_to: "distribution_network"
      rule: "Start at source-to-network paired supply/return heat meters after heat production. End at the operator/customer paired supply/return heat-exchange meters and contractual acceptance gate. Include operator pipes, pumps, controls, stations, losses, makeup and drainage; exclude customer internal heating after that gate. Record owner, geography, stations, meter positions, configuration and period before collection."
      source_ids: []
    - rule_id: commodity_complement
      applies_to: "replacement_heat; heat_distribution_service"
      rule: "The consuming model must add Q_source_accepted / Q MJ of useful source heat commodity separately, using the matching upstream datasets by interval and opening-stock origin; this need not be 1 MJ because accounted electrical heat can contribute useful delivery. This service inventories only additional Q_source_extra / Q source commodity and all auxiliary electricity. Do not combine with delivered heat already containing this network or its loss replacement. Consolidate internal zone transfers and do not recursively purchase this service."
      source_ids: []
    - rule_id: foreground_scope
      applies_to: "all inventory rows"
      rule: "Foreground starts at supplied-asset/material acceptance and the source-to-network paired heat-meter gate, includes owned water-loop operation and actual onsite installation/maintenance, and ends at customer acceptance, actual environmental release or signed waste/return handover. Supplier manufacture, mining, upstream delivery transport, supporting vehicle/road/tool capital and off-site waste-receiver processing are background; no paired receiver input or assumed post-handover release belongs here. Actual onsite treatment, if present, requires a precisely described process and its actual exchanges before a complete dataset, never inferred from an off-site receiver."
      source_ids: []
    - rule_id: contract_overlap
      applies_to: "all inventory rows"
      rule: "Retain a few specific delivered pipe/equipment inputs plus independently supplied site materials at their acceptance gates. Record one primary quantity/unit, exact specifications, included installation/drive/sensors/initial fluids and accepted quantity. If a supply includes a component, power, water, delivery or maintenance, do not also buy the same included exchange; separately metered onsite work beyond that supply gate is included once. No generic lifecycle service and no constituent/supplier-process decomposition of a complete purchased object. Dry equipment and separately supplied initial fill are explicit here; any actual wet-supply deviation must reconcile included water before use."
      source_ids: []
    - rule_id: waste_fate
      applies_to: "drained_water; site_work; water_to_soil; water_to_freshwater"
      rule: "Waste carrier inventory ends at actual documented site handover, with quantities limited to actual handover allocated to the original responsible cohort; generated-but-unhanded-over mass stays measured site-stock QA, not a handover exchange; no off-site treatment reagents/energy/emissions are foreground. Record whole carrier once, composition and residual thermal energy as metadata; do not also emit its contained constituents or heat at that handover. Direct releases use the first actual operator-to-environment interface, separately by substance/medium; soil and freshwater shares are mutually exclusive per parcel. Later environmental migration or receiver discharge is not another network release. Unknown handover identity or actual route blocks complete foreground evidence, not a reason to invent receiver processes."
      source_ids: []
