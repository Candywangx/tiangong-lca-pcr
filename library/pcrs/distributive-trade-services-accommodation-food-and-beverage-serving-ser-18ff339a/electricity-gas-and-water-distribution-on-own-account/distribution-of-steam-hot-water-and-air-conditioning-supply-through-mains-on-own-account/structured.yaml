      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For source correction before retirement use each original cohort accepted fraction g_c; at final retirement use g_c=w_c. Q_s,new is the evidenced FULL source quantity before allocation in its original card unit, not a remaining unallocated balance or a previously weighted amount. B_s,c is the actual previously booked attributed raw quantity for that source/cohort, with its quantity/model version and previous normalized result. Calculate A_s,c,new=Q_s,new*g_c and delta_A_s,c=A_s,c,new-B_s,c. A newly observed source has B=0 where unposted; a correction to an existing source replaces that source ID, not an additional purchase or disposal event. The shortcut (g_new-F_booked)*Q_s is valid only when the source quantity and linked model version are unchanged and B=F_booked*Q_s; otherwise use A_new-B. Reconcile physical gross receipt/stock/transfer/handover separately; signed corrections are model amendments, never negative physical exchanges or substitution credits. For a changed linked supply/treatment model, replace the affected original-cohort inventory/results even if delta_A=0; remove the previous model contribution and record both versions and scope."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_normalization
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Normalize the complete revised attributed amount once by the original cohort current verified reference denominator N_c (Q, D or A as locally named). If N_c itself changes, replace the complete old normalized result; do not add delta_A/new_N to a result based on old_N. Zero-output events retain their already prescribed causal parent; a parent without positive N_c retains raw attributed totals and an incomplete normalized result, never shifts to an unrelated positive-output period."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_scope
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Apply this to each actual capital-origin source covered by the existing gates, including separately counted initial fill, post-acceptance capital-site events and actual retirement carriers where present; do not create new sources, extend background boundaries, duplicate included supply stages or apply lifetime fractions to routine operation. These are explicit candidate accounting rules, not claimed numerical requirements of the cited classification or technical sources."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: quality_metering
      applies_to: "all inventory rows"
      requirement: "Retain synchronized raw meter data, calibration, range validity, composition/property version and uncertainty for all heat, electricity and water measurements. No invented conversion factor or numeric default is permitted; meter/supplier certificates do not establish legal compliance by this PCR."
      evidence: "cp_heat; cp_energy; cp_water records and certificates"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Confirm one object, role, state, direction, property, unit and receiving medium per card. A candidate with no confirmed UUID stays unbound and may support methodology discussion only; a publishable dataset needs verified exact identity or a documented governed identity-resolution decision, never an invented UUID or commodity-for-service substitution."
      evidence: "direct-read identity payload and hash receipt; manifest unresolved registry"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Screen each zone/site task for operation, standby, rejects/losses, leaks/drains, water/heat stocks, actual asset delivery/replacement, onsite energy/cleaning/lubrication and waste handover. Prove occurrence/absence from logs/inspection, without supplier-material lists or speculative off-site emissions. Dosing/other thermal routes still require reviewed extension; actual new foreground objects need specific cards/protocols. One property/unit does not permit combining independent objects merely sharing that unit."
      evidence: "site asset maps, work orders, meters, signed handovers and completeness matrix"
    - id: quality_missing
      applies_to: "all inventory rows"
      requirement: "Unknown readings, composition, UUIDs, physical supplier gates or receiver fates are not zero. Retain an explicit gap, quantify uncertainty with a documented substitute only when defensible and flag its scope; otherwise completion is inconclusive. Never treat estimates, examples or instrument tolerances as default compliance limits."
      evidence: "gap register; substitute evidence; uncertainty assessment; failed-check list"
    - id: quality_cohort
      applies_to: "all inventory rows"
      requirement: "Require accepted Q, all raw exchanges and stock/waste-handover carry ledgers to share the same service cohort. Keep rejected/returned heat separate, retain incident investigation and reject reasons, and reconcile source-to-customer heat and water balances within justified combined measurement uncertainty. A nonclosing balance is investigated and blocks an unqualified complete result. Require immutable original asset/source/cohort keys, all-beneficiary actual capacity-hour totals and source-specific booked shares. At final retirement reconcile sum(w)=1 and each governed correction against original Q_k, including negative corrections without negative physical-flow credits; unknown or nonpositive denominators block unit-reference results."
      evidence: "cohort ledger; accepted/rejected meters; stock/waste-handover carry records; uncertainty calculation"
    - id: quality_bilingual
      applies_to: "all inventory rows"
      requirement: "Maintain the same ordered row IDs, formulae, units, protocol references, exceptions, official names and constraint strength in both languages. Verify actual parsed projection content including boundary, quality and calculation rules; a schema/fingerprint or localization marker does not approve scientific correctness."
      evidence: "bilingual semantic comparison and actual generated guidance comparison"
    - id: inv_site_emissions
      applies_to: "site_air_co2_fossil; site_air_co2_biogenic; site_air_co; site_air_ch4; site_air_n2o; site_air_no; site_air_no2; site_air_so2; site_air_pm25; site_air_pmcoarse"
      requirement: "Conditional on actual onsite fuel/task occurrence and substance evidence; record directly measured mass or actual fuel/activity times a source-specific factor in its original mass/energy basis, not supplier emissions. Each substance/destination enters once; preserve origin, calibration/factor scope and uncertainty."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: validate_custody_balance
    applies_to: "original-cohort waste custody and actual losses"
    rule: "Verify custody_mass_balance and custody_loss_link with dated original-lot stocks, actual handover receipts, paired movements, calibrated loss evidence and propagated uncertainty. Distinguish evidenced L from unexplained epsilon and block unqualified completion for unresolved quantities, identity or fate. Verify that G=10, H=9, L=1 with other terms zero closes, H stays 9, each release appears once at its first medium, and allocation/normalization does not alter raw physical closure."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "heat_distribution_service"
    rule: "Require Q > 0, 1 MJ reference service, accepted customer supply/return gate pairs, declared thermal quality and no credit for rejected, reworked or circulating heat. Do not equate different route or quality levels by energy alone."
    source_ids: []
  - rule_id: validate_thermal_reference
    applies_to: "all thermal carrier, stock and origin calculations"
    rule: "Verify thermal_reference and thermal_reference_history before any source-heat or electricity allocation. Repeat the same recorded physical case with a nonzero constant c added to every raw h, raw u and its implementation reference C_j; all canonical carrier energies, stocks, heat-meter differences, P, origin shares, Q_source_accepted, Q_source_extra, electrical carry and normalized amounts must remain unchanged within documented numerical tolerance. Also test nonzero carrier intake/drainage, unequal opening/closing water mass and historical source/electrical stocks; verify mass and energy closure separately. Reject an alternate physical reference state, separate h/u zeros, retaining old fractions after rebaselining, or a zero-filled opening provenance. The test changes representation only, never measured operation or a physical temperature; a passing energy balance alone does not prove correct allocation."
    source_ids:
      - iapws-water-energy-reference-2018
  - rule_id: validate_heat_release
    applies_to: "heat_to_air; heat_to_soil; heat_to_freshwater; drained_water"
    rule: "Check carrier_release_heat and heat_fates against measured event records before normalization. Independently close network energy on full canonical carrier enthalpy and environmental thermal loads on receiver-relative differences; verify each H_out = H_receiver_base + E_excess and all disjoint event totals. Recompute equal-temperature/equal-pressure, warmer-liquid release, nonzero numerical enthalpy-offset conversion, changed receiver temperature, split soil/freshwater parcels and waste-handover cases. Equal states must yield zero excess heat without removing water mass; changing receiver temperature must change only the direct-release thermal-load calculation, not the recorded network energy/origin balance. Waste handover yields no direct foreground heat. Missing receiver evidence or unresolved/cooling signs must remain incomplete, not zero or negative-credit flows. Verify compatible eventual UUID quantity meaning and that already measured pipe/rejection/electrical heat is not rebaselined or counted twice."
    source_ids:
      - epa-nccw-thermal-load
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Before normalization verify heat_meter, carrier_thermal_inflow, pump_fluid_energy, heat_balance, heat_fates, water_balance, makeup_allocation and waste_cohort on raw totals. Check fixed thermal datum and carrier inlet enthalpy, independent pump control-volume measurement and 0 <= W_to_fluid <= E_pump_MJ, complete three-origin stock history, batch FIFO and initial-fill asset coverage; investigate residuals, never infer pump/carrier heat from the whole-network residual."
    source_ids: []
  - rule_id: validate_overlap
    applies_to: "all inventory rows"
    rule: "Check commodity_complement, asset_service, site_activity, site_fuel_emissions and makeup_allocation; source commodity, delivered assets, initial fill, FIFO makeup and onsite tasks each once. Every card has exactly one primary property/unit. Waste ends at handover, with no supplier manufacture/transport/support-capital or off-site receiver-treatment cards; unperformed background obligations cannot masquerade as current foreground quantities. Verify freeze-and-remaining-balance life revisions and final all-original-cohort w/delta corrections, source-specific zero prior booking for newly observed carriers, and original positive Q_k. Reject a last-cohort residual charge, second initial-fill/FIFO water burden, or allocation correction added to physical QA."
    source_ids: []
  - rule_id: validate_capital_amendment
    applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
    rule: "Verify the original driver, freeze/remaining ledger, actual final w, each source full Q_s/B/version, original N and whole normalized-result replacement under capital_source_amendment. Recalculate unchanged-quantity share corrections, changed quantity with unchanged share, changed model with zero physical delta, corrected original N and zero-output cases; verify mutually exclusive capital/recurring components and all beneficiaries. Missing traceable old postings or positive denominators remains incomplete; prohibit disposal-year fallback, negative physical flows, duplicate normalization or second shares."
    source_ids: []
  - rule_id: validate_completion
    applies_to: "all inventory rows"
    rule: "Report performed/skipped checks, findings, uncertainty, unbound identity and foreground completeness separately. Unbound reference, unknown actual handover, nonclosing operational cohort or absent specified equipment acceptance quantity blocks unqualified foreground completion. Disclose background linking separately; complete foreground does not mean full-lifecycle completion, methodology approval or publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Distribution-only service complement"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only declared undosed-water own-account heating foreground; separately add Q_source_accepted / Q useful source heat and later link backgrounds at explicit supply/handover gates without duplication"
  excluded_use: "Standalone delivered heat/heat generation, other thermal routes, whole-CPC-leaf coverage or treating this foreground inventory as a complete lifecycle model"
  required_metadata: "Original reference qualifiers, raw totals/Q, three thermal-origin pools and stocks, actual equipment specification/acceptance and single property/unit, original-asset allocation, onsite tasks, supplier inclusions and actual waste handover; mandatory IAPWS-95 energy reference, property offsets, reconstructed opening provenance and invariance evidence Receiver-state observations, canonical carrier-energy versus excess-thermal-load reconciliation, compatible heat-flow quantity meaning and validate_heat_release evidence."
  required_quality_disclosure: "Foreground check coverage, uncertainty, loss/rejection, handover receiver, actual first environmental medium, identity gaps and separate background-linking state"
  update_trigger: "Changes in route, foreground gate, delivered-equipment specification/inclusions, heat source/water composition, onsite task, meter or evidence"
data_sources:
  - id: "un-cpc-69220"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC 3.0 subclass 69220, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/69220"
    used_for: "Classification scope only: own-account steam/hot-water/cooled-air/chilled-water distribution; excludes fee/contract service. Does not endorse this narrower method."
  - id: "oiml-heat-meters-2002"
    type: "standard"
    reference: "OIML R 75-1:2002, Heat meters, Part 1, section 8 and Annex A, https://www.oiml.org/en/files/pdf_r/r075-1-e02.pdf"
    used_for: "Historical technical basis for liquid heat metering by mass flow and matched supply/return enthalpy difference; no numeric water-property, instrument tolerance or regulatory compliance default. Other boundary, collection and accounting requirements are declared foreground method choices in this PCR."
  - id: "logstor-steel-insulated-pipes-2024"
    type: "literature"
    reference: "LOGSTOR, Steel insulated pipes EPD-LOG-20240214-CBA3-EN, issued 3 September 2024, Product section, https://ibudata.lca-data.com/resource/processes/40693bdd-19e6-4ff5-8c89-1c2f5e5f1b3d/epd?version=00.01.000"
    used_for: "Supports a specified whole insulated pipe as a concrete supplied object with carrier/insulation/jacket configuration; no case dimensions, material percentages, life, factors or recycling credits adopted. Foreground scope and single primary property/unit are PCR method choices directed by the user, not mandates of this EPD."
  - id: "iapws-water-energy-reference-2018"
    type: "official_guidance"
    reference: "IAPWS R6-95(2018), Revised Release on the IAPWS Formulation 1995 for the Thermodynamic Properties of Ordinary Water Substance for General and Scientific Use, section 3, equations (7)-(8). https://iapws.org/technical-guidance/release/IAPWS-95"
    used_for: "Supports the saturated-liquid triple-point internal-energy convention and the distinction between enthalpy and internal energy. This PCR mandates conversion to that convention; proportional LCA allocation, stock-origin attribution and uncertainty/completion rules are authored candidate choices, not IAPWS prescriptions or operating defaults."
  - id: "epa-nccw-thermal-load"
    type: "official_guidance"
    reference: "US EPA, Noncontact Cooling Water General Permit, Attachment B: Example Engineering and Dilution Factor Calculations, pages 2-4. https://www.epa.gov/system/files/documents/2025-11/nccw-final-gp-2024-attachment-b-dilution-factors.pdf"
    used_for: "Supports distinguishing receiving-water thermal effects from total carrier energy using physical temperature differences. The receiver-relative LCI load convention, soil comparator, collection/completion rules and source attribution here are authored candidate choices; no permit limits, default heat capacity, temperatures or mixing/dilution assumptions are adopted."
