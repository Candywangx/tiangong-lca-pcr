allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "Separate unrelated supply zones, heating/cooling services and heat production using direct submeters and asset ownership records first. Attribute dedicated inputs directly. For inseparable network burdens serving accepted hot-water heating only, use that network cohort total divided by accepted Q; rejected delivery and technical losses remain burdens of the accepted service and receive no reference output or credit."
    source_ids: []
  - rule_id: shared_assets
    applies_to: "all inventory rows"
    rule: "Subdivide actual tasks and direct submeter/issue records first. For shared onsite grid electricity without adequate task submeters, use verified device operating/standby power times actual hours in each state: W_b = sum_device,state(P_verified_kW * h_actual_b), s_b = W_b / sum_all_beneficiaries(W_b); attribute the measured common-meter kWh by s_b once and reconcile the complete load/state schedule to that meter, including standby and all beneficiaries. Use measured/validated actual-state power, not unverified nameplate assumptions. For shared recurring materials and onsite work, use the same source work order service-attributable actual personnel hours divided by actual personnel hours of all beneficiaries of that work order; record role/task and complete denominator. Shared recurring site releases inherit exactly the allocation of their measured source material/fuel/task, using that work-order personnel-hour fraction when the source is not directly subdivided; never apply an additional emission share. Operating pumps use actual branch electricity submeters first; only without them allocate by measured branch hydraulic energy divided by the all-branch hydraulic-energy total over the same reconciled interval. Keep cp_pump independent calorimetry unchanged, include starts/stops/standby in the complete reporting intervals, and withhold completion if a required denominator is zero/unknown or a common standby burden cannot be assigned by this positive measured interval basis. No later choice between these drivers. One-off capital site events use only their original asset_service alpha once: quantities already attributed by alpha or direct task subdivision receive no extra personnel-hour, electricity or beneficiary multiplier."
    source_ids: []
  - rule_id: stock_cohort
    applies_to: "all inventory rows"
    rule: "Measure opening/closing thermal and water stocks. Assign stored heat and water burdens to the cohort that later consumes or releases them, with an explicit carry ledger; do not charge current accepted service for stock additions or credit it for opening stock without carrying corresponding upstream burdens. Internally reworked or recirculated heat earns no second reference service; account once at its final accepted gate or final rejected fate."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_heat
      process_id: "distribution_network"
      flow_role: "heat quantity, acceptance and physical heat fate"
      record_type: "meter and acceptance records"
      raw_fields: "interval timestamp; source/customer meter ID; mass or volume; matched supply/return temperature and pressure; water composition; enthalpy/property-method version; accepted/rejected flag and reason; Q_in; Q; Q_reject; delta_U; heat-fate records; actual W_to_fluid and out-of-circuit electrical dissipation; signed G_ambient; Q_carrier_loss; opening electrical/source provenance ledger; U_open, U_close and U_open_source; pool thermal datum; interval source/electrical/carrier origin shares and uncertainty; fixed h0 and reference state; measured makeup/initial-fill temperature/pressure/composition; H_carrier_in; internal-energy property method and raw mass/state; gate kinetic/potential and storage proof; IAPWS-95 triple-point reference identity; property implementation/version; raw h and u; C_j; canonical h_c and u_c; reference conversion and composition-applicability evidence; chronological origin reconstruction; previous datum and versioned original-cohort amendments; nonzero-offset invariance test and numerical tolerance For each direct liquid-release event: parcel ID and mass; first-interface medium; simultaneous outlet and undisturbed receiver temperatures; interface pressure; composition and liquid-phase evidence; raw and canonical water enthalpies at both states; H_out; H_receiver_base; E_excess; uncertainty and event reconciliation; direct-transfer metering/model and non-overlap ledger."
      collection_method: "Read calibrated paired heat meters at both gates over synchronized intervals; retain raw readings and validated calculator method, signed acceptance and bypass/rejection logs. Derive receiver-specific heat transfer from meter/model reconciliation, declare ground/air/water receiver and thermal reference state; investigate residuals. Apply thermal_reference and thermal_reference_history before aggregation; preserve raw and converted properties, the common h/u offset and reconstructed historical origins. Validate the nonzero-offset test in validate_thermal_reference and retain its calculation records. Measure outlet temperature at the operator/environment interface and background freshwater upstream/outside the plume at matching depth/time; for soil use an unaffected adjacent control at the same depth with representative moisture/thermal conditions. Log continuously through a release or use a documented representative event sampling design with propagated uncertainty; resolve changes before aggregation. Use calibrated temperature/pressure and mass/flow instruments, actual water-property evaluation, named operator responsibility and retained raw logs. Unrepresentative or missing receiver measurements leave the release incomplete. Apply carrier_release_heat and validate_heat_release; do not adopt a default ambient temperature or heat capacity."
      unit: "MJ; kg; m3; degC; Pa; kJ/kg"
      frequency: "each meter interval and every rejection event"
      temporal_coverage: "one declared full reporting period covering heating/standby and matched opening/closing stocks"
      site_scope: "source/customer gates and all owned network zones"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration certificates; time synchronization; enthalpy method validation; acceptance signatures; uncertainty and balance reconciliation; validate_thermal_reference"
    - protocol_id: cp_energy
      process_id: "distribution_network"
      flow_role: "auxiliary electricity"
      record_type: "meter record"
      raw_fields: "meter ID; opening/closing kWh; interval; pump/control assignment; shared-function duty; supplier-gate/stage register; W_to_fluid; current electrical-heat closing carry; drawdown of historical electrical heat and its original-cohort electricity burden  ; branch electricity-submeter coverage; same-interval measured hydraulic energy for each branch and all-branch total; start/stop/standby coverage; denominator and applicability gap"
      collection_method: "Read calibrated electricity submeters and reconcile to invoices; subtract only evidenced non-network functions or supplier-gate/stage overlap, never heat production by guesswork.  For branch allocation use actual electricity submeters first; only if absent use same-interval measured hydraulic-energy shares; never choose another driver when the denominator is zero/unknown."
      unit: "kWh"
      frequency: "each electricity interval; monthly reconciliation"
      temporal_coverage: "same period as cp_heat"
      site_scope: "all network pumps, controls, meters and owned stations"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; invoice cross-check; causal share worksheet; no overlap"
    - protocol_id: cp_water
      process_id: "distribution_network"
      flow_role: "makeup, drainage, leaked water and constituents"
      record_type: "mass meter, tank stock and event record"
      raw_fields: "supplier and actual waste-handover receiver; demineralized undosed state; batch masses; density and conditions for volume conversion; opening/closing network and waste stocks; drainage generated/dispatched; leak location/duration/rate; receiver medium; water fraction and dissolved species; custody notes  ; original batch receipt timestamp and immutable ID; initial-fill/operational/returnable-stock class; S_open_b, I_b, R_supplier_b, D_b, L_b, S_close_b by batch; original supplier burden and frozen allocations; actual retirement FIFO withdrawal/supplier return and final positive-Q amendment; separate supplier-receipt and actual thermal-circuit injection mass/state/time and intervening conditioning screen ; immutable event ID, released parcel/share and first operator-to-environment interface with soil/freshwater receiver evidence; subsequent migration separately marked environmental fate; initial-origin versus operational-origin retirement carrier; source-specific prior water-supply/waste postings and original Q_k; capital initial-fill final w and correction links;; custody_lot_id; custody_pool_id; O; G; T_in; C; H; T_out; L; epsilon; movement_endpoints; loss_event_ID; loss_time_location; loss_evidence_method; first_medium; release_row_id; propagated_uncertainty"
      collection_method: "Use calibrated makeup/drain meters or weighed tanks and leak investigation logs; measure composition by representative samples and documented methods; trace generated drainage batch to signed foreground handover even if handed over later. Determine zero events by inspections, work orders and meter reconciliation, not an empty cell. Apply the explicit makeup_allocation FIFO convention to batch withdrawals and unallocated supply burdens, checking initial fill against initial_fill_water physical inventory. Keep physical FIFO mass QA separate from supply/waste attribution. Initial-fill and initial-origin capital handover use asset_service final shares and source-specific original-cohort corrections; operational water retains its original FIFO responsibility without another capital fraction. For custody_mass_balance and custody_loss_link, retain calibrated event/stock measurements, matched composition/density and original lot; investigate each loss or residual at the actual location, link its release row and paired movements, and reconcile monthly and at interval end. Record absence only with dated inspection/measurement coverage; unknown is not zero."
      unit: "kg; m3; kg/m3; mass fraction"
      frequency: "each batch/drain/leak event; monthly stock reconciliation; each loss event and stock movement"
      temporal_coverage: "same generation cohort as accepted Q plus documented later waste handover"
      site_scope: "whole closed loop, drains, tanks, waste handover and actual first receiving media"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; certificates of analysis; stock balance; receiver and handover receipt; unknown-fate register"
    - protocol_id: cp_pump
      process_id: "distribution_network"
      flow_role: "independent pump energy delivered to fluid"
      record_type: "synchronized pump control-volume, shaft and external-calorimetry record"
      raw_fields: "module/meter ID; calibration; interval time; inlet/outlet massflow, temperature, pressure, enthalpy, diameter, velocity and elevation; motor/drive supply; torque/speed; casing/motor/drive outward heat flux; actual load/speed/temperature loss map; opening/closing fluid/dry-module mass, thermal state and storage; uncertainty; other-energy and external-mechanical-work screening  ; heat-flux integration surface area m2 and elapsed seconds; state-matched measured or traceable property density kg/m3; original rotational-speed unit and single conversion record"
      collection_method: "Instrument every pump with independent calibrated massflow, paired temperature/pressure, supply and heat-flux meters; use validated water properties for inlet/outlet enthalpy flux and kinetic/potential corrections, independently reconciling electrical supply minus outside-fluid losses and storage; validate loss maps at actual conditions including starts/stops/standby, never substitute the whole-network residual or nameplate efficiency"
      unit: "kg/s; degC; Pa; kJ/kg; kg/m3; m/s; m; m2; s; kWh; MJ; N*m; rad/s; W/m2"
      frequency: "each synchronized pumping interval and start/stop event; monthly independent energy reconciliation; aggregate to measured comparable dry-module boundary thermal states"
      temporal_coverage: "same period as cp_heat including module opening/closing states"
      site_scope: "every declared network electric pump/drive module, without heat exchangers or other energy sources in that control volume"
      aggregation_rule: "per reference flow"
      quality_evidence: "flow/state/supply/heat-flux calibration; complete raw records; calorimetry/loss-map validation; shaft/hydraulic checks; 0 <= W_to_fluid <= E_pump_MJ and combined-uncertainty reconciliation"
    - protocol_id: cp_assets
      process_id: "site_work"
      flow_role: "specified delivered assets and initial fill"
      record_type: "site measurement, handover and task record"
      raw_fields: "original asset/configuration key; supplier and site receipt gate; model and serial; pipe axial length; counted-object definition; accepted item count; delivered inclusions and dry/wet status; initial-fill batch kg; commissioning/date; rated capacity and measured beneficiary duty; actual availability hours; all-beneficiary lifetime capacity-hours and engineering evidence; frozen prior quantities/fractions; remaining quantity; revision/retirement true-up; Q; revision date/version; original beneficiary-period cohort IDs and positive Q_k; F_prev_all; u_current; U_remaining_all; actual lifetime u_actual_k for every beneficiary; source quantity ID/q_a,s; source-specific F_booked_a,s,k; w_a,k; signed delta_a,s,k; original-record and correction links; ; source-specific B/version and original N fields in cp_capital_amendment"
      collection_method: "At site delivery/commissioning reconcile signed receipts and actual specifications with measured length, verified counts and weighed initial fill; one primary property/unit per row and no duplicate included components/water. At each life/utilization revision preserve prior postings and verify all remaining capacity-hour drivers under asset_service. At final retirement collect every original beneficiary-period actual capacity-hour record and original Q_k; calculate final w, source-specific booked fractions and signed corrections for assets, initial fill, observed capital events and actual handover carriers. Newly observed source quantities have zero prior booked shares where unposted. Archive governed original-cohort amendments without changing raw physical measurements or charging the final cohort wholesale. Missing/nonpositive denominators or unsupported prior records block unit-reference results; no assumed life, capacity or current-Q fallback. No supplier BOM or nested capital collection. Complete cp_capital_amendment reconciliation for final settlement and source/denominator revisions."
      unit: "m; item; kg; capacity*h; h"
      frequency: "each receipt/task; each life/utilization revision; monthly reconciliation; annual review; final retirement and actual handover"
      temporal_coverage: "declared service reporting cohort and evidenced original-asset use history; actual later handover retains the original responsible cohort and its allocation"
      site_scope: "declared network site, equipment acceptance and actual waste handover gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, signed receipts/work orders, specification/inclusion checks, stock/causal-share ledger, gaps and uncertainty evidence"
    - protocol_id: cp_capital_amendment
      process_id: "site_work"
      flow_role: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      record_type: "versioned_original_source_and_cohort_ledger"
      raw_fields: "asset_ID; source_ID and original row_ID/native unit; original acceptance/event gate; full measured source quantity and old/new versions; measurement/calibration/state basis; each original beneficiary-period/driver unit/u_actual; period b where applicable; all past/future beneficiaries; F_prev_all and remaining_driver; accepted g/F_booked; raw booked B; old normalized result/original N and corrected N; background model versions/scope; actual final retirement evidence; A_new/delta_A/replacement/deduplication links"
      collection_method: "Collect original records at asset/supplier acceptance, actual site events and receiver handover gates as applicable; verify full quantities through the existing cp_assets weighing/configuration-count/length/driver measurement and calibration methods. At every source/life/model/denominator revision and final retirement, compare old/new records for every original cohort and apply capital_source_amendment. Reconcile all-beneficiary fractions, source totals and each amendment link; the service data custodian reviews and signs the reconciliation. Prove nonoccurrence by complete event registers/zero-activity evidence, never absence-as-zero; retain unresolved identities, measurement uncertainty and incomplete causes."
      unit: "source-native units; fixed driver units; original reference units"
      frequency: "each acceptance/event/revision/final retirement; annual reconciliation"
      temporal_coverage: "complete original asset history and original service cohorts; evidenced remaining life"
      site_scope: "existing foreground gates and capital-source responsibility only"
      aggregation_rule: "once per original reference flow"
      quality_evidence: "raw measurement/calibration; signed acceptance/event/receiver records; source/model versions; all-beneficiary and revision reconciliation ledger"
    - protocol_id: cp_site_work
      process_id: "site_work"
      flow_role: "actual onsite inputs and work tasks"
      record_type: "site measurement, handover and task record"
      raw_fields: "site and task ID; dates and installation/repair/isolated-conditioning purpose; equipment acceptance inclusion matrix; original network/asset/cohort; primary-unit receipts and withdrawals; opening/closing site stocks; supplier return; accepted/rejected/returned status; meter opening/closing kWh; generator internal memorandum; fuel kg and density/state/composition; supplied water kg and injection state; oil/grease formulation; calibration; causal duty share; linked waste event; Q  ; direct task submeter/issue; verified device operating/standby power kW and verification; actual state hours per beneficiary; same-interval common-meter kWh and complete load reconciliation; source work-order ID; actual service personnel hours; all-beneficiary actual personnel-hours denominator and roles; source-release inherited share; original asset alpha; already-attributed marker; source quantity ID and source-specific booked fractions; original cohort Q_k; final actual asset w and signed correction links;"
      collection_method: "Read calibrated task submeters/weighing and site work orders for every actual task, reconcile monthly to invoices/stocks, then attribute once under site_activity and asset_service. Dedicated recurring tasks direct, shared tasks causal, capital installation original-asset fraction. Mark conditional absence only with reviewed machine logs/work orders and inspection; unknown quantities or unlisted actual identities block completeness. Record only work inside the foreground after the defined supply gate, no external delivery/factory/receiver internals.  Enforce the fixed shared_assets object-specific driver order, collect all-beneficiary denominators and reject a second multiplier on already-attributed quantities. For capital events retain source-specific previous postings and apply asset_service final w/corrections to original Q_k; never reweight already attributed quantities or put the residual into the event-year result."
      unit: "kg; kWh; MJ; h"
      frequency: "each receipt batch/actual task event; monthly reconciliation; asset-scope change and annual review"
      temporal_coverage: "declared service reporting cohort and evidenced original-asset use history; actual later handover retains the original responsible cohort and its allocation"
      site_scope: "declared network site, equipment acceptance and actual waste handover gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, signed receipts/work orders, specification/inclusion checks, stock/causal-share ledger, gaps and uncertainty evidence"
    - protocol_id: cp_site_waste
      process_id: "site_work"
      flow_role: "actual site waste generation and handover"
      record_type: "site measurement, handover and task record"
      raw_fields: "generation event/date; source asset/task and original cohort; carrier identity and measured gross mass; composition/moisture/remaining fluid; opening/closing waste stock; handed-over mass/date; actual receiver and signed acceptance gate; onsite reuse/internal transfer; product-return acceptance distinct from waste rejection; residual carrier heat and fixed datum; Q; custody_lot_id; custody_pool_id; O; G; T_in; C; H; T_out; L; epsilon; movement_endpoints; loss_event_ID; loss_time_location; loss_evidence_method; first_medium; release_row_id; propagated_uncertainty"
      collection_method: "At generation, storage and the site-to-receiver gate, weigh the actual whole carrier or use a calibrated volume with matching density. Keep current generation held for later handover as stock QA, never handover exchange; reconcile generation/stock/handover and avoid double counting separated components or fluids. Retain receiver/route proof to the actual handover only; no assumed receiver processes, future reagent/energy use or post-handover emissions. Actual direct site releases are distinct from handed-over waste; unknown handover stays a gap. For custody_mass_balance and custody_loss_link, retain calibrated event/stock measurements, matched composition/density and original lot; investigate each loss or residual at the actual location, link its release row and paired movements, and reconcile monthly and at interval end. Record absence only with dated inspection/measurement coverage; unknown is not zero."
      unit: "kg; MJ"
      frequency: "each receipt batch/actual task event; monthly reconciliation; asset-scope change and annual review; each loss event and stock movement"
      temporal_coverage: "declared service reporting cohort and evidenced original-asset use history; actual later handover retains the original responsible cohort and its allocation"
      site_scope: "declared network site, equipment acceptance and actual waste handover gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, signed receipts/work orders, specification/inclusion checks, stock/causal-share ledger, gaps and uncertainty evidence"
    - protocol_id: cp_site_emissions
      process_id: "site_work"
      flow_role: "actual onsite air species"
      record_type: "site measurement, handover and task record"
      raw_fields: "site task/machine/engine ID; interval and operating state; fuel withdrawal and corrected kg; fossil/biogenic composition; species identity and first receiving air interface; direct measurement unit/method/calibration; native source factor and applicability; oxidation/control/composition already inside factor; PM fraction definition; causal task share or capital-install alpha; uncertainty; occurrence/absence inspection; Q  ; linked source fuel/material/work order; directly subdivided source quantity or original work-order personnel-hour share; all-beneficiary denominator; original alpha for one-off capital event; no-second-share check"
      collection_method: "Collect actual onsite engine/task data each event with representative measurements or engine/fuel-specific factor evidence; keep raw factor basis and one conversion. Reconcile species/fuel carbon and nonoverlapping particles monthly without inventing residual emissions. Apply the same onsite task allocation as its fuel and normalize once; absent fuel/task is documented absence, not an assumed zero factor. Supplier/receiver emissions are outside this protocol."
      unit: "kg; native factor units"
      frequency: "each receipt batch/actual task event; monthly reconciliation; asset-scope change and annual review"
      temporal_coverage: "declared service reporting cohort and evidenced original-asset use history; actual later handover retains the original responsible cohort and its allocation"
      site_scope: "declared network site, equipment acceptance and actual waste handover gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, signed receipts/work orders, specification/inclusion checks, stock/causal-share ledger, gaps and uncertainty evidence"
  calculation_rules:
    - id: thermal_reference
      applies_to: "all thermal carrier, stock and origin calculations"
      rule: "Use one mandatory ordinary-water energy convention: the IAPWS-95 saturated-liquid triple-point state at 273.16 K has specific internal energy zero. This fixes an accounting reference, not an operating temperature, water-quality assumption or LCA allocation approved by IAPWS. For property implementation j evaluate C_j = u_raw,j at that same reference state, in kJ/kg; normalize every water value as h_c = h_raw,j - C_j and u_c = u_raw,j - C_j. The retained token h0 means C_j, not a selectable inlet, ambient or customer-return enthalpy. Apply the same offset to h and u; preserve h_c - u_c = p/rho/1000 for p in Pa and rho in kg/m3. Do not independently zero enthalpy, substitute h for stored u, or treat a changed physical reference state as a sensitivity choice for the primary result. Use measured water states/composition and a validated property method applicable to them; document any necessary composition corrections on this same convention rather than importing an incompatible energy zero. Unsupported conversion or property applicability blocks completion. The proportional origin method remains this PCR candidate accounting choice, not uniquely observable heat tracing."
      inputs:
        - property_method
        - raw_h
        - raw_u
        - reference_state
        - C_j
        - cp_heat
      output: "Canonical h_c, u_c and implementation offset h0"
      source_ids:
        - iapws-water-energy-reference-2018
    - id: thermal_reference_history
      applies_to: "heat_balance; electrical_burden_carry; carrier_thermal_inflow"
      rule: "Before heat_balance or electrical_burden_carry, construct all inlet/outlet carrier energies and opening/closing water internal energies on thermal_reference. Reconstruct each source/electrical/carrier origin ledger chronologically from evidenced initial fill and all subsequent supply, work, withdrawal, loss and transfer events on this convention, retaining original suppliers and electrical kWh burdens. Reconcile the three opening components to U_open and the three closing components to U_close. Previously aggregated stocks or shares on a different datum are not interchangeable: do not shift only U_open/U_close while retaining old origin fractions, and never assign the unexplained difference to carrier origin. If historical raw states, masses or origin events cannot be recovered, keep an explicit incomplete result. A corrected datum conversion requires versioned replacement of all affected original-cohort source-heat, electricity-carry and normalized results using each original positive Q; retain the previous results and raw observations, with no fictitious purchase, release or credit."
      inputs:
        - cp_heat
        - cp_water
        - cp_energy
        - original_origin_history
        - original_Q
      output: "Canonical historical origin and burden ledger"
      source_ids: []
    - id: heat_meter
      applies_to: "heat_distribution_service; replacement_heat"
      rule: "Q_j = sum[m_j_interval * (h_supply - h_return)] / 1000 when mass is kg and h is kJ/kg; sum only contract-accepted useful delivery intervals for Q. Use validated matched-gate heat meters or traceable water property evaluation at measured temperatures/pressures; volume requires matching density or validated heat coefficient. No constant density, heat capacity, temperature or pressure is prescribed.  Q_reject includes only final irreversible heat consumed in operator-controlled rejected/test circuits without acceptance or another valid commodity recipient; an internal bypass/return remaining in the same circuit is not another output. Tag intervals/events mutually exclusively as accepted, rejected or ordinary carrier/environment loss; G_ambient and Q_carrier_loss must not repeat an event already assigned to Q_reject. A valid external commodity transfer is not rejection; this route excludes it pending reviewed extension."
      inputs:
        - m_j_interval
        - h_supply
        - h_return
        - acceptance
        - cp_heat
      output: "Q; Q_in; Q_reject"
      source_ids:
        - oiml-heat-meters-2002
    - id: heat_balance
      applies_to: "replacement_heat; heat_distribution_service; heat_to_air; heat_to_soil; heat_to_freshwater"
      rule: "First apply thermal_reference and thermal_reference_history to every carrier and stock term, including inherited origins; no independently selected datum is permitted. For each synchronized zone/interval reconcile Q_in + W_to_fluid + H_carrier_in + G_ambient + U_open = Q + Q_reject + Q_carrier_loss + U_close + residual, with measured carrier enthalpy at the fixed datum. G_ambient is measured signed heat exchange, positive inward; negative environmental transfer is not also Q_carrier_loss. Q_carrier_loss is unrecovered heat leaving in drained/leaked carrier. Residual stays investigated uncertainty, not forced loss. Internal recovery returns to the same pool without another input. External useful heat export or positive ambient gain is outside this route pending extension. Subdivide independently metered zones/time first. For an inseparable pool, P = Q_in + W_to_fluid + H_carrier_in + U_open; share_source = (Q_in + U_open_source) / P; share_electric = (W_to_fluid + U_open_electric) / P; share_carrier = (H_carrier_in + U_open_carrier) / P. The three shares must sum to one. Q_source_extra = share_source * (Q_reject + Q_carrier_loss - G_ambient); Q_source_accepted = share_source * Q; U_close_source = share_source * U_close, with matching electrical/carrier closing provenance. Carry original supplier/vintage source and electrical burdens; carrier water burdens follow makeup_allocation and the initial-fill physical asset ledger. This is a declared proportional energy accounting convention, applicable only to a combinable pool with matched measured states/time, a closing energy balance and complete opening provenance; document its mixing assumption and uncertainty, not uniquely observable physical tracing. Nonpositive P, negative physical pool amounts, missing carrier state/ownership, incomplete opening history or unresolved mechanical correction blocks completion. Q_carrier_loss retains the full canonical advective enthalpy of actual liquid outflow at the thermal boundary for this conservation and origin ledger. It is not an elementary heat emission: apply carrier_release_heat separately without subtracting receiver-baseline energy from this balance or the source/electrical attribution pool."
      inputs:
        - Q_in
        - W_to_fluid
        - H_carrier_in
        - G_ambient
        - Q_carrier_loss
        - U_open
        - U_open_source
        - U_open_electric
        - U_open_carrier
        - U_close
        - Q
        - Q_reject
        - cp_heat
        - cp_water
        - cp_pump
      output: "Q_source_extra; Q_source_accepted; complete thermal cohort provenance"
      source_ids: []
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "x_ref = x_attributed / Q; x_attributed is the original quantity in the card unit assigned to the same accepted-service cohort after stock correction and supplier-gate/stage overlap removal. Normalize once and retain raw totals. Original-cohort asset/capital-event corrections under asset_service use that original positive Q_k, never current or disposal-period Q. Failed or zero-output individual tasks retain their measured consumption and are assigned to their evidenced original parent service cohort; they do not increase Q. If that responsible cohort has no positive Q, retain raw totals and an unresolved gap without a unit-reference result or transfer to an unrelated successful cohort. The reference output is Q / Q = 1 MJ; standby-only periods without Q cannot form a unit service dataset."
      inputs:
        - x_attributed
        - Q
        - cp_heat
        - cp_energy
        - cp_water
        - cp_assets
      output: "x_ref"
      source_ids: []
    - id: energy_units
      applies_to: "aux_electricity"
      rule: "E_MJ = 3.6 * E_kWh; convert meter energy once. The verified Net calorific value property with Units of energy is used as the database energy-quantity convention for electricity and service throughput; the name does not imply combustion of the service or heating water. Heat quantities use enthalpy measurement, not fuel calorific value."
      inputs:
        - E_kWh
        - cp_energy
      output: "E_MJ"
      source_ids: []
    - id: water_balance
      applies_to: "makeup_water; initial_fill_water; drained_water; water_to_soil; water_to_freshwater"
      rule: "Opening water mass inside the active-loop thermal boundary + actual initial-fill injection + actual operational-makeup injection = closing water mass inside that same active-loop boundary + actual generated drainage + actual leakage, reconciled for measured supplier returns and other ownership-defined transfers. Supplied cold-water receipts not yet injected remain separately held stock, never injection. Ordinary circulation is not new input/output. Convert volume with state-matched density, retain raw readings; apply makeup_allocation to initial/operational supply burdens without equating physical injection to unit-service water purchase. External returns outside the same owned loop remain outside this route pending reviewed extension."
      inputs:
        - opening_water
        - initial_fill_injected
        - operational_makeup_injected
        - closing_water
        - drainage
        - leakage
        - supplier_returns
        - external_transfer
        - cp_water
      output: "reconciled carrier mass and initial/makeup distinction"
      source_ids: []
    - id: constituent_identity
      applies_to: "water_to_soil; water_to_freshwater"
      rule: "m_species_medium = total_released_solution_mass * measured_species_mass_fraction * measured_destination_fraction; use either measured destination masses or fractions, not both. Water fraction and dissolved species partition the total solution; add a separate card for each actual non-water species and receiving medium. For kg waste carrier sent to treatment, retain composition but do not emit its constituents separately before treatment.  Determine receiving medium at the first operator-to-environment interface for each release event/parcel; soil and freshwater destinations are mutually exclusive for that parcel. Subsequent soil-to-groundwater or surface-water migration is environmental fate, not a second operator substance or carrier-heat emission. Retain event ID, parcel share and first-interface evidence."
      inputs:
        - total_released_solution_mass
        - measured_species_mass_fraction
        - measured_destination_fraction
        - cp_water
      output: "m_species_medium"
      source_ids: []
    - id: carrier_release_heat
      applies_to: "heat_to_soil; heat_to_freshwater; drained_water"
      rule: "For each direct liquid-water parcel p at the first operator/environment interface, retain H_out_p = m_p * h_out_c / 1000 MJ for measured kg and kJ/kg. Evaluate h_receiver_c for the same water composition at the measured undisturbed receiving-medium temperature and the same interface pressure, using the validated water property method and thermal_reference. H_receiver_base_p = m_p * h_receiver_c / 1000; E_excess_p = H_out_p - H_receiver_base_p. The receiver state is a measured physical comparator, not a new selectable thermodynamic zero. Only E_excess_p is the receiver-relative thermal-load contribution to the matching heat card; H_receiver_base_p is mass-carried baseline energy retained as reconciliation metadata, neither waste heat, a new environmental input nor a credit. For soil the comparator is water at local soil temperature, never the specific enthalpy of soil. Both water states must be liquid and composition-compatible; unsupported phase change, mechanical-energy correction or mixing/reaction requires reviewed method extension before completion. Reconcile any operator-side changes between the network thermal boundary and first environmental interface separately with measured energy/storage, without dropping or counting them twice. Equal matched states give zero excess heat while water mass and H_out remain recorded. Negative E_excess is an evidenced cooling interaction requiring reviewed extension beyond these positive waste-heat cards; retain its signed raw value, never clamp, net against heating or create a credit. Unknown receiver state, uncertainty that leaves the sign unresolved, or unsupported property conversion blocks a complete heat result. For waste handover keep full carrier energy as metadata with zero direct environmental heat at that handover; receiver treatment is outside this foreground. This declared thermal-load convention does not predict instantaneous transfer to a finite receiver or its final temperature; that requires a separate receiving-medium model, not an additional emission. Binding an unbound heat UUID must verify this quantity meaning as well as medium/property/unit."
      inputs:
        - cp_heat
        - cp_water
        - m_p
        - h_out_c
        - h_receiver_c
        - first_interface
        - thermal_reference
      output: "H_out_p; H_receiver_base_p; E_excess_p; receiver-specific thermal-load ledger"
      source_ids:
        - epa-nccw-thermal-load
        - iapws-water-energy-reference-2018
    - id: heat_fates
      applies_to: "heat_to_air; heat_to_soil; heat_to_freshwater"
      rule: "Assign measured non-carrier Q_reject and negative G_ambient by event and first physical receiver, without applying another ambient subtraction to an already measured heat difference. For direct liquid-carrier releases use E_excess_p from carrier_release_heat, never Q_carrier_loss or H_out_p as elementary heat. Per medium j calculate Q_j = Q_noncarrier_j + sum(E_excess_p assigned to j) + E_outside_j, with mutually exclusive event components; air has no liquid-carrier branch in this route. E_outside_j is measured electrical dissipation outside the water circuit, assigned once to its actual air/soil receiver. W_to_fluid is already in the network heat balance and must not be added again. Reconcile full Q_carrier_loss to direct-carrier H_out plus waste-carried energy at the same boundary, including documented operator-side transfer/storage corrections; reconcile each direct H_out = E_excess + H_receiver_base separately. Do not force environmental heat totals to equal full carrier enthalpy or invent a residual emission. Waste handover carries no direct heat emission. Normalize each Q_j once by the original accepted Q; later quantity corrections replace the affected original-cohort result with its original denominator. Soil and freshwater shares are mutually exclusive per parcel; subsequent environmental migration, cooling or mixing is not another operator release. Retain event IDs, parcel shares, first-interface evidence and uncertainty; do not multiply a destination share twice."
      inputs:
        - Q_reject
        - Q_carrier_loss
        - G_ambient
        - E_excess_p
        - H_receiver_base_p
        - E_outside_j
        - receiver_records
        - cp_heat
        - cp_water
      output: "Q_air; Q_soil; Q_freshwater; separate carrier-energy reconciliation"
      source_ids:
        - epa-nccw-thermal-load
    - id: waste_cohort
      applies_to: "drained_water; site_work"
      rule: "Reconcile original-cohort raw generation, stocks, handovers, other movements, evidenced losses and unexplained residuals under custody_mass_balance and custody_loss_link; generation and pending stock remain QA only. The exchange quantity is solely actual signed-handover mass attributed to its original responsible cohort, m_handover_attributed, excluding stock still onsite. Retain source event, original asset/service cohort, generation date and actual handover date for every handover. Capital-linked handover uses the original asset_service fraction once; recurring-operation handover uses the original service causal share. Dispatch of historical opening stock belongs to its original cohort or governed amendment, never all to current Q. No foreground receiver input or treatment emission arises after this gate. At actual final capital retirement use asset_service final w and each actual carrier source-specific booked fraction to correct the original cohort/Q_k, including initial-origin water. Newly observed carriers have zero prior postings; operational-water FIFO responsibility remains separate. Signed allocation corrections do not change raw handed-over carrier mass or create a second waste output."
      inputs:
        - m_generated
        - m_handed_over
        - m_closing_waste_stock
        - m_opening_waste_stock
        - original_cohort
        - original_asset_fraction
        - Q
        - cp_water
        - cp_site_waste
      output: "m_handover_attributed and separate generation/stock QA"
      source_ids: []
    - id: custody_mass_balance
      applies_to: "original-cohort waste custody and actual losses"
      rule: "O + G + T_in = C + H + T_out + L + epsilon, in raw whole-carrier kg for one original generation lot, declared custody pool and matched interval. O/C are opening/closing physical stocks; G is newly generated material entering custody, counted once; H is gross actual accepted external handover under the existing gate; T_in/T_out are other evidenced physical movements (including returns or reclassification), with origin/destination and paired ledger entries, never also H or new G. Internal movements cancel when pools are consolidated. A physical return retains the original lot and enters T_in paired to the original gross H; keep that historical H in this physical ledger. Any later acceptance/attribution correction is separate and must not also reduce H in this equation. Correct an erroneous handover that never occurred without inventing a return. Reclassification without a physical pool-boundary movement changes the state label only, never T_in/T_out. L is evidenced physical loss after entry into this custody pool, not a balancing plug; epsilon is the signed unexplained measurement residual. Calculate epsilon = O + G + T_in - C - H - T_out - L; investigate it against propagated measurement uncertainty and retain the evidence and unresolved remainder. Unknown quantities must not be zero-filled or converted into L. Weigh the actual whole carrier at each event and stock count, or use calibrated volume times density at matching state/temperature/composition; distinguish whole-carrier mass from dry mass and contained-species mass. Moisture loss is an evidenced physical movement, not an unsupported basis conversion. Record zero loss only with inspection/measurement coverage and uncertainty evidence. Do not allocate or normalize this physical QA equation. Retain each inventory row’s declared property/unit: a volume-based handover row uses actual handed-over volume; its matched density conversion to kg serves this physical QA only and never creates a second output. Example with zero opening/closing/other movements and no unexplained residual: G=10 kg, H=9 kg, L=1 kg; output H remains 9 kg. Example values are not defaults."
      inputs:
        - O
        - G
        - T_in
        - C
        - H
        - T_out
        - L
        - epsilon
        - cp_water
        - cp_site_waste
      output: "Raw whole-carrier kg closure; actual H only at handover"
      source_ids: []
    - id: custody_loss_link
      applies_to: "original-cohort waste custody and actual losses"
      rule: "Keep active-loop water_balance separate from post-drainage custody. Match the loop drainage event to custody entry once: drainage of 10 kg followed by custody loss of 1 kg and actual handover of 9 kg remains 10 kg loop drainage, not 11 kg or a second loop leak. Link actual custody releases to measured composition/state, first receiving medium and exact existing rows under waste_fate; whole-carrier L is not automatically a species release. Retain cp_water FIFO origins, original asset/service attribution and original Q or Q_k under waste_cohort; apply each applicable share and denominator once. A physical loss is not a signed capital-allocation correction. Missing species/medium rows or unresolved loss identities require explicit matching cards and identity review before completion; no invented UUID, assumed off-site release or residual-as-emission."
      inputs:
        - custody_mass_balance
