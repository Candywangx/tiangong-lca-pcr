allocation_rules:
  - rule_id: causal_allocation
    applies_to: "all inventory rows"
    rule: "Subdivide meters, circuits, source events and work orders first; directly assigned records have share 1. Remaining shared operation at identical gate/quality uses this service accepted kWh / all beneficiaries accepted kWh for the same interval; unlike gates require physical subdivision, not forced equivalence. Shared site consumables/releases use this network verified technician-hours / all-beneficiary technician-hours for the same source job. Specific calibration service uses attributed instrument-hours, clearance uses nonoverlapping treated area per event, and land uses land_quantity; do not multiply a beneficiary share again after direct assignment. Original-asset capital-site events instead use their sole f_a. Record all denominators and shares summing to one; missing/nonpositive drivers block completeness, with no equal or revenue default."
    source_ids: []
  - rule_id: capital_allocation
    applies_to: "all cp_assets rows"
    rule: "Apply capital_service_fraction only to retained actual delivered network assets: quantity times sole service share divided once by Q. No supplier-capital recursion. Recurring site maintenance and capital replacement are mutually exclusive; do not duplicate included components or initial fill. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
    source_ids: []
  - rule_id: recovery_no_credit
    applies_to: "sf6_reusable; sf6_spent"
    rule: "Internal recovery is an internal transfer; external accepted reusable gas carries physical mass without service-burden allocation or negative substitution credit. Spent gas is waste, not air emission; off-site treatment remains a matched background linkage."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_energy
      process_id: "operation"
      flow_role: "accepted service, losses and auxiliary energy"
      record_type: "synchronized calibrated meter and settlement records"
      raw_fields: "meter/gate ID; interval; voltage; CT/PT; import/export; accepted/rejected kWh; F_fail; E_transfer recipient/owner; A supply source; E_onsite_to_aux; generator ID/output and receiving-load meters; operating/isolation state; network injection check; uncertainty"
      collection_method: "Read all entry, exit and station meters at matched intervals; reconcile acceptance, counterflows, outages and internal cancellation monthly using energy_balance; Q is accepted external-entry-supplied exits only. For each backup operating interval and wiring change verify source/load readings and anti-backfeed/interlock evidence: E_onsite equals isolated auxiliary supply only; actual network injection fails service_boundary. Retain raw/corrected units and assign each record one owner."
      unit: "kWh"
      frequency: "each interval; monthly reconciliation"
      temporal_coverage: "same complete consecutive 12 months"
      site_scope: "all declared gates and substations"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter certificates; dated wiring map; anti-backfeed/interlock inspection or test records; synchronized generator/load readings; signed settlement; residual investigation"
    - protocol_id: cp_gas
      process_id: "gas_handling"
      flow_role: "actual foreground gas supply, bank, recovery, waste and air"
      record_type: "weighed gas/stock/bank and acceptance ledger"
      raw_fields: "event/source/stage/original asset ID; operating versus capital-site event tag and sole weight; cylinder gross/tare; gas state/purity; U/V; J/I opening/closing total and species; B bank opening/closing; equipment C_in/out measured charges; R_out/W_out; R_gen/W_gen; original Q; custody; receiver; uncertainty; custody_lot_id; custody_pool_id; O; G; T_in; C; H; T_out; L; epsilon; movement_endpoints; loss_event_ID; loss_time_location; loss_evidence_method; first_medium; release_row_id; propagated_uncertainty"
      collection_method: "Weigh each movement with calibrated scales; assay event-specific composition; reconcile cylinders and installed bank at both period ends. Separate equipment-contained charge from external supply and source events from QA balance. Use gas_balance and generation-custody rules, with no off-site treatment inference. For custody_mass_balance and custody_loss_link, retain calibrated event/stock measurements, matched composition/density and original lot; investigate each loss or residual at the actual location, link its release row and paired movements, and reconcile monthly and at interval end. Record absence only with dated inspection/measurement coverage; unknown is not zero."
      unit: "kg"
      frequency: "every movement; monthly and period-end reconciliation; each loss event and stock movement"
      temporal_coverage: "same 12 months with opening/closing banks and pending custody"
      site_scope: "all operator and contractor-held foreground stocks/equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; charge records; assays; handover receipts; signed uncertainty balance"
    - protocol_id: cp_assets
      process_id: "network_support"
      flow_role: "specified delivered network capital"
      record_type: "original asset delivery and service ledger"
      raw_fields: "original asset/component ID; original site-capital event keys/history; exact type/model/rating; gate/acceptance date; invoice inclusions; count or conductor length or concrete kg; measured method; commissioning/replacement; capacity unit; beneficiary reserved capacity; service hours; observed past/current/projected remaining all-user lifetime driver; prior fractions; revision; retirement residual; Q ; source-specific B/version and original N fields in cp_capital_amendment"
      collection_method: "Count actual accepted complete assets, measure conductor delivery length and weigh concrete delivery; document configuration and excluded/included components. Reconcile original asset register, replacement history and capital_service_fraction across all beneficiaries, preserving prior allocations; no assumed weight/life. Complete cp_capital_amendment reconciliation for final settlement and source/denominator revisions."
      unit: "Item(s); m; kg"
      frequency: "each delivery/change; annual service reconciliation"
      temporal_coverage: "same operating year plus original asset history and evidenced remaining use"
      site_scope: "delivered network equipment only; excludes supplier support capital"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance/invoices; as-built meter/scale records; original life-driver and all-beneficiary register; provider boundary matrix"
    - protocol_id: cp_capital_amendment
      process_id: "network_support"
      flow_role: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      record_type: "versioned_original_source_and_cohort_ledger"
      raw_fields: "asset_ID; source_ID and original row_ID/native unit; original acceptance/event gate; full measured source quantity and old/new versions; measurement/calibration/state basis; each original beneficiary-period/driver unit/u_actual; period b where applicable; all past/future beneficiaries; F_prev_all and remaining_driver; accepted g/F_booked; raw booked B; old normalized result/original N and corrected N; background model versions/scope; actual final retirement evidence; A_new/delta_A/replacement/deduplication links"
      collection_method: "Collect original records at asset/supplier acceptance, actual site events and receiver handover gates as applicable; verify full quantities through the existing cp_assets weighing/configuration-count/length/driver measurement and calibration methods. At every source/life/model/denominator revision and final retirement, compare old/new records for every original cohort and apply capital_source_amendment. Reconcile all-beneficiary fractions, source totals and each amendment link; the service data custodian reviews and signs the reconciliation. Prove nonoccurrence by complete event registers/zero-activity evidence, never absence-as-zero; retain unresolved identities, measurement uncertainty and incomplete causes."
      unit: "source-native units; fixed driver units; original reference units"
      frequency: "each acceptance/event/revision/final retirement; annual reconciliation"
      temporal_coverage: "complete original asset history and original service cohorts; evidenced remaining life"
      site_scope: "existing foreground gates and capital-source responsibility only"
      aggregation_rule: "once per original reference flow"
      quality_evidence: "raw measurement/calibration; signed acceptance/event/receiver records; source/model versions; all-beneficiary and revision reconciliation ledger"
    - protocol_id: cp_support
      process_id: "network_support"
      flow_role: "separate foreground maintenance supplies, diesel and support power"
      record_type: "purchase/stock/work-order and site-meter records"
      raw_fields: "row/event/original asset ID; recurring versus capital-site event and sole weight; quantity/raw unit; formulation; density/temperature/concentration; opening/closing usable stock; returns; work order; fuel engine-on/idle/failed activity; electricity meter/source and A overlap; backup generator/output/receiving-load IDs and isolated support kWh; wiring/interlock state and network injection check; beneficiary share; provider inclusions; Q all-beneficiary source-job technician-hours and direct assignment proof;"
      collection_method: "Weigh supply/stock and use actual density for volume-to-kg; read calibrated separate support meters; reconcile purchases, inventory, returns and work orders monthly. Include unsuccessful work and idle fuel. At every backup operating interval and wiring change reconcile isolated support supply separately from E_onsite_to_aux; prove no commodity-network injection with matched meters and anti-backfeed/interlock evidence. Missing evidence is a gap; actual injection fails service_boundary. Remove supplier-included supplies and A overlap; apply causal share once and divide once/Q."
      unit: "kg; kWh"
      frequency: "each supply/use/interval; monthly reconciliation"
      temporal_coverage: "same 12 months with opening/closing stocks"
      site_scope: "operator-responsible site work and engines only"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; stock weigh tickets; calibration; density/assay; meter/work orders; dated wiring and anti-backfeed/interlock evidence; generator/load reconciliation; provider exclusions"
    - protocol_id: cp_services
      process_id: "network_support"
      flow_role: "defined meter calibration and mechanical clearance"
      record_type: "contract and signed service acceptance"
      raw_fields: "service ID; exact task and gate; meter/configuration/procedure; start/end active instrument hours; GPS polygon and clearance height; event overlap; accepted/rejected work; inclusion of tools/energy/travel/waste; operator retained material; allocation share; Q"
      collection_method: "For calibration measure active accepted instrument-hours, not undefined crew-hours. For mechanical clearance survey accepted treated m2 per event and dissolve overlaps within each event. Verify contract inclusions against separate energy/waste records; accepted service quantity includes provider actual failed-work burdens in its unit dataset rather than fabricated successful area/hours. Unaccepted charges without accepted service need separately evidenced actual task accounting, not deletion."
      unit: "h; m2"
      frequency: "every contracted event and acceptance"
      temporal_coverage: "same 12 months"
      site_scope: "specified network service tasks at declared site gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed procedures/results; time logs; GIS; contract inclusion matrix; calibration and acceptance evidence"
    - protocol_id: cp_waste
      process_id: "network_support"
      flow_role: "actual generated waste carriers and custody"
      record_type: "weighed generation, stock and handover register"
      raw_fields: "carrier ID; generation event/cohort/Q; actual state/composition/moisture; gross/tare/net; opening/closing custody; dispatch; return/reclassification; receiver/gate/acceptance; contract ownership; pending status; included removal; custody_lot_id; custody_pool_id; O; G; T_in; C; H; T_out; L; epsilon; movement_endpoints; loss_event_ID; loss_time_location; loss_evidence_method; first_medium; release_row_id; propagated_uncertainty"
      collection_method: "Weigh each actual carrier at generation, stock change and handover; reconcile by original cohort using waste_generation_custody. Preserve actual mixed/coated state; BOM alone never proves physical separation. Stop at handover gate, record background treatment need without receiver-internal expansion. For custody_mass_balance and custody_loss_link, retain calibrated event/stock measurements, matched composition/density and original lot; investigate each loss or residual at the actual location, link its release row and paired movements, and reconcile monthly and at interval end. Record absence only with dated inspection/measurement coverage; unknown is not zero."
      unit: "kg"
      frequency: "each event/movement; monthly and year-end stocks; each loss event and stock movement"
      temporal_coverage: "same generation year plus documented later handover status"
      site_scope: "foreground generated operator-custodied carriers to declared handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; assays; tickets; custody and receiver receipts; contract exclusions"
    - protocol_id: cp_release
      process_id: "network_support"
      flow_role: "actual site species to first environmental medium"
      record_type: "measurement or source-specific factor/activity ledger"
      raw_fields: "source/event; fuel kg; source operating/control state; factor original/unit/date/applicability; composition/carbon origin; concentration/flow/mass; species/receptor; uncertainty; shared attribution; Q"
      collection_method: "Measure representative actual release or apply independently evidenced source-matched factor once to its exact basis. Screen actual additional species and add specific cards; reconcile carbon/fuel and keep provider/off-site species excluded from foreground."
      unit: "kg"
      frequency: "every representative operating state and release event"
      temporal_coverage: "same 12 months and site events"
      site_scope: "foreground-owned first environmental interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling calibration; factor originals; fuel/carbon balance; receptor map; uncertainty"
    - protocol_id: cp_land
      process_id: "network_support"
      flow_role: "actual operated industrial land occupation"
      record_type: "GIS area/date and beneficiary register"
      raw_fields: "polygon ID; land class; measured area m2; occupation start/end; overlap; actual event history; beneficiary and share; Q all-beneficiary reserved equipment footprints and reservation dates/hours with layout evidence;"
      collection_method: "Survey operator footprint, eliminate overlaps, integrate actual duration in years and assign causal share once. Check whether an actual new land transformation occurred; if present add exact from/to land-class cards, never infer a historic asset conversion as current."
      unit: "m2; a"
      frequency: "annual and each footprint/land change"
      temporal_coverage: "same operating period; actual change history"
      site_scope: "operated station/line footprint only"
      aggregation_rule: "per reference flow"
      quality_evidence: "GIS/survey/permits; dates; nonoverlap and allocation ledger"
  calculation_rules:
    - id: energy_balance
      applies_to: "loss_electricity; aux_electricity; service_output"
      rule: "For one consistently oriented boundary, E_entry + E_aux_external + E_onsite = Q + E_transfer + A + L + F_fail + residual. E_onsite = E_onsite_to_aux is only measured backup energy delivered to isolated station auxiliary A; it is never commodity-network injection. Q, L, F_fail and E_transfer have external-entry supply only. Separately metered backup supply to support loads outside this boundary is reconciled in cp_support, never added to this balance. E_transfer has documented external recipient/generation owner; F_fail is attributable rejected/test network consumption with no recipient. Cancel internal meters. Reconcile net counterflows without counting the same energy twice. Determine technical L from calibrated meters and engineering assessment, keeping unexplained residual and uncertainty separate; do not force residual into L or F_fail. A balanced equation alone does not establish applicability: reject actual backup network injection under service_boundary."
      inputs:
        - cp_energy
        - cp_support
      output: "Period Q/L/F_fail/E_transfer/A and E_onsite_to_aux in kWh"
      source_ids: []
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Each attributable raw period or asset-service total is divided once by positive accepted Q. service_output is exactly 1 kWh. Never fix internal purchases or transfers to 1, divide a provider unit factor twice, or use failed/rejected energy as additional accepted output. Retain raw values, stock corrections, shares and normalized result."
      inputs:
        - Q
        - cp_energy
        - cp_support
        - cp_assets
        - cp_gas
        - cp_services
        - cp_waste
        - cp_land
        - cp_release
      output: "Each card amount per reference flow"
      source_ids: []
    - id: gas_balance
      applies_to: "sf6_supply; sf6_reusable; sf6_spent; sf6_air"
      rule: "G_total = sum(U_total) - sum(V_total) - (J_end_total-J_start_total), where J is usable externally supplied stock. I is all foreground cylinder/custody gas stock; B is installed equipment gas bank. For every event/stock j use S_j = measured x_SF6,j * measured q_total,j once. F_SF6 = S_I_start - S_I_end + sum(S_U) - sum(S_V) + C_in_SF6 - C_out_SF6 - sum(S_R_out) - sum(S_W_out) - (B_end_SF6-B_start_SF6). I includes J and all reusable/spent custody, without duplicate stock. C_in/out is documented charged equipment entering/leaving the operated foreground, including initial gas embodied in equipment; no duplicate purchase/emission. R_out/W_out are actual external dispatch species, distinct from current generation R_gen_total/W_gen_total. Product/waste quantities are total carrier mass, air is SF6 species mass. All on-site operational/commissioning/retirement events are disjoint; whole-year QA reconciles these, never adds another release. Negative residual/unknown composition or bank term prevents completeness, never clamp to zero. No off-site destruction assumed in this balance. This raw annual balance is physical QA only; before normalization attribute disjoint operational and capital-site events under foreground_event_attribution, using G_attributed, R_attributed, W_attributed and F_attributed, never adding raw annual release again."
      inputs:
        - cp_gas
        - Q
      output: "Raw QA carrier/species balance; attributed G/R/W/F individually divided by Q"
      source_ids:
        - epa-sf6-2018
    - id: foreground_event_attribution
      applies_to: "all foreground site events"
      rule: "Aggregate phases only for the same actual measured object and identical physical quantity without duplicate records. Each source event key occurs once and is classified as recurring operation or identifiable original-asset a site-capital installation/commissioning/retirement. Operational event weight is its actual current causal share s; capital-site event weight is original asset f_a from capital_service_fraction, with no extra lifetime/parent share and no whole charge to the construction year. X_attributed = sum_j(s_j * X_operating,j) + sum_a(f_a * X_capital_site,a). sf6_supply/reusable/spent/air use corresponding attributed G/R/W/F; each gas stage has its own raw stock/species balance and C_in/out cancels at original stage handover. Unallocated annual QA compares only actual disjoint dated events/stocks and is never added to allocated capital/operating totals. Retain actual historical site-capital events with original Q/asset key; future unoccurred events are not observed records or fabricated receiving treatment. Unknown occurrence/measurement is a gap. Attribute only retained foreground site records, without background capital recursion. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
      inputs:
        - cp_gas
        - cp_support
        - cp_assets
        - cp_waste
        - cp_release
        - "original_asset/event_key"
        - Q
      output: "Once-attributed site exchange totals/Q"
      source_ids: []
    - id: capital_service_fraction
      applies_to: "all cp_assets rows"
      rule: "For each original delivered asset a, keep its actual quantity n_a in the card unit and f_a = u_a,current / U_a,all_lifetime using reserved rated capacity times service hours with a fixed capacity unit, all beneficiaries/periods and evidenced remaining lifetime use. Exclusively dedicated fixed-capacity assets may use operating hours over evidenced lifetime hours. Allocate n_a*f_a/Q once; n_a is not a constituent BOM or an invented mass. Count a complete assembly once, not it plus its included components/fill. Replacement assets have new original keys; a record is either capital replacement or recurring consumable, not both. Preserve historical fractions across life revisions: f_new,current = (1-F_prev_all)*u_current/U_remaining_all, including current use in remaining use. Track all shares, uncertainty, and retirement residual true-up; cumulative fractions over all beneficiaries cannot exceed one. No fixed life, asset weight or nested supplier/tool/vehicle/road allocation. Apply capital_source_amendment for final settlement, source quantity/model-version corrections and original-denominator changes; any delta-fraction times source-quantity expression here is conditional on its unchanged-source/model requirements."
      inputs:
        - cp_assets
        - "original asset register"
        - Q
      output: "Allocated delivered quantities in the card sole unit/Q"
      source_ids: []
    - id: capital_source_amendment
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Within this entry's declared applies_to scope, apply the complete ordered rule group: capital_source_amendment_history; capital_source_amendment_final_shares; capital_source_amendment_source_revision; capital_source_amendment_normalization; capital_source_amendment_scope. Use this entry's inputs, reference denominator and output; all definitions, conditions, exclusions and completion requirements across that group apply jointly. These components form one method, not additional exchanges or repeated allocation. Reading only a component is insufficient for completion. Follow the existing ownership and deduplication rules when one event appears in more than one entry."
      inputs:
        - cp_capital_amendment
        - cp_assets
        - capital_source_amendment_history
        - capital_source_amendment_final_shares
        - capital_source_amendment_source_revision
        - capital_source_amendment_normalization
        - capital_source_amendment_scope
      output: "attributed totals in source-native units; normalize once by original N_c"
      source_ids: []
    - id: support_stock_quantity
      applies_to: "cp_support rows"
      rule: "For each consumable, X = purchases + usable opening stock - usable closing stock - supplier returns, less external nonforeground transfers; cancel internal moves. Convert volume to fuel/oil/water kg only using actual state-specific density and temperature; oil formulation/concentration and moisture remain documented, not implicit fractions. Purchased electricity is measured energy; only its kWh converts by 3.6 MJ/kWh. Split independently supplied substances despite shared units. Recurring on-site activity is charged to its actual service period/beneficiary, not annualized again as capital; identifiable original-asset site installation/commissioning/retirement events follow foreground_event_attribution rather than all being charged to the construction year."
      inputs:
        - cp_support
        - Q
      output: "X/Q kg or measured imported kWh/Q according to each card"
      source_ids: []
    - id: onsite_generation
      applies_to: "aux_electricity; support_electricity; diesel; co2_fossil"
      rule: "Meter backup generation and each receiving load at matched intervals; reconcile station E_onsite_to_aux separately from support supply, with wiring and anti-backfeed/interlock evidence proving no path into the commodity network. A includes all station supply, while aux_electricity is A minus E_onsite_to_aux. support_electricity likewise excludes measured locally generated portions and A. Internal generated electricity is memorandum and cancels; actual backup diesel and individual releases are inventoried once, including idle/failed auxiliary or support operation. Generator fuel input is not multiplied by an efficiency to obtain fuel a second time. Missing load/source/isolation evidence prevents completeness; actual supply to Q, L, F_fail or E_transfer rejects the current configuration under service_boundary. A generator of another actual fuel or gas needs its own fuel/species cards before complete use; absence requires equipment/fuel record proof."
      inputs:
        - cp_energy
        - cp_support
        - cp_release
      output: "Disjoint purchased electricity, isolated on-site fuel and emissions"
      source_ids: []
    - id: waste_generation_custody
      applies_to: "all waste and recovered gas rows"
      rule: "Reconcile original-cohort raw generation, stocks, handovers, other movements, evidenced losses and unexplained residuals under custody_mass_balance and custody_loss_link; generation and pending stock remain QA only. Keep original Q and custody/dispatch records; historical stock dispatch is not current generation. Do not fabricate future receiving treatment or record an off-site input row. Reuse product status requires documented acceptance; rejection returns to waste custody without a second generation. Match later handover to original records. Pending handover or unidentified receiver remains an explicit completion gap; background treatment linkage is separately disclosed. Carrier contents and contained emissions are not added as second waste flows. Retired intact equipment must use a specifically characterized intact carrier card if it actually crosses this foreground, never assumed pure separated metals from its BOM. The exchange-card quantity is actual accepted external handover for each original cohort, with R_attributed/W_attributed and W_r,* weighted by that original source event under foreground_event_attribution. Generation and closing custody are physical QA/stock, not an additional external output. Later actual handover updates the original cohort and denominator; it is never a new current-year generation or a fabricated future handover."
      inputs:
        - cp_waste
        - cp_gas
        - "original Q"
      output: "Original-cohort actual handover quantities; separate generation/custody QA"
      source_ids: []
    - id: custody_mass_balance
      applies_to: "original-cohort waste custody and actual losses"
      rule: "O + G + T_in = C + H + T_out + L + epsilon, in raw whole-carrier kg for one original generation lot, declared custody pool and matched interval. O/C are opening/closing physical stocks; G is newly generated material entering custody, counted once; H is gross actual accepted external handover under the existing gate; T_in/T_out are other evidenced physical movements (including returns or reclassification), with origin/destination and paired ledger entries, never also H or new G. Internal movements cancel when pools are consolidated. A physical return retains the original lot and enters T_in paired to the original gross H; keep that historical H in this physical ledger. Any later acceptance/attribution correction is separate and must not also reduce H in this equation. Correct an erroneous handover that never occurred without inventing a return. Reclassification without a physical pool-boundary movement changes the state label only, never T_in/T_out. L is evidenced physical loss after entry into this custody pool, not a balancing plug; epsilon is the signed unexplained measurement residual. Calculate epsilon = O + G + T_in - C - H - T_out - L; investigate it against propagated measurement uncertainty and retain the evidence and unresolved remainder. Unknown quantities must not be zero-filled or converted into L. Weigh the actual whole carrier at each event and stock count, or use calibrated volume times density at matching state/temperature/composition; distinguish whole-carrier mass from dry mass and contained-species mass. Moisture loss is an evidenced physical movement, not an unsupported basis conversion. Record zero loss only with inspection/measurement coverage and uncertainty evidence. Do not allocate or normalize this physical QA equation. Retain each inventory row’s declared property/unit: a volume-based handover row uses actual handed-over volume; its matched density conversion to kg serves this physical QA only and never creates a second output. Example with zero opening/closing/other movements and no unexplained residual: G=10 kg, H=9 kg, L=1 kg; output H remains 9 kg. Example values are not defaults."
      inputs:
        - O
        - G
        - T_in
        - C
        - H
        - T_out
        - L
        - epsilon
        - cp_waste
        - cp_gas
      output: "Raw whole-carrier kg closure; actual H only at handover"
      source_ids: []
    - id: custody_loss_link
      applies_to: "original-cohort waste custody and actual losses"
      rule: "Link each custody loss to its event, source lot, measured composition/state, first receiving medium and precise existing release row under actual_species. For gas, reconcile whole-carrier L with SF6 species under gas_balance using event-specific composition once; an emission already included in that gas balance is the same event, not an additional L emission. Do not infer a species release from total waste mass alone. Apply foreground_event_attribution and the original Q once to the actual release; physical stocks and the QA residual are not additional inventory exchanges. A missing species/medium row or unresolved loss identity requires an explicit matching card and identity review before completion; do not force it into a similar row or invent a UUID."
      inputs:
        - custody_mass_balance
        - cp_waste
        - cp_gas
      output: "One actual release event at its original allocation and denominator"
      source_ids: []
    - id: actual_species
      applies_to: "co2_fossil; actual additional release cards"
      rule: "Use measured species release or an independently evidenced factor on the identical actual activity basis, operating state, control and receptor. Retain factor original/version/unit/applicability, fuel density/composition/carbon origin, source state, uncertainty and carbon balance. Species factor already expressed per fuel kg is not multiplied again by carbon fraction or fate proportion. Do not infer emissions of oil constituents from waste carrier mass. Screen actual on-site combustion, corona and maintenance: additional measured/evidenced species, nonoverlapping particle size intervals and first receiving media need precise cards before complete use. Missing speciation/factor is a gap, not zero or a default. Supplier/service/off-site emissions remain in background datasets only."
      inputs:
        - cp_release
        - cp_support
        - Q
      output: "Species kg/Q by actual first environmental receptor"
      source_ids: []
    - id: land_quantity
      applies_to: "industrial_occupation"
      rule: "Survey foreground land polygons and dates; sum disjoint area times actual occupation years and causal share once/Q. Do not multiply asset lifetime share again into already current-period land occupation. Current actual land transformation, where present, needs separate from/to land-class cards in m2 with event evidence; existing installed-network history does not imply a new annual transformation. Supplier land burdens already included in equipment/service background datasets are not copied. After physical polygon subdivision, dedicated area has share 1. A truly shared footprint uses this service reserved occupied-equipment footprint area-time / the corresponding all-beneficiary area-time in the same period, documented by layout/reservation and equipment records; missing evidence is a gap, not a later choice of driver."
      inputs:
        - cp_land
        - Q
      output: "m2*a/Q"
      source_ids: []
    - id: capital_source_amendment_history
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. This rule completes the existing frozen-history/remaining-life policy; it does not require retrospective replacement of historical life fractions at every life revision. Keep the original asset key, each native-unit source s and version, exact product/event gate, all beneficiary-period cohorts c, immutable raw measurements and accepted postings. Before actual final retirement, life/utilization revisions freeze historical fractions and allocate only the remaining fraction using the existing evidenced remaining driver; require 0<=F_prev_all<=1 and include the current interval and all future beneficiaries in the positive remaining denominator. A late first-observed capital source uses each historical accepted fraction and the same remaining ledger, not a full event-year charge. Use the existing reserved rated capacity times service hours, in the fixed capacity unit and with all beneficiaries; a dedicated fixed-capacity asset may use the existing operating-hour reduction."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_final_shares
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At actual final retirement set w_c=u_actual_c/U_final with U_final=sum_all_original_beneficiaries(u_actual)>0; all final shares sum to one, including non-study/failed/standby responsibilities already prescribed by the original driver. A transfer to continued use is not final retirement. Zero or unknown lifetime activity, unsupported prior fractions or missing original cohorts prevents final allocation; retain raw totals and the gap, never equal-split or invent use."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_source_revision
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For source correction before retirement use each original cohort accepted fraction g_c; at final retirement use g_c=w_c. Q_s,new is the evidenced FULL source quantity before allocation in its original card unit, not a remaining unallocated balance or a previously weighted amount. B_s,c is the actual previously booked attributed raw quantity for that source/cohort, with its quantity/model version and previous normalized result. Calculate A_s,c,new=Q_s,new*g_c and delta_A_s,c=A_s,c,new-B_s,c. A newly observed source has B=0 where unposted; a correction to an existing source replaces that source ID, not an additional purchase or disposal event. The shortcut (g_new-F_booked)*Q_s is valid only when the source quantity and linked model version are unchanged and B=F_booked*Q_s; otherwise use A_new-B. Reconcile physical gross receipt/stock/transfer/handover separately; signed corrections are model amendments, never negative physical exchanges or substitution credits. For a changed linked supply/treatment model, replace the affected original-cohort inventory/results even if delta_A=0; remove the previous model contribution and record both versions and scope."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_normalization
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Normalize the complete revised attributed amount once by the original cohort current verified reference denominator N_c (Q, D or A as locally named). If N_c itself changes, replace the complete old normalized result; do not add delta_A/new_N to a result based on old_N. Zero-output events retain their already prescribed causal parent; a parent without positive N_c retains raw attributed totals and an incomplete normalized result, never shifts to an unrelated positive-output period."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_scope
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Apply this to each actual capital-origin source covered by the existing gates, including separately counted initial fill, post-acceptance capital-site events and actual retirement carriers where present; do not create new sources, extend background boundaries, duplicate included supply stages or apply lifetime fractions to routine operation. These are explicit candidate accounting rules, not claimed numerical requirements of the cited classification or technical sources."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: period_and_acceptance
      applies_to: "all inventory rows"
      requirement: "Use one synchronized complete consecutive 12-month period. Q excludes rejected/test/out-of-scope and repeated internal transfer. Do not invent outage service; retain actual outage maintenance, failed work and F_fail burdens on accepted Q. Declare quality, missing intervals and counterflow method."
      evidence: "cp_energy; cp_support"
    - id: backup_configuration
      applies_to: "loss_electricity; aux_electricity; support_electricity; diesel; co2_fossil; service_output"
      requirement: "Retain the generator register, dated wiring and anti-backfeed/interlock verification plus matched generator/receiving-load meters over all backup operation and configuration changes. Prove backup absence from complete equipment/work-order records, or prove exclusive isolated auxiliary/support use. Unknown routing or missing evidence prevents completeness, never assumed zero. Actual commodity-network injection rejects current applicability under service_boundary even if the energy balance closes."
      evidence: "cp_energy; cp_support; equipment register; wiring/interlock and meter evidence"
    - id: no_zero_substitution
      applies_to: "all inventory rows"
      requirement: "Per card distinguish measured zero, not_applicable proven by complete configuration/contract/work-order/stock evidence, estimated, missing and unknown identity. Quantify gap coverage and uncertainty; unknown residual, gas term, provider gate, allocation denominator or receiver prevents completeness. Do not treat examples, estimates or legal limits as defaults; no default numbers are supplied."
      evidence: "completeness register; uncertainty"
    - id: foreground_inventory_completeness
      applies_to: "all inventory rows"
      requirement: "Check each real foreground-crossing object, direction, type, sole property/unit and ownership. Do not prelist background manufacture/transport/treatment constituents or species; do not omit actual additional site material, reinforcement, fuel, intact retired carrier or release: add specific bilingual cards/protocols when present before completion. Provider-gate matrix proves no assembly/component, service/energy or removal/waste duplication."
      evidence: "cp_assets; cp_services; cp_support; cp_waste; cp_release"
    - id: identities_and_language
      applies_to: "all inventory rows"
      requirement: "Concrete unbound candidates are not verified database identities. Before complete active use direct-read each UUID, official EN/ZH name, type, state, property, unit and compartment with hash-bound evidence. Historical alternating-current binding is point-of-use only, never inherited by entry electricity or transmission service. Record full semantic translation review separately from Chinese-presence/official-name checks; markers do not approve science or publication."
      evidence: "row-specific identity register; bilingual semantic audit"
validation_rules:
  - rule_id: validate_custody_balance
    applies_to: "original-cohort waste custody and actual losses"
    rule: "Verify custody_mass_balance and custody_loss_link with dated original-lot stocks, actual handover receipts, paired movements, calibrated loss evidence and propagated uncertainty. Distinguish evidenced L from unexplained epsilon and block unqualified completion for unresolved quantities, identity or fate. Verify that G=10, H=9, L=1 with other terms zero closes, H stays 9, each release appears once at its first medium, and allocation/normalization does not alter raw physical closure."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "service_output; cp_energy"
    rule: "Require positive Q, explicit gates/actual voltages, all qualifiers and sole service_output. Reference, cards, protocols and formulas use 1 kWh accepted service; pass-through electricity is memorandum only."
    source_ids: []
  - rule_id: validate_reconciliation
    applies_to: "all inventory rows"
    rule: "Verify energy balance, counterflow/auxiliary sources, SF6 carrier/species stocks, equipment initial-fill exclusions, service shares/asset history and original-cohort waste handover. Require matched generator/load meters, wiring and anti-backfeed/interlock evidence; backup supply to Q, L, F_fail or E_transfer rejects current applicability even when the balance closes. Missing isolation/source evidence or unexplained residual prevents completeness; no duplicate allocation/factor/normalization. Purchased background links have explicit gates, separating site and background accounting."
    source_ids: []
  - rule_id: validate_capital_amendment
    applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
    rule: "Verify the original driver, freeze/remaining ledger, actual final w, each source full Q_s/B/version, original N and whole normalized-result replacement under capital_source_amendment. Recalculate unchanged-quantity share corrections, changed quantity with unchanged share, changed model with zero physical delta, corrected original N and zero-output cases; verify mutually exclusive capital/recurring components and all beneficiaries. Missing traceable old postings or positive denominators remains incomplete; prohibit disposal-year fallback, negative physical flows, duplicate normalization or second shares."
    source_ids: []
  - rule_id: validate_semantics
    applies_to: "all inventory rows"
    rule: "Compare EN/ZH and generated guidance for boundaries, row IDs, directions/types, sole property/unit, conditions, protocols, formulas and obligation strength. All mandatory obligations belong in supported source tables and projection; do not patch structured. Aligned/schema/markers do not approve methodology; resolve candidate identities and background-link gaps before complete use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground-boundary transmission-service inventory per accepted kWh, including service-attributed delivered network capital"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Combine with separately owned generation of accepted commodity Q only after proving that all Q comes through the external entry interface, backup generation supplies isolated auxiliary/support loads only, and gate, voltage, provider-inclusion and background-link checks pass. Actual backup network injection requires a separate generation interface and renewed applicability assessment before combination."
  excluded_use: "Generation factor; backup generator feeding commodity network under current configuration; delivered electricity commodity; distribution; DC/cables; independent storage/FCAS; automatic whole-leaf coverage; completed lifecycle claim without background linkage"
  required_metadata: "All qualifiers; Q/L/F_fail/E_transfer/A; E_onsite_to_aux and separate backup support supply; generator/load meters and dated isolation/anti-backfeed evidence; meter map; period; supply/service gates and inclusions; measured original asset quantities/service-share history; SF6 species stocks; waste custody/handover and background links"
  required_quality_disclosure: "Meter/gas uncertainty; background-link coverage/gaps; source age; asset-allocation sensitivity; row identity status; actual site/conditional activity coverage; semantic translation and actual review status"
  update_trigger: "Network/gate/voltage change; provider-gate change; asset-life/service-share revision; maintenance contract or gas technology change; on-site treatment/generation; new release/land transformation; material meter error"
data_sources:
  - id: "unsd-cpc-69111"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 subclass 69111, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/69111"
    used_for: "Classification scope and generation/distribution distinction; this PCR intentionally narrower."
  - id: "ghg-td-losses"
    type: "official_guidance"
    reference: "GHG Protocol Calculation Tools FAQ, T&D loss question, https://ghgprotocol.org/calculation-tools-faq"
    used_for: "Distinguish network-loss electricity from pass-through commodity; corporate scopes are not complete LCA."
  - id: "epa-sf6-2018"
    type: "official_guidance"
    reference: "US EPA, Overview of SF6 Emissions Sources and Reduction Options in Electric Power Systems, August 2018, pp. 6–9 and p. 6 footnote 11, https://www.epa.gov/sites/default/files/2018-08/documents/12183_sf6_partnership_overview_v20_release_508.pdf"
    used_for: "SF6 equipment/handling and species mass-balance structure; no numerical defaults adopted."
  - id: "hitachi-transformer-2022"
    type: "literature"
    reference: "Hitachi Energy Italy, EPDITALY0319, Mineral and vegetable oil immersed transformers (40 MVA), 15 March 2022, pp. 5–8, 10–12, 24, https://www.epditaly.it/wp-content/uploads/2016/12/EPD_40MVA_Hitachi_rev3-11.03.2022-29.04.2022bis.pdf"
    used_for: "Qualitative delivered-transformer and stage-gate context only. Case is not default specification/mass/composition/life/recovery; does not mandate foreground component decomposition."
  - id: "epa-electricity-delivery"
    type: "official_guidance"
    reference: "US EPA, Electricity Delivery and its Environmental Impacts, https://www.epa.gov/energy/electricity-delivery-and-its-environmental-impacts"
    used_for: "Qualitative equipment, site maintenance, vegetation and SF6 screening; exact foreground scope/collection/allocation are PCR choices."
  - id: "nexans-overhead"
    type: "literature"
    reference: "Nexans, Bare Overhead Conductors (AAAC, AAC, ACSR, ACSR-II), https://www.nexans.us/en/Product-Datasheets/Utility-Transmission-Distribution/Bare-Overhead-Conductors.html"
    used_for: "Supports distinguishing conductor technologies. ACSR enters as specified complete conductor metres, without universal composition/weight or treating AAAC/AAC as identical."
