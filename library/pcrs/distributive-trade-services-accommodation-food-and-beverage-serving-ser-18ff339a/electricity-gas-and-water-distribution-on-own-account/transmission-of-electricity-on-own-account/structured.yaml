measurement_rules:
  - id: service_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Q is positive accepted exit-meter energy in the matched period. Service output is 1 kWh. All exchange amounts divide once by Q; memorandum entry/exit energy is not an exchange. The official energy property is used as the local electrical-energy-throughput convention for this service; it does not mean combustion heat, commodity output or verified transmission-service identity."
  - id: energy_conversion
    applies_to: "loss_electricity; aux_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Use meter CT/PT multipliers once; 1 kWh = 3.6 MJ and 1 MWh = 1000 kWh. Retain raw and corrected units. Electrical losses are energy consumption, not an elementary emission of electricity."
  - id: gas_mass
    applies_to: "sf6_supply; sf6_reusable; sf6_spent; sf6_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh net gas streams excluding cylinders. Product and waste exchanges use actual total gas-stream kg. In the separate species ledger only, multiply each event/stock total by its measured SF6 mass fraction once. The air elementary flow uses kg SF6. No implicit purity of one is allowed; unknown composition or identity blocks completion."
