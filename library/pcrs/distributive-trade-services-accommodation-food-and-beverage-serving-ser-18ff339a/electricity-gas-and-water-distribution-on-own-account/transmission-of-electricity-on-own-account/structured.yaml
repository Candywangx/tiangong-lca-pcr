system_boundary:
  rules:
    - rule_id: service_boundary
      applies_to: "all inventory rows"
      rule: "Foreground comprises the declared AC overhead network operation, operational/on-site SF6 handling, and operator-responsible maintenance/support within its gates. Keep existing exclusion of DC/cable routes and independent storage/conversion/FCAS outputs; do not dilute their burdens into Q. Commodity generation and downstream distribution remain background/outside. On-site backup generation is permitted only for station auxiliary or site-support loads electrically isolated from commodity-network injection; it must not supply Q, L, F_fail or E_transfer. Actual network injection makes the current configuration inapplicable: establish a separately metered generation interface outside this service boundary and reassess applicability before use; do not continue with the current whole-Q commodity combination."
      source_ids:
        - unsd-cpc-69111
    - rule_id: commodity_ownership
      applies_to: "loss_electricity; aux_electricity; service_output"
      rule: "The commodity supplier/downstream model owns generation of accepted Q, which must be supplied entirely through the external entry interface under service_boundary. This service owns external-source electricity L, F_fail and purchased auxiliaries/support, plus actual fuel/releases of isolated auxiliary/support backup generation. No on-site generated portion may enter Q, L, F_fail or E_transfer. External E_transfer needs documented recipient/handoff and separate generation owner. Rejected/test network energy without recipient is F_fail; backup auxiliary/support consumption stays in its own load account. Never book all entry electricity plus L/F_fail again. Electricity providers must exclude this same network segment and its assets/losses; adjust a bundled dataset before combination."
      source_ids:
        - ghg-td-losses
    - rule_id: foreground_exchange_gates
      applies_to: "network_support"
      rule: "Retain specified complete network equipment/conductor and concrete as actual delivered foreground inputs with allocated quantities; each card has one object/property/preferred unit. An assembly is not split because it contains multiple materials. Supplier mining, manufacture, assembly and included delivery remain within matched background input datasets. Do not recreate supplier material, fuel, transport, vehicle/road/tool capital or off-site treatment inventories. Each actual specification/configuration needs its own instantiated dataset identity and quantity record; do not merge unrelated equipment or substitute another conductor/oil/gas technology. Actual additional foreground inputs require specific bilingual cards and identity gaps before completion."
      source_ids: []
    - rule_id: provider_deduplication
      applies_to: "all purchased inputs"
      rule: "Document each provider dataset/contract gate and inclusions of equipment components, initial fill, delivery, energy, travel, maintenance and waste removal. Book an included burden once. Tower excludes conductor/foundation; transformer includes initial oil; breaker includes initial gas; separate oil/gas inputs are only actual additional supplies. Concrete excludes reinforcement; collect actual rebar separately when present. Calibration and mechanical clearance have their explicit service gates. If a provider boundary cannot be disaggregated without overlap, retain an explicit gap and withhold completeness rather than assume zero."
      source_ids: []
    - rule_id: waste_handover
      applies_to: "all waste rows"
      rule: "Waste is inventoried as its actual characterized carrier once, from current generation through custody to documented foreground receiver handover. Off-site processing, transport beyond that gate, destruction, recovery and disposal inputs/emissions are linked background requirements, not expanded foreground. Do not create hypothetical receiving cards or final species from contained substances. An off-site background treatment dataset must match carrier, composition, quantity and handover and exclude transport or removal already included by a supplier. Pending handover is disclosed as inventory, not fabricated receipt. Actual on-site treatment changes the foreground and requires specific input/output cards before completion."
      source_ids: []
    - rule_id: conditional_gas
      applies_to: "gas_handling"
      rule: "Apply all gas records when SF6 equipment, stocks or handling exist, including actual on-site commissioning/retirement. Absence requires complete equipment/stock/work-order evidence. Initial gas delivered inside equipment is a memorandum bank inflow, with background supply already in that equipment input. Later externally supplied gas uses sf6_supply. Do not infer air release from outgoing waste or ignore on-site handling because equipment manufacture is background."
      source_ids:
        - epa-sf6-2018
boundary_abstraction:
  declared_starting_condition: "Electricity already available at entry meters; defined installed network and operating period; delivered network equipment enters with service attribution, without supplier-internal expansion."
  starting_condition_role: "transmission_service_entry_gate"
  product_classification_scope: "Narrower than CPC 69111: no independent storage/conversion or separately supplied FCAS outputs."
  recursive_input_rule: "Adjacent transmission is outside selected meters; loss/auxiliary supply excludes this segment, with no self-recursion. Specific equipment, materials and defined services enter only at supply/acceptance gates; do not expand their manufacture, transport or disposal."
  upstream_dataset_requirement: "Matched background data for loss/auxiliary electricity, actual delivered complete network equipment, maintenance supplies and defined services; match waste background treatment to actual carrier/composition/handover. Record inclusions and gaps per input to prevent duplicate energy, delivery, components, initial fill and removal."
  disclosure: "Gates, voltage, topology, uncertainty, Q/L/F_fail/E_transfer/A, energy sources, provider gates, original equipment service shares, on-site gas bank and waste handover status; foreground-only inventory does not mean zero background burden or a completed lifecycle."
