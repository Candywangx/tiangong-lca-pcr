system_boundary:
  rules:
    - rule_id: boundary_service
      applies_to: "foreground_system_boundary"
      rule: "Foreground comprises operation between the named AC inlet and customer acceptance gates, plus operator-responsible on-site servicing. Transmission, generation of accepted commodity Q, end use, new-meter installation, independent meter reading, storage/conversion and independent ancillary services remain excluded. Necessary protection/control and existing-meter maintenance remain included."
      source_ids:
        - un-cpc-69112
        - epa-electricity-delivery
    - rule_id: boundary_foreground
      applies_to: "foreground_system_boundary"
      rule: "Inventory exchanges crossing those foreground gates and actual releases. Purchased specific equipment, materials and services enter as defined products with one primary property/unit. Do not expand supplier manufacture, mining, delivery travel, roads/tools/vehicles or receiver treatment internals. Capital is retained only as specified commissioned network assets with measured mass and one supported lifetime share; upstream inventories matching that commissioned gate supply its background burden. This foreground choice is not a claim of zero background burden or a source-mandated EPD boundary."
      source_ids: []
    - rule_id: boundary_loss_commodity
      applies_to: "foreground_system_boundary"
      rule: "Link upstream generation once for technical losses L_s, physically confirmed nonaccepted delivery F and auxiliary A_s attributable to this service. Generated commodity Q is linked separately once by a combined commodity system. Other-network export X retains its own commodity and conveyance burden; do not divide that burden by customer Q. A supplied electricity dataset already including this segment losses/assets cannot be stacked with this service."
      source_ids: []
    - rule_id: boundary_atomic
      applies_to: "foreground_system_boundary"
      rule: "Atomic means one defined measurable object with one primary flow property and one preferred unit, not chemical decomposition of complete equipment or one characterized waste carrier. Independent inputs remain separate even if both use kg. Different media, directions, gas formulations and independently supplied services require separate cards. Actual absent exchanges require evidence; unknown is not absent."
      source_ids: []
    - rule_id: boundary_gas
      applies_to: "foreground_system_boundary"
      rule: "Use the actually owned/operated equipment and cylinder stock boundary, including measured gas entering/leaving inside accepted equipment. Integral initial SF6/oil is within the commissioned asset input, never a second purchased material input. All foreground release events including servicing remain measured by species. Supplier preacceptance commissioning/filling and receiver destruction are outside this gate. An unresolved boundary or missing charge/composition prevents a complete balance. Regulatory thresholds are not cutoffs."
      source_ids:
        - epa-sf6-balance
    - rule_id: boundary_waste
      applies_to: "foreground_system_boundary"
      rule: "Waste ends at actual documented external handover. Record one characterized carrier, its origin, opening/generation/dispatch/closing stock, receiver gate and downstream linkage requirement; retained stock is not an observed future handover. No paired receiver inputs or invented off-site reagents/emissions. A complete lifecycle model may later link a matching treatment dataset once; do not confuse this foreground-only dataset with a complete treatment footprint. Treatment physically inside the operator gate must be explicitly added with its own actual exchanges before completeness."
      source_ids: []
    - rule_id: boundary_interfaces
      applies_to: "foreground_system_boundary"
      rule: "Separate co-located storage, conversion and independently supplied ancillary services with meters and asset/work-order gates. Internal cycling does not increase Q. Missing separation prevents completion. Background product/service coverage must specify supplied resources/stages and exclusions, so actual operator-provided resources are recorded once while included supplier resources are not repeated."
      source_ids:
        - un-cpc-69112
