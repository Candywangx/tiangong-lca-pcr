measurement_rules:
  - id: reference_energy
    applies_to: "accepted_distribution"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Use cp_energy: Q is accepted active energy at named customer points, not inlet energy, apparent energy, capacity, fees or meter-reading count. Q must be positive. Adopt the Net calorific value property and energy unit group already used by an official electrical-service record as an energy-throughput service convention; this is not combustion heat. The service product UUID remains unbound and cannot borrow a transformation-service identity with different voltage boundaries."
  - id: energy_conversion
    applies_to: "aux_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the verified electricity flow property; kWh × 3.6 = MJ. This is the electrical-energy reporting convention, not a claim that electricity has a combustion heating value. Convert the numerator only and retain the same reference denominator."
  - id: material_conversion
    applies_to: "sf6_makeup; oil_makeup; waste_oil; sf6_for_destruction; recovered_sf6_product; sf6_air; oil_soil"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Liquid volume-to-mass needs batch density at applicable temperature; gas containers need tare removal and measured composition conversion to species mass. Never multiply pure-species mass by concentration again. Missing or negative reconciliation results cannot be set to zero."
