system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all processes"
      rule: "Apply only to own-account local mains/services distribution of dry fossil natural gas already conditioned and odorized at the city-gate inlet. Include pressure reduction, electric boosting/heating where present, leak surveys, meter maintenance and emergency work up to accepted customer custody meters. Declare exact gates, ownership, gas quality, pressure and acceptance."
      source_ids:
        - un-cpc-gas-distribution
        - eia-gas-delivery
    - rule_id: boundary_exclusions
      applies_to: "all processes"
      rule: "Exclude gas manufacture/processing, transmission, bulk storage, LNG/cylinders, customer combustion, fee distribution and standalone meter products. Distribution-gate operational fuel combustion, flaring, purification or onsite odorization makes this narrower profile inapplicable; never call an actual excluded operation zero."
      source_ids:
        - un-cpc-gas-distribution
        - eia-gas-delivery
    - rule_id: boundary_service
      applies_to: "gas_makeup; accepted_service"
      rule: "The service inventory carries the main commodity in a custody/stock ledger, not purchased-gas and sold-gas inventory cards. The separately identified commodity model owns accepted deliveries, rejected commodity transfers and off-spec supplier returns, with source/stock carry-forward preventing duplicate upstream production. This distribution service owns city-gate supply burden of actual unrecovered physical losses and confirmed unrecovered unauthorized withdrawals through gas_makeup once; the commodity model must exclude both quantities. Unauthorized custody transfers remain in the physical ledger, outside accepted D and direct gas emissions. Invoice residuals and linepack changes are not automatically emissions or replacement gas."
      source_ids: []
    - rule_id: boundary_foreground
      applies_to: "distribution; maintenance"
      rule: "Inventory boundary exchanges of operated network and actual on-site maintenance. Specific delivered complete assets, characterized solutions and defined external services may remain whole when one measurable object has one primary property/unit. Remove supplier manufacture/mining, provider vehicle/road/tool manufacture, provider transport chains and off-site receiver treatment internals. This is a foreground model; later matched background links carry their upstream burdens without duplicating a foreground input."
      source_ids: []
    - rule_id: boundary_assets
      applies_to: "maintenance"
      rule: "Retain original network pipe, regulating station and independent metering assets as specified delivered product inputs plus the separately defined pipe-installation service. Establish nonoverlapping acceptance lists, physical units, supplier/contract gate and actual original quantity; an integrated meter/connector/coating is not a second input. Capital delivery packaging removed by the supplier stays in its service gate; packaging actually retained/generated by the foreground requires a specific material/waste card and stock/handover records before complete use. Attribute continuing asset service by capital_share. Do not omit the same replacement merely because finance calls it capital or expense. Direct consumed maintenance seals/oil/calibration gas/test water use actual consumption; a persistent replacement asset receives its own original key and asset share, never both."
      source_ids: []
    - rule_id: boundary_contracts
      applies_to: "maintenance; electricity"
      rule: "For each purchased service collect actual contract specification, primary unit, delivery/acceptance gate and included supplies, energy, travel, maintenance, waste and direct-release coverage. Foreground-supplied excluded items are recorded separately once; provider-included items are not repeated. Meter only net external purchased electricity used by foreground operations/maintenance after excluding service-provider included supply. Actual unlisted foreground inputs/releases require specific reviewed cards; a missing contract item is a gap, not permission to ignore it."
      source_ids: []
    - rule_id: boundary_waste
      applies_to: "all waste outputs"
      rule: "Record each actual characterized waste carrier once at documented foreground stock/removal and handover gate, with receiver and accepted mass; do not also output its contained substances. An intact removed meter/station may be one characterized carrier. No assumed dismantling into pure fractions or paired future treatment-receipt card. Off-site receiver treatment/haul resources and emissions are background, not current foreground exchanges. Actual on-site treatment/discharge needs an explicit reviewed process and release/waste cards before complete use."
      source_ids: []
    - rule_id: boundary_compartment
      applies_to: "all elementary outputs"
      rule: "Assign each physical release to its first technosphere-to-environment interface: air vent/open leak to air; buried direct release to soil. These event amounts are mutually exclusive; later soil-to-air migration is not a second distribution emission. A surface/plume reading alone does not prove total buried source loss. Unknown medium or retained/transformed gas is a gap needing reconciled source measurement."
      source_ids: []
    - rule_id: boundary_species
      applies_to: "distribution; maintenance"
      rule: "Keep separately identified actual chemical species and first receiving medium. The gas-composition cards are conditional on an assay/event demonstrating that species release; no default fractions or automatically populated minor species. Additional actual constituents require a specific card and aligned protocol/calculation/translation. Calibration-mixture releases are separate from network-gas events and are never replacement-gas losses."
      source_ids: []
    - rule_id: boundary_transfers
      applies_to: "distribution"
      rule: "Recovered network gas may only be reinjected within the same network under this profile: match recovery/reinjection IDs and cancel internal quantities without credit. Identify separate commodity-model responsibility for every supplier return by custody ID, quantity, receiving gate and destination. External recovered-gas/nitrogen exports or gas waste treatment require reviewed specific product/waste transfers and gates before use; do not omit actual transfers. A second distribution segment needs nonoverlapping gates/loss ownership review."
      source_ids: []
