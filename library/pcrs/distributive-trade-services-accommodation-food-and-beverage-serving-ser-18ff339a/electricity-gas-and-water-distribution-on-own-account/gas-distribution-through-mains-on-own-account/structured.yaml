allocation_rules:
  - rule_id: allocate_direct
    applies_to: "all inventory rows"
    rule: "Subdivide independently metered network/station/jobs first; directly assigned quantities have share 1. Common purchased electricity uses submetered actual use first, otherwise measured device kW times actual operating/standby h reconciled to the common meter. Remaining shared recurring maintenance materials and calibration work use this network recorded performed technician-hours / the same all-beneficiary job technician-hours once. Dedicated transport is assigned directly; a shared crew trip uses this network actual technician passenger-km / all-beneficiary passenger-km for the same trip, with empty positioning tied to its evidenced carried-service cohort. Do not choose a different driver later or repeat a share on already assigned activity. Original capital-site events use foreground_site_attribution instead. Missing/nonpositive denominators are gaps, not equal or price allocation."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "asset_pe_pipe; asset_steel_pipe; asset_station; asset_customer_meter; pipe_installation"
    rule: "Use capital_share for each retained original stationary asset and its installation once. Preserve original quantity/specification/key, commissioning date, evidenced life estimate, all-user time/service ledger and prior allocations. No nested provider vehicle/road/tool supporting-capital inventory is collected. Quantitative lifetimes or masses are site evidence, never defaults. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
    source_ids: []
  - rule_id: allocate_losses
    applies_to: "distribution"
    rule: "Assign each leak/vent and confirmed unauthorized-withdrawal event to responsible segment and original period once; shared measured amounts use accepted normal-volume throughput after physical subdivision. The service bears the city-gate production burden of unrecovered U_mass together with physical_loss_mass, normalized by accepted D, without adding U to D or treating U as an emission. Rejected delivery, failed maintenance/testing and emergency work burden accepted D. No co-product or avoided-gas/recycling credit. Accepted commodity-gas production and supplier-return accounting remain in the separate commodity model; it must not count gas_makeup again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_gas
      process_id: "distribution"
      flow_role: "accepted_service; gas_makeup"
      record_type: "Custody and stock ledger"
      raw_fields: "meter ID; gate; timestamp; direction; acceptance/rejection; returns; Va/Vn; correction status; Pa; pw; Ta; Zn; Za; dry composition; density; Hn; gross/net ratio; linepack opening/closing; internal transfers; source/grade; off-spec supplier-return receiver and receiving gate; exact external commodity-model ID; physical transfer quantity; burden/responsibility proof; original acceptance/event ID and cohort; gross G; actual customer R and return timestamp; supplier Sret; other Oin/Oout source/receiver and ownership; confirmed unauthorized U event/gate, metering method, duration, measured normal volume, density/composition, uncertainty, recovery ID/quantity/date and original event link; S0/S1; correction version and original/revised D and U_mass; commodity-model exclusion proof for gas_makeup;"
      collection_method: "Read calibrated custody meters and synchronized linepack model/instrument records; inspect certificates and source/grade assays. Sample each source/grade change and monthly stable operation; verify actual pressure/temperature, dryness and composition-specific compressibility and density. Reconcile delivery specification and signed acceptance separately from invoices. Read each return and unauthorized-transfer/recovery at its actual custody gate/time using calibrated measurement, retaining raw readings and state conversion. Require independent event evidence of unauthorized transfer, its period/duration and recipient, or explicitly unknown recipient, separately from meter imbalance. A reviewed site-specific estimate needs method/source/uncertainty and sensitivity; unsupported U remains unresolved, never reclassified as leak. Record monthly occurred/absent/unknown for each transfer class with supporting evidence; unsupported absence is not zero. Reconcile transfer and recovery IDs to original acceptance/event cohorts and version both the denominator and linked inventory corrections."
      unit: "m3; kg; Pa; K; MJ/m3"
      frequency: "interval meter data; monthly reconciliation; every grade change"
      temporal_coverage: "one complete consecutive 12-month window including outages"
      site_scope: "all city gates; customer custody meters; same network linepack"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; meter configuration; signed acceptance; assays; uncertainty; stock and transfer reconciliation"
    - protocol_id: cp_release
      process_id: "distribution"
      flow_role: "nitrogen_purge; network gas elementary outputs"
      record_type: "Event and leak survey register"
      raw_fields: "event/component ID; source; start/end; repair/recheck; rate and unit; whole/species factor flag; method; uncertainty; sample time; dry composition; species density; THT kg/m3; nitrogen opening/closing stock, issued/returned and actual injected kg; nitrogen kg recovered/retained/emitted; first recipient air/soil/unknown; buried depth/path; source-loss determination; dry mixture compressibility; species molar mass; capture; overlap ID; original asset/event key; operational/capital-site phase; alpha or current beneficiary share;"
      collection_method: "Survey all in-scope mains/services, valves and meter/regulator equipment at least annually and after each repair/incident. Measure calibrated leak/vent flow; integrate documented actual event durations including time before detection with evidence-based uncertainty. For inaccessible leaks use reviewed component/material-specific site estimation with source and uncertainty, not a universal default or unexplained gas balance. Record every blowdown, purge and emergency event; verify representative gas assay for each event regime and additional event samples when different."
      unit: "m3; kg; h"
      frequency: "every event; annual full survey; repair recheck"
      temporal_coverage: "same full 12 months including unattended intervals and emergencies"
      site_scope: "all in-scope segments, stations, meters, vents and purges"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrations; detection limits; event durations; assays; signed repair logs; first receiving medium and buried-path evidence; source-loss method; capture and overlap reconciliation"
    - protocol_id: cp_energy
      process_id: "distribution"
      flow_role: "electricity"
      record_type: "Point-of-use purchased-power ledger"
      raw_fields: "meter; timestamp; net accepted kWh; grid receipts/returns; device; voltage; actual kW and operating/standby h; service contract exclusions; network/job beneficiary key"
      collection_method: "Read calibrated interval meters; reconcile gross external supply and its returns with invoice and common meter. Split actual network/maintenance use from supplier-included service electricity; use actual kW/h only for unmetered inseparable shares and reconcile total. No onsite generation assumed."
      unit: "kWh; MJ"
      frequency: "each interval; monthly closure"
      temporal_coverage: "same complete consecutive 12 months as D"
      site_scope: "all foreground points of use"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; provider gate; meter/invoice and allocation reconciliation"
    - protocol_id: cp_assets
      process_id: "maintenance"
      flow_role: "asset_pe_pipe; asset_steel_pipe; asset_station; asset_customer_meter; pipe_installation"
      record_type: "Original accepted asset and installation ledger"
      raw_fields: "original asset key; configuration/BOM acceptance scope; included/excluded parts; mass or installed length; weighing or item count × verified mass; supplier acceptance gate; original delivery/commissioning date; acceptance certificate; active days/h; all-user reserved dry-normal-volume capacity and reservation/availability h; matching capacity-hour totals; evidenced life estimate and uncertainty; prior fractions; remaining fraction; replacement/disposal link; service included materials/energy/travel/waste ; source-specific B/version and original N fields in cp_capital_amendment"
      collection_method: "Inspect original delivery, site drawings, equipment tags and accepted work certificates; weigh each defined asset or reconcile verified module/unit masses and accepted count, never invent machine weight. Measure route length from signed as-built sections. Cover existing and new assets, audit all-beneficiary ledgers and life evidence; missing original stock evidence is a tracked gap. Review remaining life annually and at configuration/retirement changes. Complete cp_capital_amendment reconciliation for final settlement and source/denominator revisions."
      unit: "kg; m; item; day; h"
      frequency: "each delivery/replacement; monthly use; annual life review"
      temporal_coverage: "current D window plus persistent original asset service history"
      site_scope: "in-scope mains, stations and independent meters only"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; supplier mass evidence; accepted as-built records; driver reconciliation; life-estimate source and prior-period true-up log"
    - protocol_id: cp_capital_amendment
      process_id: "maintenance"
      flow_role: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      record_type: "versioned_original_source_and_cohort_ledger"
      raw_fields: "asset_ID; source_ID and original row_ID/native unit; original acceptance/event gate; full measured source quantity and old/new versions; measurement/calibration/state basis; each original beneficiary-period/driver unit/u_actual; period b where applicable; all past/future beneficiaries; F_prev_all and remaining_driver; accepted g/F_booked; raw booked B; old normalized result/original N and corrected N; background model versions/scope; actual final retirement evidence; A_new/delta_A/replacement/deduplication links"
      collection_method: "Collect original records at asset/supplier acceptance, actual site events and receiver handover gates as applicable; verify full quantities through the existing cp_assets weighing/configuration-count/length/driver measurement and calibration methods. At every source/life/model/denominator revision and final retirement, compare old/new records for every original cohort and apply capital_source_amendment. Reconcile all-beneficiary fractions, source totals and each amendment link; the service data custodian reviews and signs the reconciliation. Prove nonoccurrence by complete event registers/zero-activity evidence, never absence-as-zero; retain unresolved identities, measurement uncertainty and incomplete causes."
      unit: "source-native units; fixed driver units; original reference units"
      frequency: "each acceptance/event/revision/final retirement; annual reconciliation"
      temporal_coverage: "complete original asset history and original service cohorts; evidenced remaining life"
      site_scope: "existing foreground gates and capital-source responsibility only"
      aggregation_rule: "once per original reference flow"
      quality_evidence: "raw measurement/calibration; signed acceptance/event/receiver records; source/model versions; all-beneficiary and revision reconciliation ledger"
    - protocol_id: cp_maintenance
      process_id: "maintenance"
      flow_role: "seal_nitrile; lubricant; calibration_mix; test_water; calibration_methane_air; calibration_nitrogen_air"
      record_type: "On-site job consumption and release ledger"
      raw_fields: "job/date/asset; material/grade/state; opening stock; receipts; unused returns; closing stock; issued/actually consumed kg; calibration certificate composition and molar masses; cylinder before/after mass; recovered/retained/actually released gas; first air interface; test inlet meter/density/temperature; service included scope; beneficiary driver; uncertainty unique original source job/asset; recurring/capital-site tag; all-beneficiary performed technician-hours;"
      collection_method: "At each actual job weigh issues/returns and cylinder stocks, inspect certified mixture and calibrated testing-water meter; convert volume using actual water density at recorded temperature and formulation where relevant. Reconcile consumed material with waste/retention; calibration mixture methane+nitrogen masses close separately from pipeline-gas ledger. Exclude provider-included supplies/releases; missing composition or release fate is unresolved."
      unit: "kg; m3; K"
      frequency: "every job; monthly stock closure"
      temporal_coverage: "same complete 12 months as D"
      site_scope: "actual foreground on-site maintenance only"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scales/meters; signed job and stock logs; certificate; species and water reconciliation"
    - protocol_id: cp_services
      process_id: "maintenance"
      flow_role: "meter_calibration_service; maintenance_transport_service"
      record_type: "Defined service contract acceptance ledger"
      raw_fields: "service/job/provider/contract; exact meter/trip configuration; included/excluded resources/emissions/wastes; raw technician timestamps; accepted h; trip start/end/loaded/empty km; vehicle ID/class; idle-only work; actual beneficiary driver; acceptance; conversion evidence beneficiary technician IDs/counts and each carried leg km; linked empty leg/service cohort;"
      collection_method: "Verify service scope at contract and each acceptance; record actual calibrated technician work h or odometer/GPS vehicle-km, including attributable empty positioning. For a crew of several technicians use total technician h consistently with provider dataset. Idle-only activity must be assigned to the evidenced trip/service cohort with a nonzero total distance and provider-included idle burden; a wholly zero-distance contract requires a separately reviewed time-based service, not zero inventory. Reconcile one contract input with all excluded foreground supplies and no included-item duplicate."
      unit: "h; vehicle-km"
      frequency: "each actual contract job/trip; monthly reconciliation"
      temporal_coverage: "same complete 12 months as D"
      site_scope: "defined network jobs and their service gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "contract; signed acceptance; technician timesheets; GPS/odometer; provider scope and idle coverage evidence"
    - protocol_id: cp_waste
      process_id: "maintenance"
      flow_role: "waste_pe_pipe; waste_steel_pipe; waste_meter; waste_station; waste_nitrile; waste_oil; waste_pressure_water"
      record_type: "Foreground removal, storage and handover ledger"
      raw_fields: "lot; source job/asset; operational/capital origin; original capital cohort if applicable; actual configuration; attached materials; wet/dry basis; measured carrier kg; sample composition/moisture; opening/generated/closing storage; handover/acceptance date; receiver/site/gate; accepted kg; contractual responsibility; calibration; inventory estimate/true-up status"
      collection_method: "Weigh each actual characterized carrier before handover; verify signed manifests and receiver acceptance without requiring receiver internal treatment records. Reconcile opening stock + generation - closing stock - handover and investigate transit discrepancies. Retained onsite waste is disclosed as stock, never fictitious treatment or environmental emission. Separate actual operational jobs from original capital disposal and apply capital_retirement. If a new actual carrier/onsite release is identified, extend the specific card set before complete use."
      unit: "kg"
      frequency: "each removal/generation/handover; monthly stock closure"
      temporal_coverage: "same D window; original capital history for capital waste"
      site_scope: "foreground generation and documented handover gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "scales; sampling; manifests; receiver acceptance; stock/asset reconciliation; pending gate register"
    - protocol_id: cp_scope
      process_id: "distribution"
      flow_role: "all conditional exchanges"
      record_type: "Occurrence and scope register"
      raw_fields: "site/job/period; asset configuration; conditional row; occurred/absent/unknown; excluded combustion/flare/purification/odorization; actual contract gates; unlisted input/waste/species; evidence; reviewer/date; gap owner/method"
      collection_method: "Cross-check physical equipment, utility purchases, custody/maintenance/emergency logs, service contracts and waste records. Sign each conditional state for every site and full period; unknown never means absent. Actual excluded route rejects this profile; an actual unlisted foreground exchange requires reviewed specific extension. Supplier-internal processes are not converted into new foreground cards."
      unit: "occurrence state"
      frequency: "initial; each change/event; annual closure"
      temporal_coverage: "same full 12-month window"
      site_scope: "all in-scope sites and actual foreground jobs"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed checklist; physical/contract evidence; gap register"
  calculation_rules:
    - id: convert_gas_volume
      applies_to: "all gas records"
      rule: "For an uncorrected wet actual reading: Vn = Va × (Pa - pw)/Pn × Tn/Ta × Zn/Za; Tn = 273.15 K; Pn = 101325 Pa absolute. Collect Pa, pw, Ta, Zn and Za for the same gas/state interval. For already dry readings pw = 0 only with dryness evidence. If instrument already reports this dry normal basis use its Vn unchanged; different normal bases require their documented conversion."
      inputs:
        - cp_gas
        - Va
        - Pa
        - pw
        - Ta
        - Zn
        - Za
      output: "dry normal gas m3"
      source_ids:
        - epa-gas-calculation-2025
    - id: energy_to_volume
      applies_to: "accepted_service; gas_makeup"
      rule: "When only a gas energy total E is available, Vn = E/Hn using contemporaneous measured lower heating value Hn in MJ per dry normal m3 on this PCR basis. Convert energy units before division. A gross-heating-value invoice must first be reconciled with measured gross/net ratio; no generic heating value or fixed density. Do not apply both meter volume and energy-derived volume to the same transfer."
      inputs:
        - cp_gas
        - E
        - Hn
      output: "reconciled normal volume"
      source_ids: []
    - id: gas_balance
      applies_to: "distribution"
      rule: "For each physical month reconcile S0 + C + R + Oin = G + U + Sret + Oout + L + S1 + residual. S0/S1 are opening/closing linepack; C is city-gate supply excluding separately recorded returns; R is actual customer return of previously accepted gas; G is gross accepted outward customer delivery before returns; U is confirmed gross unauthorized outward transfer, not an inferred balance loss; L is measured unrecovered physical leak/vent loss; Sret is actual supplier return; Oin/Oout are other evidenced external receipts/outlets, including returned unauthorized gas and rejected transfers, with exact source/receiver and responsibility model. All categories are mutually exclusive; supplier returns are not customer R. Use gross G here, never net D; R remains a physical inlet in its actual month, even when its acceptance cohort is earlier. Internal transfers cancel. Sum only compatible dry normal volumes and separately reconcile constituent mass with measured densities/composition; changing composition requires mass-based reconciliation. Investigate residual against propagated meter/stock uncertainty; unknown residual is neither confirmed U nor methane nor zero. Externally supplied purge nitrogen has a separate balance and is not natural-gas receipt/loss."
      inputs:
        - cp_gas
        - cp_release
      output: "physical monthly gross gas balance and residual"
      source_ids: []
    - id: accepted_delivery_cohort
      applies_to: "accepted_service; gas_makeup"
      rule: "For each complete 12-month service cohort p, D_p = G_p - R_p in dry normal m3; G_p is gross accepted delivery originating in p and R_p is cumulative actual return linked to those exact acceptance IDs, source/grade and original period, regardless of return date. A credit note without physical return does not create R. Do not deduct supplier returns, rejected/unaccepted transfers or U from D. Record the actual return as current physical inflow/stock, but revise the original cohort D and all its Aj/D amounts once with versioned correction history; do not deduct an earlier-cohort return from unrelated current D. Retain original commodity source/burden on returned stock, without a fresh purchase or duplicate production credit; any later accepted redelivery needs its own acceptance ID linked to that stock. Reconcile cumulative returns against original delivery and block missing links, over-returns or nonpositive D. Later correction/recovery of U similarly revises original U_mass and that cohort gas_makeup; never subtract it from an unrelated current event."
      inputs:
        - cp_gas
        - "original acceptance/event ID"
        - "source/grade"
        - G
        - R
        - U
        - recovery
        - cohort
        - "correction history"
      output: "original-cohort positive net D and versioned inventory correction"
      source_ids: []
    - id: release_species
      applies_to: "methane_air; carbon_dioxide_air; ethane_air; propane_air; n_butane_air; isobutane_air; n_pentane_air; isopentane_air; nitrogen_air; tht_air; methane_soil; carbon_dioxide_soil; ethane_soil; propane_soil; n_butane_soil; isobutane_soil; n_pentane_soil; isopentane_soil; nitrogen_soil; tht_soil"
      rule: "For each nonoverlapping first-interface leak/vent event e, mi = sum(Vn,e × Pn × xi,e × Mi / (Zmix,n,e × R × Tn)) in kg; Vn is dry mixture m3, Pn = 101325 Pa, Tn = 273.15 K, xi is measured dry mole fraction, Mi is species molar mass in kg/mol, R is the SI molar gas constant in Pa*m3/(mol*K), and Zmix,n is this event mixture compressibility at Pn/Tn. Equivalently use independently measured mixture kg times measured species mass fraction, never both methods. Never multiply mixture volume directly by pure-species density unless an independently justified equal-Z approximation and its uncertainty have been reviewed. A species-specific measured mass/rate or species-specific emission factor already includes composition: do not multiply xi again. Integrate each actual rate over documented leak/event duration and sum once; avoid overlap between routine surveys and the same emergency event. No oxidation factor applies to unburned gas. THT uses measured concentration in kg/m3 directly; multiply Vn only once."
      inputs:
        - cp_release
        - cp_gas
        - xi
        - Mi
        - Zmix
        - R
      output: "species kg per reporting window"
      source_ids:
        - epa-gas-calculation-2025
    - id: makeup_loss
      applies_to: "gas_makeup"
      rule: "Attributable input kg = physical_loss_mass + U_mass before division by D. physical_loss_mass is measured unrecovered leak/vent mass by event; U_mass is confirmed unauthorized transfer mass less evidenced physical recovery linked to that original event, not an invoice gap or an inferred residual. Billing, payment or financial compensation does not remove actual gas supply burden. Unauthorized recovery is Oin only, never customer R; the same return/recovery ID cannot appear in both categories. Calculate each mass from matched measured dry normal volume and whole-gas density/composition, or reconcile measured species masses once. Separate source/grade quantities before aggregation and link the corresponding city-gate supply scope; no default density/composition. Assign both to this distribution service once; exclude them from the commodity model and exclude the distribution segment from the supply dataset to prevent recursion. Only physical_loss_mass can generate direct leaked-species emissions through release_species; U never generates methane/other elementary outputs merely because it was withdrawn. Do not add linepack changes, internal circulation or unexplained residual. Exclude external purge nitrogen from a species sum. Recovery/corrections follow accepted_delivery_cohort; physical custody transfers/stock are recorded gross without burden allocation."
      inputs:
        - cp_gas
        - cp_release
      output: "city-gate gas kg for physical losses and confirmed unrecovered unauthorized withdrawals"
      source_ids: []
    - id: normalize_totals
      applies_to: "all inventory rows"
      rule: "For every nonreference row amount = attributable original total Aj / D once. Electricity Aj = attributable accepted kWh × 3.6 MJ/kWh. Asset and associated installation Aj use capital_share first; operational consumed materials/services use actual net consumption and measured beneficiary share once. Different input properties remain on their respective card units; no supplier physical recursion."
      inputs:
        - cp_gas
        - cp_energy
        - cp_assets
        - cp_maintenance
        - cp_services
        - cp_waste
        - D
      output: "preferred row unit per reference flow"
      source_ids: []
    - id: capital_share
      applies_to: "asset_pe_pipe; asset_steel_pipe; asset_station; asset_customer_meter; pipe_installation"
      rule: "For original stationary asset a and period p, alpha_a,p = t_active_a,p / L_a × b_a,p. t_active is actual in-service time in this D window, in the same unit as evidenced estimated total service life L_a; include standby/outage while the asset remains available and record actual commissioning/removal dates. b is this network measured nonoverlapping share of total all-beneficiary service during that same active period, after subdivision. A dedicated network asset has b = 1. For a shared asset b = this network documented reserved dry-normal-volume capacity (m3/h) × actual reservation/availability h, summed over the period, divided by the identical sum for all beneficiaries of that asset; retain verified configuration/capacity and reservation records including standby. This fixed capacity-hour driver is not sales price or a later modeller choice; reconcile all-user totals and never apply the same beneficiary share twice. A missing/nonpositive denominator is a gap. Original accepted asset kg/m × alpha is attributed before /D; installation m uses the identical associated asset alpha, not another life fraction. Preserve the original asset key, all periods/users and cumulative fractions <=1. L is an evidence-supported estimate with uncertainty until retirement, not a known future actual value. At a life revision freeze already-booked fractions; thereafter allocate the remaining original fraction by actual remaining-period active time / evidenced remaining life × the same all-user b, rather than resetting the original total. True-up affected cohorts at retirement; never reset past fractions or invent mass/life. A persistent replacement creates its own key; direct recurring consumables/jobs have no second capital fraction. Apply capital_source_amendment for final settlement, source quantity/model-version corrections and original-denominator changes; any delta-fraction times source-quantity expression here is conditional on its unchanged-source/model requirements."
      inputs:
        - cp_assets
        - "original asset key"
        - t_active
        - L
        - b
        - "prior fractions"
      output: "conserved original asset attribution"
      source_ids: []
    - id: capital_source_amendment
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Within this entry's declared applies_to scope, apply the complete ordered rule group: capital_source_amendment_history; capital_source_amendment_final_shares; capital_source_amendment_source_revision; capital_source_amendment_normalization; capital_source_amendment_scope. Use this entry's inputs, reference denominator and output; all definitions, conditions, exclusions and completion requirements across that group apply jointly. These components form one method, not additional exchanges or repeated allocation. Reading only a component is insufficient for completion. Follow the existing ownership and deduplication rules when one event appears in more than one entry."
      inputs:
        - cp_capital_amendment
        - cp_assets
        - capital_source_amendment_history
        - capital_source_amendment_final_shares
        - capital_source_amendment_source_revision
        - capital_source_amendment_normalization
        - capital_source_amendment_scope
      output: "attributed totals in source-native units; normalize once by original N_c"
      source_ids: []
    - id: capital_retirement
      applies_to: "capital-origin waste outputs"
      rule: "Link actual foreground capital removal/handover carrier mass to its original asset key and service-beneficiary cohorts. The asset lifetime foreground waste total is attributed once using the same conserved final service fractions as its original asset input. Do not charge the full retired mass to disposal-year D and also to historical capital cohorts. Before actual retirement, disclose future waste as unobserved and the fixed attribution/true-up method; do not invent a future receiving process or call it observed. When actual mass/gate is available, replace any explicitly evidenced prospective handover estimate and true-up the original affected cohorts; no parallel prospective/actual postings. Operational repair waste uses current actual job share without life allocation. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
      inputs:
        - cp_assets
        - cp_waste
        - "original asset key"
        - "original service fractions"
      output: "capital and operational waste attribution once"
      source_ids: []
    - id: nitrogen_balance
      applies_to: "nitrogen_purge; nitrogen_air; nitrogen_soil"
      rule: "Externally supplied purge nitrogen = recovered + retained + exported + released to air + released to soil, using actual events and one first interface. Add native gas nitrogen releases separately from release_species, and do not include purge nitrogen in replacement natural-gas mass. Internal recovery/reinjection cancels; an actual external export requires reviewed transfer identity/gate, never unrecorded output."
      inputs:
        - cp_release
        - cp_gas
      output: "separate purge-nitrogen mass closure"
      source_ids: []
    - id: calibration_balance
      applies_to: "calibration_mix; calibration_methane_air; calibration_nitrogen_air"
      rule: "For the actual certified two-component mixture, derive mass fractions from the certificate directly, or wi = xi Mi / sum(xj Mj) for measured mole fractions. Actual mixture withdrawn = returned/recovered + retained + released. Species release kg = actual released mixture kg × wi once; species-measured kg is not multiplied again. Close both species masses and reconcile cylinder stocks. No default mixture, no pure-species-density multiplication of mixture volume, and no connection to network replacement-gas loss."
      inputs:
        - cp_maintenance
        - certificate
        - xi
        - Mi
        - stocks
        - recovery
      output: "calibration-specific methane and nitrogen kg"
      source_ids: []
    - id: waste_handover
      applies_to: "all waste outputs"
      rule: "For each actual carrier lot: opening foreground stock + actual generation = accepted handover + closing foreground stock + evidenced other actual transfer. Reconcile carrier wet mass and characterized composition; do not add carrier mass plus contained substances. A receiver shipment is not an elementary release or automatically recovered co-product; no unproved recycling credit. Resources/emissions of off-site treatment stay in the matched background link, not a second foreground chain."
      inputs:
        - cp_waste
        - "carrier mass"
        - storage
        - "receiver acceptance"
      output: "measured foreground handover kg"
      source_ids: []
    - id: foreground_site_attribution
      applies_to: "all inventory rows"
      rule: "Classify each actual foreground job/event as recurring operation or identifiable original-asset installation/commissioning/retirement. Recurring materials, work, test/calibration releases and waste use the fixed current-job beneficiary share under allocate_direct. Original capital-site source events use that associated original asset conserved alpha from capital_share once before /D; actual handover stays with its original event/cohort under capital_retirement, not all disposal-year D. Do not apply alpha again to already weighted asset or installation service inputs. Collect raw event quantity, original asset key, phase, beneficiary, alpha and original denominator in cp_assets/cp_maintenance/cp_services/cp_waste. Physical gas/material balances remain unallocated QA; phase-weighted totals are separate and never added twice. Supplier preacceptance activities already included in the chosen product/service gate are not foreground events. Unknown actual phase or quantities block complete data. Already attributed quantities retain weight 1 here; do not repeat any current beneficiary share already applied by the specific work/material rule. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
      inputs:
        - cp_assets
        - cp_maintenance
        - cp_services
        - cp_waste
        - D
      output: "Once-attributed actual site totals/D"
      source_ids: []
    - id: capital_source_amendment_history
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. This rule completes the existing frozen-history/remaining-life policy; it does not require retrospective replacement of historical life fractions at every life revision. Keep the original asset key, each native-unit source s and version, exact product/event gate, all beneficiary-period cohorts c, immutable raw measurements and accepted postings. Before actual final retirement, life/utilization revisions freeze historical fractions and allocate only the remaining fraction using the existing evidenced remaining driver; require 0<=F_prev_all<=1 and include the current interval and all future beneficiaries in the positive remaining denominator. A late first-observed capital source uses each historical accepted fraction and the same remaining ledger, not a full event-year charge. Preserve the existing time-then-period-share policy: for each original active period p, u_c,p=t_active_p*b_c,p, where b is that period reserved dry-normal-volume capacity-hour share and the shares of all beneficiaries sum to one. U_final=sum_p(t_active_p)=sum_c,p(u_c,p), counting each active period once. Do not replace this with a cross-period total-capacity-hour weighting. Standby/outage while available remains in t_active under capital_share."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_final_shares
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At actual final retirement set w_c=u_actual_c/U_final with U_final=sum_all_original_beneficiaries(u_actual)>0; all final shares sum to one, including non-study/failed/standby responsibilities already prescribed by the original driver. A transfer to continued use is not final retirement. Zero or unknown lifetime activity, unsupported prior fractions or missing original cohorts prevents final allocation; retain raw totals and the gap, never equal-split or invent use."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_source_revision
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For source correction before retirement use each original cohort accepted fraction g_c; at final retirement use g_c=w_c. Q_s,new is the evidenced FULL source quantity before allocation in its original card unit, not a remaining unallocated balance or a previously weighted amount. B_s,c is the actual previously booked attributed raw quantity for that source/cohort, with its quantity/model version and previous normalized result. Calculate A_s,c,new=Q_s,new*g_c and delta_A_s,c=A_s,c,new-B_s,c. A newly observed source has B=0 where unposted; a correction to an existing source replaces that source ID, not an additional purchase or disposal event. The shortcut (g_new-F_booked)*Q_s is valid only when the source quantity and linked model version are unchanged and B=F_booked*Q_s; otherwise use A_new-B. Reconcile physical gross receipt/stock/transfer/handover separately; signed corrections are model amendments, never negative physical exchanges or substitution credits. For a changed linked supply/treatment model, replace the affected original-cohort inventory/results even if delta_A=0; remove the previous model contribution and record both versions and scope."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_normalization
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Normalize the complete revised attributed amount once by the original cohort current verified reference denominator N_c (Q, D or A as locally named). If N_c itself changes, replace the complete old normalized result; do not add delta_A/new_N to a result based on old_N. Zero-output events retain their already prescribed causal parent; a parent without positive N_c retains raw attributed totals and an incomplete normalized result, never shifts to an unrelated positive-output period."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_scope
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Apply this to each actual capital-origin source covered by the existing gates, including separately counted initial fill, post-acceptance capital-site events and actual retirement carriers where present; do not create new sources, extend background boundaries, duplicate included supply stages or apply lifetime fractions to routine operation. These are explicit candidate accounting rules, not claimed numerical requirements of the cited classification or technical sources."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Unbound cards are specified measurement candidates. Before use independently direct-read exact object, record state, property, unit, medium and official bilingual names with hash-bound receipts. Historical Alternating current applies only to its verified point-of-use role and is not a fresh query; search hits/agent opinion cannot bind identity."
      evidence: "cp_gas; cp_energy; cp_assets; cp_maintenance; cp_services; cp_waste"
    - id: quality_missing
      applies_to: "all inventory rows"
      requirement: "Unknown quantity, identity, composition, original asset amount/life, contract coverage, duration or medium is missing, never zero. Record owner, recovery method, uncertainty and completeness effect; use only reviewed site-specific estimation with sensitivity or block a complete claim. Examples, estimates and detection limits are not defaults/compliance limits."
      evidence: "cp_scope; all collection protocols"
    - id: quality_occurrence
      applies_to: "all processes"
      requirement: "Sign occurred/absent/unknown per site/job and full period. Use actual assays, not automatic minor-species emissions. Actual excluded routes reject applicability; extend specific actual missing foreground exchanges, not supplier internals."
      evidence: "cp_scope"
    - id: quality_temporal
      applies_to: "all inventory rows"
      requirement: "Use complete consecutive 12 months including standby, outages, unattended intervals and emergencies with monthly reconciliation. Sample each source/grade change and at least monthly stable operation, adding event samples when different; record representativeness, calibration/detection limits, state/compressibility provenance and propagated uncertainty."
      evidence: "cp_gas; cp_release; cp_energy"
    - id: quality_gate_closure
      applies_to: "maintenance"
      requirement: "Reconcile original responsibility to specific asset/services, on-site consumables, wastes and actual releases. A purchased complete object needs no chemical decomposition: verify one measurement object/property/unit and contract gate. Preserve original capital shares/history and true-up without recursive background factory/vehicle/road/tool/receiver inventories. Shorter foreground inventories do not make accepted commodity gas free upstream: identify external commodity-model ownership."
      evidence: "cp_assets; cp_maintenance; cp_services; cp_waste; cp_gas"
    - id: inv_air_species
      applies_to: "methane_air; carbon_dioxide_air; ethane_air; propane_air; n_butane_air; isobutane_air; n_pentane_air; isopentane_air; nitrogen_air; tht_air"
      requirement: "Assign nonoverlapping measured leak/vent events to this species only; no total mixture emission or duplicate soil-source release."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_soil_release
      applies_to: "methane_soil; carbon_dioxide_soil; ethane_soil; propane_soil; n_butane_soil; isobutane_soil; n_pentane_soil; isopentane_soil; nitrogen_soil; tht_soil"
      requirement: "Use the source-interface loss quantity and soil compartment; do not also count its later migration into air as another source release. Downstream environmental transformation belongs to an explicitly separate fate model, not an assumed oxidation factor."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_waste_carrier
      applies_to: "waste_pe_pipe; waste_steel_pipe; waste_meter; waste_station; waste_nitrile; waste_oil; waste_pressure_water"
      requirement: "Conditional on this actual carrier being removed or generated within foreground responsibility and handed over. Measure its actual carrier mass, attached materials/contamination and water content; identify source asset/job, storage and accepted receiver gate. Capital-retirement waste follows original asset attribution; direct operational waste follows the current job."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: validate_scope
    applies_to: "accepted_service"
    rule: "Verify own-account dry-natural-gas route, accepted custody gates and excluded-operation occurrence. Reject whole-CPC exact coverage, fee distribution, hydrogen/LPG/manufactured gas/transmission equivalence, or customer combustion included in this service."
    source_ids:
      - un-cpc-gas-distribution
  - rule_id: validate_reference
    applies_to: "all inventory rows"
    rule: "Require all qualifiers, unique 1 m3 accepted_service, positive D, actual 12-month interval, returns and one normalization. Verify dry state, normal conditions, Zmix, same assay and exact unit/formula on both language cards."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "distribution; maintenance"
    rule: "Independently reconcile gas, species, purge nitrogen and calibration-mixture balances. Reject unexplained-residual-as-methane, native/purge/calibration source mixing, composition twice, mixture plus species double count, unproved air/soil duplication or pure-species-density multiplication. Require monthly gross G with actual R and confirmed U outlets, distinct supplier/other transfers and zero-or-explained residual within measured uncertainty. Trace D = G - R to its original cohort, version cross-period corrections once and reconcile stock/source carry-forward. Verify gas_makeup owns unrecovered physical loss plus confirmed unrecovered U, with commodity-model exclusion; U must not increase D or direct gas emissions."
    source_ids: []
  - rule_id: validate_foreground
    applies_to: "all inventory rows"
    rule: "Each card is one specific measurable exchange with one primary property and preferred unit; defined complete assets/solutions/services may remain whole. Verify scope/acceptance, included-resource de-duplication, actual original asset shares and waste handover; no supplier recursion, undefined catch-all, unknown zero, mass+same assembly, contained-waste duplicate or full-capital charge at retirement."
    source_ids: []
  - rule_id: validate_capital_amendment
    applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
    rule: "Verify the original driver, freeze/remaining ledger, actual final w, each source full Q_s/B/version, original N and whole normalized-result replacement under capital_source_amendment. Recalculate unchanged-quantity share corrections, changed quantity with unchanged share, changed model with zero physical delta, corrected original N and zero-output cases; verify mutually exclusive capital/recurring components and all beneficiaries. Missing traceable old postings or positive denominators remains incomplete; prohibit disposal-year fallback, negative physical flows, duplicate normalization or second shares."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "all inventory rows"
    rule: "Compare bilingual objects, official display names where bound, directions/types, IDs, units, formulas/denominators, conditions, negations, obligation strength and all protocol/rule references. Regenerated structured/guidance must include every mandatory table rule. Schema/fingerprint/atomic/localized checks are structural evidence, not scientific approval; identity/data gaps remain explicit and block publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "own_account_gas_distribution_service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Distribution-stage foreground inventory for a separately scoped commodity-gas model; later matched background supply/service/treatment links once"
  excluded_use: "Full gas production-to-combustion footprint; fee distribution; other gas/excluded routes; full lifecycle claim without matched background links; scientific approval inferred from checks"
  required_metadata: "All reference qualifiers; D; gas/species/purge/calibration balances; external commodity-model ownership; foreground process gates; specific asset/service acceptance scope; original asset mass/length and all-user lifetime service fractions; current consumption; waste handover/storage; row-specific identity receipts"
  required_quality_disclosure: "Unbound identities; missing quantities/life/contract coverage; estimates and true-up; unobserved future retirement; uncertainty; background stages not expanded/linked and de-duplication"
  update_trigger: "Gas specification/source change; network/equipment/contract gate change; recalibration; leak/emergency; remaining-life evidence/retirement true-up; new actual foreground exchange"
data_sources:
  - id: "un-cpc-gas-distribution"
    type: "official_guidance"
    reference: "UNSD CPC 3.0, 69120. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/69120"
    used_for: "Own-account gaseous-fuel distribution and meter maintenance; exclusions and narrower scope assessment"
  - id: "eia-gas-delivery"
    type: "official_guidance"
    reference: "US EIA, Natural gas explained: Delivery and storage of natural gas. https://www.eia.gov/energyexplained/natural-gas/delivery-and-storage.php"
    used_for: "Distinguish processing, long-distance transmission, local mains/services and bulk storage"
  - id: "epa-gas-calculation-2025"
    type: "official_guidance"
    reference: "US EPA, 40 CFR 98.233, July 1 2025 edition, paragraphs (t), (u), (v), equations W-33, W-35, W-36, printed pp.931–933. https://www.govinfo.gov/content/pkg/CFR-2025-title40-vol23/pdf/CFR-2025-title40-vol23-sec98-233.pdf"
    used_for: "Gas-state correction, CH4/CO2 speciation and mass conversion structure only; the dry-gas equation is a PCR-designed SI adaptation including measured water vapour and standard-state compressibility. This PCR independently requires measured site composition and uses 273.15 K/101325 Pa; it adopts no US standard-state densities, default composition, threshold or reporting exemption and is not a regulatory compliance determination."
