    rule: "Each card has one clearly defined measurement object, one primary property and one preferred unit. Evidence-based raw-field conversions may produce that unit; mass/count/time are not alternative card units. Sum attributable totals Aj for the same complete consecutive 12 months, then divide once by positive D, accepted dry normal delivered m3 defined by accepted_delivery_cohort; later returns revise the original cohort and its normalized inventory together, never an unrelated current denominator. Intermediate inputs are not fixed to reference quantity."
