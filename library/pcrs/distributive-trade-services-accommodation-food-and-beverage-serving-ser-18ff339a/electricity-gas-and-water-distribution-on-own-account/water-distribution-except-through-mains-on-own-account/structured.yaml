        - alpha_new_current
        - h_actual_jk
        - sum_all_lifetime_actual_h_j
        - X_jx
        - F_booked_jkx
        - w_jk
        - delta_jkx
        - A_k
        - A
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: equipment_share_final_shares
      applies_to: "tanker_asset; loading_skid; loading_hose; retired_tanker; retired_skid; retired_hose"
      rule: "Component of equipment_share. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At actual final retirement, do not divide by the now-zero remaining hours. For every original beneficiary service cohort k compute w_jk=h_actual_jk/sum_all_lifetime_actual_h_j using the same equipment driver across ALL users and periods, including failed/idle/empty/pump use. Require a supported positive total; sum_k(w_jk)=1."
      inputs:
