    - id: equipment_share_remaining_life
      applies_to: "tanker_asset; loading_skid; loading_hose; retired_tanker; retired_skid; retired_hose"
      rule: "Component of equipment_share. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At a documented remaining-life/use revision, freeze all accepted past shares: F_prev_all_users is their sum across ALL original beneficiaries. The ONLY revised current-period formula is alpha_new,current=(1-F_prev_all_users)*h_current/H_remaining_all_users. H_remaining_all_users is positive, includes the current period and ALL beneficiaries remaining use on the SAME fixed equipment driver; h_current is this original beneficiary cohort current-period use on that basis. Use this revised alpha for newly attributed quantities only, preserve prior fractions and original supplied mass, and require 0<=F_prev_all_users<=1 and cumulative all-beneficiary shares<=1. Do not recompute all history with a revised total lifetime, restart original mass or reset allocation in acquisition/disposal year."
      inputs:
        - m_net_supplied_j
        - m_actual_handover_j
        - h_cohort_j
        - H_lifetime_all_users_j
        - alpha_j
        - F_prev_all_users
        - h_current
