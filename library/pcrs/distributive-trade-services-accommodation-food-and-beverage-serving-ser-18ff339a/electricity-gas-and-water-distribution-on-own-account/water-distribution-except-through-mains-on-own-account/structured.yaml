        - h_cohort_j
        - H_lifetime_all_users_j
        - alpha_j
        - F_prev_all_users
        - h_current
        - H_remaining_all_users
        - alpha_new_current
        - h_actual_jk
        - sum_all_lifetime_actual_h_j
        - X_jx
        - F_booked_jkx
        - w_jk
        - delta_jkx
        - A_k
        - A
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: equipment_share_source_corrections
      applies_to: "tanker_asset; loading_skid; loading_hose; retired_tanker; retired_skid; retired_hose"
      rule: "Component of equipment_share. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For each original source quantity x (supplied asset, observed one-time capital event or actual retirement carrier), retain its own booked fraction F_booked_jkx and calculate delta_jkx=w_jk-F_booked_jkx; the quantity correction is delta_jkx*X_jx. A newly measured carrier/event with no prior posting has F_booked_jkx=0. The final attributed quantity is w_jk*X_jx for every such source. Preserve original accepted postings and raw physical records; issue versioned amendments to each original cohort result, dividing its corrected attributable totals by that original positive accepted A_k once. Signed delta may reverse over-allocation, but is not negative physical flow or substitution credit. Never assign the residual wholesale to disposal-year A, multiply a second share, or silently rewrite old physical quantities."
      inputs:
