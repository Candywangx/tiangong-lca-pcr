allocation_rules:
  - rule_id: exclusive_route
    applies_to: "foreground_burden_allocation"
    rule: "All dedicated trips and zero-distance idle/pump/failed events follow original-load cohort. A zero-accepted trip retains burdens in cohort totals; multiple stops divide by total positive accepted A only. No load volume/distance shortcut."
    source_ids: []
  - rule_id: shared_operations
    applies_to: "foreground_burden_allocation"
    rule: "Directly assign/submeter actual foreground jobs first. Otherwise allocate inseparable operating/hygiene/maintenance resources by this cohort engaged equipment hours divided by all-user engaged hours in the same measured interval including follow-up. Already cohort-specific quantities receive no extra beneficiary share. No revenue allocation; unknown denominator is incomplete."
    source_ids: []
  - rule_id: equipment_attribution
    applies_to: "foreground_burden_allocation"
    rule: "Retain only specified tanker, loading skid and hose supplied-object capital inputs. Record original asset key, configuration, actual complete net mass and evidenced total service-life driver. Vehicle driver is actual cohort engine-on hours/all-user lifetime engine-on hours including idle/empty/pump/failed use; skid and hose driver is actual cohort connected operating hours/all-user lifetime same hours. Original assets purchased before cohort still contribute measured share. Apply coefficient once to supplied equipment mass, divide A once. Distinct renewed whole equipment gets a new key; maintenance replacements and initial contained supplies cannot duplicate it. No nested supplier/road/tool capital allocation."
    source_ids: []
  - rule_id: no_credit
    applies_to: "foreground_burden_allocation"
    rule: "No credit for rejected/returned/reloaded water or waste; internal transfer produces no new intake or accepted service. Actual retired asset carrier, if handed over, follows original asset service coefficient once, never current disposal-year whole mass. Do not invent future waste quantities merely to close an asset lifecycle."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_custody
      process_id: "p_delivery"
      flow_role: "accepted_distribution_service"
      record_type: "source, meter and acceptance ledger"
      raw_fields: "original_load_id; source/supplier/geography/treatment_id; first_fill_time; D_s; each gate V/rho/temperature; meter before/after; A; rejected; return; loss/receiver; internal reload; opening/closing custody; test/decision/signature; vehicle return"
      collection_method: "Use calibrated fill/unload meters and signed quality records per original split/load; trace all returns/loss to source. Measure same-batch density at gate temperature, never assume1000kg/m3. Apply custody_balance/commodity_ratio daily; supplier source tests excluded from recipient service."
      unit: "m3; L; kg; kg/m3; degC"
      frequency: "every fill/transfer/unload/final fate; reconcile daily"
      temporal_coverage: "first loads within declared consecutive12months through final custody/return closure"
      site_scope: "source coupling through recipient acceptance/rejected returns"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, sample chain, source/recipient signatures and closure log"
    - protocol_id: cp_transport
      process_id: "p_delivery"
      flow_role: "delivery_diesel; delivery_urea; delivery_co2_fossil; delivery_co2_biogenic; delivery_co; delivery_ch4; delivery_n2o; delivery_no; delivery_no2; delivery_so2; delivery_pm25; delivery_pmcoarse; delivery_nh3"
      record_type: "actual vehicle/fuel/emission log"
      raw_fields: "trip/original_load/vehicle/source/event IDs; leg role; GPS/odometer; engine-on/idle/pump/failed hours; fuel opening/receipt/close/return; kg or L and same-batch density/temperature; composition/biogenic fraction/NCV; SCR solution mass/concentration; species test/factor native basis/control/uncertainty; original asset key; event_kind recurring/capital; actual event quantity; alpha_j; supplier pre-acceptance included-resource exclusion"
      collection_method: "Match GPS/engine/fuel invoices and calibrated tank/flow records per event including zero-distance intervals. Fuel actual consumption from stock, weighed or measured batch-volume*density; record factors on exact native quantity basis and actual control under emission_species. Reconcile per trip/month, no provider vehicle-km background factor and no guessed absence. Separate observed post-acceptance one-time capital events and recurring operation; apply foreground_capital_events once, never duplicate supplier accepted-equipment scope."
      unit: "kg; L; kg/L; degC; h; km; kg/kg; MJ/kg"
      frequency: "every driving/idle/pump/failed event; monthly fuel reconciliation"
      temporal_coverage: "original dispatch cohort through final vehicle return"
      site_scope: "contracted dedicated tanker operated foreground"
      aggregation_rule: "per reference flow"
      quality_evidence: "provider physical logs, calibrated readings, source/control factor evidence and signed occurrence"
    - protocol_id: cp_energy
      process_id: "p_delivery"
      flow_role: "loading_electricity"
      record_type: "point-of-use grid meter"
      raw_fields: "meter/site/event/source ID; kWh import and same-purchase returns; voltage/supplier; start/end; cohort/all-user operating hours; service portable energy exclusion; original asset key; event_kind recurring/capital; actual event quantity; alpha_j; supplier pre-acceptance included-resource exclusion"
      collection_method: "Read calibrated distributor submeter for loading and separately logged on-site hygiene/maintenance; match invoices/source gate and allocate shared_operations once. Exclude portable energy in purchased testing/calibration and supplier generation. Apply electricity_gate then3.6 conversion once. Separate observed post-acceptance one-time capital events and recurring operation; apply foreground_capital_events once, never duplicate supplier accepted-equipment scope."
      unit: "kWh; h"
      frequency: "each operating interval, monthly invoice check"
      temporal_coverage: "all actual cohort foreground intervals including follow-up"
      site_scope: "distributor supplied loading/maintenance/hygiene electricity"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, invoices, stage meters and all-user hours"
    - protocol_id: cp_hygiene
      process_id: "p_hygiene"
      flow_role: "auxiliary_water; tanker_wash_water; sodium_carbonate; hypochlorite_solution; tanker_carbonate; tanker_hypochlorite"
      record_type: "actual hygiene water/chemical stocks"
      raw_fields: "owner/site/vehicle/equipment/event/original_load ID; approved procedure; water meter/temperature; exact chemical batch; whole mass; active fraction; density; opening/receipt/close/return/transfer; event/cohort/all-user hours; sanitation result"
      collection_method: "Submeter supplied wash water, weigh powder/whole solution or use measured same-batch density conversion. Consumption=opening+receipt-closing-externalreturns adjusted documented transfers; direct original event then shared_operations. Separate tanker/distributor row IDs, no carried-water dosing/default quantity. Reconcile stocks monthly and all liquids to closed waste lots; sign occurrence/absence."
      unit: "m3; kg; kg/L; mass fraction; degC; h"
      frequency: "each wash/disinfection event and monthly stocks/absence"
      temporal_coverage: "actual original-cohort hygiene including follow-up"
      site_scope: "distributor pump/hose and tanker hygiene separately"
      aggregation_rule: "per reference flow"
      quality_evidence: "COA/SDS, calibrated meter/scale and approved signed procedure"
    - protocol_id: cp_work
      process_id: "p_maintenance"
      flow_role: "work_mineral_oil; work_coolant; replacement_tyre; replacement_seal"
      record_type: "foreground maintenance parts and stocks"
      raw_fields: "job/asset/original_load ID; configuration; replacement object specification; received/installed net mass; count and same-object mass if converting; lubricants/coolant batch/density; opening/receipt/closing/return/reuse; initial-fill exclusion; job hours/all-user hours; generated waste lot; original asset key; event_kind recurring/capital; actual event quantity; alpha_j; supplier pre-acceptance included-resource exclusion"
      collection_method: "Weigh or use traceable same-model net supplied mass for each actual tyre/seal; fuel/fluids via calibrated scale or batch density. Stock reconcile real consumption and reusable returns; exclude initial fills and same-record whole equipment renewal already under cp_assets. Direct event or shared_operations attribution, each item primary kg. Additional actually used part/fluid needs its own specific property/unit card. Separate observed post-acceptance one-time capital events and recurring operation; apply foreground_capital_events once, never duplicate supplier accepted-equipment scope."
      unit: "kg; count; kg/count; L; kg/L; h"
      frequency: "every job/stock transfer, monthly reconciliation and absence"
      temporal_coverage: "cohort actual maintenance jobs through follow-up"
      site_scope: "operated tanker/loading equipment foreground only"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed work orders, model/weight records, stock/scale evidence and no-overlap register"
    - protocol_id: cp_calibration
      process_id: "p_maintenance"
      flow_role: "meter_calibration"
      record_type: "defined calibration/testing service acceptance"
      raw_fields: "service/job/object/owner/site/original_load ID; named protocol/method; sample point/chain; raw analyst/technician start/end/break/productive hours; decision/result/certificate; contract included portable supplies/energy/sample travel/take-back wastes; excluded distributor resources; source-test exclusion; invoice/no-overlap IDs"
      collection_method: "For each specified meter calibration or recipient acceptance job, verify contract, method and delivered result, collect signed attendance times excluding breaks/parallel unrelated jobs. Actual productive h is primary quantity; counts never substitute without measured time. Map every included resource/waste to provider service once; any distributor-supplied exclusion needs specific foreground card before completeness. Recipient samples at unload; calibration at identified distributor meter. No supplier source-water test duplication."
      unit: "h; timestamp"
      frequency: "every specified service job and monthly contract/invoice reconciliation"
      temporal_coverage: "actual cohort acceptance/calibration jobs, including failures/retests"
      site_scope: "recipient coupling tests and distributor on-site meter calibration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed time sheets, method/certificate, custody, invoice and included/excluded matrix"
    - protocol_id: cp_testing
      process_id: "p_delivery"
      flow_role: "acceptance_testing"
      record_type: "defined calibration/testing service acceptance"
      raw_fields: "service/job/object/owner/site/original_load ID; named protocol/method; sample point/chain; raw analyst/technician start/end/break/productive hours; decision/result/certificate; contract included portable supplies/energy/sample travel/take-back wastes; excluded distributor resources; source-test exclusion; invoice/no-overlap IDs"
      collection_method: "For each specified meter calibration or recipient acceptance job, verify contract, method and delivered result, collect signed attendance times excluding breaks/parallel unrelated jobs. Actual productive h is primary quantity; counts never substitute without measured time. Map every included resource/waste to provider service once; any distributor-supplied exclusion needs specific foreground card before completeness. Recipient samples at unload; calibration at identified distributor meter. No supplier source-water test duplication."
      unit: "h; timestamp"
      frequency: "every specified service job and monthly contract/invoice reconciliation"
      temporal_coverage: "actual cohort acceptance/calibration jobs, including failures/retests"
      site_scope: "recipient coupling tests and distributor on-site meter calibration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed time sheets, method/certificate, custody, invoice and included/excluded matrix"
    - protocol_id: cp_assets
      process_id: "p_assets"
      flow_role: "tanker_asset; loading_skid; loading_hose; retired_tanker; retired_skid; retired_hose"
      record_type: "specified supplied equipment service ledger"
      raw_fields: "original_asset/owner/model/configuration ID; acceptance date/gate; actual complete net supplied kg; contained initial fluid/tyre scope; packaging excluded; h_cohort; H_lifetime_all_users; driver source; all beneficiaries/prior allocations; purchase/renewal/maintenance exclusion; actual retired receiver/date/net kg/removed fluids; original asset key; event_kind recurring/capital; actual event quantity; alpha_j; supplier pre-acceptance included-resource exclusion; revision version/date; actual lifetime hours per original cohort; source quantity ID/X_jx; source-specific F_booked_jkx; w_jk; delta_jkx; original accepted A_k; amendment links ; source-specific B/version and original N fields in cp_capital_amendment"
      collection_method: "Use traceable manufacturer same-configuration net mass or calibrated whole-object weighing; raw count/length converts only with same-object measured mass. Collect engine-on hours for vehicle including idle/empty/pump and connected operation for skid/hose, with all-user lifetime driver from audited fleet/equipment history or documented engineering estimate/range, no default. Reconcile prior shares and remaining-life changes under equipment_share. If actual retirement handover occurs, verify receiver receipt and fluids/weight, same original coefficient, finalized as w_jk at final retirement; no future terminal flow or supplier capital-chain collection. Separate observed post-acceptance one-time capital events and recurring operation; apply foreground_capital_events once, never duplicate supplier accepted-equipment scope. At final retirement reconcile all actual lifetime hours and each source-specific posting ledger; calculate final shares and signed amendments by equipment_share, retaining original accepted A_k and version links. Check each affected cohort and source to prevent omitted or duplicate corrections; missing/nonpositive denominators block results. Complete cp_capital_amendment reconciliation for final settlement and source/denominator revisions."
      unit: "kg; h; count; m; kg/count; kg/m"
      frequency: "each asset acceptance/renewal/retirement and daily hours; annual life review"
      temporal_coverage: "actual supplied assets servicing cohort including previous purchases; all original beneficiary lifetime records and amendments; observed handovers only"
      site_scope: "specified tanker, loading skid and loading hose only"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance/configuration/weight records, calibrated logs, versioned life/share ledger and actual handover receipt"
    - protocol_id: cp_capital_amendment
      process_id: "p_assets"
      flow_role: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      record_type: "versioned_original_source_and_cohort_ledger"
      raw_fields: "asset_ID; source_ID and original row_ID/native unit; original acceptance/event gate; full measured source quantity and old/new versions; measurement/calibration/state basis; each original beneficiary-period/driver unit/u_actual; period b where applicable; all past/future beneficiaries; F_prev_all and remaining_driver; accepted g/F_booked; raw booked B; old normalized result/original N and corrected N; background model versions/scope; actual final retirement evidence; A_new/delta_A/replacement/deduplication links"
      collection_method: "Collect original records at asset/supplier acceptance, actual site events and receiver handover gates as applicable; verify full quantities through the existing cp_assets weighing/configuration-count/length/driver measurement and calibration methods. At every source/life/model/denominator revision and final retirement, compare old/new records for every original cohort and apply capital_source_amendment. Reconcile all-beneficiary fractions, source totals and each amendment link; the service data custodian reviews and signs the reconciliation. Prove nonoccurrence by complete event registers/zero-activity evidence, never absence-as-zero; retain unresolved identities, measurement uncertainty and incomplete causes."
      unit: "source-native units; fixed driver units; original reference units"
      frequency: "each acceptance/event/revision/final retirement; annual reconciliation"
      temporal_coverage: "complete original asset history and original service cohorts; evidenced remaining life"
      site_scope: "existing foreground gates and capital-source responsibility only"
      aggregation_rule: "once per original reference flow"
      quality_evidence: "raw measurement/calibration; signed acceptance/event/receiver records; source/model versions; all-beneficiary and revision reconciliation ledger"
    - protocol_id: cp_waste_hygiene
      process_id: "p_hygiene"
      flow_role: "cleaning_wastewater; tanker_wastewater"
      record_type: "original waste generation/stock/handover ledger"
      raw_fields: "lot/original_load/job/asset/owner ID; exact carrier/specification/composition; generation/open/ship/close kg; generation and handover V/rho/temperature; leaks/evaporation/additions; recipient/date/gate/receipt; collector responsibility; service take-back exclusions"
      collection_method: "Calibrated scale or tank-level/volume plus same-lot measured density and temperature; characterize carrier by approved sample chain (liquids: chlorine-as-Cl2 QA, pH, formulation/contaminants). Reconcile stock on kg, not different-temperature volumes, follow each original lot to signed actual receiver handover. Output whole carrier once, exclude service-provider take-back waste already in service. Background treatment may link later from exact gate; no receiver-process quantities required here. Unknown stock/identity/receiver or actual direct release needs resolution/precise cards before complete cohort."
      unit: "kg; m3; kg/m3; degC; mg/L; pH"
      frequency: "each generation/stock movement/handover; monthly reconciliation"
      temporal_coverage: "original-generation cohort through actual foreground handover"
      site_scope: "closed hygiene collection and on-site maintenance waste handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, characterized samples, mass stocks and signed receiver receipts"
    - protocol_id: cp_waste_maintenance
      process_id: "p_maintenance"
      flow_role: "used_oil; spent_coolant; used_tyre; used_seal"
      record_type: "original waste generation/stock/handover ledger"
      raw_fields: "lot/original_load/job/asset/owner ID; exact carrier/specification/composition; generation/open/ship/close kg; generation and handover V/rho/temperature; leaks/evaporation/additions; recipient/date/gate/receipt; collector responsibility; service take-back exclusions"
      collection_method: "Calibrated scale or tank-level/volume plus same-lot measured density and temperature; characterize carrier by approved sample chain (liquids: chlorine-as-Cl2 QA, pH, formulation/contaminants). Reconcile stock on kg, not different-temperature volumes, follow each original lot to signed actual receiver handover. Output whole carrier once, exclude service-provider take-back waste already in service. Background treatment may link later from exact gate; no receiver-process quantities required here. Unknown stock/identity/receiver or actual direct release needs resolution/precise cards before complete cohort."
      unit: "kg; m3; kg/m3; degC; mg/L; pH"
      frequency: "each generation/stock movement/handover; monthly reconciliation"
      temporal_coverage: "original-generation cohort through actual foreground handover"
      site_scope: "closed hygiene collection and on-site maintenance waste handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, characterized samples, mass stocks and signed receiver receipts"
  calculation_rules:
    - id: custody_balance
      applies_to: "accepted_distribution_service"
      rule: "For each original new-load cohort balance kg: m_D+m_open=m_A+m_R+m_loss+m_close. Each m=sum(V_i*rho_i), using measured same-batch liquid density at its actual gate temperature. D_s stays volume at source gate; A actual accepted unload volume; R/L_loss their declared fate-gate volumes. Never equate different-temperature volumes. Internal reload cancels. Separate source/supplier/geography/treatment combination s, matched upstream inventory and no double source linkage. New-load cohort m_open=0; exclude prior-cohort stock with preserved lineage. Require m_close=0 and all final delivery/return/loss destinations and vehicle return known before completion."
      inputs:
        - D_s
        - A
        - R
        - L_loss
        - V_i
        - rho_i
        - m_open
        - m_close
        - cp_custody
      output: "closed original-load mass ledger"
      source_ids: []
    - id: commodity_ratio
      applies_to: "accepted_distribution_service"
      rule: "b_s=D_s/A m3 source commodity per1m3 service. Consuming model MUST add sum_s(b_s*matched source/supplier/geography/treatment upstream inventory) plus R_s/A and L_s/A destination fate once with no credit. Never add another1m3 accepted-water production. D_s records original source fill once, not internal reload. Auxiliary water supply remains in its separate foreground input background."
      inputs:
        - D_s
        - A
        - R_s
        - L_s
        - cp_custody
      output: "source commodity and fate ratios"
      source_ids: []
    - id: normalize_foreground
      applies_to: "all inventory rows"
      rule: "For each nonreference row, first sum actual attributable raw quantity in its single selected numerator unit, then divide positive A once. M_/W_/T_/O_ variables in cards are attributable totals before normalization, not already per-m3 factors. Electricity alone converts E_kWh to3.6*E_kWh MJ once. Whole solution remains product mass, not active constituent mass. Service T_test/T_calibration is actual productive hours under defined protocol, no count-to-hour guess. Internal material/utility quantities are never fixed to reference1m3. Original-cohort equipment/capital corrections use original A_k under equipment_share, never current A. Failed or zero-output tasks retain their consumption and are assigned to their evidenced original parent service cohort before normalization. If that entire responsible cohort has no positive accepted A_k, retain raw totals as unresolved and withhold per-reference results; do not shift them to unrelated successful cohorts."
      inputs:
        - A
        - M_total
        - W_total
        - T_test
        - T_calibration
        - O_total
        - E_kWh
        - cp_transport
        - cp_energy
        - cp_hygiene
        - cp_testing
        - cp_calibration
        - cp_work
      output: "single-property amount per reference flow"
      source_ids: []
    - id: equipment_share
      applies_to: "tanker_asset; loading_skid; loading_hose; retired_tanker; retired_skid; retired_hose"
      rule: "Within this entry's declared applies_to scope, apply the complete ordered rule group: equipment_share_initial_driver; equipment_share_remaining_life; equipment_share_final_shares; equipment_share_source_corrections; equipment_share_constraints. Use this entry's inputs, reference denominator and output; all definitions, conditions, exclusions and completion requirements across that group apply jointly. These components form one method, not additional exchanges or repeated allocation. Reading only a component is insufficient for completion. Follow the existing ownership and deduplication rules when one event appears in more than one entry."
      inputs:
        - m_net_supplied_j
        - m_actual_handover_j
        - h_cohort_j
        - H_lifetime_all_users_j
        - alpha_j
        - F_prev_all_users
        - h_current
        - H_remaining_all_users
        - alpha_new_current
        - h_actual_jk
        - sum_all_lifetime_actual_h_j
        - X_jx
        - F_booked_jkx
        - w_jk
        - delta_jkx
        - A_k
        - A
        - cp_assets
        - equipment_share_initial_driver
        - equipment_share_remaining_life
        - equipment_share_final_shares
        - equipment_share_source_corrections
        - equipment_share_constraints
      output: "attributed actual equipment and observed handover mass totals"
      source_ids: []
    - id: capital_source_amendment
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Within this entry's declared applies_to scope, apply the complete ordered rule group: capital_source_amendment_history; capital_source_amendment_final_shares; capital_source_amendment_source_revision; capital_source_amendment_normalization; capital_source_amendment_scope. Use this entry's inputs, reference denominator and output; all definitions, conditions, exclusions and completion requirements across that group apply jointly. These components form one method, not additional exchanges or repeated allocation. Reading only a component is insufficient for completion. Follow the existing ownership and deduplication rules when one event appears in more than one entry."
      inputs:
        - cp_capital_amendment
        - cp_assets
        - capital_source_amendment_history
        - capital_source_amendment_final_shares
        - capital_source_amendment_source_revision
        - capital_source_amendment_normalization
        - capital_source_amendment_scope
      output: "attributed totals in source-native units; normalize once by original N_c"
      source_ids: []
    - id: trip_totals
      applies_to: "delivery_diesel; delivery_urea"
      rule: "K=sum actual all-leg vehicle-km, loaded/empty/return/failed; K>0 for this road route is QA only, not the fuel/emission denominator. Measure all engine-on idle/pump/zero-distance failed events and fuel/urea consumption directly. Sum M_diesel/M_urea over original cohort to final vehicle return. Never multiply complete vehicle-km factor or double actual roundtrip distance; do not infer zero burden from K_event=0."
      inputs:
        - K
        - M_diesel
        - M_urea
        - engine_hours
        - idle_hours
        - pump_hours
        - A
        - cp_transport
      output: "actual complete-cohort physical totals"
      source_ids: []
    - id: emission_species
      applies_to: "all inventory rows"
      rule: "Actual foreground source/event releases use one measured species mass or documented vehicle/fuel/control-specific factor with native basis and uncertainty. A kg-species/kg-fuel factor multiplies fuel once, not composition again; carbon/element factors use evidenced stoichiometric conversion once. Keep fossil/biogenic carbon separate. NO and NO2 remain distinct; PM fine/coarse bins nonoverlap and no total-PM duplicate. If measured nonexhaust PM is included, identify it separately in raw source records and prohibit double count with collected tyre/brake waste; actual other species/medium needs a precise card before complete data. Annual fuel/carbon balance is QA of event releases, not another release. Supplier manufacturing/off-site treatment factors do not belong here. Unknown actual factor/emission is incomplete, never zero."
      inputs:
        - fuel_mass
        - factor
        - composition
        - source_event
        - control_state
        - A
        - cp_transport
      output: "individual foreground species mass"
      source_ids: []
    - id: waste_handover_balance
      applies_to: "all inventory rows"
      rule: "Each actual original-generation waste lot: M_gen+M_open=M_ship+M_close+M_documented_other, in kg using measured V*rho at each actual gate temperature/composition. No equality of different-temperature volumes. M_documented_other includes separately evidenced leaks/evaporation/additions with correct sign and explicit additional cards where crossing environment. For liquid card W_handover=sum(M_ship/rho_handover) m3; do not substitute generated volume at another density. Preserve original source/event and collector receipt. Follow cohort-generated waste through actual handover; unresolved closing stock/receiver prevents complete original cohort. Actual inherited prior-cohort waste is excluded with lineage. No receiver-treatment physical inventory is required in foreground."
      inputs:
        - M_gen
        - M_open
        - M_ship
        - M_close
        - M_documented_other
        - rho_handover
        - A
        - cp_waste_hygiene
        - cp_waste_maintenance
      output: "actual foreground handover totals and closed mass ledger"
      source_ids: []
    - id: electricity_gate
      applies_to: "loading_electricity"
      rule: "E_kWh is actual external grid import after only demonstrable same-purchase returns, with no unrelated onsite-export netting. Any new onsite generation needs an explicit foreground route/card update: its electricity is internal memorandum, actual fuel/species once. Do not duplicate purchased testing/calibration portable electricity or supplier background generation."
      inputs:
        - E_kWh
        - import
        - same_purchase_return
        - cp_energy
      output: "nonduplicated point-of-use grid electricity"
      source_ids: []
    - id: uncertainty_reconcile
      applies_to: "all inventory rows"
      rule: "Reconcile independent meters/stocks with propagated calibration uncertainty; unexplained residual beyond documented combined uncertainty requires investigation/correction, not forced balance. A=0, unknown identity/occurrence, unresolved negative stock, incomplete original-load/vehicle/waste handover prevents complete unit data. Record method/range/sensitivity of life or factor estimates; emergency examples and candidate rows are not default amounts or legal limits."
      inputs:
        - raw_ledgers
        - calibration
        - uncertainty
        - A
      output: "reconciled foreground and disclosed gaps"
      source_ids: []
    - id: foreground_capital_events
      applies_to: "all inventory rows"
      rule: "Supplied complete equipment gate is ready-for-use acceptance: supplier delivery/install/proving already included before that gate is not another foreground resource. Actual distributor-operated commissioning, site installation modification or retirement tasks AFTER that gate remain foreground only when observed. Existing specific cards may cover the same measured resource/object: distinguish event, original asset key and capital-event vs recurring status in raw records. For a one-time original asset event, attributable total=sum(actual raw event quantity*that original asset alpha_j) once; recurring jobs use direct original service or shared_operations. Apply to real site electricity, actual tanker fuel/pump operation and their source releases or actual drains/handover only as those specific cards permit; any different resource/species needs its own exact card before complete data. No second supplier-gate resource, no whole event burden reset in retirement year, no background supporting capital. At final retirement apply equipment_share final w_jk to each observed source event, using its own F_booked_jkx and signed delta_jkx correction in the original service cohort/A_k; new unbooked events start at zero. Never add unallocated physical QA totals again. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
      inputs:
        - event_id
        - original_asset_id
        - event_kind
        - actual_quantity
        - alpha_j
        - A
        - cp_energy
        - cp_transport
        - cp_work
        - cp_assets
      output: "once-attributed observed foreground capital-event quantities"
      source_ids: []
    - id: equipment_share_initial_driver
      applies_to: "tanker_asset; loading_skid; loading_hose; retired_tanker; retired_skid; retired_hose"
      rule: "Component of equipment_share. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For each actual supplied asset j, initial allocation alpha_j=h_cohort_j/H_lifetime_all_users_j, using the positive evidenced all-beneficiary lifetime denominator and fixed equipment_attribution driver. C_asset=sum(m_net_supplied_j*alpha_j) kg. C_retired_handover=sum(m_actual_handover_j*alpha_j) kg only for actual handover, with alpha_j equal to final w_jk after actual final retirement; no prospective terminal flow. No additional cohort/all-user fraction after alpha_j."
      inputs:
        - m_net_supplied_j
        - m_actual_handover_j
        - h_cohort_j
        - H_lifetime_all_users_j
        - alpha_j
        - F_prev_all_users
        - h_current
        - H_remaining_all_users
        - alpha_new_current
        - h_actual_jk
        - sum_all_lifetime_actual_h_j
        - X_jx
        - F_booked_jkx
        - w_jk
