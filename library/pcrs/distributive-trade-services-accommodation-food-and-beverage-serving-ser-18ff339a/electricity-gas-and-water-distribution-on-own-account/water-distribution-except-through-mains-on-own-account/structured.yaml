system_boundary:
  rules:
    - rule_id: foreground_gate
      applies_to: "foreground_system_boundary"
      rule: "Selected foreground is actual contracted dedicated diesel tanker operation plus distributor loading/metering, closed equipment hygiene and on-site maintenance. Include loaded/empty/return/failed/idle/pump events through vehicle return, recipient acceptance decision and actual waste handover. Distributor retains own-account custody/commercial responsibility. Recipient storage/dispensing/use and distributor intermediate storage are outside."
      source_ids:
        - who-tanker-2013
        - unsd-cpc30-69230
    - rule_id: no_background_recursion
      applies_to: "foreground_system_boundary"
      rule: "Supplier manufacture/mining/material-component production, complete upstream transport, roads, supplier tools/factories/supporting capital and off-site waste receiver treatment are background and not operated foreground processes. Retained complete vehicle/skid/hose inputs have a specific supplied acceptance gate and one Mass/kg identity; preserve their measured service attribution without decomposing BOM or adding factory/road/EOL internals. Capital input datasets end at supplied equipment gate and exclude later foreground operating supplies and EOL treatment."
      source_ids: []
    - rule_id: commodity_ownership
      applies_to: "foreground_system_boundary"
      rule: "Carried water remains a physical custody ledger, not a water commodity inventory input/output of this service. Consuming model MUST add source-specific D_s/A production covering accepted plus rejected/returned/lost new source water, and R_s/A/L_s/A fate by documented destination exactly once without credit. Do not add a second1m3 water commodity or duplicate supplier source tests. Internal reload is not new source intake. Auxiliary cleaning water remains a separate input."
      source_ids: []
    - rule_id: single_measurement_object
      applies_to: "foreground_system_boundary"
      rule: "Each card has one specific measurable object, one primary property and one preferred unit. A specified complete multi-material vehicle/equipment, formulated product, characterized waste carrier or defined calibration/acceptance service is permissible. Raw counts/metres/volume/hours convert only with same-object evidence to that selected unit. Independent chemicals, electricity, fuel, media and directions remain distinct; no generic lifecycle service or selector."
      source_ids: []
    - rule_id: service_gates
      applies_to: "foreground_system_boundary"
      rule: "Only the specified on-site meter calibration and unloading acceptance tests are purchased foreground service inputs, measured by actual productive technician/analyst hours. Contracts fix exact object/method/delivery result and included portable supplies/energy/sample movement/provider take-back waste. No duplicate foreground resources for those included activities. Any excluded distributor-provided resource requires a concrete card and protocol before complete data; provider scope is collected, not guessed. Tanker driving itself stays actual diesel/urea/species and asset inputs, not another complete haulage exchange."
      source_ids: []
    - rule_id: waste_handover
      applies_to: "foreground_system_boundary"
      rule: "Closed hygiene wastewater collection remains required. Inventory output ends at actual signed external handover with measured carrier, composition, quantity and receiver. No hypothetical receiver input, off-site treatment reagent/emission or future terminal scenario is in this foreground. Background waste transport/treatment may later link from that exact gate once, without adding contained water/chemicals as duplicate untreated releases. No on-site treatment is presumed; actual spills/direct releases or on-site treatment need precise medium-specific cards/protocol extension before conformity, never omission or zero."
      source_ids:
        - who-cleaning-2013
        - kingcounty-tanker-snapshot
    - rule_id: route_extensions
      applies_to: "foreground_system_boundary"
      rule: "Keep original dedicated potable diesel-tanker route, bulk reusable chemical supply and no post-fill carried-water dosing/treatment. Occurrence/configuration review must identify actual unlisted foreground chemicals, packaging, repairs, species or leaks and add specific one-property cards before complete data. Unknown occurrence/identity is a gap, not zero. WHO/King County emergency quantities are neither default doses nor universal legal criteria; selected foreground scope/allocation are PCR modelling choices."
      source_ids:
        - who-tanker-2013
        - kingcounty-tanker-snapshot
