      uuid: ""
    required_unit: "kg"
    rule: "Record purchased solution mass, active-chlorine mass fraction and batch density when converting volume; m_solution = V_L * rho_kg/L. Do not multiply solution-production dataset by active fraction again. No default concentration or dose."
