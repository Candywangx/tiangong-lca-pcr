    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use calibrated net unloaded volume accepted after quality decision; 1000 L = 1 m3. Volume is measured liquid volume at stated temperature, never gas normal volume. Subtract rejected quantity; A must be positive."
  - id: energy_conversion
    applies_to: "loading_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use the official Net calorific value reference property as the archive electricity record electrical-energy convention, not a claim of combustible electricity. E_MJ = 3.6 * E_kWh once; external grid import is supplied at point of use; purchased calibration/testing portable energy is excluded and supplier generation remains background."
  - id: concentration_basis
