      rule: "Component of equipment_share. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Unsupported actual lifetime hours, booked shares or original A_k block unit-reference results; no equal-share/current-A fallback. Record method/range/sensitivity for uncertain remaining use, never invent default weight/life. Apply capital_source_amendment for final settlement, source quantity/model-version corrections and original-denominator changes; any delta-fraction times source-quantity expression here is conditional on its unchanged-source/model requirements."
