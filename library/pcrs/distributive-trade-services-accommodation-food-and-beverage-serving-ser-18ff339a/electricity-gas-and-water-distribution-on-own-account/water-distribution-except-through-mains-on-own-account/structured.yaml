    - id: capital_source_amendment_history
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. This rule completes the existing frozen-history/remaining-life policy; it does not require retrospective replacement of historical life fractions at every life revision. Keep the original asset key, each native-unit source s and version, exact product/event gate, all beneficiary-period cohorts c, immutable raw measurements and accepted postings. Before actual final retirement, life/utilization revisions freeze historical fractions and allocate only the remaining fraction using the existing evidenced remaining driver; require 0<=F_prev_all<=1 and include the current interval and all future beneficiaries in the positive remaining denominator. A late first-observed capital source uses each historical accepted fraction and the same remaining ledger, not a full event-year charge. Keep the existing separate drivers: tanker engine-on hours including idle/empty/pumping and skid/hose connected-operation hours, each with all users and periods in the same equipment-specific unit."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_final_shares
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At actual final retirement set w_c=u_actual_c/U_final with U_final=sum_all_original_beneficiaries(u_actual)>0; all final shares sum to one, including non-study/failed/standby responsibilities already prescribed by the original driver. A transfer to continued use is not final retirement. Zero or unknown lifetime activity, unsupported prior fractions or missing original cohorts prevents final allocation; retain raw totals and the gap, never equal-split or invent use."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_source_revision
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For source correction before retirement use each original cohort accepted fraction g_c; at final retirement use g_c=w_c. Q_s,new is the evidenced FULL source quantity before allocation in its original card unit, not a remaining unallocated balance or a previously weighted amount. B_s,c is the actual previously booked attributed raw quantity for that source/cohort, with its quantity/model version and previous normalized result. Calculate A_s,c,new=Q_s,new*g_c and delta_A_s,c=A_s,c,new-B_s,c. A newly observed source has B=0 where unposted; a correction to an existing source replaces that source ID, not an additional purchase or disposal event. The shortcut (g_new-F_booked)*Q_s is valid only when the source quantity and linked model version are unchanged and B=F_booked*Q_s; otherwise use A_new-B. Reconcile physical gross receipt/stock/transfer/handover separately; signed corrections are model amendments, never negative physical exchanges or substitution credits. For a changed linked supply/treatment model, replace the affected original-cohort inventory/results even if delta_A=0; remove the previous model contribution and record both versions and scope."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_normalization
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Normalize the complete revised attributed amount once by the original cohort current verified reference denominator N_c (Q, D or A as locally named). If N_c itself changes, replace the complete old normalized result; do not add delta_A/new_N to a result based on old_N. Zero-output events retain their already prescribed causal parent; a parent without positive N_c retains raw attributed totals and an incomplete normalized result, never shifts to an unrelated positive-output period."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_scope
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Apply this to each actual capital-origin source covered by the existing gates, including separately counted initial fill, post-acceptance capital-site events and actual retirement carriers where present; do not create new sources, extend background boundaries, duplicate included supply stages or apply lifetime fractions to routine operation. These are explicit candidate accounting rules, not claimed numerical requirements of the cited classification or technical sources."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: identity_completion
      applies_to: "all inventory rows"
      requirement: "Unbound card identities remain unverified; before complete foreground publication require hash-bound direct official response/receipt and check UUID/status, EN/ZH official names, actual object/state, direction/type, primary property/unit and compartment/gate. Search hits or old conclusions are insufficient. Existing AC binding is historical verified point-of-use identity, not a fresh check. Reference service cannot use water commodity UUID."
      evidence: "direct response/receipt and row-specific review"
    - id: scope_and_occurrence
      applies_to: "all inventory rows"
      requirement: "Before collection and monthly signed vehicle/site/provider/job/stock review confirm each required or conditional object occurred or was absent. Verify actual specific equipment configuration and service contract boundary, one property/unit per row and no duplicate included initial fills/supplies/portable energy/waste. Actual unknown/extra chemical, packing, repair, species, medium or on-site treatment needs a precise foreground extension before completeness, never generic other-material card or zero."
      evidence: "signed occurrence/configuration and contract no-overlap matrix"
    - id: acceptance_quality
      applies_to: "accepted_distribution_service"
      requirement: "Before collection name local potable/customer criteria, sampling location/method/frequency and competent decision maker. Record supplier source and recipient unload results and all failures with chain of custody. Supplier source tests remain in D_s production; recipient test service starts at unloading sample gate. Signature alone is not potable compliance; WHO/King County emergency dose/residual/time values do not establish global limits."
      evidence: "approved local test protocol, custody and signed decisions"
    - id: projection_translation
      applies_to: "all inventory rows"
      requirement: "Compare EN/ZH every object, direction/type, UUID/name, single property/unit, formula/denominator, condition/negation/strength and gate. All mandatory scope, attribution, collection, calculation and quality requirements must appear in supported source tables and actual structured/guidance; schema/fingerprint/name markers alone are not semantic/scientific approval."
      evidence: "bilingual semantic review, parsed arrays and deterministic projection comparison"
    - id: inv_event_attribution
      applies_to: "loading_electricity; delivery_diesel; delivery_co2_fossil; delivery_co2_biogenic; delivery_co; delivery_ch4; delivery_n2o; delivery_no; delivery_no2; delivery_so2; delivery_pm25; delivery_pmcoarse; delivery_nh3"
      requirement: "Observed same-object post-acceptance one-time site events use foreground_capital_events; recurring use stays original cohort."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_emission_evidence
      applies_to: "delivery_co2_fossil; delivery_co2_biogenic; delivery_co; delivery_ch4; delivery_n2o; delivery_no; delivery_no2; delivery_so2; delivery_pm25; delivery_pmcoarse; delivery_nh3"
      requirement: "Screen actual vehicle/control/fuel before collection; use one measured species mass or documented source-specific factor under emission_species."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_retired_carrier
      applies_to: "retired_tanker; retired_skid; retired_hose"
      requirement: "One characterized complete supplied-object waste carrier, net kg with actual fluids removed/included explicitly reconciled. Actual terminal mass follows the original asset final actual-lifetime shares and source-specific amendments under equipment_share; no future unobserved waste or paired receiver input is invented, and no off-site treatment/capital chain is expanded."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: reference_gate
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique1m3 accepted_distribution_service output, positive A and road K>0, all qualifiers, original-load custody/vehicle return and cohort waste handover closure. Reject water commodity reference, prior-cohort leakage or unresolved destination."
    source_ids: []
  - rule_id: basis_and_conservation
    applies_to: "foreground_dataset_conformance"
    rule: "Check custody_balance and commodity_ratio, once-only A, complete empty/failed/idle/pump events, foreground services/equipment/maintenance and actual waste handover. Check same-object conversion, fixed equipment driver and no whole asset/initial fill/replacement/service-resource duplication. No background recursion, future receipt or off-site treatment species in foreground. At final retirement verify all-user actual lifetime driver, each source booked ledger, w_jk and signed delta_jkx, and versioned original-cohort A_k amendments under equipment_share; no remaining-hours division, disposal-year residual dump or negative physical-flow credit."
    source_ids: []
  - rule_id: validate_capital_amendment
    applies_to: "foreground_dataset_conformance"
    rule: "Verify the original driver, freeze/remaining ledger, actual final w, each source full Q_s/B/version, original N and whole normalized-result replacement under capital_source_amendment. Recalculate unchanged-quantity share corrections, changed quantity with unchanged share, changed model with zero physical delta, corrected original N and zero-output cases; verify mutually exclusive capital/recurring components and all beneficiaries. Missing traceable old postings or positive denominators remains incomplete; prohibit disposal-year fallback, negative physical flows, duplicate normalization or second shares."
    source_ids: []
  - rule_id: completeness_truth
    applies_to: "foreground_dataset_conformance"
    rule: "Actual unbound identities, missing raw quantities/occurrence, service gates, local acceptance evidence, unresolved balances/handover or unsupported emissions prevent complete foreground data. Candidate/authored and aligned/localized markers are not methodology/publication approval. Inspect actual EN/ZH and machine guidance obligations before handoff."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground own-account tanker distribution-service candidate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Original dedicated contracted diesel potable-water tanker route,1m3 net accepted unloading; consuming model adds source-specific D_s/A production and rejected/returned/lost fate without credit. Supplied equipment and service inputs retain exact gates and one property/unit."
  excluded_use: "Mains, bottled/non-potable/irrigation water, other modes, broker-only supply, distributor intermediate storage, standalone water commodity, whole supplier/receiver lifecycle inventory or proof of potable compliance."
  required_metadata: "All reference qualifiers; original load IDs/source D_s/A/R_s/A/L_s/A, actual temperatures/density and closed custody/return; physical idle/failed/pump events; equipment net mass and original service share; defined service method/hours/contract matrix; actual waste handover gates/receipts/stocks; quantity/occurrence/calibration and uncertainty."
  required_quality_disclosure: "Foreground-only scope, background-link gates/de-duplication, unbound identities, missing data/factors, service scope and life uncertainty, local acceptance specification and candidate/aligned state; no methodology approval."
  update_trigger: "Route/gate/specification/vehicle or supplied equipment configuration/service contract/chemical/waste handover/actual release/life assumption changes or new official identities."
data_sources:
  - id: "unsd-cpc30-69230"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 subclass 69230 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/69230"
    used_for: "Classification context only: own-account water distribution by trucks/other means; exclusions; narrower route chosen by this PCR"
  - id: "who-tanker-2013"
    type: "official_guidance"
    reference: "WHO/WEDC, Delivering safe water by tanker, Technical Note 12, July 2013, pp.12.1–12.2, Box 12.2. https://www.who.int/docs/default-source/wash-documents/wash-in-emergencies/technical-notes-on-wash-in-emergencies/who-tn-12-delivering-safe-water-by-tanker.pdf"
    used_for: "Emergency-route operation, fuel/mileage/maintenance/custody record categories and quality-conditioned delivery only. Foreground boundary/allocation and single-object/property decisions are PCR choices; no numeric logistics assumptions adopted"
  - id: "who-cleaning-2013"
    type: "official_guidance"
    reference: "WHO/WEDC, Cleaning and disinfecting water storage tanks and tankers, Technical Note 3, July 2013, pp.3.1–3.4. https://www.who.int/docs/default-source/wash-documents/wash-in-emergencies/technical-notes-on-wash-in-emergencies/who-tn-03-cleaning-and-disinfecting-water-storage-tanks-and-tankers.pdf"
    used_for: "Cleaning/rinsing/disinfection sequence and liquid-waste fate need; adaptation to distributor equipment is author-defined. No source dose or chemical formulation treated as universal or sodium-carbonate recommendation"
  - id: "kingcounty-tanker-snapshot"
    type: "official_guidance"
    reference: "Public Health—Seattle & King County, Guidelines for truck transportation of potable water for public use, snapshot 2026-10-27. https://kingcounty.gov/en/dept/dph/health-safety/safety-injury-prevention/emergency-preparedness/personal-preparedness/truck-transportation-of-water"
    used_for: "Independent regional emergency guidance: approved source, cleaning/testing, delivery records and preventing disinfectant discharge to streams; illustrates jurisdiction-specific conditions, no numerical adoption"
