system_boundary:
  rules:
    - rule_id: b_gate
      applies_to: "reference service"
      rule: "Begin at the calibrated inlet of already treated potable liquid water; end at the operator/customer acceptance meter. Include pumping, distribution storage, leak control, customer-meter maintenance and operational monitoring. Exclude raw-water abstraction, initial treatment, customer plumbing, meter installation sold separately, independent meter-reading services, intermediation, agricultural irrigation, steam, hot water and non-mains delivery."
      source_ids:
        - un_cpc
    - rule_id: b_route
      applies_to: "covered route"
      rule: "Cover gravity or electrically pumped ambient-temperature potable-water mains, with no booster chemical or sodium hypochlorite solution only. Declare legal and contractual quality, pressure and temperature criteria without inventing generic limits. Other quality classes, operating booster chemistries or operating on-site combustion need a reviewed extension and are outside this route; their actual occurrence is a scope failure, never a zero."
      source_ids:
        - epa_quality
    - rule_id: b_commodity
      applies_to: "makeup_water; capital_test_water; delivery_service"
      rule: "Output is distribution service per actual net accepted whole-liquid Q=G-R. This PCR fixes source-water burden attribution by tracked H2O-component mass, converted back to each independently supplied inlet lot volume under c_source_supply; that attributed source volume is not the mixed-liquid volume at its destination. Service inputs are operating Vop_s plus allocated capital-test f_a*Vcapital_a_s, once. Downstream commodity production uses only Vaccepted_s/Q times the matching independent source-water inventory; never full inlet production again. Embedded and reaction-generated water retain already_counted_supply_ref to the actually counted equipment/reagent and do not receive another water-production link. Keep their physical components in c_water/c_origin. Supplier-included preacceptance tests are not another foreground water purchase. Unknown origin, composition, reaction or stock/return quantity prevents complete pairing; it is neither zero nor automatically loss."
      source_ids:
        - epa_audit
    - rule_id: b_unsuccessful
      applies_to: "all network activity"
      rule: "Keep electricity, chemicals, maintenance, loss makeup and disposal burdens of failed delivery, rejection, rework, flushing and unauthorized consumption in the numerator. Only net accepted authorized deliveries meeting the declared criteria enter Q, including qualified unbilled authorized use and qualified resale. Unbilled use is not automatically leakage; meter/billing error is not an environmental release. Internal pumping, recirculation and storage transfers create neither a second reference service nor extra external water input."
      source_ids:
        - epa_audit
    - rule_id: b_foreground
      applies_to: "all rows"
      rule: "Foreground consists of identified network operation, actual operator-controlled field work, directly supplied equipment/services and on-site wastewater dechlorination only when it actually occurs within the declared operating boundary. Supplier extraction/manufacture, upstream transport, nested factory/vehicle/road/tool capital and off-site receiver treatment/EOL internals are background and absent from the inventory. This foreground selection is a modelling choice, not a source-mandated scientific approval."
      source_ids: []
    - rule_id: b_assets
      applies_to: "field_work"
      rule: "Preserve network asset responsibility through actual specified delivered pipe segments, pump sets, valves, tanks, meters, dosing units, photometers and operator maintenance vehicles, one primary property/unit per card, allocated once to this service. Keep replacements by actual function and original asset ledger, regardless of financial capital/expense label. Exclude supplier constituent manufacture and off-site EOL internals; do not replace equipment by a whole-network lifecycle service or exclude all capital implicitly."
      source_ids:
        - epa_quality
        - pipe_materials
    - rule_id: b_measurement_object
      applies_to: "all nonreference rows"
      rule: "One flow is one specified measurable product, equipment, service or characterized waste carrier with exactly one primary property and preferred unit. Complete multi-material equipment and formulated products are allowed when specification and supply gate are fixed; no material/element disassembly is required. Independent supplies, media or directions remain separate even when they share kg. Different actual configurations cannot be silently pooled as equivalent; instantiate distinguishable configuration rows or separate models."
      source_ids: []
    - rule_id: b_waste
      applies_to: "flush_sewer; flush_offsite; hypochlorite_container; field_work; onsite_dechlorination"
      rule: "Actual waste outputs end at signed foreground storage/dispatch and documented receiver handover, with generation/stock/cohort reconciliation; off-site treatment inputs, emissions and future paired receipts are not foreground. Only actual on-site treatment receives the paired internal flush carrier; cancel that internal link once and retain its actual resources/releases/waste. Gross waste carrier includes contents once, not another waste of each constituent. First environmental soil and freshwater interfaces are mutually exclusive by event; later migration is fate, not another network emission."
      source_ids:
        - epa_audit
    - rule_id: b_onsite
      applies_to: "onsite_dechlorination; field_work"
      rule: "Decide actual occurrence from operating/job/contract records. On-site chlorine-removal chemistry is distinct from the narrow NaOCl-only network booster route. Record each actually consumed specific reagent and actual post-treatment species; the listed conditional reagent cards are not assumed simultaneous inputs or default treatment recipes. Any different actual reagent or release needs a precisely specified row before completeness. Distribution pumping combustion stays excluded, but actual foreground maintenance-vehicle/tool combustion is included."
      source_ids:
        - epa_dechlorination
