allocation_rules:
  - rule_id: a_direct
    applies_to: "all rows"
    rule: "Directly assign dedicated operating inputs; shared pump electricity uses measured pumping-energy demand. Foreground work/capital follow fixed c_field, c_assets and c_event_weights methods. Original cohorts/all beneficiaries reconcile; attribute and normalize once, without revenue/customer/arbitrary-equal substitutes for available physical causal data."
    source_ids:
      - epa_audit
  - rule_id: a_losses
    applies_to: "makeup_water; capital_test_water; delivery_service; all rows"
    rule: "All included accepted handoffs share the same quality class and gate. Attribute pre-handoff loss and failed activity to that network service; no successful output is assigned to losses. Separate different quality classes or service gates into metered models; do not call them equivalent co-products. No co-product or economic allocation credit for stolen water, stock, discarded water or returned reagent packaging."
    source_ids:
      - epa_audit
dataset_production:
  collection_protocols:
    - protocol_id: cp_water
      process_id: "mains_distribution"
      flow_role: "inlet, reference and losses"
      record_type: "meter; stock; quality; cohort ledger"
      raw_fields: "G; R; Q; source_ID; inlet_lot_ID; independent_or_embedded_or_generated; supply_state; rho_s; f_H2O_s; k_s; M0; Min; M1; Mout; residual_M; W0; Win; W1; Wout; Wgenerated; Wconsumed; residual_W; W0_s; Win_s; Wreturn_s; Wgenerated_s; W1_s; Wgross_s; Wfate_s; Wconsumed_s; residual_s; Waccepted_s; Wop_s; Wcapital_a_s; Vaccepted_s; Vop_s; Vcapital_a_s; Q_share_s; reaction_event_ID; measured_reaction_extent; reactant_product_analysis; reaction_model_validation; precursor_supply_ref; source_event_fate_code; already_counted_supply_ref; stock_origin; time_step; mixing_evidence; original_acceptance_ID; return_time; original_service_cohort; original_asset_key; capital_or_recurring; f_a; w_j; causal_job_share; I_network_s; I_test_s; Win_embedded_s; temperature; pressure; meter_ID; calibration_correction; quality_acceptance; sample_time; sample_state; solution_mass; rho_solution; f_H2O; rho_water; H2O_component_mass; H2O_measurement_method; composition_closure; dissolved_constituent_masses; suspended_constituent_masses; volatile_constituent_masses; density_reference; H2O_uncertainty; Ls; Lf; U; unauthorized_volume; flush_volume; first_environment_interface; event_ID; csj; c_free_j; f_HOCl_j; f_OCl_j; pH_j; T_j; speciation_method; parameters; MW_HOCl; MW_OCl; MW_Cl2; soil_sampling_time; actual_dispatch_D_c_j; Q_c; supplier_preaccept_inclusion; asset_personnel_hours; all_beneficiary_workorder_personnel_hours; F_prev_all; u_current; U_remaining_all"
      collection_method: "Read calibrated inlet-lot and acceptance meters at synchronized time steps and measure each physical pool stock by level/geometry plus same-state density. At every supply lot/composition change and representative synchronized stock/withdrawal interval, sample source and pool liquid; measure whole mass or rho*volume and H2O fraction/component mass using c_h2o. Preserve source state, sample representativeness, method detection/uncertainty, complete constituent closure and traceable density evidence; never substitute pure-water density for source product rho_s. Reconcile c_water whole-mass and H2O ledgers monthly and each event. Record actual occurrence/absence/unknown of reactions from operations and complete reactant/product evidence; quantify only evidenced generation/consumption, with validated reaction extent/model, uncertainty and distinct precursor source tags. Missing reaction evidence leaves a gap, not a balancing term. Trace actual losses, capital tests, returns and acceptance to source/cohort IDs under c_origin; validate pool mixing before time-step source fractions, retain signed return corrections and current physical stock separately. Apply c_source_supply to independent-source volume attribution, with supplier-state inventory matching and no embedded/generated repurchase. Record potable acceptance tests and sample actual first-interface chlorine/species at the relevant leak/final outlet before environmental reaction. Keep original asset/event weights and signed receiver quantities; apply c_event_weights once, excluding supplier-included preacceptance resources. Unallocated mass/component balances and actual gross volumes remain QA, never a second water purchase. Unknown source, state, composition, density, reaction or mixing prevents completeness."
      unit: "m3; degC; kPa; applicable quality units; kg solution; kg H2O/kg solution; kg/m3 same-state density; kg H2O"
      frequency: "Continuous meters; each supply lot/composition change, reaction/return/loss/test event; representative synchronized stock/withdrawal samples; monthly reconciliation"
      temporal_coverage: "one common reporting year including all seasons; start/end stock instants"
      site_scope: "All actual network and temporary site pools within the foreground, inlet lots to acceptance or other exit; include actual onsite treatment pools, cancel internal links"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "Calibrated meters/scales/density methods; matrix-valid H2O assay and complete composition; source-lot and stock records; reaction occurrence/extent/model evidence; original acceptance and signed return/receiver records; hydraulic/tracer mixing validation and uncertainty"
    - protocol_id: cp_energy
      process_id: "mains_distribution"
      flow_role: "electricity"
      record_type: "submeter and supplier bill"
      raw_fields: "grid_import,same_purchase_returns,kWh,meter_ID,pump_run,shared_driver,supply_voltage,mix,provider,failed_runs,event_ID,original_asset_key,original_service_cohort,capital_or_recurring,causal_job_share,f_a,w_j,Vop_s,Vcapital_a_s,actual_dispatch_D_c_j,Q_c,supplier_preaccept_inclusion,Wfate_embedded_s,embedded_supply_ID,embedded_water_origin,embedded_acceptance_share,already_counted_supply_ref,I_network_s,I_test_s,Win_embedded_s,Vaccepted_s,Waccepted_embedded_s,independent_or_embedded,asset_personnel_hours,all_beneficiary_workorder_personnel_hours,F_prev_all,u_current,U_remaining_all"
      collection_method: "Read operating boundary/equipment meters and reconcile bills; subtract only verified same-purchase returns, never unrelated exports. Allocate shared use under a_direct; sum attributed E then E/Q, convert kWh/MJ by 3.6 once only. Operating onsite combustion remains excluded under b_route Also collect original asset/service cohort, one-time-capital versus recurring classification and actual handover. Under c_event_weights attribute post-acceptance capital-event resources/water/reagents/releases once to the original asset share. Raw annual balance/pending stock is QA; no old-cohort burden on current Q, no supplier-included pre-acceptance resources and no second weighting of attributed quantities."
      unit: "kWh; MJ if converted"
      frequency: "continuous meter; monthly bill and reconciliation"
      temporal_coverage: "same full reporting year as Q"
      site_scope: "covered distribution pumps, storage mixing, monitoring and booster systems; operating stage only"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "meter calibration; supplier invoices; equipment and allocation reconciliation"
    - protocol_id: cp_chemical
      process_id: "mains_distribution"
      flow_role: "hypochlorite"
      record_type: "reagent inventory and dosing records"
      raw_fields: "opening,receipts,closing,returns,transfer,solution_mass,NaOCl_fraction,density,temperature,container_mass,package_life,dose_event,event_ID,original_asset_key,original_service_cohort,capital_or_recurring,causal_job_share,f_a,w_j,Vop_s,Vcapital_a_s,actual_dispatch_D_c_j,Q_c,supplier_preaccept_inclusion,Wfate_embedded_s,embedded_supply_ID,embedded_water_origin,embedded_acceptance_share,already_counted_supply_ref,I_network_s,I_test_s,Win_embedded_s,Vaccepted_s,Waccepted_embedded_s,independent_or_embedded,asset_personnel_hours,all_beneficiary_workorder_personnel_hours,F_prev_all,u_current,U_remaining_all"
      collection_method: "Weigh deliveries and stocks or convert measured volume using lot-specific density at temperature; link batch certificates to dosing and post-repair use. c_chemical; reconcile consumed solution C and containers without double counting active mass Also collect original asset/service cohort, one-time-capital versus recurring classification and actual handover. Under c_event_weights attribute post-acceptance capital-event resources/water/reagents/releases once to the original asset share. Raw annual balance/pending stock is QA; no old-cohort burden on current Q, no supplier-included pre-acceptance resources and no second weighting of attributed quantities."
      unit: "kg solution; kg/kg active; kg/m3"
      frequency: "every delivery, dosing event and stocktake; monthly reconciliation"
      temporal_coverage: "same year as Q; opening and closing stocks"
      site_scope: "booster and post-repair disinfection within this network; direct-discharge treatment separate"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "scale calibration; safety sheet; lot assays; invoices; stock reconciliation; packaging supplier boundary"
    - protocol_id: cp_assets
      process_id: "field_work"
      flow_role: "specified delivered capital inputs"
      record_type: "acceptance and original asset allocation ledger"
      raw_fields: "original_asset_key,model,serial,configuration,count,segment_length,diameter,pressure_class,included_components,initial_fill,delivery_gate,acceptance_date,capacity,service_capacity_hours,all_user_whole_life_capacity_hours,engine_duty_hours,instrument_engaged_hours,past_charges,remaining_fraction,life_revision,replacement_key,calibration,event_ID,original_service_cohort,capital_or_recurring,causal_job_share,f_a,w_j,Vop_s,Vcapital_a_s,actual_dispatch_D_c_j,Q_c,supplier_preaccept_inclusion,Wfate_embedded_s,embedded_supply_ID,embedded_water_origin,embedded_acceptance_share,already_counted_supply_ref,I_network_s,I_test_s,Win_embedded_s,Vaccepted_s,Waccepted_embedded_s,independent_or_embedded,asset_personnel_hours,all_beneficiary_workorder_personnel_hours,F_prev_all,u_current,U_remaining_all ; source-specific B/version and original N fields in cp_capital_amendment"
      collection_method: "Count accepted complete specified equipment and survey accepted configuration-specific pipe length at operator gate; retain drawings/invoices/acceptance and actual inclusions. Determine available capacity/use and evidenced expected whole-life driver from asset plans and service records; apply c_assets once with all beneficiaries/periods. Keep initial fill as included equipment stock and do not repurchase it. No supplier component/BOM, factory, transport or EOL expansion Also collect original asset/service cohort, one-time-capital versus recurring classification and actual handover. Under c_event_weights attribute post-acceptance capital-event resources/water/reagents/releases once to the original asset share. Raw annual balance/pending stock is QA; no old-cohort burden on current Q, no supplier-included pre-acceptance resources and no second weighting of attributed quantities.  For capital-test water, collect source-lot rho_s, f_H2O_s and H2O event fates with cp_water and calculate source-state Vcapital_a_s under c_source_supply; gross mixed test volume is not the supply amount. Complete cp_capital_amendment reconciliation for final settlement and source/denominator revisions."
      unit: "item; m preferred exchange units; h and capacity*h raw drivers"
      frequency: "each delivery/replacement/retirement/change; annual original-ledger reconciliation"
      temporal_coverage: "original asset life ledger and same Q-year service share"
      site_scope: "only directly supplied operator foreground equipment/segments, not supplier supporting assets"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "acceptance records; configuration/dimensions; life/use evidence; calibration; all-beneficiary fractions and remaining balance"
    - protocol_id: cp_capital_amendment
      process_id: "field_work"
      flow_role: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      record_type: "versioned_original_source_and_cohort_ledger"
      raw_fields: "asset_ID; source_ID and original row_ID/native unit; original acceptance/event gate; full measured source quantity and old/new versions; measurement/calibration/state basis; each original beneficiary-period/driver unit/u_actual; period b where applicable; all past/future beneficiaries; F_prev_all and remaining_driver; accepted g/F_booked; raw booked B; old normalized result/original N and corrected N; background model versions/scope; actual final retirement evidence; A_new/delta_A/replacement/deduplication links"
      collection_method: "Collect original records at asset/supplier acceptance, actual site events and receiver handover gates as applicable; verify full quantities through the existing cp_assets weighing/configuration-count/length/driver measurement and calibration methods. At every source/life/model/denominator revision and final retirement, compare old/new records for every original cohort and apply capital_source_amendment. Reconcile all-beneficiary fractions, source totals and each amendment link; the service data custodian reviews and signs the reconciliation. Prove nonoccurrence by complete event registers/zero-activity evidence, never absence-as-zero; retain unresolved identities, measurement uncertainty and incomplete causes."
      unit: "source-native units; fixed driver units; original reference units"
      frequency: "each acceptance/event/revision/final retirement; annual reconciliation"
      temporal_coverage: "complete original asset history and original service cohorts; evidenced remaining life"
      site_scope: "existing foreground gates and capital-source responsibility only"
      aggregation_rule: "once per original reference flow"
      quality_evidence: "raw measurement/calibration; signed acceptance/event/receiver records; source/model versions; all-beneficiary and revision reconciliation ledger"
