  calculation_rules:
    - id: c_water
      applies_to: "makeup_water; capital_test_water; delivery_service; all rows"
      rule: "Q=G-R uses gross accepted whole-liquid handoff G and actual returns R on their original acceptance basis; later returns correct the original service cohort once, not an unrelated current Q. Physical returns enter the actual return-period stock ledger once. For each physical pool and synchronized interval close whole-stream kg: M0 + sum(Min) = M1 + sum(Mout) + residual_M. Include all actual boundary water, equipment-contained liquid, reagents, returns, gas/solid/liquid exits and stocks applicable to that pool; cancel internal transfers and do not create hypothetical exchanges. Chemical reaction creates no total-mass source. Separately for H2O kg close W0 + sum(Win) + Wgenerated = W1 + sum(Wout) + Wconsumed + residual_W. Win/Wout are actual H2O in the same streams, using c_h2o measurement, with source tags under c_origin. Only actual evidenced reactions may have Wgenerated/Wconsumed, from measured reaction extent and complete reactant/product analysis or a validated reaction balance with documented uncertainty; these terms never fill an unexplained residual. Record actual gross volumes for meters, Q, waste carriers and event QA, but do not add embedded H2O equivalent volume to a solution volume or assume inlet, mixture and outlet volumes add even at equal temperature/pressure. Investigate both residuals against propagated measurement uncertainty; never clip or convert a discrepancy to loss. Obtain independent service supply Vop_s/Vcapital_a_s from classified source-component fates under c_source_supply, not from gross inlet minus Q. Apply event weights once and divide attributed amounts by original cohort Q once; raw physical closure stays unallocated."
      inputs:
        - G
        - R
        - Q
        - M0
        - Min
        - M1
        - Mout
        - residual_M
        - W0
        - Win
        - W1
        - Wout
        - Wgenerated
        - Wconsumed
        - residual_W
        - source_event_ledger
        - reaction_evidence
        - original_service_cohort
      output: "Q; unallocated whole-mass and H2O QA; attributed supply B_s/Q"
      source_ids:
        - epa_audit
    - id: c_chemical
      applies_to: "hypochlorite; all independently supplied reagents"
      rule: "Raw formulation consumption C=opening+receipts-closing-returns/transfers, reconciled by batch/event. Only independently supplied C_separate_j enters purchase cards; equipment-included initial fill is a separately source-tagged stock memorandum for total use/release mass QA, never another reagent purchase. Convert measured volume using lot-temperature rho to whole-product mass; active C*x is QA, not another active-plus-solution purchase. Attributed quantity=sum_j(w_j*C_separate_j), divided by Q once."
      inputs:
        - opening
        - receipts
        - closing
        - returns
        - transfers
        - formulation
        - rho
        - temperature
        - x
        - initial_fill_origin
        - C_separate_j
        - w_j
        - Q
      output: "independently supplied formulation kg/Q; full initial-fill/use mass QA"
      source_ids: []
    - id: c_origin
      applies_to: "makeup_water; capital_test_water; delivery_service"
      rule: "Use source s at inlet lot/state resolution, distinguishing independent water, embedded equipment/reagent water and actual reaction-generated water; record technology, geography, quality and already_counted_supply_ref where applicable. Track H2O kg W for each source in every real pool: W0_s + Win_s + Wreturn_s + Wgenerated_s = W1_s + Wgross_s + Wfate_s + Wconsumed_s + residual_s. Wgross_s is gross accepted outward H2O; Wfate_s includes separately measured nonaccepted exits, supplier returns and other external transfers, with exclusive event/fate codes. Win_s excludes separately recorded Wreturn_s. Incoming network, independent test and embedded components are disjoint: already metered component mass is not added again and internal withdrawal creates no new source. Use independent zones, tracers or measured source tracking; only with verified hydraulic/turnover mixing use time-step source H2O stock fractions for simultaneous withdrawals and reaction consumption, updating source stocks each step, never annual inlet shares. Generated H2O receives a new reaction source tag linked to its actual already-counted precursor supply; do not also retain that generated mass under an original water tag. Consumed source H2O stays assigned to its actual operating/capital event, not erased. Returns restore actual current stocks with original tags and revise original accepted Waccepted_s once; preserve source burden on stock without a new purchase. Waccepted_s is original gross accepted H2O less linked returns. If reported, Q_share_s=Q*Waccepted_s/sum_s(Waccepted_s) only allocates bulk service Q for metadata; it is not measured source volume or a commodity production quantity. Unknown source, reaction attribution, nonpositive required denominator or invalid mixing prevents complete source pairing."
      inputs:
        - W0_s
        - Win_s
        - Wreturn_s
        - Wgenerated_s
        - W1_s
        - Wgross_s
        - Wfate_s
        - Wconsumed_s
        - residual_s
        - Waccepted_s
        - Q_share_s
        - source_ID
        - lot_state
        - time_step
        - mixing_evidence
        - reaction_evidence
        - already_counted_supply_ref
        - Q
      output: "source H2O kg ledger; original acceptance correction; optional service-share metadata"
      source_ids: []
    - id: c_source_supply
      applies_to: "makeup_water; capital_test_water; delivery_service"
      rule: "For each independent source-water lot s measure inlet whole-liquid density rho_s (kg/m3) and H2O mass fraction f_H2O_s at the actual supply state; k_s=rho_s*f_H2O_s is kg H2O per m3 of that supplied product, positive and evidenced. Fixed attribution: Vaccepted_s=Waccepted_s/k_s; Vop_s=Wop_s/k_s; Vcapital_a_s=Wcapital_a_s/k_s. Wop_s and Wcapital_a_s are independent-source H2O assigned once to actual operating nonaccepted fates or identified postacceptance capital-test nonaccepted fates, including their evidenced chemical consumption; distinguish loss, rejection, unauthorized transfer, waste and reaction codes. Recovered reusable water remains source stock or moves internally and is not consumed a second time. Supplier returns/other external commodity transfers retain their own responsibility model, not operating loss. Reconcile all source receipt/stock/return/accepted/nonaccepted/reaction categories in H2O kg and source-volume equivalents before allocation; the ratio is the PCR fixed supply-burden driver, not an assertion that nonwater constituents follow H2O physically. Whole-mass/constituent QA remains separate. B_s=Vop_s+sum_a(f_a*Vcapital_a_s) is entered by the two water cards once, source-matched and divided by Q; already weighted quantities are not weighted again. Independent commodity production adds sum_s(Vaccepted_s/Q*matched independent supply inventory), preserving each lot technology, quality, geography, state and gate. Embedded/generated sources have Waccepted_s and nonaccepted W records but no independent V purchase or production link: bind only the already-counted equipment/reagent supply and its actual attribution. Do not force sum(Vaccepted_s)=Q, replace k_s by pure-water density, or use Q_share_s for supply production. Unknown/zero k_s or unresolved source closure blocks quantities, never defaults."
      inputs:
        - rho_s
        - f_H2O_s
        - k_s
        - Waccepted_s
        - Wop_s
        - Wcapital_a_s
        - Vaccepted_s
        - Vop_s
        - Vcapital_a_s
        - f_a
        - Q
        - already_counted_supply_ref
      output: "source-state independent water m3/Q; separate embedded source responsibility"
      source_ids: []
    - id: c_speciation
      applies_to: "hocl_freshwater; ocl_freshwater; hocl_soil; ocl_soil; treatment_hocl_freshwater; treatment_ocl_freshwater"
      rule: "For each actual release stream j, measure free available chlorine c_free_j as Cl2, pH and temperature. Obtain f_HOCl and f_OCl by validated measured speciation or a model validated for that water matrix, with source, parameters, validity domain and uncertainty. Demonstrate complete species coverage and fractions summing to one; combined chlorine, molecular chlorine or other chlorine species require their own atomic cards and extended analysis rather than forcing them into these two species. Species s mass=sum(w_j*Vj*c_free_j*0.001*f_s_j*MW_s/MW_Cl2)/Q kg. MW require traceable laboratory or standard evidence; Cl2-equivalent is not molecular chlorine. Apply the molar-mass ratio once and no additional dose, destination-share or removal multiplier. No assumed pKa, default pH, decay or fate; unknown speciation blocks completeness."
      inputs:
        - Vj
        - c_free_j
        - pH_j
        - T_j
        - f_s_j
        - MW_s
        - MW_Cl2
        - Q
        - validated_model
        - event_ID
        - original_asset_key
        - original_service_cohort
        - w_j
      output: "kg actual species per m3 reference service"
      source_ids: []
    - id: c_h2o
      applies_to: "makeup_water; capital_test_water; delivery_service; water_soil; water_freshwater; treatment_water_freshwater"
      rule: "Q, Ls, Lf and Vout_j retain their actual gross solution-volume measurements for function/event QA, not additive network source closure or elementary H2O amounts. Apply the following component measurements also to inlet, stock, return and fate streams in c_water/c_origin; c_source_supply uses inlet product rho_s*f_H2O_s, not pure-water density. For each same-state event measure solution_mass; if only Vsolution is measured, determine solution_mass=rho_solution*Vsolution using measured solution density. Determine f_H2O (kg H2O/kg solution) with a matrix-validated water-specific laboratory method; a composition-difference water fraction is permitted only if all dissolved, suspended and volatile nonwater constituents are independently identified/quantified and composition closes within uncertainty. M_H2O=solution_mass*f_H2O kg; directly measured H2O component mass receives no further density or water-fraction multiplication. Water m3=M_H2O/rho_water, where rho_water is traceable water-component density at its declared temperature/pressure in kg/m3, not solution density. Record density source, method, state, validity and uncertainty; no default rho or f_H2O=1. Masses of separately reported HOCl, OCl and other ions/solids are excluded from M_H2O. Actual waste flows retain whole-carrier quantity and their contained species are not another duplicate waste; actual final releases follow individual species cards. Attribute once and divide by Q once; no repeated fraction or destination share. Unknown composition/density blocks H2O quantity/completeness and is not zero."
      inputs:
        - Vsolution
        - solution_mass
        - rho_solution
        - f_H2O
        - H2O_component_mass
        - rho_water
        - sample_state
        - H2O_measurement_method
        - composition_closure
        - density_reference
        - H2O_uncertainty
        - Q
        - event_ID
        - original_asset_key
        - original_service_cohort
        - w_j
      output: "kg H2O and same-state m3 H2O/Q; separate solution-volume QA ledger"
      source_ids: []
    - id: c_assets
      applies_to: "field_work"
      rule: "For each original specified fixed network asset a, f_a=service-specific available capacity-hours / evidenced all-user whole-life capacity-hours; for operator vehicles use service engine-on duty hours / all-user whole-life same hours, including empty/idling/failed tasks; for portable instruments use service engaged-use hours / all-user whole-life same hours. Multiply the delivered accepted count or configuration-specific pipe length by f_a once, then divide by Q once. Preserve all periods/beneficiaries, past charged fractions and remaining service; cumulative fractions <=1, life revisions affect only remaining fraction/use with retirement true-up, not restarting a fully charged asset. New replacement capital has a distinct key; an actual consumable replacement is a current measured input, not both another full capital asset and repair input. Equipment manufacture/delivery transport/off-site EOL and supporting assets are background, with no nested capital coefficients. On life revision freeze historical fractions: f_new,current=(1-F_prev_all)*u_current/U_remaining_all, where F_prev_all is all previously charged original-asset fractions across periods/beneficiaries, and U_remaining_all includes the current period with the same fixed original-equipment driver. Unknown/nonpositive remaining denominator blocks completeness; true up residual at retirement without restarting the whole asset. Apply capital_source_amendment for final settlement, source quantity/model-version corrections and original-denominator changes; any delta-fraction times source-quantity expression here is conditional on its unchanged-source/model requirements."
      inputs:
        - original_asset_key
        - configuration
        - count_or_length
        - capacity_hours
        - duty_hours
        - engaged_hours
        - all_user_whole_life_driver
        - past_charges
        - remaining_fraction
        - Q
        - F_prev_all
        - u_current
        - U_remaining_all
      output: "attributed specified delivered equipment count or pipe length / Q"
      source_ids: []
    - id: capital_source_amendment
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Within this entry's declared applies_to scope, apply the complete ordered rule group: capital_source_amendment_history; capital_source_amendment_final_shares; capital_source_amendment_source_revision; capital_source_amendment_normalization; capital_source_amendment_scope. Use this entry's inputs, reference denominator and output; all definitions, conditions, exclusions and completion requirements across that group apply jointly. These components form one method, not additional exchanges or repeated allocation. Reading only a component is insufficient for completion. Follow the existing ownership and deduplication rules when one event appears in more than one entry."
      inputs:
        - cp_capital_amendment
        - cp_assets
        - capital_source_amendment_history
        - capital_source_amendment_final_shares
        - capital_source_amendment_source_revision
        - capital_source_amendment_normalization
        - capital_source_amendment_scope
      output: "attributed totals in source-native units; normalize once by original N_c"
      source_ids: []
    - id: c_field
      applies_to: "field_work"
      rule: "Dedicated actual job supplies are directly assigned; shared vehicle fuel is allocated by actual occupied payload-mass distance with empty/idling/failed return activity attached to its originating job; shared electric tools use actual metered energy, and shared sampling supplies/lab service use actual completed same-method analysis jobs. Assign already service-specific quantities no further fraction. Keep actual site-work contracts at their measured completion gate, excluding included materials/fuel from separate cards for the same work. Failed/repeated work stays in the numerator. Calculate physical totals first, apply sharing once and Q division once."
      inputs:
        - job_ID
        - gate
        - raw_totals
        - shared_driver
        - all_user_driver
        - contract_inclusions
        - Q
      output: "attributable foreground work inputs / Q"
      source_ids: []
    - id: c_waste
      applies_to: "flush_sewer; flush_offsite; hypochlorite_container; field_work; onsite_dechlorination"
      rule: "Reconcile original-cohort raw generation, stocks, handovers, other movements, evidenced losses and unexplained residuals under custody_mass_balance and custody_loss_link; generation and pending stock remain QA only. Vs to sewer, Vo to off-site direct treatment, Vd to actual on-site treatment and physical leak destinations are exclusive. Actual on-site input Vd matches the internal output and cancels once; no off-site hypothetical treatment inventory. Output waste carrier retains its measured gross mass/volume and composition, never duplicated by contained-species waste. Free available chlorine equivalent=sum(Vj*c_free_j*0.001)/Q kg as Cl2 is QA only; individual final species use validated speciation. No destination fraction on already destination-specific volume or another active fraction on as-Cl2 concentration. Keep original generation/return cohorts and unknown destination as a gap; handover does not prove treatment occurred. External handover cards use actual D_c_j dispatched from this modelled original responsibility cohort, attributed by event weight once; generation/pending stock are QA only. Historical-cohort dispatch belongs to original Q_c, never all current Q. Generation without actual handover is not a transferred flow."
      inputs:
        - dispatch
        - closing
        - opening
        - Vs
        - Vo
        - Vd
        - Vout
        - Vj
        - c_free_j
        - Q
        - event_ID
        - original_asset_key
        - original_service_cohort
        - w_j
      output: "foreground waste handovers, internal on-site link and actual releases / Q"
      source_ids: []
    - id: custody_mass_balance
      applies_to: "original-cohort waste custody and actual losses"
      rule: "O + G + T_in = C + H + T_out + L + epsilon, in raw whole-carrier kg for one original generation lot, declared custody pool and matched interval. O/C are opening/closing physical stocks; G is newly generated material entering custody, counted once; H is gross actual accepted external handover under the existing gate; T_in/T_out are other evidenced physical movements (including returns or reclassification), with origin/destination and paired ledger entries, never also H or new G. Internal movements cancel when pools are consolidated. A physical return retains the original lot and enters T_in paired to the original gross H; keep that historical H in this physical ledger. Any later acceptance/attribution correction is separate and must not also reduce H in this equation. Correct an erroneous handover that never occurred without inventing a return. Reclassification without a physical pool-boundary movement changes the state label only, never T_in/T_out. L is evidenced physical loss after entry into this custody pool, not a balancing plug; epsilon is the signed unexplained measurement residual. Calculate epsilon = O + G + T_in - C - H - T_out - L; investigate it against propagated measurement uncertainty and retain the evidence and unresolved remainder. Unknown quantities must not be zero-filled or converted into L. Weigh the actual whole carrier at each event and stock count, or use calibrated volume times density at matching state/temperature/composition; distinguish whole-carrier mass from dry mass and contained-species mass. Moisture loss is an evidenced physical movement, not an unsupported basis conversion. Record zero loss only with inspection/measurement coverage and uncertainty evidence. Do not allocate or normalize this physical QA equation. Retain each inventory row’s declared property/unit: a volume-based handover row uses actual handed-over volume; its matched density conversion to kg serves this physical QA only and never creates a second output. Example with zero opening/closing/other movements and no unexplained residual: G=10 kg, H=9 kg, L=1 kg; output H remains 9 kg. Example values are not defaults."
      inputs:
        - O
        - G
        - T_in
        - C
        - H
        - T_out
        - L
        - epsilon
        - cp_waste
      output: "Raw whole-carrier kg closure; actual H only at handover"
      source_ids: []
    - id: custody_loss_link
      applies_to: "original-cohort waste custody and actual losses"
      rule: "Link custody entry, movement and loss event IDs to c_water and the declared network/custody pool endpoints. A network leak before custody entry and a later storage loss are distinct events; never book the same event in both pools. Preserve c_h2o and c_speciation: total lost solution/carrier kg is not automatically kg H2O or kg pollutant; use matched measured composition and first receiving medium, with each actual release counted once. Internal onsite treatment transfers have matching endpoints and cancel once; no assumed off-site emissions. Apply c_event_weights and the original Q_c once. Missing species/medium rows or unresolved loss identities require explicit matching cards and identity review before completion; unknown residuals are not releases."
      inputs:
        - custody_mass_balance
        - cp_waste
      output: "One actual release event at its original allocation and denominator"
      source_ids: []
    - id: c_onsite
      applies_to: "onsite_dechlorination"
      rule: "Meter actual received Vd, dosing/adsorbent consumption, purchased electricity, final Vout and retained water/solids/stocks for each real foreground batch. Close whole-mass and H2O-component balances under c_water, including only evidenced actual reaction generation/consumption, and relevant elemental/species balances with actual analyses and uncertainty; no assumed removal efficiency, stoichiometric dose, pure-water fraction or equal inlet/outlet. Sample final discharge after treatment at the first environment interface. Do not use whole off-site receiving-plant concentration or resources. Any real on-site residue or unlisted product/species needs a specific quantity/identity card; absent process requires records, unknown is not zero."
      inputs:
        - batch_ID
        - Vd
        - Vout
        - stock
        - retained_water
        - reagent
        - energy
        - post_treatment_species
        - uncertainty
        - Q
        - event_ID
        - original_asset_key
        - original_service_cohort
        - w_j
      output: "actual on-site treatment inputs, H2O/species releases and residue handover / Q"
      source_ids: []
    - id: c_field_emissions
      applies_to: "field_work"
      rule: "For each actual foreground engine species use measured integrated release OR fuel activity times source-specific native-basis species factor, recording engine/fuel/control, factor unit, reference state and uncertainty. Never add both routes, nor multiply composition/oxidation/molecular ratio again when already included in the factor. Annual fuel/carbon balance is QA, not an additional release. NO and NO2 and nonoverlapping PM fractions remain separate. Actual biofuel carbon origin needs explicit species partition and appropriate added biogenic rows rather than fossil or zero; no speculative supplier emissions."
      inputs:
        - event_ID
        - actual_fuel
        - species
        - medium
        - measured_release
        - native_factor
        - factor_unit
        - engine
        - controls
        - carbon_origin
        - Q
      output: "kg actual foreground species / Q"
      source_ids: []
    - id: c_event_weights
      applies_to: "all rows"
      rule: "For post-acceptance one-time foreground installation/commissioning/retirement event j, attach actual resources, trial water, chemicals, electricity, work, waste handover and actual releases to the original beneficiary asset a; use w_j=f_a once under the original service-period capital ledger. Actual recurring operation/maintenance has w_j=its measured causal service share, equal to 1 if dedicated. First subdivide directly attributable portions to original assets using site records or independent measurements; a directly attributed portion receives no shared fraction. Split a still-inseparable same-source capital work order once by each original asset measured personnel-hours / total personnel-hours of all beneficiary assets in that work order, then multiply each corresponding f_a. Unknown/nonpositive personnel-hour denominator blocks completeness. No nested supplier coefficients. Already attributed physical quantities receive no second w_j. Keep raw annual physical balances unweighted for QA, and separately sum attributed event totals then divide by the modelled original-cohort Q once. Pre-acceptance supplier-included site resources are excluded; actual operator post-acceptance resources remain. Final capital settlement and source/original-denominator revisions follow capital_source_amendment; recurring components do not receive lifetime allocation."
      inputs:
        - event_ID
        - original_asset_key
        - original_service_cohort
        - capital_or_recurring
        - actual_event_total
        - causal_job_share
        - f_a
        - w_j
        - Q
      output: "attributed foreground resources, water/species and handovers / original-cohort Q"
      source_ids: []
    - id: capital_source_amendment_history
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. This rule completes the existing frozen-history/remaining-life policy; it does not require retrospective replacement of historical life fractions at every life revision. Keep the original asset key, each native-unit source s and version, exact product/event gate, all beneficiary-period cohorts c, immutable raw measurements and accepted postings. Before actual final retirement, life/utilization revisions freeze historical fractions and allocate only the remaining fraction using the existing evidenced remaining driver; require 0<=F_prev_all<=1 and include the current interval and all future beneficiaries in the positive remaining denominator. A late first-observed capital source uses each historical accepted fraction and the same remaining ledger, not a full event-year charge. Keep the original asset-specific driver: available capacity-hours for fixed network assets, engine-on duty hours including empty/idling/failed work for operator vehicles, and engaged-use hours for portable instruments. Never combine different driver units into one lifetime denominator."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_final_shares
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. At actual final retirement set w_c=u_actual_c/U_final with U_final=sum_all_original_beneficiaries(u_actual)>0; all final shares sum to one, including non-study/failed/standby responsibilities already prescribed by the original driver. A transfer to continued use is not final retirement. Zero or unknown lifetime activity, unsupported prior fractions or missing original cohorts prevents final allocation; retain raw totals and the gap, never equal-split or invent use."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_source_revision
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. For source correction before retirement use each original cohort accepted fraction g_c; at final retirement use g_c=w_c. Q_s,new is the evidenced FULL source quantity before allocation in its original card unit, not a remaining unallocated balance or a previously weighted amount. B_s,c is the actual previously booked attributed raw quantity for that source/cohort, with its quantity/model version and previous normalized result. Calculate A_s,c,new=Q_s,new*g_c and delta_A_s,c=A_s,c,new-B_s,c. A newly observed source has B=0 where unposted; a correction to an existing source replaces that source ID, not an additional purchase or disposal event. The shortcut (g_new-F_booked)*Q_s is valid only when the source quantity and linked model version are unchanged and B=F_booked*Q_s; otherwise use A_new-B. Reconcile physical gross receipt/stock/transfer/handover separately; signed corrections are model amendments, never negative physical exchanges or substitution credits. For a changed linked supply/treatment model, replace the affected original-cohort inventory/results even if delta_A=0; remove the previous model contribution and record both versions and scope."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_normalization
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Normalize the complete revised attributed amount once by the original cohort current verified reference denominator N_c (Q, D or A as locally named). If N_c itself changes, replace the complete old normalized result; do not add delta_A/new_N to a result based on old_N. Zero-output events retain their already prescribed causal parent; a parent without positive N_c retains raw attributed totals and an incomplete normalized result, never shifts to an unrelated positive-output period."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
    - id: capital_source_amendment_scope
      applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
      rule: "Component of capital_source_amendment. Before execution, read the complete group listed by the applicable entry: its definitions, conditions and exclusions govern every component. Use only that entry's actual event scope and original denominator; this component is not a separate exchange or independently additive result. Apply this to each actual capital-origin source covered by the existing gates, including separately counted initial fill, post-acceptance capital-site events and actual retirement carriers where present; do not create new sources, extend background boundaries, duplicate included supply stages or apply lifetime fractions to routine operation. These are explicit candidate accounting rules, not claimed numerical requirements of the cited classification or technical sources."
      inputs:
        - cp_capital_amendment
        - cp_assets
      output: "Method component; the originating entry owns the inventory result"
      source_ids: []
  data_quality_requirements:
    - id: q_scope
      applies_to: "all rows"
      requirement: "Retain network, potable class, state, gates, year and Q. One specified measurable object/property/unit per row is required, not homogeneous composition. Actual operating route failure, unlisted input/receiver gate, composition or H2O/speciation uncertainty remains explicit; missing identity/quantity is never zero."
      evidence: "declared boundary and configuration register; gap/action/uncertainty log"
    - id: q_gates
      applies_to: "all purchased inputs and waste outputs"
      requirement: "Fix actual supply/acceptance/handover inclusions for equipment, formulated products and specified services. Equipment included initial fill, supplied components, delivery, installation or service fuel/material/energy is not bought again in another row; actual operational top-up and work not included remain separate. Match downstream background datasets to exactly these foreground gates and exclude overlapping supply/treatment stages when linked later. No hidden supplier manufacture or receiver internals remain in foreground prose or machine guidance."
      evidence: "supplier/contract inclusion matrix; initial-fill inventory; stage and job reconciliation"
    - id: q_occurrence
      applies_to: "all conditional rows"
      requirement: "For each card decide occurs/absent/unknown using actual asset configuration, purchase, work, sample, treatment and receiver records. A conditional list is not a default recipe/BOM. New actual equipment configuration, fuel, reagent, waste or species needs a precise one-property/unit exchange before complete foreground coverage; do not prelist supplier hypothetical emissions. Unknown data triggers named corrective collection, uncertainty and blocked complete claim."
      evidence: "applicability decision per row; records proving absence; corrective collection register"
    - id: q_identity
      applies_to: "reference and all selected flows"
      requirement: "Only point-of-use AC identity is reused from historical direct official evidence, with generic property/group support separately verified. Other candidate identities are unbound; no new UUID is invented. Validate direct record/status/name/state/property/unit/compartment and hash evidence before binding. Chinese official AC name is preserved; semantic bilingual alignment is distinct from scientific approval and formal translation review."
      evidence: "historical direct-response integrity receipt; unresolved row register; bilingual comparison"
    - id: q_service_attempt
      applies_to: "sample_analysis; trench_work; road_reinstatement; field_work"
      requirement: "An analysis item is completed specified method plus independently delivered report, not a conforming water result; a nonconforming result still counts when method/report are complete. Count a repeat report separately only when independently delivered and its rework burden is not already included in the matched supplier per-report inventory. A no-report aborted attempt is neither an invented one item nor zero burden: prove its actual resources are included in supplier per-report background, otherwise before complete use add a specifically defined aborted DPD-analysis-attempt service with method, start/end gates, recorded attempt duration h and acceptance conditions, or record actual specific inputs where the foreground performs the attempt. Procured trench m3/surface m2 services count actual accepted geometry only; do not invent extra volume/area for failed/repeated work already in the supplier unit burden. Explicitly cover actual resources not included at that exact supply gate through a defined service or real foreground resources, never omit them."
      evidence: "completed reports and sample-result status; repeat/abort jobs; supplier per-unit/rework inclusion proof; actual duration/resources; work geometry acceptance and rework records"
    - id: inv_chlorine_species
      applies_to: "hocl_freshwater; ocl_freshwater; hocl_soil; ocl_soil"
      requirement: "Free available chlorine reported as mg/L as Cl2 is an analytical equivalent, never molecular Cl2 emission. Determine actual species mass under the speciation calculation; incomplete other-species identification blocks complete emissions."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_asset_background
      applies_to: "asset_iron_main; asset_pe_main; asset_pump; asset_valve; asset_tank; asset_meter; asset_booster; asset_photometer; asset_van; asset_dechlorinator"
      requirement: "Supplier manufacture, delivery transport and off-site EOL internals are background; do not also input its constituents or included components/initial fill."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_engine_emissions
      applies_to: "field_co2_fossil_air; field_co_air; field_ch4_air; field_n2o_air; field_no_air; field_no2_air; field_so2_air; field_pm25_air; field_pm_coarse_air"
      requirement: "Conditional actual foreground engine/vehicle release at the first air interface, measured or calculated with source-specific native-basis factors and actual fuel/control configuration."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
    - id: inv_treated_species
      applies_to: "onsite_chloride_freshwater; onsite_sulfate_freshwater; onsite_sulfite_freshwater; onsite_sodium_freshwater"
      requirement: "Actual individual final-outlet species at the first freshwater interface, after real on-site treatment. Direct species-mass analysis or validated species conversion is required; no automatic reagent-to-discharge stoichiometric yield."
      evidence: "Existing collection protocols and evidence of each listed inventory row."
validation_rules:
  - rule_id: validate_custody_balance
    applies_to: "original-cohort waste custody and actual losses"
    rule: "Verify custody_mass_balance and custody_loss_link with dated original-lot stocks, actual handover receipts, paired movements, calibrated loss evidence and propagated uncertainty. Distinguish evidenced L from unexplained epsilon and block unqualified completion for unresolved quantities, identity or fate. Verify that G=10, H=9, L=1 with other terms zero closes, H stays 9, each release appears once at its first medium, and allocation/normalization does not alter raw physical closure."
    source_ids: []
  - rule_id: v_balance
    applies_to: "makeup_water; capital_test_water; delivery_service; all rows"
    rule: "Require Q>0 and finite same-cohort totals; separately reconcile whole-mass and H2O source/stock/return/fate balances under c_water/c_origin, including only evidenced reaction terms. Verify source-state k_s and c_source_supply attribution without additive-volume assumptions, mixed-liquid minus component-volume arithmetic, forced sum(Vaccepted_s)=Q or conversion of unexplained residual to loss. Preserve dynamic source matching, actual H2O component versus whole solution and chlorine-equivalent versus species. Every actual first environmental interface and foreground waste handover occurs once; no hypothetical receiver release or duplicate internal output."
    source_ids:
      - epa_audit
  - rule_id: v_exchanges
    applies_to: "all rows"
    rule: "Check one primary property/preferred unit, actual specified object/gate, executable quantity/protocol and one allocation/Q normalization. Full equipment or specific service is not invalid merely because it contains different materials; unspecified bundles/selectors remain invalid. Remove supplier and off-site treatment internals, retain actual on-site work/treatment, and verify no supplied included stage is counted twice."
    source_ids: []
  - rule_id: validate_capital_amendment
    applies_to: "original-asset sources and their one-time capital-event components; excludes recurring operating components"
    rule: "Verify the original driver, freeze/remaining ledger, actual final w, each source full Q_s/B/version, original N and whole normalized-result replacement under capital_source_amendment. Recalculate unchanged-quantity share corrections, changed quantity with unchanged share, changed model with zero physical delta, corrected original N and zero-output cases; verify mutually exclusive capital/recurring components and all beneficiaries. Missing traceable old postings or positive denominators remains incomplete; prohibit disposal-year fallback, negative physical flows, duplicate normalization or second shares."
    source_ids: []
  - rule_id: v_projection
    applies_to: "canonical bilingual content and projection"
    rule: "Ordered rows, directions/types, properties/units, identities, formulas, qualifiers, conditions, negations, protocol/rule IDs and supported mandatory tables must agree across languages and guidance. Regenerate structured normally; schema/fingerprint and candidate/aligned markers do not establish scientific review or publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground potable-water mains distribution-service dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "same quality/route/year/acceptance gates with source-matched water commodity pairing and declared foreground scope"
  excluded_use: "standalone complete delivered-water footprint; initial water production, nonpotable/thermal/nonmains routes, undeclared supplier manufacture or off-site treatment internals"
  required_metadata: "Actual bulk Q; source H2O kg, rho_s, f_H2O_s, k_s, Vaccepted_s, Vop_s, Vcapital_a_s; Q_share_s only if separately labelled allocation metadata; whole-mass/H2O closure, reaction evidence and source stock/returns, original assets/event weights, specific equipment/service gates and primary units, actual waste handovers, real on-site treatment and first environment medium"
  required_quality_disclosure: "candidate identity/quantity gaps, pending handover stocks, composition/speciation/density uncertainty and excluded background stages; neither standalone delivered-water footprint nor scientific/publication approval"
  update_trigger: "network equipment, contract gates, water source, actual operating route, quality, loss/stock/returns, on-site treatment, asset life or waste receiver-gate changes"
data_sources:
  - id: "un_cpc"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 subclass 69210, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/69210"
    used_for: "Own-account mains distribution and meter-maintenance scope and explicit exclusions; not numerical LCA factors"
  - id: "epa_audit"
    type: "official_guidance"
    reference: "US EPA, Water Audits and Water Loss Control For Public Water Systems, EPA 816-F-13-002 (2013), https://www.epa.gov/sites/default/files/2015-04/documents/epa816f13002.pdf"
    used_for: "Physical versus apparent water losses and audit logic; the service/commodity split and cohort accounting are explicit PCR rules, not claimed EPA mandates"
  - id: "epa_quality"
    type: "official_guidance"
    reference: "US EPA, Distribution System Water Quality: Maintaining a Disinfectant Residual, EPA 815-F-21-003 (2021), https://www.epa.gov/system/files/documents/2021-12/ds-toolbox-fact-sheets_disinfectant_residual.pdf"
    used_for: "Distribution storage, flushing, booster disinfection and infrastructure maintenance relevance; no imported example dose, limit or default"
  - id: "epa_dechlorination"
    type: "official_guidance"
    reference: "US EPA, Wastewater Technology Fact Sheet Dechlorination, EPA 832-F-00-022 (2000), https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P1001L40.TXT"
    used_for: "Official text representation supports qualitative chemical/species and monitoring screening only; no example dose, concentration, performance or regulatory limit adopted. PCR attribution/collection rules are explicit method design"
  - id: "pipe_materials"
    type: "extension_guidance"
    reference: "McWane Ductile, Cement-Mortar Lining, https://www.mcwaneductile.com/products/linings/cement-lining/"
    used_for: "Historical manufacturer text supports mortar-lined ductile-iron potable-pipe specification relevance only; it does not mandate constituent disassembly or supply universal composition/life/factors. Foreground scope/equipment measurement is this PCR method choice."
