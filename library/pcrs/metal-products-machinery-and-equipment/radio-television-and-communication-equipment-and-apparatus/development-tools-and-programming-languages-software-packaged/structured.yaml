      evidence: "Package bill of materials, supplier specifications, batch records and weighing evidence"
    - id: dq_release_waste_closure
      applies_to: "optical-media and paper-box production rejects"
      requirement: "Reconcile each issued material separately to conforming package components, outgoing production waste and stock change. Identify actual waste quantity and treatment route; accept zero waste only when complete batch records demonstrate zero rejects."
      evidence: "Material ledger; batch and reject logs; scale records; stock reconciliation; waste transfer and treatment evidence"
    - id: dq_hardware_materiality
      applies_to: "developer workstations and build or operation servers"
      requirement: "Retain the device inventory, supplier/device evidence, materiality screen, allocation factors and explicit cutoff decision for every included or excluded hardware class. A material device class must appear as a concrete hardware exchange."
      evidence: "Asset or provider inventory; procurement/specification; supplier/device LCA; allocation worksheet; signed cutoff record"
    - id: dq_allocation_reproducibility
      applies_to: "shared electricity and hardware"
      requirement: "Preserve interval boundaries, reserved and total resources, expected hardware life, source embodied-emission data and formulas so an independent reviewer can reproduce each allocation."
      evidence: "Allocation worksheet and source device or supplier evidence; green-software-foundation-sci-1-1-0"
    - id: dq_no_offset_substitution
      applies_to: "carbon-intensity disclosures"
      requirement: "Do not use offsets or market-based claims to reduce measured energy, operational emissions or allocated hardware embodied emissions."
      evidence: "Calculation workbook and factor provenance; green-software-foundation-sci-1-1-0"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Require exactly one reference output using UUID 0771060f-3f5c-45f4-a914-cec63115361d, mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, mass unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66 and kg. Reject download, service or adjacent software identities."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
      - un-cpc-3-0-system-software-downloads-84341
  - rule_id: validate_reference_qualifiers
    applies_to: "foreground data package"
    rule: "Fail completeness when product version, development function, entitlement, supported platform/runtime, release acceptance criteria, carrier, package configuration, geography, reporting period or included stages are missing. Require workload and assessment period when operation is included."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
      - green-software-foundation-sci-1-1-0
  - rule_id: validate_process_and_rows
    applies_to: "process inventory"
    rule: "Require development and product-release processes. Permit operation only with its inclusion condition. Check that every listed row is one atomic exchange, uses the declared direction, property and unit, and is not duplicated across overlapping meters or stages."
    source_ids: []
  - rule_id: validate_conditional_package_inputs
    applies_to: "optical media and paper box"
    rule: "Require optical_media_input only for an optical-carrier route and paper_box_input only when a paper box is present. Require any different actual carrier or packaging article as its own concrete additional exchange."
    source_ids: []
  - rule_id: validate_release_waste_closure
    applies_to: "optical-media and paper-box production rejects"
    rule: "For each applicable route, require the corresponding outgoing waste row, actual quantity and treatment route. Recalculate issued input against conforming incorporated mass, rejected waste and stock change. Accept zero only from complete batch records, and reject end-of-life assumptions used as production-scrap evidence."
    source_ids: []
  - rule_id: validate_electricity
    applies_to: "electricity rows"
    rule: "Recalculate MJ from retained kWh using 3.6 MJ/kWh; verify meter interval, geography, reserved/provisioned resource treatment, stage assignment, copy or workload normalization and absence of double counting."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: validate_hardware_materiality
    applies_to: "developer workstation, build-server and operation-server hardware"
    rule: "Require a device inventory and documented materiality screen. When material, require the corresponding concrete hardware exchange and verify device mass, expected life, time share and resource share; when excluded, require disclosed screening evidence, cutoff rationale and estimated omitted burden. An optional emissions result alone does not satisfy the exchange requirement."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: validate_allocation
    applies_to: "shared resources and hardware embodied burden"
    rule: "Require a causal allocation worksheet. For hardware embodied burden, verify TE, TiR, EL, RR and ToR and confirm consistent units; report the result as inconclusive when any required factor lacks evidence."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: validate_boundary_disclosure
    applies_to: "published dataset"
    rule: "Require explicit disclosure of the software/component boundary, release cycle, supporting infrastructure, physical package, exclusions, operational extension status, allocation methods and data gaps."
    source_ids:
      - green-software-foundation-sci-1-1-0
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Foreground data package for process and lifecyclemodel projections of a declared packaged development-tool or programming-language software release"
  allowed_use: "Comparison or modelling of products with the same principal development function, version/entitlement basis, physical package state, system boundary, geography, and—when applicable—operational workload and assessment period"
  excluded_use: "Download-only software, custom development services, hosted development environments, dissimilar software functions, undisclosed package configurations, or comparisons that mix cradle-to-release and operationally extended boundaries"
  required_metadata: "PCR id; product name and version; development function; entitlement; supported platform, architecture and runtime; release-cycle dates; source/build identifiers; release acceptance criteria; carrier and package bill of materials; production and supply geography; conforming-copy count; finished-package mass; release-waste quantities and treatment routes; hardware inventory and materiality decisions; reporting period; included processes and infrastructure; operational workload and period when included"
  required_quality_disclosure: "Primary versus modelled data share; meter and telemetry coverage; temporal granularity; package sampling; upstream dataset geography and technology; allocation factors; hardware life and resource share; hardware screening and disclosed cutoffs; production-waste mass-balance closure and treatment evidence; exclusions; data gaps; uncertainty and validation findings"
  update_trigger: "New major product version, materially different build/test architecture, carrier or package configuration, entitlement or platform change, operational workload change, supplier or grid-region change, allocation-method change, or data older than the representative release cycle"
