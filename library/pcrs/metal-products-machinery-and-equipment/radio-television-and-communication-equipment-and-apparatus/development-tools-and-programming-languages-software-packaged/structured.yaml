      collection_method: "Export pipeline or facility energy data for compilation, test, scan, release acceptance and package preparation"
      unit: "kWh"
      frequency: "Per job, test run or packaging batch"
      temporal_coverage: "Complete build, test and release cycle for the declared version"
      site_scope: "All included build, test and package-preparation infrastructure"
      aggregation_rule: "Deduplicate overlapping meters; sum attributable kWh and divide by conforming copies"
      quality_evidence: "Pipeline logs; meter/provider evidence; batch reconciliation; allocation worksheet"
