measurement_rules:
  - id: reference_package_mass
    applies_to: "packaged reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the complete supplied package configuration represented by one copy. Record the number of copies weighed, tare treatment, scale resolution and mean mass per conforming copy; do not treat licence count alone as mass."
  - id: electricity_energy_conversion
    applies_to: "development, release and operational electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Collect metered or telemetry electricity in kWh and convert to the TianGong reference unit using exactly 1 kWh = 3.6 MJ. Preserve the original kWh record and identify meter coverage, reserved/provisioned resources and conversion."
  - id: functional_unit_consistency
    applies_to: "all included software components and stages"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize development and release records to the same released-copy population. When an operational result is reported, use one consistent declared workload and assessment period for every included component and disclose every conversion to the packaged-copy reference."
