      collection_method: "Export calibrated meter or provider telemetry and join to release-specific development activity; document any modelled gap"
      unit: "kWh"
      frequency: "Per metering interval and release activity"
      temporal_coverage: "Complete declared release development cycle"
      site_scope: "All included development sites and provisioned infrastructure"
      aggregation_rule: "Remove overlap with release and operation meters; allocate shared intervals causally; sum kWh and divide by conforming released copies"
      quality_evidence: "Meter calibration or provider methodology; telemetry export; release/activity join; allocation worksheet"
    - protocol_id: cp_developer_workstation_hardware
