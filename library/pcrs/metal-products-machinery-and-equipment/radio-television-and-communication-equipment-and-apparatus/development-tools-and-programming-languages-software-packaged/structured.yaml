      collection_method: "Link each workstation to asset records, screen its allocated embodied burden, and calculate release-attributable mass only when material"
      unit: "kg"
      frequency: "Per device and declared release cycle"
      temporal_coverage: "Complete declared release development cycle"
      site_scope: "Every owned, leased or dedicated workstation materially supporting development"
      aggregation_rule: "Apply documented time and resource shares to device mass; divide by conforming copies; retain screening evidence for exclusions"
      quality_evidence: "Asset register; invoice or specification; scale or manufacturer mass; supplier/device LCA; allocation worksheet; cutoff record"
    - protocol_id: cp_release_electricity
