allocation_rules:
  - rule_id: allocation_avoid_subdivide
    applies_to: "release-specific foreground activities"
    rule: "Avoid allocation by separating repositories, build jobs, test runs, package batches and meters that are attributable to the declared release."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_shared_electricity
    applies_to: "shared compute and facility electricity"
    rule: "Allocate shared measured electricity using the same time interval as the activity record and a documented causal resource share such as reserved processor time, memory, storage or job runtime. Do not allocate idle but provisioned resources away when they were reserved for the release or workload."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_hardware_embodied
    applies_to: "hardware embodied burden"
    rule: "When hardware embodied burden is included, calculate the release or workload share as total hardware embodied emissions multiplied by time reserved divided by expected life and multiplied by resources reserved divided by total resources. Use device-specific LCA data where available and disclose every factor."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_multiple_releases
    applies_to: "shared development and release activities"
    rule: "Use measured causal resource consumption for each release. If no defensible causal relation exists, report the shared amount and allocation gap for review rather than selecting revenue, licence price or copy count solely for convenience."
    source_ids:
      - green-software-foundation-sci-1-1-0
dataset_production:
  collection_protocols:
    - protocol_id: cp_development_electricity
      process_id: "software_development"
      flow_role: "development_electricity"
      record_type: "meter, device telemetry and release activity records"
