system_boundary:
  rules:
    - rule_id: boundary_release_cycle
      applies_to: "software development and product release"
      rule: "Include the resources directly attributable to requirements implementation, coding, compilation, testing, build, release acceptance, package preparation and release delivery within the reporting organization. Exclude unrelated organizational overhead, marketing, customer-specific development services and work assigned to other releases."
      source_ids:
        - un-cpc-3-0-explanatory-notes-2025
        - un-cpc-3-0-system-software-downloads-84341
        - green-software-foundation-sci-1-1-0
    - rule_id: boundary_supporting_infrastructure
      applies_to: "included software-system activities"
      rule: "Include electricity for provisioned or reserved compute, storage, networking, monitoring, logging, scanning, build pipelines and testing when those resources materially support the declared release or operational workload."
      source_ids:
        - green-software-foundation-sci-1-1-0
    - rule_id: boundary_hardware_materiality
      applies_to: "developer workstations and build or operation servers"
      rule: "Screen embodied hardware using a device- or supplier-specific inventory and the declared time-and-resource allocation. Include each concrete hardware exchange when material to the study goal; otherwise retain and disclose the screening result, evidence, cutoff decision and omitted burden. An optional emissions scalar cannot replace a material physical hardware exchange."
      source_ids:
        - green-software-foundation-sci-1-1-0
    - rule_id: boundary_physical_package
      applies_to: "carrier and packaging configuration"
      rule: "Include each physical carrier and packaging article actually incorporated into the supplied product as a separate atomic input. The listed optical-media and paper-box rows are conditional examples; any different actual carrier or packaging article must be added as its own concrete foreground exchange. Download-only electronic files belong to the separate download boundary and are excluded."
      source_ids:
        - un-cpc-3-0-explanatory-notes-2025
        - un-cpc-3-0-system-software-downloads-84341
    - rule_id: boundary_operation_extension
      applies_to: "supported operation"
      rule: "Include operation only when the study declares the installed components, workload, platform, location and assessment period. Include supporting infrastructure that significantly contributes to execution and disclose excluded components."
      source_ids:
        - green-software-foundation-sci-1-1-0
boundary_abstraction:
  declared_starting_condition: "Approved product requirements, source-code baseline and third-party component lockfile at the start of the release cycle"
  starting_condition_role: "Defines the release-specific starting point; prior generic research and previously completed releases are outside the foreground unless their resources are causally assigned to the declared release"
  product_classification_scope: "Published packaged development tools and programming-language software; adjacent system software, application software, downloads and software-development services are outside the category"
  recursive_input_rule: "A same-category tool used to produce the release is recorded once as an upstream product input dataset at the point it crosses the foreground boundary; its own development chain is not recursively re-expanded inside this foreground package"
  upstream_dataset_requirement: "Use geographically and technologically representative upstream datasets for electricity, optical media, paper boxes and any additional actual atomic inputs; do not relabel upstream emissions as direct foreground emissions"
  disclosure: "Declare release-cycle dates, repositories and components covered, build/test environments, physical carrier and package bill of materials, allocation basis, excluded infrastructure, geography, and whether operation is included"
