  calculation_rules:
    - id: calc_kwh_to_mj
      applies_to: "every electricity row"
      rule: "MJ = kWh × 3.6"
      inputs:
        - "collected kWh"
      output: "electricity amount in MJ"
      source_ids: []
    - id: calc_per_copy_normalization
      applies_to: "development, release, optical-media and paper-box amounts"
      rule: "Per-copy amount = attributable release or batch amount ÷ conforming supplied-copy count"
      inputs:
        - "attributable amount"
        - "conforming-copy count"
      output: "amount per supplied copy"
      source_ids: []
    - id: calc_shared_resource_share
      applies_to: "shared electricity"
      rule: "Attributable electricity = interval electricity × documented reserved-resource share; keep provisioned idle resources in the share when reserved for the release or workload"
      inputs:
        - "interval kWh"
        - "reserved resources"
        - "total resources"
        - "activity interval"
      output: "attributable kWh"
      source_ids:
        - green-software-foundation-sci-1-1-0
    - id: calc_hardware_allocated_mass
      applies_to: "developer workstation, build-server and operation-server hardware rows"
      rule: "Allocated hardware mass = device mass × (time reserved ÷ expected life) × (resources reserved ÷ total resources)"
      inputs:
        - "device mass"
        - "time reserved"
        - "expected life"
        - "resources reserved"
        - "total resources"
        - "release-copy or workload denominator"
      output: "allocated hardware mass per supplied copy or declared workload"
      source_ids:
        - green-software-foundation-sci-1-1-0
    - id: calc_hardware_embodied_share
      applies_to: "optional hardware embodied burden"
      rule: "M = TE × (TiR ÷ EL) × (RR ÷ ToR)"
      inputs:
        - "total embodied emissions TE"
        - "time reserved TiR"
        - "expected life EL"
        - "resources reserved RR"
        - "total resources ToR"
      output: "allocated hardware embodied emissions for the declared release or workload"
      source_ids:
        - green-software-foundation-sci-1-1-0
    - id: calc_release_material_balance
      applies_to: "optical-media and paper-box routes"
      rule: "Issued input mass = mass incorporated in conforming packages + rejected waste mass transferred out + closing stock attributable to the batch − opening stock attributable to the batch"
      inputs:
        - "issued material mass"
        - "conforming output and component mass"
        - "rejected waste mass"
        - "opening and closing stock"
      output: "route-specific release-batch mass-balance residual"
