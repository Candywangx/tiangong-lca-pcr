      frequency: "Per server group and declared release cycle"
      temporal_coverage: "Complete build, test and release cycle"
      site_scope: "All owned, leased or dedicated server hardware materially supporting build, test, scan or release"
      aggregation_rule: "Apply documented time and resource shares to device mass; prevent overlap with operation; divide by conforming copies; retain screening evidence for exclusions"
