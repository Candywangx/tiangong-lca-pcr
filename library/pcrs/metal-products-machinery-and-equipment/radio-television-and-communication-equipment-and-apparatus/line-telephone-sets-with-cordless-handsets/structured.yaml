measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize every inventory result to 1 kg of complete unpackaged product. Include the base station, declared handsets, installed or supplied batteries, required power supplies, charging cradles, cables and supplied operating accessories; exclude packaging mass and record it separately."
  - id: configuration_mass_reconciliation
    applies_to: "bill of materials and finished product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure the accepted finished configuration and reconcile component and subassembly masses to the unpackaged set mass. Preserve the native measured masses before normalization and explain all residual mass."
  - id: standby_power_measurement
    applies_to: "base station and every charging cradle"
    required_property_ref:
      name: "Power"
      uuid: ""
    required_unit: "W"
    rule: "Record factory-default average power separately for the base station with the charged handset on and off the base, and for every separate charging cradle with the charged handset on and, where measured, off the cradle. Record voltage, frequency, test method, stabilization and averaging interval."
  - id: call_power_measurement
    applies_to: "base station, handset charging path and supplied power equipment"
    required_property_ref:
      name: "Power"
      uuid: ""
    required_unit: "W"
    rule: "Record average active call power for the declared connection and radio configuration, separately from standby and charging. Record whether the handset is on or off the cradle, call function, display state, audio mode and battery state."
  - id: use_energy_conversion
    applies_to: "use-stage electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Calculate electricity as the sum over declared modes of measured power in W multiplied by mode duration in h and divided by 1,000. Keep base standby, separate-cradle standby, call operation and charging terms identifiable."
  - id: packaging_mass_separation
    applies_to: "primary, secondary and transport packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each packaging material and mass separately; do not add packaging to the 1 kg reference product mass."
