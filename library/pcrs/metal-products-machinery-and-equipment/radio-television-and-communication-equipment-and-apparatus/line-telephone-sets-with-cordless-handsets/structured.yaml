    reference: "ITU-T Recommendation L.1410, Methodology for environmental life cycle assessments of information and communication technology goods, networks and services, November 2024, https://www.itu.int/rec/T-REC-L.1410-202411-I, retrieved 2026-08-09"
    used_for: "ICT-specific LCA framing, life-cycle inventory, data quality, uncertainty and reporting"
