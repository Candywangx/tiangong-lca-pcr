allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground_manufacturing"
    rule: "Avoid allocation by separately metering assembly, test, packaging and waste processes for the declared product configuration wherever feasible."
    source_ids:
      - pep-pcr-ed4-electrical-electronic
  - rule_id: allocation_physical
    applies_to: "shared_processes"
    rule: "When allocation cannot be avoided, use a physical relationship that represents the shared process, such as accepted product mass, board area, machine time or units produced, and document the choice."
    source_ids:
      - pep-pcr-ed4-electrical-electronic
  - rule_id: allocation_economic_fallback
    applies_to: "shared_processes"
    rule: "Use economic allocation only when no defensible physical relationship exists; disclose the prices, period, currency and sensitivity of the result."
    source_ids:
      - pep-pcr-ed4-electrical-electronic
  - rule_id: allocation_recycling
    applies_to: "end_of_life"
    rule: "Keep treatment burdens inside the declared end-of-life boundary and report benefits or loads from recovered materials beyond the system boundary separately; do not double count avoided production."
    source_ids:
      - pep-pcr-ed4-electrical-electronic
dataset_production:
  collection_protocols:
    - protocol_id: cp_configuration_bom
      process_id: "final_assembly_and_packaging"
      flow_role: "configuration, components and packaging"
      record_type: "controlled BOM, supplier declaration and measured mass record"
      raw_fields: "model and revision; base count; handset count; component and material identity; part and supplier; PCB count and mass; display/keypad/acoustic parts; housing material; battery chemistry, capacity, size, count and replaceability; power and charging equipment; cable/accessory count; product mass; packaging material and mass"
      collection_method: "Freeze one saleable configuration, verify against teardown or incoming inspection, weigh product and packaging separately, and reconcile the BOM"
      unit: "kg, count, V, Ah or Wh as applicable"
      frequency: "each model revision and representative production batch"
      temporal_coverage: "declared representative production period"
      site_scope: "every final assembly site and material supplier represented"
      aggregation_rule: "normalize each mass to accepted unpackaged product kg; keep site and supplier strata before aggregation"
      quality_evidence: "signed BOM revision, scale calibration, supplier specification, teardown or incoming-inspection record and mass reconciliation"
    - protocol_id: cp_assembly_energy_and_waste
      process_id: "final_assembly_and_packaging"
      flow_role: "assembly electricity and waste"
      record_type: "meter, invoice, production and waste records"
      raw_fields: "meter start and end; production quantity and mass; accepted output; rejects; rework; waste stream and destination"
      collection_method: "Submeter where feasible; otherwise allocate documented site records using the approved allocation rule"
      unit: "kWh, kg"
      frequency: "each production reporting period"
      temporal_coverage: "declared period representative of normal production"
      site_scope: "every final assembly and test site represented"
      aggregation_rule: "subtract documented non-product loads where separately metered, allocate shared loads, and divide by accepted product mass"
      quality_evidence: "meter and scale calibration, invoice reconciliation, production logs and waste transfer records"
    - protocol_id: cp_distribution_records
      process_id: "distribution"
      flow_role: "routes and packaging fate"
      record_type: "shipment and logistics records"
      raw_fields: "packaged mass; origin; destination; mode; distance; load factor; returned or reusable packaging; packaging treatment"
      collection_method: "Use actual shipment records; identify every leg and packaging handoff"
      unit: "kg, km, tonne-km"
      frequency: "representative shipments and whenever routes change"
      temporal_coverage: "declared sales and distribution period"
      site_scope: "target-market routes represented"
      aggregation_rule: "calculate each leg separately and sum after normalization to unpackaged product kg"
      quality_evidence: "freight documents, route source, mass record and packaging return evidence"
    - protocol_id: cp_power_mode_records
      process_id: "use_and_charging"
      flow_role: "standby, call and charging electricity"
      record_type: "laboratory power test and use-profile record"
      raw_fields: "base and cradle count; firmware and factory settings; landline interface; radio standard and frequency band; supply voltage and frequency; handset position; battery state; display/audio mode; standby, call and charging power; stabilization and averaging interval; hours by mode; service life; electricity geography"
      collection_method: "Measure the saleable configuration with calibrated instruments and retain separate results for base standby with handset on and off, each separate cradle, active call and charging"
      unit: "W, h, kWh"
      frequency: "each hardware, firmware, power-supply or configuration revision"
      temporal_coverage: "test date plus declared service-life use scenario"
      site_scope: "each target-market electrical and radio configuration represented"
      aggregation_rule: "calculate mode electricity separately, sum over the service life, and divide by unpackaged product mass"
      quality_evidence: "test report, instrument calibration, configuration photographs, firmware record and use-scenario source"
    - protocol_id: cp_repair_and_replacement_records
      process_id: "use_and_charging"
      flow_role: "batteries and replacement parts"
      record_type: "service, warranty, supplier and scenario records"
      raw_fields: "part type; battery chemistry, size, capacity and mass; replacement cause; replacement count; service-life timing; replaced-part destination"
      collection_method: "Use observed service records when available; otherwise declare the reviewed replacement scenario without presenting it as an observed rate"
      unit: "kg, count"
      frequency: "each model and service-life scenario update"
      temporal_coverage: "declared service life"
      site_scope: "target market and repair channel represented"
      aggregation_rule: "multiply part mass by documented replacements and keep batteries separate from other parts"
      quality_evidence: "service logs, warranty summary, spare-part specification and scenario approval"
    - protocol_id: cp_end_of_life_scenario
      process_id: "end_of_life"
      flow_role: "collection, dismantling and treatment"
      record_type: "operator mass balance and route record"
      raw_fields: "collection rate; transport; reuse; battery, PCB, display, cable and plastic separation; recovered fractions; residual treatment; geography"
      collection_method: "Prefer operator-specific data; otherwise use a documented geographically representative treatment scenario and disclose substitutions"
      unit: "kg, km, tonne-km"
      frequency: "each treatment scenario or operator update"
      temporal_coverage: "declared scenario reference period"
      site_scope: "market-specific collection and treatment system"
      aggregation_rule: "reconcile incoming discarded mass with reuse, recovered outputs, regulated fractions, emissions and final residues"
      quality_evidence: "operator report, weighing records, permits, chain-of-custody documents and mass balance"
  calculation_rules:
    - id: calc_component_normalization
      applies_to: "component and packaging rows"
      rule: "normalized amount = measured row amount divided by accepted unpackaged product mass; packaging remains a separate row"
      inputs:
        - "component mass"
        - "packaging mass"
        - "accepted product mass"
      output: "kg per kg reference product"
      source_ids:
        - pep-pcr-ed4-electrical-electronic
    - id: calc_assembly_energy
      applies_to: "assembly electricity"
      rule: "normalized electricity = allocated assembly, test and packaging electricity divided by accepted unpackaged product mass"
      inputs:
        - "metered kWh"
        - "allocation driver"
        - "accepted product mass"
      output: "kWh per kg reference product"
      source_ids:
        - pep-pcr-ed4-electrical-electronic
    - id: calc_distribution_service
      applies_to: "distribution transport"
      rule: "transport service = sum of packaged shipment mass in tonnes multiplied by route distance in km, divided by unpackaged product mass in kg"
      inputs:
        - "packaged mass"
        - "route distances and modes"
        - "unpackaged product mass"
      output: "tonne-km per kg reference product"
      source_ids:
        - pep-pcr-ed4-electrical-electronic
    - id: calc_use_electricity
      applies_to: "standby, call and charging electricity"
      rule: "lifetime kWh = sum over modes and devices of measured power in W multiplied by mode hours and divided by 1,000; report each term before summing"
      inputs:
        - "measured power by mode"
        - "device count"
        - "mode hours"
        - "service life"
        - "unpackaged product mass"
      output: "kWh per kg reference product over the declared service life"
      source_ids:
        - eu-2023-1670-cordless-phones
        - energy-star-telephony-v3
        - pep-pcr-ed4-electrical-electronic
    - id: calc_eol_mass_balance
      applies_to: "end-of-life treatment"
      rule: "incoming discarded mass = reuse plus recovered products plus separately treated regulated fractions plus final residues, adjusted only for documented process additions or emissions"
      inputs:
        - "operator or scenario mass records"
      output: "reconciled kg per kg discarded product"
      source_ids:
        - eu-weee-2012-19-annex-vii
        - pep-pcr-ed4-electrical-electronic
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Freeze one model revision and saleable configuration; verify the exact product-flow UUID and all required qualifiers."
      evidence: "product label, BOM revision, configuration record and Tiangong identity reference"
    - id: dq_completeness
      applies_to: "manufacturing inventory"
      requirement: "Account for every declared PCB, display, keypad, housing, acoustic part, battery, power supply, charger, cable, accessory and packaging item; identify missing supplier datasets without dropping their mass."
      evidence: "BOM-to-scale reconciliation, supplier dataset register and missing-data log"
    - id: dq_measurement
      applies_to: "mass, energy and power records"
      requirement: "Use calibrated instruments, preserve native readings and units, and document conversions, sampling and allocation."
      evidence: "calibration certificates, raw readings and calculation workbook"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "State the collection dates and demonstrate that the period represents normal production and operation; identify abnormal periods and substitutions."
      evidence: "dated production, test, shipment and treatment records"
    - id: dq_geography_technology
      applies_to: "upstream and scenario data"
      requirement: "Match component technology, production geography, electricity market, radio variant, distribution and end-of-life system to the declared product and market."
      evidence: "supplier metadata, test configuration, route records and dataset metadata"
    - id: dq_use_scenario
      applies_to: "use stage"
      requirement: "Keep measured power separate from assumed mode hours and service life; disclose the source and uncertainty of every use-profile term."
      evidence: "power test report, scenario approval and sensitivity record"
    - id: dq_eol
      applies_to: "end-of-life"
      requirement: "Demonstrate mass balance and separate handling of batteries, relevant PCBs, displays, cables and regulated materials; avoid unsubstantiated recycling credits."
      evidence: "operator mass balance, chain of custody and treatment documentation"
validation_rules:
  - rule_id: validate_scope_configuration
    applies_to: "dataset_identity"
    rule: "Fail if the dataset mixes cellular phones, corded-only phones, independent base stations, independent cradles or separately sold handsets with the complete cordless line telephone set."
    source_ids:
      - eu-2023-1670-cordless-phones
      - energy-star-telephony-v3
  - rule_id: validate_reference_flow
    applies_to: "reference_flow"
    rule: "Require product flow ec74af79-0aac-4d55-bf93-f30369e74bfb, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg, with exactly 1 kg after normalization."
    source_ids: []
  - rule_id: validate_radio_and_network
    applies_to: "required_qualifiers"
    rule: "Require the base and handset count, landline interface, radio standard, operating frequency band and target market; reject a generic DECT label without the actual market band."
    source_ids:
      - etsi-en-300-175-1
      - eu-2023-1670-cordless-phones
  - rule_id: validate_component_and_packaging_inventory
    applies_to: "manufacturing_inventory"
    rule: "Require explicit rows or traceable upstream datasets for PCB assemblies, display, keypad/buttons, housings, acoustic parts, batteries, power supplies, charging equipment, cables and packaging, with packaging mass separate from product mass."
    source_ids:
      - pep-pcr-ed4-electrical-electronic
      - eu-2023-1670-cordless-phones
      - eu-weee-2012-19-annex-vii
  - rule_id: validate_power_modes
    applies_to: "use_stage"
    rule: "Require measured base standby, separate-cradle standby where present, active call and charging power, plus mode hours and service life; fail if standby limits or brochure values are substituted for measured lifetime electricity without disclosure."
    source_ids:
      - eu-2023-1670-cordless-phones
      - energy-star-telephony-v3
      - pep-pcr-ed4-electrical-electronic
  - rule_id: validate_eu_standby_limits
    applies_to: "eu_market_claim"
    rule: "For products declared compliant with Regulation (EU) 2023/1670, require base-station networked standby at or below 1 W and separate-cradle standby with a charged handset at or below 0.6 W; also retain the required test settings."
    source_ids:
      - eu-2023-1670-cordless-phones
  - rule_id: validate_battery_replaceability
    applies_to: "battery_inventory"
    rule: "Require rechargeable battery chemistry, capacity, standardized physical size, count, mass and replacement method. For applicable EU market claims, verify the relevant end-user replacement and spare-part requirements rather than assuming compliance."
    source_ids:
      - eu-2023-1670-cordless-phones
      - eu-2023-1542-batteries
  - rule_id: validate_eol_separation
    applies_to: "end_of_life"
    rule: "Require an end-of-life mass balance and separate treatment records for batteries, relevant PCBs, displays, external cables and any brominated-flame-retardant plastics or other regulated fractions present."
    source_ids:
      - eu-weee-2012-19-annex-vii
      - pep-pcr-ed4-electrical-electronic
published_dataset_profile:
  dataset_role: "Configuration-specific foreground product-system dataset for a complete line telephone set with cordless handset or handsets"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of household, office or public fixed-line cordless telephone configurations whose base, handset count, radio and network interface, power and charging arrangement, battery, components, packaging, service life and geography match the dataset"
  excluded_use: "Cellular or satellite phones, corded-only phones, Wi-Fi-only handsets, independent base stations or cradles, separately sold additional handsets, routers, switches, component-only products, or configurations with materially different handset count, radio band, charging or battery design without adjustment"
  required_metadata: "PCR id and version context; product-flow UUID; model and revision; base and handset count; network interface; radio standard and operating band; target market; power supplies and cradles; battery chemistry, capacity, size and replaceability; display, keypad, PCB and housing configuration; product and packaging mass; production sites; use profile; service life; replacements; transport and end-of-life scenario"
  required_quality_disclosure: "Primary versus secondary data share; supplier dataset gaps; mass reconciliation; meter and scale calibration; allocation; temporal, geographic and technological representativeness; power test method; scenario sources; uncertainty and sensitivity; end-of-life mass balance"
  update_trigger: "Change to hardware revision, base or handset count, PCB, display, keypad, housing, battery, power supply, charging arrangement, radio standard or band, firmware affecting power, packaging, production site, supplier dataset, use profile, service life, regulation, or end-of-life route"
