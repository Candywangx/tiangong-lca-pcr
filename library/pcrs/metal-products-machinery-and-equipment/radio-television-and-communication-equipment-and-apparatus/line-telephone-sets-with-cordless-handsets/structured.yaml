system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The required boundary is cradle-to-grave for the declared complete set. It includes raw-material and component production, PCB assembly, housing and keypad manufacture, display and acoustic subassemblies, rechargeable batteries, external power supplies and charging equipment, final assembly and testing, packaging, distribution, electricity during standby, calling and charging over the declared service life, replacement batteries and other declared replacement parts, collection, dismantling, recycling, recovery and final treatment."
      source_ids: []
    - rule_id: boundary_complete_lifecycle
      applies_to: "declared_product_system"
      rule: "Include manufacturing, distribution, installation where material, use and end-of-life stages; report any optional benefits and loads beyond the system boundary separately."
      source_ids:
        - pep-pcr-ed4-electrical-electronic
        - itu-t-l1410-2024
    - rule_id: boundary_configuration_integrity
      applies_to: "reference_configuration"
      rule: "Model one internally consistent base-and-handset configuration. Do not combine a cordless set with cellular phones, corded-only phones or an independent base station."
      source_ids:
        - eu-2023-1670-cordless-phones
        - energy-star-telephony-v3
    - rule_id: boundary_component_completeness
      applies_to: "manufacturing"
      rule: "Include the declared PCB, display, keypad, housing, acoustic, battery, power-supply, charging, cable, accessory and packaging inventories; justify any missing supplier dataset and retain its mass in the completeness check."
      source_ids:
        - pep-pcr-ed4-electrical-electronic
        - eu-2023-1670-cordless-phones
        - eu-weee-2012-19-annex-vii
    - rule_id: boundary_use_modes
      applies_to: "use_stage"
      rule: "Include measured base and cradle standby, active call and battery charging electricity for the declared configuration and use profile; do not substitute a certification limit for measured foreground power."
      source_ids:
        - eu-2023-1670-cordless-phones
        - energy-star-telephony-v3
        - pep-pcr-ed4-electrical-electronic
    - rule_id: boundary_end_of_life
      applies_to: "end_of_life"
      rule: "Include separate handling of batteries, relevant circuit boards, displays, external cables and other regulated components before downstream recycling, recovery or disposal."
      source_ids:
        - eu-weee-2012-19-annex-vii
        - pep-pcr-ed4-electrical-electronic
