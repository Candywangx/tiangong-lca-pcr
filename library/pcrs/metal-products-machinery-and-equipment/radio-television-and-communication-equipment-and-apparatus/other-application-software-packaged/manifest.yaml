review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_items:
    - Compatible count-based software release entitlement product-flow UUID is unresolved. Exact-named mass-based packaged-software flow is unsuitable; software-distribution toxicity-property flow is unsuitable. Number-of-items property and Item(s) group support declared count, not a specific software identity.
    - Inventory flow UUIDs and exact property/unit/provider interfaces remain unresolved for applicable code-development/component, cloud/storage/network, workstation/server/writer, utilities/travel/freight, carrier/packaging/key, waste and direct cooling exchanges. Resolve concrete applicable rows before data package publication; no generic basket or unsupported proxy is authorized.
    - No universal empirical per-entitlement energy, developer burden, useful life, reuse share, cloud intensity, leakage/yield or quantitative range is adopted. Foreground original/resource/cohort records and supplier scope are required, including zero-price/open-source component upstream burden.
    - Original beneficiary allocation and cumulative entitlement cutoff need product-specific review and finite sensitivity. Different license metrics/rights configurations are not automatically equivalent. Digital-only downloads and hosted services require their own product classification.
    - Conditional in-house/bought optical, magnetic and USB carrier routes, actual package BOM, key configuration and cooling system applicability need foreground proof; external classification and license/security sources establish no default carrier composition or production quantity.
