product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.radio-television-and-communication-equipment-and-apparatus.other-application-software-packaged"
  classification_refs: "CPC3:47829"
  covered_products: "Published residual business/vertical/utility application release entitlements supplied as packaged products with declared carrier configuration"
  excluded_products: "General productivity/home applications; games; systems/tools; custom development; IP originals; download-only files; online software; SaaS/hosting"
  representative_product: "One fixed-SKU, declared-release professional business application entitlement, carrier and optional hardware key as specified"
  production_route: "Create/buy/reuse attributed original; build/integrate/test; sign/archive; license administration; bought recorded carrier or in-house writing; package acceptance"
  market_state: "Accepted publisher delivery bundle of immutable release files, documented rights and actual carrier configuration; not operated customer service"
functional_unit:
  what: "Supply the declared published application capabilities and authorized use rights at publisher delivery gate"
  how_much: "One accepted entitlement bundle for a fixed SKU and rights configuration; disclose authorized installation/device/user/concurrent-user count or other contractual metric"
  how_well: "Release hash/version, supported platform, application function and release acceptance tests; different rights or function configurations are separate references"
  how_long_or_cycle: "One declared production/delivery cohort and cutoff; record license term or perpetual right. Runtime service duration is outside the production unit"
  reference_flow_link: "delivered_entitlement"
system_boundary:
  rules:
    - rule_id: boundary_production
      applies_to: "all production processes"
      rule: "Include stock R&D and purchased/reused original shares, tooling, build/test retries, signing, production archives and entitlement/packaging through publisher gate. Screen attributable workplace utilities and business travel; significant additional actual flows must be instantiated individually with collection/provider evidence."
      source_ids:
        - nist-ssdf-2022
        - gsf-sci-1-1-0
    - rule_id: boundary_classification
      applies_to: "packaged output"
      rule: "Reject treating downloadable files, on-line software, custom development or hosting as CPC 47829 output solely because they share code. Preserve common-original allocation across benefiting products."
      source_ids:
        - un-cpc3-notes-2025
    - rule_id: boundary_use
      applies_to: "downstream use and support"
      rule: "Keep customer runtime, support and updates after delivery separate. A production cohort is not a runtime workload; no guessed lifetime-use electricity can enter this manufacturing result."
      source_ids:
        - un-cpc3-notes-2025
        - gsf-sci-1-1-0
    - rule_id: boundary_upstream_once
      applies_to: "make/buy alternatives"
      rule: "A complete purchased cloud, code-development or recorded-carrier inventory replaces its embedded electricity, hardware or blank carrier burdens. Add only demonstrably absent layers. Self-operated direct utilities are distinct; no supplier generation emissions in direct foreground air rows."
      source_ids:
        - gsf-sci-1-1-0
    - rule_id: boundary_conditional
      applies_to: "carrier and direct facility routes"
      rule: "Apply only actual SKU carrier/BOM and controlled cooling routes. A no-carrier/digital-only delivery is outside the CPC 47829 output here; do not create a zero-mass packaged reference. Conditional absence needs evidence; unknown is not not-applicable or zero."
      source_ids:
        - un-cpc3-notes-2025
        - ibm-ipla-2011
boundary_abstraction:
  declared_starting_condition: "Identified original/reused components and production resources; historical original creation burdens remain attributed, not assumed free"
  starting_condition_role: "Collection and recursion boundary; an approved source tree is not a burden-free start"
  product_classification_scope: "CPC 47829 packaged residual application product; excluded downloads/services can be beneficiaries of shared original inputs"
  recursive_input_rule: "Use an explicit upstream inventory for purchased code, contracted work, carriers or services. In-house expansion replaces corresponding purchased row; never expand the same original or complete carrier twice"
  upstream_dataset_requirement: "Matching provider region/year, energy interface, compute/storage/network unit and capital/utility scope; supplier missing layers remain unknown and must be completed before usable dataset publication"
  disclosure: "Original burden ledger and reuse allocation; actual count cutoff; make/buy matrix; route applicability; library/component gaps; uncertainty; no customer lifetime in production result"
