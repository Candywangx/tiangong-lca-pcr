allocation_rules:
  - rule_id: allocation_original
    applies_to: "shared original and reusable code"
    rule: "Keep original creation resource amounts in one ledger. First separate independent tasks/products; allocate inseparable shared code using documented causal engineering/resource shares with sum one across all beneficiaries, including excluded download products. Free/open-source code is not environmentally free; missing upstream development contribution is a gap. Do not allocate by package mass or line count alone."
    source_ids:
      - nist-ssdf-2022
  - rule_id: allocation_cohort
    applies_to: "fixed stock development/build pools"
    rule: "After beneficiary partition, divide fixed target-release resource pools by actual cumulative accepted equivalent entitlements at a fixed cutoff, with identical documented rights configuration; split non-equivalent SKUs. Publish cutoff/earliest development period and deliveries including returns. A version update reuses only its assigned common core and adds incremental work. Revised cumulative profiles replace prior profiles, never add both into one model. New/low-sales releases must disclose the large undiluted burden. Forecast finite sales/horizon can be sensitivity only, with stated scenario and subsequent actual reconciliation; no unlimited amortization."
    source_ids:
      - ibm-ipla-2011
  - rule_id: allocation_variable
    applies_to: "delivery/media variable burdens"
    rule: "Divide actual cohort delivery/assembly quantities by accepted same-SKU entitlements N, including production failures and pre-acceptance replacements in numerator. Carrier duplication/backups are not additional entitlement output. Separately disclose fixed original and variable route contributions."
    source_ids:
      - ibm-ipla-2011
  - rule_id: allocation_compute
    applies_to: "self-operated equipment and shared computing"
    rule: "Assign hardware inventory by reserved time divided by installed life times reserved resource fraction; do not convert hardware emissions to an elementary exchange. Allocate electricity from metering and measured job/resource share, including idle and cooling once. Complete purchased services retain their provider allocation rather than an additional self-operated share. Sensitivity must vary life/resource/idle shares within documented alternatives without inventing defaults."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_waste
    applies_to: "production rejects and recovered material"
    rule: "Record waste to actual treatment provider without avoided-burden credit. Internal reuse/stock return cancels paired input/output transfers rather than counting a new software product or external recovery credit. No software mass balance is required; physical carrier/component balances are independent."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_entitlement
      process_id: "delivery"
      flow_role: "release entitlement output"
      record_type: "sales and acceptance ledger"
      raw_fields: "SKU; release hash; rights metric; installations; users; concurrency; term; accepted deliveries; returns; carrier count"
      collection_method: "Reconcile invoices, PoE/contract, shipped packages and release acceptance; derive net accepted N from gross recorded declared bundle deliveries minus same-cohort returns/unaccepted bundles exactly once; duplicate installers/backups add no deliveries. Freeze positive N by cutoff, split different rights configurations."
      unit: "item"
      frequency: "each delivery and cohort close"
      temporal_coverage: "declared historical development and cumulative delivery cutoff"
      site_scope: "publisher and selected release/SKU"
      aggregation_rule: "per reference flow"
      quality_evidence: "PoE, hashes and closed ledger"
    - protocol_id: cp_power
      process_id: "development_release_delivery_carrier"
      flow_role: "purchased electricity"
      record_type: "meter and workload records"
      raw_fields: "meter start/end; kWh; interval; voltage; grid; project/task; active/idle allocation; facility overhead; N"
      collection_method: "Use calibrated submeters/traceable utility bills plus job logs; sum interval differences, assign project/workload shares, reconcile to site total. Measure failed jobs and allocated idle capacity. Record included cooling; multiply IT energy by measured period PUE only when utility total is absent."
      unit: "kWh"
      frequency: "each interval/job/batch"
      temporal_coverage: "complete development/release/cohort period with cutoff"
      site_scope: "named self-operated office/computing/writing sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; provider/grid/year and workload reconciliation"
    - protocol_id: cp_hardware
      process_id: "development_release_carrier"
      flow_role: "allocated capital equipment"
      record_type: "asset and reservation ledger"
      raw_fields: "asset/model; number; installed life hours; reserved hours; resource fraction; upstream scope; N"
      collection_method: "Identify each complete workstation/server/writer and supplier production inventory. Derive life from asset records; collect reserved time and resource capacity separately; assign share number times reserved hours/life hours times resource fraction. Disclose idle share and prevent overlapping reservations exceeding total."
      unit: "item"
      frequency: "asset event and each job interval"
      temporal_coverage: "actual installed life and production intervals"
      site_scope: "self-operated production equipment only"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; supplier boundary; time/resource logs"
    - protocol_id: cp_contract
      process_id: "development"
      flow_role: "outsourced coding"
      record_type: "contract and accepted time sheets"
      raw_fields: "provider; task; accepted h; original/release; rework; included utilities/hardware; N"
      collection_method: "Reconcile contracted task acceptance with supplier engineering hours and environmental activity inventory; allocate only delivered original share, keeping supplier electricity/hardware within its inventory. Missing provider inventory is unknown, not zero."
      unit: "h"
      frequency: "each accepted task"
      temporal_coverage: "entire contracted development contribution"
      site_scope: "named code development provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "contract; acceptance; supplier activity inventory"
    - protocol_id: cp_component
      process_id: "development"
      flow_role: "reusable original contribution"
      record_type: "SBOM and rights/original burden ledger"
      raw_fields: "component ID/version; acquired rights units; upstream development pool; released products; observable causal share; actual entitlement cohorts; N"
      collection_method: "Read component identity, rights and supplier development inventory. Partition shared originals across benefiting products by traceable engineering contribution/resource use with shares summing to one; spread target share over actual cumulative accepted entitlements through cutoff, including download cohorts as separate beneficiaries. Record missing/free component upstream data."
      unit: "item"
      frequency: "each release/SBOM revision and cutoff"
      temporal_coverage: "original creation through declared cumulative cutoff"
      site_scope: "all benefiting products of the reusable original"
      aggregation_rule: "per reference flow"
      quality_evidence: "SBOM; rights; causal ledger; denominator sensitivity"
    - protocol_id: cp_cloud
      process_id: "release_delivery"
      flow_role: "purchased compute"
      record_type: "provider billing and task telemetry"
      raw_fields: "provider/region; vCPU count; reserved h; task; memory provision; reattempts; scope included; N"
      collection_method: "Sum vCPU count times reserved hours by task and period, reconcile bill and reservation logs; keep configured memory and hardware/provider interface. Require primary supplier intensity on the same service basis and check electricity/cooling/hardware coverage."
      unit: "vCPU-h"
      frequency: "each job and billing period"
      temporal_coverage: "all production jobs through cutoff"
      site_scope: "named cloud provider/region; production accounts"
      aggregation_rule: "per reference flow"
      quality_evidence: "bill-task crosscheck; supplier allocation/coverage"
    - protocol_id: cp_storage
      process_id: "release"
      flow_role: "archive storage"
      record_type: "object occupancy records"
      raw_fields: "object/release; decimal bytes; replica count; daily occupancy; retention cutoff; supplier; N"
      collection_method: "Integrate each object size divided by 10^9 over actual stored days; count provider-reported replica scope once. Reconcile occupancy with billing; obtain supplier GB-day inventory."
      unit: "GB-day"
      frequency: "daily or event-based integration"
      temporal_coverage: "creation to fixed archival cutoff"
      site_scope: "selected source/build/release archives"
      aggregation_rule: "per reference flow"
      quality_evidence: "object logs; retention policy; billing"
    - protocol_id: cp_network
      process_id: "release"
      flow_role: "data transfer"
      record_type: "network/provider logs"
      raw_fields: "task; direction; actual bytes; provider; transfer date; region; N"
      collection_method: "Sum logged bytes divided by 10^9 for each actual transfer; reconcile billed direction. Attach one matching service inventory per provider; do not count transfers internal to a complete cloud service twice."
      unit: "GB"
      frequency: "each transfer and billing period"
      temporal_coverage: "production period through release gate"
      site_scope: "production network interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer logs and supplier basis"
    - protocol_id: cp_heat
      process_id: "development"
      flow_role: "workplace heat"
      record_type: "heat meter and occupancy"
      raw_fields: "MJ received; area; project occupied hours; total occupancy; provider; period; N"
      collection_method: "Read district delivered heat meter; allocate by measured project occupied area-hours divided by total heated area-hours for the same period, reconcile all allocated heat."
      unit: "MJ"
      frequency: "each heating billing period"
      temporal_coverage: "development project heating intervals"
      site_scope: "heated workplace served by provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "heat bill; floor plan; occupancy"
    - protocol_id: cp_travel
      process_id: "development"
      flow_role: "production business travel"
      record_type: "itinerary and project ledger"
      raw_fields: "rail/flight segment; passenger count; distance; class; trip purpose; project fraction; N"
      collection_method: "Reconcile tickets/itineraries and project approvals; sum each segment distance times passenger count times causal project share for rail and air separately. Record absence only with travel ledger evidence."
      unit: "passenger-km"
      frequency: "each trip"
      temporal_coverage: "historical production project period"
      site_scope: "release-attributable business travel"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets; project approval; route/provider"
    - protocol_id: cp_cooling
      process_id: "release"
      flow_role: "direct cooling water and refrigerant"
      record_type: "meters and refrigerant servicing"
      raw_fields: "makeup m3; blowdown m3; evaporation; charge start/end kg; additions; recoveries; stock; circuit species; transfers; service losses; direct leak evidence; uncertainty; workload share; N"
      collection_method: "Meter makeup and blowdown separately and reconcile evaporation/stocks. For the same R-134a species reconcile opening/closing circuit charge, additions, all recovery destinations, stocks, paired transfers and documented non-air service losses. Assess the residual against weighing/charge uncertainty and direct leak evidence; unresolved missing paths or negative residuals require review, not presumed air leakage or zero clipping. Retain recovery certificates, not a default rate. Assign direct utility amounts by measured workload share; other refrigerants require separate species rows."
      unit: "m3; kg"
      frequency: "each interval and service event"
      temporal_coverage: "same release workload interval"
      site_scope: "directly controlled computer-site cooling only"
      aggregation_rule: "per reference flow"
      quality_evidence: "water balance; species charge/recovery reconciliation"
    - protocol_id: cp_carrier
      process_id: "carrier"
      flow_role: "recorded/blank carrier and license key"
      record_type: "lot receipts/issues and writing logs"
      raw_fields: "carrier type/spec; recorded/blank route; units in/out; stock; rejected units; hash; dongle model; N"
      collection_method: "Reconcile opening stock plus receipts minus closing stock for each carrier/dongle, then match issue to accepted packages and rejects. For in-house writing verify release hash and retries; bought recorded route excludes duplicated recording power. Measure a traceable sample net mass per carrier for waste/freight, never for software reference."
      unit: "item; kg"
      frequency: "each received/written/assembled lot"
      temporal_coverage: "all lots in delivery cohort"
      site_scope: "publisher writing/assembly or contracted recorded-carrier interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "lot ledger; hashes; route scope; calibrated weighing"
    - protocol_id: cp_packaging
      process_id: "carrier"
      flow_role: "finished packaging component"
      record_type: "SKU BOM and component issue records"
      raw_fields: "component material/grade; tare-free kg; issues; accepted packages; stock; rejects; supplier scope; N"
      collection_method: "Weigh each named finished carton/booklet/case/film separately on calibrated scales; reconcile component stock and issues to BOM and actual accepted package count. Purchased finished components include printing/forming once; no separate embedded polymer/paper inputs."
      unit: "kg"
      frequency: "each SKU lot"
      temporal_coverage: "delivery cohort assembly period"
      site_scope: "actual package BOM at publisher"
      aggregation_rule: "per reference flow"
      quality_evidence: "BOM; weighing; supplier finished-component scope"
    - protocol_id: cp_waste
      process_id: "carrier"
      flow_role: "specific pre-gate waste"
      record_type: "weighing and handler transfer"
      raw_fields: "stream; kg net; rejected lot; handler; treatment; stock; N"
      collection_method: "Weigh each stream separately without tare and reconcile rejected units times measured carrier mass or component scrap to transfer tickets. Track stored waste separately; match actual handler route and composition to treatment inventory."
      unit: "kg"
      frequency: "each rejected lot and transfer"
      temporal_coverage: "same assembly/delivery cohort"
      site_scope: "pre-gate production rejects only"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale tickets; waste ledger; handler contract"
    - protocol_id: cp_freight
      process_id: "delivery"
      flow_role: "incoming physical freight"
      record_type: "consignment documents"
      raw_fields: "gross shipment kg; road km; load share; lot; carrier; origin/destination; N"
      collection_method: "Read actual gross shipment mass and each road leg distance; calculate kg/1000 times km with documented consignment load share. Match carrier/truck/load conditions, count packaging shipping mass but do not normalize software by that mass."
      unit: "t-km"
      frequency: "each consignment"
      temporal_coverage: "incoming carrier/package delivery lots"
      site_scope: "supplier to publisher gate road legs"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbill; actual itinerary; carrier scope"
  calculation_rules:
    - id: entitlement_denominator
      applies_to: "delivered_entitlement"
      rule: "N = gross recorded bundle deliveries of the same rights/SKU through declared cutoff minus same-cohort returned/unaccepted bundles exactly once; net accepted ledger values require no further subtraction. Output = 1 item; copies and backup files do not increment N."
      inputs:
        - cp_entitlement
      output: "N; reference output"
      source_ids:
        - ibm-ipla-2011
    - id: fixed_pool_attribution
      applies_to: "dev_power; dev_workstation; dev_contract; dev_component; dev_heat; dev_rail; dev_air; release_power; release_server; release_cloud; release_storage; release_network; release_water; release_refrigerant; release_wastewater; release_leak"
      rule: "For each fixed original/release resource j: normalized amount = sum of original resource quantities times target beneficiary shares divided by its actual cumulative equivalent-entitlement denominator. Keep resource units; shares sum to one across recipients and include incremental/reused core separately."
      inputs:
        - cp_entitlement
        - cp_component
        - "applicable resource protocol"
      output: "resource amount per reference flow"
      source_ids: []
    - id: variable_cohort
      applies_to: "delivery_power; delivery_cloud; delivery_freight; carrier_bought_optical; carrier_bought_usb; carrier_bought_magnetic; carrier_blank_optical; carrier_blank_usb; carrier_blank_magnetic; carrier_write_power; carrier_writer; package_box; package_booklet; package_case; package_seal; license_dongle; waste_optical; waste_usb; waste_magnetic; waste_board; waste_paper; waste_case; waste_film"
      rule: "For each variable route exchange: normalized amount = assigned actual cohort quantity / accepted same-SKU entitlement N. Failed writes, rejects and replacements stay in numerator; inactive routes are evidenced not-applicable."
      inputs:
        - cp_entitlement
        - "applicable route protocol"
      output: "exchange amount per reference flow"
      source_ids: []
    - id: hardware_fraction
      applies_to: "dev_workstation; release_server; carrier_writer"
      rule: "Allocated equipment quantity = identified equipment number times reserved production hours / documented life hours times reserved resource fraction. Normalize resulting original or cohort pool using the appropriate fixed/variable denominator; all fractions must be finite and within actual capacity."
      inputs:
        - cp_hardware
        - cp_entitlement
      output: "allocated item share"
      source_ids:
        - gsf-sci-1-1-0
    - id: meter_energy
      applies_to: "dev_power; release_power; delivery_power; carrier_write_power"
      rule: "Assigned kWh = sum of calibrated interval meter differences times causal workload share, plus assigned facility overhead only if not included. IT-only metered energy times measured same-period PUE replaces, never adds to, total facility energy. If provider unit is MJ multiply kWh by 3.6; apply fixed or variable cohort denominator afterwards."
      inputs:
        - cp_power
        - cp_entitlement
      output: "electricity quantity"
      source_ids:
        - gsf-sci-1-1-0
    - id: cloud_service
      applies_to: "release_cloud; delivery_cloud"
      rule: "vCPU-h = sum of reserved vCPU count times interval hours assigned to production jobs. Billing/telemetry and provider coverage must match; energy is supplied by a matching service inventory, not inferred from hours."
      inputs:
        - cp_cloud
        - cp_entitlement
      output: "service vCPU-h"
      source_ids:
        - gsf-sci-1-1-0
    - id: archive_storage
      applies_to: "release_storage"
      rule: "GB-day = sum of object bytes / 10^9 times stored days through cutoff, including declared replica scope once; then original allocation and count normalization."
      inputs:
        - cp_storage
        - cp_entitlement
      output: "storage GB-day"
      source_ids:
        - nist-ssdf-2022
    - id: network_transfer
      applies_to: "release_network"
      rule: "GB = sum of actual direction-specific transferred bytes / 10^9; then apply original share and entitlement count. No universal kWh/GB or kgCO2e/GB factor."
      inputs:
        - cp_network
        - cp_entitlement
      output: "transfer GB"
      source_ids:
        - gsf-sci-1-1-0
    - id: cooling_balance
      applies_to: "release_water; release_refrigerant; release_wastewater; release_leak"
      rule: "Water makeup plus opening storage = blowdown plus evaporation plus closing storage. R-134a candidate residual kg = opening circuit charge plus external additions plus net circuit transfers minus closing charge minus all recoveries minus documented non-air service losses, reconciled with species-specific storage movements. Assign to air only when complete paths, direct leak evidence and measurement uncertainty substantiate that compartment; otherwise keep unresolved. Never clip a negative residual or turn missing recovery into air release. Apply supported measured totals to workload shares and original denominator; no default water or leakage factor."
      inputs:
        - cp_cooling
        - cp_entitlement
      output: "separate m3 and species kg"
      source_ids: []
    - id: carrier_balance
      applies_to: "carrier_bought_optical; carrier_bought_usb; carrier_bought_magnetic; carrier_blank_optical; carrier_blank_usb; carrier_blank_magnetic; license_dongle"
      rule: "Opening stock plus receipts = accepted issued carrier/key units plus rejected units plus closing stock. A shipped multi-disc/backup set may have several carriers but one entitlement; record SKU cardinality and paired internal written-carrier transfers without external double counting."
      inputs:
        - cp_carrier
        - cp_entitlement
      output: "separate physical item quantities"
      source_ids: []
    - id: physical_mass_balance
      applies_to: "package_box; package_booklet; package_case; package_seal; waste_optical; waste_usb; waste_magnetic; waste_board; waste_paper; waste_case; waste_film"
      rule: "For each actual carrier or component, opening net material stock plus receipts = mass in accepted packages plus measured production waste plus closing stock; compare same tare-free moisture/material basis. Mixed/unknown composition needs resolution, not an assumed recycling output."
      inputs:
        - cp_carrier
        - cp_packaging
        - cp_waste
        - cp_entitlement
      output: "physical mass reconciliation"
      source_ids: []
    - id: freight_activity
      applies_to: "delivery_freight"
      rule: "t-km = sum of actual gross consignment kg / 1000 times road segment km times supported load allocation; then divide by accepted cohort N. This shipping denominator never replaces entitlement reference."
      inputs:
        - cp_freight
        - cp_entitlement
      output: "incoming freight t-km"
      source_ids: []
    - id: heat_travel_activity
      applies_to: "dev_heat; dev_rail; dev_air"
      rule: "Heat = delivered MJ times project occupied-area-hour fraction; rail/air passenger-km = sum of ticket segment km times passengers times project share for each separate mode. Then apply fixed original attribution and denominator."
      inputs:
        - cp_heat
        - cp_travel
        - cp_entitlement
      output: "separate MJ and passenger-km"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference and all inputs"
      requirement: "Resolve a compatible count-based reference flow and every applicable supplier/flow/property/unit before dataset publication; a correct name with mass or toxicity reference property is not compatible."
      evidence: "contracts, direct identity records and property-unit linkage"
    - id: completeness
      applies_to: "original and production pools"
      requirement: "Cover historical original creation and reused/free components plus repeated jobs and idle capacity; quantify missing coverage and obtain actual records before claiming completeness. Do not supply invented ranges or universal factors."
      evidence: "SBOM; resource ledger; job coverage"
    - id: cohort
      applies_to: "denominators and allocations"
      requirement: "Retain positive actual N and fixed cutoff; cumulative original and interval-variable profiles disclose separate periods. Test observed alternate beneficiary split and finite forecast/count scenarios separately."
      evidence: "closed entitlement ledger; original allocation; sensitivity"
    - id: route
      applies_to: "conditional facilities/media"
      requirement: "Document actual make/buy route and carrier specifications; not-applicable requires BOM/contract/asset evidence, zero requires measurement and unknown stays unknown. Other important actual exchanges need separate concrete rows and protocols."
      evidence: "BOM; provider scope; asset lists; records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "delivered output"
    rule: "Require 1 item of the exact release/SKU/rights reference and a positive reconciled N; reject kg/software, copied carriers counted as new licenses, mixed rights configurations and unbounded future-sales denominators."
    source_ids:
      - ibm-ipla-2011
  - rule_id: validate_original
    applies_to: "development/build reuse"
    rule: "Check original ledger conservation across beneficiaries, shared core versus incremental release scope, and fixed/variable denominator periods; no original omitted because source tree exists or supplier price is zero. Require disclosed attribution/denominator sensitivity."
    source_ids:
      - nist-ssdf-2022
  - rule_id: validate_production_coverage
    applies_to: "all actual routes"
    rule: "Verify successful/failed/repeated jobs, metered utilities, capital shares, purchased code/compute/storage/network and carrier/packaging scope are represented once with applicable collection records. Missing UUIDs, provider layers or primary quantities are unresolved, never modeled as zero."
    source_ids:
      - nist-ssdf-2022
      - gsf-sci-1-1-0
  - rule_id: validate_physical
    applies_to: "media, packaging, waste, cooling"
    rule: "Check independent carrier-unit and material-mass balances, freight units, water/refrigerant stocks, every recovery/transfer/non-air service loss and measurement uncertainty supporting direct species/compartment; unmatched or negative residuals remain unresolved, never clipped or automatically emitted to air; reject guessed yield/leak factors and elementary emissions copied from upstream suppliers."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "downstream/customer service"
    rule: "Reject download-only/service output under this packaged mapping. Customer lifetime electricity, support and end-of-life require separately named datasets and scenarios; no production-only comparative lifecycle claim."
    source_ids:
      - un-cpc3-notes-2025
      - gsf-sci-1-1-0
published_dataset_profile:
  dataset_role: "Foreground production inventory for one accepted packaged application release entitlement"
  downstream_use: "secondary_dataset; background_dataset only when scope/coverage is complete and upstream references match"
  allowed_use: "Production-gate modelling of matching release/SKU/rights and carrier route; downstream use models may consume this production inventory once"
  excluded_use: "Lifecycle superiority claims from production alone; kg/software proxy; download-only or hosted-service reference; other function/rights configurations without documented equivalence"
  required_metadata: "Release hash/SKU, rights/platform, N and cutoff, original pool period, beneficiary allocation, provider interfaces, make/buy route and carrier BOM"
  required_quality_disclosure: "Unknown UUID/provider/quantity gaps, original/free-code coverage, measured/modelled split, denominator/asset-life sensitivity, separate variable route contributions and production-only boundary"
  update_trigger: "Release/rights/SKU change, new observed entitlement cutoff, original reuse repartition, material provider or carrier route change, resolved gaps"
data_sources:
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, pp. 262–263, 417–419, 441–442. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Category boundary and counterexamples: packaged application, originals, commissioned development, downloads, online execution and hosting. No LCA quantities."
  - id: "nist-ssdf-2022"
    type: "official_guidance"
    reference: "NIST SP 800-218, SSDF v1.1, February 2022, PS.2/PS.3 and PW.6/PW.7/PW.8. https://doi.org/10.6028/NIST.SP.800-218"
    used_for: "Build/test, release integrity, component provenance and archive records; security-process guidance, not numerical LCA factors."
  - id: "ibm-ipla-2011"
    type: "official_guidance"
    reference: "IBM International Program License Agreement, Z125-3301-14 (2011), Part 1 definitions and license grant, p.1. https://www.ibm.com/docs/en/STVRB7_3.4.0/Z125-3301-14.pdf"
    used_for: "Program/authorized-use/PoE distinction, copies and media; one provider licensing example only, not a universal seat/license conversion or current product contract."
  - id: "gsf-sci-1-1-0"
    type: "standard"
    reference: "Green Software Foundation, Software Carbon Intensity Specification v1.1.0, Embodied emissions, Software boundary, Functional unit. https://sci.greensoftware.foundation/"
    used_for: "Time/resource allocation, infrastructure coverage and measured/modelled disclosure adapted to production workloads; operational SCI scope is counterevidence to claiming production-only equivalence. No numeric examples adopted."
