measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One item equals one declared entitlement bundle. The supported Item(s) unit factor is 1; item is its display alias. Dozens convert by 12 only for the identical entitlement configuration. Carrier copies, backup installers, devices, seats and CPU licensing points do not convert to entitlements without documented contractual cardinality. Collect N with cp_entitlement."
  - id: no_software_mass
    applies_to: "reference product and physical carriers"
    required_property_ref:
      name: "Count and independent physical quantities"
      uuid: ""
    required_unit: "item; kg"
    rule: "No kg/license conversion exists. Weigh physical carrier, packaging and freight only for their own exchanges; do not substitute their gross or net mass for software function."
  - id: cohort_consistency
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Same release entitlement basis"
      uuid: ""
    required_unit: "item"
    rule: "Use one accepted fixed configuration reference. Fixed original/build pools and variable carrier/delivery amounts may have different raw periods but must retain attributable share and the stated closed cohort denominator. No infinite future-sales dilution."
  - id: energy_and_services
    applies_to: "purchased energy and service records"
    required_property_ref:
      name: "Recorded service dimension"
      uuid: ""
    required_unit: "kWh; MJ; vCPU-h; GB-day; GB"
    rule: "Keep electricity kWh and heat MJ; 1 kWh = 3.6 MJ if the upstream provider requires MJ. GB is 10^9 bytes, not GiB; GB-day integrates days. vCPU-hours are service quantities, not kWh; no generic service-to-energy factor."
