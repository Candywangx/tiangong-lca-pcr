    rule: "First subdivide measured release-specific work. Allocate genuinely shared work to the marketed release using documented staff time, computing use or another causal physical driver; if unavailable use disclosed organizational or economic allocation and test material sensitivity. Divide the release total by accepted physical package mass for the reporting period."
