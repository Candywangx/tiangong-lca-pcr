system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground collection boundary begins with purchased materials, parts, and subassemblies received at the manufacturing site and ends with conforming finished telephone products packaged as declared and released for dispatch. Supplier production and inbound transport remain visible upstream product inputs. Manufacturing-site electricity, fuels, water, consumables, direct releases, rejects, rework, packaging, and shared support burdens are included when they serve the declared production."
      source_ids: []
    - rule_id: include_applicable_parts_and_assembly
      applies_to: "product composition and production stage"
      rule: "Define the applicable part types and their amounts from the actual BOM. Include or link applicable part production and include PCBA or module assembly, final assembly, warehousing, and packaging; an outsourced step requires an upstream dataset rather than omission."
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - rule_id: foreground_control_boundary
      applies_to: "manufacturer-controlled processes"
      rule: "Collect primary activity data for operations under the reporting manufacturer's operational control and link purchased inputs to supplier-specific or technically representative upstream datasets."
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - rule_id: cutoff_significance
      applies_to: "all processes and flows in scope"
      rule: "Avoid cut-off. A process or flow may be excluded only after mass, energy, and environmental significance have all been assessed, cumulative exclusions have been checked, and the exclusion and sensitivity are documented."
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - rule_id: software_and_configuration_boundary
      applies_to: "software-related production activities"
      rule: "Include plant-side firmware or operating-system loading, configuration, and testing. Include software-development support burdens only when the declared study scope does so explicitly and report their allocation separately."
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - rule_id: manufacturing_only_profile
      applies_to: "published foreground data package"
      rule: "Keep network operation, product use, repair, refurbishment, and end-of-life outside this manufacturing profile. Any extension shall be a separately documented module and shall not change the CPC 47222 finished-product identity."
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
        - eu-regulation-2023-1670-consolidated
boundary_abstraction:
  declared_starting_condition: "Purchased materials, parts, and subassemblies received at the manufacturing site with supplier, lot, quantity, mass, and acceptance status identified"
  starting_condition_role: "Foreground collection boundary for manufacturer-controlled receiving, assembly, configuration, testing, packaging, warehousing, and dispatch; upstream production remains linked through supplier or representative datasets"
  product_classification_scope: "Complete finished telephones within CPC 3.0:47222; not components, fixed cordless line phones, wired apparatus, or network equipment"
  recursive_input_rule: "A complete CPC 47222 telephone received as an input remains a separately quantified product input with its upstream dataset and declared purpose; it shall not be decomposed into invented raw-material quantities or silently merged with the reference output"
  upstream_dataset_requirement: "Use supplier-specific or technically representative upstream datasets for applicable battery cells and packs, PCBAs, integrated circuits, displays, electromechanical parts, enclosures, cables and connectors, cameras and audio modules, other BOM items, packaging materials, and inbound transport; disclose substitutions and missing supplier coverage"
  disclosure: "Declare product mix, device count, net mass, installed battery and integral-part treatment, packaging and accessory treatment, owned and outsourced steps, site, geography, period, yield, rework, allocation, cut-offs, upstream dataset choices, and any boundary extension"
