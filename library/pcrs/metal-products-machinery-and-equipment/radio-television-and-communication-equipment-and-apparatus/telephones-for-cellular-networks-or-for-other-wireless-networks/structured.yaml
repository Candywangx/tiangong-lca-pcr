allocation_rules:
  - rule_id: subdivide_before_allocation
    applies_to: "separable production lines, work orders, and process steps"
    rule: "Use direct measurement and process subdivision before allocation. Preserve model-family or homogeneous-product work orders when materially different products share a site."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: physical_allocation_priority
    applies_to: "shared production and facility data"
    rule: "Allocate shared burdens using the most relevant physical driver: measured line time or equipment energy where available, PCB area for board production, good die area for integrated circuits, and mass for other components or outputs. Apply one consistent method to all environmental loads from the common process."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: economic_allocation_fallback
    applies_to: "shared processes lacking defensible physical data"
    rule: "Use economic allocation only when relevant physical data are insufficient; disclose the affected process, products, price basis, period, calculation, and sensitivity."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: rework_and_scrap_accounting
    applies_to: "rework, rejects, and recovered materials"
    rule: "Keep rework burdens with the production that caused them and count a reworked unit only after final acceptance. Report recyclable scrap as a waste output with destination; do not apply an avoided-burden credit inside this foreground package unless a separately declared downstream method requires it."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: packaging_and_accessory_separation
    applies_to: "sales packaging and bundled accessories"
    rule: "Assign attributable packaging and accessory burdens to the declared production mix but report their masses and flows separately from the 1 kg net telephone reference product."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
      - eu-regulation-2023-1670-consolidated
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_purchased_parts
      process_id: "parts_and_subassemblies_supply"
      flow_role: "purchased BOM items and accepted component kits"
      record_type: "BOM, purchase order, supplier declaration, goods receipt, inspection, stock ledger"
      raw_fields: "product family; model; part id; part category; supplier; lot; quantity; unit; verified unit mass; accepted quantity; rejected quantity; stock change; upstream dataset id"
      collection_method: "Reconcile engineering BOM to purchasing, receiving, quality, and inventory records; resolve each selected upstream flow identity"
      unit: "kg and piece; battery energy or display/PCB area retained when relevant"
      frequency: "Per lot and production order; aggregate for the reporting period"
      temporal_coverage: "Full declared representative production period"
      site_scope: "Every manufacturing site and outsourced supplier step represented by the dataset"
      aggregation_rule: "Sum accepted inputs plus stock change by product family; normalize to net conforming output mass"
      quality_evidence: "Approved BOM revision, supplier record, receiving record, scale calibration, reconciliation log"
    - protocol_id: cp_process_energy_utilities
      process_id: "pcba_module_assembly_final_assembly_configuration_test_packaging_warehousing_dispatch"
      flow_role: "electricity, fuel, heat, compressed air, and metered utilities"
      record_type: "Submeter, equipment meter, utility invoice, runtime and rated-load record"
      raw_fields: "meter id; start and end; unit; timestamp; line; equipment; work order; product family; allocation driver; downtime"
      collection_method: "Prefer dedicated submeters; otherwise allocate shared totals by a documented physical driver"
      unit: "kWh, MJ, m3, or native metered unit"
      frequency: "Continuous, shift, batch, or invoice period"
      temporal_coverage: "Same period as production output, including normal operating variation"
      site_scope: "All controlled lines and shared utilities serving them"
      aggregation_rule: "Subtract documented non-production loads, allocate shared use physically, then normalize to conforming output"
      quality_evidence: "Meter calibration, invoice reconciliation, runtime record, allocation worksheet"
    - protocol_id: cp_material_waste_records
      process_id: "all_process_ids"
      flow_role: "consumables, rejects, scrap, and wastes"
      record_type: "Material issue and return, batch recipe, stock ledger, scale ticket, waste manifest"
      raw_fields: "flow identity; supplier; lot; issued amount; returned amount; reject amount; waste amount; unit; destination; hazardous status; work order"
      collection_method: "Reconcile purchased, issued, returned, recovered, stock-change, and manifested quantities"
      unit: "Flow-appropriate unit, normally kg"
      frequency: "Per batch, lot, and waste shipment"
      temporal_coverage: "Same period as production output"
      site_scope: "All controlled processes and waste destinations"
      aggregation_rule: "Net consumed equals issued minus returned and recovered stock; wastes aggregated by flow and destination"
      quality_evidence: "Calibrated scale, inventory reconciliation, waste manifest, treatment receipt"
    - protocol_id: cp_output_yield_rework
      process_id: "pcba_module_assembly_final_assembly_configuration_test"
      flow_role: "conforming output, yield, test failure, rework, and final scrap"
      record_type: "Production order, test system, repair log, quality release, scale record"
      raw_fields: "product family; model; work order; input count; good count; failed count; reworked count; scrapped count; verified net unit mass; output mass"
      collection_method: "Reconcile automated test and production records to quality release and calibrated mass measurements"
      unit: "kg and piece"
      frequency: "Per work order and shift"
      temporal_coverage: "Full declared representative production period"
      site_scope: "Every final and module assembly line represented"
      aggregation_rule: "Count reworked units once at final disposition; calculate net good mass by homogeneous product family"
      quality_evidence: "Test-system audit trail, quality release, scale calibration, yield reconciliation"
    - protocol_id: cp_packaging_accessories
      process_id: "packaging_warehousing_dispatch"
      flow_role: "sales packaging, bundled accessories, and dispatch-released net product"
      record_type: "Packaging BOM, accessory BOM, pack-out instruction, material issue, packed-unit and dispatch record"
      raw_fields: "sales configuration; packaging item; accessory item; quantity; unit mass; included/excluded reference mass; device count; net device mass; packed mass"
      collection_method: "Reconcile packaging and accessory issues to packed and dispatched units; weigh representative configurations"
      unit: "kg and piece"
      frequency: "Per sales configuration and production order"
      temporal_coverage: "Same period as reference output"
      site_scope: "Every packaging site and sales configuration in scope"
      aggregation_rule: "Sum packaging and accessory mass separately; normalize each to net device kg"
      quality_evidence: "Approved pack-out specification, scale calibration, issue and dispatch reconciliation"
    - protocol_id: cp_direct_releases
      process_id: "all_process_ids"
      flow_role: "water use and direct elementary releases"
      record_type: "Water meter, emissions monitor, laboratory result, permit report"
      raw_fields: "flow identity; compartment; amount; unit; timestamp; source point; process; treatment; detection limit; allocation driver"
      collection_method: "Use calibrated meters or validated monitoring methods; create one inventory row per actual elementary flow"
      unit: "Flow-appropriate unit"
      frequency: "Monitoring or permit frequency"
      temporal_coverage: "Same period as production output"
      site_scope: "Every controlled emission point and water source serving the included production"
      aggregation_rule: "Aggregate by flow and compartment, allocate physically, normalize to conforming output"
      quality_evidence: "Calibration, laboratory QA/QC, permit report, mass-balance cross-check"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "every inventory amount"
      rule: "normalized amount = attributable reporting-period amount / net kg of conforming finished telephone output"
      inputs:
        - "Attributable flow amount"
        - "net conforming output mass from cp_output_yield_rework"
      output: "Flow amount per 1 kg net finished telephone"
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - id: calculate_net_output_mass
      applies_to: "count-based output records"
      rule: "net output mass = sum over homogeneous product families of accepted device count × verified net unit mass; do not include packaging or separately bundled accessories"
      inputs:
        - "Accepted count"
        - "verified net unit mass"
        - "model or family share"
      output: "Net kg conforming finished telephone output and device count per kg"
      source_ids:
        - eu-regulation-2023-1670-consolidated
    - id: reconcile_component_mass
      applies_to: "BOM parts, intermediate outputs, rejects, and stock"
      rule: "Reconcile accepted input mass with conforming output, documented stock change, returned material, rework inventory, and waste; investigate rather than force-close unexplained differences"
      inputs:
        - "BOM and receiving mass"
        - "issue and return"
        - "output mass"
        - "stock change"
        - "reject and waste mass"
      output: "Mass-balance reconciliation and unexplained difference"
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - id: allocate_shared_facility_data
      applies_to: "shared energy, utilities, and facility burdens"
      rule: "Subdivide first; otherwise allocate by relevant physical driver. Use economic allocation only when physical data are insufficient and perform a sensitivity check."
      inputs:
        - "Shared total"
        - "product-system driver values"
        - "output identities"
        - "price data only for fallback"
      output: "Attributable shared amount by product system"
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
    - id: separate_packaging_and_accessories
      applies_to: "packed sales configurations"
      rule: "Report device net mass, packaging mass, and bundled-accessory mass separately; normalize packaging and accessory amounts by net device kg without adding them to reference mass"
      inputs:
        - "Packaging BOM"
        - "accessory BOM"
        - "net device mass"
        - "packed count"
      output: "Separate kg packaging/kg device and kg accessory/kg device"
      source_ids:
        - etsi-es-203-199-v1-4-1-2025
        - eu-regulation-2023-1670-consolidated
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and product mix"
      requirement: "Demonstrate complete-telephone CPC 47222 identity and the exact Tiangong reference flow; retain model-family composition without using a named model as the generic proxy."
      evidence: "Product specifications, approved product list, model-mix and sales-configuration records, reference-flow UUID check"
    - id: dq_bom_completeness
      applies_to: "applicable parts and upstream links"
      requirement: "Account for all actual BOM lines and applicable part categories; record masses or relevant physical parameters and document missing supplier datasets and substitutions."
      evidence: "Approved BOM, supplier declarations, receiving reconciliation, upstream dataset register"
    - id: dq_primary_data
      applies_to: "controlled foreground processes"
      requirement: "Use measured or recorded primary activity data for controlled assembly, configuration, testing, packaging, utilities, yield, rework, and waste."
      evidence: "Meters, production and test systems, invoices, issue records, waste manifests, calibration records"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use one consistent declared period that covers normal production, product-mix changes, downtime, rework, and packaging activity; justify exclusions or shorter campaigns."
      evidence: "Reporting-period register, production calendar, downtime and changeover records"
    - id: dq_technology_and_geography
      applies_to: "foreground and upstream datasets"
      requirement: "Match manufacturing technology, supplier route, plant geography, electricity market, product generation, and reporting period as closely as practicable; disclose proxy datasets."
      evidence: "Dataset metadata, supplier and site records, representativeness assessment"
    - id: dq_cutoff_and_completeness
      applies_to: "system boundary"
      requirement: "Assess mass, energy, and environmental significance before excluding any flow, evaluate cumulative exclusions, and retain a cut-off and sensitivity log."
      evidence: "BOM and energy coverage checks, emissions screening, cut-off register, sensitivity results"
    - id: dq_allocation_consistency
      applies_to: "shared processes and facilities"
      requirement: "Apply the same documented allocation method to all environmental loads from a common process and reconcile allocated totals to the unallocated source total."
      evidence: "Allocation worksheet, driver records, total reconciliation, sensitivity check"
    - id: dq_uncertainty_and_traceability
      applies_to: "published dataset"
      requirement: "Describe completeness, uncertainty, acquisition method, supplier independence, geography, technology, age, methodological consistency, and all unresolved data gaps."
      evidence: "Data-quality assessment and source-to-inventory audit trail"
validation_rules:
  - rule_id: validate_exact_reference_identity
    applies_to: "reference flow"
    rule: "The reference product flow shall be 1fdb2343-534a-4818-814d-5dc99b291ac1, a complete CPC 47222 Product flow with Mass property 93a60a56-a3c8-11da-a746-0800200b9a66; reject component, named-model, fixed-telephone, wired-apparatus, or network-equipment proxies."
    source_ids:
      - unsd-cpc-3-0
      - eu-regulation-2023-1670-consolidated
  - rule_id: validate_reference_normalization
    applies_to: "reference amount"
    rule: "The dataset shall normalize to exactly 1 kg net conforming finished telephone output after final testing and shall disclose device count per kg and product-mix weighting."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: validate_required_qualifiers
    applies_to: "dataset identity"
    rule: "Every required qualifier in section 3 shall be present and internally consistent across product description, process records, and flow comments."
    source_ids:
      - iec-63366-2025
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: validate_bom_and_part_coverage
    applies_to: "purchased inputs"
    rule: "The actual BOM and applicable battery, electronic, display, electromechanical, enclosure, cable, camera, audio, and remaining part categories shall be quantified or explicitly declared absent; upstream datasets and substitutions shall be listed."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
      - eu-regulation-2023-1670-consolidated
  - rule_id: validate_process_coverage
    applies_to: "production stage"
    rule: "Parts production links, PCBA or module assembly, final assembly, configuration and test, packaging, warehousing, and dispatch shall be represented; outsourcing changes data source, not inclusion."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: validate_foreground_records
    applies_to: "controlled production quantities"
    rule: "Required energy, material, utility, yield, rework, reject, packaging, waste, and direct-release quantities shall come from declared foreground records or calculations linked to collection protocols; no generic named-model quantity may substitute for them."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: validate_mass_and_yield_reconciliation
    applies_to: "each production period"
    rule: "Purchased and issued mass, internal transfers, net good output, stock change, returns, rework, and waste shall reconcile; unexplained differences shall be reported and investigated."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: validate_allocation_and_cutoff
    applies_to: "shared burdens and exclusions"
    rule: "Allocation shall follow section 7, allocated totals shall reconcile, and every cut-off shall pass mass, energy, environmental, cumulative, and sensitivity checks."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
  - rule_id: validate_packaging_accessory_separation
    applies_to: "reference mass and inventory"
    rule: "Sales packaging and separately bundled accessories shall be inventoried and disclosed separately and shall not be counted in the 1 kg net telephone reference mass."
    source_ids:
      - etsi-es-203-199-v1-4-1-2025
      - eu-regulation-2023-1670-consolidated
  - rule_id: validate_inventory_flow_identity
    applies_to: "concrete foreground package"
    rule: "Each concrete product, waste, and elementary flow shall have a semantically exact Tiangong identity and flow-appropriate property and unit before publication; unresolved role descriptions in this candidate PCR are not permission to invent UUIDs."
    source_ids:
      - iec-63366-2025
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for complete new wireless-network telephones; after review it may be published as a secondary_dataset and/or background_dataset"
  downstream_use: "Supply-chain and cradle-to-gate modelling of complete telephone manufacture; upstream production module for a separately specified full life-cycle process or lifecyclemodel"
  allowed_use: "Use for the declared product mix, sites, period, manufacturing route, net-mass basis, packaging configuration, allocation method, and data-quality level; adaptation requires explicit representativeness review"
  excluded_use: "Direct proxy for a named device model, telephone component, fixed cordless or wired telephone, network equipment, tablet or wearable; use-stage or network-operation dataset; complete cradle-to-grave result; comparative public claim without equivalent function, boundary, data quality, allocation, and cut-off assumptions"
  required_metadata: "Canonical PCR id; CPC coordinate; exact reference-flow, property, and unit-group UUIDs; product families and mass-weighted mix; network technologies; site and geography; period; device count and net mass; battery and integral-part treatment; packaging, accessory, and charger treatment; owned and outsourced steps; BOM and upstream datasets; yield and rework; allocation and cut-off methods"
  required_quality_disclosure: "Foreground measurement coverage; BOM and supplier-data coverage; representativeness by time, geography, and technology; meter and scale quality; allocation and mass-balance reconciliation; upstream substitutions; cut-offs; uncertainty; direct-release screening; unresolved data and numeric-range gaps"
  update_trigger: "Material change in product scope, component architecture, battery or display technology, model mix, manufacturing or outsourcing route, site or electricity supply, packaging or accessories, allocation driver, supplier datasets, reference-flow identity, governing standard, or data-quality evidence"
