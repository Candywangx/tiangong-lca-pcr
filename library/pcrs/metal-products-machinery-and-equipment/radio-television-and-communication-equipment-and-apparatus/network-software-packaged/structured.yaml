measurement_rules:
  - id: packaged_product_mass
    applies_to: "Reference product and every physical carrier or packaging component"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure gross sale-package mass at the dispatch gate. Include the recorded carrier, case, printed insert, paper box, and every other component physically included in the sale unit; exclude pallet, shipping container, and tertiary transport packaging unless sold as part of that unit."
  - id: electricity_conversion
    applies_to: "Electricity used by development, build, testing, scanning, carrier loading, and package assembly"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Collect electricity in kWh from meters or provider records, include attributable data-centre overhead, then convert by MJ = kWh × 3.6. Retain the original kWh record and allocation key. The energy-measurement boundary follows gsf-sci-1-1-0."
  - id: package_component_mass_balance
    applies_to: "Finished package and its installed physical components"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "On the same batch and moisture convention, compare finished gross mass with the sum of all installed carrier and package-component masses. Investigate and disclose any residual rather than hiding it in an unspecified packaging row."
