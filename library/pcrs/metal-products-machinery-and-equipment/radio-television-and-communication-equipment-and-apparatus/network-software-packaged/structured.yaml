allocation_rules:
  - rule_id: allocation_avoid_by_measurement
    applies_to: "Release-attributable foreground activities"
    rule: "Prefer job-, project-, repository-, test-run-, meter-, and package-batch-specific records so that burdens are directly assigned and allocation is avoided."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_shared_digital_infrastructure
    applies_to: "Shared development, build, test, storage, monitoring, and scanning infrastructure"
    rule: "Allocate measured electricity by a documented resource-time key that represents the release's reserved compute, storage, memory, or equivalent capacity. The numerator and denominator shall cover the same time, infrastructure, and activity boundary."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_hardware_embodied_burden
    applies_to: "Shared information-technology hardware"
    rule: "When hardware embodied burdens are included, allocate M = TE × (TiR/EL) × (RR/ToR), using documented hardware life, time reserved, resources reserved, and total resources. Do not use market-based offsets to reduce the allocated burden."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_joint_release_and_package
    applies_to: "Joint builds, editions, language variants, or package batches"
    rule: "Subdivide development and packaging activities where records permit. If inseparable, allocate digital activity by measured resource-time and physical packaging activity by measured package-batch mass or units; disclose why each key represents causality and run a sensitivity check for any material alternative."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_development_release_electricity
      process_id: "packaged_network_software_production"
      flow_role: "Development, build, test, scanning, storage, monitoring, and mastering electricity"
      record_type: "Meter, provider, scheduler, and telemetry records"
      raw_fields: "release_id; job_id; infrastructure_id; geography; start_time; end_time; metered_kWh; provider_kWh; reserved_compute; reserved_memory; reserved_storage; allocation_numerator; allocation_denominator; PUE_or_overhead_method"
      collection_method: "Prefer real-world meter or provider data at the finest available component and time resolution; reconcile telemetry with billed or metered totals and document modelled gaps"
      unit: "kWh"
      frequency: "Per job or measurement interval, aggregated per release"
      temporal_coverage: "Full declared release cycle; annual data are the lowest temporal granularity when finer records are unavailable"
      site_scope: "All owned, colocated, cloud, and contracted infrastructure significantly contributing to the release"
      aggregation_rule: "Allocate energy using the documented same-boundary resource-time ratio, sum by release, include facility overhead, and convert to MJ"
      quality_evidence: "Meter identifiers; provider exports; job logs; telemetry retention; allocation workbook; geography and factor provenance; completeness reconciliation"
    - protocol_id: cp_carrier_packaging_electricity
      process_id: "packaged_network_software_production"
      flow_role: "Carrier loading and package assembly electricity"
      record_type: "Meter, machine, batch, and invoice records"
      raw_fields: "batch_id; facility; meter_id; start_time; end_time; meter_start; meter_end; purchased_kWh; packages_produced; gross_batch_mass_kg; rejects; allocation_key"
      collection_method: "Read dedicated meters where available; otherwise reconcile equipment or facility records to the declared package batch"
      unit: "kWh"
      frequency: "Per production batch or meter interval"
      temporal_coverage: "All carrier-loading and package-assembly runs contributing to the reference-period output"
      site_scope: "Every facility loading carriers or assembling the sale package"
      aggregation_rule: "Subtract documented non-production loads, allocate shared energy by measured batch mass or units, sum kWh, normalize to output kg, and convert to MJ"
      quality_evidence: "Meter calibration; invoices; machine logs; batch records; reconciliation to facility totals"
    - protocol_id: cp_physical_package_components
      process_id: "packaged_network_software_production"
      flow_role: "Recorded carrier and each installed package component"
      record_type: "Supplier specification, purchase, batch issue, count, and weighing records"
      raw_fields: "component_row_id; supplier; part_number; batch_id; material; finished_article_state; unit_mass_kg; count_installed; total_mass_kg; recycled_content; printing_or_coating; rejects; carrier_type"
      collection_method: "Weigh representative finished components or use verified supplier mass, then reconcile issued, installed, and rejected quantities by named atomic component"
      unit: "kg"
      frequency: "Per supplier lot and package batch"
      temporal_coverage: "All component lots installed in reference-period output"
      site_scope: "All declared carrier and packaging suppliers and assembly sites"
      aggregation_rule: "Sum installed mass by row_id and batch, exclude rejects from installed input, normalize to 1 kg finished package"
      quality_evidence: "Calibrated-scale record; supplier specification; purchase record; lot trace; component photograph or bill of materials; reconciliation"
    - protocol_id: cp_finished_package_mass
      process_id: "packaged_network_software_production"
      flow_role: "Finished packaged network software"
      record_type: "Batch production, count, and gross-mass records"
      raw_fields: "release_id; edition; version; batch_id; package_configuration; sample_count; sample_gross_mass_kg; total_packages; total_gross_mass_kg; dispatch_gate; weighing_date"
      collection_method: "Weigh the complete sale package with all included components using a calibrated scale and reconcile sample and batch totals"
      unit: "kg"
      frequency: "Per package configuration and batch"
      temporal_coverage: "Every batch in the reference period"
      site_scope: "Every publisher or contract-packaging dispatch site"
      aggregation_rule: "Sum batch gross mass, reconcile with installed components, and normalize all inventory rows to exactly 1 kg output"
      quality_evidence: "Calibration record; batch release record; package bill of materials; sample plan; signed mass-balance reconciliation"
  calculation_rules:
    - id: calc_electricity_mj
      applies_to: "Both electricity rows"
      rule: "electricity_MJ = allocated_kWh × 3.6"
      inputs:
        - "Allocated kWh from the applicable electricity protocol"
      output: "MJ electricity per 1 kg output"
      source_ids:
        - gsf-sci-1-1-0
    - id: calc_shared_energy_allocation
      applies_to: "Shared digital or packaging infrastructure"
      rule: "allocated_kWh = boundary-consistent total_kWh × allocation_numerator / allocation_denominator; both shares shall use the same time interval, infrastructure and activity scope"
      inputs:
        - "Metered or provider kWh"
        - "resource-time or batch allocation numerator and denominator"
      output: "Release- or batch-attributable kWh"
      source_ids:
        - gsf-sci-1-1-0
    - id: calc_hardware_embodied_share
      applies_to: "Hardware background contribution when included"
      rule: "M = TE × (TiR/EL) × (RR/ToR); retain each input, unit, hardware identity and assumption"
      inputs:
        - "Total hardware life-cycle emissions"
        - "time reserved"
        - "expected life"
        - "resources reserved"
        - "total resources"
      output: "Allocated hardware embodied burden for the declared release boundary"
      source_ids:
        - gsf-sci-1-1-0
    - id: calc_package_mass_balance
      applies_to: "Physical package composition"
      rule: "residual_kg = finished_gross_mass_kg - sum(installed_component_mass_kg); identify missing atomic components or measurement differences before acceptance"
      inputs:
        - "Finished gross mass and all installed carrier/package component masses for the same batch"
      output: "Disclosed package mass-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain edition, version, publisher, release date, network function, platform, carrier, package configuration, licence/support term, CPC reference, dispatch gate, and exact TianGong flow UUID."
      evidence: "Release record; product specification; package bill of materials; CPC inclusion note; TianGong state-100 identity"
    - id: dq_temporal_coverage
      applies_to: "All foreground records"
      requirement: "Cover the complete declared release and all physical-package batches in the reference period. Prefer component-level and time-resolved records; if unavailable, disclose modelled gaps and use no coarser than annual digital-infrastructure data."
      evidence: "Job and telemetry coverage report; meters; provider exports; batch ledger; gap log; gsf-sci-1-1-0"
    - id: dq_geography_and_technology
      applies_to: "Electricity, hardware, carrier, and packaging inputs"
      requirement: "Identify every contributing facility, cloud region, grid region, hardware class, carrier technology, packaging supplier, and package-assembly technology; select upstream datasets accordingly."
      evidence: "Provider and supplier records; facility list; infrastructure inventory; dataset-selection log"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile metered or billed electricity, jobs, package batches, component issues, installed masses, rejects, and finished gross mass. Add missing actual exchanges as separately named atomic rows."
      evidence: "Energy reconciliation; bill of materials; mass balance; waste records; completeness checklist"
    - id: dq_uncertainty_and_models
      applies_to: "Modelled data and allocations"
      requirement: "Disclose measurement gaps, models, allocation keys, temporal and geographic proxies, hardware-life assumptions, excluded infrastructure, and sensitivity results. Never present a modelled estimate as a measured record."
      evidence: "Model file; assumption register; allocation workbook; sensitivity results"
validation_rules:
  - rule_id: validate_identity_and_qualifiers
    applies_to: "Reference flow"
    rule: "Confirm that the product is published packaged network systems software matching CPC 47812, that the reference and output UUIDs are identical, and that every required qualifier is present."
    source_ids:
      - un-cpc-3-0-47812
  - rule_id: validate_scope_exclusions
    applies_to: "System boundary"
    rule: "Confirm that download, hosted-access, deployment, operation, maintenance, and end-of-life modules are not silently mixed into the core packaged-product dataset, and that any separately included module uses a disclosed consistent functional unit."
    source_ids:
      - un-cpc-3-0-84341
      - gsf-sci-1-1-0
  - rule_id: validate_electricity_coverage
    applies_to: "Electricity rows"
    rule: "Reconcile development/release and carrier/packaging electricity to meters or provider totals, confirm supporting infrastructure and data-centre overhead coverage, verify allocation boundaries, and recalculate kWh-to-MJ conversion."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: validate_atomic_package_rows
    applies_to: "Physical carrier and package components"
    rule: "Confirm that each present component is one named finished article, that absent conditional components are documented, that unresolved UUIDs remain blank, and that no unspecified packaging or carrier umbrella flow is used."
    source_ids: []
  - rule_id: validate_package_mass_balance
    applies_to: "Finished package"
    rule: "Recalculate output normalization and the component mass-balance residual using the same batch and weighing convention; investigate and disclose any residual before acceptance."
    source_ids: []
  - rule_id: validate_allocation_reproducibility
    applies_to: "Shared infrastructure and joint production"
    rule: "Reperform each allocation from retained numerator, denominator, period, infrastructure scope, and package-batch records; confirm that time/resource shares are used for hardware embodied burden."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: validate_bilingual_uuid_identity
    applies_to: "English and Chinese renderings"
    rule: "Confirm identical row ids and UUIDs and the exact TianGong Chinese baseName for every UUID-bearing selected flow."
    source_ids: []
published_dataset_profile:
  dataset_role: "Release- and package-specific foreground product dataset for published packaged network software"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-publisher-dispatch-gate modelling of the declared physical packaged network-software product; downstream studies may attach separately modelled distribution, deployment, operation, maintenance, or end-of-life modules"
  excluded_use: "Generic representation of software downloads, hosted access, software-as-a-service, custom software development, operating systems, database software, application software, or an undisclosed mixture of physical and electronic delivery routes"
  required_metadata: "PCR id; CPC reference; software edition and version; network function; supported platforms; publisher; release and reference dates; licence/support term; physical carrier; package bill of materials; development/build and packaging geographies; dispatch gate; allocation keys; upstream dataset identifiers; unresolved UUIDs; data gaps"
  required_quality_disclosure: "Meter and provider coverage; telemetry granularity; modelled gaps; annual-data fallback if used; data-centre overhead; hardware time/resource allocation; component supplier and mass evidence; mass-balance residual; temporal, geographic, and technological representativeness; sensitivity results"
  update_trigger: "Reassess the dataset when the software architecture, release pipeline, security or test scope, carrier, package configuration, publisher or supplier geography, contributing infrastructure, allocation method, reference period, or material data gap changes"
data_sources:
  - id: "un-cpc-3-0-47812"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 classification detail, code 47812, “Network software, packaged”, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/47812 (retrieved 2026-09-11)"
    used_for: "Product identity, hierarchy, covered network-software functions, and exclusions by contrast with adjacent product classes"
  - id: "un-cpc-3-0-84341"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 classification detail, code 84341, “System software downloads”, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/84341 (retrieved 2026-09-11)"
    used_for: "Distinguishing electronic system-software download files from the packaged-product boundary"
  - id: "gsf-sci-1-1-0"
    type: "standard"
