        explanation: "Obtain two independent, boundary-compatible sources for metallic reflective-layer input per kg conforming recorded disc output."
      - row_id: acrylic_varnish
        explanation: "Obtain two independent, boundary-compatible sources for protective acrylic varnish input per kg conforming recorded disc output."
      - row_id: printing_ink
        explanation: "Obtain two independent, boundary-compatible sources for printing ink input per kg conforming recorded disc output and reconcile printing technology."
      - row_id: electricity
        explanation: "Obtain two independent, boundary-compatible plant datasets for purchased electricity per kg conforming recorded disc output, with geography and voltage disclosed."
      - row_id: process_water
        explanation: "Obtain two independent, boundary-compatible plant datasets for process-water input per kg conforming recorded disc output, with water source and treatment boundary disclosed."
      - row_id: polycarbonate_manufacturing_scrap
        explanation: "Obtain two independent, boundary-compatible sources for polycarbonate scrap generation per kg conforming recorded disc output, distinguishing internal regrind from exported waste."
    methodology_needs:
      - need_id: non_optical_media_routes
        explanation: "The verified detailed inventory pattern is limited to replicated optical discs. Magnetic tape, diskette, microfilm, microfiche, and other text-media routes require separately verified atomic process inventories before this candidate can be reviewed for route-generic use."
