allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared lines and auxiliary systems"
    rule: "Subdivide or meter the text-media lot directly wherever feasible. For a shared meter that cannot be subdivided, allocate by a documented causal driver such as machine operating time or measured throughput; mass allocation may be used only when the causal relationship is demonstrated."
    source_ids: []
  - rule_id: allocation_internal_regrind
    applies_to: "Polycarbonate regrind returned within the same process boundary"
    rule: "Treat internal regrind as an internal loop: do not report it as an exported waste or a second product. Record losses and additional energy once in the processes where they occur."
    source_ids: []
  - rule_id: allocation_exported_scrap
    applies_to: "Polycarbonate scrap crossing the foreground boundary"
    rule: "Report exported scrap as a waste flow. Do not credit avoided virgin material inside this foreground process unless a separately declared downstream recycling model applies a consistent substitution method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issues
      process_id: "optical_disc_replication"
      flow_role: "Polycarbonate, aluminium target, varnish, and ink inputs"
      record_type: "Inventory issue and return records"
      raw_fields: "material identity; lot id; opening stock; issued amount; returned amount; closing stock; target change or reclaim record"
      collection_method: "Reconcile warehouse issues, line-side stock, returns, and supplier specifications"
      unit: "kg"
      frequency: "Each production lot; monthly reconciliation"
      temporal_coverage: "Same period as reported output"
      site_scope: "All included lines at the reporting site"
      aggregation_rule: "Net consumption = opening stock + receipts - closing stock - documented returns; assign shared target consumption by measured lot throughput or operating time"
      quality_evidence: "Calibrated scales, stock reconciliation, supplier specification, and exception log"
    - protocol_id: cp_electricity_meter
      process_id: "optical_disc_replication"
      flow_role: "Purchased electricity input"
      record_type: "Meter and operating log"
      raw_fields: "meter id; opening and closing readings; source unit; included equipment; operating hours; excluded load"
      collection_method: "Read dedicated meters; otherwise reconcile submeter and equipment logs to the site invoice"
      unit: "kWh or MJ"
      frequency: "Per lot or shift; monthly invoice reconciliation"
      temporal_coverage: "At least one representative production period"
      site_scope: "All included production and auxiliary equipment"
      aggregation_rule: "Subtract excluded metered loads, allocate residual shared load by documented operating time, convert kWh to MJ, and divide by conforming output mass"
      quality_evidence: "Meter calibration, invoice reconciliation, coverage map, and allocation worksheet"
    - protocol_id: cp_process_water_meter
      process_id: "optical_disc_replication"
      flow_role: "Process-water input"
      record_type: "Meter, invoice, and conversion record"
      raw_fields: "meter id; volume or mass; temperature; density source; included operation; discharge linkage"
      collection_method: "Read dedicated water meter or reconcile included share to invoice; retain conversion inputs"
      unit: "kg or m3"
      frequency: "Per lot or monthly, matching output period"
      temporal_coverage: "Same period as reported output"
      site_scope: "Included manufacturing and equipment-support operations"
      aggregation_rule: "Convert measured volume to mass with documented density and divide included water mass by conforming output mass"
      quality_evidence: "Meter calibration, invoice reconciliation, density record, and boundary map"
    - protocol_id: cp_conforming_output
      process_id: "optical_disc_replication"
      flow_role: "Conforming reference product output"
      record_type: "Production and inspection record"
      raw_fields: "lot id; carrier format; gross produced mass; rejected mass; conforming mass; content-master check; readability result; label result"
      collection_method: "Weigh accepted output and reconcile to inspection and reject logs"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Same period as all input and waste records"
      site_scope: "All included lines at the reporting site"
      aggregation_rule: "Sum conforming output only and normalize the inventory to exactly 1 kg"
      quality_evidence: "Scale calibration, inspection record, reject log, and lot reconciliation"
    - protocol_id: cp_scrap_mass
      process_id: "optical_disc_replication"
      flow_role: "Polycarbonate scrap output"
      record_type: "Waste and internal-loop record"
      raw_fields: "lot id; scrap polymer identity; gross scrap mass; internal regrind mass; exported scrap mass; destination"
      collection_method: "Segregate and weigh polycarbonate scrap; reconcile internal regrind and off-site dispatch"
      unit: "kg"
      frequency: "Each lot or waste dispatch; monthly reconciliation"
      temporal_coverage: "Same period as reported output"
      site_scope: "All included moulding and inspection points"
      aggregation_rule: "Report only scrap crossing the process boundary; reconcile exported scrap plus internal regrind to total measured scrap"
      quality_evidence: "Scale calibration, polymer segregation record, regrind log, and waste transfer record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = included exchange amount / conforming product mass"
      inputs:
        - "Exchange record"
        - "conforming output mass from cp_conforming_output"
      output: "Exchange per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity"
      rule: "Electricity (MJ) = electricity (kWh) × 3.6"
      inputs:
        - "Metered kWh"
      output: "MJ of purchased electricity"
      source_ids: []
    - id: calc_material_net_use
      applies_to: "Material input rows"
      rule: "Net material use = opening stock + receipts - closing stock - documented returns"
      inputs:
        - "Stock and issue records"
      output: "kg material consumed by the lot"
      source_ids: []
    - id: calc_scrap_boundary
      applies_to: "polycarbonate_manufacturing_scrap"
      rule: "Exported scrap = total segregated polycarbonate scrap - verified internal regrind returned within the same process boundary"
      inputs:
        - "Scrap scale record"
        - "regrind log"
      output: "kg waste crossing the process boundary"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and material rows"
      requirement: "Retain carrier format, content type, material grade or formulation, supplier state, and the exact UUID decision where available; do not merge non-optical carrier routes with the optical-disc inventory."
      evidence: "Product specification, supplier specification, content-master record, and UUID audit"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Inputs, outputs, and wastes shall cover the same production period and capture start-up, changeover, rejects, and shutdown effects when they occur."
      evidence: "Dated meter, stock, production, inspection, and waste records"
    - id: dq_completeness
      applies_to: "Optical-disc replication"
      requirement: "Reconcile material issues, conforming output, rejects, internal regrind, exported scrap, electricity, and water for all included lines; disclose any unmetered or excluded operation."
      evidence: "Lot mass balance, utility reconciliation, and boundary checklist"
    - id: dq_representativeness
      applies_to: "Published dataset"
      requirement: "Declare site geography, technology, carrier format, capacity, recording method, label system, supplier state, recycled content, and reference period."
      evidence: "Dataset metadata and primary records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the output is non-audio text material on a physical carrier, not audio, video, blank media, packaged software, online-only content, or a reproduction service; require all reference-flow qualifiers."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_inventory_balance
    applies_to: "Process inventory"
    rule: "Require exactly eight declared representative-route rows, with each selected flow atomic; flag any missing UUID only when it is absent from the manifest unresolved register, and confirm total rows equal UUID-matched plus unresolved rows."
    source_ids: []
  - rule_id: validate_mass_normalization
    applies_to: "Foreground calculations"
    rule: "Confirm measured conforming output is positive, every amount covers the same period, and every reported exchange is normalized to exactly 1 kg reference product."
    source_ids: []
  - rule_id: validate_route_applicability
    applies_to: "Carrier technology"
    rule: "Reject use of the optical-disc inventory pattern as a proxy for tape, diskette, microfilm, microfiche, or another carrier technology lacking a separately verified atomic inventory."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_packaging_boundary
    applies_to: "Sale packaging"
    rule: "Confirm sale packaging is excluded from the reference product and inventory; if an extended study includes it, require each packaging component to be a separate atomic flow outside this default eight-row pattern."
    source_ids:
      - us-epa-life-cycle-cd-dvd
published_dataset_profile:
  dataset_role: "Foreground production dataset for the representative mass-replicated optical-disc route"
  downstream_use: "Secondary dataset and background dataset for products consuming recorded text-based optical media"
  allowed_use: "Factory-gate modelling of recorded, labelled, unpackaged text-based optical discs when the declared carrier, process, geography, period, and material states are representative"
  excluded_use: "Magnetic tape, diskette, microfilm, microfiche, other non-optical carriers, blank media, packaged software, online content, distribution, use, end-of-life, or packaged-product claims without separate route-specific modelling"
  required_metadata: "Canonical PCR id; carrier technology and format; content type; recording and label technology; capacity; product mass; site geography; reference period; supplier and recycled-content states; packaging boundary; allocation drivers; unresolved UUIDs; proxies"
  required_quality_disclosure: "Meter and stock coverage; output and reject reconciliation; internal regrind treatment; utility allocation; data gaps; proxy datasets; uncertainty; excluded operations; inspection criteria"
  update_trigger: "Change in carrier technology, substrate, reflective layer, coating or ink system, content-replication process, site or grid, packaging boundary, allocation method, or evidence that materially changes the inventory"
