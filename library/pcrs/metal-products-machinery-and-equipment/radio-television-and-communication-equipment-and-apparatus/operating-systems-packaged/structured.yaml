allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_release_replication_packaging"
    rule: "Subdivide processes and use product-, batch- or line-specific meters and bills of materials before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_causal_shared_energy
    applies_to: "electricity"
    rule: "When direct metering is unavailable, allocate shared electricity by documented causal drivers such as measured equipment run time multiplied by rated or metered load; do not allocate unrelated office, hosted-service or development electricity to the packaged release."
    source_ids: []
  - rule_id: allocation_shared_materials
    applies_to: "carrier_and_packaging_inputs"
    rule: "Allocate shared carrier and packaging receipts by accepted mass incorporated into each saleable product. Record rejects separately and do not hide them in a net material factor."
    source_ids: []
  - rule_id: allocation_disclosure
    applies_to: "all_allocated_exchanges"
    rule: "Report the allocated fraction, driver, period, products sharing the process and a sensitivity check for every material allocated exchange."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_electricity
      process_id: "publication_packaging"
      flow_role: "electricity"
      record_type: "Meter intervals and reconciled invoices"
      raw_fields: "site; meter; timestamp; opening and closing readings or interval kWh; production line; equipment run time and load if allocated; saleable output mass; allocation fraction"
      collection_method: "Read dedicated meters where available; otherwise reconcile invoices to the declared causal allocation"
      unit: "kWh and kg output"
      frequency: "Each production lot or monthly, whichever is more detailed"
      temporal_coverage: "Same representative production period as output, normally at least 12 months or all lots for a shorter release campaign"
      site_scope: "Every publisher, replicator and packaging site inside the foreground boundary"
      aggregation_rule: "Sum attributable kWh, convert to MJ and divide by saleable kg; keep each site's grid geography distinct"
      quality_evidence: "Meter calibration or invoice; reconciliation; allocation worksheet; production log; anomaly review"
    - protocol_id: cp_component_mass
      process_id: "publication_packaging"
      flow_role: "accepted physical carrier or paper box"
      record_type: "Purchase receipt, bill of materials, lot count and scale record"
      raw_fields: "supplier; site; lot; component identity; material; carrier capacity; accepted count; sampled or total dry mass; rejected mass; saleable output mass"
      collection_method: "Weigh the accepted component lot or verify supplier mass with representative calibrated samples and lot counts"
      unit: "kg"
      frequency: "Each incoming and production lot"
      temporal_coverage: "Same lots as the packaged output"
      site_scope: "Every carrier-replication and packaging site in scope"
      aggregation_rule: "Sum accepted mass separately by exact component and divide by saleable kg; keep optical-disc and USB routes separate"
      quality_evidence: "Supplier specification; calibrated scale record; bill of materials; acceptance and reject log"
    - protocol_id: cp_output_mass
      process_id: "publication_packaging"
      flow_role: "packaged operating-system output"
      record_type: "Finished-goods and scale records"
      raw_fields: "release; edition; architecture; licence; carrier type; package bill of materials; accepted units; dry net mass; production date; site"
      collection_method: "Weigh finished accepted packages without secondary shipping packaging and reconcile to inventory"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Entire representative release campaign or reporting year"
      site_scope: "All foreground sites releasing saleable packages"
      aggregation_rule: "Sum accepted dry net mass; normalize all exchanges to 1 kg"
      quality_evidence: "Calibrated scale; release acceptance record; package bill of materials; mass-balance reconciliation"
  calculation_rules:
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "attributable electricity intensity = metered or allocated kWh × 3.6 / saleable output kg"
      inputs:
        - "attributable kWh"
        - "saleable packaged-output kg"
        - "allocation fraction"
      output: "MJ per kg reference output"
      source_ids: []
    - id: calc_component_intensity
      applies_to: "recorded_optical_disc; operating_system_usb_drive; paper_box"
      rule: "component intensity = accepted dry component mass / saleable packaged-output mass"
      inputs:
        - "accepted component kg by exact identity and route"
        - "saleable packaged-output kg"
      output: "kg component per kg reference output"
      source_ids: []
    - id: calc_package_mass_balance
      applies_to: "publication_packaging"
      rule: "Compare finished net output mass with the sum of accepted carrier, box and every other included component; document the cause and measurement uncertainty of any difference"
      inputs:
        - "finished net output kg"
        - "accepted component kg"
      output: "mass-balance reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Verify that the output is a published operating system within the functional boundary and not a download, online service, custom development, application or other systems-software category."
      evidence: "Release manifest, product specification, CPC boundary review and sales configuration"
    - id: dq_route_completeness
      applies_to: "process inventory"
      requirement: "Declare the exact carrier and packaging configuration and add every material and waste crossing the foreground boundary as an atomic row; do not substitute an umbrella packaging or waste label."
      evidence: "Bill of materials, process walk-through, purchase and waste records"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Electricity, component and output records shall cover the same release campaign or reporting period; disclose shorter campaigns and excluded lots."
      evidence: "Timestamped meter, invoice, lot and output records"
    - id: dq_mass_balance
      applies_to: "physical components and output"
      requirement: "Reconcile accepted component mass, finished output mass and measured rejects for each route; investigate unexplained differences."
      evidence: "calc_package_mass_balance worksheet and scale records"
    - id: dq_uuid_status
      applies_to: "unresolved carrier rows"
      requirement: "Keep unresolved Tiangong UUIDs empty and do not promote a classification, product-state, property or unit proxy. Re-run receipt-backed discovery before methodology review or publication."
      evidence: "Finalized UUID-search receipts and direct-read decisions"
    - id: dq_review_scope
      applies_to: "completed data package"
      requirement: "Report goal and scope, inventory methods, limitations, allocations, checks and reviewer identity appropriate to the intended downstream use."
      evidence: "Study report and review record consistent with ISO 14044 scope"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Require exactly 1 kg of Operating systems, packaged 6539b574-fb79-4d47-9618-06c83a56cdbf and all required qualifiers."
    source_ids:
      - un-cpc-3-0-47811-detail
  - rule_id: validate_boundary
    applies_to: "product scope and process map"
    rule: "Fail if the reference product is a downloadable electronic file, online software, custom development result, application software, or if the model claims publisher-gate scope while omitting an in-scope release, replication or packaging activity."
    source_ids:
      - un-cpc-3-0-47811-detail
      - un-cpc-3-0-84341-detail
  - rule_id: validate_units
    applies_to: "inventory amounts"
    rule: "Require reference and component masses in kg and electricity in MJ; verify every kWh-to-MJ conversion uses 3.6 and is normalized to saleable kg."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "all exchanges"
    rule: "Fail any combined carrier, packaging-material, utility, waste or emission selector. Require each actual physical component, waste and direct elementary release to have its own row, direction, type, property, unit and route condition."
    source_ids: []
  - rule_id: validate_conditional_carriers
    applies_to: "recorded_optical_disc; operating_system_usb_drive"
    rule: "Require at least one declared physical carrier for each packaged configuration. A conditional carrier marked not applicable shall be supported by the package bill of materials."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "allocated exchanges"
    rule: "Require the allocation driver, fraction, shared products, period and sensitivity disclosure; fail unexplained allocation or netting of rejects."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_reconciliation
    applies_to: "physical package"
    rule: "Require output/component/reject mass reconciliation and electricity-to-output reconciliation for the declared period."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Cradle-to-publisher-gate modelling of physical packaged operating systems and upstream supply-chain studies that need a mass-normalized packaged-software input"
  allowed_use: "Use for a release and package configuration matching the declared operating-system role, architecture, licence, carrier, package bill of materials, geography, technology and production period"
  excluded_use: "System-software downloads, online software, software-as-a-service, custom software, application software, unbundled computing hardware, or downstream installation/use/end-of-life without separately modelled stages"
  required_metadata: "Canonical PCR id; CPC reference; release/edition/version; client or network role; supported architecture; licence/support term; carrier configuration and capacity; package bill of materials; sites; geography; technology; production period; reference flow UUID; unresolved UUID status; allocation methods"
  required_quality_disclosure: "Data coverage and representativeness; meter/invoice and scale evidence; mass and electricity reconciliations; upstream dataset identities and proxies; conditional rows; exclusions; allocations and sensitivity; limitations; reviewer and review date"
  update_trigger: "New carrier or package configuration; material bill-of-materials change; release or architecture change affecting production; site/grid/technology change; allocation change; exact Tiangong carrier UUID availability; newer product-boundary evidence; or a material data-quality finding"
