measurement_rules:
  - id: complete_set_mass
    applies_to: "Reference and purchased recorded sets"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh complete sets of each edition and pack configuration. Retain separate carrier and packaging masses. Never normalize to an individual disc when the book requires a multi-disc set."
  - id: duration_basis
    applies_to: "Recording metadata"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Record total sequential content at normal speed; do not multiply duration by audio channels or use compressed file size as playback duration."
  - id: electricity_conversion
    applies_to: "Electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve electricity as an energy exchange; 1 kWh = 3.6 MJ by unit definition. Preserve raw meter units and conversion, without treating electricity as combustion fuel."
  - id: stock_correction
    applies_to: "Material and waste records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert component counts using measured lot-specific mass. Correct receipts and issues for opening and closing stocks, returns and rework; use the same reporting window as accepted output."
