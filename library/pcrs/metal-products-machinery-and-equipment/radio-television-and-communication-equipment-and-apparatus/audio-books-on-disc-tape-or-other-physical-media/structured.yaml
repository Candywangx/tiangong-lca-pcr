allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "Shared operations"
    rule: "Use direct job metering and separate purchase records first. If allocation remains necessary, justify a physical causal driver; disclose any alternative allocation basis."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_copy_jobs
    applies_to: "Copying and assembly"
    rule: "Under cp_energy, assign measured energy by logged occupied machine time, with setup and idle energy assigned to the jobs that caused them. Use copy count only for demonstrably equal carrier and cycle requirements; audio duration alone is not a universal manufacturing driver."
    source_ids: []
  - rule_id: allocation_master
    applies_to: "Shared master-production module"
    rule: "Under cp_boundary, disclose how upstream title preparation is assigned across physical and digital releases and over the production population. Retain observed and forecast copy counts separately, test sensitivity to forecasts and prevent double charging through a supplied recorded-copy dataset."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "Rejects and recycling"
    rule: "Charge failed copying and destroyed sets to accepted output. Track rework without counting it as new production. Keep recycling assumptions consistent with linked datasets; do not give the foreground module an unsupported avoided-virgin-material credit."
    source_ids:
      - ghg-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_boundary
      process_id: "physical_release"
      flow_role: "Supply boundary and route"
      record_type: "Supplier and job record"
      raw_fields: "Supplier; master identifier; edition; input state; completed operations; upstream dataset; geography; year; transport mass and distance; shared master allocation"
      collection_method: "Trace purchase orders to job instructions and supplier declarations; walk through the site"
      unit: "kg; km; dataset identifier"
      frequency: "Each supplier and route change"
      temporal_coverage: "Same production window as output"
      site_scope: "Declared site and suppliers"
      aggregation_rule: "Build an operation-to-module register; count each operation once"
      quality_evidence: "Supplier evidence, boundary diagram and documented gaps"
    - protocol_id: cp_material
      process_id: "physical_release"
      flow_role: "Each carrier and packaging component"
      record_type: "Stock and weighing record"
      raw_fields: "Row id; lot; component specification; opening stock; receipts; closing stock; returns; issued count; sampled unit mass"
      collection_method: "Reconcile stores ledger with scales and job bills of materials"
      unit: "kg; item"
      frequency: "Each lot and stock close"
      temporal_coverage: "Complete representative reporting period including setup and failures"
      site_scope: "Production and packing stores"
      aggregation_rule: "Net use per row divided by accepted output mass; no average across incompatible editions"
      quality_evidence: "Scale checks, supplier specifications, stock reconciliation"
    - protocol_id: cp_energy
      process_id: "physical_release"
      flow_role: "Electricity"
      record_type: "Meter and job log"
      raw_fields: "Meter id; start/end reading; unit; job id; run time; setup; idle; support load; allocation driver"
      collection_method: "Submeter production and packing; reconcile allocated energy against the site bill"
      unit: "kWh; MJ; h"
      frequency: "Each campaign, with reporting-period reconciliation"
      temporal_coverage: "Same reporting period as accepted output"
      site_scope: "Copying, verification, packing and attributable support"
      aggregation_rule: "Sum job-assigned energy; convert units; divide by released mass"
      quality_evidence: "Meter calibration, bill reconciliation and driver justification"
    - protocol_id: cp_release
      process_id: "physical_release"
      flow_role: "Accepted audiobook sets"
      record_type: "Production and quality record"
      raw_fields: "Title; edition; language; abridgement; duration; format; carriers per set; accepted set count; rejected count; net carrier mass; enclosure mass; insert mass; gross set mass; verification result"
      collection_method: "Weigh complete sets; compare title and track sequence to the authorized master; record playback and file-integrity checks suitable for the format"
      unit: "kg; set; h"
      frequency: "Each edition and lot; verification per documented lot plan"
      temporal_coverage: "Same reporting period as inputs"
      site_scope: "Final verification and dispatch"
      aggregation_rule: "Q = sum of accepted set counts times measured set mass for the declared configuration"
      quality_evidence: "Weighing sheets, content manifest, test plan and release authorization"
    - protocol_id: cp_waste
      process_id: "physical_release"
      flow_role: "Each rejected carrier and paper waste stream"
      record_type: "Waste transfer and rework record"
      raw_fields: "Row id; origin; mass; contamination; rework count; stock change; destination; treatment route"
      collection_method: "Weigh segregated disc, cassette, flash, printed-paper and paperboard waste separately; reconcile with transfer records"
      unit: "kg; item"
      frequency: "Each lot and removal"
      temporal_coverage: "Same window as production; correct temporary storage"
      site_scope: "Production, packing and waste storage"
      aggregation_rule: "Waste leaving the boundary divided by Q; keep internal rework separate"
      quality_evidence: "Scale checks, waste receipts and component balance"
  calculation_rules:
    - id: normalize_release
      applies_to: "All inventory rows"
      rule: "For each row i, a_i = corrected and allocated A_i / Q; Q is accepted released mass and must be positive. Output is Q / Q = 1 kg by definition."
      inputs:
        - cp_material
        - cp_energy
        - cp_release
        - cp_waste
      output: "Exchange per reference flow"
      source_ids: []
    - id: set_conversion
      applies_to: "Declared output"
      rule: "m_set = carrier mass per set + included enclosure and insert mass per set; equivalent sets per kg = 1 / m_set. Retain measured batch variation rather than rounding to whole sets."
      inputs:
        - cp_release
      output: "Auditable set-to-mass conversion"
      source_ids: []
    - id: stock_use
      applies_to: "Input quantities"
      rule: "Net consumed mass = opening stock + receipts - closing stock - returned unused mass. Reconcile independently with job issues and internal returns."
      inputs:
        - cp_material
      output: "Row-specific gross consumed mass"
      source_ids: []
    - id: material_balance
      applies_to: "All physical inputs and outputs"
      rule: "Reconcile consumed carrier and packaging mass with released set mass, removed waste and work-in-progress change. Investigate differences using scale uncertainty and documented omissions; no universal tolerance is prescribed."
      inputs:
        - cp_material
        - cp_release
        - cp_waste
      output: "Component mass reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "Title set"
      requirement: "Do not pool editions, abridgements or media formats without quantities and an explicit weighted population."
      evidence: "cp_release title manifest and weighing records"
    - id: quality_coverage
      applies_to: "Foreground"
      requirement: "Use measured or documented primary activity data for controlled operations; state temporal, geographical and technological representativeness."
      evidence: "cp_boundary; cp_energy; ghg-product-standard-2011"
    - id: quality_missing
      applies_to: "Missing quantities"
      requirement: "Missing, zero and not applicable are distinct states. Resolve missing major quantities before using the package as a complete inventory."
      evidence: "Completeness review against cp_material and cp_waste"
    - id: quality_ranges
      applies_to: "Screening"
      requirement: "Collect foreground quantities even when external benchmarks are unavailable. Do not transfer a disc-manufacturing case value to tape or flash media, or treat storage recommendations as yield ranges."
      evidence: "Lot records; nist-cd-dvd-care-2003 for the distinct purpose of storage guidance"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Reference output"
    rule: "Require all reference qualifiers, Q greater than zero, the same declared gross retail-set mass basis for normalization and a complete carrier sequence. Test set_conversion against weighing records."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "Inputs and boundary"
    rule: "Require route-specific inclusion evidence. Purchased recorded copies and local blank-media copying must not describe the same copy twice. Reject a supplier link that creates a self-loop."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "Electricity"
    rule: "Reconcile meter totals and allocations, preserve MJ or documented kWh conversion, and exclude upstream grid emissions from direct site-emission rows."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "Exchanges"
    rule: "Require atomic identities, correct direction, flow type and unit. Keep any unconfirmed UUID empty. Reconcile every material input and waste stream with records; omitted additional site exchanges make coverage incomplete."
    source_ids: []
  - rule_id: validate_quality
    applies_to: "Product release"
    rule: "Require the edition manifest, duration and declared format-compatible playback or integrity checks. A mass total alone cannot establish a complete, usable audiobook set."
    source_ids:
      - loc-marc-sound-recording
      - loc-nls-equipment
  - rule_id: validate_use_claim
    applies_to: "Dataset claims"
    rule: "Label the foreground boundary and upstream-link completeness. Do not present gate-to-gate data as a complete life-cycle result or compare reading or listening services using product mass alone."
    source_ids:
      - ghg-product-standard-2011
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset for the declared physical audiobook production module after data review"
  allowed_use: "Modelling the specified edition or disclosed production mix at its declared carrier format, supplier cut, site and reporting period"
  excluded_use: "Standalone full product carbon footprint; download or streaming inventory; player manufacture; listening-service comparisons; another carrier route without requalification"
  required_metadata: "Reference qualifiers; collection window; title-set count and mass conversion; process boundary; supplier and electricity links; route conditions; allocation methods; measured quantities and calculation lineage"
  required_quality_disclosure: "Missing upstream data; unresolved flow identities; completeness; representativeness; measurement uncertainty; rework; rejects; master-production treatment and absent external benchmarks"
  update_trigger: "New carrier or packaging design; changed supplier, recording route, edition or electricity supply; changed yield or allocation basis; new measured data or verified flow identity"
