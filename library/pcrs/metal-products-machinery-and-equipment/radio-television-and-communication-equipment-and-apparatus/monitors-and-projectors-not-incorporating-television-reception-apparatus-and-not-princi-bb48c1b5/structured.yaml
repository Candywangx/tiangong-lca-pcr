allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared lines and route-specific batches"
    rule: "Prefer direct metering and batch subdivision so display_route, projector_route, model families and site-controlled subassemblies receive their measured inputs, energy, waste and rework without allocation."
    source_ids:
      - iso-14040-2006
      - iec-63366-2025
  - rule_id: allocation_rework
    applies_to: "rework and retesting"
    rule: "Assign replacement parts, rework energy, rejected mass and retesting to the accepted production batch that caused them; do not treat rework return as a co-product."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "inseparable shared utilities"
    rule: "If direct metering and subdivision are not feasible, use an auditable causal driver such as machine time, test hours or line hours. Use mass only when no better physical relationship exists, and disclose the driver and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recyclable scrap and waste"
    rule: "Record gross waste and scrap outputs and their treatment destination. Keep any revenue or downstream recycling-credit scenario separate from site inventory; do not reduce input mass or foreground burdens by sale value."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "subassembly_production_final_assembly"
      flow_role: "panel/optical engine, electronics, power supply, cooling, housing, cables and accessories"
      record_type: "controlled BOM plus receiving/issue records"
      raw_fields: "route; model; part number; component family; description; technology; supplier; purchased_or_made; quantity issued; quantity returned; unit mass; mass source; material; recycled content"
      collection_method: "join revision-controlled BOM to receiving and line-issue records; verify unit mass by calibrated scale or supplier declaration"
      unit: "item; kg"
      frequency: "each BOM revision and production batch"
      temporal_coverage: "entire reporting period"
      site_scope: "all reporting-site assembly and subassembly lines"
      aggregation_rule: "sum net issued quantity times verified unit mass by route, model and component family"
      quality_evidence: "approved BOM revision; supplier declaration; scale calibration; issue/return records"
    - protocol_id: cp_process_energy
      process_id: "subassembly_production_final_assembly_functional_testing"
      flow_role: "electricity"
      record_type: "revenue/submeter and equipment log"
      raw_fields: "meter id; start/end reading; timestamp; voltage; process/line; operating hours; test cycle; allocation driver"
      collection_method: "calibrated meter or utility-grade submeter; reconcile to facility bill and subtract separately metered excluded loads"
      unit: "kWh"
      frequency: "continuous or each batch/test cycle, aggregated monthly"
      temporal_coverage: "preferably 12 consecutive months; shorter startup period declared"
      site_scope: "reporting-site process and test areas"
      aggregation_rule: "sum metered kWh and normalize to accepted process output; disclose any shared-utility driver"
      quality_evidence: "meter calibration; bill reconciliation; coverage log"
    - protocol_id: cp_waste_dispatch
      process_id: "subassembly_production_final_assembly_functional_testing_packaging"
      flow_role: "manufacturing and packaging waste"
      record_type: "waste scale ticket and transfer record"
      raw_fields: "date; process; route; waste code; material/component; mass; destination; treatment; hazardous status"
      collection_method: "calibrated site scale or licensed waste-contractor ticket"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "entire reporting period"
      site_scope: "all reporting-site foreground processes"
      aggregation_rule: "sum by process, material, waste code and destination; retain gross mass before any revenue"
      quality_evidence: "scale ticket; transfer manifest; contractor receipt"
    - protocol_id: cp_output_mass
      process_id: "subassembly_production_final_assembly_functional_testing_packaging"
      flow_role: "transferred and accepted product mass"
      record_type: "production and transfer record"
      raw_fields: "route; model; batch; serial count; gross unit mass; net unit mass; packaging mass; accepted/rejected status; transfer process"
      collection_method: "calibrated scale linked to batch/serial production records"
      unit: "kg; item"
      frequency: "each batch or model-mass verification with count reconciliation"
      temporal_coverage: "entire reporting period"
      site_scope: "all reporting-site foreground processes"
      aggregation_rule: "sum accepted net mass by route/model/process; reconcile transfers and final output"
      quality_evidence: "scale calibration; batch closure; serial/count reconciliation"
    - protocol_id: cp_rework_records
      process_id: "functional_testing"
      flow_role: "rework and retest"
      record_type: "defect and rework log"
      raw_fields: "serial/batch; route; failure mode; return process; replaced part and mass; labor event; retest duration; final disposition"
      collection_method: "link test-system result to work order and parts issue/return records"
      unit: "item; kg; h"
      frequency: "each failed test and retest"
      temporal_coverage: "entire reporting period"
      site_scope: "reporting-site test and rework areas"
      aggregation_rule: "assign each rework event and replacement part to its accepted batch or final waste disposition"
      quality_evidence: "test log; work order; parts record; disposition approval"
    - protocol_id: cp_product_specification
      process_id: "functional_testing"
      flow_role: "route, visual performance and exclusion identity"
      record_type: "approved specification and compliance record"
      raw_fields: "route; intended use; tuner/receiver present; display technology; width; height; diagonal; screen area; luminance; projector technology; light source; light output; native resolution; maximum image size; normal configuration; included modules"
      collection_method: "extract from approved model specification and verify against route-appropriate test report"
      unit: "route; mm; inch; cm2; cd/m2; lm; pixels"
      frequency: "each model or specification revision"
      temporal_coverage: "specification valid during reporting period"
      site_scope: "every model included in dataset"
      aggregation_rule: "preserve model-level fields; mass-weight aggregation is not allowed for route identity or exclusion fields"
      quality_evidence: "signed specification; compliance declaration; test report"
    - protocol_id: cp_power_state_test
      process_id: "functional_testing"
      flow_role: "normal/on, ECO, standby, networked-standby and off power"
      record_type: "laboratory or production power test"
      raw_fields: "model; serial; route; state; W; voltage; frequency; test pattern; configuration; brightness/light output; warm-up; stabilization; connected modules; method; timestamp"
      collection_method: "calibrated power analyzer under declared route-appropriate method and as-shipped/normal configuration"
      unit: "W"
      frequency: "each model/specification revision and after power-affecting change"
      temporal_coverage: "test valid during reporting period"
      site_scope: "every model included in dataset"
      aggregation_rule: "retain model/state result; use production-weighted average only after reporting model-level range and configuration"
      quality_evidence: "analyzer calibration; complete test record; specification approval"
    - protocol_id: cp_packaging_bom
      process_id: "packaging"
      flow_role: "packaging materials and included accessories"
      record_type: "packaging BOM and packing record"
      raw_fields: "model; packaging part; material; quantity; unit mass; recycled content; dimensions; included accessory; pallet inclusion"
      collection_method: "join approved packaging BOM to packing issue records and verify representative unit mass"
      unit: "kg; item; mm"
      frequency: "each packaging revision and production batch"
      temporal_coverage: "entire reporting period"
      site_scope: "reporting-site packaging line"
      aggregation_rule: "sum quantity times verified unit mass by material and model; report packaging separately from reference mass"
      quality_evidence: "approved packaging BOM; scale calibration; supplier declaration; issue records"
  calculation_rules:
    - id: calculate_component_mass
      applies_to: "each component family"
      rule: "net component mass = sum((issued quantity - returned unused quantity) x verified unit mass)"
      inputs:
        - cp_component_bom
      output: "kg component family per kg reference product"
      source_ids:
        - barco-ecoscore-objective-criteria
    - id: calculate_screen_area
      applies_to: "display_route"
      rule: "viewable screen area = maximum viewable image width x maximum viewable image height measured along the panel surface"
      inputs:
        - cp_product_specification
      output: "cm2 or m2 screen area by model"
      source_ids:
        - eu-2019-2021-electronic-displays
        - energy-star-displays-v8-2020
    - id: calculate_native_resolution
      applies_to: "all routes"
      rule: "total native resolution = native horizontal pixels x native vertical pixels; preserve both pixel dimensions and total count"
      inputs:
        - cp_product_specification
      output: "pixels and megapixels by model"
      source_ids:
        - energy-star-displays-v8-2020
        - iso-iec-21118-2020
    - id: normalize_inventory
      applies_to: "all foreground rows"
      rule: "normalized amount = reporting-period process amount / accepted net finished-product kg"
      inputs:
        - cp_component_bom
        - cp_process_energy
        - cp_waste_dispatch
        - cp_output_mass
        - cp_rework_records
        - cp_packaging_bom
      output: "inventory amount per 1 kg reference product"
      source_ids:
        - iec-63366-2025
    - id: reconcile_product_mass
      applies_to: "final assembly through packaging"
      rule: "accepted product mass = component mass entering accepted units - removed/rejected parts + accepted replacement parts; packaging mass is reconciled separately"
      inputs:
        - cp_component_bom
        - cp_output_mass
        - cp_rework_records
        - cp_packaging_bom
      output: "product mass-balance difference and packaging mass by model/batch"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "every model"
      requirement: "Route, intended use, tuner/receiver absence, non-ADP-principal use and classification scope shall be explicitly approved; model families shall not cross route or exclusion boundaries."
      evidence: "approved specification; compliance declaration; cp_product_specification"
    - id: dq_component_completeness
      applies_to: "BOM and mass balance"
      requirement: "BOM mapping shall separately cover panel or optical engine, electronics/power supply, cooling, housing/chassis, cables/accessories and packaging; unclassified BOM mass and mass-balance difference shall be disclosed."
      evidence: "BOM revision; supplier mass evidence; calibrated scale; reconciliation report; cp_component_bom"
    - id: dq_energy_coverage
      applies_to: "process electricity"
      requirement: "Meter coverage, excluded loads and shared-utility drivers shall be disclosed and reconciled to facility totals; testing energy shall include failed tests and retests."
      evidence: "meter map; calibration; facility bill; cp_process_energy; cp_rework_records"
    - id: dq_visual_power_test
      applies_to: "model specification and tests"
      requirement: "Visual-performance and power-state records shall identify the applicable method, model, configuration, test conditions and calibrated equipment. Do not apply display limits to projectors or exempt display subclasses without an applicability statement."
      evidence: "approved test report; equipment calibration; cp_product_specification; cp_power_state_test"
    - id: dq_temporal_geographic
      applies_to: "all foreground data"
      requirement: "Prefer at least 12 consecutive months representative of normal production. Declare shorter startup or low-volume coverage, site geography, supplier geography, technology age and any proxy dataset."
      evidence: "reporting-period register; production volumes; supplier and upstream-dataset metadata"
    - id: dq_waste_destination
      applies_to: "all waste"
      requirement: "Every waste row shall identify material/component, hazardous status, measured mass, destination and treatment; reusable returns and rework shall not be reported as waste."
      evidence: "waste manifest; contractor receipt; rework disposition; cp_waste_dispatch"
    - id: dq_source_traceability
      applies_to: "externally constrained fields"
      requirement: "Retain the exact standard edition, official page or technical document used and record applicability limitations; web-hosted sources shall retain retrieval date."
      evidence: "source register linked to section 11 source ids"
validation_rules:
  - rule_id: validate_identity_exclusions
    applies_to: "reference product"
    rule: "Pass only if exactly one route is declared and evidence confirms no television broadcast tuner/receiver, no principally ADP-system use and no other excluded product identity."
    source_ids:
      - eu-2019-2021-electronic-displays
      - energy-star-displays-v8-2020
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "The product UUID, Mass UUID, Units of mass UUID and kg reference unit shall match section 3, and packaged_product_output shall equal 1 kg net finished equipment."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "model metadata"
    rule: "Fail completeness when any required route, technology, size/light-output, resolution, power-state, component, geography or reporting-period qualifier is absent or replaced by an unlabelled family average."
    source_ids:
      - energy-star-displays-v8-2020
      - iec-61947-1-2002
      - iec-62906-5-1-2021
      - iso-iec-21118-2020
  - rule_id: validate_component_routes
    applies_to: "process inventory"
    rule: "display_route shall contain a display-panel row and shall mark projector_optical_engine not applicable; projector_route shall contain an optical-engine/light-source row and shall mark display_panel_assembly not applicable. Both routes shall contain electronics/power supply, cooling and housing/chassis rows."
    source_ids:
      - ecma-370-2026
      - barco-ecoscore-objective-criteria
  - rule_id: validate_power_states
    applies_to: "power testing"
    rule: "Require normal/on and every available ECO, standby, networked-standby and off result with W, voltage, frequency, configuration and method. A missing physical state shall be declared not applicable rather than recorded as zero."
    source_ids:
      - eu-2019-2021-electronic-displays
      - energy-star-displays-v8-2020
      - barco-ecoscore-objective-criteria
  - rule_id: validate_mass_energy_waste_balance
    applies_to: "foreground processes"
    rule: "Require accepted transfer masses to reconcile across process gates, component mass to reconcile to net product mass, packaging to remain separate, testing energy to include retests, and all rejected material to have a final product-return or waste destination."
    source_ids: []
  - rule_id: validate_source_applicability
    applies_to: "all external rules"
    rule: "Each source-dependent rule shall identify the edition and applicability. Explicitly reject transfer of EU electronic-display limits to projectors and transfer of ADP-monitor product data to this PCR reference product."
    source_ids:
      - eu-2019-2021-electronic-displays
      - iec-63366-2025
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "manufacturing datasets for finished commercial/industrial displays or non-ADP front projectors matching the declared route, technology, intended use, geography, gate and required qualifiers"
  excluded_use: "television receivers; ADP-principal monitors/projectors; mixed display/projector averages; integrated panels; bare components; cinematographic projectors; use-phase datasets without a declared scenario"
  required_metadata: "reference-flow UUID and mass basis; route; technology; model/family; intended use and exclusion declarations; size or light output; native resolution; normal/as-shipped configuration; power states; panel/optical-engine, electronics, cooling and housing disclosures; net and packaging mass; geography; reporting period; allocation and proxy decisions"
  required_quality_disclosure: "foreground coverage and meter map; BOM mass coverage and balance difference; model coverage; test methods and calibration; rejected/rework treatment; waste destinations; supplier/upstream proxy quality; temporal, geographic and technological representativeness; source applicability limitations"
  update_trigger: "change in route, display/projection or light-source technology, panel/optical engine, power architecture, cooling, housing material, native resolution, size/light output, measured power states, site, supplier mix, process depth, allocation driver, packaging, regulatory scope or data older than the declared review interval"
