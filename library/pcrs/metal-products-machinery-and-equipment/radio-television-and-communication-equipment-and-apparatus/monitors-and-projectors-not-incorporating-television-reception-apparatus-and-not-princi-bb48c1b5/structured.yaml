measurement_rules:
  - id: reference_mass
    applies_to: "reference product and all mass-normalized inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize site totals to 1 kg net finished equipment. Record packaging separately and do not include tertiary transport packaging or separately sold accessories in reference mass."
  - id: route_visual_specification
    applies_to: "reference product identity"
    required_property_ref:
      name: "route-specific visual performance"
      uuid: ""
    required_unit: "display: mm, inch, cm2, pixels, cd/m2; projector: lm, pixels, inch or m"
    rule: "For display_route, record technology, viewable width/height, diagonal, screen area, native resolution and normal/as-shipped luminance. For projector_route, record projection technology and light-source type, rated light output, native resolution, and maximum declared projected image size under the cited test/specification method."
  - id: power_state_measurement
    applies_to: "functional testing and product specification"
    required_property_ref:
      name: "active electrical power and electricity"
      uuid: ""
    required_unit: "W; kWh"
    rule: "Record normal/on power and each available ECO, standby, networked-standby and off state separately. Preserve test voltage, frequency, configuration, picture/test pattern, brightness or light-output setting, warm-up/stabilization rule, connected modules and measurement method; do not substitute nameplate maximum power for measured power."
  - id: component_mass_balance
    applies_to: "panel/optical engine, electronics, cooling, housing, accessories and packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Sum quantity times measured or supplier-declared unit mass by component family and reconcile net finished-product mass, removed test/rework parts, manufacturing waste and packaging as separate balances."
