  classification_refs: "CPC 3.0: 47314 (exact)"
  covered_products: "independently operable commercial and industrial displays; digital-signage and video-wall display units; non-ADP front-projection systems without television reception apparatus"
  excluded_products: "television receivers and tuner-equipped products; CPC 47315 ADP-principal monitors/projectors; integrated control/status panels; medical and VR displays; rear-projection and separately classified cinematographic projectors; bare components and separately sold screens/lenses/mounts/controllers/accessories"
  representative_product: "one finished, saleable display unit or front projector in its as-shipped configuration at the factory gate"
  production_route: "exactly one of display_route or projector_route; declare technology and site-controlled subassembly depth"
  market_state: "finished, tested, packaged equipment for commercial, industrial, public-information, control-room, broadcast-production, installed audiovisual, or presentation use"
functional_unit:
  what: "finished display or front projector meeting this PCR scope at the factory gate"
  how_much: "1 kg net mass of finished equipment, excluding tertiary transport packaging and separately sold accessories"
  how_well: "saleable, functionally tested unit in the declared as-shipped configuration, with route and technical qualifiers complete"
  how_long_or_cycle: "one completed production batch normalized from the declared foreground reporting period"
  reference_flow_link: "packaged_product_output in packaging"
system_boundary:
  rules:
    - rule_id: boundary_route_separation
      applies_to: "all foreground data packages"
      rule: "Select exactly one of display_route and projector_route. Shared lines may be subdivided by metered batch records, but display and projector reference outputs shall not be averaged into one dataset."
      source_ids:
        - eu-2019-2021-electronic-displays
        - iec-61947-1-2002
        - iec-62906-5-1-2021
    - rule_id: boundary_product_exclusions
      applies_to: "product identity"
      rule: "Reject a product that incorporates a television broadcast tuner/receiver, is principally an ADP output unit, is a non-independent integrated panel, or belongs to another explicitly excluded category. Internet unicast or network control alone is not television reception apparatus."
      source_ids:
        - eu-2019-2021-electronic-displays
        - energy-star-displays-v8-2020
    - rule_id: boundary_component_completeness
      applies_to: "site-controlled manufacturing and assembly"
      rule: "Record, as separate component families, the display panel assembly for display_route or optical engine/light-source assembly for projector_route, plus electronic boards, power supply, cooling system, housing/chassis, cables/connectors, included accessories and packaging. Record purchased versus site-made status for each family."
      source_ids:
        - ecma-370-2026
        - barco-ecoscore-objective-criteria
    - rule_id: boundary_foreground_operations
      applies_to: "manufacturing-site gate-to-gate inventory"
      rule: "Include incoming inspection and route-specific subassembly work when site-controlled, final assembly, firmware/configuration loading when performed, functional and power-state testing, rework, packaging, direct site energy and water, manufacturing waste, wastewater and direct emissions. Link purchased inputs to upstream datasets."
      source_ids:
        - iec-63366-2025
        - iso-14040-2006
    - rule_id: boundary_display_applicability
      applies_to: "display_route"
      rule: "Apply display definitions and measurement requirements only where their stated scope fits the declared product. EU on-mode requirements exempt some professional and digital-signage displays and the EU regulation excludes projectors; do not transfer exempted limits or display equations to projector_route."
      source_ids:
        - eu-2019-2021-electronic-displays
        - energy-star-displays-v8-2020
    - rule_id: boundary_projector_performance
      applies_to: "projector_route"
      rule: "Document fixed-resolution projection technology, integral light source and projection optics, rated light output, native resolution and projected-image size using a declared applicable projector specification or measurement method."
      source_ids:
        - iec-61947-1-2002
        - iec-62906-5-1-2021
        - iso-iec-21118-2020
boundary_abstraction:
  declared_starting_condition: "purchased route-specific materials, components and subassemblies received at the reporting manufacturing site"
  starting_condition_role: "gate at which upstream component production ends and site-controlled subassembly, final assembly, testing, rework and packaging begin"
  product_classification_scope: "finished CPC 3.0 47314 equipment only; route-specific display or projector output without television reception apparatus and not principally used in ADP systems"
  recursive_input_rule: "A same-category display or projector purchased as an input remains a visible product input with a separate upstream dataset and declared role; do not recursively recreate its production inside the consuming process."
  upstream_dataset_requirement: "Link every purchased panel, optical engine, PCB assembly, power supply, cooling assembly, housing, cable/accessory set and packaging material to a geographically and technologically appropriate upstream dataset; disclose proxy use."
  disclosure: "Declare route, technology, site-controlled manufacturing depth, purchased-versus-made status of each major assembly, product and packaging mass balances, rejected/reworked units, measured power states, geography, reporting period and all exclusions."
