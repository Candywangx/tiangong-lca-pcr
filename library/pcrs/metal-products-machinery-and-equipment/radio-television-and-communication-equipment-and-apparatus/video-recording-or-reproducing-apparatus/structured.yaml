system_boundary:
  rules:
    - rule_id: boundary_manufacturing
      applies_to: "factory-gate foreground"
      rule: "Include component receipt and verification, assembly, storage installation, firmware loading and configuration, functional/electrical testing, rework and yield losses, packaging, utilities, on-site emissions and wastes, and factory-gate release. Link upstream supply datasets for purchased components, materials, energy, and packaging."
      source_ids:
        - iec-63366-2025
        - iso-14044-2006
    - rule_id: boundary_use_stage
      applies_to: "use-stage extension"
      rule: "Include operating, idle, standby, networked-standby, and off-mode electricity only when a declared use scenario is in scope. Use measured mode power and explicit service-life, duty-cycle, channel/resolution-load, storage-activity, and network-state assumptions; keep the factory-gate result separately visible."
      source_ids:
        - iec-62087-4-2015
        - energy-star-av-v3-2014
        - eu-2023-826
        - iec-62301-2026
        - iec-63474-2026
    - rule_id: boundary_end_of_life
      applies_to: "end-of-life extension"
      rule: "When end of life is included, model collection, preparation for reuse where applicable, battery and other selective removal, dismantling, recycling, recovery, and disposal using a declared geography and scenario. Keep recycled-content inputs and end-of-life credits methodologically distinct."
      source_ids:
        - eu-weee-2012-19
        - iec-tr-62635-2012
        - iec-63366-2025
    - rule_id: boundary_exclusions
      applies_to: "product and system scope"
      rule: "Exclude cameras/camcorders, televisions, monitors/projectors, sound-only apparatus, separately traded parts/media, external displays and cameras, user networks and content services, and general-purpose computing equipment unless an expanded system study explicitly adds them as separate datasets."
      source_ids:
        - unsd-cpc-3-0-structure
    - rule_id: boundary_component_resolution
      applies_to: "purchased electronics and assemblies"
      rule: "Preserve separate inventory resolution for PCB assemblies, storage devices, power supplies, enclosure/mechanical parts, accessories/cables, batteries, and packaging. Do not collapse these into an unspecified electronics input when records permit resolution."
      source_ids:
        - iec-62474-2018
        - eu-rohs-2011-65
boundary_abstraction:
  declared_starting_condition: "Purchased component and material inputs accepted at the reporting factory, with supplier identity, geography, technology, recycled-content basis where claimed, and upstream-dataset reference recorded."
  starting_condition_role: "The foreground begins at factory receipt and verification; upstream production of PCB assemblies, storage devices, power supplies, enclosure materials, accessories, electricity, fuels, and packaging is represented by linked background or supplier datasets."
  product_classification_scope: "Complete CPC 3.0 subclass 47323 apparatus only; excluded video-system equipment and separately traded parts remain distinct product categories."
  recursive_input_rule: "An input that itself satisfies this PCR is recorded as a purchased product with its own supplier dataset and declared starting condition; its manufacture is not recursively reconstructed inside the receiving foreground process."
  upstream_dataset_requirement: "Use technology-, geography-, and period-representative datasets for high-mass or high-impact inputs, and retain supplier-specific data when verified. Proxy use requires identity, representativeness, and substitution disclosure."
  disclosure: "Declare the represented function/configuration, factory sites, reporting period, family weighting, included components and accessories, packaging convention, cut-offs, proxies, excluded stages, and whether use and end-of-life extensions are included."
