allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "Avoid allocation by subdivision, separate metering, configuration-specific BOMs, and explicit recording of rework loops. Do not allocate excluded camera, display, television, or general-purpose computing burdens to the reference apparatus merely because equipment shares a system or line."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
  - rule_id: allocation_shared_resources
    applies_to: "shared line energy, utilities, and materials"
    rule: "Allocate shared electricity and utilities using measured cycle time and operating power, machine-hours, or another causal physical driver. Allocate directly attributable materials by BOM or measured mass. If a non-physical basis is unavoidable, document the reason, data, result, and sensitivity."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
  - rule_id: allocation_rework_and_recovery
    applies_to: "rework, scrap, co-products, and end-of-life recovery"
    rule: "Record gross inputs, good outputs, internal rework, rejects, and treatment routes before allocation. Apply burdens to saleable co-products using a declared physical relationship where feasible; keep any economic allocation or avoided-product credit as a disclosed alternative scenario and do not mix it with the foreground mass balance."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
      - iec-tr-62635-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_mass_reconciliation
      process_id: "component_supply"
      flow_role: "purchased components and net reference mass"
      record_type: "ERP/BOM, supplier declaration, calibrated scale record"
      raw_fields: "configuration id; component id; supplier; component family; material; quantity; unit mass; gross mass; net released mass; reject mass; inclusion in reference mass"
      collection_method: "Export BOM and receiving records, verify representative unit masses by calibrated weighing, and reconcile to released-product mass."
      unit: "kg"
      frequency: "Each configuration and BOM revision; monthly aggregation"
      temporal_coverage: "Representative reporting period, normally at least 12 consecutive months or the full shorter production campaign"
      site_scope: "Every represented factory and supplier-specific input where available"
      aggregation_rule: "Production-quantity-weighted by configuration; retain component-family subtotals and gross-to-net reconciliation."
      quality_evidence: "BOM revision, supplier declaration, scale calibration, reconciliation sign-off"
    - protocol_id: cp_storage_configuration
      process_id: "component_supply"
      flow_role: "storage devices"
      record_type: "BOM, serial/configuration log, supplier specification"
      raw_fields: "configuration id; technology; device count; installed capacity; maximum supported capacity; removable/fixed status; unit mass; supplier; firmware dependence"
      collection_method: "Reconcile installed storage hardware to BOM and sampled finished units; record supported but uninstalled capacity only as metadata."
      unit: "kg and declared capacity unit"
      frequency: "Each configuration and storage option"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every represented configuration and factory"
      aggregation_rule: "Production-quantity-weighted by installed configuration; never treat supported capacity as installed mass."
      quality_evidence: "BOM, serial/configuration report, supplier specification, sample check"
    - protocol_id: cp_assembly_records
      process_id: "equipment_assembly"
      flow_role: "assembly inputs, outputs, scrap, and rework"
      record_type: "MES batch record, weigh ticket, scrap log"
      raw_fields: "batch; configuration; component input mass; good output mass; rework mass; scrap type; scrap mass; destination; timestamp"
      collection_method: "Collect gross batch flows and preserve internal rework loops before netting."
      unit: "kg"
      frequency: "Each batch or shift"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every represented assembly line"
      aggregation_rule: "Sum gross flows by configuration and normalize to good assembled output."
      quality_evidence: "MES audit trail, scale calibration, waste transfer record"
    - protocol_id: cp_energy_meters
      process_id: "equipment_assembly_functional_test"
      flow_role: "process electricity and shared utilities"
      record_type: "submeter log and equipment runtime record"
      raw_fields: "meter id; process; start/end reading; voltage; power; runtime; batch; good output; rework cycles; allocation driver"
      collection_method: "Prefer dedicated meters; otherwise combine measured equipment power and logged runtime and document shared-resource allocation."
      unit: "kWh"
      frequency: "Each batch/shift or continuous logging"
      temporal_coverage: "Representative operating period including normal production variation"
      site_scope: "Every represented line and test area"
      aggregation_rule: "Subtract documented idle/non-production use where separately measured; normalize to good output after recording rework."
      quality_evidence: "Meter calibration, timestamps, runtime log, allocation worksheet"
    - protocol_id: cp_firmware_yield
      process_id: "firmware_configuration"
      flow_role: "configured output, retries, and failures"
      record_type: "station log and firmware deployment record"
      raw_fields: "configuration id; firmware version; function class; network/local-medium state; channel count; resolution; storage setup; pass; retry; failure; timestamp"
      collection_method: "Export station-level deployment results and reconcile passes, retries, failures, and transferred mass."
      unit: "kg and count"
      frequency: "Every unit or batch"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every represented configuration station"
      aggregation_rule: "Aggregate by configuration and firmware version; retain retry and failure rates."
      quality_evidence: "Signed software release, station log, yield reconciliation"
    - protocol_id: cp_test_power_and_yield
      process_id: "functional_test"
      flow_role: "tested output, failures, and release power checks"
      record_type: "test-station log, failure report, power-meter record"
      raw_fields: "configuration; test profile; channel load; resolution; storage state; network state; pass/fail; rework route; mode power; voltage; frequency; uncertainty"
      collection_method: "Export functional-test results and power checks with apparatus configuration and test conditions; reconcile failures to rework or waste."
      unit: "kg, count, W"
      frequency: "Every unit or statistically justified batch sample"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every represented test line and configuration"
      aggregation_rule: "Aggregate yields by configuration; retain power observations without replacing the dedicated use-mode protocol."
      quality_evidence: "Test procedure, instrument calibration, station log, failure disposition"
    - protocol_id: cp_packaging_release
      process_id: "packaging_release"
      flow_role: "released reference product and packaging"
      record_type: "packing BOM, final inspection, scale record, dispatch record"
      raw_fields: "configuration; product mass; accessory mass; external PSU mass; battery mass; cable mass; packaging material; packaging mass; released count; reject/repack mass"
      collection_method: "Weigh representative complete releases and packaging components; reconcile packed count to dispatch and net reference mass."
      unit: "kg and count"
      frequency: "Each configuration and packaging revision; monthly aggregation"
      temporal_coverage: "Same period as reference production"
      site_scope: "Every represented packing site"
      aggregation_rule: "Production-quantity-weighted by configuration; keep packaging outside net product mass."
      quality_evidence: "Scale calibration, packing specification, release and dispatch reconciliation"
    - protocol_id: cp_mode_power_profile
      process_id: "use_operation"
      flow_role: "applicable operating and low-power modes"
      record_type: "controlled power measurement"
      raw_fields: "configuration; supply voltage; frequency; power factor; connected ports; enabled protocols; channel load; resolution; storage state; mode; transition condition; stable power; uncertainty"
      collection_method: "Measure AC-input power in declared default configuration using applicable IEC and regulatory mode definitions; repeat for materially distinct configurations and modes."
      unit: "W"
      frequency: "Each representative configuration and firmware/power-management revision"
      temporal_coverage: "Current sold configuration and firmware"
      site_scope: "Laboratory or production site with traceable instruments"
      aggregation_rule: "Report mode-level observations; family averages require production weights and shall retain min/max observations without inventing category defaults."
      quality_evidence: "Test method, meter calibration, raw time series, configuration photographs/logs"
    - protocol_id: cp_use_duty_cycle
      process_id: "use_operation"
      flow_role: "service life and mode hours"
      record_type: "scenario record, field telemetry, customer study, or explicit assumption"
      raw_fields: "geography; application; annual hours by mode; channel occupancy; resolution; storage write/read duty; network state; service life; source; uncertainty"
      collection_method: "Use representative measured or documented scenario data; label assumptions and provide sensitivity when primary evidence is unavailable."
      unit: "h/year and years"
      frequency: "Each use scenario"
      temporal_coverage: "Declared scenario period"
      site_scope: "Declared market and application"
      aggregation_rule: "Mode hours shall sum to the declared year; multiply by declared service life only after scenario validation."
      quality_evidence: "Telemetry/study reference or signed scenario assumption and sensitivity"
    - protocol_id: cp_eol_records
      process_id: "end_of_life"
      flow_role: "collection, reuse, recovered fractions, and residues"
      record_type: "operator weighbridge, treatment report, scenario dataset"
      raw_fields: "geography; collection rate; reuse share; dismantling input; removed battery/PCB/storage; recovered fraction; residue; destination; loss; credit method"
      collection_method: "Use operator or official scenario records and maintain mass balance through collection and treatment."
      unit: "kg"
      frequency: "Each operator/reporting period or declared scenario"
      temporal_coverage: "Period representative of disposal geography"
      site_scope: "All treatment routes in the declared scenario"
      aggregation_rule: "Weighted by route share; separately report uncollected mass, reuse, recycling, recovery, and disposal."
      quality_evidence: "Operator permit/report, weighbridge records, mass-balance reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all manufacturing inventories"
      rule: "Divide each gross foreground flow by net kg of released reference product in the same reconciled production scope."
      inputs:
        - "Gross flow amount"
        - "released product mass"
      output: "Flow amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
        - iec-63366-2025
    - id: calc_family_weighting
      applies_to: "multi-configuration dataset"
      rule: "Sum each configuration-specific normalized result multiplied by its released-production quantity share; disclose included configurations and weights."
      inputs:
        - "Configuration result"
        - "released quantity"
      output: "Production-weighted family result"
      source_ids:
        - iec-63366-2025
    - id: calc_mass_balance
      applies_to: "manufacturing and end of life"
      rule: "Reconcile opening inputs with good outputs, internal rework, rejects, recovered fractions, residues, emissions where measured, and inventory change; investigate unexplained imbalance rather than forcing closure."
      inputs:
        - "Mass inputs"
        - outputs
        - "inventory change"
      output: "Mass-balance residual and completeness result"
      source_ids:
        - iso-14044-2006
        - iec-tr-62635-2012
    - id: calc_use_energy
      applies_to: "use-stage scenario"
      rule: "E = sum(P_m × t_m) / 1000 for all declared modes m; calculate each mode separately before summing and retain service-life multiplication as a scenario step."
      inputs:
        - "Mode power P_m in W"
        - "mode time t_m in h"
      output: "Electricity in kWh"
      source_ids:
        - iec-62087-4-2015
        - energy-star-av-v3-2014
        - eu-2023-826
        - iec-62301-2026
        - iec-63474-2026
    - id: calc_yield_and_rework
      applies_to: "assembly, configuration, and test"
      rule: "Record gross passes and rework loops; yield equals accepted output divided by total units or mass entering the applicable decision point. Never erase the energy and component losses of failed attempts."
      inputs:
        - Input
        - "accepted output"
        - rework
        - rejects
      output: "Yield, gross resource use, and reject flows"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Exact CPC 3.0:47323 identity and all required qualifiers shall be present; exclusions shall be checked."
      evidence: "Product specification, configuration matrix, CPC decision record, reference-flow UUID check"
    - id: dq_bom_completeness
      applies_to: "component supply"
      requirement: "PCB assemblies, storage, power supply, enclosure/mechanical parts, accessories/cables, batteries, integral displays if any, and packaging shall be separately visible and reconciled."
      evidence: "BOM-to-scale reconciliation, supplier declarations, missing-line review"
    - id: dq_temporal_geographic_technology
      applies_to: "all linked data"
      requirement: "Production period, factory geography, configuration/firmware, supplier technology, and proxy differences shall be recorded."
      evidence: "Data-quality assessment and dataset metadata"
    - id: dq_energy_coverage
      applies_to: "assembly, test, and use"
      requirement: "Meter coverage, calibration, allocation of shared energy, repeated tests, applicable power modes, test conditions, and measurement uncertainty shall be documented."
      evidence: "Meter map, calibration certificates, raw logs, allocation worksheet, mode-power report"
    - id: dq_mass_balance
      applies_to: "manufacturing and end of life"
      requirement: "Gross inputs, good outputs, rework, rejects, recovered fractions, residues, and inventory change shall be checked at the most resolved feasible level."
      evidence: "Signed mass-balance table and exception log"
    - id: dq_source_traceability
      applies_to: "external method and scenario evidence"
      requirement: "Each external source id shall resolve to a stable reference; assumptions and unresolved semantic flow candidates shall remain explicit."
      evidence: "Source register, retrieval record, unresolved-flow review"
validation_rules:
  - rule_id: val_identity
    applies_to: "product identity"
    rule: "Fail if the represented product is not principally video recording or reproduction apparatus under CPC 3.0:47323, or if cameras, televisions, monitors/projectors, sound-only equipment, separately traded parts/media, or general-purpose computers are silently included."
    source_ids:
      - unsd-cpc-3-0-structure
  - rule_id: val_reference_uuid_mass
    applies_to: "reference flow"
    rule: "Require Product flow 72f5238b-6dc7-456f-bdd7-87c02608d719, state code 100 at author verification, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1 kg net released reference product."
    source_ids: []
  - rule_id: val_configuration
    applies_to: "dataset metadata"
    rule: "Require recording/playback function, network/local-medium architecture, channels, resolution, installed/supported storage, power-supply configuration, applicable power modes, component/accessory split, production period, geography, and family weights. Fail a single-model dataset presented as a category default."
    source_ids:
      - iec-62087-4-2015
      - energy-star-av-v3-2014
      - eu-2023-826
  - rule_id: val_bom
    applies_to: "component and packaging inventory"
    rule: "Require reconciled net product mass and separate PCB, storage, power-supply, enclosure/mechanical, accessory/cable, battery, and packaging records; flag unresolved important Tiangong flow UUIDs before publication of a concrete dataset."
    source_ids:
      - iec-62474-2018
      - eu-rohs-2011-65
  - rule_id: val_process_coverage
    applies_to: "manufacturing inventory"
    rule: "Require component supply, assembly, firmware configuration, testing, and packaging/release, including yields, rework, rejects, process energy, packaging, and waste treatment."
    source_ids:
      - iec-63366-2025
      - iso-14044-2006
  - rule_id: val_power_modes
    applies_to: "use-stage extension"
    rule: "Require AC-input measured power for every applicable active and low-power mode with voltage, frequency, network/control state, channel/resolution load, storage state, transition conditions, and uncertainty. Fail use results based only on nameplate power."
    source_ids:
      - iec-62087-4-2015
      - energy-star-av-v3-2014
      - eu-2023-826
      - iec-62301-2026
      - iec-63474-2026
  - rule_id: val_use_energy
    applies_to: "use-stage extension"
    rule: "Require explicit service life and mode hours that sum to the declared time basis; recalculate kWh from mode-level W and h and keep the factory-gate result visible."
    source_ids:
      - iec-62087-4-2015
      - energy-star-av-v3-2014
  - rule_id: val_boundary_allocation
    applies_to: "system model"
    rule: "Require declared boundary, cut-offs, upstream datasets, proxies, allocation drivers, rework treatment, and any recovery credit. Do not mix an expanded use/end-of-life result with the factory-gate result without separate reporting."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
  - rule_id: val_end_of_life
    applies_to: "end-of-life extension"
    rule: "Require geography, collection, reuse, selective removal, treatment-route shares, recovered fractions, residues, losses, mass balance, and credit method when end of life is included."
    source_ids:
      - eu-weee-2012-19
      - iec-tr-62635-2012
  - rule_id: val_sources
    applies_to: "evidence traceability"
    rule: "Require every used source id to exist in Section 11 and prohibit search snippets, unverified numerical defaults, or undocumented estimates as final evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for complete video recording or reproducing apparatus, with optional, separately declared use and end-of-life extensions."
  downstream_use: "Construction of Tiangong flow, process, and lifecyclemodel projections and product-footprint or comparative studies whose scope matches the declared configuration."
  allowed_use: "Factory-gate modelling of CPC 3.0:47323 apparatus; comparison of declared configurations when functional equivalence, boundary, data quality, power modes, storage, accessories, and scenario assumptions are aligned; expanded studies with separately visible use and end-of-life results."
  excluded_use: "Cameras, televisions, monitors/projectors, sound-only apparatus, separately traded components/media, or general-purpose computers; undisclosed extrapolation from one DVR/NVR model to the whole category; comparison using nameplate power or hidden duty-cycle, storage, lifetime, allocation, or recovery assumptions."
  required_metadata: "Canonical PCR id; CPC code; reference-flow UUID and mass basis; all required qualifiers; configuration matrix and weights; factory/site and period; BOM/component split; manufacturing process coverage; boundary/cut-offs; upstream datasets/proxies; allocation; applicable power measurements and scenarios; end-of-life scenario if included; source ids; unresolved semantic flow candidates."
  required_quality_disclosure: "Primary-versus-secondary share; supplier/site specificity; temporal, geographical, and technological representativeness; BOM and mass-balance completeness; meter coverage and uncertainty; yield and rework; proxy use; family weighting; excluded stages; scenario sensitivity; unresolved quantitative evidence and flow UUIDs."
  update_trigger: "Product architecture, channel/resolution class, network/local-medium function, storage technology/configuration, PCB or power supply, accessory set, firmware power management, production route/site, family mix, applicable regulation/standard, or background dataset changes that materially affect identity, inventory, power, or interpretation."
