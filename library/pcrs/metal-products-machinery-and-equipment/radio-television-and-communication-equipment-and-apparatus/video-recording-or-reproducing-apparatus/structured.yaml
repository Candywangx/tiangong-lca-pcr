measurement_rules:
  - id: reference_product_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net mass of the complete as-shipped apparatus and declared bundled accessories, excluding packaging. Normalize the foreground inventory to exactly 1 kg. Declare whether detachable external power supplies, remotes, batteries, and cables are included in the net product mass."
  - id: configuration_identity
    applies_to: "represented product family"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record mass and production quantity for every configuration used in a family average. Do not average products with materially different recording/playback function, network/local-medium architecture, channel or resolution class, storage configuration, or supplied-accessory set without disclosing the weights and retained distinctions."
  - id: component_mass_split
    applies_to: "bill of materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile the reference mass to separately recorded PCB assemblies, storage devices, power supply, enclosure and mechanical parts, batteries, displays if integral, cables, and bundled accessories. Record packaging outside net product mass."
  - id: mode_power_measurement
    applies_to: "apparatus and supplied external power supply"
    required_property_ref:
      name: "Electrical power"
      uuid: ""
    required_unit: "W"
    rule: "Measure at the AC supply input in the as-shipped or declared default configuration. Record voltage, frequency, measurement uncertainty, connected ports, enabled network/control protocols, channel and resolution load, storage state, and mode transition conditions. Measure applicable recording, playback, simultaneous record/playback, idle, standby, networked-standby, and off modes separately; do not substitute nameplate power."
  - id: use_energy_conversion
    applies_to: "use-stage extension"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Calculate energy as the sum over declared modes of measured power in W multiplied by time in hours and divided by 1000. Service life, annual hours, channel loading, storage activity, and duty-cycle shares shall be scenario inputs, not universal defaults."
  - id: packaging_mass
    applies_to: "packaging release"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh primary, secondary, and transport packaging by material and report per 1 kg net reference product without adding packaging to the reference amount."
