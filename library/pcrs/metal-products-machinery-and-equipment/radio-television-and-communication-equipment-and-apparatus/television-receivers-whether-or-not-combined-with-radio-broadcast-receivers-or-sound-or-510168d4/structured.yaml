    rule: "Reconcile panel/module, backlight where applicable, electronic boards and power supply, enclosure/stand/hardware, loudspeakers, wiring, accessories, and other product materials to net finished-product mass, with moisture-free and scrap boundaries stated."
  - id: packaging_separation
