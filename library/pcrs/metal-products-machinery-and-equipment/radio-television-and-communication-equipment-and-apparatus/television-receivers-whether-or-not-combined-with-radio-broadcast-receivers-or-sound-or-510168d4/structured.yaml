    used_for: "Electronic-display definitions, OLED/microLED and backlit architectures, on/off/standby/networked-standby states, automatic state transitions, screen/product declarations, material and dismantling considerations"
  - id: "energy-star-tv-9-1"
    type: "official_guidance"
