allocation_rules:
  - rule_id: avoid_allocation_by_subdivision
    applies_to: "Shared manufacturing operations"
    rule: "Avoid allocation by separating lines, process steps, meters, batches, and records wherever technically feasible; preserve directly measured relationships."
    source_ids:
      - epd-international-pcr-2024-06
  - rule_id: physical_allocation
    applies_to: "Residual shared inputs, energy, emissions, and waste"
    rule: "If subdivision is not possible and a physical relationship represents causality, allocate using a documented physical driver such as machine time, test time, units, or mass; justify the selected driver and test sensitivity where it affects results."
    source_ids:
      - epd-international-pcr-2024-06
  - rule_id: economic_allocation_last_resort
    applies_to: "Residual multifunctional operations without a defensible physical driver"
    rule: "Use economic allocation only as a last resort, based on representative market values for the same period; disclose price sources and perform a sensitivity check for material results."
    source_ids:
      - epd-international-pcr-2024-06
  - rule_id: waste_point_of_substitution
    applies_to: "Manufacturing and end-of-life wastes"
    rule: "Treat material as waste at the documented point of substitution or loss of product status; state the cut-off/recycling convention and do not double count recycling benefits or recycled inputs."
    source_ids:
      - epd-international-pcr-2024-06
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom_mass
      process_id: "television_final_assembly_and_test"
      flow_role: "Display module, backlight, electronic assemblies, enclosure/stand/hardware, loudspeakers, accessories, and auxiliaries"
      record_type: "BOM, supplier specification, receiving record, verified disassembly"
      raw_fields: "part number; supplier; quantity; unit mass; material; display technology; included subassemblies; effective dates"
      collection_method: "Export the released BOM for each included model family, verify high-mass and critical electronic/display assemblies against supplier or receiving data, and reconcile substitutions"
      unit: "kg"
      frequency: "Each BOM revision and at least annually"
      temporal_coverage: "Representative production period, normally 12 consecutive months"
      site_scope: "Each included final-assembly site and supplier configuration"
      aggregation_rule: "Production- or sales-weight included model families; retain model-level records and avoid unweighted averaging"
      quality_evidence: "Approved BOM; supplier declarations; receiving measurements; mass reconciliation"
    - protocol_id: cp_packaging_bom_mass
      process_id: "television_final_assembly_and_test"
      flow_role: "Packaging by material and component"
      record_type: "Packaging specification, receiving and reuse records"
      raw_fields: "component; material; unit mass; units per product; recycled content if evidenced; reuse cycles; loss rate"
      collection_method: "Weigh or obtain supplier mass for each packaging component and reconcile to packed units; document reusable packaging circulation"
      unit: "kg"
      frequency: "Each packaging revision and at least annually"
      temporal_coverage: "Same period as product output"
      site_scope: "Each packaging configuration and site"
      aggregation_rule: "Production- or sales-weight configurations; allocate reusable packaging over evidenced cycles"
      quality_evidence: "Packaging drawing/BOM; scale records; supplier specification; reuse logs"
    - protocol_id: cp_assembly_energy
      process_id: "television_final_assembly_and_test"
      flow_role: "Assembly and facility electricity"
      record_type: "Revenue-grade or calibrated meter, invoice with submeter allocation"
      raw_fields: "meter start/end; kWh; line/site; products; output mass; downtime; allocation driver; electricity supplier/mix"
      collection_method: "Prefer line/process submeters; otherwise reconcile site invoices and exclude or allocate unrelated operations using the declared rule"
      unit: "kWh"
      frequency: "Monthly or finer"
      temporal_coverage: "At least 12 consecutive representative months"
      site_scope: "Each included assembly site"
      aggregation_rule: "Sum period energy and divide by conforming net output after documented allocation"
      quality_evidence: "Meter calibration; invoices; production logs; reconciliation"
    - protocol_id: cp_product_test_energy
      process_id: "television_final_assembly_and_test"
      flow_role: "Burn-in and release-test electricity"
      record_type: "Test-station meter or validated power-time record"
      raw_fields: "test type; power; duration; configuration; units tested; retests"
      collection_method: "Measure representative test stations or multiply validated configuration-specific power by logged duration; include retests and rejects consistently"
      unit: "kWh"
      frequency: "Continuous logs or representative campaign per configuration"
      temporal_coverage: "Same period as product output"
      site_scope: "Each test route"
      aggregation_rule: "Sum test energy for conforming and consistently assigned rejected output, then normalize to net output"
      quality_evidence: "Meter record; test log; sampling plan; instrument calibration"
    - protocol_id: cp_finished_product_mass
      process_id: "television_final_assembly_and_test"
      flow_role: "Conforming net receiver output"
      record_type: "Production release and calibrated scale record"
      raw_fields: "model; units; net unit mass; included accessories; packaging excluded; date; site"
      collection_method: "Weigh representative finished units and reconcile unit counts to released production"
      unit: "kg"
      frequency: "Per model introduction/change and monthly output"
      temporal_coverage: "Same period as inventory inputs"
      site_scope: "Each included site and model family"
      aggregation_rule: "Sum conforming net output mass; production- or sales-weight category aggregation"
      quality_evidence: "Scale calibration; release records; output reconciliation"
    - protocol_id: cp_manufacturing_waste
      process_id: "television_final_assembly_and_test"
      flow_role: "Scrap and rejected assemblies by material and route"
      record_type: "Waste dispatch, recycler receipt, internal scrap ledger"
      raw_fields: "material; mass; hazardous status; origin; treatment route; recovered quantity; date"
      collection_method: "Reconcile dispatched and internally reused waste with stock changes and production rejects; preserve treatment route"
      unit: "kg"
      frequency: "Monthly or finer"
      temporal_coverage: "Same period as product output"
      site_scope: "Each included site"
      aggregation_rule: "Sum by material and treatment route; no netting against inputs without allocation disclosure"
      quality_evidence: "Weighbridge tickets; recycler certificates; scrap ledger; balance check"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "All manufacturing exchanges"
      rule: "Divide the exchange total assigned to conforming production by net finished-receiver output mass for the same sites and period."
      inputs:
        - "Assigned exchange"
        - "conforming units"
        - "model net masses"
      output: "Exchange per 1 kg net finished receiver"
      source_ids:
        - epd-international-pcr-2024-06
    - id: screen_area
      applies_to: "Viewable display"
      rule: "Calculate viewable screen area from measured active horizontal width multiplied by active vertical height; convert to m2 and retain dimensions. For non-rectangular active areas, use documented active-area geometry."
      inputs:
        - "Active width"
        - "active height"
        - geometry
      output: "Viewable screen area in m2"
      source_ids:
        - eu-2019-2021-electronic-displays
        - energy-star-tv-9-1
    - id: component_mass_reconciliation
      applies_to: "Product BOM"
      rule: "Sum product-component masses, excluding distribution packaging, and compare with measured net finished-product mass. Investigate and disclose residual mass rather than forcing an unexplained balancing item."
      inputs:
        - "Component masses"
        - "net product mass"
      output: "Reconciled BOM and residual"
      source_ids:
        - epd-international-pcr-2024-06
    - id: packaging_intensity
      applies_to: "Packaging"
      rule: "Sum packaging component masses after applying evidenced reuse cycles and divide by net finished-product output mass; report material totals separately."
      inputs:
        - "Packaging component mass"
        - units
        - "reuse cycles"
        - "output mass"
      output: "kg packaging per kg net receiver by material"
      source_ids:
        - epd-international-pcr-2024-06
    - id: use_energy_by_power_state
      applies_to: "Conditional use module"
      rule: "Sum power in each supported state multiplied by its declared annual time, include automatic transitions consistently, convert Wh to kWh, and multiply by declared service life; apply the market electricity mix separately."
      inputs:
        - "On/standby/off/networked-standby power"
        - "state hours"
        - "service life"
      output: "Lifetime electricity by state and total"
      source_ids:
        - eu-2019-2021-electronic-displays
        - energy-star-tv-9-1
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Included model families"
      requirement: "Demonstrate that every included product is a consumer television receiver with the declared tuner/receiver and functions; maintain an exclusion review for professional displays, monitors, signage, and projectors."
      evidence: "Product specification, tuner declaration, model list, exclusion log"
    - id: dq_category_representativeness
      applies_to: "Category aggregation"
      requirement: "Cover the declared market, technology, size, and resolution mix using production or sales weights; disclose coverage share and never label a single model as a category average."
      evidence: "Model-level production/sales data, weighting workbook, coverage statement"
    - id: dq_bom_completeness
      applies_to: "Components and materials"
      requirement: "Reconcile the panel/module, backlight, boards/power supply, enclosure/stand, loudspeakers, accessories, and other materials to net product mass; document supplier dataset substitutions."
      evidence: "Released BOM, supplier data, scale/disassembly checks, residual analysis"
    - id: dq_power_states
      applies_to: "Product qualification and use module"
      requirement: "Preserve test configuration and separate measurements for every supported power state, including network and automatic-brightness settings; use measurements representative of included models."
      evidence: "Test report, instrument calibration, software/configuration record, model weights"
    - id: dq_packaging
      applies_to: "Packaging"
      requirement: "Report packaging separately by material, configuration, and reuse status and reconcile it to packed production."
      evidence: "Packaging BOM, receiving/weighing data, reuse records"
    - id: dq_temporal_geographic_technology
      applies_to: "Foreground and upstream datasets"
      requirement: "Use a representative production period and geography; match upstream data to the declared display architecture and major component technology, and disclose temporal, geographic, or technological proxies."
      evidence: "Data-quality assessment, supplier/site dates, dataset metadata, proxy log"
validation_rules:
  - rule_id: validate_product_scope
    applies_to: "Dataset identity"
    rule: "Confirm CPC 3.0 47313 semantics and the presence of a television receiver/tuner; fail eligibility if professional displays, monitors, digital signage, projectors, or components are mixed into the declared product average."
    source_ids:
      - energy-star-tv-9-1
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Confirm the reference product uses UUID 7ee7acef-9633-4d5f-9b53-20641c3b9b65, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, and that packaging is excluded from the net reference mass."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Confirm display technology, diagonal/area, native resolution, receiver/smart functions, power states, panel/backlight, electronic boards/power supply, enclosure/stand, loudspeakers, packaging, accessories, market, period, and aggregation method are declared."
    source_ids:
      - eu-2019-2021-electronic-displays
      - energy-star-tv-9-1
  - rule_id: validate_bom_reconciliation
    applies_to: "Product inventory"
    rule: "Confirm component/material totals reconcile to measured net product mass and that display, backlight, electronic boards, enclosure/stand, and loudspeakers are explicit rather than hidden in one unsupported aggregate."
    source_ids:
      - epd-international-pcr-2024-06
      - us-epa-display-lca-vol1-ch1
  - rule_id: validate_power_states
    applies_to: "Power and conditional use modelling"
    rule: "Confirm each supported state is separately measured with configuration, method, and automatic transition assumptions; reject an unqualified single power value as the use profile."
    source_ids:
      - eu-2019-2021-electronic-displays
      - energy-star-tv-9-1
  - rule_id: validate_packaging
    applies_to: "Packaging inventory"
    rule: "Confirm packaging is separate from net product mass, material-resolved, and reconciled to packed output, with reuse assumptions evidenced."
    source_ids:
      - epd-international-pcr-2024-06
  - rule_id: validate_boundary_and_sources
    applies_to: "System model"
    rule: "Confirm component supply, assembly/programming/testing, energy, waste, packaging supply, and output are covered, and that technology-, geography-, and time-representative upstream datasets or disclosed proxies are used."
    source_ids:
      - epd-international-pcr-2024-06
  - rule_id: validate_allocation
    applies_to: "Shared operations and waste"
    rule: "Confirm subdivision was attempted before allocation, the residual driver is justified, economic allocation is last resort, and waste/recycling conventions do not double count burdens or benefits."
    source_ids:
      - epd-international-pcr-2024-06
published_dataset_profile:
  dataset_role: "Foreground unit-process dataset for final assembly, programming, testing, and packing of consumer television receivers, with optional linked distribution, use, and end-of-life modules"
  downstream_use: "Product carbon footprint, EPD, ecodesign, procurement, hotspot, circularity, and life-cycle model construction when the declared goal and scope are compatible"
  allowed_use: "Category or model-family television manufacturing datasets with declared technology, size/area, resolution, receiver/smart functions, component structure, packaging, geography, period, and weighting"
  excluded_use: "Professional or broadcast display, computer monitor, digital-signage display, projector, panel/component, or a single-model result represented as a broad category average"
  required_metadata: "PCR id/version; reference UUID/property/unit; CPC reference; display technology; viewable diagonal/area; native resolution; tuner/receiver and smart/network functions; power-state configuration; panel/backlight/boards/enclosure/speakers/accessories; packaging; sites; market; period; model coverage and weights; system boundary; electricity mixes; allocation; cut-offs; data sources"
  required_quality_disclosure: "Foreground primary-data share and period; model/market coverage; supplier-specific coverage for display and electronics; proxy datasets; BOM residual; meter and test representativeness; packaging reuse evidence; allocation and recycling assumptions; excluded stages or accessories"
  update_trigger: "Material change in display architecture, panel or backlight supply, screen-size/resolution or model mix, tuner/smart platform, power supply or measured power states, enclosure/stand or loudspeaker design, packaging, assembly site/energy mix, market mix, regulation/test method, allocation, or data older than the declared representativeness period"
data_sources:
  - id: "epd-international-pcr-2024-06"
    type: "standard"
    reference: "EPD International, PCR 2024:06, *Electrical, electronic and electro-mechanical products*, version 1.0.1, 2025. https://www.environdec.com/pcr-library/pcr_23d2c7b4-04cd-4a57-8ca7-08d9b348866f"
    used_for: "Manufacturing and life-cycle boundary, component/PCB and packaging inventory coverage, primary/supplier data expectations, allocation hierarchy, electricity/transport/waste data quality, and conditional use/end-of-life modules"
