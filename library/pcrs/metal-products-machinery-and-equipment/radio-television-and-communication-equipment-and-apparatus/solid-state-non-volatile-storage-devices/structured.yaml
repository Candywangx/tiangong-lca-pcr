system_boundary:
  rules:
    - rule_id: boundary_finished_device_gate
      applies_to: "Foreground manufacturing"
      rule: "Include component receipt and reconciliation, assembly/interconnection, programming or configuration, functional testing and yield disposition, finished-product packaging, and the allocated share of site utilities, abatement, wastewater and waste management needed to deliver conforming finished product at the manufacturing gate."
      source_ids:
        - eu-pef-method-2021
        - samsung-semiconductor-lca-method
    - rule_id: boundary_upstream_component_coverage
      applies_to: "Purchased components and materials"
      rule: "NAND packages, controller and support ICs, substrates/PCBs, connectors, enclosures, joining materials, consumables, utilities, and packaging must retain upstream production through supplier-specific or representative datasets. Do not cut off semiconductor components because their physical mass is small."
      source_ids:
        - eu-pef-method-2021
        - boyd-horvath-dornfeld-nand-lca-2011
    - rule_id: boundary_foreground_control
      applies_to: "Vertically integrated production"
      rule: "When wafer fabrication, IC packaging, PCB/substrate manufacture, connector manufacture, or enclosure manufacture is under the reporting organisation's direct control, collect it as additional foreground processes or attach disaggregated site datasets; otherwise use reviewed upstream datasets and disclose the boundary."
      source_ids:
        - eu-pef-method-2021
        - samsung-semiconductor-lca-method
    - rule_id: boundary_use_and_end_of_life
      applies_to: "Downstream stages"
      rule: "Distribution, use-phase electricity, maintenance, service-life extension, data erasure, reuse and end-of-life are outside this manufacturing-gate foreground package unless explicitly added as separate downstream modules. A mass-based dataset alone must not support comparative storage-service claims."
      source_ids:
        - eu-pef-method-2021
        - boyd-horvath-dornfeld-nand-lca-2011
    - rule_id: boundary_no_unreported_cutoff
      applies_to: "Completeness"
      rule: "Report all known material, energy, water, process-gas, waste and direct-emission flows. Any unavailable quantity remains a documented data gap; it is not silently treated as zero."
      source_ids:
        - eu-pef-method-2021
