              kind: "collected_record"
              collection_protocol_id: cp_site_emission_and_discharge_records
              source_ids:
                - eu-pef-method-2021
            ranges: []
  - id: site_support_and_waste_management
    label: "Site support and waste management"
    inputs:
      product:
        - row_id: shared_site_energy_and_fuels
          role: "Shared site energy and fuels"
          name: "Site- and period-specific electricity and fuel supplies, one reviewed flow per supply"
          flow_type: "product"
          property_unit: "Energy / kWh or MJ"
          description: "Record electricity and fuels for HVAC, dry air, compressed air, vacuum, lighting, offices and other shared services only to the extent not already directly metered to a production process."
          amount:
            expression: "site meter totals minus directly assigned process consumption, allocated with documented causal drivers"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net finished reference product"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_shared_site_utility_records
              source_ids:
                - eu-pef-method-2021
                - samsung-semiconductor-lca-method
            ranges: []
        - row_id: shared_water_and_process_gases
          role: "Shared water and process gases"
          name: "Water and process-gas supplies, one reviewed flow per supply"
          flow_type: "product"
          property_unit: "Mass or volume / kg, m3 or Nm3 with conditions declared"
          description: "Record shared water, nitrogen and other process gases not captured by direct line records. Semiconductor-fabrication gases belong in the supplier or vertically integrated fabrication dataset, not as unsupported assembly estimates."
          amount:
            expression: "site meter and purchase records minus directly assigned consumption, allocated with documented causal drivers"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net finished reference product"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_shared_site_utility_records
              source_ids:
                - boyd-horvath-dornfeld-nand-lca-2011
                - samsung-semiconductor-lca-method
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        []
      waste:
        - row_id: shared_wastewater_and_solid_waste
          role: "Shared wastewater and solid waste"
          name: "Wastewater or solid waste, one reviewed waste flow per waste class and treatment route"
          flow_type: "waste"
          property_unit: "Mass or volume / kg or m3"
          description: "Record shared wastewater and site wastes not already assigned to a production process, separated by composition where known and final treatment route."
          amount:
            expression: "discharge meters, waste manifests and treatment invoices minus directly assigned process wastes"
            value_mode: "calculated_value"
