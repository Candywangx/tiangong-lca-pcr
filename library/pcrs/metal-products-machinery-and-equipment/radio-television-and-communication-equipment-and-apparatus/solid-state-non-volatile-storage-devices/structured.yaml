allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-product lines and shared processes"
    rule: "First avoid allocation by sub-metering, separate production orders, process subdivision, or a documented physical expansion of the measured system."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "Shared site utilities, consumables and wastes"
    rule: "When subdivision is not feasible, use a causal physical driver such as measured equipment energy, machine-hours, test-hours, occupied area with time, material throughput, or net product mass. Explain why the driver represents resource use; do not default to revenue."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_product_mix
    applies_to: "Multiple capacities, form factors or technologies"
    rule: "Retain product-specific BOM, mass, test recipe, yield and energy records where available. A production-mix dataset must be mass-weighted or production-weighted from disclosed product-specific records; do not scale solely by capacity."
    source_ids:
      - eu-pef-method-2021
      - snia-sss-pts-2-0-2
  - rule_id: allocation_rework_and_internal_recycling
    applies_to: "Rework and internally returned material"
    rule: "Keep reworked units and internally returned material inside the foreground boundary. Count only net external inputs, conforming outputs and externally transferred wastes, while retaining gross yield and rework records for audit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_recovered_material
    applies_to: "Scrap sold or sent for recovery"
    rule: "Record the outgoing waste/material quantity and treatment route without an unreviewed avoided-burden credit in the foreground manufacturing dataset. Apply recycling or end-of-life credits only in a declared downstream method that is consistent across compared systems."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_component_and_material_records
      process_id: "device_assembly_and_programming"
      flow_role: "purchased_nvm_components; controller_and_support_electronics; interconnect_and_structural_components; joining_and_assembly_materials"
      record_type: "BOM, purchase receipt, material issue/return and inventory record"
      raw_fields: "product/SKU; supplier; component/material identity; quantity; unit mass; lot; issue; return; opening/closing inventory; scrap link"
      collection_method: "Export controlled BOM and ERP/MES records; verify representative unit masses by weighing or supplier declaration"
      unit: "kg and item"
      frequency: "Each production lot with monthly reconciliation"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "All included manufacturing sites and outsourced assembly under operational control"
      aggregation_rule: "Reconcile issued plus opening inventory minus returns and closing inventory to incorporated material and recorded loss, then normalize to conforming net product mass"
      quality_evidence: "Approved BOM revision, supplier specification, calibration record, ERP/MES extract and reconciliation sign-off"
    - protocol_id: cp_process_energy_records
      process_id: "device_assembly_and_programming"
      flow_role: "assembly_line_electricity"
      record_type: "Sub-meter, equipment runtime and power record"
      raw_fields: "meter id; start/end reading; interval; equipment; recipe; runtime; tested/assembled units; voltage level"
      collection_method: "Prefer calibrated sub-metering; otherwise use measured power by operating state multiplied by logged runtime"
      unit: "kWh"
      frequency: "Continuous or per lot; reconcile monthly"
      temporal_coverage: "At least 12 representative months or justified production campaign"
      site_scope: "Each included assembly line/site"
      aggregation_rule: "Sum direct process energy and divide by same-period conforming net product mass; exclude energy captured as shared support"
      quality_evidence: "Meter calibration, raw interval export, equipment log and no-double-count reconciliation"
    - protocol_id: cp_mass_yield_rework_and_waste_records
      process_id: "device_assembly_and_programming_functional_test_and_yield_control"
      flow_role: "assembled_programmed_device; assembly_scrap_and_losses; assembled_devices_entering_test; failed_devices_and_test_waste"
      record_type: "MES transfer, yield, rework, scrap and waste disposition record"
      raw_fields: "input units/mass; good units/mass; rework loops; WIP change; reject code; waste mass; disposition; treatment route"
      collection_method: "Reconcile production orders, weigh representative products and wastes, and link external waste documents"
      unit: "kg and item"
      frequency: "Each lot; monthly closure"
      temporal_coverage: "Same reporting period as material and energy records"
      site_scope: "All included production and test operations"
      aggregation_rule: "good output + external waste + closing WIP - opening WIP must reconcile with input and documented inventory changes within stated tolerance"
      quality_evidence: "Scales calibration, MES audit trail, failure analysis, waste manifest and signed mass-balance review"
    - protocol_id: cp_test_recipe_energy_and_result_records
      process_id: "functional_test_and_yield_control"
      flow_role: "test_and_conditioning_electricity; test_consumables_and_replacements"
      record_type: "Test recipe, tester log, power record, consumable issue and result record"
      raw_fields: "device class; capacity; interface; firmware; media type; recipe; workload; test duration; power/energy; pass/fail/rework; consumables"
      collection_method: "Link tester and power data to serial/lot results and actual test recipe; retain deviations from standard settings"
      unit: "kWh, kg, item and h"
      frequency: "Each tested lot or statistically complete automated log"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Each included test cell/site"
      aggregation_rule: "Aggregate energy and consumables by actual tested population, preserving product/application class before normalizing to conforming mass"
      quality_evidence: "Test-system calibration, immutable recipe/version, SNIA-compatible descriptors where applicable, and traceable pass/fail log"
    - protocol_id: cp_finished_product_mass_and_qualifiers
      process_id: "functional_test_and_yield_control_finished_product_packaging"
      flow_role: "conforming_unpacked_devices; devices_entering_packaging; packaged_finished_reference_product"
      record_type: "Quality release, product master, measured mass and shipment transfer record"
      raw_fields: "SKU; capacity convention; interface/protocol; speed; form factor; media type; firmware; application class; enclosure; unit mass; released units; packaging state"
      collection_method: "Export released population and product master; weigh a documented representative sample for each product family"
      unit: "kg and item"
      frequency: "Each released lot; product mass rechecked after design change"
      temporal_coverage: "Same reporting period as inventory"
      site_scope: "All products/sites included in dataset"
      aggregation_rule: "Calculate net finished mass by qualified product family; production-mix aggregation preserves weights and qualifiers"
      quality_evidence: "Calibrated scale, sampling record, product specification, quality release and shipment reconciliation"
    - protocol_id: cp_packaging_material_energy_and_waste_records
      process_id: "finished_product_packaging"
      flow_role: "packaging_material_inputs; packaging_line_electricity; packaging_waste"
      record_type: "Packaging BOM, issue, meter and waste record"
      raw_fields: "packaging level; material; unit mass; issued/returned quantity; packed units; meter readings; waste mass; reuse cycles/losses"
      collection_method: "Reconcile packaging BOM and purchases to packed output and waste; meter packaging energy where material"
      unit: "kg, item and kWh"
      frequency: "Each lot with monthly reconciliation"
      temporal_coverage: "Same reporting period as packaged output"
      site_scope: "Each included packaging location"
      aggregation_rule: "Report packaging separately by material and level; allocate reusable packaging over evidenced trips and losses"
      quality_evidence: "Packaging specification, supplier declaration, scale/meter calibration, reuse log and mass balance"
    - protocol_id: cp_shared_site_utility_records
      process_id: "site_support_and_waste_management"
      flow_role: "shared_site_energy_and_fuels; shared_water_and_process_gases; shared_wastewater_and_solid_waste"
      record_type: "Site meter, invoice, tank/purchase and waste record"
      raw_fields: "utility/fuel identity; meter; interval; quantity; directly assigned subtraction; site output; allocation driver; waste class/route"
      collection_method: "Collect site totals, subtract direct process records, and allocate residual with a documented causal driver"
      unit: "kWh, MJ, kg, m3 or Nm3"
      frequency: "Monthly"
      temporal_coverage: "At least 12 representative months or justified campaign"
      site_scope: "Each included site"
      aggregation_rule: "Residual shared total is allocated once; all direct and shared amounts reconcile to the site total"
      quality_evidence: "Invoice/meter agreement, calibration, allocation worksheet, waste manifest and management approval"
    - protocol_id: cp_site_emission_and_discharge_records
      process_id: "device_assembly_and_programming_functional_test_and_yield_control_finished_product_packaging_site_support_and_waste_management"
      flow_role: "assembly_direct_emissions; test_direct_emissions; packaging_direct_emissions; shared_direct_site_emissions"
      record_type: "Stack, effluent, permit, laboratory and mass-balance record"
      raw_fields: "substance; compartment; source; concentration; flow; duration; abatement; uncertainty; direct-process assignment"
      collection_method: "Use measured releases where available; otherwise use a documented mass balance or regulated method and identify estimation basis"
      unit: "kg per substance"
      frequency: "Per monitoring plan with reporting-period reconciliation"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "All included emission points and discharge routes"
      aggregation_rule: "Sum direct-process and residual shared releases once, normalized to conforming net product mass"
      quality_evidence: "Accredited laboratory result, calibrated monitor, permit report, abatement log and calculation audit trail"
    - protocol_id: cp_supplier_upstream_coverage
      process_id: "device_assembly_and_programming"
      flow_role: "all purchased component, material, utility and packaging inputs"
      record_type: "Supplier PCF/LCI, verified EPD, process dataset or background dataset metadata"
      raw_fields: "dataset id/version; supplier/technology; geography; year; boundary; allocation; data quality; component/material match"
      collection_method: "Match each material input to a reviewed upstream dataset and document proxy hierarchy where primary supplier data are unavailable"
      unit: "dataset reference"
      frequency: "At dataset build and every source update"
      temporal_coverage: "Prefer data representative of the foreground reporting period"
      site_scope: "All purchased inputs across included sites"
      aggregation_rule: "Coverage table must reconcile every non-zero purchased input to one upstream dataset without double counting"
      quality_evidence: "Supplier verification, dataset metadata, representativeness assessment and reviewer approval"
  calculation_rules:
    - id: calc_net_finished_mass
      applies_to: "Reference normalization"
      rule: "net finished mass = sum(released unit count by qualified product family × verified net unit mass); exclude separately reported packaging"
      inputs:
        - "released units"
        - "qualified product family"
        - "sampled unit mass"
        - "packaging state"
      output: "kg net finished product"
      source_ids:
        - eu-pef-method-2021
        - snia-sss-pts-2-0-2
    - id: calc_inventory_normalization
      applies_to: "Every foreground flow"
      rule: "normalized amount = reporting-period flow amount / reporting-period net finished product mass"
      inputs:
        - "collected flow amount"
        - "calc_net_finished_mass output"
      output: "row unit per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_material_reconciliation
      applies_to: "Components and materials"
      rule: "opening inventory + receipts - closing inventory - documented returns = incorporated material + recorded scrap/loss + justified inventory variance"
      inputs:
        - inventory
        - receipt
        - return
        - "BOM incorporation and waste records"
      output: "reconciled input and variance by material/component"
      source_ids:
        - eu-pef-method-2021
    - id: calc_yield_rework_reconciliation
      applies_to: "Assembly and test"
      rule: "input units/mass + opening WIP = conforming output + external waste + closing WIP + documented transfers; rework loops remain internal and are reported separately"
      inputs:
        - input
        - output
        - WIP
        - rework
        - "reject and waste records"
      output: "gross yield, final yield, rework rate and unexplained balance"
      source_ids:
        - eu-pef-method-2021
    - id: calc_shared_burden_allocation
      applies_to: "Site support"
      rule: "allocated burden = residual shared total × documented causal-driver share; residual shared total = site total - all direct assignments"
      inputs:
        - "site total"
        - "direct assignments"
        - "selected physical driver by product family/process"
      output: "allocated shared utility, waste or emission amount"
      source_ids:
        - eu-pef-method-2021
    - id: calc_upstream_coverage
      applies_to: "Purchased inputs"
      rule: "coverage = mass or relevant quantity of purchased inputs linked to reviewed upstream datasets / total purchased input quantity; report uncovered rows separately rather than treating them as zero"
      inputs:
        - "reconciled purchased-input table"
        - "upstream dataset coverage table"
      output: "coverage ratio and uncovered-input list"
      source_ids:
        - eu-pef-method-2021
        - boyd-horvath-dornfeld-nand-lca-2011
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and outputs"
      requirement: "Verify that the output is a finished CPC 47550 solid-state non-volatile storage device/media and not a bare semiconductor, magnetic/optical medium, reader/drive, storage array, host computer or capacity-specific proxy presented as the generic category."
      evidence: "Product master, BOM, photographs/specification, CPC scope review and exact Tiangong flow identity"
    - id: dq_product_qualifiers
      applies_to: "Product mix"
      requirement: "Retain capacity convention, interface/protocol, speed, form factor, media type, firmware/configuration, application class, enclosure, packaging and production-mix weights for every included family."
      evidence: "Controlled product master and released-population extract aligned with SNIA device descriptors"
    - id: dq_temporal_representativeness
      applies_to: "Foreground records"
      requirement: "Use at least 12 consecutive representative months unless a shorter campaign is justified; identify shutdowns, ramp-up, design transitions and abnormal yields."
      evidence: "Dated meter, MES, ERP, test, waste and shipment records plus representativeness justification"
    - id: dq_geographic_and_technology_match
      applies_to: "Upstream datasets"
      requirement: "Prefer supplier/site and technology-specific datasets. Document geography, node or memory technology, packaging route, electricity mix, year and proxy limitations for semiconductor and electronic components."
      evidence: "Supplier dataset metadata and representativeness assessment"
    - id: dq_completeness
      applies_to: "All inventory"
      requirement: "Reconcile BOM, energy, water, gas, product, reject, waste and emissions. Unavailable important quantities remain explicit gaps and prevent publication-ready completeness."
      evidence: "Signed reconciliation tables, uncovered-input list and gap register"
    - id: dq_measurement_quality
      applies_to: "Foreground measurements"
      requirement: "Retain meter/scale identification, calibration, sampling, conversion factors, uncertainty and responsible record owner."
      evidence: "Calibration certificates, raw exports, sampling plan and calculation workbook"
    - id: dq_no_double_counting
      applies_to: "Direct and shared burdens"
      requirement: "Direct process records plus residual shared allocation must reconcile to site totals; no flow may appear in both direct and shared records."
      evidence: "Site reconciliation and allocation worksheet"
    - id: dq_source_limitations
      applies_to: "External evidence"
      requirement: "Do not transfer numerical values from old semiconductor technology generations, a single SSD model, or another capacity/form factor into the generic PCR. Use such evidence only for boundary, process and qualifier design unless current representative quantitative evidence is provided."
      evidence: "Source-use review for every external citation"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID must equal 4c208ec5-5d80-4547-ab8e-347ef5fb1caf, resolve to state-code 100 Product flow, and retain CPC 47550 identity, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_finished_product_scope
    applies_to: "Product identity"
    rule: "Reject a package whose reference product is a bare NAND/controller die, wafer, chip, semiconductor intermediate, magnetic/optical medium, removable-media reader/drive, smart card, complete storage system, host computer, software/content, or a single capacity/model flow substituted for the generic category."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_required_qualifiers
    applies_to: "Product metadata"
    rule: "Fail completeness when any required capacity, interface, form factor, media, firmware/configuration, application class, enclosure/connector, initialization, geography/period, mass, packaging or mix qualifier is missing."
    source_ids:
      - snia-sss-pts-2-0-2
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Net conforming device output must equal 1 kg after normalization; included packaging mass must be separately visible and must not silently change the device reference mass."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_mass_yield_reconciliation
    applies_to: "Assembly and test"
    rule: "Flag unexplained differences among component/material inputs, work-in-progress changes, conforming output, rework and external waste. The dataset must state and justify its reconciliation tolerance."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_energy_and_utility_reconciliation
    applies_to: "Direct and shared utilities"
    rule: "Directly metered amounts plus residual shared allocation must equal the site total for each utility and period within the declared tolerance, with no double counting."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_upstream_coverage
    applies_to: "Purchased inputs"
    rule: "Every non-zero purchased component/material/utility/packaging input must link to a reviewed upstream dataset or be reported as an unresolved gap; missing low-mass semiconductor coverage is not accepted as zero."
    source_ids:
      - eu-pef-method-2021
      - boyd-horvath-dornfeld-nand-lca-2011
  - rule_id: validate_allocation_disclosure
    applies_to: "Shared and multi-product processes"
    rule: "Require the selected causal driver, numerator, denominator, direct-assignment subtraction, product-mix weighting and justification; flag revenue-only allocation unless physical causality is demonstrably unavailable and review accepts it."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_no_capacity_scaling
    applies_to: "Cross-product use"
    rule: "Reject conversion between capacities, form factors, technologies or application classes based only on a GB/TB ratio. Require product-specific BOM, yield, test and energy evidence."
    source_ids:
      - snia-sss-pts-2-0-2
      - boyd-horvath-dornfeld-nand-lca-2011
  - rule_id: validate_downstream_claims
    applies_to: "Comparative use"
    rule: "A mass-based manufacturing-gate dataset alone is incomplete for comparisons of storage service. Require a separate functional-equivalence model covering capacity convention, workload, performance, endurance/service life, use electricity and end-of-life."
    source_ids:
      - eu-pef-method-2021
      - snia-sss-pts-2-0-2
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for finished solid-state non-volatile storage devices, publishable as a disaggregated or aggregated secondary_dataset or background_dataset after review"
  downstream_use: "Supply-chain modelling of finished SSD, flash-card and equivalent CPC 47550 device production; component contribution analysis; downstream device, computer, embedded-equipment or storage-service models that add their own use and end-of-life assumptions"
  allowed_use: "Use for the declared capacity/form-factor/technology/application mix and manufacturing geography/period; aggregation across products only with disclosed weights and qualifier preservation"
  excluded_use: "Bare NAND/chip production; magnetic/optical media or readers; storage arrays/host computers; capacity-only scaling; service-level or comparative environmental claims without functional equivalence, workload, endurance/life, use electricity and end-of-life modules"
  required_metadata: "PCR id/version; reference UUID/property/unit group/unit; CPC scope; product qualifiers; product and packaging mass; production sites and period; technology and capacity mix; foreground ownership boundary; upstream dataset table; yield/rework; direct/shared utility split; allocation drivers; source versions; unresolved gaps"
  required_quality_disclosure: "Temporal, geographic and technological representativeness; meter/scale calibration; BOM and mass-balance reconciliation; test-recipe coverage; upstream semiconductor dataset quality; allocation sensitivity; proxy limitations; excluded stages; data completeness and uncertainty"
  update_trigger: "Material product architecture, memory technology, capacity/form-factor mix, test recipe, firmware/configuration, manufacturing site, electricity supply, BOM, yield, packaging, supplier dataset, allocation method, CPC scope, Tiangong UUID identity, or external method source change"
data_sources:
  - id: "unsd-cpc-3-0-2025"
    type: "standard"
    reference: "United Nations Statistics Division. *Central Product Classification Version 3.0: Explanatory Notes*, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (accessed 2026-08-09)."
    used_for: "CPC 47550 identity; included solid-state non-volatile recording devices/cards; separation from magnetic/optical media, fixed/removable-media storage units, readers and other categories"
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission. *Commission Recommendation (EU) 2021/2279, Annex I: Product Environmental Footprint Method*, 16 December 2021. https://environment.ec.europa.eu/document/download/680503dc-5a19-4f6a-bb92-84d9bfc8f312_en?filename=Annexes+1+to+2.pdf (accessed 2026-08-09)."
    used_for: "Functional unit, reference flow, life-cycle boundary, foreground/background distinction, data collection and quality, cut-off/completeness, multi-functionality, allocation and reporting rules"
  - id: "snia-sss-pts-2-0-2"
    type: "standard"
    reference: "Storage Networking Industry Association. *Solid State Storage Performance Test Specification*, Version 2.0.2, 1 October 2020. https://www.snia.org/sites/default/files/2025-02/SNIA-SSS-PTS-2.0.2.pdf (accessed 2026-08-09)."
    used_for: "Device-level scope and required capacity, interface/speed, form-factor, media, firmware and client/enterprise descriptors; test-state and workload disclosure"
  - id: "boyd-horvath-dornfeld-nand-lca-2011"
    type: "literature"
    reference: "Boyd, S. B.; Horvath, A.; Dornfeld, D. *Life-Cycle Assessment of NAND Flash Memory*. IEEE Transactions on Semiconductor Manufacturing 24(1), 117-124 (2011). DOI: 10.1109/TSM.2010.2087395. Open accepted manuscript: https://escholarship.org/uc/item/2wr9b3t1 (accessed 2026-08-09)."
    used_for: "NAND fabrication process and inventory significance; electricity, water, chemicals, process emissions, infrastructure and abatement coverage; warning against unsupported cross-technology or capacity extrapolation"
  - id: "samsung-semiconductor-lca-method"
    type: "literature"
    reference: "Samsung Semiconductor. *Life Cycle Assessment: From raw materials to disposal, efforts to reduce carbon*, including third-party-validated PCF system description. https://semiconductor.samsung.com/sustainability/environment/green-technology/life-cycle-assessment/ (accessed 2026-08-09)."
    used_for: "Current industry evidence for cradle-to-gate raw-material, manufacturing, packaging and test coverage; activity-data collection; electricity, process-gas, water and process-level reporting"
projection_metadata:
