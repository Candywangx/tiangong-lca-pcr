      frequency: "Each batch"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every included site and outsourced stage"
      aggregation_rule: "Sum accepted transfers and losses by route; normalize through accepted output"
      quality_evidence: "Route traveller; production-system audit trail; reject disposition"
