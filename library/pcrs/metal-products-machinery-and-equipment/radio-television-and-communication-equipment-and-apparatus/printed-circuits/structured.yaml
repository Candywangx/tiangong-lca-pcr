      collection_method: "Sub-metering preferred; otherwise documented equipment calculation reconciled to facility totals"
      unit: "kWh; MJ; carrier-specific unit"
      frequency: "Continuous or per shift; monthly reconciliation"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every included site"
      aggregation_rule: "Sum by carrier and line, subtract unrelated use, allocate under section 7, normalize to accepted output"
      quality_evidence: "Meter calibration or invoice; runtime log; reconciliation to site total"
    - protocol_id: cp_water_balance
      process_id: "hole_and_surface_preparation_conductor_formation"
      flow_role: "Process, rinse, and cooling water"
      record_type: "Meter, tank, rinse-line, recycle, and discharge record"
      raw_fields: "source; use; make-up volume; recirculated volume; discharge volume; tank change; concentration where relevant"
      collection_method: "Source and line sub-metering or reconciled water balance"
      unit: "m3"
      frequency: "Continuous or daily; monthly reconciliation"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every included site"
      aggregation_rule: "Count make-up water once; report recirculation separately; reconcile supply, product retention, evaporation, transfer, and discharge"
      quality_evidence: "Meter calibration; water invoice; line log; water-balance closure"
    - protocol_id: cp_energy_water_finishing
      process_id: "finishing_and_release"
      flow_role: "Finishing water, energy, and utilities"
      record_type: "Meter, bath, equipment-runtime, and test-system record"
      raw_fields: "source or carrier; meter; use; runtime; bath or test line; allocation driver"
      collection_method: "Sub-metered records or documented line calculation"
      unit: "m3; kWh; MJ; utility-specific unit"
      frequency: "Continuous or per shift; monthly reconciliation"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every finishing and testing line"
      aggregation_rule: "Sum by line and allocate under section 7 to accepted output"
      quality_evidence: "Meter or invoice; runtime log; line reconciliation"
    - protocol_id: cp_product_packaging_and_release
