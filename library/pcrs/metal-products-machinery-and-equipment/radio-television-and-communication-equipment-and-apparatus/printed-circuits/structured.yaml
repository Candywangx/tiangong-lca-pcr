      site_scope: "Every included site and receiving treatment system"
      aggregation_rule: "Calculate loads from matched flow and concentration; preserve segregated streams; reconcile treatment input, effluent, sludge, recovery, and stock"
      quality_evidence: "Sampling plan; chain of custody; laboratory QA; meter calibration; treatment reconciliation"
    - protocol_id: cp_waste_and_recovery
      process_id: "all_processes"
      flow_role: "Solid, liquid, hazardous, and recovered residuals"
      record_type: "Container weighing, waste manifest, recycler receipt, sludge analysis, and internal transfer record"
      raw_fields: "source; material; hazardous classification; gross and tare mass; moisture or solids; destination; recovery output; certificate"
      collection_method: "Weighed dispatch and verified destination records"
      unit: "kg; item(s) with supporting mass"
      frequency: "Each transfer; monthly reconciliation"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every included site and contractor"
      aggregation_rule: "Sum net mass by composition and destination; distinguish waste transfer from accepted recovered product"
      quality_evidence: "Calibrated scale; manifest; analysis; recycler or treatment receipt"
    - protocol_id: cp_air_emissions
      process_id: "all_production_processes"
      flow_role: "Air emissions after controls"
      record_type: "Stack test, continuous monitor, material balance, operating hours, and permit calculation"
      raw_fields: "source; substance; flow; concentration; control efficiency; operating hours; method"
      collection_method: "Measurement preferred; otherwise documented method using foreground activity data"
      unit: "kg substance; concentration-specific unit"
      frequency: "Per regulatory and process-representative schedule"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every material emission source"
      aggregation_rule: "Calculate released mass after controls and allocate by causal operation"
      quality_evidence: "Test report; monitor QA; method reference; control operating record"
  calculation_rules:
    - id: calc_reference_output
      applies_to: "Accepted product"
      rule: "Sum accepted finished printed-circuit net mass after final test and inspection, excluding packaging, coupons, rails, and rejects."
      inputs:
        - "Lot release and calibrated scale records"
      output: "kg accepted net product"
      source_ids: []
    - id: calc_material_consumption
      applies_to: "Each purchased material"
      rule: "Opening stock + purchases + internal receipts - closing stock - documented return; assign by traced batch or the section 7 allocation rule."
      inputs:
        - Stock
        - purchase
        - issue
        - return
        - "and batch records"
      output: "kg or m2 material per kg accepted product"
      source_ids: []
    - id: calc_chemical_consumption
      applies_to: "Each process formulation or constituent"
      rule: "Reconcile opening bath and stock, make-up, additions, internal recovery, bail-out, closing inventory, transfers, and disposal; convert solution to constituent mass using documented concentration."
      inputs:
        - Bath
        - dosing
        - stock
        - "and analysis records"
      output: "kg formulation and kg constituent per kg accepted product"
      source_ids:
        - us-epa-pwb-surface-finishes
    - id: calc_makeup_water
      applies_to: "Water use"
      rule: "Make-up water supplied from each source; report recirculated water separately and do not add internal recirculation to net withdrawal."
      inputs:
        - "Source meters"
        - "line meters"
        - "tank and recycle records"
      output: "m3 make-up water per kg accepted product"
      source_ids:
        - ifc-electronics-ehs-2007
    - id: calc_energy
      applies_to: "Each energy carrier"
      rule: "Sum metered carrier use for included operations, subtract documented unrelated use, and apply the section 7 allocation driver."
      inputs:
        - Meter
        - invoice
        - runtime
        - "and production records"
      output: "kWh, MJ, or carrier unit per kg accepted product"
      source_ids: []
    - id: calc_stage_yield
      applies_to: "Each production stage"
      rule: "Accepted output quantity divided by input quantity on a consistent mass, area, or item basis; retain rework and reject disposition."
      inputs:
        - "Batch route"
        - transfer
        - "and reject records"
      output: "Stage yield and loss by declared route"
      source_ids: []
    - id: calc_wastewater_load
      applies_to: "Each wastewater constituent"
      rule: "Matched discharge or transfer volume multiplied by representative measured concentration; sum by stream and reporting period before normalization."
      inputs:
        - "Flow and laboratory records"
      output: "kg constituent per kg accepted product"
      source_ids:
        - us-epa-pwb-surface-finishes
        - ifc-electronics-ehs-2007
    - id: calc_material_balance
      applies_to: "Product, metals, and treatment system"
      rule: "For each selected balance domain, inputs + opening stock = accepted product + recoveries + waste + releases + closing stock; report absolute and relative unresolved difference."
      inputs:
        - Material
        - product
        - stock
        - waste
        - recovery
        - wastewater
        - "and emission records"
      output: "Reconciliation and unresolved balance by material"
      source_ids:
        - us-epa-pwb-surface-finishes
    - id: calc_normalization
      applies_to: "All inventory rows"
      rule: "Divide the allocated reporting-period quantity by accepted net product mass from calc_reference_output."
      inputs:
        - "Allocated quantity"
        - "accepted net product mass"
      output: "Inventory quantity per 1 kg accepted finished printed circuits"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Product and reference flow"
      requirement: "Preserve drawing revision, construction, stack-up, substrate, layer count, conductor and interconnect specification, surface finish, acceptance class, and net-mass convention for every represented product family."
      evidence: "Released specifications, route travellers, BOMs, and lot traceability"
    - id: dq_technological
      applies_to: "Process route"
      requirement: "Data shall represent the declared additive, semi-additive, subtractive, or mixed route and the actual hole, plating, etching, mask, finish, test, and control technologies."
      evidence: "Process map, equipment list, bath list, and production records"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 representative consecutive months when continuous production exists; for campaign or new production, cover the full campaign and disclose its limitations."
      evidence: "Dated records and coverage statement"
    - id: dq_geographical
      applies_to: "Site and upstream data"
      requirement: "Identify every production and outsourced site and match electricity, water, transport, treatment, and material datasets to the represented geography where feasible."
      evidence: "Site list, supplier and contractor records, dataset metadata"
    - id: dq_measurement
      applies_to: "Mass, water, energy, concentration, and emission records"
      requirement: "Use calibrated or verified instruments and retain sampling, detection-limit, conversion-factor, and laboratory QA information."
      evidence: "Calibration certificates, sampling plan, laboratory QA, meter reconciliation"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Cover all required process stages and all known material, chemical, energy, water, transport, waste, recovery, and emission flows; unresolved items shall be disclosed rather than silently omitted."
      evidence: "Completeness checklist and material, water, and metal balance"
    - id: dq_allocation
      applies_to: "Shared operations"
      requirement: "Document the causal allocation driver, coverage, numerator, denominator, and sensitivity for each shared operation or combined treatment system."
      evidence: "Allocation workbook and sensitivity record"
    - id: dq_upstream_proxies
      applies_to: "Linked datasets"
      requirement: "Record provider, geography, technology, time, version, representativeness, and proxy rationale for each linked upstream or treatment dataset."
      evidence: "Dataset registry and proxy log"
    - id: dq_outsourced_operations
      applies_to: "Outsourced manufacturing or treatment"
      requirement: "Obtain primary activity records or supplier-specific datasets for material outsourced stages; otherwise disclose the proxy and uncertainty."
      evidence: "Supplier data, treatment receipt, audit, or documented proxy"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "Product identity"
    rule: "Fail unless the product is an unpopulated printed circuit and the required construction, material, layer, route, finish, quality, geography, period, and boundary qualifiers are declared; reject PCBA, component, laminate-only, equipment, and waste-board substitutions."
    source_ids:
      - ifc-electronics-ehs-2007
      - us-epa-pwb-surface-finishes
  - rule_id: validate_reference_flow
    applies_to: "Quantitative reference"
    rule: "Require exactly 1 kg accepted net output using Printed circuits b230e7cd-7afd-4398-84bd-71beab1f6626, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200b9a66, and unit kg; packaging and production residues shall be separate."
    source_ids: []
  - rule_id: validate_route_boundary
    applies_to: "Process map and boundary"
    rule: "Require every applicable operation in boundary_required_manufacturing, an explicit not-applicable declaration for route steps not used, and separate exclusion of PCBA and downstream equipment stages."
    source_ids:
      - us-epa-pcb-p2-1990
      - us-epa-pwb-surface-finishes
      - ifc-electronics-ehs-2007
  - rule_id: validate_intermediate_links
    applies_to: "Foreground stage transfers"
    rule: "Require prepared, conditioned, and patterned panel transfers to reconcile between adjacent foreground stages without duplicate upstream burdens."
    source_ids: []
  - rule_id: validate_material_and_yield
    applies_to: "Material balance and output"
    rule: "Require accepted product mass, stage yields, material inputs, rejects, residues, recoveries, and unresolved mass-balance difference on one reporting period and declared normalization basis."
    source_ids:
      - us-epa-pwb-surface-finishes
  - rule_id: validate_chemicals_and_metals
    applies_to: "Wet-process inventory"
    rule: "Require formulation, concentration, bath make-up, additions, bail-out or disposal, metal incorporation, recovery, and treatment records for every applicable imaging, plating, etching, and finishing line."
    source_ids:
      - us-epa-pcb-p2-1990
      - us-epa-pwb-surface-finishes
  - rule_id: validate_water_and_wastewater
    applies_to: "Water and effluent"
    rule: "Require source-separated make-up water, internal recirculation disclosure, contact and non-contact separation, wastewater volume, relevant constituent loads, treatment route, effluent, and sludge reconciliation."
    source_ids:
      - us-epa-pwb-surface-finishes
      - ifc-electronics-ehs-2007
  - rule_id: validate_energy
    applies_to: "Energy and utilities"
    rule: "Require carrier-separated electricity, heat, fuel, and material utility records and a documented allocation driver for shared systems."
    source_ids:
      - ifc-electronics-ehs-2007
  - rule_id: validate_waste_recovery_emissions
    applies_to: "Residuals and releases"
    rule: "Require wastes by composition and destination, verified recovered outputs, sludge and spent-bath records, and substance- and compartment-specific air, water, and soil releases where applicable."
    source_ids:
      - us-epa-pcb-p2-1990
      - us-epa-pwb-surface-finishes
      - ifc-electronics-ehs-2007
  - rule_id: validate_allocation
    applies_to: "Multi-product and shared operations"
    rule: "Require allocation avoidance where feasible, a causal driver for every shared operation, inclusion of normal reject burdens in accepted output, and no simultaneous allocation and substitution credit for the same recovered amount."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_data_quality
    applies_to: "Dataset package"
    rule: "Require protocol coverage, temporal and site coverage, calibration and laboratory evidence, upstream dataset and proxy disclosure, allocation documentation, and a list of unresolved completeness items."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Product-specific foreground printed-circuit manufacturing dataset normalized to 1 kg accepted net unpopulated printed circuits"
  downstream_use: "secondary_dataset; background_dataset; input to downstream process or lifecyclemodel records for PCB assembly, electronic components, equipment, or other products"
  allowed_use: "Product footprint, LCA, supply-chain inventory, ecodesign, procurement, and hotspot analysis when construction, route, geography, time, quality, and boundary match the intended use"
  excluded_use: "Generic representation of PCBAs, mounted components, semiconductor manufacture, all printed circuits regardless of construction or route, waste treatment, or comparative assertions when reference-flow qualifiers, boundaries, and data quality are not equivalent"
  required_metadata: "Canonical PCR id and version; product drawing family; rigid, flexible, or rigid-flex construction; substrate and resin system; stack-up and layer count; thickness; copper weight and conductor density; interconnect technology; surface finish; solder mask; halogen and flame-retardant declaration; acceptance class; site and geography; reporting period; panel utilization and yield; route; included processes; allocation; linked datasets; net-mass convention"
  required_quality_disclosure: "Primary-data share; temporal and site coverage; calibration and laboratory QA; stage yield and material-balance closure; water and wastewater reconciliation; chemical and bath coverage; air-emission method; waste and recovery destinations; allocation drivers; outsourced-stage coverage; proxy and missing-flow list; uncertainty limitations"
  update_trigger: "Material change in construction, substrate, stack-up, layer count, conductor density, via technology, additive or subtractive route, plating or etching chemistry, surface finish, solder mask, site, electricity or water supply, wastewater or air controls, panel utilization, yield, allocation, supplier dataset, or reporting period; or correction of a referenced Tiangong identity"
