      collection_method: "Batch and line logs reconciled to purchase and stock records"
      unit: "kg; m3; concentration-specific unit"
      frequency: "Each addition or disposal; monthly reconciliation"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every wet-process line"
      aggregation_rule: "Opening inventory + purchases + internal returns - closing inventory - disposal - documented losses, assigned to line and product family"
      quality_evidence: "Supplier SDS or specification; bath analysis; calibrated dosing record; inventory reconciliation"
    - protocol_id: cp_energy_and_utilities
      process_id: "material_preparation_hole_and_surface_preparation_conductor_formation"
      flow_role: "Electricity, heat, fuels, and utilities"
      record_type: "Meter, fuel, equipment-runtime, and utility invoice record"
