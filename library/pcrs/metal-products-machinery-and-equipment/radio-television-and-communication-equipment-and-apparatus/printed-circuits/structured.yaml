  - id: panel_to_product_conversion
    applies_to: "Panel-, area-, or item-based production records"
    required_property_ref:
      name: "Mass and measured area or item count"
      uuid: ""
    required_unit: "kg; m2; item(s)"
    rule: "Convert panel, area, and item records to the mass reference using measured accepted-product mass and the actual panel map for the declared product family and lot. Do not use a generic areal density or board mass when a product-specific measurement is available."
