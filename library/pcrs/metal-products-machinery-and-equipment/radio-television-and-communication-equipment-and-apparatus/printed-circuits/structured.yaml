allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Multi-product facilities and shared lines"
    rule: "First separate processes, lines, meters, batches, and product-family records so direct inputs, outputs, wastes, and emissions remain assigned to the products that caused them."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_operations
    applies_to: "Shared energy, water, ventilation, baths, testing, and utilities"
    rule: "Use measured causal drivers such as sub-metered consumption, equipment operating time, processed panel area, bath loading, number of test cycles, or contaminant load. Mass-only allocation is permitted only when the shared operation is demonstrated to scale with product mass."
    source_ids:
      - iso-14044-2006
      - us-epa-pwb-surface-finishes
  - rule_id: allocation_yield_and_rejects
    applies_to: "Production losses and rejected boards"
    rule: "Include the burdens of normal scrap, coupons, rails, test failures, and rework in accepted saleable output. Do not remove the burdens of rejected production from the denominator."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_wastewater_treatment
    applies_to: "Combined wastewater and sludge treatment"
    rule: "Allocate by measured stream volume and pollutant load or other treatment-driving characteristics. Do not allocate chemically dissimilar streams by volume alone when contaminant loading materially differs."
    source_ids:
      - us-epa-pwb-surface-finishes
      - ifc-electronics-ehs-2007
  - rule_id: allocation_recovered_materials
    applies_to: "Copper and other recovered materials"
    rule: "Prefer subdivision and direct mass accounting. If a recovered material is treated as a co-product or receives a recycling credit, declare the method, point of substitution, quality adjustment, and sensitivity; do not combine allocation and substitution credits for the same recovered amount."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_internal_recycling
    applies_to: "Internal bath, rinse, metal, panel, or material loops"
    rule: "Record internal returns explicitly, but count only make-up inputs and net releases across the foreground boundary. Internal circulation shall not create an avoided-burden credit."
    source_ids:
      - us-epa-pcb-p2-1990
      - us-epa-pwb-surface-finishes
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity_and_output
      process_id: "finishing_and_release"
      flow_role: "Product identity and accepted output"
      record_type: "Specification, route traveller, test record, scale record, release record"
      raw_fields: "product code; drawing revision; construction; stack-up; material system; thickness; copper weight; panel map; interconnect technology; surface finish; solder mask; acceptance class; accepted net mass; packaging mass; lot"
      collection_method: "Controlled production and release records linked to calibrated weighing"
      unit: "kg; m2; item(s)"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the full campaign for seasonal or campaign production"
      site_scope: "Every included site and outsourced operation"
      aggregation_rule: "Sum accepted net mass by declared product family; retain lot-level qualifiers and exclude packaging"
      quality_evidence: "Calibration record; released specification; lot traceability; electrical and dimensional acceptance evidence"
    - protocol_id: cp_material_bom_and_stock
      process_id: "material_preparation"
      flow_role: "Material inputs"
      record_type: "BOM, purchase, stores issue, return, and stock record"
