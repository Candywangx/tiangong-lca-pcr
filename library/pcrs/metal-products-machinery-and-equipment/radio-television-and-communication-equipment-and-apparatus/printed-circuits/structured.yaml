      temporal_coverage: "Same period as accepted output"
      site_scope: "Every included site"
      aggregation_rule: "Opening stock + purchases - closing stock - documented returns, assigned to product family and normalized to accepted output"
      quality_evidence: "Supplier specification; stock ledger; BOM revision; material lot traceability"
    - protocol_id: cp_batch_route_yield
      process_id: "all_production_processes"
