  calculation_rules:
    - id: normalization
      applies_to: "all inventory rows"
      rule: "Divide attributable external period quantity by measured accepted net output D in kg; reference output = 1 kg. Correct stocks, cancel internal transfers and attribute actual rejects/rework before dividing."
      inputs:
        - cp_reference_part
        - "row-specific protocol"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: balance_check
      applies_to: "material inventory"
      rule: "For each actual constituent, reconcile external input plus opening stock against accepted part content, rejects, recovered material, releases and closing stock on matching dry/wet and assay basis. Gross paste or alloy mass is not Ag/Pd/Ni/Cr content. Include reaction/volatile loss and work in progress; cancel paired internal transfers. Report residual and measurement uncertainty; no invented closure tolerance."
      inputs:
        - "Composition certificates/assays"
        - stock
        - waste
        - "measured releases"
      output: "Constituent residual and uncertainty"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity"
      rule: "Metered kWh × 3.6 = MJ if a verified downstream flow requires MJ; do not infer a generation technology or substitute factory fuel for grid supply."
      inputs:
        - "Meter/unit property chain"
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference_part"
      requirement: "part number/drawing/revision; dedicated host non-heating resistor and function; delivered completion state; element, substrate, wiper, terminal, cap or body family; dimensions/net mass; alloy, ceramic, polymer and coating grade/composition; resistance/taper/TCR or contact/insulation requirement as applicable; acceptance test conditions; make/buy operations and received state; site, supplier geography, period; yield/rework; packaging"
      evidence: "Part order/drawing, dedicated host interface and supplier completion records"
    - id: coverage
      applies_to: "all rows"
      requirement: "Record present, not applicable with evidence, measured zero or unknown distinctly. Additional actual chemicals need atomic cards. No missing-as-zero and no generic flow substitution."
      evidence: "review_metadata"
    - id: range
      applies_to: "all rows"
      requirement: "No factory intensity, yield, recipe, item weight, lifetime or GWP default established; collect foreground quantities and uncertainty, seek independent compatible empirical ranges."
      evidence: "Foreground measurements and source applicability"
validation_rules:
  - rule_id: validate_part
    applies_to: "reference_part"
    rule: "Verify dedicated non-heating host, exact delivered state, measured positive D and acceptance; electrical function alone is insufficient to decide part versus finished device."
    source_ids:
      - nolelc-elements
      - un-cpc-resistors
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Check 1 kg net reference, every protocol aggregation on the same basis, raw-unit conversion, every measured mass/property link and constituent balance."
    source_ids: []
  - rule_id: validate_complete
    applies_to: "dataset"
    rule: "Require actual make/buy coverage, all atomic exchanges, provider conditions, supplier burdens once, waste destination and post-control species/compartment. Unknown quantity, unresolved mandatory UUID or unverified unit/property blocks complete dataset; candidate methodology check is not dataset acceptance or conformance certification."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Drawing/state-specific part manufacture and supplier linkage for downstream resistor data production"
  excluded_use: "Whole resistor or sensor footprints; heating applications; electrical service comparisons by kg; full lifecycle claim without scenario"
  required_metadata: "part number/drawing/revision; dedicated host non-heating resistor and function; delivered completion state; element, substrate, wiper, terminal, cap or body family; dimensions/net mass; alloy, ceramic, polymer and coating grade/composition; resistance/taper/TCR or contact/insulation requirement as applicable; acceptance test conditions; make/buy operations and received state; site, supplier geography, period; yield/rework; packaging"
  required_quality_disclosure: "Scope, route, supplier/linkage gaps, actual chemistry, unresolved identity/ranges, normalization, allocation, uncertainty and waste fate"
  update_trigger: "Drawing, host application, completion state, recipe, process/supplier, acceptance or meter boundary changes"
data_sources:
  - id: "un-cpc-resistors"
    type: "official_guidance"
    reference: "UNSD CPC3.0 subclass47120 and47172. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/47120 ; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/47172"
    used_for: "Classification context excludes heating resistors; classification alone does not establish part identity or inventory."
  - id: "nolelc-elements"
    type: "extension_guidance"
    reference: "NOLELC, Resistive Elements for Potentiometers and Sensors, public page retrieved2October2026. https://nolelc.com/resistance-elements-thick-film-pcb/"
    used_for: "Separately supplied carbon-film, conductive-plastic and cermet tracks; print/fire, trim and conditional co-molding. Sensor applications are not automatic resistor-part coverage; no marketing lifetime or temperature defaults adopted."
  - id: "nolelc-wipers"
    type: "extension_guidance"
    reference: "NOLELC, Precious metal Multi-Wire Wipers. https://nolelc.com/precious-metal-brusheswipers/"
    used_for: "Separate multi-wire wipers; Palliney-6 is an alloy example, not every wiper recipe; slip-ring and motor-brush applications excluded."
  - id: "cts-wipers"
    type: "extension_guidance"
    reference: "CTS, VR Series Panel Potentiometers for Instrumentation,18October2023, How does a panel potentiometer work. https://www.ctscorp.com/Resources/Blog/VR-Series-Panel-Potentiometers-for-Instrumentation"
    used_for: "Independent construction evidence: printed track and stamped phosphor-bronze/nickel-silver or formed-wire welded wipers. Finished-device source supports bounded part operations only."
  - id: "nolelc-housings"
    type: "extension_guidance"
    reference: "NOLELC, Potentiometer Housing Materials and Cost,3September2026. https://nolelc.com/potentiometer-housing-materials-and-cost/"
    used_for: "Actual housing alternatives: machined/stamped metal, ABS/PI molding, phenolic body, ceramic forming/firing; substrate/finish grades must come from drawing."
  - id: "seiwa-caps"
    type: "extension_guidance"
    reference: "Seiwa Metal Works, Fixed Resistor Caps, production equipment. https://www.seiwagrp.co.jp/product/caps/"
    used_for: "Dedicated caps for carbon/metal/metal-oxide film resistors; pressing, barrel finishing and compressed air; source does not identify cap metal grade."
  - id: "hongyi-rheostat-parts"
    type: "extension_guidance"
    reference: "Hongyi Electronics, Slide Rheostat, replacement parts FAQ. https://resistor-factory.com/products/rheostat"
    used_for: "Externally supplied replacement sliders, end clamps and ceramic tubes, plus tube rewinding; laboratory/motor-control context. Stock resistance wire alone is feedstock."
  - id: "vishay-technologies"
    type: "handbook"
    reference: "Vishay, Resistors101, VMN-SG2113-1205, pages2 and7. https://www.vishay.com/docs/49873/49873_sg2113.pdf"
    used_for: "Fixed versus variable device context; bounded wirewound, sputtered NiCr/TaN, printed oxide, foil/composition alternatives. Finished-resistor construction does not require every part to receive all operations."
  - id: "vishay-substrates"
    type: "handbook"
    reference: "Vishay, Custom Resistor Arrays, document60058 revision27-Feb-2001, page1 Patterned Substrates. https://www.vishay.com/docs/60058/custarra.pdf"
    used_for: "Alumina patterned substrates, gold/nickel metallization, optional passivation and trimming. A complete bare resistor network or generic hybrid circuit is not automatically a dedicated part."
  - id: "heraeus-r400ar"
    type: "extension_guidance"
    reference: "Heraeus Electronics, R400AR Series product selector, description/paste properties/processing. https://www.heraeus-electronics.com/de/products-and-solutions/thick-film-materials/thick-film-materials-overview/tfm-ps-detail/R400AR%20Series/"
    used_for: "Specific AgPd resistor paste printed on alumina, dried, air-fired and laser-trimmable; grade-specific settings are not universal factory energy, composition or process-temperature defaults. Heater/fuse applications excluded."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation(EU)2021/2279,AnnexI4.5. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "General subdivision/system-expansion and physical-relationship allocation hierarchy; no full PEF compliance claimed."
