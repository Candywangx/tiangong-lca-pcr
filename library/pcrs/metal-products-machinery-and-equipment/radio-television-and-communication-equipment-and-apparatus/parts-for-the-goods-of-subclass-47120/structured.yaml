allocation_rules:
  - rule_id: allocate_subdivision
    applies_to: "shared site"
    rule: "First investigate subdivision or system expansion. For a part production dataset prefer process/submeter subdivision; expanded-system results cannot be claimed as a single part footprint. If subdivision is infeasible use demonstrated causal driver (actual machine time/energy, furnace load by route), not arbitrary equal sharing."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocate_products
    applies_to: "co-products"
    rule: "If physical relationship is unsupported, justify other allocation and sensitivity. Do not default to mass for unlike costly precious-metal parts. Record exported scrap treatment and allocation convention; no automatic avoided-primary-metal credit. Rejects/rework remain in accepted output burden."
    source_ids:
      - ef-allocation-2021
