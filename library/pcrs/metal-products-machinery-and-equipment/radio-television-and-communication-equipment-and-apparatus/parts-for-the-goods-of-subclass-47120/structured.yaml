functional_unit:
  what: "Supply a specified intermediate part to a non-heating electrical resistor, declared production unit"
  how_much: "1 kg accepted net part of one drawing and completion state, excluding packaging"
  how_well: "Meet actual dimensional, resistance/taper/contact/insulation and host-fit acceptance requirements as applicable"
  how_long_or_cycle: "One factory production/release cycle; no imposed use lifetime or resistor energy-loss claim"
  reference_flow_link: "reference_part"
system_boundary:
  rules:
    - rule_id: boundary_make_buy
      applies_to: "all processes"
      rule: "For each part, declare made, bought, outsourced, not applicable or unknown for each operation. Purchased completed part input includes supplier materials and operations; do not also add its embedded BOM as fresh factory inputs."
      source_ids:
        - nolelc-elements
        - seiwa-caps
    - rule_id: boundary_process
      applies_to: "foreground"
      rule: "Include every actual route to shipped part, service, rework, rejects and control. Add each actual ancillary binder, conductor paste, photoresist, developer, etchant, plating salt, oil, passivation resin, gas or waste as its own chemical/grade-specific card with measurement before dataset completion; never presume dry processing or hide unknown chemistry as zero."
      source_ids:
        - vishay-technologies
        - nolelc-housings
    - rule_id: boundary_use
      applies_to: "downstream"
      rule: "Exclude host-resistor assembly, installed use/electrical dissipation and final end of life; include factory test electricity and test rejects. These are not a use-stage scenario."
      source_ids:
        - cts-wipers
    - rule_id: boundary_emissions
      applies_to: "utilities"
      rule: "Supplier-grid and outsourced waste-treatment emissions remain upstream, not duplicate factory emissions; measure actual post-control species/compartments and separate in-house treatment inputs, sludge and final discharges."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual powder/stock/former/paste or purchased dedicated part in measured received state"
  starting_condition_role: "Documented foreground entry, not burden-free origin"
  product_classification_scope: "Dedicated parts of non-heating electrical resistors; actual scope independent of leaf label"
  recursive_input_rule: "Use upstream supplier dataset for purchased same-category part in declared state, with no self-referential recursion"
  upstream_dataset_requirement: "Cover actual material manufacture, forming/firing/deposition/plating and transport exactly once; outsourced processing remains linked"
  disclosure: "Make/buy matrix by operation; received/delivered states; upstream gaps, supplier conditions and site-only versus linked cradle-to-gate claim"
