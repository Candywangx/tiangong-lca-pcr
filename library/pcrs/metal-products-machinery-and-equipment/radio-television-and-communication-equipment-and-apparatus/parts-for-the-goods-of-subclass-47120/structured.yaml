    applies_to: "count records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use measured batch-sample net item mass with traceable count, scale resolution, sample coverage and uncertainty; no catalogue or invented item mass."
  - id: composition_basis
    applies_to: "paste/alloy/ceramic/residue"
    required_property_ref:
      name: "Mass and assayed content"
      uuid: ""
    required_unit: "kg"
    rule: "For each actual constituent, reconcile external input plus opening stock against accepted part content, rejects, recovered material, releases and closing stock on matching dry/wet and assay basis. Gross paste or alloy mass is not Ag/Pd/Ni/Cr content. Include reaction/volatile loss and work in progress; cancel paired internal transfers. Report residual and measurement uncertainty; no invented closure tolerance."
process_map:
  - id: receipt
    name: "Dedicated purchased part receipt"
    inclusion: "required"
    inclusion_condition: "Declare actual feed state and make/buy matrix; a purchased finished part only needs receipt, release and actual finishing here."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: ceramic
    name: "Ceramic substrate or body manufacture"
    inclusion: "conditional"
    inclusion_condition: "Only when powder forming, firing, cutting/grinding occur on site; purchased fired ceramic carries these upstream operations."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: track
    name: "Printed or molded resistive track"
    inclusion: "conditional"
    inclusion_condition: "Actual carbon/polymer printing and curing, cermet printing/drying/firing, or conductive-plastic co-molding; distinct recipes and meters."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: film
    name: "Thin film, foil or deposited element fabrication"
    inclusion: "conditional"
    inclusion_condition: "Actual deposition, patterning, metallization, passivation and trimming only to shipped part completion; no assumed finished-device assembly."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: wire
    name: "Wirewound element manufacture"
    inclusion: "conditional"
    inclusion_condition: "Cut and wind specified resistance wire on declared former; connect only delivered element terminals; hybrid stripe printing also activates track."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: metal
    name: "Wiper, cap, terminal and metal body manufacture"
    inclusion: "conditional"
    inclusion_condition: "Drawing-specific stamping, cutting/forming, machining, barrel finishing and welded multi-wire contacts; surface treatment make/buy separately declared."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: polymer
    name: "Insulating polymer body manufacture"
    inclusion: "conditional"
    inclusion_condition: "Actual ABS injection molding, PI processing, or phenolic compression molding/machining; no pooled plastic recipe."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: release
    name: "Part qualification and packaging"
    inclusion: "required"
    inclusion_condition: "Inspect and test actual part, exclude destructive-test rejects from accepted output; then package."
    role: "foreground_production"
    quantitative_reference: "1 kg selected accepted part"
  - id: utilities
    name: "Utilities, cleaning and environmental controls"
    inclusion: "required"
    inclusion_condition: "Attribute process/service electricity and actual cleaning, furnace fuels, gas, water, extraction and treatment; route absence requires evidence."
    role: "foreground_production"
