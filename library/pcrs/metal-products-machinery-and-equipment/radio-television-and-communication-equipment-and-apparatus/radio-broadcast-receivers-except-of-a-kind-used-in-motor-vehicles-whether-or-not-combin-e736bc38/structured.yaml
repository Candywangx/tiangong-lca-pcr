allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared production, utilities, testing, rework, and waste treatment"
    rule: "Prefer direct metering and subdivision by product family, line, batch, or test station so allocation is avoided."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared inputs and outputs"
    rule: "Allocate by a documented causal physical driver such as machine time, test duration, direct energy, accepted unit count, or mass; justify why the driver reflects resource use."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Shared operation without a defensible physical driver"
    rule: "Use economic allocation only as a disclosed fallback, state prices and reference period, and report sensitivity for materially affected results."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_rework_scrap
    applies_to: "Rework, rejects, and recyclable manufacturing scrap"
    rule: "Attribute rework and rejection burdens to the production that generated them; report scrap mass and treatment separately and do not subtract revenue or recovered mass from input quantities."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_end_of_life
    applies_to: "Reuse, recycling, recovery, and disposal"
    rule: "State the selected end-of-life allocation or substitution approach, keep burdens and credits consistent across material streams, and prevent double counting between the product system and recovered-material users."
    source_ids:
      - eu-recommendation-2021-2279
      - eu-directive-2012-19-weee
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity_and_configuration
      process_id: "final_assembly"
      flow_role: "product identity and required qualifiers"
      record_type: "product master and technical record"
      raw_fields: "model or family; CPC code; bands and frequency ranges; modulation and digital systems; form; power sources; battery; speaker; display; clock; recording or playback; tuner; antenna; net mass"
      collection_method: "Controlled extraction from approved product specification and configuration bill"
      unit: "text; kg"
      frequency: "Each model or configuration change"
      temporal_coverage: "Current production declaration"
      site_scope: "Each represented model and site"
      aggregation_rule: "Preserve configuration-specific fields; production-weight only models explicitly combined"
      quality_evidence: "Approved specification; configuration bill; responsible-person sign-off"
    - protocol_id: cp_component_bom_mass
      process_id: "electronics_assembly_final_assembly"
      flow_role: "components and material composition"
      record_type: "bill of materials and supplier declaration"
      raw_fields: "part number; component role; material; supplier; mass; quantity; recycled content if claimed; battery chemistry and capacity"
      collection_method: "Reconcile engineering BOM, measured sample masses, purchase records, and supplier declarations"
      unit: "kg"
      frequency: "Each BOM revision; reconcile per reporting period"
      temporal_coverage: "Same period as production or documented current BOM"
      site_scope: "Each represented site and product configuration"
      aggregation_rule: "Multiply verified unit masses by accepted production; keep PCB, enclosure, packaging, battery, power supply, loudspeaker, display, and optional modules distinct"
      quality_evidence: "Approved BOM; scale records; supplier material declaration"
    - protocol_id: cp_factory_energy
      process_id: "electronics_assembly_final_assembly_packaging"
      flow_role: "energy and utilities"
      record_type: "meter, invoice, and production log"
      raw_fields: "meter identifier; start and end readings; fuel or utility type; dates; line hours; accepted output; allocation driver"
      collection_method: "Prefer submetering; reconcile submeters to site invoices and production records"
      unit: "kWh; MJ; kg as applicable"
      frequency: "Monthly or each production campaign"
      temporal_coverage: "Representative continuous period, normally at least one production campaign"
      site_scope: "Each represented facility and outsourced step"
      aggregation_rule: "Sum valid readings, subtract documented non-product loads, then allocate under section 7"
      quality_evidence: "Calibration record; invoices; meter logs; production reconciliation"
    - protocol_id: cp_scrap_and_emissions
      process_id: "electronics_assembly_final_assembly_functional_test_packaging"
      flow_role: "scrap, waste, rework, and direct emissions"
      record_type: "weigh ticket, waste transfer record, rework log, monitoring record"
      raw_fields: "material or substance; hazard class; mass; compartment; destination; rework return; date"
      collection_method: "Weigh streams where practicable; use documented mass balance or permitted factor when direct measurement is unavailable"
      unit: "kg"
      frequency: "Each shipment or reporting interval"
      temporal_coverage: "Same period as production"
      site_scope: "Each represented facility"
      aggregation_rule: "Sum by material, hazard class, environmental compartment, and destination; keep rework separate"
      quality_evidence: "Weigh tickets; transfer notes; monitoring and calculation worksheets"
    - protocol_id: cp_output_mass
      process_id: "electronics_assembly_final_assembly"
      flow_role: "accepted output"
      record_type: "production and mass record"
      raw_fields: "units accepted; sampled unit mass; rejected units; net output mass; model mix"
      collection_method: "Calibrated scale measurements reconciled to production counts"
      unit: "kg"
      frequency: "Each lot or statistically justified sampling plan"
      temporal_coverage: "Same period as production"
      site_scope: "Each represented line and product configuration"
      aggregation_rule: "Accepted count multiplied by verified unit mass, or direct bulk mass; retain model-specific values before production weighting"
      quality_evidence: "Scale calibration; sampling plan; production release record"
    - protocol_id: cp_power_mode_test
      process_id: "functional_test"
      flow_role: "playback, standby, off, networked standby, and auto power-down"
      record_type: "laboratory or production test record"
      raw_fields: "model; power source; band; modulation; signal; audio output or volume; loudspeaker; display; clock; recording state; battery or charge state; stabilization; mode; W; duration; ambient conditions"
      collection_method: "Measure active audio modes following IEC 62087-6 and non-active modes following IEC 62301 at the declared power interface"
      unit: "W"
      frequency: "Each represented model and firmware or hardware change affecting power"
      temporal_coverage: "Current marketed configuration"
      site_scope: "Each represented configuration and applicable supply voltage"
      aggregation_rule: "Retain readings by mode; calculate a mean only across valid replicate measurements under the same declared state"
      quality_evidence: "Test method; calibrated power meter record; raw time series; configuration photograph or log"
    - protocol_id: cp_packaging_bom
      process_id: "packaging"
      flow_role: "packaging materials"
      record_type: "packaging specification and shipment record"
      raw_fields: "material; layer or role; unit mass; units per receiver; reusable cycles if claimed; shipped units"
      collection_method: "Weigh packaging components and reconcile to purchase and shipment records"
      unit: "kg"
      frequency: "Each packaging revision; reconcile per reporting period"
      temporal_coverage: "Same period as shipment"
      site_scope: "Each represented product configuration"
      aggregation_rule: "Sum material masses per shipped receiver and report primary, secondary, and allocated tertiary packaging separately"
      quality_evidence: "Packaging specification; scale record; purchase and shipment reconciliation"
    - protocol_id: cp_use_scenario
      process_id: "use_phase_operation"
      flow_role: "lifetime energy and battery replacement"
      record_type: "scenario and measured power record"
      raw_fields: "service life; hours by mutually exclusive mode; measured W by mode; grid region; charge efficiency; battery chemistry; capacity; replacement count"
      collection_method: "Combine product-specific power tests with a documented geographically relevant use scenario"
      unit: "h; W; kWh; kg"
      frequency: "Each study and material design or market change"
      temporal_coverage: "Declared scenario reference year and service life"
      site_scope: "Declared market geography"
      aggregation_rule: "Calculate by section 8 formulas; scenario-weight only documented user segments"
      quality_evidence: "Scenario source; power test record; calculation workbook; sensitivity cases"
    - protocol_id: cp_end_of_life_scenario
      process_id: "end_of_life"
      flow_role: "treatment routes and outputs"
      record_type: "regional scenario and treatment dataset"
      raw_fields: "collection share; reuse; recycling; recovery; disposal; battery removal; material outputs; residual wastes; geography; year"
      collection_method: "Map receiver, battery, and packaging masses to documented regional treatment routes"
      unit: "kg; fraction"
      frequency: "Each study and regulatory or treatment change"
      temporal_coverage: "Declared scenario reference year"
      site_scope: "Declared market geography"
      aggregation_rule: "Route shares sum to one for each stream; preserve treatment outputs and residuals"
      quality_evidence: "Official statistics or treatment records; selected dataset metadata; mass-balance worksheet"
  calculation_rules:
    - id: calc_bom_normalization
      applies_to: "PCB or PCBA, enclosure, loudspeaker, display, clock or recording module, battery, power supply, accessories, and packaging"
      rule: "Sum verified unit mass multiplied by accepted unit count, then divide by net accepted receiver mass; report packaging separately."
      inputs:
        - "unit mass"
        - quantity
        - "accepted units"
        - "net output mass"
      output: "kg component or packaging per kg finished receiver"
      source_ids:
        - iec-82474-1-2025
        - eu-recommendation-2021-2279
    - id: calc_factory_energy
      applies_to: "Factory electricity, fuel, and utilities"
      rule: "Subtract documented unrelated loads from reconciled reporting-period use, apply the section 7 allocation driver, and divide by net accepted receiver mass."
      inputs:
        - "meter or invoice use"
        - "excluded loads"
        - "allocation driver"
        - "output mass"
      output: "kWh, MJ, or kg per kg finished receiver"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_mass_balance
      applies_to: "Electronics assembly, final assembly, and packaging"
      rule: "Compare material and component inputs with accepted outputs, separately reported scrap, waste, stored work-in-progress, and measured emissions; investigate rather than force-close material differences."
      inputs:
        - "input masses"
        - "output mass"
        - scrap
        - waste
        - "stock change"
        - emissions
      output: "disclosed process mass-balance difference and reconciliation status"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_mode_energy
      applies_to: "Use-phase electricity"
      rule: "For mutually exclusive modes, lifetime electricity at the measured interface equals the sum of mode power in W multiplied by declared lifetime hours, divided by 1000; divide by net receiver mass for the PCR reference basis. Treat charging losses consistently and do not also count energy embedded in disposable batteries as grid electricity."
      inputs:
        - "measured W by mode"
        - "hours by mode"
        - "service life"
        - "charge efficiency where applicable"
        - "net product mass"
      output: "kWh per kg receiver over declared service life"
      source_ids:
        - iec-62087-6-2015
        - iec-62301-2026
        - eu-recommendation-2021-2279
    - id: calc_battery_replacements
      applies_to: "Use-phase batteries"
      rule: "Multiply battery mass and upstream dataset by documented batteries installed initially and replaced during life; count the original battery once in production and once as waste at end-of-life, and count each replacement once as an input and spent-battery output."
      inputs:
        - chemistry
        - "battery mass"
        - "original battery"
        - "replacement count"
        - "service life"
      output: "kg battery input and waste per kg receiver over declared life"
      source_ids:
        - eu-regulation-2023-1542-batteries
        - eu-recommendation-2021-2279
    - id: calc_production_mix
      applies_to: "Multiple models represented by one dataset"
      rule: "Calculate each model-specific inventory first, then weight by accepted net receiver mass produced during the reporting period; do not average configurations with materially different bands, power topology, or integrated functions without disclosure."
      inputs:
        - "model inventory"
        - "accepted mass by model"
        - "configuration qualifiers"
      output: "production-weighted inventory per kg receiver"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_end_of_life
      applies_to: "Receiver, battery, and packaging treatment"
      rule: "Multiply each separately declared discarded mass by route shares that sum to one, then apply the selected treatment datasets and the section 7 end-of-life allocation approach."
      inputs:
        - masses
        - "collection and treatment shares"
        - "treatment datasets"
      output: "treatment inputs, recovered outputs, residual wastes, burdens, and disclosed credits per kg receiver"
      source_ids:
        - eu-directive-2012-19-weee
        - eu-regulation-2023-1542-batteries
        - eu-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_technological
      applies_to: "Product and process representation"
      requirement: "Match the declared bands, modulation or digital systems, form, PCB and tuner design, enclosure, power topology, battery, loudspeaker, display, clock, recording or playback functions, and manufacturing route."
      evidence: "Product specification; BOM revision; process map; supplier dataset metadata"
    - id: dq_geographical
      applies_to: "Electricity, materials, suppliers, use, and end-of-life"
      requirement: "Represent the actual manufacturing and market geographies or disclose every geographic proxy and its likely effect."
      evidence: "Site location; supplier origin; electricity market; scenario and dataset geography"
    - id: dq_temporal
      applies_to: "Foreground records and background datasets"
      requirement: "Use a production period representative of current manufacture and record source years; assess changes in design, firmware, supply chain, electricity, use, and treatment."
      evidence: "Reporting dates; BOM and firmware revision; dataset vintages; update review"
    - id: dq_precision
      applies_to: "Mass, energy, power, scrap, and output measurements"
      requirement: "Retain raw readings, calibration status, sampling and replicate counts, aggregation equations, and unexplained variation; do not replace missing measurements with an undisclosed zero."
      evidence: "Raw records; calibration certificates; sampling plan; calculation workbook"
    - id: dq_completeness
      applies_to: "Entire foreground data package"
      requirement: "Cover PCB or PCBA, enclosure, packaging, and all present battery, external power supply, loudspeaker, display, clock, recording and playback elements, plus standby and playback power; state not applicable with evidence for absent elements."
      evidence: "Completeness checklist; signed configuration record; inventory-to-BOM reconciliation"
    - id: dq_consistency
      applies_to: "Bilingual and machine projection"
      requirement: "Keep stable identifiers, Tiangong UUIDs, units, process and row IDs, rules, protocols, and source IDs aligned between languages and regenerate the structured projection after canonical changes."
      evidence: "Builder lint; structured projection fingerprint; bilingual identifier check"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "Product identity"
    rule: "Fail if radio broadcast reception is not a marketed and testable function, CPC 47311 is not applicable, or the product is a motor-vehicle receiver, television receiver, transmitter, telecommunications receiver, part-only item, or pure audio player."
    source_ids: []
  - rule_id: validate_reference_flow
    applies_to: "Reference flow"
    rule: "Fail unless the reference amount is 1 kg net finished receiver mass using Product flow d85eef63-dec7-4d95-a2b5-546e6cb92224, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: validate_configuration
    applies_to: "Required qualifiers"
    rule: "Fail when bands or frequency ranges, modulation or digital systems, form, power topology, loudspeaker, display, clock, recording or playback functions, net mass, manufacturing geography, and reference year are missing; battery, external power supply, and optional modules must be declared present, absent, or not applicable."
    source_ids:
      - iec-82474-1-2025
  - rule_id: validate_inventory_completeness
    applies_to: "Production inventory"
    rule: "Fail if PCB or PCBA, enclosure, packaging, factory energy, accepted output, scrap or waste, and direct emissions screening are absent; require actual configuration rows for battery, power supply, loudspeaker, display, clock, and recording or playback modules."
    source_ids:
      - iec-82474-1-2025
      - eu-recommendation-2021-2279
  - rule_id: validate_power_modes
    applies_to: "Power testing"
    rule: "Fail if playback or active power and every physically available standby, off, or networked-standby mode lack measured W values and declared test states; do not treat absent modes as measured zero."
    source_ids:
      - iec-62087-6-2015
      - iec-62301-2026
  - rule_id: validate_eu_power_claim
    applies_to: "EU regulatory conformity claim"
    rule: "When the dataset makes an EU Regulation 2023/826 conformity claim, validate the applicable product scope, dates, mode definitions, limits, information requirements, and amendments against the regulation version in force for the placed-on-market date; otherwise report this check as not applicable."
    source_ids:
      - eu-regulation-2023-826
  - rule_id: validate_mass_balance
    applies_to: "Production processes"
    rule: "Fail when input, output, scrap, waste, stock-change, and emission records cannot be reconciled within a site-defined and disclosed measurement uncertainty; a numerical tolerance shall not be invented by this PCR."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: validate_use_extension
    applies_to: "Cradle-to-grave dataset"
    rule: "Fail unless service life, mutually exclusive hours by mode, product-specific measured powers, regional electricity, battery replacement assumptions, and sensitivity cases are declared; skip as not applicable for factory-gate-only datasets."
    source_ids:
      - iec-62087-6-2015
      - iec-62301-2026
      - eu-recommendation-2021-2279
  - rule_id: validate_end_of_life_extension
    applies_to: "Cradle-to-grave dataset"
    rule: "Fail unless receiver, battery, and packaging routes are separate, route shares reconcile for each stream, regional treatment datasets are identified, and allocation or substitution is disclosed; skip as not applicable for factory-gate-only datasets."
    source_ids:
      - eu-directive-2012-19-weee
      - eu-regulation-2023-1542-batteries
      - eu-recommendation-2021-2279
  - rule_id: validate_data_quality
    applies_to: "All datasets"
    rule: "Fail if technological, geographical, temporal, precision, completeness, or consistency evidence is missing, or if a proxy, cut-off, allocation choice, or missing foreground measurement is undisclosed."
    source_ids:
      - eu-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "Foreground data package for production of new finished CPC 47311 radio broadcast receivers, with optional use and end-of-life extensions"
  downstream_use: "Construction and review of Tiangong process, lifecyclemodel, and dataset projections for product carbon footprint, LCA, design comparison, procurement, and disclosure"
  allowed_use: "Declared receiver configurations and production mixes that meet the scope, reference flow, foreground collection, quality, and validation rules"
  excluded_use: "Motor-vehicle receivers; television receivers; transmitters; telecommunications receivers; receiver parts; pure audio players; configuration, geography, or time extrapolation without disclosed justification"
  required_metadata: "Canonical PCR id and version; CPC 3.0 code 47311; product model or production mix; all required qualifiers; facility and geography; reference year and reporting period; organizational and physical boundary; allocation; cut-offs; background datasets; test methods; use and end-of-life scenarios when included"
  required_quality_disclosure: "Source and quality of BOM, mass, energy, power, scrap, emissions, output, packaging, use, and treatment records; calibration and sampling; data gaps; proxies; uncertainty; allocation sensitivity; structured projection fingerprint and validation result"
  update_trigger: "Change in tuner or broadcast system, PCB or electronic architecture, enclosure or material composition, power topology or battery, integrated functions, firmware affecting power, production route, facility, supplier, packaging, use pattern, regulation, or end-of-life treatment that can materially change the inventory or scope"
