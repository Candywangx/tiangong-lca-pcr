system_boundary:
  rules:
    - rule_id: boundary_core_production
      applies_to: "Cradle-to-factory-gate dataset"
      rule: "Include upstream production of purchased materials and components through available supplier datasets, inbound transport when within the declared study scope, electronics assembly, final assembly, functional and power-mode testing, packing, factory energy and utilities, direct emissions, scrap, rework, and waste treatment attributable to the receiver."
      source_ids:
        - eu-recommendation-2021-2279
        - iec-82474-1-2025
    - rule_id: boundary_product_configuration
      applies_to: "All datasets"
      rule: "Represent the actual PCB or PCBA, enclosure, tuner and antenna, loudspeaker, display, clock or recording module, battery, external power supply, cables, fasteners, accessories, and packaging supplied with the declared product; mark absent optional elements as not applicable."
      source_ids:
        - iec-82474-1-2025
    - rule_id: boundary_use_extension
      applies_to: "Cradle-to-grave dataset"
      rule: "Include playback or active, standby, off, networked-standby, charging and replacement-battery energy only for modes and power sources actually present, using a declared service-life and regional scenario."
      source_ids:
        - iec-62087-6-2015
        - iec-62301-2026
        - eu-regulation-2023-826
        - eu-recommendation-2021-2279
    - rule_id: boundary_end_of_life_extension
      applies_to: "Cradle-to-grave dataset"
      rule: "Include collection, preparation for reuse, battery removal where applicable, dismantling, recycling, recovery, and disposal using a declared regional scenario; keep receiver, battery, and packaging routes distinguishable."
      source_ids:
        - eu-directive-2012-19-weee
        - eu-regulation-2023-1542-batteries
        - eu-recommendation-2021-2279
    - rule_id: boundary_exclusions
      applies_to: "Product identity and model"
      rule: "Exclude motor-vehicle receivers, television receivers, radio transmitters, telecommunications receivers, parts-only products, and pure audio players without broadcast reception; disclose any omitted capital equipment, employee travel, or other cut-off."
      source_ids:
        - eu-recommendation-2021-2279
boundary_abstraction:
  declared_starting_condition: "Purchased components and materials enter the foreground at the receiving gate with supplier identity, origin, mass, and available upstream dataset recorded; self-manufactured parts remain inside the foreground boundary"
  starting_condition_role: "Prevents component manufacturing performed by the reporting organization from being hidden as a purchased input and establishes where upstream datasets connect"
  product_classification_scope: "Finished products meeting CPC 3.0 code 47311 and the covered-product definition in section 2"
  recursive_input_rule: "A finished receiver of the same category used as an input is recorded as a separately identified purchased or reused product with origin, condition, mass, and upstream dataset; it is not recursively expanded within the same foreground process map"
  upstream_dataset_requirement: "Use supplier-specific datasets where available; otherwise use geographically and technologically representative datasets and disclose provider, geography, reference year, and substitution"
  disclosure: "Declare organizational and physical boundary, reporting period, facilities, outsourced steps, component origin, transport inclusion, cut-offs, use and end-of-life extensions, and every dataset substitution"
