allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared assembly, test, rework, utilities, and packaging operations"
    rule: "Prefer direct metering, batch records, and process subdivision. When residual sharing remains, use a physical driver that reflects resource use, document the driver, and apply it consistently."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
  - rule_id: allocation_variant_mix
    applies_to: "multiple receiver models or configurations in one dataset"
    rule: "Calculate production-mass-weighted foreground amounts from variant-level output mass and process records. Disclose included variants and combined-function mix; do not represent the whole category with one model unless the dataset scope is explicitly that model."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "failed, repaired, and retested units"
    rule: "Retain original and rework burdens with accepted output. Returned-to-process parts and units are not burden-free co-products."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_waste_recycling
    applies_to: "scrap and wastes sent to recycling, recovery, or disposal"
    rule: "Record waste quantity and actual treatment route. Apply recycling credits or avoided-burden treatment only under the declared downstream LCA method, with substitution assumptions and sensitivity disclosed; do not create an implicit credit in the foreground inventory."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_incoming_component_records
      process_id: "incoming_component_control"
      flow_role: "purchased and released components, harnesses, accessories, and incoming rejects"
      record_type: "ERP receipts, supplier declarations, inventory movements, inspection and disposition records"
      raw_fields: "supplier part id; description; component/function class; supplier; received mass; accepted mass; rejected mass; return-to-supplier mass; issue and return mass; IEC 62474 declaration reference; included-in-delivery flag"
      collection_method: "Reconcile receiving, inventory, inspection, and production-issue records by part and reporting period."
      unit: "kg"
      frequency: "each receipt and reporting-period reconciliation"
      temporal_coverage: "declared representative manufacturing period"
      site_scope: "every included manufacturing site and supplier stream"
      aggregation_rule: "Sum accepted and rejected masses by part; reconcile opening and closing stock; normalize to accepted net receiver output."
      quality_evidence: "supplier material declarations, calibrated scales, ERP audit trail, inspection disposition records"
    - protocol_id: cp_electronic_assembly_records
      process_id: "electronic_assembly"
      flow_role: "assembly inputs, electricity, output, scrap, and direct emissions"
      record_type: "material issue/return records, sub-meters, machine logs, output counts/masses, waste tickets, emission measurements or permit calculations"
      raw_fields: "batch; line; board/part id; input mass; return mass; electricity; accepted output mass; scrap mass and code; pollutant and emitted mass; operating hours"
      collection_method: "Reconcile issued materials, meters, machine logs, accepted output, wastes, and quantified direct releases for each assembly route."
      unit: "kg; kWh; pollutant-specific kg"
      frequency: "per batch or shift, aggregated for the reporting period"
      temporal_coverage: "declared representative manufacturing period"
      site_scope: "each electronic-assembly line under organizational control"
      aggregation_rule: "Sum by technology route and site, subtract documented stock returns, and normalize to assembled electronics output and reference output."
      quality_evidence: "meter records, calibration records, batch travelers, waste manifests, emission method records"
    - protocol_id: cp_unit_integration_records
      process_id: "unit_integration"
      flow_role: "functional modules, enclosure, combined-function parts, harnesses, accessories, energy, output, and scrap"
      record_type: "variant bill of materials, issue/return records, meters, production travelers, output and waste records"
      raw_fields: "variant id; standalone/integrated form; supported bands; display/amplifier/navigation/media/connectivity flags; part id; part mass; accessory flag; electricity; consumable mass; accepted output; scrap"
      collection_method: "Reconcile variant BOM and actual issues with metered energy, accepted integrated output, and scrap."
      unit: "kg; kWh"
      frequency: "per batch, aggregated for the reporting period"
      temporal_coverage: "declared representative manufacturing period"
      site_scope: "each integration line and included site"
      aggregation_rule: "Aggregate by variant and production route; normalize to integrated output, then production-mass weight for multi-variant datasets."
      quality_evidence: "controlled BOM revision, issue/return records, calibrated scales, meter records, production release records"
    - protocol_id: cp_configuration_test_records
      process_id: "configuration_and_test"
      flow_role: "programming, function release, external-power modes, test energy, acceptance, and rework"
      record_type: "firmware/configuration records, test-station logs, power measurements, meters, pass/fail and rework records"
      raw_fields: "unit/variant id; firmware/configuration; supported bands; input voltage; current or power; mode; signal condition; audio load/output; display state; amplifier state; navigation/connectivity state; mode duration; test energy; accepted mass; failed mass; rework route"
      collection_method: "Capture automated or controlled test-station records and reconcile to accepted and failed units."
      unit: "W; V; A; h; kWh; kg"
      frequency: "each tested unit or statistically justified lot with reporting-period reconciliation"
      temporal_coverage: "declared representative manufacturing period"
      site_scope: "each configuration and final-test station"
      aggregation_rule: "Calculate mode power and test energy from recorded measurements; aggregate by variant and production mass; normalize manufacturing test energy to accepted output."
      quality_evidence: "calibrated power analyzer or traceable DC measurement, test procedure revision, pass/fail logs, meter reconciliation"
    - protocol_id: cp_rework_waste_records
      process_id: "rework_waste_handling"
      flow_role: "rework inputs, replacement materials, energy, recovered units, and prepared wastes"
      record_type: "rework tickets, material issues, meters, repeat-test logs, waste weights and manifests"
      raw_fields: "failure code; unit mass; rework route; replacement part and mass; consumable mass; electricity; recovered unit mass; waste code; waste mass; destination and treatment"
      collection_method: "Track each rework route and waste fraction through closure; reconcile returned units to repeat testing and dispatched waste to manifests."
      unit: "kg; kWh"
      frequency: "each rework lot and waste shipment"
      temporal_coverage: "declared representative manufacturing period"
      site_scope: "all included rework areas and waste preparation points"
      aggregation_rule: "Sum inputs and outputs by route, retain burdens with accepted output, and normalize to reference output."
      quality_evidence: "rework closure records, calibrated scales, meter records, repeat-test logs, signed waste manifests"
    - protocol_id: cp_packaging_delivery_records
      process_id: "packaging_and_delivery"
      flow_role: "net receiver, included accessories, packaging, packed output, and packaging waste"
      record_type: "released BOM, packing specification, scales, packaging issue/return records, shipment and waste records"
      raw_fields: "unit/variant id; receiver mass; harness/accessory id and mass; included-in-reference flag; packaging material and mass; delivery state; accepted packed quantity; packaging waste"
      collection_method: "Reconcile release, packing, shipment, and waste records and distinguish net reference mass from packaging."
      unit: "kg"
      frequency: "each packing specification and reporting-period reconciliation"
      temporal_coverage: "declared representative manufacturing period"
      site_scope: "each included packing and dispatch site"
      aggregation_rule: "Sum net receiver and included accessory mass separately from packaging; normalize packaging and packaging waste to 1 kg net accepted output."
      quality_evidence: "calibrated scales, controlled packing specification, BOM release, shipment reconciliation, waste records"
  calculation_rules:
    - id: calc_reference_output_mass
      applies_to: "net accepted reference output"
      rule: "Net reference mass = accepted receiver mass + mass of harnesses/accessories flagged as included in the delivered unit; distribution packaging is excluded and reported separately."
      inputs:
        - "accepted receiver mass"
        - "included accessory mass"
        - "included-in-reference flags"
        - "packaging mass"
      output: "kg net accepted receiver output"
      source_ids:
        - unsd-cpc-3-0
    - id: calc_inventory_normalization
      applies_to: "every foreground amount"
      rule: "Normalized amount = reporting-period process amount / reporting-period net accepted receiver output mass. Preserve the original unit and report the resulting amount per 1 kg reference output."
      inputs:
        - "process amount"
        - "accepted output mass"
      output: "inventory amount per kg reference output"
      source_ids:
        - iso-14044-2006
        - iec-63366-2025
    - id: calc_variant_weighting
      applies_to: "multi-variant dataset"
      rule: "Weighted amount = sum of variant-specific normalized amount multiplied by variant accepted output mass, divided by total accepted output mass."
      inputs:
        - "variant amounts"
        - "variant accepted masses"
        - "variant qualifiers"
      output: "production-mass-weighted inventory and disclosed variant mix"
      source_ids:
        - iso-14044-2006
    - id: calc_mode_power
      applies_to: "operating, idle/standby, and automatic power-down modes"
      rule: "Prefer direct power measurement; otherwise power = time-aligned DC voltage × current. Report the measurement window, signal and functional state, load condition, and averaging rule for each mode."
      inputs:
        - voltage
        - "current or direct power"
        - time
        - "radio band/signal"
        - "audio/display/amplifier/navigation/connectivity state"
      output: "W by declared mode and variant"
      source_ids:
        - iec-62087-6-2015
        - iso-16750-2-2023
    - id: calc_mass_reconciliation
      applies_to: "each material process and reporting period"
      rule: "Imbalance = opening stock + receipts - closing stock - accepted outputs - documented returns - waste outputs. Investigate and disclose unresolved imbalance; do not force it to zero by changing measured flows."
      inputs:
        - stock
        - receipt
        - product
        - return
        - "and waste masses"
      output: "kg imbalance and reconciliation status"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and variants"
      requirement: "Retain the standalone/integrated form, supported bands, external vehicle power specification, combined-function configuration, included harness/accessory set, net mass, packaging state, geography, and reporting period for every represented variant."
      evidence: "product master, controlled BOM, technical specification, packing specification, release record"
    - id: dq_material_traceability
      applies_to: "purchased electronic and mechanical inputs"
      requirement: "Retain supplier, part, material or component class, declared mass, declaration revision, and data-gap status. Use IEC 62474-compatible supplier declarations when available; do not treat the declaration as process-emission evidence."
      evidence: "supplier declaration, receiving record, BOM revision, data-gap log"
    - id: dq_energy
      applies_to: "manufacturing electricity"
      requirement: "Reconcile sub-metered or allocated electricity with facility totals. Document allocation drivers, meter coverage, excluded loads, electricity dataset geography, and any test-cycle calculation."
      evidence: "meter and invoice records, equipment logs, allocation worksheet, calibration record"
    - id: dq_power_modes
      applies_to: "product operating and idle/standby data"
      requirement: "Use traceable DC measurement and retain supply voltage, signal and band, audio load/output, display/amplifier/navigation/connectivity states, measurement duration, averaging, and instrument calibration."
      evidence: "power test method, raw test log, calibration certificate, variant configuration"
    - id: dq_mass_balance
      applies_to: "material, product, rework, and waste flows"
      requirement: "Reconcile each included process and the overall foreground system; document stock change, return to supplier or process, waste destination, and unresolved imbalance."
      evidence: "mass-balance worksheet, inventory ledger, production and waste records"
    - id: dq_temporal_geographical_technology
      applies_to: "all foreground and upstream data"
      requirement: "Declare data period, site geography, production route, technology, data age, supplier coverage, and substitution or proxy use. Explain whether the period represents normal production and identify material gaps."
      evidence: "dataset metadata, site list, production records, supplier coverage table, gap assessment"
    - id: dq_completeness
      applies_to: "foreground package"
      requirement: "Include every applicable required or conditional process and all material, energy, product, waste, and direct-emission flows known to cross its boundary. Quantify and justify any cut-off instead of silently omitting a flow."
      evidence: "process applicability matrix, inventory completeness check, cut-off and gap log"
validation_rules:
  - rule_id: validate_category_scope
    applies_to: "product identity"
    rule: "Confirm that the product is a radio broadcast receiver designed for a motor vehicle and cannot operate without an external power source. Reject portable/self-powered receivers, non-vehicle receivers, standalone parts, complete vehicles, and model-exclusive category claims."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 0d100766-4820-4747-aea0-1185a8c4383a, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and a reference amount of 1."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "product and dataset metadata"
    rule: "Fail completeness when form, supported bands, external power specification, combined functions, wiring/accessory content, power modes, net mass, packaging mass, delivery state, geography, or reporting period is missing."
    source_ids:
      - iso-16750-2-2023
      - iec-62087-6-2015
  - rule_id: validate_power_measurement
    applies_to: "operating, idle/standby, and automatic power-down records"
    rule: "Reject a power claim that omits the external DC supply condition and functional mode or substitutes nameplate maximum power for measured mode power."
    source_ids:
      - iec-62087-6-2015
      - iso-16750-2-2023
  - rule_id: validate_delivery_mass
    applies_to: "reference output and packaging"
    rule: "Confirm that included harnesses/accessories follow the declared delivery configuration and that distribution packaging is inventoried separately from the 1 kg net reference output."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "foreground process map"
    rule: "Require incoming control, unit integration, configuration/test, and packaging/delivery; require electronic assembly and rework/waste handling when their inclusion conditions apply."
    source_ids:
      - iec-63366-2025
      - iso-14044-2006
  - rule_id: validate_material_and_energy_records
    applies_to: "foreground inventory"
    rule: "Require traceable component/material quantities, manufacturing electricity, accepted output, rework, waste, and applicable direct emissions with protocol links and consistent normalization."
    source_ids:
      - iec-62474-2018
      - iso-14044-2006
  - rule_id: validate_allocation
    applies_to: "shared operations and variants"
    rule: "Require subdivision or a documented physical allocation driver, production-mass weighting for grouped variants, and retention of rework burdens; reject undisclosed recycling credits."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
  - rule_id: validate_mass_balance_and_gaps
    applies_to: "process and system totals"
    rule: "Require reported mass-reconciliation status, quantified unresolved imbalance, cut-offs, proxy data, supplier coverage, and material data gaps."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for an externally vehicle-powered radio receiver, publishable after review as a secondary_dataset and usable as a background_dataset for downstream component, infotainment-system, or vehicle studies."
  downstream_use: "Component supply-chain LCA, product carbon footprint, receiver or infotainment assembly modelling, and downstream vehicle-system models that add their own transport, use, maintenance, and end-of-life scenarios."
  allowed_use: "Use for the declared standalone or integrated receiver configuration, production geography, technology, reporting period, functional-module set, harness/accessory delivery state, and packaging treatment."
  excluded_use: "Do not use as a complete vehicle, portable receiver, non-vehicle receiver, standalone display/amplifier/navigation/harness dataset, universal category average without a representative production mix, or use-phase dataset without a declared vehicle power and operating scenario."
  required_metadata: "canonical PCR id; product flow UUID; Mass and Units of mass UUIDs; standalone/integrated form; supported bands; external vehicle power specification; combined functions; included harnesses/accessories; net mass; packaging mass; delivery state; variant mix; production route; site geography; reporting period; upstream dataset versions; allocation; cut-offs; data gaps; operating/idle/standby power test conditions when reported"
  required_quality_disclosure: "Supplier and BOM coverage, foreground meter and mass coverage, power-test method and calibration, variant weighting, mass-balance status, rework and waste treatment, direct-emission applicability, proxy data, cut-offs, uncertainty or missing range evidence, and review status."
  update_trigger: "Change in receiver form or supported bands; external power architecture; display/amplifier/navigation/connectivity configuration; delivered harness/accessory set; BOM or packaging; assembly/test technology; site or electricity supply; allocation or variant mix; power-test method; waste route; or a material change in foreground or supplier data."
