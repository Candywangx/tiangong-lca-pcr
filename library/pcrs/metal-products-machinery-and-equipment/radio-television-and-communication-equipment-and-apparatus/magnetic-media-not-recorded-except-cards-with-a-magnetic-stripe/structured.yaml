            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted medium of the declared format"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_solvents
              source_ids:
                - epa-ap42-magnetic-tape
            ranges: []
allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared_processes"
    rule: "Use cp_allocation to assign dedicated material and energy records directly. Allocate shared utilities with measured machine demand and run time; coating-line demand may use coated area and metered drying load when causal. Record the allocation driver and sensitivity. Mass-only allocation across different tape formats requires justification."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "solvent_reuse"
    rule: "Internal solvent recovery reduces fresh solvent purchases but is neither a sale nor an avoided-product credit. Record recovery burdens and external recovered-solvent exports separately; if exports have a product function, add a specific product exchange and document the treatment/allocation convention without an automatic substitution credit."
    source_ids:
      - epa-ap42-magnetic-tape
  - rule_id: allocation_rejects
    applies_to: "accepted_yield"
    rule: "All production and rework burdens remain with accepted output M. Track rejected coated film and coating sludge separately; no negative raw-material input for scrap. Document any external recycling allocation explicitly."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "manufacture"
      flow_role: "Accepted reference medium"
      record_type: "Batch acceptance record"
      raw_fields: "format; batch_id; gross_mass; tare_mass; housing_mass; accepted_count; rejected_mass; tape_area; native_capacity; test_method; blank_state"
      collection_method: "Calibrated weighing and format-specific release test"
      unit: "kg; m2; count"
      frequency: "Each batch"
      temporal_coverage: "All batches in declared reporting year or disclosed representative campaign"
      site_scope: "Manufacturing and dispatch site"
      aggregation_rule: "Sum accepted net mass M by format; retain rejected mass and test failures"
      quality_evidence: "Scale calibration, product specification, release certificate"
    - protocol_id: cp_materials
      process_id: "manufacture"
      flow_role: "Each material and component"
      record_type: "Stock and batch ledger"
      raw_fields: "row_id; supplier; grade; opening_stock; receipts; closing_stock; returns; dry_fraction; composition; area; component_mass"
      collection_method: "Weighing, warehouse reconciliation, supplier composition records"
      unit: "kg; m2"
      frequency: "Each receipt and batch; period stocktake"
      temporal_coverage: "Same period as cp_output"
      site_scope: "Declared site plus named component suppliers"
      aggregation_rule: "Consumption = opening + receipts - closing - returns; separate each constituent; normalize by M"
      quality_evidence: "Invoices, SDS, bill of materials, supplier scope and balance closure"
    - protocol_id: cp_solvents
      process_id: "solvent_control"
      flow_role: "MEK and toluene individually"
      record_type: "Species solvent ledger and emissions records"
      raw_fields: "species; fresh_input; opening_stock; closing_stock; recovered_internal; exported_solvent; waste_species_mass; residual_in_product; destroyed_mass; exhaust_flow; concentration; capture_fraction; destruction_fraction; uptime"
      collection_method: "Composition analysis, mass meters, matched stack concentration/flow measurements, leak survey"
      unit: "kg; kg/m3; m3"
      frequency: "Each batch ledger; representative operating and upset emission tests"
      temporal_coverage: "Same production period; align purchases, stocks and waste shipments"
      site_scope: "All solvent-handling areas and control outlets onsite"
      aggregation_rule: "Species balance or measured emissions / M; do not treat internal recovery as an external loss"
      quality_evidence: "Analytical calibration, capture tests, control uptime, inventory reconciliation"
    - protocol_id: cp_utilities
      process_id: "utilities"
      flow_role: "Electricity, gas and makeup water separately"
      record_type: "Submeter records"
      raw_fields: "meter_id; opening_reading; closing_reading; unit; gas_temperature; gas_pressure; water_density; operation_hours; allocation_fraction; supplier_boundary"
      collection_method: "Read calibrated submeters; reconcile to invoices"
      unit: "MJ; kWh; m3; kg"
      frequency: "Shift or continuous readings; monthly reconciliation"
      temporal_coverage: "Same period as cp_output, including startup and downtime loads"
      site_scope: "All attributable production and support equipment"
      aggregation_rule: "Net attributable meter differences / M after documented conversion"
      quality_evidence: "Meter calibration, bills, allocation evidence"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "Each discharged waste stream"
      record_type: "Waste transfer record and analysis"
      raw_fields: "row_id; wet_mass; dry_solids; solvent_species_fraction; destination; treatment; opening_stock; closing_stock; internal_rework"
      collection_method: "Weigh each stream and analyse representative composition"
      unit: "kg"
      frequency: "Each shipment; samples covering recipe changes"
      temporal_coverage: "Same period; correct temporary waste storage changes"
      site_scope: "Site outlet and receiving treatment operator"
      aggregation_rule: "Generated and transferred quantities reconciled; each stream / M; water and solvent fractions remain within its wet mass"
      quality_evidence: "Transfer documents, laboratory results, treatment identity"
    - protocol_id: cp_carbon
      process_id: "utilities"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Fuel and solvent carbon record"
      raw_fields: "fuel_carbon; oxidized_solvent_carbon; fossil_fraction; unoxidized_carbon; stack_co2; carbon_in_co; reporting_period"
      collection_method: "Fuel composition and solvent destruction analysis, cross-check stack measurement"
      unit: "kg C; kg CO2"
      frequency: "Matched production campaigns and fuel changes"
      temporal_coverage: "Same period as cp_output"
      site_scope: "Onsite combustion and solvent oxidation"
      aggregation_rule: "CO2 from oxidized fossil carbon using molecular mass ratio; divide by M"
      quality_evidence: "Composition certificates and closed carbon balance"
    - protocol_id: cp_allocation
      process_id: "utilities"
      flow_role: "Shared burden assignment"
      record_type: "Production scheduling and meter attribution"
      raw_fields: "equipment_id; product_format; run_hours; measured_power; coated_area; drying_load; allocation_driver; allocated_fraction"
      collection_method: "Join production logs with shared meter totals"
      unit: "h; m2; MJ; fraction"
      frequency: "Each campaign; period reconciliation"
      temporal_coverage: "Same period as cp_output"
      site_scope: "Shared equipment and control systems"
      aggregation_rule: "Fractions sum to unity for shared burden; retain unattributed load and investigate"
      quality_evidence: "Causal driver justification and sensitivity result"
  calculation_rules:
    - id: normalize
      applies_to: "All rows"
      rule: "q_i = attributed period quantity_i / M; M > 0. Reference output = M/M = 1 kg/kg. Keep period totals and allocation fractions."
      inputs:
        - cp_output
        - cp_allocation
        - "linked row protocol"
      output: "q_i"
      source_ids: []
    - id: film_conversion
      applies_to: "Base film and coated web"
      rule: "mass = measured area × measured areal mass of the same film state; width × length gives tape area. Include only measured coating and housing in final mass."
      inputs:
        - cp_materials
        - cp_output
      output: "kg"
      source_ids: []
    - id: solvent_balance
      applies_to: "MEK; toluene"
      rule: "Air release = fresh external input + opening stock - closing stock - external recovered export - solvent in exported waste - solvent retained in accepted product - destroyed solvent. Internal recovery cancels. A negative residual requires investigation; it is not a zero emission. With incomplete stocks or destruction data use measured releases instead."
      inputs:
        - cp_solvents
        - cp_waste
        - cp_materials
      output: "kg species"
      source_ids:
        - epa-ap42-magnetic-tape
    - id: capture_control
      applies_to: "Controlled solvent sources"
      rule: "For a separately measured evaporated species load L, outlet-plus-fugitive release = L × (1 - capture_fraction × removal_fraction). Use actual uptime and uncaptured sources. Recovery is removal, not chemical destruction; residual captured solvent requires stock/waste accounting. Do not add this estimate to a plantwide mass-balance estimate."
      inputs:
        - cp_solvents
      output: "kg species"
      source_ids:
        - epa-ap42-magnetic-tape
    - id: carbon_balance
      applies_to: "Fossil carbon dioxide"
      rule: "CO2 = fossil carbon actually oxidized to CO2 × molecular mass(CO2)/atomic mass(C). Account separately for fuel and destroyed solvent; subtract carbon remaining as CO, organics or solids; retain chosen atomic-weight convention."
      inputs:
        - cp_carbon
      output: "kg CO2"
      source_ids: []
  data_quality_requirements:
    - id: quality_completeness
      applies_to: "Foreground package"
      requirement: "Reconcile all actual recipe ingredients, packaging and emissions with the representative cards; retain atomic extensions and documented absence decisions."
      evidence: "cp_materials; cp_waste; cp_solvents"
    - id: quality_representativeness
      applies_to: "All measured amounts"
      requirement: "Disclose time, site and technology coverage, sampling, uncertainty, detection limits, missing periods and supplier proxies. Do not substitute historical EPA factors for site measurements."
      evidence: "Linked protocols and source applicability assessment"
    - id: quality_ranges
      applies_to: "Quantitative priors"
      requirement: "No external numeric priors are prescribed. Any later inferred range requires at least two independent original-text sources with compatible boundary, unit and product state, plus geographic/technological synthesis. Retain measured values and uncertainty meanwhile."
      evidence: "Foreground protocols and independence assessment"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Require complete qualifiers, a single declared output state, positive accepted mass, and evidence of blank-media acceptance. A generic flow name alone does not define an interchangeable recording service."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reconciliation
    applies_to: "inventory"
    rule: "Each physical exchange needs one concrete identity, compatible unit, source records and matching process. Confirm total accepted output plus rejects and stock changes against inputs; investigate balance residuals using measurement uncertainty rather than a fabricated tolerance."
    source_ids: []
  - rule_id: validate_solvents
    applies_to: "solvent_control"
    rule: "Check species completeness, capture versus removal, internal recovery cancellation, residual-in-waste and destruction accounting. Do not publish both full solvent volatilization and full oxidation of that same solvent."
    source_ids:
      - epa-ap42-magnetic-tape
  - rule_id: validate_boundaries
    applies_to: "upstream_links"
    rule: "Reject circular coated-web links, duplicated utility or transport burdens, and missing external waste treatment. Require explicit treatment of conditional operations and actual exchanges absent from the representative cards."
    source_ids: []
  - rule_id: validate_comparisons
    applies_to: "downstream_use"
    rule: "Allow manufacturing comparison only after matching format, output state, capacity/quality, boundary and allocation. Storage-service comparison requires a separate functional scenario and cannot follow from kg-normalized results alone."
    source_ids:
      - quantegy-magnetic-tape-components
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supplier media-manufacturing input to a separately specified recording/storage model."
  allowed_use: "Matching format/state manufacturing process, with supplier and waste-treatment links and disclosed uncertainty."
  excluded_use: "Unqualified interchange of tape, floppy disk, optical disk, SSD or hard-disk drive; data-centre operational savings; universal archive lifetime."
  required_metadata: "All reference qualifiers; reporting period; operator; geography; net output; process route; packaging; suppliers; allocation; transport and treatment boundaries."
  required_quality_disclosure: "Primary data share, missing exchanges, proxy identities, measurement uncertainty, solvent/carbon closure, conditional exclusions and range-evidence limitations."
  update_trigger: "Format, formulation, substrate, supplier, manufacturing route, control system, utility mix or acceptance specification changes."
