measurement_rules:
  - id: net_mass
    applies_to: "Accepted product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use measured accepted net mass M, separating integral housing from removable shipping packaging. Convert counts with measured same-format mean mass; film area uses measured areal mass."
  - id: formulation_basis
    applies_to: "Coating ingredients"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each polymer, pigment and solvent separately; reconcile wet deliveries with measured solids/composition and inventory changes. Do not record both a supplied solution and all its constituents as additional inputs."
  - id: energy_conversion
    applies_to: "Electricity and gas"
    required_property_ref:
      name: "Energy; Volume"
      uuid: ""
    required_unit: "MJ; m3"
    rule: "Electricity: 1 kWh = 3.6 MJ exactly. Gas volume must declare temperature, pressure, dry/wet state and any volume correction; use supplier calorific value only when converting gas to energy."
  - id: solvent_species
    applies_to: "Solvent balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use species mass, not total VOC mass, for each solvent input and emission. Convert concentration and exhaust volume to a common temperature, pressure and moisture basis."
