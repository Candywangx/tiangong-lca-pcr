  semantic_boundary:
    decision: promote_legacy
    summary: No existing material PCR identity covers unrecorded flexible magnetic media. Coating-solvent reconciliation, accepted format-specific yield and purchased coated-web recursion require product-specific guidance. Historical CPC 2.1 explanatory scope is distinguished from the verified current CPC 3.0 title.
    representative_route: Particulate-coated film; each actual formulation and alternative deposition or finishing route requires atomic dataset instantiation.
    chinese_title_review: Professional translation verified against the original English CPC title and identical public TianGong Chinese baseName.
  source_verification:
    - source_id: un-cpc-3-0-structure-2025
      locator: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv
      original_text_verified: true
      independence_key: un-cpc-3-0-structure-2025
      supports: CPC 3.0 product title and neighbouring category distinctions; row 47530.
    - source_id: un-cpc-2-1-magnetic-media-note
      locator: https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/47530
      original_text_verified: true
      independence_key: un-cpc-2-1-47530
      supports: 'Historical detailed scope: tapes, cartridges, cassettes, floppy disks; excludes hard disks, recorded media and stripe cards. Used as semantic context alongside the current 3.0 title, not represented as 3.0 explanatory notes.'
    - source_id: epa-ap42-magnetic-tape
      locator: https://www.epa.gov/sites/default/files/2020-10/documents/c4s02_2n.pdf
      original_text_verified: true
      independence_key: epa-ap42-4-2-2-13-1990
      supports: 'Sections 4.2.2.13.1-3 and process diagram: coating and finishing, solvent capture versus destruction, solvent balance. Historical US guidance supports mechanisms only; no default consumption or control efficiencies adopted.'
    - source_id: epa-magnetic-tape-risk-review
      locator: https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9100923X.TXT
      original_text_verified: true
      independence_key: epa-9100923x
      supports: 'Chapter 2, sections 2.1.1 and 2.1.3: mix preparation, cleaning, casings, solvent recovery, waste and wastewater origins. No legal limits or historical emission proportions adopted.'
    - source_id: quantegy-magnetic-tape-components
      locator: https://www.loc.gov/static/programs/national-film-preservation-board/documents/tvquantegy.pdf
      original_text_verified: true
      independence_key: quantegy-view-preservation
      supports: 'Pages 1-2: PET base film, backcoat, binder, lubricant and magnetic layer distinctions; format-specific physical design. No service-life values adopted.'
    - source_id: loc-magnetic-tape-binder-research
      locator: https://www.loc.gov/preservation/scientists/projects/sticky_shed.html
      original_text_verified: true
      independence_key: loc-sticky-shed-research
      supports: 'Background and project description verified in downloaded official HTML: polyester-urethane binder in historical audio/video tapes; supports conditional binder identity, not a universal modern recipe or lifetime.'
    - source_id: fujifilm-recording-media
      locator: https://global.fujifilm.com/en/about/corporate/field/storage
      original_text_verified: true
      independence_key: fujifilm-global-recording-media
      supports: 'Magnetic recording tape for computers section: commercial barium-ferrite tape route. No performance or lifetime claim imported.'
