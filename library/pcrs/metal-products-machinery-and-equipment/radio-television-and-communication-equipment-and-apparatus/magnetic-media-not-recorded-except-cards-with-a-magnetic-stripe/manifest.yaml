        reason_code: no_exact_candidate
        explanation: No audited candidate establishes PET film; results are composite film, polymers or granules.
      - row_id: barium_ferrite
        reason_code: no_exact_candidate
        explanation: No audited candidate identifies barium-ferrite magnetic pigment powder.
      - row_id: polyester_urethane
        reason_code: no_exact_candidate
        explanation: No audited candidate establishes polyester-polyurethane binder resin.
      - row_id: mek_input
        reason_code: no_exact_candidate
        explanation: Both English and synonym searches returned different ketones, not MEK.
      - row_id: toluene_input
        reason_code: classification_mismatch
        explanation: The named toluene candidate has CPC 35499 rather than the expected basic hydrocarbon classification; clarification is required.
      - row_id: cartridge_housing
        reason_code: no_exact_candidate
        explanation: Only finished magnetic media were returned, not an empty plastic cartridge housing.
      - row_id: coated_tape_trim
        reason_code: no_exact_candidate
        explanation: Audited offcut, textile and paint waste candidates are not magnetic-coated PET tape.
      - row_id: coating_sludge
        reason_code: no_exact_candidate
        explanation: Audited coating-slag/paint waste identities do not establish magnetic pigment/binder sludge.
      - row_id: spent_solvent
        reason_code: no_exact_candidate
        explanation: Audited solid slag, water-based paint and magnet-powder identities do not establish this liquid spent-solvent mixture.
      - row_id: recovery_wastewater
        reason_code: no_exact_candidate
        explanation: Audited generic and unrelated wastewaters do not establish magnetic-tape solvent-recovery wastewater.
      - row_id: toluene_air
        reason_code: no_exact_candidate
        explanation: Both searches returned substituted toluene compounds or unrelated compartments, not toluene emitted to air.
