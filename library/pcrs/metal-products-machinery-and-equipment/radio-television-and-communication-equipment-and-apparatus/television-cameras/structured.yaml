system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The required foreground boundary is cradle-to-factory-gate for the represented production configuration. It includes upstream datasets linked to purchased inputs and the foreground activities needed to deliver the finished camera. Use and end-of-life information is retained as metadata for downstream modelling but is not silently mixed into the manufacturing inventory."
      source_ids: []
    - rule_id: boundary_cradle_to_gate_manufacturing
      applies_to: "All represented production routes"
      rule: "Include supplier-gate materials and components, their transport where modelled, camera assembly, configuration, functional test, production losses, packaging, and factory-gate release."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_component_completeness
      applies_to: "Sensor/optical, PCB/electronics, enclosure/mechanical, thermal-management and power subsystems"
      rule: "Account for every material component or process that can be assessed; any exclusion requires a documented mass and significance check and shall not conceal a potentially significant impact."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - iec-62474-2018
    - rule_id: boundary_packaging_accessories
      applies_to: "Primary/secondary packaging, manuals, labels and included accessories"
      rule: "Record packaging and additional elements separately from the 1 kg net camera reference; include their production and packaging-stage losses in the data package."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - rule_id: boundary_use_and_eol_scenarios
      applies_to: "Downstream use and end-of-life"
      rule: "Exclude use electricity, external networks/recorders and end-of-life from the foreground manufacturing total unless a separately labelled scenario is requested; retain power, service-life, battery, PCB, cable, display and material-disclosure data needed for those scenarios."
      source_ids:
        - eu-weee-2012-19-eu
        - eu-rohs-2011-65-eu
    - rule_id: boundary_variant_scope
      applies_to: "Product family or portfolio datasets"
      rule: "Combine models only when a documented homogeneous-family or extrapolation rule covers differences in form, sensor/optics, performance, functions, power, accessories and construction; never extrapolate one narrow professional model to the whole CPC category."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - ebu-tech-3335-2014
boundary_abstraction:
  declared_starting_condition: "Materials, components, energy carriers, packaging and services delivered to the relevant component, assembly or packaging site, with linked upstream datasets"
  starting_condition_role: "supplier_gate_component_and_material_inputs"
