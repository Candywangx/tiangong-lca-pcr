allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-output or shared operations"
    rule: "First avoid allocation by submetering, separate work orders, time records, or process subdivision for the represented camera configuration."
    source_ids:
      - ghg-protocol-product-standard-2011
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_shared_operations
    applies_to: "Shared assembly, test, HVAC, compressed air and site services"
    rule: "When subdivision is not practical, use a documented physical driver that reflects causality, such as machine time, test time, measured energy, floor-time, or accepted mass; economic allocation is allowed only when physical relationships cannot reasonably represent the process and shall be disclosed."
    source_ids:
      - ghg-protocol-product-standard-2011
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_rework_scrap
    applies_to: "Rework, rejects and production scrap"
    rule: "Keep material returned to the same process inside the period out of final waste; allocate unrecovered losses to accepted output using measured configuration-specific records and report external treatment separately."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_recycling
    applies_to: "Recycled input and exported recyclable material"
    rule: "State the recycling allocation method, system boundary and any burden or credit explicitly; do not mix recycled-content and end-of-life credits without a consistent declared method."
    source_ids:
      - ghg-protocol-product-standard-2011
      - pep-ecopassport-pcr-ed4-2021
dataset_production:
  collection_protocols:
    - protocol_id: collect_component_bom
      process_id: "component_and_subassembly_supply"
      flow_role: "Purchased components, materials, power parts and accessories"
      record_type: "Supplier declaration, approved BOM, purchase/receiving record, part mass"
      raw_fields: "Part number; function; supplier; quantity; mass; material/substance declaration; sensor/optical/electronic/mechanical/thermal/power role; included-accessory status"
      collection_method: "Reconcile approved configuration BOM to received and accepted parts; retain supplier and material declarations"
      unit: "kg, item"
      frequency: "Per configuration and reporting period"
      temporal_coverage: "Same period as represented production, or documented supplier vintage"
      site_scope: "All represented suppliers and production sites"
      aggregation_rule: "Quantity times verified part mass, with rejects and stock changes separated"
      quality_evidence: "Signed-off BOM; weighing record; supplier declaration; CPC/product identity record"
    - protocol_id: collect_assembly_inputs_outputs
      process_id: "camera_assembly_configuration_test"
      flow_role: "Components, consumables, accepted cameras and rejected output"
      record_type: "Work order, material issue, weighing, test and acceptance records"
      raw_fields: "Configuration; input quantity/mass; consumables; output count/mass; sensor/optical setup; resolution; frame rate; interfaces; recording/network functions; power mode; test result"
      collection_method: "Reconcile work orders, material issues, accepted output and rejects by configuration"
      unit: "kg, item"
      frequency: "Each batch or auditable reporting period"
      temporal_coverage: "Representative production period"
      site_scope: "Every represented assembly/test site"
      aggregation_rule: "Sum accepted records; preserve configuration strata before any family aggregation"
      quality_evidence: "Work-order reconciliation; test specification and result; calibrated scale record"
    - protocol_id: collect_assembly_energy
      process_id: "camera_assembly_configuration_test"
      flow_role: "Assembly, configuration, calibration and test energy"
      record_type: "Meter, submeter, equipment log or reconciled utility record"
      raw_fields: "Meter IDs; start/end readings; energy carrier; process time; allocation driver; site; period"
      collection_method: "Direct metering preferred; otherwise reconcile auditable shared records under Section 7"
      unit: "kWh"
      frequency: "Meter interval or reporting period"
      temporal_coverage: "Representative production period"
      site_scope: "Every represented assembly/test site"
      aggregation_rule: "Sum metered use; allocate shared use only with disclosed causal driver"
      quality_evidence: "Meter calibration/status; utility invoice reconciliation; allocation worksheet"
    - protocol_id: collect_waste_rework
      process_id: "camera_assembly_configuration_test"
      flow_role: "Scrap, rejects, rework, recovered parts and treatment"
      record_type: "Reject log, rework order, waste transfer note, recycler record"
      raw_fields: "Material/part; mass; cause; rework return; recovery; destination; treatment"
      collection_method: "Reconcile rejects to rework returns, recovered parts and exported wastes"
      unit: "kg"
      frequency: "Each batch or reporting period"
      temporal_coverage: "Representative production period"
      site_scope: "Every represented site"
      aggregation_rule: "Count internal rework once and report only final exported waste"
      quality_evidence: "Mass-balance worksheet; signed waste transfer/treatment evidence"
    - protocol_id: collect_packaging_release
      process_id: "packaging_and_release"
      flow_role: "Net camera output, packaging, manuals, labels and packaging waste"
      record_type: "Packing specification, BOM, weighing, shipment and waste records"
      raw_fields: "Net camera mass; packaging material/mass; manuals/labels; included accessories; packed count; reusable status; waste"
      collection_method: "Reconcile net product, packing specification, shipped units and packaging scrap"
      unit: "kg, item"
      frequency: "Each configuration or reporting period"
      temporal_coverage: "Representative production period"
      site_scope: "Every represented packaging/release site"
      aggregation_rule: "Keep net camera, included accessories and packaging as separate quantities"
      quality_evidence: "Approved packing specification; shipment record; scale record; waste reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory records"
      rule: "normalized amount = period amount / accepted net camera mass in kg"
      inputs:
        - "Period input/output amount"
        - "accepted net unpackaged camera mass"
      output: "Amount per 1 kg reference product"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_component_mass
      applies_to: "BOM components and accessories"
      rule: "component mass = accepted quantity times verified unit mass; reconcile against measured camera mass, process losses and separately supplied accessories"
      inputs:
        - "Accepted quantity"
        - "verified part mass"
        - "net product mass"
        - losses
      output: "Configuration-specific component mass"
      source_ids:
        - iec-62474-2018
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_packaging_mass
      applies_to: "Packaging delivered with product"
      rule: "packaging mass per reference = shipped packaging mass / shipped net camera mass; keep reusable packaging separate"
      inputs:
        - "Packaging issue/shipment mass"
        - "shipped net camera mass"
      output: "Packaging kg per 1 kg net camera"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_family_weighting
      applies_to: "Declared product-family datasets"
      rule: "family result = sum of configuration-specific normalized records times disclosed production or sales weights; use only configurations covered by the homogeneous-family rule"
      inputs:
        - "Configuration results"
        - "represented volumes"
        - "qualification matrix"
      output: "Weighted family dataset and coverage disclosure"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - ebu-tech-3335-2014
  data_quality_requirements:
    - id: dq_identity_performance
      applies_to: "Product and reference flow"
      requirement: "Demonstrate CPC 47213 identity and record use/form, sensor/optics, resolution/frame rate, recording/network, power and accessory qualifiers for every represented configuration."
      evidence: "Product specification, classification record, test specification and accepted configuration list"
    - id: dq_bom_completeness
      applies_to: "Materials and components"
      requirement: "Reconcile BOM, net product mass, accessories and production losses; justify every excluded item and assess whether it can conceal a significant impact."
      evidence: "Approved BOM, measured masses, exclusion register and mass-balance check"
    - id: dq_primary_foreground
      applies_to: "Assembly, test, packaging and waste"
      requirement: "Use site-specific primary records for represented sites and period; disclose proxy data and temporal, geographic or technology mismatches."
      evidence: "Meter/work-order/test/packing/waste records and documented data-quality assessment"
    - id: dq_supplier_materials
      applies_to: "Purchased electronics, optics, batteries, housings and cables"
      requirement: "Retain supplier and material/substance declarations at the greatest available specificity, including applicable RoHS/WEEE-relevant information."
      evidence: "Supplier declarations, IEC 62474-compatible material declarations, compliance evidence"
    - id: dq_family_coverage
      applies_to: "Multi-model datasets"
      requirement: "Preserve model/configuration strata, weighting data and qualification matrix; report the share not covered by primary records."
      evidence: "Family rule, configuration list, production/sales weights and coverage calculation"
validation_rules:
  - rule_id: validate_exact_identity
    applies_to: "Reference product"
    rule: "Confirm the selected flow UUID, state code 100, Product flow type, Mass reference property, Units of mass group, kg reference unit, name/body and CPC 47213 semantics; reject neighboring or component flows."
    source_ids:
      - unstats-cpc-3-0
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata and reference flow"
    rule: "Fail completeness when intended use/form, sensor/optics, resolution/frame rate, recording/network functions, power/accessories, enclosure/PCB/thermal construction or packaging declaration is missing."
    source_ids:
      - ebu-tech-3335-2014
      - onvif-profile-g
      - basler-camera-selection-guide-2023
      - sony-brc-ptz-ip-camera-family
  - rule_id: validate_exclusions
    applies_to: "Product scope"
    rule: "Reject digital still cameras, video camera recorders/camcorders, mobile-phone camera modules, loose components, standalone recorders and products assigned to another CPC leaf."
    source_ids:
      - unstats-cpc-3-0
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Confirm exactly 1 kg net unpackaged accepted camera mass and separate packaging and separately supplied accessories."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "Confirm component/subassembly supply, assembly/configuration/test, production losses, packaging and factory-gate release are represented or explicitly linked and justified."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_mass_reconciliation
    applies_to: "BOM, outputs and wastes"
    rule: "Reconcile component/material inputs with net product, included accessories, packaging, rejects, rework, scrap and stock changes without double counting."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_allocation_disclosure
    applies_to: "Shared operations and recycling"
    rule: "Confirm allocation was first avoided, each remaining driver is causal and disclosed, and recycling burdens/credits use one consistent stated method."
    source_ids:
      - ghg-protocol-product-standard-2011
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_family_extrapolation
    applies_to: "Multi-model or portfolio result"
    rule: "Reject category-wide or family-wide results derived from one narrow model without qualification matrix, configuration-specific data and documented weighting/extrapolation rule."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - ebu-tech-3335-2014
  - rule_id: validate_data_quality
    applies_to: "Foreground and supplier data"
    rule: "Confirm reporting period/site coverage, measurement evidence, supplier specificity, proxy disclosures, exclusion register and material/substance evidence are present; otherwise report validation as incomplete."
    source_ids:
      - iec-62474-2018
      - eu-weee-2012-19-eu
      - eu-rohs-2011-65-eu
published_dataset_profile:
  dataset_role: "Foreground production data package for a declared CPC 47213 television-camera configuration or a documented homogeneous product family"
  downstream_use: "Construction of TianGong LCA process and lifecyclemodel projections and separately declared use or end-of-life scenarios"
  allowed_use: "Configuration-specific or qualified-family cradle-to-factory-gate modelling with linked upstream datasets and disclosed allocation/data quality"
  excluded_use: "Automatic representation of digital cameras, camcorders/recorders, mobile camera modules, standalone parts, another CPC leaf, or the entire television-camera category from one model"
  required_metadata: "Reference flow UUID and unit identities; CPC code; application/form; sensor/optics; resolution/frame rate; recording/network; power/accessories; enclosure/PCB/thermal configuration; packaging; sites/geography; period; route; market state; allocation and family rule"
  required_quality_disclosure: "Primary-data share and coverage; supplier/BOM completeness; exclusions; proxies and mismatches; measurement and mass-balance evidence; uncertainty or limitation; family weighting; applicable material/substance declarations"
  update_trigger: "Material change in classification, reference flow identity, camera configuration, sensor/optics, performance mode, recording/network or power architecture, BOM/materials, production site/route, packaging, allocation method, supplier data, regulations, or represented family"
