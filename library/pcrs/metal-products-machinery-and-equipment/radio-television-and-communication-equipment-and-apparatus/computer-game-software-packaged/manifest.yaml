  unresolved:
    inventory_flow_uuids:
      - row_id: rigid_polypropylene_media_case
        reason_code: no_exact_candidate
        explanation: "Five public state-100 candidates were directly read; none identified a finished rigid polypropylene media case rather than resin, chips, textile, diaphragm or recycled granules."
      - row_id: rejected_optical_media
        reason_code: no_exact_candidate
        explanation: "Three public state-100 waste candidates were directly read; none specifically identified rejected optical data media."
      - row_id: rejected_magnetic_media
        reason_code: no_exact_candidate
        explanation: "Four public state-100 waste candidates were directly read; none specifically identified rejected magnetic data-storage media."
    range_evidence_needs:
      - row_id: development_electricity
        explanation: "No two independent, original-text-verified sources with compatible software-development boundaries and per-kg packaged-product allocation were available; collect foreground electricity and allocation records."
      - row_id: replication_packaging_electricity
        explanation: "No two independent, boundary-compatible sources established an empirical electricity range for combined media replication and unit packaging; collect metered batch electricity."
      - row_id: unrecorded_optical_media
        explanation: "No two independent sources established a compatible optical-medium input-mass range per kg of finished packaged game software; collect batch input and reject masses."
      - row_id: unrecorded_magnetic_media
        explanation: "No two independent sources established a compatible magnetic-medium input-mass range per kg of finished packaged game software; collect batch input and reject masses."
      - row_id: rigid_polypropylene_media_case
        explanation: "Packaging form and mass are product-specific, and no two independent compatible sources supported an empirical range; collect actual case mass."
      - row_id: paper_box
        explanation: "Packaging construction and mass are product-specific, and no two independent compatible sources supported an empirical range; collect actual paper-box mass."
      - row_id: packaging_paper_insert
        explanation: "Insert presence, page count and paper mass are product-specific, and no two independent compatible sources supported an empirical range; collect actual insert mass."
      - row_id: rejected_optical_media
        explanation: "No two independent compatible sources supported an optical-media reject-rate range; collect reject mass by batch."
      - row_id: rejected_magnetic_media
        explanation: "No two independent compatible sources supported a magnetic-media reject-rate range; collect reject mass by batch."
      - row_id: polypropylene_case_waste
        explanation: "No two independent compatible sources supported a case-reject waste range; collect actual rejected-case mass."
      - row_id: paper_packaging_waste
        explanation: "No two independent compatible sources supported a paper-packaging reject waste range; collect actual waste mass."
