  - rule_id: validate_development_hardware
    applies_to: "development/build hardware"
    rule: "Confirm the materiality assessment covers every development, build, storage, network and test device in the declared release boundary. Each material device shall appear as a separate atomic product exchange with actual identity, upstream LCA link, expected life, time share and resource share; each excluded device shall have a quantitative cut-off basis and approval."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: validate_mass_balance
    applies_to: "media and packaging"
    rule: "Reconcile input, return, accepted-product component and reject masses for the selected route; investigate and disclose residuals."
    source_ids: []
  - rule_id: validate_unresolved_uuid
    applies_to: "UUID-empty rows"
    rule: "Confirm unresolved UUID rows remain specifically named and review metadata records the no-exact-candidate findings; do not substitute a proxy UUID."
