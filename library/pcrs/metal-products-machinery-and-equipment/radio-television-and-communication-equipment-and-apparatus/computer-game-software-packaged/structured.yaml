allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "Prefer subdivision and direct metering by software release, production line and batch before applying allocation."
    source_ids: []
  - rule_id: allocation_development
    applies_to: "shared development/build electricity"
    rule: "Allocate measured supporting-resource electricity by documented CPU time, workstation hours or another causal activity measure attributable to the declared release; if no causal measure exists, use a disclosed time-based share and justify it."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_development_hardware
    applies_to: "material development/build hardware"
    rule: "For each separately identified device, allocate the linked hardware inventory by both the fraction of expected device life reserved for the release and the fraction of device resources reserved for the release. Preserve actual device identity and do not allocate downstream gameplay hardware unless it was also used to produce or test the release."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_replication
    applies_to: "shared replication and packaging operations"
    rule: "Allocate shared batch electricity and materials by accepted packaged-product mass when products use the same equipment; use a documented causal machine-time basis when routes materially differ."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "waste and recycling outputs"
    rule: "Apply cut-off at the point the waste leaves the foreground boundary unless an avoided-burden expansion is explicitly declared; do not credit potential recycling in the default dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_development_electricity
      process_id: "software_development_build"
      flow_role: "development_electricity"
      record_type: "meter, utility invoice and workload-allocation record"
      raw_fields: "meter period; kWh; site; equipment scope; release identifier; CPU time or workstation hours; allocation share"
      collection_method: "Reconcile meter or invoice totals to the declared period, subtract excluded loads, then apply the documented release-specific allocation driver."
      unit: "kWh raw; MJ reported"
      frequency: "monthly and at release close"
      temporal_coverage: "full declared development/build period"
      site_scope: "all included development and build sites"
      aggregation_rule: "sum attributable kWh by site and period before conversion and reference-flow normalization"
      quality_evidence: "meter export or invoice; equipment scope; allocation worksheet; reconciliation sign-off"
    - protocol_id: cp_development_hardware_materiality
      process_id: "software_development_build"
      flow_role: "dataset-added atomic development-hardware product inputs"
      record_type: "device register, materiality screen, upstream LCA link and allocation record"
      raw_fields: "actual device type; manufacturer and model or provider resource identity; function; site or cloud region; Tiangong product-flow UUID when exact; upstream dataset; supplier reference unit; total device inventory amount; commissioning and retirement dates or expected life; time reserved for release; resources reserved; total resources; screening result; cut-off; justification"
      collection_method: "Screen every device used for development, build, storage, networking and testing. Add one atomic product exchange for each material device and apply the documented time-share and resource-share allocation; retain a quantitative justification and approval for every cut-off."
      unit: "each device's supplier-dataset reference unit; allocated fraction dimensionless"
      frequency: "at release close and whenever the hardware estate or allocation changes"
      temporal_coverage: "full declared development/build period"
      site_scope: "every included site, cloud allocation and test environment"
      aggregation_rule: "preserve device-level records; aggregate only after separate identity, upstream link and allocation have been calculated"
      quality_evidence: "device or provider inventory; procurement/configuration record; upstream LCA metadata; expected-life evidence; reservation logs; materiality worksheet; cut-off approval"
    - protocol_id: cp_replication_electricity
      process_id: "media_replication_packaging"
      flow_role: "replication_packaging_electricity"
      record_type: "meter and production-batch record"
      raw_fields: "opening and closing reading; kWh; batch id; operating time; excluded loads; accepted mass"
      collection_method: "Reconcile interval electricity to production records and deduct documented non-production loads."
      unit: "kWh raw; MJ reported"
      frequency: "each batch or metered campaign"
      temporal_coverage: "representative production period"
      site_scope: "each replication and packaging site"
      aggregation_rule: "sum batch-attributable kWh, then normalize by accepted packaged-product mass"
      quality_evidence: "meter record; batch log; downtime and exclusion record"
    - protocol_id: cp_media_mass
      process_id: "media_replication_packaging"
      flow_role: "unrecorded_optical_media; unrecorded_magnetic_media"
      record_type: "issue, return and scale record"
      raw_fields: "route; supplier item; lot; issued count; returned count; average item mass; issued mass; rejected mass"
      collection_method: "Reconcile stores issues and returns to scale measurements; include exactly one declared media route."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative production period"
      site_scope: "each replication site"
      aggregation_rule: "issued mass minus documented returns; retain rejects separately"
      quality_evidence: "calibrated-scale record; stock reconciliation; route declaration"
    - protocol_id: cp_case_mass
      process_id: "media_replication_packaging"
      flow_role: "rigid_polypropylene_media_case"
      record_type: "issue and scale record"
      raw_fields: "case specification; issued count; returned count; average case mass; rejected count"
      collection_method: "Measure a representative sample and reconcile item counts to issued mass."
      unit: "kg"
      frequency: "each packaging batch where applicable"
      temporal_coverage: "representative production period"
      site_scope: "each packaging site"
      aggregation_rule: "net issued count × measured average mass; retain rejected-case waste separately"
      quality_evidence: "sample record; scale calibration; stock reconciliation"
    - protocol_id: cp_paper_box_mass
      process_id: "media_replication_packaging"
      flow_role: "paper_box"
      record_type: "issue and scale record"
      raw_fields: "box specification; issued count; returned count; average box mass; rejected count"
      collection_method: "Measure a representative sample and reconcile item counts to issued mass."
      unit: "kg"
      frequency: "each packaging batch where applicable"
      temporal_coverage: "representative production period"
      site_scope: "each packaging site"
      aggregation_rule: "net issued count × measured average mass; retain paper rejects separately"
      quality_evidence: "sample record; scale calibration; stock reconciliation"
    - protocol_id: cp_paper_insert_mass
      process_id: "media_replication_packaging"
      flow_role: "packaging_paper_insert"
      record_type: "issue and scale record"
      raw_fields: "insert specification; page count; issued count; returned count; average insert mass"
      collection_method: "Measure the complete insert supplied per package and reconcile counts."
      unit: "kg"
      frequency: "each packaging batch where applicable"
      temporal_coverage: "representative production period"
      site_scope: "each packaging site"
