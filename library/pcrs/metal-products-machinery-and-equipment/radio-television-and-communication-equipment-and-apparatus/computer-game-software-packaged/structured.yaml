validation_rules:
  - rule_id: validate_identity_boundary
    applies_to: "product and boundary"
    rule: "Confirm CPC 47822 packaged game software on magnetic or optical media and reject cartridges, downloads, online games and non-game software."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Confirm the accepted output is exactly 1 kg and contains the recorded medium plus all declared unit packaging, with shipping packaging excluded."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "media inputs and rejects"
    rule: "Confirm exactly one optical or magnetic media route is declared and only route-applicable media rows are included."
    source_ids: []
  - rule_id: validate_atomic_flows
    applies_to: "inventory"
    rule: "Confirm every included exchange is one atomic flow and conditional components are marked not applicable when absent."
    source_ids: []
  - rule_id: validate_energy_allocation
    applies_to: "electricity"
    rule: "Reconcile raw energy records, the 3.6 MJ/kWh conversion, excluded loads and the documented development and batch allocation drivers."
