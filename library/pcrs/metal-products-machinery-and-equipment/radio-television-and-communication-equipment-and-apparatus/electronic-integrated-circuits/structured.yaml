  - id: final_test_delivery
    name: "Final test and delivery preparation"
    inclusion: "required"
    inclusion_condition: "Always included for the saleable delivery state"
    role: "Foreground burn-in when applicable, final electrical test, marking, accepted-output measurement and shipment preparation"
    quantitative_reference: "1 kg accepted electronic integrated circuits"
