measurement_rules:
  - id: reference_mass
    applies_to: "accepted reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net mass of accepted delivered ICs. Include die, encapsulant, package substrate or leadframe, interconnects, terminals, lids and integrated heat spreaders that are part of the delivered device; record transport packaging separately."
  - id: count_to_mass
    applies_to: "unit-count production records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert accepted device count to mass using lot- or product-family-specific measured net mass per accepted device. Do not use a single catalogue device mass for a multi-product production mix."
  - id: wafer_area_traceability
    applies_to: "wafer fabrication and die yield"
    required_property_ref:
      name: "Area and Mass"
      uuid: ""
    required_unit: "m2 and kg"
    rule: "Retain wafer diameter, processed wafer area, gross die count, known-good die count, die area and sequential yields. Convert wafer-level records to the reference mass only through the traced accepted-output calculation."
  - id: family_parameterization
    applies_to: "all foreground records"
    required_property_ref:
      name: "Not applicable"
      uuid: ""
    required_unit: "declared metadata"
    rule: "Stratify records at least by IC family or dominant function, technology node or process generation, substrate material, wafer diameter, die area, die count, package route and delivery state; aggregate only with production weights for the declared reporting period."
  - id: energy_conversion
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the invoiced or metered unit. If conversion is required, use 1 kWh = 3.6 MJ, retain the original record, and avoid mixing electricity with thermal fuel energy."
  - id: gas_and_liquid_conversion
    applies_to: "process gases, chemicals, water and wastewater"
    required_property_ref:
      name: "Mass or Volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Preserve measured mass or volume and physical state; where conversion is necessary, use batch-specific density and conditions and retain the original quantity and conversion basis."
  - id: direct_emission_speciation
    applies_to: "fab and test direct emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg per emitted substance"
    rule: "Record each fluorinated GHG, N2O, regulated hazardous air pollutant and fugitive heat-transfer fluid as a separate elementary flow. Do not report purchased gas as emitted gas without measured or method-based utilization, by-product and abatement treatment."
process_map:
