allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_manufacturing"
    rule: "First subdivide records by site, reporting period, IC family or dominant function, technology node or process generation, substrate and wafer diameter, die-area class, package route and delivery state whenever separately measured."
    source_ids:
      - iso-14044-2006
      - proske-et-al-2024-die-area
  - rule_id: allocation_wafer_fab_driver
    applies_to: "shared_wafer_fabrication"
    rule: "Allocate shared wafer-fabrication inputs and emissions using a documented causal engineering driver such as processed wafer area combined with route-specific process steps, mask layers, tool time or measured chamber consumption. Do not allocate a broad fab mix from one wafer or one device."
    source_ids:
      - iso-14044-2006
      - proske-et-al-2024-die-area
  - rule_id: allocation_assembly_test_driver
    applies_to: "shared_assembly_and_test"
    rule: "Allocate package, assembly and test burdens using route-specific measured material issue, equipment time, test time, energy or another demonstrated causal driver; accepted-unit count is allowed only for materially equivalent routes."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_yield_losses
    applies_to: "sequential_yield"
    rule: "Assign substrate, materials, utilities, direct emissions and treatment burdens of rejected wafers, die and packages to the accepted outputs of the same production stratum through sequential yield reconciliation."
    source_ids:
      - iso-14044-2006
      - proske-et-al-2024-die-area
  - rule_id: allocation_category_aggregation
    applies_to: "reference_product_mix"
    rule: "Aggregate strata only with accepted-output mass for the declared reporting period after each stratum is normalized. Report family shares and do not infer unrepresented families from a narrow product dataset."
    source_ids:
      - wsts-product-classification-2021
      - proske-et-al-2024-die-area
  - rule_id: allocation_recovery
    applies_to: "recovered_materials_and_energy"
    rule: "Report recovered materials, exported energy and external recycling consistently with the declared LCA method; disclose the substitution or cut-off convention and prevent double counting between avoided burdens, waste treatment and co-product credit."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_fab_materials
      process_id: "wafer_fabrication"
      flow_role: "substrate, chemicals and patterning materials"
      record_type: "purchase, warehouse issue, recipe and tool-delivery records"
      raw_fields: "material identity; supplier; lot; mass or volume; density and conditions; wafer material, diameter and count; process stratum"
      collection_method: "reconcile purchases, stock change, issues and returned material; preserve substance or mixture identity"
      unit: "kg, m3, m2, item"
      frequency: "monthly and lot-level"
      temporal_coverage: "full reporting period with opening and closing stock"
      site_scope: "every included fab"
      aggregation_rule: "sum by material and production stratum, then normalize through sequential yield"
      quality_evidence: "purchase records, calibrated delivery systems, inventory reconciliation and recipe revision history"
    - protocol_id: cp_fab_utilities
      process_id: "wafer_fabrication"
      flow_role: "electricity, fuels and water"
      record_type: "utility meter and facility balance records"
      raw_fields: "meter id; interval; electricity; fuel; make-up water; recirculated water; discharge; allocation driver"
      collection_method: "use submetered tool or area data where available; otherwise reconcile facility totals to documented cleanroom and process drivers"
      unit: "kWh, MJ, kg, m3"
      frequency: "at least monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every included fab and utility system"
      aggregation_rule: "sum by utility and production stratum; do not net recirculated water against withdrawal without disclosure"
      quality_evidence: "meter calibration, invoices, facility balance and coverage log"
    - protocol_id: cp_fab_gases_emissions
      process_id: "wafer_fabrication"
      flow_role: "process-gas input, by-products, direct emissions and abatement"
      record_type: "gas delivery, point-of-use, recipe, stack test, abatement and downtime records"
      raw_fields: "gas identity; input mass; process type; utilization; by-products; abatement connection; DRE; uptime; stack measurement; emission method"
      collection_method: "measure by substance where available; otherwise apply a documented regulatory or facility engineering model to measured inputs"
      unit: "kg per substance"
      frequency: "batch or monthly; abatement downtime event-level"
      temporal_coverage: "full reporting period"
      site_scope: "every included fab, process type and abatement system"
      aggregation_rule: "calculate each gas and by-product separately and sum after abatement; retain controlled and uncontrolled periods"
      quality_evidence: "calibrated mass-flow or purchase reconciliation, stack-test report, abatement maintenance and downtime log"
    - protocol_id: cp_fab_output_yield
      process_id: "wafer_fabrication"
      flow_role: "fabricated-wafer output and front-end yield"
      record_type: "manufacturing execution and wafer genealogy records"
      raw_fields: "wafer id; diameter; processed area; route; node; gross die count; completed wafer count; scrap; transfer destination"
      collection_method: "preserve wafer genealogy and link completed wafers to downstream accepted die and product"
      unit: "wafer, m2, kg, item"
      frequency: "per wafer lot"
      temporal_coverage: "full reporting period"
      site_scope: "every included fab and production stratum"
      aggregation_rule: "calculate processed area and traced output per stratum before reference-flow normalization"
      quality_evidence: "MES extract, lot traveler, route revision and yield reconciliation"
    - protocol_id: cp_fab_waste
      process_id: "wafer_fabrication"
      flow_role: "wastewater, spent chemicals, solids and off-spec wafers"
      record_type: "waste manifests, treatment meters and laboratory records"
      raw_fields: "waste identity; hazardous status; mass or volume; concentration where relevant; destination; treatment; recovery"
      collection_method: "reconcile on-site treatment inputs and outputs with external shipments and wastewater discharge"
      unit: "kg, m3"
      frequency: "monthly and shipment-level"
      temporal_coverage: "full reporting period"
      site_scope: "every included fab and treatment system"
      aggregation_rule: "sum separately by waste identity and destination; no netting against recovered output without allocation disclosure"
      quality_evidence: "manifests, scale tickets, discharge meters, laboratory analyses and treatment logs"
    - protocol_id: cp_sort_inputs
      process_id: "wafer_sort_dicing"
      flow_role: "sort and dicing utilities and consumables"
      record_type: "meters, purchase and issue records"
      raw_fields: "electricity; water; blade or wire; tape; carrier; cleaning material; lot and route"
      collection_method: "reconcile meter and issued quantities to processed wafer lots"
      unit: "kWh, kg, item"
      frequency: "lot-level or monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every included sort and dicing site"
      aggregation_rule: "sum by route and normalize through accepted-die yield"
      quality_evidence: "meter records, issue logs, lot travelers and stock reconciliation"
    - protocol_id: cp_sort_yield
      process_id: "wafer_sort_dicing"
      flow_role: "fabricated-wafer input, known-good die and rejects"
      record_type: "wafer map, probe, dicing and die genealogy records"
      raw_fields: "wafer id; gross dies; tested dies; known-good dies; die area; accepted die mass; reject class; kerf and residues"
      collection_method: "link wafer maps and singulation results to die transferred to assembly"
      unit: "item, mm2, kg"
      frequency: "per wafer lot"
      temporal_coverage: "full reporting period"
      site_scope: "every included sort and dicing site"
      aggregation_rule: "calculate known-good die output and rejected mass by stratum; reconcile with fabricated-wafer input"
      quality_evidence: "wafer map, probe result, calibrated dimensional data and reject disposition"
    - protocol_id: cp_assembly_materials_yield
      process_id: "assembly_packaging"
      flow_role: "die input, package materials, output and rejects"
      record_type: "bill-of-material, issue, genealogy, equipment and reject records"
      raw_fields: "die count and area; package route; each material mass; assembled units; accepted units; reject mass and cause"
      collection_method: "reconcile material issues and die genealogy to packaged output by route"
      unit: "kg, item, mm2"
      frequency: "per assembly lot"
      temporal_coverage: "full reporting period"
      site_scope: "every included assembly site and route"
      aggregation_rule: "calculate package-route material input, output and reject balance before reference-flow normalization"
      quality_evidence: "approved BOM, lot genealogy, scale records, MES yield and reject disposition"
    - protocol_id: cp_assembly_utilities
      process_id: "assembly_packaging"
      flow_role: "assembly energy, water and consumables"
      record_type: "meters, recipes, purchase and issue records"
      raw_fields: "electricity; fuel; water; process gas; chemical; equipment time; package route"
      collection_method: "use submeters where available and document causal allocation where utilities are shared"
      unit: "kWh, MJ, kg, m3, h"
      frequency: "lot-level or monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every included assembly site"
      aggregation_rule: "sum by route and allocate with measured equipment time or other causal driver"
      quality_evidence: "meter calibration, invoices, recipe history and allocation workbook"
    - protocol_id: cp_final_test_output
      process_id: "final_test_delivery"
      flow_role: "test input, accepted reference product and rejects"
      record_type: "test-handler, burn-in, outgoing quality and mass records"
      raw_fields: "input units; test route and duration; accepted units; reject class; measured net unit mass; delivery state; family qualifiers"
      collection_method: "reconcile test input to accepted and rejected output; determine net accepted mass by representative measurement"
      unit: "item, h, kg"
      frequency: "per final-test lot"
      temporal_coverage: "full reporting period"
      site_scope: "every included final-test site"
      aggregation_rule: "sum accepted net product mass by stratum; normalize all strata to exactly 1 kg accepted output"
      quality_evidence: "test logs, calibration, sampling plan, outgoing release and mass reconciliation"
    - protocol_id: cp_test_utilities_emissions
      process_id: "final_test_delivery"
      flow_role: "test electricity, cooling and heat-transfer-fluid emissions"
      record_type: "meters, HTF inventory, purchase, recovery and disposition records"
      raw_fields: "electricity; fuel; cooling; HTF identity; opening and closing stock; purchases; recovery; disposal; leaks"
      collection_method: "meter energy and calculate substance-specific HTF loss from complete inventory balance"
      unit: "kWh, MJ, kg"
      frequency: "monthly and leak-event-level"
      temporal_coverage: "full reporting period"
      site_scope: "every included final-test site"
      aggregation_rule: "sum by test route; report each emitted HTF separately"
      quality_evidence: "meters, inventory ledger, maintenance, leak and disposal records"
    - protocol_id: cp_delivery_packaging
      process_id: "final_test_delivery"
      flow_role: "delivery packaging"
      record_type: "packaging BOM, issue and shipment records"
      raw_fields: "material; component; mass; units per tray, reel or carton; accepted product mass"
      collection_method: "reconcile packaging issue to accepted shipments; exclude packaging from reference-product net mass"
      unit: "kg, item"
      frequency: "shipment or monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every included delivery site"
      aggregation_rule: "sum by material and normalize to accepted product mass"
      quality_evidence: "approved packaging specification, issue and shipment records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = stratum amount / accepted net reference-product mass for the same stratum; production-mix result = sum of normalized stratum amounts weighted by accepted stratum mass share"
      inputs:
        - "collected stratum amount"
        - "accepted net product mass"
        - "mass share"
      output: "amount per 1 kg accepted IC"
      source_ids:
        - iso-14044-2006
    - id: calc_count_to_mass
      applies_to: "accepted and intermediate device counts"
      rule: "mass = accepted or transferred device count multiplied by the measured representative net mass per device for the same product and delivery-state stratum"
      inputs:
        - "device count"
        - "sampling result for net unit mass"
      output: "kg of devices"
      source_ids: []
    - id: calc_sequential_yield
      applies_to: "wafer, die, assembly and test genealogy"
      rule: "retain front-end completion, sort, assembly and final-test yields separately; input required per accepted output is calculated from actual genealogy and shall not be replaced by one overall generic yield"
      inputs:
        - "wafer starts"
        - "completed wafers"
        - "gross and known-good dies"
        - "assembled and tested units"
        - "accepted units"
      output: "traced inputs, rejects and intermediate transfers per accepted output"
      source_ids:
        - proske-et-al-2024-die-area
    - id: calc_direct_fgas
      applies_to: "fluorinated GHG and N2O emissions"
      rule: "calculate each input-gas and by-product emission from measured input, process-specific utilization and by-product formation, abatement connection, destruction or removal efficiency and downtime, or use validated stack measurement; identify the method and factor version"
      inputs:
        - "substance input"
        - utilization
        - "by-product factors"
        - DRE
        - uptime
        - "stack measurements"
      output: "kg emitted per substance"
      source_ids:
        - us-epa-ghgrp-subpart-i
        - us-epa-semiconductor-industry
    - id: calc_htf_inventory
      applies_to: "fluorinated heat-transfer-fluid emissions"
      rule: "fugitive emission = opening stock + purchases + other receipts - closing stock - quantities returned, recovered for reuse, destroyed or transferred off site, adjusted for documented inventory corrections"
      inputs:
        - "complete HTF inventory and disposition records"
      output: "kg emitted per HTF substance"
      source_ids:
        - us-epa-ghgrp-subpart-i
    - id: calc_mass_reconciliation
      applies_to: "each foreground process"
      rule: "reconcile product and material inputs with product outputs, separately identified wastes, wastewater, emissions and documented stock change; investigate rather than silently balancing unexplained differences"
      inputs:
        - "mass inputs"
        - outputs
        - wastes
        - emissions
        - "stock change"
      output: "reconciliation difference and corrective explanation"
      source_ids:
        - iso-14044-2006
    - id: calc_family_assignment
      applies_to: "IC family metadata"
      rule: "assign logic/micro, memory, analog or mixed-signal according to marketed function and dominant-function rules; document the decision for multifunction devices"
      inputs:
        - "product specification"
        - "dominant function"
        - "die-area or functional evidence"
      output: "declared IC family stratum"
      source_ids:
        - wsts-product-classification-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Preserve product-family definitions, dominant function, node or process generation, substrate, wafer diameter, die area and count, package route, delivery state, test criterion and Tiangong reference UUID."
      evidence: "product specifications, route records, test release and reference-flow review"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Cover one representative reporting period and identify shutdown, ramp, qualification, abnormal-yield and abatement-downtime periods; justify any shorter campaign."
      evidence: "dated meters, MES, inventory and maintenance records"
    - id: dq_geography
      applies_to: "multi-site production"
      requirement: "Identify fab, sort, assembly and test geography and the electricity and upstream market used at each site; do not label a global or national average without production weights."
      evidence: "site list, supplier records, electricity contracts and accepted-output mass shares"
    - id: dq_completeness
      applies_to: "material and emission inventory"
      requirement: "Reconcile all major substrate, chemical, gas, water, energy, package-material, waste, wastewater and direct-emission records; record missing coverage and do not fill it with a narrow chip or wafer proxy."
      evidence: "purchase-to-stock balances, meters, waste manifests, emissions model and reconciliation report"
    - id: dq_yield
      applies_to: "sequential production"
      requirement: "Preserve wafer, die, assembly and final-test genealogy and yields so rejected production burdens remain assigned to accepted output of the same stratum."
      evidence: "wafer maps, lot genealogy, assembly and test yield reports"
    - id: dq_direct_emissions
      applies_to: "fluorinated gases, N2O, HAPs and HTFs"
      requirement: "Document substance identity, process type, calculation or measurement method, abatement routing, DRE evidence, uptime and by-product treatment; disclose any regulatory default factor and version."
      evidence: "stack tests, mass-flow or purchase records, abatement and method records"
    - id: dq_technology
      applies_to: "category aggregation"
      requirement: "Demonstrate representation of every claimed IC family and materially different node, die-area, substrate, package and geography stratum; unrepresented families shall be excluded from the dataset claim."
      evidence: "production mix, product master, route matrix and coverage assessment"
    - id: dq_source_traceability
      applies_to: "external and upstream data"
      requirement: "Retain source version, geography, technology, age, access date and substitution rationale for every upstream dataset and external method."
      evidence: "dataset registry and source log"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Reference output shall be exactly 1 kg of accepted bc98e461-2434-4229-8788-7ffb5c4b9a2e using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset_metadata"
    rule: "Reject a package missing any required family, function, node, substrate, wafer, die, package or bare-die state, test, geography, reporting-period, electricity-mix or abatement qualifier."
    source_ids:
      - wsts-product-classification-2021
      - proske-et-al-2024-die-area
  - rule_id: validate_delivery_state
    applies_to: "reference_product"
    rule: "Verify that reference output is a saleable electrically tested IC and that packaged or tested-bare-die delivery state is explicit; reject an untested wafer, intermediate die, smart-card module, leadframe, PCB or complete equipment proxy."
    source_ids:
      - us-epa-semiconductor-neshap
      - wsts-product-classification-2021
  - rule_id: validate_no_narrow_proxy
    applies_to: "representativeness"
    rule: "Reject a category-average claim derived from one chip, one wafer, one family, one package, one application or one route unless the dataset claim is explicitly narrowed to that stratum."
    source_ids:
      - proske-et-al-2024-die-area
      - wsts-product-classification-2021
  - rule_id: validate_process_coverage
    applies_to: "process_inventory"
    rule: "Verify route coverage for wafer fabrication, sort and dicing, assembly and packaging or declared tested-bare-die handling, final test, delivery preparation, wastes, wastewater and direct emissions."
    source_ids:
      - us-epa-semiconductor-neshap
      - epd-international-pcr-2024-06
  - rule_id: validate_yield_and_mass
    applies_to: "calculation_results"
    rule: "Require sequential yield reconciliation and process mass reconciliation; investigate unexplained differences and prohibit zero-loss assumptions without measured evidence."
    source_ids:
      - iso-14044-2006
      - proske-et-al-2024-die-area
  - rule_id: validate_direct_gases
    applies_to: "fab_and_test_emissions"
    rule: "When fluorinated gases, N2O or HTFs are used, require substance-specific input and emission records, by-product treatment, abatement DRE and downtime; reject purchased-gas-equals-emission shortcuts unless the cited method explicitly requires that conservative case."
    source_ids:
      - us-epa-semiconductor-industry
      - us-epa-ghgrp-subpart-i
  - rule_id: validate_allocation
    applies_to: "shared_burdens"
    rule: "Require subdivision or a documented causal allocation driver for shared fab, assembly and test burdens and require accepted-output mass weights for final aggregation; reject an undocumented mass, revenue or single-wafer proxy."
    source_ids:
      - iso-14044-2006
      - proske-et-al-2024-die-area
  - rule_id: validate_foreground_evidence
    applies_to: "quantitative_inventory"
    rule: "Require foreground records for all quantities in this PCR. Do not substitute uncited generic values or provisional estimates for missing product-family, node, site, yield, utility, material or emission data."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
published_dataset_profile:
  dataset_role: "Cradle-to-manufacturing-gate foreground data package that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Construction of process and lifecyclemodel inventories for computing, communications, power electronics, intelligent devices and other systems consuming electronic integrated circuits"
  allowed_use: "Use for the declared IC family, node or process-generation range, substrate, wafer diameter, die construction, package or bare-die delivery state, geography, reporting period and production mix; aggregation is allowed only with compatible strata and explicit mass weights"
  excluded_use: "Do not use as a proxy for semiconductor wafers, discrete devices, smart-card modules, printed circuit boards or complete equipment; do not support comparative claims across materially different performance, family, node, die-area, package, geography or abatement profiles without equivalence review"
  required_metadata: "All reference-flow qualifiers; included sites and route shares; foreground and upstream boundary; sequential yields; allocation drivers; electricity mixes; abatement systems; dataset and source versions; cut-offs; data gaps; uncertainty and representativeness assessment"
  required_quality_disclosure: "Coverage by family and production stratum; temporal and geographic coverage; measured versus calculated shares; material and yield reconciliation; direct-gas method and factor versions; abatement DRE and downtime evidence; unresolved flow UUIDs; excluded operations and missing data"
  update_trigger: "Material change in family mix, technology node, substrate or wafer diameter, die area or chiplet construction, package route, site or electricity mix, process chemistry, yield, abatement configuration, allocation method, regulatory emissions method, or evidence older than the declared representativeness period"
data_sources:
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management - Life cycle assessment - Requirements and guidelines, confirmed 2022, https://www.iso.org/standard/38498.html (retrieved 2026-08-09)"
    used_for: "LCI scope, data quality, allocation, mass balance, reporting and review rules"
  - id: "iec-63366-2025"
    type: "standard"
    reference: "IEC 63366:2025, Product category rules for life cycle assessment of electrical and electronic products and systems, https://webstore.iec.ch/en/publication/67691 (retrieved 2026-08-09)"
    used_for: "Horizontal EEPS PCR, complementary product-specific rules, scenarios and environmental-declaration context"
  - id: "epd-international-pcr-2024-06"
    type: "standard"
    reference: "International EPD System PCR 2024:06, Electronic and electric equipment, and electronic components (non-construction), version 1.0.1, valid to 2029-10-28, https://www.environdec.com/pcr-library/pcr_23d2c7b4-04cd-4a57-8ca7-08d9b348866f (retrieved 2026-08-09)"
    used_for: "Electronics-sector scope, declared-unit use and manufacturing-gate dataset profile"
  - id: "wsts-product-classification-2021"
    type: "official_guidance"
    reference: "World Semiconductor Trade Statistics, Product Classification 2021, Semiconductor Industry Association, https://www.semiconductors.org/wp-content/uploads/2021/02/Product_Classification_2021.pdf (retrieved 2026-08-09)"
    used_for: "Logic/micro, memory, analog and dominant-function family parameterization and exclusions"
  - id: "us-epa-semiconductor-neshap"
