system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The dataset is cradle-to-manufacturing-gate for the declared IC production mix. Foreground records shall include cleanroom and production-tool utilities, process materials and gases, yield losses, internal material transfers, direct emissions, wastewater, wastes, and on-site abatement or treatment. Upstream datasets shall cover every purchased product or service that crosses the boundary. Shipping from the manufacturing gate, downstream board assembly, device use, and end-of-life are excluded unless a wider study scope is explicitly declared."
      source_ids: []
    - rule_id: boundary_complete_route
      applies_to: "foreground_process_chain"
      rule: "Include wafer fabrication, wafer sort and dicing, assembly and packaging, final electrical test, yield losses, direct emissions, and preparation of accepted product for delivery for every route represented in the reference product."
      source_ids:
        - us-epa-semiconductor-neshap
        - epd-international-pcr-2024-06
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased_inputs"
      rule: "Link every purchased substrate, wafer, chemical, gas, utility, packaging material and treatment service to an upstream dataset or a documented foreground operation; do not omit a major input because no generic IC quantity is available."
      source_ids:
        - iso-14044-2006
        - iec-63366-2025
    - rule_id: boundary_family_strata
      applies_to: "category_mix"
      rule: "Keep logic/micro, memory, analog and mixed-signal strata and materially different node, substrate, die-area, package and geography routes separate until production-weighted aggregation."
      source_ids:
        - wsts-product-classification-2021
        - proske-et-al-2024-die-area
    - rule_id: boundary_no_proxy
      applies_to: "representativeness"
      rule: "Do not use one device, one wafer, one package technology, one application, or one manufacturing route as an undeclared proxy for this broad category."
      source_ids:
        - wsts-product-classification-2021
        - proske-et-al-2024-die-area
    - rule_id: boundary_direct_gases
      applies_to: "wafer_fabrication_and_test"
      rule: "Include fluorinated process gases, fluorinated heat-transfer fluids, N2O, their by-products, and abatement-system operation and downtime whenever applicable; preserve substance-level emissions."
      source_ids:
        - us-epa-semiconductor-industry
        - us-epa-ghgrp-subpart-i
    - rule_id: boundary_excluded_stages
      applies_to: "downstream_and_capital"
      rule: "Exclude downstream board assembly, product use, distribution after the manufacturing gate and end-of-life from this dataset. Disclose and justify treatment of design, R&D, buildings and capital equipment, and include them only under an explicitly extended scope."
      source_ids:
        - epd-international-pcr-2024-06
        - iec-63366-2025
boundary_abstraction:
  declared_starting_condition: "Incoming semiconductor substrate or wafer and all purchased materials, utilities and services at the first foreground manufacturing gate, with supplier identity, physical state, production geography and upstream dataset reference declared"
  starting_condition_role: "Traceable upstream input to wafer fabrication; substrate or wafer production may be foreground only when the reporting organization operates and measures that stage"
  product_classification_scope: "Electronic integrated circuits across logic/micro, memory, analog and mixed-signal families; the concrete dataset is restricted to its declared family, process generation and delivery-state mix"
  recursive_input_rule: "An internally transferred fabricated wafer, known-good die or packaged IC is recorded once as an intermediate product flow between foreground processes and carries no duplicated upstream burden. A purchased IC of the same category is an upstream product dataset and shall not be treated as self-produced reference output."
  upstream_dataset_requirement: "Require geographically and technologically appropriate datasets for semiconductor substrates or wafers, electricity, fuels, ultrapure-water supply, chemicals, bulk and specialty gases, packaging materials, transport to the first foreground gate, and external waste or wastewater treatment"
  disclosure: "Declare included sites and operations; IC-family shares; process nodes; substrate and wafer diameter; package and tested-bare-die shares; yields; cut-offs; upstream dataset versions; allocation drivers; electricity mixes; abatement technologies, uptime and destruction or removal evidence; and any departure from this boundary"
