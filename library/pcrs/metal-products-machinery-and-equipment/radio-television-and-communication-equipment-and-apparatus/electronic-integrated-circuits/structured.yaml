    quantitative_reference: "Processed wafer area and known-good-die output normalized to accepted reference-product mass"
  - id: wafer_sort_dicing
    name: "Wafer sort and dicing"
    inclusion: "required"
    inclusion_condition: "Always included or represented by a supplier dataset when tested die are purchased"
    role: "Foreground wafer electrical sort, singulation and die acceptance"
    quantitative_reference: "Known-good die mass and area transferred to assembly per accepted reference-product mass"
  - id: assembly_packaging
    name: "Assembly and packaging"
    inclusion: "required"
    inclusion_condition: "Included for packaged devices; for tested bare-die delivery, record an explicit not-applicable package route while retaining handling and final-test operations"
    role: "Foreground die attach or bonding, interconnection, encapsulation or wafer-level packaging"
