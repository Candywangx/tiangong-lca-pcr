validation_rules:
  - rule_id: identity_check
    applies_to: "reference_product"
    rule: "Reject records missing model, mass/count reconciliation, recording architecture, test evidence or required qualifiers. Separate professional cameras and still-image cameras from this category."
    source_ids:
      - un-cpc-3-0-notes-2025
  - rule_id: inventory_check
    applies_to: "all_rows"
    rule: "Require measured or calculated quantities, protocol linkage, units, boundary-compatible upstream links and explicit applicability. Missing data are not zero. Prevent sensor double counting when supplied on the populated board."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: balance_check
    applies_to: "batch"
    rule: "Reconcile component receipts, stock changes, accepted equipment, rejects and packaging. Investigate differences against instrument uncertainty and BOM evidence; no unsupported universal tolerance is imposed."
    source_ids:
      - ghg-product-standard-2011
