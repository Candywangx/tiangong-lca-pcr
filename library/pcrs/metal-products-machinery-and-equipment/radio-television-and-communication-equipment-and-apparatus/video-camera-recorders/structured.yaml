allocation_rules:
  - rule_id: separate_models
    applies_to: "shared_production"
    rule: "Subdivide by model and metered operation before allocating shared burdens. Allocate unavoidable common equipment electricity using documented processing time and load; do not use product mass alone across camcorders and web cameras."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: yield_and_recycling
    applies_to: "rejects"
    rule: "Charge rework and manufacturing rejects to accepted output of the same lot. Report outgoing waste mass and treatment separately; no avoided virgin-production credit is assigned in the foreground manufacturing inventory. Disclose the downstream recycling method."
    source_ids:
      - ghg-product-standard-2011
