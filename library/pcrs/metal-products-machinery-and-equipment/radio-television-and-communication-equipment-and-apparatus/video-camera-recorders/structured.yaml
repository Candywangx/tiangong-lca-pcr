  market_state: "New, functional equipment at factory gate; product mass excludes transport packaging"
functional_unit:
  what: "Provide moving-image capture with declared local recording or host interface"
  how_much: "Manufacturing declaration for 1 kg of one specified finished model; report its equivalent equipment count"
  how_well: "Declare resolution, frame rate, codec/interface, optical configuration and acceptance test; model specifications are not category-wide limits (sony-ax43a-specifications)"
  how_long_or_cycle: "One manufacturing cycle. No service life is assumed; downstream functional studies must declare recording hours, lifetime and replacement requirements"
  reference_flow_link: "finished_camera"
system_boundary:
  rules:
    - rule_id: manufacturing_boundary
      applies_to: "foreground"
      rule: "Include component assembly, optical alignment, firmware loading, acceptance testing, rework and factory packing. Link component production, inbound delivery and outgoing manufacturing-waste treatment upstream/downstream as appropriate. This is a partial manufacturing dataset, not a complete product footprint."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: route_completeness
      applies_to: "actual_site"
      rule: "The declared route starts with finished components. Where the site makes a component, solders, cleans or coats it, extend the process map with each actual atomic input and output and replace the overlapping purchased-component burden. Reconcile every BOM part, fastener, adapter and packaging component; no unlisted exchange may be silently omitted."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: downstream_boundary
      applies_to: "dataset_use"
      rule: "Distribution after factory gate, operation, replacement and end-of-life of the sold equipment are outside this manufacturing declaration. A life-cycle study must add these stages, including host equipment and recording media where required by the function, and disclose assumptions."
      source_ids:
        - ghg-product-standard-2011
boundary_abstraction:
  declared_starting_condition: "Purchased finished lens, populated imaging board and finished enclosure delivered to assembly; no upstream component burdens are assumed zero"
  starting_condition_role: "Foreground assembly entry; upstream burden linkage required"
  product_classification_scope: "Camcorders and web cameras; declare local recording or host-dependent capture"
  recursive_input_rule: "Do not feed the finished reference camera back into its own production. Rework stays within the same lot; purchased used cameras require a separately declared refurbishment route"
  upstream_dataset_requirement: "Link supplier or representative upstream component datasets including delivery. Disclose geography, technology, time, recycled content and dataset boundary"
  disclosure: "State actual bill of materials, make/buy boundary, included accessories, packaging, outsourced stages and excluded life-cycle stages"
