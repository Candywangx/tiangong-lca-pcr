  calculation_rules:
    - id: normalize
      applies_to: "all_rows"
      rule: "a_i=sum(q_i)/sum(M_accepted) for the same model and period; for electricity convert meter kWh to MJ first"
      inputs:
        - "protocol batch quantities and accepted mass"
      output: "kg/kg or MJ/kg"
      source_ids:
        - ghg-product-standard-2011
    - id: yield
      applies_to: "finished_camera"
      rule: "accepted count divided by completed test count; retain rework loops and irreparable reject count without counting rework twice"
      inputs:
        - "test and release logs"
      output: "observed model yield, no default"
      source_ids:
        - ghg-product-standard-2011
