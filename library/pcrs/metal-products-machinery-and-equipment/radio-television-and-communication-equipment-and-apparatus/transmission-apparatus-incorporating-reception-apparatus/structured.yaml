      output: "disclosed production mix"
      source_ids:
        - itu-l1310-2024
        - etsi-es-203199-2025
    - id: calc_mass_balance
      applies_to: "each production campaign"
      rule: "Compare accepted output + waste + closing WIP against accepted material input + opening WIP; investigate and disclose unexplained imbalance rather than forcing closure."
