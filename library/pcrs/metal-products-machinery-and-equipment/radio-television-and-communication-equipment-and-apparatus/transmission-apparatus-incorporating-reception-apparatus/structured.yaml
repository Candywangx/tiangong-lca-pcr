  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "all mass rows"
      rule: "normalized amount = configuration-stratum row mass / accepted net reference-product mass"
      inputs:
        - "kg row total"
        - "kg accepted net equipment"
      output: "kg/kg reference product"
      source_ids:
        - etsi-es-203199-2025
    - id: calc_energy_normalization
      applies_to: "assembly and test electricity"
      rule: "normalized electricity = attributable net meter kWh / accepted net reference-product mass"
      inputs:
        - "opening/closing kWh"
        - exclusions
        - "allocation driver"
        - "accepted kg"
      output: "kWh/kg reference product"
      source_ids:
        - etsi-es-203199-2025
    - id: calc_power_profile_energy
