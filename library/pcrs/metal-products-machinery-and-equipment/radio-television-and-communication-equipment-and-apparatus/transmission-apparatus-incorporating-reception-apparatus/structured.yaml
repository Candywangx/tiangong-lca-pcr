validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Fail if the reference product UUID, Mass property UUID, Units of mass UUID, kg unit or CPC 47211 identity does not match the verified record."
    source_ids:
      - un-cpc-v3-2025
  - rule_id: val_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail if equipment family, standard/band, capacity or ports, chassis/board/RF configuration, power profile, software feature/version or delivery boundary is missing."
    source_ids:
      - itu-l1310-2024
      - etsi-es-203199-2025
  - rule_id: val_scope_exclusions
    applies_to: "product scope"
    rule: "Fail if a phone, router/switch, pure receiver, non-receiving transmitter, camera, part-only module or one narrow model is represented as the complete category without an explicit eligible stratum and classification justification."
    source_ids:
      - un-cpc-v3-2025
      - etsi-es-203199-2025
  - rule_id: val_inventory_reconciliation
    applies_to: "foreground inventory"
    rule: "Fail if inputs, accepted output, rework, waste, energy period or normalization denominator cannot be reconciled for the same site, period and configuration stratum."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: val_power_comparability
    applies_to: "test and use results"
    rule: "Fail cross-product comparison unless technology, configuration, performance function, measurement boundary, load profile and software state are equivalent or differences are normalized and disclosed."
    source_ids:
      - itu-l1310-2024
      - etsi-en-303472-2018
  - rule_id: val_reasoned_estimates
    applies_to: "provisional ranges"
    rule: "Warn and mark review-required while any reasoned estimate is used as a dataset value; fail publication-critical use if it has not been replaced or explicitly accepted by review."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production data package and eligible secondary_dataset or background_dataset after review"
  downstream_use: "Production inventory for process and lifecyclemodel projections; optional configuration-specific use module when power-state scenario data are supplied"
  allowed_use: "Modelling the declared equipment-family/configuration stratum and disclosed production mix; comparisons only between functionally equivalent configurations"
  excluded_use: "Generic representation of phones, routers, pure receivers, transmitters without reception, cameras or all base stations; undisclosed cross-family averaging; use-phase claims without measured power/load/lifetime context"
  required_metadata: "All Required qualifiers; site and period; net/accessory/packaging mass boundary; BOM coverage; in-house/purchased route; meter and allocation methods; source and proxy coverage; software and test revision"
  required_quality_disclosure: "Primary-data coverage, mass and energy reconciliation, cut-offs, proxies, reasoned estimates, uncertainty, supplier coverage, rejected/reworked units, allocation and family-specific evidence limitations"
  update_trigger: "Material change in equipment family, standard/band, ports/capacity, chassis/board/RF or power configuration, firmware/software function affecting performance or energy, supplier/BOM, production site, delivery boundary, test method, operating profile or source evidence"
