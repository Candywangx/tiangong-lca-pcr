  how_well: "Meets the declared transmission/reception functions, standard, band, capacity or port configuration, software feature set, test status, and delivery boundary"
  how_long_or_cycle: "One manufacturing campaign and factory-gate release; any operating lifetime and power-state duty cycle are separate declared downstream scenarios"
