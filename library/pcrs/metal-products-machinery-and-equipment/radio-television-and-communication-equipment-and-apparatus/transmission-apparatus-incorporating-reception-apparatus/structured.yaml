allocation_rules:
  - rule_id: alloc_subdivide
    applies_to: "shared assembly, test and packaging lines"
    rule: "Avoid allocation by sub-metering, work-order tracking or subdividing processes by configuration stratum."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: alloc_physical
    applies_to: "unavoidable shared utilities and facility burdens"
    rule: "Use a documented physical driver that reflects causality, such as board area for PCB work, accepted mass for general components, machine or test-bench time, occupied rack/line time, or metered energy."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: alloc_economic_fallback
    applies_to: "shared burdens without defensible physical relation"
    rule: "Use economic allocation only when subdivision and physical causality are infeasible; disclose values and perform sensitivity analysis."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: alloc_scrap_rework
    applies_to: "scrap, supplier returns, rework and recycling"
    rule: "Keep rework loops and returned components visible; do not credit recovered material unless the recycling allocation method and substituted product are explicitly declared."
    source_ids:
      - etsi-es-203199-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_mass
      process_id: "component_supply"
      flow_role: "BOM inputs, accepted kits and net product mass"
      record_type: "BOM revision, purchase/issue record and calibrated weighing"
      raw_fields: "model/configuration_id; serial_or_batch; component_family; part_number; board_area_if_available; rf_module_type; quantity; measured_mass_kg; supplier; acceptance_status; included_accessory_flag"
      collection_method: "Reconcile engineering BOM, receiving, stores issue and scale records by production order"
      unit: "kg and item"
      frequency: "Each production order and BOM revision"
      temporal_coverage: "Same period as reference output"
      site_scope: "Each manufacturing site and configuration stratum"
      aggregation_rule: "Sum accepted input masses; divide by accepted net reference-product mass; report coverage by BOM mass"
      quality_evidence: "BOM approval, calibration record, receiving reconciliation and unexplained-mass review"
    - protocol_id: cp_manufacturing_energy
      process_id: "assembly_configuration"
      flow_role: "assembly/configuration electricity"
      record_type: "Sub-meter, equipment meter or allocated facility meter"
      raw_fields: "meter_id; timestamp; opening_kWh; closing_kWh; process_area; configuration_id; accepted_output_kg; allocation_driver"
      collection_method: "Prefer sub-metering; otherwise reconcile facility meter and documented physical allocation driver"
      unit: "kWh"
      frequency: "Continuous or per production order"
      temporal_coverage: "Representative production period, normally at least one complete campaign"
      site_scope: "Each site and line"
      aggregation_rule: "Net kWh divided by accepted output kg in the same stratum"
      quality_evidence: "Meter calibration, downtime log, allocation reconciliation and energy coverage"
    - protocol_id: cp_test_and_power_profile
      process_id: "test_calibration"
      flow_role: "test energy, release results and power states"
      record_type: "Test-system log and calibrated power measurement"
      raw_fields: "equipment_family; standard; band; bandwidth; ports_or_carriers; throughput_or_rf_output; enabled_modules; software_version; input_voltage; ambient_conditions; state_id; load_level; power_W; duration_h; test_energy_kWh; pass_fail"
      collection_method: "Apply the applicable same-family method; retain raw readings and configuration; RAN-specific fields only for eligible RAN equipment"
      unit: "W, kWh, bit/s or declared RF/capacity unit"
      frequency: "Each released configuration and software version; power profile at least once per stable configuration and after relevant change"
      temporal_coverage: "Full test cycle and declared duty-cycle evidence"
      site_scope: "Each test boundary and configuration"
      aggregation_rule: "Test kWh per accepted kg; use energy = sum(power_W × duration_h)/1000, then normalize by reference mass"
