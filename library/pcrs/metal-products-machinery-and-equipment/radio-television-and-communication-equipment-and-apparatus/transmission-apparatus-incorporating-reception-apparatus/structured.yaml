  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference flow"
      requirement: "Verify exact CPC 47211 product identity and preserve the selected Tiangong flow, Mass property, Units of mass and kg reference; reject CPC 47212, CPC 47223, user equipment, pure receivers and component-only candidates."
