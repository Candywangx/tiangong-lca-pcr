allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared activities"
    rule: "Submeter or trace batches first; if not separable, allocate by verified labour/test time or machine time and measured load, documenting sum, rationale and sensitivity. Do not force mass allocation across different parts."
    source_ids: []
  - rule_id: allocation_residues
    applies_to: "scrap and rework"
    rule: "This candidate uses a cut-off convention: production carries input and site processing burdens; connect actual waste-receiver interfaces without default avoided-product credits. Saleable co-products require declared function, boundary and consistent method without double credit. Internal rework gains no new-product credit and retains energy/material use."
    source_ids: []
