    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "kg; kWh; MJ; t km"
    rule: "Retain raw units and conversion evidence; electricity 1 kWh=3.6 MJ; gas retains temperature, pressure, composition and net calorific value."
  - id: balances
    applies_to: "production"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile external inputs, stocks, products, waste and releases separately for each alloy, resin, paste and solvent; contained metal/element terms use their own measured composition, never gross mass as element mass. Include reactions, oxygen uptake, moisture and stocks; cancel paired internal transfers but retain rework energy."
