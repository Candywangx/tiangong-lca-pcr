  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Divide each attributable period exchange by D from cp_mass; final_product is 1 kg. Convert count inputs to mass using measured net lot mass and accepted count of the same configuration and lot, never invented unit mass."
      inputs:
        - "period exchange"
        - D
        - cp_mass
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: species_fate
      applies_to: "ipa_air; xylene_air; fossil_co2; carbon_monoxide; nitrogen_dioxide"
      rule: "Use matched species concentration and exhaust volume with applicable background correction or an applicable equipment factor; reconcile solvent purchases/stocks, retention, waste, recovery, reaction and species release. Fuel carbon alone cannot calculate CO or NOx."
      inputs:
        - "species data"
        - "exhaust flow"
        - "formulation and fuel records"
      output: "individual species amount"
      source_ids:
        - epa-metal-coating
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Verify physical/chemical identity, state, unit, provider geography/stage and Chinese name row by row; reference classification cannot substitute for actual identity."
      evidence: "direct flow record and supplier specification"
    - id: coverage
      applies_to: "all processes"
      requirement: "Each actual step and atomic exchange has a quantity, unknown, or evidenced not_applicable state; citations support routes without empirical defaults."
      evidence: "site audit; make/buy matrix; source applicability"
    - id: measurement
      applies_to: "all rows"
      requirement: "Match D to inputs, tests, waste, period and configuration; retain calibration, stock adjustments, elemental assays and uncertainty."
      evidence: "cp_mass and individual process protocols"
validation_rules:
  - rule_id: validate_scope
    applies_to: "final_product"
    rule: "Review drawing, host fit, delivered function and remaining assembly first; complete-apparatus function or a separately more specific category cannot pass this scope based on module name."
    source_ids:
      - un-cpc3-notes
      - cbp-h325872
      - cbp-n059857
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Every row uses the same positive D and accepted configuration; packaging/rejects are outside D; check raw units, count conversion and allocation individually."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all processes"
    rule: "Reconcile make/buy, stages and physical flows; disclose missing UUID, recipe or species evidence and prevent that package claiming completeness, without excluding a part family merely for absent UUID. Count upstream burdens, embedded components and internal transfers once; unknown is neither zero nor not_applicable."
    source_ids: []
  - rule_id: validate_water_closure
    applies_to: "utilities; all water-bearing processes"
    rule: "For the same period on water mass basis, external supplied water and actual withdrawals plus opening stocks plus reaction-generated water equal water carried in product, water in external wastewater, moisture in each waste, evaporation/other water release, reaction-consumed water and closing stocks. Flow meters retain temperature/density conversions; sample waste moisture separately and determine evaporation by measurement or a transparent water balance with uncertainty. Cancel recirculation, wash returns and interprocess water transfers in matched pairs; they are neither new withdrawals nor unsupported losses."
    source_ids: []
  - rule_id: validate_contained_metal
    applies_to: "mechanical; electronics; rf_display; surface"
    rule: "For each actual metal element, use each external material's measured gross mass multiplied by its own matching elemental assay. External elemental input plus opening elemental stocks equal that element in accepted product, external swarf, rejected boards, solder residues, sludge, spent liquid, releases and closing stocks; include elemental inputs and outputs of metallization/reaction materials. Record oxidation oxygen uptake and moisture separately; alloy, paste or oxide gross mass is never elemental mass. Cancel internal metal returns/rework transfers in matched pairs without cancelling repeated processing burdens."
    source_ids: []
  - rule_id: validate_solvent_closure
    applies_to: "surface; electronics; rf_display"
    rule: "For each solvent species use measured formulation mass and that species fraction: external input, opening stock and reaction generation equal retention in product/film, content in external waste liquid/solids, externally recovered solvent, species release after controls, reaction destruction and closing stock. Cancel internal recovery/return pairs; externally recovered solvent is not also an air release. Retain capture/control fate and actual reaction evidence without assuming complete evaporation or fixed loss."
    source_ids: []
  - rule_id: validate_balance_uncertainty
    applies_to: "all material and water balances"
    rule: "Retain actual balance, meter, sampling/assay, stock and allocation uncertainty for each term; calculate and explain each closure residual. Investigate residuals outside combined measured uncertainty for omissions, period mismatch or double counting. Unknown assay, reaction fate or evaporation evidence remains unresolved rather than forcing closure with invented yield, zero or a universal tolerance."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified dedicated-part dataset production and downstream process/lifecyclemodel projections"
  excluded_use: "Unjustified cross-family comparisons; whole-apparatus lifetime or system environmental claims"
  required_metadata: "part number and drawing revision; actual host family/model and dedicated fit; delivered functional state and remaining assembly; material grades/formulations; make/buy and supplier completed operations; electrical/RF/optical/mechanical interface and acceptance tests; configuration and net mass; site, period, supplier geography, test and packaging boundary"
  required_quality_disclosure: "Boundary, make/buy, upstream stages, allocation, measurement/identity gaps, not_applicable evidence and source limits"
  update_trigger: "Drawing, host, delivered state, material, supplier, manufacturing or test change"
