      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "matched reporting period"
      site_scope: "declared plant gate"
      aggregation_rule: "accepted net mass D in period for the same reference flow"
      quality_evidence: "calibration, tare and acceptance records"
