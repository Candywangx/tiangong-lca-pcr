system_boundary:
  rules:
    - rule_id: boundary_routes
      applies_to: "all processes"
      rule: "Build a drawing-based stage-by-stage make/buy/subcontract matrix. Purchased chassis, PCBA, microwave assembly or display cell carries supplier burden once; in-house routes include actual fabrication, assembly, tests, rework and controls. Never count both a purchased component and its embedded raw inputs."
      source_ids:
        - cbp-n353432
        - rogers-materials
    - rule_id: boundary_extensions
      applies_to: "all processes"
      rule: "Not every part manufacturer makes wafers, bare boards or LCD glass. If actually in-house, add the applicable lithography, deposition/etching, plating, cleaning, lamination and packaging stages with individual chemicals, materials, utilities, wastes and species releases. Missing special-recipe evidence is a package gap, not automatic exclusion of the part family."
      source_ids:
        - cbp-n353432
        - rogers-materials
    - rule_id: boundary_gate
      applies_to: "all processes"
      rule: "Include actual factory test electricity, destructive samples, cleaning, maintenance and control-equipment service. Host installation, whole-apparatus commissioning, user use and end of life are outside this factory-gate package and need downstream models. Justify and assess sensitivity of capital/infrastructure exclusions."
      source_ids:
        - cbp-n353432
boundary_abstraction:
