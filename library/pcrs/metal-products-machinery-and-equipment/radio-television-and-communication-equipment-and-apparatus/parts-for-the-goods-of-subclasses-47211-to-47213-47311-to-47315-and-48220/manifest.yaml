    methodology_needs:
      - Reference-product UUID for each dedicated delivered part remains unresolved; complete-apparatus UUIDs and unrelated component aggregates are not substitutes.
      - UUIDs for atomic flows other than the verified FR4 bare board and SMT scrap require direct identity review, including official Chinese names and provider interfaces.
      - No industry energy, yield, unit mass, emission or lifetime ranges are established. Collect foreground records; absence of a range is not a zero.
      - Detailed in-house semiconductor, bare-board fabrication, LCD cell/glass and special plating recipes require source- and site-specific extensions before those foreground packages are complete. This evidence gap does not exclude dedicated electronic, RF or display parts.
      - CPC3 47403 has no detailed explanatory note in the 30 June 2025 document. Separately named stock/components and display-device classifications require delivered-state review; historical customs cases do not establish universal current mappings.
  uuid_limitations:
    a8bd954c-59b3-4317-b4de-02a17d6da5ca: The direct-read record classification says CPC46939, conflicting with current bare printed-circuit class CPC47130. Adopt only its physically confirmed bare FR4 glass-fibre/epoxy/copper product identity as a matching input, never as reference output or classification evidence; verify actual supplier state and geography separately.
