allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-product facilities and shared lines"
    rule: "Prefer process subdivision, direct metering and product-route records so allocation is avoided wherever practicable."
    source_ids:
      - iso-14044-2006
      - semi-s23-1021
  - rule_id: allocation_causal_driver
    applies_to: "Shared tools, cleanrooms and utilities"
    rule: "Allocate unavoidable shared consumption using a documented causal driver such as recipe tool-time, wafer or substrate area by process step, chamber cycles, processed item-hours, metered load, exhaust demand or cooling load. Production mass or revenue may not be used without demonstrating why it reflects the physical relationship."
    source_ids:
      - iso-14044-2006
      - semi-s23-1021
      - us-epa-subpart-i
  - rule_id: allocation_yield_and_rework
    applies_to: "Rejects, rework and downgraded bins"
    rule: "Assign burdens of ordinary yield loss and rework to conforming output. Treat a downgraded bin as a co-product only when it has a documented market function and separate flow; disclose the chosen physical or economic allocation and test it in sensitivity analysis."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycling
    applies_to: "Recovered materials and returned carriers"
    rule: "Report material recovery, recycled content and any substitution credit separately. Apply one disclosed recycling allocation convention consistently and prevent double counting between the supplying and receiving systems."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_identity_and_mass
      process_id: "final_test_binning_release"
      flow_role: "Reference product identity and mass"
      record_type: "Product master, lot release and scale record"
      raw_fields: "family; material_system; delivery_state; construction; grade; lot_id; item_count; net_mass; area; site; dates"
      collection_method: "Controlled master-data export joined to calibrated scale and release records"
      unit: "kg; item; m2 as applicable"
      frequency: "Each released lot"
      temporal_coverage: "Representative reporting period or complete campaign"
      site_scope: "Every included release site"
      aggregation_rule: "Sum net conforming mass by qualified product, then preserve family and route shares"
      quality_evidence: "Calibration record; product specification; test release; traceable lot reconciliation"
    - protocol_id: cp_material_and_bom_records
      process_id: "wafer_or_device_fabrication_device_or_module_assembly_piezoelectric_crystal_manufacture_and_mounting"
      flow_role: "Material inputs"
      record_type: "BOM, purchase, warehouse issue and return records"
      raw_fields: "material_id; composition; supplier; upstream_state; quantity; unit; lot; issue; return; inventory_change; recycled_content"
      collection_method: "Reconcile product-specific BOM to receipts, issues, returns and inventory change"
      unit: "kg; item; m2"
      frequency: "Each lot with monthly reconciliation"
      temporal_coverage: "Same period as output"
      site_scope: "Every included process and outsourced supplier stage"
      aggregation_rule: "Material used equals opening inventory plus receipts minus closing inventory and documented returns"
      quality_evidence: "Approved BOM revision; supplier certificate; inventory reconciliation"
    - protocol_id: cp_process_material_and_gas_records
      process_id: "wafer_or_device_fabrication"
      flow_role: "Process chemicals and gases"
      record_type: "Bulk-tank, cylinder, point-of-use and recipe records"
      raw_fields: "substance; purity; mass_or_volume; conditions; tool; recipe; lot; return; residual; abatement_link"
      collection_method: "Reconcile purchases and inventory change to point-of-use or recipe consumption"
      unit: "kg; m3 with temperature and pressure"
      frequency: "Continuous or each container and recipe"
      temporal_coverage: "Same period as output"
      site_scope: "Each fab and process type"
      aggregation_rule: "Substance-specific use allocated by direct measure or documented recipe driver"
      quality_evidence: "Meter calibration; container balance; recipe audit; uncertainty statement"
    - protocol_id: cp_energy_utility_records
      process_id: "all_applicable_process_ids"
      flow_role: "Electricity, water and utilities"
      record_type: "Meter, equipment-state and facility utility log"
      raw_fields: "meter_id; utility; quantity; unit; timestamp; tool_state; process; allocation_driver; calibration"
      collection_method: "Prefer submetering; otherwise allocate monitored facility totals using causal engineering drivers"
      unit: "kWh; MJ; m3; kg; utility-native unit"
      frequency: "Continuous or batch-resolved"
      temporal_coverage: "Same period as output, including idle and maintenance"
      site_scope: "Each included site and shared utility system"
      aggregation_rule: "Sum measured use and allocate only the documented shared portion to conforming output"
      quality_evidence: "Meter calibration; coverage report; reconciliation to facility bill; allocation sensitivity"
    - protocol_id: cp_yield_mass_and_disposition
      process_id: "all_applicable_process_ids"
      flow_role: "Product yield, rework and waste"
      record_type: "Manufacturing execution, test-bin, scale and waste records"
      raw_fields: "input_lot; output_lot; input_mass; output_mass; item_count; area; pass; rework; downgrade; scrap; destination"
      collection_method: "Reconcile lot genealogy and all dispositions"
      unit: "kg; item; m2"
      frequency: "Each lot"
      temporal_coverage: "Same period as output"
      site_scope: "Each included process"
      aggregation_rule: "Preserve stage yield and assign normal loss to conforming output; do not hide rework loops"
      quality_evidence: "Closed lot balance; disposition approval; scale calibration"
    - protocol_id: cp_direct_emission_records
      process_id: "all_applicable_process_ids"
      flow_role: "Direct air and water releases"
      record_type: "Stack test, continuous monitoring, gas-use, abatement and permit records"
      raw_fields: "substance; input_use; by_product; utilization; abatement_efficiency; downtime; measured_release; method; uncertainty"
      collection_method: "Use direct monitoring where available or a documented applicable regulatory method based on collected activity data"
      unit: "kg per substance"
      frequency: "Continuous, test campaign or regulatory reporting interval"
      temporal_coverage: "Same period as output"
      site_scope: "Each emitting fab, stack and treatment system"
      aggregation_rule: "Sum substance-specific controlled releases and normalize to conforming output"
      quality_evidence: "Method report; calibration; abatement uptime; permit or regulatory reconciliation"
    - protocol_id: cp_waste_and_wastewater_records
      process_id: "all_applicable_process_ids"
      flow_role: "Waste and wastewater"
      record_type: "Flowmeter, sample, waste manifest and treatment log"
      raw_fields: "stream; volume; pollutant_concentration; waste_mass; composition; hazard_class; treatment; destination; recovery"
      collection_method: "Measure separate streams and reconcile transferred residues and discharge"
      unit: "m3; kg"
      frequency: "Continuous, batch or shipment"
      temporal_coverage: "Same period as output"
      site_scope: "Each included site and treatment route"
      aggregation_rule: "Sum by composition and destination before normalization"
      quality_evidence: "Laboratory QA; manifest; flowmeter calibration; treatment acceptance record"
    - protocol_id: cp_test_and_grade_records
      process_id: "final_test_binning_release"
      flow_role: "Functional test, binning and release"
      record_type: "Test-system and quality records"
      raw_fields: "device_id_or_lot; test_method; grade; performance_value; unit; pass; fail; downgrade; test_time; burn_in; energy"
      collection_method: "Export traceable results from controlled test systems and join to product disposition"
      unit: "Native performance unit; item; kg; kWh"
      frequency: "Each tested lot or item"
      temporal_coverage: "Same period as output"
      site_scope: "Every included release site"
      aggregation_rule: "Aggregate only within identical family, state, construction and grade; retain distributions when material"
      quality_evidence: "Test calibration; applicable product standard; release authorization; exception log"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "Every inventory amount"
      rule: "normalized amount = period amount divided by period net conforming reference-product mass in kg"
      inputs:
        - "Period amount"
        - "net conforming mass from cp_product_identity_and_mass"
      output: "Amount per 1 kg reference product"
      source_ids:
        - iso-14044-2006
    - id: calc_count_area_conversion
      applies_to: "Count- or area-based records"
      rule: "Use matching lot mass divided by count or processed area; keep the original count or area and prohibit cross-family conversion factors"
      inputs:
        - "Lot mass"
        - "item count"
        - "processed area"
        - "route and state"
      output: "Product-specific count-to-mass or area-to-mass factor"
      source_ids:
        - us-epa-subpart-i
        - us-doe-led-lca-2012
        - jrc-pv-footprint-2025
    - id: calc_stage_yield
      applies_to: "Each manufacturing stage"
      rule: "stage yield = conforming output quantity divided by total input quantity on a consistent mass, item or area basis; separately report rework and downgrade"
      inputs:
        - Input
        - "conforming output"
        - rework
        - "downgrade and scrap records"
      output: "Stage yield and reconciled disposition"
      source_ids:
        - jrc-pv-footprint-2025
        - iec-62941-2019
    - id: calc_shared_utility
      applies_to: "Shared energy and utilities"
      rule: "allocated amount = measured shared amount multiplied by the documented causal-driver share; report unallocated and excluded portions"
      inputs:
        - "Metered total"
        - "driver values"
        - "meter coverage"
      output: "Allocated utility amount and allocation sensitivity"
      source_ids:
        - semi-s23-1021
        - us-epa-subpart-i
    - id: calc_direct_emissions
      applies_to: "Process gases and controlled releases"
      rule: "Apply direct measurement or the selected applicable method to collected gas use, utilization, by-product formation, abatement efficiency and downtime; never equate purchased gas with emitted gas without justification"
      inputs:
        - "Gas and monitoring records from cp_direct_emission_records"
      output: "Substance-specific direct emission"
      source_ids:
        - us-epa-subpart-i
    - id: calc_mass_reconciliation
      applies_to: "Each process and reporting period"
      rule: "input mass plus opening inventory = product mass plus waste mass plus measured releases plus closing inventory, with non-mass service flows excluded and the residual reported"
      inputs:
        - Material
        - product
        - waste
        - "release and inventory records"
      output: "Mass-balance residual and explained exceptions"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "All required qualifiers match the product master, test grade and delivery state; a generic flow name alone is insufficient"
      evidence: "Product specification, master-data snapshot and release record"
    - id: dq_family_route
      applies_to: "Process coverage"
      requirement: "Evidence demonstrates that included and outsourced stages match the declared family, material system, technology, wafer or crystal state, package or mount, and reporting period"
      evidence: "Route map, supplier declarations, process recipes and lot genealogy"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a representative reporting period that captures normal production, idle, maintenance, abatement downtime, rework and yield variation; justify and flag pilot or short-campaign data"
      evidence: "Production calendar, meter coverage and exception log"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "No hazardous, fluorinated-gas, water, waste, high-mass, high-energy or yield-significant flow is excluded by a mass cut-off alone; disclose all cut-offs and missing substances"
      evidence: "Completeness checklist, material balance and regulatory records"
    - id: dq_source_match
      applies_to: "Upstream datasets"
      requirement: "Technology, geography, time, material purity and delivery state of upstream datasets are stated and mismatches are assessed"
      evidence: "Dataset metadata and representativeness assessment"
    - id: dq_allocation
      applies_to: "Shared systems and co-products"
      requirement: "Allocation driver, measurement coverage, excluded load and sensitivity are reproducible from retained records"
      evidence: "Meter map, engineering model, driver data and sensitivity result"
    - id: dq_uncertainty
      applies_to: "Calculated and modelled values"
      requirement: "Report measurement uncertainty, estimation method and unresolved data gaps; provisional estimates may not be presented as observed values"
      evidence: "Calibration certificates, method report and uncertainty register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The product UUID, Mass UUID, Units of mass UUID and kg unit exactly match section 3."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset identity"
    rule: "Fail when device family, material system, delivery state, construction, grade, route, site, period, mass and applicable count or area qualifiers are missing."
    source_ids:
      - iec-60747-1-2010
      - iec-60122-1-2017
      - iec-62941-2019
  - rule_id: validate_no_single_family_proxy
    applies_to: "Representativeness claim"
    rule: "Fail any claim to represent all of CPC 47150 when evidence covers only one diode, transistor, PV, LED, photosensitive or piezo-electric family. A mixed dataset must disclose production-weighted family and route shares and retain disaggregated inventory."
    source_ids:
      - iec-63366-2025
      - us-doe-led-lca-2012
      - jrc-pv-footprint-2025
  - rule_id: validate_route_and_state
    applies_to: "Process map"
    rule: "Included stages, purchased intermediates and upstream datasets must reconcile with the declared incoming state and marketed delivery state; no wafer, die, package, module or mount stage may be double counted or silently omitted."
    source_ids:
      - us-epa-semiconductor-neshap
      - us-doe-led-lca-2012
      - epson-crystal-device-process
  - rule_id: validate_process_coverage
    applies_to: "Manufacturing boundary"
    rule: "At least one family-specific production route plus final_test_binning_release is present; each conditional stage is explicitly included, outsourced with an upstream dataset, or not applicable with reason."
    source_ids:
      - iec-63366-2025
  - rule_id: validate_yield_and_mass_balance
    applies_to: "Each process"
    rule: "Input, output, rework, downgrade, scrap, waste, release and inventory-change records reconcile; unexplained residuals and inconsistent mass, count or area yield bases are findings."
    source_ids:
      - iso-14044-2006
      - iec-62941-2019
  - rule_id: validate_energy_utility_allocation
    applies_to: "Shared energy and utilities"
    rule: "Meter coverage and causal allocation drivers are disclosed and reproduce the normalized amount; revenue-only or unsubstantiated mass allocation is a finding."
    source_ids:
      - semi-s23-1021
      - us-epa-subpart-i
  - rule_id: validate_direct_emissions
    applies_to: "Fabs and emitting assembly stages"
    rule: "When fluorinated gases, N2O, solvents, acid gases or other controlled substances are used, substance-specific emissions, abatement method and downtime are present or the check is explicitly inconclusive."
    source_ids:
      - us-epa-subpart-i
      - us-epa-semiconductor-neshap
  - rule_id: validate_wastewater_and_waste
    applies_to: "Wet and material-removal processes"
    rule: "Wastewater and waste are distinguished by stream, composition and treatment destination; absence of evidence for an applicable stream is a finding."
    source_ids:
      - us-epa-electronics-effluent-guidelines
  - rule_id: validate_foreground_evidence
    applies_to: "Important amounts"
    rule: "Important amounts are foreground records or calculations from collection. A reasoned estimate, if introduced, is labelled temporary and replaceable and is not used as a conformance limit or whole-family default."
    source_ids:
      - iso-14044-2006
      - iec-63366-2025
  - rule_id: validate_recursive_inputs
    applies_to: "Same-category intermediates"
    rule: "Purchased in-scope wafers, dies, cells or devices have qualified upstream datasets and are not assigned zero burden or expanded recursively."
    source_ids:
      - iec-63366-2025
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for one qualified CPC 47150 device family, route and delivery state"
  downstream_use: "secondary_dataset; background_dataset after methodology review and publication"
  allowed_use: "Product- and route-specific supply-chain modelling when reference-flow qualifiers, included stages, upstream datasets and data quality match the study"
  excluded_use: "Unqualified whole-leaf average; substitution among PV, LED, power-electronic, photosensitive, discrete-semiconductor and piezo-electric families; functional comparison using kg alone; use-phase performance claim; proxy for integrated circuits, luminaires or complete equipment"
  required_metadata: "All reference-flow qualifiers; site and period; technology and route; wafer, die, cell, package, module or mount state; BOM revision; yield basis; count and area conversions; included and outsourced stages; upstream dataset references; allocation and recycling methods; abatement and treatment coverage"
  required_quality_disclosure: "Foreground measurement coverage; calibration; temporal, geographical and technological representativeness; meter and mass-balance reconciliation; family and route shares for mixes; cut-offs; uncertainty; reasoned estimates; missing UUIDs or substances; data gaps"
  update_trigger: "Change in device family, material system, wafer or substrate size, active structure, package or module construction, major process route, site electricity, yield, abatement, allocation driver, product grade, or reporting period that materially affects the inventory"
