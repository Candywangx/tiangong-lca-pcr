system_boundary:
  rules:
    - rule_id: boundary_family_route
      applies_to: "All datasets"
      rule: "Build the boundary for the declared device family and delivery state. Do not substitute the process map of another family or claim whole-category representativeness from one route."
      source_ids:
        - iec-63366-2025
        - us-doe-led-lca-2012
        - jrc-pv-footprint-2025
        - iec-60122-1-2017
    - rule_id: boundary_semiconductor_fabrication
      applies_to: "Semiconductor, photosensitive, photovoltaic and LED routes"
      rule: "Include foreground-controlled active-structure formation and applicable wafer preparation, deposition or epitaxy, doping, masking, etching, cleaning, metallization, passivation and inspection. If these occur upstream, link qualified upstream datasets."
      source_ids:
        - us-epa-semiconductor-neshap
        - us-epa-subpart-i
        - us-doe-led-lca-2012
    - rule_id: boundary_back_end
      applies_to: "Separated, packaged, mounted or module products"
      rule: "Include applicable dicing or separation, die attach, interconnection, electrode formation, encapsulation, optics, framing or module assembly, sealing, marking, test, binning and yield losses up to release."
      source_ids:
        - us-epa-semiconductor-neshap
        - us-doe-led-lca-2012
        - jrc-pv-footprint-2025
        - epson-crystal-device-process
    - rule_id: boundary_emissions_and_treatment
      applies_to: "All included manufacturing stages"
      rule: "Include process-gas and solvent releases, fluorinated GHG and N2O emissions where used, abatement operation and downtime, wastewater, hazardous and non-hazardous waste, recycling preparation and off-site treatment flows without netting them against inputs."
      source_ids:
        - us-epa-subpart-i
        - us-epa-electronics-effluent-guidelines
    - rule_id: boundary_capital_and_downstream
      applies_to: "Dataset boundary"
      rule: "Exclude manufacturing equipment, buildings, transport after the declared gate, use and end of life unless the study goal explicitly extends the system; disclose any included capital or downstream stages separately."
      source_ids:
        - iso-14044-2006
        - iec-63366-2025
