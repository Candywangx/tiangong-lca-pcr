system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "manufacturing_system"
      rule: "Compile a cradle-to-factory-gate manufacturing dataset including acquired materials and components, their upstream production and inbound transport, mastering, carrier production or recording, attributable utilities, packaging and treatment of production waste. Publish gate-to-gate observations separately from linked upstream results."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_route
      applies_to: "carrier_construction"
      rule: "Declare one carrier construction and route per dataset. Replicated CDs need moulding, metallization and protection; CD-R recording starts with supplied blank discs; PVC vinyl needs pressing; bulk tape duplication needs recording and loading. A format name alone cannot justify using another route inventory."
      source_ids:
        - nist-optical-disc-care-2003
        - cci-recording-media-care
        - nac-cassette-production-2026
    - rule_id: boundary_supplied_components
      applies_to: "supply_boundary"
      rule: "For purchased finished stampers, coated/slit tape, assembled shells, printed labels and packaging, obtain upstream datasets covering all embedded constituents and conversion. If these are made on site, replace the purchased-component boundary with measured production and its atomic exchanges; do not count both. Include attributable master preparation even for short runs."
      source_ids:
        - nist-optical-disc-care-2003
        - nac-cassette-mastering-2026
        - gz-media-music-manufacturing
    - rule_id: boundary_completeness
      applies_to: "site_instantiation"
      rule: "The cards are a core collection structure. Before a site dataset is complete, add each actual omitted exchange, including a specific process chemical, spent lacquer, spent stamper, exported resin scrap, printing colour, fuel, purchased steam, refrigerant loss or measured combustion species. Record individual composition, amount and destination; absence needs evidence and a missing UUID is never a cut-off."
      source_ids: []
    - rule_id: boundary_recursion
      applies_to: "same_category_inputs"
      rule: "When already recorded musical media are purchased for repacking or further processing, record their delivered state and a supplier dataset once. Stop physical tracing at that documented supplier interface, not at the classification label. Internal transfers are reconciled without duplicate external inputs or final outputs."
      source_ids: []
    - rule_id: boundary_downstream
      applies_to: "excluded_stages"
      rule: "Distribution after the factory gate, retail, playback devices and listening energy, consumer travel, and consumer end-of-life are separate downstream scenarios. Creative performance, copyright and royalties are outside this physical manufacturing dataset; disclose that exclusion. Do not claim a complete listening-service comparison or full product-GHG conformance from this partial lifecycle."
      source_ids:
        - weber-music-delivery-2010
        - ghg-protocol-product-standard-2011
boundary_abstraction:
  declared_starting_condition: "Supplier-delivered formulated resin, finished stamper, coated tape or blank optical carrier and purchased components, with documented upstream burdens"
  starting_condition_role: "Foreground collection interface; does not remove upstream manufacture from the lifecycle boundary"
  product_classification_scope: "Recorded musical physical media; CPC context does not substitute for carrier state"
  recursive_input_rule: "One supplier interface per purchased same-category input; internal transfers tracked once"
  upstream_dataset_requirement: "Cover actual formulation, component manufacture, supplier energy, inbound transport and waste treatment; disclose geography, technology and unresolved coverage"
  disclosure: "Declare starting state, exclusions, integrated versus purchased operations and separate gate-to-gate from upstream-linked results"
