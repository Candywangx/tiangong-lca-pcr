measurement_rules:
  - id: reference_mass
    applies_to: "accepted media"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Net music-bearing carrier mass includes integral cassette shell and attached label; excludes jewel case, sleeve, booklet, wrap and shipping carton. Preserve count and measured per-item mass."
  - id: count_conversion
    applies_to: "items and packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Mass = count × measured mean unit mass; document sampling by format and lot. Convert music-program units separately using media count per album."
  - id: tape_conversion
    applies_to: "bulk tape and splices"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Mass = used length × measured linear mass. Tape duration does not identify length without recording speed, tracks/sides and leader allowance."
  - id: energy_conversion
    applies_to: "purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve delivered electrical energy; 1 kWh = 3.6 MJ. Do not convert to primary energy within the exchange or add grid emissions as direct site emissions."
  - id: gas_conditions
    applies_to: "gaseous natural gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Declare reference temperature, pressure and dry/wet basis; convert meter readings consistently. An energy invoice needs a supplier-specific calorific value to infer volume."
  - id: water_density
    applies_to: "supplied water and blowdown"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert measured volume with documented density and temperature; distinguish withdrawal, recirculation, evaporation and discharge."
