    used_for: "Original chapters 7–9: boundary disclosure, data quality, allocation hierarchy and recycling consistency; adapted bookkeeping, not a claim of full product-GHG conformance."
  - id: "weber-music-delivery-2010"
    type: "literature"
    reference: "[Weber, Koomey and Matthews, The Energy and Climate Change Implications of Different Music Delivery Methods (2010), accessible archival PDF](https://fepropaz.com/wp-content/uploads/2019/10/weber2010.pdf); DOI: 10.1111/j.1530-9290.2010.00269.x; accessed 2026-09-10"
