allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_processes"
    rule: "First separate product campaigns and directly meter attributable processes. If unavoidable, allocate by a demonstrated physical relationship; use economic allocation only with a documented reason that physical allocation is unsuitable and a sensitivity analysis."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_tooling
    applies_to: "mastering_and_stampers"
    rule: "Allocate master and stamper preparation by documented lifetime accepted copies of that title/format, including test and failed runs in the burden numerator. Record replacements and partial tool lives; do not assume infinite reuse."
    source_ids: []
  - rule_id: allocation_utilities
    applies_to: "site_energy"
    rule: "Use route submetering where possible. Otherwise allocate campaign electricity by measured power-time demand, process heat by measured heat demand and packaging by actual unit counts; reconcile shares to the site meter. Music duration alone is not a causal allocation basis for moulding."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "scrap_and_recycled_content"
    rule: "Track internal regrind as an internal loop, counting reprocessing energy and loss once. Apply a disclosed recycled-content approach to external recyclate and waste treatment; do not subtract hypothetical virgin-material displacement from the factory-gate result. Sold usable off-spec media require separate product accounting, not automatic waste status."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_mastering
      process_id: "mastering"
      flow_role: "Tool ledger"
      record_type: "batch_and_meter_records"
      raw_fields: "tool_id; title_id; format; mass_kg; installation/removal_date; good_copies; failed_copies; supplier"
      collection_method: "Weigh purchased tools and reconcile replacements and lifetime batch logs."
      unit: "kg; count"
      frequency: "Each tool change and campaign"
      temporal_coverage: "Entire declared reporting period; complete campaigns; retain dates and product mix"
      site_scope: "Named plant and included suppliers; no undocumented multi-site pooling"
      aggregation_rule: "Allocate preparation to actual accepted copies, then normalize by accepted media mass."
      quality_evidence: "Calibration, invoices, stock reconciliation, sample plan, uncertainty and acceptance records"
    - protocol_id: cp_optical
      process_id: "optical"
      flow_role: "Optical batch log"
      record_type: "batch_and_meter_records"
      raw_fields: "lot_id; optical_route; resin_grade; resin_kg; target_before/after_kg; lacquer_kg; solids_fraction; blank_count; blank_mass_kg; accepted_count; reject_kg; internal_regrind_kg"
      collection_method: "Weigh issues and returns; meter line runs; inspect samples for content readability and surface defects."
      unit: "kg; count"
      frequency: "Every production batch"
      temporal_coverage: "Entire declared reporting period; complete campaigns; retain dates and product mix"
      site_scope: "Named plant and included suppliers; no undocumented multi-site pooling"
      aggregation_rule: "Use net external consumption; include start-up and rejects; keep CD-R and replication data separate."
      quality_evidence: "Calibration, invoices, stock reconciliation, sample plan, uncertainty and acceptance records"
    - protocol_id: cp_vinyl_pressing
      process_id: "vinyl_pressing"
      flow_role: "Pressing batch log"
      record_type: "batch_and_meter_records"
      raw_fields: "lot_id; compound_formula; external_recycled_fraction; feed_kg; internal_trim_return_kg; exported_trim_kg; accepted_count; net_record_mass_kg"
      collection_method: "Reconcile hopper issues and weighed trim; inspect approved audio and physical record quality."
      unit: "kg; count"
      frequency: "Every pressing campaign"
      temporal_coverage: "Entire declared reporting period; complete campaigns; retain dates and product mix"
      site_scope: "Named plant and included suppliers; no undocumented multi-site pooling"
      aggregation_rule: "Separate internal return from external feed and exported waste before normalization."
      quality_evidence: "Calibration, invoices, stock reconciliation, sample plan, uncertainty and acceptance records"
    - protocol_id: cp_tape_duplication
      process_id: "tape_duplication"
      flow_role: "Duplication and loading log"
      record_type: "batch_and_meter_records"
      raw_fields: "lot_id; tape_type; length_m; linear_mass_kg_per_m; shell_count; shell_mass_kg; splice_length_m; splice_linear_mass; accepted_count; reject_tape_kg; programme_minutes"
      collection_method: "Measure tape use and component masses; reconcile loader counters and sample playback against the approved master."
      unit: "m; kg; count; min"
      frequency: "Every duplication campaign"
      temporal_coverage: "Entire declared reporting period; complete campaigns; retain dates and product mix"
      site_scope: "Named plant and included suppliers; no undocumented multi-site pooling"
      aggregation_rule: "Convert lengths and counts to mass using measurements; account for leaders and cutting loss."
      quality_evidence: "Calibration, invoices, stock reconciliation, sample plan, uncertainty and acceptance records"
    - protocol_id: cp_site_energy
      process_id: "site_energy"
      flow_role: "Meter and emissions ledger"
      record_type: "batch_and_meter_records"
      raw_fields: "meter_id; time_start/end; kWh; gas_m3; gas_reference_conditions; water_kg; blowdown_kg; emission_measurement_or_factor; allocation_driver; operating_hours"
      collection_method: "Use calibrated meters, bills and emissions measurements or verified site-specific factors; retain factor source and boundary."
      unit: "kWh; MJ; m3; kg"
      frequency: "Meter intervals reconciled each reporting period"
      temporal_coverage: "Entire declared reporting period; complete campaigns; retain dates and product mix"
      site_scope: "Named plant and included suppliers; no undocumented multi-site pooling"
      aggregation_rule: "Reconcile allocation shares to site totals; normalize once by campaign accepted mass."
      quality_evidence: "Calibration, invoices, stock reconciliation, sample plan, uncertainty and acceptance records"
    - protocol_id: cp_finishing
      process_id: "finishing"
      flow_role: "Release, packaging and supply ledger"
      record_type: "batch_and_meter_records"
      raw_fields: "lot_id; medium_format; programme_id; accepted_count; unit_mass_kg; packing_count; component_mass_kg; net_ink_kg; stock_changes; waste_kg; supplier_dataset; inbound_transport; delivery_boundary"
      collection_method: "Weigh carriers and each packaging component; reconcile invoices, stock movements, supplier production/transport coverage and release inspection."
      unit: "kg; count; min; tonne-km"
      frequency: "Each lot and reporting period"
      temporal_coverage: "Entire declared reporting period; complete campaigns; retain dates and product mix"
      site_scope: "Named plant and included suppliers; no undocumented multi-site pooling"
      aggregation_rule: "Accepted carrier mass is the denominator; packaging masses and supply links stay separately traceable."
      quality_evidence: "Calibration, invoices, stock reconciliation, sample plan, uncertainty and acceptance records"
  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "q_i = Q_i,allocated / M_good; M_good = N_good × measured mean carrier mass. Keep all input, output and stock quantities on the same time boundary."
      inputs:
        - quantity
        - allocation_share
        - accepted_count
        - unit_mass
      output: "normalized_exchange"
      source_ids: []
    - id: tool_share
      applies_to: "mastering"
      rule: "Allocate total attributable tool and master burden by batch good-copy count / lifetime good-copy count; then normalize. Reconcile partial lifetimes at update."
      inputs:
        - tool_mass
        - good_copy_history
      output: "allocated_tool_mass"
      source_ids: []
    - id: site_share
      applies_to: "site_energy"
      rule: "Allocated quantity = site quantity × measured causal share; all shares must reconcile to the metered total."
      inputs:
        - meter_quantity
        - causal_driver
      output: "allocated_utility"
      source_ids: []
    - id: supply_link
      applies_to: "upstream_dataset"
      rule: "Link each net purchased physical input once to compatible production and inbound-transport data; report coverage and avoid duplicating embedded components."
      inputs:
        - supplier
        - product_state
        - quantity
        - transport
      output: "upstream_link"
      source_ids:
        - ghg-protocol-product-standard-2011
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Retain exact formulation, supplied state, batch, supplier and destination; resolve missing flows before downstream claims of full matching"
      evidence: "Bills of materials and supplier specifications"
    - id: coverage
      applies_to: "reporting period"
      requirement: "Cover full campaigns including setup, test runs, rejects, shutdowns and stock changes; disclose gaps and seasonal or product-mix bias"
      evidence: "Batch/meter reconciliation"
    - id: quality
      applies_to: "accepted output"
      requirement: "Record sample method, approved audio/content criteria, playback equipment and physical checks; do not use theoretical output as accepted output"
      evidence: "Release and rejection logs"
    - id: uncertainty
      applies_to: "all quantities"
      requirement: "Retain measurement uncertainty and actual variability; no literature-derived default amount or numeric range is supplied by this PCR"
      evidence: "Calibration and source applicability assessment"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Require recorded musical content, a declared physical carrier and all reference qualifiers. Blank media, video, spoken-word-only products and playback hardware cannot be the reference output."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_rows
    applies_to: "inventory"
    rule: "Every instantiated exchange must be atomic, have a quantity and unit, and link to a collection record or calculation. Each UUID must match flow type, state and measurement; a missing UUID must remain explicit."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "campaign"
    rule: "Reconcile external material inputs plus opening stocks with accepted media, separate packaging, waste, emissions and closing stocks. Investigate discrepancies against instrument uncertainty and documented transformations rather than inventing a generic tolerance."
    source_ids: []
  - rule_id: validate_route
    applies_to: "process_coverage"
    rule: "Require every applicable process and site-specific extension, matched supplier boundaries and one utility ledger. CD-R supply must not duplicate replicated-CD constituent inputs; coated tape must not duplicate upstream coating manufacture."
    source_ids: []
  - rule_id: validate_quality
    applies_to: "release_and_data"
    rule: "Use campaign acceptance records for readable, correctly sequenced content and carrier-specific physical inspection. Retain failed copies in consumption and reject records. Assess technological, geographic and temporal representativeness, completeness and measurement reliability."
    source_ids:
      - nist-optical-disc-care-2003
      - cci-recording-media-care
      - ghg-protocol-product-standard-2011
  - rule_id: validate_ranges
    applies_to: "quantitative_evidence"
    rule: "Use measured foreground values. External inferred intervals require at least two independent original sources with compatible carrier state, unit and boundary and an explained synthesis. One publication’s scenarios are not independent; exact normalization and unit conversion are not ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing input to a declared physical-music product lifecycle or distribution model"
  allowed_use: "Same carrier construction, product state, technology and supply boundary; scaled by measured mass/count conversion"
  excluded_use: "Unqualified substitution across formats; complete streaming-versus-physical comparisons; retail/playback/end-of-life claims without added scenarios"
  required_metadata: "carrier format and construction; musical programme identifier and duration; recording technology and playback format; accepted unit count and measured net mass per unit; integral shell/label boundary; packaging bill of materials; recording quality acceptance; plant and reporting period; supplier starting conditions; recycled fraction; utility geography and voltage"
  required_quality_disclosure: "Collection dates, instruments, sample coverage, allocation, supplier links, waste routes, UUID gaps, uncertainty and partial lifecycle boundary"
  update_trigger: "Carrier or formulation change; new supplier/grid; route or packaging change; revised yield, tooling life or evidence; significant coverage correction"
