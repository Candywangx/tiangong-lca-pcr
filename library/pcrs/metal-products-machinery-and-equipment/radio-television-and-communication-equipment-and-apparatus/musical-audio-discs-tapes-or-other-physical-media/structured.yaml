  - id: "nac-cassette-production-2026"
    type: "extension_guidance"
    reference: "[National Audio Company, From Master to Mixtape: Part 2 (2026)](https://www.nationalaudiocompany.com/blog/from-master-to-mixtape-part-2/); accessed 2026-09-09"
    used_for: "Original Production and Delivery sections: reel duplication, labels or imprinting, packaging and dispatch. No speeds adopted."
  - id: "nac-cassette-mastering-2026"
    type: "extension_guidance"
    reference: "[National Audio Company, From Master to Mixtape: Part 1 (2026)](https://www.nationalaudiocompany.com/blog/from-master-to-mixtape-part-1/); accessed 2026-09-09"
    used_for: "Original mastering workflow: cue-driven tape cutting and splicing into shells. Audio-quality numerical claims are not adopted."
