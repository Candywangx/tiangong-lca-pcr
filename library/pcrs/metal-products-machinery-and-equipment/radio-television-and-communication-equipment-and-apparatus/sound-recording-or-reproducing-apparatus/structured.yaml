allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "All multi-output or shared operations"
    rule: "First subdivide meters, BOM issues, labor or machine time, lines, test stations, and waste records by product or process. Use system expansion only when the substituted function and dataset are explicitly justified."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_shared_line
    applies_to: "Shared assembly, test, building services, compressed air, and packaging operations"
    rule: "After subdivision is exhausted, allocate using a documented physical driver causally related to resource use, such as machine time, test time, metered energy, processed mass, or accepted units. Revenue allocation requires evidence that no physical relationship is defensible and shall be disclosed."
    source_ids:
      - eu-pef-2021
  - rule_id: alloc_rework_scrap
    applies_to: "Rework, rejects, scrap, and yield loss"
    rule: "Attribute resources and waste to the product batch that caused them. Credit neither internal same-process recycling nor rework return as an avoided product; reconcile gross input, accepted output, internal return, and outbound waste."
    source_ids:
      - mass-balance-identity
  - rule_id: alloc_recycling
    applies_to: "End-of-life recovery and recycled inputs"
    rule: "State the selected cut-off, recycled-content, end-of-life, substitution, or other allocation approach and apply it consistently. Report collection, sorting, treatment yields, substitution quality, and burdens or credits separately; do not claim credit from theoretical recyclability."
    source_ids:
      - eu-pef-2021
      - eu-weee-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_component_mass
      process_id: "component_supply_bom"
      flow_role: "All required component groups and released component set"
      record_type: "BOM, part master, supplier declaration, receipt, and weighing record"
      raw_fields: "product model/family; subtype qualifiers; part number; component group; material class; quantity; part mass; included accessory flag; battery chemistry/capacity/removability; supplier; origin; evidence revision"
      collection_method: "Reconcile engineering BOM to production BOM and procurement receipts; weigh missing high-mass parts; record explicit zero or not applicable by group"
      unit: "kg and unit count"
      frequency: "Each material BOM revision and at least each reporting period"
      temporal_coverage: "Same models and production period as output"
      site_scope: "All sites supplying or assembling included components"
      aggregation_rule: "Sum quantity times verified part mass by component group; production-weight model variants only with disclosed production shares"
      quality_evidence: "Approved BOM revision, scale calibration, supplier declaration, receipt reconciliation, and unresolved-mass log"
    - protocol_id: cp_assembly_materials
      process_id: "apparatus_assembly"
      flow_role: "Released components and assembly consumables"
      record_type: "Material issue, return, inventory, recipe, and transfer records"
      raw_fields: "material/part id; opening stock; issued amount; returned amount; closing stock; batch; line; output mass; date"
      collection_method: "Use mass balance over the shortest complete production period; distinguish installed material, process loss, and returned stock"
      unit: "kg"
      frequency: "Per batch or monthly, whichever gives reliable reconciliation"
      temporal_coverage: "Representative continuous production period, normally at least one month"
      site_scope: "Each included assembly site and line"
      aggregation_rule: "Net issue = opening stock + receipts - closing stock - documented return; normalize to accepted output"
      quality_evidence: "Inventory ledger, issue tickets, transfer records, scales, and reconciliation residual"
    - protocol_id: cp_site_energy_output
      process_id: "apparatus_assembly_final_test_packaging"
      flow_role: "Assembly, test, finishing, and packaging electricity"
      record_type: "Submeter, equipment meter, runtime, and accepted-output records"
      raw_fields: "meter id; start/end reading; interval; voltage; electricity source; line; machine hours; test hours; non-product load; accepted/rejected output mass"
      collection_method: "Prefer dedicated submeters; otherwise combine rated or measured equipment power with logged runtime and validate against site meter"
      unit: "kWh; h; kg"
      frequency: "Meter interval or batch; aggregate monthly"
      temporal_coverage: "Same period as material and output records"
      site_scope: "Each included site and shared utility system"
      aggregation_rule: "Subtract documented out-of-scope loads; subdivide or allocate using section 7; divide by accepted output"
      quality_evidence: "Meter calibration, photos/export, runtime logs, site-bill reconciliation, and allocation worksheet"
    - protocol_id: cp_product_output_yield
      process_id: "apparatus_assembly_final_test_packaging"
      flow_role: "Assembled transfer, conforming output, rejects, and rework"
      record_type: "Production, weighing, serial, test, rework, and shipment records"
      raw_fields: "product id; subtype; unit count; gross and net mass; accepted/rejected status; test result; rework loop; date; line"
      collection_method: "Reconcile unit counts and measured masses across assembly, test, rework, reject, and shipment records"
      unit: "kg and unit count"
      frequency: "Per batch; aggregate monthly"
      temporal_coverage: "Same period as inputs and energy"
      site_scope: "Each included site and final-test route"
      aggregation_rule: "Sum only conforming net product in denominator; keep rework returns and outbound rejects separate"
      quality_evidence: "Calibrated scales, test logs, serial traceability, shipment record, and yield reconciliation"
    - protocol_id: cp_waste_records
      process_id: "component_supply_bom_apparatus_assembly_final_test_packaging"
      flow_role: "Packaging waste, assembly scrap, rejects, and treatment route"
      record_type: "Waste scale ticket, internal collection log, manifest, and contractor statement"
      raw_fields: "waste type; component group; hazard class; gross/tare/net mass; destination; recovery/disposal route; date; site"
      collection_method: "Weigh segregated waste; for mixed waste use documented sorting study and disclose sampling uncertainty"
      unit: "kg"
      frequency: "Each shipment, aggregated over reporting period"
      temporal_coverage: "Same period as production"
      site_scope: "Each included site and contracted first destination"
      aggregation_rule: "Sum net mass by waste type and destination; subtract documented same-process returns only"
      quality_evidence: "Scale tickets, legal manifests where applicable, contractor certificates, and mass reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "apparatus_assembly"
      flow_role: "Direct releases"
      record_type: "Continuous/periodic measurement, permit report, or engineering calculation"
      raw_fields: "substance; compartment; concentration; flow; duration; method; detection limit; control efficiency; date"
      collection_method: "Use measured site releases where available; document equations and source parameters for engineering calculations"
      unit: "kg by substance"
      frequency: "Per permit or measurement frequency, aligned to reporting period"
      temporal_coverage: "Same production period or justified representative period"
      site_scope: "Each included emitting operation and site"
      aggregation_rule: "Sum by substance and compartment; subdivide or allocate under section 7"
      quality_evidence: "Laboratory report, instrument calibration, permit filing, and calculation record"
    - protocol_id: cp_packaging_records
      process_id: "final_test_packaging"
      flow_role: "Outgoing packaging"
      record_type: "Packaging BOM, purchase, issue, and weighing records"
      raw_fields: "packaging id; material; quantity; item mass; recycled content; product model; shipment configuration"
      collection_method: "Reconcile packaging BOM with issues and packed-unit counts; weigh representative items where supplier mass is absent"
      unit: "kg and unit count"
      frequency: "Each packaging revision and reporting period"
      temporal_coverage: "Same shipped-product period"
      site_scope: "All included final packing sites"
      aggregation_rule: "Sum quantity times item mass by material and packaging level"
      quality_evidence: "Packaging specification, scale record, issue ledger, and shipment reconciliation"
    - protocol_id: cp_mode_power_service
      process_id: "use_power_profile"
      flow_role: "Mode power, service hours, charging, and lifetime"
      record_type: "Laboratory measurement and declared scenario record"
      raw_fields: "exact model/variant; firmware; input voltage/frequency; power supply; battery state; mode; signal/source/media; load/output setting; connectivity; display state; measured W; stabilization; duration; auto-power-down time; hours/year; years"
      collection_method: "Measure supported modes under documented stable conditions; use IEC 62087-6 procedures where applicable; construct transparent scenario from mode hours"
      unit: "W; h; kWh"
      frequency: "Each power-relevant hardware/firmware revision and each scenario revision"
      temporal_coverage: "Current product configuration and stated use reference period"
      site_scope: "Tested variants and declared use geography"
      aggregation_rule: "Use production-weighted variants only with disclosed weights; compute each mode separately and sum without overlap"
      quality_evidence: "Accredited or controlled test report, calibrated meter, raw time series, firmware id, scenario source, and sensitivity analysis"
    - protocol_id: cp_end_of_life_scenario
      process_id: "end_of_life"
      flow_role: "Collection, reuse, dismantling, recovery, and residuals"
      record_type: "Regional statistics, treatment records, composition/BOM, and scenario assumptions"
      raw_fields: "geography; year; lifetime; collection rate; reuse/repair share; battery removal; component removal; treatment route; material yield; recovered output; residual; substitution quality"
      collection_method: "Link treatment routes to declared composition; use measured operator data where available and otherwise disclose secondary-data representativeness"
      unit: "kg and fraction"
      frequency: "Each scenario or major treatment/composition revision"
      temporal_coverage: "Scenario year and product cohort stated"
      site_scope: "Declared market and treatment geography"
      aggregation_rule: "Reconcile inputs to recovered outputs, residual waste, direct releases, and stock change; show allocation separately"
      quality_evidence: "Treatment operator record or official statistics, scenario citation, mass balance, and uncertainty/sensitivity record"
  calculation_rules:
    - id: calc_bom_group_mass
      applies_to: "Required component-group disclosures"
      rule: "For group g, m_g = sum(quantity_i × verified part_mass_i); normalize m_g by conforming net product mass. Keep unassigned BOM mass as an explicit unresolved group until corrected."
      inputs:
        - "BOM quantity"
        - "part mass"
        - "included flag"
        - "conforming output mass"
      output: "kg component group per kg reference product and BOM coverage"
      source_ids:
        - iec-62474-2018
        - mass-balance-identity
    - id: calc_energy_intensity
      applies_to: "Assembly and final-test electricity"
      rule: "E_intensity = (metered electricity - documented out-of-scope electricity) × allocation share / conforming process output mass."
      inputs:
        - "Meter readings"
        - "out-of-scope loads"
        - "allocation driver"
        - "accepted output"
      output: "kWh per kg process output"
      source_ids:
        - eu-pef-2021
    - id: calc_yield
      applies_to: "Assembly and final test"
      rule: "Yield = conforming output mass / gross input mass relevant to that stage. Report unit-count yield separately when average unit mass varies."
      inputs:
        - "Gross relevant input"
        - "accepted output"
        - rejects
        - "rework returns"
      output: "Mass yield and unit-count yield"
      source_ids:
        - mass-balance-identity
    - id: calc_use_energy
      applies_to: "Optional use profile"
      rule: "E = sum(P_mode × h_mode) / 1,000, with P in W and h in hours; add separately measured charging or external-power losses only when not already inside mode measurements."
      inputs:
        - "Measured power by supported mode"
        - "hours by mode"
        - "reference period"
        - lifetime
      output: "kWh per reference period and lifetime"
      source_ids:
        - iec-62087-6
        - itu-l-1410-2024
    - id: calc_mass_reconciliation
      applies_to: "Manufacturing and end-of-life processes"
      rule: "Residual = total mass inputs - product outputs - waste outputs - measured elementary mass outputs - documented stock change. Investigate rather than force residual to zero."
      inputs:
        - "All mass-bearing inputs/outputs and stock change"
      output: "Absolute and percentage mass-balance residual"
      source_ids:
        - mass-balance-identity
    - id: calc_variant_weighting
      applies_to: "Product-family dataset"
      rule: "Weighted result = sum(production share_v × result_v); shares sum to 1 and each variant meets the category and qualifier requirements. Do not average different market states."
      inputs:
        - "Variant-specific inventory and actual production shares"
      output: "Production-weighted family result plus variant spread"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_completeness
      applies_to: "BOM, energy, output, waste, direct releases, use and end-of-life modules"
      requirement: "State coverage for each required component group and process. Record explicit zero/not applicable, cut-offs, unresolved BOM mass, unmetered utilities, and omitted routes; absence of a record is not zero."
      evidence: "Coverage matrix, unresolved-item log, and mass/energy reconciliation"
    - id: dq_precision
      applies_to: "Measured and calculated foreground quantities"
      requirement: "Retain instrument resolution, calibration, sampling approach, variability, allocation uncertainty, and calculation precision. Material discrepancies shall trigger correction or a documented limitation."
      evidence: "Calibration certificates, raw records, uncertainty or sensitivity calculation"
    - id: dq_temporal
      applies_to: "All datasets"
      requirement: "Align inputs, energy, output, and waste to one declared representative period. Disclose older supplier, electricity, use, or treatment data and justify continued representativeness."
      evidence: "Dated source records, reporting-period statement, revision log"
    - id: dq_geographical
      applies_to: "Supply chain, manufacturing, use electricity, and end of life"
      requirement: "Match each dataset to the actual or declared geography. Do not apply an EU regulatory or treatment scenario globally without a jurisdiction-specific assumption."
      evidence: "Site and supplier locations, electricity region, market/treatment geography, mismatch log"
    - id: dq_technological
      applies_to: "Product subtype and manufacturing route"
      requirement: "Match recording/playback function, portability, signal architecture, storage/media, battery/power, display/control, and production technology. A single model may represent only itself unless production weighting is documented."
      evidence: "Configuration record, BOM revision, process route, variant weights, and test report"
    - id: dq_source_traceability
      applies_to: "Secondary and supplier data"
      requirement: "Preserve source title, issuer, version/date, URL or dataset identifier, access date, dataset geography/technology, and transformation. Search snippets are not evidence."
      evidence: "Source register and calculation workbook"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference product"
    rule: "Confirm UUID cf3287f1-47c4-472c-86ab-a9e5ac93a858, state code 100, Product flow type, CPC 3.0 code 47321 semantics, Mass property UUID, Units of mass UUID, and kg reference unit."
    source_ids:
      - unsd-cpc-3
  - rule_id: val_subtype_matrix
    applies_to: "Product metadata"
    rule: "Require recording/playback/both, portable/fixed, analog/digital/hybrid, internal/removable/both/external-or-streamed media configuration, consumer/professional use, and power architecture; reject undisclosed subtype values."
    source_ids:
      - unsd-cpc-3
  - rule_id: val_component_groups
    applies_to: "BOM and inventory"
    rule: "Require separate audio electronics, drive/media, storage, display/control, battery, power supply, enclosure, and other component masses with evidence, explicit zero/not applicable, and included-accessory treatment."
    source_ids:
      - iec-62474-2018
      - eu-batteries-2023
  - rule_id: val_mass_balance
    applies_to: "Each manufacturing and treatment stage"
    rule: "Reconcile mass inputs, product outputs, waste, measured direct releases, and stock change. Flag unexplained residuals; do not repair them with invented component amounts or category averages."
    source_ids:
      - mass-balance-identity
  - rule_id: val_power_profile
    applies_to: "Use-sensitive dataset"
    rule: "Require exact tested variant, firmware, input conditions, mode definitions, signal/media/load, external-power boundary, measured W, mode hours, lifetime, and non-overlapping energy calculation. Rated input alone is insufficient."
    source_ids:
      - iec-62087-6
      - itu-l-1410-2024
  - rule_id: val_functional_output
    applies_to: "Final product"
    rule: "Confirm the declared recording and/or playback functions and applicable storage/media, control, power, acoustic/electrical, and safety acceptance tests passed for the output denominator."
    source_ids:
      - iec-62087-6
  - rule_id: val_no_category_proxy
    applies_to: "Dataset selection and family averaging"
    rule: "Reject standalone speakers, amplifiers, phones, general computers, video equipment, intermediate audio units, parts, or a narrow player model as an unqualified proxy for CPC 47321."
    source_ids:
      - unsd-cpc-3
  - rule_id: val_allocation_and_recycling
    applies_to: "Shared operations, scrap, and end of life"
    rule: "Verify subdivision attempts, causal allocation drivers, yield attribution, and explicit recycling approach. Reject credits based solely on theoretical recyclability."
    source_ids:
      - eu-pef-2021
      - eu-weee-2012
  - rule_id: val_source_quality
    applies_to: "All external and secondary evidence"
    rule: "Verify authoritative full-text source, stable reference, applicability, time/geography/technology fit, and explicit transformations. Treat unsupported quantities and search snippets as unavailable."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Product-specific or transparently production-weighted foreground dataset for manufacturing a CPC 47321 sound recording or reproducing apparatus, with optional separate use and end-of-life modules."
  downstream_use: "Foreground data package supporting Tiangong process and lifecyclemodel projections, product LCAs, design comparisons within the same declared function, and supply-chain studies."
  allowed_use: "Use for the exact declared subtype, model, family, production route, geography, period, and market state after all required qualifiers, component groups, power facts, allocation, and quality limitations are disclosed."
  excluded_use: "Generic proxy for all audio equipment; proxy for a speaker, amplifier, phone, computer, video apparatus, intermediate unit, part, media, service, or an unrelated player model; comparative assertion with mismatched function, lifetime, service level, or system boundary."
  required_metadata: "Canonical PCR id; reference-flow UUID and unit chain; CPC reference; all subtype qualifiers; model/family and production shares; net and unit mass; included accessories; component-group masses; battery/power information; sites and period; manufacturing boundary; test criteria; packaging; yield; allocation; use and end-of-life scenario identifiers where present."
  required_quality_disclosure: "Primary-versus-secondary data shares; BOM coverage and unresolved mass; meter and output coverage; cut-offs; allocation drivers; temporal, geographical, and technological mismatches; variability and uncertainty; unsupported numerical values omitted; limitations of any use or treatment scenario."
  update_trigger: "Product architecture or function change; BOM, battery, power supply, display/control, drive/storage, enclosure, firmware power behavior, production route/site, energy source, packaging, allocation, use profile, lifetime, regulation, treatment route, or authoritative source revision that can materially change results or interpretation."
data_sources:
  - id: "unsd-cpc-3"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, current classification and structure, https://unstats.un.org/unsd/classifications/Econ/CPC"
    used_for: "CPC 47321 identity and separation from video apparatus, standalone loudspeakers/amplifiers, parts, media, and services."
  - id: "iec-62087-6"
    type: "standard"
    reference: "IEC 62087-6:2015, Audio, video, and related equipment — Determination of power consumption — Part 6: Audio equipment, https://webstore.iec.ch/en/publication/22586"
    used_for: "Applicable audio-equipment power modes, stable measurement conditions, decoding/playback, idle, and auto-power-down testing. No numerical default is taken from the abstract."
  - id: "itu-l-1410-2024"
    type: "method_factor"
    reference: "ITU-T Recommendation L.1410 (11/2024), Methodology for environmental life cycle assessments of information and communication technology goods, networks and services, https://www.itu.int/epublications/zh/publication/itu-t-l-1410-2024-11-methodology-for-environmental-life-cycle-assessments-of-information-and-communication-technology-goods-networks-and-services"
    used_for: "Life-cycle stages, realistic use scenario, service time, ICT-relevant digital/network-capable variants, manufacturing and end-of-life transparency. It is not used to classify non-ICT apparatus."
  - id: "eu-pef-2021"
    type: "method_factor"
    reference: "European Commission Recommendation on the use of Environmental Footprint methods, Annex I, https://environment.ec.europa.eu/document/download/680503dc-5a19-4f6a-bb92-84d9bfc8f312_en?filename=Annexes+1+to+2.pdf"
    used_for: "Functional-unit dimensions, life-cycle boundary, company-specific BOM/energy/activity data, allocation hierarchy, data-quality criteria, and transparent calculation rules."
  - id: "iec-62474-2018"
    type: "standard"
    reference: "IEC 62474:2018, Material declaration for products of and for the electrotechnical industry, https://webstore.iec.ch/en/publication/29857"
    used_for: "BOM/material declaration structure and traceability for electronic component groups; not used as a quantitative inventory factor."
  - id: "eu-weee-2012"
    type: "official_guidance"
    reference: "Directive 2012/19/EU on waste electrical and electronic equipment, https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32012L0019"
    used_for: "EU-applicable consumer/professional EEE treatment, component/material identification, selective treatment, and separate handling of relevant components."
  - id: "eu-batteries-2023"
    type: "official_guidance"
    reference: "Regulation (EU) 2023/1542 concerning batteries and waste batteries, https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32023R1542"
    used_for: "EU-applicable battery identification, removability/replacement information, and end-of-life separation; not applied outside its jurisdiction without disclosure."
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass accounting identity; no external quantitative factor"
    used_for: "BOM, process, yield, and treatment reconciliation. It supplies no category-average amount or QA threshold."
