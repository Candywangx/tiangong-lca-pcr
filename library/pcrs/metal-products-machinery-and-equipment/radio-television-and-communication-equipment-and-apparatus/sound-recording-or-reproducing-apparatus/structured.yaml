product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.radio-television-and-communication-equipment-and-apparatus.sound-recording-or-reproducing-apparatus"
  classification_refs: "CPC 3.0: 47321, Sound recording or reproducing apparatus (exact)"
  covered_products: "Finished consumer, professional, or digital-content apparatus whose primary function is sound recording, sound reproduction, or both, including portable and fixed, analog, digital, and hybrid variants using internal storage, removable media, or an external/streamed source."
  excluded_products: "Standalone loudspeakers, headphones, microphones, amplifiers, mobile phones, tablets, general computers, video apparatus, broadcast receivers, parts, media, services, and a single narrow player model used as a proxy for the category."
  representative_product: "The actual declared apparatus or production-weighted family satisfying CPC 47321; no default model represents the category."
  production_route: "Purchased materials, components, and subassemblies; electronics and mechanical integration; firmware or control configuration where present; functional and electrical testing; finishing and packaging."
  market_state: "Finished conforming apparatus at the producer gate; new, refurbished, or remanufactured market state shall be declared and shall not be mixed without separate results."
functional_unit:
  what: "Finished sound recording or reproducing apparatus with the declared product subtype and included components."
  how_much: "1 kg net mass of conforming finished apparatus at the producer gate."
  how_well: "Passes the manufacturer's declared recording and/or playback function and applicable electrical, acoustic, storage/media, control, and safety acceptance tests; the tested functions and acceptance criteria are disclosed."
  how_long_or_cycle: "One producer-gate delivery of finished apparatus; design life, warranty, expected service life, duty cycle, and replacement assumptions are declared separately when use or life-cycle results are reported."
  reference_flow_link: "Output row finished_apparatus of process final_test_packaging."
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The required foreground boundary is cradle-to-producer-gate for the finished apparatus. Purchased materials, electronic parts, drives, storage devices, displays, controls, batteries, power supplies, enclosures, cables, and other subassemblies cross the starting boundary as product inputs. The foreground includes assembly and integration, software or firmware loading when part of production, functional and electrical tests, rework and yield losses, on-site utilities, direct releases, and packaging. Upstream production of purchased inputs is linked through supplier-specific or fit-for-purpose secondary datasets rather than silently absorbed into a generic apparatus proxy."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Use and end-of-life modules are conditional and shall be added for cradle-to-grave claims or comparisons affected by operational energy, lifetime, repair, battery replacement, storage/media replacement, or treatment route. Their assumptions and results remain separately visible from producer-gate manufacturing."
      source_ids: []
    - rule_id: sb_factory_gate
      applies_to: "Required manufacturing profile"
      rule: "Include raw-material and component supply links plus foreground assembly, integration, testing, rework, utilities, direct releases, waste, and packaging up to the producer gate. Keep purchased-input production distinguishable from foreground operations."
      source_ids:
        - eu-pef-2021
        - itu-l-1410-2024
    - rule_id: sb_component_groups
      applies_to: "Product composition"
      rule: "Report audio electronics, drive/media-handling, storage, display/control, battery, power supply, enclosure, and other included components as separate groups, including explicit zero or not-applicable values."
      source_ids:
        - iec-62474-2018
    - rule_id: sb_test_and_rework
      applies_to: "Manufacturing sites"
      rule: "Include functional test, electrical test, firmware/configuration operations, calibration where relevant, rework, reject handling, and associated energy and materials."
      source_ids:
        - eu-pef-2021
    - rule_id: sb_use_profile
      applies_to: "Cradle-to-grave or use-sensitive study"
      rule: "Model supported recording, playback/decoding, idle, standby, and auto-power-down modes separately with measured power, hours, lifetime, and electricity mix; do not impose unsupported modes."
      source_ids:
        - iec-62087-6
        - itu-l-1410-2024
    - rule_id: sb_end_of_life
      applies_to: "Cradle-to-grave study"
      rule: "Keep collection, preparation for reuse or repair, dismantling, battery removal, treatment, recycling, recovery, and final disposal assumptions explicit and region-specific."
      source_ids:
        - itu-l-1410-2024
        - eu-weee-2012
        - eu-batteries-2023
    - rule_id: sb_no_proxy_collapse
      applies_to: "Dataset selection and interpretation"
      rule: "Do not use a standalone speaker, amplifier, phone, general computer, video apparatus, intermediate audio-equipment unit, or one narrow player model as a proxy for the full CPC 47321 category."
      source_ids:
        - unsd-cpc-3
boundary_abstraction:
  declared_starting_condition: "Purchased materials, named components and subassemblies, energy, water, consumables, and packaging delivered to the declared manufacturing sites."
  starting_condition_role: "Upstream product inputs to foreground assembly, integration, test, finishing, and packaging."
  product_classification_scope: "CPC 3.0 code 47321 only, constrained by primary sound recording/reproduction function and the required subtype qualifiers."
  recursive_input_rule: "If a same-category apparatus or intermediate audio-equipment unit is used as an input, keep its supplied identity, mass, function, and upstream dataset link explicit; do not relabel it as the study output or recursively apply this PCR without a separately justified boundary."
  upstream_dataset_requirement: "Prefer supplier-specific component data. Otherwise select secondary data matching component technology, material, geography, time, and production route, and disclose every mismatch and cut-off."
  disclosure: "Declare sites, assembly depth, purchased-versus-made component groups, product subtype, included accessories, BOM coverage, test boundary, packaging, yield, allocation, use profile if any, end-of-life scenario if any, and data gaps."
