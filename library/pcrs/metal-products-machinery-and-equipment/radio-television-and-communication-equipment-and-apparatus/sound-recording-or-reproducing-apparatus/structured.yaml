measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and all mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize the conforming net finished output to exactly 1 kg. Retain measured unit count and average mass per unit so unit-based product records can be reconciled to mass."
  - id: component_mass
    applies_to: "Audio electronics, drive/storage, display/control, battery/power, enclosure, other components, scrap, and packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record wet or as-received mass consistently. Do not infer missing component-group masses from a single model; measure or obtain BOM and supplier records, and declare exclusions."
  - id: electrical_energy
    applies_to: "Manufacturing and use-stage electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Derive energy from calibrated meters or power integrated over time. Record voltage, frequency, meter boundary, test load or signal, duration, mode, and external-power-supply treatment."
  - id: operating_power
    applies_to: "Recording, playback/decoding, idle, standby, and auto-power-down modes"
    required_property_ref:
      name: "Power"
      uuid: ""
    required_unit: "W"
    rule: "Measure only modes supported by the declared subtype, using documented stable conditions and IEC 62087-6 procedures where applicable. Never substitute rated input power for measured operating power without labeling it as such and excluding it from calculated use energy."
  - id: service_time
    applies_to: "Optional use-stage profile"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "h"
    rule: "Report hours by mode and reference period. Do not combine mode power with an undisclosed duty cycle or lifetime."
