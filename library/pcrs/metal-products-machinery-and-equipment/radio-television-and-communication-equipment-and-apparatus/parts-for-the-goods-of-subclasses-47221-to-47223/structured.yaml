    type: "handbook"
    reference: "Apple iPhone15/15Plus Enclosure, 10 April2025, Before You Begin/Reassembly; https://support.apple.com/en-gb/120605"
    used_for: "Delivered enclosure requires logic board, battery, display and other remaining host assembly; example only"
