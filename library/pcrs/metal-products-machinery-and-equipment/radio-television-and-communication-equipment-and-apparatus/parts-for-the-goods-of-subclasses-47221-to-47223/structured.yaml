  - id: "cpc3-telecom"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes, 30 June 2025, pp257/259; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Host and part taxonomy, complete apparatus and ADP card counter-boundary; no material recipe"
