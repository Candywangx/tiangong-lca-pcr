allocation_rules:
  - rule_id: allocation_causality
    applies_to: "shared factory operations"
    rule: "Investigate subdivision/system expansion first. If unavoidable, retain total inventories and choose demonstrated physical causality; use actual molding shot/cavity loading, machining time, reflow loading or measured testing demand as appropriate, not part mass merely because output is kg. Other relationships need justification and sensitivity."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_residual
    applies_to: "scrap and rework"
    rule: "Do not assume sold scrap is a co-product or avoided-primary-material credit. Disclose selected recycling/treatment allocation, provider and fate; cancel internal regrind/return transfers but retain repeated energy and losses. Rejected parts and retests contribute to the accepted output denominator."
    source_ids:
      - ef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "p_dispatch"
      flow_role: "accepted net part"
      record_type: "foreground_record"
      raw_fields: "drawing; revision; host; delivered state; batch; tare; calibrated accepted net kg; accepted count"
      collection_method: "Weigh the identical accepted part population on calibrated scales excluding transport packaging; retain traceable batch/count pairing and acceptance record."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_bom
      process_id: "p_receipt"
      flow_role: "purchased constituent"
      record_type: "foreground_record"
      raw_fields: "part number; state; make/buy; supplier; provider scope; delivery mass; stock change"
      collection_method: "Reconcile receipt/issue/BOM and supplier scope with actual drawing; weigh components when counts supplied."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_material
      process_id: "p_mechanical"
      flow_role: "certified stock"
      record_type: "foreground_record"
      raw_fields: "grade; formulation; dry basis; batch; received/issued mass; accepted mass; stock"
      collection_method: "Use calibrated weighbridge or scale and certificate; reconcile scrap/regrind and opening/closing stocks without a fixed yield."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_chem
      process_id: "p_finish"
      flow_role: "specific chemical"
      record_type: "foreground_record"
      raw_fields: "species; grade; concentration; active fraction; supplier; weighed consumption; bath stock; reaction; recovery"
      collection_method: "Reconcile metered additions, assay and stock records; distinguish gross formulation mass from each active chemical."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_energy
      process_id: "p_utilities"
      flow_role: "actual energy interface"
      record_type: "foreground_record"
      raw_fields: "meter; voltage; country; provider; process/load; test duration; kWh; fuel volume; calorific value"
      collection_method: "Submeter actual process/test energy, retain load allocation and supplier interface; convert electricity kWh to MJ and fuel volume using actual conditions and calorific value."
      unit: "MJ"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_residual
      process_id: "p_utilities"
      flow_role: "one residual stream"
      record_type: "foreground_record"
      raw_fields: "named stream; wet/dry mass; assay; stocks; return; external destination; treatment provider"
      collection_method: "Weigh each segregated waste stream and sample its composition; reconcile internal returns independently of outgoing residuals."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_water
      process_id: "p_utilities"
      flow_role: "water and effluent"
      record_type: "foreground_record"
      raw_fields: "supply; flowmeter; density; copper species; concentration; volume; stock; evaporation; provider"
      collection_method: "Use calibrated meters and matching timed concentration samples; distinguish makeup, internal circulation and actual discharge."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_emission
      process_id: "p_utilities"
      flow_role: "one emitted species"
      record_type: "foreground_record"
      raw_fields: "species; compartment; control state; flow; concentration; measurement duration; factor scope; stock recovery"
      collection_method: "Measure post-control discharge or apply a justified species-specific factor with matching activity; retain uncertainty and do not infer CO/NO2 from fuel carbon alone."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
    - protocol_id: cp_pack
      process_id: "p_dispatch"
      flow_role: "one packing component"
      record_type: "foreground_record"
      raw_fields: "carton/bag identity; composition; received/used mass; supplier; return rate"
      collection_method: "Weigh each actual packing component and reconcile consumed batch packaging; keep it outside reference part net mass."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same production period and drawing revision"
      site_scope: "actual site and traceable supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceability; uncertainty; reconciliation"
  calculation_rules:
    - id: batch_normalization
      applies_to: "all inventory rows"
      rule: "Divide attributable batch exchange by calibrated accepted net part batch mass in kg; keep original numerator unit and reject nonpositive denominator. Reference output remains 1 kg."
      inputs:
        - cp_mass
        - "actual batch exchange"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: energy_conversion
      applies_to: "test_power; factory_power"
      rule: "Metered kWh multiplied by 3.6 yields MJ before division by accepted net kg. Preserve actual country/voltage/provider and exclude duplicated test consumption."
      inputs:
        - cp_energy
        - cp_mass
      output: "MJ per kg"
      source_ids: []
    - id: contained_species
      applies_to: "material, chemical, residual and emitted-species mass balances"
      rule: "For each material and chemical use its measured gross amount times matched assay/concentration for contained species; retain opening/closing stocks, reaction retention and actual releases, not a generic common assay."
      inputs:
        - cp_material
        - cp_chem
        - cp_residual
        - cp_emission
      output: "separate species balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Actual drawing/interface/state and exact supplier grade; UUID type/property/unit/geography checked before adoption. The category-level flow does not supply drawing, site, supplier, geography or specific part qualifications; collect these explicitly."
      evidence: "drawing; direct-read identity; supplier scope"
    - id: dq_coverage
      applies_to: "all processes"
      requirement: "Route ledger records included, not_applicable, zero and unknown separately; candidate source examples establish no universal empirical ranges."
      evidence: "route evidence; measured period totals"
validation_rules:
  - rule_id: validate_scope
    applies_to: "final_part"
    rule: "Verify qualifying host and delivered incomplete part, exact revision and remaining assembly; completed optional handsets, modems/routers and ADP network cards cannot be passed as dedicated parts by compatibility alone."
    source_ids:
      - cpc3-telecom
      - panasonic-handset
  - rule_id: validate_mass
    applies_to: "all inventory rows"
    rule: "Check positive calibrated accepted net batch kg, same drawing/BOM/state/period and counted population; reconcile acceptance, reject and rework. Exclude packaging from reference mass and retain numerator units."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Close external gross material inputs plus opening stocks against accepted constituents, external scrap/waste, emissions and closing stocks; cancel paired internal transfers. Separately close each actual Cu,Al,Sn,Ag,Fe and other species using its own matched assay on every term. Include reactions, oxidation, dissolved releases and wet/dry moisture; gross scrap is not contained copper. Close water makeup/stock, discharge, evaporation and carryover; chemical additions/stock, recovery, reaction and residuals. Investigate imbalance against measured uncertainty; no invented fixed tolerances or yields. Fuel carbon may support CO2 with evidence but not establish CO or NO2."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check all real conditional operations and atomic exchanges, make/buy upstream burden once, utility provider/voltage, actual waste fate and emitted species/compartment. Unknown mandatory quantity, unresolved required UUID/provider or unsupported conversion blocks a complete dataset; methodology measurement pass is not apparatus conformity or evidence completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matched part specification/state upstream interface for foreground packages and downstream process/lifecyclemodel construction"
  excluded_use: "Generic complete handset/router model; host use-phase electricity; cross-part functional comparison by kg; unqualified material substitution"
  required_metadata: "All reference qualifiers, actual routes, supplier coverage and allocation"
  required_quality_disclosure: "Unresolved identities/providers, measured uncertainties, missing source/range coverage and exact boundaries"
  update_trigger: "Drawing/BOM/revision, delivered state, make/buy, supplier, material grade, factory route/test or utility change"
