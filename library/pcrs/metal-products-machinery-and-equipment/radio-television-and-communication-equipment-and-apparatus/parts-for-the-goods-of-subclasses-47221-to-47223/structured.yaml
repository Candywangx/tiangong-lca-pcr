    type: "handbook"
    reference: "Apple iPhone15 USB-C Connector, 3 June2025, Removal/Reassembly; https://support.apple.com/en-gb/122386"
    used_for: "Dedicated connector flex, host assembly and cleaning identity; not factory quantity factors"
  - id: "cisco-network-module"
    type: "handbook"
    reference: "Cisco Catalyst9500 Hardware Installation Guide, Installing a Network Module; https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9500/hardware/install/b_catalyst_9500_hig/9500_installing-network-module.html"
    used_for: "Specific slot/blank airflow and modular interfaces; active module classification unresolved without completion review"
  - id: "panasonic-handset"
    type: "handbook"
    reference: "Panasonic handset part-number/model compatibility list; https://help.na.panasonic.com/answers/parts-and-accessories-telephone-handset-part-number-to-model-number-compatibility-list/"
    used_for: "Optional operational handset counterexample: compatibility does not prove incomplete part"
  - id: "taoglas-cellular"
    type: "handbook"
    reference: "Taoglas FXP14.07.0100A Flexible PCB Cellular Antenna, SPE-12-8-050-G, p1; https://cdn.taoglas.com/datasheets/FXP14.07.0100A.pdf"
    used_for: "Passive cellular flex antenna cable/connector/adhesive integration example, not universal dedication or manufacturing recipe"
  - id: "protolabs-molding"
    type: "handbook"
    reference: "Protolabs Injection Molding Services, tooling/materials/quality sections; https://www.protolabs.com/services/injection-molding/"
    used_for: "Conditional plastic forming, resin alternatives and inspection capability; actual supplier grade and operations must be collected"
  - id: "census-electronics"
    type: "official_guidance"
    reference: "US Census Schedule B2022 Chapter85, headings8517/8534/8536/8541/8542; https://www.census.gov/foreign-trade/schedules/b/2022/c85.html"
    used_for: "Independent counterevidence for apparatus/parts and separately described generic electronic components; not an automatic CPC mapping"
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation(EU)2021/2279, section4.5 pp87–88; https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX%3A02021H2279-20211230"
    used_for: "Allocation hierarchy and demonstrable physical relationship"
