measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect accepted net part batch mass using cp_mass on calibrated scales, same drawing/revision/BOM/state; exclude transport packaging and non-delivered tooling. Inventory and collection use per 1 kg reference flow."
  - id: count_mass
    applies_to: "counted physical part and material records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Count records require calibrated measured accepted batch net mass for the identical counted population; do not infer mass from nominal handset weight, housing percentage or an unrelated revision. Divide batch exchanges by that measured accepted kg; individual weighing/count conversion must reproduce the same net batch basis."
  - id: species_basis
    applies_to: "material, chemical, residual and emitted-species mass balances"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep gross material and contained-element masses separate; assays must match grade, solution concentration, wet/dry state and sampling period."
  - id: energy_units
    applies_to: "test_power; factory_power; natural_gas"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Energy stays MJ; calibrated kWh converts by 3.6 MJ/kWh. Gas volume requires supplier calorific value and measured conditions."
