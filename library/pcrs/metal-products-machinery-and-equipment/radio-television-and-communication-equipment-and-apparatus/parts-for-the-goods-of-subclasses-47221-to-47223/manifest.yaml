review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_uuid:
    - Category-level reference is verified; actual drawing/state, geography and provider coverage remain mandatory foreground declarations, not supplied by the category flow.
    - Conditional specific stock, chemical, mounted board, antenna, connector, waste and emission UUIDs require direct-read identity confirmation for the actual BOM and delivery interface.
    - Telephone plastic housing flow a7c76266-b6bb-4da2-bd63-24190b377b3f is not adopted because its classification and average mass proxy cannot establish this category boundary.
  unresolved_ranges:
    - No category-wide measured yield, energy, chemistry, emission or mass distribution is established; collect real records instead of imposing defaults.
  boundary_review:
    - Review the actual delivered drawing and remaining host assembly for functional network or RF modules; compatibility alone is insufficient.
    - Primary sources establish bounded example parts and manufacturing capabilities, not every material grade or factory operation.
