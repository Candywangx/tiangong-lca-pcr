      collection_method: "Submeter or validated equipment study reconciled to facility meter"
      unit: "kWh"
      frequency: "Each lot or shift"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Inspection and packing equipment"
      aggregation_rule: "Attribute once, include measured standby, convert to MJ and normalize"
      quality_evidence: "Calibration; equipment study; facility reconciliation"
  calculation_rules:
    - id: normalize_lot
      applies_to: "Every inventory row"
      rule: "q_i = Q_i / M_accept, with M_accept > 0; combine compatible lots by sum(Q_i)/sum(M_accept), never an unweighted mean of lot intensities. Q_i is allocated net consumption, transfer, waste or release in the declared period."
      inputs:
        - "Protocol-specific Q_i"
        - "accepted dry mass from cp_dispatch"
      output: "Exchange per 1 kg accepted blank"
      source_ids:
        - ghg-protocol-product-standard-2011
    - id: blank_mass_balance
      applies_to: "Dry blank transfers"
      rule: "M_in = M_accept + M_reject + delta_M_stock for inspection; account separately for any sampled or reworked material. Pair coated_blank_out and coated_blank_in before aggregation."
      inputs:
        - cp_coating_materials
        - cp_dispatch
      output: "Lot and transfer reconciliation; accepted yield from actual records"
      source_ids:
        - ghg-protocol-product-standard-2011
    - id: solvent_species_balance
      applies_to: "Acetone and each additional actual solvent"
      rule: "E_air = M_in - M_retained - M_waste - M_recovered_export - M_destroyed - delta_M_stock. M_in includes the species in supplied lacquer and separately added solvent. Validate with measurements and uncertainty; negative results require investigation, not clipping to zero. A destruction term requires a balanced treatment model."
      inputs:
        - cp_solvent_balance
      output: "Species-specific residual air release; distinguish measured from balance-derived results"
      source_ids:
        - us-epa-ap42-industrial-coating
    - id: coating_solids_check
      applies_to: "Lacquer deposition"
      rule: "Compare dry coating gain against supplied nonvolatile solids less solids in wastes and stock change. Retain substrate mass and residual-solvent correction; do not force unmatched mass into a generic emission."
      inputs:
        - cp_coating_materials
        - cp_solvent_balance
        - cp_coating_wastes
      output: "Evidence of coating and solvent balance closure"
      source_ids:
        - us-epa-ap42-industrial-coating
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and route"
      requirement: "Preserve unrecorded status and all reference qualifiers. Historic media composition is not a modern supplier recipe or production-intensity dataset."
      evidence: "Supplier and acceptance records; un-cpc-3-0-notes-2025; cci-recording-media-care"
    - id: dq_coverage
      applies_to: "Foreground records"
      requirement: "Cover a disclosed continuous period with startup, standby, rework, failures and stock changes. Assess temporal, geographic and technological representativeness, completeness and reliability; never treat absent data as zero."
      evidence: "Protocol records and coverage matrix; ghg-protocol-product-standard-2011"
    - id: dq_uncertainty
      applies_to: "Balances and allocation"
      requirement: "Retain measurement uncertainty, analytical detection limits, shared-meter drivers and unmeasured residuals. Establish site-specific balance acceptance from instrument uncertainty; investigate exceptions."
      evidence: "Calibration, sampling and balance review; ghg-protocol-product-standard-2011"
    - id: dq_composition
      applies_to: "Coating and wastes"
      requirement: "Obtain actual formulation and waste composition. Protect confidential detail through controlled evidence access while retaining enough information for independent verification."
      evidence: "Formulation certificate, assay and waste test; us-epa-ap42-industrial-coating"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Reference definition"
    rule: "Require exactly one accepted reference output, net mass basis, all qualifiers and evidence of the unrecorded state. Reject a recorded master or final pressing as the reference product."
    source_ids:
      - un-cpc-3-0-notes-2025
  - rule_id: validate_inventory
    applies_to: "Exchanges and traceability"
    rule: "Require one atomic exchange per row, direction and type consistency, unit compatibility, and a collected or calculated amount linked to a protocol. Do not replace a missing flow identity with an approximate material or an aggregate waste label."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_balance
    applies_to: "Production and solvent balances"
    rule: "Reconcile internal transfers, accepted mass, rejects, stock and packaging. Close solvent balances by species and state the uncertainty. Do not enter electricity-supply emissions again as direct foreground emissions."
    source_ids:
      - us-epa-ap42-industrial-coating
      - ghg-protocol-product-standard-2011
  - rule_id: validate_applicability
    applies_to: "Conditional exchanges and route extensions"
    rule: "Document actual absence for nonapplicable cards. Add separate rows for any actual solvent, fuel, treatment input, treatment output or emission outside the representative pattern before claiming complete site coverage."
    source_ids:
      - us-epa-ap42-industrial-coating
      - ghg-protocol-product-standard-2011
  - rule_id: validate_evidence
    applies_to: "Quantities and downstream use"
    rule: "Use actual foreground records for quantities. Generic coating tables and preservation conditions cannot supply disc-manufacture ranges. Separate gate-to-gate results from upstream-completed results and disclose missing stages and data."
    source_ids:
      - cci-recording-media-care
      - us-epa-ap42-industrial-coating
      - ghg-protocol-product-standard-2011
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Production input for a matching unrecorded master blank in downstream recording or replication models"
  allowed_use: "Matching material, dimensions, surface specification, technology, geography and delivery boundary; convert to count only with documented blank mass"
  excluded_use: "Recorded content, recorded stampers, pressed records, optical or magnetic media, solid-state devices; unsupported cross-design service comparison; complete playback or consumer-life-cycle claims from site-only data"
  required_metadata: "All reference qualifiers; dataset owner and version; reporting period; supplier and background links; manufacturing route; process map; allocation; transport boundary; waste treatment; protocol identifiers"
  required_quality_disclosure: "Coverage by process and exchange; measurement and model uncertainty; composition quality; sampling; internal-transfer reconciliation; missing identities or datasets; excluded stages; comparability restrictions"
  update_trigger: "Change in substrate, formulation, geometry, acceptance specification, coating or drying technology, electricity supply, abatement, waste destination, packaging, supplier boundary or representativeness of the reporting period"
