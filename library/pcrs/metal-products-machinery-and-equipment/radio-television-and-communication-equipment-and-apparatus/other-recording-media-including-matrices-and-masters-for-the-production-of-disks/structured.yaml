      collection_method: "Meter deltas; documented physical allocation if shared"
      unit: "kg; m3; kWh"
      frequency: "Every shift or metered campaign"
      temporal_coverage: "Same period as production; include drying and ventilation outside active coating time"
      site_scope: "Coating, preparation and attributable auxiliary equipment"
      aggregation_rule: "Net meter delta allocated once; density-based water conversion and exact energy conversion; normalize by accepted output"
      quality_evidence: "Calibration; meter diagram; bills; driver reconciliation"
    - protocol_id: cp_solvent_balance
      process_id: "blank_coating"
      flow_role: "Acetone supply and air release"
      record_type: "Composition, test and balance records"
      raw_fields: "species; formulation_mass; solvent_fraction; added_solvent_mass; inventory_change; residual_in_product; waste_solvent_mass; recovered_export; destruction_mass; stack_mass; fugitive_mass"
      collection_method: "Supplier composition plus site assay, stock balance and representative stack/fugitive measurements; log control-system operation"
      unit: "kg/species"
      frequency: "Each formulation and campaign; after recipe or control change"
      temporal_coverage: "Same complete production period"
      site_scope: "Whole coating and cleaning solvent system including drying and local recovery"
      aggregation_rule: "Per-species input equals air release plus product retention, wastes, recovery export, destruction and inventory increase; internal recovered reuse cancels"
      quality_evidence: "Composition certificate; test method; sampling coverage; residual and recovery records; closure uncertainty"
    - protocol_id: cp_coating_wastes
      process_id: "blank_coating"
      flow_role: "Alkaline wash liquor and liquid lacquer waste"
      record_type: "Waste handover records"
      raw_fields: "stream_id; batch; wet_mass; water_fraction; solvent_fraction; pH; destination; carrier; transfer_date"
      collection_method: "Weigh separately at each transfer; sample stream composition; verify treatment receiver"
      unit: "kg; mass fraction; pH"
      frequency: "Each transfer and representative sampling campaign"
      temporal_coverage: "All transfers and stock changes in the production period"
      site_scope: "Coating site to named treatment handover"
      aggregation_rule: "Net exported wet mass per stream, with composition; no combination of spent lacquer and wash liquor"
      quality_evidence: "Weighbridge tickets; waste manifests; analytical results; treatment contract"
    - protocol_id: cp_dispatch
      process_id: "inspection_pack"
      flow_role: "Coated transfer, packaging, accepted and rejected blanks"
      record_type: "Lot inspection and dispatch records"
      raw_fields: "lot_id; incoming_blank_mass; accepted_count; unit_mass_samples; accepted_mass; reject_mass; stock_change; sleeve_mass; box_mass; surface_test; dimensions; cutting_test; unrecorded_check; storage_conditions"
      collection_method: "Calibrated weighing and count reconciliation; purchaser-specific inspection; packaging issue and return records"
      unit: "kg; count; mm; m2"
      frequency: "Every lot; sample unit mass and quality under a documented acceptance plan"
      temporal_coverage: "Same period as coating including rejects and opening/closing stock"
      site_scope: "Named inspection and packing site"
      aggregation_rule: "Reconcile transfer to accepted output, rejects and stock; net packaging consumption per accepted output; no averaging of incompatible designs"
      quality_evidence: "Test records; sampling plan; scale certificates; dispatch tickets; packaging specifications"
    - protocol_id: cp_pack_energy
      process_id: "inspection_pack"
