allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "Shared manufacturing"
    rule: "Separate lines and meters first. For residual shared consumption, use a demonstrated causal driver, such as occupied equipment time or coated area for identical recipes, and retain the numerator and denominator. Equal mass alone does not establish equivalence between blank designs."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_rejects
    applies_to: "Rejects and internal rework"
    rule: "Keep failed blanks, destructive acceptance samples and unrecovered coating losses within the lot burden. Internal rework is an internal transfer, not a saleable co-product or avoided virgin-material credit."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_coproduct
    applies_to: "Saleable recoveries"
    rule: "For a genuine co-product use a justified physical relationship; if no applicable physical relationship exists, document economic or another justified allocation. Record the recovery boundary and recipient; apply one consistent recycling method and disclose it."
    source_ids:
      - ghg-protocol-product-standard-2011
