measurement_rules:
  - id: net_reference_mass
    applies_to: "Accepted blanks and internal transfers"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh dry blanks after conditioning, excluding sleeves and boxes. Convert count with measured lot-specific mean blank mass; retain sample count, variability and scale calibration."
  - id: coating_basis
    applies_to: "Liquid lacquer and acetone"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record supplied formulation mass, dry solids and each solvent mass fraction separately. Do not equate liquid formulation mass with dry coating mass or count its ingredients again as purchased inputs. Convert volume only with supplier or measured density and temperature."
  - id: alkali_basis
    applies_to: "Sodium hydroxide"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report NaOH mass from measured solution mass and assay; record dilution water separately only if added on site. Preserve the supplied concentration when linking an upstream dataset."
  - id: electricity_conversion
    applies_to: "Electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve measured kWh and use the exact unit identity 1 kWh = 3.6 MJ; record grid, voltage and metering boundary. Do not use an energy unit conversion as an emission factor."
