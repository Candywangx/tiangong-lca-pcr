      raw_fields: "lot_id; supplier; substrate_alloy; received_mass; opening_stock; closing_stock; issued_mass; returned_mass; formulation_id; solids_fraction; NaOH_fraction; transfer_mass"
      collection_method: "Calibrated weighing, stock reconciliation, supplier specification and assay"
      unit: "kg; mass fraction"
      frequency: "Every lot and stock closure"
      temporal_coverage: "All lots in the declared continuous reporting period, including startup and rework"
      site_scope: "Named coating site and subcontractor handovers"
      aggregation_rule: "Sum net consumption and transfers separately, then divide by accepted dry output mass"
      quality_evidence: "Scale calibration; invoices; formulation and assay records; linked lot tickets"
