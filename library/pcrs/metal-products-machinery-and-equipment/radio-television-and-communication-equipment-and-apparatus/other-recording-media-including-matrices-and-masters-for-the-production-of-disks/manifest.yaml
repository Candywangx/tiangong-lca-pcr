    review: A fresh public state_code=100 comparison confirmed all six adopted flow identities, English and Chinese baseNames, classifications, reference properties, unit groups and general comments. The previously failed mass-property lookup subsequently succeeded; no flow replacement or methodology change was required. Original finalized search receipts remain the adoption evidence.
