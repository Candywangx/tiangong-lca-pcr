  unresolved:
    inventory_flow_uuids:
      - row_id: aluminium_substrate
        reason_code: property_or_unit_mismatch
        explanation: The directly read substrate candidate measures aluminium content rather than total mass and does not establish a bare aluminium disc substrate.
      - row_id: nitrocellulose_lacquer
        reason_code: no_exact_candidate
        explanation: Only acrylic varnish was returned; no exact formulated nitrocellulose lacquer candidate was established.
      - row_id: acetone_solvent
        reason_code: classification_mismatch
        explanation: The acetone-named product is classified as CPC 35499 rather than ketone 34170; the other candidates are dilute solution or different chemicals.
      - row_id: coated_blank_out
        reason_code: internal_intermediate_needs_new_flow
        explanation: A dedicated dry, unrecorded lacquer-coated aluminium blank awaiting inspection needs a flow distinct from the accepted reference state.
      - row_id: liquid_lacquer_waste
        reason_code: no_exact_candidate
        explanation: No candidate establishes solvent-bearing liquid nitrocellulose lacquer waste with the required state and composition.
      - row_id: coated_blank_in
        reason_code: internal_intermediate_needs_new_flow
        explanation: The receiving side of the same dry coated-blank internal transfer requires the same dedicated intermediate flow.
      - row_id: paper_sleeve
        reason_code: no_exact_candidate
        explanation: The only returned candidate is a paper label, not a protective recording-disc paper sleeve.
      - row_id: reference_blank
        reason_code: no_exact_candidate
        explanation: Two searches found coating/ink products, broad category or substrate identities, steel blanks or replication/recorded masters; none establishes the accepted unrecorded aluminium-backed nitrocellulose lacquer disc blank.
      - row_id: rejected_disc
        reason_code: no_exact_candidate
        explanation: Candidates are capacitor waste, paint waste with aluminium-content property, or unspecified recycled aluminium, not the rejected lacquer-coated composite disc.
