  semantic_boundary:
    review: 'CPC 3.0 original explanatory notes p. 260 verified: unrecorded masters/matrices and wax blanks are in scope, recorded masters and records are excluded. Identity-only review of adjacent PCR manifests found no material record for this boundary; semiconductor storage and smart-card records are distinct.'
    representative_route: Aluminum-backed nitrocellulose lacquer disc blank; other actual blank substrates and wax formulations require product-specific instantiated exchanges.
  professional_translation:
    review: 'Author translation checked against the official English scope and back-translated: recording media = 记录介质; matrices = 模版; masters = 母版; disks = 唱片 in the sound-recording context clarified by the explanatory notes. This is not labelled an official UNSD Chinese title. UUID-bearing rows use exact supplied or directly read TianGong Chinese baseNames.'
  uuid_reference_review:
