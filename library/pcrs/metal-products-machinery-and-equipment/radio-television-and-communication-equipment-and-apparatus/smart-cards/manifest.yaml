review_metadata:
  methodology_basis: "Authored from current identification-card, contact/contactless-interface, identity-credential, eSIM-scope, and debit-card LCA evidence; category-wide quantities remain foreground-record requirements rather than extrapolated defaults."
  unresolved_flow_identity:
    - "Card-body materials, contact and contactless chip/module variants, antenna or inlay materials, adhesives, inks, overlays, packaging, and route-specific production wastes deliberately retain semantic identities without generic Tiangong UUIDs until the declared product profile and exact database rows are selected."
    - "The verified contact smart-card IC module is CPC 47160 and is not adopted as a category-wide component identity for contactless-only or dual-interface cards."
  evidence_limitations:
    - "The debit-card LCA source supports only a narrow payment-card process and component decomposition. Its card mass, composition quantities, service life, and manufacturing or personalization reject fraction are not extrapolated to payment, identity, telecommunications, and IoT smart cards as a category."
    - "No category-wide default dimension, unit mass, bill of materials, energy intensity, or scrap-rate range is prescribed; each foreground data package must supply measured or calculated values for its declared card form and production route."
