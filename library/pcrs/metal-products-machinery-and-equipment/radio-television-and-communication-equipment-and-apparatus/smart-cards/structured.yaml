allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multi-product card manufacturing"
    rule: "Subdivide records by product profile, interface, material construction, line, lot, and process wherever separate measurements exist before allocating shared burdens."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared lamination, printing, personalization, testing, and utilities"
    rule: "Allocate shared measured burdens using a documented causal physical driver such as machine time, meter interval, processed sheet area, card count adjusted by measured unit mass, or batch time. Use economic allocation only when physical causality cannot be established and disclose the sensitivity."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework loops"
    rule: "Assign rework inputs and losses to the lot that generated the rework. Count successfully reworked cards once as accepted output and do not also count them as scrap."
    source_ids: []
  - rule_id: allocation_scrap_recycling
    applies_to: "scrap sent to recycling or recovery"
    rule: "Report scrap leaving the foreground as waste. Apply recycling, recovery, or substitution credits only in a separately declared downstream model with documented method and destination; no avoided-burden credit is applied by default."
    source_ids: []
  - rule_id: allocation_no_service_coproduct
    applies_to: "digital profiles and services"
    rule: "Do not allocate physical card-manufacturing burdens to eSIM profiles, subscriptions, transaction processing, or other services unless a separate service model defines the relationship and prevents double counting."
    source_ids:
      - gsma-sgp22-v3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_card_body_records
      process_id: "p_card_body"
      flow_role: "materials, energy, conforming output, trim and rejects"
      record_type: "purchase/issue/return logs; meters; production and waste tickets"
      raw_fields: "material_id; material_family; grade; recycled_or_biobased_content; issued_mass; returned_mass; energy_by_carrier; accepted_mass; accepted_count; trim_mass; reject_mass; destination"
      collection_method: "Reconcile stores records, calibrated meters, line counters, and waste tickets by lot"
      unit: "kg; card; kWh; MJ"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "representative reporting campaign, normally at least 12 months or all campaigns for seasonal/short production"
      site_scope: "all foreground card-body lines in scope"
      aggregation_rule: "sum net material and energy by lot; keep internal recycle separate; normalize to conforming output"
      quality_evidence: "calibration records; material specifications; supplier records; lot reconciliation; waste transfer evidence"
    - protocol_id: cp_antenna_inlay_records
      process_id: "p_antenna_inlay"
      flow_role: "conductor/substrate/connection inputs, energy, conforming inlay, rejects"
      record_type: "bill of materials; issue/return logs; meters; electrical-test and reject logs"
      raw_fields: "interface; antenna_route; conductor; substrate; connection_material; issued_mass; returned_mass; energy; processed_count; accepted_count; reject_count; reject_mass; test_result; destination"
      collection_method: "Reconcile material issues with inlay counts and mass; retain continuity/resonance or declared acceptance results"
      unit: "kg; item; kWh; MJ"
      frequency: "per lot"
      temporal_coverage: "representative reporting campaign"
      site_scope: "all contactless/dual-interface inlay lines in scope"
      aggregation_rule: "net issues and energy divided by conforming output; successful rework retained separately"
      quality_evidence: "material certificates; meter calibration; electrical-test records; waste tickets"
    - protocol_id: cp_module_embedding_records
      process_id: "p_module_embedding"
      flow_role: "chip/module/inlay inputs, attachment materials, energy, conforming output, rejects"
      record_type: "receiving, issue, placement/bonding, electrical-test, rework and reject records"
      raw_fields: "interface; module_id; chip_form; chip_count; module_count; sampled_unit_mass; issued_mass; attachment_material; energy; accepted_count; reject_count; reject_mass; recovered_count; destination"
      collection_method: "Reconcile secure-component serial/count records with material mass, line output, and defect disposition"
      unit: "kg; item; kWh; MJ"
      frequency: "per lot"
      temporal_coverage: "representative reporting campaign"
      site_scope: "all module-attachment lines in scope"
      aggregation_rule: "calculate mass from measured lot mass or statistically supported unit mass; normalize net inputs to conforming output"
      quality_evidence: "supplier specification; count reconciliation; sampling plan; test and destruction records"
    - protocol_id: cp_lamination_print_cut_records
      process_id: "p_lamination_print_cut"
      flow_role: "layered inputs, auxiliaries, energy, dimensions, conforming cards, trim and defects"
      record_type: "batch recipes; issue/return logs; meters; dimension/visual/electrical QC; waste tickets"
      raw_fields: "layer_construction; input_mass; overlay_ink_adhesive_mass; energy; sheet_count; card_count; length_mm; width_mm; thickness_mm; unit_mass; accepted_count; accepted_mass; trim_mass; defect_mass; rework_count; destination"
      collection_method: "Reconcile batch records with calibrated dimension and mass sampling, counters, and waste records"
      unit: "kg; card; mm; kWh; MJ"
      frequency: "per lot"
      temporal_coverage: "representative reporting campaign"
      site_scope: "all lamination/printing/cutting lines in scope"
      aggregation_rule: "sum accepted and rejected outputs; normalize net materials and energy to accepted unpersonalized mass"
      quality_evidence: "recipe approval; instrument calibration; QC sampling plan; waste transfer evidence"
    - protocol_id: cp_personalization_records
      process_id: "p_personalization"
      flow_role: "incoming cards, personalization materials/energy, accepted cards, rework and rejects"
      record_type: "secure inventory, job, encoding/key-injection, visual personalization, test, rework and destruction records"
      raw_fields: "application_class; incoming_state; target_state; interface; incoming_count; incoming_mass; material_issue; energy; accepted_count; accepted_mass; rework_count; reject_count; reject_mass; defect_reason; destruction_destination"
      collection_method: "Reconcile secure card custody with job completion and destruction evidence without storing secret credentials in the LCA dataset"
      unit: "kg; card; kWh; MJ"
      frequency: "per personalization job/lot"
      temporal_coverage: "representative reporting campaign"
      site_scope: "all personalization facilities in scope"
      aggregation_rule: "incoming = accepted + open rework + rejected, adjusted only for documented transfers; normalize to accepted mass"
      quality_evidence: "custody reconciliation; equipment logs; acceptance tests; secure destruction certificate"
    - protocol_id: cp_final_release_records
      process_id: "p_final_test_packaging"
      flow_role: "final-test input, accepted reference output, packaging, rework, reject and waste"
      record_type: "final QC; calibrated lot weights; card counts; packaging issues; rework and waste records"
      raw_fields: "interface; material_system; module; antenna; dimensions; personalization_state; input_count; accepted_count; accepted_mass; sampled_unit_mass; sample_size; packaging_mass; energy; rework_count; reject_count; reject_mass; destination"
      collection_method: "Weigh released lots net of packaging or use an approved representative unit-mass sampling plan; reconcile all dispositions"
      unit: "kg; card; mm; kWh; MJ"
      frequency: "per released lot"
      temporal_coverage: "representative reporting campaign"
      site_scope: "all final release and packaging lines in scope"
      aggregation_rule: "accepted reference mass plus separately reported packaging; reconcile input and all output dispositions"
      quality_evidence: "scale calibration; sampling plan; release certificate; packaging specification; waste/destruction evidence"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "accepted reference smart cards"
      rule: "Prefer net calibrated accepted-lot mass. If count conversion is used: accepted_mass_kg = accepted_count x representative_unit_mass_g / 1000; report sampling design and uncertainty."
      inputs:
        - accepted_count
        - accepted_lot_mass
        - representative_unit_mass_g
        - sample_size
      output: "accepted reference mass in kg"
      source_ids: []
    - id: calc_net_material_input
      applies_to: "each material or component"
      rule: "net_input_kg = issued_mass_kg - documented_unused_return_kg - documented_internal_recycle_return_kg; internal recycle is tracked but not counted as new external input."
      inputs:
        - issued_mass
        - unused_return_mass
        - internal_recycle_return_mass
      output: "net external material input in kg"
      source_ids: []
    - id: calc_scrap_rate_mass
      applies_to: "each process and total foreground"
      rule: "scrap_rate_mass_percent = 100 x final_scrap_mass / (accepted_output_mass + final_scrap_mass); exclude open rework and report any recovered component mass separately."
      inputs:
        - accepted_output_mass
        - final_scrap_mass
        - open_rework_mass
        - recovered_component_mass
      output: "process-specific and total mass scrap rate"
      source_ids: []
    - id: calc_rework_rate_count
      applies_to: "each process"
      rule: "rework_rate_count_percent = 100 x cards_entering_rework / processed_card_count; report the fraction later accepted and the fraction later scrapped."
      inputs:
        - processed_card_count
        - rework_entry_count
        - rework_accepted_count
        - rework_scrapped_count
      output: "rework rate and disposition shares"
      source_ids: []
    - id: calc_normalized_inventory
      applies_to: "all foreground rows"
      rule: "normalized_amount = reconciled lot amount / accepted reference mass_kg, after applying documented allocation for shared operations."
      inputs:
        - "reconciled lot amount"
        - "accepted reference mass"
        - "allocation driver"
      output: "amount per 1 kg accepted smart cards"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "each process"
      rule: "Compare net mass inputs with conforming output, scrap/reject output, recovered components, emissions if measured, and inventory change. Investigate and disclose unexplained imbalance; do not force balance by inventing flows."
      inputs:
        - "net mass inputs"
        - "conforming outputs"
        - wastes
        - recoveries
        - "measured releases"
        - "opening/closing inventory"
      output: "mass-reconciliation result and unexplained difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_profile
      applies_to: "reference product"
      requirement: "Preserve interface, application class, card-body material/layers, chip/module, antenna/inlay where applicable, single/multi-chip design, dimensions, mass, personalization state, and packaging inclusion."
      evidence: "approved product specification and bill of materials"
    - id: dq_identity
      applies_to: "UUID-bearing references"
      requirement: "Confirm the current public Tiangong identity and reference property before use; do not use a component, unpersonalized-card, wrong-CPC, or wrong-state row as the generic reference product."
      evidence: "Tiangong public-row readback and product-profile match"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use one representative reporting campaign, normally at least 12 months, or all campaigns for short/seasonal products; disclose deviations and major process changes."
      evidence: "dated production, meter, purchasing, and waste records"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile accepted, rejected, scrapped, reworked, recovered, and transferred counts/masses at every process; include all material and energy carriers that cross the declared boundary."
      evidence: "lot reconciliation and mass-balance report"
    - id: dq_measurement
      applies_to: "mass, dimensions, counts, and energy"
      requirement: "Retain calibration status, sampling plan, sample size, conversion factors, and uncertainty for count-to-mass and dimension measurements."
      evidence: "calibration certificates, sampling records, and meter logs"
    - id: dq_security_and_privacy
      applies_to: "personalization records"
      requirement: "Retain auditable counts, mass, process status, and destruction evidence without publishing secret keys, personal data, credentials, or cardholder information in the LCA dataset."
      evidence: "redacted custody and destruction records; data-governance approval"
    - id: dq_no_extrapolation
      applies_to: "secondary evidence"
      requirement: "Treat payment-card, identity-card, SIM, and IoT-card evidence as profile-specific. Any transfer to another profile requires a documented representativeness argument and sensitivity assessment."
      evidence: "evidence-to-field mapping and substitution log"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference product flow must be Smart cards da4b294a-b663-486c-8e61-05dc1a40ad40, state-code-100 identity verified at authoring, with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: validate_interface
    applies_to: "product profile and process applicability"
    rule: "Declare exactly one interface profile: contact, contactless, or dual-interface. Contactless and dual-interface profiles must disclose antenna/inlay material and integration; contact and dual-interface profiles must disclose contact module/pad construction."
    source_ids:
      - iso-iec-14443-1-2018
      - emvco-contact-chip
      - nist-fips-201-3-front-end
  - rule_id: validate_card_body
    applies_to: "card-body construction"
    rule: "Declare material family, layer construction, recycled or biobased content where applicable, and upstream dataset for every material layer."
    source_ids:
      - iso-iec-7810-2019
  - rule_id: validate_dimensions_mass
    applies_to: "physical product"
    rule: "Report length, width, thickness, specification/drawing, measured unit mass, sampling basis, accepted count, and accepted mass. Reject datasets that assume a single card form for the entire category."
    source_ids:
      - iso-iec-7810-2019
  - rule_id: validate_chip_module
    applies_to: "electronic component boundary"
    rule: "Declare chip/module form, interface compatibility, single/multi-chip implementation, supplier or component identity, unit count/mass basis, and whether chip/module manufacture is upstream or foreground. Bare-chip or contact-module evidence must not represent the whole category."
    source_ids:
      - emvco-contact-chip
      - nist-fips-201-3-front-end
      - lindgreen-debit-card-lca-2017
  - rule_id: validate_personalization_boundary
    applies_to: "product state and foreground boundary"
    rule: "Declare unpersonalized, pre-personalized, or fully personalized output and list logical loading, encoding, key injection, visual printing/engraving, testing, and secure destruction operations included or excluded."
    source_ids:
      - nist-fips-201-3-front-end
      - gsma-sgp22-v3-1
  - rule_id: validate_scrap_rework
    applies_to: "yield and waste inventory"
    rule: "Report process-specific accepted, rejected, scrapped, and reworked counts and masses, denominator definitions, final destinations, and prevention of double counting. A debit-card reject observation is not a category default."
    source_ids:
      - lindgreen-debit-card-lca-2017
  - rule_id: validate_mass_reconciliation
    applies_to: "each foreground process"
    rule: "Provide a reconciled mass balance or a documented investigation of unexplained differences without invented flows."
    source_ids: []
  - rule_id: validate_service_exclusion
    applies_to: "eSIM and other services"
    rule: "Exclude eSIM profile download, subscription management, remote provisioning, transaction processing, and other services from the physical smart-card product dataset unless separately modelled and linked without double counting."
    source_ids:
      - gsma-sgp22-v3-1
  - rule_id: validate_no_narrow_extrapolation
    applies_to: "evidence representativeness"
    rule: "Do not extrapolate a contact-only module, unpersonalized-card route, debit-card composition, identity-card construction, removable SIM, or one form factor to all smart cards without explicit profile matching and evidence."
    source_ids:
      - lindgreen-debit-card-lca-2017
      - nist-fips-201-3-front-end
      - gsma-sgp22-v3-1
published_dataset_profile:
  dataset_role: "Foreground smart-card manufacturing data package suitable for publication as a secondary_dataset or background_dataset after review"
  downstream_use: "Product LCAs and lifecycle models requiring a physical smart-card manufacturing inventory for a declared contact, contactless, or dual-interface profile"
  allowed_use: "Use for the declared card material system, interface, chip/module and antenna configuration, dimensions, personalization state, geography, technology, and reporting period; documented scenario substitution is allowed with sensitivity analysis"
  excluded_use: "Generic representation of bare chips/modules, card readers, eUICC hardware outside a physical card, eSIM/telecommunications/payment/identity services, transaction processing, or all smart cards without profile matching"
  required_metadata: "canonical PCR id; CPC mapping context; application class; interface; card-body material/layers; chip/module; antenna/inlay when applicable; dimensions/thickness; measured unit mass; personalization state/boundary; process route; geography; period; allocation; accepted/reject/scrap/rework data; packaging inclusion; UUID verification"
  required_quality_disclosure: "source coverage; meter and scale calibration; count-to-mass sampling; mass reconciliation; temporal and site coverage; substitutions; missing flows; waste destinations; security/privacy redaction; reason narrow-profile evidence was or was not transferred"
  update_trigger: "Change in card form, material/layer construction, recycled/biobased content, interface, chip/module, antenna/inlay, lamination or personalization technology, dimensions/mass, plant/geography, allocation, scrap/rework treatment, packaging, or evidence/UUID identity"
