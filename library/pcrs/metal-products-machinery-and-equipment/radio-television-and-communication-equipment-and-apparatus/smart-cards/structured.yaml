measurement_rules:
  - id: reference_mass
    applies_to: "accepted reference-product output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground inventories to 1 kg of accepted smart cards. Derive mass from calibrated lot weighing or accepted-card count multiplied by a statistically representative measured unit mass."
  - id: card_dimensions
    applies_to: "physical reference-product specification"
    required_property_ref:
      name: "Dimension"
      uuid: ""
    required_unit: "mm"
    rule: "Report length, width, and thickness for the declared card form and the applicable specification or drawing. Do not assume ID-1 dimensions for SIM plug-ins, tokens, or other form factors."
  - id: unit_mass_and_count
    applies_to: "production and quality records"
    required_property_ref:
      name: "Mass and count"
      uuid: ""
    required_unit: "kg and card"
    rule: "Record accepted, rejected, scrapped, and reworked card counts together with measured or sampled unit mass so count-to-mass conversion is reproducible."
  - id: component_mass
    applies_to: "card-body, chip/module, antenna/inlay, overlay, adhesive, ink, and other material inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report issued, returned, and incorporated mass by component or material family; do not infer all smart-card compositions from a debit card or a contact-only card."
  - id: scrap_rate
    applies_to: "each foreground manufacturing process"
    required_property_ref:
      name: "Mass and count"
      uuid: ""
    required_unit: "kg and %"
    rule: "Calculate scrap and reject rates from process-specific accepted, rejected, scrapped, and reworked records. State denominator and whether rework is ultimately accepted or scrapped."
process_map:
  - id: p_card_body
    name: "Card-body material preparation and sheet or blank formation"
    inclusion: "required"
    inclusion_condition: "Required for every physical card; purchased finished card bodies may enter as an upstream product and shorten this foreground process"
    role: "Prepare the declared card-body material and layer system"
    quantitative_reference: "kg prepared card-body material or blanks"
  - id: p_antenna_inlay
    name: "Contactless antenna or inlay manufacture and integration"
    inclusion: "conditional"
    inclusion_condition: "Include for contactless and dual-interface profiles when not fully represented by a purchased inlay dataset"
    role: "Form and connect the declared antenna/inlay system"
    quantitative_reference: "kg conforming inlay or antenna-equipped body"
  - id: p_module_embedding
    name: "Chip or module attachment and electrical interconnection"
    inclusion: "required"
    inclusion_condition: "Include the route matching contact, contactless, or dual-interface construction; purchased finished inlays/modules remain upstream inputs"
    role: "Attach the secure IC/module and make contact-pad or antenna connections"
    quantitative_reference: "kg module-equipped card construction"
  - id: p_lamination_print_cut
    name: "Layer assembly, lamination, printing, finishing, and cutting"
    inclusion: "required"
    inclusion_condition: "Split or combine unit operations only when foreground records preserve their burdens and yields"
    role: "Convert layered constructions into dimensionally conforming unpersonalized cards"
    quantitative_reference: "kg conforming unpersonalized cards"
  - id: p_personalization
    name: "Logical and visual personalization"
    inclusion: "conditional"
    inclusion_condition: "Include only when the reference product is pre-personalized or fully personalized and the operations occur inside the plant boundary"
    role: "Load or encode data and apply product-specific visual features"
    quantitative_reference: "kg accepted personalized cards"
  - id: p_final_test_packaging
    name: "Final electrical/visual test, quality release, and packaging"
    inclusion: "required"
    inclusion_condition: "Packaging may be outside the reference mass but must be separately inventoried when supplied with the product"
    role: "Release accepted reference cards and segregate rejects, rework, and packaging"
    quantitative_reference: "kg accepted reference cards"
