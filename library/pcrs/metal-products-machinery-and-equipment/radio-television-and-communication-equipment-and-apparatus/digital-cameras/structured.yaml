allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_site_activity"
    rule: "Prefer model-specific metering or process subdivision. If unavoidable, use a demonstrated physical relationship; justify an alternative relationship when physical allocation cannot be established."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_camera_time
    applies_to: "assembly_and_test_electricity"
    rule: "For a shared test station, collect model-specific powered test time and load. Allocate its measured total by those demonstrated demands, not by camera mass or pixel count alone. Reconcile allocated totals to the meter."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "acceptance_and_rejects"
    rule: "Charge failed attempts and rework to the production cohort that caused them; only accepted output enters the normalization denominator. Record recovered parts and internal reuse explicitly, without duplicate purchases."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "outgoing_scrap"
    rule: "Document waste/co-product status and treatment responsibility. Disclose the recycling allocation method and report any displacement claim separately; no automatic virgin-material credit is assigned by this PCR."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "The test-time and cohort conventions are foreground protocols of this PCR, not manufacturer benchmark factors."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "assembly"
      flow_role: "Individual purchased components"
      record_type: "BOM and stock ledger"
      raw_fields: "model; revision; part_id; item_mass; issues; returns; opening_stock; closing_stock; supplier; integrated_subparts"
      collection_method: "Weigh representative parts; reconcile released BOM with stores and supplier declarations"
      unit: "kg and item count"
      frequency: "Each lot and BOM revision"
      temporal_coverage: "Entire declared production period including failed lots"
      site_scope: "Assembly line and supplying stores"
      aggregation_rule: "Determine consumed mass for each part separately and divide by accepted assembly net mass"
      quality_evidence: "Scale calibration; invoice; signed BOM; stock reconciliation"
    - protocol_id: cp_assembly_energy
      process_id: "assembly"
      flow_role: "Electricity"
      record_type: "Meter and equipment log"
      raw_fields: "meter_id; opening_MJ; closing_MJ; model; powered_test_time; measured_load; idle_time; allocation_driver"
      collection_method: "Submeter assembly, firmware loading, optical testing and attributable room services; reconcile shared supply"
      unit: "MJ; kWh; h"
      frequency: "Each shift and model change"
      temporal_coverage: "Same period as accepted-output records"
      site_scope: "Assembly and test equipment plus declared shared services"
      aggregation_rule: "Allocate measured interval energy once, then divide by accepted assembly net mass"
      quality_evidence: "Meter calibration; station logs; reconciliation to utility meter"
    - protocol_id: cp_camera_transfer
      process_id: "assembly"
      flow_role: "Accepted camera and internal transfer"
      record_type: "Acceptance and stock record"
      raw_fields: "serial_or_lot; model; net_configuration; accepted_count; accepted_mass; transfer_mass; stock_change; rework_status"
      collection_method: "Weigh accepted configuration and pair transfer records with packing receipt"
      unit: "kg and camera count"
      frequency: "Each lot transfer"
      temporal_coverage: "Same reporting period with opening/closing work in progress"
      site_scope: "Assembly exit and packing receipt"
      aggregation_rule: "Match paired net mass and batch; calculate transfer per destination output without double counting"
      quality_evidence: "Acceptance tests; scale evidence; two-sided transfer ledger"
    - protocol_id: cp_assembly_waste
      process_id: "assembly"
      flow_role: "Discarded digital camera"
      record_type: "Waste transfer record"
      raw_fields: "lot; failure_reason; net_mass; battery_present; removed_parts; destination; treatment"
      collection_method: "Weigh discarded cameras after recording separately removed components; retain contractor ticket"
      unit: "kg"
      frequency: "Each disposal shipment"
      temporal_coverage: "Same cohort as assembly consumption"
      site_scope: "Reject area to off-site recipient"
      aggregation_rule: "Sum actual discarded camera mass separately from rework and normalize by accepted assembly mass"
      quality_evidence: "Waste ticket; dismantling ledger; recipient treatment evidence"
    - protocol_id: cp_packing_items
      process_id: "packing"
      flow_role: "Each supplied accessory or package article"
      record_type: "Packing BOM and stock ledger"
      raw_fields: "model; sales_region; item_id; issued_count; returned_count; item_mass; opening_stock; closing_stock"
      collection_method: "Weigh each item; check regional package contents and issued stock"
      unit: "kg and item count"
      frequency: "Each packing lot and configuration change"
      temporal_coverage: "Same period as camera release"
      site_scope: "Packing line and stores"
      aggregation_rule: "Consume and normalize each item separately by released net camera mass"
      quality_evidence: "Scale check; packing BOM; regional content declaration"
    - protocol_id: cp_packing_energy
      process_id: "packing"
      flow_role: "Electricity"
      record_type: "Meter log"
      raw_fields: "meter_id; interval_energy; model; line_time; allocation_driver"
      collection_method: "Measure packing/sealing line energy and reconcile its share of common supply"
      unit: "MJ; kWh"
      frequency: "Each shift"
      temporal_coverage: "Same reporting period"
      site_scope: "Packing equipment"
      aggregation_rule: "Normalize measured allocated energy by released net camera mass"
      quality_evidence: "Meter check; shift log; no overlap with assembly meter"
    - protocol_id: cp_release
      process_id: "packing"
      flow_role: "Finished camera"
      record_type: "Release ledger"
      raw_fields: "model; accepted_count; net_mass; accessory_mass; packaging_mass; shipped_gross_mass; opening_stock; closing_stock"
      collection_method: "Weigh net configuration and packaged units separately; reconcile release count"
      unit: "kg and camera count"
      frequency: "Each released lot"
      temporal_coverage: "Entire reporting period"
      site_scope: "Factory gate"
      aggregation_rule: "Sum released net camera mass; retain count-to-mass and gross-mass reconciliation"
      quality_evidence: "Release authorization; scale calibration; shipment record"
    - protocol_id: cp_packing_waste
      process_id: "packing"
      flow_role: "Corrugated-board waste"
      record_type: "Waste ledger"
      raw_fields: "dry_mass; moisture_state; carton_grade; source_lot; contamination; destination"
      collection_method: "Weigh segregated cardboard and retain collection ticket"
      unit: "kg"
      frequency: "Each waste pickup"
      temporal_coverage: "Same period as packing records"
      site_scope: "Packing area to recipient"
      aggregation_rule: "Normalize discarded corrugated board by released net camera mass"
      quality_evidence: "Weighbridge or scale record; waste ticket"
  calculation_rules:
    - id: calc_consumption
      applies_to: "each component and package article"
      rule: "C_i = opening stock + receipts - closing stock - documented unused returns - transfers outside the cohort; reconcile to issues minus returns without counting receipts twice"
      inputs:
        - "Item-specific stock and issue records from cp_components or cp_packing_items"
      output: "Consumed mass C_i in kg"
      source_ids: []
    - id: calc_normalize
      applies_to: "each process exchange"
      rule: "q_i = C_i / M_good for the same model, process and period; use measured energy or waste mass in place of C_i where applicable; M_good must be positive"
      inputs:
        - "Relevant collection protocol and cp_camera_transfer or cp_release"
      output: "kg/kg or MJ/kg process output"
      source_ids: []
    - id: calc_transfer
      applies_to: "assembly to packing link"
      rule: "Packing demand for accepted camera = matched incoming net mass / released net mass. Scale assembly by that demand and cancel the linked intermediate exchange at aggregation"
      inputs:
        - cp_camera_transfer
        - cp_release
        - "work-in-progress and reject records"
      output: "Internally consistent linked manufacturing model"
      source_ids: []
    - id: calc_count
      applies_to: "downstream unit conversion"
      rule: "Inventory per camera = inventory per kg multiplied by measured net kg per camera of the same configuration"
      inputs:
        - cp_release
        - "normalized inventory"
      output: "Per-camera dataset with declared mass basis"
      source_ids: []
    - id: calc_yield
      applies_to: "assembly acceptance"
      rule: "Acceptance yield = accepted camera count / started camera count for a closed cohort; retain work-in-progress and rework records to explain the denominator"
      inputs:
        - cp_camera_transfer
        - "production-start log"
      output: "Observed cohort yield, without an assumed category value"
      source_ids: []
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "Product and parts"
      requirement: "Freeze the BOM, firmware, camera/lens/battery configuration and sales-region package contents. Identify whether sensor and display are already included in a purchased board or module."
      evidence: "Signed BOM, part drawings and package records; nikon-z8-reference-guide illustrates state distinctions"
    - id: dq_completeness
      applies_to: "All processes"
      requirement: "Reconcile every BOM line, stock movement, meter and outgoing waste. Add separately identified atomic rows for unlisted real exchanges. Missing data must be marked as gaps, never silent zeroes."
      evidence: "Completeness register and process walk-through"
    - id: dq_period
      applies_to: "Normalization"
      requirement: "Use matched output and consumption periods. Explain stock changes, prototypes, shutdowns, rejects and outsourced processing. Do not divide annual energy by an unrelated month's output."
      evidence: "Dated collection records and cohort ledger"
    - id: dq_measurement
      applies_to: "Weighing and metering"
      requirement: "Retain instrument identity, calibration, uncertainty and sampling coverage; distinguish measured, supplier-reported and calculated values."
      evidence: "Calibration certificates, sampling plan and supplier declarations"
    - id: dq_upstream
      applies_to: "Linked data"
      requirement: "Check product state, geography, technology, time and allocation compatibility for each upstream dataset. Missing UUID identity and missing upstream impact data are different gaps."
      evidence: "Supplier dataset register and boundary reconciliation"
    - id: dq_ranges
      applies_to: "Empirical comparisons"
      requirement: "Collect model-specific material use, energy, acceptance yield, packaging and waste observations. No external empirical range is supplied here; do not substitute catalogue specifications or one published case."
      evidence: "Foreground records; any later external interval requires two independent original-text-verified compatible sources"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Verify dedicated digital still-camera identity and all required qualifiers; reject substitution by camcorder, film camera or component data."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_mass
    applies_to: "quantitative_reference"
    rule: "Require positive accepted net mass and paired camera count; keep kit, battery, accessory and packaging mass boundaries explicit. Check conversion using the same configuration."
    source_ids: []
  - rule_id: validate_modules
    applies_to: "component_inventory"
    rule: "Ensure each selected row is one exchange; remove duplicate sensor, board, lens or battery burdens when a purchased module already includes them."
    source_ids: []
  - rule_id: validate_transfers
    applies_to: "linked_processes"
    rule: "Match camera transfer identifiers, property, unit and net configuration; reconcile stock and losses, then cancel the intermediate only on aggregation."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "electricity"
    rule: "Check meter boundary, kWh-to-MJ conversion, allocation closure and coverage of tests/rework/room services. Never calculate factory energy from battery capacity alone."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "row_values"
    rule: "Require traceable source records and collection protocols for each amount. Check missing versus absent exchanges and do not replace missing identities with proxy UUIDs."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "published_claims"
    rule: "Distinguish manufacturing inventory from a complete lifetime footprint; disclose gaps, upstream coverage, exclusions and allocation choices."
    source_ids:
      - ghg-protocol-product-standard-2011
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing module for a specified digital still-camera model/configuration; input to process and lifecyclemodel projections after upstream linking"
  allowed_use: "Supplier and assembly modelling with disclosed state/technology/geography; measured conversion between kg and camera count; separately declared life-cycle scenario construction"
  excluded_use: "Unqualified comparisons of photographic service; full life-cycle or GHG Protocol conformity claims from this partial module alone; substitution for film cameras or video camera recorders; treating missing upstream data as zero"
  required_metadata: "Reference qualifiers; net unit mass and count; included kit/packaging list; reporting period and site; BOM/firmware revision; process and supplier boundaries; allocation; upstream dataset links"
  required_quality_disclosure: "Primary-record coverage; meter allocation; sampling and uncertainty; stock reconciliation; failed and reworked output; UUID gaps; external-range gaps; unlinked upstream burdens and exclusions"
  update_trigger: "BOM, sensor, battery, lens, packaging or supplied-accessory change; process or supplier relocation; meter/allocation change; new reporting period; new independently verified evidence"
