measurement_rules:
  - id: net_mass
    applies_to: "reference and intermediate camera"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the declared net configuration by model. Record camera count N and accepted net mass M; m_unit = M/N. Never substitute gross shipping mass or a different model's catalogue mass."
  - id: count_conversion
    applies_to: "BOM and supplied accessories"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert counted items using measured item masses and reconcile them with issue/return records. A piece is not a kg. Include battery casings, protection electronics and module substrates in the corresponding purchased module."
  - id: energy_conversion
    applies_to: "factory electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the meter's electrical-energy basis; multiply kWh by 3.6 for MJ. Battery rated capacity is a specification, not measured factory charging energy."
  - id: internal_transfer
    applies_to: "assembly to packing"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use the same net configuration on both internal transfer rows. Match batch identifiers and reconcile stock changes before connecting processes."
  - id: shipping_balance
    applies_to: "packed output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconstruct shipped physical mass as net camera mass plus separately recorded accessories and packaging. Do not treat the difference from net reference mass as unexplained loss."
