    range_evidence_needs:
      - range_id: component_consumption
        row_ids:
          - cmos_sensor
          - camera_pcb
          - camera_housing
          - camera_lens
          - camera_lcd
          - camera_battery
          - steel_screws
        explanation: Collect model-specific BOM consumption and losses. No two independent original-text sources establish compatible component masses per kg of the same supplied camera configuration, supplier boundary, geography and technology.
      - range_id: electricity_intensity
        row_ids:
          - assembly_electricity
          - packing_electricity
        explanation: Collect metered MJ per kg with common-service allocation and test/rework coverage. Manufacturer ratings and charging specifications do not establish two independent boundary-compatible manufacturing intensity observations.
      - range_id: acceptance_and_transfer
        row_ids:
          - unpacked_camera
          - camera_to_pack
          - finished_camera
        explanation: Collect closed-cohort acceptance yield and transfer losses. Reference normalization is exact by definition; it is not an empirical yield range. No two independent compatible production-yield studies verified.
      - range_id: accessory_and_packaging_consumption
        row_ids:
          - corrugated_box
          - pulp_insert
          - ldpe_bag
          - usb_cable
          - battery_charger
          - camera_strap
        explanation: Collect actual regional package contents, item masses and packaging losses. The two sections of one Nikon manual are one publication and cannot constitute independent range evidence; polymer, carton grade and packing technology must be compatible.
      - range_id: waste_generation
        row_ids:
          - discarded_camera
          - corrugated_waste
        explanation: Collect weighed segregated waste per kg accepted output with moisture, removed battery and treatment boundaries. No two independent original-text compatible manufacturing waste observations verified.
