            specificity: "scenario_specific"
            basis:
              text: "per kg equipment entering treatment"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_eol_routes
              source_ids:
                - eu-weee-directive-2012-19-eu
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared manufacturing and support processes"
    rule: "Avoid allocation by submetering or subdividing lines, test stations, part processes and support activities for the declared product/configuration wherever practicable."
    source_ids:
      - etsi-es-203-199-v1-4-1
  - rule_id: allocation_physical
    applies_to: "unavoidable shared facility burdens"
    rule: "Allocate shared burdens by a causal physical driver such as machine-hours, test time, PCB area, good-die area, accepted mass, floor-time or another documented driver. Use one method consistently for all environmental loads from the common process."
    source_ids:
      - etsi-es-203-199-v1-4-1
  - rule_id: allocation_economic_fallback
    applies_to: "shared burdens lacking a defensible physical relationship"
    rule: "Economic allocation may be used only when physical allocation is not feasible; disclose values, period, affected burdens and sensitivity to the alternative."
    source_ids:
      - etsi-es-203-199-v1-4-1
  - rule_id: allocation_recycling
    applies_to: "reuse, refurbishment and recovered material"
    rule: "State the recycling/reuse allocation convention and life-cycle boundary explicitly. Do not count both an avoided-primary-material credit and the same recovered output without a consistent method."
    source_ids:
      - etsi-es-203-199-v1-4-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "in_house_part_production_equipment_assembly_and_test"
      flow_role: "materials, components and modules"
      record_type: "controlled BOM, receiving record and supplier specification"
      raw_fields: "part_id; revision; supplier; quantity_per_unit; unit_mass; material; included_accessory; accepted_quantity; scrap"
      collection_method: "reconcile released BOM to goods receipts, production issues and measured sample masses"
      unit: "kg and item"
      frequency: "each BOM revision and campaign"
      temporal_coverage: "complete reporting period"
      site_scope: "all included models and sites"
      aggregation_rule: "sum accepted mass by configuration; retain separate component identities"
      quality_evidence: "approved BOM; scale record; supplier declaration; reconciliation log"
    - protocol_id: cp_part_process_records
      process_id: "in_house_part_production"
      flow_role: "in-house parts, utilities and outputs"
      record_type: "meter, batch ticket and production log"
      raw_fields: "technology; batch; input_quantity; utility; meter_start; meter_end; accepted_output; rejects; downtime"
      collection_method: "collect by part technology and batch; allocate only shared meters with a documented driver"
      unit: "flow-specific"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative period covering seasonal/route variation"
      site_scope: "every in-scope part facility"
      aggregation_rule: "normalize to accepted part output, preserving technology route"
      quality_evidence: "meter calibration; batch record; yield reconciliation"
    - protocol_id: cp_waste_and_release_records
      process_id: "in_house_part_production"
      flow_role: "scrap and direct releases"
      record_type: "waste manifest, monitor and permit report"
      raw_fields: "stream; quantity; destination; pollutant; concentration; volume; factor_source"
      collection_method: "weigh waste and use monitored releases; calculated releases require cited factors and activity data"
      unit: "flow-specific"
      frequency: "each shipment or monitoring interval"
      temporal_coverage: "same period as production"
      site_scope: "all included sites and outlets"
      aggregation_rule: "sum by flow and route; no netting of recovered value"
      quality_evidence: "manifests; laboratory/monitor QA; permits; factor reference"
    - protocol_id: cp_assembly_records
      process_id: "equipment_assembly_and_test"
      flow_role: "assembly consumables and energy"
      record_type: "submeter, stores issue and line log"
      raw_fields: "line; model; configuration; units; net_mass; kWh; consumable_issue; consumable_return; test_time"
      collection_method: "submeter preferred; otherwise allocate by causal machine/test time"
      unit: "kWh and flow-specific"
      frequency: "shift or batch"
      temporal_coverage: "representative reporting period"
      site_scope: "every included assembly/test site"
      aggregation_rule: "aggregate by configuration then production-weight to the declared mix"
      quality_evidence: "calibrated meter; ERP issue/return; line record"
    - protocol_id: cp_production_output_and_tests
      process_id: "equipment_assembly_and_test_packaging_and_factory_gate"
      flow_role: "accepted product and rejects"
      record_type: "production count, mass and release-test record"
      raw_fields: "serial_or_lot; configuration; produced; passed; reworked; rejected; net_mass; test_result"
      collection_method: "reconcile accepted output, rework and final rejects to production input"
      unit: "kg and item"
      frequency: "each lot"
      temporal_coverage: "complete reporting period"
      site_scope: "all included lines"
      aggregation_rule: "count a unit once when finally accepted; retain rejects by disposition"
      quality_evidence: "release-test report; calibrated scale; reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packaging_and_factory_gate"
      flow_role: "packaging and packaging waste"
      record_type: "packaging BOM, issue and waste record"
      raw_fields: "material; pack_level; mass_per_pack; units_per_pack; issue; return; waste; pallet_share"
      collection_method: "weigh representative packs and reconcile issued material to shipped packs and waste"
      unit: "kg"
      frequency: "each packaging revision with period reconciliation"
      temporal_coverage: "reporting period"
      site_scope: "all included packing sites"
      aggregation_rule: "normalize packaging separately per kg net equipment"
      quality_evidence: "packaging specification; scale record; waste manifest"
    - protocol_id: cp_use_power_profile
      process_id: "use_and_maintenance"
      flow_role: "operating electricity"
      record_type: "calibrated power test or field telemetry"
      raw_fields: "configuration; firmware; supply; ports; modules; radio_or_traffic_profile; state; input_power; duration; downstream_power; ambient; test_method"
      collection_method: "measure at equipment input across representative states/load bins; for eligible LNE use the documented ENERGY STAR configuration/test method or justify an equivalent"
      unit: "W, h, kWh"
      frequency: "test per configuration; field bins continuously or representative sampling"
      temporal_coverage: "declared operating year/lifetime"
      site_scope: "declared market and deployment"
      aggregation_rule: "sum state power multiplied by time; keep downstream delivered power treatment explicit"
      quality_evidence: "calibration certificate; test setup; telemetry completeness; configuration record"
    - protocol_id: cp_maintenance_records
      process_id: "use_and_maintenance"
      flow_role: "replacement parts and removed waste"
      record_type: "service and spare-parts log"
      raw_fields: "date; configuration; part; installed_quantity; removed_quantity; disposition; travel"
      collection_method: "reconcile service tickets to spare-parts issues and returns"
      unit: "kg and item"
      frequency: "each intervention"
      temporal_coverage: "declared operating period"
      site_scope: "declared deployment population"
      aggregation_rule: "aggregate per configuration and operating period"
      quality_evidence: "service ticket; inventory record; disposition proof"
    - protocol_id: cp_eol_routes
      process_id: "end_of_life_treatment"
      flow_role: "de-installed equipment and treatment outputs"
      record_type: "de-installation, transport and recycler record"
      raw_fields: "mass; route; distance; reuse_test; removed_components; recovered_material; residue; destination"
      collection_method: "follow measured consignments or a declared, region-specific scenario; keep reuse/refurbishment and waste routes separate"
      unit: "kg and tkm"
      frequency: "each consignment or representative audited campaign"
      temporal_coverage: "scenario year"
      site_scope: "declared end market"
      aggregation_rule: "mass-balance each route from received equipment to outputs/residues"
      quality_evidence: "weighbridge; transport record; functionality test; recycler certificate"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all manufacturing rows"
      rule: "normalized amount = period amount / accepted net finished-equipment mass"
      inputs:
        - "period flow amount"
        - "accepted kg"
      output: "amount per 1 kg reference product"
      source_ids:
        - etsi-es-203-199-v1-4-1
    - id: calc_bom_mass
      applies_to: "component inputs"
      rule: "component mass = accepted units × quantity per unit × verified unit mass; reconcile sum plus consumables, wastes and outputs"
      inputs:
        - BOM
        - receiving
        - "sample mass"
        - yield
      output: "kg component per kg product"
      source_ids:
        - etsi-es-203-199-v1-4-1
    - id: calc_production_mix
      applies_to: "multiple configurations"
      rule: "mix result = sum(configuration result × accepted net mass share); never combine semantically different device families without separate results"
      inputs:
        - "configuration inventories"
        - "accepted masses"
      output: "production-weighted result"
      source_ids:
        - un-cpc-v3-47223
        - etsi-es-203-199-v1-4-1
    - id: calc_use_energy
      applies_to: "conditional use stage"
      rule: "electricity = sum(input power in state/load bin × hours in bin) / 1000; state whether downstream PoE or other delivered power is included"
      inputs:
        - W
        - hours
        - configuration
        - "load profile"
      output: "kWh per declared period"
      source_ids:
        - etsi-es-203-199-v1-4-1
        - epa-energy-star-lne-v1-1
    - id: calc_transport
      applies_to: "transport"
      rule: "transport service = shipped mass in tonnes × route distance in km, by mode and leg"
      inputs:
        - kg
        - km
        - mode
        - "load factor"
      output: "tkm"
      source_ids:
        - etsi-es-203-199-v1-4-1
    - id: calc_mass_balance
      applies_to: "production and end-of-life"
      rule: "inputs = product outputs + waste outputs + measured releases ± stock change, using consistent dry/as-received basis as applicable"
      inputs:
        - "mass records"
        - "stock change"
        - releases
      output: "balance and unexplained difference"
      source_ids:
        - etsi-es-203-199-v1-4-1
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Preserve exact flow identity and declare device family/configuration; no narrow device or wrong-classification proxy is acceptable for the broad reference product."
      evidence: "Tiangong UUID readback; BOM; model/configuration record"
    - id: dq_representativeness
      applies_to: "all foreground records"
      requirement: "Report time, geography, technology, model mix and site coverage; explain exclusions and production weighting."
      evidence: "coverage table; production totals; site list"
    - id: dq_completeness
      applies_to: "BOM and process inventory"
      requirement: "Reconcile BOM mass, accepted product, rejects, packaging and stock changes; assess mass-, energy- and environmentally significant omissions cumulatively."
      evidence: "reconciliation; cut-off register; sensitivity analysis"
    - id: dq_measurement
      applies_to: "meters, scales and test equipment"
      requirement: "Use calibrated or verified instruments with traceable units and retain measurement boundary and uncertainty."
      evidence: "calibration/verification certificates; test setup; uncertainty statement"
    - id: dq_secondary_data
      applies_to: "upstream and scenario data"
      requirement: "Use geography-, time- and technology-matched datasets; record source, version/year and substitution rationale."
      evidence: "dataset register; source references; data-quality assessment"
    - id: dq_power_profile
      applies_to: "conditional use stage"
      requirement: "The profile shall represent the actual hardware/software configuration and declared traffic, radio, port and duty states; LNE tests shall disclose tested ports/modules and measurement setup."
      evidence: "power report; configuration; telemetry; epa-energy-star-lne-v1-1"
    - id: dq_eol
      applies_to: "conditional end-of-life"
      requirement: "Preserve route-specific masses and evidence for reuse/refurbishment, removed hazardous components, recovery and residues."
      evidence: "functionality tests; recycler records; WEEE treatment evidence where applicable"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference product UUID shall be 8b57a042-ffa4-4f3d-a5c7-556fce28e7b3, state code 100, Product flow, with Mass 93a60a56-a3c8-11da-a746-0800200b9a66 and kg from Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids: []
  - rule_id: validate_family_configuration
    applies_to: "category scope"
    rule: "Reject a package lacking device family and configuration qualifiers, or one that generalizes a router, switch, access point, base station, telephone or another narrow product to the whole category."
    source_ids:
      - un-cpc-v3-47223
      - epa-energy-star-lne-v1-1
  - rule_id: validate_reference_amount
    applies_to: "factory-gate output"
    rule: "Net finished-equipment output shall equal 1 kg after normalization; packaging shall be reported separately and must not be embedded silently."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "foreground boundary"
    rule: "Require assembly/configuration/testing and factory-gate release, plus every applicable in-house part process. Conditional lifecycle processes shall appear whenever the claimed scope includes them."
    source_ids:
      - etsi-es-203-199-v1-4-1
  - rule_id: validate_bom_and_mass_balance
    applies_to: "production inventory"
    rule: "Require BOM/component traceability and a documented mass balance; unresolved significant differences are findings, not automatic cut-offs."
    source_ids:
      - etsi-es-203-199-v1-4-1
  - rule_id: validate_operational_energy
    applies_to: "conditional use stage"
    rule: "Require measured power/load-state data and time profile for the actual configuration, with explicit PoE/downstream-power boundary; borrowed narrow-family power values fail unless justified as a named scenario with sensitivity."
    source_ids:
      - etsi-es-203-199-v1-4-1
      - epa-energy-star-lne-v1-1
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Require subdivision where practicable, otherwise a causal physical allocation basis; economic fallback and sensitivity shall be disclosed."
    source_ids:
      - etsi-es-203-199-v1-4-1
  - rule_id: validate_eol_routes
    applies_to: "conditional end-of-life"
    rule: "Require route mass balance and conditional removal/treatment of batteries, qualifying PCBAs, brominated-flame-retardant plastics, displays, external cables and other applicable components."
    source_ids:
      - eu-weee-directive-2012-19-eu
  - rule_id: validate_data_quality
    applies_to: "all data"
    rule: "Report methodological consistency, completeness, uncertainty, representativeness, age, acquisition method, supplier independence, geography, technology and cut-off treatment."
    source_ids:
      - etsi-es-203-199-v1-4-1
published_dataset_profile:
  dataset_role: "Product- and configuration-specific foreground manufacturing dataset; conditional lifecycle extensions remain separate, explicitly linked processes."
  downstream_use: "secondary_dataset; background_dataset after review of representativeness, upstream links, allocation and completeness"
  allowed_use: "Model production of the declared finished equipment/configuration at factory gate; aggregate only within the same device family using documented production weights; extend to use and end-of-life with configuration- and scenario-specific records."
  excluded_use: "Whole-category proxy based on one router, switch, access point, base station, telephone or model; comparison across unlike devices without equivalent function/capacity/lifetime; use-stage modelling from nameplate power alone; unidentified BOM substitution; unqualified market-average claims."
  required_metadata: "PCR id/version; reference UUID; device family; manufacturer/model/configuration; fixed/modular state; modules, ports/interfaces, protocols/bands, capacity/performance; power architecture and PoE boundary; included accessories/software; net mass and packaging; production sites/period; technology route; BOM coverage; allocation; cut-offs; geography; data sources; conditional lifetime/use/EoL scenario."
  required_quality_disclosure: "Foreground/secondary data shares; temporal, geographical and technological representativeness; configuration and production weighting; BOM and mass-balance completeness; measurement/calibration; uncertainty; cut-offs; allocation sensitivity; missing upstream datasets; use-profile and end-of-life scenario quality."
  update_trigger: "BOM, model family, chassis/module or power architecture change; material change in production route, site, supplier, yield or energy mix; firmware change affecting power; new measured use profile; market or end-of-life route change; source/standard revision; unresolved data gap becomes material."
