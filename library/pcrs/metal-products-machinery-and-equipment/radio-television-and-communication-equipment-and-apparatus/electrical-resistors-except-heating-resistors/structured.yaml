      flow_role: "Finishing, marking, and packaging materials"
      record_type: "issue, purchase, and stock record"
      raw_fields: "material id; lot; issue mass; purchase mass; opening and closing stock; returns; packaging type"
      collection_method: "calibrated weighing and inventory reconciliation"
      unit: "kg"
      frequency: "per issue with period reconciliation"
      temporal_coverage: "same period as represented production"
      site_scope: "finishing and pack-out areas at declared site"
