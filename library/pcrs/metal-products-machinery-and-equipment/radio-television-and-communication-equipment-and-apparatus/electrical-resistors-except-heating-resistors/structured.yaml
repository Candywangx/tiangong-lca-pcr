      unit: "kg"
      frequency: "per receipt and issue"
      temporal_coverage: "representative reporting period, normally at least twelve consecutive months unless a shorter campaign is justified"
      site_scope: "declared manufacturing site"
      aggregation_rule: "sum by material and lot; add opening stock and subtract closing stock and returns; normalize to prepared output"
