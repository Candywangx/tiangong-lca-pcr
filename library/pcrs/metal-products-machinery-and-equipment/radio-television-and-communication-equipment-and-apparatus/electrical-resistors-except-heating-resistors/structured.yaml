    - protocol_id: cp_final_product_and_qc_records
      process_id: "finishing_testing_and_packout"
      flow_role: "Accepted finished electrical resistors"
      record_type: "production, weighing, and quality release record"
      raw_fields: "product code; lot; fixed or variable family; technology; form; resistance or range; tolerance; rated dissipation; stability descriptor; net accepted mass; packaging mass; test status; date"
      collection_method: "calibrated net-mass weighing linked to electrical test and release records"
      unit: "kg"
      frequency: "per released lot"
      temporal_coverage: "same period as represented production"
      site_scope: "declared manufacturing site and plant gate"
      aggregation_rule: "sum accepted net product mass; normalize all included flows to 1 kg"
      quality_evidence: "scale and test-equipment calibration; lot release; product specification"
    - protocol_id: cp_finishing_waste_records
      process_id: "finishing_testing_and_packout"
      flow_role: "Off-specification product and finishing waste"
      record_type: "reject, rework, and waste dispatch record"
      raw_fields: "product or waste id; composition; mass; rework quantity; date; destination"
      collection_method: "calibrated weighing and reject reconciliation"
      unit: "kg"
      frequency: "per lot and dispatch"
      temporal_coverage: "same period as represented production"
      site_scope: "finishing and pack-out areas at declared site"
      aggregation_rule: "sum external waste after subtracting documented internal rework"
      quality_evidence: "reject log; waste manifest; mass balance"
    - protocol_id: cp_finishing_release_records
      process_id: "finishing_testing_and_packout"
      flow_role: "Direct releases from finishing"
      record_type: "monitoring and permit record"
      raw_fields: "substance; compartment; concentration; exhaust or effluent volume; time; treatment status"
      collection_method: "direct monitoring or concentration-volume calculation"
      unit: "kg"
      frequency: "per monitoring event with reporting-period coverage"
      temporal_coverage: "same period as represented production"
      site_scope: "controlled emission points at declared site"
      aggregation_rule: "calculate and sum releases by substance and compartment"
      quality_evidence: "laboratory report; instrument calibration; calculation sheet"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all included inventory rows"
      rule: "normalized amount = reporting-period amount / accepted finished net product mass × 1 kg"
      inputs:
        - "aggregated protocol record"
        - "accepted net product mass from cp_final_product_and_qc_records"
      output: "amount per 1 kg accepted finished electrical resistors"
      source_ids:
        - eu-pef-2021-2279
    - id: convert_count_to_mass
      applies_to: "part or product records available as counts"
      rule: "mass = item count × measured product-specific mean item mass; the mean is total calibrated sample mass divided by sample count"
      inputs:
        - "count record"
        - "sampled item count"
        - "calibrated sample mass"
      output: "kg material, parts, or accepted product"
      source_ids: []
    - id: calculate_direct_release
      applies_to: "concentration-and-volume emission records"
      rule: "released mass = monitored concentration × treated exhaust or effluent volume, with explicit compatible-unit conversion and treatment status"
      inputs:
        - concentration
        - "flow or volume"
        - "monitoring period"
        - "unit conversion"
      output: "kg substance released to the declared compartment"
      source_ids:
        - eu-pef-2021-2279
    - id: reconcile_process_mass
      applies_to: "each process and reporting period"
      rule: "mass discrepancy = external material inputs + opening work-in-progress − accepted transfers − external wastes − closing work-in-progress; internal rework is reported but cancels from the external balance"
      inputs:
        - material
        - output
        - waste
        - stock
        - "and rework protocols"
      output: "documented mass-balance discrepancy and investigation status"
      source_ids:
        - eu-pef-2021-2279
    - id: allocate_shared_energy
      applies_to: "shared electricity or fuel meter"
      rule: "process energy = shared-meter consumption × documented causal driver for the process / sum of the same driver for all users"
      inputs:
        - "meter readings"
        - "operating time"
        - "measured or rated load"
        - "or another justified physical driver"
      output: "kWh or MJ assigned to the included process"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and production mix"
      requirement: "Preserve product code and lot linkage to fixed or variable family, technology, form, resistance or range, tolerance, rated dissipation, stability descriptor, termination, housing or package, and conformity result."
      evidence: "product specification; bill of materials; route sheet; lot release record"
    - id: dq_technological_representativeness
      applies_to: "foreground and upstream data"
      requirement: "Foreground records must represent the declared resistor technologies and forms; upstream datasets must match material grade and production technology where material. Document any proxy."
      evidence: "technology coverage matrix; supplier data; proxy justification"
    - id: dq_geographical_representativeness
      applies_to: "utilities, upstream inputs, and treatment"
      requirement: "Use datasets and mixes representative of the declared manufacturing site and supplier or treatment geography; document mismatches."
      evidence: "site address; supplier origin; utility contract; dataset metadata"
    - id: dq_time_representativeness
      applies_to: "reporting-period data"
      requirement: "Prefer a continuous representative period covering seasonal and production-mix variation, normally at least twelve consecutive months; justify a shorter campaign and disclose data age."
      evidence: "reporting calendar; production schedule; dated records"
    - id: dq_measurement_and_precision
      applies_to: "measured mass, energy, and releases"
      requirement: "Identify measurement equipment, calibration status, resolution, sampling method, and calculation steps sufficient to reproduce material amounts and direct releases."
      evidence: "calibration certificates; sampling plan; calculation workbook"
    - id: dq_completeness_and_balance
      applies_to: "all included processes"
      requirement: "Reconcile material inputs, accepted transfers, product, work-in-progress changes, internal rework, wastes, and direct releases; investigate material discrepancies and disclose unresolved gaps without applying an undocumented cut-off."
      evidence: "process mass balances; exception log; completeness review"
    - id: dq_primary_and_secondary_data
      applies_to: "foreground collection and upstream links"
      requirement: "Use site- or company-specific primary data for directly controlled foreground processes and document the source, representativeness, and quality of each secondary dataset."
      evidence: "meter and production records; supplier records; secondary-dataset register; data-quality rating"
    - id: dq_restricted_substances
      applies_to: "products placed on regulated markets"
      requirement: "When applicable, maintain current material declarations, exemption status, and risk-based analytical evidence for restricted substances; screening and confirmatory testing must use the applicable current IEC 62321 parts and jurisdictional requirements."
      evidence: "supplier declarations; bill of materials; exemption register; accredited laboratory report"
validation_rules:
  - rule_id: validate_category_identity
    applies_to: "product category and reference flow"
    rule: "The represented output must be a finished fixed or variable electrical resistor within CPC 47120 and must not be a heating resistor, generic resistive material, unassembled element, broader electronic-component mix, or resistor-containing assembly with another principal function."
    source_ids:
      - unsd-cpc-3-0-structure
      - iec-60115-1-2020
      - iec-60393-1-2008
  - rule_id: validate_reference_flow
    applies_to: "functional unit and quantitative reference"
    rule: "The reference output must use product flow 9bee079d-ab55-44db-b1a4-72d61a856d61, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, normalized to exactly 1 kg net accepted finished product."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "foreground package metadata"
    rule: "Every required qualifier in section 3 must be present and consistent with product, bill-of-material, route, test, and release records."
    source_ids:
      - iec-60115-1-2020
      - iec-60393-1-2008
  - rule_id: validate_process_route
    applies_to: "process map and inventory"
    rule: "Each included route step and conditional variable-resistor assembly must match the declared product family and technology; absent operations must not receive invented flows, and outsourced operations must be linked and disclosed."
    source_ids:
      - vishay-fixed-resistor-basics-2008
  - rule_id: validate_collection_links
    applies_to: "collected or calculated inventory rows"
    rule: "Every collected or calculated amount must link to a listed collection protocol and retain the specified raw fields, period, site scope, aggregation, and quality evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_mass_balance
    applies_to: "each process and full foreground system"
    rule: "Material inputs, accepted transfers, stock changes, internal rework, product, wastes, and direct releases must be reconciled; any unresolved discrepancy must be quantified and makes validation inconclusive."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "shared processes, co-products, and recoverable scrap"
    rule: "Applied subdivision, causal driver, allocation basis, price period, recycling convention, and sensitivity must comply with section 7 and be disclosed wherever relevant."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_completeness
    applies_to: "included inventory"
    rule: "No material, energy, water, direct-release, waste, or treatment flow may be omitted solely because it is small; all exclusions, data gaps, and proxies must be disclosed and justified."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_restricted_substance_evidence
    applies_to: "regulated-market conformity disclosure"
    rule: "If restricted-substance conformity is claimed, the applicable jurisdiction, current exemptions, supplier evidence, test method, laboratory, sample, date, and result must be documented; a screening result alone must not be presented as universal legal compliance."
    source_ids:
      - eu-rohs-2011-65-eu
      - iec-62321-series
published_dataset_profile:
  dataset_role: "foreground_product_system; unit_process_or_aggregated_process_dataset"
  downstream_use: "foreground_data_package; process; lifecyclemodel; comparative or non-comparative LCA subject to matching scope"
  allowed_use: "Production of finished electrical resistors except heating resistors when product family, technology, form, performance qualifiers, geography, period, production mix, and plant gate match the represented data"
  excluded_use: "Heating resistors; raw or unassembled resistive materials; generic electronic components; downstream distribution, installation, use, maintenance, or end-of-life modelling without additional datasets"
  required_metadata: "canonical PCR id; CPC 3.0 code; reference flow UUIDs; required qualifiers; plant and geography; reporting period; production mix; process coverage; outsourced steps; upstream datasets; allocation and recycling conventions; conformity basis"
  required_quality_disclosure: "protocol coverage; primary-data share; technological, geographical, and time representativeness; measurement and sampling evidence; mass-balance results; proxies; gaps; exclusions; allocation sensitivity; restricted-substance evidence when claimed"
  update_trigger: "Change in product scope, resistor technology or form, plant or route, bill of materials, energy or treatment system, allocation convention, applicable regulation or standard, Tiangong identity, or data older than the declared representativeness period"
data_sources:
  - id: "unsd-cpc-3-0-structure"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 structure, CPC 47120, 2023, https://unstats.un.org/unsd/classifications/Meetings/UNCEISC2023/8-3_Background3_CPC3_Structure.pdf, retrieved 2026-08-09"
    used_for: "official product-category identity and exclusion of heating resistors"
  - id: "iec-60115-1-2020"
    type: "standard"
    reference: "IEC 60115-1:2020, Fixed resistors for use in electronic equipment — Part 1: Generic specification, https://webstore.iec.ch/en/publication/28476, retrieved 2026-08-09"
    used_for: "fixed-resistor scope, terminology, performance qualifiers, inspection, and test context"
  - id: "iec-60393-1-2008"
    type: "standard"
    reference: "IEC 60393-1:2008, Potentiometers for use in electronic equipment — Part 1: Generic specification, https://webstore.iec.ch/en/publication/2017, retrieved 2026-08-09"
    used_for: "variable-resistor and potentiometer scope, forms, terminology, inspection, and test context"
