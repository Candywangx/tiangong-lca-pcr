allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "independently measurable products, lines, or batches"
    rule: "Avoid allocation by subdividing product families, production lines, batches, and process records whenever inputs and outputs can be measured separately."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "internal rework and recirculation"
    rule: "Keep rework inside the process where it is reused, record its mass, and count only additional inputs, utilities, direct releases, and final losses caused by rework; do not treat the recirculated mass as a new external input or saleable co-product."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_utilities
    applies_to: "shared meters and common services"
    rule: "Allocate shared electricity, fuel, compressed air, water, and common treatment first by measured process consumption; when measurement is unavailable, use a documented causal physical driver such as machine operating time multiplied by measured or rated load."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_co_products
    applies_to: "jointly produced saleable products"
    rule: "After subdivision has been exhausted, use a documented physical relationship that reflects the causal production relationship; if no defensible physical relationship can be established, use economic allocation based on a representative price period and report the sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap
    applies_to: "recoverable scrap and residues"
    rule: "Record treatment up to the foreground gate and disclose the applied recycling or substitution convention. Do not assign an avoided-product credit or zero burden without the governing study method and explicit evidence."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
