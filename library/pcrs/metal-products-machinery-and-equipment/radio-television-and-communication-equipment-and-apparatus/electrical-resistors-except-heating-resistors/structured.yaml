    - protocol_id: cp_finishing_utility_records
      process_id: "finishing_testing_and_packout"
      flow_role: "Finishing and test electricity"
      record_type: "submeter or equipment energy record"
      raw_fields: "meter id; readings; machine id; operating time; load; batch id"
      collection_method: "calibrated submeter preferred; otherwise documented causal allocation"
      unit: "kWh"
      frequency: "continuous, shift, or batch"
      temporal_coverage: "same period as represented production"
