allocation_rules:
  - rule_id: allocation_subdivide_release
    applies_to: "Release-specific development, build, test, mastering, and packaging"
    rule: "Prefer direct metering and release-specific job, build, and equipment records. Subdivide shared infrastructure by release and activity before applying allocation."
    source_ids:
      - gsf-sci-1-1
  - rule_id: allocation_shared_compute
    applies_to: "Shared development or build infrastructure"
    rule: "When subdivision is impracticable, allocate electricity by measured or scheduler-recorded resource time for the represented release; disclose the resource metric, idle-capacity treatment, reporting period, and excluded workloads."
    source_ids:
      - gsf-sci-1-1
  - rule_id: allocation_hardware_embodied
    applies_to: "Each material supporting-hardware asset"
    rule: "For each actual device retained by the materiality assessment, allocate its asset-specific hardware dataset by time share and resource share using TE × (TiR / EL) × (RR / ToR), then normalize by conforming packaged-product mass. Disclose every term, data source, device identity, and any justified cut-off; do not combine unlike assets into one exchange."
    source_ids:
      - gsf-sci-1-1
  - rule_id: allocation_mass_normalization
    applies_to: "Release-level burden and multiple physical packaged units"
    rule: "Divide the represented release burden by the total verified kg of conforming physical CPC 47821 packaged product produced in the same allocation period. Download-only units, SaaS subscriptions, and products outside this PCR shall not enter the denominator."
    source_ids:
      - un-cpc-3-0-47821
      - un-cpc-3-0-84342
  - rule_id: allocation_waste_no_credit
    applies_to: "Recorded-disc, paperboard-box, and paper-insert waste"
    rule: "Report consumed material inputs and each outgoing waste separately. Do not assign recycling or avoided-burden credits inside the producer-gate process; model any treatment or credit in a separately declared downstream module."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_development_electricity
      process_id: "software_development_release"
      flow_role: "Electricity for included release activities"
      record_type: "Meter, utility, cloud-hosting, build-runner, and scheduler records"
      raw_fields: "meter_kWh; supplier_kWh; workload_id; release_id; timestamp; geography; voltage; allocation_resource_time; idle_capacity_rule"
      collection_method: "Reconcile facility or supplier electricity with release-specific resource-time records and documented exclusions"
      unit: "kWh and resource-time unit"
      frequency: "At least monthly and per release/build campaign where available"
      temporal_coverage: "Full declared reporting period; annual data are the lowest acceptable fallback when finer data are unavailable"
      site_scope: "All developer facilities and hosted resources included in the release boundary"
      aggregation_rule: "Convert kWh to MJ, allocate shared electricity to the release, sum, then divide by conforming packaged-product kg"
      quality_evidence: "Meter calibration or supplier invoice; workload logs; reconciliation; documented coverage and gaps"
    - protocol_id: cp_packaging_electricity
      process_id: "physical_media_packaging"
      flow_role: "Electricity for assembly and packaging"
      record_type: "Packaging-line meter and production records"
      raw_fields: "meter_start_kWh; meter_end_kWh; packaged_product_kg; downtime_kWh; line_id; timestamp"
      collection_method: "Read dedicated meter or allocate a reconciled facility meter by measured line operating time"
      unit: "kWh"
      frequency: "Per production run, aggregated monthly"
      temporal_coverage: "All runs producing the represented release"
      site_scope: "Every packaging site in scope"
      aggregation_rule: "Subtract documented out-of-scope loads, convert kWh to MJ, and divide by conforming packaged-product kg"
      quality_evidence: "Meter calibration; run log; facility reconciliation; downtime treatment"
    - protocol_id: cp_recorded_disc_mass
      process_id: "physical_media_packaging"
      flow_role: "Recorded optical-disc input"
      record_type: "Receiving, issue, return, bill-of-material, scale, reject, and stock records"
      raw_fields: "lot_id; issued_disc_count; unit_mass_kg; issued_mass_kg; unused_returned_mass_kg; rejected_mass_kg; stock_adjustment_mass_kg; release_id"
      collection_method: "Weigh representative discs and reconcile issued mass with genuine unused returns, retained product, rejects, and stock movements"
      unit: "kg"
      frequency: "Per received lot and production run"
      temporal_coverage: "All lots consumed for the represented release"
      site_scope: "Every packaging site and supplier lot in scope"
      aggregation_rule: "Calculate consumed disc mass as issued mass minus genuinely unused returned mass; include consumed rejects, then divide by conforming packaged-product kg"
      quality_evidence: "Calibrated scale; supplier specification; lot reconciliation; return record; reject log; stock ledger"
    - protocol_id: cp_paper_box_mass
      process_id: "physical_media_packaging"
      flow_role: "Retail paper-box input"
      record_type: "Bill of materials, supplier, issue, return, scale, reject, and stock records"
      raw_fields: "box_lot_id; box_count; unit_mass_kg; issued_mass_kg; unused_returned_mass_kg; rejected_mass_kg; stock_adjustment_mass_kg"
      collection_method: "Weigh representative boxes and reconcile issued mass with genuine unused returns, retained product, scrap, and stock movements"
      unit: "kg"
      frequency: "Per packaging-material lot and production run"
      temporal_coverage: "All boxes consumed for the represented release"
      site_scope: "Every packaging site and box supplier in scope"
      aggregation_rule: "Calculate consumed box mass as issued mass minus genuinely unused returned mass; include consumed rejects, then divide by conforming packaged-product kg"
      quality_evidence: "Calibrated scale; supplier specification; issue/return records; material reconciliation; stock ledger"
    - protocol_id: cp_paper_insert_mass
      process_id: "physical_media_packaging"
      flow_role: "Paper instruction-insert input"
      record_type: "Bill of materials, print-order, issue, return, scale, reject, and stock records"
      raw_fields: "insert_lot_id; insert_count; unit_mass_kg; issued_mass_kg; unused_returned_mass_kg; rejected_mass_kg; stock_adjustment_mass_kg"
      collection_method: "Weigh representative inserts and reconcile issued mass with genuine unused returns, retained product, scrap, and stock movements"
      unit: "kg"
      frequency: "Per print lot and production run"
      temporal_coverage: "All inserts consumed for the represented release"
      site_scope: "Every packaging site and print supplier in scope"
      aggregation_rule: "Calculate consumed insert mass as issued mass minus genuinely unused returned mass; include consumed rejects, then divide by conforming packaged-product kg"
      quality_evidence: "Calibrated scale; printer specification; issue/return records; material reconciliation; stock ledger"
    - protocol_id: cp_product_mass
      process_id: "physical_media_packaging"
      flow_role: "Conforming packaged-product output"
      record_type: "Finished-goods count and scale records"
      raw_fields: "release_id; product_variant; package_count; sample_unit_mass_kg; total_output_mass_kg; rejected_package_mass_kg"
      collection_method: "Weigh statistically documented samples or the complete lot and reconcile with finished-goods count"
      unit: "kg"
      frequency: "Per production run and release"
      temporal_coverage: "Full reporting period"
      site_scope: "Every packaging site in scope"
      aggregation_rule: "Sum conforming output mass only; use this mass as the normalization denominator"
      quality_evidence: "Calibrated scale; sampling plan; finished-goods reconciliation"
    - protocol_id: cp_optical_disc_waste
      process_id: "physical_media_packaging"
      flow_role: "Rejected recorded optical-disc waste"
      record_type: "Segregated waste container and reject records"
      raw_fields: "container_id; gross_mass_kg; tare_mass_kg; release_id; rejection_reason; destination"
      collection_method: "Weigh segregated rejected recorded discs before off-site treatment"
      unit: "kg"
      frequency: "Per container and production run"
      temporal_coverage: "Full reporting period"
      site_scope: "Every packaging site in scope"
      aggregation_rule: "Sum net rejected-disc mass and divide by conforming packaged-product kg"
      quality_evidence: "Calibrated scale; reject log; waste transfer record; contamination check"
    - protocol_id: cp_paperboard_waste
