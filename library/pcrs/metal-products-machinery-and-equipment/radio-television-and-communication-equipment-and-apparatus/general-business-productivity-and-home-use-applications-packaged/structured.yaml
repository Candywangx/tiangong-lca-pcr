      unit: "kg"
      frequency: "Per container and production run"
      temporal_coverage: "Full reporting period"
      site_scope: "Every packaging site in scope"
      aggregation_rule: "Sum net cardboard packaging-waste mass and divide by conforming packaged-product kg"
      quality_evidence: "Calibrated scale; material balance; waste transfer record; contamination check"
    - protocol_id: cp_paper_insert_waste
      process_id: "physical_media_packaging"
      flow_role: "Paper instruction-insert waste"
      record_type: "Segregated waste container, reject, and material-reconciliation records"
      raw_fields: "container_id; gross_mass_kg; tare_mass_kg; release_id; rejection_reason; destination; contamination_note"
      collection_method: "Weigh segregated paper instruction-insert scrap before treatment"
      unit: "kg"
      frequency: "Per container and production run"
      temporal_coverage: "Full reporting period"
      site_scope: "Every packaging site in scope"
      aggregation_rule: "Sum net paper insert-waste mass and divide by conforming packaged-product kg"
      quality_evidence: "Calibrated scale; print/reject log; material balance; waste transfer record; contamination check"
    - protocol_id: cp_hardware_materiality_assessment
      process_id: "software_development_release"
      flow_role: "Supporting-hardware boundary assessment"
      record_type: "Asset register, configuration, hardware LCA, utilization, and cut-off worksheet"
      raw_fields: "asset_id; device_type; model_or_configuration; geography; hardware_dataset_id; TE; TiR; EL; RR; ToR; allocated_burden; cutoff_threshold; inclusion_decision; exclusion_justification"
      collection_method: "Screen every actual supporting device separately; retain the calculation and add each material device as its own product exchange"
      unit: "Hardware-dataset unit and allocation variables"
      frequency: "Per release and whenever assets or utilization change"
      temporal_coverage: "Full release allocation period"
      site_scope: "All developer, build, test, storage, and network assets in scope"
      aggregation_rule: "Evaluate asset-specific allocated burden against the disclosed cut-off; retain material devices and documented exclusions without aggregation"
      quality_evidence: "Asset register; procurement/configuration record; hardware LCA source; scheduler/utilization log; signed cut-off worksheet"
  calculation_rules:
    - id: calc_electricity_mj
      applies_to: "Both electricity rows"
      rule: "electricity_MJ = collected_kWh × 3.6"
      inputs:
        - "Reconciled included kWh"
      output: "MJ before product normalization"
      source_ids:
        - gsf-sci-1-1
    - id: calc_shared_release_electricity
      applies_to: "Shared developer/build infrastructure"
      rule: "release_kWh = total_in_scope_kWh × represented_release_resource_time / total_in_scope_resource_time; apply the same reporting period and idle-capacity rule to numerator and denominator"
      inputs:
        - "Reconciled electricity"
        - "workload resource time"
        - "release identity"
      output: "kWh assigned to represented release"
      source_ids:
        - gsf-sci-1-1
    - id: calc_hardware_embodied_share
      applies_to: "Each assessed supporting-hardware asset"
      rule: "allocated_hardware_burden_asset = TE_asset × (TiR_asset / EL_asset) × (RR_asset / ToR_asset); all variables shall use the same identified device and time basis. Add each material asset as a separate concrete exchange; retain the quantitative cut-off calculation for every excluded asset."
      inputs:
        - "Asset-specific hardware LCA burden"
        - "time reserved"
        - "expected life"
        - "resources reserved"
        - "total resources"
        - "disclosed cut-off"
      output: "Allocated asset burden and inclusion decision for the represented release"
      source_ids:
        - gsf-sci-1-1
    - id: calc_reference_normalization
      applies_to: "All release and packaging rows"
      rule: "normalized_amount = included_amount / conforming_packaged_product_kg"
      inputs:
        - "Included row amount"
        - "verified conforming output mass"
      output: "Amount per 1 kg reference product"
      source_ids: []
    - id: calc_packaging_mass_balance
      applies_to: "Physical-media assembly and packaging"
      rule: "For each material, calculate consumed_input = issued_mass - genuine_unused_returns and reconcile it to mass retained in conforming product, its separately measured outgoing waste, and documented stock or measurement adjustments. Reconcile recorded discs, paper boxes, and paper inserts separately; investigate every unexplained residual before approval."
      inputs:
        - "Issued inputs"
        - "genuine unused returns"
        - "conforming-product component masses"
        - "recorded disc"
        - paperboard
        - "and paper-insert wastes"
        - "documented stock adjustments"
      output: "Material-specific packaging mass-balance reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain product name, version, release identifier, declared application function, supported platform, licence scope, physical medium, packaging bill, and evidence that the product is not download-only."
      evidence: "Release record; product specification; package bill of materials; CPC eligibility review"
    - id: dq_temporal_alignment
      applies_to: "Development and packaging records"
      requirement: "Use one disclosed allocation period. Align electricity, workload, material, waste, and output records to that period; explain cut-offs, release overlap, and late corrections."
      evidence: "Dated meters, invoices, workload logs, production runs, and reconciliation record"
    - id: dq_meter_and_mass_quality
      applies_to: "Electricity, material, product, and waste quantities"
      requirement: "Retain calibration status, sampling method, unit conversion, missing-data treatment, and source-record lineage for each value."
      evidence: "Calibration certificate; sampling plan; conversion worksheet; exception log"
    - id: dq_supplier_specificity
      applies_to: "Electricity, recorded disc, paper box, and paper insert"
      requirement: "Select upstream datasets matching geography, voltage or technology, material state, and supplier route as closely as available; disclose proxies."
      evidence: "Supplier specifications; dataset-selection record; proxy justification"
    - id: dq_hardware_boundary
      applies_to: "Supporting infrastructure"
      requirement: "Retain an asset-by-asset screen for workstations, servers, storage, and network devices. Include each material asset as a distinct exchange; document every exclusion with a quantitative cut-off calculation."
      evidence: "Asset register; hardware LCA source; allocation worksheet; cut-off register; dataset exchange list"
    - id: dq_completeness
      applies_to: "Foreground package"
      requirement: "Reconcile both required processes and all nine prescribed inventory rows, plus every material hardware exchange identified by the asset screen. A zero shall mean measured absence; missing and not-applicable shall remain distinct."
      evidence: "Completeness matrix; process-owner sign-off; mass, electricity, and hardware reconciliation"
    - id: dq_range_status
      applies_to: "Important inventory rows"
      requirement: "Treat this candidate PCR as foreground-record driven. Do not present uncited single cases as typical ranges; retain the unresolved range-evidence needs until two independent, boundary-compatible original sources or reviewed multi-period foreground evidence are available."
      evidence: "Manifest unresolved range-evidence list; evidence review record"
validation_rules:
  - rule_id: validate_identity_and_route
    applies_to: "Product eligibility"
    rule: "Fail if the declared product is download-only, hosted/SaaS, custom-developed, a computer game, system software, or another excluded software subclass; verify the physical packaged-product configuration and covered function."
    source_ids:
      - un-cpc-3-0-47821
      - un-cpc-3-0-84342
  - rule_id: validate_reference_flow
    applies_to: "Reference flow"
    rule: "Require exactly 1 kg after normalization, the confirmed product-flow UUID, Mass property, kg unit, and every required qualifier."
    source_ids: []
  - rule_id: validate_inventory_completeness
    applies_to: "Process inventory"
    rule: "Require both process sections and all nine prescribed row ids; require a value, measured zero, or explicit not-applicable state for each route-applicable row. Every material device from the hardware assessment shall appear as its own additional exchange."
    source_ids: []
  - rule_id: validate_atomic_flows
    applies_to: "Inventory identity"
    rule: "Reject umbrella utility, packaging, hardware, waste, or emissions labels. Each row shall represent one exchange; recorded_optical_disc_input and waste_recorded_optical_disc_output remain UUID-empty until exact state-code 100 identities are confirmed."
    source_ids: []
  - rule_id: validate_electricity_conversion
    applies_to: "Electricity rows"
    rule: "Recalculate kWh-to-MJ conversion and release/output normalization; require one grid geography and delivery boundary for each electricity dataset used."
    source_ids:
      - gsf-sci-1-1
  - rule_id: validate_mass_balance
    applies_to: "Physical-media assembly and packaging"
    rule: "Check separately for discs, boxes, and inserts that issued mass minus genuine unused returns equals retained conforming-product component mass plus measured outgoing material waste and documented stock or measurement adjustments within disclosed uncertainty. Consumed rejects must remain in inputs; unexplained residuals are findings."
    source_ids: []
  - rule_id: validate_hardware_boundary
    applies_to: "Supporting infrastructure"
    rule: "Require the asset-by-asset materiality screen. Fail when a material asset is omitted, unlike devices are combined in one row, an exclusion lacks its quantitative cut-off calculation, or missing data are treated as zero."
    source_ids:
      - gsf-sci-1-1
  - rule_id: validate_allocation
    applies_to: "Shared infrastructure and release burden"
    rule: "Recalculate allocation denominators; exclude download-only units and other products; require consistent period, resource metric, and idle-capacity rule."
    source_ids:
      - gsf-sci-1-1
      - un-cpc-3-0-84342
  - rule_id: validate_no_duplicate_background_emissions
    applies_to: "Purchased electricity and materials"
    rule: "Reject direct elementary emissions copied from upstream electricity or material datasets unless they are independently measured direct foreground releases."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground physical packaged-application production dataset normalized to 1 kg producer-gate product"
  downstream_use: "secondary_dataset; background_dataset after methodology and translation review and resolution or explicit acceptance of open evidence needs"
  allowed_use: "Producer-gate LCA of physical packaged general business productivity and covered home-use applications; comparison only between datasets with equivalent function, version scope, physical medium, packaging configuration, boundary, allocation period, and geography"
  excluded_use: "Download-only software, SaaS or cloud service, custom development, computer games, system/network/database/development-tool software, use-phase claims without a separate module, and comparisons based only on kg when application function or quality differs"
  required_metadata: "Product and release identifiers; covered function; supported platform; licence scope; medium and packaging configuration; geography; reporting period; included infrastructure; asset-by-asset hardware screen; output mass; allocation method and denominator; electricity datasets; supplier material datasets; exclusions and cut-off calculations; proxies; unresolved UUID and range-evidence status"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; temporal and site coverage; release allocation method; hardware asset identities, included exchanges, and quantitative cut-offs; material-specific mass-balance residuals; missing-data and proxy treatment; whether optional modules were excluded"
  update_trigger: "New major release or materially changed function; changed medium or packaging; changed build/test or packaging technology; changed site, grid, supplier, or allocation method; evidence resolving the open optical-disc-waste UUID or quantitative ranges; or a CPC boundary revision"
