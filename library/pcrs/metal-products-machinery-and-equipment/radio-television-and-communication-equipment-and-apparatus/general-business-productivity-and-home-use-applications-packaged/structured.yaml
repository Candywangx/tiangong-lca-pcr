system_boundary:
  rules:
    - rule_id: boundary_physical_packaged_product
      applies_to: "Product eligibility"
      rule: "Include only published physical packaged application software within the covered functions; exclude download-only application files and hosted or custom software services."
      source_ids:
        - un-cpc-3-0-47821
        - un-cpc-3-0-84342
    - rule_id: boundary_release_production
      applies_to: "Required foreground processes"
      rule: "Include release development, build, testing, mastering, and physical assembly and retail packaging through the packaged product at the producer gate."
      source_ids:
        - gsf-sci-1-1
        - un-cpc-3-0-47821
    - rule_id: boundary_supporting_infrastructure
      applies_to: "Material supporting infrastructure"
      rule: "Include measured electricity for development/build/test and packaging. Screen each actual developer workstation, build/test server, storage device, and network device supporting the release using a documented asset-specific materiality assessment. Add every material asset as its own concrete product exchange linked to an appropriate hardware dataset and allocate it by disclosed time and resource shares. Exclude an asset only under a disclosed quantitative cut-off calculation retained with the dataset; absence of a claim or missing data is not a zero. Preserve the device type, model or configuration, asset identifier, geography, lifetime basis, and allocation variables, and never aggregate different devices into an umbrella hardware row."
      source_ids:
        - gsf-sci-1-1
    - rule_id: boundary_background_emissions
      applies_to: "Purchased electricity and materials"
      rule: "Use upstream datasets for emissions embodied in purchased electricity and materials; do not duplicate those emissions as direct elementary outputs unless the foreground process directly releases them."
      source_ids: []
    - rule_id: boundary_optional_modules
      applies_to: "Distribution, operation, maintenance, and end of life"
      rule: "Keep these outside the default producer-gate dataset. When a study adds one, report it as a separate module with its own functional basis, scenario, inventory, and exclusions."
      source_ids:
        - gsf-sci-1-1
