allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared operations"
    rule: "Prefer separately measured operations. Where separation is infeasible, use a demonstrated physical driver; disclose a justified alternative when no physical relationship can be established."
    source_ids:
      - wri-wbcsd-product-standard-2011
  - rule_id: allocation_factory
    applies_to: "winding, curing and testing"
    rule: "Allocate shared electricity from measured equipment time and load, or occupied cure capacity validated against the meter. Do not allocate different part designs solely by revenue or net mass without explaining the causal relationship. Fractions must sum to one over products served."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejected and reworked coils"
    rule: "Burdens of failed units and all repeated operations remain in the producing cohort and are normalized to accepted output. Internal rework is not a negative input or a saleable co-product."
