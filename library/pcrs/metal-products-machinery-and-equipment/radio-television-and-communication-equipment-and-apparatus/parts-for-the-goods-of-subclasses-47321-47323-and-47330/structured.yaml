  calculation_rules:
    - id: calc_normalize
      applies_to: "external exchanges"
      rule: "q_i = Q_i / M, where Q_i is the measured cohort exchange after stock correction and any justified shared-process allocation; M is accepted net product mass"
      inputs:
        - "collected Q_i"
        - M
        - "allocation fraction"
      output: "kg/kg or MJ/kg accepted part"
      source_ids: []
    - id: calc_energy
      applies_to: "metered electricity"
      rule: "Q_MJ = (end_kWh - start_kWh) × 3.6 × allocated_fraction; normalize by M"
      inputs:
        - meters
        - "allocation records"
        - M
      output: "MJ per kg accepted part"
      source_ids: []
    - id: calc_transfer
      applies_to: "internal links"
      rule: "Outgoing transfer equals matching incoming transfer after explicitly recorded WIP changes; cancel both in plant aggregation"
      inputs:
        - "transfer tickets"
        - "WIP masses"
      output: "reconciled internal mass"
      source_ids: []
    - id: calc_yield_balance
      applies_to: "coil manufacture"
      rule: "Input material mass plus opening WIP equals accepted coils plus exported process wastes plus identified releases plus closing WIP. Internal transfers and internal rework are not additional plant inputs. Investigate differences using documented measurement uncertainty."
      inputs:
        - wire
        - adhesive
        - "coil output"
        - wastes
        - WIP
        - "identified releases"
      output: "batch mass balance and measured yield"
      source_ids: []
    - id: calc_pack_balance
      applies_to: "each packaging material"
      rule: "Consumption equals retained shipped packaging plus recorded discarded packaging, adjusted for stock and reuse"
      inputs:
        - counts
        - "measured masses"
        - "waste weights"
      output: "packaging reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all parts"
      requirement: "Preserve one part number and revision per reference dataset; distinguish a coil from a complete transducer and a bare circuit from an assembled equipment-specific board."
      evidence: "Drawing; BOM; parent-equipment declaration; official classification"
    - id: dq_completeness
      applies_to: "actual route"
      requirement: "Walk the actual process and compare material balances, SDS, maintenance and utility records. Add any missing concrete exchange; document applicability of every conditional card."
      evidence: "Signed route checklist; logs; mass balance"
    - id: dq_representativeness
      applies_to: "measurement period"
      requirement: "Declare start/end dates, production volume, geography and technology; cover the operating modes that materially affect this part. Explain downtime, seasonal effects and omitted batches."
      evidence: "Production records; period selection justification"
    - id: dq_uncertainty
      applies_to: "all quantities"
      requirement: "Retain uncertainty, missing records, allocation sensitivity and supplier data quality. Do not replace missing observations with patent examples or an unverified “typical” range."
      evidence: "Calibration records; uncertainty assessment; data-gap register"
    - id: dq_sources
      applies_to: "supporting datasets"
      requirement: "Verify delivered state and upstream boundary; retain data-source version in the foreground package, while PCR flow UUIDs remain version-free."
      evidence: "Supplier declarations; dataset documentation"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require all declared qualifiers, M greater than zero, accepted product status, net mass and count reconciliation. An uninstantiated generic part description is incomplete."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "every exchange"
    rule: "Require one physical or chemical exchange, correct product/waste/elementary type, compatible property and unit, and either verified flow identity or an explicit unresolved identity. A missing UUID never means a zero quantity."
    source_ids: []
  - rule_id: validate_conservation
    applies_to: "production and packing"
    rule: "Check calc_transfer, calc_yield_balance and calc_pack_balance. Set acceptance tolerance from measurement uncertainty and report deviations; this PCR supplies no invented universal tolerance."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "three processes"
    rule: "Reconcile separate meters and allocation fractions; exclude duplicate electrical totals and upstream generation emissions from direct site releases."
    source_ids: []
  - rule_id: validate_route
    applies_to: "applicability"
    rule: "Substantiate solvent-free adhesive, electrical curing, removable tooling and the unmounted coil gate for the representative route. Other routes require their own atomic exchanges, direct releases and finished-part reference before use."
    source_ids:
      - us20170223463a1-voice-coil
  - rule_id: validate_boundary
    applies_to: "downstream results"
    rule: "Clearly distinguish gate-to-gate data from a completed cradle-to-gate model. Do not present this part dataset as a complete loudspeaker lifecycle or use it for unqualified comparison of different equipment functions."
    source_ids:
      - wri-wbcsd-product-standard-2011
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after declared representativeness and review"
  downstream_use: "Input to assembly of the specified audio/video or electroacoustic equipment; process and lifecyclemodel projections of the collected foreground package"
  allowed_use: "Matching part revision and supply condition, or an explicitly justified technologically compatible part with disclosed adjustments"
  excluded_use: "Automatic substitution for complete equipment, copper wire, generic boards, other part functions, final acoustic service or product use/end of life"
  required_metadata: "Part identity and revision; declared unit and count conversion; intended equipment; site, geography and dates; made/bought stages; process map; allocation; suppliers; logistics; waste treatment; supporting datasets"
  required_quality_disclosure: "Coverage, uncertainty, data gaps, unresolved identities, missing range evidence, primary/secondary data contributions, measurement basis and exclusions"
  update_trigger: "Drawing, conductor, insulation, adhesive, cure route, factory, power supply, yield, supplier boundary or packaging change; new records that invalidate representativeness"
