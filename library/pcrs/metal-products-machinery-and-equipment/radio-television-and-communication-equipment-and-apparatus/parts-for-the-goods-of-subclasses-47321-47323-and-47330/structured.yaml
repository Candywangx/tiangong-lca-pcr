measurement_rules:
  - id: net_reference_mass
    applies_to: "accepted output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted dry cured parts without packaging, temporary sleeves or rejected units. Record calibrated balance resolution and tare."
  - id: piece_mass_conversion
    applies_to: "piece-based production and packing"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert counts using measured mean mass for the same part revision and lot. Do not use a universal coil or box mass. Retain sample count and variation."
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve meter kWh and normalize with 1 kWh = 3.6 MJ. Do not treat electrical energy as fuel mass or add grid emissions as direct site emissions."
  - id: wire_and_adhesive_basis
    applies_to: "winding inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Wire quantity includes its supplied insulation. Adhesive quantity is total supplied formulation; record solids and any volatile constituents separately. Do not duplicate resin or insulation already included in purchased inputs."
  - id: batch_matching
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass or energy as specified on the row"
      uuid: ""
    required_unit: "kg or MJ"
    rule: "Use a common closed production period, account for work in progress and rework, and divide allocated exchange totals by accepted net mass M. Require M greater than zero."
