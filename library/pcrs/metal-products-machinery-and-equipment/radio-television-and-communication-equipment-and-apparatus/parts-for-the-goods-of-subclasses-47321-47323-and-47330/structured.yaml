system_boundary:
  rules:
    - rule_id: boundary_part_gate
      applies_to: "system model"
      rule: "Provide a clearly identified intermediate-part production inventory. A cradle-to-gate result includes upstream supply and production-waste treatment and excludes final-equipment use and end of life; justify this partial boundary."
      source_ids:
        - wri-wbcsd-product-standard-2011
    - rule_id: boundary_processes
      applies_to: "representative foreground"
      rule: "Include wire winding, adhesive application, actual curing energy, demoulding, inspection, failed tests, rework and packing. Diaphragm attachment and magnet assembly belong to downstream loudspeaker production in this reference state."
      source_ids:
        - us20170223463a1-voice-coil
    - rule_id: boundary_conditional_exchanges
      applies_to: "route instantiation"
      rule: "Verify all routes against the actual bill of materials, safety data sheets and site records. Add each used solvent, its species-specific release, cleaning agent, fuel, water stream, tooling replacement and subcontract service as a separate exchange; do not assume zero because it is absent from the representative cards. The representative recipe is supplied solvent-free and electrically cured; substantiate that condition."
      source_ids: []
    - rule_id: boundary_tooling
      applies_to: "reusable sleeves and equipment"
      rule: "Record tooling material, replacement count, reuse life and output served. Include attributable replacement burdens or document and justify exclusion. Do not count a removable sleeve as retained coil mass."
      source_ids:
        - us20170223463a1-voice-coil
    - rule_id: boundary_support
      applies_to: "logistics and waste treatment"
      rule: "Collect received mass, distance, transport mode, load allocation and waste transfer destination. Attach transport and treatment datasets at their actual boundaries, without duplicating services already included in supplier datasets."
      source_ids: []
boundary_abstraction:
