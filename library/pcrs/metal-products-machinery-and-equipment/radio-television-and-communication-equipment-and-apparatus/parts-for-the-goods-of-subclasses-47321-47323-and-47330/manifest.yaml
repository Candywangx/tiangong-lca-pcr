        explanation: No two independent original-text sources with compatible part design, product state, functional unit and factory boundary establish empirical ranges for material consumption, electricity, yield, wastes or packaging. Patent embodiments are one publication and not plant measurements. Retain measured cohort collection; obtain independent compatible manufacturing evidence before setting any external range.
