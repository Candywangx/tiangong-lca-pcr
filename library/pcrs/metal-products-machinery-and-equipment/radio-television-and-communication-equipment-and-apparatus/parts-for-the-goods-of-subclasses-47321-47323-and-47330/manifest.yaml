  semantic_boundary_review:
    classification_source: un-cpc-3-0-structure-2025
    conclusion: Dedicated audio/video and electroacoustic equipment parts; complete equipment and separately identifiable general components are excluded. Manifest identity/path checks found no matching material dedicated-parts PCR. Representative bobbinless voice-coil route is not a universal BOM. Existing legacy path is retained under the explicit assignment.
  translation_review:
    title: Author translation checked against the four original UNSD subclass titles; zero claim of an official UNSD Chinese title. 零部件 denotes parts; 所列产品 preserves the cross-reference scope.
    flow_names: Exact TianGong Chinese baseName used for every adopted UUID; concrete unresolved names translated.
  unresolved:
    inventory_flow_uuids:
      - row_id: winding_wire
        reason_code: no_exact_candidate
        explanation: Public magnet-wire identity does not establish the required copper conductor and supplied insulation state.
      - row_id: epoxy_adhesive
        reason_code: no_exact_candidate
        explanation: Candidates represent primary epoxy resin, solvent-based material or unidentified glue; no complete solvent-free heat-curing adhesive was established.
      - row_id: uncured_coil_out
        reason_code: internal_intermediate_needs_new_flow
        explanation: An internal batch-specific wound uncured epoxy-coated copper voice coil requires a dedicated state-specific flow. Paired transfers retain identical identity and cancel on plant aggregation.
      - row_id: winding_wire_scrap
        reason_code: no_exact_candidate
        explanation: Imported copper scrap and unspecified waste wire do not establish the segregated insulated copper winding-wire offcut stream.
      - row_id: uncured_adhesive_waste
        reason_code: no_exact_candidate
        explanation: No candidate establishes both epoxy adhesive chemistry and the uncured waste state.
      - row_id: uncured_coil_in
        reason_code: internal_intermediate_needs_new_flow
        explanation: An internal batch-specific wound uncured epoxy-coated copper voice coil requires a dedicated state-specific flow. Paired transfers retain identical identity and cancel on plant aggregation.
      - row_id: cured_coil_out
        reason_code: internal_intermediate_needs_new_flow
        explanation: An internal batch-specific cured untested bobbinless copper voice coil requires a dedicated state-specific flow. Paired transfers retain identical identity and cancel on plant aggregation.
      - row_id: cured_epoxy_flash
        reason_code: no_exact_candidate
        explanation: No candidate identifies segregated cured epoxy flash; results are unspecified residue, ion-exchange resin, wire or paint.
      - row_id: cured_coil_in
        reason_code: internal_intermediate_needs_new_flow
        explanation: An internal batch-specific cured untested bobbinless copper voice coil requires a dedicated state-specific flow. Paired transfers retain identical identity and cancel on plant aggregation.
      - row_id: polyethylene_bag
        reason_code: classification_mismatch
        explanation: The polyethylene-bag candidate is classified under CPC 36490 rather than plastic sacks and bags 36410; LDPE grade is also unconfirmed.
      - row_id: accepted_voice_coil
        reason_code: no_exact_candidate
        explanation: No candidate represents a finished bobbinless epoxy-bound copper loudspeaker voice coil; wire, ballast and aluminium foil candidates were rejected.
      - row_id: rejected_voice_coil
        reason_code: no_exact_candidate
        explanation: No candidate establishes a rejected cured composite voice coil; the copper-based waste candidate also has an incompatible primary-copper classification.
      - row_id: corrugated_box_waste
        reason_code: classification_mismatch
        explanation: No segregated corrugated-box waste candidate has compatible identity and classification; cardboard results use 39249 rather than corrugated recovered paperboard 39241.
      - row_id: polyethylene_bag_waste
        reason_code: no_exact_candidate
        explanation: No candidate establishes discarded LDPE packaging bags; PET and paper candidates mismatch, and generic polyethylene waste leaves grade and state unresolved.
    range_evidence_needs:
