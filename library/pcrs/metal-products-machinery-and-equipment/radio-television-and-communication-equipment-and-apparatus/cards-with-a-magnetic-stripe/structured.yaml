allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared operations and meters"
    rule: "Avoid allocation by subdividing separately metered lines, products, production orders, or time periods wherever technically feasible."
    source_ids: []
  - rule_id: allocation_shared_electricity
    applies_to: "shared electricity"
    rule: "When subdivision is not feasible, allocate shared electricity using measured machine operating time multiplied by rated or measured load; use finished-product mass only when the reporting products use materially comparable operations, and disclose the method."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "PVC card scrap"
    rule: "Assign no avoided-burden credit inside the foreground process. Report scrap mass and treatment route separately; any recycling substitution or downstream credit belongs to the declared downstream model."
    source_ids: []
  - rule_id: allocation_co_products
    applies_to: "saleable co-products"
    rule: "If a separately saleable co-product occurs, first subdivide its process. If subdivision is impossible, use a documented physical causal relationship; use economic allocation only when no defensible physical relationship exists and disclose price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "card_manufacturing"
      flow_role: "PVC sheet and magnetic-stripe foil inputs"
      record_type: "weigh tickets, issue/return records, invoices, and inventory records"
      raw_fields: "material identity; supplier; lot; gross issued mass; returned mass; opening and closing inventory; date; product order"
      collection_method: "reconcile issued, returned, and inventory-change records by concrete material"
      unit: "kg"
      frequency: "each issue/return, aggregated monthly or by production lot"
      temporal_coverage: "representative continuous production period, normally at least 12 months or the complete shorter campaign"
      site_scope: "all lines and storage locations serving the declared product"
      aggregation_rule: "sum net consumed mass by material; normalize each material separately to conforming output mass"
      quality_evidence: "calibrated scale records; inventory reconciliation; supplier specification; exception log"
    - protocol_id: cp_printing_materials_and_releases
      process_id: "card_manufacturing"
      flow_role: "printing ink, gloss oil, isopropanol, process water, waste ink, spent isopropanol solution, cleaning wastewater and isopropanol to air"
      record_type: "issue/return and batch records; supplier formulation or SDS; cleanup log; waste-transfer weights; wastewater meter or batch volume with density; air test or solvent-balance worksheet"
      raw_fields: "material and formulation identity; gross issue and return; isopropanol fraction; water input; cleanup event; waste-stream mass and composition; recovered solvent; control capture and destruction; release point; date; product order"
      collection_method: "reconcile each named input and output separately; derive isopropanol release only after subtracting measured recovery, waste-bound mass, retained mass and documented destruction"
      unit: "kg"
      frequency: "each batch and cleanup event, aggregated monthly or by production lot"
      temporal_coverage: "same period as product, substrate and energy records"
      site_scope: "every screen, offset, coating, drying and cleanup operation serving the declared product"
      aggregation_rule: "sum each atomic exchange without double counting mixed-waste constituents; normalize to conforming output mass"
      quality_evidence: "supplier formulation or SDS; calibrated issue and waste weights; cleanup log; waste manifest; wastewater record; control-device and solvent-balance evidence"
    - protocol_id: cp_electricity
      process_id: "card_manufacturing"
      flow_role: "purchased electricity"
      record_type: "utility meter, submeter, and machine-run records"
