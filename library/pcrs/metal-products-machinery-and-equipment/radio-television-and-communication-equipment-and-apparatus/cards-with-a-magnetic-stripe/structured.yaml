  calculation_rules:
    - id: calc_material_normalization
      applies_to: "all mass-based product, waste and direct-emission rows"
      rule: "normalized amount = period mass for the row / conforming finished-card mass for the same period"
      inputs:
        - "reconciled row mass"
        - "accepted output mass"
      output: "kg per kg reference product"
      source_ids: []
    - id: calc_electricity_normalization
      applies_to: "electricity"
      rule: "normalized electricity = attributable electricity in MJ / conforming finished-card mass in kg; multiply kWh by 3.6 before normalization"
      inputs:
        - "meter readings"
        - "excluded loads"
        - "allocation driver"
        - "output mass"
      output: "MJ per kg reference product"
      source_ids: []
    - id: calc_natural_gas_normalization
      applies_to: "natural_gas"
      rule: "normalized natural gas = attributable gas volume at declared reference conditions / conforming finished-card mass"
      inputs:
        - "reconciled gas volume"
        - "reference temperature and pressure"
        - "allocation driver"
        - "output mass"
      output: "m3 per kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "finished_magnetic_stripe_cards"
      rule: "output mass = accepted card count × lot-representative mean mass per accepted card"
      inputs:
        - "accepted count"
        - "sampled accepted-card masses"
      output: "kg conforming output"
      source_ids: []
    - id: calc_nonfuel_material_balance
      applies_to: "all non-fuel process materials and their outputs"
      rule: "unexplained balance = net PVC sheet + net stripe foil + net ink + net thermo-print-compatible gloss oil + net protective gloss oil + net isopropanol + net process water − conforming card output − PVC scrap − waste ink − spent isopropanol solution − cleaning wastewater − direct isopropanol to air − every other separately named non-fuel material output − net increase in work in progress; use the same period and kg basis, and do not subtract a constituent again after it is included in a mixed-waste mass"
      inputs:
        - "reconciled non-fuel input masses"
        - "output and waste masses"
        - "named direct material emissions"
        - "composition records"
        - "work-in-progress change"
      output: "dimensionally complete disclosed reconciliation result"
      source_ids: []
    - id: calc_isopropanol_balance
      applies_to: "isopropanol, spent_isopropanol_cleaning_solution, printing_cleaning_wastewater, isopropanol_to_air"
      rule: "unexplained isopropanol = net isopropanol input − recovered isopropanol − isopropanol in spent solution − isopropanol in wastewater − isopropanol retained in product or work in progress − destroyed isopropanol − isopropanol released to air; use constituent mass, not total mixed-stream mass"
      inputs:
        - "isopropanol issues and returns"
        - "formulation or analysis"
        - recovery
        - "waste-stream composition"
        - "control destruction"
        - "direct measurement"
      output: "kg isopropanol reconciliation"
      source_ids:
        - md-comar-26-11-19-18
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain the product specification and acceptance record linking the reported product to a physical magnetic-stripe card and disclosing any integrated circuit, substrate, dimensions, stripe specification, and personalization state."
      evidence: "approved specification; acceptance report; product label; classification review when combined technologies are present"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Use the same representative period for material, energy, conforming output, and scrap records; explain shutdowns, startup lots, abnormal rejects, and any period shorter than 12 months."
      evidence: "period reconciliation and exception log"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Cover all production lines, shifts, rework loops, quality rejects, printing and coating formulations, cleanup events, direct releases, liquid and solid wastes, thermal-fuel use and auxiliary loads inside the declared boundary; quantify excluded operations and justify any data gap."
      evidence: "line coverage matrix; meter map; material and solvent reconciliation; cleanup and waste logs; exclusion log"
    - id: dq_measurement
      applies_to: "mass and energy records"
      requirement: "Use calibrated or invoice-reconciled instruments and retain unit conversions, sampling records, and allocation workpapers."
      evidence: "calibration certificate; invoice reconciliation; sampling record; calculation file"
    - id: dq_upstream
      applies_to: "background datasets"
      requirement: "Match material form, recycled content, geography, technology, and reference period as closely as available; identify every proxy and sensitivity-critical mismatch."
      evidence: "dataset-selection log and supplier declarations"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow"
    rule: "Confirm that finished_magnetic_stripe_cards equals 1 kg after normalization and uses the declared factory-gate, unpackaged product state."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Confirm that each row denotes one concrete product, waste, or energy exchange; reject umbrella utility, material, packaging, waste, or emission labels."
    source_ids: []
  - rule_id: validate_uuid_identity
    applies_to: "UUID-bearing rows"
    rule: "Confirm flow type, classification, flow property, unit group, product state, and the row-specific use against the public state-100 TianGong record; leave unresolved identities blank rather than substituting proxies."
    source_ids: []
  - rule_id: validate_period_alignment
    applies_to: "foreground records"
    rule: "Confirm that material, solvent, water, fuel, electricity, product, waste and direct-emission quantities use the same site, lines, product scope, and accounting period."
    source_ids: []
  - rule_id: validate_mass_reconciliation
    applies_to: "non-fuel process materials and outputs"
    rule: "Perform the declared dimensionally complete non-fuel material balance and constituent isopropanol balance; disclose unresolved imbalance, composition assumptions, work-in-progress changes, recovery and internal recirculation."
    source_ids: []
  - rule_id: validate_conditional_routes
    applies_to: "printing cleanup and thermal supply"
    rule: "Require positive records or an explicit not-applicable justification for every conditional row. A solvent-free claim must be supported by formulation and issue records; a no-cleanup claim by operating records; and a no-natural-gas claim by energy-supply and burner records."
    source_ids:
      - md-comar-26-11-19-18
  - rule_id: validate_boundary_disclosure
    applies_to: "dataset metadata"
    rule: "Confirm disclosure of substrate, stripe specification, printing and curing route, personalization state, geography, period, scrap treatment, combined integrated-circuit features, and shipment-packaging exclusion."
    source_ids:
      - un-cpc-3-0-structure-2025
published_dataset_profile:
  dataset_role: "Foreground production dataset for magnetic-stripe cards"
  downstream_use: "secondary_dataset; background_dataset after independent review and publication readiness checks"
  allowed_use: "Cradle-to-gate product footprints and lifecycle models requiring a declared magnetic-stripe-card supply, when substrate, technology, geography, period, personalization state, and boundary are compatible"
  excluded_use: "Smart cards or integrated-circuit-card proxies; other magnetic media; card use or end-of-life without added downstream processes; packaged delivery without separately modelled packaging"
  required_metadata: "canonical PCR id; CPC reference; product specification; substrate and recycled content; dimensions and mean mass; stripe specification; blank/encoded/embossed/personalized state; print and curing technology; site geography; reference period; factory-gate and packaging boundary; allocation method; background dataset choices"
  required_quality_disclosure: "metering and mass-measurement coverage; count-to-mass sampling; material and solid-output reconciliation; shared-electricity allocation; data gaps and proxies; scrap contamination and treatment; unresolved UUID and range-evidence needs"
  update_trigger: "Change in substrate, stripe construction, printing or curing technology, personalization scope, site or electricity supply, recycled content, allocation method, product specification, or a material foreground intensity; otherwise review at least every three years"
