      collection_method: "use dedicated submeters where available; otherwise apply the declared shared-electricity allocation rule"
      unit: "kWh or MJ"
      frequency: "continuous or shift readings, aggregated monthly or by lot"
      temporal_coverage: "same period as product and material records"
      site_scope: "all equipment and auxiliaries inside the declared foreground boundary"
