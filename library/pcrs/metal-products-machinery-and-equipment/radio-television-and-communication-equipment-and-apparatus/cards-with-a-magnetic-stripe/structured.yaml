system_boundary:
  rules:
    - rule_id: boundary_foreground_operations
      applies_to: "foreground manufacturing"
      rule: "Include the actual printing and curing operations, stripe application, lamination, card punching or cutting, finishing, inspection, internal scrap handling, and only those hot-printing, encoding, embossing, or personalization operations completed before the declared factory gate."
      source_ids:
        - watchdata-cn103699921a
        - md-comar-26-11-19-18
    - rule_id: boundary_printing_route
      applies_to: "printing, curing and cleanup"
      rule: "For the representative screen-and-offset route, separately collect printing ink, each gloss-oil formulation, isopropanol used in fountain solution or cleanup, process water used in cleanup, waste ink, spent isopropanol solution, cleaning wastewater and direct isopropanol release. Mark solvent rows not applicable only for a documented solvent-free route; mark cleanup inputs and wastes not applicable only when records demonstrate that no onsite cleanup occurred. If another named solvent is used, add its specific product, waste and elementary-flow rows instead of a generic VOC row."
      source_ids:
        - watchdata-cn103699921a
        - md-comar-26-11-19-18
    - rule_id: boundary_thermal_route
      applies_to: "drying, curing and lamination heat"
      rule: "Record gaseous natural gas and direct fossil carbon dioxide only when onsite natural-gas combustion supplies thermal energy. Mark both rows not applicable for fully electric or externally supplied heat; when another onsite fuel is used, replace them with the exact fuel and measured or calculated direct species rather than a generic fuel or emissions row."
      source_ids:
        - md-comar-26-11-19-18
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased product and energy inputs"
      rule: "Link every purchased atomic input to a compatible upstream dataset; do not include upstream emissions again as direct foreground elementary flows."
      source_ids: []
    - rule_id: boundary_product_identity
      applies_to: "category inclusion and exclusions"
      rule: "Keep CPC 47910 magnetic-stripe cards distinct from smart cards and other magnetic media; disclose any combined magnetic-stripe/integrated-circuit feature for classification review."
      source_ids:
        - un-cpc-3-0-structure-2025
    - rule_id: boundary_packaging
      applies_to: "shipment packaging"
      rule: "Exclude shipment packaging from this unpackaged factory-gate reference product. If packaging is brought into a study boundary, add each packaging material as a separate atomic flow and report it outside the reference-product mass."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased card-grade PVC sheet, magnetic-stripe foil, printing ink, route-specific gloss oil, purchased electricity, and any actually used isopropanol, process water or gaseous natural gas delivered to the manufacturing site"
  starting_condition_role: "Upstream production is represented by supplier-specific or compatible background datasets; foreground collection begins when these inputs cross the site boundary"
  product_classification_scope: "Physical cards covered by CPC 3.0 subclass 47910, not CPC 47920 smart cards or CPC 47530 other unrecorded magnetic media"
  recursive_input_rule: "When an already formed magnetic-stripe card is purchased for site personalization, record it as the same-category product input, model only the added foreground operations, and do not recreate burdens already embodied in the upstream card dataset"
  upstream_dataset_requirement: "Use geographically, technologically, temporally, and materially representative datasets for each purchased input; disclose proxies and recycled-content assumptions"
  disclosure: "Declare substrate, stripe specification, printing/curing route, personalization state, production geography, reference period, rejected-product handling, and the exact factory-gate and packaging exclusions"
