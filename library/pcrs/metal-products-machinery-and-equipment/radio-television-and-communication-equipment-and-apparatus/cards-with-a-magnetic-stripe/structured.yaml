      raw_fields: "meter readings; reference temperature and pressure; product run time; allocation driver; carbon content; oxidation basis; captured carbon; measurement method"
      collection_method: "use dedicated fuel metering where available; otherwise allocate by documented burner operating time and load; calculate carbon dioxide only from attributable onsite fuel or use representative stack measurement"
      unit: "m3 natural gas and kg carbon dioxide"
      frequency: "continuous or shift records, aggregated monthly or by lot"
      temporal_coverage: "same period as product and material records"
      site_scope: "onsite drying, curing and lamination burners inside the declared boundary"
      aggregation_rule: "normalize fuel and direct carbon dioxide separately; exclude upstream supply and electricity-generation emissions"
