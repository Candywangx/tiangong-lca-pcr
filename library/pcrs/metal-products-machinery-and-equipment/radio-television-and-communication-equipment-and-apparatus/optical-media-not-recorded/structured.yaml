functional_unit:
  what: "Supply blank optical media capable of recording information in the declared format"
  how_much: "1 kg net accepted media; disclose equivalent disc count and aggregate nominal writable capacity"
  how_well: "Meet declared format and manufacturer acceptance criteria; ECMA-359 applies only to a conforming DVD-R model, not to every optical format"
  how_long_or_cycle: "One manufacturing delivery; no assumed archival lifetime, number of rewrites or user recording cycles"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: boundary_factory
      applies_to: "foreground system"
      rule: "Include attributable production, rejected and test-consumed discs, packing and site services. Link upstream manufacture, inbound transport and external waste treatment when constructing the cradle-to-gate result."
      source_ids:
        - wri-wbcsd-product-standard-2011
    - rule_id: boundary_partial
      applies_to: "downstream use"
      rule: "Exclude customer recording, reading, distribution after the factory gate and post-consumer treatment from this partial result; disclose the limitation and add separate scenarios for a whole-life assessment."
      source_ids:
        - wri-wbcsd-product-standard-2011
    - rule_id: boundary_route
      applies_to: "format instantiation"
      rule: "For rewritable media, document the actual phase-change alloy, each dielectric formulation and initialization step; for Blu-ray, document its actual recording and cover-layer technology. Add one concrete exchange per actual material or release, with no reuse of dye quantities across these routes."
      source_ids:
        - nist-sp-500-252-2003
        - cci-notes-19-1
    - rule_id: boundary_completeness
      applies_to: "site collection"
      rule: "Reconcile the full recipe, utilities ledger and waste register against the cards. Add actual coating additives, edge cleaners, gases, fuels, refrigerant losses, tooling amortization, cartridge parts and packaging components as separate exchanges where present. Missing data are not zero and small mass alone does not justify excluding thin functional layers."
      source_ids: []
    - rule_id: boundary_transfers
      applies_to: "outsourced and internal stages"
      rule: "Retain interstage counts in cp_output. Include subcontracted operations once; purchased semifinished substrates require their own upstream identity and replace only the operations already performed. Internal regrind and solvent recovery remain internal transfers with their processing burdens."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Receipt of specified substrate resin, supplied coating formulations, reflector feedstock and packaging at the manufacturing site"
  starting_condition_role: "Foreground entry state for a factory-gate partial life-cycle inventory"
  product_classification_scope: "Finished new unrecorded optical medium; upstream resin and chemical production are distinct product categories"
  recursive_input_rule: "If purchased blank media enter the same category, record their actual state and quantity with an upstream supplier dataset and model only subsequent operations; do not recreate their prior production or substitute them for virgin resin"
