allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared production"
    rule: "Prefer submetering and campaign subdivision. For unavoidable shared loads use a measured causal driver, such as machine time under matched loading; count allocation is justified only for equivalent products and routes."
    source_ids:
      - wri-wbcsd-product-standard-2011
  - rule_id: allocation_losses
    applies_to: "rejects and recycling"
    rule: "Keep yield losses with accepted output. Record external scrap transfers, their status and recycling convention; do not credit avoided virgin resin or silver without an explicitly justified model."
    source_ids:
      - wri-wbcsd-product-standard-2011
  - rule_id: allocation_reconcile
    applies_to: "allocation factors"
    rule: "Retain driver totals and assigned shares; allocated campaign quantities must reconcile to the original meter or ledger. Internal recovery is not a saleable co-product and creates no avoided-production credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "disc_manufacture"
      flow_role: "individual material inputs"
      record_type: "stock and dosing records"
      raw_fields: "material and formulation id; composition; receipts; opening and closing stock; external returns; internal recovery; issued mass; density; gas conditions"
      collection_method: "weigh issues and returns; reconcile with purchases; retain supplier specification"
      unit: "kg; original gas volume"
      frequency: "each lot and stock reconciliation"
      temporal_coverage: "full declared campaign series"
      site_scope: "each manufacturing line and outsourced step"
      aggregation_rule: "external consumption by material divided by accepted mass Q"
      quality_evidence: "calibrated scales; BOM; formulation sheet; reconciled ledger"
    - protocol_id: cp_bonding
      process_id: "disc_bonding"
      flow_role: "individual material inputs"
      record_type: "stock and dosing records"
      raw_fields: "material and formulation id; composition; receipts; opening and closing stock; external returns; internal recovery; issued mass; density; gas conditions"
      collection_method: "weigh issues and returns; reconcile with purchases; retain supplier specification"
      unit: "kg; original gas volume"
      frequency: "each lot and stock reconciliation"
      temporal_coverage: "full declared campaign series"
      site_scope: "each manufacturing line and outsourced step"
      aggregation_rule: "external consumption by material divided by accepted mass Q"
      quality_evidence: "calibrated scales; BOM; formulation sheet; reconciled ledger"
    - protocol_id: cp_lacquer
      process_id: "disc_lacquering"
      flow_role: "individual material inputs"
      record_type: "stock and dosing records"
      raw_fields: "material and formulation id; composition; receipts; opening and closing stock; external returns; internal recovery; issued mass; density; gas conditions"
      collection_method: "weigh issues and returns; reconcile with purchases; retain supplier specification"
      unit: "kg; original gas volume"
      frequency: "each lot and stock reconciliation"
      temporal_coverage: "full declared campaign series"
      site_scope: "each manufacturing line and outsourced step"
      aggregation_rule: "external consumption by material divided by accepted mass Q"
      quality_evidence: "calibrated scales; BOM; formulation sheet; reconciled ledger"
    - protocol_id: cp_energy
      process_id: "site_services"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "opening and closing meter; kWh; line runtime; standby; shared load; allocation driver"
      collection_method: "interval submetering and utility-bill reconciliation"
      unit: "kWh and MJ"
      frequency: "each meter interval and campaign"
      temporal_coverage: "same period as Q"
      site_scope: "site and production/support submeters"
      aggregation_rule: "attributable meter differences times 3.6 divided by Q"
      quality_evidence: "calibration; bill check; allocation calculation"
    - protocol_id: cp_water
      process_id: "site_services"
      flow_role: "make-up, blowdown and evaporation separately"
      record_type: "meters and water balance"
      raw_fields: "incoming mass or volume; density; blowdown; evaporation; drift; retained water; stock changes; composition; treatment destination"
      collection_method: "meter each boundary stream; close water balance"
      unit: "kg; original m3"
      frequency: "each campaign and discharge event"
      temporal_coverage: "same period as Q"
      site_scope: "attributable cooling and process-water systems"
      aggregation_rule: "each stream divided by Q; internal recirculation excluded"
      quality_evidence: "meter calibration; analysis; destination records; balance residual"
    - protocol_id: cp_waste
      process_id: "disc_manufacture"
      flow_role: "individual waste streams"
      record_type: "transfer and test records"
      raw_fields: "stream id; wet mass; polymer or solvent fraction; metal content; rejected count; internal recovery; destination"
      collection_method: "separate weighing and waste-composition records"
      unit: "kg and count"
      frequency: "each transfer and reject lot"
      temporal_coverage: "same period as Q"
      site_scope: "each generating line and external recipient"
      aggregation_rule: "total external stream mass divided by Q"
      quality_evidence: "weighing tickets; treatment contract; test log"
    - protocol_id: cp_releases
      process_id: "disc_manufacture"
      flow_role: "each named atmospheric species"
      record_type: "emission measurement or solvent balance"
      raw_fields: "species; formulation mass fraction; input; recovery; retained product and waste; abatement; release compartment"
      collection_method: "integrate concentration and exhaust volume or use species-resolved balance"
      unit: "kg per species"
      frequency: "each campaign with operating-state coverage"
      temporal_coverage: "same period as Q"
      site_scope: "coating and cleaning emission points"
      aggregation_rule: "direct post-abatement species mass divided by Q"
      quality_evidence: "method report; recovery records; detection limits; uncertainty"
    - protocol_id: cp_packaging
      process_id: "pack_release"
      flow_role: "box and spindle separately"
      record_type: "packing counts and tare"
      raw_fields: "component identity; polymer or fibre grade; issued count; component mass; returns; rejected packaging"
      collection_method: "count and representative component weighing"
      unit: "count and kg"
      frequency: "each packaging configuration and lot"
      temporal_coverage: "same period as Q"
      site_scope: "packing lines"
      aggregation_rule: "each component count times mean mass divided by Q"
      quality_evidence: "packing BOM; sampled tare; reconciliation"
    - protocol_id: cp_output
      process_id: "pack_release"
      flow_role: "reference product and yield"
      record_type: "production and acceptance records"
      raw_fields: "model; interstage counts; accepted count; net disc mass sample; rejects; destructive-test count; WIP changes; nominal capacity; specification"
      collection_method: "calibrated weighing, counters and documented optical acceptance testing"
      unit: "kg; count; declared capacity unit"
      frequency: "each production lot"
      temporal_coverage: "same period as inputs"
      site_scope: "every included production stage"
      aggregation_rule: "Q is accepted count times measured mean net mass, reconciled with stock"
      quality_evidence: "signed release; test results; tare check; counter and scale calibration"
  calculation_rules:
    - id: normalize
      applies_to: "all external exchanges"
      rule: "q_i = X_i / Q, where X_i is the allocated campaign exchange and Q is accepted net medium mass; Q must be positive"
      inputs:
        - cp_materials
        - cp_bonding
        - cp_lacquer
        - cp_energy
        - cp_water
        - cp_waste
        - cp_releases
        - cp_packaging
        - cp_output
      output: "exchange per 1 kg accepted media"
      source_ids: []
    - id: accepted_mass
      applies_to: "reference_product"
      rule: "Q = sum of accepted lot counts multiplied by their sampled mean net mass; exclude packaging and destructive-test discs"
      inputs:
        - cp_output
      output: "accepted kg and equivalent count"
      source_ids: []
    - id: material_consumption
      applies_to: "purchased materials"
      rule: "External consumption = opening stock + receipts - closing stock - external unused returns; account for WIP changes and internal transfers explicitly"
      inputs:
        - cp_materials
        - cp_bonding
        - cp_lacquer
        - cp_output
      output: "consumed material mass"
      source_ids: []
    - id: solvent_balance
      applies_to: "each solvent release"
      rule: "Release = solvent input - retained product - solvent in external waste - recovered solvent exported - solvent destroyed - inventory increase; internally recycled solvent cancels. Negative residuals trigger investigation."
      inputs:
        - cp_materials
        - cp_bonding
        - cp_lacquer
        - cp_releases
        - cp_waste
      output: "direct release of one solvent species"
      source_ids: []
    - id: yield_balance
      applies_to: "physical completeness"
      rule: "Reconcile incoming external material with accepted product, external rejects, recoverable output, emissions and stock changes; preserve separate polymer, reflector and solvent balances"
      inputs:
        - cp_materials
        - cp_bonding
        - cp_lacquer
        - cp_output
        - cp_waste
        - cp_releases
      output: "documented residual and investigation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all materials and media"
      requirement: "Preserve format, recording mechanism, composition, supply form and quality designation; supplier evidence must confirm the representative recipe applies"
      evidence: "BOM, specification and signed acceptance"
    - id: dq_coverage
      applies_to: "all stages"
      requirement: "Reconcile records with the process map; disclose unmeasured flows, missing suppliers, treatment coverage and estimates without turning blanks into zero"
      evidence: "completeness register and ledger checks"
    - id: dq_measurement
      applies_to: "normalized amounts"
      requirement: "Use common dates and product boundaries; disclose sampling, calibration, allocations, detection limits and uncertainty"
      evidence: "raw records and calculation workbook"
    - id: dq_range
      applies_to: "quantitative QA"
      requirement: "Assess results with plant balances and measurement uncertainty; this PCR supplies no empirical production interval or archival-lifetime default"
      evidence: "balance review and documented evidence gaps"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference object"
    rule: "Verify new unrecorded market state, all qualifiers and the link to reference_product; exclude recorded rejects from accepted output."
    source_ids:
      - un-cpc-3-0-structure-2025
      - ecma-359-2004
  - rule_id: validate_units
    applies_to: "inventory"
    rule: "Confirm positive Q, net-mass normalization, explicit unit conversions, and one material or species per exchange. A UUID cannot substitute for a missing quantity."
    source_ids: []
  - rule_id: validate_route
    applies_to: "process coverage"
    rule: "Every required process has collection evidence; every conditional process and card has a declared applicability decision. Alternate recording chemistries require complete instantiated BOM and emissions coverage."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "yields and releases"
    rule: "Check polymer, metal, solvent and water balances; investigate residuals using measured uncertainty and document the action. Do not force balance by creating an unnamed waste or emission."
    source_ids: []
  - rule_id: validate_conformance
    applies_to: "product quality"
    rule: "Retain applicable format tests, acceptance criteria and sampling basis. ECMA-359 conformance is a specification claim and does not supply an empirical inventory range."
    source_ids:
      - ecma-359-2004
  - rule_id: validate_boundary
    applies_to: "downstream dataset"
    rule: "Disclose the partial boundary, missing upstream links, treatment destinations and unresolved exchanges; claims of complete life-cycle coverage require the omitted stages."
    source_ids:
      - wri-wbcsd-product-standard-2011
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after dataset-specific review"
  downstream_use: "Supply of blank optical media to recording, distribution or storage-service models"
  allowed_use: "Format- and route-matched factory-gate production; linking to separately declared downstream scenarios"
  excluded_use: "Unqualified substitution for another recording technology, recorded-content production, drives, universal archive life or equal-service comparisons by mass alone"
  required_metadata: "PCR identity and version; reference qualifiers; site and dates; net mass/count conversion; process boundary; supplier and treatment links; packaging; allocation; collection methods"
  required_quality_disclosure: "Unresolved identities and amounts; missing stages; representativeness; measured versus calculated values; uncertainty; conformance evidence; review status"
  update_trigger: "Change of recording chemistry, format, functional layers, supplier, energy mix, yield, recovery, packaging, site or supporting specification"
