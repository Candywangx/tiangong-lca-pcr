  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
  unresolved_reference_flow_uuid: The actual single externally supplied dedicated part requires a direct-read identity; complete-capacitor identities are excluded.
  unresolved_inventory_uuids: Specific film, foil, bath chemistry, ceramic formulations, capacitor-grade tantalum, hardware, seals, wastes and most emissions require matching direct-read identities; only explicitly UUID-bearing cards have adopted identities.
  unresolved_provider_links: The actual supplier geography, technology, completed treatment and delivery conditions must be established for a concrete dataset; primary process sources do not establish upstream providers.
  unresolved_route_recipe_evidence: Actual chloride and forming baths, impregnation, ceramic binders and solvents, polymer cathodes, alloy and seal recipes require supplier/site evidence. Conditional cards are not default recipes.
  unresolved_part_gate_evidence: Except the bounded CBP film-precursor example, technical full-device charts do not establish commercial independent supply or classification membership of every intermediate; dataset requires customer drawing and delivered unfinished part evidence.
  unresolved_quantitative_ranges: No measured unit mass, yield, energy, emissions or empirical ranges are adopted; factory collection is mandatory.
  unresolved_source_access: TDK film technical PDF and web acquisition returned forbidden; WIMA original provides independent film-construction evidence. Polymer cathode route needs independent actual recipe evidence.
  identity_rejections:
    - Complete aluminum electrolytic capacitor flow has item count and finished-device scope; never use it as part reference.
    - Generic tantalum powder candidate declares particle size 1–5 mm and no capacitor-grade support; rejected for capacitor anode powder.
    - Formed anode foil candidate has inconsistent structural-products classification and underdescribed oxide state; not adopted.
    - Generic aluminum shell cannot establish the capacitor-specific interface; not adopted as part reference.
    - Grid delivery-service or source-specific incineration power cannot replace purchased user-side electricity.
