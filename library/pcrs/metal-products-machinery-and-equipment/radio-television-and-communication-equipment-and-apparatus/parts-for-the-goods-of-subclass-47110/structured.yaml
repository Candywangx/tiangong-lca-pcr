allocation_rules:
  - rule_id: subdivide
    applies_to: "shared_load"
    rule: "Prefer disjoint lot records and submetering. Allocate residual shared energy using measured machine time/load or another demonstrated physical driver; reconcile allocated totals to site readings."
    source_ids: []
  - rule_id: coproduct
    applies_to: "saleable_outputs"
    rule: "For a real co-product document the physical relationship; if unavailable justify another consistent relationship and sensitivity. Scrap sale does not itself establish avoided virgin-production credit."
    source_ids: []
  - rule_id: rework
    applies_to: "recovery"
    rule: "Internal returns retain extra processing burdens once and are not final waste. External recovery follows one disclosed method compatible with upstream datasets; no unrecorded substitution credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "each_applicable_route"
      flow_role: "one specific input at a time"
      record_type: "issue and stock records"
      raw_fields: "part/revision; recipe; source-state; supplier; issued; returned; stock change; composition/assay; lot"
      collection_method: "Calibrated weighing and supplier certificates; separate purchased composites from site-mixed constituents"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete declared period including setup and rework"
      site_scope: "defined factory and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing calibration, recipe and supplier-state records"
    - protocol_id: cp_output
      process_id: "release"
      flow_role: "reference output and internal transfers"
      record_type: "acceptance and delivery ledger"
      raw_fields: "part number/revision; completion-state; count; lot tare/net mass; measured mean mass; moisture/coating; rejects; work-in-progress stocks"
      collection_method: "Weigh each accepted lot on a calibrated scale, deduct packaging and tare, reconcile drawing/configuration and customer delivery; sample count-to-mass only with representative weighed samples"
      unit: "kg"
      frequency: "each lot and transfer"
      temporal_coverage: "same reporting period"
      site_scope: "production through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "customer drawing/interface, calibrated weights and acceptance/delivery evidence"
    - protocol_id: cp_energy
      process_id: "all_active_processes"
      flow_role: "each electricity, steam or fuel independently"
      record_type: "meter and energy ledger"
      raw_fields: "meter id; stage; interval; kWh; fuel amount/composition/NCV; steam enthalpy/pressure; shared driver; operation, idle and rework"
      collection_method: "Disjoint submeters and supplier bills; measured driver for shared residue; onsite generation separately identifies fuel and output"
      unit: "MJ"
      frequency: "each matched interval"
      temporal_coverage: "same period as output"
      site_scope: "actual factory delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, load study and supply-state records"
    - protocol_id: cp_water
      process_id: "each_water_using_route"
      flow_role: "specific supplied water"
      record_type: "meter record"
      raw_fields: "meter; supply grade; batch; quantity; density/temperature for volume conversion; recycle and discharge"
      collection_method: "Meter water supply and separate internal recycle; preserve actual volume-to-mass conversion"
      unit: "kg"
      frequency: "each interval"
      temporal_coverage: "same reporting period"
      site_scope: "route-specific meter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter and density records"
    - protocol_id: cp_waste
      process_id: "all_applicable_processes"
      flow_role: "one segregated waste stream"
      record_type: "waste and assay ledger"
      raw_fields: "identity; tare/gross/net; moisture; element/chemical assay; retained stocks; rework status; receiver and treatment"
      collection_method: "Segregated calibrated weighing and representative assay with destination receipt"
      unit: "kg"
      frequency: "each removal and representative assay"
      temporal_coverage: "same period including retained waste"
      site_scope: "route and external receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing, lab analysis and treatment receipt"
    - protocol_id: cp_emission
      process_id: "actual_release_points"
      flow_role: "one chemical species and compartment"
      record_type: "post-control monitoring or verified species model"
      raw_fields: "species; compartment; concentration; gas/liquid flow; time; production; capture; assay; detection limit; uncertainty; model conditions"
      collection_method: "Matched representative sampling after controls and fugitive assessment; preserve species-specific model evidence when measurement is unavailable"
      unit: "kg"
      frequency: "representative cycles and process changes"
      temporal_coverage: "cover complete reporting activity"
      site_scope: "identified stack/fugitive/direct-water boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling reports, detection limits, model validity and control logs"
    - protocol_id: cp_pack
      process_id: "release"
