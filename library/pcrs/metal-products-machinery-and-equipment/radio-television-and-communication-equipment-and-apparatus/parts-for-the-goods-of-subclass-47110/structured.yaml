  - rule_id: identity
    applies_to: "part_gate"
    rule: "Reject absent capacitor-specific interface, missing required qualifiers, undocumented external-part status or complete functional capacitors presented as parts."
    source_ids: []
  - rule_id: measurement
    applies_to: "all inventory"
    rule: "Require positive calibrated net accepted shipped mass for the exact configuration and period; verify every count/area conversion and each per-kg denominator, packaging exclusion and collection aggregation."
    source_ids: []
  - rule_id: make_buy
    applies_to: "upstream links"
    rule: "Check purchased processing states, upstream burdens once, internal-transfer cancellation and no duplicate embedded metal, binder, solvent or rubber. Completed steps and downstream completion must match delivered state."
    source_ids: []
  - rule_id: species
    applies_to: "chemical and waste rows"
    rule: "Verify specific flow identity, property/unit, species, moisture/assay and compartment. Captured dust/sludge is waste, not released emission. Assess bath gas and solvent/decomposition products individually; fuel carbon alone does not validate CO or NOx."
    source_ids: []
  - rule_id: coverage
    applies_to: "data package"
    rule: "Resolve every applicable conditional route with actual recipe and state. not_applicable requires absence evidence; unknown is incomplete. Report checks performed/skipped and unresolved provider/UUID/quantity gaps; no universal BOM or numeric default may close a gap."
