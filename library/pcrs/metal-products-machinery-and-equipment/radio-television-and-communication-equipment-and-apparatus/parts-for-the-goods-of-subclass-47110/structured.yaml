  classification_refs: "CPC 3.0: 47171, Parts for the goods of subclass 47110"
  covered_products: "One documented dedicated unfinished capacitor part at a stated supplier gate; route families described in section 1"
  excluded_products: "Complete functional capacitors; general-purpose raw stock; capacitor manufacturing machinery; unidentified general components"
  representative_product: "Aluminum-metallized polypropylene precursor wound element with zinc end contact, after stabilization and before downstream completion"
  production_route: "Select actual drawing-defined family and make/buy state; no combination of all family inventories"
  market_state: "Accepted dedicated part with declared moisture, coating, assembled content and deferred operations; net product mass excludes shipping packaging"
functional_unit:
  what: "Provide one specified intermediate capacitor part at its declared completion gate, not final capacitor service"
  how_much: "1 kg accepted net part mass of the same drawing, revision and delivered configuration"
  how_well: "Meet documented interface, geometry, grade, processing-state and appropriate acceptance tests; final-device ratings are not imputed"
  how_long_or_cycle: "One production and delivery lot; no use-phase lifetime assumption"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground"
      rule: "Include every actual operation from receipt of delivered inputs through accepted part release: preparation, mechanical forming, chemical/electrochemical treatment, joining, conditional thermal operations, testing, rework, utilities, controls and packing. Record performed and deferred steps separately."
      source_ids: []
    - rule_id: intermediate
      applies_to: "upstream"
      rule: "For each purchased film, foil, paste, compounded seal material or precursor, link a supplier dataset covering its actual state once; model only site transformations thereafter. For site-made material add actual raw inputs and process burdens instead."
      source_ids: []
    - rule_id: complete_device
      applies_to: "part_gate"
      rule: "Exclude subsequent capacitor completion and use from this part output. For the CBP precursor, cleaning, electrical clearing, internal assembly, can insertion, resin filling and final device tests are downstream unless actually performed before this part gate. A complete functional capacitor is a different reference category even if sold to another manufacturer."
      source_ids:
        - cbp-n355569-2025
    - rule_id: external_links
      applies_to: "life_cycle_links"
      rule: "Retain input transport and upstream production, external waste treatment and subsequent completion as explicit model links or disclosed gaps. A primary factory process dataset is not a complete cradle-to-gate footprint until upstream links are complete."
      source_ids: []
    - rule_id: route_extension
      applies_to: "actual_recipe"
      rule: "The cards are conditional specific route anchors, not an exhaustive industry recipe. Audit actual BOM, bath and gas formulation, bought utilities, packaging and treatment; add every other actual individual exchange. not_applicable requires evidence of absence; unknown is not zero."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "The actual delivered film, foil, ceramic material, tantalum input or dedicated hardware/compound of the selected part route"
  starting_condition_role: "Supplier-state boundary for foreground primary production records"
  product_classification_scope: "Only documented dedicated parts for electrical capacitors; classification label is context, not commercial-state evidence"
  recursive_input_rule: "Purchased same-category precursor uses its own processing-state supplier dataset once; expand only subsequent site steps, cancel paired internal transfers and never iterate indefinitely"
  upstream_dataset_requirement: "Match actual grade, formulation, completed treatment, delivery interface, geography and period; disclose substitutions, absent providers and uncertainty"
  disclosure: "Part drawing and interface; customer delivery evidence; route/state; make/buy table; inventory coverage; transport and treatment; allocation; uncertainty and all exclusions"
