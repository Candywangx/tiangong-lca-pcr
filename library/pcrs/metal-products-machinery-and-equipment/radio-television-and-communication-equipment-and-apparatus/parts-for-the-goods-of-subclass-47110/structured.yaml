measurement_rules:
  - id: net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh accepted shipped parts on a calibrated scale with container tare deducted; preserve the same part configuration and acceptance ledger. Lot mass includes only delivered product content, not packaging."
  - id: count_area
    applies_to: "count or area records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert accepted count using measured lot-specific mean net part mass and reconcile with weighed batch mass. For foil or film area use measured areal mass of that exact supplied state including coating; no assumed unit weight or density."
  - id: element_basis
    applies_to: "composition balances and emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Gross bath, paste, compound, dust and wet sludge mass differs from contained element or active solute. Preserve assays and moisture on every term; match chemical species and environmental compartment."
  - id: energy_basis
    applies_to: "electricity, steam and fuel"
    required_property_ref:
      name: "Delivered energy; fuel mass and mass-specific net calorific value"
      uuid: ""
    required_unit: "MJ; kg; MJ/kg"
    rule: "Preserve raw kWh for electricity and convert using 1 kWh = 3.6 MJ. Purchased steam uses delivered enthalpy with pressure and condensate-return state; fuel is recorded as kg and uses its own measured mass-specific net calorific value in MJ/kg for energy calculations, not steam output."
