      temporal_coverage: "complete representative campaign with start/end dates"
      site_scope: "declared site and equipment"
      aggregation_rule: "sum actual quantities then divide by same-campaign accepted net mass; document absent operations as not applicable"
      quality_evidence: "calibration; original logs; supporting tickets"
    - protocol_id: cp_lot
      process_id: "finish"
      flow_role: "unsealed_assembly; sealing_frit; getter_device; finished_tube; rejected_tube"
      record_type: "batch_record"
      raw_fields: "batch; model; count; net mass; issues and stocks; test results; waste destination"
      collection_method: "weighing; stores reconciliation; test logs"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete representative campaign with start/end dates"
      site_scope: "declared site and equipment"
      aggregation_rule: "sum actual quantities then divide by same-campaign accepted net mass; document absent operations as not applicable"
      quality_evidence: "calibration; original logs; supporting tickets"
    - protocol_id: cp_energy
      process_id: "finish"
      flow_role: "electricity"
      record_type: "meter_record"
      raw_fields: "equipment; timestamps; kWh; batch; occupancy; standby; allocation share"
      collection_method: "submeter readings; measured power and time for shared equipment"
      unit: "kWh"
      frequency: "each batch"
      temporal_coverage: "complete representative campaign with start/end dates"
      site_scope: "declared site and equipment"
      aggregation_rule: "sum actual quantities then divide by same-campaign accepted net mass; document absent operations as not applicable"
      quality_evidence: "calibration; original logs; supporting tickets"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "corrugated_box"
      record_type: "stores_record"
      raw_fields: "box grade; count; unit mass; dispatch batch; stock changes"
      collection_method: "weighing and dispatch reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete representative campaign with start/end dates"
      site_scope: "declared site and equipment"
      aggregation_rule: "sum actual quantities then divide by same-campaign accepted net mass; document absent operations as not applicable"
      quality_evidence: "calibration; original logs; supporting tickets"
  calculation_rules:
    - id: normalize
      applies_to: "all rows"
      rule: "q_i = sum(Q_i) / M_accepted"
      inputs:
        - "same-campaign measured exchange and accepted mass"
      output: "exchange per kg"
      source_ids: []
    - id: yield
      applies_to: "mass reconciliation"
      rule: "M_in + M_added = M_accepted + M_rejected + M_losses + delta_stock"
      inputs:
        - "campaign weighing and stock records"
      output: "reconciliation, not a universal yield factor"
      source_ids: []
  data_quality_requirements:
    - id: dq_sampling
      applies_to: "output and energy"
      requirement: "Cover startup, stable production, shutdown, ageing and rejects; do not select only best batches"
      evidence: "campaign logs and complete meter series"
    - id: dq_upstream
      applies_to: "unsealed assembly"
      requirement: "Supplier boundary must cover incorporated materials and preceding operations; model uncovered operations separately"
      evidence: "supplier process map, bill of materials and dataset boundary"
    - id: dq_ranges
      applies_to: "quantities"
      requirement: "Use foreground records; no external inferred range without synthesis of two independent, original-text-verified, boundary-compatible sources"
      evidence: "raw records and uncertainty disclosure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_flow"
    rule: "Reject a dataset without model, net mass, cathode/envelope state and test criteria; do not compare different functions using kg alone."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "inventory"
    rule: "Reconcile assembly intake, added retained solids, accepted tubes, rejected tubes, measured losses and stock change. Explain discrepancies using weighing uncertainty and rework records, not an invented tolerance."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "boundary"
    rule: "Require route applicability, upstream interfaces, meter coverage and destination evidence; unresolved flow identity is disclosed and never silently substituted by a proxy. Missing route-specific exchanges make completeness inconclusive."
    source_ids: []
