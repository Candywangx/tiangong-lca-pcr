allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_equipment"
    rule: "Use direct campaign meters first. Allocate shared vacuum and oven electricity by measured equipment power multiplied by occupied operating time, including attributable standby; document remaining shared services."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "accepted_output"
    rule: "Charge rejects and rework to accepted tube output; do not treat failed units as burden-free co-products. Internal reuse is an internal loop; exported recovery is a separate waste fate with no automatic avoided-production credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_rinse
      process_id: "rinse"
      flow_role: "rinse_water; rinse_wastewater"
      record_type: "water_meter; waste_transfer"
