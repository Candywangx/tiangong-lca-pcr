measurement_rules:
  - id: mu_net_mass
    applies_to: "Reference and intermediates"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh bare recorded carriers. Exclude cases, inserts, wrap and shipping boxes from the denominator; retain their masses as inputs."
  - id: mu_count_mass
    applies_to: "Count records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Multiply accepted copy count by measured representative bare-carrier mass; retain sampling/calibration records. Count each carrier in a multi-disc set."
  - id: mu_electricity
    applies_to: "Electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the audited energy property; exact conversion is 1 kWh = 3.6 MJ. Record grid, voltage, losses and handover boundary; purchased electricity is distinct from primary energy."
  - id: mu_water
    applies_to: "Make-up and discharge"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert volume only with a documented density and measurement conditions; never count circulating water repeatedly as external supply."
  - id: mu_formulations
    applies_to: "Ink, adhesive and gas"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Separate purchased formulation from active or cured solids. Record chemistry and curing state. Gas-volume conversion requires density at recorded temperature and pressure."
  - id: mu_tools
    applies_to: "Stamper and target service"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile weighed receipts, retirement and stock changes with service allocation. Raw metal alone does not represent a manufactured tool."
