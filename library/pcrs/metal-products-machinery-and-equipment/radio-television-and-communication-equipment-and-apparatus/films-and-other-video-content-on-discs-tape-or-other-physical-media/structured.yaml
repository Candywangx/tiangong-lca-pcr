allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These PCR bookkeeping rules use measured production records from section 8."
    source_ids: []
  - rule_id: al_subdivide
    applies_to: "shared_operations"
    rule: "Prefer separate lot meters. Allocate residual shared electricity by measured machine time multiplied by representative power and reconcile to the meter; sales revenue is not the default driver."
    source_ids: []
  - rule_id: al_edition
    applies_to: "edition_preparation"
    rule: "Spread physical-edition preparation over documented released copies in the actual campaign; reconcile repeat runs and revise the denominator. Do not assume unlimited future copies."
    source_ids: []
  - rule_id: al_tools
    applies_to: "stamper_service"
    rule: "Allocate finished-stamper manufacture and retirement by identified tool and actual service shots, including failed copies. Their burden remains with accepted output. Disclose provisional remaining service for tools still in use."
    source_ids: []
  - rule_id: al_rework
    applies_to: "internal_transfers"
    rule: "Keep rework energy and losses. Cancel internal DVD and clean-polycarbonate recirculation only in aggregate models, retaining reconciliation records. Only outgoing material is external waste."
    source_ids: []
  - rule_id: al_scrap
    applies_to: "recovered_material"
    rule: "Record actual waste transfers and treatment without automatic avoided-virgin-material credit. Any separate recycling-credit scenario requires explicit boundaries and no overlap with upstream credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_edition
      process_id: "edition_preparation"
      flow_role: "Edition electricity"
      record_type: "Meter and job log"
      raw_fields: "edition_id; job_id; meter_start; meter_end; preparation_hours; released_copies; campaign_id"
      collection_method: "Meter preparation workstation/server and attributable support energy; link jobs to the physical edition."
      unit: "kWh; h; copy"
      frequency: "Each job and campaign close"
      temporal_coverage: "Complete preparation campaign including revisions"
      site_scope: "Preparation site and contracted preparation supplier"
      aggregation_rule: "Sum attributable energy; apportion by documented released copies; normalize by M."
      quality_evidence: "Meter calibration; job reports; denominator reconciliation"
    - protocol_id: cp_disc
      process_id: "disc_production"
      flow_role: "Material, blank and intermediate records"
      record_type: "Lot bill, scales and QA log"
      raw_fields: "lot_id; route; recipe; grade; opening_stock; receipts; returns; closing_stock; accepted_count; rejected_count; sample_mass; rework_mass; transferred_mass"
      collection_method: "Weigh stock/consumption; count and sample-weigh carriers; identify formulations and supplied states."
      unit: "kg; copy"
      frequency: "Each lot and stock reconciliation"
      temporal_coverage: "All production including startup, rejects and rework in the declared period"
      site_scope: "Production line and supplier handovers"
      aggregation_rule: "Reconcile material use and accepted transfer by lot; normalize by final released net mass M."
      quality_evidence: "Scale checks; supplier specifications/SDS; test results; stock ledger"
    - protocol_id: cp_tools
      process_id: "disc_production"
      flow_role: "Stamper and target service"
      record_type: "Serialized tool ledger"
      raw_fields: "tool_id; material; received_mass; retired_mass; remaining_mass; shots_by_lot; recovered_mass; supplier"
      collection_method: "Weigh tools and identify lot service shots and target erosion."
      unit: "kg; shot"
      frequency: "Installation, service and retirement"
      temporal_coverage: "Actual tool campaign with remaining-service disclosure"
      site_scope: "Replication line and tool supplier"
      aggregation_rule: "Allocate stamper input/retirement consistently by service; reconcile target supply, retention and scrap."
      quality_evidence: "Tool identity; upstream boundary; scale and shot records"
    - protocol_id: cp_utilities
      process_id: "disc_production"
      flow_role: "Electricity, argon and water balances"
      record_type: "Meter, supplier and balance records"
      raw_fields: "meter_id; start; end; line_hours; gas_mass; temperature; pressure; density; water_makeup; blowdown; evaporative_loss; stock_change"
      collection_method: "Meter line electricity and fresh make-up; weigh gas or convert volume at documented conditions; close separate balances."
      unit: "kWh; kg; m3; h"
      frequency: "Each metered lot; period reconciliation"
      temporal_coverage: "Production, idle and auxiliaries throughout the period"
      site_scope: "Line including attributable cooling and compressed-air electricity"
      aggregation_rule: "Assign shared demand by measured drivers; exclude circulation; normalize each exchange separately."
      quality_evidence: "Calibrations; bills; balance residual explanation; reference conditions"
    - protocol_id: cp_waste
      process_id: "disc_production"
      flow_role: "Specific solid/liquid waste"
      record_type: "Segregated waste ledger"
      raw_fields: "stream_id; chemistry; contamination; mass; stock_change; receiver; treatment_route; transport_boundary"
      collection_method: "Weigh each distinct stream and reconcile transfers/storage; sample liquid composition as needed."
      unit: "kg"
      frequency: "Each transfer and period end"
      temporal_coverage: "Same production period adjusted for waste stocks"
      site_scope: "Site boundary and identified receiver"
      aggregation_rule: "Normalize each stream independently by M; distinguish waste treatment from direct releases."
      quality_evidence: "Transfer records; scale calibration; waste analysis; acceptance by receiver"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "Discs, packaging, dispatch and film trim"
      record_type: "Packing bill and release QA"
      raw_fields: "lot_id; incoming_disc_mass; released_count; net_mass_per_disc; component_mass; damaged_disc_mass; film_trim; stock_change; package_design"
      collection_method: "Weigh each component; count released carriers; reconcile transfers, rework and dispatch."
      unit: "kg; copy"
      frequency: "Each packing lot and dispatch release"
      temporal_coverage: "All attributable packing and rejects in the period"
      site_scope: "Packing line and dispatch gate"
      aggregation_rule: "Normalize components by bare-carrier M; route damaged discs to the disc reject/rework ledger once."
      quality_evidence: "Packaging specifications; calibrated samples; dispatch/stock reconciliation"
    - protocol_id: cp_pack_energy
      process_id: "packing"
      flow_role: "Packing electricity"
      record_type: "Submeter and line log"
      raw_fields: "meter_start; meter_end; runtime; standby; lot_id"
      collection_method: "Meter wrapping, sealing and packing including attributable standby."
      unit: "kWh; h"
      frequency: "Each lot or allocated meter interval"
      temporal_coverage: "Same packing period"
      site_scope: "Packing line"
      aggregation_rule: "Sum or allocate by measured energy drivers; divide by M."
      quality_evidence: "Calibration; line logs; reconciliation to purchased electricity"
  calculation_rules:
    - id: calc_net_output
      applies_to: "All rows"
      rule: "M = accepted released copy count × measured bare-carrier mass for one homogeneous edition; require M > 0."
      inputs:
        - cp_disc
        - cp_packing
      output: "Final net carrier mass M in kg"
      source_ids: []
    - id: calc_normalize
      applies_to: "External exchanges"
      rule: "q_i = attributable period quantity Q_i / M. Apply allocation before normalization. Reference product is exactly 1 kg by definition."
      inputs:
        - "Relevant protocol"
        - M
      output: "Exchange per 1 kg net carrier"
      source_ids: []
    - id: calc_stocks
      applies_to: "Material consumption"
      rule: "Q = opening stock + receipts - closing stock - unused supplier returns. Reconcile retained material, losses and waste; track internal recirculation separately."
      inputs:
        - cp_disc
        - cp_tools
        - cp_packing
        - cp_waste
      output: "Net input and material balance"
      source_ids: []
    - id: calc_transfer
      applies_to: "Internal DVD transfers"
      rule: "Transfer out = transfer in after documented inter-period inventory adjustment; count returned rework once."
      inputs:
        - cp_disc
        - cp_packing
      output: "Linked intermediate mass"
      source_ids: []
    - id: calc_energy
      applies_to: "Electricity"
      rule: "E_MJ = 3.6 × E_kWh; sum preparation, production and packing after checking meter-boundary overlap."
      inputs:
        - cp_edition
        - cp_utilities
        - cp_pack_energy
      output: "Purchased electricity MJ"
      source_ids: []
    - id: calc_tool_share
      applies_to: "Stamper"
      rule: "Lot tool share = tool burden × lot shots / documented total service shots. Disclose and update provisional remaining-service estimates."
      inputs:
        - cp_tools
      output: "Lot-attributable tool input/waste"
      source_ids: []
    - id: calc_water_balance
      applies_to: "Water and vapour"
      rule: "Make-up + opening stock = blowdown + evaporation + other measured departures + closing stock. Explain residuals with measurement uncertainty; do not assign them automatically to evaporation."
      inputs:
        - cp_utilities
        - cp_waste
      output: "Verified water balance and vapour"
      source_ids: []
    - id: calc_argon_balance
      applies_to: "Argon release"
      rule: "Purchased gas + opening stock - closing stock - unused returns = recovered gas + verified air release."
      inputs:
        - cp_utilities
      output: "Argon release by mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "Dataset identity"
      requirement: "Declare carrier, edition, route, handover states, period and original-content/downstream exclusions."
      evidence: "BOM; supplier boundaries; reference qualifiers"
    - id: dq_measurement
      applies_to: "All rows"
      requirement: "Separate measured, allocated and calculated quantities with uncertainty, calibration and missing-data treatment."
      evidence: "Protocol-linked records and calculation workbook"
    - id: dq_coverage
      applies_to: "Reporting period"
      requirement: "Cover the complete campaign or reporting period including startup and rejects; explain representativeness and extrapolation."
      evidence: "Campaign and meter coverage logs"
    - id: dq_readability
      applies_to: "Finished carriers"
      requirement: "Retain content-integrity, readability, compatibility and defect acceptance evidence; handling guidance does not establish a guaranteed lifetime."
      evidence: "Site QA; nist-sp-500-252-2003 sections 4–5"
    - id: dq_waste
      applies_to: "Waste and emissions"
      requirement: "Distinguish waste transfers from environmental releases; identify chemistry, receiver and compartment. Missing identity is not zero quantity."
      evidence: "Transfers; analyses; balances; release records"
    - id: dq_other_media
      applies_to: "Non-DVD routes"
      requirement: "Provide a complete carrier-specific exchange list and quality basis before applying these rules to tape, Blu-ray or Video-CD."
      evidence: "Actual carrier bill, recording route and acceptance tests"
validation_rules:
  - rule_id: val_identity
    applies_to: "reference_flow"
    rule: "Require all qualifiers, positive accepted net mass and a recorded-video good; blank and software media cannot be the final reference."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: val_route
    applies_to: "inventory"
    rule: "Check one route per lot; replication materials and complete blank supply cannot both represent the same carrier manufacture."
    source_ids:
      - nist-sp-500-252-2003
  - rule_id: val_rows
    applies_to: "flow_identity"
    rule: "Each row is one atomic exchange with correct type, physical state, property, unit and compartment. Keep blank UUIDs explicitly unresolved; no silent proxy substitution."
    source_ids: []
  - rule_id: val_records
    applies_to: "amounts"
    rule: "Require protocol-linked records, drivers, conversions and calculations. Reject unexplained negative quantities, missing conditional evidence and unsourced replacement defaults."
    source_ids: []
  - rule_id: val_balances
    applies_to: "balances"
    rule: "Reconcile copy counts, carrier and packaging mass, wastes, tool stocks, water/argon balances, transfers and meters against documented uncertainty; no universal percentage tolerance is prescribed."
    source_ids: []
  - rule_id: val_quality
    applies_to: "final_product"
    rule: "Require traceable content/readability tests and handling-damage records. Rejects and destroyed copies are excluded from saleable output."
    source_ids:
      - nist-sp-500-252-2003
  - rule_id: val_claims
    applies_to: "dataset_use"
    rule: "Disclose upstream coverage and excluded creative-production, distribution, use and end-of-life stages; prohibit viewing-service comparisons without compatible added modules."
    source_ids:
      - shehabi-video-streaming-2014
published_dataset_profile:
  dataset_role: "secondary_dataset for a documented site, edition and route; background_dataset only after independent representativeness and upstream-completeness review"
  downstream_use: "Physical-media supply modelling and separately assembled video-service lifecycle models"
  allowed_use: "Scaling for matching carrier, quality, route and supply boundary; explicit contribution to wider lifecycle models"
  excluded_use: "Undisclosed transfer to other carriers; complete film-production claims; comparisons per viewing hour without use data; blank/software substitution"
  required_metadata: "Reference qualifiers; supplier/site geography; dates; route; BOM; mass/count; boundaries; protocols; allocation; waste destinations; background links"
  required_quality_disclosure: "Uncertainty, extrapolation, missing records, unresolved identities, absent external ranges, test acceptance, balance residuals and upstream completeness"
  update_trigger: "Carrier/layer or packaging redesign; new chemistry; route/supplier/grid changes; campaign-denominator revision; material QA or yield change"
