product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.radio-television-and-communication-equipment-and-apparatus.films-and-other-video-content-on-discs-tape-or-other-physical-media"
  classification_refs: "CPC 3.0: 47620; classification context only"
  covered_products: "Physical carriers containing recorded films or other video content, supplied as goods"
  excluded_products: "Blank media; audio-only media; software; players; online video; retail/reproduction services; originals sold with all property rights"
  representative_product: "Saleable single-sided, single-layer DVD-Video of one declared edition"
  production_route: "Physical-edition preparation; replication with a purchased stamper or conditional DVD-R recording; verification; packing"
  market_state: "Finished readable recorded carrier at producer dispatch gate; packaging separately measured"
functional_unit:
  what: "Supply the declared video edition on a readable physical carrier at the producer gate"
  how_much: "1 kg net recorded carrier; also report corresponding copy count and playable content duration"
  how_well: "Correct complete edition and language; declared format, compatibility and quality acceptance tests passed"
  how_long_or_cycle: "One production and release cycle; no assumed viewing count or archival lifetime"
  reference_flow_link: "reference_video_dvd"
system_boundary:
  rules:
    - rule_id: sb_identity
      applies_to: "product_scope"
      rule: "Apply the goods boundary and exclusions in sections 1–2; originals with all rights and reproduction services have distinct category identities."
      source_ids:
        - un-cpc-3-0-explanatory-notes-2025
    - rule_id: sb_routes
      applies_to: "disc_production"
      rule: "Include molding, metallization and bonding for replication. Complete blank DVD-R supply instead requires writing/finalization and upstream blank-media manufacture; do not duplicate its embedded resin, metal or adhesive as foreground inputs."
      source_ids:
        - nist-sp-500-252-2003
    - rule_id: sb_operations
      applies_to: "site_operations"
      rule: "Include attributable edition preparation, test runs, rejects, rework, standby, line support and packing according to section 8 protocols."
      source_ids: []
    - rule_id: sb_stamper
      applies_to: "purchased_tools"
      rule: "Include the purchased finished stamper's upstream manufacture. Onsite mastering/electroforming instead requires a measured extension covering the actual glass-master, photoresist, plating, rinse and species-specific discharge exchanges, replacing the purchased-stamper operation."
      source_ids: []
    - rule_id: sb_complete
      applies_to: "route_instantiation"
      rule: "Confirm every inclusion_condition by recipe, meter or waste record. Add separate atomic exchanges for actual additional chemicals, fuels, refrigerant losses, transport and treatment; absence from this representative list never proves zero use."
      source_ids: []
    - rule_id: sb_supply
      applies_to: "upstream_links"
      rule: "Include inbound transport and offsite treatment through matched supplier/route datasets and check overlap. Onsite treatment needs its own measured inventory; a waste transfer is not an elementary emission."
      source_ids:
        - us-epa-life-cycle-cd-dvd
    - rule_id: sb_claims
      applies_to: "downstream_use"
      rule: "Label results as physical-copy production data. Do not infer total video-service impacts, comparative streaming benefits or viewing lifetime without compatible additional modules."
      source_ids:
        - shehabi-video-streaming-2014
boundary_abstraction:
  declared_starting_condition: "Existing authorized edited video master; purchased materials and finished stampers for replication, or complete purchased blank DVD-R for duplication"
  starting_condition_role: "Foreground handover for physical-copy production; not proof of zero upstream burden"
  product_classification_scope: "Recorded-video physical goods; a separate service identity does not exclude that service's manufacturing operations from producing the good"
  recursive_input_rule: "Expand purchased inputs through matching upstream datasets. Do not recursively treat the finished edition as its own input. Link internal transfers once and cancel only on aggregation."
  upstream_dataset_requirement: "Link material, finished-stamper, blank-media, packaging, energy and offsite-treatment supply chains at their actual handover states; disclose time, geography, technology and completeness. Purchased blanks replace embedded carrier manufacturing, not recording."
  disclosure: "Distinguish foreground and upstream coverage. Film origination, casting, shooting, creative editing and rights acquisition are outside this physical-copy module; complete content-product claims require a separately justified contribution. Post-dispatch distribution, playback and postconsumer treatment require additional modules."
