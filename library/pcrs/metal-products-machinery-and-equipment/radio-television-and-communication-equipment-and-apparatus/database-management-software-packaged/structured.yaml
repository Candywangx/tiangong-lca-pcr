system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "Foreground software production"
      rule: "Include development, build, test, security scanning, release preparation, allocated electricity, and allocated computer hardware that significantly support the declared release. Include immediate retail-package assembly only when physical components occur in the declared product configuration. Include optical-carrier recording only for the in-house recording route."
      source_ids:
        - green-software-foundation-sci-1-1-0
    - rule_id: boundary_rule_2
      applies_to: "Product-category separation"
      rule: "Model only the finished packaged DBMS product defined by its storage, modification, and extraction functions. Do not relabel download-only software, on-line software, licensing services, another software subclass, or a release-candidate intermediate as the reference product."
      source_ids:
        - un-cpc-3-0-47813-detail
    - rule_id: boundary_rule_3
      applies_to: "Downstream stages"
      rule: "Exclude distribution beyond the declared gate, installation, operation, maintenance, user devices, data-centre operation, and end-of-life from this production dataset. If any are added for a study, report them as separate modules with a declared workload-based functional unit and infrastructure boundary."
      source_ids:
        - green-software-foundation-sci-1-1-0
    - rule_id: boundary_rule_4
      applies_to: "Optical-carrier supply"
      rule: "When an optical carrier is included, select exactly one route. The purchased-recorded route records the finished recorded carrier as a product input and treats recording as upstream. The in-house route records blank optical media, foreground recording electricity, every other actual recording consumable, and every actual recording waste; it shall not also record a purchased recorded carrier."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Publisher-controlled source code, third-party software components, build instructions, release requirements, and the declared physical packaging bill of materials before foreground development and release activities"
  starting_condition_role: "Starting condition for foreground software production and conditional physical package assembly"
  product_classification_scope: "Published packaged database-management system software whose essential function is storing, modifying, and extracting database information"
  recursive_input_rule: "A purchased or transferred finished product already in this same packaged-DBMS category shall be recorded as an upstream product input with a separate conforming dataset; its production shall not be re-expanded inside the current foreground process"
  upstream_dataset_requirement: "Use geographically and temporally representative upstream datasets for electricity, computer hardware, purchased recorded media, blank optical media, paper boxes, printed paper inserts, and polypropylene cases that cross the foreground boundary"
  disclosure: "Declare the software components included, release version, accepted output mass, development and build period, infrastructure boundary, hardware allocation parameters, delivery configuration, selected carrier-supply route, package bill of materials, geography, data gaps, and every excluded lifecycle stage"
