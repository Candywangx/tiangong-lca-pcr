allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Separately metered release activities"
    rule: "Avoid allocation by separating release-specific build jobs, test runs, scanning jobs, carrier-recording batches, packaging batches, and accepted output records whenever possible."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_rule_2
    applies_to: "Shared electricity"
    rule: "Allocate shared metered or telemetry-derived electricity with a causal activity driver measured over the same period, such as job runtime multiplied by reserved compute resources. Disclose the driver and do not use revenue allocation when causal data are available."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_rule_3
    applies_to: "Shared computer hardware"
    rule: "Allocate installed rack-server and workstation mass by time share multiplied by resource share: allocated mass = installed mass × time reserved / expected life × resources reserved / total resources. Use the same component boundary and reference flow across aggregated components."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: allocation_rule_4
    applies_to: "Rejected packaging and products"
    rule: "Attribute measured rejected carrier and package materials to the production batch that generated them. A rejected item remains part of consumed product input and shall not be subtracted from that input. Record every actual material waste as a separate atomic outgoing exchange; do not subtract recyclable waste without recording that exchange and the chosen end-of-life allocation convention."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_electricity_records
      process_id: "software_production_release"
      flow_role: "electricity_software_production"
      record_type: "Meter or telemetry records linked to release activities and the selected carrier route"
      raw_fields: "meter_id, component_id, activity_id, activity_type, carrier_route, release_id, start_time, end_time, electricity_kwh, reserved_resource_quantity, accepted_output_kg"
      collection_method: "Export facility meters, cloud or device telemetry, and build-pipeline logs; reconcile time zones, remove duplicate intervals, and tag carrier-recording intervals separately"
      unit: "kWh and kg"
      frequency: "Per job or at the finest available interval, aggregated per release and activity type"
      temporal_coverage: "Full declared development, build, test, scan, release, and packaging period, plus carrier-recording periods only for the in-house route"
      site_scope: "All publisher-controlled and contracted foreground sites included in the release"
      aggregation_rule: "Sum non-overlapping kWh, include tagged carrier-recording kWh only for the in-house route, allocate shared intervals with the declared causal driver, convert to MJ, and divide by accepted output kg"
      quality_evidence: "Meter calibration or provider statement, raw export, pipeline-log link, carrier-route record, interval reconciliation, allocation worksheet"
    - protocol_id: cp_hardware_allocation_records
      process_id: "software_production_release"
      flow_role: "rack_server_computer; desktop_workstation_computer"
      record_type: "Hardware asset and reservation records"
      raw_fields: "asset_id, hardware_type, installed_mass_kg, installation_date, expected_retirement_date, release_id, time_reserved, resources_reserved, total_resources"
      collection_method: "Reconcile asset register, supplier mass specification, scheduler reservation logs, and release records"
      unit: "kg, hours, and consistent resource units"
      frequency: "At each asset change and reservation interval, aggregated per release"
      temporal_coverage: "Full installed life estimate and all reservation intervals for the declared release"
      site_scope: "Every foreground computing asset with a significant reserved share"
      aggregation_rule: "Calculate time share and resource share per asset, multiply by installed mass, sum by hardware type, and divide by accepted output kg"
      quality_evidence: "Asset-register extract, supplier specification, scheduler log, expected-life basis, allocation worksheet"
    - protocol_id: cp_physical_package_bom
      process_id: "software_production_release"
      flow_role: "recorded_optical_disc; blank_optical_media; paper_box; paper_insert; polypropylene_disc_case"
      record_type: "Carrier-route declaration, bill of materials, receiving, stock, batch issue, waste, and accepted-output mass records"
      raw_fields: "carrier_route, component_id, material_description, supplier, batch_id, received_mass_kg, opening_stock_mass_kg, issued_mass_kg, unused_returned_mass_kg, retained_in_accepted_output_mass_kg, outgoing_waste_flow_id, outgoing_waste_mass_kg, closing_stock_mass_kg, accepted_output_kg"
      collection_method: "Confirm that purchased-recorded and in-house-recording routes are mutually exclusive, then reconcile purchase and receiving records with stock movements, batch scales, separate atomic waste records, and the approved package bill of materials"
      unit: "kg"
      frequency: "Per carrier-recording or packaging batch"
      temporal_coverage: "All batches supplying the declared release and reporting period"
      site_scope: "Every foreground or contracted physical-package assembly site"
      aggregation_rule: "Consumed input mass = issued mass minus genuinely unused mass returned to usable stock; do not subtract rejected mass. Divide consumed input by accepted output kg. Reconcile net input crossing the boundary = retained accepted-output mass + separately recorded outgoing waste mass + closing stock minus opening stock."
      quality_evidence: "Carrier-route approval, calibrated-scale record, approved bill of materials, supplier specification, stock ledger, batch reconciliation, and separately identified waste records"
    - protocol_id: cp_output_mass_acceptance
      process_id: "software_production_release"
      flow_role: "packaged_dbms_output"
      record_type: "Release acceptance and finished-product mass records"
      raw_fields: "release_id, version, edition, platform, licence_scope, acceptance_test_id, delivery_configuration, unit_count, gross_mass_kg, rejected_mass_kg, gate, acceptance_date"
      collection_method: "Link signed release acceptance to calibrated gross-mass measurements of accepted distribution units"
      unit: "kg"
      frequency: "Each accepted release and packaging batch"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "All sites producing accepted reference product"
      aggregation_rule: "Sum accepted gross mass only; use it as the denominator for normalization to 1 kg"
      quality_evidence: "Signed acceptance record, test report, scale calibration, batch identifier, package bill of materials"
  calculation_rules:
    - id: calc_electricity_mj
      applies_to: "electricity_software_production"
      rule: "Allocated electricity MJ per kg = sum of allocated electricity kWh × 3.6 / accepted output kg"
      inputs:
        - "Non-overlapping kWh intervals"
        - "causal allocation driver"
        - "accepted output kg"
      output: "MJ electricity per kg reference product"
      source_ids:
        - green-software-foundation-sci-1-1-0
    - id: calc_hardware_mass
      applies_to: "rack_server_computer; desktop_workstation_computer"
      rule: "Allocated hardware kg per kg output = sum of installed mass kg × time reserved / expected life × resources reserved / total resources / accepted output kg"
      inputs:
        - "Installed mass"
        - "reserved time"
        - "expected life"
        - "reserved resources"
        - "total resources"
        - "accepted output kg"
      output: "Allocated hardware kg per kg reference product"
      source_ids:
        - green-software-foundation-sci-1-1-0
    - id: calc_package_component_mass
      applies_to: "recorded_optical_disc; blank_optical_media; paper_box; paper_insert; polypropylene_disc_case"
      rule: "Consumed component kg per kg output = issued mass minus genuinely unused mass returned to usable stock, divided by accepted output kg; rejected material remains in consumed input and is also recorded as its own outgoing waste exchange"
      inputs:
        - "Selected carrier route"
        - "issued mass"
        - "unused returned mass"
        - "retained accepted-output mass"
        - "separate outgoing waste masses"
        - "opening and closing stock"
        - "and accepted-output mass"
      output: "Consumed component kg per kg reference product plus a reconciled material balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Preserve the exact DBMS version, edition, supported platform, licence scope, database functions, workload acceptance criteria, delivery configuration, and production gate."
      evidence: "Release manifest, signed acceptance test, licence specification, product description"
    - id: dq_temporal
      applies_to: "Electricity, hardware, and output records"
      requirement: "Use activity and asset records that cover the full declared release-production period; retain the finest available temporal granularity and identify annual data as the minimum-granularity fallback."
      evidence: "Raw telemetry, meter export, asset register, reporting-period reconciliation"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Reconcile all significant build, test, scan, release, recording, and packaging components in the declared software boundary; explain excluded sites, components, and data gaps."
      evidence: "Boundary register, pipeline inventory, package bill of materials, completeness reconciliation"
    - id: dq_measurement
      applies_to: "Mass and electricity"
      requirement: "Use calibrated mass measurements or supplier specifications and traceable meter or provider records; retain conversion and allocation worksheets."
      evidence: "Calibration record, supplier specification, provider statement, calculation workbook"
    - id: dq_conditional_route
      applies_to: "Physical carrier and package rows"
      requirement: "For every conditional component, record either measured use or documented absence for the declared delivery configuration."
      evidence: "Approved bill of materials, product photograph or configuration record, batch issue record"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Product identity"
    rule: "Fail validation when the reference product is not the accepted finished CPC 47813 DBMS flow, when a release-candidate intermediate is substituted, or when required version, platform, licence, function, workload, delivery, geography, time, or gate qualifiers are missing."
    source_ids:
      - un-cpc-3-0-47813-detail
  - rule_id: validation_rule_2
    applies_to: "Inventory completeness"
    rule: "Require exactly one reference output row and require each input to be one concrete electricity, hardware, carrier, or package exchange. Reject umbrella utility, hardware, packaging, waste, or emissions rows."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "Electricity"
    rule: "Confirm that electricity intervals cover the declared foreground period, reserved or provisioned hardware is included, duplicate intervals are removed, the allocation driver is disclosed, and kWh-to-MJ conversion is correct."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: validation_rule_4
    applies_to: "Hardware allocation"
    rule: "Confirm positive expected life and total resources, non-negative reserved time and resources, time share and resource share not greater than one unless explicitly justified, and the stated allocation formula for each asset."
    source_ids:
      - green-software-foundation-sci-1-1-0
  - rule_id: validation_rule_5
    applies_to: "Physical package configuration"
    rule: "Require a measured amount or documented absence for each carrier and package row; do not infer an absent component from a zero or blank record. If an optical carrier is present, require exactly one route: purchased recorded carrier with no foreground recording, or blank optical media with foreground recording electricity, every actual additional consumable, and every actual recording waste."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "Normalization and sources"
    rule: "Confirm that all amounts use the same accepted-output denominator, the reference output equals exactly 1 kg, source ids resolve, unresolved UUIDs remain blank, and no unsupported empirical range is introduced."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "Package-material balance"
    rule: "For each carrier and package material, confirm that input consumption includes rejected material, every actual waste is a separate atomic outgoing exchange, and net input equals retained accepted-output mass plus outgoing waste plus closing stock minus opening stock. Fail validation when rejected material disappears through subtraction from product input."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for finished packaged database-management software"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon-footprint and LCA models that need a mass-based packaged-DBMS production input at a declared publisher or packaging gate; comparative use only when function, release, licence, workload, delivery configuration, geography, time, boundary, and data quality are equivalent"
  excluded_use: "Download-only or on-line software; licensing service without the packaged product; custom software development; post-gate operation or maintenance; another software subclass; comparisons based only on product mass when functional capability differs"
  required_metadata: "Canonical PCR id; product UUID; version and edition; supported platform; licence scope; database functions and workload; support term; carrier and package configuration; accepted output mass; production route; sites; geography; reporting period; boundary; allocation methods; source ids"
  required_quality_disclosure: "Meter and telemetry coverage; hardware asset and allocation coverage; package bill-of-material reconciliation; output mass and acceptance evidence; temporal granularity; supplier-data quality; exclusions; unresolved UUIDs; missing range evidence; uncertainty and data gaps"
  update_trigger: "New release or edition; material architecture or build-pipeline change; changed hardware allocation; changed physical carrier or package; site or grid change; licence or workload change; improved UUID identity; new independent range evidence; source or method revision"
