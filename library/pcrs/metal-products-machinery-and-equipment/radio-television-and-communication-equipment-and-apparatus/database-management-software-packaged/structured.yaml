measurement_rules:
  - id: reference_mass_basis
    applies_to: "Reference product and physical package components"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted finished distribution units and all included immediate carrier, case, insert, and retail-box components. Exclude shipping cartons and pallets beyond the declared gate. Normalize all production exchanges by accepted gross product mass to exactly 1 kg."
