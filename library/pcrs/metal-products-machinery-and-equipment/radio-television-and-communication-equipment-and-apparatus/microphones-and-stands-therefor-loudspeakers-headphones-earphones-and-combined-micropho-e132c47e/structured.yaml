      source_ids:
        - ec-environmental-footprint-2021
    - rule_id: sb_waste
      applies_to: "waste_boundary"
      rule: "Record production waste at the handover point and link appropriate treatment; distinguish waste disposal from saleable coproducts and from internal rework. Retain component separation information for downstream recovery."
      source_ids:
        - genelec-recycling-materials
    - rule_id: sb_double_count
      applies_to: "upstream_and_direct_flows"
      rule: "Keep background supply emissions in their linked datasets; add only measured or calculated site emissions to foreground elementary flows. Keep upstream, factory-test and customer-use electricity separate."
      source_ids:
        - ec-environmental-footprint-2021
