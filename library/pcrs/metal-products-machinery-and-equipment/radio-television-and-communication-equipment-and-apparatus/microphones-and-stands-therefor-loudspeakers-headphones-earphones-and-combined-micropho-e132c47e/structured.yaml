allocation_rules:
  - rule_id: al_hierarchy
    applies_to: "shared_operations"
    rule: "First assess subdivision or system expansion; otherwise use a demonstrated causal physical relationship, and document any fallback economic allocation and sensitivity."
    source_ids:
      - ec-environmental-footprint-2021
  - rule_id: al_metering
    applies_to: "shared_electricity"
    rule: "Under cp_energy_assembly; cp_energy_test_pack, assign shared electricity with measured machine power-time or another validated causal driver; unit counts alone require evidence that the models impose equal loads. Reconcile allocated totals to the meter."
    source_ids: []
  - rule_id: al_rework
    applies_to: "rejects_and_recovery"
    rule: "Under cp_release and cp_waste_assembly; cp_waste_test_pack, retain failed-test and rework burdens in the campaign denominator of good output. Report recovery separately; do not credit full avoided virgin production merely because scrap has a sale price."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_assembly
      process_id: "assembly"
      flow_role: "components and packaging"
      record_type: "supplier records and weighing"
      raw_fields: "model; batch; supplier part; material composition; unit count; sample unit masses; issued/returned mass; opening/closing stock; moisture; assembly boundary"
      collection_method: "Reconcile store issues and returns with calibrated weighing and BOM revision"
      unit: "kg; units; m"
      frequency: "each batch and each supplier/design change"
      temporal_coverage: "one declared representative production period including normal starts and rework"
      site_scope: "actual assembly site and named suppliers"
      aggregation_rule: "Net consumption by component divided by M_good; retain losses separately"
      quality_evidence: "calibration; scale resolution; sample coverage; supplier declarations; signed stock reconciliation"
    - protocol_id: cp_bom_test_pack
      process_id: "test_pack"
      flow_role: "components and packaging"
      record_type: "supplier records and weighing"
      raw_fields: "model; batch; supplier part; material composition; unit count; sample unit masses; issued/returned mass; opening/closing stock; moisture; assembly boundary"
      collection_method: "Reconcile store issues and returns with calibrated weighing and BOM revision"
      unit: "kg; units; m"
      frequency: "each batch and each supplier/design change"
      temporal_coverage: "one declared representative production period including normal starts and rework"
      site_scope: "actual assembly site and named suppliers"
      aggregation_rule: "Net consumption by component divided by M_good; retain losses separately"
      quality_evidence: "calibration; scale resolution; sample coverage; supplier declarations; signed stock reconciliation"
    - protocol_id: cp_energy_assembly
      process_id: "assembly"
      flow_role: "electricity"
      record_type: "submeter and equipment log"
      raw_fields: "meter id; boundary; start/end kWh; time; idle state; active/standby power; test duration; rework time; model throughput; allocation driver"
      collection_method: "Submeter both processes; validate any power-time fallback against metering"
      unit: "kWh; W; h"
      frequency: "each campaign; timestamped test logs"
      temporal_coverage: "same period as released product"
      site_scope: "assembly, extraction and test stations; documented shared facility load"
      aggregation_rule: "Convert kWh to MJ; reconcile process totals and allocated shared load to site meters; divide by M_good"
      quality_evidence: "meter calibration; timestamp checks; allocation driver validation"
    - protocol_id: cp_energy_test_pack
      process_id: "test_pack"
      flow_role: "electricity"
      record_type: "submeter and equipment log"
      raw_fields: "meter id; boundary; start/end kWh; time; idle state; active/standby power; test duration; rework time; model throughput; allocation driver"
      collection_method: "Submeter both processes; validate any power-time fallback against metering"
      unit: "kWh; W; h"
      frequency: "each campaign; timestamped test logs"
      temporal_coverage: "same period as released product"
      site_scope: "assembly, extraction and test stations; documented shared facility load"
      aggregation_rule: "Convert kWh to MJ; reconcile process totals and allocated shared load to site meters; divide by M_good"
      quality_evidence: "meter calibration; timestamp checks; allocation driver validation"
    - protocol_id: cp_transfer
      process_id: "assembly"
      flow_role: "internal loudspeaker transfer"
      record_type: "batch transfer and WIP register"
      raw_fields: "batch id; unit count; sampled mass; transfer time; opening/closing WIP; rework route"
      collection_method: "Match output and input transfer slips and physically reconcile WIP"
      unit: "kg; units"
      frequency: "each transfer"
      temporal_coverage: "same inventory period"
      site_scope: "paired sending/receiving stations"
      aggregation_rule: "Link equal transferred masses; account for period-boundary WIP; eliminate internal links from consolidated totals"
      quality_evidence: "signed transfer records; WIP checks"
    - protocol_id: cp_release
      process_id: "test_pack"
      flow_role: "reference product and performance"
      record_type: "acceptance tests and release register"
      raw_fields: "serial/model; signal; impedance; bandwidth; sensitivity; distortion; test level; distance; environment; calibration; pass/fail; retest; released count; net unit mass; included accessories"
      collection_method: "Use documented model acceptance procedure and calibrated tests; weigh saleable product without packaging"
      unit: "kg; units; declared test units"
      frequency: "each released lot; test frequency specified by actual acceptance plan"
