validation_rules:
  - rule_id: val_identity
    applies_to: "reference_definition"
    rule: "All required qualifiers, a specific product object and a net unit mass are mandatory. Class membership and a general audio-equipment label do not prove flow identity or functional equivalence."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: val_trace
    applies_to: "inventory"
    rule: "Every active row must have raw records, amount basis, compatible property/unit and exactly one atomic exchange. A missing value differs from measured zero or documented non-applicability."
    source_ids: []
  - rule_id: val_balance
    applies_to: "mass_and_internal_links"
    rule: "Reconcile cp_transfer output/input by batch and period. Investigate nonzero mass residuals against weighing uncertainty and inventory changes; never force balance by adjusting good output. Packaging travels outside net product mass."
    source_ids: []
  - rule_id: val_energy
    applies_to: "factory_test"
    rule: "Verify disjoint assembly/test meters, kWh conversion, test duration and rework. Reject estimates obtained by multiplying rated acoustic or amplifier output watts by time without a validated electrical-input model."
    source_ids: []
  - rule_id: val_performance
    applies_to: "test_pack"
    rule: "Retain measured physical response and model-specific acceptance criteria under cp_release; scope-level IEC evidence does not establish conformity to unexamined clauses."
    source_ids:
      - iec-60268-21-2018-scope
  - rule_id: val_coverage
    applies_to: "dataset_use"
    rule: "State stage coverage, unmatched supply links, geographic/technology/time relevance and uncertainty. No category-wide comparative claim is supported by this representative production inventory alone."
    source_ids:
      - ec-environmental-footprint-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after appropriate review and completion of supply links"
  downstream_use: "Foreground data package projects to process and lifecyclemodel; supplier production input for a matching loudspeaker design"
  allowed_use: "Declared site/model/campaign production inventory with explicit stage coverage and unit conversion"
  excluded_use: "Unqualified average for all audio equipment; stand/headphone/amplifier substitution; customer-use electricity default; complete life-cycle or comparable EPD claim without remaining stages and review"
  required_metadata: "Required qualifiers; geography; dates; BOM revision; supplier datasets; process map; boundaries; allocation; raw-record links; treatment routes"
  required_quality_disclosure: "Measurement uncertainty; missing records and supply links; proxy datasets; completeness; site representativeness; translation/review state"
  update_trigger: "Design/BOM, supplier, enclosure, magnet, electronics, assembly/test route, power mix or waste treatment changes; updated measurement evidence"
