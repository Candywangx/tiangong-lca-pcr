system_boundary:
  rules:
    - rule_id: sb_production
      applies_to: "foreground_boundary"
      rule: "Include receipt, wiring, joining, mounting, damping installation, testing, retesting, rework and packing actually performed. Purchased cabinet manufacture remains in its supplier boundary; in-house cabinet manufacture requires an explicit additional process."
