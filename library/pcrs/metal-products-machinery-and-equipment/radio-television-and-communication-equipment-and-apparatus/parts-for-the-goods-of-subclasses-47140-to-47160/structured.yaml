allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all processes"
    rule: "Separate dedicated lots/operations before allocation. Assign shared furnace, cleanroom, vacuum and treatment demand using measured machine occupancy/load, area-time or pollutant load that explains consumption; disclose causal basis and uncertainty. Avoid mass allocation between unrelated part technologies."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "all processes"
    rule: "Retain rejects, destructive tests and repeated processing in attributable inputs; only accepted net saleable parts enter D. Recovered metal/solvent is not a burden-free product or automatic avoided-production credit. Declare waste versus co-product status and chosen modelling convention without mixing them."
    source_ids: []
