  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Divide each attributable interval exchange by matched positive accepted net output D; output reference is 1 kg."
      inputs:
        - D
        - "interval quantity"
        - "applicable protocol"
      output: "Exchange per 1 kg reference flow"
      source_ids: []
    - id: count_conversion
      applies_to: "final_product"
      rule: "Matched lot net mass / matched accepted count gives order conversion mass; do not use a catalog typical weight."
      inputs:
        - cp_final_product
        - count
        - "drawing revision"
      output: "Measured same-state count-to-mass relation"
      source_ids: []
    - id: element_balance
      applies_to: "metal_form; finish; tube_part"
      rule: "For each element: external input plus opening stock equals product retention plus external residues/emissions plus closing stock within measured uncertainty. Use every stream mass times its matched elemental assay; cancel paired internal transfers. For chemical species, include measured reaction consumption/formation and recovered stocks."
      inputs:
        - mass
        - "matched assay"
        - stocks
        - reaction
        - uncertainty
      output: "Reviewed elemental/species closure"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity rows"
      rule: "Multiply measured kWh by 3.6 for MJ; separate purchased utilities from in-house generation and allocate own generation fuel/control burdens once."
      inputs:
        - meter
        - unit
        - provider
      output: "MJ on declared supply interface"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "final_product"
      requirement: "host product family and principal dedicated use; part number and drawing revision; delivered completion state; material grade and assay; geometry, finish and tolerances; electrical/thermal/vacuum requirements applicable to this part; accepted lot and count; net mass; make/buy route; supplier completed operations; site, period and gate"
      evidence: "Order; drawing; host use; supplier catalogue; acceptance"
    - id: completeness
      applies_to: "all processes"
      requirement: "Maintain finite route/flow checklist: applicable measured, applicable unknown, verified not_applicable. Unknown never equals zero; include actual gases, emissions, cleaning and treatment rows beyond examples."
      evidence: "Route traveller; BOM; meter; safety data; discharge audit"
    - id: uncertainty
      applies_to: "all exchanges"
      requirement: "No universal yield, mass, energy, emissions, lifetime or GWP range is prescribed. Use actual foreground distributions and uncertainty; disclose missing empirical bounds."
      evidence: "Calibrated records and explicit gap register"
validation_rules:
  - rule_id: validate_part
    applies_to: "final_product"
    rule: "Confirm dedicated host/part use, drawing revision and delivered completion state. Review finished die/device and glass/equipment counterexamples individually; reject unresolved classification assumptions for a concrete dataset."
    source_ids:
      - unsd-cpc3-parts
      - census-semiconductor-state
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Require positive calibrated accepted D, identical reporting scope and per-kg basis in both languages; reconcile counts, test rejects, carrier tare and retained finish."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Check elemental/species/water/stock closure with documented measurement uncertainty; gross sludge or bath mass cannot equal contained metal. Retain reaction and internal-transfer evidence. CO and NOx require independent species evidence."
    source_ids: []
  - rule_id: validate_provider
    applies_to: "all exchanges"
    rule: "Verify product/waste/elementary type, specific identity, property/unit and provider interface; UUID name alone does not justify grade, mass share, geography or process burden. Unresolved actual-part UUID and missing empirical ranges remain disclosed publication gaps."
    source_ids: []
  - rule_id: validate_route
    applies_to: "all processes"
    rule: "Confirm every make/buy operation once, actual part-state tests and factory-only utilities; distinguish verified absence from zero measurement and unknown. A skipped applicable route or missing provider means incomplete data."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production package for one qualified dedicated part"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Supply of same declared part identity/state for host assembly"
  excluded_use: "Unqualified category average; completed device production; host lifetime/use impact"
  required_metadata: "host product family and principal dedicated use; part number and drawing revision; delivered completion state; material grade and assay; geometry, finish and tolerances; electrical/thermal/vacuum requirements applicable to this part; accepted lot and count; net mass; make/buy route; supplier completed operations; site, period and gate"
  required_quality_disclosure: "Provider/UUID, range, route, balance and measurement gaps; source scope; conditional absences; allocation uncertainty"
  update_trigger: "Drawing/material/state/route/provider change, measured yield or process-control change"
data_sources:
  - id: "unsd-cpc3-parts"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 Explanatory Notes, 30 June 2025, printed pages255–256, classes4714–4717. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; current detail https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/47173"
    used_for: "Current host titles and parts category; PDF and online record contain no detailed inclusion/exclusion prose for47173."
  - id: "unsd-cpc21-correspondence"
    type: "official_guidance"
    reference: "UNSD CPC 2.1, subclass 47173, correspondence to HS 2012/2017. https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/47173"
    used_for: "Historical parts-heading corroboration, HS854091/854099/854190/854290; not asserted to be a current CPC3 correspondence table."
  - id: "census-semiconductor-state"
    type: "official_guidance"
    reference: "US Census, Schedule B 2022, Chapter 85, notes and headings 8540–8542. https://www.census.gov/foreign-trade/schedules/b/2022/c85.html"
    used_for: "Counterevidence: unmounted chips/dice/wafers can already be devices; standalone glass articles and manufacturing equipment require separate classification. Historical US schedule, not current legal advice."
  - id: "shinko-package"
    type: "extension_guidance"
    reference: "SHINKO, Semiconductor Package, product catalogue, undated. https://www.shinko.co.jp/english/product/package/"
    used_for: "Sold leadframe, package-substrate and hermetic component interfaces; IC assembly is distinct."
  - id: "shinko-business"
    type: "extension_guidance"
    reference: "SHINKO, Our Business, products and core technologies, undated. https://www.shinko.co.jp/english/corporate/business/"
    used_for: "Conditional stamping/etching, plating, multilayer, ceramic and sealing routes; chucks are equipment parts, not automatically device parts. No intensity, recipe or universal route inferred."
  - id: "saes-cathodes"
    type: "extension_guidance"
    reference: "SAES/Spectra-Mat, Thermal Management and Cathodes, undated. https://www.saesgetters.com/industrial-thermal-management-cathodes/"
    used_for: "Independent evidence for functional dispenser cathodes, getter and thermal components with several end uses; tube/semiconductor dedication must be documented."
  - id: "saes-metallurgy"
    type: "extension_guidance"
    reference: "SAES Industrial, metallurgy capabilities, undated. https://www.saesgetters.com/industrial/"
    used_for: "Conditional powder forming, sintering and alloy routes only; supplier capability does not establish a particular part recipe or firing schedule."
