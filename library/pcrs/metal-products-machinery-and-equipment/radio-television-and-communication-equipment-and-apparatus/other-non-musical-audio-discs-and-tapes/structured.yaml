allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared equipment and meters"
    rule: "Avoid allocation by recording route-, line-, campaign-, or time-resolved activity. Subtract documented idle and non-production loads before normalization."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "multiple recorded-media products in one campaign"
    rule: "When subdivision is not practicable and products use the same operations, allocate shared burdens by accepted finished-product mass; separately measured route-specific inputs and rejects remain directly assigned."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "recovered rejects or saleable secondary outputs"
    rule: "Apply no avoided-burden credit inside the foreground inventory. Report the measured output mass, destination, and any external recycling or substitution scenario separately."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_campaign_mass_balance
      process_id: "recording_finishing"
      flow_role: "unrecorded medium input, accepted finished product, and route-specific rejects"
      record_type: "weighbridge, calibrated scale, production count, and reject log"
      raw_fields: "campaign_id; format; route; input_mass_kg; accepted_count; accepted_sample_mass_kg; accepted_output_mass_kg; optical_reject_mass_kg; magnetic_reject_mass_kg; waste_destination"
      collection_method: "Weigh batch inputs and rejects; weigh accepted output directly or convert counts using a campaign-specific measured mean mass"
      unit: "kg"
      frequency: "each campaign, with every reject batch logged"
      temporal_coverage: "representative production period covering normal formats and operating conditions"
      site_scope: "each recording or replication site and line"
      aggregation_rule: "Sum route-specific masses by campaign; reconcile input, accepted output, retained work in progress, and rejects; normalize to 1 kg accepted output"
      quality_evidence: "current calibration record; signed production and reject logs; count-to-mass sample record; documented reconciliation"
    - protocol_id: cp_campaign_electricity
      process_id: "recording_finishing"
      flow_role: "delivered electricity"
      record_type: "revenue meter, submeter, equipment logger, and production schedule"
      raw_fields: "meter_id; reading_start_kWh; reading_end_kWh; logger_kWh; campaign_start; campaign_end; downtime_kWh; non_production_kWh; accepted_output_mass_kg"
      collection_method: "Prefer campaign submetering; otherwise reconcile meter readings to operating logs and apply the allocation rules"
      unit: "kWh retained and MJ projected"
      frequency: "each campaign or continuous logging aggregated by campaign"
      temporal_coverage: "same production period as the mass balance"
      site_scope: "each site and included line"
      aggregation_rule: "Net campaign kWh = end minus start minus documented downtime and non-production use; divide by accepted output kg; multiply by 3.6 for MJ/kg"
      quality_evidence: "meter specification or calibration evidence; timestamped readings; production schedule; allocation record"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "each mass-based input or reject row"
      rule: "normalized kg/kg = campaign row mass (kg) / accepted finished-product mass (kg)"
      inputs:
        - "route-specific input or reject mass"
        - "accepted output mass"
      output: "kg per 1 kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "accepted output recorded by count"
      rule: "accepted output mass = accepted count × measured campaign-specific mean net mass per item"
      inputs:
        - "accepted count"
        - "sampled net item masses"
        - "sample size"
      output: "accepted finished-product mass in kg"
      source_ids: []
    - id: calc_electricity
      applies_to: "recording_electricity"
      rule: "normalized MJ/kg = net attributable campaign electricity (kWh) × 3.6 / accepted finished-product mass (kg)"
      inputs:
        - "meter readings"
        - "documented exclusions"
        - "allocation record"
        - "accepted output mass"
      output: "MJ per 1 kg reference product"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "campaign mass balance"
      rule: "Compare applicable blank-medium input mass with accepted output, route-specific reject output, and documented work-in-progress change; investigate and disclose unexplained imbalance"
      inputs:
        - "input mass"
        - "accepted output"
        - "applicable reject mass"
        - "work-in-progress change"
      output: "reconciled campaign mass statement"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Demonstrate that content is non-musical audio, is not an audiobook or excluded sibling product, and is supplied on the declared physical format."
      evidence: "product specification; content classification; format identifier; quality-release record"
    - id: dq_route
      applies_to: "route-specific inventory"
      requirement: "Include exactly one applicable blank-medium row and its matching reject row; justify any zero reject result from complete logs."
      evidence: "bill of materials; route declaration; production and reject logs"
    - id: dq_measurement
      applies_to: "mass and electricity"
      requirement: "Use calibrated or specification-controlled instruments and retain raw readings and conversions."
      evidence: "calibration or meter specification; raw readings; calculation worksheet"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Use one consistent production period and disclose shutdowns, rework, abnormal campaigns, and data gaps."
      evidence: "production calendar; campaign log; gap register"
    - id: dq_completeness
      applies_to: "foreground gate"
      requirement: "Reconcile accepted output, applicable blank-medium input, route-specific rejects, and electricity to the declared campaign and facility boundary."
      evidence: "signed completeness checklist; mass reconciliation; meter reconciliation"
    - id: dq_background
      applies_to: "upstream datasets"
      requirement: "Document geography, technology, product state, delivery boundary, age, and proxy limitations for every linked blank-medium and electricity dataset."
      evidence: "dataset metadata and proxy assessment"
