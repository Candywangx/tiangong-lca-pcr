product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.radio-television-and-communication-equipment-and-apparatus.monitors-and-projectors-principally-used-in-an-automatic-data-processing-system"
  classification_refs: "CPC 3.0: 47315, exact classification context"
  covered_products: "Direct-view computer monitors and data projectors principally used to display output from an ADP system, including office, industrial, data-centre, network-operations, and digital-infrastructure applications"
  excluded_products: "Television receivers; non-ADP-principal-use displays and projectors; digital signage principally intended for public or commercial signage; cinema and photographic projectors; projection screens; integrated notebook and all-in-one displays; head-mounted displays; separately sold display panels, optical engines, light sources, and other components"
  representative_product: "A finished, tested monitor or data projector configured for connection to an ADP system and ready for packaging at the manufacturing site"
  production_route: "Purchased or internally produced display panel or projector optical engine and light source, electronics and power assemblies, enclosure and stand or mounting parts; final integration; firmware loading and calibration; functional and power testing; packaging"
  market_state: "Finished, tested, specification-conforming ADP display device at factory gate; packaging is recorded separately from product mass"
functional_unit:
  what: "Provide a finished monitor or data projector whose principal intended use is visual output from an ADP system"
  how_much: "1 kg of finished display device at factory gate, excluding packaging mass"
  how_well: "Meets the declared model specification for product family, size, native resolution, luminance or light output, panel or projection technology, interfaces, power states, and included stand or mounting hardware"
  how_long_or_cycle: "The declared expected service life in years and operating hours, with projector light-source life and replacement assumptions stated separately"
  reference_flow_link: "Product mass measured after final assembly and acceptance testing and before packaging; package, manuals, detached cables, and separately supplied accessories are separate inventory inputs unless physically integrated in the device"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary begins with receipt of components, materials, and packaging at the manufacturing site and ends with an accepted device and its separately inventoried packaging at factory gate. Upstream production of panels, optical engines, light sources, printed circuit assemblies, semiconductors, power supplies, structural materials, and packaging shall be represented by documented upstream datasets. Include those manufacturing processes directly only when they occur within the declared foreground system."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Distribution, use, maintenance, and end-of-life are conditional downstream stages. A lifecycle model that includes use shall retain product-family-specific power tests, operating profiles, service life, geography-specific electricity, and projector light-source replacement. Monitor performance rules and evidence shall not be applied to projector power or optical performance without a projector-specific method."
      source_ids: []
    - rule_id: boundary_technology_split
      applies_to: "All datasets"
      rule: "Keep monitor and projector technologies separate through product identity, bill of materials, manufacturing route, performance measures, power testing, service life, and downstream scenarios. A weighted product-family average shall preserve model weights and technology-specific inventory before aggregation."
      source_ids:
        - epd-ies-pcr-2024-06
        - epa-desktop-display-lca-2001
        - cheung-projector-lca-2018
    - rule_id: boundary_manufacturing_stages
      applies_to: "Cradle-to-gate and gate-to-gate datasets"
      rule: "Include or link upstream datasets for display or projection subsystem, electronic components and printed circuit assemblies, power supply, enclosure, stand or mounting hardware, thermal management, cables, final assembly, firmware or calibration, acceptance and power testing, packaging, manufacturing waste, wastewater, and direct emissions."
      source_ids:
        - epd-ies-pcr-2024-06
        - epa-desktop-display-lca-2001
    - rule_id: boundary_monitor_test_scope
      applies_to: "Monitor testing and use modelling"
      rule: "Apply a declared monitor test method and preserve screen area, native resolution, luminance, picture configuration, automatic brightness, network functions, input voltage and frequency, and measured power states. EU electronic-display rules may support monitor methods but explicitly do not govern projectors."
      source_ids:
        - energy-star-displays-v8-2021
        - eu-electronic-displays-2019-2021
    - rule_id: boundary_projector_test_scope
      applies_to: "Projector testing and use modelling"
      rule: "Apply projector-specific performance and optical-safety methods; preserve imaging device, projection optics, light-source technology, native resolution, light output, power states, thermal management, and light-source replacement."
      source_ids:
        - iec-61947-1-2002
        - iec-62471-5-2015
        - cheung-projector-lca-2018
    - rule_id: boundary_downstream_stages
      applies_to: "Lifecycle models"
      rule: "When distribution, use, maintenance, reuse, or end-of-life is included, use declared route, operating profile, service life, repair and replacement records, electricity geography, and treatment scenarios. Do not claim cradle-to-grave coverage when any included stage lacks a dataset or disclosed proxy."
      source_ids:
        - ec-pef-2021
        - epd-ies-pcr-2024-06
        - cheung-projector-lca-2018
    - rule_id: boundary_missing_data
      applies_to: "All known flows"
      rule: "Do not omit a known material, energy, water, transport, waste, wastewater, or direct-emission flow merely because a value or UUID is unavailable. Collect it, flag it unresolved, or use a documented proxy and disclose the effect on completeness."
      source_ids:
        - ec-pef-2021
        - epd-ies-pcr-2024-06
boundary_abstraction:
  declared_starting_condition: "Display panel or projector imaging and light-source subsystem, electronic and power assemblies, enclosure, stand or mounting hardware, thermal components, cables, assembly consumables, and packaging received at the declared manufacturing boundary"
  starting_condition_role: "Upstream product and material inputs to foreground final assembly and test"
  product_classification_scope: "Finished monitors and data projectors principally used in an ADP system; component-only and non-ADP display products are outside the canonical product scope"
  recursive_input_rule: "An input that is already a finished in-scope monitor or projector shall be recorded as an upstream product flow and shall not be decomposed again inside the receiving foreground process; component panels, optics, light sources, boards, and housings are not finished in-scope products and shall retain their own upstream datasets."
  upstream_dataset_requirement: "Use technology-, material-, supplier-, geography-, and time-representative upstream datasets for display panels or optical engines and light sources, electronics, semiconductors, power supplies, metals, plastics, glass, cables, packaging, energy, transport, and waste treatment; disclose every proxy."
  disclosure: "Declare monitor or projector family; component sourcing versus internal production; included assembly, test, calibration, packaging, distribution, use, maintenance, and end-of-life stages; treatment of capital equipment; cut-offs and proxies; and the exact terminal boundary."
