allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared manufacturing processes"
    rule: "Avoid allocation by sub-metering, batch tracing, or subdivision of panel or optical-engine production, electronics assembly, final assembly, testing, and packaging whenever product-specific records can be obtained."
    source_ids:
      - ec-pef-2021
      - epa-desktop-display-lca-2001
  - rule_id: allocation_shared_line
    applies_to: "Shared production lines and utilities"
    rule: "When subdivision is not practical, allocate utilities and common wastes using a documented physical driver that reflects causation, such as machine time, tested unit time, throughput mass, or occupied production time. Do not use revenue unless physical causation cannot be established and the choice is justified."
    source_ids:
      - ec-pef-2021
      - epd-ies-pcr-2024-06
  - rule_id: allocation_model_family
    applies_to: "Multiple monitor or projector models"
    rule: "Use model-specific bills of materials and tests. A family average shall use disclosed production weights and retain separate monitor and projector technology strata before any aggregation."
    source_ids:
      - energy-star-displays-v8-2021
      - epd-ies-pcr-2024-06
  - rule_id: allocation_rework_scrap
    applies_to: "Rework, rejects, supplier returns, and recovered materials"
    rule: "Keep the burdens of internal rework and test repeats with accepted output; subtract documented supplier returns from site waste; report recovered material outputs separately and apply any recycling credit only in a declared downstream method."
    source_ids:
      - ec-pef-2021
      - epd-ies-pcr-2024-06
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_component_receipts
      process_id: "final_assembly"
      flow_role: "Display or projection subsystem, electronics, power, enclosure, stand or mounting, thermal parts, cables, and accessories"
      record_type: "Bill of materials, supplier specification, receipt, stock, and reject record"
      raw_fields: "model_id; family; component_id; supplier; material; technology; quantity; unit_mass; opening_stock; purchases; closing_stock; rejects; returned_quantity; recycled_content"
      collection_method: "Approved BOM joined to measured component mass and inventory reconciliation"
      unit: "kg; Item(s)"
      frequency: "Per model revision and production period"
      temporal_coverage: "Same representative production period as the dataset"
      site_scope: "Every included manufacturing site and model"
      aggregation_rule: "Calculate consumed quantity from opening stock plus receipts minus closing stock and documented returns; divide by accepted device mass"
      quality_evidence: "Approved BOM, calibrated scale record, supplier declaration, inventory reconciliation, and model-revision control"
    - protocol_id: cp_manufacturing_utilities
      process_id: "final_assembly"
      flow_role: "Assembly consumables and utilities"
      record_type: "Meter, invoice, batch issue, and stock record"
      raw_fields: "carrier_or_material; meter_id; opening_reading; closing_reading; purchase; opening_stock; closing_stock; batch; line_time; accepted_mass"
      collection_method: "Sub-metering preferred; otherwise documented line allocation"
      unit: "kg; m3; kWh; MJ"
      frequency: "Per batch or monthly"
      temporal_coverage: "At least one representative continuous production period, with seasonality disclosed"
      site_scope: "Every included manufacturing site"
      aggregation_rule: "Net measured or reconciled consumption allocated by a causal line driver and divided by accepted device mass"
      quality_evidence: "Meter calibration, invoices, stock records, allocation worksheet, and completeness reconciliation"
    - protocol_id: cp_output_scrap_mass_balance
      process_id: "final_assembly"
      flow_role: "Assembled output, rejects, supplier returns, scrap, and inventory change"
      record_type: "Scale, production, quality, rework, return, and waste-transfer record"
      raw_fields: "input_mass; assembled_mass; accepted_mass; reject_mass; rework_mass; returned_mass; waste_mass; stock_change; treatment_route"
      collection_method: "Batch or period mass balance by technology family and model"
      unit: "kg"
      frequency: "Per batch, reconciled monthly"
      temporal_coverage: "Same production period as component and utility records"
      site_scope: "Every included site and line"
      aggregation_rule: "Reconcile input components to assembled and accepted outputs, returns, wastes, and stock changes without double counting rework"
      quality_evidence: "Calibrated scales, production counts, quality logs, supplier-return records, waste tickets, and signed reconciliation"
    - protocol_id: cp_manufacturing_emissions
      process_id: "final_assembly"
      flow_role: "Direct emissions"
      record_type: "Stack, wastewater, solvent, fuel, and abatement record"
      raw_fields: "substance; compartment; measured_concentration; flow_rate; duration; fuel_quantity; factor; capture_efficiency"
      collection_method: "Direct measurement preferred; otherwise calculation from collected activity data and cited factor"
      unit: "kg; m3; MJ"
      frequency: "Per measurement campaign and reporting period"
      temporal_coverage: "Representative production period"
      site_scope: "Every included emitting site"
      aggregation_rule: "Calculate substance-specific release and allocate using the same causal driver as the associated operation"
      quality_evidence: "Laboratory report, monitor calibration, fuel record, factor reference, and abatement operation log"
    - protocol_id: cp_power_performance_test
      process_id: "functional_test"
      flow_role: "Device acceptance, performance, power states, test electricity, rework, and rejects"
      record_type: "Test-station result and meter record"
      raw_fields: "model_id; family; serial_or_batch; screen_or_image_size; native_resolution; luminance_or_light_output; panel_or_imaging_technology; light_source; voltage; frequency; signal; picture_mode; brightness; ABC_state; network_state; stabilization; on_W; sleep_W; off_W; networked_W; test_duration; station_kWh; pass_fail; rework"
      collection_method: "Apply the declared monitor or projector test method using calibrated instruments and retain raw measurements"
      unit: "inch or m; pixels; cd/m2 or lumen; V; Hz; W; h; kWh"
      frequency: "Per representative model and test batch"
      temporal_coverage: "Same model revision and production period as the dataset"
      site_scope: "Every included test site"
      aggregation_rule: "Preserve unrounded readings; calculate test energy from meter difference and accepted mass; aggregate power results only within the same family and configuration"
      quality_evidence: "Test method and revision, calibration certificates, configuration record, raw meter file, pass/fail log, and representative-model justification"
    - protocol_id: cp_packaging_records
      process_id: "packaging_dispatch"
      flow_role: "Packaging materials, detached accessories, packaging energy, and waste"
      record_type: "Packaging BOM, scale, purchase, reuse, meter, and waste record"
      raw_fields: "material; component; recycled_content; unit_mass; quantity; reuse_count; detached_accessory; energy; dispatched_device_mass; waste_mass; treatment_route"
      collection_method: "Weigh representative packaging and reconcile purchases, dispatch, reuse, and waste"
      unit: "kg; Item(s); kWh; MJ"
      frequency: "Per packaging configuration and monthly reconciliation"
      temporal_coverage: "Same production period as dispatch output"
      site_scope: "Every included packaging site"
      aggregation_rule: "Divide one-way packaging by dispatched device mass; divide reusable assets by verified reuse count; keep detached accessories separate"
      quality_evidence: "Approved packaging specification, calibrated scale, supplier statement, reuse log, meter or invoice, and waste ticket"
    - protocol_id: cp_use_lifetime_profile
      process_id: "use_maintenance"
      flow_role: "Power-state hours, service life, maintenance, and projector light-source replacement"
      record_type: "Metered or verified test, fleet log, warranty, repair, and scenario record"
      raw_fields: "family; model; geography; service_years; annual_hours_by_state; power_W_by_state; utilization; network_state; lifetime_hours; failure; part_id; replacement_count; light_source_rated_life; realized_life; repair_transport"
      collection_method: "Use representative field records when available; otherwise a declared scenario based on measured product power and documented lifetime assumptions"
      unit: "year; h; W; kWh; kg; Item(s)"
      frequency: "Per model and scenario review"
      temporal_coverage: "Declared service life"
      site_scope: "Declared market and use setting"
      aggregation_rule: "Sum state power times hours; add maintenance and replacements; keep scenario alternatives separate"
      quality_evidence: "Power-test record, fleet or user log, warranty and repair data, product documentation, and scenario approval"
    - protocol_id: cp_end_of_life_scenario
      process_id: "end_of_life"
      flow_role: "Collection, reuse, refurbishment, recycling, recovery, disposal, and emissions"
      record_type: "Treatment operator, official statistics, mass balance, and scenario record"
      raw_fields: "geography; device_family; collected_mass; reused_mass; refurbished_mass; recovered_material; residue; treatment_route; direct_emission; reference_year"
      collection_method: "Prefer operator-specific measured data; otherwise use a documented geography- and technology-specific scenario"
      unit: "kg; Item(s)"
      frequency: "Per scenario update"
      temporal_coverage: "Reference year stated for scenario"
      site_scope: "Declared end-of-life geography"
      aggregation_rule: "Apply mutually exclusive route shares to device, packaging, and replacement-part masses and close treatment mass balance"
      quality_evidence: "Operator records, official statistics, permits, treatment certificates, scenario source, and mass-balance check"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All manufacturing rows"
      rule: "normalized amount = period flow amount / accepted finished-device mass in the same period"
      inputs:
        - "period flow amount"
        - "accepted finished-device mass excluding packaging"
      output: "flow amount per 1 kg accepted device"
      source_ids: []
    - id: calc_component_consumption
      applies_to: "BOM and component inputs"
      rule: "consumed quantity = opening stock + receipts - closing stock - documented supplier returns; reconcile to BOM issues and rejects"
      inputs:
        - "stock and receipt records"
        - returns
        - BOM
        - "reject records"
      output: "consumed component mass or count"
      source_ids:
        - epa-desktop-display-lca-2001
    - id: calc_mass_balance
      applies_to: "Final assembly and testing"
      rule: "component and consumable input mass + opening work-in-progress = accepted output + returned components + waste + closing work-in-progress + documented mass loss"
      inputs:
        - "measured inputs"
        - outputs
        - returns
        - wastes
        - "and stock changes"
      output: "closed mass balance and unexplained residual"
      source_ids:
        - epd-ies-pcr-2024-06
    - id: calc_test_energy
      applies_to: "Functional and power testing"
      rule: "test energy per kg = measured test-station kWh including retests / accepted device mass"
      inputs:
        - "station meter readings"
        - "accepted mass"
        - "retest log"
      output: "kWh per kg accepted device"
      source_ids:
        - energy-star-displays-v8-2021
        - iec-61947-1-2002
    - id: calc_use_energy
      applies_to: "Use stage"
      rule: "lifetime kWh = sum over power states of measured power in W multiplied by declared state hours divided by 1,000; calculate each geography and scenario separately"
      inputs:
        - "measured W by state"
        - "hours by state"
        - "service life"
        - geography
      output: "lifetime electricity by state and total"
      source_ids:
        - energy-star-displays-v8-2021
        - eu-electronic-displays-2019-2021
        - cheung-projector-lca-2018
    - id: calc_packaging_normalization
      applies_to: "Packaging"
      rule: "packaging kg per reference kg = packaging material mass / accepted device mass; reusable packaging mass is additionally divided by verified reuse count"
      inputs:
        - "packaging BOM and weights"
        - "device mass"
        - "reuse count"
      output: "material-specific packaging kg per reference kg"
      source_ids:
        - epd-ies-pcr-2024-06
    - id: calc_projector_replacements
      applies_to: "Projector use"
      rule: "replacement quantity = declared scenario count or observed maintenance count; retain rated and realized light-source life and do not derive replacements from rated life alone when observed records exist"
      inputs:
        - "service hours"
        - "rated and realized light-source life"
        - "maintenance records"
      output: "replacement parts per reference kg and service life"
      source_ids:
        - cheung-projector-lca-2018
        - iec-62471-5-2015
    - id: calc_family_average
      applies_to: "Product-family datasets"
      rule: "weighted amount = sum of model-specific amount multiplied by verified production share; aggregate only after monitor and projector strata remain separately reviewable"
      inputs:
        - "model results"
        - "production quantities"
        - "technology family"
      output: "disclosed weighted family result"
      source_ids:
        - epd-ies-pcr-2024-06
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all model averages"
      requirement: "Demonstrate principal ADP use and preserve monitor or projector family, model scope, size, resolution, brightness measure, display or projection technology, interfaces, power supply, stand or mount, and product mass."
      evidence: "Product specification, model list, intended-use documentation, photographs or technical drawings, and reference-flow record"
    - id: dq_technology_separation
      applies_to: "BOM, test, lifetime, and downstream data"
      requirement: "Do not transfer monitor panel, luminance, or lifetime values to projectors, or projector optical-engine, light-output, light-source, or replacement values to monitors."
      evidence: "Technology-stratified BOM, process map, test record, and scenario record"
    - id: dq_temporal_geographic
      applies_to: "Foreground activity data and upstream datasets"
      requirement: "State reference year, production period, sites, suppliers, market, electricity geography, and data age; justify any older or non-local proxy."
      evidence: "Dataset metadata, invoices, meter periods, supplier dataset metadata, and proxy justification"
    - id: dq_measurement_traceability
      applies_to: "Mass, power, energy, luminance, light output, and waste measurements"
      requirement: "Retain instrument identity, calibration status, raw unrounded results, test configuration, aggregation, and unit conversion."
      evidence: "Calibration certificate, raw file, method revision, calculation workbook, and review sign-off"
    - id: dq_completeness
      applies_to: "All known inputs and outputs"
      requirement: "Reconcile BOM, accepted output, returns, inventory change, packaging, utilities, wastes, wastewater, and direct emissions. List unresolved known flows rather than silently cutting them off."
      evidence: "Mass and energy reconciliation, missing-data register, proxy list, and completeness review"
    - id: dq_lifetime_scenario
      applies_to: "Use, maintenance, and replacement"
      requirement: "State whether lifetime and operating hours are observed, warranted, specified, or scenario-based; show sensitivity when use or replacement assumptions materially affect results."
      evidence: "Fleet or warranty data, product specification, scenario approval, and sensitivity result"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow 0f14f2f1-768f-44cd-b5d7-b81ecbe1a9b8, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg finished-device output excluding packaging."
    source_ids: []
  - rule_id: validate_adp_scope
    applies_to: "Product identity"
    rule: "Require documentary evidence that ADP visual output is the principal intended purpose. Reject television receivers, non-ADP-principal-use displays or projectors, component-only products, and the narrower CPC 47314 product flow."
    source_ids:
      - epd-ies-pcr-2024-06
  - rule_id: validate_technology_fields
    applies_to: "Required qualifiers"
    rule: "Require monitor or projector family and the matching size, resolution, luminance or light output, panel or imaging technology, light source, electronics, enclosure, stand or mount, power, lifetime, and packaging fields. Reject cross-family units such as projector lumen used as monitor cd/m2."
    source_ids:
      - energy-star-displays-v8-2021
      - iec-61947-1-2002
  - rule_id: validate_bom_mass_balance
    applies_to: "Manufacturing inventory"
    rule: "Require a component and material BOM, measured accepted device mass, packaging separated from product mass, and a reconciled record of returns, work-in-progress, scrap, and unexplained residual."
    source_ids:
      - epa-desktop-display-lca-2001
      - epd-ies-pcr-2024-06
  - rule_id: validate_power_test
    applies_to: "Power testing and use model"
    rule: "Require declared test method, voltage, frequency, signal, picture or brightness settings, ABC and network state, stabilization, raw readings, and measured power for every applicable state. Do not use monitor regulation values as projector test results."
    source_ids:
      - energy-star-displays-v8-2021
      - eu-electronic-displays-2019-2021
      - iec-61947-1-2002
  - rule_id: validate_lifetime_replacement
    applies_to: "Lifecycle models"
    rule: "Require service years, operating hours by power state, repair and replacement scenario, and projector light-source life and replacement count where applicable. Flag any unsupported shared lifetime across monitors and projectors."
    source_ids:
      - cheung-projector-lca-2018
      - ec-pef-2021
  - rule_id: validate_sources_proxies
    applies_to: "All rules and rows"
    rule: "Require every external source id to resolve in Data Sources and every proxy, missing UUID, omission, allocation, and scenario assumption to be disclosed with its effect on completeness."
    source_ids:
      - ec-pef-2021
      - epd-ies-pcr-2024-06
published_dataset_profile:
  dataset_role: "Foreground production dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Construction of process and lifecyclemodel datasets for monitors or data projectors principally used in ADP systems, including office, industrial, data-centre, network-operations, and digital-infrastructure applications"
  allowed_use: "Product- and technology-specific manufacturing inventories; transparent weighted model-family datasets; downstream distribution, use, maintenance, and end-of-life scenarios when all required qualifiers and stage data are supplied"
  excluded_use: "Television receivers; non-ADP-principal-use displays or projectors; comparison of monitor and projector results that do not share functional performance and boundary; component-only inventories presented as finished devices; undisclosed substitution of CPC 47314 or other proxy flows"
  required_metadata: "Canonical PCR id; CPC context; reference flow UUID and mass basis; product family; principal ADP use evidence; model scope and weights; size; native resolution; luminance or light output; panel, imaging, and light-source technology; electronics and power supply; enclosure and stand or mount; device mass; test method and power states; service life and operating hours; projector light-source replacement; packaging BOM; geography; reference year; system boundary; allocation; data sources and proxies"
  required_quality_disclosure: "Site and supplier coverage; foreground period; measurement and calibration; BOM and mass-balance closure; test configuration; model-family weighting; data age; missing UUIDs and flows; proxy use; power and lifetime scenario; packaging separation; allocation; uncertainty and sensitivity; review status"
  update_trigger: "Product-family or principal-use change; panel, imaging, light-source, electronics, power-supply, enclosure, stand, or packaging redesign; material or supplier change; new manufacturing site; changed test method or power management; changed service-life or repair evidence; material shift in electricity, yield, waste, allocation, or end-of-life route; replacement of a provisional proxy or unresolved UUID"
