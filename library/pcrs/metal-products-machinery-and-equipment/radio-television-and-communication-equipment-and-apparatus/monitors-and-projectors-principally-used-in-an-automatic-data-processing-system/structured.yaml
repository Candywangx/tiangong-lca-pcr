measurement_rules:
  - id: reference_device_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure accepted finished-device mass after final assembly and testing and before packaging. Normalize all manufacturing inventory to 1 kg of accepted device output; do not include package mass in the reference amount."
  - id: component_mass_basis
    applies_to: "Display subsystem, electronics, power supply, enclosure, stand or mounting hardware, thermal parts, cables, and integrated accessories"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record measured or supplier-declared component mass by material or subassembly and reconcile it with finished-device mass, manufacturing scrap, and inventory change."
  - id: monitor_geometry_performance
    applies_to: "Monitor products"
    required_property_ref:
      name: "Screen size, area, native resolution, and luminance"
      uuid: ""
    required_unit: "inch or cm; dm2 or m2; pixels; cd/m2"
    rule: "Report visible diagonal and area, horizontal and vertical native pixels, panel technology, and measured or declared luminance together; preserve test configuration and do not infer one parameter from another."
  - id: projector_geometry_performance
    applies_to: "Projector products"
    required_property_ref:
      name: "Projected-image size, native resolution, and light output"
      uuid: ""
    required_unit: "inch or m; pixels; lumen"
    rule: "Report imaging technology, light-source technology, native pixel matrix, declared image-size range, and measured or declared light output under the cited test method; do not express projector light output as monitor luminance."
  - id: power_state_measurement
    applies_to: "Finished-device power testing and use modelling"
    required_property_ref:
      name: "Power and energy"
      uuid: ""
    required_unit: "W; kWh"
    rule: "Record test method, input voltage, frequency, picture or signal condition, brightness setting, automatic-brightness setting, network and peripheral state, stabilization, and measured on, sleep, off, and networked-mode power where available. Convert energy only from the retained power and time records."
  - id: service_life_measurement
    applies_to: "Use and maintenance scenarios"
    required_property_ref:
      name: "Time and operating duration"
      uuid: ""
    required_unit: "year; h"
    rule: "Declare product service life, annual operating hours by power state, duty profile, failure or replacement assumptions, and projector light-source rated and realized life. Do not apply one lifetime to both technology families without evidence."
  - id: packaging_mass_separation
    applies_to: "Packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record primary, secondary, and tertiary packaging by material and reuse count; keep packaging mass outside the reference product mass and normalize it separately to 1 kg of accepted device output."
