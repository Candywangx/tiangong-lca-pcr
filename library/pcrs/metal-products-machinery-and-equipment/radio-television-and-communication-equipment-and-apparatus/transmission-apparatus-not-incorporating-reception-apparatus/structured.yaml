allocation_rules:
  - rule_id: allocation_separate_first
    applies_to: "Product families, configurations, and shared lines"
    rule: "Prefer product-specific BOMs, serial or lot records, process subdivision, and direct metering so burdens are assigned without allocation."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: allocation_shared_operations
    applies_to: "Shared assembly, test, facility, and support burdens"
    rule: "When subdivision is not feasible, use a documented physical driver that reflects burden causation, such as metered equipment-hours, test-cell energy, machine time, processed board area, or accepted product mass; disclose the driver and apply it consistently."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: allocation_family_mix
    applies_to: "Production-mix datasets"
    rule: "Weight configurations by accepted net production mass over the declared period; separately disclose configuration counts and rated-power bands so a high-mass or high-power configuration is not hidden by the average."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: allocation_recycling
    applies_to: "Production scrap and reusable packaging"
    rule: "Report gross waste and destination; apply recycling burdens or credits only under the declared background-dataset convention and do not subtract recycled mass or revenue directly from foreground inputs."
    source_ids:
      - etsi-es-203199-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_mass
      process_id: "pcba_assembly_rf_power_cooling_integration_chassis_system_assembly"
      flow_role: "Installed parts, modules, boards, metalwork, coolant, accessories, and accepted subassemblies"
      record_type: "Approved BOM, material issue/return records, scales, and production transfer records"
      raw_fields: "configuration_id; part_id; part_description; supplier; quantity; unit_mass; issued_mass; returned_mass; installed_mass; lot; site; date"
      collection_method: "Export controlled BOM and material transactions; verify representative items by calibrated scale; reconcile transfers and black-box modules"
      unit: "kg and piece"
      frequency: "Each configuration revision and production lot; aggregate for reporting period"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "Every included manufacturing and integration site"
      aggregation_rule: "Sum installed mass by configuration and mass-weight across accepted production; keep internal transfers separate from external inputs"
      quality_evidence: "BOM revision approval, calibration records, supplier declarations, goods receipts, and mass-balance reconciliation"
    - protocol_id: cp_process_energy
      process_id: "pcba_assembly_rf_power_cooling_integration_chassis_system_assembly"
      flow_role: "Direct and shared manufacturing electricity"
      record_type: "Submeters, machine logs, utility intervals, and production records"
      raw_fields: "meter_id; start_time; end_time; kWh; baseline_kWh; process; line; configuration_id; accepted_mass; allocation_driver"
      collection_method: "Prefer direct submetering; otherwise subtract documented idle baseline and allocate shared energy with the declared physical driver"
      unit: "kWh"
      frequency: "Continuous or per batch; aggregate monthly and over the reporting period"
      temporal_coverage: "Entire declared reporting period, including seasonal production variation"
      site_scope: "Every included production line and site"
      aggregation_rule: "Sum attributable kWh and divide by accepted net reference-product mass; preserve site electricity supply"
      quality_evidence: "Meter calibration, interval completeness, baseline study, production totals, and allocation worksheet"
    - protocol_id: cp_yield_and_waste
      process_id: "all_required_processes"
      flow_role: "Rejects, rework, offcuts, residues, coolant losses, and waste destinations"
      record_type: "Yield logs, non-conformance records, weigh tickets, waste manifests, and recycler receipts"
      raw_fields: "process_id; material; quantity; mass; rework_status; final_disposition; waste_flow; treatment_route; date"
      collection_method: "Link rejected items to final disposition; weigh by material and prevent double counting of reworked accepted units"
      unit: "kg and piece"
      frequency: "Each lot or waste shipment; aggregate for reporting period"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "Every included production and test site"
      aggregation_rule: "Sum final waste by material and destination per accepted net product mass"
      quality_evidence: "Non-conformance closure, weigh tickets, manifests, recycler receipts, and accepted-output reconciliation"
    - protocol_id: cp_configuration_and_test
      process_id: "configuration_test"
      flow_role: "Identity, RF performance qualifiers, test duration, electricity, and acceptance"
      record_type: "Configuration control, serial/lot records, test scripts, calibrated RF and power meters, and test-cell energy meter"
      raw_fields: "serial_or_lot; intended_use; no_receiver_confirmation; standard_waveform; frequency_band; rated_rf_output; input_power_by_load; duty_profile; pa_technology; psu_topology; cooling_boundary; start_time; end_time; test_kWh; pass_fail"
      collection_method: "Run approved test plan; record RF output and AC input at declared load points; meter included cooling auxiliaries; link results to configuration"
      unit: "W or kW, kWh, h, %, and categorical fields"
      frequency: "Every accepted configuration and production lot"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "Every included test cell and site"
      aggregation_rule: "Aggregate measured test energy over accepted units; retain distribution of power/load points and failures"
      quality_evidence: "Calibration certificates, approved test procedure, raw test files, configuration approval, and pass/fail records"
    - protocol_id: cp_dispatch_and_packaging
      process_id: "packaging_dispatch"
      flow_role: "Net equipment, accessories, spares, packaging, and delivery state"
      record_type: "Packing lists, scales, packaging issue records, and shipment release"
      raw_fields: "shipment_id; configuration_id; net_equipment_mass; accessories_mass; spares_mass; packaging_material; packaging_mass; reusable_flag; gross_mass; delivery_boundary; incoterm_or_equivalent; destination_if_included"
      collection_method: "Weigh net product and gross shipment; reconcile material-specific packaging and included accessories/spares"
      unit: "kg"
      frequency: "Each shipment; aggregate for reporting period"
      temporal_coverage: "Entire declared reporting period"
      site_scope: "Every included dispatch site"
      aggregation_rule: "Net equipment mass defines reference product; packaging and included accessories remain separately reported"
      quality_evidence: "Calibrated scale records, signed packing list, packaging issue record, and shipment release"
    - protocol_id: cp_direct_emissions
      process_id: "all_required_processes"
      flow_role: "Direct emissions crossing the environment boundary"
      record_type: "Stack or workplace controls where applicable, permit reports, material-loss records, and site environmental records"
      raw_fields: "substance; Tiangong_flow_id; medium; measured_amount; unit; method; process; period; allocation_driver"
      collection_method: "Use substance-specific measured or officially reported data; document non-applicability instead of assuming zero"
      unit: "Substance-compatible mass or volume unit"
      frequency: "Per measurement campaign or reporting interval"
      temporal_coverage: "Full applicable monitoring period within the declared reporting period"
      site_scope: "Every included site with potentially applicable direct emissions"
      aggregation_rule: "Allocate only after process/site totals and driver are documented; normalize to accepted product mass"
      quality_evidence: "Laboratory report, monitoring calibration, permit submission, and material balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = reporting-period attributable amount / accepted net mass of reference product in the same period"
      inputs:
        - "Attributable flow amount"
        - "accepted net product mass"
      output: "Amount per 1 kg reference product"
      source_ids:
        - etsi-es-203199-2025
    - id: calc_component_balance
      applies_to: "Each configuration and reporting-period mix"
      rule: "external material inputs = installed accepted-product mass + final process waste + inventory change + returned material, subject to documented measurement uncertainty; internal transfers cancel once"
      inputs:
        - "BOM and material transactions"
        - "accepted mass"
        - waste
        - returns
        - "opening and closing inventory"
      output: "Mass-balance check and unexplained difference"
      source_ids:
        - etsi-es-203199-2025
    - id: calc_shared_energy
      applies_to: "Shared manufacturing or test energy"
      rule: "attributable kWh = net shared kWh x declared product driver / total driver; direct-metered energy takes precedence"
      inputs:
        - "Shared meter intervals"
        - baseline
        - "machine/test hours"
        - "board area"
        - "or accepted mass"
      output: "Allocated process kWh by product family or configuration"
      source_ids:
        - etsi-es-203199-2025
    - id: calc_test_energy
      applies_to: "Acceptance test"
      rule: "test kWh = metered test-cell kWh - documented unrelated baseline; included cooling auxiliaries remain inside the test boundary"
      inputs:
        - "Test-cell meter"
        - timestamps
        - baseline
        - "pass/fail and rework records"
      output: "Test electricity per accepted net product mass"
      source_ids:
        - etsi-es-203199-2025
        - rohde-schwarz-thu9-efficiency
        - broadcast-electronics-am-series-2025
    - id: calc_operating_profile_metadata
      applies_to: "Downstream use scenario metadata"
      rule: "preserve measured input power by declared load point and combine with declared time fractions only in a downstream use model; fractions shall sum to one over the scenario period"
      inputs:
        - "Input power by load point"
        - "duty/load fractions"
        - "operating hours"
        - "cooling boundary"
      output: "Separately reported downstream operational-energy scenario, not manufacturing inventory"
      source_ids:
        - etsi-es-203199-2025
  data_quality_requirements:
    - id: dq_semantic_identity
      applies_to: "Product family and every configuration"
      requirement: "Demonstrate transmit-only function and absence of incorporated reception apparatus; document incidental control or monitoring interfaces and excluded receive-chain products."
      evidence: "Approved product architecture, functional specification, BOM, and configuration-control record"
    - id: dq_configuration_coverage
      applies_to: "Reporting-period production mix"
      requirement: "Cover configurations representing the declared accepted production mass; report excluded configurations and their mass share without using one model as a category proxy."
      evidence: "Production ledger, configuration list, accepted mass, and coverage calculation"
    - id: dq_hardware_detail
      applies_to: "BOM and black-box modules"
      requirement: "Identify RF PA technology/modules, power supplies and redundancy, cooling configuration and coolant, chassis/rack/cabinet, PCBAs, and included accessories or spares."
      evidence: "Controlled BOM, supplier specifications, drawings, and packing lists"
    - id: dq_energy
      applies_to: "Assembly, integration, and test energy"
      requirement: "Prefer primary metered data, document meter boundary and electricity supply, and retain load-point and duty-profile data separately from manufacturing energy."
      evidence: "Meter data, calibration, baseline study, test scripts, and allocation worksheet"
    - id: dq_mass_balance
      applies_to: "Material inputs, product, and wastes"
      requirement: "Reconcile installed mass, accepted output, process wastes, returns, and inventory changes; investigate material unexplained differences."
      evidence: "BOM reconciliation, scale records, waste tickets, and calculation output"
    - id: dq_temporal_geography
      applies_to: "All foreground and upstream data"
      requirement: "Use data representative of the declared production period and sites; identify supplier proxies, technology vintage, and geographic electricity and material datasets."
      evidence: "Data-quality assessment and source metadata"
    - id: dq_cutoff_and_completeness
      applies_to: "All unit processes and flows"
      requirement: "Assess mass, energy, and environmental significance cumulatively and document exclusions; do not omit semiconductors, PCBAs, power electronics, cooling hardware, or metals solely because of low mass."
      evidence: "Completeness checklist, cut-off register, and sensitivity or proxy assessment"
    - id: dq_delivery_state
      applies_to: "Reference product and packaging"
      requirement: "State factory-gate dispatch condition, firmware/test status, included modules/accessories/spares, net and gross mass, packaging, and whether any downstream transport is separately included."
      evidence: "Packing list, shipment release, scale record, and dataset boundary statement"
validation_rules:
  - rule_id: validate_identity_no_receiver
    applies_to: "Product identity"
    rule: "The dataset shall use the exact reference product flow, represent transmit-only apparatus, and contain no configuration with incorporated reception or transceiver functionality."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "The reference output shall equal 1 kg net accepted equipment after normalization; transport packaging shall not be included in reference-product mass."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Intended use, standard/waveform, frequency band, rated RF output, input power/load points, duty/load profile, PA technology, PSU topology, cooling, chassis/board configuration, coverage, test state, and delivery boundary shall all be present."
    source_ids:
      - etsi-es-203199-2025
      - rohde-schwarz-thu9-efficiency
      - broadcast-electronics-am-series-2025
  - rule_id: validate_process_coverage
    applies_to: "Process inventory"
    rule: "All five required processes shall be represented by foreground records or disclosed supplier black-box datasets; internal transfers shall not be double counted."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: validate_mass_balance
    applies_to: "Materials, product, and wastes"
    rule: "Installed components, accepted net product, rejects, returns, inventory changes, packaging, and waste destinations shall reconcile within documented measurement uncertainty."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: validate_energy_boundary
    applies_to: "Manufacturing and test electricity"
    rule: "Energy records shall identify process, meter boundary, period, site electricity supply, allocation driver, and included cooling auxiliaries; downstream operating energy shall remain separate."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: validate_family_representativeness
    applies_to: "Product mix"
    rule: "A production-mix dataset shall disclose configuration coverage by accepted mass and rated-power band; a single configuration shall be labelled as such and shall not be presented as the category average."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: validate_delivery_state
    applies_to: "Final product"
    rule: "Net equipment, included accessories/spares, packaging, firmware/test status, dispatch state, and any delivery extension shall match packing and shipment records."
    source_ids:
      - etsi-es-203199-2025
  - rule_id: validate_cutoffs_sources
    applies_to: "Completeness and evidence"
    rule: "Every cut-off, proxy, allocation, provisional range, and public source shall be disclosed; provisional reasoned estimates shall not replace available foreground records and shall be flagged for replacement."
    source_ids:
      - etsi-es-203199-2025
      - itu-t-l1410-2024
published_dataset_profile:
  dataset_role: "Foreground production dataset for finished transmit-only apparatus"
  downstream_use: "May be published as a secondary_dataset or background_dataset for equipment production in ICT network, broadcasting, wireless-link, infrastructure, or capital-goods studies"
  allowed_use: "Manufacturer-gate equipment production when semantic identity, configuration coverage, performance qualifiers, boundary, geography, period, and delivery state match the study"
  excluded_use: "Apparatus incorporating reception; operational electricity without a separate measured use scenario; antenna, feeder, tower, building, installation, maintenance, or end-of-life burdens not explicitly added; category-wide comparison based on an undisclosed single model"
  required_metadata: "Canonical PCR id; product-flow UUID; CPC reference; manufacturer and sites; production period; product-family/configuration mix; transmit-only evidence; intended use; standard/waveform; frequency band; rated RF output and input-power load points; duty/load profile; RF PA, PSU, cooling, chassis and board configuration; included accessories/spares; net and gross mass; packaging; test/firmware state; delivery boundary; allocation and cut-offs"
  required_quality_disclosure: "Foreground coverage; metering and scale quality; BOM and mass-balance result; supplier black-box and proxy share; configuration representativeness; waste destinations; data age and geography; uncertainty; unresolved UUIDs or flow choices; provisional reasoned-estimate ranges replaced or retained"
  update_trigger: "Material change in product-family composition, transmission standard or frequency coverage, PA or power-supply technology, cooling architecture, chassis/board design, test regime, production site or energy supply, delivery state, allocation, source evidence, or Tiangong reference identity"
data_sources:
  - id: "unsd-cpc-v3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 Explanatory Notes, updated 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-09)"
    used_for: "Official category identity and separation of transmit-only apparatus from apparatus incorporating reception"
  - id: "etsi-es-203199-2025"
    type: "standard"
    reference: "ETSI ES 203 199 V1.4.1 (2025-01), Environmental Engineering; Methodology for environmental Life Cycle Assessment of ICT goods, networks and services, https://www.etsi.org/deliver/etsi_es/203100_203199/203199/01.04.01_60/es_203199v010401p.pdf (retrieved 2026-08-09)"
    used_for: "ICT functional unit and system-boundary principles; parts, PCB/PCBA, mechanics, black-box modules, assembly, packaging, transport, primary data, cut-off, allocation, energy, data quality, and reporting rules"
  - id: "itu-t-l1410-2024"
    type: "standard"
    reference: "ITU-T Recommendation L.1410 (11/2024), Methodology for environmental life cycle assessments of information and communication technology goods, networks and services, https://www.itu.int/rec/T-REC-L.1410-202411-I (retrieved 2026-08-09)"
    used_for: "ICT life-cycle framework, unit-process and goods/network context, and separation of production and downstream life-cycle stages"
  - id: "rohde-schwarz-thu9-efficiency"
    type: "handbook"
