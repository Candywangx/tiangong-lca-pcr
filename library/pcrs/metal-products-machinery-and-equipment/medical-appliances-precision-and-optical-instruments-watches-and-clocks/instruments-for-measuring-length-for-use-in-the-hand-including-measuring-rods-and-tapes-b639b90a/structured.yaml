      requirement: "Preserve model, family, indication type, measuring range, scale interval or resolution, accuracy or maximum permissible error, material construction, net mass, and packaging identity."
      evidence: "Product specification, bill of materials, inspection record, and un-cpc-3-0-structure-2025; use oiml-r35-1-2007-amd-2014, iso-13385-1-2019, or iso-3611-2023 as applicable"
