allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_operations"
    rule: "Subdivide and meter instrument families, batches, and operations whenever technically feasible. Use allocation only for genuinely shared exchanges that cannot be separately measured."
    source_ids: []
  - rule_id: allocation_physical_mass
    applies_to: "residual_shared_exchanges"
    rule: "Allocate residual shared material, energy, water, and waste exchanges by conforming net instrument mass. If mass does not represent the causal driver, document and use a measured driver such as equipment runtime, cycle count, or occupied process time."
    source_ids: []
  - rule_id: allocation_scrap_no_credit
    applies_to: "exported_scrap_and_waste"
    rule: "Report each exported waste at its measured mass and destination. Do not subtract revenue or avoided virgin production from foreground exchanges; any recycling substitution or end-of-life credit belongs in a separately disclosed downstream model."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "rejected_instruments_and_rework"
    rule: "Assign rework exchanges to the recovered conforming output and assign discarded rejects to the production batch that generated them. Disclose reject and rework masses; do not count rejected units as reference product."
    source_ids: []
