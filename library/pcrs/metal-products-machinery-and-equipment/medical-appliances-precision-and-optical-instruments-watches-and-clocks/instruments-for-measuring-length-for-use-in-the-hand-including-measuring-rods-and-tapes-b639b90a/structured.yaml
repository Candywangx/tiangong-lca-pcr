      evidence: "Traceability chain, calibration or verification record, uncertainty budget following jcgm-100-2008"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Confirm applicability of every row and document omitted materials, surface treatments, coatings, electronics, batteries, packaging components, wastes, and direct elementary emissions. Add each applicable omitted exchange as one atomic row."
      evidence: "Applicability checklist, bill of materials, process walk-through, waste register, and permit review"
validation_rules:
  - rule_id: validate_identity_and_qualifiers
    applies_to: "reference_product"
    rule: "Reject a data package missing instrument family, model, indication type, measuring range, scale interval or resolution, accuracy or maximum permissible error, net mass, construction, factory geography, production period, or conformity basis."
    source_ids:
      - un-cpc-3-0-structure-2025
      - oiml-r35-1-2007-amd-2014
      - iso-13385-1-2019
      - iso-3611-2023
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "Confirm that the denominator is conforming net instrument mass, excludes packaging and rejects, and equals the sum of batch-level conforming product records after allocation."
    source_ids: []
  - rule_id: validate_boundary_and_routes
    applies_to: "process_coverage"
    rule: "Confirm inclusion of all applicable fabrication, marking or finishing, assembly, verification or calibration, and packaging operations; confirm that conditional material and waste rows are activated only for the declared route."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "inventory_rows"
    rule: "Confirm that each exchange is one physical, chemical, waste, or energy flow with direction, flow type, property, unit, amount rule, protocol, and route condition. Reject umbrella or combined exchanges."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "tiangong_references"
    rule: "For every populated UUID, confirm public state 100, exact baseName, flow type, classification, product state, property, unit group, and route suitability. Keep unresolved UUID cells blank rather than substituting proxies."
    source_ids: []
  - rule_id: validate_reconciliation
    applies_to: "foreground_records"
    rule: "Reconcile mass, electricity, water, production, reject, and waste records to the same site and period; disclose coverage, allocation, inventory changes, and unexplained differences."
    source_ids: []
  - rule_id: validate_metrological_evidence
    applies_to: "final_verification_or_calibration"
    rule: "Confirm that claimed calibration or conformity is supported by model-specific results, traceability, environmental conditions, acceptance criteria, and a stated uncertainty method where applicable."
    source_ids:
      - oiml-r35-1-2007-amd-2014
      - iso-13385-1-2019
      - iso-3611-2023
      - jcgm-100-2008
published_dataset_profile:
  dataset_role: "Foreground cradle-to-factory-gate production dataset for a declared hand-held length-measuring instrument family and manufacturing route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprint, comparative screening, supply-chain modelling, and lifecyclemodel construction when instrument function, route, geography, period, and boundary are compatible"
  excluded_use: "Unqualified comparison across different instrument families, measuring ranges, accuracy levels, service lives, construction routes, or system boundaries; representation of use, maintenance, distribution, or end-of-life without explicit extension"
  required_metadata: "PCR id and version; instrument family and model; indication type; measuring range; scale interval or resolution; accuracy or maximum permissible error; principal materials and recycled content; net mass; packaging; factory geography; production period; electricity mix; process route; verification or calibration basis; expected service life; allocation; cut-offs; source and protocol ids"
  required_quality_disclosure: "Temporal and site coverage; foreground versus upstream status; meter and scale calibration; material, energy, water, and waste reconciliation; sampling and allocation; uncertainty and traceability for claimed calibration; unresolved UUIDs or range evidence; exclusions and data gaps"
  update_trigger: "Material change to model construction, supplier mix, recycled content, fabrication or marking technology, electronics, packaging, electricity mix, site, allocation, calibration or verification basis, waste treatment, or a change exceeding the producer's documented significance threshold"
