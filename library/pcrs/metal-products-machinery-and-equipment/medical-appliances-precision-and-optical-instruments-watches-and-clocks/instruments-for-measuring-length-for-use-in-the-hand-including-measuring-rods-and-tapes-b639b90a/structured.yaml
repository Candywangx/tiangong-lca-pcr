  calculation_rules:
    - id: calc_net_material_input
      applies_to: "Each purchased material and consumable"
      rule: "net input = purchases or issues + opening stock - closing stock - documented returns"
      inputs:
        - "Purchase or issue mass"
        - "opening stock"
        - "closing stock"
        - returns
        - "batch linkage"
      output: "Net kg input per reporting period and per kg reference flow"
      source_ids: []
    - id: calc_normalized_exchange
      applies_to: "Every inventory exchange"
      rule: "normalized exchange = exchange attributable to conforming production / conforming net instrument mass"
      inputs:
        - "Atomic exchange record"
        - "allocation driver where needed"
        - "conforming net instrument mass"
      output: "kg or MJ exchange per 1 kg reference flow"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "All electricity rows"
      rule: "MJ = metered kWh × 3.6; retain original kWh and meter boundary"
      inputs:
        - "Metered or allocated kWh"
      output: "MJ electricity per 1 kg reference flow"
      source_ids: []
    - id: calc_waste_inventory_change
      applies_to: "Stored waste outputs"
      rule: "generated waste = dispatched mass + closing stored mass - opening stored mass - documented incoming third-party waste"
      inputs:
        - "Scale tickets"
        - "opening and closing inventory"
        - "third-party receipts"
      output: "kg generated waste per 1 kg reference flow"
      source_ids: []
    - id: calc_uncertainty_report
      applies_to: "Metrological verification or calibration result"
      rule: "Identify input quantities, evaluate standard uncertainties, combine them through the declared measurement model, and state expanded uncertainty with coverage factor and coverage probability."
      inputs:
        - "Calibration standard certificate"
        - "repeat observations"
        - resolution
        - "environmental conditions"
        - "measurement model"
      output: "Traceable uncertainty statement linked to the batch or model"
      source_ids:
        - jcgm-100-2008
