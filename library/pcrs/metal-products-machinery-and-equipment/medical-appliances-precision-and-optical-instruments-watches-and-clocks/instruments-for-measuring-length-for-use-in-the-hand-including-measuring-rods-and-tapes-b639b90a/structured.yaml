measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product and all normalized inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net mass from conforming finished instruments after final verification and before packaging. Exclude packaging, rejected units, fixtures, and calibration artefacts. Normalize batch exchanges by total conforming net instrument mass."
  - id: electricity_energy
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve meter readings and allocation basis. Convert kWh to MJ using exactly 3.6 MJ per kWh; do not mix site generation, purchased electricity, and exported electricity."
  - id: water_mass_conversion
    applies_to: "Process water and cleaning wastewater"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer direct mass measurement. When volume is measured, retain volume, temperature, and the stated density source used for conversion; do not silently assume density."
  - id: material_and_waste_mass
    applies_to: "Material inputs and segregated wastes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record as-received input mass and as-dispatched waste mass by declared composition and state. Do not net scrap value, recycling credit, moisture, or attached fluid from the physical mass record."
