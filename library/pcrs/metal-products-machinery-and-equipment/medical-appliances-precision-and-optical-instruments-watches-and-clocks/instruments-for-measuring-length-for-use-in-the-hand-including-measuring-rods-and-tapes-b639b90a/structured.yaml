    reference: "ISO 13385-1:2019, Geometrical product specifications — Dimensional measuring equipment — Part 1: Design and metrological characteristics of callipers, https://committee.iso.org/standard/71149.html?browse=tc (retrieved 2026-09-07)"
    used_for: "Calliper analogue, dial, and digital variants and required design or metrological-characteristic disclosure"
  - id: "iso-3611-2023"
