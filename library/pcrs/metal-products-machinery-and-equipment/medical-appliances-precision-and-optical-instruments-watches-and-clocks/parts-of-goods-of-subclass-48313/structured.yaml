validation_rules:
  - rule_id: validation_reference
    applies_to: "Reference flow"
    rule: "Confirm finished_frame_part is exactly 1 kg net accepted part mass and excludes packaging, rejects, and complete frames or eyewear."
    source_ids: []
  - rule_id: validation_qualifiers
    applies_to: "Dataset metadata"
    rule: "Reject a data package that omits any required qualifier listed in section 3."
    source_ids: []
  - rule_id: validation_atomicity
    applies_to: "Process inventory"
    rule: "Confirm every exchange is one concrete product, waste, or elementary flow; reject umbrella materials, combined utilities, combined wastes, and unspecified emissions."
    source_ids: []
  - rule_id: validation_conditions
    applies_to: "Conditional routes"
    rule: "Confirm each conditional material, chemical, waste, and emission row is present when its named route occurs and absent or explicitly not applicable when that route demonstrably does not occur."
    source_ids: []
  - rule_id: validation_internal_transfer
    applies_to: "unpacked_frame_part_output; unpacked_frame_part_input"
    rule: "Reconcile the two internal-transfer amounts and explain any measured loss without counting the transfer as an external product input or output."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "Manufacturing lot"
    rule: "Recalculate calc_mass_reconciliation; report the unexplained difference and declared measurement uncertainty rather than forcing the balance."
    source_ids: []
  - rule_id: validation_emissions
    applies_to: "nmvoc_to_air; pm25_to_air"
    rule: "Confirm direct emissions are based on representative foreground measurements or a complete documented material balance and are not copied from upstream energy datasets."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "Shared process records"
    rule: "Reproduce each allocation from the original total, driver population, formula, and factor and confirm that allocated amounts sum to the original total."
    source_ids: []
  - rule_id: validation_sources
    applies_to: "Classification and external evidence"
    rule: "Confirm the cited official classification locator resolves to the declared CPC identities; treat all quantitative ranges as unresolved until the two-independent-source rule is met."
    source_ids:
      - un-cpc-3-0-structure-2025
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground production dataset suitable for release as a secondary_dataset or background_dataset after review"
  downstream_use: "Assembly models for spectacles, goggles, and similar eyewear; frame or mounting production models; supply-chain and product-footprint studies needing separately supplied component manufacture"
  allowed_use: "Use for the declared part type, material grade, geometry, finish, technology, geography, and factory-gate boundary, or for an explicitly justified representative match"
  excluded_use: "Complete frames, complete spectacles or goggles, lenses, retail cases, repair services, dissimilar material routes without added atomic exchanges, or use-phase and end-of-life claims not modelled here"
  required_metadata: "Canonical PCR id; product and part identifiers; frame function; material composition and grade; drawing/specification; dimensions and tolerances; finish/coating; joining route; net-mass method; bill of materials; site and geography; technology; time and lot; upstream dataset matches; allocation; waste destinations; air and wastewater controls; packaging status; unresolved UUIDs"
  required_quality_disclosure: "Primary-record coverage; meter and scale calibration; count-to-mass sampling; mass reconciliation and uncertainty; shared-resource allocation; emission measurement or mass-balance method; data gaps; proxies; route conditions; representativeness; review status"
  update_trigger: "Change in part function, material family or grade, geometry, forming or joining technology, surface treatment or coating, abatement, site or grid geography, packaging, allocation driver, upstream dataset match, exact Tiangong flow identity, or evidence sufficient to establish a reviewed range"
