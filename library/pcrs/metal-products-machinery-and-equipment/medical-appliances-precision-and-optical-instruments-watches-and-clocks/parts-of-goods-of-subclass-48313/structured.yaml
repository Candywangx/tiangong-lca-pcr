measurement_rules:
  - id: reference_net_mass
    applies_to: "finished_frame_part"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine the net mass of accepted finished parts after all included finishing steps and before packaging; exclude boxes, separators, pallets, fixtures, and rejected parts."
  - id: count_to_mass
    applies_to: "Product and packaging records reported by item count"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts using a contemporaneous, documented average mass from a representative weighed sample for the same part or packaging specification; retain counts, sample size, weighing result, and conversion."
  - id: electricity_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered kWh and convert to MJ using exactly 3.6 MJ per kWh; disclose the meter boundary and any allocation from a shared meter."
  - id: water_mass
    applies_to: "process_water and finishing_wastewater"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer direct mass records; when volume is measured, convert with measured density at the recorded condition or a documented water-density assumption and retain the original volume."
  - id: mass_normalization
    applies_to: "Every mass-based inventory row"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg per kg reference flow"
    rule: "Normalize the lot quantity to 1 kg of accepted finished_frame_part; do not include the mass of rejects or packaging in the denominator."
