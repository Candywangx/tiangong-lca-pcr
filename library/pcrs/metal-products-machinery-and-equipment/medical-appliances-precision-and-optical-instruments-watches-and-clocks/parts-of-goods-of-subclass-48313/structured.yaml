allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared and multi-output operations"
    rule: "Avoid allocation by separately metering product-specific forming, finishing, inspection, rework, waste, and packaging operations whenever practicable."
    source_ids: []
  - rule_id: allocation_causal
    applies_to: "Unavoidable shared utility or process records"
    rule: "Use a documented physical driver that reflects causality, in this order when applicable: machine time and rated or measured demand, treated surface area, bath throughput, inspected count with verified part mass, then net accepted product mass."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Offcuts and metal scrap"
    rule: "Report scrap as a waste output at the point it leaves the foreground boundary. Do not subtract revenue or an avoided primary-material credit inside this gate-to-gate dataset; any recycling substitution belongs to the consistent downstream system model."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Rework loops"
    rule: "Assign measured rework inputs and wastes to the lot that generated the nonconformity; do not count internally reworked mass as a second product output."
    source_ids: []
  - rule_id: allocation_documentation
    applies_to: "Every allocated row"
    rule: "Retain the shared total, allocation population, driver values, formula, resulting factor, and reconciliation to the original record."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_stock
      process_id: "frame_part_manufacturing"
      flow_role: "cellulose_acetate_sheet; stainless_steel_wire"
      record_type: "purchase, issue, return, and stock records"
      raw_fields: "material identity; composition or grade; supplier; lot; opening stock; receipts; issues; unchanged returns; closing stock; mass"
      collection_method: "Reconcile lot-specific issues and returns to stock movement and production orders"
      unit: "kg"
      frequency: "Each issue and lot close"
      temporal_coverage: "Complete reporting lot and reconciliation period"
      site_scope: "All production lines making the declared part"
      aggregation_rule: "Net consumed mass = issues minus unchanged returns, reconciled to stock; normalize by accepted product mass"
      quality_evidence: "invoices; material certificates; calibrated scale records; signed stock reconciliation"
    - protocol_id: cp_electricity
      process_id: "frame_part_manufacturing"
      flow_role: "electricity"
      record_type: "electricity meter and production-hour records"
      raw_fields: "meter id; opening and closing reading; kWh; time; production order; shared loads; allocation driver"
      collection_method: "Read dedicated meters or allocate a reconciled shared meter with the declared causal driver"
      unit: "kWh and MJ"
      frequency: "At least each shift and lot close"
      temporal_coverage: "Complete lot plus shared-meter reconciliation period"
      site_scope: "Included manufacturing operations and attributable support equipment"
      aggregation_rule: "Subtract documented non-production loads, allocate shared use, convert kWh to MJ, normalize by accepted mass"
      quality_evidence: "meter calibration; bills; reading logs; allocation worksheet"
    - protocol_id: cp_water
      process_id: "frame_part_manufacturing"
      flow_role: "process_water"
      record_type: "water meter, tank, or batch-make-up records"
      raw_fields: "meter or vessel id; volume or mass; density basis; operation; lot; recirculation; make-up quantity"
      collection_method: "Measure only make-up water crossing the boundary; reconcile to bath and rinse records"
      unit: "kg or m3"
      frequency: "Each batch or daily, plus lot close"
      temporal_coverage: "Complete reporting lot"
      site_scope: "Included cleaning, rinsing, cooling, polishing, and bath make-up"
      aggregation_rule: "Convert volume to mass when needed, allocate shared use, normalize by accepted mass"
      quality_evidence: "meter or vessel calibration; batch sheets; density record; reconciliation"
    - protocol_id: cp_bath_chemicals
      process_id: "frame_part_manufacturing"
      flow_role: "sodium_hydroxide"
      record_type: "bath make-up, analysis, replenishment, issue, and return records"
      raw_fields: "product identity; solution mass; concentration; bath id; make-up; replenishment; return; lot"
      collection_method: "Reconcile issued solution to bath records and calculate dry chemical mass"
      unit: "kg solution and mass fraction"
      frequency: "Every make-up and replenishment"
      temporal_coverage: "Complete bath campaigns overlapping the reporting lot"
      site_scope: "Baths used for the declared part"
      aggregation_rule: "Dry NaOH mass = net solution mass multiplied by measured or supplier concentration; allocate by bath throughput when shared"
      quality_evidence: "supplier certificate; concentration test; calibrated scale; bath log"
    - protocol_id: cp_coating_material
      process_id: "frame_part_manufacturing"
      flow_role: "acrylic_varnish"
      record_type: "coating issue, return, formulation, and application records"
      raw_fields: "product identity; batch; issued mass; returned mass; non-volatile fraction; application route; coated part lot"
      collection_method: "Weigh issued and returned varnish and reconcile to coating operation"
      unit: "kg"
      frequency: "Each coating batch"
      temporal_coverage: "Complete coating batches for the reporting lot"
      site_scope: "Coating lines used for the declared part"
      aggregation_rule: "Net varnish input = issued minus verified unchanged return; normalize by accepted mass"
      quality_evidence: "supplier specification; scale calibration; batch sheet; issue-return reconciliation"
    - protocol_id: cp_production_transfer
      process_id: "frame_part_manufacturing_inspection_packaging"
      flow_role: "unpacked_frame_part_output; unpacked_frame_part_input"
      record_type: "production-order transfer records"
      raw_fields: "part id; lot; accepted status at transfer; count; sampled average mass or direct mass; sending and receiving timestamps"
