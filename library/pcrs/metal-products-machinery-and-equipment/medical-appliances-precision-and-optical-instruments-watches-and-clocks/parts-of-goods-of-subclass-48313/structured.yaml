  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "Every lot-level inventory amount"
      rule: "normalized amount = attributable lot amount / accepted net mass of finished_frame_part"
      inputs:
        - "attributable lot amount"
        - "accepted net product mass"
      output: "kg, MJ, or pollutant kg per 1 kg reference flow"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "electricity MJ = metered electricity kWh × 3.6; then apply the documented shared-meter allocation before normalization"
      inputs:
        - kWh
        - "allocation driver and factor"
        - "accepted net product mass"
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: calc_water_mass
      applies_to: "process_water; finishing_wastewater"
      rule: "water-stream mass = measured volume × documented density when direct mass is unavailable"
      inputs:
        - "measured volume"
        - "density and condition"
      output: "kg per 1 kg reference flow"
      source_ids: []
    - id: calc_dry_naoh
      applies_to: "sodium_hydroxide"
      rule: "dry NaOH mass = net solution mass × measured or supplier mass fraction of NaOH"
      inputs:
        - "issued solution mass"
        - "unchanged return"
        - "NaOH mass fraction"
      output: "kg dry NaOH per 1 kg reference flow"
      source_ids: []
    - id: calc_air_emissions
      applies_to: "nmvoc_to_air; pm25_to_air"
      rule: "For measurement, released mass = concentration × actual exhaust volume over the operating period. For an accepted material balance, released mass = relevant material input minus mass retained in product, collected as waste, recovered, or destroyed, with every term measured or documented."
      inputs:
        - concentration
        - "gas flow"
        - duration
        - "material input"
        - retained
        - recovered
        - waste
        - "and destroyed fractions"
        - "accepted net product mass"
      output: "kg pollutant per 1 kg reference flow"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "Manufacturing lot"
      rule: "material inputs = accepted and rejected product mass + separately measured waste and direct mass releases + documented stock change, within the declared measurement uncertainty"
      inputs:
        - "atomic material inputs"
        - products
        - wastes
        - "mass emissions"
        - "stock change"
        - uncertainty
      output: "reconciled mass-balance statement and unexplained difference"
      source_ids: []
