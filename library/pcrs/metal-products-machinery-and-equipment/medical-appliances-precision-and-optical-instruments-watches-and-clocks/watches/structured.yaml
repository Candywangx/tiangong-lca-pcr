validation_rules:
  - rule_id: validate_reference_output
    applies_to: "Reference flow"
    rule: "Confirm exactly one finished_watch reference output is reported as one accepted packaged item and that rejects do not increase the denominator."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-2-1-hs-correspondence-2013
  - rule_id: validate_route_exclusivity
    applies_to: "Band, strap, movement, and power inputs"
    rule: "Confirm only the material and power rows applicable to the declared product configuration carry amounts; justify any weighted product-family average with model-level quantities."
    source_ids:
      - casio-environmental-report-2003
      - hes-so-he-arc-mechanical-watch-eco-audit-2022
  - rule_id: validate_inventory_reconciliation
    applies_to: "Components, utilities, solvent, water, output, rework, and waste"
    rule: "Confirm all normalized values use the same accepted-watch denominator and period, and reconcile each protocol to source totals before normalization."
    source_ids: []
  - rule_id: validate_no_umbrella_flows
    applies_to: "Site-specific additions"
    rule: "Reject combined labels such as utilities, packaging materials, mixed chemicals, wastes and residues, or emissions to air; every added row must represent one physical or chemical exchange."
    source_ids: []
  - rule_id: validate_boundary_claim
    applies_to: "Dataset profile"
    rule: "A gate-to-gate dataset must not be presented as cradle-to-gate unless all required upstream component and supply datasets are linked; use, maintenance, transport, and end-of-life require separate downstream modelling."
    source_ids:
      - casio-environmental-report-2003
      - hes-so-he-arc-mechanical-watch-eco-audit-2022
  - rule_id: validate_unresolved_identities
    applies_to: "UUID-empty rows"
    rule: "Keep unresolved rows visible and do not publish an exact Tiangong identity until a public state-100 direct read confirms semantic identity, classification, flow type, property, unit group, product state, geography, technology, and general comment."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate watch assembly, testing, quality-release, and retail-unit packaging dataset"
  downstream_use: "May be linked as a secondary_dataset or background_dataset within a cradle-to-gate or full-life-cycle watch model after upstream component and supply datasets are added"
  allowed_use: "Product- and site-specific modelling of complete watches with matching movement technology, material configuration, power system, geography, reporting period, quality specification, and packaging"
  excluded_use: "Unqualified comparison across mechanical, quartz, solar, or connected products; use as a clock or watch-part dataset; representation of component manufacture, distribution, use, maintenance, or end-of-life without additional datasets"
  required_metadata: "Canonical PCR id; product model or family; CPC scope; movement and power technology; case, cover, and band or strap materials; accepted-watch count; factory geography; reporting period; included operations; packaging configuration; allocation drivers; UUID status; upstream dataset links"
  required_quality_disclosure: "Metering and weighing methods; calibration; BOM version; supplier data quality; temporal coverage; completeness and reconciliation; rejects and rework; solvent recovery; water recirculation; shared-load allocation; unresolved UUIDs; proxy upstream datasets"
  update_trigger: "Change in movement or power technology, case or strap material, supplier or BOM, manufacturing geography, cleaning or testing route, packaging configuration, allocation driver, or a material change in normalized inputs, rejects, or data quality"
