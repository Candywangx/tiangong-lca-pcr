  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and all exchanges"
      requirement: "Preserve product model, movement and power technology, component material configuration, supplier or source, flow state, and Tiangong UUID status; do not replace specific exchanges with generic utilities, materials, wastes, or emissions."
      evidence: "Approved product specification, BOM, supplier records, direct-read UUID audit, and unresolved-flow register"
