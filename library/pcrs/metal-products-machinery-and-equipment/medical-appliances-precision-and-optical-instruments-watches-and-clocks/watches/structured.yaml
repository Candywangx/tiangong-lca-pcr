allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Multi-product assembly and packaging operations"
    rule: "Avoid allocation by separate product bills of materials, accepted and reject counts, direct labor or machine records, and submetered utility data wherever practicable."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "Shared electricity, water, and directly supporting facility loads"
    rule: "Allocate only the residual shared amount using a documented physical driver that reflects consumption, such as measured machine hours, test cycles, or occupied equipment time; retain the total and reconciliation."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Internal rework"
    rule: "Assign rework inputs and losses to the product family that caused them and count only successfully released watches in the reference-product denominator."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "Recovered solvent, recyclable rejects, and waste treatment"
    rule: "Report recovered materials and wastes at the foreground boundary without netting avoided virgin-material or treatment credits into the foreground inventory; place substitution or recycling credits in an explicitly disclosed downstream scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "watch_final_assembly"
      flow_role: "movement, case, band or strap, and button-cell inputs"
      record_type: "approved bill of materials; receiving and issue records; supplier specifications; reject records"
      raw_fields: "component identity; material; supplier; lot; opening and closing stock; receipts; returns; issued mass or count; reject mass or count; product variant"
      collection_method: "Reconcile approved BOM to lot-level warehouse issues and physical or supplier-declared mass; separate mutually exclusive strap and power routes"
      unit: "kg and Item(s)"
      frequency: "Each production lot with monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "All lines and subcontracted steps controlled by the reporting assembly site"
      aggregation_rule: "Net issued quantity plus attributable rejected quantity divided by accepted watches of the matching variant"
      quality_evidence: "Approved BOM revision, calibrated balance records, warehouse reconciliation, supplier specifications, and variance investigation"
    - protocol_id: cp_solvent_records
      process_id: "watch_final_assembly"
      flow_role: "isopropanol input and spent-solution output"
      record_type: "purchase, inventory, recovery, and waste consignment records"
      raw_fields: "opening stock; receipts; closing stock; returned or recovered solvent; spent-solution mass; purity; water content; destination"
      collection_method: "Monthly solvent mass balance reconciled to cleaning operation records and waste dispatches"
      unit: "kg"
      frequency: "Monthly and each waste dispatch"
      temporal_coverage: "Same period as accepted-watch output"
      site_scope: "All included cleaning stations and on-site solvent recovery"
      aggregation_rule: "Net consumed input and off-site waste mass divided by accepted watches; unexplained balance disclosed"
      quality_evidence: "Calibrated stock measurement, purchase invoices, recovery logs, waste manifests, and mass-balance closure"
    - protocol_id: cp_electricity_metering
      process_id: "watch_final_assembly"
      flow_role: "assembly, testing, cleaning, packaging, and supporting electricity"
      record_type: "revenue meter, submeter, and equipment runtime records"
      raw_fields: "meter start and end; multiplier; equipment runtime; rated or measured load; production downtime; accepted watch count; grid contract"
      collection_method: "Prefer submeters; reconcile included submeters and allocated supporting loads to the facility meter"
      unit: "kWh and MJ"
      frequency: "Continuous or shift readings with monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "Included production lines and directly supporting facility loads"
      aggregation_rule: "Net included kWh converted to MJ and divided by accepted watches; residual shared load allocated by disclosed physical driver"
      quality_evidence: "Meter calibration, utility invoices, reconciliation, driver records, and documented conversion"
    - protocol_id: cp_water_metering
      process_id: "watch_final_assembly"
      flow_role: "cleaning and wet-test process water"
      record_type: "water meter, tank balance, batch log, and discharge record"
      raw_fields: "make-up water; drain volume or mass; recirculation inventory change; batch count; accepted watch count; reference conditions"
      collection_method: "Meter net make-up where possible; otherwise perform a documented tank balance without repeatedly counting recirculation"
      unit: "kg or m3 with conversion"
      frequency: "Each batch or monthly meter reconciliation"
      temporal_coverage: "Same period as accepted-watch output"
      site_scope: "Included cleaning and water-resistance test systems"
      aggregation_rule: "Net boundary-crossing water mass divided by accepted watches"
      quality_evidence: "Meter calibration, tank dimensions, density assumption, leak checks, and reconciliation"
    - protocol_id: cp_packaging_bom
      process_id: "watch_final_assembly"
      flow_role: "paper box and printed paper insert"
      record_type: "packaging BOM; receiving and issue records; supplier mass specifications"
      raw_fields: "packaging item identity; material; mass per item; issued count; returned count; rejected count; accepted watch count"
      collection_method: "Reconcile packaging BOM and issues to accepted retail units; record each additional non-paper component separately"
      unit: "kg and Item(s)"
      frequency: "Each packaging specification and monthly reconciliation"
      temporal_coverage: "Same period as accepted-watch output"
      site_scope: "All retail-unit packaging applied at the reporting site"
      aggregation_rule: "Net packaging mass issued plus attributable rejects divided by accepted watches using that configuration"
      quality_evidence: "Approved packaging specification, calibrated sample weighing, issue records, and reconciliation"
    - protocol_id: cp_output_and_rejects
      process_id: "watch_final_assembly"
      flow_role: "accepted finished watches and rejected assembled watches"
      record_type: "quality-release, production, rework, and waste records"
      raw_fields: "product model; movement route; material configuration; packaged accepted count; rejected count and mass; rework entry and release; waste destination"
      collection_method: "Reconcile final quality release to packaging and dispatch records; track rework until accepted output or waste exit"
      unit: "Item(s) and kg"
      frequency: "Each lot with monthly reconciliation"
      temporal_coverage: "Same period as all input protocols"
      site_scope: "All included final assembly and quality-release lines"
      aggregation_rule: "Accepted count is the denominator; only rejects leaving the system are waste outputs"
      quality_evidence: "Signed release records, test logs, rework genealogy, calibrated reject weighing, and dispatch manifests"
  calculation_rules:
    - id: calc_net_component_input
      applies_to: "Component and packaging input rows"
      rule: "(opening stock + receipts - closing stock - verified returns) / accepted watches of the matching configuration; reconcile against BOM and add separately measured attributable rejects when issue records exclude them"
      inputs:
        - inventory
        - receiving
        - return
        - BOM
        - reject
        - "and accepted-output records"
      output: "kg or Item(s) per accepted packaged watch"
      source_ids: []
    - id: calc_net_solvent_input
      applies_to: "isopropanol"
      rule: "(opening stock + receipts - closing stock - verified off-site returns - recovered solvent returned to stock) / accepted watches"
      inputs:
        - "solvent inventory"
        - receipts
        - returns
        - recovery
        - "and accepted-output records"
      output: "kg isopropanol input per accepted packaged watch"
      source_ids: []
    - id: calc_electricity_per_watch
      applies_to: "assembly_electricity"
      rule: "(submetered included electricity + reconciled shared supporting electricity) × 3.6 MJ/kWh / accepted watches"
      inputs:
        - meters
        - "allocation driver"
        - "and accepted-output records"
      output: "MJ per accepted packaged watch"
      source_ids: []
    - id: calc_net_process_water
      applies_to: "test_process_water"
      rule: "net make-up or boundary-crossing water mass / accepted watches; do not add internal recirculation volume"
      inputs:
        - "water meters or tank balance and accepted-output records"
      output: "kg per accepted packaged watch"
      source_ids: []
    - id: calc_waste_per_watch
