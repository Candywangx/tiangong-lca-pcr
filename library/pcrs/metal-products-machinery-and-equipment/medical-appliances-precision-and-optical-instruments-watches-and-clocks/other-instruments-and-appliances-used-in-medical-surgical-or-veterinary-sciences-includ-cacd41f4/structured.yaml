allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared manufacturing, clean-area, sterilization, and packaging operations"
    rule: "Avoid allocation by submetering or subdividing processes by device family, line, cycle, or load whenever technically feasible."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "Residual shared utilities and services"
    rule: "Allocate by the physical driver that causes consumption, such as machine time, occupied clean-area time, treated mass, chamber volume-time, packaging-line time, or tested units; document the selected driver and sensitivity."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "Rejected products and failed sterilization loads"
    rule: "Assign burdens through the point of rejection to total production and normalize to accepted output; disclose rework and resterilization separately."
    source_ids:
      - us-fda-sterilization-process-controls
  - rule_id: allocation_recycling
    applies_to: "Scrap and recovered materials"
    rule: "Use the study's declared recycling approach consistently; report gross scrap mass and destination and do not subtract an avoided-production credit directly from foreground material input."
    source_ids: []
  - rule_id: allocation_no_economic_default
    applies_to: "Multi-product sites"
    rule: "Do not use economic allocation unless physical subdivision or a causal physical driver is demonstrably unavailable; justify and sensitivity-test any economic allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_fabrication"
      flow_role: "polypropylene granulate; stainless steel"
      record_type: "ERP issue/return records and verified bill of materials"
      raw_fields: "material identity; grade; lot; issued mass; returned mass; accepted component mass"
      collection_method: "Reconcile issued and returned material by product order"
      unit: "kg"
      frequency: "Each batch or production order"
      temporal_coverage: "A production-representative reporting period; justify shorter or discontinuous coverage"
      site_scope: "Every fabrication site in scope"
      aggregation_rule: "Sum net issued mass by material and normalize to accepted finished-device mass"
      quality_evidence: "Purchase specification, lot traceability, calibrated scales, ERP reconciliation"
    - protocol_id: cp_component_utilities
      process_id: "component_fabrication"
      flow_role: "electricity; process water; carbon dioxide"
      record_type: "Submeters, machine logs, cylinder or tank records"
      raw_fields: "meter start/end; machine time; water recirculation; gas stock and deliveries; accepted output"
      collection_method: "Direct metering or documented mass balance with causal allocation"
      unit: "kWh; kg"
      frequency: "Each batch, shift, or meter period"
      temporal_coverage: "Same period as production denominator"
      site_scope: "Every fabrication site in scope"
      aggregation_rule: "Sum net use, allocate with recorded driver, then normalize"
      quality_evidence: "Meter calibration, utility invoices, machine logs, inventory reconciliation"
    - protocol_id: cp_component_scrap
      process_id: "component_fabrication"
      flow_role: "polypropylene waste; stainless-steel scrap"
      record_type: "Waste tickets, bins, weighbridge records"
      raw_fields: "material; alloy or polymer; mass; contamination; destination; internal regrind"
      collection_method: "Weigh each segregated outgoing stream"
      unit: "kg"
      frequency: "Each shipment or batch"
      temporal_coverage: "Same period as material input"
      site_scope: "Every fabrication site in scope"
      aggregation_rule: "Sum external boundary outputs by material and destination"
      quality_evidence: "Calibrated scale, waste transfer record, recycler receipt"
    - protocol_id: cp_assembly_inputs
      process_id: "assembly_cleaning_testing"
      flow_role: "isopropanol; sodium hydroxide"
      record_type: "Chemical issue, concentration, recovery, and inventory records"
      raw_fields: "chemical identity; purity; solution mass; concentration; opening/closing stock; recovery"
      collection_method: "Chemical mass balance by cleaning campaign"
      unit: "kg"
      frequency: "Each batch or campaign"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every assembly/cleaning site"
      aggregation_rule: "Calculate pure chemical consumption and normalize"
      quality_evidence: "Supplier certificate, formulation record, calibrated dosing record"
    - protocol_id: cp_assembly_utilities
      process_id: "assembly_cleaning_testing"
      flow_role: "process water; electricity"
      record_type: "Water and electricity submeters plus equipment logs"
      raw_fields: "meter start/end; recirculation; line time; clean-area occupancy; accepted output"
      collection_method: "Direct meter or causal allocation"
      unit: "kg; kWh"
      frequency: "Each batch, shift, or meter period"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Every assembly and test site"
      aggregation_rule: "Sum net use and normalize after conversion"
      quality_evidence: "Meter calibration, invoices, line records"
    - protocol_id: cp_cleaning_wastewater
      process_id: "assembly_cleaning_testing"
      flow_role: "wastewater"
      record_type: "Discharge meter and treatment records"
      raw_fields: "volume or mass; temperature; density; composition; internal treatment; destination"
      collection_method: "Measure each discharge or balanced treatment-system total"
      unit: "kg"
      frequency: "Each batch or daily"
      temporal_coverage: "Same period as cleaning inputs"
      site_scope: "Every discharge point in scope"
      aggregation_rule: "Sum net boundary discharge and normalize"
      quality_evidence: "Flow-meter calibration, sampling results, treatment log"
    - protocol_id: cp_eto_cycle
      process_id: "ethylene_oxide_sterilization"
      flow_role: "ethylene oxide; electricity"
      record_type: "Validated cycle and utility records"
      raw_fields: "product load mass; injected EtO; formulation; time; temperature; pressure; humidity; aeration; electricity; accepted and rejected mass"
      collection_method: "Capture each sterilization-cycle record and allocate only to accepted load output"
      unit: "kg; kWh"
      frequency: "Each cycle"
      temporal_coverage: "All cycles in the reporting period"
      site_scope: "Each in-house or contracted EtO facility"
      aggregation_rule: "Sum allocated inputs and normalize to accepted sterilized mass"
      quality_evidence: "Approved validation, cycle chart, calibrated sensors, load-release record"
    - protocol_id: cp_eto_emissions
      process_id: "ethylene_oxide_sterilization"
      flow_role: "ethylene oxide to air"
      record_type: "Continuous monitoring, stack tests, leak surveys, or validated mass balance"
      raw_fields: "vent identity; measured concentration; flow; duration; capture efficiency; fugitive release; load id"
      collection_method: "Quantify each release point with the permitted validated method"
      unit: "kg"
      frequency: "Each cycle or regulatory monitoring period"
      temporal_coverage: "Same period as EtO input"
      site_scope: "All controlled and fugitive release points"
      aggregation_rule: "Sum direct air releases and allocate to accepted loads"
      quality_evidence: "Monitoring QA/QC, calibration, regulatory report"
    - protocol_id: cp_steam_cycle
      process_id: "steam_sterilization"
      flow_role: "process steam; electricity"
      record_type: "Validated cycle, steam meter, condensate meter, and electricity meter"
      raw_fields: "load mass; steam in; condensate returned; cycle parameters; electricity; accepted and rejected mass"
      collection_method: "Capture each cycle and meter balance"
      unit: "kg; kWh"
      frequency: "Each cycle"
      temporal_coverage: "All cycles in the reporting period"
      site_scope: "Each steam-sterilization facility"
      aggregation_rule: "Sum net steam and allocated electricity; normalize to accepted sterilized mass"
      quality_evidence: "Approved validation, calibrated meters, cycle and release records"
    - protocol_id: cp_irradiation_service
      process_id: "irradiation_sterilization"
      flow_role: "irradiation sterilization service"
      record_type: "Contract treatment and invoice records"
      raw_fields: "technology; facility; load id; treated mass; dose; load allocation; accepted and rejected mass"
      collection_method: "Reconcile service records with returned released product"
      unit: "kg treated device"
      frequency: "Each load"
      temporal_coverage: "All loads in the reporting period"
      site_scope: "Every contracted or in-house irradiation facility"
      aggregation_rule: "Sum treated mass allocated to accepted output"
      quality_evidence: "Dose record, service certificate, receipt and release reconciliation"
    - protocol_id: cp_packaging_materials
      process_id: "packaging_release"
      flow_role: "paper box; polyethylene film"
      record_type: "Packaging specification, issue record, and sample weighing"
      raw_fields: "material identity; specification; item count; sample masses; scrap; packaged units"
      collection_method: "Weigh representative current-specification samples and reconcile issued counts"
      unit: "kg"
      frequency: "Each specification change and monthly reconciliation"
      temporal_coverage: "Same period as packaged output"
      site_scope: "Every packaging site"
      aggregation_rule: "Average verified item mass times used count, normalized to net device mass"
      quality_evidence: "Approved packaging specification, calibrated scale, line reconciliation"
    - protocol_id: cp_packaging_utilities
      process_id: "packaging_release"
      flow_role: "electricity"
      record_type: "Submeter and packaging-line records"
      raw_fields: "meter start/end; line time; packaged units; accepted output"
      collection_method: "Direct meter or line-time allocation"
      unit: "kWh"
      frequency: "Each shift or meter period"
      temporal_coverage: "Same period as packaged output"
      site_scope: "Every packaging site"
      aggregation_rule: "Sum allocated electricity and normalize"
      quality_evidence: "Meter calibration, line log, invoice reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every non-reference inventory row"
      rule: "normalized amount = attributable period amount / net accepted finished-device mass in the same period"
      inputs:
        - "attributable flow amount"
        - "accepted net device mass"
      output: "flow amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity rows"
      rule: "MJ = measured kWh × 3.6"
      inputs:
        - "measured kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_solution_active_mass
      applies_to: "Sodium hydroxide"
      rule: "pure sodium-hydroxide mass = solution mass × measured or supplier-certified mass fraction"
      inputs:
        - "solution mass"
        - "sodium-hydroxide mass fraction"
      output: "kg sodium hydroxide"
      source_ids: []
    - id: calc_water_mass
      applies_to: "Process water and wastewater"
      rule: "mass = measured volume × applicable documented density; retain both source volume and density"
      inputs:
        - volume
        - temperature
        - density
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_load_allocation
      applies_to: "Sterilization inputs, services, and emissions"
      rule: "allocated amount = cycle total × declared causal share of accepted product in the load"
      inputs:
        - "cycle total"
        - "load composition"
        - "accepted mass"
        - "causal allocation driver"
      output: "amount attributable to the declared product"
      source_ids:
        - us-fda-sterilization-process-controls
    - id: calc_packaging_mass
      applies_to: "Paper box and polyethylene film"
      rule: "packaging mass = verified average item mass × items used for accepted product"
      inputs:
        - "sample masses"
        - "used item count"
        - "accepted device mass"
      output: "kg packaging per 1 kg reference product"
      source_ids:
        - eu-mdr-2017-745
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Product model or homogeneous family, intended use, net mass, sterile state, reuse state, and packaging configuration shall be traceable to released production records."
      evidence: "Approved specification, device history or batch record, release record"
    - id: dq_material_completeness
      applies_to: "Bill of materials"
      requirement: "Reconcile the complete net product mass by identified atomic materials; explain and conservatively model any unreconciled remainder without an umbrella inventory row."
      evidence: "Mass-reconciled bill of materials and supplier specifications"
    - id: dq_temporal_alignment
      applies_to: "All foreground rows"
      requirement: "Numerators and accepted-output denominators shall cover the same period; disclose shutdowns, start-up, abnormal batches, and excluded periods."
      evidence: "Timestamped meters, production records, reconciliation worksheet"
    - id: dq_site_coverage
      applies_to: "Multi-site and outsourced production"
      requirement: "Include every site and contracted operation that materially contributes to the declared factory-gate product or quantify and justify exclusions."
      evidence: "Site list, contracts, transfer records, coverage calculation"
    - id: dq_sterilization_traceability
      applies_to: "Sterile routes"
      requirement: "Link each accepted load to validated cycle parameters, packaging integrity controls, monitoring, rejects, and release evidence."
      evidence: "Validation approval, cycle record, monitoring results, packaging integrity and release records"
    - id: dq_uuid_disclosure
      applies_to: "Unresolved flow identities"
      requirement: "Keep the four declared UUID gaps explicit and do not substitute a proxy UUID; update only after a new direct state-100 audit."
      evidence: "Manifest unresolved register and task-bound search receipts"
    - id: dq_range_disclosure
      applies_to: "Important flows without external ranges"
      requirement: "Treat the amount as foreground-required and disclose that no cross-product default or QA range is authorized until two independent compatible sources or reviewed foreground evidence exist."
      evidence: "Manifest range-evidence register and foreground collection records"
validation_rules:
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm that the output is exactly 1 kg net conforming device mass and that all inventory rows use the same accepted-output denominator."
    source_ids: []
  - rule_id: validate_identity_and_route
    applies_to: "Dataset metadata and process map"
    rule: "Confirm one concrete device specification, material route, sterile state, sterilization method, packaging configuration, geography, and reporting period; reject a generic category average lacking these qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
      - us-fda-qmsr-2026
  - rule_id: validate_process_applicability
    applies_to: "Conditional processes and rows"
    rule: "Confirm each conditional material, cleaning chemical, sterilization route, and packaging item is either supported by records or explicitly not applicable; do not populate mutually exclusive sterilization routes simultaneously without documented split production."
    source_ids:
      - us-fda-sterilization-process-controls
  - rule_id: validate_mass_reconciliation
    applies_to: "Materials, product, and wastes"
    rule: "Reconcile issued materials, returned inventory, accepted product, rejects, scrap, recovered material, and stock change; investigate unexplained imbalance."
    source_ids: []
  - rule_id: validate_eto_emissions
    applies_to: "EtO sterilization"
    rule: "Confirm direct EtO air releases cover controlled and fugitive points and remain separate from upstream energy emissions."
    source_ids:
      - us-epa-ethylene-oxide-neshap
  - rule_id: validate_packaging_separation
    applies_to: "Reference product and packaging"
    rule: "Confirm packaging mass is excluded from net reference-product mass and each present packaging material is recorded separately."
    source_ids:
      - eu-mdr-2017-745
  - rule_id: validate_no_proxy_uuid
    applies_to: "All UUID-bearing rows"
    rule: "Confirm every stored UUID matches the selected state-100 identity, flow type, property, and unit support; unresolved rows shall remain UUID-empty."
    source_ids: []
  - rule_id: validate_source_ranges
    applies_to: "Quantitative ranges"
    rule: "Reject any externally inferred range unless at least two mutually independent original sources have compatible system boundary, functional unit, and product state; no external ranges are authorized in this candidate PCR."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; may be used as background_dataset only for a matching declared device specification and route"
  downstream_use: "Foreground-data-package publication and downstream process or lifecyclemodel construction for cradle-to-factory-gate assessment"
  allowed_use: "Comparison or modelling of the same device model or homogeneous family with compatible material, sterile-state, sterilization, packaging, geography, technology, allocation, and reference-year qualifiers"
  excluded_use: "Generic substitution for all CPC 48150 products; clinical-procedure comparison without use-stage function and lifetime modelling; proxy for excluded medical-device categories; use of unresolved UUID rows as database matches"
  required_metadata: "Canonical PCR id and version; product model or family; intended use; net mass; bill of materials; disposable/reusable and passive/powered states; sterile state and route; packaging configuration; sites and geography; reporting period; accepted output; allocation; data coverage; unresolved identities"
  required_quality_disclosure: "Primary-data share; mass reconciliation; metering and allocation methods; site and supplier coverage; sterilization validation and monitoring basis; rejects and rework; packaging mass separation; unresolved UUIDs; absence of externally authorized ranges"
  update_trigger: "Material or supplier change; product redesign; new manufacturing site or technology; sterilization or packaging change; allocation change; updated foreground year; new exact Tiangong UUID; two-source range synthesis; boundary or regulation change"
