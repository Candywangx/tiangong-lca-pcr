allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared production, utilities, buildings, test equipment, and waste systems"
    rule: "First avoid allocation by submetering, separate batch records, equipment-time records, or subdivision of independently measured processes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "Shared processes that cannot be subdivided"
    rule: "Use a causal physical driver such as machine time, test-chamber time, energy metering, occupied area-time, or mass throughput when it represents resource use. Document the driver, period, denominator, and products sharing the process."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Shared processes without a defensible physical relationship"
    rule: "Economic allocation may be used only as a documented fallback. Record prices, currency, price period, product quantities, and sensitivity to the allocation choice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "Rework and repeated test loops"
    rule: "Keep the original material burden with the instrument batch and add only the incremental energy, consumables, emissions, and waste from each rework or repeated-test loop. Do not count the same instrument mass as a new purchased input."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Scrap and waste leaving the foreground system"
    rule: "Record gross scrap and waste quantities and treatment routes. Do not subtract avoided burdens or recycled-content credits inside the foreground manufacturing inventory unless the downstream study applies and documents a separate consistent recycling method."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "materials_components_preparation"
      flow_role: "Purchased and internally fabricated materials, components, and subassemblies"
      record_type: "BOM, purchase receipt, issue record, stock ledger"
      raw_fields: "part_id; material_or_component_name; supplier; quantity; unit; measured_unit_mass; batch; product_configuration; opening_stock; closing_stock; returns"
      collection_method: "Product-specific BOM reconciled with receipts, issues, returns, and stock change"
      unit: "kg and original record unit"
      frequency: "Each batch; monthly reconciliation"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Every included manufacturing site and outsourced controlled operation"
      aggregation_rule: "Sum net consumption by item and configuration; convert to kg; assign to product using direct records before allocation"
      quality_evidence: "Approved BOM revision; scale calibration; stock reconciliation; supplier traceability; variance explanation"
    - protocol_id: cp_consumables
      process_id: "instrument_assembly"
      flow_role: "Preparation, fabrication, assembly, cleaning, filling, and finishing consumables"
      record_type: "Issue log, meter, purchase and stock record"
      raw_fields: "consumable_id; function; batch; issued_quantity; returned_quantity; opening_stock; closing_stock; unit; density_if_volume_to_mass; process_id"
      collection_method: "Metered or stock-reconciled consumption linked to process and batch"
      unit: "selected flow reference unit"
      frequency: "Each batch or monthly"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Every included manufacturing site"
      aggregation_rule: "Net consumption equals issues plus opening stock minus returns and closing stock; allocate only documented shared remainder"
      quality_evidence: "Meter calibration; stock reconciliation; SDS or product identity; allocation record"
    - protocol_id: cp_process_energy
      process_id: "instrument_assembly"
      flow_role: "Electricity, fuels, compressed air, and thermal services"
      record_type: "Meter, invoice, equipment log"
      raw_fields: "energy_carrier; meter_id; start_reading; end_reading; unit; process_id; equipment_time; reporting_period; allocation_driver"
      collection_method: "Submetering preferred; otherwise reconcile site energy and allocate with a causal driver"
      unit: "kWh, MJ, or selected flow reference unit"
      frequency: "Continuous or monthly"
      temporal_coverage: "At least one representative production year, or justified shorter campaign"
      site_scope: "Every included manufacturing site"
      aggregation_rule: "Net metered consumption minus excluded loads; assign by process and product with documented causal driver; normalize to reference output"
      quality_evidence: "Meter calibration; invoice reconciliation; excluded-load list; allocation worksheet"
    - protocol_id: cp_production_output
      process_id: "finishing_packaging"
      flow_role: "Internal transfers, conforming output, nonconforming output, and production mix"
      record_type: "Production and transfer log; scale record"
      raw_fields: "product_id; configuration; quantity; gross_mass; packaging_mass; net_mass; pass_status; batch; process_id; timestamp"
      collection_method: "Calibrated weighing or reconciled count multiplied by measured product-specific unit mass"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same representative reporting period as inputs"
      site_scope: "Every included manufacturing site"
      aggregation_rule: "Sum conforming output using the declared packaging convention; preserve nonconforming and rework dispositions separately"
      quality_evidence: "Scale calibration; count-mass reconciliation; batch release record; packaging convention"
    - protocol_id: cp_waste_rejects
      process_id: "instrument_assembly"
      flow_role: "Rejects, scrap, residues, packaging waste, and treatment transfers"
      record_type: "Waste scale ticket, reject log, transporter receipt"
      raw_fields: "waste_id; material; hazardous_status; source_process; mass; unit; disposition; treatment_provider; batch; date"
      collection_method: "Weigh by waste stream and reconcile with reject and shipment records"
      unit: "kg"
      frequency: "Each shipment and batch; monthly reconciliation"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Every included manufacturing site"
      aggregation_rule: "Sum by source process, material, hazardous status, and treatment route; exclude internal rework transfers from final waste until discarded"
      quality_evidence: "Scale ticket; licensed treatment receipt where applicable; hazardous classification; mass-balance reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "instrument_assembly"
      flow_role: "Direct emissions to air, water, and soil"
      record_type: "Continuous monitor, stack or wastewater test, permit calculation"
      raw_fields: "substance; compartment; concentration; flow_rate; operating_time; activity_amount; factor; factor_source; control_efficiency; process_id"
      collection_method: "Direct measurement preferred; otherwise calculate from collected activity and a documented factor"
      unit: "kg of substance and original measurement unit"
      frequency: "As required by monitoring method; aggregate monthly"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Every included emitting source"
      aggregation_rule: "Convert measured concentration and flow or activity times factor to mass; subtract only measured control removal; assign to process"
      quality_evidence: "Instrument calibration; laboratory report; permit method; factor reference; uncertainty record"
    - protocol_id: cp_configuration_records
      process_id: "firmware_configuration"
      flow_role: "Software or firmware loading, configuration, and disposition"
      record_type: "Configuration station log"
      raw_fields: "product_id; hardware_revision; software_or_firmware_id; configuration_id; start_time; end_time; pass_status; rework_count; energy_assignment"
      collection_method: "Export controlled configuration records and reconcile to production batches"
      unit: "unit count, kg, and kWh when allocated"
      frequency: "Each configured unit or batch"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Each included configuration station"
      aggregation_rule: "Count unique units by final status; record repeat operations as rework; normalize assigned energy to configured output"
      quality_evidence: "Configuration checksum or revision; station log; batch reconciliation; disposition record"
    - protocol_id: cp_test_calibration
      process_id: "calibration_testing"
      flow_role: "Calibration, functional or environmental testing, pass/rework/reject disposition, energy, and consumables"
      record_type: "Test-system export, calibration certificate, chamber log"
      raw_fields: "product_id; technology; test_method; specification_revision; measured_value; unit; acceptance_limit; equipment_id; calibration_status; start_time; end_time; pass_status; rework_count; energy; consumables"
      collection_method: "Export test results and reconcile to released and rejected production units"
      unit: "test-specific unit, unit count, kg, kWh, and consumable reference unit"
      frequency: "Each tested unit or statistically justified batch"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Every included test route and outsourced controlled test"
      aggregation_rule: "Preserve raw test values; count each unit once in final disposition; add repeated-test activity without duplicating instrument mass"
      quality_evidence: "Equipment calibration; method revision; acceptance record; traceable disposition; ISO/IEC or manufacturer specification when applicable"
    - protocol_id: cp_packaging_output
      process_id: "finishing_packaging"
      flow_role: "Sales packaging, documentation, included accessories, and final packaged output"
      record_type: "Packaging BOM, issue record, final scale record"
      raw_fields: "package_id; material; item_count; unit_mass; included_accessory; document_mass; product_id; gross_packaged_mass; reusable_transport_packaging_mass"
      collection_method: "Product-specific packaging BOM reconciled with issues and final weighing"
      unit: "kg"
      frequency: "Each packaging configuration and batch"
      temporal_coverage: "Same representative reporting period as output"
      site_scope: "Every included finishing and packaging site"
      aggregation_rule: "Sum single-use packaging and declared included items; exclude reusable transport packaging only when separately tracked and disclosed"
      quality_evidence: "Packaging BOM revision; scale calibration; issue reconciliation; mass convention approval"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground inventory amount"
      rule: "normalized amount = reporting-period amount / conforming packaged output mass"
      inputs:
        - "Collected or calculated reporting-period amount"
        - "conforming packaged output mass from cp_production_output and cp_packaging_output"
      output: "Amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_count_to_mass
      applies_to: "Component, instrument, reject, or packaging records reported by count"
      rule: "mass = item count × product-specific measured mean unit mass; retain sampling plan and variability"
      inputs:
        - "Item count"
        - "calibrated measured unit masses"
        - "configuration identity"
      output: "kg by configuration and disposition"
      source_ids: []
    - id: calc_stock_reconciliation
      applies_to: "Materials and consumables without direct metering"
      rule: "consumption = opening stock + receipts - closing stock - documented returns - documented transfers outside scope"
      inputs:
        - "Stock ledger"
        - receipts
        - returns
        - transfers
        - "reporting period"
      output: "Net foreground consumption"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_direct_emission
      applies_to: "Factor-based direct emissions"
      rule: "emission mass = collected activity × documented emission factor × (1 - measured control efficiency); preserve original units and conversions"
      inputs:
        - "Activity record"
        - factor
        - "control efficiency"
        - "unit conversion"
      output: "kg substance by compartment"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_balance
      applies_to: "Each process and reporting-period foreground package"
      rule: "Compare mass inputs with product, waste, measured direct-emission, stock-change, and documented evaporation outputs; investigate and disclose residual rather than forcing closure"
      inputs:
        - "Material and product inputs"
        - outputs
        - wastes
        - "direct emissions"
        - "stock change"
      output: "Mass-balance residual and reconciliation statement"
      source_ids: []
    - id: calc_shared_resource_allocation
      applies_to: "Shared energy, utilities, buildings, and test equipment"
      rule: "allocated amount = shared amount × declared causal driver for the product / sum of the same driver for all products sharing the resource"
      inputs:
        - "Shared total"
        - "product driver"
        - "total driver"
        - period
        - "product list"
      output: "Allocated foreground activity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_rework_increment
      applies_to: "Rework and repeated tests"
      rule: "Add only incremental rework energy, consumables, emissions, and waste to the original batch; instrument mass remains one continuous internal transfer"
      inputs:
        - "Rework log"
        - "repeated-test log"
        - "incremental resource records"
        - "final disposition"
      output: "Rework-adjusted process inventory without duplicate product mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and product mix"
      requirement: "Match the Tiangong UUID and CPC 48211 scope; declare all required qualifiers and exclude adjacent product classes."
      evidence: "Dataset metadata; product specification; classification review; reference-flow comment"
    - id: dq_completeness
      applies_to: "Foreground process inventory"
      requirement: "Cover all known material, energy, water, product, co-product, waste, and direct-emission flows for included processes; list exclusions and data gaps explicitly."
      evidence: "Process map; reconciled ledgers; meter list; waste register; emission register; exclusion log"
    - id: dq_temporal
      applies_to: "Inputs, outputs, and allocation drivers"
      requirement: "Use the same representative reporting period, normally at least 12 consecutive months or a justified complete production campaign; disclose abnormal shutdowns or start-up conditions."
      evidence: "Timestamped records; production calendar; period justification"
    - id: dq_technology
      applies_to: "Instrument route and test route"
      requirement: "Data shall represent the declared magnetic, gyroscopic, electromechanical, or electronic technology and delivered configuration; mixed routes require disclosed shares."
      evidence: "BOM revision; route sheet; equipment list; configuration and test records"
    - id: dq_geography
      applies_to: "Manufacturing and upstream links"
      requirement: "Identify every included site and outsourced controlled operation; upstream datasets shall disclose geography and proxy limitations."
      evidence: "Site list; supplier records; dataset metadata; proxy register"
    - id: dq_precision
      applies_to: "Measurements and calculated quantities"
      requirement: "Retain instrument calibration, sampling, count-to-mass variability, factor uncertainty, and reconciliation residuals sufficient to review each material quantity."
      evidence: "Calibration certificates; sampling plan; raw measurements; uncertainty and reconciliation records"
    - id: dq_allocation
      applies_to: "Shared resources and multi-output processes"
      requirement: "Record the hierarchy applied, driver, denominator, product population, period, and sensitivity when allocation is material."
      evidence: "Submeter records; allocation worksheet; price or physical-driver evidence; sensitivity result"
    - id: dq_traceability
      applies_to: "Product-specific BOM, configuration, test, waste, and output"
      requirement: "Maintain a batch or reporting-period chain from purchased inputs through configuration and test disposition to final output and waste treatment."
      evidence: "BOM and batch records; configuration checksum; test export; waste tickets; release record"
    - id: dq_review
      applies_to: "Dataset release"
      requirement: "An independent reviewer shall be able to reproduce normalization, mass balance, allocation, reference-flow identity, and all declared limitations from retained evidence."
      evidence: "Review checklist; calculation workbook; source register; versioned foreground package"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm product flow UUID 186ab31c-d8f5-48e2-86d2-e415b035e0a3, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg; reject a package with a different or missing identity."
    source_ids: []
  - rule_id: validation_scope_qualifiers
    applies_to: "Product identity"
    rule: "Confirm CPC 48211 scope and every required qualifier, including technology, navigation function, application, performance/test basis, configuration, software or firmware status, mass convention, geography, period, and product mix."
    source_ids:
      - unsd-cpc-3-0
      - iso-25862-2019
      - iso-8728-2024
      - iec-60945-2002
  - rule_id: validation_process_coverage
    applies_to: "Process map and inventory"
    rule: "Confirm all required processes are present, every applicable conditional process is included, outsourced controlled operations are disclosed, and all detailed process IDs match the process map."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_bom_output_reconciliation
    applies_to: "Materials, components, packaging, and output"
    rule: "Confirm product-specific BOM and packaging records reconcile to conforming output, rejects, wastes, stock change, and the disclosed mass-balance residual."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_energy_emissions
    applies_to: "Energy and direct emissions"
    rule: "Confirm energy records cover included equipment and support loads and each direct emission is measured or calculated from collected activity using a documented factor; unresolved sources or units fail the affected check."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_test_traceability
    applies_to: "Calibration and testing"
    rule: "Confirm the applicable specification or manufacturer test basis, equipment calibration status, measured result, acceptance limit, and final disposition are traceable for the declared instrument route."
    source_ids:
      - iso-25862-2019
      - iso-8728-2024
      - iec-60945-2002
  - rule_id: validation_allocation
    applies_to: "Shared and multifunctional processes"
    rule: "Confirm subdivision was considered first and any remaining allocation has a reproducible causal physical driver or documented fallback with sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_no_silent_cutoff
    applies_to: "Exclusions and data gaps"
    rule: "Confirm exclusions, unavailable background data, and cut-offs are explicit and justified; any silent omission makes validation inconclusive."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_electronic_eol_disclosure
    applies_to: "Electrical or electronic configurations when downstream end of life is modelled"
    rule: "Confirm component, material, and hazardous-substance information needed for treatment modelling is retained and the downstream scenario is separate from foreground manufacturing."
    source_ids:
      - eu-weee-2012-19
published_dataset_profile:
  dataset_role: "Product-specific or disclosed production-mix foreground manufacturing dataset for a finished CPC 48211 instrument"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product carbon-footprint or LCA studies that require a traceable manufacturing-stage dataset and whose product technology, configuration, geography, period, and mass convention match the declared scope"
  excluded_use: "Direct comparison of materially different navigation technologies or performance classes without functional adjustment; use-stage, installation, maintenance, or end-of-life claims not represented by connected downstream datasets; adjacent CPC categories"
  required_metadata: "PCR id and version; product flow UUID; CPC code; instrument technology and navigation function; platform or application; performance/test basis; configuration and included accessories; software or firmware status; packaging convention; site and geography; reporting period; product mix; process coverage; allocation; upstream dataset references"
  required_quality_disclosure: "Primary-data share; temporal, geographical, and technological representativeness; BOM and output reconciliation; mass-balance residual; metering and allocation methods; test and calibration traceability; exclusions; data gaps; proxy datasets; uncertainty; review status"
  update_trigger: "Change in product technology, BOM, configuration, software or firmware affecting manufacturing, performance/test route, site, supplier mix, energy mix, allocation, packaging convention, waste treatment, applicable standard, or reporting period that materially changes the inventory or qualifiers"
