    rule: "Allocate using a documented causal physical driver such as machine time, metered energy, processed mass, occupied controlled-environment time, or test duration that represents resource use; retain the driver values and calculation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship_last
    applies_to: "Shared burdens lacking a defensible physical driver"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision, system expansion, and physical allocation are not feasible; disclose the method and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_scrap
    applies_to: "Rework loops, rejects, scrap, and waste"
    rule: "Attribute all repeated processing, test energy, consumables, and waste generated before product release to the released product population; keep saleable co-products separate and apply the hierarchy above."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "component_fabrication"
      flow_role: "Fabrication materials and components"
      record_type: "Bill of materials, purchase and material-issue records"
      raw_fields: "part number; description; supplier; material class; quantity issued; measured unit mass; returned quantity; product model; lot"
      collection_method: "Reconcile product-specific BoM with stores issues and returns"
      unit: "kg and item"
      frequency: "Each production lot with period reconciliation"
      temporal_coverage: "Declared representative production period"
      site_scope: "All included fabrication operations at the reporting site"
      aggregation_rule: "Sum net issued mass by identity; allocate only shared issues using the declared physical driver; normalize to released net product mass"
      quality_evidence: "Approved BoM revision, weighing records, issue and return records, supplier declaration"
    - protocol_id: cp_fabrication_energy
      process_id: "component_fabrication"
      flow_role: "Fabrication electricity and fuels"
      record_type: "Submeter, equipment log, fuel invoice, operating record"
      raw_fields: "energy carrier; meter readings; equipment; operating time; load; product lot; shared allocation driver"
      collection_method: "Prefer submetering; otherwise reconcile facility records and apply a causal physical driver"
      unit: "kWh, MJ, or native fuel unit"
      frequency: "Per meter interval or production lot"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Included fabrication equipment and controlled areas"
      aggregation_rule: "Sum direct readings plus allocated shared energy; convert with documented factors; normalize to released net product mass"
      quality_evidence: "Meter calibration or invoice, equipment log, allocation calculation"
    - protocol_id: cp_fabrication_consumables
      process_id: "component_fabrication"
      flow_role: "Process aids, chemicals, gases, and water"
      record_type: "Issue, purchase, batch, and meter records"
      raw_fields: "substance or mixture; supplier; grade; quantity issued; beginning and ending inventory; returned quantity; water meter; lot"
      collection_method: "Measure or inventory-reconcile each consumed input"
      unit: "kg, L, m3, or native unit"
      frequency: "Each issue or meter interval"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included fabrication operations"
      aggregation_rule: "Net consumption equals beginning inventory plus receipts minus ending inventory and documented returns; normalize to released net product mass"
      quality_evidence: "Stock reconciliation, batch record, meter record, safety or supplier data sheet"
    - protocol_id: cp_fabrication_output_waste
      process_id: "component_fabrication"
      flow_role: "Conforming subassemblies and fabrication waste"
      record_type: "Transfer, inspection, and waste shipment records"
      raw_fields: "output identity; accepted quantity; unit mass; reject quantity; waste composition; container tare and gross mass; treatment route"
      collection_method: "Weigh accepted outputs and waste or use verified item-to-mass conversion"
      unit: "kg or m3"
      frequency: "Each lot and waste shipment"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included fabrication operations"
      aggregation_rule: "Sum accepted output and waste by identity; reconcile with material inputs and inventory changes"
      quality_evidence: "Transfer record, inspection status, calibrated scale record, waste manifest"
    - protocol_id: cp_fabrication_direct_emissions
      process_id: "component_fabrication"
      flow_role: "Direct releases"
      record_type: "Stack, wastewater, permit, and activity-factor records"
      raw_fields: "substance; compartment; concentration; flow rate; duration; activity amount; factor; capture fraction"
      collection_method: "Direct measurement preferred; otherwise calculate from collected activity and documented applicable factor"
      unit: "kg or source measurement unit"
      frequency: "Each monitoring interval or operating batch"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included direct emission points"
      aggregation_rule: "Sum measured releases or activity multiplied by factor and uncaptured fraction; avoid double counting treatment datasets"
      quality_evidence: "Laboratory report, monitor calibration, permit report, factor reference and calculation"
    - protocol_id: cp_assembly_bom
      process_id: "final_assembly"
      flow_role: "Purchased and fabricated assembly content"
      record_type: "Product-specific BoM and assembly issue records"
      raw_fields: "model; configuration; part number; supplier; purchased or fabricated origin; quantity; measured part mass; installed quantity; loss"
      collection_method: "Reconcile released configuration BoM with assembly issues and accepted output"
      unit: "kg and item"
      frequency: "Each model revision and production lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "All included assembly lines"
      aggregation_rule: "Sum installed mass by part identity and origin; normalize to released net product mass"
      quality_evidence: "Approved BoM and engineering change level, scale records, issue records"
    - protocol_id: cp_assembly_energy
      process_id: "final_assembly"
      flow_role: "Assembly energy"
      record_type: "Submeter and equipment operating records"
      raw_fields: "meter readings; equipment; operating time; load; line; model; lot; shared driver"
      collection_method: "Prefer line or equipment submetering; otherwise allocate shared energy by causal physical driver"
      unit: "kWh or MJ"
      frequency: "Per meter interval or production lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included assembly equipment and controlled areas"
      aggregation_rule: "Sum direct and allocated shared energy; normalize to released net product mass"
      quality_evidence: "Meter record, equipment log, allocation calculation"
    - protocol_id: cp_assembly_consumables_waste
      process_id: "final_assembly"
      flow_role: "Assembly consumables and waste"
      record_type: "Issue and waste records"
      raw_fields: "consumable identity; issued and returned quantity; waste identity; gross and tare mass; treatment route; lot"
      collection_method: "Inventory reconciliation and weighed waste records"
      unit: "kg, L, or native unit"
      frequency: "Each lot and waste shipment"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included assembly lines"
      aggregation_rule: "Calculate net consumable use and sum waste by route; normalize to released net product mass"
      quality_evidence: "Issue record, scale record, waste manifest"
    - protocol_id: cp_assembly_output
      process_id: "final_assembly"
      flow_role: "Assembled instrument output"
      record_type: "Production transfer and weighing records"
      raw_fields: "model; configuration; accepted count; net unit mass; total mass; transfer time"
      collection_method: "Count accepted units and use measured model-specific mass"
      unit: "kg and item"
      frequency: "Each production lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included assembly lines"
      aggregation_rule: "Accepted count multiplied by verified unit mass; reconcile to testing input"
      quality_evidence: "Transfer record, calibrated scale record, configuration record"
    - protocol_id: cp_test_route_records
      process_id: "calibration_release_testing"
      flow_role: "Test route, input, repeats, and rework"
      record_type: "Manufacturing execution and test routing records"
      raw_fields: "serial or lot; model; test steps; entry count; repeat count; rework route; final status; net mass"
      collection_method: "Extract actual route and status records, including repeated tests"
      unit: "item, cycle, h, and kg"
      frequency: "Each unit or production lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "All included release-test stations and rework loops"
      aggregation_rule: "Sum initial and repeat entries and convert items to mass using verified model mass"
      quality_evidence: "Traceable route history, test system record, rework disposition"
    - protocol_id: cp_test_energy_media
      process_id: "calibration_release_testing"
      flow_role: "Test energy, calibration media, and spent media"
      record_type: "Submeter, equipment, issue, and disposal records"
      raw_fields: "test station; meter readings; runtime; load; medium identity; quantity issued; recovered quantity; waste quantity; test cycle"
      collection_method: "Meter energy and measure issued and recovered media for all initial and repeat tests"
      unit: "kWh, kg, L, m3, or native unit"
      frequency: "Each test batch or meter interval"
      temporal_coverage: "Declared representative production period"
      site_scope: "All included test and burn-in stations"
      aggregation_rule: "Sum energy and net medium consumption, including repeats; normalize to released net product mass"
      quality_evidence: "Meter record, issue record, equipment log, waste record"
    - protocol_id: cp_calibration_release_records
      process_id: "calibration_release_testing"
      flow_role: "Conforming tested output"
      record_type: "Calibration, verification, and release records"
      raw_fields: "model; serial or lot; measured quantity; range; resolution; accuracy or uncertainty; procedure revision; reference standard; result; release status; net mass"
      collection_method: "Retain the actual release evidence for the declared configuration"
      unit: "item and kg"
      frequency: "Each unit or defined release lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "All included release-test stations"
      aggregation_rule: "Sum released net mass only for conforming status; preserve failed and reworked populations separately"
      quality_evidence: "Signed or controlled electronic test record, reference-standard status, scale record"
    - protocol_id: cp_test_direct_emissions
      process_id: "calibration_release_testing"
      flow_role: "Direct releases from test media"
      record_type: "Medium use, recovery, discharge, and emission calculation records"
      raw_fields: "substance; quantity charged; quantity recovered; waste quantity; release fraction; compartment; factor"
      collection_method: "Mass balance preferred; direct measurement when available"
      unit: "kg or source measurement unit"
      frequency: "Each test batch or discharge interval"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included test emission points"
      aggregation_rule: "Released amount equals charged amount minus recovered, retained, and waste-managed amount, or direct measured release"
      quality_evidence: "Batch record, recovery record, discharge report, factor and calculation"
    - protocol_id: cp_product_mass_release
      process_id: "packaging_factory_gate"
      flow_role: "Net released product mass"
      record_type: "Final weighing and release records"
      raw_fields: "model; configuration; included accessories; serial or lot; gross packed mass; packaging mass; net product mass; released quantity"
      collection_method: "Weigh net product directly or subtract separately measured packaging from gross mass"
      unit: "kg and item"
      frequency: "Each model and production lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "Final release operation"
      aggregation_rule: "Sum released net product mass; use it as the normalization denominator"
      quality_evidence: "Calibrated scale record, release record, configuration list"
    - protocol_id: cp_packaging_materials
      process_id: "packaging_factory_gate"
      flow_role: "Distribution packaging"
      record_type: "Packaging BoM, purchase, and weighing records"
      raw_fields: "material class; supplier; recycled-content claim; quantity per pack; measured unit mass; model; packing configuration"
      collection_method: "Reconcile packaging BoM with issued quantities and measured masses"
      unit: "kg and item"
      frequency: "Each packaging configuration and lot"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included packaging operations"
      aggregation_rule: "Sum packaging mass by material class; normalize to released net product mass without adding packaging to the denominator"
      quality_evidence: "Packaging specification, scale record, supplier declaration"
    - protocol_id: cp_packaging_energy_waste
      process_id: "packaging_factory_gate"
      flow_role: "Packaging energy and waste"
      record_type: "Meter, issue, and waste records"
      raw_fields: "electricity; meter interval; equipment; operating time; waste material; gross and tare mass; treatment route"
      collection_method: "Meter or physically allocate electricity and weigh packaging waste"
      unit: "kWh and kg"
      frequency: "Per meter interval and waste shipment"
      temporal_coverage: "Declared representative production period"
      site_scope: "Included packaging and release operations"
      aggregation_rule: "Sum energy and waste by route; normalize to released net product mass"
      quality_evidence: "Meter record, equipment log, scale record, waste manifest"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "normalized amount = period exchange amount divided by period net mass of conforming released products"
      inputs:
        - "collected exchange amount"
        - "released net product mass from cp_product_mass_release"
      output: "exchange amount per 1 kg net released finished product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_item_to_mass
      applies_to: "Item-count records"
      rule: "mass = accepted or consumed item count multiplied by measured model-specific unit mass; a model-family mean must be production-mass-weighted and its population disclosed"
      inputs:
        - "item count"
        - "unit mass"
        - "model population"
      output: "kg by product or component identity"
      source_ids: []
    - id: calc_shared_resource_allocation
      applies_to: "Shared utilities and operations"
      rule: "apply direct metering first; otherwise multiply shared total by the documented causal physical-driver share for the declared product"
      inputs:
        - "shared total"
        - "product driver value"
        - "total driver value"
      output: "allocated product-specific resource or emission amount"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_material_reconciliation
      applies_to: "Each manufacturing process"
      rule: "inputs plus opening work-in-process shall reconcile with conforming output, transfers, closing work-in-process, rework, waste, and measured direct releases; investigate and disclose residuals"
      inputs:
        - "material inputs"
        - "opening and closing inventory"
        - "product transfers"
        - rework
        - waste
        - "direct releases"
      output: "mass-balance residual and completeness check"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_test_medium_release
      applies_to: "Calibration or test media with direct release"
      rule: "direct release = charged or consumed amount minus recovered amount minus amount retained in product or equipment minus waste-managed amount, unless directly measured"
      inputs:
        - "charged amount"
        - "recovered amount"
        - "retained amount"
        - "waste amount"
        - "direct measurement"
      output: "direct elementary flow amount"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all product outputs"
      requirement: "Preserve model, configuration, included accessories, measured quantity or analytical principle, range, resolution, accuracy or uncertainty statement, release basis, net mass, and packaging status."
      evidence: "Controlled product specification, BoM revision, release and weighing records"
    - id: dq_complete_inventory
      applies_to: "Each foreground process"
      requirement: "Include all known inputs and outputs and complete material reconciliation; disclose each exclusion, proxy, unresolved residual, and missing upstream link."
      evidence: "Process inventory, reconciliation calculation, data-gap register; eu-pef-2021-2279"
    - id: dq_temporal_scope
      applies_to: "All foreground records"
      requirement: "Use one declared representative production period covering the included route; identify shutdowns, start-up, abnormal lots, engineering trials, and production-mix weighting and justify inclusion or exclusion."
      evidence: "Meter periods, production ledger, lot list, exception log"
    - id: dq_measurement_traceability
      applies_to: "Mass, energy, water, emissions, and test records"
      requirement: "Retain instrument identity, calibration or verification status, measurement unit, conversion factor, data owner, and extraction time for every material measurement chain."
      evidence: "Calibration certificates, meter and scale logs, controlled calculation"
    - id: dq_supplier_material_identity
      applies_to: "Purchased electrical, electronic, sensing, optical, and mechanical content"
      requirement: "Retain supplier and part identity, material class and mass, and available material declarations; for electrotechnical content, preserve the declaration scope and revision rather than inferring unreported substances."
      evidence: "Supplier specification or IEC 62474-compatible declaration; iec-62474-2018"
    - id: dq_representativeness
      applies_to: "Foreground and linked upstream data"
      requirement: "Assess and disclose technological, geographical, temporal, and precision representativeness; use product-specific BoM and company-specific manufacturing data."
      evidence: "Data-quality assessment and source metadata; eu-pef-2021-2279"
    - id: dq_release_traceability
      applies_to: "Calibration and release testing"
      requirement: "Demonstrate that the released product population meets the declared release criteria and that repeat tests, rework, and final rejects remain in the inventory."
      evidence: "Test route history, calibration or verification record, nonconformance and rework records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference product flow"
    rule: "Require the exact Tiangong product-flow UUID, Mass flow-property UUID, Units of mass UUID, and kg unit stated in Section 3; reject a substitute flow representing a component, consumable, service, or neighbouring instrument category."
    source_ids: []
  - rule_id: validate_scope_qualifiers
    applies_to: "Dataset identity"
    rule: "Require every Section 3 qualifier and verify that the principal product function is within CPC 48253; fail conformance when the measured quantity, model configuration, or packaging status is missing."
    source_ids:
      - un-cpc-3-0
  - rule_id: validate_reference_mass
    applies_to: "Normalization"
    rule: "Verify that all foreground amounts use 1 kg of released net product mass and that separately reported packaging is excluded from the denominator."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "Process inventory"
    rule: "Require final assembly, calibration or release testing, and packaging and release; require component fabrication whenever performed in-house and disclose purchased-versus-in-house component coverage."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_material_energy_waste_completeness
    applies_to: "Foreground inputs and outputs"
    rule: "Require product-specific BoM or component records, process energy, consumables, conforming output, rework, waste, and applicable direct emissions for every included process; unresolved residuals or omissions must be explicit findings."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Shared resources and multifunctional operations"
    rule: "Require direct metering or subdivision where feasible; otherwise require the physical driver, factor calculation, justification, and sensitivity or limitation disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_test_traceability
    applies_to: "Calibration and release testing"
    rule: "Require a controlled release procedure, reference-standard or test-system status where applicable, actual test result, final disposition, and inclusion of repeat-test and rework burdens."
    source_ids: []
  - rule_id: validate_supplier_declarations
    applies_to: "Purchased electrotechnical content"
    rule: "When material declarations are claimed or used, require supplier, part, declaration scope, list or standard revision, and declared material or substance information; do not treat missing entries as zero."
    source_ids:
      - iec-62474-2018
  - rule_id: validate_data_quality
    applies_to: "Published foreground data package"
    rule: "Require declared site, geography, production period, model weighting, data sources, upstream dataset links, proxy and gap disclosures, and technological, geographical, temporal, completeness, and precision evidence."
    source_ids:
      - eu-pef-2021-2279
      - iec-63366-2025
published_dataset_profile:
  dataset_role: "Product-specific or explicitly production-weighted model-family foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset for downstream product systems requiring factory-gate analytical or measurement instruments by mass"
  allowed_use: "Gate-to-gate manufacturing inventory and cradle-to-gate models that add representative upstream datasets; downstream life-cycle models that add explicit distribution, use, maintenance, and end-of-life scenarios"
  excluded_use: "Direct comparison of instruments with different measurement functions or performance; per-item use without a verified item-to-mass conversion; claims about service life, use-stage energy, consumables, maintenance, calibration interval, or end-of-life that are not modelled separately"
  required_metadata: "PCR id; product model or weighting rule; CPC scope; measured quantity or analytical principle; measurement range; resolution; accuracy or uncertainty statement; included accessories; power-supply type; release-test basis; net product mass; packaging status; site and geography; production period; in-house and purchased component split; process coverage; allocation methods; source and upstream dataset identities"
  required_quality_disclosure: "BoM and material-declaration coverage; mass-balance residuals; metering and allocation coverage; calibration and release-record coverage; temporal, technological, geographical, completeness, and precision assessment; proxy datasets; cut-offs; unresolved data gaps; reason for every omitted flow or process"
  update_trigger: "Product model or configuration change; BoM or supplier change; material declaration revision; manufacturing route or site change; energy supply change; calibration or release-test route change; packaging change; allocation-driver change; or evidence that materially changes the normalized inventory"
