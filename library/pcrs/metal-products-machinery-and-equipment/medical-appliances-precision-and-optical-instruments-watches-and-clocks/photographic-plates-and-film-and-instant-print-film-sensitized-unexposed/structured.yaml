allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared foreground processes"
    rule: "Prefer subdivision and direct metering by emulsion family, coating line, support type, format and packaging campaign before applying allocation."
    source_ids: []
  - rule_id: allocation_mass_or_area
    applies_to: "inseparable shared coating campaigns"
    rule: "If subdivision is not possible, allocate support, coating materials, utilities and losses by measured coated area adjusted by product-specific wet or dry coating mass; use net product mass only when area and coating-load data are unavailable, and disclose the hierarchy used."
    source_ids: []
  - rule_id: allocation_packaging
    applies_to: "converting and packaging"
    rule: "Assign format-specific packaging components directly by bill of materials and accepted unit count; do not spread instant-film components to conventional film or plate products."
    source_ids:
      - us-patent-5356762
      - us-patent-6814329
  - rule_id: allocation_silver_recovery
    applies_to: "recovered silver-bearing outputs"
    rule: "Treat recovered silver or silver-bearing concentrate according to the study's declared allocation or substitution method. Report recovered mass, quality, destination and any credited burden separately; do not omit recovery because it has revenue."
    source_ids:
      - us-epa-silver-risk-1980
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Return internally reworked emulsion or support to the consuming process without creating a co-product; count only make-up inputs, unrecovered loss and additional energy once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_emulsion_materials
      process_id: "emulsion_preparation"
      flow_role: "silver nitrate, potassium bromide and gelatin inputs"
      record_type: "batch issue and return records"
      raw_fields: "material id; grade; lot; gross issue; return; dry solids; batch id; accepted emulsion"
      collection_method: "Reconcile warehouse issue/return with signed batch recipes"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12-month period or full shorter campaign"
      site_scope: "all reporting-site emulsion lines"
      aggregation_rule: "Sum net consumed mass and normalize through conforming product output"
      quality_evidence: "calibrated scales; supplier certificate; recipe revision; batch reconciliation"
    - protocol_id: cp_emulsion_utilities
      process_id: "emulsion_preparation"
      flow_role: "process water and electricity"
      record_type: "meters and batch utility logs"
      raw_fields: "meter start/end; batch id; make-up water; recirculation; electricity; allocation driver"
      collection_method: "Use dedicated meters; otherwise reconcile shared meters to operating hours and measured load"
      unit: "kg water; MJ electricity"
      frequency: "batch and monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all reporting-site emulsion utilities"
      aggregation_rule: "Sum make-up water and electricity and normalize to conforming output"
      quality_evidence: "meter calibration; utility invoice reconciliation; downtime log"
    - protocol_id: cp_coating_materials
      process_id: "support_coating_drying"
      flow_role: "support and solvent inputs"
      record_type: "roll/plate issue, tank charge and recovery records"
      raw_fields: "support material; lot; input mass; unused return; solvent charge; recovered solvent; coating campaign"
      collection_method: "Reconcile material issues, tank records and recovery-system returns"
      unit: "kg"
      frequency: "each campaign"
      temporal_coverage: "same period as product output"
      site_scope: "all coating lines in scope"
      aggregation_rule: "Sum net external input; exclude verified closed-loop return to the same process"
      quality_evidence: "weighbridge or scale checks; bill of materials; solvent inventory balance"
    - protocol_id: cp_coating_utilities
      process_id: "support_coating_drying"
      flow_role: "water, electricity and natural gas"
      record_type: "utility meters and line logs"
      raw_fields: "meter readings; reference conditions; line id; operating hours; product campaign"
      collection_method: "Read dedicated meters or allocate reconciled shared meter totals using measured line load and operating time"
      unit: "kg water; MJ electricity; m3 gas"
      frequency: "shift, campaign and monthly"
      temporal_coverage: "same period as product output"
      site_scope: "coating, drying and associated clean-room utilities"
      aggregation_rule: "Sum by campaign and normalize to conforming output"
      quality_evidence: "meter calibration; invoices; reference-condition record; allocation calculation"
    - protocol_id: cp_coating_wastewater
      process_id: "support_coating_drying"
      flow_role: "silver-bearing wastewater"
      record_type: "flow meter, tank transfer and laboratory records"
      raw_fields: "wastewater mass or volume; density; silver concentration; stream origin; treatment destination; recovered silver"
      collection_method: "Measure each segregated stream at the treatment hand-off and pair with a representative laboratory result"
      unit: "kg; mg Ag/L"
      frequency: "transfer or daily composite"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope silver-bearing wastewater streams"
      aggregation_rule: "Convert volume with measured density where needed; sum mass and retain silver load separately"
      quality_evidence: "meter calibration; chain of custody; laboratory method; treatment manifest"
    - protocol_id: cp_combustion_emissions
      process_id: "support_coating_drying"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel meter and supplier composition records"
      raw_fields: "gas volume; temperature; pressure; carbon content; oxidation fraction; stack result if available"
      collection_method: "Reconcile metered fuel with supplier certificate and verified combustion or stack records"
      unit: "m3 gas; kg CO2"
      frequency: "monthly and campaign allocation"
      temporal_coverage: "same period as product output"
      site_scope: "all on-site gas combustion assigned to coating/drying"
      aggregation_rule: "Apply calc_combustion_co2 and normalize to conforming output"
      quality_evidence: "meter calibration; supplier certificate; calculation workbook or stack report"
    - protocol_id: cp_packaging_materials
      process_id: "converting_packaging"
      flow_role: "instant-film sheets, composition, cassette and paper box"
      record_type: "bill of materials, issue and count records"
      raw_fields: "component id; material; unit mass; issued count; accepted count; rejects; returned mass"
      collection_method: "Reconcile component issues to released unit count and measured component mass"
      unit: "kg; item"
      frequency: "each packaging or assembly campaign"
      temporal_coverage: "same period as product output"
      site_scope: "all converting and assembly lines in scope"
      aggregation_rule: "Sum net consumed component mass and normalize to net product output"
      quality_evidence: "approved bill of materials; scale checks; issue/return reconciliation"
    - protocol_id: cp_converting_utilities
      process_id: "converting_packaging"
      flow_role: "electricity"
      record_type: "submeter and machine log"
      raw_fields: "meter readings; machine id; operating hours; campaign; accepted output"
      collection_method: "Read line submeter or allocate reconciled meter totals by measured machine load and operating time"
      unit: "MJ"
      frequency: "shift and monthly"
      temporal_coverage: "same period as product output"
      site_scope: "slitting, perforating, loading, assembly, inspection and packaging"
      aggregation_rule: "Sum and normalize to conforming output"
      quality_evidence: "meter calibration; invoice reconciliation; machine log"
    - protocol_id: cp_product_output
      process_id: "converting_packaging"
      flow_role: "conforming reference product"
      record_type: "release, count and net-mass records"
      raw_fields: "lot; format; accepted quantity; sampled unit mass; net product mass; packaging convention; release status"
      collection_method: "Determine lot net mass from calibrated bulk weighing or accepted count times representative measured unit mass"
      unit: "kg"
      frequency: "each released lot"
      temporal_coverage: "same period as all inputs"
      site_scope: "all released products in declared dataset"
      aggregation_rule: "Sum released net mass; normalize all exchanges by this amount"
      quality_evidence: "release certificate; scale calibration; sampling plan; mass reconciliation"
    - protocol_id: cp_solid_wastes
      process_id: "converting_packaging"
      flow_role: "sensitized trim and off-spec material"
      record_type: "waste container and recovery records"
      raw_fields: "waste type; sensitized state; mass; silver-bearing status; destination; recovery certificate"
      collection_method: "Segregate coated trim and off-spec material from clean support and weigh at transfer"
      unit: "kg"
      frequency: "each container or transfer"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope converting and quality-reject points"
      aggregation_rule: "Sum each atomic waste stream separately and normalize to conforming output"
      quality_evidence: "scale calibration; waste manifest; recovery receipt; segregation audit"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory rows"
      rule: "normalized amount = period exchange amount / period net conforming reference-product mass"
      inputs:
        - "matched-period exchange record"
        - "cp_product_output net mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_area_length_mass
      applies_to: "area-, length- or count-based support and product records"
      rule: "mass = measured area × lot-specific basis mass; or mass = measured volume × lot-specific density; count conversion uses sampled mean unit mass under the approved sampling plan"
      inputs:
        - "area or length and width"
        - thickness
        - density
        - count
        - "sampled unit mass"
      output: "kg input or output"
      source_ids: []
    - id: calc_combustion_co2
      applies_to: "coat_fossil_co2"
      rule: "fossil CO2 mass = metered gas quantity × supplier fossil-carbon content × oxidation fraction × 44/12, with units reconciled and reference conditions documented"
      inputs:
        - "natural-gas record"
        - "carbon content"
        - "oxidation fraction"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_silver_balance
      applies_to: "campaign silver accounting"
      rule: "silver input = silver in product + recovered silver + silver in liquid waste + silver in solid waste + quantified inventory change; report unresolved imbalance without forcing closure"
      inputs:
        - "reagent certificates"
        - "product assay or coating load"
        - "waste assays"
        - "recovery records"
        - "inventory change"
      output: "campaign silver balance and closure percentage"
      source_ids:
        - us-epa-silver-risk-1980
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Match product form, support, chemistry, coating configuration, format and market state to the declared dataset; retain supplier grade and lot for chemistry-sensitive inputs."
      evidence: "release specification; bill of materials; supplier certificates; lot records"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a continuous representative 12-month period where production is continuous, or the complete campaign when production is shorter; identify atypical shutdown or start-up periods."
      evidence: "dated meters, batch logs, production calendar and deviation record"
    - id: dq_completeness
      applies_to: "material, energy, waste and emission rows"
      requirement: "Reconcile purchases/issues, returns, inventory change, recovered materials, product and wastes; explain every omitted expected row and every balance gap."
      evidence: "mass and energy reconciliations; cut-off register; waste manifests"
    - id: dq_silver
      applies_to: "silver-bearing system"
      requirement: "Maintain traceability from silver-bearing reagent through coated product, wastewater, solid waste and recovery; report concentration methods and detection limits."
      evidence: "laboratory reports; recovery receipts; silver mass balance"
    - id: dq_allocation
      applies_to: "shared processes"
      requirement: "Document subdivision attempts, allocation hierarchy, drivers and sensitivity for materially shared burdens."
      evidence: "meter map; campaign schedule; allocation workbook; sensitivity result"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match supplier geography, electricity grid, support technology, solvent recovery, drying technology and treatment route, or disclose and assess each mismatch."
      evidence: "supplier location; dataset metadata; technology description; representativeness assessment"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm that the output is sensitized, unexposed and quality-conforming; reference amount is exactly 1 kg net product and required qualifiers are complete."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm every selected flow is one atomic material, energy, waste or emission exchange; formulation-specific additions must be separate rows with route conditions."
    source_ids: []
  - rule_id: validation_process_alignment
    applies_to: "process map and cards"
    rule: "Confirm every required process has a matching inventory section and every conditional row agrees with the declared support, chemistry and instant-film construction."
    source_ids:
      - us-patent-4564591
      - us-patent-5356762
      - us-patent-6814329
  - rule_id: validation_mass_energy
    applies_to: "foreground calculations"
    rule: "Recalculate reference normalization, count/area conversions, utility conversions and the product/waste mass reconciliation from retained raw records."
    source_ids: []
  - rule_id: validation_silver_balance
    applies_to: "silver-bearing routes"
    rule: "Check campaign silver balance inputs, product, recovered material, wastewater, solid waste and inventory change; flag an unexplained imbalance rather than inserting an estimated loss flow."
    source_ids:
      - us-epa-silver-risk-1980
  - rule_id: validation_uuid_scope
    applies_to: "Tiangong references"
    rule: "Confirm each UUID remains public state 100 and matches name, flow type, classification, property, unit group and product state; unresolved rows remain explicitly UUID-empty."
    source_ids: []
  - rule_id: validation_no_external_ranges
    applies_to: "all important flows"
    rule: "Confirm that no external empirical range is claimed until at least two independent, original-text-verified and boundary-compatible sources support a synthesis; use foreground records for dataset values."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset representing cradle-to-gate production of the declared sensitized unexposed photographic product"
  downstream_use: "Product-system modelling for photographic media, cameras, medical or industrial imaging, graphic arts, supply-chain screening and procurement where the declared product and geography match"
  allowed_use: "Use after checking product form, support, imaging chemistry, format, instant-film construction, geography, production year, energy system, solvent recovery and treatment route"
  excluded_use: "Direct representation of exposed or developed material, photo processing, non-photographic coated media, separately sold photographic chemicals, use-stage image formation or end-of-life"
  required_metadata: "PCR id and version; product qualifiers; reference mass convention; geography and year; included sites and processes; support and chemistry route; instant-film components; allocation; upstream datasets; cut-offs; uncertainty; UUID gaps"
  required_quality_disclosure: "Temporal coverage; meter and mass-balance quality; silver balance; allocation sensitivity; completeness; technology and geography mismatches; recovery and treatment boundaries; unresolved UUID and range-evidence needs"
  update_trigger: "Change in support or photosensitive chemistry, coating architecture, solvent or silver recovery, drying energy, instant-film construction, packaging, site, grid, treatment route, allocation driver, product mass convention, or a material correction to foreground records"
