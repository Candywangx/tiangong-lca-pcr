allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all routes"
    rule: "Subdivide route lines and directly meter material, electricity, water, output, and waste before applying allocation."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "shared utilities and equipment"
    rule: "Allocate residual shared quantities using a documented causal driver such as metered machine energy, operating time at comparable load, or processed mass; disclose driver values."
    source_ids: []
  - rule_id: allocation_multiple_products
    applies_to: "multiple saleable products from one campaign"
    rule: "Prefer separate measured output records; when inseparable, allocate by a documented physical relationship that reflects the causal process and report each product mass."
    source_ids: []
  - rule_id: allocation_waste_treatment
    applies_to: "waste and recycling"
    rule: "Report waste leaving the foreground and any on-site treatment separately; do not embed avoided-burden credits in the foreground exchange amount."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fibre_drawing_records
      process_id: "fibre_drawing"
      flow_role: "all listed fibre-drawing exchanges"
      record_type: "purchase and issue records; electricity meters; production and reject logs; waste transfer records"
      raw_fields: "preform mass; resin issue and return; kWh; accepted length and mass; scrap mass; lot and specification"
      collection_method: "reconcile calibrated meters, scales, inventory issues, and lot records"
      unit: "kg; m; kWh; MJ"
      frequency: "each lot or continuous meter with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or full shorter campaign"
      site_scope: "all in-scope drawing lines at the reporting site"
      aggregation_rule: "sum by product specification, convert to mass, allocate shared quantities, divide by accepted output kg"
      quality_evidence: "calibration records; invoices; stock reconciliation; acceptance and waste tickets"
    - protocol_id: cp_fibre_cabling_records
      process_id: "fibre_cabling"
      flow_role: "all listed bundling and cabling exchanges"
      record_type: "material issues; electricity meters; production logs; waste transfer records"
      raw_fields: "fibre mass; jacket-compound issue and return; kWh; accepted bundle mass; accepted cable mass; trim mass; construction"
      collection_method: "reconcile material and energy records by construction and line"
      unit: "kg; m; kWh; MJ"
      frequency: "each lot or continuous meter with monthly reconciliation"
      temporal_coverage: "representative 12 consecutive months or full shorter campaign"
      site_scope: "all in-scope bundling and cabling lines"
      aggregation_rule: "keep bundle and cable outputs separate, allocate shared quantities, divide by applicable accepted output kg"
      quality_evidence: "calibration; inventory reconciliation; construction record; acceptance and waste tickets"
    - protocol_id: cp_polarizer_records
      process_id: "polarizer_fabrication"
      flow_role: "all listed polarizer exchanges"
      record_type: "film issues; bath make-up logs; water and electricity meters; production, wastewater, and trim records"
      raw_fields: "PVA, iodine, boric acid, TAC, water, kWh, accepted area and mass, wastewater mass, trim mass, construction"
      collection_method: "reconcile roll, bath, meter, scale, and waste records"
      unit: "kg; m2; kWh; MJ"
      frequency: "each roll or bath; meters monthly"
      temporal_coverage: "representative 12 consecutive months or full shorter campaign"
      site_scope: "all in-scope polarizer lines"
      aggregation_rule: "convert accepted area to mass by same-construction lot evidence, allocate shared quantities, divide by accepted kg"
      quality_evidence: "roll genealogy; bath logs; meter calibration; acceptance and waste records"
    - protocol_id: cp_optical_element_records
      process_id: "optical_element_fabrication"
      flow_role: "all listed optical-element exchanges"
      record_type: "blank and compound issues; water and electricity meters; production, inspection, and sludge records"
      raw_fields: "blank mass; polishing and coating material; water; kWh; accepted count and mass; sludge mass; optical specification"
      collection_method: "reconcile lot travellers, material issues, meters, scales, and inspection release"
      unit: "kg; item; kWh; MJ"
      frequency: "each lot; continuous meters monthly"
      temporal_coverage: "representative 12 consecutive months or full shorter campaign"
      site_scope: "all in-scope fabrication cells"
      aggregation_rule: "convert count to mass using full-lot or documented sample weighing, allocate shared quantities, divide by accepted kg"
      quality_evidence: "lot genealogy; calibration; material reconciliation; optical inspection and waste records"
  calculation_rules:
    - id: calc_normalized_exchange
      applies_to: "every inventory row"
      rule: "normalized amount = in-scope period exchange × documented allocation fraction ÷ accepted route-output mass"
      inputs:
        - "exchange record"
        - "allocation driver"
        - "accepted output kg"
      output: "exchange amount per kg accepted product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "purchased electricity in MJ"
      source_ids: []
    - id: calc_length_mass
      applies_to: "fibre, bundle, and cable outputs"
      rule: "kg = measured length × same-lot measured mass per length; reconcile to scale totals"
      inputs:
        - length
        - "kg/m"
        - "scale total"
      output: "accepted mass"
      source_ids: []
    - id: calc_area_mass
      applies_to: "polarizing product"
      rule: "kg = accepted area × same-construction measured areal mass; reconcile to roll mass"
      inputs:
        - "accepted m2"
        - "kg/m2"
        - "roll mass"
      output: "accepted mass"
      source_ids: []
    - id: calc_count_mass
      applies_to: "worked optical elements"
      rule: "kg = accepted item count × representative accepted-item mass, unless full-lot mass is available"
      inputs:
        - count
        - "sampling plan"
        - "item mass or full-lot mass"
      output: "accepted mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Record exact product family, composition, construction, optical specification, coating or lamination, mounting, and supplier product state."
      evidence: "specifications; lot genealogy; supplier declarations"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Cover 12 consecutive representative months or the entire shorter campaign and explain shutdowns, start-ups, and atypical lots."
      evidence: "dated meters, production logs, and reconciliation period"
    - id: dq_completeness
      applies_to: "each selected route"
      requirement: "Reconcile all listed atomic exchanges; document a demonstrable zero or inapplicability rather than silently omitting a row."
      evidence: "material, energy, water, output, and waste reconciliation"
    - id: dq_measurement
      applies_to: "converted length, area, count, and electricity"
      requirement: "Retain original units, calibration, sampling, conversion factors, and calculation versions."
      evidence: "calibration certificates; weighing and conversion workpapers"
    - id: dq_upstream
      applies_to: "linked product inputs"
      requirement: "Match geography, technology, grade, purity, water quality, electricity mix, and delivery state; disclose every proxy."
      evidence: "upstream dataset metadata and proxy justification"
    - id: dq_uncertainty
      applies_to: "allocated or sampled values"
      requirement: "Quantify or qualitatively rank uncertainty from allocation, sampling, missing periods, and unresolved flow identity."
      evidence: "uncertainty record and sensitivity results"
