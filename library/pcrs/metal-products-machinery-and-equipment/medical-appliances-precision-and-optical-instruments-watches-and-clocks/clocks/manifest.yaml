      - row_id: clock_case
        reason_code: no_exact_candidate
        explanation: "Five public state-100 candidates were directly read; each was a watch-case component, a generic case with mismatched classification, or a generic enclosure rather than an exact complete clock case."
      - row_id: analog_clock_dial
        reason_code: no_exact_candidate
        explanation: "Five public state-100 candidates were directly read; none denoted one analog clock dial or face assembly."
      - row_id: included_button_cell_battery
        reason_code: no_exact_candidate
        explanation: "Three public state-100 candidates were directly read; none exactly matched a new button-cell battery with the required mass property and supplied-product state."
      - row_id: defective_complete_clock
        reason_code: no_exact_candidate
        explanation: "Four public state-100 waste candidates were directly read; none exactly denoted defective complete clocks from manufacturing."
    range_evidence_needs:
      - range_id: clock_movement_mass_range
        row_id: clock_movement
        explanation: "Two independent original-text sources with compatible product state and one-kilogram clock-output boundary were not available; collect foreground movement mass and establish a reviewed range before activation."
      - range_id: clock_case_mass_range
        row_id: clock_case
        explanation: "Two independent original-text sources with compatible clock construction and boundary were not available; collect foreground case mass and establish a reviewed range before activation."
      - range_id: analog_clock_dial_mass_range
        row_id: analog_clock_dial
        explanation: "Two independent original-text sources with compatible analog-clock construction and boundary were not available; collect foreground dial mass and establish a reviewed range before activation."
      - range_id: included_button_cell_battery_mass_range
        row_id: included_button_cell_battery
        explanation: "Two independent original-text sources with compatible cell chemistry, format, supplied-product state, and clock boundary were not available; collect foreground included-battery mass and establish a reviewed range before activation."
      - range_id: assembly_electricity_range
        row_id: assembly_electricity
        explanation: "Two independent original-text sources with compatible clock-assembly technology and factory-gate boundary were not available; collect submetered electricity and establish a reviewed range before activation."
      - range_id: conforming_clock_yield_range
        row_id: clock_output
        explanation: "The normalized reference output is exactly 1 kg by definition, but two independent original-text sources for an unnormalized conforming-yield QA range under a compatible clock-assembly boundary were not available; collect batch output and establish a reviewed QA range before activation."
      - range_id: defective_complete_clock_rate_range
        row_id: defective_complete_clock
        explanation: "Two independent original-text sources with compatible defect definition and manufacturing boundary were not available; collect rejected-clock mass and establish a reviewed range before activation."
