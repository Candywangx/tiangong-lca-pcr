allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared assembly, calibration, and testing operations"
    rule: "Avoid allocation by separately metering or otherwise subdividing product-line electricity, component issues, conforming output, and defective-clock waste wherever practicable."
    source_ids: []
  - rule_id: allocation_physical_mass
    applies_to: "inseparable shared operations producing more than one clock model"
    rule: "When subdivision is not practicable, allocate shared burdens among clock models by measured conforming product mass; disclose the affected operations, models, allocation denominator, and sensitivity to an item-count alternative."
    source_ids: []
  - rule_id: allocation_no_defect_credit
    applies_to: "defective complete clocks"
    rule: "Assign burdens incurred before rejection to the production batch and report the defective-clock waste output without an avoided-product credit; model any recycling or treatment in the linked downstream waste dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_receipts
      process_id: "final_clock_assembly"
      flow_role: "purchased component input"
      record_type: "receiving and issue records plus verified mass measurement"
      raw_fields: "supplier; SKU; component description; movement mechanism; case material and finish; dial type; battery chemistry and format; accepted count; rejected count; tare mass; net mass; batch_id"
      collection_method: "Reconcile receiving and line-issue records; verify representative unit or lot mass with a calibrated balance; retain component identity by row_id"
      unit: "kg"
      frequency: "Each received lot and assembly batch"
      temporal_coverage: "Same reporting period as clock output, normally at least 12 consecutive months"
      site_scope: "All component lots used by the reporting facility for the declared clock product"
      aggregation_rule: "Sum accepted net mass issued to the batch by atomic component row and divide by conforming clock output mass"
      quality_evidence: "Purchase/issue reconciliation, supplier specification, balance calibration record, and sampled weighing record"
    - protocol_id: cp_assembly_electricity
      process_id: "final_clock_assembly"
      flow_role: "assembly electricity input"
      record_type: "submeter or documented meter allocation"
      raw_fields: "meter_id; opening_kWh; closing_kWh; timestamps; production-line operating hours; shared-load allocation basis; batch_id"
      collection_method: "Read dedicated submeters where available; otherwise allocate a documented parent-meter difference using measured operating hours or equipment load-hours"
      unit: "kWh and MJ"
      frequency: "At least monthly and for each production campaign when campaign data exist"
      temporal_coverage: "Same reporting period as clock output, normally at least 12 consecutive months"
      site_scope: "Assembly, calibration, testing, and directly attributable support equipment at the reporting facility"
      aggregation_rule: "Subtract verified non-production loads, convert kWh to MJ, sum the reporting period, and divide by conforming clock output mass"
      quality_evidence: "Meter identification, calibration or utility reconciliation, reading log, and allocation worksheet"
    - protocol_id: cp_clock_output
      process_id: "final_clock_assembly"
      flow_role: "conforming clock product output"
      record_type: "production release and mass records"
      raw_fields: "model; mechanism; display; accuracy specification; power interface; supplied battery state; accepted_count; net_unit_mass; total_conforming_mass; release_date; batch_id"
      collection_method: "Reconcile quality-release counts with calibrated net-mass measurements after testing and before sales packaging"
      unit: "kg"
      frequency: "Each released batch"
      temporal_coverage: "Same period as all input and waste records, normally at least 12 consecutive months"
      site_scope: "All conforming clock output from the declared line and product system"
      aggregation_rule: "Sum conforming net clock mass; use it as the denominator and scale all exchanges to exactly 1 kg"
      quality_evidence: "Quality-release record, test acceptance record, balance calibration, and batch reconciliation"
    - protocol_id: cp_defective_clock_waste
      process_id: "final_clock_assembly"
      flow_role: "defective complete-clock waste output"
      record_type: "rejection, rework, weighing, and dispatch records"
      raw_fields: "rejected_count; defect_code; gross_mass; tare_mass; net_mass; rework_status; destination; dispatch_reference; batch_id"
      collection_method: "Weigh complete rejected clocks before dismantling or dispatch and reconcile units reworked into conforming output"
      unit: "kg"
      frequency: "Each batch and each waste dispatch"
      temporal_coverage: "Same reporting period as clock output, normally at least 12 consecutive months"
      site_scope: "All complete-clock rejects generated by the declared process"
      aggregation_rule: "Sum net mass dispatched as waste; exclude successfully reworked clocks and normalize by conforming clock output mass"
      quality_evidence: "Rejection log, rework reconciliation, calibrated weighing record, and waste transfer evidence"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "all mass-based input and waste rows"
      rule: "normalized amount (kg/kg) = batch atomic-flow net mass (kg) / conforming complete-clock net mass (kg)"
      inputs:
        - "batch row mass"
        - "conforming clock output mass"
        - "matched batch_id and period"
      output: "kg exchange per kg conforming complete clocks"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "assembly_electricity"
      rule: "normalized electricity (MJ/kg) = attributable electricity (kWh) × 3.6 / conforming complete-clock net mass (kg)"
      inputs:
        - "verified meter difference"
        - "excluded load"
        - "allocation factor"
        - "conforming output mass"
      output: "MJ electricity per kg conforming complete clocks"
      source_ids: []
    - id: calc_clock_output_reference
      applies_to: "clock_output"
      rule: "Divide measured conforming complete-clock mass by itself after confirming a positive denominator; the normalized reference output equals exactly 1 kg"
      inputs:
        - "measured conforming complete-clock mass"
      output: "1 kg reference product"
      source_ids: []
    - id: calc_clock_mass_balance
      applies_to: "final clock assembly mass balance"
      rule: "Compare atomic component inputs with conforming clock output, defective complete-clock waste, documented in-process inventory change, and separately recorded atomic component scrap; investigate unexplained mass rather than forcing closure"
      inputs:
        - "atomic component masses"
        - "output mass"
        - "defective-clock waste"
        - "in-process inventory change"
        - "separately identified scrap"
      output: "disclosed mass-balance difference and reconciliation status"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain model, mechanism, display, accuracy specification, power interface, supplied battery state, net mass convention, and factory-gate state sufficient to demonstrate that the output is a complete clock rather than a watch, movement, part, or time-recording apparatus."
      evidence: "Product specification, bill of materials, product photograph or drawing, and quality-release record"
    - id: dq_flow_identity
      applies_to: "every inventory row"
      requirement: "Preserve one concrete exchange identity per row, the selected Tiangong UUID when confirmed, property and unit, supplier or meter context, and any unresolved UUID status; do not aggregate unlike components, wastes, or emissions."
      evidence: "Row-level reconciliation and UUID review record"
    - id: dq_temporal_alignment
      applies_to: "all foreground data"
      requirement: "Use the same representative period for input, output, electricity, and waste records; disclose shutdowns, launches, abnormal campaigns, and any period shorter than 12 consecutive months."
      evidence: "Dated source records and reporting-period reconciliation"
    - id: dq_measurement
      applies_to: "mass and electricity records"
      requirement: "Use calibrated or verified balances and meters, retain tare corrections and conversion worksheets, and document shared-meter allocation assumptions."
      evidence: "Calibration certificates or checks, raw readings, invoices, and calculation workbook"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile purchased component issues, conforming output, defective-clock waste, rework, in-process inventory change, and electricity coverage; quantify any excluded or estimated share."
      evidence: "Mass-balance statement, energy reconciliation, and completeness checklist"
validation_rules:
  - rule_id: validate_clock_identity
    applies_to: "product identity"
    rule: "Confirm that the reference product is a complete non-wearable clock in CPC 3.0 subclass 48420 and not a watch, time-recording apparatus, separately sold movement, separately sold part, or multifunction product with another principal identity."
