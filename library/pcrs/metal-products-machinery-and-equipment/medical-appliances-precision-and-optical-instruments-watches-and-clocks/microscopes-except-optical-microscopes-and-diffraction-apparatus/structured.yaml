allocation_rules:
  - rule_id: alloc_subdivision
    applies_to: "Work-order-specific component, cleaning, assembly, testing, and packaging records"
    rule: "Prefer subdivision and direct work-order measurement. Assign materials and utilities to the serial-numbered apparatus or homogeneous batch that consumed them."
    source_ids: []
  - rule_id: alloc_shared_utility
    applies_to: "Shared factory utilities and services"
    rule: "When direct measurement is unavailable, use a documented causal driver such as equipment operating time, metered sub-area load, or process time. Use floor area only for genuinely space-driven loads."
    source_ids: []
  - rule_id: alloc_rework
    applies_to: "Rework and failed acceptance tests"
    rule: "Assign rework materials, utilities, and treatment outputs to accepted apparatus from the same batch; do not create an avoided-product credit for an internal reject."
    source_ids: []
  - rule_id: alloc_recycling
    applies_to: "Recycled material or reusable packaging"
    rule: "Report recycled-content and recycling assumptions separately. Do not subtract an unverified recycling credit; divide reusable packaging only by a documented reuse count."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "component_integration"
      flow_role: "Installed component and subassembly mass"
      record_type: "As-built BOM and supplier mass record"
      raw_fields: "serial/model; configuration; part_number; flow_role; quantity; unit_mass_kg; installed_mass_kg; supplier; upstream_dataset_id"
      collection_method: "Reconcile the released as-built BOM to supplier specifications or verified weighing"
      unit: "kg"
      frequency: "Each accepted apparatus or homogeneous configuration batch"
      temporal_coverage: "Same production period as the dataset"
      site_scope: "All manufacturing sites in scope"
      aggregation_rule: "Sum quantity × verified unit mass by row_id; exclude parts included within another purchased subassembly"
      quality_evidence: "Released BOM revision, configuration record, supplier specification or calibrated scale record, reconciliation sign-off"
    - protocol_id: cp_factory_electricity
      process_id: "component_integration_final_acceptance_packaging"
      flow_role: "Integration and acceptance-test electricity"
      record_type: "Submeter or work-order energy log"
      raw_fields: "meter_id; opening_kWh; closing_kWh; timestamps; process_state; apparatus_serial; shared_load_driver; excluded_loads"
      collection_method: "Read dedicated meters or allocate a validated submeter total using a causal driver"
      unit: "kWh"
      frequency: "Each work order or test campaign"
      temporal_coverage: "Representative consecutive production period, normally at least 12 months for annual datasets"
      site_scope: "Each manufacturing site"
      aggregation_rule: "Net kWh by process and accepted apparatus, then convert to MJ; keep the two electricity rows separate"
      quality_evidence: "Meter calibration, interval data, work-order timestamps, allocation worksheet, completeness reconciliation"
    - protocol_id: cp_precision_cleaning
      process_id: "precision_cleaning"
      flow_role: "Process water and wastewater"
      record_type: "Water meter, batch record, and discharge record"
      raw_fields: "operation_id; apparatus_serial; water_mass_kg_or_volume; temperature; density_factor; wastewater_mass_kg_or_volume; retained_water_kg; evaporation_kg; waste_classification"
      collection_method: "Meter input and discharge separately or document a closed mass-balance calculation"
      unit: "kg"
      frequency: "Each cleaning batch"
      temporal_coverage: "Same production period as the dataset"
      site_scope: "Each site performing aqueous precision cleaning"
      aggregation_rule: "Allocate batch totals by recorded batch membership; convert volume to mass with documented density"
      quality_evidence: "Meter calibration, batch traveler, discharge classification, mass-balance reconciliation"
    - protocol_id: cp_dispatch_packaging
      process_id: "final_acceptance_packaging"
      flow_role: "Dispatched pallet and protective foam"
      record_type: "Packaging BOM and packing record"
      raw_fields: "apparatus_serial; packaging_part_number; material; quantity; unit_mass_kg; dispatched_mass_kg; reuse_count"
      collection_method: "Weigh or use verified supplier unit masses and reconcile to the packing list"
      unit: "kg"
      frequency: "Each dispatched configuration or homogeneous packaging design"
      temporal_coverage: "Current packaging design during the dataset period"
      site_scope: "Each dispatch site"
      aggregation_rule: "Sum dispatched mass by material-specific row; divide pallet mass only by documented reuse count"
      quality_evidence: "Released packaging drawing/BOM, supplier mass specification, packing record, reuse-pool log"
    - protocol_id: cp_product_mass_acceptance
      process_id: "final_acceptance_packaging"
      flow_role: "Reference product output and acceptance status"
      record_type: "Final weighing/BOM record and factory acceptance report"
      raw_fields: "apparatus_serial; model; configuration; gross_mass_kg; packaging_mass_kg; spare_mass_kg; net_product_mass_kg; acceptance_test_id; acceptance_result"
      collection_method: "Verify net apparatus mass and link it to a passed acceptance-test record"
      unit: "kg"
      frequency: "Every accepted apparatus or verified homogeneous model configuration"
      temporal_coverage: "Same production period as the dataset"
      site_scope: "Each manufacturing site"
      aggregation_rule: "Net mass = gross mass - dispatch packaging - separately supplied spares; include only accepted units"
      quality_evidence: "Calibrated scale or reconciled as-built BOM, signed acceptance report, serial-number traceability"
  calculation_rules:
    - id: calc_component_mass
      applies_to: "Component and subassembly rows"
      rule: "installed_mass_kg = quantity × verified unit_mass_kg; sum only identical flow identities and disclose nested components"
      inputs:
        - "cp_component_bom records"
      output: "kg per accepted apparatus by row_id"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "integration_electricity; acceptance_test_electricity"
      rule: "electricity_MJ = net_kWh × 3.6"
      inputs:
        - "cp_factory_electricity net kWh"
      output: "MJ per accepted apparatus"
      source_ids: []
    - id: calc_cleaning_balance
      applies_to: "precision_cleaning_water; precision_cleaning_wastewater"
      rule: "water_input_kg = wastewater_output_kg + retained_water_kg + evaporation_kg + measured_other_outputs; investigate and disclose residual"
      inputs:
        - "cp_precision_cleaning records"
      output: "Reconciled kg per accepted apparatus"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "wooden_pallet; polyethylene_foam"
      rule: "packaging_mass_kg = quantity × unit_mass_kg; divide reusable pallet mass only by documented completed uses"
      inputs:
        - "cp_dispatch_packaging records"
      output: "kg per dispatched apparatus"
      source_ids: []
    - id: calc_reference_product_mass
      applies_to: "reference_product_output"
      rule: "net_product_mass_kg = gross_mass_kg - dispatch_packaging_mass_kg - separately_supplied_spares_mass_kg"
      inputs:
        - "cp_product_mass_acceptance records"
      output: "kg of accepted apparatus"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and route-specific rows"
      requirement: "Product family, model, serial/configuration, source, detector, vacuum/cooling configuration, and acceptance criteria must be unambiguous and mutually consistent."
      evidence: "Released configuration and factory acceptance report"
    - id: dq_bom_completeness
      applies_to: "Purchased components and packaging"
      requirement: "Reconcile as-built and packaging BOMs to the reference product; disclose mass lacking upstream datasets and prevent double counting of nested subassemblies."
      evidence: "BOM reconciliation and upstream dataset crosswalk"
    - id: dq_metering
      applies_to: "Electricity and water"
      requirement: "Use calibrated meters or documented allocation from calibrated totals; retain raw readings, timestamps, and conversion factors."
      evidence: "Calibration records and signed allocation worksheet"
    - id: dq_temporal
      applies_to: "All foreground records"
      requirement: "Use records from the declared period and identify design, supplier, process, or packaging changes that make older records non-representative."
      evidence: "Coverage table and change-control log"
    - id: dq_conditional_routes
      applies_to: "Conditional component, cleaning, and packaging rows"
      requirement: "State whether every conditional row applies. A zero quantity without an applicability decision is incomplete."
      evidence: "Configuration record, process traveler, and packing record"
    - id: dq_source_traceability
      applies_to: "External source use"
      requirement: "Preserve stable source ids and show which identity, architecture, boundary, or quality decision each source supports; do not treat examples as ranges."
