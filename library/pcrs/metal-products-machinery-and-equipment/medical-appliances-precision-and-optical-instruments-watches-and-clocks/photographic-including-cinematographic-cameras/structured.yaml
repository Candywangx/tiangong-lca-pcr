allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared camera-production operations"
    rule: "Avoid allocation by metering or otherwise subdividing camera lines, operations, and support loads wherever direct attribution is feasible."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable shared burdens"
    rule: "When subdivision is not feasible, use a documented causal physical relationship such as machine time, measured energy, water use, solvent issue, occupied production time, or accepted product mass; justify why the driver represents the shared burden."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "burdens lacking a defensible physical relationship"
    rule: "Economic allocation may be used only after documenting why subdivision, system expansion, and a causal physical relationship are infeasible; report prices, currency, averaging period, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_waste_and_rework
    applies_to: "rejects, rework, recycling, and waste transfers"
    rule: "Assign burdens through the point of rejection to the reporting-period camera production; subtract neither waste nor recyclable material burdens unless a separately documented downstream system-expansion or allocation model is applied."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_mass
      process_id: "camera_manufacturing"
      flow_role: "housing, lens, shutter, and film-transport component inputs"
      record_type: "bill of materials, issue records, supplier specifications, and verification weights"
      raw_fields: "component identity; material; supplier; delivered state; mass per component; units issued; returns; rejects; camera model"
      collection_method: "reconcile production issues and returns to the approved bill of materials; verify representative component masses on calibrated scales"
      unit: "kg"
      frequency: "each model or bill-of-material revision; aggregate monthly"
      temporal_coverage: "complete reporting period with opening and closing work-in-progress reconciled"
      site_scope: "every reporting site and outsourced operation included in the foreground boundary"
      aggregation_rule: "sum net issued mass by component and model, then divide by accepted output mass"
      quality_evidence: "approved bill of materials; supplier specification; calibration record; issue-return reconciliation"
    - protocol_id: cp_electricity
      process_id: "camera_manufacturing"
      flow_role: "purchased electricity input"
      record_type: "submeter readings and reconciled electricity invoices"
      raw_fields: "meter id; opening and closing reading; unit; line; downtime; shared-load driver; invoice total"
      collection_method: "read dedicated meters where available and reconcile to site invoices; allocate shared loads under section 7"
      unit: "kWh and MJ"
      frequency: "at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all camera-production and attributable support equipment at each site"
      aggregation_rule: "convert kWh to MJ, sum attributable energy, and divide by accepted output mass"
      quality_evidence: "meter calibration or utility record; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_water
      process_id: "camera_manufacturing"
      flow_role: "process water input"
      record_type: "water meter, batch record, and water-source record"
      raw_fields: "meter id; volume or mass; temperature; density if converted; operation; source; reuse; discharge link"
      collection_method: "meter process water or reconcile batch additions and returns; exclude unrelated sanitary water"
      unit: "kg and m3"
      frequency: "each batch or at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included cleaning, plating, polishing, and other wet operations"
      aggregation_rule: "convert volume to mass when needed, subtract documented closed-loop carryover only, and divide by accepted output mass"
      quality_evidence: "meter calibration; batch sheet; density basis; water balance"
    - protocol_id: cp_isopropanol
      process_id: "camera_manufacturing"
      flow_role: "Isopropanol product input"
      record_type: "purchase, issue, return, recovery, and stock records"
      raw_fields: "purity; beginning stock; purchases; issues; returns; recovered stock; ending stock; waste transfer"
      collection_method: "perform a reporting-period solvent inventory by material identity and reconcile storage changes"
      unit: "kg"
      frequency: "each issue and monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all included cleaning stations, storage, and recovery units"
      aggregation_rule: "beginning stock plus purchases minus ending stock, documented returns, and exported recovered solvent; divide net input by accepted output mass"
      quality_evidence: "stock ledger; purchase records; issue tickets; recovery records"
    - protocol_id: cp_packaging
      process_id: "camera_manufacturing"
      flow_role: "corrugated board box input"
      record_type: "packaging bill of materials, supplier specification, and verification weights"
      raw_fields: "box grade; dimensions; mass per box; boxes issued; returns; damaged boxes; cameras packed"
      collection_method: "reconcile boxes issued and returned; verify representative mass on a calibrated scale"
      unit: "kg"
      frequency: "each packaging revision; aggregate monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "every packing line in the foreground boundary"
      aggregation_rule: "multiply verified box mass by net boxes used and divide by accepted output mass"
      quality_evidence: "packaging specification; scale calibration; issue-return reconciliation"
    - protocol_id: cp_finished_output
      process_id: "camera_manufacturing"
      flow_role: "accepted finished camera output"
      record_type: "final inspection, packing, count, and mass records"
      raw_fields: "model; serial or lot; accepted count; rejected count; net mass; packaged mass; package contents; inspection status"
      collection_method: "count only passed units and weigh a representative sample or every unit under a documented sampling plan"
      unit: "kg and item"
      frequency: "each lot or shift"
      temporal_coverage: "complete reporting period"
      site_scope: "all final inspection and packing points"
      aggregation_rule: "sum accepted packaged mass by declared configuration; use as the normalization denominator"
      quality_evidence: "final inspection record; scale calibration; sampling plan; packing record"
    - protocol_id: cp_rejected_camera
      process_id: "camera_manufacturing"
      flow_role: "rejected complete camera assembly output"
      record_type: "nonconformance, rework, and waste transfer records"
      raw_fields: "model; reject reason; mass; disposition; rework return date; destination"
      collection_method: "segregate complete-camera rejects from component scrap and packaging waste; weigh transfers"
      unit: "kg"
      frequency: "each event; aggregate monthly"
      temporal_coverage: "complete reporting period including unresolved rework stock"
      site_scope: "all final inspection and rework areas"
      aggregation_rule: "sum complete-camera rejects leaving the process and divide by accepted output mass"
      quality_evidence: "nonconformance report; scale calibration; transfer manifest; rework reconciliation"
    - protocol_id: cp_cleaning_wastewater
      process_id: "camera_manufacturing"
      flow_role: "cleaning wastewater output"
      record_type: "discharge meter, tank transfer, composition analysis, and water balance"
      raw_fields: "mass or volume; density; operation; contaminants; hazardous status; destination; treatment route"
      collection_method: "meter or weigh each transfer; if calculated, reconcile water inputs, retained moisture, evaporation, and other documented outlets"
      unit: "kg and m3"
      frequency: "each transfer or at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "every cleaning operation and wastewater transfer point"
      aggregation_rule: "sum transferred mass or calculate from a closed water balance, then divide by accepted output mass"
      quality_evidence: "meter or scale record; laboratory analysis; transfer manifest; water-balance worksheet"
    - protocol_id: cp_isopropanol_air
      process_id: "camera_manufacturing"
      flow_role: "direct Isopropanol emission to air"
      record_type: "stack or workplace emission measurement and solvent balance"
      raw_fields: "measured concentration and flow or solvent input; recovered mass; product retention; wastewater and waste mass; stock change; abatement efficiency"
      collection_method: "prefer representative emission measurement; otherwise calculate the residual of a reconciled Isopropanol balance and document the share assigned to air"
      unit: "kg"
      frequency: "measurement campaign plus monthly balance"
      temporal_coverage: "representative operating conditions and complete reporting period"
      site_scope: "all included cleaning, drying, storage, and abatement points"
      aggregation_rule: "sum measured releases or calculated air residual and divide by accepted output mass"
      quality_evidence: "analytical report; flow calibration; solvent-balance closure; abatement operating record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period exchange amount / accepted finished-camera mass in the declared package state"
      inputs:
        - "exchange amount"
        - "accepted finished-camera mass"
      output: "exchange per kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity input"
      rule: "electricity MJ = metered kWh × 3.6; retain both values before normalization"
      inputs:
        - "metered kWh"
      output: "electricity MJ"
      source_ids: []
    - id: calc_water_mass
      applies_to: "process water and cleaning wastewater"
      rule: "water mass = measured volume × measured or declared density at the recorded condition"
      inputs:
        - volume
        - density
        - temperature
        - "direct mass when available"
      output: "water or wastewater mass in kg"
      source_ids: []
    - id: calc_isopropanol_input
      applies_to: "Isopropanol input"
      rule: "net Isopropanol input = beginning stock + purchases + transferred-in recovered solvent − ending stock − supplier returns − exported recovered solvent"
      inputs:
        - "stock and transaction records by purity-adjusted mass"
      output: "net Isopropanol product input in kg"
      source_ids: []
    - id: calc_isopropanol_air
      applies_to: "Isopropanol direct air emission"
      rule: "air release = net Isopropanol input − mass retained in product − mass in wastewater − mass in exported solvent waste − other measured outputs; negative or materially unclosed balances are invalid"
      inputs:
        - "net input"
        - "product retention"
        - wastewater
        - "waste transfer"
        - "measured outputs"
      output: "Isopropanol emitted to air in kg"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "product and waste mass"
      rule: "reconcile purchased component and packaging mass with accepted output, rejects, measured wastes, stock changes, and documented emissions; investigate material imbalance instead of assigning it to an unspecified flow"
      inputs:
        - "component inputs"
        - "packaging inputs"
        - output
        - rejects
        - wastes
        - "stock change"
        - "direct emissions"
      output: "mass-balance closure statement"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Identify camera type, film format, model family, body and optical configuration, included accessories, package contents, product state, and production route."
      evidence: "product specification; packaging bill of materials; final inspection record"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Cover a continuous representative reporting period and disclose shutdowns, start-up, abnormal production, model changeovers, and opening or closing work-in-progress that materially affect results."
      evidence: "dated meter, production, inventory, and quality records"
    - id: dq_completeness
      applies_to: "inventory completeness"
      requirement: "Reconcile purchasing, issue, meter, production, waste, and emission records; add each material crossing flow omitted from the minimum inventory as one atomic exchange."
      evidence: "reconciliation worksheet; operation map; bill of materials; waste manifests"
    - id: dq_measurement
      applies_to: "mass, water, electricity, solvent, and emissions"
      requirement: "Use calibrated instruments or traceable supplier and utility records; retain original units, conversions, sampling plans, detection limits, and allocation drivers."
      evidence: "calibration certificates; invoices; supplier specifications; laboratory reports"
    - id: dq_upstream_representativeness
      applies_to: "linked background datasets"
      requirement: "Match component or material identity, delivered state, geography, technology, and time; disclose and justify every proxy."
      evidence: "dataset metadata; supplier declaration; proxy assessment"
    - id: dq_uncertainty
      applies_to: "calculated and allocated values"
      requirement: "Document measurement uncertainty, sampling variability, balance closure, and sensitivity to material allocation choices; do not replace missing foreground values with uncited typical ranges."
      evidence: "uncertainty calculation; sensitivity record; reviewer note"
validation_rules:
  - rule_id: validation_identity
    applies_to: "product category and reference flow"
    rule: "Confirm that the output is a finished photographic or cinematographic film camera and not a digital camera, video camera, separately sold lens, projector, film, chemical, part, or accessory."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validation_reference_mass
    applies_to: "functional unit and normalization"
    rule: "Confirm that one accepted camera is represented by measured kg in the declared package state and that every normalized amount uses the same accepted-output denominator."
    source_ids: []
  - rule_id: validation_inventory_reconciliation
    applies_to: "foreground inventory"
    rule: "Confirm that production routing, bills of materials, meters, solvent records, waste manifests, and final inspection reconcile to the 12 minimum rows plus separately declared additional atomic exchanges."
    source_ids:
      - us-epa-camera-manufacturing-1977
  - rule_id: validation_electricity
    applies_to: "electricity input"
    rule: "Confirm original kWh or MJ readings, the 3.6 MJ/kWh conversion when used, invoice reconciliation, and the allocation driver for shared loads."
    source_ids: []
  - rule_id: validation_water_and_wastewater
    applies_to: "process water and cleaning wastewater"
    rule: "Confirm source, original meter basis, density conversion, cleaning origin, treatment destination, and water-balance consistency."
    source_ids:
      - us-epa-camera-manufacturing-1977
  - rule_id: validation_solvent_balance
    applies_to: "Isopropanol input and air emission"
    rule: "Confirm chemical identity, purity adjustment, stocks, purchases, recovery, wastewater or waste transfers, abatement, air measurement or calculation, and nonnegative solvent-balance closure."
    source_ids: []
  - rule_id: validation_rejects
    applies_to: "rejected camera assemblies"
    rule: "Confirm that complete-camera rejects are measured separately from reworked units, component scrap, lens scrap, packaging waste, and mixed manufacturing waste."
    source_ids: []
  - rule_id: validation_allocation
    applies_to: "shared processes"
    rule: "Confirm that subdivision was attempted first and that any remaining allocation uses a disclosed, reproducible causal driver or a fully justified last-resort economic basis."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_evidence_gaps
    applies_to: "ranges and unresolved UUIDs"
    rule: "Confirm that UUID-empty rows remain registered in manifest review metadata and that absent empirical ranges are not replaced with single-study values, snippets, or invented bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared photographic or cinematographic film camera configuration"
  downstream_use: "May be used as a secondary_dataset or background_dataset for systems consuming a camera at the factory gate when identity, geography, technology, time, and package state are representative"
  allowed_use: "Cradle-to-gate camera production studies; supply-chain inventories for film-based imaging equipment; comparative studies only when functional unit, included lens and accessories, package state, and boundary are equivalent"
  excluded_use: "Digital-camera production; television or video camera production; separately sold lens or part production; camera use, film consumption, developing, image processing, maintenance, or end-of-life without additional life-cycle modules"
  required_metadata: "PCR id and version; camera type; film format; model family; body and lens configuration; included accessories; package contents; net and packaged mass; production geography; technology; reporting period; on-site and outsourced operations; upstream dataset links; allocation methods; UUID gaps"
  required_quality_disclosure: "Foreground coverage; meter and scale basis; bill-of-material reconciliation; sample sizes; balance closure; solvent recovery and air-emission method; wastewater composition and destination; reject disposition; proxies; uncertainty; unresolved range evidence"
  update_trigger: "Change in camera configuration, film format, included lens or accessories, package design, component supplier or delivered state, production site or route, energy or water supply, cleaning solvent or recovery, waste treatment, allocation driver, or data older than the declared representativeness period"
