allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Shared detector, electronics, enclosure, assembly, testing, and packaging operations"
    rule: "Prefer direct measurement and process subdivision by product model, detector technology, production line, and test route before allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "Residual shared material, energy, facility, and test burdens"
    rule: "Use a documented causal physical driver: measured consumption where available; machine or test time multiplied by attributable load for energy; processed mass for material-handling operations; occupied area and time only for genuinely shared facility services."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "Shared burdens without a defensible physical relationship"
    rule: "Economic allocation is a last resort. Declare the products, price basis, geography, period, price source, and sensitivity to price changes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_rejects
    applies_to: "Internal rework, failed tests, rejects, scrap, and recovered materials"
    rule: "Assign rework, retesting, and reject burdens to accepted output. Record wastes at the boundary and do not deduct recycling credits inside the foreground inventory unless the downstream modelling method explicitly requires and documents them."
    source_ids:
      - eu-pef-2021-2279
      - eu-weee-2012-19-consolidated-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_records
      process_id: "detector_subassembly_production_electronics_and_pcb_production_enclosure_and_mechanical_parts_final_instrument_assembly"
      flow_role: "Materials, components, detector assemblies, electronics, enclosure parts, power systems, probes, cables, and accessories"
      record_type: "ERP issue/return record, bill of materials, purchase record, batch sheet, weighing record"
      raw_fields: "product_model; part_id; material_or_component; supplier; quantity_issued; quantity_returned; unit; measured_mass; included_configuration; lot; process_id"
      collection_method: "Reconcile issued-minus-returned quantities to the as-built bill of materials and convert item counts with measured part mass"
      unit: "native procurement unit and kg"
      frequency: "Per lot or production order"
      temporal_coverage: "Same reporting period as accepted output"
      site_scope: "Every included manufacturing site and outsourced step represented as foreground"
      aggregation_rule: "Sum net consumed quantity by flow and process, then normalize with calc_reference_normalization"
      quality_evidence: "Approved bill of materials, scale calibration, lot trace, supplier declaration, and reconciliation record"
    - protocol_id: cp_energy_utility_records
      process_id: "all_foreground_processes"
      flow_role: "Electricity, fuel, compressed air, water, and purchased thermal energy"
      record_type: "Meter, submeter, invoice, equipment power and operating-time log"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; process_id; equipment_id; operating_time; rated_or_measured_load; allocation_driver"
      collection_method: "Prefer process meters; otherwise allocate a shared meter with documented causal driver"
      unit: "carrier-specific metered unit"
      frequency: "At least monthly and per campaign for intermittent high-load tests"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Every included site"
      aggregation_rule: "Sum by carrier and process, subtract documented non-production use, apply allocation, and normalize with calc_reference_normalization"
      quality_evidence: "Meter calibration or invoice, coverage reconciliation, allocation worksheet, and equipment-load evidence"
    - protocol_id: cp_production_output_records
      process_id: "all_foreground_processes"
      flow_role: "Conforming intermediate output and accepted finished output"
      record_type: "Production release, quality release, count record, and calibrated weighing record"
      raw_fields: "product_model; process_id; lot; quantity_count; gross_mass; tare; net_mass; acceptance_status; release_time"
      collection_method: "Weigh released output; convert counts only with same-model or documented production-weighted measured mass"
      unit: "kg and count"
      frequency: "Per lot"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Every included site"
      aggregation_rule: "Sum accepted net output only; keep rejected and reworked quantities separate"
      quality_evidence: "Calibrated scale record, quality release, lot genealogy, and count-to-mass worksheet"
    - protocol_id: cp_test_calibration_records
      process_id: "calibration_and_performance_verification"
      flow_role: "Calibration, functional, safety, environmental, electromagnetic, mechanical, radiological, firmware, failed-test, and retest activity"
      record_type: "Calibration certificate, test log, equipment log, source or field certificate, service record"
      raw_fields: "product_model; serial_or_lot; detector; firmware; test_standard; test_method; measured_quantity; radiation_type; reference_source_or_field; source_certificate; test_equipment; result; acceptance_limit; pass_fail; test_time; energy; consumables; rework; retest"
      collection_method: "Capture every required test and calibration event and its attributable resources; preserve application-specific criteria"
      unit: "test-specific unit, hour, kWh, kg, and count"
      frequency: "Per instrument or statistically justified production lot as required by the declared standard and test plan"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Every calibration and test facility included"
      aggregation_rule: "Aggregate attributable resources and failures by product model; normalize to accepted net output"
      quality_evidence: "Traceable calibration or source certificate, controlled procedure, test-equipment calibration, raw result, acceptance record, and retest history"
    - protocol_id: cp_waste_emission_records
      process_id: "all_foreground_processes"
      flow_role: "Solid and liquid waste, wastewater, and direct releases"
      record_type: "Waste manifest, scale ticket, wastewater meter, laboratory analysis, stack or discharge monitor, permit calculation"
      raw_fields: "process_id; waste_or_emission; quantity; unit; date; treatment_route; destination; measurement_method; calculation_factor; regulated_classification"
      collection_method: "Measure at source where possible; otherwise reconcile facility totals and allocate with a causal driver"
      unit: "flow-specific unit"
      frequency: "Per shipment or monitoring interval"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "Every included site"
      aggregation_rule: "Sum by flow, compartment, and treatment route; subtract only documented quantities outside scope; normalize to process output or reference flow"
      quality_evidence: "Manifest, meter calibration, laboratory report, permit method, factor source, and mass-balance reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "Packaging materials, packaging waste, and gross-versus-net shipped mass"
      record_type: "Packaging specification, issue record, weighing record, and waste record"
      raw_fields: "product_model; packaging_material; reusable_status; quantity; unit; packaging_mass; net_instrument_mass; gross_shipped_mass; waste_mass"
      collection_method: "Weigh or obtain controlled packaging specification and reconcile net instrument plus packaging to gross shipped mass"
      unit: "kg and item count"
      frequency: "Per packaging specification and production lot"
      temporal_coverage: "Same reporting period as accepted output"
      site_scope: "Every included packaging site"
      aggregation_rule: "Sum material-specific packaging per accepted product and normalize to 1 kg net instrument"
      quality_evidence: "Approved packaging specification, calibrated weighing record, reuse evidence, and gross-net reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground input, output, waste, and elementary flow"
      rule: "normalized amount = reporting-period amount attributable to the product family / reporting-period net mass of accepted finished instruments in kg"
      inputs:
        - "Attributable flow amount"
        - "accepted net finished-instrument mass from cp_production_output_records"
      output: "Flow amount per 1 kg net accepted finished instrument"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_count_to_mass
      applies_to: "Records available in item counts"
      rule: "mass = item count × measured mean net mass for the same model, configuration, and reporting period; for a product family use a disclosed production-count-weighted mean"
      inputs:
        - "Item count"
        - "model-specific measured net mass"
        - "production mix"
      output: "kg"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "Shared electricity and utility meters"
      rule: "attributable energy = total shared consumption × documented causal driver share; use equipment test or operating time multiplied by attributable load where direct submetering is unavailable"
      inputs:
        - "Metered shared consumption"
        - "equipment load"
        - "operating or test time"
        - "production records"
      output: "Carrier-specific energy allocated to the product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "Bill of materials, intermediates, accepted product, rejects, waste, and returned unused material"
      rule: "Reconcile input mass with incorporated product mass, returned unused material, transferred intermediates, waste, and measured stock change; report the residual and its investigation without applying an invented acceptance tolerance"
      inputs:
        - "Material issue and return records"
        - "intermediate and finished output mass"
        - "waste mass"
        - "stock change"
      output: "Material-specific mass-balance statement and unexplained residual"
      source_ids: []
    - id: calc_packaging_separation
      applies_to: "Packaged output"
      rule: "gross shipped mass = net accepted instrument mass + included accessory mass already in product configuration + packaging mass; report net instrument and packaging separately"
      inputs:
        - "Net instrument mass"
        - "configuration record"
        - "material-specific packaging mass"
        - "gross shipment mass"
      output: "1 kg net reference product plus separate kg packaging flows"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_configuration
      applies_to: "Reference flow and product family"
      requirement: "Preserve the exact Tiangong reference-flow UUID and declare every required qualifier, including detector, radiation type, measured quantity, range, application class, included probes or accessories, calibration basis, and integral software or firmware."
      evidence: "Product specification, configuration record, bill of materials, calibration/test plan, and UUID readback"
    - id: dq_material_completeness
      applies_to: "Bill of materials and purchased inputs"
      requirement: "Cover all components and materials incorporated in the delivered configuration and all production consumables crossing the foreground boundary. Retain supplier material declarations and applicable hazardous-substance compliance evidence; disclose missing supplier masses or proxy flows."
      evidence: "Reconciled bill of materials, purchase and issue records, supplier declarations, and applicable RoHS documentation (eu-rohs-2011-65-consolidated-2021)"
    - id: dq_calibration_traceability
      applies_to: "Calibration and performance verification"
      requirement: "Identify the applicable instrument standard and retain raw results, acceptance criteria, calibration configuration, reference radiation or source identity, source or facility certificate, equipment calibration status, failed tests, rework, and retests."
      evidence: "Controlled test procedure, raw test log, calibration certificate, reference-source or field certificate, and release record (iec-62244-2019; iec-63465-2026; iaea-ssg-85-2023)"
    - id: dq_temporal_coverage
      applies_to: "All foreground records"
      requirement: "Use one complete, representative reporting period or a documented production campaign that captures routine production, failures, rework, maintenance, and calibration activity. Explain exclusions, shutdowns, and extrapolation."
      evidence: "Meter coverage, production calendar, maintenance log, calibration schedule, and reconciliation worksheet"
    - id: dq_technology_geography
      applies_to: "Foreground and upstream data"
      requirement: "Match detector technology, electronics route, enclosure route, calibration facility, electricity geography, production site, and supplier geography where material. Disclose every proxy and its expected direction of bias."
      evidence: "Site process map, supplier identity, dataset metadata, and proxy assessment"
    - id: dq_mass_energy_closure
      applies_to: "Materials, packaging, waste, and energy"
      requirement: "Reconcile material and energy records to site and process totals. Report unexplained residuals and correction actions; do not force closure through undocumented balancing flows."
      evidence: "Mass-balance statements, meter reconciliation, packaging gross-net check, and reviewer sign-off"
    - id: dq_regulated_waste
      applies_to: "Radioactive, hazardous, electronic, and battery-related wastes"
      requirement: "Preserve regulated classification, activity or concentration where applicable, treatment route, consignee, and legal scope. Keep downstream WEEE treatment outside the manufacturing foreground dataset unless explicitly added as a separate scenario."
      evidence: "Waste manifest, laboratory or activity measurement, treatment certificate, and applicable WEEE record (eu-weee-2012-19-consolidated-2024)"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Quantitative reference"
    rule: "Fail unless the product flow is 0144e43c-eb28-46f2-be33-804023379cf1, the flow property is Mass 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group is Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, the unit is kg, and the normalized output is exactly 1 kg net accepted instrument."
    source_ids: []
  - rule_id: validate_scope_identity
    applies_to: "Covered product"
    rule: "Fail if the reference product is only a detector module, sensor module, bare detector, separately supplied part or accessory, radioactive source, radiation-generating treatment or inspection equipment, or non-ionizing-radiation instrument."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Product metadata"
    rule: "Fail when any required reference-flow qualifier is missing or when the delivered configuration differs from the recorded configuration."
    source_ids:
      - iec-62244-2019
      - iec-63465-2026
      - iaea-ssg-85-2023
  - rule_id: validate_process_coverage
    applies_to: "Process map and inventory"
    rule: "Fail if final assembly, calibration and performance verification, or packaging is missing; fail when an applicable in-house detector, electronics, printed-circuit-board, enclosure, finishing, or outsourced operation is omitted without disclosure and an upstream dataset."
    source_ids:
      - us-epa-pcb-pollution-prevention-1990
      - eu-pef-2021-2279
  - rule_id: validate_calibration_release
    applies_to: "Accepted output"
    rule: "Fail unless the declared calibration and application-specific performance checks are traceable to controlled records and every accepted instrument or justified production lot has a passing release decision; do not substitute a generic radiation-instrument criterion for the declared product standard."
    source_ids:
      - iec-62244-2019
      - iec-63465-2026
      - iaea-ssg-85-2023
  - rule_id: validate_collection_links
    applies_to: "Foreground-collected and calculated rows"
    rule: "Fail when a row using collected_record or calculated_from_collection lacks its declared collection protocol or when the protocol lacks temporal, site, method, unit, aggregation, or quality evidence."
    source_ids: []
  - rule_id: validate_mass_packaging
    applies_to: "Bill of materials, output, waste, and packaging"
    rule: "Fail when net product mass includes packaging, when material-specific packaging is not reported separately, or when mass reconciliation has no disclosed residual and investigation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "Shared processes"
    rule: "Fail when shared burdens are allocated without subdivision assessment, a documented causal driver, source data, calculation, and sensitivity or fallback disclosure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_regulated_flows
    applies_to: "Hazardous substances, radioactive materials, and waste"
    rule: "Fail when applicable regulated material, activity, hazardous-substance, or waste-treatment information is silently omitted or netted against the product inventory."
    source_ids:
      - eu-rohs-2011-65-consolidated-2021
      - eu-weee-2012-19-consolidated-2024
published_dataset_profile:
  dataset_role: "secondary_dataset; may be selected as background_dataset only when product configuration, detector technology, calibration basis, geography, and data quality match the consuming study"
  downstream_use: "Foreground data package for process and lifecyclemodel construction; comparison of manufacturing routes or configurations only after equivalence of function, performance class, included accessories, calibration basis, and boundary is demonstrated"
  allowed_use: "Cradle-to-manufacturing-site-gate modelling of complete CPC 48241 instruments; supplier and site improvement; contribution analysis; background use for a matching technology and configuration"
  excluded_use: "Standalone claim for an unqualified item; module or component production; non-ionizing-radiation instruments; full life-cycle results without explicit use, maintenance, recalibration, transport, and end-of-life scenarios; comparison across non-equivalent measurement functions or performance classes"
  required_metadata: "Canonical PCR id; CPC reference; exact flow/property/unit-group UUIDs; all required qualifiers; product and included-accessory configuration; reference net mass; production and calibration sites; reporting period; in-house and outsourced process map; standards and calibration basis; allocation; upstream datasets and proxies; packaging; regulated materials and wastes"
  required_quality_disclosure: "Foreground coverage; accepted-output denominator; bill-of-material and mass-balance completeness; meter and allocation coverage; calibration and test traceability; failed-test and rework treatment; proxy age, geography, and technology; packaging separation; regulated material and waste treatment; uncertainty and unresolved gaps"
  update_trigger: "Change in detector principle, radiation type, measured quantity or range, performance or application class, product configuration, included probes/accessories/battery, material composition, electronics or enclosure route, calibration/test standard, firmware affecting measurement, production or calibration site, supplier mix, allocation method, reporting period representativeness, or regulated-substance/waste requirements"
data_sources:
  - id: "unsd-cpc-48241"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC subclass 48241, “Instruments and apparatus for measuring or detecting ionising radiations”, https://unstats.un.org/unsd/classifications/Econ/Detail/EN/3/48241 (retrieved 2026-08-10)"
    used_for: "Official product-category identity and exclusion of component-only reference products"
  - id: "iec-61010-1-2010-amd1-2016"
    type: "standard"
    reference: "IEC 61010-1:2010+AMD1:2016, Safety requirements for electrical equipment for measurement, control, and laboratory use — Part 1: General requirements, https://webstore.iec.ch/en/publication/4279 (retrieved 2026-08-10)"
    used_for: "General scope of electrical measurement equipment and safety-related assembly and verification context"
