measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure the net mass of accepted complete instruments after calibration and performance verification and before packaging; normalize the inventory to exactly 1 kg."
  - id: packaging_mass_separation
    applies_to: "Sales and transport packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure packaging separately by material and do not include it in reference-product mass."
  - id: item_to_mass_conversion
    applies_to: "Production records in instrument counts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts with measured net mass for the same product model or a documented production-weighted product-family average from the same reporting period; retain the count and weighing records."
  - id: bom_mass_consistency
    applies_to: "Product materials, components, detector assemblies, batteries, cables, probes, and accessories included with the product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record masses on one consistent as-installed basis and reconcile the bill of materials, production losses, and accepted output without silently including packaging."
  - id: energy_carrier_preservation
    applies_to: "Electricity, fuel, compressed air, and purchased thermal energy"
    required_property_ref:
      name: "Carrier-specific energy property"
      uuid: ""
    required_unit: "Carrier-specific reference unit"
    rule: "Preserve metered carrier and unit; document every conversion to the reporting unit and allocate only shared consumption using the declared allocation rule."
