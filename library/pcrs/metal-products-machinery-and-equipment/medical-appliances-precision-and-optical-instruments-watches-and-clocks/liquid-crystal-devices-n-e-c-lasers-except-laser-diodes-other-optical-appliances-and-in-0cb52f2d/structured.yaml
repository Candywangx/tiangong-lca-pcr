allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "shared lines, clean rooms, utilities, and test facilities"
    rule: "Subdivide or meter route-specific processes wherever technically feasible before applying allocation."
    source_ids: []
  - rule_id: al_physical_driver
    applies_to: "unavoidable shared burdens"
    rule: "Allocate by a documented causal physical driver such as machine time, metered energy, occupied controlled-space time, or processed mass when that driver represents resource use."
    source_ids: []
  - rule_id: al_economic_fallback
    applies_to: "shared burdens without defensible physical relation"
    rule: "Use economic allocation only as a disclosed fallback; report the revenue basis, price period, currency, and sensitivity to material price changes."
    source_ids: []
  - rule_id: al_recycling_boundary
    applies_to: "recovered glass, metal, boards, or process chemicals"
    rule: "Report waste quantity and recovery destination at the factory gate. Do not claim avoided burden or recycled-content credit inside the foreground inventory unless the downstream modelling method and allocation convention are explicitly declared."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_lcd_inputs
      process_id: "lcd_device_manufacturing"
      flow_role: "each listed atomic product input"
      record_type: "purchase, issue, return, meter, and batch records"
      raw_fields: "row_id; supplier flow identity; quantity; unit; concentration or reference conditions; issue and return quantity; meter boundary; batch_id; timestamp"
      collection_method: "reconcile purchasing and stores records with route meters and production issues"
      unit: "row unit"
      frequency: "each batch or continuous meter with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or all batches for shorter campaigns"
      site_scope: "all site operations serving the selected LCD route"
      aggregation_rule: "sum net issued quantity by row and divide by accepted net product mass"
      quality_evidence: "invoices; material issue and return records; meter calibration; batch genealogy; reconciliation record"
    - protocol_id: cp_lcd_outputs
      process_id: "lcd_device_manufacturing"
      flow_role: "accepted product and each listed waste output"
      record_type: "scale, acceptance, reject, discharge, and waste-transfer records"
      raw_fields: "row_id; quantity; unit; batch_id; acceptance status; contamination; destination; discharge meter; timestamp"
      collection_method: "reconcile accepted-product scales with reject logs, discharge meters, and waste manifests"
      unit: "kg or m3"
      frequency: "each batch or dispatch, with monthly reconciliation"
      temporal_coverage: "same period as cp_lcd_inputs"
      site_scope: "same foreground site and route"
      aggregation_rule: "sum each output by row and divide by accepted net product mass"
      quality_evidence: "calibrated scales; acceptance records; waste manifests; discharge-meter records; mass-balance reconciliation"
    - protocol_id: cp_laser_inputs
      process_id: "non_diode_laser_manufacturing"
      flow_role: "each listed atomic product input"
      record_type: "purchase, issue, gas, water, electricity, and test records"
      raw_fields: "row_id; architecture; material or gas identity; quantity; unit; gas conditions; meter boundary; serial_or_batch_id; timestamp"
      collection_method: "reconcile component issues and utility meters to the declared laser architecture and accepted serial numbers"
      unit: "row unit"
      frequency: "each build or continuous meter with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or all builds for shorter campaigns"
      site_scope: "all site operations serving the selected laser route"
      aggregation_rule: "sum route-attributed quantity by row and divide by accepted net product mass"
      quality_evidence: "supplier records; issue records; meter calibration; architecture bill of materials; serial genealogy"
    - protocol_id: cp_laser_outputs
      process_id: "non_diode_laser_manufacturing"
      flow_role: "accepted product and each listed waste output"
      record_type: "scale, acceptance-test, reject, discharge, and waste-transfer records"
      raw_fields: "row_id; quantity; unit; architecture; serial_or_batch_id; acceptance status; destination; timestamp"
      collection_method: "reconcile accepted-product scales with test logs, reject records, wastewater meters, and waste manifests"
      unit: "kg or m3"
      frequency: "each build, test, or dispatch, with monthly reconciliation"
      temporal_coverage: "same period as cp_laser_inputs"
      site_scope: "same foreground site and route"
      aggregation_rule: "sum each output by row and divide by accepted net product mass"
      quality_evidence: "calibrated scales; test records; reject records; waste manifests; discharge-meter records"
    - protocol_id: cp_optical_inputs
      process_id: "other_optical_instrument_manufacturing"
      flow_role: "each listed atomic product input"
      record_type: "purchase, issue, water, electricity, and production records"
      raw_fields: "row_id; component state; quantity; unit; meter boundary; instrument_id_or_batch; timestamp"
      collection_method: "reconcile bill-of-materials issues and route meters to accepted instrument builds"
      unit: "row unit"
      frequency: "each build or continuous meter with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or all builds for shorter campaigns"
      site_scope: "all site operations serving the selected optical-instrument route"
      aggregation_rule: "sum route-attributed quantity by row and divide by accepted net product mass"
      quality_evidence: "supplier records; issue records; bill of materials; meter calibration; build genealogy"
    - protocol_id: cp_optical_outputs
      process_id: "other_optical_instrument_manufacturing"
      flow_role: "accepted product and each listed waste output"
      record_type: "scale, acceptance-test, sludge, discharge, and waste-transfer records"
      raw_fields: "row_id; quantity; unit; instrument_id_or_batch; acceptance status; sludge solids fraction; destination; timestamp"
      collection_method: "reconcile accepted-product scales with test logs, sludge records, discharge meters, and waste manifests"
      unit: "kg or m3"
      frequency: "each build or dispatch, with monthly reconciliation"
      temporal_coverage: "same period as cp_optical_inputs"
      site_scope: "same foreground site and route"
      aggregation_rule: "sum each output by row and divide by accepted net product mass"
      quality_evidence: "calibrated scales; acceptance records; sludge sampling; waste manifests; discharge-meter records"
  calculation_rules:
    - id: cr_reference_normalization
      applies_to: "every selected-route inventory row"
      rule: "normalized amount = route-period row quantity / route-period accepted net product mass"
      inputs:
        - "reconciled row quantity"
        - "accepted net product mass"
      output: "row amount per 1 kg accepted finished product"
      source_ids: []
    - id: cr_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity_MJ = metered_electricity_kWh × 3.6 MJ/kWh"
      inputs:
        - "route-attributed electricity meter reading in kWh"
      output: "electricity in MJ per reference flow"
      source_ids: []
    - id: cr_water_mass
      applies_to: "process-water rows measured by volume"
      rule: "water_mass_kg = measured_volume_m3 × documented_density_kg_per_m3"
      inputs:
        - "measured water volume"
        - "applicable measured or supplier density"
      output: "process-water mass in kg per reference flow"
      source_ids: []
    - id: cr_route_mass_balance
      applies_to: "each selected route"
      rule: "reconcile total measured incoming mass with accepted product, separately reported waste, direct emissions, inventory change, and a disclosed balance difference; investigate material differences before release"
      inputs:
        - "atomic input and output records"
        - "opening and closing inventory"
      output: "route mass-balance check and unresolved difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Preserve supplier product identity, Tiangong UUID where confirmed, and the exact product or waste state; do not substitute broad category flows for unresolved atomic exchanges."
      evidence: "supplier specification; direct-read identity audit; batch or waste record"
    - id: dq_route
      applies_to: "product and process identity"
      requirement: "Demonstrate that exactly one route applies and disclose subtype, architecture, optical function, wavelength or spectral range, performance grade, and acceptance criteria."
      evidence: "product specification; routing; bill of materials; acceptance plan"
    - id: dq_measurement
      applies_to: "mass, volume, and electricity records"
      requirement: "Use calibrated instruments with stated coverage and retain all conversions, concentrations, gas reference conditions, and meter allocation factors."
      evidence: "calibration certificates; raw readings; conversion worksheet"
    - id: dq_temporal
      applies_to: "foreground dataset period"
      requirement: "Prefer a continuous 12-month period; for shorter or campaign production, cover all builds and explain seasonality, utilization, start-up, and rework representativeness."
      evidence: "production calendar; meter period; campaign records"
    - id: dq_completeness
      applies_to: "selected route"
      requirement: "Reconcile purchases, issues, returns, accepted output, rejects, waste transfers, wastewater, direct emissions, and inventory changes; disclose missing electronics, prototypes, testing, and manufacturing losses."
      evidence: "reconciliation; mass balance; omission register; data coverage matrix"
    - id: dq_source_fit
      applies_to: "linked upstream datasets"
      requirement: "Disclose geography, technology, time, product state, and proxy fit for every material upstream dataset."
      evidence: "dataset mapping table and proxy justification"
validation_rules:
  - rule_id: vr_identity_and_route
    applies_to: "dataset identity"
    rule: "Confirm the reference product is within CPC 48315, is not a laser diode, and selects exactly one process route with all Required qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: vr_reference_mass
    applies_to: "reference flow and inventory"
    rule: "Confirm accepted net product equals 1 kg after normalization and every included row uses the same accepted-product denominator."
    source_ids: []
  - rule_id: vr_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm selected Tiangong UUID, flow type, property, unit group, product state, and official Chinese baseName remain consistent with the direct-read identity; do not accept a proxy UUID."
    source_ids: []
  - rule_id: vr_unresolved_atomic_rows
    applies_to: "UUID-empty rows"
    rule: "Confirm each UUID-empty row remains chemically or physically specific, appears in manifest unresolved metadata, and is not replaced by a broad candidate."
    source_ids: []
  - rule_id: vr_inventory_completeness
    applies_to: "selected route"
    rule: "Confirm all actual bill-of-materials inputs, utilities, chemicals, gases, wastes, wastewater, direct emissions, testing, rework, and rejects are represented by atomic rows or disclosed as absent."
    source_ids:
      - us-epa-2001-computer-display-lca
      - nasa-cr-95573-1968
      - janssen-et-al-2024-mosaic-instrument-lca
  - rule_id: vr_balance_and_allocation
    applies_to: "selected route"
    rule: "Confirm mass-balance differences are investigated and all shared burdens use disclosed subdivision or allocation drivers."
    source_ids: []
  - rule_id: vr_range_status
    applies_to: "quantitative QA"
    rule: "Confirm no external empirical range is claimed unless at least two independent, original-text-verified, boundary-compatible sources support it; otherwise retain foreground collection and the manifest evidence need."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground product-manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset after independent review and resolution of intended-use completeness"
  allowed_use: "Product carbon footprint or LCA modelling for a declared CPC 48315 device when route, function, architecture, performance, geography, technology period, boundary, and data quality match the study"
  excluded_use: "Generic averaging across the three routes; laser-diode production; use-phase service comparison; medical or safety-performance equivalence; substitution for separately classified optical components; claims outside the declared product and factory-gate boundary"
  required_metadata: "PCR id and version; product subtype; selected route; optical function; architecture and gain medium or LCD technology where applicable; wavelength or spectral range; performance grade; included accessories; net mass; packaging treatment; geography; technology period; data period; allocation; cut-offs; upstream dataset mapping; unresolved UUIDs"
  required_quality_disclosure: "primary-data share; meter and scale coverage; temporal and production coverage; mass-balance difference; rework and reject coverage; clean-room or test-facility allocation; missing bill-of-materials items; wastewater and direct-emission coverage; proxy datasets; range-evidence gaps"
  update_trigger: "material change in product architecture, LCD or laser technology, optical performance, supplier bill of materials, site, clean-room or test allocation, yield, energy or water system, waste treatment, upstream dataset fit, or resolution of a UUID or range-evidence need"
