measurement_rules:
  - id: reference_product_mass
    applies_to: "accepted finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net accepted product mass on a calibrated balance. Exclude packaging unless the reference-flow qualifiers explicitly include it. Normalize all route inventory quantities to 1 kg net accepted product."
  - id: electricity_energy_conversion
    applies_to: "purchased electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve the metered electricity record and convert kWh to MJ using 1 kWh = 3.6 MJ. Do not add upstream grid emissions as foreground elementary flows."
  - id: water_mass_conversion
    applies_to: "product-water rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer direct mass records. When water is metered by volume, convert using a documented density applicable to the measured temperature and water quality; retain the source volume and density evidence."
