    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_conditions
    applies_to: "Conditional component rows"
    rule: "Require exactly the rows applicable to the declared configuration; not_applicable must be justified by the bill of materials and must not conceal an alternate component under the same label."
    source_ids: []
  - rule_id: validate_atomic_flows
    applies_to: "All inventory rows"
    rule: "Reject combined or umbrella exchanges; each selected flow must identify one physical product, waste, or energy exchange with a compatible flow type, property, and unit."
    source_ids: []
  - rule_id: validate_normalization
    applies_to: "All normalized amounts"
    rule: "Recalculate the output denominator, count-to-mass conversions, kWh-to-MJ conversion, and every per-kilogram amount from retained raw records."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared operations"
    rule: "Confirm subdivision was attempted first and any physical allocation driver, totals, fractions, affected rows, and sensitivity are disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_completeness_and_gaps
