allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Shared assembly, test, rework, and packaging operations"
    rule: "First avoid allocation by submetering or subdividing operations by model, line, batch, test programme, or packaging configuration."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "Unavoidable shared resource use"
    rule: "When subdivision is not feasible, allocate shared burdens using a documented physical driver that reflects causal use, such as equipment runtime, test duration, or processed mass; do not default to revenue."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_rejects
    applies_to: "Rework and rejected apparatus"
    rule: "Assign rework burdens to conforming output when rework is part of producing that output; assign treatment of rejected apparatus to the reporting batch and do not credit internal recovery unless an exported secondary product is measured."
    source_ids: []
  - rule_id: allocation_disclosure
    applies_to: "All allocated exchanges"
    rule: "Report the shared total, allocation driver, numerator, denominator, resulting fraction, affected rows, and sensitivity when allocation materially affects results."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
