      raw_fields: "model; supplier; movement technology; quantity issued; quantity returned unused; verified unit mass"
      collection_method: "Reconcile issues and unused returns; verify representative unit masses when only counts exist"
      unit: "kg and item"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "Same reporting period as output"
      site_scope: "Reporting facility and declared product lines"
      aggregation_rule: "Sum net issued mass by model and divide by conforming output mass"
      quality_evidence: "Purchase documents; lot traceability; scale calibration; unit-mass sample record"
