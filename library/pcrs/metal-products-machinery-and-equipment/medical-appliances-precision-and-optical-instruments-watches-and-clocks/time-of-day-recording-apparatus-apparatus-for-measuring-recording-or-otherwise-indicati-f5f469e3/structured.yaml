      unit: "kg and item"
      frequency: "Per batch or revision"
      temporal_coverage: "Same reporting period as output"
      site_scope: "Reporting facility and electronic-control routes"
      aggregation_rule: "Sum installed assembly mass and divide by conforming output mass"
      quality_evidence: "Approved bill of materials; supplier declaration; scale calibration; revision history"
    - protocol_id: cp_fabricated_steel_enclosure_input
