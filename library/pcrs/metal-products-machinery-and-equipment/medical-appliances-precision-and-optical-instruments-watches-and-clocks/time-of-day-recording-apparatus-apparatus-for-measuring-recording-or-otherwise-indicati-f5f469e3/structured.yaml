      evidence: "Approved bill of materials; receiving and release records; supplier declarations; UUID audit record"
    - id: dq_measurement
      applies_to: "Mass and electricity records"
      requirement: "Use calibrated or verified instruments, preserve raw units and conversion factors, and document sampling when counts are converted to mass."
      evidence: "Calibration certificates; meter identifiers; scale logs; sampling records"
    - id: dq_temporal_coverage
      applies_to: "All foreground exchanges"
      requirement: "Cover the full reporting period or a documented representative period reconciled to annual production; explain shutdowns, model changes, and atypical test or rework campaigns."
      evidence: "Production calendar; reconciliation worksheet; exception log"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Reconcile bills of materials, energy records, output mass, rejects, and exported wastes; disclose any excluded or proxy flow and its expected influence."
      evidence: "Completeness checklist; mass-balance screen; data-gap register; eu-pef-2021-2279"
    - id: dq_technology_geography
      applies_to: "Upstream datasets"
      requirement: "Match component technology, product state, supplier geography, electricity market, and delivery boundary as closely as available and document proxies."
      evidence: "Supplier metadata; dataset metadata; proxy justification; eu-pef-2021-2279"
