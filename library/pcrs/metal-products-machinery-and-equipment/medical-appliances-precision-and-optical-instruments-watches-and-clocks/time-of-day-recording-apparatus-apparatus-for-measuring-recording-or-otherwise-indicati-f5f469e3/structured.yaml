      record_type: "Bill of materials, receiving, and issue records"
      raw_fields: "enclosure part number; steel grade if declared; coating; supplier; quantity installed; verified unit mass"
      collection_method: "Reconcile installed fabricated enclosures and verify unit mass"
      unit: "kg and item"
      frequency: "Per batch or model"
      temporal_coverage: "Same reporting period as output"
      site_scope: "Reporting facility and steel-enclosure routes"
      aggregation_rule: "Sum installed enclosure mass and divide by conforming output mass"
      quality_evidence: "Approved bill of materials; supplier declaration; scale calibration"
    - protocol_id: cp_moulded_abs_enclosure_input
      process_id: "final_assembly_test_packaging"
      flow_role: "moulded_abs_enclosure_input"
      record_type: "Bill of materials, receiving, and issue records"
      raw_fields: "enclosure part number; polymer declaration; supplier; quantity installed; verified unit mass"
      collection_method: "Reconcile installed moulded enclosures and verify unit mass; retain supplier composition declaration"
      unit: "kg and item"
      frequency: "Per batch or model"
      temporal_coverage: "Same reporting period as output"
      site_scope: "Reporting facility and ABS-enclosure routes"
      aggregation_rule: "Sum installed enclosure mass and divide by conforming output mass"
      quality_evidence: "Approved bill of materials; supplier declaration; scale calibration; iec-62474-2018"
    - protocol_id: cp_electricity_input
      process_id: "final_assembly_test_packaging"
      flow_role: "electricity_input"
      record_type: "Electricity meter, submeter, or equipment-runtime record"
      raw_fields: "meter start; meter end; multiplier; rated power; runtime; model/batch assignment; on-site generation import/export"
      collection_method: "Prefer calibrated submeter readings; otherwise calculate from validated power and runtime and reconcile with facility meter"
      unit: "kWh and MJ"
      frequency: "Per shift or batch, aggregated monthly"
      temporal_coverage: "Representative production period reconciled to annual totals"
      site_scope: "Reporting facility and included lines"
      aggregation_rule: "Allocate shared use under section 7, convert kWh to MJ, divide by conforming output mass"
      quality_evidence: "Meter identifier and calibration; invoices; runtime logs; reconciliation record"
    - protocol_id: cp_corrugated_box_input
