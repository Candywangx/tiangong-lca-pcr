    - protocol_id: cp_rejected_finished_apparatus_output
      process_id: "final_assembly_test_packaging"
      flow_role: "rejected_finished_apparatus_output"
      record_type: "Quality disposition, mass, and treatment records"
      raw_fields: "model; rejected count; unit mass; failure disposition; recovery/rework status; treatment route"
      collection_method: "Reconcile final rejects after rework to waste shipment or treatment records"
      unit: "kg and item"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "Same reporting period as output"
      site_scope: "Reporting facility and all covered lines"
      aggregation_rule: "Sum mass leaving as rejected apparatus and divide by conforming output mass"
      quality_evidence: "Nonconformance report; scale calibration; waste transfer or treatment record"
  calculation_rules:
    - id: calc_normalize_mass_rows
      applies_to: "All mass input and waste rows"
      rule: "normalized amount = net reporting-period row mass / conforming net apparatus output mass"
      inputs:
        - "Net row mass"
        - "conforming output mass"
      output: "kg per kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "Count-only component and product records"
      rule: "mass = sum for each declared model of item count multiplied by verified average net unit mass"
      inputs:
        - "Item count by model"
        - "verified average unit mass by model"
      output: "kg"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity_input"
      rule: "purchased electricity in MJ = allocated purchased electricity in kWh multiplied by 3.6"
      inputs:
        - "Metered or calculated kWh"
        - "allocation fraction"
      output: "MJ per kg reference product"
      source_ids: []
    - id: calc_component_mass_balance_screen
      applies_to: "Component, product, and reject records"
      rule: "Compare incorporated component mass with conforming product mass plus rejected-product mass after accounting for returns and exclusions; investigate rather than force-close differences"
      inputs:
        - "Component masses"
        - "output mass"
        - "rejected mass"
        - "returned components"
        - exclusions
      output: "Documented variance and corrective action"
      source_ids:
        - eu-pef-2021-2279
