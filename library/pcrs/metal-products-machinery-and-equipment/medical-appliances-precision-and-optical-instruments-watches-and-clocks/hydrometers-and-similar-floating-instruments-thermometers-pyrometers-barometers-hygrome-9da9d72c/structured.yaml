system_boundary:
  rules:
    - rule_id: boundary_manufacturing_gate
      applies_to: "foreground manufacturing system"
      rule: "Include on-site component fabrication when performed, instrument assembly, filling or charging where applicable, cleaning and finishing where applicable, calibration and performance testing, rework, packaging, on-site utilities, direct emissions, and waste handling through transfer at the manufacturing-plant gate."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased products and services"
      rule: "Link purchased materials, components, energy carriers, packaging, calibration media, and waste-treatment services to upstream datasets with technology, geography, and time representativeness disclosed. Do not absorb their upstream burdens into an undocumented cut-off."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_completeness
      applies_to: "all foreground processes"
      rule: "Record all material and energy inputs, product and co-product outputs, waste, wastewater, and measured or reportable direct emissions that cross each foreground process boundary. Document exclusions and their justification."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_mercury
      applies_to: "mercury-added instruments or components"
      rule: "Identify intentionally added mercury and mercury compounds. Include mercury input, contained product output, spills or losses, and mercury-containing waste as separate records where such manufacture is lawful and applicable; this PCR does not authorize manufacture, import, export, or an exemption."
      source_ids:
        - minamata-mercury-2024
    - rule_id: boundary_electronic_variants
      applies_to: "electrical or electronic instruments"
      rule: "For electrical or electronic variants, retain a bill of materials and applicable restricted-substance or exemption declarations for monitoring and control instruments; record actual material masses rather than treating legal concentration limits as inventory amounts."
      source_ids:
        - eu-rohs-2011-65
