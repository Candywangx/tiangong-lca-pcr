allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared foreground processes and mixed product families"
    rule: "First avoid allocation through process subdivision, separate metering, separate production records, or expansion of the recorded process boundary where justified."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "remaining shared utilities, equipment time, and consumables"
    rule: "When subdivision is not practicable, use a documented causal physical driver such as machine time, metered energy, processed mass, test duration, or item count only when that driver represents resource use. Do not default to mass for calibration or test activities whose burden is driven by time or test protocol."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic
    applies_to: "multifunctional processes without a defensible physical relation"
    rule: "Use economic allocation only when no defensible physical relation is available. Record prices, currency, geography, time basis, and sensitivity to the allocation choice."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_scrap_rework
    applies_to: "scrap, recovered material, and reworked instruments"
    rule: "Report gross material input, internal rework return, externally recovered material output, and treatment separately. Apply one declared recycled-content and end-of-life convention consistently and do not credit internal scrap twice."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_records
      process_id: "p_component_fabrication_p_instrument_assembly"
      flow_role: "materials, components, filling media, chemicals, and mercury where applicable"
      record_type: "purchasing, BOM, stores issue/return, supplier declaration, batch record"
      raw_fields: "material or component id; product family; lot; issued mass; returned mass; inventory change; supplier; composition; mercury status; restricted-substance status"
      collection_method: "reconcile BOM and lot records to stores and supplier documents"
      unit: "kg, with original unit retained"
      frequency: "each lot; aggregated for the reporting period"
      temporal_coverage: "full declared reporting period or representative campaign"
      site_scope: "each included manufacturing site"
      aggregation_rule: "sum net consumed quantities by material/component and product family, then allocate only under section 7"
      quality_evidence: "approved BOM; weigh records; inventory reconciliation; supplier composition or compliance declaration"
    - protocol_id: cp_energy_records
      process_id: "p_component_fabrication_p_instrument_assembly_p_calibration_testing"
      flow_role: "electricity and fuels"
      record_type: "meter, submeter, invoice, fuel issue log"
      raw_fields: "meter id; start/end reading; fuel quantity; unit; process; downtime; allocation driver"
      collection_method: "prefer process meters; otherwise reconcile facility totals and document allocation"
      unit: "kWh, MJ, kg, or m3 as recorded"
      frequency: "continuous or each billing period"
      temporal_coverage: "full declared reporting period or representative campaign"
      site_scope: "each included site and process"
      aggregation_rule: "subtract excluded uses and normalize allocated process totals to the applicable process output"
