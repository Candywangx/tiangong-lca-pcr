  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "finished reference product"
      rule: "Sum measured conforming net instrument mass; where item counts are converted, multiply count by the measured lot-specific mean net mass; exclude packaging mass."
      inputs:
        - "conforming item count"
        - "lot-specific net mass"
        - "direct lot weights"
        - "packaging tare"
      output: "kg net finished reference product"
      source_ids: []
    - id: calc_normalized_inventory
      applies_to: "every foreground inventory row"
      rule: "Divide the allocated reporting-period quantity by reporting-period kg net finished reference product, preserving the original record and conversion factor."
      inputs:
        - "collected quantity"
        - "allocation result where applicable"
        - "net reference mass"
      output: "quantity per kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_process_mass_balance
      applies_to: "fabrication, assembly, testing, and packaging"
      rule: "Reconcile opening inventory plus inputs with accepted output, rework transfer, waste, emissions, closing inventory, and documented measurement difference for each material family. Investigate rather than silently distributing an unexplained difference."
      inputs:
        - inventory
        - input
        - output
        - rework
        - waste
        - "emission records"
      output: "disclosed process mass balance and unexplained difference"
      source_ids: []
    - id: calc_product_family_mix
      applies_to: "category production mix"
      rule: "Divide conforming net output mass for each instrument family and sensing principle by total conforming net output mass; retain zero-production families as out of scope for the period."
      inputs:
        - "family-level conforming net masses"
      output: "declared production-mix shares"
      source_ids: []
    - id: calc_allocation
      applies_to: "shared foreground quantities"
      rule: "Apply the declared section 7 hierarchy and driver to the reconciled shared total, then verify allocated quantities sum to that total."
      inputs:
        - "shared quantity"
        - "driver values"
        - "product-family outputs"
      output: "allocated foreground quantities and allocation residual"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and product-family mix"
      requirement: "Product names, instrument families, sensing principles, UUID references, and CPC context shall be internally consistent; CPC 48252/48253 instruments or separate parts shall not be silently included."
      evidence: "product specifications; BOM; classification review; release records"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "State the reporting period and demonstrate that production, materials, utilities, waste, and output records cover the same period or document reconciled exceptions."
      evidence: "dated source records; production calendar; reconciliation"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Demonstrate process and input/output completeness against the declared boundary, including rework, rejects, packaging, wastewater, direct emissions, and mercury-containing streams where applicable."
      evidence: "process map; mass and energy reconciliation; exclusion log; eu-pef-2021"
    - id: dq_measurement
      applies_to: "meters, scales, and test equipment"
      requirement: "Retain equipment identity, unit, calibration status, data gaps, substitutions, and uncertainty information where available. Calibration evidence used to claim metrological traceability shall identify the documented chain and stated uncertainties."
      evidence: "calibration certificates; meter register; uncertainty or data-gap record; ilac-p10-2020"
    - id: dq_calibration_performance
      applies_to: "finished instrument acceptance"
      requirement: "Retain product-specific measurand, range, test points, reference standard, result, criterion, and decision; do not merge incompatible instrument families into one performance claim."
      evidence: "calibration/test report; release approval; wmo-no-8"
    - id: dq_supplier_upstream
      applies_to: "purchased materials, components, and services"
      requirement: "Record supplier, geography, technology, data period, product state, and proxy rationale for major upstream datasets."
      evidence: "supplier records; dataset metadata; proxy review"
    - id: dq_mercury_electronics
      applies_to: "mercury-added or electrical/electronic variants"
      requirement: "Declare mercury-added status and applicable restricted-substance or exemption evidence. Treat legal applicability as jurisdiction- and date-specific and do not infer inventory mass from a legal limit."
      evidence: "supplier declarations; composition records; legal applicability review; minamata-mercury-2024; eu-rohs-2011-65"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The product flow UUID shall be 7d4fdf4e-5846-4fc5-b373-e360c312974b, the reference flow property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit shall be kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "foreground data package"
    rule: "Reject as incomplete any package that omits instrument family, sensing principle, measuring interval, accuracy or error declaration, calibration or verification status, mercury-added status, net mass basis, geography, reporting period, or packaging inclusion status."
    source_ids:
      - wmo-no-8
  - rule_id: validate_scope
    applies_to: "product-category identity"
    rule: "Confirm that each included finished product is within the named instrument families. Flag flow/level/general pressure instruments, physical or chemical analysis instruments, medical sphygmomanometers, controllers, and separate parts for manual scope review."
    source_ids:
      - un-cpc-3-0
  - rule_id: validate_process_coverage
    applies_to: "process inventory"
    rule: "Require assembly, calibration/testing, and packaging records; require component fabrication/finishing records when those operations occur on site; require upstream datasets for purchased components."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_inventory_reconciliation
    applies_to: "foreground totals"
    rule: "Confirm output mass, material balances, energy totals, waste transfers, and allocation totals reconcile to source records. Report unexplained residuals and data gaps; do not force them to zero."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_calibration_traceability
    applies_to: "calibration and performance testing"
    rule: "Confirm that claimed metrological traceability is supported by a documented unbroken calibration chain with stated uncertainties and a suitable reference service or documented accepted alternative."
    source_ids:
      - ilac-p10-2020
  - rule_id: validate_mercury_status
    applies_to: "mercury-relevant products"
    rule: "Require an explicit mercury-added declaration. If mercury is present, require separate input, contained output, loss, waste, treatment, and jurisdiction/date applicability records; do not interpret this PCR as regulatory authorization."
    source_ids:
      - minamata-mercury-2024
  - rule_id: validate_electronic_variant
    applies_to: "electrical or electronic products"
    rule: "Require the electrical/electronic applicability decision, material or supplier declaration, and any relied-on exemption identifier; do not convert substance limits into foreground quantities."
    source_ids:
      - eu-rohs-2011-65
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for a declared instrument family or disclosed category production mix"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing-footprint modelling at the declared plant gate; supply-chain inventory for a specified instrument family or disclosed production mix; downstream lifecycle models that add distribution, use, maintenance, and end-of-life explicitly"
  excluded_use: "Unsupported comparison between instrument families or sensing principles; performance or legal-conformity certification; use-stage measurement claims; undisclosed proxy for CPC 48252/48253 instruments or parts; regulatory authorization for mercury-added products"
  required_metadata: "canonical PCR id; reference UUIDs; instrument family and sensing principle; product-family mix; measuring interval; accuracy/error and resolution; calibration/verification status; mercury-added and electronic status; net mass basis; site geography; reporting period; technology route; packaging treatment; allocation; upstream datasets; exclusions"
  required_quality_disclosure: "primary-data coverage; meter and scale status; calibration traceability; BOM and supplier-data completeness; mass, energy, waste, and allocation reconciliation; proxy use; data gaps; uncertainty information where available; legal-applicability date and jurisdiction for mercury or electronic restrictions"
  update_trigger: "Change in product-family mix, sensing principle, mercury-added status, electronic architecture, major material or supplier, on-site fabrication scope, calibration/test procedure, energy system, packaging, allocation method, production geography, or applicable substance-control requirements"
