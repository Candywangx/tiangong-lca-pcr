allocation_rules:
  - rule_id: allocation_01
    applies_to: "shared production lines"
    rule: "Avoid allocation by submetering, production-order records, equipment time, and process subdivision for the declared product configuration."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_02
    applies_to: "unavoidable shared utilities"
    rule: "If subdivision is not practicable, allocate electricity, water, and shared consumables using the physical driver that causes consumption, such as machine time, treated surface area, or measured throughput; disclose the driver and sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_03
    applies_to: "metal scrap and other wastes"
    rule: "Report gross generated waste before recycling credit. Do not assign avoided-production credit inside the foreground unit process; model downstream recycling in a separately declared scenario."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_04
    applies_to: "co-products with economic value"
    rule: "If a valuable co-product remains after subdivision, prefer a causal physical relation; use economic allocation only when no defensible physical relation exists and disclose prices, period, currency, and sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_bom
      process_id: "product_manufacturing"
      flow_role: "material, component, chemical, and packaging inputs"
      record_type: "approved BOM, issue/return records, supplier receipts, sampled unit mass"
      raw_fields: "product configuration; material identity; grade or formulation; lot; quantity issued; quantity returned; unit mass; packaging state"
      collection_method: "reconcile approved BOM to warehouse issues, returns, and supplier receipts; weigh representative counted items"
      unit: "kg"
      frequency: "each production lot, aggregated monthly"
      temporal_coverage: "representative consecutive 12 months or complete shorter campaign"
      site_scope: "each reporting factory and outsourced foreground operation"
      aggregation_rule: "sum net issued mass by atomic material and divide by conforming output mass"
      quality_evidence: "approved BOM revision, calibrated scale record, lot trace, supplier specification, reconciliation variance"
    - protocol_id: cp_energy_meter
      process_id: "product_manufacturing"
      flow_role: "purchased electricity"
      record_type: "meter and equipment log"
      raw_fields: "meter start/end; kWh; production order; machine time; allocation driver; losses included"
      collection_method: "dedicated submeter preferred; otherwise allocate facility meter only across directly supporting equipment using documented drivers"
      unit: "kWh retained, MJ reported"
      frequency: "monthly and at route change"
      temporal_coverage: "same period as output"
      site_scope: "each reporting factory"
      aggregation_rule: "convert kWh to MJ and divide by conforming output mass"
      quality_evidence: "meter identifier, calibration or utility invoice, allocation worksheet"
    - protocol_id: cp_water_meter
      process_id: "product_manufacturing"
      flow_role: "process-water input"
      record_type: "water meter, tank balance, or batch sheet"
      raw_fields: "water volume or mass; density basis; process; lot; returned or recirculated water"
      collection_method: "meter process makeup and distinguish recirculated water from new supply"
      unit: "kg"
      frequency: "monthly or each batch for batch treatment"
      temporal_coverage: "same period as output"
      site_scope: "each reporting factory"
      aggregation_rule: "sum new supplied process water and divide by conforming output mass"
      quality_evidence: "meter identifier, balance closure, density record when converted"
    - protocol_id: cp_output_mass
      process_id: "product_manufacturing"
      flow_role: "conforming and rejected product"
      record_type: "release, test, count, and scale records"
      raw_fields: "configuration; released count; rejected count; unit mass; rework status; packaging mass"
      collection_method: "reconcile quality release and test records to net product weighing"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "same period as inputs"
      site_scope: "each reporting factory"
      aggregation_rule: "sum net conforming mass separately from unreworked rejected mass"
      quality_evidence: "release authorization, functional-test record, calibrated scale, reject disposition"
    - protocol_id: cp_waste_mass
      process_id: "product_manufacturing"
      flow_role: "segregated solid wastes"
      record_type: "container scale ticket and waste transfer record"
      raw_fields: "waste identity; material; gross/tare; moisture or solids basis; destination; internal reuse"
      collection_method: "weigh each segregated waste stream before external treatment or credit"
      unit: "kg"
      frequency: "each container or batch"
      temporal_coverage: "same period as output"
      site_scope: "each reporting factory"
      aggregation_rule: "sum each atomic waste stream, subtract verified tare, divide by conforming output mass"
      quality_evidence: "scale ticket, waste code, photo or composition evidence, transfer document"
    - protocol_id: cp_wastewater
      process_id: "product_manufacturing"
      flow_role: "surface-treatment wastewater"
      record_type: "discharge meter and sampling record"
      raw_fields: "mass or volume; density; treatment status; destination; pH; relevant metals and organics"
      collection_method: "meter each process wastewater route and retain representative composition analyses"
      unit: "kg"
      frequency: "continuous or each discharge batch"
      temporal_coverage: "same period as output"
      site_scope: "each reporting factory"
      aggregation_rule: "sum wastewater crossing the boundary and divide by conforming output mass"
