    - id: calc_05
      applies_to: "product and solid-waste mass balance"
      rule: "closure = total mass inputs − conforming product − separately measured wastes − direct mass emissions − inventory change"
      inputs:
        - "material and chemical inputs"
        - outputs
        - "inventory change"
      output: "unexplained mass and closure percentage"
