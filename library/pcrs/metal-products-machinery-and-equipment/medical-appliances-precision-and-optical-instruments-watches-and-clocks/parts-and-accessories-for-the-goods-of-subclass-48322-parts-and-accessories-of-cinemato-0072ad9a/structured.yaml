  data_quality_requirements:
    - id: dq_01
      applies_to: "product identity"
      requirement: "Freeze the part number, drawing or model, compatible host apparatus, BOM revision, route, and packaging state for each aggregation group."
      evidence: "approved specification and BOM revision"
    - id: dq_02
      applies_to: "temporal representativeness"
      requirement: "Use a representative consecutive 12-month period; a shorter complete campaign is allowed only for new, seasonal, or discontinued production and shall be disclosed."
      evidence: "dated input, output, meter, and production-order records"
    - id: dq_03
      applies_to: "completeness"
      requirement: "Reconcile material issues, output, rejects, wastes, wastewater, and direct emissions; explain exclusions and unresolved mass-balance residuals."
      evidence: "mass-balance worksheet and signed exception log"
    - id: dq_04
      applies_to: "geography and technology"
      requirement: "Identify every reporting factory, outsourced foreground operation, electricity supply geography, and major upstream dataset substitution."
      evidence: "site list, route diagram, supplier and dataset mapping"
    - id: dq_05
      applies_to: "measurement quality"
      requirement: "Retain meter and scale identifiers, calibration or verification status, sampling plans, conversion factors, allocation drivers, and reconciliation variance."
      evidence: "calibration records and calculation workbook"
    - id: dq_06
      applies_to: "source quality"
      requirement: "Distinguish foreground records, calculations, Tiangong identity references, and external method sources; do not convert a single published case into a range."
      evidence: "row-level evidence metadata and source register"
validation_rules:
  - rule_id: validation_01
    applies_to: "product and reference flow"
    rule: "Confirm that the product is one covered finished part or accessory, not a complete apparatus or separately classified objective lens, and that the reference output is exactly 1 kg net conforming product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_02
    applies_to: "configuration completeness"
    rule: "Confirm that all required qualifiers and route flags are populated and that every BOM material, component, chemical, packaging item, waste, and direct emission crossing the boundary is represented by an atomic exchange or an explained data gap."
    source_ids: []
  - rule_id: validation_03
    applies_to: "conditional rows"
    rule: "A conditional material or emission row may be absent only when the frozen BOM, process route, or packaging specification demonstrates non-applicability."
    source_ids: []
  - rule_id: validation_04
    applies_to: "mass and energy"
    rule: "Reperform unit conversions, normalization, input/output mass-balance closure, reject separation, and shared-utility allocation; investigate unexplained residuals."
    source_ids: []
  - rule_id: validation_05
    applies_to: "surface treatment"
    rule: "When surface treatment or solvent coating is declared, verify coating or treatment input, process water, electricity, wastewater, solid residue if generated, and direct NMVOC or a documented zero-release basis."
    source_ids:
      - eu-jrc-stm-bref-2006
      - us-epa-ap42-general-industrial-surface-coating
  - rule_id: validation_06
    applies_to: "allocation"
    rule: "Verify that subdivision was attempted before allocation and that any remaining driver reflects a physical causal relation or is disclosed with sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validation_07
    applies_to: "evidence and unresolved items"
    rule: "Confirm that UUID-empty rows remain recorded as unresolved and that no external numeric range is introduced without at least two independent, boundary-compatible original sources."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset for one declared finished part or accessory configuration"
  downstream_use: "Factory-gate input to host-apparatus manufacture, repair, replacement-part supply, product-footprint studies, or a separately modelled distribution/use/end-of-life lifecyclemodel"
  allowed_use: "Attributional cradle-to-factory-gate modelling when product identity, configuration, geography, technology, period, packaging state, allocation, and data quality fit the study"
  excluded_use: "Direct comparison of unlike functions or compatibility classes; representation of complete apparatus; substitution for a specific objective-lens PCR; use-phase or end-of-life claims without additional models; claims about configurations not covered by the frozen BOM"
  required_metadata: "PCR id and version; CPC context; part number or drawing; compatible host apparatus; function; net mass; BOM revision; route flags; packaging state; factory geography; technology; period; allocation; upstream datasets; unresolved data gaps"
  required_quality_disclosure: "Record coverage; measurement and calibration status; mass-balance closure; utility-allocation method; supplier-data share; treatment and emission method; reject handling; range-evidence gaps; UUID gaps"
  update_trigger: "Change in product configuration, BOM, principal material, supplier geography, manufacturing or coating route, factory, electricity supply, packaging, allocation driver, emission control, or a material change in measured intensity"
