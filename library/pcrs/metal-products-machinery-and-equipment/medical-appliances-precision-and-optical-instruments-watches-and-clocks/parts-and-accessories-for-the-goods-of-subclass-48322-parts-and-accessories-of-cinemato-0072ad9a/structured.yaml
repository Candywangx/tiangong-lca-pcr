  calculation_rules:
    - id: calc_01
      applies_to: "normalized exchange"
      rule: "normalized amount = period exchange amount / period net mass of released conforming product"
      inputs:
        - "exchange amount"
        - "conforming output mass"
      output: "kg, MJ, or row-specific unit per kg reference product"
      source_ids: []
    - id: calc_02
      applies_to: "counted input"
      rule: "input mass = accepted count × sampled mean unit mass"
      inputs:
        - "accepted count"
        - "sampled unit masses"
      output: "kg input"
      source_ids: []
    - id: calc_03
      applies_to: "electricity"
      rule: "reported MJ = metered kWh × 3.6"
      inputs:
