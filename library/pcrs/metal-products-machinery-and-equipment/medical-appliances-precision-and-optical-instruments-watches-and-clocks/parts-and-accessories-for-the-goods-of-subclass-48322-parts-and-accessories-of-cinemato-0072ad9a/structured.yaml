system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default reporting boundary begins when purchased materials, completed components, process chemicals, packaging, water, and energy cross into the reporting factory and ends when the tested, released product is ready at the factory gate. Upstream extraction, material manufacture, and purchased-component manufacture are represented with upstream datasets. Foreground scrap, wastewater, direct air emissions, and rejects are recorded before any credit or downstream treatment model is applied."
      source_ids: []
    - rule_id: boundary_01
      applies_to: "foreground manufacture"
      rule: "Include all configuration-applicable forming, machining, moulding, optical working, cleaning, surface treatment, assembly, testing, and packaging operations controlled by the reporting manufacturer."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-jrc-stm-bref-2006
    - rule_id: boundary_02
      applies_to: "purchased inputs"
      rule: "Model purchased materials and completed components with upstream datasets and do not treat supplier burdens as zero."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_03
      applies_to: "surface treatment"
      rule: "When electrolytic, chemical, or coating treatment occurs, include pretreatment, treatment, rinsing, drying or curing, water, electricity, coating or treatment material, wastewater, solid residues, and direct emissions that cross the boundary."
      source_ids:
        - eu-jrc-stm-bref-2006
        - us-epa-ap42-general-industrial-surface-coating
    - rule_id: boundary_04
      applies_to: "use and end-of-life"
      rule: "Exclude product use, host-apparatus energy, maintenance, and end-of-life from the default factory-gate dataset; add them only in a separately declared downstream lifecycle model."
      source_ids:
        - ghg-protocol-product-standard-2011
