      record_type: "coating/solvent issue, recovery, waste, product-retention, capture, and abatement records"
      raw_fields: "formulation VOC fraction; mass used; mass returned; mass in waste; mass retained; capture efficiency; destruction efficiency; measured emissions"
      collection_method: "use validated stack/fugitive measurement where available; otherwise close a formulation-specific mass balance"
      unit: "kg NMVOC"
      frequency: "each coating campaign, aggregated monthly"
      temporal_coverage: "same period as output"
      site_scope: "each coating line at the reporting factory"
      aggregation_rule: "direct release = VOC input minus recovered, retained, captured-as-waste, and destroyed VOC; divide by conforming output mass"
