      output: "MJ electricity"
      source_ids: []
    - id: calc_04
      applies_to: "NMVOC"
      rule: "released NMVOC = formulation VOC input − recovered VOC − VOC retained in product − VOC transferred in waste − VOC destroyed by abatement"
