allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "multi_product_manufacturing"
    rule: "Avoid allocation by separating component manufacture, electronics, assembly, calibration and packaging records by line, model, configuration, batch or time period whenever meters and production records permit."
    source_ids:
      - abb-pgs300-epd-2024
  - rule_id: allocation_physical_fallback
    applies_to: "shared_energy_auxiliaries_and_waste"
    rule: "When subdivision is not possible, allocate shared electricity, utilities, auxiliaries and waste using the causal physical driver: metered machine time or energy first, then accepted processing time, component mass or released product mass; disclose the driver and test sensitivity for material shared burdens. Economic allocation is not the default."
    source_ids:
      - abb-pgs300-epd-2024
  - rule_id: allocation_rework_and_scrap
    applies_to: "rework_scrap_and_recycling"
    rule: "Return rework burdens to the configuration that caused them. Assign waste treatment to the generating process and do not credit recovered material inside the factory-gate dataset; any recycling substitution or benefit belongs to an explicitly declared downstream scenario."
    source_ids:
      - abb-pgs300-epd-2024
      - siemens-sitrans-lr250-epd-2023
  - rule_id: allocation_no_controller_service_credit
    applies_to: "measurement_service_benefits"
    rule: "Do not credit process-energy, water, safety or control-system benefits enabled by the instrument against its manufacturing burden; such avoided-impact claims belong to a separate consequential or downstream system study."
    source_ids:
      - iec-62828-1-2026
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "component_supply_and_manufacture"
      flow_role: "Sensing mechanism, process-contact parts, housing and retained components"
      record_type: "ERP BOM, drawing, receiving and weighing record"
      raw_fields: "model; configuration; component group; supplier; part number; material; wetted status; contact mode; process connection; IP configuration; origin; quantity; unit mass; accepted mass"
      collection_method: "Export revision-controlled BOM and reconcile sampled or production weighing to accepted receipt and net product mass"
      unit: "kg and item"
      frequency: "Each BOM revision and reporting period"
      temporal_coverage: "Same period as released production"
      site_scope: "Each manufacturing site and configuration family"
      aggregation_rule: "Sum accepted mass by component group and configuration; production-mass weight only after separate configuration reconciliation"
      quality_evidence: "Approved BOM revision, supplier specification, scale calibration, receiving inspection and mass-balance sign-off"
    - protocol_id: cp_material_issue_and_return
      process_id: "component_supply_and_manufacture"
      flow_role: "In-house raw materials, fabrication and assembly auxiliaries"
      record_type: "Stores issue, return and batch record"
      raw_fields: "material id; lot; issued mass; returned mass; recovered mass; process; batch; date"
      collection_method: "Reconcile issued quantity to return, recovered amount and waste disposition"
      unit: "kg or material-specific unit"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "At least one representative year or full shorter campaign"
      site_scope: "Each reporting site and included operation"
      aggregation_rule: "Net input equals issue minus verified return and separately recovered amount, normalized to accepted process output"
      quality_evidence: "Inventory transaction trail and batch reconciliation"
    - protocol_id: cp_inbound_transport
      process_id: "component_supply_and_manufacture"
      flow_role: "Inbound component and material transport"
      record_type: "Shipment, supplier and carrier record"
      raw_fields: "supplier origin; destination; component group; shipment mass; mode; route distance; load factor if known; embedded-transport flag"
      collection_method: "Use actual carrier distance and mode; estimate route only when disclosed and prevent double counting with supplier datasets"
      unit: "kg, km, tkm"
      frequency: "Per shipment or supplier route"
      temporal_coverage: "Same period as component receipts"
      site_scope: "All major supplier routes to each reporting site"
      aggregation_rule: "Sum mass-distance by mode and normalize to accepted component or released product mass"
      quality_evidence: "Bill of lading, carrier record, supplier invoice and route method"
    - protocol_id: cp_process_energy
      process_id: "all_processes"
      flow_role: "Electricity, fuel, compressed air, process water and utilities"
      record_type: "Meter, submeter, invoice and equipment log"
      raw_fields: "carrier; meter id; opening and closing reading; unit; process; operating time; production output; allocation driver"
      collection_method: "Prefer process submetering; reconcile to site invoices and allocate residual shared consumption under section 7"
      unit: "Carrier-specific metered unit"
      frequency: "Continuous or per batch, aggregated monthly"
      temporal_coverage: "At least one representative year or full shorter campaign"
      site_scope: "Each reporting site and process"
      aggregation_rule: "Sum consumption by process and normalize to accepted process output, then reference flow"
      quality_evidence: "Meter calibration, invoice reconciliation and allocation worksheet"
    - protocol_id: cp_electronics_bom
      process_id: "electronics_assembly"
      flow_role: "Electronics, display, communication and power-interface components"
      record_type: "Electronics BOM, pick list, supplier declaration and inspection record"
      raw_fields: "configuration; PCB id; component id; supplier; material or declared composition; quantity; unit mass; display; communication; power arrangement; integral battery; RoHS status"
      collection_method: "Export configuration-specific electronics BOM, reconcile pick quantities and accepted module mass, and retain compliance declaration"
      unit: "kg and item"
      frequency: "Each electronics BOM revision and reporting period"
      temporal_coverage: "Same period as electronic instrument production"
      site_scope: "Each electronics assembly site and configuration"
      aggregation_rule: "Sum accepted fitted mass by module role; record not-fitted state for mechanical configurations"
      quality_evidence: "BOM revision, supplier declaration, pick-list reconciliation and accepted module weighing"
    - protocol_id: cp_assembly_records
      process_id: "instrument_assembly"
      flow_role: "Assembly components, consumables and assembled output"
      record_type: "Work order, issue record, line log and weighing record"
      raw_fields: "configuration; serial or lot; issued component mass; consumable quantity; assembled mass; rework; reject; operating time"
      collection_method: "Link issued parts and consumables to assembled output and preserve configuration attributes"
      unit: "kg, item, hour and carrier-specific unit"
      frequency: "Per batch or work order"
      temporal_coverage: "Same period as released production"
      site_scope: "Each assembly line and site"
      aggregation_rule: "Sum by configuration and normalize to accepted assembled mass, then released net mass"
      quality_evidence: "Work-order closure, calibrated scale, rework log and supervisor sign-off"
    - protocol_id: cp_calibration_records
      process_id: "calibration_and_testing"
      flow_role: "Calibration, functional, sealing and protection tests and their resource use"
      record_type: "Calibration certificate, test-rig log, reference-instrument record and meter reading"
      raw_fields: "serial or lot; variable class; principle; range; test points; reference standard; reference instrument id and validity; acceptance limit; result; uncertainty or accuracy class; calibration date; media; energy; leak or integrity test; IP test basis; rework status"
      collection_method: "Capture digital test-rig output or controlled certificate and link all consumed media and energy to tested and accepted items"
      unit: "item, kg and test- or carrier-specific unit"
      frequency: "Every item unless a justified batch plan applies"
      temporal_coverage: "Same period as released production"
      site_scope: "Each calibration and test station"
      aggregation_rule: "Count accepted, reworked and rejected items separately; normalize resources to accepted mass without dropping failed-test burden"
      quality_evidence: "Traceable certificate, reference-instrument status, controlled procedure and test-system audit trail"
    - protocol_id: cp_waste_records
      process_id: "all_processes"
      flow_role: "Manufacturing, electronics, assembly, calibration and packaging wastes"
      record_type: "Waste scale, container log, manifest and treatment invoice"
      raw_fields: "process; waste type; material; hazardous status; mass; date; destination; treatment route; recovered amount"
      collection_method: "Weigh by process where possible and reconcile dispatched mass to treatment documentation"
      unit: "kg or medium-specific unit"
      frequency: "Per container or shipment, aggregated monthly"
      temporal_coverage: "Same period as production"
      site_scope: "Each reporting site and process"
      aggregation_rule: "Sum by waste type and treatment route; allocate shared containers by documented mass contribution"
      quality_evidence: "Calibrated scale, waste manifest, invoice and hazardous-waste classification"
    - protocol_id: cp_direct_release_records
      process_id: "component_supply_and_manufacture"
      flow_role: "Direct releases to air, water or soil"
      record_type: "Continuous monitor, laboratory result, permit calculation and operating log"
      raw_fields: "substance; compartment; concentration; flow; duration; calculation method; process; date"
      collection_method: "Calculate release from measured concentration and flow or approved permit method; subtract nothing already represented as a technosphere treatment flow"
      unit: "kg or substance-specific unit"
      frequency: "Permit or monitoring frequency"
      temporal_coverage: "Same period as included operations"
      site_scope: "Each release point of each reporting site"
      aggregation_rule: "Sum substance by compartment and normalize to released net mass"
      quality_evidence: "Calibration, laboratory QA, permit method and calculation worksheet"
    - protocol_id: cp_reference_output
      process_id: "packaging_and_release"
      flow_role: "Accepted net instrument output and configuration mix"
      record_type: "Release, serial, production and calibrated weighing record"
      raw_fields: "model; configuration; variable class; contact mode; architecture; process connection; IP rating; electronics; display; communication; power; calibration status; item count; net mass; packaging mass; site; date"
      collection_method: "Sum only released instruments with passed acceptance; separately weigh or calculate net instrument and packaging mass"
      unit: "kg and item"
      frequency: "Per released lot, aggregated monthly"
      temporal_coverage: "Same period as all foreground inputs"
      site_scope: "Each reporting site and configuration"
      aggregation_rule: "Normalize all included foreground quantities by net released-product mass; production-mass weight configuration inventories"
      quality_evidence: "Calibrated scale, release record, calibration acceptance and packaging BOM reconciliation"
    - protocol_id: cp_packaging_bom
      process_id: "packaging_and_release"
      flow_role: "External distribution packaging"
      record_type: "Packaging BOM, issue and release record"
      raw_fields: "material; packaging component; quantity; unit mass; recycled content if evidenced; released lot; waste"
      collection_method: "Reconcile packaging issued to packaged output and separately collected packaging waste"
      unit: "kg and item"
      frequency: "Each packaging revision and reporting period"
      temporal_coverage: "Same period as released production"
      site_scope: "Each packaging site and configuration"
      aggregation_rule: "Sum packaging mass by material per net kg released product"
      quality_evidence: "Packaging specification, scale calibration, issue record and supplier declaration"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = included foreground amount / measured net mass of released accepted instruments"
      inputs:
        - "included amount"
        - "net released-product mass"
      output: "amount per 1 kg net released instrument"
      source_ids: []
    - id: calc_component_mass_balance
      applies_to: "Product BOM"
      rule: "mass-balance residual = net released-product mass - sum of retained component-group masses; investigate rather than silently allocating any material residual"
      inputs:
        - "net product mass"
        - "sensing mechanism"
        - "process-contact parts"
        - housing
        - electronics
        - "display/communication"
        - "power components"
        - seals
        - fasteners
        - coatings
        - "fill fluids"
        - "other retained materials"
      output: "component mass-balance residual and reconciliation status"
      source_ids:
        - abb-pgs300-epd-2024
    - id: calc_item_to_mass
      applies_to: "Item-based production records"
      rule: "amount per kg = total item-based amount / measured net released mass for the same model, lot, site and period"
      inputs:
        - "item-based amount"
        - "released item count"
        - "net released mass"
      output: "amount per kg net released instrument"
      source_ids: []
    - id: calc_transport_service
      applies_to: "Inbound transport"
      rule: "tonne-kilometres = shipment mass in tonnes × actual route distance in kilometres; sum by mode and prevent duplication with embedded supplier transport"
      inputs:
        - "shipment mass"
        - "route distance"
        - "transport mode"
        - "embedded-transport flag"
      output: "tkm by mode per kg net released instrument"
      source_ids:
        - abb-pgs300-epd-2024
    - id: calc_configuration_mix
      applies_to: "Multi-configuration dataset"
      rule: "mixed inventory = sum of each configuration inventory × its share of verified net production mass; do not use sales value or unweighted model count"
      inputs:
        - "configuration-specific inventory"
        - "configuration net production mass"
      output: "production-mass-weighted mixed inventory"
      source_ids:
        - abb-pgs300-epd-2024
  data_quality_requirements:
    - id: dq_scope_identity
      applies_to: "Reference product"
      requirement: "Demonstrate that every reference output is a complete CPC 48252 instrument and not an excluded trade meter, automatic controller, instrument class or standalone sensing element or part."
      evidence: "Product specification, functional description, configuration code and released-product inspection"
    - id: dq_configuration_completeness
      applies_to: "Product family and configuration mix"
      requirement: "Preserve measured-variable, contact mode, mechanical/electronic architecture, measurement principle and range, medium, sensing/wetted materials, housing, process connection, protection rating, electronics, display/communication, power and calibration attributes for each configuration."
      evidence: "Revision-controlled BOM, drawings, technical specification, calibration record and configuration weighting file"
    - id: dq_mass_balance
      applies_to: "Components, waste and output"
      requirement: "Reconcile retained component-group mass to measured net product mass and reconcile issued materials to product, return, recovered material and waste; investigate material residuals."
      evidence: "Calibrated weighing records, BOM reconciliation and waste manifests"
    - id: dq_temporal_site_match
      applies_to: "Foreground records"
      requirement: "Use the same site and reporting period for production output, energy, materials, calibration resources, waste and packaging; disclose substitutions and non-representative shutdown or start-up periods."
      evidence: "Meter periods, production ledger, site identifier and representativeness note"
    - id: dq_calibration_traceability
      applies_to: "Calibration and testing"
      requirement: "Link accepted product to a controlled calibration or test record, reference-instrument validity, acceptance limit, result and date; a generic certificate without configuration or lot linkage is insufficient."
      evidence: "Calibration certificate, reference-instrument status and test-rig audit trail"
    - id: dq_electronics_and_substances
      applies_to: "Electronic configurations"
      requirement: "Collect configuration-specific electronics/display/communication/power BOM and applicable hazardous-substance compliance evidence; do not represent an electronic instrument as a generic mechanical device."
      evidence: "Electronics BOM and supplier declarations, including applicable RoHS evidence"
    - id: dq_proxy_disclosure
      applies_to: "Upstream and background datasets"
      requirement: "Identify each proxy, represented component/material/technology, geography, time and mass share; replace material proxies when supplier-specific evidence becomes available."
      evidence: "Dataset mapping register and proxy justification"
validation_rules:
  - rule_id: validation_scope_gate
    applies_to: "reference_product"
    rule: "Reject a dataset whose reference output is a trade or utility supply meter, automatic regulating or controlling apparatus, navigational/hydrological/meteorological or physical/chemical-analysis instrument, standalone sensor or transducer, part, module or accessory."
    source_ids:
      - iec-62828-1-2026
  - rule_id: validation_reference_identity
    applies_to: "reference_flow"
    rule: "Require product flow 7af33061-607c-44d5-bafb-cb4efe98f0ec, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and 1 kg measured net released-product mass excluding external packaging."
    source_ids: []
  - rule_id: validation_required_qualifiers
    applies_to: "dataset_metadata"
    rule: "Fail completeness when any required measured-variable, contact-mode, architecture, measurement principle/range, medium, sensing/wetted material, housing, process connection, protection, electronics, display/communication, power, calibration, site, mass or packaging qualifier is missing."
    source_ids:
      - iec-62828-1-2026
      - iec-60529-2013
      - abb-pgs300-epd-2024
  - rule_id: validation_complete_bom
    applies_to: "component_inventory"
    rule: "Require explicit sensing or measuring mechanism, process-contact hardware, housing, electronics, display/communication, power-interface and other retained-component records, using documented not-fitted states for inapplicable electronic groups; require component mass reconciliation to net product mass."
    source_ids:
      - abb-pgs300-epd-2024
      - siemens-sitrans-lr250-epd-2023
  - rule_id: validation_process_coverage
    applies_to: "process_inventory"
    rule: "Require component supply, instrument assembly, calibration/testing and packaging; require in-house component and electronics operations when the declared route performs them, with energy, auxiliaries and wastes linked to foreground protocols."
    source_ids:
      - abb-pgs300-epd-2024
  - rule_id: validation_calibration_acceptance
    applies_to: "released_output"
    rule: "Count only instruments with passed configuration-specific calibration and factory acceptance as released output; preserve failed-test energy, media, rework and disposal burdens in the producing period."
    source_ids:
      - iec-62828-1-2026
  - rule_id: validation_no_double_counting
    applies_to: "upstream_and_downstream"
    rule: "Reject duplicated component production or transport already embedded in upstream datasets and reject factory-gate inventories that also embed undisclosed use-phase, maintenance or end-of-life burdens."
    source_ids:
      - abb-pgs300-epd-2024
      - siemens-sitrans-lr250-epd-2023
  - rule_id: validation_electronic_end_of_life_disclosure
    applies_to: "downstream_profile"
    rule: "For electronic configurations, require downstream users to disclose applicable separate-collection, hazardous-substance and treatment assumptions rather than treating the instrument as unsorted municipal waste."
    source_ids:
      - eu-rohs-2011-consolidated-2026
      - eu-weee-2012-consolidated-2024
      - siemens-sitrans-lr250-epd-2023
published_dataset_profile:
  dataset_role: "Cradle-to-gate production dataset for complete calibrated instruments, with configuration-specific or production-mass-weighted foreground evidence"
  downstream_use: "Secondary dataset or background dataset for process-instrument manufacturing; input to lifecycle models that add explicit distribution, operational electricity, maintenance/recalibration, replacement and end-of-life scenarios"
  allowed_use: "Complete instruments within the declared scope and configuration mix; comparative use only when reference amount, boundary, geography, technology, variable/contact/architecture mix, connection/protection, electronics/power and data quality are equivalent"
  excluded_use: "Standalone sensors or parts; trade or utility meters; automatic controllers; excluded instrument classes; claims about avoided process energy, water or safety impacts; undisclosed mixing of factory-gate and use/end-of-life burdens"
  required_metadata: "PCR id; product-flow UUID; site; geography; period; measured-variable/contact/architecture and principle mix; intended medium; sensing/wetted and housing materials; process connection; IP or other protection rating and basis; electronics/display/communication/power configuration; calibration and acceptance basis; net mass; packaging mass; production route; allocation; upstream dataset and proxy register"
  required_quality_disclosure: "BOM and mass-balance coverage; meter and scale calibration; configuration weighting; calibration traceability; supplier and transport coverage; proxy mass shares; waste and direct-release coverage; applicable RoHS/WEEE assumptions for downstream electronic configurations"
  update_trigger: "BOM, sensing principle, wetted or housing material, process connection, protection rating, electronics/display/communication/power design, calibration route, manufacturing site or energy supply changes; material supplier or transport changes; configuration-mix shift; new foreground period; or a revised applicable standard or legal requirement"
data_sources:
  - id: "iec-62828-1-2026"
    type: "standard"
    reference: "IEC 62828-1:2026, Reference conditions and procedures for testing industrial and process measurement transmitters — Part 1: General procedures for all types of transmitters, https://webstore.iec.ch/en/publication/86735 (retrieved 2026-08-09)"
    used_for: "Complete-transmitter scope; pressure/level/flow and analogue/digital typology; calibration and performance-test records"
  - id: "iec-60529-2013"
    type: "standard"
