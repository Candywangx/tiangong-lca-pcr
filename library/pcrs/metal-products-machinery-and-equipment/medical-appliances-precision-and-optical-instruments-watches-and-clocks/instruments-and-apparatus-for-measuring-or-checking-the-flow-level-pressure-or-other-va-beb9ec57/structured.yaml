measurement_rules:
  - id: reference_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground amounts to 1 kg measured net mass of released finished instrument; exclude external distribution packaging from reference-product mass and report packaging separately."
  - id: component_mass_reconciliation
    applies_to: "Product bill of materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile sensing or measuring mechanism, wetted or process-connection parts, housing, electronics, display or communication, power-interface parts, seals, fasteners, and other retained materials to measured net product mass; document moisture, fill-fluid, coating, adhesive, and rounding treatment."
  - id: configuration_weighting
    applies_to: "Product-family or production-mix dataset"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weight configuration-specific inventories by verified production mass, not sales value or an unweighted model average; retain each configuration's measured-variable, contact-mode, architecture, connection, protection, electronics, communication, power, and calibration attributes."
  - id: item_to_mass_conversion
    applies_to: "Records available only per instrument item"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item-based component, energy, test-media, waste, and packaging records using measured net mass and released item count for the same model, lot, site, and reporting period."
