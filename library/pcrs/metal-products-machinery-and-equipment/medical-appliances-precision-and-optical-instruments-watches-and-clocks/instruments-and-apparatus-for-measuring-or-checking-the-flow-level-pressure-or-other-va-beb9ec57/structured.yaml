system_boundary:
  rules:
    - rule_id: system_boundary_complete_instrument
      applies_to: "product_scope"
      rule: "Include only a complete calibrated instrument as reference output; standalone sensing elements, transducers, parts and modules may enter as component inputs but shall not be reported as the reference product."
      source_ids:
        - iec-62828-1-2026
        - abb-pgs300-epd-2024
    - rule_id: system_boundary_cradle_to_gate
      applies_to: "foreground_system_boundary"
      rule: "Include upstream material and component supply, inbound transport, in-house component and electronics operations when performed, final assembly and sealing, factory calibration and functional testing, packaging operations, manufacturing energy and auxiliaries, process wastes and released product."
      source_ids:
        - abb-pgs300-epd-2024
        - siemens-sitrans-lr250-epd-2023
    - rule_id: system_boundary_configuration
      applies_to: "configuration_coverage"
      rule: "Keep separate or explicitly weighted inventories when measured-variable class, contact mode, mechanical/electronic architecture, process connection, enclosure protection, electronics, display/communication, power supply, calibration route or material composition changes."
      source_ids:
        - iec-62828-1-2026
        - iec-60529-2013
        - abb-pgs300-epd-2024
    - rule_id: system_boundary_downstream
      applies_to: "downstream_scenarios"
      rule: "Distribution, installation, operational energy, field recalibration or maintenance, service-life replacement, de-installation and end-of-life are outside the cradle-to-gate reference dataset; model them as explicit downstream scenarios when required and do not mix them into factory-gate production."
      source_ids:
        - siemens-sitrans-lr250-epd-2023
        - eu-weee-2012-consolidated-2024
boundary_abstraction:
  declared_starting_condition: "Purchased raw materials, components, subassemblies, auxiliary materials, and packaging are received at the reporting manufacturing site with supplier identity, origin, mass, and upstream dataset reference declared."
  starting_condition_role: "Cradle-to-gate foreground starting condition for instrument manufacture and release"
  product_classification_scope: "Complete CPC 48252 instruments only; utility or trade settlement meters, automatic controllers, excluded instrument classes, and standalone sensing elements or other parts remain outside the reference product."
  recursive_input_rule: "A purchased complete instrument in the same category used inside a system shall be recorded once as an upstream product input with its mass, supplier, configuration and function; do not recursively reopen its manufacture inside the same foreground package."
  upstream_dataset_requirement: "Use supplier-specific upstream datasets for sensing elements, process-contact hardware, housings, printed-circuit assemblies, displays, communication modules, power components and major materials when available; otherwise document the selected background proxy and the mass and technology it represents."
  disclosure: "Declare site, reporting period, production mix, measured-variable/contact/architecture split, process connections and protection ratings, complete component-group mass balance, electronics/display/communication/power configuration, calibration and test basis, inbound transport, manufacturing energy and auxiliaries, wastes, net output, and packaging."
