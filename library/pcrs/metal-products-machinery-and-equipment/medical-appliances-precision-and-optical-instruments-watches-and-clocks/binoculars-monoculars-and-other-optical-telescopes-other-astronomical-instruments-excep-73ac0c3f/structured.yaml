    applies_to: "all inventory rows"
    rule: "Every row must be one atomic exchange; UUID-empty rows must remain explicitly unresolved and no category label may replace a concrete flow."
    source_ids: []
  - rule_id: validate_conditional_routes
    applies_to: "conditional processes"
    rule: "Each conditional process must be marked included or not applicable with evidence; when excluded, its internally produced intermediates must not be counted and exact purchased substitutes must be added."
