    - id: convert_electricity_to_mj
      applies_to: "r02_optics_electricity; r09_machining_electricity; r13_electronics_electricity; r19_assembly_electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered or calculated kWh"
      output: "MJ electricity"
