    - protocol_id: cp_final_packaging
      process_id: "final_packaging"
      flow_role: "product and packaging inputs; reference output"
      record_type: "transfer, BOM, scale, and packaging issue records"
      raw_fields: "model/configuration; unboxed mass; packaging component/count/mass; finished net mass"
      collection_method: "Reconcile unboxed transfer, exact shipment configuration, and net reference output"
