      unit: "kg; MJ"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or justified production campaign"
      site_scope: "Reporting site and declared machines"
      aggregation_rule: "Sum attributable records and normalize by net reference-product kg"
