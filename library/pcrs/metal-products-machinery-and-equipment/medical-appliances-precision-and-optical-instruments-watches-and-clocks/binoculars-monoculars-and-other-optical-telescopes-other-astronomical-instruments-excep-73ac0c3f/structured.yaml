  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable period amount / accepted net instrument mass in the same period"
      inputs:
        - "attributable exchange amount"
        - "accepted net instrument mass"
      output: "exchange per 1 kg net reference product"
