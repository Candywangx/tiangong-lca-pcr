allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "all processes"
    rule: "Collect model-, batch-, line-, or equipment-specific data and subdivide processes whenever feasible, avoiding allocation."
    source_ids:
      - eu-pef-2021-method
  - rule_id: allocation_shared_resources
    applies_to: "shared electricity, water, consumables, and facility services"
    rule: "Allocate by a documented physical causal driver: metered consumption first, then equipment operating time multiplied by rated or measured demand, then batch processing time or mass only when demonstrably causal. Never allocate by revenue without showing that no physical relationship is practicable."
    source_ids:
      - eu-pef-2021-method
  - rule_id: allocation_recycling_outputs
    applies_to: "r06_waste_polishing_media; r11_aluminium_scrap"
    rule: "Record the measured waste output at the foreground boundary without avoided-burden credit. Link downstream treatment or recycling consistently; disclose any alternative recycling convention outside this PCR result."
    source_ids:
      - eu-pef-2021-method
  - rule_id: allocation_internal_transfers
    applies_to: "r05_finished_optical_element; r10_optomechanical_component; r14_electronics_subassembly; r20_unboxed_instrument and paired inputs"
    rule: "Internal transfers receive no independent environmental burden or co-product allocation; burdens remain in their producing foreground processes and transfer quantities must balance."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_optical_element_fabrication
      process_id: "optical_element_fabrication"
      flow_role: "all inputs and outputs"
      record_type: "meter, stock, transfer, and waste records"
      raw_fields: "timestamps; batch/model; opening/receipts/issues/returns/closing; meter readings; output and waste mass"
      collection_method: "Reconcile batch and period records for the exact in-house route"
      unit: "kg; MJ"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or justified production campaign"
      site_scope: "Reporting site and declared equipment"
      aggregation_rule: "Sum valid records, subtract returns and carry-over, allocate shared resources, then divide by net reference-product kg"
      quality_evidence: "Calibration, invoices, stock ledgers, meter logs, transfer tickets, waste manifests"
    - protocol_id: cp_optomechanical_component_fabrication
      process_id: "optomechanical_component_fabrication"
