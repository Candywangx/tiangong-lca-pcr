    - protocol_id: cp_electronics_integration
      process_id: "electronics_integration"
      flow_role: "all inputs and outputs"
      record_type: "purchase issue, meter, and transfer records"
      raw_fields: "timestamps; assembly part number; issued/returned mass; meter readings; accepted output"
      collection_method: "Reconcile accepted purchased boards, workstation energy, and internal transfers"
      unit: "kg; MJ"
      frequency: "Per batch"
      temporal_coverage: "Representative continuous 12-month period or justified production campaign"
      site_scope: "Reporting site and declared workstations"
      aggregation_rule: "Sum attributable records and normalize by net reference-product kg"
      quality_evidence: "BOM, receiving records, meter or equipment logs, test and transfer records"
    - protocol_id: cp_instrument_assembly_alignment_testing
      process_id: "instrument_assembly_alignment_testing"
      flow_role: "all inputs and outputs"
      record_type: "transfer, dispensing, meter, and acceptance records"
      raw_fields: "timestamps; model/configuration; transferred masses; adhesive stock or dispensing; energy; accepted and rejected units"
      collection_method: "Reconcile internal or purchased components, adhesive, energy, and accepted output"
      unit: "kg; MJ"
      frequency: "Per production batch"
      temporal_coverage: "Representative continuous 12-month period or justified production campaign"
      site_scope: "Reporting assembly and test site"
