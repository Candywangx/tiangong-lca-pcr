validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Exactly one quantitative reference must resolve to UUID d2f8e7e0-b94f-4ea8-a75d-19f3ef90a8c7, Mass, kg, and an amount of 1 after normalization; all required qualifiers must be declared."
