allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "multi-product manufacturing"
    rule: "Subdivide and meter product lines, surface-treatment batches and test cells wherever technically feasible before applying allocation."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, fuel and water"
    rule: "Use process submeters first; otherwise allocate with a documented physical driver such as machine time, treated area, bath throughput or product mass that causally represents resource use."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "steel, aluminium and coating wastes"
    rule: "Record the measured outgoing waste at the foreground boundary and its actual destination; do not claim avoided virgin-production credits inside this cradle-to-gate inventory."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework and rejects"
    rule: "Assign rework and reject burdens to the reporting-period conforming output that caused them; disclose unusual campaigns and do not omit failed factory tests."
    source_ids: []
  - rule_id: allocation_pallet_reuse
    applies_to: "reusable wooden pallets"
    rule: "Allocate pallet mass by the documented number of dispatch uses or another auditable physical reuse record; a single-use assumption must be explicit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_components
      process_id: "material_fabrication"
      flow_role: "each named purchased material or component"
      record_type: "approved bill of materials, issue/return record, supplier specification, check weight"
      raw_fields: "model; lot; item code; count; issued mass; returned mass; installed mass; supplier mass"
      collection_method: "reconcile production orders to stock issue/return and verify count-to-mass conversions by weighing"
      unit: "kg and count"
      frequency: "each production order; monthly reconciliation"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "all manufacturing sites in dataset"
      aggregation_rule: "sum net issued mass for conforming items and normalize by quality-released count"
      quality_evidence: "approved BOM revision, calibrated-scale record, supplier certificate, stock reconciliation"
    - protocol_id: cp_process_electricity
      process_id: "material_fabrication_assembly_testing_packaging"
      flow_role: "purchased electricity"
      record_type: "submeter, utility meter and production log"
      raw_fields: "meter start/end; multiplier; process; operating time; conforming count"
      collection_method: "read dedicated submeters or allocate facility meter with documented physical driver"
      unit: "MJ"
      frequency: "monthly and at campaign boundaries"
      temporal_coverage: "same period as production output"
      site_scope: "reporting-site boundary"
      aggregation_rule: "subtract documented non-production loads, allocate by process and normalize by conforming item"
      quality_evidence: "meter calibration/status, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_fabrication_scrap
      process_id: "material_fabrication"
      flow_role: "each named metal scrap"
      record_type: "scale ticket, scrap-bin log, transfer note"
      raw_fields: "material identity; gross; tare; net mass; internal reuse; destination"
      collection_method: "weigh segregated scrap and reconcile to material mass balance"
      unit: "kg"
      frequency: "each transfer; monthly reconciliation"
      temporal_coverage: "same period as material consumption"
      site_scope: "reporting-site fabrication area"
      aggregation_rule: "sum net external transfer by material and normalize by conforming item"
      quality_evidence: "calibrated scale, transfer documentation, mass-balance check"
    - protocol_id: cp_surface_materials
      process_id: "surface_treatment"
      flow_role: "each named coating or bath chemical"
      record_type: "purchase, issue, concentration and recovery record"
      raw_fields: "product identity; solution mass; active concentration; issued mass; recovered mass; batch"
      collection_method: "reconcile chemical/coating issue and recovery; calculate active mass where applicable"
      unit: "kg"
      frequency: "each bath make-up or coating batch"
      temporal_coverage: "same period as treated output"
      site_scope: "onsite surface-treatment boundary"
      aggregation_rule: "sum net consumed mass and allocate to conforming treated parts"
      quality_evidence: "SDS/product specification, concentration test, stock reconciliation"
    - protocol_id: cp_surface_utilities
      process_id: "surface_treatment"
      flow_role: "process water, natural gas and electricity"
      record_type: "water/gas/electricity meter and treatment log"
      raw_fields: "meter start/end; correction factor; reference conditions; treated batch; conforming output"
      collection_method: "use dedicated meters or documented causal allocation"
      unit: "kg, m3 and MJ"
      frequency: "per batch where metered; monthly minimum"
      temporal_coverage: "same period as surface-treated output"
      site_scope: "onsite surface-treatment boundary"
      aggregation_rule: "correct units/reference conditions, allocate to conforming treated parts and normalize per item"
      quality_evidence: "meter calibration/status, invoices, batch records"
    - protocol_id: cp_surface_wastes
      process_id: "surface_treatment"
      flow_role: "each named wastewater or coating waste"
      record_type: "discharge meter, tank/scale ticket, manifest"
      raw_fields: "waste identity; quantity; density; treatment; destination; date"
      collection_method: "meter or weigh each segregated waste and reconcile with inputs"
      unit: "kg"
      frequency: "each discharge/transfer; monthly reconciliation"
      temporal_coverage: "same period as surface-treatment inputs"
      site_scope: "onsite generation to first waste receiver"
      aggregation_rule: "sum actual outgoing mass by waste identity and normalize per item"
      quality_evidence: "discharge record, density measurement, waste manifest, mass-balance check"
    - protocol_id: cp_surface_direct_emissions
      process_id: "surface_treatment"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack measurement or site fuel-carbon balance"
      raw_fields: "stack flow; concentration; time; gas volume; fuel carbon content; oxidation basis; allocation driver"
      collection_method: "measure stack mass or calculate from metered fuel and documented carbon balance"
      unit: "kg"
      frequency: "per test campaign or reporting period"
      temporal_coverage: "same period as curing fuel"
      site_scope: "direct onsite emission boundary"
      aggregation_rule: "calculate direct fossil CO2 only and allocate to conforming treated parts"
