      raw_fields: "component identity; count; unit mass; consumed mass; reuse cycles; product count"
      collection_method: "weigh packaging or multiply issued counts by verified unit mass"
      unit: "kg and count"
      frequency: "each packaging configuration; monthly reconciliation"
      temporal_coverage: "same period as dispatched output"
      site_scope: "reporting-site packaging boundary"
