      collection_method: "weigh each model sample or every item as required and count only conforming released output"
      unit: "kg and count"
      frequency: "each item or statistically justified batch"
      temporal_coverage: "full reporting period"
      site_scope: "all sites and models in dataset"
      aggregation_rule: "sum released net mass and count; report mass per item and variability"
      quality_evidence: "calibrated scale, signed test record, nonconformance log"
  calculation_rules:
    - id: calc_net_material_input
      applies_to: "named BOM materials"
      rule: "net material input = issued mass − documented unused return; separately report waste rather than subtracting external scrap from the purchased-input exchange"
      inputs:
        - "issued mass"
        - "return mass"
        - "conforming count"
      output: "kg per item"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "screws and packaging"
      rule: "component mass = installed or issued count × batch-specific verified unit mass; reconcile with check weight"
      inputs:
        - count
        - "verified unit mass"
        - "check weight"
      output: "kg per item"
      source_ids: []
    - id: calc_active_sodium_hydroxide
      applies_to: "sodium hydroxide"
      rule: "active NaOH mass = solution mass × measured mass fraction; retain concentration and solution-state records"
      inputs:
        - "solution mass"
        - "measured concentration"
      output: "kg active NaOH per item"
      source_ids: []
    - id: calc_process_allocation
      applies_to: "shared utility meters"
      rule: "process exchange per item = corrected reporting-period process quantity × causal allocation share ÷ conforming item count"
      inputs:
        - "corrected meter quantity"
        - "allocation driver"
        - "conforming count"
      output: "row unit per item"
      source_ids: []
    - id: calc_surface_fossil_co2
      applies_to: "direct curing emission"
      rule: "use measured stack mass, or calculate fossil CO2 from metered gas and documented fuel-carbon balance; exclude upstream supply and electricity emissions"
      inputs:
        - "stack data or corrected gas volume"
        - "fuel carbon content"
        - "oxidation basis"
        - "allocation driver"
      output: "kg fossil CO2 per item"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "fabrication and surface treatment"
      rule: "reconcile named material inputs with product incorporation, internal return, named waste and documented stock change; investigate unexplained differences"
      inputs:
        - input
        - return
        - product
        - "waste and stock-change masses"
      output: "mass-balance closure and exception record"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve model, intended use, adjustment mechanism, included electronics/equipment, upholstery/finish, performance class, net mass and market state for every represented configuration."
      evidence: "approved specification, BOM, drawings, quality-release record"
    - id: dq_temporal_match
      applies_to: "all foreground exchanges"
      requirement: "Use input, waste, emission and conforming-output records from the same representative year or declared campaign; explain substitutions and shutdown/start-up effects."
      evidence: "dated meters, invoices, production logs, manifests"
    - id: dq_site_coverage
      applies_to: "multi-site datasets"
      requirement: "Include every site performing an in-scope manufacturing step or declare exclusions and their quantitative significance."
      evidence: "site list, process map, consolidated ledger"
    - id: dq_meter_and_scale
      applies_to: "measured quantities"
      requirement: "Record calibration or verification status, resolution, missing-data treatment and unit/reference-condition conversions."
      evidence: "calibration certificate, verification log, calculation workbook"
    - id: dq_bom_completeness
      applies_to: "materials and packaging"
      requirement: "Reconcile the approved material and packaging BOM to the inventory; surface treatments and electrical/electronic components must be explicitly disclosed."
      evidence: "signed BOM reconciliation and exception list"
    - id: dq_waste_destination
      applies_to: "each waste flow"
      requirement: "Preserve waste identity, hazardous status where applicable, first receiver, treatment route and whether material is internally reused."
      evidence: "waste manifest, receiver record, internal reuse log"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm that the output is exactly one quality-released complete item, its measured net mass uses the reference UUID and packaging is excluded from that net mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_scope_identity
    applies_to: "product category"
    rule: "Confirm the declared item has a special medical, surgical, dental or veterinary furniture function, or that a barber/similar chair has rotating, reclining and elevating movements."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Reject collection labels and combined exchanges; each row must retain one concrete flow, one direction, one flow type, one property and one unit."
    source_ids: []
  - rule_id: validate_conditional_routes
    applies_to: "route-specific rows"
    rule: "A conditional material, component, surface-treatment, fuel, waste or packaging row must be present only when its named route occurs and must not be silently replaced with a different flow."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "fabrication and finishing"
    rule: "Reconcile input, return, product incorporation, named waste and stock change; investigate and disclose unexplained differences before dataset release."
    source_ids: []
  - rule_id: validate_direct_emissions
    applies_to: "fossil carbon dioxide"
    rule: "Confirm that the row contains only direct onsite fossil CO2 and excludes upstream natural-gas and purchased-electricity emissions."
    source_ids: []
  - rule_id: validate_source_and_uuid_gaps
    applies_to: "unresolved inventory"
    rule: "Preserve UUID-empty rows and range-evidence needs as review metadata; do not substitute proxy UUIDs or unsupported numeric ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product- and site-specific cradle-to-factory-gate foreground dataset suitable for controlled publication as a secondary_dataset or background_dataset after review"
  downstream_use: "Supply-chain LCA of medical, surgical, dental or veterinary furniture and qualifying multi-motion chairs; product manufacturing comparison only after reference flow, configuration, boundary and data quality are aligned"
  allowed_use: "Use for the declared model/configuration, manufacturing geography, technology, reporting period and new/remanufactured state; aggregate variants only with disclosed production-weighted records"
  excluded_use: "Do not represent distribution, installation, service life, clinical use, maintenance, repair, replacement or end-of-life; do not apply to ordinary furniture, standalone equipment or parts sold separately"
  required_metadata: "canonical PCR id; product subtype/intended use; model/configuration; mechanism and electronics; upholstery/finish; performance class; net mass; packaging; site/geography; reporting period; market state; allocation; data sources; unresolved identities and range needs"
  required_quality_disclosure: "foreground coverage, meter/scale status, BOM reconciliation, temporal and site representativeness, allocation drivers, mass-balance exceptions, waste destinations and any proxy or missing data"
  update_trigger: "change in product configuration or mechanism, material/finish/packaging BOM, manufacturing site or route, energy supply, allocation method, waste treatment, reporting period representativeness, reference UUID or resolved inventory UUID"
