system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "foreground manufacturing"
      rule: "Include all processes under the producer's control that transform received inputs into the conforming factory-gate instrument: conditional in-house component processing, assembly, calibration or functional testing, packaging, onsite utilities and onsite treatment where present."
      source_ids:
        - eu-pef-2021-annex-i
    - rule_id: sb_upstream_completeness
      applies_to: "purchased inputs and services"
      rule: "Use the product-specific bill of materials and procurement records to identify all purchased materials, parts, subassemblies, batteries, energy carriers, packaging, inbound transport and treatment services, and link each included input to an upstream dataset."
      source_ids:
        - eu-pef-2021-annex-i
    - rule_id: sb_downstream_separation
      applies_to: "use and end-of-life"
      rule: "Keep use, maintenance and end-of-life outside the foreground production dataset, but disclose the product attributes required for downstream modelling. For electrical or electronic instruments, the downstream scenario shall represent applicable separate collection, preparation for re-use, recycling, recovery and treatment requirements rather than assuming municipal disposal."
      source_ids:
        - eu-pef-2021-annex-i
        - eu-weee-2012-19-consolidated
    - rule_id: sb_cutoff_disclosure
      applies_to: "exclusions"
      rule: "Do not omit a material, energy, waste or direct-emission flow solely because no generic dataset is available. Quantify it from foreground records, select a documented proxy, or disclose the unresolved gap and its expected significance."
      source_ids:
        - eu-pef-2021-annex-i
boundary_abstraction:
  declared_starting_condition: "Identified purchased materials, parts and subassemblies received for the declared product and bill-of-materials revision, plus any in-house starting stock entering component processing"
  starting_condition_role: "Foreground manufacturing entry condition supported by procurement, warehouse and bill-of-materials records"
  product_classification_scope: "Finished instruments and appliances within the reviewed semantic scope of CPC 3.0 subclass 48219; classification is context, not canonical PCR identity"
  recursive_input_rule: "If an input is itself a finished or intermediate product in the same semantic category, record it once as a separate product input with an upstream dataset; do not recursively reproduce this PCR inside the foreground process"
  upstream_dataset_requirement: "Every purchased material, component, energy carrier, transport service and treatment service shall be linked to a geographically, technologically and temporally representative upstream dataset or disclosed as an unresolved data gap"
  disclosure: "Declare included sites and processes, in-house versus purchased component boundaries, bill-of-materials revision, net product mass, packaging boundary, calibration or test status, allocation decisions, excluded processes, and whether use and end-of-life scenarios are supplied downstream"
