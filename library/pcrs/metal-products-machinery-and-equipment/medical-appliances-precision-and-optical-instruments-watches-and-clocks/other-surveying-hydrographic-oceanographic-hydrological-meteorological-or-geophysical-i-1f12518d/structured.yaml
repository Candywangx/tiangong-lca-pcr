allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared manufacturing, utilities and treatment"
    rule: "Avoid allocation by submetering, time recording or otherwise subdividing the shared process so that product-specific activity data are directly attributable to the declared instrument."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: allocation_physical
    applies_to: "residual shared burdens"
    rule: "When subdivision or system expansion is not feasible, allocate using a documented physical relationship that reflects burden causality, such as machine time, energy demand, processed mass or treatment load. Do not default to product mass when it does not represent the causal relationship."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: allocation_economic_last_resort
    applies_to: "residual multifunctionality without a defensible physical relationship"
    rule: "Use economic allocation only as a last resort, based on a documented representative price period; disclose the affected processes, co-products, price source and sensitivity."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: rework_and_scrap
    applies_to: "rework, rejects and recyclable scrap"
    rule: "Treat internal rework as an internal loop. Report waste only when it leaves the foreground system. Apply any recycling or avoided-burden credit only in the downstream modelling framework and disclose the method; do not subtract scrap mass or revenue from foreground inputs by default."
    source_ids:
      - eu-pef-2021-annex-i
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_materials
      process_id: "inhouse_component_processing_instrument_assembly"
      flow_role: "materials, parts, subassemblies and accepted components"
      record_type: "controlled bill of materials, purchase and warehouse issue/return records"
      raw_fields: "model; BOM revision; item and material identity; grade; supplier; quantity; unit; measured mass; issued mass; returned mass; accepted mass"
      collection_method: "reconcile the controlled BOM with procurement and production issue/return records; measure representative item mass when converting counts"
      unit: "kg and native purchase unit"
      frequency: "each BOM revision and production batch; aggregate annually"
      temporal_coverage: "declared production reference period"
      site_scope: "all included manufacturing sites and declared product variants"
      aggregation_rule: "sum net issued quantities by exact material or component; normalize by net conforming output mass"
      quality_evidence: "approved BOM revision; supplier specification; calibrated scale record; reconciliation report"
    - protocol_id: cp_energy_and_utilities
      process_id: "all_included_processes"
      flow_role: "electricity, fuels and supplied utilities"
      record_type: "submeters, equipment logs, invoices and site meters"
      raw_fields: "meter id; energy carrier; opening and closing readings; conversion factor; equipment or line; operating time; allocation driver; production output"
      collection_method: "prefer submetering; otherwise reconcile site totals and allocate with a documented causal driver"
      unit: "kWh, MJ and native metered unit"
      frequency: "continuous or each batch; monthly reconciliation"
      temporal_coverage: "declared production reference period"
      site_scope: "all included equipment and sites"
      aggregation_rule: "sum by energy carrier and process; subtract documented non-production use; normalize by process output then reference output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_process_consumables
      process_id: "inhouse_component_processing_instrument_assembly"
      flow_role: "water, chemicals, gases, lubricants, adhesives and other consumables"
      record_type: "issue/return logs, tank or cylinder readings, purchase and stock records"
      raw_fields: "substance identity; grade; concentration; opening stock; purchases; closing stock; returns; measured volume or mass; density source"
      collection_method: "measure consumption or calculate stock balance separately for each substance"
      unit: "kg, L, m3 or supported native unit"
      frequency: "each batch or monthly with annual reconciliation"
      temporal_coverage: "declared production reference period"
      site_scope: "all included operations using consumables"
      aggregation_rule: "opening stock plus purchases minus closing stock minus returns; normalize by accepted process output"
      quality_evidence: "inventory reconciliation; batch sheet; instrument calibration; density evidence"
    - protocol_id: cp_output_and_yield
      process_id: "all_included_processes"
      flow_role: "intermediate transfers, conforming output, rework and yield"
      record_type: "production, transfer, weighing and acceptance records"
      raw_fields: "model; batch; input mass; output mass; item count; net mass per item; rework transfer; acceptance status"
      collection_method: "weigh outputs or apply a controlled model-specific item-to-mass conversion"
      unit: "kg and supplementary item count"
      frequency: "every batch"
      temporal_coverage: "declared production reference period"
      site_scope: "all included lines and sites"
      aggregation_rule: "sum accepted net output; keep internal rework separate; normalize all burdens to 1 kg final accepted output"
      quality_evidence: "calibrated scale; batch traveller; acceptance release record"
    - protocol_id: cp_waste_and_emissions
      process_id: "inhouse_component_processing_instrument_assembly"
      flow_role: "wastes, wastewater and direct releases"
      record_type: "waste transfer notes, treatment records, emission monitoring and permit calculations"
      raw_fields: "waste or pollutant identity; hazardous status; compartment; mass or volume; concentration; destination; treatment route; measurement method; calculation factor"
      collection_method: "weigh waste; pair wastewater volume with concentration where relevant; use validated monitoring or permit methods for direct releases"
      unit: "kg, m3 or flow-supported unit"
      frequency: "each shipment or monitoring interval; annual reconciliation"
      temporal_coverage: "declared production reference period"
      site_scope: "all included operations and onsite treatment"
      aggregation_rule: "aggregate separately by waste identity, destination, pollutant and compartment; normalize by process and final output"
      quality_evidence: "weighbridge ticket; laboratory report; permit report; calculation sheet; treatment certificate"
    - protocol_id: cp_calibration_and_testing
      process_id: "calibration_and_testing"
      flow_role: "test input, test resources, acceptance output, rework and rejects"
      record_type: "test and calibration logs, equipment meters, material issue records and service invoices"
      raw_fields: "model; serial or batch; test method; acceptance criterion; result; calibration status; input and output mass; test energy; consumables; service quantity; rework or reject disposition"
      collection_method: "link test records to production batch and collect attributable resources and outcomes"
      unit: "kg, item, kWh and resource-supported unit"
      frequency: "every production batch or unit as specified"
      temporal_coverage: "declared production reference period"
      site_scope: "all included test and calibration stations"
      aggregation_rule: "sum resources for accepted, reworked and rejected units; divide by accepted net output mass while retaining reject totals"
      quality_evidence: "approved test method; instrument calibration certificate; test log; non-conformance record"
    - protocol_id: cp_packaging
      process_id: "packaging_and_factory_gate"
      flow_role: "packaging materials, packaging energy and packaging waste"
      record_type: "packaging specification, issue records, line meters and waste records"
      raw_fields: "packaging component; material; unit mass; quantity issued; returned quantity; waste mass; product model; batch; energy"
      collection_method: "measure component masses or use controlled specifications verified by sampling; reconcile issues and waste"
      unit: "kg, item and kWh"
      frequency: "each packaging specification revision and production batch"
      temporal_coverage: "declared production reference period"
      site_scope: "all included packaging lines"
      aggregation_rule: "sum packaging by material; normalize to 1 kg net released product; keep packaging outside reference mass"
      quality_evidence: "approved packaging specification; scale calibration; issue/waste reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = period or batch amount divided by net mass of conforming finished instruments released in the same period or batch"
      inputs:
        - "collected flow amount"
        - "accepted net output mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-annex-i
    - id: calc_bom_mass
      applies_to: "components recorded by count"
      rule: "component mass = accepted item count multiplied by controlled model-specific mean net mass per item; retain sampling evidence and do not reuse the factor across materially different variants"
      inputs:
        - "accepted item count"
        - "sampled item masses"
        - "model and BOM revision"
      output: "kg of component per reference flow"
      source_ids:
        - eu-pef-2021-annex-i
    - id: calc_stock_balance
      applies_to: "consumables without direct metering"
      rule: "consumption = opening stock plus receipts minus closing stock minus documented returns and transfers out"
      inputs:
        - "stock and transaction records"
      output: "consumed amount per process and period"
      source_ids:
        - eu-pef-2021-annex-i
    - id: calc_wastewater_release
      applies_to: "measured wastewater pollutant"
      rule: "pollutant release = discharged volume multiplied by representative measured concentration, with unit conversion and sampling coverage documented"
      inputs:
        - "discharge volume"
        - concentration
        - "unit conversion"
        - "sampling period"
      output: "pollutant-specific elementary-flow amount"
      source_ids:
        - eu-pef-2021-annex-i
    - id: calc_shared_resource
      applies_to: "shared meters or services"
      rule: "allocate only the residual shared amount after direct attribution, using the documented causal physical driver selected under allocation_physical"
      inputs:
        - "shared total"
        - "directly attributed amounts"
        - "physical driver by product"
      output: "allocated product-specific amount"
      source_ids:
        - eu-pef-2021-annex-i
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and reference flow"
      requirement: "The dataset shall identify manufacturer, model or product code, instrument function, performance or accuracy class where applicable, configuration, net mass, BOM revision, production geography and reference period."
      evidence: "product specification; controlled BOM; release record; reference-flow metadata"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a continuous representative production period, normally 12 months. A shorter campaign is allowed only when it covers the complete declared route and variability is disclosed."
      evidence: "record coverage table; production calendar; justification for gaps"
    - id: dq_completeness
      applies_to: "bill of materials and inventory"
      requirement: "Reconcile material inputs, accepted product, internal transfers, rework, wastes and stock changes. Record all energy carriers, process consumables, packaging and known direct releases; disclose unresolved gaps."
      evidence: "mass-balance and inventory reconciliation; meter and waste summaries"
    - id: dq_representativeness
      applies_to: "foreground and upstream data"
      requirement: "Match technology, geography and time period to the declared product route. Document proxies and why they are the closest available representation."
      evidence: "site and technology description; dataset selection log; proxy justification"
    - id: dq_measurement
      applies_to: "measured and calculated data"
      requirement: "Retain meter or scale identity, calibration or verification status, sampling frequency, calculation formulas, unit conversions and data lineage from raw record to normalized value."
      evidence: "calibration certificates; sampling plans; calculation workbook; audit trail"
    - id: dq_test_traceability
      applies_to: "calibration and functional testing"
      requirement: "Link acceptance, rework and rejection records to the applicable model, production batch or serial-controlled population and to the declared test method."
      evidence: "test logs; calibration certificates where applicable; non-conformance and release records"
    - id: dq_downstream_attributes
      applies_to: "downstream lifecycle modelling"
      requirement: "Declare rated power and duty cycle where relevant, expected service-life basis, battery identity, maintenance or consumable requirements, product dimensions, material composition needed for end-of-life modelling, and the jurisdiction of the end-of-life scenario."
      evidence: "product technical file; use instructions; BOM; service plan; regulatory applicability assessment"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference product"
    rule: "Verify that the selected reference product flow UUID, Mass flow property UUID, Units of mass unit-group UUID and kg unit match Section 3, and that the output amount is exactly 1 kg net instrument mass."
    source_ids: []
  - rule_id: val_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail validation when instrument function, model or product code, configuration, net mass, production geography or period, BOM revision, test or calibration status, or packaging exclusion is missing."
    source_ids:
      - unsd-cpc-3-0-48219
  - rule_id: val_process_coverage
    applies_to: "process map and inventory"
    rule: "Require assembly, calibration or functional testing, and packaging. Require in-house component processing whenever the reporting site performs fabrication, machining, moulding, coating, cleaning or electronic-component processing."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: val_bom_reconciliation
    applies_to: "materials and components"
    rule: "Require the collected component and material inventory to reconcile with the controlled BOM and production issue/return records for the declared revision; disclose and justify every aggregation or gap."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: val_mass_and_waste_balance
    applies_to: "each foreground process"
    rule: "Check that recorded inputs, accepted transfers, stock changes, rework and waste are arithmetically consistent within the declared measurement uncertainty; do not force a false zero balance for evaporation or direct releases."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: val_allocation
    applies_to: "shared processes"
    rule: "Require the allocation hierarchy and supporting driver records. Fail validation when economic allocation is used without showing why subdivision and physical allocation were infeasible."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: val_packaging_separation
    applies_to: "reference and packaging"
    rule: "Verify that packaging is inventoried but excluded from the 1 kg net reference-product mass."
    source_ids:
      - eu-pef-2021-annex-i
  - rule_id: val_electronic_end_of_life
    applies_to: "electrical or electronic instruments"
    rule: "Require downstream lifecycle-model metadata to identify the applicable collection and treatment jurisdiction and to avoid an undocumented municipal-waste assumption."
    source_ids:
      - eu-weee-2012-19-consolidated
  - rule_id: val_data_quality
    applies_to: "foreground data package"
    rule: "Require evidence for temporal coverage, site and technology representativeness, measurement controls, calculations, data gaps and upstream dataset selection."
    source_ids:
      - eu-pef-2021-annex-i
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for a finished instrument at the factory gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA process and lifecyclemodel construction for the declared model or a demonstrably representative production mix when reference flow, qualifiers, scope, geography, technology and period match"
  excluded_use: "Direct comparison of instrument functions, performance classes or service lives without a functionally equivalent use-stage model; substitution for navigation, radar, general-purpose liquid/gas measurement, laboratory analytical equipment or professional services; use of mass alone as proof of functional equivalence"
  required_metadata: "canonical PCR id; reference-flow UUIDs; manufacturer and model or product code; instrument function; performance or accuracy specification where applicable; configuration; net mass per unit; BOM revision; production sites, geography and period; included and excluded processes; packaging specification; calibration or test method and status; allocation method; upstream dataset references; data-gap and proxy log"
  required_quality_disclosure: "foreground temporal coverage; measured versus calculated shares; meter and scale controls; BOM and mass-balance reconciliation; site and technology representativeness; allocation drivers; proxy and unresolved data gaps; uncertainty or variability where available; whether use and end-of-life attributes are complete"
  update_trigger: "Change in product model or function, BOM or mass by material, manufacturing route or site, sensor/electronic/battery configuration, energy supply, calibration or test method, packaging, allocation driver, regulation affecting end-of-life, upstream datasets, or any input materially affecting the inventory"
