        - us-epa-2003-mpm-development
    - rule_id: boundary_upstream_inputs
      applies_to: "upstream_datasets"
      rule: "Represent production and delivery of every purchased material, chemical, electricity and packaging flow with a geographically and technologically appropriate upstream dataset; do not absorb these burdens into an unspecified material input."
      source_ids:
        - eu-2021-2279-pef
    - rule_id: boundary_conditional_operations
      applies_to: "route_specific_operations"
      rule: "Include aqueous cleaning, sodium-hydroxide use, cutting-oil discharge and each packaging material only when records show that the operation or exchange occurred; declare not-applicable rows rather than substituting a combined utility, chemical, waste or packaging label."
      source_ids:
        - ec-jrc-2006-stm-bref
        - us-epa-2003-mpm-development
    - rule_id: boundary_exclusions
      applies_to: "excluded_life_cycle_stages"
      rule: "Exclude parent-instrument assembly after the part leaves the site, distribution beyond the factory gate, use, maintenance and end-of-life unless the study explicitly expands the boundary and reports those stages separately."
