validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Fail if the dataset does not identify the finished part or accessory, its CPC 48314 parent instrument, drawing revision, function, material, completion state and net reference mass, or if it substitutes a complete instrument or separately classified optical element."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_inventory_atomicity
    applies_to: "process_inventory"
    rule: "Fail if electricity is combined with fuels or heat, chemicals are combined, packaging materials are combined, wastes are combined, or a row is a selector rather than one physical exchange."
    source_ids: []
  - rule_id: validate_internal_transfer
    applies_to: "machined_cleaned_component_output; machined_cleaned_component_input"
    rule: "Fail unless the internal intermediate has the same identity and reconciled mass at release and receipt, subject only to a separately recorded and explained loss."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "aluminium_and_output_balance"
    rule: "Fail if aluminium input, accepted output, machining scrap, rejected parts, work in progress and quantified residual are not reconciled for the same period."
    source_ids:
      - us-epa-2003-mpm-development
  - rule_id: validate_energy
    applies_to: "electricity"
    rule: "Fail if kWh-to-MJ conversion, meter scope, shared-energy allocation or double counting between the two foreground processes is absent or inconsistent."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: validate_conditionals
    applies_to: "cleaning_wastes_and_packaging"
    rule: "Fail if a conditional row has a positive amount without evidence that the operation or material occurred, or is omitted without an explicit not-applicable declaration."
    source_ids:
      - ec-jrc-2006-stm-bref
      - us-epa-2003-mpm-development
  - rule_id: validate_uuid_and_sources
    applies_to: "identity_and_evidence"
    rule: "Fail if an unresolved UUID is presented as confirmed, if a UUID-bearing Chinese selected-flow name differs from the direct-read TianGong Chinese baseName, or if a source-backed rule cannot be traced to verified original text."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for finished CPC 48351 parts and accessories at the manufacturing site gate"
  downstream_use: "secondary_dataset; background_dataset after independent review and replacement or acceptance of unresolved identities and range evidence needs"
  allowed_use: "Product carbon footprint and LCA modelling of a declared finished optical-instrument part or accessory when material, route, parent instrument, geography, period, allocation and packaging are representative"
  excluded_use: "Complete instruments; optical elements; radio-astronomy equipment; generic metal parts without a parent-instrument relationship; use-stage performance or end-of-life without explicit boundary expansion"
  required_metadata: "PCR id and version; part number and drawing revision; parent-instrument type and model; function; principal material and grade; site and geography; production period; route and outsourced operations; surface and cleanliness state; net product mass; packaging; electricity mix; allocation; waste destinations; UUID status"
  required_quality_disclosure: "Foreground-versus-proxy share, data age, meter and scale coverage, allocation drivers, mass-balance residual, reject and rework treatment, density and concentration conversions, unresolved UUIDs, missing range evidence and source verification status"
  update_trigger: "Change in part design or material, manufacturing or cleaning route, site, electricity supply, packaging, allocation driver, waste destination, acceptance criteria, representative period, or resolution of a UUID or evidence need"
