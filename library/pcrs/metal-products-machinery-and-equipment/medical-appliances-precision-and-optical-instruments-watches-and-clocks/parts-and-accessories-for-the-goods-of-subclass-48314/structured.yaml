  calculation_rules:
    - id: calc_net_material_input
      applies_to: "primary_aluminium_alloy_sheet; cutting_fluid; sodium_hydroxide; packaging"
      rule: "Net boundary input = opening stock + receipts + make-up - closing stock - unused material returned outside the lot - material recovered and reused within the same foreground loop."
      inputs:
        - "inventory records"
        - receipts
        - "issue and return records"
        - "recovery records"
      output: "net input mass by atomic flow per kg reference product"
