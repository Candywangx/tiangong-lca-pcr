allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared_processes"
    rule: "First avoid allocation by subdividing meters, material issues, work orders and waste records to the product lot; use system expansion only when the additional function and expanded result are explicitly reported."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_physical
    applies_to: "unavoidable_shared_burdens"
    rule: "When subdivision is not feasible, allocate shared machine electricity by metered operating time or machine time, cleaning burdens by treated surface area or bath loading, and other shared burdens by a documented causal physical relationship; justify and disclose the selected driver."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_scrap
    applies_to: "machining_scrap_and_rejects"
    rule: "Report scrap and rejected parts as waste outputs at the point they leave controlled rework; do not subtract an avoided-material credit inside the foreground process unless an explicitly expanded recycling model is supplied and reported separately."
    source_ids:
      - eu-2021-2279-pef
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_packaging
      process_id: "precision_fabrication_finalization"
      flow_role: "Aluminium stock and discrete packaging inputs"
      record_type: "Purchase, receiving, bill-of-material and issue/return records"
      raw_fields: "material identity; grade; supplier; received mass; issued mass; returned mass; packaging component; lot"
      collection_method: "Reconcile calibrated scale records and inventory transactions to production lots"
      unit: "kg"
      frequency: "Each receipt and production lot"
      temporal_coverage: "At least one representative continuous 12-month period or the full campaign for campaign production"
      site_scope: "All foreground production and packaging operations at the declared site"
      aggregation_rule: "Sum net issues by flow and divide by net accepted product mass"
      quality_evidence: "Scale calibration, supplier specification, transaction trace and lot reconciliation"
    - protocol_id: cp_energy
      process_id: "precision_fabrication_finalization"
      flow_role: "Purchased electricity"
      record_type: "Submeter, machine controller and facility meter records"
      raw_fields: "meter id; opening and closing reading; unit; timestamp; machine time; allocation driver; conversion factor"
      collection_method: "Prefer process submetering; otherwise reconcile machine-level records to the facility meter and document allocation"
      unit: "kWh and MJ"
      frequency: "Per lot or shift, aggregated monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "All directly attributable equipment plus disclosed shared services"
      aggregation_rule: "Convert kWh to MJ and divide attributable energy by net accepted product mass"
      quality_evidence: "Meter calibration or utility invoice reconciliation and allocation worksheet"
    - protocol_id: cp_process_chemicals
      process_id: "precision_fabrication"
      flow_role: "Cutting fluid and sodium hydroxide"
      record_type: "Purchase, batch make-up, replenishment, recovery and inventory records"
      raw_fields: "product identity; formulation; concentration; opening stock; additions; recovery; closing stock"
      collection_method: "Mass balance each chemical over the production period"
      unit: "kg"
      frequency: "Each addition and month-end inventory"
      temporal_coverage: "Same period as production output"
      site_scope: "Machining and alkaline-cleaning systems serving the declared product"
      aggregation_rule: "Net boundary input divided by net accepted product mass"
      quality_evidence: "Supplier specification, calibrated scale or delivery record, and signed bath log"
    - protocol_id: cp_water
      process_id: "precision_fabrication"
      flow_role: "Process water"
      record_type: "Submeter or tank-balance records"
      raw_fields: "meter id; readings; make-up; recirculation; discharge; density; timestamp"
      collection_method: "Meter make-up water or calculate a reconciled tank balance without double-counting recirculation"
      unit: "kg"
      frequency: "Per lot or daily, aggregated monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "Aqueous cleaning and rinse operations for the declared product"
      aggregation_rule: "Net make-up water divided by net accepted product mass"
      quality_evidence: "Meter calibration, tank-volume check and water-balance reconciliation"
    - protocol_id: cp_internal_transfer
      process_id: "precision_fabrication_finalization"
      flow_role: "Machined and cleaned component transfer"
      record_type: "Traveller, work-order and scale records"
      raw_fields: "part id; drawing revision; material; surface state; cleanliness state; piece count; transfer mass; timestamp"
      collection_method: "Record release from fabrication and receipt by finalization under the same transfer id"
      unit: "kg"
      frequency: "Each transfer lot"
      temporal_coverage: "Same period as production output"
      site_scope: "Inter-process transfers within the foreground site"
      aggregation_rule: "Reconcile output and input transfer mass exactly before normalization"
      quality_evidence: "Signed traveller and calibrated scale record"
    - protocol_id: cp_wastes_and_rejects
      process_id: "precision_fabrication_finalization"
      flow_role: "Machining scrap, spent liquids and rejected parts"
      record_type: "Waste container, shipment, treatment and reject-disposition records"
      raw_fields: "waste identity; source operation; gross and tare mass; aluminium content where applicable; contamination; recovery; destination; reject reason"
      collection_method: "Weigh each dispatched waste or controlled internal treatment transfer and reconcile rejects to inspection records"
      unit: "kg"
      frequency: "Each container or shipment and each reject disposition"
      temporal_coverage: "Same period as production output"
      site_scope: "All foreground waste and reject points for the declared product"
      aggregation_rule: "Sum net waste mass by atomic flow and divide by net accepted product mass"
      quality_evidence: "Scale calibration, waste manifest, treatment receipt and nonconformance record"
    - protocol_id: cp_finished_output
      process_id: "finalization"
