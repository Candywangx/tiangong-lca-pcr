system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground_system_boundary"
      rule: "Start at receipt of semi-finished material, process chemicals and purchased components; include precision fabrication, applicable cleaning or finishing, assembly, inspection, internal rework and packaging through saleable product at the manufacturing site gate."
