    - id: calc_electricity
      applies_to: "fabrication_electricity; final_assembly_electricity"
      rule: "Attributable electricity in MJ = metered kWh × 3.6; where only a shared meter exists, multiply by the disclosed causal allocation share before normalization."
      inputs:
        - "meter readings"
        - "machine time or other approved physical driver"
