allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "separable production"
    rule: "Avoid allocation by separately metering assembly, test, and packaging and assigning model-specific component issues directly."
    source_ids:
      - eu-jrc-ilcd-lca-detailed-guidance-2010
  - rule_id: allocation_rule_2
    applies_to: "shared utilities and wastes"
    rule: "Allocate shared electricity and waste using measured equipment time, test time, mass, or another causal physical driver; disclose it."
    source_ids:
      - eu-jrc-ilcd-lca-detailed-guidance-2010
  - rule_id: allocation_rule_3
    applies_to: "saleable scrap"
    rule: "Report gross input, incorporated mass, scrap output, and credited recovery separately; do not subtract revenue or avoided burden without a declared method."
    source_ids:
      - eu-jrc-ilcd-lca-detailed-guidance-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_mass
      process_id: "instrument_assembly"
      flow_role: "component inputs"
      record_type: "ERP issue and return plus BOM"
      raw_fields: "model; lot; component; issued; returned; board state; supplier"
      collection_method: "Reconcile stores movements and weigh representative components"
      unit: "kg"
      frequency: "each lot; monthly aggregation"
      temporal_coverage: "12 representative months or full campaign"
      site_scope: "all in-scope assembly lines"
      aggregation_rule: "net issued mass / packaged output mass"
      quality_evidence: "scale calibration; stock reconciliation; BOM revision"
    - protocol_id: cp_process_electricity
      process_id: "instrument_assembly_calibration_and_safety_test"
      flow_role: "process electricity"
      record_type: "submeter or allocated site meter"
      raw_fields: "start; end; process hours; output mass; driver"
      collection_method: "Read calibrated meters and separate assembly from test where feasible"
      unit: "kWh"
      frequency: "each shift or batch"
      temporal_coverage: "same period as production"
      site_scope: "all lines and test stations"
      aggregation_rule: "kWh × 3.6 / packaged output mass"
      quality_evidence: "meter calibration; allocation worksheet; downtime log"
    - protocol_id: cp_assembly_waste
      process_id: "instrument_assembly"
      flow_role: "assembly waste"
      record_type: "labelled container and transfer records"
      raw_fields: "identity; composition; gross; tare; net; destination"
      collection_method: "Weigh each segregated stream before transfer"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same period as production"
      site_scope: "all assembly lines"
      aggregation_rule: "net mass by flow / packaged output mass"
      quality_evidence: "scale calibration; manifests; recovery certificates"
    - protocol_id: cp_packaging_mass
      process_id: "protective_packaging"
      flow_role: "sale packaging"
      record_type: "issue and return records"
      raw_fields: "component; material; issued; returned; output mass"
      collection_method: "Reconcile stores and sample-weigh components"
      unit: "kg"
      frequency: "each lot; monthly aggregation"
      temporal_coverage: "same period as production"
      site_scope: "all packaging lines in scope"
      aggregation_rule: "net consumed / packaged output mass"
      quality_evidence: "scale calibration; specification; reconciliation"
  calculation_rules:
    - id: calc_net_material
      applies_to: "component and packaging rows"
      rule: "(issued mass - unused returned mass) / released packaged-product mass"
      inputs:
        - issue
        - return
        - "and output records"
      output: "kg input/kg reference product"
      source_ids: []
    - id: calc_electricity
      applies_to: "electricity rows"
      rule: "(metered kWh × 3.6) / released packaged-product mass"
      inputs:
        - "meter readings and output mass"
      output: "MJ/kg reference product"
      source_ids: []
    - id: calc_waste
      applies_to: "waste rows"
      rule: "sum(gross container mass - tare) / released packaged-product mass"
      inputs:
        - "container weights and output mass"
      output: "kg waste/kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Preserve supplier grade, component state, polymer, CRT composition, destination, and UUID decision; never use an umbrella flow."
      evidence: "specifications, BOM, manifests, UUID audit"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Use 12 representative months or the complete campaign; disclose shutdowns, trials, and exceptional scrap."
      evidence: "dated meters, ERP, production, and waste records"
    - id: dq_completeness
      applies_to: "balances"
      requirement: "Reconcile accepted output, rejects, returns, and wastes; explain residuals and cut-offs."
      evidence: "reconciliation worksheet and signed review"
    - id: dq_measurement
      applies_to: "scales and meters"
      requirement: "Use calibrated instruments and retain status, resolution, and allocation worksheets."
      evidence: "certificates and meter logs"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "product identity"
    rule: "Confirm a cathode-ray display and complete oscilloscope or oscillograph; reject digital/LCD-only instruments, parts, and monitors."
    source_ids:
      - un-cpc-3-0-structure-2025
      - teledyne-lecroy-oscilloscope-overview-zh
  - rule_id: validation_rule_2
    applies_to: "reference flow"
    rule: "Confirm finished-product UUID, Mass, kg, 1 kg normalization, packaging boundary, and every required qualifier."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "inventory"
    rule: "Require all 13 row ids or documented non-applicability for BOM-dependent rows; disclose UUID gaps and range-evidence needs."
    source_ids:
      - us-epa-desktop-computer-displays-lca-2001
  - rule_id: validation_rule_4
    applies_to: "balances"
    rule: "Recalculate materials, electricity, waste, and output normalization; investigate duplicate board/CRT content and unexplained mass."
    source_ids:
      - eu-jrc-ilcd-lca-detailed-guidance-2010
  - rule_id: validation_rule_5
    applies_to: "tests"
    rule: "Retain passed functional, calibration, and applicable measuring-circuit safety-test evidence."
    source_ids:
      - iec-61010-2-030-2017
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for new cathode-ray oscilloscopes and cathode-ray oscillographs"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate studies with compatible model, technology, geography, time, packaging, and test scope"
  excluded_use: "Digital/LCD oscilloscopes, monitors, televisions, standalone CRTs, refurbished products, use, repair, or end-of-life without separate modelling"
  required_metadata: "model; type; bandwidth; channels; recording; CRT; mains; measuring category; calibration; board state; housing; packaging; site; period; allocation; cut-offs; UUID gaps"
  required_quality_disclosure: "record coverage, calibration, BOM revision, supplier coverage, mass reconciliation, waste destinations, allocation drivers, exceptional scrap, UUID gaps, and missing range evidence"
  update_trigger: "Material change in CRT, board, housing, packaging, site, test programme, allocation, upstream data, or confirmed TianGong identities"
