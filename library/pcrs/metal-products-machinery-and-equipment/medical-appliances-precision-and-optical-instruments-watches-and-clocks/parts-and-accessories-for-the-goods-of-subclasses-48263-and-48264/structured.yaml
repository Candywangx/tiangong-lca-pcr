  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every inventory row"
      rule: "Normalized amount = lot amount / conforming finished-part net mass; report per 1 kg reference product."
      inputs:
        - "lot flow amount"
        - "finished_meter_part net mass"
      output: "normalized inventory amount"
      source_ids: []
    - id: calc_pure_naoh
      applies_to: "sodium_hydroxide"
      rule: "Pure NaOH equivalent = purchased solution mass × supplier-declared NaOH mass fraction."
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg sodium hydroxide"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "fossil_carbon_dioxide"
      rule: "Direct fossil CO2 = natural-gas quantity × documented combustion factor × oxidation factor × fossil fraction, with compatible units and reference conditions."
      inputs:
        - natural_gas
        - factor
        - "oxidation factor"
        - "fossil fraction"
      output: "kg direct fossil carbon dioxide"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Material-route validation"
      rule: "For each material, reconcile gross input = incorporated material + outward segregated scrap + measured other losses ± inventory change; investigate unexplained residuals."
      inputs:
        - "material input"
        - "product composition"
        - scrap
        - "other loss"
        - "stock change"
      output: "material-balance residual and completeness finding"
      source_ids: []
