allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Separately metered products, routes and production lots"
    rule: "Subdivide processes and use lot, machine or line records before allocating shared burdens."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "Shared electricity, water and support operations"
    rule: "Allocate only the residual shared quantity using a documented causal driver such as machine time, batch time or measured throughput; mass allocation is a fallback and must be justified."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Recoverable production scrap"
    rule: "Record scrap as an explicit waste output; do not subtract an avoided virgin-material credit inside the foreground inventory. Apply recycling or substitution only in the downstream modelling system and disclose it."
    source_ids: []
  - rule_id: allocation_no_complete_instrument_credit
    applies_to: "Parts incorporated into complete instruments at the same site"
    rule: "Keep the part-production dataset separate from complete-instrument assembly and do not assign complete-instrument revenue or function to the part reference flow."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "part_fabrication"
      flow_role: "material inputs"
      record_type: "receiving, stores issue and BOM records"
      raw_fields: "material identity; grade; form; supplier; received mass; issued mass; returned mass; lot id"
      collection_method: "Reconcile calibrated scale records, stores transactions and production BOM"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative production period, normally at least 12 months or all lots for shorter campaigns"
