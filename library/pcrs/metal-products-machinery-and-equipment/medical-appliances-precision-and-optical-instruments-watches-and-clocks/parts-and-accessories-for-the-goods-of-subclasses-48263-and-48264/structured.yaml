      evidence: "lot-level dataset, summary statistics and review note"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "Product and reference flow"
    rule: "Confirm that output is a separately marketed part/accessory for a declared CPC 48263 or 48264 host good, that complete instruments are excluded and that results are normalized to 1 kg net conforming output."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Confirm every selected flow is one atomic physical, chemical, waste, energy or elementary exchange and every conditional row states its route applicability."
    source_ids: []
  - rule_id: validate_uuid_and_units
    applies_to: "UUID-bearing rows"
    rule: "Confirm UUID, public state 100 identity, flow type, property, unit group and Chinese baseName; leave unresolved identities blank rather than substituting proxies."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "Process map"
    rule: "Confirm both required processes are represented and the conditional electronics/calibration process is included exactly when its condition applies."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "Materials, water and fuel"
    rule: "Review material-balance residuals, water input versus wastewater and retained/evaporated water, and natural-gas use versus direct fossil CO2 calculation; explain material residuals rather than forcing closure."
    source_ids: []
  - rule_id: validate_allocation_and_boundary
    applies_to: "Shared operations and system boundary"
    rule: "Confirm shared burdens use documented causal drivers, upstream purchased-input datasets are linked, downstream life-cycle stages are excluded and no avoided-recycling credit is embedded in foreground amounts."
    source_ids: []
  - rule_id: validate_range_disclosure
    applies_to: "Quantitative QA"
    rule: "Confirm that foreground values are not presented as source-backed external ranges and that unresolved important-flow range evidence needs remain disclosed until two independent compatible original sources are reviewed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared dedicated meter/counter part or accessory at the factory gate"
  downstream_use: "secondary_dataset; background_dataset after review for representativeness and aggregation"
  allowed_use: "Product-specific or supplier/site-specific LCA of parts and host instruments when identity, route, geography, technology, time and allocation are compatible"
  excluded_use: "Complete instruments; unrelated precision-instrument parts; service-life or functional-equivalence comparisons without additional performance evidence; generic substitution across materially different parts"
  required_metadata: "canonical PCR id; CPC reference; host-instrument family; part function and drawing/model; material grades; manufacturing route; electronics and calibration status; geography; period; net reference mass; packaging status; upstream dataset matches; allocation drivers; unresolved UUIDs"
  required_quality_disclosure: "Primary-data share; measurement and estimation methods; temporal coverage; material/water/energy balance findings; supplier-data gaps; allocation; scrap destination; wastewater treatment state; unresolved range evidence; uncertainty and variability"
  update_trigger: "Change in host-instrument compatibility, drawing or BOM, principal material, electronics design, fabrication technology, calibration medium, supplier geography, energy mix, allocation method, packaging, or a material change in measured foreground performance"
