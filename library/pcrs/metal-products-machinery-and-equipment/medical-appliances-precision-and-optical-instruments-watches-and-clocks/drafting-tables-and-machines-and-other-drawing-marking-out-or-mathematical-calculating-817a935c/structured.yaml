system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts when purchased material stock, ready-to-assemble components, treatment chemicals, utilities, and packaging are received by the reporting facility. It ends when a conforming product has passed release testing and is packaged for dispatch. Upstream production and delivery of all purchased inputs shall be linked to supplier-specific or representative upstream datasets; onsite fabrication, finishing, assembly, testing, rejects, and waste management transfers are foreground records."
