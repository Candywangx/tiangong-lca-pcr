    - rule_id: sb_factory_gate
      applies_to: "all datasets"
      rule: "Include receiving through packaged factory-gate output; exclude downstream distribution, use, maintenance, and end-of-life unless a separate study expands the boundary."
      source_ids:
        - eu-jrc-ilcd-handbook-lca-detailed-guidance-2010
    - rule_id: sb_route_specificity
      applies_to: "conditional processes and rows"
      rule: "Include a conditional process or exchange only when the declared product variant and site records show that route occurs; do not populate mutually exclusive routes as simultaneous defaults."
      source_ids:
        - us-epa-municipal-pretreatment-1993
        - eu-jrc-surface-treatment-metals-plastics-2006
    - rule_id: sb_upstream_links
      applies_to: "purchased inputs"
      rule: "Keep supplier production outside the foreground gate but connect each purchased input to an upstream dataset with disclosed geography, technology, and product state."
      source_ids:
        - eu-jrc-ilcd-handbook-lca-detailed-guidance-2010
