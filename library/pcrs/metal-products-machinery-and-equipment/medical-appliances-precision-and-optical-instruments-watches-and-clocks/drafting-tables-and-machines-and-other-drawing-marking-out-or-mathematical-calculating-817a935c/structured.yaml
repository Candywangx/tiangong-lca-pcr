      - eu-jrc-ilcd-handbook-lca-detailed-guidance-2010
  - rule_id: al_shared_burdens
    applies_to: "residual shared electricity, water, treatment, and packaging burdens"
    rule: "After subdivision, allocate residual shared burdens by a documented causal driver such as machine time, metered throughput, treated surface area, or number of packed units; use mass only when no better causal driver is available and disclose the sensitivity."
    source_ids:
      - eu-jrc-ilcd-handbook-lca-detailed-guidance-2010
  - rule_id: al_scrap_and_rework
    applies_to: "scrap, rejects, and rework"
    rule: "Return rework burdens to the production lot that generated them. Record scrap at the measured factory-gate waste transfer; do not subtract an avoided-primary-material credit inside this attributional foreground inventory."
    source_ids:
      - eu-jrc-ilcd-handbook-lca-detailed-guidance-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "metal_component_fabrication"
      flow_role: "steel and aluminium stock inputs"
      record_type: "receiving, stock issue, and return records"
      raw_fields: "material identity; grade; stock form; lot; opening mass; receipts; returns; closing mass"
      collection_method: "reconcile calibrated scale records with inventory movements and the bill of materials"
      unit: "kg"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "representative consecutive 12 months or full shorter campaign"
      site_scope: "all onsite fabrication lines serving the product"
      aggregation_rule: "net issued mass divided by conforming net product mass"
      quality_evidence: "scale calibration; material certificates; stock reconciliation"
    - protocol_id: cp_process_energy
      process_id: "all_included_processes"
      flow_role: "electricity"
      record_type: "submeter or facility energy record"
      raw_fields: "meter id; opening and closing reading; original unit; process operating time; allocation driver"
      collection_method: "read submeters; otherwise allocate a reconciled facility meter using documented operating data"
      unit: "kWh and MJ"
      frequency: "monthly or each campaign"
      temporal_coverage: "same period as production denominator"
      site_scope: "all included equipment and directly associated services"
      aggregation_rule: "convert kWh to MJ, allocate, then divide by conforming net product mass"
      quality_evidence: "meter calibration or invoice reconciliation; allocation worksheet"
    - protocol_id: cp_fabrication_gases
      process_id: "metal_component_fabrication"
      flow_role: "industrial oxygen and carbon-dioxide shielding gas"
      record_type: "gas meter, cylinder, and purchase record"
      raw_fields: "gas identity; purity; opening inventory; receipts; closing inventory; returned cylinders; reference temperature and pressure"
      collection_method: "reconcile metered or cylinder withdrawal with supplier records"
      unit: "m3 or kg"
      frequency: "each cylinder or monthly meter reading"
      temporal_coverage: "same period as included cutting or welding route"
      site_scope: "all included gas-consuming equipment"
      aggregation_rule: "net consumption attributable to product divided by conforming net product mass"
      quality_evidence: "supplier specification; cylinder log; meter check"
    - protocol_id: cp_fabrication_scrap
      process_id: "metal_component_fabrication"
      flow_role: "segregated steel and aluminium scrap"
      record_type: "waste scale ticket and internal scrap log"
      raw_fields: "waste identity; alloy family; gross, tare, and net mass; lot; destination"
      collection_method: "weigh each outgoing segregated stream and reconcile with material balance"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same period as fabrication inputs"
      site_scope: "all included fabrication lines"
      aggregation_rule: "summed net mass by material divided by conforming net product mass"
      quality_evidence: "scale ticket; waste transfer record; material-balance reconciliation"
    - protocol_id: cp_finishing_inputs
      process_id: "surface_preparation_and_powder_coating"
      flow_role: "water, sodium hydroxide, and powder coating"
      record_type: "meter, purchase, bath, and inventory records"
      raw_fields: "material identity; concentration; opening inventory; receipts; closing inventory; water reading; reclaimed powder"
      collection_method: "reconcile meters and inventories; calculate active chemical mass from solution mass and measured concentration"
      unit: "kg"
      frequency: "each batch and monthly"
      temporal_coverage: "same period as included finishing output"
      site_scope: "all included onsite finishing lines"
      aggregation_rule: "net input or calculated active mass divided by conforming net product mass"
      quality_evidence: "meter check; concentration test; purchase and inventory reconciliation"
    - protocol_id: cp_finishing_outputs
      process_id: "surface_preparation_and_powder_coating"
      flow_role: "wastewater, metal-hydroxide sludge, and powder-coating waste"
      record_type: "discharge meter, treatment log, laboratory result, and waste ticket"
      raw_fields: "stream identity; transfer point; wet mass; dry-solids fraction; chemistry; hazardous status; destination"
      collection_method: "meter wastewater and weigh each outgoing waste; retain representative analyses"
      unit: "kg"
      frequency: "each discharge or transfer"
      temporal_coverage: "same period as included finishing inputs"
      site_scope: "all included finishing and treatment equipment"
      aggregation_rule: "summed measured mass by atomic stream divided by conforming net product mass"
      quality_evidence: "laboratory report; meter record; waste transfer document; water balance"
    - protocol_id: cp_assembly_materials
      process_id: "final_assembly_and_testing"
      flow_role: "purchased ABS component and laminated MDF worktop"
      record_type: "bill of materials, receiving, issue, and return records"
      raw_fields: "component identity; composition; supplier; lot; unit mass; quantity issued; returns"
      collection_method: "verify unit mass and reconcile issued quantities to conforming lots"
      unit: "kg"
      frequency: "each product lot"
      temporal_coverage: "representative consecutive 12 months or full shorter campaign"
      site_scope: "all assembly lines serving the product"
      aggregation_rule: "net issued component mass divided by conforming net product mass"
      quality_evidence: "approved bill of materials; supplier specification; scale check"
    - protocol_id: cp_finished_product
      process_id: "final_assembly_and_testing"
      flow_role: "conforming finished product"
      record_type: "calibrated weighing and release record"
      raw_fields: "model; serial or lot; gross mass; packaging tare; net mass; test result; reject or rework status"
      collection_method: "weigh released output or verify component roll-up, then exclude dispatch packaging"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as all inventory numerators"
      site_scope: "all product variants included in the dataset"
      aggregation_rule: "sum conforming net mass; normalize inventory to 1 kg"
      quality_evidence: "scale calibration; signed release record; mass roll-up reconciliation"
    - protocol_id: cp_packaging_materials
      process_id: "packaging"
      flow_role: "corrugated-board box and PE-LD film"
      record_type: "packaging issue, unit-mass, roll, and return records"
      raw_fields: "packaging identity; specification; unit mass; quantity issued; roll opening and closing mass; returns"
      collection_method: "weigh representative units and reconcile issue or roll withdrawal to packed lots"
      unit: "kg"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "same period as packed conforming output"
      site_scope: "all dispatch packing stations serving the product"
      aggregation_rule: "net consumed mass divided by conforming net product mass"
      quality_evidence: "packaging specification; scale check; inventory reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = attributable row amount / conforming net finished-product mass"
      inputs:
        - "row numerator"
        - "as_finished_product net mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6 before normalization"
      inputs:
        - "reconciled kWh"
        - "process allocation driver"
        - "net product mass"
      output: "MJ per 1 kg reference product"
      source_ids: []
    - id: calc_active_sodium_hydroxide
      applies_to: "sf_sodium_hydroxide"
      rule: "active NaOH mass = solution mass × measured NaOH mass fraction"
      inputs:
        - "solution mass"
        - "laboratory or supplier concentration"
      output: "kg active NaOH per 1 kg reference product"
      source_ids: []
    - id: calc_packaging_box_mass
      applies_to: "pk_corrugated_board_boxes"
      rule: "box mass = verified unit mass × boxes consumed minus returned-unused-box mass"
      inputs:
        - "unit mass"
        - "issued count"
        - "return mass"
      output: "kg boxes per 1 kg reference product"
      source_ids: []
    - id: calc_material_balance
      applies_to: "fabrication and finishing"
      rule: "reconcile each material input to incorporated mass, same-material scrap, inventory change, and documented loss without combining different materials or waste streams"
      inputs:
        - "material-specific input"
        - output
        - scrap
        - "inventory change"
      output: "material-specific closure percentage and discrepancy"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all product and waste rows"
      requirement: "Preserve the atomic flow identity, product or waste state, composition or grade, supplier, geography, and Tiangong UUID status; do not substitute a broader flow silently."
      evidence: "supplier specification, direct-read UUID identity, bill of materials, waste profile"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative consecutive 12-month period; a shorter campaign is allowed only when it covers the complete production campaign and seasonality is not material."
      evidence: "dated meter, inventory, production, and transfer records"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile input, product, scrap, wastewater, and inventory-change records; explain material discrepancies and any omitted route."
      evidence: "material and water balances; route checklist; reconciliation worksheet"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Use calibrated or verified meters and scales, retain original units, and document every conversion and shared-meter allocation."
      evidence: "calibration certificates; meter logs; invoices; calculation workbook"
    - id: dq_representativeness
      applies_to: "upstream links"
      requirement: "Match geography, technology, product state, material grade, electricity grid, and waste destination; disclose each proxy and its expected influence."
      evidence: "supplier data; dataset metadata; proxy justification"
    - id: dq_range_status
      applies_to: "all important flows"
      requirement: "Until independent boundary-compatible ranges are reviewed, use foreground values without source-backed default substitution and flag unusual values through mass, water, and energy reconciliation."
      evidence: "foreground records and unresolved range-evidence register"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "Confirm UUID, Mass property, kg unit, exact product variant qualifiers, and equality between the reference amount and normalized as_finished_product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: val_process_routes
    applies_to: "process map and inventory"
    rule: "Confirm every required process is present, every conditional process states whether its condition applies, and absent routes do not carry non-zero exchanges."
    source_ids:
      - us-epa-municipal-pretreatment-1993
      - eu-jrc-surface-treatment-metals-plastics-2006
  - rule_id: val_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Confirm every row contains one physical, chemical, waste, or energy exchange; UUID-empty rows must match the manifest unresolved register exactly."
    source_ids: []
  - rule_id: val_mass_and_water_balance
    applies_to: "fabrication and finishing"
    rule: "Check material-specific mass closure and the finishing water balance; investigate and document discrepancies before release."
    source_ids:
      - us-epa-municipal-pretreatment-1993
  - rule_id: val_energy_and_units
    applies_to: "electricity and gas rows"
    rule: "Confirm kWh-to-MJ conversion, gas reference conditions, original-unit retention, and reconciliation to meters or supplier records."
    source_ids: []
  - rule_id: val_allocation_disclosure
    applies_to: "shared processes"
    rule: "Confirm subdivision was attempted first and every residual allocation driver, denominator, and sensitivity is documented."
    source_ids:
      - eu-jrc-ilcd-handbook-lca-detailed-guidance-2010
  - rule_id: val_bilingual_and_uuid
    applies_to: "published data package"
    rule: "Confirm UUID-bearing Chinese displays use the exact Tiangong Chinese baseName and that product state, property, unit group, geography, technology, and generalComment reviews remain compatible."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a verified foreground data package"
  downstream_use: "Attributional process datasets and lifecycle models for products within the declared variant, route, geography, technology, and reporting-period scope"
  allowed_use: "Use as a factory-gate product dataset when the consumer matches the required qualifiers and includes compatible upstream datasets and waste-treatment links"
  excluded_use: "Do not use as a service-life functional comparison, for excluded product categories, or as a substitute for materially different product mass, bill of materials, finishing route, geography, or technology"
  required_metadata: "canonical PCR id; product model and function; net product mass; principal materials and purchased components; included processes; finishing route; packaging; geography; technology; reporting period; allocation; UUIDs and unresolved identities; upstream links"
  required_quality_disclosure: "primary-data share; meter and scale verification; temporal coverage; mass, water, and energy reconciliation; allocation drivers; proxy datasets; waste destinations; unresolved UUID and range-evidence needs"
  update_trigger: "material product redesign; principal-material or component change; new or removed onsite process; coating-chemistry change; supplier or grid change; waste-treatment change; production relocation; or foreground data older than the declared representativeness period"
