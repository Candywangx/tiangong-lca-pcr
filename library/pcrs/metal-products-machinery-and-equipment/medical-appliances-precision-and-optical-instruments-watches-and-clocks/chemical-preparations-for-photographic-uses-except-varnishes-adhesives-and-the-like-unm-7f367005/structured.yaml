allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "formulation, filling and cleaning"
    rule: "Prefer batch, line or campaign subdivision and direct metering so burdens are assigned without allocation."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "off-specification material returned to process"
    rule: "Keep reworked material and its additional processing inside the foreground system; do not credit it as a co-product or count it as waste."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared electricity, cleaning and quality-control services"
    rule: "After subdivision, allocate remaining shared burdens by a documented physical driver such as equipment time, metered throughput or net processed mass; disclose the driver and test material alternatives."
    source_ids: []
  - rule_id: allocation_recovered_material
    applies_to: "material sent for external recovery"
    rule: "Report the outgoing waste or recoverable material at the site boundary without avoided-burden credit unless the study goal applies a separately disclosed consequential method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_formulation_records
      process_id: "formulation"
      flow_role: "ingredients, utilities and off-specification material"
      record_type: "batch recipe, weigh ticket, issue log, meter and disposition record"
      raw_fields: "batch_id; formulation_version; ingredient_id; supplier_lot; as_supplied_mass; purity_or_concentration; water_mass; electricity; rework_mass; offspec_mass; disposition"
      collection_method: "Reconcile signed recipe issues, calibrated scales, batch meters and release or waste records"
      unit: "kg; MJ"
      frequency: "every batch"
      temporal_coverage: "all batches in the reporting period"
      site_scope: "all in-scope formulation lines"
      aggregation_rule: "Sum by atomic flow and divide by net released product mass; retain product-family separation"
      quality_evidence: "calibration records; recipe approval; supplier certificate; batch reconciliation; disposition record"
    - protocol_id: cp_emulsion_records
      process_id: "sensitizing_emulsion_preparation"
      flow_role: "emulsion precursors, utilities and output"
      record_type: "batch recipe, weigh ticket, process meter and release record"
      raw_fields: "batch_id; emulsion_recipe; silver_nitrate_mass; gelatin_mass; potassium_bromide_mass; water_mass; electricity; released_emulsion_mass"
      collection_method: "Reconcile issued precursors and metered utilities with released emulsion"
      unit: "kg; MJ"
      frequency: "every applicable batch"
      temporal_coverage: "all onsite sensitizing-emulsion batches in the reporting period"
      site_scope: "all in-scope emulsion lines"
      aggregation_rule: "Sum each atomic flow and divide by released sensitizing-emulsion mass"
      quality_evidence: "calibration records; recipe approval; supplier certificates; batch release record"
    - protocol_id: cp_packaging_records
      process_id: "finishing_packaging"
      flow_role: "packaging, line electricity and released product"
      record_type: "packaging bill of materials, inventory issue, fill counter, net-fill check and meter"
      raw_fields: "product_code; package_configuration; bottle_mass; box_mass; accepted_unit_count; rejected_unit_count; verified_net_fill_mass; electricity"
      collection_method: "Reconcile purchased packaging issues, accepted fills, rejected fills, net-fill checks and line meters"
      unit: "kg; MJ; item"
      frequency: "every filling batch"
      temporal_coverage: "all released batches in the reporting period"
      site_scope: "all in-scope filling lines"
      aggregation_rule: "Calculate consumed packaging and electricity per net released product mass"
      quality_evidence: "bill of materials; scale calibration; fill-control chart; inventory reconciliation; meter record"
    - protocol_id: cp_cleaning_records
      process_id: "equipment_cleaning"
      flow_role: "cleaning water and wastewater"
      record_type: "cleaning log, inlet meter, transfer meter and waste manifest"
      raw_fields: "campaign_id; product_family; fresh_water_mass; recycled_water_mass; retained_product_returned; wastewater_volume; destination; pH; relevant_constituents"
      collection_method: "Reconcile cleaning events, water meters, storage-tank transfer and waste shipment"
      unit: "kg; m3"
      frequency: "every cleaning event"
      temporal_coverage: "all cleaning events attributable to reporting-period batches"
      site_scope: "all in-scope formulation and filling equipment"
      aggregation_rule: "Allocate by causal campaign; subtract only verified closed-loop reuse and same-batch retained product"
      quality_evidence: "meter calibration; signed cleaning log; wastewater analysis; transfer or manifest record"
    - protocol_id: cp_air_emissions
      process_id: "formulation"
      flow_role: "PM0.2-PM2.5 direct emission"
      record_type: "stack test, continuous or periodic measurement, material balance and control-device record"
      raw_fields: "source_id; operating_hours; measured_pm25; exhaust_flow; control_efficiency; bypass_hours; dry_material_throughput"
      collection_method: "Use applicable measured emissions or a documented calculation from measured activity and control performance"
      unit: "kg"
      frequency: "each test and reporting interval"
      temporal_coverage: "all dry handling, blending or milling operation in the reporting period"
      site_scope: "all in-scope controlled and uncontrolled sources"
      aggregation_rule: "Sum releases to the declared compartment and divide by net released product mass"
      quality_evidence: "test report; instrument calibration; control inspection; bypass log"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "pk_reference_product"
      rule: "Net released mass = accepted sale units × verified mean net fill mass; exclude packaging and rejected or unreleased material."
      inputs:
        - accepted_unit_count
        - verified_net_fill_mass
      output: "kg net released product"
      source_ids: []
    - id: calc_input_normalization
      applies_to: "product inputs"
      rule: "Normalized input = total as-supplied input mass attributable to released batches ÷ net released product mass."
      inputs:
        - "atomic input mass"
        - "allocation record"
        - "net released product mass"
      output: "kg/kg reference product"
      source_ids: []
    - id: calc_electricity_normalization
      applies_to: "electricity rows"
      rule: "Convert metered kWh to MJ by multiplying by 3.6, allocate causally, and divide by the applicable released output mass."
      inputs:
        - "metered kWh"
        - "allocation driver"
        - "output mass"
      output: "MJ/kg output"
      source_ids: []
    - id: calc_packaging_normalization
      applies_to: "packaging rows"
      rule: "Packaging mass = net inventory issued minus verified unused returns and separately recorded packaging waste; divide by net released product mass."
      inputs:
        - "issued packaging mass"
        - "unused return"
        - "packaging waste"
        - "net released mass"
      output: "kg/kg reference product"
      source_ids: []
    - id: calc_wastewater_normalization
      applies_to: "cl_photochemical_wastewater"
      rule: "Net wastewater = measured treatment-transfer volume minus verified volume returned to the same closed loop; divide by net released product mass."
      inputs:
        - "transfer volume"
        - "closed-loop return volume"
        - "net released product mass"
      output: "m3/kg reference product"
      source_ids: []
    - id: calc_pm_normalization
      applies_to: "fm_pm25_air"
      rule: "Sum measured or documented control-adjusted PM0.2-PM2.5 mass released during attributable operating periods and divide by net released product mass."
      inputs:
        - "measured emission mass or activity factor"
        - "control performance"
        - "operating period"
        - "net released product mass"
      output: "kg/kg reference product"
      source_ids:
        - us-epa-chemical-preparations-neshap-2009
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and all covered product outputs"
      requirement: "Retain product family, formulation version, physical state, concentration status, batch and release specification; do not reuse the developer UUID for another product family."
      evidence: "approved formulation; label; certificate of analysis; release record"
    - id: dq_atomic_ingredients
      applies_to: "formulation and emulsion inputs"
      requirement: "Reconcile every ingredient line as one chemical or physical product; no ingredient-family subtotal may replace atomic records."
      evidence: "recipe; supplier identity; issue log; mass reconciliation"
    - id: dq_measurement
      applies_to: "mass, energy and volume records"
      requirement: "Use calibrated instruments or auditable invoices and document conversion factors, allocation drivers and data gaps."
      evidence: "calibration certificate; meter log; invoice; calculation workbook"
    - id: dq_temporal_coverage
      applies_to: "foreground reporting period"
      requirement: "Include all conforming, rejected, reworked and cleaning events associated with the reporting period and disclose shutdowns or atypical campaigns."
      evidence: "production schedule; batch register; waste log; cleaning log"
    - id: dq_completeness
      applies_to: "environmental releases and waste"
      requirement: "Screen each declared ingredient and process condition for relevant direct release and waste pathways; quantify present pathways and document verified absence."
      evidence: "SDS; permit; monitoring record; waste characterization; process review"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "completed foreground data package"
    rule: "Confirm that the reference output is one kg net saleable product, packaging is separate, and all required qualifiers are declared."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_atomic_rows
    applies_to: "process inventory"
    rule: "Confirm that every selected flow is one atomic exchange and that each conditional ingredient appears only when supported by the declared recipe."
    source_ids:
      - us-epa-photographic-processing-1981
  - rule_id: validate_mass_reconciliation
    applies_to: "each production batch"
    rule: "Reconcile as-supplied ingredient inputs with released product, retained inventory, verified rework, off-specification material, samples and measured losses; explain unresolved imbalance."
    source_ids: []
  - rule_id: validate_emulsion_route
    applies_to: "sensitizing-emulsion products"
    rule: "When onsite emulsion preparation applies, confirm precursor identity, released emulsion mass and process records; otherwise document a purchased upstream sensitizing-emulsion dataset."
    source_ids:
      - us-epa-photographic-processing-1981
  - rule_id: validate_air_pathway
    applies_to: "dry charging, blending or milling"
    rule: "Evaluate fine-particle releases and control-device performance whenever dry operations occur; do not report zero solely because the route is intermittent."
    source_ids:
      - us-epa-chemical-preparations-neshap-2009
  - rule_id: validate_wastewater
    applies_to: "equipment cleaning"
    rule: "Reconcile fresh and recycled cleaning water with transferred wastewater and retained product, and disclose treatment destination and relevant constituents."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "dataset scope"
    rule: "Confirm that customer photographic processing, post-use silver recovery and downstream end of life are excluded unless added as separately reported downstream modules."
    source_ids: []
published_dataset_profile:
  dataset_role: "Cradle-to-gate foreground production package for a declared photographic chemical preparation"
  downstream_use: "May be published as a secondary_dataset or background_dataset after methodology and data review"
  allowed_use: "Attributional product and process LCAs using a matching product family, formulation, state, concentration, geography, technology and packaging boundary"
  excluded_use: "Automatic substitution among developer, fixer, bleach, stop-bath, toner, wetting-agent or sensitizing-emulsion families; customer photographic processing; post-use silver recovery; unqualified regional or technological extrapolation"
  required_metadata: "canonical PCR id; product family; formulation version; physical state; concentrate or ready-use status; active ingredients and concentrations; batch and reporting period; facility geography; process route; packaging configuration; allocation; upstream dataset choices"
  required_quality_disclosure: "foreground coverage; data age; instrument and calculation evidence; ingredient and product mass reconciliation; rejected and reworked material; water and electricity coverage; direct-release screening; wastewater destination; UUID and range evidence gaps"
  update_trigger: "Formulation or supplier-grade change; product-family or market-state change; packaging redesign; process or control-technology change; geography change; material allocation change; reporting-period refresh; resolution of a missing exact UUID or independent range evidence"
