system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased ingredients, process water and packaging materials cross the manufacturing-site boundary. It includes onsite receipt and dosing, dissolution or blending, applicable dry milling, applicable sensitizing-emulsion preparation, filtration and finishing, filling and packaging, quality control, equipment cleaning, onsite waste handling before transfer, and direct measured releases. Upstream production and delivery of purchased inputs require geographically and technologically representative linked datasets. Downstream photographic processing and product end of life are excluded."
      source_ids: []
    - rule_id: boundary_formulation_operations
      applies_to: "foreground manufacturing"
      rule: "Include mixing, blending, milling or other chemical-preparation operations actually used, together with filling, cleaning, waste transfer and measured direct releases; omit a route only with batch evidence that it did not occur."
      source_ids:
        - us-epa-chemical-preparations-neshap-2009
    - rule_id: boundary_product_family
      applies_to: "category scope"
      rule: "Keep photographic processing at the customer outside the foreground system, but use the declared photographic product family and as-sold state to determine which manufacturing ingredients and unit operations apply."
      source_ids:
        - un-cpc-3-0-structure-2025
        - us-epa-photographic-processing-1981
        - ilford-rapid-fixer-sds-2024
    - rule_id: boundary_same_category_input
      applies_to: "recursive product input"
      rule: "A purchased same-category preparation is one atomic product input with an upstream dataset and may not be double-counted through both the supplier preparation and its unverified constituent recipe."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased ingredients and packaging are received at the manufacturing site in the supplier-declared grade and concentration; any internally produced ingredient is identified separately"
  starting_condition_role: "Cradle-to-gate entry point for purchased inputs and beginning of the foreground formulation system"
  product_classification_scope: "Photographic chemical preparations and qualifying measured-portion or retail-ready unmixed photographic products within the declared category boundary"
  recursive_input_rule: "When a purchased photographic preparation from the same category is used as an input, record that specific preparation once with its upstream dataset; do not recursively decompose it unless verified supplier composition and non-overlapping upstream data are available"
  upstream_dataset_requirement: "Link each purchased ingredient, water, electricity and packaging item to a dataset matching geography, technology, grade, concentration and delivery boundary"
  disclosure: "Disclose purchased-versus-onsite ingredient production, product family, formulation version, batch scale, physical state, concentration, packaging configuration, control technology, recycled-water or rework loops, and all exclusions"
