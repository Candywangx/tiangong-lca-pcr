allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "Shared manufacturing operations"
    rule: "Avoid allocation by separately metering route-specific operations and assigning material, energy, water, waste and emissions to the product family or batch that caused them."
    source_ids: []
  - rule_id: allocation_shared_loads
    applies_to: "Unseparated shared utilities"
    rule: "When direct metering is unavailable, allocate a shared load using a measured causal driver such as machine time, treated surface area, bath throughput or accepted product mass; disclose the driver and test sensitivity when it materially affects results."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: allocation_scrap
    applies_to: "Steel scrap and recovered treatment materials"
    rule: "Report scrap and recovered material quantities and destinations explicitly. Do not credit avoided primary production inside the foreground inventory unless the selected downstream system model requires that substitution and the method is disclosed."
    source_ids:
      - ec-jrc-stm-bref-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_records
      process_id: "material_fabrication"
      flow_role: "stainless_steel_input; fabrication_electricity; fabrication_process_water; post_industrial_steel_scrap"
      record_type: "Purchase, meter, production and waste records"
      raw_fields: "material UUID or grade, received mass, returns, electricity kWh, water mass or volume, scrap mass, accepted product mass, batch and date"
      collection_method: "Reconcile invoices and stock movement to calibrated meters or scales for the same production period"
      unit: "kg; kWh; m3"
      frequency: "Per batch or monthly, with annual reconciliation"
      temporal_coverage: "At least 12 consecutive months or the full campaign for shorter production"
      site_scope: "Reporting site and declared product family"
      aggregation_rule: "Sum attributable quantities, subtract documented unchanged returns, then normalize by accepted net product mass"
      quality_evidence: "Purchase records, meter IDs, calibration status, batch records and mass-balance reconciliation"
    - protocol_id: cp_surface_records
      process_id: "surface_treatment_cleaning"
      flow_role: "surface_sodium_hydroxide; surface_process_water; surface_electricity; surface_natural_gas; surface_wastewater"
      record_type: "Bath, meter, chemical and discharge records"
      raw_fields: "chemical product mass and concentration, water input, electricity kWh, gas volume and reference conditions, wastewater mass or volume, contaminant results, treated mass or area"
      collection_method: "Read dedicated meters where available; reconcile bath make-up and discharge logs to the declared route"
      unit: "kg; kWh; m3; m2"
      frequency: "Per batch or shift, aggregated monthly"
      temporal_coverage: "At least 12 consecutive months or the full campaign"
      site_scope: "On-site treatment line serving the declared product"
      aggregation_rule: "Assign by direct batch record; otherwise use treated area or mass and disclose the driver"
      quality_evidence: "Meter calibration, bath log, laboratory result, waste transfer note and route record"
    - protocol_id: cp_combustion_co2
      process_id: "surface_treatment_cleaning"
      flow_role: "surface_fossil_co2"
      record_type: "Fuel and emission-factor record"
      raw_fields: "gas volume, reference conditions, fossil carbon content or approved factor, oxidation basis, measured CO2 when available"
      collection_method: "Prefer direct measurement; otherwise multiply normalized collected fuel by a documented site-specific or jurisdiction-approved factor"
      unit: "kg CO2; m3 gas"
      frequency: "Same period as gas consumption"
      temporal_coverage: "Same period as cp_surface_records"
      site_scope: "On-site combustion serving the declared route"
      aggregation_rule: "Sum direct fossil CO2 and normalize by accepted net product mass"
      quality_evidence: "Fuel certificate, factor source, calculation sheet and meter calibration"
    - protocol_id: cp_packaging_records
      process_id: "final_inspection_packaging"
      flow_role: "packaging_electricity; corrugated_board_boxes; finished_dental_instrument"
      record_type: "Packaging purchase, meter and release records"
      raw_fields: "electricity kWh, box mass, damaged boxes, accepted net product mass, item count, rejected units, model, packaging and sterility state"
      collection_method: "Reconcile packaging specifications and issues to released production lots and final inspection records"
      unit: "kg; count; kWh"
      frequency: "Per released lot, aggregated monthly"
      temporal_coverage: "At least 12 consecutive months or full campaign"
      site_scope: "Final inspection and packaging area"
      aggregation_rule: "Sum attributable inputs and normalize by accepted net product mass; keep item count as companion data"
      quality_evidence: "Release record, packaging specification, scale calibration, meter allocation and rejection log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable period amount / accepted net product mass for the same period"
      inputs:
        - "Attributable flow amount"
        - "accepted net product mass"
      output: "Flow amount per 1 kg accepted net finished product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity rows"
      rule: "electricity_MJ = metered_kWh × 3.6"
      inputs:
        - "Metered kWh"
      output: "MJ of Electricity"
      source_ids: []
    - id: calc_water_mass
      applies_to: "Water and wastewater rows measured by volume"
      rule: "mass_kg = measured_volume × documented density at the declared temperature"
      inputs:
        - Volume
        - density
        - temperature
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "surface_fossil_co2"
      rule: "direct fossil CO2 = normalized gas quantity × documented fossil-carbon emission factor, or normalized direct measurement"
      inputs:
        - "Collected natural-gas use and verified factor"
        - "or direct CO2 measurement"
      output: "kg carbon dioxide (fossil) per kg accepted product"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain model, intended dental function, powered status, single-use or reusable status, material specification, net mass, count, surface state, sterility state and packaging configuration."
      evidence: "Product specification, bill of materials and lot-release record"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Reconcile the declared site route to the three process-map stages and state why each conditional stage is included or absent; disclose outsourced treatment and sterilization."
      evidence: "Process flow diagram, traveller or routing record"
    - id: dq_mass_balance
      applies_to: "Stainless steel, accepted product and steel scrap"
      requirement: "Reconcile received and returned stainless steel, accepted product, rejects, scrap and material retained in work in progress for the same period; explain material gaps."
      evidence: "Stock ledger, batch record, scale records and reconciliation"
    - id: dq_temporal
      applies_to: "All foreground rows"
      requirement: "Use one consistent period of at least 12 consecutive months where production is continuous, or the complete declared campaign; disclose abnormal downtime and rework."
      evidence: "Date-bounded source records and production log"
    - id: dq_measurement
      applies_to: "Metered and weighed rows"
      requirement: "Record meter or scale identity, calibration status, allocation method and missing-data treatment; preserve original units before conversion."
      evidence: "Calibration certificates, raw readings and calculation workbook"
    - id: dq_surface_effluent
      applies_to: "Surface-treatment wastewater"
      requirement: "Retain treatment state, destination and measurements for route-relevant contaminants; do not infer direct environmental emissions from wastewater composition without a discharge boundary."
      evidence: "Laboratory results, discharge permit records or waste transfer notes"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Product category and reference flow"
    rule: "Confirm the product is a dental instrument or appliance within the stated boundary and is not a syringe, needle or like injection article; verify that all required qualifiers are present."
    source_ids:
      - un-cpc-3-0-structure-2025
      - us-fda-iso-21850-1-recognition-2026
  - rule_id: validate_reference_amount
    applies_to: "Reference product"
    rule: "Confirm the output is exactly 1 kg accepted net product after normalization, packaging mass is excluded, and item count is reported."
