  - rule_id: allocation_shared_operations
    applies_to: "shared electricity and common operations"
    rule: "When subdivision is not feasible, allocate shared burdens using a documented causal driver such as machine time, test time or occupied production time; disclose the driver and perform a sensitivity check against item-count allocation."
    source_ids: []
  - rule_id: allocation_rework_scrap
    applies_to: "rework, rejects and recyclable scrap"
    rule: "Assign rework burdens to the accepted output that required them; record any exported recyclable material as a separate waste or co-product exchange and disclose the applied cut-off or substitution convention without netting it from input quantities."
    source_ids: []
dataset_production:
