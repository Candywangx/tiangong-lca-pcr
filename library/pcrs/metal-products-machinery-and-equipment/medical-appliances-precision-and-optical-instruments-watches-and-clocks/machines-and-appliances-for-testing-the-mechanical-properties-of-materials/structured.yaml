allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Shared manufacturing lines, utilities, and release-test operations"
    rule: "First avoid allocation by subdividing processes, using model- or work-order-specific BOMs, and submetering or otherwise tracing activity data to the represented configuration."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_relationship
    applies_to: "Residual shared inputs and emissions after subdivision"
    rule: "When subdivision is not practicable, allocate using a documented physical relationship that reflects resource use, such as machine hours, test hours, measured energy demand, processed mass, or work-order time. Do not use product count when configurations differ materially in mass or processing."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other_relationship
    applies_to: "Shared burdens lacking a defensible physical relationship"
    rule: "Use economic or another justified relationship only after documenting why subdivision and physical allocation are not feasible; disclose the basis, period, product pool, and sensitivity of the result."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_scrap_rework
    applies_to: "Scrap, reusable returns, rework, and rejects"
    rule: "Attribute consumables and energy used for rework to conforming released output; distinguish internally returned scrap from waste leaving the site and prevent double counting of internal transfers. Any recycling or avoided-burden modelling belongs to the declared downstream method and shall be disclosed separately."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_no_unreported_coproduct
    applies_to: "Saleable by-products or recovered materials"
    rule: "Identify every saleable co-product or recovered material. If none occurs, state this explicitly; if one occurs, apply the declared allocation hierarchy and retain quantity, destination, and allocation evidence."
    source_ids:
      - eu-pef-2021
dataset_production:
