      collection_method: "Reconcile released serial numbers or work orders to the BOM, receipt, inventory, and measured or controlled part-mass records"
      unit: "original record unit and kg"
      frequency: "Each lot or work order; aggregate at least monthly"
      temporal_coverage: "Same representative period as released output, normally 12 consecutive months or the full production campaign if shorter"
      site_scope: "All sites contributing foreground preparation to the represented product"
      aggregation_rule: "Sum attributable inputs, adjust for stock change, and normalize through calc_reference_normalization; retain model/configuration stratification"
      quality_evidence: "Approved BOM revision, purchase or receipt record, stock ledger, weighing/calibration evidence, supplier specification, upstream dataset selection record"
