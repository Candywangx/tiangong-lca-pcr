      collection_method: "Prefer submetering and work-order issues; otherwise reconcile site meters or invoices to operating logs and a justified allocation driver"
      unit: "exact source unit"
      frequency: "Continuous or per batch; aggregate monthly"
      temporal_coverage: "Same representative period as released output"
      site_scope: "Each foreground preparation site"
      aggregation_rule: "Subtract non-production use where evidenced, allocate under section 7, and normalize through calc_reference_normalization"
      quality_evidence: "Meter calibration, invoices, issue tickets, work orders, operating hours, allocation worksheet"
