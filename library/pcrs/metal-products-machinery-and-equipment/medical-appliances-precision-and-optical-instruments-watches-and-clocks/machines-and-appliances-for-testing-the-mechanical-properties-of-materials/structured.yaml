      record_type: "Work orders, serial-number build records, issue records, meters, BOM reconciliation, non-conformance and waste records"
      raw_fields: "serial_or_lot; configuration_id; input_transfer_mass; assembly_input_id; quantity; unit; energy_reading; assembly_hours; rework_quantity; waste_quantity; waste_route; assembled_mass"
      collection_method: "Trace records to represented serial numbers, configurations, or work orders; reconcile internal transfers and assembled mass"
      unit: "original record unit and kg"
      frequency: "Each work order or shift; aggregate monthly"
      temporal_coverage: "Same representative period as released output"
      site_scope: "Every site performing final mechanical or electrical integration"
      aggregation_rule: "Sum configuration-specific quantities, allocate only residual shared burdens under section 7, and normalize through calc_reference_normalization"
      quality_evidence: "Work order, BOM issue record, calibrated meter, non-conformance report, weighing record, waste manifest"
    - protocol_id: cp_calibration_release
      process_id: "calibration_verification_and_release"
      flow_role: "Release-test inputs, calibration evidence, packaging, rework, rejects, and released product"
      record_type: "Serial-level inspection and calibration records, applicable standard and class, test logs, meter and issue records, packaging BOM, release certificate, net mass"
      raw_fields: "serial_id; configuration_id; applicable_standard; force_or_measurement_class; inspection_record; calibration_record; verification_result; test_energy; specimen_or_consumable; rework_parts; reject_mass; packaging_item; packaging_mass; net_released_mass; release_date"
      collection_method: "Link each released serial or sampled lot to applicable inspection, calibration, verification, rework, packaging, and net-mass records"
      unit: "exact source unit and kg"
      frequency: "Each released serial or defined lot; energy aggregated at least monthly when serial metering is unavailable"
      temporal_coverage: "Same representative period as released output"
      site_scope: "Every release and packaging site"
      aggregation_rule: "Include failed attempts and rework attributable to conforming output, separate packaging, and normalize through calc_reference_normalization"
      quality_evidence: "Calibration certificate, traceable standard or procedure, inspection checklist, test log, release certificate, calibrated scale record, packaging specification"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground input, waste, and direct emission"
      rule: "Normalized quantity = attributable quantity in the representative period / net mass of conforming released machines in the same represented product pool. Convert numerator and denominator to compatible units before division."
      inputs:
        - "attributable quantity"
        - "net conforming released mass"
        - "unit conversion"
        - "allocation evidence"
      output: "Quantity per 1 kg net released complete machine"
      source_ids:
        - eu-pef-2021
    - id: calc_stock_adjusted_input
      applies_to: "Purchased inputs crossing a period boundary"
      rule: "Consumed input = opening stock + receipts - closing stock - documented returns, calculated for the same part, material, site, and period."
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
      output: "Attributable consumed input"
      source_ids:
        - eu-pef-2021
    - id: calc_mass_reconciliation
      applies_to: "Product, scrap, waste, emissions, and stock change"
      rule: "Reconcile mass-bearing inputs with released product, off-site waste, direct mass emissions, documented internal returns, and stock or work-in-progress change. Investigate and disclose the residual rather than forcing it to zero."
      inputs:
        - "mass inputs"
        - "released mass"
        - wastes
        - "mass emissions"
        - "internal returns"
        - "stock and work-in-progress change"
      output: "Mass-balance residual and reconciliation statement"
      source_ids:
        - eu-pef-2021
    - id: calc_shared_activity_allocation
      applies_to: "Shared utilities and operations"
      rule: "Allocated quantity = shared measured quantity × represented product's documented driver / total driver for the same equipment, site, and period. The driver shall satisfy section 7."
      inputs:
        - "shared quantity"
        - "product driver"
        - "total driver"
        - "allocation period"
      output: "Attributable shared quantity"
      source_ids:
        - eu-pef-2021
    - id: calc_internal_transfer_consistency
      applies_to: "Prepared-components and assembled-machine transfers"
      rule: "The output of the supplying foreground process shall equal the input to the receiving process after documented stock change; internal transfers carry no additional upstream burden."
      inputs:
        - "supplying-process output"
        - "receiving-process input"
        - "inter-process stock change"
      output: "Transfer reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dqr_product_identity
      applies_to: "Reference product and product pool"
      requirement: "Records shall identify model, configuration, test principle, rated capacity, drive and frame type, measurement system, integrated accessories, packaging treatment, and serial or lot population represented."
      evidence: "Product specification, BOM revision, configuration record, serial or lot register"
    - id: dqr_measurement_traceability
      applies_to: "Mass, energy, calibration, emissions, and allocation drivers"
      requirement: "Retain instrument identity, calibration status, reading period, unit, conversion, and responsible record owner; calibration and verification evidence shall name the applicable standard, procedure, and achieved class or result."
      evidence: "Calibration certificate, meter log, test report, controlled procedure, conversion worksheet"
    - id: dqr_temporal_consistency
      applies_to: "All foreground records"
      requirement: "Inputs, outputs, stock change, waste, and released mass shall cover the same representative period. A shorter campaign is acceptable only when it covers the full campaign and is disclosed."
      evidence: "Period reconciliation and coverage report"
    - id: dqr_site_completeness
      applies_to: "Multi-site manufacture"
      requirement: "Include every site performing an operation within the declared foreground boundary and identify transfers between sites; do not represent one site as the complete route without justification."
      evidence: "Site map, routing, transfer records, site coverage matrix"
    - id: dqr_bom_and_supplier_data
      applies_to: "Purchased inputs"
      requirement: "Use the product-specific BOM and prioritize supplier-specific or technology-, geography-, and state-matched upstream datasets. Disclose proxies and their mass share."
      evidence: "BOM, supplier specification, dataset-selection and proxy register"
    - id: dqr_completeness_and_gaps
      applies_to: "Potentially relevant flows"
      requirement: "Document included and excluded operations and flows, missing-data treatment, materiality assessment, allocation, and unresolved gaps. No missing category-wide default may be replaced by an unlabelled estimate."
      evidence: "Completeness checklist, exclusions log, gap register, allocation worksheet"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "The reference product UUID shall be f88ff979-7acf-4c6d-8a10-710337b61179, the reference flow property UUID shall be 93a60a56-a3c8-11da-a746-0800200b9a66, the unit-group UUID shall be 93a60a57-a4c8-11da-a746-0800200c9a66, and the normalized reference amount shall be exactly 1 kg."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_category_scope
    applies_to: "Product identity"
    rule: "The represented output shall be a complete mechanical-properties testing machine or appliance within CPC 3.0:48262. A separately supplied part or accessory within CPC 3.0:48285, a testing service, or a non-mechanical analytical instrument shall fail category conformance."
    source_ids:
      - unsd-cpc-3-0-2025
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata and reference-flow comment"
    rule: "Every qualifier listed in section 3 shall be present and consistent with the product specification, BOM, and release evidence."
    source_ids:
      - iso-7500-1-2018
      - iso-9513-2012
      - instron-3340-system-support
  - rule_id: validate_process_coverage
    applies_to: "Foreground process map"
    rule: "All three required processes shall be represented. Every applicable in-house fabrication, finishing, assembly, software or controller integration, calibration, verification, rework, and packaging operation shall be included or explicitly justified as outside the delivered configuration."
    source_ids:
      - eu-pef-2021
      - instron-3340-system-support
  - rule_id: validate_release_evidence
    applies_to: "Released product"
    rule: "Retain general inspection and applicable force-measurement calibration or verification evidence, achieved performance class or result, and extensometer calibration evidence when an extensometer is included. Missing applicable release evidence fails conformance."
    source_ids:
      - iso-7500-1-2018
      - iso-9513-2012
  - rule_id: validate_bom_and_upstream_links
    applies_to: "Purchased materials and components"
    rule: "The product-specific BOM shall reconcile to the represented configuration, and each material or component group shall have an upstream dataset or an explicitly disclosed unresolved gap. Potentially material burden-free inputs fail conformance."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "Shared inputs and operations"
    rule: "Allocation shall follow section 7 and retain the measured shared quantity, driver, denominator, period, product pool, and justification. Unsupported allocation or product-count allocation across materially different configurations fails conformance."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_mass_and_internal_transfers
    applies_to: "Mass-bearing inventory and foreground links"
    rule: "Internal transfer outputs and inputs shall reconcile after stock change, and the section 8 mass-balance residual shall be calculated, investigated, and disclosed. A forced or unexplained residual makes validation inconclusive."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_temporal_site_completeness
    applies_to: "Foreground evidence"
    rule: "Inputs, outputs, stock, waste, and released mass shall share a consistent period and cover all foreground sites. Missing site or period coverage without justification makes validation inconclusive."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_no_unlabelled_estimates
    applies_to: "Foreground quantities"
    rule: "Every quantity shall be collected, calculated from collected data, or explicitly identified under an approved modelling method. Unlabelled estimates, invented zeros, and unsupported category defaults fail conformance."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Product-specific or explicitly defined product-family manufacturing dataset for a complete mechanical-properties testing machine at the plant gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Upstream supply of complete testing machinery in product systems; comparison or screening only when product configuration, boundary, geography, period, data quality, and allocation are compatible"
  excluded_use: "Standalone parts or accessories; laboratory testing services; use-phase electricity or consumables; maintenance and calibration services after delivery; end-of-life modelling; claims comparing machines with materially different capacity, accuracy, configuration, or included accessories without functional adjustment"
  required_metadata: "Canonical PCR id and version used; CPC 3.0:48262; model or product-family definition; test principle and modes; rated capacity; drive and frame type; force and strain measurement configuration; included controller, hardware, software-bearing equipment, load cells, grips, fixtures, extensometers, and other accessories; net mass; packaging treatment; site and geography; production period; allocation; upstream dataset selection; release standards and results; data gaps and exclusions"
  required_quality_disclosure: "BOM coverage; supplier-specific and proxy dataset shares by mass; foreground site and temporal coverage; meter and mass-measurement traceability; calibration and release evidence; waste-route coverage; mass-balance residual; allocation drivers; exclusions; missing-data treatment; uncertainty or sensitivity relevant to the intended use"
  update_trigger: "Change in product configuration or rated capacity; drive, frame, controller, measurement chain, or accessory redesign; material or supplier route change; manufacturing-site or process change; altered release or calibration standard; allocation or packaging change; representative data older than the declared validity period; newly available supplier data; unresolved gap becoming material"
