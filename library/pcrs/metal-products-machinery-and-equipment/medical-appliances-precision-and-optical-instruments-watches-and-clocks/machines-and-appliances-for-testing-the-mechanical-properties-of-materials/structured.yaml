        - eu-pef-2021
    - rule_id: boundary_no_data_cutoff
      applies_to: "Potentially relevant foreground flows"
      rule: "Do not omit a material or energy flow solely because data are unavailable. Document every exclusion, its reason, and the materiality check used; unresolved potentially significant exclusions make validation inconclusive."
      source_ids:
        - eu-pef-2021
