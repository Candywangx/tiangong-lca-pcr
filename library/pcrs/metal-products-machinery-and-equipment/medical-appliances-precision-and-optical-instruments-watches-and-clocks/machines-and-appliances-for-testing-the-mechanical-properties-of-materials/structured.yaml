      frequency: "Per shipment, batch, or monitoring interval; aggregate monthly"
      temporal_coverage: "Same representative period as released output"
      site_scope: "Each foreground preparation site"
      aggregation_rule: "Separate internal returns from off-site waste, calculate emissions by substance and compartment, and normalize through calc_reference_normalization"
