allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared lines, utilities, and waste handling"
    rule: "Avoid allocation by subdivision or direct metering whenever technically feasible."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable shared burdens"
    rule: "Otherwise allocate by a documented causal physical driver such as machine time, metered energy, processed mass, or tested unit-hours."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "multi-output operations without a physical relation"
    rule: "Use economic allocation only as a last resort, with consistent prices and disclosed sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "manufacturing scrap"
    rule: "Report scrap mass/destination without avoided-production credit inside this foreground package; apply recycling burdens or credits only in the downstream study method."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_records
      process_id: "instrument_manufacturing"
      flow_role: "each atomic material/component/packaging input"
      record_type: "ERP issue/return, invoice, BOM, scale, or count-to-mass record"
      raw_fields: "identity; supplier; grade/model; issued/returned mass; count; unit mass; batch; date"
      collection_method: "Reconcile issue less return by batch; verify piece-to-mass factors"
      unit: "kg"
      frequency: "each batch, monthly aggregation"
      temporal_coverage: "representative 12 months or complete shorter campaign"
      site_scope: "every included site"
      aggregation_rule: "Sum net input by exact flow and divide by accepted output mass"
      quality_evidence: "calibrated scale; approved BOM; ERP/invoice reconciliation; unit-mass evidence"
    - protocol_id: cp_electricity_records
      process_id: "instrument_manufacturing"
      flow_role: "purchased electrical energy"
      record_type: "submeter or reconciled facility meter"
      raw_fields: "readings; unit; meter id; voltage; grid mix; allocation driver; output mass; period"
      collection_method: "Prefer submetering; otherwise allocate contemporaneous meter totals using Section 7"
      unit: "kWh and MJ"
      frequency: "monthly/campaign"
      temporal_coverage: "same production period"
      site_scope: "every included site"
      aggregation_rule: "Convert kWh × 3.6, apply allocation share, divide by accepted output mass"
      quality_evidence: "meter calibration/bill; allocation worksheet; grid evidence"
    - protocol_id: cp_finished_product_records
      process_id: "instrument_manufacturing"
      flow_role: "accepted product and conformity"
      record_type: "scale, release record, calibration certificate, test log"
      raw_fields: "model; lot; accepted/reject mass; procedure; result; tolerance; pass/fail; configuration; date"
      collection_method: "Weigh unpackaged conforming product and link to release evidence"
      unit: "kg"
      frequency: "each batch/lot"
      temporal_coverage: "complete reporting period"
      site_scope: "every included site"
      aggregation_rule: "Sum conforming released mass only"
      quality_evidence: "scale calibration; signed release; traceable test/conformity record"
    - protocol_id: cp_waste_records
      process_id: "instrument_manufacturing"
      flow_role: "each atomic waste output"
      record_type: "scale ticket, transfer note, stock reconciliation"
      raw_fields: "identity; mass; state; hazard class; destination; treatment; date"
      collection_method: "Weigh separately at transfer and subtract documented returns"
      unit: "kg"
      frequency: "each transfer, monthly aggregation"
      temporal_coverage: "same production period"
      site_scope: "every included site"
      aggregation_rule: "Sum net waste by exact flow and divide by accepted output mass"
      quality_evidence: "scale calibration; transfer/contractor receipt; hazard classification"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "each mass input/waste"
      rule: "normalized amount = net exchange mass / accepted unpackaged output mass in the same period"
      inputs:
        - "net flow mass"
        - "accepted output mass"
      output: "kg/kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "piece-recorded inputs"
      rule: "mass = verified count × measured or supplier unit mass, then apply calc_mass_normalization"
      inputs:
        - count
        - "unit mass"
        - "output mass"
      output: "kg/kg reference product"
      source_ids: []
    - id: calc_electricity_normalization
      applies_to: "electricity"
      rule: "normalized electricity = net kWh × 3.6 MJ/kWh × allocation share / accepted output mass"
      inputs:
        - readings
        - allocation
        - "output mass"
      output: "MJ/kg reference product"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "completeness"
      rule: "Reconcile accepted product + each waste + work-in-progress change against all material/component inputs; investigate/disclose residual rather than creating an unspecified balancing flow."
      inputs:
        - "atomic inputs"
        - product
        - wastes
        - work-in-progress
      output: "documented residual"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity_and_architecture
      applies_to: "product/components"
      requirement: "Record model, instrument type, architecture, sensing/indication principle, grade/model, and state; add actual BOM exchanges atomically."
      evidence: "BOM, product/supplier specification, Tiangong UUIDs"
    - id: dq_measurement_traceability
      applies_to: "mass, electricity, calibration, waste"
      requirement: "Use calibrated or bill-reconciled instruments and link records to one production period."
      evidence: "certificates, invoices, meter/scale logs, calculations"
    - id: dq_temporal_and_site_coverage
      applies_to: "reporting period"
      requirement: "Cover all included sites for representative 12 months or disclose the complete shorter campaign and limitations."
      evidence: "site list, calendar, reconciliation"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile materials/components, product, rejects, wastes, and work-in-progress; add every missing exchange atomically."
      evidence: "mass balance, BOM/ERP, waste records"
    - id: dq_functional_conformity
      applies_to: "released product"
      requirement: "Retain test/calibration procedure, criteria, results, and conformity status; taximeters retain distance/time and fare-function evidence."
      evidence: "test/calibration/release records; oiml-r21-2007-taximeters; samr-compulsory-verification-catalogue-2020 where applicable"
    - id: dq_background_compatibility
      applies_to: "purchased input datasets"
      requirement: "Check technology, geography, time, and state; disclose proxies/gaps."
      evidence: "dataset metadata; eu-pef-method-2021"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly 1 kg accepted unpackaged product and matching reference UUID/property/unit group plus all qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_process_coverage
    applies_to: "foreground boundary"
    rule: "Confirm onsite forming/board work, assembly, programming, testing/calibration, rework/rejects, and packaging coverage."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_atomic_inventory
    applies_to: "all exchanges"
    rule: "Confirm each row is one concrete exchange with compatible UUID, property, unit, state, and route condition; reject umbrellas and treatment-service substitutions."
    source_ids: []
  - rule_id: validation_mass_and_energy
    applies_to: "quantities"
    rule: "Recalculate denominator, count-to-mass factors, electricity conversion, allocations, and residual."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_conditional_rows
    applies_to: "architecture/route"
    rule: "Confirm absent common rows are not_applicable with evidence and every additional actual exchange is added atomically."
    source_ids: []
  - rule_id: validation_conformity_evidence
    applies_to: "performance"
    rule: "Confirm release records demonstrate declared performance and applicable conformity regime."
    source_ids:
      - oiml-r21-2007-taximeters
      - samr-compulsory-verification-catalogue-2020
  - rule_id: validation_boundary_and_allocation
    applies_to: "exclusions/upstream/shared burdens"
    rule: "Confirm upstream links, post-gate exclusions, waste destinations, allocation drivers, and gaps are disclosed."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for a declared counter, indicator, distance/speed instrument, tachometer, pedometer, taximeter, or stroboscope"
  downstream_use: "May be a secondary_dataset and used as a background_dataset for systems consuming the declared instrument"
  allowed_use: "LCA with compatible function, architecture, performance, geography, technology, market state, period, packaging, and upstream datasets"
  excluded_use: "Comparative assertions without functional equivalence; excluded instruments/devices; unmodelled use/maintenance/end-of-life claims; silent proxies"
  required_metadata: "PCR id/version; product model/type; function/performance; architecture; sensing/display; power source; product/packaging mass; sites/geography; period; onsite/outsourced steps; electricity; component/waste identities and destinations; allocation; sources/upstream versions"
  required_quality_disclosure: "Calibration/measurement evidence; BOM/mass-balance completeness; temporal/site coverage; conformity evidence; allocations; proxy/gap register; uncertainty/exclusions; unresolved range-evidence status"
  update_trigger: "Material change in architecture, BOM, site, supplier/upstream dataset, route, test procedure, electricity mix, allocation, packaging, waste destination, conformity, or reporting period"
