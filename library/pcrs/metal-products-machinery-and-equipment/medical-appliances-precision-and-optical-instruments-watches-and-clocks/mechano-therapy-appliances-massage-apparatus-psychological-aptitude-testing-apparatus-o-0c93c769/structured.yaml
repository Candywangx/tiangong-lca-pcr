allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable products, lines, batches and route steps"
    rule: "Avoid allocation by process subdivision, separate meters, separate batch records or a redefined process boundary whenever the studied apparatus can be isolated."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: allocation_physical_causal
    applies_to: "unavoidable shared utilities, treatment loads and common processes"
    rule: "Allocate by a documented physical relationship that reflects causation, such as metered use, machine time, treatment-cycle occupancy, test time or another engineering driver; mass allocation is acceptable only when mass drives the shared burden."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: allocation_economic_fallback
    applies_to: "common process without a defensible physical relationship"
    rule: "Use economic or another justified relationship only when subdivision and physical allocation are not feasible; disclose the factor, data period and sensitivity."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: allocation_waste_recycling
    applies_to: "scrap, rejects, spent media and recovered materials"
    rule: "Keep waste outputs and treatment burdens visible. Do not apply an undeclared recycling or avoided-product credit in the foreground package; any downstream recycling allocation must be stated separately and consistently."
    source_ids:
      - ghg-protocol-product-standard
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_material_records
      process_id: "component_preparation_assembly_integration"
      flow_role: "raw materials, parts and components"
      record_type: "controlled bill of materials, issue and return records"
      raw_fields: "model; revision; part id; material identity; supplier; quantity; unit mass; issued mass; returned mass; lot; date"
      collection_method: "reconcile controlled BOM with warehouse issues, returns and sampled or complete weighing"
      unit: "item; kg"
      frequency: "each BOM revision and production batch"
      temporal_coverage: "full declared production period"
      site_scope: "all sites supplying the reference output"
      aggregation_rule: "sum net issued mass by exact flow and normalise by conforming net output mass"
      quality_evidence: "BOM approval, scale calibration, supplier specification, issue and return trace"
    - protocol_id: cp_preparation_utility_records
      process_id: "component_preparation"
      flow_role: "preparation energy"
      record_type: "meter and equipment log"
      raw_fields: "meter id; carrier; opening and closing reading; machine time; batch; allocation driver"
      collection_method: "direct submeter preferred; otherwise reconciled shared meter and causal driver"
      unit: "kWh; MJ; kg; m3"
      frequency: "each batch or meter interval"
      temporal_coverage: "full declared production period"
      site_scope: "all in-house preparation lines"
      aggregation_rule: "sum carrier-specific use and allocate only under Section 7"
      quality_evidence: "meter calibration, utility invoice and machine log"
    - protocol_id: cp_preparation_consumable_records
      process_id: "component_preparation"
      flow_role: "water and auxiliaries"
      record_type: "meter, purchase, issue and return records"
      raw_fields: "flow id; material name; batch; opening stock; receipts; issues; returns; closing stock"
      collection_method: "meter or mass-balance reconciliation by exact material"
      unit: "kg; m3"
      frequency: "each batch and inventory period"
      temporal_coverage: "full declared production period"
      site_scope: "all in-house preparation lines"
      aggregation_rule: "calculate net consumption by material and reconcile stock change"
      quality_evidence: "meter calibration, inventory reconciliation and lot trace"
    - protocol_id: cp_preparation_output_records
      process_id: "component_preparation"
      flow_role: "accepted prepared components"
      record_type: "production transfer record"
      raw_fields: "component id; accepted count; unit mass; accepted mass; rejects; destination; batch"
      collection_method: "weigh or calculate from verified unit mass and accepted count"
      unit: "item; kg"
      frequency: "each transfer batch"
      temporal_coverage: "full declared production period"
      site_scope: "all in-house preparation lines"
      aggregation_rule: "sum accepted mass by component family"
      quality_evidence: "transfer record, scale check and acceptance record"
    - protocol_id: cp_preparation_waste_records
      process_id: "component_preparation"
      flow_role: "preparation scrap and rejects"
      record_type: "waste log and transfer note"
      raw_fields: "waste identity; source batch; gross; tare; net mass; return to process; destination"
      collection_method: "calibrated weighing and destination reconciliation"
      unit: "kg"
      frequency: "each waste transfer"
      temporal_coverage: "full declared production period"
      site_scope: "all in-house preparation lines"
      aggregation_rule: "sum net waste by identity and destination"
      quality_evidence: "scale calibration, waste ticket and contractor receipt"
    - protocol_id: cp_assembly_consumable_records
      process_id: "assembly_integration"
      flow_role: "assembly auxiliaries"
      record_type: "issue, return and stock records"
      raw_fields: "auxiliary id; lot; opening stock; issue; return; closing stock; batch"
      collection_method: "material balance by exact auxiliary"
      unit: "kg"
      frequency: "each batch and inventory period"
      temporal_coverage: "full declared production period"
      site_scope: "all assembly sites"
      aggregation_rule: "calculate net use and normalise by conforming output"
      quality_evidence: "inventory reconciliation and lot trace"
    - protocol_id: cp_assembly_utility_records
      process_id: "assembly_integration"
      flow_role: "assembly utilities"
      record_type: "meter and production log"
      raw_fields: "carrier; meter id; readings; batch; line time; allocation driver"
      collection_method: "direct submeter preferred; otherwise reconciled shared meter"
      unit: "kWh; MJ; kg; m3"
      frequency: "each batch or meter interval"
      temporal_coverage: "full declared production period"
      site_scope: "all assembly lines"
      aggregation_rule: "sum carrier-specific use and allocate only under Section 7"
      quality_evidence: "meter calibration, invoice and line log"
    - protocol_id: cp_assembly_output_records
      process_id: "assembly_integration"
      flow_role: "assembled apparatus"
      record_type: "serial, lot and transfer record"
      raw_fields: "model; serial or lot; unit count; unit net mass; transfer mass; date; next route step"
      collection_method: "calibrated weighing plus serial or lot reconciliation"
      unit: "item; kg"
      frequency: "each transfer batch"
      temporal_coverage: "full declared production period"
      site_scope: "all assembly sites"
      aggregation_rule: "sum accepted transfer mass by model and route"
      quality_evidence: "scale calibration, release signature and serial or lot trace"
    - protocol_id: cp_assembly_waste_records
      process_id: "assembly_integration"
      flow_role: "assembly waste"
      record_type: "waste and rework log"
      raw_fields: "waste identity; rejected component; batch; mass; rework return; destination"
      collection_method: "calibrated weighing and rework reconciliation"
      unit: "kg"
      frequency: "each batch and waste transfer"
      temporal_coverage: "full declared production period"
      site_scope: "all assembly sites"
      aggregation_rule: "sum net waste excluding documented rework returned to process"
      quality_evidence: "waste ticket, rework closure and scale calibration"
    - protocol_id: cp_treatment_batch_records
      process_id: "cleaning_sterilisation"
      flow_role: "apparatus entering treatment"
      record_type: "treatment load record"
      raw_fields: "treatment route; equipment id; load id; model; count; load mass; start and end time"
      collection_method: "controlled load record reconciled to apparatus transfer"
      unit: "item; kg"
      frequency: "each treatment load"
      temporal_coverage: "full declared production period"
      site_scope: "each treatment site, including outsourced site"
      aggregation_rule: "sum input load by route and reconcile accepted and rejected outputs"
      quality_evidence: "validated load record and transfer trace"
    - protocol_id: cp_treatment_consumable_records
      process_id: "cleaning_sterilisation"
      flow_role: "treatment media and consumables"
      record_type: "cycle consumption and issue record"
      raw_fields: "load id; medium id; water; chemical or gas quantity; wraps; indicators; recovered quantity"
      collection_method: "metering, dosing record or reconciled material issue"
      unit: "kg; m3; item"
      frequency: "each treatment load"
      temporal_coverage: "full declared production period"
      site_scope: "each treatment route and site"
      aggregation_rule: "sum exact inputs per load and divide by accepted treated output"
      quality_evidence: "dosing calibration, batch certificate and cycle record"
    - protocol_id: cp_treatment_utility_records
      process_id: "cleaning_sterilisation"
      flow_role: "treatment utilities"
      record_type: "equipment-cycle and meter record"
      raw_fields: "load id; electricity; steam; heat; compressed air; cycle duration; accepted load"
      collection_method: "dedicated meter or validated equipment-cycle record"
      unit: "kWh; MJ; kg; m3"
      frequency: "each treatment load"
      temporal_coverage: "full declared production period"
      site_scope: "each treatment route and site"
      aggregation_rule: "sum utility by cycle and allocate across accepted load only"
      quality_evidence: "meter calibration, equipment validation and cycle log"
    - protocol_id: cp_treatment_output_records
      process_id: "cleaning_sterilisation"
      flow_role: "treated apparatus"
      record_type: "treatment release record"
      raw_fields: "load id; model; count; accepted mass; rejected mass; achieved state; release decision"
      collection_method: "weigh accepted output and reconcile with release record"
      unit: "item; kg"
      frequency: "each treatment load"
      temporal_coverage: "full declared production period"
      site_scope: "each treatment route and site"
      aggregation_rule: "sum accepted treated mass by declared state"
      quality_evidence: "release signature, validation result and load reconciliation"
    - protocol_id: cp_treatment_waste_records
      process_id: "cleaning_sterilisation"
      flow_role: "treatment wastes"
      record_type: "discharge, waste and rejected-load record"
      raw_fields: "load id; wastewater volume; spent medium; waste identity; rejected mass; destination"
      collection_method: "meter, calibrated weighing and waste-transfer reconciliation"
      unit: "kg; m3"
      frequency: "each load or discharge event"
      temporal_coverage: "full declared production period"
      site_scope: "each treatment route and site"
      aggregation_rule: "sum by waste identity and destination"
      quality_evidence: "discharge meter, waste ticket and load record"
    - protocol_id: cp_final_acceptance_records
      process_id: "final_testing_packaging"
      flow_role: "apparatus entering and passing final acceptance"
      record_type: "serial, lot, calibration and final-test record"
      raw_fields: "model; serial or lot; input count and mass; test route; result; rework; rejection; release"
      collection_method: "controlled final-test record reconciled to production output"
      unit: "item; kg"
      frequency: "each tested unit or batch"
      temporal_coverage: "full declared production period"
      site_scope: "all final-test sites"
      aggregation_rule: "reconcile input, pass, rework and reject status by model"
      quality_evidence: "test-system calibration, approval and traceable test result"
    - protocol_id: cp_final_test_consumable_records
      process_id: "final_testing_packaging"
      flow_role: "test media and consumables"
      record_type: "test-cell meter and material issue record"
      raw_fields: "test id; gas or medium; opening and closing reading; issue; recovery; returned quantity"
      collection_method: "direct meter or material balance by test route"
      unit: "kg; m3; item"
      frequency: "each test or batch"
      temporal_coverage: "full declared production period"
      site_scope: "all final-test sites"
      aggregation_rule: "sum net use by exact flow over accepted and rejected tests"
      quality_evidence: "meter calibration, cylinder or material reconciliation and test log"
    - protocol_id: cp_final_test_utility_records
      process_id: "final_testing_packaging"
      flow_role: "final-test utilities"
      record_type: "meter and equipment log"
      raw_fields: "meter id; carrier; reading; test duration; unit or batch; allocation driver"
      collection_method: "direct submeter preferred; otherwise reconciled shared meter"
      unit: "kWh; MJ; kg; m3"
      frequency: "each test batch or meter interval"
      temporal_coverage: "full declared production period"
      site_scope: "all final-test sites"
      aggregation_rule: "sum by carrier and allocate only under Section 7"
      quality_evidence: "meter calibration, equipment log and utility reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "final_testing_packaging"
      flow_role: "packaging materials"
      record_type: "packaging specification, issue and weighing record"
      raw_fields: "packaging level; material id; package count; unit mass; issued mass; unused return"
      collection_method: "verified unit mass times count or direct issue weighing"
      unit: "item; kg"
      frequency: "each packaging configuration and batch"
      temporal_coverage: "full declared production period"
      site_scope: "all packaging sites"
      aggregation_rule: "sum net packaging mass by material and level"
      quality_evidence: "approved specification, scale calibration and issue record"
    - protocol_id: cp_finished_output_records
      process_id: "final_testing_packaging"
      flow_role: "conforming finished apparatus"
      record_type: "production release and weighing record"
      raw_fields: "model; configuration; serial or lot; conforming count; gross packed mass; packaging mass; net apparatus mass; release date"
      collection_method: "calibrated net weighing or gross-minus-verified-packaging calculation"
      unit: "item; kg"
      frequency: "each released batch"
      temporal_coverage: "full declared production period"
      site_scope: "all sites releasing reference output"
      aggregation_rule: "sum conforming net mass; this is the normalisation denominator"
      quality_evidence: "scale calibration, release approval, packaging reconciliation and serial or lot trace"
    - protocol_id: cp_final_waste_records
      process_id: "final_testing_packaging"
      flow_role: "rejects and packaging waste"
      record_type: "reject, rework and waste-transfer record"
      raw_fields: "model; part or waste identity; mass; rework status; disposition; destination"
      collection_method: "calibrated weighing and closure of rework records"
      unit: "kg"
      frequency: "each batch and waste transfer"
      temporal_coverage: "full declared production period"
      site_scope: "all final-test and packaging sites"
      aggregation_rule: "sum net waste excluding closed rework returned to production"
      quality_evidence: "reject disposition, waste ticket and scale calibration"
    - protocol_id: cp_direct_emission_records
      process_id: "component_preparation_assembly_integration_cleaning_sterilisation_final_testing_packaging"
      flow_role: "direct releases"
      record_type: "monitoring result or calculation worksheet"
      raw_fields: "process; substance; compartment; sample or meter result; activity data; factor; factor source; capture or recovery; period"
      collection_method: "direct monitoring preferred; otherwise calculation from collected activity and a cited substance-specific factor"
      unit: "kg; m3; concentration unit"
      frequency: "each monitoring event or calculation period"
      temporal_coverage: "full declared production period"
      site_scope: "every site with a direct release"
      aggregation_rule: "calculate substance-specific released mass and normalise by corresponding conforming output"
      quality_evidence: "laboratory report, instrument calibration, factor citation and calculation review"
  calculation_rules:
    - id: calc_reference_normalisation
      applies_to: "every foreground amount"
      rule: "normalised amount = reconciled period or batch amount / conforming net finished apparatus mass from the same scope"
      inputs:
        - "applicable collection protocol"
        - cp_finished_output_records
      output: "row-specific quantity per 1 kg finished apparatus"
      source_ids: []
    - id: calc_component_mass
      applies_to: "components and accessories recorded by count"
      rule: "component mass = accepted count × verified model- and lot-specific unit mass; reconcile with net issued mass"
      inputs:
        - cp_bom_material_records
      output: "kg component per reference flow"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "packaging recorded by count"
      rule: "packaging mass = package count × verified unit mass, separated by material and packaging level"
      inputs:
        - cp_packaging_records
      output: "kg packaging material per reference flow"
      source_ids: []
    - id: calc_shared_utility_allocation
      applies_to: "shared meters and common equipment"
      rule: "allocated quantity = reconciled shared quantity × documented causal-driver share; prefer direct metering, machine time, cycle occupancy or test time and use mass only when mass drives consumption"
      inputs:
        - "utility protocols"
        - "production or equipment logs"
      output: "carrier-specific allocated quantity per reference flow"
      source_ids:
        - ghg-protocol-product-standard
    - id: calc_direct_release
      applies_to: "calculated direct emissions"
      rule: "released mass = collected activity × cited substance-specific factor × (1 − measured capture or recovery fraction); preserve factor source and all input units"
      inputs:
        - cp_direct_emission_records
      output: "kg substance to the declared compartment per reference flow"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "each process and full foreground package"
      rule: "reconcile input mass = product outputs + waste outputs + measured elementary releases + documented stock change; investigate and disclose unresolved difference rather than forcing balance"
      inputs:
        - material
        - output
        - "waste and direct-emission protocols"
      output: "mass-balance check and unexplained difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and all batches"
      requirement: "Records must identify model, configuration, intended function, route, included accessories, sterile or non-sterile state, respiratory configuration when applicable, manufacturing site and production period."
      evidence: "controlled product specification, BOM revision, route record and release record; eu-mdr-2017; eu-ppe-2016-425-consolidated-2026"
    - id: dq_temporal_coverage
      applies_to: "foreground records"
      requirement: "Cover a representative continuous production period or all batches in the declared campaign; disclose start, end, shutdowns, abnormal batches and seasonal or campaign limitations."
      evidence: "dated meter, production, inventory and waste records"
    - id: dq_completeness
      applies_to: "all included processes and flows"
      requirement: "Reconcile BOM, utility, treatment, testing, output and waste records; document missing flows, excluded sites and unresolved mass-balance differences."
      evidence: "completeness checklist, mass reconciliation and exclusion log"
    - id: dq_measurement
      applies_to: "mass, energy, gas, water and release measurements"
      requirement: "Use calibrated or verified instruments with the resolution and range suitable for the recorded quantity; retain the meter basis and any temperature or pressure condition for gas volume."
      evidence: "calibration certificate, meter id and measurement record"
    - id: dq_supplier_upstream
      applies_to: "purchased materials, components and outsourced services"
      requirement: "Use upstream datasets matching actual material or component identity, supplier technology, geography and period where available; disclose proxy use and its limitation."
      evidence: "supplier specification, purchase record, dataset metadata and eu-pef-2021 data-quality assessment"
    - id: dq_factor_traceability
      applies_to: "calculated releases or utility conversions"
      requirement: "Every non-physical factor must have a named source, applicable technology and period, original unit and calculation trail; unsupported default factors are not permitted."
      evidence: "factor source and reviewed calculation worksheet"
    - id: dq_allocation
      applies_to: "shared processes and utilities"
      requirement: "Retain the unallocated total, allocation driver, factor, period, affected outputs and sensitivity or justification for any non-physical basis."
      evidence: "meter total, production driver record and allocation worksheet; ghg-protocol-product-standard"
    - id: dq_representativeness
      applies_to: "complete dataset"
      requirement: "Assess and disclose technological, geographical and time-related representativeness, completeness and precision for significant processes."
      evidence: "data-quality assessment and improvement log; eu-pef-2021; ghg-protocol-product-standard"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category and reference flow"
    rule: "The declared product must fall within Section 2, must not be a simple protective mask excluded by CPC 48160, and must use exact flow de3969a1-8fd2-433a-979d-176043362c2e with Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66 and unit kg."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference product metadata"
    rule: "All Required qualifiers applicable to the model and route must be present; non-applicability must be explicit rather than blank."
    source_ids:
      - eu-mdr-2017
      - eu-ppe-2016-425-consolidated-2026
  - rule_id: validate_reference_mass
    applies_to: "quantitative reference"
    rule: "Conforming finished apparatus output must equal exactly 1 kg after normalisation, and packaging mass must remain outside the net reference amount."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "foreground system boundary"
    rule: "assembly_integration and final_testing_packaging must be present; each actual component-preparation or cleaning, disinfection or sterilisation route must be included or represented by an upstream purchased service with documented site and dataset."
    source_ids:
      - eu-mdr-2017
      - eu-pef-2021
  - rule_id: validate_inventory_production
    applies_to: "all non-reference inventory rows"
    rule: "Each amount must derive from a named collection protocol or a transparent calculation from collected records; category-level default quantities and uncited emission factors are rejected."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: validate_respiratory_route
    applies_to: "breathing appliances and gas masks"
    rule: "The dataset must distinguish filtration of polluted air from external breathable-air or gas supply and must identify replaceable filter and oxygen-deficient-atmosphere applicability."
    source_ids:
      - eu-ppe-2016-425-consolidated-2026
  - rule_id: validate_treatment_route
    applies_to: "sterile, disinfected or cleaned apparatus"
    rule: "The treatment route, validated method, load basis, treatment media, accepted output and treatment wastes or releases must be present when the product claims the corresponding state."
    source_ids:
      - eu-mdr-2017
  - rule_id: validate_allocation
    applies_to: "shared process burdens"
    rule: "Allocation must follow Section 7 and disclose total, driver, factor and affected products; unsupported economic allocation or undisclosed recycling credit fails validation."
    source_ids:
      - ghg-protocol-product-standard
      - eu-pef-2021
  - rule_id: validate_data_quality
    applies_to: "complete foreground package"
    rule: "Temporal coverage, completeness, measurement evidence, upstream representativeness, factor traceability and unresolved gaps must be disclosed; an unreported data gap makes validation inconclusive."
    source_ids:
      - eu-pef-2021
      - ghg-protocol-product-standard
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "cradle-to-gate modelling of a matching apparatus model, configuration, production route, treatment state, respiratory mode, geography, period and factory-gate condition"
  excluded_use: "category-average environmental claims; comparisons of different therapeutic or protective functions; simple protective masks excluded by CPC 48160; use-phase, maintenance or end-of-life claims without separately modelled scenarios; substitution for a different sterile, filter, gas-supply, electrical or reusable configuration"
  required_metadata: "PCR id; reference flow UUID; model and configuration; intended function; net product mass; included accessories; reusable or single-use status; service life or cycle basis; sterile and cleaning state; filtration or supplied-air or gas mode; packaging configuration; route and outsourced steps; manufacturing sites and geography; production period; allocation methods; upstream dataset identities"
  required_quality_disclosure: "collection-protocol coverage; meter and scale quality; BOM and output reconciliation; mass-balance difference; data gaps and proxies; allocation basis; technological, geographical and temporal representativeness; completeness and precision; treatment and final-test evidence where applicable"
  update_trigger: "change in model or configuration, intended function, material or BOM, operating principle, filter or gas-supply mode, sterile state or treatment method, manufacturing or supplier route, site or geography, packaging, allocation basis, upstream dataset, production period, service-life assumption or material data-quality finding"
data_sources:
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission, Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint method, https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32021H2279 (retrieved 2026-08-10)"
    used_for: "functional-unit fields; supply-chain system-boundary logic; company-specific data; process and data-quality requirements; disclosure of exclusions and downstream stages"
