system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "cradle-to-factory-gate foreground package"
      rule: "Include all actual on-site and directly controlled processes from received inputs through conforming tested and packaged apparatus; link purchased inputs to upstream datasets and justify every exclusion."
      source_ids:
        - eu-pef-2021
        - ghg-protocol-product-standard
    - rule_id: sb_route_specificity
      applies_to: "model and production route"
      rule: "Include only route steps that actually occur, but do not omit a material process because it is outsourced; outsourced preparation, treatment or testing remains represented through a purchased service or upstream dataset."
      source_ids:
        - eu-mdr-2017
        - eu-pef-2021
    - rule_id: sb_treatment_controls
      applies_to: "cleaning, disinfection, sterilisation and gas-contact processing"
      rule: "Include treatment media, energy, water, cycle losses, residual handling and validation-related rejects whenever the declared product route uses the treatment."
      source_ids:
        - eu-mdr-2017
    - rule_id: sb_respiratory_configuration
      applies_to: "gas masks and other breathing appliances"
      rule: "Distinguish filtered polluted air from externally supplied breathable air, and disclose replaceable filter, supplied-air, supplied-gas and oxygen-deficient-atmosphere applicability; never use one configuration as an undeclared proxy for another."
      source_ids:
        - eu-ppe-2016-425-consolidated-2026
    - rule_id: sb_downstream_separation
      applies_to: "distribution, installation, use, maintenance and end-of-life"
      rule: "Exclude downstream stages from this foreground production package while clearly disclosing the exclusion; a full product study must add the applicable stages and scenarios separately."
      source_ids:
        - iec-60601-1-9-2007
        - eu-pef-2021
