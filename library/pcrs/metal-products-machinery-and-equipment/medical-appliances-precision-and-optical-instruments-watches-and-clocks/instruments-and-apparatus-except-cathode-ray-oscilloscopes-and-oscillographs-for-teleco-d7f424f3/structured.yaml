allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared assembly and test operations"
    rule: "Subdivide or meter product families and process areas before allocation whenever records permit."
    source_ids: []
  - rule_id: allocation_mass_or_time
    applies_to: "residual shared burdens"
    rule: "Allocate residual material-handling burdens by net accepted product mass and equipment or test-bench electricity by measured operating time or energy; disclose the selected driver and sensitivity."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework and rejects"
    rule: "Assign rework materials, energy and waste to the production batch that generated them; do not credit rejected product as accepted output."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "recyclable solder and electronic waste"
    rule: "Report the physical waste leaving the foreground and its destination. Apply recycling credits only in a downstream model with the chosen modelling convention disclosed; do not subtract unverified credits from foreground inventory."
    source_ids:
      - oecd-electronics-chemicals-2014
      - us-epa-electronics-sector-1995
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_material_mass
      process_id: "final_assembly"
      flow_role: "purchased components"
      record_type: "receiving and bill-of-material records"
      raw_fields: "part number; installed quantity; unit mass; rejects; returns"
      collection_method: "Reconcile approved bill of materials with receiving and production records; verify representative unit masses."
      unit: "kg"
      frequency: "per model and batch"
      temporal_coverage: "representative consecutive production period, normally at least one complete reporting year when available"
      site_scope: "all final-assembly lines in scope"
      aggregation_rule: "Sum installed and rejected mass by part, then normalize to assembled output."
      quality_evidence: "controlled BOM revision; scale record or supplier mass; reconciliation"
    - protocol_id: cp_solder_material_balance
      process_id: "final_assembly"
      flow_role: "solder input and dross"
      record_type: "material issue, return and waste records"
      raw_fields: "opening stock; receipts; issues; returns; closing stock; dross mass"
      collection_method: "Reconcile material inventory over the reporting period and cross-check dross manifests."
      unit: "kg"
      frequency: "monthly and reporting-period total"
      temporal_coverage: "same period as output"
      site_scope: "all soldering and rework stations in scope"
      aggregation_rule: "Net solder use = opening + receipts - closing - transfers out; report dross separately."
      quality_evidence: "inventory ledger; calibrated scale; waste manifest"
    - protocol_id: cp_solvent_mass_balance
      process_id: "final_assembly"
      flow_role: "isopropanol input, spent waste and air release"
      record_type: "purchase, stock, recovery, waste and emission records"
      raw_fields: "opening stock; receipts; closing stock; transfers; recovered solvent; spent solvent; measured air release"
      collection_method: "Reconcile all isopropanol pathways over one consistent period; quantify or explain residual uncertainty."
      unit: "kg"
      frequency: "monthly and reporting-period total"
      temporal_coverage: "same period as output"
      site_scope: "all cleaning stations, storage and abatement in scope"
      aggregation_rule: "Input = recovery + spent waste + air release + inventory change + documented residual."
      quality_evidence: "inventory ledger; waste manifest; abatement record; measurement or balance calculation"
    - protocol_id: cp_electricity_by_process
      process_id: "final_assembly_calibration_test"
      flow_role: "electricity"
      record_type: "meter and equipment runtime records"
      raw_fields: "meter start/end; kWh; equipment; runtime; standby; batch output"
      collection_method: "Prefer submetering; otherwise allocate a documented area meter using measured equipment power and runtime."
      unit: "kWh and MJ"
      frequency: "per batch with monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "assembly and test areas in scope"
      aggregation_rule: "Convert kWh to MJ and normalize separately for assembly and calibration/test outputs."
      quality_evidence: "meter identifier; calibration status; runtime log; allocation worksheet"
    - protocol_id: cp_intermediate_transfer_mass
      process_id: "final_assembly_calibration_test_final_packaging"
      flow_role: "internal intermediates"
      record_type: "production transfer and work-in-progress records"
      raw_fields: "quantity; unit mass; transfer status; rejects; opening/closing WIP"
      collection_method: "Reconcile transfers between processes without counting the same physical instrument twice."
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "same period as output"
      site_scope: "all included process steps"
      aggregation_rule: "Output of the sending process equals input to the receiving process after WIP reconciliation."
      quality_evidence: "transfer record; scale or approved unit mass; WIP reconciliation"
    - protocol_id: cp_waste_manifest
      process_id: "final_assembly"
      flow_role: "electronic and solder waste"
      record_type: "waste weighing and shipment records"
      raw_fields: "waste type; gross/tare/net mass; date; destination; treatment; hazardous code"
      collection_method: "Segregate each waste type and retain transporter or treatment records."
      unit: "kg"
      frequency: "each shipment with reporting-period total"
      temporal_coverage: "same period as output"
      site_scope: "all included assembly and rework stations"
