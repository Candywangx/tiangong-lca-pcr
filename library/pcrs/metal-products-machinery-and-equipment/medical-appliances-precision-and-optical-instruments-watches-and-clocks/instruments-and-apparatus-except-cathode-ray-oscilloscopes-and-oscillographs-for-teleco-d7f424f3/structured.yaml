validation_rules:
  - rule_id: validate_reference_output
    applies_to: "finished output"
    rule: "Confirm exactly 1 kg net accepted CPC 48244 instrument output, excluding transport packaging, with all required qualifiers disclosed."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_product_exclusions
    applies_to: "product identity"
    rule: "Reject datasets whose primary product is a cathode-ray oscilloscope/oscillograph, general-purpose electrical meter, communications service, transmission/reception apparatus, test fixture or separately sold part."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_transfer_balance
    applies_to: "internal intermediates"
    rule: "Confirm sending-process output and receiving-process input agree after documented work-in-progress reconciliation."
    source_ids: []
  - rule_id: validate_solvent_balance
    applies_to: "conditional isopropanol route"
    rule: "When cleaning occurs, require input, recovery, spent-waste and air-release records on one period and explain any material balance residual."
    source_ids:
      - oecd-electronics-chemicals-2014
  - rule_id: validate_waste_atomicity
    applies_to: "waste outputs"
    rule: "Confirm populated-board waste, solder dross and spent solvent are reported separately with treatment destinations and no collection-label waste row."
    source_ids:
      - oecd-electronics-chemicals-2014
      - us-epa-electronics-sector-1995
  - rule_id: validate_range_provenance
    applies_to: "quantitative QA ranges"
    rule: "Do not apply an external range unless at least two mutually independent original-text sources have compatible boundary, functional unit and product state."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared telecommunications measuring or test instrument configuration"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate product footprints, supply-chain modelling and lifecycle models when product function, configuration, geography, technology and packaging are compatible"
  excluded_use: "Direct representation of cathode-ray oscilloscopes/oscillographs, general-purpose electrical meters, communications services, use-stage performance, maintenance, or end-of-life without added processes"
  required_metadata: "PCR id; CPC context; product model and revision; test function and measured parameter; frequency or data-rate range; accuracy and calibration status; included accessories; net and packaging mass; assembly/cleaning route; site; geography; technology; reporting period; allocation; upstream dataset choices"
  required_quality_disclosure: "Foreground coverage; meter and scale status; BOM reconciliation; internal-transfer balance; solvent balance when applicable; rejects and rework; waste destinations; proxies; exclusions; uncertainty and unresolved UUID/range evidence"
  update_trigger: "Material change in product configuration, supplier BOM, enclosure/display/power architecture, solder or cleaning technology, manufacturing site, calibration/test sequence, packaging, allocation method, or representative production period"
