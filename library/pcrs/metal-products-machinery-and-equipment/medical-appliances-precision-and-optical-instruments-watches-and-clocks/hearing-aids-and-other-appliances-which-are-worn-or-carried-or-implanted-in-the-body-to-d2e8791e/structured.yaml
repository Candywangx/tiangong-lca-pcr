        - ec-pef-2021
        - selhorst-et-al-2025-hearing-aid-lca
        - eu-mdr-2017-745
    - rule_id: boundary_conditional_life_cycle
      applies_to: "cradle-to-grave extension"
      rule: "Include distribution, use electricity, replacement consumables, maintenance, collection, dismantling, recycling, incineration, and landfill only when the declared scope includes those stages; state geography and scenario assumptions."
      source_ids:
        - ec-pef-2021
        - selhorst-et-al-2025-hearing-aid-lca
    - rule_id: boundary_sterile_device
      applies_to: "appliances supplied sterile"
      rule: "Include the validated sterilization operation and sterile-barrier packaging when the appliance is placed on the market sterile; disclose sterilization method and maintain the sterile state through the declared manufacturer-gate boundary."
      source_ids:
        - eu-mdr-2017-745
    - rule_id: boundary_no_hidden_cutoff
      applies_to: "all foreground and linked upstream processes"
      rule: "Do not omit a material, component, energy, waste, or direct emission merely because its mass is small; quantify and disclose any justified cut-off and assess electronics, batteries, precious-metal contacts, and sterile packaging explicitly."
      source_ids:
        - ec-pef-2021
        - selhorst-et-al-2025-hearing-aid-lca
