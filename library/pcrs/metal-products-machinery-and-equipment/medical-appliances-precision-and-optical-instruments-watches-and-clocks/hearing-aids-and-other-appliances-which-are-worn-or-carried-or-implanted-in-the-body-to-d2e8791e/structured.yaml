        - selhorst-et-al-2025-hearing-aid-lca
    - rule_id: boundary_required_production
      applies_to: "cradle-to-gate foreground system"
      rule: "Include component or material inputs crossing the final-manufacturing boundary, in-house forming, final assembly, testing, rejects, packaging, and applicable sterilization through release of the finished appliance at the manufacturer gate."
