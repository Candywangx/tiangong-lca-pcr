    reference: "Selhorst, R. da R.; Alves, C.; Li, C.; Silva, A. (2025), Life Cycle Assessment of Hearing Aid Devices: Environmental Impact Analysis and Improvement Opportunities, Recycling 10(6), 219, https://doi.org/10.3390/recycling10060219 (retrieved 2026-09-06)"
    used_for: "Hearing-aid-specific process decomposition and primary-data methods for BOM, component mass, manufacturing energy, packaging, distribution, use consumables, and end-of-life"
