allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared manufacturing and sterilization operations"
    rule: "Subdivide product lines, meters, work orders, and sterilization loads wherever product-specific records are available before applying allocation."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_physical_driver
    applies_to: "remaining shared energy, utilities, and rejects"
    rule: "Allocate remaining shared exchanges with a documented causal physical driver such as machine time, cycle load, or measured mass throughput; do not use revenue when a causal physical driver is available."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_conforming_output
    applies_to: "assembly and packaging"
    rule: "Normalize foreground exchanges to conforming released appliance output; include rejects in the process that generated them and do not divide burdens by total gross input."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_recycling_credit
    applies_to: "recycled content and end-of-life recovery"
    rule: "Report recycled input, treatment burdens, recovered material, and any substitution or credit method separately; do not claim avoided virgin production without a declared, consistently applied end-of-life method."
    source_ids:
      - ec-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly_bom
      process_id: "device_assembly"
      flow_role: "purchased components, installed cells, supplied cells, and finished appliance"
      record_type: "approved BOM, goods receipts, scale records, production output"
      raw_fields: "part identity, chemistry, supplier, accepted quantity, unit count, sampled unit mass, finished net mass, lot, configuration"
      collection_method: "reconcile approved BOM to receipts and calibrated weighing"
      unit: "item and kg"
      frequency: "each BOM revision and production lot"
      temporal_coverage: "representative reporting year"
      site_scope: "each reporting site and product configuration"
      aggregation_rule: "sum accepted mass and normalize to conforming net appliance mass; retain count-to-mass calculation"
      quality_evidence: "BOM revision, supplier specification, calibration record, lot reconciliation, release record"
    - protocol_id: cp_assembly_energy
      process_id: "device_assembly"
      flow_role: "assembly and test electricity"
      record_type: "submeter, machine log, production record"
      raw_fields: "meter start/end, kWh, line, machine time, conforming output mass, grid geography, voltage"
      collection_method: "read calibrated submeters or reconcile machine energy logs to utility meter"
      unit: "kWh and MJ"
      frequency: "each shift or batch"
      temporal_coverage: "representative reporting year"
      site_scope: "each assembly and test line"
      aggregation_rule: "subtract non-production periods, allocate by causal driver, convert kWh to MJ, normalize to conforming output"
      quality_evidence: "meter calibration, utility invoice reconciliation, production log"
    - protocol_id: cp_assembly_rejects
      process_id: "device_assembly"
      flow_role: "populated-board rejects and ABS scrap"
      record_type: "reject log, waste scale ticket, rework record"
      raw_fields: "material identity, gross reject mass, rework return mass, transfer mass, hazardous status, destination"
      collection_method: "reconcile quality rejects to weighed waste transfers and in-process reuse"
      unit: "kg"
      frequency: "each transfer and production lot"
      temporal_coverage: "representative reporting year"
      site_scope: "each reporting site"
      aggregation_rule: "transferred waste equals rejects minus verified rework or same-period reuse; normalize to conforming output"
      quality_evidence: "calibrated scale, transfer note, rework record, mass-balance check"
    - protocol_id: cp_packaging_bom
      process_id: "packaging"
      flow_role: "paper box and other individually added packaging"
      record_type: "packaging specification, purchase record, scale record"
      raw_fields: "component identity, material, unit mass, units per sales unit, recycled content, print specification"
      collection_method: "weigh a documented sample and reconcile use to packed sales units"
      unit: "item and kg"
      frequency: "each packaging revision and production lot"
      temporal_coverage: "representative reporting year"
      site_scope: "each packing site and sales configuration"
      aggregation_rule: "unit mass times units used, normalized to declared appliance sales unit"
      quality_evidence: "packaging drawing, sample record, scale calibration, packed-unit reconciliation"
    - protocol_id: cp_sterilization_records
      process_id: "sterilization"
      flow_role: "sterilant, electricity, and direct ethylene oxide release"
      record_type: "cycle batch record, chemical issue record, electricity meter, continuous or batch emission monitoring"
      raw_fields: "cycle id, load mass, released product mass, sterilant charged and recovered, kWh, stack flow, concentration, fugitive estimate, abatement status"
      collection_method: "reconcile validated cycle records, meters, chemical inventory, and post-abatement monitoring"
      unit: "kg and kWh"
      frequency: "every cycle; emissions at permit or validated monitoring frequency"
      temporal_coverage: "representative reporting year"
      site_scope: "each sterilization and abatement system"
      aggregation_rule: "aggregate complete cycles and normalize to released sterile output; keep stack and fugitive releases explicit"
      quality_evidence: "sterilization validation, batch release, meter calibration, chemical mass balance, monitoring report"
    - protocol_id: cp_use_scenario
      process_id: "use_and_maintenance"
      flow_role: "charging electricity, replacement cells, and spent cells"
      record_type: "product test, charger measurement, service-life record, replacement log or declared scenario"
      raw_fields: "appliance count, operating hours, charge energy, charger loss boundary, charge cycles, cell chemistry, replacement count, unit mass, service life, geography"
      collection_method: "use product-specific tests or documented user/maintenance records; identify scenario data separately"
      unit: "item, kWh, MJ, kg, hour, year"
      frequency: "each test or maintenance event"
      temporal_coverage: "declared expected service life"
      site_scope: "declared user geography and appliance configuration"
      aggregation_rule: "scale measured per-cycle exchanges by documented cycles and appliance count; reconcile supplied and spent disposable cells"
      quality_evidence: "test report, charger meter calibration, service-life statement, replacement record, scenario justification"
    - protocol_id: cp_end_of_life_records
      process_id: "end_of_life"
      flow_role: "used appliance collection"
      record_type: "collection receipt, scale record, dismantling record"
      raw_fields: "appliance subtype, configuration, gross mass, removed cell mass, collection geography, destination, treatment route"
      collection_method: "weigh collected appliances and separately removed cells at custody transfer"
      unit: "kg"
      frequency: "each collection or transfer"
      temporal_coverage: "declared end-of-life scenario period"
      site_scope: "each collection geography and route"
      aggregation_rule: "aggregate appliance mass net of separately recorded cells and normalize to appliances reaching end-of-life"
      quality_evidence: "calibrated scale, chain-of-custody record, treatment acceptance record"
  calculation_rules:
    - id: calc_count_to_mass
      applies_to: "component, packaging, and cell rows using item records"
      rule: "mass_kg = accepted_or_used_item_count × measured_mean_unit_mass_kg; sample and configuration must match the reporting product"
      inputs:
        - "item count"
        - "product-specific unit-mass sample"
      output: "component mass in kg per reference flow"
      source_ids:
        - ec-pef-2021
    - id: calc_shared_energy
      applies_to: "assembly or sterilization energy not directly metered by product"
      rule: "product_energy_MJ = shared_energy_kWh × 3.6 × product_causal_driver / total_causal_driver"
      inputs:
        - "shared meter reading"
        - "machine time or cycle load"
        - "conforming output"
      output: "allocated MJ per reference flow or process output"
      source_ids:
        - ec-pef-2021
    - id: calc_ethylene_oxide_release
      applies_to: "direct ethylene oxide emission to air"
      rule: "released_mass = integrated post-abatement concentration × dry gas volume + documented fugitive release; use consistent temperature and pressure reference conditions"
      inputs:
        - concentration
        - "gas flow or volume"
        - "monitoring interval"
        - "fugitive estimate"
      output: "kg ethylene oxide to air per sterile process output"
      source_ids:
        - eu-mdr-2017-745
    - id: calc_use_electricity
      applies_to: "rechargeable appliance use"
      rule: "lifetime_electricity_MJ = measured_charge_energy_kWh × charge_cycles × appliance_count × 3.6"
      inputs:
        - "measured energy per charge"
        - cycles
        - count
        - "service life"
      output: "MJ electricity per declared service-life functional unit"
      source_ids:
        - selhorst-et-al-2025-hearing-aid-lca
    - id: calc_replacement_cells
      applies_to: "disposable zinc-air cell use"
      rule: "supplied_or_spent_mass_kg = documented_cell_count × product-specific_measured_unit_mass_kg"
      inputs:
        - "cell count"
        - "unit mass"
        - "appliance count"
        - "service life"
      output: "kg cells per declared service-life functional unit"
      source_ids:
        - selhorst-et-al-2025-hearing-aid-lca
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all inventory rows"
      requirement: "Match product subtype, chemical identity, flow type, product state, property, and unit; do not replace unresolved exact identities with broad or related flows."
      evidence: "approved BOM, supplier specification, TianGong state-100 UUID audit, unresolved-flow register"
    - id: dq_mass_balance
      applies_to: "assembly, packaging, and end-of-life"
      requirement: "Reconcile accepted material and component mass to conforming output, returned material, rework, rejects, packaging, and transferred waste for the same period."
      evidence: "signed mass-balance worksheet, calibrated scale records, transfer notes"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative continuous 12-month period where available; otherwise disclose the shorter period, seasonality, campaigns, and extrapolation."
      evidence: "dated meter extracts, production calendar, invoices, batch logs"
    - id: dq_technology
      applies_to: "assembly, sterilization, power system, and use"
      requirement: "Record product configuration, BOM revision, cell chemistry, manufacturing line, sterilization route and abatement, charger technology, and duty cycle; do not combine incompatible technologies without weighted records."
      evidence: "engineering change record, process specification, validation report, product test"
    - id: dq_geography
      applies_to: "electricity, supply chain, use, and end-of-life"
      requirement: "State manufacturer site, grid mix geography, supplier geography where known, sale/use geography, and end-of-life route geography."
      evidence: "site metadata, utility contract, supplier declaration, scenario record"
    - id: dq_completeness
      applies_to: "all inventory"
      requirement: "Screen the complete product-specific BOM and all foreground meters, chemicals, direct emissions, rejects, packaging, accessories, and conditional stages; quantify and justify exclusions."
      evidence: "completeness checklist cross-referenced to BOM, meters, permits, and waste register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category and reference flow"
    rule: "Confirm the declared product is a finished worn, carried, or implantable compensatory appliance and that the reference UUID, mass property, and kg unit are unchanged."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_qualifiers
    applies_to: "foreground data package"
    rule: "Fail completeness when appliance subtype, intended purpose, active/passive state, worn/carried/implantable state, unit count, mass, configuration, power chemistry, sterile state, geography, service life, or boundary is missing."
    source_ids:
      - eu-mdr-2017-745
      - ec-pef-2021
  - rule_id: validate_bom
    applies_to: "production inventory"
    rule: "Confirm every BOM component and every packaging item is represented by an atomic inventory row or a disclosed, quantified exclusion; verify that included accessories are not hidden in the reference-product mass."
    source_ids:
      - ec-pef-2021
      - selhorst-et-al-2025-hearing-aid-lca
  - rule_id: validate_conditions
    applies_to: "conditional rows and processes"
    rule: "Confirm that battery chemistry, silicone earpiece, ABS moulding, sterilization route, use, and end-of-life rows are included only when their explicit conditions apply and that applicable rows are not omitted."
    source_ids:
      - eu-mdr-2017-745
      - selhorst-et-al-2025-hearing-aid-lca
  - rule_id: validate_no_double_count
    applies_to: "electricity, purchased components, off-site services, and waste"
    rule: "Confirm foreground exchanges exclude burdens already embedded in linked supplier datasets and that off-site sterilization is not also represented as on-site sterilant and energy."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_allocation
    applies_to: "shared operations"
    rule: "Confirm subdivision was attempted first and every remaining allocation uses a recorded causal physical driver with numerator, denominator, and period."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_mass_balance
    applies_to: "assembly and end-of-life"
    rule: "Confirm input, conforming output, rework, reject, separately supplied accessory, packaging, and waste masses reconcile within a declared tolerance; explain any imbalance."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_range_status
    applies_to: "important inventory flows"
    rule: "Confirm foreground values come from the declared collection protocols. Treat external range evidence as unresolved until at least two independent, boundary-compatible original sources support a synthesized interval."
    source_ids:
      - ec-pef-2021
published_dataset_profile:
  dataset_role: "Product-specific foreground production dataset; conditional stage datasets may be published separately and linked"
  downstream_use: "secondary_dataset or background_dataset for a declared appliance configuration and geography; input to a lifecyclemodel only when conditional stages and reference-flow conversion are explicit"
  allowed_use: "Modelling the named appliance subtype, BOM revision, production route, sterile state, manufacturer-gate geography, power system, and declared time period; scenario-specific use or end-of-life only where those stages are included"
  excluded_use: "Generic use for unrepresented appliance subtypes, implantable versus non-implantable substitution, different battery chemistry, different sterile state, or comparative claims without equivalent function, service life, boundary, and data quality"
  required_metadata: "canonical PCR id; product and reference-flow UUIDs; appliance subtype and intended purpose; active/passive and worn/carried/implantable state; unit count and net mass; BOM revision; configuration and accessories; power chemistry; sterile state and method; site and market geography; technology; reporting period; service life; boundary; allocation; cut-offs; background dataset versions"
  required_quality_disclosure: "primary-data share; meter and mass coverage; BOM completeness; unresolved UUIDs; proxy datasets; allocation drivers; mass-balance result; temporal, technological, and geographic representativeness; excluded flows and stages; uncertainty; range-evidence gaps"
  update_trigger: "Change in intended purpose, product subtype, BOM or accessory configuration, cell chemistry, housing material, electronic module, assembly line, sterilization route or abatement, packaging, supplier geography, grid mix, service-life claim, use scenario, end-of-life route, or evidence that materially changes inventory results"
