allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "multi-product manufacturing"
    rule: "Prefer subdivision, lot tracing, machine time, material issues, and dedicated meters so the declared part receives directly attributable inputs and outputs."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "unavoidable shared utilities and support operations"
    rule: "Use a causal physical driver such as measured machine-hours, bath loading area-time, or metered throughput. Mass allocation is allowed only when the same operation and material state make mass causal; disclose the driver and test sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "post-industrial scrap and recovered materials"
    rule: "Treat process scrap as a waste output at the foreground gate. Do not subtract avoided primary production or recycling credit inside the inventory; any end-of-life or substitution modelling shall be reported separately."
    source_ids: []
  - rule_id: allocation_no_value_default
    applies_to: "valuable parts or by-products"
    rule: "Economic allocation is not the default. If physical causality cannot be established and economic allocation is used, disclose prices, period, currency, allocation share, and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issues
      process_id: "part_manufacture_release"
      flow_role: "stainless-steel stock; synthetic-ruby blanks"
      record_type: "purchase, receiving, stores issue, return, and bill-of-material records"
      raw_fields: "material identity; alloy or grade; stock form; supplier; batch; gross issue; returned quantity; recycled content"
      collection_method: "Reconcile receiving and stores movements to production orders and inventory change"
      unit: "kg"
      frequency: "per issue and monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or all lots in a shorter declared campaign"
      site_scope: "All manufacturing sites in the dataset"
      aggregation_rule: "Sum net issues by atomic material and divide by conforming saleable output"
      quality_evidence: "Purchase specification, receiving inspection, calibrated scale records, and inventory reconciliation"
    - protocol_id: cp_utility_meters
      process_id: "part_manufacture_release"
      flow_role: "electricity; process water"
      record_type: "utility meters, submeter logs, and production timestamps"
      raw_fields: "opening and closing readings; meter id; unit; route equipment; production order; allocation driver"
      collection_method: "Read dedicated meters or allocate shared meters using documented machine-hours or throughput"
      unit: "kWh; m3; kg"
      frequency: "per batch or shift, aggregated monthly"
      temporal_coverage: "Same period as represented production"
      site_scope: "All attributable equipment and on-site controls"
      aggregation_rule: "Subtract baselines, allocate shared use, convert units, and divide by conforming saleable output"
      quality_evidence: "Meter calibration, bills, time logs, and reconciliation to facility totals"
    - protocol_id: cp_chemical_records
      process_id: "part_manufacture_release"
      flow_role: "sodium hydroxide; chromium trioxide; cutting fluid"
      record_type: "purchase, batch make-up, issue, concentration, recovery, and stock records"
      raw_fields: "chemical identity; concentration; issued quantity; returned or recovered quantity; opening and closing stock; bath or machine id"
      collection_method: "Reconcile net consumption by chemical and convert formulated product to declared pure-substance basis only where required"
      unit: "kg"
      frequency: "per addition and monthly reconciliation"
      temporal_coverage: "Same period as represented production"
      site_scope: "All applicable baths and machining equipment"
      aggregation_rule: "Net additions plus opening stock minus closing stock and recovery, divided by conforming saleable output"
      quality_evidence: "Supplier certificate, concentration test, issue log, stock reconciliation, and scale calibration"
    - protocol_id: cp_product_output
      process_id: "part_manufacture_release"
      flow_role: "conforming finished part"
      record_type: "production order, inspection, reject, rework, and dispatch records"
      raw_fields: "part identity; lot; gross output; reject mass; rework return; conforming released mass"
      collection_method: "Weigh or count released parts and convert counts using count_to_mass"
      unit: "kg; item"
      frequency: "per lot"
      temporal_coverage: "Same period as all inputs and outputs"
      site_scope: "All represented production lines and sites"
      aggregation_rule: "Sum conforming released mass only; use it as normalization denominator"
      quality_evidence: "Release certificate, inspection record, scale calibration, and count-to-mass sample"
    - protocol_id: cp_waste_shipments
      process_id: "part_manufacture_release"
      flow_role: "post-industrial steel scrap; waste cutting oil"
      record_type: "waste container weights, manifests, recycler receipts, and inventory records"
      raw_fields: "waste identity; source operation; gross and tare mass; moisture or contamination; destination; opening and closing stored mass"
      collection_method: "Weigh each outbound container and reconcile stored waste"
      unit: "kg"
      frequency: "per shipment and monthly inventory"
      temporal_coverage: "Same period as represented production"
      site_scope: "All represented production lines and waste storage"
      aggregation_rule: "Shipments plus closing stored mass minus opening stored mass, divided by conforming saleable output"
      quality_evidence: "Calibrated scale ticket, waste manifest, composition evidence, and recycler receipt"
    - protocol_id: cp_liquid_waste
      process_id: "part_manufacture_release"
      flow_role: "metal-bearing surface-treatment wastewater"
      record_type: "effluent meter, tank transfer, laboratory, and treatment records"
      raw_fields: "flow or transferred volume; density; metal species and concentration; bath origin; treatment route; recirculation"
      collection_method: "Meter discharge or reconcile tank transfers; convert volume to mass and exclude internal recirculation"
      unit: "m3; kg; mg/L"
      frequency: "per discharge or continuously, aggregated monthly"
      temporal_coverage: "Same period as represented production"
      site_scope: "All applicable surface-treatment lines and treatment units"
      aggregation_rule: "Sum net boundary-crossing discharge mass and divide by conforming saleable output"
      quality_evidence: "Meter calibration, tank gauge record, laboratory chain of custody, and treatment manifest"
    - protocol_id: cp_air_emissions
      process_id: "part_manufacture_release"
      flow_role: "chromium(VI) air emission"
      record_type: "stack test, continuous or periodic measurement, bath operation, control-device, and production records"
      raw_fields: "chromium(VI) concentration; gas flow; test duration; control status; bath current-time; represented output; release compartment"
      collection_method: "Use compliant site measurements where available; otherwise use a disclosed bath-specific mass balance and flag the estimation method"
      unit: "kg; mg/m3; m3/h"
      frequency: "each required test and each operating period represented"
      temporal_coverage: "Same production period or a justified representative test period"
      site_scope: "Every applicable hexavalent-chromium source and control device"
      aggregation_rule: "Integrate measured release over operating time and divide by conforming saleable output"
      quality_evidence: "Test report, method, detection limit, instrument calibration, operating log, and control inspection"
  calculation_rules:
    - id: calc_normalization
      applies_to: "all inventory rows"
      rule: "Normalized amount = boundary-crossing amount attributable to represented lots / conforming released product mass"
      inputs:
        - "Attributable flow amount"
        - "conforming released mass"
      output: "Flow amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity"
      rule: "Electricity (MJ) = metered electricity (kWh) × 3.6"
      inputs:
        - "Metered kWh"
      output: "MJ"
