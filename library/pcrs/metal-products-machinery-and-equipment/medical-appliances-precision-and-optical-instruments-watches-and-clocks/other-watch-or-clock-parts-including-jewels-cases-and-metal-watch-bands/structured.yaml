  - rule_id: validate_inventory_accounting
    applies_to: "inventory completeness"
    rule: "Confirm that every boundary-crossing material, chemical, utility, waste, and direct elementary exchange is atomic, has one direction and flow type, and is normalized to the same conforming-output mass."
    source_ids: []
  - rule_id: validate_conditional_routes
    applies_to: "conditional rows"
    rule: "Verify each conditional row against the declared bill of materials and route; require an amount when applicable and a documented not-applicable reason when absent."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "material conversion"
    rule: "Reconcile material inputs with conforming output, scrap, liquid wastes, direct releases, stock change, and documented measurement uncertainty; investigate unexplained gaps."
    source_ids: []
  - rule_id: validate_surface_treatment
    applies_to: "aqueous or electrolytic treatment"
    rule: "When surface treatment is used, verify bath chemistry, water, electricity, wastewater, treatment residues, and measured or calculated direct emissions against operating and control records."
