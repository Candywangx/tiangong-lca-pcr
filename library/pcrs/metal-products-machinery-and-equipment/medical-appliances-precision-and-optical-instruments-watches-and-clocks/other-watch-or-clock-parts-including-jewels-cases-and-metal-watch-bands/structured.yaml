system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include receipt of production materials at the foreground gate; forming, cutting, machining, grinding, polishing, drilling, jewel shaping, cleaning, rinsing, surface treatment, coating, inspection, rework, and on-site treatment when performed for the declared part; direct utilities; direct wastes; and direct elementary emissions. The precise route is configuration-specific. Aqueous chemical or electrolytic surface treatment is conditional and shall include its material, water, power, waste, and emission exchanges when operated (eu-jrc-stm-bref-2006, us-epa-ap42-electroplating-12-20)."
      source_ids: []
    - rule_id: boundary_foreground_operations
      applies_to: "foreground manufacturing"
      rule: "Include every on-site operation from receipt of production stock through release of the saleable part, including rework and on-site waste or emission controls attributable to the product."
      source_ids: []
    - rule_id: boundary_surface_treatment
      applies_to: "aqueous chemical or electrolytic surface treatment"
      rule: "Include cleaning, rinsing, rectifier electricity, bath make-up chemicals, drag-out or bath losses, wastewater, treatment residues, and direct mists when the declared route uses them."
      source_ids:
        - eu-jrc-stm-bref-2006
        - us-epa-ap42-electroplating-12-20
    - rule_id: boundary_exclusions
      applies_to: "downstream stages"
      rule: "Exclude assembly into a complete movement, watch, or clock; distribution; use; maintenance; and end-of-life unless the study explicitly extends the system and reports those additions separately."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased production stock and chemicals delivered to the manufacturing-site gate, with material grade, stock form, supplier geography, recycled content, and delivery state declared"
  starting_condition_role: "Foreground gate for part manufacture; upstream extraction, refining, alloy production, synthetic-corundum production, chemical production, and energy supply remain in linked upstream datasets"
  product_classification_scope: "Separately marketable watch or clock parts within the semantic boundary of CPC 48490; classification is mapping context rather than canonical PCR identity"
  recursive_input_rule: "If a purchased input is itself a finished part within this PCR boundary, record it as a product input with its own upstream dataset and do not recursively remodel its manufacture in the same foreground process"
  upstream_dataset_requirement: "Each purchased material, chemical, electricity, and water input shall link to a geographically and technologically representative upstream dataset; proxies require explicit disclosure and sensitivity review"
  disclosure: "Declare part type, bill of materials, alloy or synthetic-jewel grade, route steps, surface-treatment chemistry, rework, yield, subcontracted operations, waste treatment, air-release compartment, site geography, production period, and packaging exclusions"
