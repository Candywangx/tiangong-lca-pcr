system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The cradle-to-gate model includes upstream production of inventoried materials, components, electricity and sales packaging plus foreground fabrication, assembly, adjustment, performance testing and packaging. Supplier processes are represented by compatible upstream datasets. Direct facility exchanges are not duplicated in supplier datasets."
      source_ids: []
    - rule_id: boundary_rule_1
      applies_to: "cradle_to_gate_model"
      rule: "Include upstream production of every inventoried material, component, electricity and packaging input plus foreground fabrication, assembly, adjustment, testing and packaging through the accepted factory-gate output."
      source_ids:
        - un-cpc-3-0-structure-2025
        - mettler-toledo-me-reference-manual
    - rule_id: boundary_rule_2
      applies_to: "route_specific_operations"
      rule: "Include an in-house fabrication operation only when it is performed by the reporting site; otherwise represent the received component with a compatible supplier dataset and prevent double counting of its constituent material route."
      source_ids: []
    - rule_id: boundary_rule_3
      applies_to: "extended_modules"
      rule: "Report use, maintenance, calibration services, distribution and end-of-life separately when brought into scope; they are not part of this cradle-to-gate reference result."
      source_ids: []
    - rule_id: boundary_rule_4
      applies_to: "metrological_identity"
      rule: "Retain evidence that the output satisfies the 5 cg-or-better identity and distinguish sensitivity from discrimination, repeatability and warm-up characteristics."
      source_ids:
        - oiml-r76-1-2006
boundary_abstraction:
  declared_starting_condition: "Product-specific bill of materials and supplier component states at receipt, together with site utility and waste records for the manufacturing period"
  starting_condition_role: "Primary foreground evidence for the aggregated cradle-to-gate manufacturing model"
  product_classification_scope: "Complete balances within this PCR; separately sold parts, accessories, weights and other weighing machinery remain outside this category"
  recursive_input_rule: "A same-category balance used as a test or reference instrument is capital equipment, not a consumed balance input. A balance incorporated for resale must be disclosed and represented by a separate upstream dataset rather than recursively applying this PCR inside the same foreground process."
  upstream_dataset_requirement: "Each purchased material or component requires a geographically and technologically representative upstream dataset matching composition and product state; component datasets must not double count material production already decomposed in the bill of materials."
  disclosure: "Declare foreground sites, supplier-versus-in-house fabrication split, sensing technology, product and packaging mass, sensitivity basis, included accessories, allocation choices, electricity geography, data year, cut-offs and any extended life-cycle modules."
