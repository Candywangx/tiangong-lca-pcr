allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_subdivision"
    rule: "Prefer subdivision and direct metering for balance models, fabrication cells and acceptance-test stations before applying allocation."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "shared_site_electricity_and_waste"
    rule: "When direct metering is unavailable, allocate shared electricity and waste using a documented causal driver such as machine time, tested-unit time or measured mass throughput; accepted-unit count may be used only when product models have comparable resource intensity."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "scrap_and_recycling"
    rule: "Report scrap mass and receiving route explicitly. Do not subtract avoided virgin production or assign a recycling credit unless the chosen study method requires it and the allocation method is declared consistently."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "rejected_and_reworked_units"
    rule: "Exclude rejected units from the reference denominator; retain their attributable materials, electricity and waste in the foreground totals. Reworked units contribute only incremental rework burdens before acceptance."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_packaging
      process_id: "balance_manufacture"
      flow_role: "material, component and packaging inputs"
      record_type: "approved bill of materials; supplier declarations; receiving and weighing records"
      raw_fields: "model_id; supplier_part_id; material_or_component_identity; composition; quantity_per_unit; measured_mass; included_accessories; packaging_configuration; supplier_geography; product_state"
      collection_method: "Reconcile the released bill of materials to measured product and packaging mass; verify supplier composition and prevent component/material double counting"
      unit: "kg and Item(s)"
      frequency: "each engineering release and supplier change"
      temporal_coverage: "production-weighted configuration for the reporting period"
      site_scope: "all foreground product models and supplying sites in scope"
      aggregation_rule: "Sum verified input mass by atomic flow and divide by accepted balances; retain route-specific not-applicable evidence"
      quality_evidence: "signed bill-of-materials release; calibration record for scales; supplier specification; mass-reconciliation record"
    - protocol_id: cp_electricity_records
      process_id: "balance_manufacture"
      flow_role: "purchased manufacturing electricity"
      record_type: "calibrated meter, submeter and electricity-invoice records"
      raw_fields: "meter_id; opening_reading; closing_reading; unit; voltage_level; grid_supplier; production_period; machine_or_test_time; accepted_units; rejected_units"
      collection_method: "Read calibrated meters or invoices and map submetered and allocated loads to fabrication, assembly, adjustment, warm-up and testing"
      unit: "kWh or MJ"
      frequency: "monthly or production batch"
      temporal_coverage: "at least twelve representative months or the complete shorter campaign"
      site_scope: "every foreground manufacturing site"
      aggregation_rule: "Convert kWh to MJ and allocate with the declared causal driver; divide by accepted units while retaining rejected-unit burdens"
      quality_evidence: "meter calibration or invoice reconciliation; allocation-driver record; completeness check against site total"
    - protocol_id: cp_accepted_output
      process_id: "balance_manufacture"
      flow_role: "accepted balance output"
      record_type: "product specification, adjustment, acceptance-test and release records"
      raw_fields: "model_id; serial_or_lot_id; sensitivity_declaration; sensitivity_test_basis; capacity; readability_or_scale_interval; repeatability; accuracy_class_if_applicable; sensing_principle; acceptance_status; product_mass; included_accessories"
      collection_method: "Count only units released after documented adjustment and acceptance testing"
      unit: "Item(s) and kg"
      frequency: "each unit or statistically controlled lot"
      temporal_coverage: "full reporting period"
      site_scope: "every foreground assembly and release site"
      aggregation_rule: "Sum accepted units by model; production-weight model-specific inputs when reporting a family"
      quality_evidence: "traceable acceptance record; calibrated test weights; instrument test record; release authorization"
    - protocol_id: cp_waste_records
      process_id: "balance_manufacture"
      flow_role: "segregated manufacturing wastes"
      record_type: "scale tickets, waste transfer notes, recycler receipts and mass-balance records"
      raw_fields: "waste_id; material_identity; gross_mass; tare_mass; destination; treatment_route; hazardous_status; production_period; accepted_units"
      collection_method: "Use calibrated floor-scale tickets, recycler receipts or mass-balance records; keep steel, aluminium, ABS and populated PCB waste separate"
      unit: "kg"
      frequency: "each shipment with monthly reconciliation"
      temporal_coverage: "same period as production and electricity records"
      site_scope: "every foreground manufacturing site"
      aggregation_rule: "Net waste mass equals gross minus tare; allocate by direct process record or declared causal driver and divide by accepted units"
      quality_evidence: "scale calibration; waste transfer note; recycler receipt; material segregation audit"
  calculation_rules:
    - id: calc_rule_1
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period attributable amount / accepted complete balances"
      inputs:
        - "attributable input"
        - "electricity or waste amount"
        - "accepted balance count"
      output: "amount per accepted balance"
      source_ids: []
    - id: calc_rule_2
      applies_to: "electricity_input"
      rule: "electricity_MJ = metered_kWh × 3.6; then apply only the documented foreground allocation fraction"
      inputs:
        - "metered kWh"
        - "allocation driver"
        - "accepted balance count"
      output: "MJ per accepted balance"
      source_ids: []
    - id: calc_rule_3
      applies_to: "material_and_component_inputs"
      rule: "Sum net embodied material and supplier-attributed process loss once; if a complete component dataset is used, remove separately modelled constituent burdens that would duplicate it"
      inputs:
        - "bill of materials"
        - "component composition"
        - "supplier dataset boundary"
        - "route loss"
      output: "non-duplicated input mass per accepted balance"
      source_ids:
        - mettler-toledo-me-reference-manual
    - id: calc_rule_4
      applies_to: "waste_outputs"
      rule: "net waste mass = gross shipment mass - tare; normalized waste = attributable net waste / accepted balances"
      inputs:
        - "gross mass"
        - "tare mass"
        - "segregation identity"
        - "allocation driver"
        - "accepted balance count"
      output: "kg waste per accepted balance"
      source_ids: []
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "reference product"
      requirement: "Demonstrate the 5 cg-or-better sensitivity threshold and declare capacity, readability or scale interval, repeatability, sensing principle and applicable accuracy class without treating these terms as interchangeable."
      evidence: "product specification; acceptance or type-test record; un-cpc-3-0-structure-2025; oiml-r76-1-2006"
    - id: dqr_mass_completeness
      applies_to: "bill of materials and packaging"
      requirement: "Reconcile inventoried material, component and packaging mass to measured product and packaging mass; explain exclusions, coatings, fasteners, cables, power supplies, weights and accessories."
      evidence: "approved bill of materials; supplier composition; calibrated mass check; reconciliation statement"
    - id: dqr_temporal
      applies_to: "foreground activity data"
