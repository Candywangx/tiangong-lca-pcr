  market_state: "Complete tested balance in the standard sales configuration at the factory gate; product mass excludes external shipping pallet and secondary distribution packaging unless supplied as part of the sales unit"
functional_unit:
  what: "Provision of the mass-weighing function by a complete high-sensitivity balance"
  how_much: "One complete balance in the declared standard sales configuration"
  how_well: "Declared sensitivity of 5 cg (50 mg) or better; maximum capacity, readability or scale interval, repeatability, accuracy class where applicable, and supplied accessories are declared"
  how_long_or_cycle: "One manufactured and accepted unit at the factory gate; no service-life performance is implied"
