allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared_factory_processes"
    rule: "Subdivide product-specific fabrication, assembly and tests before allocating shared burdens."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "shared_electricity_water_and_gases"
    rule: "Use dedicated records first; otherwise allocate by a causal driver such as machine time, test-cycle duration or line throughput. Use mass only when no better driver exists and disclose it."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "metal_scrap_and_recovery"
    rule: "Report scrap mass and route at the factory boundary. Do not credit avoided primary metal unless the chosen background model explicitly applies and discloses that convention."
    source_ids: []
  - rule_id: allocation_reusable_packaging
    applies_to: "wooden_pallet"
    rule: "Divide pallet mass by documented expected turns adjusted for losses; if turns are unknown, assign the full pallet to the shipment."
    source_ids:
      - getinge-lancer-lss-pep-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_mass
      process_id: "sterilizer_manufacturing"
      flow_role: "mass-based BOM inputs and finished product"
      record_type: "approved BOM and issue record"
      raw_fields: "model; revision; material; purchased, issued and installed mass; net product mass; units"
      collection_method: "reconcile BOM, purchasing, issue records and product weighing"
      unit: "kg"
      frequency: "each revision and batch"
      temporal_coverage: "representative year"
      site_scope: "factory and declared suppliers"
      aggregation_rule: "atomic mass divided by total net finished mass"
      quality_evidence: "approved BOM, invoices, weigh tickets, calibration"
    - protocol_id: cp_cable_length
      process_id: "sterilizer_manufacturing"
      flow_role: "low-voltage cable"
      record_type: "cable cut list and BOM"
