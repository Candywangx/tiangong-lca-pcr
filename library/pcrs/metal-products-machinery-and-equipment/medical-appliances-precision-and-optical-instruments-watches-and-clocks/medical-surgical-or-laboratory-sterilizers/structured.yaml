      unit: "m"
      frequency: "each revision and batch"
      temporal_coverage: "representative year"
      site_scope: "factory"
      aggregation_rule: "installed length divided by net finished mass"
      quality_evidence: "approved cut list and issue record"
    - protocol_id: cp_factory_electricity
      process_id: "sterilizer_manufacturing"
      flow_role: "electricity"
      record_type: "meter and production record"
      raw_fields: "meter readings; kWh; area; test cycles; units; net mass"
      collection_method: "dedicated meter or reconciled site meter with causal allocation"
      unit: "kWh"
      frequency: "monthly"
      temporal_coverage: "one complete representative production year"
      site_scope: "included factory operations"
      aggregation_rule: "subtract excluded loads, allocate, convert to MJ and normalize"
      quality_evidence: "calibration, invoices, allocation reconciliation"
    - protocol_id: cp_factory_water
      process_id: "sterilizer_manufacturing"
      flow_role: "process water"
      record_type: "meter, batch and test record"
      raw_fields: "volume or mass; source; quality; operation; density; net mass"
      collection_method: "meter or reconcile invoices and batch records"
      unit: "kg or m3"
      frequency: "monthly and test campaign"
      temporal_coverage: "one complete representative production year"
      site_scope: "included factory operations"
      aggregation_rule: "allocate included water, convert to mass and normalize"
      quality_evidence: "calibration, invoices, batch logs, density evidence"
    - protocol_id: cp_process_gases
