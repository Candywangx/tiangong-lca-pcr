      raw_fields: "gas; purity; delivery; inventory change; job; reference conditions"
      collection_method: "reconcile supply and inventory change to jobs"
      unit: "kg or m3"
      frequency: "each delivery and batch"
      temporal_coverage: "representative year"
      site_scope: "on-site fabrication"
      aggregation_rule: "attributable consumption divided by net product mass"
      quality_evidence: "certificates, invoices, cylinder logs"
    - protocol_id: cp_packaging_mass
      process_id: "sterilizer_manufacturing"
      flow_role: "pallet and corrugated boxes"
      record_type: "specification and dispatch record"
      raw_fields: "identity; dry mass; model; units; turns; loss"
      collection_method: "weigh or verified packaging specification"
      unit: "kg"
      frequency: "each design revision and sample"
      temporal_coverage: "representative year"
