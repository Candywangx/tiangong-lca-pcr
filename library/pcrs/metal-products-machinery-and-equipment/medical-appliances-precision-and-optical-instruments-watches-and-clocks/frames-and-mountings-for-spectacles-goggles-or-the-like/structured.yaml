system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default boundary is gate-to-gate frame manufacture. It begins when purchased frame materials, miniature hardware, process chemicals, water, electricity, and packaging cross the manufacturing-site boundary and ends with conforming unglazed frames packed at the factory gate. The process includes route-specific material preparation, cutting or forming, wire straightening or swaging, machining, joining, polishing, cleaning, optional plating or varnishing, assembly, inspection, reject handling, waste segregation, and on-site emission control directly associated with production."
      source_ids: []
    - rule_id: boundary_01
      applies_to: "foreground_process"
      rule: "Include all on-site operations from receipt and storage through forming, joining, polishing, cleaning, route-specific finishing, final assembly, inspection, packing, waste handling, and directly associated emission control."
      source_ids:
        - unido-spectacle-frames-profile
    - rule_id: boundary_02
      applies_to: "conditional_routes"
      rule: "Include cellulose-acetate, nickel-silver, chromium-plating, and varnish rows only when the declared product route uses that exchange; document verified absence before using not_applicable."
      source_ids:
        - unido-spectacle-frames-profile
        - eu-jrc-stm-bref-2006
        - eu-jrc-sts-bref-2020
    - rule_id: boundary_03
      applies_to: "excluded_activities"
      rule: "Exclude final lenses, separately sold cases, retail fitting, use, repair, end-of-life, capital equipment, buildings, employee travel, and general administration unless the study goal explicitly expands the boundary."
      source_ids:
        - un-cpc-3-0-structure-2025
        - iso-12870-2024
    - rule_id: boundary_04
      applies_to: "upstream_inputs"
      rule: "Represent upstream production of purchased inputs with linked datasets rather than recreating it inside the foreground frame-production process."
      source_ids: []
