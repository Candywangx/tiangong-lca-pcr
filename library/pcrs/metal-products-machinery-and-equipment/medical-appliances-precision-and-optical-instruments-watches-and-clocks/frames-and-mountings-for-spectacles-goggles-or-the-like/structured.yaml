allocation_rules:
  - rule_id: allocation_01
    applies_to: "foreground_subdivision"
    rule: "Prefer submetering and subdivision by frame route, production line, coating system, and production campaign before allocation."
    source_ids: []
  - rule_id: allocation_02
    applies_to: "shared_materials_and_utilities"
    rule: "Allocate shared inputs by a documented causal driver: direct meter reading, consumed mass, machine operating time, bath loading, or counted units with representative unit mass. Do not allocate unused conditional-route inputs to the product."
    source_ids: []
  - rule_id: allocation_03
    applies_to: "multiple_frame_models"
    rule: "When several frame models share a process, allocate burdens using measured net output mass unless a more causal driver is documented for the affected operation. Preserve model mix and allocation totals."
    source_ids: []
  - rule_id: allocation_04
    applies_to: "scrap_and_recycling"
    rule: "Report scrap and other wastes at the foreground boundary with measured mass and destination. Do not apply avoided-burden credits inside this PCR unless the chosen LCA method explicitly requires and documents them."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "frame_production"
      flow_role: "principal frame materials"
      record_type: "purchase, stock, and return records"
      raw_fields: "material_id; grade; supplier; receipts_mass; opening_stock; closing_stock; returns_mass; route"
      collection_method: "reconcile traceable stock records with calibrated scale readings"
      unit: "kg"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope lines at the declared site"
      aggregation_rule: "receipts plus opening stock minus closing stock, returns, and transfers"
      quality_evidence: "purchase documents; stock ledger; scale calibration; material specification"
    - protocol_id: cp_component_inputs
      process_id: "frame_production"
      flow_role: "hinges and screws"
      record_type: "bill of materials, issue records, and batch-weighing records"
      raw_fields: "component_id; material; installed_count; issued_count; returned_count; sample_count; sample_mass"
      collection_method: "count installed components and convert with representative batch mass"
      unit: "count and kg"
      frequency: "each model or lot"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope models"
      aggregation_rule: "installed count multiplied by documented mean unit mass, reconciled to issues"
      quality_evidence: "bill of materials; count record; scale calibration; sampling record"
    - protocol_id: cp_finish_inputs
      process_id: "frame_production"
      flow_role: "polishing, cleaning, plating, and coating inputs"
      record_type: "issue, return, bath make-up, and formulation records"
      raw_fields: "product_id; formulation; concentration; issued_mass; returned_mass; make_up_mass; bath_id; route"
      collection_method: "weigh issued and returned product and reconcile bath additions"
      unit: "kg"
      frequency: "each issue and bath addition"
      temporal_coverage: "same period as product output"
      site_scope: "each in-scope finishing line"
      aggregation_rule: "sum net issue or pure-product-equivalent addition by chemistry"
      quality_evidence: "stock ledger; batch ticket; supplier specification; scale calibration"
    - protocol_id: cp_utilities
      process_id: "frame_production"
      flow_role: "process water and electricity"
      record_type: "meter and operating records"
      raw_fields: "meter_id; opening_reading; closing_reading; native_unit; allocation_driver; domestic_exclusion"
      collection_method: "read calibrated line meters or allocate shared meters with a documented causal driver"
      unit: "kg water and native energy unit"
      frequency: "at least monthly and at campaign boundaries"
      temporal_coverage: "representative continuous period covering the output"
      site_scope: "all in-scope production and controls"
      aggregation_rule: "meter difference minus documented exclusions, normalized to conforming output"
      quality_evidence: "meter calibration; readings; allocation worksheet; production log"
    - protocol_id: cp_packaging
      process_id: "frame_production"
      flow_role: "corrugated board boxes"
      record_type: "packaging issue and packed-batch records"
      raw_fields: "box_id; issued_count; returned_count; sample_count; sample_mass; packed_frame_count"
      collection_method: "reconcile issued boxes and batch-weigh representative boxes"
      unit: "count and kg"
      frequency: "each packaging lot"
      temporal_coverage: "same period as product output"
      site_scope: "packing operation"
      aggregation_rule: "net used count multiplied by documented mean box mass and allocated to packed frames"
      quality_evidence: "issue record; weighing record; scale calibration; packing log"
    - protocol_id: cp_output_and_rejects
      process_id: "frame_production"
      flow_role: "conforming output and final rejects"
      record_type: "production, inspection, and disposition records"
      raw_fields: "model_id; gross_mass; excluded_lens_mass; excluded_case_mass; conforming_count; conforming_net_mass; reject_count; reject_mass; disposition"
      collection_method: "weigh conforming output and segregated final rejects after inspection"
      unit: "kg and count"
      frequency: "each production lot"
      temporal_coverage: "same period as inputs"
      site_scope: "all in-scope models and lines"
      aggregation_rule: "sum conforming net mass and rejects separately; normalize inputs to conforming mass"
      quality_evidence: "inspection record; scale calibration; disposition record; applicable test report"
    - protocol_id: cp_waste_outputs
      process_id: "frame_production"
      flow_role: "segregated offcuts, scrap, polishing media, and liquid wastes"
      record_type: "container, tank, manifest, and transfer records"
      raw_fields: "waste_id; composition; source_operation; gross_mass; tare_mass; volume; density; destination; transfer_date"
      collection_method: "weigh containers or measure tank volume with contemporaneous density"
      unit: "kg; volume and density when converted"
      frequency: "each transfer, at least monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all in-scope waste collection points"
      aggregation_rule: "net transfer mass by waste identity and destination"
      quality_evidence: "scale or tank calibration; density record; waste manifest; receiving record"
    - protocol_id: cp_air_emissions
      process_id: "frame_production"
      flow_role: "NMVOC and PM0.2-PM2.5"
      record_type: "stack or room-exhaust measurements and solvent balance"
      raw_fields: "pollutant; concentration; dry_gas_volume; sampling_period; capture_mass; transferred_solvent_mass; production_mass"
      collection_method: "use site measurement for the matching compartment and size fraction; NMVOC may also use a complete solvent mass balance"
      unit: "kg and supporting concentration/volume units"
      frequency: "each required test and production period"
      temporal_coverage: "representative operating conditions in the declared period"
      site_scope: "each in-scope emission point"
      aggregation_rule: "pollutant concentration times dry gas volume, or verified solvent balance, normalized to conforming output"
      quality_evidence: "laboratory report; instrument calibration; flow measurement; solvent reconciliation; control-device record"
  calculation_rules:
    - id: calculation_01
      applies_to: "purchased material consumption"
      rule: "consumed mass = receipts + opening stock - closing stock - returns - documented outbound transfers"
      inputs:
        - "purchase and stock records"
      output: "kg consumed by row"
      source_ids: []
    - id: calculation_02
      applies_to: "counted component or box mass"
      rule: "allocated mass = installed or used count multiplied by representative mean unit mass"
      inputs:
        - counts
        - "sample count"
        - "sample mass"
      output: "kg component or packaging input"
      source_ids: []
    - id: calculation_03
      applies_to: "aqueous waste mass"
      rule: "waste mass = measured volume multiplied by contemporaneous mixture density"
      inputs:
        - volume
        - density
        - "transfer identity"
      output: "kg aqueous waste"
      source_ids: []
    - id: calculation_04
      applies_to: "normalized inventory"
      rule: "normalized row amount = period row amount divided by conforming net frame mass"
      inputs:
        - "row amount"
        - "conforming net mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calculation_05
      applies_to: "measured air emission"
      rule: "emission mass = matching pollutant concentration multiplied by normalized dry gas volume; subtract only separately measured captured material not already excluded by the measurement boundary"
      inputs:
        - concentration
        - "dry gas volume"
        - "capture boundary"
      output: "kg pollutant per period"
      source_ids:
        - eu-jrc-sts-bref-2020
  data_quality_requirements:
    - id: quality_01
      applies_to: "product identity"
      requirement: "Distinguish unglazed frames from complete eyewear, lenses, loose parts, and separately sold cases; retain model, material, construction, finish, and market-state records."
      evidence: "product specification; bill of materials; product photograph or drawing; CPC scope review"
    - id: quality_02
      applies_to: "completeness"
      requirement: "Reconcile principal material inputs, conforming output, offcuts, scrap, and final rejects over the same period; explain every unmeasured loss and excluded route."
      evidence: "signed mass-balance worksheet and production-period reconciliation"
    - id: quality_03
      applies_to: "temporal and site coverage"
      requirement: "Use one representative continuous production period and include all in-scope lines, shifts, finishing operations, controls, and waste collection points at the declared site."
      evidence: "production calendar; meter coverage map; line list; maintenance and shutdown log"
    - id: quality_04
      applies_to: "measurement"
      requirement: "Use calibrated scales, meters, tank gauges, and analytical methods with resolution suitable for small components and low-mass emissions."
      evidence: "current calibration certificates; sampling plan; laboratory report"
    - id: quality_05
      applies_to: "conditional routes"
      requirement: "For every conditional material, chemistry, coating, waste, or emission row, record either a value or documented evidence of non-applicability; zero is not a substitute for missing data."
      evidence: "route declaration; formulation; bath list; process flow diagram; signed non-applicability review"
    - id: quality_06
      applies_to: "source and destination traceability"
      requirement: "Link purchased inputs to supplier and grade, and each waste to composition, treatment destination, and transfer record."
      evidence: "supplier declaration; purchase record; waste manifest; receiving certificate"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference_flow"
    rule: "Confirm that the reference output is the exact CPC 48313 frame/mounting flow, uses Mass and kg, excludes final lenses and separately sold cases, and carries all required qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
      - iso-12870-2024
  - rule_id: validation_02
    applies_to: "inventory_identity"
    rule: "Confirm every inventory card contains one atomic exchange; reject umbrella flows, mixed utility labels, generic packaging-material labels, and unspecified wastewater used in place of the chromium-containing aqueous waste row."
    source_ids: []
  - rule_id: validation_03
    applies_to: "uuid_and_units"
    rule: "For each UUID-bearing row, confirm state-100 flow type, English and Chinese baseName, classification, property, unit group, and reference unit; for UUID-empty rows, confirm the manifest unresolved entry is present."
    source_ids: []
  - rule_id: validation_04
    applies_to: "mass_and_period_reconciliation"
    rule: "Confirm that materials, components, output, offcuts, scrap, waste, and rejects cover the same production period and that unexplained mass imbalance is disclosed."
    source_ids: []
  - rule_id: validation_05
    applies_to: "route_applicability"
    rule: "Confirm the declared material and finishing route agrees with every populated or not-applicable conditional row; do not average cellulose-acetate, nickel-silver, chromium-plating, and varnish routes."
    source_ids:
      - unido-spectacle-frames-profile
  - rule_id: validation_06
    applies_to: "direct_emissions"
    rule: "Confirm NMVOC and PM0.2-PM2.5 are direct foreground emissions to the stated unspecified-air compartment and are not upstream electricity or material-production emissions."
    source_ids:
      - eu-jrc-sts-bref-2020
  - rule_id: validation_07
    applies_to: "range_evidence"
    rule: "Confirm no empirical external range is used unless at least two independent original sources have compatible boundary, reference flow, product state, geography, and technology; otherwise retain the foreground collection requirement and unresolved range-evidence need."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset eligible for later publication as secondary_dataset or background_dataset after review"
  downstream_use: "Product carbon footprint, comparative LCA, supply-chain modelling, and lifecyclemodel construction for the declared frame material, route, finish, geography, and factory-gate state"
  allowed_use: "Use for products matching the declared semantic scope and required qualifiers, with upstream datasets and allocation method disclosed"
  excluded_use: "Complete spectacles or goggles; lenses; eye protectors; loose frame parts; retail fitting; use-phase durability; repair; end-of-life; materially different frame materials or finishing systems without route-specific data"
  required_metadata: "PCR id; product and model; frame application and construction; principal material and grade; forming and finishing route; lens-retention design; net-mass convention; site and geography; period; technology; upstream dataset links; allocation drivers; treatment destinations; conformity specification"
  required_quality_disclosure: "primary-data share; meter and scale coverage; component mass sampling; mass-balance result; missing data and proxies; route non-applicability evidence; emission measurement method; uncertainty; unresolved UUID and range-evidence status"
  update_trigger: "Change in principal material, frame construction, forming or joining technology, finishing chemistry, coating formulation, emission control, supplier mix, packaging, production site, allocation driver, or applicable product specification"
