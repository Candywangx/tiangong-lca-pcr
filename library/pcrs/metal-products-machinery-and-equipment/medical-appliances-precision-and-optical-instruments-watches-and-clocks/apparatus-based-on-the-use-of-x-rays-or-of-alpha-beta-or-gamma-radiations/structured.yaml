allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable products, batches, and stages"
    rule: "Avoid allocation by subdivision, product-specific bills of material, batch records, sub-metering, and direct test records wherever practicable."
    source_ids:
      - thiel-radiology-lca
  - rule_id: allocation_shared_operations
    applies_to: "shared assembly, utilities, testing, and site services"
    rule: "Allocate shared burdens first by a measured causal driver such as machine time, metered energy, test duration, or handled mass. If no causal driver is available, use mass allocation, justify it, and test the result against an alternative plausible driver."
    source_ids: []
  - rule_id: allocation_rework_rejects
    applies_to: "rework, rejects, and yield losses"
    rule: "Assign rework energy, consumed components, test burdens, and wastes to the batch that caused them when traceable; otherwise allocate with the same documented driver as the shared operation."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "recycling, recovery, and disposal"
    rule: "Declare the selected recycling and end-of-life convention, keep input recycled content separate from output recovery credits, and prevent double counting across foreground and upstream datasets."
    source_ids:
      - eu-weee
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "component_supply"
      flow_role: "radiation subsystem, detector, high-voltage supply, shielding, frame or gantry, cooling, controls, accepted components"
      record_type: "bill of material, purchase, fabrication, inventory, and source certificate records"
      raw_fields: "part id; material; subsystem; quantity; net mass; supplier; reject; radionuclide; activity; activity date"
      collection_method: "Reconcile product-specific engineering BOM to purchasing, fabrication, inventory movement, and supplier certificates; flag unweighed or estimated masses."
      unit: "kg; Bq for the separate activity descriptor"
      frequency: "each product configuration and production batch"
      temporal_coverage: "complete batch; reference period disclosed"
      site_scope: "all manufacturing sites supplying the declared configuration"
      aggregation_rule: "Sum accepted net quantities by subsystem; subtract returns; keep rejects and activity descriptors separate."
      quality_evidence: "approved BOM; mass or scale record; supplier declaration; source certificate; reconciliation sign-off"
    - protocol_id: cp_assembly_records
      process_id: "apparatus_assembly"
      flow_role: "components, utilities, consumables, integrated apparatus, scrap"
      record_type: "batch traveller, meter, issue-return, production, and waste records"
      raw_fields: "batch id; input mass; output mass; electricity; consumable; reject mass; waste route; operating time"
      collection_method: "Use dedicated meters and batch issue-return records where available; otherwise allocate shared records using the declared rule and driver."
      unit: "kg; kWh; other recorded units converted and disclosed"
      frequency: "each batch; utilities at least monthly where batch meters are absent"
      temporal_coverage: "representative production period covering the batch"
      site_scope: "declared assembly site"
      aggregation_rule: "Normalize reconciled batch totals to 1,000 kg integrated output; preserve separate flow rows."
      quality_evidence: "meter record; batch traveller; material ledger; calibrated scale; waste ticket; allocation worksheet"
    - protocol_id: cp_acceptance_records
      process_id: "calibration_acceptance"
      flow_role: "apparatus, test utilities, test consumables, accepted output, rejects"
      record_type: "acceptance protocol, meter, issue-return, calibration, radiation-safety, and reject records"
      raw_fields: "serial or batch id; test type; pass or fail; operating mode; duration; electricity; cooling; consumable; radionuclide; activity; waste"
      collection_method: "Link configuration-specific acceptance and calibration records to metered utilities and issued test consumables, including failed tests and retests."
      unit: "kg; kWh; m3; Bq as applicable"
      frequency: "every accepted unit or production batch"
      temporal_coverage: "complete test and retest sequence"
      site_scope: "declared acceptance site"
      aggregation_rule: "Sum accepted and rejected test burdens for the batch and normalize to accepted apparatus mass."
      quality_evidence: "signed acceptance record; calibration certificate; safety test; meter log; issue-return record; waste manifest"
    - protocol_id: cp_packaging_dispatch
      process_id: "packaging_dispatch"
      flow_role: "accepted apparatus, packaging, reference product, dispatch waste"
      record_type: "packing list, scale, packaging issue-return, and dispatch records"
      raw_fields: "product net mass; packaging material; packaging mass; gross shipped mass; reusable fixture; waste mass; dispatch date"
      collection_method: "Reconcile the final net product mass to packing and dispatch records and retain packaging as separate material inputs."
      unit: "kg"
      frequency: "each shipment and batch"
      temporal_coverage: "complete dispatch batch"
      site_scope: "declared dispatch site"
      aggregation_rule: "Sum product net mass separately from packaging and normalize to 1,000 kg reference product."
      quality_evidence: "calibrated scale record; packing list; material issue-return; shipment record; waste ticket"
    - protocol_id: cp_delivery_installation
      process_id: "outbound_delivery_installation"
      flow_role: "transport and installation"
      record_type: "bill of lading, route, installer, and commissioning records"
      raw_fields: "shipped mass; origin; destination; mode; distance; load factor; installation materials; energy; commissioning tests"
      collection_method: "Collect actual shipment legs and installation records when delivery is in scope; keep building works and room shielding outside unless supplied as equipment."
      unit: "kg; km; tkm; kWh"
      frequency: "each shipment and installation"
      temporal_coverage: "complete delivery and commissioning period"
      site_scope: "declared route and customer site"
      aggregation_rule: "Calculate each transport leg separately; sum installation inputs without merging them into apparatus mass."
      quality_evidence: "carrier record; route evidence; installer log; commissioning acceptance"
    - protocol_id: cp_workload_use
      process_id: "use_maintenance"
      flow_role: "workload, mode electricity, cooling, consumables, replacements, maintenance"
      record_type: "device meter, power logger, service log, procurement, and workload records"
      raw_fields: "radiation basis; application; examination or exposure count; mode; power; duration; standby; shutdown; cooling; consumable; part or source replacement; service life"
      collection_method: "Measure representative operating modes or use manufacturer-validated logs and link them to the declared workload; do not transfer another model's workload."
      unit: "kWh; h; count; kg; m3; Bq as applicable"
      frequency: "continuous logs or representative campaign; maintenance per event"
      temporal_coverage: "declared service life or reporting period"
      site_scope: "declared use site and configuration"
      aggregation_rule: "Calculate mode-specific totals for the declared workload and service life; report replacements and consumables separately."
      quality_evidence: "meter or validated log; workload extract; service record; purchase record; source certificate"
    - protocol_id: cp_eol_records
      process_id: "decommissioning_eol"
      flow_role: "dismantling, radioactive-source route, and material treatment"
      record_type: "decommissioning plan, waste manifest, recycler, and source-return records"
      raw_fields: "apparatus mass; component; radionuclide; activity; treatment route; recovery; disposal; transport"
      collection_method: "Reconcile the retired apparatus mass to dismantling outputs and licensed source return or disposal records under the applicable jurisdiction."
      unit: "kg; Bq; tkm as applicable"
      frequency: "each decommissioning event"
      temporal_coverage: "complete decommissioning and treatment chain"
      site_scope: "declared use site and treatment routes"
      aggregation_rule: "Sum mass by treatment route; keep radioactive-source management separate and report unresolved mass."
      quality_evidence: "decommissioning certificate; licensed manifest; recycler receipt; mass balance; transport record"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "all production inventory"
      rule: "Normalized amount = collected batch amount / accepted net apparatus mass × 1,000 kg."
      inputs:
        - "collected batch amount"
        - "accepted net apparatus mass"
      output: "amount per 1,000 kg finished apparatus"
      source_ids: []
    - id: calc_component_reconciliation
      applies_to: "component supply and assembly"
      rule: "Accepted components + incorporated consumables = integrated apparatus + separately recorded rejects and losses, within declared measurement uncertainty."
      inputs:
        - "component masses"
        - "incorporated consumables"
        - "output mass"
        - "waste and reject mass"
      output: "reconciled subsystem and process mass balance"
      source_ids: []
    - id: calc_delivery_tkm
      applies_to: "outbound delivery"
      rule: "Transport service for each leg = gross shipped mass in tonnes × actual leg distance in kilometres."
      inputs:
        - "product net mass"
        - "packaging mass"
        - "transport fixture mass"
        - distance
      output: "tkm by mode and leg"
      source_ids: []
    - id: calc_workload_energy
      applies_to: "use and maintenance"
      rule: "Scenario electricity = sum over operating modes of measured or validated mode power × mode duration for the declared workload; add separately measured cooling and standby loads only once."
      inputs:
        - "power by mode"
        - "duration by mode"
        - workload
        - "cooling and standby records"
      output: "kWh per declared workload and service life"
      source_ids:
        - malta-healthcare-eee
        - thiel-radiology-lca
    - id: calc_replacement_inventory
      applies_to: "maintenance and source replacement"
      rule: "Lifetime replacement amount = recorded amount per replacement × declared replacement count; retain each part, coolant, and radioactive source as a separate exchange."
      inputs:
        - "replacement event records"
        - amounts
        - "service life"
        - "replacement count"
      output: "replacement inventory per declared service life"
      source_ids: []
    - id: calc_eol_balance
      applies_to: "decommissioning and end-of-life"
      rule: "Input retired apparatus mass = recovered material + reuse outputs + treatment waste + disposal + explicitly unresolved mass, within declared uncertainty."
      inputs:
        - "decommissioning mass"
        - "route-specific outputs"
      output: "end-of-life mass balance"
      source_ids:
        - eu-weee
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "product identity"
      requirement: "Records shall resolve to one declared radiation basis, application, complete equipment configuration, geography, and reference year; mixed portfolios shall be disaggregated or transparently weighted."
      evidence: "product specification; serial or configuration list; production mix calculation"
    - id: dq_primary_data
      applies_to: "required production stages"
      requirement: "Use product- and site-specific BOM, batch, meter, calibration, packaging, and waste records. Document every allocation and secondary dataset substitution."
      evidence: "protocols cp_component_bom through cp_packaging_dispatch; allocation worksheet; dataset mapping log"
    - id: dq_workload
      applies_to: "conditional use stage"
      requirement: "Workload and mode data shall match the declared apparatus configuration and use site or scenario; a single published scanner or facility result is not category-default evidence."
      evidence: "protocol cp_workload_use; meter records; workload extract; scenario statement"
    - id: dq_source_chain
      applies_to: "all external and upstream data"
      requirement: "Record source id, version or publication date, retrieval date, geography, technology, and the decision supported."
      evidence: "source register; upstream dataset metadata; retrieval log"
    - id: dq_uncertainty
      applies_to: "collected and allocated values"
      requirement: "Report measurement uncertainty, missing records, estimates, temporal coverage, and sensitivity to material allocation or workload assumptions."
      evidence: "calibration status; data-gap register; sensitivity results"
validation_rules:
  - rule_id: validate_identity
    applies_to: "category and reference flow"
    rule: "Confirm CPC 3.0 code 48110 and exact Tiangong product flow UUID f2980f85-95d2-48e8-9b72-8c0f38650d2f; reject a standalone detector, subassembly kit, service, complete facility, non-ionizing scanner, or narrow model presented as the category."
    source_ids: []
  - rule_id: validate_variant_axes
    applies_to: "required qualifiers"
    rule: "Require both radiation_basis and application, plus equipment configuration, fixed or mobile state, generator or sealed-source status, detector technology, geography, and reference year."
    source_ids:
      - fda-medical-xray
      - iaea-industrial-radiography
      - iaea-nuclear-medicine
      - epa-security-scanning
  - rule_id: validate_reference_uuid
    applies_to: "quantitative reference"
    rule: "Require Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, reference unit kg, and exactly 1,000 kg reference product output."
    source_ids: []
  - rule_id: validate_component_completeness
    applies_to: "component declaration"
    rule: "Require separate declarations for the radiation generator or source assembly, detector and signal chain, high-voltage supply, integral shielding, frame or gantry, cooling, and controls; permit not_applicable only with a configuration-specific explanation."
    source_ids:
      - iaea-industrial-radiography
      - iaea-nuclear-medicine
      - epa-security-scanning
  - rule_id: validate_mass_balance
    applies_to: "production inventory"
    rule: "Reconcile component, assembly, acceptance, and packaging records to the net reference-product mass, with packaging and wastes separate and discrepancies explained within stated uncertainty."
    source_ids: []
  - rule_id: validate_workload
    applies_to: "use and maintenance when included"
    rule: "Require a configuration-specific workload and mode schedule, service life, power or electricity evidence, cooling, consumables, replacement, and maintenance assumptions; reject an undeclared single-model or single-facility proxy."
    source_ids:
      - malta-healthcare-eee
      - thiel-radiology-lca
  - rule_id: validate_delivery_boundary
    applies_to: "delivery and installation"
    rule: "Require delivery_boundary; if beyond factory gate, require shipped mass, route, mode, distance, installation inputs, and commissioning records while excluding unrelated site construction."
    source_ids:
      - malta-healthcare-eee
  - rule_id: validate_source_consumables
    applies_to: "radioactive and test consumables"
    rule: "Keep radiopharmaceuticals, replacement sources, contrast agents, films, and test pieces separate from apparatus mass; require radionuclide, dated activity, and licensed management route when radioactive material is present."
    source_ids:
      - iaea-industrial-radiography
      - iaea-nuclear-medicine
  - rule_id: validate_facility_exclusion
    applies_to: "facility boundary"
    rule: "Confirm that room or bunker shielding, building HVAC, and unrelated hospital, factory, or airport activities are not used as a proxy for the delivered equipment."
    source_ids:
      - iaea-industrial-radiography
      - epa-security-scanning
  - rule_id: validate_source_traceability
    applies_to: "evidence and upstream data"
    rule: "Require stable source ids and retrieval dates for external rules, and versioned identity, geography, technology, and temporal metadata for upstream datasets."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product- and site-specific foreground data package for manufacturing complete CPC 48110 apparatus, with conditional delivery, use, maintenance, and end-of-life extensions."
  downstream_use: "Publication as a TianGong foreground process and construction of a lifecyclemodel for the declared apparatus configuration and scenario."
  allowed_use: "Comparative or attributional modelling when radiation basis, application, configuration, workload, geography, reference year, delivery boundary, system boundary, and data quality match the study."
  excluded_use: "Representing a complete medical, industrial, or security facility; representing radiopharmaceuticals or replacement sources as the apparatus; representing standalone detectors, parts, services, or non-ionizing scanners; extrapolating one model or use site to the whole category without a disclosed production mix."
  required_metadata: "PCR id; CPC reference; Tiangong reference UUIDs; radiation basis; application; equipment configuration; generator or sealed-source status; detector; high-voltage supply; shielding; frame or gantry; cooling; workload; delivery boundary; service life when applicable; geography; reference year; production sites; source register."
  required_quality_disclosure: "Primary-data share; BOM and mass-balance coverage; meter and calibration coverage; allocation drivers; secondary-dataset substitutions; workload derivation; missing values; uncertainty; estimates; exclusions; sensitivity results."
  update_trigger: "Change in radiation or detector technology, apparatus configuration, shielding or cooling design, production route or site, energy and workload profile, delivery boundary, source-management practice, applicable end-of-life law, or any reference UUID or source evidence."
data_sources:
  - id: "unsd-cpc-48110"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC detail 48110, “Apparatus based on the use of X-rays or of alpha, beta or gamma radiations.” https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1073/48110 (retrieved 2026-08-09)."
    used_for: "Official category title and apparatus-level identity context; the repository's CPC 3.0 source remains authoritative for the declared version."
  - id: "fda-medical-xray"
    type: "official_guidance"
    reference: "U.S. Food and Drug Administration, “Medical X-ray Imaging.” https://www.fda.gov/radiation-emitting-products/medical-imaging/medical-x-ray-imaging (retrieved 2026-08-09)."
    used_for: "Medical X-ray modality split and the generator-to-detector imaging chain."
  - id: "iaea-industrial-radiography"
    type: "official_guidance"
    reference: "International Atomic Energy Agency, *Radiation Safety in Industrial Radiography*, IAEA Safety Standards Series No. SSG-11, 2011. https://www-pub.iaea.org/MTCD/Publications/PDF/Pub1466_web.pdf (retrieved 2026-08-09)."
    used_for: "Industrial X-ray and gamma-radiography configurations; generator, source container, shielding, controls, cables, collimation, cooling, and licensed source-management boundaries."
  - id: "iaea-nuclear-medicine"
    type: "handbook"
    reference: "International Atomic Energy Agency, *Nuclear Medicine Resources Manual, 2020 Edition*, IAEA Human Health Series No. 37, 2020. https://www-pub.iaea.org/MTCD/Publications/PDF/P1861_web.pdf (retrieved 2026-08-09)."
    used_for: "Gamma-camera and nuclear-imaging equipment components, detector heads, electronics, workstations, gantries, patient handling, and separation of radiopharmaceuticals from equipment."
  - id: "epa-security-scanning"
    type: "official_guidance"
    reference: "U.S. Environmental Protection Agency, “Radiation and Airport Security Scanning.” https://www.epa.gov/radtown/radiation-and-airport-security-scanning (retrieved 2026-08-09)."
    used_for: "Cabinet X-ray security use, integral shielding and interlocks, and testing, calibration, and maintenance requirements."
  - id: "malta-healthcare-eee"
    type: "official_guidance"
    reference: "Government of Malta, *Electric & Electronic Equipment Used in Health Care*, Green Public Procurement National Action Plan. https://gpp.gov.mt/wp-content/uploads/2023/05/Electric-and-Electronic-Equipment.pdf (retrieved 2026-08-09)."
    used_for: "Configuration-specific installation, operating-mode, workload, energy, consumable, maintenance, spare-parts, and end-of-life information requirements. No document default value is adopted."
  - id: "thiel-radiology-lca"
    type: "literature"
    reference: "Thiel et al., “Environmental Life Cycle Assessment of a U.S. Hospital-based Radiology Practice,” *Radiology* 313(2), 2024, e240398. https://doi.org/10.1148/radiol.240398 (retrieved 2026-08-09)."
    used_for: "Foreground BOM, packaging, delivery, mode-specific electricity, and workload data collection; its single-practice and equipment results are not category defaults."
  - id: "eu-weee"
    type: "standard"
    reference: "European Parliament and Council, Directive 2012/19/EU on waste electrical and electronic equipment (WEEE), consolidated text. https://eur-lex.europa.eu/eli/dir/2012/19/2018-07-04 (retrieved 2026-08-09)."
    used_for: "Jurisdiction-dependent electrical-equipment collection and treatment boundary; apply only when the equipment and waste stream fall within the applicable legal scope."
