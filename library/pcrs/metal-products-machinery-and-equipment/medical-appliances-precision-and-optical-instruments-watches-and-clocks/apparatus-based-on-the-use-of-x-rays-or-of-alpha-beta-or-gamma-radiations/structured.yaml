system_boundary:
  rules:
    - rule_id: boundary_required_stages
      applies_to: "cradle-to-factory-gate production"
      rule: "Include major-component supply, apparatus assembly and integration, calibration and safety acceptance, and packaging and dispatch."
      source_ids:
        - iaea-industrial-radiography
        - iaea-nuclear-medicine
        - epa-security-scanning
    - rule_id: boundary_delivery
      applies_to: "delivery and installation"
      rule: "Exclude outbound delivery and installation at the factory-gate boundary; include and separately report them only when the declared delivery boundary extends to the customer site."
      source_ids:
        - malta-healthcare-eee
    - rule_id: boundary_source_consumables
      applies_to: "radioactive and imaging consumables"
      rule: "Keep radiopharmaceuticals, replacement sealed sources, contrast agents, films, and test pieces outside the reference product. Include them only as separately identified operational or test inputs when the declared stage requires them; never use their mass as the apparatus reference flow."
      source_ids:
        - iaea-industrial-radiography
        - iaea-nuclear-medicine
    - rule_id: boundary_use_scenario
      applies_to: "use and maintenance"
      rule: "Include use and maintenance only under a declared service-life and workload scenario with mode-specific electricity, cooling, consumables, replacements, and maintenance records."
      source_ids:
        - malta-healthcare-eee
        - thiel-radiology-lca
    - rule_id: boundary_facility_exclusion
      applies_to: "buildings and site infrastructure"
      rule: "Exclude the complete facility, room shielding, bunker, building HVAC, and unrelated hospital, factory, or airport operations. Include only shielding, enclosure, cooling, frame, gantry, and controls physically delivered as part of the equipment."
      source_ids:
        - iaea-industrial-radiography
        - epa-security-scanning
    - rule_id: boundary_end_of_life
      applies_to: "decommissioning and waste treatment"
      rule: "Include decommissioning and end-of-life only when downstream stages are declared; separate regulated radioactive-source management from equipment dismantling and jurisdiction-specific electrical-equipment treatment."
      source_ids:
        - eu-weee
