allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared equipment and lines"
    rule: "Prefer subdivision, batch records and submetering so burdens are assigned to the device family causing them."
    source_ids: []
  - rule_id: allocation_batch_driver
    applies_to: "shared batch processes"
    rule: "Allocate first by a causal driver such as occupied chamber capacity or validated machine time; use released mass only when no better measured driver exists."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "segregated scrap"
    rule: "Report each scrap flow and destination without an avoided-virgin credit inside the foreground process unless a consistently declared background recycling model supplies it."
    source_ids: []
  - rule_id: allocation_disclosure
    applies_to: "residual allocation"
    rule: "Disclose process, products, driver, numerator, denominator, factor and sensitivity; factors sharing a burden shall sum to one."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "material_transformation"
      flow_role: "material and gas inputs"
      record_type: "receipt, issue and inventory record"
      raw_fields: "identity; grade; form; supplier; lot; stock; receipt; issue; return; mass or volume; reference conditions"
      collection_method: "Reconcile qualified warehouse and production issues to declared lots."
      unit: "kg or m3"
      frequency: "each receipt and issue"
      temporal_coverage: "continuous 12 months or complete shorter campaign"
      site_scope: "all production sites in scope"
      aggregation_rule: "sum net issued amount and allocate by lot or causal driver"
      quality_evidence: "certificate; lot traceability; calibrated scale or meter; reconciliation"
    - protocol_id: cp_energy_meters
      process_id: "all_included_processes"
      flow_role: "electricity and natural gas"
      record_type: "meter, invoice and run log"
      raw_fields: "meter id; readings; unit; conditions; equipment; run time; lot; accepted output"
      collection_method: "Prefer submeters; otherwise integrate verified demand over logged time and reconcile to invoices."
      unit: "MJ, kWh or m3"
      frequency: "batch or month"
      temporal_coverage: "continuous 12 months or complete shorter campaign"
      site_scope: "all in-scope locations"
      aggregation_rule: "difference readings, convert, causally allocate and normalize"
      quality_evidence: "calibration; invoice; run log; allocation worksheet"
    - protocol_id: cp_cleaning_records
      process_id: "cleaning_assembly"
      flow_role: "water and NaOH"
      record_type: "meter, recipe and issue record"
      raw_fields: "water; density; solution mass; NaOH fraction; return; batch; output"
      collection_method: "Meter water and reconcile chemicals to controlled recipes."
      unit: "kg, m3 and mass fraction"
      frequency: "cleaning batch"
      temporal_coverage: "same production period"
      site_scope: "all cleaning lines"
      aggregation_rule: "calculate pure NaOH, aggregate accepted batches and normalize"
      quality_evidence: "calibration; concentration certificate; recipe; batch record"
    - protocol_id: cp_waste_records
      process_id: "material_transformation_cleaning_assembly"
      flow_role: "scrap and wastewater"
      record_type: "scale ticket, manifest and effluent meter"
      raw_fields: "identity; composition; wet mass; carryover; destination; treatment; batch; wastewater"
      collection_method: "Weigh segregated dispatches and meter wastewater; reconcile stocks."
      unit: "kg or m3"
      frequency: "dispatch or discharge period"
      temporal_coverage: "same production period"
      site_scope: "all generation points"
      aggregation_rule: "opening stock plus generation minus closing stock and returns"
      quality_evidence: "calibration; manifest; treatment receipt; composition record"
    - protocol_id: cp_combustion_emissions
      process_id: "thermal_processing"
      flow_role: "fossil CO2"
      record_type: "stack monitor or fuel-carbon record"
      raw_fields: "fuel; conditions; carbon factor; oxidation; measured CO2; period"
      collection_method: "Prefer calibrated monitoring; otherwise calculate from metered fuel and documented applicable factor."
      unit: "kg CO2"
      frequency: "monitored period or fuel batch"
      temporal_coverage: "same thermal period"
      site_scope: "all combustion units"
      aggregation_rule: "aggregate and causally allocate by furnace load"
      quality_evidence: "calibration; fuel certificate; factor record; balance check"
    - protocol_id: cp_sterilization_records
      process_id: "sterilization"
      flow_role: "ethylene oxide and emission"
      record_type: "chamber, dose, aeration and abatement record"
      raw_fields: "dose; concentration; released load; chamber; cycle; destroyed mass; emission; status"
      collection_method: "Reconcile dosing to released loads and measured or validated emissions."
      unit: "kg"
      frequency: "cycle"
      temporal_coverage: "all cycles in period"
      site_scope: "each in-scope chamber and control"
      aggregation_rule: "released loads only; allocate by validated load driver"
      quality_evidence: "validated cycle; calibration; release; monitor or mass balance"
    - protocol_id: cp_packaging_records
      process_id: "packaging_release"
      flow_role: "packaging and finished product"
      record_type: "BOM, count, unit-mass and release record"
      raw_fields: "material; unit mass; count; model; net product mass; reject; sterile state; status"
      collection_method: "Verify BOM by counts and unit masses; weigh product separately."
      unit: "kg and count"
      frequency: "lot"
      temporal_coverage: "continuous 12 months or complete shorter campaign"
      site_scope: "all packaging sites"
      aggregation_rule: "sum released product and associated packaging, normalize to 1 kg"
      quality_evidence: "BOM; calibration; count reconciliation; release record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every row"
      rule: "normalized amount = amount assigned to accepted product / net accepted product mass in kg"
      inputs:
        - "assigned amount"
        - "accepted mass"
      output: "amount per 1 kg product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_naoh_pure_mass
      applies_to: "sodium_hydroxide"
      rule: "pure NaOH = net solution mass × NaOH mass fraction"
      inputs:
        - "solution mass"
        - fraction
        - return
      output: "kg NaOH"
      source_ids: []
    - id: calc_waste_stock_balance
      applies_to: "solid scrap"
      rule: "generated waste = dispatches + closing stock − opening stock − externally received waste, adjusted for returns"
      inputs:
        - dispatch
        - "stock and return"
      output: "kg generated scrap"
      source_ids: []
    - id: calc_combustion_co2
      applies_to: "fossil_carbon_dioxide"
      rule: "use calibrated measurement; otherwise multiply metered gas by documented applicable fossil-carbon factor and oxidation treatment"
      inputs:
        - gas
        - factor
        - oxidation
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_allocation_check
      applies_to: "shared processes"
      rule: "sum of allocation factors sharing a burden = 1"
      inputs:
        - "factors and total"
      output: "reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve family, model, function, sterile state, composition, net mass and release status."
      evidence: "specification, BOM and release record"
    - id: dq_process_traceability
      applies_to: "all processes"
      requirement: "Link lots from qualified input through parameters, rejects, sterilization when applicable and release."
      evidence: "traveller, batch record, equipment log and QMS record"
    - id: dq_measurement
      applies_to: "meters and scales"
      requirement: "Use calibrated equipment; document conversions, reference conditions, gaps and estimates."
      evidence: "calibration, meter log and worksheet"
    - id: dq_temporal
      applies_to: "annual or campaign inventory"
      requirement: "Use continuous 12 months or a complete shorter campaign and explain shutdowns, validation builds and atypical rejects."
      evidence: "calendar, coverage and review"
    - id: dq_mass_balance
      applies_to: "materials, product and wastes"
      requirement: "Reconcile major inputs to accepted product, rejects, wastes and stock changes by material family."
      evidence: "signed balance and stock reconciliation"
    - id: dq_sterile_packaging
      applies_to: "sterile products"
      requirement: "Link sterilization and packaging records to released sterile state and configuration."
      evidence: "validated cycle, package-integrity and release evidence"
validation_rules:
  - rule_id: validate_identity
    applies_to: "identity and reference flow"
    rule: "Fail if family, function, model or patient match, net mass, sterile state, life or cycles, route, site or year is missing."
    source_ids:
      - un-cpc-3-0-2025
      - fda-am-medical-devices-2017
  - rule_id: validate_reference_mass
    applies_to: "reference product"
    rule: "Confirm finished_appliance is exactly 1 kg net accepted product and packaging is excluded from net mass."
    source_ids: []
  - rule_id: validate_route_inventory
    applies_to: "process map and inventory"
    rule: "Confirm each declared module has atomic material, energy, waste and direct-emission exchanges; reject combined labels."
    source_ids:
      - fda-am-medical-devices-2017
  - rule_id: validate_mass_balance
    applies_to: "transformation and packaging"
    rule: "Reconcile major inputs, accepted product, rejects, wastes and stocks; investigate residuals."
    source_ids:
      - fda-qmsr-2026
  - rule_id: validate_no_double_count
    applies_to: "energy and emissions"
    rule: "Confirm direct combustion and sterilization emissions are not counted again upstream."
    source_ids: []
  - rule_id: validate_sterility
    applies_to: "sterile products"
    rule: "Confirm validated sterilization, controlled packaging and release evidence cover product and period."
    source_ids:
      - eu-mdr-2017-745
      - fda-qmsr-2026
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Confirm driver and worksheet are disclosed and factors sharing a burden sum to one."
    source_ids: []
  - rule_id: validate_unresolved
    applies_to: "UUID and range evidence"
    rule: "Keep unresolved identities and unsupported ranges explicit; do not substitute proxies or invented ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground manufacturing dataset eligible as secondary_dataset or background_dataset after review"
  downstream_use: "product carbon footprints, compatible within-family LCA, hotspot analysis, process datasets and lifecyclemodel projections"
  allowed_use: "Use when identity, performance, life, composition, sterile state, packaging, modules, geography, year and allocation are compatible."
  excluded_use: "Do not compare unlike functions on mass alone or represent clinical fitting, surgery, patient outcomes, use, maintenance or end-of-life without added processes."
  required_metadata: "PCR id and version; family and model; function; standard or patient-matched state; implantable or external state; net mass; composition; modules; sterile state and sterilization; packaging; site; geography; year; technology; allocation; upstream datasets; cut-offs"
  required_quality_disclosure: "source shares; meter coverage; temporal coverage; supplier specificity; allocation; mass-balance residual; reject treatment; missing data; unresolved UUIDs; range gaps; sterilization and packaging validation"
  update_trigger: "Update after material design, technology, sterilization, packaging, sterile state, site, supplier or allocation changes; data-age failure; or resolution of identity and range gaps."
