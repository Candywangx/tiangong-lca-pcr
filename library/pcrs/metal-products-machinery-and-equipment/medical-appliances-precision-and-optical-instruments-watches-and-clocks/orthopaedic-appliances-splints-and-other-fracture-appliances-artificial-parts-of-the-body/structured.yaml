system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground manufacturing system"
      rule: "Include transformation, post-processing, cleaning, assembly, inspection and packaging under declared manufacturing responsibility; exclude raw-material production, clinical use and end-of-life while linking required upstream datasets."
      source_ids:
        - fda-am-medical-devices-2017
        - fda-qmsr-2026
    - rule_id: boundary_route_condition
      applies_to: "conditional modules"
      rule: "Include additive manufacturing, thermal processing and sterilization only when performed for the declared product; identify each step, parameter set and output specification."
      source_ids:
        - fda-am-medical-devices-2017
    - rule_id: boundary_sterile_state
      applies_to: "sterile and non-sterile products"
      rule: "If supplied sterile, include controlled packaging and validated sterilization whether on-site or represented by an upstream contracted-process dataset; otherwise declare non-sterile state and packaging cleanliness controls."
      source_ids:
        - eu-mdr-2017-745
    - rule_id: boundary_no_silent_cutoff
      applies_to: "material, waste and emission completeness"
      rule: "Do not omit a small-mass exchange when it can affect biocompatibility, cleanliness, sterile-state assurance, hazardous emissions or regulated waste classification."
      source_ids:
        - eu-mdr-2017-745
        - fda-am-medical-devices-2017
