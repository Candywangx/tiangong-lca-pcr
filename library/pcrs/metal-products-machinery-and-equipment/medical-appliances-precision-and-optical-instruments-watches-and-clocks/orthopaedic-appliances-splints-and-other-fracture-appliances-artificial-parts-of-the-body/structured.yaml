  how_much: "1 kg net mass of quality-released finished product, excluding transport packaging but including components that remain in the device"
  how_well: "Meets declared design, material, dimensional, mechanical, biocompatibility, cleanliness and, when applicable, validated sterile-state specifications for intended use"
