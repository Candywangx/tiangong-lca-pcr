system_boundary:
  rules:
    - rule_id: boundary_complete_manufacturing_inventory
      applies_to: "reference-product manufacturing"
      rule: "Include and quantify all assessable materials, components, packaging, manufacturing and assembly processes, energy, water, inbound transport, direct emissions, production losses, rejects, rework, and waste treatment needed to deliver the accepted apparatus to the manufacturer's final logistics platform. Distinguish directly collected foreground operations from referenced upstream datasets."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - international-epd-pcr-2024-06
    - rule_id: boundary_product_specific_routes
      applies_to: "apparatus subtype and configuration"
      rule: "Model only the electronic, radio-frequency, antenna, waveguide, transceiver, receiver, power, cooling, mechanical, cabling, software-dependent test, and packaging activities that apply to the declared configuration. Identify and justify every omission or approximation."
      source_ids:
        - iec-63366-2025
        - chalmers-active-safety-radar-2023
        - chalmers-surface-radar-2023
    - rule_id: boundary_upstream_datasets
      applies_to: "purchased components and materials"
      rule: "Link purchased materials, parts, printed circuit boards or assemblies, integrated circuits, radio-frequency modules, batteries, cables, enclosures, antennas, and other supplier products to upstream datasets representing their declared technologies and geographies. Do not treat the receiving or assembly site as the origin of those upstream burdens."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - rule_id: boundary_downstream_separation
      applies_to: "installation, use, maintenance, and end-of-life"
      rule: "Keep downstream stages outside the foreground manufacturing dataset unless the study explicitly adds them as separately reported modules with product-specific service life, duty cycle, operating energy, maintenance, installation, and end-of-life scenarios."
      source_ids:
        - iec-63366-2025
        - pep-ecopassport-pcr-ed4-2021
    - rule_id: boundary_no_hidden_significant_flows
      applies_to: "exclusions and cut-off decisions"
      rule: "Do not use a mass or energy threshold to hide small-mass but potentially significant electronics, precious or critical materials, batteries, regulated substances, direct emissions, or hazardous wastes. Quantify and justify known exclusions and disclose unresolved composition."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - chalmers-surface-radar-2023
    - rule_id: boundary_same_category_input
      applies_to: "complete or partly complete apparatus used as an input"
      rule: "Record a supplied complete or partly complete CPC 48220 apparatus as a visible upstream product input with its own dataset. Do not recursively re-author its internal production in this foreground process unless the reporting organization directly controls and measures that production."
      source_ids: []
