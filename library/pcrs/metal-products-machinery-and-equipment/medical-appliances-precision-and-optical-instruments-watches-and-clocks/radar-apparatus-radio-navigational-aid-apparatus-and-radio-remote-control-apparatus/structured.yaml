allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared manufacturing, assembly, test, and packaging operations"
    rule: "First avoid allocation by separate metering, batch records, station time, equipment cycles, material issues, and waste records for the declared configuration."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_physical_driver
    applies_to: "shared operations that cannot be subdivided"
    rule: "Use the physical driver that best represents resource causation, such as measured station energy, processing time, equipment cycles, treated mass, occupied test time, or accepted unit count. Do not default to product mass when it does not represent the operation."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_economic_fallback
    applies_to: "shared operation lacking a defensible physical driver"
    rule: "Economic allocation may be used only when subdivision and a causal physical driver are not feasible; disclose the values, period, products, sensitivity, and reason."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework, rejects, recovered components, and production scrap"
    rule: "Attribute rework energy and replacement inputs to accepted output; keep recovered materials or components as visible flows; record waste treatment without credit unless the downstream modelling method explicitly defines and reports a separate recycling allocation."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_documentation
    applies_to: "every allocated input or output"
    rule: "Document the allocation population, numerator, denominator, accounting period, data source, resulting factor, and affected rows so the allocation can be reproduced."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_supplier_inputs
      process_id: "supplier_inputs_and_inbound_logistics"
      flow_role: "purchased components and materials; received inputs"
      record_type: "approved bill of materials, purchase receipt, goods issue, supplier declaration, inventory record"
      raw_fields: "part id; description; supplier; country; Tiangong flow id; quantity; unit; measured mass; configuration; lot; receipt date; opening and closing inventory"
      collection_method: "reconcile approved configuration BOM to receipts, inventory movements, and production issues; retain supplier evidence for composition and upstream dataset choice"
      unit: "kg and item"
      frequency: "each lot with accounting-period reconciliation"
      temporal_coverage: "complete production accounting period, normally a representative year or full campaign"
      site_scope: "every manufacturing site and supplier route in scope"
      aggregation_rule: "attributable received or issued quantity divided by accepted net apparatus mass"
      quality_evidence: "approved BOM revision, receipts, weighing records, inventory reconciliation, supplier declarations, and unresolved-composition log"
    - protocol_id: cp_inbound_logistics
      process_id: "supplier_inputs_and_inbound_logistics"
      flow_role: "inbound transport service"
      record_type: "shipment, carrier, route, and freight record"
      raw_fields: "origin; destination; mode; distance; shipped mass; load factor; return trip; allocation basis; shipment date"
      collection_method: "calculate service separately by route and mode from documented shipment mass and distance"
      unit: "tkm or mode-specific service unit"
      frequency: "each shipment or representative route sample"
      temporal_coverage: "same period as production inputs"
      site_scope: "every material supplier route and receiving site in scope"
      aggregation_rule: "sum attributable transport service by mode and divide by accepted net apparatus mass"
      quality_evidence: "bills of lading, carrier records, route evidence, and documented assumptions"
    - protocol_id: cp_subassembly_materials
      process_id: "electronic_and_rf_assembly"
      flow_role: "electronic and radio-frequency parts"
      record_type: "material issue, pick list, machine feed, return, and inventory record"
      raw_fields: "part id; subassembly id; lot; issued quantity; returned quantity; measured mass; configuration; site; date"
      collection_method: "reconcile material issued to the accepted subassembly configuration, returns, rejects, and inventory change"
      unit: "kg and item"
      frequency: "each lot or batch"
      temporal_coverage: "full production period for each included route"
      site_scope: "each controlled electronic or radio-frequency assembly site"
      aggregation_rule: "net issued quantity divided by accepted subassembly mass and then by accepted apparatus mass"
      quality_evidence: "controlled recipe or BOM, issue and return records, and mass reconciliation"
    - protocol_id: cp_process_energy
      process_id: "electronic_and_rf_assembly_final_assembly_testing_and_calibration_packaging_and_dispatch"
      flow_role: "process energy"
      record_type: "meter, equipment log, fuel invoice, compressed-air or thermal-energy record"
      raw_fields: "carrier; meter id; start and end readings; equipment or station; operating time; batch; site; period; allocation driver"
      collection_method: "use direct meters where available; otherwise allocate a reconciled site or line meter with the documented causal driver"
      unit: "kWh, MJ, or carrier-specific unit"
      frequency: "continuous, each batch, or monthly according to metering"
      temporal_coverage: "full production period, with seasonal and campaign coverage where relevant"
      site_scope: "every included manufacturing, test, and packaging site"
      aggregation_rule: "attributable carrier quantity divided by accepted process output and normalized to accepted net apparatus mass"
      quality_evidence: "calibrated meters, invoices, equipment logs, reconciliation to site totals, and allocation worksheet"
    - protocol_id: cp_process_consumables
      process_id: "electronic_and_rf_assembly_final_assembly_testing_and_calibration"
      flow_role: "consumables and process chemicals"
      record_type: "purchase, issue, tank, recipe, or stock record"
      raw_fields: "material identity; CAS or specification where applicable; quantity; unit; opening and closing stock; returned quantity; waste quantity; process; batch"
      collection_method: "reconcile net consumption from issue or stock balance and map to the exact process chemistry"
      unit: "kg, L, item, or protocol-specific unit"
      frequency: "each batch or monthly"
      temporal_coverage: "full production period"
      site_scope: "every included assembly and test site"
      aggregation_rule: "net attributable consumption divided by accepted process output and normalized to accepted net apparatus mass"
      quality_evidence: "purchase and issue records, recipes, tank measurements, SDS or specification, and stock reconciliation"
    - protocol_id: cp_subassembly_output_and_yield
      process_id: "electronic_and_rf_assembly"
      flow_role: "accepted subassembly output and yield"
      record_type: "production count, test result, transfer, and weighing record"
      raw_fields: "subassembly id; configuration; input count and mass; accepted count and mass; reject count and mass; rework count; transfer date"
      collection_method: "reconcile accepted transfer mass, rejects, rework, and inventory change for each subassembly route"
      unit: "kg and item"
      frequency: "each batch"
      temporal_coverage: "full production period"
      site_scope: "each included subassembly site and line"
      aggregation_rule: "accepted transferred mass divided by total accepted apparatus mass using configuration linkage"
      quality_evidence: "calibrated scales, production and test records, rework log, and mass balance"
    - protocol_id: cp_final_assembly_inputs
      process_id: "final_assembly_testing_and_calibration"
      flow_role: "final assembly inputs"
      record_type: "assembly BOM, pick list, serial genealogy, issue, return, and inventory record"
      raw_fields: "apparatus serial or batch; configuration; part or subassembly id; quantity; measured mass; issue and return; site; date"
      collection_method: "reconcile serial or batch genealogy and net material issues to accepted output"
      unit: "kg and item"
      frequency: "each unit or batch"
      temporal_coverage: "full production period"
      site_scope: "every final assembly site"
      aggregation_rule: "net attributable input divided by accepted net apparatus mass"
      quality_evidence: "approved configuration BOM, serial genealogy, issue and return records, and mass reconciliation"
    - protocol_id: cp_output_acceptance_and_mass
      process_id: "final_assembly_testing_and_calibration_packaging_and_dispatch"
      flow_role: "accepted reference output"
      record_type: "calibrated weighing, production release, acceptance-test, serial, and dispatch record"
      raw_fields: "apparatus subtype; model; configuration; serial or batch; net mass; packaging mass; acceptance result; test protocol; release date; dispatch date"
      collection_method: "sum the net mass of products passing the declared acceptance protocol; keep packaging mass separate"
      unit: "kg and item"
      frequency: "each released apparatus or batch"
      temporal_coverage: "full production period"
      site_scope: "every final assembly and final logistics site"
      aggregation_rule: "all attributable inputs and outputs divided by accepted net apparatus mass; final reference output equals 1 kg"
      quality_evidence: "calibrated scale certificate, acceptance and calibration reports, release authorization, dispatch record, and rejected-unit log"
    - protocol_id: cp_waste_rework_and_treatment
      process_id: "all_included_processes"
      flow_role: "receiving waste, process waste, rejects, rework, and treatment"
      record_type: "waste ticket, internal scrap, rework, recovery, and treatment record"
      raw_fields: "waste identity; hazard class; source process; mass or volume; rework status; recovered quantity; destination; treatment; date"
      collection_method: "reconcile generated waste, controlled rework, internal recovery, off-site transfer, and inventory change without double counting"
      unit: "kg, L, item, or treatment-specific unit"
      frequency: "each transfer with monthly or batch reconciliation"
      temporal_coverage: "full production period"
      site_scope: "every included site and treatment route"
      aggregation_rule: "attributable quantity divided by accepted process output and normalized to accepted net apparatus mass"
      quality_evidence: "calibrated weighbridge or scale records, waste manifests, rework genealogy, treatment certificates, and mass balance"
    - protocol_id: cp_direct_emissions
      process_id: "electronic_and_rf_assembly_final_assembly_testing_and_calibration"
      flow_role: "direct emissions to air, water, and soil"
      record_type: "stack or discharge measurement, continuous monitor, laboratory analysis, permit calculation"
      raw_fields: "substance; compartment; concentration; flow rate; duration; calculation factor; process; site; date; detection limit"
      collection_method: "use measured releases or documented permit calculation; subtract neither upstream nor treatment emissions already represented elsewhere"
      unit: "kg or reported emission unit"
      frequency: "monitoring or permit frequency"
      temporal_coverage: "full production period including representative operating states"
      site_scope: "every emitting operation in scope"
      aggregation_rule: "attributable direct release divided by accepted process output and normalized to accepted net apparatus mass"
      quality_evidence: "calibration, laboratory report, permit method, detection-limit treatment, and duplicate-check against background datasets"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "packaging_and_dispatch"
      flow_role: "delivery packaging and dispatch"
      record_type: "packaging BOM, issue, return, reuse-cycle, weighing, and dispatch record"
      raw_fields: "packaging material; item; mass; reusable identifier; use count; return rate; apparatus configuration; dispatch date"
      collection_method: "reconcile packaging issued to dispatched accepted products, reusable packaging cycles, returns, and packaging waste"
      unit: "kg and item or reuse cycle"
      frequency: "each shipment or batch"
      temporal_coverage: "full production period"
      site_scope: "every packaging and final logistics site"
      aggregation_rule: "attributable packaging quantity divided by accepted net apparatus mass"
      quality_evidence: "packaging specification, calibrated weighing, issue and return records, and dispatch reconciliation"
  calculation_rules:
    - id: calc_reference_mass_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable amount during the accounting period / accepted net apparatus mass during the same period"
      inputs:
        - "attributable row amount"
        - "accepted net apparatus mass"
      output: "amount per 1 kg accepted net apparatus"
      source_ids:
        - international-epd-pcr-2024-06
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_net_material_input
      applies_to: "purchased and issued materials"
      rule: "net attributable input = receipts or issues + opening inventory - closing inventory - documented returns to supplier or stores"
      inputs:
        - "purchase or issue records"
        - inventory
        - returns
      output: "net material or component input"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_transport_service
      applies_to: "inbound transport"
      rule: "transport service by mode = attributable shipped mass in tonnes × route distance in kilometres, with declared load and return-trip treatment"
      inputs:
        - "shipment mass"
        - distance
        - mode
        - "allocation assumptions"
      output: "tkm or mode-specific transport service"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_shared_operation_allocation
      applies_to: "shared energy, materials, water, emissions, and wastes"
      rule: "attributable amount = measured shared amount × declared causal-driver share; use subdivision or direct metering before allocation"
      inputs:
        - "shared meter or record"
        - "physical driver"
        - "production population"
      output: "allocated foreground amount and allocation factor"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_yield_rework_reconciliation
      applies_to: "subassembly and final assembly"
      rule: "reconcile input, accepted output, controlled rework, rejects, waste, returned material, and inventory change; disclose residual imbalance"
      inputs:
        - "material issues"
        - outputs
        - rework
        - rejects
        - waste
        - returns
        - inventory
      output: "yield, waste, rework, and mass-balance residual"
      source_ids:
        - chalmers-active-safety-radar-2023
        - pep-ecopassport-pcr-ed4-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and all configuration-dependent records"
      requirement: "Maintain one consistent apparatus subtype, model, configuration, BOM revision, acceptance protocol, and exact reference-flow UUID across all process records."
      evidence: "configuration baseline, approved BOM, serial or batch genealogy, acceptance report, and UUID readback"
    - id: dq_temporal_representativeness
      applies_to: "foreground records"
      requirement: "Use a complete and current production accounting period representative of the declared technology; identify campaign gaps, idle periods, prototypes, and non-routine test loads."
      evidence: "production calendar, meter coverage, accounting-period reconciliation, and deviation log"
    - id: dq_geographical_technological_representativeness
      applies_to: "foreground sites and upstream datasets"
      requirement: "Represent every included site, supplier route, assembly technology, test route, and energy geography; document substitutions and their effect on representativeness."
      evidence: "site and supplier list, route map, technology record, dataset metadata, and substitution assessment"
    - id: dq_completeness_and_mass_balance
      applies_to: "BOM, materials, outputs, wastes, and inventory change"
      requirement: "Reconcile accepted net product mass and known configuration inputs. Small-mass electronics, precious or critical materials, batteries, regulated substances, hazardous wastes, and direct emissions shall not be excluded solely because their mass is small."
      evidence: "BOM-to-scale reconciliation, material declarations, waste manifests, emission records, unresolved-composition log, and mass-balance residual"
    - id: dq_primary_secondary_separation
      applies_to: "owned operations and purchased inputs"
      requirement: "Use direct foreground records for controlled manufacturing, assembly, testing, calibration, packaging, and waste operations. Identify supplier-specific and secondary datasets separately with time, geography, technology, and quality metadata."
      evidence: "meters and operational records, supplier declarations, dataset metadata, and data-quality assessment"
    - id: dq_allocation_reproducibility
      applies_to: "shared operations"
      requirement: "Every allocation shall be reproducible from retained totals, drivers, population, period, and formula, with sensitivity disclosed when the choice can materially change results."
      evidence: "allocation worksheet, meter total, driver records, and sensitivity result"
    - id: dq_confidential_configuration_gaps
      applies_to: "restricted or customer-specific components"
      requirement: "Confidentiality does not justify silently omitting mass or burden. Aggregate restricted components only to the level necessary for disclosure, retain auditable evidence, and report unresolved composition or dataset substitutions."
      evidence: "controlled evidence register, aggregated mass record, reviewer access statement, and unresolved-data declaration"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm that the selected reference product flow is 1423adf5-00aa-48ab-a228-5935b58a21ed, its type is Product flow, its CPC classification is 48220, its reference property is Mass 93a60a56-a3c8-11da-a746-0800200b9a66, and the reference unit group and unit are Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "foreground data package"
    rule: "Fail conformance when apparatus subtype, model/configuration, manufacturing geography and period, net mass, assembly route, acceptance protocol, or applicable electronic, radio-frequency, power, cooling, battery, packaging, service-life, and operating-profile qualifiers are missing."
    source_ids:
      - iec-63366-2025
      - international-epd-pcr-2024-06
  - rule_id: validate_reference_mass
    applies_to: "normalized inventory"
    rule: "Confirm that the reference output equals 1 kg accepted net apparatus, packaging is reported separately, and all attributable input and output records use the same accepted-output denominator."
    source_ids:
      - international-epd-pcr-2024-06
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_process_coverage
    applies_to: "system boundary and process map"
    rule: "Confirm that supplier inputs and inbound logistics, applicable electronic and radio-frequency assembly, final assembly/testing/calibration, packaging, production losses, rejects, rework, waste treatment, and direct emissions are included or explicitly justified as not applicable."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - chalmers-active-safety-radar-2023
  - rule_id: validate_exact_flow_selection
    applies_to: "non-reference inventory identities"
    rule: "Treat site-specific component, energy, transport, waste, and elementary-flow rows without exact reviewed Tiangong identities as unresolved; do not silently substitute a semantically approximate hybrid-search candidate."
    source_ids: []
  - rule_id: validate_allocation_and_reconciliation
    applies_to: "shared burdens, mass balance, yield, and rework"
    rule: "Confirm that direct metering or subdivision was attempted first, every remaining allocation is reproducible, and input-output-rework-waste-inventory reconciliation has a disclosed residual."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_data_quality_disclosure
    applies_to: "publication readiness"
    rule: "Confirm temporal, geographical, technological, completeness, precision, consistency, supplier-data coverage, exclusions, unresolved composition, and downstream-stage exclusions are documented; an inconclusive or materially incomplete check fails by default."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - chalmers-surface-radar-2023
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground manufacturing data packages and their process or lifecyclemodel projections for a declared radar, radio navigational aid, or radio remote control apparatus configuration"
  allowed_use: "Product- and site-specific manufacturing LCI normalized to 1 kg accepted net apparatus; upstream supply-chain linking; contribution analysis; downstream models that separately add declared installation, use, maintenance, service-life, and end-of-life scenarios"
  excluded_use: "Direct comparison of unlike apparatus subtypes or performance classes; use-phase or full-life-cycle claims without a declared duty cycle, energy profile, service life, maintenance, installation, and end-of-life scenario; substitution of undisclosed generic electronics for configuration-specific inputs; claims of CPC mapping acceptance"
  required_metadata: "PCR id and version state; apparatus subtype; model and configuration; intended application; manufacturer and geography; production period; BOM and supplier-data coverage; assembly, test, and calibration route; net product mass; PCB/electronic and radio-frequency configuration; power, cooling, and battery presence; acceptance protocol; exact flow identities; allocation; packaging; exclusions; unresolved data; downstream stages included or excluded"
  required_quality_disclosure: "Foreground measurement coverage; temporal, geographical, and technological representativeness; completeness and mass balance; supplier and secondary dataset quality; allocation and sensitivity; waste and emission coverage; restricted-data aggregation; unresolved UUID or composition gaps; validation checks performed and skipped"
  update_trigger: "Change in apparatus subtype or configuration, BOM, PCB or radio-frequency architecture, manufacturing or supplier site, assembly/test technology, acceptance protocol, energy or transport geography, packaging, allocation driver, data source, production period, or any change that materially affects the normalized inventory or its representativeness"
