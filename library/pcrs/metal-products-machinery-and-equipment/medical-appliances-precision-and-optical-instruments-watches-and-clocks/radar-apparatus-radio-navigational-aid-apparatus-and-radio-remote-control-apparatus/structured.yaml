    applies_to: "product configuration and bill of materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile the accepted net product mass to the configured bill of materials, subassemblies, incorporated consumables, and explicitly documented mass gaps; do not infer unreported component composition from a different radar or electronics product."
  - id: energy_measurement
    applies_to: "electricity, fuels, compressed air, thermal energy, and test energy"
    required_property_ref:
      name: "energy property selected for the exact carrier"
