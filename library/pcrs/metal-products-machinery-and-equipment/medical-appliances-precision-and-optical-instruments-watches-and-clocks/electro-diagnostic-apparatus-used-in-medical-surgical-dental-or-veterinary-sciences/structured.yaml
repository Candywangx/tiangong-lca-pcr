measurement_rules:
  - id: reference_mass
    applies_to: "accepted finished apparatus and every included reusable accessory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize manufacturing inventory to 1 kg net accepted apparatus. Record gross delivered mass, packaging mass, and net apparatus mass separately; do not infer mass from a catalogue family or nominal shipping weight."
  - id: configuration_mass_reconciliation
    applies_to: "host, probes/accessories, display/computing, power hardware, installed battery, and included consumables"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The sum of declared configuration masses shall reconcile with net apparatus mass. Consumables and packaging shall remain separate even when supplied in the same shipment."
  - id: manufacturing_activity_units
    applies_to: "electricity, fuels, water, compressed air, and process chemicals"
    required_property_ref:
      name: "Activity-specific property"
      uuid: ""
    required_unit: "Native metered unit"
    rule: "Preserve native meter or invoice units and document every conversion before normalization to 1 kg accepted apparatus. Do not substitute rated equipment power for measured manufacturing electricity without disclosure."
  - id: use_intensity_basis
    applies_to: "active, idle, standby, charging, and off modes"
    required_property_ref:
      name: "Energy or power with time"
      uuid: ""
    required_unit: "kWh, W, h, examination, or monitoring-hour"
    rule: "Report measured power by mode, mode hours, examinations or monitoring hours, annual utilization, service life, and geography. A product-mass result shall not silently include an unspecified use profile."
  - id: battery_accounting
    applies_to: "installed and replacement batteries"
    required_property_ref:
      name: "Mass and rated energy"
      uuid: ""
    required_unit: "kg and Wh"
    rule: "Record battery chemistry, rated capacity, installed mass, number of replacements, charging losses when measured, and end-of-life route separately from the host apparatus."
  - id: cleaning_and_consumables_accounting
    applies_to: "disinfectants, water, wipes, probe covers, gel, electrodes, recording media, sample lines, and similar items"
    required_property_ref:
      name: "Mass, volume, or count"
      uuid: ""
    required_unit: "kg, L, or item"
    rule: "Record per-cycle quantity, cycle count, reusable-item lifetime, product concentration, and waste route. Do not embed use consumables in host mass."
