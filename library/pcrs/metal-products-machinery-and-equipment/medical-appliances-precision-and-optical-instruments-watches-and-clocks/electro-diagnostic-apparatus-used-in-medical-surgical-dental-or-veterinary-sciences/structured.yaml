allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared manufacturing lines and facilities"
    rule: "Subdivide and meter modality, subassembly, assembly, calibration, test, and packaging activities directly whenever technically feasible."
    source_ids:
      - iec-60601-1-9-2007
  - rule_id: allocation_shared_manufacturing
    applies_to: "residual shared utilities and overhead"
    rule: "When direct metering is not feasible, allocate electricity and utilities using a documented causal driver such as machine time, line time, test duration, or batch occupancy. Use mass only when no more causal driver is available, and disclose sensitivity."
    source_ids:
      - iec-60601-1-9-2007
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework, scrap, and rejected apparatus"
    rule: "Assign rework and reject burdens to the production batch that caused them; do not dilute them across unrelated product families."
    source_ids:
      - kokare-cardiac-monitoring-lca-2021
  - rule_id: allocation_shared_use_infrastructure
    applies_to: "central stations, remote displays, servers, storage, printers, and shared chargers"
    rule: "Allocate shared use-stage equipment by measured device-hours, monitoring-hours, examinations, stored data, or another documented causal service driver; report excluded shared infrastructure."
    source_ids:
      - jacr-ultrasound-lca-2026
  - rule_id: allocation_recycling
    applies_to: "recovered materials and reusable parts"
    rule: "Report gross treatment burdens and recovered outputs. Apply cut-off, substitution, or another recycling approach only as required by the governing study method; state the approach and do not combine approaches within one result."
    source_ids:
      - eu-weee-directive-2012-19
      - eu-batteries-regulation-2023-1542
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_supplier_mass
      process_id: "electronics_display_and_power_subassembly_enclosure_and_mechanical_subassembly"
      flow_role: "component and material inputs"
      record_type: "bill of materials, supplier specification, receiving record, measured mass"
      raw_fields: "part id; supplier; material or component family; quantity; unit mass; included configuration block; battery chemistry and capacity when applicable"
      collection_method: "Reconcile engineering BOM, procurement records, and measured sample mass for the exact configuration"
      unit: "kg, item, Wh"
      frequency: "each design revision and production period"
      temporal_coverage: "current design and reporting year"
      site_scope: "all manufacturing sites and material suppliers in scope"
      aggregation_rule: "Sum quantity multiplied by verified unit mass; retain supplier-specific datasets before normalization"
      quality_evidence: "revision-controlled BOM, scale calibration, supplier declaration, sampling record"
    - protocol_id: cp_manufacturing_activity
      process_id: "all_manufacturing_processes"
      flow_role: "electricity, fuels, water, compressed air, chemicals, test and calibration activity"
      record_type: "meters, invoices, equipment logs, batch travellers"
      raw_fields: "activity type; meter start/end; native unit; batch; accepted output; machine time; test time; allocation driver"
      collection_method: "Prefer submetering; otherwise reconcile invoices to line logs and documented allocation drivers"
      unit: "native meter unit, h"
      frequency: "each batch or at least monthly"
      temporal_coverage: "representative continuous 12-month period where available"
      site_scope: "each foreground and material supplier manufacturing site"
      aggregation_rule: "Allocate by direct measurement, machine time, line time, test duration, or disclosed fallback driver"
      quality_evidence: "meter identification, calibration, invoice reconciliation, production log"
    - protocol_id: cp_output_scrap_and_rework
      process_id: "all_subassembly_processes"
      flow_role: "accepted output, rejects, scrap, and rework"
      record_type: "production and waste records"
      raw_fields: "accepted mass; rejected mass; reworked mass; material; waste code; destination"
      collection_method: "Weigh outputs and reconcile to batch input and stock change"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as manufacturing activity"
      site_scope: "each manufacturing site"
      aggregation_rule: "Sum by product, material, and destination; keep rework separate"
      quality_evidence: "calibrated scales, waste transfer record, mass-balance sign-off"
    - protocol_id: cp_accessory_configuration
      process_id: "modality_probe_and_accessory_subassembly"
      flow_role: "host, probe, transducer, cable, cuff, sensor module, dock, and accessory boundary"
      record_type: "configuration BOM and product documentation"
      raw_fields: "modality; installation; host id; accessory id; included/excluded status; unit mass; reusable/single-use status; patient-contact class"
      collection_method: "Verify supplied configuration against BOM, packing list, and instructions for use"
      unit: "kg, item"
      frequency: "each configuration revision"
      temporal_coverage: "current configuration"
      site_scope: "all configurations represented by the dataset"
      aggregation_rule: "Sum included reusable items separately from host; never average across undeclared configurations"
      quality_evidence: "signed configuration record, packing list, instructions for use"
    - protocol_id: cp_final_assembly_mass_balance
      process_id: "final_assembly_calibration_and_packaging"
      flow_role: "transferred subassemblies, finished product, rejects, and calibration materials"
      record_type: "batch traveller, quality-release record, scale record"
      raw_fields: "input masses; net accepted mass; rejected mass; rework; serial or lot; calibration status"
      collection_method: "Reconcile every released batch to configuration BOM and weighed output"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "reporting period"
      site_scope: "each final assembly site"
      aggregation_rule: "Divide net accepted batch inventory by net accepted output mass"
      quality_evidence: "calibrated scale, quality-release signature, reconciliation report"
    - protocol_id: cp_packaging_records
      process_id: "final_assembly_calibration_and_packaging"
      flow_role: "primary, secondary, and tertiary packaging"
      record_type: "packaging BOM, supplier record, sample weighing"
      raw_fields: "material; packaging level; unit mass; quantity; recycled content if documented"
      collection_method: "Measure representative packaging sets and reconcile to purchased quantity"
      unit: "kg"
      frequency: "each packaging revision"
      temporal_coverage: "current packaging design"
      site_scope: "each packaging configuration"
      aggregation_rule: "Sum by material and packaging level per net kg apparatus"
      quality_evidence: "scale calibration, packaging specification, sample record"
    - protocol_id: cp_use_intensity_and_power
      process_id: "use_maintenance_and_reprocessing"
      flow_role: "examination or monitoring service and electricity by mode"
      record_type: "plug meter, onboard log, facility meter, scheduling record"
      raw_fields: "active/idle/standby/charging/off power; mode hours; examinations; monitoring hours; annual utilization; service life; geography"
      collection_method: "Measure representative operation and reconcile mode hours to scheduling or monitoring logs"
      unit: "W, h, kWh, examination"
      frequency: "representative measurement campaign plus annual reconciliation"
      temporal_coverage: "declared use year and service life"
      site_scope: "each use setting represented"
      aggregation_rule: "Sum mode power multiplied by mode time and separately report service denominator"
      quality_evidence: "meter calibration, log completeness, sampling plan, scenario approval"
    - protocol_id: cp_maintenance_and_battery_records
      process_id: "use_maintenance_and_reprocessing"
      flow_role: "replacement parts, batteries, and maintenance"
      record_type: "service work orders, parts issue, battery test and purchasing records"
      raw_fields: "part id; mass; quantity; date; reason; battery chemistry; capacity; charging data; disposal route"
      collection_method: "Reconcile service records to installed population and service life"
      unit: "kg, item, Wh"
      frequency: "each maintenance event"
      temporal_coverage: "full declared service life or justified projection"
      site_scope: "each use setting represented"
      aggregation_rule: "Sum original and replacement parts separately; normalize to service and mass denominators"
      quality_evidence: "work order, part receipt, battery test, traceable projection method"
    - protocol_id: cp_consumables_and_reprocessing
      process_id: "use_maintenance_and_reprocessing"
      flow_role: "consumables, cleaning, disinfection, sterilization, and resulting waste"
      record_type: "purchase/issue records, procedure logs, reprocessing logs, waste records"
      raw_fields: "item or chemical; concentration; quantity; cycle; patient-contact class; probe/accessory id; water; energy; waste route"
      collection_method: "Reconcile issued quantities and documented cycles to examinations or monitoring hours; follow manufacturer instructions"
      unit: "kg, L, kWh, item, cycle"
      frequency: "each procedure or representative campaign with annual reconciliation"
      temporal_coverage: "declared use year and service life"
      site_scope: "each clinical or veterinary setting represented"
      aggregation_rule: "Sum by modality, contact class, and cycle; multiply per-cycle records only by verified cycle count"
      quality_evidence: "instructions for use, infection-control protocol, lot record, waste manifest"
    - protocol_id: cp_end_of_life_records
      process_id: "end_of_life_management"
      flow_role: "retired equipment, decontamination, batteries, recovery, and residuals"
      record_type: "asset retirement, decontamination certificate, treatment and weighing records"
      raw_fields: "host/accessory/battery mass; infection status; decontamination; treatment route; recovered output; residual"
      collection_method: "Trace representative retired units through authorized treatment"
      unit: "kg, item"
      frequency: "each retirement batch"
      temporal_coverage: "declared retirement period"
      site_scope: "all end-of-life routes represented"
      aggregation_rule: "Mass-balance input to recovered and residual outputs; retain route-specific results"
      quality_evidence: "asset register, decontamination certificate, scale ticket, treatment certificate"
  calculation_rules:
    - id: calc_manufacturing_per_kg
      applies_to: "manufacturing inventory rows"
      rule: "Normalized amount = batch amount divided by net accepted apparatus or subassembly mass; exclude rework output from the denominator until accepted"
      inputs:
        - "batch activity"
        - "accepted output mass"
      output: "amount per kg accepted output"
      source_ids:
        - kokare-cardiac-monitoring-lca-2021
    - id: calc_configuration_mass_balance
      applies_to: "final apparatus configuration"
      rule: "Net apparatus mass = host + included reusable probes/accessories + integrated/separately included display/computing/storage + power hardware + installed battery; delivered consumables and packaging are separate checks"
      inputs:
        - "configuration masses"
      output: "reconciled net apparatus mass"
      source_ids:
        - who-oxygen-therapy-monitoring-2020
        - who-radiotherapy-equipment-ultrasound-2021
    - id: calc_use_electricity
      applies_to: "use electricity"
      rule: "Lifetime electricity = sum over modes of measured power multiplied by mode hours, divided by 1000 for W-to-kWh conversion, plus separately measured charging losses"
      inputs:
        - "mode power"
        - "mode time"
        - "service life"
        - "charging loss"
      output: "kWh per service life, examination or monitoring-hour, and kg apparatus"
      source_ids:
        - iec-60601-1-9-2007
        - jacr-ultrasound-lca-2026
    - id: calc_consumables_and_disinfection
      applies_to: "consumables and reprocessing"
      rule: "Lifetime quantity = measured or purchase-reconciled quantity per cycle multiplied by verified cycle count; do not apply one modality's cycle to another"
      inputs:
        - "per-cycle quantity"
        - "examinations or monitoring events"
        - "contact class"
        - "reuse count"
      output: "kg, L, kWh, or items per service denominator and kg apparatus"
      source_ids:
        - cdc-disinfection-healthcare-equipment-2008
        - eu-mdr-2017-745
    - id: calc_replacement_parts
      applies_to: "maintenance and batteries"
      rule: "Lifetime replacement inventory = sum of actual replacement events; projections shall use documented survival or service assumptions and be labelled as projections"
      inputs:
        - "service records"
        - "part mass"
        - "battery chemistry"
        - "service life"
      output: "replacement mass and count per service life and kg apparatus"
      source_ids:
        - eu-batteries-regulation-2023-1542
    - id: calc_end_of_life_mass_balance
      applies_to: "end-of-life treatment"
      rule: "Retired input mass = recovered product output + residual waste output + measured direct releases, within documented stock change and moisture corrections"
      inputs:
        - "retired mass"
        - "recovered mass"
        - "residual mass"
        - "direct releases"
      output: "route-specific mass balance"
      source_ids:
        - eu-weee-directive-2012-19
        - eu-batteries-regulation-2023-1542
  data_quality_requirements:
    - id: dq_identity_and_configuration
      applies_to: "all datasets"
      requirement: "Identify modality, installation, host/accessory boundary, display/computing/power architecture, battery boundary, consumables boundary, product mass, and intended human or veterinary use; do not represent a model-family average without sales-weighted configuration evidence"
      evidence: "configuration BOM, instructions for use, packing list, product label, weighting method"
    - id: dq_mass_completeness
      applies_to: "manufacturing and end of life"
      requirement: "Reconcile material and component inputs, accepted output, rejects, stock change, packaging, batteries, recovered outputs, and residuals; disclose unresolved mass"
      evidence: "signed mass balance and calibrated scale records"
    - id: dq_temporal_and_geographic
      applies_to: "all foreground and background data"
      requirement: "Use data representative of the declared production and use geography and year; identify supplier, grid, treatment, or use proxies"
      evidence: "dataset metadata, supplier coverage table, proxy log"
    - id: dq_use_profile
      applies_to: "use-stage results"
      requirement: "Report measured power modes, hours, examinations or monitoring hours, utilization, service life, maintenance, data infrastructure, and electricity geography; provide sensitivity for materially uncertain drivers"
      evidence: "meter logs, scheduling records, service records, scenario analysis"
    - id: dq_reprocessing
      applies_to: "cleaning and disinfection"
      requirement: "Match patient-contact class and manufacturer instructions; distinguish console, external probe, endocavitary probe, surgical probe, reusable accessory, and single-use cover scenarios"
      evidence: "instructions for use, infection-control approval, reprocessing logs"
    - id: dq_quantitative_evidence
      applies_to: "all inventory amounts"
      requirement: "Use foreground records or explicit calculations from collected records. No category-wide default amount from this PCR may replace missing foreground data"
      evidence: "collection protocol linkage, raw record retention, calculation audit"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the product flow UUID, Mass property UUID, Units of mass UUID, kg reference unit, and 1 kg amount; reject a stand-alone probe, sensor, accessory, therapeutic unit, ionizing-radiation apparatus, or single model as the category reference."
    source_ids: []
  - rule_id: validate_configuration_declaration
    applies_to: "product identity"
    rule: "Require every configuration dimension in section 1 and every qualifier in section 3; fail validation when host/accessory, display/computing/power, battery, consumables, or installation boundaries are ambiguous."
    source_ids:
      - who-oxygen-therapy-monitoring-2020
      - who-radiotherapy-equipment-ultrasound-2021
      - eu-mdr-2017-745
  - rule_id: validate_modality_separation
    applies_to: "aggregation and comparison"
    rule: "Do not aggregate monitoring, ECG, ultrasound, or other electro-diagnostic apparatus without retaining modality-specific configuration, manufacturing, use, consumable, and disinfection records."
    source_ids:
      - iec-60601-2-37-2024
      - who-oxygen-therapy-monitoring-2020
  - rule_id: validate_mass_balance
    applies_to: "manufacturing and end of life"
    rule: "Check net apparatus mass against host, accessories, display/computing, power, battery, consumables, packaging, rejects, and treatment outputs; report any unreconciled mass."
    source_ids:
      - kokare-cardiac-monitoring-lca-2021
  - rule_id: validate_use_intensity
    applies_to: "use-stage claims"
    rule: "Require annual examinations or monitoring hours, mode power and time, service life, utilization, maintenance, charging, data infrastructure, and electricity geography; a generic “in use” scenario is inconclusive."
    source_ids:
      - iec-60601-1-9-2007
      - jacr-ultrasound-lca-2026
  - rule_id: validate_disinfection
    applies_to: "reprocessing claims"
    rule: "Require patient-contact class, manufacturer method, agent and concentration, quantity, cycle count, reusable-item lifetime, and waste route; probe covers shall not silently eliminate required disinfection."
    source_ids:
      - cdc-disinfection-healthcare-equipment-2008
      - eu-mdr-2017-745
  - rule_id: validate_battery_and_consumables
    applies_to: "product and use boundary"
    rule: "Separate original installed batteries, replacements, charging losses, diagnostic consumables, cleaning materials, and delivered starter supplies; reject double counting between product mass and use inventory."
    source_ids:
      - who-oxygen-therapy-monitoring-2020
      - eu-batteries-regulation-2023-1542
  - rule_id: validate_source_and_protocol_links
