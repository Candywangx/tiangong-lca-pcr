      unit: "kg"
      frequency: "each lot or transfer, aggregated for the declared period"
      temporal_coverage: "full declared reporting period"
      site_scope: "all foreground steps and outsourced controlled transfers"
      aggregation_rule: "calculate net qualifying transfer and stock-adjusted output; normalize through calc_reference_normalization"
      quality_evidence: "scale status, sampling plan, transfer record, release authorization, stock reconciliation"
    - protocol_id: cp_waste_and_rework_records
      process_id: "instrument_assembly_configuration_verification"
