      record_type: "waste scales, manifests, nonconformance and rework logs"
      raw_fields: "waste type; material; mass; destination; hazardous status; lot; reject reason; rework entry; rework exit; final disposition"
      collection_method: "reconcile weighed waste and disposition documents to nonconformance and rework records"
      unit: "kg or native selected waste-flow unit"
      frequency: "each removal, reject, or rework event, aggregated for the declared period"
      temporal_coverage: "same period as qualifying production"
      site_scope: "all foreground sites and controlled contractors"
      aggregation_rule: "count only waste leaving the route; retain rework burdens with qualifying output; normalize through calc_reference_normalization"
