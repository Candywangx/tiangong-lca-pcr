allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "multi-product and shared foreground processes"
    rule: "First avoid allocation by subdividing processes, meters, work orders, and material issues so that product-specific inputs, outputs, wastes, and releases are directly assigned."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_causality
    applies_to: "remaining shared burdens"
    rule: "When subdivision is not practicable, use a documented physical causal driver such as machine time, test time, energy demand, mass throughput, or occupied production time that reflects resource use; do not default to product mass when it is not causal."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_economic_fallback
    applies_to: "shared burdens without a defensible physical relation"
    rule: "Use economic allocation only when subdivision and a defensible physical causal relationship are unavailable. Record prices, period, currency, source, allocation shares, and a sensitivity check."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework loops and failed units"
    rule: "Keep burdens of internal rework and failed tests with the qualifying output; count only rejects leaving the foreground route as waste and prevent the same unit or input from being counted twice."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recovery_no_double_credit
    applies_to: "recyclable scrap and recovered materials"
    rule: "Record the outgoing waste or recovered-material flow and treatment destination. Do not assign an avoided-product credit inside this factory-gate foreground package unless a declared downstream method requires it; disclose any such method and prevent double credit with downstream recycling modelling."
    source_ids:
      - eu-pef-2021-2279
      - iec-63366-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_component_records
      process_id: "instrument_assembly"
      flow_role: "materials, components, subassemblies, included accessories"
      record_type: "approved BOM, purchasing, stores issue, supplier, and stock records"
      raw_fields: "item id; revision; description; supplier; Tiangong flow id; quantity; unit; measured unit mass; issued amount; returns; opening and closing stock; lot; product model"
      collection_method: "reconcile approved BOM to actual stores issues and supplier receipts by product and lot"
      unit: "native purchasing unit and kg after documented conversion"
      frequency: "each production lot or work order, aggregated for the declared period"
      temporal_coverage: "full declared reporting period with start and end dates"
      site_scope: "every site and outsourced assembly step in scope"
      aggregation_rule: "sum net issues plus attributable stock change; normalize through calc_reference_normalization"
      quality_evidence: "approved BOM revision, issue/return records, supplier identity, mass measurement record, reconciliation sign-off"
    - protocol_id: cp_utility_and_consumable_records
      process_id: "instrument_assembly"
      flow_role: "utilities and assembly consumables"
      record_type: "meters, invoices, stores issues, equipment logs"
      raw_fields: "carrier or material; meter id; start and end reading; invoice quantity; unit; conversion factor; allocation driver; downtime; product output"
      collection_method: "read dedicated meters where available; otherwise reconcile invoices or stores issues to documented causal drivers"
      unit: "native meter or invoice unit plus normalized unit"
      frequency: "meter or invoice interval, aggregated for the declared period"
      temporal_coverage: "same period as qualifying production, with gaps identified"
      site_scope: "every controlled production area in scope"
      aggregation_rule: "subtract non-production and out-of-scope use; allocate by documented causal driver; normalize through calc_reference_normalization"
      quality_evidence: "meter calibration or verification record, invoice, stores record, driver calculation, coverage statement"
    - protocol_id: cp_intermediate_and_output_mass
      process_id: "instrument_assembly_finishing_cleaning_configuration_verification_packaging_release"
      flow_role: "intermediate and qualifying output transfers"
