    - protocol_id: cp_direct_release_records
      process_id: "instrument_assembly_finishing_cleaning"
      flow_role: "direct releases to air, water, or soil"
      record_type: "continuous or periodic monitoring, permits, mass-balance calculations"
      raw_fields: "substance; compartment; sampling point; concentration; volume; duration; detection limit; calculation factor; operating status; product allocation driver"
      collection_method: "use site monitoring or documented engineering calculation for releases under operational control"
      unit: "property and unit of selected elementary flow"
      frequency: "monitoring or permit interval, aggregated for the declared period"
      temporal_coverage: "same period as qualifying production, with non-detects and gaps disclosed"
      site_scope: "every emission point serving in-scope operations"
      aggregation_rule: "calculate released quantity from measured concentration and volume or approved formula; allocate by documented causal driver"
