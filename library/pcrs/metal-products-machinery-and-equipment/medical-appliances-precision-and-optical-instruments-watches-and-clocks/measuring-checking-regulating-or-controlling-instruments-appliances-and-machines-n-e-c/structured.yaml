      raw_fields: "product model; packaging item; material; issued quantity; returned quantity; unit mass; included accessory; net product mass; packaging mass; waste; lot; release status"
      collection_method: "reconcile packaging BOM and issues to net released product and separately weighed packaging"
      unit: "item and kg"
      frequency: "each released lot, aggregated for the declared period"
      temporal_coverage: "all qualifying releases in the declared period"
      site_scope: "every in-scope packaging site"
      aggregation_rule: "sum net packaging issues and waste; keep packaging outside net product mass; normalize through calc_reference_normalization"
      quality_evidence: "approved packaging BOM, issue/return record, scale record, release record, reconciliation sign-off"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory amount"
      rule: "normalized amount = attributable amount for the declared period / net kg of qualifying released CPC 48269 product for the same period"
      inputs:
        - "attributable input"
        - output
        - waste
        - "or release"
        - "net qualifying output mass"
        - "matched time"
        - site
        - model
        - "and route boundary"
      output: "amount per 1 kg net qualifying finished product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_count_to_mass
      applies_to: "item-count records"
      rule: "converted mass = item count × measured representative net mass per item; stratify by model or configuration and retain the sampling result"
      inputs:
        - "item count"
        - "measured unit mass"
        - "model or lot stratum"
      output: "kg"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_mass_reconciliation
      applies_to: "each mass-bearing foreground process"
      rule: "residual = stock-adjusted material inputs − product transfers − waste outputs − measured direct mass releases; investigate and disclose the residual rather than forcing it to zero"
      inputs:
        - "opening and closing stock"
        - "material inputs"
        - "product outputs"
        - wastes
        - "direct releases"
      output: "mass-balance residual and reconciliation status"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_utility_allocation
      applies_to: "shared utilities and services"
      rule: "attributable amount = shared total × documented causal-driver share; use subdivision first and economic allocation only as the declared fallback"
      inputs:
        - "shared total"
        - "product-specific driver"
        - "total driver"
        - "allocation method and period"
      output: "allocated utility or service amount"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_rework_accounting
      applies_to: "failed tests and rework loops"
      rule: "include all extra materials, utilities, tests, and wastes caused by rework in the period numerator; include only finally qualifying output in the denominator and count final rejects once"
      inputs:
        - "rework entries and exits"
        - "additional inputs"
        - "final disposition"
        - "qualifying output"
      output: "rework-adjusted normalized inventory"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and every product-specific row"
      requirement: "Match the declared model or homogeneous family, CPC 48269 scope, Tiangong reference-flow UUID, function, range, accuracy or uncertainty specification where relevant, configuration, accessories, and release state."
      evidence: "product specification, approved BOM and revisions, classification record, flow lookup confirmation, release record"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Use records covering the same declared production period and identify start and end dates, shutdowns, ramp-up, abnormal batches, data gaps, and any extrapolation."
      evidence: "meter and production timestamps, invoices, work orders, gap and representativeness assessment"
    - id: dq_geographic_technology
      applies_to: "site and supplier coverage"
      requirement: "Identify every manufacturing and controlled outsourced site, route, technology, and supplier dataset geography; disclose aggregation and proxies."
      evidence: "site list, route map, supplier records, dataset metadata, proxy register"
    - id: dq_completeness
      applies_to: "BOM, utilities, wastes, releases, and outsourced steps"
      requirement: "Reconcile the bill of materials, utilities, outputs, wastes, direct releases, and outsourced operations to production records. Quantify missing coverage and document every exclusion and materiality or sensitivity check."
      evidence: "reconciliation tables, missing-data register, exclusion rationale, sensitivity result"
    - id: dq_measurement_traceability
      applies_to: "scales, meters, tests, and calibration records"
      requirement: "Retain equipment identity, measurement method, status, resolution, uncertainty where applicable, calibration or verification evidence, and the traceability chain used for product release measurements."
      evidence: "equipment register, calibration certificate, verification record, measurement procedure, uncertainty statement"
    - id: dq_allocation_transparency
      applies_to: "shared processes and multi-product operations"
      requirement: "Report subdivision decisions, causal drivers, economic fallback data if used, allocation shares, period, and sensitivity; ensure shares reconcile to the shared total."
      evidence: "meter map, work-order time, driver calculation, price record, sensitivity analysis"
    - id: dq_source_and_conversion_traceability
      applies_to: "all mapped flows and conversions"
      requirement: "Preserve original record unit, conversion factor, selected Tiangong flow identity, source or supplier dataset, and reviewer approval for each mapping."
      evidence: "raw record, conversion worksheet, UUID lookup confirmation, mapping log, review sign-off"
validation_rules:
  - rule_id: validation_identity_and_scope
    applies_to: "product identity"
    rule: "Fail if the reference product is not demonstrably within CPC 48269, if a sibling subclass or separately supplied part is represented, or if model/family, function, range, performance specification, configuration, release state, route, site, geography, or period is missing."
    source_ids:
      - un-cpc-3-48269
  - rule_id: validation_reference_uuid_chain
    applies_to: "reference flow"
    rule: "Fail unless the reference product flow is a4e0f811-b832-4e6b-8360-3c32184b14a0, the reference flow property is 93a60a56-a3c8-11da-a746-0800200b9a66, the unit group is 93a60a57-a4c8-11da-a746-0800200c9a66, and the reference unit is kg."
    source_ids:
      - un-cpc-3-48269
  - rule_id: validation_qualifiers_and_mass
    applies_to: "quantitative reference"
    rule: "Fail if net qualifying output mass is not measured or documented, packaging treatment or included accessories are unclear, or item-to-mass conversion lacks model- or lot-specific evidence."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_process_and_protocol_coverage
    applies_to: "process inventory"
    rule: "Fail if a required process lacks a detailed inventory, if an applicable conditional process is omitted without disclosure, or if a collected/calculated row lacks its named collection protocol and matching period/site boundary."
    source_ids:
      - eu-pef-2021-2279
      - iec-63366-2025
  - rule_id: validation_mass_reconciliation
    applies_to: "mass-bearing processes"
    rule: "Flag as error an unexplained mass-balance residual or a one-to-one intermediate mass assumption unsupported by records; report measured stock change, rework, rejects, waste, and direct releases."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_calibration_release
    applies_to: "configuration, calibration, verification, and final test"
    rule: "Fail if the declared calibration or verification state is not supported by release records, or where calibration is claimed, if the reference, procedure, result, uncertainty where applicable, and metrological traceability evidence are missing."
    source_ids:
      - bipm-jcgm-200-2012
  - rule_id: validation_allocation_and_recycling
    applies_to: "shared burdens, rejects, and recovered materials"
    rule: "Fail if shared burdens lack subdivision or an explicit allocation method and driver, if allocation shares do not reconcile, if internal rework is counted as both waste and product, or if recycling credit is double counted."
    source_ids:
      - eu-pef-2021-2279
      - iec-63366-2025
  - rule_id: validation_completeness_and_sources
    applies_to: "data package quality"
    rule: "Fail if BOM, utilities, wastes, direct releases, outsourced steps, upstream datasets, unit conversions, exclusions, missing coverage, proxies, or source references cannot be traced to evidence and a declared completeness review."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package that may be published after review as a secondary_dataset and/or background_dataset"
  downstream_use: "Construction of product-specific or representative process datasets and downstream lifecyclemodel projections for declared CPC 48269 instrument manufacture"
  allowed_use: "Factory-gate modelling for the declared model or homogeneous family, function, performance specification, configuration, route, site, geography, period, calibration or verification state, accessory scope, and packaging treatment"
  excluded_use: "Use as a cradle-to-grave result without added downstream stages; comparison of products with different functions, measuring ranges, accuracy or uncertainty performance, service lives, or configurations without an additional functionally equivalent basis; automatic use for sibling CPC subclasses or separately supplied parts"
  required_metadata: "canonical PCR id; CPC reference; product model/family and homogeneity rationale; function; measured or controlled quantity; operating principle; range; accuracy class or uncertainty specification where relevant; implementation type; configuration and firmware where applicable; included accessories; net mass; packaging treatment; calibration/verification status; release criteria; route; sites; geography; reporting period; outsourced steps; upstream dataset links; allocation; exclusions; proxies; collection protocols; source ids"
  required_quality_disclosure: "record coverage; BOM and mass reconciliation; temporal, geographic, and technology representativeness; meter and scale status; calibration and metrological traceability evidence where applicable; allocation drivers; rework and reject treatment; missing data; proxies; exclusions; sensitivity/materiality checks; uncertainty and reviewer limitations"
  update_trigger: "Reassess and update when product function or performance specification, BOM, included accessories, configuration or firmware, manufacturing route or site, supplier mix, utility source, finishing or test technology, calibration or release method, allocation driver, packaging, classification scope, Tiangong UUID identity, or data representativeness changes materially."
