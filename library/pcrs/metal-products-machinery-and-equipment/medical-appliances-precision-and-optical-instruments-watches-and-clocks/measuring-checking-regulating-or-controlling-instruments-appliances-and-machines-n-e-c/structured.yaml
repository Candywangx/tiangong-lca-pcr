      raw_fields: "route; bath or coating id; material; issued amount; recovered amount; water; energy; incoming and outgoing product mass; waste; wastewater; release"
      collection_method: "reconcile route-specific batch records to issued materials, utilities, outputs, and treatment records"
      unit: "native unit and kg after documented conversion"
      frequency: "each finishing batch, aggregated for the declared period"
      temporal_coverage: "all applicable finishing batches in the declared period"
      site_scope: "every in-scope finishing line and controlled contractor"
      aggregation_rule: "sum net consumption and releases by route; normalize through calc_reference_normalization"
