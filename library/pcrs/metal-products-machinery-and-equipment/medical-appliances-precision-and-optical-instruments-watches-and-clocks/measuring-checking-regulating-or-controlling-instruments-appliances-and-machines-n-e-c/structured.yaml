      record_type: "configuration logs, calibration certificates, test records, equipment logs, service invoices"
      raw_fields: "product serial or lot; firmware or configuration; measurand; range; acceptance limit; result; measurement uncertainty where applicable; reference standard; traceability chain; certificate; test duration; energy; consumables; pass/fail; rework; final release"
      collection_method: "link each qualifying unit or statistically controlled lot to configuration and release evidence; reconcile utilities and consumables to test activity"
      unit: "declared measurand unit, time, energy, mass, and service unit as applicable"
      frequency: "each unit, lot, or test campaign, aggregated for the declared period"
      temporal_coverage: "all qualifying output and all failed or reworked tests in the declared period"
      site_scope: "every controlled test station and outsourced calibration or testing service"
      aggregation_rule: "count qualifying output only after release; include failed-test and rework burdens; normalize through calc_reference_normalization"
