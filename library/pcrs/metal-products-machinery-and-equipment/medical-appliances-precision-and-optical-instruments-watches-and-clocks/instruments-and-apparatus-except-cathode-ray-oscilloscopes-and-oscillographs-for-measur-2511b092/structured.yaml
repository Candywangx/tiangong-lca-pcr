allocation_rules:
  - rule_id: alloc_avoid
    applies_to: "shared_manufacturing_processes"
    rule: "Avoid allocation by separate metering, batch or line subdivision, or another defensible separation of processes and records directly attributable to the represented product."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: alloc_physical
    applies_to: "inseparable_shared_burdens"
    rule: "When allocation cannot be avoided, use a documented causal physical relationship that reflects the driver of the shared input or output, such as machine time, test time, energy demand, or mass where mass is causally relevant."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: alloc_other_relationship
    applies_to: "no_defensible_physical_relationship"
    rule: "If no relevant physical relationship can be demonstrated, use economic allocation or another justified relationship, disclose the data period and calculation, and report a sensitivity result for a materially different defensible method."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: alloc_scrap_and_recycling
    applies_to: "scrap_recycling_and_recovery"
    rule: "Report scrap and recovered material as visible output flows and state the upstream and end-of-life convention. Do not apply an avoided-burden credit inside this cradle-to-gate foreground package unless the declared governing methodology explicitly requires it."
    source_ids:
      - iec-63366-2025
      - iso-14044-2006
