      raw_fields: "product_model; BOM_revision; part_id; supplier; quantity_per_unit; issued_quantity; returned_quantity; stock_change; unit_mass; included_battery_flag"
      collection_method: "Reconcile the product-specific BOM to actual issues, returns, substitutions, and stock changes; verify part mass"
      unit: "kg and item count"
      frequency: "per production lot with monthly reconciliation"
      temporal_coverage: "same period as assembled output"
      site_scope: "every final assembly site"
      aggregation_rule: "net attributable part mass divided by assembled output mass"
      quality_evidence: "approved BOM, change notices, supplier declarations, measured part mass, and stock reconciliation"
    - protocol_id: cp_assembly_energy_auxiliaries
      process_id: "final_instrument_assembly"
      flow_role: "assembly energy and auxiliaries"
      record_type: "meters, purchase, issue, and stock records"
      raw_fields: "meter_id; carrier; reading; auxiliary_id; opening_stock; receipts; issues; closing_stock; allocation_driver"
      collection_method: "Submeter assembly energy and reconcile auxiliary consumption to production records"
      unit: "kWh or MJ; kg"
      frequency: "meter interval and per lot, aggregated monthly"
      temporal_coverage: "same period as assembled output"
      site_scope: "every final assembly site"
      aggregation_rule: "attributable energy or auxiliary quantity divided by assembled output mass"
      quality_evidence: "meter evidence, invoices, calibrated scales, and allocation worksheet"
    - protocol_id: cp_assembly_outputs
      process_id: "final_instrument_assembly"
      flow_role: "assembled output, scrap, rejects, and rework"
      record_type: "production and waste records"
      raw_fields: "assembled_output_mass; reject_mass; scrap_type; rework_entry; rework_exit; destination"
      collection_method: "Measure unique accepted output and wastes; track rework loops without double counting output"
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "same period as assembly inputs"
      site_scope: "every final assembly line"
      aggregation_rule: "accepted mass and waste mass by type normalized to accepted assembled output"
      quality_evidence: "calibrated scales, lot genealogy, nonconformance records, and waste manifests"
    - protocol_id: cp_test_inputs
      process_id: "calibration_test_packaging"
      flow_role: "assembled input, accessories, and packaging"
      record_type: "test intake, packaging BOM, and issue records"
      raw_fields: "serial_or_lot; assembled_mass; rework_passes; accessory_id; packaging_material; quantity; unit_mass; included_in_reference_mass"
      collection_method: "Link unique instruments to test intake and reconcile included accessories and packaging to product-specific issue records"
      unit: "kg and item count"
      frequency: "per lot or serial batch"
      temporal_coverage: "same period as released product"
      site_scope: "every calibration, test, and packaging site"
      aggregation_rule: "unique input and included-material mass divided by conforming released product mass"
      quality_evidence: "traceability record, packaging BOM, calibrated scale, and stock reconciliation"
    - protocol_id: cp_test_energy_consumables
      process_id: "calibration_test_packaging"
      flow_role: "calibration, verification, and packaging energy and consumables"
      record_type: "equipment meter, runtime, and consumable records"
      raw_fields: "test_station_id; test_type; meter_reading; runtime; conditioning_time; consumable_id; issued_quantity; allocation_driver"
      collection_method: "Use dedicated test-station or area meters where available; otherwise use documented complete-meter allocation"
      unit: "kWh or MJ; kg"
      frequency: "per test batch with monthly reconciliation"
      temporal_coverage: "same period as released product"
      site_scope: "every included test and packaging operation"
      aggregation_rule: "attributable energy and consumables divided by conforming released product mass"
      quality_evidence: "meter calibration, equipment log, utility invoice, and allocation worksheet"
    - protocol_id: cp_final_output_quality
      process_id: "calibration_test_packaging"
      flow_role: "conforming finished product and conformance status"
      record_type: "release, calibration, safety, EMC, and quality records"
      raw_fields: "model; serial_or_lot; measured_quantities; ranges; set_points; observed_results; accuracy_or_tolerance; uncertainty_if_reported; test_standard; equipment_id; equipment_calibration_status; pass_fail; released_mass"
      collection_method: "Link product release to the tests actually required and performed for the represented route"
      unit: "kg and declared engineering units"
      frequency: "each serial unit or statistically justified lot, according to the applicable test plan"
      temporal_coverage: "same period as released product"
      site_scope: "every release site and represented product family"
      aggregation_rule: "sum conforming released mass; retain unaggregated conformance evidence"
      quality_evidence: "approved test plan, calibrated equipment records, test results, nonconformance disposition, and release authorization"
    - protocol_id: cp_test_outputs
      process_id: "calibration_test_packaging"
      flow_role: "test rejects and packaging-process waste"
      record_type: "nonconformance and waste records"
      raw_fields: "reject_id; part_or_unit; measured_mass; cause; rework_status; final_disposition; waste_material; destination"
      collection_method: "Track rejects through rework or final waste disposition and measure waste by material"
      unit: "kg"
      frequency: "per lot and waste shipment"
      temporal_coverage: "same period as released product"
      site_scope: "every test and packaging site"
      aggregation_rule: "final waste leaving the rework loop divided by conforming released product mass"
      quality_evidence: "nonconformance report, calibrated scale, waste manifest, and rework genealogy"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = attributable amount during the reporting period / conforming finished-product mass during the same period; convert the denominator to kg and scale to 1 kg"
      inputs:
        - "attributable flow amount"
        - "conforming finished-product mass"
        - "unit conversion factor"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_stock_adjusted_consumption
      applies_to: "materials, components, packaging, and consumables"
      rule: "net consumption = opening stock + receipts - closing stock - documented returns or transfers out; reconcile the result to lot issues and substitutions"
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
        - transfers
        - "issue records"
      output: "stock-adjusted foreground consumption"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_meter_allocation
      applies_to: "energy or auxiliaries without dedicated submetering"
      rule: "allocate the complete measured total using the first defensible allocation rule in Section 7 and document numerator, denominator, coverage, and reconciliation to the complete meter total"
      inputs:
        - "total meter consumption"
        - "selected physical or other allocation driver"
        - "represented output"
      output: "attributable energy or auxiliary amount"
      source_ids:
        - iso-14044-2006
        - eu-pef-2021-2279
    - id: calc_direct_emission
      applies_to: "measured direct releases"
      rule: "released mass = measured concentration × measured discharge volume, with dimensional conversion and sampling-period coverage explicitly retained"
      inputs:
        - concentration
        - "discharge volume"
        - "unit conversion"
        - "monitoring coverage"
      output: "substance mass released"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_reject_rate
      applies_to: "assembly and test rejects"
      rule: "reject rate = final reject mass leaving the rework loop / gross unique input mass; repeated rework passes do not increase gross unique input"
      inputs:
        - "final reject mass"
        - "gross unique input mass"
        - "rework genealogy"
      output: "disclosed reject fraction and waste mass per kg reference product"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate that the represented models measure or check one or more of voltage, current, resistance, or power, lack a recording device, and are not electricity production or supply meters or excluded oscilloscopes/oscillographs."
      evidence: "Product specification, approved BOM, user documentation, nameplate, and classification review against unsd-cpc-3-0"
    - id: dq_temporal_consistency
      applies_to: "all foreground records"
      requirement: "Inputs, outputs, meters, stock movements, and released-product mass must cover the same representative period; justify campaigns shorter than 12 months and disclose seasonality or production-ramp effects."
      evidence: "Dated production, stock, meter, and shipment records"
    - id: dq_technological_geographical_representativeness
      applies_to: "processes and upstream datasets"
      requirement: "Match technology, component state, electricity supply, treatment route, geography, and production period to the represented route; disclose proxies and materially different sites or product families."
      evidence: "Dataset metadata, supplier/site mapping, and representativeness assessment following eu-pef-2021-2279"
    - id: dq_bom_and_mass_reconciliation
      applies_to: "product and packaging materials"
      requirement: "Reconcile the current product-specific BOM, substitutions, stock-adjusted consumption, accepted output, rejects, wastes, and included packaging/accessory convention; explain unreconciled mass."
      evidence: "BOM revision, stock reconciliation, scale records, output records, and mass-balance worksheet"
    - id: dq_measurement_traceability
      applies_to: "product calibration and conformance tests"
      requirement: "Retain test method, equipment identifier, calibration status, set points, results, tolerance or uncertainty, and pass/fail status for tests actually performed; identify applicable safety and EMC standards without claiming unperformed tests."
      evidence: "Test plan and results, equipment calibration records, and applicable iec-61010-1-2010-amd1-2016 and iec-61326-1-2020 evidence"
    - id: dq_substance_documentation
      applies_to: "materials and components"
      requirement: "Retain supplier and manufacturer documentation used to assess restricted substances and clearly distinguish declarations, analytical results, and unresolved evidence gaps."
      evidence: "Supplier declarations and technical documentation structured according to iec-63000-2016-amd1-2022"
validation_rules:
  - rule_id: val_identity_scope
    applies_to: "reference_product_identity"
    rule: "Reject the package if the product includes a recording device, is an electricity production or supply meter, is a cathode-ray oscilloscope or oscillograph, or otherwise falls outside the declared product boundary."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: val_reference_flow
    applies_to: "reference_flow_consistency"
    rule: "Require the exact reference product flow UUID, Mass flow-property UUID, Units of mass unit-group UUID, kg reference unit, exactly 1 kg normalized output, and all required qualifiers."
    source_ids: []
  - rule_id: val_process_coverage
    applies_to: "foreground_process_completeness"
    rule: "Require final assembly and calibration/verification/release/packaging records, and require in-house component manufacture whenever the declared site performs it; every included process must have inputs, outputs, waste disposition, and a linked collection protocol."
    source_ids:
      - iec-63366-2025
      - eu-pef-2021-2279
  - rule_id: val_bom_energy_waste
    applies_to: "inventory_completeness"
    rule: "Require a product-specific BOM and packaging/accessory convention, energy and auxiliary records for each included process, final product output, rejects and wastes, and direct emissions when they occur; unresolved upstream datasets must be disclosed as data gaps."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: val_quality_release
    applies_to: "product_conformance"
    rule: "Require release evidence for the declared measurement functions and applicable calibration, safety, and EMC test plan; standards cited in metadata do not count as evidence that a test was performed."
    source_ids:
      - iec-61010-1-2010-amd1-2016
      - iec-61326-1-2020
  - rule_id: val_allocation_disclosure
    applies_to: "shared_burdens"
    rule: "Require every shared burden to identify the allocation decision, driver, numerator, denominator, data period, source records, reconciliation to the complete total, and justification for not applying an earlier hierarchy step."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: val_no_unsupported_values
    applies_to: "quantitative_evidence"
    rule: "Reject invented category-default quantities, undocumented proxy UUIDs, or values copied from a different product/process. Values must arise from the declared collection/calculation protocol or cited non-default evidence."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate foreground manufacturing dataset normalized to 1 kg of conforming finished non-recording electrical measuring instrument"
  downstream_use: "Secondary dataset and background dataset for process or lifecyclemodel construction when product identity, route, geography, period, and included-product convention match"
  allowed_use: "Modelling the manufacture of covered instruments; supplier or site comparisons with harmonized scope and qualifiers; incorporation into broader product systems with transparent upstream and downstream extensions"
  excluded_use: "A category-average claim without representative sampling; use-stage service comparison without declared lifetime and performance; modelling excluded recording instruments, supply meters, oscilloscopes, oscillographs, standalone parts, or services; regulatory conformity claims based solely on this LCA dataset"
  required_metadata: "canonical PCR id; product model or family; measured quantities, ranges, and accuracy; recording-device absence; safety category and rated voltage where applicable; geography; technology and in-house/purchased route; reporting period; product, accessories, battery, manual, and packaging mass convention; upstream datasets; allocation and cut-off decisions; test-plan coverage"
  required_quality_disclosure: "Foreground share and primary-data coverage; temporal, geographical, and technological representativeness; BOM and mass reconciliation; meter and allocation coverage; test and calibration evidence; proxy and upstream data gaps; reject/rework treatment; exclusions and uncertainty limitations"
  update_trigger: "Product or BOM revision; added recording functionality; changed principal measured quantity or accuracy/safety category; changed site, technology, supply mix, packaging, included accessories or batteries; material supplier substitution; changed test plan or applicable standard; reporting data older than the declared validity period; material unresolved data gap closed"
