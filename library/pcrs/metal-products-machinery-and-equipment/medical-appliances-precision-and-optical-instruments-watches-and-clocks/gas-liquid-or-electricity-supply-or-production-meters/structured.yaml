system_boundary:
  rules:
    - rule_id: boundary_manufacturing_scope
      applies_to: "Cradle-to-manufacturer-gate meter production"
      rule: "Include production and inbound transport of materials, components, subassemblies, product and packaging assembly, configuration, calibration and verification, final testing, cleaning, marking, packaging, manufacturing waste and direct emissions through delivery to the manufacturer's last logistics platform."
      source_ids:
        - pep-ecopassport-pcr-ed4
    - rule_id: boundary_variant_integrity
      applies_to: "Product family coverage"
      rule: "Preserve the required medium, duty, technology, metrological class, communication, power, enclosure, installation and accessory qualifiers. Do not use a smart electricity meter, stand-alone sensor, component, or backend service as a proxy for the whole category."
      source_ids:
        - eu-mid-2014-32-eu
        - oiml-r46-2012
        - oiml-r49-2024
        - oiml-r117-2019
        - oiml-r137-2012
    - rule_id: boundary_cutoff_control
      applies_to: "Assessable inputs and outputs"
      rule: "Include all assessable inputs and outputs with primary or secondary data. Any exclusion shall be documented and shall satisfy the applicable mass, energy and impact cut-off tests without hiding significant materials or components."
      source_ids:
        - pep-ecopassport-pcr-ed4
    - rule_id: boundary_use_and_services
      applies_to: "Field installation, use, communication infrastructure and end of life"
      rule: "Exclude field installation, measured utility supply, operational own-energy use, data concentrators, telecommunications and backend services, maintenance, replacement and end of life from this manufacturing data package; model them as explicit downstream scenarios when the study requires them."
      source_ids:
        - pep-ecopassport-pcr-ed4
        - iea-4e-smart-metering-consumption-2013
