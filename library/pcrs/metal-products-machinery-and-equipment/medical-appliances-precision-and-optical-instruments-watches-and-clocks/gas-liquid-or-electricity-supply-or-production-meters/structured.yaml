measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report 1 kg net finished meter mass. Exclude packaging mass, installation consumables not delivered with the meter, and remote communication or backend equipment outside the declared product boundary."
  - id: count_to_mass_conversion
    applies_to: "Production records reported by unit count"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts using measured or controlled bill-of-material net mass for the same model and configuration revision. Retain item count, sampled or specified mass per item, sampling basis, and conversion calculation."
  - id: delivered_accessory_mass
    applies_to: "Accessories, batteries, external power supplies, antennas, fittings, cables, seals, and mounting items delivered with the meter"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Include delivered accessories in component inputs and product mass; identify each accessory family separately. Do not include site-supplied items or shared network equipment unless explicitly delivered as part of the declared meter."
  - id: variant_weighting
    applies_to: "Multi-model or multi-site aggregation"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Aggregate only with production-mass weighting from the declared period and retain results by medium, duty, technology, metrological class, communication, power, enclosure, and accessory configuration."
  - id: test_media_units
    applies_to: "Calibration and verification media or electrical test energy"
    required_property_ref:
      name: "Original measured property plus documented conversion property"
      uuid: ""
    required_unit: "Original calibrated unit and reported normalized unit"
    rule: "Preserve the original test-record unit. Convert gas or liquid volumes, masses, and electrical energy only with documented conditions, density or conversion factors, and uncertainty; do not convert the reference product away from kg."
