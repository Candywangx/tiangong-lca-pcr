allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "Multi-product component, assembly, calibration and packaging lines"
    rule: "Prefer meter-, line-, batch- or process-level metering and subdivision. Separate electricity, water, auxiliaries, rejects and emissions when direct records are available."
    source_ids:
      - pep-ecopassport-pcr-ed4
  - rule_id: allocation_physical_then_economic
    applies_to: "Unavoidable shared foreground burdens"
    rule: "Use a physical driver that represents process causality, such as machine time, test-bench time, processed mass or item count. Use economic allocation only when no defensible physical driver exists, and disclose the method and sensitivity."
    source_ids:
      - pep-ecopassport-pcr-ed4
  - rule_id: allocation_rework_and_scrap
    applies_to: "Rework, manufacturing scrap and waste treatment"
    rule: "Return internal rework to the originating process without double counting. Assign burdens through the point waste leaves the foreground boundary; do not apply avoided-virgin-material credits inside the reference product inventory."
    source_ids:
      - pep-ecopassport-pcr-ed4
  - rule_id: allocation_variant_weighting
    applies_to: "Product-family and multi-site datasets"
    rule: "Weight site and variant records by net finished production mass for the declared period and retain production totals by required qualifier. Do not average across media or technologies when the result would conceal materially different bills of materials, test routes or energy use."
    source_ids:
      - pep-ecopassport-pcr-ed4
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_component_mass
      process_id: "component_fabrication_and_subassembly"
      flow_role: "Variant-specific material, component, communication, power, enclosure and accessory inputs"
      record_type: "Controlled BOM, purchase and issue records, component mass measurement"
      raw_fields: "model_revision; medium; duty; technology; metrological_class; component_family; material; supplier; quantity; mass_per_item; accepted_mass; communication_configuration; power_configuration; enclosure; accessory_inclusion"
      collection_method: "Reconcile controlled BOM to purchase or issue records; weigh representative parts where supplier mass is absent; preserve model and revision"
      unit: "kg and item"
      frequency: "Each BOM revision and production batch"
      temporal_coverage: "At least the declared production period"
      site_scope: "Every contributing factory and supplier-data scope"
      aggregation_rule: "Sum accepted input mass by component family and divide by net finished product mass; production-mass weight sites and variants only after qualifier stratification"
      quality_evidence: "Approved BOM; scale calibration; purchase or issue records; sampling record; supplier declarations"
    - protocol_id: cp_process_energy
      process_id: "component_fabrication_and_subassembly_final_assembly_and_configuration_packaging_and_dispatch"
      flow_role: "Electricity, fuel, compressed air and other process energy"
      record_type: "Submeter, utility invoice and operating log"
      raw_fields: "meter_id; energy_carrier; opening_reading; closing_reading; operating_hours; line; batch; non_product_load; allocation_driver"
      collection_method: "Prefer submetering; otherwise reconcile invoices to line operating records and document allocation"
      unit: "kWh, MJ, kg or m3 in original carrier unit"
      frequency: "Per shift or batch, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full shorter campaign"
      site_scope: "Every contributing production site"
      aggregation_rule: "Subtract substantiated non-product loads, allocate by causal driver, then normalize to accepted process output"
      quality_evidence: "Meter calibration; invoice reconciliation; operating logs; allocation worksheet"
    - protocol_id: cp_process_materials_and_water
      process_id: "component_fabrication_and_subassembly_final_assembly_and_configuration"
      flow_role: "Water, chemicals and process auxiliaries"
      record_type: "Meter, purchase, issue, tank and inventory records"
      raw_fields: "material_id; opening_stock; purchases; closing_stock; process_return; water_meter; batch; concentration; density; temperature"
      collection_method: "Use direct metering or mass balance; retain original units and conversion conditions"
      unit: "kg, L or m3 as measured"
      frequency: "Per batch or monthly"
      temporal_coverage: "Declared production period"
      site_scope: "Every contributing production site"
      aggregation_rule: "Consumption equals opening stock plus purchases minus closing stock minus documented returns; normalize to accepted process output"
      quality_evidence: "Calibrated meter; inventory reconciliation; supplier specification; conversion record"
    - protocol_id: cp_process_output_and_scrap
      process_id: "component_fabrication_and_subassembly_final_assembly_and_configuration"
      flow_role: "Accepted output, rejects, scrap and waste"
      record_type: "Production count, scale ticket, waste manifest and inventory record"
      raw_fields: "process_id; model_revision; input_mass; accepted_mass; accepted_count; rework_return; waste_mass; waste_family; treatment_route"
      collection_method: "Weigh accepted output and separated waste; reconcile count-to-mass conversion and internal rework"
      unit: "kg and item"
      frequency: "Per batch"
      temporal_coverage: "Declared production period"
      site_scope: "Every contributing production site"
      aggregation_rule: "Accepted output plus waste plus documented stock change shall reconcile with measured input within the stated uncertainty"
      quality_evidence: "Scale calibration; batch traveller; waste manifest; reconciliation report"
    - protocol_id: cp_direct_emissions
      process_id: "component_fabrication_and_subassembly_final_assembly_and_configuration"
      flow_role: "Direct emissions to air, water and soil"
      record_type: "Continuous monitor, stack or effluent test, permit calculation and operating record"
      raw_fields: "substance; compartment; concentration; flow_rate; operating_time; calculation_method; detection_limit; batch_or_period"
      collection_method: "Use measured releases or the applicable documented permit method; subtract no control credit unless physically measured"
      unit: "kg or original regulated unit"
      frequency: "As monitored or at permit frequency"
      temporal_coverage: "Declared production period"
      site_scope: "Each emitting site"
      aggregation_rule: "Integrate concentration and flow over operation; allocate by causal process driver and normalize to accepted output"
      quality_evidence: "Calibration and laboratory report; permit method; operating log; uncertainty statement"
    - protocol_id: cp_assembly_records
      process_id: "final_assembly_and_configuration"
      flow_role: "Assembly inputs, configured output and assembly rejects"
      record_type: "Batch traveller, issue record, configuration log and mass record"
      raw_fields: "model_revision; medium; duty; technology; metrological_class_target; communication; power; enclosure; accessory_kit; input_mass; output_mass; count; reject_mass"
      collection_method: "Link component issues and configuration logs to each batch; weigh transfer output and rejects"
      unit: "kg and item"
      frequency: "Per batch"
      temporal_coverage: "Declared production period"
      site_scope: "Every assembly site"
      aggregation_rule: "Sum by exact configuration, reconcile mass, then normalize to assembled output"
      quality_evidence: "Traceable batch identifier; approved configuration; scale calibration; reject disposition"
    - protocol_id: cp_calibration_batch_records
      process_id: "calibration_verification_and_test"
      flow_role: "Calibration input, accepted meters, rework and rejects"
      record_type: "Calibration certificate, test-bench log, verification record and disposition log"
      raw_fields: "meter_serial_or_batch; model_revision; medium; duty; principle; metrological_class; rated_range; rated_conditions; test_standard; test_result; adjustment; seal; software_or_register_version; input_mass; accepted_mass; reject_mass"
      collection_method: "Link each meter or statistically governed batch to the applicable test plan and acceptance record"
      unit: "kg, item and original metrology units"
      frequency: "Every meter or governed batch"
      temporal_coverage: "Declared production period"
      site_scope: "Every calibration or test site"
      aggregation_rule: "Aggregate only accepted meters with the same test route and required qualifiers; retain rework and rejection separately"
      quality_evidence: "Reference-standard traceability; test-bench calibration; certificate or verification record; acceptance signature"
    - protocol_id: cp_calibration_resources
      process_id: "calibration_verification_and_test"
      flow_role: "Test media, electrical load, reference-standard operation and consumables"
      record_type: "Test-bench meter and resource log"
      raw_fields: "medium; source; opening_reading; closing_reading; recirculated_quantity; recovered_quantity; discharged_quantity; pressure; temperature; density; electrical_energy; test_hours; accepted_mass"
      collection_method: "Meter batch-level resource use; record recirculation and recovery separately; retain original conditions and units"
      unit: "Original calibrated unit"
      frequency: "Per test batch"
      temporal_coverage: "Declared production period"
      site_scope: "Every calibration or test site"
      aggregation_rule: "Net input equals gross supplied minus recovered return; discharged amount equals measured release after recirculation; normalize to accepted output"
      quality_evidence: "Meter calibration; environmental conditions; conversion factors; balance check"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "packaging_and_dispatch"
      flow_role: "Delivered product kit, packaging, labels, manuals, energy and pre-dispatch waste"
      record_type: "Packing list, BOM, purchase or issue record, scale and logistics record"
      raw_fields: "model_revision; meter_mass; accessory_mass; packaging_material; packaging_mass; reusable_packaging; label_and_manual_mass; energy; dispatched_count; waste_mass"
      collection_method: "Weigh the net meter kit separately from packaging; reconcile issued packaging and dispatch records"
      unit: "kg, item and energy carrier unit"
      frequency: "Per batch or dispatch lot"
      temporal_coverage: "Declared production period"
      site_scope: "Every packaging and dispatch site"
      aggregation_rule: "Normalize product and packaging separately to 1 kg net finished product; do not add packaging mass to the reference amount"
      quality_evidence: "Scale calibration; packing list; packaging specification; dispatch record; waste manifest"
  calculation_rules:
    - id: calc_net_reference_mass
      applies_to: "Packaged reference product"
      rule: "Net reference mass equals finished meter plus delivered accessory mass, excluding all primary, secondary and transport packaging"
      inputs:
        - meter_mass
        - delivered_accessory_mass
        - packaging_mass
      output: "kg net finished product"
      source_ids:
        - pep-ecopassport-pcr-ed4
    - id: calc_count_to_mass
      applies_to: "Count-based production records"
      rule: "Mass equals accepted item count multiplied by measured or controlled net mass per item for the same model and revision"
      inputs:
        - accepted_count
        - mass_per_item
        - sampling_basis
      output: "kg product or component"
      source_ids: []
    - id: calc_process_normalization
      applies_to: "Every process inventory row"
      rule: "Normalized amount equals attributable process amount divided by accepted process output mass, then multiplied by 1 kg"
      inputs:
        - attributable_amount
        - accepted_output_mass
      output: "amount per kg accepted output"
      source_ids: []
    - id: calc_test_media_balance
      applies_to: "Calibration gas or liquid"
      rule: "Net consumed or discharged medium equals gross supplied minus measured recovered or recirculated return, with volume-to-mass conversion only when temperature, pressure and density or conversion method are documented"
      inputs:
        - gross_supply
        - recovered_return
        - recirculated_quantity
        - discharge
        - temperature
        - pressure
        - density_or_factor
      output: "net medium amount per kg accepted meter"
      source_ids:
        - oiml-r49-2024
        - oiml-r117-2019
        - oiml-r137-2012
    - id: calc_variant_site_weighting
      applies_to: "Multi-variant or multi-site dataset"
      rule: "Weighted result equals the sum of each stratified site-variant result multiplied by its net finished production mass, divided by total net finished production mass"
      inputs:
        - site_variant_result
        - site_variant_production_mass
        - qualifier_stratum
      output: "production-mass-weighted result with retained qualifier distribution"
      source_ids:
        - pep-ecopassport-pcr-ed4
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and all aggregated variants"
      requirement: "Preserve medium, supply or production duty, mechanical/electronic/smart technology, measuring principle, metrological class and rated range, communication, power, enclosure, mounting and delivered-accessory configuration"
      evidence: "Approved product specification, controlled BOM, type-approval or conformity record, and production-volume table"
    - id: dq_metrological_traceability
      applies_to: "Calibration, verification and final test"
      requirement: "Use traceable reference standards and the applicable test plan; retain environmental and operating conditions, software or register version when applicable, adjustments, acceptance and uncertainty records"
      evidence: "Calibration certificates, test-bench calibration, verification report and batch or serial traceability"
    - id: dq_mass_balance
      applies_to: "Component fabrication, assembly, calibration and packaging"
      requirement: "Reconcile measured inputs, accepted output, internal rework, stock change, waste and direct releases; document uncertainty and unresolved imbalance"
      evidence: "Process-level mass-balance worksheet, scale calibration and disposition records"
    - id: dq_temporal_and_site_coverage
      applies_to: "Foreground production"
      requirement: "Cover all contributing sites and at least 12 consecutive representative months unless the complete production campaign is shorter; disclose ramp-up, abnormal shutdowns and missing periods"
      evidence: "Site list, production calendar, meter coverage table and exception log"
    - id: dq_supplier_and_background_coverage
      applies_to: "Materials, components, subassemblies, packaging, energy, test media and treatment"
      requirement: "Use representative upstream datasets and disclose supplier-specific data coverage, geography, technology, age and proxies; do not treat a narrow smart-meter dataset as representative of all variants"
      evidence: "Supplier declarations, dataset register, data-gap list and proxy justification"
    - id: dq_completeness_and_cutoff
      applies_to: "All assessable inputs and outputs"
      requirement: "Quantify and justify exclusions against the applicable mass, energy and environmental-impact cut-off criteria and systematically include significant materials and components"
      evidence: "Completeness calculation, exclusion register and sensitivity check; pep-ecopassport-pcr-ed4"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "The product-flow UUID, Mass property UUID, Units of mass UUID and kg unit shall match section 3; the output shall be a finished meter, not a part, sensor or service."
    source_ids: []
  - rule_id: validation_required_qualifiers
    applies_to: "Dataset identity"
    rule: "Reject a data package missing the measured medium, duty, technology, principle, metrological class and rated conditions, communication, power, enclosure, mounting, delivered accessories, net mass, geography or period."
    source_ids:
      - eu-mid-2014-32-eu
      - oiml-r46-2012
      - oiml-r49-2024
      - oiml-r117-2019
      - oiml-r137-2012
  - rule_id: validation_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require component and subassembly, final assembly and configuration, calibration and verification, and packaging and dispatch processes, with conditional electronic, communication, power and medium-specific resources explicitly present or documented not applicable."
    source_ids:
      - pep-ecopassport-pcr-ed4
      - iea-4e-smart-metering-consumption-2013
  - rule_id: validation_mass_and_yield
    applies_to: "Process balances"
    rule: "Confirm inputs, accepted output, rework, stock change, waste and direct releases reconcile within documented measurement uncertainty and that rejects are not hidden in accepted yield."
    source_ids:
      - pep-ecopassport-pcr-ed4
  - rule_id: validation_calibration_traceability
    applies_to: "Accepted product output"
    rule: "Confirm each accepted meter or governed batch links to the applicable test plan, traceable standard, rated conditions, metrological class, result, adjustment, software or register version when applicable, seal and acceptance record."
    source_ids:
      - eu-mid-2014-32-eu
      - oiml-r46-2012
      - oiml-r49-2024
      - oiml-r117-2019
      - oiml-r137-2012
  - rule_id: validation_cutoff_and_sources
    applies_to: "Completeness and evidence"
    rule: "Confirm every exclusion is quantified and justified, significant materials and components are retained, all non-default method constraints cite valid source ids, and all foreground rows link to records or calculations."
    source_ids:
      - pep-ecopassport-pcr-ed4
  - rule_id: validation_variant_aggregation
    applies_to: "Product families and sites"
    rule: "Reject aggregation that combines materially different media, duties, technologies or configurations without qualifier-stratified records, production-mass weights and a sensitivity or variability disclosure."
    source_ids:
      - pep-ecopassport-pcr-ed4
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for a declared finished supply or production meter variant"
  downstream_use: "secondary_dataset; background_dataset; input to a downstream process or lifecyclemodel that adds distribution, installation, measured utility service, operational own-energy and communications, maintenance, replacement, and end-of-life scenarios"
  allowed_use: "Cradle-to-manufacturer-gate modelling of the exact declared meter variant or a transparent production-weighted family that preserves all required qualifiers"
  excluded_use: "Proxying the entire category with one smart electricity meter, one gas or water meter, a stand-alone sensor, a component, or a backend service; comparative metering-service claims without function, accuracy, capacity, service life and use-phase scenarios"
  required_metadata: "PCR id and version state; product model and revision; medium and liquid family; supply or production duty; mechanical/electronic/smart technology and principle; metrological class, rated range and applicable regime; communication and power configuration; enclosure and mounting; delivered accessories; net mass; sites and period; reference-flow UUIDs; allocation; data-source and foreground-record lineage"
  required_quality_disclosure: "BOM and supplier-data coverage; foreground meter coverage; site and temporal representativeness; calibration and verification traceability; mass-balance closure and uncertainty; exclusions and cut-off checks; allocation; proxy datasets; variant weights; missing data and sensitivity"
  update_trigger: "Change in measured medium or duty, measuring principle, metrological class or rated range, material or component design, communication or power configuration, enclosure or delivered accessories, factory route, calibration method, supplier or background dataset, allocation, or production mix that materially changes the inventory"
