allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "independently_meterable_operations"
    rule: "Avoid allocation by subdividing and directly measuring product-specific material, energy, water, solvent, packaging, waste, and emission records wherever practicable."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "shared_manufacturing_inputs"
    rule: "When direct measurement is unavailable, allocate a shared flow with a documented physical driver that reflects causality, in the order machine or process time, measured throughput, or net conforming product mass; do not allocate by revenue unless physical drivers are demonstrably unavailable."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_3
    applies_to: "scrap_recovery_and_waste_treatment"
    rule: "Report the full mass leaving as each waste flow and link the actual recovery or treatment route. Do not subtract an avoided-burden credit inside the foreground inventory; disclose any downstream recycling convention separately."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "rework_and_rejects"
    rule: "Assign rework energy and materials and unrecovered reject burdens to the product configuration that generated them, using product-specific records or the same causal driver as the originating operation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "parts_manufacturing"
      flow_role: "Product-specific material inputs"
      record_type: "BOM, issue/return transaction, purchase receipt, and stock record"
      raw_fields: "material identity; grade; supplied form; supplier; lot; gross issued mass; returned mass; inventory change; recycled content; product model; conforming output mass"
      collection_method: "Reconcile the approved BOM to ERP and stores transactions and retain lot-level exceptions"
      unit: "kg"
      frequency: "Per lot, aggregated for the reporting period"
      temporal_coverage: "One representative production year or a complete declared campaign"
      site_scope: "All foreground operations at the declared manufacturing site"
      aggregation_rule: "Sum net consumed mass by atomic material identity and divide by net conforming output mass"
      quality_evidence: "Approved BOM revision, transaction extract, supplier specification, scale calibration, and reconciliation sign-off"
    - protocol_id: cp_electricity
      process_id: "parts_manufacturing"
      flow_role: "Purchased electricity"
      record_type: "Meter, submeter, equipment log, and production record"
      raw_fields: "meter identifier; opening and closing reading; kWh; equipment; process time; product model; reporting period; conforming output mass"
      collection_method: "Prefer direct submetering; otherwise allocate a reconciled site meter using documented equipment time or throughput"
      unit: "kWh and MJ"
      frequency: "Monthly or per campaign"
      temporal_coverage: "Same period as product output, normally 12 consecutive months"
      site_scope: "Declared site and all attributable in-scope operations"
      aggregation_rule: "Convert kWh to MJ, subtract documented out-of-scope loads, allocate shared loads, and divide by net conforming output mass"
      quality_evidence: "Meter calibration or invoice reconciliation, allocation worksheet, and production log"
    - protocol_id: cp_cleaning_inputs
      process_id: "parts_manufacturing"
      flow_role: "Aqueous cleaning inputs"
      record_type: "Water meter, invoice, batch sheet, and cleaning-equipment log"
      raw_fields: "water amount; source; cleaning line; batch; product model; reuse volume or mass; date; conforming output mass"
      collection_method: "Reconcile meter or invoice totals to batch and equipment records"
      unit: "kg"
      frequency: "Per batch or monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Declared site cleaning operations"
      aggregation_rule: "Sum net water supplied after documented internal reuse and divide by net conforming output mass"
      quality_evidence: "Meter or invoice, batch sheets, density record when converted, and reconciliation"
    - protocol_id: cp_solvent_balance
      process_id: "parts_manufacturing"
      flow_role: "Isopropanol input, waste, and direct air emission"
      record_type: "Purchase, tank or container inventory, issue/return, recovery, waste manifest, wastewater analysis, and emission measurement"
      raw_fields: "opening stock; purchases; transfers; closing stock; recovered mass; reused mass; spent-solvent mass; solvent in wastewater; product retention; measured air release; abatement capture; product model; output mass"
      collection_method: "Establish a closed-period solvent mass balance and investigate unexplained residuals"
      unit: "kg"
      frequency: "Per batch with monthly or campaign closure"
      temporal_coverage: "Complete reporting period aligned to product output"
      site_scope: "All isopropanol storage, transfer, cleaning, drying, recovery, and waste points at the site"
      aggregation_rule: "Reconcile inputs to inventory change, recovery, wastes, retained solvent, and direct emissions; normalize each result to net conforming output mass"
      quality_evidence: "Inventory sheets, calibrated scales or meters, recovery logs, waste manifests, analytical results, emission records, and signed balance"
    - protocol_id: cp_packaging
      process_id: "parts_manufacturing"
      flow_role: "Factory-gate packaging inputs"
      record_type: "Packaging BOM, purchase specification, packing instruction, and sample weigh record"
      raw_fields: "packaging item identity; material; unit mass; units per shipment; products per shipment; reused cycles where verified; product model"
      collection_method: "Weigh each packaging component or use supplier mass verified by periodic sample weighing"
      unit: "kg"
      frequency: "Per packaging configuration and when it changes"
      temporal_coverage: "Current shipping configuration within the reporting period"
      site_scope: "Packaging applied before the factory gate"
      aggregation_rule: "Multiply verified unit mass by units used and allocate by products per shipment, then divide by net product mass"
      quality_evidence: "Approved packing instruction, supplier specification, sample scale record, and change control"
    - protocol_id: cp_waste_outputs
      process_id: "parts_manufacturing"
      flow_role: "Material scrap and cleaning wastewater"
      record_type: "Segregated bin weigh ticket, waste manifest, effluent meter, discharge record, and treatment transfer"
      raw_fields: "waste identity; material or contaminant; mass or volume; date; product model or line; treatment state; recovery or treatment destination; output mass"
      collection_method: "Keep material-specific waste streams separate and reconcile internal logs to transporter or treatment records"
      unit: "kg or m3"
      frequency: "Per transfer, aggregated monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "All in-scope foreground operations and on-site collection points"
      aggregation_rule: "Sum each atomic waste flow, allocate shared streams with documented causal drivers, and divide by net conforming output mass"
      quality_evidence: "Calibrated scale or flow meter, manifest, treatment receipt, analytical profile where relevant, and reconciliation"
    - protocol_id: cp_product_output
      process_id: "parts_manufacturing"
      flow_role: "Conforming reference product"
      record_type: "Production, final inspection, and shipment release record"
      raw_fields: "product identity; parent-device family; model; compatibility; serial or lot; net mass; accepted quantity; rejected quantity; test result; date"
      collection_method: "Weigh or calculate verified net mass only after final acceptance; reconcile to released production"
      unit: "kg"
      frequency: "Per lot"
      temporal_coverage: "Same period as all foreground inputs and outputs"
      site_scope: "Declared manufacturing site"
      aggregation_rule: "Sum accepted net product mass; use it as the denominator for all normalized exchanges"
      quality_evidence: "Calibrated scale, final inspection record, test record, release authorization, and production reconciliation"
  calculation_rules:
    - id: calculation_rule_1
      applies_to: "normalized inventory rows"
      rule: "normalized amount = attributable reporting-period flow amount / net conforming reporting-period output mass"
      inputs:
        - "Atomic flow amount"
        - "net conforming output mass"
      output: "Flow amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calculation_rule_2
      applies_to: "electricity"
      rule: "electricity (MJ/kg) = attributable electricity (kWh) × 3.6 / net conforming output mass (kg)"
      inputs:
        - "Metered or allocated kWh"
        - "conforming output mass"
      output: "MJ per 1 kg reference product"
      source_ids: []
    - id: calculation_rule_3
      applies_to: "net material consumption"
      rule: "net consumed mass = opening stock + receipts + transfers in − closing stock − returns − transfers out; reconcile the result to BOM issues and measured waste"
      inputs:
        - "Inventory and transaction fields"
        - BOM
        - "waste mass"
      output: "kg of each atomic input per 1 kg reference product"
      source_ids: []
    - id: calculation_rule_4
      applies_to: "isopropanol mass balance"
      rule: "direct unaccounted release = opening stock + purchases + transfers in − closing stock − transfers out − recovered solvent − spent-solvent waste − isopropanol in wastewater − verified product retention; replace the residual with direct measurement when available and do not report a negative result"
      inputs:
        - "Solvent inventory"
        - purchase
        - transfer
        - recovery
        - waste
        - wastewater-analysis
        - retention
        - "and measurement records"
      output: "kg isopropanol to air per 1 kg reference product, with reconciliation residual disclosed"
      source_ids:
        - us-epa-industrial-cleaning-solvents-2006
  data_quality_requirements:
    - id: data_quality_1
      applies_to: "Product and flow identity"
      requirement: "Each row names one physical, chemical, energy, waste, or elementary exchange and carries its applicable form, grade, compartment, treatment state, and supplier or destination qualifiers."
      evidence: "Approved BOM, specifications, manifests, direct-read UUID audit, and atomic-flow review"
    - id: data_quality_2
      applies_to: "Completeness"
      requirement: "Reconcile the product-specific BOM and all known inputs and outputs to production, inventory, utility, waste, and emissions records. Explain every excluded or unlinked actual exchange."
      evidence: "Completeness checklist, balances, reconciliation sign-off, and exception log"
    - id: data_quality_3
      applies_to: "Temporal representativeness"
      requirement: "Use one representative 12-month period where continuous production exists, or a complete declared campaign for intermittent production; align all numerator and denominator records."
      evidence: "Dated source extracts, campaign definition, and period-alignment check"
    - id: data_quality_4
      applies_to: "Technological and geographical representativeness"
      requirement: "Match site technology, material grades, cleaning route, electricity geography, supplier geography, and waste destinations; disclose proxies and their effect on interpretation."
      evidence: "Process description, supplier records, dataset metadata, and proxy register"
    - id: data_quality_5
      applies_to: "Measurement and uncertainty"
      requirement: "Retain calibration status, measurement resolution, allocation basis, missing-data treatment, and material- or solvent-balance residuals; investigate material residuals before release."
      evidence: "Calibration certificates, allocation worksheet, uncertainty record, and reviewer sign-off"
    - id: data_quality_6
      applies_to: "Data verification"
      requirement: "A reviewer independent of data preparation checks reference-flow normalization, UUID semantics, conditional-route applicability, balances, source links, and bilingual consistency."
      evidence: "Completed verification record and resolved findings"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_flow"
    rule: "Confirm that reference_product is a conforming CPC 48354 part or accessory for a declared CPC 48315 parent-device family and that its net output is exactly 1 kg excluding transport packaging."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-pef-method-2021
  - rule_id: validation_rule_2
    applies_to: "required_qualifiers"
    rule: "Reject a dataset that omits parent-device family, part/accessory function, compatibility, composition, manufacturing route, acceptance specification, site, period, or packaging configuration."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "atomic_inventory"
    rule: "Confirm that every actual BOM, utility, packaging, waste, and direct emission is represented by one atomic exchange with correct direction, flow type, property, unit, and route condition."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_4
    applies_to: "tiangong_uuid_identity"
    rule: "Confirm every populated Tiangong UUID by a public state-100 direct read against English and Chinese baseName, flow type, classification, property, unit group, product state, geography, technology, and generalComment; keep unresolved rows blank rather than substituting proxies."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "conditional_routes"
    rule: "Confirm that aluminium, stainless steel, ABS, copper, aqueous cleaning, isopropanol cleaning, and corrugated-cardboard rows are included only when the declared BOM and site route use them; add any different actual material or process flow as a separate atomic row."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "mass_and_solvent_balance"
    rule: "Reconcile material input, conforming output, material-specific scrap, other actual outputs, and inventory change; where isopropanol is used, separately reconcile solvent input, recovery, waste, wastewater content, retention, and air release."
    source_ids:
      - us-epa-industrial-cleaning-solvents-2006
  - rule_id: validation_rule_7
    applies_to: "data_quality_and_sources"
    rule: "Confirm period alignment, calibration, product-specific company data, upstream dataset links, proxy disclosure, calculation reproducibility, and source-id resolution before dataset release."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset for production of a named liquid-crystal device n.e.c., laser other than a laser diode, or other optical appliance/instrument n.e.c.; may also support a product-specific foreground assembly model"
  allowed_use: "Factory-gate modelling of the declared part/accessory configuration where parent-device family, compatibility, composition, route, geography, technology, period, and packaging match the study"
  excluded_use: "Direct comparison of unlike part functions or parent-device families; substitution for a complete CPC 48315 device; use-stage, maintenance, service-life, or end-of-life claims; or application to unreported materials and routes"
  required_metadata: "PCR id and status; product and parent-device identity; function and compatibility; net reference mass; BOM and supplied forms; manufacturing, cleaning, test, rework, and packaging route; site and geography; reporting period; allocation; upstream datasets; waste destinations; unresolved UUIDs and proxies"
  required_quality_disclosure: "Primary-data share; period coverage; calibration and reconciliation status; allocation drivers; material- and solvent-balance residuals; missing flows; proxy datasets; UUID audit status; data-quality review findings"
  update_trigger: "Change in product function or compatibility, material or component BOM, manufacturing or cleaning technology, site or electricity geography, allocation driver, supplier mix, waste route, packaging configuration, acceptance test, or a material change in measured normalized exchanges"
