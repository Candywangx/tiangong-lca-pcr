allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "multi-product lines and shared processes"
    rule: "Prefer subdivision using product- or line-specific BOM, production, test, energy, waste and emission records. Keep separately measured operations separate rather than allocating them."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_causal_driver
    applies_to: "unavoidable shared utilities and operations"
    rule: "Where subdivision is not feasible, allocate using a documented causal physical driver: measured energy, machine or test-bench time and rated power for utilities; processed mass or item count for handling; occupied test cycles for test equipment; and measured waste mass for treatment."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other_relationship
    applies_to: "residual multifunctionality"
    rule: "Use another relationship, including economic value, only when neither subdivision nor a defensible physical relationship is feasible. Record the reason, period, products, factor values and sensitivity of the result."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_scrap_and_recovery
    applies_to: "recyclable scrap and recovered test media"
    rule: "Record recovered test media returned to the foreground loop as an internal return and report only net make-up consumption. Record scrap leaving the system by waste type and treatment route; do not apply an avoided-burden credit inside this factory-gate dataset unless a downstream modelling method explicitly requires and documents it."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_rework
    applies_to: "reworked instruments and components"
    rule: "Keep rework materials, energy, testing and wastes in the foreground inventory of the conforming output. Do not treat rework as a co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_materials
      process_id: "component_preparation_product_assembly"
      flow_role: "material and component inputs"
      record_type: "BOM, purchase, warehouse issue/return and inventory records"
      raw_fields: "item_id; description; supplier; material; quantity; unit_mass; issued_quantity; returned_quantity; opening_inventory; closing_inventory; lot; product_variant"
      collection_method: "Export controlled BOM and reconcile with warehouse movements and physical inventory"
      unit: "kg and item"
      frequency: "each lot or monthly reconciliation"
      temporal_coverage: "complete declared production period"
      site_scope: "all included lines and outsourced inputs received at the site"
      aggregation_rule: "net consumed quantity = opening inventory + receipts/issues − returns − closing inventory; map to product variant and normalize to conforming net output"
      quality_evidence: "approved BOM revision, supplier record, inventory reconciliation, scale calibration"
    - protocol_id: cp_consumables_and_inventory
      process_id: "component_preparation_product_assembly"
      flow_role: "chemicals, fluids, lubricants and consumables"
      record_type: "purchase, issue, return, tank or container inventory records"
      raw_fields: "substance_id; composition_or_grade; quantity; unit; opening_inventory; closing_inventory; returned_or_recovered_quantity; process; retained_in_product_fraction"
      collection_method: "Reconcile stores and process inventory; retain substance or grade identity"
      unit: "kg, L or m3"
      frequency: "monthly and at campaign close"
      temporal_coverage: "complete declared production period"
      site_scope: "all included foreground processes"
      aggregation_rule: "calculate net use by process and identify amount retained in product, emitted, recovered or discarded"
      quality_evidence: "invoices, SDS or specification, inventory log, calibrated tank/container measurement"
    - protocol_id: cp_energy_and_utilities
      process_id: "all_process_ids"
      flow_role: "electricity, fuel, heat and compressed-air supply"
      record_type: "submeters, facility meters, invoices and equipment operating logs"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; timestamp; line; machine_time; test_cycles; rated_power; compressor_output"
      collection_method: "Prefer submetering; otherwise reconcile facility balance and allocate by documented causal driver"
      unit: "kWh, MJ, kg, L or m3"
      frequency: "continuous or at least monthly"
      temporal_coverage: "complete declared production period"
      site_scope: "reporting site and included lines"
      aggregation_rule: "meter difference minus excluded loads, then allocate only the unresolved shared balance and normalize to conforming output"
      quality_evidence: "meter calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_production_and_quality
      process_id: "all_process_ids"
      flow_role: "transfers, yields, rejects and conforming output"
      record_type: "production orders, transfer records, count and mass records, nonconformance and rework logs"
      raw_fields: "product_variant; started_count; started_mass; transfer_count; transfer_mass; passed_count; passed_mass; rejected_count; rejected_mass; reworked_count; timestamp"
      collection_method: "Reconcile each process transfer and quality disposition by product variant"
      unit: "kg and item"
      frequency: "each batch or production order"
      temporal_coverage: "complete declared production period"
      site_scope: "all included lines"
      aggregation_rule: "aggregate conforming and rejected quantities, retain rework in the relevant operation, and normalize by net conforming output mass"
      quality_evidence: "signed batch record, calibrated scale, quality release and nonconformance records"
    - protocol_id: cp_test_and_calibration
      process_id: "functional_test_and_calibration"
      flow_role: "test route, test media, results and recovery"
      record_type: "test-bench logs, calibration certificates, medium inventories and failure records"
      raw_fields: "unit_id; test_standard; test_configuration; controlled_variable; setpoint_range; pressure_or_flow_range; input_signal; output_signal; start_time; end_time; pass_fail; medium_charge; make_up; recovered; discharged; retained"
      collection_method: "Capture machine-readable test records and reconcile medium balance for each test configuration"
      unit: "test-specific units, kg or m3"
      frequency: "each tested unit or statistically justified lot"
      temporal_coverage: "complete declared production period"
      site_scope: "every included test bench and outsourced acceptance test"
      aggregation_rule: "aggregate test cycles, passes, failures and net media use by product variant; preserve the test specification and configuration"
      quality_evidence: "calibrated reference instruments, traceable calibration certificate, signed test record, medium inventory reconciliation"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "finishing_and_packaging"
      flow_role: "packaging and separately supplied accessories"
      record_type: "packaging BOM, packing lists, material issue and dispatch records"
      raw_fields: "packaging_item; material; level; unit_mass; quantity; returned_quantity; accessory_id; included_in_reference_mass; dispatch_lot"
      collection_method: "Reconcile packaging BOM and issued quantity with packed and dispatched units"
      unit: "kg and item"
      frequency: "each packing lot or monthly"
      temporal_coverage: "complete declared production period"
      site_scope: "all included packing lines"
      aggregation_rule: "calculate packaging mass by material and level per kg net product; keep accessories and packaging outside reference mass unless permanently installed"
      quality_evidence: "approved packaging specification, packing list, scale record, dispatch reconciliation"
    - protocol_id: cp_waste_and_rejects
      process_id: "all_process_ids"
      flow_role: "waste, scrap, rejected parts and spent media"
      record_type: "waste manifests, container weights, treatment invoices and reject disposition records"
      raw_fields: "waste_type; material; hazardous_status; source_process; gross_weight; tare; net_weight; treatment_route; destination; date; rejected_product_link"
      collection_method: "Weigh or otherwise quantify each waste shipment and reconcile production rejects"
      unit: "kg"
      frequency: "each shipment and monthly reconciliation"
      temporal_coverage: "complete declared production period"
      site_scope: "all included foreground processes"
      aggregation_rule: "subtract tare, aggregate by source process and treatment route, reconcile rejected product mass and normalize to conforming output"
      quality_evidence: "calibrated scale, waste manifest, treatment certificate, nonconformance record"
    - protocol_id: cp_direct_emissions
      process_id: "all_process_ids"
      flow_role: "direct releases to air, water and soil"
      record_type: "continuous monitoring, sampling, permit reports or activity-factor calculations"
      raw_fields: "substance; compartment; concentration; flow_rate; duration; activity_data; factor; method; uncertainty; control_efficiency"
      collection_method: "Prefer direct measurement; otherwise calculate from collected activity data using an identified method without duplicating upstream emissions"
      unit: "kg or method-specific unit"
      frequency: "per monitoring plan and each abnormal event"
      temporal_coverage: "complete declared production period"
      site_scope: "all on-site included release points"
      aggregation_rule: "integrate measured concentration and flow or apply the documented calculation; subtract only measured recovery and normalize to conforming output"
      quality_evidence: "laboratory report, monitor calibration, permit return, calculation method and uncertainty record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory amount"
      rule: "normalized amount = period amount / period net mass of conforming finished instruments × 1 kg"
      inputs:
        - "period flow amount"
        - "conforming net output mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_material_consumption
      applies_to: "BOM materials and consumables"
      rule: "net consumption = opening inventory + receipts or issues − returns − recovered usable material − closing inventory; reconcile with product, waste, emission and stock-change masses"
      inputs:
        - "inventory and movement records"
      output: "net material consumption by item and process"
      source_ids: []
    - id: calc_energy_utility
      applies_to: "electricity, fuels, heat and compressed air"
      rule: "included utility = meter closing − opening − excluded loads; allocate only unresolved shared use with the selected causal driver"
      inputs:
        - meters
        - invoices
        - "excluded loads"
        - "driver values"
      output: "utility consumption by process and product"
      source_ids:
        - eu-pef-2021
    - id: calc_test_medium_balance
      applies_to: "hydraulic fluid, water, gas and other test media"
      rule: "net medium consumption = opening inventory + charge + make-up − recovered usable closing inventory − separately accounted discharge; separately report retained product fill, waste and direct release"
      inputs:
        - "test and inventory records"
      output: "net medium input and reconciled output routes"
      source_ids:
        - iso-10770-hydraulic-control-valves
        - iec-61514-2026
    - id: calc_process_yield
      applies_to: "each manufacturing process"
      rule: "yield = conforming transferred mass or count / started mass or count; retain rework inputs and final disposition in the inventory"
      inputs:
        - production
        - transfer
        - pass
        - "reject and rework records"
      output: "process yield and reject fraction"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "complete foreground system"
      rule: "input mass = product mass + waste mass + direct mass releases + closing stock increase − opening stock increase, with moisture and fluid additions identified; investigate the residual against the declared accounting tolerance"
      inputs:
        - "all mass records"
      output: "mass-balance residual and explanation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and product variants"
      requirement: "Use the exact reference product UUID and declare every required qualifier, BOM revision, product variant and hydraulic or pneumatic route represented by the dataset."
      evidence: "Tiangong identity readback, controlled product specification, released BOM and dataset metadata"
    - id: dq_technology_representativeness
      applies_to: "process map and tests"
      requirement: "The included component preparation, assembly and test route shall represent the technology actually used for the declared product; identify outsourced operations and omitted conditional processes."
      evidence: "process map, work instructions, supplier scope and test plan"
    - id: dq_time_representativeness
      applies_to: "all foreground records"
      requirement: "Use one complete, internally consistent production period or campaign that captures normal production, rework and test activity; disclose start/end dates, shutdowns, abnormal events and any mixed-period source."
      evidence: "dated meter, production, inventory, waste and quality records"
    - id: dq_geographical_representativeness
      applies_to: "site and upstream links"
      requirement: "Declare each manufacturing site and the geography of energy and major upstream datasets; do not silently combine sites with materially different routes."
      evidence: "site metadata, supplier records and dataset geography"
    - id: dq_precision_and_uncertainty
      applies_to: "measurements and calculations"
      requirement: "Retain meter resolution, calibration status, sampling basis, allocation driver and known uncertainty for material flows, utilities, test media, waste and direct emissions."
      evidence: "calibration certificates, sampling plan, meter register and calculation worksheet"
    - id: dq_completeness
      applies_to: "required and applicable processes"
      requirement: "Account for every required process, every applicable conditional process, all BOM materials, utilities, test media, packaging, rejects, wastes and direct releases; identify and justify each data gap or exclusion."
      evidence: "completeness matrix, BOM-to-inventory reconciliation, process map and exclusion log"
    - id: dq_test_traceability
      applies_to: "functional test and calibration"
      requirement: "Preserve the applicable test specification, test configuration, reference-instrument calibration, pass/fail criterion and linkage from test record to product variant or lot."
      evidence: "test-bench record, calibration certificate and quality release"
    - id: dq_quality_rating_disclosure
      applies_to: "published dataset"
      requirement: "Assess and disclose technological, geographical and time representativeness and precision, together with limitations affecting reuse."
      evidence: "data-quality assessment aligned with the PEF data-quality dimensions"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The reference product shall be 2e112504-677d-408e-817c-751e1746af52, flow type Product, CPC 48266, state_code=100, with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg as the reference unit."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "reference product metadata"
    rule: "Fail completeness when any required qualifier is missing or when the declared product is measuring-only, manually operated, electrical-only, a power actuator, a separately sold part, or an inseparable machine component outside this PCR scope."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_process_coverage
    applies_to: "process inventory"
    rule: "Product assembly, functional test and calibration, and finishing and packaging shall be present. Component preparation shall be present when performed at the site, or explicitly marked not applicable with the outsourced upstream dataset identified."
    source_ids:
      - eu-pef-2021
      - iso-4413-2010
      - iso-4414-2010
  - rule_id: validate_test_route
    applies_to: "factory acceptance testing"
    rule: "The dataset shall identify the tested configuration, applicable specification, test conditions and acceptance result; test energy, media, failures and releases shall be inventoried for the actual route."
    source_ids:
      - iso-10770-hydraulic-control-valves
      - iec-61514-2026
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "The reference output shall equal 1 kg net conforming finished instrument. Packaging and separately supplied accessories shall not be included in that net mass."
    source_ids: []
  - rule_id: validate_mass_reconciliation
    applies_to: "foreground mass flows"
    rule: "Product, waste, direct release and inventory-change masses shall reconcile with material inputs within the declared facility accounting tolerance. Every residual outside that tolerance shall be investigated and disclosed."
    source_ids: []
  - rule_id: validate_energy_and_test_media
    applies_to: "utilities and testing"
    rule: "Energy carriers and test media shall retain their measured units and conversion factors. Gross circulation of recovered test medium shall not be reported as net consumption, and compressed-air volume shall not be converted to electricity without documented compressor energy and allocation."
    source_ids:
      - iso-10770-hydraulic-control-valves
      - iec-61514-2026
  - rule_id: validate_no_unreviewed_cutoff
    applies_to: "foreground completeness"
    rule: "Every exclusion shall name the affected process or flow and justify its potential significance; an unreviewed mass- or cost-only cut-off fails completeness."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "shared and multifunctional operations"
    rule: "Verify that subdivision was attempted first, that any physical driver is causal and period-consistent, and that every residual allocation factor and sensitivity is disclosed."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_data_quality
    applies_to: "foreground evidence"
    rule: "Verify record-period consistency, site and technology representativeness, calibration or quality evidence, test traceability, upstream dataset links and explicit disclosure of gaps and limitations."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "foreground_product_manufacturing_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Factory-gate modelling of a declared hydraulic or pneumatic automatic controller or regulator when product qualifiers, production route, geography, technology and period are compatible with the study"
  excluded_use: "Measuring-only instruments, manually operated valves, hydraulic or pneumatic power actuators, electrical-only controllers, separately sold parts, use-stage energy or leakage, service-life comparison, and comparative assertions between products with different functions or performance qualifiers"
  required_metadata: "canonical PCR id; reference flow UUID and unit chain; product name and variant; hydraulic or pneumatic route; controlled variable; input and output signals; rated pressure or flow range; performance or accuracy class; principal materials and electronics content; site and geography; production period; included and outsourced processes; test specification and configuration; allocation methods; packaging boundary"
  required_quality_disclosure: "data sources and collection protocols; metering and allocation coverage; BOM and mass-balance reconciliation; test traceability; technological, geographical and time representativeness; precision and uncertainty; data gaps, exclusions and unresolved residuals"
  update_trigger: "Material change to product function or qualifiers, BOM or integral fluid, manufacturing or test technology, supplier or site route, energy or utility system, allocation method, waste or emission control, applicable test standard, or evidence showing that the dataset no longer represents current production"
