allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared processes and utilities"
    rule: "Subdivide by product family, route, machine, production cell, or metered area before allocation whenever records permit."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "Residual shared electricity, water, compressed services, and treatment"
    rule: "Allocate residual shared burdens using a documented causal physical driver such as machine time, metered consumption, processed mass, or treatment load; do not use revenue when a causal physical driver is available."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Rework loops"
    rule: "Assign rework materials, energy, rejects, and losses to the product family that caused the rework; count internal transfers once and disclose repeated processing."
    source_ids: []
  - rule_id: allocation_recovered_material
    applies_to: "Glass, polymer, metal, and coating-material recovery"
    rule: "Keep collection, preparation, and transport burdens inside the foreground boundary until the declared recovery hand-off; report any substitution credit or avoided burden only in a separately disclosed scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_glass_fabrication_records
      process_id: "glass_lens_element_fabrication"
      flow_role: "Optical-glass materials, water, electricity, accepted elements, glass waste, and wastewater"
      record_type: "Batch issue, meter, production, and waste records"
      raw_fields: "product model; glass grade; blank mass; cerium-oxide issue and return; water meter; electricity meter; accepted element mass; glass-waste mass; wastewater mass; solids content; treatment route"
      collection_method: "Reconcile material issues, calibrated meters, accepted-output records, and waste transfer tickets by production lot"
      unit: "kg; kWh; MJ"
      frequency: "Per lot, with utility aggregation no coarser than monthly"
      temporal_coverage: "Representative continuous 12-month period or documented campaign"
      site_scope: "Each reporting facility and applicable production cell"
      aggregation_rule: "Sum by process and product family, subtract documented internal returns, convert units, then divide by accepted objective-lens mass"
      quality_evidence: "Purchase and issue records; meter calibration; lot travelers; inspection results; waste tickets; mass-balance reconciliation"
    - protocol_id: cp_polymer_molding_records
      process_id: "polymer_lens_element_molding"
      flow_role: "Polymer granulates, electricity, accepted molded elements, and rejects"
      record_type: "Batch issue, meter, molding, and reject records"
      raw_fields: "model; polymer grade; virgin granulate mass; regrind return; electricity; accepted element mass; reject mass; treatment route"
      collection_method: "Reconcile dryer and molding-cell records with material issues and inspected lot output"
      unit: "kg; kWh; MJ"
      frequency: "Per molding lot, with utility aggregation no coarser than monthly"
      temporal_coverage: "Representative continuous 12-month period or documented campaign"
      site_scope: "Each reporting facility and molding cell"
      aggregation_rule: "Sum virgin input and unrecovered rejects by polymer and product family, convert electricity, then normalize to accepted objective-lens mass"
      quality_evidence: "Resin certificates; issue records; machine logs; meter records; inspection and reject records"
    - protocol_id: cp_coating_records
      process_id: "optical_coating"
      flow_role: "Lens elements, coating materials, cleaning water, electricity, and accepted coated elements"
      record_type: "Coating batch, target issue, meter, cleaning, and inspection records"
      raw_fields: "substrate identity; layer recipe; target or precursor issue and return; lens mass in and accepted out; water; electricity; rejected mass; chamber and batch id"
      collection_method: "Reconcile coating travelers, target mass change or issue records, meters, and acceptance inspection"
      unit: "kg; kWh; MJ"
      frequency: "Per coating batch, with utility aggregation no coarser than monthly"
      temporal_coverage: "Representative continuous 12-month period or documented campaign"
      site_scope: "Each reporting facility, cleaning line, and coating chamber"
      aggregation_rule: "Aggregate only batches with the same declared technology and recipe, then normalize to accepted objective-lens mass"
      quality_evidence: "Recipe authorization; target issue or weighing record; calibrated meters; chamber logs; coating inspection"
    - protocol_id: cp_optomechanical_fabrication_records
      process_id: "optomechanical_component_fabrication"
      flow_role: "Alloy input, electricity, accepted components, and aluminium scrap"
      record_type: "Material issue, machine, meter, inspection, and scrap records"
      raw_fields: "product model; alloy grade; stock mass; electricity; accepted component mass; aluminium scrap mass; coolant-contamination status; recovery route"
      collection_method: "Reconcile stock issues and returns with accepted component and segregated scrap weights"
      unit: "kg; kWh; MJ"
      frequency: "Per lot, with utility aggregation no coarser than monthly"
      temporal_coverage: "Representative continuous 12-month period or documented campaign"
      site_scope: "Each reporting facility and machining cell"
      aggregation_rule: "Sum by alloy and component family, convert electricity, then normalize to accepted objective-lens mass"
      quality_evidence: "Material certificate; weigh tickets; machine and meter records; inspection results; recycler receipt"
    - protocol_id: cp_assembly_testing_packaging_records
      process_id: "objective_lens_assembly_testing_packaging"
      flow_role: "Components, adhesive, electricity, packaging, accepted product, and final rejects"
      record_type: "Bill of material, batch issue, meter, test, packing, and reject records"
      raw_fields: "model; optical-element mass; component-set mass; adhesive mix and loss; electricity; each packaging-component mass; accepted net product mass; test result; reject mass and route"
      collection_method: "Reconcile BOM issues with serial or lot acceptance, packing records, and rejected-assembly disposition"
      unit: "kg; kWh; MJ"
      frequency: "Per assembly lot, with utility aggregation no coarser than monthly"
      temporal_coverage: "Representative continuous 12-month period or documented campaign"
      site_scope: "Each reporting facility and assembly or test line"
      aggregation_rule: "Sum accepted and rejected lots by product family, convert electricity, and divide every exchange by accepted net finished-product mass"
      quality_evidence: "BOM revision; issue records; meter calibration; test reports; serial or lot acceptance; packing specification; waste ticket"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "Normalized amount = net exchange amount attributable to the represented product family / accepted net objective-lens mass."
      inputs:
        - "Net row amount"
        - "accepted net objective-lens mass"
      output: "Exchange amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Electricity rows"
      rule: "Delivered electricity in MJ = metered electricity in kWh × 3.6; subtract separately metered export and exclude upstream generation emissions from foreground elementary flows."
      inputs:
        - "Metered kWh"
        - "documented export"
      output: "MJ delivered electricity"
      source_ids: []
    - id: calc_water_conversion
      applies_to: "Process-water rows"
      rule: "Water mass = metered volume × recorded or justified density at the measurement condition; retain original volume and density evidence."
      inputs:
        - "Water volume"
        - temperature
        - density
      output: "kg process water"
      source_ids: []
    - id: calc_material_return
      applies_to: "Material input rows"
      rule: "Net material input = issued virgin material + externally supplied recycled material - unopened return - documented same-process internal return already counted in the issue record."
      inputs:
        - Issue
        - return
        - "and inventory records"
      output: "kg net material input"
      source_ids: []
    - id: calc_reject_yield
      applies_to: "Product and reject rows"
      rule: "Accepted yield = accepted product mass / (accepted product mass + unrecovered reject mass); report separately by product family and route."
      inputs:
        - "Accepted mass"
        - "reject mass"
      output: "Accepted yield and normalized reject mass"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Each material-processing process"
      rule: "Reconcile measured material inputs with accepted output, transferred intermediates, wastes, emissions, inventory change, and documented internal return; investigate unexplained imbalance before publication."
      inputs:
        - Input
        - output
        - waste
        - return
        - "and stock-change records"
      output: "Process mass-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Link records to model or product family and declare all required qualifiers, acceptance specifications, and factory-gate packaging state."
      evidence: "Product specification, BOM revision, routing, and acceptance-test record"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Identify every in-house and purchased step and explain every not-applicable conditional process; add atomic rows for actual materials, packaging components, wastes, and direct emissions not represented by the cards above."
      evidence: "Approved process flow, supplier list, utility map, waste register, and completeness review"
    - id: dq_measurement
      applies_to: "Metered and weighed exchanges"
      requirement: "Use calibrated or verified instruments; retain unit conversions, allocation drivers, meter coverage, and estimates used to close data gaps."
      evidence: "Calibration certificates, meter map, weigh records, and calculation workbook"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Prefer a representative continuous 12-month period; for campaigns, document start and end dates, production volume, seasonality, maintenance, and why the campaign represents normal operation."
      evidence: "Reporting-period records and representativeness statement"
    - id: dq_mass_balance
      applies_to: "Material-processing processes"
      requirement: "Resolve material-balance discrepancies and prevent double counting of internal intermediates, returned slurry, polymer regrind, rework, and recovered scrap."
      evidence: "Signed reconciliation by process and product family"
    - id: dq_source_match
      applies_to: "Upstream datasets"
      requirement: "Match material grade, product state, electricity grid, water supply, geography, technology, and waste-treatment route; disclose proxy datasets."
      evidence: "Dataset-selection log and gap register"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "Reference flow"
    rule: "assembly_objective_lens shall use UUID cfef9f14-3271-428b-bebe-47ded2db11d4, Mass, kg, and normalize to exactly 1 kg accepted finished product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_required_process
    applies_to: "Process map"
    rule: "objective_lens_assembly_testing_packaging shall be present; each conditional process shall be included or carry a product- and site-specific not-applicable explanation."
    source_ids:
      - nikon-tochigi-lens-process
  - rule_id: validation_atomic_inventory
    applies_to: "Inventory"
    rule: "Every actual material, electricity supply, water supply, packaging component, waste stream, and direct elementary emission shall be represented by one atomic row with direction, flow type, amount rule, basis, evidence, and UUID or declared unresolved identity."
    source_ids: []
  - rule_id: validation_internal_transfers
    applies_to: "Intermediate flows"
    rule: "The mass and identity of each internal lens-element or component transfer shall agree between the supplying and receiving processes; do not count the transfer as a purchased input."
    source_ids: []
  - rule_id: validation_route_materials
    applies_to: "Glass, polymer, coating, and optomechanical routes"
    rule: "Include only applicable material cards and add separate rows for every actual unlisted glass, polymer, polishing compound, coating substance, metal, plastic, adhesive, or packaging component."
    source_ids:
      - canon-production-technology
      - nikon-tochigi-lens-process
  - rule_id: validation_waste_routes
    applies_to: "Waste outputs"
    rule: "Solid glass waste, wastewater, polymer rejects, aluminium scrap, and composite assembly rejects shall not be merged; state moisture or solids content and the first treatment or recovery hand-off."
    source_ids:
      - nikon-lens-environment
      - epa-optical-fabrication-waste-1991
  - rule_id: validation_electricity_scope
    applies_to: "Electricity"
    rule: "Electricity shall be process-attributed, converted consistently to MJ, and shall not cause upstream grid emissions to be repeated as foreground elementary flows."
    source_ids: []
  - rule_id: validation_data_period
    applies_to: "Foreground package"
    rule: "Data shall cover the declared period and facilities, identify estimation and allocation shares, and disclose any process whose records do not meet the collection protocol."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; may serve as background_dataset only after independent methodology and data-quality review"
  downstream_use: "Foreground process datasets and lifecycle-model projections for products using camera, projector, photographic enlarger, or photographic reducer objective lenses"
  allowed_use: "Products matching the declared application, optical performance, material route, coating, optomechanical content, factory-gate state, geography, technology, and reporting period"
  excluded_use: "Complete equipment; unmounted general optical elements; ophthalmic, microscope, telescope, or unrelated instrument objectives; materially different substrate, coating, electronics, or assembly routes without adjustment"
  required_metadata: "PCR id and version; model or product family; required qualifiers; included and purchased processes; facility geography; technology; reporting period; allocation; cut-offs; upstream dataset references; UUID gaps; packaging state"
  required_quality_disclosure: "Primary-data share; meter and mass coverage; allocation shares and drivers; accepted yield and reject treatment; material-balance residuals; data gaps; proxies; uncertainty; review status"
  update_trigger: "Material change in product design, optical substrate, coating recipe, optomechanical or electronic content, supplier structure, process technology, facility, electricity mix, waste route, packaging, allocation, reference UUID, or evidence contract"
