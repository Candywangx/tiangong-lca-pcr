review_metadata:
  goal_policy_fingerprint: "sha256:ca4d48461138cec48aa51cf1438775f652663ac663b161c0203fabc5dc779d27"
  semantic_boundary_review:
    decision: promote_legacy
    explanation: "The canonical boundary is the saleable part or accessory made specifically for a hydraulic or pneumatic automatic regulating or controlling good, or for another measuring, checking, regulating or controlling good n.e.c.; it excludes the complete host goods and parts assigned to other CPC 4828 subclasses. No existing material PCR has this same parts-and-accessories boundary."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: fm_aluminium_alloy
        reason_code: manual_review_required
        explanation: "Two public mass-based unwrought aluminium-alloy records are indistinguishable, while the wrought candidates are volume-based; the actual alloy grade and supplied form must be resolved without arbitrary UUID selection."
      - row_id: fm_stainless_steel_sheet
        reason_code: semantic_mismatch
        explanation: "Ranked records either lack a stainless identity or conflict across English name, Chinese name, and classification."
      - row_id: fm_stainless_steel_scrap
        reason_code: no_exact_candidate
        explanation: "Available records are external-supply grade-specific scrap or generic post-industrial steel scrap without a confirmed stainless composition."
      - row_id: fm_polycarbonate_scrap
        reason_code: no_exact_candidate
        explanation: "Search returned PVC waste and printed-wiring-board scrap, not polycarbonate production scrap."
      - row_id: sf_metal_finishing_wastewater
        reason_code: no_exact_candidate
        explanation: "The only candidate was evaporation condensate, which does not represent route-specific metal-finishing wastewater."
      - row_id: ea_populated_printed_wiring_board
        reason_code: no_exact_candidate
        explanation: "Ranked product records had inconsistent classifications, combined collection identities, or application-specific boundaries outside CPC 48284."
      - row_id: fi_polyethylene_packaging_film
        reason_code: no_exact_candidate
        explanation: "Candidates were misclassified, generic plastic film, a service, or polyethylene without explicit film state."
      - row_id: fi_reference_product
        reason_code: no_exact_candidate
        explanation: "All five reference-product candidates were classified to CPC 48281 or CPC 48252, or denoted complete instruments rather than CPC 48284 parts or accessories."
    range_evidence_needs:
      - row_id: fm_aluminium_alloy
        explanation: "Collect product-specific bill-of-material and receipt data; no two independent boundary-compatible empirical sources support a generic mass-input or yield range."
      - row_id: fm_stainless_steel_sheet
        explanation: "Collect product-specific bill-of-material and receipt data; no two independent boundary-compatible empirical sources support a generic mass-input or yield range."
      - row_id: fm_polycarbonate_granulate
        explanation: "Collect product-specific bill-of-material and batch data; no two independent boundary-compatible sources support a generic polymer-input range."
      - row_id: fm_electricity
        explanation: "Collect metered electricity; no two independent sources have compatible products, technologies, and boundaries across the heterogeneous forming routes."
      - row_id: fm_industrial_oxygen
        explanation: "Collect supplier and meter records when oxygen-assisted cutting applies; compatible external range evidence is insufficient."
      - row_id: fm_process_water
        explanation: "Collect meter or tank records for wet machining and cleaning; compatible external range evidence is insufficient."
      - row_id: fm_aluminium_scrap
        explanation: "Determine aluminium scrap by product-specific mass balance; compatible empirical yield evidence is insufficient."
      - row_id: fm_stainless_steel_scrap
        explanation: "Determine stainless-steel scrap by product-specific mass balance; compatible empirical yield evidence is insufficient."
      - row_id: fm_polycarbonate_scrap
        explanation: "Determine polycarbonate scrap by product-specific mass balance; compatible empirical yield evidence is insufficient."
      - row_id: sf_sodium_hydroxide
        explanation: "Collect actual solution concentration and replenishment records because bath chemistry and loading are route-specific."
      - row_id: sf_process_water
        explanation: "Collect route-specific metered rinse water; compatible external range evidence is insufficient."
      - row_id: sf_electricity
        explanation: "Collect route-specific electricity meter records; compatible external range evidence is insufficient."
      - row_id: sf_metal_finishing_wastewater
        explanation: "Collect discharge and treatment records because wastewater quantities are not compatible across bath chemistries."
      - row_id: ea_populated_printed_wiring_board
        explanation: "Collect the product-specific bill of materials because board mass and population depend on the declared accessory design."
      - row_id: ea_lead_free_solder
        explanation: "Collect feeder and replenishment records; compatible external range evidence is insufficient."
      - row_id: ea_electricity
        explanation: "Collect line or allocated meter records; compatible external range evidence is insufficient."
      - row_id: ea_populated_board_scrap
        explanation: "Collect reject logs and weights; compatible external reject-rate evidence is insufficient."
      - row_id: fi_corrugated_board_box
        explanation: "Collect packaging specifications and issue records because packaging mass is sale-unit-specific."
      - row_id: fi_polyethylene_packaging_film
        explanation: "Collect packaging specifications and issue records because film mass is sale-unit-specific."
      - row_id: fi_electricity
        explanation: "Collect test-bench or allocated meter records; compatible final-test energy evidence is insufficient."
      - row_id: fi_reference_product
        explanation: "Determine output from accepted-unit weights and counts; no empirical yield range is compatible across this heterogeneous category."
