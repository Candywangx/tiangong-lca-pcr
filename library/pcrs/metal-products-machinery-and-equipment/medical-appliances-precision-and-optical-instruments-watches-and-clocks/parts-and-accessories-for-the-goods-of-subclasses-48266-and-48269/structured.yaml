allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "shared or multifunctional foreground operations"
    rule: "Avoid allocation by separately metering, timing, weighing, or otherwise subdividing processes and collecting only the exchanges directly attributable to the declared product."
    source_ids:
      - eu-pef-method-2021
  - rule_id: al_physical_relationship
    applies_to: "shared exchanges that cannot be subdivided"
    rule: "Allocate using a documented causal physical relationship, such as machine time and rated or measured power for electricity, bath loading or treated surface area for finishing, or accepted mass throughput when it represents resource use."
    source_ids:
      - eu-pef-method-2021
  - rule_id: al_other_relationship
    applies_to: "exchanges without a defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and physical allocation are infeasible; report the data period, products, factors, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: al_scrap_no_credit
    applies_to: "manufacturing scrap and waste"
    rule: "Report scrap as an outgoing waste flow at the foreground boundary. Do not subtract an avoided-production credit inside this gate-to-gate inventory unless a separately declared downstream system-expansion study requires it."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_fm_bom_receipts
      process_id: "material_forming_machining"
      flow_role: "product-specific material inputs"
      record_type: "approved bill of materials, purchase/receipt records, material issue and return records"
      raw_fields: "product_revision; production_order; material_name; grade; supplied_form; quantity_issued; unopened_return; unit"
      collection_method: "Reconcile approved bill of materials to warehouse issues and returns for qualifying orders"
      unit: "kg"
      frequency: "each production order, aggregated monthly"
      temporal_coverage: "representative continuous 12 months or all batches if production is shorter"
      site_scope: "all reporting-site forming, machining, and moulding lines"
      aggregation_rule: "Sum issued mass minus documented unopened returns; allocate only to qualifying orders and normalize by accepted output mass"
      quality_evidence: "controlled bill of materials, material certificates, calibrated scales, issue/return audit trail"
    - protocol_id: cp_fm_utilities
      process_id: "material_forming_machining"
      flow_role: "electricity, industrial oxygen, and process water"
      record_type: "utility meters, supplier invoices, cylinder/tank balances, machine logs"
      raw_fields: "meter_id; opening; closing; unit; reference_conditions; machine_hours; production_order; allocation_driver"
      collection_method: "Prefer submetering; otherwise reconcile site totals and apply a documented physical driver"
      unit: "kWh, m3, kg"
      frequency: "meter period and each cylinder/tank change"
      temporal_coverage: "representative continuous 12 months or all batches if shorter"
      site_scope: "included forming, machining, moulding, extraction, and cooling equipment"
      aggregation_rule: "Convert electricity to MJ; standardize gas volume; allocate by causal driver; normalize by accepted output mass"
      quality_evidence: "meter calibration, invoice reconciliation, machine log, reference-condition record"
    - protocol_id: cp_fm_waste
      process_id: "material_forming_machining"
      flow_role: "material-specific manufacturing scrap"
      record_type: "scrap-bin weights, waste transfer notes, reject records"
      raw_fields: "material; alloy_or_polymer; source_order; gross_weight; tare; destination; date"
      collection_method: "Weigh each segregated material stream and reconcile with production mass balance"
      unit: "kg"
      frequency: "each dispatch or batch"
      temporal_coverage: "same period as material inputs"
      site_scope: "all included fabrication lines"
      aggregation_rule: "Sum net outgoing mass by material and normalize by accepted output mass"
      quality_evidence: "calibrated scale, tare record, transfer note, material segregation check"
    - protocol_id: cp_sf_inputs
      process_id: "surface_finishing"
      flow_role: "bath chemicals, rinse water, and electricity"
      record_type: "bath make-up and replenishment logs, chemical receipts, meters"
      raw_fields: "bath_id; chemistry; product_concentration; addition_mass; water_meter; electricity_meter; treated_order; treated_mass"
      collection_method: "Record each chemical separately and reconcile bath additions and utility meters to treated orders"
      unit: "kg, kWh"
      frequency: "each addition and meter period"
      temporal_coverage: "representative continuous 12 months or all campaigns if shorter"
      site_scope: "all included surface-treatment lines"
      aggregation_rule: "Sum qualifying additions and metered utilities; convert electricity to MJ; normalize by accepted output mass"
      quality_evidence: "bath log, concentration analysis, supplier certificate, meter calibration"
    - protocol_id: cp_sf_waste
      process_id: "surface_finishing"
      flow_role: "metal-finishing wastewater"
      record_type: "discharge meter, tank transfer, wastewater manifest, analytical results"
      raw_fields: "stream_id; volume_or_mass; density; bath_origin; constituents; destination; date"
      collection_method: "Meter or tank-balance each distinct wastewater stream and retain analytical characterization"
      unit: "kg"
      frequency: "each discharge or transfer"
      temporal_coverage: "same period as surface-treatment inputs"
      site_scope: "included baths, rinses, and local treatment"
      aggregation_rule: "Convert to mass using measured density when needed; sum by distinct waste identity and normalize by accepted output mass"
      quality_evidence: "calibrated meter, tank reconciliation, laboratory report, waste manifest"
    - protocol_id: cp_ea_bom
      process_id: "electronics_assembly"
      flow_role: "populated board and solder inputs"
      record_type: "bill of materials, board receipts/issues, solder feeder and inventory records"
      raw_fields: "product_revision; board_identity; board_mass; solder_identity; alloy; flux_state; issue_mass; return_mass; order"
      collection_method: "Reconcile product-specific electronics bill of materials to physical issues and returns"
      unit: "kg"
      frequency: "each production order"
      temporal_coverage: "representative continuous 12 months or all batches if shorter"
      site_scope: "included electronics assembly lines"
      aggregation_rule: "Sum net issue mass by atomic input and normalize by accepted output mass"
      quality_evidence: "approved bill of materials, supplier certificate, calibrated balance, feeder reconciliation"
    - protocol_id: cp_ea_energy_waste
      process_id: "electronics_assembly"
      flow_role: "electricity and populated-board rejects"
      record_type: "line meter, equipment logs, reject log, reject weights"
      raw_fields: "meter_id; kWh; line_hours; product_order; reject_board_identity; reject_mass; disposition"
      collection_method: "Submeter or physically allocate line electricity and weigh populated-board rejects separately"
      unit: "kWh, kg"
      frequency: "shift or batch"
      temporal_coverage: "same period as electronics inputs"
      site_scope: "included placement, soldering, extraction, and inspection equipment"
      aggregation_rule: "Convert electricity to MJ; sum reject mass; normalize both by accepted output mass"
      quality_evidence: "meter calibration, equipment log, reject authorization, scale record"
    - protocol_id: cp_fi_pack_energy
      process_id: "final_inspection_packaging"
      flow_role: "packaging and final-stage electricity"
      record_type: "packaging specifications, issue records, test-bench meters, accepted counts"
      raw_fields: "packaging_identity; packaging_mass; units_per_pack; issue_quantity; kWh; accepted_count; product_revision"
      collection_method: "Weigh packaging samples for the same specification and reconcile issues; meter or physically allocate final-stage electricity"
      unit: "kg, kWh"
      frequency: "each packaging lot and meter period"
      temporal_coverage: "representative continuous 12 months or all batches if shorter"
      site_scope: "final assembly, test, inspection, and sale-unit packaging"
      aggregation_rule: "Allocate packaging by actual packed units; convert electricity to MJ; normalize by accepted output mass"
      quality_evidence: "packaging specification, sample-weigh record, issue reconciliation, meter calibration"
    - protocol_id: cp_fi_output
      process_id: "final_inspection_packaging"
      flow_role: "accepted reference-product output"
      record_type: "final inspection record, serial/lot register, accepted count, unit weights"
      raw_fields: "product_revision; lot; accepted_count; rejected_count; unit_mass_sample; total_accepted_mass; test_result"
      collection_method: "Count only accepted units and determine output mass by total weighing or representative unit-mass sampling"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as all inventory records"
      site_scope: "all final acceptance points in the reporting site"
      aggregation_rule: "Sum accepted output mass; use it as the denominator for all normalized exchanges"
      quality_evidence: "approved acceptance criteria, calibrated scale, sampling record, signed release record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = qualifying allocated amount / accepted reference-product mass"
      inputs:
        - "allocated exchange amount"
        - "accepted output mass from cp_fi_output"
      output: "amount per 1 kg accepted reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_electricity_conversion
      applies_to: "fm_electricity; sf_electricity; ea_electricity; fi_electricity"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ of purchased electricity"
      source_ids: []
    - id: calc_piece_mass
      applies_to: "count-based material, packaging, or output records"
      rule: "mass = count × representative measured mass per piece for the same revision and specification"
      inputs:
        - count
        - "sample mean mass"
        - "sample size"
      output: "kg"
      source_ids: []
    - id: calc_material_mass_balance
      applies_to: "aluminium, stainless steel, and polycarbonate routes"
      rule: "opening inventory + receipts - closing inventory = accepted internal/output mass + separately identified scrap + separately identified retained material; investigate unexplained difference"
      inputs:
        - inventory
        - receipt
        - issue
        - return
        - output
        - "and waste weights"
      output: "reconciled material quantities and unexplained difference"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and all bill-of-material rows"
      requirement: "Use one declared product and drawing revision; retain host-good subclass, function, accepted specification, and material/component identifiers."
      evidence: "approved drawing, bill of materials, specification, acceptance record"
    - id: dq_temporal_alignment
      applies_to: "all rows"
      requirement: "Use the same representative reporting period for inputs, outputs, allocation drivers, and accepted production; disclose shutdowns, prototypes, rework, and abnormal campaigns."
      evidence: "dated meters, orders, logs, and production reconciliation"
    - id: dq_measurement
      applies_to: "mass, energy, water, and gas records"
      requirement: "Use calibrated or verified instruments appropriate to the measured quantity; record resolution, calibration status, and any conversion assumptions."
      evidence: "calibration certificate, meter check, sample-weigh record"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile the product-specific bill of materials, utilities, outputs, and each material-specific waste stream; explain omissions and mass-balance differences."
      evidence: "signed reconciliation and variance investigation"
    - id: dq_representativeness
      applies_to: "upstream datasets and allocations"
      requirement: "Document geography, technology, time, product state, supplier, and allocation driver; disclose every proxy and why it is used."
      evidence: "dataset metadata, supplier record, allocation worksheet"
validation_rules:
  - rule_id: vr_identity_boundary
    applies_to: "dataset identity"
    rule: "Confirm the output is a dedicated part or accessory for a declared CPC 48266 or 48269 host good, not a complete instrument or a part classified elsewhere."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: vr_reference_output
    applies_to: "reference flow"
    rule: "Confirm accepted output equals 1 kg after normalization and rejected units are excluded from the reference product."
    source_ids:
      - eu-pef-method-2021
  - rule_id: vr_route_condition
    applies_to: "process map and inventory"
    rule: "Confirm every included process and flow occurred for the declared revision, and every non-applicable conditional row is supported by route or bill-of-material evidence."
    source_ids:
      - eu-pef-method-2021
      - eu-jrc-stm-bref-2006
      - eu-jrc-sts-bref-2020
  - rule_id: vr_atomic_flows
    applies_to: "inventory"
    rule: "Reject umbrella material, utility, fuel, chemical, waste, wastewater, or emissions rows; each exchange must have one physical or chemical identity and one direction."
    source_ids:
      - eu-pef-method-2021
  - rule_id: vr_uuid_semantics
    applies_to: "UUID-bearing flows"
    rule: "Confirm flow type, baseName, classification, product state, property, unit group, and foreground qualifier compatibility; do not use a proxy UUID."
    source_ids: []
  - rule_id: vr_mass_reconciliation
    applies_to: "material-forming routes"
    rule: "Reconcile each declared aluminium, stainless-steel, and polycarbonate input with accepted material, separately identified scrap, retained inventory, and explained difference."
    source_ids:
      - eu-pef-method-2021
  - rule_id: vr_allocation
    applies_to: "shared processes"
    rule: "Verify subdivision was attempted first and every remaining allocation driver is causal, period-aligned, documented, and consistently applied."
    source_ids:
      - eu-pef-method-2021
  - rule_id: vr_bilingual_alignment
    applies_to: "PCR implementation metadata"
    rule: "Preserve process ids, row ids, rule ids, UUIDs, controlled values, reference amount, and source ids across English and Chinese implementation views."
    source_ids: []
published_dataset_profile:
  dataset_role: "product-specific foreground manufacturing dataset for one declared part or accessory configuration"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate modelling of the declared CPC 48284 part or accessory and its use as an input to a compatible host-good lifecycle model"
  excluded_use: "Generic representation of all instrument parts; complete CPC 48266 or 48269 goods; other CPC 4828 parts; use-stage, maintenance, distribution, or end-of-life claims without added downstream modelling; comparative assertion across unlike designs without equivalence review"
  required_metadata: "canonical PCR id; CPC context; host-good subclass; part/accessory function; product and drawing revision; accepted-unit mass; bill of materials; route; process ownership; surface chemistry; electronics content; packaging state; geography; technology; reference period; allocation; data quality; unresolved UUIDs and proxies"
  required_quality_disclosure: "primary-data coverage by process and flow; meter and scale status; bill-of-material reconciliation; material mass-balance differences; allocation drivers; upstream dataset representativeness; exclusions; abnormal production; wastewater characterization; proxy and UUID gaps"
  update_trigger: "change in host-good applicability, product revision, material grade or mass, supplied form, process route, surface chemistry, electronics design, packaging, supplier geography or technology, allocation basis, reference period, or a newly confirmed exact Tiangong UUID"
