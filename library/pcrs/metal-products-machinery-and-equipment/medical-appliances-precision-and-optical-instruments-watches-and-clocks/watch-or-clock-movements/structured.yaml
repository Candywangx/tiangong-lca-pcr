allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "shared fabrication, cleaning, assembly, testing, and site services"
    rule: "Avoid allocation by separately metering or otherwise subdividing product-specific work centres and lots. If subdivision is not feasible, document why before selecting another relationship."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: al_physical_relation
    applies_to: "shared processes producing several movement families"
    rule: "Allocate remaining shared exchanges using a causal physical relationship such as machine time, cleaning load, tested unit time, or net processed mass that matches the exchange driver; document the factor and source records."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: al_other_relation
    applies_to: "shared processes lacking a defensible physical relation"
    rule: "Economic or another relationship may be used only after subdivision, system expansion, and physical allocation are shown infeasible; disclose prices, period, currency, factor, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: al_scrap_treatment
    applies_to: "machining scrap and rejected movements"
    rule: "Keep scrap and rejected movements as waste outputs through the first treatment handoff. Do not add an avoided-primary-material credit inside the foreground inventory unless the downstream study explicitly applies and discloses a consistent recycling allocation method."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_fabrication_records
      process_id: "component_fabrication"
      flow_role: "Each listed material, electricity, accepted-component, and scrap exchange"
      record_type: "purchase and issue records; stock counts; scales; electricity meters; waste transfer records"
      raw_fields: "calibre; material grade; opening and closing stock; receipts; returns; accepted output mass; scrap mass; meter reading; meter allocation driver; timestamps"
      collection_method: "reconcile each atomic material and output by lot and reporting period; retain meter and scale identifiers"
      unit: "kg; MJ"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all in-scope component-fabrication work centres"
      aggregation_rule: "sum net atomic inputs and outputs, allocate shared meters by documented causal driver, then normalize to accepted reference output"
      quality_evidence: "calibrated scale and meter records; stock reconciliation; waste transfer receipts; material balance"
    - protocol_id: cp_precision_cleaning_records
      process_id: "precision_cleaning"
      flow_role: "Each listed component, water, isopropanol, electricity, wastewater, and spent-solvent exchange"
      record_type: "batch tickets; chemical issues; tank inventories; water and electricity meters; discharge meters; waste manifests"
      raw_fields: "cleaning route; component mass; water; isopropanol purchases, recovery, stock and transfer; electricity; wastewater volume; spent-solvent gross and tare mass; chemistry indicators"
      collection_method: "reconcile each cleaning campaign, segregating aqueous and solvent routes and recovery loops"
      unit: "kg; m3; MJ"
      frequency: "each cleaning campaign with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all in-scope cleaning equipment and local extraction"
      aggregation_rule: "sum by atomic exchange and route, subtract documented recovery transfers, and normalize to accepted reference output"
      quality_evidence: "calibrated meter records; chemical inventory reconciliation; discharge analysis; waste manifests"
    - protocol_id: cp_movement_assembly_records
      process_id: "movement_assembly"
      flow_role: "Each listed component, electronic part, lubricant, battery, electricity, and assembled-intermediate exchange"
      record_type: "bills of material; goods issues; stock counts; dispenser logs; assembly counters; scales; electricity meters"
      raw_fields: "calibre; route; component identifier; quantity; measured unit mass; lubricant issue and stock; battery chemistry and size; electricity; assembled output mass; timestamps"
      collection_method: "reconcile component and consumable issues to each movement lot; convert counts only with measured lot-average masses"
      unit: "kg; MJ"
      frequency: "each assembly lot with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all in-scope assembly lines and clean areas"
      aggregation_rule: "sum by atomic exchange and route, subtract returned unused input, and normalize to accepted reference output"
      quality_evidence: "controlled bill of material; calibrated scales; inventory reconciliation; meter records; lot traceability"
    - protocol_id: cp_adjustment_testing_records
      process_id: "adjustment_testing"
      flow_role: "Assembled input, electricity, accepted output, and rejected movement"
      record_type: "test-system logs; inspection records; rework logs; scales; electricity meters; waste disposition records"
      raw_fields: "calibre; input count and mass; test specification; pass, fail, and rework status; accepted mass; final rejected mass; electricity; timestamps"
      collection_method: "link each serial or lot result to the declared acceptance specification and final disposition"
      unit: "kg; MJ"
      frequency: "each test lot with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all in-scope adjustment and test stations"
      aggregation_rule: "accepted output plus final rejects must reconcile with input, stock change, and documented rework losses; normalize to accepted output"
      quality_evidence: "test-equipment calibration; signed acceptance records; rework trace; scale and meter calibration"
    - protocol_id: cp_dispatch_packaging_records
      process_id: "dispatch_packaging"
      flow_role: "Accepted movement, corrugated box, and reference output"
      record_type: "packing lists; package issue records; package tare measurements; accepted movement scale records"
      raw_fields: "calibre; assembly state; accepted net mass; package type; count; empty mass; reuse or return status; final shipped net mass; timestamps"
      collection_method: "weigh representative empty packages and reconcile issued packages to shipped movements"
      unit: "kg"
      frequency: "each dispatch lot with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or declared campaign"
      site_scope: "all in-scope dispatch packing areas"
      aggregation_rule: "report packaging separately; normalize atomic packaging mass to 1 kg net conforming movement output"
      quality_evidence: "packing list reconciliation; calibrated scales; package specification; return records"
  calculation_rules:
    - id: calc_net_material_input
      applies_to: "stainless steel, brass, isopropanol, electronic parts, lubricant, and batteries"
      rule: "net consumed mass = opening stock + receipts - closing stock - documented returns - recovered unused material transferred out"
      inputs:
        - stock
        - receipt
        - return
        - recovery
        - "and measured unit-mass records"
      output: "kg atomic input per 1 kg reference output"
      source_ids:
        - mass-balance-identity
    - id: calc_energy_normalization
      applies_to: "electricity rows"
      rule: "normalized electricity = metered process electricity × declared allocation share ÷ net conforming reference output mass; convert kWh to MJ with 3.6 MJ/kWh when needed"
      inputs:
        - "meter readings"
        - "allocation driver"
        - "output mass"
        - "energy unit"
      output: "MJ per 1 kg reference output"
      source_ids:
        - mass-balance-identity
    - id: calc_process_mass_balance
      applies_to: "each foreground process"
      rule: "input mass + opening work in progress = product output + waste output + closing work in progress + quantified direct mass releases; investigate unexplained remainder"
      inputs:
        - "atomic input"
        - output
        - waste
        - stock
        - "and direct-release records"
      output: "process mass-balance residual and completeness flag"
      source_ids:
        - mass-balance-identity
    - id: calc_reject_mass
      applies_to: "rejected movements"
      rule: "final rejected mass = failed-test mass - mass of units successfully reworked and returned to accepted output"
      inputs:
        - "test disposition"
        - rework
        - "and scale records"
      output: "kg rejected movement per 1 kg reference output"
      source_ids:
        - mass-balance-identity
    - id: calc_reference_output
      applies_to: "reference movement"
      rule: "normalized amount = measured net conforming movement mass ÷ the same measured net conforming movement mass"
      inputs:
        - "accepted lot mass"
      output: "1 kg reference movement"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and purchased components"
      requirement: "Maintain calibre, movement class, regulating system, assembly state, component completeness, battery inclusion, material or component specification, supplier, and lot traceability."
      evidence: "product specification; bill of material; supplier declaration; lot record"
    - id: dq_measurement
      applies_to: "all quantitative rows"
      requirement: "Use calibrated meters or scales, record units and conversions, retain raw readings, and document any shared-meter allocation driver."
      evidence: "calibration certificates; meter exports; scale tickets; calculation workbook"
    - id: dq_temporal
      applies_to: "foreground reporting period"
      requirement: "Use a representative continuous 12-month period where available; otherwise disclose campaign dates, seasonality, shutdowns, abnormal production, and representativeness limits."
      evidence: "production calendar; monthly reconciliations; campaign log"
    - id: dq_completeness
      applies_to: "each foreground process"
      requirement: "Reconcile atomic inputs, outputs, wastes, stock change, rework loops, and direct releases. Investigate and disclose material residuals and missing meters."
      evidence: "process mass balance; exception log; waste manifests"
    - id: dq_upstream
      applies_to: "upstream datasets"
      requirement: "Document supplier specificity or the reason for selecting a proxy, including geography, technology, temporal period, composition, and delivered state."
      evidence: "supplier dataset; dataset metadata; representativeness assessment"
    - id: dq_route
      applies_to: "conditional processes and rows"
      requirement: "Mark a process or row not applicable only with evidence that the route, material, battery, cleaning medium, or packaging component was absent from the reported product."
      evidence: "bill of material; route sheet; purchase and issue records"
validation_rules:
  - rule_id: vr_reference_identity
    applies_to: "reference flow"
    rule: "Confirm that the reference output is a movement or complete movement set, not a complete watch or clock, case, individual part, time switch, or time-recording apparatus; verify every required qualifier."
    source_ids:
      - usitc-hts-chapter-91-2013
      - un-cpc-3-0-structure-2025
  - rule_id: vr_reference_amount
    applies_to: "reference amount"
    rule: "Confirm that the normalized output equals 1 kg net conforming movement mass and that packaging mass is reported separately."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_process_coverage
    applies_to: "process map"
    rule: "Confirm that every performed in-house process is included, every omitted conditional process has route evidence, and each required process has a detailed inventory section."
    source_ids:
      - eta-movement-production-sites
      - us-epa-snap-precision-cleaning
  - rule_id: vr_inventory_atomicity
    applies_to: "process inventory"
    rule: "Confirm each row is one atomic physical, chemical, energy, waste, or elementary exchange; reject umbrella utility, material, packaging, waste, or emission labels."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: vr_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm state-100 flow name, Chinese name, flow type, classification, property, unit group, product state, geography, technology, and generalComment remain compatible with the declared exchange."
    source_ids: []
  - rule_id: vr_mass_balance
    applies_to: "foreground processes"
    rule: "Confirm input, output, waste, stock, rework, and direct-release reconciliation; disclose unresolved residuals and do not use missing UUIDs as cut-offs."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_allocation
    applies_to: "shared and multifunctional processes"
    rule: "Confirm subdivision was attempted first and any physical or other allocation factor has a documented driver, period, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: vr_source_and_range
    applies_to: "quantitative constraints"
    rule: "Confirm no external empirical range is used unless at least two independent, original-text-verified, boundary-compatible sources support the synthesis; otherwise retain foreground collection and the unresolved evidence need."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; may be used as background_dataset after review of representativeness and completeness"
  downstream_use: "Foreground data package for movement manufacture and downstream process or lifecyclemodel projections of watches, clocks, timekeeping equipment, and products incorporating movements"
  allowed_use: "Use for the declared movement class, regulating system, calibre family, assembly state, battery inclusion, manufacturing route, geography, technology, and reporting period when required qualifiers and upstream links are present"
  excluded_use: "Complete watches or clocks; cases or other separately marketed parts; time switches and time-recording apparatus; repair; use-phase electricity or battery replacement; end of life; or materially different movement routes without adaptation"
  required_metadata: "PCR id and version; product name and CPC context; movement class; regulating system; calibre and dimensions; assembly and completeness state; display interface; battery inclusion; net product mass; make-or-buy share; process applicability; factory geography; technology; reporting period; allocation; cut-offs; upstream datasets; packaging"
  required_quality_disclosure: "UUID resolution status; source and foreground evidence; measurement and conversion methods; meter allocation; temporal coverage; mass-balance residuals; rework and reject handling; allocation sensitivity; upstream representativeness; unresolved range evidence"
  update_trigger: "Change in calibre family, movement class, regulating system, assembly state, component make-or-buy share, battery inclusion, cleaning chemistry, production technology, site geography, allocation method, packaging system, upstream dataset, or a material flow exceeding the documented review threshold"
