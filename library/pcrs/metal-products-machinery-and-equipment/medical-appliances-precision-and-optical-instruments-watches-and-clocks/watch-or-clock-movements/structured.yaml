measurement_rules:
  - id: mu_reference_mass
    applies_to: "reference product and all mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine net movement mass after final acceptance and before adding returnable transport packaging. Normalize all process exchanges to 1 kg of conforming reference output."
  - id: mu_item_to_mass
    applies_to: "item-count records for movements, batteries, and packages"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts using measured lot-average mass for the exact calibre, battery specification, or package; retain count, sample size, measured mass, and conversion factor. Do not use a generic count-to-mass factor."
  - id: mu_electricity_energy
    applies_to: "purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve the metered electricity quantity and conversion provenance. When source records are in kWh, convert to MJ using 1 kWh = 3.6 MJ without changing the supplier mix, voltage, geography, or loss boundary."
  - id: mu_water_mass
    applies_to: "process water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer measured mass. If volume is metered, record temperature or the declared density factor and convert volume to mass; do not assume density silently."
