allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Multi-product factory operations"
    rule: "First subdivide metered processes, production lines, batches, and waste records wherever independent measurement is practicable."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "Shared assembly, conditioning, testing, and building services"
    rule: "When subdivision is not practicable, allocate shared electricity, water, and waste by a documented causal driver such as machine time, test time, batch count, or measured throughput; use mass only when no more causal driver is available and disclose sensitivity."
    source_ids: []
  - rule_id: allocation_scrap_no_credit
    applies_to: "Aluminium scrap and rejected electronic assemblies"
    rule: "Report waste flows gross at the foreground boundary. Do not subtract scrap revenue or an avoided-primary-material credit from the foreground inventory; model recovery consequences in the selected downstream dataset or an explicitly separate scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_mass
      process_id: "final_assembly_test_pack"
      flow_role: "BOM material, component, accessory, or packaging input"
      record_type: "supplier declaration plus receiving and issue record"
      raw_fields: "item code; material description; supplier; lot; quantity; unit mass; returned mass; BOM revision; accepted and rejected unit counts"
      collection_method: "Reconcile approved BOM to purchasing/warehouse records and verify representative unit mass by calibrated scale"
      unit: "kg"
      frequency: "Per lot, aggregated monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All lines and outsourced steps included in declared site boundary"
      aggregation_rule: "Sum net issued mass by item and map each item once to an atomic flow"
      quality_evidence: "BOM approval, supplier mass evidence, scale calibration, reconciliation record"
    - protocol_id: cp_energy_meter
      process_id: "final_assembly_test_pack"
      flow_role: "electricity input"
      record_type: "meter interval or utility invoice"
      raw_fields: "meter id; start/end reading; interval consumption; voltage; grid supplier; onsite generation/export; allocation driver"
      collection_method: "Read dedicated meter or reconcile submeter totals to invoices"
      unit: "kWh and MJ"
      frequency: "At least monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included fabrication, assembly, cleaning, testing, and packing operations"
      aggregation_rule: "Convert kWh to MJ and allocate shared consumption using section 7"
      quality_evidence: "Meter calibration or invoice reconciliation and allocation worksheet"
    - protocol_id: cp_water_meter
      process_id: "final_assembly_test_pack"
      flow_role: "process-water input"
      record_type: "meter, batch log, or supplier record"
      raw_fields: "source; meter id; volume or mass; temperature; density source; batch; cleaning route"
      collection_method: "Meter or weigh water supplied to included aqueous cleaning"
      unit: "kg"
      frequency: "Per batch or monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "Included cleaning equipment only"
      aggregation_rule: "Convert documented volume to mass when needed and normalize by accepted output mass"
      quality_evidence: "Meter calibration, density record, and batch reconciliation"
    - protocol_id: cp_product_output_mass
      process_id: "final_assembly_test_pack"
      flow_role: "accepted finished-product output"
      record_type: "production and acceptance record"
      raw_fields: "model; serial or batch; BOM revision; accepted count; rejected count; measured unit mass; included accessories; packaging excluded"
      collection_method: "Reconcile acceptance-test release records with calibrated mass measurements"
      unit: "kg"
      frequency: "Per batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "Every covered model produced at the site"
      aggregation_rule: "Sum accepted net product mass by model and reporting period"
      quality_evidence: "Acceptance record, scale calibration, and production reconciliation"
    - protocol_id: cp_waste_mass
      process_id: "final_assembly_test_pack"
      flow_role: "solid manufacturing waste output"
      record_type: "waste transfer and internal scrap record"
      raw_fields: "waste type; source process; container tare/gross mass; contamination; destination; treatment route; date"
      collection_method: "Weigh each waste transfer and reconcile internal scrap movements"
      unit: "kg"
      frequency: "Per transfer, aggregated monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included production waste destinations"
      aggregation_rule: "Sum net mass by atomic waste identity without netting revenue"
      quality_evidence: "Scale calibration, transfer note, and treatment receipt"
    - protocol_id: cp_wastewater_mass
      process_id: "final_assembly_test_pack"
      flow_role: "cleaning-wastewater output"
      record_type: "effluent meter and characterization record"
      raw_fields: "volume or mass; temperature; density source; contaminants; treatment state; destination; batch/date"
      collection_method: "Meter wastewater and retain representative characterization"
      unit: "kg"
      frequency: "Per batch or monthly"
      temporal_coverage: "Complete reporting period"
      site_scope: "Included aqueous-cleaning discharges only"
      aggregation_rule: "Convert documented volume to mass when needed and normalize by accepted output mass"
      quality_evidence: "Meter calibration, sampling record, and treatment receipt"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "Normalized amount = reporting-period row total / reporting-period accepted net equipment mass"
      inputs:
        - "Collected row total"
        - "accepted net equipment mass"
      output: "Exchange per 1 kg accepted net finished equipment"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "Metered kWh"
      output: "Electricity in MJ"
      source_ids: []
    - id: calc_material_balance_screen
      applies_to: "Materials and wastes"
      rule: "Compare total mass inputs with accepted product, separately reported waste, inventory change, and documented evaporation or unmeasured residuals; investigate rather than force a balance"
      inputs:
        - "BOM input mass"
        - "product output mass"
        - "waste mass"
        - "opening/closing inventories"
      output: "Material-balance residual and explanation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and inventory identity"
      requirement: "Preserve model, BOM revision, equipment family, material/part specification, Tiangong flow UUID where resolved, and supplier or waste-route identity."
      evidence: "Approved BOM, supplier specification, flow mapping record, waste transfer record"
    - id: dq_temporal
      applies_to: "Foreground activity"
      requirement: "Cover a representative continuous 12-month period where available; otherwise disclose start/end dates, seasonality, ramp-up, shutdown, and extrapolation."
      evidence: "Meter coverage, production calendar, reconciliation worksheet"
    - id: dq_completeness
      applies_to: "Factory-gate inventory"
      requirement: "Reconcile product output to production records, component inputs to BOM/purchasing, electricity and water to meters/invoices, and waste to transfer records; quantify all exclusions."
      evidence: "Signed completeness checklist and reconciliations"
    - id: dq_technology_geography
      applies_to: "Upstream datasets and shared operations"
      requirement: "Match component state, manufacturing technology, electricity geography/voltage, recycled content, and waste-treatment route; document every proxy."
      evidence: "Dataset selection log and proxy justification"
    - id: dq_uncertainty
      applies_to: "Missing external ranges"
      requirement: "Do not replace missing independent range evidence with an unlabeled case value. Report foreground variability and uncertainty from the collected period and flag the unresolved external benchmark need."
      evidence: "Batch statistics, meter variability, and review metadata"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "Reference product"
    rule: "Confirm the product is finished equipment within the covered boundary, not a camera, cinematographic projector, separately sold objective lens, sensitized medium, chemical preparation, or part/accessory."
    source_ids:
      - un-cpc-3-0-2025
      - wco-hs-2022-chapter-90
  - rule_id: validate_reference_mass
    applies_to: "Functional unit and reference flow"
    rule: "Confirm accepted net equipment mass equals the normalization denominator, packaging is separately reported, and all required qualifiers are present."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Reject combined or umbrella exchanges; each product, waste, and elementary flow must have one physical or chemical identity and one applicable property/unit."
    source_ids: []
  - rule_id: validate_bom_and_meter_reconciliation
    applies_to: "Foreground completeness"
    rule: "Confirm BOM/material, accepted-output, electricity, water, wastewater, and solid-waste records reconcile to the reporting period and declared site scope; explain every residual or excluded route."
    source_ids:
      - kth-moqvist-photo-flash-2020
  - rule_id: validate_uuid_and_range_gaps
    applies_to: "Unresolved references and ranges"
    rule: "Keep unresolved UUID rows blank and linked to manifest review metadata. Do not treat the single product-specific LCA as an external amount range; require two independent boundary-compatible sources before authoring an inferred range."
    source_ids:
      - kth-moqvist-photo-flash-2020
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for a declared other-photographic-equipment model or homogeneous model family"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Product carbon-footprint and LCA models requiring mass-normalized factory-gate production of the declared model and route"
  excluded_use: "Unqualified average for all CPC 48329 equipment; camera production; use-phase service comparison; end-of-life claims; substitution or avoided-burden claims without separate modelling"
  required_metadata: "PCR id/version; equipment family/model; BOM revision; net product mass; included accessories; packaging scope; site/geography; reporting period; route; acceptance test; allocation drivers; cut-offs; unresolved UUIDs; upstream dataset and proxy choices"
  required_quality_disclosure: "Foreground data coverage and reconciliation; meter and scale quality; supplier-data share; temporal/geographical/technological representativeness; recycled content; waste-treatment route; uncertainty; missing independent range evidence"
  update_trigger: "Material change in model or BOM, component supplier/technology, production site, electricity supply, cleaning/testing route, packaging, allocation driver, waste treatment, or a newly resolved Tiangong reference-product/inventory UUID"
