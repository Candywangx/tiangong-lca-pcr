allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "multi-product and shared processes"
    rule: "Avoid allocation by subdividing assembly, test, packaging, and utility records to the declared apparatus family whenever separate measurements or production records are available."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "residual shared burdens"
    rule: "When subdivision is not possible, allocate shared electricity, water, cleaning, and packaging operations using a documented causal physical driver such as machine time, test time, metered energy, processed mass, or accepted unit count. Economic allocation requires a documented reason that no causal physical relation is practicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rejects
    applies_to: "rejected apparatus and components"
    rule: "Attribute burdens through the point of rejection using measured process participation; do not distribute post-rejection rework or treatment to accepted output unless the chosen physical driver causally requires it."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recycling
    applies_to: "end-of-life recovery"
    rule: "State the recycled-content and end-of-life attribution convention, use it consistently for incoming and recovered materials, and prevent double credit between the apparatus system and downstream material systems."
    source_ids:
      - eu-pef-2021-2279
      - eu-weee-2012-19
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly_bom
      process_id: "apparatus_assembly"
      flow_role: "installed component input"
      record_type: "approved BOM, goods receipt, and production issue"
      raw_fields: "model; revision; component identity; supplier; batch; accepted mass; issued mass; return mass; accepted apparatus count"
      collection_method: "Reconcile approved BOM to warehouse issues and accepted build records"
      unit: "kg and item"
      frequency: "each batch or campaign"
      temporal_coverage: "representative continuous 12-month period or all production if shorter"
      site_scope: "every assembly site in scope"
      aggregation_rule: "Net accepted component mass divided by accepted assembled apparatus; keep configuration-specific records separate"
      quality_evidence: "approved BOM revision, supplier specification, calibrated scale record, and reconciliation sign-off"
    - protocol_id: cp_assembly_utilities
      process_id: "apparatus_assembly_packaging_release"
      flow_role: "electricity and process water"
      record_type: "utility meter, submeter, and production log"
      raw_fields: "meter start/end; kWh; water mass or volume; density assumption if converted; operating hours; apparatus count; allocation driver"
      collection_method: "Read dedicated meters where available; otherwise allocate a reconciled facility meter using a causal physical driver"
      unit: "kWh, MJ, kg, and h"
      frequency: "monthly and each representative campaign"
      temporal_coverage: "representative continuous 12-month period or all production if shorter"
      site_scope: "each assembly and packaging site"
      aggregation_rule: "Subtract documented non-production loads, allocate by the declared driver, and divide by accepted output"
      quality_evidence: "meter calibration, invoice reconciliation, downtime log, and allocation worksheet"
    - protocol_id: cp_output_units
      process_id: "apparatus_assembly_packaging_release"
      flow_role: "accepted output"
      record_type: "release and test record"
      raw_fields: "serial or lot; model; configuration; accepted count; rejected count; net mass; packaged mass; test status"
      collection_method: "Count only units passing the declared release tests and measure representative net and gross masses"
      unit: "item and kg"
      frequency: "each batch"
      temporal_coverage: "entire reporting period"
      site_scope: "every release site"
      aggregation_rule: "Sum accepted units by configuration; do not net rejects into accepted output"
      quality_evidence: "signed release record, test result, and scale calibration"
    - protocol_id: cp_packaging_bom
      process_id: "packaging_release"
      flow_role: "packaging input"
      record_type: "packaging specification and issue record"
      raw_fields: "packaging component identity; material; grade; unit mass; issued count; return or scrap count; released apparatus count"
      collection_method: "Reconcile packaging BOM to issued quantities and released units"
      unit: "kg and item"
      frequency: "each packaging configuration and revision"
      temporal_coverage: "reporting period"
      site_scope: "every packaging site"
      aggregation_rule: "Net packaging mass divided by released apparatus; separate reusable transport packaging"
      quality_evidence: "approved packaging specification, supplier declaration, and issue reconciliation"
    - protocol_id: cp_distribution_routes
      process_id: "distribution"
      flow_role: "freight service"
      record_type: "shipment and route record"
      raw_fields: "origin; destination; mode; vehicle or vessel class; shipped gross mass; distance; load factor convention; empty return; delivered units"
      collection_method: "Match carrier documents to geospatial or carrier distance records"
      unit: "kg, km, and kg*km"
      frequency: "each shipment or representative route stratum"
      temporal_coverage: "reporting period"
      site_scope: "all included distribution routes"
      aggregation_rule: "Calculate each mode and leg separately, then divide by delivered reference apparatus"
      quality_evidence: "bill of lading, carrier invoice, route record, and mass reconciliation"
    - protocol_id: cp_use_logs
      process_id: "use_maintenance"
      flow_role: "use electricity and cleaning water"
      record_type: "meter, treatment log, and validated instructions"
      raw_fields: "model; operating mode; power; duration; treatments; standby time; cleaning events; water per event; service-life basis"
      collection_method: "Meter representative apparatus or use validated mode-specific power data with recorded utilization"
      unit: "kWh, MJ, h, cycle, and kg water"
      frequency: "per test campaign with annual utilization update"
      temporal_coverage: "declared reference service life scenario"
      site_scope: "declared user geography and setting"
      aggregation_rule: "Sum mode energy and event water over the declared utilization profile; keep user settings separate"
      quality_evidence: "calibrated meter, protocol, instructions for use, and scenario approval"
    - protocol_id: cp_maintenance_logs
      process_id: "use_maintenance"
      flow_role: "replacement emitter and spent lamp"
      record_type: "service and parts record"
      raw_fields: "serial; date; emitter type; part number; installed mass; removed mass; failure mode; operating hours; treatment route"
      collection_method: "Reconcile service tickets, parts issues, and removed-component records"
      unit: "item, kg, and h"
      frequency: "each maintenance event"
      temporal_coverage: "declared reference service life"
      site_scope: "included installed base or representative service sample"
      aggregation_rule: "Sum installed and removed mass by source technology per reference apparatus"
      quality_evidence: "service ticket, part specification, scale record, and waste consignment note"
    - protocol_id: cp_end_of_life_records
      process_id: "end_of_life"
      flow_role: "discarded apparatus"
      record_type: "collection and treatment record"
      raw_fields: "model; net mass; contamination status; collection route; treatment facility; downstream dataset; geography"
      collection_method: "Match asset retirement to collection and treatment documentation"
      unit: "item and kg"
      frequency: "each disposal event or representative scenario update"
      temporal_coverage: "declared end-of-life scenario year"
      site_scope: "declared end-of-life geography"
      aggregation_rule: "Keep collected, reused, treated, recovered, recycled, and disposed routes separate; normalize to one discarded apparatus"
      quality_evidence: "asset retirement record, waste transfer note, facility evidence, and scenario approval"
  calculation_rules:
    - id: calc_component_per_item
      applies_to: "assembly and packaging material rows"
      rule: "(issued mass - returned unused mass) / accepted output count"
      inputs:
        - "component or packaging issue mass"
        - "return mass"
        - "accepted apparatus count"
      output: "kg per apparatus"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "assembly, packaging, and use electricity"
      rule: "metered kWh × 3.6 MJ/kWh"
      inputs:
        - "metered kWh by process and mode"
      output: "MJ per apparatus or service life"
      source_ids: []
    - id: calc_transport_service
      applies_to: "road and sea freight"
      rule: "shipped gross mass in kg × route distance in km / delivered apparatus count"
      inputs:
        - "shipped mass"
        - "leg distance"
        - "delivered count"
      output: "kg*km per delivered apparatus"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_lifetime_use
      applies_to: "use electricity and cleaning water"
      rule: "Sum mode- or event-specific amount × event count over the declared reference service life"
      inputs:
        - "operating-mode power and hours"
        - "standby power and hours"
        - "cleaning water and event count"
      output: "MJ electricity and kg process water per reference service life"
      source_ids:
        - eu-mdr-2017-745
        - eu-pef-2021-2279
    - id: calc_replacement_balance
      applies_to: "replacement emitter and spent lamp rows"
      rule: "Sum installed replacement mass and removed spent-lamp mass separately by ultraviolet and infrared technology"
      inputs:
        - "service records"
        - "installed part mass"
        - "removed part mass"
      output: "kg replacement product and kg spent lamp per reference service life"
      source_ids:
        - eu-mdr-2017-745
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference apparatus"
      requirement: "Preserve model, configuration revision, intended purpose, radiation type, wavelength band, source technology, installed source count, and market state; do not combine incompatible variants without weights."
      evidence: "product specification, technical documentation, release record, and un-cpc-3-0-structure-2025; iec-60601-2-57-2023; eu-mdr-2017-745"
    - id: dq_completeness
      applies_to: "manufacturing foreground"
      requirement: "Reconcile BOM, accepted output, component issues, packaging, electricity, water, rejects, and any additional site-specific product, waste, or elementary flows. Explain every exclusion."
      evidence: "BOM reconciliation, utility reconciliation, release report, and eu-pef-2021-2279"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative continuous 12-month period or all production when the product has been manufactured for less than 12 months; disclose exceptional campaigns, shutdowns, and substitutions."
      evidence: "reporting-period statement and production calendar"
    - id: dq_measurement
      applies_to: "measured and calculated rows"
      requirement: "Retain meter and scale calibration, raw units, conversions, allocation drivers, and calculation workbooks so each normalized value is reproducible."
      evidence: "calibration certificates, raw records, and calculation review"
    - id: dq_use_scenario
      applies_to: "use and maintenance"
      requirement: "Align operating modes, utilization, cleaning, maintenance, replacement, service life, and electricity geography to one internally consistent intended-use scenario."
      evidence: "instructions for use, measured test protocol, service plan, and scenario approval"
    - id: dq_end_of_life
      applies_to: "waste scenario"
      requirement: "State jurisdiction, collection route, contamination status, lamp hazardous-substance status, downstream treatment datasets, and allocation convention."
      evidence: "waste records and eu-weee-2012-19; eu-mdr-2017-745"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Fail validation when intended purpose, ultraviolet/infrared configuration, wavelength band, source technology, model, service-life basis, or market state is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - iec-60601-2-57-2023
      - eu-mdr-2017-745
  - rule_id: validate_reference_count
    applies_to: "normalization"
    rule: "Require exactly one released apparatus as the reference amount and require net mass plus packaged mass as separate metadata; lamp count cannot replace apparatus count."
    source_ids: []
  - rule_id: validate_atomic_rows
    applies_to: "inventory"
    rule: "Reject combined utilities, combined ultraviolet/infrared emitter rows, unspecified packaging, unspecified waste, or any row that cannot resolve to one concrete exchange."
    source_ids: []
  - rule_id: validate_variant_conditions
    applies_to: "inventory applicability"
    rule: "Require ultraviolet rows only for ultraviolet-containing configurations and infrared rows only for infrared-containing configurations; require an explicit zero or not-applicable record for demonstrably absent conditional flows."
    source_ids:
      - iec-60601-2-57-2023
  - rule_id: validate_energy
    applies_to: "electricity"
    rule: "Require kWh source records, the exact 3.6 MJ/kWh conversion, electricity geography, and separate manufacturing, packaging, and use-stage values."
    source_ids: []
  - rule_id: validate_transport
    applies_to: "distribution"
    rule: "Require mass, distance, mode, vehicle or vessel class, and route for each included transport leg; do not merge road and sea services."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_lifecycle_claim
    applies_to: "system boundary"
    rule: "Reject a cradle-to-grave claim unless distribution, use/maintenance, replacement, and end-of-life modules are complete or each exclusion is justified as not applicable to the declared configuration."
    source_ids:
      - eu-pef-2021-2279
      - eu-mdr-2017-745
      - eu-weee-2012-19
  - rule_id: validate_uuid_gaps
    applies_to: "unresolved flow identity"
    rule: "Keep every unresolved UUID explicit and prevent substitution of rejected broad, mismatched, or unspecified candidates."
    source_ids: []
  - rule_id: validate_no_external_ranges
    applies_to: "quantitative evidence"
    rule: "Treat all amounts as foreground collection or calculation requirements until at least two independent, original-text-verified, boundary-compatible sources or reviewed foreground datasets justify a range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific foreground data package for one declared ultraviolet or infrared medical, surgical, dental, or veterinary apparatus configuration"
  downstream_use: "secondary_dataset for a reviewed product study; background_dataset only after representativeness, review, and aggregation are documented"
  allowed_use: "Configuration-specific manufacturing comparison at a common factory-gate boundary; lifecycle modelling when all claimed conditional modules use a consistent utilization and geography; hotspot and improvement assessment with disclosed unresolved identities"
  excluded_use: "Safety or regulatory certification; comparison of unlike intended purposes or optical performance without functional equivalence; use of a factory-gate package as cradle-to-grave; substitution of rejected UUID candidates; generic claims across ultraviolet and infrared technologies without weighting"
  required_metadata: "PCR id and version; product model and revision; intended purpose; radiation type; wavelength and radiant-performance metric; source technology; production sites and period; net and packaged mass; supplied accessories; packaging; included lifecycle modules; electricity geography; distribution route; utilization; cleaning; maintenance; replacement; service life; end-of-life geography; upstream dataset versions; allocation and cut-off decisions"
  required_quality_disclosure: "Foreground coverage; BOM and output reconciliation; meter and scale calibration; supplier-data coverage; temporal, geographical, and technological representativeness; allocation drivers; assumptions; unresolved UUIDs; unresolved range evidence; scenario sensitivity; reviewer and review date"
  update_trigger: "Change in intended purpose, radiation type, source technology, optical performance, product configuration or BOM, assembly or packaging site, firmware/control behavior affecting energy, cleaning or sterilization instructions, service life, replacement regime, distribution route, electricity mix, end-of-life route, or a material change in foreground data"
