allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "shared manufacturing processes"
    rule: "Avoid allocation by submetering or subdividing product-specific production lots, machining cells, treatment lines, assembly and packaging wherever practical."
    source_ids:
      - ec-pef-2021
  - rule_id: al_physical_causality
    applies_to: "remaining shared inputs and outputs"
    rule: "When subdivision is not possible, allocate shared electricity, water, chemicals and wastes using a documented causal physical driver such as measured machine time, treated surface area, bath loading or product mass; do not use arbitrary equal shares."
    source_ids:
      - ec-pef-2021
      - ec-jrc-stm-bref-2006
  - rule_id: al_scrap_reporting
    applies_to: "low-alloy steel scrap"
    rule: "Record scrap as a separate waste output with its actual destination. Do not credit avoided primary material inside the foreground process; apply any recycling convention consistently in the downstream lifecycle model."
    source_ids:
      - ec-pef-2021
  - rule_id: al_rework
    applies_to: "reworked or rejected parts"
    rule: "Assign additional processing and attributable utilities to the product lot causing rework; include unrecoverable segregated alloy-steel rejects in output_low_alloy_steel_scrap."
    source_ids:
      - us-epa-fabricated-metal-products-1995
dataset_production:
  collection_protocols:
    - protocol_id: cp_machining_inputs
      process_id: "precision_machining"
      flow_role: "purchased stock, cutting fluid, process water and electricity"
      record_type: "purchase, inventory, batch issue and meter records"
      raw_fields: "lot_id; product_id; stock_grade; opening_inventory; receipts; issues; closing_inventory; water_meter; electricity_meter; cutting_fluid_addition"
      collection_method: "Reconcile material issues to inventory; read dedicated meters or allocate documented submeters to the production lot."
      unit: "kg; MJ"
      frequency: "each lot with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or disclosed shorter campaign"
      site_scope: "all site operations within machining boundary"
      aggregation_rule: "sum attributable records, subtract inventory changes, divide by accepted net product mass"
      quality_evidence: "calibrated scale and meter records; purchase invoices; lot traveller; inventory reconciliation"
    - protocol_id: cp_machining_outputs
      process_id: "precision_machining"
      flow_role: "machined part, low-alloy scrap and spent coolant"
      record_type: "transfer, scale, tank and waste shipment records"
      raw_fields: "lot_id; conforming_part_mass; scrap_mass; scrap_grade; coolant_drawdown; coolant_shipment; destination"
      collection_method: "Weigh conforming transfer and segregated scrap; reconcile spent coolant by tank level and shipment documents."
      unit: "kg"
      frequency: "each lot and waste shipment"
      temporal_coverage: "same period as machining inputs"
      site_scope: "machining cell and coolant system"
      aggregation_rule: "sum outputs by lot and reconcile with inputs and stock changes"
      quality_evidence: "calibrated scale; transfer record; waste manifest; tank-level log"
    - protocol_id: cp_surface_inputs
      process_id: "forming_surface_treatment"
      flow_role: "parts, sodium hydroxide, process water and electricity"
      record_type: "batch, bath, dosing and meter records"
      raw_fields: "lot_id; input_part_mass; process_sequence; treated_area; water_meter; electricity_meter; sodium_hydroxide_receipts; bath_opening; bath_closing"
      collection_method: "Collect only when the conditional process applies; reconcile additions and bath inventory by treatment campaign."
      unit: "kg; m2; MJ"
      frequency: "each treatment batch with monthly bath reconciliation"
      temporal_coverage: "same period as product dataset"
      site_scope: "all in-house forming and aqueous treatment lines used for product"
      aggregation_rule: "sum attributable batch inputs and divide by accepted net product mass"
      quality_evidence: "batch traveller; bath analysis; calibrated dosing and utility meters"
    - protocol_id: cp_surface_outputs
      process_id: "forming_surface_treatment"
      flow_role: "finished part, cleaning wastewater and waste alkaline liquor"
      record_type: "transfer, effluent meter/tank and waste shipment records"
      raw_fields: "lot_id; finished_part_mass; wastewater_mass_or_volume; density; wastewater_composition; spent_bath_mass; destination"
      collection_method: "Weigh finished transfer; meter or weigh segregated aqueous streams; retain composition samples and destination records."
      unit: "kg"
      frequency: "each batch and discharge/shipment"
      temporal_coverage: "same period as surface inputs"
      site_scope: "treatment line through transfer to treatment or recovery"
      aggregation_rule: "sum each distinct stream; convert volume only with documented density"
      quality_evidence: "calibrated scale/meter; laboratory analysis; tank log; waste manifest"
    - protocol_id: cp_assembly_inputs
      process_id: "assembly_test_packaging"
      flow_role: "mechanical parts, electronics, screws, packaging and electricity"
      record_type: "bill of materials, goods issue, assembly, meter and packaging records"
      raw_fields: "lot_id; part_mass; electronics_mass; screw_mass; bag_mass; box_mass; electricity_meter; accepted_count; reject_count"
      collection_method: "Reconcile issued components and packaging to accepted units and returned inventory; meter attributable electricity."
      unit: "kg; MJ"
      frequency: "each assembly lot"
      temporal_coverage: "same period as final output"
      site_scope: "final assembly, acceptance test and packaging area"
      aggregation_rule: "sum net issues and attributable energy, divide by accepted net product mass"
      quality_evidence: "approved bill of materials; calibrated scale/meter; batch record; acceptance record"
    - protocol_id: cp_final_output
      process_id: "assembly_test_packaging"
      flow_role: "accepted reference product"
      record_type: "final inspection and dispatch records"
      raw_fields: "lot_id; product_type; compatibility_or_function; accepted_count; accepted_net_mass; packaging_mass; reject_mass; specification_result"
      collection_method: "Weigh accepted product without packaging and link it to passed acceptance specifications and dispatch records."
      unit: "kg"
      frequency: "each finished lot"
      temporal_coverage: "representative continuous 12-month period or disclosed campaign"
      site_scope: "all accepted production at declared site"
      aggregation_rule: "sum accepted net mass and normalize all rows to 1 kg"
      quality_evidence: "calibrated final scale; inspection release; nonconformance log; dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized exchange = attributable exchange during reporting period / accepted net product mass during the same period"
      inputs:
        - "attributable exchange"
        - "accepted net product mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - ec-pef-2021
    - id: calc_machining_mass_balance
      applies_to: "precision_machining"
      rule: "Reconcile alloy-steel stock issued with machined-part transfer, low-alloy scrap and measured work-in-process change; investigate and disclose any material residual instead of forcing balance."
      inputs:
        - "stock issued"
        - "part mass"
        - "scrap mass"
        - "work-in-process change"
      output: "documented machining mass-balance residual"
      source_ids:
        - us-epa-fabricated-metal-products-1995
    - id: calc_surface_mass_balance
      applies_to: "forming_surface_treatment"
      rule: "Reconcile input-part mass, finished-part mass, bath additions, wastewater, waste alkaline liquor and process inventory changes for the actual treatment chemistry; create a new concrete flow row for any omitted material."
      inputs:
        - "batch inputs"
        - "batch outputs"
        - "bath inventory changes"
      output: "documented surface-treatment mass-balance residual"
      source_ids:
        - ec-jrc-stm-bref-2006
    - id: calc_transfer_reconciliation
      applies_to: "internal part transfers"
      rule: "Upstream output mass equals downstream input mass adjusted only for measured inventory change and declared loss; the two alternate assembly input rows are mutually exclusive for a given lot."
      inputs:
        - "transfer records"
        - "inventory changes"
        - "route flag"
      output: "reconciled internal transfer"
      source_ids:
        - ec-pef-2021
    - id: calc_packaging_separation
      applies_to: "packaging and reference product"
      rule: "Report polyethylene bag and corrugated box masses separately; accepted net product mass excludes packaging."
      inputs:
        - "gross packed mass"
        - "net product mass"
        - "bag mass"
        - "box mass"
      output: "separated net-product and packaging exchanges"
      source_ids:
        - ec-pef-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference flow"
      requirement: "Identify exact product type, compatible host or microtome function, material composition, net mass, performance specification, sterile state and packaging configuration."
      evidence: "approved product specification, bill of materials, drawing, acceptance and release records"
    - id: dq_route_coverage
      applies_to: "process boundary"
      requirement: "Confirm every process-map inclusion condition against the actual route and document outsourced steps without double counting."
      evidence: "process traveller, supplier scope, route diagram and dataset links"
    - id: dq_measurement
      applies_to: "foreground exchanges"
      requirement: "Use calibrated meters/scales or documented allocation from a representative measurement boundary; retain original units and conversion records."
      evidence: "calibration certificates, meter exports, scale tickets and allocation workbook"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Prefer a continuous 12-month period covering normal variability; disclose campaign or shorter-period data and justify representativeness."
      evidence: "production calendar, batch list, downtime and maintenance records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile bills of material, purchase and waste records; add concrete product, waste or elementary rows for applicable exchanges absent from the representative pattern."
      evidence: "mass balances, invoice reconciliation, waste manifests and exception log"
    - id: dq_uuid_identity
      applies_to: "TianGong references"
      requirement: "Preserve verified UUID, flow type, property and unit group; product-specific qualifiers must not be inferred from an empty TianGong general comment."
      evidence: "direct state-100 identity audit and foreground product specification"
validation_rules:
  - rule_id: vr_reference_complete
    applies_to: "reference flow"
    rule: "Fail validation when any required qualifier, net product mass, acceptance specification or exact reference-product UUID is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: vr_route_consistent
    applies_to: "process map"
    rule: "Require precision_machining and assembly_test_packaging for the representative route; require all conditional surface-treatment rows when forming_surface_treatment is declared and reject those rows when the process is absent."
    source_ids:
      - us-epa-fabricated-metal-products-1995
      - ec-jrc-stm-bref-2006
  - rule_id: vr_atomic_inventory
    applies_to: "inventory rows"
    rule: "Require each row to contain one atomic exchange with verified UUID, flow type, property, unit, amount rule, collection protocol and applicable route condition."
    source_ids:
      - ec-pef-2021
  - rule_id: vr_mass_reconciliation
    applies_to: "material and intermediate transfers"
    rule: "Check machining, treatment, assembly and packaging mass reconciliations and require investigation and disclosure of material residuals."
    source_ids:
      - us-epa-fabricated-metal-products-1995
      - ec-jrc-stm-bref-2006
  - rule_id: vr_allocation_documented
    applies_to: "shared operations"
    rule: "Require subdivision evidence or a causal physical allocation driver and prohibit arbitrary equal or undisclosed economic allocation."
    source_ids:
      - ec-pef-2021
  - rule_id: vr_data_quality
    applies_to: "completed dataset"
    rule: "Check temporal coverage, calibration, bill-of-material completeness, waste destinations, supplier dataset links and normalization consistency."
    source_ids:
      - ec-pef-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; may serve as background_dataset only for products matching the declared subtype, compatibility/function, composition, route and market state."
  downstream_use: "Foreground process and lifecyclemodel construction for the declared CPC 48281 product at the factory gate."
  allowed_use: "Cradle-to-gate studies and downstream product systems using a product-specific, geographically and technologically representative match."
  excluded_use: "Unqualified category-average substitution across dissimilar optical, electronic, polymer, medical, surgical or microtome products; use-phase, service-life, sterilization or end-of-life claims not included in the dataset."
  required_metadata: "PCR id and version; product type; host compatibility or microtome function; bill of materials; net mass; route; surface treatment; electronics; sterile state; packaging; geography; technology; data period; allocation; upstream dataset links; exclusions."
  required_quality_disclosure: "Primary-data share; temporal and geographic coverage; meter and scale calibration; allocation drivers; mass-balance residuals; waste destinations; supplier-data quality; data gaps and deviations."
  update_trigger: "Change in product design or material composition, host compatibility/function, principal manufacturing route, treatment chemistry, electronics, sterilization, packaging, site/geography, allocation method, or a material shift in measured inputs, outputs or data quality."
