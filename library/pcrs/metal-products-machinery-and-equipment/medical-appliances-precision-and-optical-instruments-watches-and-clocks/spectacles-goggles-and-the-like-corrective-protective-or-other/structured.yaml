allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_operations"
    rule: "Subdivide and submeter frame, lens, coating, assembly, and packaging operations wherever independently measured records exist before applying allocation."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_residual_facility
    applies_to: "shared_electricity_water_and_auxiliaries"
    rule: "Allocate only residual shared facility inputs using a documented causal driver such as machine time, metered load, water volume, or occupied process time; if no causal relationship can be established, use mass or unit count and report a sensitivity check."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "recoverable_scrap"
    rule: "Report exported scrap and recovered solvent at the measured boundary without silently crediting avoided virgin production; any recycling or substitution credit belongs in a separately declared downstream scenario."
    source_ids:
      - ace-tate-eyewear-lca-2018
      - eu-pef-method-2021
  - rule_id: allocation_rework
    applies_to: "internal_rework"
    rule: "Keep internal rework burdens in the production batch that ultimately yields conforming eyewear; do not create a co-product credit for non-saleable rework."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_frame_materials
      process_id: "integrated_frame_manufacturing"
      flow_role: "frame material inputs"
      record_type: "purchase, stock, issue, and return records"
      raw_fields: "material identity; grade; gross issue; returned stock; recycled content; supplier; batch"
      collection_method: "Reconcile BOM issues with warehouse and production records"
      unit: "kg"
      frequency: "per batch, monthly reconciliation"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each frame-manufacturing site and route"
      aggregation_rule: "Sum net material crossing into the route and normalize to conforming frame output"
      quality_evidence: "invoices, weigh tickets, BOM revision, stock reconciliation"
    - protocol_id: cp_frame_electricity
      process_id: "integrated_frame_manufacturing"
      flow_role: "frame electricity"
      record_type: "meter and machine records"
      raw_fields: "meter start/end; machine hours; rated or measured load; output mass"
      collection_method: "Submeter preferred; otherwise reconcile equipment calculation to facility meter"
      unit: "kWh and MJ"
      frequency: "continuous or per shift"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each frame-manufacturing site"
      aggregation_rule: "Convert kWh to MJ and divide by conforming frame output"
      quality_evidence: "calibrated meter record, reconciliation, downtime log"
    - protocol_id: cp_frame_outputs
      process_id: "integrated_frame_manufacturing"
      flow_role: "frame product and segregated wastes"
      record_type: "production and waste records"
      raw_fields: "conforming frame mass; waste mass; material; moisture; destination; internal return"
      collection_method: "Weigh conforming transfer and each segregated waste stream"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "same period as frame inputs"
      site_scope: "each frame-manufacturing site and route"
      aggregation_rule: "Sum by atomic material and destination; exclude same-batch internal return from exported waste"
      quality_evidence: "calibrated scale, waste transfer note, mass-balance reconciliation"
    - protocol_id: cp_lens_materials
      process_id: "integrated_lens_manufacturing"
      flow_role: "lens materials and cleaning chemical"
      record_type: "purchase, stock, issue, concentration, and recovery records"
      raw_fields: "substance; grade; solution mass; concentration; opening/closing stock; recovery; batch"
      collection_method: "Reconcile material issues and concentration certificates"
      unit: "kg"
      frequency: "per batch, monthly reconciliation"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each lens-manufacturing site and route"
      aggregation_rule: "Calculate neat substance mass and normalize to conforming lens output"
      quality_evidence: "invoices, certificates, stock record, preparation sheet"
    - protocol_id: cp_lens_water
      process_id: "integrated_lens_manufacturing"
      flow_role: "process-water input"
      record_type: "meter or tank record"
      raw_fields: "make-up water; recirculation; discharge; batch output"
      collection_method: "Meter make-up water at the process boundary"
      unit: "kg or m3"
      frequency: "continuous or per batch"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each lens-finishing site"
      aggregation_rule: "Count external make-up once; convert volume using measured or declared density"
      quality_evidence: "calibrated meter, tank log, water balance"
    - protocol_id: cp_lens_electricity
      process_id: "integrated_lens_manufacturing"
      flow_role: "lens electricity"
      record_type: "meter and equipment records"
      raw_fields: "meter start/end; equipment hours; load; route; output mass"
      collection_method: "Submeter preferred; otherwise reconcile equipment calculation to facility meter"
      unit: "kWh and MJ"
      frequency: "continuous or per shift"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each lens-manufacturing site and route"
      aggregation_rule: "Convert kWh to MJ and normalize to conforming lens output"
      quality_evidence: "calibrated meter, reconciliation, equipment log"
    - protocol_id: cp_lens_outputs
      process_id: "integrated_lens_manufacturing"
      flow_role: "finished lenses, solids, and wastewater"
      record_type: "production, wastewater, and waste records"
      raw_fields: "lens mass/count; reject mass; waste identity; wet/dry mass; water content; discharge mass; treatment"
      collection_method: "Weigh lens output and solids; meter or weigh wastewater; sample composition"
      unit: "kg"
      frequency: "per batch with periodic representative sampling"
      temporal_coverage: "same period as lens inputs"
      site_scope: "each lens-manufacturing site and route"
      aggregation_rule: "Keep each polymer, glass waste, and wastewater separate and close wet/dry mass balance"
      quality_evidence: "scale and meter calibration, laboratory results, transfer notes"
    - protocol_id: cp_solvent_release
      process_id: "integrated_lens_manufacturing"
      flow_role: "isopropanol release to air"
      record_type: "stack test or solvent balance"
      raw_fields: "neat input; recovered mass; wastewater mass; waste mass; stock change; measured vent concentration and flow"
      collection_method: "Prefer vent measurement; otherwise complete reconciled solvent balance"
      unit: "kg"
      frequency: "measurement campaign plus monthly balance"
      temporal_coverage: "representative operating conditions and 12-month balance"
      site_scope: "each solvent-using site"
      aggregation_rule: "Release = input minus recovery, wastewater, solid waste, product retention, and stock increase; floor at zero and investigate imbalance"
      quality_evidence: "stack-test report, concentration certificate, recovery and waste records"
    - protocol_id: cp_assembly_materials
      process_id: "final_assembly_packaging"
      flow_role: "frame and lens inputs"
      record_type: "BOM, issue, and transfer records"
      raw_fields: "frame mass/count; lens mass/count; material; origin; internal/purchased flag; product model"
      collection_method: "Weigh representative components and reconcile counts to completed units"
      unit: "kg and count"
      frequency: "per model and batch"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each assembly site"
      aggregation_rule: "Sum purchased inputs once; preserve internal transfers for unit-process linkage without duplicating upstream burdens"
      quality_evidence: "BOM, scale record, transfer record, supplier identity"
    - protocol_id: cp_assembly_electricity
      process_id: "final_assembly_packaging"
      flow_role: "assembly electricity"
      record_type: "meter and equipment records"
      raw_fields: "meter start/end; machine hours; load; conforming unit count"
      collection_method: "Submeter preferred; otherwise reconcile equipment calculation"
      unit: "kWh and MJ"
      frequency: "continuous or per shift"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each assembly site"
      aggregation_rule: "Convert kWh to MJ and normalize to conforming units"
      quality_evidence: "calibrated meter, reconciliation, downtime log"
    - protocol_id: cp_packaging_materials
      process_id: "final_assembly_packaging"
      flow_role: "atomic packaging inputs"
      record_type: "packaging specification and issue records"
      raw_fields: "material; piece mass; pieces issued; returned stock; units packed"
      collection_method: "Weigh each packaging component and reconcile issue counts"
      unit: "kg and count"
      frequency: "per packaging specification and batch"
      temporal_coverage: "current packaging specification"
      site_scope: "each packaging site"
      aggregation_rule: "Multiply measured piece mass by attributable count and keep polymers and paper products separate"
      quality_evidence: "specification, supplier declaration, scale record, issue reconciliation"
    - protocol_id: cp_finished_product
      process_id: "final_assembly_packaging"
      flow_role: "reference product output"
      record_type: "inspection and weighing record"
      raw_fields: "conforming unit count; item/pair definition; product mass; model; lens state; frame state; rejects"
      collection_method: "Weigh a representative sample or every unit and reconcile to inspected count"
      unit: "kg and count"
      frequency: "per batch or statistically justified sampling plan"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "each final assembly site"
      aggregation_rule: "Calculate weighted mean product mass and total conforming output; keep packaging excluded"
      quality_evidence: "calibrated scale, sampling plan, inspection and conformity record"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "finished eyewear"
      rule: "Sum measured unpackaged conforming-product mass divided by conforming saleable-unit count; retain weighted model mix"
      inputs:
        - "product mass"
        - "conforming count"
        - "saleable-unit definition"
      output: "kg per saleable unit and total kg output"
      source_ids:
        - ace-tate-eyewear-lca-2018
        - vanni-eyewear-lca-2023
    - id: calc_energy_mj
      applies_to: "all electricity rows"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_neat_isopropanol
      applies_to: "isopropanol input"
      rule: "Neat isopropanol mass = solution mass × measured mass fraction"
      inputs:
        - "solution mass"
        - "concentration certificate or measurement"
      output: "kg isopropanol"
      source_ids: []
    - id: calc_solvent_release
      applies_to: "isopropanol to air"
      rule: "Release = neat input − recovered solvent − wastewater load − solid-waste load − product retention − stock increase; use only when all terms are reconciled"
      inputs:
        - "collected solvent-balance fields"
      output: "kg released to air"
      source_ids:
        - eu-pef-method-2021
    - id: calc_process_mass_balance
      applies_to: "integrated frame and lens routes"
      rule: "Mass-balance residual = gross atomic material inputs − conforming internal output − exported atomic wastes − measured recovery − inventory increase"
      inputs:
        - "matched-period material"
        - output
        - waste
        - recovery
        - "and stock records"
      output: "kg residual and percent of gross input"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and components"
      requirement: "Declare model family, saleable-unit definition, function, lens material and optical state, frame material, coating/tint, and applicable conformity class."
      evidence: "BOM, technical file, prescription/order class, conformity or test record"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a representative continuous 12-month period or disclose the shorter campaign and seasonal or product-mix limitation."
      evidence: "dated meter, production, purchase, stock, and waste records"
    - id: dq_geography_technology
      applies_to: "purchased inputs and utilities"
      requirement: "Match supplier geography, electricity market, material grade, recycled content, and production technology; document proxies and sensitivity."
      evidence: "supplier declaration, dataset metadata, utility bill, route disclosure"
    - id: dq_completeness
      applies_to: "material and energy balance"
      requirement: "Reconcile all measured major foreground material masses and all separately metered process energy; investigate and disclose residuals rather than forcing balance."
      evidence: "signed mass/energy reconciliation and exception log"
    - id: dq_wastewater
      applies_to: "lens-grinding wastewater"
      requirement: "Retain wet mass or volume, dry solids, particle/material composition, treatment route, sampling method, and whether water is recirculated."
      evidence: "meter or scale record, laboratory report, treatment manifest"
    - id: dq_conformity
      applies_to: "final product"
      requirement: "Retain evidence that the output meets the declared prescription, filter, hazard, or performance class; nonconforming units are not reference product."
      evidence: "inspection, test, technical-file, or declaration-of-conformity record"
    - id: dq_uncertainty
      applies_to: "calculated and allocated rows"
      requirement: "Disclose calculation inputs, allocation drivers, meter coverage, sampling error, and unresolved UUID or range-evidence needs."
      evidence: "calculation workbook, calibration record, sampling plan, sensitivity result"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference_flow"
    rule: "Confirm the output is complete wearable eyewear, not an unassembled frame, lens, unworked glass, case, or electronic service, and that UUID, mass property, and required qualifiers agree."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_unit_and_count
    applies_to: "normalization"
    rule: "Confirm the reported kg reference amount equals measured unpackaged mass of the declared saleable unit and that pair or item count is retained."
    source_ids:
      - ace-tate-eyewear-lca-2018
      - vanni-eyewear-lca-2023
  - rule_id: validate_route_consistency
    applies_to: "process_map"
    rule: "Require final assembly and packaging; require each integrated process only when performed and reject double counting between its internal output and a purchased component dataset."
    source_ids:
      - ace-tate-eyewear-lca-2018
      - zeiss-spectacle-lens-manufacturing
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm every Selected flow is one atomic exchange with one direction and flow type; require separate rows for each actual polymer, metal, coating substance, chemical, packaging component, waste, and elementary emission."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_mass_balance
    applies_to: "integrated_processes"
    rule: "Investigate every unexplained material route mass-balance residual that is significant for the declared data-quality objective and prohibit adjustment of waste or product values solely to force closure."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_optical_conformity
    applies_to: "finished_product_quality"
    rule: "Confirm the declared prescription/order or protective/filter performance class and applicable standard; exclude nonconforming outputs from the reference flow."
    source_ids:
      - iso-21987-2017
      - iso-12312-1-2022
      - iso-16321-1-2021
      - eu-ppe-regulation-2016-425
  - rule_id: validate_unresolved_evidence
    applies_to: "readiness"
    rule: "Keep UUID-empty rows and range-evidence needs explicitly unresolved; do not promote a proxy UUID or a single published case value to final identity or range evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one declared finished eyewear family and manufacturing route"
  downstream_use: "May serve as a secondary_dataset or background_dataset for products using finished eyewear when readiness, geography, technology, time, and quality match"
  allowed_use: "Attributional factory-gate modelling, supplier footprints, product-system assembly, and disclosed comparative studies using functionally equivalent eyewear and aligned service-life assumptions"
  excluded_use: "Clinical or safety-performance certification; comparison across unlike corrective, protective, sun, or sport functions; undisclosed substitution of frame-only or lens-only data; use-phase or end-of-life claims without added scenarios"
  required_metadata: "PCR id and version; saleable-unit definition; product and packaging mass; function; lens material and optical/filter/hazard class; frame material; coatings; integrated or purchased routes; site and supplier geography; data period; allocation; background datasets; unresolved identities and range needs"
  required_quality_disclosure: "Meter and scale coverage; BOM reconciliation; mass-balance residual; wastewater characterization; conformity evidence; supplier representativeness; allocation and sensitivity; exclusions and cut-offs"
  update_trigger: "Material, lens, frame, coating, packaging, supplier geography, electricity mix, process technology, waste treatment, conformity standard, product-mix, or service-life change that materially alters the declared dataset"
