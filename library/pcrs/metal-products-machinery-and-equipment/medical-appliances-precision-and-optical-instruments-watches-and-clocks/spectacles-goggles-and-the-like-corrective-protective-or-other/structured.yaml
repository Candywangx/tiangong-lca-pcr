measurement_rules:
  - id: reference_product_mass
    applies_to: "Finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh conforming eyewear without detachable case, cloth, labels, or packaging; report those included items as separate atomic inputs and disclose any unavoidable deviation."
  - id: saleable_unit_conversion
    applies_to: "Unit-to-mass conversion"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg/unit"
    rule: "Record inspected saleable-unit count and representative measured mass; normalize all rows to the measured kg of one saleable unit while retaining the item or pair definition."
  - id: energy_conversion
    applies_to: "Electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve metered energy; convert kWh to MJ using 1 kWh = 3.6 MJ and do not convert electricity to fuel mass."
  - id: wet_waste_basis
