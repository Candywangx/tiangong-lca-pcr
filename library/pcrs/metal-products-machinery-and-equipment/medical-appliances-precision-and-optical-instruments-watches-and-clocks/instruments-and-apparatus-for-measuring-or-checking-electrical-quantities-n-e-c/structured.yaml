            value_mode: "fixed_value"
            specificity: "generic"
            basis:
              text: "1 kg net released reference product"
              kind: "reference_flow"
            evidence:
              kind: "method_formula"
              source_ids:
                - pep-ecopassport-pcr-2021
            ranges: []
      waste:
        - row_id: packaging_waste
          role: "Packaging and labelling waste at the manufacturing site"
          name: "Waste flow matching actual packaging or paper waste; exact Tiangong UUID shall be resolved during data-package construction"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Record offcuts, damaged packaging, obsolete labels or manuals, and other packaging waste generated before release."
          amount:
            expression: "measured waste mass by material and destination"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "per 1 kg net released reference product"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_packaging_waste
              source_ids:
                - pep-ecopassport-pcr-2021
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separable products, routes, batches, and unit processes"
    rule: "Avoid allocation by subdividing production lines, routes, batches, and meters wherever direct records can represent the product."
    source_ids:
      - iso-14044-2006
      - pep-ecopassport-pcr-2021
  - rule_id: allocation_physical_causality
    applies_to: "shared utilities, site services, equipment, and waste"
    rule: "When subdivision is not feasible, use a documented physical or causal driver that best represents resource use or emissions, such as metered energy, machine time, test-bench time, processed mass, or accepted units. Economic allocation requires justification that no physical relationship is adequate."
    source_ids:
      - pep-ecopassport-pcr-2021
      - eu-pef-method-2021
  - rule_id: allocation_rework_returns
    applies_to: "rework loops and return to stock"
    rule: "Return reworkable instruments and unused materials to the originating process or inventory balance; do not count them simultaneously as waste or additional product output."
    source_ids:
      - pep-ecopassport-pcr-2021
  - rule_id: allocation_recycling_handoff
    applies_to: "recyclable manufacturing waste"
    rule: "Record waste at the measured handoff quantity and destination. Do not credit avoided virgin production inside the foreground manufacturing dataset; any recycling benefit or burden beyond the handoff shall be modelled transparently in a downstream scenario."
    source_ids:
      - pep-ecopassport-pcr-2021
      - eu-weee-directive-2012-19
  - rule_id: allocation_disclosure
    applies_to: "every allocated row"
    rule: "Disclose the shared total, allocation driver, numerator, denominator, resulting factor, affected processes and flows, period, and sensitivity where the allocation is material."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_received_inputs
      process_id: "materials_component_receipt"
      flow_role: "received and accepted input accounting"
      record_type: "ERP receipt, bill of materials, supplier document, and scale record"
      raw_fields: "input identity; supplier; lot; Tiangong flow UUID; quantity; unit; gross mass; tare; net mass; accepted mass; returned mass; date"
      collection_method: "reconcile purchase receipts, BOM issues, and calibrated scale records by input identity"
      unit: "kg or resolved input unit"
      frequency: "each lot; aggregate monthly"
      temporal_coverage: "full reporting period, normally 12 consecutive months where available"
      site_scope: "every manufacturing site in scope"
      aggregation_rule: "sum accepted mass by identity and site; normalize by net released product mass"
      quality_evidence: "purchase receipt; BOM revision; supplier specification; scale calibration; reconciliation sign-off"
    - protocol_id: cp_receipt_rejects
      process_id: "materials_component_receipt"
      flow_role: "receipt rejects and damaged packaging"
      record_type: "nonconformance and waste transfer records"
      raw_fields: "waste identity; hazardous status; mass; unit; return or waste status; destination; date"
      collection_method: "weigh each reject stream and reconcile supplier returns separately"
      unit: "kg"
      frequency: "each event; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every receiving area in scope"
      aggregation_rule: "sum waste mass by identity and destination; exclude supplier returns that remain products"
      quality_evidence: "nonconformance report; scale record; waste manifest; return authorization"
    - protocol_id: cp_preparation_materials
      process_id: "parts_electronics_preparation"
      flow_role: "materials consumed in in-house preparation"
      record_type: "material issue and return records"
      raw_fields: "route; input identity; issued quantity; returned quantity; unit; lot; date"
      collection_method: "reconcile issued and returned quantities for each included route"
      unit: "kg or resolved input unit"
      frequency: "each batch; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "each in-house preparation route"
      aggregation_rule: "consumed quantity equals issued minus unused return; normalize by released mass"
      quality_evidence: "ERP issue/return record; route traveller; stock reconciliation"
    - protocol_id: cp_preparation_energy
      process_id: "parts_electronics_preparation"
      flow_role: "preparation electricity and energy carriers"
      record_type: "meter, equipment log, and production record"
      raw_fields: "meter id; start/end reading; energy carrier; unit; route; runtime; allocation driver; period"
      collection_method: "direct submetering preferred; otherwise calculate a documented share of a shared meter"
      unit: "kWh or MJ"
      frequency: "continuous or each batch; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "each included preparation route"
      aggregation_rule: "sum direct energy or apply disclosed causal allocation; normalize by released mass"
      quality_evidence: "meter calibration; utility invoice; equipment log; allocation worksheet"
    - protocol_id: cp_prepared_subassemblies
      process_id: "parts_electronics_preparation"
      flow_role: "accepted prepared output"
      record_type: "route traveller and scale record"
      raw_fields: "subassembly identity; model; route; accepted quantity; net mass; unit; transfer date"
      collection_method: "weigh or count with verified count-to-mass conversion at transfer"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "each included preparation route"
      aggregation_rule: "sum accepted output by route and model; normalize by released mass"
      quality_evidence: "transfer record; scale calibration; inspection acceptance"
    - protocol_id: cp_preparation_waste
      process_id: "parts_electronics_preparation"
      flow_role: "preparation waste"
      record_type: "waste log and transfer document"
      raw_fields: "waste identity; hazardous status; mass; unit; route; destination; date"
      collection_method: "weigh by waste stream and reconcile with external transfer documents"
      unit: "kg"
      frequency: "each event; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "each included preparation route"
      aggregation_rule: "sum by waste identity and destination; normalize by released mass"
      quality_evidence: "scale record; waste manifest; treatment receipt"
    - protocol_id: cp_preparation_emissions
      process_id: "parts_electronics_preparation"
      flow_role: "direct preparation emissions"
      record_type: "monitoring and discharge record"
      raw_fields: "substance; compartment; concentration; flow or volume; measured mass; calculation factor; period"
      collection_method: "use calibrated direct monitoring or calculate from monitored concentration and discharge volume"
      unit: "resolved elementary-flow unit"
      frequency: "monitoring frequency required by process control or permit"
      temporal_coverage: "full reporting period"
      site_scope: "each direct emission point in scope"
      aggregation_rule: "sum measured or calculated release by substance and compartment; normalize by released mass"
      quality_evidence: "calibration record; laboratory report; permit report; calculation sheet"
    - protocol_id: cp_assembly_inputs
      process_id: "final_assembly"
      flow_role: "assembly component consumption"
      record_type: "BOM, issue, return, and route records"
      raw_fields: "component identity; model; issued quantity; returned quantity; unit; lot; date"
      collection_method: "reconcile product-model BOM with issued and returned quantities"
      unit: "kg or resolved component unit"
      frequency: "each batch; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every final assembly line in scope"
      aggregation_rule: "consumed quantity equals issued minus unused return by component; normalize by released mass"
      quality_evidence: "BOM revision; issue/return record; route traveller; reconciliation sign-off"
    - protocol_id: cp_assembly_energy
      process_id: "final_assembly"
      flow_role: "assembly electricity and utilities"
      record_type: "meter and production records"
      raw_fields: "meter id; start/end reading; energy carrier; unit; line; runtime; allocation driver; period"
      collection_method: "direct submetering preferred; otherwise documented causal allocation"
      unit: "kWh or MJ"
      frequency: "continuous or each batch; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every final assembly line in scope"
      aggregation_rule: "sum direct energy or apply disclosed allocation; normalize by released mass"
      quality_evidence: "meter calibration; utility invoice; equipment log; allocation worksheet"
    - protocol_id: cp_assembled_output
      process_id: "final_assembly"
      flow_role: "assembled instrument output"
      record_type: "transfer and scale record"
      raw_fields: "model; batch; assembled count; net mass; unit; test-route destination; date"
      collection_method: "weigh transfer batches or apply verified count-to-mass conversion"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "every final assembly line in scope"
      aggregation_rule: "sum assembled mass transferred to test; normalize by released mass"
      quality_evidence: "transfer record; scale calibration; count-to-mass worksheet"
    - protocol_id: cp_assembly_waste
      process_id: "final_assembly"
      flow_role: "assembly waste and rejects"
      record_type: "waste and nonconformance records"
      raw_fields: "waste identity; component identity; hazardous status; mass; rework status; destination; date"
      collection_method: "weigh waste; keep rework and return-to-stock records separate"
      unit: "kg"
      frequency: "each event; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every final assembly line in scope"
      aggregation_rule: "sum only material leaving product or rework loops as waste; normalize by released mass"
      quality_evidence: "waste log; nonconformance report; waste manifest"
    - protocol_id: cp_test_inputs
      process_id: "calibration_functional_testing"
      flow_role: "instruments entering calibration or functional test"
      record_type: "test-route and transfer records"
      raw_fields: "model; batch; test procedure; input count; input net mass; date"
      collection_method: "reconcile transfer records with test-system batch records"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "every calibration and test route in scope"
      aggregation_rule: "sum input mass by route and model; normalize by released mass"
      quality_evidence: "transfer record; test-system log; scale or conversion evidence"
    - protocol_id: cp_test_energy_consumables
      process_id: "calibration_functional_testing"
      flow_role: "test energy and consumables"
      record_type: "meter, equipment, test-system, and inventory records"
      raw_fields: "test route; equipment id; power; runtime; metered energy; consumable identity; issued/returned quantity; unit; period"
      collection_method: "direct meter reading or power multiplied by recorded runtime; consumables from issue minus return"
      unit: "kWh, MJ, kg, or resolved unit"
      frequency: "each batch or continuous; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every calibration and test route in scope"
      aggregation_rule: "calculate energy and consumable use by route; normalize by conforming released mass"
      quality_evidence: "meter calibration; equipment specification; runtime log; inventory record; calculation sheet"
    - protocol_id: cp_conforming_output
      process_id: "calibration_functional_testing"
      flow_role: "conforming calibrated or verified output"
      record_type: "calibration certificate and acceptance record"
      raw_fields: "model; serial or batch id; measured function; range; accuracy or uncertainty; recording capability; test standard; result; conforming count; net mass; date"
      collection_method: "accept only units meeting declared criteria; weigh or use verified count-to-mass conversion"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "every calibration and test route in scope"
      aggregation_rule: "sum conforming net mass by model and route; normalize by released mass"
      quality_evidence: "calibration certificate; test report; acceptance record; scale or conversion evidence"
    - protocol_id: cp_test_rejects
      process_id: "calibration_functional_testing"
      flow_role: "failed units, parts, and spent consumables"
      record_type: "nonconformance, rework, and waste records"
      raw_fields: "identity; failure mode; mass; rework status; return-to-stock status; waste status; destination; date"
      collection_method: "reconcile failures into rework, returned parts, and waste without double counting"
      unit: "kg"
      frequency: "each event; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every calibration and test route in scope"
      aggregation_rule: "sum waste only after removing successful rework and return-to-stock quantities; normalize by released mass"
      quality_evidence: "test log; nonconformance report; rework closure; waste manifest"
    - protocol_id: cp_packaging_product_input
      process_id: "packaging_release"
      flow_role: "conforming product entering packaging"
      record_type: "transfer and scale record"
      raw_fields: "model; batch; conforming count; net mass; included accessories; date"
      collection_method: "weigh net product before packaging or apply verified count-to-mass conversion"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "every packaging line in scope"
      aggregation_rule: "sum net product mass entering packaging; reconcile to released mass and packaging rejects"
      quality_evidence: "transfer record; scale calibration; product configuration record"
    - protocol_id: cp_packaging_inputs
      process_id: "packaging_release"
      flow_role: "packaging, manuals, and labels consumed"
      record_type: "packaging BOM and issue/return records"
      raw_fields: "material identity; packaging level; reusable status; issued mass; returned mass; unit; model; date"
      collection_method: "reconcile packaging BOM with issued and returned mass"
      unit: "kg"
      frequency: "each batch; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every packaging line in scope"
      aggregation_rule: "consumed mass equals issued minus unused return by material; normalize by net released mass"
      quality_evidence: "packaging BOM; supplier specification; issue/return record; scale calibration"
    - protocol_id: cp_packaging_waste
      process_id: "packaging_release"
      flow_role: "packaging and labelling waste"
      record_type: "waste and obsolete-stock records"
      raw_fields: "waste identity; mass; hazardous status; destination; reason; date"
      collection_method: "weigh waste by material and reconcile obsolete stock destruction"
      unit: "kg"
      frequency: "each event; aggregate monthly"
      temporal_coverage: "full reporting period"
      site_scope: "every packaging line in scope"
      aggregation_rule: "sum by waste material and destination; normalize by net released mass"
      quality_evidence: "scale record; waste log; destruction authorization; waste manifest"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = reporting-period amount / reporting-period net mass of conforming released product in kg"
      inputs:
        - "reporting-period row amount"
        - "released net product mass"
      output: "amount per 1 kg released reference product"
      source_ids:
        - pep-ecopassport-pcr-2021
    - id: calc_count_to_mass
      applies_to: "item-count records"
      rule: "represented mass = item count × measured mean net mass per item for the same model and period; use total weighing when available"
      inputs:
        - "item count"
        - "sampled or total net mass"
        - "sample size"
        - "model identifier"
      output: "kg represented mass"
      source_ids:
        - pep-ecopassport-pcr-2021
    - id: calc_consumed_input
      applies_to: "materials, components, consumables, and packaging"
      rule: "consumed quantity = issued or received quantity − unused return − supplier return"
      inputs:
        - "issued or received quantity"
        - "unused return"
        - "supplier return"
      output: "consumed foreground input quantity"
      source_ids:
        - pep-ecopassport-pcr-2021
    - id: calc_shared_utility_allocation
      applies_to: "shared electricity, water, fuel, and utilities"
      rule: "allocated quantity = shared measured total × product causal-driver quantity / total causal-driver quantity; disclose driver and period"
      inputs:
        - "shared total"
        - "product driver"
        - "total driver"
      output: "allocated utility quantity"
      source_ids:
        - iso-14044-2006
        - pep-ecopassport-pcr-2021
    - id: calc_test_energy
      applies_to: "unmetered test equipment with recorded operation"
      rule: "test energy = verified equipment demand × recorded operating time; add directly metered auxiliary energy separately"
      inputs:
        - "equipment demand"
        - "operating time"
        - "directly metered auxiliary energy"
      output: "kWh or MJ test energy"
      source_ids:
        - pep-ecopassport-pcr-2021
    - id: calc_mass_reconciliation
      applies_to: "each process and reporting period"
      rule: "inputs + opening work-in-process = accepted outputs + waste + returns + closing work-in-process + documented mass change; investigate unresolved residuals"
      inputs:
        - "input mass"
        - "opening and closing work-in-process"
        - "output mass"
        - waste
        - returns
        - "documented mass change"
      output: "mass-balance residual and reconciliation status"
      source_ids:
        - pep-ecopassport-pcr-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all purchased inputs"
      requirement: "Preserve model/product-family identity, measured electrical quantity, function, range, accuracy or uncertainty, recording capability, hardware configuration, BOM revision, supplier identity, and exact resolved flow UUID."
      evidence: "product specification; calibration or acceptance record; BOM; supplier record; Tiangong identity check"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one coherent reporting period, preferably 12 consecutive months where available; disclose shorter periods and seasonal or campaign limitations."
      evidence: "dated records; reporting-period reconciliation; representativeness statement"
    - id: dq_geography_technology
      applies_to: "every site and upstream link"
      requirement: "Represent every included manufacturing site and technology route; document the aggregation method and use upstream datasets matching actual supply geography and technology where possible."
      evidence: "site list; route map; production shares; upstream dataset metadata; proxy justification"
    - id: dq_measurement
      applies_to: "meters, scales, test systems, and calculations"
      requirement: "Retain calibration status, precision, unit, raw reading, conversion, formula, and responsible source system for each measured or calculated quantity."
      evidence: "calibration certificate; raw log; calculation worksheet; audit trail"
    - id: dq_completeness
      applies_to: "materials, energy, water, emissions, and waste"
      requirement: "Demonstrate coverage against BOM, purchase, utility, production, release, and waste totals; quantify and justify exclusions and unresolved mass-balance residuals."
      evidence: "completeness matrix; reconciliations; cut-off register; residual investigation"
    - id: dq_allocation
      applies_to: "shared processes and utilities"
      requirement: "Retain the unallocated total, selected causal driver, numerator, denominator, allocation factor, affected products, and sensitivity or justification."
      evidence: "allocation worksheet; meter map; production record; sensitivity record"
    - id: dq_secondary_data
      applies_to: "upstream and downstream linked datasets"
      requirement: "Record source, version or reference date, temporal, geographic, and technological representativeness, and every proxy or substitution."
      evidence: "dataset metadata; source register; proxy review"
    - id: dq_reproducibility
      applies_to: "complete data package"
      requirement: "An independent reviewer shall be able to reproduce normalized values from retained raw records, formulas, mappings, and allocation decisions."
      evidence: "calculation workbook or script; immutable extracts; reviewer checklist"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "The reference output shall use product flow cf601a2b-131a-41c5-a82f-b20a0c90cdad, Mass flow property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass unit group 93a60a57-a4c8-11da-a746-0800200c9a66, and kg without dataset versions."
    source_ids: []
  - rule_id: validation_reference_amount
    applies_to: "normalized foreground package"
    rule: "Released conforming net product mass shall equal exactly 1 kg after normalization; packaging mass shall remain separate."
    source_ids:
      - pep-ecopassport-pcr-2021
  - rule_id: validation_category_qualifiers
    applies_to: "product identity"
    rule: "The measured electrical quantity, instrument function, range, accuracy class or uncertainty, recording capability, model or family, hardware configuration, included accessories, calibration or acceptance basis, site, period, and market geography shall all be declared."
    source_ids:
      - un-cpc-3-2025
      - pep-ecopassport-pcr-2021
  - rule_id: validation_process_coverage
    applies_to: "process map and inventory"
    rule: "Every required process and every applicable conditional route shall have linked foreground records for product inputs, energy and utilities, outputs, rejects, waste, and direct emissions where present."
    source_ids:
      - pep-ecopassport-pcr-2021
  - rule_id: validation_mass_reconciliation
    applies_to: "each process and reporting period"
    rule: "Mass inputs, accepted outputs, returns, work-in-process changes, waste, and documented mass changes shall reconcile; every unresolved residual shall be quantified and reviewed."
    source_ids:
      - pep-ecopassport-pcr-2021
  - rule_id: validation_no_double_counting
    applies_to: "rework, returns, waste, and recycling"
    rule: "A quantity shall not be counted simultaneously as returned product, rework, waste, and recycling output; all handoffs and downstream treatment links shall be explicit."
    source_ids:
      - pep-ecopassport-pcr-2021
      - eu-weee-directive-2012-19
  - rule_id: validation_allocation_disclosure
    applies_to: "allocated foreground data"
    rule: "Every allocated amount shall expose the shared total, driver, factor, period, affected products and processes, and reason subdivision was not feasible."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: validation_downstream_separation
    applies_to: "manufacturing dataset and lifecyclemodel"
    rule: "Product-specific distribution, installation, use, maintenance, service life, and end-of-life scenarios shall not be embedded as generic CPC 48249 manufacturing defaults; downstream lifecycle models shall identify and source them explicitly."
    source_ids:
      - pep-ecopassport-pcr-2021
      - eu-weee-directive-2012-19
  - rule_id: validation_no_approximate_uuid
    applies_to: "non-reference inventory flows"
    rule: "Every concrete material, component, energy, waste, and elementary flow shall use a semantically exact resolved Tiangong flow UUID; approximate or neighboring CPC flows shall not be substituted silently."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for a finished electrical measuring or checking instrument n.e.c.; publishable as a secondary_dataset or background_dataset only after review"
  downstream_use: "Construct product-specific process datasets and downstream cradle-to-gate or cradle-to-grave lifecyclemodel projections"
  allowed_use: "Manufacturing inventory for products proven to meet this semantic category boundary and represented by the declared model/configuration, sites, technologies, geography, and reporting period"
  excluded_use: "Direct comparison of instruments with different functions or performance; generic use-stage or service-life modelling; products in more specific CPC categories; parts-only datasets; undisclosed proxies; unreviewed extrapolation across heterogeneous product families"
  required_metadata: "canonical PCR id; CPC reference; product model or homogeneous family; measured electrical quantity; function; range; accuracy or uncertainty; recording capability; hardware configuration; included accessories; net product mass; calibration or acceptance basis; sites; routes; reporting period; geography; BOM coverage; packaging scope; upstream dataset references; cut-offs; allocation; data-quality evidence"
  required_quality_disclosure: "Primary-data period and coverage; site and production coverage; measurement and calibration status; completeness and mass-balance results; shared-resource allocations; upstream proxy choices; unresolved residuals; waste destinations; excluded downstream stages; reviewer status"
  update_trigger: "Change in measured function or product category; product or BOM redesign; material or supplier change; manufacturing route, site, technology, yield, energy source, packaging, calibration, use scenario, service life, or end-of-life scenario that materially changes representation; expiration of temporal representativeness; corrected UUID or classification identity"
