allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared fabrication, assembly, calibration, inspection, and packaging"
    rule: "Avoid allocation by product-specific metering, batch records, BOM issue records, machine time, or physically separated process steps wherever practicable."
    source_ids: []
  - rule_id: allocation_causal_driver
    applies_to: "remaining shared inputs and wastes"
    rule: "When subdivision is not practicable, allocate using a documented causal physical driver appropriate to the exchange, such as machine time for equipment electricity, measured mass throughput for material handling, or verified batch count for a batch-specific operation."
    source_ids: []
  - rule_id: allocation_scrap_treatment
    applies_to: "mixed metal scrap"
    rule: "Record scrap as a waste output with its actual destination. Do not credit avoided primary metal production inside the foreground inventory unless the selected study method explicitly requires and transparently reports substitution outside the attributional result."
    source_ids: []
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework and rejected parts"
    rule: "Attribute rework inputs and rejected-part wastes to the represented conforming production during the reference period; disclose any exceptional campaign excluded from the representative result."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "fabrication"
      flow_role: "stainless steel, cold-worked carbon-steel bar, and primary aluminium-alloy sheet"
      record_type: "purchase, stock, issue, return, and BOM records"
      raw_fields: "material identity; grade; form; supplier; opening stock; receipts; closing stock; returned offcuts; batch output"
      collection_method: "reconcile material consumption by product configuration and production batch"
      unit: "kg"
      frequency: "each batch, aggregated monthly"
      temporal_coverage: "representative period covering normal product and operating variation, or a complete documented campaign"
      site_scope: "reporting site and attributable toll processors"
      aggregation_rule: "consumed mass = opening stock + receipts - closing stock - documented returns; normalize to released net product mass"
      quality_evidence: "invoices; weigh tickets; stock ledger; BOM revision; batch traveler"
    - protocol_id: cp_fabrication_utilities
      process_id: "fabrication"
      flow_role: "cutting fluid, electricity, and process water"
      record_type: "chemical issue, tank inventory, meter, and production records"
      raw_fields: "product formulation; concentration; opening and closing stock; purchases; recovered fluid; electricity meter; water meter; operating hours; batch output"
      collection_method: "use dedicated meters where available; otherwise document allocation from measured totals"
      unit: "kg and MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "same reference period as product output"
      site_scope: "reporting site and attributable fabrication route"
      aggregation_rule: "subtract recovered or closing stock; convert electricity and water under section 4; normalize to released net product mass"
      quality_evidence: "calibrated meter records; invoices; tank logs; operating log; allocation worksheet"
    - protocol_id: cp_fabrication_wastes
      process_id: "fabrication"
      flow_role: "mixed metal scrap and fabrication wastewater"
      record_type: "waste transfer, weighbridge, wastewater meter, and treatment records"
      raw_fields: "waste identity; mass or volume; composition; treatment state; destination; date; represented production"
      collection_method: "reconcile dispatched waste, internal recovery, and stock change"
      unit: "kg"
      frequency: "each dispatch, aggregated monthly"
      temporal_coverage: "same reference period as product output"
      site_scope: "reporting site and attributable toll processors"
      aggregation_rule: "exported waste = opening waste stock + generated waste - closing waste stock - internal reuse; normalize to released net product mass"
      quality_evidence: "manifests; weighbridge tickets; meter calibration; laboratory analysis; treatment receipt"
    - protocol_id: cp_assembly_records
      process_id: "assembly_calibration"
      flow_role: "PCB assembly and assembly/test electricity"
      record_type: "BOM issue, reject, submeter, calibration, and inspection records"
      raw_fields: "PCB identity and revision; installed mass; rejects; meter reading; batch; machine time; calibration or verification result; released mass"
      collection_method: "reconcile installed components and allocate measured energy to released conforming output"
      unit: "kg and MJ"
      frequency: "each batch"
      temporal_coverage: "same reference period as product output"
      site_scope: "reporting assembly and test site"
      aggregation_rule: "installed input plus attributable rejects; energy by submeter or documented causal driver; normalize to released net product mass"
      quality_evidence: "BOM; issue record; reject log; meter record; calibration certificate; inspection release"
    - protocol_id: cp_packaging_records
      process_id: "packaging"
      flow_role: "corrugated cardboard and polyethylene film"
      record_type: "packaging specification, issue, purchase, and loss records"
      raw_fields: "material identity; specification; issued mass; returned mass; converting loss; packaged net product mass"
      collection_method: "weigh representative packaging configurations and reconcile issues to packaged output"
      unit: "kg"
      frequency: "each packaging configuration and monthly reconciliation"
      temporal_coverage: "same reference period as product output"
      site_scope: "reporting packaging site"
      aggregation_rule: "net packaging issued plus attributable loss divided by net reference product mass"
      quality_evidence: "packaging drawing; scale calibration; issue ledger; supplier declaration"
    - protocol_id: cp_product_release
      process_id: "packaging"
      flow_role: "conforming reference product"
      record_type: "final weighing, inspection, and release records"
      raw_fields: "product type; part number; drawing revision; compatible machine; function; serial or lot; net mass; performance class; calibration status; release disposition"
      collection_method: "weigh product without packaging and retain final conformity evidence"
      unit: "kg"
      frequency: "each released lot or item"
      temporal_coverage: "same reference period as all input records"
      site_scope: "reporting manufacturer"
      aggregation_rule: "sum released conforming net mass and normalize the linked inventory to exactly 1 kg"
      quality_evidence: "calibrated scale record; inspection report; calibration or verification certificate where applicable; release authorization"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable exchange amount / released conforming net product mass"
      inputs:
        - "exchange amount"
        - "released conforming net product mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "electricity (MJ) = measured electricity (kWh) x 3.6"
      inputs:
        - "electricity meter reading in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "purchased materials and components"
      rule: "consumed mass = opening stock + receipts - closing stock - documented returns or transfers out"
      inputs:
        - "stock and transaction records by material identity"
      output: "consumed material mass"
      source_ids: []
    - id: calc_waste_reconciliation
      applies_to: "scrap and wastewater"
      rule: "exported waste = opening waste stock + generated or collected waste - closing waste stock - documented internal reuse"
      inputs:
        - "waste stock"
        - dispatch
        - meter
        - "and reuse records"
      output: "exported waste mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain part number or drawing revision, function, compatible machine, product configuration, net mass, and release status."
      evidence: "BOM, drawing, product specification, calibrated scale record, inspection release"
    - id: dq_temporal_alignment
      applies_to: "all foreground exchanges"
      requirement: "Inputs, outputs, stock corrections, rejects, rework, and released product shall cover the same representative period; justify how the chosen period captures normal product and operating variation."
      evidence: "dated ledgers, meter records, production report, campaign rationale"
    - id: dq_bom_completeness
      applies_to: "purchased materials and components"
      requirement: "Reconcile all purchased input mass to named atomic flows or explicitly document every residual mass by concrete substance or component and resolve its UUID before publication."
      evidence: "mass-based BOM reconciliation and unresolved-flow log"
    - id: dq_meter_quality
      applies_to: "electricity, water, wastewater, and product mass"
      requirement: "Document meter or scale identity, calibration status, reading interval, missing-data treatment, and allocation method."
      evidence: "calibration record, meter log, estimation worksheet"
    - id: dq_calibration_traceability
      applies_to: "force-application, force-measuring, and extensometer accessories"
      requirement: "Where the product claim depends on calibration or verification, retain the applicable procedure, equipment identity, result, uncertainty or class, and certificate traceability."
      evidence: "calibration or verification record; iso-7500-1-2018; iso-9513-2012"
    - id: dq_upstream_representativeness
      applies_to: "linked upstream datasets"
      requirement: "Match material state, geography, technology, recycled content, electricity mix, water supply, and waste destination; disclose every proxy."
      evidence: "dataset metadata and proxy justification"
validation_rules:
  - rule_id: validate_category_scope
    applies_to: "product identity"
    rule: "The output shall be a separately supplied part or accessory specifically or principally for a CPC 48262 mechanical-properties testing machine; a complete machine or unrelated instrument part fails category conformance."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_reference_flow
    applies_to: "functional unit and reference flow"
    rule: "Confirm exactly 1 kg net conforming product without packaging and all required qualifiers, including product function, interface, configuration, manufacturing route, and calibration status where applicable."
    source_ids: []
  - rule_id: validate_inventory_atomicity
    applies_to: "process inventory"
    rule: "Every exchange shall be a concrete atomic flow with one direction, one flow type, one property, one unit, and one applicability condition; no utility, material, packaging, waste, or emission umbrella row is allowed."
    source_ids: []
  - rule_id: validate_inventory_reconciliation
    applies_to: "inputs, outputs, rework, and stock"
    rule: "Reconcile purchase, stock, BOM, meter, reject, rework, waste, and release records over the same period; investigate and disclose every unexplained material-balance gap."
    source_ids: []
  - rule_id: validate_uuid_status
    applies_to: "Tiangong references"
    rule: "Use only directly audited public state_code=100 UUIDs with matching semantics, classification, product state, flow type, property, and unit group. Keep the reference-product and polyethylene-film UUID fields unresolved until exact candidates are audited."
    source_ids: []
  - rule_id: validate_calibration_claim
    applies_to: "calibrated or verified accessories"
    rule: "A force-application accessory, force-measuring assembly, or extensometer carrying a calibration or performance claim shall retain applicable inspection, calibration or verification evidence and shall identify the static or dynamic application boundary."
    source_ids:
      - iso-7500-1-2018
      - iso-9513-2012
  - rule_id: validate_boundary_and_allocation
    applies_to: "dataset model"
    rule: "Confirm all foreground and outsourced operations, upstream links, waste destinations, exclusions, cut-offs, proxies, and shared-process allocation drivers are disclosed and consistently applied."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after methodology and UUID review; this candidate PCR does not itself publish a dataset"
  downstream_use: "Cradle-to-gate process datasets and lifecyclemodel components for a declared separately supplied mechanical-properties testing-machine part or accessory"
  allowed_use: "Product-footprint and equipment-system studies when the product function, compatible-machine interface, material composition, manufacturing route, calibration status, geography, time, and packaging are representative"
  excluded_use: "Comparison across different accessory functions or performance classes; complete-machine datasets; unqualified global averages; use-phase or end-of-life claims without added scenario data"
  required_metadata: "canonical PCR id; product type; part number or drawing revision; compatible machine; function; net mass; BOM coverage; manufacturing and finishing routes; calibration or verification status; geography; reference period; packaging; allocation; cut-offs; data sources; UUID resolution status"
  required_quality_disclosure: "temporal and geographic representativeness; primary-data share; meter and scale quality; BOM mass coverage; material-balance result; outsourced operations; proxies; uncertainty; unresolved UUIDs or range-evidence needs"
  update_trigger: "material design or supplier change; manufacturing-route or site change; calibration-standard revision affecting claims; electricity or waste-treatment change; more representative foreground data; resolution of the reference-product or polyethylene-film UUID; new independent range evidence"
