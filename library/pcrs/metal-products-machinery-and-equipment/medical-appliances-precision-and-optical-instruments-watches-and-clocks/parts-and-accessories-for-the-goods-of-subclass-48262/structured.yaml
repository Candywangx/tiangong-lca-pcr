      rule: "Include only a separately supplied part or accessory for a CPC 48262 mechanical-properties testing machine; reject a complete testing machine or a part for another instrument category."
      source_ids:
        - un-cpc-3-0-structure-2025
        - un-cpc-3-0-explanatory-notes-2025
    - rule_id: boundary_foreground_operations
      applies_to: "foreground processes"
      rule: "Include all attributable on-site and outsourced preparation, fabrication, finishing, cleaning, assembly, calibration or verification, inspection, rework, and packaging needed to deliver the conforming reference product."
      source_ids: []
    - rule_id: boundary_upstream_and_waste
      applies_to: "purchased inputs and treatment"
      rule: "Link every purchased input and exported waste to an upstream supply or treatment dataset consistent with its declared state, geography, technology, and destination; do not treat upstream emissions as direct foreground exchanges."
      source_ids: []
