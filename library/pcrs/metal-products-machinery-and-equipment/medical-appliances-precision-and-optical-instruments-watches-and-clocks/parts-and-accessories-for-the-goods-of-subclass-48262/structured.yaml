    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with purchased materials and components at the reporting manufacturer's gate and ends with the inspected, conforming, packaged product at that gate. It includes attributable preparation, machining or forming, finishing and cleaning, assembly, calibration or verification, inspection, rework, internal material movements, and packaging. Upstream production and delivery of every purchased input are represented by compatible upstream datasets rather than recreated as foreground operations."
