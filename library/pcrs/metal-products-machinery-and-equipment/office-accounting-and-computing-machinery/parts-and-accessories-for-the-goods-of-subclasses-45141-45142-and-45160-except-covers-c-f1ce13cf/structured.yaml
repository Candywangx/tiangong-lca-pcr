allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_processes"
    rule: "Prefer metered subdivision; use a documented causal physical driver, then a justified economic basis if no physical relation is defensible."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_rework
    applies_to: "part_batches"
    rule: "Charge failed production and rework to accepted output. Keep internal regrind separate from purchased recycled resin. Report recovery conventions and do not subtract hypothetical avoided virgin production."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_moulding
      process_id: "moulding"
      flow_role: "Each atomic exchange and output"
      record_type: "Batch ledger and metering"
      raw_fields: "part revision; batch; Q; M; stock change; item count; unit mass; rejects; rework; supplier; route; meter start/end; driver share"
      collection_method: "Weigh issues, returns, transfers and wastes; read submeters; reconcile invoice and acceptance records"
      unit: "kg; kWh; MJ; count"
      frequency: "Each batch and meter period"
      temporal_coverage: "One declared consecutive production year; disclose shorter startup coverage"
      site_scope: "Named site and outsourced route"
      aggregation_rule: "Sum net Q and accepted M for identical part revision, then Q/M; no averaging of batch ratios"
      quality_evidence: "Calibration; invoices; BOM; transfer pairs; acceptance tests; waste tickets"
    - protocol_id: cp_forming
      process_id: "forming"
      flow_role: "Each atomic exchange and output"
      record_type: "Batch ledger and metering"
      raw_fields: "part revision; batch; Q; M; stock change; item count; unit mass; rejects; rework; supplier; route; meter start/end; driver share"
      collection_method: "Weigh issues, returns, transfers and wastes; read submeters; reconcile invoice and acceptance records"
      unit: "kg; kWh; MJ; count"
      frequency: "Each batch and meter period"
      temporal_coverage: "One declared consecutive production year; disclose shorter startup coverage"
      site_scope: "Named site and outsourced route"
      aggregation_rule: "Sum net Q and accepted M for identical part revision, then Q/M; no averaging of batch ratios"
      quality_evidence: "Calibration; invoices; BOM; transfer pairs; acceptance tests; waste tickets"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "Each atomic exchange and output"
      record_type: "Batch ledger and metering"
      raw_fields: "part revision; batch; Q; M; stock change; item count; unit mass; rejects; rework; supplier; route; meter start/end; driver share"
      collection_method: "Weigh issues, returns, transfers and wastes; read submeters; reconcile invoice and acceptance records"
      unit: "kg; kWh; MJ; count"
      frequency: "Each batch and meter period"
      temporal_coverage: "One declared consecutive production year; disclose shorter startup coverage"
      site_scope: "Named site and outsourced route"
      aggregation_rule: "Sum net Q and accepted M for identical part revision, then Q/M; no averaging of batch ratios"
      quality_evidence: "Calibration; invoices; BOM; transfer pairs; acceptance tests; waste tickets"
  calculation_rules:
    - id: normalize
      applies_to: "all rows"
      rule: "q_i = sum(Q_i after allocation and stock correction)/sum(M); M > 0"
      inputs:
        - Q_i
        - M
      output: "q_i"
      source_ids: []
    - id: transfer_balance
      applies_to: "housing and chassis"
      rule: "Internal output = internal receipt + transfer stock change; exclude purchased receipts from this equation"
      inputs:
        - "paired transfer ledger"
      output: "balance residual"
      source_ids: []
    - id: material_balance
      applies_to: "fabrication and assembly"
      rule: "Net material inputs = accepted net output + external waste + inventory change + separately measured losses; internal regrind is not a new external input. Investigate residual against instrument uncertainty."
      inputs:
        - "material ledger"
      output: "mass residual"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "part and upstream datasets"
      requirement: "Verify exact part revision and compatible supplier boundary; generic data require a declared sensitivity check."
      evidence: "BOM; supplier declarations"
    - id: coverage
      applies_to: "collection period"
      requirement: "Record geography, period, technology, completeness and uncertainty."
      evidence: "ghg-protocol-product-standard-2011"
    - id: quantity
      applies_to: "all quantities"
      requirement: "Retain raw observations and conversion factors. Missing records are unknown, not zero; investigate with supplier or site measurements."
      evidence: "Meter and batch evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference_flow"
    rule: "Require all qualifiers and host compatibility evidence. Reject complete hosts, transport cases and unqualified mixed-part averages."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_inventory
    applies_to: "inventory"
    rule: "Check every applicable row has a quantity or explicit missing-data finding; reconcile BOM and actual route against added atomic rows. Missing UUIDs do not waive collection."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "quantities"
    rule: "Require positive accepted mass, consistent units, paired internal transfers and explained balance residuals. Count rework once and packaging separately."
    source_ids: []
  - rule_id: validate_use
    applies_to: "downstream_use"
    rule: "Do not infer host energy savings, lifetime or recovery credits from cassette mass or manufacturer marketing claims."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Part manufacture or replacement input to a separately defined host system"
  allowed_use: "Compatible part number, revision, material route and gate boundary"
  excluded_use: "Whole-ATM claims; direct comparison of unlike parts; unmodelled use-stage savings"
  required_metadata: "Qualifiers; site; period; net mass; count; BOM; supplier datasets; allocation; process map; boundary"
  required_quality_disclosure: "Measured share; missing data; unresolved identities; uncertainty; exclusions; range limitations"
  update_trigger: "Part revision, material supplier, route, tooling, energy mix or test specification changes"
