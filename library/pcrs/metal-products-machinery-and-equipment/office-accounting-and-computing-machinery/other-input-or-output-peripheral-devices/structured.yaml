allocation_rules:
  - rule_id: allocation_records
    applies_to: "shared_operations"
    rule: "Use dedicated component issues and meters first. For shared test equipment allocate measured electricity by metered power times occupied test duration; for common packing allocate by actual boxes used. Document causal drivers and reconcile allocated totals to measured totals under cp_assembly_test and cp_packing."
    source_ids: []
  - rule_id: reject_burden
    applies_to: "waste"
    rule: "Assign reject and rework burdens to accepted output. Do not count reworked devices twice or automatically credit avoided virgin production for waste leaving the gate; disclose the downstream recycling convention."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly_test
      process_id: "assembly_test"
      flow_role: "components; electricity; accepted and rejected devices"
      record_type: "production records"
      raw_fields: "model; batch; component issue and return mass; opening and closing stock; accepted count; net unit mass; reject mass; kWh; test duration; power; rework; treatment destination"
      collection_method: "weigh and reconcile stock; meter electricity including test hosts; retain acceptance and waste transfer records"
      unit: "kg; count; kWh; h"
      frequency: "each batch and meter interval"
      temporal_coverage: "declared continuous representative reporting period"
      site_scope: "one site and model"
      aggregation_rule: "sum net issues and measured energy; divide by accepted net mass; avoid rework double count"
      quality_evidence: "calibration; BOM; stock reconciliation; supplier composition; test log"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "box consumption"
      record_type: "packing record"
      raw_fields: "box mass; counts issued and returned; accepted device mass; configuration"
      collection_method: "weigh representative boxes and reconcile issues with delivery records"
      unit: "kg; count"
      frequency: "each shipment"
      temporal_coverage: "same reporting period as assembly"
      site_scope: "same site and model"
      aggregation_rule: "net box mass divided by accepted device mass"
      quality_evidence: "scale calibration and packing BOM"
  calculation_rules:
    - id: normalize
      applies_to: "inventory"
      rule: "M = accepted count × measured unit net mass; q_i = period net quantity_i / M; reconcile opening stock + receipts - closing stock - returns"
      inputs:
        - cp_assembly_test
        - cp_packing
      output: "exchange per kg device"
      source_ids: []
    - id: energy
      applies_to: "electricity"
      rule: "MJ = kWh × 3.6"
      inputs:
        - cp_assembly_test
      output: "MJ/kg"
      source_ids: []
  data_quality_requirements:
    - id: traceability
      applies_to: "all_rows"
      requirement: "Link quantities to dated records, model and site; retain uncertainty and missing-data disclosure. Do not use manufacturer specifications as production consumption."
      evidence: "cp_assembly_test; cp_packing"
    - id: technology
      applies_to: "reference_product"
      requirement: "Record reader protocol, supplied interface and acceptance tests; do not pool contact, magnetic and optical devices without explicit weighting."
      evidence: "acs-acr39u-product"
    - id: complete_bom
      applies_to: "components"
      requirement: "Reconcile component mass, accepted product, rejects and inventory change. Every mismatch requires investigation with measurement uncertainty, not a preset tolerance."
      evidence: "supplier BOM and batch ledger"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Require all reference qualifiers and positive accepted mass. Exclude storage-media readers and manual input devices."
    source_ids:
      - un-cpc-2-1-reader-notes
  - rule_id: validate_inventory
    applies_to: "all_rows"
    rule: "Require atomic exchanges, compatible units, period alignment and upstream boundary links. Missing UUIDs remain explicit identity gaps; missing quantities are not zeros. No generic external range is authorized."
    source_ids: []
  - rule_id: validate_comparison
    applies_to: "dataset"
    rule: "A mass-normalized manufacturing result cannot establish service equivalence. Compare only after aligning reading function, performance, duty cycle, lifetime and full system boundary."
    source_ids:
      - ghg-product-standard-page
