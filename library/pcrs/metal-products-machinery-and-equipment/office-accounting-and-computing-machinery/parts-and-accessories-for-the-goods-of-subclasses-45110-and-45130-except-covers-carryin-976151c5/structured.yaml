allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared_operations"
    rule: "Use batch submetering and process subdivision first. Where unavoidable, allocate shared machine energy using measured operating time and load; justify the physical relationship. Use economic allocation only with a documented reason why physical allocation is unsuitable and disclose sensitivity."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: allocation_reuse
    applies_to: "core_and_waste"
    rule: "Disclose the selected reuse/recycling allocation and inherited core burdens. Do not automatically credit avoided new cores or future machine service. Keep waste treatment separate from coproduct allocation; no duplicate virgin-material substitution credit."
    source_ids:
      - ghg-protocol-product-standard
