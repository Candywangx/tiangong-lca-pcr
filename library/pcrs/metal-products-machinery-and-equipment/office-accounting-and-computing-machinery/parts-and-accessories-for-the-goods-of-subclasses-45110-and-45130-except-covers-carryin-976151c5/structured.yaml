    - rule_id: boundary_gate
      applies_to: "foreground"
      rule: "Collect receipt-through-dispatch coating, curing, finishing, testing, packing and attributable losses. Connect purchased inputs to upstream supply and actual transport; connect exported waste to treatment. Report the resulting cradle-to-gate partial boundary and all exclusions."
