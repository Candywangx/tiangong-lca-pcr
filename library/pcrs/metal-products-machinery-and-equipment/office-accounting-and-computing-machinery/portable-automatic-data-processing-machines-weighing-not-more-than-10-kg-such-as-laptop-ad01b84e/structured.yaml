allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared manufacturing, assembly, testing and logistics"
    rule: "Avoid allocation by subdividing processes and collecting configuration-, line-, batch- or route-specific records whenever practicable."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: allocation_physical
    applies_to: "inseparable shared processes with a causal physical relationship"
    rule: "Use a physical basis such as mass, machine time or energy only when it reflects how inputs and outputs change and revenue per mass or energy is not materially different."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: allocation_economic
    applies_to: "inseparable shared processes without a justified physical relationship"
    rule: "Use representative economic values at the unit-process exit and report a sensitivity analysis; do not use price merely because mass data are inconvenient."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: allocation_rejects
    applies_to: "defective components and rejected finished machines"
    rule: "Assign consumed materials, component burdens, energy and waste treatment for rejects to conforming output; do not allocate them away as a separate saleable product unless a documented recovered output reaches substitution."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: allocation_waste_substitution
    applies_to: "reuse, recycling and energy recovery"
    rule: "Apply the point-of-substitution boundary: assign all treatment before substitution to the waste-generating system and later processing to the subsequent system; when substitution is uncertain, conservatively retain treatment in the studied product system."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: allocation_mass_conservation
    applies_to: "all allocated processes"
    rule: "The sum of allocated inputs and outputs shall equal the measured process totals, with no double counting or omission; disclose the basis and allocation factors."
    source_ids:
      - environdec-pcr-2024-06
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_component_records
      process_id: "component_supply_assembly_testing"
      flow_role: "component and net-product mass balance"
      record_type: "engineering BOM, supplier declaration, weigh ticket, ERP issue and reject record"
      raw_fields: "configuration id; production units; component id; supplier; material or component category; component mass; net unit mass; accessory inclusion; battery, PCBA and display identity; reject quantity; stock change"
      collection_method: "Controlled BOM export reconciled with calibrated unit and batch weighing and supplier composition evidence"
      unit: "kg and item"
      frequency: "Per configuration revision and production batch; aggregate at least annually"
      temporal_coverage: "At least one representative year; deviations justified"
      site_scope: "Every represented model, configuration and final assembly site"
      aggregation_rule: "Production-volume-weight each configuration and normalize total attributable component mass to net conforming output mass"
      quality_evidence: "Approved BOM revision, calibration record, supplier declaration and signed reconciliation"
    - protocol_id: cp_supply_chain_logistics
      process_id: "component_supply"
      flow_role: "inbound transport"
      record_type: "purchase order, bill of lading, freight invoice and warehouse record"
      raw_fields: "supplier and origin; receiving site; component mass; route legs; distance; mode; fuel; load factor; air-freight flag; warehouse energy if attributable"
      collection_method: "Join shipment documents to BOM receipts and calculate route-specific tkm"
      unit: "kg, km and tkm"
      frequency: "Each shipment or representative lane updated annually"
      temporal_coverage: "Same production period as represented output"
      site_scope: "Suppliers covering main parts and at least the supply-chain mass coverage declared by the dataset"
      aggregation_rule: "Sum route-leg tkm by configuration and production-volume-weight to 1 kg output"
      quality_evidence: "Carrier document, route evidence, mass reconciliation and coverage report"
    - protocol_id: cp_site_operations_records
      process_id: "assembly_testing"
      flow_role: "assembly inputs, energy, rejects, waste and direct emissions"
      record_type: "meter, invoice, MES, maintenance, waste manifest and environmental monitoring record"
      raw_fields: "line and site; production time; units and net mass; electricity; fuels; water; auxiliaries; test energy; reject reason and mass; waste type and destination; direct emission; stock change"
      collection_method: "Submeter where available; otherwise documented causal allocation from site totals, reconciled to production"
      unit: "kWh, MJ, kg, m3 and substance-specific units"
      frequency: "Continuous or invoice period, aggregated monthly and annually"
      temporal_coverage: "At least one representative year of normal operation"
      site_scope: "Every final assembly, firmware-loading and test site in the declared mix"
      aggregation_rule: "Sum attributable operations, include rejects, production-volume-weight sites and normalize to 1 kg conforming output"
      quality_evidence: "Meter calibration, invoices, MES counts, permits, manifests and annual mass-energy balance"
    - protocol_id: cp_packaging_distribution_records
      process_id: "packaging_distribution"
      flow_role: "packaging and outbound delivery"
      record_type: "packaging specification, weigh record, sales shipment and freight record"
      raw_fields: "packaging component and material; mass; reuse cycles; destination market; shipment mass; route distance; mode; load factor; repacking and packaging treatment"
      collection_method: "Weigh complete packaging set and link sales-weighted routes to shipped configurations"
      unit: "kg, km and tkm"
      frequency: "Per packaging revision and shipment lane, reviewed annually"
      temporal_coverage: "Representative sales year"
      site_scope: "All packaging suppliers and destination markets in scope"
      aggregation_rule: "Allocate reusable packaging over documented cycles and sales-weight route results to 1 kg net equipment"
      quality_evidence: "Packaging drawing, scale calibration, freight evidence, sales weights and route coverage report"
    - protocol_id: cp_use_profile_power_tests
      process_id: "use_maintenance"
      flow_role: "RSL, mode power, mode time, maintenance and replacements"
      record_type: "accredited or controlled power test, default-settings record, field telemetry or survey, warranty and service record"
      raw_fields: "configuration; OS and firmware; display setting; external power supply; battery state; active, short-idle, long-idle, sleep, alternative-low-power and off power; mode hours; RSL; market; electricity mix; service event and replacement part"
      collection_method: "Test representative configurations under IEC 62623:2022 or documented equivalent; use actual field profile when representative, otherwise a disclosed default scenario"
      unit: "W, h/year, kWh, years, item and kg"
      frequency: "Per major hardware or firmware revision; use profile and RSL reviewed at dataset update"
      temporal_coverage: "Test date and scenario period stated"
      site_scope: "Configurations and use markets represented by the dataset"
      aggregation_rule: "Calculate configuration-level lifetime energy, then production- or sales-weight to 1 kg equipment; keep markets separate before weighting"
      quality_evidence: "Complete test report, instrument uncertainty, default-setting screenshots or records, weighting data and service evidence"
    - protocol_id: cp_end_of_life_scenario
      process_id: "use_maintenance_end_of_life"
      flow_role: "collection, reuse, dismantling, recovery and disposal"
      record_type: "producer take-back, recycler weighbridge, treatment report, market statistic and regulatory scenario record"
      raw_fields: "geography; discarded and collected mass; route; preparation for reuse; depollution; dismantling input and output; recovered material; residue; hazardous destination; substitution evidence"
      collection_method: "Prefer operator mass balances; otherwise use current market-specific regulated scenario with explicit uncertainty and no invented recovery"
      unit: "kg, km and tkm"
      frequency: "Annual operator data or scenario version"
      temporal_coverage: "Current for declared destination market and compatible with RSL scenario"
      site_scope: "All destination markets in the sales-weighted scope"
      aggregation_rule: "Conserve mass through collection and treatment; weight scenarios by sales or installed base and report recovery benefits separately"
      quality_evidence: "Recycler certificate, permits, weighbridge records, audited mass balance, regulation and scenario provenance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable activity amount divided by net conforming finished-equipment mass in kg"
      inputs:
        - "activity amount"
        - "net conforming output mass"
        - "stock change"
        - "reject attribution"
      output: "activity amount per 1 kg reference flow"
      source_ids:
        - environdec-pcr-2024-06
    - id: calc_configuration_weighting
      applies_to: "product-family, plant-mix and market-mix datasets"
      rule: "Calculate each configuration first, then weight by conforming production units or sales units and measured net mass; preserve the weighting table and coverage"
      inputs:
        - "configuration activity"
        - "configuration units"
        - "unit mass"
        - "site or market share"
      output: "production- or sales-weighted activity per 1 kg reference flow"
      source_ids:
        - environdec-pcr-2024-06
    - id: calc_transport_service
      applies_to: "inbound and outbound logistics"
      rule: "tkm = shipped mass in tonnes multiplied by actual route distance in km, adjusted only by documented allocation or return-load convention"
      inputs:
        - "shipment mass"
        - distance
        - mode
        - "load factor"
        - allocation
      output: "route-specific tkm per 1 kg reference flow"
      source_ids:
        - environdec-pcr-2024-06
    - id: calc_lifetime_energy
      applies_to: "operational electricity"
      rule: "lifetime kWh = sum of measured mode power in kW multiplied by annual hours in that mode, multiplied by RSL; the annual mode hours shall be internally consistent and charging or external-power-supply losses shall follow the test boundary"
      inputs:
        - "measured mode power"
        - "mode hours"
        - RSL
        - "configuration and market weights"
      output: "lifetime operational electricity per 1 kg reference flow"
      source_ids:
        - environdec-pcr-2024-06
        - iec-62623-2022
        - energy-star-computers-9-0
        - eu-reg-617-2013
    - id: calc_mass_balance
      applies_to: "BOM, assembly, packaging and end-of-life treatment"
      rule: "inputs plus opening stock = products plus wastes plus direct releases plus closing stock; investigate and disclose any residual rather than silently scaling critical components"
      inputs:
        - "material and component inputs"
        - "product output"
        - waste
        - releases
        - stock
      output: "reconciled mass balance and unexplained residual"
      source_ids:
        - environdec-pcr-2024-06
    - id: calc_eol_scenario_weighting
      applies_to: "end-of-life geography mix"
      rule: "Weight collection and treatment routes by documented sales, installed-base or take-back shares; assign uncollected and unknown fractions conservatively and keep substitution benefits separate"
      inputs:
        - "market weights"
        - "collection fraction"
        - "treatment inputs and outputs"
        - "substitution evidence"
      output: "WEEE route inventory per 1 kg discarded equipment"
      source_ids:
        - environdec-pcr-2024-06
        - eu-weee-2012-19
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Demonstrate complete portable equipment, mass not exceeding 10 kg, exact product-flow UUID and Mass reference; reject component-only and wrong-CPC proxies"
      evidence: "Product specification, scale record, configuration list and Tiangong identity reference"
    - id: dq_bom_completeness
      applies_to: "product content and packaging"
      requirement: "Reconcile 100% gross content declaration for product and packaging where available and satisfy the PCR minimum 95% energy, mass and impact coverage; never cut off battery, PCBA, display, microprocessor or listed high-relevance materials"
      evidence: "BOM reconciliation, supplier evidence, sensitivity assessment and excluded-flow register"
    - id: dq_specific_data
      applies_to: "directly controlled manufacturing and logistics"
      requirement: "Use site-specific data for controlled processes, normally averaged over at least one representative year; production-weight multiple sites and confirm specific-data representativeness within five years"
      evidence: "Meter and invoice records, production totals, confirmation date and weighting workbook"
    - id: dq_generic_data
      applies_to: "upstream and background datasets"
      requirement: "Use attributional selected generic data that match technology, geography and time; use the latest database version where practicable, with reference year normally not older than ten years; identify proxy data and its contribution"
      evidence: "Dataset metadata, version, representativeness assessment and proxy contribution report"
    - id: dq_use_measurement
      applies_to: "operational energy"
      requirement: "Retain reproducible power-test configuration, uncertainty, default settings, mode definitions, mode hours, RSL and market electricity mix; do not treat certification limits as measured inventory"
      evidence: "IEC 62623 or equivalent test report, ENERGY STAR 9.0 setup record, use-profile evidence and calculation workbook"
    - id: dq_market_and_route
      applies_to: "distribution, use and end of life"
      requirement: "Make geographical coverage reflect actual sales and physical routes; preserve air freight, distinct electricity markets and regulated WEEE scenarios before weighting"
      evidence: "Sales data, bills of lading, route evidence, electricity-mix provenance and EOL scenario records"
    - id: dq_hazardous_and_circularity
      applies_to: "product content and WEEE"
      requirement: "Retain material declarations and identify batteries, hazardous substances and treatment destinations needed for safe depollution, reuse and recycling"
      evidence: "RoHS declaration, supplier material declaration, treatment information and WEEE operator evidence"
    - id: dq_uncertainty_and_gaps
      applies_to: "all site-specific quantities"
      requirement: "If reliable quantities are unavailable, require foreground collection or mark validation inconclusive; do not insert an unreferenced point value or a reasoned estimate into a publishable dataset"
      evidence: "Gap register, collection request, uncertainty assessment and review decision"
validation_rules:
  - rule_id: validate_exact_reference_identity
    applies_to: "dataset reference flow"
    rule: "Require UUID c4cb6070-944d-41be-a231-a0a2b9477174, state-compatible Product flow semantics, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg; fail component, model-family-only or wrong-classification substitutions."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_scope_and_qualifiers
    applies_to: "foreground package identity"
    rule: "Require complete portable equipment not exceeding 10 kg and every Required qualifier; a product-family or average dataset shall publish its configuration list, weighting and coverage."
    source_ids:
      - unsd-cpc-3-0
      - energy-star-computers-9-0
      - eu-reg-617-2013
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "Require measured net equipment mass and separate packaging mass; verify that all inventory results reproduce 1 kg reference output without counting packaging in the product mass."
    source_ids:
      - environdec-pcr-2024-06
      - eu-weee-2012-19
  - rule_id: validate_lifecycle_completeness
    applies_to: "system boundary"
    rule: "Require material and component supply, assembly and testing, packaging and distribution, use and maintenance, and end-of-life stages; any zero or omitted activity requires evidence and a stated applicability decision."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: validate_critical_components
    applies_to: "BOM and upstream linking"
    rule: "Require explicit battery, PCBA, display and microprocessor rows and evaluate copper, precious metals, relevant rare earths and listed electronic materials independently of cut-off."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: validate_mass_balance
    applies_to: "component supply, assembly, packaging and EOL"
    rule: "Reconcile inputs, products, wastes, direct releases and stock changes; require investigation and disclosure of residuals and reject burdens."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: validate_operational_energy
    applies_to: "use stage"
    rule: "Require measured mode power, internally consistent annual mode hours, RSL, default settings, test uncertainty and market electricity mix; fail any calculation that substitutes certification thresholds for product data."
    source_ids:
      - environdec-pcr-2024-06
      - iec-62623-2022
      - energy-star-computers-9-0
      - eu-reg-617-2013
  - rule_id: validate_allocation
    applies_to: "shared processes and waste treatment"
    rule: "Require the allocation hierarchy, factors, conserved totals and economic-allocation sensitivity where used; require point-of-substitution evidence before recovered outputs cross the boundary."
    source_ids:
      - environdec-pcr-2024-06
  - rule_id: validate_eol_traceability
    applies_to: "WEEE scenario"
    rule: "Require collection geography, discarded and collected mass, depollution and treatment routes, recovered outputs, residues and hazardous destinations; unknown recovery is not accepted as zero-burden recycling."
    source_ids:
      - environdec-pcr-2024-06
      - eu-weee-2012-19
  - rule_id: validate_quantity_evidence
    applies_to: "all quantitative inventory"
    rule: "Accept collected records, calculations linked to collection, or cited external evidence; when reliable quantity evidence is missing, report the check as inconclusive and request foreground collection rather than fabricate a range."
    source_ids:
      - environdec-pcr-2024-06
published_dataset_profile:
  dataset_role: "Product-, family-, plant- or production-weighted foreground dataset for complete portable automatic data processing equipment"
  downstream_use: "secondary_dataset; background_dataset when configuration coverage, foreground evidence, allocation, use scenario and end-of-life scenario have been reviewed for the declared market"
  allowed_use: "Model-specific product studies; supplier and corporate inventories; procurement comparisons between datasets with equivalent reference mass, configuration coverage, RSL, use profile, geography, system boundary and data quality; downstream process and lifecyclemodel construction"
  excluded_use: "Component or bare-board modelling as a complete computer; representing the category with one narrow model without an explicit model-specific scope; comparisons across incompatible RSLs, performance/configuration mixes, markets or boundaries; claims of certification or regulatory compliance based only on this PCR"
  required_metadata: "PCR id and version context; exact reference UUID; model or configuration list; production or sales weighting; net mass; included accessories; BOM and critical-component coverage; sites and period; electricity and logistics provenance; RSL and mode profile; maintenance; packaging; end-of-life geography; allocation; cut-offs; source and dataset versions"
  required_quality_disclosure: "Specific, selected-generic and proxy data shares where calculated; temporal, geographical and technological representativeness; mass and energy reconciliation; excluded flows and sensitivity; measurement uncertainty; supplier coverage; use and EOL scenario uncertainty; unresolved data gaps"
  update_trigger: "Hardware or BOM revision affecting represented mass or major components; new CPU, GPU, display or battery platform; changed assembly site or electricity supply; major firmware or default-power-management change; changed production or sales mix; material distribution, RSL, maintenance or WEEE scenario change; source, database or foreground data outside the stated representativeness period"
