measurement_rules:
  - id: reference_mass_basis
    applies_to: "reference product and every normalization denominator"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net mass of the complete configured equipment excluding distribution and consumer packaging; separately record included accessories and power supply, then normalize all results to 1 kg net finished equipment."
  - id: unit_to_mass_conversion
    applies_to: "records collected per item, batch or sales unit"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item- or batch-based records using measured configuration-specific net mass and production-volume weighting; do not use a single model mass for a multi-configuration mix unless representativeness is demonstrated."
  - id: bom_mass_reconciliation
    applies_to: "bill of materials, battery, PCBA, display, chassis and accessory records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile component and material mass to measured net equipment mass; record packaging separately and disclose stock change, moisture, adhesives, coatings and uncharacterized residuals."
  - id: operational_energy_measurement
    applies_to: "active, short-idle, long-idle, sleep, alternative-low-power and off modes"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Measure mode power with IEC 62623:2022 or an equally documented reproducible method, retain test configuration and default settings, and calculate lifetime energy from measured power, mode hours and declared RSL."
  - id: transport_service_conversion
    applies_to: "inbound component and outbound product transport"
    required_property_ref:
      name: "Transport service"
      uuid: ""
    required_unit: "tkm"
    rule: "Calculate tonne-kilometres from shipment mass, actual distance and route; disclose transport mode, load factor, allocation and any air freight rather than using an unexplained generic distance."
