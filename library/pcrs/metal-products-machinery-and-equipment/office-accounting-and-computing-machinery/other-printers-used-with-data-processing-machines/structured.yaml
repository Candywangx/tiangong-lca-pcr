allocation_rules:
  - rule_id: allocation_meter
    applies_to: "shared_activities"
    rule: "First subdivide using batch records and submetering. If shared electricity remains, use documented machine operating time and load; justify the physical relationship."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: allocation_rework
    applies_to: "rejects"
    rule: "Assign failed tests and rework to accepted output of the same model cohort. Record scrap as waste with its treatment burden; do not silently claim avoided virgin-material credits."
    source_ids: []
  - rule_id: allocation_coproduct
    applies_to: "saleable_outputs"
    rule: "If saleable co-products arise, document function and physical relationship; use economic allocation only if no defensible physical relationship exists, with price period and sensitivity disclosed."
    source_ids:
      - ghg-protocol-product-standard
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "Every listed exchange"
      record_type: "Batch ledger and meter record"
      raw_fields: "model, batch, dates, technology, item id, supplied contents, issues, returns, stock change, accepted count/mass, rejects, test media/ribbon, meter readings, waste recipient"
      collection_method: "Reconcile weighed issues/returns with BOM, meter logs, acceptance records and waste transfers"
      unit: "kg; MJ; item"
      frequency: "Each batch and meter interval"
      temporal_coverage: "One disclosed consecutive production period including shutdown and rework; report seasonal representativeness"
      site_scope: "One factory and identified lines"
      aggregation_rule: "Sum attributable quantities and divide by accepted net output mass; never average batch ratios without output weighting"
      quality_evidence: "Calibrations, supplier declarations, BOM version, traceable logs and balance reconciliation"
  calculation_rules:
    - id: normalize
      applies_to: "assembly"
      rule: "x_i = attributable batch quantity_i / accepted net batch printer mass. Use all batches of the reporting cohort."
      inputs:
        - cp_assembly
      output: "kg/kg; MJ/kg"
      source_ids: []
    - id: balance
      applies_to: "assembly"
      rule: "Issued material minus returns equals shipped material plus test waste and rejects plus net work-in-progress change; investigate residuals using measurement uncertainty. Packaging and consumables must remain distinguishable from net printer mass."
      inputs:
        - cp_assembly
      output: "Reconciled batch balance"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference_flow"
      requirement: "Keep technology, interface, model and included accessories consistent with the weighed configuration."
      evidence: "cp_assembly; epson-lx350-specifications; zebra-zd400-specifications"
    - id: coverage
      applies_to: "assembly"
      requirement: "Account for the entire BOM without double counting purchased assembly contents. List exclusions and uncertainty; missing exchange data are not zeros."
      evidence: "cp_assembly"
    - id: range_evidence
      applies_to: "amounts"
      requirement: "Use measured foreground values. This PCR supplies no external amount ranges; model specifications are not independent production benchmarks."
      evidence: "cp_assembly"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_printer"
    rule: "Require positive accepted output mass, a declared model mass and all reference qualifiers; reject inkjet, laser and multifunction identities."
    source_ids:
      - un-cpc-3-0-notes-2025
  - rule_id: validate_atomic
    applies_to: "inventory"
    rule: "Every exchange must be atomic, dimensionally consistent, traceable to cp_assembly and assigned a real UUID or an explicit unresolved identity; reject umbrella flow rows."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "assembly"
    rule: "Verify stock-adjusted mass balance, electricity allocation, test-repeat coverage, and route applicability. Investigate residuals rather than forcing closure with an invented exchange."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "result"
    rule: "Require explicit partial-boundary disclosure and separate upstream/downstream additions; gate-to-gate results alone cannot support a service-life comparison."
    source_ids:
      - ghg-protocol-product-standard
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Model-specific factory assembly input to a documented broader life-cycle system."
  excluded_use: "Unqualified full-life-cycle footprint, generic service comparison, or substitution for inkjet/laser manufacturing."
  required_metadata: "Reference qualifiers, time, geography, model, make/buy split, upstream links, process boundary and allocation."
  required_quality_disclosure: "Unresolved identities, missing exchanges, ranges not provided, balance residuals, uncertainty and representativeness."
  update_trigger: "Model/BOM/firmware or site changes; new metering, supply data, waste routes or resolved flow identities."
