allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "All foreground processes"
    rule: "First subdivide lines, tools, meters, batches and records to avoid allocation between card configurations and unrelated products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "Shared assembly, test and facility activity"
    rule: "When subdivision is not practicable, use a measured causal driver such as machine time multiplied by measured load, placement count, oven occupancy, test duration and load, treated volume, or floor-area-time for residual facility services."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_yield_and_rework
    applies_to: "Rejects, yield loss and rework"
    rule: "Attribute material, energy and treatment associated with normal rejects and rework to accepted output of the same configuration and period. Do not credit internal rework as a co-product."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_recovered_material
    applies_to: "Sold scrap or recovered materials"
    rule: "Keep collection and treatment burdens in the generating process. Apply any substitution or recycling credit only in a downstream method that explicitly requires it, and disclose the method separately."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_no_category_average
    applies_to: "Product families"
    rule: "Do not allocate or average across different primary functions, host interfaces, semiconductor technologies, cooling architectures, or acceptance profiles merely because they share CPC 45281."
    source_ids:
      - un-cpc-3-2025
      - itu-t-l1410-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference_identity_mass
      process_id: "firmware_test_and_acceptance_packaging_and_dispatch"
      flow_role: "Accepted reference product"
      record_type: "Scale and acceptance records"
      raw_fields: "configuration_id, serial_or_lot, gross_card_mass, detachable_items_mass, net_card_mass, acceptance_status"
      collection_method: "Calibrated weighing linked to final acceptance"
      unit: "kg"
      frequency: "Each lot or statistically justified sample"
      temporal_coverage: "Same reporting period"
      site_scope: "Each manufacturing site"
      aggregation_rule: "Sum accepted net mass only; report sampling expansion"
      quality_evidence: "Calibration record, sample plan, acceptance log"
    - protocol_id: cp_product_specific_bom
      process_id: "component_receipt_and_kitting_all_assembly_processes"
      flow_role: "Required component layers"
      record_type: "Engineering BOM and mass roll-up"
      raw_fields: "part_number, revision, layer, quantity, measured_or_declared_mass, unit, source, effective_date"
      collection_method: "Freeze the exact BOM revision and reconcile to measured card mass"
      unit: "kg plus count"
      frequency: "Each configuration or engineering change"
      temporal_coverage: "Effective production period"
      site_scope: "Each product and site"
      aggregation_rule: "Aggregate only within the six required layers plus disclosed support groups"
      quality_evidence: "Approved BOM, change record, mass reconciliation"
    - protocol_id: cp_supplier_layer_data
      process_id: "component_receipt_and_kitting"
      flow_role: "Purchased components"
      record_type: "Supplier declaration and upstream dataset"
      raw_fields: "supplier, site, part_number, technology, composition, mass, declaration_standard, dataset_id, validity"
      collection_method: "Collect part-specific supplier declarations and datasets; document fallback by layer"
      unit: "Native and kg"
      frequency: "Supplier or design change"
      temporal_coverage: "Valid for reporting period"
      site_scope: "Named supplier/site where available"
      aggregation_rule: "No cross-layer or cross-technology substitution"
      quality_evidence: "Supplier declaration, IEC/IPC data, dataset review"
    - protocol_id: cp_process_energy
      process_id: "controlled_fabrication_assembly_test_and_dispatch"
      flow_role: "Utilities"
      record_type: "Meter, tool log, and calculation"
      raw_fields: "meter_id, carrier, start, end, consumption, tool_state, load, operating_time, allocation_driver"
      collection_method: "Prefer submetering; otherwise calculate from measured load and operating time and reconcile to site meter"
      unit: "kWh, MJ"
      frequency: "Continuous, batch, or shift"
      temporal_coverage: "Representative reporting period"
      site_scope: "Each controlled site/process"
      aggregation_rule: "Sum by carrier; allocate with declared causal driver"
      quality_evidence: "Meter calibration, invoices, tool logs, reconciliation"
    - protocol_id: cp_process_materials_water
      process_id: "controlled_fabrication_and_assembly"
      flow_role: "Consumables and water"
      record_type: "Purchase, issue, return, recovery and stock records"
      raw_fields: "material_id, composition, opening_stock, purchases, issues, returns, recovery, closing_stock, process"
      collection_method: "Stock-balance each named material and assign to process"
      unit: "kg, m3, or native unit"
      frequency: "Batch or monthly"
      temporal_coverage: "Full reporting period"
      site_scope: "Each controlled site/process"
      aggregation_rule: "Opening plus purchases minus closing, returns and transfers"
      quality_evidence: "Inventory ledger, issue tickets, composition record"
    - protocol_id: cp_water_emissions
      process_id: "controlled_fabrication_and_assembly"
      flow_role: "Water and direct releases"
      record_type: "Metering, monitoring and permit records"
      raw_fields: "source_or_substance, quantity, unit, compartment, treatment, sampling_method, detection_limit, period"
      collection_method: "Measure intake/discharge and direct releases; use documented compliant calculation where monitoring is unavailable"
      unit: "m3, kg"
      frequency: "Permit or operational frequency"
      temporal_coverage: "Full reporting period"
      site_scope: "Each emission point"
      aggregation_rule: "Sum by substance, compartment and treatment; handle non-detects explicitly"
      quality_evidence: "Laboratory report, permit return, calculation sheet"
    - protocol_id: cp_yield_waste_rework
      process_id: "all_manufacturing_processes"
      flow_role: "Yield, rejects, rework and waste"
      record_type: "Manufacturing execution and waste records"
      raw_fields: "input_count_mass, accepted_count_mass, reject_reason, rework_route, waste_mass, destination, recovery"
      collection_method: "Reconcile input, accepted output, internal rework and exiting waste"
      unit: "Count and kg"
      frequency: "Each lot, monthly reconciliation"
      temporal_coverage: "Full reporting period"
      site_scope: "Each process/site"
      aggregation_rule: "Do not double count rework; sum exiting waste by type and destination"
      quality_evidence: "Yield report, weigh ticket, waste manifest, reconciliation"
    - protocol_id: cp_test_acceptance
      process_id: "firmware_test_and_acceptance"
      flow_role: "Function and quality"
      record_type: "Test system and disposition records"
      raw_fields: "firmware_version, test_profile, interface, performance_metric, threshold, result, duration, power_or_energy, disposition"
      collection_method: "Link automated or controlled manual tests to configuration and accepted mass"
      unit: "Declared technical unit, seconds, kWh"
      frequency: "Each unit or justified sampling plan"
      temporal_coverage: "Same production period"
      site_scope: "Each test route"
      aggregation_rule: "Report pass, rework and scrap populations separately"
      quality_evidence: "Test procedure, calibration, test log, disposition"
    - protocol_id: cp_packaging
      process_id: "receipt_and_dispatch"
      flow_role: "Packaging"
      record_type: "Packaging specification and stock balance"
      raw_fields: "material, item_mass, item_count, recycled_content, reusable_cycles, issued, wasted, destination"
      collection_method: "Weigh representative items and reconcile purchased/issued quantities"
      unit: "kg"
      frequency: "Packaging change or monthly"
      temporal_coverage: "Full reporting period"
      site_scope: "Each dispatch site"
      aggregation_rule: "Sum by material and reusable-use basis; never add to net card mass"
      quality_evidence: "Packaging specification, scale record, stock ledger"
    - protocol_id: cp_allocation_drivers
      process_id: "shared_operations"
      flow_role: "Allocation"
      record_type: "Meter, MES and accounting records"
      raw_fields: "shared_resource, total_quantity, product_quantity, driver, driver_total, rationale"
      collection_method: "Select and document a physical causal driver before allocation"
      unit: "Native driver unit"
      frequency: "Each reporting period"
      temporal_coverage: "Same as shared activity"
      site_scope: "Each shared process/site"
      aggregation_rule: "Allocated amount equals shared total multiplied by product driver share"
      quality_evidence: "Driver study, meter/tool logs, allocation calculation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized_amount = reporting_period_amount / accepted_net_card_mass_kg"
      inputs:
        - "Reporting-period amount"
        - "accepted net card mass"
      output: "Amount per 1 kg reference flow"
      source_ids:
        - tiangong-flow-verification-2026
    - id: calc_layer_mass_reconciliation
      applies_to: "Product-specific BOM"
      rule: "residual_support_mass = measured_net_card_mass - sum(primary_chip_package, pcb, memory, cooling, interface); investigate a negative or unexplained residual before use"
      inputs:
        - "Measured card mass"
        - "separately measured required layers"
      output: "Disclosed support-component mass and reconciliation difference"
      source_ids:
        - mass-balance-identity
    - id: calc_count_to_mass
      applies_to: "Count-based parts"
      rule: "part_mass = accepted_part_count * configuration_specific_unit_mass; use sampled weighing only with documented sample size and variability"
      inputs:
        - Count
        - "unit mass"
      output: "Part mass in kg"
      source_ids:
        - mass-balance-identity
    - id: calc_area_to_pcb_mass
      applies_to: "PCB recorded by area"
      rule: "pcb_mass = accepted_board_area * measured_areal_mass; retain layer count, thickness and finish"
      inputs:
        - "Accepted area"
        - "design-specific areal mass"
      output: "PCB mass in kg"
      source_ids:
        - mass-balance-identity
    - id: calc_energy_from_load_time
      applies_to: "Unmetered tool energy"
      rule: "energy = measured_average_load * operating_time; reconcile tool totals to the parent meter and allocate standby explicitly"
      inputs:
        - Load
        - time
        - "parent meter"
      output: "Energy by carrier"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_stock_balance
      applies_to: "Process materials and packaging"
      rule: "consumed = opening_stock + purchases + inbound_transfers - closing_stock - returns - outbound_transfers - recovered_for_reuse"
      inputs:
        - "Stock and transaction records"
      output: "Process consumption"
      source_ids:
        - mass-balance-identity
    - id: calc_yield
      applies_to: "Each process"
      rule: "mass_yield = accepted_output_mass / total_input_mass_of_corresponding_product_material; report count yield separately where relevant"
      inputs:
        - Input
        - "accepted output"
        - rejects
      output: "Mass yield and count yield"
      source_ids:
        - mass-balance-identity
    - id: calc_shared_allocation
      applies_to: "Shared activity"
      rule: "allocated_amount = shared_amount * product_driver / sum(all_product_drivers)"
      inputs:
        - "Shared amount"
        - "causal driver values"
      output: "Allocated foreground amount"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_configuration_specificity
      applies_to: "Reference product and BOM"
      requirement: "Identify card type, configuration, chip/package, PCB, memory, cooling and interfaces at the granularity used for inventory; generic leaf averages are unacceptable."
      evidence: "BOM revision, product specification, configuration list"
    - id: dq_technological_representativeness
      applies_to: "Upstream component datasets"
      requirement: "Match semiconductor technology/package, PCB construction, memory technology, cooling design and connector/module type; disclose every proxy by layer."
      evidence: "Supplier declaration, dataset metadata, proxy justification"
    - id: dq_geographical_representativeness
      applies_to: "Manufacturing and upstream electricity"
      requirement: "Use the actual site and electricity-supply geography where known; disclose supplier-location uncertainty."
      evidence: "Site records, supplier/site metadata, electricity contract"
    - id: dq_temporal_representativeness
      applies_to: "Foreground records"
      requirement: "Use one coherent recent production period and align BOM, energy, yield, waste and test populations."
      evidence: "Reporting-period ledger and reconciliation"
    - id: dq_completeness
      applies_to: "All required processes and layers"
      requirement: "Account for every required component layer, required process, conditional controlled process, energy carrier, material waste, wastewater and direct release; document justified zeroes and exclusions."
      evidence: "Completeness matrix and signed review"
    - id: dq_mass_balance
      applies_to: "Product layers and each process"
      requirement: "Reconcile input, output, waste, rework and inventory change. Investigate unexplained differences rather than assigning them silently to support components."
      evidence: "Mass-balance worksheet and variance disposition"
    - id: dq_measurement_quality
      applies_to: "Mass, energy, water and emissions"
      requirement: "Record instrument, calibration, sampling, detection limit, conversion and uncertainty appropriate to each record."
      evidence: "Calibration and sampling records"
    - id: dq_supplier_evidence
      applies_to: "Purchased components"
      requirement: "Prefer part-specific material declarations and upstream datasets. A declaration supplies composition evidence but does not replace manufacturing energy, yield, waste or emission data."
      evidence: "Supplier declaration and separate upstream dataset review"
    - id: dq_no_unreviewed_defaults
      applies_to: "Missing quantitative data"
      requirement: "Do not use a category-wide default or reasoned estimate in a reviewed dataset unless separately approved, labelled replaceable, and supported for the declared card archetype."
      evidence: "Gap register, approval and replacement plan"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Dataset identity"
    rule: "Confirm CPC 3.0 45281, exact reference product UUID, Mass property UUID, Units of mass UUID and kg; reject narrow or broader proxy products."
    source_ids:
      - un-cpc-3-2025
      - tiangong-flow-verification-2026
  - rule_id: validation_qualifiers
    applies_to: "Reference flow"
    rule: "Fail completeness when any required qualifier is absent or when card type, primary function, host interface, configuration, site or reporting period is ambiguous."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: validation_layer_separation
    applies_to: "Bill of materials"
    rule: "Confirm separate chip/package, PCB, memory, cooling, interface and support-component records and a reconciliation to measured net card mass."
    source_ids:
      - itu-t-l1410-2024
      - ipc-1752a-2018
      - mass-balance-identity
  - rule_id: validation_no_leaf_extrapolation
    applies_to: "Representativeness"
    rule: "Reject a claim that one GPU, network, video, sound or accelerator card represents all CPC 45281; validate any family mix against the homogeneity and weighting rules."
    source_ids:
      - un-cpc-3-2025
      - itu-t-l1410-2024
  - rule_id: validation_boundary_control
    applies_to: "Conditional fabrication"
    rule: "Verify operational control evidence for foreground bare-PCB or semiconductor/package fabrication; otherwise require supplier upstream links and exclude invented foreground inventories."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_process_completeness
