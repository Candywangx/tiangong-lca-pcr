system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "All datasets"
      rule: "Include receipt, kitting, assembly, thermal/mechanical/interface integration, firmware loading, test, rework, acceptance, internal handling, and dispatch activities required to produce the accepted card at the factory gate."
      source_ids:
        - itu-t-l1410-2024
        - eu-pef-2021-2279
    - rule_id: boundary_component_hierarchy
      applies_to: "Bill of materials and upstream links"
      rule: "Keep primary chip/package, PCB, onboard memory, cooling, interface and support-component layers distinct. Report layer mass and data source; no generic electronic-part total may replace them."
      source_ids:
        - itu-t-l1410-2024
        - ipc-1752a-2018
        - iec-62474-2018
    - rule_id: boundary_controlled_fabrication
      applies_to: "Bare-PCB and semiconductor/package fabrication"
      rule: "Include these as foreground only where the reporting organization has operational control and site records. Otherwise use supplier-specific upstream product datasets and do not invent wafer-fab or PCB-fab inventories."
      source_ids:
        - itu-t-l1410-2024
        - eu-pef-2021-2279
    - rule_id: boundary_transport_packaging
      applies_to: "Inbound transport and dispatch packaging"
      rule: "Include inbound transport and packaging production or use as separate flows. Exclude detachable packaging from the 1 kg reference product mass while retaining its inventory burden."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_use_eol
      applies_to: "Use, maintenance, reuse, recycling and disposal"
      rule: "Exclude from this cradle-to-gate package. A downstream lifecycle model may add them only with card-type-specific power, workload, lifetime, replacement and end-of-life scenarios."
      source_ids:
        - itu-t-l1410-2024
    - rule_id: boundary_no_proxy
      applies_to: "Classification and representative product"
      rule: "Do not substitute a bare IC, bare PCB, complete computer/server, hub/router/gateway, external peripheral, or a single GPU/network/video/sound card for this category."
      source_ids:
        - un-cpc-3-2025
