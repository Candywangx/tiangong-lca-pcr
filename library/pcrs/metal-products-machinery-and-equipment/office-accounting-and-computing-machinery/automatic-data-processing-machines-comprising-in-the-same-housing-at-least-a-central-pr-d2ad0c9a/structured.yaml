    used_for: "Stationary desktop, integrated desktop and workstation distinctions; CPU, memory, graphics and storage configuration; power modes, power measurement, PSU information and manufacturer disclosure"
  - id: "eu-regulation-2019-424"
    type: "standard"
    reference: "European Commission, *Commission Regulation (EU) 2019/424 laying down ecodesign requirements for servers and data storage products*, consolidated official text, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019R0424 (retrieved 2026-08-09; used as technical definition and measurement evidence, not as a statement of current applicability in every market)"
    used_for: "Server and multi-node boundary definitions; CPU, memory, storage, I/O, PSU, configuration-family, idle and active power, operating-condition and testing disclosure; external cooling relevance; repair, upgrade, data deletion, critical-component and end-of-life information"
