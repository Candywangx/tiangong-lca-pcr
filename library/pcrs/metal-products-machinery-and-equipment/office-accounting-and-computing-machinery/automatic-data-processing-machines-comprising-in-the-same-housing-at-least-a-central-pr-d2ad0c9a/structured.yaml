measurement_rules:
  - id: reference_mass
    applies_to: "Finished reference machine"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the released configured machine including components installed inside the declared housing. Exclude detachable transport packaging, separately shipped display, keyboard, mouse, cables, rack, external UPS and other peripherals unless physically integrated and declared within the product boundary."
  - id: device_count_mass
    applies_to: "Machine count and mass conversion"
    required_property_ref:
      name: "Mass and number of items"
      uuid: ""
    required_unit: "kg and item"
    rule: "Record both net mass per machine and machine count for the same configuration and lot. Convert item records to kg only from verified configuration-specific mass; do not apply a generic computer or server mass factor."
  - id: configuration_identity
    applies_to: "CPU, accelerators, memory, storage, built-in I/O and cooling"
    required_property_ref:
      name: "Configuration-specific counts and capacities"
      uuid: ""
    required_unit: "item; socket; core; GB; TB; W as applicable"
    rule: "Preserve the as-built configuration linked to the BOM and serial or lot record. Do not combine configuration variants whose component population or power behaviour materially differs without declared production-weighted shares."
  - id: energy_preservation
    applies_to: "Assembly, test, use and maintenance energy"
    required_property_ref:
      name: "Energy and power"
      uuid: ""
    required_unit: "kWh; W; native fuel or thermal-energy unit retained"
    rule: "Preserve electricity, fuels, heat and cooling carriers separately. Convert measured power and time to electricity using kWh = W x hours / 1000. Do not treat rated PSU power, thermal design power or nameplate power as measured device energy."
  - id: operating_mode_power
    applies_to: "Device use electricity"
    required_property_ref:
      name: "Power and time"
      uuid: ""
    required_unit: "W and h"
    rule: "Record measured power for the declared active workload, idle, sleep or alternative low-power, and off states that occur in the use scenario, together with test method, settings, peripherals, network state and measurement uncertainty. Use only modes applicable to the represented machine."
  - id: cooling_boundary
    applies_to: "Internal and external cooling"
    required_property_ref:
      name: "Electricity, heat or cooling service"
      uuid: ""
    required_unit: "kWh; MJ; other metered cooling-service unit"
    rule: "Internal fans, pumps and integrated cooling controls are part of measured device power. External room, rack or data-centre cooling shall be a separate conditional burden based on measured facility records and a disclosed causal allocation; it shall not be embedded again in device power."
  - id: service_life
    applies_to: "Use, maintenance and result interpretation"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "year; operating hour"
    rule: "State expected operating lifetime, evidence basis, operating hours, workload evolution, downtime, repairs and refurbishment. Do not infer lifetime from warranty or depreciation alone when actual-use or fleet-retirement evidence is available."
  - id: packaging_boundary
    applies_to: "Packaging and in-box accessories"
    required_property_ref:
      name: "Mass and item count"
      uuid: ""
    required_unit: "kg and item"
    rule: "Keep detachable packaging and separately delivered accessories outside reference-product mass and inventory them separately. An integrated display, built-in input unit or permanently installed cable remains inside the machine boundary when part of the as-built configuration."
