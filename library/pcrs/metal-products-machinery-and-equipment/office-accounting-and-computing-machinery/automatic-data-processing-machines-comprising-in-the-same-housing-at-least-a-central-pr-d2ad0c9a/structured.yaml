  classification_refs: "CPC 3.0 45230 exact mapping context"
  covered_products: "Complete single-enclosure servers, workstations, stationary desktop computers, integrated desktop or all-in-one computers, and comparable one-housing automatic data processing machines containing at least a CPU and an input/output unit"
  excluded_products: "Portable computers and mobile workstations; multi-machine systems; blade or multi-node shared enclosures; clusters and rack-scale systems; standalone storage, input, output, display, or peripheral units; parts; embedded dedicated equipment; computing services"
  representative_product: "One operational, configured and production-tested automatic data processing machine in a single declared housing at the producer gate"
  production_route: "Supplier component and subassembly production; receipt and BOM reconciliation; system assembly and integration; firmware and software configuration; production testing; optional packaging and downstream life-cycle stages"
  market_state: "Finished configured equipment, manufactured and production-tested, before detachable transport packaging unless packaging is separately declared"
functional_unit:
  what: "Manufacture of a finished, configured automatic data processing machine within the covered single-housing boundary; downstream projections may extend this machine through its declared operating lifetime"
  how_much: "1 kg net mass of the finished machine at the producer gate, excluding detachable packaging and separately delivered peripherals"
  how_well: "Operational and released after the declared production tests, with machine type, chassis, CPU/accelerator, memory, storage, built-in I/O, power supply, internal cooling and integrated-device configuration declared"
  how_long_or_cycle: "One represented production period or batch at the producer gate; any use-stage projection shall additionally state expected operating lifetime, annual operating schedule, workload and maintenance scenario"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: boundary_configuration
      applies_to: "Product identity and all processes"
      rule: "Model one homogeneous as-built configuration or a transparently weighted configuration mix. The BOM, device mass, power tests, production tests, use profile and lifetime shall refer to the same configuration or to explicitly reconciled configuration shares."
      source_ids:
        - itu-t-l1410-2024
        - energy-star-computers-v8-2022
        - eu-regulation-2019-424
    - rule_id: boundary_component_supply
      applies_to: "Upstream component production"
      rule: "Include the CPU and other processors, accelerators, memory, storage, motherboard and printed circuit assemblies, power supplies, chassis and mechanical parts, built-in I/O and networking, internal cooling, integrated display or input equipment, wiring and other installed parts through linked upstream datasets. Do not treat missing supplier data as zero."
      source_ids:
        - itu-t-l1410-2024
    - rule_id: boundary_assembly_test
      applies_to: "Producer foreground"
      rule: "Include component receiving and internal transport, system assembly, fastening and interconnection, firmware loading, configuration, functional and safety tests, burn-in when performed, test failures and rework, direct materials, electricity, utilities, wastes and on-site treatment attributable to the represented production."
      source_ids:
        - itu-t-l1410-2024
        - energy-star-computers-v8-2022
        - eu-regulation-2019-424
    - rule_id: boundary_packaging_distribution
      applies_to: "Post-test logistics"
      rule: "Record detachable packaging and in-box accessories separately. Include outbound distribution only when the study boundary extends beyond the producer gate, with origin, destination, transport mode, load factor and distance declared."
      source_ids:
        - itu-t-l1410-2024
    - rule_id: boundary_use_and_cooling
      applies_to: "Use-stage projections"
      rule: "Include measured or reproducibly calculated device electricity for the declared workload and operating modes over the expected lifetime. Include external facility cooling only when within study scope and causally allocated; keep internal cooling inside device power and prevent double counting."
      source_ids:
        - itu-t-l1410-2024
        - energy-star-computers-v8-2022
        - eu-regulation-617-2013
        - eu-regulation-2019-424
    - rule_id: boundary_maintenance_eol
      applies_to: "Full life-cycle projections"
      rule: "Include replacement parts, repair and refurbishment that occur in the declared lifetime, and applicable collection, preparation for reuse, dismantling, recycling and disposal at end of life. State the boundary between first use, refurbishment and any second life."
      source_ids:
        - itu-t-l1410-2024
        - eu-regulation-2019-424
    - rule_id: boundary_scope_exclusions
      applies_to: "Category separation"
      rule: "Exclude and separately model portable computers, mobile workstations, blade or multi-node shared enclosures, clusters, rack-scale or system-form deliveries, standalone storage or peripheral units, facility racks, UPS, network infrastructure and computing services. A single-machine record shall not stand in for any excluded system."
      source_ids:
        - energy-star-computers-v8-2022
        - eu-regulation-2019-424
boundary_abstraction:
  declared_starting_condition: "Received configuration-specific components, subassemblies and direct materials identified by the as-built BOM at the system assembly site"
  starting_condition_role: "Physical foreground starting point for assembly and testing; component manufacture remains upstream and shall be represented by supplier-specific or reviewed secondary datasets"
  product_classification_scope: "One complete CPC 45230 single-housing automatic data processing machine, not a portable computer, component, peripheral, storage unit, multi-node enclosure or system-form delivery"
  recursive_input_rule: "A purchased complete machine in the same category shall be recorded as a separate upstream product input with its configuration, quantity and dataset; do not reopen it into the current assembly BOM and double count its burdens"
  upstream_dataset_requirement: "Every material component or subassembly group in the BOM shall link to supplier-specific data or an explicitly disclosed secondary proxy matching technology, geography, time and component function as closely as available"
  disclosure: "Declare machine type and configuration, included housing and accessories, component-data coverage, assembly and test sites, packaging and distribution scope, use and cooling scenario, maintenance, expected lifetime, end-of-life route, cut-offs, allocation and every proxy"
