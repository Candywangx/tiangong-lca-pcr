allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Mixed models, configurations and shared lines"
    rule: "Prefer separate BOMs, batches, meters and test records for each materially different configuration. Apply allocation only after practical subdivision and direct assignment have been attempted."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: allocation_shared_facility
    applies_to: "Assembly, test, HVAC and facility utilities"
    rule: "Allocate unmetered shared burdens using the closest causal driver, such as equipment meter readings, line or test-station time, measured load, occupied area-time, airflow or cooling load, and report shares that sum to one. Production mass is a fallback only when causally defensible."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: allocation_multi_output
    applies_to: "Co-produced saleable products and recovered outputs"
    rule: "Use a demonstrated physical causal relationship when subdivision is unavailable. Economic allocation may be used only when no defensible physical relationship exists and shall disclose prices, period, currency, shares and sensitivity. Waste with no intended product function receives no production burden as a co-product."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: allocation_recycling
    applies_to: "Reuse, refurbishment, recycling and recovered materials"
    rule: "State the selected recycled-content, cut-off, substitution or other allocation approach and apply it consistently. Never combine approaches or grant an avoided-burden credit implicitly; keep gross waste and recovered-output quantities visible."
    source_ids:
      - itu-t-l1410-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_configuration_bom
      process_id: "bom_upstream_assembly_integration"
      flow_role: "Product identity, as-built BOM and component kit"
      record_type: "Product lifecycle management, ERP, supplier specification, serial and weigh record"
      raw_fields: "model; configuration id; serial or lot; chassis; machine type; CPU model, sockets and cores; accelerator model and count; memory type and GB; storage type, count and capacity; built-in I/O and network interfaces; PSU type, count and rating; cooling equipment; integrated display or input; component part number; supplier; mass; count; upstream dataset; proxy"
      collection_method: "Export the released as-built BOM, reconcile it to installed serial or lot records, and verify masses by supplier data or representative weighing"
      unit: "kg; item; socket; core; GB; TB; W"
      frequency: "Every released configuration and BOM revision"
      temporal_coverage: "Full represented production period"
      site_scope: "All included component supply and assembly sites"
      aggregation_rule: "Sum component mass and counts by homogeneous configuration; retain configuration shares and upstream dataset links by BOM line"
      quality_evidence: "Released BOM, change-control record, supplier specification, scale record, serial genealogy and proxy review"
    - protocol_id: cp_material_energy_waste
      process_id: "bom_upstream_assembly_integration"
      flow_role: "Direct materials, assembly utilities and waste"
      record_type: "Meter, invoice, stock, batch, equipment and waste-transfer record"
      raw_fields: "carrier or material; opening and closing stock or meter; purchase or generated quantity; equipment or line; operating time; batch; configuration; allocation driver; waste type; gross mass; destination"
      collection_method: "Use dedicated meters and material issues first; otherwise reconcile facility totals and apply documented causal allocation"
      unit: "kWh; MJ; kg; native carrier unit"
      frequency: "Meter interval, material issue and every waste transfer"
      temporal_coverage: "Full production period; continuous sites should normally cover 12 months or justify a shorter campaign"
      site_scope: "All included assembly buildings, lines and waste points"
      aggregation_rule: "Preserve carriers and material identities; sum gross inputs and wastes by process and configuration before normalization"
      quality_evidence: "Calibration, invoice reconciliation, stock variance, equipment log, waste ticket and allocation workbook"
    - protocol_id: cp_assembly_test_yield
      process_id: "assembly_integration_configuration_testing"
      flow_role: "Assembly output, firmware state, production test, burn-in, release and failures"
      record_type: "Manufacturing execution system, test-station export, quality and rework record"
      raw_fields: "configuration id; serial; firmware and OS image; assembly start and finish; test method; workload; settings; mode power where measured; test duration; burn-in duration; pass or fail; defect; rework; released mass; reject mass"
      collection_method: "Link assembly and test records by serial or homogeneous lot; meter test-station electricity and retain test procedure and calibration"
      unit: "kg; item; kWh; W; h"
      frequency: "Every unit or statistically controlled lot, with coverage declared"
      temporal_coverage: "Full represented production period"
      site_scope: "All assembly, configuration, test and rework stations"
      aggregation_rule: "Count and mass-balance passed, reworked and rejected units by configuration; sum test energy and normalize to released mass"
      quality_evidence: "Test report, calibrated instrument record, firmware checksum, quality release, rework log and yield reconciliation"
    - protocol_id: cp_packaging
      process_id: "configuration_testing"
      flow_role: "Detachable packaging and accessories"
      record_type: "Packaging BOM, issue, return and sample-weigh record"
      raw_fields: "article; material; mass per item; issued count; return count; reusable trips; recycled content; accessory identity; destination configuration"
      collection_method: "Weigh representative articles and reconcile issue and return counts to released units"
      unit: "kg; item; trip"
      frequency: "Each packaging specification and production lot"
      temporal_coverage: "Full represented production period"
      site_scope: "All producer-gate packaging operations"
      aggregation_rule: "Multiply verified mass per item by net issued count; keep accessories and packaging separate from machine mass"
      quality_evidence: "Packaging specification, sample weighing, stock reconciliation and return log"
    - protocol_id: cp_use_lifetime
      process_id: "use_maintenance"
      flow_role: "Power modes, workload, operating schedule, lifetime, repairs and removed parts"
      record_type: "Laboratory power test, fleet telemetry, energy meter, asset, retirement and service record"
      raw_fields: "configuration; firmware and settings; test method; voltage and frequency; active workload; active, idle, sleep, low-power and off W; uncertainty; annual mode hours; network state; internal cooling state; expected and observed lifetime; downtime; repair event; replacement part; removed mass"
      collection_method: "Prefer calibrated configuration-specific measurements and observed fleet schedules and retirement data; document scenario construction and sensitivity when records are incomplete"
      unit: "W; h/year; kWh; year; kg; item"
      frequency: "Each configuration test and each fleet reporting interval or service event"
      temporal_coverage: "Representative use period and complete observed lifetime where available"
      site_scope: "Declared user sites or use geography"
      aggregation_rule: "Calculate mode-weighted electricity; aggregate only comparable workload and settings; retain lifetime distribution and repairs by configuration"
      quality_evidence: "Test report, meter calibration, telemetry coverage, asset register, retirement reason and service ticket"
    - protocol_id: cp_external_cooling
      process_id: "use_maintenance"
      flow_role: "External room, rack or data-centre cooling"
      record_type: "Facility electricity, cooling meter, environmental-control and IT-load record"
      raw_fields: "cooling carrier; facility cooling energy; IT energy; device or rack load; temperature; humidity; interval; allocation boundary; driver; share; excluded internal cooling"
      collection_method: "Use measured cooling and IT loads for matching intervals; allocate with a physical driver and document whether UPS or other infrastructure is separate"
      unit: "kWh; MJ; cooling-service unit; %"
      frequency: "Meter interval"
      temporal_coverage: "Same representative period as device-use records"
      site_scope: "Only facilities included in the declared use boundary"
      aggregation_rule: "Assign gross external cooling using the declared causal share; never add internal fan or pump electricity a second time"
      quality_evidence: "Calibrated meters, building-management export, matching timestamps, allocation workbook and boundary diagram"
    - protocol_id: cp_end_of_life
      process_id: "end_of_life"
      flow_role: "Reuse, refurbishment, dismantling, recovery and disposal"
      record_type: "Asset disposition, recycler, weighbridge and treatment record"
      raw_fields: "configuration or equipment class; collected mass and count; direct reuse; refurbishment; dismantled component; recovered material; residue; destination; treatment; data-deletion route; allocation approach"
      collection_method: "Reconcile asset disposition and recycler outputs for the declared route; use scenario evidence only when foreground treatment records are unavailable and disclose it"
      unit: "kg; item; % route share"
      frequency: "Every shipment or treatment batch; scenario review at study update"
      temporal_coverage: "Declared end-of-life reference period"
      site_scope: "All included collection and treatment routes"
      aggregation_rule: "Route shares sum to one; reconcile incoming mass to reuse, recovered outputs, residues and disclosed balance residual"
      quality_evidence: "Transfer note, certified recycler report, scale ticket, dismantling record, data-deletion evidence and mass balance"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Released reference product"
      rule: "Net machine mass = gross weighed release unit - detachable packaging - separately delivered accessories and peripherals. Integrated display, built-in I/O and internal cooling remain included."
      inputs:
        - cp_configuration_bom
        - cp_packaging
        - cp_assembly_test_yield
      output: "kg net machine and item/kg"
      source_ids:
        - itu-t-l1410-2024
    - id: calc_bom_balance
      applies_to: "As-built configuration"
      rule: "Reconcile installed component and direct-material mass to assembled and released mass + producer waste + measured stock change + disclosed residual. Report the residual and its investigation."
      inputs:
        - cp_configuration_bom
        - cp_material_energy_waste
        - cp_assembly_test_yield
      output: "kg and mass-balance residual %"
      source_ids:
        - itu-t-l1410-2024
    - id: calc_inventory_normalization
      applies_to: "Every production inventory row"
      rule: "Normalized amount = configuration-specific gross amount assigned to released units / net released machine mass for the same batch or represented period."
      inputs:
        - "Applicable collection protocol"
        - cp_assembly_test_yield
      output: "amount per kg reference product"
      source_ids: []
    - id: calc_test_yield
      applies_to: "Assembly and test"
      rule: "First-pass yield = units passing without rework / units tested; final release yield = released units / units entering test. Report rework and rejects separately and never use yield to net waste from input."
      inputs:
        - cp_assembly_test_yield
      output: "% yield, item and kg rejects"
      source_ids: []
    - id: calc_use_electricity
      applies_to: "Declared use scenario"
      rule: "Lifetime device electricity = sum over applicable modes of measured mode power W x hours in that mode / 1000, repeated over the declared lifetime. Preserve yearly values where workload or settings change."
      inputs:
        - cp_use_lifetime
      output: "kWh per machine lifetime and kWh/kg reference product"
      source_ids:
        - energy-star-computers-v8-2022
        - eu-regulation-617-2013
        - eu-regulation-2019-424
    - id: calc_external_cooling
      applies_to: "External facility cooling"
      rule: "Allocated external cooling = measured facility cooling for matching interval x declared causal allocation share. Report the driver and sensitivity; exclude internal fans and pumps already captured in device power."
      inputs:
        - cp_external_cooling
        - cp_use_lifetime
      output: "kWh or MJ per machine lifetime and per kg reference product"
      source_ids:
        - itu-t-l1410-2024
        - eu-regulation-2019-424
    - id: calc_lifetime_results
      applies_to: "Result interpretation"
      rule: "Lifetime-normalized result = total burden over declared first life / declared operating years; any second life or refurbishment shall use a separately stated boundary and allocation rather than silently extending the first-life denominator."
      inputs:
        - cp_use_lifetime
        - cp_end_of_life
      output: "burden per operating year and per declared lifetime"
      source_ids:
        - itu-t-l1410-2024
    - id: calc_eol_balance
      applies_to: "End-of-life"
      rule: "Reconcile collected used-machine mass = direct reuse + refurbishment input + recovered material outputs + treatment residues + measured stock change + disclosed residual; route shares shall sum to one."
      inputs:
        - cp_end_of_life
      output: "kg, route shares and residual %"
      source_ids:
        - itu-t-l1410-2024
  data_quality_requirements:
    - id: dq_configuration_traceability
      applies_to: "Product and BOM"
      requirement: "Every result shall trace to a model or configuration id and BOM revision that identifies CPU/accelerators, memory, storage, I/O, power, cooling and integrated devices."
      evidence: "Released BOM, serial genealogy, configuration record and change control"
    - id: dq_measurement
      applies_to: "Mass, power, energy and waste"
      requirement: "Use calibrated or verified instruments suitable for the measured range. Retain raw readings, conversions, uncertainty, allocation and reconciliation residuals."
      evidence: "Calibration certificate, meter export, scale check, test report and calculation workbook"
    - id: dq_temporal
      applies_to: "Foreground production and use"
      requirement: "Cover the complete represented production period and all material routes. Continuous production should normally cover 12 consecutive months; shorter campaigns shall disclose seasonality, start-up and utilisation limitations."
      evidence: "Dated production, meter, purchase, test, shipment and maintenance records"
    - id: dq_component_coverage
      applies_to: "Upstream inventory"
      requirement: "Provide upstream datasets for all material BOM groups and disclose supplier-data coverage by mass and by environmentally relevant component class. Missing semiconductor, display, battery or precious-metal-bearing components shall not be justified by mass cut-off alone."
      evidence: "BOM-to-dataset matrix, supplier data, proxy assessment and cut-off register"
    - id: dq_power_profile
      applies_to: "Use electricity"
      requirement: "Power measurements and hours shall refer to the same configuration, firmware, settings, workload, voltage, network and internal-cooling state. Rated power is not acceptable as measured consumption."
      evidence: "Test method, test report, telemetry, workload definition and uncertainty record"
    - id: dq_lifetime_representativeness
      applies_to: "Expected lifetime and maintenance"
      requirement: "Prefer actual fleet retirement and service evidence for comparable machines. Report source, sample size, distribution or scenario, excluded storage time, repair and refurbishment assumptions, and sensitivity."
      evidence: "Asset register, retirement and service records, survey or reviewed statistics"
    - id: dq_boundary_completeness
      applies_to: "Full inventory"
      requirement: "Quantify every required process and applicable conditional stage, or explicitly justify omission. Keep production testing, packaging, use electricity, external cooling, maintenance and end-of-life distinct."
      evidence: "Process map, boundary diagram, omission register and reviewer sign-off"
    - id: dq_proxy_disclosure
      applies_to: "Secondary data"
      requirement: "Match component technology, geography, production period and function as closely as available. State every proxy and expected direction of bias; do not use another computer PCR as component evidence."
      evidence: "Dataset metadata and documented proxy assessment"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Product scope"
    rule: "Fail when the dataset does not identify one complete single-housing machine with at least a CPU and I/O, or when a portable computer, component, peripheral, standalone storage unit, multi-node enclosure, system-form delivery or computing service is mixed into the reference product."
    source_ids:
      - energy-star-computers-v8-2022
      - eu-regulation-2019-424
  - rule_id: validation_reference_flow
    applies_to: "Reference product"
    rule: "Fail when the reference flow is not UUID 3c41eabb-f2b2-4e96-b24d-3485673d505f with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, or when detachable packaging or separate peripherals are included in reference mass."
    source_ids: []
  - rule_id: validation_configuration
    applies_to: "Required qualifiers"
    rule: "Fail when machine type/configuration, CPU/accelerators, memory, storage, built-in I/O, power supply, internal cooling, integrated devices, net mass per item, production test, power-test conditions or expected lifetime is missing."
    source_ids:
      - itu-t-l1410-2024
      - energy-star-computers-v8-2022
      - eu-regulation-2019-424
  - rule_id: validation_bom_upstream
    applies_to: "BOM and component supply"
    rule: "Fail when any material component group lacks mass or count and an upstream dataset or disclosed proxy, when BOM revision and configuration are not linked, or when significant electronic components are removed only by a mass cut-off."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: validation_assembly_test
    applies_to: "Producer foreground"
    rule: "Fail when assembly, firmware configuration, functional test, burn-in when performed, rework, release yield, test electricity or producer waste is omitted or not assigned to the represented configuration."
    source_ids:
      - itu-t-l1410-2024
      - energy-star-computers-v8-2022
      - eu-regulation-2019-424
  - rule_id: validation_mass_balance
    applies_to: "Production and end-of-life"
    rule: "Fail when the BOM-to-release or end-of-life mass balance cannot be reproduced, gross rejects and recovered outputs are netted, or an unexplained residual is omitted."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: validation_use_energy
    applies_to: "Use-stage electricity"
    rule: "Fail when use electricity relies only on PSU rating, TDP or nameplate values; when power and hours refer to different configurations or settings; or when operating modes, workload, voltage, test method and expected lifetime are not disclosed."
    source_ids:
      - energy-star-computers-v8-2022
      - eu-regulation-617-2013
      - eu-regulation-2019-424
  - rule_id: validation_cooling
    applies_to: "Cooling"
    rule: "Fail when internal cooling energy is added outside measured device power, when external facility cooling is included without a declared boundary and causal allocation, or when cooling and device electricity are double counted."
    source_ids:
      - itu-t-l1410-2024
      - eu-regulation-2019-424
  - rule_id: validation_lifetime
    applies_to: "Lifetime and maintenance"
    rule: "Fail when use-stage results lack an expected operating lifetime and evidence basis, when storage time is counted as operation, or when repair, refurbishment and second life are silently merged into the first-life boundary."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: validation_allocation
    applies_to: "Shared operations and recovered outputs"
    rule: "Fail when practical subdivision was skipped, shares do not sum to one, the allocation driver is unrelated to burden causation, economic allocation lacks price basis and sensitivity, or recycling credits are implicit."
    source_ids:
      - itu-t-l1410-2024
  - rule_id: validation_no_system_proxy
    applies_to: "Downstream use"
    rule: "Fail any claim that a one-machine result represents a rack, cluster, data centre, multi-machine system, cloud or computing service without separately modelled quantities, infrastructure, networking, cooling and allocation."
    source_ids:
      - itu-t-l1410-2024
      - eu-regulation-2019-424
published_dataset_profile:
  dataset_role: "Configuration-specific foreground producer-gate data package for one complete single-housing automatic data processing machine, with optional separately reported downstream modules"
  downstream_use: "May be published as a secondary_dataset or background_dataset for equipment manufacturing and may support downstream process and lifecyclemodel projections when configuration, use, cooling, lifetime and end-of-life assumptions are compatible"
  allowed_use: "Product footprinting, supply-chain inventory, procurement comparison within functionally comparable configurations, manufacturing improvement, and equipment-level life-cycle modelling with representative geography, technology and use scenario"
  excluded_use: "Portable computers; components or peripherals; standalone storage; multi-node enclosures; system-form delivery; automatic substitution across servers, workstations and desktops; representing racks, clusters, data centres, cloud or computing services from one-machine results"
  required_metadata: "PCR id and version; CPC context; machine type; manufacturer/model/configuration; chassis boundary; net mass and count; CPU/accelerator, memory, storage, I/O, power and cooling configuration; integrated devices; BOM revision and upstream coverage; assembly/test site, route and period; firmware and test profile; packaging; allocation; power modes, workload and test method; external cooling boundary; expected lifetime; maintenance; end-of-life; proxies and cut-offs"
  required_quality_disclosure: "Primary-data share; BOM and upstream dataset coverage; geographic, temporal and technological representativeness; instrument calibration and uncertainty; production and test yield; mass-balance residuals; shared-facility allocation; power-profile coverage; cooling allocation; lifetime evidence; repair and end-of-life evidence; proxy limitations; shared legacy-alias integration blocker"
  update_trigger: "Change in chassis or machine type, CPU or accelerator, memory, storage, built-in I/O, PSU or cooling architecture, integrated display or input, BOM or supplier route, assembly/test site, firmware or power management, workload, packaging, allocation, expected lifetime, maintenance, end-of-life, reference UUID or resolution of the shared alias conflict"
