measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure accepted net product mass without transport packaging. If a packaged reference state is required, report product and packaging masses separately and keep the reference amount tied to net product mass."
  - id: count_to_mass
    applies_to: "item-count production records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert accepted and rejected item counts with measured configuration-specific mass per item from the same reporting period; do not use nominal catalogue mass when measured lot mass is available."
  - id: functional_capacity
    applies_to: "product identity and test results"
    required_property_ref:
      name: "Family-specific native capacity"
      uuid: ""
    required_unit: "declared native unit"
    rule: "State the equipment-family function and its native rating or throughput test. Do not aggregate different equipment families by an invented common capacity factor; route a non-equivalent or ambiguous unit to manual_review."
  - id: power_and_energy
    applies_to: "production tests and any use-stage extension"
    required_property_ref:
      name: "Energy and power"
      uuid: ""
    required_unit: "kWh and W"
    rule: "Record measured power by supported operating state, workload or capacity setting, test method, and duration. Calculate energy from state-specific power and time; do not fold data-centre cooling, UPS, or other site overhead into device electricity without a separately declared allocation."
  - id: bom_mass_balance
    applies_to: "parts, subassemblies, finished product, rejects, and scrap"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile incoming attributable component mass with accepted product, packaging handled separately, rejects, recoverable scrap, and other wastes over the same lot and reporting period."
  - id: delivery_service
    applies_to: "conditional outbound delivery"
    required_property_ref:
      name: "Transport service and mass"
      uuid: ""
    required_unit: "tonne-km and kg"
    rule: "Record mode, origin, destination, distance, load factor, and shipped mass separately. Delivery is outside the default factory-gate reference flow and shall not be hidden in product mass or manufacturing energy."
