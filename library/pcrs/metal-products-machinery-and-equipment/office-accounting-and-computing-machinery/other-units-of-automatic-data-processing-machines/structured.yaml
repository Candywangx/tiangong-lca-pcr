allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared production and test processes"
    rule: "Avoid allocation by subdividing lines, meters, test benches, and records by configuration or production lot whenever feasible."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: allocation_physical
    applies_to: "shared facility electricity, cooling, warehousing, and assembly support"
    rule: "When subdivision is not feasible, use a causal physical driver. Prefer board area for PCB processes, good die area for integrated-circuit processes, machine time or metered energy for assembly and test, and mass for other components and warehousing."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: allocation_economic_fallback
    applies_to: "shared processes without a defensible physical relationship"
    rule: "Use economic allocation only when a physical relation is insufficient; disclose prices, period, currency, co-products, and a sensitivity check."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: allocation_rework
    applies_to: "rejects and rework"
    rule: "Return successfully reworked units to the originating lot without a second product credit. Assign measured rework inputs and unrecovered reject treatment to the lot that generated them."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: allocation_recycling
    applies_to: "production scrap and recoverable materials"
    rule: "Record scrap mass and treatment output explicitly. Do not apply an avoided-burden or recycling credit inside the foreground inventory unless the downstream study declares and consistently applies a recycling method."
    source_ids:
      - etsi-es-203-199-v1-3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_mass_and_kitting
      process_id: "parts_supply_and_kitting"
      flow_role: "product BOM, receipts, issued kits, and incoming waste"
      record_type: "BOM export; goods receipt; scale record; material disposition"
      raw_fields: "equipment family; product and BOM revision; supplier part id; part category; quantity; measured unit mass; board area; die area where available; storage capacity; interface count; cooling and power configuration; waste mass and route"
      collection_method: "Export controlled BOM, reconcile receipts and line issues, and weigh representative parts and wastes with calibrated scales"
      unit: "kg; item; m2 board; mm2 die; native capacity unit"
      frequency: "each BOM revision and production lot"
      temporal_coverage: "same reporting period as assembly output"
      site_scope: "all sites and suppliers contributing to the declared configuration"
      aggregation_rule: "Sum attributable input and waste by configuration, convert counts with measured unit mass, and normalize to accepted net product mass"
      quality_evidence: "approved BOM; receiving records; calibration certificate; supplier dataset reference; reconciliation report"
    - protocol_id: cp_assembly_energy_and_yield
      process_id: "assembly_and_integration"
      flow_role: "assembly inputs, electricity, auxiliaries, output, and scrap"
      record_type: "line meter; production execution record; issue and return log; waste ticket"
      raw_fields: "line; configuration; start and end meter; output count and mass; machine time; facility cooling and power allocation driver; auxiliary and coolant issue; scrap and route"
      collection_method: "Read dedicated meters where available and document physical allocation of shared facility loads; reconcile material issue, output, returns, and scrap"
      unit: "kWh; kg; item; machine-hour"
      frequency: "per lot with monthly meter reconciliation"
      temporal_coverage: "representative contiguous production period, normally at least one month"
      site_scope: "each assembly site in scope"
      aggregation_rule: "Allocate shared loads with the declared physical driver and normalize net inputs to kg assembled output"
      quality_evidence: "meter calibration; production log; allocation workbook; mass-balance closure; waste receipt"
    - protocol_id: cp_test_configuration_power
      process_id: "functional_test"
      flow_role: "function, capacity, thermal, power, acceptance, and reject records"
      record_type: "test-system export; power analyser; thermal log; rework and disposition log"
      raw_fields: "equipment family; configuration; firmware; native capacity and test method; interface state; cooling state; power mode; workload; W; duration; ambient condition; pass or fail; reject mass and disposition"
      collection_method: "Run the declared acceptance sequence with calibrated instruments and retain mode-time and workload settings"
      unit: "W; kWh; native capacity unit; degree C; kg; item"
      frequency: "each tested lot and configuration"
      temporal_coverage: "same period as reported tested output"
      site_scope: "each test site and bench type in scope"
      aggregation_rule: "Sum state-specific energy, allocate shared bench energy by measured test time, and normalize to accepted tested mass"
      quality_evidence: "test procedure; calibration records; raw result files; pass-fail log; rework closure"
    - protocol_id: cp_packaging_and_warehouse
      process_id: "packaging_and_factory_gate"
      flow_role: "accepted product, packaging, warehouse energy, and packing waste"
      record_type: "dispatch release; packaging issue; scale record; warehouse meter; waste ticket"
      raw_fields: "net product mass; accepted count; packaging material and mass; pallet reuse; meter or allocation driver; released quantity; packing waste and route"
      collection_method: "Reconcile accepted product to dispatch release, weigh packaging by material, and meter or physically allocate warehouse and packing energy"
      unit: "kg; item; kWh"
      frequency: "per lot with monthly reconciliation"
      temporal_coverage: "same reporting period as factory-gate release"
      site_scope: "all packing and warehouse sites in scope"
      aggregation_rule: "Normalize packaging, energy, and waste to 1 kg released net product while retaining packaging separately"
      quality_evidence: "dispatch record; packaging specification; scale and meter calibration; waste receipt"
    - protocol_id: cp_delivery_route
      process_id: "outbound_delivery"
      flow_role: "conditional outbound delivery"
      record_type: "bill of lading; carrier record; dispatch and receipt confirmation"
      raw_fields: "origin; destination; mode; leg distance; net and gross shipped mass; utilization; special handling; delivered mass; loss or damage"
      collection_method: "Capture actual route legs and carrier data; use modelled routes only when flagged as a scenario"
      unit: "kg; tonne-km; km"
      frequency: "each shipment or representative route class"
      temporal_coverage: "declared delivery period"
      site_scope: "all routes included in the extension"
      aggregation_rule: "Calculate tonne-km per leg, sum route results, and keep delivery separate from factory-gate production"
      quality_evidence: "bill of lading; carrier invoice; route evidence; receipt confirmation"
  calculation_rules:
    - id: calc_count_to_mass
      applies_to: "item-based production and reject records"
      rule: "mass = item count multiplied by measured configuration-specific mass per item from the same period"
      inputs:
        - "item count"
        - "measured unit mass"
      output: "kg by flow and configuration"
      source_ids: []
    - id: calc_bom_mass_balance
      applies_to: "parts, product, and waste reconciliation"
      rule: "incoming attributable mass = accepted net product mass + returned material + recoverable scrap + other waste + measured inventory change; investigate and disclose residual imbalance"
      inputs:
        - "BOM and issue mass"
        - "product mass"
        - returns
        - scrap
        - waste
        - "inventory change"
      output: "mass-balance statement and residual"
      source_ids: []
    - id: calc_process_energy
      applies_to: "assembly, testing, warehousing, and packaging"
      rule: "normalized energy = measured dedicated energy plus physically allocated shared energy divided by accepted process output mass"
      inputs:
        - "start and end meters"
        - "shared-load total"
        - "allocation driver"
        - "accepted output mass"
      output: "kWh per kg process output"
      source_ids:
        - etsi-es-203-199-v1-3-1
    - id: calc_power_profile
      applies_to: "device power qualifier and optional use-stage extension"
      rule: "use energy = sum of state-specific power multiplied by time in that state; retain workload, capacity, cooling, and interface settings"
      inputs:
        - "W by state"
        - "hours by state"
        - "workload and configuration"
      output: "kWh for the declared profile"
      source_ids:
        - etsi-es-203-199-v1-3-1
    - id: calc_delivery
      applies_to: "conditional outbound delivery"
      rule: "transport service = sum over route legs of shipped tonnes multiplied by leg kilometres"
      inputs:
        - "shipped mass"
        - distance
        - mode
        - "route leg"
      output: "tonne-km by mode and route"
      source_ids:
        - etsi-es-203-199-v1-3-1
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product identity"
      requirement: "Evidence shall demonstrate one CPC 45289 equipment family and principal function; an ambiguous or multifunction product requires manual_review."
      evidence: "product specification; functional block diagram; classification review against unstats-cpc-3-0-45289"
    - id: dq_configuration
      applies_to: "function and comparability"
      requirement: "Preserve native capacity, test method, firmware, interfaces, PCB and subassembly configuration, incidental storage, power supply, and integrated cooling for each reported configuration."
      evidence: "controlled configuration and test records"
    - id: dq_bom
      applies_to: "product composition"
      requirement: "Cover all applicable electronic, mechanical, cable, power, cooling, storage, interface, auxiliary, and packaging categories, and explain any excluded category."
      evidence: "controlled BOM; supplier datasets; mass-balance reconciliation; etsi-es-203-199-v1-3-1"
    - id: dq_energy
      applies_to: "production and power profile"
      requirement: "Use calibrated measurements where feasible; disclose meter coverage, shared-load allocation, operating state, workload, test duration, and electricity geography."
      evidence: "meter and analyser calibration; raw logs; allocation workbook; etsi-es-203-199-v1-3-1"
    - id: dq_temporal_geographic
      applies_to: "all foreground and upstream data"
      requirement: "State the reporting period, manufacturing sites, supplier geography, electricity geography, and technological representativeness; explain substitutions."
      evidence: "site and supplier records; dataset metadata"
    - id: dq_yield_and_waste
      applies_to: "all production processes"
      requirement: "Reconcile accepted output, rejects, rework, scrap, and waste treatment to the same lot and period without double counting reworked product."
      evidence: "production logs; rework closure; waste receipts; mass balance"
    - id: dq_boundary
      applies_to: "packaging, delivery, cooling, use, and end-of-life"
      requirement: "Disclose whether each boundary element is included and keep any downstream extension separable from the factory-gate result."
      evidence: "boundary statement; process map; route or scenario records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "classification and product name"
    rule: "The product shall match one listed CPC 45289 equipment family and shall not be represented only by the residual title \"other unit\"."
    source_ids:
      - unstats-cpc-3-0-45289
  - rule_id: validate_reference_flow
    applies_to: "quantitative reference"
    rule: "The reference output shall use product flow b3854d4e-54f5-4fad-9457-2f899c4a1653, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, normalized to accepted net product mass."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Equipment family, function, native capacity and test, power states, chassis or board form, PCB and subassembly configuration, incidental storage, interfaces, integrated cooling, power supply, firmware state, net mass, packaging, delivery boundary, geography, period, lot, yield, and allocation shall be present or explicitly not applicable."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: validate_no_overlap
    applies_to: "category exclusion"
    rule: "Reject server or complete-computer datasets, complete systems, separate storage units, input or output peripherals, graphics, video, sound, or network cards, integrated circuits, network communications equipment, and passive parts or accessories."
    source_ids:
      - unstats-cpc-3-0-45289
  - rule_id: validate_bom_and_mass_balance
    applies_to: "inventory completeness"
    rule: "The BOM categories and process mass balance shall reconcile accepted net product, packaging, returns, rejects, scrap, wastes, and inventory change; exclusions and residual imbalance shall be disclosed."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: validate_power_and_cooling
    applies_to: "energy and thermal boundary"
    rule: "Power shall be tied to operating state, workload or capacity, duration, and instrument method. Integrated cooling shipped with the unit shall be in the BOM; manufacturing-facility and downstream data-centre cooling shall remain separately identified."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: validate_delivery_boundary
    applies_to: "factory-gate and delivered results"
    rule: "Packaging shall be separate from net reference mass, and outbound delivery shall be absent from the default result or reported as a separable route-specific extension."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "The dataset shall state each shared process, allocation hierarchy, physical driver, and fallback sensitivity; unexplained economic or generic mass allocation fails validation."
    source_ids:
      - etsi-es-203-199-v1-3-1
  - rule_id: validate_manual_review
    applies_to: "broad-leaf ambiguity"
    rule: "If the equipment family, principal function, or boundary against excluded server, complete-machine, storage, peripheral, expansion-card, integrated-circuit, communications, or passive-part identities cannot be resolved, validation is inconclusive and the record shall be routed to manual_review."
    source_ids:
      - unstats-cpc-3-0-45289
published_dataset_profile:
  dataset_role: "Foreground production dataset for one declared CPC 45289 equipment family and configuration at the manufacturing gate"
  downstream_use: "Secondary dataset and background dataset for product, process, and lifecyclemodel construction when identity, configuration, capacity, and boundary are compatible"
  allowed_use: "Configuration-specific product footprinting; supply-chain modelling; data-centre or computing-system component inventories; scenario analysis with separately modelled delivery, use, maintenance, and end-of-life extensions"
  excluded_use: "Direct comparison across unlike equipment families or capacities; representation of servers, complete computers or systems, storage units, peripherals, expansion cards, integrated circuits, communications equipment, or passive parts; use-stage or delivered claims from a factory-gate-only dataset"
  required_metadata: "Equipment family; principal function; native capacity and test method; power modes; operating profile if used; chassis or board form; PCB and subassembly configuration; incidental storage; interfaces; integrated cooling and coolant; power supply; firmware state; net mass; packaging; delivery boundary; manufacturing and electricity geography; reporting period; lot; yield; allocation; BOM coverage; exclusions; data sources"
  required_quality_disclosure: "Foreground versus upstream data shares; supplier dataset coverage; measurement and calibration coverage; BOM and mass-balance residual; shared-load allocation; temporal, geographic, and technological representativeness; missing part categories; rework and waste closure; downstream scenario assumptions"
  update_trigger: "Change of equipment family, principal function, native capacity test, major PCB or semiconductor generation, chassis or interface architecture, integrated storage, cooling or power design, firmware that changes function or power, manufacturing site or electricity supply, supplier route, packaging, delivery boundary, allocation method, or source evidence"
