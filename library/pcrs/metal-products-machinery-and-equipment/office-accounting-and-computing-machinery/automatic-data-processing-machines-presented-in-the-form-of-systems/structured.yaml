measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize the accepted system output to 1 kg of measured net finished-system hardware. Record packaging separately and do not include non-delivered factory fixtures or general data-centre infrastructure."
  - id: configuration_mass_reconciliation
    applies_to: "configuration-controlled BOM and finished output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile BOM-line masses, incorporated consumables, accepted output, rejects, and other material losses for the same configuration and production lot. Investigate and disclose unexplained imbalance rather than scaling an incomplete BOM."
  - id: count_to_mass_conversion
    applies_to: "BOM lines recorded by item count"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts to mass only with configuration-specific measured piece mass, supplier mass data, or a documented engineering BOM value; retain count, conversion factor, and source record."
  - id: family_weighting
    applies_to: "product-family or production-mix datasets"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Calculate a family result from configuration-level inventories and actual production or shipment weights. Preserve each configuration ID and weighting record; do not substitute one low-end, typical, high-end, or single-server configuration for the family."
  - id: mass_is_not_service_equivalence
    applies_to: "interpretation and comparison"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The kg reference normalizes the production inventory only. Comparisons between systems require a separately defined equivalent computing or storage function, capacity, performance, utilisation profile, and lifetime."
