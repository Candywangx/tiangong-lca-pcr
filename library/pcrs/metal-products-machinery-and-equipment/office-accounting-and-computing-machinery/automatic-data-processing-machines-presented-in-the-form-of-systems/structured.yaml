allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared integration, testing, rework, and packaging operations"
    rule: "Prefer separate meters, production orders, test-bench logs, and material issues for each configuration or homogeneous production lot so allocation is avoided."
    source_ids:
      - itu-t-l1410-2024
      - ec-pef-2021-2279
  - rule_id: allocation_causal_shared_resources
    applies_to: "unavoidable shared factory inputs and emissions"
    rule: "When subdivision is not possible, use a documented physical driver that causes the burden, such as test-bench time and measured power, machine time, handled mass, or packaging count. Economic allocation is allowed only when no defensible physical relationship exists and its effect is disclosed."
    source_ids:
      - itu-t-l1410-2024
      - ec-pef-2021-2279
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework, retest, rejects, and scrap"
    rule: "Assign rework and retest to the configuration and lot that caused them. Allocate common scrap handling by measured waste mass and treatment route; do not credit recycling revenue inside the foreground production quantity."
    source_ids:
      - itu-t-l1410-2024
      - ec-pef-2021-2279
  - rule_id: allocation_family_configuration_mix
    applies_to: "product-family or production-mix result"
    rule: "Build the result from separate configuration inventories weighted by actual accepted production or shipments for the declared period. A single server or one representative configuration cannot absorb the burdens of the family."
    source_ids:
      - energy-star-computer-servers-v4-2023
      - eu-2019-424-consolidated
      - smith-mann-lal-2026
dataset_production:
  collection_protocols:
    - protocol_id: cp_configuration_bom
      process_id: "system_integration_test_and_factory_release"
      flow_role: "Delivered hardware and subassembly inputs"
      record_type: "Configuration-controlled BOM, supplier specification, receiving record, and measured mass"
      raw_fields: "configuration_id; bom_revision; bom_line_id; component_class; supplier_model; quantity; unit_mass_kg; mass_source; upstream_dataset_uuid; integrated_or_bundled; production_lot"
      collection_method: "Export the released as-built BOM; verify quantities against receiving and build records; use calibrated weighing or supplier mass; map each material class to an upstream dataset."
      unit: "item and kg"
      frequency: "Every configuration revision and production lot"
      temporal_coverage: "Full declared reporting period; retain the BOM effective dates"
      site_scope: "Every integration site in scope"
      aggregation_rule: "Sum line mass as quantity × unit mass within configuration and lot; aggregate only homogeneous lines with the same technology and upstream dataset."
      quality_evidence: "Approved BOM; engineering change record; supplier specification; scale calibration; receiving/build record; upstream-dataset mapping"
    - protocol_id: cp_materials_packaging_and_utilities
      process_id: "system_integration_test_and_factory_release"
      flow_role: "Consumables, packaging, water, coolant, and refrigerant"
      record_type: "Material issue/return record, packaging BOM, meter, purchase record, and service log"
      raw_fields: "configuration_id; lot_id; material_id; material_state; issued_quantity; returned_quantity; incorporated_quantity; packaging_level; reusable_cycles; meter_start; meter_end; refill_or_recovery_mass"
      collection_method: "Reconcile stores issues and returns; weigh packaging; read dedicated meters where present; reconcile coolant and refrigerant issues, recovery, and retained fill."
      unit: "kg and m3 where the source record uses volume"
      frequency: "Each lot, delivery, meter interval, or service event"
      temporal_coverage: "Full declared reporting period"
      site_scope: "Every integration and test site in scope"
      aggregation_rule: "Net issues = issued − returned; convert volume to mass only with measured or documented density and conditions; normalize to accepted net system mass."
      quality_evidence: "Stores ledger; packaging specification; calibrated meter/scale; purchase invoice; refrigerant or coolant service log"
    - protocol_id: cp_stage_energy
      process_id: "system_integration_test_and_factory_release"
      flow_role: "Integration and acceptance-test electricity"
      record_type: "Meter interval, equipment log, test-bench log, and production schedule"
      raw_fields: "site_id; meter_id; stage_code; start_time; end_time; meter_start_kwh; meter_end_kwh; baseline_kwh; configuration_id; lot_id; test_profile; accepted_output_kg"
      collection_method: "Use dedicated stage or equipment meters where available; otherwise reconcile facility submeter data to production and test logs with a documented causal allocation driver."
      unit: "kWh"
      frequency: "Every production or test interval"
      temporal_coverage: "Full declared reporting period, including representative operating conditions"
      site_scope: "Every integration and test site in scope"
      aggregation_rule: "Net stage energy = end reading − start reading − documented non-production baseline; assign by measured equipment power and time or another causal physical driver."
      quality_evidence: "Meter calibration; timestamped readings; test report; production schedule; baseline study"
    - protocol_id: cp_output_and_acceptance
      process_id: "system_integration_test_and_factory_release"
      flow_role: "Accepted system output, rejects, wastes, and direct releases"
      record_type: "Factory acceptance record, calibrated net-mass record, reject/rework log, waste manifest, and emission or service record"
      raw_fields: "configuration_id; bom_revision; lot_id; accepted_units; net_system_mass_kg; packaging_mass_kg; acceptance_test_id; reject_id; rework_action; waste_type; waste_mass_kg; treatment_route; substance; compartment; released_mass_kg"
      collection_method: "Weigh accepted net hardware separately from packaging; link each unit or lot to acceptance tests; reconcile rejects and rework; collect waste and direct-release records by route and substance."
      unit: "item and kg"
      frequency: "Every accepted lot, reject, waste shipment, and release event"
      temporal_coverage: "Full declared reporting period"
      site_scope: "Every integration and test site in scope"
      aggregation_rule: "Sum accepted net mass by configuration; keep packaging separate; assign rejects, rework, waste, and releases to the causing lot before normalization."
      quality_evidence: "Scale calibration; signed acceptance report; serial/lot trace; reject disposition; waste transfer note; permit or service calculation"
  calculation_rules:
    - id: calc_configuration_bom_mass
      applies_to: "configuration hardware inputs"
      rule: "For each BOM line, mass = quantity × configuration-specific unit mass; sum separately by compute, memory/storage, network/control/I/O, chassis/rack/power/thermal, cabling, and bundled-peripheral classes."
      inputs:
        - "BOM quantity"
        - "unit mass"
        - "configuration and dataset mapping"
      output: "kg of each hardware class per kg accepted net system"
      source_ids:
        - itu-t-l1410-2024
        - energy-star-computer-servers-v4-2023
        - eu-2019-424-consolidated
    - id: calc_stage_energy
      applies_to: "integration and test electricity"
      rule: "Net kWh = end meter − start meter − documented baseline. Allocate only residual shared energy by measured equipment power × time or another causal physical driver, then divide by accepted net output mass."
      inputs:
        - "Meter readings"
        - baseline
        - "equipment power"
        - "stage time"
        - "accepted output kg"
      output: "kWh per kg accepted net system"
      source_ids:
        - itu-t-l1410-2024
        - ec-pef-2021-2279
    - id: calc_configuration_mass_balance
      applies_to: "product, incorporated materials, rejects, and waste"
      rule: "Reconcile configuration hardware plus incorporated materials with accepted output plus rejects, waste, direct material releases, and documented stock returns. Record and investigate the residual; do not force balance by changing the reference product."
      inputs:
        - "BOM mass"
        - consumables
        - "stock returns"
        - "output mass"
        - "reject and waste mass"
        - releases
      output: "mass-balance residual and completeness finding"
      source_ids:
        - itu-t-l1410-2024
        - ec-pef-2021-2279
    - id: calc_family_weighted_mix
      applies_to: "declared product-family result"
      rule: "Family inventory = sum over configurations of configuration inventory × actual accepted-production or shipment share for the reporting period. Report the share and inventory of every included configuration or a justified homogeneous stratum."
      inputs:
        - "Configuration inventories"
        - "accepted production or shipment counts/mass"
        - "reporting period"
      output: "production-weighted family inventory with traceable strata"
      source_ids:
        - energy-star-computer-servers-v4-2023
        - eu-2019-424-consolidated
        - smith-mann-lal-2026
  data_quality_requirements:
    - id: dq_configuration_identity
      applies_to: "reference product and all inventory rows"
      requirement: "Every record shall resolve to the same configuration ID, BOM revision, production lot, and acceptance boundary; substitutions and engineering changes are separately traced."
      evidence: "Released BOM, engineering change records, serial/lot trace, and acceptance report"
    - id: dq_completeness
      applies_to: "hardware BOM and foreground operations"
      requirement: "Demonstrate coverage of every applicable delivered hardware class and all integration, testing, rework, packaging, waste, and direct-emission activities; disclose and justify cut-offs cumulatively."
      evidence: "BOM coverage report, process map, mass balance, cutoff register, and sensitivity check"
    - id: dq_technological_representativeness
      applies_to: "upstream datasets and foreground records"
      requirement: "Match processor/board generation, storage technology, memory, chassis/form factor, power and cooling design, assembly route, and test profile to the declared configuration; do not use unrelated single-device proxies."
      evidence: "Supplier model/specification, dataset technology description, configuration mapping, and test profile"
    - id: dq_geographical_temporal_representativeness
      applies_to: "electricity, materials, upstream hardware, and factory data"
      requirement: "Use geography- and period-representative data for each production site and supplier route. Record data year, geography, and any extrapolation across rapidly changing hardware generations."
      evidence: "Site and supplier geography, reporting dates, electricity contract or grid source, and representativeness assessment"
    - id: dq_precision_and_measurement
      applies_to: "mass, energy, utilities, waste, and direct emissions"
      requirement: "Retain calibration, sampling, calculation, and uncertainty evidence. Prefer measured foreground data; identify modelled or secondary values and test material assumptions."
      evidence: "Calibration certificates, meter and scale logs, calculation workpapers, uncertainty record, and source hierarchy"
    - id: dq_upstream_dataset_coverage
      applies_to: "purchased hardware, materials, energy, packaging, and waste treatment"
      requirement: "Map every materially distinct flow to an upstream dataset with identity and quality metadata. Missing data remain an explicit gap and cannot be hidden by a complete-system or single-server proxy."
      evidence: "Flow-to-dataset mapping, dataset UUIDs, quality metadata, and gap register"
validation_rules:
  - rule_id: validate_reference_flow_identity
    applies_to: "reference output"
    rule: "The product flow UUID shall be 5476c8d0-2b87-4bb4-8024-ec5c7e3213b4, a state-code-100 Product flow classified to CPC 45240, with Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - unsd-cpc-45240
  - rule_id: validate_complete_configuration
    applies_to: "reference product metadata"
    rule: "Fail if configuration ID, BOM revision, required hardware-class disclosure, net hardware mass, packaging boundary, factory-gate geography, production period, or acceptance-test basis is missing."
    source_ids:
      - energy-star-computer-servers-v4-2023
      - eu-2019-424-consolidated
  - rule_id: validate_no_single_device_proxy
    applies_to: "product scope and inventory"
    rule: "Fail if one server, desktop, storage unit, monitor, printer, network unit, or peripheral is used to represent the entire delivered ADP system or if a system-family result lacks configuration weighting."
    source_ids:
      - unsd-cpc-45240
      - energy-star-computer-servers-v4-2023
      - smith-mann-lal-2026
  - rule_id: validate_bom_and_mass_balance
    applies_to: "hardware inputs and accepted output"
    rule: "Fail if the delivered BOM is not reconciled by hardware class to accepted net output, rejects, waste, returns, and direct material releases, or if an unexplained residual is silently scaled away."
    source_ids:
      - itu-t-l1410-2024
      - ec-pef-2021-2279
  - rule_id: validate_upstream_coverage
    applies_to: "purchased inputs"
    rule: "Fail if a materially distinct BOM class lacks an upstream dataset or explicit gap, or if an unrelated generic device dataset substitutes for configuration-specific hardware."
    source_ids:
      - itu-t-l1410-2024
      - ec-pef-2021-2279
  - rule_id: validate_stage_energy_and_test_profile
    applies_to: "integration and acceptance testing"
    rule: "Fail if energy records cannot be linked to site, time interval, configuration, accepted output, and test profile, or if shared energy lacks a documented causal allocation."
    source_ids:
      - itu-t-l1410-2024
      - energy-star-computer-servers-v4-2023
  - rule_id: validate_boundary_and_cutoffs
    applies_to: "foreground and downstream scope"
    rule: "Fail if included delivery hardware, in-house component processes, packaging, downstream exclusions, or cut-offs are undisclosed; flag cumulative or environmentally significant exclusions for review."
    source_ids:
      - itu-t-l1410-2024
      - ec-pef-2021-2279
  - rule_id: validate_mass_not_functional_comparison
    applies_to: "interpretation"
    rule: "Fail any claim of cross-system environmental superiority based only on kg-normalized results unless equivalent service, capacity, performance, utilisation, and lifetime are separately established."
    source_ids:
      - itu-t-l1410-2024
      - smith-mann-lal-2026
published_dataset_profile:
  dataset_role: "Configuration-resolved foreground production dataset for a complete ADP system at the manufacturing plant."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Component-resolved cradle-to-factory-gate modelling of the declared system configuration; production-weighted family modelling when configuration strata and weights are retained; connection to separately modelled distribution, installation, operation, maintenance, refurbishment, and end-of-life scenarios."
  excluded_use: "Proxy for a single server, desktop, or peripheral; proxy for an undisclosed product family; use-phase or computing-service comparison based only on kg; data-centre facility model unless facility hardware is explicitly within the delivered system boundary."
  required_metadata: "PCR id and version; exact reference flow/property/unit UUIDs; system configuration ID; BOM revision and hardware-class breakdown; product family and weighting basis; processor/accelerator, memory, storage, network/I/O, chassis/rack, power and thermal configuration; bundled peripherals; net and packaging mass; integration/test site and period; acceptance profile; upstream dataset map; allocation and cutoff rules."
  required_quality_disclosure: "BOM and mass-balance completeness; measured versus calculated values; technological, geographical, and temporal representativeness; meter and scale calibration; uncertainty; supplier coverage; configuration weighting; data gaps, proxies, cut-offs, and sensitivity findings."
  update_trigger: "New or materially changed BOM/configuration, processor or accelerator generation, memory/storage technology, chassis/rack, power or thermal design, bundled hardware boundary, assembly/test route, production site, electricity supply, supplier dataset, allocation driver, configuration mix, or evidence that changes a rule."
data_sources:
  - id: "unsd-cpc-45240"
    type: "dataset"
    reference: "United Nations Statistics Division, CPC detail 45240, “Automatic data processing machines presented in the form of systems”, https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/45240 (retrieved 2026-08-09)"
    used_for: "Official category identity and correspondence context; supports exclusion of adjacent single-unit and peripheral categories."
  - id: "itu-t-l1410-2024"
    type: "standard"
    reference: "ITU-T Recommendation L.1410 (11/2024), “Methodology for environmental life cycle assessments of information and communication technology goods, networks and services”, https://handle.itu.int/11.1002/1000/16010 (retrieved 2026-08-09)"
    used_for: "ICT life-cycle boundary, mandatory parts production and assembly, reference-flow interpretation, cut-off, foreground collection, allocation, and data-quality rules."
  - id: "energy-star-computer-servers-v4-2023"
    type: "standard"
    reference: "U.S. EPA ENERGY STAR Program Requirements, Product Specification for Computer Servers, Eligibility Criteria, Version 4.0, 12 April 2023, https://www.energystar.gov/sites/default/files/asset/document/ENERGY%20STAR%20Version%204.0%20Computer%20Servers%20Final%20Specification.pdf (retrieved 2026-08-09)"
    used_for: "Product-family configuration heterogeneity, system form factors and components, representative configurations, system characteristics, and acceptance-test metadata."
  - id: "eu-2019-424-consolidated"
    type: "official_guidance"
    reference: "Commission Regulation (EU) 2019/424, consolidated text of 1 May 2021, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02019R0424-20210501 (retrieved 2026-08-09)"
    used_for: "Server and storage product definitions; configuration-specific component, power, material, disassembly, and low/high product-family disclosure."
  - id: "ec-pef-2021-2279"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, OJ L 471, 30 December 2021, http://data.europa.eu/eli/reco/2021/2279/oj (retrieved 2026-08-09)"
    used_for: "Complete life-cycle perspective, system boundary, allocation hierarchy, cutoff disclosure, dataset hierarchy, and completeness/representativeness/precision quality requirements."
  - id: "smith-mann-lal-2026"
    type: "literature"
    reference: "Smith, M.; Mann, M.; Lal, P. (2026), “Carbon Accounting and Beyond: An Evidence-Based Life Cycle Assessment of the Environmental Impacts of Data Center IT Equipment”, Sustainability 18(11), 5671, https://doi.org/10.3390/su18115671"
    used_for: "Peer-reviewed evidence that data-centre equipment inventories are multi-asset and that server types are not interchangeable without performance-, service-, and storage-capacity-normalized comparison."
