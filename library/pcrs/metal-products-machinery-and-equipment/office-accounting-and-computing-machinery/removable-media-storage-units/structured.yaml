allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared production"
    rule: "Use product-line and operation metering before allocating shared burdens. Where subdivision is infeasible use a demonstrated physical driver such as occupied equipment time; document why it reflects resource use and test sensitivity."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: allocation_rejects
    applies_to: "yield and recycling"
    rule: "Retain failed-test and rework burdens in accepted output. Track rejects separately and do not treat them as saleable reference product. Declare a consistent recycling allocation method; do not deduct an assumed avoided virgin-material credit."
    source_ids:
      - ghg-protocol-product-standard
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch
      process_id: "assembly"
      flow_role: "Components, energy, packaging, accepted product and rejects"
      record_type: "batch ledger and meters"
      raw_fields: "model; lot; component identity; issued mass; returns; opening and closing stock; accepted count; net device mass; reject mass; meter readings; run and test hours; destinations"
      collection_method: "Reconcile BOM, purchasing and production ledgers with calibrated weighing, submetering, acceptance tests and waste transfer records"
      unit: "kg; count; MJ; h"
      frequency: "each batch and meter interval"
      temporal_coverage: "Full declared production period including shutdowns and rework"
      site_scope: "Declared factory and shared services"
      aggregation_rule: "Aggregate net exchanges over the same period; allocate shared service once; divide by accepted net mass"
      quality_evidence: "Calibration; supplier specifications; invoices; test logs; waste receipts; allocation reconciliation"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all exchanges"
      rule: "q_i = allocated net batch exchange i / accepted net batch mass; reference output = 1 kg"
      inputs:
        - "cp_batch quantities and accepted count times measured kg/device"
      output: "kg or MJ per kg reference product"
      source_ids: []
    - id: net_issues
      applies_to: "purchased components"
      rule: "Net issue = opening stock + receipts - closing stock - supplier returns; reconcile against installed components and measured rejects"
      inputs:
        - "cp_batch mass ledger"
      output: "Component input mass"
      source_ids: []
    - id: meter_partition
      applies_to: "electricity"
      rule: "Sum operation meters; allocate unmetered shared services using justified occupied equipment time; reconcile total to the site bill"
      inputs:
        - "cp_batch energy and runtime"
      output: "Purchased electricity attributable to this batch"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "device and components"
      requirement: "Verify removable-media function and actual BOM; record purchased board population and mechanical-module scope"
      evidence: "Supplier drawings and acceptance specifications"
    - id: dq_period
      applies_to: "all records"
      requirement: "Use one matched production period and report missing periods, meter allocation, representativeness and uncertainty"
      evidence: "cp_batch; ghg-protocol-product-standard chapter 8"
    - id: dq_coverage
      applies_to: "material and waste balances"
      requirement: "Investigate discrepancy between issued mass, device output, scrap, returns and stock movement using measurement uncertainty; no unsupported tolerance is prescribed"
      evidence: "Signed mass reconciliation and waste receipts"
    - id: dq_ranges
      applies_to: "foreground amounts"
      requirement: "Collect actual amounts; do not replace absent measurements with a generic optical-drive, tape-drive or reader benchmark"
      evidence: "cp_batch"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Require all qualifiers, net device mass and acceptance records. Reject a fixed-media drive or a removable medium presented as the reference device."
    source_ids:
      - un-cpc-2-1-removable-storage
  - rule_id: validate_inventory
    applies_to: "quantities"
    rule: "Verify each actual exchange is atomic, normalized to accepted output, supported by cp_batch, and assigned once; reconcile BOM, electricity and waste totals. Missing data are unresolved, not zero."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: validate_boundary
    applies_to: "downstream claims"
    rule: "Require explicit upstream links and disclosure of unmodelled stages; prohibit lifetime service comparisons from this production-only package without an additional use and end-of-life model."
    source_ids:
      - ghg-protocol-product-standard
published_dataset_profile:
  dataset_role: "Foreground production dataset for a specified removable-media device model"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Production input to host-computer or peripheral-device life-cycle models with compatible boundaries"
  excluded_use: "Removable-media manufacture; fixed-media drive production; generic lifetime storage-service comparison; claim of a full life-cycle footprint"
  required_metadata: "Model; device technology; site; country; period; net mass; count; acceptance criteria; BOM scope; upstream links; transport treatment; allocation"
  required_quality_disclosure: "Measurement coverage; supplier-data gaps; unresolved flow identities; missing upstream datasets; uncertainty; exclusions"
  update_trigger: "BOM, manufacturing route, supplier technology, test protocol, site energy or reference-product specification changes"
