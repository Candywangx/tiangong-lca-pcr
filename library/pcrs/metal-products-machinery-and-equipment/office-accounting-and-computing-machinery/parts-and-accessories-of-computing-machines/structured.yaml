      rule: "q_i = Q_i / M_a; M_a is accepted net mass of the same model; reject zero or unknown denominators"
      inputs:
        - "Measured batch exchange Q_i and accepted mass M_a"
      output: "Exchange per kg accepted part"
      source_ids: []
    - id: count_conversion
      applies_to: "Item-count receipts"
      rule: "M = N times measured mean item mass for the same model and lot; retain sampling and variability"
      inputs:
        - "Count N and measured item mass"
      output: "kg"
      source_ids: []
    - id: material_check
      applies_to: "Part material"
      rule: "Issued material minus unused returns equals accepted retained material plus discarded material plus net work-in-progress change; investigate residuals against documented measurement uncertainty"
      inputs:
        - "Material ledger"
        - "output and waste records"
      output: "Reconciliation residual"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "All part models"
      requirement: "Record function, CPU/BIOS state, material and interface revision; do not infer a complete-computer service from a part mass"
      evidence: "BOM, drawing, acceptance record; cbp-n304809-2019, cbp-n025223-2008"
    - id: coverage_quality
      applies_to: "Supplier and site linkage"
      requirement: "Confirm where fabrication stops and finalization starts, including freight; quantify any missing coverage before using the package as a cradle-to-gate input"
      evidence: "Supplier dataset scope, site process map and shipment records"
    - id: range_quality
      applies_to: "Exchange amounts"
      requirement: "Use measured foreground quantities. No universal empirical consumption or yield range is prescribed for these heterogeneous parts; retain uncertainty from meters, sampling and allocation"
      evidence: "Raw ledgers and uncertainty calculations"
    - id: route_quality
      applies_to: "Applicability"
      requirement: "Distinguish measured zero, evidenced absence and missing data. Additional real components, process chemicals and waste streams require separate atomic rows"
      evidence: "Site walkthrough, BOM, purchase and waste records"
validation_rules:
  - rule_id: one_reference
    applies_to: "Reference flow"
    rule: "Require one eligible part model, one reference output, 1 kg net basis and all qualifiers. Never sum chassis and motherboard outputs into an interchangeable product."
    source_ids: []
  - rule_id: ledger_validation
    applies_to: "Quantities"
    rule: "Require a positive accepted-output denominator; reconcile count, mass, rejects, rework and stock movement with documented uncertainty."
    source_ids: []
  - rule_id: boundary_validation
    applies_to: "Completeness"
    rule: "Verify every supplier/freight/treatment link and onsite exchange; reject a cradle-to-gate claim supported only by finalization electricity and purchased-part mass."
    source_ids: []
  - rule_id: identity_validation
    applies_to: "UUIDs"
    rule: "Adopt only exact public flow identities of the right state, type, property and unit. A blank UUID remains an explicit identity gap and never licenses a proxy or omitted exchange."
    source_ids: []
  - rule_id: comparability
    applies_to: "Downstream claims"
    rule: "Do not use mass-normalized parts for comparative assertions without matching function, interfaces, host use and lifetime."
    source_ids:
      - ghg-protocol-product-standard-2011
published_dataset_profile:
  dataset_role: "Foreground production package; a reviewed complete package may become a secondary_dataset"
  downstream_use: "background_dataset input to OEM computer assembly or replacement-part lifecycle models"
  allowed_use: "Model-specific declared-boundary part supply; cradle-to-gate only when upstream, freight and treatment coverage are complete"
  excluded_use: "Whole-computer footprint; universal part average; cross-function comparison; unqualified full life cycle claim"
  required_metadata: "Model, route, configuration, item mass, period, site, supplier datasets, freight, tests, allocation, waste treatment and reference identity"
  required_quality_disclosure: "Measured coverage, gaps, unit conversion, uncertainty, non-applicability evidence and upstream boundary reconciliation"
  update_trigger: "BOM, material, supplier, test protocol, process location, yield, electricity supply or boundary changes"
