  market_state: "New accepted part for OEM integration or replacement; no complete-computer function"
functional_unit:
  what: "Supply a specified computing-machine part for mechanical enclosure or declared board interface function"
  how_much: "1 kg net accepted parts of one model; declare corresponding item count"
  how_well: "Meets the model drawing, mounting/interface requirements and documented acceptance test; unlike functions are not interchangeable"
  how_long_or_cycle: "One production and acceptance cycle to the factory gate; service life and host-computer use profile are not inferred"
  reference_flow_link: "chassis_product is the representative output; a board-specific package uses motherboard_product as its sole reference and updates the concrete reference identity"
system_boundary:
  rules:
    - rule_id: gate_boundary
      applies_to: "Product system"
      rule: "Use a disclosed cradle-to-gate intermediate-part inventory when the host use profile is unknown; include upstream supply, inbound logistics, assembly, testing, packaging and production-waste treatment. Exclude host use and host end of life together; disclose any separate downstream study."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: supply_link
      applies_to: "Purchased part inputs"
      rule: "Attach boundary-compatible upstream datasets to the supplied shell and populated board. An onsite activity cannot be hidden in a purchased-input label. Reconcile supplier and foreground coverage to prevent gaps or double counting."
      source_ids: []
    - rule_id: test_boundary
      applies_to: "Acceptance tests"
      rule: "Count test-fixture electricity and rework in production. Test fixtures temporarily supplying CPU or BIOS are not shipped product inputs; consumptive replacements require their own inventory rows."
      source_ids: []
    - rule_id: extension_completeness
      applies_to: "Additional operations"
      rule: "A real fuel, chemical, refrigerant loss, wastewater, incoming packaging waste or extra BOM component requires a separate measured atomic exchange. The representative dry finalization route assumes none without confirming site records."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Supplier-produced formed and surface-finished chassis shell, or populated motherboard lacking CPU and BIOS ROM, awaiting final acceptance"
  starting_condition_role: "Purchased intermediate; upstream fabrication remains linked background supply"
  product_classification_scope: "Computing-machine parts; independently functioning machines and separately classified units remain outside this category"
  recursive_input_rule: "Same-category input is recorded at its actual delivered state and linked once to a supplier dataset. Do not recursively instantiate this finishing process or count purchased and internally fabricated versions together."
  upstream_dataset_requirement: "Supply-specific cradle-to-delivery data covering raw materials, fabrication, yield, component manufacture and transport; if only factory-gate data exist, add inbound transport from actual shipment records"
  disclosure: "Model, route, make/buy split, included tests, supplier coverage, transport endpoints, omitted exchanges with evidence and system-boundary limitations"
