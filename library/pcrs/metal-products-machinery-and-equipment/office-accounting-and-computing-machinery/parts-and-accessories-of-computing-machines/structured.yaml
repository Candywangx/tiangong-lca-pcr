allocation_rules:
  - rule_id: separate_models
    applies_to: "Shared finishing equipment"
    rule: "Separate routes and meter dedicated operations first. For inseparable shared demand, use a justified physical driver such as occupied test time; use economic allocation only if physical causation cannot be established and document sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: reject_burdens
    applies_to: "Rework and scrap"
    rule: "Retain rework and rejected-part production burdens in accepted output. Record waste treatment and any recycling allocation transparently; never deduct a presumed virgin-material credit from scrap mass alone."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_chassis_materials
      process_id: "chassis_completion"
      flow_role: "Chassis shell and steel screws"
      record_type: "Material ledger"
      raw_fields: "model, lot, item identity, quantity issued, unused returns, stock change, mass per item, supplier, route"
      collection_method: "Weigh each material separately; reconcile issue records and BOM; retain upstream and shipment records"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Declared representative production period covering normal and rework operation"
      site_scope: "Actual finalization site and named suppliers"
      aggregation_rule: "Sum consumption by atomic flow and model; divide by accepted net model output"
      quality_evidence: "Calibrated scales, BOM revision, delivery notes, supplier coverage and receiving checks"
    - protocol_id: cp_chassis_energy
      process_id: "chassis_completion"
      flow_role: "Electricity"
      record_type: "Meter and test logs"
      raw_fields: "meter start/end, kWh, test time, fixture load, idle load, model, lot, accepted output, allocation driver"
      collection_method: "Submeter or document an engineering allocation from measured loads and times"
      unit: "kWh then MJ"
      frequency: "Each batch or logged test interval"
      temporal_coverage: "Same period as material and output records"
      site_scope: "Chassis completion and its attributable support only"
      aggregation_rule: "Convert kWh by 3.6; reconcile submeters to main meter before model allocation and normalization"
      quality_evidence: "Meter calibration, load records and unallocated-energy reconciliation"
