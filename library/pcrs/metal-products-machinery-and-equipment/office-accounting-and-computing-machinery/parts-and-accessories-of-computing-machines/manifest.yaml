  semantic_boundary_review:
    decision: promote_legacy
    rationale: No same-category material identity found. Part supply is distinct from complete machines, storage units, expansion cards, bare printed circuits and integrated circuits. Implemented foreground boundary is finalization of supplier-produced chassis and incomplete motherboards; upstream burdens are mandatory and additional part models require explicit atomic inventory extensions.
