system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground manufacturing"
      rule: "Include receiving, product-specific assembly, programming where performed, functional testing, inspection, rework attributable to the reporting period, and final packaging through the factory gate."
      source_ids:
        - eu-environmental-footprint-2021
    - rule_id: boundary_rule_2
      applies_to: "purchased inputs"
      rule: "Include upstream production of every environmentally relevant component, subassembly, packaging article, and energy input using linked upstream datasets; do not treat a purchased assembly as burden-free."
      source_ids:
        - eu-environmental-footprint-2021
    - rule_id: boundary_rule_3
      applies_to: "product-specific data"
      rule: "Use the declared model's BOM and company-specific assembly, test, packaging, output, and waste data; a portfolio-average BOM is allowed only when the represented product family and weighting are disclosed."
      source_ids:
        - eu-environmental-footprint-2021
    - rule_id: boundary_rule_4
      applies_to: "excluded stages"
      rule: "Exclude distribution after the factory gate, installation, use-phase electricity and consumables, maintenance, and end-of-life from the default dataset; disclose and model them as separate stages when the study scope includes them."
