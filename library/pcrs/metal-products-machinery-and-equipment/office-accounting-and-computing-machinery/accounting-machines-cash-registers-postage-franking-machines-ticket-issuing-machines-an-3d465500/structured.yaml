allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared processes and meters"
    rule: "First subdivide production lines, work centres, test stations, and meters so that only inputs and outputs directly attributable to the declared machine are assigned."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_rule_2
    applies_to: "residual shared burdens"
    rule: "If subdivision is not practicable, use a documented causal physical driver such as machine-hours, test time, or metered energy; if no direct causal driver exists, apply a relevant physical relationship and disclose the sensitivity."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_rule_3
    applies_to: "rework and scrap"
    rule: "Assign rework energy and material losses to the reporting-period output that caused them. Report wastes at the factory boundary without avoided-burden credits; treatment burdens and any recovery credits belong in the selected downstream waste-treatment model."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "machine_assembly_test_pack"
      flow_role: "installed product components and subassemblies"
      record_type: "approved BOM, purchase receipt, issue record, count-to-mass sample"
      raw_fields: "model_id; component_id; description; supplier; quantity_per_unit; unit_mass; installed_mass; return_mass; inclusion_condition"
      collection_method: "Reconcile approved product-specific BOM with material issues, returns, engineering changes, and measured unit masses"
      unit: "kg"
      frequency: "Each model or engineering revision; reconcile at least once per reporting period"
      temporal_coverage: "Full production period represented by the dataset"
      site_scope: "All assembly lines and shifts producing the declared model"
      aggregation_rule: "Sum installed mass for conforming output; subtract usable returns; normalize by conforming machine count"
      quality_evidence: "BOM revision approval, scale calibration, sampling record, issue/return reconciliation"
    - protocol_id: cp_packaging_bom
      process_id: "machine_assembly_test_pack"
      flow_role: "packaging articles and printed insert"
