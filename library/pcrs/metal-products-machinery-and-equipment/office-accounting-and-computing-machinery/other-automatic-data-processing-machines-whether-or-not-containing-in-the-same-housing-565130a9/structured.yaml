system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default deliverable is a producer-gate foreground manufacturing data package. A downstream lifecyclemodel may extend it to raw-material acquisition, use, maintenance, refurbishment, and end-of-life, but shall keep the declared configuration and prevent overlap with linked component or treatment datasets."
      source_ids: []
    - rule_id: boundary_foreground_operations
      applies_to: "Producer-gate manufacturing"
      rule: "Include receiving and kitting, board mounting when performed on site, system integration, firmware or software loading, configuration, testing and burn-in when performed, rework, cleaning, final finishing, packaging, utilities, direct releases, rejects, and manufacturing wastes."
      source_ids:
        - itu-l1410-2024
    - rule_id: boundary_upstream_components
      applies_to: "Purchased inputs"
      rule: "Represent every material component and subassembly with an upstream dataset or a disclosed unresolved proxy; do not treat a purchased populated board, storage unit, power supply, housing, or cooling assembly as burden-free."
      source_ids:
        - itu-l1410-2024
        - ec-pef-method-2021
    - rule_id: boundary_configuration_specificity
      applies_to: "Product category coverage"
      rule: "Preserve architecture, housing-unit combination, installed components, firmware or operating environment, intended use, and configuration identity. Never extrapolate one server, workstation, thin client, appliance, embedded device, or other narrow design to the whole residual leaf."
      source_ids:
        - un-cpc-3-2025
        - energy-star-computers-9-2025
    - rule_id: boundary_software_and_test
      applies_to: "Software-bearing product and testing"
      rule: "Include on-site loading, configuration, update, and test energy and materials. Model software development, remote services, and use-phase operation only when the declared lifecycle boundary includes them, and disclose their allocation separately."
      source_ids:
        - itu-l1410-2024
    - rule_id: boundary_downstream_extension
      applies_to: "Lifecycle model"
      rule: "When use, maintenance, refurbishment, or end-of-life is claimed, add configuration-specific scenarios and datasets without duplicating producer-gate or upstream component burdens."
      source_ids:
        - itu-l1410-2024
    - rule_id: boundary_no_silent_cutoff
      applies_to: "All foreground operations"
      rule: "A known input, output, waste, or direct release shall not be omitted solely because a matching dataset is unavailable; record it, select a disclosed proxy, or document the exclusion and expected effect."
      source_ids:
        - itu-l1410-2024
        - ec-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Purchased electronic, electromechanical, mechanical, power, thermal-management, housing, storage, input, output, packaging, and software-bearing components or subassemblies received at the declared manufacturing site"
  starting_condition_role: "Upstream product inputs to the first foreground receiving, kitting, board-integration, or system-assembly operation"
  product_classification_scope: "Residual CPC 45250 automatic data processing machines represented only by the declared architecture, housing-unit combination, configuration, and intended use"
  recursive_input_rule: "An input that is already a finished in-scope CPC 45250 machine shall be recorded as an upstream product flow and shall not be decomposed again inside the receiving foreground process; disclose its configuration and upstream dataset."
  upstream_dataset_requirement: "Link supplier- and technology-appropriate datasets for semiconductors, printed circuit assemblies, memory, storage, power supplies, cooling, chassis, cables, batteries, displays or input devices when included, packaging, electricity, transport, and waste treatment; disclose every proxy and mismatch."
  disclosure: "Declare architecture, processor arrangement, housing form, exact in-housing storage/input/output combination, bill of materials, configuration identifier, intended use, site, reporting period, included assembly and test operations, upstream datasets, packaging treatment, and exact producer-gate terminal condition."
