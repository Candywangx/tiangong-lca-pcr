allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "All shared manufacturing operations"
    rule: "First subdivide by line, work order, configuration, test profile, and process time and use direct measurements. Allocate only residual shared inputs or releases."
    source_ids:
      - ec-pef-method-2021
      - itu-l1410-2024
  - rule_id: allocation_shared_utilities
    applies_to: "Shared facility electricity and utilities"
    rule: "Use configuration-specific sub-metering where available; otherwise allocate by a documented causal driver such as equipment runtime multiplied by measured power, machine time, or occupied test-cell time. Use output mass only when no better causal driver exists and disclose the limitation."
    source_ids:
      - itu-l1410-2024
      - ec-pef-method-2021
  - rule_id: allocation_rework_and_rejects
    applies_to: "Rework and nonconforming output"
    rule: "Retain initial processing burdens, added rework inputs, and final disposal or recovery burdens in the production batch that generated the conforming output; do not remove reject burdens by treating scrap revenue as a co-product without an explicit reviewed method."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_configuration_family
    applies_to: "Multi-configuration dataset"
    rule: "Calculate each configuration separately, then combine only with audited production mass for the declared site and period. Report included configurations, weights, dispersion, and exclusions; never substitute one server or embedded-device profile for the CPC leaf."
    source_ids:
      - energy-star-computers-9-2025
  - rule_id: allocation_recovered_material
    applies_to: "Recovered manufacturing material"
    rule: "Report recovered material quantity and treatment route separately. Apply substitution or recycling credit only in a downstream lifecycle model with the method, quality, and avoided product explicitly declared."
    source_ids:
      - ec-pef-method-2021
      - itu-l1410-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_component_records
      process_id: "component_receipt_and_kitting"
      flow_role: "Electronic, mechanical, power, thermal, housing, storage, input, and output components"
      record_type: "Configuration BOM, purchase, stock, inspection, supplier, and return records"
      raw_fields: "configuration id; part number; function; supplier; quantity; mass; material or technology; installed housing-unit type; opening and closing stock; reject; return; upstream dataset"
      collection_method: "Reconcile approved BOM to purchase, stock, issue, return, and inspection records; weigh representative parts when supplier mass is unavailable"
      unit: "item; kg"
      frequency: "Each receipt and production batch; monthly stock reconciliation"
      temporal_coverage: "Representative production period covering all included configurations"
      site_scope: "Every included manufacturing site and incoming component store"
      aggregation_rule: "Net issued amount = opening stock + receipts - closing stock - documented returns; attribute by work order and divide by conforming configuration output mass"
      quality_evidence: "Approved BOM revision, invoices, stock ledger, inspection record, scale calibration, supplier specification, and upstream-dataset register"
    - protocol_id: cp_consumables_and_energy
      process_id: "board_and_system_integration"
      flow_role: "Assembly consumables, electricity, utilities, and direct releases"
      record_type: "Issue, meter, equipment, maintenance, and environmental records"
      raw_fields: "substance; amount; stock; meter; equipment id; power; runtime; batch; configuration; release factor; source id; waste transfer"
      collection_method: "Sub-meter material operations; otherwise reconcile issued stock and equipment logs to facility totals"
      unit: "kg; kWh; measured utility unit"
      frequency: "Each batch; monthly facility reconciliation"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Every included line, test cell, utility system, and emission point"
      aggregation_rule: "Attribute directly by work order; allocate residual shared use under section 7; calculate releases only from collected activity and cited factors"
      quality_evidence: "Meter and scale calibration, invoices, equipment logs, stock ledger, calculation workpaper, and environmental record"
    - protocol_id: cp_configuration_and_test_records
      process_id: "configuration_and_testing"
      flow_role: "Firmware or software loading, test, burn-in, and conforming output"
      record_type: "Configuration-control, test-cell, meter, and work-order records"
      raw_fields: "serial or batch id; configuration id; architecture; firmware or OS version; test profile; test duration; device power; support-equipment power; pass/fail; rework order; final mass"
      collection_method: "Link configuration and test logs to metered cell energy and output serials; document every changed default setting"
      unit: "item; h; kWh; kg"
      frequency: "Each tested unit or auditable batch"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Every included configuration and test cell"
      aggregation_rule: "Sum device and support-equipment energy by test profile, retain failures and rework, and divide by conforming output mass"
      quality_evidence: "Version-controlled test procedure, meter calibration, machine log, pass/fail record, and rework trace"
    - protocol_id: cp_waste_rework_and_yield
      process_id: "component_receipt_and_kitting_board_and_system_integration_configuration_and_testing"
      flow_role: "Rejects, rework, returned parts, scrap, and treatment routes"
      record_type: "Batch, quality, rework, scale, manifest, and treatment records"
      raw_fields: "input units and mass; conforming units and mass; reject reason; replaced part; returned quantity; waste material; hazard status; destination; recovered quantity"
      collection_method: "Reconcile batch yield and mass transfers; weigh each separated waste stream or use verified container totals"
      unit: "item; kg"
      frequency: "Each batch and each waste shipment"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Every included operation and waste destination"
      aggregation_rule: "Input = conforming transfer + reject or waste + return +/- inventory change within documented uncertainty"
      quality_evidence: "Quality record, rework order, calibrated scale, waste manifest, supplier return, treatment receipt, and mass balance"
    - protocol_id: cp_output_transfer_and_mass
      process_id: "component_receipt_and_kitting_board_and_system_integration_configuration_and_testing_finishing_and_gate_release"
      flow_role: "Internal transfers and conforming product mass"
      record_type: "Work-order, transfer, serial, count, and scale records"
      raw_fields: "configuration id; serial or batch; input count and mass; output count and mass; transfer time; stock change; net product mass"
      collection_method: "Count all units and weigh the finished configuration using a calibrated scale; retain sampling plan if unit mass is sampled"
      unit: "item; kg"
      frequency: "Each batch and each configuration revision"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Every included line and final gate"
      aggregation_rule: "Reconcile transfers by configuration and calculate kg output from measured net mass excluding packaging and separately supplied accessories"
      quality_evidence: "Work-order closure, transfer record, scale calibration, sampling plan, and finished-product specification"
    - protocol_id: cp_packaging_and_gate_records
      process_id: "finishing_and_gate_release"
      flow_role: "Packaging, included accessories, finishing energy, and gate release"
      record_type: "Bill-of-pack, purchase, stock, meter, packing, and release records"
      raw_fields: "configuration id; material or accessory; quantity; mass; recycled content; package level; meter; runtime; packed count; release status"
      collection_method: "Reconcile bill-of-pack and issues to packed conforming units; weigh representative packaging configurations"
      unit: "item; kg; kWh"
      frequency: "Each packaging configuration and production batch"
      temporal_coverage: "Current packaging configuration and representative production period"
      site_scope: "Every included packing line and release gate"
      aggregation_rule: "Divide attributed packaging, accessory, and finishing inputs by conforming output mass; keep transport packaging outside net product mass"
      quality_evidence: "Approved bill-of-pack, supplier specification, scale and meter calibration, packing record, and release certificate"
  calculation_rules:
    - id: calc_net_component_use
      applies_to: "Purchased components and consumables"
      rule: "net use = opening stock + receipts - closing stock - documented supplier returns; reconcile result to work-order issues and waste"
      inputs:
        - stock
        - purchase
        - return
        - issue
        - "and waste records"
      output: "net input by part or substance and configuration"
      source_ids: []
    - id: calc_reference_mass_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = amount attributed to conforming configuration / measured conforming net output mass in kg"
      inputs:
        - "attributed amount"
        - "conforming unit count"
        - "measured net unit or batch mass"
      output: "amount per 1 kg finished machine"
      source_ids: []
    - id: calc_yield_and_rework
      applies_to: "Production batch"
      rule: "conforming yield = conforming output units / started units; retain rejected units, rework loops, replacement parts, and waste rather than applying an unsupported default yield"
      inputs:
        - started
        - conforming
        - rejected
        - reworked
        - "and scrapped units and mass"
      output: "configuration-specific yield and burden per conforming kg"
      source_ids: []
    - id: calc_test_energy
      applies_to: "Configuration and testing"
      rule: "test electricity = sum of metered test-cell energy; when only equipment logs are available, sum measured power multiplied by logged duration for device and support equipment and reconcile to facility electricity"
      inputs:
        - "meter readings"
        - "device and support-equipment power"
        - "test duration"
        - "configuration id"
      output: "kWh per conforming kg by test profile"
      source_ids:
        - energy-star-computers-9-2025
        - ecma-383-2010
    - id: calc_configuration_family
      applies_to: "Declared configuration family"
      rule: "family amount = sum(configuration amount per kg x audited configuration production mass) / sum(audited configuration production mass); exclude unmeasured configurations and disclose coverage"
      inputs:
        - "configuration-specific results"
        - "production mass"
        - "site and period"
      output: "production-mass-weighted family result with coverage"
      source_ids:
        - energy-star-computers-9-2025
    - id: calc_mass_balance
      applies_to: "Each foreground process and whole foreground system"
      rule: "input material mass = product and internal-transfer output mass + waste and direct material release mass +/- documented stock change, within measured uncertainty; investigate and disclose residuals"
      inputs:
        - input
        - output
        - waste
        - release
        - stock
        - "and uncertainty records"
      output: "process and system mass-balance residual"
      source_ids:
        - itu-l1410-2024
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain architecture, processor arrangement, housing, exact in-housing storage/input/output combination, memory, accelerators, expansion, power, cooling, firmware or operating environment, intended use, configuration id, included accessories, net unit mass, and producer-gate condition."
      evidence: "Approved configuration specification, BOM revision, product label, test profile, and reference-flow metadata"
    - id: dq_configuration_coverage
      applies_to: "Multi-configuration production"
      requirement: "Enumerate the configuration population and report production-mass coverage; do not infer unmeasured configurations from a single representative server or embedded design."
      evidence: "Configuration register, audited production mass, inclusion table, and coverage calculation"
    - id: dq_measurement
      applies_to: "Mass, energy, count, time, and waste records"
      requirement: "Use calibrated scales and meters, serial or batch counts, version-controlled machine logs, invoices, and treatment receipts; preserve raw units, conversions, and uncertainty."
      evidence: "Calibration certificates, raw exports, work orders, invoices, and reconciliation workpapers"
    - id: dq_temporal
      applies_to: "Foreground production"
      requirement: "Use a representative continuous period that captures production mix, yield, rework, and operating conditions; normally at least twelve consecutive months, or a shorter complete campaign only with justification and configuration coverage."
      evidence: "Period register, production reconciliation, seasonality or campaign justification, and exception log"
    - id: dq_site_coverage
      applies_to: "Multi-site dataset"
      requirement: "Define the site population, technology and product strata, included sites, and production-mass coverage; calculate sites separately before aggregation."
      evidence: "Site register, sampling rationale, site results, and production-mass reconciliation"
    - id: dq_upstream_traceability
      applies_to: "Components and subassemblies"
      requirement: "Retain supplier, part number, technology or material, geography, data period, upstream dataset, proxy mismatch, and configuration linkage for material inputs."
      evidence: "Supplier evidence, approved BOM, upstream-dataset register, and proxy register"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile BOM mass, unit transfers, energy, yield, rework, rejects, wastes, and stock changes; list every omitted or unresolved flow and its expected effect."
      evidence: "Mass and count balances, utility reconciliation, completeness checklist, and unresolved-flow register"
    - id: dq_source_traceability
      applies_to: "Calculated values and external rules"
      requirement: "Store formula, raw inputs, source id and version, allocation driver, assumptions, and calculation result so an independent reviewer can reproduce the value."
      evidence: "Calculation workpaper, source archive, and independent recalculation"
    - id: dq_uuid_readiness
      applies_to: "Tiangong identity"
      requirement: "Read back the public reference product flow, Mass property, Units of mass group, and kg compatibility before activation or publication; reject wrong state, flow type, classification, property, unit group, or a narrower proxy."
      evidence: "Tiangong identity readback retained outside PCR content"
validation_rules:
  - rule_id: validate_product_identity
    applies_to: "Reference product"
    rule: "Fail conformance when architecture, processor arrangement, housing form, exact in-housing storage/input/output combination including explicit absence, configuration id, intended use, included accessories, or net unit mass is missing."
    source_ids:
      - un-cpc-3-2025
      - energy-star-computers-9-2025
  - rule_id: validate_residual_class_scope
    applies_to: "CPC classification"
    rule: "Reject portable machines, machines containing CPU plus input and output in the same housing, machines presented as systems, separately supplied input/output or storage units, other ADP units, parts, and more specifically classified telecommunications, consumer-electronics, or industrial-control products."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_no_leaf_extrapolation
    applies_to: "Dataset representativeness"
    rule: "Reject an unqualified CPC-leaf result derived from one server, workstation, thin client, appliance, embedded device, or other narrow design. A family result requires separate configuration results and audited production-mass weights."
    source_ids:
      - energy-star-computers-9-2025
  - rule_id: validate_reference_flow
    applies_to: "Quantitative reference"
    rule: "Require exactly 1 kg net finished product using flow ea5779a6-4214-400c-b380-155efbd5b98e, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg; require corresponding measured machine count and exclude packaging and separately supplied accessories from net mass."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "Foreground inventory"
    rule: "Require component receipt and kitting, board and system integration, configuration and testing, and finishing and gate-release inventories, with explicit non-applicability only for conditional board mounting, burn-in, rework, and direct-release rows."
    source_ids:
      - itu-l1410-2024
  - rule_id: validate_housing_unit_combination
    applies_to: "Configuration BOM"
    rule: "Require separate storage, input, and output unit fields with installed count, specification, mass, and explicit absence; reject a generic statement that does not identify the same-housing combination."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_transfer_and_mass_balance
    applies_to: "Foreground processes"
    rule: "Require configuration-specific unit-transfer reconciliation and material mass balance within documented uncertainty; investigate and disclose every residual and stock change."
    source_ids:
      - itu-l1410-2024
  - rule_id: validate_test_records
    applies_to: "Configuration and testing"
    rule: "Require version-controlled test profile, firmware or operating environment, test duration, energy method, pass/fail result, failures, and rework. ENERGY STAR or ECMA procedures may support only products within their stated scope and shall not be treated as leaf-wide energy factors."
    source_ids:
      - energy-star-computers-9-2025
      - ecma-383-2010
  - rule_id: validate_allocation
    applies_to: "Shared operations"
    rule: "Require direct subdivision or a documented causal allocation driver; require separate configuration calculations before family aggregation and reject unexplained mass or economic allocation."
    source_ids:
      - ec-pef-method-2021
      - itu-l1410-2024
  - rule_id: validate_source_and_proxy_traceability
    applies_to: "Upstream and calculated rows"
    rule: "Require every non-default method, factor, or scenario to reference a listed source id; require every calculated foreground row to link to a collection protocol; disclose each proxy and mismatch."
    source_ids:
      - ec-pef-method-2021
      - itu-l1410-2024
  - rule_id: validate_data_quality
    applies_to: "Dataset profile"
    rule: "Require temporal, site, configuration, technology, geography, measurement, completeness, uncertainty, and production-mass coverage disclosures sufficient for independent verification."
    source_ids:
      - ec-pef-method-2021
      - itu-l1410-2024
published_dataset_profile:
  dataset_role: "Configuration-specific foreground manufacturing data package for an in-scope automatic data processing machine at the producer gate"
  downstream_use: "secondary_dataset; background_dataset; input to process and lifecyclemodel projections"
  allowed_use: "Modelling the declared architecture and saleable configuration, or a transparently production-mass-weighted family whose configuration population, site, period, and producer-gate boundary match the study"
  excluded_use: "Unqualified CPC-leaf averages; extrapolation from one server, workstation, thin client, appliance, embedded device, or other narrow design; use-phase or end-of-life claims without explicit extension; products in a more specific classification subclass"
  required_metadata: "PCR id and version; CPC context; architecture; processor arrangement; housing; in-housing storage/input/output presence and specification; memory; accelerators and expansion; power and cooling; firmware or operating environment; intended workload and use; configuration id; included accessories; net unit mass and machine count; site and period; boundary; allocation; configuration coverage; sources, proxies, and Tiangong UUID readback status"
  required_quality_disclosure: "Configuration and production-mass coverage; site and temporal coverage; measurement and calculation methods; calibration and uncertainty; BOM, unit, mass, energy, yield, rework, waste, and stock reconciliation; upstream dataset and proxy quality; omitted flows and expected effect; allocation drivers"
  update_trigger: "Change in architecture, processor, memory, storage/input/output combination, accelerator or expansion, power supply, cooling, firmware or operating environment, intended use, BOM, supplier or upstream dataset, manufacturing site or process, test profile, yield or rework, packaging, allocation, production mix, or any material input, waste, or direct release"
