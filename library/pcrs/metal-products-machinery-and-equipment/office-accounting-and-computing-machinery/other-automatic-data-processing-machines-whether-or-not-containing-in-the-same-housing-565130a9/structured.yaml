measurement_rules:
  - id: reference_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report exactly 1 kg net mass of conforming finished machine, excluding transport packaging and separately supplied accessories; retain measured net mass per physical machine and the corresponding machine count."
  - id: component_mass
    applies_to: "Components, subassemblies, consumables, products, and wastes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve measured mass by material or component identity and configuration; do not convert item counts to mass without a configuration-specific measured or supplier-declared mass."
  - id: electricity_measurement
    applies_to: "Assembly, configuration, testing, rework, and finishing electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use calibrated meter readings or reconciled equipment power and operating time; keep facility electricity separate from test-device use-phase electricity."
  - id: unit_to_mass_normalization
    applies_to: "Physical machine output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Divide configuration-specific batch inputs and outputs by measured conforming net output mass; separately report units produced so unlike machine configurations are not silently averaged."
