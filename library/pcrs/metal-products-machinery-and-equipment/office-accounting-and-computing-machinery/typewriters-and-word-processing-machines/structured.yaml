allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared_processes"
    rule: "Avoid allocation through subdivision where feasible. Otherwise use a demonstrated physical relationship; justify an economic or other relationship when physical causality cannot be established. Disclose the method consistently."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_site
    applies_to: "assembly_overhead"
    rule: "Use measured line energy or validated operating-time shares for shared electricity. Include rework in the accepted output denominator; do not allocate burdens to unaccepted rejects as saleable machines."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "Record waste mass and treatment separately. Do not deduct an assumed recycling credit from measured assembly exchanges; disclose any downstream recycling model separately."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "machine_assembly"
      flow_role: "Component, packaging and reference mass"
      record_type: "BOM and batch acceptance"
      raw_fields: "model, component code, issued/returned kg, stock change, accepted count, net kg per machine, included subcomponents"
      collection_method: "Weigh representative model components and reconcile issued material with stores and accepted production"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Declared representative production period"
      site_scope: "Declared assembly site"
      aggregation_rule: "Net issued kg divided by accepted net output kg; output kg is count times measured kg per machine"
      quality_evidence: "Calibrations, BOM revision and test acceptance records"
    - protocol_id: cp_energy
      process_id: "machine_assembly"
      flow_role: "Assembly electricity"
      record_type: "Submeter and facility invoice"
      raw_fields: "meter id, start/end kWh, line hours, facility total, allocation share, output kg"
      collection_method: "Meter the line; reconcile overhead shares to the facility total"
      unit: "MJ"
      frequency: "Each batch or reconciled reporting period"
      temporal_coverage: "Same period as production"
      site_scope: "Same site"
      aggregation_rule: "Net kWh times 3.6 divided by accepted output kg"
      quality_evidence: "Meter calibration, invoices and allocation rationale"
    - protocol_id: cp_waste
      process_id: "machine_assembly"
      flow_role: "Segregated rejects"
      record_type: "Weigh tickets and transfer notes"
      raw_fields: "stream id, material, hazardous status, kg, date, destination, stock change, output kg"
      collection_method: "Weigh each waste stream separately; reconcile dispatch and storage changes"
      unit: "kg"
      frequency: "Each dispatch and batch reconciliation"
      temporal_coverage: "Same production period"
      site_scope: "Same site"
      aggregation_rule: "Generated waste kg divided by accepted output kg"
      quality_evidence: "Scale records, transfer notes and destination evidence"
  calculation_rules:
    - id: normalize_batch
      applies_to: "All exchanges"
      rule: "q = Q / M; M = accepted count × measured net kg per machine; preserve stock-change reconciliation"
      inputs:
        - Q
        - M
      output: "quantity per kg accepted machine"
      source_ids: []
    - id: electricity_mj
      applies_to: "Electricity"
      rule: "MJ = kWh × 3.6"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: complete_bom
      applies_to: "Material coverage"
      requirement: "Reconcile the complete model BOM against incoming components, net output, rejects and stock changes; investigate unexplained residuals. Add actual missing atomic exchanges before dataset completion."
      evidence: "cp_material and cp_waste reconciliation"
    - id: primary_records
      applies_to: "All rows"
      requirement: "Retain original site records, calibration, uncertainty and representativeness; missing data is not zero."
      evidence: "Collection protocols and supplier evidence"
    - id: configuration
      applies_to: "Variants"
      requirement: "Keep mechanical, electric and electronic configurations distinct in data collection; use production-weighted aggregation only with disclosed shares."
      evidence: "Model records and production shares"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_flow"
    rule: "Require all reference qualifiers, positive accepted mass and measured count-to-mass conversion."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "inventory"
    rule: "Check BOM closure and every inclusion condition; no blanket zero for absent UUIDs, no combined utilities, and no duplicate assembly/subcomponent burdens."
    source_ids: []
  - rule_id: validate_units
    applies_to: "amounts"
    rule: "Check kg and MJ normalization, protocol links, reporting periods and waste direction; reference_product must equal 1 kg."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "dataset_claims"
    rule: "Reject a full-life-cycle comparison based only on this partial module; disclose upstream gaps and downstream scenarios."
    source_ids: []
