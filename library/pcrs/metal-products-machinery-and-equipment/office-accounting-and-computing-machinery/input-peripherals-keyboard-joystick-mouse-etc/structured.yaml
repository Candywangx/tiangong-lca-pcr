system_boundary:
  rules:
    - rule_id: boundary_production
      applies_to: "assembly"
      rule: "Include component receipt, assembly, functional test, packing, rework electricity and manufacturing rejects. Supplier moulding, board fabrication and soldering stay in linked component datasets when already included."
      source_ids:
        - logitech-product-lifecycle-approach
    - rule_id: boundary_extension
      applies_to: "dataset"
      rule: "Add product distribution, use/recharging, replacement batteries and end-of-life in separately declared downstream scenarios before a full life-cycle claim. Do not report this assembly module as such a claim."
      source_ids:
        - logitech-carbon-impact-methodology
    - rule_id: boundary_completeness
      applies_to: "assembly"
      rule: "Reconcile every BOM item and every site exchange to an atomic inventory row or a documented upstream inclusion. The listed conditional rows are a starting inventory, not permission to omit keycaps, feet, receivers or non-ABS housings. Add actual part-specific exchanges before dataset acceptance. Wet cleaning, soldering or moulding on site requires an expanded process map with each chemical, utility, waste and emission separately recorded."
      source_ids:
        - logitech-product-lifecycle-approach
boundary_abstraction:
