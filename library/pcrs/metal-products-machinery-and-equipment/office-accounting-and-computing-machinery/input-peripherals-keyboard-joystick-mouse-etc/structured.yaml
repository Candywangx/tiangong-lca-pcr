allocation_rules:
  - rule_id: allocation_shared
    applies_to: "assembly"
    rule: "Separate model-specific operations by submetering or engineering records. For remaining common loads, use a demonstrated physical driver such as measured test-station time; use economic allocation only when physical relationships cannot be justified, with sensitivity and rationale disclosed."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_recycling
    applies_to: "assembly"
    rule: "Use a disclosed recycled-content convention for linked material datasets and manufacturing scrap. Keep treatment and recovery burdens explicit; do not automatically subtract hypothetical virgin-material credits from assembly electricity or component quantities."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "Components, electricity, accepted output and board waste"
      record_type: "BOM; stock ledger; meter; test log; waste transfer"
      raw_fields: "model; part_id; issued/returned counts; kg/item; opening/closing stocks; meter readings; test time; accepted count/net mass; rejected count; waste kg; supplier boundary"
      collection_method: "Weigh representative parts with calibrated balance; reconcile material ledger, accepted-device tests and waste tickets; submeter electricity"
      unit: "kg; item; kWh; station-hour"
      frequency: "Each production lot; meter at shift boundaries"
      temporal_coverage: "Declare consecutive production period covering normal load, changeovers and rejects; justify representativeness"
      site_scope: "Named assembly site and declared model revision"
      aggregation_rule: "Sum net consumption and attributable energy over same period; divide by accepted net output kg"
      quality_evidence: "Calibration; invoices; BOM revision; acceptance tests; meter logs; supplier declarations; waste tickets"
  calculation_rules:
    - id: normalize
      applies_to: "assembly"
      rule: "q_i = net consumed quantity_i / accepted net device mass. Reconcile net consumption using issues, returns and stock changes; do not subtract the same return twice. For the reference output q = M/M = 1."
      inputs:
        - "cp_assembly records"
        - "accepted mass M > 0"
      output: "kg/kg, Item(s)/kg or MJ/kg"
      source_ids: []
    - id: electricity_basis
      applies_to: "electricity"
      rule: "q_E = (meter kWh assigned to model × 3.6) / M; allocation shares must sum to unity over all products served."
      inputs:
        - "Meter differences"
        - "physical allocation driver"
        - M
      output: "MJ/kg"
      source_ids: []
  data_quality_requirements:
    - id: quality_coverage
      applies_to: "assembly"
      requirement: "Document technological, temporal and geographic representativeness, completeness and reliability. Retain primary measurement evidence for owned assembly operations."
      evidence: "ghg-protocol-product-standard-2011; cp_assembly"
    - id: quality_bom
      applies_to: "assembly"
      requirement: "Reconcile full device mass and packaging separately to the BOM; identify missing exchanges and upstream overlaps before acceptance. Missing data are not zero."
      evidence: "cp_assembly"
    - id: quality_ranges
      applies_to: "assembly"
      requirement: "Collect actual amounts. No external numerical range is prescribed; do not transfer a single model carbon footprint into component or energy ranges."
      evidence: "cp_assembly"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Require one model, all reference qualifiers, accepted mass greater than zero and declared kg/item conversion. Reject cross-device comparisons based only on mass."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "assembly"
    rule: "Every applicable exchange must be one physical flow with a resolved or explicitly unresolved identity. Demonstrate absence for conditional rows not used. Require complete BOM and stock/output/waste reconciliation; investigate discrepancies against documented instrument uncertainty rather than an invented tolerance."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "dataset"
    rule: "Require upstream links, no component double counting and separate disclosure of gate-to-gate scope. A complete product footprint additionally requires downstream transport, use and end-of-life scenarios."
    source_ids:
      - logitech-carbon-impact-methodology
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Assembly module for a declared peripheral model; link upstream manufacture and downstream lifecycle scenarios"
  allowed_use: "Production data package and process/lifecyclemodel projections with matching model and boundary"
  excluded_use: "Unqualified full-life-cycle claims; direct ranking of keyboards against mice or joysticks; substitution for semiconductor or polymer manufacture"
  required_metadata: "Model; BOM version; site; year; technology; output basis; component dataset links; grid; allocation; conditional-route decisions"
  required_quality_disclosure: "Measurement provenance; completeness; representativeness; unresolved identities; omitted operations; uncertainty and absence of external ranges"
  update_trigger: "Model/BOM, battery, supplier, site, test programme, energy mix or waste route change"
