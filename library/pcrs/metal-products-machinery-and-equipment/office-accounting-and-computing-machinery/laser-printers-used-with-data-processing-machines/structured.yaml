        - lexmark-m5163-lca-2024
    - rule_id: boundary_components
      applies_to: "purchased modules"
      rule: "Define the print engine as one purchased electromechanical assembly. Record its included chassis, drive, fuser, optical unit and wiring on a supplier BOM. Separately supplied housing, controller, power supply and cartridge must not also be included in the engine dataset. Add individually identified extra components and packaging when the actual BOM requires them."
