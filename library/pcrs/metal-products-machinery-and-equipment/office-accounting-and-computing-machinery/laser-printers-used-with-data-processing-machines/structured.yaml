allocation_rules:
  - rule_id: allocation_factory
    applies_to: "shared assembly line"
    rule: "Use line submetering and configuration-specific withdrawals first. For inseparable shared electricity, allocate using logged equipment time multiplied by measured operating power and reconcile shares to the meter total under cp_factory. Disclose the driver and sensitivity; device mass alone is not an energy driver."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "rework and waste"
    rule: "Charge actual reject and rework burdens to accepted production. Retain waste treatment burdens without speculative avoided-virgin-material credits. Record any saleable co-product separately and justify a specific allocation rule before using the dataset."
    source_ids:
      - lexmark-m5163-lca-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom
      process_id: "assembly_test_pack"
      flow_role: "component inputs and product output"
      record_type: "BOM and scales"
      raw_fields: "part number; configuration; received/issued/returned stock; component mass; accepted counts; net product mass; starter fill"
      collection_method: "Trace serial/BOM revisions to calibrated weighing and stock movements"
      unit: "kg; item"
      frequency: "Each lot and BOM revision"
      temporal_coverage: "One disclosed representative production year, or justified shorter full campaign"
      site_scope: "Declared factory and supplier modules"
      aggregation_rule: "Net withdrawals divided by accepted net product kg; avoid nested BOM overlap"
      quality_evidence: "BOM; calibration; stock reconciliation"
    - protocol_id: cp_factory
      process_id: "assembly_test_pack"
      flow_role: "electricity and test paper"
      record_type: "meter and test log"
      raw_fields: "kWh start/end; machine time and power; idle periods; test sheets; area; grammage; configuration; retests"
      collection_method: "Submeter line and test station; record warm-up and retest cycles; weigh paper"
      unit: "kWh; h; W; kg"
      frequency: "Each shift and test campaign"
      temporal_coverage: "Same period as cp_bom"
      site_scope: "Assembly and test stations"
      aggregation_rule: "Sum actual attributable consumption then divide by accepted net kg"
      quality_evidence: "Meter calibration; power-time reconciliation; test settings"
    - protocol_id: cp_waste
      process_id: "assembly_test_pack"
      flow_role: "paper and rejected printer waste"
      record_type: "weighbridge and waste manifests"
      raw_fields: "stream identity; mass; toner content; stock change; recovered/reworked status; receiver and treatment route"
      collection_method: "Weigh segregated streams and reconcile disposal documents"
      unit: "kg"
      frequency: "Each dispatch and monthly reconciliation"
      temporal_coverage: "Same period as cp_bom"
      site_scope: "Factory waste exit"
      aggregation_rule: "Mass leaving factory divided by accepted net product kg; exclude internal rework transfer"
      quality_evidence: "Waste tickets; receiver records; inventory balance"
  calculation_rules:
    - id: normalize
      applies_to: "all rows"
      rule: "Q_ref = Q_attributable / M_accepted; M_accepted = sum of accepted device counts times measured net kg/device. Reference output equals 1 kg by normalization."
      inputs:
        - cp_bom
        - cp_factory
        - cp_waste
      output: "kg or MJ per kg printer"
      source_ids: []
    - id: energy
      applies_to: "electricity"
      rule: "E_MJ = 3.6 × metered kWh. Retain actual test duty; do not substitute weekly TEC or rated maximum power for measured factory energy."
      inputs:
        - cp_factory
      output: "MJ/kg"
      source_ids:
        - epa-imaging-equipment-v3-2-2021
    - id: mass_reconcile
      applies_to: "physical materials"
      rule: "Reconcile net material inputs against product, segregated wastes and inventory change; explain residuals against measurement uncertainty. Packaging accompanies the shipment but is excluded from reference product mass."
      inputs:
        - cp_bom
        - cp_waste
      output: "documented balance"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "supplier data"
      requirement: "Verify purchased assembly state and component coverage; never substitute primary polymer for a moulded housing or a complete printer for its engine."
      evidence: "cp_bom"
    - id: quality_period
      applies_to: "all activity data"
      requirement: "Align site and reporting period; disclose sampling, missing meters, allocation, upstream proxies and unmeasured direct releases. No measured record means unknown, not zero."
      evidence: "cp_factory; cp_waste"
    - id: quality_evidence
      applies_to: "ranges and literature"
      requirement: "Do not transfer case values across configurations. No external amount ranges are prescribed; collect primary values. The Lexmark report has inconsistent single-function/multifunction wording on page 3, so that passage is not used to define this category."
      evidence: "lexmark-m5163-lca-2024"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require all reference qualifiers, positive accepted output and a measured net count-to-mass conversion. Reject multifunction or non-laser technology under this identity."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_inventory
    applies_to: "inventory"
    rule: "Every included exchange needs an amount, unit, protocol evidence and consistent denominator. Check conditional applicability, BOM coverage, mass residuals and electricity allocation reconciliation. Unresolved flow or supplier identity must remain explicit."
    source_ids: []
  - rule_id: validate_claim
    applies_to: "dataset claim"
    rule: "A manufacturing result must not claim lifetime printing-service equivalence. A cradle-to-gate claim requires complete supplier and treatment links; omitted actual exchanges make completeness inconclusive."
    source_ids:
      - lexmark-m5163-lca-2024
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset; process; lifecyclemodel"
  allowed_use: "Manufacturing input for matching laser-printer configuration, geography and technology; service model only after adding use, consumables, distribution and end-of-life"
  excluded_use: "Multifunction or inkjet manufacturing; direct service comparison per kg; certification or full lifecycle claims from this foreground inventory alone"
  required_metadata: "All reference qualifiers; factory; time; BOM version; upstream supplier coverage; allocation; boundary"
  required_quality_disclosure: "Measured versus estimated values; missing UUIDs and links; conditional applicability; uncertainty; excluded life stages; unresolved ranges"
  update_trigger: "BOM, technology, supplier, factory, packaging, test duty or measurement method changes"
