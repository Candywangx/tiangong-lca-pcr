system_boundary:
  rules:
    - rule_id: boundary_factory
      applies_to: "foreground route"
      rule: "Include incoming component supply burdens, inbound freight links, assembly electricity, factory testing, packing and treatment links for factory waste. Exclude downstream distribution, customer paper, replacement consumables and use electricity from this manufacturing result; disclose these exclusions."
