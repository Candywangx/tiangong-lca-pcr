      collection_method: "Weigh separately; reconcile acceptance, rework and dispatch records"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same complete production period"
      site_scope: "Assembly site and waste consignee"
      aggregation_rule: "Each output mass / accepted net scanner kg"
      quality_evidence: "Test reports; scale checks; waste transfer records"
  calculation_rules:
    - id: normalize_period
      applies_to: "all_rows"
      rule: "q_i = Q_i / M_good; M_good = accepted count × measured net kit mass. Use inventory-adjusted consumption, including failed-unit inputs."
