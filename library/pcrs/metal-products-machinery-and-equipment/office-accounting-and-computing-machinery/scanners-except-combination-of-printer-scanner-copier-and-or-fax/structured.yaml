allocation_rules:
  - rule_id: subdivide_first
    applies_to: "shared_operations"
    rule: "Use dedicated line records first. Allocate remaining shared burdens using demonstrated physical drivers; justify economic allocation only where a physical relationship cannot be established."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: reject_accounting
    applies_to: "rejects"
    rule: "Carry test and rework burdens into accepted output. Do not allocate a negative burden to discarded scanners or ancillary shipping boxes. Document waste treatment separately and prevent duplicate recycling credits."
    source_ids:
      - ghg-protocol-product-standard-2011
