functional_unit:
  what: "Provide the production inventory of a printer accepting electronic input and producing specified printed output"
  how_much: "Declared production unit: 1 kg net configured printer; one printer equals its measured net mass m kg"
  how_well: "Declare model, media format, resolution, colour capability, duplexing and acceptance test; mass alone does not establish functional equivalence"
  how_long_or_cycle: "One declared production reporting period. A downstream service comparison must independently declare lifetime, page count, print coverage and duty cycle"
  reference_flow_link: "All production amounts divided by accepted net printer output Q kg; multiply by m for one printer. This is not a lifetime printing-service functional unit"
system_boundary:
  rules:
    - rule_id: production_boundary
      applies_to: "foreground"
      rule: "Include purchased component assembly, production support, priming, test rework and packing; disclose exclusions and retain upstream dataset links for each purchased flow."
      source_ids:
        - ghg-protocol-product-standard
    - rule_id: component_boundary
      applies_to: "purchased_parts"
      rule: "Supplier datasets must include the actual supplied state: moulding for housing, forming for chassis, mounted components for the controller and fabrication for the printhead. Raw resin, sheet steel or a bare board cannot substitute for finished components."
      source_ids: []
    - rule_id: lifecycle_extension
      applies_to: "downstream_use"
      rule: "Distribution, customer electricity, replacement ink and paper, maintenance and end-of-life are outside this production module and must be added for a full lifecycle. Do not claim full-product footprint or service equivalence from production-only results."
      source_ids:
        - ghg-protocol-product-standard
    - rule_id: ink_boundary
      applies_to: "priming_testing"
      rule: "Include measured factory priming and test ink. Page-yield labels do not quantify factory consumption; retained purge ink is not an air emission."
      source_ids:
        - epson-ink-yields
