allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared_operations"
    rule: "Subdivide directly measured operations first. Allocate remaining shared production electricity with a documented causal driver such as metered machine time; use economic allocation only if physical relationships cannot be established, and disclose sensitivity."
    source_ids:
      - ghg-protocol-product-standard
  - rule_id: reject_burden
    applies_to: "rejects_rework"
    rule: "Retain failed-test and rework burdens in the accepted-output denominator. Internal transfer carries its upstream burden once. Waste without economic value receives no production allocation; report treatment and any recycling convention explicitly, without an automatic avoided-production credit."
    source_ids:
      - ghg-protocol-product-standard
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly_test
      process_id: "assembly_test"
      flow_role: "Each component, ink, paper, electricity, transfer and waste row"
      record_type: "BOM, meters, batch and waste records"
      raw_fields: "part identity; supplier state; quantity; stock change; net unit mass; accepted and rejected count; meter readings; test ink split; destination; time"
      collection_method: "Weigh components and outputs; reconcile purchase and issue records; read calibrated electricity meter; retain full BOM and test logs"
      unit: "kg; MJ"
      frequency: "Each batch and meter interval"
      temporal_coverage: "One declared representative reporting period including normal losses and rework"
      site_scope: "Named assembly plant and supplier interfaces"
      aggregation_rule: "Sum net quantities by atomic identity; divide by Q; reconcile internal transfers and stock"
      quality_evidence: "Calibration; invoices; supplier BOM; test acceptance; waste receipts; mass closure"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "Transfer, box, film and accepted output"
      record_type: "Packing and dispatch records"
      raw_fields: "incoming printer mass; output count and net mass; box and film mass; losses; inventory"
      collection_method: "Weigh individual packing components; reconcile dispatch count and accepted printer mass"
      unit: "kg"
      frequency: "Each dispatch batch"
      temporal_coverage: "Same reporting period as assembly"
      site_scope: "Named packing plant"
      aggregation_rule: "Net packaging issued divided by Q; packaging excluded from Q"
      quality_evidence: "Scales; packing BOM; dispatch reconciliation"
  calculation_rules:
    - id: normalization
      applies_to: "All exchanges"
      rule: "q_i = A_i / Q; Q = sum of accepted shipped net configured printer mass. Keep the same reporting period and account for inventory changes."
      inputs:
        - A_i
        - Q
      output: "Quantity per kg printer"
      source_ids: []
    - id: unit_conversion
      applies_to: "One printer"
      rule: "q_item = q_i × m"
      inputs:
        - q_i
        - m
      output: "Quantity per configured printer"
      source_ids: []
    - id: paper_conversion
      applies_to: "Test paper"
      rule: "Paper kg = sheet count × area in m2 × grammage in g/m2 / 1000"
      inputs:
        - Count
        - area
        - grammage
      output: "kg"
      source_ids: []
  data_quality_requirements:
    - id: bom_closure
      applies_to: "Purchased assemblies"
      requirement: "Reconcile full component mass plus shipped ink against net printer mass. Document boundaries of each assembly and add missing concrete exchanges before dataset completion; do not invent a balancing flow."
      evidence: "Supplier BOM and weighing records"
    - id: period_scope
      applies_to: "All rows"
      requirement: "Retain geography, technology, measurement uncertainty and period. Distinguish measured zero, absent exchange and missing data. No unsupported external ranges are prescribed."
      evidence: "Linked collection protocols"
    - id: ink_closure
      applies_to: "Ink"
      requirement: "Reconcile issued ink with shipped ink, printed test deposition, captured purge and stock change. Add separately measured discarded ink or pads when exported."
      evidence: "Ink balance and waste receipts"
validation_rules:
  - rule_id: identity_check
    applies_to: "reference_flow"
    rule: "Reject missing model qualifiers or a multifunction/non-inkjet product. Verify reference product state, net mass and the item-to-mass conversion."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: inventory_check
    applies_to: "inventory"
    rule: "Require one atomic exchange per row, matching property and unit, a linked protocol and either verified UUID or an explicit unresolved identity. Check complete BOM, positive Q and internal transfer balance."
    source_ids: []
  - rule_id: boundary_check
    applies_to: "dataset"
    rule: "Reject duplicate component/upstream burdens, packaging included in net reference mass, or production-only results labelled as a full lifecycle. Record external range evidence needs without fabricated bounds."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset; process; lifecyclemodel"
  allowed_use: "Factory production module for the declared configuration; upstream-linked production modelling after completeness checks"
  excluded_use: "Standalone comparative service claims; complete product footprints without use and end-of-life; extrapolation to multifunction or remanufactured devices"
  required_metadata: "All reference qualifiers; BOM; supplier links; production period; measurement and allocation methods; boundaries"
  required_quality_disclosure: "UUID gaps; omitted exchanges; upstream coverage; uncertainty; unresolved range evidence; data representativeness"
  update_trigger: "Model, configuration, supplier, process, grid or packaging change; new primary evidence"
