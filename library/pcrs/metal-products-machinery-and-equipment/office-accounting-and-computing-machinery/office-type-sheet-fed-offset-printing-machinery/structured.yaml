allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Shared assembly, testing, inspection, or packing operations"
    rule: "First avoid allocation by process subdivision, sub-metering, lot records, and product-specific bills of material."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_physical_driver
    applies_to: "Residual shared foreground burdens"
    rule: "When subdivision is not feasible, use a documented physical causal driver such as machine-specific assembly hours, powered test time, or packaging-line time; apply the same method to similar inputs and outputs and disclose the choice."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_no_waste_credit
    applies_to: "Waste paper, waste ink, and returned materials"
    rule: "Report waste quantities and treatment datasets separately; do not subtract avoided burdens or recycling credits unless a separately declared study method requires them and the result is reported transparently."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: allocation_rework
    applies_to: "Reworked or failed machines"
    rule: "Attribute additional materials, energy, test consumables, and wastes to the production lot that caused them; divide the reconciled lot total only across conforming machines."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_input_mass_records
      process_id: "final_assembly_test_pack"
      flow_role: "mechanical subassembly and electronic control unit"
      record_type: "receiving, bill-of-material, and issue record"
      raw_fields: "supplier item id; lot id; units issued; measured item mass; returns; conforming machine count"
      collection_method: "Reconcile receiving and production-issue records to product bills of material; verify representative item masses by calibrated scale"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "At least one representative production year or the declared shorter production period"
      site_scope: "All final manufacturing lines in the declared dataset site scope"
      aggregation_rule: "Sum net issued mass and divide only by conforming machines from the same reconciled lot"
      quality_evidence: "Supplier specification; bill of material; scale calibration; lot reconciliation"
    - protocol_id: cp_electricity_records
      process_id: "final_assembly_test_pack"
      flow_role: "purchased electricity"
      record_type: "electricity meter and production-time record"
      raw_fields: "meter start; meter end; kWh; line status; machine model; conforming units; downtime"
      collection_method: "Prefer sub-metering; otherwise allocate site-meter electricity with a documented physical driver and subtract only separately metered excluded loads"
      unit: "kWh and MJ"
      frequency: "each production shift or lot"
      temporal_coverage: "At least one representative production year or the declared shorter production period"
      site_scope: "Assembly, test, inspection, and packing loads in scope"
      aggregation_rule: "Convert net kWh to MJ and divide reconciled energy by conforming machines"
      quality_evidence: "Meter id; calibration or utility check; timestamp coverage; allocation record"
    - protocol_id: cp_consumable_issue_return
      process_id: "final_assembly_test_pack"
      flow_role: "lubricating oil and planographic printing ink"
      record_type: "stores issue, return, and residual record"
      raw_fields: "material id; formulation or grade; issued mass; clean return mass; waste mass; lot id; machine count"
      collection_method: "Weigh or use traceable inventory issue and return records for the same production lot"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "At least one representative production year or the declared shorter production period"
      site_scope: "All in-scope assembly and test stations"
      aggregation_rule: "Net consumption equals issued mass minus uncontaminated returned mass; reconcile retained product and waste destinations"
      quality_evidence: "Calibrated scale or inventory system; material specification; issue-return reconciliation"
    - protocol_id: cp_test_paper_records
      process_id: "final_assembly_test_pack"
      flow_role: "uncoated woodfree test paper"
      record_type: "test sheet issue and count record"
      raw_fields: "paper id; sheet length; sheet width; grammage; sheet count; issued mass; returned mass; waste mass; machine id"
      collection_method: "Weigh sheets or calculate mass from verified dimensions, grammage, and count; reconcile to waste and retained samples"
      unit: "kg"
      frequency: "each acceptance test"
      temporal_coverage: "All tests represented by the dataset"
      site_scope: "All in-scope functional-test stations"
      aggregation_rule: "Sum paper fed per conforming machine and reconcile outputs"
      quality_evidence: "Paper specification; scale calibration or grammage certificate; test log; mass reconciliation"
    - protocol_id: cp_packaging_mass_records
      process_id: "final_assembly_test_pack"
      flow_role: "corrugated-board box, solid-wood pallet, and polyethylene stretch film"
      record_type: "packaging bill, issue, and measured-mass record"
      raw_fields: "component id; material; units; unit mass; reuse status; package design revision; machine id"
      collection_method: "Record each packaging component separately from the approved package bill and verify unit mass by calibrated scale"
      unit: "kg"
      frequency: "each package design revision and production lot"
      temporal_coverage: "Package designs used during the declared production period"
      site_scope: "All packaging stations in scope"
      aggregation_rule: "Sum installed mass of each atomic packaging component per packaged conforming machine"
      quality_evidence: "Package specification; supplier record; scale calibration; design revision"
    - protocol_id: cp_waste_mass_records
      process_id: "final_assembly_test_pack"
      flow_role: "waste paper and waste ink"
      record_type: "waste container and transfer record"
      raw_fields: "waste id; gross mass; tare; net mass; contamination; hazard code; destination; lot id"
      collection_method: "Weigh each waste stream separately and reconcile shared containers to the covered production lot"
      unit: "kg"
      frequency: "each waste transfer, reconciled by lot or month"
      temporal_coverage: "Same period as represented production"
      site_scope: "All in-scope assembly, test, and packing areas"
      aggregation_rule: "Sum net mass by atomic waste stream and divide by conforming machines using the declared physical driver"
      quality_evidence: "Scale calibration; transfer note; treatment acceptance; reconciliation"
    - protocol_id: cp_reference_product_mass
      process_id: "final_assembly_test_pack"
      flow_role: "conforming complete machine"
      record_type: "final inspection and net-mass record"
      raw_fields: "serial number; model; configuration; net mass; packaging mass; acceptance status; release date"
      collection_method: "Weigh the complete machine before shipping packaging or use an audited configuration mass balance"
      unit: "kg"
      frequency: "each configuration and whenever the bill of material changes"
      temporal_coverage: "Configurations produced during the declared period"
      site_scope: "All final release stations in scope"
      aggregation_rule: "Use the measured or audited net mass of each represented conforming configuration"
      quality_evidence: "Scale calibration; signed inspection record; bill-of-material revision; packaging exclusion check"
  calculation_rules:
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "electricity_MJ = net_metered_kWh × 3.6"
      inputs:
        - "net metered kWh attributable to the covered lot"
      output: "MJ per conforming complete machine"
      source_ids: []
    - id: calc_consumable_net
      applies_to: "lubricating_oil; planographic_printing_ink"
      rule: "net_consumed_mass = issued_mass - uncontaminated_returned_mass"
      inputs:
        - "issued mass"
        - "uncontaminated returned mass"
        - "conforming machine count"
      output: "kg consumed per conforming complete machine"
      source_ids: []
    - id: calc_test_paper_mass
      applies_to: "uncoated_woodfree_paper"
      rule: "when direct weighing is unavailable, paper_mass_kg = sheet_count × length_m × width_m × grammage_g_per_m2 / 1000"
      inputs:
        - "sheet count"
        - length
        - width
        - grammage
      output: "kg paper fed per conforming complete machine"
      source_ids: []
    - id: calc_waste_net_mass
      applies_to: "waste_paper; waste_ink"
      rule: "net_waste_mass = gross_container_mass - tare_mass"
      inputs:
        - "gross mass"
        - tare
        - "stream identity"
        - "conforming machine count"
      output: "kg waste per conforming complete machine"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Retain model, configuration, serial or batch identity, maximum unfolded sheet dimensions, and acceptance status; prove that the product meets the office-type sheet-fed offset boundary."
      evidence: "Product specification; acceptance record; CPC and HS boundary check"
    - id: dq_temporal
      applies_to: "All foreground rows"
      requirement: "Use records from one representative production year or disclose the exact shorter period and reasons; align numerator and conforming-unit denominator periods."
      evidence: "Dated meters, issue records, production logs, and waste transfers"
    - id: dq_completeness
      applies_to: "All foreground rows"
      requirement: "Reconcile bills of material, consumables, electricity, test paper, packaging, wastes, and conforming output; add any omitted actual exchange as one atomic row."
      evidence: "Signed reconciliation with explained residuals"
    - id: dq_geography_technology
      applies_to: "Upstream datasets"
      requirement: "Match production geography, supplier route, material grade, electricity mix, and technology year where material; disclose proxies and improvement plans."
      evidence: "Supplier records and upstream dataset metadata"
    - id: dq_measurement
      applies_to: "Mass and electricity records"
      requirement: "Use calibrated instruments or traceable invoices and retain unit conversions, tare corrections, and allocation calculations."
      evidence: "Calibration certificates, invoices, meter ids, and calculation workbook"
    - id: dq_significant_processes
      applies_to: "Dataset quality disclosure"
      requirement: "Report data sources, quality limitations, and planned improvements for significant inputs and processes."
      evidence: "Data quality assessment following the GHG Protocol Product Standard"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Product eligibility"
    rule: "Confirm offset printing technology, individual-sheet feed, office-type market description, and the 22 cm by 36 cm unfolded-sheet limit; fail if any criterion is absent or contradicted."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-exp-notes-2025
      - wco-hs-2007-844312
  - rule_id: validate_reference_flow
    applies_to: "Reference flow"
    rule: "Confirm one conforming complete machine, its actual net mass in kg, the exact reference-product UUID, and every required qualifier; confirm packaging mass is excluded from net machine mass."
    source_ids: []
  - rule_id: validate_inventory_atomicity
    applies_to: "Process inventory"
    rule: "Confirm every recorded row is one physical product, waste, or energy exchange with direction, type, property, unit, amount rule, basis, evidence, and protocol; reject umbrella or selector rows."
    source_ids: []
  - rule_id: validate_uuid_identity
    applies_to: "Tiangong-linked rows"
    rule: "Confirm each stored UUID remains public state-code 100 and matches baseName, Chinese baseName, flow type, classification, property, unit group, product state, and foreground qualifiers; keep unresolved rows blank."
    source_ids: []
  - rule_id: validate_electricity_coverage
    applies_to: "electricity"
    rule: "Confirm meter timestamps cover assembly, testing, inspection, and packing and that any shared-load allocation uses the declared physical driver."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: validate_test_mass_balance
    applies_to: "test paper and ink"
    rule: "Reconcile paper and ink inputs to waste, material retained in the shipped machine or test samples, and any separately identified outputs; add atomic output or elementary-flow rows for material residuals rather than hiding discrepancies."
    source_ids: []
  - rule_id: validate_period_alignment
    applies_to: "Foreground dataset"
    rule: "Confirm all numerators and the conforming-machine denominator cover the same site scope and period and that failed or reworked units are treated by the declared allocation rule."
    source_ids: []
  - rule_id: validate_range_status
    applies_to: "Important inventory flows"
    rule: "Confirm foreground measurements are used because no two-source empirical ranges were established; keep every range-evidence need unresolved until two independent boundary-compatible original sources are reviewed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product footprint modelling, supplier and design improvement, and downstream lifecycle models when product identity, factory-gate boundary, geography, technology, period, and allocation are compatible"
  excluded_use: "Whole-life performance claims; comparison with larger or non-offset printing equipment; operational energy or consumables; installation, maintenance, and end-of-life without separate downstream models"
  required_metadata: "Manufacturer; model and configuration; maximum unfolded sheet dimensions; number of colours or printing units; rated voltage and frequency; site and geography; production period; net machine mass; package design and mass; test recipe; data sources; allocation; unresolved identities"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; supplier-data representativeness; temporal, geographic, and technological limitations; proxies; exclusions; mass-balance residuals; range-evidence gaps"
  update_trigger: "Bill-of-material or package redesign; changed production site, electricity supply, test recipe, allocation, or supplier route; significant process change; resolved UUID or range evidence; more representative foreground data"
