product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.office-accounting-and-computing-machinery.office-type-sheet-fed-offset-printing-machinery"
  classification_refs: "CPC 3.0: 45150; HS 2007: 8443.12"
  covered_products: "Complete office-type offset printing machines that feed individual sheets not exceeding 22 cm by 36 cm in the unfolded state"
  excluded_products: "Reel-fed presses; larger industrial sheet-fed offset presses; non-offset and digital printing equipment; photocopiers and multifunction printers; ancillary printing machines; separately supplied parts"
  representative_product: "A complete small-format office-type sheet-fed offset printing machine with mechanical printing assembly and electronic controls"
  production_route: "Receipt of purchased mechanical and electronic assemblies; final assembly; lubricant filling; powered functional print test; inspection; packing"
  market_state: "Complete, tested, saleable machine at the manufacturer's factory gate; packaging is inventoried separately from machine net mass"
functional_unit:
  what: "Provision of a complete office-type machine capable of offset printing on individually fed sheets"
  how_much: "One complete machine"
  how_well: "Passes the manufacturer's documented acceptance test and is designed for unfolded sheets with one side not exceeding 22 cm and the other side not exceeding 36 cm"
  how_long_or_cycle: "One delivery at the factory gate; operational service life is outside this cradle-to-gate PCR"
  reference_flow_link: "Actual net machinery mass, in kg, required to provide one conforming complete machine"
system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "Foreground production"
      rule: "Include receipt of purchased assemblies and consumables, final assembly, lubricant filling, functional print testing, inspection, and packing through release of the saleable machine at the manufacturing factory gate."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_upstream_inputs
      applies_to: "Purchased inputs"
      rule: "Link every purchased component, consumable, electricity supply, and packaging input to an upstream dataset matching its declared geography, technology, and product state."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_exclusions
      applies_to: "Downstream and non-production activities"
      rule: "Exclude outbound distribution, installation, use, maintenance, consumable replacement during use, and end-of-life; disclose the cradle-to-gate limitation and do not imply whole-life performance."
      source_ids:
        - ghg-protocol-product-standard-2011
    - rule_id: boundary_product_identity
      applies_to: "Product eligibility"
      rule: "Accept only office-type sheet-fed offset machines within the 22 cm by 36 cm unfolded-sheet limit; reject larger, reel-fed, non-offset, digital, copying, multifunction, or ancillary machines."
      source_ids:
        - un-cpc-3-0-exp-notes-2025
        - wco-hs-2007-844312
    - rule_id: boundary_additional_exchanges
      applies_to: "Site-specific foreground inventory"
      rule: "Add any other actual exchange as its own atomic flow row when it crosses the declared boundary; do not combine materials, fuels, utilities, wastes, or emissions."
      source_ids: []
