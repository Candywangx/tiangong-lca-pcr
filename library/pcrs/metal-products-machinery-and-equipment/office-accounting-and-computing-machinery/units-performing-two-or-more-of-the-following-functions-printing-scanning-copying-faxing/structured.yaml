allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply the BOM and meter protocol to subdivide model-specific assembly and testing before allocating common resources. Allocate shared electricity by measured station energy or documented machine-time and power observations; disclose the driver and denominator. Do not divide a device's manufacturing burden among its functions and then add it again for each function."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Record rejects and external waste treatment without an automatic avoided-virgin-material credit. Internal rework remains in the same batch balance; only terminal saleable output enters the normalization denominator. Report any alternative recycling allocation separately with the selected downstream method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom
      process_id: "assembly_test"
      flow_role: "component, consumable and packaging exchanges"
      record_type: "BOM and stock records"
      raw_fields: "model; part number; material; quantity issued; returns; opening and closing stocks; component mass; supplier boundary; included subparts"
      collection_method: "Reconcile weighed BOM with warehouse issues and supplier invoices; retain cartridge residual-fill measurements"
      unit: "kg"
      frequency: "each model and batch"
      temporal_coverage: "Complete declared production period including rework"
      site_scope: "Assembly site and attributable subcontracted operations"
      aggregation_rule: "Net issues divided by accepted device mass; exclude embedded duplicates"
      quality_evidence: "Scale calibration; BOM revision; invoices; signed stock reconciliation"
    - protocol_id: cp_energy
      process_id: "assembly_test"
      flow_role: "electricity"
      record_type: "submeter records"
      raw_fields: "meter start and end; unit; station; model; time; grid region; voltage; shared-load allocation"
      collection_method: "Meter assembly and all function tests; document allocation where direct submetering is unavailable"
      unit: "MJ or kWh"
      frequency: "each batch or shift"
      temporal_coverage: "Same period as accepted output"
      site_scope: "Assembly and test stations plus attributable common loads"
      aggregation_rule: "Sum allocated energy divided by accepted device mass"
      quality_evidence: "Meter calibration and station-time logs"
    - protocol_id: cp_output
      process_id: "assembly_test"
      flow_role: "saleable device and waste"
      record_type: "acceptance and waste records"
      raw_fields: "serial count; configured net mass; tested functions; failed count; rework transfers; waste type and mass; destination"
      collection_method: "Weigh accepted devices and separate waste consignments; reconcile acceptance logs and waste transfer records"
      unit: "kg"
      frequency: "each batch and consignment"
      temporal_coverage: "Same period as input records"
      site_scope: "Assembly site gate"
      aggregation_rule: "Sum terminal outputs by exchange; normalize by accepted device mass"
      quality_evidence: "Test reports; weighbridge tickets; waste manifests; mass reconciliation"
  calculation_rules:
    - id: normalize
      applies_to: "inventory"
      rule: "q_i = period net exchange_i / period accepted net device mass; exclude recovered internal rework from terminal outputs"
      inputs:
        - cp_bom
        - cp_energy
        - cp_output
      output: "kg or MJ per kg device"
      source_ids: []
    - id: device_conversion
      applies_to: "count reporting"
      rule: "device count = accepted device mass / measured configured mass per device; separate models before averaging"
      inputs:
        - cp_output
      output: "count accompanying mass-based dataset"
      source_ids: []
    - id: mass_reconcile
      applies_to: "material balance"
      rule: "Opening stock + receipts = closing stock + accepted device mass + external packaging output + waste outputs + documented losses; avoid counting embedded cartridges twice"
      inputs:
        - cp_bom
        - cp_output
      output: "Signed balance with investigated discrepancy"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "reference product"
      requirement: "Document each supported function and test outcome; retain model, technology and installed options"
      evidence: "Product specification and acceptance test records; epa-imaging-equipment-v1-2"
    - id: completeness
      applies_to: "inventory"
      requirement: "Reconcile complete disjoint BOM and waste ledger. Record any additional material as an individual exchange; missing data must not become a zero"
      evidence: "cp_bom and cp_output"
    - id: representation
      applies_to: "upstream and energy"
      requirement: "Record data year, geography, technology, supplier state, allocation and dataset boundary; explain substitutions"
      evidence: "Supplier and meter records"
    - id: uncertainty
      applies_to: "amounts"
      requirement: "Use foreground uncertainty and measured variability; do not infer an empirical range from one device or from an energy-efficiency limit"
      evidence: "Calibration records, batch variability and uncertainty disclosure"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a reference definition missing its function combination, device configuration or kg-per-device conversion. Confirm that the selected device satisfies at least two functions under un-cpc-3-0-structure-2025."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Check complete BOM coverage, absence of duplicated subassemblies, cartridge depletion balance, positive accepted output and reconciliation of rework. Investigate balance residuals against documented measurement uncertainty; no arbitrary percentage tolerance is prescribed."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Require each inventory row's flow type, property and unit to agree with its selected identity. Missing flow identity or upstream dataset coverage must be disclosed and resolved before claiming complete database-linked coverage."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Check that all records share the declared production period and boundary; factory-gate results must not be advertised as whole-life or equal-service comparisons without the separate service scenario."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset for configured multifunction-device supply; process and lifecyclemodel projections of the foreground data package"
  allowed_use: "Factory-gate production modelling with compatible device configuration and upstream coverage"
  excluded_use: "Whole-life environmental claims without use and end-of-life modules; automatic function-by-function comparison; single-function machine substitution"
  required_metadata: "model; functions; technology; kg per device; cartridge configuration; site; year; BOM coverage; allocation; upstream dataset links"
  required_quality_disclosure: "missing flows; unresolved identities; meter coverage; uncertainty; upstream proxies; exclusions; material balance"
  update_trigger: "BOM, technology, site, electricity mix, cartridge configuration or test-protocol change"
