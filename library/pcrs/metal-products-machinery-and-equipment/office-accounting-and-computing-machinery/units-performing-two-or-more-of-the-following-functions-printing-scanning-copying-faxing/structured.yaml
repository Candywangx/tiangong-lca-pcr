system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include all site assembly and test inputs, packaging, actual rejects and attributable electricity. Require upstream datasets for every purchased component; supplier fabrication is upstream rather than an unrecorded zero burden. The BOM collection protocol defines this foreground boundary."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Exclude customer operation, maintenance, distribution after the gate and final device disposal from the production result. A life-cycle extension must report these modules separately with workload, lifetime, geography, operating-mode energy and cartridge replacement records; the operating-mode distinction is supported by epa-imaging-equipment-v1-2."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Component cards represent disjoint purchased articles. A print-engine module must exclude any housing, chassis, board, power supply or cable already entered separately. Add a separately identified atomic exchange for every additional BOM item or actual site chemical, waste or emission; the common inventory is not permission to omit site-specific exchanges."
      source_ids: []
