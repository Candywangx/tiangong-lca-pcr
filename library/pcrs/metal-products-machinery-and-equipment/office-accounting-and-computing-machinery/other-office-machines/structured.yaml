validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "product identity"
    rule: "Confirm the declared product is within the official CPC 45160 inclusion note and is not a printer, photocopier, computing peripheral, calculating-device machine in 45141, network-connectable ATM or cash register in 45142, or separately supplied part."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-detail-45160
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Confirm the normalized finished output equals 1 kg net product mass and that packaging and excluded accessories are consistently treated."
    source_ids: []
  - rule_id: validate_process_applicability
    applies_to: "conditional process map"
    rule: "Confirm each conditional process is either populated with foreground rows and records or explicitly marked not applicable with the purchased-component boundary disclosed."
    source_ids: []
  - rule_id: validate_uuid_resolution
    applies_to: "TianGong identities"
    rule: "Reject substitution of printers, photocopiers, ink, mixed plastic waste, or other proxy UUIDs for the three unresolved rows; require state-100 direct-read identity before resolution."
    source_ids: []
  - rule_id: validate_inventory_balance
    applies_to: "each production lot"
    rule: "Confirm material issues, returns, conforming transfers, separately recorded wastes, and inventory changes reconcile; report residuals and corrective actions."
    source_ids: []
  - rule_id: validate_energy_records
    applies_to: "electricity rows"
    rule: "Reconcile process meters to invoices or site meters, prevent overlap among the three electricity rows, and verify the kWh-to-MJ conversion and allocation driver."
    source_ids: []
  - rule_id: validate_bilingual_flow_names
    applies_to: "Chinese rendering"
    rule: "Confirm every UUID-bearing Chinese selected flow exactly matches the TianGong state-100 Chinese baseName and that UUID-empty atomic flows remain accurately translated."
    source_ids: []
  - rule_id: validate_range_status
    applies_to: "amount metadata"
    rule: "Confirm no externally inferred range is added without two independent, original-text-verified, boundary-compatible sources; retain the manifest evidence need when that condition is unmet."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground cradle-to-gate manufacturing dataset for one declared CPC 45160 office-machine model"
  downstream_use: "May be used as a secondary_dataset or background_dataset after review, and as the manufacturing stage of a lifecyclemodel with separately modelled use and end-of-life stages"
  allowed_use: "Model-specific product comparison, supply-chain assessment, and lifecycle modelling when reference mass, function, configuration, geography, technology, and data period are compatible"
  excluded_use: "Unqualified category-average claims, comparison of unlike office functions, use-stage claims without a declared duty cycle and service life, or proxy substitution for unresolved flow UUIDs"
  required_metadata: "model and configuration; CPC scope; rated function or throughput; net mass; sites and geography; reporting period; purchased-versus-made boundary; electricity supply; packaging; allocation; cut-offs; unresolved identities"
  required_quality_disclosure: "primary-data share; meter and scale coverage; allocation drivers; sampling; mass-balance residuals; rejected units; data gaps; supplier-data age; substance-compliance evidence where applicable"
  update_trigger: "material design or supplier change; production-route or site change; electricity-supply change; packaging redesign; changed acceptance test; new exact TianGong UUID; or foreground records no longer representative"
