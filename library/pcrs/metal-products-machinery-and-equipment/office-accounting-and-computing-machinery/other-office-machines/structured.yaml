allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared manufacturing lines"
    rule: "Prefer process subdivision, submeters, production-order records, and direct material issue records so the declared model receives its measured exchanges."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "unavoidable shared loads"
    rule: "When direct measurement is unavailable, allocate shared electricity and auxiliaries by a documented causal physical driver such as machine time multiplied by rated load; use mass only when causality cannot be established and disclose sensitivity."
    source_ids: []
  - rule_id: allocation_scrap_treatment
    applies_to: "scrap and rejected components"
    rule: "Record gross input and measured waste outputs without netting scrap revenue or avoided-production credits inside the foreground process; document any recycling substitution only in a separately declared downstream scenario."
    source_ids:
      - japan-green-procurement-2020
  - rule_id: allocation_no_category_average
    applies_to: "multiple CPC 45160 models"
    rule: "Do not average mechanically different models unless the represented product mix, production volume weights, functional differences, and all allocation steps are disclosed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_mass_balance
      process_id: "mechanical_component_fabrication"
      flow_role: "steel and ABS inputs; steel and ABS scrap outputs"
      record_type: "material issue, return, production, and waste-transfer records"
      raw_fields: "material_id; grade; lot; issued_mass; returned_mass; conforming_part_mass; scrap_mass; destination"
      collection_method: "Reconcile calibrated scale records, warehouse transactions, and waste-transfer tickets by material and production order."
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "all lots in the declared reporting period"
      site_scope: "every in-boundary fabrication site"
      aggregation_rule: "Sum net issues and outbound scrap by material, then normalize to conforming finished-product net mass."
      quality_evidence: "scale calibration; transaction reconciliation; signed waste-transfer record"
    - protocol_id: cp_component_fabrication_electricity
      process_id: "mechanical_component_fabrication"
      flow_role: "fabrication electricity"
      record_type: "submeter or site-meter interval record"
      raw_fields: "meter_id; start_reading; end_reading; production_order; operating_time; allocation_driver"
      collection_method: "Read dedicated submeters or allocate a calibrated site meter using documented equipment time and load."
      unit: "MJ"
      frequency: "each lot or monthly with lot allocation"
      temporal_coverage: "representative consecutive reporting period"
      site_scope: "every in-boundary fabrication site"
      aggregation_rule: "Sum energy for the process and normalize to conforming finished-product net mass."
      quality_evidence: "meter calibration; bill reconciliation; allocation worksheet"
    - protocol_id: cp_electrical_component_mass_balance
      process_id: "electrical_component_integration"
      flow_role: "printed wire board and motor inputs; rejected populated-board output"
      record_type: "bill of materials, issue, return, rejection, and waste-transfer records"
      raw_fields: "component_id; specification; supplier; issued_mass; returned_mass; accepted_mass; rejected_mass; waste_destination"
      collection_method: "Reconcile production-order component transactions and calibrated mass measurements."
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "all lots in the declared reporting period"
      site_scope: "every in-boundary electrical integration site"
      aggregation_rule: "Sum net component issues and rejected-board waste, then normalize to conforming finished-product net mass."
      quality_evidence: "approved bill of materials; scale calibration; rejection disposition"
    - protocol_id: cp_electrical_integration_electricity
      process_id: "electrical_component_integration"
      flow_role: "integration and test electricity"
      record_type: "submeter or site-meter interval record"
      raw_fields: "meter_id; start_reading; end_reading; production_order; test_cycles; allocation_driver"
      collection_method: "Read dedicated submeters or allocate a calibrated site meter using documented equipment time and load."
      unit: "MJ"
      frequency: "each lot or monthly with lot allocation"
      temporal_coverage: "representative consecutive reporting period"
      site_scope: "every in-boundary electrical integration site"
      aggregation_rule: "Sum energy for the process and normalize to conforming finished-product net mass."
      quality_evidence: "meter calibration; bill reconciliation; allocation worksheet"
    - protocol_id: cp_final_assembly_electricity
      process_id: "final_assembly_testing_packaging"
      flow_role: "assembly and acceptance-test electricity"
      record_type: "submeter or site-meter interval record"
      raw_fields: "meter_id; start_reading; end_reading; production_order; accepted_units; test_cycles; allocation_driver"
      collection_method: "Read dedicated submeters or allocate a calibrated site meter using documented line time and load."
      unit: "MJ"
      frequency: "each lot or monthly with lot allocation"
      temporal_coverage: "representative consecutive reporting period"
      site_scope: "every final assembly site"
      aggregation_rule: "Sum energy for assembly and release testing and normalize to conforming finished-product net mass."
      quality_evidence: "meter calibration; bill reconciliation; acceptance-test log"
    - protocol_id: cp_packaging_mass
      process_id: "final_assembly_testing_packaging"
      flow_role: "corrugated board box input"
      record_type: "packaging specification, purchase, issue, and return records"
      raw_fields: "packaging_id; material; supplier; issued_mass; returned_mass; packed_units"
      collection_method: "Reconcile approved packaging specifications with warehouse transactions and calibrated sample masses."
      unit: "kg"
      frequency: "each packaging configuration and lot"
      temporal_coverage: "all configurations in the declared reporting period"
      site_scope: "every final assembly site"
      aggregation_rule: "Sum net box mass consumed and normalize to conforming finished-product net mass."
      quality_evidence: "approved packaging specification; scale calibration; stock reconciliation"
    - protocol_id: cp_finished_product_mass
      process_id: "final_assembly_testing_packaging"
      flow_role: "conforming finished product output"
      record_type: "acceptance and calibrated mass records"
      raw_fields: "model_id; serial_or_lot; configuration; accepted_quantity; net_mass; excluded_accessories; test_status"
      collection_method: "Weigh a documented representative sample or every unit after acceptance testing and before transport packaging."
      unit: "kg"
      frequency: "each model and configuration; each lot"
      temporal_coverage: "all conforming output in the declared reporting period"
      site_scope: "every final assembly site"
      aggregation_rule: "Sum accepted net product mass; retain sample design and expansion calculations when not every unit is weighed."
      quality_evidence: "scale calibration; acceptance record; sampling record"
  calculation_rules:
    - id: calc_net_material_input
      applies_to: "material and component inputs"
      rule: "net input = issued mass - unused returned mass"
      inputs:
        - issued_mass
        - returned_mass
      output: "kg net input by row and lot"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "all mass exchanges"
      rule: "normalized amount = row net mass / conforming finished-product net mass"
      inputs:
        - "row net mass"
        - "accepted net product mass"
      output: "kg per kg reference flow"
      source_ids: []
    - id: calc_energy_normalization
      applies_to: "electricity rows"
      rule: "normalized electricity = process electricity in MJ / conforming finished-product net mass in kg"
      inputs:
        - "meter difference"
        - "conversion factor"
        - "allocation driver when used"
        - "accepted net product mass"
      output: "MJ per kg reference flow"
      source_ids: []
    - id: calc_component_mass_check
      applies_to: "mechanical component fabrication"
      rule: "net material input - outbound scrap - measured conforming component transfer = documented inventory change plus measured process loss"
      inputs:
        - issue
        - return
        - scrap
        - "component transfer"
        - "inventory change"
      output: "material-specific mass-balance residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_model_identity
      applies_to: "reference product"
      requirement: "Record model, configuration, rated office function or throughput, motor rating when applicable, power architecture, and acceptance criteria."
      evidence: "approved product specification and acceptance-test record"
    - id: dq_temporal_coverage
      applies_to: "all foreground exchanges"
      requirement: "Use a consecutive period representative of normal production, identify startup, shutdown, rework, and abnormal lots, and disclose exclusions."
      evidence: "dated production, meter, warehouse, and waste records"
    - id: dq_mass_balance
      applies_to: "material-bearing processes"
      requirement: "Reconcile net inputs, conforming output, inventory change, and each separately recorded waste stream; investigate material-specific residuals."
      evidence: "signed reconciliation worksheet and calibrated measurements"
    - id: dq_electricity_identity
