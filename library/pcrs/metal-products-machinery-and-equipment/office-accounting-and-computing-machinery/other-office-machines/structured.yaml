measurement_rules:
  - id: reference_net_mass
    applies_to: "finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure finished machine mass after acceptance testing and before transport packaging; exclude manuals, loose consumables, and packaging unless they are integral to the saleable machine configuration, and disclose every inclusion."
  - id: lot_normalization
    applies_to: "all inventory exchanges"
    required_property_ref:
      name: "row-specific property"
      uuid: ""
    required_unit: "row-specific unit"
    rule: "Sum exchanges for the same production lot and divide by conforming finished-product net mass in kg; exclude rejected units from the denominator and record their materials and treatment separately."
  - id: electricity_conversion
    applies_to: "electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve the meter's energy basis and convert kWh to MJ using 1 kWh = 3.6 MJ; disclose whether auxiliary loads and line losses are included."
  - id: component_mass_accounting
    applies_to: "purchased and fabricated components"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use receipt, issue, return, and measured scrap records to reconcile material incorporated into conforming output; do not substitute item counts without a documented model-specific mass conversion."
