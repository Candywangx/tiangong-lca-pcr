product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.office-accounting-and-computing-machinery.other-office-machines"
  classification_refs: "CPC 3.0: 45160 Other office machines"
  covered_products: "Office machines within the official CPC 45160 inclusion note, including paper shredders, non-calculating mail-handling and ticket machines, coin-counting machines, pencil-sharpening machines, and perforating or stapling machines"
  excluded_products: "Products classified as photocopiers, printers, facsimile machines, computing peripherals, calculating-device machines in CPC 45141, network-connectable ATMs or cash registers in CPC 45142, and separately supplied parts or accessories"
  representative_product: "Electric paper shredder, used only to organize conditional electrical and plastic-component rules and not to narrow the category"
  production_route: "Receipt of purchased materials and components; conditional mechanical component fabrication; conditional electrical component integration; final assembly, acceptance testing, and packaging"
  market_state: "Finished, tested, packaged machine at the manufacturing site gate, identified by model and configuration"
functional_unit:
  what: "Production of a declared CPC 45160 office-machine model that performs its stated office function"
  how_much: "1 kg net mass of finished machine, excluding transport packaging"
  how_well: "The declared model passes the manufacturer's documented functional, safety, and quality acceptance criteria"
  how_long_or_cycle: "One completed production lot; use-stage service life is outside this cradle-to-gate unit and must be declared separately in a lifecycle model"
  reference_flow_link: "finished_other_office_machine"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased materials and components are received at each declared manufacturing site and ends with the conforming, packaged machine at the site gate. Upstream production of purchased inputs is represented by linked upstream datasets. Include on-site component fabrication, electrical integration, assembly, testing, rework, and packaging when performed for the declared model. Use and end-of-life stages are outside this cradle-to-gate data package, although a downstream lifecycle model may add them using separately declared scenarios."
      source_ids: []
    - rule_id: boundary_site_gate
      applies_to: "declared manufacturing sites"
      rule: "Include all material, component, energy, waste, and direct elementary exchanges from receipt at the manufacturing site through release of the packaged conforming machine; identify outsourced stages and link their datasets rather than silently excluding them."
      source_ids:
        - un-cpc-3-0-detail-45160
    - rule_id: boundary_conditional_routes
      applies_to: "model-specific production route"
      rule: "Include mechanical fabrication only when performed within the declared foreground, and include electrical integration only when the declared model contains electrical or electronic components; otherwise mark the process not applicable and explain the purchased-component boundary."
      source_ids:
        - hk-green-procurement-paper-shredder-2022
        - japan-green-procurement-2020
    - rule_id: boundary_specific_exchanges
      applies_to: "bills of materials and waste registers"
      rule: "Extend the inventory with additional model-specific exchanges as separate atomic rows; do not aggregate unnamed materials, utilities, packaging, or wastes into an umbrella flow."
      source_ids: []
    - rule_id: boundary_use_stage
      applies_to: "downstream lifecycle model"
      rule: "Do not include use electricity, consumables, maintenance, or end-of-life treatment in the manufacturing data package; declare them as separate processes when constructing a lifecycle model."
      source_ids:
        - japan-green-procurement-2020
boundary_abstraction:
  declared_starting_condition: "Purchased materials and components received at the gate of each declared manufacturing site"
  starting_condition_role: "Foreground manufacturing entry condition"
  product_classification_scope: "CPC 3.0 subclass 45160 only, interpreted by its official inclusion and exclusion note"
  recursive_input_rule: "A purchased CPC 45160 machine incorporated into another covered machine is recorded as a product input with its own upstream dataset and model identifier; its manufacture is not recursively expanded inside the receiving process."
  upstream_dataset_requirement: "Every purchased material, component, electricity, and packaging input requires a geographically and technologically representative upstream dataset or an explicit documented data gap."
  disclosure: "Declare sites, outsourced stages, purchased-versus-made components, model configuration, production period, net output mass, allocation, cut-offs, and every omitted or not-applicable process."
