allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared assembly equipment and site utilities"
    rule: "Prefer sub-metering and process subdivision. When direct measurement is unavailable, allocate electricity using a documented causal driver such as machine operating time; do not allocate by revenue."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "multiple calculator models"
    rule: "Aggregate only models with the same declared product boundary and power-route logic. Otherwise calculate model-specific inventories before any production-weighted combination."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "rejects and recovered material"
    rule: "Report rejected calculators as waste at measured mass. Do not credit avoided virgin production inside this factory-gate dataset unless an explicitly expanded boundary and substitution method are separately declared."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "No co-product is expected from calculator assembly. If a site reports a saleable co-product, subdivide the producing operation or document the physical causal allocation method and the unallocated result."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom_mass
      process_id: "calculator_final_assembly_button_cell_installation"
      flow_role: "mass of each purchased component consumed"
      record_type: "approved bill of materials, receiving record, issue record and component mass measurement"
      raw_fields: "model_id; supplier_part_id; component_flow; unit_mass; issued_quantity; returned_quantity; rejected_quantity; scale_id"
      collection_method: "Reconcile approved BOM with material issues and returns; verify unit mass by calibrated weighing"
      unit: "kg"
      frequency: "each production lot, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all lines producing covered models at the declared site"
      aggregation_rule: "sum net issued mass by atomic component and divide by net conforming output mass"
      quality_evidence: "BOM revision, purchase/issue records, scale calibration and reconciliation sign-off"
    - protocol_id: cp_assembly_electricity
      process_id: "calculator_final_assembly"
      flow_role: "electricity for assembly and functional testing"
      record_type: "meter readings and equipment operating records"
      raw_fields: "meter_id; opening_reading; closing_reading; meter_unit; covered_equipment; operating_time; allocation_driver; excluded_loads"
      collection_method: "Read dedicated meter or allocate an assembly-area meter using documented operating time"
      unit: "meter unit and MJ after validated conversion"
      frequency: "at least monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "declared assembly and testing equipment"
      aggregation_rule: "subtract excluded loads, apply documented causal allocation and divide by net conforming output mass"
      quality_evidence: "meter identification, reading log, conversion record and allocation worksheet"
    - protocol_id: cp_finished_product_mass
      process_id: "calculator_final_assembly"
      flow_role: "conforming unpackaged finished product"
      record_type: "release quantity and verified net unit mass"
      raw_fields: "model_id; released_quantity; sampled_unit_mass; packaging_tare; scale_id; release_status"
      collection_method: "Weigh unpackaged product samples by model and reconcile with released quantities"
      unit: "kg"
      frequency: "each model and reporting period"
      temporal_coverage: "complete reporting period"
      site_scope: "declared production site"
      aggregation_rule: "sum released quantity multiplied by verified net unit mass"
      quality_evidence: "release records, sampling plan, scale calibration and tare record"
    - protocol_id: cp_reject_waste_mass
      process_id: "calculator_final_assembly"
      flow_role: "rejected finished calculator waste"
      record_type: "reject and waste-disposition records"
      raw_fields: "model_id; reject_quantity; measured_mass; rework_return; disposition; waste_ticket"
      collection_method: "Weigh assembled rejects leaving the process and exclude units returned to in-period rework"
      unit: "kg"
      frequency: "each waste shipment or production lot"
      temporal_coverage: "complete reporting period"
      site_scope: "declared production site"
      aggregation_rule: "sum disposed reject mass and divide by net conforming output mass"
      quality_evidence: "reject log, weighing record and waste-transfer evidence"
    - protocol_id: cp_power_component_count
      process_id: "photovoltaic_cell_installation"
      flow_role: "installed photovoltaic-cell count"
      record_type: "approved BOM and released/rejected unit counts"
      raw_fields: "model_id; power_configuration; cells_per_unit; released_quantity; rejected_quantity; BOM_revision"
      collection_method: "Multiply verified cells per unit by units assembled for applicable models"
      unit: "Item(s)"
      frequency: "each production lot, aggregated monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all applicable covered models"
      aggregation_rule: "sum installed cell count and divide by net conforming output mass"
      quality_evidence: "BOM approval, route declaration and production-count reconciliation"
  calculation_rules:
    - id: calc_component_mass
      applies_to: "mass-based component inputs"
      rule: "Net component mass per reference flow = (issued mass - same-state return-to-stock mass) / net conforming unpackaged product mass"
      inputs:
        - "component issue and return records"
        - "net conforming output mass"
      output: "kg component/kg reference product"
      source_ids: []
    - id: calc_electricity
      applies_to: "assembly electricity"
      rule: "Electricity per reference flow = allocated assembly and testing electricity / net conforming unpackaged product mass"
      inputs:
        - "meter readings"
        - "excluded loads"
        - "allocation driver"
        - "validated unit conversion"
        - "output mass"
      output: "MJ/kg reference product"
      source_ids: []
    - id: calc_product_mass
      applies_to: "reference product output"
      rule: "Net conforming mass = sum by model of released quantity multiplied by verified unpackaged unit mass"
      inputs:
        - "release quantities"
        - "sampled unit mass"
        - "packaging tare"
      output: "kg conforming product"
      source_ids: []
    - id: calc_pv_count
      applies_to: "photovoltaic-cell input"
      rule: "Cell count per reference flow = sum of installed cells for applicable models / net conforming unpackaged product mass"
      inputs:
        - "cells per unit"
        - "assembled unit counts"
        - "output mass"
      output: "Item(s)/kg reference product"
      source_ids: []
    - id: calc_reject_mass
      applies_to: "rejected calculator waste"
      rule: "Reject waste per reference flow = disposed assembled-reject mass / net conforming unpackaged product mass"
      inputs:
        - "reject weighing and disposition records"
        - "output mass"
      output: "kg waste/kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and component identity"
      requirement: "Retain model, supplier part, component state, power configuration and Tiangong UUID or documented unresolved status for every atomic row."
      evidence: "BOM, supplier specification, UUID audit and model-family declaration"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Cover one complete representative reporting period and disclose shutdowns, start-ups, engineering lots and abnormal rejects."
      evidence: "dated production, meter and waste records"
    - id: dq_mass
      applies_to: "mass-based rows"
      requirement: "Use calibrated weighing or documented unit-mass sampling and reconcile issued component mass, conforming output and reject disposition."
      evidence: "calibration certificates, sampling records and reconciliation worksheet"
    - id: dq_electricity
      applies_to: "electricity"
      requirement: "Identify meter boundary, excluded loads, conversion and allocation driver; use a geography- and voltage-appropriate upstream electricity dataset."
      evidence: "meter diagram, readings, allocation worksheet and dataset metadata"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Report all nine PCR rows as present, zero/not applicable under the declared conditional route, or explicitly unresolved; do not merge atomic components or waste."
      evidence: "completed inventory checklist and route declaration"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "product identity"
    rule: "Confirm CPC 45130 scope and reject accounting machines, transaction terminals, general-purpose computers, stand-alone storage units and separately sold parts."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "reference flow"
    rule: "Confirm that the dataset output is exactly 1 kg net conforming unpackaged finished product and that all required qualifiers are present."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "process and route completeness"
    rule: "Confirm final assembly is present and that button-cell and photovoltaic rows agree with the declared power configuration; dual-power models include both conditional processes."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "inventory identity"
    rule: "Confirm every selected flow is one atomic exchange, UUID-bearing Chinese names match state-100 direct reads, and the four UUID-empty rows remain explicitly unresolved until exact identities are audited."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "normalization and reconciliation"
    rule: "Confirm numerator records and net conforming output cover the same site and period; explain component-mass, product-mass and reject reconciliation differences without treating electricity as mass."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "external ranges"
    rule: "Confirm no external empirical range is asserted until two independent original sources with compatible boundary, unit and product state support a synthesis."
    source_ids: []
