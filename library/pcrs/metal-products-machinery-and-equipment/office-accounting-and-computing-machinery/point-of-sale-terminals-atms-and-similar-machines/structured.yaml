allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "shared_assembly_and_test_operations"
    rule: "Subdivide by production line, model, test programme or reporting period wherever records allow direct attribution."
    source_ids: []
  - rule_id: al_mass_energy_driver
    applies_to: "residual_shared_inputs_and_wastes"
    rule: "Allocate component and packaging masses by BOM/issue records, electricity by metered test time or another documented causal energy driver, and segregated waste by measured source records; use finished-product mass only when no more causal verified driver exists."
    source_ids: []
  - rule_id: al_no_avoided_burden
    applies_to: "recyclable_production_waste"
    rule: "Report waste at the factory gate without avoided-burden credit. Any downstream recycling substitution belongs in a separately declared scenario and must not reduce foreground assembly inventory."
    source_ids:
      - eu-weee-2012-19
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_packaging_mass
      process_id: "terminal_final_assembly"
      flow_role: "installed components and shipped packaging"
      record_type: "BOM, goods issue, receiving record, calibrated scale record"
      raw_fields: "model id; component id; quantity issued; quantity returned; measured unit mass; reject mass; packing inclusion"
      collection_method: "Reconcile released-model BOM with warehouse issues/returns and model-specific scale checks"
      unit: "kg"
      frequency: "Each model/revision and reporting period"
      temporal_coverage: "Complete reporting period"
      site_scope: "All reporting-site assembly and packing lines"
      aggregation_rule: "Sum net issued mass attributable to released products; add documented onsite loss only once"
      quality_evidence: "Approved BOM revision, issue/return reconciliation, scale calibration, variance investigation"
    - protocol_id: cp_electricity_metering
      process_id: "terminal_final_assembly"
      flow_role: "assembly and test electricity"
      record_type: "electricity meter and equipment runtime record"
      raw_fields: "meter start/end; multiplier; line/test station; runtime; model; released mass; allocation driver"
      collection_method: "Read dedicated meters where available; otherwise reconcile shared meters and documented causal allocation drivers"
      unit: "kWh and MJ"
      frequency: "At least monthly and at model/test-programme change"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included assembly, configuration, test and packing equipment"
      aggregation_rule: "Convert kWh to MJ, subtract documented excluded loads, allocate residual shared use, divide by released mass"
      quality_evidence: "Meter identifier and calibration, bill reconciliation, load boundary diagram, allocation record"
    - protocol_id: cp_product_output_mass
      process_id: "terminal_final_assembly"
      flow_role: "released finished product"
      record_type: "release record and calibrated scale record"
      raw_fields: "model; serial/batch; released quantity; unpacked mass; packed mass; packing declaration"
      collection_method: "Reconcile release records with model-specific measured mass and reject records"
      unit: "kg"
      frequency: "Each model/revision and reporting period"
      temporal_coverage: "Complete reporting period"
      site_scope: "All included production lines"
      aggregation_rule: "Sum only conforming released mass in the declared packing state"
      quality_evidence: "Release authorization, scale calibration, packed/unpacked mass reconciliation"
    - protocol_id: cp_segregated_waste_mass
      process_id: "terminal_final_assembly"
      flow_role: "PCB, steel, ABS and cardboard waste"
      record_type: "waste-container scale ticket and transfer manifest"
      raw_fields: "waste identity; container tare/gross; contamination; date; source line; destination; supplier return flag"
      collection_method: "Weigh each segregated stream and reconcile internal storage change and outbound manifests"
      unit: "kg"
      frequency: "Each transfer; aggregate monthly"
      temporal_coverage: "Complete reporting period including opening and closing stock"
      site_scope: "All included production and waste-storage areas"
      aggregation_rule: "Net generated waste = outbound + closing stock - opening stock; exclude documented non-waste supplier returns"
      quality_evidence: "Scale calibration, photographs/labels, manifests, stock reconciliation, contamination notes"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "mass inventory rows"
      rule: "normalized kg/kg = attributable row mass in kg / released finished-product mass in kg"
      inputs:
        - "reconciled row mass"
        - "released finished-product mass"
      output: "kg per kg reference product"
      source_ids: []
    - id: calc_electricity_normalization
      applies_to: "assembly_test_electricity_input"
      rule: "normalized MJ/kg = attributable metered kWh × 3.6 / released finished-product mass in kg"
      inputs:
        - "metered kWh"
        - "excluded loads"
        - "allocation driver"
        - "released mass"
      output: "MJ per kg reference product"
      source_ids: []
    - id: calc_waste_stock_balance
      applies_to: "waste outputs"
      rule: "generated waste = outbound transferred mass + closing onsite stock - opening onsite stock, excluding documented supplier returns"
      inputs:
        - "scale tickets"
        - manifests
        - "stock records"
        - "return records"
      output: "kg waste per reporting period before normalization"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and component identity"
      requirement: "Tie product model, hardware/firmware revision, component identities and packing state to an approved BOM and release record; disclose every UUID-empty flow and proxy dataset."
      evidence: "BOM revision, configuration record, release authorization, supplier specification"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Cover one representative continuous reporting period and disclose shutdowns, rework campaigns, new-model ramp-up and missing intervals."
      evidence: "dated meter, warehouse, production and waste records"
    - id: dq_completeness
      applies_to: "mass and energy balance"
      requirement: "Reconcile component issues, released product, rejects, supplier returns and segregated wastes; explain material variances and excluded shared loads."
      evidence: "signed reconciliation and variance log"
    - id: dq_measurement
      applies_to: "scales and electricity meters"
      requirement: "Use identified calibrated instruments and preserve raw readings, multipliers, conversion and allocation calculations."
      evidence: "calibration certificates, raw exports and calculation workbook"
    - id: dq_regulatory
      applies_to: "regulated market declarations"
      requirement: "Where applicable, retain homogeneous-material substance declarations/exemptions and separately document WEEE collection/treatment assumptions used in downstream extensions."
      evidence: "supplier declarations or test evidence; applicable compliance records; scenario documentation"
validation_rules:
  - rule_id: val_reference_flow
    applies_to: "reference_product"
    rule: "Confirm that finished_terminal_output uses the exact reference UUID, Mass property, kg unit, and equals 1 kg after normalization."
    source_ids: []
  - rule_id: val_scope_identity
    applies_to: "product_scope"
    rule: "Reject a package for an excluded office machine, loose component, or unconnected cash register; verify the declared POS/ATM/similar-machine function and network capability."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-2-1-2013
  - rule_id: val_inventory_atomicity
    applies_to: "process_inventory"
    rule: "Confirm every row is one atomic exchange and that absent product-specific components are marked not applicable rather than replaced with an umbrella flow."
    source_ids: []
  - rule_id: val_reconciliation
    applies_to: "foreground_records"
    rule: "Recalculate mass and electricity normalization, check released-product denominator, reconcile waste stocks and returns, and flag unexplained negative or duplicate quantities."
    source_ids: []
  - rule_id: val_boundary_disclosure
    applies_to: "system_boundary"
    rule: "Confirm the factory-gate boundary, packing state, included onsite operations, upstream dataset links, excluded use/end-of-life stages and any regulatory extension scenario are explicit."
    source_ids:
      - eu-rohs-2011-65
      - eu-weee-2012-19
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after review of representativeness and upstream links"
  downstream_use: "Product-footprint and lifecycle-model foreground/background modules for declared POS terminal, ATM or similar-machine configurations"
  allowed_use: "Factory-gate comparison or modelling when product configuration, mass, geography, reporting period, packing state and foreground boundary are compatible"
  excluded_use: "Direct substitution for excluded CPC products; use-phase or end-of-life claims without separate scenarios; comparison of unlike POS/ATM configurations without functional adjustment"
  required_metadata: "PCR id and version; product/model configuration; reference UUID; unit mass; packing state; production site/geography; reporting period; included operations; upstream dataset identities; allocation; unresolved UUIDs; regulatory-market assumptions"
  required_quality_disclosure: "Data coverage and gaps; meter/scale calibration; BOM and mass reconciliation; shared-energy allocation; waste stock balance; upstream proxy use; component and packaging not-applicable decisions"
  update_trigger: "Hardware, enclosure, display, power-supply, packaging, software/test programme, production site, energy supply, allocation driver or regulatory scope changes that materially alter the inventory"
