system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default boundary is cradle-to-factory-gate for the completed machine: foreground operations begin when purchased components, packaging and energy cross the reporting factory boundary and end when conforming finished products and segregated wastes leave it. Upstream production of purchased components must be represented by suitable upstream datasets. Installation, use, maintenance and end-of-life are excluded unless a separately identified extension is reported. Regulatory sources are conformance and scenario rules, not empirical amount ranges."
      source_ids: []
    - rule_id: sb_factory_gate
      applies_to: "default_system_boundary"
      rule: "Include final assembly, configuration, functional/security testing and packing at the reporting factory; connect every purchased component, material and electricity flow to an upstream dataset."
      source_ids: []
    - rule_id: sb_product_scope
      applies_to: "product_identity"
      rule: "Apply this PCR only to CPC 45142 products within the reviewed inclusions and exclusions; do not use it for excluded office machines or loose parts."
      source_ids:
        - un-cpc-3-0-structure-2025
        - un-cpc-2-1-2013
    - rule_id: sb_rohs_disclosure
      applies_to: "regulated_hazardous_substances"
      rule: "Where the declared market is subject to Directive 2011/65/EU, retain supplier declarations or test evidence at homogeneous-material level and disclose applicable exemptions; this is a conformance disclosure, not an inventory range."
      source_ids:
        - eu-rohs-2011-65
    - rule_id: sb_downstream_extension
      applies_to: "optional_use_and_end_of_life"
      rule: "Report use electricity, maintenance, collection and treatment only in separate extension scenarios. Where Directive 2012/19/EU applies, keep separate collection and treatment/reuse/recycling routes explicit and do not merge them into factory production waste."
      source_ids:
        - eu-weee-2012-19
boundary_abstraction:
