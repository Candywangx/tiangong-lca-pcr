measurement_rules:
  - id: reference_mass
    applies_to: "Final reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize inventory to 1 kg net finished unit. Include every component delivered as part of the configured storage unit, including installed drives, controller, chassis, backplane, internal cabling, power supplies, and cooling; exclude detachable transport packaging and record it separately."
  - id: capacity_declaration
    applies_to: "Storage capacity"
    required_property_ref:
      name: "Digital information capacity"
      uuid: ""
    required_unit: "byte, MB or MiB, GB or GiB, TB or TiB"
    rule: "Declare raw addressable capacity and formatted usable capacity separately, identify decimal or binary prefixes, and disclose space reserved for parity, checksums, spares, remapping, cache, snapshots, and system use. Do not compare products using an undeclared capacity convention."
  - id: component_count_and_mass
    applies_to: "Drives, controllers, power supplies, fans, boards, and other count-based components"
    required_property_ref:
      name: "Mass and number of items"
      uuid: ""
    required_unit: "kg and item"
    rule: "Record component count and measured or supplier-specific mass for the same bill of materials. Do not apply a generic count-to-mass factor across models or routes."
  - id: power_state_measurement
    applies_to: "Active, ready-idle, and supported deep-idle states"
    required_property_ref:
      name: "Power"
      uuid: ""
    required_unit: "W"
    rule: "Measure input power for the complete declared unit and configuration. Record input voltage and frequency, AC or DC supply, PSU count and redundancy, installed drives and controllers, firmware, ambient conditions, workload, averaging period, meter accuracy, and whether power-saving features are enabled."
  - id: test_energy_calculation
    applies_to: "Burn-in, conditioning, functional testing, and power testing"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Calculate test electricity from metered energy or from time-resolved power as kWh = sum(W × hours) / 1000. Keep factory test electricity separate from reported product operating-power attributes."
  - id: energy_carrier_preservation
    applies_to: "Manufacturing electricity, fuels, heat, and supplied cooling"
    required_property_ref:
      name: "Energy or carrier-specific property"
      uuid: ""
    required_unit: "kWh or MJ; native fuel unit retained"
    rule: "Preserve quantities by carrier and site. Convert 1 kWh to 3.6 MJ only when needed and do not merge electricity, heat, fuel, or supplied cooling into one undifferentiated amount."
process_map:
  - id: fixed_media_device_supply
    name: "Fixed-media device manufacture or purchased-device supply"
    inclusion: "required"
    inclusion_condition: "Always required; select in-house HDD, in-house fixed-SSD or hybrid manufacture, purchased complete-device supply, or a disclosed combination"
    role: "Establish route-specific fixed-media devices and prevent double counting of purchased same-category units"
    quantitative_reference: "Qualified fixed-media device set entering final release or system integration"
  - id: array_enclosure_integration
    name: "Populated array or enclosure integration"
    inclusion: "conditional"
    inclusion_condition: "Required only when the delivered reference product includes multiple drives, a controller, chassis or enclosure, backplane, power supplies, cooling, internal network elements, or configured redundancy"
    role: "Integrate qualified drives and system hardware into the declared delivery configuration"
    quantitative_reference: "Integrated storage unit entering final configuration and testing"
  - id: final_configuration_test_packaging
    name: "Final configuration, testing, quality release, and packaging"
    inclusion: "required"
    inclusion_condition: "Always required"
    role: "Load firmware, configure capacity and redundancy, conduct functional, burn-in and power tests, release quality, measure net mass, and package the product"
    quantitative_reference: "1 kg net finished fixed-media storage unit at the manufacturer gate"
