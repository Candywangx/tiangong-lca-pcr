allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared lines, equipment, utilities, tests, and sites"
    rule: "Subdivide by product route, model, lot, process, and site and use direct meters, bills of materials, production issues, equipment logs, or test records before allocation. Keep HDD, fixed SSD, hybrid, and array or enclosure routes separate where records permit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_causal_driver
    applies_to: "Unmetered shared burdens"
    rule: "When subdivision is not feasible, use the closest documented causal driver, such as machine time, test-bay time, measured power-time, clean-room area-time, line throughput, component count, or processed mass. Report shares and confirm that they sum to one."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_multi_model_output
    applies_to: "Multiple saleable models or configurations"
    rule: "Prefer lot- or model-specific records. If a shared burden cannot be physically separated, allocate using a demonstrated physical relation; use economic allocation only when no defensible physical relation exists and disclose price basis, period, currency, shares, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rejects_rework
    applies_to: "Rejected units, rework, recovered parts, and scrap"
    rule: "Assign rework and reject burdens to the process and model that caused them. Treat outputs without an intended product function or revenue as waste and do not silently net recycling revenue, recovered material, or avoided burdens against gross inputs."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_same_category_inputs
    applies_to: "Purchased fixed-media devices installed in arrays or enclosures"
    rule: "Carry the upstream dataset once for each purchased complete device and add only the integrator's foreground burdens. Do not re-add device-manufacturing burdens already represented upstream."
    source_ids:
      - epa-energy-star-storage-2-1-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_components_bom
      process_id: "fixed_media_device_supply"
      flow_role: "Storage media, electronics, mechanical parts, enclosure, and purchased devices"
      record_type: "Approved bill of materials, supplier receipt, production issue, and return record"
      raw_fields: "part number; supplier; material or component description; HDD or SSD route; capacity; interface; controller; quantity; measured or supplier mass; opening stock; receipts; returns; closing stock; destination lot; upstream dataset"
      collection_method: "Reconcile approved bill of materials and stock movement to issued and returned quantities for each homogeneous lot"
      unit: "kg; item"
      frequency: "Every bill-of-material revision and production lot"
      temporal_coverage: "Full represented production period"
      site_scope: "All receiving and device-manufacturing sites in scope"
      aggregation_rule: "Sum by part, supplier, route and lot; keep purchased complete devices separate from components"
      quality_evidence: "Approved BOM, supplier specification, receiving record, scale record, stock reconciliation, and upstream dataset link"
    - protocol_id: cp_utilities_process_materials
      process_id: "fixed_media_device_supply_array_enclosure_integration"
      flow_role: "Electricity, fuel, heat, cooling, water, chemicals, gases, lubricants, cleaning and joining materials"
      record_type: "Meter, invoice, stock, batch, equipment, and line log"
      raw_fields: "carrier or material; quantity; unit; meter interval; equipment; line; route; lot; operating time; production output; allocation driver"
      collection_method: "Use dedicated meters and batch issues first; otherwise reconcile site totals and document a causal allocation"
      unit: "kWh; MJ; m3; kg; native carrier unit"
      frequency: "Meter interval and every material issue; reconcile at least monthly"
      temporal_coverage: "Full represented production period"
      site_scope: "All included production and integration sites"
      aggregation_rule: "Preserve carriers and materials; sum by process, route and lot; report allocation shares"
      quality_evidence: "Meter calibration, invoice, stock balance, batch sheet, equipment log, and allocation workbook"
    - protocol_id: cp_integration_configuration
      process_id: "array_enclosure_integration"
      flow_role: "Installed drives, controller, chassis, backplane, power supplies, cooling, cables, network elements, firmware, and redundancy"
      record_type: "Configuration BOM, assembly traveller, firmware and test configuration record"
      raw_fields: "SKU; installed drive model and count; per-drive capacity; controller model and count; cache; backplane; chassis; PSU model, count and redundancy; fan count; internal network elements; cables; firmware; RAID or data-protection mode; mass; serials"
      collection_method: "Reconcile configuration BOM, serial scan, assembly and test records for each unit or homogeneous lot"
      unit: "kg; item; byte"
      frequency: "Every integrated unit or homogeneous configuration lot"
      temporal_coverage: "Full represented production period"
      site_scope: "All included integration sites"
      aggregation_rule: "Aggregate only identical configurations; preserve component counts and capacity conventions"
      quality_evidence: "Approved configuration, serial record, scale result, firmware record, assembly sign-off, and test report"
    - protocol_id: cp_power_functional_test
      process_id: "final_configuration_test_packaging"
      flow_role: "Functional, capacity, burn-in, active, ready-idle, and deep-idle testing"
      record_type: "Automated test log, calibrated power-meter file, test-bay meter, and release record"
      raw_fields: "model; serial or lot; installed configuration; firmware; capacity result and convention; interface; workload; input voltage and frequency; PSU count and mode; ambient temperature; power samples; averaging period; active, ready-idle and deep-idle power; test duration; defects; disposition"
      collection_method: "Use calibrated true-RMS power measurement or dedicated test-bay metering; link all results to the exact tested configuration"
      unit: "W; kWh; hour; byte"
      frequency: "Every released configuration; sampling only with declared plan and coverage"
      temporal_coverage: "Full represented production period and complete burn-in or test cycle"
      site_scope: "All final-test and burn-in areas"
      aggregation_rule: "Calculate configuration-specific averages; sum test energy separately; do not merge product power attributes with factory energy"
      quality_evidence: "Calibration certificate, raw time series, test method, configuration export, release sign-off, and sampling plan"
    - protocol_id: cp_output_quality
      process_id: "all_processes"
      flow_role: "Internal transfers, released product mass, count, capacity, configuration, quality, and yield"
      record_type: "Transfer, scale, serial, test, release, and packing record"
      raw_fields: "input mass; output mass; unit count; serials; model; configuration; raw and usable capacity; passed tests; rejects; rework; stock change; packaging mass; date"
      collection_method: "Weigh and reconcile the same lot or unit boundary and link to test and configuration records"
      unit: "kg; item; byte"
      frequency: "Every production and release lot"
      temporal_coverage: "Full represented production period"
      site_scope: "All included production, integration, test, and release sites"
      aggregation_rule: "Sum only homogeneous products; calculate yields and residuals by process and lot"
      quality_evidence: "Calibrated scale, serial genealogy, transfer record, release report, and mass-balance review"
    - protocol_id: cp_packaging
      process_id: "final_configuration_test_packaging"
      flow_role: "Product and transport packaging"
      record_type: "Packaging BOM, supplier specification, sample weighing, issue and return record"
      raw_fields: "article; material; supplier; mass per item; item count; recycled content; reusable trips; returns; losses; destination lot"
      collection_method: "Weigh representative articles and reconcile issued, returned, and scrapped counts"
      unit: "kg; item; trip"
      frequency: "Every packaging specification and release lot"
      temporal_coverage: "Full represented production period"
      site_scope: "All packaging and dispatch points in scope"
      aggregation_rule: "Multiply verified mass per article by net issued count; divide reusable packaging only by documented completed trips"
      quality_evidence: "Supplier specification, sample weighing, packaging BOM, stock reconciliation, and return log"
    - protocol_id: cp_waste_emissions
      process_id: "all_processes"
      flow_role: "Rejects, scrap, wastewater, direct emissions, treatment, and destination"
      record_type: "Waste ticket, scale, treatment log, discharge meter, laboratory sample, and emission record"
      raw_fields: "process; lot; waste or substance identity; gross mass or volume; compartment; concentration; treatment; destination; recovery; date; calculation method"
      collection_method: "Weigh waste transfers; meter discharges; pair samples with matching flows and operating states; retain gross quantities"
      unit: "kg; m3; kg substance"
      frequency: "Every transfer or treatment batch; sampling at declared frequency"
      temporal_coverage: "Full represented production period"
      site_scope: "All included waste, discharge, and direct-emission points"
      aggregation_rule: "Sum gross outputs by type, process, compartment and destination; never net credits against inputs"
      quality_evidence: "Scale ticket, licensed transfer record, treatment certificate, meter data, laboratory result, and mass or water balance"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Released reference product"
      rule: "Net reference mass = gross packed shipment mass - detachable product and transport packaging mass. Include all installed components integral to the delivered configuration."
      inputs:
        - cp_output_quality
        - cp_packaging
      output: "kg net finished storage unit"
      source_ids:
        - epa-energy-star-storage-2-1-2022
    - id: calc_inventory_normalization
      applies_to: "Every inventory row"
      rule: "Normalized amount = gross amount assigned to the homogeneous product, lot, route, or configuration / net released reference mass from the same represented boundary."
      inputs:
        - "Applicable collection protocol"
        - cp_output_quality
      output: "amount per kg reference product"
      source_ids: []
    - id: calc_test_energy
      applies_to: "Conditioning, burn-in and test electricity"
      rule: "Test electricity = metered kWh or sum of time-resolved input power in W multiplied by interval hours and divided by 1000. Preserve the tested configuration, meter uncertainty, and test duration."
      inputs:
        - cp_power_functional_test
      output: "kWh per released unit and kWh/kg reference product"
      source_ids:
        - epa-energy-star-storage-2-1-2022
    - id: calc_power_state
      applies_to: "Product power attributes"
      rule: "For each declared state and workload, report the arithmetic or time-weighted mean of valid input-power samples over the declared stable averaging period; retain configuration and uncertainty. Do not convert W to kWh without a declared scenario duration."
      inputs:
        - cp_power_functional_test
      output: "W by state, workload, and configuration"
      source_ids:
        - epa-energy-star-storage-2-1-2022
    - id: calc_mass_balance
      applies_to: "Each manufacturing, integration, and release lot"
      rule: "Reconcile opening stock + received inputs = transferred or released products + rejects + waste + closing stock + documented residual, using consistent product and packaging boundaries."
      inputs:
        - cp_components_bom
        - cp_integration_configuration
        - cp_output_quality
        - cp_packaging
        - cp_waste_emissions
      output: "kg and residual percentage by process and lot"
      source_ids: []
    - id: calc_discharge_emission
      applies_to: "Measured wastewater or air substances"
      rule: "Emitted mass = matched discharge or exhaust flow × representative measured concentration after unit conversion. Do not apply a sample from another route or operating state without representativeness evidence."
      inputs:
        - cp_waste_emissions
      output: "kg substance by compartment"
      source_ids: []
    - id: calc_shared_burden
      applies_to: "Unmetered shared operations"
      rule: "Allocated amount = gross shared amount × declared causal share. Shares must use the hierarchy in Section 7 and sum to one for the shared amount."
      inputs:
        - "Applicable collection protocol"
        - production
        - machine
        - time
        - area
        - throughput
        - "or price records"
      output: "Allocated amount and allocation share"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity_configuration
      applies_to: "Product and reference flow"
      requirement: "Every result shall identify delivery configuration, model, medium, raw and usable capacity convention, interface, controller, drive count, redundancy, included hardware, firmware, manufacturing route, site, power configuration, and net-mass boundary."
      evidence: "Approved specification, configuration BOM, serial genealogy, firmware export, test report, and scale record"
    - id: dq_measurement
      applies_to: "Mass, count, capacity, utilities, power, test energy, wastes, and emissions"
      requirement: "Use calibrated or verified instruments suitable for the measured range. Retain raw readings, conversions, sampling design, allocation, uncertainty where available, and reconciliation residuals."
      evidence: "Calibration certificate, raw meter file, scale check, test method, sample plan, and calculation workbook"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Cover the complete represented production and test cycles for every route and configuration. Continuous operations shall use a representative period of at least 12 months or disclose and justify a shorter campaign, start-up, or product-launch period."
      evidence: "Dated production, meter, purchase, stock, test, waste, release, and sales records"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Include all applicable processes and material storage media, electronics, mechanical parts, same-category device inputs, system hardware, utilities, process materials, packaging, yields, rejects, wastewater, and direct emissions; quantify or justify every omission."
      evidence: "Process map, BOM reconciliation, mass and energy balances, omission register, and reviewer sign-off"
    - id: dq_upstream_representativeness
      applies_to: "Upstream datasets"
      requirement: "Match medium technology, component type, capacity, model generation, interface, controller, geography, electricity system, supplier, and time as closely as available. Disclose each proxy and expected direction of bias."
      evidence: "Supplier data, upstream dataset metadata, technology comparison, and proxy assessment"
    - id: dq_power_test_configuration
      applies_to: "Product power attributes"
      requirement: "Power values shall be traceable to the exact delivered or explicitly representative configuration, workload, active or idle state, input supply, firmware, power-saving settings, ambient conditions, averaging period, and calibrated meter."
      evidence: "Test configuration export, raw time series, calibration record, test report, and representativeness justification"
validation_rules:
  - rule_id: validation_product_scope
    applies_to: "Product identity"
    rule: "Fail when the product is a bare chip or package, flash card or other single CPC 47550 medium, removable-media unit, empty enclosure, server, external SAN device, or another excluded product; fail when an assembled fixed SSD is not demonstrably a complete controller-and-interface read/write unit."
    source_ids:
      - unsd-cpc-3-2025
      - epa-energy-star-storage-2-1-2022
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Fail when product flow UUID ba7ecdd7-4b59-4793-b8a6-c65d7874eeb3, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and kg are not used for the generic reference identity, or when the product classification does not resolve to CPC 3.0 45271."
    source_ids: []
  - rule_id: validation_configuration
    applies_to: "Required qualifiers"
    rule: "Fail when delivery configuration, medium, raw and usable capacity convention, interface, controller, drive count, redundancy, included hardware, firmware, manufacturing route, net mass, and power-test configuration are missing or internally inconsistent."
    source_ids:
      - epa-energy-star-storage-2-1-2022
      - eu-2019-424-storage-ecodesign
  - rule_id: validation_process_coverage
    applies_to: "Process inventory"
    rule: "Fail when fixed_media_device_supply or final_configuration_test_packaging is missing, when array_enclosure_integration applies but is omitted, or when in-house device manufacturing and purchased-device upstream burdens are double counted."
    source_ids:
      - epa-energy-star-storage-2-1-2022
      - eu-2019-424-storage-ecodesign
  - rule_id: validation_mass_balance
    applies_to: "Components, products, packaging, rejects, and waste"
    rule: "Fail when process and lot mass balances are not reconciled, when packaging is included in net reference-product mass, when installed integral components are excluded from it, or when recycling and treatment credits are silently netted."
    source_ids:
      - seagate-enterprise-hdd-2016
  - rule_id: validation_power
    applies_to: "Product power and factory test energy"
    rule: "Fail when reported W lacks state, workload and exact configuration; when factory test energy and customer use-phase energy are mixed; or when W is converted to kWh without a declared duration."
    source_ids:
      - epa-energy-star-storage-2-1-2022
  - rule_id: validation_capacity
    applies_to: "Capacity and redundancy"
    rule: "Fail when raw and usable capacity are conflated, decimal and binary units are mixed without conversion, or parity, spares, checksums, cache, remapping, snapshots and system-reserved space materially affecting usable capacity are undisclosed."
    source_ids:
      - epa-energy-star-storage-2-1-2022
  - rule_id: validation_allocation
    applies_to: "Shared and multi-output operations"
    rule: "Fail when subdivision was feasible but not attempted, the allocation driver lacks a causal or documented relationship, shares do not sum to one, or economic allocation lacks price basis, period, currency and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_no_media_extrapolation
    applies_to: "Interpretation and comparison"
    rule: "Fail any use of bare NAND, packaged memory, flash-card, or other CPC 47550 evidence as a whole-product inventory for CPC 45271; fail claims that equal kg or equal nominal capacity alone establishes equivalence across HDD, SSD, hybrid, or array configurations."
    source_ids:
      - unsd-cpc-3-2025
      - epa-energy-star-storage-2-1-2022
published_dataset_profile:
  dataset_role: "Foreground manufacturer-gate data package for one homogeneous fixed-media storage-unit model, route, site, and delivery configuration"
  downstream_use: "May be published after review as a secondary_dataset or background_dataset for equipment, enterprise-system, and data-centre product models and may support downstream process and lifecyclemodel projections"
  allowed_use: "Product-footprint, supply-chain inventory, procurement, manufacturing-improvement, and background modelling where capacity, medium, interface, controller, redundancy, hardware, firmware, power, geography, technology, route, time, and mass qualifiers are representative"
  excluded_use: "Bare-chip or CPC 47550 extrapolation; removable-media modelling; functional equivalence based only on kg or nominal capacity; use-phase electricity without a declared workload and duration; data-centre infrastructure claims; another model, route, capacity, redundancy level, or array configuration without representativeness evidence"
  required_metadata: "PCR id and version; manufacturer and model; delivery configuration; HDD, fixed SSD, hybrid or array route; raw and usable capacity and unit convention; interface and protocol; controller; drive count; cache; redundancy and data-protection mode; included chassis, backplane, PSU, cooling and network elements; firmware; power states and test conditions; manufacturing and integration sites; reference period; net-mass and packaging boundary; allocation; upstream proxies; Tiangong identities"
  required_quality_disclosure: "Primary-data share; temporal, geographic and technological representativeness; BOM and serial coverage; calibration and test evidence; mass and energy-balance residuals; power-test configuration and uncertainty; waste and emission completeness; allocation; supplier and upstream-data gaps; proxy limitations; unresolved route-specific quantitative evidence"
  update_trigger: "Change in medium technology, model generation, capacity, interface, controller, drive count, redundancy, chassis, power supply, cooling, firmware, manufacturing route or site, supplier BOM, test procedure, power-management setting, allocation, packaging, upstream dataset, or Tiangong identity"
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *Central Product Classification (CPC) Version 3.0 Explanatory Notes*, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-09)"
    used_for: "CPC 45271 identity and exclusions; separation of fixed-media storage units from removable media and CPC 47550 single solid-state media"
  - id: "epa-energy-star-storage-2-1-2022"
    type: "standard"
    reference: "U.S. Environmental Protection Agency, *ENERGY STAR Program Requirements for Data Center Storage, Eligibility Criteria Version 2.1*, 19 January 2022, https://www.energystar.gov/sites/default/files/asset/document/ENERGY%20STAR%20Data%20Center%20Storage%20Version%202.1%20Final%20Specification_0.pdf (retrieved 2026-08-09)"
    used_for: "Complete storage-product boundary, storage device and controller distinctions, HDD/SSD and array configurations, raw and usable capacity, redundancy, power states, test configuration, and reporting fields"
  - id: "eu-2019-424-storage-ecodesign"
    type: "standard"
    reference: "European Commission, *Commission Regulation (EU) 2019/424 of 15 March 2019 laying down ecodesign requirements for servers and data storage products*, CELEX 32019R0424, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019R0424 (retrieved 2026-08-09)"
    used_for: "Data storage product architecture, HDD and SSD definitions, integral versus external infrastructure boundary, power supplies, resource efficiency, repairability and product-information requirements"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission, *Commission Recommendation (EU) 2021/2279 of 15 December 2021 on the use of the Environmental Footprint methods*, CELEX 32021H2279, https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32021H2279 (retrieved 2026-08-09)"
    used_for: "Allocation hierarchy: subdivision or system expansion first, then physical relationship, with other relationships only when necessary; data quality and disclosure design"
  - id: "seagate-enterprise-hdd-2016"
    type: "dataset"
    reference: "Seagate Technology, *Enterprise Performance 10K HDD Sustainability Report*, DS1663.4-0911GB, March 2016, https://www.seagate.com/gb/en/global-citizenship/product-sustainability/enterprise-performance-10k-hdd-sustainability-report/ (retrieved 2026-08-09)"
    used_for: "HDD bill-of-material grouping into enclosure, media, electronics, other parts and packaging; capacity-qualified product reporting; corroboration that component and packaging mass must remain configuration-specific"
