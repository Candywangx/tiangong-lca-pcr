allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared production lines and utilities"
    rule: "Prefer subdivision, sub-metering, batch records, machine time, or another causal driver before allocation. Document the driver and the production quantities to which it applies."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycled_metal
    applies_to: "steel swarf and other recoverable metal"
    rule: "Report waste mass and destination separately. Do not subtract an avoided-primary-metal credit inside the foreground inventory; any recycling credit belongs to the declared downstream modelling method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rejected_products
    applies_to: "rejected cylinders and reworked parts"
    rule: "Assign the burdens of rejects and rework to accepted output unless a documented physical causal model supports a different treatment; disclose internal recycling loops."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_multi_product_site
    applies_to: "residual shared burdens"
    rule: "If subdivision and causal allocation are impracticable, allocate residual shared burdens by production mass for the same reporting period and disclose the sensitivity to an alternative driver such as machine hours."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_manufacture"
      flow_role: "formed blanks and metalworking fluid"
      record_type: "purchase, stock, and transfer records"
      raw_fields: "item identity; supplier; alloy or formulation; opening stock; receipts; closing stock; returns; transferred mass"
      collection_method: "reconcile procurement and inventory records to production lots"
      unit: "kg"
      frequency: "monthly with annual reconciliation"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all in-scope component operations"
      aggregation_rule: "consumption = opening + receipts - closing - returns; normalize by accepted product mass"
      quality_evidence: "supplier specification, invoices, calibrated scales, stock reconciliation"
    - protocol_id: cp_component_chemicals
      process_id: "component_manufacture"
      flow_role: "cleaning and finishing chemicals"
      record_type: "batch sheets and concentration records"
      raw_fields: "solution mass or volume; density; active concentration; opening and closing stock; off-site returns"
      collection_method: "record each concrete chemical separately and calculate neat-equivalent mass"
      unit: "kg"
      frequency: "per bath make-up with monthly aggregation"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "every in-scope wet-treatment line"
      aggregation_rule: "sum neat-equivalent consumption and normalize by accepted product mass"
      quality_evidence: "formulation certificate, concentration test, calibrated meter or scale"
    - protocol_id: cp_component_utilities
      process_id: "component_manufacture"
      flow_role: "electricity, process water, and industrial oxygen"
      record_type: "meter and invoice records"
      raw_fields: "meter id; opening and closing reading; reference conditions; shared-load driver; downtime"
      collection_method: "direct sub-metering preferred; documented machine-hour allocation permitted"
      unit: "MJ, kg, or m3 as applicable"
      frequency: "per batch or monthly"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all in-scope component operations"
      aggregation_rule: "subtract excluded loads, allocate shared loads by causal driver, normalize by accepted product mass"
      quality_evidence: "meter calibration, invoices, allocation worksheet"
    - protocol_id: cp_component_outputs
      process_id: "component_manufacture"
      flow_role: "finished parts, steel swarf, and cleaning wastewater"
      record_type: "transfer, scale, and waste records"
      raw_fields: "output mass; reject mass; swarf mass; contamination basis; wastewater mass; destination"
      collection_method: "weigh accepted parts and outgoing wastes; document wet or dry basis"
      unit: "kg"
      frequency: "per batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all in-scope component operations"
      aggregation_rule: "aggregate accepted output and each waste separately; normalize by accepted cylinder mass"
      quality_evidence: "calibrated scales, transfer tickets, waste manifests, water balance"
    - protocol_id: cp_assembly_materials
      process_id: "assembly_test_packaging"
      flow_role: "finished parts and seal sets"
      record_type: "bills of material, issue, and loss records"
      raw_fields: "component identity; material; quantity; unit mass; issued mass; returned mass; scrap"
      collection_method: "reconcile lot-level bill of material to actual issue and loss records"
      unit: "kg"
      frequency: "per product family and batch"
      temporal_coverage: "representative continuous 12-month period"
      site_scope: "all assembly lines in scope"
      aggregation_rule: "installed plus loss mass, excluding returned reusable stock, normalized by accepted product mass"
      quality_evidence: "controlled bill of material, supplier specifications, calibrated scales"
    - protocol_id: cp_acceptance_testing
      process_id: "assembly_test_packaging"
      flow_role: "hydraulic fluid and compressed air"
      record_type: "test-bench logs and utility records"
