    applies_to: "route-conditional rows"
    rule: "Hydraulic test fluid may apply only to hydraulic products, compressed air only to pneumatic testing, sodium hydroxide only to alkaline cleaning, and industrial oxygen only to HVOF coating."
    source_ids:
