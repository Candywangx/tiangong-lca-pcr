allocation_rules:
  - rule_id: al_subdivide_first
    applies_to: "processes producing multiple equipment models or components"
    rule: "Subdivide by production order, work centre, batch, meter or operating time before allocating shared burdens."
    source_ids: []
  - rule_id: al_physical_fallback
    applies_to: "residual shared energy, water and consumables"
    rule: "When subdivision is infeasible, allocate by the causal physical driver documented for that resource, such as machine time, treated surface area, weld length, coating mass or accepted product mass."
    source_ids:
      - jrc-fabricated-metal-products-2015
  - rule_id: al_scrap_no_avoided_burden
    applies_to: "steel scrap and other recovered material leaving the gate"
    rule: "Record recovered material as a waste output with mass, quality and destination; do not subtract avoided primary production inside the foreground inventory."
    source_ids: []
  - rule_id: al_economic_last_resort
    applies_to: "inseparable co-products without a defensible physical relationship"
    rule: "Use economic allocation only as a last resort and disclose prices, currency, reference period, sensitivity and affected rows."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "p01_metal_preparation_p02_structural_joining"
      flow_role: "plate and welding-consumable input"
      record_type: "purchase, issue and return records"
      raw_fields: "order; material id; grade; gross mass; returned mass; batch; product order"
      collection_method: "calibrated scale plus traceable material ledger"
      unit: "kg"
      frequency: "per receipt and issue"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "all foreground work centres"
      aggregation_rule: "consumed mass = issued mass - returned usable mass; normalize by accepted product mass"
      quality_evidence: "calibration record; material certificate; batch-to-order reconciliation"
    - protocol_id: cp_process_energy
      process_id: "p01_metal_preparation_p02_structural_joining_p03_surface_treatment_p04_assembly_testing"
      flow_role: "process electricity"
      record_type: "submeter and machine log"
      raw_fields: "meter id; start/end reading; machine power; run time; idle time; product order"
      collection_method: "submetering; where unavailable, rated power multiplied by logged operating time with load factor documented"
      unit: "MJ"
      frequency: "per batch or monthly meter period"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "all included foreground work centres"
      aggregation_rule: "subtract documented non-production load, assign shared use by causal driver, convert to MJ and normalize"
      quality_evidence: "meter calibration; machine log; reconciliation to site bill"
    - protocol_id: cp_process_water
      process_id: "p01_metal_preparation_p03_surface_treatment"
      flow_role: "process-water input"
      record_type: "meter and bath record"
      raw_fields: "meter id; volume or mass; source; bath id; make-up; discharge"
      collection_method: "submeter or calibrated tank change"
      unit: "kg"
      frequency: "per batch or monthly"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "included wet processes"
      aggregation_rule: "sum net water crossing each process boundary; document density conversion"
      quality_evidence: "meter calibration; bath ledger; water balance"
    - protocol_id: cp_internal_transfer_mass
      process_id: "p01_metal_preparation_p02_structural_joining_p03_surface_treatment_p04_assembly_testing"
      flow_role: "internal intermediate"
      record_type: "transfer and production-order record"
      raw_fields: "order; component or structure id; sending process; receiving process; mass; time"
      collection_method: "calibrated scale or engineering mass verified by periodic weighing"
      unit: "kg"
      frequency: "each transfer batch"
      temporal_coverage: "complete production campaign"
      site_scope: "all linked foreground processes"
      aggregation_rule: "reconcile sending and receiving quantities before normalization"
      quality_evidence: "scale calibration; order traveller; reconciliation report"
    - protocol_id: cp_waste_mass
      process_id: "p01_metal_preparation_p03_surface_treatment"
      flow_role: "steel scrap and waste paint"
      record_type: "waste container and dispatch record"
      raw_fields: "waste id; container tare; gross mass; composition; hazard class; destination; date"
      collection_method: "calibrated scale at container closure or dispatch"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "all included work centres and waste stores"
      aggregation_rule: "net mass = gross - tare; assign by labelled source or documented mass balance"
      quality_evidence: "calibration; consignment note; waste classification"
    - protocol_id: cp_process_gas
      process_id: "p02_structural_joining_p03_surface_treatment"
      flow_role: "oxygen and natural gas"
      record_type: "meter or cylinder record"
      raw_fields: "gas id; volume; pressure; temperature; opening/closing meter; returned cylinder"
      collection_method: "calibrated meter or cylinder mass/volume reconciliation"
      unit: "m3"
      frequency: "per batch or monthly"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "included gas-consuming processes"
      aggregation_rule: "convert to declared reference conditions and normalize"
      quality_evidence: "meter calibration; supplier record; reference-condition calculation"
    - protocol_id: cp_coating_material
      process_id: "p03_surface_treatment"
      flow_role: "primer and alkaline cleaner"
      record_type: "mixing and issue record"
      raw_fields: "product id; batch; supplied mass; concentration; solids; mixed mass; returned mass; treated order"
      collection_method: "calibrated scale and formulation ledger"
      unit: "kg"
      frequency: "each mix and coating batch"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "all included coating lines"
      aggregation_rule: "calculate consumed product or active substance from issued-minus-returned mass and concentration"
      quality_evidence: "scale calibration; SDS; formulation; batch reconciliation"
    - protocol_id: cp_purchased_component
      process_id: "p04_assembly_testing"
      flow_role: "installed motor, hydraulic unit and engine"
      record_type: "bill of materials and installation record"
      raw_fields: "component id; supplier; model; count; mass; rated capacity; product order"
      collection_method: "purchase/BOM reconciliation with periodic weighing"
      unit: "kg or Item(s)"
      frequency: "each product order"
      temporal_coverage: "complete production campaign"
      site_scope: "final assembly and included suppliers"
      aggregation_rule: "sum installed quantities by exact component identity and normalize"
      quality_evidence: "supplier declaration; BOM; installation sign-off"
    - protocol_id: cp_factory_test
      process_id: "p04_assembly_testing"
      flow_role: "acceptance-test diesel"
      record_type: "issue and test log"
      raw_fields: "product order; fuel batch; issued mass; returned mass; test start/end; test result"
      collection_method: "calibrated fuel issue meter or scale"
      unit: "kg"
      frequency: "each test"
      temporal_coverage: "complete production campaign"
      site_scope: "factory acceptance-test area"
      aggregation_rule: "consumed mass = issued - recovered/returned fuel; exclude fuel remaining in declared product state"
      quality_evidence: "calibration; test record; fuel ledger"
    - protocol_id: cp_direct_emission
      process_id: "p02_structural_joining_p03_surface_treatment_p04_assembly_testing"
      flow_role: "direct air emissions"
      record_type: "monitoring and calculation record"
      raw_fields: "source id; operating period; measured concentration and flow or fuel quantity/composition; capture efficiency; method"
      collection_method: "stack measurement or transparent mass-balance calculation from collected activity data"
      unit: "kg"
      frequency: "each test campaign and reporting period"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "all direct foreground emission points"
      aggregation_rule: "sum measured and calculated direct releases; exclude upstream emissions; normalize"
      quality_evidence: "accredited report or calculation sheet; instrument calibration; activity-data reconciliation"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "every non-reference inventory row"
      rule: "normalized quantity = process quantity / accepted product mass * 1,000 kg"
      inputs:
        - "collected process quantity"
        - "accepted product mass"
      output: "row quantity per 1,000 kg reference product"
      source_ids: []
    - id: calc_shared_energy
      applies_to: "shared process electricity"
      rule: "assigned energy = metered period energy * documented causal driver for the product order / total driver in the meter period"
      inputs:
        - "meter readings"
        - "operating time"
        - "machine time or another justified driver"
      output: "MJ assigned to the product order"
      source_ids:
        - uctug-et-al-heavy-machinery-2025
    - id: calc_active_naoh
      applies_to: "sodium-hydroxide input"
      rule: "active NaOH mass = solution mass added * measured or supplier-declared NaOH mass fraction"
      inputs:
        - "solution mass"
        - concentration
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "direct fuel combustion"
      rule: "fossil CO2 = fuel mass or reference-condition volume * fossil carbon content * oxidation fraction * 44/12; disclose every factor and exclude upstream emissions"
      inputs:
        - "fuel record"
        - composition
        - "oxidation factor"
      output: "kg fossil carbon dioxide to air"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "fabrication and assembly mass balance"
      rule: "received materials and components = accepted product + internal inventory change + wastes + quantified direct material losses, within documented measurement uncertainty"
      inputs:
        - material
        - component
        - internal-transfer
        - "waste and product mass records"
      output: "reconciliation difference and completeness finding"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and components"
      requirement: "Retain product model, configuration, rated capacity, drive type, attachments, BOM revision and accepted serial/order identifiers."
      evidence: "product specification; BOM; acceptance certificate"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative continuous 12-month period or the complete production campaign; disclose shutdowns, prototypes and abnormal batches."
      evidence: "dated ledgers, meter series and production schedule"
    - id: dq_completeness
      applies_to: "all process rows"
      requirement: "Reconcile mass, energy meters, purchased components, waste dispatches and direct emissions; explain every omitted applicable exchange."
      evidence: "reconciliation report and omission register"
    - id: dq_geography_technology
      applies_to: "upstream links"
      requirement: "Match supplier geography, material grade, recycled content, electricity grid, fuel supply and component technology; disclose proxies."
      evidence: "supplier declarations and dataset metadata"
    - id: dq_measurement
      applies_to: "foreground measurements"
      requirement: "Use calibrated instruments and retain unit conversions, meter coverage, allocation drivers, detection limits and uncertainty."
      evidence: "calibration certificates and calculation workbooks"
    - id: dq_conditional_routes
      applies_to: "coating, hydraulic and diesel routes"
      requirement: "Mark each conditional process and exchange applicable or not applicable using documented product and routing evidence; never average absent routes into a product record."
      evidence: "routing sheet; product specification; process traveller"
validation_rules:
  - rule_id: vr_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly 1,000 kg of accepted factory-gate product and all required qualifiers; the UUID, mass property and kg unit must match the reference-flow definition."
    source_ids: []
  - rule_id: vr_process_linkage
    applies_to: "internal intermediates"
    rule: "Confirm every internal supplying row has an equal receiving row after declared inventory change and that only one coated or uncoated structural route feeds final assembly."
    source_ids: []
  - rule_id: vr_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Confirm every selected flow is one physical, chemical, waste, energy or elementary exchange and that conditional applicability is explicit."
    source_ids: []
  - rule_id: vr_mass_balance
    applies_to: "fabrication and assembly"
    rule: "Run calc_mass_reconciliation; investigate differences outside documented measurement uncertainty and prohibit unexplained negative waste or material values."
    source_ids: []
  - rule_id: vr_energy_boundary
    applies_to: "electricity and fuels"
    rule: "Reconcile process energy to site bills, exclude post-gate operating energy, and keep electricity, natural gas and diesel as separate exchanges."
    source_ids:
      - jrc-fabricated-metal-products-2015
      - uctug-et-al-heavy-machinery-2025
  - rule_id: vr_direct_emissions
    applies_to: "fossil CO2 and welding particulate"
    rule: "Confirm only direct foreground releases are reported; retain monitoring or carbon-balance evidence and exclude upstream supply-chain emissions."
    source_ids: []
  - rule_id: vr_unresolved_evidence
    applies_to: "UUID and range review gaps"
    rule: "Before publication, resolve each manifest UUID gap and either add a compliant two-source empirical range or retain a reviewed, explicit evidence need without inventing a range."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing-gate datasets for complete lifting equipment matching the declared product family, configuration, capacity, drive, coating route, geography, year and included components"
  excluded_use: "Comparative claims between unlike crane types or capacities without functional equivalence; crane-lorry manufacture as a road vehicle; installation, operation, maintenance or end-of-life modelling without added lifecycle processes"
  required_metadata: "canonical PCR id; reference-flow UUID; product family/model; rated capacity and duty class; mobility and drive; attachments; factory-supplied fluids; BOM revision; coating route; manufacturing site/geography/year; outsourced steps; allocation; data coverage"
  required_quality_disclosure: "foreground period and coverage; instrument calibration; meter allocation; mass reconciliation; conditional-route decisions; upstream proxies; unresolved UUID/range evidence; uncertainty and data-quality assessment"
  update_trigger: "material change in product design, capacity class, drive system, bill of materials, steel grade, coating route, manufacturing technology, supplier geography, energy mix, allocation method or foreground data period"
