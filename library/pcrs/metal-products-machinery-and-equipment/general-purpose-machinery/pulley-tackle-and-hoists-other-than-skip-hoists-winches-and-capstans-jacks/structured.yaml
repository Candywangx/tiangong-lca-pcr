allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared foreground processes"
    rule: "Avoid allocation by subdividing meters, work orders, production cells, batches, coating lines, test benches, and waste records to the declared product or homogeneous product family."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "residual shared energy and material use"
    rule: "When subdivision is impracticable, allocate using a documented physical driver causally related to consumption, such as machine time, test time, mass throughput, coated area, or counted packaging units; economic allocation requires explicit justification and sensitivity analysis."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_rule_3
    applies_to: "steel, aluminium, used oil and waste paint"
    rule: "Report transferred scrap and wastes as separate outputs at measured mass; do not subtract avoided primary production or downstream recycling credits inside the foreground manufacturing process."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "rework and rejected products"
    rule: "Attribute rework energy/materials and rejected-product wastes to the production period and product family that caused them; disclose whether saleable off-specification equipment is a co-product and apply subdivision before any allocation."
    source_ids:
      - eu-commission-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_inputs
      process_id: "component_fabrication"
      flow_role: "received materials, electricity, water and lubricant"
      record_type: "bills of materials, purchase/issue/return records, meters"
      raw_fields: "product id; material/flow id; grade/state; gross/return mass; meter start/end; kWh or m3; density; batch; timestamp"
      collection_method: "reconcile job records to procurement, stock change and submeters"
      unit: "kg, kWh, m3"
      frequency: "each job or meter interval"
      temporal_coverage: "representative continuous 12 months or complete low-volume campaign"
      site_scope: "all reporting-site fabrication cells and attributable auxiliaries"
      aggregation_rule: "sum by atomic flow and product family; convert units; allocate only residual shared totals by documented physical driver"
      quality_evidence: "calibrated meter/weigh scale records, signed inventory reconciliation, supplier specifications"
    - protocol_id: cp_fabrication_outputs
      process_id: "component_fabrication"
      flow_role: "segregated scrap, used oil and particulate emission"
      record_type: "weigh tickets, waste manifests, monitoring and operating records"
      raw_fields: "waste id; material; mass; destination; activity; emission factor; capture efficiency; operating time; timestamp"
      collection_method: "reconcile segregated transfers and emission calculations to process activity"
      unit: "kg"
      frequency: "each transfer and reporting interval"
      temporal_coverage: "same period as fabrication inputs"
      site_scope: "all reporting-site fabrication cells and controls"
      aggregation_rule: "sum by atomic flow; subtract only documented internal reuse that never crosses the boundary"
      quality_evidence: "waste manifests, calibration, laboratory/permit reports, calculation workbook"
    - protocol_id: cp_joining_inputs
      process_id: "joining"
      flow_role: "electricity, welding wire and oxygen"
      record_type: "work orders, issue/return records, meters and cylinder logs"
      raw_fields: "product id; wire id/mass; oxygen volume; reference conditions; kWh; joint/process; timestamp"
      collection_method: "reconcile job consumption and meters to joining work orders"
      unit: "kg, m3, kWh"
      frequency: "each job or batch"
      temporal_coverage: "same production period as reference product"
      site_scope: "all reporting-site joining cells and extraction"
      aggregation_rule: "sum by atomic flow; convert electricity to MJ; allocate residual shared totals by arc time or documented work time"
      quality_evidence: "issue records, gas certificates, calibrated meters, work-order traceability"
    - protocol_id: cp_joining_outputs
      process_id: "joining"
      flow_role: "direct particulate emission"
      record_type: "monitoring, fume-control and joining activity records"
      raw_fields: "joining process; consumable mass; operating time; emission factor; capture/abatement efficiency; measured concentration/flow; timestamp"
      collection_method: "direct measurement or transparent activity-factor calculation"
      unit: "kg"
      frequency: "each monitoring interval or homogeneous process batch"
      temporal_coverage: "same production period as joining inputs"
      site_scope: "all reporting-site joining release points"
      aggregation_rule: "calculate uncaptured emitted mass and normalize to reference product"
      quality_evidence: "permit/stack-test evidence, control-maintenance records, calculation workbook"
    - protocol_id: cp_coating_inputs
      process_id: "surface_treatment"
      flow_role: "electricity, natural gas, water, sodium hydroxide and oil-based paint"
      record_type: "meters, batch sheets, purchase/issue/return and bath records"
      raw_fields: "product id; coated area; kWh; gas m3 and conditions; water; chemical solution mass/concentration; paint mass/VOC content; timestamp"
      collection_method: "reconcile line records to utility meters, inventories and bath makeup"
      unit: "kg, m3, kWh"
      frequency: "each coating batch and meter interval"
      temporal_coverage: "representative continuous 12 months or complete coating campaign"
      site_scope: "all reporting-site cleaning, painting, curing and attributable controls"
      aggregation_rule: "sum by atomic flow; convert electricity and solution concentration; allocate residual shared totals by coated area or line time"
      quality_evidence: "calibrated meters, supplier SDS/specifications, bath analyses, inventory reconciliation"
    - protocol_id: cp_coating_outputs
      process_id: "surface_treatment"
      flow_role: "waste paint, cleaning wastewater, fossil CO2 and NMVOC"
      record_type: "waste manifests, effluent meters, fuel records, coating/abatement records"
      raw_fields: "waste mass; wastewater mass/volume/density; gas volume/carbon content/oxidation; paint VOC content; transfer and destruction efficiency; timestamp"
      collection_method: "weigh/meter outputs and calculate direct emissions from collected activity"
      unit: "kg"
      frequency: "each transfer, batch or reporting interval"
      temporal_coverage: "same period as coating inputs"
      site_scope: "all reporting-site coating waste and release points"
      aggregation_rule: "sum by atomic flow; preserve treatment destination; avoid upstream emission double counting"
      quality_evidence: "manifests, laboratory results, calibrated meters, supplier factors, permit/abatement evidence"
    - protocol_id: cp_assembly_test_inputs
      process_id: "final_assembly_testing"
      flow_role: "motor, electricity, hydraulic fluid and diesel"
      record_type: "bill of materials, fill sheets, test logs, meters, fuel issue records"
      raw_fields: "product serial; component mass; kWh; fluid/fuel mass; test type; maximum working load; test duration; timestamp"
      collection_method: "trace each serial or homogeneous batch through assembly and test"
      unit: "kg, kWh"
      frequency: "each product or homogeneous test batch"
      temporal_coverage: "complete reporting production period"
      site_scope: "all assembly stations and factory test benches"
      aggregation_rule: "sum direct records; convert electricity to MJ; allocate test-bench residuals by test time"
      quality_evidence: "serial traceability, calibrated load/test equipment, signed test report, meter and issue records"
    - protocol_id: cp_assembly_test_outputs
      process_id: "final_assembly_testing"
      flow_role: "fossil CO2 from diesel testing"
      record_type: "fuel and test records"
      raw_fields: "diesel mass; carbon content; oxidation factor; product serial; test duration; timestamp"
      collection_method: "calculate direct CO2 from collected fuel and documented factors"
      unit: "kg"
      frequency: "each test batch"
      temporal_coverage: "same period as assembly/test inputs"
      site_scope: "reporting-site diesel test equipment"
      aggregation_rule: "sum direct emitted mass and normalize to reference product"
      quality_evidence: "fuel specification, test log, calculation workbook"
    - protocol_id: cp_packaging_release
      process_id: "packaging"
      flow_role: "packaging inputs and reference-product output"
      record_type: "packaging specification, issue/return records and final weighing"
      raw_fields: "product serial; packaging component id; mass; count; pallet allocation/reuse; complete product mass; timestamp"
      collection_method: "reconcile packaging issues to each released product and final scale reading"
      unit: "kg"
      frequency: "each shipment configuration"
      temporal_coverage: "complete reporting production period"
      site_scope: "packaging and release area at reporting site"
      aggregation_rule: "sum each atomic packaging material and reconcile packaged product output to final weight"
      quality_evidence: "approved packaging specification, calibrated scale, shipment and serial records"
  calculation_rules:
    - id: calc_electricity_mj
      applies_to: "every electricity row"
      rule: "electricity_MJ = metered_or_allocated_kWh × 3.6"
      inputs:
        - "kWh by process and allocation record"
      output: "MJ per reference product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_solution_active_mass
      applies_to: "sodium hydroxide"
      rule: "NaOH_mass = solution_mass × measured_or_supplier_mass_fraction"
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg sodium hydroxide per reference product"
      source_ids:
        - us-epa-fabricated-metal-products-1995
    - id: calc_liquid_mass
      applies_to: "volume-recorded water, wastewater, oil, hydraulic fluid or diesel"
      rule: "liquid_mass = measured_volume × documented_density_at_reference_conditions"
      inputs:
        - volume
        - density
        - "temperature/reference conditions"
      output: "kg per reference product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_fossil_co2
      applies_to: "coating natural gas and diesel test combustion"
      rule: "fossil_CO2_mass = collected_fuel_amount × documented_fossil_carbon_content × oxidation_fraction × 44/12, with unit conversions shown"
      inputs:
        - "fuel amount"
        - "carbon content"
        - "oxidation fraction"
      output: "kg fossil CO2 per reference product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_nmvoc
      applies_to: "oil-based painting"
      rule: "emitted_NMVOC = applied_paint_mass × VOC_mass_fraction - captured_liquid_VOC - destroyed_VOC, bounded by documented mass balance"
      inputs:
        - "paint mass"
        - "VOC content"
        - "captured waste"
        - "destruction efficiency"
      output: "kg NMVOC to air per reference product"
      source_ids:
        - us-epa-fabricated-metal-products-1995
    - id: calc_shared_process_allocation
      applies_to: "residual shared records"
      rule: "product_amount = reconciled_process_total × product_physical_driver / sum_physical_drivers"
      inputs:
        - "reconciled total"
        - "product and total driver values"
      output: "atomic flow amount per reference product"
      source_ids:
        - eu-commission-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and purchased components"
      requirement: "Preserve serial/product-family traceability and declare subtype, drive, rated load, configuration, duty, design life/cycles, included components and packaging state."
      evidence: "product specification, bill of materials, label, serial record and test report"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile all known material, energy, water, product, waste, and direct-emission records to site totals; explain additions, zero/not-applicable conditions, exclusions, and data gaps."
      evidence: "reconciliation workbook, process map, meter/waste totals and signed exception log"
    - id: dq_measurement
      applies_to: "meters, scales, concentrations and test equipment"
      requirement: "Use calibrated or verified equipment and retain unit, reference conditions, calibration status, sampling method, uncertainty, and conversions."
      evidence: "calibration certificate, laboratory report, supplier specification and calculation workbook"
    - id: dq_temporal
      applies_to: "foreground reporting period"
      requirement: "Use a representative continuous 12-month period or a complete production campaign for low-volume products; disclose seasonality, downtime, rework, and abnormal production."
      evidence: "dated production, meter, inventory, waste and shipment records"
    - id: dq_representativeness
      applies_to: "foreground and upstream datasets"
      requirement: "Assess technological, geographical and time representativeness and precision; justify any proxy dataset or allocation driver."
      evidence: "data-quality assessment using TeR, GeR, TiR and precision criteria"
    - id: dq_uuid_localization
      applies_to: "UUID-bearing flows"
      requirement: "Verify public state 100, flow type, classification, property and unit group, and preserve the official Tiangong Chinese baseName in the aligned Chinese rendering."
      evidence: "finalized receipt-backed direct-read audit"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "PCR and reference-product identity"
    rule: "Confirm that the manifest id, English and Chinese frontmatter, canonical PCR id, CPC context, reference-product UUID, flow property, unit group, and required qualifiers are mutually consistent."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "functional unit"
    rule: "Reject a dataset that substitutes one kilogram of unspecified equipment for the declared lifting/pulling/support function; rated load, quality/test status, and design life or cycles must be present."
    source_ids:
      - eu-commission-pef-method-2021
      - eu-machinery-regulation-2023-1230
  - rule_id: validation_rule_3
    applies_to: "inventory completeness"
    rule: "Confirm that every included process has all known atomic inputs and outputs, each conditional row states why it applies, and actual product-specific exchanges absent from the pattern have been added rather than hidden by cut-off."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: validation_rule_4
    applies_to: "mass and waste reconciliation"
    rule: "Reconcile material inputs with product mass, retained coatings/fluids, segregated scrap, wastes, emissions, stock change, and documented moisture or unmeasured differences without netting recycling credits."
    source_ids:
      - us-epa-fabricated-metal-products-1995
  - rule_id: validation_rule_5
    applies_to: "energy and direct emissions"
    rule: "Reconcile electricity, natural gas and diesel to meters/invoices; verify kWh-to-MJ conversion; confirm fossil CO2 includes only direct on-site combustion and NMVOC/particulate calculations include documented controls."
    source_ids:
      - eu-commission-pef-method-2021
      - us-epa-fabricated-metal-products-1995
  - rule_id: validation_rule_6
    applies_to: "factory testing"
    rule: "Confirm that required static/dynamic test status, test load basis, test energy/fuel, rejected material and rework are represented for products ready to be put into service."
    source_ids:
      - eu-machinery-regulation-2023-1230
  - rule_id: validation_rule_7
    applies_to: "UUID and bilingual alignment"
