allocation_rules:
  - rule_id: allocation_1
    applies_to: "product_and_process_assignment"
    rule: "Avoid allocation by separately metering and recording product-specific material, machine, furnace, line, and test activity wherever practicable."
    source_ids: []
  - rule_id: allocation_2
    applies_to: "shared_resources"
    rule: "When direct measurement is unavailable, allocate a shared resource only with a documented causal engineering parameter such as machine time, furnace occupancy and cycle, treated surface area, or test-stand time; mass allocation may be used only when the products use materially comparable operations."
    source_ids: []
  - rule_id: allocation_3
    applies_to: "metal_scrap"
    rule: "Report gross metal inputs and outgoing scrap without subtracting a recycling credit inside the foreground process; disclose scrap destination and apply any substitution or recycled-content convention only once in the downstream LCA method."
    source_ids: []
  - rule_id: allocation_4
    applies_to: "nonconforming_product"
    rule: "Assign rework and reject burdens to the production lot that generated them; record recovered material as an explicit waste or product output and document inventory changes."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_records
      process_id: "material_receipt_and_primary_shaping"
      flow_role: "Purchased metals, electricity, natural gas, scrap, and direct combustion emission"
      record_type: "Scale tickets, receiving and inventory records, utility meters, furnace logs, waste manifests"
      raw_fields: "product code; material grade; opening and closing inventory; received and returned mass; electricity; gas volume and reference conditions; conforming output; scrap mass; fossil carbon data"
      collection_method: "Reconcile calibrated scales, invoices, submeters, furnace batches, and waste transfers by product route"
      unit: "kg; MJ; m3"
      frequency: "Per receipt, batch, meter interval, and waste transfer; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign for campaign production"
      site_scope: "All onsite shaping equipment and directly associated controls and extraction"
      aggregation_rule: "Sum boundary-crossing quantities, adjust inventory change, allocate shared activity causally, then divide by conforming net output mass"
      quality_evidence: "Calibration records, invoices, batch logs, allocation worksheet, waste manifests, and anomaly review"
    - protocol_id: cp_machining_records
      process_id: "machining_and_tooth_generation"
      flow_role: "Electricity, water, cutting fluid, chips, and waste cutting oil"
      record_type: "Submeters, machine logs, purchase and inventory records, water meters, waste manifests"
      raw_fields: "machine id; product code; run time; electricity; water; fluid additions; opening and closing fluid inventory; chip mass; waste-oil mass; conforming output"
      collection_method: "Reconcile machine and fluid-system records with boundary meters and dispatched wastes"
      unit: "kg; MJ"
      frequency: "Per batch and meter interval; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "All onsite machining and tooth-generation equipment in scope"
      aggregation_rule: "Sum and inventory-adjust each atomic flow, allocate by documented machine activity, divide by conforming net output mass"
      quality_evidence: "Meter calibration, purchase records, production logs, waste tickets, and reconciliation worksheet"
    - protocol_id: cp_heat_treatment_records
      process_id: "heat_treatment"
      flow_role: "Electricity, natural gas, quenching oil, spent oil, and direct combustion emission"
      record_type: "Furnace meters and batch logs, oil inventory, waste manifests, fuel carbon information"
      raw_fields: "furnace id; cycle; batch load; electricity; gas volume and reference conditions; oil additions; oil inventory; spent oil; conforming output; fossil carbon data"
      collection_method: "Reconcile each furnace campaign and allocate shared cycles by occupied furnace capacity and cycle"
      unit: "kg; MJ; m3"
      frequency: "Per furnace batch and waste transfer; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "All onsite heat-treatment equipment in scope"
      aggregation_rule: "Sum energy and oil balances, calculate direct fossil CO2 where used, divide by conforming net output mass"
      quality_evidence: "Meter calibration, furnace logs, supplier data, waste tickets, and batch reconciliation"
    - protocol_id: cp_surface_records
      process_id: "surface_treatment"
      flow_role: "Electricity, water, sodium hydroxide, wastewater, and sludge"
      record_type: "Line meters, bath make-up logs, chemical invoices, concentration certificates, discharge meters, sludge tickets"
      raw_fields: "line id; product code; treated mass or area; electricity; water; cleaner solution mass; NaOH fraction; bath inventory; wastewater; sludge wet mass; dry solids; conforming output"
      collection_method: "Reconcile bath additions, rinses, treatment outputs, and production line records"
      unit: "kg; MJ"
      frequency: "Per bath addition, batch, meter interval, and waste transfer; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "All onsite surface-treatment and directly associated wastewater-treatment equipment"
      aggregation_rule: "Calculate active NaOH, adjust inventories, allocate shared line activity causally, divide by conforming net output mass"
      quality_evidence: "Meter calibration, chemical certificates, bath logs, discharge records, laboratory results, and waste manifests"
    - protocol_id: cp_assembly_records
      process_id: "assembly_testing_and_release"
      flow_role: "Electricity, permanent grease, and released product"
      record_type: "Submeters, tool or test-stand logs, grease issue or fill records, calibrated product scales"
      raw_fields: "product model; serial or lot; electricity; test time; grease issued and returned; filled mass; net product mass; released quantity"
      collection_method: "Reconcile released product, grease mass balance, and equipment activity for conforming units"
      unit: "kg; MJ"
      frequency: "Per lot and meter interval; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "All onsite assembly, test, inspection, and release equipment in scope"
      aggregation_rule: "Sum each input, allocate shared activity causally, divide by released net product mass"
      quality_evidence: "Scale and meter calibration, test records, bill of materials, grease fill records, and release certificate"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "All inventory rows"
      rule: "Normalized amount = inventory-adjusted amount assigned to conforming product / conforming net finished-product mass"
      inputs:
        - "Boundary-crossing amount"
        - "opening and closing inventory"
        - "returns or transfers"
        - "causal allocation"
        - "conforming net product mass"
      output: "Amount per 1 kg reference product"
      source_ids: []
    - id: calc_active_naoh
      applies_to: "sodium_hydroxide"
      rule: "Active NaOH mass = cleaner solution mass × supplier or measured NaOH mass fraction + direct solid NaOH additions, adjusted for opening and closing inventory"
      inputs:
        - "Solution mass"
        - "NaOH fraction"
        - "solid additions"
        - "inventory change"
      output: "kg sodium hydroxide per 1 kg reference product"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "forming_fossil_co2; heat_treatment_fossil_co2"
      rule: "Fossil CO2 mass = oxidized fossil carbon mass × 44 / 12; use a verified site- or supplier-specific carbon and oxidation record and keep forming and heat-treatment fuel separate"
      inputs:
        - "Allocated fuel amount"
        - "fossil carbon content"
        - "oxidation fraction"
      output: "kg direct fossil CO2 per 1 kg reference product"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "Metal-bearing processes"
      rule: "Reconcile opening inventory + metal inputs with closing inventory + conforming product + metal outputs and documented losses; investigate rather than force-balance unexplained differences"
      inputs:
        - "Metal receipts"
        - inventory
        - "product mass"
        - "scrap and chip mass"
        - "documented transfers"
      output: "Process mass-balance discrepancy and explanation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and material inputs"
      requirement: "Retain product model, drawing or specification, material grade, product family, heat-treatment state, surface treatment, and factory-gate state for each represented lot."
      evidence: "Released-product certificate, bill of materials, drawings, material certificates, and lot traceability"
    - id: dq_measurement
      applies_to: "Scales, meters, and analytical values"
      requirement: "Use calibrated or legally controlled devices; retain unit, calibration status, measurement boundary, reference conditions, and conversion factors."
      evidence: "Calibration certificates, meter register, laboratory method, and conversion worksheet"
    - id: dq_temporal
      applies_to: "Foreground activity"
      requirement: "Cover at least 12 consecutive representative months or the complete campaign; disclose shutdowns, start-ups, abnormal batches, and substitutions."
      evidence: "Dated production, purchasing, meter, inventory, and waste records"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile each process against purchase, meter, production, inventory, and waste-control totals and explain exclusions or values recorded as zero."
      evidence: "Reconciliation workbook, variance review, and responsible-person approval"
    - id: dq_allocation
      applies_to: "Shared operations"
      requirement: "Document why the selected causal parameter represents resource use and retain both total shared activity and allocated product activity."
      evidence: "Meter totals, machine or furnace logs, allocation worksheet, and sensitivity check"
    - id: dq_waste
      applies_to: "Scrap, chips, oils, wastewater, and sludge"
      requirement: "Retain physical state, contamination or dry-solids information where relevant, measurement basis, destination, and whether treatment occurs onsite or offsite."
      evidence: "Waste manifest, scale ticket, laboratory result, discharge record, and contractor receipt"
validation_rules:
  - rule_id: validation_1
    applies_to: "reference_flow"
    rule: "Confirm that inventory is normalized to exactly 1 kg net finished product and that the declared product and required qualifiers are complete."
    source_ids: []
  - rule_id: validation_2
    applies_to: "inventory_identity"
    rule: "Confirm every inventory card contains one atomic exchange and either a verified Tiangong UUID or the same explicit unresolved row id recorded in the manifest."
    source_ids: []
  - rule_id: validation_3
    applies_to: "process_route"
    rule: "Confirm that every included process matches the declared manufacturing route and that each conditional process and route-specific row recorded as zero is demonstrably absent."
    source_ids:
      - us-epa-metal-products-machinery-2003
  - rule_id: validation_4
    applies_to: "metal_mass_balance"
    rule: "Reconcile metal input, inventory change, finished product, scrap, chips, and documented losses for each applicable metal-bearing process; investigate material discrepancies before release."
    source_ids: []
  - rule_id: validation_5
    applies_to: "energy_and_emissions"
    rule: "Reconcile process electricity and fuel with site meter totals and ensure direct fossil CO2 excludes upstream electricity and fuel-supply emissions."
    source_ids: []
  - rule_id: validation_6
    applies_to: "wastewater_and_sludge"
    rule: "Reconcile surface-process water with reuse, wastewater, evaporation where measured, product carryover, and sludge moisture; disclose any unmeasured term."
    source_ids:
      - us-epa-metal-products-machinery-2003
  - rule_id: validation_7
    applies_to: "evidence_and_ranges"
    rule: "Reject externally inferred ranges unless at least two mutually independent original sources have compatible boundary, functional unit, and product state; unresolved range needs remain foreground collection requirements rather than invented values."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-factory-gate foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset when the declared product and route are representative for the consuming model"
  allowed_use: "LCA of products and systems consuming the declared transmission or power-drive product; manufacturing improvement; supplier and route comparison after functional and boundary alignment"
  excluded_use: "Comparison of different product families without rated-function and service-life alignment; use-phase claims; repair or remanufacture claims; generic regional market modelling without representativeness review"
  required_metadata: "PCR id and version; product model and family; material grades; net mass; rated load or torque; speed ratio where relevant; efficiency or backlash where relevant; route; site and geography; reporting period; allocation; scrap and waste destinations; upstream dataset references; unresolved identities"
  required_quality_disclosure: "Temporal and site coverage; measurement and calibration status; data completeness; allocation and mass-balance results; route exclusions; proxy datasets; direct-emission method; wastewater and sludge basis; unresolved UUID and range evidence needs"
  update_trigger: "Material change in product design, bill of materials, route, heat or surface treatment, site energy supply, allocation, waste destination, data older than the applicable representativeness period, or resolution of a recorded identity or evidence gap"
