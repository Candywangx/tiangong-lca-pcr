allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared manufacturing and test operations"
    rule: "Avoid allocation by metering or subdividing production orders, work centres, test cells and waste streams whenever technically feasible."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_causal_driver
    applies_to: "remaining shared electricity, fuel, water, gases and waste"
    rule: "When subdivision is infeasible, allocate using a documented causal driver appropriate to the exchange, such as measured machine-hours and load for electricity, burner test time and thermal input for gas, or weighed production-order mass for wastes; do not use revenue unless no physical relationship can be justified."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_coproduct_disclosure
    applies_to: "saleable by-products and recovered materials"
    rule: "Record each physical co-product or waste output before any downstream treatment, disclose ownership and end-of-waste status, and document the allocation or system-expansion treatment selected by the governing study method; do not silently subtract an avoided-burden credit from foreground amounts."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "equipment_manufacturing"
      flow_role: "material, component and packaging inputs"
      record_type: "product-specific BOM, stores issue/return, supplier specification and weighing record"
      raw_fields: "production order; component or material id; specification or grade; supplier; issued mass; returned mass; installed mass; packaging mass; date"
      collection_method: "Reconcile approved BOM to issued and returned quantities and retain supplier specifications; weigh packaging when BOM mass is unavailable"
      unit: "kg"
      frequency: "each production order"
      temporal_coverage: "complete production order from material issue through shipment"
      site_scope: "all manufacturing sites and outsourced BOM contributors in scope"
      aggregation_rule: "Sum net issued mass by atomic material/component and normalize with calc_normalize_reference_mass"
      quality_evidence: "approved BOM revision; stores transactions; calibration record; supplier certificate; shipment record"
    - protocol_id: cp_electricity
      process_id: "equipment_manufacturing"
      flow_role: "purchased electricity"
      record_type: "revenue meter, submeter and machine/test-cell log"
      raw_fields: "meter id; opening and closing reading; unit; timestamp; production order; machine or test cell; run hours; measured load; allocation driver"
      collection_method: "Prefer production-order submetering; otherwise allocate site-meter change using causal measured loads or machine-hours"
      unit: "kWh and MJ"
      frequency: "continuous or each shift, aggregated per order"
      temporal_coverage: "full fabrication, assembly, testing and packaging period"
      site_scope: "every foreground manufacturing site"
      aggregation_rule: "Convert kWh to MJ and normalize with calc_normalize_reference_mass; reconcile allocated totals to site meter"
      quality_evidence: "meter calibration; bills; submeter export; machine log; reconciliation"
    - protocol_id: cp_fuels_gases_water
      process_id: "equipment_manufacturing"
      flow_role: "natural gas, industrial oxygen, process water and combustion carbon"
      record_type: "meter, cylinder inventory, delivery, composition and test log"
      raw_fields: "flow id; opening/closing meter; delivered and returned quantity; unit; temperature; pressure; composition or purity; carbon content; test purpose; production order"
      collection_method: "Meter attributable use; otherwise reconcile inventory change and deliveries to production/test records"
      unit: "native m3 or kg, with declared conversion"
      frequency: "each test or production order"
      temporal_coverage: "full manufacturing and acceptance-test period"
      site_scope: "every site using the exchange"
      aggregation_rule: "Convert gases to declared reference conditions; calculate attributable fossil carbon dioxide with calc_fossil_co2; normalize all values"
      quality_evidence: "calibrated meter; cylinder ledger; delivery note; gas certificate; water meter; test log; calculation sheet"
    - protocol_id: cp_wastes
      process_id: "equipment_manufacturing"
      flow_role: "steel scrap and refractory installation offcuts"
      record_type: "weighbridge, bin scale, waste transfer and production-order segregation record"
      raw_fields: "waste type; composition; gross/tare/net mass; production order; contamination; destination; date; end-of-waste status"
      collection_method: "Segregate and weigh each atomic waste stream; use issued-minus-installed-minus-returned mass balance only when physical weighing is impracticable"
      unit: "kg"
      frequency: "each container or production order"
      temporal_coverage: "full manufacturing period"
      site_scope: "all foreground sites and attributable outsourced operations"
      aggregation_rule: "Sum net waste mass by row and normalize with calc_normalize_reference_mass"
      quality_evidence: "calibrated scale; photographs or segregation audit; transfer note; mass-balance reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "equipment_manufacturing"
      flow_role: "direct particulate matter and nitrogen oxides"
      record_type: "stack or exhaust measurement and operating/test log"
      raw_fields: "pollutant identity; compartment; concentration; exhaust volume or flow and duration; moisture and reference conditions; control status; fuel/test event; production order"
      collection_method: "Use jurisdiction-compliant measurement where required; otherwise use documented concentration × dry-gas-volume calculation matched to attributable operation"
      unit: "kg after calculation"
      frequency: "each representative test campaign and whenever process/control changes"
      temporal_coverage: "representative of reporting year and all declared emission routes"
      site_scope: "every foreground emission point in scope"
      aggregation_rule: "Calculate emitted mass after controls, aggregate by atomic elementary flow, and normalize with calc_normalize_reference_mass"
      quality_evidence: "laboratory report; instrument calibration; sampling plan; operating log; calculation sheet"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every non-reference inventory row"
      rule: "normalized amount = attributable exchange amount × 1,000 kg / net complete equipment output mass for the same production-order population"
      inputs:
        - "attributable row amount"
        - "net equipment output mass excluding transport packaging"
      output: "row amount per 1,000 kg net complete equipment"
      source_ids:
        - eu-pef-method-2021
    - id: calc_bom_reconciliation
      applies_to: "material and component rows"
      rule: "net issued mass = issued mass − returned-to-store mass; reconcile net issued mass to incorporated mass + separately recorded scrap/offcuts + documented inventory change"
      inputs:
        - BOM
        - "stores issues"
        - returns
        - "incorporated mass"
        - "waste mass"
        - "inventory change"
      output: "reconciled atomic material input and mass-balance difference"
      source_ids:
        - eu-pef-method-2021
    - id: calc_fossil_co2
      applies_to: "carbon_dioxide_fossil_to_air"
      rule: "Use the documented site-specific carbon-balance or compliant measurement method; if calculated, emitted fossil CO2 = attributable fuel quantity × measured carbon-content basis × oxidation fraction × molecular-mass conversion, with all units and reference conditions explicit"
      inputs:
        - "attributable fossil-fuel quantity"
        - "carbon content"
        - "oxidation fraction"
        - "density or volume conversion where needed"
      output: "kg fossil carbon dioxide per 1,000 kg net equipment"
      source_ids:
        - eu-pef-method-2021
    - id: calc_direct_emission_mass
      applies_to: "particulate matter and nitrogen oxides"
      rule: "emitted mass = matched exhaust concentration × dry exhaust-gas volume after control, corrected to the declared reference conditions and reporting convention"
      inputs:
        - concentration
        - "flow rate or total volume"
        - duration
        - "moisture/reference corrections"
        - "control status"
      output: "kg named elementary flow per 1,000 kg net equipment"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "The declared product configuration and CPC 43420 semantic boundary must be supported by drawings, specifications, rated-duty data and the acceptance-test record; separately supplied parts and excluded products must not be merged into the reference output."
      evidence: "approved specification; drawing list; acceptance certificate; product mass record"
    - id: dq_bom_completeness
      applies_to: "material and component inputs"
      requirement: "Use the final product-specific BOM revision and reconcile issued, returned, incorporated and wasted mass; disclose omitted minor items and outsourced assemblies individually."
      evidence: "BOM revision history; stores ledger; reconciliation; supplier documents"
    - id: dq_temporal_scope
      applies_to: "all foreground amounts"
      requirement: "Collect a complete production order or a production-weighted set of orders representative of the reporting year; disclose order count, atypical tests, rework and shutdown periods."
      evidence: "order list; timestamps; production summary; representativeness assessment"
    - id: dq_geography_technology
      applies_to: "upstream links and foreground sites"
      requirement: "Match upstream datasets and foreground records to declared manufacturing geography, alloy/material grade, heating technology, electricity supply and gas reference conditions; disclose every proxy."
      evidence: "dataset metadata; supplier certificate; site and meter metadata; proxy register"
    - id: dq_measurement_quality
      applies_to: "meters, scales and emission measurements"
      requirement: "Instruments must be within their calibration or verification period; estimated or allocated data must identify the method, driver, uncertainty and affected share."
      evidence: "calibration certificates; QA logs; allocation worksheet; uncertainty statement"
    - id: dq_completeness_review
      applies_to: "whole inventory"
      requirement: "Review all known material, energy, water, gas, waste and direct-emission routes; record exclusions and data gaps without replacing atomic flows with umbrella labels."
      evidence: "completeness checklist; process walk-through; material/energy balance; unresolved-flow register"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow"
    rule: "The reference_product output must equal exactly 1,000 kg after normalization, use the confirmed mass property and unit group, exclude transport packaging mass, and carry every required qualifier."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-pef-method-2021
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Every selected flow must be one atomic product, waste or elementary exchange with direction, flow type, property, unit, amount rule, basis, evidence and collection protocol aligned; unresolved UUIDs must remain empty and appear in manifest review metadata."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_bom_balance
    applies_to: "BOM and wastes"
    rule: "For each material family, net issued mass must reconcile to incorporated mass, separately recorded waste/offcuts and documented inventory change within a disclosed tolerance supported by measurement uncertainty."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_conditional_routes
    applies_to: "technology- and design-specific rows"
    rule: "Each conditional row must be supported by the declared equipment design or factory operation; when absent, record it as not applicable with evidence rather than zero without explanation."
    source_ids:
      - us-doe-process-heating-sourcebook-2007
  - rule_id: validate_energy_emission_boundary
    applies_to: "electricity, fuels and direct emissions"
    rule: "Direct-emission rows may contain only releases from foreground combustion or fabrication; emissions already represented in upstream electricity, fuel, material or component datasets must not be duplicated."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "published dataset"
    rule: "Confirm product-specific BOM and manufacturing data, temporal/geographical/technological representativeness, meter and scale calibration, allocation reconciliation, explicit exclusions, data gaps and proxy disclosure before release."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-factory-gate foreground dataset for complete industrial or laboratory process-heating equipment"
  downstream_use: "May be used as a secondary_dataset or background_dataset for equipment production in a downstream process or lifecycle model when the required qualifiers and system boundary match"
  allowed_use: "Product footprinting, capital-equipment inventory, procurement analysis and downstream lifecycle modelling for equipment with equivalent function, heating technology, rated duty, configuration, manufacturing geography and factory-gate state"
  excluded_use: "Unqualified comparison of different furnace/oven functions or technology classes; use-stage energy modelling without a declared duty profile; separately supplied burners or parts; non-electric bakery ovens; domestic heating/cooking equipment; customer-site installation or end-of-life"
  required_metadata: "PCR id and version state; product model and configuration; function and equipment subtype; heating technology and energy source; rated power/thermal input and capacity; maximum temperature; chamber/work-zone dimensions; atmosphere/vacuum/pressure; included auxiliaries; net mass; packaging; acceptance test; sites and geography; reference year; order population; service life and duty profile; allocation; exclusions; proxies and unresolved flows"
  required_quality_disclosure: "BOM reconciliation and completeness; primary-data share; meter/scale/emission-measurement methods and calibration; temporal, geographical and technological representativeness; allocation drivers; upstream dataset choices; direct-emission method; packaging treatment; uncertainty; exclusions and data gaps"
  update_trigger: "Product redesign changing mass, lining, insulation, controls, heating technology or auxiliaries; supplier/material-grade change; manufacturing-site or energy-supply change; revised test programme; change in allocation or emission controls; data older than the declared representativeness period; confirmed replacement for any unresolved UUID or range evidence need"
