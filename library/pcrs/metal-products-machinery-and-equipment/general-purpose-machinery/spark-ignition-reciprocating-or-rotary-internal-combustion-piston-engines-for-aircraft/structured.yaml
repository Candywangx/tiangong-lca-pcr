    rule: "First subdivide meters, issue records, test logs, and waste records by model, line, batch, or time so only attributable exchanges remain."
    source_ids:
      - ec-pef-method-2021
  - rule_id: alloc_physical
    applies_to: "inseparable shared exchanges"
    rule: "When subdivision is not feasible, allocate by a documented causal physical driver such as machine hours, test-cell hours, treated area, or net dry mass."
    source_ids:
      - ec-pef-method-2021
  - rule_id: alloc_nonphysical
    applies_to: "residual multifunctionality"
    rule: "Use economic or another nonphysical allocation only after documenting why subdivision and a causal physical relation are infeasible; disclose period, basis, sensitivity, and rows."
    source_ids:
      - ec-pef-method-2021
  - rule_id: alloc_scrap
    applies_to: "aluminium and steel scrap"
    rule: "Report generated scrap as waste at the gate. Do not subtract avoided-primary-material credits; any recycling allocation belongs in a separately declared lifecycle model."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "engine_manufacturing_and_assembly"
      flow_role: "aluminium alloy and alloy-steel inputs"
      record_type: "ERP issues/returns, receipts, and bill of materials"
      raw_fields: "UUID; specification; state; supplier; lot; issued and returned mass; model; output mass"
      collection_method: "reconcile net issues to model-specific production orders"
      unit: "kg"
      frequency: "each transaction; monthly aggregation"
      temporal_coverage: "common period, normally at least 12 months"
      site_scope: "every included site"
      aggregation_rule: "sum net issues by atomic material and divide by conforming output mass"
      quality_evidence: "approved bill; certificates; scale and ERP reconciliation"
    - protocol_id: cp_manufacturing_utilities
      process_id: "engine_manufacturing_and_assembly"
      flow_role: "electricity"
      record_type: "dedicated/shared meters"
      raw_fields: "meter; readings; multiplier; allocation driver; downtime; output mass"
      collection_method: "dedicated meter or reconciled causal allocation"
      unit: "kWh and MJ"
      frequency: "continuous/shift; monthly"
      temporal_coverage: "full reporting period"
      site_scope: "included operations"
      aggregation_rule: "subtract nonproduction loads, allocate, convert, normalize"
      quality_evidence: "calibration; invoices; allocation and hours"
    - protocol_id: cp_manufacturing_consumables
      process_id: "engine_manufacturing_and_assembly"
      flow_role: "cutting fluid and lubricating oil"
      record_type: "purchase, issue, make-up, recovery, and return"
      raw_fields: "UUID; formulation; concentration; issued, returned and recovered mass; destination; model"
      collection_method: "mass balance each named consumable"
      unit: "kg"
      frequency: "each transaction; monthly"
      temporal_coverage: "full reporting period"
      site_scope: "included machining and assembly"
      aggregation_rule: "issue minus return and recovery, normalized"
      quality_evidence: "stock reconciliation; tickets; specifications; scales"
    - protocol_id: cp_manufacturing_wastes
      process_id: "engine_manufacturing_and_assembly"
      flow_role: "aluminium scrap, steel scrap, and waste cutting oil"
      record_type: "transfer notes and container weights"
      raw_fields: "UUID; material; contamination; gross/tare; destination; route; order"
      collection_method: "weigh each segregated transfer and reconcile stocks"
      unit: "kg"
      frequency: "each transfer; monthly"
      temporal_coverage: "full period with opening/closing stock"
      site_scope: "included operations"
      aggregation_rule: "transfers plus closing minus opening stock, normalized"
      quality_evidence: "manifests; scale calibration; inventory; receipt"
    - protocol_id: cp_surface_treatment_records
      process_id: "chemical_surface_treatment"
      flow_role: "utilities, sodium hydroxide, wastewater, and CO2"
      record_type: "meters, bath sheets, issues, wastewater and fuel records"
      raw_fields: "route; readings; concentration; mass; batch; treated basis; wastewater; density; gas conditions; carbon factor"
      collection_method: "collect each atomic exchange and reconcile balances"
      unit: "kg, m3, kWh, and MJ"
      frequency: "batch/continuous; monthly"
      temporal_coverage: "every included campaign"
      site_scope: "each included treatment line"
      aggregation_rule: "causal treated-area, batch-time, or mass allocation, normalized"
      quality_evidence: "calibration; bath logs; analysis; invoices; transfers"
    - protocol_id: cp_engine_test_records
      process_id: "engine_test"
      flow_role: "fuel, electricity, oil, and exhaust"
      record_type: "fuel/oil balances, meters, schedule, exhaust measurements, fuel analysis"
      raw_fields: "serial/model; test; time/load/speed; fuel; mass in/return; electricity; oil; exhaust flow; CO/NOx/CO2; carbon"
      collection_method: "collect every test with calibrated instruments or approved carbon balance"
      unit: "kg, kWh, MJ, m3, concentration"
      frequency: "every test"
      temporal_coverage: "all included tests"
      site_scope: "included test cell and engines"
      aggregation_rule: "sum by model, subtract returns, normalize"
      quality_evidence: "test report; calibration; fuel certificate; release; workbook"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized exchange = allocated reporting-period exchange / conforming-engine net dry output mass in the same pool"
      inputs:
        - "allocated exchange"
        - "output mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - ec-pef-method-2021
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_net_consumable
      applies_to: "cutting fluid and oil"
      rule: "net consumed = issued − unused return − recovered mass crossing back over the boundary"
      inputs:
        - issue
        - return
        - recovery
      output: "kg consumed"
      source_ids: []
    - id: calc_waste_stock
      applies_to: "wastes"
      rule: "generated = transferred out + closing stored − opening stored; keep identities separate"
      inputs:
        - "transfers and stocks"
      output: "kg waste"
      source_ids: []
    - id: calc_direct_co2
      applies_to: "fossil CO2"
      rule: "use measured mass or consumed fossil carbon balance; document carbon fraction, oxidation, and carbon assigned to CO"
      inputs:
        - "fuel and carbon-bearing emissions"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_exhaust_species
      applies_to: "test CO and NOx"
      rule: "integrate compatible concentration and exhaust flow over each segment; document reference conditions, moisture, molecular conversion, and NOx convention"
      inputs:
        - concentration
        - flow
        - time
        - conditions
      output: "kg species"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve model, architecture, ratings, fuel, oil, cooling, ignition, configuration, accessories, dry-mass convention, release state, site, and period."
      evidence: "model definition; release and mass records; faa-ac-33-2b"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile bill of materials, utilities, consumables, wastes, and direct emissions; add atomic rows for actual exchanges absent here."
      evidence: "signed reconciliation and exclusions"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use one common period, normally at least 12 consecutive months; justify shorter campaigns and align stocks."
      evidence: "dated records and production summary"
    - id: dq_technology
      applies_to: "processes"
      requirement: "Identify onsite/outsourced operations, treatment technology, test-cell configuration, and allocation drivers."
      evidence: "process map; supplier and equipment records"
    - id: dq_geography
      applies_to: "inputs and operations"
      requirement: "State sites and supplier geographies and use upstream datasets matching received state and region."
      evidence: "declarations and dataset metadata"
    - id: dq_measurement
      applies_to: "meters, scales, analyzers"
      requirement: "Retain calibration, conditions, detection limits, gaps, replacements, and precision evidence."
      evidence: "calibration and QA records"
validation_rules:
  - rule_id: vr_identity
    applies_to: "product and reference flow"
    rule: "Fail when the product is not a completed aircraft spark-ignition reciprocating or rotary piston engine or required model, ratings, configuration, release, and net-dry qualifiers are missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - faa-ac-33-2b
  - rule_id: vr_reference_amount
    applies_to: "reference product"
    rule: "Require output to equal exactly 1 kg after normalization and all denominators to use the same conforming net-dry output mass."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_atomic_inventory
    applies_to: "inventory rows"
    rule: "Reject plural collections, combined utilities/fuels, mixed wastes, generic emission groups, or a flow/property/unit mismatch."
    source_ids: []
  - rule_id: vr_conditional_processes
    applies_to: "surface treatment and test"
    rule: "Require applicable/not-applicable evidence. If applicable, require complete atomic chemical, utility, waste, fuel, and direct-emission records; a zero needs records."
    source_ids:
      - ec-jrc-stm-bref-2006
      - faa-ac-33-2b
  - rule_id: vr_uuid_and_localization
    applies_to: "UUID-bearing flows"
    rule: "Require state-100 identity, compatible property/unit, and official TianGong Chinese baseName. Keep test_nitrogen_oxides_air unresolved until an exact read is approved."
    source_ids: []
  - rule_id: vr_mass_and_stock_reconciliation
    applies_to: "materials, product, waste"
    rule: "Require issue/return, product mass, segregated scrap, waste-oil stock changes, and documented residuals."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_allocation
    applies_to: "shared processes"
    rule: "Require subdivision first, then causal physical allocation; flag nonphysical allocation without infeasibility and sensitivity evidence."
    source_ids:
      - ec-pef-method-2021
  - rule_id: vr_external_ranges
    applies_to: "quantitative ranges"
    rule: "Reject an externally inferred range lacking two independent, compatible, original-text-verified sources. This PCR supplies none; foreground records remain mandatory."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after representativeness and completeness review"
  downstream_use: "Factory-gate process data, supplier product footprints, and lifecycle models that separately add installation, use, maintenance, overhaul, and end of life"
  allowed_use: "Matching engine model, route, site/geography, period, net-dry configuration, and allocation context"
  excluded_use: "Aircraft comparisons without downstream stages; use-phase fuel/emissions; maintenance/overhaul; other ignition types or applications; cross-model substitution without review"
  required_metadata: "PCR id; product UUID; manufacturer/model; architecture/configuration; ratings; fuel/oil/cooling/ignition; accessories; net-dry convention; sites; period; routes; upstream datasets; allocation; unresolved UUIDs; cut-offs/deviations"
  required_quality_disclosure: "primary-data share; meter/scale/analyzer coverage; calibration/uncertainty; bill and waste reconciliation; test coverage; temporal/geographic/technological representativeness; gaps/substitutions; review status"
  update_trigger: "model, configuration, material, supplier state, site, route, treatment/test technology, fuel/oil, allocation, period, material-gap correction, or unresolved-UUID confirmation"
