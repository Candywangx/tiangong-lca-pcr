        - eu-environmental-footprint-2021
    - rule_id: boundary_upstream
      applies_to: "Purchased inputs"
      rule: "Represent upstream production outside the foreground as linked datasets; do not replace purchased-input quantities with upstream emissions inside the foreground inventory."
      source_ids:
        - eu-environmental-footprint-2021
    - rule_id: boundary_route_disclosure
      applies_to: "Conditional manufacturing routes"
      rule: "Include casting, forging, polymer moulding, heat treatment, aqueous treatment, coating, and packaging only when performed or purchased for the declared part, and disclose each applicable route."
      source_ids:
        - eu-jrc-sf-bref-2024
        - eu-jrc-stm-bref-2006
    - rule_id: boundary_actual_flows
      applies_to: "Foreground completeness"
