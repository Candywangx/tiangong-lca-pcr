system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "Foreground manufacturing"
      rule: "Include operations from receipt of purchased inputs through release of the conforming part at the manufacturing gate, including on-site utilities, rejects, waste handling before transfer, and packaging physically supplied with the part."
