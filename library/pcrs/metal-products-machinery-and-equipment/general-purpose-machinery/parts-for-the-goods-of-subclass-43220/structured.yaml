allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared manufacturing"
    rule: "First subdivide by separately metered line, machine, batch, operation, or product family so that allocation is avoided where technically possible."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_joint_process
    applies_to: "Residual shared inputs and emissions"
    rule: "When subdivision is not possible, use a documented physical driver that reflects causality, such as machine time, treatment area, furnace charge mass, or test duration; mass allocation is permitted only for materially and technologically comparable parts."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_scrap
    applies_to: "Scrap and recyclable outputs"
    rule: "Record scrap as an output at the foreground gate without an avoided-burden credit inside this dataset; disclose sale, internal recirculation, treatment destination, and any downstream recycling method applied by the study."
    source_ids:
      - eu-environmental-footprint-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "pump_part_manufacturing"
      flow_role: "Purchased materials, components, and boxes"
      record_type: "ERP issue and return records; weigh tickets; supplier declarations"
      raw_fields: "material identity; grade; product form; gross issue; return; internal recirculation; recycled content; supplier; batch"
      collection_method: "Reconcile issued and returned quantities to production orders and verify representative masses by calibrated scale"
      unit: "kg"
      frequency: "Per batch, aggregated monthly"
      temporal_coverage: "At least 12 representative months or the full shorter campaign"
      site_scope: "All lines producing the declared part"
      aggregation_rule: "Sum net consumed mass and divide by conforming output mass; keep materials separate"
      quality_evidence: "Purchase records, batch traceability, scale calibration, reconciliation log"
    - protocol_id: cp_energy_records
      process_id: "pump_part_manufacturing"
      flow_role: "Electricity and natural gas"
      record_type: "Utility meters, submeter logs, and invoices"
      raw_fields: "meter opening and closing; unit; reference conditions; line allocation driver; reporting period"
      collection_method: "Prefer process submeters; otherwise allocate residual shared use with the disclosed causal driver"
      unit: "MJ; m3"
      frequency: "Monthly or finer"
      temporal_coverage: "Same period as production output"
      site_scope: "All included operations and support loads"
      aggregation_rule: "Subtract exports and excluded loads, convert units, allocate, and divide by conforming output mass"
      quality_evidence: "Meter calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_water_chemical_records
      process_id: "pump_part_manufacturing"
      flow_role: "Process water, sodium hydroxide, and cutting fluid"
      record_type: "Meters, tank levels, batch sheets, purchase and inventory records"
      raw_fields: "input mass or volume; concentration; opening stock; purchases; closing stock; returns; internal recirculation"
      collection_method: "Meter water and reconcile chemical make-up by material balance; retain concentration tests"
      unit: "kg"
      frequency: "Per batch or monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "All applicable aqueous and machining operations"
      aggregation_rule: "Calculate net make-up, convert solution to active mass where specified, and divide by conforming output mass"
      quality_evidence: "Meter calibration, inventory reconciliation, concentration test"
    - protocol_id: cp_product_mass
      process_id: "pump_part_manufacturing"
      flow_role: "Conforming reference product"
      record_type: "Production release, inspection, and calibrated weighing records"
      raw_fields: "part number; accepted count; individual or batch net mass; reject count; rework; release date"
      collection_method: "Weigh representative parts or accepted batches and reconcile with final inspection releases"
      unit: "kg"
      frequency: "Per batch"
      temporal_coverage: "Same period as inventory inputs"
      site_scope: "All conforming parts in the declared dataset"
      aggregation_rule: "Sum net accepted mass; exclude packaging, rejects, and work in process"
      quality_evidence: "Scale calibration, inspection release, production reconciliation"
    - protocol_id: cp_waste_mass
      process_id: "pump_part_manufacturing"
      flow_role: "Material scrap, spent machining fluid, and treatment sludge"
      record_type: "Waste containers, weigh tickets, manifests, and internal return logs"
      raw_fields: "waste identity; origin operation; gross and tare mass; moisture or dry matter; internal recovery; destination"
      collection_method: "Weigh each segregated stream at transfer and reconcile internally recirculated material separately"
      unit: "kg"
      frequency: "Per shipment and monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "All included operations"
      aggregation_rule: "Sum net mass leaving the foreground by stream and divide by conforming output mass"
      quality_evidence: "Weigh tickets, manifests, destination records, mass-balance reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "pump_part_manufacturing"
      flow_role: "Aqueous effluent"
      record_type: "Discharge meter, batch dump, and treatment logs"
      raw_fields: "volume or mass; density; treatment state; destination; sampling result; reporting period"
      collection_method: "Meter continuous discharge or calculate documented batch dumps; subtract verified internal reuse"
      unit: "kg"
      frequency: "Per discharge or monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "All included aqueous operations"
      aggregation_rule: "Convert with documented density where required and divide net discharge by conforming output mass"
      quality_evidence: "Meter calibration, batch logs, treatment and discharge records"
    - protocol_id: cp_direct_emissions
      process_id: "pump_part_manufacturing"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Fuel meters, supplier composition, stack monitoring, and site emissions inventory"
      raw_fields: "fuel amount; carbon content or emission factor; oxidation assumption; monitored CO2; allocation driver"
      collection_method: "Prefer calibrated direct monitoring; otherwise calculate from site-specific fuel records and retain the calculation basis"
      unit: "kg"
      frequency: "Monthly or finer"
      temporal_coverage: "Same period as production output"
      site_scope: "On-site combustion and thermal operations only"
      aggregation_rule: "Exclude upstream emissions, allocate direct totals, and divide by conforming output mass"
      quality_evidence: "Meter calibration, supplier certificate, calculation worksheet, monitoring QA"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = reporting-period row amount / reporting-period net conforming product mass"
      inputs:
        - "collected row amount"
        - "net conforming product mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity source records in kWh"
      rule: "electricity MJ = metered kWh × 3.6"
      inputs:
        - "metered electricity in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_active_naoh
      applies_to: "Sodium-hydroxide solution"
      rule: "active NaOH mass = solution mass × measured NaOH mass fraction"
      inputs:
        - "solution mass"
        - "concentration test"
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Each declared material family"
      rule: "opening stock + purchases - closing stock - documented returns = product content + outbound scrap + contained waste + other declared loss"
      inputs:
        - inventory
        - purchase
        - return
        - product
        - scrap
        - sludge
        - "and loss records"
      output: "reconciled material-family balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Retain the part number, function, drawing or specification revision, material grade, route, and acceptance state."
      evidence: "Approved drawing, bill of materials, route card, inspection release"
    - id: dq_temporal
      applies_to: "All foreground rows"
      requirement: "Use the same representative reporting period for inputs, outputs, inventory changes, and allocation drivers."
      evidence: "Dated meter, production, inventory, and waste records"
    - id: dq_completeness
      applies_to: "All included operations"
      requirement: "Reconcile meters, purchases, inventory changes, product, scrap, wastewater, sludge, and direct emissions; document every excluded operation and estimated residual."
      evidence: "Reconciliation and gap log"
    - id: dq_geography_technology
      applies_to: "Linked upstream datasets"
      requirement: "Match supplier geography, material form and grade, electricity mix, gas conditions, water supply, treatment route, and technology as closely as available."
      evidence: "Supplier and dataset metadata comparison"
    - id: dq_measurement
      applies_to: "Measured and calculated values"
      requirement: "Retain calibration status, raw unit, conversion, concentration, density, allocation driver, formula, and responsible reviewer."
      evidence: "Calibration certificates and calculation workbook"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference product"
    rule: "Fail the data package if the output is a complete pump, a non-pump part, a generic commodity without pump-part identity, or lacks the required part and specification qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_mass_balance
    applies_to: "Material-family records"
    rule: "Require a documented material balance for every included material family and investigate unexplained imbalance before release."
    source_ids: []
  - rule_id: validate_route
    applies_to: "Process boundary"
    rule: "Require every applicable forming, moulding, machining, treatment, testing, outsourced, and packaging operation to be included or explicitly disclosed as outside the foreground with a linked dataset."
    source_ids:
      - eu-jrc-sf-bref-2024
      - eu-jrc-stm-bref-2006
      - us-niosh-metal-working-fluids-2008
  - rule_id: validate_uuid
    applies_to: "Flow identities"
    rule: "Reject a UUID-bearing row when the directly read name, flow type, classification, property, or unit group conflicts with the selected exchange; unresolved rows remain explicit review items."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "Dataset release"
    rule: "Require temporal alignment, unit conversions, allocation drivers, upstream representativeness, and completeness reconciliation to be documented."
    source_ids:
      - eu-environmental-footprint-2021
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for a declared separately supplied liquid-pump or liquid-elevator part"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-specific cradle-to-gate or life-cycle models when the part identity, material, route, geography, technology, and time period are compatible"
  excluded_use: "Complete-pump production without additional assembly data; use-phase performance; unrelated machinery parts; comparative claims across unlike functions or specifications without further review"
  required_metadata: "PCR id; part name and function; associated equipment type; drawing or specification; material and grade; net mass; manufacturing and outsourced routes; factory and geography; reporting period; allocation; packaging; unresolved identities"
  required_quality_disclosure: "Foreground coverage; meter and mass-balance reconciliation; temporal coverage; allocation drivers; upstream dataset matches; estimates; exclusions; wastewater and waste destinations; direct-emission method"
  update_trigger: "Change in part design, material or grade, mass by more than the study threshold, forming or machining route, treatment or coating, supplier mix, energy system, site, allocation driver, packaging, or unresolved flow identity"
