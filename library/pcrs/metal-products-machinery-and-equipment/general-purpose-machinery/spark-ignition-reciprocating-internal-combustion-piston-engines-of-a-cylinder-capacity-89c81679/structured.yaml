allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "engine-family foreground operations"
    rule: "Avoid allocation by separately metering or recording engine-family material issues, machine energy, cleaning campaigns, assembly lines, test cells, rejects, and wastes."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "shared utilities and support operations"
    rule: "When subdivision is impracticable, allocate shared burdens using a documented causal physical driver such as machine-hours, metered energy, cleaning-bath throughput, tested-engine hours, or accepted engine mass; economic allocation requires explicit justification."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "scrap and rejected engines"
    rule: "Report scrap and treatment flows at the foreground boundary without an avoided-burden credit; model recycling or recovery consistently in the downstream treatment dataset and disclose any recycled-content convention."
    source_ids: []
