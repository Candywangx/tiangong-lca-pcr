validation_rules:
  - rule_id: validation_rule_1
    applies_to: "product identity"
    rule: "Reject a data package unless the engine is spark-ignition, reciprocating piston, of a kind used for motor vehicles, and its declared total cylinder capacity is not greater than 1000 cm3."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "reference flow"
    rule: "Require the exact reference-flow UUID, Mass property, kg unit, and every required qualifier; verify that net engine mass excludes undeclared transport packaging."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_3
    applies_to: "inventory accounting"
    rule: "Require each exchange to be atomic, tied to a process and direction, normalized to 1 kg accepted engine output, and reconciled against production, stock, return, and waste records."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "production-line test"
    rule: "If testing occurs, require tested-engine input/output identity, tested fraction, fuel and electricity records, and separately reported direct exhaust constituents without double counting aggregate and speciated hydrocarbons."
    source_ids:
      - us-epa-engine-test-cells
      - us-ecfr-40-cfr-1065-15
  - rule_id: validation_rule_5
    applies_to: "upstream representativeness"
    rule: "Require supplier/product state, geography, technology, time, and allocation disclosures for upstream datasets; unresolved UUID or range evidence remains an explicit review finding."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after independent review"
  downstream_use: "Foreground engine-manufacturing inventories and downstream motor-vehicle process or lifecyclemodel projections"
  allowed_use: "Cradle-to-gate comparison of CPC 43121 engines with equivalent reference-flow qualifiers and compatible boundary, geography, technology, and production period"
  excluded_use: "Complete-vehicle, use-phase, remanufacturing, end-of-life, aircraft-engine, rotary-engine, compression-ignition, or >1000 cm3 claims without added models"
  required_metadata: "PCR id/version; engine family/model; displacement; cylinder count; cycle; aspiration; fuel system; emission control; rated power; shipping-fluid state; tested fraction; plant geography; period; upstream dataset identities; allocation; cut-offs; unresolved findings"
  required_quality_disclosure: "primary-data share; meter and BOM coverage; mass-balance closure; temporal representativeness; allocation drivers; test protocol; data gaps; uncertainty; review status"
  update_trigger: "engine-family or BOM redesign; displacement/category change; material plant/process/energy change; test-policy change; new exact UUIDs; new two-source compatible range evidence; or loss of temporal representativeness"
