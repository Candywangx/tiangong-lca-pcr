    rule: "Prefer product-specific metering, batch records, or physical subdivision. Do not allocate a complete factory total when a process- or product-family record is available."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "shared_processes"
    rule: "If subdivision is not feasible, allocate shared electricity, water, consumables, and wastes using the causal driver that best reflects the operation, such as machine time, test time, processed mass, or measured throughput; document the driver and reconcile allocated totals to the site record."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_3
    applies_to: "scrap_and_recovered_material"
    rule: "Report physical scrap and waste outputs without an avoided-production credit inside the foreground manufacturing process. Any recycling substitution or end-of-life credit belongs to a separately declared system model."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "pallet_reuse"
    rule: "Allocate a reusable pallet's measured mass over documented uses and products per use; disclose losses, repair, and return boundary. If evidence is absent, model the pallet as single-use rather than assuming a reuse count."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_procurement
      process_id: "material_component_preparation"
      flow_role: "product-specific BoM inputs"
      record_type: "released BoM, purchase receipt, stock issue"
      raw_fields: "material name; grade; supplier state; gross issue; returned material; incorporated mass; product model; batch output"
      collection_method: "Reconcile released BoM and weighed issues/returns to production batch"
      unit: "kg"
      frequency: "each batch or production order"
      temporal_coverage: "representative production period, normally at least 12 months or all available production for a newer model"
      site_scope: "every manufacturing site in scope"
      aggregation_rule: "sum net incorporated and attributable issue mass, then normalize by net conforming output"
      quality_evidence: "approved BoM revision; scale calibration; purchase and stock reconciliation"
    - protocol_id: cp_machining_cleaning_records
      process_id: "machining_parts_cleaning"
      flow_role: "machining energy, cleaning inputs, and process wastes"
      record_type: "submeter, batch log, chemical issue, water meter, waste transfer record"
      raw_fields: "electricity; water; washing oil; sodium-hydroxide product and concentration; batch id; machine hours; steel scrap; spent oil; wastewater; treatment route"
      collection_method: "Read meters and reconcile consumable issues and waste manifests by batch or causal operating time"
      unit: "kg; MJ"
      frequency: "each batch, shift, or meter interval"
      temporal_coverage: "same period as product output"
      site_scope: "each site performing the operation"
      aggregation_rule: "subtract documented non-production use, allocate by causal machine time or throughput, and normalize by net conforming output"
      quality_evidence: "meter calibration; bath log; waste manifest; mass-balance review"
    - protocol_id: cp_thermal_operations_records
      process_id: "thermal_joining_surface_operations"
      flow_role: "gaseous thermal inputs"
      record_type: "gas meter, cylinder issue, production log"
      raw_fields: "natural-gas volume; oxygen volume; reference conditions; purity; operation hours; batch output"
      collection_method: "Reconcile gas meters or cylinder changes to production orders"
      unit: "m3"
      frequency: "each batch or meter interval"
      temporal_coverage: "same period as product output"
      site_scope: "each site performing the operation"
      aggregation_rule: "convert to one declared volume basis, allocate by causal operation time or throughput, and normalize by net conforming output"
      quality_evidence: "meter certificate; supplier certificate; production log"
    - protocol_id: cp_direct_air_emissions
      process_id: "thermal_joining_surface_operations"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack measurement or site emission record"
      raw_fields: "CO2 mass or concentration and flow; natural-gas volume; fuel composition; operating hours; batch output"
      collection_method: "Use direct measurement where available; otherwise retain the separate source-backed calculation record used by the site"
      unit: "kg"
      frequency: "each monitored period"
      temporal_coverage: "same period as thermal inputs"
      site_scope: "each direct-emission source in scope"
      aggregation_rule: "reconcile to fuel record and normalize by net conforming output"
      quality_evidence: "monitoring report; instrument calibration; fuel certificate; calculation worksheet"
    - protocol_id: cp_assembly_test_energy
      process_id: "assembly_testing_packaging"
      flow_role: "assembly and release-test electricity"
      record_type: "submeter, test stand log, production counter"
      raw_fields: "electricity; product model; test duration; test gas; inlet/discharge/base pressure; rated flow or pumping speed; conforming output"
      collection_method: "Link test-stand and assembly energy to released serial numbers or production batches"
      unit: "MJ"
      frequency: "each batch or test sequence"
      temporal_coverage: "same period as product output"
      site_scope: "every assembly and test site"
      aggregation_rule: "exclude failed-test energy only if failed products and their treatment are separately recorded; normalize by net conforming output"
      quality_evidence: "calibrated meter; test report; serial-number traceability"
    - protocol_id: cp_packaging_records
      process_id: "assembly_testing_packaging"
      flow_role: "installed shipment packaging"
      record_type: "packaging specification, issue record, scale record, pallet ledger"
      raw_fields: "cardboard mass; pallet standard and mass; film polymer and mass; products per pallet; documented pallet uses; losses"
      collection_method: "Weigh the approved package configuration and reconcile packaging issues to shipped units"
      unit: "kg"
      frequency: "each package design and when changed"
      temporal_coverage: "current packaging configuration during study period"
      site_scope: "every dispatch configuration in scope"
      aggregation_rule: "allocate shared and reusable packaging using recorded products and uses, then normalize by net product mass"
      quality_evidence: "approved packaging specification; scale calibration; pallet tracking record"
    - protocol_id: cp_finished_output
      process_id: "assembly_testing_packaging"
      flow_role: "quality-released product output"
      record_type: "calibrated scale and release record"
      raw_fields: "product model; serial or batch; net dry mass; installed fluid mass; accessories; packaging mass; pass/fail result; test method"
      collection_method: "Weigh quality-released product net of transport packaging and link to factory test result"
      unit: "kg"
      frequency: "each unit or statistically controlled batch"
      temporal_coverage: "same period as all foreground inputs"
      site_scope: "every final assembly site"
      aggregation_rule: "sum net conforming output only and preserve rejected-product treatment records"
      quality_evidence: "scale calibration; release certificate; factory test report"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "all inventory rows"
      rule: "attributable row amount ÷ net mass of quality-released output"
      inputs:
        - "row amount"
        - "cp_finished_output net conforming output"
      output: "amount per 1 kg net finished equipment"
      source_ids:
        - eu-pef-method-2021
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids:
        - eu-pef-method-2021
    - id: calc_solution_active_mass
      applies_to: "sodium-hydroxide cleaning agent"
      rule: "as-supplied solution mass × measured or supplier-certified mass fraction"
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg sodium hydroxide equivalent, with solution mass retained in supporting record"
      source_ids:
        - eu-pef-method-2021
    - id: calc_reusable_pallet_share
      applies_to: "EURO wooden pallet"
      rule: "measured pallet mass ÷ documented lifetime uses ÷ documented products per use"
      inputs:
        - "pallet mass"
        - uses
        - "products per use"
      output: "kg pallet attributable to reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_shared_process_allocation
      applies_to: "shared manufacturing records"
      rule: "total measured amount × documented product causal share; sum of product shares shall equal the total"
      inputs:
        - "measured total"
        - "machine/test time or throughput by product"
      output: "product-attributable amount"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve product type, model, operating principle, working gas, lubrication state, rated performance, pressures, power, accessories, test method, and net mass."
      evidence: "released specification; nameplate; BoM; factory test report"
    - id: dq_bom_completeness
      applies_to: "material and packaging inputs"
      requirement: "Reconcile the released product-specific BoM and packaging specification to actual issues and returns; add unlisted materials as atomic rows rather than aggregating them."
      evidence: "BoM reconciliation signed by production or engineering"
    - id: dq_foreground_completeness
      applies_to: "all processes"
      requirement: "Account for all known energy, water, materials, wastes, and direct emissions within the declared site boundary and explain exclusions."
      evidence: "completeness checklist tied to process map and site records"
    - id: dq_temporal_geographic
      applies_to: "all foreground records"
      requirement: "Use one consistent production period and identify every site; explain shutdowns, ramp-up, outsourcing changes, or non-representative campaigns."
      evidence: "production calendar; site list; variance review"
    - id: dq_measurement_traceability
      applies_to: "measured flows"
      requirement: "Retain meter/scale identity, calibration status, reading period, raw unit, conversion, allocation driver, and reconciliation result."
      evidence: "calibration certificates; raw exports; signed calculation workbook"
    - id: dq_waste_and_emissions
      applies_to: "waste and elementary outputs"
      requirement: "Preserve composition, hazardous classification where applicable, treatment destination, and whether direct emissions were measured or calculated."
      evidence: "waste manifest; laboratory result; monitoring report"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "identity_and_reference_flow"
    rule: "Reject a package that omits any required product qualifier, mixes net product and packaging mass, or lacks a traceable factory test compatible with the declared product type."
    source_ids:
      - us-doe-10-cfr-431-app-a-2024
      - din-iso-21360-1-2025
      - us-doe-compressed-air-sourcebook-2003
  - rule_id: validation_rule_2
    applies_to: "inventory_balance"
    rule: "Confirm that product-specific BoM inputs, separately measured packaging, finished output, scrap, wastes, and retained factory-installed fluids are reconcilable on a documented mass basis; investigate rather than force-close unexplained differences."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_3
    applies_to: "conditional_routes"
    rule: "A conditional process marked not applicable shall have evidence that it is outsourced, absent, or embodied in purchased components; otherwise collect its atomic exchanges."
    source_ids:
      - jrc-fabricated-metal-products-2020
  - rule_id: validation_rule_4
    applies_to: "energy_and_gases"
    rule: "Reconcile electricity to meter totals after allocation; preserve kWh before MJ conversion; confirm gas reference conditions and purity before aggregating volumes."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_5
    applies_to: "uuid_and_localization"
    rule: "Confirm every UUID-bearing English and Chinese row has the same UUID and uses the public state-100 English and Chinese base names; keep in_cast_iron and in_polyethylene_film UUID-empty until classification-compatible exact candidates are verified."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "evidence_and_ranges"
    rule: "Do not infer an external empirical range without at least two independent, original-text-verified and boundary-compatible sources. Until then require foreground records and preserve the manifest range-evidence needs."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset when product identity, geography, technology, time, and make-or-buy boundary are compatible"
  allowed_use: "Manufacturing-footprint modelling, supplier comparison within compatible specifications, component or system LCAs, and later life-cycle model projection with separately modelled downstream stages"
  excluded_use: "Direct comparison of unlike pump/compressor technologies or performance duties; representation of compressed-air or vacuum utility service; use-stage energy modelling without a declared duty profile; parts-only products; liquid pumps"
  required_metadata: "PCR id/version; product type/model; working gas; operating principle; lubrication state; rated performance and pressures; test method/conditions; input power; net mass; installed fluids; accessories; BoM revision; packaging; sites; geography; production period; make-or-buy boundary; allocation drivers; upstream dataset choices"
  required_quality_disclosure: "Foreground coverage; meter and scale calibration; BoM reconciliation; shared-process allocation; conditional-process applicability; waste and emission measurement; unresolved UUIDs; absence of external empirical ranges"
  update_trigger: "Product design or BoM revision; supplier/material change; manufacturing-site or make-or-buy change; test method or performance rating change; packaging change; process/energy mix change; new exact Tiangong identity; new independent compatible range evidence; or material data-quality finding"
