system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased materials and components are received at the manufacturing site and ends when the tested, quality-released product and its transport packaging are ready to leave the manufacturer gate. Product-specific bills of material and company-specific manufacturing activity are mandatory. Known product inputs, wastes, and direct elementary outputs shall be represented without replacing measured foreground records with category averages. (eu-pef-method-2021)"
      source_ids: []
    - rule_id: system_boundary_rule_1_2
      applies_to: "foreground_manufacturing"
      rule: "Include product-specific material and component inputs, in-house energy and water, processing aids, factory testing, packaging, wastes, and direct emissions from receipt through manufacturer-gate release."
      source_ids:
        - eu-pef-method-2021
    - rule_id: system_boundary_rule_2
      applies_to: "conditional_processes"
      rule: "Include machining, cleaning, thermal joining, coating, or other surface operations only when performed inside the declared foreground boundary; otherwise represent the purchased component with an upstream dataset and do not duplicate its production."
      source_ids:
        - jrc-fabricated-metal-products-2020
    - rule_id: system_boundary_rule_3
      applies_to: "completeness"
      rule: "Add every additional product-specific BoM material, process chemical, packaging component, waste stream, and direct elementary flow as its own atomic exchange when known; the listed inventory is a minimum category pattern, not permission to aggregate or omit flows."
      source_ids:
        - eu-pef-method-2021
