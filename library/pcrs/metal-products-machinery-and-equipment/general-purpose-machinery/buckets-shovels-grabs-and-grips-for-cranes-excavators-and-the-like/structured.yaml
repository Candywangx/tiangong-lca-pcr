  - rule_id: validate_inventory_coverage
    applies_to: "Process inventory"
    rule: "Confirm that every physically present input, waste and direct elementary release is represented as one atomic exchange and that no umbrella utility, waste or emissions row is used."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: validate_mass_reconciliation
    applies_to: "Material balance"
    rule: "Investigate any unreconciled difference between metal inputs and finished product, returned stock, steel scrap and other declared metal outputs; document scale and measurement effects."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: validate_conditions
    applies_to: "Conditional rows"
    rule: "Require route evidence for cast parts, oxygen, flux-cored wire, carbon dioxide and coating; a non-applicable row must be supported by the bill of materials or process route."
