allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Production records"
    rule: "Prefer production-order metering, weighing and direct assignment. Subdivide operations before applying allocation."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_shared_operations
    applies_to: "Shared electricity and consumables"
    rule: "When separate metering is unavailable, allocate using a documented causal driver such as machine time, weld length, deposited weld mass, coating area or processed mass; do not default to revenue."
    source_ids:
      - eu-commission-pef-method-2021
  - rule_id: allocation_scrap
    applies_to: "Steel scrap"
    rule: "Report the full measured scrap output and destination. Do not subtract an avoided-primary-steel credit inside the foreground inventory; apply any recycling model only in the downstream life-cycle model and disclose it."
    source_ids:
      - eu-commission-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_integrated_manufacturing_records
      process_id: "integrated_attachment_manufacture"
      flow_role: "All listed input and output rows"
      record_type: "Production orders, bills of materials, weigh tickets, stores issues and returns, gas delivery records, electricity meters, coating batch logs, scrap tickets and inspection release records"
      raw_fields: "production_order_id; product_family; finished_mass_kg; plate_grade_mass_kg; cast_part_mass_kg; oxygen_m3; flux_cored_wire_kg; carbon_dioxide_kg_or_m3; coating_kg; electricity_kWh; scrap_kg; operating_hours; site; date"
      collection_method: "Reconcile material and utility records to released production orders and retain conversion factors and route flags"
      unit: "kg; m3; kWh; h"
      frequency: "Per batch or production order, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign when production is shorter"
      site_scope: "All operations under operational control at the declared manufacturing site, including identified subcontracted operations"
      aggregation_rule: "Sum each atomic exchange for conforming released production and normalize by total net conforming mass, with rejected units and stock returns reconciled"
      quality_evidence: "Calibrated meter records; supplier invoices; weigh tickets; signed production order; bill-of-material revision; coating batch sheet; scrap transfer ticket; inspection release"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "All mass rows"
      rule: "normalized amount = included exchange mass / conforming net finished mass × 1,000"
      inputs:
        - "exchange mass"
        - "conforming finished mass"
      output: "kg per 1,000 kg reference product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_electricity
      applies_to: "electricity"
      rule: "electricity_MJ = included electricity_kWh × 3.6; normalized electricity = electricity_MJ / conforming net finished mass × 1,000"
      inputs:
        - "included electricity kWh"
        - "finished mass kg"
      output: "MJ per 1,000 kg reference product"
      source_ids:
        - eu-commission-pef-method-2021
    - id: calc_gas_mass
      applies_to: "industrial_oxygen; carbon_dioxide_shielding_gas"
      rule: "Use supplier mass directly; if only volume is available, convert with documented composition, pressure, temperature and reference-condition factor before normalization"
      inputs:
        - "gas mass or volume"
        - "conversion factor"
        - "finished mass"
      output: "kg or m3 per 1,000 kg reference product as required by the selected flow property"
      source_ids:
        - eu-commission-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Match released production to drawing revision, attachment family, host interface, capacity, mass, material grades and coating state."
      evidence: "Bill of materials, drawing, inspection release and product data sheet"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile plate, purchased parts, welding consumables, gases, coating, electricity, finished product and steel scrap; add any other physically present exchange as an atomic row."
      evidence: "Material balance, utility reconciliation and waste register"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Cover a representative continuous period and disclose shutdowns, rework campaigns, product-mix changes and abnormal batches."
      evidence: "Dated production and meter records"
    - id: dq_technology
      applies_to: "Conditional rows"
      requirement: "Record route flags for purchased cast parts, oxygen-assisted cutting, FCAW, carbon-dioxide shielding and coating; do not report a conditional amount without the corresponding route."
      evidence: "Work instructions, machine logs, welding procedure and coating specification"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Dataset identity"
    rule: "Confirm that the reference output is exactly 1,000 kg net conforming completed attachment and that all required qualifiers are present."
