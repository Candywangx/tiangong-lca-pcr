allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "multi_product_processes"
    rule: "First avoid allocation by submetering, batch tracing, process subdivision, or system expansion where technically justified."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "shared_facility_inputs_and_outputs"
    rule: "When subdivision is not practicable, allocate shared electricity, fuels, water, chemicals, wastes, and direct emissions using a documented causal physical driver such as machine time, bath loading, test-cell time, or measured mass throughput."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_engine_variants
    applies_to: "shared_engine_family_production"
    rule: "Do not allocate solely by unit count when engine variants differ materially in mass or processing. Use engine-specific records or a justified mass-, machine-time-, or test-time-based driver and disclose the sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap
    applies_to: "recyclable_scrap"
    rule: "Record gross material input and segregated scrap mass before applying the study's declared recycling method. Do not subtract scrap from input or claim a recycling credit twice; disclose destination, quality, and allocation convention."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_fabrication"
      flow_role: "material inputs"
      record_type: "ERP receipts and issues; BOM; inventory ledger"
      raw_fields: "material identity; grade; form; supplier; received mass; issued mass; returned mass; opening and closing inventory; batch; engine model"
      collection_method: "reconcile purchasing, stores, and work-order records"
      unit: "kg"
      frequency: "each receipt and issue; monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "all foreground component operations"
      aggregation_rule: "net consumed mass allocated by work order or documented physical driver"
      quality_evidence: "calibrated scales; supplier certificates; inventory reconciliation; exception log"
    - protocol_id: cp_component_utilities
      process_id: "component_fabrication"
      flow_role: "electricity and process gases"
      record_type: "submeter and fuel/gas invoices"
      raw_fields: "meter id; start and end readings; energy or volume; reference conditions; equipment; operating time; batch"
      collection_method: "calibrated submeter preferred; otherwise reconcile facility meter and allocate causally"
      unit: "MJ; m3"
      frequency: "continuous or per batch; monthly reconciliation"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all attributable fabrication and heat-treatment equipment"
      aggregation_rule: "sum corrected readings, subtract non-production use, allocate by measured equipment time or throughput"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_component_wastes
      process_id: "component_fabrication"
      flow_role: "segregated scrap and spent coolant"
      record_type: "scale tickets and waste manifests"
      raw_fields: "waste identity; alloy family; gross and tare mass; water content where relevant; destination; date; batch"
      collection_method: "weigh each shipment or validated container mass"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all foreground component operations"
      aggregation_rule: "sum net mass by waste identity and allocate by traced work order or causal driver"
      quality_evidence: "scale calibration; manifest; recycler or treatment receipt"
    - protocol_id: cp_component_emissions
      process_id: "component_fabrication"
      flow_role: "direct combustion emissions"
      record_type: "stack measurements and fuel records"
      raw_fields: "equipment; fuel amount; fuel carbon; concentration; exhaust flow; operating time; factor source; pollutant basis"
      collection_method: "direct measurement preferred; otherwise calculation from measured activity and documented factor"
      unit: "kg"
      frequency: "each measurement campaign and monthly activity record"
      temporal_coverage: "same reporting period as product output"
      site_scope: "foreground combustion sources only"
      aggregation_rule: "integrate measured mass rate or multiply measured activity by documented factor"
      quality_evidence: "calibration records; laboratory report; calculation workbook"
    - protocol_id: cp_surface_records
      process_id: "surface_treatment"
      flow_role: "water, electricity, chemicals, and wastewater"
      record_type: "bath make-up logs; meters; chemical certificates; wastewater records"
      raw_fields: "bath id; chemical solution mass; concentration; water and energy readings; treated mass; wastewater volume or mass; density; destination"
      collection_method: "reconcile batch logs, meters, purchasing, and discharge records"
      unit: "kg; MJ"
      frequency: "per batch or continuous; monthly reconciliation"
      temporal_coverage: "same reporting period as treated components"
      site_scope: "all foreground surface-treatment lines"
      aggregation_rule: "calculate pure-chemical input; sum utilities and waste; allocate by bath load or treated mass"
      quality_evidence: "meter calibration; concentration assay; discharge record; mass-balance check"
    - protocol_id: cp_assembly_records
      process_id: "final_assembly_testing"
      flow_role: "assembly electricity and process water"
      record_type: "submeter; work order; cleaning and inspection log"
      raw_fields: "engine serial or lot; meter readings; operation; water amount; elapsed time; accepted or rejected status"
      collection_method: "collect by serial/lot and reconcile to facility meters"
      unit: "MJ; kg"
      frequency: "per engine or lot; monthly reconciliation"
      temporal_coverage: "same reporting period as released engines"
      site_scope: "final assembly and inspection area"
      aggregation_rule: "allocate only to accepted and rejected production according to documented causal treatment"
      quality_evidence: "meter calibration; work-order closure; inspection record"
    - protocol_id: cp_test_cell_records
      process_id: "final_assembly_testing"
      flow_role: "test fuel and direct exhaust emissions"
      record_type: "test-cell run file and calibrated instrumentation"
      raw_fields: "engine serial; fuel identity; fuel mass; thrust or shaft-power setting; run time; pollutant concentration; exhaust flow; aborted runs; test purpose"
      collection_method: "integrate calibrated fuel and emissions measurements over attributable production tests"
      unit: "kg"
      frequency: "every test run"
      temporal_coverage: "complete reporting period"
      site_scope: "all production test cells serving declared engines"
      aggregation_rule: "sum production and acceptance runs; allocate lot tests to represented engines; separately disclose development tests"
      quality_evidence: "instrument calibration; signed test report; run-to-engine traceability"
    - protocol_id: cp_finished_engine_mass
      process_id: "final_assembly_testing"
      flow_role: "accepted reference product"
      record_type: "release certificate and controlled weighing record"
      raw_fields: "engine serial; model; configuration; dry/wet state; included accessories and fluids; gross and excluded support mass; acceptance date"
      collection_method: "calibrated final weighing or controlled configuration mass statement"
      unit: "kg"
      frequency: "every released engine"
      temporal_coverage: "complete reporting period"
      site_scope: "all declared production sites"
      aggregation_rule: "sum net accepted engine mass; rejected or reworked units remain separate"
      quality_evidence: "scale calibration; configuration record; release certificate"
  calculation_rules:
    - id: calc_net_material_consumption
      applies_to: "material input rows"
      rule: "Net consumed mass = receipts + opening inventory - closing inventory - documented returns; reconcile unexplained variance before normalization."
      inputs:
        - "receipt mass"
        - "opening inventory"
        - "closing inventory"
        - "return mass"
      output: "net material input by atomic material identity"
      source_ids:
        - us-epa-aerospace-sector-notebook-1998
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Normalized amount = allocated reporting-period exchange divided by total net mass of accepted finished engines for the same period and scope."
      inputs:
        - "allocated exchange"
        - "accepted engine mass"
      output: "exchange per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_solution_active_mass
      applies_to: "sodium hydroxide"
      rule: "Pure sodium-hydroxide mass = solution mass multiplied by measured or certified mass fraction; keep carrier water in the water balance where material."
      inputs:
        - "solution mass"
        - "sodium-hydroxide mass fraction"
      output: "kg sodium hydroxide"
      source_ids:
        - us-epa-aerospace-sector-notebook-1998
    - id: calc_gas_reference_volume
      applies_to: "natural gas and industrial oxygen"
      rule: "Convert measured volume to the declared reference temperature and pressure using the metering standard or recorded compressibility method; do not mix unconverted conditions."
      inputs:
        - "measured volume"
        - temperature
        - pressure
        - "reference conditions"
        - "compressibility basis"
      output: "m3 at declared reference conditions"
      source_ids: []
    - id: calc_measured_emission_mass
      applies_to: "direct exhaust emissions"
      rule: "Integrate pollutant concentration multiplied by corrected exhaust-flow rate over attributable operating time; document dry/wet and reference-oxygen corrections."
      inputs:
        - concentration
        - "exhaust flow"
        - "operating time"
        - "correction basis"
      output: "kg pollutant"
      source_ids:
        - icao-aircraft-engine-emissions-standards
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Trace every released mass record to engine serial or production lot, engine type, model, configuration, output rating, acceptance status, and dry/wet delivery state."
      evidence: "release certificate; configuration record; controlled mass record"
    - id: dq_temporal_alignment
      applies_to: "all foreground exchanges"
      requirement: "Use one common reporting period; document inventory carry-over, work in progress, abnormal shutdowns, and production-volume changes."
      evidence: "reporting-period reconciliation and exception log"
    - id: dq_meter_quality
      applies_to: "measured utilities and emissions"
      requirement: "Retain meter identity, calibration status, reading interval, missing-data treatment, and any conversion to reference conditions."
      evidence: "calibration certificate; raw meter export; calculation record"
    - id: dq_completeness
      applies_to: "BOM and process inventory"
      requirement: "Reconcile material input, accepted product, scrap, waste, and inventory change; explain all material residuals and any omitted flow."
      evidence: "mass-balance worksheet; BOM reconciliation; omission register"
    - id: dq_background_match
      applies_to: "upstream datasets"
      requirement: "Check product state, alloy or chemical grade, geography, technology, time, property, unit, and delivery boundary; disclose every proxy."
      evidence: "dataset-selection log and proxy justification"
    - id: dq_test_traceability
      applies_to: "production testing"
      requirement: "Distinguish production, acceptance, certification, development, aborted, and rework tests and trace included fuel and emissions to engines or represented lots."
      evidence: "test-cell run register and allocation worksheet"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that the reference product is a complete turbo-jet or turbo-propeller engine, not a part, other reaction engine, other gas turbine, aircraft, or overhaul service, and that all required qualifiers are present."
    source_ids:
      - un-cpc-3-0-structure-2025
      - sastind-turbojet-2013
      - sastind-turboprop-2013
  - rule_id: val_reference_mass
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that every inventory amount uses the same net accepted-engine mass denominator and declared dry/wet, accessory, fluid, packaging, and transport-stand boundary."
    source_ids: []
  - rule_id: val_atomic_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that each inventory row is one product, waste, or elementary exchange; add all product-specific BOM materials, chemicals, fuels, wastes, and direct emissions as separate rows and reject umbrella labels."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_uuid_semantics
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm every UUID by public state-100 identity, bilingual name, flow type, classification, property, unit group, product state, geography, technology, and general comment; leave unresolved identities blank."
    source_ids: []
  - rule_id: val_boundary_and_allocation
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that make-or-buy boundaries, excluded development and downstream stages, test attribution, shared-resource allocation, scrap treatment, and proxy datasets are declared and consistently applied."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_mass_and_energy_reconciliation
    applies_to: "foreground_dataset_conformance"
    rule: "Check material and energy reconciliation, meter/invoice totals, accepted and rejected production, work in progress, and unexplained residuals before release."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_direct_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that direct combustion and test-cell emissions include only foreground releases and do not duplicate upstream electricity or fuel-supply emissions."
    source_ids:
      - icao-aircraft-engine-emissions-standards
published_dataset_profile:
  dataset_role: "Cradle-to-gate foreground production dataset for a declared complete turbo-jet or turbo-propeller engine configuration"
  downstream_use: "May be used as a secondary_dataset or background_dataset for aircraft, propulsion-system, capital-goods, and supply-chain life-cycle models when scope and qualifiers match"
  allowed_use: "Product carbon footprinting, life-cycle inventory construction, supplier comparison, design studies, and background modelling with compatible engine type, configuration, technology, geography, time, and factory-gate boundary"
  excluded_use: "Flight-operation or mission fuel-burn modelling; maintenance or overhaul modelling; certification-emissions compliance claims; comparison of unlike thrust or shaft-power classes without functional adjustment; representation of turbo-fans or separately sold parts without reviewed mapping"
  required_metadata: "PCR id and version state; engine type and model; manufacturer; production site and geography; reporting period; rated thrust or shaft power and rating basis; dry/wet mass state; delivered accessories and fluids; make-or-buy boundary; process route; test allocation; background datasets; allocation method"
  required_quality_disclosure: "Primary-data share; meter and scale quality; BOM and mass-balance closure; temporal representativeness; production volume; rejected/reworked units; test coverage; proxy use; unresolved flow identities; missing range evidence; uncertainty and limitations"
  update_trigger: "Material change in engine model or configuration, alloy or supplier route, production technology, site energy system, surface-treatment route, test schedule, allocation method, environmental controls, reporting period, or background-dataset representativeness"
