system_boundary:
  rules:
    - rule_id: sb_factory_gate
      applies_to: "foreground_system_boundary"
      rule: "Include operations controlled by the reporting manufacturer from receipt of materials and components through component fabrication, heat treatment, surface treatment, cleaning, assembly, inspection, routine production testing, preservation, and factory release when those operations occur for the declared product."
      source_ids:
        - us-epa-aerospace-sector-notebook-1998
    - rule_id: sb_upstream_inputs
      applies_to: "product_and_energy_inputs"
      rule: "Link every purchased material, component, chemical, fuel, electricity supply, water supply, and waste-treatment service crossing the foreground boundary to an upstream dataset with compatible product state, geography, technology, and delivery boundary."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_complete_inventory
      applies_to: "foreground_inventory"
      rule: "Retain all environmentally relevant material and energy flows, products, wastes, and direct emissions. Add product-specific BOM and process exchanges beyond the typical cards below as separate atomic rows."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_test_boundary
      applies_to: "production_testing"
      rule: "Include routine production and acceptance tests attributable to released engines. Exclude development, prototype, and type-certification campaigns unless the goal explicitly includes them and their allocation is documented. Record test-cell fuel and measured exhaust exchanges separately."
      source_ids:
        - us-epa-aerospace-sector-notebook-1998
        - icao-aircraft-engine-emissions-standards
    - rule_id: sb_excluded_life_cycle
      applies_to: "downstream_life_cycle"
      rule: "Exclude aircraft integration, distribution beyond the factory gate, flight operation, maintenance, repair, overhaul, and end-of-life from the default boundary."
      source_ids:
        - un-cpc-3-0-structure-2025
