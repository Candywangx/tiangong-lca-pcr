measurement_rules:
  - id: reference_product_mass
    applies_to: "Reference product and all mass-normalized results"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the complete conforming machine in its declared factory-gate state. Exclude external transport packaging only when that exclusion is consistently applied to the product mass and packaging inventory."
  - id: material_mass
    applies_to: "Purchased materials, components, chemicals, refrigerant, packaging, scrap, and wastewater recorded by mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated scales, purchase receipts reconciled to stock change, or engineering BOM masses verified against batch totals; report wet/dry state and concentration where material identity depends on them."
  - id: electricity_energy
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve meter records; convert kWh to MJ by multiplying by 3.6 and disclose voltage level, grid geography, renewable contract treatment, and allocation of shared loads."
  - id: gas_volume
    applies_to: "Industrial oxygen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "State the gas reference temperature and pressure, purity, delivery form, and whether invoice volume or corrected meter volume is used."
  - id: water_mass
    applies_to: "Process water and wastewater"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer direct mass records. If volume is converted to mass, record the measured or supplier-declared density and reference conditions; do not silently assume a density."
