allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Multi-model lines and shared processes"
    rule: "Prefer physical subdivision and process submetering. Assign directly measured material, component, utility, waste, test, and packaging records to the product family that caused them."
    source_ids: []
  - rule_id: allocation_shared_loads
    applies_to: "Unavoidable shared electricity, water, labour-cell equipment, and facility records"
    rule: "Use a documented causal driver such as machine-hours, test-hours, material mass processed, or number of equivalent operations. Product mass or unit count may be used only when shown to represent resource causality; disclose the driver and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Post-industrial steel scrap"
    rule: "Record scrap at the mass crossing the foreground boundary. Do not subtract an avoided-production credit inside this foreground inventory; any recycling allocation or substitution credit belongs to the declared downstream system model and shall be disclosed separately."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Reworked and rejected machines"
    rule: "Attribute rework inputs and unrecovered reject losses to the conforming production batch. Exclude only materials demonstrably returned to the same process without crossing the boundary, while preserving mass balance."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_records
      process_id: "metal_fabrication_surface_cleaning_component_assembly"
      flow_role: "Purchased material, chemical, and component inputs"
      record_type: "BOM, purchase receipt, stock ledger, scale record"
      raw_fields: "item identity; grade or concentration; supplier; delivered mass; opening/closing stock; product-family assignment; scrap or loss"
      collection_method: "Reconcile BOM and purchase/stock records to batch consumption; weigh representative components when supplier mass is absent"
      unit: "kg"
      frequency: "Each batch with monthly reconciliation"
      temporal_coverage: "At least 12 representative months or the full shorter production period"
      site_scope: "Reporting manufacturing site and attributed suppliers"
      aggregation_rule: "Sum attributable consumption and divide by conforming product mass"
      quality_evidence: "Calibrated scale records, supplier certificates, stock reconciliation, signed BOM revision"
    - protocol_id: cp_process_energy_records
      process_id: "all_foreground_processes"
      flow_role: "Purchased electricity"
      record_type: "Submeter, utility meter, equipment log"
      raw_fields: "meter id; opening/closing reading; kWh; process; operating hours; shared-load driver; grid contract"
      collection_method: "Prefer process submetering; otherwise allocate the smallest shared meter with a causal driver"
      unit: "kWh and MJ"
      frequency: "Per batch or shift; monthly reconciliation"
      temporal_coverage: "At least 12 representative months or the full shorter production period"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Convert kWh to MJ, sum attributable energy, and divide by conforming product mass"
      quality_evidence: "Meter calibration, invoices, allocation worksheet, outage/anomaly log"
    - protocol_id: cp_process_gas_records
      process_id: "metal_fabrication"
      flow_role: "Welding and cutting gases"
      record_type: "Corrected meter, cylinder ledger, invoice"
      raw_fields: "gas identity; purity; cylinder mass or corrected volume; opening/closing stock; temperature/pressure basis; process assignment"
      collection_method: "Reconcile cylinder or bulk-gas stock change to attributed fabrication operations"
      unit: "kg or m3"
      frequency: "Each cylinder change or batch"
      temporal_coverage: "Same period as production inventory"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum attributable gas by identity and normalize to conforming product mass"
      quality_evidence: "Invoice, cylinder certificate, scale or corrected-meter record"
    - protocol_id: cp_waste_records
      process_id: "metal_fabrication"
      flow_role: "Post-industrial steel scrap"
      record_type: "Scale ticket and waste transfer record"
      raw_fields: "waste identity; alloy segregation; gross/tare/net mass; date; destination; treatment; internal reuse"
      collection_method: "Weigh each outbound load and subtract only documented internal reuse before boundary crossing"
      unit: "kg"
      frequency: "Each shipment"
      temporal_coverage: "Same period as production inventory"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum net boundary-crossing scrap and normalize to conforming product mass"
      quality_evidence: "Calibrated scale ticket, transfer manifest, recycler receipt"
    - protocol_id: cp_water_wastewater_records
      process_id: "surface_cleaning"
      flow_role: "Process water and cleaning wastewater"
      record_type: "Submeter, tank record, treatment transfer record"
      raw_fields: "source; meter reading; mass or volume; density if converted; discharge route; treatment; composition indicators"
      collection_method: "Meter input and output separately where feasible; reconcile storage change and retained water"
      unit: "kg or m3"
      frequency: "Per batch or daily"
      temporal_coverage: "Same period as surface-cleaning inventory"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Convert with recorded density when needed, sum attributable mass, and normalize"
      quality_evidence: "Meter calibration, laboratory or treatment record, transfer manifest"
    - protocol_id: cp_refrigerant_charge_records
      process_id: "refrigerant_charging"
      flow_role: "R404A factory charge"
      record_type: "Charging-station scale and cylinder ledger"
      raw_fields: "refrigerant identity; cylinder opening/closing mass; charge setpoint; recovered mass; rejects; serial or batch link"
      collection_method: "Weigh cylinder before and after charging and reconcile recovery and rejected units"
      unit: "kg"
      frequency: "Each charge or batch"
      temporal_coverage: "Same period as applicable model production"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Net charged mass in conforming products divided by conforming product mass"
      quality_evidence: "Calibrated charging scale, refrigerant certificate, leak-test and recovery log"
    - protocol_id: cp_factory_test_records
      process_id: "factory_testing"
      flow_role: "Test water, electricity, and discharged wastewater"
      record_type: "Product test log and dedicated meter"
      raw_fields: "serial/batch; test protocol; water input; electricity; wastewater output; repeats; failures; retained water"
      collection_method: "Record each acceptance test and all repeats; include attributable test-equipment energy"
      unit: "kg, kWh, MJ"
      frequency: "Each tested machine"
      temporal_coverage: "Same period as production inventory"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum all tests for conforming batch, including failed/repeated tests, and normalize"
      quality_evidence: "Test-system calibration, signed release record, meter records"
    - protocol_id: cp_packaging_records
      process_id: "final_packaging"
      flow_role: "Corrugated box, PE-LD film, and wooden pallet"
      record_type: "Packaging BOM, scale record, purchase/stock ledger"
      raw_fields: "packaging identity; mass; units used; reuse count; damage loss; product-family assignment"
      collection_method: "Weigh each packaging component or verify supplier unit mass and reconcile stock"
      unit: "kg"
      frequency: "Each packaging configuration with batch reconciliation"
      temporal_coverage: "Same period as shipped production"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum installed packaging mass after declared pallet reuse allocation and normalize"
      quality_evidence: "Scale record, supplier specification, packaging BOM, stock reconciliation"
    - protocol_id: cp_finished_product_records
      process_id: "final_packaging"
      flow_role: "Reference product output"
      record_type: "Calibrated finished-goods scale and release record"
      raw_fields: "model; serial/batch; net machine mass; included accessories; residual test water state; packaging state; conformity status"
      collection_method: "Weigh released conforming machines in the declared reference state"
      unit: "kg"
      frequency: "Each model/batch; representative per-unit weighing only when variability is controlled"
      temporal_coverage: "Same period as all foreground inputs"
      site_scope: "Reporting manufacturing site"
      aggregation_rule: "Sum conforming net machine mass; use as denominator for all normalized exchanges"
      quality_evidence: "Scale calibration, release certificate, variance record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory exchange"
      rule: "normalized amount = attributable exchange quantity / conforming net product mass"
      inputs:
        - "Attributable exchange quantity"
        - "conforming product mass from cp_finished_product_records"
      output: "Exchange per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Electricity rows"
      rule: "electricity_MJ = metered_kWh × 3.6; do not round before batch aggregation"
      inputs:
        - "Metered kWh"
      output: "MJ of purchased electricity"
      source_ids: []
    - id: calc_water_mass
      applies_to: "Water and wastewater records originally measured by volume"
      rule: "mass = measured volume × recorded density at stated reference conditions"
      inputs:
        - Volume
        - density
        - "temperature/pressure where relevant"
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Metal fabrication and assembly"
      rule: "received attributable mass = installed product mass + boundary-crossing scrap + other specifically identified losses ± inventory change, within documented measurement uncertainty"
      inputs:
        - "BOM/stock mass"
        - "finished mass"
        - scrap
        - "identified losses"
        - "stock change"
      output: "Reconciled material consumption"
      source_ids: []
    - id: calc_refrigerant_charge
      applies_to: "R404A charging"
      rule: "net charge = cylinder mass decrease − recovered mass − documented non-product transfers; reconcile to serial/batch charge records"
      inputs:
        - "Cylinder scale"
        - "recovery log"
        - "charge log"
      output: "kg R404A installed in conforming products"
      source_ids: []
    - id: calc_packaging_reuse
      applies_to: "Reusable wooden pallets"
      rule: "attributable pallet mass = pallet mass / verified expected uses; report the reuse assumption and sensitivity, or assign full mass when reuse is unverified"
      inputs:
        - "Pallet mass"
        - "verified reuse count"
      output: "kg attributable wooden pallet"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product family and reference flow"
      requirement: "Preserve CPC 43935 non-household intended-use boundary and declare the exact model/configuration represented."
      evidence: "Declaration of conformity or equivalent intended-use statement, product specification, model list"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Cover at least 95% of measured foreground mass and energy by identified atomic rows; disclose the identity and estimated magnitude of every omitted exchange and do not use an umbrella flow to reach completeness."
      evidence: "Mass/energy reconciliation and data-gap register"
    - id: dq_temporal
      applies_to: "Production records"
      requirement: "Use at least 12 representative months where available; for shorter production periods, cover the full period and explain seasonality, ramp-up, and abnormal operations."
      evidence: "Dated records and representativeness assessment"
    - id: dq_measurement
      applies_to: "Metered and weighed quantities"
      requirement: "Use in-calibration instruments or document correction, uncertainty, and fallback reconciliation."
      evidence: "Calibration certificates, invoices, stock and meter reconciliation"
    - id: dq_supplier_data
      applies_to: "Major materials and components"
      requirement: "Prefer supplier- and geography-specific upstream datasets; document technology and recycled-content assumptions for stainless steel, carbon steel, copper, polypropylene, motors, pumps, and controls."
      evidence: "Supplier declarations, dataset metadata, procurement records"
    - id: dq_conditional_routes
      applies_to: "Surface cleaning and R404A charging"
      requirement: "Demonstrate inclusion with site records or exclusion with product/process configuration evidence; do not report zero solely because a record is missing."
      evidence: "Process map, chemical ledger, refrigerant charge log, supplier documentation"
    - id: dq_use_metadata
      applies_to: "Downstream use-stage readiness"
      requirement: "Report machine type, sanitation method, rated throughput, rack/belt basis, energy and water performance fields, and test-method identity without treating conformance limits as measured manufacturing amounts."
      evidence: "Product specification and applicable performance test report"
validation_rules:
  - rule_id: val_category_identity
    applies_to: "Product identity"
    rule: "Fail if the represented product is household-type, a laboratory or medical-device washer, bottle/container washing machinery, a detergent, or a separately sold part; verify intended non-household use and the complete-machine factory-gate state."
    source_ids:
      - un-cpc-3-0-structure-2025
      - jrc-eu-professional-dishwasher-boundary-2015
  - rule_id: val_reference_mass
    applies_to: "Functional unit and reference flow"
    rule: "Require the exact reference-product UUID, mass property UUID, mass unit-group UUID, kg reference unit, measured conforming product mass, and all required qualifiers."
    source_ids: []
  - rule_id: val_inventory_atomicity
    applies_to: "Process inventory"
    rule: "Fail any selected flow that combines materials, utilities, fuels, packaging, wastes, or emissions; every reported exchange must retain one row id, one direction, and one flow type."
    source_ids: []
  - rule_id: val_material_balance
    applies_to: "Metal fabrication and assembly"
    rule: "Require a documented mass reconciliation for major purchased materials, installed mass, post-industrial steel scrap, other identified losses, and stock change within stated uncertainty."
    source_ids: []
  - rule_id: val_energy_and_water
    applies_to: "Electricity, water, and wastewater"
    rule: "Require meter period, allocation basis, conversion records, and matching production denominator; reject specification limits as substitutes for foreground manufacturing records."
    source_ids:
      - us-epa-energy-star-commercial-dishwashers-v3-2020
  - rule_id: val_conditional_processes
    applies_to: "Surface cleaning and R404A charging"
    rule: "Require site/product evidence for inclusion or exclusion. If included, require all atomic input/output rows and their collection protocols; if a different refrigerant is installed, this R404A row is not applicable and a separately audited refrigerant row is required."
    source_ids:
      - swedish-procurement-professional-dishwashers
  - rule_id: val_upstream_links
    applies_to: "Purchased inputs"
    rule: "Require an upstream dataset or explicit data gap for each purchased material, component, utility, refrigerant, and packaging flow, with geography and technology disclosed."
    source_ids: []
  - rule_id: val_allocation
    applies_to: "Shared processes and recycling"
    rule: "Require causal allocation evidence and a sensitivity check for material shared loads; prohibit hidden avoided-production credit for scrap inside the foreground inventory."
    source_ids: []
  - rule_id: val_bilingual_alignment
    applies_to: "English and Chinese PCR renderings"
    rule: "Require identical ordered process ids, row ids, UUIDs, controlled values, source ids, and system-boundary/allocation/validation rule ids in both renderings."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one declared non-household dishwashing-machine model or homogeneous product family"
  downstream_use: "May be published as a secondary_dataset or background_dataset for machinery supply in product LCAs and lifecycle models when configuration, geography, time, and boundary are representative"
  allowed_use: "Cradle-to-gate machinery production; supplier comparison with matched reference state and allocation; downstream models that add installation, distribution, operation, maintenance, and end-of-life separately"
  excluded_use: "Household dishwasher production; detergent production; direct representation of operation or cleaning service; use of one product-family dataset for materially different machine types without representativeness review"
  required_metadata: "PCR id and version; model/product family; intended use; machine and sanitation type; rated throughput basis; reference-product UUID; mass; site and geography; period; technology; surface-cleaning route; heat-recovery/heat-pump and refrigerant configuration; packaging state; allocation; upstream dataset versions; cut-offs; data gaps"
  required_quality_disclosure: "Foreground coverage; measurement and allocation methods; calibration status; temporal coverage; supplier-data share; mass balance; conditional-route evidence; uncertainty; unresolved carbon-steel flow UUID; missing empirical range evidence"
  update_trigger: "Material change in model BOM, machine type, sanitation or heating technology, refrigerant, manufacturing site, energy supply, surface treatment, test protocol, packaging, allocation, supplier datasets, or a change exceeding the declared uncertainty threshold"
