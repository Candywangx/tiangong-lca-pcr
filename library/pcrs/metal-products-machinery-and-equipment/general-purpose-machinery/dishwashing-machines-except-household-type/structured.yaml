system_boundary:
  rules:
    - rule_id: sb_factory_gate
      applies_to: "Foreground production boundary"
      rule: "Include attributable fabrication, welding, on-site surface cleaning when performed, assembly, factory refrigerant charging when performed, acceptance testing, packaging, generated scrap, cleaning wastewater, and purchased electricity through the packed factory gate."
      source_ids: []
    - rule_id: sb_upstream_inputs
      applies_to: "Purchased materials, components, utilities, and packaging"
      rule: "Link each purchased input to an upstream supply dataset at the delivered manufacturing-site boundary; do not substitute a generic complete-machine dataset for disclosed component inputs."
      source_ids: []
    - rule_id: sb_same_category_recursion
      applies_to: "Purchased complete non-household dishwashing machines"
      rule: "Stop recursive decomposition at the purchased complete-machine boundary and record that machine as a separate same-category technosphere input with its own upstream dataset."
      source_ids: []
    - rule_id: sb_conditional_routes
      applies_to: "Surface cleaning and refrigerant charging"
      rule: "Include each conditional process only when performed by or attributed to the reporting site; otherwise mark its atomic rows not applicable and disclose the supplier or product configuration that makes the route absent."
      source_ids:
        - swedish-procurement-professional-dishwashers
    - rule_id: sb_use_stage
      applies_to: "Operation and downstream lifecycle"
      rule: "Exclude installation, operation, maintenance, distribution beyond the factory gate, and end-of-life from this foreground manufacturing dataset. Report declared water and energy performance fields so a separate use-stage dataset can be constructed without treating specification limits as manufacturing inventory."
      source_ids:
        - us-epa-energy-star-commercial-dishwashers-v3-2020
boundary_abstraction:
  declared_starting_condition: "Purchased materials, discrete components, process chemicals, utilities, refrigerant, and packaging cross the manufacturing-site gate with supplier identity, delivered state, quantity, and upstream dataset reference recorded"
  starting_condition_role: "Cradle-to-gate foreground manufacturing starting condition"
  product_classification_scope: "Complete dishwashing machines intended principally for non-household commercial, industrial, or institutional use"
  recursive_input_rule: "A purchased complete machine in the same product category is recorded as a separate product input with its own upstream dataset and is not decomposed again inside this foreground system"
  upstream_dataset_requirement: "Every purchased input shall reference a geographically and technologically representative upstream dataset or be disclosed as a data gap; supplier-specific data are preferred for major materials and components"
  disclosure: "Declare manufacturing site, production period, product family, machine configuration, allocation basis, cut-off decisions, purchased-versus-made component boundary, surface-treatment route, refrigerant route, test protocol, packaging state, and excluded lifecycle stages"
