allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared lines and utilities"
    rule: "First subdivide by process stage, meter, production order, machine time, or other causal record before applying allocation."
    source_ids: []
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable shared burdens"
    rule: "Allocate by a documented physical relation that reflects burden causality, such as machine time, coated area, treated mass, or accepted mass; economic allocation is allowed only when no defensible physical relation exists and must be disclosed."
    source_ids: []
  - rule_id: allocation_scrap_no_credit
    applies_to: "steel, aluminium, polypropylene, and coating wastes"
    rule: "Report waste mass and destination separately. Do not subtract avoided virgin-material or recycling credits inside the foreground inventory; model them only in a separately declared downstream scenario."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework
    applies_to: "rework and rejects"
    rule: "Attribute rework inputs to accepted output and prevent double counting of material that returns internally; material leaving the system is reported once in the matching atomic waste row."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_inputs
      process_id: "component_fabrication"
      flow_role: "material and cutting-fluid inputs"
      record_type: "purchase, issue, return, stock, and production-order records"
      raw_fields: "material identity; grade; opening stock; receipts; issues; returns; closing stock; order; accepted mass"
      collection_method: "reconcile ERP/material-issue records to stock movement and production orders"
      unit: "kg"
      frequency: "each lot or order; reconcile monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "all in-scope fabrication lines at reporting site"
      aggregation_rule: "net consumption divided by accepted allocated output mass"
      quality_evidence: "supplier certificate; issue/return tickets; stock reconciliation; scale calibration"
    - protocol_id: cp_fabrication_energy_water
      process_id: "component_fabrication"
      flow_role: "electricity, natural gas, and process-water inputs"
      record_type: "meters, submeters, run time, and production records"
      raw_fields: "meter start/end; correction factor; kWh; gas m3; gas conditions; water mass or volume; run time; accepted mass"
      collection_method: "read calibrated meters; allocate only residual shared loads by documented causal driver"
      unit: "kWh, m3, kg"
      frequency: "continuous or each shift; reconcile monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "in-scope fabrication equipment and directly associated utilities"
      aggregation_rule: "corrected quantity divided by accepted allocated output mass; electricity converted to MJ"
      quality_evidence: "meter calibration; bills; submeter map; downtime and allocation log"
    - protocol_id: cp_fabrication_wastes
      process_id: "component_fabrication"
      flow_role: "material-specific wastes"
      record_type: "segregated bin weights, transfer notes, and production records"
      raw_fields: "waste identity; origin; gross/tare/net mass; destination; order; accepted mass"
      collection_method: "weigh each segregated transfer and reconcile to material balance"
      unit: "kg"
      frequency: "each transfer; reconcile monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "in-scope fabrication lines"
      aggregation_rule: "net waste mass divided by accepted allocated output mass"
      quality_evidence: "calibrated scale; waste transfer note; segregation audit"
    - protocol_id: cp_combustion_emissions
      process_id: "component_fabrication"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack measurement or site fuel-carbon calculation records"
      raw_fields: "fuel quantity; composition or carbon content; oxidation basis; measured CO2 where available; operating period; accepted mass"
      collection_method: "use site measurement or documented site calculation; retain factor provenance and do not use electricity emissions here"
      unit: "kg"
      frequency: "each test or reporting period"
      temporal_coverage: "same period as attributed gas use"
      site_scope: "on-site combustion inside foreground boundary"
      aggregation_rule: "direct fossil CO2 divided by accepted allocated output mass"
      quality_evidence: "monitoring report; laboratory result; calculation workbook; permit record"
    - protocol_id: cp_surface_inputs
      process_id: "aqueous_surface_treatment"
      flow_role: "sodium hydroxide, water, and electricity"
      record_type: "bath additions, concentration tests, meters, and treated-production records"
      raw_fields: "chemical concentration; solution mass; NaOH product mass; water; kWh; bath and rinse id; treated accepted mass"
      collection_method: "reconcile chemical issues and bath additions; read meters; convert electricity to MJ"
      unit: "kg, kWh"
      frequency: "each addition and shift; reconcile monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "in-scope aqueous line and associated treatment"
      aggregation_rule: "quantity divided by accepted treated and allocated output mass"
      quality_evidence: "chemical certificate; titration result; meter calibration; bath log"
    - protocol_id: cp_surface_wastewater
      process_id: "aqueous_surface_treatment"
      flow_role: "wastewater output"
      record_type: "effluent meter, tank transfer, sampling, and destination records"
      raw_fields: "flow or mass; density if converted; bath/rinse origin; pH and declared analytes; destination; treated accepted mass"
      collection_method: "measure discharge or transfer and reconcile with bath/rinse water balance"
      unit: "kg"
      frequency: "each discharge or continuous meter; reconcile monthly"
      temporal_coverage: "same period as surface inputs"
      site_scope: "aqueous line and included on-site treatment"
      aggregation_rule: "wastewater mass divided by accepted treated and allocated output mass"
      quality_evidence: "effluent meter calibration; sample chain of custody; transfer note; water balance"
    - protocol_id: cp_coating_inputs
      process_id: "powder_coating"
      flow_role: "powder coating, electricity, and cure gas"
      record_type: "coating issue/return, meters, oven, and production records"
      raw_fields: "coating identity; issued and returned mass; kWh; gas m3 and conditions; cure schedule; accepted coated mass"
      collection_method: "reconcile same-specification reclaim separately; meter line and oven energy"
      unit: "kg, kWh, m3"
      frequency: "each batch or shift; reconcile monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "in-scope coating line and cure oven"
      aggregation_rule: "net coating and energy divided by accepted coated and allocated output mass"
      quality_evidence: "coating certificate; issue/return log; meter calibration; cure record"
    - protocol_id: cp_coating_waste
      process_id: "powder_coating"
      flow_role: "powder-coating waste"
      record_type: "segregated catch, purge, filter, transfer, and production records"
      raw_fields: "waste identity; source; gross/tare/net mass; reclaim status; destination; accepted coated mass"
      collection_method: "weigh material leaving the reclaim loop and reconcile to coating mass balance"
      unit: "kg"
      frequency: "each transfer; reconcile monthly"
      temporal_coverage: "same period as coating inputs"
      site_scope: "in-scope powder-coating line"
      aggregation_rule: "waste mass divided by accepted coated and allocated output mass"
      quality_evidence: "calibrated scale; transfer note; coating mass balance"
    - protocol_id: cp_release_records
      process_id: "final_release"
      flow_role: "packaging, inspection electricity, and accepted product"
      record_type: "packing issue, electricity, inspection, rejection, and shipment records"
      raw_fields: "box identity and mass; kWh; accepted net product mass; rejected mass; drawing/model; shipment state"
      collection_method: "reconcile packing issues and release records; weigh accepted output net of reusable fixtures"
      unit: "kg, kWh"
      frequency: "each order or shipment; reconcile monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "final inspection and packing under site control"
      aggregation_rule: "inputs divided by accepted released mass; reference output set to 1 kg"
      quality_evidence: "release certificate; scale and meter calibration; packing list; rejection log"
  calculation_rules:
    - id: calc_net_consumption
      applies_to: "materials and chemicals"
      rule: "Net consumption = opening stock + receipts - closing stock - documented return to supplier or inventory; internal recirculation is not counted again."
      inputs:
        - stock
        - receipt
        - issue
        - "and return records"
      output: "net input mass"
      source_ids:
        - mass-balance-identity
    - id: calc_reference_normalization
      applies_to: "all non-reference rows"
      rule: "Normalized amount = allocated reporting-period amount / allocated accepted saleable-part mass."
      inputs:
        - "allocated row amount"
        - "accepted output mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "Electricity in MJ = metered electricity in kWh × 3.6."
      inputs:
        - "metered kWh"
      output: "MJ of electricity"
      source_ids:
        - energy-unit-identity
    - id: calc_mass_balance
      applies_to: "each declared material route"
      rule: "Reconcile received net material with accepted product content, internal stock change, documented return, and each material-specific waste; investigate unexplained imbalance."
      inputs:
        - "material input"
        - "stock change"
        - "accepted product composition"
        - returns
        - wastes
      output: "route mass-balance check"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Identify the exact part, drawing/model revision, intended equipment, material/grade, finish, and market state."
      evidence: "release certificate, drawing, bill of materials, product specification"
    - id: dq_route_completeness
      applies_to: "process map"
      requirement: "Declare every actual forming, machining, moulding, joining, heat-treatment, aqueous-treatment, coating, inspection, and packing operation, including outsourced steps."
      evidence: "route sheet, work instructions, supplier processing records"
    - id: dq_mass_completeness
      applies_to: "material and waste rows"
      requirement: "Reconcile at least 95% of input material mass by route; explain the residual and any moisture or stock effect rather than forcing balance."
      evidence: "signed mass-balance workbook and stock reconciliation"
    - id: dq_metering
      applies_to: "electricity, gas, and water"
      requirement: "Use calibrated meters or a documented submeter/allocation hierarchy; report meter coverage and uncertainty or estimation share."
      evidence: "calibration certificates, utility bills, meter map, allocation log"
    - id: dq_temporal_geographic
      applies_to: "all foreground data"
      requirement: "Use one coherent reporting period and disclose site, geography, technology, capacity use, abnormal operations, and any proxy period."
      evidence: "production and environmental reporting records"
    - id: dq_atomic_wastes_emissions
      applies_to: "wastes and elementary emissions"
      requirement: "Report each actual material-specific waste and emitted substance separately; wastewater does not substitute for sludge, spent bath, or an elementary water emission."
      evidence: "waste register, transfer notes, monitoring and sampling records"
