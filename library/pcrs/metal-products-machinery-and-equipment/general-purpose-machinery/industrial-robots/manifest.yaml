      - range_id: electricity_amount
        row_id: electricity
        explanation: "Factory assembly, testing, and packaging configurations differ; no compatible two-source empirical range was verified. Collect submetered or allocation-supported electricity records."
      - range_id: process_water_amount
        row_id: process_water
        explanation: "Water use depends on whether cleaning, machining, or cooling occurs on site; no compatible two-source empirical range was verified. Collect metered records for the declared route."
      - range_id: natural_gas_amount
        row_id: natural_gas
        explanation: "Natural-gas use is conditional on the site's thermal route; no compatible two-source empirical range was verified. Collect supplier-meter records and reference conditions."
      - range_id: diesel_fuel_amount
        row_id: diesel_fuel
        explanation: "Diesel use is conditional on separately attributable on-site equipment; no compatible two-source empirical range was verified. Collect issue or fuel-meter records."
      - range_id: packaging_amounts
        row_id: corrugated_cardboard
        related_row_ids:
          - polyethylene_film
        explanation: "Packaging configurations are product- and route-specific; no compatible two-source empirical range was verified. Collect packaging specifications and weigh one representative complete pack."
      - range_id: scrap_amounts
        row_id: steel_scrap
        related_row_ids:
          - aluminium_scrap
        explanation: "Scrap generation depends on whether metal fabrication occurs on site; no compatible two-source empirical range was verified. Collect segregated scrap weights and reconcile them to material inputs."
      - range_id: industrial_wastewater_amount
        row_id: industrial_wastewater
        explanation: "Wastewater depends on the declared wet processes; no compatible two-source empirical range was verified. Collect discharge or treatment transfer records."
      - range_id: fossil_carbon_dioxide_amount
        row_id: fossil_carbon_dioxide
        explanation: "Direct fossil CO2 depends on site fuel composition and combustion; no compatible two-source empirical range was verified. Calculate it from collected fuel records and a disclosed carbon-balance factor."
