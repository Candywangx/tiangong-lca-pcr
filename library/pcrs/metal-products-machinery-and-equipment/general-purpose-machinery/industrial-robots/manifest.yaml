      - range_id: aluminium_alloy_amount
        row_id: aluminium_alloy
        explanation: "No two independent, factory-gate and product-state-compatible original sources support an empirical aluminium-input range across industrial robot designs; collect the product BOM and purchasing records."
      - range_id: stainless_steel_amount
