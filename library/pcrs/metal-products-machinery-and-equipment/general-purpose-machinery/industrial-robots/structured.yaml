measurement_rules:
  - id: reference_robot_mass
    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or derive from controlled product specifications the net mass of the exact finished sales configuration. Exclude packaging and customer-supplied end-effectors. One functional-unit robot corresponds to this measured kg amount."
  - id: material_mass
    applies_to: "Material, component, packaging, scrap, and wastewater rows measured by mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve measured mass. If item counts are converted to mass, retain item count, measured or supplier mass per item, and calculation. Do not substitute gross shipped mass for net robot mass."
  - id: electrical_energy
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the electricity meter basis and convert kWh to MJ with 1 kWh = 3.6 MJ. Record voltage level, grid geography, losses boundary, and whether shared utilities were allocated."
  - id: gas_volume
    applies_to: "Gaseous natural gas and industrial oxygen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report volume at disclosed reference temperature and pressure. If supplier records use energy or mass, retain the original value and documented conversion, composition, and reference conditions."
  - id: one_robot_consistency
    applies_to: "Functional unit and reference flow"
    required_property_ref:
      name: "Mass and item identity"
      uuid: ""
    required_unit: "one robot and kg"
    rule: "The item count must be exactly one robot and the reference mass must describe the same model, controller scope, accessories, and factory-gate state."
