allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Multi-product robot manufacturing and shared operations"
    rule: "Avoid allocation by subdividing processes, using model-specific BOM and routing records, and separately metering utilities wherever practicable."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: allocation_physical
    applies_to: "Unavoidable shared material, energy, or production-line burdens"
    rule: "Use a documented physical relationship that reflects causation. Product quantity, net product mass, machine time, or measured process time may be used when appropriate; disclose numerator, denominator, and period."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: allocation_common_utilities
    applies_to: "Common utilities without submetering"
    rule: "Allocate only the share serving included robot manufacturing. Prefer measured operating time or equipment demand; if unavailable, use the reporting period's finished-robot output quantity or mass and justify why it represents utility use."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: allocation_waste_treatment
    applies_to: "Shared wastewater and solid-waste treatment"
    rule: "Prefer direct measurement by process or waste stream. If treatment cannot be separated, allocate by the finished-product output of the generating process and disclose the method."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: allocation_economic_fallback
    applies_to: "Cases without a defensible physical relation"
    rule: "Economic allocation is a last resort. Record price basis, currency, reference period, co-products, sensitivity, and reason physical allocation failed. Do not credit recycling or avoided burden inside the factory-gate inventory without an explicit downstream method."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference_product
      process_id: "robot_manufacturing"
      flow_role: "reference product identity and mass"
      record_type: "product specification, final inspection record, calibrated scale record"
      raw_fields: "model; serial or lot; configuration; controller and accessory scope; end-effector scope; axes; payload; reach; accuracy or repeatability; speed; net mass; packaging mass; release count"
      collection_method: "Link released units to controlled specifications and weigh a representative complete sales unit without packaging"
      unit: "robot; kg"
      frequency: "each model or material configuration change, with reporting-period release count"
      temporal_coverage: "Same reporting period as inputs"
      site_scope: "Reporting factory and declared product line"
      aggregation_rule: "Reconcile released unit count and net product mass to production records; normalize inventory to the exact reference robot"
      quality_evidence: "Calibration certificate; approved specification; final inspection and release record"
    - protocol_id: cp_bom_materials_components
      process_id: "robot_manufacturing"
      flow_role: "material and purchased component inputs"
      record_type: "approved BOM, ERP issue and return records, supplier specifications"
      raw_fields: "item id; material or component name; grade or model; procurement state; supplier; quantity; unit; mass per item; stock change; returned quantity; included product models"
      collection_method: "Reconcile approved BOM to actual issue, return, and inventory records; prevent double counting embedded materials and purchased components"
      unit: "kg; item"
      frequency: "batch or monthly, aggregated for the reporting period"
      temporal_coverage: "At least one representative production year when available"
      site_scope: "Reporting factory and included product line"
      aggregation_rule: "Net input = opening stock + receipts - closing stock - documented returns or diversions; allocate shared model inputs under section 7"
      quality_evidence: "BOM revision; ERP extract; supplier mass specification; stock reconciliation"
    - protocol_id: cp_energy_fuels
      process_id: "robot_manufacturing"
      flow_role: "purchased electricity, natural gas, diesel, and direct fuel-combustion CO2"
      record_type: "utility invoice, submeter, fuel issue, tank balance, gas-quality record"
      raw_fields: "meter id; opening and closing reading; purchased quantity; unit; voltage; gas temperature and pressure; fuel composition; equipment; operating time; calibration; allocation driver"
      collection_method: "Prefer dedicated meters; otherwise reconcile invoices and equipment operating records to an explicit allocation"
      unit: "MJ; m3; kg"
      frequency: "continuous or monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "Included factory operations only"
      aggregation_rule: "Sum net consumption, convert units under section 4, allocate shared consumption under section 7, and calculate direct CO2 under calc_fossil_co2"
      quality_evidence: "Invoice; meter calibration; fuel certificate; tank reconciliation; equipment log"
    - protocol_id: cp_water_chemicals
      process_id: "robot_manufacturing"
      flow_role: "process water, sodium hydroxide, and industrial oxygen"
      record_type: "water meter, tank or cylinder balance, purchasing and bath records"
      raw_fields: "material identity; concentration or purity; quantity; unit; opening and closing stock; make-up; discarded bath; temperature and pressure for gases; process served"
      collection_method: "Meter or reconcile stock and purchase records for each concrete material"
      unit: "kg; m3"
      frequency: "batch or monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "Included wet, thermal, cutting, or welding operations"
      aggregation_rule: "Net consumption = receipts + opening stock - closing stock - documented return; report chemical solution and contained substance consistently"
      quality_evidence: "Meter calibration; certificate of analysis; purchase record; bath or cylinder log"
    - protocol_id: cp_packaging
      process_id: "robot_manufacturing"
      flow_role: "corrugated cardboard and polyethylene film"
      record_type: "packaging specification, kitting record, scale record"
      raw_fields: "product model; packaging component; material identity; item count; mass per item; reused fraction; returnable status"
      collection_method: "Weigh each packaging component for the exact sales configuration and reconcile to packaging issue records"
      unit: "kg; item"
      frequency: "each packaging design change, checked during reporting period"
      temporal_coverage: "Current packaging specification and reporting period"
      site_scope: "Packaging applied at the reporting factory"
      aggregation_rule: "Sum each material separately; exclude returnable packaging that does not leave with the product and disclose its handling"
      quality_evidence: "Approved packaging drawing; scale calibration; issue record"
    - protocol_id: cp_waste_outputs
      process_id: "robot_manufacturing"
      flow_role: "steel scrap, aluminium scrap, and industrial wastewater"
      record_type: "scale ticket, container log, discharge meter, treatment manifest"
      raw_fields: "waste identity; generating operation; quantity; unit; storage change; destination; treatment route; transporter; date"
      collection_method: "Weigh or meter each segregated waste stream and reconcile internal accumulation to transfers"
      unit: "kg"
      frequency: "each transfer, aggregated monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "Waste generated by included operations"
      aggregation_rule: "Generation = transferred quantity + closing storage - opening storage; keep materials and treatment routes separate"
      quality_evidence: "Scale or meter calibration; waste manifest; treatment receipt; water balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "Divide the reporting-period exchange by total measured net kg of conforming finished industrial robots; retain the one-robot model-specific mass so a user can reconstruct exchange per robot."
      inputs:
        - "reporting-period exchange"
        - "released robot count by model"
        - "net mass by model"
        - "allocation driver"
      output: "exchange per kg reference flow and exchange per declared robot"
      source_ids:
        - t-cesa-1450-2025-robot-carbon-footprint
    - id: calc_component_mass
      applies_to: "Item-counted components"
      rule: "Component mass = accepted item count × measured or supplier-controlled mass per item; subtract returned or rejected components not incorporated in the reference product and record their destination separately."
      inputs:
        - "item count"
        - "mass per item"
        - "returns and rejects"
      output: "kg component input"
      source_ids:
        - t-cesa-1450-2025-robot-carbon-footprint
    - id: calc_electricity_mj
      applies_to: "Purchased electricity"
      rule: "Electricity in MJ = metered kWh × 3.6. Preserve the original kWh and do not add grid-generation emissions as foreground elementary flows."
      inputs:
        - "metered kWh"
        - "voltage and grid qualifiers"
      output: "MJ purchased electricity"
      source_ids:
        - t-cesa-1450-2025-robot-carbon-footprint
    - id: calc_solution_mass
      applies_to: "Sodium-hydroxide solution"
      rule: "Contained NaOH mass = net solution mass × measured mass fraction. Preserve solution mass, concentration, and contained NaOH mass."
      inputs:
        - "net solution mass"
        - concentration
      output: "kg sodium hydroxide"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "On-site fossil fuel combustion"
      rule: "Calculate fossil CO2 from collected fuel quantity, carbon content or a disclosed fuel-specific factor, oxidation treatment, and unit conversions. Do not calculate upstream fuel or purchased-electricity emissions in this row."
      inputs:
        - "natural-gas or diesel quantity"
        - "composition or factor"
        - "oxidation basis"
      output: "kg direct fossil CO2"
      source_ids:
        - t-cesa-1450-2025-robot-carbon-footprint
    - id: calc_mass_reconciliation
      applies_to: "Product, material, component, packaging, and solid-waste records"
      rule: "Reconcile net mass inputs to product, packaging, stored work in progress, waste, and documented mass-changing operations. Investigate unexplained imbalance rather than forcing it to zero."
      inputs:
        - "input masses"
        - "product mass"
        - "packaging mass"
        - "waste mass"
        - "stock changes"
      output: "disclosed mass-balance check"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Product model, sales configuration, controller and accessory scope, end-effector scope, technical qualifiers, net mass, factory, and reporting period must identify one reproducible robot configuration."
      evidence: "Approved specification, BOM revision, final inspection, calibrated mass record"
    - id: dq_primary_data
      applies_to: "Foreground materials, energy, water, fuels, waste, and direct emissions"
      requirement: "Use site records for included factory operations. Prefer at least one recent representative production year; shorter campaigns must disclose coverage and seasonality or ramp-up limitations."
      evidence: "ERP extract, invoices, meters, issue logs, manifests, production records"
    - id: dq_completeness
      applies_to: "All included operations"
      requirement: "Check for missing assembly, testing, packaging, in-house fabrication, finishing, internal handling, energy, direct emissions, wastewater, and solid-waste exchanges. Disclose every exclusion and evaluate its significance."
      evidence: "Process walk-through, flow diagram, purchase ledger reconciliation, mass and energy checks"
    - id: dq_upstream_match
      applies_to: "Linked background datasets"
      requirement: "Match geography, technology, material grade or component state, electricity voltage and grid, fuel specification, water supply, and waste treatment. Disclose proxies and substituted geographies."
      evidence: "Dataset metadata and documented mapping table"
    - id: dq_consistency
      applies_to: "Bilingual and machine projections"
      requirement: "Use the same row ids, process ids, UUIDs, controlled values, and rule ids in both languages; regenerate the structured projection from canonical English."
      evidence: "Bilingual review and deterministic structured sync"
    - id: dq_uncertainty
      applies_to: "Missing ranges and allocated data"
      requirement: "Do not invent external ranges. Flag missing range evidence, quantify allocation sensitivity when material, and replace unresolved UUIDs or ranges before publication review when evidence becomes available."
      evidence: "Review metadata, sensitivity record, source review"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Dataset identity"
    rule: "Fail the dataset if it does not describe an automatically controlled, reprogrammable multipurpose manipulator with at least three programmable axes for industrial automation, or if the canonical PCR id and product-flow identity disagree."
    source_ids:
      - ifr-world-robotics-2025-sources-methods
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: validation_reference_flow
    applies_to: "Functional unit and reference flow"
    rule: "Require exactly one robot and its measured net mass in kg for the same configuration. Packaging must be separate; controller, teach device, accessories, end-effector, and mobile-platform scope must be explicit."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: validation_boundary
    applies_to: "Factory-gate scope"
    rule: "Require the declared starting condition, included factory operations, upstream dataset links, downstream exclusions, factory geography, reporting period, and cut-offs. Reject double counting of upstream electricity or fuel emissions as direct foreground emissions."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: validation_inventory_atomicity
    applies_to: "Inventory exchanges"
    rule: "Each row must describe one concrete material, component, energy, fuel, chemical, waste, or elementary emission. Conditional rows must state applicability; absent exchanges use not_applicable only with route evidence."
    source_ids: []
  - rule_id: validation_mass_energy
    applies_to: "Quantitative inventory"
    rule: "Reconcile product count and mass to production records, purchased electricity to meter or invoice totals, fuels to stock or meter records, and material inputs to product, packaging, stock change, and segregated waste. Investigate unexplained differences."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: validation_allocation
    applies_to: "Shared operations"
    rule: "Require subdivision or submetering where feasible. Every remaining allocation must disclose driver, numerator, denominator, period, co-products, and physical or economic rationale."
    source_ids:
      - t-cesa-1450-2025-robot-carbon-footprint
  - rule_id: validation_evidence
    applies_to: "UUIDs, sources, and ranges"
    rule: "UUID-bearing flows must retain verified identity, property, and unit support. UUID-empty rows remain unresolved. External empirical ranges require at least two independent, original-text-verified, boundary-compatible sources; otherwise retain foreground collection and the unresolved range need."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset after independent review of site-specific foreground records; may serve as background_dataset only for users whose robot configuration, geography, technology, and factory-gate boundary are compatible"
  downstream_use: "Link the factory-gate industrial-robot dataset into installation, operation, maintenance, remanufacturing, and end-of-life scenarios or into capital-equipment models"
  allowed_use: "Model-specific factory-gate comparisons and supply-chain inventories when functional qualifiers, reference mass, included controller and accessories, geography, technology, allocation, and data period are compatible"
  excluded_use: "A complete robot-application or automation-cell dataset; a use-phase energy model; a standalone full-life-cycle product carbon footprint; comparison of robots with different payload, reach, accuracy, speed, service life, or included equipment without functional adjustment"
  required_metadata: "Canonical PCR id; product-flow UUID; model and sales configuration; technical qualifiers; net robot mass; packaging mass; included and excluded equipment; factory geography; technology; reporting period; process coverage; allocation; source and background-dataset mapping; unresolved items"
  required_quality_disclosure: "Primary-data share and period; meter and scale quality; BOM version; product mix; allocation shares; cut-offs; data gaps; proxy datasets; mass and energy reconciliation; uncertainty and sensitivity; independent review status"
  update_trigger: "Product or controller redesign; material or packaging change; factory or supplier-route change; major process or grid change; new allocation basis; reporting data older than the program's representativeness threshold; resolution of a material UUID or range evidence need"
