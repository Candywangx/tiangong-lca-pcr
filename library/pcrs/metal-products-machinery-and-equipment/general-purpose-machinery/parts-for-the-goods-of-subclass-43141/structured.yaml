  - rule_id: validate_mass_balance
    applies_to: "materials"
    rule: "Investigate and disclose residuals; do not hide scale, swarf, rejects, or returns in the reference product."
    source_ids: []
  - rule_id: validate_conditional_rows
    applies_to: "conditional exchanges"
    rule: "Require a documented not-applicable statement when a conditional atomic exchange is absent."
    source_ids:
