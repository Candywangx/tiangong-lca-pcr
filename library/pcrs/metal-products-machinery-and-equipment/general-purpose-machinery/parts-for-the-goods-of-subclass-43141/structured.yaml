dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "integrated_part_manufacture"
      flow_role: "blank, product, chips"
      record_type: "scale, issue, production, and transfer records"
      raw_fields: "lot; part; input; return; conforming output; chip mass"
      collection_method: "calibrated scales reconciled to records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full period"
      site_scope: "included operations"
      aggregation_rule: "sum by lot, subtract returns, divide by conforming output"
      quality_evidence: "calibration; reconciliation; transfer ticket"
    - protocol_id: cp_electricity_records
      process_id: "integrated_part_manufacture"
      flow_role: "electricity"
      record_type: "meter and allocation records"
      raw_fields: "meter; opening/closing kWh; machine hours; driver"
      collection_method: "submeter or documented causal allocation"
      unit: "kWh"
      frequency: "shift or billing interval"
      temporal_coverage: "full period"
      site_scope: "included equipment"
      aggregation_rule: "allocate, convert with calc_electricity_mj, normalize"
      quality_evidence: "calibration; invoice; allocation worksheet"
    - protocol_id: cp_gas_records
      process_id: "integrated_part_manufacture"
      flow_role: "natural gas and oxygen"
      record_type: "meter, cylinder, supplier records"
      raw_fields: "identity; volume; temperature; pressure; dry/wet basis; allocation"
      collection_method: "meter, cylinder balance, or invoice"
      unit: "m3"
      frequency: "lot or delivery interval"
      temporal_coverage: "full period"
      site_scope: "included gas equipment"
      aggregation_rule: "reference-condition conversion and lot allocation"
      quality_evidence: "certificate; invoice; conversion record"
    - protocol_id: cp_liquid_input_records
      process_id: "integrated_part_manufacture"
      flow_role: "water, NaOH, cutting fluid"
      record_type: "meter, batch, purchase, make-up records"
      raw_fields: "identity; mass; concentration; dilution; recovery; lot"
      collection_method: "calibrated meter or scale"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "full period"
      site_scope: "included systems"
      aggregation_rule: "sum net fresh input; calculate active NaOH; normalize"
      quality_evidence: "calibration; batch sheet; supplier specification"
    - protocol_id: cp_waste_liquid_records
      process_id: "integrated_part_manufacture"
      flow_role: "spent fluid and alkaline liquor"
      record_type: "tank, drum, manifest records"
      raw_fields: "identity; mass; water; chemistry; contaminants; destination"
      collection_method: "calibrated tank or scale"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "full period"
      site_scope: "collection points"
      aggregation_rule: "sum by identity and lot allocation; normalize"
      quality_evidence: "calibration; manifest; treatment receipt"
    - protocol_id: cp_direct_emission_records
      process_id: "integrated_part_manufacture"
      flow_role: "fossil CO2"
      record_type: "emissions or stack record"
      raw_fields: "source; fossil attribution; CO2; period; driver"
      collection_method: "verified monitoring and allocation"
      unit: "kg"
      frequency: "reporting interval"
      temporal_coverage: "full period"
      site_scope: "included combustion"
      aggregation_rule: "allocate verified CO2 and normalize"
      quality_evidence: "monitoring QA/QC; calibration; reconciliation"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every row"
      rule: "normalized amount = lot exchange / lot net conforming output mass"
      inputs:
        - exchange
        - "conforming output"
      output: "exchange per kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "MJ = kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ delivered electricity"
      source_ids: []
    - id: calc_active_sodium_hydroxide
      applies_to: "sodium hydroxide"
      rule: "active NaOH = solution mass × verified mass fraction"
      inputs:
        - "solution mass"
        - concentration
      output: "kg active NaOH"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "material yield"
      rule: "residual = blank input − returned blank − product − chips − other declared metal outputs"
      inputs:
        - "measured masses"
      output: "residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and material"
      requirement: "Link each lot to drawing, material certificate, route, heat treatment, acceptance release, and CPC 43153 eligibility."
      evidence: "drawing; certificate; traveller; release"
    - id: dq_completeness
      applies_to: "boundary"
      requirement: "Reconcile operations, outsourced work, utilities, material, waste, and direct emissions for the period."
      evidence: "boundary checklist; meter map; ledgers; registers"
    - id: dq_measurement
      applies_to: "exchanges"
      requirement: "Use calibrated instruments or documented invoices; retain conversions, allocation, and uncertainty notes."
      evidence: "calibration; invoice; worksheet; uncertainty statement"
    - id: dq_route_separation
      applies_to: "variants"
      requirement: "Keep different designs, materials, shaping routes, heat treatments, and coatings separate unless homogeneity and weighting are demonstrated."
      evidence: "bills of material; travellers; homogeneity test; weighting record"
validation_rules:
  - rule_id: validate_identity
