          description: "Record the net mass of complete, accepted CPC 43562 machinery released at the factory gate. Packaging mass is excluded from net machine mass and recorded in its own input rows when released with the product."
          amount:
            expression: "Accepted net finished-machine mass used as the normalization denominator"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "exactly 1,000 kg accepted net finished machinery"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_release_records
              source_ids:
                - un-cpc-3-0-structure-2025
                - un-cpc-3-0-explanatory-notes-2025
                - eu-pef-method-2021
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multi-product facilities and shared processes"
    rule: "First avoid allocation by product-specific BOMs, production orders, submetering, separate waste weighing, or subdivision of unit processes."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "shared burdens that cannot be subdivided"
    rule: "Allocate using a documented causal physical driver such as measured machine hours, process time, mass processed or metered energy. Demonstrate why the driver represents the shared input or emission."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relationship
    applies_to: "residual multifunctional burdens"
    rule: "Use another relationship, including economic value, only after documenting why subdivision, system expansion and a relevant physical relationship are not feasible. Record prices, reference period, calculation and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap
    applies_to: "steel scrap and other recoverable outputs"
    rule: "Report the gross waste flow and treatment destination. Do not subtract avoided primary production within the foreground process; any recycling credit or substitution belongs to an explicitly declared downstream modelling convention."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_receipts
      process_id: "material_preparation"
      flow_role: "product-specific material and component inputs"
      record_type: "purchase order, BOM, receipt and inventory record"
      raw_fields: "item_id; material_or_component_name; grade_or_specification; supplier; delivery_boundary; received_mass_kg; rejected_mass_kg; opening_stock_kg; closing_stock_kg; production_order"
      collection_method: "Reconcile engineering BOM with procurement, receiving and stock records; weigh material where records do not provide verified mass"
      unit: "kg"
      frequency: "each receipt and production order"
      temporal_coverage: "representative continuous 12-month period or complete declared campaign"
      site_scope: "every factory contributing to the declared product"
      aggregation_rule: "Sum accepted attributable input and inventory change by atomic flow; normalize with calc_reference_normalization"
      quality_evidence: "approved BOM revision; supplier document; calibrated scale record; stock reconciliation; exception log"
    - protocol_id: cp_fabrication_records
      process_id: "fabrication"
      flow_role: "fabrication electricity, oxygen, process water and steel scrap"
      record_type: "submeter, cylinder or bulk-gas record, water meter, production order and scrap ticket"
      raw_fields: "order_id; operation; electricity_kWh; oxygen_m3; oxygen_reference_conditions; water_kg_or_m3; water_density; scrap_kg; meter_period; allocation_driver"
      collection_method: "Read submeters where available; otherwise reconcile facility meter and documented physical allocation driver; weigh outgoing steel scrap"
      unit: "MJ; m3; kg"
      frequency: "each production order with at least monthly meter reconciliation"
      temporal_coverage: "same reference period as product output"
      site_scope: "every in-scope fabrication site and outsourced operation whose burden is not in a supplier dataset"
      aggregation_rule: "Attribute by order or approved allocation driver; convert electricity and water under section 4; normalize with calc_reference_normalization"
      quality_evidence: "calibration records; bills; meter logs; scrap weigh tickets; order routing; allocation worksheet"
    - protocol_id: cp_coating_records
      process_id: "surface_finishing"
      flow_role: "coating materials, energy, water, wastewater and direct air emissions"
      record_type: "batch issue, meter, wastewater record and emission monitoring record"
      raw_fields: "order_id; coating_route; wet_coating_kg; powder_coating_kg; returned_material_kg; electricity_kWh; natural_gas_m3; gas_reference_conditions; water_kg_or_m3; wastewater_kg_or_m3; nmvoc_kg; fossil_co2_kg; emission_method; treatment_state"
      collection_method: "Reconcile batch issues and returns; read process meters; measure wastewater; use direct emission monitoring or documented site calculation inputs"
      unit: "kg; MJ; m3"
      frequency: "each coating batch with at least monthly meter and emission reconciliation"
      temporal_coverage: "same reference period as product output and representative of treatment operation"
      site_scope: "every in-scope preparation, coating, curing and pollution-control line"
      aggregation_rule: "Keep wet and powder routes separate; attribute by order, area or documented process driver; normalize with calc_reference_normalization"
      quality_evidence: "batch sheets; safety or formulation record; meter calibration; discharge record; monitoring report; treatment operating log"
    - protocol_id: cp_assembly_test_records
      process_id: "assembly_testing"
      flow_role: "assembly electricity, test diesel and direct fossil CO2"
      record_type: "production order, submeter, fuel issue and test record"
      raw_fields: "order_id; model; accepted_status; electricity_kWh; diesel_kg; diesel_fossil_fraction; test_hours; measured_co2_kg; emission_factor; factor_unit; oxidation_factor"
      collection_method: "Read test-bench and area meters; reconcile fuel issue and return; retain direct monitoring or site-specific factor evidence"
      unit: "kg; MJ"
      frequency: "each assembly and acceptance-test order"
      temporal_coverage: "same reference period as product output"
      site_scope: "every in-scope assembly and test site"
      aggregation_rule: "Include accepted and rejected test activity attributable to released products; normalize with calc_reference_normalization"
      quality_evidence: "accepted test certificate; meter calibration; fuel log; factor source; rejection and rework record"
    - protocol_id: cp_release_records
      process_id: "release_dispatch"
      flow_role: "released packaging and net reference-product output"
      record_type: "packing list, scale record and release record"
      raw_fields: "order_id; product_model; cpc_rationale; accepted_units; net_machine_mass_kg; pallet_type; pallet_mass_kg; pallet_reuse_status; corrugated_cardboard_kg; packaging_status; release_date"
      collection_method: "Weigh or reconcile verified shipping and BOM mass; distinguish net machine mass from packaging and reusable transport fixtures"
      unit: "kg"
      frequency: "each released order"
      temporal_coverage: "same reference period as manufacturing records"
      site_scope: "every dispatch gate in the declared dataset"
      aggregation_rule: "Sum accepted net machine mass and attributable packaging by atomic flow; normalize with calc_reference_normalization"
      quality_evidence: "calibrated scale certificate; packing list; acceptance release; product specification; classification review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every attributable inventory row"
      rule: "normalized amount = attributable amount × 1,000 / accepted net finished-machine mass; use consistent kg mass and the same product population in numerator and denominator"
      inputs:
        - "attributable row amount"
        - "accepted net finished-machine mass in kg"
      output: "row amount per 1,000 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_electricity_conversion
      applies_to: "electricity records in kWh"
      rule: "electricity_MJ = electricity_kWh × 3.6; retain the original meter unit and value"
      inputs:
        - electricity_kWh
      output: "electricity_MJ"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "direct natural-gas or diesel combustion"
      rule: "Use direct measured fossil CO2 where available; otherwise multiply collected fuel quantity by the documented site factor, fossil fraction and oxidation factor with unit-consistent conversions. Do not include upstream fuel-supply emissions in this direct row."
      inputs:
        - "fuel quantity"
        - "reference conditions or density"
        - "emission factor and unit"
        - "fossil fraction"
        - "oxidation factor"
      output: "kg fossil CO2"
      source_ids:
        - eu-pef-method-2021
    - id: calc_mass_reconciliation
      applies_to: "each product population"
      rule: "Reconcile purchased and opening-stock mass against closing stock, accepted product, waste, measured emissions and documented inventory changes. Investigate and disclose unexplained imbalance; do not force balance by assigning it to an umbrella flow."
      inputs:
        - "atomic input masses"
        - "stock changes"
        - "product mass"
        - "atomic waste and emission masses"
      output: "mass-balance check and discrepancy disclosure"
      source_ids:
        - eu-pef-method-2021
    - id: calc_shared_process_allocation
      applies_to: "shared manufacturing records"
      rule: "Apply the ordered allocation rules in section 7 and retain the unallocated total, driver, denominator, allocated result and rationale"
      inputs:
        - "shared total"
        - "product-attributable driver"
        - "total driver"
        - "selected hierarchy step"
      output: "allocated product amount"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and every inventory row"
      requirement: "Confirm product classification, model, state, flow type, property and unit. Expand every product-specific BOM or waste item as one atomic flow and preserve unresolved UUIDs rather than using a proxy."
      evidence: "classification review; approved BOM; UUID direct-read audit; unresolved-flow register"
    - id: dq_technology
      applies_to: "manufacturing routes"
      requirement: "Records shall represent the declared cutting, joining, coating, assembly and test technologies; separate wet and powder coating and other materially different routes."
      evidence: "routing, batch and equipment records; technology coverage statement"
    - id: dq_geography
      applies_to: "sites and supplier links"
      requirement: "Identify every factory and the geography and delivery boundary of material, energy, water and waste-treatment datasets."
      evidence: "site list; supplier dataset metadata; dispatch and waste-transfer records"
    - id: dq_time
      applies_to: "foreground reference period"
      requirement: "Use a continuous representative 12-month period or a complete declared campaign; align numerator and product-output denominator and explain shutdowns, ramp-up, abnormal rework or missing periods."
      evidence: "dated meters, orders, invoices, stock records and coverage calculation"
    - id: dq_precision
      applies_to: "measured and calculated amounts"
      requirement: "Retain calibration, meter resolution, conversion factors, allocation drivers and uncertainty or data-gap notes for significant rows."
      evidence: "calibration certificates; calculation workbook; factor source; uncertainty statement"
    - id: dq_completeness
      applies_to: "process and exchange coverage"
      requirement: "Reconcile BOM, energy, water, waste and direct-emission records. Report coverage and unresolved items; do not use this generic pattern list as permission to omit product-specific exchanges."
      evidence: "completeness matrix; mass and energy reconciliation; exception register"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "reference product"
    rule: "Confirm the product is complete CPC 43562 machinery and not an industrial robot, a product assigned to another specific lifting-equipment subclass, a separately supplied part, or a service."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_reference_qualifiers
    applies_to: "reference flow"
    rule: "Reject a data package that omits model, CPC rationale, net mass, rated function, operating or duty qualifier, drive, principal materials, factory configuration, packaging status, geography, period, boundary or allocation disclosure."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "Confirm accepted net finished-machine mass equals the reference denominator and excludes separately reported packaging; all normalized rows use the same accepted product population."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_atomic_inventory
    applies_to: "all exchanges"
    rule: "Reject plural collections, combined carriers, unexpanded BOM categories, combined waste streams, or one row containing more than one physical, chemical, waste or elementary exchange."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_route_conditions
    applies_to: "conditional processes and rows"
    rule: "Require evidence for every included route and a documented not-applicable determination for omitted fabrication, wet coating, powder coating, natural-gas curing, aqueous preparation, diesel testing and packaging rows."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_combustion_consistency
    applies_to: "on-site fuel use"
    rule: "When natural gas or diesel is combusted in scope, require a corresponding direct fossil-CO2 record or a justified measured-zero result; keep upstream supplier emissions out of the direct row."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_allocation
    applies_to: "shared and multifunctional processes"
    rule: "Confirm the section 7 hierarchy, driver, denominator and sensitivity are documented and that recoverable scrap is reported gross without an undeclared avoided-burden credit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "dataset readiness"
    rule: "Confirm technological, geographical and time representativeness, precision, completeness, source metadata, calibration evidence, data gaps and proxies are disclosed."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing data package for complete CPC 43562 machinery at the factory gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Link as the manufacturing-stage dataset in a documented lifecycle model whose product identity, reference mass, geography, technology, period and boundary match the qualifiers"
  excluded_use: "Unqualified comparison between different machinery functions or duty classes; product-safety or conformity claim; use-stage performance claim; installation, maintenance or end-of-life result without separate scenarios"
  required_metadata: "canonical PCR id; product model; CPC and HS classification rationale; reference mass; rated load or throughput; lift, travel or handling envelope; duty class or cycle; drive and controls; principal material grades; included accessories; packaging status; factory sites; reference period; supplier boundaries; allocation; route inclusion; data gaps and proxies"
  required_quality_disclosure: "BOM and process coverage; accepted and rejected production population; meter and calibration coverage; technological, geographical and temporal representativeness; precision; mass reconciliation; allocation sensitivity; unresolved UUIDs and range evidence needs"
  update_trigger: "Material change to product design, BOM, supplier delivery boundary, factory or route, coating system, energy mix, fuel, test procedure, packaging, allocation method, reference period, classification scope or newly confirmed Tiangong UUID"
