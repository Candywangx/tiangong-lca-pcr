allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared operations"
    rule: "Avoid allocation by sub-metering, batch tracing, machine-time records, material issues, and separate waste weighing."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: allocation_physical
    applies_to: "unavoidable shared operations"
    rule: "Allocate by the physical driver: processed mass for material loss and bulk treatment, machine or furnace time for energy, bath loading for shared fluids, and item count only for demonstrably equivalent parts."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: allocation_economic_fallback
    applies_to: "co-products without a physical relationship"
    rule: "Use economic allocation only when no physical relationship can be established; disclose price basis and period and perform sensitivity analysis."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: allocation_waste_boundary
    applies_to: "waste and recovered material"
    rule: "Assign collection, conditioning, and treatment burdens to the generator until documented end-of-waste; benefits after that point remain outside unless separately reported."
    source_ids:
      - international-epd-pcr-2023-03-v1
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_records
      process_id: "primary_forming_and_machining"
      flow_role: "materials, electricity, water, scrap, spent fluid"
      record_type: "issues, meters, weigh tickets, batch traveller"
      raw_fields: "stock identity and grade; issued and returned mass; electricity; water; accepted count; scrap; spent fluid"
      collection_method: "reconcile stores, meters, batch and waste records to one batch"
      unit: "kg; MJ; Item(s)"
      frequency: "each batch, monthly aggregation"
      temporal_coverage: "representative year or declared campaign"
      site_scope: "all controlled forming lines"
      aggregation_rule: "sum allocated exchanges and divide by accepted parts"
      quality_evidence: "calibrated records; certificates; batch traveller; waste record"
    - protocol_id: cp_heat_treatment_records
      process_id: "heat_treatment"
      flow_role: "gas, electricity, oil, waste oil, direct CO2"
      record_type: "meters, furnace log, issues, waste and emissions records"
      raw_fields: "treated count; recipe; gas conditions; electricity; oil; CO2 or factor"
      collection_method: "link furnace loads and meters to batches"
      unit: "m3; MJ; kg; Item(s)"
      frequency: "each load, monthly aggregation"
      temporal_coverage: "representative year or campaign"
      site_scope: "all controlled heat-treatment equipment"
      aggregation_rule: "allocate by treated mass or furnace occupancy and divide by accepted parts"
      quality_evidence: "meters; furnace log; fuel specification; emissions evidence"
    - protocol_id: cp_finishing_records
      process_id: "precision_finishing_and_inspection"
      flow_role: "electricity, water, fluid, sludge, accepted count"
      record_type: "meters, issues, sludge ticket, inspection"
      raw_fields: "line; batch; electricity; water; concentrate; sludge and dry fraction; counts"
      collection_method: "reconcile line records to inspection batch"
      unit: "MJ; kg; Item(s)"
      frequency: "each batch, monthly aggregation"
      temporal_coverage: "representative year or campaign"
      site_scope: "all controlled finishing lines"
      aggregation_rule: "divide allocated exchanges by accepted parts"
      quality_evidence: "meters; issues; sludge analysis; inspection release"
    - protocol_id: cp_surface_records
      process_id: "cleaning_and_surface_protection"
      flow_role: "water, sodium hydroxide, oil, wastewater"
      record_type: "meters, bath log, issues, discharge, traveller"
      raw_fields: "bath; water; solution mass and concentration; oil; wastewater and analysis; count"
      collection_method: "reconcile bath additions and discharge to parts processed"
      unit: "kg; Item(s)"
      frequency: "each addition/discharge, monthly aggregation"
      temporal_coverage: "representative year or campaign"
      site_scope: "all controlled cleaning lines"
      aggregation_rule: "calculate dry chemical, allocate by treated mass or area, divide by accepted parts"
      quality_evidence: "meters; supplier certificate; bath and wastewater analysis"
    - protocol_id: cp_packaging_records
      process_id: "packaging_and_release"
      flow_role: "packaging, electricity, reference product"
      record_type: "bill of materials, meter, release record"
      raw_fields: "packaging identity and mass; recycled content; electricity; packed count; net mass; release"
      collection_method: "link packaging specification and energy to released lot"
      unit: "kg; MJ; Item(s)"
      frequency: "each released lot, monthly aggregation"
      temporal_coverage: "representative year or campaign"
      site_scope: "all controlled packaging operations"
      aggregation_rule: "divide packaging and energy by accepted released parts"
      quality_evidence: "specification; declaration; scale; release record"
  calculation_rules:
    - id: calc_batch_normalization
      applies_to: "all exchanges"
      rule: "normalized exchange = allocated batch exchange / accepted finished-part count; exclude rejects from the denominator and disclose rework"
      inputs:
        - "allocated exchange"
        - "accepted count"
      output: "exchange per Item(s)"
      source_ids:
        - international-epd-pcr-2023-03-v1
    - id: calc_electricity_conversion
      applies_to: "electricity"
      rule: "MJ = metered kWh × 3.6; retain original meter unit and reading"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_solution_dry_mass
      applies_to: "sodium hydroxide and concentrates"
      rule: "dry or concentrate mass = solution mass × declared mass fraction; density is not concentration"
      inputs:
        - "solution mass"
        - "mass fraction"
      output: "kg dry substance"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "heat_fossil_co2"
      rule: "prefer measured stack mass; otherwise multiply corrected gas by documented site fuel carbon factor and oxidation basis, excluding upstream emissions"
      inputs:
        - gas
        - "carbon factor"
        - "oxidation basis"
      output: "kg direct fossil CO2"
      source_ids:
        - international-epd-pcr-2023-03-v1
    - id: calc_wastewater_mass
      applies_to: "surface_industrial_wastewater"
      rule: "wastewater mass = metered volume × measured representative density"
      inputs:
        - volume
        - density
      output: "kg wastewater"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "product and stock"
      requirement: "Retain part specification, material certificate, stock form, net mass, route, heat-treatment state, surface state, and inspection release."
      evidence: "drawing; certificate; traveller; inspection record"
    - id: dq_specific_core_data
      applies_to: "controlled operations"
      requirement: "Use site-specific data for energy, auxiliaries, main-part manufacture, finishing, and manufacturing waste."
      evidence: "meters; purchase, production, and waste records"
    - id: dq_temporal_alignment
      applies_to: "foreground records"
      requirement: "Use one declared representative period, normally a year; identify campaigns, shutdowns, outsourcing, and abnormalities."
      evidence: "period register; production volume; meter coverage"
    - id: dq_meter_and_mass_balance
      applies_to: "material, water, energy, product, waste"
      requirement: "Document calibration, missing-data treatment, and reconciliation; investigate imbalance before publication."
      evidence: "calibration; reconciliation; corrective action"
    - id: dq_electricity_disclosure
      applies_to: "electricity"
      requirement: "Declare grid, voltage, supplier or residual/consumption mix, contractual instruments, and losses; prevent renewable-attribute double counting."
      evidence: "invoice; supplier declaration; dataset metadata"
    - id: dq_generic_data
      applies_to: "upstream datasets"
      requirement: "Use current attributional data representative of technology, geography, and time; disclose proxies and test completeness limits."
      evidence: "dataset metadata; representativeness and proxy assessment"
validation_rules:
  - rule_id: validation_identity
    applies_to: "product identity"
    rule: "Fail if part type, bearing use, material, net mass, dimensions or tolerances, route, market state, site, geography, or period is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - international-epd-pcr-2023-03-v1
  - rule_id: validation_reference_flow
    applies_to: "reference flow"
    rule: "Require exactly one accepted reference_product item and normalize all exchanges to its denominator and packaging boundary."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: validation_route_completeness
    applies_to: "process map"
    rule: "Require an applicability decision for every conditional process and conditional stock, fuel, fluid, chemical, emission, and packaging row; unexplained zero values fail."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: validation_mass_and_waste
    applies_to: "material and waste balance"
    rule: "Reconcile stock, accepted-part mass, scrap, sludge, spent fluids, wastewater, and declared losses for the same batch."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: validation_energy_and_emissions
    applies_to: "energy and emissions"
    rule: "Verify meter coverage, kWh-to-MJ conversion, gas conditions, electricity mix, and separation of direct fossil CO2 from upstream emissions."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: validation_allocation_and_cutoff
    applies_to: "allocation and completeness"
    rule: "Require allocation drivers, economic-allocation sensitivity when used, and evidence for 95% mass, energy, and impact coverage when cut-off is claimed."
    source_ids:
      - international-epd-pcr-2023-03-v1
  - rule_id: validation_source_traceability
    applies_to: "evidence"
    rule: "Require stable sources or retained records for non-default rules, factors, and proxies; UUID identity evidence is not quantity evidence."
    source_ids:
      - international-epd-pcr-2023-03-v1
published_dataset_profile:
  dataset_role: "Product-specific foreground manufacturing dataset for one declared rolling-bearing part"
  downstream_use: "secondary_dataset or background_dataset for matching complete bearings, machinery, maintenance parts, or life-cycle models"
  allowed_use: "Attributional modelling with matching part identity, material, specification, route, geography, technology, period, preservation, and packaging"
  excluded_use: "Generic proxy for complete bearings, housings, gears, or all parts; substitution across materially different parts or grades; unmodelled use-stage friction or service life"
  required_metadata: "PCR id and status; part specification and type; bearing application; material and net mass; dimensions; heat-treatment and surface state; route and outsourcing; site and geography; period; allocation; electricity mix; sources; unresolved UUIDs and range needs"
  required_quality_disclosure: "Primary-data coverage; calibration; balances; accepted/reject/rework counts; proxies; cut-off; allocation; waste treatment and end-of-waste; packaging"
  update_trigger: "Recalculate when drawing, material, route, supplier, site, energy mix, packaging, or allocation changes materially, or any reported impact indicator changes by 10% or more"
