        reason_code: no_exact_candidate
        explanation: "The candidate set distinguished spent coolant, waste cutting oil, generic waste oil, and a combined waste stream; none exactly represents the route-neutral spent metalworking fluid row."
      - row_id: machined_engine_parts_input
        reason_code: internal_intermediate_needs_new_flow
        explanation: "This is the receiving side of the foreground-only machined-parts transfer and needs the same dataset-local internal product flow as its paired output."
      - row_id: untested_engine_output
        reason_code: internal_intermediate_needs_new_flow
        explanation: "This foreground-only transfer represents an assembled but not yet finally inspected or hot-tested engine and needs a dataset-local internal product flow."
      - row_id: untested_engine_input
