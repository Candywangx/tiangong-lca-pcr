        explanation: "This is the receiving side of the foreground-only untested-engine transfer and needs the same dataset-local internal product flow as its paired output."
      - row_id: reference_engine_output
        reason_code: no_exact_candidate
        explanation: "The generic category search returned excluded aircraft products or narrower diesel and small-gasoline variants; no exact category-level product flow was confirmed."
      - row_id: nitrogen_oxides_to_air
        reason_code: no_exact_candidate
        explanation: "The bounded search returned nitrous-oxide flows rather than nitrogen oxides from engine exhaust."
      - row_id: methane_to_air
        reason_code: no_exact_candidate
        explanation: "The bounded search returned substituted methoxy-methane compounds and an unrelated aromatic amine rather than methane emitted to air."
