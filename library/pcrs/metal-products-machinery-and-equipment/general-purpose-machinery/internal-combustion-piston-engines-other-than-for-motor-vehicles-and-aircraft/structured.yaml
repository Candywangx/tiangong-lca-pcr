allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "Prefer subdivision, submetering, engine-family production records, and direct mass tracking so that allocation is avoided."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared machining, assembly, and utilities"
    rule: "If direct measurement is unavailable, allocate shared machine electricity by recorded machine time and rated or metered load, cleaning by bath throughput or treated mass, and assembly utilities by production time; disclose the selected driver and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "metal chips and other wastes"
    rule: "Report waste output at the point it leaves the foreground system. Do not subtract scrap sale revenue or avoided primary-material burdens from the foreground inventory; any recycling credit belongs to a separately declared downstream modelling convention."
    source_ids: []
  - rule_id: allocation_test_power
    applies_to: "dynamometer energy"
    rule: "Keep imported electricity, recovered shaft energy, and exported electricity as separate exchanges. Do not silently net recovered or exported energy against test-cell imports."
    source_ids:
      - us-epa-40-cfr-1065-15
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "component_machining"
      flow_role: "purchased metal inputs"
      record_type: "approved BOM, goods receipts, issue and stock records"
      raw_fields: "engine_model; material_grade; product_form; supplier; received_mass; issued_mass; opening_stock; closing_stock; rejects"
      collection_method: "reconcile purchasing and stores records to the approved engine-family BOM"
      unit: "kg"
      frequency: "each receipt and monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or complete shorter production campaign"
      site_scope: "all supplying stores and machining areas in the declared site"
      aggregation_rule: "sum net issued mass by material identity and divide by accepted reference-product mass"
      quality_evidence: "calibrated scales; supplier certificates; BOM revision; stock reconciliation"
    - protocol_id: cp_machining_consumables
      process_id: "component_machining"
      flow_role: "cutting fluid and process water"
      record_type: "purchase, make-up, recovery, tank-level, and submeter records"
      raw_fields: "fluid_product; concentration; opening_stock; receipts; make_up; recovered_return; closing_stock; water_meter"
      collection_method: "material balance for cutting fluid and direct meter or tank balance for water"
      unit: "kg"
      frequency: "each addition; monthly balance"
      temporal_coverage: "same reference period as production"
      site_scope: "all in-scope machining systems"
      aggregation_rule: "calculate net input, allocate only shared systems with documented machine time or treated mass, and normalize by accepted output"
      quality_evidence: "tank calibration; purchase invoices; meter checks; concentration tests"
    - protocol_id: cp_process_energy
      process_id: "all_processes"
      flow_role: "imported electricity"
      record_type: "revenue meter, process submeter, machine runtime, and production records"
      raw_fields: "meter_start; meter_end; process_id; runtime; rated_or_metered_load; imported_kWh; exported_kWh; accepted_output_mass"
      collection_method: "prefer process submeters; otherwise allocate site electricity using documented runtime and load"
      unit: "kWh and MJ"
      frequency: "continuous or shift; monthly reconciliation"
      temporal_coverage: "same reference period as production"
      site_scope: "all in-scope production and test areas"
      aggregation_rule: "imported kWh × 3.6 MJ/kWh; keep exported or recovered power separate; normalize by accepted output"
      quality_evidence: "meter calibration; interval data; allocation worksheet; grid contract"
    - protocol_id: cp_internal_transfers
      process_id: "component_machining_assembly_finishing_final_inspection_testing"
      flow_role: "internal product transfers"
      record_type: "transfer ticket, production execution record, and calibrated scale"
      raw_fields: "source_process; destination_process; engine_model; quantity; net_mass; timestamp; acceptance_status"
      collection_method: "weigh or derive from unit count and verified model mass at each transfer gate"
      unit: "kg"
      frequency: "each batch or shift"
      temporal_coverage: "complete reference period"
      site_scope: "all in-scope internal transfer points"
      aggregation_rule: "pair each output and input; investigate non-zero transfer imbalance before aggregation"
      quality_evidence: "scale calibration; matched transfer IDs; rejection and rework log"
    - protocol_id: cp_assembly_consumables
      process_id: "assembly_finishing"
      flow_role: "oil, cleaner, and process water"
      record_type: "fill specification, issue record, bath log, concentration test, water meter, and stock record"
      raw_fields: "engine_model; oil_fill_mass; cleaner_product_mass; concentration; bath_make_up; water_input; opening_stock; closing_stock"
      collection_method: "direct fill measurement and product or bath material balances"
      unit: "kg"
      frequency: "each batch or shift; monthly reconciliation"
      temporal_coverage: "same reference period as production"
      site_scope: "all cleaning, filling, and assembly lines in scope"
      aggregation_rule: "sum net consumed product by concrete flow and normalize by accepted output"
      quality_evidence: "calibrated dispensers; concentration tests; meter checks; approved fill specification"
    - protocol_id: cp_waste_outputs
      process_id: "component_machining_assembly_finishing"
      flow_role: "chips, spent fluid, and wastewater"
      record_type: "weighbridge ticket, waste consignment, bin or tank level, discharge meter, and stock record"
      raw_fields: "waste_identity; origin_process; opening_stock; generated_or_shipped_mass; closing_stock; destination; treatment_route"
      collection_method: "segregated calibrated weighing or tank/discharge balance"
      unit: "kg"
      frequency: "each shipment and monthly reconciliation"
      temporal_coverage: "same reference period as production"
      site_scope: "all in-scope waste storage and discharge points"
      aggregation_rule: "outgoing mass plus closing stock less opening stock; avoid double counting entrained fluid and free chips"
      quality_evidence: "scale or meter calibration; consignment note; destination acceptance; stock reconciliation"
    - protocol_id: cp_test_fuels
      process_id: "final_inspection_testing"
      flow_role: "fuelled factory-test inputs"
      record_type: "test-cell fuel meter, batch certificate, stock record, and test log"
      raw_fields: "engine_family; engine_id; fuel_grade; biofraction; density; gas_composition; reference_conditions; opening_stock; receipts; closing_stock; non_test_use; test_cycle"
      collection_method: "direct test-cell metering preferred; otherwise fuel-stock balance reconciled to test logs"
      unit: "kg or m3"
      frequency: "each test; daily or monthly balance"
      temporal_coverage: "complete reference period"
      site_scope: "all in-scope test cells"
      aggregation_rule: "sum each concrete fuel separately, subtract documented non-test use, and normalize by accepted output"
      quality_evidence: "meter calibration; fuel certificate; matched engine and test IDs; stock reconciliation"
    - protocol_id: cp_test_emissions
      process_id: "final_inspection_testing"
      flow_role: "direct exhaust constituents"
      record_type: "analyser, exhaust-flow, filter, fuel-carbon, duty-cycle, and test-acceptance records"
      raw_fields: "engine_id; test_interval; constituent; concentration; exhaust_flow; sample_flow; filter_mass; fuel_carbon; work; result_status"
      collection_method: "apply the declared laboratory or acceptance-test method to each actual test interval"
      unit: "kg"
      frequency: "each fuelled test"
      temporal_coverage: "complete reference period or statistically documented sampling plan"
      site_scope: "all in-scope hot-test cells and represented engine families"
      aggregation_rule: "integrate constituent mass over each interval, sum accepted and failed test burdens assigned to production, and normalize by accepted output"
      quality_evidence: "analyser calibration; zero/span checks; flow calibration; filter handling log; test-method identifier"
    - protocol_id: cp_final_product
      process_id: "final_inspection_testing"
      flow_role: "accepted reference product"
      record_type: "calibrated final mass, serial release, and production records"
      raw_fields: "engine_id; model; net_mass; included_fluids; included_accessories; packaging_mass; release_status; release_date"
      collection_method: "weigh complete product or use verified model-specific mass with periodic scale confirmation"
      unit: "kg"
      frequency: "each unit or homogeneous batch"
      temporal_coverage: "complete reference period"
      site_scope: "all factory-gate releases in scope"
      aggregation_rule: "sum accepted net mass excluding transport packaging and normalize inventory to exactly 1,000 kg"
      quality_evidence: "scale calibration; serial release log; model specification; packaging tare check"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = period exchange amount ÷ accepted net engine mass × 1,000 kg"
      inputs:
        - "concrete exchange amount"
        - "accepted net engine mass"
      output: "exchange per 1,000 kg accepted engine"
      source_ids: []
    - id: calc_material_balance
      applies_to: "materials, fluids, and wastes"
      rule: "net consumed or generated amount = opening stock + receipts or generation − returns − closing stock, with transfers and double-counted entrained material reconciled"
      inputs:
        - stock
        - receipt
        - return
        - transfer
        - "and shipment records"
      output: "net foreground exchange"
      source_ids: []
    - id: calc_electricity
      applies_to: "electricity rows"
      rule: "imported electricity (MJ) = imported meter kWh × 3.6; exported or recovered energy remains a separate output"
      inputs:
        - "imported kWh"
        - "exported kWh"
        - "process allocation driver"
      output: "imported electricity in MJ and separately disclosed export"
      source_ids: []
    - id: calc_test_emission_mass
      applies_to: "direct test emissions"
      rule: "constituent mass = integral of constituent concentration × corresponding raw or dilute exhaust flow over the test interval, with units and dilution corrections required by the declared method"
      inputs:
        - concentration
        - "exhaust flow"
        - "interval duration"
        - "dilution and humidity corrections"
      output: "kg of each constituent per test and per reference flow"
      source_ids:
        - us-epa-40-cfr-1065-15
    - id: calc_fossil_co2_balance
      applies_to: "fossil carbon dioxide when not directly measured"
      rule: "fossil CO2 = oxidized fossil carbon in consumed test fuel × 44/12, after accounting for measured carbon in other exhaust species and retained fuel"
      inputs:
        - "fuel mass or volume"
        - composition
        - "fossil carbon fraction"
        - "measured carbon species"
      output: "kg fossil carbon dioxide"
      source_ids:
        - us-epa-40-cfr-1065-15
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and purchased inputs"
      requirement: "Preserve engine model/family, application, ignition principle, fuel, rated power, displacement, included accessories, material grade, supplier, and product form needed to distinguish the modelled product and inputs."
      evidence: "approved specifications, BOM, supplier certificates, and product release record"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one common reference period, normally at least 12 consecutive representative months; disclose shorter campaigns, shutdowns, abnormal tests, and changes in engine mix."
      evidence: "dated meter, production, purchase, stock, waste, and test records"
    - id: dq_measurement
      applies_to: "mass, energy, volume, and exhaust records"
      requirement: "Use calibrated instruments with units and reference conditions preserved; retain conversion formulas, allocation drivers, and zero/span or meter checks."
      evidence: "calibration certificates, raw files, and calculation workbook"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile BOM inputs, internal transfers, accepted and rejected output, waste, fuels, and test records; explain every missing conditional row and every residual material imbalance."
      evidence: "signed reconciliation and applicability matrix"
    - id: dq_representativeness
      applies_to: "upstream datasets"
      requirement: "Match supplier geography, material route, electricity grid, fuel grade, and technology as closely as available; disclose proxies and their contribution."
      evidence: "supplier declarations, contracts, dataset metadata, and proxy log"
validation_rules:
  - rule_id: validation_product_identity
    applies_to: "reference flow"
    rule: "Fail the data package if the product is a motor-vehicle engine, aircraft engine, gas turbine, complete generating set, or parts-only output, or if required engine qualifiers are absent."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_reference_amount
    applies_to: "reference product"
    rule: "Confirm that accepted complete-engine net mass equals exactly 1,000 kg after normalization and excludes transport packaging."
    source_ids: []
  - rule_id: validation_internal_transfers
    applies_to: "internal intermediates"
    rule: "Require paired internal output and input amounts to agree for each transfer identity after documented rejection, rework, and stock adjustments."
    source_ids: []
  - rule_id: validation_material_reconciliation
    applies_to: "material and waste rows"
    rule: "Reconcile major metal inputs with product, chips, rejected parts, and stock changes; investigate and disclose residual imbalance rather than forcing closure."
    source_ids: []
  - rule_id: validation_test_applicability
    applies_to: "test fuels and emissions"
    rule: "For every hot-tested engine family, require its concrete fuel row, duty-cycle/test identifier, test burden, and each constituent required or measured by the declared method; for no-hot-test routes, require documented not-applicable evidence."
    source_ids:
      - eu-regulation-2016-1628
      - us-epa-40-cfr-1065-15
  - rule_id: validation_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm public state-100 flow identity, flow type, classification, property, unit group, product state, geography, technology, and general comment before publication; unresolved generic and internal flows remain explicit blockers to publication, not permission to use a proxy."
    source_ids: []
  - rule_id: validation_ranges
    applies_to: "important flows"
    rule: "Treat missing external ranges as declared evidence needs and use collected foreground values; do not create a numeric range from one case, snippets, or incompatible source boundaries."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review and publication of the completed foreground data package"
  downstream_use: "Cradle-to-gate engine-production modelling and upstream supply to equipment, vessel, rail, stationary-power, agricultural, construction, or other non-road product systems"
  allowed_use: "Use for the declared engine family, manufacturing route, production geography, period, fuel and test configuration, and included accessories or after-treatment; aggregation across models is allowed only with production-mass weighting and disclosed mix"
  excluded_use: "Motor-vehicle or aircraft engines; engine operation or lifetime performance; remanufactured engines; complete generating sets; parts-only products; a geography, technology, or engine family not represented without explicit proxy assessment"
  required_metadata: "PCR id and version; engine application and family/model; ignition principle; fuel; rated net power; displacement; speed and cooling class; emissions stage or non-regulated status; after-treatment and accessories; net mass; factory-test route and duty cycle; purchased-versus-in-house component scope; geography; reference period; allocation; upstream dataset list; unresolved-flow log"
  required_quality_disclosure: "foreground coverage; temporal coverage; primary-data share; meter and scale calibration; BOM and mass-balance reconciliation; test sampling coverage; fuel and exhaust method; conditional-row applicability; proxy datasets; uncertainty and unresolved range evidence"
  update_trigger: "Change in engine family or product mix, material or supplier route, machining technology, cleaning chemistry, assembly scope, test method or duration, test fuel, after-treatment, emissions stage, site electricity mix, geography, allocation driver, or more than three years since the representative reference period"
