measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product and all mass-normalized exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine calibrated net mass of complete engines as shipped, including fluids and accessories supplied with the engine but excluding transport packaging, reusable test fixtures, and separately sold equipment; normalize all inventory to 1,000 kg."
  - id: component_mass_basis
    applies_to: "purchased materials and internal transfers"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record dry or as-received mass consistently, declare coatings or entrained fluids when material, and reconcile issued mass with product, chip, fluid, and stock movements."
  - id: electricity_energy_basis
    applies_to: "purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Retain meter readings in kWh and convert to MJ using 1 kWh = 3.6 MJ; disclose voltage level, grid geography, on-site generation, imported electricity, and separately measured exported or recovered test power."
  - id: gas_volume_basis
    applies_to: "gaseous natural gas test fuel"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered volume and declare temperature, pressure, moisture basis, composition, and reference conditions; do not convert to mass without a documented density or composition record."
  - id: test_emission_basis
    applies_to: "factory-test exhaust emissions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Integrate each measured or calculated constituent over the actual test interval and normalize to 1,000 kg of accepted engine output; do not substitute regulatory g/kWh limits for measured factory-test inventory."
