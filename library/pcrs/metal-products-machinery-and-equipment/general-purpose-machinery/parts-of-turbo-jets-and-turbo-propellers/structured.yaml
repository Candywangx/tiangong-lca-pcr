validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Fail when CPC identity, part number, drawing revision, engine applicability, alloy, route, new-part state, acceptance status, or unpackaged factory-gate state is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - faa-ac-33-8-2009
  - rule_id: validate_reference_mass
    applies_to: "reference output"
    rule: "Require exactly 1 kg net accepted output and exclude rejects, fixtures, protective caps, and packaging from that mass."
    source_ids: []
  - rule_id: validate_route_inventory
    applies_to: "process inventory"
    rule: "Require every performed operation in the route record to have corresponding inputs, outputs, utilities, wastes, and direct emissions; require conditional rows to be explicitly not applicable when absent."
    source_ids:
      - us-epa-aerospace-ctg-1997
      - nasa-cr-159464-1979
  - rule_id: validate_no_double_count
    applies_to: "emissions and upstream datasets"
    rule: "Fail when upstream electricity or fuel-supply emissions are repeated as direct foreground emissions, or when recirculated cutting fluid is counted again as fresh concentrate."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "material flows"
    rule: "Investigate unreconciled preform-to-product-plus-scrap mass differences and disclose retained work in progress, evaporation, sampling, or measurement uncertainty."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for an unpackaged accepted turbine-engine part at factory gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-footprint, aircraft-engine supply-chain, procurement, process-improvement, and comparative studies when product identity, route, geography, period, and allocation are compatible"
  excluded_use: "Complete-engine manufacture or operation; generic aircraft parts; repair or overhaul; unqualified substitution across alloys, part criticality, routes, or acceptance states"
  required_metadata: "PCR id and version; part number; drawing revision; engine applicability; alloy and material specification; criticality category; preform identity; route; site and geography; period; accepted mass; rejection rate; included operations; meter and allocation methods; upstream datasets"
  required_quality_disclosure: "data coverage; calibration; supplier-data quality; mass and energy reconciliation; route applicability; allocation; unresolved UUIDs; missing range evidence; uncertainty and limitations"
  update_trigger: "Change in part design, alloy, preform route, heat treatment, surface process, supplier, site, energy supply, acceptance criteria, allocation method, or a material shift in rejection or resource intensity"
