  reference_flow_link: "finished_machinery_part"
system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground manufacturing"
      rule: "Start with concrete purchased materials or near-net precursors entering the manufacturing boundary and end with the finished, cleaned, accepted, unpackaged part at the factory gate. Include only operations actually performed and identify forming/cutting, machining, joining, heat treatment, cleaning, surface treatment, inspection, and internal handling separately in source records."
      source_ids:
        - un-cpc-3-0-structure-2025
        - eu-commission-2021-2053-fabricated-metal-products
    - rule_id: boundary_direct_exchanges
      applies_to: "foreground inventory"
      rule: "Include every direct material, electricity, fuel, process-water, process-chemical, gas, waste, wastewater, and elementary-emission exchange attributable to the declared route. Shared utilities may be allocated only under Section 7."
      source_ids:
        - eu-commission-2021-2053-fabricated-metal-products
    - rule_id: boundary_upstream_links
      applies_to: "purchased inputs"
      rule: "Link each purchased input to an upstream dataset matching material or chemical identity, grade or concentration, product state, geography, technology, and delivery boundary; do not replace a concrete input with an unspecified umbrella flow."
      source_ids:
        - eu-commission-2021-2053-fabricated-metal-products
    - rule_id: boundary_exclusions
      applies_to: "downstream and capital activities"
      rule: "Exclude packaging, distribution after the factory gate, use, maintenance, end-of-life, employee travel, and capital equipment unless the study goal explicitly expands the boundary and reports the expansion separately."
      source_ids:
        - un-cpc-3-0-structure-2025
boundary_abstraction:
  declared_starting_condition: "Concrete purchased material or purchased near-net precursor received at the manufacturing site, with supplier identity, grade, form, mass, and delivery boundary declared."
  starting_condition_role: "Upstream-linked product input to the foreground manufacturing unit process."
  product_classification_scope: "Residual non-electrical machinery parts in CPC 3.0 subclass 43949; one concrete part is modelled per data package."
  recursive_input_rule: "A purchased input already within the same product category remains an explicit product input with its own supplier dataset and starting condition; do not recursively apply this PCR or absorb it into the reference output."
  upstream_dataset_requirement: "Use an upstream dataset matching the concrete material or part identity, grade, state, geography, technology, and supplier gate. Proxy use requires explicit justification and uncertainty disclosure."
  disclosure: "Declare the part drawing/revision, material and precursor state, operations included or absent, facility and period, supplier-data coverage, shared-meter allocation, waste destinations, and every boundary expansion."
