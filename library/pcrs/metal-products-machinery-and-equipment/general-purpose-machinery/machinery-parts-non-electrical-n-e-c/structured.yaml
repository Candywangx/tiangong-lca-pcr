allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable products, routes, batches, and operations"
    rule: "Avoid allocation by collecting product-, batch-, route-, and operation-specific records or by subdividing independently measurable processes."
    source_ids:
      - eu-recommendation-2021-2279-environmental-footprint
  - rule_id: allocation_physical
    applies_to: "unavoidable shared inputs and emissions"
    rule: "When subdivision is not possible, use a documented causal physical relationship such as metered energy, machine time, treatment area, gas use, or bath loading that represents the driver of the shared exchange; do not default to mass merely because the reference flow is mass-based."
    source_ids:
      - eu-recommendation-2021-2279-environmental-footprint
  - rule_id: allocation_other
    applies_to: "no defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and causal physical allocation are infeasible; retain product-specific quantities, prices, period, currency, and sensitivity results."
    source_ids:
      - eu-recommendation-2021-2279-environmental-footprint
  - rule_id: allocation_waste
    applies_to: "steel swarf, spent fluid, and wastewater"
    rule: "Keep these outputs as waste flows at the foreground gate. Do not subtract an avoided-product credit inside this unit process unless the declared downstream methodology explicitly requires it and the alternative result is reported transparently."
    source_ids:
      - eu-recommendation-2021-2279-environmental-footprint
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "part_manufacturing"
      flow_role: "concrete solid material input"
      record_type: "purchase, issue, return and stock record"
      raw_fields: "material identity; grade; form; supplier; batch; issued mass; returned mass; opening and closing stock"
      collection_method: "calibrated scale and inventory reconciliation"
      unit: "kg"
      frequency: "each batch, reconciled monthly"
      temporal_coverage: "representative continuous 12-month period or disclosed campaign"
      site_scope: "all included production lines"
      aggregation_rule: "issued minus returned material, normalized by accepted product mass"
      quality_evidence: "scale calibration; stock reconciliation; supplier certificate; batch trace"
    - protocol_id: cp_electricity
      process_id: "part_manufacturing"
      flow_role: "purchased electricity"
      record_type: "meter and machine log"
      raw_fields: "meter id; start/end readings; machine state; operation; batch; shared-load basis"
      collection_method: "dedicated meter preferred; otherwise documented submeter or engineering allocation"
      unit: "kWh and MJ"
      frequency: "each batch or interval no longer than one month"
      temporal_coverage: "same period as product output"
      site_scope: "all included machines and attributable auxiliaries"
      aggregation_rule: "sum attributable kWh, convert to MJ, normalize by accepted product mass"
      quality_evidence: "meter calibration; tariff or utility reconciliation; allocation trace"
    - protocol_id: cp_process_water
      process_id: "part_manufacturing"
      flow_role: "process-water make-up"
      record_type: "meter, tank and batch record"
      raw_fields: "source; meter readings; tank changes; operation; recirculation; purge; batch"
      collection_method: "dedicated meter or tank balance"
      unit: "kg or m3 with density"
      frequency: "each batch or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included water-using operations"
      aggregation_rule: "count boundary-crossing make-up once; normalize by accepted product mass"
      quality_evidence: "meter calibration; tank balance; density basis"
    - protocol_id: cp_process_chemicals
      process_id: "part_manufacturing"
      flow_role: "metalworking fluid and sodium hydroxide"
      record_type: "purchase, issue, concentration and stock record"
      raw_fields: "product; supplier; lot; supplied mass; concentration; density; opening/closing stock; returned mass; operation"
      collection_method: "weighed issue and stock reconciliation; laboratory or supplier concentration"
      unit: "kg"
      frequency: "each batch, reconciled monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included chemical-using operations"
      aggregation_rule: "calculate concrete product or pure-substance mass, normalize by accepted product mass"
      quality_evidence: "scale calibration; certificate of analysis; concentration test; stock reconciliation"
    - protocol_id: cp_process_gases
      process_id: "part_manufacturing"
      flow_role: "oxygen and carbon-dioxide process gas"
      record_type: "flowmeter or cylinder inventory"
      raw_fields: "gas identity; grade; supplier; pressure; temperature; start/end cylinder mass or volume; operation; batch"
      collection_method: "calibrated flowmeter or cylinder mass balance"
      unit: "m3 or kg"
      frequency: "each batch"
      temporal_coverage: "same period as product output"
      site_scope: "all included cutting and joining operations"
      aggregation_rule: "aggregate each gas separately at declared reference conditions, normalize by accepted product mass"
      quality_evidence: "meter calibration; supplier certificate; cylinder reconciliation"
    - protocol_id: cp_fuel_gas
      process_id: "part_manufacturing"
      flow_role: "gaseous natural gas"
      record_type: "meter and supplier record"
      raw_fields: "meter readings; temperature; pressure; composition; net calorific value; operation; batch"
      collection_method: "calibrated dedicated meter or documented allocation from site meter"
      unit: "m3"
      frequency: "each batch or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "all included thermal operations"
      aggregation_rule: "normalize reference-condition volume by accepted product mass"
      quality_evidence: "meter calibration; supplier statement; allocation trace"
    - protocol_id: cp_product_output
      process_id: "part_manufacturing"
      flow_role: "accepted reference product"
      record_type: "production and quality record"
      raw_fields: "part id; drawing revision; batch; produced count; accepted count; reject count; net mass; rework status"
      collection_method: "calibrated scale linked to quality acceptance"
      unit: "kg and item"
      frequency: "each batch"
      temporal_coverage: "same period as all inputs"
      site_scope: "all included products and rejects"
      aggregation_rule: "sum accepted net mass; normalize inventory to 1 kg"
      quality_evidence: "scale calibration; inspection record; batch genealogy"
    - protocol_id: cp_waste_mass
      process_id: "part_manufacturing"
      flow_role: "steel swarf and spent metalworking fluid"
      record_type: "waste transfer and scale record"
      raw_fields: "waste identity; source operation; gross/tare/net mass; moisture or water/oil content; destination; date; batch"
      collection_method: "calibrated scale or verified waste contractor ticket"
      unit: "kg"
      frequency: "each transfer, assigned to batches or period"
      temporal_coverage: "same period as product output"
      site_scope: "all included waste collection points"
      aggregation_rule: "subtract tare and retained reusable material, normalize by accepted product mass"
      quality_evidence: "scale calibration; transfer note; composition or drainage record"
    - protocol_id: cp_wastewater
      process_id: "part_manufacturing"
      flow_role: "metal surface-treatment wastewater"
      record_type: "discharge meter, tank and analytical record"
      raw_fields: "source operation; volume or mass; density; pH; principal dissolved metals; suspended solids; treatment; destination; batch"
      collection_method: "calibrated meter or tank balance plus representative analysis"
      unit: "kg or m3 with density"
      frequency: "each discharge and representative analysis"
      temporal_coverage: "same period as product output"
      site_scope: "all included aqueous treatment discharges"
      aggregation_rule: "aggregate only the concrete wastewater stream, normalize by accepted product mass"
      quality_evidence: "meter calibration; laboratory report; discharge or transfer record"
    - protocol_id: cp_direct_co2
