validation_rules:
  - rule_id: validate_identity
    applies_to: "product category and reference flow"
    rule: "Confirm CPC 43949 applicability, exclusion of electrical and separately classified parts, exact canonical PCR id, 1 kg accepted unpackaged output, and all required product qualifiers."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route
    applies_to: "process map and boundary"
    rule: "Confirm that each performed operation is disclosed, each absent operation is excluded, and each purchased input has a matching upstream dataset or documented proxy."
    source_ids:
      - eu-commission-2021-2053-fabricated-metal-products
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject umbrella or combined selected flows. Electricity, water, each gas, each chemical, each waste stream, each wastewater stream, and each elementary emission shall remain separate atomic rows with route conditions."
    source_ids:
      - eu-commission-2021-2053-fabricated-metal-products
  - rule_id: validate_normalization
    applies_to: "quantities and units"
    rule: "Recalculate every normalized row from retained batch data; verify the kWh-to-MJ conversion, gas reference conditions, concentration calculations, accepted output mass, and no double counting of recirculated water or fluid."
    source_ids:
      - eu-commission-2021-2053-fabricated-metal-products
  - rule_id: validate_mass_balance
    applies_to: "solid material route"
    rule: "Reconcile concrete material input, accepted product, rejects, swarf, each other solid waste, stock change, and measured losses; unresolved residuals are findings, not unnamed waste flows."
    source_ids:
      - eu-commission-2021-2053-fabricated-metal-products
  - rule_id: validate_emissions
    applies_to: "direct fossil carbon dioxide"
    rule: "Confirm that only direct foreground fossil CO2 is recorded, the measured or calculation basis is retained, fossil fraction is declared, and upstream electricity emissions are excluded."
    source_ids:
      - eu-commission-2021-2053-fabricated-metal-products
  - rule_id: validate_allocation
    applies_to: "shared and multifunctional operations"
    rule: "Confirm that subdivision was attempted first and that every remaining allocation key follows a documented causal physical relationship or a justified last-resort relationship with sensitivity information."
    source_ids:
      - eu-recommendation-2021-2279-environmental-footprint
  - rule_id: validate_uuid_status
    applies_to: "inventory identity"
    rule: "Confirm each stored UUID by public state-100 direct read. Keep unresolved rows blank and visible; never substitute a rejected, narrower, broader, wrong-state, wrong-classification, or bilingual-conflicted candidate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground unit_process dataset for manufacture and acceptance of one declared non-electrical machinery part"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Attributional cradle-to-gate modelling of a matching finished non-electrical general-purpose machinery part with compatible drawing, material, route, geography, technology, period, boundary, and allocation."
  excluded_use: "Electrical parts; parts in CPC 43941-43944; special-purpose machinery parts; complete machines; service-life comparisons without functional equivalence; packaged product; downstream distribution, use, maintenance, and end-of-life."
  required_metadata: "canonical PCR id; CPC applicability; part and drawing/revision; material grade and form; net mass; route operations; heat and surface state; facility geography; period; meter and allocation coverage; accepted/reject mass; upstream datasets; waste destinations; unresolved UUIDs"
  required_quality_disclosure: "primary-data share; metering and scale coverage; calibration; temporal representativeness; supplier-data quality; proxy use; mass-balance residual; shared-meter allocation; direct-emission method; missing range evidence; uncertainty and data gaps"
  update_trigger: "Change in part drawing or material grade; route, machine, heat treatment or surface treatment; supplier mix; energy or gas source; facility or geography; allocation method; direct-emission method; waste destination; or a newly confirmed UUID or compatible independent range evidence."
