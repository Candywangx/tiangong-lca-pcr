allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared machines, furnaces, baths, ventilation, and inspection equipment"
    rule: "Prefer submetering, batch records, machine time, bath loading, or another measured causal driver. Document the driver and reconcile allocated totals to facility records."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "aluminium chips, steel chips, rejected parts, waste oils, and other recovered residues"
    rule: "Report gross waste output and its destination. Do not subtract recycling credit or avoided virgin production from the foreground inventory; any recycling benefit must be modelled and disclosed in a separate downstream scenario."
    source_ids: []
  - rule_id: allocation_multi_output
    applies_to: "production campaigns with more than one saleable part"
    rule: "Subdivide by part number when feasible. If subdivision is not feasible, use a documented physical causal relation; economic allocation requires explicit justification and sensitivity disclosure."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_machining_records
      process_id: "machining_and_cleaning"
      flow_role: "Material, electricity, water, cutting fluid, chips, and spent machining fluid"
      record_type: "Purchase/issue records, scales, meters, batch travellers, and waste manifests"
      raw_fields: "part_number; batch_id; accepted_mass_kg; input_identity; input_mass_kg; electricity_MJ_or_kWh; water_mass_or_volume; cutting_fluid_mass_kg; chip_material; chip_mass_kg; spent_fluid_identity; spent_fluid_mass_kg; inventory_change; destination"
      collection_method: "Reconcile direct meters and weighed issues/dispatches to each production batch; retain original units and allocation keys."
      unit: "kg; MJ; kWh; m3"
      frequency: "Per batch with at least monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "All controlled machining and cleaning operations at the reporting site and included suppliers"
      aggregation_rule: "Sum net boundary-crossing quantities by atomic flow, allocate only shared quantities under section 7, and divide by accepted part mass."
      quality_evidence: "Calibration records, purchase and issue records, batch travellers, meter totals, waste manifests, and material-balance reconciliation"
    - protocol_id: cp_heat_treatment_records
      process_id: "heat_treatment"
      flow_role: "Fuel, electricity, quenching oil, direct fossil CO2, and spent quench oil"
      record_type: "Furnace meters, cycle logs, bath make-up/removal logs, emission records, and batch travellers"
      raw_fields: "batch_id; furnace_id; cycle; treated_part_mass_kg; accepted_mass_kg; gas_m3; gas_conditions; electricity_MJ_or_kWh; quench_oil_added_kg; quench_oil_removed_kg; direct_fossil_co2_kg; emission_calculation_inputs"
      collection_method: "Link each furnace cycle and bath transaction to treated batches; retain measured fuel and electricity and all emission-calculation inputs."
      unit: "kg; MJ; kWh; m3"
      frequency: "Per furnace cycle and bath transaction, reconciled monthly"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "All in-boundary heat-treatment and quench equipment and included supplier services"
      aggregation_rule: "Allocate shared cycles by measured treated mass or another documented causal driver, then divide by accepted part mass."
      quality_evidence: "Calibrated meter records, furnace charts, controlled recipes, bath logs, emission records, and batch traceability"
    - protocol_id: cp_surface_treatment_records
      process_id: "surface_treatment"
      flow_role: "Electricity, water, sodium hydroxide, sulfuric acid, chromic acid, and wastewater"
      record_type: "Rectifier and utility meters, bath analyses, chemical issue records, rinse records, discharge meters, and treatment manifests"
      raw_fields: "batch_id; route; treated_area_or_mass; accepted_mass_kg; electricity_MJ_or_kWh; water_mass_or_volume; chemical_identity; solution_mass_kg; concentration; active_chemical_mass_kg; wastewater_mass_or_volume; density; chromium_speciation; destination"
      collection_method: "Record each chemical separately on an active-substance basis, retain solution concentration, and reconcile bath additions, drag-out, rinse discharge, and inventory changes."
      unit: "kg; MJ; kWh; m3"
      frequency: "Per batch and chemical addition, reconciled monthly"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "All in-boundary surface-treatment, rinse, ventilation, and wastewater-transfer operations"
      aggregation_rule: "Sum atomic inputs and outputs by declared route, allocate shared baths by measured ampere-hours, treated area, or another documented causal driver, and divide by accepted part mass."
      quality_evidence: "Calibrated meters, certificates of analysis, bath-control logs, purchase/issue records, discharge records, and hazardous-waste documentation"
    - protocol_id: cp_inspection_release_records
      process_id: "inspection_and_release"
      flow_role: "Inspection electricity, accepted product, and nonconforming parts"
      record_type: "Inspection/test records, equipment logs, calibrated scales, release records, and nonconformance dispositions"
      raw_fields: "part_number; revision; batch_id; inspection_route; electricity_MJ_or_kWh; accepted_count; accepted_mass_kg; rejected_count; rejected_mass_kg; disposition; release_status"
      collection_method: "Link energy, accepted mass, and reject mass to the same part-number campaign and retain authorized inspection and disposition records."
      unit: "kg; MJ; kWh; Item(s)"
      frequency: "Per batch or release lot, reconciled monthly"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign disclosed"
      site_scope: "All final inspection, marking, preservation, release, and nonconforming-part control in boundary"
      aggregation_rule: "Sum accepted and rejected mass by part number, allocate shared inspection energy causally, and normalize to accepted mass only."
      quality_evidence: "Inspection and test records, calibration status, release documents, nonconformance authorization, segregation evidence, and final disposition records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized quantity = net boundary-crossing quantity assigned to the declared part number / net accepted part mass for the same reporting period"
      inputs:
        - "atomic flow quantity"
        - "allocation key where needed"
        - accepted_mass_kg
      output: "quantity per 1 kg accepted reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity records"
      rule: "electricity_MJ = electricity_kWh × 3.6; preserve the original meter reading and unit"
      inputs:
        - electricity_kWh
      output: "electricity_MJ"
      source_ids: []
    - id: calc_solution_active_mass
      applies_to: "sodium hydroxide, sulfuric acid, and chromic acid"
      rule: "active chemical mass = solution mass × measured or certificate concentration mass fraction"
      inputs:
        - solution_mass_kg
        - concentration_mass_fraction
      output: "active_chemical_mass_kg"
      source_ids:
        - us-epa-ap42-12-20-electroplating-2021
    - id: calc_direct_fossil_co2
      applies_to: "direct furnace CO2 when not continuously measured"
      rule: "Use the site's documented fuel-carbon calculation with metered fuel, fuel carbon content, oxidation evidence, and unit conversions; disclose the equation and factors rather than applying an undeclared default."
      inputs:
        - "gas_m3 or fuel mass"
        - "reference conditions"
        - "carbon content"
        - "oxidation factor"
        - "molecular conversion"
      output: "fossil_carbon_dioxide_kg"
      source_ids: []
    - id: calc_aqueous_mass
      applies_to: "water or wastewater recorded by volume"
      rule: "mass = measured volume × stream density at the declared conditions"
      inputs:
        - volume
        - density
        - "temperature and concentration conditions"
      output: "water_or_wastewater_mass_kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "reference product and all material inputs"
      requirement: "Preserve part number, current drawing/revision, material grade, supplier or site, batch/lot, process route, inspection status, and raw-material-to-completed-part traceability."
      evidence: "Controlled design data, batch travellers, certificates, supplier records, inspection status, and release record"
    - id: dq_temporal_scope
      applies_to: "all foreground records"
      requirement: "Use one representative continuous 12-month period where available; a shorter complete campaign must state dates, production volume, seasonality limits, and why it is representative."
      evidence: "Meter coverage, production calendar, batch list, and reconciliation"
    - id: dq_atomic_completeness
      applies_to: "all process inventories"
      requirement: "Reconcile purchased inputs, utilities, chemicals, wastes, direct emissions, accepted mass, rejected mass, and inventory changes; add every additional route-specific exchange as a separate atomic row."
      evidence: "Material and energy balances, bills, meters, bath logs, waste manifests, and omission register"
    - id: dq_special_processes
      applies_to: "heat treatment, anodizing, plating, coating, and nondestructive inspection"
      requirement: "Declare whether each process is in-house or outsourced and retain controlled route, supplier, recipe/specification, acceptance evidence, and upstream dataset link."
      evidence: "Special-process certification, supplier control record, work instruction, inspection/test record, and upstream dataset"
    - id: dq_measurement
      applies_to: "meters, scales, gauges, and test equipment"
      requirement: "Use calibrated equipment over the reporting period; document estimation, downtime, missing-data substitution, and uncertainty."
      evidence: "Calibration status, meter logs, maintenance records, and missing-data register"
    - id: dq_unresolved_uuid
      applies_to: "inventory rows without a confirmed Tiangong UUID"
      requirement: "Preserve the exact atomic name and qualifiers and flag the identity as unresolved; never substitute a broader, differently classified, or differently stated flow."
      evidence: "UUID audit record and dataset-level unresolved-identity disclosure"
validation_rules:
  - rule_id: val_product_identity
    applies_to: "reference product"
    rule: "Fail validation if part number, revision/configuration, aircraft spark-ignition piston-engine application, material grade, approved-design or controlling-specification basis, acceptance status, or net accepted mass is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - faa-ac-21-43a-2015
      - faa-ac-43-18-chg-2-2011
  - rule_id: val_boundary
    applies_to: "foreground and supplier-controlled operations"
    rule: "Fail validation if an applicable machining, heat-treatment, surface-treatment, inspection, or supplier-controlled special process is omitted without an explicit exclusion and data-gap disclosure."
    source_ids:
      - faa-ac-21-43a-2015
      - faa-ac-43-18-chg-2-2011
  - rule_id: val_inventory_atomicity
    applies_to: "all exchanges"
    rule: "Fail validation if an inventory row combines materials, utilities, fuels, chemicals, wastes, wastewater types, or emissions, or if route applicability is not declared."
    source_ids: []
  - rule_id: val_mass_and_energy_reconciliation
    applies_to: "production period"
    rule: "Require accepted mass, rejected mass, material inputs, recovered chips, waste oils, chemical/water outputs, electricity, and fuel totals to reconcile with source records and documented allocation keys."
    source_ids: []
  - rule_id: val_quality_release
    applies_to: "accepted and nonconforming parts"
    rule: "Fail validation if inspection/test status, authorized release basis, nonconforming-part segregation, or final disposition evidence is absent."
    source_ids:
      - faa-ac-21-43a-2015
  - rule_id: val_uuid_and_units
    applies_to: "UUID-bearing and unresolved rows"
    rule: "Require UUID-bearing rows to retain the audited flow property and unit group; require unresolved rows to remain explicitly unresolved with the same row id and semantic qualifiers."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate secondary dataset generated from foreground manufacturing records."
  downstream_use: "May serve as a secondary_dataset or background_dataset for the declared part number in aircraft piston-engine, maintenance, or aircraft product systems when geography, technology, period, route, and product-state compatibility are demonstrated."
  allowed_use: "Product-footprint and LCA modelling for the same part number/configuration or a demonstrably equivalent material, manufacturing route, acceptance state, geography, and reporting period."
  excluded_use: "Comparison of different part numbers by mass alone; complete-engine representation; compression-ignition, turbine-engine, remanufactured, repaired, or maintenance-fabricated parts; use-phase or service-life claims without additional modelling."
  required_metadata: "canonical PCR id and version; part name/number and drawing revision; engine and aircraft application; material grade; purchased-input state; controlled and outsourced route; accepted and rejected mass; site/geography; reporting period; electricity mix and gas reference conditions; allocation; recycling and treatment destinations; packaging status; source and UUID gaps."
  required_quality_disclosure: "Primary-data share and coverage; meter and scale calibration; supplier-data coverage; missing-data treatment; mass/energy reconciliation; special-process traceability; inspection/release evidence; uncertainty; unresolved UUIDs and range-evidence needs."
  update_trigger: "New part or revision, material or supplier change, manufacturing or special-process change, site/geography change, electricity or fuel-supply change, allocation change, material yield or reject-rate shift, reporting period older than the user's representativeness requirement, or resolution of a UUID/source gap."
