allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "Shared and multifunctional manufacturing processes"
    rule: "Avoid allocation by metering, production-order tracking, or subdivision. If that is not possible, document why and use a causal physical driver such as machine time, energy demand, processed mass, or tested unit-hours."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_other_relationship_last
    applies_to: "Residual shared burdens"
    rule: "Use economic or another non-physical relationship only after subdivision, system expansion, and a relevant physical relationship have been shown impracticable. Record the data period, factor calculation, affected processes, and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_internal_transfers
    applies_to: "Internal components and intermediate equipment states"
    rule: "Carry internal transfers without duplicating upstream burdens. Allocate only the incremental process inputs and outputs of the receiving process."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_rework_and_rejects
    applies_to: "Rework, rejects, and production scrap"
    rule: "Keep rework burdens with the accepted reference product. Record rejects and scrap as outputs; do not credit recycling or avoided production inside the foreground unless the chosen lifecycle method explicitly requires it and all parameters are disclosed."
    source_ids:
      - eu-pef-method-2021
  - rule_id: alloc_packaging
    applies_to: "Equipment and packaging"
    rule: "Keep equipment dry mass and packaging mass separate. Allocate packaging-operation burdens using directly measured packing records or a causal driver; do not add packaging mass to the equipment reference output."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_manufacturing_and_preparation"
      flow_role: "Material inputs and prepared component outputs"
      record_type: "BOM, purchase, stores, batch, and production records"
      raw_fields: "item_id; description; material_or_component_type; supplier; received_mass; issued_mass; accepted_output_mass; lot; unit; date"
      collection_method: "Reconcile product-specific BOM with receipts, issues, accepted outputs, and inventory change"
      unit: "kg and original unit"
      frequency: "Per lot or production order"
      temporal_coverage: "Full reporting period"
      site_scope: "All included component operations"
      aggregation_rule: "Sum by item and production order, subtract documented inventory change, then normalize by accepted factory-gate dry mass"
      quality_evidence: "Approved BOM revision, scale calibration, purchase or stores record, and reconciliation log"
    - protocol_id: cp_component_energy
      process_id: "component_manufacturing_and_preparation"
      flow_role: "Component-process energy and utilities"
      record_type: "Meter, fuel, utility, and machine-hour records"
      raw_fields: "carrier; meter_id; opening; closing; unit; machine_time; production_order; allocation_driver; geography; voltage_or_grade"
      collection_method: "Direct submeter where available; otherwise allocate a reconciled shared meter under section 7"
      unit: "kWh, MJ, m3, kg, or original unit"
      frequency: "Continuous, shift, batch, or monthly"
      temporal_coverage: "Full reporting period with start and end"
      site_scope: "All included component operations"
      aggregation_rule: "Direct use or shared total multiplied by documented causal allocation factor, then normalized by accepted dry mass"
      quality_evidence: "Meter identity and calibration, invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_component_waste_and_emissions
      process_id: "component_manufacturing_and_preparation"
      flow_role: "Component waste and direct emissions"
      record_type: "Scale, waste consignment, permit monitoring, laboratory, and factor-calculation records"
      raw_fields: "material_or_substance; flow_type; compartment_or_treatment; amount; unit; date; method; factor_source"
      collection_method: "Measure waste; measure emissions or calculate from collected activity and an identified method factor"
      unit: "kg and original unit"
      frequency: "Per batch, shipment, monitoring period, or permit frequency"
      temporal_coverage: "Full reporting period"
      site_scope: "All included component operations"
      aggregation_rule: "Sum by flow identity and destination or compartment, then normalize by accepted dry mass"
      quality_evidence: "Scale record, consignment note, laboratory result, permit report, or calculation sheet"
    - protocol_id: cp_assembly_records
      process_id: "final_assembly_and_integration"
      flow_role: "BOM inputs, assembly utilities, output, and waste"
      record_type: "BOM, issue, meter, work-order, and waste records"
      raw_fields: "equipment_id; item_id; issued_amount; incorporated_amount; utility_amount; output_mass; waste_amount; unit; date; driver"
      collection_method: "Link all records to the equipment or production order and reconcile material and shared resource use"
      unit: "kg and original unit"
      frequency: "Per equipment or production order"
      temporal_coverage: "Full reporting period"
      site_scope: "Final assembly line and support operations"
      aggregation_rule: "Sum direct records; allocate shared records under section 7; normalize by accepted dry mass"
      quality_evidence: "BOM revision, work order, meter or issue record, scale record, and waste record"
    - protocol_id: cp_factory_testing
      process_id: "factory_testing_and_acceptance"
      flow_role: "Test inputs, accepted output, rework, waste, and direct emissions"
      record_type: "Test plan, meter, issue-return, acceptance, rework, and waste records"
      raw_fields: "equipment_id; test_id; test_type; start; end; energy; test_media_issued; test_media_returned; accepted_mass; rework; waste; direct_release; unit"
      collection_method: "Link each test and rework event to the equipment and distinguish reusable test assets from consumed media"
      unit: "kg, kWh, MJ, or original unit"
      frequency: "Per test event"
      temporal_coverage: "All tests for equipment released in the reporting period"
      site_scope: "All factory test stations"
      aggregation_rule: "Sum consumed inputs, rework, wastes, and releases for accepted equipment, then normalize by accepted dry mass"
      quality_evidence: "Approved test plan, meter record, issue-return record, acceptance certificate, and rework disposition"
    - protocol_id: cp_packaging_release
      process_id: "packaging_and_factory_gate_release"
      flow_role: "Packaging inputs, reference output, and operation waste"
      record_type: "Packing list, material issue, scale, release, and waste records"
      raw_fields: "equipment_id; dry_mass; packaging_item; packaging_mass; waste_mass; release_date; unit"
      collection_method: "Reconcile accepted dry mass with packing and release records while keeping packaging separate"
      unit: "kg"
      frequency: "Per released equipment"
      temporal_coverage: "All equipment released in the reporting period"
      site_scope: "Factory packing and release boundary"
      aggregation_rule: "Set reference output to accepted dry mass, aggregate packaging and waste separately, then normalize to 1 kg output"
      quality_evidence: "Calibrated scale or BOM mass reconciliation, signed packing list, and release record"
    - protocol_id: cp_use_scenario_identity
      process_id: "operation_and_maintenance"
      flow_role: "Installed-unit identity and use scenario"
      record_type: "Installation, commissioning, and scenario records"
      raw_fields: "equipment_id; subtype; location; installed_mass; rise_or_length; speed; capacity; drive; duty_category; service_life; scenario_start; scenario_end"
      collection_method: "Bind the factory-gate product to one declared installed-unit scenario"
      unit: "kg, m, m/s, years, and declared capacity unit"
      frequency: "Per scenario and change event"
      temporal_coverage: "Declared service life or study period"
      site_scope: "Declared installation"
      aggregation_rule: "One scenario record per modelled unit; document every change affecting function or energy"
      quality_evidence: "Commissioning record, technical specification, scenario approval, and service-life basis"
    - protocol_id: cp_operational_energy
      process_id: "operation_and_maintenance"
      flow_role: "Equipment-associated operational energy and service"
      record_type: "Meter, controller log, simulation, or engineering calculation"
      raw_fields: "equipment_id; subtype; method; meter_boundary; active_energy; standby_energy; cycles; payload_or_passenger_basis; travel; operating_time; ancillary_loads; period; unit"
      collection_method: "Apply ISO 25745-2 to applicable lifts, ISO 25745-3 to applicable escalators or moving walks, or foreground measurement/calculation for skip hoists"
      unit: "kWh and declared service unit"
      frequency: "Continuous or representative measurement, annual calculation, and at scenario change"
      temporal_coverage: "Declared study period"
      site_scope: "Single installed unit"
      aggregation_rule: "Annualize the accepted measurement or calculation, separate ancillary loads, and scale to declared service life and reference mass"
      quality_evidence: "Meter calibration, controller export, model inputs, method version, calculation sheet, and boundary diagram"
    - protocol_id: cp_maintenance_records
      process_id: "operation_and_maintenance"
      flow_role: "Maintenance inputs, waste, service travel, and releases"
      record_type: "Maintenance log, invoice, parts issue, fluid inventory, travel, and waste records"
      raw_fields: "date; equipment_id; part_or_fluid; input_amount; removed_amount; treatment; travel_distance; mode; opening_inventory; closing_inventory; unit"
      collection_method: "Capture each maintenance event and reconcile fluids and removed parts"
      unit: "kg, L, km, tkm, and original unit"
      frequency: "Per maintenance event"
      temporal_coverage: "Declared study period"
      site_scope: "Declared installed unit and service network"
      aggregation_rule: "Sum by flow and route over the study period, calculate releases by inventory balance where needed, then normalize"
      quality_evidence: "Signed maintenance record, invoice or issue record, fluid inventory, travel log, and consignment note"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All manufacturing inventory rows"
      rule: "normalized_amount = attributable_period_amount / accepted_factory_gate_dry_mass_kg"
      inputs:
        - attributable_period_amount
        - accepted_factory_gate_dry_mass_kg
      output: "Amount per 1 kg complete factory-gate reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_shared_resource_allocation
      applies_to: "Shared energy, utilities, consumables, waste, and emissions"
      rule: "attributable_amount = reconciled_shared_total × causal_driver_for_product / sum_causal_drivers_for_all_products"
      inputs:
        - reconciled_shared_total
        - product_driver
        - total_driver
      output: "Product-attributable foreground amount"
      source_ids:
        - eu-pef-method-2021
    - id: calc_equipment_mass_balance
      applies_to: "Component preparation, assembly, testing, and release"
      rule: "unexplained_mass = inputs + opening_inventory − incorporated_output − recorded_waste − closing_inventory; investigate and disclose non-zero residuals"
      inputs:
        - input_mass
        - opening_inventory
        - incorporated_output_mass
        - recorded_waste_mass
        - closing_inventory
      output: "Process mass-balance residual"
      source_ids:
        - eu-pef-method-2021
    - id: calc_lift_annual_energy
      applies_to: "Applicable lift use scenario"
      rule: "Calculate annual single-unit energy from accepted measurements, calculation, or simulation under ISO 25745-2; retain method inputs and separate non-lift ancillary loads"
      inputs:
        - active_energy
        - standby_energy
        - trips_or_cycles
        - usage_category
        - measurement_or_simulation_inputs
      output: "kWh/year per installed lift"
      source_ids:
        - iso-25745-1-2023
        - iso-25745-2-2015
    - id: calc_escalator_walk_annual_energy
      applies_to: "Applicable escalator or moving-walk use scenario"
      rule: "Calculate and classify annual equipment energy under ISO 25745-3, retaining operating mode, running time, geometry, and excluded ancillary loads"
      inputs:
        - measured_or_calculated_power
        - operating_time
        - operating_mode
        - rise_or_length
        - ancillary_loads
      output: "kWh/year per installed escalator or moving walk"
      source_ids:
        - iso-25745-1-2023
        - iso-25745-3-2015
    - id: calc_skip_hoist_energy
      applies_to: "Skip-hoist use scenario"
      rule: "annual_or_period_energy = measured meter difference, or sum of documented drive, standby, and auxiliary energy over payload, travel, and cycle records; no lift or escalator default is imported automatically"
      inputs:
        - meter_readings_or_power
        - operating_time
        - cycles
        - payload
        - travel
        - standby
        - auxiliaries
      output: "kWh or MJ per declared duty period"
      source_ids: []
    - id: calc_fluid_release_balance
      applies_to: "Operating or hydraulic fluid releases"
      rule: "environmental_release = opening_inventory + additions − closing_inventory − recovered_for_reuse − treatment_bound_removal; negative results are invalid"
      inputs:
        - opening_inventory
        - additions
        - closing_inventory
        - recovered_amount
        - treatment_bound_amount
      output: "Mass released to the declared environmental compartment"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product and scenario"
      requirement: "Use one product-specific equipment configuration and one controlled BOM revision; declare every required qualifier."
      evidence: "Technical specification, BOM revision, product identifier, and release record"
    - id: dq_primary_manufacturing_data
      applies_to: "Manufacturer-controlled processes"
      requirement: "Use company- or site-specific data for the product BOM and included manufacturing processes."
      evidence: "Meter, work order, issue, test, waste, and release records; eu-pef-method-2021"
    - id: dq_temporal_representativeness
      applies_to: "All foreground data"
      requirement: "Cover a representative reporting period and disclose shutdowns, ramp-up, abnormal tests, rework campaigns, and substitutions."
      evidence: "Date-bounded records and representativeness statement"
    - id: dq_geographical_technological_match
      applies_to: "Upstream datasets and energy"
      requirement: "Match material grade, component technology, energy carrier, voltage, market state, production geography, and treatment route; document every proxy."
      evidence: "Dataset metadata and proxy justification"
    - id: dq_completeness
      applies_to: "BOM, energy, waste, and emissions"
      requirement: "Reconcile product mass and factory utilities; identify all exclusions and their potential significance rather than treating missing data as zero."
      evidence: "BOM reconciliation, utility reconciliation, mass balance, waste register, and exclusion log"
    - id: dq_operational_method
      applies_to: "Conditional use stage"
      requirement: "Preserve the applicable ISO method, version, measurement or model boundary, equipment geometry, usage category, service life, and ancillary-load treatment."
      evidence: "Method report, meter boundary, calculation sheet, and scenario record"
    - id: dq_uncertainty_and_estimates
      applies_to: "Estimates and calculated values"
      requirement: "Identify calculation factors, uncertainty, sensitivity, and replacement trigger. A reasoned_estimate must remain provisional and cannot silently become a conforming measured value."
      evidence: "Calculation sheet, source reference, uncertainty note, and review disposition"
validation_rules:
  - rule_id: val_identity_and_scope
    applies_to: "Reference product"
    rule: "Fail when canonical PCR id, equipment subtype, complete-versus-subsystem scope, CPC context, or required reference qualifiers are missing or contradictory."
    source_ids:
      - unsd-cpc-3-2025
      - epd-intl-cpcr-008-lifts-v2-0-0
  - rule_id: val_reference_uuid_and_mass
    applies_to: "Reference flow"
    rule: "Require product flow 71c9140f-5a21-4ba8-ac40-c272cdf45654, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, reference output 1 kg, and a positive whole-unit dry mass."
    source_ids: []
  - rule_id: val_bom_and_mass_balance
    applies_to: "Manufacturing inventory"
    rule: "Require a product-specific BOM, separate equipment and packaging mass, process waste by route, and documented investigation of material mass-balance residuals."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_required_processes
    applies_to: "Process coverage"
    rule: "Require final assembly and integration, factory testing and acceptance, and packaging and factory-gate release. Require component preparation whenever the manufacturer controls a listed component operation."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_allocation_evidence
    applies_to: "Shared processes"
    rule: "Fail shared-resource allocation without a reconciled total, causal driver, denominator population, data period, and explanation of why direct measurement or subdivision was not used."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_operational_subtype_method
    applies_to: "Conditional use-stage energy"
    rule: "Require the declared subtype-specific method. Reject lift c-PCR or ISO 25745-2 extrapolation to skip hoists, escalators, or moving walks; reject ISO 25745-3 extrapolation to lifts or skip hoists."
    source_ids:
      - epd-intl-cpcr-008-lifts-v2-0-0
      - iso-25745-2-2015
      - iso-25745-3-2015
  - rule_id: val_operational_boundary
    applies_to: "Conditional use-stage energy"
    rule: "Require a single-unit equipment meter or model boundary, declared included and excluded ancillary loads, period, geometry, duty or usage category, and service life."
    source_ids:
      - iso-25745-1-2023
      - iso-25745-2-2015
      - iso-25745-3-2015
  - rule_id: val_source_and_estimate_status
    applies_to: "External evidence and estimates"
    rule: "Fail an external-source value without a listed source id. Flag any reasoned_estimate as provisional and incomplete for activation until the review record explicitly accepts or replaces it."
    source_ids:
      - eu-pef-method-2021
  - rule_id: val_completeness_and_exclusions
    applies_to: "Dataset completeness"
    rule: "Fail silent omissions, missing upstream dataset links, missing treatment routes, or exclusions without reason and potential-significance disclosure."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed product-specific manufacturing dataset; background_dataset only after independent methodology and data review confirms representativeness"
  downstream_use: "Foreground data package for process authoring and lifecyclemodel construction; optional subtype-specific installation, use, maintenance, modernization, and end-of-life scenarios"
  allowed_use: "Product-specific modelling for the declared equipment subtype, manufacturing route, geography, factory-gate state, time period, and quality level"
  excluded_use: "Unqualified comparison across lifts, skip hoists, escalators, and moving walks; substitution for a complete-equipment dataset by a part or subsystem result; use-stage claims without a declared subtype method and service scenario"
  required_metadata: "PCR id and version; equipment subtype; service type; complete or subsystem scope; whole-unit dry mass; capacity; rise or length; speed; drive technology; duty or usage category; BOM revision; manufacturing geography and period; factory-gate condition; process coverage; allocation drivers; upstream dataset references; installation and use-stage scope; service life when applicable"
  required_quality_disclosure: "Primary-data share; BOM and utility reconciliation; mass-balance residual; temporal, geographic, and technological representativeness; proxy datasets; exclusions and potential significance; allocation method; operational-energy boundary; uncertainty; provisional estimates; source and UUID gaps"
  update_trigger: "Material BOM or design change; new drive or control technology; manufacturing-site or energy-supply change; changed test or packaging route; revised service-life or duty scenario; changed operational-energy standard; new reviewed subtype PCR; replacement of a proxy or provisional estimate; UUID deprecation"
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, code 43540, “Lifts, skip hoists, escalators and moving walkways”, https://unstats.un.org/unsd/classifications/cpc/version3 (retrieved 2026-07-26)"
    used_for: "Classification context and category-name scope only"
