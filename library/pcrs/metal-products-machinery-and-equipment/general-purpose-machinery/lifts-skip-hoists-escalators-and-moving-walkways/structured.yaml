system_boundary:
  rules:
    - rule_id: sb_product_specific_bom
      applies_to: "Product and manufacturing scope"
      rule: "Use a product-specific BOM and company- or site-specific manufacturing records for the equipment in scope. Generic component shares may be used only as an explicitly disclosed temporary data gap, not as a conforming foreground result."
      source_ids:
        - eu-pef-method-2021
        - epd-intl-cpcr-008-lifts-v2-0-0
    - rule_id: sb_factory_gate_core
      applies_to: "Common foreground boundary"
      rule: "Include manufacturer-controlled component preparation, assembly, integration, factory testing, acceptance, packaging, and factory-gate release. Identify co-products, by-products, rejects, and wastes crossing the foreground boundary."
      source_ids:
        - eu-pef-method-2021
    - rule_id: sb_conditional_downstream
      applies_to: "Installation, use, maintenance, modernization, and end of life"
      rule: "Model downstream stages only as explicit conditional processes with their own scenario, geography, time basis, and data sources. Their exclusion from a factory-gate dataset must be stated and must not be interpreted as zero impact."
      source_ids:
        - eu-pef-method-2021
        - epd-intl-pcr-2019-14-v2-0-1
    - rule_id: sb_subtype_method_separation
      applies_to: "Equipment subtype"
      rule: "Apply lift-specific PCR evidence only to lifts. Apply ISO 25745-2 only to applicable lifts and ISO 25745-3 only to applicable escalators and moving walks. Keep skip-hoist rules grounded in foreground records or separately applicable evidence."
      source_ids:
        - epd-intl-cpcr-008-lifts-v2-0-0
        - iso-25745-2-2015
        - iso-25745-3-2015
    - rule_id: sb_ancillary_energy_disclosure
      applies_to: "Conditional operational energy"
      rule: "Separate equipment-associated operational energy from building or site ancillary loads. List every included and excluded ancillary load and retain meter-boundary evidence."
      source_ids:
        - iso-25745-1-2023
        - iso-25745-3-2015
    - rule_id: sb_exclusion_justification
      applies_to: "All exclusions and cut-offs"
      rule: "Document the reason and potential significance of each excluded process or flow. Do not omit a relevant flow solely because its quantity or UUID is not yet available."
      source_ids:
        - eu-pef-method-2021
