allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared production and test operations"
    rule: "Avoid allocation by separately metering or physically disaggregating work orders, process time, energy, material issues, tests, and waste for the declared reference configuration."
    source_ids: []
  - rule_id: allocation_shared_facility
    applies_to: "unavoidable shared facility burdens"
    rule: "When subdivision is not feasible, allocate by a documented physical driver that caused the burden, such as machine-hours weighted by rated load, treated surface area, measured mass throughput, or test power-time; do not use revenue unless no defensible physical relationship exists."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recovered metal and packaging"
    rule: "Report recovered material as a separate waste or secondary-material output and do not credit avoided primary production inside the foreground inventory; any recycling allocation is applied consistently in the downstream study and disclosed."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejected or reworked units"
    rule: "Assign rework and failed-test burdens to the accepted output of the same reporting period using traceable work-order records; disclose exceptional prototype or development burdens rather than silently averaging them into serial production."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_bom_records
      process_id: "metal_fabrication_subsystem_assembly"
      flow_role: "material and component inputs; intermediates; retained oil"
      record_type: "ERP issue/return, purchase, bill-of-material, weighbridge, and transfer records"
      raw_fields: "work_order; material_or_component_id; grade_or_model; opening_stock; receipts; issued_quantity; returned_quantity; closing_stock; transferred_quantity; unit; net_mass"
      collection_method: "reconcile inventory movement to the as-built bill of materials and accepted transfer records"
      unit: "kg or item"
      frequency: "each work order; reconcile monthly"
      temporal_coverage: "at least 12 representative months or the complete production campaign when shorter"
      site_scope: "all reporting manufacturer sites"
      aggregation_rule: "sum net issues and accepted transfers for reference-product work orders; allocate shared records only by the declared physical driver"
      quality_evidence: "signed material reconciliation; calibration record; as-built bill of materials; variance investigation"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "metal_fabrication_subsystem_assembly_acceptance_testing"
      flow_role: "electricity, natural gas, oxygen, diesel, and direct combustion calculation inputs"
      record_type: "meter, cylinder/tank, invoice, and equipment run log"
      raw_fields: "meter_id; opening_reading; closing_reading; delivery; opening_stock; closing_stock; reference_conditions; work_order; run_time; rated_load; fuel_carbon_content; oxidation_fraction"
      collection_method: "dedicated metering preferred; otherwise inventory balance or documented power-time disaggregation"
      unit: "MJ, m3, or kg"
      frequency: "each batch or test; reconcile monthly"
      temporal_coverage: "same reporting period as output"
      site_scope: "all in-boundary production and test areas"
      aggregation_rule: "subtract opening from closing meter readings or reconcile stock; assign only by recorded work order and physical driver"
      quality_evidence: "meter calibration; invoice reconciliation; reference-condition record; run log; supplier fuel assay"
    - protocol_id: cp_surface_treatment_records
      process_id: "surface_treatment"
      flow_role: "water, chemicals, coating, electricity, treated output, and NMVOC calculation inputs"
      record_type: "bath log, meter, coating issue/return, area, production, and abatement records"
      raw_fields: "bath_id; chemistry; concentration; make_up; drag_out; rinse_water; electricity; coating_issue; coating_return; solvent_fraction; captured_solvent; abatement_efficiency; treated_area; accepted_mass"
      collection_method: "reconcile each treatment line and formulation to accepted components"
      unit: "kg, MJ, or m2"
      frequency: "each bath addition and production batch; reconcile monthly"
      temporal_coverage: "same reporting period as output"
      site_scope: "each in-boundary treatment line"
      aggregation_rule: "sum net make-up and energy; avoid counting recirculation as new input; link treatment to accepted area and mass"
      quality_evidence: "bath analysis; meter calibration; formulation safety data; coating reconciliation; abatement monitoring; acceptance record"
    - protocol_id: cp_acceptance_and_output_records
      process_id: "subsystem_assembly_acceptance_testing"
      flow_role: "assembled and tested intermediates; test electricity and oil"
      record_type: "configuration, test, release, meter, and fluid issue records"
      raw_fields: "serial_or_delivery_id; configuration; test_basis; test_start; test_end; objective_result; subjective_result; functional_result; electricity; oil_issue; oil_retained; rework; release_status"
      collection_method: "link signed test and release records to dedicated meters or logged equipment power-time"
      unit: "item, h, MJ, or kg"
      frequency: "each acceptance sequence"
      temporal_coverage: "complete reporting period"
      site_scope: "every reporting test facility"
      aggregation_rule: "include all required attempts and rework for released items; exclude development tests only when separately identified and disclosed"
      quality_evidence: "signed test report; calibrated instrumentation; configuration baseline; nonconformance closure"
    - protocol_id: cp_waste_and_emission_records
      process_id: "metal_fabrication_surface_treatment_acceptance_testing"
      flow_role: "steel scrap, spent solution, wastewater, waste oil, and direct emissions"
      record_type: "scale ticket, manifest, discharge meter, laboratory analysis, and mass-balance record"
      raw_fields: "waste_id; chemistry; hazardous_status; gross_mass; tare; discharge_volume; density; destination; recovered_mass; emission_measurement; work_order"
      collection_method: "weigh each shipment or meter each discharge; characterize chemistry before aggregation"
      unit: "kg"
      frequency: "each shipment or discharge; reconcile monthly"
      temporal_coverage: "same reporting period as output"
      site_scope: "all in-boundary generation points"
      aggregation_rule: "sum by one characterized waste or emission identity and destination; subtract only verified internal reuse"
      quality_evidence: "calibrated scale or meter; laboratory report; waste manifest; mass-balance closure"
    - protocol_id: cp_packaging_and_release_records
      process_id: "delivery_preparation"
      flow_role: "packaging inputs and factory-gate reference product"
      record_type: "packing list, packaging bill, scale, and release record"
      raw_fields: "serial_or_delivery_id; package_component; material_grade; component_mass; reusable_status; net_mass; packaged_mass; item_count; release_signature"
      collection_method: "reconcile actual packing materials and final weights to each released delivery"
      unit: "kg or item"
      frequency: "each delivery"
      temporal_coverage: "complete reporting period"
      site_scope: "all dispatch sites in scope"
      aggregation_rule: "sum new packaging delivered with the product; report reusable fixtures separately; count only signed releases"
      quality_evidence: "packing list; calibrated scale; shipment photograph or inspection; signed release"
  calculation_rules:
    - id: calc_normalize_item
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period amount assigned to conforming deliveries / count of conforming reference items; retain configuration-specific results when averaging would hide material differences"
      inputs:
        - "assigned row amount"
        - "released reference-item count"
        - "configuration identifier"
      output: "row amount per reference item"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "all electricity rows"
      rule: "electricity in MJ = metered electricity in kWh x 3.6 MJ/kWh"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_inventory_balance
      applies_to: "issued materials, chemicals, oils, fuels, and packaging"
      rule: "net consumed = opening stock + receipts - closing stock - documented unopened returns - verified internal reuse; separately report retained product mass and characterized wastes"
      inputs:
        - "inventory movement and transfer records"
      output: "reconciled net input, retained amount, and waste"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "mf_fossil_co2; at_fossil_co2"
      rule: "fossil CO2 mass = measured fuel amount x supplier-specific fossil carbon content x documented oxidation fraction x 44/12; do not calculate when fuel composition or oxidation basis is missing"
      inputs:
        - "fuel amount"
        - "fossil carbon content"
        - "oxidation fraction"
      output: "kg carbon dioxide (fossil)"
      source_ids: []
    - id: calc_surface_material_balance
      applies_to: "st_nmvoc; treatment losses"
      rule: "emitted coating solvent = solvent in net coating issue - solvent retained in coating - captured solvent - documented destruction; reconcile bath and rinse inputs to retained material, spent solution, wastewater, recovery, and measured releases"
      inputs:
        - formulation
        - "issue/return"
        - capture
        - abatement
        - bath
        - rinse
        - waste
        - "and discharge records"
      output: "kg emitted NMVOC and treatment mass-balance residual"
      source_ids:
        - ec-stm-bref-2006
        - ec-sts-bref-2020
  data_quality_requirements:
    - id: dq_identity_configuration
      applies_to: "reference product and purchased assemblies"
      requirement: "Preserve serial or delivery identity, product family, configuration baseline, major options, performance or qualification class, and make-versus-buy status."
      evidence: "as-built bill of materials; configuration record; purchase specification; release certificate"
    - id: dq_temporal_coverage
      applies_to: "all foreground records"
      requirement: "Cover at least 12 representative months; if the campaign is shorter, cover the complete campaign and disclose start/end dates, production volume, prototypes, shutdowns, and abnormal rework."
      evidence: "record-extract dates; production ledger; exception log"
    - id: dq_measurement
      applies_to: "metered and weighed rows"
      requirement: "Use calibrated meters and scales appropriate to the measured quantity; document reference conditions for gases and density conversions for liquids."
      evidence: "calibration certificates; meter map; density and reference-condition records"
    - id: dq_completeness
      applies_to: "all process boundaries"
      requirement: "Reconcile at least 95% of assigned input mass and energy by measured records; investigate rather than automatically cut off any single untracked flow expected to exceed 1% of reference-product mass or foreground energy."
      evidence: "signed reconciliation; variance investigation; added atomic rows"
    - id: dq_testing
      applies_to: "acceptance testing"
      requirement: "Link each released item to its actual objective, subjective, functional, or representative-load test basis, attempts, energy, fluids, rework, and disposition."
      evidence: "signed test report; instrument list; nonconformance closure; navsea-jfmm-alre-2024; us-navy-ford-alre-test-2017; faa-part-60-fstd"
    - id: dq_outsourcing
      applies_to: "outsourced fabrication or treatment"
      requirement: "Declare supplier, geography, process route, received state, and linked upstream dataset; do not claim zero burden for an outsourced operation."
      evidence: "purchase order; supplier declaration; incoming inspection; upstream dataset link"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Fail when product family, configuration, function, qualification/performance class, net mass, packaged mass, acceptance basis, geography, reporting period, or factory-gate condition is missing."
    source_ids:
      - un-cpc-3-0-2025
      - navsea-jfmm-alre-2024
      - faa-part-60-fstd
  - rule_id: validate_reference_count
    applies_to: "reference product"
    rule: "Require exactly one released reference item after normalization and a signed release record; a bundle of modules may count as one only when the contracted delivery boundary is explicit."
    source_ids: []
  - rule_id: validate_process_routes
    applies_to: "process map"
    rule: "Require assembly, acceptance testing, and delivery preparation; require each in-house fabrication, treatment, coating, hydraulic, fuel, and simulator route to activate its corresponding process and atomic rows."
    source_ids:
      - navsea-jfmm-alre-2024
      - us-navy-ford-alre-test-2017
      - faa-part-60-fstd
      - ec-stm-bref-2006
      - ec-sts-bref-2020
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject plural collection rows, combined utilities or fuels, proxy UUIDs, UUID/property/unit mismatches, and conditional rows without a documented applicability decision."
    source_ids: []
  - rule_id: validate_internal_links
    applies_to: "foreground intermediates"
    rule: "Require transferred amounts and identities to reconcile between fabrication, treatment, assembly, testing, and delivery-preparation processes without duplicate upstream burdens."
    source_ids: []
  - rule_id: validate_direct_emissions
    applies_to: "fuel and coating rows"
    rule: "Require direct fossil CO2 and NMVOC calculations when the corresponding in-boundary fuel combustion or solvent-borne coating occurs; require composition and abatement inputs or report the calculation as incomplete."
    source_ids:
      - ec-sts-bref-2020
  - rule_id: validate_mass_energy
    applies_to: "foreground records"
    rule: "Require documented material and energy reconciliation, meter/reference-condition evidence, treatment recirculation treatment, waste destinations, and explanations for material residuals or shared-meter allocations."
    source_ids:
      - ec-stm-bref-2006
  - rule_id: validate_test_release
    applies_to: "accepted output"
    rule: "Reject an output lacking the configuration-controlled acceptance record and required objective, subjective, functional, or representative-load test evidence for its declared product family."
    source_ids:
      - navsea-jfmm-alre-2024
      - us-navy-ford-alre-test-2017
      - faa-part-60-fstd
published_dataset_profile:
  dataset_role: "foreground production dataset for one configured, acceptance-tested equipment delivery at the manufacturer gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "product carbon footprint or LCA models that match the declared product family, configuration, performance/qualification class, make-versus-buy pattern, production geography, technology, acceptance-test boundary, and factory-gate state"
  excluded_use: "complete aircraft, ship, runway, building, launch/recovery operation, pilot-training service, site installation, maintenance, use, or end-of-life without additional models; substitution among launch gear, arresting gear, and ground trainers without configuration review"
  required_metadata: "canonical PCR id; product family; model/configuration; serial or delivery basis; performance/qualification class; included controls and auxiliaries; principal power technology; net and packaged mass; make-versus-buy and outsourced routes; sites and geography; reporting period; test basis; reference conditions; allocation drivers; upstream dataset links"
  required_quality_disclosure: "completeness and reconciliation results; meter and scale calibration; gas reference conditions; treatment chemistry and area; coating formulation and abatement; test attempts and rework; waste characterization and destinations; unresolved UUIDs and range-evidence needs; deviations and cut-offs"
  update_trigger: "changed product family or qualification basis; material configuration or mass change; changed launch/recovery/trainer technology; changed hydraulic, control, display, coating, test, or packaging route; supplier/geography change; reporting period older than five years; material meter, allocation, or completeness change"
