measurement_rules:
  - id: reference_net_mass
    applies_to: "accepted reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or calculate the net mass of accepted finished parts after removal of chips, free liquid, temporary fixtures, and removable sales packaging; rejected parts are not reference product."
