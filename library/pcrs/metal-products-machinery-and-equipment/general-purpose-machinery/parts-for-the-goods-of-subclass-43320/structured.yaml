    - id: dq_measurement
      applies_to: "measured exchanges"
      requirement: "Use calibrated instruments with units, reference conditions, calibration status, and data-gap treatment retained."
      evidence: "calibration certificates; meter logs; scale checks"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Cover a representative continuous period or enough complete lots to capture normal operating, start-up, shutdown, purge, and waste-transfer events; report exclusions."
      evidence: "production calendar; lot register; operating logs"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile purchased inputs, meters, waste transfers, and accepted output; identify all additional route-specific atomic exchanges and explain material or energy gaps."
      evidence: "mass and energy reconciliations; invoices; transfer manifests"
    - id: dq_allocation
