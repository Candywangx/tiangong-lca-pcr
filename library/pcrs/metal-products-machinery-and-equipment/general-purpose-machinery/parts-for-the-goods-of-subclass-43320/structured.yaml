      requirement: "Background datasets shall match declared material, geography, technology, product state, and time period as closely as available; disclose proxies."
      evidence: "supplier dataset; dataset metadata; proxy justification"
validation_rules:
  - rule_id: val_identity
    applies_to: "reference product"
    rule: "Fail if the output is a complete CPC 43320 good, a CPC 43310 bearing part, a general-purpose fastener, or another product not identifiable as a separately supplied part for a CPC 43320 good."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: val_reference_amount
    applies_to: "reference flow"
    rule: "Fail if the declared reference amount is not 1 kg accepted net finished-part mass or if removable packaging, rejects, free liquid, or temporary fixtures are included."
    source_ids: []
  - rule_id: val_route_coverage
    applies_to: "process map"
    rule: "Fail if an on-site machining, heat-treatment, aqueous-cleaning, or inspection operation is performed but omitted, or if an outsourced operation is represented as zero burden."
    source_ids:
      - nist-ir-7913-2013
      - ec-jrc-sf-bref-2024
      - ec-jrc-stm-bref-2006
  - rule_id: val_atomic_inventory
    applies_to: "inventory rows"
    rule: "Fail if one row combines multiple materials, energy carriers, chemicals, wastes, or elementary emissions, or instructs a future route choice instead of naming one exchange."
    source_ids: []
  - rule_id: val_uuid_and_localization
    applies_to: "flow identities"
    rule: "Fail if a UUID-bearing flow differs from its verified public identity, property, or unit group; flag unresolved reference-product and metalworking-fluid UUIDs for review; require the official TianGong Chinese baseName in the Chinese rendering for every adopted UUID."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "material inventory"
    rule: "Fail if input, accepted product, machining chips, rejects, other wastes, and stock change are not reconciled or the unexplained residual lacks investigation and disclosure."
    source_ids: []
  - rule_id: val_range_evidence
    applies_to: "amount ranges"
    rule: "Fail any externally inferred range unless at least two independent original sources support compatible system boundary, functional unit, and product state; an absent range remains an explicit foreground evidence need and shall not be replaced by a single case value."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared separately supplied part of a CPC 43320 good"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon-footprint, life-cycle assessment, supply-chain, and mechanical-equipment models whose part identity, material, route, geography, technology, and gate condition match the declared qualifiers"
  excluded_use: "Complete gearboxes, shafts, clutches, couplings, pulleys, bearing assemblies, or articulated chains; bearing parts of CPC 43310; unidentified generic metal parts; use-phase performance; end-of-life without an explicit downstream model"
  required_metadata: "PCR id and version; part family; intended parent good; drawing or part number; material and alloy grade; received stock or preform state; route; heat and surface treatment; accepted-lot status; geography; technology; reporting period; facility gate; allocation; background dataset links; unresolved UUID disclosures"
  required_quality_disclosure: "Instrument coverage and calibration; temporal and production coverage; mass-balance residual; meter allocation; rejects and rework; fluid and wastewater basis; outsourced operations; background proxies; data gaps; uncertainty; absence of two-source empirical ranges"
  update_trigger: "Change in part family, material grade, purchased stock or preform state, machining technology, heat-treatment route, cleaning route, facility, electricity or fuel supply, allocation, waste destination, reference-product identity, or any newly confirmed exact TianGong UUID or compatible two-source range evidence"
