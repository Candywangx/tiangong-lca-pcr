allocation_rules:
  - rule_id: alloc_subdivision_first
    applies_to: "shared machines, meters, and treatment systems"
    rule: "Avoid allocation by subdividing processes, using dedicated meters, or assigning measured machine time and load to the reporting lot. Document the allocation key and unallocated remainder."
    source_ids: []
  - rule_id: alloc_rejects_and_rework
    applies_to: "rejected parts and rework"
    rule: "Assign all burdens incurred before rejection to the production lot; assign additional rework burdens to accepted product and report rejected mass separately as its actual waste or recovery flow."
    source_ids: []
  - rule_id: alloc_scrap_no_avoided_burden
    applies_to: "low-alloy steel machining chips"
    rule: "Record gross chip mass and its actual destination at the foreground boundary. Do not subtract an avoided primary-steel credit inside this foreground process; any recycling substitution belongs to the declared downstream modelling method."
    source_ids: []
  - rule_id: alloc_unavoidable_multioutput
    applies_to: "other saleable co-products"
    rule: "If subdivision cannot resolve a material co-product, apply a documented causal physical relation; use mass only when it represents causality, report the choice, and test sensitivity against an alternative defensible relation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_alloy_steel_bar_input
      process_id: "machining_and_dimensional_finishing"
      flow_role: "alloy-steel bar input"
      record_type: "receiving, issue, and inventory records"
      raw_fields: "material grade; supplier; received and issued mass; opening and closing stock; lot link"
      collection_method: "reconciled weighbridge, scale, ERP, and stores records"
      unit: "kg"
      frequency: "each receipt and issue"
      temporal_coverage: "complete reporting period"
      site_scope: "all stock charged to included lots"
      aggregation_rule: "receipts + opening stock - closing stock - documented transfers"
      quality_evidence: "scale calibration; supplier certificate; inventory reconciliation"
    - protocol_id: cp_machining_electricity
      process_id: "machining_and_dimensional_finishing"
      flow_role: "electricity"
      record_type: "meter and machine-runtime records"
      raw_fields: "meter start/end; kWh; machine id; runtime; measured or rated load; lot link"
      collection_method: "dedicated submeter preferred; otherwise documented runtime-load allocation"
      unit: "kWh and MJ"
      frequency: "each shift or batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all included machining equipment and auxiliaries"
      aggregation_rule: "convert kWh to MJ and divide attributable total by accepted reference-product mass"
      quality_evidence: "meter calibration; allocation reconciliation; operating log"
    - protocol_id: cp_machining_process_water
      process_id: "machining_and_dimensional_finishing"
