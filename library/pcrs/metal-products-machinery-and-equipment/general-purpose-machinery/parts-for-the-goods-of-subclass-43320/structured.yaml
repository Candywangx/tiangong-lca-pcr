  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = attributable exchange quantity / accepted net reference-product mass"
      inputs:
        - "collected exchange quantity"
        - "accepted reference-product mass"
      output: "exchange per 1 kg accepted finished part"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered or allocated kWh"
      output: "delivered electrical energy in MJ"
      source_ids: []
    - id: calc_water_mass
      applies_to: "water and wastewater rows measured by volume"
      rule: "mass = measured volume × documented density at stated conditions"
      inputs:
        - volume
        - density
        - "reference conditions"
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "heat_treatment_fossil_co2"
      rule: "apply the documented site fuel-carbon and oxidation method to measured natural-gas consumption; keep factor provenance and reference conditions, or use quality-assured direct measurement"
      inputs:
        - "foreground gas quantity"
        - "carbon or emission factor"
        - "oxidation basis"
        - "or measured stack result"
      output: "kg direct fossil carbon dioxide"
      source_ids: []
    - id: calc_material_balance
      applies_to: "reporting lot"
      rule: "reconcile alloy-steel input with accepted product, machining chips, rejected parts, other declared wastes, and stock change; investigate and disclose the residual"
      inputs:
        - "input mass"
        - "output and waste mass"
        - "opening/closing work in progress"
      output: "mass-balance residual and completeness finding"
      source_ids: []
