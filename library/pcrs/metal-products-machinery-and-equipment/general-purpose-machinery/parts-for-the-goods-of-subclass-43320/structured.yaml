      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report mass at the point the exchange crosses its process boundary; document moisture, adhering-fluid, solution-concentration, and solids conventions where relevant."
  - id: water_mass_conversion
