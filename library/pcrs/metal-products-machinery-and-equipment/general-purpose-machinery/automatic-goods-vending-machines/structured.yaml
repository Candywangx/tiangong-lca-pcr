allocation_rules:
  - rule_id: al_subdivide_models
    applies_to: "mixed-model production"
    rule: "Prefer model-specific production orders, meters, work centres and bills of material so unlike machines are not pooled before normalization."
    source_ids: []
  - rule_id: al_shared_operations
    applies_to: "shared assembly, test and packaging burdens"
    rule: "Allocate a shared burden by a documented physical causal driver such as machine-specific cycle time, measured test energy, component mass or packaging count. Accepted-unit count may be used only when models consume materially equivalent operations."
    source_ids: []
  - rule_id: al_rejected_units
    applies_to: "rejected and reworked machines"
    rule: "Attribute rework and rejected-unit burdens to the production batch that caused them; do not remove those burdens from accepted output without disclosure."
    source_ids: []
  - rule_id: al_no_recycling_credit
    applies_to: "scrap, returnable packaging and recovered refrigerant"
    rule: "Report recovered material crossing the boundary separately when present. Do not assign avoided-burden or recycling credit inside the core factory-gate dataset unless a separately declared study method requires it."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_and_packaging_mass
      process_id: "machine_assembly_testing_packaging"
      flow_role: "purchased components and dispatch packaging"
      record_type: "bill of material, receipt, scale record"
      raw_fields: "model_id; component_id; flow_name; supplier; supply_state; quantity; unit_mass; total_mass; pallet_share; reuse_state"
      collection_method: "Reconcile approved bill of material to receipts and weigh representative components or packed units"
      unit: "kg and item"
      frequency: "each model revision; reconcile monthly"
      temporal_coverage: "current model revision and reporting year"
      site_scope: "final assembly site and declared suppliers"
      aggregation_rule: "Sum identical-flow masses for accepted model units; keep different component identities separate"
      quality_evidence: "calibrated-scale record, supplier specification, receipt and revision-controlled bill of material"
    - protocol_id: cp_utility_and_test_records
      process_id: "machine_assembly_testing_packaging"
      flow_role: "assembly and test electricity"
      record_type: "submeter and test log"
      raw_fields: "meter_id; start_kWh; end_kWh; model_id; accepted_units; rejected_units; test_mode; voltage; timestamp"
      collection_method: "Read dedicated meter or allocate a shared meter by logged machine-specific cycle time"
      unit: "kWh"
      frequency: "each production batch"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "final assembly and acceptance-test boundary"
      aggregation_rule: "Subtract verified non-production loads, convert kWh to MJ and divide by accepted model units"
      quality_evidence: "meter calibration, time log, production order and reconciliation"
    - protocol_id: cp_water_balance
      process_id: "machine_assembly_testing_packaging"
      flow_role: "process water and wastewater"
      record_type: "meter, invoice and discharge record"
      raw_fields: "inlet_mass_or_volume; wastewater_mass_or_volume; density; batch_id; model_id; treatment_destination; composition"
      collection_method: "Meter process-only water and wastewater or reconcile calibrated tank/weight records; keep sanitary water outside the boundary"
      unit: "kg, with measured density for volume conversion"
      frequency: "each batch or monthly"
      temporal_coverage: "same period as production inventory"
      site_scope: "final assembly and test-fixture cleaning boundary"
      aggregation_rule: "Attribute only assembly or test-fixture cleaning records to the model-specific batch"
      quality_evidence: "meter calibration, invoices, sampling results and discharge manifest"
    - protocol_id: cp_refrigerant_mass_balance
      process_id: "machine_assembly_testing_packaging"
      flow_role: "refrigerant charge and release"
      record_type: "cylinder scale, charge station and recovery log"
      raw_fields: "species; cylinder_open_mass; cylinder_close_mass; purchased_mass; returned_mass; recovered_mass; inventory_change; accepted_installed_charge; rejected_unit_charge; captured_loss; measured_release"
      collection_method: "Perform a closed mass balance separately for R404A, R134a and propane R290 using calibrated scales and charge-station records"
      unit: "kg"
      frequency: "each cylinder and production batch"
      temporal_coverage: "same period as refrigerated-model production"
      site_scope: "final refrigerant charging and recovery boundary"
      aggregation_rule: "Reconcile each species; assign installed charge to accepted units and positive uncaptured imbalance to the matching elementary-emission row"
      quality_evidence: "scale calibration, cylinder IDs, machine serial numbers, leak check and recovery record"
    - protocol_id: cp_finished_machine_acceptance
      process_id: "machine_assembly_testing_packaging"
      flow_role: "accepted reference product"
      record_type: "scale, serial-number and acceptance record"
      raw_fields: "model_id; serial_number; net_mass; packaged_mass; vendible_capacity; configuration; temperature_class; voltage; frequency; test_energy; refrigerant; charge; acceptance_result"
      collection_method: "Weigh each unit or a justified model sample and link acceptance results to the production order"
      unit: "kg and declared performance units"
      frequency: "each accepted unit or statistically controlled lot"
      temporal_coverage: "current model revision and reporting year"
      site_scope: "final assembly and acceptance-test boundary"
      aggregation_rule: "Average net mass only within one materially unchanged model; reference amount is the declared model value"
      quality_evidence: "calibrated scale, acceptance checklist, safety test and model specification"
  calculation_rules:
    - id: calc_batch_normalization
      applies_to: "batch component, utility, water and waste totals"
      rule: "normalized amount = attributable batch amount / accepted machines of the same model; retain rejected-unit and work-in-progress reconciliation"
      inputs:
        - "attributable batch amount"
        - "accepted model units"
        - "rejected units"
        - "work in progress"
      output: "amount per accepted finished machine"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "assembly_electricity"
      rule: "electricity_MJ = net metered kWh × 3.6 / accepted machines of the same model"
      inputs:
        - "start and end kWh"
        - "excluded loads"
        - "accepted model units"
      output: "MJ per accepted finished machine"
      source_ids: []
    - id: calc_refrigerant_charge_and_loss
      applies_to: "refrigerant input and species-specific charging-loss rows"
      rule: "net refrigerant used = opening inventory + purchases - closing inventory - returns; uncaptured loss = net used - accepted installed charge - rejected-unit charge - recovered or captured mass. Investigate negative or materially unbalanced results."
      inputs:
        - "species-specific cylinder"
        - inventory
        - installed-charge
        - "recovery and release records"
      output: "installed charge and uncaptured loss in kg per accepted machine"
      source_ids:
        - eu-2019-2024-direct-sales-refrigeration
    - id: calc_reference_mass_reconciliation
      applies_to: "reference output and packaging"
      rule: "packaged mass check = net machine mass + wooden pallet share + corrugated-board boxes + any separately declared packaging; unexplained difference requires correction or disclosure"
      inputs:
        - "net and packaged scale records"
        - "each packaging row"
      output: "reconciled reference mass and packaging disclosure"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Link product name, model identifier, serial or lot, vendible capacity, configuration and acceptance result to the weighed reference output."
      evidence: "model specification, production order and acceptance record"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile all received component, utility, refrigerant, packaging and waste records to the model-specific production order; explain exclusions and data gaps."
      evidence: "bill-of-material reconciliation and mass/energy balances"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Use data representative of the declared production year and current model revision; disclose shutdowns, prototypes and abnormal rework periods."
      evidence: "dated meters, orders and revision history"
    - id: dq_geography_technology
      applies_to: "upstream inputs"
      requirement: "Match supplier geography, component supply state, electricity grid, refrigeration technology and packaging reuse state; disclose every proxy."
      evidence: "supplier declarations and dataset metadata"
    - id: dq_refrigerant
      applies_to: "refrigerated routes"
      requirement: "Preserve refrigerant species, purity/grade, cylinder identity, installed charge and direct charging loss without aggregation across species."
      evidence: "charge-station and calibrated-scale reconciliation"
validation_rules:
  - rule_id: vr_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the output UUID is the complete CPC 43934 machine, not a cabinet, frame or machinery part, and confirm the reference amount equals the declared model's measured net mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: vr_atomic_inventory
    applies_to: "every inventory row"
    rule: "Reject collection labels and combined utilities, components, refrigerants, wastes or emissions; each row must identify one physical exchange and one applicable property/unit."
    source_ids: []
  - rule_id: vr_component_completeness
    applies_to: "purchased assemblies"
    rule: "Reconcile the cabinet, condensing unit when applicable, motors, board, display, dispensing mechanism and payment module to the model bill of material; disclose additional material components rather than hiding them in a combined row."
    source_ids:
      - ec-jrc-eup-lot12-2007
  - rule_id: vr_energy
    applies_to: "assembly_electricity"
    rule: "Verify meter boundary, kWh-to-MJ conversion, model-specific allocation and exclusion of use-phase electricity."
    source_ids:
      - eu-2019-2024-direct-sales-refrigeration
  - rule_id: vr_refrigerant_route
    applies_to: "refrigerant inputs and outputs"
    rule: "Require exactly the declared refrigerant species rows for each refrigerated model, reconcile charge and loss, and reject a combined refrigerant row or an emission assigned to the wrong air compartment."
    source_ids:
      - us-epa-energy-star-vending-v4-2019
  - rule_id: vr_bilingual_uuid
    applies_to: "UUID-bearing rows"
    rule: "Confirm English and Chinese use the same UUID and that Chinese uses the direct-read TianGong baseName; for HFC-134a retain the English baseName because TianGong provides no Chinese baseName."
    source_ids: []
  - rule_id: vr_range_evidence
    applies_to: "amount ranges"
    rule: "Reject an externally inferred range unless at least two independent original sources have compatible boundary, functional unit and product state; specification limits are not empirical ranges."
    source_ids: []
  - rule_id: vr_boundary_disclosure
    applies_to: "dataset profile"
    rule: "Confirm the core result ends at factory-gate readiness and that any distribution, use, maintenance or end-of-life scenario is a separate disclosed module."
    source_ids:
      - eu-2019-2024-direct-sales-refrigeration
published_dataset_profile:
  dataset_role: "Product-specific factory-gate secondary dataset derived from verified foreground production records"
  downstream_use: "Background dataset for manufacture of the declared automatic goods vending machine; input to separately parameterized distribution, use, maintenance and end-of-life lifecycle models"
  allowed_use: "Comparisons within the same complete-machine scope, model configuration, reference mass, geography, year, allocation rule and packaging boundary; scenario modelling with separately disclosed downstream modules"
  excluded_use: "Generic use-energy claims; attribution to rebuilt machines or parts; comparison of unlike dispensing, capacity or temperature functions without normalization; substitution for supplier component data when supply state differs"
  required_metadata: "PCR id and version; model and configuration; geography and year; net and packaged mass; vendible capacity; dispensing and payment technology; temperature function; voltage/frequency; test energy; refrigerant and charge; design life; upstream dataset list; allocation; exclusions; data owner"
  required_quality_disclosure: "primary-data coverage; meter and scale calibration; model/batch reconciliation; supplier-data share; proxies; refrigerant balance; rejected units; missing ranges; uncertainty and reviewer status"
  update_trigger: "model or bill-of-material revision; new dispensing/payment/refrigeration technology; refrigerant substitution; more than 10% change in net mass, manufacturing electricity or major component mass; supplier geography change; packaging change; new reviewed UUID; or new independent range evidence"
