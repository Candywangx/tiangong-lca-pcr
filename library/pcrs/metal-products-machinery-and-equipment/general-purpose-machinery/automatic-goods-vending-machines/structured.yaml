measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product and all mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh or otherwise verify the net mass of one accepted machine without dispatch packaging; report packaging as separate input rows and do not substitute shipping mass for reference mass."
  - id: batch_to_machine
    applies_to: "batch production records"
    required_property_ref:
      name: "Mass, energy or item count as recorded"
      uuid: ""
    required_unit: "kg, MJ or item"
    rule: "Use model-specific batches. Divide batch totals only by accepted machines of the same declared model and retain rejected-unit and work-in-progress reconciliation."
  - id: electricity_conversion
    applies_to: "assembly and acceptance-test electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the meter reading in kWh and convert to MJ with 1 kWh = 3.6 MJ; state voltage, grid geography and meter boundary."
  - id: refrigerant_species_mass
    applies_to: "refrigerant charge and charging loss"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep each refrigerant species in a separate row. Reconcile purchased, returned, recovered, inventory-change, installed-charge and measured-release masses; never report a combined refrigerant amount."
