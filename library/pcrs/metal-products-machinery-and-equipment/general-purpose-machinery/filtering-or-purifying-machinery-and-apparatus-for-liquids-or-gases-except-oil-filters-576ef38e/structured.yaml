allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared_manufacturing_processes"
    rule: "First subdivide meters, issue records, work orders, waste records, and emission records so the declared apparatus receives product-specific foreground activity data wherever practicable."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "residual_shared_activity"
    rule: "When subdivision is not practicable, allocate a shared activity with a documented causal physical driver such as machine time, measured electricity, processed mass, bath loading, test duration, or packaged mass. Use one driver consistently within the reporting period."
    source_ids: []
  - rule_id: allocation_rejects_rework
    applies_to: "rejects_and_rework"
    rule: "Assign material, energy, waste, and emission burdens from normal rejects and rework to accepted apparatus produced in the same reporting period; separately disclose abnormal events."
    source_ids: []
  - rule_id: allocation_scrap_output
    applies_to: "recyclable_scrap"
    rule: "Record scrap leaving the foreground as a waste output at measured mass. Do not subtract an unreported recycling credit from the manufacturing inventory; disclose any downstream recycling model separately."
    source_ids: []
  - rule_id: allocation_economic_last_resort
    applies_to: "multifunctional_processes"
    rule: "Use economic allocation only when subdivision and a defensible causal physical relationship are unavailable; disclose prices, period, currency, sensitivity, and the affected inventory share."
    source_ids: []
