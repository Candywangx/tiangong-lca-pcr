  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every foreground inventory row"
      rule: "normalized amount = period quantity attributable to the declared product divided by accepted complete apparatus in the same period"
      inputs:
        - "reconciled period quantity"
        - "allocation result where needed"
        - "accepted unit count from cp_assembly_output"
      output: "amount per 1 accepted apparatus"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_electricity_kwh_to_mj
      applies_to: "electricity rows"
      rule: "electricity in MJ = metered electricity in kWh multiplied by 3.6 MJ/kWh"
      inputs:
        - "calibrated meter reading in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_water_volume_to_mass
      applies_to: "water and wastewater rows"
      rule: "mass = measured volume multiplied by documented density at the recorded conditions"
      inputs:
        - "measured volume"
        - density
        - "temperature or supplier reference conditions"
      output: "water or wastewater mass in kg"
      source_ids: []
    - id: calc_pm10_release
      applies_to: "fabrication_pm10_high_stack"
      rule: "released PM10 mass = corrected concentration multiplied by corrected dry-gas flow and operating duration for the documented stack, then normalized under calc_reference_normalization"
      inputs:
        - concentration
        - "gas flow"
        - "moisture and reference-condition corrections"
        - duration
        - "accepted units"
      output: "PM10 mass per accepted apparatus"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and BoM"
      requirement: "The model, configuration, function, rated performance, product mass, and BoM revision must identify one consistent product population."
      evidence: "serial register, approved product specification, released BoM, acceptance record, dry shipping mass reconciliation"
    - id: dq_technological_representativeness
      applies_to: "foreground processes"
      requirement: "Records must represent the actual purchased-versus-in-house route, fabrication and finishing technologies, test method, recovery loops, and packaging scenario."
      evidence: "process map, routing, work instructions, equipment list, test protocol, packaging specification"
    - id: dq_geographical_representativeness
      applies_to: "foreground and upstream links"
      requirement: "Declare every manufacturing site and select upstream datasets matching supplier or market geography; document every geographic proxy."
      evidence: "site list, supplier addresses, procurement records, upstream dataset metadata, proxy justification"
    - id: dq_temporal_representativeness
      applies_to: "all inventory rows"
      requirement: "Use a representative reporting period or the complete declared campaign; align numerator and accepted-unit denominator and disclose abnormal shutdowns or product changes."
      evidence: "dated records, reporting-period reconciliation, production logs, abnormal-event review"
    - id: dq_completeness
      applies_to: "all exchanges"
      requirement: "Reconcile the product-specific BoM and manufacturing records and disclose omitted flows, cut-offs, data gaps, and the share of inventory affected."
      evidence: "signed mass and utility reconciliation, waste reconciliation, missing-data register, cut-off statement"
    - id: dq_precision
      applies_to: "measured and allocated data"
      requirement: "Retain meter resolution, calibration, sampling design, allocation drivers, and calculation worksheets; report uncertainty or sensitivity for material shared allocations."
      evidence: "calibration certificates, sampling plan, raw exports, allocation workbook, sensitivity results"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference_product"
    rule: "Confirm that CPC scope, finished-apparatus state, model, configuration, performance qualifiers, acceptance status, reference amount, and output row describe the same product. Reject a dataset that substitutes a filter part, service, or excluded internal-combustion-engine filter."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_bom
    applies_to: "bill_of_materials"
    rule: "Confirm that material, installed-component, and packaging rows reconcile to the released product-specific BoM and dry shipping mass after documented fabrication losses and excluded reusable fixtures."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_period
    applies_to: "temporal_consistency"
    rule: "Confirm that inputs, outputs, wastes, emissions, allocation drivers, and accepted-unit counts use the same site and reporting period."
    source_ids: []
  - rule_id: validation_atomic_flows
    applies_to: "inventory_rows"
    rule: "Confirm that every inventory row represents one physical, chemical, waste, or energy exchange; split any combined material, utility, fuel, packaging, waste, wastewater-plus-residue, or emission collection before publication."
    source_ids: []
  - rule_id: validation_uuid_semantics
    applies_to: "tiangong_references"
    rule: "Confirm every UUID by public state-100 identity, bilingual base name, flow type, classification, property, unit group, product state, geography, technology, and generalComment. Keep unresolved rows UUID-empty."
    source_ids: []
  - rule_id: validation_mass_water_energy
    applies_to: "quantitative_reconciliation"
    rule: "Confirm product and packaging mass reconciliation, process-water and wastewater balance, electricity meter reconciliation, unit conversions, scrap destinations, and direct-emission compartment before accepting the dataset."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_ranges
    applies_to: "external_ranges"
    rule: "Reject an externally inferred empirical range unless at least two mutually independent original sources have compatible system boundary, functional unit, and product state and the synthesis explains geographic and technological differences."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific factory-gate secondary_dataset or background_dataset for one declared apparatus model and configuration"
  downstream_use: "Link as the production dataset for the declared apparatus in process or lifecycle-model studies that preserve the required qualifiers and factory-gate boundary"
  allowed_use: "Product-system modelling, procurement comparison, design improvement, and inventory compilation when geography, technology, period, performance, and configuration are representative"
  excluded_use: "Unqualified category-average claims; substitution for filter parts or excluded internal-combustion-engine filters; use-stage performance claims; comparative assertions across unlike functions, capacities, service lives, or system boundaries"
  required_metadata: "PCR id and version; manufacturer and model; configuration and BoM revision; function and rated performance; filtration principle and media; design flow and pressure or vacuum; production sites; reference period; dry shipping mass; packaging; system boundary; allocation; cut-offs; upstream dataset versions; unresolved-flow treatment"
  required_quality_disclosure: "Technological, geographical, and temporal representativeness; completeness and precision; measurement and calibration evidence; allocation shares; data gaps and proxies; mass, water, wastewater, and electricity reconciliation; acceptance-test coverage"
  update_trigger: "New model or material configuration; changed filtration principle, rated performance, housing or media; material change in dry shipping mass; changed manufacturing site or major process route; changed packaging; changed allocation driver; reporting data no longer temporally representative; material correction to a UUID or boundary"
