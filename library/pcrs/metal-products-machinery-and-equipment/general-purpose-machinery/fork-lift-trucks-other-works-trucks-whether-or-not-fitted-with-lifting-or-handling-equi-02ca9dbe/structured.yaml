allocation_rules:
  - rule_id: al_subdivide
    applies_to: "shared lines, utilities and rework"
    rule: "Avoid allocation by submetering, batch tracking, process subdivision, or configuration-specific production records."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_physical
    applies_to: "unavoidable shared burdens"
    rule: "Allocate by the causal physical relationship, such as machine time, metered energy, coating area, weld length, or tested units; mass alone is permitted only when it represents causality."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_fallback
    applies_to: "no defensible physical relationship"
    rule: "Use economic or another justified relationship only after documenting why physical allocation is infeasible and test sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_waste
    applies_to: "scrap and wastes"
    rule: "Do not allocate manufacturing burdens to outputs without economic value; disclose treatment and any credit method for sold recyclable material."
    source_ids:
      - ghg-protocol-product-standard-2011
