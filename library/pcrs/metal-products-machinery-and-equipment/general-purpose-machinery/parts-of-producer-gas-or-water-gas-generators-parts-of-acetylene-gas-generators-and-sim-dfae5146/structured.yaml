    rule: "When direct measurement is unavailable, use the physical driver that caused the exchange, such as machine time, treated area, weld length, bath make-up, or test duration; disclose the driver and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "metal scrap outputs"
    rule: "Record each segregated scrap stream as waste at the foreground boundary. Do not subtract avoided-production credit; any recycling substitution belongs in a separately declared downstream scenario."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework and rejects"
    rule: "Assign rework inputs and rejects to the batch that generated them; do not remove their burdens from the conforming-output denominator."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_waste_mass
      process_id: "material_preparation"
      flow_role: "named metal inputs, cutting fluid, and segregated wastes"
      record_type: "BOM issue, return, scale, and transfer records"
      raw_fields: "part_id; batch_id; material_grade; flow_name; issued_mass; returned_mass; waste_mass; disposition; timestamp"
      collection_method: "reconcile issues and returns with calibrated scale or transfer records for each flow"
      unit: "kg"
      frequency: "each batch or order"
      temporal_coverage: "representative continuous campaign"
      site_scope: "each site and route"
      aggregation_rule: "sum by atomic flow and batch, then normalize to conforming output"
      quality_evidence: "BOM revision; certificate; scale calibration; transfer note; reconciliation"
    - protocol_id: cp_energy_metering
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "submeter or shared-meter allocation record"
      raw_fields: "meter_id; opening; closing; unit; interval; process_id; machine_time; batch_id"
      collection_method: "direct submetering preferred; otherwise causal allocation"
      unit: "original meter unit and MJ"
      frequency: "each batch or shortest interval"
      temporal_coverage: "same period as production"
      site_scope: "each site"
      aggregation_rule: "subtract readings, remove non-production load, assign by process, convert, normalize"
      quality_evidence: "calibration; allocation worksheet; production log"
    - protocol_id: cp_process_gas
      process_id: "joining_cleaning_finishing"
      flow_role: "natural gas and carbon dioxide"
      record_type: "meter, cylinder, or supplier record"
      raw_fields: "gas_identity; opening; closing; delivered; returned; temperature; pressure; moisture_basis; batch_id"
      collection_method: "meter difference or cylinder/supplier reconciliation"
      unit: "m3 or kg"
      frequency: "each batch or delivery interval"
      temporal_coverage: "same period as operation"
      site_scope: "each site"
      aggregation_rule: "convert only with declared conditions, assign, normalize"
      quality_evidence: "calibration; supplier ticket; cylinder reconciliation"
    - protocol_id: cp_water_balance
      process_id: "joining_cleaning_finishing"
      flow_role: "process water and wastewater"
      record_type: "input, discharge, and transfer records"
      raw_fields: "source; input; discharge; density; oil; metals; detergent; pH; treatment; destination; batch_id"
      collection_method: "separate input and discharge measurement with characterization"
      unit: "kg"
      frequency: "each batch or day"
      temporal_coverage: "same period as operation"
      site_scope: "each site"
      aggregation_rule: "convert with documented density, sum separately, normalize"
      quality_evidence: "calibration; laboratory result; discharge record"
    - protocol_id: cp_cleaning_chemistry
      process_id: "joining_cleaning_finishing"
      flow_role: "sodium hydroxide"
      record_type: "purchase, concentration, and bath make-up record"
      raw_fields: "product_mass; sodium_hydroxide_fraction; make_up_mass; returned_mass; bath_id; batch_id"
      collection_method: "calculate active mass from make-up and verified concentration"
      unit: "kg active"
      frequency: "each make-up and batch"
      temporal_coverage: "same period as cleaning"
      site_scope: "each line"
      aggregation_rule: "sum active fresh make-up assigned to batch, normalize"
      quality_evidence: "supplier certificate; concentration test; scale; bath log"
    - protocol_id: cp_direct_emission
      process_id: "joining_cleaning_finishing"
      flow_role: "fossil carbon dioxide"
      record_type: "stack measurement record"
      raw_fields: "period; concentration; exhaust_flow; temperature; pressure; moisture; operating_time; batch_id"
      collection_method: "site measurement at representative operation"
      unit: "kg"
      frequency: "each representative test and batch"
      temporal_coverage: "same period as combustion"
      site_scope: "each emission point"
      aggregation_rule: "integrate mass, assign, normalize"
      quality_evidence: "sampling report; calibration; operating log"
    - protocol_id: cp_refrigerant_balance
      process_id: "assembly_testing_release"
      flow_role: "R404A input, retained charge, recovery, inventory, release"
      record_type: "cylinder and charging-system balance"
      raw_fields: "identity; opening_inventory; purchased; recovered_in; retained; recovered_out; closing_inventory; batch_id"
      collection_method: "calibrated scale or charging-machine record over complete circuit"
      unit: "kg"
      frequency: "each batch and cylinder change"
      temporal_coverage: "same period as testing"
      site_scope: "each circuit"
      aggregation_rule: "close by identity and batch; calculate release from reconciled difference"
      quality_evidence: "calibration; cylinder log; charging record; reconciliation"
    - protocol_id: cp_product_release
      process_id: "assembly_testing_release"
      flow_role: "conforming output"
      record_type: "release, inspection, and scale record"
      raw_fields: "part_id; drawing_revision; batch_id; gross_mass; excluded_packaging_mass; conforming; reject; rework; release_time"
      collection_method: "weigh conforming output and reconcile rejects and rework"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as inputs"
      site_scope: "each site"
      aggregation_rule: "sum conforming mass, subtract excluded packaging, normalize to 1 kg"
      quality_evidence: "calibration; inspection; release; reject and rework log"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every exchange"
      rule: "normalized amount = batch exchange amount divided by conforming finished-part mass"
      inputs:
        - "exchange total"
        - "conforming output mass"
      output: "amount per 1 kg finished part"
      source_ids: []
    - id: calc_sodium_hydroxide_active
      applies_to: "sodium_hydroxide"
      rule: "active mass = fresh solution make-up mass multiplied by verified sodium-hydroxide mass fraction"
      inputs:
        - "make-up mass"
        - concentration
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: calc_refrigerant_release
      applies_to: "r404a_to_air"
      rule: "release = opening inventory + purchased + recovered in - retained charge - recovered out - closing inventory; investigate negative or unexplained results"
      inputs:
        - "refrigerant balance fields"
      output: "kg R404A released"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "each metal route"
      rule: "Reconcile issued material with returns, product content, segregated scrap, work in process, and documented loss; do not force an unidentified remainder into a named flow."
      inputs:
        - "BOM and mass records"
      output: "route reconciliation and residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and flows"
      requirement: "Preserve flow identity, grade, state, direction, and UUID status; do not merge dissimilar materials, wastes, utilities, or emissions."
      evidence: "BOM; certificate; state-100 audit; unresolved manifest entries"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use one coherent period and align energy, material, waste, emission, and output records."
      evidence: "dated records"
    - id: dq_measurement
      applies_to: "measured values"
      requirement: "Retain calibration, original units, readings, conversion conditions, and allocation worksheets."
      evidence: "certificates; logs; worksheets"
    - id: dq_completeness
      applies_to: "route coverage"
      requirement: "Reconcile the process map to the route and document non-applicable conditional processes and atomic rows."
      evidence: "route traveller; checklist; BOM"
    - id: dq_range_evidence
      applies_to: "important flows"
      requirement: "Foreground collection remains mandatory; apply no external range until at least two independent, original, boundary-compatible sources support a reviewed synthesis."
      evidence: "manifest range-evidence needs and later review"
    - id: dq_classification
      applies_to: "product scope"
      requirement: "Verify the output is specifically a part for a listed equipment family and is not a complete machine."
      evidence: "un-cpc-3-0-structure-2025; drawing; sales specification"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow"
    rule: "Confirm the denominator is exactly 1 kg measured conforming output and excluded packaging is not embedded in it."
    source_ids: []
  - rule_id: validate_part_scope
    applies_to: "product identity"
    rule: "Confirm the drawing ties the output to a covered equipment family and the output is a part rather than complete equipment."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_process_coverage
    applies_to: "system boundary"
    rule: "Compare the route with the process map; include every applicable operation and document why each conditional item is absent."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Reject merged material, energy, fuel, chemical, refrigerant, waste, or emission labels; each row preserves one flow identity."
