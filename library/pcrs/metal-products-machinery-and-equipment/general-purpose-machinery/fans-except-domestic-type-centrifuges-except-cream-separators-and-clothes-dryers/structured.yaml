allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared fabrication, assembly, testing and utility systems"
    rule: "Subdivide or submeter product-family and model-specific processes wherever technically feasible before allocation."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_physical_causality
    applies_to: "Residual shared loads"
    rule: "Allocate residual shared loads using a documented physical causal driver such as machine time, test time, processed mass or metered energy; do not use revenue unless physical causality is demonstrably unavailable and the sensitivity is disclosed."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_scrap
    applies_to: "Metal scrap and other recoverable outputs"
    rule: "Report scrap as a waste output at the factory boundary. Do not credit avoided primary material production inside this foreground inventory; any recycling treatment or substitution credit belongs to a separately declared downstream model."
    source_ids:
      - eu-2021-2279-pef
  - rule_id: allocation_rejects_rework
    applies_to: "Rejected units and rework"
    rule: "Attribute material and energy for rework and production rejects to accepted output over the declared reporting period; disclose exceptional prototype or catastrophic-failure exclusions."
    source_ids:
      - eu-2021-2279-pef
