allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable engine models, lines, or process steps"
    rule: "First subdivide meters, batches, lines, test cells, rework, and waste records wherever technically feasible."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: allocation_physical
    applies_to: "unavoidable shared burdens"
    rule: "When subdivision is not feasible, allocate using a causal physical driver such as machine time, test duration, metered energy, processed mass, or engine count; document the driver and calculation."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: allocation_recycling
    applies_to: "metal scrap and recovered materials"
    rule: "Record scrap as a waste output at the foreground boundary and apply the chosen downstream recycling method consistently outside this inventory; do not subtract avoided primary production from foreground input quantities."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: allocation_test_sampling
    applies_to: "sampled acceptance tests"
    rule: "Allocate sampled-test fuel, electricity, and emissions across the exact production lot represented by the sampling plan, preserving rejected-engine and retest burdens."
    source_ids:
      - rouhento-2018-diesel-engine-lca
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_manufacturing"
      flow_role: "metal feedstocks"
      record_type: "purchase, stock, recipe, and scrap records"
      raw_fields: "material grade; opening stock; receipts; closing stock; scrap; engine model; conforming output mass"
      collection_method: "Reconcile material ledger to production orders and weigh representative components"
      unit: "kg"
      frequency: "monthly or batch"
      temporal_coverage: "At least 12 representative months or full campaign"
      site_scope: "All included component areas"
      aggregation_rule: "Sum net material by grade and divide by conforming reference-product mass"
      quality_evidence: "invoices; stock ledger; scales; bill of material; reconciliation"
    - protocol_id: cp_machining_consumables
      process_id: "component_manufacturing"
      flow_role: "cutting fluid"
      record_type: "issue and tank inventory records"
      raw_fields: "product; concentration; opening inventory; additions; closing inventory; recovered quantity"
      collection_method: "Reconcile purchased make-up and tank inventory; exclude internal recirculation"
      unit: "kg"
      frequency: "batch or monthly"
      temporal_coverage: "Same period as production"
      site_scope: "Included machining systems"
      aggregation_rule: "Net make-up divided by conforming output mass"
      quality_evidence: "purchase records; tank logs; concentration tests"
    - protocol_id: cp_energy_water
      process_id: "component_manufacturing_assembly_and_finishing"
      flow_role: "electricity, heat, and process water"
      record_type: "meters and invoices"
      raw_fields: "meter id; start/end reading; unit; time; area; allocation driver; production mass"
      collection_method: "Read calibrated submeters; use invoices only with documented allocation"
      unit: "MJ; kg"
      frequency: "shift, batch, or monthly"
      temporal_coverage: "Same representative period for numerator and output"
      site_scope: "All included production and auxiliary areas"
      aggregation_rule: "Sum by process, convert units, subtract documented non-engine loads, normalize by output mass"
      quality_evidence: "meter calibration; invoices; allocation worksheet"
    - protocol_id: cp_manufacturing_wastes
      process_id: "component_manufacturing"
      flow_role: "segregated scrap and spent cutting oil"
      record_type: "scales and waste manifests"
      raw_fields: "waste identity; mass; date; origin; destination; recovery or treatment route"
      collection_method: "Weigh each outbound waste stream and reconcile storage change"
      unit: "kg"
      frequency: "shipment and monthly"
      temporal_coverage: "Same period as production"
      site_scope: "Included component areas"
      aggregation_rule: "Outbound plus closing inventory minus opening inventory, normalized by output mass"
      quality_evidence: "weighbridge tickets; manifests; waste-store ledger"
    - protocol_id: cp_finishing_materials
      process_id: "assembly_and_finishing"
      flow_role: "detergent, coating, and rust-preventive oil"
      record_type: "issue, return, and formulation records"
      raw_fields: "product; issued mass; returned mass; concentration; solids fraction; engine family"
      collection_method: "Reconcile line issues and returns; record water separately"
      unit: "kg"
      frequency: "batch or monthly"
      temporal_coverage: "Same period as production"
      site_scope: "Included washing and coating lines"
      aggregation_rule: "Net issued product divided by conforming output mass"
      quality_evidence: "formulation sheet; issue logs; purchase records"
    - protocol_id: cp_fluid_filling
      process_id: "assembly_and_finishing"
      flow_role: "lubricating oil and coolant"
      record_type: "fill-station meters and inventory"
      raw_fields: "fluid identity; formulation; concentration; fill; recovery; top-up; engine serial"
      collection_method: "Meter new fluid crossing the boundary and exclude closed-loop inventory"
      unit: "kg"
      frequency: "engine or batch"
      temporal_coverage: "Same period as production"
      site_scope: "Included fill and test circuits"
      aggregation_rule: "Net new fluid divided by conforming output mass"
      quality_evidence: "calibrated dispenser; serial records; inventory reconciliation"
    - protocol_id: cp_finishing_wastes
      process_id: "assembly_and_finishing"
      flow_role: "oily wastewater and waste paint"
      record_type: "effluent meters, sampling, scales, and manifests"
      raw_fields: "mass or volume; density; oil concentration; paint residue mass; destination"
      collection_method: "Meter discharge and weigh residues; reconcile holding-tank inventory"
      unit: "kg"
      frequency: "discharge or shipment"
      temporal_coverage: "Same period as production"
      site_scope: "Included washing and finishing areas"
      aggregation_rule: "Net boundary output divided by conforming output mass"
      quality_evidence: "meter calibration; laboratory report; manifest; tank ledger"
    - protocol_id: cp_acceptance_test
      process_id: "factory_acceptance_test"
      flow_role: "test fuel and electricity"
      record_type: "test-cell meters and logs"
      raw_fields: "engine serial; model; cycle; duration; fuel readings; electricity readings; lot represented"
      collection_method: "Link calibrated meters to each test and sampling plan"
      unit: "kg; MJ"
      frequency: "each test"
      temporal_coverage: "Same period as represented production"
      site_scope: "All included test cells and auxiliaries"
      aggregation_rule: "Sum tests, include retests, allocate over represented lot, normalize by output mass"
      quality_evidence: "test log; meter calibration; sampling plan"
    - protocol_id: cp_reference_product
      process_id: "factory_acceptance_test"
      flow_role: "conforming engine output"
      record_type: "production and weighing records"
      raw_fields: "engine serial; dry or wet state; included accessories; measured mass; conformity status"
      collection_method: "Weigh conforming engines and reconcile production count"
      unit: "kg"
      frequency: "each model or representative batch"
      temporal_coverage: "Same period as inventory"
      site_scope: "Manufacturer gate"
      aggregation_rule: "Sum conforming engine mass; exclude rejected output but retain its burdens"
      quality_evidence: "calibrated scale; bill of material; conformity record"
    - protocol_id: cp_test_emissions
      process_id: "factory_acceptance_test"
      flow_role: "exhaust emissions"
      record_type: "analyzer and particulate measurement files"
      raw_fields: "engine serial; cycle; pollutant; concentration or mass; exhaust flow; detection limit; calibration; lot represented"
      collection_method: "Integrate calibrated measurements over each test cycle and link to the sampling plan"
      unit: "kg"
      frequency: "each measured test"
      temporal_coverage: "Same period as represented production"
      site_scope: "Test-cell exhaust boundary"
      aggregation_rule: "Sum measured mass including retests, allocate over represented lot, normalize by output mass"
      quality_evidence: "raw analyzer file; filter record; calibration; test report"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every exchange"
      rule: "normalized exchange = period exchange / conforming complete-engine mass for the identical period and declared mass state"
      inputs:
        - "period exchange"
        - "conforming engine mass"
      output: "kg, MJ, or kg emission per kg reference product"
      source_ids:
        - jrc-2025-ef-method-key-aspects
    - id: calc_electricity_conversion
      applies_to: "electricity"
      rule: "electricity_MJ = metered_kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids:
        - jrc-2025-ef-method-key-aspects
    - id: calc_stock_reconciliation
      applies_to: "materials, chemicals, fluids, and stored wastes"
      rule: "boundary amount = purchases or generation + opening inventory - closing inventory - documented recoverable return"
      inputs:
        - invoices
        - "opening and closing stock"
        - returns
      output: "net boundary mass"
      source_ids:
        - jrc-2025-ef-method-key-aspects
    - id: calc_test_allocation
      applies_to: "sampled acceptance test"
      rule: "allocated test amount = total included test amount / total conforming engine mass represented by the documented sampling plan"
      inputs:
        - "test totals"
        - "represented lot"
        - "output mass"
      output: "test exchange per kg engine"
      source_ids:
        - rouhento-2018-diesel-engine-lca
    - id: calc_exhaust_mass
      applies_to: "gaseous and particulate exhaust"
      rule: "integrate validated analyzer or filter mass over the test cycle; if concentration and exhaust flow are used, preserve time alignment, dry/wet correction, and reference conditions"
      inputs:
        - "calibrated measurement series"
        - "exhaust flow"
        - "cycle duration"
      output: "pollutant mass per represented production lot"
      source_ids:
        - eu-reg-582-2011-consolidated-2021
  data_quality_requirements:
    - id: dq_temporal_alignment
      applies_to: "all foreground exchanges"
      requirement: "Numerators and conforming engine output shall cover the same representative period; disclose shutdowns, ramp-up, and abnormal production."
      evidence: "dated records and period reconciliation"
    - id: dq_technology_geography
      applies_to: "all inputs and processes"
      requirement: "Declare engine family, manufacturing technology, site geography, supplier geography where known, and upstream dataset representativeness."
      evidence: "dataset metadata and supplier records"
    - id: dq_meter_traceability
      applies_to: "metered energy, water, fluids, and emissions"
      requirement: "Identify meters and analyzers, calibration status, resolution, missing-data treatment, and allocation to included equipment."
      evidence: "calibration certificates and raw logs"
    - id: dq_mass_balance
      applies_to: "materials and wastes"
      requirement: "Reconcile material inputs, product incorporation, stock change, scrap, waste, and documented losses; investigate material discrepancies."
      evidence: "signed mass-balance worksheet"
    - id: dq_cutoff_disclosure
      applies_to: "all exchanges"
      requirement: "Avoid cut-offs; any unquantified input or output requires identity, reason, expected direction of bias, and improvement plan."
      evidence: "data-gap register"
    - id: dq_verification
      applies_to: "complete data package"
      requirement: "An independent reviewer shall trace sampled values from published normalized exchanges back to raw records and calculations."
      evidence: "verification log and sampled audit trail"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference product"
    rule: "The product shall be a new complete CPC 43123 compression-ignition piston engine for non-rail vehicle propulsion, with all required qualifiers declared."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_reference_mass
    applies_to: "reference flow"
    rule: "The output reference_engine_output shall equal 1 kg after normalization and use the same declared dry or wet state as every denominator."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: validation_inventory_atomicity
    applies_to: "process inventory"
    rule: "Every exchange shall represent one atomic material, chemical, energy, waste, or emission flow; combined utilities, fuels, wastes, or emission groups are nonconforming."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: validation_boundary_completeness
    applies_to: "system boundary"
    rule: "All producer-controlled and outsourced manufacturing stages shall be included or explicitly disclosed with upstream links and quantified data gaps."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: validation_test_traceability
    applies_to: "factory acceptance test"
    rule: "Fuel, electricity, emission measurements, sampling plan, retests, and represented production mass shall reconcile by engine serial or lot."
    source_ids:
      - eu-reg-582-2011-consolidated-2021
  - rule_id: validation_allocation
    applies_to: "shared burdens"
    rule: "Subdivision attempts, chosen physical driver, allocation calculation, and sensitivity to material alternatives shall be documented."
    source_ids:
      - jrc-2025-ef-method-key-aspects
  - rule_id: validation_no_unverified_ranges
    applies_to: "all exchanges"
    rule: "Site-specific collection remains mandatory unless a reviewed range with compatible boundary, functional unit, product state, and at least two independent original sources is added later."
    source_ids:
      - jrc-2025-ef-method-key-aspects
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for one declared compression-ignition vehicle-engine family and manufacturing configuration"
  downstream_use: "Projection to Tiangong flow, process, and lifecyclemodel records and connection to upstream material and energy datasets"
  allowed_use: "Manufacturer-gate comparisons and downstream vehicle models when reference state, engine specification, geography, technology, time, and boundary are compatible"
  excluded_use: "Direct representation of stationary, rail, aircraft, marine, spark-ignition, remanufactured, use-phase, maintenance, or end-of-life systems"
  required_metadata: "PCR id and version; engine family and model; displacement; rated power and speed; emission stage and market; dry or wet state; included accessories and aftertreatment; site geography; reference period; process ownership; upstream datasets; test sampling; allocation"
  required_quality_disclosure: "Primary-data share; meter and analyzer calibration; temporal coverage; data gaps; cut-offs; mass-balance closure; allocation; upstream representativeness; uncertainty and verification status"
  update_trigger: "Material change in engine design, mass state, emission stage, manufacturing route, site, supplier mix, energy mix, test practice, allocation, or a data source outside the declared validity period"
