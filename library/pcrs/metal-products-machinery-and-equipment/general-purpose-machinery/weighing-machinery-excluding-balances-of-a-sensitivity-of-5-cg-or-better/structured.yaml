allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared foreground operations"
    rule: "Prefer subdivision, dedicated meters, batch records, and direct assignment of material, energy, waste, and emissions before applying allocation."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "unavoidable shared fabrication, cleaning, assembly, calibration, or packaging burdens"
    rule: "Use the physical driver causing the burden: machine time for equipment electricity, metered volume for gases, bath throughput for cleaning, and measured mass for material handling. Document the driver and test the effect of material alternatives."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "scrap steel and waste alkaline liquor"
    rule: "Report each waste output where it leaves the foreground process. Do not subtract an avoided primary-material credit inside the foreground inventory; model downstream recovery consistently with the study goal."
    source_ids: []
  - rule_id: allocation_no_sales_default
    applies_to: "complete weighing machinery variants"
    rule: "Do not use revenue as the default allocator across models with different capacity, architecture, or accuracy. If physical allocation is infeasible, disclose the economic period and provide sensitivity results."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "component_fabrication"
      flow_role: "steel input and scrap output"
      record_type: "purchase, stock, production, and waste-dispatch records"
      raw_fields: "material identity; grade; opening stock; receipts; returns; closing stock; conforming transfer mass; scrap opening stock; scrap dispatch; scrap closing stock"
      collection_method: "reconcile signed inventory records to calibrated scales and fabrication batches"
      unit: "kg"
      frequency: "each receipt and dispatch; monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "all site operations producing covered metal components"
      aggregation_rule: "calculate net consumption and scrap generation for the same period; allocate only after reconciliation"
      quality_evidence: "scale calibration; purchase and dispatch documents; stock count; batch genealogy"
    - protocol_id: cp_energy_and_gas_meters
      process_id: "component_fabrication"
      flow_role: "fabrication electricity, natural gas, and industrial oxygen"
      record_type: "utility meter, submeter, cylinder, bulk delivery, and operating records"
      raw_fields: "opening and closing readings; deliveries; meter factor; reference conditions; purity; equipment; operating time; downtime; allocated output"
      collection_method: "use calibrated submeters where available; otherwise reconcile site totals and documented equipment drivers"
      unit: "MJ for electricity; m3 for gases"
      frequency: "continuous or per batch; monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "fabrication equipment and directly attributable auxiliaries"
      aggregation_rule: "subtract unrelated and idle loads, apply documented physical allocation, then normalize"
      quality_evidence: "meter calibration; invoices; delivery tickets; operating logs; allocation worksheet"
    - protocol_id: cp_direct_combustion_emissions
      process_id: "component_fabrication"
      flow_role: "fossil carbon dioxide"
      record_type: "fuel meter and reviewed factor calculation record"
      raw_fields: "fuel volume; reference conditions; gas composition or factor; factor unit; oxidation assumption; factor source; calculated emission"
      collection_method: "calculate from reconciled foreground fuel use using an applicable reviewed factor"
      unit: "kg"
      frequency: "each reporting period"
      temporal_coverage: "same period as fuel inventory"
      site_scope: "foreground combustion equipment only"
      aggregation_rule: "sum source-specific emissions and divide by conforming output mass"
      quality_evidence: "fuel reconciliation; factor source; calculation review"
    - protocol_id: cp_alkaline_cleaning_batches
      process_id: "alkaline_parts_cleaning"
      flow_role: "water, sodium hydroxide, electricity, and waste alkaline liquor"
      record_type: "bath make-up, replenishment, meter, maintenance, and waste-transfer records"
      raw_fields: "batch id; water charge; sodium hydroxide mass and concentration; electricity; parts throughput; bath life; removed liquor mass; composition; destination"
      collection_method: "reconcile batch sheets, chemical issues, submeters, stored waste, and transfer documents"
      unit: "kg for materials and waste; MJ for electricity"
      frequency: "each bath make-up, replenishment, and discharge"
      temporal_coverage: "all batches in the representative period"
      site_scope: "cleaning equipment treating covered components"
      aggregation_rule: "aggregate covered batches; allocate by cleaned-parts mass only when direct assignment is unavailable"
      quality_evidence: "batch sheets; meter checks; chemical certificates; waste manifest; mass-balance review"
    - protocol_id: cp_assembly_and_packaging_records
      process_id: "assembly_calibration_packaging"
      flow_role: "electronic control assembly, electricity, corrugated boxes, and conforming output"
      record_type: "bill of materials, stock, submeter, test, packaging, and release records"
      raw_fields: "model; serial or batch id; controller mass and quantity; box mass and quantity; electricity; test duration; rejects; rework; net output mass"
      collection_method: "reconcile issued components and packaging with release records and submetered or engineering energy records"
      unit: "kg and MJ"
      frequency: "per batch or production order; monthly reconciliation"
      temporal_coverage: "at least 12 consecutive representative months or the full production campaign"
      site_scope: "covered final assembly, factory calibration, testing, and packaging"
      aggregation_rule: "include rework burden; exclude nonconforming output from denominator; normalize by released net product mass"
      quality_evidence: "approved bill of materials; supplier declarations; meter records; calibration and test result; release record"
  calculation_rules:
    - id: calc_period_normalization
      applies_to: "every collected inventory row except the fixed reference output"
      rule: "normalized amount = reconciled quantity attributable to covered conforming products / net mass of covered conforming products released in the same period"
      inputs:
        - "reconciled row quantity"
        - "allocated share when needed"
        - "released net product mass"
      output: "row amount per 1 kg reference flow"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity rows recorded in kWh"
      rule: "electricity in MJ = measured electricity in kWh × 3.6"
      inputs:
        - "electricity meter reading in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_stock_balance
      applies_to: "purchased materials, components, chemicals, and packaging"
      rule: "consumption = opening stock + receipts - returns - closing stock, adjusted for documented transfers and count corrections"
      inputs:
        - "signed stock and receipt fields"
      output: "consumed mass in kg"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "carbon_dioxide_fossil_output"
      rule: "fossil CO2 = reconciled natural-gas quantity × applicable reviewed carbon or emission factor × declared oxidation adjustment where the factor does not already include oxidation"
      inputs:
        - "natural-gas record"
        - factor
        - "factor units"
        - "oxidation treatment"
      output: "kg fossil CO2 per reporting period and per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve model or family, architecture, automatic or non-automatic mode, rated capacity range, interval or verification interval, accuracy class where applicable, intended application, net mass, and accessories."
      evidence: "product specification; bill of materials; type or conformity documentation; release record"
    - id: dq_temporal_representativeness
      applies_to: "all foreground rows"
      requirement: "Use one common representative period of at least 12 consecutive months unless the full campaign is shorter; explain shutdowns, abnormal batches, missing data, and substitutions."
      evidence: "dated meter, stock, production, and waste records"
    - id: dq_mass_completeness
      applies_to: "material, component, packaging, product, and waste rows"
      requirement: "Reconcile opening stock, receipts, returns, transfers, conforming output, nonconforming output, waste, and closing stock; investigate imbalances before release."
      evidence: "signed mass-balance worksheet and source documents"
    - id: dq_route_completeness
      applies_to: "conditional processes and rows"
      requirement: "Mark each conditional process or row applicable or not applicable and retain evidence; do not silently omit outsourced finishing, additional packaging, another fuel, another chemical, another waste stream, or a direct emission."
      evidence: "route declaration; process map; supplier and site records"
    - id: dq_meter_quality
      applies_to: "electricity and gas rows"
      requirement: "Record meter identity, reading dates, calibration or verification status, reference conditions for volume, estimation method, and uncertainty or limitation."
      evidence: "meter certificate; invoice; reading log; estimation review"
validation_rules:
  - rule_id: validate_identity_and_exclusion
    applies_to: "reference product"
    rule: "Confirm that the output is a complete weighing machine within CPC 43922 and is not a balance with sensitivity of 5 cg or better, a standalone weight, or a separately sold part."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_metrological_qualifiers
    applies_to: "reference product metadata"
    rule: "Require automation mode, minimum and maximum capacity, scale or verification interval, accuracy class when applicable, load-receptor type, electrical supply, and intended product or application; flag comparisons with incompatible functions or operating conditions."
    source_ids:
      - oiml-r76-1-2006
      - oiml-r51-1-2006
      - eu-directive-2014-32
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "Confirm that the denominator is released net machine mass and transport packaging is recorded separately; require output amount exactly 1 kg after normalization."
    source_ids: []
  - rule_id: validate_inventory_accounting
    applies_to: "foreground inventory"
    rule: "Verify same-period stock reconciliation, mass balance, utility reconciliation, included rework, excluded nonconforming output from the denominator, and an explicit applicability decision for every conditional row."
    source_ids: []
  - rule_id: validate_no_double_counting
    applies_to: "outsourced and in-house operations"
    rule: "Confirm that purchased components or treatment services and foreground operations do not represent the same material, energy, waste, or emission twice."
    source_ids: []
  - rule_id: validate_direct_emissions
    applies_to: "carbon_dioxide_fossil_output"
    rule: "Require a direct-combustion source, reconciled fuel quantity, reviewed factor identity and units, and oxidation treatment; reject upstream emissions entered as direct elementary flows."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground product manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate modelling of a declared weighing-machine model or coherent family with compatible function, architecture, capacity, accuracy, factory geography, technology, and production period"
  excluded_use: "Precision balances at or beyond the excluded sensitivity; separately sold parts or weights; use-phase or end-of-life claims; incompatible weighing functions or rated conditions; unrepresented sites or families"
  required_metadata: "PCR id and version; model or family; automation mode; metrological qualifiers; net product mass; accessories; make-or-buy boundary; process applicability; factory geography; technology; period; allocation drivers; upstream datasets; packaging"
  required_quality_disclosure: "foreground and estimated shares; meter and stock coverage; mass-balance result; missing flows; UUID gaps; factor limitations; representativeness; allocation sensitivity; excluded or outsourced operations"
  update_trigger: "material change in architecture, rated function, bill of materials, supplier route, factory process, energy mix, cleaning route, packaging, allocation method, regulation, metrological specification, or representative data period"
