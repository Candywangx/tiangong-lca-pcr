allocation_rules:
  - rule_id: al_subdivide
    applies_to: "multi-product production"
    rule: "Prefer direct metering, bill-of-material tracing and process subdivision by part family and route before allocation."
    source_ids: []
  - rule_id: al_shared_operations
    applies_to: "shared utilities and operations"
    rule: "Allocate unavoidable shared utilities and operations using a documented physical driver that represents causality, such as machine time, metered energy, processed mass or production time; do not default to revenue."
    source_ids: []
  - rule_id: al_scrap
    applies_to: "production scrap"
    rule: "Report scrap as a separate waste output and disclose internal closed-loop return. Do not subtract an avoided-primary-material credit inside the foreground inventory unless the study's declared allocation model requires it."
    source_ids: []
  - rule_id: al_rework
    applies_to: "internal rework"
    rule: "Keep rework energy and material losses inside the foreground system and count only finally accepted output in the reference flow."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_records
      process_id: "part_manufacturing"
      flow_role: "stainless sheet, primary aluminium-alloy sheet and PA6 input"
      record_type: "purchase, warehouse issue and bill-of-material records"
      raw_fields: "part number; material flow row; grade; form; supplier; virgin/recycled state; opening stock; receipts; issues; unchanged returns; closing stock; mass"
      collection_method: "Reconcile material ledger to the declared part and production order"
      unit: "kg"
      frequency: "Each production order; monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign"
      site_scope: "Reporting site and declared part family"
      aggregation_rule: "Sum net issues by atomic material flow, then divide by accepted output mass"
      quality_evidence: "Approved bill of materials; supplier certificate; calibrated scale records; stock reconciliation"
    - protocol_id: cp_utility_records
      process_id: "part_manufacturing"
      flow_role: "electricity, process water and cleaning wastewater"
      record_type: "meters, invoices and water balance"
      raw_fields: "meter id; opening/closing reading; unit; process allocation; recirculation; evaporation; wastewater discharge"
      collection_method: "Read dedicated meters where available; otherwise document a causal allocation and water balance"
      unit: "MJ for electricity; kg for water"
      frequency: "Monthly and at route change"
      temporal_coverage: "Same period as product output"
      site_scope: "Reporting site; included equipment and shared-load boundary declared"
      aggregation_rule: "Convert units, subtract excluded loads, and normalize to accepted output mass"
      quality_evidence: "Meter calibration; invoice reconciliation; allocation worksheet; water-balance closure"
    - protocol_id: cp_welding_records
      process_id: "part_manufacturing"
      flow_role: "solid wire, carbon dioxide input and direct carbon dioxide release"
      record_type: "issue, cylinder and capture records"
      raw_fields: "wire issue/return mass; cylinder deliveries/returns; opening/closing gas stock; gas composition; captured gas"
      collection_method: "Reconcile consumable issues and cylinder inventory to welding orders"
      unit: "kg"
      frequency: "Each welding order; monthly reconciliation"
      temporal_coverage: "Same period as welded product output"
      site_scope: "Reporting site and declared welding cells"
      aggregation_rule: "Net wire issue and gas consumption divided by accepted output; direct release by calc_co2_release"
      quality_evidence: "Supplier delivery records; inventory reconciliation; gas composition; capture meter if used"
    - protocol_id: cp_product_output_records
      process_id: "part_manufacturing"
      flow_role: "accepted finished part"
      record_type: "production and inspection records"
      raw_fields: "part number; drawing revision; produced count; accepted count; rejected count; net unit mass; total accepted mass"
      collection_method: "Weigh representative units or production lots and reconcile to inspection release"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Full reporting period"
      site_scope: "Reporting site and declared part"
      aggregation_rule: "Sum accepted unpackaged mass only"
      quality_evidence: "Calibrated scale; inspection release; nonconformance log"
    - protocol_id: cp_waste_records
      process_id: "part_manufacturing"
      flow_role: "stainless scrap, aluminium scrap, PA6 scrap and spent coolant"
      record_type: "waste container, transfer and treatment records"
      raw_fields: "waste row; material grade; gross/tare mass; internal return; destination; treatment route; date"
      collection_method: "Weigh segregated waste or use verified transfer-document mass"
      unit: "kg"
      frequency: "Each shipment; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Reporting site"
      aggregation_rule: "Sum external waste by atomic flow net of documented internal return, then normalize"
      quality_evidence: "Scale calibration; transfer note; waste classification; recycler receipt"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "normalized amount = period flow amount / period accepted finished unpackaged product mass"
      inputs:
        - "period atomic flow amount"
        - "accepted output mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity
      applies_to: "electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_cleaning_wastewater
      applies_to: "cleaning wastewater"
      rule: "wastewater mass = process-water input + water in cleaning solutions − measured evaporation − retained water − internally recirculated water"
      inputs:
        - "water input"
        - "solution water"
        - evaporation
        - retention
        - recirculation
      output: "cleaning wastewater in kg"
      source_ids: []
    - id: calc_co2_release
      applies_to: "shielding carbon dioxide"
      rule: "direct fossil CO2 release = net purchased CO2 consumption − measured capture − documented return"
      inputs:
        - deliveries
        - "opening/closing inventory"
        - returns
        - "captured gas"
      output: "fossil CO2 to air in kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Preserve part number, drawing revision, equipment family, acceptance specification and unit mass for every aggregated product family."
      evidence: "Drawing control and inspection-release records"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile atomic material inputs, accepted output, rejects, scrap, internal returns and stock change; explain material mass-balance gaps."
      evidence: "Signed reconciliation worksheet and inventory records"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one consistent representative period and document shutdowns, trials, abnormal batches and route changes."
      evidence: "Reporting-period register and production log"
    - id: dq_technology
      applies_to: "route-specific exchanges"
      requirement: "Identify actual forming, machining, moulding, joining, cleaning and finishing technologies and mark non-applicable atomic rows explicitly."
      evidence: "Route sheet, equipment list and process-flow review"
    - id: dq_uuid
      applies_to: "unresolved identities"
      requirement: "Retain semantic flow names and do not substitute proxy UUIDs for the unresolved reference product, stainless sheet, solid welding wire, stainless scrap or PA6 scrap."
      evidence: "UUID review metadata and finalized search receipts"
validation_rules:
  - rule_id: val_reference_flow
    applies_to: "reference product"
    rule: "Confirm that exactly 1 kg of accepted, unpackaged finished output is the reference flow and that product qualifiers are complete."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: val_atomic_rows
    applies_to: "inventory"
    rule: "Reject combined material, utility, waste or emission labels; each reported exchange shall retain one physical or chemical identity."
    source_ids: []
  - rule_id: val_route_consistency
    applies_to: "conditional flows"
    rule: "Confirm that each material, welding, water, waste and direct-emission row is used only when its declared route applies and is otherwise explicitly not applicable."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "material conversion"
    rule: "Reconcile net material inputs with accepted product, wastes, internal returns and stock changes; investigate unexplained gaps before publication."
    source_ids: []
  - rule_id: val_no_double_count
    applies_to: "energy and emissions"
    rule: "Exclude upstream electricity emissions from direct elementary outputs and do not count internally recirculated water, regrind or scrap as a second external input or output."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after methodological review and representative aggregation"
  downstream_use: "Cradle-to-factory-gate modelling of declared CPC 43944 machinery parts in equipment manufacture, maintenance or replacement-part supply chains"
