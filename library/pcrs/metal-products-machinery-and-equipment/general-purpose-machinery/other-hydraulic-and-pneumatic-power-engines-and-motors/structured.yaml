allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "separable products, lines, and test routes"
    rule: "Avoid allocation by subdividing routes, product families, batches, meters, and test rigs whenever records permit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_shared_energy
    applies_to: "shared assembly and test electricity"
    rule: "If subdivision or direct metering is impossible, allocate with a documented physical driver such as measured machine energy, test-rig time, or accepted throughput and justify the driver."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework
    applies_to: "rejected and reworked units"
    rule: "Attribute traceable rework to the accepted configuration; allocate untraceable shared rework with the originating operation's physical driver and disclose rejection rates."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_waste_credit
    applies_to: "spent fluid and component scrap"
    rule: "Record waste and treatment links without avoided-production credit inside this factory-gate package; use substitution or system expansion only in an explicitly expanded study."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "motor_assembly_and_test"
      flow_role: "housing, shaft, rotor, seal, bearing inputs"
      record_type: "approved BOM and issue-return records"
      raw_fields: "configuration; component; material; issued count; unit mass; returned count; accepted units"
      collection_method: "reconcile BOM with stores issues and returns; verify unit mass"
      unit: "kg"
      frequency: "each configuration and lot"
      temporal_coverage: "production representative period"
      site_scope: "assembly site"
      aggregation_rule: "sum net mass by atomic row and divide by accepted units"
      quality_evidence: "BOM revision; ledger; weighing or supplier record"
    - protocol_id: cp_energy_meter
      process_id: "motor_assembly_and_test"
      flow_role: "electricity"
      record_type: "calibrated meter log"
      raw_fields: "meter id; start; end; multiplier; coverage; allocation driver; accepted units"
      collection_method: "calculate consumption, exclude uncovered loads, document allocation"
      unit: "kWh or MJ"
      frequency: "continuous or campaign"
      temporal_coverage: "at least one representative year or disclosed shorter campaign"
      site_scope: "assembly and test site"
      aggregation_rule: "convert to MJ and divide allocated energy by accepted units"
      quality_evidence: "calibration; meter export; schedule; worksheet"
    - protocol_id: cp_hydraulic_test_fluid
      process_id: "motor_assembly_and_test"
      flow_role: "hydraulic test-fluid input"
      record_type: "issue, return, and retained-fill records"
      raw_fields: "grade; issue mass; reusable return; retained mass; temperature; density"
      collection_method: "reconcile net fluid crossing the boundary"
      unit: "kg"
      frequency: "hydraulic campaign"
      temporal_coverage: "hydraulic representative period"
      site_scope: "hydraulic test rig and store"
      aggregation_rule: "net issue divided by accepted hydraulic motors"
      quality_evidence: "ledger; scale; density certificate; test log"
    - protocol_id: cp_compressed_air_meter
      process_id: "motor_assembly_and_test"
      flow_role: "compressed test air"
      record_type: "test-rig flowmeter log"
      raw_fields: "volume; pressure; temperature; humidity or base condition; accepted units"
      collection_method: "integrate delivered volume and normalize to one condition"
      unit: "m3"
      frequency: "pneumatic campaign"
      temporal_coverage: "pneumatic representative period"
      site_scope: "pneumatic test rig"
      aggregation_rule: "normalized volume divided by accepted pneumatic motors"
      quality_evidence: "calibration; test log; calculation"
    - protocol_id: cp_accepted_units
      process_id: "motor_assembly_and_test"
      flow_role: "reference product"
      record_type: "acceptance record"
      raw_fields: "serial or lot; configuration; result; rework; time"
      collection_method: "count only complete passing units"
      unit: "Item(s)"
      frequency: "each unit or lot"
      temporal_coverage: "same period as inputs"
      site_scope: "assembly site"
      aggregation_rule: "accepted count is the denominator"
      quality_evidence: "signed acceptance and rework logs"
    - protocol_id: cp_spent_hydraulic_fluid
      process_id: "motor_assembly_and_test"
      flow_role: "spent hydraulic fluid"
      record_type: "waste consignment and mass balance"
      raw_fields: "waste mass; grade; issue; return; retention; spill; consignment"
      collection_method: "weigh dispatch or reconcile balance and investigate loss"
      unit: "kg"
      frequency: "dispatch and campaign"
      temporal_coverage: "hydraulic representative period"
      site_scope: "test rig and waste store"
      aggregation_rule: "waste mass divided by accepted hydraulic motors"
      quality_evidence: "consignment; scale; signed balance"
  calculation_rules:
    - id: calc_normalize_per_accepted_unit
      applies_to: "every row"
      rule: "normalized amount = attributable foreground amount / accepted motor count"
      inputs:
        - "attributable amount"
        - "accepted count"
      output: "amount per accepted motor"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_electricity_conversion
      applies_to: "electricity"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - "metered kWh"
      output: "electricity MJ"
      source_ids: []
    - id: calc_component_net_issue
      applies_to: "component inputs"
      rule: "mass = issued count × unit mass − returned count × unit mass"
      inputs:
        - counts
        - "unit mass"
      output: "net component kg"
      source_ids: []
    - id: calc_hydraulic_fluid_balance
      applies_to: "hydraulic input and waste"
      rule: "net fluid = issue − reusable return; reconcile with retained fill, waste, spill, and stock change"
      inputs:
        - issue
        - return
        - retention
        - waste
        - spill
        - stock
      output: "input and waste kg per motor"
      source_ids: []
    - id: calc_compressed_air_reference
      applies_to: "compressed air"
      rule: "convert measured volume to one declared pressure, temperature, and humidity basis; never mix incompatible conditions"
      inputs:
        - volume
        - pressure
        - temperature
        - humidity
      output: "m3 at reference conditions per motor"
      source_ids:
        - festo-drrd-1395606-2026
  data_quality_requirements:
    - id: dq_completeness
      applies_to: "all foreground rows"
      requirement: "Reconcile the full period, including rejected and reworked units, and explain every omission."
      evidence: "period reconciliation and cut-off register"
    - id: dq_technology
      applies_to: "product and route"
      requirement: "Match principle, medium, pressure, displacement or angle, torque, speed, duty, and test technology."
      evidence: "product specification and test plan"
    - id: dq_geography
      applies_to: "site and upstream links"
      requirement: "State the site, match supplier geography where possible, and document proxies."
      evidence: "site and supplier records; selection log"
    - id: dq_time
      applies_to: "all activity data"
      requirement: "Use one representative period and disclose abnormal operations and mix changes."
      evidence: "meter logs; production ledger; statement"
    - id: dq_precision
      applies_to: "meters and mass records"
      requirement: "Retain calibration, resolution, conversions, and data-limit notes."
      evidence: "certificates; raw exports; workbook"
    - id: dq_consistency
      applies_to: "normalization and allocation"
      requirement: "Use one accepted-unit denominator, one air reference condition, and one allocation method."
      evidence: "calculation audit and review"
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category"
    rule: "The product shall be a complete CPC 43219 non-linear hydraulic or pneumatic motor or actuator, not a CPC 43211 linear cylinder or excluded product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference
    applies_to: "reference flow"
    rule: "Output shall equal exactly 1 accepted Item(s), with all required product, performance, life, geography, technology, and state qualifiers."
    source_ids:
      - danfoss-orbital-motors-2021
      - festo-drrd-1395606-2026
  - rule_id: validate_atomic_inventory
    applies_to: "inventory"
    rule: "Every exchange shall be atomic; hydraulic fluid and compressed air remain separate, and UUID-empty rows remain explicitly unresolved."
    source_ids: []
  - rule_id: validate_route
    applies_to: "test media"
    rule: "A hydraulic dataset includes or justifies zero hydraulic fluid and marks compressed air non-applicable; a pneumatic dataset does the converse unless both are separately metered."
    source_ids:
      - danfoss-orbital-motors-2021
      - festo-drrd-1395606-2026
  - rule_id: validate_balance
    applies_to: "units, components, fluid"
    rule: "Reconcile accepted counts, component net issues, and hydraulic-fluid issue-return-retention-waste balance or document investigated residuals."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "electricity"
    rule: "Meter coverage, conversion, allocation, and accepted-unit normalization shall be reproducible."
    source_ids: []
  - rule_id: validate_boundary_allocation
    applies_to: "boundary and allocation"
    rule: "Disclose the starting condition, upstream links, exclusions, allocation hierarchy, and system expansion consistently."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_bilingual_alignment
    applies_to: "bilingual use"
    rule: "English and Chinese process ids, row ids, UUIDs, ordered rule ids, functional unit, rows, and source ids shall align."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configuration-specific foreground dataset for assembly and factory acceptance testing of one complete CPC 43219 motor"
  downstream_use: "TianGong flow, process, lifecyclemodel, and foreground package projections for product footprint or LCA"
  allowed_use: "Factory-gate comparison only when function, performance, life, boundary, route, geography, technology, and allocation are compatible"
  excluded_use: "Direct comparison with linear cylinders, turbines, pumps, compressors, valves, electric motors, incomplete parts, or incompatible boundaries"
  required_metadata: "PCR id; CPC context; manufacturer and model; medium; principle; pressure; displacement or angle; torque; speed; power; efficiency or leakage; duty and life; mass and materials; surface treatment; included functions; site; period; test route; meter coverage; allocation; cut-offs; state"
  required_quality_disclosure: "completeness; rejection and rework; BOM reconciliation; calibration and coverage; air conditions; fluid recirculation and retention; allocation driver; upstream proxies; unresolved UUIDs; absent external ranges"
  update_trigger: "Change in principle, materials, performance class, test route, site, supplier geography, meter boundary, allocation, acceptance criteria, or period"
data_sources:
  - id: "un-cpc-3-0-structure-2025"
