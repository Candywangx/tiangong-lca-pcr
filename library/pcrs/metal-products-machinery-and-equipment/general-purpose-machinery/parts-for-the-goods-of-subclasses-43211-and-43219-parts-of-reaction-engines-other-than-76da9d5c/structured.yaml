allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "mixed part families, alloys, routes, or production lots"
    rule: "Subdivide production by part family, alloy, route, machine cell, or lot and use direct meters, issue records, and time records before allocating shared burdens."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "inseparable shared electricity, fuel, consumables, or waste"
    rule: "When subdivision or direct measurement is not feasible, allocate the shared exchange using the measured causal driver, in descending preference: machine or furnace time adjusted for rated load, treated surface area for surface operations, or conforming product mass. Record the driver and calculation."
    source_ids: []
  - rule_id: allocation_scrap_and_recycling
    applies_to: "metal scrap and recovered cutting oil"
    rule: "Report waste outputs at the foreground boundary without avoided-burden credit. If a downstream study models recycling or recovery benefits, keep that modelling outside this foreground process and disclose the method."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "internal rework before factory-gate release"
    rule: "Keep rework inputs and wastes in the originating lot. Do not create additional conforming product output for the same physical part."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_balance
      process_id: "integrated_part_manufacturing"
      flow_role: "precursor input, conforming output, work in progress, and stock change"
      record_type: "weighbridge, scale, material-issue, routing, and release records"
      raw_fields: "material identity; alloy; precursor mass; finished mass; reject mass; opening and closing stock; lot id; timestamp"
      collection_method: "calibrated weighing and production-record reconciliation"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "complete declared reporting period"
      site_scope: "all in-scope cells and outsourced steps reconciled to the reporting lot"
      aggregation_rule: "sum accepted records by material and lot, reconcile stock change, then divide by conforming finished mass"
      quality_evidence: "calibration status; lot traceability; release record; reconciliation sign-off"
    - protocol_id: cp_utility_and_consumable_records
      process_id: "integrated_part_manufacturing"
      flow_role: "electricity, natural gas, cutting fluid, and direct fossil carbon dioxide"
      record_type: "submeters, supplier meters, issue and return records, and fuel-quality records"
      raw_fields: "meter start and end; meter unit; allocation driver; fluid issue and return; gas reference conditions; carbon content; oxidation fraction; timestamp"
      collection_method: "calibrated meter reading and controlled-stores reconciliation"
      unit: "MJ; m3; kg"
      frequency: "each lot or shift, aggregated monthly at most"
      temporal_coverage: "complete declared reporting period"
      site_scope: "every in-scope cell, furnace, and attributable auxiliary"
      aggregation_rule: "subtract verified returns and opening/closing stocks, allocate only shared meters by the declared causal driver, then normalize"
      quality_evidence: "meter calibration; supplier statement; issue voucher; allocation worksheet"
    - protocol_id: cp_cleaning_bath_records
      process_id: "integrated_part_manufacturing"
      flow_role: "process water, sodium hydroxide, cleaning wastewater, and waste alkaline liquor"
      record_type: "water meter, batch-make-up sheet, bath analysis, discharge meter, and waste-transfer record"
      raw_fields: "water quantity; chemical product mass and concentration; bath volume; bath replacement; wastewater quantity; density; destination; lot id; timestamp"
      collection_method: "meter reading, controlled chemical issue, bath log, and waste-transfer measurement"
      unit: "kg; m3"
      frequency: "each make-up, discharge, or bath change"
      temporal_coverage: "complete declared reporting period"
      site_scope: "all in-scope aqueous-cleaning lines"
      aggregation_rule: "distinguish rinse wastewater from spent bath liquor, reconcile make-up and discharge, then normalize"
      quality_evidence: "meter calibration; chemical certificate; bath log; transfer manifest"
    - protocol_id: cp_waste_dispatch_records
      process_id: "integrated_part_manufacturing"
      flow_role: "segregated metal scrap and waste cutting oil"
      record_type: "container weights, stock records, and transfer manifests"
      raw_fields: "waste identity; material grade; gross and tare mass; stock change; contamination; destination; lot allocation; timestamp"
      collection_method: "calibrated weighing and manifest reconciliation"
      unit: "kg"
      frequency: "each container or dispatch"
      temporal_coverage: "complete declared reporting period"
      site_scope: "all in-scope waste storage and dispatch points"
      aggregation_rule: "subtract tare, include documented stock change, allocate only mixed-lot containers by measured contents or traceable lot records"
      quality_evidence: "scale calibration; photographs or composition record; signed transfer manifest"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = accepted lot amount / net mass of conforming finished parts released from that lot"
      inputs:
        - "accepted exchange amount"
        - "conforming finished-part mass"
      output: "exchange amount per 1 kg conforming finished part"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "each declared alloy route"
      rule: "precursor input + opening work in progress - closing work in progress = conforming finished part + segregated scrap + other recorded material outputs + explained mass difference"
      inputs:
        - precursor
        - product
        - scrap
        - "other material outputs"
        - "and stock-change masses"
      output: "lot mass-balance residual and reconciliation status"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "direct natural-gas combustion"
      rule: "direct fossil CO2 mass = attributable fuel carbon mass × oxidation fraction × 44/12; derive fuel carbon mass from measured gas and the documented supplier composition or carbon factor"
      inputs:
        - "natural-gas quantity"
        - "reference conditions"
        - "supplier carbon content or factor"
        - "oxidation fraction"
      output: "kg direct fossil carbon dioxide"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "reference product and material inputs"
      requirement: "Trace every reported lot to the part family, part or drawing number, revision, alloy specification, precursor form, route, and acceptance record."
      evidence: "routing and release records; material certificate; supplier record"
    - id: dq_temporal_completeness
      applies_to: "all foreground exchanges"
      requirement: "Cover the full declared reporting period and account for shutdown, start-up, rework, and stock changes that affect in-scope production."
      evidence: "meter completeness check; production calendar; stock reconciliation"
    - id: dq_measurement_quality
      applies_to: "meters and scales"
      requirement: "Use calibrated or verified equipment and retain unit, reference conditions, calibration status, and any conversion factors."
      evidence: "calibration certificate; meter specification; conversion worksheet"
    - id: dq_route_specificity
      applies_to: "conditional inventory rows"
      requirement: "Mark every conditional row applicable or not applicable for the declared route and retain evidence for that decision."
      evidence: "process routing; work instruction; bath or furnace log"
    - id: dq_outsourced_operations
      applies_to: "outsourced heat or surface treatment"
      requirement: "Keep the outsourced product flow visible, document whether its burdens are in a supplier dataset, and prevent double counting with on-site rows."
      evidence: "purchase order; supplier process declaration; boundary reconciliation"
validation_rules:
  - rule_id: validation_identity
    applies_to: "product category and reference flow"
    rule: "Reject a data package that does not identify the part family, drawing revision, material specification, precursor form, manufacturing route, surface state, site, period, and factory-gate condition."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_reference_mass
    applies_to: "normalization"
    rule: "Confirm that every reported amount is normalized to 1 kg net mass of conforming finished part and that removable packaging, rejects, and work in progress are not counted as reference output."
    source_ids: []
  - rule_id: validation_atomic_routes
    applies_to: "conditional inventory"
    rule: "Confirm that each applicable material, utility, chemical, waste, and elementary exchange is reported as its own atomic row; no combined utility, material, waste, or emissions category may substitute for a row."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "material flows"
    rule: "Reconcile each material-specific precursor input against conforming product, material-specific scrap, other material outputs, and stock change; investigate and disclose an unexplained residual."
    source_ids: []
  - rule_id: validation_energy_and_emissions
    applies_to: "natural gas and direct fossil carbon dioxide"
    rule: "When natural gas is reported, require its reference conditions and either a corresponding direct fossil carbon-dioxide calculation or an explicit documented reason the combustion occurs outside the foreground boundary."
    source_ids: []
  - rule_id: validation_cleaning_streams
    applies_to: "aqueous cleaning"
    rule: "When alkaline cleaning applies, distinguish process water, sodium-hydroxide product, cleaning wastewater, and spent alkaline liquor and prevent double counting between rinse water and bath replacement."
    source_ids:
      - eu-jrc-stm-bref-2006
  - rule_id: validation_evidence_gaps
    applies_to: "candidate methodology use"
    rule: "Treat missing exact UUIDs and missing independent range evidence as disclosed candidate-methodology limitations; do not silently substitute proxy flows or invented numeric ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production data package for a declared finished engine or motor part"
  downstream_use: "Secondary or background cradle-to-gate datasets for machinery, aerospace, hydraulic, pneumatic, and reaction-engine product systems after scope compatibility is confirmed"
  allowed_use: "Part-specific cradle-to-gate modelling where product identity, material, route, geography, technology, time period, and factory-gate state match the consuming model"
  excluded_use: "Direct representation of complete engines or motors, turbo-jet or turbo-propeller parts, repair or overhaul, generic metal products without part qualifiers, use-stage performance, maintenance, end-of-life, or an externally inferred benchmark range"
  required_metadata: "canonical PCR id; part family; part number and drawing revision; host equipment; material and alloy; precursor state; machining, heat-treatment, cleaning and surface-treatment route; site and geography; production period; reference conditions; allocation drivers; outsourced-operation boundary; UUID gaps"
  required_quality_disclosure: "metering and scale coverage; calibration; lot and material traceability; mass-balance residual; conditional-row applicability; rework; stock change; waste destinations; supplier-data representativeness; unresolved UUID and range-evidence needs"
  update_trigger: "Change in part family, design revision, material or precursor state, manufacturing route, heat or surface treatment, site, energy supply, allocation driver, outsourced boundary, or evidence sufficient to resolve UUID or range gaps"
