allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared foreground operations"
    rule: "Subdivide meters, work centres, test rigs, and production lines where separately measured pump data are available before applying allocation."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "remaining shared energy and consumables"
    rule: "Allocate by a documented physical driver that reflects causality, such as machine time, test duration, processed mass, or metered duty; do not use revenue when a causal physical driver is available."
    source_ids: []
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "steel scrap sent for recycling"
    rule: "Report the scrap mass and treatment route at the point it leaves the foreground boundary. Do not subtract an avoided virgin-material burden inside the core inventory; any recycling credit belongs to an explicitly separate downstream method."
    source_ids:
      - grundfos-magna3-epd-2024
  - rule_id: allocation_rejects
    applies_to: "rejected pumps and reworked components"
    rule: "Assign rework energy and material losses to the production batch that generated them. Pumps that do not become saleable reference output remain rejects or work in process and are excluded from the output denominator."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_receiving
      process_id: "component_preparation_pump_assembly"
      flow_role: "casing, impeller, shaft, motor, bearing, and seal"
      record_type: "BOM, goods receipt, weighing, production completion"
      raw_fields: "part number; revision; supplier; quantity; unit mass; accepted mass; rejected mass; pump model; driver inclusion"
      collection_method: "reconcile controlled BOM to accepted receipts and released pump models; verify high-mass parts by scale"
      unit: "kg and item"
      frequency: "each BOM revision and monthly reconciliation"
      temporal_coverage: "same representative reporting period as output"
      site_scope: "all production sites in declared dataset"
      aggregation_rule: "sum accepted component mass embodied in released pumps, then divide by net released pump mass"
      quality_evidence: "BOM approval, calibration record, receipt ledger, variance investigation"
    - protocol_id: cp_foreground_electricity
      process_id: "component_preparation_pump_assembly_production_testing"
      flow_role: "process electricity"
      record_type: "revenue meter, submeter, machine or test-rig log"
      raw_fields: "opening and closing meter; kWh; process; machine time; test duration; allocation population; recovered electricity"
      collection_method: "use submeters where available; otherwise allocate a reconciled site meter using a causal physical driver"
      unit: "kWh, converted to MJ"
      frequency: "continuous or each shift; aggregate monthly"
      temporal_coverage: "at least 12 consecutive representative months or a justified production campaign"
      site_scope: "reporting factories only"
      aggregation_rule: "subtract separately metered non-production loads and recovered electricity, allocate by process, convert to MJ, divide by net released pump mass"
      quality_evidence: "meter calibration, utility invoice reconciliation, allocation worksheet"
    - protocol_id: cp_scrap_records
      process_id: "component_preparation"
      flow_role: "ferrous scrap for recycling"
      record_type: "calibrated scale ticket and recycler transfer note"
      raw_fields: "waste code; alloy family; gross and tare mass; contamination; destination; transfer date"
      collection_method: "weigh each outbound lot and verify destination against transfer documents"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "same representative reporting period as output"
      site_scope: "reporting factories only"
      aggregation_rule: "sum qualifying ferrous scrap sent to recycling and divide by net released pump mass"
      quality_evidence: "scale calibration, transfer note, recycler acceptance"
    - protocol_id: cp_consumable_records
      process_id: "pump_assembly"
      flow_role: "lubricant"
      record_type: "purchase, issue, stock, and fill record"
      raw_fields: "product code; formulation; opening stock; purchases; closing stock; other uses; measured fill; spills"
      collection_method: "mass balance purchases and inventory; segregate other products and non-pump uses"
      unit: "kg"
      frequency: "monthly and each fill-setting change"
      temporal_coverage: "same representative reporting period as output"
      site_scope: "reporting factories only"
      aggregation_rule: "opening stock plus purchases minus closing stock minus verified other uses, divided by net released pump mass"
      quality_evidence: "inventory reconciliation, fill-equipment calibration, variance review"
    - protocol_id: cp_test_water_balance
      process_id: "production_testing"
      flow_role: "test-water input and wastewater output"
      record_type: "water meter, tank level, discharge meter, laboratory and maintenance record"
      raw_fields: "make-up volume or mass; discharge volume or mass; density; temperature; retained inventory change; spills; treatment route; contamination"
      collection_method: "meter make-up and discharge; reconcile recirculating-loop inventory change; sample when contamination affects treatment identity"
      unit: "kg, with retained volume and density where converted"
      frequency: "each test campaign or continuous; aggregate monthly"
      temporal_coverage: "same representative reporting period as output"
      site_scope: "all production test loops in declared dataset"
      aggregation_rule: "input equals discharge plus inventory change, evaporation or other separately evidenced losses; allocate to accepted pumps by causal test duration or duty"
      quality_evidence: "meter calibration, balance closure, sample result, treatment acceptance"
    - protocol_id: cp_packaging_records
      process_id: "packaging_release"
      flow_role: "corrugated cardboard"
      record_type: "packaging specification, purchase issue, packing and shipment record"
      raw_fields: "packaging code; board grade; unit mass; quantity used; returned packaging; damaged packaging; pump model"
