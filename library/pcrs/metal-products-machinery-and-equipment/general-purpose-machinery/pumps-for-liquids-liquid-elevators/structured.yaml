measurement_rules:
  - id: reference_product_mass
    applies_to: "finished pump reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net finished-pump mass after production testing and before shipment packaging; normalize all inventory exchanges to 1 kg net pump."
  - id: component_mass_conversion
    applies_to: "components recorded by item count"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts to mass only from product-specific BOM or weighing records; retain count, measured or specified unit mass, and conversion evidence."
  - id: electrical_energy_conversion
