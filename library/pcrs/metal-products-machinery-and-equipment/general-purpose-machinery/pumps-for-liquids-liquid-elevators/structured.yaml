validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm the reference output is exactly 1 kg net Pump, shipment packaging is excluded from pump mass, and all required qualifiers are present."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory exchanges"
    rule: "Reject collection labels or combined materials, utilities, wastes, and emissions. Every additional crossing must be represented by its own concrete flow row."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm public state, English and Chinese base names, flow type, classification, property, unit group, and product state remain semantically compatible with the foreground row."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "component preparation through release"
    rule: "Verify component, scrap, reject, work-in-process, net pump, and packaging balances close within the site's documented measurement uncertainty; unresolved residuals require correction or disclosure."
    source_ids: []
  - rule_id: validate_test_basis
    applies_to: "production testing"
    rule: "Verify test medium, test duty, duration, driver energy, water recirculation, and accepted-output denominator are declared. For the regulated clean-water rotodynamic subset, verify the applicable Commission Regulation (EU) No 547/2012 test basis."
    source_ids:
      - eu-water-pump-regulation-547-2012
  - rule_id: validate_use_stage_separation
    applies_to: "downstream lifecycle model"
    rule: "Reject a use-stage result that derives operational electricity from pump mass alone. Require declared efficiency or measured power, duty/load profile, annual operating hours, electricity mix, controls, and service life."
    source_ids:
      - eu-water-pump-regulation-547-2012
      - grundfos-magna3-epd-2024
  - rule_id: validate_unresolved_ranges
    applies_to: "important foreground flows"
    rule: "Treat the absence of independent, boundary-compatible empirical ranges as a review need, not as permission to invent bounds; retain foreground collection requirements until evidence is available."
    source_ids: []
published_dataset_profile:
  dataset_role: "Cradle-to-factory-gate foreground production package for a declared finished pump configuration"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product and project LCAs, supply-chain models, environmental declarations, procurement studies, and comparative work when product boundary, duty, driver inclusion, geography, technology, and data quality are compatible"
  excluded_use: "Direct comparison of pump service efficiency from mass-based manufacturing data; automatic use-stage electricity estimation from pump mass; representing separately supplied parts as complete pumps; undisclosed mixing of bare-shaft and motor-integrated products"
  required_metadata: "PCR id and version context; pump model family; pump principle; pumped liquid; rated flow and head or pressure; rated speed; efficiency/test basis; driver and controls included; wetted materials; seal arrangement; net pump mass; packaging mass; factory geography; reporting period; vertical integration; upstream dataset choices; allocation and cut-off decisions"
  required_quality_disclosure: "Primary-data share; temporal coverage; meter and scale quality; BOM reconciliation; mass-balance closure; supplier-data coverage; proxy use; test-loop water balance; waste destinations; unresolved UUIDs; unresolved range evidence needs; uncertainty and data gaps"
  update_trigger: "Material change in product construction, driver boundary, supplier route, manufacturing or test technology, packaging, factory energy mix, allocation method, reporting period, regulatory test basis, or newly verified UUID/range evidence"
