system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with purchased semi-finished material and other products at the site gate and includes on-site machining, conditional heat treatment, conditional aqueous surface cleaning, final inspection, and packing through the covered part at the manufacturer's gate. Upstream production is linked through supplier or background datasets. Capital equipment, site construction, downstream distribution, installation, use, maintenance, and end of life are excluded unless the study expands the boundary."
      source_ids: []
    - rule_id: sb_foreground_gate
      applies_to: "all foreground processes"
      rule: "Include all on-site material, energy, water, waste, and direct-emission exchanges from receipt of the declared semi-finished material through release of the covered part."
      source_ids:
        - eu-pef-method-2021
        - us-epa-fabricated-metal-products-1995
    - rule_id: sb_conditional_processes
      applies_to: "heat treatment and aqueous surface cleaning"
      rule: "Include each conditional process only when performed; disclose its technology and add every actual atomic exchange crossing its boundary."
      source_ids:
        - us-epa-fabricated-metal-products-1995
    - rule_id: sb_exclusions
      applies_to: "excluded stages"
      rule: "Document and justify exclusions; do not silently exclude rejects, rework, scrap, cleaning wastewater, or direct combustion emissions."
      source_ids:
        - eu-pef-method-2021
