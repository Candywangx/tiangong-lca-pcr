allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "shared machines, lines, and utilities"
    rule: "Avoid allocation by separately metering batches, machines, or stages attributable to covered parts."
    source_ids:
      - eu-pef-method-2021
  - rule_id: al_physical_relationship
    applies_to: "inseparable shared foreground processes"
    rule: "If subdivision is impracticable, use a documented causal physical driver such as machine time, load-adjusted furnace occupancy, metered energy, or treated surface area."
    source_ids:
      - eu-pef-method-2021
  - rule_id: al_other_relationship
    applies_to: "remaining multifunctional processes"
    rule: "Use another relationship, including economic allocation, only when no defensible physical relationship exists; disclose values, period, sensitivity, and affected flows."
    source_ids:
      - eu-pef-method-2021
  - rule_id: al_scrap_disclosure
    applies_to: "steel scrap and recycling"
    rule: "Record scrap as waste without netting it against metal input or energy. Model recycling burdens and credits consistently downstream and disclose the convention."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_machining_records
      process_id: "p_primary_machining"
      flow_role: "chromium steel, electricity, cutting fluid, process water, steel scrap"
      record_type: "purchase/issue records, meters, scrap tickets, production log"
      raw_fields: "inventories; purchases/issues; meter readings; scrap mass; conforming mass; rejects; rework; identifiers"
      collection_method: "Reconcile records to the same machines, lots, and period"
      unit: "kg; MJ"
      frequency: "Per batch where available and at least monthly"
      temporal_coverage: "Representative continuous 12-month period or justified shorter campaign"
      site_scope: "All attributable on-site machining"
      aggregation_rule: "Sum net inputs/outputs, allocate shared resources, divide by conforming mass"
      quality_evidence: "calibrated meters/scales, invoices, batch travellers, scrap tickets, reconciliation sign-off"
    - protocol_id: cp_heat_treatment_records
      process_id: "p_heat_treatment"
      flow_role: "natural gas, electricity, fossil carbon dioxide"
      record_type: "meters, furnace logs, emissions records, production log"
      raw_fields: "corrected gas volume; electricity; monitored CO2; furnace; recipe; load; output mass"
      collection_method: "Match meters or allocation to furnace batches and technology"
      unit: "m3; MJ; kg"
      frequency: "Per batch or meter interval and at least monthly"
      temporal_coverage: "Representative continuous 12-month period or justified shorter campaign"
      site_scope: "On-site heat treatment"
      aggregation_rule: "Sum attributable records and divide by heat-treated conforming mass"
      quality_evidence: "calibration, reference-condition record, furnace log, emissions monitoring record"
    - protocol_id: cp_cleaning_records
      process_id: "p_aqueous_cleaning"
      flow_role: "sodium hydroxide, water, cleaning wastewater"
      record_type: "chemical issues, meters, bath logs, production log"
      raw_fields: "chemical mass/concentration; water; wastewater; bath inventory; treated mass; destination"
      collection_method: "Reconcile make-up, rinse water, wastewater, inventories, and output"
      unit: "kg"
      frequency: "Per batch or meter interval and at least monthly"
      temporal_coverage: "Representative continuous 12-month period or justified shorter campaign"
      site_scope: "On-site aqueous cleaning"
      aggregation_rule: "Sum net inputs and wastewater, divide by cleaned conforming mass"
      quality_evidence: "invoices, calibrated meters/scales, bath analyses, transfer manifests, mass-balance review"
    - protocol_id: cp_release_records
      process_id: "p_final_release"
      flow_role: "corrugated boxes and finished part"
      record_type: "packaging issues and final inspection/production records"
      raw_fields: "boxes issued/returned; box mass; conforming mass; rejects; rework; part/specification revision"
      collection_method: "Link packaging and release records to the same order or period"
      unit: "kg"
      frequency: "Per order or batch and at least monthly"
      temporal_coverage: "Representative continuous 12-month period or justified shorter campaign"
      site_scope: "Final release and packing"
      aggregation_rule: "Divide net box mass by conforming mass; set reference output to 1 kg"
      quality_evidence: "scale checks, packaging specification, inspection release, production reconciliation"
  calculation_rules:
    - id: cr_net_consumption
      applies_to: "purchased products"
      rule: "Net consumption = purchases or issues + opening inventory - closing inventory - documented returns"
      inputs:
        - "transactions and inventories for one scope and period"
      output: "net boundary-crossing quantity"
      source_ids:
        - eu-pef-method-2021
    - id: cr_reference_normalization
      applies_to: "variable inventory rows"
      rule: "Normalized amount = attributable net quantity / net conforming-part mass for the same scope and period"
      inputs:
        - "net quantity"
        - "conforming mass"
        - "allocation driver if needed"
      output: "amount per kg reference flow or process output"
      source_ids:
        - eu-pef-method-2021
    - id: cr_scrap_reconciliation
      applies_to: "machining material balance"
      rule: "Reconcile metal input with conforming output, scrap, rejects, rework transfers, and inventory changes; investigate unexplained imbalance."
      inputs:
        - "metal input"
        - output
        - scrap
        - rejects
        - rework
        - inventories
      output: "documented mass balance and residual"
      source_ids:
        - us-epa-fabricated-metal-products-1995
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and material"
      requirement: "Preserve part number, drawing/specification revision, function, grade, stock form, treatment state, and completion state."
      evidence: "product specification, certificate of conformity, material certificate, release record"
    - id: dq_scope
      applies_to: "foreground processes"
      requirement: "Use the same site, technology, products, and period for inputs and outputs; document outsourced steps and upstream datasets."
      evidence: "process map, boundary statement, supplier records, period reconciliation"
    - id: dq_measurement
      applies_to: "meters and mass records"
      requirement: "Retain calibration, unit conversions, meter coverage, estimation method, and allocation driver."
      evidence: "calibration certificates, meter register, conversion worksheet, allocation record"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Prefer a continuous 12-month period; justify shorter campaigns and disclose shutdowns, abnormal batches, and utilization."
      evidence: "dated production, purchase, utility, and waste records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile metal, water when cleaning is used, and process outputs; report missing exchanges and likely significance."
      evidence: "signed mass-balance and completeness review"
validation_rules:
  - rule_id: vr_identity_complete
    applies_to: "reference flow"
    rule: "Fail when a required qualifier, reference mass, market state, or drawing/specification identity is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-pef-method-2021
  - rule_id: vr_inventory_atomic
    applies_to: "process inventory"
    rule: "Fail when a row combines multiple materials, utilities, packaging components, wastes, or emissions, or uses an umbrella route selector."
    source_ids:
      - us-epa-fabricated-metal-products-1995
  - rule_id: vr_period_reconciliation
    applies_to: "variable amounts"
    rule: "Fail when quantities lack a common site, process scope, and period or omit inventory changes and rework."
    source_ids:
      - eu-pef-method-2021
