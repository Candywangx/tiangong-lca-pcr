allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared_operations"
    rule: "Prefer process subdivision and direct metering or material issue records for product families and route-specific operations."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "residual_shared_inputs"
    rule: "If subdivision is impracticable, allocate residual shared energy and consumables using a documented physical driver that reflects use, such as machine time, measured energy, processed mass, or test cycles; do not default to revenue without justification."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recyclable_scrap"
    rule: "Report steel scrap at the point it leaves the foreground boundary. Do not apply an avoided-primary-material credit inside this PCR unless the study explicitly applies a disclosed system-expansion method consistently to all compared products."
    source_ids: []
  - rule_id: allocation_mass_balance
    applies_to: "material_balance"
    rule: "Reconcile input materials to finished product, measured waste, emissions where mass-relevant, and inventory change; investigate unexplained imbalance before publication."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "parts_fabrication"
      flow_role: "steel and aluminium sheet inputs"
      record_type: "purchase receipt, warehouse issue, return, and inventory record"
      raw_fields: "material identity; grade; opening stock; receipts; issued mass; returned mass; closing stock; product model"
      collection_method: "Reconcile controlled warehouse records to production orders"
      unit: "kg"
      frequency: "Each issue and monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or complete shorter campaign"
      site_scope: "All sites performing included fabrication"
      aggregation_rule: "Net consumed mass divided by accepted finished-product mass"
      quality_evidence: "Signed stock reconciliation; calibrated scale record; material specification; production order"
    - protocol_id: cp_energy_records
      process_id: "all_applicable_processes"
      flow_role: "electricity input"
      record_type: "utility meter, submeter, invoice, equipment log, and production record"
      raw_fields: "opening reading; closing reading; meter multiplier; allocated shared use; downtime; accepted output"
      collection_method: "Prefer submeters; otherwise reconcile facility meter and allocate with documented physical driver"
      unit: "kWh retained raw; MJ reported"
      frequency: "At least monthly and by campaign where available"
      temporal_coverage: "Same reporting period as production output"
      site_scope: "All manufacturing sites in scope"
      aggregation_rule: "Net electricity converted at 3.6 MJ/kWh and divided by accepted output mass"
      quality_evidence: "Meter calibration or utility invoice; allocation worksheet; production log"
    - protocol_id: cp_gas_records
      process_id: "parts_fabrication"
      flow_role: "natural gas and industrial oxygen inputs"
      record_type: "meter, cylinder or bulk delivery, inventory, and equipment log"
      raw_fields: "gas identity; opening stock; deliveries; returns; closing stock; meter conditions; operation"
      collection_method: "Reconcile deliveries and inventories; use equipment meters where available"
      unit: "m3 at declared conditions"
      frequency: "Each delivery and monthly reconciliation"
      temporal_coverage: "Same reporting period as applicable operation"
      site_scope: "All sites using the gas"
      aggregation_rule: "Net consumed volume at one declared reference condition divided by accepted output mass"
      quality_evidence: "Supplier statement; meter record; cylinder reconciliation; reference-condition record"
    - protocol_id: cp_waste_mass
      process_id: "parts_fabrication"
      flow_role: "steel scrap output"
      record_type: "scrap scale ticket, container log, inventory, and production record"
      raw_fields: "waste identity; gross mass; tare; destination; opening and closing inventory; rework return"
      collection_method: "Reconcile weighed outbound scrap and inventory change"
      unit: "kg"
      frequency: "Each shipment and monthly reconciliation"
      temporal_coverage: "Same reporting period as production output"
      site_scope: "All sites producing steel scrap"
      aggregation_rule: "Outbound net mass plus closing less opening waste inventory, divided by accepted output mass"
      quality_evidence: "Scale calibration; waste transfer record; reconciliation worksheet"
    - protocol_id: cp_direct_emissions
      process_id: "parts_fabrication"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel record and reviewed factor record"
      raw_fields: "fuel quantity; composition or net calorific value; factor; factor unit; oxidation assumption"
      collection_method: "Calculate only direct site emissions from included fuel combustion"
      unit: "kg"
      frequency: "Each reporting-period calculation"
      temporal_coverage: "Same reporting period as fuel use"
      site_scope: "All included combustion sources"
      aggregation_rule: "Sum source-level emissions and divide by accepted output mass"
      quality_evidence: "Fuel record; factor citation in dataset; calculation worksheet; reviewer sign-off"
    - protocol_id: cp_water_records
      process_id: "aqueous_cleaning_and_assembly_test_pack"
      flow_role: "process water inputs"
      record_type: "meter, batch sheet, tank log, and production record"
      raw_fields: "opening reading; closing reading; batch additions; recovered return; density if converted"
      collection_method: "Reconcile dedicated meter or batch makeup and recovery"
      unit: "kg or m3 retained raw"
      frequency: "Each batch or at least monthly"
      temporal_coverage: "Same reporting period as applicable process"
      site_scope: "All sites using process water"
      aggregation_rule: "Net water crossing each process boundary divided by accepted output mass"
      quality_evidence: "Meter calibration; batch log; density source; recovery reconciliation"
    - protocol_id: cp_chemical_records
      process_id: "aqueous_cleaning"
      flow_role: "sodium hydroxide input"
      record_type: "chemical issue, purchase, bath makeup, concentration, and inventory record"
      raw_fields: "product identity; concentration; opening stock; additions; returns; closing stock"
      collection_method: "Reconcile product-mass additions and inventory; retain concentration separately"
