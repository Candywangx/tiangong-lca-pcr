allocation_rules:
  - rule_id: alloc_subdivision
    applies_to: "shared manufacturing operations"
    rule: "First avoid allocation by separately metering or subdividing machining cells, furnaces, test loops, coating booths, and waste streams for the reference-product lot."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: alloc_physical_relation
    applies_to: "residual shared inputs and outputs"
    rule: "When subdivision is impracticable, allocate shared electricity, fuels, water, consumables, and wastes using a documented causal physical driver such as machine hours, furnace occupancy, treated surface area, test duration, or measured mass. Use economic allocation only when no defensible physical relation exists and disclose the sensitivity."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: alloc_recycling_boundary
    applies_to: "steel scrap and recyclable residues"
    rule: "Record recyclable steel scrap as a waste output at the factory gate and disclose the recycling approach. Do not credit avoided primary production inside this foreground process unless the downstream study applies one consistent, explicitly documented recycling method."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_bom
      process_id: "component_fabrication_assembly"
      flow_role: "Low-alloy and stainless steel inputs"
      record_type: "receiving records and as-built bill of materials"
      raw_fields: "supplier item; heat or grade; product form; received mass; returned mass; incorporated mass; lot identifier"
      collection_method: "Reconcile purchase receipts and calibrated receiving weights to the released as-built bill of materials"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Complete lot from first receipt through dispatch"
      site_scope: "All reporting-manufacturer sites processing the lot"
      aggregation_rule: "Sum each steel type separately, subtract documented supplier returns, then normalize by finished product mass"
      quality_evidence: "Purchase documents; material certificates; calibrated-scale records; released bill of materials; reconciliation sign-off"
    - protocol_id: cp_electricity_records
      process_id: "component_fabrication_assembly"
      flow_role: "Purchased electricity"
      record_type: "meter and allocation record"
      raw_fields: "meter start and end; kWh; voltage; grid or on-site source; machine hours; allocation driver; lot identifier"
      collection_method: "Read dedicated meters where available; otherwise allocate site or cell meters using documented machine-hour or operating-time drivers"
      unit: "kWh and MJ"
      frequency: "At least monthly and for each production lot"
      temporal_coverage: "Representative production period covering the lot"
      site_scope: "Every manufacturing site in the foreground boundary"
      aggregation_rule: "Convert kWh to MJ, allocate consistently, sum all sites, and normalize by finished product mass"
      quality_evidence: "Meter identifiers; invoices; calibration or verification record; allocation worksheet"
    - protocol_id: cp_product_mass
      process_id: "component_fabrication_assembly"
      flow_role: "Finished reference product"
      record_type: "shipping-scale and dispatch record"
      raw_fields: "product identifier; serial number; configuration; gross mass; excluded packaging mass; net product mass; calibration status"
      collection_method: "Weigh the finished product or reconcile an as-built mass statement to calibrated component weights"
      unit: "kg"
      frequency: "Each finished unit or dispatch lot"
      temporal_coverage: "At factory-gate release"
      site_scope: "Final assembly and dispatch sites"
      aggregation_rule: "Sum net finished units and normalize all exchanges to exactly 1,000 kg"
      quality_evidence: "Scale certificate; dispatch note; as-built mass statement; acceptance release"
    - protocol_id: cp_steel_scrap
      process_id: "component_fabrication_assembly"
      flow_role: "Segregated steel scrap"
      record_type: "waste-scale and transfer record"
      raw_fields: "waste type; steel grade class; container tare; gross mass; contamination; destination; lot allocation"
      collection_method: "Weigh segregated scrap containers and reconcile transfers to production lots"
      unit: "kg"
      frequency: "Each transfer, aggregated by lot"
      temporal_coverage: "Same period as material inputs"
      site_scope: "All fabrication sites"
      aggregation_rule: "Subtract tare, exclude internal reuse, allocate shared containers by documented physical driver, and normalize by finished product mass"
      quality_evidence: "Scale record; waste transfer note; recycling receipt; mass-balance reconciliation"
    - protocol_id: cp_natural_gas_records
      process_id: "fuel_fired_heat"
      flow_role: "Natural gas input"
      record_type: "gas-meter and invoice record"
      raw_fields: "meter start and end; volume; reference temperature and pressure; equipment; operating hours; lot allocation"
      collection_method: "Read dedicated equipment meters or allocate verified site meters using burner operating time and rated flow"
      unit: "m3"
      frequency: "Each applicable lot, reconciled monthly"
      temporal_coverage: "Full applicable heat-treatment or curing period"
      site_scope: "All sites combusting gas for the lot"
      aggregation_rule: "Convert volumes to one declared reference condition, sum applicable equipment, and normalize by finished product mass"
      quality_evidence: "Meter or invoice; burner log; reference-condition statement; allocation worksheet"
    - protocol_id: cp_fuel_emission_calculation
      process_id: "fuel_fired_heat"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "calculated emission record"
      raw_fields: "normalized natural-gas quantity; gas composition or selected factor; factor source; oxidation assumption"
      collection_method: "Multiply collected fuel quantity by a documented supplier-specific or jurisdictional fossil-CO2 factor using consistent units"
      unit: "kg CO2"
      frequency: "Each applicable lot"
      temporal_coverage: "Same period as natural-gas records"
      site_scope: "All included combustion sources"
      aggregation_rule: "Sum source-level fossil CO2 and normalize by finished product mass; exclude upstream fuel emissions"
      quality_evidence: "Calculation worksheet; factor publication or supplier analysis; reviewer sign-off"
    - protocol_id: cp_oxygen_records
      process_id: "oxygen_assisted_cutting"
      flow_role: "Industrial oxygen input"
      record_type: "meter, cylinder, or supplier record"
      raw_fields: "delivered volume; returned inventory; pressure; reference conditions; purity; lot allocation"
      collection_method: "Use flowmeter records or reconcile full and returned cylinder inventories"
      unit: "m3"
      frequency: "Each applicable lot"
      temporal_coverage: "Full cutting period for the lot"
      site_scope: "All sites using oxygen-assisted cutting"
      aggregation_rule: "Convert to the declared reference condition, subtract returns, and normalize by finished product mass"
      quality_evidence: "Meter calibration; cylinder tickets; supplier certificate; cutting log"
    - protocol_id: cp_water_records
      process_id: "aqueous_cleaning_testing"
      flow_role: "Process-water make-up"
      record_type: "water-meter and test-loop record"
      raw_fields: "inlet meter; make-up volume; recirculated volume; discharge; evaporation estimate; density; lot identifier"
      collection_method: "Read dedicated inlet and make-up meters; reconcile the test-loop balance"
      unit: "kg or m3"
      frequency: "Each cleaning or hydraulic-test campaign"
      temporal_coverage: "Full applicable campaign"
