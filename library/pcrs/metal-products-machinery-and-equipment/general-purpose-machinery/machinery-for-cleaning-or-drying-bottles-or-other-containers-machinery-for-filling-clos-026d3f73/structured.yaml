allocation_rules:
  - rule_id: allocation_01
    applies_to: "shared factory processes"
    rule: "First subdivide meters, work orders and waste records so only exchanges directly attributable to the declared machine are included."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_02
    applies_to: "residual shared utilities"
    rule: "Where subdivision is not feasible, allocate using a causal physical driver such as machine-hours, welding time, test duration, metered load or processed mass; document the driver."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_03
    applies_to: "remaining multifunctionality"
    rule: "Use economic allocation only when subdivision, system expansion and a defensible physical relationship are not feasible; disclose values and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_04
    applies_to: "fabrication scrap"
    rule: "Report scrap mass and treatment route separately. Do not subtract an avoided virgin-material burden inside the cradle-to-gate inventory unless the selected overarching LCA method explicitly requires and documents that treatment."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_mass
      process_id: "component_fabrication"
      flow_role: "materials and installed components"
      record_type: "approved bill of materials, purchase and issue records"
      raw_fields: "item id; material/component description; grade; supplier; purchased mass; installed mass; scrap/return mass; assembly boundary"
      collection_method: "reconcile released configuration BOM with purchasing and stores records"
      unit: "kg"
      frequency: "each configuration"
      temporal_coverage: "production lot and reference year"
      site_scope: "reporting factory and named suppliers"
      aggregation_rule: "sum attributable net inputs; prevent double counting between purchased assemblies and embedded materials"
      quality_evidence: "approved BOM revision; certificates; weigh tickets; purchase records"
    - protocol_id: cp_energy_meter
      process_id: "component_fabrication_final_assembly"
      flow_role: "fabrication and assembly electricity"
      record_type: "meter and work-order logs"
      raw_fields: "meter start/end; kWh; area/process; work order; operating time; allocation driver"
      collection_method: "submeter preferred; otherwise physically allocate verified area meter"
      unit: "kWh"
      frequency: "each work order or monthly"
      temporal_coverage: "representative annual period including the lot"
      site_scope: "reporting factory"
      aggregation_rule: "sum attributable kWh then convert to MJ and normalize"
      quality_evidence: "calibrated-meter record; reconciliation to utility invoice"
    - protocol_id: cp_process_gases
      process_id: "component_fabrication"
      flow_role: "oxygen and shielding gas"
      record_type: "flowmeter, cylinder or bulk-tank records"
      raw_fields: "gas identity; purity; opening/closing mass or volume; reference conditions; work order"
      collection_method: "reconcile metering and inventory change to fabrication work orders"
      unit: "kg or m3"
      frequency: "each cylinder/batch"
      temporal_coverage: "production lot"
      site_scope: "reporting factory"
      aggregation_rule: "allocate by measured use or documented cutting/welding time"
      quality_evidence: "supplier certificate; scale/flowmeter calibration; stock reconciliation"
    - protocol_id: cp_water_chemicals
      process_id: "component_fabrication"
      flow_role: "cleaning water and sodium hydroxide"
      record_type: "batch sheets, meters and chemical issue records"
      raw_fields: "water input; solution mass; NaOH fraction; bath carryover; lot; work order"
      collection_method: "meter water and reconcile chemical issues; calculate active NaOH"
      unit: "kg"
      frequency: "each bath or batch"
      temporal_coverage: "production lot"
      site_scope: "reporting factory"
      aggregation_rule: "sum attributable water; solution mass × NaOH fraction"
      quality_evidence: "meter calibration; SDS/specification; bath record"
    - protocol_id: cp_fuel_meter
      process_id: "component_fabrication"
      flow_role: "process natural gas"
      record_type: "gas meter and burner work-order log"
      raw_fields: "volume; temperature/pressure basis; burner/process; operating time; allocation driver"
      collection_method: "submeter or physically allocate verified process meter"
      unit: "m3"
      frequency: "each batch or monthly"
      temporal_coverage: "representative annual period"
      site_scope: "reporting factory"
      aggregation_rule: "sum attributable reference-condition volume"
      quality_evidence: "meter calibration; invoice reconciliation"
    - protocol_id: cp_waste_records
      process_id: "component_fabrication"
      flow_role: "steel scrap and wastewater"
      record_type: "weigh tickets, wastewater meters and transfer records"
      raw_fields: "waste identity; mass/volume; source process; date; treatment destination; recovery status"
      collection_method: "reconcile internal collection and external transfer documents"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "production lot and reference year"
      site_scope: "reporting factory"
      aggregation_rule: "sum attributable outputs without avoided-burden credit"
      quality_evidence: "weigh ticket; manifest; treatment receipt"
    - protocol_id: cp_direct_emissions
      process_id: "component_fabrication"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack test, continuous meter or verified facility inventory"
      raw_fields: "emission mass; measurement/calculation method; fuel record link; time; allocation driver"
      collection_method: "direct measurement preferred; verified calculation retained when used"
      unit: "kg"
      frequency: "each test or reporting period"
      temporal_coverage: "representative annual period"
      site_scope: "foreground combustion sources"
      aggregation_rule: "allocate only direct foreground emissions"
      quality_evidence: "calibration/test report or verified calculation file"
    - protocol_id: cp_test_records
      process_id: "factory_testing"
      flow_role: "electricity, water and carbon dioxide test media"
      record_type: "factory-acceptance test log and meters"
      raw_fields: "protocol id; serial/configuration; test duration; kWh; water mass; CO2 mass; pass/rework result"
      collection_method: "meter complete test cycles and link them to accepted serial numbers"
      unit: "MJ, kg"
      frequency: "each accepted machine"
      temporal_coverage: "production lot"
      site_scope: "reporting test bay"
      aggregation_rule: "include initial and repeated tests attributable to accepted output"
      quality_evidence: "signed acceptance report; meter records"
    - protocol_id: cp_packaging_records
      process_id: "dispatch_packaging"
      flow_role: "dispatch packaging"
      record_type: "packing list, packaging specification and weights"
      raw_fields: "packaging item; material; unit mass; quantity; reuse count; destination"
      collection_method: "reconcile packing list with weighed or supplier-specified mass"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "production lot"
      site_scope: "manufacturer gate"
      aggregation_rule: "sum supplied packaging; divide reusable item mass by verified uses"
      quality_evidence: "packing list; weight evidence; reuse log"
  calculation_rules:
    - id: calculation_01
      applies_to: "all variable inventory rows"
      rule: "normalized amount = attributable amount / net accepted-machine mass × 1,000"
      inputs:
        - "attributable exchange"
        - "net accepted-machine kg"
      output: "exchange per 1,000 kg machine"
      source_ids:
        - eu-pef-method-2021
    - id: calculation_02
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids:
        - eu-pef-method-2021
    - id: calculation_03
      applies_to: "sodium hydroxide"
      rule: "active NaOH kg = solution kg × measured or supplier-declared mass fraction"
      inputs:
        - "solution mass"
        - "NaOH fraction"
      output: "kg active NaOH"
      source_ids: []
    - id: calculation_04
      applies_to: "reusable wooden pallet"
      rule: "attributable pallet kg = pallet kg / verified number of uses"
      inputs:
        - "pallet mass"
        - "reuse count"
      output: "kg pallet per dispatch"
      source_ids: []
  data_quality_requirements:
    - id: quality_01
      applies_to: "product identity"
      requirement: "Configuration and required qualifiers shall match the accepted serial number and reference product."
      evidence: "signed BOM release and factory-acceptance record"
    - id: quality_02
      applies_to: "completeness"
      requirement: "Reconcile BOM mass to net machine mass and explain excluded, confidential or embedded component masses."
      evidence: "mass-balance worksheet and BOM reconciliation"
    - id: quality_03
      applies_to: "temporal representativeness"
      requirement: "Foreground energy, water, fuel and waste records shall cover the production lot or a representative twelve-month period that includes it."
      evidence: "dated records and representativeness statement"
    - id: quality_04
      applies_to: "geography and technology"
      requirement: "Disclose supplier and energy geography, material grades, recycled content, fabrication route, test protocol and waste destination."
      evidence: "supplier declarations and process metadata"
    - id: quality_05
      applies_to: "uncertainty"
      requirement: "Report measurement, allocation and proxy uncertainty; flag all source-free category range gaps rather than treating a single EPD case as a range."
      evidence: "uncertainty record and unresolved-evidence review"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow"
    rule: "Confirm reference output is exactly 1,000 kg net accepted machine and all required qualifiers are populated."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_02
    applies_to: "inventory identity"
    rule: "Confirm every row is one atomic exchange and every UUID-bearing English/Chinese name, flow type, property and unit matches its public state-100 audit."
    source_ids: []
  - rule_id: validation_03
    applies_to: "BOM boundary"
    rule: "Confirm purchased assemblies are not double-counted with their embedded raw materials."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_04
    applies_to: "process completeness"
    rule: "Confirm procurement/fabrication, final assembly and factory testing are represented; justify non-applicable conditional rows and dispatch packaging."
    source_ids:
      - ecolean-filling-machines-epd-2021
  - rule_id: validation_05
    applies_to: "mass balance"
    rule: "Reconcile net machine mass, incorporated materials/components, fabrication losses and excluded confidential mass within the stated uncertainty."
    source_ids: []
  - rule_id: validation_06
    applies_to: "energy and gases"
    rule: "Confirm electricity conversion, gas reference conditions, grid geography and separation of oxygen, carbon dioxide and natural gas."
    source_ids: []
  - rule_id: validation_07
    applies_to: "waste and emissions"
    rule: "Confirm steel scrap, cleaning wastewater and direct fossil carbon dioxide are reported only when generated, with destinations and no double-counted upstream emissions."
    source_ids: []
  - rule_id: validation_08
    applies_to: "allocation"
    rule: "Confirm subdivision was attempted first and every remaining allocation driver is causal, documented and sensitivity-tested when material."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_09
    applies_to: "evidence gaps"
    rule: "Confirm no empirical range was inferred from one product case and all unresolved UUID/range needs remain disclosed."
    source_ids: []
  - rule_id: validation_10
    applies_to: "bilingual alignment"
    rule: "Confirm English and Chinese files have identical process ids, row ids, rule ids, controlled tokens, UUIDs and source ids."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate machine production dataset"
  downstream_use: "May be used as a secondary_dataset or background_dataset for capital-equipment or machinery-production modelling when configuration and boundary match"
  allowed_use: "Modelling production of the declared configured machinery; scenario analysis with disclosed supplier, energy, allocation and packaging assumptions"
  excluded_use: "Direct comparison of unlike functions/configurations; representing separately sold parts; substituting for machine use, maintenance or end-of-life; using one filling-machine case as a universal category benchmark"
  required_metadata: "PCR id/version; machine function/model/configuration; serial or configuration reference; net mass; capacity and acceptance criteria; container/product compatibility; design life; included accessories; site/year; BOM boundary; suppliers/geographies; energy mix; allocation; testing media; dispatch packaging; waste destinations; unresolved/proxy disclosures"
  required_quality_disclosure: "Foreground coverage; BOM reconciliation; measurement and allocation methods; temporal/geographic/technological representativeness; data gaps; uncertainty; share of supplier-specific data; verification status"
  update_trigger: "Material change to design/BOM, mass, drive/control system, manufacturing route/site, supplier geography, energy mix, test protocol, packaging, allocation method, waste treatment or a change exceeding the study's significance threshold"
