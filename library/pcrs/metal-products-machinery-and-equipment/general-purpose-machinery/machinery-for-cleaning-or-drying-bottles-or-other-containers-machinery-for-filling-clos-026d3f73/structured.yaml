measurement_rules:
  - id: measurement_01
    applies_to: "reference product and mass-based inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net accepted-machine mass, excluding dispatch packaging, as the reference amount; report dispatch packaging in its own rows."
  - id: measurement_02
    applies_to: "normalization"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg/1,000 kg machine"
    rule: "Divide each attributable cradle-to-gate exchange by accepted-machine net mass and multiply by 1,000; retain unrounded source records."
  - id: measurement_03
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered kWh in foreground records and convert with 1 kWh = 3.6 MJ; disclose grid geography, voltage and losses."
  - id: measurement_04
    applies_to: "gases measured by volume"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "State temperature and pressure reference conditions; do not combine oxygen, carbon dioxide or natural gas volumes."
  - id: measurement_05
    applies_to: "reused packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record only the attributable mass per dispatch after applying the documented reuse count; do not count the full pallet mass on every reuse."
