allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "multi-product facilities and shared operations"
    rule: "First avoid allocation through product-specific bills of materials, submetering, test logs, waste records, and subdivision of independently measurable processes."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "residual shared foreground inputs and outputs"
    rule: "Where subdivision is not feasible, use a documented causal physical relationship: machine time for fabrication energy, measured material throughput for material-handling burdens, test duration or measured fuel for test-cell burdens, and treated flow or pollutant load for wastewater treatment."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other
    applies_to: "shared burdens without a defensible physical relationship"
    rule: "Use another allocation basis, including economic allocation, only after documenting why subdivision and a causal physical basis are infeasible; disclose the basis, period, products, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap
    applies_to: "steel scrap and treatment residuals"
    rule: "Report scrap and residuals as waste outputs at the foreground hand-off. Do not apply an avoided-burden credit inside this factory-gate inventory unless the downstream modelling framework explicitly requires it and the corresponding allocation method is disclosed without double counting."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_mass
      process_id: "fabrication_assembly"
      flow_role: "finished reference product"
      record_type: "final inspection and dispatch record"
      raw_fields: "model; serial or batch; accepted quantity; net finished mass; included components; packaging convention; timestamp"
      collection_method: "calibrated scale or controlled engineering mass record reconciled to dispatch"
      unit: "kg"
      frequency: "each accepted unit or homogeneous batch"
      temporal_coverage: "same reporting period as inventory"
      site_scope: "all manufacturing sites in scope"
      aggregation_rule: "sum accepted net mass; normalize inventory to 1 kg"
      quality_evidence: "calibration record; acceptance record; reconciliation to dispatch"
    - protocol_id: cp_bom_materials
      process_id: "fabrication_assembly"
      flow_role: "material inputs"
      record_type: "product-specific bill of materials and stock issue"
      raw_fields: "model; material identity; grade; form; supplier; issued mass; returned mass; purchased-component dataset; batch"
      collection_method: "reconcile controlled BOM, purchase receipt, and stock issue/return records"
      unit: "kg"
      frequency: "each production order"
      temporal_coverage: "representative annual period or declared campaign"
      site_scope: "all included fabrication and assembly sites"
      aggregation_rule: "issued minus returned mass by atomic material and product order"
      quality_evidence: "approved BOM revision; supplier specification; stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "fabrication_assembly"
      flow_role: "electricity input"
      record_type: "meter and production record"
      raw_fields: "meter id; opening and closing readings; unit; loss boundary; product output; machine time; allocation driver; grid supplier"
      collection_method: "read calibrated submeters where available; otherwise reconcile invoice totals and documented allocation"
      unit: "kWh and MJ"
      frequency: "monthly or each campaign"
      temporal_coverage: "at least 12 consecutive months unless campaign production is justified"
      site_scope: "all included sites and shared utilities"
      aggregation_rule: "subtract excluded loads; allocate under Section 7; convert kWh to MJ"
      quality_evidence: "meter calibration; invoices; allocation worksheet; production reconciliation"
    - protocol_id: cp_gas_and_fuel_records
      process_id: "fabrication_assembly_gas_hot_test_diesel_hot_test"
      flow_role: "industrial oxygen and test fuels"
      record_type: "supplier delivery, meter, tank, and test log"
      raw_fields: "product model; test id; gas or fuel identity; opening and closing readings; delivered quantity; returns; temperature; pressure; moisture; density; test duration"
      collection_method: "reconcile corrected meters or tank/cylinder mass balance to individual test logs"
      unit: "m3 or kg"
      frequency: "each delivery and test"
      temporal_coverage: "all tests in reporting period"
      site_scope: "included cutting equipment and test cells"
      aggregation_rule: "net consumption by atomic gas or fuel; allocate only documented shared losses"
      quality_evidence: "meter calibration; supplier ticket; tank reconciliation; signed test log"
    - protocol_id: cp_water_and_chemical_records
      process_id: "aqueous_surface_treatment"
      flow_role: "process water and sodium hydroxide"
      record_type: "meter, batch sheet, and chemical issue"
      raw_fields: "bath id; water reading; solution mass; concentration; make-up; disposal; treated product mass; timestamp"
      collection_method: "reconcile water meter and batch dosing records to treated production"
      unit: "kg"
      frequency: "each bath make-up and monthly meter close"
      temporal_coverage: "all applicable treatment batches in reporting period"
      site_scope: "included onsite aqueous treatment lines"
      aggregation_rule: "convert solution to pure chemical plus carrier water; allocate by treated mass or measured load"
      quality_evidence: "meter calibration; certificate of analysis; batch record; inventory reconciliation"
    - protocol_id: cp_waste_records
      process_id: "fabrication_assembly"
      flow_role: "post-industrial steel scrap"
      record_type: "segregated weigh ticket and waste manifest"
      raw_fields: "material; gross and tare mass; contamination; destination; date; product order or allocation driver"
      collection_method: "weigh segregated containers or perform reconciled product-specific mass balance"
      unit: "kg"
      frequency: "each shipment; allocate monthly"
      temporal_coverage: "same reporting period as production"
      site_scope: "all included fabrication sites"
      aggregation_rule: "sum net mass by waste identity; allocate under Section 7"
      quality_evidence: "calibrated scale; manifest; recycler receipt; mass-balance check"
    - protocol_id: cp_wastewater_and_sludge_records
      process_id: "aqueous_surface_treatment"
      flow_role: "wastewater and sludge"
      record_type: "discharge meter, tank transfer, laboratory, and manifest"
      raw_fields: "flow or volume; density; pH; relevant metals; treatment point; sludge gross/tare; moisture or dry solids; destination"
      collection_method: "measure discharge/transfer and weigh sludge; retain representative composition and moisture tests"
      unit: "kg"
      frequency: "continuous or each batch/dispatch"
      temporal_coverage: "all applicable treatment operation in reporting period"
      site_scope: "included treatment lines and onsite wastewater treatment"
      aggregation_rule: "convert volume to mass using documented density; aggregate separately by waste state"
      quality_evidence: "meter calibration; laboratory report; manifest; tank or mass reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "fabrication_assembly_gas_hot_test_diesel_hot_test"
      flow_role: "direct air emissions"
      record_type: "stack/fugitive monitoring and calculation file"
      raw_fields: "source; pollutant; concentration or factor; flow; operating time; fuel use; abatement; test id; compartment; method"
      collection_method: "representative measurement where available or documented calculation from collected activity data and approved factor"
      unit: "kg"
      frequency: "monitoring schedule adequate for representative data; calculations each reporting period"
      temporal_coverage: "same period and operating conditions as activity data"
      site_scope: "every included onsite source"
      aggregation_rule: "calculate released mass after abatement; allocate causally and normalize to product mass"
      quality_evidence: "accredited or documented method; calibration; raw results; factor provenance; uncertainty review"
  calculation_rules:
    - id: calc_normalization
      applies_to: "every variable inventory row"
      rule: "normalized amount = attributable reporting-period amount / accepted net finished-product mass"
      inputs:
        - "atomic flow amount"
        - "accepted product mass from cp_product_mass"
      output: "flow amount per 1 kg finished covered appliance"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_bom_net_use
      applies_to: "material inputs"
      rule: "net material use = issued mass - unused returned mass; separately model purchased-component datasets and prevent double counting their embodied materials"
      inputs:
        - BOM
        - "stock issue"
        - returns
        - "component dataset boundary"
      output: "atomic material input per reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_electricity
      applies_to: "fabrication_electricity"
      rule: "attributable MJ = attributable metered kWh × 3.6"
      inputs:
        - "meter readings"
        - "excluded loads"
        - "allocation driver"
      output: "MJ electricity per reference flow"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_gas_volume
      applies_to: "natural_gas_test; industrial_oxygen"
      rule: "convert actual volume to the declared reference condition using documented temperature, absolute pressure, compressibility, and moisture correction; do not apply an undocumented default"
      inputs:
        - "actual volume"
        - temperature
        - pressure
        - moisture
        - "correction method"
      output: "m3 at declared conditions per reference flow"
      source_ids: []
    - id: calc_solution_mass
      applies_to: "sodium_hydroxide"
      rule: "pure NaOH mass = solution mass × verified mass fraction; record carrier water in process_water where it crosses the boundary"
      inputs:
        - "solution mass"
        - "certificate or batch concentration"
      output: "kg sodium hydroxide per reference flow"
      source_ids:
        - ifc-metal-products-ehs-2007
    - id: calc_direct_emissions
      applies_to: "gas_test_co2; diesel_test_co2; gas_test_nox; diesel_test_nox; fabrication_particulate"
      rule: "released mass = representative measured mass or collected activity data × documented factor, adjusted only for measured abatement and allocated under Section 7"
      inputs:
        - "monitored release or activity record"
        - "factor provenance"
        - abatement
        - "allocation driver"
      output: "kg direct elementary emission per reference flow"
      source_ids:
        - eu-pef-2021-2279
        - ifc-metal-products-ehs-2007
    - id: calc_mass_balance
      applies_to: "material inputs, product, and solid wastes"
      rule: "reconcile input material mass to finished-product mass, returned stock, recorded wastes, and documented changes in work in progress; investigate material-specific gaps"
      inputs:
        - "BOM net use"
        - "product mass"
        - returns
        - waste
        - "work in progress"
      output: "material-specific reconciliation and completeness finding"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain model, product subtype, intended fuel or handled material, rated capacity, configuration, and approved specification for every represented product."
      evidence: "specification; nameplate; final acceptance record"
    - id: dq_product_specificity
      applies_to: "bill of materials and manufacturing activity"
      requirement: "Use the actual product-specific BOM and company-specific manufacturing activity; averaging across models requires a mass-weighted representative mix and disclosure of every included model."
      evidence: "controlled BOM; production mix; allocation worksheet"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one common representative reporting period, normally 12 consecutive months; justify campaign data, shutdowns, abnormal tests, and extrapolation."
      evidence: "dated records; operating calendar; representativeness review"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match supplier geography, material grade, production technology, electricity supply, fuel state, and waste-treatment route where material; document proxies."
      evidence: "supplier data; dataset metadata; proxy log"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile product mass, material issues, energy invoices/meters, test logs, and waste manifests; add every omitted product-specific material, test fuel, finishing chemical, waste, and direct emission as a separate atomic flow."
      evidence: "mass and energy reconciliation; omission register; signed review"
    - id: dq_emissions
      applies_to: "direct emissions"
      requirement: "Use monitoring frequency and conditions sufficient to represent included operation, retain factor provenance and abatement status, and do not import upstream emissions into foreground direct-emission rows."
      evidence: "raw monitoring; method; calibration; calculation file; boundary check"
    - id: dq_uncertainty
      applies_to: "calculated and allocated values"
      requirement: "Document measurement uncertainty, factor uncertainty, allocation sensitivity, and the effect of unresolved UUIDs and missing empirical ranges."
      evidence: "uncertainty register; sensitivity calculation; review sign-off"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Fail validation when product subtype, model/configuration, intended fuel or handled material, rated capacity, product mass convention, manufacturing site, or factory-test route is missing."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_reference_mass
    applies_to: "normalization"
    rule: "Require covered_appliance_output to equal exactly 1 kg after normalization and reconcile the denominator to accepted finished-product mass records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_process_routes
    applies_to: "conditional processes"
    rule: "Require every applicable onsite surface-treatment and hot-test route to be included; require inapplicable routes to be explicitly declared rather than represented with invented zero values."
    source_ids:
      - ifc-metal-products-ehs-2007
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Reject combined material, fuel, utility, waste, wastewater-and-residue, or emission-group rows. Require each actual unlisted BOM material, fuel, chemical, waste, and direct emission to be added as one atomic exchange."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_balance
    applies_to: "material and energy records"
    rule: "Require product-specific BOM reconciliation, electricity reconciliation, test-fuel reconciliation, and documented explanations for material mass-balance gaps."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_emission_boundary
    applies_to: "direct elementary emissions"
    rule: "Reject upstream electricity, material, fuel-supply, or waste-treatment emissions in foreground direct-emission rows; require source, method, compartment, abatement, and allocation evidence for each direct release."
    source_ids:
      - ifc-metal-products-ehs-2007
      - eu-pef-2021-2279
  - rule_id: validate_unresolved
    applies_to: "UUID and range review"
    rule: "Report unresolved UUID rows and unresolved empirical range needs as incomplete review items; do not substitute proxy UUIDs or invented ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific factory-gate foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate studies of the declared covered appliance; upstream input to expanded installation, use, maintenance, or end-of-life models when those later stages are modelled separately"
  excluded_use: "Comparative assertions between products with different function, rated capacity, duty, service life, fuel compatibility, or configuration; representation of complete ovens/furnaces, spare parts, services, customer-site commissioning, use-phase combustion, or end-of-life"
  required_metadata: "PCR id and version; product subtype; model/configuration; intended fuel or handled material; rated thermal or handling capacity; net product mass convention; production route; sites and geography; reporting period; product mix; test route and test fuel; allocation; upstream datasets; waste destinations; external packaging treatment; unresolved identities; cut-offs"
  required_quality_disclosure: "Primary-data share; BOM and activity representativeness; meter and scale quality; mass/energy reconciliation; allocation and sensitivity; emission method and factor provenance; upstream proxy use; uncertainty; unresolved UUIDs; missing empirical ranges"
  update_trigger: "Material change in product design, principal material grade, supplier or upstream dataset, production technology, site, electricity supply, surface-treatment route, test route or fuel, waste treatment, allocation, or reporting period; or resolution of a listed UUID/range evidence gap"
