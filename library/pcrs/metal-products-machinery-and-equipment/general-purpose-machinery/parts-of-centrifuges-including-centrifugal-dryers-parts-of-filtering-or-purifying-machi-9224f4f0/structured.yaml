allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "separable_products_and_processes"
    rule: "First subdivide by product line, part family, batch and process step so directly attributable exchanges require no allocation."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "inseparable_shared_operations"
    rule: "If direct metering is infeasible, allocate with a measured causal driver such as machine hours, treatment area, weld length, bath loading or processed mass; disclose sensitivity."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recyclable_scrap_and_waste"
    rule: "Record scrap and waste at the foreground boundary without avoided-burden credit; disclose recycling convention downstream."
    source_ids: []
  - rule_id: allocation_packaging_reuse
    applies_to: "reusable_pallets"
    rule: "Divide pallet manufacture by documented expected uses, assign losses to the period and test material reuse assumptions."
    source_ids: []
  - rule_id: allocation_no_mass_only_default
    applies_to: "heterogeneous_part_families"
    rule: "Do not use finished mass as an unexamined default where processing intensity differs materially; justify it against a causal driver."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_part_fabrication
      process_id: "part_fabrication"
      flow_role: "listed inputs, wastes and particulate"
      record_type: "issue/return, meter, waste and emission records"
      raw_fields: "material/grade, issued/returned mass, meter readings, allocation driver, waste mass, emission method, output mass"
      collection_method: "Reconcile ERP/store records, meters, waste manifests and control records to lots."
      unit: "kg; MJ"
      frequency: "lot or monthly"
      temporal_coverage: "12 representative months or full campaign"
      site_scope: "all in-scope fabrication equipment"
      aggregation_rule: "Sum net exchanges and divide by conforming output; prevent recirculation double count."
      quality_evidence: "invoices, issue slips, calibration, waste tickets and reconciliation"
    - protocol_id: cp_joining_assembly
      process_id: "joining_assembly"
      flow_role: "wire, gases and electricity"
      record_type: "feeder, cylinder, bulk-gas and electricity records"
      raw_fields: "wire issue/return, gas quantity/conditions, meter, weld lot, output"
      collection_method: "Collect by batch or allocate reconciled totals using weld time or length."
      unit: "kg; m3; MJ"
      frequency: "joining lot or monthly"
      temporal_coverage: "same period as reference product"
      site_scope: "all in-scope joining cells"
      aggregation_rule: "Net consumption divided by conforming output for route lots."
      quality_evidence: "feeder, supplier, gas and electricity records"
    - protocol_id: cp_surface_treatment
      process_id: "surface_treatment"
      flow_role: "chemicals, water, energy, wastewater, sludge and CO2"
      record_type: "bath, meter, discharge and waste records"
      raw_fields: "product mass/concentration, meter readings, discharge, sludge, factor, treated output"
      collection_method: "Reconcile bath logs and utilities with wastewater/sludge transfers and treated output."
      unit: "kg; m3; MJ"
      frequency: "bath campaign or monthly"
      temporal_coverage: "same period including bath dumps"
      site_scope: "in-scope treatment and wastewater equipment"
      aggregation_rule: "Direct assignment or causal treatment-area/bath-loading driver; calculate active chemical and CO2."
      quality_evidence: "bath analysis, calibration, manifests and factor record"
    - protocol_id: cp_final_testing_packaging
      process_id: "final_testing_packaging"
      flow_role: "final electricity, packaging and reference output"
      record_type: "test, meter, BOM, scale and shipment records"
      raw_fields: "accepted/rejected mass, meter, package mass/count, reuse, test, shipment"
      collection_method: "Reconcile accepted output to disposition and packaging issued."
      unit: "kg; MJ"
      frequency: "lot or shipment"
      temporal_coverage: "same period"
      site_scope: "final test and packing area"
      aggregation_rule: "Normalize to 1 kg net conforming output; exclude packaging from output mass."
      quality_evidence: "scales, meters, acceptance and shipment records"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "all rows"
      rule: "normalized amount = period boundary amount / net conforming finished-part mass"
      inputs:
        - exchange
        - "accepted mass"
      output: "amount per 1 kg finished part"
      source_ids: []
    - id: calc_electricity_kwh_to_mj
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - kWh
      output: "MJ"
      source_ids: []
    - id: calc_active_chemical
      applies_to: "sodium hydroxide and sulfuric acid"
      rule: "active mass = solution mass × active mass fraction; retain solution basis if required upstream"
      inputs:
        - "solution mass"
        - concentration
      output: "kg active chemical or supplied solution"
      source_ids:
        - ec-jrc-stm-bref-2006
    - id: calc_fossil_co2
      applies_to: "surface_treatment_fossil_co2"
      rule: "direct fossil CO2 = fuel quantity × disclosed factor × oxidation factor"
      inputs:
        - fuel
        - factor
        - oxidation
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "fabrication and final output"
      rule: "stock input = conforming output + measured waste + inventory change + investigated residual"
      inputs:
        - stock
        - output
        - waste
        - inventory
      output: "residual"
      source_ids:
        - us-epa-fabricated-metal-products-1995
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Preserve drawing revision, function, material grade, mass, finish and test criteria by part family."
      evidence: "drawing, BOM, material certificate and acceptance record"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use a common representative period and include bath dumps, maintenance waste and rejects."
      evidence: "dated production, utility, purchase and waste records"
    - id: dq_measurement
      applies_to: "measured exchanges"
      requirement: "Identify meter/scale, calibration, frequency, estimation share and conversions."
      evidence: "calibration, meter log and workbook"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Declare each conditional row recorded or not applicable; cover at least 95% by mass of purchased materials and wastes and investigate residuals."
      evidence: "checklist and mass reconciliation"
    - id: dq_geography_technology
      applies_to: "upstream links"
      requirement: "Match geography, technology, material state and recycled content; document proxies without changing UUID identity."
      evidence: "supplier records and dataset-selection log"
    - id: dq_uncertainty
      applies_to: "allocated/calculated values"
      requirement: "Report allocation share, variability and assumptions; test material shared burdens and pallet reuse."
      evidence: "allocation workbook and sensitivity"
