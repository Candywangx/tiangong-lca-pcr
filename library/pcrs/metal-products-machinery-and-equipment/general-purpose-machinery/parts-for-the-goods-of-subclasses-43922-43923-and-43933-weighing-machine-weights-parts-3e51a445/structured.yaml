                - eu-jrc-sf-bref-2024
                - eu-jrc-sts-bref-2020
            ranges: []
allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared operations and utilities"
    rule: "Avoid allocation by collecting product-line or batch-specific records and subdividing shared operations wherever technically feasible."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical
    applies_to: "unavoidable shared inputs, wastes, and emissions"
    rule: "When subdivision is infeasible, use a documented causal physical driver such as machine hours, metered energy, processed mass, bath loading, or coating area; demonstrate why it represents the exchange and keep one method throughout the period."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other
    applies_to: "cases without a defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and physical allocation are infeasible; report the factor, period, products, sensitivity, and share. Do not credit scrap or recycling without a separately declared method."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_packaging_records
      process_id: "component_manufacture"
      flow_role: "material and supplied packaging by row_id"
      record_type: "invoice, receipt, issue, stock count, bill of materials, item-mass test"
      raw_fields: "identity, grade or formulation, supplier, quantity, unit, lot, opening and closing stock, batch, packaging count, item mass"
      collection_method: "Reconcile receipts, issues, returns, and stocks; weigh representative packaging when converting count to mass"
      unit: "kg"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "output reporting period"
      site_scope: "all included lines at the site"
      aggregation_rule: "Sum batch-attributable consumption by atomic flow and normalize"
      quality_evidence: "calibrated scale, supplier specification, stock reconciliation, bill-of-material revision"
    - protocol_id: cp_energy_gas_records
      process_id: "component_manufacture"
      flow_role: "electricity and each gas by row_id"
      record_type: "meter, invoice, cylinder balance, runtime"
      raw_fields: "meter readings, invoice quantity, unit, reference conditions, purity, cylinder stock, line, batch, allocation driver"
      collection_method: "Prefer dedicated meters; otherwise allocate a reconciled site total using a causal physical driver"
      unit: "MJ, m3, or kg by row"
      frequency: "meter interval or cylinder change; monthly aggregation"
      temporal_coverage: "output reporting period"
      site_scope: "included equipment and utilities"
      aggregation_rule: "Sum net purchases, adjust stock or exports, allocate, and normalize"
      quality_evidence: "calibration, invoice reconciliation, reference-condition record, allocation worksheet"
    - protocol_id: cp_water_chemical_records
      process_id: "component_manufacture"
      flow_role: "process water and each chemical by row_id"
      record_type: "meter, tank balance, issue, stock count, formulation"
      raw_fields: "fresh input, concentration, dilution water, recovered amount, opening and closing stock, batch, line"
      collection_method: "Record fresh material crossing the boundary and separately track internal recirculation and recovery to stock"
      unit: "kg"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "output reporting period"
      site_scope: "included wet, machining, and coating operations"
      aggregation_rule: "Net fresh input equals receipts or issues plus opening stock minus closing stock and returns; normalize"
      quality_evidence: "calibration, concentration certificate, bath log, inventory reconciliation"
    - protocol_id: cp_output_waste_emission_records
      process_id: "component_manufacture"
      flow_role: "product, each waste, and each direct emission by row_id"
      record_type: "production mass, inspection, waste manifest, meter, stack test, fuel record"
      raw_fields: "output and reject mass, waste mass, stock change, discharge, contaminant, treatment, fuel carbon data, PM10 result, compartment"
      collection_method: "Weigh outputs and wastes, meter discharges, and use direct emissions measurement where available"
      unit: "kg"
      frequency: "each batch, discharge, or required test"
      temporal_coverage: "output reporting period"
      site_scope: "all included release points and destinations"
      aggregation_rule: "Reconcile stocks, calculate emissions from collected inputs where needed, and normalize"
      quality_evidence: "calibration, inspection release, waste manifest, laboratory or stack report, calculation worksheet"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory amount"
      rule: "normalized amount = batch-attributable exchange × 1,000 / net conforming product mass"
      inputs:
        - "collected exchange"
        - "net conforming product mass"
      output: "row amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity recorded in kWh"
      rule: "electricity MJ = purchased kWh × 3.6"
      inputs:
        - "purchased kWh"
      output: "purchased MJ"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "count- or length-based packaging"
      rule: "packaging mass = verified unit mass × count, or verified linear mass × length"
      inputs:
        - "count or length"
        - "verified mass factor"
      output: "kg packaging supplied"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "fossil combustion without direct CO2 measurement"
      rule: "Use collected fuel, verified carbon content or an approved fuel-specific factor, oxidation basis, and documented unit conversions; identify the method and factor source in the dataset"
      inputs:
        - "fuel quantity"
        - "carbon content or factor"
        - "oxidation basis"
      output: "kg fossil CO2"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and every exchange"
      requirement: "Retain family rule, drawing revision, parent-machine application, material or formulation, supplier or destination, resolved Tiangong identity, and proxy rationale."
      evidence: "release record, bill of materials, supplier specification, manifest, UUID audit"
    - id: dq_route
      applies_to: "boundary and process map"
      requirement: "Identify every actual operation, outsourced operation, and atomic exchange not prelisted here."
      evidence: "route sheet, process flow, work instructions, supplier service records"
    - id: dq_measurement
      applies_to: "quantities"
      requirement: "Use calibrated meters and scales where available; document estimation, conversion, allocation, reference conditions, concentration, stock change, and uncertainty."
      evidence: "calibration, meter log, laboratory result, calculation worksheet"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Use a continuous representative period and disclose shutdowns, startup lots, abnormal rejects, rework, and capacity utilization."
      evidence: "dated production, meter, stock, inspection, and waste records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile material and output mass and explain gaps; add each actual material, energy, chemical, gas, waste, wastewater, and elementary emission as a separate row."
      evidence: "mass-balance worksheet and completeness checklist"
    - id: dq_ranges
      applies_to: "important flows"
      requirement: "Until two independent boundary-compatible original sources support an external range, use foreground collection without a numerical default and flag comparisons for review."
      evidence: "unresolved range-evidence register and foreground records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Fail if output is outside the covered boundary, the reference UUID differs, or required product, material, route, quality, geography, technology, or period qualifiers are missing."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Require exactly 1,000 kg net conforming product after normalization; exclude packaging, rejects, scrap, and work in progress."
    source_ids: []
  - rule_id: validate_inventory_atomicity
    applies_to: "process inventory"
    rule: "Fail any combined or umbrella Selected flow; require one direction, flow type, property, unit, amount method, and applicability condition per exchange."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Require UUID, English and official Chinese names, flow type, classification, property, unit group, and product state to match; unresolved rows remain UUID-empty with documented reasons."
    source_ids: []
  - rule_id: validate_energy_gas
    applies_to: "electricity and gases"
    rule: "Require electricity conversion and gas reference conditions, purity or composition, supply boundary, geography, and allocation."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "material and output records"
    rule: "Require a mass balance and explanation for measurement loss, stock change, scrap, waste, emissions, and unreconciled difference."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Require allocation hierarchy, driver, factor, period, products, and sensitivity; reject undocumented allocation or double credit for scrap."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_ranges
    applies_to: "numerical external ranges"
    rule: "Reject an inferred range unless at least two independent original sources have compatible boundaries, functional unit, and product state and the synthesis explains geographic and technological differences."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review and publication"
  downstream_use: "Foreground process modelling of the declared covered part or weighing-machine weight and compatible lifecycle-model aggregation"
  allowed_use: "Declared product subtype, material, route, quality, geography, technology, packaging boundary, and period, or a documented representative average of compatible records"
  excluded_use: "Complete machinery, unrelated parts, different materials or routes without adjustment, use, maintenance, distribution, end-of-life, or materially different geography or technology"
  required_metadata: "PCR id and version when published; reference UUID; subtype; family rule; parent application; material and recycled content; net mass; drawing and specification; route; site; geography; technology; period; operations; packaging; upstream datasets and proxies; allocation"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; representativeness; mass balance; allocation shares; missing or estimated exchanges; unresolved UUIDs; emission methods; upstream proxies; uncertainty and review status"
  update_trigger: "Change in family, material, recycled content, supplier, route, heat or surface treatment, packaging, site, energy, emission control, allocation, upstream dataset, or material shift in yield, scrap, water, energy, or emissions"
