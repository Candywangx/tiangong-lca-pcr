allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Shared manufacturing processes"
    rule: "Avoid allocation by submetering, work-order material issue, direct labour or machine-time records, and separate waste weighing for the reference machine."
    source_ids:
      - epd-international-machine-tools-pcr-2012-02-v4
  - rule_id: allocation_physical
    applies_to: "Residual shared burdens"
    rule: "When subdivision is not practicable, allocate fabrication electricity by measured machine-hours or equipment energy drivers, coating burdens by coated area, assembly burdens by recorded labour or station time, and handling burdens by handled mass; disclose the selected causal relationship."
    source_ids:
      - epd-international-machine-tools-pcr-2012-02-v4
  - rule_id: allocation_economic_fallback
    applies_to: "Non-causal residual burdens"
    rule: "Use economic allocation only when no defensible physical relationship exists; report the value basis, reference period, affected share, and a sensitivity result."
    source_ids:
      - epd-international-machine-tools-pcr-2012-02-v4
  - rule_id: waste_burden
    applies_to: "Manufacturing waste"
    rule: "Assign collection and treatment burdens to the product system until the selected waste flow reaches its documented end-of-waste point; do not credit recycling without a separately declared method."
    source_ids:
      - epd-international-machine-tools-pcr-2012-02-v4
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "frame_fabrication_machine_assembly_test"
      flow_role: "Installed material and component inputs"
      record_type: "ERP receipt, approved bill of materials, issue/return record, supplier mass declaration, and acceptance record"
      raw_fields: "work_order; part_id; supplier; material_or_component; grade_or_model; gross_mass; returned_mass; installed_mass; geography; acceptance_status"
      collection_method: "Reconcile accepted BOM quantities to weighed or supplier-declared masses and subtract documented returns"
      unit: "kg"
      frequency: "Each accepted machine or homogeneous production batch"
      temporal_coverage: "Complete reporting period, normally at least 12 consecutive months or all units in a shorter disclosed campaign"
      site_scope: "All manufacturer-controlled sites producing the declared machines"
      aggregation_rule: "Sum accepted installed masses by row and divide by accepted net machine mass, then multiply by 1,000 kg"
      quality_evidence: "Approved BOM revision, receiving record, scale calibration or supplier declaration, and work-order reconciliation"
    - protocol_id: cp_factory_electricity
      process_id: "frame_fabrication_machine_assembly_test"
      flow_role: "Purchased electricity"
      record_type: "Revenue meter, submeter, test log, and production work-order record"
      raw_fields: "meter_id; opening_reading; closing_reading; test_kWh; operating_hours; work_order; accepted_mass; grid_geography; voltage; supplier_product; losses_boundary"
      collection_method: "Prefer dedicated submeters; otherwise subtract excluded loads and allocate the remaining meter difference using documented equipment power-hours"
      unit: "kWh"
      frequency: "Per work order or test, aggregated monthly"
      temporal_coverage: "Same period as accepted production; disclose shutdowns and abnormal tests"
      site_scope: "All reporting-facility meters serving included processes"
      aggregation_rule: "Convert kWh to MJ and normalize to 1,000 kg accepted net machine mass under calc_allocate_shared_electricity"
      quality_evidence: "Meter calibration or utility invoice, allocation workbook, test record, and meter-boundary diagram"
    - protocol_id: cp_fabrication_scrap
      process_id: "frame_fabrication"
      flow_role: "Low-alloy steel scrap output"
      record_type: "Waste scale ticket, scrap-bin log, material issue record, and treatment receipt"
      raw_fields: "alloy_grade; work_order; gross_bin_mass; tare_mass; contamination; destination; treatment; accepted_frame_mass"
      collection_method: "Weigh segregated low-alloy scrap and reconcile it to steel issued and accepted frame mass"
      unit: "kg"
      frequency: "Each shipment with work-order attribution; aggregate monthly"
      temporal_coverage: "Same period as in-house frame fabrication"
      site_scope: "Reporting-facility fabrication area and outbound waste boundary"
      aggregation_rule: "Sum attributable net scrap mass and normalize to 1,000 kg accepted net machine mass"
      quality_evidence: "Calibrated scale ticket, segregation inspection, mass-balance reconciliation, and treatment receipt"
    - protocol_id: cp_packaging_bom
      process_id: "delivery_packaging"
      flow_role: "Softwood packaging input"
      record_type: "Packaging BOM, purchase record, moisture measurement, and packing checklist"
      raw_fields: "work_order; wood_type; treatment; wet_mass; moisture_content; dry_basis_mass; reusable_status; accepted_machine_mass"
      collection_method: "Weigh lumber or reconcile piece dimensions and density, then convert to the declared mass basis"
      unit: "kg"
      frequency: "Each packed machine"
      temporal_coverage: "Complete reporting period"
      site_scope: "Final packing area"
      aggregation_rule: "Sum packaging lumber applied to accepted machines and normalize to 1,000 kg accepted net machine mass"
      quality_evidence: "Packing checklist, scale or dimensional record, moisture record, and purchase specification"
    - protocol_id: cp_product_mass_acceptance
      process_id: "delivery_packaging"
      flow_role: "Reference machine output"
      record_type: "Final acceptance certificate, calibrated scale or reconciled engineering mass statement, and serial-number register"
      raw_fields: "serial_number; configuration; net_machine_mass; packaging_mass; acceptance_date; accepted_status"
      collection_method: "Determine net accepted machine mass separately from packaging and rejected or reworked units"
      unit: "kg"
      frequency: "Each accepted machine"
      temporal_coverage: "Complete reporting period"
      site_scope: "Factory-gate output boundary"
      aggregation_rule: "Sum accepted net machine mass; all reported flows are normalized to exactly 1,000 kg"
      quality_evidence: "Acceptance certificate, serial-number register, weighing evidence, and packaging subtraction record"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = attributable batch amount × 1,000 kg / accepted net machine mass represented by the batch"
      inputs:
        - "attributable row amount"
        - "accepted net machine mass"
      output: "Row amount per 1,000 kg reference machine"
      source_ids: []
    - id: calc_allocate_shared_electricity
      applies_to: "fabrication_electricity; assembly_test_electricity"
      rule: "included kWh = submetered kWh, or facility meter difference minus documented excluded loads multiplied by the causal equipment power-hour share; normalized MJ = included kWh × 3.6 × 1,000 / accepted net machine mass"
      inputs:
        - "meter readings"
        - "excluded loads"
        - "equipment power and time"
        - "accepted net machine mass"
      output: "MJ per 1,000 kg reference machine"
      source_ids: []
    - id: calc_scrap_reconciliation
      applies_to: "low_alloy_steel_scrap"
      rule: "attributable scrap = weighed segregated low-alloy scrap reconciled to issued steel minus returned stock and accepted incorporated steel"
      inputs:
        - "issued steel"
        - "returned stock"
        - "accepted incorporated steel"
        - "weighed scrap"
      output: "kg low-alloy steel scrap per 1,000 kg reference machine"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference machine and components"
      requirement: "Match serial number, configuration, BOM revision, supplier model, and all required qualifiers to the accepted product; do not mix metal/glass rolling machinery or separate parts into the output."
      evidence: "Acceptance certificate, serial register, approved BOM, purchase specification, and supplier records"
    - id: dq_measurement
      applies_to: "Mass and electricity"
      requirement: "Use calibrated instruments or auditable supplier declarations; retain raw units, conversion factors, meter boundaries, tare corrections, and packaging subtraction."
      evidence: "Calibration certificates, invoices, scale tickets, meter diagrams, and calculation workbook"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a period representative of current production, normally at least 12 consecutive months; a shorter campaign shall include all accepted units and disclose why it is representative."
      evidence: "Dated production register, meter series, and completeness check"
    - id: dq_completeness
      applies_to: "Product mass and included processes"
      requirement: "Reconcile BOM mass, installed components, initial lubricant, packaging, fabrication scrap, and accepted output; explain every excluded material or activity and quantify its known mass share."
      evidence: "Mass-balance worksheet, exclusion register, and reviewer sign-off"
    - id: dq_background
      applies_to: "Upstream datasets"
      requirement: "Select datasets consistent with supplier geography, production technology, alloy or component state, electricity product, and reference year; disclose proxies and their contribution."
      evidence: "Dataset mapping table and representativeness assessment"
    - id: dq_primary_data
      applies_to: "Core processes"
      requirement: "Use site-specific data for manufacturer-controlled fabrication, assembly, testing, packaging, and waste management."
      evidence: "Work orders, BOM records, meter data, packaging records, and waste tickets"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Product identity"
    rule: "Reject a data package that lacks the processed-material family, machine configuration, net mass, roll specification, installed power, control architecture, frame route, factory location, reporting period, and acceptance boundary."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference
    applies_to: "Reference flow"
    rule: "Require exactly 1,000 kg accepted net machine mass after normalization, with packaging mass excluded from the reference amount and reported separately."
    source_ids: []
  - rule_id: validate_route
    applies_to: "Frame supply"
    rule: "Reject double counting of the same principal frame mass under both steel_plate and purchased_coated_machine_structure; mixed sourcing requires measured mass shares."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "Electricity"
    rule: "Require raw kWh, the 3.6 MJ/kWh conversion, grid geography, voltage, supplier product, allocation basis, and treatment of losses; exclude use-stage electricity."
    source_ids:
