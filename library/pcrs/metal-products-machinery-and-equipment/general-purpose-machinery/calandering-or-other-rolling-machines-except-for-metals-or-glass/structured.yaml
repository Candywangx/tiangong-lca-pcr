  - rule_id: validate_mass_balance
    applies_to: "Materials and waste"
    rule: "Reconcile accepted product mass with installed BOM mass and explain differences, including removed machining mass, consumables, packaging, waste, returned stock, and measurement uncertainty."
    source_ids: []
  - rule_id: validate_uuid_gaps
    applies_to: "Unresolved identities"
    rule: "Keep the product-flow UUID, calender-roll-assembly UUID, and softwood-packaging-lumber UUID blank until an exact public state-100 identity is directly verified; never substitute a glass product, generic instrument, hardwood, or fibreboard candidate."
