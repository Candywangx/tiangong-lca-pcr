measurement_rules:
  - id: reference_mass
    applies_to: "Reference machine and all mass-normalized material and waste rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record net machine mass after factory acceptance and before delivery packaging; normalize all amounts by multiplying the batch amount by 1,000 kg divided by total accepted net machine mass."
  - id: packaging_separation
    applies_to: "Delivery packaging"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
