validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the output UUID, Mass property, mass unit group, 1 kg amount, part identifier, host-equipment role, and market state are mutually consistent."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_route_inventory
    applies_to: "Process map and inventory"
    rule: "Verify that every operation performed for the declared route is identified and that its materials, energy, gases, water, wastes, and direct emissions are recorded as atomic rows."
    source_ids:
      - us-epa-metal-fabrication-finishing-2008
  - rule_id: validate_mass_reconciliation
    applies_to: "Materials, accepted output, scrap, and stored work in progress"
    rule: "Reconcile input material mass with accepted output, segregated scrap, rejected product, process losses, and stock change; explain residuals."
    source_ids: []
  - rule_id: validate_energy_and_gases
    applies_to: "Electricity, natural gas, oxygen, and argon"
    rule: "Confirm meters, invoices, cylinder balances, reference conditions, conversion factors, and allocation drivers cover the same period as accepted output."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "Fossil CO2, particulate matter, and NMVOC"
    rule: "Confirm the emission method uses collected activity data or representative tests, accounts for verified abatement, and excludes upstream electricity emissions from direct outputs."
    source_ids:
      - us-epa-metal-fabrication-finishing-2008
  - rule_id: validate_allocation
    applies_to: "Shared processes"
    rule: "Confirm subdivision was attempted first and every retained allocation driver has a documented causal basis and sensitivity where material."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_data_quality
    applies_to: "Dataset package"
    rule: "Confirm completeness, methodological consistency, technology, geography, time period, precision, documentation, nomenclature, and review disclosures are present."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; may serve as background_dataset after independent review and release controls"
  downstream_use: "Construction of process or lifecyclemodel records for covered furnace, oven, burner, stoker, grate, ash-discharger, induction-heating, dielectric-heating, and non-electric bakery-oven parts"
  allowed_use: "Use for the declared part family, material grades, route, site geography, technology, period, and factory-gate boundary when all required qualifiers and data-quality disclosures match"
  excluded_use: "Complete equipment; unidentified generic machinery parts; different material or coating systems without adjustment; installation, use, maintenance, or end-of-life; comparative claims without functional-performance and lifetime equivalence"
  required_metadata: "PCR id and version; part identifier; drawing revision; host equipment and function; material composition and grades; production route; included operations; factory-gate geography; reporting period; accepted mass; packaging inclusion; upstream dataset links; allocation method"
  required_quality_disclosure: "Record coverage and reconciliation; measurement and allocation methods; uncertainty; data gaps; exclusions; technology, geography, time, and precision assessment; unresolved UUID or range limitations"
  update_trigger: "Material change to drawing, host-equipment function, bill of materials, grade, route, coating, energy or gas supply, abatement, site, allocation method, or reporting period; new reviewed UUID or quantitative evidence"
