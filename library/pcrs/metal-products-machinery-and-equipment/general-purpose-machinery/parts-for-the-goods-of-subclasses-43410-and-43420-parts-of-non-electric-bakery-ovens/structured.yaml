allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared fabrication, finishing, and utility processes"
    rule: "Prefer direct metering or subdivision by part family, production order, machine time, or batch so inputs and outputs attributable to the declared part are isolated."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_physical_relationship
    applies_to: "Shared processes that cannot be subdivided"
    rule: "Allocate using a documented causal physical relationship such as machine time, coating area, weld length, treated mass, or accepted output mass that represents the shared process driver."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_economic_fallback
    applies_to: "Shared processes lacking a defensible physical relationship"
    rule: "Use economic allocation only as a documented fallback, disclose prices, period, currency, and sensitivity, and do not use it to hide missing production records."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_scrap_treatment
    applies_to: "Metal scrap and other wastes"
    rule: "Report waste mass and treatment destination separately; do not assign an avoided-burden credit inside this gate-to-gate foreground unless the governing downstream study method explicitly requires and documents it."
    source_ids:
      - ec-pef-method-2021
