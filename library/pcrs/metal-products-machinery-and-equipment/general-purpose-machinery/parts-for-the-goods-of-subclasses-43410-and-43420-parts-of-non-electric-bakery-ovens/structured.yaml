        - "Fuel use"
        - "fuel carbon content"
        - "oxidation factor"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_period_reconciliation
      applies_to: "Shared input and waste records"
      rule: "net period amount = purchases or shipments + opening stock - closing stock - documented returns, with signs adjusted to the record type"
      inputs:
        - Purchase
        - shipment
        - return
        - "and stock records"
      output: "Net amount attributable to the reporting period"
