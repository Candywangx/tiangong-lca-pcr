        - temperature
        - pressure
        - "compressibility if used"
      output: "m3 at declared reference conditions"
      source_ids: []
    - id: calc_water_mass
      applies_to: "Water and aqueous wastewater"
      rule: "mass = measured volume × documented density when direct mass is unavailable"
      inputs:
        - "Measured volume"
        - density
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_direct_co2
      applies_to: "Fossil CO2 output"
      rule: "Apply a verified fuel-carbon and oxidation calculation to collected fuel use; exclude upstream fuel and electricity emissions"
