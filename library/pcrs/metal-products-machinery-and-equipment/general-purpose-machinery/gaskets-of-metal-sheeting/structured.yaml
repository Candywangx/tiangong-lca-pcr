  - rule_id: validation_wastes
    applies_to: "waste and emission outputs"
    rule: "Verify that steel scrap, graphite offcuts, PTFE offcuts, spent coolant, spent alkaline liquor, and particulate emissions are kept atomic and that omitted conditional rows are demonstrably absent."
    source_ids: []
