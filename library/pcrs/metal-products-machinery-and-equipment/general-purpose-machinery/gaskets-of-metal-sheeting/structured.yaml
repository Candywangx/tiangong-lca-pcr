  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "every inventory row"
      rule: "normalized amount = period amount attributable to the product divided by net mass of conforming finished gasket output"
      inputs:
        - "attributable period amount"
        - "conforming finished-product net mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "electricity in MJ = metered electricity in kWh multiplied by 3.6"
      inputs:
        - "metered kWh"
      output: "MJ of purchased electricity"
      source_ids:
        - si-energy-conversion
    - id: calc_pure_naoh
      applies_to: "sodium hydroxide row"
      rule: "pure-product-equivalent sodium hydroxide = cleaning-solution mass multiplied by measured sodium hydroxide mass fraction"
      inputs:
        - "solution mass"
        - "sodium hydroxide mass fraction"
      output: "kg sodium hydroxide product equivalent"
      source_ids:
        - mass-balance-identity
    - id: calc_internal_transfer
      applies_to: "metal gasket blank rows"
      rule: "transferred blank output plus closing work-in-progress minus opening work-in-progress must reconcile with blank input to assembly over the same period"
      inputs:
        - "blank output"
        - "blank input"
        - "opening and closing work-in-progress"
      output: "reconciled internal transfer difference"
      source_ids:
        - mass-balance-identity
    - id: calc_material_balance
      applies_to: "each process and full foreground"
      rule: "input mass = product mass plus separately identified waste and emission mass plus closing stock minus opening stock; investigate rather than force unexplained difference to zero"
      inputs:
        - "atomic material inputs"
        - products
        - wastes
        - emissions
        - "stock changes"
      output: "disclosed mass-balance difference"
      source_ids:
        - mass-balance-identity
