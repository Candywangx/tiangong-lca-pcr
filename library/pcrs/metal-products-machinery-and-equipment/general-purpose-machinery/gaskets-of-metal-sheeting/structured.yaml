allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "foreground processes"
    rule: "Prefer direct metering, lot records, and process subdivision. Keep internal metal-gasket-blank transfers neutral in the combined product system and do not assign upstream burden twice."
    source_ids: []
  - rule_id: allocation_shared_resources
    applies_to: "shared electricity and auxiliaries"
    rule: "When direct measurement is unavailable, allocate shared resources using a documented causal driver such as machine operating time, measured power multiplied by operating time, or processed mass; use product mass only when no more causal driver is available."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recyclable metal scrap"
    rule: "Report segregated scrap as a waste output at the plant gate. Apply no avoided-burden credit in the foreground unless the chosen background database and study method explicitly require it; disclose any recycled-content or end-of-life allocation convention and prevent double credit."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "internal rejects and rework"
    rule: "Return internal rework to the consuming operation without treating it as a co-product; include its additional energy and material use and report only rejects that leave the system as waste."
    source_ids: []
