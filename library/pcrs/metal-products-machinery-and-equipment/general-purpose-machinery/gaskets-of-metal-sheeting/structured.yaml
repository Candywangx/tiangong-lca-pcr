    applies_to: "process map and inventory"
    rule: "Require both sheet_preparation and forming_assembly_finishing inventories, with each row located under the correct direction and flow type and each conditional zero supported by route evidence."
    source_ids: []
  - rule_id: validation_internal_transfer
    applies_to: "metal gasket blanks"
    rule: "Require the same blank UUID and mass basis for output and input, reconcile work-in-progress stock change, and prevent the internal transfer from appearing as an external reference product."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "mass-bearing rows"
    rule: "Recalculate process and full-foreground mass balances from raw records; investigate and disclose unexplained differences without creating an unspecified material or waste flow."
