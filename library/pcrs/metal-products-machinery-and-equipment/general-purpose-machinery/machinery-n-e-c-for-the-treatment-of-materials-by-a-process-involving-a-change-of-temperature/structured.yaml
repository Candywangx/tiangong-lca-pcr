measurement_rules:
  - id: measurement_reference_mass
    applies_to: "reference product and mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use the measured net dry mass of machines that passed final acceptance. Exclude external transport packaging, installation materials, loose service tools, and process material used only for testing. Normalize all foreground exchanges to 1,000 kg accepted machinery."
  - id: measurement_item_conversion
    applies_to: "records reported per machine or component"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts with model-specific measured mass per item and retain the count, sampled masses, sampling date, and weighted-average calculation."
  - id: measurement_electricity
    applies_to: "purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity in its original unit and convert kWh to MJ using 1 kWh = 3.6 MJ; disclose voltage, grid geography, onsite generation, and whether losses are included."
  - id: measurement_gas_volume
    applies_to: "gaseous natural gas and industrial oxygen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report supplier-metered volume at the documented reference temperature and pressure. Do not combine gases, and do not convert volume to mass without documented composition, density, and reference conditions."
  - id: measurement_water_mass
    applies_to: "process water and cleaning wastewater"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer direct mass records. When converting measured volume, retain volume, temperature, density source, and calculation; do not equate water input with wastewater output without measured losses or a documented balance."
