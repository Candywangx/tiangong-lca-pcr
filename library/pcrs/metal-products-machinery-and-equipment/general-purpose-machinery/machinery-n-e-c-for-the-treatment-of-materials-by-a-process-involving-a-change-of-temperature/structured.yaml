allocation_rules:
  - rule_id: allocation_01
    applies_to: "dedicated product operations"
    rule: "Avoid allocation by using dedicated meters, batch records, work orders, and subdivision of independently measurable operations."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: allocation_02
    applies_to: "shared site utilities and operations"
    rule: "When subdivision is not possible, allocate shared burdens with a documented physical causal driver such as metered energy, cutting time, welding time, test duration, or machine-hours. Use mass only when it reasonably represents causality and disclose a sensitivity check for material shared burdens."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: allocation_03
    applies_to: "scrap and wastewater"
    rule: "Report scrap and wastewater at the foreground boundary without avoided-burden credits. Model treatment, recycling, recovered material, and any substitution consistently in the downstream system and prevent double counting with upstream recycled-content datasets."
    source_ids:
      - eu-recommendation-2021-2279-pef
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_component_records
      process_id: "machinery_manufacture"
      flow_role: "steel sheet, rock wool, electronic control unit, accepted product"
      record_type: "purchase and issue records; bill of materials; unit mass; accepted-unit records"
      raw_fields: "material or component identity; grade/model; supplier; purchased mass; returned mass; installed count; sampled unit mass; accepted product mass"
      collection_method: "Reconcile procurement, stores issues, engineering bill of materials, and final acceptance weighing by product model."
      unit: "kg; item(s) as raw count"
      frequency: "each production lot; monthly reconciliation"
      temporal_coverage: "Representative reporting period covering normal production and rework"
      site_scope: "All sites and outsourced steps included in the declared foreground boundary"
      aggregation_rule: "Sum net issued mass or verified count-times-mass by model; allocate with work orders; normalize to 1,000 kg accepted product."
      quality_evidence: "supplier documents; calibrated scales; signed work orders; bill-of-material revision; acceptance records"
    - protocol_id: cp_utility_and_consumable_records
      process_id: "machinery_manufacture"
      flow_role: "electricity, oxygen, water, sodium hydroxide, carbon dioxide shielding gas"
      record_type: "meters; invoices; cylinder balances; batch sheets; chemical certificates"
      raw_fields: "opening and closing meter or cylinder readings; purchases; returns; concentration; reference temperature and pressure; equipment hours"
      collection_method: "Prefer submetering; otherwise reconcile site totals and allocate with causal equipment or work-order drivers."
      unit: "MJ, m3, kg, concentration fraction"
      frequency: "continuous or per batch, reconciled monthly"
      temporal_coverage: "Same reporting period as accepted production"
      site_scope: "Each included manufacturing site"
      aggregation_rule: "Net use equals opening stock plus purchases minus closing stock, returns, and documented exports; apply concentration and unit conversions before normalization."
      quality_evidence: "calibration records; invoices; cylinder tickets; bath analyses; operator logs"
    - protocol_id: cp_factory_test_records
      process_id: "machinery_manufacture"
      flow_role: "natural gas and diesel test fuel"
      record_type: "acceptance-test logs; calibrated meters; tank or cylinder records"
      raw_fields: "product serial number; test type; start/end readings; fuel returned; reference conditions; test duration; pass/fail result"
      collection_method: "Link each included test to accepted serial numbers and exclude development tests not attributable to saleable production."
      unit: "m3 natural gas; kg diesel"
      frequency: "each test"
      temporal_coverage: "Same reporting period as accepted production"
      site_scope: "Every site performing factory acceptance testing"
      aggregation_rule: "Sum net fuel by accepted product model; separately report failed-test and rework burdens before allocation."
      quality_evidence: "test procedure; meter calibration; signed test report; fuel reconciliation"
    - protocol_id: cp_waste_and_emission_records
      process_id: "machinery_manufacture"
      flow_role: "steel scrap, cleaning wastewater, direct carbon dioxide, particulate matter, nitrogen oxides"
      record_type: "weigh tickets; wastewater meters; manifests; stack or workplace measurements; fuel analyses; emission calculations"
      raw_fields: "waste identity; gross/tare mass; wastewater mass and composition; destination; fuel amount; carbon content; measured concentration; gas flow; operating hours; abatement status"
      collection_method: "Measure releases and wastes directly where feasible; otherwise use documented site calculations based on collected activity data and applicable factors."
      unit: "kg"
      frequency: "each shipment, discharge, or test; aggregated monthly"
      temporal_coverage: "Same reporting period as accepted production"
      site_scope: "All emission points and waste handovers in the declared foreground boundary"
      aggregation_rule: "Sum measured exchanges by identity; calculate direct emissions from collected records without including upstream supply-chain emissions; normalize to reference flow."
      quality_evidence: "laboratory reports; calibrated instruments; manifests; calculation workbook; reviewer sign-off"
  calculation_rules:
    - id: calculation_01
      applies_to: "all foreground exchanges"
      rule: "normalized amount = attributable exchange amount / accepted net dry machinery mass × 1,000 kg"
      inputs:
        - "attributable exchange amount"
        - "accepted net dry machinery mass"
      output: "exchange amount per 1,000 kg reference product"
      source_ids:
        - eu-recommendation-2021-2279-pef
    - id: calculation_02
      applies_to: "electricity"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calculation_03
      applies_to: "sodium hydroxide"
      rule: "active sodium hydroxide mass = net solution mass × measured or supplier-certified NaOH mass fraction"
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: calculation_04
      applies_to: "direct fossil carbon dioxide"
      rule: "Calculate only from collected test-fuel use and a documented supplier, regulatory, or measured fossil-carbon factor; retain factor source, oxidation assumption, and units."
      inputs:
        - "natural-gas volume or diesel mass"
        - "fuel composition or carbon factor"
        - "oxidation assumption"
      output: "kg fossil carbon dioxide to air"
      source_ids: []
    - id: calculation_05
      applies_to: "material balance"
      rule: "Reconcile net purchased material with accepted-product incorporation, scrap, returned stock, and measured losses by material identity; investigate rather than silently allocate unexplained imbalance."
      inputs:
        - "net material issued"
        - "installed material"
        - scrap
        - returns
        - "measured losses"
      output: "material-balance residual and reconciliation status"
      source_ids:
        - eu-recommendation-2021-2279-pef
  data_quality_requirements:
    - id: quality_01
      applies_to: "product identity"
      requirement: "Retain drawings, specifications, principal thermal function, treated material, classification rationale, product model, and acceptance status proving the product fits this residual category."
      evidence: "controlled specification; classification review; acceptance certificate"
    - id: quality_02
      applies_to: "technological representativeness"
      requirement: "Record fabrication, joining, insulation, cleaning, control, energy-carrier, and test technologies actually used; do not average incompatible routes without separate activity data and disclosed weighting."
      evidence: "route-specific work orders; process map; production-weight calculation"
    - id: quality_03
      applies_to: "temporal and geographical representativeness"
      requirement: "Use a representative reporting period and identify every production site, electricity geography, supplier geography, and material data vintage; justify gaps and substitutions."
      evidence: "reporting-period reconciliation; site list; upstream dataset metadata"
    - id: quality_04
      applies_to: "completeness"
      requirement: "Account for every inventory card as measured, calculated, zero with evidence, not applicable with a stated route reason, or unresolved; do not use an unreported cutoff for hazardous releases or direct emissions."
      evidence: "signed completeness matrix; meter and purchase reconciliation; unresolved register"
    - id: quality_05
      applies_to: "measurement and calculation"
      requirement: "Retain instrument calibration, source documents, unit conversions, allocation drivers, formulas, emission factors, and independent review of manual calculations."
      evidence: "calibration certificates; invoices; controlled workbook; reviewer sign-off"
validation_rules:
  - rule_id: validation_01
    applies_to: "category and reference flow"
    rule: "Confirm the machine is complete, non-household, principally treats material by temperature change, is not in an excluded specific category, and declares every required qualifier before accepting the reference flow."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-explanatory-notes-2025
      - eu-regulation-2025-392
  - rule_id: validation_02
    applies_to: "process and exchange completeness"
    rule: "Confirm every included site operation and every atomic exchange card has a status, amount basis, evidence kind, and route explanation; reconcile purchases, meters, wastes, and accepted production."
    source_ids:
      - eu-recommendation-2021-2279-pef
  - rule_id: validation_03
    applies_to: "mass normalization"
    rule: "Confirm accepted net dry product mass is positive and all reported amounts are normalized to exactly 1,000 kg without including transport packaging, loose tools, or test material in reference-product mass."
    source_ids: []
  - rule_id: validation_04
    applies_to: "conditional test and cleaning routes"
    rule: "Natural gas, diesel, process water, sodium hydroxide, cleaning wastewater, and direct combustion emissions shall be mutually consistent with declared onsite operations and test logs; unsupported zeroes or route substitutions fail validation."
    source_ids: []
  - rule_id: validation_05
    applies_to: "direct emissions"
    rule: "Confirm fossil carbon dioxide excludes upstream energy emissions, captured dust is not reported as an elementary emission, and NOx species and compartment are not replaced by a non-equivalent UUID."
    source_ids: []
  - rule_id: validation_06
    applies_to: "UUID identity"
    rule: "Recheck UUID, state, English and Chinese baseName, flow type, classification, property, unit group, product state, geography, technology, and generalComment. Keep steel_sheet, reference_product, and nitrogen_oxides_to_air explicitly unresolved until exact state-100 identities are verified."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; may be used as background_dataset only after methodology review and representative upstream links are complete"
  downstream_use: "Foreground manufacturing process for temperature-change treatment machinery and a building block for cradle-to-gate or full-life-cycle equipment models"
  allowed_use: "Model-specific factory-gate studies with matching product boundary and qualifiers; aggregation across models only with production-weighted activity data; downstream use-stage modelling when rated function, service life, load profile, energy carrier, working fluid, maintenance, and installation are added separately."
  excluded_use: "Direct comparison of products with different thermal functions, treated materials, capacities, temperature ranges, control quality, service lives, or factory-gate configurations; use as a generic furnace, refrigerator, heat pump, air conditioner, heat exchanger, distillation plant, water heater, domestic appliance, or separately supplied part dataset."
  required_metadata: "canonical PCR id; product model and residual-category rationale; function and treated material; capacity and temperature range; technology and energy carrier; net dry mass; factory-gate configuration; service life and duty; site and geography; reporting period; allocation; upstream dataset versions; unresolved identities"
  required_quality_disclosure: "primary-data coverage; route and site representativeness; meter and scale calibration; purchased-component share; material and energy reconciliation; test programme; direct-emission method; data gaps; substitutions; uncertainty; reviewer and review date"
  update_trigger: "Change in principal function or classification, product design or material composition, manufacturing or test route, energy carrier, site or supplier geography, allocation method, emission controls, upstream data, exact UUID resolution, or evidence that materially changes results."
