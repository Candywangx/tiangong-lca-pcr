allocation_rules:
  - rule_id: allocation_driver
    applies_to: "shared utilities"
    rule: "Subdivide metered processes first. Allocate shared services by documented physical causality: actual machine time/load, test-bench energy/time and processed material when demonstrated. Capacity ratings or finished mass alone do not prove causality. If other allocation is necessary justify it and test sensitivity; allocations sum to observed totals."
    source_ids:
      - ef-allocation-2021
  - rule_id: recovery_and_rework
    applies_to: "charge; fabrication; acceptance"
    rule: "Keep rework and retest energy/materials in accepted-output burden. Internal refrigerant recovery reduces fresh demand through inventory balance, not negative virgin production; separately identify external reusable product and hazardous waste. Scrap sales alone do not establish co-product status or avoided-material credit. Apply the declared recycling treatment once."
    source_ids:
      - ef-allocation-2021
      - ipcc-ods-2006
