product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.general-purpose-machinery.air-conditioning-machines"
  classification_refs: "CPC 3.0:43912"
  covered_products: "Air-conditioning machines"
  excluded_products: "Ventilation-only fans; other refrigeration/heat-pump equipment; detached parts; services"
  representative_product: "Declared accepted complete air-conditioning sales configuration"
  production_route: "Actual conditional sheet/coil/plastic fabrication, circuit/electrical assembly, charging or dry release, factory test and packaging; route alternatives retained"
  market_state: "Accepted tested equipment at factory gate with declared modules and retained charge, installation excluded"
functional_unit:
  what: "Supply declared complete air-conditioning equipment"
  how_much: "1 kg net accepted equipment; configuration mass M connects unit BOM/test data"
  how_well: "model and delivered module schedule; stationary or vehicle application; conditioning function and fan; refrigeration-unit presence; vapour-compression, absorption or external-coil technology; cooling-only or reversible; compressor drive and inverter; coil materials and construction; rated cooling/heating capacity and test standard; refrigerant identity, blend composition and actual factory retained charge; dry or charged delivery; net mass M; declared factory starting state; make/buy boundary; factory geography, supply voltage and reference period; packaging schedule"
  how_long_or_cycle: "One factory supply; no service life or cooling-energy equivalence"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: factory_scope
      applies_to: "all processes"
      rule: "Include actual fabrication, joining, cleaning/finishing, assembly, evacuation/charging, leak/safety/functional tests, attributable rework, packaging and direct releases. Foreground starts at received stock/components; link upstream extraction/production/transport under declared provider boundary and include gate receipts not already covered. Exclude downstream installation and service energy."
      source_ids:
        - wco-hs84-2022
        - ipcc-ods-2006
    - rule_id: make_buy
      applies_to: "fabrication; assembly"
      rule: "Build a component make/buy matrix: include purchased finished coil OR its in-house metal feed/forming/joining, never both for the same coil. Apply to compressor/motor/PCBA/cabinet and absorption modules. Additional supplier-completed operations are not repeated foreground burdens."
      source_ids:
        - daikin-technology-carbon
    - rule_id: route_scope
      applies_to: "all processes"
      rule: "Use actual route conditions; no refrigeration unit does not mean no manufacturing burden, and a reversible air-conditioning heat pump is not excluded merely because it heats. An absorption cooling module is admitted only in a qualifying air-conditioning configuration with its fan/conditioning function. Record omitted operation evidence and actual other technologies before reuse."
      source_ids:
        - wco-hs84-2022
        - doe-hvac-2011
boundary_abstraction:
  declared_starting_condition: "Purchased declared raw stock, components or complete submodules received at factory"
  starting_condition_role: "Supplier-product interface; actual in-house manufacture starts here"
  product_classification_scope: "Air-conditioning machines"
  recursive_input_rule: "Purchased same-category machines/modules retain independent supplier burdens; internal rework/transfers are not new external supplies and cancel as exchanges"
  upstream_dataset_requirement: "Match component state, technology, geography/year and actual supply interface; purchased compressor includes its motor and oil unless stated otherwise"
  disclosure: "Factory gate includes all delivered modules/charge and separate packaging; installation, operation electricity/heat, use leakage and end-of-life excluded"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted complete air-conditioning machine"
    uuid: ""
  flow_property_ref:
