  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: route_completeness
      applies_to: "all processes"
      requirement: "Retain model-resolved make/buy matrix, actual material/component/chemical schedule and omitted-operation evidence. Do not extrapolate a compressor model into absorption or no-unit configuration."
      evidence: "BOM; route sheet; supplier scope; module acceptance"
    - id: identity
      applies_to: "all exchanges"
      requirement: "Resolve exact product/waste/elementary identity, property/unit, provider interface/geography and environmental compartment before complete dataset delivery; candidates remain unresolved where these are unconfirmed."
      evidence: "manifest review_metadata"
    - id: ranges
      applies_to: "all quantities"
      requirement: "No universal BOM fraction, coil ratio, unit weight, charge, manufacturing loss/GWP, energy/test duration or intensity range is supplied. Collect actual site/model evidence; distinguish absence, measured zero and unknown."
      evidence: "Weighing; meters; calibrated charging; stocks; uncertainty"
    - id: charge_disclosure
      applies_to: "charge; dispatch"
      requirement: "Specify refrigerant or absorbent identity, actual retained charge and recovery disposition for every delivered module, including dry-shipped state. Blend emission identity must match measurement, not nominal supplier composition alone."
      evidence: "Charge log; speciation; release/destination records"
validation_rules:
  - rule_id: reference_check
    applies_to: "reference_product"
    rule: "M must be positive calibrated net mass for exactly the declared delivered configuration; kg normalization, per-unit BOM/test records and all module/charge quantities share this denominator. Net product excludes packaging, temporary test media and destructive rejects."
    source_ids: []
  - rule_id: no_double_count
    applies_to: "all inventory rows"
    rule: "Check make/buy exclusivity, compressor motor/oil inclusions, internal transfers/recovery, accepted versus rejected counts, repeated tests and energy meter coverage. Purchased heat/steam and externally generated compressed air cannot duplicate the same supply. No use-stage electricity or leakage appears in factory totals."
    source_ids: []
  - rule_id: balance_check
    applies_to: "charge; fabrication; services"
    rule: "Reconcile species charge, material scrap, water and accepted mass balances with measurement uncertainty. Charge retained in equipment is not an elementary air release; external waste or recovered product is not release by default. Investigate unknown residuals and missing identity; never fill with an unverified default leak rate, GWP or zero."
    source_ids:
      - ipcc-ods-2006
  - rule_id: scope_check
    applies_to: "all processes"
    rule: "Verify technology and conditioning function independently from capacity labels. Distinct vehicle, reversible, absorption and no-refrigeration-unit forms require their actual BOM/test/charge conditions and source limitations; equal kg does not demonstrate equivalent cooling service."
    source_ids:
      - wco-hs84-2022
      - doe-hvac-2011
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Model declared factory-gate equipment production and downstream process/lifecyclemodel projections with actual supplier links"
  excluded_use: "Cooling/heating service comparison, operating lifetime electricity/leakage, installation or end-of-life without separate scenario evidence"
  required_metadata: "model and delivered module schedule; stationary or vehicle application; conditioning function and fan; refrigeration-unit presence; vapour-compression, absorption or external-coil technology; cooling-only or reversible; compressor drive and inverter; coil materials and construction; rated cooling/heating capacity and test standard; refrigerant identity, blend composition and actual factory retained charge; dry or charged delivery; net mass M; declared factory starting state; make/buy boundary; factory geography, supply voltage and reference period; packaging schedule"
  required_quality_disclosure: "BOM/make-buy coverage; supplier interface; measured M/charge; tests and allocations; missing identities; balances/uncertainty; source limitations"
  update_trigger: "Changed model/modules, coil route, working fluid, charge/drive, suppliers, factory boundary or measured production data"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Structure, 30 June 2025, subclasses 43912, 43913 and 43941. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Current classification labels and neighbouring equipment/parts boundaries; structure alone supplies no manufacturing intensity or full explanatory scope."
  - id: "unsd-cpc21-correspondence"
    type: "official_guidance"
    reference: "UNSD, CPC Version 2.1 subclass 43912 classification detail, HS 2012/2017 correspondence, retrieved 2 October 2026. https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/43912"
    used_for: "Historical same-named subclass corresponds to 841510, 841520, 841581, 841582 and 841583. Historical correspondence is supporting context, not a claim of a verified CPC3-to-HS2022 correspondence table."
  - id: "wco-hs84-2022"
    type: "official_guidance"
    reference: "WCO, HS Nomenclature 2022 Chapter 84, PDF pages 7-8, headings 8415 and 8418. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1684_2022e.pdf"
    used_for: "Fan plus temperature/humidity conditioning boundary; stationary/split, vehicle, reversible and no-refrigerating-unit forms; excludes parts and heat pumps other than air-conditioning machines. No numerical production defaults."
  - id: "doe-hvac-2011"
    type: "official_guidance"
    reference: "US DOE, Energy Savings Potential and RD&D Opportunities for Commercial Building HVAC Systems, September 2011, Appendix B.1 Advanced Absorption Pairs, printed page 183 / PDF page 199. https://www.energy.gov/sites/prod/files/2014/07/f17/commercial_hvac_research_opportunities.pdf"
    used_for: "Heat-driven absorption and ammonia-water/water-lithium-bromide working pairs. Commercial HVAC research report; heat sources describe operation, not mandatory manufacturing energy inputs; no numerical energy savings adopted."
  - id: "daikin-technology-carbon"
    type: "extension_guidance"
    reference: "Daikin, Challenge for Carbon Neutrality, Energy-Saving Technologies: Motors/Inverters and Refrigerant-Saving Technologies, retrieved 2 October 2026. https://www.daikin.com/about/corporate/tic/technology/carbon"
    used_for: "Compressor/fan motor and inverter distinctions; cross-fin and all-aluminium microchannel coil alternatives. Manufacturer examples do not prescribe all products, composition, charge or factory energy. Magnetic cooling discussion is prospective, not demonstrated routine production."
  - id: "ipcc-ods-2006"
    type: "official_guidance"
    reference: "IPCC, 2006 Guidelines Volume 3 Chapter 7, section 7.5 Refrigeration and Air Conditioning, manufacturing versus operation/disposal and charge accounting. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_7_Ch7_ODS_Substitutes.pdf"
    used_for: "Separate refrigerant banking and charging losses across lifecycle stages; national default charge/leakage factors are not adopted as plant measurements or QA limits. No GWP factors prescribed."
  - id: "ef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02021H2279-20211230"
    used_for: "Subdivision, physical-causality and justified other-relationship allocation hierarchy only; no claim of full PEF conformance."
