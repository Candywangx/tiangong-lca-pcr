  []
measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: energy_units
    applies_to: "Factory energy"
    required_property_ref:
      name: "Electrical energy or delivered heat"
      uuid: ""
    required_unit: "kWh; MJ"
    rule: "Retain meter units. 1 kWh = 3.6 MJ; cooling/heating capacity is a qualifier and is not electrical input. Steam conversion uses actual delivered/returned enthalpy."
  - id: species_balance
    applies_to: "Charge and releases"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Balance each refrigerant or working-pair constituent by stock, receipts, retained accepted charge, sample/reject trapped charge, external recovery/waste transfer and measured release; unexplained residual remains a gap, not an assumed emission factor."
process_map:
  - id: fabrication
    name: "Conditional cabinet, coil and plastic fabrication"
    inclusion: "conditional"
    inclusion_condition: "For actual in-house operations: blank/stamp/bend sheet, cut/bend/expand copper tubes and press fins, or form/join aluminium microchannels; mould housings if granulate enters; degrease, powder-coat and cure actual surfaces. Purchased fabricated parts bypass the corresponding input material and operation."
    role: "Manufacturing foreground"
    quantitative_reference: "1 kg reference flow"
  - id: assembly
    name: "Mechanical, electrical and fluid-circuit assembly"
    inclusion: "required"
    inclusion_condition: "Fit actual fan, drive, compressor or absorption module, coils, valves, sensors and controls; connect tubing by actual brazing/welding/mechanical joining; preserve serial/module configuration. Reversibility adds actual reversing valve and controls."
    role: "Manufacturing foreground"
    quantitative_reference: "1 kg reference flow"
  - id: charge
    name: "Circuit evacuation, pressure testing and factory charging"
    inclusion: "conditional"
    inclusion_condition: "For actual sealed refrigeration/absorption circuits: record test gas, evacuation, charge, captured refrigerant, residual stocks, releases and discarded charge. Dry-delivered external-coil machines do not acquire fictional refrigerant charge."
    role: "Manufacturing foreground"
    quantitative_reference: "1 kg reference flow"
  - id: acceptance
    name: "Electrical safety, leakage and functional acceptance"
    inclusion: "required"
    inclusion_condition: "Record actual leak/safety/functional test sequence and rework. Reversible models test declared modes; absorption tests record actual thermal supply; external-coil tests record supplied hot/chilled water. Destructive sampled units are not accepted sale output."
    role: "Manufacturing foreground"
    quantitative_reference: "1 kg reference flow"
  - id: dispatch
    name: "Final protection, packaging and factory release"
    inclusion: "required"
    inclusion_condition: "Verify complete delivered sales configuration, including every specified indoor/outdoor module or vehicle-conditioning unit; weigh net equipment, retained charge and packaging separately. Record actual dry/charged release state."
    role: "Manufacturing foreground"
    quantitative_reference: "1 kg reference flow"
  - id: services
    name: "Shared utilities and pollution controls"
    inclusion: "required"
    inclusion_condition: "Allocate actual compressed-air, vacuum, cooling-water and effluent/air-control burdens once. External purchased compressed air or supplied test heat is distinct from internally generated utilities."
    role: "Manufacturing foreground"
    quantitative_reference: "1 kg reference flow"
