allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared manufacturing operations"
    rule: "Prefer subdivision and direct metering by machine, operation, production order, or lot. Where direct metering is unavailable, allocate shared inputs and outputs using a documented causal driver such as machine time, processed mass, or measured power-time."
    source_ids: []
  - rule_id: allocation_rejects_rework
    applies_to: "rejects and rework"
    rule: "Include the inputs and outputs of internal rework in the reported lot. Exclude rejected mass from accepted reference output and disclose whether it is reworked, recycled, or discarded."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "post-industrial steel scrap"
    rule: "Treat segregated steel scrap as a waste output at the factory gate. Do not subtract an avoided-virgin-material credit inside this attributional foreground inventory; disclose any downstream recycling model separately."
    source_ids: []
  - rule_id: allocation_multi_product
    applies_to: "unavoidable shared multi-product operation"
    rule: "If subdivision and causal allocation are not feasible, use a documented mass allocation for materially similar outputs; use economic allocation only when physical causality is demonstrably unsuitable, and report the prices, period, and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input
      process_id: "part_manufacturing"
      flow_role: "alloy-steel bar input"
      record_type: "purchase, receiving, issue, and return records"
      raw_fields: "material identity; heat/lot; gross issued mass; returned mass; moisture/contamination correction if any"
      collection_method: "reconcile calibrated scale or verified ERP issue records to the production order"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all covered production lines"
      aggregation_rule: "sum net issued mass and divide by accepted finished output mass"
      quality_evidence: "purchase certificate; material certificate; scale calibration; lot reconciliation"
    - protocol_id: cp_energy_input
      process_id: "part_manufacturing"
      flow_role: "purchased electricity"
      record_type: "meter and invoice records"
      raw_fields: "opening/closing readings; submeter value; invoice quantity; conversion factor; allocation driver"
      collection_method: "reconcile site meter, submeters, and invoices; allocate only covered operations"
      unit: "MJ"
      frequency: "monthly and each production campaign when submetered"
      temporal_coverage: "full reporting period"
      site_scope: "all covered operations and allocated auxiliaries"
      aggregation_rule: "convert documented source unit to MJ, subtract excluded loads, and divide by accepted output mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_industrial_oxygen
      process_id: "part_manufacturing"
      flow_role: "industrial oxygen input"
      record_type: "supplier meter, cylinder, or invoice records"
      raw_fields: "supplied volume; opening/closing stock; returned stock; reference temperature and pressure; allocation driver"
      collection_method: "reconcile consumption and stock change for thermal cutting"
      unit: "m3"
      frequency: "each lot or delivery cycle"
      temporal_coverage: "all thermal-cutting campaigns in the reporting period"
      site_scope: "all applicable thermal-cutting equipment at the producing site"
      aggregation_rule: "allocate consumed volume to thermally cut accepted output mass"
      quality_evidence: "supplier specification; invoice; stock ledger; meter certificate"
    - protocol_id: cp_finished_output
      process_id: "part_manufacturing"
      flow_role: "accepted finished part output"
      record_type: "final inspection and weighing records"
      raw_fields: "part identity; drawing revision; count; unit mass or lot mass; rejected mass; acceptance status"
      collection_method: "weigh accepted output after final finishing and before transport packaging"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "all accepted product in scope"
      aggregation_rule: "sum accepted net mass; normalize inventory to 1 kg"
      quality_evidence: "calibrated scale record; inspection release; lot traceability"
    - protocol_id: cp_scrap_output
      process_id: "part_manufacturing"
      flow_role: "post-industrial steel scrap"
      record_type: "scrap-bin and dispatch records"
      raw_fields: "alloy family; offcut mass; chip mass; contamination status; destination"
      collection_method: "weigh segregated offcuts and chips and reconcile with dispatch records"
      unit: "kg"
      frequency: "each lot or bin dispatch"
      temporal_coverage: "full reporting period"
      site_scope: "all covered machining lines"
      aggregation_rule: "sum segregated steel scrap and allocate by production order or processed mass"
      quality_evidence: "scale calibration; bin identity; recycler receipt; mass-balance reconciliation"
    - protocol_id: cp_natural_gas
      process_id: "onsite_heat_treatment"
      flow_role: "gaseous natural gas input"
      record_type: "meter and invoice records"
      raw_fields: "meter readings; invoiced volume; reference conditions; allocation driver"
      collection_method: "reconcile furnace or site meter to invoice and isolate covered heat-treatment campaigns"
      unit: "m3"
      frequency: "each campaign and monthly"
      temporal_coverage: "all applicable heat-treatment campaigns"
      site_scope: "all applicable heat-treatment furnaces at the producing site"
      aggregation_rule: "allocate by metered furnace use or documented heat-treatment load"
      quality_evidence: "meter calibration; invoice; furnace log; allocation worksheet"
    - protocol_id: cp_direct_fossil_co2
      process_id: "onsite_heat_treatment"
      flow_role: "direct fossil carbon dioxide output"
      record_type: "stack measurement or verified emissions ledger"
      raw_fields: "measured CO2 mass or ledger amount; fuel identity; monitoring period; allocation driver"
      collection_method: "use site measurement or a separately verified facility combustion ledger; do not substitute upstream electricity emissions"
      unit: "kg"
      frequency: "each monitoring period"
      temporal_coverage: "all applicable heat-treatment campaigns"
      site_scope: "all applicable on-site combustion units serving the covered heat-treatment route"
      aggregation_rule: "allocate the verified direct emission to covered heat-treatment output"
      quality_evidence: "monitoring report; ledger verification; allocation worksheet"
    - protocol_id: cp_process_water
      process_id: "aqueous_cleaning"
      flow_role: "process water input"
      record_type: "meter, tank, and invoice records"
      raw_fields: "inlet reading; make-up water; recovered water; discharged water; allocation driver"
      collection_method: "reconcile make-up water to the cleaning line water balance"
      unit: "kg"
      frequency: "each lot and monthly"
      temporal_coverage: "all applicable cleaning campaigns"
      site_scope: "all applicable aqueous-cleaning lines at the producing site"
      aggregation_rule: "use net external make-up water and divide by accepted cleaned output mass"
      quality_evidence: "meter calibration; water balance; invoice; production log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount equals the covered lot amount divided by accepted net finished-part mass; the published reference output is then 1 kg"
      inputs:
        - "covered lot exchange amount"
        - "accepted output mass"
      output: "exchange amount per 1 kg accepted finished part"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "representative steel route"
      rule: "reconcile alloy-steel input with accepted output, segregated steel scrap, measured rejects, returned stock, and documented stock change; explain the residual"
      inputs:
        - "net issued alloy-steel mass"
        - "accepted output mass"
        - scrap
        - rejects
        - returns
        - "stock change"
      output: "lot mass-balance residual and completeness flag"
      source_ids:
        - eu-smitheries-foundries-bat-2024
    - id: calc_energy_allocation
      applies_to: "shared electricity or natural-gas meters"
      rule: "allocate shared energy using directly metered consumption where available; otherwise use documented machine power-time, furnace load, or processed mass and retain excluded loads"
      inputs:
        - "meter or invoice total"
        - "submeter data"
        - "operating time"
        - "rated or measured power"
        - "production mass"
      output: "allocated energy per covered lot"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Maintain drawing revision, parent-machine family, material grade, heat-treatment state, surface condition, and inspection release for every included lot."
      evidence: "drawing; material certificate; route card; inspection release"
    - id: dq_measurement
      applies_to: "mass, energy, gas, oxygen, and water records"
      requirement: "Use calibrated meters or reconcile invoices and stock records; document conversion factors, reference conditions, and allocation drivers."
      evidence: "calibration certificates; invoices; stock ledgers; allocation worksheets"
    - id: dq_temporal
      applies_to: "foreground reporting period"
      requirement: "Cover a representative continuous period or all campaigns in the declared period; disclose start/end dates, shutdowns, atypical campaigns, and missing records."
      evidence: "production calendar; meter coverage; exception log"
    - id: dq_completeness
      applies_to: "input/output inventory"
      requirement: "Reconcile material, energy, water, waste, and direct-emission records against production orders and the process flow sheet; justify every omitted applicable exchange."
      evidence: "mass balance; energy reconciliation; water balance; input/output inventory"
    - id: dq_upstream
      applies_to: "purchased inputs and outsourced operations"
      requirement: "Use upstream datasets compatible with the declared product state, geography, technology, and time; disclose proxies and cut-offs."
      evidence: "dataset metadata; supplier documentation; proxy register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail validation when the part name, intended parent-machine family, drawing revision, material grade, net mass, route, treatment state, surface condition, or factory-gate state is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Require exactly 1 kg accepted net finished-part mass and exclude transport packaging and rejected product from the reference amount."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Require one physical, chemical, waste, energy, or elementary exchange per inventory row; reject combined utilities, material families, waste groups, and emission groups."
    source_ids:
      - eu-smitheries-foundries-bat-2024
  - rule_id: validate_conditional_routes
    applies_to: "conditional processes"
    rule: "Require natural gas and direct fossil CO2 rows only when on-site gas-fired heat treatment occurs, oxygen only when supplied oxygen is used in on-site thermal cutting, and process water only when on-site aqueous cleaning uses external make-up water."
    source_ids:
      - eu-smitheries-foundries-bat-2024
  - rule_id: validate_mass_balance
    applies_to: "representative steel route"
    rule: "Require reconciliation of net alloy-steel input, accepted output, steel scrap, rejects, returns, and stock change; any residual shall be quantified and explained."
    source_ids:
      - eu-smitheries-foundries-bat-2024
  - rule_id: validate_uuid_gap
    applies_to: "reference product identity"
    rule: "Keep the reference-product UUID empty until a public state-100 flow exactly identifies a separately supplied CPC 43570 part with mass property and compatible product state."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground product-manufacturing dataset eligible for publication as a secondary_dataset or background_dataset after review"
  downstream_use: "attributional cradle-to-factory-gate modelling of the declared lifting or handling equipment part and downstream assemblies that consume it"
  allowed_use: "Use only for a part matching the declared parent-machine family, material/alloy, finished state, route, geography, period, and factory-gate boundary, or after a documented representativeness review"
  excluded_use: "Complete lifting or handling machines; CPC 43580 attachments; parts with materially different material or production route without adaptation; installation; maintenance; use-stage operation; end-of-life; consequential recycling credit"
  required_metadata: "PCR id and version; part name; parent-machine family; drawing revision; material/alloy; net mass; route; treatment and surface state; site and geography; period; allocation method; upstream dataset versions; unresolved reference-product UUID status"
  required_quality_disclosure: "meter and scale coverage; allocation shares; mass-balance residual; missing or proxy data; outsourced operations; recycled-content claim basis; scrap destination; range-evidence gaps"
