allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared manufacturing and test operations"
    rule: "First subdivide meters, work orders, test logs, and waste records by product family, batch, or serial number whenever physically possible."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_causal
    applies_to: "inseparable shared operations"
    rule: "If subdivision is not possible, use a documented causal physical driver such as machine time, furnace occupancy, treated area, test duration, or measured product mass; demonstrate why it represents resource use."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_economic_last_resort
    applies_to: "inseparable multi-product operations"
    rule: "Use economic allocation only when no defensible physical relationship exists; disclose prices, period, currency, volatility treatment, and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_scrap
    applies_to: "metal scrap and recovered process material"
    rule: "Internally reused material does not cross the process boundary. Record material leaving the foreground as waste without avoided-burden credit; downstream recycling treatment belongs to the receiving system unless the study explicitly expands the boundary."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_receipts
      process_id: "integrated_manufacture"
      flow_role: "material inputs"
      record_type: "ERP receipt, issue, return, and bill-of-material record"
      raw_fields: "material identity; grade; form; supplier; received mass; issued mass; returned mass; batch; serial numbers"
      collection_method: "reconcile supplier weighing with controlled stores and product BOM"
      unit: "kg"
      frequency: "each receipt and production issue"
      temporal_coverage: "full representative production year or declared batch"
      site_scope: "all controlled sites supplying the reference product"
      aggregation_rule: "net consumed mass by material and product batch divided by conforming product mass"
      quality_evidence: "calibrated scale records; supplier certificates; BOM revision; reconciliation sign-off"
    - protocol_id: cp_factory_utilities
      process_id: "integrated_manufacture"
      flow_role: "electricity, fuel, oxygen, water, and process chemical"
      record_type: "meter, invoice, tank, and bath-replenishment record"
      raw_fields: "meter start/end; submeter; volume reference conditions; delivered mass or volume; concentration; operating hours; production driver"
      collection_method: "read calibrated submeters; reconcile to invoices; calculate pure sodium-hydroxide mass from solution concentration"
      unit: "MJ; m3; kg"
      frequency: "each batch where available and at least monthly"
      temporal_coverage: "full representative production year"
      site_scope: "all controlled manufacturing buildings"
      aggregation_rule: "direct assignment, then documented causal allocation, divided by conforming product mass"
      quality_evidence: "calibration certificates; invoices; meter map; concentration analysis; allocation worksheet"
    - protocol_id: cp_product_release
      process_id: "integrated_manufacture"
      flow_role: "reference product"
      record_type: "serial-number release and weighing record"
      raw_fields: "serial number; configuration; included auxiliaries; dry net mass; acceptance status; release date"
      collection_method: "calibrated final weighing or verified component mass roll-up"
      unit: "kg"
      frequency: "each released unit"
      temporal_coverage: "full declared batch or production year"
      site_scope: "final assembly and release site"
      aggregation_rule: "sum conforming net dry mass in identical supply scope"
      quality_evidence: "scale calibration; signed release certificate; configuration baseline"
    - protocol_id: cp_waste_dispatch
      process_id: "integrated_manufacture"
      flow_role: "segregated waste outputs"
      record_type: "waste scale ticket and manifest"
      raw_fields: "waste identity; source operation; gross/tare/net mass; contamination; destination; date; batch attribution"
      collection_method: "weigh each segregated dispatch and reconcile accumulation periods to work orders"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "full representative production year"
      site_scope: "all controlled manufacturing buildings"
      aggregation_rule: "direct batch attribution or causal allocation divided by conforming product mass"
      quality_evidence: "scale ticket; waste manifest; segregation audit; mass reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "integrated_manufacture"
      flow_role: "manufacturing combustion emissions"
      record_type: "continuous or periodic stack record and fuel record"
      raw_fields: "pollutant; concentration; exhaust flow; moisture; oxygen correction; duration; fuel carbon; oxidation basis"
      collection_method: "integrate validated stack measurements or apply a site-approved fuel-carbon method"
      unit: "kg"
      frequency: "each measured event and monthly fuel reconciliation"
      temporal_coverage: "full representative production year"
      site_scope: "all directly controlled combustion units serving the product"
      aggregation_rule: "allocate measured or calculated mass by documented causal driver to conforming product mass"
      quality_evidence: "instrument calibration; laboratory QA; fuel analysis; method approval"
    - protocol_id: cp_acceptance_test
      process_id: "acceptance_test"
      flow_role: "test energy inputs"
      record_type: "serial-number test log and calibrated meter record"
      raw_fields: "serial number; configuration; fuel identity; fuel amount; electricity; duration; corrected output; heat rate; exhaust flow; uncertainty"
      collection_method: "follow the declared contractual test procedure and calibrated instrumentation plan"
      unit: "m3; kg; MJ; h; declared performance units"
      frequency: "every applicable test run"
      temporal_coverage: "all tests represented by the dataset"
      site_scope: "factory test stand"
      aggregation_rule: "direct serial-number assignment divided by tested conforming product mass"
      quality_evidence: "approved procedure; meter calibration; uncertainty analysis; signed test report"
    - protocol_id: cp_test_emissions
      process_id: "acceptance_test"
      flow_role: "test exhaust elementary flows"
      record_type: "emissions test record"
      raw_fields: "pollutant species; reporting basis; concentration; dry/wet flow; moisture; oxygen correction; duration; fuel identity; serial number"
      collection_method: "integrate calibrated concentration and exhaust-flow measurements; retain all conversions"
      unit: "kg"
      frequency: "every emissions measurement used"
      temporal_coverage: "all applicable test runs represented by the dataset"
      site_scope: "factory test stand"
      aggregation_rule: "direct serial-number assignment divided by tested conforming product mass"
      quality_evidence: "instrument calibration; laboratory QA; calculation workbook; signed test report"
  calculation_rules:
    - id: calc_batch_normalization
      applies_to: "every batch inventory exchange"
      rule: "normalized exchange = exchange assigned to conforming batch / net dry mass of conforming complete turbines in the same supply scope"
      inputs:
        - "assigned exchange"
        - "conforming product mass"
      output: "exchange per kg reference product"
      source_ids: []
    - id: calc_solution_mass
      applies_to: "sodium hydroxide solution"
      rule: "pure-product-equivalent mass = delivered solution mass × measured mass fraction; retain solution water separately when material"
      inputs:
        - "solution mass"
        - concentration
      output: "kg sodium hydroxide"
      source_ids: []
    - id: calc_exhaust_mass
      applies_to: "test carbon monoxide, methane, and nitrogen oxides"
      rule: "pollutant mass = time integral of concentration × compatible dry or wet exhaust flow after documented reference-condition, moisture, and oxygen-basis conversions"
      inputs:
        - "concentration series"
        - "exhaust flow"
        - duration
        - "conversion data"
      output: "kg pollutant"
      source_ids:
        - asme-ptc-22-2023
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Match serial number, configuration, material grade, supplier, product form, and included-auxiliary scope to the inventory period; do not use a generic flow to hide a known distinct material."
      evidence: "release record; BOM; supplier certificate; UUID audit"
    - id: dq_measurement
      applies_to: "meters, scales, and emissions instruments"
      requirement: "Use calibrated instruments, retain raw readings and conversions, and quantify uncertainty for acceptance-test measurements."
      evidence: "calibration certificate; uncertainty analysis; test report"
    - id: dq_temporal
      applies_to: "annual or batch dataset"
      requirement: "Cover a representative production year or disclose the exact batch/test window, shutdowns, prototypes, rework, and production-rate differences."
      evidence: "production calendar; work orders; test schedule"
    - id: dq_completeness
      applies_to: "all foreground processes"
      requirement: "Reconcile material inputs to product, internal return, and dispatched waste; reconcile utilities to invoices; disclose excluded processes and environmental significance."
      evidence: "mass balance; invoice reconciliation; cut-off register"
    - id: dq_representativeness
      applies_to: "upstream datasets"
      requirement: "Document geography, technology, time, alloy/product state, recycled-content model, fuel quality, electricity mix, and proxy limitations."
      evidence: "dataset metadata and data-quality assessment"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "reference product"
    rule: "Confirm the product is a complete non-aircraft gas turbine, not a turbo-jet, turbo-propeller, hydraulic or steam turbine, generator, separate part, plant, or manufacturing service."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_mass
    applies_to: "functional unit and reference flow"
    rule: "Confirm exactly 1 kg net dry conforming product in a consistent included-auxiliary scope and verify the output row links to reference_product."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "every inventory row"
    rule: "Confirm each selected flow is one atomic exchange with a compatible direction, flow type, property, unit, condition, and UUID decision; reject umbrella rows."
    source_ids: []
  - rule_id: validate_test_condition
    applies_to: "acceptance_test"
    rule: "Include test inputs and emissions only when testing occurs before the factory gate; link every value to tested serial numbers and a declared procedure."
    source_ids:
      - asme-ptc-22-2023
  - rule_id: validate_completeness
    applies_to: "foreground inventory"
    rule: "Reconcile BOM receipts, product mass, metal scrap, other wastes, utilities, and direct combustion emissions; quantify and justify every cut-off or proxy."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_bilingual_uuid
    applies_to: "bilingual PCR"
    rule: "Confirm every UUID-bearing Chinese selected-flow name is the exact public Tiangong Chinese baseName and that ordered rule and row identifiers match English."
    source_ids: []
published_dataset_profile:
  dataset_role: "Cradle-to-factory-gate foreground production dataset for a complete non-aircraft gas turbine"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprint, life-cycle inventory, turbine-system and power-plant models when product configuration, included auxiliaries, geography, technology, year, and factory-test status are compatible"
  excluded_use: "Direct substitution for turbo-jets, turbo-propellers, steam or hydraulic turbines, separate components, generators, combined-cycle plants, installation, use, maintenance, overhaul, or end-of-life"
  required_metadata: "PCR id; product model and serial/batch scope; rated output; cycle; application; fuel; dry net mass; included auxiliaries; coating/cooling configuration; production sites and year; controlled process list; supplier/in-house split; test procedure and status; allocation; cut-offs; proxies; recycled-content method"
  required_quality_disclosure: "Temporal, geographic, and technological representativeness; mass and utility reconciliation; instrument calibration; test uncertainty; upstream dataset quality; unresolved UUIDs; missing independent range evidence; limitations"
  update_trigger: "Material design or alloy change; coating or cooling route change; supplier or site change; new test procedure or fuel; material change in annual specific electricity, fuel, product yield, or major scrap rate; corrected UUID; or newly verified independent range evidence"
