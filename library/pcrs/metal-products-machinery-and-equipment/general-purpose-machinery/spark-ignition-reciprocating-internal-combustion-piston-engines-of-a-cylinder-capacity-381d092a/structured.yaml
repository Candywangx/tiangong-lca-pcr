allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Multi-stage or multi-product plants"
    rule: "Subdivide and meter component manufacture, assembly and testing before allocation whenever technically feasible."
    source_ids: []
  - rule_id: allocation_causal_driver
    applies_to: "Shared electricity, fuel, water and consumables"
    rule: "Allocate shared quantities using a documented causal driver such as machine-hours, test-minutes, metered cell consumption or processed mass; use engine count only when resource use per engine is demonstrably uniform."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Recyclable metal and other recovered material"
    rule: "Record each recovered material as its own physical output and disclose the recycling allocation convention. Do not subtract scrap revenue or an avoided-burden credit from foreground consumption without a declared study method."
    source_ids:
      - usphs-1970-automotive-solid-wastes
  - rule_id: allocation_rework_rejects
    applies_to: "Rework and rejected engines"
    rule: "Assign rework inputs and treatment burdens to the production period that generated them. Include the mass of accepted engines only in the reference-product denominator."
    source_ids: []
  - rule_id: allocation_supplier_boundary
    applies_to: "Purchased components"
    rule: "Do not allocate or repeat burdens already contained in a linked supplier dataset; disclose any truncation or substitution used for missing supplier data."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_material_ledger
      process_id: "component_manufacture"
      flow_role: "Each named material input"
      record_type: "Product BOM, purchase and scrap records"
      raw_fields: "material grade; supplied mass; incorporated mass; scrap mass; recycled content; component supplier; engine family; accepted engine mass"
      collection_method: "Reconcile product BOM with weighed receipts, supplier declarations and scrap ledgers"
      unit: "kg"
      frequency: "Per engineering revision and monthly reconciliation"
      temporal_coverage: "Representative production period, normally at least 12 months"
      site_scope: "All reporting sites and material suppliers in scope"
      aggregation_rule: "Sum each chemically or physically distinct material, include measured process loss, then divide by accepted engine mass"
      quality_evidence: "Approved BOM revision; weighbridge or invoice records; supplier declarations; reconciliation sign-off"
    - protocol_id: cp_component_consumables
      process_id: "component_manufacture"
      flow_role: "Cutting fluid"
      record_type: "Purchase, stock and issue records"
      raw_fields: "opening stock; purchases; additions; returns; closing stock; concentration; production line"
      collection_method: "Tank or store mass balance, excluding internal recirculation"
      unit: "kg"
      frequency: "Monthly"
      temporal_coverage: "Same period as reference output"
      site_scope: "All machining cells in scope"
      aggregation_rule: "Net fresh make-up divided by accepted engine mass"
      quality_evidence: "Calibrated scales or supplier invoices; tank reconciliation"
    - protocol_id: cp_component_energy
      process_id: "component_manufacture"
      flow_role: "Electricity"
      record_type: "Meter readings and production logs"
      raw_fields: "opening and closing meter; submeter values; exported electricity; machine-hours; accepted and rejected engine mass"
      collection_method: "Calibrated meter or reconciled utility invoice with causal allocation"
      unit: "kWh and MJ"
      frequency: "Continuous or monthly"
      temporal_coverage: "Same period as reference output"
      site_scope: "All component operations in scope"
      aggregation_rule: "Net electricity times 3.6, divided by accepted engine mass"
      quality_evidence: "Meter calibration; invoice reconciliation; allocation worksheet"
