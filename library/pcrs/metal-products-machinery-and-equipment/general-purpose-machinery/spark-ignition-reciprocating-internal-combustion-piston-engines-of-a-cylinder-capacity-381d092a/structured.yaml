system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The product system is cradle-to-factory-gate. Primary and secondary material production and production of purchased engine components are represented through qualified upstream datasets. The foreground records site operations for the reported engine family, including applicable casting or forming, machining, cleaning, assembly and production testing. Capital equipment, engine installation, vehicle use, maintenance and end-of-life are outside the default boundary."
      source_ids: []
    - rule_id: boundary_cradle_to_gate
      applies_to: "Complete engine product system"
      rule: "Include raw-material recovery, material processing, engine-component production, engine assembly and the treatment of wastes generated before factory-gate acceptance. Link qualified upstream datasets for purchased materials and components."
      source_ids:
        - argonne-anl-22-27-vehicle-production
        - mrozik-2020-si-engine-materials
    - rule_id: boundary_site_route
      applies_to: "Foreground site operations"
      rule: "Include only casting, heat treatment, machining and aqueous cleaning operations actually performed for the declared engine; disclose supplier datasets for operations performed elsewhere."
      source_ids:
        - usphs-1970-automotive-solid-wastes
    - rule_id: boundary_production_test
      applies_to: "Cold and hot production tests"
      rule: "Include all electricity, test fuel, rejected engine disposition and direct elementary emissions from production testing. Gasoline and hot-test combustion emissions apply only when a fuelled hot test occurs."
      source_ids:
        - argonne-anl-22-27-vehicle-production
    - rule_id: boundary_no_double_count
      applies_to: "Linked suppliers and site operations"
      rule: "Do not count the same component-making, fuel-combustion or waste-treatment burden in both a supplier dataset and the foreground stage."
      source_ids: []
    - rule_id: boundary_exclusions
      applies_to: "Default PCR boundary"
      rule: "Exclude factory capital goods, worker commuting, engine installation, vehicle assembly, distribution, use, maintenance and end-of-life unless the study goal explicitly expands the boundary and reports those results separately."
      source_ids: []
