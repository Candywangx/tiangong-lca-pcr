  calculation_rules:
    - id: calc_material_intensity
      applies_to: "Each BOM material row"
      rule: "(incorporated material mass + process loss inside the boundary) / accepted complete-engine mass"
      inputs:
        - BOM
        - purchases
        - "supplier declarations"
        - "material-specific scrap"
        - "accepted engine mass"
      output: "kg material per kg accepted engine"
      source_ids:
        - argonne-anl-22-27-vehicle-production
        - mrozik-2020-si-engine-materials
    - id: calc_energy_intensity
      applies_to: "Electricity rows"
      rule: "(metered imports + on-site generation consumed - exports) × 3.6 / accepted complete-engine mass"
      inputs:
        - "kWh meter records"
        - "allocation driver"
        - "accepted engine mass"
      output: "MJ electricity per kg accepted engine"
      source_ids: []
    - id: calc_solution_active_mass
      applies_to: "Sodium hydroxide"
      rule: "supplied solution mass × measured or certified NaOH mass fraction / accepted complete-engine mass"
      inputs:
        - "solution mass"
        - concentration
        - "accepted engine mass"
      output: "kg NaOH per kg accepted engine"
      source_ids: []
    - id: calc_waste_intensity
      applies_to: "Each waste row"
      rule: "externally transferred waste mass, excluding verified internal recirculation, / accepted complete-engine mass"
      inputs:
        - "transfer weights"
        - "recovery records"
        - "accepted engine mass"
      output: "kg waste per kg accepted engine"
      source_ids:
        - usphs-1970-automotive-solid-wastes
    - id: calc_fossil_co2
      applies_to: "Direct fossil carbon dioxide"
      rule: "Use calibrated direct measurement, or net fuel × carbon mass fraction × fossil fraction × oxidation factor × 44/12; do not add upstream fuel emissions"
      inputs:
        - "fuel and carbon records or direct measurement"
        - "accepted engine mass"
      output: "kg fossil CO2 per kg accepted engine"
      source_ids: []
    - id: calc_reference_flow
      applies_to: "Reference product"
      rule: "accepted net engine mass / accepted net engine mass"
      inputs:
        - "accepted engine mass and count"
      output: "1 kg reference product with associated engine count"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Demonstrate spark ignition, reciprocating configuration, motor-vehicle application and total cylinder capacity above 1000 cc for every included engine family."
      evidence: "Engineering specification, configuration record and final acceptance log"
    - id: dq_bom_completeness
      applies_to: "Material and component supply"
      requirement: "Represent every physically or chemically distinct material or purchased component contributing at least 1% of net engine mass, plus every hazardous or high-impact material regardless of share, as its own atomic flow or qualified supplier dataset. Reconcile represented mass to net engine mass and explain the residual."
      evidence: "Approved BOM, supplier declarations and mass-reconciliation worksheet"
    - id: dq_temporal
      applies_to: "All foreground rows"
      requirement: "Use one consistent representative production period, normally at least 12 consecutive months; disclose start/end dates, shutdowns, model changes and abnormal campaigns."
      evidence: "Dated meters, invoices, production logs and change-control records"
    - id: dq_geography_technology
      applies_to: "Upstream and foreground data"
      requirement: "Match production geography, electricity supply, material route, recycled content, casting technology, cleaning chemistry and test route to the declared engine."
      evidence: "Dataset metadata, supplier declarations and route map"
    - id: dq_meter_reconciliation
      applies_to: "Energy, water, fuel and waste"
      requirement: "Reconcile submeters to facility totals and document allocation drivers, calibration status, missing intervals and estimation."
      evidence: "Calibration certificates and signed reconciliation worksheet"
    - id: dq_no_umbrella_flows
      applies_to: "Completed inventory"
      requirement: "Add route-specific materials, fuels, chemicals, wastes and emissions as separate atomic rows; do not replace them with combined utility, material, waste or emission categories."
      evidence: "Inventory review against purchase, meter, BOM and waste ledgers"
    - id: dq_uncertainty
      applies_to: "Calculated and allocated rows"
      requirement: "Disclose measurement uncertainty, allocation shares, missing supplier data and all substitutions."
      evidence: "Calculation workbook, uncertainty record and data-gap register"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Product identity and reference flow"
    rule: "Reject a dataset unless the reference product is a complete CPC 43122 engine above 1000 cc and reference mass, engine count, dry/filled state and included accessories are declared."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_boundary
    applies_to: "System boundary"
    rule: "Confirm that material/component supply, applicable component operations, assembly and production testing are included once, and that supplier-versus-site responsibilities and exclusions are disclosed."
    source_ids:
      - argonne-anl-22-27-vehicle-production
      - usphs-1970-automotive-solid-wastes
  - rule_id: validation_inventory_atomicity
    applies_to: "Process inventory"
    rule: "Confirm that each row is one product, waste or elementary exchange with one applicable property and unit; reject combined materials, utilities, fuels, wastes or emissions."
    source_ids: []
  - rule_id: validation_bom_balance
    applies_to: "Material inputs"
    rule: "Reconcile incorporated material plus separately measured losses to accepted engine mass; investigate and disclose any unexplained residual exceeding the dataset's stated uncertainty."
    source_ids:
      - mrozik-2020-si-engine-materials
  - rule_id: validation_energy_units
    applies_to: "Electricity and gaseous fuel"
    rule: "Verify kWh-to-MJ conversion, gas reference conditions and the absence of power-to-energy substitution."
    source_ids: []
  - rule_id: validation_route_conditions
    applies_to: "Conditional operations and rows"
    rule: "Mark natural gas, sodium hydroxide, spent foundry sand, gasoline and direct combustion emissions not applicable only with route evidence that the corresponding operation did not occur."
    source_ids: []
  - rule_id: validation_combustion_double_count
    applies_to: "Direct fossil CO2"
    rule: "Confirm direct site and hot-test fossil CO2 excludes upstream electricity and fuel-supply emissions and is linked to the same foreground fuel record."
    source_ids: []
  - rule_id: validation_data_quality
    applies_to: "All rows"
    rule: "Confirm temporal alignment, meter reconciliation, supplier representativeness, calibration evidence and explicit data-gap disclosure."
    source_ids: []
published_dataset_profile:
  dataset_role: "Cradle-to-factory-gate secondary dataset or background dataset for one complete new CPC 43122 engine"
  downstream_use: "Vehicle production LCA, powertrain comparison, engine-component supply modelling and lifecyclemodel assembly when reference-product qualifiers match"
  allowed_use: "Use after matching engine capacity, configuration, mass state, included accessories, geography, technology, production year and test route"
  excluded_use: "Aircraft or rotary engines; engines at or below 1000 cc; compression-ignition engines; remanufactured engines; parts-only products; use-phase fuel consumption or exhaust modelling"
  required_metadata: "PCR id and version; engine family/model; cylinder capacity; mass and count; dry/filled state; included accessories; geography; reference period; supplier-versus-site boundary; material routes and recycled content; casting, cleaning and test routes; allocation and recycling methods"
  required_quality_disclosure: "Foreground coverage; BOM mass closure; meter and scale calibration; temporal coverage; supplier data quality; allocation drivers; UUID gaps; range-evidence gaps; uncertainty and substitutions"
  update_trigger: "Engineering change affecting mass or materials; new engine family; capacity or fuel-compatibility change; supplier or plant change; casting/cleaning/test-route change; electricity or fuel change; allocation-method change; data older than the declared representativeness period"
