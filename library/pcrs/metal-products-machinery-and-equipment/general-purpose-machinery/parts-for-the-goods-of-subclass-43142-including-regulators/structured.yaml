allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_processes"
    rule: "Avoid allocation by separating production orders, batches, machines, meters, tanks, and test benches whenever records permit direct assignment to the covered product."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "inseparable_shared_burdens"
    rule: "When subdivision is not possible, allocate using a documented causal physical driver: machine or furnace time and power for energy, treated mass for batch processes, treated area for surface treatment, or measured throughput for utilities. Demonstrate the relationship and apply it consistently."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_economic_last_resort
    applies_to: "no_physical_relationship"
    rule: "Use economic allocation only when subdivision and a relevant physical relationship are demonstrably unavailable. Use prices at the co-production point, disclose the period and currency, and provide sensitivity to a physical alternative."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_scrap_status
    applies_to: "metal_scrap_and_rework"
    rule: "Keep internal rework and internal remelting inside the foreground balance. Record material leaving the site as waste unless documented product status and ownership transfer justify a co-product; disclose the chosen recycling or burden convention without double credit."
    source_ids:
      - ec-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "manufacturing_and_assembly_governor_assembly_and_test"
      flow_role: "Metals, welding consumables, and regulator boards"
      record_type: "BOM, material issue, return, supplier certificate"
      raw_fields: "item id; grade; issued mass; returned mass; lot; supplier; accepted output"
      collection_method: "Reconcile ERP/BOM quantities to warehouse issue and return records"
      unit: "kg"
      frequency: "Per production order"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope lines"
      aggregation_rule: "Sum net issues by atomic flow and allocate only under section 7"
      quality_evidence: "Signed issue/return records and material certificates"
    - protocol_id: cp_energy_meters
      process_id: "all_applicable_processes"
      flow_role: "Electricity and natural gas"
      record_type: "Calibrated meter or submeter"
      raw_fields: "opening and closing reading; unit; timestamp; equipment; batch; reference conditions for gas"
      collection_method: "Read dedicated meters; where shared, retain operating time and rated or measured power"
      unit: "kWh; m3"
      frequency: "Per batch or shift"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope equipment"
      aggregation_rule: "Subtract documented non-production use, apply section 7, convert electricity to MJ"
      quality_evidence: "Meter id, calibration status, and reconciliation to invoice"
    - protocol_id: cp_gas_consumables
      process_id: "manufacturing_and_assembly"
      flow_role: "Industrial oxygen and argon"
      record_type: "Bulk meter or cylinder inventory"
      raw_fields: "gas identity; purity; opening stock; receipts; closing stock; returns; temperature; pressure"
      collection_method: "Mass or volume balance by gas identity"
      unit: "m3"
      frequency: "Per batch and monthly reconciliation"
      temporal_coverage: "Complete reporting period"
      site_scope: "Welding and cutting stations"
      aggregation_rule: "Convert to declared supplier reference conditions and allocate by documented use"
      quality_evidence: "Supplier certificates, cylinder log, and meter check"
    - protocol_id: cp_process_consumables
      process_id: "manufacturing_and_assembly"
      flow_role: "Cutting fluid"
      record_type: "Purchase, issue, make-up, return, and stock record"
      raw_fields: "product id; formulation; concentration; opening stock; receipts; closing stock; return"
      collection_method: "Consumable mass balance"
      unit: "kg"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Complete reporting period"
      site_scope: "All machining systems"
      aggregation_rule: "Net make-up equals opening plus receipts minus closing minus returns"
      quality_evidence: "Inventory reconciliation and concentration measurement"
    - protocol_id: cp_process_water
      process_id: "manufacturing_heat_treatment_and_surface_treatment"
      flow_role: "Process-water make-up"
      record_type: "Water meter and batch log"
      raw_fields: "meter reading; source; quality; density; process; batch; recirculated amount"
      collection_method: "Calibrated meter or tank balance"
      unit: "kg or m3"
      frequency: "Per batch or shift"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope water systems"
      aggregation_rule: "Convert volume using measured or disclosed density; subtract only documented internal recirculation"
      quality_evidence: "Meter calibration and water balance"
    - protocol_id: cp_surface_treatment
      process_id: "surface_treatment"
      flow_role: "Sodium hydroxide and coating"
      record_type: "Bath and coating batch record"
      raw_fields: "product id; concentration or solids; addition; return; bath volume; treated area; lot"
      collection_method: "Reconcile formulation, make-up, issue, and return records"
      unit: "kg"
      frequency: "Per bath addition and product batch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope treatment lines"
      aggregation_rule: "Calculate active sodium hydroxide and net formulated coating input"
      quality_evidence: "Batch sheets, concentration tests, and stock reconciliation"
    - protocol_id: cp_regulator_assembly
      process_id: "governor_assembly_and_test"
      flow_role: "Hydraulic fluid fill"
      record_type: "BOM, fill, drain, reuse, and test log"
      raw_fields: "fluid id; grade; filled mass; drained mass; reused mass; test loss; regulator serial"
      collection_method: "Weigh or meter each fill and drain"
      unit: "kg"
      frequency: "Per regulator"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope regulator lines"
      aggregation_rule: "Net crossing amount equals filled plus loss minus drained reuse"
      quality_evidence: "Calibrated filling device and serial-level test record"
    - protocol_id: cp_waste_transfers
      process_id: "all_applicable_processes"
      flow_role: "Steel scrap, spent coolant, and oily wastewater"
      record_type: "Scale ticket, tank balance, manifest, treatment receipt"
      raw_fields: "waste id; mass or volume; composition; hazard class; date; destination; internal reuse"
      collection_method: "Weigh outgoing loads or reconcile calibrated tanks"
      unit: "kg"
      frequency: "Each transfer"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope waste collection points"
      aggregation_rule: "Sum by atomic waste flow; subtract documented internal reuse only"
      quality_evidence: "Scale calibration, manifest, and treatment receipt"
    - protocol_id: cp_direct_emissions
      process_id: "manufacturing_and_assembly_heat_treatment"
      flow_role: "Particulate matter and fossil carbon dioxide"
      record_type: "Stack test, CEMS, fuel record, or site factor calculation"
      raw_fields: "pollutant; concentration; flow; duration; fuel; carbon content; abatement; operating hours"
      collection_method: "Prefer direct measurement; otherwise calculate from collected activity and documented site-specific factor"
      unit: "kg"
      frequency: "Per test or continuous record with batch linkage"
      temporal_coverage: "Representative operation covering reporting period"
      site_scope: "All in-scope release points"
      aggregation_rule: "Subtract captured material only when recovery is documented; normalize by allocated accepted output"
      quality_evidence: "Method, detection limit, calibration, factor source, and uncertainty"
    - protocol_id: cp_packaging
      process_id: "final_inspection_and_packaging"
      flow_role: "Paper boxes and wooden pallets"
      record_type: "Packing list, issue, return, and reuse log"
      raw_fields: "package id; mass; units; shipment; reuse count; ownership transfer"
      collection_method: "Reconcile packaging issues to accepted shipments"
      unit: "kg"
      frequency: "Per shipment"
      temporal_coverage: "Complete reporting period"
      site_scope: "All dispatch points"
      aggregation_rule: "Include only packaging crossing the gate; allocate reusable pallet mass by documented trips"
      quality_evidence: "Packing list, tare measurement, and reuse evidence"
    - protocol_id: cp_product_output
      process_id: "final_inspection_and_packaging"
      flow_role: "Accepted reference product"
      record_type: "Release, inspection, and scale record"
      raw_fields: "part/model; serial or lot; gross mass; packaging tare; net mass; acceptance status; date"
      collection_method: "Weigh accepted output or reconcile verified engineering mass to release records"
      unit: "kg"
      frequency: "Per unit or lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "All covered products"
      aggregation_rule: "Sum accepted net mass; exclude packaging, rejected product, and unreleased work in progress"
      quality_evidence: "Scale calibration, release certificate, and rejection log"
  calculation_rules:
    - id: calc_net_input
      applies_to: "Material and consumable rows"
      rule: "Net input = opening stock + receipts - closing stock - documented returns to supplier or inventory - documented transfer to other products"
      inputs:
        - Stock
        - purchase
        - issue
        - return
        - "and transfer records"
      output: "kg of atomic input attributable to the covered product"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = allocated flow amount / accepted net product mass"
      inputs:
        - "Flow amount"
        - "allocation result"
        - "accepted product mass"
      output: "Amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity rows"
      rule: "Electricity (MJ) = metered electricity (kWh) × 3.6"
      inputs:
        - "Allocated meter reading"
      output: "MJ per 1 kg reference product"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "carbon_dioxide_fossil_heat_treatment"
      rule: "Prefer measured direct CO2. Otherwise calculate complete fossil-carbon oxidation from collected fuel quantity, supplier carbon content, and molecular mass ratio; disclose oxidation assumptions and uncertainty."
      inputs:
        - "Fuel quantity"
        - "carbon content"
        - "oxidation basis"
        - "accepted output"
      output: "kg fossil CO2 per 1 kg reference product"
      source_ids:
        - jrc-sf-bref-2024
    - id: calc_mass_reconciliation
      applies_to: "Metal manufacture"
      rule: "Reconcile metal inputs = accepted metal in product + post-industrial metal scrap + metal in other measured wastes + inventory change, after documented internal reuse"
      inputs:
        - "Net metal inputs"
        - "accepted product composition"
        - scrap
        - "other waste"
        - "stock change"
      output: "Mass-balance closure and unexplained difference"
      source_ids:
        - jrc-sf-bref-2024
    - id: calc_pallet_reuse
      applies_to: "wooden_pallet"
      rule: "Allocated pallet mass = pallet mass / verified number of trips when ownership and reuse records demonstrate repeated use; otherwise assign full outgoing mass"
      inputs:
        - "Pallet mass"
        - "reuse log"
        - "ownership transfer"
      output: "kg pallet per 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Identify part or regulator type, drawing or model, material grade, manufacturing route, acceptance standard, net mass, packaging state, site, and period."
      evidence: "Release certificate, drawing/BOM revision, material certificate, and scale record"
    - id: dq_route_completeness
      applies_to: "Process map"
      requirement: "Declare every listed process applicable or not applicable and justify every exclusion with production records. Add separate atomic rows for actual purchased components, chemicals, gases, packaging items, wastes, and direct emissions not represented by the minimum inventory."
      evidence: "Route sheet, work order, process flow, and environmental register"
    - id: dq_temporal_coverage
      applies_to: "Foreground records"
      requirement: "Use a continuous period representative of normal operation and include start-up, shutdown, rework, rejects, and maintenance consumption attributable to production. State gaps and extrapolation."
      evidence: "Dated records and coverage reconciliation"
    - id: dq_meter_quality
      applies_to: "Energy, water, gas, and emissions"
      requirement: "Report meter id, calibration status, reading frequency, allocation driver, reference conditions, detection limits, and uncertainty where relevant."
      evidence: "Calibration certificate, meter log, and calculation workbook"
    - id: dq_mass_balance
      applies_to: "Materials and wastes"
      requirement: "Reconcile major metal input, accepted product, internal reuse, scrap, and other waste. Investigate and disclose unexplained differences."
      evidence: "Signed mass-balance worksheet and stock records"
    - id: dq_upstream_representativeness
      applies_to: "Purchased product inputs"
      requirement: "Document supplier, geography, technology, product state, temporal coverage, recycled content, and any proxy used for each upstream dataset."
      evidence: "Supplier data and dataset selection record"
    - id: dq_no_double_counting
      applies_to: "Shared processes and recycled material"
      requirement: "Prevent double counting between foreground inputs, internal recycling, outgoing scrap, upstream recycled-content datasets, and any recycling credit."
      evidence: "Allocation and recycling convention statement"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "Confirm that the reference output uses the exact CPC 43154 Tiangong flow, equals 1 kg accepted net product, excludes separately supplied packaging, and carries every required qualifier."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_process_applicability
    applies_to: "process_map"
    rule: "Confirm that all required processes are represented and every conditional process has a documented applicable or not-applicable decision consistent with route records."
    source_ids:
      - us-epa-mpm-development-document-2003
      - ridha-et-al-2023-hydraulic-turbine-failures
  - rule_id: validate_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm that every row is one product, waste, energy, or elementary exchange and that no combined material, utility, packaging, waste, or emission collection is used as a selected flow."
    source_ids: []
  - rule_id: validate_inventory_accounting
    applies_to: "process_inventory"
    rule: "Confirm that every UUID-bearing flow uses the audited identity and units, each UUID-empty flow is explicitly unresolved, and the English and Chinese row ids, order, flow types, and UUIDs are identical."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "materials_and_output"
    rule: "Confirm accepted product, scrap, waste, internal reuse, and stock change reconcile to major material inputs within a site-defined tolerance; disclose the tolerance and unresolved difference."
    source_ids:
      - jrc-sf-bref-2024
  - rule_id: validate_energy_and_emissions
    applies_to: "energy_and_direct_emissions"
    rule: "Confirm electricity conversion, gas reference conditions, fuel allocation, direct fossil CO2 scope, particulate abatement, and exclusion of upstream emissions from direct foreground rows."
    source_ids:
      - jrc-sf-bref-2024
  - rule_id: validate_allocation
    applies_to: "multi_product_facility"
    rule: "Confirm subdivision was attempted first, the selected physical driver is causally relevant, and any economic fallback is justified and sensitivity-tested."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_source_and_range_status
    applies_to: "evidence"
    rule: "Confirm no literature case value is presented as an empirical range. Keep range evidence needs open until at least two independent, boundary-compatible original sources or reviewed foreground datasets support a range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared hydraulic-turbine or water-wheel part or dedicated turbine regulator"
  downstream_use: "May be linked with representative upstream datasets to build cradle-to-gate product systems and may feed process or lifecyclemodel projections"
  allowed_use: "Product-specific or disclosed product-mix studies with matching part identity, material, route, regulator configuration, geography, technology, period, packaging state, allocation, and upstream datasets"
  excluded_use: "Complete hydraulic turbines, generators, civil works, site installation, use, repair, maintenance, end-of-life, or an undisclosed generic average across dissimilar part and regulator families"
  required_metadata: "PCR id and version state; product flow UUID; part/model and drawing revision; net mass; material and grade; process route; site and geography; reporting period; production volume; acceptance tests; packaging; allocation; upstream datasets; cut-offs; data-quality evidence"
  required_quality_disclosure: "Primary-data share; temporal, geographical, and technological representativeness; meter and scale calibration; mass-balance closure; allocation sensitivity; missing records; proxy datasets; unresolved UUIDs; uncertainty; applicable and not-applicable processes"
  update_trigger: "Material change to product design, material grade, manufacturing or regulator technology, energy mix, site, supplier chain, allocation, waste treatment, packaging, acceptance specification, or reporting period; or resolution of an open UUID or range-evidence need"
