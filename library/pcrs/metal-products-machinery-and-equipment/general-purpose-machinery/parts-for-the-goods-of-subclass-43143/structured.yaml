              kind: "calculated_from_collection"
              collection_protocol_id: cp_product_release
              source_ids:
                - un-cpc-3-0-structure-2025
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_processes"
    rule: "Avoid allocation by subdividing meters, material issues, machine logs, baths, lots, and waste records to the specific part or part family wherever technically feasible."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: allocation_rule_2
    applies_to: "shared_resources"
    rule: "When subdivision is infeasible, use a documented physical driver causally related to the burden, such as machine time, measured energy, treated surface area, bath loading, or processed mass; do not default to revenue."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: allocation_rule_3
    applies_to: "rejects_and_rework"
    rule: "Assign rework energy, materials, and losses to the production that generated the reject until the item becomes accepted output or leaves through a declared flow."
    source_ids:
      - eu-jrc-stm-bref-2006
  - rule_id: allocation_rule_4
    applies_to: "metal_scrap"
    rule: "Report segregated chips and scrap as waste outputs at the foreground gate and disclose any revenue, recovery route, recycled-content accounting, and downstream credit method; do not embed an undocumented avoided-burden credit."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: allocation_rule_5
    applies_to: "sensitivity"
    rule: "Report the allocation driver and factor for every shared process and test a materially plausible alternative when allocation changes the result or a comparative claim."
    source_ids:
      - eu-pef-recommendation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "primary_shaping_heat_treatment"
      flow_role: "qualified stock and process gas inputs"
      record_type: "receiving, issue, inventory, and supplier records"
      raw_fields: "item id; alloy/chemical grade; supplied form; gross and net mass or volume; opening and closing inventory; transfers; supplier; lot; reference conditions"
      collection_method: "calibrated scale, tank meter, gas meter, and ERP reconciliation"
      unit: "kg or m3"
      frequency: "each receipt and issue; monthly reconciliation"
      temporal_coverage: "representative production period, normally at least 12 consecutive months or the full campaign"
      site_scope: "all controlled sites and included subcontractors"
      aggregation_rule: "receipts + opening inventory - closing inventory - transfers, allocated to accepted lots"
      quality_evidence: "calibration record, certificate of analysis, invoice, inventory reconciliation"
    - protocol_id: cp_energy_records
      process_id: "all_listed_processes"
      flow_role: "electricity and natural gas"
      record_type: "meter and invoice records"
      raw_fields: "meter id; start/end reading; unit; timestamp; process cell; operating hours; allocation driver; gas reference conditions"
      collection_method: "dedicated meter preferred; otherwise reconciled submeter and invoice"
      unit: "MJ, kWh, or m3"
      frequency: "continuous or each billing interval"
      temporal_coverage: "same period as product output"
      site_scope: "all included foreground operations"
      aggregation_rule: "convert to required unit, subtract excluded loads, allocate with declared physical driver, normalize to accepted mass"
      quality_evidence: "meter calibration, invoice, load map, reconciliation"
    - protocol_id: cp_combustion_emissions
      process_id: "primary_shaping_heat_treatment"
      flow_role: "direct fossil carbon dioxide and nitrogen oxides"
      record_type: "stack test, continuous monitor, fuel, and control records"
      raw_fields: "emission species basis; concentration; flow; operating time; fuel volume; fuel carbon/composition; oxidation factor; control status"
      collection_method: "calibrated CEMS or stack test; documented fuel-carbon calculation where direct measurement is unavailable"
      unit: "kg"
      frequency: "continuous, campaign test, or each calculation period"
      temporal_coverage: "covers all included firing hours in the product period"
      site_scope: "each included combustion unit"
      aggregation_rule: "integrate measured mass or calculate from collected fuel data, allocate by causal heat demand, normalize to accepted mass"
      quality_evidence: "calibration, laboratory report, calculation workbook, control log"
    - protocol_id: cp_water_chemical_records
      process_id: "precision_machining_surface_engineering"
      flow_role: "water, coolant concentrate, and sodium hydroxide"
      record_type: "meter, purchase, batch, and bath records"
      raw_fields: "material id; concentration; gross mass; active mass; water meter; bath additions; bath level; opening/closing stock; transfers"
      collection_method: "calibrated meter, scale, ERP issue, and bath log"
      unit: "kg"
      frequency: "each addition and monthly balance"
      temporal_coverage: "same period as treated output"
      site_scope: "each included machining and surface line"
      aggregation_rule: "net external input, excluding internal recirculation, allocated to accepted output"
      quality_evidence: "certificate of analysis, calibration, purchase record, bath log"
    - protocol_id: cp_waste_records
      process_id: "precision_machining_surface_engineering"
      flow_role: "chips, spent coolant, and spent caustic solution"
      record_type: "container scale, manifest, tank, and shipment records"
      raw_fields: "waste id; composition; alloy grade; contamination; wet/dry basis; container tare; destination; treatment; opening/closing inventory"
      collection_method: "calibrated scale or tank balance reconciled to transfer documents"
      unit: "kg"
      frequency: "each container or shipment; monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "all included foreground waste points"
      aggregation_rule: "net waste leaving boundary plus closing-minus-opening storage, allocated to generating process"
      quality_evidence: "scale calibration, waste manifest, recycler receipt, laboratory analysis"
    - protocol_id: cp_surface_route_records
      process_id: "surface_engineering"
      flow_role: "coating material input"
      record_type: "powder issue, recovery, and coating traveler"
      raw_fields: "powder id; yttria fraction; supplier lot; issued mass; reusable recovered mass; treated area; coating specification; accepted/rejected area"
      collection_method: "calibrated scale and route traveler"
      unit: "kg and m2"
      frequency: "each coating batch"
      temporal_coverage: "full declared coating campaign"
      site_scope: "each included coating cell and subcontractor"
      aggregation_rule: "issued mass - reusable powder returned to inventory, allocated to accepted coated output"
      quality_evidence: "certificate of analysis, scale calibration, traveler, inspection result"
    - protocol_id: cp_product_release
      process_id: "inspection_release"
      flow_role: "accepted finished product"
      record_type: "traveler, scale, inspection, and release records"
      raw_fields: "part id; drawing revision; material grade; route; coating; net mass; accepted/rejected status; rework; date"
      collection_method: "calibrated scale and controlled acceptance record"
      unit: "kg"
      frequency: "each part or accepted lot"
      temporal_coverage: "same period as all inputs and wastes"
      site_scope: "all accepted output from included sites"
      aggregation_rule: "sum accepted net mass only; normalize inventory to 1 kg accepted mass"
      quality_evidence: "calibration, inspection report, nonconformance and release records"
  calculation_rules:
    - id: calc_rule_1
      applies_to: "inventory_normalization"
      rule: "normalized amount = allocated period amount / accepted net product mass"
      inputs:
        - "allocated row amount"
        - "accepted net mass from cp_product_release"
      output: "row amount per 1 kg accepted finished part"
      source_ids:
        - eu-pef-recommendation-2021
    - id: calc_rule_2
      applies_to: "electricity_conversion"
      rule: "MJ = kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "electrical energy in MJ"
      source_ids: []
    - id: calc_rule_3
      applies_to: "metal_yield"
      rule: "metal reconciliation difference = opening stock + receipts - closing stock - transfers - accepted output - segregated chips - declared rejects"
      inputs:
        - cp_material_balance
        - cp_waste_records
        - cp_product_release
      output: "unreconciled metal mass and yield disclosure"
      source_ids: []
    - id: calc_rule_4
      applies_to: "fossil_co2"
      rule: "direct fossil CO2 mass = measured integrated stack mass or documented fuel volume × reference-condition conversion × carbon fraction × oxidation fraction × 44/12"
      inputs:
        - "cp_combustion_emissions fields"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_rule_5
      applies_to: "shared_process_allocation"
      rule: "allocated row amount = shared measured amount × declared causal physical share"
      inputs:
        - "shared record"
        - "physical driver totals"
        - "target-part driver"
      output: "part-allocated foreground amount"
      source_ids:
        - eu-pef-recommendation-2021
    - id: calc_rule_6
      applies_to: "coating_powder"
      rule: "net coating-powder input = issued powder - reusable recovered powder returned to inventory"
      inputs:
        - cp_surface_route_records
      output: "kg YSZ powder consumed per accepted output"
      source_ids:
        - nasa-tp-1425-1979
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and material inputs"
      requirement: "Preserve part identifier, drawing revision, function, material grade, supplied state, heat treatment, coating, and acceptance class; do not aggregate unlike parts without a documented representative-product model."
      evidence: "controlled traveler, bill of materials, certificate of analysis, release record"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use one common representative period for inputs, outputs, emissions, and accepted mass; explain shutdowns, campaigns, abnormal production, and incomplete months."
      evidence: "period reconciliation and production calendar"
    - id: dq_metering
      applies_to: "energy, gas, water, and mass"
      requirement: "Use calibrated meters or reconciled records; document meter boundary, unit conversion, reference conditions, estimation fraction, and allocation driver."
      evidence: "calibration certificates, invoices, meter map, calculation workbook"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Account for every included process, purchased blank, major material, energy input, direct emission, chip stream, spent fluid, and spent bath; document zero and not-applicable conclusions."
      evidence: "signed process-flow review and completeness reconciliation"
    - id: dq_mass_balance
      applies_to: "metal and coating material"
      requirement: "Investigate unexplained metal or coating-powder balance differences and retain corrections, rejected lots, rework, internal recycling, and inventory changes."
      evidence: "balance worksheet and corrective-action record"
    - id: dq_representativeness
      applies_to: "upstream datasets"
      requirement: "Record geographical, technological, temporal, and product-state representativeness for each upstream dataset and disclose proxies."
      evidence: "dataset metadata and representativeness assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_flow"
    rule: "Confirm the output is a discrete part for a non-turbo-jet/non-turbo-propeller gas turbine and that all required qualifiers and the 1 kg accepted net-mass basis are present."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "process_coverage"
    rule: "Confirm every required process is represented and every conditional process has an evidence-backed included or not-applicable determination."
    source_ids:
      - eu-jrc-sf-bref-2024
      - eu-jrc-stm-bref-2006
  - rule_id: validation_rule_3
    applies_to: "inventory_atomicity"
    rule: "Confirm every inventory row is one concrete exchange and that no row combines fuels, utilities, chemicals, wastes, packaging, or emission groups."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "uuid_identity"
    rule: "Confirm each populated UUID is public state 100 and semantically matches flow name, flow type, classification, property, and unit; keep unresolved product-specific identities explicit."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "evidence_traceability"
    rule: "Confirm each collected or calculated row links to an implemented collection protocol and that external source ids support only the stated method or boundary role."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: validation_rule_6
    applies_to: "energy_emissions"
    rule: "Reconcile natural-gas use with included direct fossil CO2 and nitrogen-oxides records, and confirm purchased-electricity upstream emissions are not duplicated as direct site emissions."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "material_balance"
    rule: "Reconcile qualified metal stock, accepted output, segregated chips, rejects, transfers, and inventory changes; investigate every material unexplained difference."
    source_ids:
      - us-epa-mpm-effluent-guidelines-2003
  - rule_id: validation_rule_8
    applies_to: "allocation_and_disclosure"
    rule: "Confirm shared-process allocation uses a documented causal physical driver and that subcontracting, recovery routes, credits, cut-offs, and transport-packaging exclusion are disclosed."
    source_ids:
      - eu-pef-recommendation-2021
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for an identified finished gas-turbine part"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-specific supply-chain modelling when the part identity, function, material grade, route, coating state, geography, time, acceptance criteria, allocation, and packaging exclusion are compatible"
  excluded_use: "Complete gas turbines; turbo-jets or turbo-propellers and their parts; repair or overhaul; use-phase performance; unqualified category averages; comparative assertions across materially different part functions, alloys, routes, or coating states"
  required_metadata: "PCR id and version; part and drawing identity; function; material grade and state; route and subcontracting; heat treatment; coating; net mass; site and geography; reference period; meters and allocation; upstream datasets; emissions; wastes and destinations; cut-offs; unresolved UUIDs"
  required_quality_disclosure: "Primary-data coverage; estimated share; calibration and reconciliation results; metal-balance difference; representativeness of upstream datasets; allocation sensitivity; rejected lots and rework; uncertainty; unresolved range evidence and UUID gaps"
  update_trigger: "Drawing, material grade, supplied blank state, manufacturing route, coating specification, inspection class, supplier, site, energy system, emission control, allocation driver, or foreground data changes that materially affect the inventory"
