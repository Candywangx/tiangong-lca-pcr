system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground_start"
      rule: "Begin at receipt of qualified stock or blank and include all controlled operations needed to produce an accepted finished part at the site gate."
      source_ids:
        - eu-jrc-sf-bref-2024
        - eu-pef-recommendation-2021
    - rule_id: boundary_rule_2
      applies_to: "external_operations"
      rule: "Include subcontracted shaping, heat treatment, machining, cleaning, coating, and inspection through supplier-specific activity data or representative upstream datasets when they are required to reach the declared market state."
      source_ids:
        - eu-pef-recommendation-2021
    - rule_id: boundary_rule_3
      applies_to: "direct_emissions"
      rule: "Report direct elementary emissions only for foreground combustion, treatment, or release points; do not duplicate emissions already embodied in purchased electricity or upstream materials."
      source_ids:
        - eu-pef-recommendation-2021
        - eu-jrc-stm-bref-2006
    - rule_id: boundary_rule_4
      applies_to: "excluded_stages"
      rule: "Exclude transport packaging, distribution, installation, turbine operation, maintenance, repair, remanufacture, and end-of-life from this factory-gate reference flow."
      source_ids:
        - eu-pef-recommendation-2021
