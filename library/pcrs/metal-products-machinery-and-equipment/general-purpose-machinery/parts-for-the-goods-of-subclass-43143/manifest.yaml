  semantic_boundary_review:
    decision: promote_legacy
    existing_material_pcr: none_identified
    boundary: "Discrete finished parts designed solely or principally for gas turbines other than turbo-jets and turbo-propellers; complete turbines, turbo-jet and turbo-propeller parts, general-purpose components classified in their own right, services, and transport packaging are excluded."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: output_finished_gas_turbine_part
      reason: No exact public state-100 TianGong product flow was found for the reference product.
  unresolved:
    inventory_flow_uuids:
      - row_id: input_nickel_superalloy_stock
        reason_code: no_exact_candidate
        explanation: "Five public state-100 candidates were directly read; none established nickel-based superalloy composition together with the required stock state."
      - row_id: input_stainless_steel_stock
        reason_code: no_exact_candidate
        explanation: "The directly read candidates were a nuclear fuel rod and a non-alloy steel billet; neither was exact stainless-steel stock."
      - row_id: input_water_miscible_mwf
        reason_code: no_exact_candidate
        explanation: "All directly read candidates were mineral concentrates rather than formulated water-miscible metalworking-fluid concentrate."
      - row_id: output_nickel_superalloy_chips
        reason_code: no_exact_candidate
        explanation: "The directly read waste candidates were steel or composition-unspecified metal scrap and did not preserve nickel-based superalloy identity."
      - row_id: output_nitrogen_oxides
        reason_code: no_exact_candidate
        explanation: "All directly read candidates were nitrous oxide records, a different chemical species, and several used non-air compartments."
      - row_id: input_ysz_powder
        reason_code: no_exact_candidate
        explanation: "The directly read candidates were generic ceramic powder, yttrium oxide, and zirconium metal; none was yttria-stabilized zirconia coating powder."
      - row_id: output_spent_caustic_solution
        reason_code: no_exact_candidate
        explanation: "The sole directly read candidate was generic waste alkaline liquor and did not establish sodium-hydroxide bath chemistry and metal-cleaning origin."
      - row_id: output_finished_gas_turbine_part
        reason_code: no_exact_candidate
        explanation: "The directly read candidates were a wind turbine generator and a wind turbine main shaft, not industrial gas-turbine parts under this PCR boundary."
    range_evidence_needs:
      - row_id: input_nickel_superalloy_stock
        explanation: "Collect product- and route-specific foreground mass; no two independent boundary-compatible original sources support a transferable range."
      - row_id: input_stainless_steel_stock
        explanation: "Collect product- and route-specific foreground mass; no two independent boundary-compatible original sources support a transferable range."
      - row_id: input_primary_electricity
        explanation: "Collect metered foreground electricity; external cases are not boundary-compatible enough for a transferable range."
      - row_id: input_natural_gas
        explanation: "Collect metered foreground gas at declared reference conditions; no defensible two-source range was established."
      - row_id: input_process_oxygen
        explanation: "Collect route-specific oxygen use where applicable; no defensible two-source range was established."
      - row_id: output_fossil_co2
        explanation: "Calculate or measure direct site emissions; no independent empirical range with compatible fuel and control boundary was established."
      - row_id: output_nitrogen_oxides
        explanation: "Measure or calculate direct site emissions using documented conditions; no independent compatible empirical range was established."
      - row_id: input_machining_electricity
        explanation: "Collect machine- or cell-metered electricity; machining intensity is product- and technology-specific."
      - row_id: input_machining_water
        explanation: "Collect process-water records; cleaning and coolant-system boundaries vary across sites."
      - row_id: input_water_miscible_mwf
        explanation: "Collect additions and inventory changes; no compatible independent range for the selected formulation and machining route was established."
      - row_id: output_nickel_superalloy_chips
        explanation: "Calculate from segregated weighed chips and stock balance; removal ratios are part-geometry-specific."
      - row_id: output_steel_chips
        explanation: "Calculate from segregated weighed chips and stock balance; removal ratios are part-geometry-specific."
      - row_id: output_spent_coolant
        explanation: "Collect waste shipment and sump records; coolant life and water content are site-specific."
      - row_id: input_surface_electricity
        explanation: "Collect equipment-metered electricity for the declared surface route; no compatible independent range was established."
      - row_id: input_surface_water
        explanation: "Collect water-meter and bath records; route and rinse configuration control use."
      - row_id: input_sodium_hydroxide
        explanation: "Collect chemical issue and bath-maintenance records; bath chemistry and drag-out controls are site-specific."
      - row_id: input_ysz_powder
        explanation: "Collect powder feed, recovery, and inventory records; coating design and transfer efficiency are product-specific."
      - row_id: output_spent_caustic_solution
        explanation: "Collect bath-disposal records; bath life, dilution, and contamination are site-specific."
