    used_for: "Original-text verification that energy and refrigerant are material aspects and that R290, R600a, R744, R404A, R134a, and R410A occur as distinct refrigerants or blends in commercial refrigeration contexts"
  - id: "eu-2024-573-fgas"
    type: "standard"
    reference: "European Parliament and Council, Regulation (EU) 2024/573 on fluorinated greenhouse gases, consolidated text: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R0573-20240220"
