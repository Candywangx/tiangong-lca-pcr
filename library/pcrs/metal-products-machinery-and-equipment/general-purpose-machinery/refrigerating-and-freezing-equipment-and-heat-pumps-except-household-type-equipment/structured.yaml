allocation_rules:
  - rule_id: allocation_avoid_by_submetering
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by separate BOMs, production orders, meters, batch logs, charge logs, test records, and scrap records for the declared model or production family."
    source_ids: []
  - rule_id: allocation_shared_factory_resources
    applies_to: "foreground_burden_allocation"
    rule: "When shared electricity, water, test gas, or overhead cannot be subdivided, apply a documented causal driver such as machine time, test time, metered load, or production hours; use mass or item count only when shown to represent resource causation."
    source_ids: []
  - rule_id: allocation_scrap_no_credit
    applies_to: "foreground_burden_allocation"
    rule: "Report steel, aluminium, and copper scrap as waste at the point of generation; assign no avoided-burden or recycling credit inside this foreground inventory, and disclose any downstream recycling model separately."
    source_ids: []
  - rule_id: allocation_rework_and_rejects
    applies_to: "foreground_burden_allocation"
    rule: "Include attributable rework inputs and allocate unrecovered rejected-item burdens across accepted output using the documented production-order accounting period; exclude inputs demonstrably recovered intact into the same period."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "component_preparation_and_assembly"
      flow_role: "Structural materials and incorporated components"
      record_type: "Model BOM, purchase specification, goods receipt, stock issue, cut plan"
      raw_fields: "model, part number, material specification, quantity, unit mass, issued mass, incorporated mass, supplier"
      collection_method: "Reconcile approved BOM to production-order issues and supplier mass evidence"
      unit: "kg"
      frequency: "Each model revision and production order"
      temporal_coverage: "Representative production period, normally at least 12 consecutive months or the complete shorter campaign"
      site_scope: "Reporting factory"
      aggregation_rule: "Sum conforming incorporated quantities and attributable issues; normalize to accepted items"
      quality_evidence: "Approved BOM revision, supplier datasheet or invoice, stock ledger, production-order reconciliation"
    - protocol_id: cp_factory_electricity
      process_id: "component_preparation_and_assembly"
      flow_role: "Manufacturing electricity"
      record_type: "Main/submeter readings, interval data, production hours"
      raw_fields: "meter id, opening and closing reading, kWh, area or machine, model output, downtime"
      collection_method: "Submeter preferred; otherwise reconcile site bill and allocate with a causal operating driver"
      unit: "kWh retained; MJ projected"
      frequency: "Monthly or finer"
      temporal_coverage: "Same representative period as production output"
      site_scope: "Reporting factory and included production areas"
      aggregation_rule: "Subtract excluded loads, allocate included load, divide by accepted items, convert at 3.6 MJ/kWh"
      quality_evidence: "Calibrated meter record, utility invoice, reconciliation and allocation worksheet"
    - protocol_id: cp_scrap_records
      process_id: "component_preparation_and_assembly"
      flow_role: "Segregated steel, aluminium, and copper scrap"
      record_type: "Weigh ticket, bin log, recycler receipt"
      raw_fields: "material, gross and tare mass, date, production area, disposition"
      collection_method: "Weigh each segregated stream and reconcile opening/closing bin inventory"
      unit: "kg"
      frequency: "Each removal, aggregated monthly"
      temporal_coverage: "Same representative period as production output"
      site_scope: "Reporting factory"
      aggregation_rule: "Sum net generated mass by material and normalize to accepted items"
      quality_evidence: "Calibrated scale or external weighbridge ticket and recycler receipt"
    - protocol_id: cp_test_materials
      process_id: "refrigerant_circuit_charging_and_test"
      flow_role: "Nitrogen, helium, and process water"
      record_type: "Cylinder/bulk inventory, meter, batch test log"
      raw_fields: "medium, purity, opening stock, receipts, closing stock, recovered amount, reference conditions, water meter"
      collection_method: "Close medium-specific stock balance and link use to tested serial numbers"
      unit: "kg"
      frequency: "Each batch, cylinder change, or meter period"
      temporal_coverage: "Same representative period as tested accepted output"
      site_scope: "Charging and test stations"
      aggregation_rule: "Net consumed mass divided by accepted tested items; retain gas conversion evidence"
      quality_evidence: "Cylinder certificate, calibrated meter, recovery log, test record"
    - protocol_id: cp_refrigerant_balance
      process_id: "refrigerant_circuit_charging_and_test"
      flow_role: "Refrigerant charge and factory loss by species"
      record_type: "Refrigerant stock, receipt, charging-machine, recovery, return, and serial charge logs"
      raw_fields: "species, blend designation, purity, opening stock, receipts, closing stock, charged mass, recovered mass, returned mass, serial number"
      collection_method: "Close a separate mass balance for each refrigerant species or blend"
      unit: "kg"
      frequency: "Each charging event with monthly closure"
      temporal_coverage: "Same representative period as charged accepted output"
      site_scope: "All factory storage and charging points"
      aggregation_rule: "Charged product mass is the accepted serial charge; loss is balance residual after recovery and returns, never below zero without investigation"
      quality_evidence: "Calibrated charging equipment, purchase/return records, recovery logs, signed balance worksheet"
    - protocol_id: cp_packaging_bom
      process_id: "final_packaging_and_release"
      flow_role: "Corrugated boxes, EURO pallets, and LDPE film"
      record_type: "Packaging BOM, issue record, scale record"
      raw_fields: "packaging type, material, unit mass, issued quantity, reusable status, items per pallet"
      collection_method: "Reconcile issued packaging to released serial numbers and weigh representative packs"
      unit: "kg"
      frequency: "Each packaging design revision and production order"
      temporal_coverage: "Same representative period as released output"
      site_scope: "Reporting factory dispatch boundary"
      aggregation_rule: "Sum packaging supplied with one item; allocate shared pallet by actual item count"
      quality_evidence: "Approved packaging specification, scale record, issue and dispatch reconciliation"
    - protocol_id: cp_acceptance_record
      process_id: "final_packaging_and_release"
      flow_role: "Finished equipment reference product"
      record_type: "Serial, model, net-mass, performance, electrical and release records"
      raw_fields: "serial, model, subtype, capacity, test standard and conditions, temperature class, electrical supply, refrigerant, charge, net mass, acceptance status, release date"
      collection_method: "Link calibrated final-test results and mass record to each accepted serial or statistically controlled model family"
      unit: "item and kg"
      frequency: "Each accepted item"
      temporal_coverage: "Same representative period as all input records"
      site_scope: "Final test and dispatch gate"
      aggregation_rule: "Count accepted items and report measured or BOM-reconciled net mass per item"
      quality_evidence: "Signed acceptance record, calibrated test result, scale or controlled BOM, nonconformance disposition"
  calculation_rules:
    - id: calc_normalize_per_accepted_item
      applies_to: "All foreground exchanges"
      rule: "Divide the period total attributable to the declared model by accepted items in the same period; for mixed-model production first apply the documented causal allocation driver."
      inputs:
        - "attributable period quantity"
        - "accepted item count"
        - "allocation driver where needed"
      output: "atomic exchange per accepted item"
      source_ids: []
    - id: calc_electricity_to_mj
      applies_to: "manufacturing_electricity"
      rule: "projected MJ = retained metered kWh × 3.6"
      inputs:
        - "included metered kWh"
      output: "electricity in MJ per accepted item"
      source_ids: []
    - id: calc_refrigerant_charge
      applies_to: "Refrigerant input rows"
      rule: "Sum verified charge retained in accepted serials for each refrigerant separately and divide by accepted charged items of that design."
      inputs:
        - "serial charge logs"
        - "accepted charged item count"
      output: "refrigerant charge in kg per accepted item"
      source_ids:
        - eu-2015-1095-professional-refrigeration
        - eu-2024-573-fgas
    - id: calc_refrigerant_loss
      applies_to: "r410a_emission_to_air"
      rule: "loss = opening stock + receipts − closing stock − accepted product charge − recovered mass − returned mass; investigate negative or unexplained balances and report only demonstrated non-negative atmospheric loss."
      inputs:
        - stock
        - receipts
        - charges
        - recovery
        - returns
      output: "R410A emitted to air in kg per accepted item"
      source_ids:
        - eu-2024-573-fgas
    - id: calc_scrap_by_material
      applies_to: "Metal scrap outputs"
      rule: "For each metal separately, generated scrap = outbound scrap + closing on-site scrap − opening on-site scrap; normalize to accepted items after model attribution."
      inputs:
        - "material-specific bin inventory and outbound weights"
      output: "waste mass by metal per accepted item"
      source_ids: []
  data_quality_requirements:
    - id: dq_temporal_alignment
      applies_to: "All foreground records"
      requirement: "Use one common representative production period; where a shorter campaign is used, disclose dates, reason, and production coverage."
      evidence: "Period reconciliation linking invoices, meters, stock, production, test, and release records"
    - id: dq_model_representativeness
      applies_to: "Product family datasets"
      requirement: "Demonstrate that included models share material architecture, component technology, refrigerant route, factory operations, and acceptance criteria; otherwise publish separate datasets."
      evidence: "Model-family definition, BOM comparison, route matrix, production-weight calculation"
    - id: dq_measurement_traceability
      applies_to: "Mass, energy, gas, charge, and performance records"
      requirement: "Identify instrument, calibration or supplier certificate, measurement resolution, conversion, and responsible record system."
      evidence: "Calibration certificates, supplier certificates, controlled meter register, audit trail"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile all 26 required atomic rows as measured/calculated or explicitly not applicable, close material-specific and refrigerant balances, and disclose unresolved UUID identities without inventing proxies."
      evidence: "Signed completeness checklist, balances, UUID audit receipts, exception log"
    - id: dq_geography_and_technology
      applies_to: "Foreground and linked upstream data"
      requirement: "Declare factory geography, technology, purchased-component boundary, grid contract, refrigerant grade, and supplier geography; explain any non-representative upstream link."
      evidence: "Dataset metadata, supplier declarations, linked-dataset review"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that the modeled output is a complete non-household CPC 43913 product, the reference UUID is exact and public state 100, the output property is Mass, and one accepted item is reconciled to its net kg mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_qualifiers
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a data package that omits equipment subtype/model, capacity and test conditions, temperature class, refrigerant species and charge, heat-source/sink configuration, electrical supply, net mass, factory geography, period, or packaging status."
    source_ids:
      - eu-2015-1095-professional-refrigeration
  - rule_id: validate_atomic_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm every inventory card represents one atomic exchange, uses the exact audited UUID when adopted, and is either quantified or explicitly not applicable under its condition; no umbrella utility, fuel, packaging, waste, emission, component, or refrigerant selector is allowed."
    source_ids: []
  - rule_id: validate_refrigerant_exclusivity
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that only refrigerants actually charged into the declared model are active, each is recorded separately, charge and factory loss close by species, and product refrigerant flows are not used as elementary emissions."
    source_ids:
      - jrc91168-commercial-refrigeration
      - eu-2024-573-fgas
  - rule_id: validate_boundary_and_allocation
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm factory-gate exclusions, upstream links, shared-resource drivers, rework/reject treatment, and no foreground recycling credit; report any study-level extension separately."
    source_ids: []
  - rule_id: validate_bilingual_alignment
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm the English and Chinese projections preserve identical process ids, row ids, rule ids, source ids, UUIDs, controlled codes, and inventory-row order, and use official TianGong Chinese base names for every UUID-bearing flow."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific or demonstrably production-weighted family foreground manufacturing dataset for one complete non-household refrigerating/freezing equipment or heat-pump item"
  downstream_use: "Link upstream supply datasets and, when required, separate distribution, installation, operation, servicing, and end-of-life scenarios to construct process or lifecycle-model projections"
  allowed_use: "Factory-gate comparison only among products with compatible subtype, function, capacity/test conditions, temperature class, refrigerant, factory boundary, geography, period, and packaging status"
  excluded_use: "Direct comparison of unlike cooling/heating functions; household equipment; component or refrigerant production; use-stage efficiency claims; cradle-to-grave results without separate downstream modules"
  required_metadata: "All reference-flow qualifiers; process applicability; purchased-component boundary; foreground period and geography; source record systems; allocation drivers; upstream links and gaps; UUID audit status; package version"
  required_quality_disclosure: "Coverage of accepted output, model-family representativeness, measurement/calibration status, mass and refrigerant balance closure, allocation fraction, exclusions, not-applicable rows, unresolved UUIDs, and absence of source-backed amount ranges"
  update_trigger: "Change in model architecture, rated function/capacity class, refrigerant or charge, compressor/heat-exchanger technology, major material or packaging design, factory route/site, grid contract, allocation driver, or representative period"
