measurement_rules:
  - id: reference_item_mass
    applies_to: "finished_equipment and all per-item normalization"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure or derive from an auditable model-specific bill of materials the net mass of one accepted item; exclude separately reported packaging and reusable shipping fixtures, and reconcile any item-count conversion to this mass."
  - id: material_and_component_mass
    applies_to: "Purchased materials, incorporated components, packaging, scrap, test gases, process water, refrigerant charges, and factory refrigerant loss"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report each atomic exchange separately by measured, invoiced, BOM, cylinder, or mass-balance mass; do not combine unlike materials, components, gases, refrigerants, wastes, or emissions."
  - id: electricity_energy
    applies_to: "manufacturing_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve the metered kWh record and convert only for projection using 1 kWh = 3.6 MJ; document meter boundary, allocation driver, voltage level, geography, and grid contract."
  - id: refrigerant_species_balance
    applies_to: "Refrigerant inputs and factory refrigerant emissions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep every refrigerant species or blend in a separate row and close the model-period mass balance from opening stock, receipts, closing stock, charged product, recovery, returns, and measured or calculated loss; never substitute one refrigerant for another."
  - id: gas_reference_conditions
    applies_to: "gaseous_nitrogen_test_gas and helium_test_gas"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "If the source record is volumetric, retain temperature and pressure and convert to mass only with a supplier certificate or documented density at matching reference conditions."
