allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared_processes"
    rule: "Avoid allocation by subdividing production lines, batches, meters, furnaces, and waste records so inputs and outputs directly attributable to the declared bearing are collected separately."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_rule_2
    applies_to: "unavoidable_shared_burdens"
    rule: "When subdivision is not possible, use a causal physical relationship such as machine time, furnace occupancy, metered energy, processed mass, surface area, or batch time. Document the driver, numerator, denominator, affected products, and sensitivity."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_rule_3
    applies_to: "non_physical_allocation"
    rule: "Use economic or another non-physical relationship only after documenting why subdivision and a relevant physical relationship are infeasible. Record prices, period, geography, co-product status, and sensitivity."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_rule_4
    applies_to: "recycled_metal_and_waste"
    rule: "Keep the burdens of collecting, conditioning, and treating chips, swarf, wastewater, and other wastes on the generating system until the declared treatment or end-of-waste boundary. Report any recycling credit or substitution scenario separately; do not subtract it invisibly from foreground quantities."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_rule_5
    applies_to: "rework_and_internal_recycling"
    rule: "Track internal rework and recirculated material without creating a second product output. Count only net external inputs and outputs while retaining gross process records for audit and mass-balance checks."
    source_ids:
      - skf-green-bearings
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "forming_and_turning"
      flow_role: "bearing_steel_input"
      record_type: "scale and stock records"
      raw_fields: "alloy grade; delivered form; gross and tare mass; opening and closing stock; returns; work in progress"
      collection_method: "Weigh steel charged by alloy and route and reconcile stock, returns, chips, and work in progress."
      unit: "kg"
      frequency: "each receipt and production batch"
      temporal_coverage: "representative reporting period"
      site_scope: "reporting site and attributed contracted forming"
      aggregation_rule: "net attributable mass divided by conforming output mass"
      quality_evidence: "scale identity, calibration status, stock reconciliation, supplier record"
    - protocol_id: cp_stage_electricity
      process_id: "forming_and_turning_heat_treatment_grinding_honing_cleaning"
      flow_role: "forming_electricity; heat_treatment_electricity; grinding_electricity"
      record_type: "electricity meter records"
      raw_fields: "meter reading; timestamp; meter boundary; stage; batch; shared-load driver"
      collection_method: "Collect separate stage meters; allocate shared meters only with documented machine time, checked rated load, or furnace occupancy."
      unit: "kWh and MJ"
      frequency: "continuous or each batch"
      temporal_coverage: "same period as output"
      site_scope: "each included site and outsourced operation"
      aggregation_rule: "stage total converted to MJ and divided by conforming output mass"
      quality_evidence: "meter identity, calibration, allocation worksheet, energy invoice reconciliation"
    - protocol_id: cp_waste_mass
      process_id: "forming_and_turning_grinding_honing_cleaning"
      flow_role: "steel_machining_chips; steel_grinding_swarf"
      record_type: "waste scale and dispatch records"
      raw_fields: "gross mass; tare; wet or dry state; alloy; retained fluid; destination; end-of-waste status"
      collection_method: "Weigh each stream separately at removal and correct for documented container tare."
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "same period as output"
      site_scope: "each generating operation"
      aggregation_rule: "net stream mass divided by conforming output mass"
      quality_evidence: "weigh ticket, tare record, waste transfer record, moisture or retained-fluid note"
    - protocol_id: cp_natural_gas
      process_id: "heat_treatment"
      flow_role: "natural_gas_heat_treatment"
      record_type: "gas meter or reconciled billing record"
      raw_fields: "volume; temperature; pressure; timestamp; furnace; composition or calorific value"
      collection_method: "Read the heat-treatment meter or reconcile billed volume to furnace operation and state reference conditions."
      unit: "m3"
      frequency: "continuous or each furnace batch"
      temporal_coverage: "same period as heat-treated output"
      site_scope: "gas-fired heat treatment within foreground boundary"
      aggregation_rule: "attributable reference-condition volume divided by conforming output mass"
      quality_evidence: "meter identity, calibration, bill reconciliation, supplier specification"
    - protocol_id: cp_direct_combustion
      process_id: "heat_treatment"
      flow_role: "fossil_co2_heat_treatment"
      record_type: "stack result or fuel-carbon calculation"
      raw_fields: "stack mass or fuel quantity; carbon content or emission factor; oxidation fraction; unit conversion"
      collection_method: "Prefer site stack or fuel-carbon records; otherwise calculate from metered gas with a documented supplier factor and oxidation assumption."
      unit: "kg"
      frequency: "each monitored period or furnace batch"
      temporal_coverage: "same period as fuel record"
      site_scope: "foreground gas-fired equipment only"
      aggregation_rule: "direct fossil CO2 divided by conforming output mass"
      quality_evidence: "stack report or complete factor provenance and calculation sheet"
    - protocol_id: cp_process_water
      process_id: "grinding_honing_cleaning"
      flow_role: "process_water_cleaning"
      record_type: "water meter or scale record"
      raw_fields: "make-up quantity; source; quality; temperature; density; recirculation boundary"
      collection_method: "Meter or weigh net make-up process water delivered to cleaning; exclude gross recirculating flow."
      unit: "kg"
      frequency: "continuous or each cleaning batch"
      temporal_coverage: "same period as cleaned output"
      site_scope: "foreground aqueous-cleaning system"
      aggregation_rule: "net make-up mass divided by conforming output mass"
      quality_evidence: "meter identity, calibration, density conversion, water balance"
    - protocol_id: cp_cleaning_wastewater
      process_id: "grinding_honing_cleaning"
      flow_role: "cleaning_wastewater"
      record_type: "effluent meter, scale, and dispatch record"
      raw_fields: "quantity; temperature; density; destination; contaminant characterization"
      collection_method: "Meter or weigh wastewater leaving the foreground boundary and reconcile it to water input, retention, and evaporation."
      unit: "kg"
      frequency: "continuous or each discharge"
      temporal_coverage: "same period as cleaning input"
      site_scope: "foreground aqueous-cleaning system"
      aggregation_rule: "boundary-crossing wastewater mass divided by conforming output mass"
      quality_evidence: "meter or weigh ticket, density conversion, water balance, treatment record"
    - protocol_id: cp_auxiliary_mass
      process_id: "assembly_lubrication_preservation"
      flow_role: "bearing_lubricating_grease; bearing_rust_preventive_oil"
      record_type: "scale, purchase, and stock records"
      raw_fields: "product name; grade; supplier; lot; gross and tare mass; opening and closing stock"
      collection_method: "Weigh or reconcile each separately specified auxiliary actually used or retained on the bearing."
      unit: "kg"
      frequency: "each batch and reporting period"
      temporal_coverage: "same period as assembled output"
      site_scope: "assembly and preservation operations"
      aggregation_rule: "net attributable product mass divided by conforming output mass"
      quality_evidence: "scale calibration, purchase and stock reconciliation, product specification or safety-data identifier"
    - protocol_id: cp_packaging_mass
      process_id: "inspection_packaging"
      flow_role: "packaging_corrugated_boxes"
      record_type: "packaging scale and issue record"
      raw_fields: "box specification; gross and tare mass; issued, unused, and returned quantities; recycled content"
      collection_method: "Weigh boxes issued to declared output, net of unused stock and returns, outside net bearing mass."
      unit: "kg"
      frequency: "each packaging batch"
      temporal_coverage: "same period as packaged output"
      site_scope: "final packaging operation"
      aggregation_rule: "box mass divided by net conforming bearing mass"
      quality_evidence: "scale calibration, packaging issue reconciliation, supplier specification"
    - protocol_id: cp_output_mass
      process_id: "inspection_packaging"
      flow_role: "final_bearing_output"
      record_type: "release scale and production record"
      raw_fields: "product designation; net mass; accepted quantity; rejects; work in progress; shipment"
      collection_method: "Weigh net conforming bearings after release inspection and before transport packaging; reconcile production and shipment."
      unit: "kg"
      frequency: "each released batch"
      temporal_coverage: "representative reporting period"
      site_scope: "all included bearing production sites"
      aggregation_rule: "conforming net mass is denominator and normalized to 1 kg"
      quality_evidence: "scale calibration, inspection release, production and shipment reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide each reporting-period exchange assigned to conforming bearings by net conforming bearing mass from the same period and boundary."
      inputs:
        - "attributable exchange quantity"
        - "conforming output mass"
      output: "exchange per 1 kg reference flow"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_electricity_conversion
      applies_to: "stage electricity rows"
      rule: "Multiply metered kWh by 3.6 while preserving the meter record and factor."
      inputs:
        - "electricity in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_water_mass
      applies_to: "water rows"
      rule: "Multiply measured volume by a stated density appropriate to measured temperature and composition."
      inputs:
        - volume
        - temperature
        - "water composition"
        - density
      output: "water mass in kg"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "fossil_co2_heat_treatment"
      rule: "Multiply metered fuel quantity by documented fossil-carbon or supplier emission factor and oxidation fraction; exclude upstream emissions."
      inputs:
        - "fuel quantity"
        - factor
        - "oxidation fraction"
        - "unit conversions"
      output: "direct fossil CO2 mass"
      source_ids:
        - eu-recommendation-2021-2279
    - id: calc_metal_balance
      applies_to: "forming, turning, grinding, and final output"
      rule: "Reconcile alloy-specific steel input with conforming product, chips, swarf, rejects, retained work in progress, and documented stock change; investigate material imbalance."
      inputs:
        - "alloy-specific material records"
      output: "documented metal balance and discrepancy"
      source_ids:
        - skf-green-bearings
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Record bearing family, rolling-element type, principal dimensions, applicable load or tolerance class, seal or shield state, cage and ring materials, heat-treatment route, lubrication, and packaging state."
      evidence: "product specification, drawing, inspection and release record"
    - id: dq_measurement
      applies_to: "all measured rows"
      requirement: "Prefer calibrated direct measurement and record instrument identity, resolution, calibration status, interval, missing-data treatment, and uncertainty."
      evidence: "calibration certificate, meter log, scale record, uncertainty note"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Use a representative continuous 12-month period where available or justify a shorter campaign capturing batch and operating variability; align numerator and denominator periods."
      evidence: "reporting-period statement and representativeness assessment"
    - id: dq_site_scope
      applies_to: "all processes"
      requirement: "Identify each included site and outsourced operation; do not omit a material step because it occurs off site."
      evidence: "site and supplier process map, contracts, purchasing records"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Reconcile purchased materials, site records, wastes, direct emissions, and conforming output; identify and quantitatively justify every exclusion."
      evidence: "mass and energy reconciliations, exclusion register"
    - id: dq_technology
      applies_to: "all processes"
      requirement: "Describe forming, machining, heat-treatment atmosphere and furnace, grinding and honing, cleaning, assembly, lubrication, preservation, inspection, and packaging technologies sufficiently to distinguish routes."
      evidence: "process specifications, equipment list, production instructions"
    - id: dq_upstream_data
      applies_to: "all purchased inputs"
      requirement: "Match datasets to actual alloy, auxiliary grade, energy supply, water source, packaging, geography, technology, product state, and delivery boundary; document proxies and sensitivity."
      evidence: "dataset-selection log and sensitivity assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that the declared product is a complete ball or roller bearing under the stated boundary and not a bearing housing, plain bearing, loose ball, loose roller, bearing unit, or spare part."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that the reference product is exactly 1 kg net conforming finished bearing at the factory gate and that packaging mass is excluded from that net mass."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that all five required manufacturing stages are represented, including outsourced stages, and that exclusions or non-applicable steps are explicitly justified."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that every inventory row is an atomic physical, chemical, waste, energy, or elementary exchange and that no umbrella utility, fuel, packaging, chemical, wastewater, residue, or emission row is used."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that forming, heat-treatment, and grinding electricity are collected and reported separately, even where an allocation procedure uses a shared meter."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that machining chips and grinding swarf remain separate waste flows and are not netted against bearing-steel input or combined with rejected bearings."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that direct fossil carbon dioxide represents only foreground gaseous-natural-gas combustion and excludes upstream energy-system emissions."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that the metal balance and the cleaning-water balance have been performed and that material discrepancies are documented."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that UUID-bearing rows match the audited TianGong English and Chinese base names, flow type, classification, flow property, unit group, and public state; unresolved rows must retain empty UUIDs and manifest review records."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm that no externally inferred range is used unless at least two independent, original-text-verified sources have compatible boundaries, reference flow, product state, and units."
    source_ids: []
published_dataset_profile:
  dataset_role: "Cradle-to-factory-gate foreground data package for one declared complete ball or roller bearing product, normalized to net conforming mass"
  downstream_use: "Linked product flow, unit-process dataset, manufacturer product footprint, EPD-supporting model, or life-cycle model whose downstream stages and scenarios are added separately"
  allowed_use: "Comparison or aggregation only when product function, declared bearing specification, reference flow, geography, technology, reporting period, system boundary, allocation, and data quality are compatible"
  excluded_use: "Direct representation of loose parts, bearing housings, plain bearings, bearing units outside the declared identity, use-phase performance, maintenance, remanufacturing, or end-of-life scenarios"
  required_metadata: "Production geography and sites; reporting period; product designation and design; mass and dimensions; materials; manufacturing and outsourced routes; lubrication and preservation state; inspection basis; allocation; packaging; upstream dataset choices"
  required_quality_disclosure: "Primary-data share and coverage; meter and scale evidence; missing data; exclusions; allocation drivers; mass, water, and energy reconciliations; proxy datasets; uncertainty; representativeness; unresolved UUIDs and range evidence"
  update_trigger: "Material change in bearing design, mass, alloy, supplier route, manufacturing site or technology, furnace fuel, electricity supply, cleaning system, lubricant or preservation product, packaging, allocation, data coverage, or reporting period"
