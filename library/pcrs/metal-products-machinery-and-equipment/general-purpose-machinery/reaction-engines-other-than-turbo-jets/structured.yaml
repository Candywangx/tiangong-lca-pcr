validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Confirm the product flow UUID, CPC 43133 identity, accepted dry-mass measurement, and all required qualifiers before dataset release."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Reject collection labels or combined flows; each reported material, utility, cleaning chemical, test fluid, package, waste, and elementary emission shall be one atomic exchange."
    source_ids: []
  - rule_id: validate_mass_reconciliation
    applies_to: "manufacturing process"
    rule: "Reconcile material issues, return to stock, accepted dry product, machining scrap, cleaning waste, rejected hardware, and inventory changes; explain any material residual."
    source_ids: []
  - rule_id: validate_test_route
    applies_to: "acceptance testing"
    rule: "Natural gas, industrial oxygen, and fossil carbon dioxide rows may be nonzero only for a documented compatible test route; add separately identified flows for every other test medium or direct emission."
    source_ids:
      - ecss-e-st-35-10c-2009
      - nasa-wstf-development-qualification-acceptance
  - rule_id: validate_direct_emissions
    applies_to: "test exhaust"
    rule: "Confirm direct fossil carbon dioxide is measured at the foreground exhaust boundary and does not repeat upstream emissions embedded in purchased-input datasets."
    source_ids: []
  - rule_id: validate_cleanliness_records
    applies_to: "cleaning and assembly"
    rule: "Confirm that cleaning requirements, verification results, and any post-test re-cleaning are present for the declared engine configuration."
    source_ids:
      - ecss-e-st-35-06c-rev2-2020
  - rule_id: validate_unresolved
    applies_to: "unresolved flow identities and ranges"
    rule: "Keep the wooden-crate and spent-cleaning-solution UUID gaps and all range-evidence needs open until exact identity or independent compatible evidence is reviewed; do not invent proxies or numeric ranges."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset eligible for publication as a secondary_dataset or background_dataset after review"
  downstream_use: "cradle-to-gate product-footprint models for non-turbojet reaction engines and separately disclosed aircraft or spacecraft system models"
  allowed_use: "comparisons or aggregation only when engine technology, dry-mass convention, configuration, acceptance-test boundary, geography, and data quality are compatible"
  excluded_use: "direct substitution for turbo-jets, turbo-propellers, piston engines, separate parts, complete vehicles, operational propellant supply, use-stage thrust or impulse, maintenance, or end-of-life"
  required_metadata: "canonical PCR id; engine technology and model; configuration; CPC identity; dry-mass inclusions; rated thrust or impulse basis; production site and period; test sequence and media; cleanliness class; packaging state; allocation; cut-offs; unresolved identities; data-quality rating"
  required_quality_disclosure: "primary-record share; meter and scale coverage; bill-of-material completeness; upstream dataset representativeness; failures and rework; test traceability; direct-emission measurement; unresolved UUID and range-evidence needs"
  update_trigger: "material change in engine technology, configuration, bill of materials, manufacturing site, cleaning route, acceptance-test sequence or media, dry-mass definition, allocation method, upstream datasets, or resolution of an open identity or range-evidence need"
