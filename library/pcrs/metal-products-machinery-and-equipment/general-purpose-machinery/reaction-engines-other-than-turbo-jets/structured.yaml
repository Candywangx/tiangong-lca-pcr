allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared manufacturing and test operations"
    rule: "Prefer direct metering or subdivision by engine model, work order, machine hour, test firing, or accepted dry mass before allocation."
    source_ids: []
  - rule_id: allocation_shared_facility
    applies_to: "residual shared utilities and support activities"
    rule: "Allocate only the residual unmetered share using a documented causal driver; disclose the driver and test sensitivity when the residual materially affects results."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "machining metal scrap"
    rule: "Keep input-material burdens with the engine product and report scrap at the measured factory-gate waste amount; do not claim an avoided-burden credit unless the governing LCA study method requires it and the credit is reported separately."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejected or reworked units"
    rule: "Attribute rework, retest, and scrapped-unit burdens to the accepted output of the same reporting period; do not omit failed tests from the production yield."
    source_ids:
      - nasa-wstf-development-qualification-acceptance
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "engine_manufacture"
      flow_role: "stainless steel, aluminium-magnesium alloy, and titanium plate inputs"
      record_type: "receiving and material-issue records"
      raw_fields: "flow UUID; material designation; grade; stock form; lot; issued mass; returned mass; supplier; upstream dataset"
      collection_method: "reconcile accepted receipts, work-order issues, and returns to stock"
      unit: "kg"
      frequency: "each lot and work order"
      temporal_coverage: "full reporting period"
      site_scope: "all production areas serving the declared engine"
      aggregation_rule: "sum net issued mass by atomic material and divide by accepted dry output mass"
      quality_evidence: "purchase record; material certificate; calibrated scale record; work-order trace"
    - protocol_id: cp_manufacturing_electricity
      process_id: "engine_manufacture"
      flow_role: "manufacturing electricity"
      record_type: "electricity meter and allocation record"
      raw_fields: "meter id; opening and closing reading; kWh; machine or area; allocation driver; downtime; accepted output mass"
      collection_method: "use submeter first; allocate residual facility consumption with documented causal driver"
      unit: "kWh and MJ"
      frequency: "continuous meter, aggregated monthly"
      temporal_coverage: "full reporting period"
      site_scope: "manufacturing, cleaning, assembly, and attributable support"
      aggregation_rule: "convert kWh to MJ, subtract excluded loads, then divide by accepted dry output mass"
      quality_evidence: "meter calibration; utility invoice; load map; allocation worksheet"
    - protocol_id: cp_cleaning_inputs
      process_id: "engine_manufacture"
      flow_role: "process water and sodium hydroxide"
      record_type: "bath make-up, rinse meter, and chemical issue records"
      raw_fields: "water mass or volume; temperature; density; sodium-hydroxide product mass; concentration; bath id; engine work orders"
      collection_method: "meter water and weigh chemical additions; link batches to cleaned engine hardware"
      unit: "kg and m3"
      frequency: "each bath make-up, addition, and discharge"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope precision-cleaning lines"
      aggregation_rule: "calculate water mass and pure-product-equivalent sodium hydroxide; divide attributable totals by accepted dry output mass"
      quality_evidence: "calibrated meter or scale; chemical certificate; bath log; work-order trace"
    - protocol_id: cp_packaging_crate
      process_id: "engine_manufacture"
      flow_role: "wooden shipping crate"
      record_type: "packaging bill and reuse log"
      raw_fields: "crate id; tare mass; engine id; new or reused status; prior and expected uses"
      collection_method: "weigh the crate and record each documented use"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "full reporting period"
      site_scope: "factory-gate packaging"
      aggregation_rule: "allocate new-crate mass once or amortize reusable-crate mass over documented uses; divide by shipped accepted dry mass"
      quality_evidence: "scale calibration; packing list; reuse log"
    - protocol_id: cp_machining_scrap
      process_id: "engine_manufacture"
      flow_role: "machining metal scrap"
      record_type: "scrap container and dispatch records"
      raw_fields: "container id; tare and gross mass; alloy segregation; contamination; work orders; destination"
      collection_method: "weigh each outbound scrap container and link to production work orders"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "full reporting period"
      site_scope: "all in-scope machining areas"
      aggregation_rule: "subtract tare, sum attributable net scrap, and divide by accepted dry output mass"
      quality_evidence: "calibrated scale; dispatch note; segregation log"
    - protocol_id: cp_spent_cleaning_solution
      process_id: "engine_manufacture"
      flow_role: "spent sodium-hydroxide cleaning solution"
      record_type: "bath discharge record"
      raw_fields: "bath id; solution mass or volume; density; sodium-hydroxide concentration; contamination; destination; work orders"
      collection_method: "weigh discharge or convert measured volume with documented density"
      unit: "kg"
      frequency: "each discharge"
      temporal_coverage: "full reporting period"
      site_scope: "in-scope alkaline cleaning lines"
      aggregation_rule: "calculate attributable discharged mass and divide by accepted dry output mass"
      quality_evidence: "discharge log; meter or scale calibration; waste transfer record; bath analysis"
    - protocol_id: cp_product_output
      process_id: "engine_manufacture"
      flow_role: "accepted dry reaction engine"
      record_type: "final inspection and weighing record"
      raw_fields: "engine id; model; configuration; dry-mass inclusions; gross mass; removable test fluid; packaging tare; acceptance status"
