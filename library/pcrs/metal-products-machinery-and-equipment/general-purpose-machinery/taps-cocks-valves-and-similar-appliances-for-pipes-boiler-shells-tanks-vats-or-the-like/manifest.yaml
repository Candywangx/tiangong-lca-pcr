    range_evidence_needs:
      - need_id: component-and-reference-yield-ranges
        row_ids: [mc_rough_steel_body, mc_rough_steel_bonnet, as_valve_stem, as_valve_disc, as_elastomer_seat, as_steel_fasteners, te_steel_valve]
        explanation: "Compatible independent original-text sources were not found for component mass shares or conforming steel-valve yield across the same factory-gate boundary; collect product- and site-specific bills of materials and production mass records."
      - need_id: machining-resource-ranges
        row_ids: [mc_electricity, mc_cutting_fluid, mc_process_water, mc_sodium_hydroxide]
        explanation: "No two independent sources with compatible machining boundary, steel-valve product state, and kg reference basis were verified; collect meters, issue records, and bath make-up records."
      - need_id: machining-waste-ranges
        row_ids: [mc_steel_swarf, mc_nonferrous_swarf, mc_spent_cutting_fluid, mc_cleaning_wastewater]
        explanation: "Waste quantities depend on stock allowance, material, coolant management, and cleaning route; no compatible two-source empirical range was verified, so weigh or meter each foreground output."
      - need_id: surface-treatment-ranges
        row_ids: [st_electricity, st_process_water, st_zinc_metal, st_powder_coating, st_wastewater, st_powder_waste]
        explanation: "Electroplating and powder-coating routes have incompatible chemistry and boundaries; no external range was synthesized across them. Collect route-specific meter, bath, coating-issue, and waste records."
      - need_id: assembly-and-reject-ranges
        row_ids: [as_steel_fasteners, as_lubricating_grease, as_electricity, as_new_steel_scrap]
        explanation: "No two independent boundary-compatible sources were verified for steel-valve assembly energy, grease, fastener share, or reject scrap. Use work-order, bill-of-material, electricity, and nonconformance records."
      - need_id: test-resource-ranges
        row_ids: [te_process_water, te_electricity, te_test_wastewater]
        explanation: "Hydrostatic test pressure, hold time, recirculation, and water replacement practice vary by product standard and site; no compatible two-source empirical range was verified."
