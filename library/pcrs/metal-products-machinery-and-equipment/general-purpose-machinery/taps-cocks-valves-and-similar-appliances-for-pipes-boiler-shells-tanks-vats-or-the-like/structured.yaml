allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared manufacturing operations"
    rule: "First avoid allocation through submetering, lot-specific material issue, machine time, bath loading, test cycles, and direct waste measurement."
    source_ids: []
  - rule_id: allocation_mass
    applies_to: "unavoidable shared operations"
    rule: "If physical subdivision is not practicable, allocate shared material and energy burdens by a documented causal parameter; use processed mass only when it reasonably represents machine, bath, or handling demand."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework loops"
    rule: "Keep reworked units and all incremental machining, cleaning, coating, assembly, and testing exchanges inside the foreground system; allocate them to conforming output, not to a co-product."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "steel swarf and new steel scrap"
    rule: "Record waste mass and downstream recycling or treatment separately. Do not subtract avoided virgin-metal burdens from the foreground inventory unless the study applies and discloses a consistent recycling allocation method."
    source_ids: []
  - rule_id: allocation_no_product_credit
    applies_to: "wastewater and coating waste"
    rule: "Treat spent fluid, wastewater, and powder-coating waste as wastes unless a documented marketable co-product meeting a specification leaves the site; disclose any departure and its allocation basis."
    source_ids:
      - us-epa-mpm-2003
dataset_production:
  collection_protocols:
    - protocol_id: cp_machining_records
      process_id: "component_machining_cleaning"
      flow_role: "all inputs, intermediate outputs, swarf, spent cutting fluid, and cleaning wastewater"
      record_type: "meter, scale, material issue/return, transfer, and waste manifest records"
      raw_fields: "lot_id; product_model; component_id; supplier; material_grade; opening_stock; receipts; issues; returns; closing_stock; meter_start; meter_end; water_mass_or_volume; density; accepted_transfer_mass; waste_mass; retained_fluid_basis"
      collection_method: "calibrated meters and scales reconciled with inventory and transfer records"
      unit: "kg; MJ; original meter unit retained"
      frequency: "per lot or shift, aggregated monthly"
      temporal_coverage: "at least one representative production year or the full shorter campaign"
      site_scope: "all machines, washers, tanks, and waste points serving the declared product"
      aggregation_rule: "sum net issues and measured exchanges; allocate shared meters by documented machine time or processed mass and normalize to accepted output"
      quality_evidence: "calibration status; invoices; issue/return records; lot travellers; scale tickets; meter logs; waste manifests; reconciliation sign-off"
    - protocol_id: cp_surface_treatment_records
      process_id: "surface_treatment"
      flow_role: "route-specific components, electricity, water, zinc, powder coating, wastewater, and coating waste"
      record_type: "bath, coating-line, meter, issue/return, transfer, and waste records"
      raw_fields: "lot_id; route_id; bath_id; coating_product; opening_stock; issues; recovered_powder; returns; closing_stock; meter_start; meter_end; make_up_water; treated_input_mass; treated_output_mass; wastewater_mass; waste_mass; chemistry"
      collection_method: "calibrated meters/scales plus bath and coating inventory reconciliation"
      unit: "kg; MJ; original meter unit retained"
      frequency: "per batch or shift, aggregated monthly"
      temporal_coverage: "at least one representative production year or the full shorter campaign"
      site_scope: "each plating, pretreatment, powder, cure, rinse, and waste system in scope"
      aggregation_rule: "keep electroplating and powder-coating routes separate; sum net consumption and outputs and normalize to treated output"
      quality_evidence: "calibration; batch sheets; bath analyses; coating issue/return logs; meter logs; waste manifests; route reconciliation"
    - protocol_id: cp_assembly_records
      process_id: "valve_assembly"
      flow_role: "incorporated components, grease, electricity, assembled output, and new steel scrap"
      record_type: "bill of materials, work order, issue/return, scale, meter, rework, and nonconformance records"
      raw_fields: "product_model; drawing_revision; lot_id; component_id; item_count; verified_unit_mass; issues; returns; grease_issue; meter_start; meter_end; assembled_mass; rework_count; reject_disposition; scrap_mass"
      collection_method: "BOM calculation checked against calibrated mass and production records"
      unit: "kg; MJ; item(s) retained as raw field"
      frequency: "per work order or shift, aggregated monthly"
      temporal_coverage: "at least one representative production year or the full shorter campaign"
      site_scope: "all assembly cells and rework stations serving the declared product"
      aggregation_rule: "calculate incorporated mass from count and verified unit mass; reconcile issues, returns, assembled output, rework, and scrap"
      quality_evidence: "controlled BOM; drawings; unit-mass verification; meter logs; rework travellers; nonconformance and scrap records"
    - protocol_id: cp_testing_records
      process_id: "final_testing"
      flow_role: "assembled input, hydrostatic water, electricity, accepted product, and discarded test water"
      record_type: "test record, meter, scale, water make-up, drainage, rework, and reject records"
      raw_fields: "product_model; serial_or_lot; test_standard; medium; pressure; temperature; hold_time; acceptance_result; retest_count; input_mass; accepted_mass; water_make_up; water_discharge; meter_start; meter_end; drainage_state"
      collection_method: "calibrated test stand, meters, and final-product scale with retained acceptance record"
      unit: "kg; MJ; pressure and time in declared units"
      frequency: "every acceptance test, aggregated monthly"
      temporal_coverage: "at least one representative production year or the full shorter campaign"
      site_scope: "all final-test stands and linked water systems serving the declared product"
      aggregation_rule: "sum accepted drained mass; include resources for pass, retest, and fail cycles; normalize all exchanges to accepted mass"
      quality_evidence: "calibration certificates; signed/electronic test records; meter logs; drainage records; traceability to work order"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory exchanges"
      rule: "normalized amount = reporting-period exchange / reporting-period drained accepted steel-valve mass"
      inputs:
        - "measured exchange"
        - "te_steel_valve accepted mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_net_material_issue
      applies_to: "cutting fluid, sodium hydroxide, zinc, powder coating, grease, and components"
      rule: "net consumption = opening stock + receipts - closing stock - unopened returns - separately measured transferred stock"
      inputs:
        - stock
        - receipt
        - return
        - "and transfer records"
      output: "consumed product mass"
      source_ids: []
    - id: calc_component_mass
      applies_to: "stems, discs, seats, and fasteners"
      rule: "incorporated mass = accepted-assembly item count × verified item mass, reconciled to net issue and return mass"
      inputs:
        - "controlled BOM"
        - "accepted count"
        - "verified item mass"
        - issues
        - returns
      output: "incorporated component mass"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity in MJ = measured kWh × 3.6; retain the original kWh reading and meter boundary"
      inputs:
        - "meter start/end or allocated kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_water_mass
      applies_to: "water rows"
      rule: "water mass = measured volume × documented density when direct mass is unavailable; retain volume, temperature, density, and uncertainty"
      inputs:
        - "water volume"
        - temperature
        - density
      output: "water mass in kg"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "each process"
      rule: "compare inputs plus opening work-in-process with product outputs, wastes, measured losses, and closing work-in-process; investigate and disclose material residuals"
      inputs:
        - "all mass flows and stock change for the process"
      output: "signed process mass-balance reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve model, valve function/type, controlled fluid, material grades, size, pressure and temperature rating, connection, actuation, coating, test standard, and factory-gate state."
      evidence: "controlled drawing/BOM, product specification, nameplate or traveller, and accepted test record"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a representative continuous 12-month period when production is continuous; for shorter campaigns cover the whole campaign and disclose seasonality, start-up, shutdown, and abnormal exclusions."
      evidence: "reporting-period definition, production calendar, and exception log"
    - id: dq_completeness
      applies_to: "all four processes"
      requirement: "Reconcile every mapped meter, issue point, intermediate transfer, rework loop, waste point, and test outcome; quantify excluded flows and justify cut-offs rather than hiding them in combined rows."
      evidence: "signed flow map, meter list, reconciliation, waste manifests, and exclusion register"
    - id: dq_measurement
      applies_to: "meters and scales"
      requirement: "Use in-calibration instruments suitable for the measured range and retain original readings, conversions, allocation drivers, and uncertainty or resolution."
      evidence: "calibration and maintenance records, raw meter/scale logs, and calculation workbook"
    - id: dq_upstream
      applies_to: "purchased inputs and external treatment"
      requirement: "Match geography, technology, material grade or chemistry, product state, and delivery boundary; disclose proxy use and do not substitute rejected TianGong UUID candidates."
      evidence: "supplier records, dataset metadata, UUID audit, and proxy register"
    - id: dq_route_separation
      applies_to: "surface treatment"
      requirement: "Keep zinc and powder-coating routes separate and add separate atomic chemical, waste, and emission rows when the declared site uses additional chemistry or abatement."
      evidence: "route flow diagram, bath/coating records, and emission/waste inventory"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm that te_steel_valve is the only reference product output, uses UUID 3cb88a81-618f-4fa5-814e-46399b121622, is measured by Mass in kg, and represents drained accepted steel valves rather than parts, untested units, packaging, or non-steel appliances."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_inventory_completeness
    applies_to: "process inventory"
    rule: "Verify that all 37 defined rows have either the audited UUID shown here or an explicit unresolved identity in the manifest, and that added site-specific flows are atomic and route-specific."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "each process and full foreground system"
    rule: "Reconcile measured inputs, internal transfers, accepted output, rework, wastes, stock change, and disclosed residuals. Investigate unexplained residuals before dataset release."
    source_ids: []
  - rule_id: validate_route_condition
    applies_to: "conditional rows"
    rule: "Require zinc input only for a declared zinc-coating route, powder coating and powder waste only for a declared powder route, and hydrostatic water/wastewater only for a declared water-test route; do not average mutually exclusive routes."
    source_ids:
      - eu-jrc-stm-bref-2006
  - rule_id: validate_testing
    applies_to: "final product acceptance"
    rule: "Verify traceability from accepted product mass to the applicable test standard, medium, pressure, temperature, hold time, result, retest, and reject records; exclude failed units from the reference output."
    source_ids:
      - us-epa-mpm-2003
  - rule_id: validate_no_external_ranges
    applies_to: "quantity checks"
    rule: "Treat all quantities as foreground records or calculations from them. No external numeric range is authorized until at least two independent, original-text, system-boundary-compatible sources support it."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review and publication"
  downstream_use: "Cradle-to-factory-gate modelling of a declared steel valve in process datasets and lifecycle models"
  allowed_use: "Use for the declared steel-valve model, material grades, size/pressure class, manufacturing route, test method, geography, period, and factory-gate state; use as background only when these qualifiers are sufficiently representative"
  excluded_use: "Non-steel products labelled as Steel valve; loose parts; standalone actuators; installation; distribution; use-stage leakage or actuation energy; maintenance; end-of-life; packaging unless separately modelled; unqualified cross-technology or cross-geography substitution"
  required_metadata: "all Reference Flow qualifiers; site and reporting period; process map; meter and allocation boundaries; purchased-versus-in-house component manufacture; coating route; test records; rework and reject treatment; wastewater destination; upstream dataset choices; unresolved UUIDs and range needs"
  required_quality_disclosure: "foreground coverage; calibration and temporal representativeness; mass-balance residuals; shared-meter allocation; water conversion; route separation; supplier and upstream representativeness; proxy or data gaps; recycled-content and scrap allocation method"
  update_trigger: "change in valve design or material grade, nominal size/pressure-class mix, component sourcing, machine technology, cleaning chemistry, surface-treatment route, test standard or medium, site or electricity supply, wastewater treatment, allocation method, reporting period, or resolution of an unresolved UUID or range-evidence need"
