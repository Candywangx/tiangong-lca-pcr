allocation_rules:
  - rule_id: al_subdivide
    applies_to: "multi_product_manufacturing"
    rule: "Prefer direct metering, work-order records, and process subdivision to assign materials, energy, test media, scrap, and outsourced operations to the declared equipment configuration."
    source_ids: []
  - rule_id: al_physical
    applies_to: "residual_shared_inputs"
    rule: "When subdivision is not feasible, allocate shared material-processing and energy inputs using a documented physical driver such as machine time, processed mass, weld length, coating area, or test duration that causally represents consumption."
    source_ids: []
  - rule_id: al_economic_last_resort
    applies_to: "residual_shared_overheads"
    rule: "Use economic allocation only when no defensible physical driver exists; disclose the value basis, currency year, product mix, sensitivity result, and fraction assigned to the reference product."
    source_ids: []
  - rule_id: al_scrap
    applies_to: "ferrous_scrap_and_recycling"
    rule: "Report scrap at the point it leaves the foreground process with its measured mass and destination. Do not subtract an avoided-primary-material credit from the foreground inventory; any recycling benefit belongs to a separately declared downstream modelling convention."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "material_fabrication"
      flow_role: "carbon-steel plate, industrial oxygen, and process water inputs"
      record_type: "Goods receipts, issue records, flow meters, and stock records"
      raw_fields: "flow identity; grade or purity; supplier; quantity; unit; reference conditions for gases; opening stock; closing stock; work order"
      collection_method: "Reconcile receipts plus opening stock minus closing stock and documented transfers to the declared work order"
      unit: "kg or m3 as required by the row"
      frequency: "Per receipt or meter interval, aggregated per work order"
      temporal_coverage: "Representative production period covering the declared model"
      site_scope: "All fabrication areas and attributable subcontractors"
      aggregation_rule: "Sum attributable quantities, convert under section 4, then normalize to 1,000 kg finished equipment"
      quality_evidence: "Supplier documents, calibrated meter records, stock reconciliation, and work-order traceability"
    - protocol_id: cp_fabrication_energy
      process_id: "material_fabrication"
      flow_role: "fabrication electricity"
      record_type: "Submeter or facility electricity records and machine-hour allocation"
      raw_fields: "meter start; meter end; kWh; machine; work order; operating hours; allocation driver"
      collection_method: "Prefer dedicated metering; otherwise allocate documented area or machine consumption using operating hours"
      unit: "kWh retained and converted to MJ"
      frequency: "Meter interval not longer than one month"
      temporal_coverage: "At least one representative continuous production year or the full campaign"
      site_scope: "Reporting site's fabrication operations"
      aggregation_rule: "Subtract excluded loads, assign by causal driver, convert to MJ, and normalize to 1,000 kg finished equipment"
      quality_evidence: "Meter calibration, invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_fabrication_scrap
      process_id: "material_fabrication"
      flow_role: "ferrous fabrication scrap"
      record_type: "Scales, scrap tickets, and internal reuse records"
      raw_fields: "scrap identity; mass; date; work order; destination; internally reused offcuts"
      collection_method: "Weigh outgoing scrap and subtract documented internal reuse without avoided-production credit"
      unit: "kg"
      frequency: "Per shipment or production lot"
      temporal_coverage: "Same period as material inputs"
      site_scope: "All fabrication scrap collection points"
      aggregation_rule: "Sum attributable outgoing ferrous scrap and normalize to 1,000 kg finished equipment"
      quality_evidence: "Calibrated scale record, recycler ticket, and mass-balance reconciliation"
    - protocol_id: cp_finishing_inputs
      process_id: "surface_finishing"
      flow_role: "powder-coating input"
      record_type: "Stores issue and return records"
      raw_fields: "product identity; formulation; issued mass; returned reusable mass; work order; date"
      collection_method: "Net issued mass assigned to the declared work order"
      unit: "kg"
      frequency: "Per batch or work order"
      temporal_coverage: "Full finishing campaign for the declared model"
      site_scope: "On-site and attributable outsourced finishing"
      aggregation_rule: "Issued mass minus documented reusable return, normalized to 1,000 kg finished equipment"
      quality_evidence: "Supplier specification, batch record, and stock reconciliation"
    - protocol_id: cp_finishing_energy
      process_id: "surface_finishing"
      flow_role: "finishing electricity"
      record_type: "Submeter and equipment-run records"
      raw_fields: "kWh; line; work order; operating time; standby time"
      collection_method: "Dedicated meter or causal allocation by line operating time"
      unit: "kWh retained and converted to MJ"
      frequency: "Per meter interval or batch"
      temporal_coverage: "Full finishing campaign for the declared model"
      site_scope: "Included on-site finishing line"
      aggregation_rule: "Subtract unrelated loads, convert to MJ, and normalize to 1,000 kg finished equipment"
      quality_evidence: "Meter calibration and batch-to-work-order traceability"
    - protocol_id: cp_curing_gas
      process_id: "surface_finishing"
      flow_role: "curing natural gas and direct fossil carbon dioxide"
      record_type: "Gas meter, supplier composition, and oven run records"
      raw_fields: "m3; reference temperature; reference pressure; fuel composition; fossil carbon fraction; work order; operating time"
      collection_method: "Meter fuel attributable to curing and retain supplier composition needed for carbon balance"
      unit: "m3 for gas and kg for calculated carbon dioxide"
      frequency: "Per meter interval or batch"
      temporal_coverage: "Full applicable curing campaign"
      site_scope: "Included on-site gas-fired curing equipment"
      aggregation_rule: "Normalize metered gas; calculate fossil carbon dioxide by carbon balance; normalize both to 1,000 kg finished equipment"
      quality_evidence: "Meter calibration, supplier fuel certificate, run log, and calculation worksheet"
    - protocol_id: cp_assembly_bom
      process_id: "assembly_controls"
      flow_role: "installed motor, gearbox, and conveyor belt"
      record_type: "Released bill of materials, supplier records, and as-built configuration"
      raw_fields: "component identity; model; specification; quantity; unit mass; installed mass; serial or lot; work order"
      collection_method: "Reconcile released bill of materials to as-built records and weigh when catalogue mass is configuration-dependent"
      unit: "kg"
      frequency: "Per equipment configuration"
      temporal_coverage: "All declared equipment units in the reporting sample"
      site_scope: "Reporting site and attributable preassembly"
      aggregation_rule: "Sum installed mass by atomic component flow and normalize to 1,000 kg finished equipment"
      quality_evidence: "Approved bill of materials, as-built release, and supplier specification"
    - protocol_id: cp_assembly_energy
      process_id: "assembly_controls"
      flow_role: "assembly electricity"
      record_type: "Submeter and tool or work-centre records"
      raw_fields: "kWh; work centre; work order; operating hours; allocation driver"
      collection_method: "Dedicated meter or causal allocation by work-centre operating hours"
      unit: "kWh retained and converted to MJ"
      frequency: "Meter interval not longer than one month"
      temporal_coverage: "Representative production period"
      site_scope: "All included assembly and controls-integration areas"
      aggregation_rule: "Assign attributable electricity, convert to MJ, and normalize to 1,000 kg finished equipment"
      quality_evidence: "Meter calibration, invoice reconciliation, and work-centre log"
    - protocol_id: cp_test_media
      process_id: "testing_packing"
      flow_role: "compressed air for testing"
      record_type: "Flow meter and test record"
      raw_fields: "m3; pressure; temperature; air quality; test id; equipment id; duration"
      collection_method: "Meter test air at the point of use and document reference-condition conversion"
      unit: "m3"
      frequency: "Per test"
      temporal_coverage: "All acceptance tests and attributable re-tests in the reporting sample"
      site_scope: "Factory acceptance test area"
      aggregation_rule: "Sum attributable volume at declared conditions and normalize to 1,000 kg finished equipment"
      quality_evidence: "Meter calibration and signed test record"
    - protocol_id: cp_test_energy
      process_id: "testing_packing"
      flow_role: "factory-test electricity"
      record_type: "Test-bay submeter and test record"
      raw_fields: "kWh; test id; equipment id; operating mode; duration; re-test reason"
      collection_method: "Read dedicated test-bay meter for each test or allocate by documented test duration and power"
      unit: "kWh retained and converted to MJ"
      frequency: "Per test"
      temporal_coverage: "All acceptance tests and attributable re-tests in the reporting sample"
      site_scope: "Factory acceptance test area"
      aggregation_rule: "Sum attributable electricity, convert to MJ, and normalize to 1,000 kg finished equipment"
      quality_evidence: "Meter calibration and signed acceptance record"
    - protocol_id: cp_packing_materials
      process_id: "testing_packing"
      flow_role: "wooden packing crate"
      record_type: "Packing list, supplier record, and scale"
      raw_fields: "packing identity; material; treatment; reuse status; mass; equipment id"
      collection_method: "Weigh supplied packing or use supplier mass verified against packing configuration"
      unit: "kg"
      frequency: "Per packed equipment unit"
      temporal_coverage: "All supplied packing in the reporting sample"
      site_scope: "Final packing area and supplier-packed modules"
      aggregation_rule: "Sum supplied crate mass and normalize to 1,000 kg finished equipment"
      quality_evidence: "Packing list, supplier specification, and scale record"
    - protocol_id: cp_product_mass
      process_id: "testing_packing"
      flow_role: "finished reference product"
      record_type: "Final scale, shipping record, and released configuration"
      raw_fields: "equipment id; model; configuration; unpacked mass; packing mass; release status; date"
      collection_method: "Weigh released equipment without supplied packing or reconcile verified component masses when direct weighing is impracticable"
      unit: "kg"
      frequency: "Per saleable equipment unit"
      temporal_coverage: "All declared units or a justified representative sample"
      site_scope: "Final release point at the reporting factory"
      aggregation_rule: "Sum unpacked saleable mass and normalize all inventory to exactly 1,000 kg reference product"
      quality_evidence: "Calibrated scale certificate, release record, and packing-mass reconciliation"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "all_inventory_rows"
      rule: "normalized amount = attributable period or work-order amount / unpacked saleable equipment mass × 1,000 kg"
      inputs:
        - "attributable row amount"
        - "unpacked saleable equipment mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity_rows"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - "metered electricity in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_gas_conditions
      applies_to: "volumetric_gas_rows"
      rule: "Convert volume only when source and target temperature, pressure, and compressibility treatment are documented; otherwise retain and disclose meter reference conditions"
      inputs:
        - "metered volume"
        - temperature
        - pressure
        - "gas identity"
        - "conversion method"
      output: "m3 at declared conditions"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "curing_fossil_co2"
      rule: "direct fossil CO2 mass = combusted fossil carbon mass × 44/12, adjusted for measured fossil carbon leaving unoxidized"
      inputs:
        - "metered natural gas"
        - "gas composition"
        - "fossil carbon fraction"
        - "measured unburned carbon where applicable"
      output: "kg fossil CO2 per 1,000 kg finished equipment"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and purchased components"
      requirement: "Retain model, configuration, supplier, grade or specification, product state, UUID where resolved, and the exact bill-of-materials or receipt link; document unresolved UUIDs without substituting a proxy."
      evidence: "Released configuration, supplier document, bill of materials, and UUID audit"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a representative continuous 12-month period when production is continuous, or the complete declared campaign for project manufacture; disclose shutdowns, atypical rework, and sample coverage."
      evidence: "Meter intervals, work orders, production calendar, and coverage calculation"
    - id: dq_mass_balance
      applies_to: "materials, scrap, packing, and reference product"
      requirement: "Reconcile input material mass to product, outgoing scrap, returned stock, documented inventory change, and other identified outputs at the finest practical work-order or period level."
      evidence: "Signed mass-balance worksheet and stock reconciliation"
    - id: dq_metering
      applies_to: "electricity, gases, water, and test media"
      requirement: "Retain meter identity, calibration status, reading interval, allocation basis, unit conversion, and reference conditions where volumetric."
      evidence: "Calibration certificate, raw meter readings, invoices, and conversion worksheet"
    - id: dq_performance
      applies_to: "factory acceptance testing"
      requirement: "Retain declared capacity, route, lift or distance, load or conveyed material, power and control settings, acceptance limits, safety-function checks, deviations, and signed results; for applicable idler belt conveyors, document the capacity and power calculation method."
      evidence: "Signed test procedure and report; ISO 5048:1989 where applicable; ISO 12100:2010 and applicable legal conformity documentation"
    - id: dq_completeness
      applies_to: "all foreground exchanges"
      requirement: "Check purchase, waste, environmental, maintenance, and incident records for additional atomic exchanges; quantify or explicitly justify every exclusion and do not use a generic utility, waste, or emission collection label as an inventory row."
      evidence: "Completeness checklist, record reconciliation, and exclusion log"
validation_rules:
  - rule_id: vr_reference
    applies_to: "reference_flow"
    rule: "Confirm the reference product UUID, mass property, mass unit group, exact 1,000 kg normalization, and all required qualifiers; reject packed mass substituted for unpacked equipment mass."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: vr_inventory
    applies_to: "process_inventory"
    rule: "Confirm every row is one atomic exchange, each UUID-bearing row matches the declared flow type, property, unit group, and official Chinese name, and every unresolved row appears in manifest review metadata."
    source_ids: []
  - rule_id: vr_mass_balance
    applies_to: "material_fabrication_and_packing"
    rule: "Confirm carbon-steel plate, steel scrap, returned stock, installed mass, supplied packing, and reference product are reconciled without an unreported recycling credit."
    source_ids: []
  - rule_id: vr_energy_separation
    applies_to: "energy_and_test_media"
    rule: "Confirm electricity, natural gas, and compressed air are separately metered or causally allocated, use their declared properties and units, and are not combined into one utility row."
    source_ids: []
  - rule_id: vr_route
    applies_to: "conditional_rows"
    rule: "Confirm each conditional exchange is supported by the declared technology route and production records; do not apply belt, gas-curing, oxygen-cutting, compressed-air, or wooden-crate rows to an absent route."
    source_ids: []
  - rule_id: vr_performance_safety
    applies_to: "factory_acceptance_testing"
    rule: "Confirm functional and safety acceptance evidence covers the declared configuration, reasonably foreseeable use, control and stopping functions, safe blockage handling, and declared conveying performance; document deviations and re-tests."
    source_ids:
      - eu-machinery-regulation-2023-1230
  - rule_id: vr_disclosure
    applies_to: "published_dataset"
    rule: "Confirm required metadata, temporal and site coverage, allocation drivers, upstream dataset links, proxies, cut-offs, outsourced operations, noise and hazardous-substance emission information where applicable, and excluded stages are disclosed."
    source_ids:
      - eu-machinery-regulation-2023-1230
published_dataset_profile:
  dataset_role: "secondary_dataset; may serve as background_dataset after methodology review and publication"
  downstream_use: "Foreground process and lifecycle-model projections for cradle-to-gate manufacture of the declared complete conveying equipment configuration"
  allowed_use: "Comparison or modelling of equipment configurations with equivalent reference mass, factory-gate boundary, functional qualifiers, technology route, geography, time period, data quality, and allocation basis"
  excluded_use: "Direct comparison of conveying service efficiency without matched capacity, route, duty cycle, service life, use-phase energy, maintenance, and end-of-life; passenger lifting, intermittent lifting machinery, pumps, separately sold parts, or underground-only equipment"
  required_metadata: "PCR id and version; equipment model and configuration; conveyor technology; handled material or unit-load specification; rated capacity; conveying length and lift or route profile; duty class; drive, power and controls; included accessories; unpacked mass; surface finish; test scope; design service life; factory geography; reporting period; make-versus-buy boundary; packing; allocation; cut-offs; upstream datasets; unresolved UUIDs"
  required_quality_disclosure: "Primary-data share; meter and scale calibration; temporal and site coverage; sampling; mass-balance closure; causal allocation drivers; supplier-data age; proxy datasets; test conditions and results; rework; exclusions; uncertainty and unresolved evidence needs"
  update_trigger: "Material change in equipment boundary, dominant material or component design, drive or conveying technology, factory route, energy supply, surface treatment, test protocol, packing, geography, allocation method, upstream dataset, or evidence that changes a material inventory result"
