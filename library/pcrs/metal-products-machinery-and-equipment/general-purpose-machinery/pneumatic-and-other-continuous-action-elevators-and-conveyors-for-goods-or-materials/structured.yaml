measurement_rules:
  - id: mu_reference_mass
    applies_to: "Reference product and all mass-normalized inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine finished equipment mass for the declared saleable configuration, including factory-supplied guards, controls, accessories, lubricants, and packing only where the packing remains with the delivered product; normalize all rows to 1,000 kg of unpacked equipment and report packing separately."
  - id: mu_energy_conversion
    applies_to: "Electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity in its source unit and convert kWh to MJ using 1 kWh = 3.6 MJ; do not combine electricity with fuel or compressed-air consumption."
  - id: mu_gas_reference_conditions
    applies_to: "Natural gas, industrial oxygen, and compressed air rows"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report volume at the supplier or meter reference temperature and pressure, disclose those conditions, and convert only with documented composition, density, temperature, and pressure data."
  - id: mu_bom_mass
    applies_to: "Purchased materials and components"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use received mass assigned to the declared model or a documented bill-of-materials mass; reconcile reusable or returned items separately and avoid assigning a catalogue mass without configuration evidence."
