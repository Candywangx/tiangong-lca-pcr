allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared foreground operations"
    rule: "Prefer subdivision, submetering, machine-time records, and route-specific material issue records so exchanges are assigned directly to the reported part family."
    source_ids: []
  - rule_id: allocation_residual
    applies_to: "inseparable shared utilities"
    rule: "Allocate residual shared utilities using the most causal measured driver, such as machine time, treatment load, or occupied batch capacity; use mass only when no more causal record exists and disclose the sensitivity."
    source_ids: []
  - rule_id: allocation_internal_recovery
    applies_to: "internally recovered coolant, metal, water, or heat"
    rule: "Record only net make-up and net outputs crossing the process boundary; do not create a credit for internal recirculation and retain records proving the recovery loop."
    source_ids:
      - us-epa-metal-products-machinery-2003
  - rule_id: allocation_exported_scrap
    applies_to: "exported swarf and rejected parts"
    rule: "Treat exported scrap and rejected parts as waste outputs without avoided-burden credit in the foreground result unless the study goal requires another recycling convention; disclose any alternative and test its effect."
    source_ids: []
  - rule_id: allocation_packaging_reuse
    applies_to: "reusable pallets"
    rule: "Allocate pallet mass by verified reuse cycles and actual load utilization; apply full pallet mass when those records are unavailable."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_machining_records
      process_id: "machining"
      flow_role: "all machining inputs and outputs"
      record_type: "meter, scale, issue, maintenance, waste-transfer, and emission-control records"
      raw_fields: "lot id; part number; blank mass; accepted mass; electricity; water; cutting-fluid make-up; machined transfer; swarf; spent coolant; wastewater; residual dust"
      collection_method: "reconcile production, utility, sump, waste, and abatement records to the same lot or reporting period"
      unit: "kg; MJ; m3 as applicable"
      frequency: "each lot or meter interval, aggregated monthly at most"
      temporal_coverage: "representative continuous 12-month period or full shorter campaign with justification"
      site_scope: "all machining equipment and directly associated extraction serving the declared product"
      aggregation_rule: "sum same-boundary records, subtract documented internal returns, then normalize by accepted net mass"
      quality_evidence: "calibrated scales and meters; invoices; issue records; sump logs; waste manifests; abatement monitoring; mass-balance reconciliation"
    - protocol_id: cp_treatment_records
      process_id: "heat_surface_treatment"
      flow_role: "all conditional treatment inputs and outputs"
      record_type: "batch ticket, meter, bath log, scale, fuel, waste-transfer, and stack-calculation records"
      raw_fields: "treatment route; batch id; input and output mass; electricity; natural gas; water; sodium hydroxide; hydrochloric acid and concentration; spent bath; wastewater; direct fossil CO2"
      collection_method: "reconcile treatment tickets, meters, bath additions, waste dispatches, and fuel records by route"
      unit: "kg; MJ; m3 as applicable"
      frequency: "each batch or meter interval, aggregated monthly at most"
      temporal_coverage: "representative continuous 12-month period or full shorter campaign with justification"
      site_scope: "every on-site heat-treatment and surface-treatment line used for the declared product"
      aggregation_rule: "aggregate by treatment route, avoid double counting internal bath recirculation, and normalize by accepted net mass"
      quality_evidence: "calibrated meters; bath analyses; chemical invoices; fuel records; waste manifests; treatment specification; mass and carbon checks"
    - protocol_id: cp_final_records
      process_id: "final_inspection_packing"
      flow_role: "final input, utilities, packaging, accepted product, cleaning wastewater, and rejects"
      record_type: "scale, inspection, cleaning, packaging issue, shipment, and reject records"
      raw_fields: "route state; input mass; electricity; water; cardboard; pallet mass and reuse cycles; accepted mass; cleaning wastewater; reject mass; acceptance result"
      collection_method: "reconcile inspection, packing, shipment, and reject records to the same production lot"
      unit: "kg; MJ as applicable"
      frequency: "each lot or shipment, aggregated monthly at most"
      temporal_coverage: "representative continuous 12-month period or full shorter campaign with justification"
      site_scope: "all final cleaning, inspection, test, and packing operations for the declared product"
      aggregation_rule: "sum accepted net mass separately from packaging and rejects; normalize all rows by accepted net mass"
      quality_evidence: "calibrated scales and meters; inspection release; packaging issue; pallet reuse evidence; shipment records; reject disposition"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period row quantity / reporting-period accepted net finished-part mass"
      inputs:
        - "row quantity"
        - "accepted net finished-part mass"
      output: "row amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "all electricity rows"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_water_mass
      applies_to: "water and wastewater measured by volume"
      rule: "mass = measured volume × documented density at stated reference conditions"
      inputs:
        - volume
        - density
        - "temperature or reference condition"
      output: "mass in kg"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "treatment_fossil_co2_air"
      rule: "calculate direct fossil CO2 from metered fuel and documented carbon content or use a verified site emission calculation; do not include upstream electricity emissions"
      inputs:
        - "fuel quantity"
        - "fuel composition or verified site factor"
      output: "direct fossil CO2 mass"
      source_ids: []
    - id: calc_pallet_allocation
      applies_to: "packing_wooden_pallet"
      rule: "attributable pallet mass = pallet mass × shipment load share / verified reuse cycles"
      inputs:
        - "pallet mass"
        - "load share"
        - "reuse cycles"
      output: "allocated pallet mass"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "machining and final acceptance"
      rule: "blank input mass = accepted output mass + exported swarf + rejected-part mass + documented inventory change + other individually identified mass outputs, within stated measurement uncertainty"
      inputs:
        - blank
        - accepted
        - swarf
        - rejects
        - "inventory change"
        - "other identified outputs"
      output: "mass-balance difference"
      source_ids:
        - us-epa-metal-products-machinery-2003
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and intermediates"
      requirement: "Declare part number, engine type, drawing revision, material grade, forming route, treatment state, and acceptance specification."
      evidence: "released drawing, bill of materials, route card, and inspection release"
    - id: dq_boundary
      applies_to: "all processes"
      requirement: "Use the same site, process boundary, product family, and period for numerator and accepted-mass denominator; document outsourced and upstream processes."
      evidence: "process map, meter map, supplier declarations, and boundary reconciliation"
    - id: dq_measurement
      applies_to: "mass, energy, water, chemical, waste, and emission records"
      requirement: "Use calibrated or verified instruments and preserve original units, conversion factors, and uncertainty or estimation flags."
      evidence: "calibration certificates, meter checks, scale tickets, and calculation workbook"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Prefer a continuous 12-month period; justify shorter campaigns and show that start-up, shutdown, maintenance, and reject conditions are represented."
      evidence: "dated production and utility records and representativeness statement"
    - id: dq_completeness
      applies_to: "atomic exchanges"
      requirement: "Reconcile blank mass, accepted mass, swarf, spent fluids, wastewater, rejects, packaging, energy, and conditional treatment chemicals; explain every excluded applicable row."
      evidence: "mass balance, utility reconciliation, waste manifests, and signed completeness review"
    - id: dq_route_specificity
      applies_to: "conditional treatment and packing rows"
      requirement: "Mark each conditional row applicable or not applicable and retain evidence; a zero amount without an applicability statement is incomplete."
      evidence: "route card, treatment specification, cleaning record, and packing instruction"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference product"
    rule: "Confirm the dataset describes a finished non-aircraft CPC 43151 engine part and that all required qualifiers and the exact reference-flow UUID are present."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_reference_amount
    applies_to: "reference flow"
    rule: "Confirm accepted net finished-part output equals 1 kg after normalization and excludes packaging and rejects."
    source_ids: []
  - rule_id: validation_inventory_accounting
    applies_to: "process inventory"
    rule: "Confirm every inventory card is one atomic exchange and each applicable row has a measured or calculated amount, unit, collection protocol, and disclosed destination or supply boundary."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "machining and final acceptance"
    rule: "Investigate mass-balance differences outside documented measurement uncertainty; do not force balance by inserting an unidentified waste flow."
    source_ids:
      - us-epa-metal-products-machinery-2003
  - rule_id: validation_energy_water
    applies_to: "electricity, fuel, water, and wastewater"
    rule: "Reconcile meters to the same product period, verify kWh-to-MJ and volume-to-mass conversions, and prevent double counting between machining, treatment, and final cleaning."
    source_ids: []
  - rule_id: validation_treatment_route
    applies_to: "conditional treatment"
    rule: "Confirm treatment inputs, wastes, direct fuel emissions, and abatement outputs are present when the route applies and absent only with route evidence."
    source_ids:
      - eu-sf-bat-2024
      - us-epa-metal-products-machinery-2003
  - rule_id: validation_allocation
    applies_to: "shared operations and reusable pallets"
    rule: "Confirm the causal allocation driver, internal recovery treatment, scrap convention, pallet reuse evidence, and sensitivity are disclosed."
    source_ids: []
  - rule_id: validation_unresolved_identity
    applies_to: "UUID-empty rows"
    rule: "Retain the concrete row name and manifest unresolved entry until one exact public state-100 Tiangong flow is verified; do not substitute a proxy."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production package that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Product carbon footprint, process LCA, supplier comparison, and lifecyclemodel construction for a declared engine-part family and manufacturing route"
  allowed_use: "Use where part identity, material, blank route, treatment state, geography, technology, allocation, and reporting period are representative"
  excluded_use: "Complete engines, aircraft-engine parts, remanufactured parts, use-phase performance, end-of-life, or an unqualified average across materially different part families and routes"
  required_metadata: "PCR id and version; reference-flow UUID; part and engine identity; material and blank route; site and geography; technology; treatment and packing route; reporting period; upstream dataset links; allocation; cut-offs; data quality; unresolved identities"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; temporal and geographic representativeness; mass-balance result; estimation share; wastewater and waste destinations; abatement; allocation sensitivity; pallet reuse evidence; uncertainty"
  update_trigger: "Drawing, material, supplier blank route, machining technology, treatment chemistry, energy supply, wastewater treatment, allocation, packing configuration, site, or data age changes that materially affect the result"
