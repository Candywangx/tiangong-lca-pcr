measurement_rules:
  - id: reference_mass
    applies_to: "Completed reference equipment"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the shipped equipment configuration or calculate its mass from a reconciled bill of materials. Include installed auxiliaries and supplied packaging only as separately identified masses. Normalize every inventory exchange to 1 kg of completed equipment."
  - id: material_mass
    applies_to: "Metal, sealing, chemical, packaging and waste rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve measured or purchasing-record mass. Where records use pieces, area or volume, retain the count/dimension/density evidence and the conversion calculation."
  - id: electrical_energy
    applies_to: "Electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity before normalization. Convert kWh to MJ with 1 kWh = 3.6 MJ; do not mix purchased electricity with onsite fuel."
  - id: gaseous_fuel_volume
    applies_to: "Natural-gas row"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered gaseous natural gas at the supplier or meter reference conditions. State temperature, pressure and whether the volume is normal, standard or actual; do not convert volume without those conditions."
  - id: water_mass
    applies_to: "Process-water and test-water rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record supplied water mass. A volume record may be converted only with a documented density and measurement conditions; reused water is reported separately from gross intake."
