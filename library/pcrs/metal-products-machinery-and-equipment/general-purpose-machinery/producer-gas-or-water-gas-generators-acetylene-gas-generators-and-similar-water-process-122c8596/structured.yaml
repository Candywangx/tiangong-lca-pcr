    rule: "First subdivide metered processes, production orders, machine time, test runs and waste records so inputs and outputs are directly attributable to the declared equipment. Use system expansion only when a documented additional function is deliberately included."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "residual_shared_inputs_outputs"
    rule: "When subdivision is not possible, use a causal physical parameter such as machine time multiplied by measured load, processed plate area, weld length, test duration or equipment mass. State the chosen key and reconcile allocated totals to site records."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - alfa-laval-epd-s-p-12165-2024
  - rule_id: allocation_economic_last_resort
    applies_to: "residual_multifunctionality"
    rule: "Use economic allocation only when neither subdivision, system expansion nor a defensible physical relation is possible; disclose prices, reference period, sensitivity and affected flows."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "steel_scrap"
    rule: "Report steel scrap leaving the foreground boundary as a waste output. Do not subtract an avoided virgin-steel burden inside this factory-gate inventory; downstream recycling modelling is a separate disclosed choice."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_bill_of_materials
      process_id: "materials_and_components"
      flow_role: "incorporated purchased material or component"
      record_type: "ERP bill of materials, receiving record and as-built release record"
      raw_fields: "item id; material specification; product form; supplier; received mass; installed mass; production order; reject quantity"
      collection_method: "Reconcile as-built bill of materials to purchasing and receiving records for the declared configuration"
      unit: "kg"
      frequency: "Each production order"
      temporal_coverage: "All units represented by the dataset reference period"
      site_scope: "Manufacturing site and declared equipment model"
      aggregation_rule: "Sum installed and attributable loss mass by atomic material or component flow; normalize by accepted equipment mass"
      quality_evidence: "Approved bill of materials; material certificates; receiving records; mass reconciliation"
    - protocol_id: cp_process_energy
      process_id: "fabrication_and_joining_surface_preparation_assembly_and_testing"
      flow_role: "electricity by process"
      record_type: "submeter, machine log and production order"
      raw_fields: "meter start; meter end; machine id; run time; load; process id; production order"
      collection_method: "Prefer process submetering; otherwise allocate shared metered electricity with documented operating time and measured or rated load"
      unit: "MJ"
      frequency: "Per batch or monthly meter period"
      temporal_coverage: "Representative continuous 12-month period where available"
      site_scope: "All included production areas at the reporting site"
      aggregation_rule: "Subtract non-production and excluded-product loads, allocate to production orders, then divide by accepted equipment mass"
      quality_evidence: "Calibrated meter record; allocation worksheet; energy invoice reconciliation"
    - protocol_id: cp_process_fuel
      process_id: "fabrication_and_joining"
      flow_role: "natural gas for included thermal operation"
      record_type: "fuel meter, invoice and furnace log"
      raw_fields: "volume; reference temperature; reference pressure; meter period; equipment id; run time; production order"
      collection_method: "Reconcile meter totals to invoices and allocate only fuel consumed by included operations"
      unit: "m3"
      frequency: "Each meter period"
      temporal_coverage: "Representative continuous 12-month period where available"
      site_scope: "Included onsite thermal equipment"
      aggregation_rule: "Sum attributable reference-condition volume and divide by accepted equipment mass"
      quality_evidence: "Meter calibration; invoice reconciliation; stated reference conditions"
    - protocol_id: cp_process_water
      process_id: "fabrication_and_joining_surface_preparation"
      flow_role: "supplied process water"
      record_type: "water meter, tank balance and batch log"
      raw_fields: "intake; make-up; return; blowdown; process id; batch id; production order"
      collection_method: "Meter gross intake and document internal recirculation without counting it as a new boundary input"
      unit: "kg"
      frequency: "Per batch or monthly meter period"
      temporal_coverage: "Representative continuous 12-month period where available"
      site_scope: "Included water-using processes"
      aggregation_rule: "Allocate net supplied boundary input to production orders and normalize by accepted equipment mass"
      quality_evidence: "Meter calibration; tank-balance reconciliation; reuse log"
    - protocol_id: cp_process_waste
      process_id: "fabrication_and_joining"
      flow_role: "steel scrap"
      record_type: "scrap scale ticket and production order"
      raw_fields: "tare; gross mass; material grade; contamination; destination; production order"
      collection_method: "Weigh segregated ferrous scrap; allocate mixed collection by documented production records"
      unit: "kg"
      frequency: "Each removal or production batch"
      temporal_coverage: "Same period as material input records"
      site_scope: "Included fabrication areas"
      aggregation_rule: "Sum attributable scrap and reconcile material input to incorporated product and other identified outputs"
      quality_evidence: "Scale calibration; hauler ticket; mass-balance worksheet"
    - protocol_id: cp_direct_emissions
      process_id: "fabrication_and_joining"
      flow_role: "direct fossil carbon dioxide"
      record_type: "continuous measurement or fuel calculation record"
      raw_fields: "measured emission; fuel volume; reference conditions; fuel carbon content or factor; oxidation basis; calculation version"
      collection_method: "Use direct measurement when representative; otherwise calculate from the same fuel record with a documented factor method"
      unit: "kg"
      frequency: "Each fuel meter period"
      temporal_coverage: "Same period as fuel consumption"
      site_scope: "Foreground combustion sources only"
      aggregation_rule: "Sum direct fossil CO2 and divide by accepted equipment mass"
      quality_evidence: "Instrument QA or traceable factor source; calculation worksheet; fuel reconciliation"
    - protocol_id: cp_surface_chemicals
      process_id: "surface_preparation"
      flow_role: "sodium hydroxide active substance"
      record_type: "purchase, bath make-up and concentration record"
      raw_fields: "solution mass; concentration; bath id; replenishment; carryover; production order"
      collection_method: "Determine active-substance mass from weighed solution and verified concentration"
      unit: "kg"
      frequency: "Each bath make-up and replenishment"
      temporal_coverage: "Same period as surface-preparation production"
      site_scope: "Included wet preparation lines"
      aggregation_rule: "Sum active-substance charge attributable to production orders and normalize by accepted equipment mass"
      quality_evidence: "Supplier certificate; concentration test; bath log; calculation record"
    - protocol_id: cp_surface_wastewater
      process_id: "surface_preparation"
      flow_role: "metal surface-finishing wastewater"
      record_type: "discharge meter, tank transfer and laboratory record"
      raw_fields: "wastewater mass or volume; density; pH; dissolved metals; suspended solids; treatment state; destination; production order"
      collection_method: "Measure each concrete waste stream at discharge or offsite transfer and retain representative chemistry"
      unit: "kg"
      frequency: "Each discharge or transfer"
      temporal_coverage: "Same period as surface-preparation inputs"
      site_scope: "Included cleaning, rinsing, pickling and passivation operations"
      aggregation_rule: "Sum stream-specific mass after internal reuse; allocate by bath campaign or production records"
      quality_evidence: "Meter or scale calibration; laboratory report; transfer document; water balance"
    - protocol_id: cp_factory_testing
      process_id: "assembly_and_testing"
      flow_role: "hydrostatic-test water"
      record_type: "test sheet and water make-up record"
      raw_fields: "equipment serial; internal volume; make-up water; recovered water; discharge; test date; result"
      collection_method: "Record only boundary-crossing make-up water, not recirculated test-loop inventory"
      unit: "kg"
      frequency: "Each tested unit"
      temporal_coverage: "All represented tested units"
      site_scope: "Factory test area"
      aggregation_rule: "Sum make-up water for accepted and attributable failed tests, then divide by accepted equipment mass"
      quality_evidence: "Signed test sheet; water balance; instrument calibration"
    - protocol_id: cp_outbound_packaging
      process_id: "outbound_packaging"
      flow_role: "supplied pallet or film"
      record_type: "packing list, issue record and scale record"
      raw_fields: "packaging item; material; specification; issued quantity; mass; reuse status; production order"
      collection_method: "Weigh or calculate mass from verified item mass and count for each atomic packaging item"
      unit: "kg"
      frequency: "Each shipment"
      temporal_coverage: "All shipments represented by the dataset"
      site_scope: "Factory-gate packaging operation"
      aggregation_rule: "Sum packaging supplied with the declared configuration and normalize by accepted equipment mass"
      quality_evidence: "Packing list; scale record; supplier specification; reuse evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable period amount / accepted completed-equipment mass for the same production orders"
      inputs:
        - "attributable flow amount"
        - "accepted equipment mass"
      output: "Flow amount per 1 kg completed reference equipment"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "electricity in MJ = metered electricity in kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ of electricity"
      source_ids: []
    - id: calc_active_sodium_hydroxide
      applies_to: "surface_cleaning_sodium_hydroxide"
      rule: "active NaOH mass = solution mass × measured or supplier-certified mass fraction"
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg sodium hydroxide"
      source_ids:
        - us-epa-mpm-development-document-2003
    - id: calc_material_reconciliation
      applies_to: "bill of materials and steel scrap"
      rule: "purchased attributable mass = incorporated accepted-product mass + segregated attributable scrap + other separately identified losses, adjusted for opening and closing work in progress"
      inputs:
        - "receiving mass"
        - "installed mass"
        - "scrap mass"
        - "other losses"
        - "work-in-progress change"
      output: "Reconciled atomic material flows"
      source_ids:
        - eu-pef-recommendation-2021-2279
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "The equipment subgroup, model, function, duty, pressure/temperature envelope, working medium, bill of materials and included auxiliaries shall be unambiguous."
      evidence: "Released drawing and bill of materials; datasheet; factory acceptance record"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use one consistent representative period, normally 12 continuous months where production occurs, and disclose any shorter campaign, abnormal shutdown or extrapolation."
      evidence: "Meter periods; production ledger; explanation of representativeness"
    - id: dq_mass_balance
      applies_to: "material and waste rows"
      requirement: "Reconcile major purchased material masses to accepted product, work in progress and separately identified waste or loss; explain residual differences."
      evidence: "Signed mass-balance worksheet; scale and ERP records"
    - id: dq_meter_allocation
      applies_to: "shared energy and water"
      requirement: "Shared-meter allocation shall use a causal driver and reconcile to the meter total without double counting."
      evidence: "Meter export; allocation key; reconciliation and sensitivity check"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match material grade, product form, energy mix, supplier region, recycled content and technology where material; disclose proxies and data gaps."
      evidence: "Dataset metadata; supplier documentation; proxy register"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Record each atomic utility, material, packaging item, waste stream and direct elementary flow separately. Document exclusions and screening."
      evidence: "Completeness checklist tied to purchasing, meter, waste and emission records"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "reference_flow"
    rule: "Reject a data package if the concrete equipment subgroup or any required qualifier is missing, or if the reference product is not normalized to 1 kg of accepted factory-gate equipment."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_process_applicability
    applies_to: "process_inventory"
    rule: "Every conditional process shall be marked applicable or not applicable for the declared model. Applicable processes require their atomic inputs and outputs; outsourced processes require disclosed upstream datasets."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_inventory_reconciliation
    applies_to: "foreground_inventory"
    rule: "Check that collected and calculated rows link to their protocols, units and production period; reconcile shared meters, bill-of-material masses, steel scrap, water balances and accepted output mass."
    source_ids:
      - eu-pef-recommendation-2021-2279
      - us-epa-mpm-development-document-2003
  - rule_id: validate_direct_emission_scope
    applies_to: "elementary_flows"
    rule: "Fossil CO2 in fabrication_carbon_dioxide_fossil shall represent only direct onsite combustion associated with the reported fuel row; upstream and electricity emissions shall remain in upstream datasets."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_no_unsupported_ranges
    applies_to: "amount_ranges"
    rule: "Do not apply an external empirical range unless at least two independent sources have compatible boundary, functional basis and product state. In the absence of such evidence, use the foreground collection rule and disclose the unresolved evidence need."
    source_ids: []
  - rule_id: validate_comparability
    applies_to: "comparative_use"
    rule: "Do not compare unlike equipment subgroups or models solely on the 1 kg reference. Comparative use additionally requires equivalent function, rated duty, performance, pressure, temperature, working medium, service assumptions and boundary."
    source_ids:
      - alfa-laval-epd-s-p-12165-2024
      - eu-pef-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset for factory-gate manufacture of one declared CPC 43911 equipment configuration"
  downstream_use: "Link the dataset as the supplied-equipment input to a process or lifecycle model that separately models installation, operation, maintenance, replacement and end-of-life where relevant"
  allowed_use: "Attributional product-system modelling, supply-chain screening and equipment-manufacturing improvement where the declared model, technology, geography, reference year and factory-gate boundary are representative"
  excluded_use: "Direct comparison of unlike equipment subgroups or performance; representation of industrial gas production; use-stage energy modelling; installation or construction; spare parts; unqualified global average claims"
  required_metadata: "PCR id and version state; equipment subgroup and model; function and rated duty; pressure and temperature envelope; working medium; shipped mass; bill-of-material scope; included auxiliaries; site and reference year; process applicability; upstream dataset choices; packaging status; allocation and exclusions"
  required_quality_disclosure: "Foreground coverage period; meter and scale QA; mass, water and energy reconciliation; allocation keys; supplier-data share; proxy datasets; unresolved UUIDs and range-evidence needs; data gaps and cut-offs"
  update_trigger: "Change in model design or bill of materials, production route, site, energy supply, surface chemistry, test method, packaging configuration, allocation key, upstream dataset representativeness, or foreground data older than the declared review interval"
