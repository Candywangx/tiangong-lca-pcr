        explanation: "A cross-technology factory-gate steel-plate amount range requires at least two independent product-compatible machinery sources; the verified heat-exchanger declaration is only one case."
      - row_id: stainless_steel_plate
        explanation: "No two independent, boundary-compatible sources establish an empirical stainless-steel-plate range across the covered equipment subgroups."
      - row_id: sealing_elements
        explanation: "The verified heat-exchanger declaration is one product case and cannot establish a cross-category sealing-element range."
      - row_id: fabrication_electricity
        explanation: "Site electricity intensity must be collected; no two independent sources with compatible manufacturing boundaries and allocation bases were verified."
      - row_id: fabrication_natural_gas
        explanation: "Thermal-fuel use is route-specific and lacks two independent, boundary-compatible empirical sources."
      - row_id: fabrication_process_water
        explanation: "Machining and fabrication water use is site-specific and lacks two compatible independent quantitative sources."
      - row_id: steel_scrap
        explanation: "Scrap yield varies by bill of materials and fabrication route; no compatible two-source empirical range was verified."
      - row_id: fabrication_carbon_dioxide_fossil
        explanation: "Direct fossil-carbon-dioxide quantity depends on measured fuel use and fuel-specific calculation; no standalone empirical range is authorized."
      - row_id: surface_cleaning_sodium_hydroxide
        explanation: "Cleaning chemistry and concentration are technology-specific; no two independent compatible quantity sources were verified."
      - row_id: surface_cleaning_process_water
        explanation: "Cleaning and rinse-water demand is site- and technology-specific; verified guidance supports collection but not a compatible empirical range."
      - row_id: surface_cleaning_electricity
