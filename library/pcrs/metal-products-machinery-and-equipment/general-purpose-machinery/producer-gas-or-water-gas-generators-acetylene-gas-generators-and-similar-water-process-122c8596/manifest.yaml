    rationale: "The reviewed boundary is one factory-gate mass-based data-production rule for a declared completed item of CPC 43911 process machinery. It covers the equipment families expressly grouped by the official classification while requiring the concrete equipment subgroup, model, function, capacity, pressure and material configuration to prevent unlike equipment from being compared as interchangeable products. No other material PCR manifest has the same equipment boundary."
