      - row_id: stainless_steel_plate
        reason_code: no_exact_candidate
        explanation: "Five state-100 candidates were directly audited; none consistently identifies stainless-steel plate across English name, Chinese name, classification and product form."
      - row_id: surface_finishing_wastewater
        reason_code: no_exact_candidate
        explanation: "The only state-100 waste candidate was evaporation condensate, which does not exactly identify site-specific metal surface-finishing wastewater."
    range_evidence_needs:
