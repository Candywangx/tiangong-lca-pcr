      - row_id: surface_finishing_wastewater
        explanation: "Wastewater quantity and composition depend on the declared process chemistry and water-management configuration; no compatible empirical range was verified."
      - row_id: assembly_electricity
        explanation: "Assembly and test electricity is product- and site-specific; no two independent compatible empirical sources were verified."
      - row_id: hydrostatic_test_water
        explanation: "Test-water use depends on equipment internal volume and reuse practice; no two compatible independent sources were verified."
      - row_id: euro_wooden_pallet
        explanation: "EURO-pallet use depends on product size, shipping configuration and pallet reuse; the verified declaration supplies only one product case."
      - row_id: plastic_film
