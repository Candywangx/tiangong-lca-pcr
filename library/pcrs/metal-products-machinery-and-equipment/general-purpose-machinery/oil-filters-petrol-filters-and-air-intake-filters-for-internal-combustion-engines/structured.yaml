allocation_rules:
  - rule_id: al_direct_measurement
    applies_to: "Process lines and meters"
    rule: "Prefer direct product-line measurement or submetering. Assign exclusively used inputs and outputs directly to the declared filter product."
    source_ids: []
  - rule_id: al_mass_shared_operations
    applies_to: "Shared conversion and assembly operations"
    rule: "When direct measurement is unavailable, allocate homogeneous shared-operation inputs and outputs by conforming product mass only after documenting that mass is a defensible driver."
    source_ids: []
  - rule_id: al_causal_shared_energy
    applies_to: "Shared curing, ventilation and quality-control energy"
    rule: "Use a causal driver such as equipment runtime multiplied by rated or measured load; use mass only when no better causal driver exists and disclose the sensitivity."
    source_ids: []
  - rule_id: al_scrap_no_credit
    applies_to: "Recyclable scrap and packaging waste"
    rule: "Report waste mass at the foreground boundary without avoided-burden credit. Any recycling credit or substitution belongs to the downstream study and must be disclosed separately."
    source_ids: []
  - rule_id: al_rework
    applies_to: "Internal rework"
    rule: "Keep material returned to the same production system inside the boundary; count only additional energy, losses and final outbound waste, preventing double counting of the reworked mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "filter_manufacture"
      flow_role: "Each atomic material, component and sale-packaging input"
      record_type: "inventory issue, purchase, batch or weigh record"
      raw_fields: "item identity; grade or specification; opening stock; receipts; closing stock; return to stores; issued mass; lot; product family"
      collection_method: "Reconcile stores and batch records; convert item counts or area only with documented measured mass factors."
      unit: "kg"
      frequency: "Each batch with monthly reconciliation"
      temporal_coverage: "At least one representative continuous 12-month period or the full production campaign"
      site_scope: "Declared manufacturing site and product line"
      aggregation_rule: "Sum net consumed mass attributable to the declared product, then divide by conforming output mass."
      quality_evidence: "Calibrated scale records, ERP extracts, invoices, bills of material and stock reconciliation."
    - protocol_id: cp_electricity
      process_id: "filter_manufacture"
      flow_role: "Purchased electricity"
      record_type: "revenue meter, submeter or equipment energy log"
      raw_fields: "meter identifiers; opening and closing readings; kWh; voltage; grid supplier; equipment runtime; allocation driver"
      collection_method: "Prefer product-line submetering; otherwise allocate site meter consumption with documented causal drivers."
      unit: "kWh"
      frequency: "Meter interval or monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Declared site and included equipment"
      aggregation_rule: "Sum attributable kWh, multiply by 3.6, and divide by conforming output mass."
      quality_evidence: "Meter calibration, bills, submeter logs and allocation worksheet."
    - protocol_id: cp_product_output
      process_id: "filter_manufacture"
      flow_role: "Conforming product and rejected output"
      record_type: "production and quality-release record"
      raw_fields: "filter type; model; batch; gross output; rejected mass; rework; released net mass; packaging convention"
      collection_method: "Reconcile production totals with quality-release and weigh records."
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as inputs"
      site_scope: "Declared site and product line"
      aggregation_rule: "Sum only quality-released net product mass under the declared packaging convention."
      quality_evidence: "Quality release, calibrated scale records and production ledger."
    - protocol_id: cp_waste_outputs
      process_id: "filter_manufacture"
      flow_role: "Each segregated waste output"
      record_type: "waste weigh ticket, container log and stock record"
      raw_fields: "waste identity; contamination or curing state; treatment destination; opening stock; generated estimate; outbound mass; closing stock"
      collection_method: "Weigh each segregated stream and reconcile temporary storage stock change."
      unit: "kg"
      frequency: "Each shipment with monthly stock reconciliation"
      temporal_coverage: "Same period as inputs"
      site_scope: "Declared site and included operations"
      aggregation_rule: "outbound mass + closing stock - opening stock, divided by conforming output mass."
      quality_evidence: "Weigh tickets, contractor receipts, container logs and stock reconciliation."
    - protocol_id: cp_direct_air_emissions
      process_id: "filter_manufacture"
      flow_role: "Direct NMVOC release to air"
      record_type: "stack or workplace exhaust test and compound mass-balance record"
      raw_fields: "compound input; VOC fraction; retained mass; captured mass; destroyed mass; exhaust flow; concentration; test duration"
      collection_method: "Prefer representative measured exhaust mass; otherwise use a documented site-specific compound mass balance."
      unit: "kg"
      frequency: "Representative test plus reporting-period reconciliation"
      temporal_coverage: "Same period as compound use and product output"
      site_scope: "Declared site emission points serving included operations"
      aggregation_rule: "Sum uncaptured direct release and divide by conforming output mass; do not include upstream emissions."
      quality_evidence: "Laboratory report, sampling method, flow calibration, safety data and mass-balance worksheet."
  calculation_rules:
    - id: calc_material_intensity
      applies_to: "Atomic material and packaging input rows"
      rule: "net consumed mass = opening stock + receipts - closing stock - return to stores; intensity = attributable net consumed mass / conforming product mass"
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - "return to stores"
        - "attributable share"
        - "conforming product mass"
      output: "kg input per kg reference product"
      source_ids:
        - unido-automotive-filter-plant
    - id: calc_electricity
      applies_to: "Electricity row"
      rule: "electricity intensity = attributable metered kWh × 3.6 / conforming product mass"
      inputs:
        - "metered kWh"
        - "causal allocation driver"
        - "conforming product mass"
      output: "MJ electricity per kg reference product"
      source_ids: []
    - id: calc_waste_stock_change
      applies_to: "Each waste row"
      rule: "waste generated = outbound waste + closing waste stock - opening waste stock; intensity = waste generated / conforming product mass"
      inputs:
        - "outbound waste"
        - "opening waste stock"
        - "closing waste stock"
        - "conforming product mass"
      output: "kg waste per kg reference product"
      source_ids: []
    - id: calc_nmvoc_release
      applies_to: "Direct NMVOC row"
      rule: "direct release = measured exhaust mass, or compound input × VOC fraction - retained VOC - captured VOC - destroyed VOC; intensity = direct release / conforming product mass"
      inputs:
        - "exhaust measurement or compound input"
        - "VOC fraction"
        - "retained mass"
        - "captured mass"
        - "destroyed mass"
        - "conforming product mass"
      output: "kg NMVOC to air per kg reference product"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "Foreground process"
      rule: "Reconcile total attributable material input with conforming product, outbound wastes, measured direct mass releases and documented stock change; investigate rather than force-close unexplained imbalance."
      inputs:
        - "all mass inputs"
        - "product output"
        - "waste outputs"
        - "direct mass releases"
        - "stock changes"
      output: "reported reconciliation and unexplained mass imbalance"
      source_ids: []
  data_quality_requirements:
    - id: dq_temporal
      applies_to: "All foreground rows"
      requirement: "Use one internally consistent representative period, normally 12 continuous months or the full campaign, and disclose shutdowns, abnormal batches and substitutions."
      evidence: "Dated production, meter, purchasing, waste and quality records."
    - id: dq_technological
      applies_to: "Product and process"
      requirement: "Match the declared filter type, media grade, structural design, bonding route, curing equipment and performance protocol."
      evidence: "Product drawing, bill of materials, work instructions and test declaration."
    - id: dq_geographical
      applies_to: "Site and purchased inputs"
      requirement: "Declare manufacturing geography, electricity supply region and supplier geography for material links."
      evidence: "Site metadata, utility contract and supplier records."
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile all listed applicable atomic rows and add actual omitted materials, auxiliaries, energy carriers, wastes and direct emissions separately; justify zero or non-applicable rows."
      evidence: "Signed completeness checklist and mass/energy reconciliation."
    - id: dq_measurement
      applies_to: "Quantitative records"
      requirement: "Document instruments, calibration, conversions, allocation drivers and uncertainty or data gaps."
      evidence: "Calibration certificates, conversion worksheet and allocation file."
    - id: dq_identity
      applies_to: "UUID-bearing exchanges"
      requirement: "Preserve the audited TianGong base name, flow type, classification, property and unit group; keep unresolved UUIDs empty rather than adopting a proxy."
