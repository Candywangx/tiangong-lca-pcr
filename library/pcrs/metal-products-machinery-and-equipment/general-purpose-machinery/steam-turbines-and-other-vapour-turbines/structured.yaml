    - rule_id: boundary_declared_package
      applies_to: "Product scope"
      rule: "Model only the turbine, modules, base frame, fluids, controls, generator, gear, condenser, piping, instrumentation, and auxiliaries actually included in the commercial supply scope; disclose every included and excluded package element."
