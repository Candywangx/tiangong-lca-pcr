allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared manufacturing operations"
    rule: "Avoid allocation by separately metering or otherwise subdividing product-order material issues, machine time, energy, tests, waste, and direct emissions whenever technically feasible."
    source_ids:
      - ec-pef-recommendation-2021-annexes
  - rule_id: allocation_physical_relationship
    applies_to: "Residual shared burdens"
    rule: "When subdivision is infeasible, use a documented causal physical relationship such as measured machine-hours, test-stand hours, processed mass, furnace loading, or occupied production time that represents the burden driver. Do not allocate all burdens only by final product mass when mass is not causal."
    source_ids:
      - ec-pef-recommendation-2021-annexes
  - rule_id: allocation_other_relationship
    applies_to: "No defensible physical relationship"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and a causal physical relationship are infeasible. Report the factor, data period, affected flows, and sensitivity."
    source_ids:
      - ec-pef-recommendation-2021-annexes
  - rule_id: allocation_scrap_and_waste
    applies_to: "Steel scrap, waste cutting oil, and wastewater"
    rule: "Report waste treatment and any recovery modelling separately. Do not assign avoided virgin-material credits inside the foreground inventory unless the downstream lifecycle model declares and consistently applies a reviewed recycling method."
    source_ids:
      - ec-pef-recommendation-2021-annexes
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "p_material_fabrication_p_assembly_testing_p_preservation_dispatch"
      flow_role: "Product-specific material, gas, fluid, coating, and dispatch inputs"
      record_type: "Approved bill of materials, purchase and issue records, return records, cylinder records, coating mix sheets, and final-fill sheets"
      raw_fields: "product order; item identity; grade or formulation; supplier; delivered state; gross issue; return; retained amount; unit; included package element; date"
      collection_method: "Reconcile approved BOM with stores, supplier, production, coating, gas-cylinder, and fill records"
      unit: "kg or m3 at declared conditions"
      frequency: "Per product order, reconciled at acceptance"
      temporal_coverage: "Entire manufacture of each accepted product order; aggregate only orders within the declared reporting period"
      site_scope: "All reporting-site operations and declared supplier component gates"
      aggregation_rule: "Net consumption equals issue plus direct receipt minus documented return and reusable recovery; normalize by accepted net product mass"
      quality_evidence: "Signed BOM revision, traceable material certificates, calibrated scales, supplier invoices, issue/return records, cylinder tickets, and acceptance configuration"
    - protocol_id: cp_utility_meters
      process_id: "p_material_fabrication_p_assembly_testing"
      flow_role: "Electricity, natural gas, and process water"
      record_type: "Meter readings, invoices, equipment logs, production hours, and allocation-driver records"
      raw_fields: "meter id; opening and closing reading; unit; time; product order; machine or furnace; load; runtime; reference conditions; allocation driver"
      collection_method: "Prefer submetering; otherwise reconcile site meter totals and assign only with the allocation hierarchy"
      unit: "kWh, MJ, m3, or kg"
      frequency: "Continuous or batch readings with at least monthly reconciliation"
      temporal_coverage: "Complete product-order manufacturing window and a representative reporting period"
      site_scope: "Reporting site and identified shop, furnace, test stand, or water loop"
      aggregation_rule: "Convert units after retaining raw readings; assign by subdivision or documented causal driver; normalize by accepted net mass"
      quality_evidence: "Meter calibration, invoices, total-versus-submeter reconciliation, downtime and occupancy logs, and stated grid and gas conditions"
    - protocol_id: cp_waste_records
      process_id: "p_material_fabrication"
      flow_role: "Post-industrial steel scrap, waste cutting oil, and metal-finishing wastewater"
      record_type: "Weighbridge tickets, container weights, manifests, wastewater meters, laboratory records, and treatment receipts"
      raw_fields: "product order or campaign; waste identity; gross and tare mass; water or oil content; contamination; treatment state; destination; date; allocation driver"
      collection_method: "Weigh each transfer or measure wastewater leaving the recirculation loop and reconcile to site waste totals"
      unit: "kg"
      frequency: "Per transfer with monthly and product-order reconciliation"
      temporal_coverage: "Complete manufacturing window for included product orders"
      site_scope: "Reporting site through the waste handover or declared treatment boundary"
      aggregation_rule: "Subtract tare; avoid double counting liquid retained on scrap; allocate shared transfers using documented generation drivers"
      quality_evidence: "Calibrated scale or meter, transfer manifest, laboratory result where composition matters, and treatment acceptance receipt"
    - protocol_id: cp_direct_emissions
      process_id: "p_material_fabrication"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Stack measurement or fuel records with supplier composition, carbon content, oxidation basis, and furnace assignment"
      raw_fields: "measured CO2 or fuel volume; reference conditions; carbon factor; oxidation factor; operating time; furnace load; product order; biogenic fraction"
      collection_method: "Prefer verified direct monitoring; otherwise calculate from collected fuel and documented supplier or site factor"
      unit: "kg CO2 or m3 fuel"
      frequency: "Per run or reporting period with product-order assignment"
      temporal_coverage: "Complete period of foreground combustion for included orders"
      site_scope: "Reporting-site combustion only"
      aggregation_rule: "Exclude upstream fuel and electricity emissions; assign direct fossil CO2 consistently with the same fuel allocation"
      quality_evidence: "Instrument calibration or supplier fuel certificate, factor provenance, calculation sheet, and reconciliation to reported fuel use"
    - protocol_id: cp_product_acceptance
      process_id: "p_assembly_testing"
      flow_role: "Accepted turbine output and reference denominator"
      record_type: "Final mass statement, configuration baseline, acceptance certificate, and dispatch release"
      raw_fields: "product order; model; serial number; net mass; package inclusions; rated output; steam conditions; speed; frequency; test status; acceptance date"
      collection_method: "Use approved engineering mass roll-up or calibrated weighing and reconcile to the accepted configuration"
      unit: "kg"
      frequency: "Per accepted turbine or package"
      temporal_coverage: "Each product order in the declared reporting period"
      site_scope: "Reporting manufacturer and dispatch gate"
      aggregation_rule: "Sum only accepted products of matching declared scope; normalize all exchanges to 1,000 kg net mass"
      quality_evidence: "Approved as-built configuration, mass statement, signed acceptance evidence, and dispatch release"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = product-order exchange / accepted net product mass × 1,000 kg"
      inputs:
        - "Net exchange amount from the applicable protocol"
        - "accepted net product mass from cp_product_acceptance"
      output: "Exchange per 1,000 kg reference product"
      source_ids:
        - ec-pef-recommendation-2021-annexes
    - id: calc_electricity_conversion
      applies_to: "fabrication_electricity; assembly_test_electricity"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - "Metered kWh and allocation result from cp_utility_meters"
      output: "MJ electricity before reference normalization"
      source_ids: []
    - id: calc_net_material_consumption
      applies_to: "BOM-controlled inputs"
      rule: "net consumed = direct receipt + stores issue - returned unused material - separately documented reusable recovery"
      inputs:
        - BOM
        - receipt
        - issue
        - return
        - "and recovery records from cp_bom_materials"
      output: "kg or m3 net input by atomic flow"
      source_ids:
        - ec-pef-recommendation-2021-annexes
    - id: calc_direct_fossil_co2
      applies_to: "heat_treatment_fossil_co2"
      rule: "Use verified direct CO2 measurement; otherwise multiply assigned fuel quantity by a documented supplier- or site-specific fossil-carbon factor and oxidation basis, preserving reference-condition conversions and biogenic fraction"
      inputs:
        - "Assigned natural gas"
        - "composition or carbon content"
        - "oxidation basis"
        - "monitoring record"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_shared_operation_assignment
      applies_to: "Shared utilities and waste"
      rule: "Apply subdivision first; if infeasible, multiply the reconciled shared total by the documented causal physical allocation factor for the product order"
      inputs:
        - "Reconciled shop total"
        - "product-order and total driver quantities"
      output: "Assigned exchange before reference normalization"
      source_ids:
        - ec-pef-recommendation-2021-annexes
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "The as-built model, drive duty, steam conditions, accepted state, net mass, and included package elements must match the reference flow and commercial supply boundary."
      evidence: "Configuration baseline, mass statement, acceptance certificate, and dispatch release"
    - id: dq_bom_completeness
      applies_to: "Material and component inputs"
      requirement: "Reconcile the product-specific BOM to procurement, issue, return, and as-built records; identify every environmentally relevant material and energy flow and document exclusions."
      evidence: "Approved BOM revision, material certificates, reconciliation record, and exclusion register (ec-pef-recommendation-2021-annexes)"
    - id: dq_temporal_coverage
      applies_to: "All foreground data"
      requirement: "Cover the complete manufacture of each included product order. Shared site data must span a representative period that captures the orders and operating modes used in allocation."
      evidence: "Dated records, production calendar, meter coverage, and gap log"
    - id: dq_measurement
      applies_to: "Meters, scales, gas and waste records"
      requirement: "Use calibrated or financially reconciled measurements; retain raw units and reference conditions before conversion."
      evidence: "Calibration certificates, invoices, weighbridge tickets, meter reconciliation, and conversion sheet"
    - id: dq_representativeness
      applies_to: "Upstream datasets"
      requirement: "Match material grade and product state, supplier geography, production technology, energy market, and temporal period; disclose proxies and unresolved identities."
      evidence: "Supplier information, dataset metadata, representativeness assessment, and data-gap register"
    - id: dq_mass_balance
      applies_to: "Fabrication and assembly"
      requirement: "Explain material-balance differences between input, accepted product, retained fluids or coatings, returns, scrap, other wastes, and work in progress."
      evidence: "Product-order mass-balance worksheet and signed review"
    - id: dq_no_double_counting
      applies_to: "Supplier and foreground processing"
      requirement: "Purchased-component datasets and in-house operations must not both include the same forming, heat-treatment, machining, joining, coating, testing, or packaging step."
      evidence: "Process responsibility matrix and supplier dataset boundary statement"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "Reference product"
    rule: "Fail validation when the product is not a complete steam or other vapour turbine, the accepted net mass is absent, or bare-versus-package inclusions and exclusions are not declared."
    source_ids:
      - un-cpc-3-0-2025
      - siemens-energy-industrial-steam-turbines-2021
  - rule_id: validate_reference_amount
    applies_to: "Reference flow"
    rule: "Require one steam_turbine_product output and exactly 1,000 kg after normalization; packaging mass must not enter the net-product denominator."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Require every exchange to have one direction, one flow type, one concrete flow identity, one amount-production mode, one basis, and one protocol when collected or calculated from collection. Reject combined utilities, fuels, gases, coatings, materials, wastes, or emissions."
    source_ids:
      - ec-pef-recommendation-2021-annexes
  - rule_id: validate_conditional_routes
    applies_to: "Conditional inputs and outputs"
    rule: "A zero value is valid only when the dataset documents that the named route or exchange is absent. Otherwise require the measured value and route qualifier."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "Tiangong references"
    rule: "Require each adopted UUID to retain its audited flow type, classification, property, unit group, and official Chinese baseName; unresolved rows must remain UUID-empty and declared in manifest review metadata."
    source_ids: []
  - rule_id: validate_mass_and_energy
    applies_to: "Foreground calculations"
    rule: "Require unit conversions, shared-operation allocation, product normalization, gas reference conditions, and mass-balance reconciliation to be reproducible from retained raw records."
    source_ids:
      - ec-pef-recommendation-2021-annexes
  - rule_id: validate_boundary_completeness
    applies_to: "Cradle-to-gate result"
    rule: "Require upstream datasets or explicit data gaps for purchased materials, components, energy, process chemicals, and packaging, and require foreground waste and direct emissions to be identified without double counting supplier operations."
    source_ids:
      - ec-pef-recommendation-2021-annexes
      - ge-steam-power-product-catalog-2020
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate foreground manufacturing dataset for an accepted steam or other vapour turbine"
  downstream_use: "secondary_dataset; background_dataset for a matching turbine configuration and supply scope; foreground input to a separately modelled power-plant, industrial-drive, installation, use, maintenance, or end-of-life lifecycle model"
  allowed_use: "Comparison or modelling only when turbine duty, rated output, steam conditions, mass, bare-versus-package scope, manufacturing geography and technology, reporting period, allocation, and upstream dataset representativeness are compatible and disclosed"
  excluded_use: "Not an electricity-generation dataset; not a steam-generation dataset; not a hydraulic, gas, or wind turbine dataset; not a separately supplied parts dataset; not a use-stage efficiency or lifetime default; not representative of an undeclared turbine package"
  required_metadata: "PCR id and version state; product model and serial or study identifier; turbine and drive type; rated output; steam inlet, exhaust, reheat, and extraction conditions; speed and frequency; design-life metadata; accepted net mass; included and excluded package elements; manufacturing site and geography; reporting period; component supply states; allocation; cut-offs; data gaps; source and background dataset versions"
  required_quality_disclosure: "Foreground versus supplier data share; BOM and mass-balance completeness; meter and scale quality; temporal, geographical, and technological representativeness; allocation drivers; unresolved UUIDs; missing empirical ranges; exclusions; proxies; uncertainty and sensitivity"
  update_trigger: "Material change to turbine design or package scope, alloy or component supply state, manufacturing route, site or energy supply, allocation, upstream datasets, Tiangong UUID identity, acceptance basis, or evidence used by this PCR"
