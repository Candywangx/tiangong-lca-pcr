        - ge-steam-power-product-catalog-2020
        - ec-pef-recommendation-2021-annexes
    - rule_id: boundary_post_gate
      applies_to: "Downstream stages"
      rule: "Exclude outbound transport after the dispatch gate, site installation and commissioning, steam generation, turbine operation, maintenance, refurbishment, and end-of-life from this manufacturing dataset. Report them only in a separate downstream lifecycle model."
