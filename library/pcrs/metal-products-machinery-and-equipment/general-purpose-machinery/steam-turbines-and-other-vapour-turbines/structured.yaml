system_boundary:
  rules:
    - rule_id: boundary_cradle_to_gate
      applies_to: "Product system"
      rule: "Include upstream production of all purchased materials and energy plus foreground activities under the reporting manufacturer's control through acceptance and dispatch preparation at the factory gate. Document and justify any exclusion."
