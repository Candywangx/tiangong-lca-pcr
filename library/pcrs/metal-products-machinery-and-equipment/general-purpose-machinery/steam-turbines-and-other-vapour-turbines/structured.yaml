      applies_to: "Purchased or internally produced components"
      rule: "For purchased forgings, casings, blades, valves, bearings, and modules, connect supplier cradle-to-gate datasets at the receiving gate. For in-house manufacture, collect the actual forming, heat-treatment, machining, joining, and finishing exchanges without double counting supplier processing."
