allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared fabrication, finishing and inspection processes"
    rule: "First subdivide meters, batch records and waste records by process, line, batch or part family so that the declared product receives directly measured burdens wherever technically feasible."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "Residual shared foreground burdens"
    rule: "When subdivision is not feasible, allocate electricity by machine or line time and rated/measured load, cleaning and coating burdens by treated surface area or bath throughput, and other mass-driven burdens by accepted plus rejected processed mass. Document the causal driver and sensitivity."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_scrap_and_recovery
    applies_to: "Aluminium scrap, recovered powder and internally recirculated fluids"
    rule: "Record quantities, ownership and destinations. Do not count internal recirculation as a new input or assign an avoided-primary-material credit inside this gate-to-gate process. Apply any recycling or substitution credit only in the downstream lifecycle model under its declared method."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: allocation_economic_last_resort
    applies_to: "Multi-product operations without a defensible physical driver"
    rule: "Use economic allocation only when subdivision and a causal physical relationship are demonstrably unavailable; use contemporaneous net prices, report the allocation share, and test sensitivity to price variability."
    source_ids:
      - eu-pef-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_batch_records
      process_id: "metal_part_fabrication"
      flow_role: "aluminium sheet input"
      record_type: "purchase receipt plus batch issue/return record"
      raw_fields: "material UUID; alloy; temper; thickness; recycled-content basis; supplier; issued mass; returned mass; batch id; timestamp"
      collection_method: "Reconcile calibrated receiving or inventory scales with production issue and return records"
      unit: "kg"
      frequency: "Each receipt and production batch"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "Each manufacturing site and declared part family"
      aggregation_rule: "Sum net issued mass for accepted reference-product batches, then normalize by accepted net output mass"
      quality_evidence: "Scale calibration; material certificate; supplier lot; inventory reconciliation; exception log"
    - protocol_id: cp_energy_records
      process_id: "metal_part_fabrication_surface_preparation_and_coating_inspection_and_release"
      flow_role: "electricity inputs"
      record_type: "production electricity meter and allocation records"
      raw_fields: "meter id; opening and closing reading; multiplier; operating time; line state; batch id; electricity supplier and grid geography"
      collection_method: "Prefer submetering; otherwise reconcile the site meter and allocate with documented machine/line/test time and load"
      unit: "kWh and MJ"
      frequency: "Each batch or shift; meter reconciliation monthly"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "Each site and process area"
      aggregation_rule: "Subtract idle/non-production loads when measured, allocate only residual shared load, convert kWh to MJ, normalize by accepted mass"
      quality_evidence: "Meter calibration; invoices; meter reconciliation; downtime log; allocation worksheet"
    - protocol_id: cp_cutting_fluid_records
      process_id: "metal_part_fabrication"
      flow_role: "cutting-fluid input"
      record_type: "purchase, issue and inventory records"
      raw_fields: "product identity; concentrate mass; make-up mass; dilution water; opening and closing inventory; recirculation status; batch id"
      collection_method: "Reconcile purchase, issue and inventory records; exclude fluid still in internal circulation"
      unit: "kg"
      frequency: "Each charge and disposal event"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "Each machining system"
      aggregation_rule: "Net fresh fluid charged divided by accepted reference-product mass"
      quality_evidence: "Product safety/technical sheet; inventory reconciliation; batch log"
    - protocol_id: cp_intermediate_transfer_records
      process_id: "metal_part_fabrication_surface_preparation_and_coating"
      flow_role: "internal part outputs and inputs"
      record_type: "transfer tickets and work-order records"
      raw_fields: "part id; source process; destination process; accepted mass; rejected mass; rework mass; timestamp"
      collection_method: "Weigh or count with a validated count-to-mass conversion at every process transfer"
      unit: "kg"
      frequency: "Each batch transfer"
      temporal_coverage: "Full production campaign"
      site_scope: "Each foreground process boundary"
      aggregation_rule: "Reconcile source output to destination input and explain timing or inventory differences"
      quality_evidence: "Scale calibration; transfer ticket; work-order reconciliation; rework log"
    - protocol_id: cp_fabrication_waste_records
      process_id: "metal_part_fabrication"
      flow_role: "aluminium scrap and spent coolant"
      record_type: "dispatch, manifest and storage records"
      raw_fields: "waste UUID; container tare/gross/net mass; alloy/contamination; coolant type; destination; manifest/receipt; batch link"
      collection_method: "Weigh each dispatched container and reconcile temporary storage change"
      unit: "kg"
      frequency: "Each container movement and monthly stocktake"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "Each site and waste destination"
      aggregation_rule: "Opening stock plus generation minus closing stock and returns, normalized by accepted product mass"
      quality_evidence: "Scale calibration; waste manifest; recycler/treatment receipt; storage reconciliation"
    - protocol_id: cp_surface_material_records
      process_id: "surface_preparation_and_coating"
      flow_role: "process water, sodium hydroxide, powder coating"
      record_type: "meter, purchase, issue and bath records"
      raw_fields: "meter readings; chemical product mass; active concentration; powder issue/return; recovered powder; bath id; batch id"
      collection_method: "Meter water and reconcile chemical/coating purchase, issue, return and bath records"
      unit: "kg and concentration fraction"
      frequency: "Each batch or bath addition; water meter each shift"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "Each treatment and coating line"
      aggregation_rule: "Count only fresh boundary inputs; calculate active NaOH mass as supplied solution mass times verified mass fraction; normalize by accepted output mass"
      quality_evidence: "Meter/scale calibration; chemical certificate; concentration test; inventory and bath logs"
    - protocol_id: cp_surface_output_records
      process_id: "surface_preparation_and_coating"
      flow_role: "cleaning wastewater and powder-coating waste"
      record_type: "discharge, waste transfer and recovery records"
      raw_fields: "wastewater mass/volume; density; pH; dissolved-metal indicator; treatment destination; powder waste net mass; recovered powder; batch/date"
      collection_method: "Meter wastewater or document tank transfer; weigh powder waste; reconcile internal reuse and recovery"
      unit: "kg"
      frequency: "Each discharge or waste transfer; reconcile monthly"
      temporal_coverage: "At least 12 representative months or the full campaign when shorter"
      site_scope: "Each line, treatment route and destination"
      aggregation_rule: "Net external waste output after internal reuse/recovery, normalized by accepted output mass"
      quality_evidence: "Meter/scale calibration; laboratory result; waste manifest; treatment receipt; recovery reconciliation"
    - protocol_id: cp_release_records
      process_id: "inspection_and_release"
      flow_role: "inspection input and accepted reference product"
      record_type: "production and release-inspection records"
      raw_fields: "part id; input mass/count; inspected count; accepted count/mass; rework; reject; drawing revision; inspection criteria; timestamp"
      collection_method: "Use calibrated scales or validated count-to-mass conversion and controlled inspection records"
      unit: "kg and item count"
      frequency: "Each production batch"
      temporal_coverage: "Full production campaign"
      site_scope: "Each site and part number"
      aggregation_rule: "Reconcile input to accepted, rework and rejected outcomes; normalize all exchanges by accepted net mass"
      quality_evidence: "Scale calibration; inspection plan; signed release record; nonconformance and rework log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every foreground exchange"
      rule: "normalized amount = period- or batch-matched exchange / accepted net mass of finished_lighting_part; preserve the raw amount and common time/batch boundary"
      inputs:
        - "Exchange record"
        - "accepted net product mass"
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - eu-pef-recommendation-2021-2279
    - id: calc_net_material_input
      applies_to: "aluminium_sheet_input"
      rule: "net sheet input = issued sheet mass - unused sheet returned to inventory; do not subtract generated scrap"
      inputs:
        - "Issued mass"
        - "returned unused mass"
      output: "Net aluminium sheet input"
      source_ids:
        - us-epa-mpm-development-document-2003
    - id: calc_active_naoh
      applies_to: "sodium_hydroxide_input"
      rule: "100% NaOH-equivalent mass = supplied cleaning-solution mass × verified NaOH mass fraction"
      inputs:
        - "Supplied solution mass"
        - "certificate or measured mass fraction"
      output: "Active sodium hydroxide mass"
      source_ids:
        - eu-jrc-stm-bref-2006
    - id: calc_electricity_mj
      applies_to: "All electricity rows"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6"
      inputs:
        - "Metered or allocated kWh"
      output: "Electricity in MJ"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "Fabrication, surface process and inspection"
      rule: "input part/material mass shall reconcile to accepted output, internal transfer, scrap/waste, retained inventory and documented mass change over the same boundary; investigate rather than force-close unexplained differences"
      inputs:
        - "Material and intermediate inputs"
        - "accepted outputs"
        - wastes
        - "inventory change"
      output: "Mass-balance residual and completeness finding"
      source_ids:
        - us-epa-mpm-development-document-2003
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and material flows"
      requirement: "Preserve part number, host-product function, drawing revision, material/alloy, dimensions, finish, UUID decision, and product state; do not use the representative aluminium route for an undeclared alternative material."
      evidence: "Product drawing and bill of materials; material certificate; Tiangong state-100 direct-read audit"
    - id: dq_measurement
      applies_to: "Meters and scales"
      requirement: "Use calibrated meters/scales or document a validated conversion; retain raw readings, multipliers, density/concentration data, downtime and allocation worksheets."
      evidence: "Calibration certificates; meter logs; weigh tickets; laboratory or supplier certificates"
    - id: dq_temporal
      applies_to: "Foreground annual or campaign data"
      requirement: "Cover at least 12 representative months unless the production campaign is shorter; disclose campaign dates, shutdowns, abnormal batches and representativeness."
      evidence: "Production calendar; batch register; exception log"
    - id: dq_completeness
      applies_to: "All required and applicable conditional processes"
      requirement: "Reconcile inputs, internal transfers, accepted outputs, rejects, wastes and inventory change. Report zero only when the exchange is demonstrably absent, not when the UUID or meter is missing."
      evidence: "Mass and energy reconciliation; applicability checklist; unresolved-flow register"
    - id: dq_geography_technology
      applies_to: "Foreground and linked upstream datasets"
      requirement: "Match site geography, electricity supply, material state, finishing technology, waste treatment and reference period; document any proxy and its effect."
      evidence: "Dataset metadata; supplier records; process specification; data-quality assessment following eu-pef-recommendation-2021-2279"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "Product identity and reference flow"
    rule: "Fail validation if the canonical PCR id, part function, host product, material/alloy, finish, net reference mass, factory-gate state or required qualifiers are missing or internally inconsistent."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_process_applicability
    applies_to: "Process map"
    rule: "Require both required processes and evaluate the conditional surface process against the declared route. If another finishing route is used, require a technology-specific process with concrete atomic flows and disclose the substitution."
    source_ids:
      - us-epa-mpm-development-document-2003
      - eu-jrc-stm-bref-2006
  - rule_id: validate_atomic_inventory
    applies_to: "Inventory rows"
    rule: "Require one physical, chemical, waste or energy exchange per row; require a verified state-100 UUID or the matching manifest unresolved entry; reject combined utilities, materials, wastes, emissions or route-choice labels."
    source_ids: []
  - rule_id: validate_units_and_normalization
    applies_to: "Amounts and units"
    rule: "Require mass rows in kg, electricity in MJ, documented conversions, one common accepted-product denominator, and collection protocols for every collected or calculated foreground row."
    source_ids:
      - eu-pef-recommendation-2021-2279
  - rule_id: validate_reconciliation
    applies_to: "Material, intermediate, waste and energy records"
    rule: "Report accepted checks, skipped checks and residuals; fail when batch/time boundaries differ without reconciliation or when unexplained material losses, double-counted recirculation, or missing waste destinations make completeness inconclusive."
    source_ids:
      - us-epa-mpm-development-document-2003
  - rule_id: validate_range_evidence
    applies_to: "Quantitative QA ranges"
    rule: "Treat all external range needs in the manifest as unresolved until at least two independent original-text sources with compatible boundary, functional unit and product state support a reasoned synthesis. Do not create a range from a single case, repeated value or regulatory limit."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared burdens and recovery"
    rule: "Require subdivision first, a documented causal physical driver for residual allocation, separate recovery quantities and destinations, and sensitivity evidence for any last-resort economic allocation."
    source_ids:
      - eu-pef-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared lighting-equipment part"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Link into complete lamp, lighting fitting, illuminated-sign, construction-product or other lifecycle models when the part function, material, finish, geography, technology, time and factory-gate boundary are compatible"
  excluded_use: "Direct comparison of unlike parts; use as a complete lamp or lighting fitting; substitution for a glass-only, plastics-only, vehicle-lighting or light-source dataset; use when material or finish is unknown; use as a published default while UUID or range-evidence blockers remain unresolved"
  required_metadata: "PCR id and version; part number/function; host product; drawing revision; material/alloy; net mass; dimensions; forming and finishing route; coating; electrical content; included/outsourced processes; site/geography; period; electricity supply; recycled content method; allocation; scrap and waste destinations; UUID status"
  required_quality_disclosure: "Primary-data share; measurement and calibration methods; temporal coverage; missing data and proxies; process applicability; material/energy reconciliation; allocation sensitivity; unresolved UUIDs; unresolved external range evidence; representativeness and reviewer status"
  update_trigger: "Change in part design or material, mass by more than the study significance threshold, forming or finishing technology, coating chemistry, supplier/recycled-content basis, electricity supply, site/geography, waste treatment, allocation method, or availability of exact Tiangong UUID/range evidence"
