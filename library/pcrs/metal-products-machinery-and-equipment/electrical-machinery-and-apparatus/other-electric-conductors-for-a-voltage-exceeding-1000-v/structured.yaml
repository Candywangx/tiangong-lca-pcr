measurement_rules:
  - id: reference_mass
    applies_to: "net finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1,000 kg of tested, saleable conductor at plant gate. Exclude drums, reels, pallets, wrapping, and other packaging from product mass and record them as separate inputs."
  - id: linear_mass_conversion
    applies_to: "records collected by length"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and kg/m"
    rule: "Convert length to mass only with measured or product-design-specific linear mass for the same construction. Retain source length, linear mass, calculation, and product specification; do not use one generic conversion across voltage classes or constructions."
  - id: rated_voltage_identity
    applies_to: "category eligibility"
    required_property_ref:
      name: "product specification"
      uuid: ""
    required_unit: "V or kV"
    rule: "Confirm the rated-voltage designation from the product specification and require it to exceed 1,000 V. A marketing label such as “high voltage” is not sufficient evidence."
  - id: conductor_resistance_disclosure
    applies_to: "downstream use-stage modelling"
    required_property_ref:
      name: "electrical resistance"
      uuid: ""
