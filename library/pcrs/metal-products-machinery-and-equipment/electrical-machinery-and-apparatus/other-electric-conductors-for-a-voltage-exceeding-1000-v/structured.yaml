allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separately measurable lines, products, and unit processes"
    rule: "Avoid allocation by subdividing processes and using product- or line-specific material, energy, waste, and output records whenever technically feasible."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: allocation_physical_relationship
    applies_to: "unavoidable shared inputs, emissions, wastes, and infrastructure services"
    rule: "When subdivision is not feasible, use the most relevant causal physical relationship, such as metered machine time, equipment load, processed mass, line length, or another engineering driver. Document the driver and all product totals. Do not default to product mass when it does not represent the causal relationship."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: allocation_economic_fallback
    applies_to: "jointly produced outputs without a defensible physical relationship"
    rule: "Use economic allocation only when no relevant physical relationship can be established. Record price basis, period, currency, data source, shares, and a sensitivity result against the best available physical proxy."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: allocation_scrap_and_rework
    applies_to: "internal rework, scrap, and material sent to recycling"
    rule: "Do not count internal rework as a new external input or a waste output. Record scrap leaving the process by destination and apply the selected end-of-waste or recycling convention consistently; do not subtract recycling revenue or avoided-burden credit from foreground material consumption."
    source_ids:
      - pep-pcr-ed4-2021
      - pep-psr-wires-cables-ed4-2022
