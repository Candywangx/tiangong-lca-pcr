      flow_role: "unfinished conductor transfer"
      record_type: "transfer and work-in-process records"
      raw_fields: "product code; lot; gross and net mass; unit; sender; receiver; date; opening and closing work in process"
      collection_method: "weigh or derive from controlled production records and reconcile both process sides"
      unit: "kg"
      frequency: "per lot or shift"
      temporal_coverage: "reporting period"
      site_scope: "transfer boundary between included processes"
      aggregation_rule: "sum accepted transfers and adjust for work-in-process change"
      quality_evidence: "calibrated scale, matched transfer records, and stock reconciliation"
    - protocol_id: cp_finished_output
      process_id: "finishing_testing_packaging"
      flow_role: "finished reference output"
      record_type: "accepted production, test release, and dispatch records"
      raw_fields: "product code; lot; net product mass; packaging mass; length; kg/m; rejected mass; release status; date"
      collection_method: "use test-released saleable net mass; cross-check length multiplied by product-specific linear mass"
      unit: "kg"
      frequency: "per production lot"
      temporal_coverage: "normally 12 continuous months"
      site_scope: "all in-scope products at declared plant gate"
      aggregation_rule: "exclude packaging and out-of-scope products; sum by specification; normalize all exchanges to 1,000 kg"
      quality_evidence: "calibrated scale, test release, dispatch reconciliation, and product-specific kg/m"
    - protocol_id: cp_packaging_inputs
      process_id: "finishing_testing_packaging"
      flow_role: "packaging inputs"
      record_type: "packaging purchase, issue, return, and reuse records"
      raw_fields: "material or item; mass; count; reuse status; returned count; product lot; date"
      collection_method: "reconcile issued packaging with packed output and returns"
      unit: "kg and count"
      frequency: "per packing lot or monthly"
      temporal_coverage: "reporting period"
      site_scope: "all in-scope packed outputs"
      aggregation_rule: "report each material separately and amortize reusable items with documented trips or losses"
      quality_evidence: "issue records, tare measurements, and reuse log"
    - protocol_id: cp_waste_outputs
      process_id: "conductor_cable_manufacturing_finishing_testing_packaging"
      flow_role: "scrap, rejects, and packaging waste"
      record_type: "waste tickets, internal scrap and rework logs, stock records, and treatment certificates"
      raw_fields: "material; mass; process; product; rework status; destination; treatment; date"
      collection_method: "weigh by material and reconcile generated, internally returned, stored, and shipped quantities"
      unit: "kg"
      frequency: "per batch or shipment"
      temporal_coverage: "normally 12 continuous months"
      site_scope: "all included processes"
      aggregation_rule: "do not double count rework; aggregate external waste by material and destination"
      quality_evidence: "calibrated weighbridge or ticket, stock reconciliation, and treatment certificate"
    - protocol_id: cp_direct_emissions
      process_id: "conductor_cable_manufacturing_finishing_testing_packaging"
      flow_role: "direct releases"
      record_type: "continuous or periodic monitoring, permit reports, and calculation records"
      raw_fields: "substance; compartment; concentration; flow rate; operating time; method; detection limit; date"
      collection_method: "calculate mass release from monitored concentration and flow or use an authorized method tied to collected activity"
      unit: "kg or substance-appropriate unit"
      frequency: "as required by permit and process variability"
      temporal_coverage: "representative of reporting period"
      site_scope: "all included emitting operations and treatment units"
      aggregation_rule: "sum by substance and compartment; document non-detect treatment and extrapolation"
      quality_evidence: "accredited test, calibration, permit report, and calculation worksheet"
  calculation_rules:
    - id: calculate_reference_normalization
      applies_to: "every foreground exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period net saleable in-scope output kg × 1,000 kg"
      inputs:
        - "collected exchange"
        - cp_finished_output
      output: "exchange amount per 1,000 kg reference product"
      source_ids: []
    - id: calculate_length_to_mass
      applies_to: "length-based production, dispatch, or material records"
      rule: "mass kg = measured length m × product-specific linear mass kg/m; compare with available scale record and investigate material differences"
      inputs:
        - length
        - "approved product-specific kg/m"
        - "scale record where available"
      output: "reconciled mass and conversion evidence"
      source_ids:
        - iec-60228-2023
        - pep-psr-wires-cables-ed4-2022
    - id: calculate_material_balance
      applies_to: "each process and reporting period"
      rule: "opening stock + external and transferred mass inputs = saleable and intermediate outputs + external waste + closing stock + documented measured releases; report imbalance before normalization"
      inputs:
        - material
        - intermediate
        - output
        - waste
        - stock
        - "and emission records"
      output: "material-balance statement and unresolved imbalance"
      source_ids:
        - pep-pcr-ed4-2021
    - id: calculate_shared_allocation
      applies_to: "shared utilities and joint operations"
      rule: "allocated amount = shared measured total × documented causal-driver share; shares across all receiving products must sum to 1"
      inputs:
        - "shared total"
        - "driver by receiving product"
        - "all-product driver total"
      output: "allocated exchange and allocation worksheet"
      source_ids:
        - pep-pcr-ed4-2021
    - id: calculate_product_mix
      applies_to: "multi-product dataset"
      rule: "product share = net saleable mass of eligible specification / total net saleable mass of all included eligible specifications; exclude out-of-scope products before calculating shares"
      inputs:
        - cp_product_specification
        - cp_finished_output
      output: "disclosed mass-weighted product mix"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_and_scope
      applies_to: "reference product and product mix"
      requirement: "Every included product must have a traceable specification proving rated voltage above 1,000 V and all required qualifiers."
      evidence: "approved product specification, test release, exact reference-flow UUID, and mass-weighted mix table"
    - id: dq_temporal_coverage
      applies_to: "foreground activity data"
      requirement: "Prefer a continuous 12-month period that captures normal operating variability. A shorter period must disclose dates, production coverage, shutdowns, campaigns, and why it is representative."
      evidence: "dated raw records and representativeness justification"
    - id: dq_site_coverage
      applies_to: "manufacturing system"
      requirement: "Include every site and line contributing to the declared output or report the exact coverage share and treatment of omitted production."
      evidence: "facility list, line mapping, production totals, and coverage calculation"
    - id: dq_primary_data
      applies_to: "materials, energy, water, emissions, wastes, and outputs"
      requirement: "Use primary foreground records for on-site operations. Document aggregation, transformations, missing data, estimates, and uncertainty; do not silently replace missing site data with generic cable values."
      evidence: "protocol records, calculation workbook, missing-data log, and data-quality review"
    - id: dq_secondary_datasets
      applies_to: "purchased inputs and external treatment"
      requirement: "Select datasets matching material, technology, geography, reference year, and supplier route as closely as available; document substitutions and versions."
      evidence: "dataset selection table with UUID or stable identifier, version, geography, year, and rationale"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Demonstrate that all assessable flows were considered, apply the declared cut-off method, include copper systematically, and list every omitted flow with quantitative and impact justification."
      evidence: "completeness checklist, cut-off calculation, mass and energy coverage, and omission register"
    - id: dq_balance_and_reconciliation
      applies_to: "process and site totals"
      requirement: "Reconcile material, energy, output, waste, and stock records. Investigate unexplained discrepancies and disclose unresolved residuals rather than forcing closure."
      evidence: "signed reconciliation and corrective-action or uncertainty record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow 0280d152-5bda-4dde-be8f-2bbb8df73a05, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200b9a66, unit kg, and exactly 1,000 kg after normalization."
    source_ids: []
  - rule_id: validate_voltage_scope
    applies_to: "product and product mix"
    rule: "Fail category eligibility when rated-voltage evidence is absent, ambiguous, or not greater than 1,000 V."
    source_ids:
      - iec-60502-2-2014-amd1-2024
      - iec-60840-2020-amd1-2023
      - iec-62067-2022
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Require every section 3 qualifier, including product-specific kg/m and resistance at 20 °C; do not infer missing qualifiers from the CPC code or a narrow Tiangong flow name."
    source_ids:
      - iec-60228-2023
      - pep-psr-wires-cables-ed4-2022
  - rule_id: validate_product_mix
    applies_to: "aggregated production mix"
    rule: "Require eligible output shares to sum to 100% after excluding out-of-scope products, and retain product-specific records behind the aggregation."
    source_ids: []
  - rule_id: validate_boundary_completeness
    applies_to: "foreground inventory"
    rule: "Require collected or explicitly documented not-applicable evidence for conductor materials or purchased cores, insulation and protective materials, energy, water and auxiliaries, intermediate transfers, finished output, packaging, waste, direct emissions, and all actual on-site route steps."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: validate_upstream_datasets
    applies_to: "purchased inputs"
    rule: "Fail completeness if a material purchased product, energy, water, packaging, waste-treatment, or same-category intermediate lacks an upstream dataset identity or a documented justified omission."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: validate_mass_and_energy_reconciliation
    applies_to: "process and site records"
    rule: "Require material-balance and energy reconciliation statements, documented stock and work-in-process changes, and review of unexplained residuals."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: validate_allocation
    applies_to: "shared or joint operations"
    rule: "Require subdivision or an allocation worksheet that identifies the causal physical driver; if economic allocation is used, require prices and physical-proxy sensitivity."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: validate_cutoff
    applies_to: "omitted flows"
    rule: "Require a complete omission register and evidence that the declared thresholds are met without hiding significant impacts; copper cannot be omitted."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: validate_partial_lifecycle_scope
    applies_to: "downstream use"
    rule: "Require an explicit statement that the dataset ends at the manufacturing plant gate and excludes distribution, installation, use-stage electrical losses, maintenance, and end-of-life. Reject use as a complete cable EPD or service comparison without applicable downstream PCR and scenarios."
    source_ids:
      - pep-psr-wires-cables-ed4-2022
      - environdec-cpcr-004-2024
  - rule_id: validate_special_designs
    applies_to: "special products"
    rule: "Require a design-specific standard, route, and data for submarine, overhead, mining, nuclear, shipboard, fire-performance, or other special products; reject unsupported extrapolation from fixed-installation cable rules."
    source_ids:
      - iec-60502-2-2014-amd1-2024
      - iec-60840-2020-amd1-2023
      - iec-62067-2022
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Foreground manufacturing dataset for a declared finished conductor or a disclosed mass-weighted plant production mix rated above 1,000 V; component of a broader cradle-to-gate, cradle-to-grave, process, or lifecycle model when downstream stages use applicable scenario rules."
  excluded_use: "Complete cable EPD; installation or construction service; electricity-transmission service comparison; use-stage loss, service-life, or end-of-life result without product-specific scenarios; conductor rated at or below 1,000 V; bare conductor or accessory outside the category; extrapolation from one voltage band, conductor metal, or construction to the whole category."
  required_metadata: "exact reference-flow, flow-property, and unit-group UUIDs; all reference-flow qualifiers; CPC classification as context; facility and geography; reporting dates; product output shares; declared gate; process map; starting intermediates and outsourced steps; upstream dataset identities and versions; net-mass and packaging treatment; recycled-content method; allocation; cut-off; data-quality assessment; uncertainty and missing-data disclosures"
  required_quality_disclosure: "protocol coverage by process and flow; share of measured, calculated, estimated, and secondary data; temporal, geographic, and technological representativeness; site and line coverage; material and energy reconciliation; omission register; allocation worksheet; product-mix aggregation; secondary-dataset substitutions; unresolved limitations"
  update_trigger: "Change in rated-voltage scope, product construction, conductor metal, insulation or protective system, production route, site, product mix, energy supply, recycled-content method, allocation, cut-off, reporting period, material upstream dataset, applicable standard or PCR, or any change that materially alters inventory or representativeness."
