allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_site_operations"
    rule: "Subdivide metered production lines, furnaces, machining cells, coating lines, and abatement equipment by product family or campaign before applying allocation."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "residual_shared_inputs"
    rule: "When subdivision is not feasible, allocate shared electricity, gas, water, and consumables using a documented causal physical driver such as equipment time, furnace charge mass, treated surface area, or measured throughput; do not default to product mass when it is not causal."
    source_ids: []
  - rule_id: allocation_scrap_treatment
    applies_to: "magnet_material_loss"
    rule: "Treat off-site material loss as waste at the foreground boundary. Do not credit avoided virgin material; if an expanded recycling system is modelled, disclose the substitution method and keep it outside the uncredited foreground result."
    source_ids:
      - cui-et-al-2022-permanent-magnet-manufacturing
  - rule_id: allocation_rejects
    applies_to: "internal_recycling"
    rule: "Return internally recycled powder, gates, risers, or swarf to the mass balance without counting a second external input or output; disclose internal recovery rate and losses."
    source_ids:
      - cui-et-al-2022-permanent-magnet-manufacturing
