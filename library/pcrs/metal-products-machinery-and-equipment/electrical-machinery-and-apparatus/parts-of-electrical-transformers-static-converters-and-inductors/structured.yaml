allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "multiple part families/routes"
    rule: "Subdivide independently metered lots before allocation; do not average unlike routes without declaring the production mix."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "shared records"
    rule: "Allocate using a causal driver such as machine time, thermal load, board area, or treated area; use mass only when demonstrated."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "scrap/rejects"
    rule: "Keep scrap as waste without avoided-production credit inside the gate result; disclose any separately modeled co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_mass
      process_id: "part_fabrication_assembly"
      flow_role: "materials/components/chemicals"
      record_type: "ERP issues/returns; supplier/BOM"
      raw_fields: "identity; lot; issued/returned mass; state; route"
      collection_method: "Reconcile issue minus return to lot"
      unit: "kg"
      frequency: "each lot; monthly reconcile"
      temporal_coverage: "12 months or full campaign"
      site_scope: "all controlled facilities"
      aggregation_rule: "sum atomic net input / conforming mass"
      quality_evidence: "specifications; scales; transactions; BOM log"
    - protocol_id: cp_utility_records
      process_id: "part_fabrication_assembly"
      flow_role: "electricity/gas/oxygen/water"
      record_type: "meters; invoices; cylinders; logs"
      raw_fields: "readings; unit; conditions; hours; route; driver"
      collection_method: "subtract readings, correct conditions, causally allocate"
      unit: "native and normalized units"
      frequency: "continuous/lot; monthly"
      temporal_coverage: "same as output"
      site_scope: "all facilities"
      aggregation_rule: "sum and normalize after allocation"
      quality_evidence: "calibration; invoice reconcile; coverage map"
    - protocol_id: cp_packaging_mass
      process_id: "part_fabrication_assembly"
      flow_role: "shipment packaging"
      record_type: "issues; specifications"
      raw_fields: "material; count; unit mass; returnability"
      collection_method: "weigh or count × verified unit mass"
