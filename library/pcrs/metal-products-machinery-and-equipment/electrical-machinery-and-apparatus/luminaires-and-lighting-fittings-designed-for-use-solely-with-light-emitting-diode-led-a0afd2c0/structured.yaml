system_boundary:
  rules:
    - rule_id: sb_complete_product
      applies_to: "reference product and manufacturing boundary"
      rule: "Include the structure or housing, thermal and optical parts, LED light source or module, driver or control gear, wiring, connectors, seals, fasteners, and all accessories supplied or required for the declared complete configuration. A component-only system cannot conform."
      source_ids:
        - pep-ecopassport-psr-0014-2023
        - iec-60598-1-2024
    - rule_id: sb_cradle_to_gate
      applies_to: "manufacturer-gate foreground dataset"
      rule: "Include upstream production and inbound transport of materials, components and subassemblies; on-site part preparation; assembly; wiring; finishing; testing; rework; production waste treatment; and primary and secondary packaging production."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - pep-ecopassport-psr-0014-2023
    - rule_id: sb_supplier_components
      applies_to: "purchased LED module, driver, control gear, PCB, optic, housing or other subassembly"
      rule: "Use upstream datasets for purchased components and do not replace a component inventory with only its delivered mass. Record supplier, technology, geography and recycled-content evidence when available."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - pep-ecopassport-psr-0014-2023
    - rule_id: sb_downstream_projection
      applies_to: "lifecyclemodel or cradle-to-grave result"
      rule: "When downstream stages are claimed, include distribution, installation items, electricity at declared power and control settings, maintenance and replacement of light sources and control gear, and end-of-life collection and treatment. Report manufacturing separately from use and end-of-life."
      source_ids:
        - pep-ecopassport-psr-0014-2023
        - eu-2019-2020-light-sources
        - eu-2012-19-weee
    - rule_id: sb_cutoff_disclosure
      applies_to: "all foreground and upstream inventory"
      rule: "Do not omit a material, component, hazardous substance, energy input, direct release or waste stream merely because its mass is small when it may materially affect results, safety, toxicity, scarcity or end-of-life treatment. Every applied cut-off and its effect must be disclosed."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
