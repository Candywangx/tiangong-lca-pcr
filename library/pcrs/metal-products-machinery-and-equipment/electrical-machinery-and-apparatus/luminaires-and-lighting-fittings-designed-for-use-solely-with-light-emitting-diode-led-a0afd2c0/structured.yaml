allocation_rules:
  - rule_id: alloc_avoid_where_possible
    applies_to: "multi-output foreground operations"
    rule: "Subdivide processes or use direct metering and physical tracking before applying allocation. Document the unallocated inventory and the reason subdivision is not feasible."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: alloc_coproduct_mass
    applies_to: "process that produces more than one valuable co-product"
    rule: "Allocate residual shared burdens by the mass of output co-products when direct assignment or subdivision is not feasible, and disclose output masses and the calculation."
    source_ids:
      - pep-ecopassport-psr-0014-2023
  - rule_id: alloc_recycling_boundary
    applies_to: "production scrap and end-of-life recovery"
    rule: "Assign collection and treatment to the stage that generates the waste through the declared end-of-waste point. Do not subtract avoided virgin-material or energy burdens from the foreground inventory; report optional benefits beyond the boundary separately."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - pep-ecopassport-psr-0014-2023
  - rule_id: alloc_rework_and_rejects
    applies_to: "reworked and rejected luminaires or components"
    rule: "Assign added materials, energy and treatment to the production that generated the rework or reject. Returned supplier parts must be reconciled and must not be counted both as consumed input and on-site waste."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_component_receipts
      process_id: "component_and_subassembly_supply"
      flow_role: "material, component and subassembly inputs"
      record_type: "ERP purchase, goods-receipt, BOM and supplier record"
      raw_fields: "item id; supplier; site; quantity; unit; unit mass; material family; recycled content; returned quantity; opening and closing stock; upstream dataset ref"
      collection_method: "reconcile BOM issues, receipts, returns and stock change; verify representative unit masses"
      unit: "kg; item"
      frequency: "per lot or receipt"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "every production and subcontracting site in scope"
      aggregation_rule: "aggregate by item and site, then normalize to accepted component output and 1 kg finished product"
      quality_evidence: "approved BOM; invoice or receipt; calibrated scale record; supplier declaration; upstream dataset identity"
    - protocol_id: cp_process_energy
      process_id: "component_and_subassembly_supply_luminaire_assembly"
      flow_role: "fabrication, assembly and finishing energy"
      record_type: "meter, fuel delivery and utility invoice"
      raw_fields: "meter id; carrier; start and end reading; fuel amount; conversion factor; line runtime; facility total; allocation driver"
      collection_method: "prefer submetering; otherwise reconcile invoices and allocate using documented causal driver"
      unit: "kWh; MJ"
      frequency: "monthly and per campaign where available"
      temporal_coverage: "same period as production output"
      site_scope: "each included site and line"
      aggregation_rule: "sum by carrier and site, subtract excluded loads, allocate and normalize to process output"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_component_output
      process_id: "component_and_subassembly_supply"
      flow_role: "accepted components and subassemblies"
      record_type: "production and quality record"
      raw_fields: "item id; accepted mass; accepted count; reject mass; date; destination"
      collection_method: "calibrated weighing or accepted count multiplied by verified unit mass"
      unit: "kg; item"
      frequency: "per lot"
      temporal_coverage: "representative production period"
      site_scope: "each included fabrication or supplier site"
      aggregation_rule: "sum accepted output by family and reconcile to inputs and waste"
      quality_evidence: "scale calibration; quality-release record; unit-mass study"
    - protocol_id: cp_waste_and_rejects
      process_id: "component_and_subassembly_supply_luminaire_assembly_functional_safety_photometric_testing_final_packaging"
      flow_role: "scrap, rejects and process waste"
      record_type: "waste ticket, reject log and storage record"
      raw_fields: "waste type; material; mass; treatment route; haulier; receiver; rejected item count; returned-to-supplier quantity; opening and closing storage"
      collection_method: "weigh dispatched waste and reconcile reject logs, returns and storage change"
      unit: "kg"
      frequency: "per shipment and monthly"
      temporal_coverage: "same period as production output"
      site_scope: "all included sites"
      aggregation_rule: "aggregate by process, material and treatment route; normalize to accepted output"
      quality_evidence: "calibrated weighbridge; waste transfer note; receiver certificate; reject disposition record"
    - protocol_id: cp_direct_releases
      process_id: "component_and_subassembly_supply"
      flow_role: "direct releases to air, water and soil"
      record_type: "stack, discharge, solvent-balance and permit record"
      raw_fields: "substance; compartment; measured concentration; flow; duration; calculated mass; method; detection limit"
      collection_method: "use facility monitoring or documented mass balance and isolate the declared process contribution"
      unit: "kg"
      frequency: "as monitored and at least annually"
      temporal_coverage: "same period as production output"
      site_scope: "every emitting site in scope"
      aggregation_rule: "calculate mass by substance and allocate only with documented causal driver"
      quality_evidence: "laboratory report; permit report; monitoring calibration; mass-balance worksheet"
    - protocol_id: cp_assembly_material_issue
      process_id: "luminaire_assembly"
      flow_role: "components issued and assembled product"
      record_type: "work order, material issue and return record"
      raw_fields: "work order; product configuration; item id; issued quantity; returned quantity; accepted unit count; product mass"
      collection_method: "reconcile issued and returned items to accepted assembly output"
      unit: "kg; item"
      frequency: "per work order"
      temporal_coverage: "representative production period"
      site_scope: "each assembly site"
      aggregation_rule: "aggregate by configuration and site, then normalize to assembled output"
      quality_evidence: "controlled BOM; work-order closeout; scale record"
    - protocol_id: cp_auxiliary_materials
      process_id: "luminaire_assembly"
      flow_role: "solder, adhesives, sealants, cleaning and other auxiliaries"
      record_type: "purchase, issue and stock record"
      raw_fields: "material id; amount; unit; stock change; returned amount; waste amount"
      collection_method: "reconcile purchases or issues with stock change and waste"
      unit: "kg"
      frequency: "monthly or per campaign"
      temporal_coverage: "representative production period"
      site_scope: "each assembly site"
      aggregation_rule: "aggregate by material and normalize to assembled output"
      quality_evidence: "invoice; material issue; inventory reconciliation; safety data sheet"
    - protocol_id: cp_assembly_output
      process_id: "luminaire_assembly"
      flow_role: "assembled complete luminaire"
      record_type: "production completion record"
      raw_fields: "configuration; accepted count; net unit mass; rework count; date"
      collection_method: "accepted count multiplied by verified unit mass or total calibrated weighing"
      unit: "kg; item"
      frequency: "per lot"
      temporal_coverage: "representative production period"
      site_scope: "each assembly site"
      aggregation_rule: "sum accepted mass and count; reconcile to component inputs and waste"
      quality_evidence: "scale calibration; final assembly record; BOM reconciliation"
    - protocol_id: cp_test_performance
      process_id: "functional_safety_photometric_testing"
      flow_role: "tested product, test electricity and declared performance"
      record_type: "test-lot record and accredited or controlled test report"
      raw_fields: "configuration; serial or lot id; tested count; pass/fail; test duration; power; outgoing luminous flux; control setting; supply voltage; CCT; IP/IK where applicable; lifetime evidence; report id"
      collection_method: "apply the relevant luminaire test method to the complete declared configuration; link results to production lots"
      unit: "kg; item; h; W; kWh; lm; K"
      frequency: "per qualification and routine test plan"
      temporal_coverage: "current product design and production period"
      site_scope: "each tested configuration and responsible laboratory"
      aggregation_rule: "aggregate routine test energy and rejects; retain configuration-specific performance without averaging incompatible variants"
      quality_evidence: "laboratory accreditation or competence evidence; test method; equipment calibration; signed report; conformity record"
    - protocol_id: cp_packaging_records
      process_id: "final_packaging"
      flow_role: "product and packaging at manufacturer gate"
      record_type: "packaging BOM, issue, reuse and shipment record"
      raw_fields: "packaging item; material; mass; units per product; reuse cycles; product count; net product mass; shipment date"
      collection_method: "weigh representative packaging items and reconcile issues to packed output"
      unit: "kg; item; reuse cycle"
      frequency: "per packaging design and shipment period"
      temporal_coverage: "representative production period"
      site_scope: "each packing site"
      aggregation_rule: "aggregate by material, divide reusable packaging by documented uses, and normalize to 1 kg net product"
      quality_evidence: "packaging specification; scale record; issue record; reuse log"
    - protocol_id: cp_distribution_installation
      process_id: "distribution_installation_use_maintenance"
      flow_role: "distribution and installation scenario"
      record_type: "shipment and installation record"
      raw_fields: "origin; destination; mode; distance; load factor; product and packaging mass; remote power supply; fixing and connector items; installation waste"
      collection_method: "use actual logistics and installation records or a separately identified justified scenario"
      unit: "kg; km; tkm"
      frequency: "per route or project"
      temporal_coverage: "declared scenario period"
      site_scope: "declared market and installation sites"
      aggregation_rule: "calculate transport work and installed-item inventory per declared configuration"
      quality_evidence: "bill of lading; route evidence; installation specification; project record"
    - protocol_id: cp_use_maintenance
      process_id: "distribution_installation_use_maintenance"
      flow_role: "use electricity, service and replacements"
      record_type: "power test, operating schedule, control log and maintenance record"
      raw_fields: "on-mode power; standby power; control setting; operating hours; outgoing luminous flux; assigned lifetime; component lifetime; replacement date and mass; electricity geography"
      collection_method: "combine complete-luminaire power at reference settings with recorded or explicitly scenario-defined operating hours; use actual maintenance records where available"
      unit: "W; kWh; h; lm; kg"
      frequency: "continuous or per operating and maintenance event"
      temporal_coverage: "declared service scenario"
      site_scope: "declared application and geography"
      aggregation_rule: "calculate energy and replacements per configuration and service reference; keep measured facts separate from scenario assumptions"
      quality_evidence: "power and photometric test report; control-system log; maintenance order; component declaration"
    - protocol_id: cp_end_of_life
      process_id: "end_of_life_treatment"
      flow_role: "collection, sorting, recovery and final residues"
      record_type: "take-back, recycler and treatment record"
      raw_fields: "collected mass; component or material category; transport; treatment route; recovered output; residue; destination; operator and permit"
      collection_method: "use actual scheme or operator mass balance; identify any separately modelled scenario"
      unit: "kg; km; tkm"
      frequency: "per batch or reporting year"
      temporal_coverage: "declared end-of-life scenario"
      site_scope: "declared market and treatment system"
      aggregation_rule: "reconcile input mass to recovered outputs and residues and normalize to treated product"
      quality_evidence: "transfer note; treatment certificate; operator mass balance; permit; producer-responsibility evidence"
  calculation_rules:
    - id: normalize_inventory_to_kg_product
      applies_to: "manufacturing inventory rows"
      rule: "normalized amount = attributable production-period amount / net accepted complete-luminaire mass in the same period"
      inputs:
        - "protocol records for input"
        - output
        - "waste or release"
        - cp_assembly_output
        - cp_packaging_records
      output: "flow amount per 1 kg complete finished luminaire"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: reconcile_product_mass
      applies_to: "complete product and packaging"
      rule: "reconcile component and auxiliary inputs to net product, production wastes, direct mass releases, returns and inventory change; packaging is reconciled separately and excluded from product mass"
      inputs:
        - cp_bom_component_receipts
        - cp_auxiliary_materials
        - cp_waste_and_rejects
        - cp_direct_releases
        - cp_packaging_records
      output: "documented product and packaging mass balances"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - pep-ecopassport-psr-0014-2023
    - id: calculate_test_electricity
      applies_to: "testing process"
      rule: "test electricity (kWh) = complete-luminaire electrical power (kW) x energized test duration (h), plus separately metered test-bench auxiliaries"
      inputs:
        - cp_test_performance
      output: "kWh test electricity per conforming output"
      source_ids:
        - iec-60598-1-2024
    - id: convert_to_lighting_service_reference
      applies_to: "downstream comparative service result"
      rule: "service-equivalent product mass = product mass per declared configuration x (1,000 lm / outgoing luminaire flux in lm) x (35,000 h / assigned luminaire lifetime in h); apply stage-specific inventories without mixing manufacturing, use and end-of-life"
      inputs:
        - cp_test_performance
        - cp_packaging_records
        - cp_use_maintenance
      output: "product quantity and stage inventories per 1,000 lm for 35,000 h"
      source_ids:
        - pep-ecopassport-psr-0014-2023
    - id: calculate_use_electricity
      applies_to: "downstream use scenario"
      rule: "use electricity = sum over operating modes of complete-luminaire power (kW) x recorded or declared hours in that mode; include required driver, control gear and control components and state reference control settings"
      inputs:
        - cp_test_performance
        - cp_use_maintenance
      output: "kWh per declared configuration or service reference"
      source_ids:
        - pep-ecopassport-psr-0014-2023
        - eu-2019-2020-light-sources
    - id: calculate_replacements
      applies_to: "downstream maintenance scenario"
      rule: "calculate replacement quantities from documented component lifetimes, replaceability and scenario duration; round physical replacement counts to whole events and exclude a replacement where the complete product is retired first"
      inputs:
        - cp_test_performance
        - cp_use_maintenance
      output: "replacement component counts, masses and associated inventories"
      source_ids:
        - pep-ecopassport-psr-0014-2023
    - id: reconcile_end_of_life
      applies_to: "end-of-life process"
      rule: "collected input mass = recovered product outputs + treatment residues + measured direct mass releases, adjusted only for documented storage change"
      inputs:
        - cp_end_of_life
      output: "mass-balanced treatment inventory"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - eu-2012-19-weee
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Evidence must show that the dataset represents a complete LED-only luminaire, not a source, module, driver, part, non-LED fitting or individual model standing in for an undeclared family."
      evidence: "controlled product specification; configuration BOM; CPC scope check; TianGong reference-flow UUID"
    - id: dq_bom_completeness
      applies_to: "bill of materials"
      requirement: "The BOM must cover the complete structure, optical, thermal, LED, electronic, wiring, fastening, sealing, control and supplied-accessory configuration and reconcile with net product mass and waste."
      evidence: "approved BOM; component receipts; unit-mass study; mass-balance worksheet"
    - id: dq_primary_data
      applies_to: "foreground manufacturing"
      requirement: "Use records from the actual sites producing the declared product. Report temporal coverage, production volume coverage, missing records, allocations and subcontracted operations."
      evidence: "site list; metering coverage; ERP extracts; production ledger; supplier records"
    - id: dq_performance_configuration
      applies_to: "photometric, power and lifetime data"
      requirement: "Test and technical evidence must refer to the complete declared configuration and reference control settings. LED-package values cannot substitute for luminaire output or power."
      evidence: "signed test report; test method; calibration; configuration cross-reference; lifetime evidence"
    - id: dq_upstream_data
      applies_to: "materials and purchased components"
      requirement: "Match datasets to material or component technology, supplier or region, production route and time period. Disclose proxies and do not present an unverified recycled-content or supplier claim as measured fact."
      evidence: "upstream dataset metadata; supplier declaration; data-quality assessment; proxy register"
    - id: dq_mass_energy_waste_balance
      applies_to: "each foreground process"
      requirement: "Reconcile inputs, accepted outputs, waste, returns, stock change, energy and direct releases for the same period. Investigate and disclose material residuals or inconsistent meters before publication."
      evidence: "signed reconciliation; calibration evidence; invoice cross-check; waste transfer records"
    - id: dq_downstream_scenarios
      applies_to: "lifecycle projections"
      requirement: "Identify geography, transport, installation items, operating schedule, grid dataset, controls, maintenance, component replacements and end-of-life system. Keep scenario assumptions distinct from foreground observations."
      evidence: "scenario register; shipment and project records; power and control logs; recycler evidence"
    - id: dq_no_unsupported_estimates
      applies_to: "all quantitative inventory"
      requirement: "Foreground collection is required when no reliable category-generic quantity exists. Any temporary modelled estimate must be explicitly labelled, replaceable, sensitivity-tested and excluded from claims of measured or reviewed performance."
      evidence: "estimate register; sensitivity result; replacement plan; reviewer disposition"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "The reference product flow UUID must be 3253c9d6-cf81-41e6-8997-f59f437c3f2d, flow type Product flow, CPC 46533, state code 100, with Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: val_complete_luminaire
    applies_to: "product identity and BOM"
    rule: "Reject datasets for a single LED die, package, module, lamp, driver, power supply, optical part, housing, generic lamp part, non-LED fitting, or an incomplete configuration."
    source_ids:
      - pep-ecopassport-psr-0014-2023
      - eu-2019-2020-light-sources
  - rule_id: val_reference_amount
    applies_to: "reference output"
    rule: "The normalized output must equal 1 kg net complete luminaire excluding packaging, and the corresponding product count must be declared."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: val_required_qualifiers
    applies_to: "dataset metadata"
    rule: "All required qualifiers in the reference-flow table must be present and traceable to the declared product configuration and production period."
    source_ids:
      - pep-ecopassport-psr-0014-2023
  - rule_id: val_process_coverage
    applies_to: "manufacturer-gate dataset"
    rule: "Component and subassembly supply or fabrication, assembly and finishing, testing and rework, final packaging, production wastes, direct releases and upstream datasets must be covered or explicitly documented as not applicable without hiding a supplied component."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - pep-ecopassport-psr-0014-2023
  - rule_id: val_performance_evidence
    applies_to: "outgoing flux, power and lifetime"
    rule: "Outgoing flux and power must be for the complete luminaire at recorded reference control settings; lifetime and replaceability must be supported and must distinguish luminaire, LED source and control gear."
    source_ids:
      - pep-ecopassport-psr-0014-2023
      - iec-60598-1-2024
      - eu-2019-2020-light-sources
  - rule_id: val_mass_balance
    applies_to: "product, component, packaging and waste records"
    rule: "Product and packaging mass balances must reconcile for aligned periods. Packaging must not be included in the product reference mass, and supplier returns or rework must not be double counted."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: val_allocation
    applies_to: "shared facilities and co-products"
    rule: "Every allocated flow must identify the unallocated total, allocation driver and receiving outputs. Residual co-product allocation must use output mass unless a reviewed direct assignment or subdivision is documented."
    source_ids:
      - pep-ecopassport-psr-0014-2023
  - rule_id: val_lifecycle_claim
    applies_to: "lifecyclemodel or lighting-service result"
    rule: "A claim covering the lighting service or cradle-to-grave result must include distribution, installation, use electricity, maintenance and replacements, and end-of-life; it must not present the 1 kg manufacturer-gate dataset alone as a full lifecycle result."
    source_ids:
      - pep-ecopassport-psr-0014-2023
      - eu-2012-19-weee
  - rule_id: val_evidence_and_estimates
    applies_to: "quantitative and source records"
    rule: "Reject unsupported fixed values, unlabelled estimates, missing source references for external rules, or reasoned estimates presented as final evidence."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
published_dataset_profile:
  dataset_role: "manufacturer-gate foreground unit process for a complete LED-only luminaire; optional input to a declared lifecyclemodel"
  downstream_use: "secondary_dataset; background_dataset; lifecyclemodel component for building, road, public-space and other declared lighting applications"
  allowed_use: "Production datasets and downstream scenarios for complete CPC 46533 LED-only luminaires with matching configuration, geography, technology, performance, control, lifetime and data-quality disclosures"
  excluded_use: "Individual LED sources, modules, drivers, parts or non-LED fittings; automatic substitution across incompatible luminaire configurations or applications; claims about use-phase energy or full life cycle based only on the manufacturer-gate dataset"
  required_metadata: "canonical PCR id; reference-flow UUID and mass property; product count per kg; net product and packaging mass; complete BOM; supplied and integrated components; production sites and period; geography; outgoing luminous flux; total power and reference control settings; lifetime and replaceability; CCT; supply voltage; IP and IK where applicable; process coverage; upstream datasets; allocation and cut-offs"
  required_quality_disclosure: "Primary-data temporal and site coverage; BOM and mass-balance completeness; meter and test calibration; photometric and lifetime evidence; upstream data quality and proxies; allocation; waste routes; excluded processes; modelled estimates; uncertainty and sensitivity; downstream scenario assumptions when applicable"
  update_trigger: "Change to product boundary, LED or driver technology, BOM or material share, supplier or manufacturing geography, production route, power or outgoing flux, control setting, lifetime or replaceability, packaging, allocation, upstream dataset, energy mix, waste route, regulation, test method, or material data-quality finding"
