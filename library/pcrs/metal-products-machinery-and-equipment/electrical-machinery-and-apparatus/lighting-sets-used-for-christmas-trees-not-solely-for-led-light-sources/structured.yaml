allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "shared assembly and packaging operations"
    rule: "Subdivide or submeter product-specific operations wherever records permit before applying an allocation."
    source_ids: []
  - rule_id: al_shared_operations
    applies_to: "shared electricity and support operations"
    rule: "When subdivision is not possible, allocate shared burdens using a documented physical driver causally related to the operation, such as machine time, tested-set count, or measured throughput; do not use revenue unless no defensible physical driver exists."
    source_ids: []
  - rule_id: al_rework_and_rejects
    applies_to: "rework and rejected products"
    rule: "Assign rework energy and consumed components to the production lot that caused them; exclude successfully reworked units from waste output and include unrecovered defective sets as waste."
    source_ids: []
  - rule_id: al_recycling
    applies_to: "recyclable production waste and end-of-life material"
    rule: "Report waste treatment and any recycling credit separately. Do not subtract an avoided-product credit inside the foreground inventory unless the declared study method requires it, in which case disclose the method and substituted product."
    source_ids:
      - eu-weee-directive-2012-19
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "final_assembly_and_test"
      flow_role: "received components installed or lost"
      record_type: "approved bill of materials, purchase receipts, issue records, and representative component weighing"
      raw_fields: "component identity; supplier; material or technology; units issued; units returned; measured unit mass; product configuration; accepted output count"
      collection_method: "Reconcile BOM and stock issues to the reporting lot and verify representative masses on calibrated scales"
      unit: "kg and Item(s)"
      frequency: "Each product configuration and production lot"
      temporal_coverage: "Complete reporting period, normally at least 12 consecutive months or the full campaign"
      site_scope: "All facilities producing the declared reference product"
      aggregation_rule: "Sum net issued mass by atomic component and divide by saleable-set output; retain losses in the applicable waste row"
      quality_evidence: "BOM revision, supplier specification, scale calibration, stock reconciliation, and lot records"
    - protocol_id: cp_assembly_energy
      process_id: "final_assembly_and_test"
      flow_role: "assembly and test electricity"
      record_type: "submeter or facility electricity meter with allocation record"
      raw_fields: "meter start and end; kWh; equipment scope; operating time; tested-set count; allocation driver; transformer or standby inclusion"
      collection_method: "Prefer product-line submetering; otherwise reconcile to facility invoices and allocate with a documented physical driver"
      unit: "kWh, converted to MJ"
      frequency: "Monthly and each production campaign"
      temporal_coverage: "Same period as production output"
      site_scope: "All assembly and test operations in the declared boundary"
      aggregation_rule: "Sum attributable kWh, convert to MJ, and divide by saleable-set output"
      quality_evidence: "Meter calibration or invoice reconciliation and allocation worksheet"
    - protocol_id: cp_production_outputs
      process_id: "final_assembly_and_test"
      flow_role: "saleable output and manufacturing wastes"
      record_type: "production count, test log, rework log, and waste scale ticket"
      raw_fields: "produced count; passed count; reworked count; rejected count; waste identity; gross and tare mass; treatment destination"
      collection_method: "Reconcile test disposition to production counts and weigh each segregated waste stream"
      unit: "Item(s) and kg"
      frequency: "Each lot; wastes at each shipment"
      temporal_coverage: "Same period as component and energy records"
      site_scope: "All included assembly facilities"
      aggregation_rule: "Normalize passed output to one set; divide each net waste mass by passed-set count"
      quality_evidence: "Test records, rework disposition, calibrated scale evidence, and waste transfer note"
    - protocol_id: cp_packaging_bom
      process_id: "packaging"
      flow_role: "sales packaging supplied"
      record_type: "packaging BOM, supplier specification, and representative weighing"
      raw_fields: "package identity; material; grade; recycled content; unit mass; units per set; supplier"
      collection_method: "Weigh each packaging component and reconcile count per finished set"
      unit: "kg and Item(s)"
      frequency: "Each packaging specification change and representative lot"
      temporal_coverage: "Same period as reference product"
      site_scope: "Packaging applied to the declared product"
      aggregation_rule: "Multiply verified unit mass by units per set and normalize to one packaged set"
      quality_evidence: "Packaging drawing, supplier specification, scale calibration, and BOM revision"
    - protocol_id: cp_use_scenario
      process_id: "use_phase"
      flow_role: "electricity during use"
      record_type: "product electrical test and declared scenario"
      raw_fields: "measured input power by mode; operating hours per year; duty cycle; service life; transformer losses; standby power; geography; grid dataset"
      collection_method: "Measure input power for the declared configuration and combine it with an explicitly named operating scenario"
      unit: "W, h, years, and MJ"
      frequency: "Each product configuration and scenario revision"
      temporal_coverage: "Measurement date and scenario reference year stated"
      site_scope: "Declared market and use geography"
      aggregation_rule: "Sum mode-specific kW × hours × duty cycle, multiply by service years, and convert kWh to MJ"
      quality_evidence: "Calibrated power measurement, rated label, scenario rationale, and calculation worksheet"
    - protocol_id: cp_end_of_life_scenario
      process_id: "end_of_life"
      flow_role: "discarded electrical equipment"
      record_type: "product weighing and collection/treatment scenario"
      raw_fields: "product mass excluding packaging; collection rate; treatment route; geography; reference year"
      collection_method: "Weigh the product and apply only a documented scenario-specific collection rate"
      unit: "kg and fraction"
      frequency: "Each product configuration and scenario revision"
      temporal_coverage: "Scenario reference year stated"
      site_scope: "Declared market and collection geography"
      aggregation_rule: "Product mass × declared collection rate per discarded set"
      quality_evidence: "Scale calibration, scenario source, collection-system description, and treatment route"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all production inventory rows"
      rule: "normalized amount = reporting-period attributable amount ÷ saleable finished-set count"
      inputs:
        - "atomic input"
        - energy
        - "or waste amount"
        - "passed-set count"
      output: "amount per 1 finished lighting set"
      source_ids: []
    - id: calc_component_reconciliation
      applies_to: "component inputs"
      rule: "net component input = opening stock + receipts − closing stock − documented returns; reconcile net input to product mass, waste, and inventory change"
      inputs:
        - stock
        - receipts
        - returns
        - "product mass"
        - "waste mass"
      output: "reconciled component mass"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity in MJ = metered or calculated electricity in kWh × 3.6"
      inputs:
