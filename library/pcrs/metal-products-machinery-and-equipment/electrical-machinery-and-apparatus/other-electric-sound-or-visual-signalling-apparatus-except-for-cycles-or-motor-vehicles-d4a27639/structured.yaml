allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared operations"
    rule: "Prefer meter, batch, work-order, machine-time, or mass-based subdivision that assigns actual activity to the studied model and production lot before applying allocation."
    source_ids: []
  - rule_id: allocation_shared_resources
    applies_to: "utilities and shared consumables"
    rule: "If subdivision is infeasible, allocate a shared resource using the closest documented causal driver, such as machine time for assembly electricity or cleaned board area for cleaning inputs; disclose the driver and sensitivity."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "production scrap and recycling"
    rule: "Report waste mass and destination separately. Do not credit avoided primary production or subtract revenue from the foreground inventory unless the chosen LCA method explicitly requires it; document any downstream recycling convention outside the measured factory inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_and_packaging_records
      process_id: "apparatus_manufacture"
      flow_role: "purchased component or packaging input"
      record_type: "purchase receipt, bill of materials, issue record, specification"
      raw_fields: "item identity; supplier; material or component state; received mass; issued quantity; unit mass; lot; rejects returned; packaging inclusion"
      collection_method: "Reconcile approved bill of materials and stock issues to supplier receipts; measure representative unit mass when records are count-based."
      unit: "kg and item count"
      frequency: "each production lot, aggregated for the reference period"
      temporal_coverage: "representative continuous 12-month period or disclosed campaign"
      site_scope: "all manufacturing lines producing the declared model"
      aggregation_rule: "Net issued mass = issued plus replacements minus unused returns; divide by conforming unpackaged product mass."
      quality_evidence: "signed receiving records; calibrated balance records; bill-of-materials revision; reconciliation result"
    - protocol_id: cp_energy_records
      process_id: "apparatus_manufacture"
      flow_role: "purchased electricity"
      record_type: "utility meter, submeter, machine log"
      raw_fields: "meter start and end; submeter coverage; machine time; production lot; downtime; conforming output mass; loss boundary"
      collection_method: "Prefer line or equipment submeters; otherwise allocate facility-meter consumption using documented machine time after excluding non-production loads."
      unit: "kWh"
      frequency: "meter interval and each production lot, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or disclosed campaign"
      site_scope: "assembly, cleaning, testing, rework, and packaging equipment in scope"
      aggregation_rule: "Convert allocated kWh to MJ by multiplying by 3.6; divide by conforming unpackaged product mass."
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; downtime log"
    - protocol_id: cp_water_records
      process_id: "apparatus_manufacture"
      flow_role: "aqueous-cleaning process water"
      record_type: "water meter, batch sheet"
      raw_fields: "meter start and end or batch volume; water identity; density basis; cleaning route; lot; conforming output mass"
      collection_method: "Read a dedicated meter or sum batch additions for production cleaning only; exclude cooling and sanitary water."
      unit: "kg or measured volume with density"
      frequency: "each cleaning batch, aggregated monthly"
      temporal_coverage: "representative continuous 12-month period or disclosed campaign"
      site_scope: "all in-scope aqueous-cleaning equipment"
      aggregation_rule: "Convert volume to mass using documented density when needed; divide by conforming unpackaged product mass."
      quality_evidence: "meter calibration; batch-sheet sign-off; density source; water-balance reconciliation"
    - protocol_id: cp_output_and_reject_records
      process_id: "apparatus_manufacture"
      flow_role: "conforming product and rejected populated-board output"
      record_type: "release log, scale record, nonconformance and waste manifest"
      raw_fields: "model; lot; passed units; net unit mass; packaging mass; failed units; rework outcome; waste identity; waste mass; destination"
      collection_method: "Reconcile released units and measured net mass with production and nonconformance records; weigh segregated populated-board waste at hand-off."
      unit: "kg and item count"
      frequency: "each production lot and waste hand-off"
      temporal_coverage: "representative continuous 12-month period or disclosed campaign"
      site_scope: "all lines and waste collection points in scope"
      aggregation_rule: "Conforming mass excludes separately reported packaging; waste mass excludes items successfully returned to production; normalize both to 1 kg conforming product."
      quality_evidence: "calibrated scale; signed release record; nonconformance disposition; waste manifest"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "all mass-based rows"
      rule: "normalized kg/kg = attributable exchange mass / conforming unpackaged apparatus mass"
      inputs:
        - "attributable exchange mass"
        - "conforming unpackaged apparatus mass"
      output: "kg exchange per kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "count-based components and boxes"
      rule: "input mass = net issued item count × representative measured or supplier-declared unit mass"
      inputs:
        - "item count"
        - "unit mass"
        - "unused returns"
      output: "kg input"
      source_ids: []
    - id: calc_electricity
      applies_to: "purchased electricity"
      rule: "MJ/kg = attributable metered kWh × 3.6 / conforming unpackaged apparatus mass"
      inputs:
        - "metered kWh"
        - "allocation driver where required"
        - "conforming unpackaged apparatus mass"
      output: "MJ electricity per kg reference product"
      source_ids: []
    - id: calc_water_mass
      applies_to: "volume-metered process water"
      rule: "kg/kg = measured volume × documented density / conforming unpackaged apparatus mass"
      inputs:
        - volume
        - density
        - "conforming unpackaged apparatus mass"
      output: "kg process water per kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product, components, packaging, and waste"
      requirement: "Match each row to the actual model, delivered state, material or component identity, and treatment role; do not substitute an umbrella flow or an unpopulated board for a populated assembly."
      evidence: "specification, bill of materials, supplier record, waste manifest, and UUID audit"
    - id: dq_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile component issues, utilities, conforming output, rejects, and all route-specific auxiliaries, wastes, and direct emissions for the same time and site scope; explain every excluded operation."
      evidence: "mass and energy reconciliation; completeness checklist; exclusion log"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative continuous 12-month period where available; otherwise disclose the campaign, seasonality, utilisation, downtime, and representativeness limitation."
      evidence: "dated meters, invoices, lot records, and production calendar"
    - id: dq_hazardous_materials
      applies_to: "homogeneous materials and technical documentation"
      requirement: "Where the declared market regime applies, retain supplier declarations or analytical evidence for regulated substances at the applicable homogeneous-material level and identify exemptions used; this is a conformity disclosure, not an empirical inventory range."
      evidence: "supplier material declarations, test reports, technical documentation, and eu-rohs-2011-65"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match supplier geography, component state, electricity voltage and mix, water delivery, and waste treatment technology; document proxies and their expected influence."
      evidence: "supplier location, dataset metadata, utility contract, and treatment manifest"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Confirm CPC 46929 identity, the declared sound or visual signalling function, complete-product state, exclusions, and all required qualifiers before accepting the dataset."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_reference
    applies_to: "normalization"
    rule: "Confirm that every amount uses the same conforming unpackaged factory-gate product mass and that separately reported packaging is excluded from the 1 kg denominator."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "inventory completeness"
    rule: "For each actual route, verify that all bill-of-materials inputs, auxiliaries, utilities, rejects, wastes, and direct emissions appear as atomic exchanges; justify every conditional row marked not applicable."
    source_ids:
      - us-epa-electronics-sector-1995
  - rule_id: validate_reconciliation
    applies_to: "foreground records"
    rule: "Reconcile received or issued component mass, conforming output, rework, and waste over the same period; investigate material discrepancies and meter-allocation gaps before release."
    source_ids: []
  - rule_id: validate_uuid_property_unit
    applies_to: "UUID-bearing rows"
    rule: "Confirm state-code-100 UUID identity, flow type, product or waste state, property, unit group, and official Chinese base name; reject proxies or mismatched candidate states."
    source_ids: []
  - rule_id: validate_regulated_substances
    applies_to: "declared conformity regime"
    rule: "Treat substance thresholds as conformity limits only, retain applicable evidence and exemptions, and do not reinterpret them as production inventory ranges."
    source_ids:
      - eu-rohs-2011-65
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset for a declared CPC 46929 apparatus model and manufacturing route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product or component system models whose apparatus identity, route, geography, time, packaging boundary, and performance qualifiers are compatible with the published metadata"
  excluded_use: "CPC 46921 alarm apparatus, vehicle signalling equipment, transport-facility electromechanical traffic control, component-only products, or a different technology represented without adjustment"
  required_metadata: "canonical PCR id; CPC reference; model and signalling mode; performance and test criteria; rated electrical characteristics; service-life assumption; bill-of-materials revision; purchased-versus-in-house scope; site and geography; reference period; packaging boundary; allocation; waste destinations; conformity regime; unresolved data gaps"
  required_quality_disclosure: "primary-data coverage; meter and mass reconciliation; conditional route decisions; proxies; UUID gaps; upstream dataset geography and technology; regulated-substance evidence where applicable; uncertainty and exclusions"
  update_trigger: "Change in model or bill of materials, signalling or power technology, manufacturing or cleaning route, supplier or geography, electricity mix, packaging, waste treatment, conformity regime, allocation method, or a material shift in measured inputs, output, or rejects"
