allocation_rules:
  - rule_id: allocation_direct_assignment
    applies_to: "Multiple products or production lines"
    rule: "Prefer subdivision, dedicated meters, batch records, equipment time, and material issue records so inputs and wastes are directly assigned to the declared primary-battery product."
    source_ids: []
  - rule_id: allocation_joint_outputs
    applies_to: "Inseparable saleable co-products"
    rule: "Do not apply an undocumented default factor. Declare the co-product, causal relationship, allocation property, prices or physical quantities, allocation period, and sensitivity result; unresolved joint production requires methodology review before publication."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "Internal recycle and external recovery"
    rule: "Count internal recycle once and subtract only documented returns from gross issues. Do not credit avoided primary production or future recycling inside the factory-gate foreground result; report any such credit as a separate disclosed scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_bom
      process_id: "primary_battery_manufacturing"
      flow_role: "Active, structural, seal, label, and packaging material inputs"
      record_type: "Purchase receipts, lot issue/return records, bill of materials, and inventory reconciliation"
      raw_fields: "material identity; supplier; lot; chemistry or grade; concentration or coating; gross issue; return; opening and closing stock; conforming output items"
      collection_method: "Reconcile ERP or warehouse records to production lots and verify representative lots against weighed issues"
      unit: "kg and Item(s)"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least 12 consecutive months or the full campaign for campaign production"
      site_scope: "All operations included in the declared manufacturing site"
      aggregation_rule: "Net consumption equals receipts plus opening stock minus returns, closing stock, and separately documented transfers; divide by conforming output items"
      quality_evidence: "Supplier specifications, calibrated scale records, stock reconciliation, and signed bill-of-material revision"
    - protocol_id: cp_water_meter
      process_id: "primary_battery_manufacturing"
      flow_role: "Process-water input"
      record_type: "Water meter and batch make-up records"
      raw_fields: "meter id; opening and closing reading; make-up water; return water; electrolyte-solution water; downtime; output items"
      collection_method: "Read calibrated site or process meters and reconcile batch additions; exclude water embedded in purchased solutions"
      unit: "kg or m3 with density and temperature"
      frequency: "Daily or per batch, aggregated monthly"
      temporal_coverage: "Same period as output"
      site_scope: "Included process lines and allocated auxiliaries"
      aggregation_rule: "Net boundary input divided by conforming output items"
      quality_evidence: "Meter calibration, density conversion, line coverage, and reconciliation to invoices"
    - protocol_id: cp_electricity_meter
      process_id: "primary_battery_manufacturing"
      flow_role: "Purchased electricity input"
      record_type: "Revenue meter, submeter, and operating-hour records"
      raw_fields: "meter id; opening and closing reading; line load; auxiliary allocation; downtime; voltage level; supplier and grid geography; output items"
      collection_method: "Use calibrated submeters where available; otherwise document an engineering allocation from the site meter"
      unit: "kWh converted to MJ"
      frequency: "Hourly or daily, aggregated monthly"
      temporal_coverage: "Same period as output"
      site_scope: "Included process lines and allocated auxiliaries"
      aggregation_rule: "Net metered electricity minus documented exports, divided by conforming output items"
      quality_evidence: "Meter calibration, invoice reconciliation, submeter coverage, and allocation worksheet"
    - protocol_id: cp_output_and_test
      process_id: "primary_battery_manufacturing"
      flow_role: "Conforming output and performance qualifiers"
      record_type: "Production count, inspection record, and electrical test record"
      raw_fields: "chemistry; designation; format; cell count; voltage; test load; duty cycle; temperature; end-point voltage; capacity; leakage result; accepted items; packaging configuration"
      collection_method: "Count accepted items after final test and link sampled performance results to lot and test method"
      unit: "Item(s), V, A or ohm, h, Ah or Wh, degree C"
      frequency: "Each lot"
      temporal_coverage: "Same period as inputs"
      site_scope: "All sale-ready output from the declared site"
      aggregation_rule: "Sum accepted items; retain lot-weighted performance statistics without converting between unlike test conditions"
      quality_evidence: "Counter verification, test-equipment calibration, sampling plan, and nonconformance log"
    - protocol_id: cp_waste_records
      process_id: "primary_battery_manufacturing"
      flow_role: "Rejected batteries and alkaline liquid waste"
      record_type: "Nonconformance log, waste scale ticket, manifest, and treatment receipt"
      raw_fields: "waste identity; source lot; item count or mass; electrolyte concentration; storage change; destination; treatment route; date"
      collection_method: "Reconcile generated, internally reworked, stored, and off-site transferred quantities"
      unit: "Item(s) or kg"
      frequency: "Each transfer, reconciled monthly"
      temporal_coverage: "Same period as output"
      site_scope: "All waste-generating operations in scope"
      aggregation_rule: "Waste generated equals off-site transfer plus closing storage minus opening storage minus documented rework return"
      quality_evidence: "Scale calibration, signed transfer record, treatment receipt, and storage reconciliation"
  calculation_rules:
    - id: calc_per_item_inventory
      applies_to: "Every inventory exchange"
      rule: "Divide the exchange quantity assigned to the production period by the number of conforming sale-ready reference items from the same period."
      inputs:
        - "Net exchange quantity"
        - "conforming output items"
      output: "Exchange per reference item"
      source_ids: []
    - id: calc_solution_reporting
      applies_to: "Potassium-hydroxide solution and waste alkaline liquor"
      rule: "Report as-delivered solution mass and concentration. Calculate dry potassium-hydroxide mass only as an additional disclosed value: solution mass multiplied by measured mass fraction; never replace the as-delivered exchange silently."
      inputs:
        - "Solution mass"
        - "measured or supplier-certified mass fraction"
      output: "As-delivered mass and optional dry KOH mass"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Electricity"
      rule: "Convert kWh to MJ using 3.6 MJ per kWh after net meter reconciliation."
      inputs:
        - "Net kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_capacity
      applies_to: "Performance qualifier"
      rule: "For a constant-current test, capacity in Ah equals current in A multiplied by elapsed hours to the declared end-point voltage; other load profiles require the declared test method and integrated current."
      inputs:
        - "Current or load profile"
        - "elapsed time"
        - "end-point voltage"
        - temperature
        - "duty cycle"
      output: "Declared tested capacity"
      source_ids:
        - energizer-alkaline-handbook-2018
    - id: calc_mass_reconciliation
      applies_to: "Material and waste completeness"
      rule: "Reconcile input material mass with product mass, measured wastes, stock change, moisture or volatile loss, and direct emissions. Investigate and disclose the residual rather than forcing balance by changing the reference product."
      inputs:
        - "Material inputs"
        - "product mass sample"
        - wastes
        - "stock change"
        - "measured emissions"
      output: "Mass-balance residual and explanation"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Chemistry, designation, format, cell count, performance test conditions, package configuration, site, geography, and production period must be unambiguous."
      evidence: "Product specification, label, approved bill of materials, test method, and lot record"
    - id: dq_temporal_coverage
      applies_to: "Foreground inventory"
      requirement: "Use at least 12 consecutive months for continuous production or the complete campaign for campaign production; explain shutdowns, startups, abnormal lots, and exclusions."
      evidence: "Dated meter, purchase, output, and waste records"
    - id: dq_completeness
      applies_to: "Atomic exchanges"
      requirement: "Reconcile the bill of materials, utilities, output, nonconforming items, other material losses, liquid wastes, and direct emissions. Add actual route-specific exchanges instead of aggregating them into umbrella rows."
      evidence: "Signed completeness checklist and mass reconciliation"
    - id: dq_geography_technology
      applies_to: "Upstream links"
      requirement: "Match supplier geography, production technology, material grade, solution concentration, recycled content, electricity voltage and grid, water supply, and waste-treatment route where they materially affect results."
      evidence: "Supplier declaration, dataset metadata, invoices, and treatment receipts"
    - id: dq_measurement
      applies_to: "Meters, scales, and tests"
      requirement: "Use equipment within its calibration interval and retain the calibration status, resolution, missing-data treatment, and allocation worksheet."
      evidence: "Calibration certificate, meter register, and QA record"
    - id: dq_uuid_gaps
      applies_to: "UUID-empty rows"
      requirement: "Keep the concrete flow name and reported amount, but do not substitute a proxy UUID. Resolve or explicitly carry the identity gap before publication."
      evidence: "UUID review record linked to the row id"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Product identity"
    rule: "Fail validation if the product is rechargeable, spent, a separately sold part, or lacks declared chemistry, format, cell count, manufacturing site, production period, and package configuration."
    source_ids:
      - eu-batteries-regulation-2023
      - un-cpc-3-0-2025
  - rule_id: validation_reference_flow
    applies_to: "Reference flow"
    rule: "Confirm exactly one conforming sale-ready item and retain the capacity test load, duty cycle, temperature, end-point voltage, rated voltage, and shelf-life declaration."
    source_ids:
      - energizer-alkaline-handbook-2018
      - energizer-alkaline-ais-2022
  - rule_id: validation_boundary
    applies_to: "System boundary"
    rule: "Confirm all in-house preparation, forming, assembly, filling, sealing, inspection, testing, marking, packaging, and allocated auxiliaries are included and downstream use and end-of-life are excluded."
    source_ids:
      - us-epa-primary-battery-manufacturing-1975
  - rule_id: validation_inventory
    applies_to: "Process inventory"
    rule: "Confirm every actual bill-of-material, packaging, energy, water, waste, and direct-emission exchange is represented as one atomic row; confirm no representative alkaline row is applied unchanged to another chemistry."
    source_ids:
      - energizer-alkaline-handbook-2018
      - energizer-alkaline-ais-2022
  - rule_id: validation_units
    applies_to: "Amounts and conversions"
    rule: "Confirm item counts, material masses, solution concentrations, electricity conversion, and normalization period are consistent and auditable."
    source_ids: []
  - rule_id: validation_reconciliation
    applies_to: "Completeness"
    rule: "Require bill-of-material, output, waste, stock, energy, and water reconciliation; disclose the mass-balance residual, allocation methods, internal recycle, missing data, and exclusions."
    source_ids: []
  - rule_id: validation_uuid_resolution
    applies_to: "Database identity"
    rule: "Report cathode_conductive_graphite, nickel_plated_steel_sheet, and rejected_alkaline_battery as unresolved until exact public state-100 flows are confirmed; never pass a proxy UUID as exact."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one declared primary cell or primary battery product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate product modelling, supplier comparison under matched product and test qualifiers, and downstream studies that add distribution, use, and end-of-life consistently"
  excluded_use: "Rechargeable batteries, chemistry substitution without a route-specific inventory, spent-battery treatment, performance comparison under unmatched discharge tests, or an undisclosed global market average"
  required_metadata: "PCR id and version; chemistry; IEC or equivalent designation; format and dimensions; cell count; voltage; capacity test conditions; shelf-life claim; package configuration; site and geography; production period; technology; purchased-versus-in-house component boundary; upstream datasets; allocation; internal recycle; waste routes; unresolved identities"
  required_quality_disclosure: "Temporal and site coverage; meter and scale coverage; test sampling; calibration; supplier data quality; allocation; missing-data treatment; mass-balance residual; important-flow range evidence gaps; UUID gaps; exclusions and sensitivity cases"
  update_trigger: "Change in chemistry, active-material supplier route, format, cell count, bill of materials, electrolyte concentration, production site or line, electricity supply, packaging, test specification, allocation, waste route, or a material change in normalized inventory"
