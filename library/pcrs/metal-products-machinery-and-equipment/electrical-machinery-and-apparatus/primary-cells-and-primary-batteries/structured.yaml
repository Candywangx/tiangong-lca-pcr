functional_unit:
  what: "Delivery of electrical energy by a declared primary electrochemical cell or battery"
  how_much: "One conforming primary cell or primary battery of the declared chemistry, format, and rated capacity"
  how_well: "Meets the declared rated voltage and capacity under the stated discharge load, duty cycle, temperature, and end-point voltage, and meets the declared leakage and safety acceptance criteria"
  how_long_or_cycle: "One non-rechargeable discharge life, with the declared shelf-life and storage condition"
  reference_flow_link: "One sale-ready item of the declared primary cell or primary battery at the manufacturing-site gate"
system_boundary:
  rules:
    - rule_id: sb_factory_gate
      applies_to: "Foreground manufacture"
      rule: "Include material forming, active-material and electrolyte preparation performed on site, cell assembly and filling, sealing, inspection, electrical testing, marking, and packaging through the sale-ready factory gate."
      source_ids:
        - us-epa-primary-battery-manufacturing-1975
        - energizer-alkaline-handbook-2018
    - rule_id: sb_upstream_inputs
      applies_to: "Purchased inputs"
      rule: "Link upstream production and delivery datasets for every purchased input; keep the foreground amount as the actual net site receipt or consumption."
      source_ids: []
    - rule_id: sb_downstream_exclusion
      applies_to: "Downstream stages"
      rule: "Exclude distribution after the factory gate, use, attempted recharging, and end-of-life treatment unless a separate study system explicitly adds those stages."
      source_ids:
        - eu-batteries-regulation-2023
    - rule_id: sb_route_completeness
      applies_to: "Non-representative chemistry or format"
      rule: "Replace the representative alkaline bill of materials with the actual atomic exchanges and disclose all route-specific active materials, electrolyte, container, terminals, separator, seals, labels, process emissions, and wastes."
      source_ids:
        - eu-batteries-regulation-2023
        - energizer-alkaline-ais-2022
boundary_abstraction:
  declared_starting_condition: "Purchased active materials, electrolyte constituents, component materials, packaging, water, and delivered energy at the primary-battery manufacturing-site gate"
  starting_condition_role: "Cradle-to-gate foreground entry point for primary-cell and primary-battery manufacture"
  product_classification_scope: "New non-rechargeable primary cells and primary batteries; excludes rechargeable accumulators, parts sold separately, and spent batteries"
  recursive_input_rule: "When a primary cell or primary battery is purchased for assembly into a larger primary battery, record it once as a same-category product input and link its upstream factory-gate dataset; do not recursively reconstruct it inside the receiving process"
  upstream_dataset_requirement: "Every purchased material, energy carrier, water supply, packaging component, and same-category product input requires a geographically and technologically representative upstream dataset or an explicit data-gap disclosure"
  disclosure: "Declare chemistry, format, site, production period, purchased-versus-in-house component boundary, upstream dataset choices, internal recycling, rejected-product treatment, packaging configuration, and all exclusions"
