      - row_id: nickel_plated_steel_sheet
        reason_code: no_exact_candidate
        explanation: "No candidate exactly represented nickel-plated steel sheet for cell cans and terminals. Plain steel sheet, structural steel plate, and nickel sheet were not promoted as proxies."
      - row_id: rejected_alkaline_battery
        reason_code: semantic_mismatch
        explanation: "The waste-flow search returned only capacitor wastes. No exact rejected alkaline primary-battery waste flow was available, so the concrete waste identity remains UUID-empty."
