          - electrolyte_potassium_hydroxide
          - cathode_conductive_graphite
          - nickel_plated_steel_sheet
          - process_water
          - electricity
          - alkaline_battery_output
          - rejected_alkaline_battery
          - waste_alkaline_liquor
        explanation: "No pair of mutually independent, original-text-verified sources with compatible factory-gate boundary, item reference flow, product format, and contemporary alkaline technology was available for empirical inventory ranges. Manufacturer composition intervals and historical plant observations were not combined into an inferred range. Foreground collection remains mandatory."
