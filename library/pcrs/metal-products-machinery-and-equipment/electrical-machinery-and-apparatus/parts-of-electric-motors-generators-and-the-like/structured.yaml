      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts using a product- and reporting-period-specific measured mean net mass; retain the count, sampled masses, sample size, and calculation."
