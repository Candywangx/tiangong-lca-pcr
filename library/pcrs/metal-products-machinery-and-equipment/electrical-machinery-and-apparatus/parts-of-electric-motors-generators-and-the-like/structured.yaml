system_boundary:
  rules:
    - rule_id: sb_foreground_gate
      applies_to: "foreground boundary"
      rule: "Include all on-site operations required to convert received inputs into the declared unpackaged, quality-released part, including applicable forming, winding, insulation, impregnation, joining, cleaning, finishing, balancing, testing, and internal material handling."
      source_ids:
        - iec-ts-63573-1-2026
    - rule_id: sb_material_identity
      applies_to: "material and process-chemical inputs"
      rule: "Record each material and process chemical as a separate atomic flow with composition, grade, delivered state, supplier geography, and quantity; do not collapse them into an unspecified material total."
      source_ids:
        - iec-82474-1-2025
    - rule_id: sb_conditional_operations
      applies_to: "route-dependent operations"
      rule: "Include a route-dependent exchange only when the declared part route uses it; document absence as not applicable rather than inserting a generic proxy flow."
      source_ids: []
    - rule_id: sb_direct_releases
      applies_to: "direct site emissions and wastes"
      rule: "Include direct fossil carbon dioxide, NMVOC, PM10, waste alkaline liquor, and metal scrap when generated; use the actual measured or permitted emission compartment and actual waste destination."
      source_ids: []
    - rule_id: sb_downstream_exclusion
      applies_to: "downstream stages"
      rule: "End the default boundary at the site gate before customer-specific packaging. Downstream transport, installation, operation, maintenance, repair, and end-of-life are separate scenarios and shall not be embedded in the reference flow."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased materials, components, process chemicals, water, fuels, and electricity as received at the manufacturing site gate"
  starting_condition_role: "Start of foreground part manufacture; upstream production and inbound transport are represented by linked supplier or background datasets rather than duplicated inside the foreground process"
  product_classification_scope: "One declared separately supplied part within CPC 3.0:46131; complete rotating machines and parts for transformers, static converters, and inductors are excluded"
  recursive_input_rule: "A purchased input that itself meets this PCR is recorded once as a product input with its supplier dataset; do not recursively re-create its upstream part manufacture unless the reporting site performs additional processing"
  upstream_dataset_requirement: "Link each purchased material, component, chemical, fuel, electricity supply, and treatment service to a geography-, technology-, composition-, and delivery-state-appropriate dataset, or disclose the unresolved background gap"
  disclosure: "Declare site, reporting period, part type, route, included unit operations, outsourced operations, upstream dataset choices, allocation, recycled-content and scrap treatment, direct-emission determination, exclusions, and any departures from this boundary"
