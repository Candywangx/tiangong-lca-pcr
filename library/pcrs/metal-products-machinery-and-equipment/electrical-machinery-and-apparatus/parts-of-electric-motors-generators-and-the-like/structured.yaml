allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared foreground operations"
    rule: "First subdivide lines, cells, meters, batches, and time records so the declared part receives its measured material, energy, waste, and emission exchanges."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "unavoidable shared operations"
    rule: "When subdivision is not possible, allocate by a documented causal physical driver such as machine time, processed mass, furnace charge, metered energy, or occupied capacity that reflects the operation."
    source_ids: []
  - rule_id: allocation_economic_fallback
    applies_to: "shared operations without a defensible physical driver"
    rule: "Use economic allocation only as a disclosed fallback, with reporting-period prices, sensitivity analysis, and an explanation of why subdivision and causal physical allocation were not feasible."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "metal scrap and recovered outputs"
    rule: "Record scrap at the measured waste boundary and its actual destination. Do not embed an avoided-burden credit in the foreground inventory; any recycling scenario belongs in a separately declared downstream model."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_records
      process_id: "part_manufacture"
      flow_role: "product material inputs and conforming output"
      record_type: "weighing, goods-receipt, batch issue, bill-of-material, and inventory records"
