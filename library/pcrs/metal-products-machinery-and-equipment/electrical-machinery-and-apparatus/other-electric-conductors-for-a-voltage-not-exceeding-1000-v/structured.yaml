allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all shared operations"
    rule: "Avoid allocation by submetering production lines, recording material issues and wastes by lot, and separating independently measurable processes."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "unavoidable shared energy, water, auxiliaries, and wastes"
    rule: "When subdivision is not possible, use a documented physical driver such as machine time, metered load, throughput, or material mass that reflects causality."
    source_ids: []
  - rule_id: allocation_mass_fallback
    applies_to: "shared site records without a demonstrable causal driver"
    rule: "Use net saleable product mass only as a disclosed fallback; report the allocation share, denominator, affected exchanges, and sensitivity."
    source_ids:
      - environdec-epd-ies-0024248-2025
  - rule_id: scrap_no_avoided_burden
    applies_to: "manufacturing scrap"
    rule: "Record scrap at the measured factory-gate waste boundary without an avoided-burden credit in the foreground process; any recycling benefit belongs to an explicitly linked downstream model."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "electric_conductor_manufacturing"
      flow_role: "each separately identified conductor, polymer, masterbatch, and drawing-emulsion input"
      record_type: "weigh-ticket, warehouse issue, batch recipe, purchase reconciliation"
      raw_fields: "material identity; lot; opening stock; receipts; issues; returns; closing stock; mass"
      collection_method: "reconcile mass issued to production against inventory movement and batch recipe"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all included production lines at the declared site"
      aggregation_rule: "sum net issues by atomic material and divide by net saleable output"
      quality_evidence: "calibrated-scale record; supplier specification; stock reconciliation; formulation revision"
    - protocol_id: cp_energy_water
      process_id: "electric_conductor_manufacturing"
      flow_role: "electricity and process-water make-up"
      record_type: "meter and utility record"
      raw_fields: "meter id; opening and closing readings; unit; line share; downtime; make-up-water reading"
      collection_method: "read dedicated meters or allocate shared meters using documented physical drivers"
      unit: "native meter unit and kg water"
      frequency: "continuous or shift; monthly reconciliation"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all included lines and support systems"
      aggregation_rule: "subtract opening from closing, remove documented non-production loads, allocate, and normalize"
      quality_evidence: "meter calibration; utility invoice reconciliation; allocation worksheet"
    - protocol_id: cp_fuel_and_emissions
      process_id: "electric_conductor_manufacturing"
      flow_role: "diesel input and direct fossil CO2"
      record_type: "fuel issue log, equipment-hour log, verified emissions record"
      raw_fields: "fuel identity; mass or volume; density; equipment; hours; lot; direct CO2"
      collection_method: "reconcile fuel issues and retain site emissions calculation or verified report where direct combustion applies"
      unit: "kg fuel and kg CO2"
      frequency: "each issue; monthly reconciliation"
      temporal_coverage: "same reporting period as product output"
      site_scope: "site-controlled combustion equipment only"
      aggregation_rule: "allocate by measured use or equipment hours; normalize to net saleable output"
      quality_evidence: "invoice; tank reconciliation; density record; emissions calculation and reviewer sign-off"
    - protocol_id: cp_packaging_inputs
      process_id: "electric_conductor_manufacturing"
      flow_role: "each packaging component"
      record_type: "packaging bill of materials and packing log"
      raw_fields: "component identity; mass per item; items used; reuse count; product mass shipped"
      collection_method: "weigh representative components and reconcile counts to shipment records"
      unit: "kg"
      frequency: "each packaging design; each revision"
      temporal_coverage: "packaging configurations used in reporting period"
      site_scope: "declared outgoing product packaging"
      aggregation_rule: "component mass times net consumption divided by packaged net product mass"
      quality_evidence: "scale record; bill of materials; packing record; reuse evidence"
    - protocol_id: cp_waste_outputs
      process_id: "electric_conductor_manufacturing"
      flow_role: "each segregated manufacturing waste"
      record_type: "waste scale ticket, container log, disposal manifest"
      raw_fields: "waste identity; gross and tare mass; destination; internal recycle quantity; lot or period"
      collection_method: "weigh each waste stream separately and reconcile storage changes and treatment manifests"
      unit: "kg"
      frequency: "each removal; monthly reconciliation"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all included production and maintenance areas"
      aggregation_rule: "outgoing waste plus closing minus opening storage, less verified same-process internal recycling; normalize"
      quality_evidence: "calibrated scale; manifest; recycler receipt; storage reconciliation"
    - protocol_id: cp_reference_output
      process_id: "electric_conductor_manufacturing"
      flow_role: "net saleable finished conductor"
      record_type: "finished-goods and quality-release record"
      raw_fields: "product code; voltage; construction; gross mass; separable packaging mass; length; linear mass; rejected mass; release status"
      collection_method: "use released finished-goods mass, subtract separable packaging, and reconcile length-to-mass conversion"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same reporting period as inputs"
      site_scope: "all included saleable output"
      aggregation_rule: "sum net released product mass; exclude rejects and separable packaging"
      quality_evidence: "release certificate; calibrated scale; length and linear-mass check"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "every foreground exchange"
      rule: "normalized exchange = attributable exchange amount / net saleable product mass"
