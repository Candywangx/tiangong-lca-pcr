        - "measured net kg/m"
      output: "kg net saleable product"
      source_ids: []
    - id: calc_packaging_reuse
      applies_to: "reusable pallet or drum"
      rule: "consumed packaging mass = component mass / verified expected uses; no reuse adjustment without traceable return evidence"
