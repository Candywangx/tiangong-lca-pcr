system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased conductor feedstock, insulation materials, auxiliaries, energy, water, and packaging enter the manufacturing site. It includes drawing, annealing, stranding, extrusion, conditional assembly and sheathing, marking, testing, internal transport, packing, process rejects, spent process media, and direct site emissions. It ends with tested saleable conductor and separated manufacturing wastes at the factory gate. Upstream supply, outbound distribution, installation, use losses, and end-of-life are represented by linked datasets or later lifecycle-model stages, not by this foreground process."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include all directly consumed materials, energy, water, auxiliaries, packing inputs, manufacturing wastes, and direct emissions from receipt of purchased inputs through tested saleable product at the factory gate."
      source_ids:
        - environdec-epd-ies-0024248-2025
    - rule_id: boundary_variant_disclosure
      applies_to: "product variants"
      rule: "Add each actual conductor metal, polymer, additive, screen, armour, sheath, connector, and packaging component as its own atomic exchange; do not use an umbrella material row."
      source_ids:
        - epd-norge-npcr-027-2022
    - rule_id: boundary_stage_exclusions
      applies_to: "downstream stages"
      rule: "Exclude distribution, installation, use, and end-of-life from the foreground process and disclose that these require separate scenarios when a cradle-to-grave model is built."
      source_ids:
        - epd-norge-npcr-027-2022
