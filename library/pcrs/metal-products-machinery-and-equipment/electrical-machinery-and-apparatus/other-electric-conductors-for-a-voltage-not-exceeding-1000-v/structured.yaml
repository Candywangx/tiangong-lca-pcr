validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Confirm rated voltage is not above 1000 V and the product is not winding wire, coaxial conductor, vehicle/aircraft/ship wiring set, above-1000 V conductor, or optical-fibre cable."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference
    applies_to: "reference flow"
    rule: "Confirm exactly 1 kg net saleable conductor output, separable packaging excluded, and every required qualifier disclosed."
    source_ids:
      - epd-norge-npcr-027-2022
  - rule_id: validate_atomic_rows
    applies_to: "inventory"
    rule: "Reject any row that combines multiple materials, utilities, fuels, packaging components, wastes, or emissions; require a separate concrete exchange and route condition."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "conductor metal and polymer"
    rule: "Require reconciled material balances and documented investigation of unexplained residuals; do not net scrap against purchased input."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "foreground process"
    rule: "Confirm all directly consumed manufacturing and packing exchanges, wastes, and direct site emissions are included, while upstream and downstream stages are represented separately."
    source_ids:
      - environdec-epd-ies-0024248-2025
  - rule_id: validate_uuid_status
    applies_to: "Tiangong references"
    rule: "Accept only public state-100 UUIDs whose identity, flow type, property, unit group, and product state match the row; keep unresolved rows explicit."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate foreground production dataset suitable for publication as a secondary_dataset or background_dataset after review"
  downstream_use: "Linked input to product, construction, electrical-equipment, or lifecycle models that separately add upstream supply and downstream distribution, installation, use losses, and end-of-life as required"
  allowed_use: "Comparison or modelling of conductors only when voltage, construction, materials, function, geography, period, boundary, and allocation are compatible"
  excluded_use: "Direct comparison across incompatible conductor functions or standards; use as a cradle-to-grave result; inference of service life or operational Joule losses; use for excluded conductor categories"
  required_metadata: "PCR id and version; product code and standard; voltage; conductor construction; material composition; net linear mass; site and geography; reporting period; technology; boundary; allocation; recycled content; packaging; data sources; unresolved UUIDs"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; allocation share and drivers; material-balance residuals; proxy list; temporal, geographic, and technological representativeness; uncertainty and completeness review"
  update_trigger: "Change in conductor design or formulation, voltage or product standard, production route or equipment, site or energy mix, supplier or recycled content, packaging, waste treatment, allocation, or a material change in normalized inventory"
