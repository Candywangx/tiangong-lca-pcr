measurement_rules:
  - id: reference_mass
    applies_to: "Reference cable output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net saleable cable mass without dispatch packaging and normalize all inventory rows to 1 kg; retain cable length and fibre count so cable-kilometres and fibre-kilometres can be reconstructed."
  - id: packaging_separation
    applies_to: "Wooden drum, steel band, and protective film"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure each dispatch-packaging component separately and do not include its mass in the 1 kg reference cable output."
  - id: electricity_conversion
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the meter reading in kWh and convert to MJ using 1 kWh = 3.6 MJ; do not add upstream grid emissions as foreground elementary exchanges."
  - id: material_net_consumption
    applies_to: "Cable materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Calculate consumed mass as opening stock plus receipts minus closing stock minus returned material; separately measured internal regrind remains inside the foreground boundary and is not counted again as a new input."
  - id: waste_route_measurement
    applies_to: "Manufacturing scrap"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each chemically or physically distinct waste at the point it leaves the foreground boundary and disclose moisture, contamination, and contracted treatment route."
