allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Foreground operations"
    rule: "Avoid allocation by using product-specific bills of material, cable-line production records, dedicated meters, and separately weighed waste wherever available."
    source_ids:
      - cablescom-optical-fibre-duct-cable-epd-2022
  - rule_id: allocation_shared_inputs
    applies_to: "Shared energy, auxiliary materials, packaging, and waste"
    rule: "When physical subdivision is not feasible, allocate shared quantities by net saleable cable mass produced during the same reporting period; disclose the products, quantities, and allocation shares."
    source_ids:
      - cablescom-optical-fibre-duct-cable-epd-2022
  - rule_id: allocation_internal_recycling
    applies_to: "Internal regrind and rework"
    rule: "Keep material internally reprocessed into the same reporting period inside the foreground boundary; count only net purchased input and waste leaving the boundary, and prevent double counting."
    source_ids: []
  - rule_id: allocation_recycling_outputs
    applies_to: "Scrap sent for recycling or recovery"
    rule: "Apply the polluter-pays principle at the foreground boundary and do not claim avoided production unless a downstream model explicitly applies a documented recycling method."
    source_ids:
      - cablescom-optical-fibre-duct-cable-epd-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "cable_manufacturing_and_packaging"
      flow_role: "Each cable material input"
      record_type: "ERP issue and return records, purchase receipts, stock counts, bill of materials"
      raw_fields: "material identity; supplier; grade; opening stock; receipts; closing stock; returns; internal regrind; cable product code"
      collection_method: "Reconcile stock balance to cable-line issue records and approved bill of materials"
      unit: "kg"
      frequency: "Per batch with monthly reconciliation"
      temporal_coverage: "Representative continuous twelve-month period or justified campaign"
      site_scope: "Each included factory and cable line"
      aggregation_rule: "Net consumption by material and product code, then allocate only shared residues under Section 7"
      quality_evidence: "Purchase documents, supplier specifications, stock reconciliation, and approved bill of materials"
    - protocol_id: cp_electricity
      process_id: "cable_manufacturing_and_packaging"
      flow_role: "Purchased electricity"
      record_type: "Utility invoices and calibrated submeter readings"
      raw_fields: "meter id; opening and closing reading; kWh; voltage; supplier; grid product; line hours; reporting period"
      collection_method: "Prefer dedicated cable-line meters; reconcile submeters to site invoice and allocate documented shared loads"
      unit: "kWh"
      frequency: "Continuous or batch-level, reconciled monthly"
      temporal_coverage: "Same period as output records"
      site_scope: "Each included factory and cable line"
      aggregation_rule: "Convert kWh to MJ and divide by allocated saleable cable mass"
      quality_evidence: "Invoice, meter calibration or verification, reconciliation, and allocation worksheet"
    - protocol_id: cp_packaging_mass
      process_id: "cable_manufacturing_and_packaging"
      flow_role: "Each dispatch-packaging component"
      record_type: "Packing list, packaging issue record, and scale record"
      raw_fields: "component identity; material; supplier; reused status; gross mass; tare mass; shipment; cable product code"
      collection_method: "Weigh each component or use verified supplier mass per item multiplied by dispatched count"
      unit: "kg"
      frequency: "Per shipment"
      temporal_coverage: "Same period as output records"
      site_scope: "Each included factory"
      aggregation_rule: "Sum each component separately and divide by associated saleable cable mass"
      quality_evidence: "Packing list, scale record or supplier specification, and reuse-cycle evidence"
    - protocol_id: cp_output_mass
      process_id: "cable_manufacturing_and_packaging"
      flow_role: "Tested saleable cable output"
      record_type: "Production counter, length meter, scale, and final-test record"
      raw_fields: "product code; batch; cable length; cable net mass; fibre count; test disposition; drum tare; packaging mass"
      collection_method: "Weigh net cable or subtract verified packaging tare from gross mass; reconcile length and mass to accepted test disposition"
      unit: "kg, m, fibre-km"
      frequency: "Per finished drum or batch"
      temporal_coverage: "Same period as input records"
      site_scope: "Each included factory and cable line"
      aggregation_rule: "Sum accepted net cable mass; exclude rejected output and dispatch packaging"
