validation_rules:
  - rule_id: validate_reference
    applies_to: "Reference flow"
    rule: "Confirm that cable net mass equals the declared reference amount after normalization and that packaging mass is excluded; cable length and fibre-kilometres must be disclosed."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "Product identity"
    rule: "Confirm the product contains individually sheathed optical fibres; reject bare fibre, non-individually-sheathed fibre bundles or cables, and electric-only cable from this PCR."
    source_ids:
      - un-cpc-3-0-2025
      - unsd-industrial-commodity-statistics-yearbook-2014
  - rule_id: validate_variants
    applies_to: "Conditional construction"
    rule: "Require explicit applicable or not-applicable decisions for water-blocking yarn, aramid reinforcement, incorporated conductor, and fitted connector based on the product bill of materials."
    source_ids:
      - unsd-industrial-commodity-statistics-yearbook-2014
      - cablescom-optical-fibre-duct-cable-epd-2022
  - rule_id: validate_atomicity
    applies_to: "Inventory rows"
    rule: "Reject combined utilities, materials, packaging, waste, or emissions; every exchange must retain one flow identity, direction, property, unit, and treatment or compartment where applicable."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Foreground inventory"
    rule: "Require documented reconciliation of material inputs to cable output, waste, stock change, retained samples, internal regrind, and measurement uncertainty; investigate and disclose unexplained imbalance."
    source_ids: []
  - rule_id: validate_electricity
    applies_to: "Electricity"
    rule: "Reconcile line and allocated support electricity to the site controlling meter and verify the kWh-to-MJ conversion."
    source_ids: []
  - rule_id: validate_sources
    applies_to: "Quantitative ranges"
    rule: "Reject external empirical ranges unless at least two independent original sources are verified and shown boundary-compatible; absence of an accepted range does not replace foreground collection."
    source_ids: []
  - rule_id: validate_uuid
    applies_to: "UUID-bearing rows"
    rule: "Confirm public state_code 100, English and Chinese base names, flow type, classification, property, unit group, product state, and general comment; fail any proxy or unverified UUID."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset generated from reviewed foreground records"
  downstream_use: "Construction of product-flow, process, and lifecyclemodel datasets for individually sheathed-fibre optical cable manufacture"
  allowed_use: "Cradle-to-gate cable production modelling for the declared construction, factory, reporting period, and geography; comparison only after aligning reference mass, cable length, fibre-kilometres, performance, boundary, and data quality"
  excluded_use: "Bare optical fibre production; non-individually-sheathed optical bundles or cables; electric-only cable; installation, network operation, maintenance, removal, or end-of-life without additional rules and data"
  required_metadata: "PCR id and status; product code and specification; cable construction; fibre type and count; length and fibre-kilometres per kg; sheath, water-blocking, reinforcement, armour, conductor, and connector state; factory and supplier geography; technology; period; allocation; packaging; cut-offs; UUID status"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; temporal, geographical, and technological representativeness; supplier-data quality; mass-balance result; allocation shares; internal recycling; waste routes; unresolved UUIDs and range evidence needs"
  update_trigger: "Material change in cable construction, compound or supplier, recycled content, fibre count or type, conductor or connector state, production line, energy supply, packaging, allocation, waste route, factory, or reporting period"
