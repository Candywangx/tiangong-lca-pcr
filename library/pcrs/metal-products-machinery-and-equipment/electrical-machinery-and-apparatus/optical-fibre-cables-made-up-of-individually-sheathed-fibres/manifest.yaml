      - row_id: pbt_granules
        reason_code: no_exact_candidate
        explanation: "The ranked public state-100 candidates were mineral products and did not identify polybutylene terephthalate in primary form."
      - row_id: water_blocking_polyester_yarn
        reason_code: semantic_mismatch
        explanation: "Polyester filament candidates did not establish the water-blocking treatment required for this cable-component flow."
      - row_id: aramid_yarn
        reason_code: product_state_mismatch
        explanation: "The only state-100 aramid candidate was classified as tyre-cord fabric and did not establish yarn supplied for optical-cable reinforcement."
      - row_id: insulated_copper_conductor
        reason_code: product_state_mismatch
        explanation: "Candidates were uninsulated copper intermediates, winding wire, or a control cable with an incompatible energy property; none matched the mass-based insulated conductor input."
      - row_id: cable_marking_ink
        reason_code: no_exact_candidate
        explanation: "The ranked candidates were cables, a cable tie, and a cable-protection component rather than marking ink."
      - row_id: plastic_coated_paperboard_film
        reason_code: semantic_mismatch
        explanation: "Generic plastic film and composite-paper candidates did not establish the plastic-coated paperboard construction of the protective packaging film."
      - row_id: waste_pbt
        reason_code: semantic_mismatch
        explanation: "The ranked waste candidates identified PET waste, PET bottles, or waste tyres rather than polybutylene terephthalate production scrap."
      - row_id: waste_optical_fibre
        reason_code: no_exact_candidate
        explanation: "The only ranked waste candidate was waste PET bottles and did not identify silica optical-fibre offcuts."
