        reason_code: no_exact_candidate
        explanation: "Five ranked public state-100 candidates were generic cable, coaxial cable, high-voltage cable, or an inter-array cable system; none exactly identified CPC 46360 optical fibre cable."
      - row_id: optical_fibre
        reason_code: no_exact_candidate
