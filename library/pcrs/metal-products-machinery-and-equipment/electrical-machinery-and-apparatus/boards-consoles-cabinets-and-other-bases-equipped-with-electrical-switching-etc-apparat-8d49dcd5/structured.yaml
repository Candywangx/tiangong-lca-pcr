system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground manufacturing boundary begins when purchased materials, fabricated parts and apparatus are received at the assembly site and ends with the complete tested assembly and its delivery packaging at the declared dispatch gate. Upstream production of purchased inputs is linked through separate datasets. Distribution, installation, operation, maintenance and end-of-life are separate scenario modules unless the study explicitly brings them into scope."
      source_ids: []
    - rule_id: boundary_complete_assembly
      applies_to: "product identity"
      rule: "Include the enclosure or equipped base, busbars, installed switching/protection/control apparatus, internal wiring, auxiliaries, mandatory accessories, factory testing and separately quantified delivery packaging that form the declared delivered assembly."
      source_ids:
        - iec-61439-1-2020
        - iec-61439-2-2020
        - pep-psr-0005-ed3-1
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include site-controlled fabrication, finishing, assembly, wiring, programming, inspection, testing, rework, waste handling and packaging through the dispatch gate; disclose which fabrication steps are purchased rather than site-controlled."
      source_ids:
        - pep-psr-0005-ed3-1
        - abb-enviline-ess750-epd-2023
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link purchased enclosure parts, busbars, devices, electronics, cables, auxiliaries, coatings and packaging to geographically and technologically appropriate upstream datasets; do not replace them with an unqualified whole-category proxy."
      source_ids:
        - pep-psr-0005-ed3-1
    - rule_id: boundary_downstream_scenarios
      applies_to: "life-cycle extensions"
      rule: "Keep distribution, installation, operation, maintenance, replacements and end-of-life outside the factory-gate foreground result unless explicitly included; when included, report each module separately with product-specific scenarios."
      source_ids:
        - pep-psr-0005-ed3-1
        - abb-enviline-ess750-epd-2023
    - rule_id: boundary_category_exclusions
      applies_to: "category applicability"
      rule: "Reject empty enclosures, single apparatus and assemblies above the CPC voltage ceiling; a residential distribution board may represent only its declared subtype, not the entire category."
      source_ids:
        - un-cpc-v3-46213
        - iec-62208-2023
        - iec-61439-3-2024
