allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all foreground processes"
    rule: "Subdivide fabrication, assembly, testing and packaging by line, batch or model before allocating shared burdens."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: allocation_physical_driver
    applies_to: "shared energy, consumables and waste"
    rule: "Use direct metering, machine time, tested-unit count, processed material mass or another documented causal physical driver; use product mass only when it represents the causal relationship."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: allocation_economic_exception
    applies_to: "residual shared burdens"
    rule: "Economic allocation is not a default; use it only when subdivision and causal physical allocation are infeasible, and disclose the values, period, sensitivity and reason."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: allocation_recycling_separation
    applies_to: "scrap, recycling and recovery"
    rule: "Record waste destinations and any recycling or recovery model separately; do not subtract anticipated recycling benefits from virgin or recycled input quantities and do not double count recovered-material credits."
    source_ids:
      - pep-psr-0005-ed3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_materials
      process_id: "fabrication_finishing"
      flow_role: "fabrication materials and accepted parts"
      record_type: "fabrication BOM and purchasing/stores record"
      raw_fields: "model; part number; supplier; material/grade; quantity; unit mass; input mass; accepted-part mass; enclosure mass; busbar mass; recycled-content claim"
      collection_method: "Reconcile controlled fabrication BOM, drawings, scales and supplier declarations to the accepted batch."
      unit: "kg, item"
      frequency: "each model/revision and representative fabrication batch"
      temporal_coverage: "declared production period"
      site_scope: "each reporting site and outsourced fabricator"
      aggregation_rule: "Sum input and accepted mass by material and grade; keep enclosure and busbar materials separate."
      quality_evidence: "approved fabrication BOM; weighing record; supplier declaration"
    - protocol_id: cp_assembly_bom
      process_id: "assembly_testing"
      flow_role: "installed BOM"
      record_type: "as-built BOM and component record"
      raw_fields: "model; part number; supplier; function; material; quantity; unit mass; installed mass; enclosure mass; busbar mass; device/electronics mass"
      collection_method: "Reconcile controlled BOM, drawings, part weights and scale records to the as-built unit."
      unit: "kg, item"
      frequency: "each model/revision and representative production lot"
      temporal_coverage: "declared production period"
      site_scope: "each reporting assembly site"
      aggregation_rule: "Sum installed mass by material and functional group; keep enclosure, busbars, devices, electronics, wires, cooling and accessories separate."
      quality_evidence: "approved BOM revision; weighing record; supplier declaration"
    - protocol_id: cp_fabrication_energy
      process_id: "fabrication_finishing"
      flow_role: "fabrication energy"
      record_type: "meter, submeter, equipment log or invoice"
      raw_fields: "meter boundary; start/end reading; energy carrier; fabrication activity; operating time; model; lot; accepted output mass; allocation driver"
      collection_method: "Prefer process submetering; reconcile with site invoices and fabrication records."
      unit: "kWh or carrier-specific unit"
      frequency: "each lot or no less frequently than the available meter/invoice period"
      temporal_coverage: "representative declared fabrication period"
      site_scope: "each reporting fabrication site"
      aggregation_rule: "Subtract unrelated loads and allocate remaining use to accepted fabricated-part output with the rule in section 7."
      quality_evidence: "meter calibration/status; invoice reconciliation; production log"
    - protocol_id: cp_assembly_energy
      process_id: "assembly_testing"
      flow_role: "assembly and testing energy"
      record_type: "meter, submeter, equipment log or invoice"
      raw_fields: "meter boundary; start/end reading; energy carrier; assembly/test activity; operating time; model; lot; tested output mass; allocation driver"
      collection_method: "Prefer process submetering; reconcile with site invoices and assembly/test records."
      unit: "kWh or carrier-specific unit"
      frequency: "each lot or no less frequently than the available meter/invoice period"
      temporal_coverage: "representative declared assembly period"
      site_scope: "each reporting assembly site"
      aggregation_rule: "Subtract unrelated loads and allocate remaining use to complete tested output with the rule in section 7."
      quality_evidence: "meter calibration/status; invoice reconciliation; production log"
    - protocol_id: cp_fabrication_waste
      process_id: "fabrication_finishing"
      flow_role: "fabrication waste"
      record_type: "scale ticket and waste transfer record"
      raw_fields: "fabrication activity; material; hazard class; gross/tare/net mass; destination; treatment; date; lot"
      collection_method: "Reconcile fabrication waste logs with transporter or treatment records."
      unit: "kg"
      frequency: "each shipment and fabrication period"
      temporal_coverage: "same period as fabrication inventory"
      site_scope: "each reporting fabrication site"
      aggregation_rule: "Sum by material and actual treatment destination; do not net against inputs."
      quality_evidence: "scale ticket; transfer note; treatment evidence"
    - protocol_id: cp_assembly_waste
      process_id: "assembly_testing"
      flow_role: "assembly and testing waste"
      record_type: "scale ticket and waste transfer record"
      raw_fields: "assembly/test activity; material; hazard class; gross/tare/net mass; destination; treatment; date; lot"
      collection_method: "Reconcile assembly/test waste logs with transporter or treatment records."
      unit: "kg"
      frequency: "each shipment and assembly period"
      temporal_coverage: "same period as assembly inventory"
      site_scope: "each reporting assembly site"
      aggregation_rule: "Sum by material and actual treatment destination; do not net against inputs."
      quality_evidence: "scale ticket; transfer note; treatment evidence"
    - protocol_id: cp_direct_releases
      process_id: "fabrication_finishing"
      flow_role: "direct air and water releases"
      record_type: "stack/wastewater measurement or material-balance record"
      raw_fields: "substance; compartment; measurement boundary; concentration; volume or mass; batch; method; date"
      collection_method: "Use site measurement where available; otherwise use a documented input-output material balance without converting waste transfers into emissions."
      unit: "kg"
      frequency: "each monitored period or fabrication batch"
      temporal_coverage: "same period as fabrication inventory"
      site_scope: "each reporting finishing site"
      aggregation_rule: "Sum each substance and compartment separately and normalize to accepted fabricated-part output."
      quality_evidence: "laboratory or meter record; calculation and balance closure"
    - protocol_id: cp_configuration_test
      process_id: "assembly_testing"
      flow_role: "ratings, configuration and tested assembly"
      record_type: "approved design, nameplate and test record"
      raw_fields: "model; serial/lot; AC/DC; rated voltage/current; circuit ratings; short-circuit ratings; IP; enclosure/busbar materials; protection/control list; cooling; auxiliary power; dimensions; net mass; test basis/result"
      collection_method: "Extract from controlled engineering and factory-test records and reconcile to the shipped configuration."
      unit: "declared engineering units and kg"
      frequency: "each model/revision and tested lot"
      temporal_coverage: "current declared model and production period"
      site_scope: "each reporting site"
      aggregation_rule: "Do not average unlike configurations unless the product mix and weighting are reported."
      quality_evidence: "approved drawing; nameplate; design verification; routine/factory test record"
    - protocol_id: cp_packaging
      process_id: "packaging_dispatch"
      flow_role: "delivery packaging and accessories"
      record_type: "packing specification and weighing record"
      raw_fields: "packaging material; quantity; mass; reusable status; accessory identity/mass; destination"
      collection_method: "Weigh or calculate from controlled packing specifications and verify against shipments."
      unit: "kg per assembly"
      frequency: "each packing design/revision and representative shipment"
      temporal_coverage: "declared shipping period"
      site_scope: "each dispatch site"
      aggregation_rule: "Sum by packaging material; keep packaging and separately delivered accessories distinct from net product mass."
      quality_evidence: "packing list; scale record; packaging specification"
    - protocol_id: cp_mass_reconciliation
      process_id: "packaging_dispatch"
      flow_role: "mass balance and reference output"
      record_type: "BOM, scale and transfer record"
      raw_fields: "installed material mass; net tested mass; accessory mass; packaging mass; rework/reject mass; delivered mass"
      collection_method: "Reconcile as-built BOM and process transfers to calibrated scale records."
      unit: "kg"
      frequency: "each model/revision and representative lot"
      temporal_coverage: "same period as BOM and production data"
      site_scope: "each reporting site"
      aggregation_rule: "Explain all residual differences; do not force an unexplained residual into an unspecified material."
      quality_evidence: "signed reconciliation; calibration evidence; variance investigation"
    - protocol_id: cp_use_scenario
      process_id: "use_operation"
      flow_role: "use losses, auxiliaries, cooling, life and replacements"
      record_type: "type/routine test, engineering calculation, operating profile and maintenance record"
      raw_fields: "load points; current; voltage; power loss; auxiliary/cooling power; hours by load; ambient condition; service life; maintenance; replacement type/count; grid geography"
      collection_method: "Use applicable-standard measurement, laboratory report, engineering calculation or manufacturer data and document the chosen scenario."
      unit: "W, kWh, h, year, item, kg"
      frequency: "each declared use scenario and model revision"
      temporal_coverage: "declared service life"
      site_scope: "declared application and geography"
      aggregation_rule: "Integrate losses and auxiliary/cooling demand over declared hours; keep replacement inventory explicit."
      quality_evidence: "test/calculation report; scenario justification; maintenance plan"
  calculation_rules:
    - id: calc_reference_scaling
      applies_to: "reference product"
      rule: "reference result per assembly = result per kg × net kg per delivered assembly"
      inputs:
        - "1 kg reference result"
        - "measured net assembly mass"
      output: "result per delivered assembly"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "complete assembly"
      rule: "net assembly mass = sum of installed enclosure/base, busbars, apparatus, electronics, wiring, auxiliaries, cooling, fasteners and mandatory accessory masses; investigate and disclose any residual"
      inputs:
        - "as-built BOM"
        - "part weights"
        - "measured net mass"
      output: "reconciled material inventory and residual disclosure"
      source_ids:
        - pep-psr-0005-ed3-1
    - id: calc_factory_energy_intensity
      applies_to: "fabrication and assembly/testing"
      rule: "allocated process energy per kg = process energy assigned to the declared model or lot ÷ accepted kg output"
      inputs:
        - "energy record"
        - "production record"
        - "allocation driver"
      output: "kWh per kg process output"
      source_ids:
        - pep-psr-0005-ed3-1
    - id: calc_waste_intensity
      applies_to: "production waste"
      rule: "waste per kg = waste mass attributed to the declared process/model ÷ accepted kg process output"
      inputs:
        - "waste records"
        - "accepted output mass"
      output: "kg waste per kg output by type and destination"
      source_ids: []
    - id: calc_use_energy
      applies_to: "optional use stage"
      rule: "use energy = sum over declared load states of measured or calculated assembly loss × hours + auxiliary/control power × hours + active-cooling power × hours; add explicit replacement inventories"
      inputs:
        - "loss data"
        - "auxiliary/cooling demand"
        - "load/time profile"
        - life
        - replacements
      output: "kWh and replacement inventory per declared assembly life"
      source_ids:
        - pep-psr-0005-ed3-1
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "product identity"
      requirement: "Data must describe one declared model/configuration or a transparent production mix; all electrical, enclosure, busbar, protection/control, IP, cooling and delivery qualifiers must match it."
      evidence: "controlled design, BOM, nameplate and test records"
    - id: dq_mass_completeness
      applies_to: "material inventory"
      requirement: "Reconcile installed material groups to measured net assembly mass and disclose the value and cause of every unresolved residual."
      evidence: "signed mass reconciliation and variance investigation"
    - id: dq_temporal_site
      applies_to: "foreground data"
      requirement: "Use a declared representative production period and identify every assembly, fabrication and dispatch site; disclose exceptional downtime, rework or product-mix effects."
      evidence: "dated meters, invoices, production and shipment records"
    - id: dq_upstream_match
      applies_to: "purchased inputs"
      requirement: "Match upstream data to material/apparatus identity, geography, technology and time; disclose every proxy and why it is the closest available choice."
      evidence: "supplier evidence, dataset metadata and proxy register"
    - id: dq_use_scenario
      applies_to: "optional use stage"
      requirement: "Tie losses, auxiliary/cooling demand, load profile, service life, maintenance and replacements to the declared configuration; do not substitute a product-specific published scenario as a category default."
      evidence: "test/calculation report and scenario justification"
    - id: dq_source_traceability
      applies_to: "all calculated values"
      requirement: "Preserve source record identifiers, transformations, allocation drivers, units and reviewer-reproducible calculations."
      evidence: "calculation workbook or controlled data pipeline with lineage"
validation_rules:
  - rule_id: validate_identity_voltage
    applies_to: "product identity"
    rule: "Confirm the dataset is a complete equipped assembly in CPC 46213 and its declared rated voltage does not exceed 1,000 V; reject an empty enclosure, individual apparatus, part or higher-voltage assembly."
    source_ids:
      - un-cpc-v3-46213
      - iec-62208-2023
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm product flow 961bc3fa-a52f-47fe-afc0-0abac92f5fd1, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 and kg, without embedding dataset versions."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow"
    rule: "Confirm every required qualifier is present and consistent with the controlled design, nameplate, BOM and test record."
    source_ids:
      - iec-61439-1-2020
      - iec-61439-2-2020
  - rule_id: validate_mass_balance
    applies_to: "material inventory"
    rule: "Confirm installed material groups reconcile to measured net product mass; flag and disclose every unexplained residual rather than inserting an unspecified default."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: validate_process_boundary
    applies_to: "foreground processes"
    rule: "Confirm all site-controlled fabrication, assembly, testing, rework, waste handling and packaging are included and purchased processes are disclosed and linked upstream."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: validate_energy_allocation
    applies_to: "factory energy"
    rule: "Confirm meter/invoice reconciliation, excluded unrelated loads and the documented physical allocation driver for the declared model and period."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: validate_waste_destinations
    applies_to: "waste"
    rule: "Confirm production waste mass, type and actual destination are recorded without netting recycling credits from inputs."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: validate_use_scenario
    applies_to: "optional use stage"
    rule: "When use is reported, confirm losses, auxiliary/control and cooling energy, load/time profile, service life, maintenance, replacements and grid geography are configuration-specific and separately disclosed."
    source_ids:
      - pep-psr-0005-ed3-1
  - rule_id: validate_no_proxy_extrapolation
    applies_to: "representativeness"
    rule: "Reject a claim that an empty cabinet, one switching device, one residential distribution board or one photovoltaic/energy-storage model represents the full category without a declared and weighted product mix."
    source_ids:
      - iec-62208-2023
      - iec-61439-3-2024
      - abb-enviline-ess750-epd-2023
  - rule_id: validate_source_lineage
    applies_to: "all reported values"
    rule: "Confirm every foreground value and calculation is linked to its collection record, unit, period, site and transformation; sources support rules only and are not used as unreviewed default quantities."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset"
  allowed_use: "Configuration-specific factory-gate datasets for complete CPC 46213 assemblies, and explicitly separated distribution, installation, use, maintenance and end-of-life scenario extensions."
  excluded_use: "Empty enclosures; individual devices or parts; assemblies above 1,000 V; unqualified category-average claims; extrapolation of one residential, photovoltaic or energy-storage assembly to the whole category."
  required_metadata: "PCR id; CPC code; reference-flow UUIDs; model and application; AC/DC; rated voltage/current and short-circuit ratings; configuration; enclosure and busbar materials; protection/control functions; IP; cooling and auxiliary power; net mass; packaging/delivery boundary; service life; geography; technology; period; sites; allocation; scenario modules."
  required_quality_disclosure: "BOM and mass reconciliation; foreground metering and allocation; waste destinations; upstream dataset matches and proxies; factory-test basis; product-mix weighting; optional use/lifetime/replacement assumptions; data gaps and reviewer-reproducible lineage."
  update_trigger: "Design or BOM revision; changed ratings, enclosure/busbar material, device/control configuration, IP or cooling; changed production route/site/energy mix; changed packaging/delivery boundary; changed service-life or use scenario; materially improved supplier or foreground evidence."
