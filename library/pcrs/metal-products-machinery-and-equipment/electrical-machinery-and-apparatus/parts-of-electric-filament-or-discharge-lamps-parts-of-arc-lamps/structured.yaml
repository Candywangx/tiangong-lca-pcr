validation_rules:
  - rule_id: validate_identity_and_qualifiers
    applies_to: "Reference flow"
    rule: "Fail validation when the part family, material or composition, drawing or part number, finished state, lamp compatibility, production geography, technology, reference year, or packing configuration is missing."
    source_ids:
      - eu-cn-explanatory-notes-2000-8539
  - rule_id: validate_reference_mass
    applies_to: "Reference flow and inventory"
    rule: "Confirm that the reference output is exactly 1 kg net conforming product and that every exchange is normalized to that mass without including sale packaging in the product mass."
    source_ids: []
  - rule_id: validate_atomicity
    applies_to: "Process inventory"
    rule: "Confirm that every row represents one concrete product, waste, or elementary exchange; reject combined utilities, generic materials or wastes, and selector labels."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm state-100 Tiangong flow type, base name, classification, property, unit group, product state, geography, technology, and general comment; do not replace unresolved rows with proxies."
    source_ids: []
  - rule_id: validate_material_balance
    applies_to: "Material routes"
    rule: "Reconcile each declared glass or metal input to conforming product, stock change, verified internal return, and each material-specific exported waste; investigate unexplained differences."
    source_ids: []
  - rule_id: validate_energy_and_emissions
    applies_to: "Energy and direct releases"
    rule: "Reconcile electricity and each gas to meters or invoices; when on-site natural gas is used, reconcile direct fossil carbon dioxide to fuel records and document any other direct releases as separate atomic flows."
    source_ids: []
  - rule_id: validate_conditional_rows
    applies_to: "Route-specific inputs and outputs"
    rule: "Require evidence for every not-applicable decision and ensure the chosen rows match the declared part material and manufacturing technology without constructing a variant-by-route Cartesian inventory."
    source_ids: []
  - rule_id: validate_source_and_period
    applies_to: "Dataset evidence"
    rule: "Confirm that source references resolve, foreground records cover the declared period and site, and no external empirical range is asserted without two independent, boundary-compatible sources verified in original text."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground gate-to-gate production dataset with linked upstream inputs"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-specific cradle-to-gate modelling of a declared CPC 46541 lamp part when required qualifiers, boundary, technology, geography, and reference year are compatible"
  excluded_use: "Complete lamps, luminaires, LED products, portable-lamp parts, unspecified mixed lamp parts, use-phase performance, end-of-life, or substitution among glass and metal part families without a new foreground inventory"
  required_metadata: "PCR id and version; part family; drawing or part number; material and composition; finished state; compatible lamp technology; functional and quality specification; production route; facility geography; technology; reference period; net mass basis; packaging; upstream dataset identifiers; allocation; internal recycling; data owner and review date"
  required_quality_disclosure: "Metering and weighing coverage; count-to-mass sampling; record coverage; allocation drivers; mass-balance result; conditional-row decisions; unresolved UUIDs; dataset substitutions; cut-offs; abnormal periods; uncertainty; verification status"
  update_trigger: "Change in part design or material; process technology; energy or gas supply; cleaning chemistry; scrap or wastewater route; packaging; facility geography; allocation driver; supplier dataset; reference period; Tiangong UUID resolution; or evidence that materially changes the inventory"
