allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared foreground operations"
    rule: "Subdivide and meter product-specific operations and material losses wherever practicable before applying allocation."
    source_ids: []
  - rule_id: allocation_physical_causality
    applies_to: "Multiple conforming lamp parts from one line"
    rule: "Allocate shared inputs and releases using a measured physical relationship that reflects causality, such as machine time, furnace occupancy, treated surface area, or processed mass; document the selected driver and reconciliation."
    source_ids: []
  - rule_id: allocation_mass_fallback
    applies_to: "Shared burdens without a defensible causal driver"
    rule: "Use net conforming output mass only as a documented fallback; do not allocate by item count when part masses differ materially."
    source_ids: []
  - rule_id: allocation_recycling_consistency
    applies_to: "Scrap and internal returns"
    rule: "Exclude verified internal recycling loops from boundary outputs and avoid double counting any recycling credit, recycled-content claim, or waste-treatment burden applied by the selected LCA method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "lamp_part_manufacturing"
      flow_role: "Material inputs, packaging, material-specific scrap"
      record_type: "Purchase, issue, inventory, weighbridge, production, and waste-transfer records"
      raw_fields: "material identity; grade; supplier; opening stock; receipts; issues; closing stock; internal returns; exported scrap; package mass; lot; date"
      collection_method: "Reconcile calibrated scales and inventory transactions to each production lot"
      unit: "kg"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "At least 12 representative months or the full production campaign if shorter"
      site_scope: "All foreground operations and storage under reporting-facility control"
      aggregation_rule: "Net consumption = opening stock + receipts - closing stock - documented transfers; normalize allocated net consumption and exported waste by conforming output mass"
      quality_evidence: "Calibration records; stock reconciliation; bill of materials; weigh tickets; waste transfer notes; variance investigation"
    - protocol_id: cp_energy_and_gas_records
      process_id: "lamp_part_manufacturing"
      flow_role: "Electricity, natural gas, industrial oxygen"
      record_type: "Submeter, utility invoice, tank or cylinder issue, and operating-hour records"
      raw_fields: "meter id; opening and closing readings; volume correction conditions; invoice period; equipment; product lot; downtime"
      collection_method: "Use dedicated meters where available; otherwise allocate shared consumption with a documented causal driver"
      unit: "MJ; m3"
      frequency: "Each lot or meter interval, aggregated monthly"
      temporal_coverage: "At least 12 representative months or the full campaign if shorter"
      site_scope: "All route-applicable foreground equipment"
      aggregation_rule: "Subtract non-production use, reconcile to invoices, apply the approved allocation driver, and normalize by conforming output mass"
      quality_evidence: "Meter calibration; invoice reconciliation; operating log; temperature and pressure correction record"
    - protocol_id: cp_water_and_chemical_records
      process_id: "lamp_part_manufacturing"
      flow_role: "Process water, sodium hydroxide, waste alkaline liquor"
      record_type: "Water meter, batch recipe, chemical issue, solution analysis, and waste-transfer records"
      raw_fields: "water reading; solution mass; sodium-hydroxide concentration; make-up; purge; pH; contaminant result; destination; lot; date"
      collection_method: "Meter water and weigh or meter chemical solutions; sample spent liquor when composition affects treatment"
      unit: "kg"
      frequency: "Each batch or discharge, aggregated monthly"
      temporal_coverage: "At least 12 representative months or the full campaign if shorter"
      site_scope: "Wet-cleaning and surface-treatment operations under facility control"
      aggregation_rule: "Convert supplied solution to active sodium-hydroxide mass; reconcile make-up, carryover, purge, and exported liquor; normalize by conforming output mass"
      quality_evidence: "Meter and scale calibration; concentration certificate or analysis; pH record; manifest; mass-balance check"
    - protocol_id: cp_conforming_output_records
      process_id: "lamp_part_manufacturing"
      flow_role: "Reference product"
      record_type: "Production, inspection, rejection, and net-mass records"
      raw_fields: "part number; part family; lot; produced count; accepted count; rejected count; sampled net masses; acceptance result"
      collection_method: "Weigh representative conforming parts and reconcile accepted count to net lot mass"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Full reporting period"
      site_scope: "Final inspection and dispatch point"
      aggregation_rule: "Conforming mass = accepted count multiplied by verified lot-average net mass, or direct lot mass; normalize all exchanges to 1 kg"
      quality_evidence: "Calibrated-scale record; sampling plan; inspection release; production reconciliation"
    - protocol_id: cp_direct_emission_records
      process_id: "lamp_part_manufacturing"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Stack measurement, fuel meter, supplier gas analysis, or documented site calculation"
      raw_fields: "emission result; fuel volume; temperature; pressure; composition; fossil carbon fraction; oxidation assumption; equipment; lot or period"
      collection_method: "Prefer representative direct measurement; otherwise calculate from collected fuel and documented site-specific composition and assumptions"
      unit: "kg"
      frequency: "Monitoring interval or fuel billing period, aggregated monthly"
      temporal_coverage: "Same period as fuel inventory"
      site_scope: "All on-site natural-gas combustion attributable to the declared product"
      aggregation_rule: "Reconcile calculated or measured fossil carbon dioxide to natural-gas consumption and normalize by conforming output mass"
      quality_evidence: "Monitoring QA; analyzer calibration; supplier composition; calculation workbook; independent mass-balance review"
  calculation_rules:
    - id: calc_count_to_mass
      applies_to: "Count-based reference-product records"
      rule: "Conforming product mass = accepted item count × measured lot-average net mass per item"
      inputs:
        - "accepted count"
        - "sampled net mass"
        - "sample size"
        - "lot id"
      output: "kg conforming product"
