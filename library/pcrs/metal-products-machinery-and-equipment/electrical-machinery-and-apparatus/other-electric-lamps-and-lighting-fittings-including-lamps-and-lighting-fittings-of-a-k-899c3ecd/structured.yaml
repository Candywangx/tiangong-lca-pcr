allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "Avoid allocation by metering product-specific batches, machines, finishing lines, and waste streams separately where feasible."
    source_ids: []
  - rule_id: allocation_mass
    applies_to: "unavoidable shared process with multiple co-products"
    rule: "When subdivision is not feasible and physical causality cannot be established, allocate shared burdens by measured output mass and disclose all outputs and the allocation fraction."
    source_ids:
      - pep-ecopassport-psr-0014-ed2-2023
  - rule_id: allocation_scrap
    applies_to: "production scrap"
    rule: "Report scrap as a waste output and model its treatment separately; do not subtract its mass or a recycling credit from gross material input in the foreground inventory."
    source_ids:
      - pep-ecopassport-psr-0014-ed2-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_materials
      process_id: "component_fabrication_assembly_packaging"
      flow_role: "constituent material or component"
      record_type: "ERP issue, supplier specification, weighed sample"
      raw_fields: "item id; material grade; mass; quantity; supplier; recycled content; make-or-buy state"
      collection_method: "reconcile approved BOM with purchasing and batch issue records; weigh representative units"
      unit: "kg"
      frequency: "each product revision and production batch"
      temporal_coverage: "representative 12-month production period or full campaign"
      site_scope: "all reporting facilities and outsourced steps declared"
      aggregation_rule: "gross input mass divided by conforming output, then multiplied by N"
      quality_evidence: "signed BOM; calibration record; supplier declaration; mass-balance reconciliation"
    - protocol_id: cp_metered_energy
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "submeter or machine log"
      raw_fields: "meter start/end; machine id; batch; operating mode; grid connection"
      collection_method: "product-specific submetering or documented allocation from machine-hours"
      unit: "kWh, converted to MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all attributable on-site operations"
      aggregation_rule: "subtract non-production baseline; divide by conforming output; multiply by N"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_process_gases
      process_id: "component_fabrication_surface_finishing"
      flow_role: "industrial oxygen or natural gas"
      record_type: "flowmeter, cylinder, or invoice record"
      raw_fields: "gas identity; volume; temperature; pressure; batch; opening/closing inventory"
      collection_method: "meter or inventory balance with reference-condition conversion"
      unit: "m3"
      frequency: "each batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "attributable cutting, curing, or drying equipment"
      aggregation_rule: "net consumption divided by conforming output; multiply by N"
      quality_evidence: "meter calibration; invoice balance; reference-condition record"
    - protocol_id: cp_waste_mass
      process_id: "component_fabrication_surface_finishing"
      flow_role: "segregated waste"
      record_type: "scale ticket and waste manifest"
      raw_fields: "waste identity; mass; batch; destination; treatment; hazardous status"
      collection_method: "weigh each segregated waste stream before internal reuse or dispatch"
      unit: "kg"
      frequency: "each dispatch and batch reconciliation"
      temporal_coverage: "representative 12 months"
      site_scope: "all reporting facilities"
      aggregation_rule: "gross waste divided by conforming output; multiply by N"
      quality_evidence: "scale calibration; manifest; mass balance"
    - protocol_id: cp_finishing_materials
      process_id: "surface_finishing"
      flow_role: "coating, chemical, or process water"
      record_type: "batch recipe, tank make-up log, meter"
      raw_fields: "substance; concentration; opening/closing inventory; additions; recovered amount; batch"
      collection_method: "inventory balance and calibrated water metering"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 months"
      site_scope: "each declared finishing line"
      aggregation_rule: "net fresh input divided by conforming output; multiply by N"
      quality_evidence: "recipe approval; SDS; meter calibration; inventory reconciliation"
    - protocol_id: cp_stack_and_fuel_balance
      process_id: "surface_finishing"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel analysis and combustion calculation"
      raw_fields: "natural-gas volume; reference conditions; carbon content; oxidation factor"
      collection_method: "calculate only direct on-site fossil CO2 from collected fuel records"
      unit: "kg"
      frequency: "monthly or each campaign"
      temporal_coverage: "same period as gas inventory"
      site_scope: "reporting-facility combustion sources"
      aggregation_rule: "documented carbon balance normalized by conforming output and N"
      quality_evidence: "fuel specification; calculation worksheet; stack test when available"
    - protocol_id: cp_packaging_mass
      process_id: "assembly_packaging"
      flow_role: "packaging component"
      record_type: "packaging BOM and weighed sample"
      raw_fields: "packaging item; material; mass; reuse count; units shipped"
      collection_method: "weigh each packaging component separately and reconcile to shipments"
      unit: "kg"
      frequency: "each packaging design and quarterly check"
      temporal_coverage: "representative 12 months"
      site_scope: "factory-gate packaging supplied with product"
      aggregation_rule: "packaging mass per shipped luminaire multiplied by N"
      quality_evidence: "packaging drawing; scale calibration; shipment reconciliation"
    - protocol_id: cp_finished_product
      process_id: "assembly_packaging"
      flow_role: "finished luminaire"
      record_type: "final inspection and photometric report"
      raw_fields: "net mass; outgoing flux V; lifetime H; power; configuration; rejects"
      collection_method: "calibrated weighing plus electrical and photometric test for declared configuration"
      unit: "kg; lumen; h; W"
      frequency: "each product revision and representative batch"
      temporal_coverage: "current marketed configuration"
      site_scope: "all reference-product variants claimed"
      aggregation_rule: "calculate N and scale all exchanges to the functional unit"
      quality_evidence: "calibration certificates; test report; release record"
  calculation_rules:
    - id: calc_reference_quantity
      applies_to: "all inventory rows"
      rule: "N = (1,000 × 35,000) / (V × H); multiply per-luminaire exchanges by N."
      inputs:
        - "outgoing flux V in lumen"
        - "assigned lifetime H in h"
      output: "functional-equivalent luminaire quantity N"
      source_ids:
        - pep-ecopassport-psr-0014-ed2-2023
    - id: calc_electricity
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6."
      inputs:
        - "attributable metered kWh"
      output: "MJ per reference flow"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "component fabrication and finishing"
      rule: "Reconcile gross inputs = conforming product incorporated mass + each separately reported waste output + measured inventory change, within documented uncertainty."
      inputs:
        - input
        - output
        - waste
        - "and stock records"
      output: "mass-balance residual and completeness flag"
      source_ids: []
    - id: calc_direct_co2
      applies_to: "fossil_co2"
      rule: "Calculate direct fossil CO2 from collected natural-gas quantity and documented carbon/oxidation data; do not include upstream electricity or fuel-supply emissions."
      inputs:
        - "collected fuel and composition records"
      output: "kg fossil CO2 per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Demonstrate that the product is CPC 46539 and not solely designed for LED light sources; retain product specification, compatible-lamp statement, photos, and model number."
      evidence: "approved product specification and classification review"
    - id: dq_completeness
      applies_to: "bill of materials and processes"
      requirement: "Reconcile constituent mass, purchased components, factory inputs, wastes, and finished output; explain every material omission and outsourced step."
      evidence: "BOM-to-production mass balance and supplier records"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a representative 12-month period or the complete production campaign; disclose shutdowns, prototypes, and abnormal batches."
      evidence: "dated meter, purchasing, production, and waste records"
    - id: dq_technology
      applies_to: "fabrication and finishing"
      requirement: "Identify in-house and outsourced cutting, forming, moulding, coating, anodizing, and testing technologies."
      evidence: "route sheet, supplier declaration, and facility process map"
    - id: dq_photometry
      applies_to: "reference-flow scaling"
      requirement: "Retain the complete-luminaire photometric report, assigned-lifetime basis, and declared power for the same configuration represented by the BOM."
      evidence: "photometric and lifetime reports"
    - id: dq_uncertainty
      applies_to: "all calculated or allocated values"
      requirement: "Report measurement uncertainty, allocation shares, data gaps, and any proxy upstream datasets."
      evidence: "calculation workbook and data-quality review"
validation_rules:
  - rule_id: val_identity
    applies_to: "product identity"
    rule: "Fail if the product is solely designed for LED light sources, is a separate light source or part, or lacks evidence for the declared CPC 46539 boundary."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: val_reference_flow
    applies_to: "functional unit"
    rule: "Fail if V, H, N, net mass, supplied lamp/control-gear configuration, or photometric basis is missing or internally inconsistent."
    source_ids:
      - pep-ecopassport-psr-0014-ed2-2023
  - rule_id: val_atomic_inventory
    applies_to: "process inventory"
    rule: "Fail if any recorded exchange combines multiple materials, utilities, fuels, wastes, or emissions, or if an actual exchange is hidden in an umbrella row."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "manufacturing"
    rule: "Flag a non-zero unexplained mass-balance residual and fail when material omissions or netted scrap prevent reconciliation."
    source_ids:
      - pep-ecopassport-psr-0014-ed2-2023
  - rule_id: val_direct_emissions
    applies_to: "fossil_co2"
    rule: "Fail if upstream fuel or electricity emissions are reported as direct elementary outputs, or if direct combustion CO2 lacks collected fuel evidence."
    source_ids: []
  - rule_id: val_packaging
    applies_to: "packaging"
    rule: "Fail if product packaging is included in net luminaire mass or if supplied packaging components are not reported separately."
    source_ids:
      - pep-ecopassport-psr-0014-ed2-2023
published_dataset_profile:
  dataset_role: "foreground product-manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate manufacturing comparisons within the same CPC 46539 boundary and downstream lifecycle models that add declared distribution, installation, use, maintenance, and end-of-life scenarios"
  excluded_use: "Comparison with solely-LED luminaires or other lighting categories without harmonized functional performance, lifetime, configuration, geography, and downstream scenarios"
  required_metadata: "model number; CPC evidence; V; H; N; mass; power; lamp/control-gear/accessory configuration; light-management functions; application; geography; route; packaging; data period; allocation; upstream datasets"
  required_quality_disclosure: "foreground share; primary-data coverage; mass-balance residual; metering uncertainty; allocation; outsourced steps; recycled-content evidence; unresolved UUIDs and range-evidence needs"
  update_trigger: "Product redesign; light-source/control-gear change; flux, power, or lifetime change; BOM or packaging change above the study materiality threshold; facility/route/geography change; or newer representative data"
