  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every row"
      rule: "Attributable period amount / net kg of conforming released product."
      inputs:
        - "named period exchange"
        - "stock change"
        - "released mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_material_consumption
      applies_to: "Each material or component"
      rule: "Receipts + opening stock - closing stock - external returns; cancel documented internal transfers once."
      inputs:
        - "item-specific stock records"
      output: "net external consumption"
      source_ids: []
    - id: calc_substance_release
      applies_to: "Each air or water substance"
      rule: "Concentration × measured flow or documented input-output substance balance, with conversions retained."
      inputs:
        - "substance concentration"
        - flow
        - "density when needed"
      output: "kg by substance and compartment"
      source_ids:
        - us-epa-battery-effluent-guidelines
    - id: calc_energy_register
      applies_to: "Electricity"
      rule: "Imported electricity minus separately metered internal return; exported electricity stays a separate output."
      inputs:
        - import
        - "internal return"
        - export
      output: "net input and separate export"
      source_ids:
        - ec-pef-method-2021
    - id: calc_mass_balance
      applies_to: "Each process and package"
      rule: "Reconcile inputs and opening stock to products, each waste, each release, and closing stock; investigate residuals."
      inputs:
        - "atomic rows and stock"
      output: "residual and explanation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and route"
      requirement: "Preserve chemistry, product level, model, application, capacity, energy, state of charge, starting condition, and BOM revision."
      evidence: "specification, release certificate, BOM"
    - id: dq_atomicity
      applies_to: "Every inventory row"
      requirement: "One named exchange, one direction, one flow type, one property, one unit, one route condition, and one compartment when elementary."
      evidence: "row-level mapping review"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Reconcile every applicable material, utility carrier, waste, wastewater, and air or water release; document not-applicable rows."
      evidence: "process map, meters, manifests, permits"
    - id: dq_traceability
      applies_to: "Collected or calculated values"
      requirement: "Preserve raw record, conversion, allocation driver, calculation version, reviewer, and link to normalized value."
      evidence: "audit trail and calculation digest"
    - id: dq_uuid_identity
      applies_to: "Tiangong-linked rows"
      requirement: "Require hybrid-search discovery and direct state100 confirmation of exact semantics, type, property, and unit before adding a UUID."
      evidence: "search result and state100 read record"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Reference product"
    rule: "Require exactly 1 kg, CPC 46420, Product flow, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, and unit group 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_route_applicability
    applies_to: "Inventory"
    rule: "Require one declared route and include only applicable atomic rows; prohibit replacing absent rows with a chemistry-specific collection label."
    source_ids:
      - ec-battery-pefcr-2018
  - rule_id: validate_no_unverified_uuid
    applies_to: "Inventory links"
    rule: "Reject any UUID lacking both exact hybrid-search and state100 evidence."
    source_ids: []
  - rule_id: validate_no_estimated_range
    applies_to: "Inventory amounts"
    rule: "Reject reasoned-estimate, AI-generated, or broad all-route quantity ranges; use foreground records or explicit calculation rules."
    source_ids: []
  - rule_id: validate_carrier_separation
    applies_to: "Utilities"
    rule: "Require electricity, steam, hot water, natural gas, diesel, LPG, and each refrigerant to remain separate."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_release_separation
    applies_to: "Wastewater and elementary flows"
    rule: "Require physical wastewater streams and each named substance-to-air or substance-to-water exchange separately."
    source_ids:
      - us-epa-battery-effluent-guidelines
  - rule_id: validate_bilingual_alignment
    applies_to: "Canonical and translation"
    rule: "Require identical process_id, row_id, rule_id, source_id, UUID, and card order."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate foreground package for one specified finished rechargeable accumulator"
  downstream_use: "Link the package to representative upstream datasets for cradle-to-gate modelling, or use it as the production stage in a process or lifecyclemodel that adds distribution, use, second life, and end-of-life consistently."
  allowed_use: "Cradle-to-gate modelling with linked upstream datasets; facility improvement; downstream lifecycle models"
