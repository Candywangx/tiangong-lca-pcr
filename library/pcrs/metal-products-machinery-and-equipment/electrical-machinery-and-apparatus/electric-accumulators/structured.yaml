allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared operations"
    rule: "Subdivide by chemistry, model, line, lot, and meter before allocation."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_causal_driver
    applies_to: "Residual shared utilities"
    rule: "Use a documented causal driver such as metered energy, equipment time, dry-room volume-time, treated volume, or throughput; mass is the last resort."
    source_ids:
      - ec-pef-method-2021
      - porzio-scown-2021
  - rule_id: allocation_internal_recovery
    applies_to: "Scrap, solvent, water, and electricity returned internally"
    rule: "Model internal return once; record make-up, recovery burden, and losses, and prohibit duplicate credit."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_export
    applies_to: "Exported electricity and material leaving the system"
    rule: "Keep as a separate output and disclose the downstream method; do not also subtract or credit it in the foreground total."
    source_ids:
      - ec-pef-method-2021
