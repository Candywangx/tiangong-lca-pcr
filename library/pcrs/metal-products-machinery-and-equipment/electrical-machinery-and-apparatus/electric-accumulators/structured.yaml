process_map:
  - id: electrode_plate_preparation
    name: "Electrode and plate preparation"
    inclusion: "conditional"
    inclusion_condition: "Include only for electrodes or plates made or finished on-site."
    role: "Chemistry-specific electrode or plate manufacture"
    quantitative_reference: "kg of conforming prepared electrode or plate"
  - id: cell_assembly_sealing
    name: "Cell assembly, electrolyte filling, and sealing"
    inclusion: "conditional"
    inclusion_condition: "Include when rechargeable cells are manufactured on-site."
    role: "Chemistry-specific cell manufacture"
    quantitative_reference: "kg of sealed unformed cells"
  - id: formation_ageing_testing
    name: "Formation, ageing, and release testing"
    inclusion: "required"
    inclusion_condition: "Apply to on-site formation and every final release-test operation."
    role: "Electrical activation and quality release"
    quantitative_reference: "kg of conforming tested accumulator"
  - id: module_pack_assembly
    name: "Module and pack assembly"
    inclusion: "conditional"
    inclusion_condition: "Include when cells, modules, controls, interconnects, housings, cooling parts, or included packaging are assembled on-site."
    role: "Final accumulator assembly"
    quantitative_reference: "kg of conforming finished accumulator"
  - id: site_utilities_treatment
    name: "Site utilities and pollution control"
    inclusion: "conditional"
    inclusion_condition: "Include each carrier or treatment train only when it serves the declared product and is not already measured in another foreground process."
    role: "Carrier-specific utility supply and release accounting"
    quantitative_reference: "kg of conforming finished accumulator served"
