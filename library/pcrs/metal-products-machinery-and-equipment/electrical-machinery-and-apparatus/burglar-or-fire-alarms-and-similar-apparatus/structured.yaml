allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "Product-specific foreground records"
    rule: "Avoid allocation by using product-specific BOM issues, meters, work orders, and segregated waste measurements whenever technically feasible."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: allocation_shared_assembly_mass
    applies_to: "Shared assembly, test, packaging, energy, and waste records"
    rule: "When shared primary data cannot be subdivided, allocate in proportion to the mass of conforming devices manufactured during the same reporting period. Any different physical or economic driver must better represent causality and be justified and disclosed."
    source_ids:
      - pep-psr-0019-ed1-2023
  - rule_id: allocation_scrap_boundary
    applies_to: "Manufacturing scrap and recycling"
    rule: "Record each segregated scrap output and its treatment route without crediting avoided primary production inside the foreground manufacturing dataset; report any beyond-boundary recycling benefit separately."
    source_ids:
      - pep-pcr-ed4-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_material_inputs
      process_id: "alarm_apparatus_manufacturing"
      flow_role: "Material, purchased-subassembly, battery, accessory, and packaging inputs"
      record_type: "BOM, purchase/issue records, supplier declarations, and verified mass measurements"
      raw_fields: "model; revision; lot; flow identity; supplier; material or component specification; gross issue; return to stock; item count; measured net mass; recycled content; supplied or prescribed status"
      collection_method: "Reconcile current product BOM with warehouse issues and returns; weigh representative items when records are count-based; retain supplier evidence"
      unit: "kg and item count before conversion"
      frequency: "Per production lot with at least annual reconciliation"
      temporal_coverage: "Prefer a continuous 12-month representative period; justify shorter or abnormal periods"
      site_scope: "Every manufacturing and packaging site contributing to the reference flow"
      aggregation_rule: "Sum net consumed mass by exact flow and allocate only shared records according to section 7, then divide by conforming packaged output mass"
      quality_evidence: "Approved BOM revision; calibrated scale records; stock reconciliation; supplier specification; exception log"
    - protocol_id: cp_manufacturing_electricity
      process_id: "alarm_apparatus_manufacturing"
      flow_role: "Manufacturing electricity"
      record_type: "Submeter, machine meter, or invoice-reconciled energy record"
      raw_fields: "meter id; reading start/end; kWh; production line; operating period; product mix; downtime; allocation driver; renewable contract attributes"
      collection_method: "Prefer product-line or equipment submetering; otherwise reconcile facility invoices to attributable manufacturing loads and documented allocation"
      unit: "kWh and MJ"
      frequency: "Monthly or finer"
      temporal_coverage: "Representative 12-month period where available"
      site_scope: "All sites performing included forming, assembly, testing, and packaging"
      aggregation_rule: "Sum attributable kWh, allocate shared use under section 7, multiply by 3.6 MJ/kWh, and divide by conforming packaged output mass"
      quality_evidence: "Meter calibration; invoice reconciliation; production log; allocation worksheet"
    - protocol_id: cp_output_and_waste_mass
      process_id: "alarm_apparatus_manufacturing"
      flow_role: "Conforming output and segregated manufacturing waste"
      record_type: "Production count and mass records, reject logs, waste transfer notes, and weigh tickets"
      raw_fields: "model; lot; conforming count; product-only mass; packaging mass; waste type; hazardous status; gross/tare/net mass; internal rework or regrind; destination; treatment route"
      collection_method: "Weigh conforming products and each segregated waste stream; exclude documented internal loops from external waste outputs"
      unit: "kg"
      frequency: "Per lot for output and at each waste transfer"
      temporal_coverage: "Same reporting period as material and electricity records"
      site_scope: "Every included manufacturing site and contracted treatment-bound transfer"
      aggregation_rule: "Sum conforming packaged mass and each external waste flow separately; normalize to 1 kg conforming packaged output"
      quality_evidence: "Calibrated scale; reject disposition; waste-transfer certificate; mass-balance reconciliation"
  calculation_rules:
    - id: calc_material_normalization
      applies_to: "Each material, component, battery, and packaging input"
      rule: "normalized input = (gross issue − return to stock − documented internal-loop return) / conforming packaged output mass"
      inputs:
        - "Flow-specific issue"
        - return
        - internal-loop
        - "and output-mass records from cp_bom_material_inputs and cp_output_and_waste_mass"
      output: "kg input per kg reference product"
      source_ids: []
    - id: calc_electricity_normalization
      applies_to: "Manufacturing electricity"
      rule: "normalized electricity = allocated electricity in kWh × 3.6 / conforming packaged output mass"
      inputs:
        - "Metered or invoice-reconciled kWh"
        - "allocation driver"
        - "and output mass"
      output: "MJ electricity per kg reference product"
      source_ids: []
    - id: calc_waste_normalization
      applies_to: "Each manufacturing waste output"
      rule: "normalized waste = external transferred net waste mass / conforming packaged output mass; exclude documented material returned to the same process"
      inputs:
        - "Flow-specific transfer mass"
        - "internal-loop return"
        - "and output mass"
      output: "kg waste per kg reference product"
      source_ids:
        - pep-psr-0019-ed1-2023
    - id: calc_mass_balance
      applies_to: "Manufacturing-period completeness check"
      rule: "Compare total recorded material, component, battery, and packaging inputs with conforming product, external waste, documented internal inventory change, and measured process losses; investigate and disclose the residual"
      inputs:
        - "All mass records for the common reporting period"
      output: "Mass-balance residual and reconciliation statement"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and every exchange"
      requirement: "Use the declared product revision and one chemically or physically specific flow per row. Preserve supplier grade, product state, recycled content, battery chemistry, waste contamination, and treatment-route qualifiers."
      evidence: "BOM, drawings, specifications, supplier declarations, Tiangong identity audit, waste records"
    - id: dq_temporal
      applies_to: "Foreground activity data"
      requirement: "Use a representative period, preferably 12 consecutive months, and document shutdowns, abnormal production, missing months, and any shorter-period justification."
      evidence: "Dated meter, production, stock, and waste records; pep-pcr-ed4-2021"
    - id: dq_completeness
      applies_to: "Manufacturing inventory"
      requirement: "Reconcile the current BOM and packaging list to inventory rows; quantify and justify exclusions; do not hide unrepresented materials, prescribed consumables, accessories, energy, or manufacturing waste in collection rows."
      evidence: "BOM-to-inventory reconciliation, mass balance, exclusion register; pep-pcr-ed4-2021"
    - id: dq_representativeness
      applies_to: "Multi-site and upstream data"
      requirement: "Match geography, technology, product state, and time to the declared product; document site aggregation and every secondary-data proxy or adaptation."
      evidence: "Site-selection rationale, dataset metadata, proxy register; pep-pcr-ed4-2021"
    - id: dq_functional_qualifiers
      applies_to: "Reference flow"
      requirement: "Document alarm family, sensing/signalling principle, applicable standard and performance class, power mode, prescribed consumables, supplied accessories, and reference service life so downstream use-stage modelling is reproducible."
      evidence: "Product certificate, declaration of conformity, technical data sheet, service-life statement; iec-tc79-sbp-2026; pep-psr-0019-ed1-2023"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "Dataset identity and quantitative reference"
    rule: "Confirm that the output is exactly 1 kg of conforming packaged apparatus and that product-only mass, packaging mass, model/configuration, alarm function, performance class, power mode, supplied accessories, and reference service life are declared."
    source_ids:
      - pep-psr-0019-ed1-2023
  - rule_id: validate_atomic_inventory
    applies_to: "Every inventory exchange"
    rule: "Reject collection labels, combined materials, combined utilities, combined wastes, unverified UUID proxies, and Chinese UUID-bearing flow names that differ from the public Tiangong baseName."
    source_ids: []
  - rule_id: validate_bom_and_mass_balance
    applies_to: "Material completeness"
    rule: "Require BOM-to-inventory reconciliation and investigate the mass-balance residual; every omitted assessable material, component, package, energy flow, and waste stream must be quantified and justified."
    source_ids:
      - pep-pcr-ed4-2021
  - rule_id: validate_energy_boundary
    applies_to: "Electricity and emissions"
    rule: "Confirm the 3.6 MJ/kWh conversion, common reporting period, documented allocation, and exclusion of upstream electricity emissions from foreground elementary outputs."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Shared records"
    rule: "Confirm subdivision was attempted first; otherwise verify the mass allocation calculation or documented causal alternative and retain a sensitivity statement for material alternatives."
    source_ids:
      - pep-pcr-ed4-2021
      - pep-psr-0019-ed1-2023
  - rule_id: validate_waste_routes
    applies_to: "Manufacturing waste"
    rule: "Confirm that each waste is physically specific, segregated or defensibly measured, net of internal loops, linked to a documented destination/treatment route, and not credited with beyond-boundary recycling inside the foreground result."
    source_ids:
      - pep-psr-0019-ed1-2023
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset"
  allowed_use: "Product- and site-specific factory-gate inventories for burglar or fire alarm apparatus; building-product LCAs and cradle-to-grave models that add compatible distribution, installation, use, maintenance, and end-of-life scenarios"
  excluded_use: "Direct comparison of apparatus with different alarm functions, performance classes, power modes, system configurations, service lives, or geographic requirements without functional equivalence and harmonized downstream scenarios"
  required_metadata: "PCR id and version; product model/revision; alarm family and function; sensing/signalling principle; applicable standard and performance class; power mode; battery and accessory scope; product-only and packaging masses; reference service life; manufacturing geography, technology, sites, reporting period, allocation, BOM coverage, upstream dataset identifiers, and exclusions"
  required_quality_disclosure: "Primary-data coverage; temporal, geographic, and technological representativeness; BOM and packaging completeness; mass-balance residual; meter and scale quality; supplier data quality; UUID gaps; secondary-data proxies; waste destinations; allocation sensitivity; unresolved empirical range needs"
  update_trigger: "Product hardware, firmware function, sensing/signalling principle, enclosure material, PCB design, battery or power mode, supplied accessory, packaging, manufacturing site/technology, energy mix, allocation basis, applicable standard, or reference service life changes materially; or representative foreground data become older than the declared update policy"
