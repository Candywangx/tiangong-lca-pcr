system_boundary:
  rules:
    - rule_id: sb_gate_boundary
      applies_to: "all foreground processes"
      rule: "Include receipt-to-factory-gate activities controlled by the manufacturer: applicable finishing, assembly, factory tests, packing, rework, rejects, and on-site waste generation. Exclude installation, downstream distribution, use, maintenance, and end-of-life."
      source_ids:
        - pep-ecopassport-psr-0014-2023
        - us-doe-led-lca-part2-2012
    - rule_id: sb_component_completeness
      applies_to: "product bill of materials"
      rule: "Include every component delivered with the product or needed for the declared sale configuration, and state explicitly whether the light source, control gear, battery, mounting parts, fuel reservoir, wick, or sign panel is supplied."
      source_ids:
        - pep-ecopassport-psr-0014-2023
        - us-doe-luminaires-definition
    - rule_id: sb_upstream_connection
      applies_to: "purchased inputs"
      rule: "Model upstream raw-material, component, energy, water, and packaging production in linked background datasets; do not count those upstream processes again as foreground manufacturing."
      source_ids:
        - us-doe-led-lca-part2-2012
    - rule_id: sb_variant_condition
      applies_to: "conditional routes"
      rule: "Instantiate only the rows and processes physically present for the declared product. Mark demonstrably absent conditional rows not_applicable; never substitute another material, battery chemistry, fuel, or component."
      source_ids:
        - un-cpc-3-structure-2025
boundary_abstraction:
  declared_starting_condition: "Purchased chassis, optical, electrical, fuel-system, sign-panel, finishing, utility, and packaging inputs are received at the reporting facility in the actual as-supplied state used for the declared product."
  starting_condition_role: "The foreground begins at receipt of purchased inputs and covers only transformations, assembly, tests, packing, and losses controlled by the reporting manufacturer."
  product_classification_scope: "One declared finished product instance within the semantic scope of this PCR; adjacent CPC lighting products and separately traded parts remain outside."
  recursive_input_rule: "If a complete product within this same PCR category is purchased and incorporated, record it once as a distinct product input with an upstream dataset and do not recursively expand its manufacture inside this foreground dataset."
  upstream_dataset_requirement: "Every purchased material, component, energy carrier, water flow, and packaging item crossing the boundary requires an upstream dataset matching substance or product identity, geography, technology, and delivery state."
  disclosure: "Declare outsourced versus on-site operations, included components, coating route, test procedures, rejected-product handling, packaging state, cut-offs, data gaps, and any process shared with other products."
