allocation_rules:
  - rule_id: al_subdivide
    applies_to: "shared manufacturing lines"
    rule: "Prefer subdivision, submetering, job records, or equipment-runtime records before allocation."
    source_ids:
      - pep-ecopassport-psr-0014-2023
  - rule_id: al_physical
    applies_to: "residual shared inputs and outputs"
    rule: "Allocate unresolved shared foreground quantities by a documented physical driver that causes the burden, such as machine time, coated surface area, test duration, or mass throughput."
    source_ids:
      - pep-ecopassport-psr-0014-2023
  - rule_id: al_mass_fallback
    applies_to: "co-products without a better causal driver"
    rule: "Apply output-mass allocation only when subdivision and a more specific physical relationship are not feasible; disclose all allocated products and the factor."
    source_ids:
      - pep-ecopassport-psr-0014-2023
  - rule_id: al_scrap
    applies_to: "production scrap and recovered material"
    rule: "Record scrap mass and its actual treatment or recycling input without avoided-burden credit inside the foreground gate; any substitution credit belongs to a separately declared downstream model."
    source_ids:
      - us-doe-led-lca-part2-2012
  - rule_id: al_rework
    applies_to: "reworked units"
    rule: "Keep rework materials and energy in the foreground numerator and count only the finally accepted item in the reference output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_finish_materials
      process_id: "surface_finishing"
      flow_role: "chassis, coating, sodium hydroxide, and water inputs"
      record_type: "purchase, issue, stock, BOM, scale, and meter records"
      raw_fields: "material identity; lot; opening stock; receipts; issues; returns; closing stock; chassis count and mass; water meter"
      collection_method: "reconcile stock balance to finishing batches and verified BOM"
      unit: "kg"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "representative continuous 12 months or declared campaign"
      site_scope: "all finishing lines serving declared product"
      aggregation_rule: "net consumed quantity divided by kg of accepted reference product"
      quality_evidence: "calibrated scale/meter records; stock reconciliation; batch traveller"
    - protocol_id: cp_finish_energy
      process_id: "surface_finishing"
      flow_role: "electricity and natural gas inputs and direct combustion CO2"
      record_type: "utility submeters, invoices, runtime logs, and supplier fuel data"
      raw_fields: "meter start/end; kWh; m3; reference conditions; equipment runtime; product throughput; carbon factor; oxidation factor"
      collection_method: "submeter or allocate by documented equipment runtime and throughput"
      unit: "MJ; m3; kg"
      frequency: "each batch or monthly meter period"
      temporal_coverage: "same period as production denominator"
      site_scope: "all finishing utilities and curing equipment"
      aggregation_rule: "allocated utility divided by kg of accepted reference product; calculate direct CO2 separately"
      quality_evidence: "meter calibration; invoice reconciliation; supplier fuel specification"
    - protocol_id: cp_finish_outputs
      process_id: "surface_finishing"
      flow_role: "coated chassis and finishing wastes"
      record_type: "transfer count, scale, effluent meter, tank, and waste manifest records"
      raw_fields: "accepted chassis count and mass; effluent mass or volume; powder waste mass; destination"
      collection_method: "reconcile output, inventory change, and waste to input material balance"
      unit: "kg"
      frequency: "each batch and each waste shipment"
      temporal_coverage: "same period as finishing inputs"
      site_scope: "all finishing outputs under site control"
      aggregation_rule: "total output or waste divided by kg of accepted reference product"
      quality_evidence: "transfer tickets; scale checks; discharge meter; waste manifests"
    - protocol_id: cp_assembly_bom
      process_id: "product_assembly"
      flow_role: "product-specific assembly inputs"
      record_type: "controlled BOM, issue/return, component count, mass and length records"
      raw_fields: "model; BOM revision; component identity; quantity; unit mass; wire length and mass per metre; opening/closing consumable stock"
      collection_method: "verify BOM against as-built sample and reconcile issued consumables"
      unit: "kg"
      frequency: "each model revision; each production batch"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all assembly lines serving declared product"
      aggregation_rule: "net component or consumable mass divided by kg of accepted reference product"
      quality_evidence: "approved BOM; change control; calibrated component weights; stock reconciliation"
    - protocol_id: cp_assembly_energy
      process_id: "product_assembly"
      flow_role: "assembly electricity"
      record_type: "submeter and equipment-runtime records"
      raw_fields: "kWh; meter period; equipment power; runtime; line throughput"
      collection_method: "submeter or allocate by documented runtime"
      unit: "MJ"
      frequency: "batch or monthly"
      temporal_coverage: "same period as assembly output"
      site_scope: "all assembly equipment and local extraction"
      aggregation_rule: "allocated electricity divided by accepted assemblies"
      quality_evidence: "meter calibration; runtime log; invoice reconciliation"
    - protocol_id: cp_assembly_outputs
      process_id: "product_assembly"
      flow_role: "accepted assemblies and assembly wastes"
      record_type: "production count, mass, reject and waste records"
      raw_fields: "accepted count; unpacked mass; solder dross mass; rejected assembly mass; disposition"
      collection_method: "reconcile transfers, rework, rejects, and waste to issued inputs"
      unit: "kg"
      frequency: "each batch and each waste shipment"
      temporal_coverage: "same period as assembly inputs"
      site_scope: "all assembly outputs under site control"
      aggregation_rule: "output or waste divided by kg of accepted reference product"
      quality_evidence: "batch traveller; calibrated scale; reject log; waste manifest"
    - protocol_id: cp_test_pack_inputs
      process_id: "final_testing_and_packaging"
      flow_role: "assembled product and packaging inputs"
      record_type: "transfer count, packaging BOM, issue and component-weight records"
      raw_fields: "assembly count/mass; carton count/mass; bag count/mass; packaging revision"
      collection_method: "reconcile issued packaging to packed output and packaging scrap"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all final-test and packing lines"
      aggregation_rule: "net input divided by kg of accepted packed product"
      quality_evidence: "packing BOM; component weight checks; issue/return records"
    - protocol_id: cp_test_energy
      process_id: "final_testing_and_packaging"
      flow_role: "testing and packing electricity"
      record_type: "test logs, submeter and equipment power-time records"
      raw_fields: "kWh; test type; power; duration; tested units; packing runtime"
      collection_method: "submeter or calculate power × time and reconcile to the meter"
      unit: "MJ"
      frequency: "each test batch or monthly"
      temporal_coverage: "same period as accepted packed output"
      site_scope: "all test rigs and packing equipment"
      aggregation_rule: "allocated electricity divided by kg of accepted packed product"
      quality_evidence: "test-system calibration; meter record; test log"
    - protocol_id: cp_final_outputs
      process_id: "final_testing_and_packaging"
      flow_role: "accepted reference product and final wastes"
      record_type: "acceptance, packing, scale, reject and waste records"
      raw_fields: "accepted item count; net and gross mass; failed count/mass; rework; carton scrap; film scrap; destination"
      collection_method: "count accepted products and weigh each segregated waste stream"
      unit: "item; kg"
      frequency: "each batch and each waste shipment"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all factory-gate outputs for declared product"
      aggregation_rule: "exactly 1 kg accepted product as reference; each waste divided by accepted product mass"
      quality_evidence: "acceptance report; scale calibration; reject disposition; waste manifest"
  calculation_rules:
    - id: calc_bom_mass
      applies_to: "counted components"
      rule: "component mass per kg reference product = net component count × verified unit mass ÷ accepted finished-product mass in kg"
      inputs:
        - "BOM quantity"
        - "unit mass"
        - "accepted finished-product mass"
      output: "kg component per kg reference product"
      source_ids: []
    - id: calc_stock_consumption
      applies_to: "coating, adhesive, and solder"
      rule: "consumed mass = opening stock + receipts − returns − closing stock − separately recovered reusable material"
      inputs:
        - "stock and issue records"
      output: "kg consumed per kg reference product"
      source_ids: []
    - id: calc_energy_allocation
      applies_to: "shared equipment energy"
      rule: "allocated energy = metered period energy × declared causal allocation factor ÷ accepted finished-product mass in kg"
      inputs:
        - "meter reading"
        - "runtime or throughput driver"
        - "accepted finished-product mass"
      output: "MJ per kg reference product"
      source_ids:
        - pep-ecopassport-psr-0014-2023
    - id: calc_fossil_co2
      applies_to: "on-site natural-gas combustion"
      rule: "direct fossil CO2 = allocated gas quantity × documented supplier carbon factor × oxidation factor; preserve factor units and reference conditions"
      inputs:
        - "gas volume"
        - "carbon factor"
        - "oxidation factor"
      output: "kg fossil CO2 per kg reference product"
      source_ids: []
    - id: calc_transfer_balance
      applies_to: "internal intermediates"
      rule: "prior-process accepted output = next-process input + separately recorded inventory change + rework + loss"
      inputs:
        - "transfer and inventory records"
      output: "reconciled kg internal intermediate"
      source_ids: []
    - id: calc_final_yield
      applies_to: "final product and rejects"
      rule: "first-pass and final yield must be calculated from tested, reworked, rejected, and accepted unit counts; the reference output remains one finally accepted item"
      inputs:
        - "test and disposition counts"
      output: "item yield disclosure and kg reject per accepted item"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "declared product"
      requirement: "Freeze the model/BOM/packaging revision and all required qualifiers for the reporting period; aggregate models only with a disclosed production-weighting method."
      evidence: "approved specifications, BOM, model list, and production volumes"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile every purchased component and consumable in the sale configuration, each energy meter, each internal transfer, and each segregated output; explain zero, excluded, and unavailable rows."
      evidence: "mass/energy reconciliation and completeness checklist"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Use calibrated meters and scales or document equipment-runtime estimates and their uncertainty when direct measurement is unavailable."
      evidence: "calibration certificates, meter logs, and estimation records"
    - id: dq_temporal
      applies_to: "foreground data"
      requirement: "Use a continuous representative 12-month period when available; otherwise disclose the campaign dates, seasonality, downtime, and extrapolation."
      evidence: "dated production, utility, and waste records"
    - id: dq_supplier_match
      applies_to: "upstream datasets"
      requirement: "Match purchased flows to actual material, component, chemistry, geography, technology, and delivery state; disclose every proxy."
      evidence: "supplier specifications and dataset mapping review"
    - id: dq_conditional_routes
      applies_to: "category variants"
      requirement: "Demonstrate why each conditional process or row is present or absent for the declared product; do not average incompatible electric, battery, fuel, sign, or optical configurations."
      evidence: "route declaration and signed BOM review"
    - id: dq_uuid_status
      applies_to: "Tiangong identities"
      requirement: "Preserve UUID-empty rows as unresolved until a public state-100 identity is audited; do not promote a parts flow or technology-specific component as the finished reference product."
      evidence: "manifest unresolved list and finalized UUID-search receipt"
validation_rules:
  - rule_id: vr_reference
    applies_to: "reference flow"
    rule: "Verify exactly 1 kg of accepted finished product, matching model/BOM/packaging revision, is the quantitative reference and that item count and packaging mass are declared."
    source_ids:
      - un-cpc-3-structure-2025
  - rule_id: vr_scope
    applies_to: "product identity"
    rule: "Confirm the declared product is within the covered product list and is not a vehicle/cycle lamp, public-space/thoroughfare fitting, separate light source, Christmas-tree set, separately classified LED-only luminaire, or part."
    source_ids:
      - un-cpc-3-structure-2025
  - rule_id: vr_component_set
    applies_to: "sale configuration"
    rule: "Confirm included light source, control gear, battery, mounting parts, fuel reservoir, wick, sign panel, and packaging match the product actually sold."
    source_ids:
      - pep-ecopassport-psr-0014-2023
      - us-doe-luminaires-definition
  - rule_id: vr_atomic_flows
    applies_to: "process inventory"
    rule: "Reject any row that combines materials, utilities, fuels, packaging, wastes, or emissions; every selected flow must denote one atomic exchange."
    source_ids: []
  - rule_id: vr_balance
    applies_to: "foreground processes"
    rule: "Reconcile material inputs, internal transfers, product, rework, inventory change, and segregated wastes; investigate unexplained imbalance before publication."
    source_ids: []
  - rule_id: vr_energy
    applies_to: "electricity and natural gas"
    rule: "Check meter period, production denominator, unit conversion, grid geography, gas reference conditions, and allocation driver."
    source_ids: []
  - rule_id: vr_conditional
    applies_to: "conditional processes and rows"
    rule: "Require an explicit applicability result for finishing, LED module, control gear, battery, fuel reservoir, wick, sign panel, and each packaging component."
    source_ids: []
  - rule_id: vr_comparability
    applies_to: "downstream use"
    rule: "Reject comparative claims based only on mass; require compatible light output or illuminated function, lifetime, operating pattern, product state, and system boundary."
    source_ids:
      - pep-ecopassport-psr-0014-2023
      - us-doe-led-lca-part2-2012
published_dataset_profile:
  dataset_role: "secondary_dataset; may be used as background_dataset only for the declared product configuration and geography"
  downstream_use: "Foreground product-footprint construction and downstream process or lifecyclemodel projections for a matching finished lighting or illuminated-identification product"
  allowed_use: "Factory-gate modelling when product subtype, BOM, included components, performance qualifiers, mass, packaging, technology, geography, and period match the intended use"
  excluded_use: "Functional comparison across unlike product subtypes; unqualified substitution for separate light sources, parts, LED-only luminaires classified elsewhere, public-space lighting, vehicle/cycle lamps, use-stage electricity/fuel, installation, maintenance, or end-of-life"
  required_metadata: "canonical PCR id; model/BOM/packaging revisions; all reference-flow qualifiers; production site and period; foreground boundary; conditional-route decisions; allocation; accepted item count; net/gross mass; data-source mapping; unresolved UUIDs and ranges"
  required_quality_disclosure: "meter and scale coverage; temporal and site representativeness; mass/energy reconciliation; supplier-data quality; proxies; cut-offs; rework and reject treatment; background-dataset versions; uncertainty and data gaps"
  update_trigger: "Change in product subtype, BOM, light source/control gear/battery/fuel system, sign panel, finishing route, packaging, site, energy supply, allocation, service-life declaration, or a cumulative production mix change that makes the dataset unrepresentative"
