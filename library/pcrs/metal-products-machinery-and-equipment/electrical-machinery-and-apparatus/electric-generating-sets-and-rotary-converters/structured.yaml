allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared manufacturing and testing"
    rule: "First avoid allocation by direct metering, lot segregation, subdivision, or system expansion."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "residual shared burdens"
    rule: "If subdivision is impossible, use a documented causal driver such as machine time, test time, metered energy, or processed mass."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relationship
    applies_to: "absence of a physical relationship"
    rule: "Use another relationship only after documenting why prior options are infeasible; disclose factors and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap
    applies_to: "recyclable production scrap"
    rule: "Report scrap as waste linked to receiving treatment; do not subtract avoided primary-material credit inside this gate inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_and_packaging
      process_id: "final_manufacturing_assembly_test"
      flow_role: "installed material and packaging"
      record_type: "BOM and supplier record"
      raw_fields: "configuration; identity; issue, return, installed, and packaging mass"
      collection_method: "reconciled ERP bill, scale, supplier specification"
      unit: "kg/item"
      frequency: "each configuration"
      temporal_coverage: "representative year"
      site_scope: "site and suppliers"
      aggregation_rule: "sum separate article masses per accepted item"
      quality_evidence: "released BOM; calibration; supplier declaration"
    - protocol_id: cp_material_issue
      process_id: "final_manufacturing_assembly_test"
      flow_role: "chemical and fill material"
      record_type: "issue/return record"
      raw_fields: "identity; grade; opening; receipts; issues; returns; closing; accepted units"
      collection_method: "stock reconciliation and batch tickets"
      unit: "kg/item"
      frequency: "batch or monthly"
      temporal_coverage: "representative year"
      site_scope: "foreground site"
      aggregation_rule: "opening plus receipts minus closing, returns, unrelated issues"
      quality_evidence: "reconciliation; specification"
    - protocol_id: cp_site_utilities
      process_id: "final_manufacturing_assembly_test"
      flow_role: "electricity, water, oxygen"
      record_type: "meter or delivery record"
      raw_fields: "meter; readings; unit; conditions; correction; downtime; units; driver"
      collection_method: "submetering or meter balance"
      unit: "MJ/item; kg/item; m3/item"
      frequency: "batch or monthly"
      temporal_coverage: "representative year"
      site_scope: "foreground site"
      aggregation_rule: "subtract unrelated use and assign by meter or causal driver"
      quality_evidence: "calibration; invoice; meter map"
    - protocol_id: cp_test_fuels
      process_id: "final_manufacturing_assembly_test"
      flow_role: "test fuel and direct CO2"
      record_type: "test log, issue record, fuel specification"
      raw_fields: "serial; duration; load; fuel; conditions; composition/carbon; oxidation; exported electricity"
      collection_method: "test-cell meter and stock balance"
      unit: "kg/item; m3/item; kg CO2/item"
      frequency: "each test"
      temporal_coverage: "representative year"
      site_scope: "test cells"
      aggregation_rule: "sum attributable fuel and calculate each CO2 flow separately"
      quality_evidence: "calibration; test log; specification"
    - protocol_id: cp_product_acceptance
      process_id: "final_manufacturing_assembly_test"
      flow_role: "complete product"
      record_type: "acceptance/release record"
      raw_fields: "serial; subtype; configuration; ratings; duty; mass; result; packaging"
      collection_method: "controlled acceptance record"
      unit: "Item(s)"
      frequency: "every item"
      temporal_coverage: "representative year"
      site_scope: "manufacturing site"
      aggregation_rule: "count only released passing items"
      quality_evidence: "signed certificate; release; calibration"
    - protocol_id: cp_waste_records
      process_id: "final_manufacturing_assembly_test"
      flow_role: "waste oil"
      record_type: "weighing and manifest"
      raw_fields: "identity; tare/gross; period; lot; destination; treatment"
      collection_method: "weighing and manifest reconciliation"
      unit: "kg/item"
      frequency: "each shipment"
      temporal_coverage: "representative year"
      site_scope: "foreground site"
      aggregation_rule: "net mass assigned to causal lots without credit"
      quality_evidence: "calibration; manifest; container log"
  calculation_rules:
    - id: calc_item_normalization
      applies_to: "all rows"
      rule: "attributable amount / represented accepted-item count"
      inputs:
        - amount
        - "accepted items"
        - "allocation driver"
      output: "flow quantity per item"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "corrected kWh × 3.6"
      inputs:
        - "meter kWh"
      output: "MJ/item"
      source_ids: []
    - id: calc_water_mass
      applies_to: "volumetric water"
      rule: "corrected volume × documented density"
      inputs:
        - volume
        - density
        - conditions
      output: "kg/item"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "on-site combustion"
      rule: "fuel mass × fossil carbon fraction × oxidation × 44/12; gas conversion uses composition and conditions"
      inputs:
        - "fuel mass/volume"
        - "density/composition"
        - carbon
        - oxidation
      output: "kg fossil CO2/item"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "materials and losses"
      rule: "input = retained product + returns + waste + emissions + closing work in progress"
      inputs:
        - BOM
        - "issue/return"
        - "product/packaging"
        - waste
        - "work in progress"
      output: "difference and completeness flag"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain serial/model and all qualifiers; never average unlike products without configuration-specific normalization."
      evidence: "acceptance certificate and specification; cummins-qsk95-epd-2026"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use a representative continuous year or disclose shorter coverage and variability; date every record."
      evidence: "meter, ERP, test, and manifest records"
    - id: dq_completeness
      applies_to: "BOM and site inventory"
      requirement: "Reconcile at least 99% of dry product and supplied packaging mass; list each exclusion with mass and justification."
      evidence: "signed mass-balance review and exclusion register"
    - id: dq_metering
      applies_to: "utilities and test fuels"
      requirement: "Document boundary, calibration, corrections, conditions, downtime, rework, failed tests, exported electricity, and shared services."
      evidence: "calibration, meter map, reconciliation"
    - id: dq_supplier_data
      applies_to: "purchased inputs"
      requirement: "Prefer current supplier data; otherwise disclose representativeness and test material proxies."
      evidence: "supplier metadata and proxy review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
