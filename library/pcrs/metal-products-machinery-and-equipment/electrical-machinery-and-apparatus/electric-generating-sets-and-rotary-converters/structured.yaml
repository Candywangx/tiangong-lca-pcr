system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include purchased materials/components and upstream datasets, on-site fabrication/winding, cleaning/coating, assembly, filling, testing, direct emissions, wastes, and supplied packaging when applicable."
      source_ids:
        - cummins-qsk95-epd-2026
    - rule_id: boundary_excluded_stages
      applies_to: "downstream stages"
      rule: "Exclude post-gate distribution, customer-site installation/commissioning, operation, maintenance, and end-of-life unless separately extended."
      source_ids:
        - cummins-qsk95-epd-2026
    - rule_id: boundary_additional_atomic_flows
      applies_to: "product-specific inventory"
      rule: "Add every additional material, component, fuel, chemical, packaging item, waste, and elementary emission as its own exchange; never aggregate them as other materials, utilities, or wastes."
      source_ids: []
    - rule_id: boundary_supplier_linking
      applies_to: "purchased products"
      rule: "Link each purchased input to a dataset representative of identity, state, geography, technology, and time; supplier-controlled production remains upstream unless primary records support another boundary."
      source_ids: []
    - rule_id: boundary_direct_test_emissions
      applies_to: "fuel-fired factory testing"
      rule: "Include test fuel and direct combustion emissions only when fuel is burned inside the foreground; exclude upstream emissions represented by fuel-supply datasets."
      source_ids: []
