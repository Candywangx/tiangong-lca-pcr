allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "multifunctional foreground operations"
    rule: "Avoid allocation by subdividing independently metered operations and assigning material, energy, waste, and emission records to the declared equipment family. If subdivision is not practicable, assess system expansion before applying allocation."
    source_ids:
      - eu-jrc-pef-methods-2022
  - rule_id: allocation_physical_then_other
    applies_to: "residual shared burdens"
    rule: "After documented subdivision and system-expansion attempts, allocate remaining shared burdens using a causal physical relationship such as machine time, energy demand, or mass. Use another relationship only when no relevant physical relation exists, and disclose the rationale and sensitivity."
    source_ids:
      - eu-jrc-pef-methods-2022
  - rule_id: allocation_scrap_outputs
    applies_to: "steel, copper, and printed-board scrap"
    rule: "Report measured scrap as waste crossing the foreground boundary. Do not subtract an avoided burden from the foreground inventory; any recycling credit or burden belongs to an explicitly declared downstream model."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_core_fabrication_batch
      process_id: "core_fabrication_winding"
      flow_role: "electrical steel, magnet wire, industrial oxygen, electricity, steel scrap, copper scrap"
      record_type: "batch issue, meter, cylinder, invoice, and waste-transfer records"
      raw_fields: "product_model; batch_id; accepted_product_mass_kg; electrical_steel_kg; magnet_wire_kg; oxygen_m3; oxygen_reference_conditions; electricity_kwh; steel_scrap_kg; copper_scrap_kg; material_state; destination"
      collection_method: "reconcile calibrated scales and meters, material issues and returns, and waste transfer tickets to the same production batches"
      unit: "kg; m3; kWh"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full campaign for campaign production"
      site_scope: "every included fabrication and winding site"
      aggregation_rule: "sum attributable records, convert electricity to MJ, and divide by accepted net product mass"
      quality_evidence: "calibration records; invoices; issue and return records; batch genealogy; waste transfer tickets"
    - protocol_id: cp_electronic_assembly_batch
      process_id: "electronic_assembly"
      flow_role: "printed wire board, electricity, printed-board scrap"
      record_type: "batch issue, submeter, reject, and waste-transfer records"
      raw_fields: "product_model; batch_id; accepted_product_mass_kg; board_mass_kg; board_state; electricity_kwh; board_scrap_kg; destination"
      collection_method: "reconcile board issues, returns, rejects, submeter readings, and waste transfers to accepted units"
      unit: "kg; kWh"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full campaign"
      site_scope: "every included electronic-assembly site"
      aggregation_rule: "sum attributable records, convert electricity to MJ, and divide by accepted net product mass"
      quality_evidence: "scale and meter calibration; bill of materials; reject logs; waste transfer tickets"
    - protocol_id: cp_cleaning_batch
      process_id: "aqueous_cleaning_surface_prep"
      flow_role: "process water, sodium hydroxide, electricity, metal-bearing wastewater"
      record_type: "meter, tank-balance, chemical issue, analysis, and waste-transfer records"
      raw_fields: "product_model; batch_id; accepted_product_mass_kg; water_kg; sodium_hydroxide_solution_kg; sodium_hydroxide_mass_fraction; electricity_kwh; wastewater_kg_or_m3; density; pH; dissolved_metals; suspended_metals; treatment_state; destination"
      collection_method: "reconcile calibrated meters and tank balances with chemical issues, laboratory analyses, and wastewater transfer records"
      unit: "kg; kWh; mass fraction"
      frequency: "each batch or bath event with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full campaign"
      site_scope: "every included cleaning and surface-preparation site"
      aggregation_rule: "calculate contained sodium hydroxide, convert electricity to MJ and wastewater volume to mass only with recorded density, then divide by accepted net product mass"
      quality_evidence: "calibrations; supplier concentration certificate; bath logs; laboratory reports; transfer tickets"
    - protocol_id: cp_final_assembly_batch
      process_id: "final_assembly_test"
      flow_role: "final electricity and accepted finished equipment"
      record_type: "submeter, production release, weighing, test, and rework records"
      raw_fields: "product_model; configuration_revision; batch_id; accepted_units; accepted_net_mass_kg; rejected_mass_kg; rework_status; electricity_kwh; test_specification; test_result; packaging_condition"
      collection_method: "reconcile calibrated product scales and process submeters with release and acceptance-test records"
      unit: "kg; kWh"
      frequency: "each released batch with monthly reconciliation"
      temporal_coverage: "at least 12 representative months or the full campaign"
      site_scope: "every final-assembly and acceptance-test site"
      aggregation_rule: "convert electricity to MJ, exclude unresolved rejects and rework-in-progress, and normalize all included process totals to accepted net mass"
      quality_evidence: "scale and meter calibration; release records; test reports; configuration-controlled bill of materials"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = attributable process amount / accepted finished-equipment net mass"
      inputs:
        - "attributable row amount"
        - accepted_product_mass_kg
      output: "amount per 1 kg accepted finished equipment"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "all electricity rows"
      rule: "electricity_MJ = electricity_kWh × 3.6"
