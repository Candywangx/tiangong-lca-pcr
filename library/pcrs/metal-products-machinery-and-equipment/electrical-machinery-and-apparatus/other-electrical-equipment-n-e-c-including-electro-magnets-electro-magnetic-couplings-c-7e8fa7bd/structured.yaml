  data_quality_requirements:
    - id: dq_identity_configuration
      applies_to: "reference product and material inputs"
      requirement: "Maintain configuration-controlled product identity, bill of materials, material state, accepted-output mass, rated function, and test specification for every represented family."
      evidence: "released drawings; bill of materials; product data sheet; acceptance-test record"
    - id: dq_foreground_coverage
      applies_to: "all included processes"
      requirement: "Collect company-specific records for every known input and output under direct control; document zero or not-applicable route decisions and explain data gaps without merging atomic exchanges."
      evidence: "process map; meter map; purchasing ledger; material balance; waste and emission register; eu-jrc-pef-methods-2022"
    - id: dq_temporal_representativeness
      applies_to: "foreground records"
      requirement: "Cover at least 12 representative consecutive months, or the complete campaign when production is campaign-based; disclose shutdowns, commissioning, abnormal batches, and extrapolation."
      evidence: "dated batch, meter, production, and maintenance records"
    - id: dq_geography_technology
      applies_to: "foreground and background links"
      requirement: "Match site geography, process technology, material grade, component state, electricity supply, water source, and waste destination; disclose every mismatch and substitution."
      evidence: "supplier declarations; dataset metadata; site records"
    - id: dq_measurement_traceability
      applies_to: "measured and calculated rows"
      requirement: "Retain meter and scale identifiers, calibration status, raw units, conversion factors, concentration certificates, density records, allocation keys, and calculation version."
      evidence: "calibration certificates; raw extracts; calculation workbook audit trail"
    - id: dq_completeness_reconciliation
      applies_to: "each reporting period"
      requirement: "Reconcile purchased and issued materials, accepted output, inventory changes, returned materials, wastes, and known direct emissions; investigate material residuals and duplicate electricity coverage."
      evidence: "signed reconciliation and exception log"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail validation if the declared equipment type, model or family, rated function, configuration revision, net-mass method, manufacturing route, site, reporting period, test criteria, or factory-gate condition is missing."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_route_inventory
    applies_to: "process map and inventory"
    rule: "Require final assembly and acceptance testing. For every conditional route marked applicable, require its detailed atomic input and output records; for every route marked not applicable, require evidence of absence or an outsourced upstream dataset."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm public state code 100, exact English and Chinese baseName, flow type, classification, property, unit group, and reference unit. Reject proxies, lower-ranked duplicate identities, and unverified UUIDs."
    source_ids: []
  - rule_id: validate_reference_balance
    applies_to: "accepted product and normalization"
    rule: "Require accepted finished-equipment mass greater than zero, exclude rejects and rework-in-progress, and verify every normalized amount uses the same accepted net-mass denominator."
    source_ids: []
  - rule_id: validate_energy_overlap
    applies_to: "electricity rows"
    rule: "Verify submeter boundaries do not overlap between fabrication, electronic assembly, cleaning, and final assembly. Reconcile process totals to the site meter and explain residual shared electricity."
    source_ids: []
  - rule_id: validate_material_waste_balance
    applies_to: "material-bearing processes"
    rule: "Check issued material against accepted incorporated mass, returns, wastes, direct emissions, and inventory change. Flag unexplained residuals and inconsistent bare/populated board or insulated-wire states."
    source_ids:
      - eu-jrc-pef-methods-2022
  - rule_id: validate_unresolved_identities
    applies_to: "UUID-empty rows"
    rule: "Keep finished_equipment and metal_bearing_cleaning_wastewater UUIDs empty until an exact state-100 identity is directly verified; do not substitute a narrower finished product or generic wastewater."
    source_ids: []
  - rule_id: validate_comparison_limits
    applies_to: "downstream use"
    rule: "Reject comparative assertions between unlike equipment functions, rated performances, configurations, or service lives under this mass-based factory-gate rule."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configuration-declared cradle-to-gate foreground product dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Modelling the factory-gate supply of the declared electrical-equipment model or homogeneous family in a compatible process or lifecycle model; hotspot and improvement assessment within the declared boundary"
  excluded_use: "Comparative assertions between unlike equipment functions or lifetimes; generic representation of all CPC 46939 products without a declared configuration; substitution for permanent magnets, components sold separately, use-stage service, installation, or end-of-life"
  required_metadata: "canonical PCR id; product type and model or homogeneous family; rated function and principal performance; configuration and bill-of-material revision; net mass and accepted-output basis; site and geography; technology and route applicability; reporting period; background dataset identities; electricity supply; water source; chemical concentration; waste state and destination; allocation decisions; cutoff and infrastructure treatment; factory-gate packaging condition"
  required_quality_disclosure: "foreground coverage; temporal, geographical, and technological representativeness; meter and scale calibration; mass and energy reconciliation; data gaps; UUID gaps; background substitutions; outsourced steps; allocation and sensitivity; abnormal production; uncertainty and limitations"
  update_trigger: "Change in product function, configuration or bill of materials; manufacturing route, site, or technology; energy supply; cleaning chemistry; supplier or waste destination; allocation; background dataset; reporting period; or any change exceeding the study's materiality threshold"
