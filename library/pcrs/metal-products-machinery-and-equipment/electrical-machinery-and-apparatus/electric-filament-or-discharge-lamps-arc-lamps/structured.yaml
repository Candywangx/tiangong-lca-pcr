  classification_refs: "CPC 3.0: 46510 — Electric filament or discharge lamps; arc lamps (exact scope reference)"
  covered_products: "Complete filament lamps; fluorescent lamps; other gas-discharge lamps; arc lamps; route-declared special-purpose variants"
  excluded_products: "LED/OLED light sources and modules; luminaires and lighting fittings; portable self-powered lamps; illuminated signs; separate lamp parts; separate control gear; candles; filament and other intermediates"
