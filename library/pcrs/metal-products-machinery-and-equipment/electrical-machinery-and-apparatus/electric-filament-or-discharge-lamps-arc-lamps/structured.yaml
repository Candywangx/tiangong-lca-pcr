allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "route-specific and multi-product manufacturing"
    rule: "First subdivide metered processes and production records by filament, fluorescent, other discharge, arc, and integrated-control-gear route. Keep dedicated coating, dosing, electrode, arc-tube, ageing, and waste-treatment lines with their measured products."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: allocation_physical_relationship
    applies_to: "unavoidable shared utilities and processes"
    rule: "Where subdivision is not feasible, use the physical parameter that best represents causality: metered operating time or equipment load for energy, processed mass for handling, processed surface area for route-specific wet treatment when documented, and item count only when product size and mass are sufficiently homogeneous."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - us-epa-electrical-components-effluent-guidelines
  - rule_id: allocation_mass_weighted_mix
    applies_to: "category production mix"
    rule: "Aggregate route-specific results only by net mass of conforming saleable output during the same reporting period. Preserve every route result and its weight; do not use market share, sales revenue, lamp count, LED production, or a single product as an undisclosed proxy."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - welz-et-al-2011-lighting-lca
  - rule_id: allocation_recycling_no_credit
    applies_to: "manufacturing scrap and recovered material"
    rule: "Report treatment inputs and outputs within the manufacturing waste chain to the declared hand-off point. Do not subtract an avoided-burden recycling credit from the factory-gate inventory; any beyond-boundary credit belongs in a separately declared lifecycle scenario."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_batch
      process_id: "component_supply_envelope_preparation_route_assembly_processes_control_gear_integration"
      flow_role: "material and component input/output"
      record_type: "purchase, warehouse, bill-of-material, and batch issue records"
      raw_fields: "item id; route; supplier; opening/closing inventory; purchased; issued; returned; rejected; measured mass; lot"
      collection_method: "Reconcile warehouse and batch records to production orders and weigh representative components where records are count-based"
      unit: "kg and item"
      frequency: "Each batch, aggregated for reporting period"
      temporal_coverage: "Same reporting period as reference output"
      site_scope: "Every included production site and outsourced foreground operation"
      aggregation_rule: "Sum net accepted or issued mass by material, route, model, and site; normalize by route output mass"
      quality_evidence: "Calibrated scale records; inventory reconciliation; supplier specification; production order"
    - protocol_id: cp_transport_records
      process_id: "component_supply"
      flow_role: "inbound transport"
      record_type: "shipment and freight records"
      raw_fields: "origin; destination; mode; distance; delivered mass; payload; empty return rule"
      collection_method: "Use shipment documents and route distance evidence; separate modes and suppliers"
      unit: "tkm"
      frequency: "Each shipment, aggregated for reporting period"
      temporal_coverage: "Same reporting period as material receipt"
      site_scope: "All inbound flows included in foreground boundary"
      aggregation_rule: "Sum delivered tonnes multiplied by distance for each mode"
      quality_evidence: "Freight invoice; bill of lading; route evidence"
    - protocol_id: cp_water_chemical_batch
      process_id: "envelope_preparation"
      flow_role: "process water and chemicals"
      record_type: "meter, purchase, tank, and batch records"
      raw_fields: "substance; concentration; opening/closing stock; purchased; charged; recovered; discarded; meter reading"
      collection_method: "Reconcile meters and material balances to preparation batches"
      unit: "kg, m3, or L with density/concentration"
      frequency: "Each batch or meter interval"
      temporal_coverage: "Representative operating period covering included routes"
      site_scope: "Each preparation line and site"
      aggregation_rule: "Convert to substance mass; aggregate by route and normalize by prepared output mass"
      quality_evidence: "Calibrated meter; batch sheet; laboratory concentration; stock reconciliation"
    - protocol_id: cp_energy_meter
      process_id: "all_foreground_processes"
      flow_role: "electricity, fuel, and thermal energy"
      record_type: "sub-meter, utility, fuel, and equipment operating records"
      raw_fields: "carrier; meter start/end; fuel quantity; operating time; load; allocation driver; site"
      collection_method: "Prefer sub-metering; otherwise calculate from documented rated load and measured operating time with shared loads allocated causally"
      unit: "kWh or MJ"
      frequency: "Meter interval or production batch"
      temporal_coverage: "Representative operating period covering production variability"
      site_scope: "Each included site and process line"
      aggregation_rule: "Sum by carrier, process, route, and site; normalize by corresponding output"
      quality_evidence: "Meter calibration; utility invoice reconciliation; equipment log"
    - protocol_id: cp_fill_dose
      process_id: "filament_lamp_assembly"
      flow_role: "inert gas and halogen charge"
      record_type: "cylinder, dosing, and batch records"
      raw_fields: "substance; cylinder/tank mass; opening/closing stock; charged quantity; recovered quantity; batch; model"
      collection_method: "Gravimetric or validated dosing-system balance"
      unit: "kg, g, or mg converted to kg"
      frequency: "Each batch"
      temporal_coverage: "Same reporting period as route output"
      site_scope: "Each dosing line and site"
      aggregation_rule: "Net charged mass divided by accepted route output mass"
      quality_evidence: "Dosing calibration; cylinder weigh ticket; batch reconciliation"
    - protocol_id: cp_mercury_fill_balance
      process_id: "fluorescent_lamp_assembly_discharge_arc_lamp_assembly"
      flow_role: "mercury and other fill-material input, product content, recovery, waste, and loss"
      record_type: "secure inventory, dosing, product test, recovery, waste, and release records"
      raw_fields: "substance; opening/closing inventory; purchased; charged; product-contained; recovered; waste; air release; water release; unaccounted balance; batch; route"
      collection_method: "Closed material balance with calibrated dosing and independent waste/release records"
      unit: "kg, g, or mg converted to kg"
      frequency: "Each batch with period reconciliation"
      temporal_coverage: "Same reporting period as route output"
      site_scope: "Every included mercury or metal-vapour dosing operation"
      aggregation_rule: "Input plus opening stock minus closing stock equals product content plus recovery, waste, and environmental releases; investigate residual"
      quality_evidence: "Dosing calibration; secure inventory; product assay or engineering dose verification; waste manifest; release monitoring"
    - protocol_id: cp_production_output
      process_id: "all_foreground_processes"
      flow_role: "accepted intermediate and saleable output"
      record_type: "production order, count, mass, quality release, and transfer records"
      raw_fields: "route; subtype; model; count; gross/net mass; packaging mass; accepted; rejected; transfer; release status"
      collection_method: "Weigh output or apply a validated route/model count-to-mass factor with periodic re-weighing"
      unit: "kg and item"
      frequency: "Each batch or shift"
      temporal_coverage: "Same reporting period as inventory inputs"
      site_scope: "Every included site and route"
      aggregation_rule: "Sum accepted net mass by route/model; retain reject mass and reconcile transfers"
      quality_evidence: "Calibrated scale; release record; count-to-mass sample"
    - protocol_id: cp_waste_log
      process_id: "all_foreground_processes"
      flow_role: "waste and rejects"
      record_type: "waste log, scale ticket, hazardous-waste manifest, and treatment receipt"
      raw_fields: "process; route; substance/material; hazardous code; mass; destination; recovery/treatment; date"
      collection_method: "Weigh at hand-off and reconcile internal reject records to external receipts"
      unit: "kg"
      frequency: "Each waste movement, aggregated for reporting period"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Every included site and contractor hand-off"
      aggregation_rule: "Sum by process, route, material, hazard class, and destination"
      quality_evidence: "Scale ticket; manifest; contractor receipt; internal reject record"
    - protocol_id: cp_release_monitoring
      process_id: "envelope_preparation_fluorescent_discharge_arc_assembly_finishing_testing_packaging"
      flow_role: "emissions to air and water"
      record_type: "stack, workplace capture, wastewater, permit, incident, and mass-balance records"
      raw_fields: "substance; compartment; concentration; flow; duration; method; detection limit; incident quantity; calculation inputs"
      collection_method: "Use direct monitoring where required; otherwise apply a documented calculation to collected activity records and reconcile mercury-bearing releases"
      unit: "kg substance"
      frequency: "Monitoring event, batch, or permit interval"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Every included direct emission point and incident"
      aggregation_rule: "Sum mass by substance, compartment, process, route, and site"
      quality_evidence: "Laboratory report; calibrated monitor; permit report; incident record; calculation audit"
    - protocol_id: cp_finishing_test_packaging
      process_id: "finishing_testing_packaging"
      flow_role: "finishing material, test energy, packaging, and release performance"
      record_type: "bill of material, packaging specification, meter, test, ageing, and quality-release records"
      raw_fields: "model; route; finishing material; packaging material/mass; test electricity; burn-in time; rated power; luminous flux; CRI; CCT/spectrum; rated life; cap/interface; pass/fail"
      collection_method: "Link finishing and test records to released production lots and weigh supplied packaging separately"
      unit: "kg, kWh, W, lm, h, K, and declared test units"
      frequency: "Each lot, aggregated for reporting period"
      temporal_coverage: "Same reporting period as saleable output"
      site_scope: "Every finishing and release-test operation"
      aggregation_rule: "Sum inventory flows by lot and mass-weight performance qualifiers only when a mix is explicitly reported"
      quality_evidence: "Test equipment calibration; packaging weigh record; release certificate; product specification"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "Normalized amount = reporting-period process amount / reporting-period net mass of conforming saleable complete lamps attributable to that process and route."
      inputs:
        - "Process amount"
        - "accepted route output mass"
        - "transfer and reject reconciliation"
      output: "Amount per 1 kg net saleable complete lamps"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_count_to_mass
      applies_to: "count-based lamp and component records"
      rule: "Mass = accepted count × measured mean net mass per item for the same route, model, site, and reporting period; update the factor after a design or supplier change."
      inputs:
        - Count
        - "sampled item masses"
        - "model and route identifiers"
      output: "kg and documented conversion factor"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_material_balance
      applies_to: "materials and components"
      rule: "Net consumed mass = opening inventory + receipts − closing inventory − returns − recovered material transferred out; reconcile against product, waste, and measured release terms."
      inputs:
        - Inventory
        - purchase
        - return
        - recovery
        - product
        - waste
        - "and release records"
      output: "Net material input and balance residual"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_mercury_balance
      applies_to: "mercury-bearing routes"
      rule: "Mercury input + opening stock − closing stock = product-contained mercury + recovered mercury + mercury in waste + air release + water release + documented residual. A negative or unexplained residual fails validation."
      inputs:
        - "Secure mercury inventory"
        - dose
        - "product content"
        - recovery
        - waste
        - "release records"
      output: "Route-specific mercury inventory and residual"
      source_ids:
        - eu-mercury-regulation-2017-852-consolidated
        - us-epa-mercury-emissions-lamp-manufacture
    - id: calc_route_mix
      applies_to: "mixed category dataset"
      rule: "Mixed amount = sum(route normalized amount × route net saleable mass) / sum(route net saleable mass). Publish route weights and separate route results with the aggregate."
      inputs:
        - "Route-specific normalized results"
        - "route net saleable masses"
      output: "Mass-weighted category production mix"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - welz-et-al-2011-lighting-lca
    - id: calc_transport_service
      applies_to: "inbound transport"
      rule: "Transport service = delivered mass in tonnes × route distance in km for each mode and shipment; sum by mode."
      inputs:
        - "Shipment mass"
        - distance
        - mode
      output: "tkm by transport mode"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_emission_from_monitoring
      applies_to: "monitored releases"
      rule: "Released mass = measured concentration × measured flow × duration, with unit conversions and below-detection treatment declared; incident quantities are added separately."
      inputs:
        - Concentration
        - flow
        - duration
        - "detection limit"
        - "incident record"
      output: "kg substance by compartment"
      source_ids:
        - us-epa-mercury-emissions-lamp-manufacture
        - us-epa-electrical-components-effluent-guidelines
  data_quality_requirements:
    - id: dq_identity_scope
      applies_to: "reference product and route"
      requirement: "Demonstrate that output is a complete filament, fluorescent, other discharge, or arc lamp, not an LED/OLED source, luminaire, part, separate control gear, candle, or filament intermediate."
      evidence: "Product specification, CPC scope record, bill of materials, route declaration, product photograph or drawing"
    - id: dq_temporal
      applies_to: "foreground records"
      requirement: "Use one consistent, representative reporting period; state dates, shutdowns, missing intervals, abnormal campaigns, and any adjustment."
      evidence: "Meter coverage report, production calendar, reconciliation statement"
    - id: dq_geographic
      applies_to: "foreground and secondary data"
      requirement: "Identify every production site and supplier geography; document geographic substitutions for upstream datasets and energy mixes."
      evidence: "Site list, supplier record, dataset metadata, electricity-source record"
    - id: dq_technology
      applies_to: "all route-specific data"
      requirement: "Preserve technology route, subtype, envelope/arc-tube material, fill formulation, integrated-control-gear state, and relevant process configuration. Do not transfer data between routes without a documented engineering equivalence review."
      evidence: "Route matrix, process-flow diagram, bill of materials, equipment list, equivalence review"
    - id: dq_completeness
      applies_to: "mass, energy, water, waste, and releases"
      requirement: "Reconcile purchased/issued material, product, rejects, waste, recovery, releases, and inventory changes; document cut-offs and never use cut-off to omit hazardous or environmentally significant constituents."
      evidence: "Material balances, utility reconciliation, waste manifests, release report, cut-off register"
    - id: dq_hazardous_materials
      applies_to: "mercury, phosphors, metal halides, sodium, electrode coatings, acids, and solvents"
      requirement: "Retain substance identity, concentration or dose, batch linkage, recovery, waste destination, and environmental releases. Regulatory thresholds may be QA checks but shall not replace measured foreground quantities."
      evidence: "Safety data sheet, dosing record, laboratory result, secure inventory, waste manifest, permit report"
    - id: dq_performance
      applies_to: "required qualifiers"
      requirement: "Link rated power, luminous flux, CRI, CCT/spectrum, rated life/test basis, cap/interface, and application to the same product model and production lot represented by the inventory."
      evidence: "Product specification, calibrated release-test result, lot linkage"
    - id: dq_secondary_data
      applies_to: "upstream datasets"
      requirement: "Select the most representative verified dataset available and assess temporal, geographic, and technological representativeness, completeness, consistency, reproducibility, source, and uncertainty."
      evidence: "Dataset quality assessment and substitution log"
    - id: dq_uncertainty
      applies_to: "calculated and allocated values"
      requirement: "Document meter accuracy, sampling variation, count-to-mass variation, allocation drivers, below-detection treatment, and balance residuals; identify material contributors to uncertainty."
      evidence: "Calibration certificates, sample statistics, calculation workbook, uncertainty statement"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require flow UUID 73b0a95f-d108-410a-ba2e-fac299a73970, Product flow, state 100 identity evidence, CPC 46510 scope, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids: []
  - rule_id: validate_product_exclusions
    applies_to: "product identity"
    rule: "Fail if the reference output is an LED/OLED light source or module, luminaire, lighting fitting, portable self-powered lamp, illuminated sign, lamp part, separate control gear, candle, tungsten filament, or other intermediate."
    source_ids:
      - eu-ecodesign-light-sources-2019-2020
  - rule_id: validate_route_declared
    applies_to: "every foreground package"
    rule: "Require exactly one declared route for a route-specific package, or a complete route list with mass weights for a mixed package. At least one matching conditional route process must be present."
    source_ids:
      - eu-ecodesign-light-sources-2019-2020
      - us-epa-electrical-components-effluent-guidelines
  - rule_id: validate_no_single_route_proxy
    applies_to: "mixed category dataset"
    rule: "Fail a category-wide claim if any filament, fluorescent, other discharge, or arc route in scope is represented by LED, luminaire, component, or another lamp route without separately measured data and an explicit review decision."
    source_ids:
      - welz-et-al-2011-lighting-lca
  - rule_id: validate_reference_amount
    applies_to: "saleable output"
    rule: "Require exactly 1 kg net saleable complete lamp mass after normalization; supplied packaging mass shall be reported separately."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_process_transfer_balance
    applies_to: "process map"
    rule: "Require every included process output transferred to the next process to reconcile with next-process input, rejects, inventory change, and any external transfer."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: validate_material_completeness
    applies_to: "manufacturing inventory"
    rule: "Require route-specific records for major materials/components, energy, water and chemicals where used, fill materials, packaging, saleable output, rejects, wastes, and direct releases. Missing items require a justified not-applicable or documented cut-off decision."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
      - us-epa-electrical-components-effluent-guidelines
  - rule_id: validate_mercury_balance
    applies_to: "fluorescent and mercury-bearing discharge or arc routes"
    rule: "Require a non-negative, reconciled mercury balance and substance-specific air, water, product, recovery, and waste terms. A regulatory maximum is not accepted as the foreground amount."
    source_ids:
      - eu-mercury-regulation-2017-852-consolidated
      - us-epa-mercury-emissions-lamp-manufacture
  - rule_id: validate_integrated_control_gear
    applies_to: "self-ballasted or integrated products"
    rule: "Require integrated control-gear mass and assembly inventory when present; fail if separate control gear or an entire luminaire is included in the reference product."
    source_ids:
      - eu-ecodesign-light-sources-2019-2020
  - rule_id: validate_data_quality
    applies_to: "foreground and secondary evidence"
    rule: "Require reporting-period, site, route, calibration, completeness, source, representativeness, allocation, and uncertainty evidence sufficient for independent reproduction."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after review and publication"
  downstream_use: "Manufacturing-stage input for product LCAs, EPD/PEP studies, procurement footprints, building or public-lighting lifecycle models, and technology-specific scenario analysis"
  allowed_use: "Route-specific factory-gate modelling; disclosed mass-weighted production mixes; connection to separate distribution, use, maintenance, and end-of-life scenarios"
  excluded_use: "Direct comparison of lighting service without a separate lumen/lifetime/use model; representation of LED or luminaires; category-wide use of one lamp route or model as proxy; undisclosed regulatory compliance claims; use of regulatory thresholds as measured inventory"
  required_metadata: "PCR id and version; reference flow UUID/property/unit group; route and subtype; product and packaging mass; count-to-mass factor; integrated-control-gear state; envelope/arc-tube, electrode, fill and phosphor descriptors; rated power, luminous flux, CRI, CCT/spectrum and life/test basis; sites; geography; reporting period; route weights; upstream datasets; cut-offs; allocation; direct releases; waste destinations"
  required_quality_disclosure: "Foreground record coverage; meter and scale calibration; material and mercury balance residuals; route representativeness; supplier and secondary-data substitutions; below-detection treatment; uncertainty; missing support-flow UUIDs; excluded downstream stages"
  update_trigger: "Product formulation or route change; mercury/additive change; envelope, electrode, phosphor, fill, cap or control-gear redesign; material or energy change; supplier/site/geography change; process or abatement change; regulatory restriction change; material change in route mix, data quality, or reference-flow identity"
