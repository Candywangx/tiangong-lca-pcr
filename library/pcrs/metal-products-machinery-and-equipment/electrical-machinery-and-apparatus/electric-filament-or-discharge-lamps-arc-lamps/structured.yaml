functional_unit:
  what: "Manufacture of complete electric filament, fluorescent, other gas-discharge, or arc lamps at the factory gate"
  how_much: "1 kg net mass of saleable complete lamps, excluding packaging mass"
  how_well: "Lamps meet the declared product specification and release tests for the declared route; rated luminous flux, power, lifetime basis, colour characteristics, cap/interface, application, and integrated-control-gear status are recorded"
  how_long_or_cycle: "One representative production reporting period; product lifetime and lighting service are qualifiers, not part of the 1 kg manufacturing reference amount"
  reference_flow_link: "saleable_complete_lamps"
system_boundary:
  rules:
    - rule_id: boundary_manufacturing_stage
      applies_to: "foreground manufacturing boundary"
      rule: "Include production and inbound transport of materials and components, envelope preparation, route-specific lamp fabrication, assembly, integrated control gear when supplied as part of the lamp, finishing, ageing and release testing, primary and secondary packaging, factory utilities, emissions, wastewater, rejects, and manufacturing-waste treatment to the declared hand-off point."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - us-epa-electrical-components-effluent-guidelines
    - rule_id: boundary_route_separation
      applies_to: "technology coverage"
      rule: "Model filament, fluorescent, other gas-discharge, and arc-lamp operations as distinct strata. A mixed dataset shall retain route results and use measured production mass for aggregation. LED or luminaire data shall not fill a missing route."
      source_ids:
        - eu-ecodesign-light-sources-2019-2020
        - welz-et-al-2011-lighting-lca
    - rule_id: boundary_hazardous_materials
      applies_to: "mercury and other hazardous or scarce constituents"
      rule: "Include trace fill materials, phosphors, electrode coatings, cleaning agents, mercury losses and captured residues regardless of ordinary mass cut-off when they may be hazardous or environmentally significant."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - eu-mercury-regulation-2017-852-consolidated
        - eu-mercury-products-inventory-2019
    - rule_id: boundary_downstream_exclusion
      applies_to: "distribution, installation, use, and end-of-life"
      rule: "Exclude downstream stages from this manufacturing reference dataset; if they are added in a lifecycle model, use separate route- and geography-specific scenarios and do not merge them into the factory-gate inventory."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - us-epa-universal-waste-lamps
boundary_abstraction:
  declared_starting_condition: "Purchased raw materials, components, subassemblies, fill materials, process chemicals, utilities, and packaging arrive at the foreground manufacturing boundary with route and supplier dataset identity declared"
  starting_condition_role: "Cradle-to-gate upstream inputs to complete-lamp manufacturing"
  product_classification_scope: "Complete products within the semantic scope of electric filament or discharge lamps and arc lamps; no LED, luminaire, part, or single-route proxy"
  recursive_input_rule: "A purchased complete lamp within this same category is recorded as an upstream product input with its own route-specific dataset and is not re-expanded inside the receiving foreground process"
  upstream_dataset_requirement: "Use supplier-specific datasets where available; otherwise use technologically, geographically, and temporally representative secondary datasets and disclose substitutions"
  disclosure: "Declare included production sites, route shares, upstream dataset choices, cut-offs, allocation, packaging treatment, mercury and hazardous-substance handling, and all excluded life-cycle stages"
