measurement_rules:
  - id: reference_mass
    applies_to: "saleable complete lamp output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all manufacturing inputs and outputs to 1 kg net saleable lamp mass. Packaging is measured separately and is not included in the 1 kg denominator."
  - id: count_to_mass
    applies_to: "production records reported as lamp count"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert count to mass using route-, model-, and reporting-period-specific measured net mass per lamp; retain the sample and weighing record."
  - id: energy_preservation
    applies_to: "electricity, fuel, and thermal energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve measured energy carriers and units, convert only with documented factors, and report test/ageing energy separately when it is sub-metered or calculated."
  - id: mercury_and_fill_dose
    applies_to: "mercury, metal halides, sodium, noble gases, and other fill materials"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record actual batch input and product dose by route; do not infer a zero value from another route or from a regulatory threshold. Convert mg or g records to kg without rounding away trace quantities."
  - id: performance_qualifiers
    applies_to: "product release and route identity"
    required_property_ref:
      name: "Route-specific declared property"
      uuid: ""
    required_unit: "declared test unit"
    rule: "Retain rated power, useful luminous flux, CRI, CCT or spectrum, rated life and test basis as qualifiers; do not convert the 1 kg manufacturing reference into lumen-hours without a separately declared comparative-use model."
