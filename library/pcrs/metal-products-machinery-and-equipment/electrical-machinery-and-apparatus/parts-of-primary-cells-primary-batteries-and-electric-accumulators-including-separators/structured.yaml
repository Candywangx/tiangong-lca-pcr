  - rule_id: validation_emission_scope
    applies_to: "direct elementary flows"
    rule: "Direct lead, sulfuric acid mist, NMP, and fossil CO2 rows shall be included only when the emitting operation occurs inside the foreground boundary; upstream electricity and purchased-input emissions shall remain in linked upstream datasets."
    source_ids:
      - hawley-li-ion-electrode-manufacturing-2019
      - us-epa-ap42-storage-battery-production-1995
  - rule_id: validation_unresolved_identity
    applies_to: "UUID-empty rows"
    rule: "UUID-empty rows are review-required and shall not be silently mapped to broader, differently classified, differently measured, or wrong-compartment candidates."
