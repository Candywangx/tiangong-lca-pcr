allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "mixed part families and technologies"
    rule: "Subdivide separator, electrode, grid, and plate routes and separately meter route-specific material, energy, waste, and emission flows before applying allocation."
    source_ids: []
  - rule_id: allocation_common_services
    applies_to: "common utilities and pollution controls"
    rule: "Allocate only genuinely common services using a documented causal driver such as metered energy, machine time, exhaust volume, treated mass, or accepted dry output mass; do not allocate by revenue when a physical causal driver is available."
    source_ids: []
  - rule_id: allocation_scrap_and_recovery
    applies_to: "scrap, recovered solvent, and internal recycle"
    rule: "Report off-site scrap and recovered solvent as separate outputs without netting them against gross material inputs. Internal recycle does not cross the system boundary; record the associated on-site energy and losses and disclose the recycle loop."
    source_ids:
      - hawley-li-ion-electrode-manufacturing-2019
      - us-epa-ap42-storage-battery-production-1995
  - rule_id: allocation_unavoidable_choice
    applies_to: "residual multi-output allocation"
    rule: "When subdivision and causal allocation cannot resolve a residual burden, use dry output mass, disclose the affected flows and allocation fraction, and test a plausible alternative driver in sensitivity analysis."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_separator_records
      process_id: "separator_manufacturing"
      flow_role: "all separator inputs, accepted output, offcut waste, and direct emissions"
      record_type: "batch issue records; utility meters; weighbridge or waste manifests; release inspection; stack or facility emission records"
      raw_fields: "material identity; supplier; lot; opening and closing stock; issued mass; returned mass; electricity; gas volume and reference conditions; water; accepted dry output; offcut mass; direct CO2; route and coating state"
      collection_method: "reconcile purchasing and inventory movements to batch records; read dedicated meters or allocate documented common meters; weigh accepted and rejected web; use verified direct-emission records"
      unit: "kg; MJ; m3"
      frequency: "each batch with monthly aggregation"
      temporal_coverage: "representative consecutive production period, normally at least 12 months or the full shorter campaign"
      site_scope: "all on-site operations serving the declared separator route"
      aggregation_rule: "subtract documented returns and stock change from gross issues; normalize each exchange by accepted dry separator mass; keep dry and wet routes separate"
      quality_evidence: "calibrated meter and scale records; material certificates; batch sheets; release test results; waste transfer records; emission-monitoring or verified inventory records"
    - protocol_id: cp_electrode_records
      process_id: "lithium_ion_electrode_manufacturing"
      flow_role: "all electrode inputs, accepted outputs, offcut waste, NMP emission, and direct CO2"
      record_type: "formulation and batch records; foil issue records; meters; solvent recovery logs; reject logs; release inspection; air-emission records"
      raw_fields: "polarity; chemistry; dry ingredients; solvent; foil type and mass; electricity; gas; water; recovered NMP; waste solvent; accepted dry electrode; offcut mass; NMP to air; direct CO2"
      collection_method: "reconcile weighed formulation and foil records with inventory change; meter utilities; reconcile solvent input, recovery, waste, retained solvent, stock change, and measured release; weigh accepted and rejected electrode"
      unit: "kg; MJ; m3"
      frequency: "each batch and roll with monthly aggregation"
      temporal_coverage: "representative consecutive production period, normally at least 12 months or the full shorter campaign"
      site_scope: "all on-site operations serving the declared electrode route, including allocated dry-room and recovery services"
      aggregation_rule: "keep cathode and anode, chemistry, solvent route, and current collector separate; normalize by accepted dry electrode mass"
      quality_evidence: "calibrated scales and meters; formulation certificates; coating and drying logs; solvent-recovery balance; release tests; waste manifests; emission records"
    - protocol_id: cp_lead_part_records
      process_id: "lead_acid_grid_plate_manufacturing"
      flow_role: "all lead-part inputs, accepted outputs, scrap, lead emission, acid mist, and direct CO2"
      record_type: "melt and casting logs; paste recipes; acid and water records; meters; curing or formation logs; scrap records; release inspection; emission records"
      raw_fields: "alloy composition and mass; lead oxide; acid mass and concentration; barium sulfate; carbon black; water; electricity; gas reference conditions; accepted grid or plate mass; plate polarity and state; lead scrap; lead to air; acid mist; direct CO2"
      collection_method: "reconcile material issues and stock change; read meters; weigh accepted product and off-site scrap; use route-specific measured emissions after controls"
      unit: "kg; MJ; m3"
      frequency: "each batch with monthly aggregation"
      temporal_coverage: "representative consecutive production period, normally at least 12 months or the full shorter campaign"
      site_scope: "all on-site operations serving the declared grid or plate route and its controls"
      aggregation_rule: "separate cast and stamped grids, positive and negative pastes, and formed and unformed plate states; normalize by accepted dry grid or plate mass"
      quality_evidence: "calibrated scales and meters; alloy and chemical certificates; batch and cure records; release tests; waste manifests; stack-test or verified emission records"
  calculation_rules:
    - id: calc_normalize_accepted_mass
      applies_to: "all collected inventory rows"
      rule: "normalized exchange = reporting-period exchange crossing the boundary / reporting-period accepted dry product mass"
      inputs:
        - "reconciled exchange quantity"
        - "accepted product mass"
      output: "exchange per 1 kg accepted product"
      source_ids: []
    - id: calc_inventory_reconciliation
      applies_to: "purchased materials and solvents"
      rule: "consumed input = opening stock + receipts - closing stock - documented returns; report gross boundary input before subtracting internal recovery"
      inputs:
        - "stock records"
        - "purchase receipts"
        - returns
        - "internal recovery logs"
      output: "reconciled input mass"
      source_ids: []
    - id: calc_common_meter_allocation
      applies_to: "common utility meters"
      rule: "allocated utility = common-meter quantity × documented causal share; causal shares shall sum to one over the meter boundary"
      inputs:
        - "common-meter reading"
        - "route driver totals"
      output: "route-specific electricity, gas, or water"
      source_ids: []
    - id: calc_output_and_scrap_balance
      applies_to: "accepted product and solid scrap"
      rule: "reconcile input solids with accepted output, off-site scrap, captured residues, retained process material, and documented stock change; investigate unexplained imbalance rather than assigning it to a generic waste row"
      inputs:
        - "material issues"
        - "accepted output"
        - scrap
        - residues
        - "stock change"
      output: "disclosed mass-balance closure"
      source_ids: []
    - id: calc_solvent_balance
      applies_to: "NMP and wet-separator process oil"
      rule: "reconcile fresh input, recovered internal recycle, off-site waste, residual product retention, air release, and stock change without double counting internal recycle as a boundary flow"
      inputs:
        - "solvent or process-oil input"
        - recovery
        - waste
        - "retained mass"
        - "air emission"
        - "stock change"
      output: "disclosed solvent balance"
      source_ids:
        - hawley-li-ion-electrode-manufacturing-2019
        - mun-won-polyolefin-separator-manufacturing-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and route outputs"
      requirement: "Declare part family, polarity where relevant, chemistry, material construction, dimensions, dry or wet process, formed or unformed state, specification, and accepted-product mass."
      evidence: "Product specification; bill of materials; release inspection; batch and lot traceability"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Cover a representative consecutive period, normally 12 months; if a shorter campaign is used, disclose dates, production volume, startup effects, and seasonality limitation."
      evidence: "Meter dates; batch records; production calendar; explanation of exclusions"
    - id: dq_completeness
      applies_to: "all route exchanges"
      requirement: "Reconcile purchased inputs, accepted output, internal recycle, off-site waste, and direct emissions; document every excluded operation and zero row as not applicable rather than silently omitting it."
      evidence: "Mass and solvent balances; meter reconciliation; waste manifests; emission records"
    - id: dq_meter_allocation
      applies_to: "shared services"
      requirement: "Identify the physical meter boundary and causal allocation driver; report the share assigned to the selected route and retain evidence that shares sum to one."
      evidence: "Meter map; driver records; allocation worksheet"
    - id: dq_uuid_and_localization
      applies_to: "Tiangong references"
      requirement: "Use only directly verified state-100 UUIDs and exact Tiangong Chinese baseNames. Keep unresolved rows UUID-empty until an exact identity, classification, property, unit group, product state, and compartment are confirmed."
      evidence: "Finalized UUID-search receipts; direct-read identity records; unresolved manifest entries"
    - id: dq_range_status
      applies_to: "important inventory amounts"
      requirement: "Treat all amounts as foreground requirements. No external empirical range is approved until at least two independent original sources with compatible boundary, reference unit, and product state support a synthesis."
      evidence: "Foreground records; manifest range-evidence needs; future source review"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "reference flow"
    rule: "The separator route shall report exactly 1 kg accepted Battery Separator as the reference output and shall exclude offcut, reject, moisture-basis, and outbound packaging mass from that amount. A non-separator product shall not use the separator UUID."
    source_ids: []
  - rule_id: validation_route_exclusivity
    applies_to: "process selection"
    rule: "At least one declared route shall apply, and every included process and row shall match the declared part family, chemistry, polarity, material, and technology; unrelated conditional rows shall be marked not applicable."
    source_ids: []
  - rule_id: validation_atomic_flows
    applies_to: "process inventory"
    rule: "Each inventory card shall represent one atomic exchange with direction, flow type, property, unit, amount source, basis, evidence, and applicable route; combined utilities, materials, wastes, or emission groups fail validation."
    source_ids: []
  - rule_id: validation_mass_and_solvent_balance
    applies_to: "foreground calculations"
    rule: "The data package shall present accepted-output, solid-material, and applicable solvent balances and explain material imbalances rather than assigning them to unspecified losses."
