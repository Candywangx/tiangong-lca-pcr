    decision: promote_legacy
    basis: "A distinct methodology is needed for separately supplied, ready-for-assembly battery parts because their foreground conversion processes differ from complete battery manufacture and from upstream active-material production."
    existing_material_pcr_review: "The material electric-accumulators PCR covers complete accumulators, not the separately marketed parts boundary; the related primary-cell record remains an empty scaffold."
    reference_product_constraint: "The confirmed Battery Separator reference flow is valid only for separator datasets. Non-separator part outputs must not reuse that UUID and remain unresolved until an exact public product flow is approved."
