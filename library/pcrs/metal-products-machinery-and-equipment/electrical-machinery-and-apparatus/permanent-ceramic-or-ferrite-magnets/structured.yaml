                - ec-ceramic-bref-2007
            ranges: []
allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Multi-product equipment and shared operations"
    rule: "First avoid allocation by subdivision, separate metering, campaign records, or expansion where appropriate. Record the isolated inputs and outputs attributable to the declared magnet product."
    source_ids:
      - iso-14044-2006
      - eu-pef-2021-2279
  - rule_id: allocation_physical
    applies_to: "Shared burdens that cannot be subdivided"
    rule: "Allocate by a documented causal physical relationship, such as equipment time, metered energy, throughput, or treated mass, when it represents the burden driver. Do not automatically allocate all burdens by product mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other
    applies_to: "No defensible physical relationship"
    rule: "Use another relationship, including economic allocation only as a last documented choice; disclose prices, period, products, rationale, and a sensitivity result against a plausible physical basis."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: recycle_and_rework
    applies_to: "Internal powder, trim, rejects, and rework"
    rule: "Subtract only the quantity demonstrably returned to the same foreground process from external waste output. Retain the energy, water, emissions, and losses caused by recovery and reprocessing; do not credit internal recycle as an avoided virgin product."
    source_ids:
      - ec-ceramic-bref-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_powder_materials
      process_id: "ferrite_powder_preparation"
      flow_role: "precursor materials and additives"
      record_type: "purchase, warehouse issue, return, and formulation records"
      raw_fields: "material id; supplier lot; chemistry; moisture basis; gross issue; return; unit"
      collection_method: "reconcile calibrated scales and inventory transactions to each powder lot"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all on-site powder lines in scope"
      aggregation_rule: "net issued mass by material divided by released powder mass"
      quality_evidence: "calibration records; supplier specification; inventory reconciliation"
    - protocol_id: cp_powder_utilities
      process_id: "ferrite_powder_preparation"
      flow_role: "electricity, fuels, and water"
      record_type: "meters, fuel invoices, and operating logs"
      raw_fields: "meter id; start/end reading; fuel quantity; water withdrawal; recirculation; operating hours"
      collection_method: "direct submetering preferred; otherwise apply calc_shared_energy"
      unit: "kWh; MJ; m3"
      frequency: "continuous or each batch; monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "included powder preparation and controls"
      aggregation_rule: "sum by utility, subtract verified exports, normalize to released powder"
      quality_evidence: "meter calibration; invoice reconciliation; allocation log"
    - protocol_id: cp_powder_outputs
      process_id: "ferrite_powder_preparation"
      flow_role: "powder output, residues, wastewater, and emissions"
      record_type: "scale tickets, transfer logs, waste manifests, stack/discharge tests"
      raw_fields: "powder mass; dry basis; residue mass; destination; wastewater volume; substance; concentration; flow rate"
      collection_method: "weigh outputs and use validated monitoring or regulatory calculation for emissions"
      unit: "kg; m3"
      frequency: "each transfer; monitoring frequency required by permit"
      temporal_coverage: "full reporting period"
      site_scope: "included powder line and control devices"
      aggregation_rule: "aggregate by output, destination, substance, and compartment"
      quality_evidence: "scale calibration; chain of custody; laboratory and permit reports"
    - protocol_id: cp_sintered_inputs
      process_id: "sintered_forming_and_firing"
      flow_role: "powder, aids, water, electricity, and fuels"
      record_type: "batch sheets, warehouse issues, meters, and kiln logs"
      raw_fields: "powder lot; additive; water; meter readings; fuel; press route; orientation; kiln cycle"
      collection_method: "reconcile batch recipe and utility records to released blank lots"
      unit: "kg; kWh; MJ; m3"
      frequency: "each batch or kiln cycle"
      temporal_coverage: "full reporting period"
      site_scope: "all included sintered lines"
      aggregation_rule: "aggregate by declared product grade and route before normalization"
      quality_evidence: "recipe approval; meter calibration; kiln trace"
    - protocol_id: cp_sintered_outputs
      process_id: "sintered_forming_and_firing"
      flow_role: "blanks, rejects, waste, wastewater, and emissions"
      record_type: "transfer weights, reject logs, waste manifests, monitoring records"
      raw_fields: "blank mass; reject stage; recycle mass; waste destination; wastewater; emitted substance"
      collection_method: "weigh transfers and losses; calculate monitored emissions from retained raw measurements"
      unit: "kg; m3"
      frequency: "each batch or transfer; monitoring frequency required by permit"
      temporal_coverage: "full reporting period"
      site_scope: "all included sintered lines and controls"
      aggregation_rule: "aggregate separately by product, recycle, treatment route, substance, and compartment"
      quality_evidence: "scale calibration; mass reconciliation; laboratory and permit reports"
    - protocol_id: cp_bonded_inputs
      process_id: "bonded_compounding_and_forming"
      flow_role: "ferrite powder, binder, additives, and energy"
      record_type: "formulation, issue, return, meter, and machine logs"
      raw_fields: "powder lot; binder type; additive; issued/returned mass; machine energy; cycle or run time"
      collection_method: "reconcile approved formulation and measured consumption to each product run"
      unit: "kg; kWh; MJ"
      frequency: "each compounding or forming run"
      temporal_coverage: "full reporting period"
      site_scope: "all included bonded-magnet lines"
      aggregation_rule: "aggregate by formulation and forming route before normalization"
      quality_evidence: "formulation approval; supplier specification; meter and scale calibration"
    - protocol_id: cp_bonded_outputs
      process_id: "bonded_compounding_and_forming"
      flow_role: "blanks, purge, trim, rejects, and emissions"
      record_type: "transfer weights, scrap logs, recycling records, monitoring records"
      raw_fields: "accepted blank mass; purge; trim; reject; recycle; destination; substance; concentration"
      collection_method: "weigh all material outputs and calculate emissions from retained measurements"
      unit: "kg"
      frequency: "each run or transfer; monitoring frequency required by permit"
      temporal_coverage: "full reporting period"
      site_scope: "all included bonded-magnet lines and controls"
      aggregation_rule: "aggregate separately by output, recycle, waste route, substance, and compartment"
      quality_evidence: "scale calibration; scrap reconciliation; laboratory or permit report"
    - protocol_id: cp_finishing_inputs
      process_id: "finishing_magnetization_packaging"
      flow_role: "blanks, consumables, water, electricity, and packaging"
      record_type: "transfer, issue, return, meter, and work-order records"
      raw_fields: "blank mass; consumable; coating; water; electricity; packaging; work order"
      collection_method: "reconcile line inputs and utility meters to quality-released lots"
      unit: "kg; kWh; m3"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all included finishing, magnetization, and packaging lines"
      aggregation_rule: "net consumption by material and route divided by accepted output"
      quality_evidence: "calibration; work-order reconciliation; approved bill of materials"
    - protocol_id: cp_finishing_outputs
      process_id: "finishing_magnetization_packaging"
      flow_role: "rejects, residues, wastewater, and direct emissions"
      record_type: "reject logs, waste manifests, discharge and air-monitoring records"
      raw_fields: "reject mass; offcut; sludge; wastewater; destination; substance; concentration; flow rate"
      collection_method: "weigh transfers and calculate releases from validated measurements"
      unit: "kg; m3"
      frequency: "each transfer; monitoring frequency required by permit"
      temporal_coverage: "full reporting period"
      site_scope: "included finishing lines and controls"
      aggregation_rule: "aggregate by route, destination, substance, and compartment"
      quality_evidence: "scale calibration; chain of custody; laboratory and permit reports"
    - protocol_id: cp_quality_release
      process_id: "finishing_magnetization_packaging"
      flow_role: "accepted reference product and specification evidence"
      record_type: "calibrated scale, lot release, dimensional inspection, and magnetic test records"
      raw_fields: "lot id; route; net mass; count; grade; dimensions; tolerance; magnetic test; magnetization pattern; coating; acceptance status"
      collection_method: "weigh accepted output and link it to released inspection and magnetic-test records"
      unit: "kg"
      frequency: "each released lot"
      temporal_coverage: "full reporting period"
      site_scope: "all product lines represented by the dataset"
      aggregation_rule: "sum accepted net mass only; preserve route-separated totals"
      quality_evidence: "scale calibration; inspection-system calibration; signed release record; test report"
  calculation_rules:
    - id: calc_reference_output
      applies_to: "Reference product"
      rule: "Sum accepted net lot mass after quality release; exclude packaging and all rejected or reworked mass. Normalize the inventory by this mass."
      inputs:
        - "accepted lot masses"
        - "rejection and rework status"
      output: "kg accepted finished magnet and normalization denominator"
      source_ids:
        - iec-60404-8-1-2023
    - id: calc_material_consumption
      applies_to: "Material inputs"
      rule: "Net consumed mass = opening stock + receipts - closing stock - documented returns or transfers out; reconcile to lot-level issues where available."
      inputs:
        - "inventory and lot issue records"
      output: "kg net material consumed by input"
      source_ids:
        - iso-14044-2006
    - id: calc_shared_energy
      applies_to: "Shared utilities"
      rule: "Prefer direct submetering. If unavailable, shared utility = total metered utility multiplied by the documented causal driver share after excluding out-of-scope loads."
      inputs:
        - "meter total"
        - "out-of-scope loads"
        - "equipment time"
        - throughput
        - "or other causal driver"
      output: "kWh or MJ attributable to the product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_direct_emission
      applies_to: "Stack and discharge measurements"
      rule: "Emitted mass = validated concentration multiplied by corrected flow and operating time, with unit, moisture, temperature, pressure, and detection-limit treatment retained."
      inputs:
        - concentration
        - flow
        - "operating time"
        - "correction data"
      output: "kg substance by compartment"
      source_ids:
        - ec-ceramic-bref-2007
    - id: calc_route_weighting
      applies_to: "Dataset representing more than one route"
      rule: "Aggregate only after separate route inventories are complete; weighted amount = sum(route amount multiplied by accepted-output share)."
      inputs:
        - "route-specific normalized inventories"
        - "accepted output by route"
      output: "production-share-weighted inventory"
      source_ids:
        - iso-14044-2006
    - id: calc_mass_balance
      applies_to: "Each process and complete foreground system"
      rule: "Reconcile material inputs with product outputs, externally transferred waste, measured releases, internal recycle, and stock change using a consistent moisture and binder basis; investigate rather than force-close residuals."
      inputs:
        - "all material inputs and outputs"
        - "inventory changes"
      output: "documented mass-balance residual and explanation"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Link each represented lot to route, chemistry or grade, orientation, magnetization state or pattern, geometry, tolerance, coating, and bonded formulation where relevant."
      evidence: "signed lot release and product specification"
    - id: dq_technology
      applies_to: "Process coverage"
      requirement: "Demonstrate that the selected processes and forming method represent the actual sintered or bonded technology; report production shares rather than substituting an unrepresentative route."
      evidence: "process map, work orders, route-separated production totals"
    - id: dq_time
      applies_to: "All foreground data"
      requirement: "Use a continuous, representative reporting period, normally at least 12 months, or justify a shorter campaign and document seasonality, downtime, and abnormal operation."
      evidence: "meter coverage, production calendar, exception log"
    - id: dq_geography
      applies_to: "Site and upstream data"
      requirement: "Record manufacturing site and geography and select upstream electricity, fuel, water, material, and treatment datasets that match the represented supply situation."
      evidence: "site metadata, supplier origin, dataset-selection record"
    - id: dq_completeness
      applies_to: "Inputs, outputs, and controls"
      requirement: "Reconcile purchase, meter, production, reject, waste, wastewater, and emission records; document missing records and exclusions without using an unsupported zero."
      evidence: "completeness matrix and mass/energy reconciliation"
    - id: dq_measurement
      applies_to: "Foreground records"
      requirement: "Use calibrated meters and scales and validated laboratory or regulatory methods; preserve raw readings, units, conversions, detection limits, and uncertainty."
      evidence: "calibration certificates, laboratory reports, calculation workbook"
    - id: dq_allocation
      applies_to: "Shared or multi-output processes"
      requirement: "Retain subdivision evidence, driver data, allocation factors, and sensitivity results required by the selected allocation rule."
      evidence: "meter map, driver calculation, allocation and sensitivity record"
    - id: dq_external_data
      applies_to: "Upstream and treatment datasets"
      requirement: "Record dataset name, version, geography, reference year, technology, provider, and any substitution or proxy rationale."
      evidence: "dataset register and representativeness review"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require the exact finished-product flow UUID, Mass property UUID, Units of mass group UUID, kg unit, and all required qualifiers; reject metallic-magnet, green-body, ferrite-powder, or generic magnet flow substitutions."
    source_ids:
      - iec-60404-8-1-2023
  - rule_id: validate_route_completeness
    applies_to: "Process map"
    rule: "Require exactly identified sintered, bonded, or separately weighted mixed-route coverage; require the corresponding forming process and the common finishing, magnetization, testing, and packaging process."
    source_ids:
      - cui-et-al-2022-part-i
      - cui-et-al-2022-part-ii
  - rule_id: validate_internal_transfers
    applies_to: "Powder and blank flows"
    rule: "Confirm that internal ferrite powder and blank transfers balance between processes and are not also counted as purchased external inputs or final products."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_mass_balance
    applies_to: "Each process and full system"
    rule: "Require a documented mass balance on consistent moisture and binder bases; flag unexplained residuals and any unsupported zero for waste or emissions."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_energy_and_controls
    applies_to: "Thermal and forming operations"
    rule: "Require electricity, every used fuel, water where used, pollution-control utilities, collected residues, wastewater, and direct emissions or an evidence-backed not-applicable determination."
    source_ids:
      - ec-ceramic-bref-2007
  - rule_id: validate_quality_release
    applies_to: "Accepted finished output"
    rule: "Require lot-level dimensional and magnetic-property test evidence appropriate to the declared grade and magnetization state, and exclude rejected or unreleased product from the reference mass."
    source_ids:
      - iec-60404-8-1-2023
  - rule_id: validate_allocation
    applies_to: "Shared and multi-output processes"
    rule: "Require the allocation hierarchy, causal driver, factors, period, affected outputs, and sensitivity disclosure; fail unexplained mass-only or economic allocation."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_data_quality
    applies_to: "Dataset package"
    rule: "Require technological, geographical, temporal, completeness, precision, and uncertainty disclosures and the evidence listed in section 8."
    source_ids:
      - eu-pef-2021-2279
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for finished permanent ceramic or hard-ferrite magnets"
  downstream_use: "May be published as a secondary_dataset and used as a background_dataset for motors, loudspeakers, power supplies, consumer electronics, and other systems when product and route qualifiers match"
  allowed_use: "Cradle-to-gate or broader product-system studies that add compatible upstream material and energy datasets and downstream transport, assembly, use, and end-of-life processes according to the study goal"
  excluded_use: "Substitution for metallic, rare-earth, alnico, electromagnet, soft-ferrite, powder, green-body, or magnet-containing assembly datasets; shape- or grade-specific claims without matching qualifiers; use-phase or end-of-life claims not modelled downstream"
  required_metadata: "PCR id; exact reference-flow UUID; route and forming method; ferrite chemistry and grade; orientation; magnetization state and pattern; geometry and tolerance; coating; binder and formulation share for bonded magnets; starting material state; site; geography; reference period; production volume; allocation; upstream dataset register"
  required_quality_disclosure: "Meter and scale coverage; calibration; lot and supplier coverage; route shares; mass and energy reconciliation; waste and emissions coverage; allocation and sensitivity; technology, geography, time, completeness, precision, uncertainty, exclusions, proxies, and data gaps"
  update_trigger: "Material change in ferrite chemistry or grade, binder formulation, forming or orientation method, kiln or curing technology, fuel or electricity supply, finishing or coating, magnetization specification, site, allocation, pollution control, upstream datasets, or reporting period"
