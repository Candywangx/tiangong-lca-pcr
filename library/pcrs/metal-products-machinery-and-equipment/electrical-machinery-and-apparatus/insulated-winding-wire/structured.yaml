system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground system includes all on-site activities needed to convert the declared incoming conductor condition into accepted insulated winding wire: material receipt and storage; drawing or rolling and annealing or cleaning when on site; insulation preparation, application, drying, curing, impregnation, wrapping, or setting as applicable; lubricant application; route-conditional VOC capture and treatment; testing; spooling; internal handling; and packing. Include on-site electricity, fuels, process gases, water, direct releases, wastes, rejects, and treatment consumables."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Purchased conductor, insulation materials, solvents, fuels, electricity, water, packaging, and waste-treatment services cross the boundary as linked product or service inputs. Their upstream production is not recreated inside the foreground gate. Downstream winding, impregnation performed by the component manufacturer, coil or equipment assembly, distribution, use, and end-of-life are outside this gate-to-gate PCR."
      source_ids: []
    - rule_id: system_boundary_rule_1_2
      applies_to: "foreground manufacturing gate"
      rule: "Include all on-site conductor preparation, insulation application or covering, curing or setting, finishing, testing, spooling, internal treatment, and packing activities that are physically required for the declared product route."
      source_ids:
        - jrc-sts-bref-2020
    - rule_id: system_boundary_rule_2_2
      applies_to: "purchased inputs and services"
      rule: "Represent upstream production and external treatment with linked datasets that match the declared material, technology, geography, and period; do not duplicate them as foreground operations."
      source_ids:
        - eu-environmental-footprint-2021
    - rule_id: system_boundary_rule_3
      applies_to: "downstream operations"
      rule: "Exclude winding, coil impregnation performed downstream, component or final-equipment assembly, distribution, use, and end-of-life unless a broader study adds them outside this foreground data package."
      source_ids:
        - un-cpc-3-2023
    - rule_id: system_boundary_rule_4
      applies_to: "route-specific operations"
      rule: "Include only the drawing, annealing, coating, covering, impregnation, lubrication, and off-gas-treatment steps that occur for the declared product and site; explicitly mark non-applicable steps."
      source_ids:
        - jrc-sts-bref-2020
boundary_abstraction:
  declared_starting_condition: "bare conductor rod, wire, or strip received at the foreground facility, or purchased dimensioned conductor when sizing is performed upstream"
  starting_condition_role: "product input to conductor preparation or directly to insulation application"
  product_classification_scope: "CPC 46310 insulated winding wire, independent of conductor metal, geometry, insulation technology, voltage application, or end-use equipment subtype when the product remains winding wire"
  recursive_input_rule: "an insulated winding-wire input used for rework or further coating remains an explicit product input with its own upstream dataset and declared incoming insulation state; it is not relabelled as bare conductor"
  upstream_dataset_requirement: "link each purchased conductor, insulation, solvent, lubricant, energy carrier, packaging material, and external treatment service to the most specific available dataset matching material, route, geography, and period"
  disclosure: "declare incoming conductor condition, purchased-versus-on-site sizing and annealing, product route, line technology, treatment configuration, excluded operations, cut-offs, and all upstream proxy choices"
