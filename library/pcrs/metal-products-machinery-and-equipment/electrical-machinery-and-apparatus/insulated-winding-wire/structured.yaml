measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1 kg of accepted net insulated winding wire; exclude the mass of reels, spools, pallets, wrapping, and other packaging."
  - id: accepted_output_mass
    applies_to: "accepted product and yield"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated weighing or a documented length-to-mass conversion based on measured conductor dimensions, density, and insulation build; reconcile the conversion against periodic mass checks."
  - id: conductor_and_insulation_mass
    applies_to: "conductor, insulation, solvents, lubricants, scrap, and coating waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve original mass records and state wet, dry, solids, or as-supplied basis; do not mix formulation mass with coating-solids mass."
  - id: energy_measurement
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the metered energy carrier and unit. Convert only with a documented physical conversion; report electricity and fuels separately."
  - id: area_based_lubricant
    applies_to: "area-based lubricant application"
    required_property_ref:
      name: "Mass per surface area"
      uuid: ""
    required_unit: "mg/m2"
    rule: "Calculate wire surface area from measured geometry and produced length, then convert to mass per reference product without assuming a circular section for rectangular wire."
  - id: voc_measurement
    applies_to: "total volatile organic compounds"
    required_property_ref:
      name: "Mass or mass concentration"
      uuid: ""
    required_unit: "g/kg product or mg C/Nm3"
    rule: "State whether the value is a solvent mass balance, direct mass emission, or waste-gas concentration; record dry or wet gas basis, reference oxygen where used, averaging period, and treatment status."
process_map:
  - id: conductor_preparation
    name: "Conductor preparation"
    inclusion: "required"
    inclusion_condition: "Record receipt and the actual sizing, drawing, rolling, cleaning, and annealing steps; when dimensioned conductor is purchased, keep the process as a receipt and verification step and link its upstream preparation."
    role: "Establish the declared metallic conductor condition entering insulation application."
    quantitative_reference: "measured mass of prepared conforming conductor transferred to insulation application"
  - id: insulation_application_and_curing
    name: "Insulation application and curing or setting"
    inclusion: "required"
    inclusion_condition: "Select the declared enamel, paper or tape, fibre, composite, or other insulation route and record all repeated applications and thermal or chemical setting steps."
    role: "Apply the declared insulation system and produce testable insulated wire."
    quantitative_reference: "measured mass of insulated intermediate transferred to finishing"
  - id: voc_capture_and_treatment
    name: "VOC capture and treatment"
    inclusion: "conditional"
    inclusion_condition: "Include when solvent-bearing enamel, lubricant, cleaning, or another operation produces captured off-gas or uses integrated catalytic or thermal treatment."
    role: "Track capture, destruction, residual releases, treatment energy, catalyst, and recovered heat without hiding them in a net factor."
    quantitative_reference: "treated off-gas and associated records for the declared production campaign"
  - id: finishing_testing_and_packing
    name: "Finishing, testing, and packing"
    inclusion: "required"
    inclusion_condition: "Include lubrication where applicable, dimensional and electrical testing, rejection, spooling, internal handling, and packaging."
    role: "Establish accepted saleable output and its packaging exclusion."
    quantitative_reference: "1 kg accepted net insulated winding wire"
