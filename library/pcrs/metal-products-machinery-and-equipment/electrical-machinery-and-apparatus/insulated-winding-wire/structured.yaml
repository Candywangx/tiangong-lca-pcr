allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "separable products, lines, and campaigns"
    rule: "Avoid allocation by subdividing independently metered lines, product families, conductor metals, insulation routes, and production campaigns whenever records permit."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_rule_2
    applies_to: "shared electricity, fuel, water, ventilation, and treatment"
    rule: "Allocate shared utilities first by direct submetering, then by a documented causal driver such as machine time, oven loading, standardized gas flow, or treated solvent loading."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_rule_3
    applies_to: "remaining non-causal shared burdens"
    rule: "Use accepted net product mass only when no defensible causal driver exists; disclose the affected flows, period, numerator, denominator, and sensitivity."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "internal rework"
    rule: "Return documented same-campaign rework to the originating process without counting it as a new external input or accepted output; retain the associated energy, material loss, and emissions."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "metallic scrap and recovered solvent"
    rule: "Record gross scrap, recovered solvent, and external treatment or recycling outputs. Do not subtract an avoided-production credit inside this gate-to-gate inventory; disclose any broader-study substitution or end-of-life method separately."
    source_ids:
      - jrc-sts-bref-2020
  - rule_id: allocation_rule_6
    applies_to: "recovered heat"
    rule: "Credit recovered heat against an on-site energy input only when useful delivery and displaced input are metered for the same accounting period; otherwise report recovered heat separately without a credit."
    source_ids:
      - eu-bat-conclusions-sts-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_product_mass_and_quality
      process_id: "insulation_application_and_curing_finishing_testing_and_packing"
      flow_role: "transferred intermediate and accepted reference product"
      record_type: "production, test, and disposition record"
      raw_fields: "product code; conductor material; shape; nominal dimensions; average diameter class; insulation system; grade; thermal class; specification; produced length; linear density; gross mass; packaging mass; accepted mass; rejected mass; test result; timestamp"
      collection_method: "calibrated scale plus validated length-to-mass conversion and linked quality records"
      unit: "kg; m; kg/m"
      frequency: "each reel or production lot"
      temporal_coverage: "declared representative campaign and at least the full averaging period"
      site_scope: "declared line and facility"
      aggregation_rule: "sum accepted net mass after removing packaging; retain lot-level qualifier and disposition links"
      quality_evidence: "scale calibration; linear-density check; test certificate; batch reconciliation"
    - protocol_id: cp_conductor_and_yield
      process_id: "conductor_preparation"
      flow_role: "received conductor, consumables, prepared conductor, and yield"
      record_type: "receiving, stock, issue, transfer, and scrap record"
      raw_fields: "material id; supplier lot; material; form; dimensions; opening stock; receipts; issues; returns; closing stock; transfer mass; scrap mass; timestamp"
      collection_method: "calibrated weighing and stock reconciliation by material and campaign"
      unit: "kg"
      frequency: "each receipt, issue, transfer, and campaign close"
      temporal_coverage: "same period as reference-product data"
      site_scope: "declared facility and line"
      aggregation_rule: "opening stock plus receipts minus closing stock, returns, and documented transfers; normalize to accepted output"
      quality_evidence: "scale calibration; supplier certificate; stock ledger; mass-balance closure"
    - protocol_id: cp_insulation_and_solvent
      process_id: "insulation_application_and_curing"
      flow_role: "insulation constituents, solvents, and coating balance"
      record_type: "formulation, purchase, stock, issue, recovery, cleaning, and waste record"
      raw_fields: "material id; formulation; solids fraction; solvent fraction; opening stock; purchase; issue; return; recovered solvent; closing stock; waste; retained coating; timestamp"
      collection_method: "batch tickets, calibrated weighing, supplier composition, and solvent mass balance"
      unit: "kg; % by mass"
      frequency: "each formulation batch and campaign close"
      temporal_coverage: "same period as reference-product and emission data"
      site_scope: "declared line, mixing area, and solvent system"
      aggregation_rule: "reconcile each constituent and solvent over the averaging period; normalize to accepted output"
      quality_evidence: "supplier specification; batch ticket; scale calibration; solvent-balance closure"
    - protocol_id: cp_energy_and_fuel
      process_id: "conductor_preparation_insulation_application_and_curing_voc_capture_and_treatment_finishing_testing_and_packing"
      flow_role: "electricity, fuels, thermal energy, and recovered heat"
      record_type: "meter, invoice, operating-time, and heat-recovery record"
      raw_fields: "meter id; carrier; opening reading; closing reading; energy; operating time; product family; treatment status; recovered heat; timestamp"
      collection_method: "calibrated submeter or reconciled facility meter with documented causal allocation"
      unit: "kWh; MJ"
      frequency: "continuous or each shift, aggregated monthly and by campaign"
      temporal_coverage: "same representative period as production"
      site_scope: "declared meters, lines, ovens, and treatment units"
      aggregation_rule: "direct meter first; otherwise apply the declared causal allocation driver and normalize to accepted output"
      quality_evidence: "calibration; invoice reconciliation; meter coverage map; allocation worksheet"
    - protocol_id: cp_water_and_cooling
      process_id: "conductor_preparation_insulation_application_and_curing"
      flow_role: "withdrawal, make-up, recirculation, and discharge"
      record_type: "water meter, tank, discharge, and operating record"
      raw_fields: "source; meter id; make-up; recirculation; discharge; evaporation estimate; stock change; destination; timestamp"
      collection_method: "calibrated meters and site water balance"
      unit: "m3"
      frequency: "continuous or each shift, aggregated by campaign"
      temporal_coverage: "same representative period as production"
      site_scope: "declared line, cooling loop, and discharge point"
      aggregation_rule: "report make-up and discharge; keep recirculation separate; normalize to accepted output"
      quality_evidence: "calibration; water-balance closure; discharge record"
    - protocol_id: cp_direct_air_emissions
      process_id: "conductor_preparation_insulation_application_and_curing_voc_capture_and_treatment"
      flow_role: "VOC and other direct air emissions"
      record_type: "solvent balance, stack test, continuous monitor, standardized gas-flow, and fuel record"
      raw_fields: "substance; concentration; carbon basis; gas flow; temperature; pressure; moisture basis; oxygen basis; operating state; treatment state; duration; captured loading; solvent-balance inputs; timestamp"
      collection_method: "approved monitoring method or reconciled mass balance aligned with production operation"
      unit: "kg; g/kg; mg C/Nm3; Nm3"
      frequency: "legally required frequency and each representative campaign"
      temporal_coverage: "same averaging period as production and solvent records"
      site_scope: "each declared source, capture point, bypass, and stack"
      aggregation_rule: "calculate mass from concentration times standardized gas volume or by closed solvent balance; prevent captured and residual double counting"
      quality_evidence: "method report; instrument calibration; laboratory QA; solvent-balance closure; operating log"
    - protocol_id: cp_wastes_and_recycling
      process_id: "conductor_preparation_insulation_application_and_curing_voc_capture_and_treatment_finishing_testing_and_packing"
      flow_role: "scrap, rejects, coating waste, solvent waste, catalyst, wastewater, and packaging waste"
      record_type: "weighing, manifest, stock, rework, and destination record"
      raw_fields: "waste id; material; hazardous status; gross and tare mass; internal rework; recovered quantity; opening stock; closing stock; carrier; destination; treatment; date"
      collection_method: "calibrated weighing, waste manifest, rework log, and stock reconciliation"
      unit: "kg; m3"
      frequency: "each movement and campaign close"
      temporal_coverage: "same representative period as production"
      site_scope: "declared facility and each storage or dispatch point"
      aggregation_rule: "gross generation minus documented same-campaign re-entry; retain destination without avoided-production credit"
      quality_evidence: "scale calibration; manifest; recycler receipt; rework record; stock-balance closure"
    - protocol_id: cp_finishing_and_packaging
      process_id: "finishing_testing_and_packing"
      flow_role: "lubricant, surface area, packaging, and final disposition"
      record_type: "formulation, issue, geometry, length, item-count, reuse, and packing record"
      raw_fields: "lubricant id; issue; return; wire shape; dimensions; produced length; calculated surface area; package material; package mass or count; reuse status; accepted output; timestamp"
      collection_method: "calibrated weighing, dimensional measurement, production counter, and packaging bill of materials"
      unit: "kg; mg/m2; m2; item"
      frequency: "each lot or packing batch"
      temporal_coverage: "same representative period as accepted output"
      site_scope: "declared finishing and packing line"
      aggregation_rule: "calculate geometry-specific surface area; reconcile lubricant and packaging issues; normalize to accepted net output"
      quality_evidence: "scale calibration; dimension gauge; counter verification; packaging specification"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all foreground exchanges"
      rule: "normalized exchange = period exchange / period accepted net product mass"
      inputs:
        - "collected period exchange"
        - "cp_product_mass_and_quality accepted net mass"
      output: "exchange per 1 kg accepted net insulated winding wire"
      source_ids: []
    - id: conductor_mass_balance
      applies_to: "conductor preparation and product yield"
      rule: "opening conductor stock + receipts = closing stock + prepared transfer + measured scrap + other documented destinations; investigate unresolved difference before normalization"
      inputs:
        - "cp_conductor_and_yield records"
      output: "reconciled conductor input, transfer, scrap, and closure difference"
      source_ids: []
    - id: insulation_solvent_balance
      applies_to: "insulation and VOC inventory"
      rule: "opening stock + purchases + recovered inflow = closing stock + product retention + recovered outflow + waste + measured or calculated release; preserve each substance or declared solvent group"
      inputs:
        - cp_insulation_and_solvent
        - cp_direct_air_emissions
        - cp_wastes_and_recycling
      output: "reconciled solvent and coating inventory with residual"
      source_ids:
        - jrc-sts-bref-2020
        - eu-bat-conclusions-sts-2020
    - id: surface_area_lubricant_conversion
      applies_to: "finishing lubricant"
      rule: "lubricant per reference mass = application rate times measured geometry-specific surface area per produced length times accepted length / accepted net product mass"
      inputs:
        - "cp_finishing_and_packaging geometry"
        - length
        - "application rate"
        - "and accepted mass"
      output: "kg lubricant per kg accepted product"
      source_ids:
        - jrc-sts-bref-2020
    - id: stack_mass_emission
      applies_to: "monitored waste-gas emissions"
      rule: "mass emission = concentration on the declared basis times standardized dry or wet gas volume over the aligned operating period; apply unit and carbon-to-substance conversions explicitly"
      inputs:
        - "cp_direct_air_emissions concentration"
        - "standardized gas flow"
        - duration
        - basis
        - "and substance identity"
      output: "kg emission per kg accepted product"
      source_ids:
        - eu-bat-conclusions-sts-2020
    - id: shared_energy_allocation
      applies_to: "shared energy meters"
      rule: "allocated energy = metered period energy times the declared causal-driver share; mass share is permitted only under allocation_rule_3"
      inputs:
        - "cp_energy_and_fuel meter and driver records"
      output: "kWh or MJ per kg accepted product by process and carrier"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve conductor material, geometry and dimensions, insulation system and grade, thermal class, governing specification, test method, and acceptance result for each represented product family."
      evidence: "product specification, batch record, and test certificate"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Use the same representative production period for product, materials, energy, water, emissions, wastes, and stock changes; explain shutdowns, trials, bypasses, and abnormal operation."
      evidence: "period-coverage matrix and operating log"
    - id: dq_mass_closure
      applies_to: "conductor, coating, solvent, product, scrap, and waste"
      requirement: "Reconcile conductor and solvent balances and report residuals; unresolved material discrepancies require correction or an explicit data-quality limitation."
      evidence: "signed mass-balance worksheets and stock reconciliation"
    - id: dq_meter_and_test_quality
      applies_to: "mass, energy, water, dimensions, electrical tests, and emissions"
      requirement: "Use calibrated instruments and preserve calibration status, method, detection limit where relevant, and sampling or averaging period."
      evidence: "calibration certificates, method reports, and laboratory QA"
    - id: dq_technology_representativeness
      applies_to: "production route"
      requirement: "Match drawing or purchased-conductor starting state, conductor metal and shape, insulation technique, number of coating or covering applications, curing technology, lubricant route, line speed, and treatment system."
      evidence: "line description, formulation, production settings, and equipment record"
    - id: dq_geographic_representativeness
      applies_to: "energy, water, upstream materials, and treatment"
      requirement: "Match the declared site and supply geography or document each proxy and its expected influence."
      evidence: "supplier geography, grid and fuel records, and proxy register"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Cover every required and applicable conditional process and all material, energy, water, emission, waste, reject, and packaging flows that cross the boundary; list justified exclusions."
      evidence: "process-flow diagram, meter coverage map, inventory checklist, and cut-off log"
    - id: dq_source_provenance
      applies_to: "linked upstream and secondary data"
      requirement: "Record dataset identity, version, geography, technology, reference year, access date, mapping rationale, and any substitution or aggregation."
      evidence: "dataset register and reviewed mapping record"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "PCR and product identity"
    rule: "The foreground data package identifies CPC 46310 insulated winding wire and does not substitute a bare-wire, coaxial-cable, ignition-wiring-set, general-cable, coil, motor, transformer, or other narrower or different product."
    source_ids:
      - un-cpc-3-2023
  - rule_id: validation_rule_2
    applies_to: "reference flow identity"
    rule: "The quantitative reference uses Product flow 2bf8a4db-b29e-404a-ae6c-402adbb77af4, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids:
      - ilcd-units-of-mass
  - rule_id: validation_rule_3
    applies_to: "reference amount and qualifiers"
    rule: "The quantitative reference is exactly 1 kg accepted net insulated winding wire excluding packaging, and every required qualifier is populated."
    source_ids:
      - iec-60317-0-1-2013-amd1-2019
      - iec-60317-0-3-2024
      - iec-60851-1-2021-amd1-2025
  - rule_id: validation_rule_4
    applies_to: "process completeness"
    rule: "Conductor preparation, insulation application and curing or setting, and finishing, testing, and packing are present; VOC capture and treatment is present whenever its inclusion condition applies."
    source_ids:
      - jrc-sts-bref-2020
  - rule_id: validation_rule_5
    applies_to: "route applicability"
    rule: "Every included coating, covering, impregnation, curing, lubrication, or treatment step matches the declared route, and every non-applicable conditional step is explicitly marked rather than assigned zero by assumption."
    source_ids:
      - jrc-sts-bref-2020
  - rule_id: validation_rule_6
    applies_to: "material and product mass balance"
    rule: "Conductor receipt, transfer, accepted output, scrap, rejects, coating retention, coating waste, and stock changes are reconciled for the reporting period; residuals and corrections are disclosed."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "solvent and VOC balance"
    rule: "A solvent-bearing route has a closed solvent balance covering virgin and recovered solvent, stocks, product retention, wastes, captured loading, treatment, bypasses, and residual release without double counting."
    source_ids:
      - jrc-sts-bref-2020
      - eu-bat-conclusions-sts-2020
  - rule_id: validation_rule_8
    applies_to: "BAT range applicability"
    rule: "The 1–3.3 g VOC/kg coated-wire range is applied only to winding wire with average diameter above 0.1 mm and under the stated BAT applicability and averaging conditions; the 5–40 mg C/Nm3 range is used only for the corresponding treated waste-gas condition."
    source_ids:
      - eu-bat-conclusions-sts-2020
  - rule_id: validation_rule_9
    applies_to: "lubricant range applicability"
    rule: "The 5–10 mg/m2 range is used only for fine and ultrafine round wire below 0.10 mm, the 30–60 mg/m2 range only for medium and thick round wire, and neither range is assigned to rectangular wire without product-specific evidence."
    source_ids:
      - jrc-sts-bref-2020
  - rule_id: validation_rule_10
    applies_to: "water reporting"
    rule: "Water make-up, recirculation, and discharge are distinguished. A zero wastewater value is accepted only with a site water balance and evidence that no discharge crossed the foreground boundary."
    source_ids:
      - jrc-sts-bref-2020
  - rule_id: validation_rule_11
    applies_to: "allocation"
    rule: "The data package records subdivision, direct measurement, causal drivers, any mass-based fallback, internal rework, and treatment of scrap, recovered solvent, and recovered heat in accordance with Section 7."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "external dataset matching"
    rule: "Each linked input and treatment dataset records identity, geography, technology, period, and mapping rationale; known mismatches are disclosed."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validation_rule_13
    applies_to: "evidence and UUID discipline"
    rule: "No unverified UUID, fabricated value, search-result snippet, private command trace, or authoring note is used as source evidence; unresolved inventory identities remain descriptive until separately verified."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "bilingual and projection consistency"
    rule: "English and Chinese rule ids, process ids, row ids, controlled tokens, UUIDs, source ids, and quantities are aligned, and structured.yaml is regenerated from the canonical English Markdown."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground unit-process or aggregated gate-to-gate manufacturing dataset for insulated winding wire"
  downstream_use: "input to foreground data packages and downstream process or lifecyclemodel projections for coils, motors, transformers, reactors, and other products that consume declared winding wire"
  allowed_use: "manufacturing studies whose conductor material, geometry, insulation system, thermal class, product specification, route, geography, period, and plant gate match or are transparently adapted"
  excluded_use: "bare wire, general cable, coaxial cable, ignition wiring sets, wound coils, final electrical equipment, use-stage performance, comparative claims without a broader reviewed method, or any product whose required qualifiers are absent"
  required_metadata: "PCR id; verified reference flow; all required qualifiers; starting condition; process map; geography; period; technology; allocation; cut-offs; linked datasets; collection coverage; data-quality assessment"
  required_quality_disclosure: "primary-data share and period; meter and test coverage; conductor and solvent balance residuals; route-specific exclusions; proxy datasets; treatment and bypass status; uncertainty and unresolved limitations"
  update_trigger: "material change in conductor metal or geometry, insulation chemistry or grade, thermal class, product specification, production or curing technology, lubricant route, VOC treatment, geography, energy supply, allocation, or representative period"
