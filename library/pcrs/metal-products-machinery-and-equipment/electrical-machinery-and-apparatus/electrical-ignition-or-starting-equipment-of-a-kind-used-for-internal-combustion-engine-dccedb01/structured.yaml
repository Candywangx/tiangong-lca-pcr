allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared lines, utilities, and treatment systems"
    rule: "Subdivide or meter the declared equipment family directly wherever technically feasible. Use production time, machine energy, bath loading, or another causal physical driver only when direct subdivision is unavailable."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: allocation_product_mix
    applies_to: "Multiple finished product families"
    rule: "Allocate shared burdens with a documented physical relationship that reflects resource use. Production mass alone is not acceptable when models have materially different power, cycle time, treatment area, or test demand unless equivalence is demonstrated."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: allocation_scrap_status
    applies_to: "Steel scrap and other recovered outputs"
    rule: "Determine and disclose whether the output is waste or a co-product at the factory gate. Do not assign an avoided-production credit inside this gate-to-gate inventory. If it is a co-product and subdivision is impossible, apply a documented physical relationship; use economic allocation only when no defensible physical relationship exists and report a sensitivity check."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: allocation_rework
    applies_to: "Internal rework and recycling"
    rule: "Keep internally reworked products and internally recycled process material inside the foreground boundary; assign their additional material and energy to conforming output and do not count the internal loop as an external product or waste flow."
    source_ids:
      - eu-pef-recommendation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "integrated_equipment_manufacturing"
      flow_role: "Steel sheet, aluminum alloy sheet, magnet wire, and PA6 inputs"
      record_type: "Approved bill of materials, warehouse issues and returns, scale records"
      raw_fields: "product_model; lot_id; material_identity; supplier; grade_or_specification; issued_mass; returned_mass; moisture_or_coating_basis; conforming_output_mass"
      collection_method: "Reconcile controlled BOM quantities to weighed or invoiced issues and returns for each product lot"
      unit: "kg"
      frequency: "Per production lot; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign for seasonal/campaign production"
      site_scope: "All lines and outsourced steps attributed to the declared site and product family"
      aggregation_rule: "Sum net issued mass by atomic material and divide by conforming net product mass"
      quality_evidence: "BOM revision, supplier specification, calibrated scale certificate, inventory reconciliation"
    - protocol_id: cp_electricity
      process_id: "integrated_equipment_manufacturing"
      flow_role: "Purchased electricity"
      record_type: "Revenue meter and submeter logs"
      raw_fields: "meter_id; opening_kWh; closing_kWh; production_line; downtime; product_model; conforming_output_mass"
      collection_method: "Read calibrated meters; subtract documented non-production loads; allocate remaining shared loads causally"
      unit: "kWh converted to MJ"
      frequency: "Continuous or shift; aggregate monthly"
      temporal_coverage: "Same period as production output, normally at least 12 representative months"
      site_scope: "All foreground operations at the reporting site"
      aggregation_rule: "Net attributable kWh × 3.6 divided by conforming net product mass"
      quality_evidence: "Meter calibration, bill reconciliation, allocation worksheet"
    - protocol_id: cp_natural_gas
      process_id: "integrated_equipment_manufacturing"
      flow_role: "On-site natural gas"
      record_type: "Gas meter and fuel invoice records"
      raw_fields: "meter_id; volume; temperature; pressure; standard_or_actual_basis; gas_composition; heating_use; product_model; output_mass"
      collection_method: "Reconcile submetered production gas to invoices and declared reference conditions"
      unit: "m3"
      frequency: "Daily or batch; aggregate monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "On-site combustion within the foreground boundary"
      aggregation_rule: "Sum attributable volume at one declared reference condition and divide by conforming net product mass"
      quality_evidence: "Meter calibration, invoice reconciliation, gas-quality certificate"
    - protocol_id: cp_process_water
      process_id: "integrated_equipment_manufacturing"
      flow_role: "Process water"
      record_type: "Water submeter, tank and recycle-loop records"
      raw_fields: "source; input_volume; density; recycled_volume; discharge_volume; operation; product_model; output_mass"
      collection_method: "Meter fresh and recycled water separately; convert volume to mass only with documented density"
      unit: "kg"
      frequency: "Shift or batch; aggregate monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "Manufacturing water only; sanitary water separately disclosed"
      aggregation_rule: "Fresh process-water mass divided by conforming net product mass; do not subtract water embodied in exported waste twice"
      quality_evidence: "Meter calibration, water balance, recycle-loop log"
    - protocol_id: cp_surface_treatment_chemicals
      process_id: "integrated_equipment_manufacturing"
      flow_role: "Sodium hydroxide"
      record_type: "Purchase, stock, bath make-up and concentration records"
      raw_fields: "solution_mass; active_mass_fraction; bath_id; operation; opening_stock; closing_stock; spill_or_loss; product_model; output_mass"
      collection_method: "Reconcile purchases and stock changes to bath additions; verify concentration by certificate or analysis"
      unit: "kg active NaOH"
      frequency: "Each bath addition; aggregate monthly"
      temporal_coverage: "Same period as treated production"
      site_scope: "On-site aqueous cleaning, treatment, and wastewater treatment"
      aggregation_rule: "Sum solution mass × active fraction allocated to the declared product and divide by conforming net product mass"
      quality_evidence: "Supplier certificate, bath analysis, stock reconciliation"
    - protocol_id: cp_packaging
      process_id: "integrated_equipment_manufacturing"
      flow_role: "Corrugated board boxes"
      record_type: "Packaging specification, issue and shipment records"
      raw_fields: "box_type; unit_mass; quantity_issued; quantity_returned; reuse_cycles; shipped_product_mass"
      collection_method: "Weigh each box type and reconcile issues to shipments; allocate reusable-box loss over verified cycles"
      unit: "kg"
      frequency: "Per shipment; aggregate monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "Packaging leaving the reporting site with the product"
      aggregation_rule: "Consumed or allocated box mass divided by shipped conforming net product mass"
      quality_evidence: "Packaging specification, scale record, shipment reconciliation"
    - protocol_id: cp_finished_output
      process_id: "integrated_equipment_manufacturing"
      flow_role: "Conforming reference product"
      record_type: "Final inspection, release and calibrated scale records"
      raw_fields: "product_model; serial_or_lot; gross_mass; packaging_mass; net_product_mass; test_result; rejected_mass; rework_mass"
      collection_method: "Weigh released product net of transport packaging and reconcile to final inspection release"
      unit: "kg"
      frequency: "Per lot or shipment; aggregate monthly"
