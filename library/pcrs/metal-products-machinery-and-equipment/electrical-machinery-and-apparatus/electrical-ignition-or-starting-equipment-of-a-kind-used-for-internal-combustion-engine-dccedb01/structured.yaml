validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm the UUID is the public state-100 CPC 46910 product identity, the reference property is Mass, the unit is kg, and every required qualifier is present."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_boundary_period
    applies_to: "Foreground inventory"
    rule: "Confirm inputs, conforming output, waste transfers, and direct emissions use the same site and reporting period and that outsourced and downstream operations are not silently mixed into the gate-to-gate module."
    source_ids:
      - eu-pef-recommendation-2021
      - unece-alca-proposal-2025
  - rule_id: validate_atomic_bom
    applies_to: "Material inventory"
    rule: "Reconcile the declared product BOM to individual atomic inventory rows. Reject umbrella rows, duplicate flows, and unqualified substitutions; unresolved UUIDs remain explicit."
    source_ids:
      - unece-alca-proposal-2025
  - rule_id: validate_conditional_routes
    applies_to: "Surface treatment, gas use, winding, and moulding"
    rule: "Require evidence that each conditional row is physically present for the declared route; otherwise record it as not applicable without assigning a zero-looking measured value."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: validate_mass_balance
    applies_to: "Mass inputs and outputs"
    rule: "Investigate unexplained material-specific imbalance after accounting for conforming product, waste, internal recycle, inventory change, and measured losses. Do not force the balance by altering measured exchanges."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: validate_energy_emissions
    applies_to: "Natural gas and direct fossil CO2"
    rule: "Confirm gas reference conditions, carbon content, oxidation factor, and unit conversion; confirm that upstream electricity and fuel emissions are not repeated as direct foreground emissions."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: validate_allocation
    applies_to: "Shared processes and recovered outputs"
    rule: "Confirm subdivision was attempted first, causal drivers are documented, recovered-output status is consistent, and any economic allocation includes a sensitivity disclosure."
    source_ids:
      - eu-pef-recommendation-2021
  - rule_id: validate_completeness_disclosure
    applies_to: "Dataset release"
    rule: "Confirm data sources, cut-offs, data gaps, UUID gaps, range-evidence needs, model mix, route, packaging, allocation, and uncertainty are disclosed before the dataset is used for comparison."
    source_ids:
      - eu-pef-recommendation-2021
      - unece-alca-proposal-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after review and publication"
  downstream_use: "Foreground gate-to-gate manufacturing module for a declared automotive or cycle electrical-equipment family; link to upstream material and utility datasets and, when required, distribution, vehicle use, maintenance, and end-of-life modules"
  allowed_use: "Product-footprint modelling, supply-chain exchange, hotspot analysis, and product-specific scenario modelling when the declared product family, route, site, period, and allocation match the study"
  excluded_use: "Unqualified comparison across starters, generators, lighting, signalling, wipers, defrosters, or demisters; cradle-to-grave claims without added stages; use as a generic vehicle dataset; proxying excluded lamps or wiring sets"
  required_metadata: "PCR id and version; product UUID; equipment family and model; performance specification; net mass; BOM and material states; production route; site and geography; reporting period; energy mix and gas reference conditions; surface-treatment route; packaging; allocation; upstream dataset links"
  required_quality_disclosure: "Primary-data share; temporal, geographic, and technological representativeness; meter and scale calibration; BOM completeness; product-mix weighting; cut-offs; allocation sensitivity; sludge moisture; direct-emission calculation; unresolved UUIDs and range-evidence needs"
  update_trigger: "Material change in product design, BOM, recycled content, production route, site, electricity supply, fuel composition, surface-treatment chemistry, test regime, packaging, allocation basis, upstream datasets, or reporting period"
