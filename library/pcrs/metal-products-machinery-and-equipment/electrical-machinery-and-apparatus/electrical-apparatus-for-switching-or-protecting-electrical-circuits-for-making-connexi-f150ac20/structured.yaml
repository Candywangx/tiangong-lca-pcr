  calculation_rules:
    - id: calc_count_to_net_mass
      applies_to: "item-based production, test, and dispatch records"
      rule: "For each model, net mass = item count × measured model-specific net mass per item. Update the conversion after a BOM, enclosure, contact system, accessory set, or packaging-convention change."
      inputs:
        - "item count"
        - "sampled net kg/item"
        - "model id"
        - "effective dates"
      output: "kg net apparatus by model and period"
      source_ids: []
    - id: calc_material_balance
      applies_to: "materials and components"
      rule: "For each material or component class, net consumption = opening stock + receipts − returns − closing stock. Reconcile net consumption to incorporated product mass + measured scrap + rejects + documented stock or work-in-progress change."
      inputs:
        - stocks
        - receipts
        - returns
        - "BOM issues"
        - "product mass"
        - scrap
        - rejects
        - "work in progress"
      output: "kg input and reconciliation difference per kg conforming output"
      source_ids:
        - iec-62474-2018
    - id: calc_energy_intensity
      applies_to: "preparation, assembly, and testing energy"
      rule: "Energy intensity = included metered energy ÷ net conforming tested apparatus mass for the same model group, site, and period. Allocate only residual shared energy with the declared causal driver."
      inputs:
        - "meter readings"
        - "excluded loads"
        - "allocation driver"
        - "conforming output mass"
      output: "kWh per kg net conforming apparatus"
      source_ids: []
    - id: calc_test_yield
      applies_to: "factory testing"
      rule: "Test yield = conforming released mass ÷ tested input mass. Report rework-return mass, non-reworkable rejects, and destructive samples separately so the ratio is auditable."
      inputs:
        - "tested input"
        - pass
        - rework
        - reject
        - "destructive sample masses"
      output: "dimensionless yield and kg dispositions per kg conforming output"
      source_ids:
        - iec-60947-1-2020
    - id: calc_direct_release
      applies_to: "concentration-based direct releases"
      rule: "Release mass = sampled concentration × measured discharge or exhaust volume, with unit conversion and sampling-period coverage documented."
      inputs:
        - concentration
        - volume
        - "sampling duration"
        - "conversion factor"
      output: "kg substance per kg net conforming apparatus"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "product scope and reference flow"
      requirement: "Preserve family, model group, AC/DC application, rated voltage, rated current, pole or contact configuration, applicable product standard, and all relevant switching, protection, control, or connector characteristics. Do not merge records with materially different BOMs or test plans."
      evidence: "controlled product master, nameplate or technical file, BOM, standard declaration, and model-grouping rationale"
    - id: dq_material_coverage
      applies_to: "materials and components"
      requirement: "Quantify all BOM-controlled net product mass by identified material or component class and disclose every residual or unknown-material share. Contact materials, conductor metals, insulating plastics or thermosets, ceramics, electronics, coils or magnets, and arc-control parts shall not be hidden in an unexplained generic balance when present."
      evidence: "mass reconciliation, BOM coverage report, supplier declarations, and residual-material register"
    - id: dq_temporal_consistency
      applies_to: "all foreground records"
      requirement: "Use one aligned, complete, and representative declared production period or complete production campaign. Explain shutdowns, abnormal test campaigns, design changes, and extrapolation."
      evidence: "dated raw records, production calendar, campaign dates, and representativeness assessment"
    - id: dq_measurement_traceability
      applies_to: "mass, energy, tests, and releases"
      requirement: "Retain calibration status, sampling method, unit conversions, allocation worksheets, data owner, and raw-to-normalized lineage for every material inventory driver."
      evidence: "calibration certificates, meter and scale registers, laboratory QA, calculation workbook, and audit trail"
    - id: dq_supplier_and_upstream_coverage
      applies_to: "purchased materials, parts, and subassemblies"
      requirement: "Report supplier-specific mass coverage and the share represented by secondary datasets. Match upstream datasets to material, technology, geography, and period; disclose proxies and missing links."
      evidence: "supplier coverage matrix, dataset mapping register, proxy rationale, and gap log"
    - id: dq_test_completeness
      applies_to: "factory testing"
      requirement: "Demonstrate that released output passed the declared test plan and that test energy, consumables, rework, rejects, and destructive samples reconcile to the tested population."
      evidence: "approved test plan, test-result traceability, equipment calibration, and disposition reconciliation"
validation_rules:
  - rule_id: validate_family_identity
    applies_to: "product identity"
    rule: "Reject a data package that omits apparatus family, homogeneous model-group rationale, applicable standard, rated-voltage basis, rated-current basis, pole or contact configuration, or any family-relevant switching, protection, control, or connector characteristic."
    source_ids:
      - iec-60947-1-2020
      - iec-60947-2-2024
      - iec-60947-3-2020
      - iec-60947-4-1-2023
      - iec-60947-5-1-2024
      - iec-60269-1-2024
      - iec-61984-2008
  - rule_id: validate_voltage_scope
    applies_to: "product identity"
    rule: "Reject apparatus with a declared rated voltage exceeding 1,000 V or with ambiguous AC/DC rated-voltage evidence. Do not use a 440 V household circuit-breaker rule to validate unrelated industrial, photovoltaic, storage, charging, fuse, contactor, relay, or connector products."
    source_ids:
      - iec-60947-1-2020
      - iec-60898-1-2015
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Require exactly 1 kg net conforming tested apparatus linked to product flow 13907748-8b4f-4da3-8108-c81720ca7799, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg. Packaging mass shall be separate."
    source_ids: []
  - rule_id: validate_material_balance
    applies_to: "materials and production losses"
    rule: "Require material receipts, stock change, incorporated product mass, rework, scrap, rejects, and waste destinations to reconcile within a documented tolerance. Reject unexplained generic material compositions or a single-device BOM extrapolated to another family."
    source_ids:
      - iec-62474-2018
  - rule_id: validate_process_and_test_coverage
    applies_to: "foreground boundary"
    rule: "Require assembly and family-specific factory testing for every data package. Require each controlled preparation operation and supplied primary packaging activity when applicable, together with energy, aids, wastes, direct releases, and dispositions."
    source_ids:
      - iec-60947-1-2020
      - iec-ts-63058-2021
  - rule_id: validate_allocation
    applies_to: "shared production and test burdens"
    rule: "Require subdivision or a documented causal allocation driver before mass allocation. Reject undisclosed cross-family allocation and netting of scrap credits from material inputs."
    source_ids:
      - iec-ts-63058-2021
  - rule_id: validate_data_lineage
    applies_to: "foreground records"
    rule: "Require aligned temporal coverage, site and supplier coverage, calibration evidence, raw-to-normalized calculations, upstream dataset links, proxy disclosure, and a quantified residual or unknown-material share."
    source_ids:
      - iec-62474-2018
      - iec-ts-63058-2021
published_dataset_profile:
  dataset_role: "Product-family-specific factory-gate foreground dataset for production of tested finished low-voltage switching, protecting, control-switching, or connection apparatus."
  downstream_use: "secondary_dataset; background_dataset for building, industrial, photovoltaic, energy-storage, charging-infrastructure, and other product systems when the declared family, ratings, geography, technology, and period match."
  allowed_use: "Cradle-to-gate inventories, supplier footprints, product-system models, and comparisons within the same apparatus family and equivalent declared performance class."
  excluded_use: "Whole-category average extrapolation from one family; comparison across incompatible electrical functions or ratings; claims about operational losses, service life, reliability, installation, board or cabinet performance, maintenance, replacement, or end-of-life without separate evidence and scenarios."
  required_metadata: "PCR id and version; apparatus family; model group; AC/DC application; rated voltage and current; poles or contacts; applicable standard and edition; switching, protection, control, or connector ratings; BOM and material coverage; contact, conductor, insulation, electronic, and arc-control composition where present; controlled and purchased processes; assembly and test plan; pass, rework, reject, and destructive-sample disposition; packaging convention; site, geography, period, supplier coverage, allocation, upstream datasets, proxies, and exclusions."
  required_quality_disclosure: "Foreground and supplier-data shares; material mass coverage and residual unknown share; temporal and geographic representativeness; measurement and calibration coverage; material, energy, waste, release, and test reconciliation; allocation drivers; proxy datasets; missing family qualifiers; and limitations on comparison."
  update_trigger: "Product-family or rated-performance change; BOM, contact, conductor, insulation, enclosure, electronics, or arc-control redesign; supplier or material change; production or test-route change; standard or test-plan revision; site, electricity, packaging, allocation, or upstream-dataset change that materially affects the result; or foreground data older than the review interval."
