allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared production lines and utilities"
    rule: "First separate records by apparatus family, model group, production route, and test plan. Use physical submetering, work orders, machine time, test logs, and production quantities before applying allocation."
    source_ids:
      - iec-ts-63058-2021
  - rule_id: allocation_causal_then_mass
    applies_to: "inseparable shared inputs and outputs"
    rule: "When subdivision is impracticable, use a documented causal driver such as machine time, test duration, or measured energy demand. Use net conforming product mass only when no defensible causal relation is available, and disclose the affected share and sensitivity."
    source_ids:
      - iec-ts-63058-2021
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework, rejects, and destructive testing"
    rule: "Return rework burdens to the model group that caused them. Assign non-reworkable rejects and destructive-test articles to the tested production lot; do not distribute one family's test burden across unrelated families."
    source_ids:
      - iec-60947-1-2020
  - rule_id: allocation_recycling_separate
    applies_to: "manufacturing scrap and recovered materials"
    rule: "Report scrap mass, composition, and actual treatment route at the factory gate. Do not net scrap revenue, recycled-content claims, or avoided virgin-material credits from foreground inputs; any recycling credit requires a separately declared downstream method and sensitivity result."
    source_ids:
      - iec-ts-63058-2021
