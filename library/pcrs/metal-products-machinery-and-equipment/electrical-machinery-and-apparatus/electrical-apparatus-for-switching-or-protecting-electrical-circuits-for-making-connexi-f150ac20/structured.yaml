product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.electrical-machinery-and-apparatus.electrical-apparatus-for-switching-or-protecting-electrical-circuits-for-making-connexi-f150ac20"
  classification_refs: "CPC 3.0: 46212"
  covered_products: "Discrete apparatus rated not above 1,000 V whose principal function is circuit switching, circuit protection, electromechanical control switching, or electrical connection, including circuit-breakers, fuses and fuse apparatus, switches and disconnectors, relays, contactors, motor-starter switching devices, terminals, plugs, sockets, and connectors."
  excluded_products: "Apparatus whose declared rated voltage exceeds 1,000 V; equipped boards, consoles, cabinets, and other assembled control or distribution bases; optical-fibre connectors; standalone power-conversion or programmable-control equipment whose principal function is not switching, protection, or connection; loose parts not placed on the market as the declared apparatus; installation, use, and end-of-life services."
  representative_product: "One declared homogeneous model group from one apparatus family; no single family is representative of all CPC 46212 products."
  production_route: "Receipt of materials and components; controlled forming, machining, moulding, contact or conductor preparation and surface treatment when performed; mechanical and electrical assembly; family-specific factory testing; and conditional primary packaging."
  market_state: "Tested finished apparatus at the factory gate, with separate packaging mass and the supplied accessories declared."
functional_unit:
  what: "Tested finished low-voltage switching, protecting, control-switching, or electrical-connection apparatus from one declared product family and homogeneous model group."
  how_much: "1 kg net mass of apparatus, excluding separately reported packaging."
  how_well: "Meets the declared applicable product standard and factory acceptance criteria for its family and declared electrical ratings; nonconforming, untested, or mixed-family output is excluded."
  how_long_or_cycle: "One completed manufacturing and factory-testing cycle; service life and number of switching or mating operations are qualifiers, not part of the 1 kg production reference."
  reference_flow_link: "conforming_tested_apparatus"
system_boundary:
  rules:
    - rule_id: boundary_family_separation
      applies_to: "all foreground data packages"
      rule: "Model one declared apparatus family and homogeneous model group. Separate circuit-breakers, fuses, switches or disconnectors, relays or control devices, contactors or starters, and connection devices whenever their bills of materials, manufacturing routes, or factory tests differ materially."
      source_ids:
        - iec-60947-1-2020
        - iec-60947-2-2024
        - iec-60947-3-2020
        - iec-60947-4-1-2023
        - iec-60947-5-1-2024
        - iec-60269-1-2024
        - iec-61984-2008
    - rule_id: boundary_cradle_to_gate
      applies_to: "declared product system"
      rule: "Include upstream production of received materials and purchased components plus controlled component preparation, assembly, factory testing, direct utilities, process aids, production wastes, and primary packaging when supplied."
      source_ids:
        - iec-60947-1-2020
        - iec-ts-63058-2021
    - rule_id: boundary_material_identity
      applies_to: "bill of materials"
      rule: "Record actual material and component identities and masses, including conductors, contacts and plating, structural metals, insulating polymers or thermosets, elastomers, ceramics, coils, magnets, electronics, arc-control parts, fasteners, and other family-specific parts. Do not substitute a generic household-device composition for the declared apparatus."
      source_ids:
        - iec-62474-2018
        - iec-60947-1-2020
    - rule_id: boundary_factory_tests
      applies_to: "factory testing"
      rule: "Include the actual family-specific routine or acceptance tests, test electricity, consumed test articles or consumables, rework, rejects, and directly measured releases. Declare the applicable product standard and test plan."
      source_ids:
        - iec-60947-1-2020
        - iec-60947-2-2024
        - iec-60947-3-2020
        - iec-60947-4-1-2023
        - iec-60947-5-1-2024
        - iec-60269-1-2024
        - iec-61984-2008
    - rule_id: boundary_use_and_system_exclusion
      applies_to: "downstream scenarios"
      rule: "Exclude installation, board or cabinet integration, operational losses, switching or contact wear, maintenance, replacement, and end-of-life from the default factory-gate result. Model them only in separately declared downstream scenarios using family-specific performance and service-life evidence."
      source_ids:
        - iec-ts-63058-2021
        - iec-60898-1-2015
