  reference_flow_link: "finished_motor_generator"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary is gate-to-gate manufacture. Purchased materials and components cross the starting gate; component preparation, winding, rotor and stator assembly, impregnation or curing where performed, final assembly, testing, finishing, and packing remain foreground operations. The manufacturing-chain decomposition and the need to link gate-to-gate records to upstream datasets are supported by nordelof-tillman-2018-motor-manufacturing."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "all foreground processes"
      rule: "Include all operations under the reporting manufacturer's operational control from receipt of purchased materials or components through release of the packed finished motor or generator; disclose outsourced steps and do not silently omit them."
      source_ids:
        - nordelof-tillman-2018-motor-manufacturing
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased product inputs"
      rule: "Link each purchased material, component, electricity supply, and fuel to an upstream dataset matching material grade, product state, technology, geography, and delivery boundary; do not count upstream emissions as direct factory emissions."
      source_ids:
        - nordelof-tillman-2018-motor-manufacturing
    - rule_id: boundary_route_condition
      applies_to: "conditional technologies"
      rule: "Include permanent magnets only for the declared permanent-magnet route, carbon brushes only for a brushed commutated route, and direct-fired curing gas and its direct fossil carbon dioxide only when those operations occur at the reporting site."
      source_ids: []
    - rule_id: boundary_additional_exchanges
      applies_to: "facility inventory completeness"
      rule: "Add any additional crossing exchange as a separate substance- or product-specific row with its own identity, property, amount method, and evidence; never replace missing detail with a collective material, utility, waste, or emissions label."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "purchased materials and components received at the reporting manufacturing facility gate, with the in-house versus purchased-subassembly split declared"
  starting_condition_role: "foreground gate-to-gate starting condition; upstream production remains represented by linked datasets"
  product_classification_scope: "complete products meeting the semantic CPC 46111 boundary, independent of any one route or nameplate rating within the three covered branches"
  recursive_input_rule: "a purchased motor or generator incorporated into another covered product is recorded as a separate same-category product input with its own upstream dataset and is not recursively re-expanded inside this foreground package"
  upstream_dataset_requirement: "every purchased material, component, packaging item, electricity supply, and fuel requires a geography-, technology-, grade-, and product-state-compatible upstream dataset"
  disclosure: "disclose the product branch, technology, rated output, production geography, reporting period, operations performed in-house, outsourced operations, packaging inclusion, cut-offs, allocation, and all missing upstream datasets"
