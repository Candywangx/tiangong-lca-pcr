validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "reference product"
    rule: "Confirm that the saleable reference product is a complete product within one of the three covered branches and is not a photovoltaic generator, AC-only machine, generating set, rotary converter, standalone part, or larger host equipment."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_mass
    applies_to: "quantitative reference"
    rule: "Confirm that accepted net product mass plus included dispatch packaging mass equals the denominator used to normalize all rows to exactly 1 kg; report both component masses."
    source_ids: []
  - rule_id: validate_route_applicability
    applies_to: "conditional rows"
    rule: "Confirm that NdFeB and ferrite magnet rows, carbon brushes, natural-gas curing, and direct fossil CO2 are present only for applicable declared routes, and that mutually exclusive magnet rows are not both populated unless the product actually contains both chemistries."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm that every additional material, component, energy carrier, waste, and elementary emission is represented by one concrete atomic exchange with its own property, unit, amount method, and identity resolution status."
    source_ids: []
  - rule_id: validate_mass_energy_reconciliation
    applies_to: "foreground records"
    rule: "Reconcile material issues, stock changes, incorporated mass, scrap, rejects, packed output, electricity, and gas to the common reporting period; investigate and document residuals."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Confirm public state-100 identity, English and Chinese baseName, flow type, classification, reference property, unit group, product state, geography, technology, and generalComment before reuse; blank UUID rows remain unresolved rather than proxied."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared processes and scrap"
    rule: "Confirm subdivision was attempted first, every residual allocation has a causal driver and disclosed fraction, scrap is reported gross, and no upstream or recycling burden is double-counted."
    source_ids: []
  - rule_id: validate_source_boundary
    applies_to: "direct and upstream emissions"
    rule: "Confirm that only on-site emissions are direct foreground elementary flows and that grid and fuel-supply emissions remain in linked upstream datasets."
    source_ids:
      - nordelof-tillman-2018-motor-manufacturing
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset; foreground component in a lifecyclemodel"
  allowed_use: "factory-gate production of complete CPC 46111 products with matching branch, technology, rating basis, geography, reporting period, boundary, product mass, and packing state"
  excluded_use: "photovoltaic generators; AC-only machines; generating sets; rotary converters; standalone parts; use-stage electricity or lifetime performance; products or geographies represented only by an undisclosed proxy"
  required_metadata: "canonical PCR id; reference UUID; product branch; rated output and basis; motor/generator function; commutation and magnet technology; duty; rated voltage; cooling; enclosure; embedded-controller inclusion; net and packed masses; geography; reporting period; operations in-house and outsourced; packaging state; allocation; cut-offs; data-quality rating"
  required_quality_disclosure: "foreground record coverage; instrument calibration; temporal representativeness; material and energy reconciliation; route applicability; upstream dataset matches and proxies; unresolved UUIDs; unresolved range evidence; direct-versus-upstream emissions split"
  update_trigger: "material change in product branch, design or bill of materials, magnet or commutation technology, rated output basis, production route, site, electricity or fuel supply, allocation, packaging, reporting period, or data quality"
