measurement_rules:
  - id: reference_mass
    applies_to: "reference product and all mass-normalized exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net finished-machine mass and included dispatch packaging separately, then report their sum as the packed reference product; normalize every exchange to exactly 1 kg packed product and disclose both masses."
  - id: energy_conversion
    applies_to: "purchased electricity and natural gas"
    required_property_ref:
      name: "energy for electricity; volume for gaseous natural gas"
      uuid: ""
    required_unit: "MJ for electricity; m3 for natural gas"
    rule: "Preserve metered source units and reference conditions. Convert electricity to MJ using 1 kWh = 3.6 MJ; disclose the temperature and pressure basis for gas volume and do not infer it from mass without a documented composition and conversion."
  - id: rated_output_basis
    applies_to: "category eligibility and product metadata"
    required_property_ref:
      name: "rated mechanical output for motors or rated electrical output for generators"
      uuid: ""
    required_unit: "W or kW"
    rule: "Record the nameplate rating and rating basis. Apply the 37.5 W threshold only to the first category branch; do not apply it to the separate “other DC motors” or “DC generators” branches."
  - id: scrap_mass_balance
    applies_to: "steel, copper, and aluminium inputs and scrap outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile input mass to incorporated material, saleable co-product if any, waste scrap, and measured stock change over the reporting period without netting recycled scrap from virgin or purchased input."
