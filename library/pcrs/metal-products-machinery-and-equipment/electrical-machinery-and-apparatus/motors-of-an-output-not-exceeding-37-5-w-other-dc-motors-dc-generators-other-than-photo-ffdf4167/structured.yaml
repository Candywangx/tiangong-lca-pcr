allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "mixed products, routes, or production lines"
    rule: "First subdivide metered processes, batches, and material issues by product family, technology route, and reporting period wherever physically separate records exist."
    source_ids: []
  - rule_id: allocation_causal
    applies_to: "remaining shared energy and auxiliary operations"
    rule: "Allocate remaining shared burdens using a documented causal driver such as machine time, metered energy, throughput mass, or test time; mass allocation is permitted only when it reasonably represents the physical cause."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "steel, copper, and aluminium scrap"
    rule: "Report scrap mass and destination explicitly. Do not subtract scrap revenue, recycled-content credit, or avoided primary production from foreground inputs or direct emissions; any end-of-life or substitution credit must be a separately disclosed scenario."
    source_ids: []
  - rule_id: allocation_no_double_count
    applies_to: "purchased subassemblies and outsourced operations"
    rule: "Do not include both an upstream purchased-subassembly dataset and the same subassembly's fabrication burdens inside the foreground system unless the boundary split and non-overlap are demonstrated."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_fabrication"
      flow_role: "electrical steel, shaft bar, and aluminium housing inputs"
      record_type: "purchase, receiving, issue, return, stock, and bill-of-material records"
