allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared lines and services"
    rule: "First avoid allocation through lot-, line- or equipment-level metering and subdivision."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "unavoidable shared exchanges"
    rule: "Allocate using a documented causal physical driver such as machine time, metered energy, processed mass, bath loading or occupied volume; do not default to revenue."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recoverable scrap"
    rule: "Report gross inputs and gross scrap outputs without netting. Declare the end-of-waste boundary and recycling method; do not credit avoided production inside this foreground inventory unless explicitly required by goal and scope."
    source_ids: []
  - rule_id: allocation_quality
    applies_to: "family datasets"
    rule: "Allow production-weighted family averages only for sufficiently homogeneous functions, specifications, materials and routes; otherwise publish separate datasets."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "part_manufacturing"
      flow_role: "purchased material input"
      record_type: "ERP issues, returns and weigh tickets"
      raw_fields: "identity; grade; form; supplier; lot; issued and returned mass; recycled content"
      collection_method: "reconcile ERP movements, lot travellers and calibrated scales"
      unit: "kg"
      frequency: "each lot; monthly reconciliation"
      temporal_coverage: "at least 12 representative months or full shorter campaign"
      site_scope: "all included lines and subcontracted additions"
      aggregation_rule: "issued mass minus documented unopened returns; normalize by accepted output"
      quality_evidence: "specification; supplier declaration; traveller; calibration; reconciliation"
    - protocol_id: cp_energy_records
      process_id: "part_manufacturing"
      flow_role: "electricity and gas input"
      record_type: "meter, invoice, cylinder or tank inventory"
      raw_fields: "carrier; readings; quantity; reference conditions; allocation driver"
      collection_method: "dedicated meters where available; otherwise reconcile commercial or inventory records"
      unit: "MJ; m3"
      frequency: "meter or delivery interval; monthly reconciliation"
      temporal_coverage: "production reporting period"
      site_scope: "included operations and allocated support"
      aggregation_rule: "remove unrelated loads; allocate with declared driver; normalize by output"
      quality_evidence: "calibration; invoice; inventory reconciliation; allocation worksheet"
    - protocol_id: cp_water_chemical_records
      process_id: "part_manufacturing"
      flow_role: "water and chemical input"
      record_type: "meter, tank balance, batch sheet, concentration certificate"
      raw_fields: "water quantity; density; solution mass; active concentration; bath charge and replenishment"
      collection_method: "reconcile meters and batches; calculate active chemical mass"
      unit: "kg"
      frequency: "each charge or meter interval; monthly reconciliation"
      temporal_coverage: "production reporting period"
      site_scope: "each included aqueous line"
      aggregation_rule: "sum attributable input; convert volume with documented density; normalize by output"
      quality_evidence: "calibration; certificate; batch sheet; tank reconciliation"
    - protocol_id: cp_output_mass
      process_id: "part_manufacturing"
      flow_role: "product and waste output"
      record_type: "inspection release, scale, manifest, tank record"
      raw_fields: "product mass; waste identity; wet or dry basis; composition; destination; dispatch mass"
      collection_method: "weigh accepted product and segregated wastes; reconcile tanks and manifests"
      unit: "kg"
      frequency: "each lot or dispatch; monthly reconciliation"
      temporal_coverage: "production reporting period"
      site_scope: "all included operations and hand-off points"
      aggregation_rule: "sum atomic outputs separately; normalize by output; no scrap netting"
      quality_evidence: "release; calibration; manifest; analysis; mass balance"
    - protocol_id: cp_direct_emission
      process_id: "part_manufacturing"
      flow_role: "direct fossil CO2"
      record_type: "stack or fuel record"
      raw_fields: "emission; fuel; carbon content; fossil fraction; oxidation basis; driver"
      collection_method: "compliant measurement or disclosed calculation from collected fuel data"
      unit: "kg"
      frequency: "test or accounting interval; monthly reconciliation"
      temporal_coverage: "production reporting period"
      site_scope: "included combustion sources"
      aggregation_rule: "sum attributable direct fossil CO2; normalize by output"
      quality_evidence: "stack report or fuel certificate; worksheet; fuel balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = attributable exchange / net accepted finished-part mass"
      inputs:
        - "exchange quantity"
        - "accepted output mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity
      applies_to: "purchased electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - kWh
      output: "MJ electricity"
      source_ids: []
    - id: calc_active_naoh
      applies_to: "sodium-hydroxide solution"
      rule: "active NaOH mass = solution mass × certified mass fraction"
      inputs:
        - "solution mass"
        - fraction
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: calc_water_mass
      applies_to: "water measured by volume"
      rule: "water mass = volume × documented density at declared temperature"
      inputs:
        - volume
        - density
        - temperature
      output: "kg water or wastewater"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "on-site combustion"
      rule: "Use direct measurement or a disclosed calculation from collected fuel quantity, carbon content, fossil fraction and oxidation basis"
      inputs:
        - "stack or fuel records"
      output: "kg direct fossil CO2"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and materials"
      requirement: "Retain family rule, drawing revision, function, voltage class where relevant, grade, purchased form and surface or insulation specification."
      evidence: "specification; drawing; bill of materials; supplier certificate"
    - id: dq_time
      applies_to: "foreground records"
      requirement: "Use one representative reporting period; justify abnormal batches and periods shorter than 12 months."
      evidence: "calendar; monthly reconciliation; exception log"
    - id: dq_measurement
      applies_to: "quantities"
      requirement: "Use calibrated instruments or reconciled commercial records; retain units, reference conditions, conversions and allocation drivers."
      evidence: "calibration; invoices; meter extracts; workbook"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile accepted output, major inputs and wastes; document exclusions and each not-applicable conditional row."
      evidence: "mass balance; manifests; route checklist"
    - id: dq_geography_technology
      applies_to: "upstream and foreground data"
      requirement: "Match declared material state, geography, energy supply and technology or explain substitutions."
      evidence: "dataset metadata; supplier geography; justification"
    - id: dq_uncertainty
      applies_to: "rows without ranges"
      requirement: "Preserve foreground evidence and do not invent benchmark ranges; retain unresolved two-source range needs for review."
      evidence: "unresolved range-evidence register; review record"
