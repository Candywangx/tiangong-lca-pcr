allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all foreground processes"
    rule: "Avoid allocation by subdivision, separate metering and separate material records whenever practical. Same-category intermediates transferred between foreground processes carry burdens without creating a second final product."
    source_ids:
      - iea-pvps-t12-18-2020
  - rule_id: allocation_shared_facility
    applies_to: "shared electricity, water, climate control and waste handling"
    rule: "Allocate shared facility quantities using a documented causal driver such as machine-hours, metered energy, occupied controlled area-time or processed mass. Production count or revenue may be used only when a causal driver is unavailable and the sensitivity is disclosed."
    source_ids:
      - iea-pvps-t12-18-2020
  - rule_id: allocation_recycling
    applies_to: "recycled inputs and recyclable manufacturing waste"
    rule: "Use a recycled-content cut-off approach as the default foreground accounting convention. Report any avoided-burden or system-expansion result separately and do not net it silently against factory-gate burdens."
    source_ids:
      - iea-pvps-t12-18-2020
      - jrc-2025-pv-carbon-footprint
  - rule_id: allocation_bipv
    applies_to: "building-integrated photovoltaic product"
    rule: "When one sold BIPV product also replaces a building element, declare the multifunctionality and allocate only with clearly described physical or functional criteria; avoid unreported credits."
    source_ids:
      - iea-pvps-t12-18-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_bom
      process_id: "component_receipt_generator_assembly"
      flow_role: "received and issued components"
      record_type: "approved bill of materials, receiving inspection and material issue/return records"
      raw_fields: "product configuration; supplier; lot; component identity; technology; issued quantity; returned quantity; mass; included-component flag"
      collection_method: "reconcile engineering BOM with warehouse issues, substitutions and cycle counts"
      unit: "kg and Item(s)"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "representative production period, normally at least 12 consecutive months"
      site_scope: "every reporting facility and outsourced stage inside the foreground boundary"
      aggregation_rule: "net issue equals issued minus unused return; normalize by released conforming items"
      quality_evidence: "approved BOM revision, supplier trace, calibration or scale record, substitution approval and inventory reconciliation"
    - protocol_id: cp_energy_records
      process_id: "generator_assembly_ac_electronics_integration_electrical_qualification_packing_release"
      flow_role: "electricity and other metered energy"
      record_type: "meter, submeter, invoice and operating-hour records"
      raw_fields: "meter id; opening and closing reading; energy carrier; process area; operating hours; common-facility share; production count; rated kWp released"
      collection_method: "collect meter intervals and reconcile with invoices; allocate only residual common use"
      unit: "kWh or carrier-specific unit"
      frequency: "monthly or finer"
      temporal_coverage: "same period as product output"
      site_scope: "each reporting facility"
      aggregation_rule: "direct meter use plus documented allocated common use, divided by conforming output"
      quality_evidence: "meter calibration, invoice reconciliation, allocation driver and missing-interval log"
    - protocol_id: cp_water_aid_records
      process_id: "generator_assembly"
      flow_role: "water and process aids"
      record_type: "meter, batch sheet and material issue records"
      raw_fields: "withdrawal; discharge; recirculation; aid identity; issued mass; returned mass; batch; process step"
      collection_method: "reconcile water balance and chemical issues by batch"
      unit: "m3 and kg"
      frequency: "each batch or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "each wet-process or assembly facility"
      aggregation_rule: "fresh withdrawal excludes internal recirculation; net aid use equals issue minus return"
      quality_evidence: "meter status, batch sheet, purchase reconciliation and discharge record"
    - protocol_id: cp_ac_integration_records
      process_id: "ac_electronics_integration"
      flow_role: "integrated electronics and completed assemblies"
      record_type: "configuration, serial-number and work-order records"
      raw_fields: "generator serial; inverter/control/protection identities; firmware; component quantities; DC/AC rating; completion status"
      collection_method: "serial-level configuration reconciliation"
      unit: "Item(s) and kg"
      frequency: "each unit"
      temporal_coverage: "same period as product output"
      site_scope: "every integration line"
      aggregation_rule: "sum incorporated components and completed assemblies by product configuration"
      quality_evidence: "approved configuration, serial trace, work order and nonconformance record"
    - protocol_id: cp_test_records
      process_id: "electrical_qualification"
      flow_role: "tested units, performance and safety results"
      record_type: "calibrated test-bench and release records"
      raw_fields: "serial; test procedure; rating condition; measured power; voltage; current; insulation/safety result; pass, rework or reject status"
      collection_method: "retain test result linked to product serial and declared specification"
      unit: "Item(s), Wp, V, A and method-specific units"
      frequency: "each released unit or justified sampling plan"
      temporal_coverage: "same period as product output"
      site_scope: "every release-test location"
      aggregation_rule: "count only conforming released units; rework is counted once after final pass"
      quality_evidence: "calibration certificate, procedure revision, raw result, sampling justification and release signature"
    - protocol_id: cp_packaging_records
      process_id: "packing_release"
      flow_role: "outbound packaging"
      record_type: "packaging BOM, warehouse issues and reusable-packaging logs"
      raw_fields: "packaging material; mass; issued quantity; product count; reuse cycles; losses"
      collection_method: "reconcile packaging BOM and dispatch records"
      unit: "kg and trips"
      frequency: "each lot, aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "each packing site"
      aggregation_rule: "single-use mass plus reusable mass divided by verified reuse count"
      quality_evidence: "packaging specification, scale record, reuse log and dispatch record"
    - protocol_id: cp_waste_records
      process_id: "all_foreground_processes"
      flow_role: "rejects, scrap, wastewater sludge and packaging waste"
      record_type: "waste manifest, scale ticket and internal scrap log"
      raw_fields: "waste identity; material; mass; source process; treatment route; returned-to-supplier flag; date"
      collection_method: "reconcile internal scrap generation with dispatched waste and inventory change"
      unit: "kg or Item(s)"
      frequency: "each dispatch, aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "each reporting facility"
      aggregation_rule: "dispatched waste plus closing-minus-opening stored waste, separated by treatment"
      quality_evidence: "scale calibration, waste manifest, contractor receipt and inventory reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "generator_assembly_ac_electronics_integration_electrical_qualification"
      flow_role: "direct air, water and soil releases"
      record_type: "continuous monitor, stack or effluent test, material balance and permit report"
      raw_fields: "substance; compartment; concentration; flow rate; duration; capture; destruction efficiency; method"
      collection_method: "use measured releases where available; calculations require traceable activity and factor"
      unit: "kg"
      frequency: "monitoring interval or batch"
      temporal_coverage: "same period as product output"
      site_scope: "each emitting point inside the foreground boundary"
      aggregation_rule: "integrate concentration and flow over time or apply documented mass balance without double counting captured material"
      quality_evidence: "laboratory accreditation, instrument calibration, sampling plan, permit report and calculation worksheet"
    - protocol_id: cp_output_release
      process_id: "all_foreground_processes"
      flow_role: "intermediates and released reference product"
      record_type: "production, transfer, warehouse and shipment records"
      raw_fields: "item count; serial or lot; product configuration; total mass; rated DC power; status; process transfer; release date"
      collection_method: "reconcile process transfers and finished-goods release"
      unit: "Item(s), kg and kWp"
      frequency: "each lot or unit"
      temporal_coverage: "same period as inputs"
      site_scope: "each reporting facility"
      aggregation_rule: "final output is conforming releases adjusted for opening and closing finished-goods inventory"
      quality_evidence: "ERP reconciliation, release record, test link and stock count"
  calculation_rules:
    - id: calc_item_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period process amount / conforming released generator items in the same represented product configuration"
      inputs:
        - "period quantity"
        - "released item count"
        - "inventory change"
      output: "amount per released item"
      source_ids: []
    - id: calc_capacity_intensity
      applies_to: "capacity-normalized disclosure"
      rule: "capacity intensity = per-item amount / tested or nameplate rated DC power in kWp for that item configuration"
      inputs:
        - "per-item amount"
        - "rated DC power in Wp or kWp"
      output: "amount per kWp"
      source_ids:
        - iea-pvps-t12-18-2020
    - id: calc_net_material_use
      applies_to: "components, process aids and packaging"
      rule: "net material use = issued quantity - unused returns + opening work-in-process - closing work-in-process"
      inputs:
        - issue
        - "return and inventory records"
      output: "net consumed mass or item count"
      source_ids:
        - jrc-2025-pv-carbon-footprint
    - id: calc_shared_utility
      applies_to: "shared energy and water"
      rule: "allocated quantity = shared measured quantity x causal driver share; direct metered use is not allocated again"
      inputs:
        - "shared meter"
        - "process driver"
        - "total driver"
      output: "allocated process utility"
      source_ids:
        - iea-pvps-t12-18-2020
    - id: calc_waste_balance
      applies_to: "manufacturing waste"
      rule: "generated waste = dispatched waste + closing stored waste - opening stored waste - documented returned reusable material"
      inputs:
        - dispatch
        - "storage and return records"
      output: "waste by material and route"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "product and manufacturing losses"
      rule: "accepted material mass = released product mass + dispatched waste + closing-minus-opening material and work-in-process inventory + measured direct mass releases"
      inputs:
        - BOM
        - scale
        - waste
        - "inventory and emission records"
      output: "reconciliation difference and completeness ratio"
      source_ids:
        - jrc-2025-pv-carbon-footprint
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Product name, technology, architecture, rated power, AC/DC configuration and included components must identify one non-ambiguous sold configuration."
      evidence: "approved specification, BOM revision, nameplate and product serial/lot"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use one representative production period, normally at least 12 consecutive months; disclose start/end dates, shutdowns, ramp-up and substitutions."
      evidence: "dated meters, invoices, production and inventory records"
    - id: dq_geography
      applies_to: "foreground and upstream data"
      requirement: "Identify each manufacturing site and electricity/water supply geography; justify any proxy geography."
      evidence: "site record, supply contract and proxy justification"
    - id: dq_technology
      applies_to: "route-specific data"
      requirement: "Do not average crystalline-silicon, thin-film, emerging, DC-only and AC-integrated routes without weights and separate route evidence."
      evidence: "route map, production volumes and weighted calculation"
    - id: dq_completeness
      applies_to: "BOM, utilities, waste and emissions"
      requirement: "Reconcile material, energy, output, waste and direct release records; explain unresolved balances and omitted flows."
      evidence: "reconciliation worksheets and completeness ratio"
    - id: dq_secondary_data
      applies_to: "purchased inputs"
      requirement: "Select current, geographically and technologically representative upstream datasets; document dataset identity, version used during modelling and proxy limitations outside PCR UUID fields."
      evidence: "dataset selection log and representativeness assessment"
    - id: dq_testing
      applies_to: "product release"
      requirement: "Link performance and safety evidence to the represented configuration and retain calibration and sampling evidence."
      evidence: "test report, calibration certificate and release record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "dataset identity"
    rule: "Fail if the canonical PCR id, product flow UUID, Product flow type, CPC 46113 scope or required product qualifiers are missing or contradictory."
    source_ids:
      - unsd-cpc-v3-photovoltaic-generators
  - rule_id: validation_reference_amount
    applies_to: "quantitative reference"
    rule: "Require exactly 1 Item(s) of 3f66ec10-aedd-4032-baff-5f7764c1670e with Number of items 01846770-4cfe-4a25-8ad9-919d8d378345; require a declared rated DC power to enable per-kWp disclosure."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "foreground boundary"
    rule: "Fail if an electricity flow, installed power station, construction service, separately sold inverter or battery is used as the reference product, or if distribution/installation/use/end-of-life burdens are silently mixed into the factory-gate package."
    source_ids:
      - unsd-cpc-v3-photovoltaic-generators
      - jrc-2025-pv-carbon-footprint
  - rule_id: validation_route
    applies_to: "product technology and configuration"
    rule: "Require separate disclosure and inventory for technology, product architecture, AC/DC output and integrated electronics. Reject an unlabeled single-technology dataset presented as a generic category average."
    source_ids:
      - jrc-2025-pv-carbon-footprint
      - iea-pvps-t12-18-2020
  - rule_id: validation_bom_mass
    applies_to: "components and outputs"
    rule: "Require BOM-to-product-and-loss mass reconciliation and investigate material differences beyond the producer's documented measurement uncertainty."
    source_ids:
      - jrc-2025-pv-carbon-footprint
  - rule_id: validation_energy_water
    applies_to: "utilities"
    rule: "Require period-aligned meter or invoice reconciliation, causal allocation of shared utilities and no double counting of recirculated water."
    source_ids:
      - iea-pvps-t12-18-2020
  - rule_id: validation_test_release
    applies_to: "performance and safety"
    rule: "Require traceable test/release evidence for the represented product configuration; AC-integrated products must identify the applicable inverter or module-integrated electronics test basis."
    source_ids:
      - iec-61215-1-2021
      - iec-61730-1-2023
      - iec-62109-2-2011
      - iec-62109-3-2020
  - rule_id: validation_recursive_input
    applies_to: "same-category input"
    rule: "Require a separate upstream dataset for a purchased photovoltaic generator input and prevent its burdens from being expanded and counted again in the consuming foreground process."
    source_ids: []
  - rule_id: validation_estimate_status
    applies_to: "provisional ranges"
    rule: "Treat all reasoned_estimate ranges as candidate-stage screens only; fail publication readiness if a publication-critical allowed range relies on them without explicit review acceptance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate foreground product data package publishable as a secondary_dataset or background_dataset after methodology and translation review"
  downstream_use: "Foreground process construction for photovoltaic generator manufacture; capacity-normalized product comparisons when configuration and rated-power bases match; input to broader PV system, installation, electricity-generation and lifecycle models as a distinct product-stage dataset"
  allowed_use: "Use for the declared technology, architecture, factory geography, production period, AC/DC configuration and component boundary; weighted market mixes are allowed only with transparent weights and route-specific source datasets"
  excluded_use: "Do not use as photovoltaic electricity, an installed power station, an inverter-only or battery-only dataset, an undeclared generic technology average, or a use/end-of-life dataset"
  required_metadata: "canonical PCR id; product flow UUID; product specification; technology; architecture; module count or active area; rated DC power and rating condition; AC/DC output; integrated-component list; total mass; make-or-buy boundary; factory geography; production period; allocation; upstream dataset identities; test basis"
  required_quality_disclosure: "foreground coverage and period; metering and allocation methods; BOM and mass reconciliation; missing data; proxies; technology mixing; reasoned estimates; data-quality assessment; direct-emission methods; test sampling and calibration"
  update_trigger: "Change in photovoltaic technology, product architecture, rated-power basis, integrated electronics, principal BOM, factory or energy supply; material change in yield, waste or emissions; test specification revision; new representative source evidence; or age beyond the declared representativeness period"
