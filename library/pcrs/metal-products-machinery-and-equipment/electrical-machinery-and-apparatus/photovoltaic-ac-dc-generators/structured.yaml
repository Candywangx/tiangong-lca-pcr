      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Normalize the foreground package to exactly one released generator item. Count only complete products passing release criteria; do not count cells, subassemblies or unpackaged rejects."
  - id: rated_power_disclosure
    applies_to: "reference product and capacity-normalized intensities"
    required_property_ref:
      name: "Declared rated DC power"
      uuid: ""
    required_unit: "Wp or kWp"
    rule: "Retain the measured or nameplate rated DC power and its rating condition. Convert Wp to kWp by division by 1,000. Do not infer capacity from module count, area or a different technology."
  - id: item_capacity_bridge
    applies_to: "comparison of differently sized products"
    required_property_ref:
      name: "Number of items and declared rated DC power"
      uuid: ""
    required_unit: "Item(s) and kWp"
    rule: "Report both per-item and per-kWp results when products of different capacity are compared. The item-to-kWp factor must come from the tested or nameplate value for the represented product configuration."
  - id: mass_composition
    applies_to: "product and incoming material balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure total product mass and the bill-of-material mass by declared component group. Reconcile the component sum with the released-product mass and recorded manufacturing losses."
  - id: energy_units
    applies_to: "purchased electricity and test energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve meter units and convert only with an explicit dimensional factor. Report electricity separately by supply contract, geography and production period when these differ materially."
  - id: water_balance
    applies_to: "process water"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record withdrawal and discharge or consumption consistently; state whether water is recirculated and avoid counting the same recirculated volume as repeated fresh withdrawal."
