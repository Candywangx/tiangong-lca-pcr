  - rule_id: allocation_subdivision_first
    applies_to: "shared manufacturing operations"
    rule: "Avoid allocation by product-specific bills of materials, batch records, test records, and submetered utilities; subdivide production cells or time periods whenever the records permit."
    source_ids: []
  - rule_id: allocation_causal_shared_inputs
    applies_to: "residual shared utilities and consumables"
    rule: "When subdivision is not possible, use a documented causal driver such as machine time, oven occupancy, test duration, or measured throughput that reflects consumption; disclose the driver and test sensitivity to a reasonable alternative."
    source_ids: []
  - rule_id: allocation_scrap_no_credit
    applies_to: "scrap and waste outputs"
    rule: "Report scrap and waste as physical outputs at the factory gate. Do not subtract avoided virgin-material burdens or recycling credits from the foreground manufacturing inventory; downstream models may apply a separately disclosed end-of-life allocation convention."
    source_ids: []
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework and rejected units"
    rule: "Attribute rework inputs and the material and energy burden of rejected units to accepted output using the same production-period records; do not count a rejected transformer as reference output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "transformer_manufacturing"
      flow_role: "material and purchased-subassembly inputs"
      record_type: "purchase, warehouse issue, return, stock and bill-of-material records"
      raw_fields: "material identity; supplier; lot; received mass; issued mass; unused return; opening and closing stock; product serial or batch; route applicability"
      collection_method: "Reconcile purchasing and stores records to the product-specific bill of materials and production order"
      unit: "kg"
      frequency: "Each receipt and production order"
      temporal_coverage: "Representative continuous production period, normally at least 12 months unless justified"
      site_scope: "All included manufacturing buildings and stores at the declared site"
      aggregation_rule: "Net input equals receipts plus opening stock minus returns, closing stock and documented transfers; normalize to accepted units"
      quality_evidence: "Calibrated scale records; invoices; material certificates; stock reconciliation; bill-of-material revision"
    - protocol_id: cp_utility_records
      process_id: "transformer_manufacturing"
      flow_role: "electricity, natural gas and industrial oxygen inputs"
      record_type: "meter, invoice and cylinder-delivery records"
      raw_fields: "meter id; opening and closing readings; energy or gas quantity; reference conditions; delivery quantity; process area; production period; allocation driver"
      collection_method: "Prefer process or production-area submeters; reconcile to site invoices and delivery records"
      unit: "MJ for electricity; m3 for gases"
      frequency: "Meter interval or each delivery, aggregated monthly"
      temporal_coverage: "Same production period as accepted product output"
      site_scope: "All included production and factory-test meters"
      aggregation_rule: "Subtract excluded loads, apply documented causal allocation, and divide by accepted transformer count"
      quality_evidence: "Meter calibration; invoice reconciliation; meter map; excluded-load log"
    - protocol_id: cp_water_chemical_records
      process_id: "transformer_manufacturing"
      flow_role: "process water and sodium hydroxide inputs"
      record_type: "water-meter, batch make-up and chemical issue records"
      raw_fields: "water volume or mass; chemical product mass; NaOH concentration; bath make-up; bath disposal; production order; density conversion"
      collection_method: "Read meters and cleaning-bath records; calculate dry NaOH-equivalent from supplied product mass and concentration"
      unit: "kg"
      frequency: "Each batch or meter interval, aggregated monthly"
      temporal_coverage: "Same production period as accepted product output"
      site_scope: "Included cleaning and testing operations"
      aggregation_rule: "Sum net input, document reuse and stock change, and normalize to accepted transformer count"
      quality_evidence: "Meter calibration; concentration certificate; batch sheet; stock reconciliation"
    - protocol_id: cp_product_acceptance
      process_id: "transformer_manufacturing"
      flow_role: "accepted transformer output"
      record_type: "production order and factory acceptance test record"
      raw_fields: "serial number; product model; acceptance status; rated power; voltages; frequency; phases; losses; impedance; insulation and cooling system; total mass; accessories"
      collection_method: "Count only units with completed acceptance records and link each unit to its product configuration"
      unit: "Item(s) and kg"
      frequency: "Each unit"
      temporal_coverage: "Same production period as inventory records"
      site_scope: "Declared factory and test bay"
      aggregation_rule: "Count accepted units and retain product-level qualifiers; normalize inventory to one accepted unit"
      quality_evidence: "Signed acceptance record; calibrated test equipment; weigh record; configuration release"
    - protocol_id: cp_waste_records
      process_id: "transformer_manufacturing"
      flow_role: "steel, copper, aluminum and waste insulating-oil outputs"
      record_type: "waste container, scale, shipment, stock and treatment records"
      raw_fields: "waste identity; source operation; container; gross and tare mass; stock change; shipment date; destination; treatment route"
      collection_method: "Weigh each shipment or container and reconcile opening and closing waste stock"
      unit: "kg"
      frequency: "Each container or shipment, aggregated monthly"
      temporal_coverage: "Same production period as accepted product output"
      site_scope: "All included production and waste-storage areas"
      aggregation_rule: "Net waste equals shipments plus closing stock minus opening stock and documented incoming transfers; allocate by source records and normalize to accepted units"
      quality_evidence: "Scale calibration; waste manifest; carrier receipt; stock reconciliation; photographs or contamination classification"
    - protocol_id: cp_direct_emissions
      process_id: "transformer_manufacturing"
      flow_role: "direct fossil carbon dioxide output"
      record_type: "stack or exhaust measurement record"
      raw_fields: "source id; fuel-consuming operation; concentration; flow rate; sampling duration; operating hours; fossil attribution; production period"
      collection_method: "Use calibrated direct measurement covering included on-site combustion; calculated values require a separately reviewed rule and factor source"
      unit: "kg"
      frequency: "Each test or continuous interval according to monitoring system"
      temporal_coverage: "Representative operating period aligned with production"
      site_scope: "Every included combustion source"
      aggregation_rule: "Integrate measured mass over operating time, apply documented production allocation, and normalize to accepted units"
      quality_evidence: "Calibration; sampling report; operating log; source inventory; fossil-origin evidence"
  calculation_rules:
    - id: calc_normalize_per_transformer
      applies_to: "all foreground exchanges"
      rule: "Normalized amount equals the net exchange assigned to the product configuration divided by the count of accepted transformers represented by the records."
      inputs:
        - "net exchange"
        - "accepted transformer count"
      output: "exchange per 1 accepted transformer"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity reported in kWh"
      rule: "Electrical energy in MJ equals metered kWh multiplied by 3.6; retain the original meter value and conversion."
      inputs:
        - "metered kWh"
      output: "electricity MJ"
      source_ids: []
    - id: calc_naoh_dry_equivalent
      applies_to: "sodium hydroxide solution"
      rule: "Dry NaOH-equivalent mass equals supplied solution mass multiplied by the supplier-certified NaOH mass fraction."
      inputs:
        - "solution mass"
        - "certified NaOH mass fraction"
      output: "kg dry NaOH equivalent"
      source_ids: []
    - id: calc_inventory_reconciliation
      applies_to: "each material family"
      rule: "Net material input must reconcile to incorporated product mass plus same-material waste, documented other loss, and stock change; investigate and disclose any residual rather than assigning it to an umbrella flow."
      inputs:
        - "net input"
        - "incorporated mass"
        - "waste mass"
        - "other loss"
        - "stock change"
      output: "material-specific reconciliation residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Link every accepted item to a serial number or production order and retain all required reference-flow qualifiers."
      evidence: "Product configuration, nameplate data, acceptance record and bill-of-material revision"
    - id: dq_temporal_alignment
      applies_to: "all foreground records"
      requirement: "Use one representative production period across inputs, outputs and accepted units; disclose shutdowns, commissioning, unusual rework and any shorter-than-12-month period."
      evidence: "Dated meter, purchasing, stock, production, test and waste records"
    - id: dq_completeness
      applies_to: "site boundary"
      requirement: "Reconcile purchasing, utility, output and waste totals; disclose missing meters, estimates, excluded buildings and every actual atomic flow added beyond the minimum rows."
      evidence: "Site flow map, reconciliation worksheet and signed completeness review"
    - id: dq_variant_consistency
      applies_to: "conditional routes"
      requirement: "Apply mutually exclusive or combined core, conductor and insulation rows according to the actual bill of materials; do not infer route from the category name."
      evidence: "Bill of materials, drawings, material certificates and production traveller"
    - id: dq_source_representativeness
      applies_to: "upstream datasets"
      requirement: "Select upstream datasets matching material grade, product state, supplier technology, geography and period where possible; disclose proxies and sensitivity."
      evidence: "Supplier declarations, dataset metadata and proxy log"
    - id: dq_performance_metadata
      applies_to: "downstream interpretation"
      requirement: "Retain rated power, voltage ratio, frequency, phase count, no-load and load losses, test conditions, impedance, cooling and insulation system, reference service life and loading profile because factory-gate mass alone does not describe transformer function."
      evidence: "Nameplate, type or routine test report, technical specification and declared use scenario"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Fail validation unless the output is exactly one accepted Transformer item with the listed product, property and unit-group UUIDs and every required qualifier is populated."
    source_ids:
      - eu-power-transformers-regulation-548-2014
  - rule_id: validation_inventory_identity
    applies_to: "inventory rows"
    rule: "Fail validation when a selected flow combines multiple materials, utilities, wastes, or emissions, when an unresolved row is assigned a proxy UUID, or when a conditional row lacks route applicability."
    source_ids: []
  - rule_id: validation_mass_reconciliation
    applies_to: "material families"
    rule: "Require a documented material-specific reconciliation and investigate non-zero residuals; do not balance one material with another or silently assign a residual to other waste."
    source_ids: []
  - rule_id: validation_boundary_separation
    applies_to: "manufacturing energy and emissions"
    rule: "Fail validation if use-phase transformer losses or upstream emissions from purchased electricity, fuels, or materials are counted as direct factory exchanges."
    source_ids:
      - ec-transformer-impact-assessment-2014
  - rule_id: validation_bilingual_identity
    applies_to: "localized flow displays"
    rule: "Require identical row ids, UUIDs and controlled values across languages and require the exact Tiangong Chinese baseName for every UUID-bearing flow."
    source_ids: []
  - rule_id: validation_unresolved_evidence
    applies_to: "publication readiness"
    rule: "Treat the four unresolved flow UUIDs and every unresolved external range-evidence need as review blockers for publication, while retaining foreground collection requirements for candidate use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific factory-gate foreground manufacturing dataset for one accepted electrical transformer"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supplier-specific or representative transformer manufacturing in product systems when the declared design, rating, technology, geography, period and factory-gate boundary match; linkage to separately modelled transport, installation, use, maintenance and end-of-life stages"
  excluded_use: "Direct comparison of transformer efficiency, lifetime performance or whole-life impacts without compatible rated power, voltage, loss, loading, service-life and downstream scenarios; representation of static converters, inductors, parts, substations or contract manufacturing services"
  required_metadata: "Canonical PCR id; product and UUID identity; all required reference-flow qualifiers; site and production period; bill-of-material revision; route applicability; collection protocols; allocation drivers; accepted-unit count; total mass; upstream dataset choices; exclusions and unresolved evidence"
  required_quality_disclosure: "Temporal and site coverage; meter and scale calibration; record completeness; material reconciliation residuals; data gaps and estimates; proxy upstream datasets; conditional rows; stock changes; scrap destinations; direct-emission measurement coverage; uncertainty and review status"
  update_trigger: "Change in transformer design, rated power family, core or conductor technology, insulation or cooling system, factory or production line, bill of materials, energy supply, cleaning or finishing route, allocation driver, upstream dataset, applicable performance specification, or evidence that materially changes the normalized inventory"
