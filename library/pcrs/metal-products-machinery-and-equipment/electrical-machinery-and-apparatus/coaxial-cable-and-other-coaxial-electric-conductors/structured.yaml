      applies_to: "excluded life-cycle stages"
      rule: "Exclude dispatch packaging, distribution, installation, use, maintenance, and end-of-life from the reference dataset. Disclose the packaging exclusion and do not combine this dataset with a source that includes packaging without boundary adjustment."
