    - rule_id: boundary_cradle_to_gate
      applies_to: "foreground product system"
      rule: "Include production and inbound transport of declared metal, polymer, and energy inputs through conductor preparation, dielectric extrusion, shielding, jacketing, marking, testing, take-up, directly controlled utilities, on-site emissions, and treatment or transfer of manufacturing wastes up to conforming cable at the manufacturing gate."
