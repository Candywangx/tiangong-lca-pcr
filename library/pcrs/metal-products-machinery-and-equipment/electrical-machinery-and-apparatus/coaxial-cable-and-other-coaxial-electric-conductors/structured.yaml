      applies_to: "actual cable construction"
      rule: "Represent every material that remains in the cable and every manufacturing waste or direct emission as an atomic exchange. Add a separate row when the actual construction uses another conductor, dielectric, foil backing, braid, jacket, additive, or processing aid; do not relabel a representative row as a material family."
