validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "The output shall equal 1 m of conforming Cable and shall declare every required construction, performance, mass-per-length, geography, technology, period, and boundary qualifier."
    source_ids:
      - iec-61196-1-2005
      - iec-tr-62839-1-2025
  - rule_id: validate_inventory_normalization
    applies_to: "all inventory rows"
    rule: "Every exchange shall be atomic, use the declared property and unit, link to a collection protocol when collected or calculated, and be normalized to the same conforming cable length."
    source_ids: []
  - rule_id: validate_material_balance
    applies_to: "integrated manufacture"
    rule: "Input material mass shall reconcile with conforming cable mass, separately reported external wastes, internal returns, and inventory change; disclose and investigate any residual."
    source_ids: []
  - rule_id: validate_energy_boundary
    applies_to: "electricity and fuel"
    rule: "Electricity shall state the metering or allocation basis and grid geography; natural gas and direct fossil CO2 shall either both be included with reference conditions and calculation evidence or both be demonstrably not applicable."
    source_ids: []
  - rule_id: validate_waste_and_allocation
    applies_to: "manufacturing wastes"
    rule: "Copper scrap, aluminium scrap, mixed polymer scrap, and off-spec cable shall be separately reported when generated, with destination and internal-return status; no recycling credit may be netted into foreground amounts."
    source_ids:
      - iec-tr-62839-1-2025
  - rule_id: validate_external_comparability
    applies_to: "use of this dataset"
    rule: "A comparison or aggregation shall not combine this pre-dispatch-packaging factory-gate dataset with a dataset having a different product construction, reference unit, packaging treatment, life-cycle boundary, or allocation method without documented adjustment."
    source_ids:
      - siemens-iwlan-rcoax-epd-2024
published_dataset_profile:
  dataset_role: "Foreground product-system dataset for one declared coaxial cable construction at the manufacturing gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction-specific product footprinting, supply-chain modelling, cable-system studies, and downstream process or lifecyclemodel construction when the reference unit, construction, geography, technology, time, boundary, and allocation are compatible"
  excluded_use: "Generic comparison of coaxial cable designs without functional and construction equivalence; use as an installed cable system; use for non-coaxial wire; unadjusted combination with datasets that include dispatch packaging, distribution, installation, use, or end-of-life"
  required_metadata: "PCR id and version; product and construction identifier; complete layer materials and masses; cable mass per metre; impedance; attenuation and frequency; shielding declaration; rated voltage and remote-power function when applicable; radiating status when applicable; manufacturing geography and technology; reporting period; upstream dataset choices; allocation; dispatch-packaging exclusion; waste destinations; cut-offs; unresolved identities"
  required_quality_disclosure: "Temporal and site coverage; sample and meter coverage; calibration; missing-data treatment; material-balance residual; allocation rationale; supplier and upstream proxy quality; recycled-content basis; construction representativeness; direct-emission calculation method; unresolved UUID and range-evidence needs"
  update_trigger: "Change in conductor, dielectric, shield, jacket, additive, mass per metre, electrical performance class, manufacturing site, production technology, electricity or fuel supply, waste destination, allocation method, boundary, or data period that materially changes inventory results"
