    - id: calc_material_balance
      applies_to: "integrated manufacture"
      rule: "Material-balance discrepancy = total constituent-material input mass - conforming cable mass - external manufacturing-waste mass - documented inventory change; investigate rather than forcing the balance to zero."
      inputs:
