allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multiple products or constructions"
    rule: "Subdivide line, batch, construction, and reporting-period records before allocating shared burdens whenever separate metering or production records exist."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "unavoidable shared electricity and utilities"
    rule: "If subdivision is not possible, allocate shared operational burdens using a causal parameter such as machine time or measured energy demand; use cable length or mass only when causality is demonstrated and disclose the sensitivity."
    source_ids: []
  - rule_id: allocation_scrap_outputs
    applies_to: "copper, aluminium, polymer, and composite cable scraps"
    rule: "Report gross scrap quantities and destinations. Do not subtract recycling revenue, recycled-material credit, or avoided primary production from foreground inputs or wastes; apply any downstream recycling method outside this inventory and disclose it."
    source_ids:
      - iec-tr-62839-1-2025
  - rule_id: allocation_mass_balance
    applies_to: "internal recycling and rework"
    rule: "Internal scrap returned to the same process is not an output crossing the boundary; reconcile it in the material balance. Reworked cable that later passes acceptance is counted once in conforming output, while unrecovered loss remains a waste."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_input_mass
      process_id: "integrated_coaxial_cable_manufacture"
      flow_role: "constituent material input"
      record_type: "scale, goods-receipt, batch, and bill-of-material records"
      raw_fields: "material identity; supplier; grade; lot; gross and tare mass; returned material; product construction; line; timestamp"
      collection_method: "Reconcile calibrated scale or goods-receipt mass to material issue and return records by construction"
      unit: "kg"
      frequency: "Each receipt and production issue; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or the full campaign for campaign production"
      site_scope: "All foreground lines and sites in the dataset"
      aggregation_rule: "Sum net material crossing the boundary by construction and divide by conforming output length; retain rejects in the denominator reconciliation, not the reference output"
      quality_evidence: "Scale calibration; supplier certificate; lot traceability; inventory reconciliation; bill-of-material revision"
    - protocol_id: cp_electricity_records
      process_id: "integrated_coaxial_cable_manufacture"
      flow_role: "purchased electricity"
      record_type: "interval meter and production-line records"
      raw_fields: "meter id; start and end readings; interval energy; line state; product construction; conforming length; rejected length; downtime; allocation driver"
      collection_method: "Prefer line submetering; otherwise reconcile facility electricity and documented causal allocation to production"
      unit: "kWh and MJ"
      frequency: "Interval or shift; aggregate monthly"
      temporal_coverage: "Same period as material and output records"
      site_scope: "All included production and directly supporting equipment"
      aggregation_rule: "Subtract documented out-of-boundary loads, allocate only unavoidable shared loads, convert kWh to MJ, and divide by conforming length"
      quality_evidence: "Meter calibration; utility invoices; allocation worksheet; completeness reconciliation"
    - protocol_id: cp_finished_cable_output
      process_id: "integrated_coaxial_cable_manufacture"
      flow_role: "conforming reference product"
      record_type: "length counter, test, mass, and release records"
      raw_fields: "construction id; reel or batch id; length; sample mass and length; acceptance result; impedance; attenuation and frequency; shield test result; timestamp"
      collection_method: "Use calibrated line counter and final-release record; determine mass per metre from representative conditioned samples"
      unit: "m and kg/m"
      frequency: "Each reel or production batch"
      temporal_coverage: "Same period as all inputs and wastes"
      site_scope: "Every included line and construction"
      aggregation_rule: "Sum only accepted released length; separately sum rejected and test-cut length; calculate weighted mass per metre by construction"
      quality_evidence: "Counter calibration; test certificates; release record; sample scale calibration"
    - protocol_id: cp_manufacturing_waste_mass
      process_id: "integrated_coaxial_cable_manufacture"
      flow_role: "segregated and composite manufacturing wastes"
      record_type: "waste-container scale, transfer, and destination records"
      raw_fields: "waste identity; segregation state; gross and tare mass; construction; line; date; destination; internal return; external transfer"
      collection_method: "Weigh each container or verified transfer and reconcile against material inputs and product mass"
      unit: "kg"
      frequency: "Each container or transfer; aggregate monthly"
      temporal_coverage: "Same period as material and output records"
      site_scope: "All included foreground lines and waste storage points"
      aggregation_rule: "Exclude documented internal return from boundary output; sum each atomic external waste stream and divide by conforming cable length"
      quality_evidence: "Scale calibration; transfer note; recycler receipt; material-balance reconciliation"
    - protocol_id: cp_onsite_natural_gas
      process_id: "onsite_fuel_combustion"
      flow_role: "natural gas and direct fossil carbon dioxide"
      record_type: "meter, invoice, composition, and stack records"
      raw_fields: "gas volume; reference temperature and pressure; composition or carbon content; heating-value convention; oxidation evidence; equipment; operating period; allocation driver"
      collection_method: "Read dedicated meter where available; otherwise reconcile invoice volume and allocate with documented operating records; calculate direct fossil CO2 from collected carbon evidence"
      unit: "m3 and kg CO2"
      frequency: "Meter interval or invoice period; aggregate monthly"
      temporal_coverage: "Same period as cable production"
      site_scope: "All combustion equipment included in the foreground boundary"
      aggregation_rule: "Normalize assigned gas and calculated or measured fossil CO2 to conforming cable length; do not mix upstream supply emissions into the direct-emission row"
