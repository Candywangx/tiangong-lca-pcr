measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and all mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use measured net finished-product mass. Normalize foreground quantities to 1 kg net apparatus and report transport packaging separately."
  - id: item_to_mass
    applies_to: "Item-based production, sales, test, and maintenance records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item records using measured net mass by model or declared configuration. Retain item count, configuration, measured mass, and conversion calculation."
  - id: medium_mass_balance
    applies_to: "Fillable insulating or interruption media"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each gas or liquid by chemical identity or mixture and reconcile opening inventory, acquisitions, returns, product charge, off-site recycling/destruction, closing inventory, and measured transfers. Unreconciled loss is a direct release, not a zero flow."
  - id: performance_units
    applies_to: "Nameplate and test performance"
    required_property_ref:
      name: "Declared engineering property"
      uuid: ""
    required_unit: "Original test or nameplate unit"
    rule: "Preserve the units and test basis used for rated voltage, current, breaking/making duty, short-time and peak withstand, leakage, endurance, and service life. Do not convert a missing rating into zero."
  - id: service_profile_conversion
    applies_to: "Downstream item- or service-life comparison"
    required_property_ref:
      name: "Mass and declared service descriptors"
      uuid: ""
    required_unit: "kg per item or declared service"
    rule: "Convert the 1 kg production result only with measured model mass and a disclosed service-life, endurance, loading, maintenance, replacement, and leakage scenario. Mass-only results shall not be presented as performance-equivalent comparisons."
