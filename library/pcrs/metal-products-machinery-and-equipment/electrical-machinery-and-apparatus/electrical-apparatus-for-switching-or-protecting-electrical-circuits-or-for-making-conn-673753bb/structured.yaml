    - "rated voltage and AC/DC system"
    - "rated frequency for AC apparatus"
    - "rated continuous current where applicable"
    - "rated short-circuit breaking and making duty where applicable"
    - "rated short-time and peak withstand current where applicable"
    - "insulation and interruption medium with chemical identity or technology"
