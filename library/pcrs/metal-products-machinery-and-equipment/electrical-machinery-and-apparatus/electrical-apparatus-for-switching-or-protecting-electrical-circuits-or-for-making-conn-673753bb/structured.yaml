allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Multi-product production lines"
    rule: "First avoid allocation by subdividing metered processes and tracing model-, line-, batch-, test-cell-, and medium-handling records."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_physical_then_other
    applies_to: "Unavoidable shared utilities and operations"
    rule: "When subdivision is not possible, use a documented causal physical driver such as machine time, test duration, processed mass, number of operations, or measured medium throughput. Use another relationship only when a physical relationship is not defensible, and disclose the rationale and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_recycling
    applies_to: "Scrap, recovered medium, returned parts, and recycling credits"
    rule: "Keep gross input, internal return, external recovery, treatment transfer, and any substitution credit separate. State the selected recycling or end-of-life method and do not credit the same recovered material or medium twice."
    source_ids:
      - iso-14044-2006
      - iec-62271-4-2022
  - rule_id: allocation_medium_losses
    applies_to: "Insulating or interruption medium balance"
    rule: "Attribute measured and residual medium releases to the operation and reporting period in which they occur. Do not allocate an unexplained mass-balance residual away from the foreground system or to the delivered product."
    source_ids:
      - us-epa-40-cfr-98-subpart-ss
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "assembly_sealing"
      flow_role: "BOM materials, contacts, conductors, insulation, mechanisms, electronics, terminals, fasteners, and auxiliaries"
      record_type: "BOM, routing, issue/return ledger, supplier specification, measured component mass"
      raw_fields: "model/configuration; part id; material or substance; supplier flow; quantity per item; measured unit mass; issued mass; returned mass; stock change; recycled content claim"
      collection_method: "Reconcile engineering BOM with measured masses and production issue/return records; keep contact and conductor materials separate"
      unit: "kg and item"
      frequency: "Each model/configuration and reporting period"
      temporal_coverage: "Complete declared production period"
      site_scope: "All sites contributing included parts and assembly"
      aggregation_rule: "Sum net input by material/part and divide by accepted net product mass"
      quality_evidence: "Approved BOM revision, calibrated scale records, supplier specification, and ledger reconciliation"
    - protocol_id: cp_product_output_mass
      process_id: "packing_dispatch"
      flow_role: "Test-ready, conforming, and finished apparatus mass"
      record_type: "Production, serial/batch, weighbridge or calibrated scale record"
      raw_fields: "model/configuration; serial or batch; gross mass; tare; packaging mass; net product mass; accepted quantity; date"
      collection_method: "Measure net product mass by model/configuration and reconcile transfers, rejects, stock, and plant-gate release"
      unit: "kg and item"
      frequency: "Each batch or statistically justified model sample with production-period reconciliation"
      temporal_coverage: "Complete declared production period"
      site_scope: "All production and dispatch sites in scope"
      aggregation_rule: "Sum accepted net mass; retain model mass for item-to-mass conversion; normalize to 1 kg"
      quality_evidence: "Calibration certificate, sampling plan where used, production release, and reconciliation"
    - protocol_id: cp_energy_utilities
      process_id: "assembly_sealing"
      flow_role: "Electricity, fuels, compressed air, vacuum, heat, and other utilities"
      record_type: "Meter, invoice, equipment log, and allocation-driver record"
      raw_fields: "carrier; meter id; opening/closing reading; consumption; unit; process/line; operating time; accepted output; allocation driver"
      collection_method: "Use dedicated meters where available; otherwise allocate a measured total with a causal physical driver"
      unit: "Original meter unit and converted energy unit"
      frequency: "Meter interval and reporting-period reconciliation"
      temporal_coverage: "Complete declared production period or representative campaign with dates"
      site_scope: "All included foreground operations and sites"
      aggregation_rule: "Subtract documented non-production use, allocate by declared driver, and normalize to accepted output"
      quality_evidence: "Meter calibration, invoices, completeness reconciliation, and allocation calculation"
    - protocol_id: cp_medium_mass_balance
      process_id: "assembly_sealing"
      flow_role: "Insulating and interruption medium acquisition, charge, recovery, transfer, stock, and release"
      record_type: "Cylinder/container weighing, certified flow meter, inventory, charging, recovery, test, shipment, recycling, and destruction records"
      raw_fields: "substance/mixture; composition; container id; opening stock; acquisitions; returns; recovered amount; charge to product; delivered-in-product amount; supplier return; recycling/destruction transfer; closing stock; measured release; process attribution"
      collection_method: "Maintain a substance-specific mass balance; measure container transfer by certified meter or before/after mass; calculate and investigate residual loss"
      unit: "kg by substance or mixture"
      frequency: "Each transfer plus reporting-period balance"
      temporal_coverage: "Complete declared production period"
      site_scope: "All included storage, charging, testing, recovery, and off-site manufacturer activities before customer transfer"
      aggregation_rule: "Opening stock + acquisitions + returns - delivered in product - supplier/recycling/destruction transfers - closing stock = release plus documented adjustment"
      quality_evidence: "Calibrated meter/scale, container log, product charge certificate, shipment/recovery receipt, and signed reconciliation"
    - protocol_id: cp_waste_outputs
      process_id: "assembly_sealing"
      flow_role: "Scrap, rejects, spent auxiliaries, treatment outputs, and repair returns"
      record_type: "Waste shipment, container weighing, production reject, repair, recycling, and stock records"
      raw_fields: "composition; source process; gross/tare/net mass; destination; treatment; returned-to-process mass; stock change; hazardous classification"
      collection_method: "Weigh by segregated composition and reconcile waste, repair returns, internal recycling, and stock"
      unit: "kg"
      frequency: "Each shipment or container and reporting-period reconciliation"
      temporal_coverage: "Complete declared production period"
      site_scope: "All included foreground operations and sites"
      aggregation_rule: "Sum net external output by composition and destination; exclude documented internal returns from external waste"
      quality_evidence: "Scale calibration, transfer note, treatment receipt, repair disposition, and mass reconciliation"
    - protocol_id: cp_factory_tests
      process_id: "factory_testing"
      flow_role: "Rated values, test sequence, pass/fail, test energy, medium release, and leakage performance"
      record_type: "Nameplate, design certificate, routine test report, test-cell meter, leak/pressure record, nonconformance and repair record"
      raw_fields: "apparatus type; applicable standard; rated voltage/current/frequency; breaking/making and withstand ratings; test id; test basis; result; energy; medium transfer/release; leak result; failed/repaired disposition"
      collection_method: "Extract approved design and routine-test records; meter the test cell or physically allocate measured facility energy"
      unit: "Original engineering units, kWh or MJ, kg medium, kg product"
      frequency: "Each tested unit or production batch as required by the applicable product standard"
      temporal_coverage: "Complete declared production period"
      site_scope: "Every test facility releasing in-scope product"
      aggregation_rule: "Aggregate energy and releases over conforming output; retain failures and repairs separately"
      quality_evidence: "Approved test procedure, calibrated instruments, signed test report, nonconformance closure, and release authorization"
    - protocol_id: cp_packaging
      process_id: "packing_dispatch"
      flow_role: "Transport packaging by material and dispatch configuration"
      record_type: "Packaging BOM, scale record, purchasing/issue ledger, and dispatch record"
      raw_fields: "model/configuration; packaging material; item quantity; measured unit mass; reusable status; return rate where evidenced; packed units"
      collection_method: "Measure packaging by material for each dispatch configuration and reconcile with issue and dispatch records"
      unit: "kg and item"
      frequency: "Each configuration and reporting period"
      temporal_coverage: "Complete declared production period"
      site_scope: "All dispatch sites in scope"
      aggregation_rule: "Sum packaging mass by material and divide by net dispatched product mass"
      quality_evidence: "Approved packaging specification, calibrated scale, issue ledger, and dispatch reconciliation"
    - protocol_id: cp_life_maintenance_profile
      process_id: "factory_testing"
      flow_role: "Downstream service-life, endurance, maintenance, replacement, leakage, and recovery descriptors"
      record_type: "Approved product specification, type-test evidence, maintenance manual, warranty/service plan, and jurisdiction-specific label or compliance record"
      raw_fields: "designed service life; mechanical/electrical endurance; operation count basis; load profile; maintenance interval; replaceable parts and masses; medium top-up; declared/tested leakage performance; recovery instruction; applicable geography and regulation"
      collection_method: "Extract only product-specific approved values; record not_applicable with reason where a descriptor does not apply"
      unit: "Original engineering unit, years, operations, kg/item, and percent/time where declared"
      frequency: "Each model/configuration revision"
      temporal_coverage: "Current approved design and service documentation"
      site_scope: "Product configurations represented by the production dataset"
      aggregation_rule: "Preserve configuration-specific values; do not average incompatible ratings or technologies"
      quality_evidence: "Approved specification, type/routine test evidence, maintenance instruction, label, and design-change control"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "All foreground inventory rows"
      rule: "normalized amount = reporting-period amount / accepted net finished-apparatus mass; the reference output is exactly 1 kg"
      inputs:
        - "reporting-period flow amount"
        - "accepted net product mass"
      output: "amount per 1 kg net finished apparatus"
      source_ids:
        - iso-14044-2006
    - id: calc_item_to_mass
      applies_to: "Item-based BOM, production, reject, test, and packaging records"
      rule: "mass = item count × measured unit mass for the same model/configuration; propagate sampling uncertainty when unit mass is sampled"
      inputs:
        - "item count"
        - "measured unit mass"
        - "model/configuration"
      output: "kg by flow and model/configuration"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "BOM, prepared parts, assembly, product, waste, and stock"
      rule: "reconcile gross input = contained product mass + external outputs + documented internal returns + stock change + investigated residual; report scope and residual"
      inputs:
        - "BOM/issue mass"
        - "product mass"
        - wastes
        - returns
        - "stock changes"
      output: "reconciled material-family balance and residual"
      source_ids:
        - iso-14044-2006
    - id: calc_medium_release
      applies_to: "Each insulating or interruption medium"
      rule: "release = opening stock + acquisitions + returned/recovered receipts - delivered-in-product - supplier/recycling/destruction transfers - closing stock, adjusted only for documented measurement corrections; report measured and residual components separately"
      inputs:
        - "substance-specific stock"
        - acquisition
        - charge
        - shipment
        - recovery
        - transfer
        - "and measurement records"
      output: "kg released by substance and process attribution"
      source_ids:
        - us-epa-40-cfr-98-subpart-ss
    - id: calc_service_conversion
      applies_to: "Optional downstream item or service-life result"
      rule: "production result per item = result per kg × measured net item mass; any service-life result additionally applies the disclosed life, endurance, operating, loss, maintenance, replacement, leakage, and recovery scenario without changing the cradle-to-gate reference result"
      inputs:
        - "mass-normalized result"
        - "item mass"
        - "service and maintenance profile"
      output: "separately labelled item or service-life scenario result"
      source_ids:
        - iec-ts-62271-320-2025
  data_quality_requirements:
    - id: dq_identity_performance
      applies_to: "Product identity and reference flow"
      requirement: "Provide the full required qualifier set and demonstrate that rated voltage exceeds 1 000 V. Use the apparatus-specific standard and mark genuinely inapplicable ratings with reasons."
      evidence: "Approved nameplate/specification, classification record, design certificate, and test report"
    - id: dq_bom_completeness
      applies_to: "Materials and components"
      requirement: "Reconcile BOM, supplier inputs, internal preparation, finished mass, wastes, returns, and stock. Separately report contact and conductor materials, insulation/interruption medium, structural materials, and electronics/mechanisms."
      evidence: "BOM revision, supplier specifications, mass records, and reconciliation"
    - id: dq_medium_traceability
      applies_to: "Fillable media and direct releases"
      requirement: "Preserve substance or mixture identity and composition, product charge, measured transfers, contained amount, recovery/destruction destinations, and residual calculation. Do not use leakage-test performance as a substitute for actual manufacturing-period mass balance."
      evidence: "Container and meter records, charge certificate, leak test, recovery/destruction receipt, and mass balance"
    - id: dq_temporal_geographic
      applies_to: "Foreground activity"
      requirement: "State reporting-period dates, sites, production geography, represented technologies and configurations, production volume, and any campaign extrapolation."
      evidence: "Production, meter, purchasing, and dispatch records"
    - id: dq_service_maintenance
      applies_to: "Downstream-use descriptors"
      requirement: "Provide designed service life, endurance or operating-cycle basis, maintenance interval/scope, replaceable parts, medium top-up and leakage basis, and end-of-life recovery instruction by model/configuration."
      evidence: "Approved product specification, test evidence, maintenance manual, and service plan"
    - id: dq_proxy_disclosure
      applies_to: "Upstream and downstream modelling"
      requirement: "Identify every proxy, aggregation, omitted process, and jurisdiction-specific assumption. Do not use a switchgear assembly or a low-voltage apparatus dataset as the product reference."
      evidence: "Dataset mapping log and documented reviewer decision"
validation_rules:
  - rule_id: validate_category_boundary
    applies_to: "Product identity"
    rule: "Confirm that the product is individual switching/protection/connection apparatus rated above 1 000 V. Reject complete equipped switchgear/controlgear assemblies, cabinets, low-voltage apparatus, empty housings, conductors/cables, transformers, and installation services."
    source_ids:
      - iec-62271-1-2017-amd1-2021
      - iec-62271-200-2021-amd1-2024
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require product flow UUID cf33015b-81bb-4bdf-8080-72e23c262f73, Mass property UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1 kg normalized net product output."
    source_ids: []
  - rule_id: validate_rated_characteristics
    applies_to: "Required qualifiers"
    rule: "Require rated voltage above 1 000 V and the apparatus-applicable current, making/breaking, short-circuit withstand, insulation, frequency, and endurance declarations. A missing applicable rating is an error; an inapplicable field requires a reason."
    source_ids:
      - iec-62271-1-2017-amd1-2021
      - iec-62271-100-2021-amd1-2024
      - iec-62271-102-2018-amd1-2022
  - rule_id: validate_material_disclosure
    applies_to: "BOM and mass balance"
    rule: "Require separate contact and conductor material identities and masses, insulation/interruption medium, structural material families, electronics/mechanisms, net product mass, wastes, returns, and stock changes. Reject an unspecified single total as complete BOM evidence."
    source_ids:
      - iec-ts-62271-320-2025
  - rule_id: validate_medium_and_leakage
    applies_to: "Gas- or liquid-filled technology"
    rule: "Require medium identity/composition, opening and closing stock, acquisitions, charge, contained delivered mass, transfers to supplier/recycling/destruction, measured releases, residual calculation, seal design, and leak-test or monitoring basis. For non-fillable technology require an explicit not_applicable reason."
    source_ids:
      - iec-62271-4-2022
      - us-epa-40-cfr-98-subpart-ss
  - rule_id: validate_life_and_maintenance
    applies_to: "Downstream scenario readiness"
    rule: "Require designed service life, mechanical/electrical endurance or operating-cycle basis, maintenance schedule and scope, replaceable parts, medium top-up and leakage basis where applicable, and recovery/disassembly instruction. Reject performance comparisons that use mass alone while these descriptors differ or are missing."
    source_ids:
      - iec-ts-62271-320-2025
      - iec-62271-4-2022
  - rule_id: validate_process_completeness
    applies_to: "Foreground inventory"
    rule: "Require assembly/sealing, factory testing, packing/dispatch, any controlled parts preparation, all measured utilities, rejects/wastes, direct releases, and linked upstream datasets. Reconcile product, BOM, waste, medium, and stock records for the declared period."
    source_ids:
      - iso-14044-2006
      - us-epa-40-cfr-98-subpart-ss
  - rule_id: validate_allocation
    applies_to: "Shared processes and recycling"
    rule: "Require subdivision or a documented causal allocation driver, separately reported recycling/recovery transfers, and no double credit. Report any non-physical allocation and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_market_rules
    applies_to: "Jurisdiction-specific use"
    rule: "When the dataset claims EU market applicability, validate current Regulation (EU) 2024/573 medium identity/GWP, charge, leakage label or monitoring, commissioning class/date, and derogation documentation. Otherwise label the check skipped rather than applying EU rules globally."
    source_ids:
      - eu-regulation-2024-573
  - rule_id: validate_source_traceability
    applies_to: "Evidence and data quality"
    rule: "Require source ids for external method rules and retain calibration, BOM, test, medium-balance, maintenance, allocation, proxy, and dataset-version evidence sufficient for independent reproduction."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after review and publication"
  downstream_use: "Production of a technology-, model-, geography-, and reporting-period-specific foreground package for individual >1 000 V switching/protection/connection apparatus; projection to process or lifecyclemodel records; optional installation, use, maintenance, and end-of-life scenarios kept separate from the cradle-to-gate reference result."
  allowed_use: "Cradle-to-gate inventory of a declared apparatus configuration; aggregation across compatible configurations with disclosed weighting; downstream item or service-life conversion when mass, ratings, technology, life, endurance, maintenance, leakage, replacement, and recovery assumptions are all declared."
  excluded_use: "Complete switchgear cabinet or substation modelling without added assembly-level data; low-voltage apparatus; mass-only performance comparison across unlike duties or lives; silent substitution of gas-insulated for air, vacuum, liquid, or solid technology; jurisdictional compliance claims without current evidence."
  required_metadata: "Canonical PCR id; CPC reference; product flow UUID; apparatus type/function; applicable standard; rated voltage, AC/DC and frequency; rated current and applicable making/breaking and withstand duties; insulation/interruption medium and seal design; contact/conductor and other BOM masses; net item mass; factory tests; production route/site/period/volume; packaging; designed service life and endurance; maintenance, replacement, medium top-up, leakage and recovery profile; allocation and proxy choices."
  required_quality_disclosure: "Primary-versus-secondary data share; BOM/mass and medium-balance residuals; meter/calibration status; configuration coverage; sampling and aggregation; temporal/geographic/technology representativeness; data gaps; proxies; inapplicable fields with reasons; allocation sensitivity; packaging scope; jurisdiction-specific checks performed or skipped."
  update_trigger: "Change in apparatus function or rating class, insulation/interruption medium or composition, sealing/leakage design, contact/conductor or major BOM, production route/site, applicable standard or regulation, test regime, designed life/endurance, maintenance/replacement profile, or evidence that materially changes the inventory."
