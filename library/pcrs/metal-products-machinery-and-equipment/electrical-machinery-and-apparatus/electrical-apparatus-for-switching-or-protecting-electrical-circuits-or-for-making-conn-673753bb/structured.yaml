    - "other material-family masses"
    - "designed service life"
    - "mechanical/electrical endurance or operating-cycle basis"
    - "maintenance schedule"
    - "replaceable parts and medium top-up"
    - "factory medium charge and test-release records where applicable"
    - "applicable product standard"
    - "production geography and technology"
    - "packaging scope"
