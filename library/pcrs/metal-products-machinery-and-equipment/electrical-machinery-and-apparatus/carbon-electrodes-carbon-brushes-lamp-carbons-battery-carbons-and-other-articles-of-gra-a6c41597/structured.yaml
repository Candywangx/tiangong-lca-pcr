system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default study is cradle-to-factory-gate. Foreground collection begins when purchased carbonaceous feedstocks, binders, metals, water, and energy cross the manufacturing-site boundary and ends when the declared finished article is quality released. Upstream production and transport of every purchased input are represented by compatible upstream datasets. Foreground includes blending, forming, required thermal consolidation, conditional impregnation/rebaking, conditional graphitization, machining, attachment assembly, internal recycling, direct emissions, and wastes. Packaging, distribution, use, installation, and end-of-life are excluded unless explicitly added outside this reference flow."
      source_ids: []
    - rule_id: boundary_cradle_to_gate
      applies_to: "Product system and purchased inputs"
      rule: "Include upstream production and inbound transport for each purchased feedstock, binder, metal, water, fuel, and electricity flow; include all foreground manufacturing stages through quality release of the unpackaged product."
      source_ids:
        - eu-2021-environmental-footprint-method
        - usitc-small-diameter-graphite-electrodes-2009
    - rule_id: boundary_route_declaration
      applies_to: "Product-family and technology variants"
      rule: "Declare the actual product family, formulation, thermal route, impregnation count, graphitization technology, machining, and attachments. Include conditional stages only when performed; never average absent stages as zero without declaring route applicability."
      source_ids:
        - mersen-carbon-brush-technical-guide
        - resonac-graphite-electrode-process
    - rule_id: boundary_direct_emissions
      applies_to: "Foreground combustion and carbonization"
      rule: "Record direct site emissions and wastes at their physical boundary. The fossil-carbon-dioxide rows cover only direct foreground emissions; upstream power- and fuel-supply emissions remain in their upstream datasets and shall not be duplicated."
      source_ids:
        - eu-2021-environmental-footprint-method
    - rule_id: boundary_packaging_exclusion
      applies_to: "Reference product and downstream additions"
      rule: "Exclude removable sale and transport packaging from the 1 kg reference product. If packaging is required by the study goal, add each packaging component as a separate atomic flow outside this PCR reference product and disclose the extension."
      source_ids:
        - usitc-small-diameter-graphite-electrodes-2009
boundary_abstraction:
  declared_starting_condition: "Purchased carbonaceous feedstocks, binders, metallic additions or attachments, process water, and delivered energy at the manufacturing-site gate; supplier product state and upstream coverage declared"
  starting_condition_role: "Foreground manufacturing input boundary for the finished electrical-carbon article"
  product_classification_scope: "Finished electrical-purpose graphite or other carbon articles within the semantic boundary represented by CPC 3.0 code 46950"
  recursive_input_rule: "A purchased article already within this finished-product category is recorded as a distinct input only when it physically enters the foreground product; do not recurse into this PCR. Link a compatible upstream dataset and disclose the purchased article, mass, grade, and supplier gate. Site-internal green, heat-treated, rebaked, and graphitized articles are internal transfer rows and receive no upstream burden."
  upstream_dataset_requirement: "Use geography-, technology-, product-state-, and reference-year-compatible upstream datasets for every purchased input. Preserve supplier-specific data where available and reject a dataset whose flow property or unit group cannot be reconciled without a documented conversion."
  disclosure: "Declare product family, grade, formulation, metal content, recycled content, all included and absent conditional stages, furnace and graphitization technology, energy supply, site geography, data period, allocation, internal recycling, direct-emission method, wastewater treatment state, attachment scope, and packaging exclusion."
