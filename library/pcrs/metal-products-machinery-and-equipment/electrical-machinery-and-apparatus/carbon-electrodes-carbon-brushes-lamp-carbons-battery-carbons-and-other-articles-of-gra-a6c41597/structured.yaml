allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared equipment, furnaces, pollution controls, and multi-product lines"
    rule: "First obtain product- and stage-specific records or subdivide by meter, batch, equipment time, or another causal operating record. System expansion may be used only when the additional function and substituted system are demonstrated and disclosed."
    source_ids:
      - eu-2021-environmental-footprint-method
  - rule_id: allocation_physical_relationship
    applies_to: "Unavoidable shared burdens"
    rule: "If subdivision or system expansion is not feasible, use a measured physical relationship causally connected to the shared burden, such as furnace occupancy-time-energy, processed mass, or machine time. Document the numerator, denominator, co-products, and allocation period."
    source_ids:
      - eu-2021-environmental-footprint-method
  - rule_id: allocation_other_relationship
    applies_to: "Burdens without a defensible physical relationship"
    rule: "Economic or another relationship is permitted only after documenting why subdivision, system expansion, and physical allocation are infeasible. Report the prices, reference period, currency basis, allocation shares, and sensitivity to the next plausible method."
    source_ids:
      - eu-2021-environmental-footprint-method
  - rule_id: allocation_internal_recycling
    applies_to: "Carbon dust, offcuts, pitch, and internal intermediates returned within the site"
    rule: "Treat same-site return as an internal transfer: subtract it from external waste and new purchased input only through a transparent mass balance. Do not award an avoided-production credit or count the same returned mass as both waste and input."
    source_ids:
      - eu-2021-environmental-footprint-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_purchased_material_mass
      process_id: "material_preparation_and_forming"
      flow_role: "Purchased needle coke, natural graphite, artificial graphite, carbon black, coal-tar-pitch binder, phenolic resin, and copper powder"
      record_type: "Scale tickets, batch recipes, inventory issues, supplier certificates"
      raw_fields: "material identity; supplier; lot; gross mass; tare; net mass; moisture or solids; returned mass; accepted output lot"
      collection_method: "Reconcile calibrated scales and recipe issues to accepted production lots"
      unit: "kg"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the complete campaign for campaign products"
      site_scope: "All production lines and shifts making the declared product"
      aggregation_rule: "Sum net charged mass less documented same-process return; divide by net accepted reference-product mass"
      quality_evidence: "Scale calibration; signed batch record; supplier certificate; inventory reconciliation; mass-balance variance"
    - protocol_id: cp_stage_electricity
      process_id: "all_foreground_manufacturing_processes"
      flow_role: "Purchased electricity by process stage"
      record_type: "Utility meter and stage submeter records; furnace or equipment runtime where allocation is necessary"
      raw_fields: "meter id; start/end readings; unit; process stage; batch; runtime; allocation driver; on-site generation; exported energy"
      collection_method: "Prefer stage submeters; otherwise allocate site electricity using auditable causal equipment or furnace records"
      unit: "kWh and MJ"
      frequency: "Continuous or each batch, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the complete campaign"
      site_scope: "All included lines, utilities, and directly attributable controls"
      aggregation_rule: "Subtract exported and unrelated electricity; convert kWh to MJ by 3.6; allocate and divide by net accepted reference-product mass"
      quality_evidence: "Meter calibration; utility invoices; submeter coverage map; allocation reconciliation"
    - protocol_id: cp_process_water
      process_id: "material_preparation_and_forming_machining_and_assembly"
      flow_role: "Process-water input and net closed-loop make-up"
      record_type: "Calibrated water meters, tank records, or supplier invoices"
      raw_fields: "meter id; volume or mass; temperature; density if converted; purpose; process; recirculation; blowdown; batch"
      collection_method: "Meter net water crossing the process boundary and reconcile recirculation"
      unit: "kg"
      frequency: "Continuous or daily, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the complete campaign"
      site_scope: "All included wet forming, cooling, washing, machining, and dust-control operations"
      aggregation_rule: "Convert only with documented density; exclude recirculated volume; divide net make-up by net accepted reference-product mass"
      quality_evidence: "Meter calibration; water balance; density record; invoice reconciliation"
    - protocol_id: cp_internal_intermediate_mass
      process_id: "all_foreground_manufacturing_processes"
      flow_role: "Green, heat-treated, rebaked, and graphitized internal article transfers"
      record_type: "Batch traveller, calibrated scale, production execution record"
      raw_fields: "product family; lot; stage; gross mass; tare; accepted mass; reject mass; destination; cycle count"
      collection_method: "Weigh accepted internal transfers at each declared stage"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Complete production campaign or representative 12-month period"
      site_scope: "Every included process stage"
      aggregation_rule: "Sum accepted transfer mass by route and reconcile stage inputs, outputs, rejects, and work in progress"
      quality_evidence: "Scale calibration; batch genealogy; route reconciliation; signed release record"
    - protocol_id: cp_carbon_waste_mass
      process_id: "material_preparation_and_forming_machining_and_assembly"
      flow_role: "Carbon/graphite dust and offcuts leaving the site"
      record_type: "Waste container scale ticket, manifest, internal return record"
      raw_fields: "waste identity; composition; source stage; gross/tare/net mass; destination; treatment; internal return"
      collection_method: "Weigh each external waste movement and reconcile same-site return separately"
      unit: "kg"
      frequency: "Each shipment, aggregated monthly"
      temporal_coverage: "Same period as production data"
      site_scope: "All included dust collectors, screening rejects, offcuts, and machining rejects"
      aggregation_rule: "Sum external net waste; exclude documented internal return; divide by net accepted reference-product mass"
      quality_evidence: "Scale ticket; waste manifest; composition evidence; internal return ledger; mass balance"
    - protocol_id: cp_stage_natural_gas
      process_id: "thermal_consolidation_pitch_impregnation_and_rebaking"
      flow_role: "Gaseous natural gas combusted by included furnaces"
      record_type: "Stage gas meters, supplier invoices, furnace batch logs"
      raw_fields: "meter id; volume; temperature; pressure; heating value; composition; furnace; batch; start/end readings"
      collection_method: "Prefer stage metering and reconcile to supplier totals"
      unit: "m3"
      frequency: "Each batch or continuous, aggregated monthly"
      temporal_coverage: "At least 12 representative consecutive months or the complete campaign"
      site_scope: "All included thermal and rebaking furnaces"
      aggregation_rule: "Sum volume at one declared reference condition; allocate by causal furnace record; divide by net accepted reference-product mass"
      quality_evidence: "Meter calibration; supplier statement; reference-condition conversion; invoice reconciliation"
    - protocol_id: cp_impregnation_material_mass
      process_id: "pitch_impregnation_and_rebaking"
      flow_role: "Coal-tar-pitch impregnant"
      record_type: "Tank receipts, issue records, batch logs, recovery records"
      raw_fields: "pitch grade; lot; gross input; recovered return; disposal; impregnation cycle; treated article mass"
      collection_method: "Reconcile pitch tank and batch records for all cycles"
      unit: "kg"
      frequency: "Each impregnation batch"
      temporal_coverage: "Complete included impregnation campaign"
      site_scope: "All impregnation and pitch-recovery systems serving the declared product"
      aggregation_rule: "Sum purchased mass consumed net of documented same-process return; divide by net accepted reference-product mass"
      quality_evidence: "Tank calibration; supplier certificate; cycle log; pitch balance"
    - protocol_id: cp_direct_fossil_co2
      process_id: "thermal_consolidation_pitch_impregnation_and_rebaking"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Validated stack measurement or fuel and process-carbon balance"
      raw_fields: "stack flow and concentration or fuel volume; fuel carbon content; oxidation factor; pitch/resin carbon input; retained carbon; measured carbonaceous waste; period"
      collection_method: "Use validated direct measurement where representative; otherwise apply the documented site carbon-balance calculation"
      unit: "kg"
      frequency: "Each test and monthly calculation"
      temporal_coverage: "Same representative production period as activity data"
      site_scope: "All included stacks and fugitive capture points; exclude upstream supply emissions"
      aggregation_rule: "Apply calc_direct_fossil_co2, allocate only by documented causal records, and divide by net accepted reference-product mass"
      quality_evidence: "Test report; instrument calibration; fuel certificate; carbon balance; independent reconciliation"
    - protocol_id: cp_finishing_material_mass
      process_id: "machining_and_assembly"
      flow_role: "Copper wire incorporated into finished articles"
      record_type: "Bill of materials, issue records, finished-part weights"
      raw_fields: "wire grade; alloy; insulation; gross issue; return; scrap; accepted articles; attachment method"
      collection_method: "Reconcile bill of materials and net issues to accepted finished lots"
      unit: "kg"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "Complete campaign or representative 12-month period"
      site_scope: "All assembly lines for the declared product"
      aggregation_rule: "Sum incorporated mass net of return and scrap; divide by net accepted reference-product mass"
      quality_evidence: "Supplier certificate; scale calibration; bill-of-material revision; issue-return reconciliation"
    - protocol_id: cp_reference_product_mass
      process_id: "machining_and_assembly"
      flow_role: "Quality-released finished product"
      record_type: "Calibrated final scale and quality-release records"
      raw_fields: "lot; product family; grade; gross mass; tare; net mass; rejects; packaging mass; release status"
      collection_method: "Weigh unpackaged accepted product and reconcile rejects and packaging separately"
      unit: "kg"
      frequency: "Each released lot"
      temporal_coverage: "Complete campaign or representative 12-month period"
      site_scope: "All included finishing and release lines"
      aggregation_rule: "Sum net quality-released mass excluding removable packaging; set normalized output to exactly 1 kg"
      quality_evidence: "Scale calibration; quality certificate; packaging tare; batch reconciliation"
    - protocol_id: cp_wastewater_volume
      process_id: "machining_and_assembly"
      flow_role: "Wastewater from wet machining, washing, or wet dust control"
      record_type: "Calibrated effluent meter, tank transfer, treatment record"
      raw_fields: "volume; temperature; process origin; suspended carbon; treatment state; destination; sampling result"
      collection_method: "Meter at transfer to treatment or discharge and sample according to the site control plan"
      unit: "m3"
      frequency: "Continuous or each transfer, aggregated monthly"
      temporal_coverage: "Same period as production data"
      site_scope: "All included wet-finishing discharge points"
      aggregation_rule: "Sum process-attributable wastewater volume and divide by net accepted reference-product mass"
      quality_evidence: "Meter calibration; water balance; transfer record; analytical report; treatment receipt"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "Every inventory row"
      rule: "Normalized amount = period quantity attributable to the declared product divided by net kg of quality-released unpackaged reference product in the same period"
      inputs:
        - "Attributable flow quantity"
        - "net accepted reference-product mass"
      output: "Flow amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity rows"
      rule: "MJ = metered kWh × 3.6; do not apply a heating-value factor to electricity"
      inputs:
        - "Metered kWh"
      output: "Purchased electricity in MJ"
      source_ids: []
    - id: calc_internal_mass_balance
      applies_to: "Internal intermediates and carbon waste"
      rule: "Purchased carbonaceous and metallic input mass = finished product + externally transferred waste + direct measured mass releases + closing work in progress − opening work in progress − documented internally returned mass adjustment; investigate rather than force-close material gaps"
      inputs:
        - "Purchased materials"
        - "internal transfers"
        - product
        - waste
        - "direct mass releases"
        - "work in progress"
        - "internal return"
      output: "Disclosed mass-balance variance by route and period"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "fossil_co2_thermal; fossil_co2_rebaking"
      rule: "Prefer representative direct measurement. If calculated, sum fossil carbon oxidized from metered fuels and process carbon, multiply carbon mass by 44/12, subtract only carbon demonstrably retained in product, recovered internally, or transferred in measured wastes, and retain every site-specific factor and uncertainty."
      inputs:
        - "Fuel amount and fossil carbon content"
        - "pitch/resin fossil carbon"
        - "oxidation evidence"
        - "retained product carbon"
        - "measured carbonaceous wastes"
      output: "kg direct fossil CO2 per 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Product family, grade, specification, dimensions, apparent density, electrical property and test method, metal content, graphitization state, impregnation count, attachment state, and packaging exclusion shall be traceable to each represented lot."
      evidence: "Product specification; certificate of analysis or conformity; batch genealogy; test report"
    - id: dq_temporal_coverage
      applies_to: "Foreground activity data"
      requirement: "Use at least 12 representative consecutive months unless production is campaign-based; for a campaign, include the complete campaign and disclose why it represents the reference year."
      evidence: "Dated meter extracts; batch register; production calendar; representativeness note"
    - id: dq_route_completeness
      applies_to: "Process map and conditional rows"
      requirement: "Every actually performed stage and formulation input shall be included; every omitted conditional stage or row shall have an explicit not-applicable statement in the produced dataset, not a silent zero."
      evidence: "Route sheet; process-flow diagram; recipe; equipment list; inclusion checklist"
    - id: dq_mass_energy_reconciliation
      applies_to: "Material, waste, fuel, water, and electricity records"
      requirement: "Reconcile stage records to site totals and investigate unexplained gaps. Do not force a balance by adding an unspecified material, utility, waste, or emission flow."
      evidence: "Reconciliation workbook; signed variance review; calibration and invoice records"
    - id: dq_upstream_compatibility
      applies_to: "Purchased-input datasets"
      requirement: "Upstream datasets shall match flow identity, product state, property, unit group, geography, technology, and reference year or document the limitation and conversion."
      evidence: "Dataset metadata; supplier data; conversion record; limitation statement"
    - id: dq_uuid_status
      applies_to: "UUID-bearing and unresolved flows"
      requirement: "Use only audited state-100 UUIDs shown in this PCR. Preserve all unresolved rows as explicit concrete flows until an exact public identity is audited; do not substitute a proxy."
      evidence: "UUID audit receipt; unresolved-flow register; review decision"
    - id: dq_range_status
      applies_to: "Important flows"
      requirement: "Foreground records remain mandatory. No external empirical ranges are asserted by this version; retain the unresolved range-evidence needs until at least two independent, original-text-verified, boundary-compatible sources support synthesis."
      evidence: "Manifest unresolved range-evidence register; source-review record"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "Product identity and reference flow"
    rule: "Reject a package that lacks any required qualifier, includes removable packaging in the 1 kg reference mass, uses a non-mass reference property, or claims category-wide service equivalence without a performance- and lifetime-equivalent functional unit."
    source_ids:
      - un-cpc-3-0-2025
      - eu-2021-environmental-footprint-method
  - rule_id: validate_route_and_atomic_inventory
    applies_to: "Process map and inventory"
    rule: "Confirm one actual product route; match every included detailed process to the process map; require each exchange to be one atomic physical, chemical, waste, or energy flow; reject umbrella flows and silent zeros for conditional stages."
    source_ids:
      - mersen-carbon-brush-technical-guide
      - resonac-graphite-electrode-process
  - rule_id: validate_units_and_uuid
    applies_to: "Flow identity and measurement"
    rule: "Confirm every UUID, flow type, property, unit group, and Chinese display name against the audited identity. Reject proxy UUIDs, unrecorded density conversions, mixed gas reference conditions, or electricity not normalized in MJ."
    source_ids: []
  - rule_id: validate_no_double_counting
    applies_to: "Upstream and foreground emissions, internal recycling, and allocations"
    rule: "Reject double counting of upstream electricity or fuel-supply emissions as direct site emissions, counting the same internal return as both waste and input, or allocating shared burdens without the required hierarchy and disclosure."
    source_ids:
      - eu-2021-environmental-footprint-method
  - rule_id: validate_completeness_and_quality
    applies_to: "Foreground period and reconciliation"
    rule: "Confirm temporal coverage, production denominator, meter and scale calibration, route completeness, mass and energy reconciliation, waste destinations, wastewater state, and direct-emission method. Report unresolved UUIDs and range-evidence needs as limitations."
    source_ids:
      - eu-2021-environmental-footprint-method
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package for one declared finished electrical-carbon product and route"
  downstream_use: "May be published after review as a secondary_dataset and used as a background_dataset only for studies whose product family, grade, route, geography, technology, reference year, and factory-gate boundary are compatible"
  allowed_use: "Cradle-to-factory-gate modelling of the declared product; supplier comparisons after methodological and performance equivalence is established; downstream product-system modelling with transparent upstream links"
  excluded_use: "Direct comparison across carbon electrodes, brushes, lamp carbons, or battery carbons without equivalent electrical performance and lifetime; modelling graphite powder active material, complete batteries, non-electrical carbon articles, use-stage consumption, packaging, distribution, or end-of-life without an explicit boundary extension"
  required_metadata: "PCR id and version; product family and grade; product specification; dimensions; apparent density; electrical property and test method; formulation classes; metal content; graphitization and impregnation route; furnace technology; attachments; recycled content; site and geography; reference year and period; upstream datasets; allocation; internal recycling; direct-emission method; wastewater treatment; packaging exclusion; unresolved UUID and range limitations"
  required_quality_disclosure: "Primary-data share; temporal, geographical, and technological representativeness; meter and scale coverage; allocation shares and sensitivity; mass and energy reconciliation; data gaps; proxy prohibition; unresolved UUIDs; absence of external empirical ranges; upstream dataset limitations"
  update_trigger: "New exact public UUID for the reference product or unresolved flow; two-source range synthesis; material change in formulation, product family, furnace or graphitization technology, energy supply, site geography, allocation, direct-emission control, wastewater treatment, or product specification; revised classification or governing method"
