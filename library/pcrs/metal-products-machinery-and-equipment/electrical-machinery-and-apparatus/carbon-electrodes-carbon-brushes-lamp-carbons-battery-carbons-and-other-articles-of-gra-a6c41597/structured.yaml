measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and all carbonaceous material transfers"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use dry or as-received mass consistently. Declare moisture and volatile-matter basis when either affects the recipe or mass balance. Exclude removable packaging, pallets, and transport fixtures from the 1 kg reference product."
  - id: electricity_energy
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity by stage where submetering exists. Convert kWh to MJ using exactly 3.6 MJ per kWh and disclose grid geography, voltage, losses, and whether on-site generation is separately modelled."
  - id: gas_volume_conditions
    applies_to: "Gaseous natural gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report metered volume at the declared temperature and pressure, and retain supplier composition or heating-value records. Do not substitute a generic energy carrier or silently mix reference conditions."
  - id: water_mass_conversion
    applies_to: "Process water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "If water is metered by volume, convert using a measured or documented density for the metering conditions and retain the volume, density, temperature, and conversion record."
  - id: wastewater_volume
    applies_to: "Wastewater"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report volume at the discharge or treatment-transfer point and disclose composition, suspended carbon, treatment state, and destination. Do not equate wastewater volume with process-water input without a measured balance."
