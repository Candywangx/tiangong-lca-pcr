      site_scope: "all onsite component lines in scope"
      aggregation_rule: "sum net issue by material and product variant, then normalize to conforming output"
      quality_evidence: "supplier specification; material certificate; scale calibration; ERP reconciliation"
    - protocol_id: cp_component_energy
