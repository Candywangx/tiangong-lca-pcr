allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared processes and co-production"
    rule: "First avoid allocation through process subdivision, separate metering, or product-specific production records wherever technically feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_variant_mix
    applies_to: "multiple connector or adaptor variants"
    rule: "Build a production-weighted mix from measured conforming output mass and variant-specific bills of materials, routes, test coverage, yields, and packaging; do not use simple unit counts when product masses or routes differ materially."
    source_ids:
      - iso-14044-2006
      - iso-ts-14048-2002
  - rule_id: allocation_shared_resources
    applies_to: "shared energy, water, consumables and waste"
    rule: "When separate measurement is not feasible, use a documented physical driver causally related to consumption, such as machine time, batch time, metered sub-area use, or processed mass, and retain a sensitivity check for material shared burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "rework loops"
    rule: "Assign all additional material, energy, cleaning, polishing, assembly and retesting burdens to the conforming output of the represented production; count reworked units once in conforming output and disclose the rework rate."
    source_ids:
      - iso-14044-2006
      - iso-ts-14048-2002
  - rule_id: allocation_scrap
    applies_to: "internal recycling and exported scrap"
    rule: "Subtract only documented material returned unchanged to the same foreground process from gross issue; report exported scrap and its treatment as an output without an avoided-production credit unless the study applies and discloses a reviewed substitution or system-expansion method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_economic_fallback
    applies_to: "inseparable co-products"
    rule: "Use economic allocation only when subdivision and a causal physical relationship are not feasible; document prices, period, geography, allocation shares, and sensitivity and do not treat ordinary connector rejects as co-products."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_fabrication"
      flow_role: "raw materials for in-house connector components"
      record_type: "material issue and return record"
      raw_fields: "product id; component function; material grade; supplied state; lot; gross issue; return; unit; date"
      collection_method: "ERP issue and return records reconciled to calibrated weighing"
      unit: "kg"
      frequency: "per lot or batch"
