      raw_fields: "product form; interface; fibre type; end-face; wavelength; launch condition; method; instrument; calibration; insertion loss or attenuation; return loss; acceptance criterion; tested count; passed count; output mass"
      collection_method: "IEC-aligned or declared equivalent test procedure using calibrated equipment, linked to product and batch"
