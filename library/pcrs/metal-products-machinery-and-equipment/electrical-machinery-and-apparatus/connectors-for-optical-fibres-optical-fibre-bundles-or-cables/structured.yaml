      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground inventory to 1 kg of conforming connector hardware after final inspection and before adding external packaging."
  - id: net_product_mass
    applies_to: "finished connector or adaptor output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Exclude external packaging, attached optical cable beyond a declared termination stub, and any active transceiver or module from the reference-product mass."
  - id: count_to_mass
    applies_to: "records available only as pieces, trays, reels, or packs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert count-based records using a measured, product-specific average mass and retained sample size, scale calibration, product identifier, and sampling period; do not apply one connector mass to another form."
  - id: energy_conversion
