  classification_refs: "CPC 3.0: 46215 — Connectors for optical fibres, optical fibre bundles or cables"
  covered_products: "Standalone passive optical-fibre connector plugs; adaptors or couplers; receptacles; connector sets; single-fibre and multi-fibre forms whose primary function is demountable optical coupling"
  excluded_products: "Optical fibres, fibre bundles, and optical fibre cables; patch cords and pigtails as cable products; active transceivers or optical modules; splices and passive optical devices that are not connector hardware; electrical connectors"
  representative_product: "A declared production mix of conforming finished optical-fibre connectors and adaptors at the manufacturing plant gate, net of external packaging mass"
  production_route: "Purchased or in-house precision components; incoming inspection and kitting; conditional fibre termination and end-face preparation; connector or adaptor assembly; cleaning, inspection and optical testing; packaging"
  market_state: "Finished, conforming standalone connector hardware at plant gate; product form, interface family, fibre compatibility, performance specification, geography, and production period declared"
functional_unit:
  what: "Finished, conforming standalone connectors, connector plugs, adaptors or couplers, receptacles, or connector sets for optical fibres, bundles, or cables at the manufacturing plant gate"
  how_much: "1 kg net finished product, excluding external packaging"
  how_well: "Meets the declared connector-interface, fibre-compatibility, end-face, cleanliness, insertion-loss or attenuation, return-loss, and applicable performance acceptance criteria"
  how_long_or_cycle: "The declared manufacturing reporting period or complete production campaign represented by the foreground records"
  reference_flow_link: "The net conforming output mass is linked to the Tiangong product flow and Mass reference property below"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary follows the actual plant route from received materials and components through conforming product and packaging. Purchased ferrules, alignment sleeves, housings, shells, springs, boots, caps, fibre stubs, adhesives, cleaning agents, polishing media, and packaging require upstream datasets that match their material and supplied state. In-house component fabrication is not replaced by a purchased-component proxy when it occurs at the reporting site."
      source_ids: []
    - rule_id: boundary_start_end
      applies_to: "foreground manufacturing system"
      rule: "Begin at receipt of raw materials, purchased components and packaging and end with conforming packaged connector hardware at the plant gate; include all onsite operations required to produce the declared reference product."
      source_ids:
        - iso-14044-2006
        - iso-ts-14048-2002
    - rule_id: boundary_variant_specificity
      applies_to: "product and route representativeness"
      rule: "Model one declared connector or adaptor form or a production-weighted mix with documented shares; do not generalize one interface, fibre type, material system, finish, or performance grade to CPC 46215 as a whole."
      source_ids:
        - unsd-cpc-3-0-structure
        - iec-61754-1-2013
        - iec-61753-1-2018
    - rule_id: boundary_upstream_components
      applies_to: "purchased materials and components"
      rule: "Keep purchased components explicit by material and supplied state and link them to suitable upstream datasets; include in-house component fabrication when performed onsite."
      source_ids:
        - iec-61755-3-1-2024
        - iso-ts-14048-2002
    - rule_id: boundary_excluded_products
      applies_to: "category exclusions"
      rule: "Exclude optical fibres and cables as products, cable assemblies as traded products, active optical modules and transceivers, and unrelated connector categories; route mixed or inseparable products to a more suitable PCR or manual review."
      source_ids:
        - unsd-cpc-3-0-structure
    - rule_id: boundary_testing
      applies_to: "cleaning, inspection and optical qualification"
      rule: "Include cleaning, end-face inspection, attenuation or insertion-loss testing, and return-loss testing actually performed for the declared product; retain test coverage and rejects even when tests do not create a separate physical flow."
      source_ids:
        - iec-61300-3-4-2023
        - iec-61300-3-6-2008
        - iec-61300-3-35-2022
        - iec-tr-62627-01-2023
    - rule_id: boundary_packaging
      applies_to: "external packaging"
      rule: "Include primary, secondary and tertiary packaging placed on the product at the plant gate and keep packaging mass outside the net reference-product mass."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "Received raw materials and purchased connector, adaptor, termination, testing-consumable, and packaging components at the reporting-site gate"
  starting_condition_role: "Disclosed foreground inputs whose supplier, material, supplied state, and upstream dataset are identified"
  product_classification_scope: "Standalone passive optical coupling connector hardware within CPC 3.0 46215; optical cable and active-module products remain outside the category"
  recursive_input_rule: "A purchased input already classified as connector hardware is recorded once as an explicit upstream connector-component or semi-finished connector input and is not recursively decomposed by this PCR inside the same foreground package"
  upstream_dataset_requirement: "Use material- and state-matched upstream datasets for every purchased component, raw material, energy carrier, water supply, consumable, and waste-treatment service; disclose proxies and missing supplier data"
  disclosure: "Declare product form, fibre compatibility, complete material breakdown, termination route, process inclusion, testing basis, yield and rework, packaging, geography, reporting period, and all exclusions or allocation decisions"
