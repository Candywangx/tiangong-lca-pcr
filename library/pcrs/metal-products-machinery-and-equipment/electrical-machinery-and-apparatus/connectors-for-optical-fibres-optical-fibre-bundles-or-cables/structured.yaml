    - protocol_id: cp_product_output_mass
      process_id: "packaging"
      flow_role: "net conforming reference-product mass"
      record_type: "final production and shipment record"
      raw_fields: "product id; conforming count; net unit mass; net product mass; packaging mass; lot; shipment date"
      collection_method: "calibrated scale or validated product-specific count-to-mass conversion, reconciled to shipments"
      unit: "kg"
      frequency: "per production or shipment lot"
      temporal_coverage: "declared reporting period"
      site_scope: "all represented products leaving the plant gate"
      aggregation_rule: "sum net product mass excluding packaging and normalize inventory to 1 kg"
      quality_evidence: "scale calibration; product mass study; shipment reconciliation"
  calculation_rules:
    - id: normalize_reference_flow
      applies_to: "every foreground inventory row"
      rule: "normalized amount = reporting-period amount attributable to represented production / net conforming output kg"
      inputs:
        - "all collection protocols"
        - cp_product_output_mass
      output: "amount per 1 kg net conforming connector hardware"
      source_ids:
        - iso-14044-2006
        - iso-ts-14048-2002
    - id: calculate_product_mix
      applies_to: "mixed-product dataset"
      rule: "variant share = conforming net mass of variant / total conforming net mass; apply variant-specific BOM, route, yield, test and packaging records before aggregation"
      inputs:
        - cp_purchased_parts_bom
        - cp_conforming_output_and_tests
        - cp_product_output_mass
      output: "mass-weighted represented product mix"
      source_ids:
        - iso-14044-2006
        - iso-ts-14048-2002
    - id: calculate_count_to_mass
      applies_to: "count-based component or product record"
      rule: "mass = item count × measured product-specific average net mass; retain sample size, variability and calibration evidence"
      inputs:
        - "applicable count record"
        - "measured mass study"
      output: "kg by component or product variant"
      source_ids:
        - iso-ts-14048-2002
    - id: calculate_yield
      applies_to: "component, termination, assembly and final-test stages"
      rule: "yield = accepted output on a declared count or mass basis / started input on the same basis; report first-pass and final yield separately where rework occurs"
      inputs:
        - "yield and disposition protocols"
      output: "stage yield and rework rate"
      source_ids:
        - iso-ts-14048-2002
    - id: calculate_scrap_rate
      applies_to: "manufacturing scrap and rejects"
      rule: "scrap rate = unrecovered scrap or reject mass / started material or submitted product mass on a consistent basis; report internal returns separately"
      inputs:
        - "waste and yield protocols"
      output: "material-specific scrap or reject rate"
      source_ids:
        - iso-ts-14048-2002
    - id: allocate_shared_energy
      applies_to: "shared meters and equipment"
      rule: "allocated energy = metered shared energy × documented causal driver share; disclose driver and reconcile shares to the meter total"
      inputs:
        - "energy protocols"
        - machine-time
        - batch-time
        - "sub-area or processed-mass driver"
      output: "carrier-specific energy assigned to represented production"
      source_ids:
        - iso-14044-2006
        - iso-ts-14048-2002
    - id: calculate_test_coverage
      applies_to: "end-face inspection, attenuation or insertion-loss, and return-loss tests"
      rule: "coverage = tested units / produced units for the same product and period; retain measured result distributions, failures, retests and acceptance criteria rather than only averages"
      inputs:
        - cp_conforming_output_and_tests
        - cp_final_yield_rework_and_rejects
      output: "test coverage, pass rate and linked dB result distribution"
      source_ids:
        - iec-61300-3-4-2023
        - iec-61300-3-6-2008
        - iec-61300-3-35-2022
    - id: reconcile_mass_balance
      applies_to: "each material-bearing process and total foreground system"
      rule: "compare material input with accepted output, internal transfer, returned material, waste, direct mass emissions and inventory change on consistent moisture and measurement bases; quantify and explain every residual"
      inputs:
        - material
        - output
        - waste
        - "emission and stock-change records"
      output: "documented process and foreground mass-balance reconciliation"
      source_ids:
        - iso-14044-2006
        - iso-ts-14048-2002
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and represented mix"
      requirement: "Every record shall identify product form, interface family, fibre compatibility, ferrule or alignment design, housing material system, end-face design, termination route, and applicable performance or environment grade; not-applicable fields shall be explicit."
      evidence: "controlled product master; drawing revision; product specification; production-mix calculation"
    - id: dq_material_completeness
      applies_to: "component and packaging bills of materials"
      requirement: "Material composition and mass shall cover ferrule or lens, alignment element, housing or shell, sleeve, spring, boot, cap, adhesive or splice parts, and packaging as applicable; proprietary composition gaps and supplier proxies shall be disclosed."
      evidence: "approved BOM; supplier declaration; sample weighing; gap register"
    - id: dq_temporal_geographic
      applies_to: "all foreground records"
      requirement: "Records shall cover the declared representative period or complete campaign and the actual production geography; substitutions from another period, plant, or supplier require justification."
      evidence: "record coverage report; facility list; production reconciliation"
    - id: dq_measurement_traceability
      applies_to: "mass, energy, water, emissions and waste"
      requirement: "Retain instrument identity, calibration status, unit, reading interval, allocation driver, data owner, and reconciliation to source records."
      evidence: "calibration certificates; meter extracts; scale logs; utility and waste invoices"
    - id: dq_optical_tests
      applies_to: "end-face, attenuation or insertion-loss, and return-loss evidence"
      requirement: "Retain product and batch linkage, test method, wavelength, launch condition, reference interface, equipment and calibration, sampling plan, acceptance criterion, raw result, failure, cleaning, rework and retest history."
      evidence: "raw test files; images; calibration certificate; controlled test specification; quality disposition"
    - id: dq_yield_rework
      applies_to: "every manufacturing stage"
      requirement: "Use one declared count or mass basis per yield calculation; distinguish first-pass yield, rework, final yield and unrecovered rejects and prevent reworked product from being counted twice."
      evidence: "batch traveler; quality disposition; calculation worksheet; production reconciliation"
    - id: dq_mass_balance
      applies_to: "material-bearing processes"
      requirement: "Reconcile all material inputs to accepted output, internal transfers, returns, waste, direct mass emissions and inventory changes; quantify and explain residuals without silently adjusting measured records."
      evidence: "signed mass-balance worksheet; stock-change record; waste manifest; emission record"
    - id: dq_source_and_proxy
      applies_to: "upstream datasets and estimates"
      requirement: "Identify upstream dataset, geography, time, technology and supplied state for every material, energy carrier and treatment service; disclose proxy reason and expected direction of bias."
      evidence: "source register; supplier documentation; proxy assessment"
    - id: dq_reviewability
      applies_to: "complete foreground package"
      requirement: "Preserve raw records, calculation formulas, source ids, exclusions, allocation choices and reviewer-accessible audit links so another practitioner can reproduce every normalized amount."
      evidence: "evidence index; calculation workbook; versioned extraction; review record"
validation_rules:
  - rule_id: validate_category_scope
    applies_to: "product identity"
    rule: "Confirm that the reference product is standalone passive optical connector or adaptor hardware within CPC 46215 and not an optical cable, cable assembly as traded product, active transceiver or module, or unrelated connector."
    source_ids:
      - unsd-cpc-3-0-structure
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow 5f90c9f6-a484-428c-8846-89bece3a62ec, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1 kg net conforming output excluding packaging."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata and product description"
    rule: "Fail completeness when product form, interface, fibre type, ferrule or alignment material, housing material, end-face or optical-interface design, termination route, test basis, yield, packaging, environment grade, geography, period, or product-mix shares are missing or silently marked generic."
    source_ids:
      - iec-61754-1-2013
      - iec-61755-3-1-2024
      - iec-61753-1-2018
  - rule_id: validate_process_route
    applies_to: "process inventory"
    rule: "Require all required processes and every applicable conditional process; verify that purchased components are not used to hide onsite fabrication and that a bare adaptor is not assigned a fibre-termination route without evidence."
    source_ids:
      - foa-fiber-optic-termination
      - iso-ts-14048-2002
  - rule_id: validate_optical_testing
    applies_to: "final quality assurance"
    rule: "Require declared insertion-loss or attenuation and return-loss method, wavelength, launch and reference conditions, equipment calibration, acceptance criterion, test coverage, raw results, failures, cleaning, rework and retest records; end-face inspection alone is not optical-performance qualification."
    source_ids:
      - iec-61300-3-4-2023
      - iec-61300-3-6-2008
      - iec-61300-3-35-2022
      - iec-tr-62627-01-2023
  - rule_id: validate_yield_and_rework
    applies_to: "production normalization"
    rule: "Verify first-pass yield, final yield, rework loops and unrecovered rejects on consistent bases; all repeated process burdens shall be included and reworked conforming output shall be counted once."
    source_ids:
      - iso-14044-2006
      - iso-ts-14048-2002
  - rule_id: validate_material_balance
    applies_to: "materials and waste"
    rule: "Require material-specific reconciliation of inputs, accepted output, transfers, returns, waste, direct mass emissions and stock changes; unexplained residuals shall be reported as a finding, not forced to zero."
    source_ids:
      - iso-14044-2006
      - iso-ts-14048-2002
  - rule_id: validate_packaging
    applies_to: "plant-gate output"
    rule: "Require material-specific primary, secondary and tertiary packaging and packaging scrap; confirm packaging is inventoried but excluded from the 1 kg net reference-product mass."
    source_ids:
      - iso-14044-2006
      - iso-ts-14048-2002
  - rule_id: validate_no_leaf_extrapolation
    applies_to: "representativeness"
    rule: "Reject an unqualified claim that a single connector specification, material system, test grade, factory or product route represents the whole CPC 46215 leaf."
    source_ids:
      - unsd-cpc-3-0-structure
      - iec-61753-1-2018
  - rule_id: validate_sources_and_proxies
    applies_to: "evidence and upstream data"
    rule: "Require traceable foreground records and source ids for method constraints, disclose every upstream proxy and skipped check, and mark validation inconclusive when a required record or identity cannot be verified."
    source_ids:
      - iso-ts-14048-2002
published_dataset_profile:
  dataset_role: "unit_process or aggregated_process for connector-manufacturing foreground data; may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "LCA process and lifecyclemodel construction for data centres, communication networks, power-grid automation, industrial control and other applications using matching passive optical connector hardware"
  allowed_use: "Product-specific or disclosed production-mix studies whose connector form, interface, fibre type, materials, end-face design, termination route, performance grade, geography, period and system boundary match this dataset"
  excluded_use: "Optical fibre or cable production; connectorized cable assemblies as a whole; active optical modules or transceivers; another connector interface or material system without representativeness review; unqualified CPC-wide averages"
  required_metadata: "canonical PCR id; reference-flow UUID; product form; interface and channel count; fibre type; ferrule or alignment element and housing materials; end-face design; termination and assembly route; optical-test methods and coverage; yield, rework and rejects; packaging; geography; period; represented product-mix shares; upstream datasets; allocation and exclusions"
  required_quality_disclosure: "foreground-record coverage; BOM and packaging completeness; meter and scale calibration; count-to-mass sampling; mass balance; first-pass and final yield; test distributions and failures; proxy register; data-quality requirements and validation checks skipped"
  update_trigger: "Material change in connector form, interface, fibre compatibility, ferrule or alignment technology, housing material, end-face design, termination or assembly route, test method or acceptance criterion, product-mix shares, yield, packaging, supplier dataset, production geography, reporting period or allocation method"
