allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "all foreground processes"
    rule: "Prefer direct measurement, physical segregation and configuration-specific bills of material so that inputs, energy, waste and releases are assigned without allocation."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: causal_allocation
    applies_to: "shared equipment or batch operations"
    rule: "When direct separation is unavailable, use a documented causal driver such as machine time, test time, treatment area or metered energy that reflects resource use."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: mass_allocation_fallback
    applies_to: "shared production with no defensible causal driver"
    rule: "Allocate by net output mass only as a fallback, identify the affected flows and products, disclose the allocation share and test sensitivity when it may affect conclusions."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: recycling_separation
    applies_to: "scrap and end-of-life recovery"
    rule: "State the chosen recycling system boundary and allocation method; do not combine recycled-content benefits, scrap credits and end-of-life credits in a way that double counts the same recovery."
    source_ids:
      - pep-psr-0005-2023
