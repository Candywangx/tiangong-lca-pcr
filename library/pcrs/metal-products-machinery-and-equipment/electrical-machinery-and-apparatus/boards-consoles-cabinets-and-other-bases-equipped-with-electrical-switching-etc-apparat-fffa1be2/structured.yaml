  what: "Provision of a finished, factory-tested equipped switchgear or controlgear assembly for the declared electric control, switching, protection and distribution functions"
  how_much: "1 kg of net finished assembly mass at the plant gate"
  how_well: "The declared rated voltage is greater than 1,000 V, and rated current, current type and frequency, insulation level and medium, short-circuit withstand, switching or breaking capability, protection configuration and assembly type are specified"
