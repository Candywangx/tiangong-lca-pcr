    reference: "Regulation (EU) 2024/573 of the European Parliament and of the Council of 7 February 2024 on fluorinated greenhouse gases. https://eur-lex.europa.eu/eli/reg/2024/573/2024-02-20/eng (retrieved 2026-08-08)"
    used_for: "EU-specific containment, leak-check, monitoring, recovery, service and commissioning disclosures for fluorinated-gas switchgear"
