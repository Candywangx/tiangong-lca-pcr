      process_id: "enclosure_busbar_fabrication"
      flow_role: "material, energy, accepted part and waste records"
      record_type: "ERP issue, scale ticket, meter, stock and waste-transfer record"
      raw_fields: "material id and grade; quantity; unit; batch; product configuration; meter reading; scrap destination; opening and closing stock"
      collection_method: "reconcile production orders, meters, scale records and waste dispatches"
      unit: "kg, kWh, MJ"
      frequency: "each batch or monthly meter period"
      temporal_coverage: "representative continuous 12-month period or complete production campaign"
      site_scope: "each fabrication site"
      aggregation_rule: "configuration-specific direct records first; otherwise documented causal allocation"
      quality_evidence: "calibrated-meter evidence, production order, stock reconciliation and waste receipt"
    - protocol_id: cp_assembly_bom
      process_id: "final_assembly_testing_packaging"
      flow_role: "installed components and net product composition"
      record_type: "approved bill of materials, goods issue and as-built configuration"
      raw_fields: "component id; supplier; quantity; mass; material; rating; medium; serial or batch; accepted substitution"
      collection_method: "reconcile approved BOM, as-built record, purchase receipt and net weighing"
      unit: "kg and item"
      frequency: "each product configuration"
      temporal_coverage: "reference-year production"
      site_scope: "each assembly site"
      aggregation_rule: "retain each material and apparatus family before normalization"
      quality_evidence: "controlled BOM revision, supplier declaration and as-built sign-off"
    - protocol_id: cp_medium_integrity
      process_id: "final_assembly_testing_packaging"
      flow_role: "medium charge, recovery, release and sealed-boundary verification"
      record_type: "cylinder or vessel weighing, recovery log, leak test, pressure or density record, vacuum test"
      raw_fields: "substance; composition; supplied; charged; recovered; returned; stock change; measured release; test method; result; instrument id"
      collection_method: "close a substance mass balance for each batch and link integrity evidence to serial or configuration"
      unit: "kg and test result"
      frequency: "each filling or integrity-test event"
      temporal_coverage: "reference-year production"
      site_scope: "each handling and test location"
      aggregation_rule: "sum measured events by exact substance and configuration"
      quality_evidence: "calibrated scale, recovery log, leak or vacuum test report and operator sign-off"
    - protocol_id: cp_testing_packaging
      process_id: "final_assembly_testing_packaging"
      flow_role: "test energy, packaging, rejects and accepted reference product"
      record_type: "test report, meter, packaging issue, scale and reject record"
      raw_fields: "rating; test standard; result; energy; packaging material; packaging mass; net product mass; reject disposition"
      collection_method: "link factory acceptance, net weighing, energy and packaging records to configuration"
      unit: "kg and kWh"
      frequency: "each assembly or production batch"
      temporal_coverage: "reference-year production"
      site_scope: "each assembly and test site"
      aggregation_rule: "accepted output and attributable records divided by accepted net mass"
      quality_evidence: "factory-test report, calibrated scale, meter and packaging issue record"
    - protocol_id: cp_use_maintenance
      process_id: "use_maintenance"
      flow_role: "losses, auxiliary electricity, maintenance, replacements and medium events"
      record_type: "type-test or measurement report, loading profile, maintenance plan and service log"
      raw_fields: "operating mode; power; loading; hours; years; event; material; replacement; charge; recovered; released"
      collection_method: "combine measured or declared performance with the explicit use and service scenario"
      unit: "kWh, kg, item and year"
      frequency: "each operating mode and service event"
      temporal_coverage: "declared reference service life"
      site_scope: "declared use geography and installed population"
      aggregation_rule: "calculate each mode and event separately, then sum over life"
      quality_evidence: "applicable test report, manufacturer data, maintenance plan and service evidence"
    - protocol_id: cp_end_of_life
      process_id: "end_of_life"
      flow_role: "retired input, recovered outputs, residuals and releases"
      record_type: "dismantling study, facility record, recovery log and scenario source"
      raw_fields: "input mass; material fraction; recovered product; treatment route; medium recovered; medium released; geography"
      collection_method: "reconcile scenario or facility mass flows by material and exact substance"
      unit: "kg"
      frequency: "each scenario or facility campaign"
      temporal_coverage: "scenario reference year"
      site_scope: "declared treatment geography"
      aggregation_rule: "conserve mass by material family and disclose unclassified remainder"
      quality_evidence: "facility record, licensed-handler evidence, recovery certificate or documented scenario source"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "factory-gate flows"
      rule: "normalized amount = attributable production-period amount divided by accepted net reference-product mass"
      inputs:
        - "attributable amount"
        - "accepted net mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: reconcile_material_balance
      applies_to: "each material family"
      rule: "input + opening stock = product content + internally returned material + waste + closing stock; report unresolved imbalance and investigate rather than force closure"
      inputs:
        - "material issue"
        - "product content"
        - return
        - waste
        - stock
      output: "material-family balance and unresolved difference"
      source_ids:
        - pep-psr-0005-2023
    - id: calculate_medium_release
      applies_to: "gas or fluid handling"
      rule: "release = supplied + opening stock - installed charge - recovered return - transferred amount - closing stock, unless direct calibrated release measurement is more reliable"
      inputs:
        - "exact-substance mass records"
      output: "release by substance"
      source_ids:
        - iec-62271-1-2021
    - id: calculate_use_energy
      applies_to: "each use mode"
      rule: "lifetime energy = power in kW multiplied by annual operating hours multiplied by service years; sum modes and state load assumptions"
      inputs:
        - "measured or declared power"
        - "annual hours"
        - years
      output: "kWh per declared service life"
      source_ids:
        - pep-psr-0005-2023
    - id: calculate_replacements
      applies_to: "replacement apparatus and service materials"
      rule: "lifetime quantity = event quantity multiplied by declared event count; include replaced item treatment separately"
      inputs:
        - "event quantity"
        - count
        - treatment
      output: "lifetime input and waste quantities"
      source_ids:
        - pep-psr-0005-2023
    - id: reconcile_end_of_life
      applies_to: "end-of-life scenario"
      rule: "retired input mass = recovered product + residual treatment + exact-substance release + disclosed stock or unclassified remainder"
      inputs:
        - "dismantling and recovery records"
      output: "scenario mass balance"
      source_ids:
        - pep-psr-0005-2023
  data_quality_requirements:
    - id: dq_identity_ratings
      applies_to: "reference product"
      requirement: "Configuration and ratings shall demonstrate an equipped control or distribution assembly above 1,000 V and distinguish it from an empty enclosure or individual apparatus."
      evidence: "nameplate, approved drawing, single-line diagram, BOM and factory-test report"
    - id: dq_bom_completeness
      applies_to: "product composition"
      requirement: "Report busbar and enclosure materials plus installed apparatus, electronics, insulators, medium, batteries where present and primary packaging; explain omitted material families."
      evidence: "controlled as-built BOM, supplier declarations and net mass reconciliation"
    - id: dq_traceability
      applies_to: "primary data"
      requirement: "Every site-specific value shall link to a dated record, site, product configuration, unit, aggregation method and responsible data owner."
      evidence: "record index and audit trail"
    - id: dq_medium_boundary
      applies_to: "gas, fluid and vacuum technologies"
      requirement: "Gas or fluid records shall close the exact-substance balance and link leakage tests; vacuum equipment shall link purchased interrupter identity and vacuum-boundary verification."
      evidence: "charge and recovery logs, calibrated weighing, leak or vacuum test report"
    - id: dq_temporal_geographic
      applies_to: "all datasets"
      requirement: "State data period, production site, supplier geography, use geography and treatment geography and document proxy mismatches."
      evidence: "dataset metadata and source register"
    - id: dq_scenario_transparency
      applies_to: "lifecycle modules"
      requirement: "Disclose service life, loading, hours, grid, losses, auxiliary consumption, maintenance, replacements, medium loss, recovery and end-of-life assumptions."
      evidence: "scenario sheet, calculation workbook and supporting tests or service plan"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product identity"
    rule: "Confirm the product is an equipped electric-control or distribution assembly with rated voltage exceeding 1,000 V; reject low-voltage assemblies, empty cabinets, single apparatus and parts."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_reference
    applies_to: "reference flow"
    rule: "Confirm the selected product flow UUID, Mass property UUID, Units of mass UUID, 1 kg reference amount and net finished mass basis."
    source_ids: []
  - rule_id: validate_ratings
    applies_to: "required qualifiers"
    rule: "Require rated voltage, rated current, current type and frequency, insulation level, short-circuit withstand and duration, making or breaking capability where applicable, protection configuration and factory-test status."
    source_ids:
      - iec-62271-1-2021
      - iec-62271-200-2021
  - rule_id: validate_materials
    applies_to: "composition"
    rule: "Require busbar and enclosure material and coating, installed medium and charge, installed apparatus families, net mass and separately reported packaging and installation accessories."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: validate_medium
    applies_to: "gas, fluid or vacuum boundary"
    rule: "Require exact medium identity and charge plus charge-recovery-release balance and integrity-test method for gas or fluid equipment; require purchased-interrupter identity and vacuum-boundary test evidence for vacuum equipment."
    source_ids:
      - iec-62271-1-2021
      - iec-62271-200-2021
  - rule_id: validate_mass_balance
    applies_to: "foreground and end-of-life inventories"
    rule: "Reconcile material and exact-substance inputs, product, return, stock, waste, recovery and release; report every unresolved difference without inserting an assumed balancing flow."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: validate_processes
    applies_to: "process completeness"
    rule: "Include final assembly, applicable medium management, factory testing and packaging; include on-site fabrication and each lifecycle process when its inclusion condition is met."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: validate_use
    applies_to: "lifecycle modules"
    rule: "When use or maintenance is reported, require declared service life, operating modes, loading, hours, losses, auxiliary power, replacements, maintenance and medium-loss scenario; otherwise mark those modules excluded."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: validate_eu_fgas
    applies_to: "EU fluorinated-gas equipment"
    rule: "For an EU scenario containing regulated fluorinated gas, record the applicable containment, leak-check or monitoring basis, recovery and service restrictions, and commissioning prohibition or derogation status without treating the regulation as a universal product-performance threshold."
    source_ids:
      - eu-2024-573-fgas
  - rule_id: validate_allocation
    applies_to: "shared operations and recycling"
    rule: "Confirm allocation was avoided where possible, any causal driver or mass fallback is documented, and recycling benefits are not double counted."
    source_ids:
      - pep-psr-0005-2023
  - rule_id: validate_quality
    applies_to: "dataset release"
    rule: "Confirm source traceability, temporal and geographic representativeness, configuration-specific completeness and disclosure of every proxy, exclusion and scenario assumption."
    source_ids:
      - pep-psr-0005-2023
published_dataset_profile:
  dataset_role: "Configuration-specific foreground unit process for a finished equipped medium- or high-voltage switchgear or controlgear assembly"
  downstream_use: "Product carbon footprint, EPD, product comparison under equivalent technical function and scenario, process dataset, or lifecycle model"
  allowed_use: "Factory-gate or explicitly modular lifecycle studies whose product ratings, assembly technology, material composition, production geography, reference year and scenario match the declared dataset"
  excluded_use: "Low-voltage assemblies; empty enclosures; individual circuit-breakers or other single apparatus; unmatched voltage or insulation technology; undisclosed generic substitution; legal compliance claims based only on LCA results"
  required_metadata: "PCR id; CPC 3.0 code; reference flow UUID; all required qualifiers; process inclusions; site and year; data sources; allocation; exclusions; lifecycle scenario modules"
  required_quality_disclosure: "Primary-data coverage; BOM and mass-balance completeness; supplier and background proxies; energy measurement method; medium or vacuum-boundary evidence; uncertainty and scenario sensitivity"
  update_trigger: "Change in rated configuration, busbar or enclosure material, installed apparatus, insulation or interruption medium, manufacturing site or route, service-life or use scenario, regulation affecting the declared scenario, or material background-data revision"
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0 explanatory notes, class 462 and subclass 46214, 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (retrieved 2026-08-08)"
    used_for: "Exact category identity and separation from high-voltage single apparatus, low-voltage equipped assemblies and parts"
  - id: "iec-62271-1-2021"
    type: "standard"
    reference: "IEC 62271-1:2017+A1:2021, High-voltage switchgear and controlgear - Part 1: Common specifications for alternating current switchgear and controlgear. https://webstore.iec.ch/en/publication/71439 (retrieved 2026-08-08)"
    used_for: "Voltage scope, common ratings, service conditions, gas and vacuum technology declarations and integrity evidence"
  - id: "iec-62271-200-2021"
    type: "standard"
    reference: "IEC 62271-200:2021, High-voltage switchgear and controlgear - Part 200: AC metal-enclosed switchgear and controlgear for rated voltages above 1 kV and up to and including 52 kV. https://webstore.iec.ch/en/publication/63466 (retrieved 2026-08-08)"
    used_for: "Metal-enclosed assembly scope, compartments, interlocks, resistance, short-circuit and internal-arc testing context"
  - id: "pep-psr-0005-2023"
