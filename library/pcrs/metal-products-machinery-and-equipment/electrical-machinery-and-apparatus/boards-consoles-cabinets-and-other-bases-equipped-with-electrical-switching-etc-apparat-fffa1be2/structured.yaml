measurement_rules:
  - id: reference_mass
    applies_to: "finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use the net mass of the fully equipped, factory-tested assembly; exclude primary packaging and separately delivered installation accessories from the reference amount and report them separately."
  - id: assembly_scaling
    applies_to: "all factory-gate inventory"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg per kg reference product"
    rule: "Divide the production-period inventory attributable to the declared configuration by its net finished mass; retain the unscaled batch totals for audit."
  - id: material_mass_balance
    applies_to: "metals, polymers, ceramics, fluids and electronic assemblies"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile purchased input, product content, recovered return, scrap, waste and stock change by material family without assuming unmeasured scrap rates."
  - id: medium_mass_balance
    applies_to: "insulating or interruption gas and fluid"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record initial charge, recovered amount, returned amount, measured or calculated release and closing stock for the declared production period; a vacuum route records no gas charge but retains vacuum-boundary test evidence."
  - id: electricity_conversion
    applies_to: "electricity records"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh and MJ"
    rule: "Preserve metered kWh and use 1 kWh = 3.6 MJ when an energy conversion is required."
  - id: use_energy
    applies_to: "operational losses and auxiliaries in lifecycle studies"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh per declared service life"
    rule: "Calculate each operating mode from measured or declared power multiplied by annual hours and service years, including load-dependent losses and standby or control power separately."
  - id: service_life_scaling
    applies_to: "maintenance, replacement and end-of-life modules"
    required_property_ref:
      name: "Time"
      uuid: ""
    required_unit: "year"
    rule: "Use the manufacturer-declared reference service life and disclose every replacement count and timing; do not apply an undisclosed category-default lifetime."
