system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "factory-gate core"
      rule: "Include purchased materials and apparatus, inbound transport when included in the declared study, on-site fabrication, assembly, medium handling, factory testing, inspection, production waste treatment and primary packaging through finished product at plant gate."
      source_ids:
        - pep-psr-0005-2023
    - rule_id: boundary_equipped_assembly
      applies_to: "product identity"
      rule: "Model the delivered equipped assembly and its installed switching, protection, control, measurement and auxiliary apparatus; an empty cabinet or one individual apparatus is outside this PCR."
      source_ids:
        - unsd-cpc-3-2025
        - iec-62271-1-2021
        - iec-62271-200-2021
    - rule_id: boundary_conditional_lifecycle
      applies_to: "lifecycle extensions"
      rule: "Include installation, use, maintenance, replacement and end of life only as separately identified modules with declared geography, electricity, loading, operating hours, service life, recovery and treatment scenarios."
      source_ids:
        - pep-psr-0005-2023
        - epd-cpcr-switchgear-2024
    - rule_id: boundary_medium_integrity
      applies_to: "gas-, fluid- or vacuum-dependent equipment"
      rule: "Include filling, recovery, factory losses and integrity tests for gas or fluid systems; for vacuum interrupters include the installed component and boundary verification, while use-phase leakage or failure is scenario-dependent."
      source_ids:
        - iec-62271-1-2021
        - iec-62271-200-2021
    - rule_id: boundary_same_category
      applies_to: "recursive CPC 46214 input"
      rule: "Record a purchased equipped assembly of the same category as one upstream product input and do not unfold it inside the same foreground system unless the internal manufacture is measured and counted exactly once."
      source_ids: []
