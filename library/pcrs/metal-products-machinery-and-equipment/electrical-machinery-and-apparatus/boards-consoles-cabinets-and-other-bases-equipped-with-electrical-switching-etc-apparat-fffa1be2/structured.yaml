    reference: "PEP ecopassport, PSR-0005-ed3.1-EN-2023 08 12, Product Specific Rules for Electrical Switchgear and Controlgear Solutions. https://register.pep-ecopassport.org/documents/public/PSR-0005-EN (retrieved 2026-08-08)"
    used_for: "Product composition, reference product, boundary, primary-data traceability, allocation, operational energy, maintenance, replacement and end-of-life modelling"
  - id: "epd-cpcr-switchgear-2024"
    type: "official_guidance"
    reference: "International EPD System, 2024:06-c-PCR-001 Electrical switchgear and controlgear solutions, adoption of PSR-0005, valid through 2028-06-06. https://www.environdec.com/pcr-library/pcr_029113de-2d79-4a79-9ba1-08dd782e0347 (retrieved 2026-08-08)"
    used_for: "Independent PCR-library status and applicability of the switchgear product-specific rules"
  - id: "eu-2024-573-fgas"
