      name: "Active power or apparent power, as declared"
      uuid: ""
    required_unit: "W, kW, VA or kVA"
    rule: "State whether the rating is input, output, active, apparent, continuous, peak, or lamp power; do not convert among ratings without the declared power factor, duty and duration."
