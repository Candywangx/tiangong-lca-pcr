allocation_rules:
  - rule_id: alloc_avoid_by_subdivision
    applies_to: "separable products, lines and process steps"
    rule: "Prefer product-specific BOMs, meters, production orders and process subdivision so allocation is avoided."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: alloc_shared_resources
    applies_to: "shared utilities and line-level inputs"
    rule: "When subdivision is not possible, allocate by a measured causal driver such as machine time, test energy, material throughput or production time. Mass or item count may be used only when it best represents resource use; disclose the choice and test sensitivity for materially different power ranges or subtypes."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: alloc_rework_and_scrap
    applies_to: "rejects, rework and recovered material"
    rule: "Assign rework energy and material losses to the originating product/process. Credit internal reuse only through the measured quantity returned to the same system; keep sold scrap and treatment flows visible."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: alloc_exported_test_energy
    applies_to: "bidirectional or regenerative product testing"
    rule: "Keep gross test electricity input and separately metered export as distinct flows; do not offset input with nominal power, simulated export or unmetered recovery."
    source_ids: []
  - rule_id: alloc_recycling_separate
    applies_to: "recycling and recovery"
    rule: "Do not subtract potential end-of-life recycling benefits from factory-gate production; report any downstream benefit/load beyond the system boundary separately."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_materials
      process_id: "all_applicable_processes"
      flow_role: "materials, components, subassemblies and final-stage parts"
      record_type: "BOM, purchase/receiving and inventory records"
      raw_fields: "part id; material family; supplier; accepted quantity; unit mass; incorporated quantity; upstream dataset id; same-category subtype"
      collection_method: "reconcile released BOM with receiving and production issue/return records"
      unit: "kg"
      frequency: "each model revision and monthly reconciliation"
      temporal_coverage: "same reporting period as production output"
      site_scope: "every included manufacturing site and supplier route"
      aggregation_rule: "accepted input minus documented return, mapped to product/process and normalized by accepted output"
      quality_evidence: "approved BOM revision; calibrated scale record where weighed; supplier declaration; inventory reconciliation"
    - protocol_id: cp_process_energy
      process_id: "all_applicable_processes"
      flow_role: "electricity, fuel, heat and recovered test electricity"
      record_type: "submeters, equipment logs and invoices"
      raw_fields: "meter id; start/end reading; energy carrier; process; product family; operating time; exported energy meter"
      collection_method: "prefer dedicated meters; otherwise allocate a reconciled facility total by a causal driver"
      unit: "kWh or MJ"
      frequency: "continuous/monthly, and per test campaign where applicable"
      temporal_coverage: "at least 12 representative months or a justified complete production campaign"
      site_scope: "every included manufacturing site"
      aggregation_rule: "gross consumption and export remain separate; normalize after allocation"
      quality_evidence: "meter calibration; invoice reconciliation; downtime and shared-load log"
    - protocol_id: cp_waste_and_emissions
      process_id: "all_applicable_processes"
      flow_role: "waste and direct elementary emissions"
      record_type: "waste tickets, manifests, stack/fugitive measurements and permit calculations"
      raw_fields: "substance/material; mass; compartment; treatment destination; measurement method; process; date"
      collection_method: "weigh waste and use substance-specific monitored or approved calculation methods for direct releases"
      unit: "kg"
      frequency: "each shipment and required monitoring interval"
      temporal_coverage: "same reporting period as production output"
      site_scope: "every included manufacturing site"
      aggregation_rule: "sum by process, fraction/substance and destination; subtract only documented same-process reuse"
      quality_evidence: "scale tickets; transporter/treatment records; laboratory/monitoring reports; method and detection limit"
    - protocol_id: cp_output_and_rework
      process_id: "all_applicable_processes"
      flow_role: "accepted output, rejects and rework"
      record_type: "production orders, test records and scales"
      raw_fields: "model; subtype; gross output; accepted output; net mass; reject mass; rework destination; test disposition"
      collection_method: "reconcile serial/lot acceptance records with weighed output and rework movements"
      unit: "kg"
      frequency: "each batch/lot; monthly reconciliation"
      temporal_coverage: "same reporting period as inputs"
      site_scope: "every included manufacturing site"
      aggregation_rule: "accepted net output is denominator; rework stays attached to the originating process"
      quality_evidence: "final acceptance report; scale calibration; lot genealogy; rework closure"
    - protocol_id: cp_packaging
      process_id: "final_test_packaging"
      flow_role: "primary/secondary packaging, labels and manuals"
      record_type: "packaging BOM and issue records"
      raw_fields: "packaging part id; material; recycled content if evidenced; issued mass; return/waste mass"
      collection_method: "reconcile packaging BOM with issued and wasted quantities"
      unit: "kg"
      frequency: "each packaging design revision and monthly"
      temporal_coverage: "same reporting period as production output"
      site_scope: "every included packaging site"
      aggregation_rule: "packaging per accepted net product mass, separate from reference-product mass"
      quality_evidence: "approved packaging specification; supplier mass data; issue reconciliation"
    - protocol_id: cp_product_performance
      process_id: "final_test_packaging"
      flow_role: "rated interfaces, efficiency/losses, isolation and cooling"
      record_type: "nameplate/specification, type/routine tests and calibration records"
      raw_fields: "subtype; model; input/output voltage; AC/DC; frequency; phases; direction; rated power/current/inductance; load point; input/output power; auxiliaries; temperature; isolation; cooling"
      collection_method: "use applicable product standard or fully disclosed test procedure; preserve raw paired measurements"
      unit: "V, A, Hz, W, VA, H, %, °C"
      frequency: "each model/type test and production routine-test plan"
      temporal_coverage: "current model revision"
      site_scope: "each declared product family and test facility"
      aggregation_rule: "calculate only like-for-like operating points; retain direction and auxiliary boundary"
      quality_evidence: "accredited/type-test report where available; procedure revision; instrument calibration; pass/fail record"
    - protocol_id: cp_service_life_evidence
      process_id: "published_dataset_metadata"
      flow_role: "expected service life and maintenance profile"
      record_type: "reliability test, field-return, warranty or engineering-life records"
      raw_fields: "life metric; operating profile; load; temperature; humidity; cooling maintenance; failure criterion; sample size; confidence; source period"
      collection_method: "choose the model-relevant evidence hierarchy and document extrapolation"
      unit: "years, h or cycles"
      frequency: "each model revision or evidence update"
      temporal_coverage: "evidence period stated explicitly"
      site_scope: "target market/use conditions"
      aggregation_rule: "report declared value with operating and maintenance conditions; no category-wide default"
      quality_evidence: "test/field study, warranty analysis, engineering sign-off and uncertainty disclosure"
  calculation_rules:
    - id: calc_inventory_normalization
      applies_to: "every foreground inventory row"
      rule: "normalized amount = allocated reporting-period amount / conforming net reference-product mass"
      inputs:
        - "allocated input/output/waste/emission"
        - "conforming net mass from cp_output_and_rework"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_efficiency
      applies_to: "converter, charger, PCS or electronic ballast operating point"
      rule: "efficiency = measured useful output power / measured input power; calculate separately by direction and operating point and disclose auxiliary-power inclusion"
      inputs:
        - "paired input/output power"
        - direction
        - load
        - voltage
        - frequency
        - phase
        - "temperature and auxiliary boundary from cp_product_performance"
      output: "dimensionless efficiency (%) plus loss power (W)"
      source_ids:
        - iec-61683-1999
        - eu-2019-1782
    - id: calc_mass_balance
      applies_to: "each manufacturing process and total foreground"
      rule: "balance gap = mass inputs - product outputs - waste outputs - measured direct mass emissions - documented stock change; investigate rather than force-close material gaps"
      inputs:
        - "BOM/receiving mass"
        - "output/rework"
        - "waste and direct-emission records"
      output: "process and total mass-balance gap with explanation"
      source_ids: []
    - id: calc_shared_resource_allocation
      applies_to: "shared utilities and line inputs"
      rule: "allocated amount = measured shared total × declared causal-driver share; shares shall sum to 1 for the allocation pool"
      inputs:
        - "shared meter/invoice total and product-specific causal driver"
      output: "product/process allocated amount"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - id: calc_family_scaling
      applies_to: "homogeneous product family only"
      rule: "apply a reviewed equation or interpolation derived from representative products; validate high, low and median/sales-representative cases and disclose sensitive parameters"
      inputs:
        - "product LCAs"
        - mass
        - "power range"
        - "component architecture"
        - losses
        - "cooling and lifetime"
      output: "product-specific inventory with uncertainty/sensitivity evidence"
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "All required qualifiers and exact product subtype/model or homogeneous-family scope are complete."
      evidence: "product specification, nameplate, classification and test procedure"
    - id: dq_bom_coverage
      applies_to: "material/component inputs"
      requirement: "BOM coverage reconciles to net product mass and explicitly covers influential electronics, conductors, magnetic cores, cooling hardware, insulation/potting and packaging or discloses a quantified gap."
      evidence: "BOM reconciliation and calc_mass_balance"
    - id: dq_temporal_site
      applies_to: "foreground records"
      requirement: "Inputs, outputs, energy, waste and emissions cover the same representative period and all sites in scope; partial periods and site exclusions are quantified."
      evidence: "dated records, production schedule and site list"
    - id: dq_upstream_data
      applies_to: "purchased inputs"
      requirement: "Upstream datasets are supplier-specific where available and otherwise technology-, geography- and time-representative; proxy choices and same-category inputs are disclosed."
      evidence: "supplier declarations, dataset metadata and proxy review"
    - id: dq_performance
      applies_to: "efficiency/loss and electrical qualifiers"
      requirement: "Test method, operating point, direction, temperature, instrument calibration and auxiliary boundary are retained; a subtype-specific result is not generalized without evidence."
      evidence: "raw test data and cp_product_performance records"
    - id: dq_service_life
      applies_to: "downstream-use linkage"
      requirement: "Service-life claim states operating/maintenance conditions, evidence type, sample basis and uncertainty; absence of evidence is disclosed rather than replaced with a default."
      evidence: "cp_service_life_evidence record"
    - id: dq_completeness
      applies_to: "modelled inventory"
      requirement: "All assessable flows are included or a flow-specific exclusion is justified; cut-off is not used to hide high-impact or hazardous materials/components."
      evidence: "completeness checklist, contribution screening and source-backed justification"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "reference flow"
    rule: "The reference output is exactly 1 kg of flow 2753fd9b-d904-40b2-9cae-4642fd5fc5fc, using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg."
    source_ids: []
  - rule_id: val_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Product subtype, rated power or inductor rating, input/output voltage, current type, phases, efficiency/loss test basis, isolation, cooling and expected service life are declared or explicitly marked not applicable with an equivalent relevant property."
    source_ids:
      - iec-62477-1-2022
      - iec-62909-1-2025
      - iec-61683-1999
      - iec-61347-2-12-2024
      - eu-2019-1782
  - rule_id: val_process_route
    applies_to: "process map"
    rule: "All required processes and each applicable conditional process are included; every exclusion has product-specific evidence."
    source_ids: []
  - rule_id: val_no_cross_subtype_proxy
    applies_to: "representative and proxy data"
    rule: "A photovoltaic inverter or any other single subtype is not used to represent the entire category; family scaling satisfies homogeneous-function, standard, technology and sensitivity requirements."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: val_mass_and_rework
    applies_to: "foreground inventory"
    rule: "Product, waste, direct-emission and rework records reconcile under calc_mass_balance; unexplained gaps are findings, not forced adjustments."
    source_ids: []
  - rule_id: val_energy_and_efficiency
    applies_to: "manufacturing and performance data"
    rule: "Manufacturing/test electricity is separate from operational conversion losses; efficiency/loss results preserve direction, load point, electrical interfaces, temperature and auxiliary boundary."
    source_ids:
      - iec-61683-1999
      - eu-2019-1782
  - rule_id: val_upstream_and_recursive_inputs
    applies_to: "purchased components and subassemblies"
    rule: "Each material purchased input has an upstream dataset or disclosed gap, and every same-category input remains visible with subtype and stopping rule."
    source_ids:
      - pep-ecopassport-pcr-ed4-2021
  - rule_id: val_sources_and_collection
    applies_to: "all constrained values and rules"
    rule: "Every collected/calculated row links to a collection protocol and every non-default external method constraint cites a listed source id; no uncited numeric default or legal threshold is introduced."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset when representativeness and review support reuse outside the reporting organization"
  downstream_use: "Foreground data-package production and factory-gate process publication; downstream process or lifecyclemodel construction for product systems using the declared ballast, converter, charger, PCS or inductor"
  allowed_use: "Product-specific or reviewed homogeneous-family manufacturing modelling with explicit subtype/performance qualifiers; downstream use-stage modelling with separately supplied duty, efficiency/loss and service-life scenarios"
  excluded_use: "Category-wide default from a single photovoltaic inverter or other subtype; legal-compliance claims; substitution among unlike converter/ballast/inductor functions; operational loss modelling from factory test energy; product comparison without equivalent function and service"
  required_metadata: "PCR id/version; product subtype/model/family; CPC reference; plant geography/year; production route; rated electrical interfaces and power/current/inductance basis; conversion direction; efficiency/loss test basis; isolation; cooling; service life; net mass; packaging mass; included auxiliaries/firmware; allocation; BOM/upstream coverage; data sources"
  required_quality_disclosure: "primary-data share; BOM and mass-balance coverage; metering/allocation basis; supplier dataset representativeness; process exclusions; direct-emission and waste coverage; performance-test evidence; service-life evidence and uncertainty; proxy/scaling limits; review state"
  update_trigger: "Product subtype or main function changes; rated power/interface, topology, isolation or cooling changes materially; BOM or supplier route changes; firmware changes operating losses; efficiency or service-life evidence changes; production site/technology changes; applicable standard/regulation or upstream dataset is revised"
