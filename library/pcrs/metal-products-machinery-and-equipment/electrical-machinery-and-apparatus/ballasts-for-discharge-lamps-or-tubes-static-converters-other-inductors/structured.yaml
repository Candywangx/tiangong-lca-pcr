system_boundary:
  rules:
    - rule_id: sb_manufacturing_inputs
      applies_to: "factory-gate production"
      rule: "Include upstream production and supplier transport of materials, components and subassemblies, plant transformation and assembly, product testing, and primary/secondary packaging; purchased items shall link to upstream datasets."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - rule_id: sb_sensitive_components
      applies_to: "electronics and magnetics"
      rule: "Do not cut off printed circuit boards, power semiconductors/modules, copper or aluminium conductors, magnetic cores, capacitors, cooling hardware, or other environmentally influential components solely because their mass share is small."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - rule_id: sb_subtype_specificity
      applies_to: "product family and proxy modelling"
      rule: "A single photovoltaic inverter, ballast, charger or inductor shall not represent another subtype or the whole category without demonstrated homogeneous-family criteria and documented scaling/sensitivity evidence."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
        - iec-62477-1-2022
        - iec-62909-1-2025
        - iec-61683-1999
        - iec-61347-2-12-2024
    - rule_id: sb_use_stage_separate
      applies_to: "downstream life-cycle models"
      rule: "Exclude operational conversion losses from the foreground manufacturing process; model them downstream from subtype-specific efficiency/loss maps, direction, duty profile, auxiliary power and declared service life."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
    - rule_id: sb_end_of_life_separate
      applies_to: "downstream life-cycle models"
      rule: "Exclude end-of-life treatment and recycling credits from factory-gate production; model deinstallation, collection, depollution, separation, recovery and disposal as separate scenarios."
      source_ids:
        - pep-ecopassport-pcr-ed4-2021
