allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared site operations and meters"
    rule: "Avoid allocation by separately metering or subdividing preparation, assembly, test, rework, and packaging operations whenever practicable."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_internal_rework
    applies_to: "internal rework and recovered work in progress"
    rule: "Keep burdens and material returns inside the same foreground system; do not create a co-product credit for an item that returns to production."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_multiple_products
    applies_to: "unavoidable shared burdens across distinct saleable products"
    rule: "Use a documented physical causal driver such as machine time, processed mass, or test time. If no physical relation reasonably represents burden causation, use a documented economic relation and disclose the method, period, prices, and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_scrap_and_residues
    applies_to: "sold scrap, recyclable residues, and waste"
    rule: "Report the mass and destination as separate outputs. Do not subtract scrap revenue or an avoided burden from foreground inputs unless the broader study declares and applies a consistent recycling or substitution method."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
