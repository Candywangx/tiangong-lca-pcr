      unit: "kg and item"
      frequency: "each receipt and issue; aggregate monthly"
      temporal_coverage: "representative reporting period or complete production campaign"
      site_scope: "all preparation lines in the declared site"
      aggregation_rule: "sum consumed mass by item and product family; retain purchased subassemblies as single rows unless their datasets exclude embedded components"
