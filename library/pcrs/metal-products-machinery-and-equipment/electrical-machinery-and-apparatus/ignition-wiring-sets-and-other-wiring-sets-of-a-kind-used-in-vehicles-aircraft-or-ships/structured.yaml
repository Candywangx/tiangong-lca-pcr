  calculation_rules:
    - id: calc_count_to_mass
      applies_to: "counted components and packaging"
      rule: "consumed mass = (issued item count - returned item count) × verified unit mass"
      inputs:
        - "issued count"
        - "returned count"
        - "verified unit mass"
      output: "consumed mass by item in kg"
      source_ids: []
    - id: calc_net_material_consumption
      applies_to: "mass-issued materials"
      rule: "consumed mass = opening stock + receipts - closing stock - documented returns or transfers out"
      inputs:
        - "opening stock"
        - receipts
        - "closing stock"
        - returns
        - transfers
      output: "consumed input mass in kg"
      source_ids:
        - eu-pef-method-2021
    - id: calc_normalize_reference_mass
      applies_to: "every foreground inventory row"
      rule: "normalized amount = reporting-period row amount / reporting-period accepted finished-product mass"
      inputs:
        - "aggregated row amount"
        - "accepted finished-product mass"
      output: "amount per 1 kg accepted wiring set"
      source_ids:
        - iso-14044-2006
        - eu-pef-method-2021
    - id: calc_mass_reconciliation
      applies_to: "whole foreground system"
      rule: "residual = total material inputs - accepted net product - exported waste and scrap - final rejects - closing work-in-progress increase + opening work-in-progress decrease; investigate and disclose the residual without forced adjustment"
      inputs:
        - "material inputs"
        - "accepted product"
        - waste
        - scrap
        - rejects
        - "work-in-progress change"
        - "stock change"
      output: "mass reconciliation and disclosed residual in kg"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity_and_scope
      applies_to: "product identity and boundary"
      requirement: "Retain the current drawing, bill of materials, application family, circuit and voltage class, product revision, site, period, included operations, outsourced operations, and packaging treatment."
      evidence: "approved drawing and BOM; routing; scope statement; product metadata"
    - id: dq_primary_records
      applies_to: "material, energy, waste, and output quantities"
      requirement: "Use site records for foreground quantities. Supplier or generic secondary data may describe upstream production but shall not replace measured foreground consumption or output."
      evidence: "receiving and issue records; meters; invoices; scale tickets; production reports; waste manifests"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Use one representative reporting period, normally 12 consecutive months or a complete production campaign, and align input, output, rework, stock-change, and waste records to that period. Disclose shutdowns, ramp-up, or exceptional production."
      evidence: "period register; production calendar; meter dates; stock records; campaign report"
    - id: dq_mass_completeness
      applies_to: "material balance"
      requirement: "Include all bill-of-material items and measurable process additions, accepted product, scrap, final rejects, work-in-progress change, and stock change; explain unresolved residuals and missing supplier datasets."
      evidence: "mass-reconciliation worksheet; BOM coverage check; data-gap register"
    - id: dq_test_traceability
      applies_to: "inspection and electrical testing"
      requirement: "Retain current acceptance procedures and traceable inspection and test results. At minimum record continuity testing; record insulation-resistance, dielectric-withstand, shielding, functional, or other tests when required by the declared application and specification."
      evidence: "test specification; calibrated-equipment record; lot- or serial-linked test report; nasa-std-8739-4a-change-4; ipc-whma-a-620"
    - id: dq_allocation
      applies_to: "shared operations"
      requirement: "Document every shared-meter or shared-process allocation driver and retain the calculation and sensitivity when a non-physical relation is used."
      evidence: "allocation worksheet; meter map; production statistics; iso-14044-2006; eu-pef-method-2021"
validation_rules:
  - rule_id: validate_complete_set_scope
    applies_to: "product identity"
    rule: "Confirm that the reference product is a complete wiring set for a vehicle, aircraft, or ship, not a single wire, cable, connector, terminal, component kit, incomplete subassembly, or complete transport equipment item."
    source_ids:
      - ipc-whma-a-620
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require product flow UUID 4b3f48dd-97a6-427e-9baf-742d7eb6e9c2, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and reference amount 1."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "functional unit and dataset metadata"
    rule: "Fail completeness when any required qualifier is absent or when the bill-of-material, drawing, test-specification, or packaging basis is not identifiable."
    source_ids:
      - ipc-whma-a-620
      - nasa-std-8739-4a-change-4
  - rule_id: validate_process_coverage
    applies_to: "foreground process inventory"
    rule: "Require all three process-map stages or a documented aggregation that preserves preparation, assembly, testing, rework, packaging, input, output, and waste coverage."
    source_ids:
      - ipc-whma-a-620
      - nasa-std-8739-4a-change-4
  - rule_id: validate_internal_transfers
    applies_to: "prepared-lead and assembled-harness internal flows"
    rule: "Confirm that each internal output has a matching downstream input and carries no duplicated upstream burden."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_mass_reconciliation
    applies_to: "whole foreground system"
    rule: "Require a mass-reconciliation worksheet covering inputs, accepted product, waste, scrap, rejects, work-in-progress, and stock change; unresolved residuals must be disclosed and must not be forced into another row."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_test_records
    applies_to: "accepted output"
    rule: "Require traceable inspection and continuity-test evidence for accepted product and all additional tests required by the declared design or acceptance specification."
    source_ids:
      - ipc-whma-a-620
      - nasa-std-8739-4a-change-4
  - rule_id: validate_allocation_disclosure
    applies_to: "shared burdens and scrap"
    rule: "Require the allocation driver, data period, calculations, and scrap or waste treatment to be disclosed; prohibit unexplained revenue netting or avoided-burden credits."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: validate_no_unsourced_defaults
    applies_to: "all foreground amounts"
    rule: "Reject undocumented default quantities presented as measured or source-backed values. Foreground gaps shall remain explicit and replaceable."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate production dataset for a finished wiring set at the manufacturing plant gate"
  downstream_use: "May be published as a secondary_dataset or background_dataset and used as a component-production input to vehicle, aircraft, ship, process, or lifecyclemodel studies"
  allowed_use: "Product-family or design-specific studies whose application, voltage, material, connector, protection, geography, period, test, and packaging qualifiers are compatible with the dataset"
  excluded_use: "Single wires, cables, connectors, terminals, incomplete kits or subassemblies; non-transport wiring applications; installed-system use or end-of-life claims; comparison across incompatible designs without additional normalization and review"
  required_metadata: "PCR id; product flow UUID; application family; harness function; circuit and voltage class; conductor and insulation system; connector and termination technology; shielding and protection; drawing and BOM revision; site and geography; reporting period; production route; outsourced stages; applicable test specification; packaging treatment; allocation method"
  required_quality_disclosure: "Foreground-data coverage; meter and mass-measurement basis; BOM and supplier-data coverage; mass-reconciliation residual; rejected and reworked output; test coverage and traceability; allocation drivers; upstream dataset gaps; temporal, geographical, and technological representativeness"
  update_trigger: "Change in drawing or BOM that materially changes composition; conductor, insulation, connector, termination, shielding, or protection technology change; voltage-class or application change; site or route change; material change in supplier mix, energy mix, scrap treatment, allocation method, test regime, packaging, or reporting period"
