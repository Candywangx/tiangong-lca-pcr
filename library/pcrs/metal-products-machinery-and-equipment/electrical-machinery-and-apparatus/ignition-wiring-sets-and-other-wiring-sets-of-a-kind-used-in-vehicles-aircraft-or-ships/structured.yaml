      collection_method: "weigh internal transfers and segregated waste"
      unit: "kg"
      frequency: "each transfer and waste dispatch; aggregate monthly"
      temporal_coverage: "same period as assembly inputs"
      site_scope: "all assembly lines in the declared site"
