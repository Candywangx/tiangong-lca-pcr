measurement_rules:
  - id: reference_mass
    applies_to: "accepted finished wiring-set output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net accepted-product mass with calibrated equipment. Include conductors, insulation, permanent connectors, terminals, seals, grommets, shielding, labels, tapes, sleeves, tubes, ties, clips, and other permanently attached items. Exclude reusable fixtures and separately reported packaging."
  - id: lot_normalization
    applies_to: "all foreground inputs and outputs"
    required_property_ref:
      name: "Mass for material rows; the metered unit for utilities"
      uuid: ""
    required_unit: "kg for material rows; recorded utility unit before conversion"
    rule: "Aggregate the same production lot or reporting period for the numerator and denominator, then divide by accepted finished-product mass to report each row per 1 kg reference flow."
  - id: component_no_double_count
    applies_to: "purchased sets, subassemblies, and individual components"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "If a purchased subassembly is recorded as one input, do not also record its embedded wires, terminals, connectors, or coverings as separate inputs unless the subassembly dataset expressly excludes them."
  - id: mass_reconciliation
    applies_to: "material inputs, accepted output, scrap, rejects, retained work in progress, and stock change"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile measured material inputs against accepted product, exported scrap or waste, rejected product, work-in-progress change, and inventory change for the same period; document rather than force-close any residual."
