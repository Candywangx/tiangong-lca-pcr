system_boundary:
  rules:
    - rule_id: boundary_foreground_manufacturing
      applies_to: "foreground process scope"
      rule: "Include on-site component preparation, termination and splicing as applicable, connector assembly, harness forming and protective covering, marking, inspection, electrical testing, rework, and packaging."
      source_ids:
        - ipc-whma-a-620
        - nasa-std-8739-4a-change-4
    - rule_id: boundary_upstream_linking
      applies_to: "purchased inputs"
      rule: "Keep purchased material and component production outside the foreground gate-to-gate system while linking each material input to an upstream dataset or disclosing the gap."
      source_ids:
        - iso-14044-2006
        - eu-pef-method-2021
    - rule_id: boundary_recursive_wiring_sets
      applies_to: "purchased same-category wiring sets or sub-harnesses"
      rule: "Record the purchased set once at the point it crosses the foreground boundary and do not expand it into supplier operations unless those operations are within the declared foreground control boundary."
      source_ids:
        - eu-pef-method-2021
    - rule_id: boundary_downstream_exclusions
      applies_to: "downstream stages"
      rule: "Exclude installation into the vehicle, aircraft, or ship, use-phase electrical losses, maintenance, removal, and end-of-life unless a broader study explicitly adds those stages outside this gate-to-gate dataset."
      source_ids:
        - iso-14044-2006
        - eu-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Purchased wires, cables, contacts, terminals, connector housings, seals, coverings, labels, packaging, and any purchased subassemblies received at the wiring-set manufacturing site"
  starting_condition_role: "Upstream product inputs to the foreground manufacturing system"
  product_classification_scope: "Complete wiring sets manufactured for vehicles, aircraft, or ships; component-only and non-transport applications are outside the reference-product scope"
  recursive_input_rule: "A purchased complete wiring set or sub-harness within the same product category is recorded once as a product input with a linked upstream dataset and declared mass and role. Do not recursively reconstruct the supplier foreground unless it is inside the reporting organisation's operational boundary."
