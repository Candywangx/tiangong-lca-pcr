allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared processes and product families"
    rule: "First subdivide metered processes, production lines, batches, or equipment time so that the declared product receives directly measured material, energy, waste, and emission records wherever practicable."
    source_ids: []
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable shared inputs and outputs"
    rule: "When subdivision is not practicable, allocate by a documented physical relationship that reflects causation, such as machine time, coated surface area, bath loading, test duration, or accepted product mass; do not default to revenue solely because products share a line."
    source_ids: []
  - rule_id: allocation_recycling_consistency
    applies_to: "Metal scrap and recovered material"
    rule: "Report scrap mass and destination separately; apply one disclosed recycling approach consistently between upstream material datasets and waste treatment so avoided burdens or recycled content are not double counted."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_packaging_reuse
    applies_to: "Reusable wooden pallets"
    rule: "Divide pallet production burden by the documented expected or observed number of uses and disclose losses, repairs, and whether return transport is inside the study scope."
    source_ids: []
