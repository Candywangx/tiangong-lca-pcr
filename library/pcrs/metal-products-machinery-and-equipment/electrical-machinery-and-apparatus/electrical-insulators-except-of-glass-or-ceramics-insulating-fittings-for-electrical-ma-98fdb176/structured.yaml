      unit: "kg"
      frequency: "Each batch or issue"
      temporal_coverage: "Representative continuous 12-month period or declared campaign"
      site_scope: "All reporting-site lines producing the declared product"
      aggregation_rule: "Sum net consumed mass and divide by accepted output mass; do not subtract waste leaving the system"
      quality_evidence: "Scale calibration and batch-to-ledger reconciliation"
