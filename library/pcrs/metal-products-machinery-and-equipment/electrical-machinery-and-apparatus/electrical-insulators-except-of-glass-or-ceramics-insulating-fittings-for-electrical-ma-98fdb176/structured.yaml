    - id: dq_temporal_alignment
      applies_to: "All foreground rows"
      requirement: "Inputs, outputs, wastes, emissions, and accepted product mass shall cover the same representative period; exceptions and shutdown/start-up treatment shall be disclosed."
      evidence: "Meter dates, batch dates, waste tickets, and production ledger"
    - id: dq_completeness
      applies_to: "Process map and conditional rows"
      requirement: "Reconcile all measured foreground input mass and metered foreground energy to the applicable process records, and identify and explain every excluded or unassigned flow individually; do not apply an undocumented environmental significance cut-off."
      evidence: "Material and energy reconciliation worksheets"
    - id: dq_measurement
      applies_to: "Meters, scales, and laboratory results"
      requirement: "Record instrument identity, calibration status, detection limit where relevant, reference conditions for gases, and wet/dry or active-content basis for chemicals."
      evidence: "Calibration certificates, laboratory reports, and supplier certificates"
    - id: dq_upstream_representativeness
      applies_to: "Linked upstream datasets"
      requirement: "Document geography, technology, time period, product state, and any proxy use for each upstream dataset; an unresolved proxy shall be flagged in the produced data package."
      evidence: "Dataset metadata and supplier information"
    - id: dq_route_transparency
      applies_to: "Conditional product-family processes"
      requirement: "Mark every conditional row applicable or not applicable and give the physical reason; zero shall not be used when the value is merely unknown."
      evidence: "Route checklist, process flow diagram, and bill of material"
