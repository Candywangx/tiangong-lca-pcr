  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "Every inventory row"
      rule: "normalized amount = period flow amount / accepted product mass for the same period"
      inputs:
        - "Period flow record"
        - "accepted product mass"
      output: "Flow amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: reconcile_material_balance
      applies_to: "Each production route"
      rule: "input material mass = accepted product mass + separately reported waste mass + measured direct material emissions + inventory change; investigate the residual rather than forcing it to zero"
      inputs:
        - "Net material inputs"
        - "accepted output"
        - wastes
        - "direct releases"
        - "stock change"
      output: "Route material-balance residual and explanation"
      source_ids:
        - mass-balance-identity
    - id: convert_metered_electricity
      applies_to: "Electricity rows"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "Metered kWh"
      output: "Purchased electricity in MJ"
      source_ids:
        - mass-balance-identity
    - id: convert_liquid_volume_to_mass
      applies_to: "Wastewater or liquid input recorded by volume"
      rule: "mass = measured volume × density at stated temperature; do not assume water density for concentrated solutions"
      inputs:
        - Volume
        - "measured density"
        - temperature
      output: "Liquid mass in kg"
      source_ids:
        - mass-balance-identity
    - id: allocate_reusable_pallet
      applies_to: "Wooden pallet input"
      rule: "assigned pallet mass = pallet mass × pallets used / documented expected or observed uses, adjusted for pallet loss according to the disclosed reuse model"
      inputs:
        - "Pallet mass"
        - "units shipped"
        - "reuse count"
        - "loss rule"
      output: "Pallet mass per 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Product family, material system, ratings, geometry, standard, and finished state shall match the declared semantic boundary and be traceable to accepted output records."
