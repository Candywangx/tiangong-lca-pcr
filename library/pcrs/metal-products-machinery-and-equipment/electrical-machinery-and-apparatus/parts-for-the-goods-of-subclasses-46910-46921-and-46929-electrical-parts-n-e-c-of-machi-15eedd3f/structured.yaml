allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared processes and equipment"
    rule: "Avoid allocation by subdividing production steps and using product-specific meters, issue records, machine time, test cycles, and waste records wherever technically feasible."
    source_ids:
      - ec-product-environmental-footprint-method-2021
  - rule_id: allocation_physical_relation
    applies_to: "Residual shared burdens"
    rule: "When subdivision is infeasible, allocate by a documented physical causal relation such as machine time, energy demand, processed mass, or test duration; use simple mass share only when it reasonably represents the burden driver."
    source_ids:
      - ec-product-environmental-footprint-method-2021
  - rule_id: allocation_scrap_boundary
    applies_to: "Scrap and internal recycling"
    rule: "Report scrap crossing the foreground boundary with its actual treatment route. Track internal regrind or remelt loops in the mass balance and do not claim an avoided burden unless a separately declared downstream method requires and documents it."
    source_ids:
      - ec-product-environmental-footprint-method-2021
  - rule_id: allocation_rejects
    applies_to: "Rejected parts"
    rule: "Assign material, energy, water, and treatment burdens of rejected production to the accepted reference product unless the rejected material becomes a documented co-product with a separately justified function and allocation method."
    source_ids:
      - ec-product-environmental-footprint-method-2021
