      unit: "kg; concentration fraction"
      frequency: "Per batch or shift, aggregated monthly"
      temporal_coverage: "Same period as output records"
      site_scope: "Each applicable cleaning or finishing line"
      aggregation_rule: "Attribute only route-specific consumption, convert solution/product basis explicitly, and normalize by accepted output"
      quality_evidence: "Calibrated meters, bath logs, safety data sheet, purchase record, and reconciliation"
    - protocol_id: cp_fuel_records
