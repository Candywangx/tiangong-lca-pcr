      temporal_coverage: "At least 12 representative months or the full production campaign"
      site_scope: "All reporting-facility lines producing the declared part"
      aggregation_rule: "Net consumption = opening stock + receipts - closing stock - documented returns; normalize by accepted output"
      quality_evidence: "Purchase documents, batch tickets, stock reconciliation, and bill of materials"
    - protocol_id: cp_energy_records
      process_id: "component_fabrication_and_finishing_part_assembly_and_testing"
      flow_role: "Purchased electricity"
      record_type: "Submeter, utility meter, and machine record"
      raw_fields: "meter id; opening and closing readings; unit; line; operating hours; part-family output"
      collection_method: "Prefer submeters; otherwise allocate by a validated causal driver"
      unit: "Metered energy unit"
      frequency: "Continuous or each shift, aggregated monthly"
      temporal_coverage: "Same period as output records"
      site_scope: "All applicable fabrication, assembly, and test equipment"
      aggregation_rule: "Subtract documented non-production loads and normalize attributed energy by accepted output"
      quality_evidence: "Meter calibration, utility invoice reconciliation, and allocation worksheet"
    - protocol_id: cp_water_and_chemical_records
