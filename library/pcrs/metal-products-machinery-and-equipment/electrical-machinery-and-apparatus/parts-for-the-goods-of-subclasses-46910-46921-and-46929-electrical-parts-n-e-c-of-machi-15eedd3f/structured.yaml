      record_type: "Fuel meter, invoice, oven log, and emission-factor record"
      raw_fields: "gas volume; reference conditions; net calorific value; equipment; operating time; factor; factor geography and year"
      collection_method: "Reconcile meters to invoices and assign by measured equipment use"
      unit: "m3; kg CO2"
      frequency: "Continuous or each billing period"
      temporal_coverage: "Same period as output records"
      site_scope: "Applicable on-site ovens, dryers, and heat-treatment equipment"
      aggregation_rule: "Attribute fuel to the route; calculate CO2 under cr_stationary_combustion_co2; normalize both by accepted output"
      quality_evidence: "Meter/invoice reconciliation and documented factor provenance"
    - protocol_id: cp_waste_records
      process_id: "component_fabrication_and_finishing"
      flow_role: "Steel scrap, copper scrap, and polypropylene waste"
      record_type: "Container weight, transfer, and treatment records"
      raw_fields: "waste identity; tare; gross; net mass; contamination; internal return; destination; treatment"
      collection_method: "Weigh each segregated stream and reconcile transfers"
      unit: "kg"
      frequency: "Each shipment or batch, aggregated monthly"
      temporal_coverage: "Same period as output records"
      site_scope: "All route-attributable waste collection points"
      aggregation_rule: "Count only waste crossing the boundary; normalize by accepted output"
      quality_evidence: "Calibrated scale tickets, transfer notes, and internal-reuse ledger"
    - protocol_id: cp_wastewater_records
      process_id: "component_fabrication_and_finishing"
      flow_role: "Metal-fabrication and finishing wastewater"
      record_type: "Flowmeter, tank, batch discharge, and analysis records"
      raw_fields: "volume or mass; density; route; treatment state; discharge time; key contaminants"
      collection_method: "Meter continuous discharge or measure each batch; retain representative analysis"
      unit: "kg"
      frequency: "Continuous or each discharge, aggregated monthly"
      temporal_coverage: "Same period as output records"
      site_scope: "Each applicable cleaning and finishing line"
      aggregation_rule: "Convert volume with documented density where needed and normalize pre-external-treatment mass by accepted output"
      quality_evidence: "Meter calibration, discharge log, laboratory report, and treatment record"
    - protocol_id: cp_saleable_output_records
      process_id: "part_assembly_and_testing"
      flow_role: "Accepted reference product and rejects"
      record_type: "Production, scale, inspection, and test records"
      raw_fields: "model; lot; produced count; accepted count; rejected count; net mass; test result; disposition"
      collection_method: "Weigh accepted output and reconcile with inspection and test disposition"
      unit: "kg"
      frequency: "Each lot, aggregated monthly"
      temporal_coverage: "Same period as all input records"
      site_scope: "All reporting-facility lines producing the declared part"
      aggregation_rule: "Sum accepted net mass only; reconcile rejects to waste or rework records"
      quality_evidence: "Scale calibration, production order, inspection report, and test record"
  calculation_rules:
    - id: cr_normalize_reference
      applies_to: "Every inventory row"
      rule: "Normalized amount = route-attributed row amount / accepted reference-product mass."
      inputs:
        - "Row amount"
        - "accepted mass from cp_saleable_output_records"
      output: "Amount per 1 kg accepted reference product"
      source_ids:
        - ec-product-environmental-footprint-method-2021
    - id: cr_net_material_use
      applies_to: "Material and packaging inputs"
      rule: "Net use = opening stock + receipts - closing stock - documented returns; reconcile the result to product, waste, emissions, and stock change."
      inputs:
        - "Stock and issue fields from cp_material_and_packaging_records"
      output: "Net input mass"
      source_ids:
        - ec-product-environmental-footprint-method-2021
    - id: cr_stationary_combustion_co2
      applies_to: "fossil_carbon_dioxide"
      rule: "Direct CO2 = attributed fuel consumption × compatible documented CO2 emission factor; convert volume to energy only with recorded net calorific value and reference conditions."
      inputs:
        - "Natural-gas consumption"
        - "net calorific value if needed"
        - "applicable CO2 factor"
      output: "kg fossil CO2"
      source_ids:
        - ipcc-stationary-combustion-2006
    - id: cr_mass_balance
      applies_to: "Fabrication and assembly"
      rule: "For each principal material, reconcile input = accepted product content + external waste + documented emissions + closing work-in-process - opening work-in-process; investigate unexplained imbalance."
      inputs:
        - "Material records"
        - "accepted output"
        - scrap
        - emissions
        - work-in-process
      output: "Material-specific balance and unexplained difference"
      source_ids:
        - ec-product-environmental-footprint-method-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Identify one part family, model or drawing, host-apparatus application, material specification, rating, test criteria, route, and market state."
      evidence: "Drawing, bill of materials, specification, inspection record, and dataset metadata"
    - id: dq_primary_data
      applies_to: "Foreground manufacturing"
      requirement: "Use product- or route-specific primary data for the bill of materials and manufacturing activity; document every allocation from shared facility totals."
      evidence: "Meters, issue records, production orders, allocation worksheet, and responsible-person approval"
    - id: dq_temporal_alignment
      applies_to: "All foreground rows"
      requirement: "Use the same representative period for inputs, outputs, wastes, and accepted production, normally at least 12 months or the full campaign; explain shutdowns and abnormal batches."
      evidence: "Period reconciliation and production calendar"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile the full bill of materials and add one atomic row for every other actual material, component, chemical, packaging item, waste, or direct elementary flow not represented by the common rows above."
      evidence: "Bill-of-material crosswalk, flow ledger, mass balance, and documented exclusions"
    - id: dq_representativeness
      applies_to: "Upstream datasets and factors"
      requirement: "Record technological, geographical, and time representativeness and disclose every proxy, unresolved UUID, factor source, and treatment-state assumption."
      evidence: "Dataset metadata, source record, proxy rationale, and data-quality assessment"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Fail validation if the part family, model or drawing, host application, specification, rating where applicable, route, market state, accepted output mass, or packaging state is missing."
    source_ids:
      - un-cpc-3-structure-2025
      - un-cpc-3-explanatory-notes-2025
  - rule_id: validation_inventory_completeness
    applies_to: "Bill of materials and process inventory"
    rule: "Confirm that every actual bill-of-material, energy, water, chemical, packaging, waste, and direct-emission exchange has one atomic row and that exclusions are justified."
    source_ids:
      - ec-product-environmental-footprint-method-2021
  - rule_id: validation_route_conditions
    applies_to: "Conditional processes and flows"
    rule: "Confirm each conditional row is either supported by production evidence or explicitly not applicable; do not silently omit finishing, combustion, wastewater, scrap, or packaging."
    source_ids:
      - ifc-metal-plastic-rubber-ehs-2007
  - rule_id: validation_balances
    applies_to: "Material and activity data"
    rule: "Reconcile accepted output, rejects, work-in-process, principal materials, fuel, and shared-meter allocations for the same period; investigate material unexplained differences and invoice/meter gaps."
    source_ids:
      - ec-product-environmental-footprint-method-2021
  - rule_id: validation_combustion
    applies_to: "Natural gas and direct fossil CO2"
    rule: "When natural gas is combusted, require a compatible emission factor, net calorific value or direct mass/volume basis, equipment assignment, and matching direct fossil-CO2 row."
    source_ids:
      - ipcc-stationary-combustion-2006
  - rule_id: validation_uuid_integrity
    applies_to: "Tiangong identities"
    rule: "Use only directly audited state-100 exact UUIDs; keep reference_product, low_carbon_steel_sheet, and metal_finishing_wastewater unresolved until exact classification-, state-, property-, unit-, and bilingual-consistent records exist."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product- and route-specific cradle-to-factory-gate inventory dataset for one separately supplied CPC 46960 electrical part"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Modelling a declared part as an input to a host apparatus or comparing production scenarios for the same functionally and technically equivalent part under aligned boundaries"
  excluded_use: "Representing complete apparatus; inferring distribution, use, service life, maintenance, or end-of-life; comparing unlike part families or electrical functions without a separately justified functional equivalence"
  required_metadata: "Canonical PCR id and version when published; part family and drawing/model; host application; mass per item; material specification and bill of materials; ratings and test criteria; route; facility and supplier geography; reference period; accepted yield and rejects; allocation; upstream datasets; packaging state; unresolved identities and proxies"
  required_quality_disclosure: "Primary-data share; meter and scale coverage; temporal, technological, and geographical representativeness; mass-balance result; allocation drivers; missing flows; data gaps; uncertainty; factor provenance; internal recycling and external waste treatment"
  update_trigger: "Change in part design, bill of materials, supplier or recycled content, production or finishing route, test regime, facility energy or water system, allocation driver, packaging, factor, upstream dataset, or a material data-quality gap"
