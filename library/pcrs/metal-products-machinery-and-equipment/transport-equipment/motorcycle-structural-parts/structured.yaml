measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Complete unit here is one complete specified main frame, not a motorcycle. Physically weigh each accepted same-part/revision frame on a suitable calibrated scale with measured fixture tare; record weld/mount completeness, cleaning/oil state, date/operator, uncertainty and positive net M linked to signed release. Same-configuration batch counts need actual count and traceable frame mass measurements; no assumed weight. Reconcile tube/plate, filler incorporation, rejects/chips and delivered frame state without counting shielding gas as incorporated mass."
  - id: energy_units
    applies_to: "each electricity row"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Use verified energy-unit conversion 1 kWh = 3.6 MJ; preserve actual intake voltage/provider, welding/machine/ventilation idle-active meter boundaries. No arc current, nameplate power or guessed welding duration replaces actual metered electricity."
