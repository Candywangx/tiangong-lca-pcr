allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Directly attribute configured stock/filler/gas issues, actual machine/welding/ventilation meters and inspection including rework. For inseparable resources use measured causal machine/fixture occupation and actual load: share = order driver / sum of covered order drivers. Keep covered period/denominator; equal frame counts, catalogue mass or rated amperage alone are not default drivers."
    source_ids: []
  - rule_id: allocation_qualification
    applies_to: "qualification and accepted production"
    rule: "Separate independent R&D/prototype from actual production qualification. Attribute applicable destructive weld/fatigue qualification to actual covered orders with traced scope, driver and sensitivity; destroyed frames do not enter accepted output. Actual per-frame inspection is direct. No assumed test schedule, fixture lifetime or universal qualification allocation."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "scrap, rejects and rework"
    rule: "Count each physical scrap/chip/waste transfer once, with actual destination and period balance. Internal rework stays with accepted production. Recyclability does not justify avoided-steel or disposal credits. Actual saleable co-product allocation requires evidenced causal/economic originals and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "accepted physical weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M; part number/revision; frame scale reading; fixture tare; oil/cleaning state; calibration/uncertainty; drawing; signed release"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared frame acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "actual calibrated physical single-frame weighing, measured tare and controlled drawing/release"
    - protocol_id: cp_preparation
      process_id: "preparation"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read actual calibrated stock issues/returns, tube/bend/machine jobs, chip transfer and meters"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
    - protocol_id: cp_welding
      process_id: "welding"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read actual weld procedure/map, metered power/gas, filler net issues, electrode wear and filter/waste records"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
    - protocol_id: cp_finishing
      process_id: "finishing"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read finishing/machining jobs, actual disc wear/chips, correction/rework and meters"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
    - protocol_id: cp_cleaning
      process_id: "cleaning"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read actual recipe/SDS, net cleaning supplies, drying meters, solvent balances and waste transfers"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read controlled drawing, dimensional/weld inspection, calibration, actual physical net weighing and release"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "model; configuration; serial/batch; part/revision; exact exchange/SDS; net issues/returns/stocks; kg; metered kWh; waste destination; emission method; actual shared driver"
      collection_method: "Read actual packaging issues/returns, tare and rack reuse movements"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original jobs/drawings/SDS, calibrated scales/meters, acceptance and transfers"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Use mass_record_provenance actual physical frame weighing, same part/revision/completeness, calibrated scale/tare/uncertainty and positive M kg. Reconcile welded filler/mounts and residual oil, excluding temporary fixture, engine, bolt-on rear subframe and protection. No tube-density sum or catalogue mass substitutes; missing original weighing requires scientific/data review."
      evidence: "actual weighing/calibration, frame drawing and release"
    - id: quality_identity
      applies_to: "every exchange"
      requirement: "Check one physical/chemical identity and actual supplied grade/route/concentration. Steering-head tube is not generic motorcycle accessories; ER70S-6 is not stainless MIG wire; pure tungsten is not thoriated tungsten; gas argon is not liquid argon; IPA solvent is not disinfectant. Preserve original public property/unit and media; unresolved identity stays specific."
      evidence: "actual supplier specifications/SDS and public identity records"
    - id: quality_weld
      applies_to: "cp_welding; cp_acceptance"
      requirement: "Retain actual weld map, procedure qualification, filler compatibility, preparation/fit-up, gas supply, electrode specification, controlled drawing datums and actual visual/NDT release plan. Record distortion, cracks, lack of fusion and other actual defects against producer-defined criteria. No universal frame geometry, fatigue/crash limit, weld energy or inspection method inferred from generic TIG guidance."
      evidence: "actual qualified procedure/drawing, metrology/NDT/acceptance originals"
    - id: quality_balance
      applies_to: "stock, filler, gas, solvent, water and energy"
      requirement: "Reconcile actual stock/net issue, incorporated frame and filler, rejects/chips/returns and cylinder gas net consumption separately. Measured gas volume needs original pressure/temperature/state and justified conversion; no default gas density. Water supply, treatment wastewater and environmental withdrawal/release are distinct. IPA-air requires measured species/medium or closed balance with retained/recovered solvent, not all issues. Welding extraction/filter dust and each species release require actual evidence before dataset completion."
      evidence: "actual stock/gas/material/species balances, meters and waste records"
    - id: quality_coverage
      applies_to: "actual dataset and upstream links"
      requirement: "Distinguish measured, calculated, missing and evidenced not_applicable. Audit actual complete weld/production map, supplier-contained subpart processing, NDT/drying/coolant/filter exchanges missing from cards, capital exclusions, allocation and uncertainty. Compatible verified upstream links are needed for full cradle-to-gate claims. Contract check cannot establish actual factory completion or scientific approval."
      evidence: "actual full manufacturing map and transparent gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference/output"
    rule: "Require current positive actual M kg with cp_mass. Exact reference name equals finished_frame; empty UUID registers that precise row in unresolved_flow_identities. Actual bare main-frame completeness excludes engine/fixtures/packing/rear subframe; no vehicle gross mass."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all rows/protocols"
    rule: "Check identical ordered lower-case row/rule/protocol IDs and actual generated references in both languages. q_item per accepted finished unit, M kg, explicit normalize_mass and identical same-configuration counts. Never rewrite public number/area/energy properties as Mass."
    source_ids: []
  - rule_id: validate_route
    applies_to: "weld and production map"
    rule: "Require actual low-carbon tube/stock route, TIG argon procedure, exact filler/electrode conditions, received-head/bracket containment, applicable finishing/NDT and actual emission evidence. Manufacturer frame/vehicle example is not this configuration’s empirical inventory. Missing actual records or applicability requires review."
    source_ids: []
  - rule_id: validate_use
    applies_to: "dataset use"
    rule: "Disclose exact frame drawing/configuration, uncoated gate, mass evidence, omitted actual exchanges, unresolved identities and upstream compatibility. Equal kg is not equal frame stiffness, fatigue/crash performance or life. Candidate is not published or scientifically approved."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual data completion/review"
  downstream_use: "Specified bare motorcycle main-frame input into separately bounded coating/vehicle manufacture"
  allowed_use: "Compare matching configured frame route/gate per kg with actual mass, acceptance scope and upstream links disclosed"
  excluded_use: "Exclude complete motorcycles/sidecars, engine/powertrain, bearings, suspension, wheels, fuel tanks, body panels, bolted rear subframes and uninstalled accessories; aluminium/cast/composite/CrMo frames, MIG/laser/brazed or undeclared joining routes, repaired frames, vehicle assembly, phosphating/painting/powder-coating, riding/transport services and end of life. Any alternate material, joining or coated supply state needs separate methodology assessment."
  required_metadata: "manufacturer/model/site/period; frame part number/revision/serial and controlled drawing; low-carbon grade, tube section/wall and stock supply state; actual integral steering-head/mount completeness, received subparts versus fabrication; argon supply and actual TIG procedure, weld map/filler/electrode specification and qualifications; actual finishing/cleaning/residual oil; dimensional/weld inspection and release; actual same-configuration calibrated net frame mass M kg, scale/tare/uncertainty; actual stock/meter/gas/waste records, rework/allocation and supplier upstream compatibility; packing/rack exclusion and data gaps"
  required_quality_disclosure: "Measured/calculated/missing data, weighing/weld/inspection originals, identity and scope gaps, capital exclusion, allocation and uncertainty; candidate and scientific review pending"
  update_trigger: "Actual frame drawing, grade/section, supply subpart state, joining/filler/gas/electrode route, finishing/coating gate, mass/inspection, site or upstream changes"
data_sources:
  - id: "yamaha"
    type: "literature"
    reference: "[Yamaha Motor manufacturing jobs/processes](https://global.yamaha-motor.com/jp/recruit/graduates/highschool/works-mc/)"
    used_for: "HTML プレス、溶接、塗装、ユニット組付 and 車体・ユニット組立: manufacturer forming/welding/painting and assembly context. Does not identify actual frame steel, TIG procedure, frame M or factory intensity. Separate outboard/engine and finished-vehicle tests are not frame-only evidence. Undated description supports qualitative process separation only."
  - id: "bmw"
    type: "literature"
    reference: "[BMW Group Plant Berlin](https://www.bmwgroup.jobs/content/grpw/websites/bmwgroup-werke_com/berlin/en.html)"
    used_for: "HTML Welding shop, Assembly and Paint shop headings distinguish frame manufacture, engine/frame marriage and later frame powder coating. Aluminium-tank welding, engine tolerance, complete-bike dynamometer checks and plant counts cannot be transferred to this bare low-carbon TIG main frame. No numeric constraints adopted."
  - id: "twi"
    type: "extension_guidance"
    reference: "[TWI: Tungsten inert gas TIG or GTA welding](https://www.twi-global.com/technical-knowledge/job-knowledge/tungsten-inert-gas-tig-or-gta-welding-006)"
    used_for: "HTML Process characteristics, Electrode and Shielding gas paragraphs: non-consumable tungsten, inert shielding and separately added optional filler; argon can weld steel. Generic process guidance, not a motorcycle factory specification or mandatory pure-tungsten/filler recipe. No gas rate, electrode life, power, efficiency, weld qualification or emission factors adopted."
