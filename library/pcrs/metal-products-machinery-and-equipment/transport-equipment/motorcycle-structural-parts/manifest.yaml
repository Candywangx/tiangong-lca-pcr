  semantic_boundary_decision: Scanned material inventory has no motorcycle
    structural main-frame manufacturing record. Steel/tube PCRs supply stock
    methodology and complete motorcycle assembly has a different
    output/supplier-containment boundary. Create narrower bare low-carbon
    tubular argon-TIG main-frame route with weld-map/datums and physical frame
    acceptance. Exclude coated frame, bolted rear frame, sidecar and complete
    vehicles. Old 49941 leaf remains read-only empty scaffold; no retired
    identity or accepted mapping promoted.
