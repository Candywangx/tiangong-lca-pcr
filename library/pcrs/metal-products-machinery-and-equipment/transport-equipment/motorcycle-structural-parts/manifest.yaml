  unresolved_quantity_ranges:
    - No actual accepted main-frame M, weld recipe/intensity, gas/filler demand,
      factory quantities, lifetime or empirical QA range obtained; actual
      calibrated weighing, drawing/procedure and production records required.
  evidence_limitations:
    - Yamaha/BMW support qualitative process separation only, not this frame
      material, TIG recipe or actual quantities.
    - TWI generic TIG description supports conditional route identity, not
      manufacturer adoption, pure tungsten/ER70S-6 universality, weld
      qualification or emission factors.
    - Actual controlled frame drawing, material/subpart supply state, qualified
      weld procedure, dimensional/NDT acceptance and physical net weighing
      originals remain prerequisites.
    - Operating receipt-to-acceptance foreground excludes long-lived capital
      infrastructure and is not full cradle-to-gate without compatible verified
      upstream links; scientific review pending.
    - TWI states article originated in March1995 and has been updated; current
      retained web text used only for generic TIG concepts, not dated production
      statistics, quantitative factors or universal electrode recipes.
