allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "shared body and vehicle operations"
    rule: "Subdivide body-forming, joining and coating records from downstream vehicle assembly where measured records allow."
    source_ids:
      - edag-silverado-body-lca-2018
  - rule_id: allocate_metered
    applies_to: "shared meters and batches"
    rule: "Assign shared electricity, gas, water and material issues to accepted bodies using the documented meter period, line or batch counts and configuration mix; disclose the allocation key and reject untraceable assignment."
    source_ids:
      - edag-silverado-body-lca-2018
  - rule_id: allocate_scrap
    applies_to: "recovered steel offcuts"
    rule: "Record steel offcuts once as waste to their actual treatment route; do not give an undocumented avoided-production credit."
    source_ids:
      - edag-silverado-body-lca-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "body_release"
      flow_role: "accepted body mass"
      record_type: "calibrated scale record"
      raw_fields: "model; configuration; serial or batch id; coating state; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted body or traceable batch"
      temporal_coverage: "reporting period"
      site_scope: "release gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "scale calibration; acceptance record"
    - protocol_id: cp_sheet
      process_id: "body_form_join"
      flow_role: "steel or aluminium sheet input"
      record_type: "purchase and issue records"
      raw_fields: "alloy or grade; received mass; issued mass; batch; accepted body count"
      collection_method: "Reconcile issued sheet with stock change and forming records for each material separately."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "reporting period"
      site_scope: "body line"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "invoices; stock ledger; bill of materials"
    - protocol_id: cp_energy
      process_id: "body_form_join"
      flow_role: "electricity or gas input"
      record_type: "meter and fuel records"
      raw_fields: "meter id; kWh; gas m3; period; line; accepted body count"
      collection_method: "Read calibrated meters and assign only the attributable body line and coating load; separate electricity and gas."
      unit: "kWh or m3"
      frequency: "each meter period"
      temporal_coverage: "reporting period"
      site_scope: "body line and coating"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "meter calibration; utility bills; allocation worksheet"
    - protocol_id: cp_scrap
      process_id: "body_form_join"
      flow_role: "steel offcuts"
      record_type: "scrap weighbridge records"
      raw_fields: "container id; steel grade; mass; destination; batch"
      collection_method: "Weigh segregated steel offcuts and reconcile against material issue and body output."
      unit: "kg"
      frequency: "each scrap transfer"
      temporal_coverage: "reporting period"
      site_scope: "forming line"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "weighbridge; transfer ticket"
    - protocol_id: cp_coating_materials
      process_id: "body_coating"
      flow_role: "water and basecoat input"
      record_type: "meter and material issue records"
      raw_fields: "water kg; coating formulation; issued wet paint kg; batch; accepted body count"
      collection_method: "Measure supplied water and separately reconcile issued basecoat against stock and returns."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "reporting period"
      site_scope: "paint shop"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "meter; issue log; formula sheet"
    - protocol_id: cp_effluent
      process_id: "body_coating"
      flow_role: "pretreatment effluent"
      record_type: "discharge meter and sample"
      raw_fields: "discharged mass; pretreatment line; batch; treatment destination"
      collection_method: "Meter or weigh segregated phosphate pretreatment effluent and identify the treatment route."
      unit: "kg"
      frequency: "each discharge batch"
      temporal_coverage: "reporting period"
      site_scope: "pretreatment line"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "discharge log; sample; treatment receipt"
  calculation_rules:
    - id: per_body_inventory
      applies_to: "all inventory rows"
      rule: "Sum attributable exchange quantities in the reporting period and divide by the number of accepted bodies of the same configuration; keep each exchange in its row unit."
      inputs:
        - "raw records"
        - "accepted body count"
        - configuration
        - "applicable collection protocol"
      output: "exchange per one accepted finished unit"
      source_ids:
        - edag-silverado-body-lca-2018
    - id: mass_reconciliation
      applies_to: "steel_sheet, aluminium_sheet, steel_offcuts, body_output"
      rule: "Reconcile material input, documented internal returns, offcuts and measured net body mass for the declared configuration; investigate any unexplained difference rather than forcing balance."
      inputs:
        - cp_sheet
        - cp_scrap
        - cp_mass
      output: "reconciliation record"
      source_ids:
        - edag-silverado-body-lca-2018
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all flows"
      requirement: "Declare body configuration, coating state and the physical identity of each material, fuel and waste stream."
      evidence: "accepted body record; material specification; treatment ticket"
    - id: dq_mass
      applies_to: "body_output"
      requirement: "Use calibrated net mass M for the accepted body; do not substitute whole-vehicle or packaged mass."
      evidence: "scale calibration; acceptance record"
    - id: dq_time
      applies_to: "all foreground records"
      requirement: "Use a common reporting period and reconcile production counts, meters, inventories and transfers."
      evidence: "dated ledgers and meter reads"
    - id: dq_coverage
      applies_to: "coating route"
      requirement: "Explain omitted coating layers, treatment chemicals, direct emissions or waste streams and collect them as separate exchanges when material."
      evidence: "recipe; permit; waste log; completeness check"
validation_rules:
  - rule_id: validate_reference
    applies_to: "body_output"
    rule: "Confirm one accepted body with measured M kg and the same configuration and coating state across reference and inventory."
    source_ids:
      - edag-silverado-body-lca-2018
  - rule_id: validate_boundary
    applies_to: "body versus vehicle"
    rule: "Reject datasets that include complete-vehicle assembly, chassis, engine or downstream use inside the body reference."
    source_ids:
      - un-cpc3-notes-2025
      - edag-silverado-body-lca-2018
  - rule_id: validate_conditions
    applies_to: "conditional rows"
    rule: "Require route evidence for aluminium sheet, coating water, basecoat, oven gas and effluent when those rows are included; absent routes are disclosed."
    source_ids:
      - edag-silverado-body-lca-2018
      - epa-auto-ria-2004
  - rule_id: validate_records
    applies_to: "all rows"
    rule: "Match each amount to a dated protocol record, check unit and direction, and disclose unresolved flow UUIDs and missing upstream datasets."
    source_ids:
      - edag-silverado-body-lca-2018
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after review"
  downstream_use: "Body input to a foreground vehicle assembly process or lifecyclemodel"
  allowed_use: "Matching body type, material route, configuration, factory geography and coating state"
  excluded_use: "Whole-vehicle reference; unqualified substitution between coated and uncoated bodies; unsupported generic industry benchmark"
  required_metadata: "body model; configuration; material and joining route; coating state and recipe; factory; period; measured M; source and treatment routes"
  required_quality_disclosure: "meter and mass evidence; allocation keys; supplier dataset coverage; unresolved flow identities; omitted emissions and coating chemicals"
  update_trigger: "changed body design, material mix, coating recipe, supplier route, site technology or reporting period"
