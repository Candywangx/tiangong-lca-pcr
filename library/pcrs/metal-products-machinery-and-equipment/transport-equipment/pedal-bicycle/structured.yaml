allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared factory resources"
    rule: "First directly attribute configured net issues, metered electricity, coating batches, assembly and acceptance jobs, including rework. For inseparable resources require measured causal machine/fixture occupancy and actual load or another documented physical driver: share = order driver / sum of covered order drivers. Retain full period and denominator. Equal bicycle counts, catalogue masses, paint colour count or rider capacity are not default allocation rules."
    source_ids: []
  - rule_id: allocation_tests
    applies_to: "type qualification and production acceptance"
    rule: "Distinguish destructive qualification/prototype units from saleable accepted bicycles. Attribute per-unit production checks directly; shared type-test burdens require documented actual product applicability and causal allocation, alternatives and sensitivity. Exclude independent R&D; do not include destroyed test-unit mass in accepted output. Purchased test service and its contained electricity cannot both represent the same resource."
    source_ids:
      - cpsc-bicycle
  - rule_id: allocation_recovery
    applies_to: "offcuts, rejects and rework"
    rule: "Document actual waste versus saleable co-product, destination and period mass balance. Internal rework stays with accepted production. Recyclability alone does not justify avoided-primary-steel, disposal or substitution credits. Any actual co-product allocation requires declared method, causal/economic originals and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "accepted physical weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M; installed BOM; complete-bicycle scale reading; fixture tare; pedals and inflated-tyre state; detached integral parts; calibration and uncertainty; signed release"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared bicycle acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "actual calibrated physical weighing, measured tare and configured integral-part reconciliation"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "serial/configuration; exact exchange/specification; net issues/returns/stocks; component containment; kg; metered kWh; waste destination; emission method; shared driver; test phase"
      collection_method: "Read cutting/brazing/alignment job, supplier specifications, net issues and actual heat meters"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original specifications/calibrations, bills/issues, meters, acceptance and transfer records"
    - protocol_id: cp_finishing
      process_id: "finishing"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "serial/configuration; exact exchange/specification; net issues/returns/stocks; component containment; kg; metered kWh; waste destination; emission method; shared driver; test phase"
      collection_method: "Read coating batch/SDS, cleaning and cure job, water/energy meters, solvent balance and waste-transfer originals"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original specifications/calibrations, bills/issues, meters, acceptance and transfer records"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "serial/configuration; exact exchange/specification; net issues/returns/stocks; component containment; kg; metered kWh; waste destination; emission method; shared driver; test phase"
      collection_method: "Read serial-linked BOM and component supply completeness, net issues/returns, adjustment jobs and meters"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original specifications/calibrations, bills/issues, meters, acceptance and transfer records"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "serial/configuration; exact exchange/specification; net issues/returns/stocks; component containment; kg; metered kWh; waste destination; emission method; shared driver; test phase"
      collection_method: "Read actual market/type plan, production acceptance reports, serial release, scale calibration and net weighing originals"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original specifications/calibrations, bills/issues, meters, acceptance and transfer records"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "inventory"
      record_type: "actual stage exchange records"
      raw_fields: "serial/configuration; exact exchange/specification; net issues/returns/stocks; component containment; kg; metered kWh; waste destination; emission method; shared driver; test phase"
      collection_method: "Read actual packing bills, issues/returns and detached integral-part reconciliation"
      unit: "kg for Mass rows; MJ for electrical-energy rows"
      frequency: "each accepted unit and actual production batch"
      temporal_coverage: "actual manufacturing and acceptance period"
      site_scope: "declared factory/subcontractor gates"
      aggregation_rule: "attribute measured period exchange / accepted units of the same configuration"
      quality_evidence: "original specifications/calibrations, bills/issues, meters, acceptance and transfer records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_provenance with current same-serial physical weighing. Include installed pedals, inflation and lubrication state and measured detached integral parts; exclude packing, rider/load and fixtures. Actual scale calibration/uncertainty and whole-unit/BOM reconciliation are prerequisites. No catalogue bicycle/frame weight, shipping gross mass or assumed part sum substitutes for M. Missing original measurement requires scientific/data review."
      evidence: "actual physical weighing, calibration, BOM and release originals"
    - id: quality_atomic
      applies_to: "every exchange"
      requirement: "Verify one physical or formulated identity, chemistry/concentration and supply route/completeness. Steel lug differs from weld wire, finished fork from generic bicycle parts, mineral oil from PAO and anhydrous IPA from disinfectant. Keep actual public reference property/unit, species and medium; unresolved identities remain specific rows with declared reasons."
      evidence: "actual drawings, supplier specification/SDS, receipts and verified flow records"
    - id: quality_acceptance
      applies_to: "cp_acceptance"
      requirement: "Declare actual market and product exemptions, assembly instructions and serial-linked production check criteria. Record mechanical alignment/steering, wheel retention/true, tyre seating, chain/derailleur motion, cable routing, rim-brake action, seating/pedals and required guards/reflectors. Separate qualification and destructive tests; CPSC US guidance is not a universal test schedule or global certification. Record failures and attributable rework."
      evidence: "actual market acceptance plan/component instructions, original reports and release; CPSC applicable US context only"
    - id: quality_balance
      applies_to: "material, water, solvent and electricity"
      requirement: "Reconcile period inputs with incorporation, measured returns/stock, rejects/waste and actually measured releases. Technical process water, wastewater treatment transfer and natural withdrawal are distinct. IPA-air release requires chemistry, immediate air/unspecified medium and a closed species balance or measured release; solvent issue is not emission. Record actual heat source and add each fuel/heat/abrasive/paint species exchange before data completion. No universal fuel, heating intensity or mandatory emission is inferred."
      evidence: "original batch/spec/SDS, stock/material/solvent balances, meters and transfers"
    - id: quality_coverage
      applies_to: "dataset and upstream links"
      requirement: "Distinguish measured, calculated, missing and demonstrated not_applicable. Audit all actual hardware beyond candidate cards, foreground gaps, supplier boundary mismatch, unresolved identities, allocations and uncertainty. Complete cradle-to-gate coverage requires verified compatible upstream links; structural/finite measurement pass does not establish actual data, safety or methodology approval."
      evidence: "actual complete BOM/process map and transparent data gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and accepted output"
    rule: "Require positive current same-configuration measured M with cp_mass. Exact reference product name equals finished_bicycle; if UUID absent, register that exact row in unresolved_flow_identities. Integral pedals, tyres and delivered detached parts are reconciled once; no packaging/rider mass."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Verify ordered identical lower-case row/rule/protocol IDs in both languages and generated projection, accepted-unit q_item, M kg, explicit normalize_mass and matching denominators. Public quantity/area/energy properties must never be relabelled as Mass."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "process map and BOM"
    rule: "Audit received versus fabricated frame/fork and supplier-contained coating/parts, complete-wheel and crankset containment, outsourced versus direct resources, acceptance versus qualification, all actual missing exchanges and emissions evidence. Missing actual factory records or unresolved applicability requires review; candidate cards alone do not establish completeness."
    source_ids: []
  - rule_id: validate_use
    applies_to: "dataset use"
    rule: "Disclose exact model/configuration, manufacturing gates, mass evidence, data gaps, allocation/upstream compatibility and review state. Equal mass is not equal riding performance, lifetime or transport service. Finite check is not scientific approval, publication or market safety certification."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual-data completion and review"
  downstream_use: "Configured bicycle manufacturing input into a separately bounded bicycle lifecycle model"
  allowed_use: "Compare compatible manufacturing gates/configurations and upstream links per kg; disclose different performance and mass state"
  excluded_use: "Exclude e-bikes, auxiliary-motor cycles, motorcycles, tricycles, tandems, recumbents, folding bicycles, cargo-specific multiwheel cycles, toys/sidewalk-specific designs, track-racing fixed-gear bicycles, suspension/disc-brake bicycles, welded aluminium/composite/titanium and other undeclared frame routes, frame-only kits, used/repair/remanufactured products, riding/transport services, rider food metabolism, route infrastructure, maintenance use and end of life."
  required_metadata: "manufacturer/model/serial; frame size, geometry, steel grade/tube dimensions, lug joints, rigid-fork specification and received-versus-fabricated scope; finish formulation/route; wheel/rim/hub completeness, pneumatic tyre/tube specification and measured inflation state; gear range and actual chain/crank/cassette/derailleur/controls; cable rim-brake configuration; steering/saddle/pedals, all integral reflectors/guards/fittings and installed lubrication; actual market/type and production acceptance plan; same-serial calibrated complete net mass M kg, measured tare and integral detached parts; manufacturing gate/site/period, supply completeness, allocation, upstream links, uncertainties and exclusions"
  required_quality_disclosure: "Measured/calculated/missing status, actual mass and acceptance provenance, omissions, unresolved identities/ranges, allocation and uncertainty; candidate and pending scientific review"
  update_trigger: "Actual steel/frame joining, wheel/brake/drivetrain configuration, supplied completeness, coating route, mass protocol, market acceptance, plant or upstream data changes"
data_sources:
  - id: "mercian-craft"
    type: "literature"
    reference: "[Mercian Our Craft](https://www.merciancycles.co.uk/our-craft)"
    used_for: "Headings Skilled/Traditional/Bespoke, Precision Brazing by Hand, Final Frame Details, and stove-enamel finishing: an actual manufacturer example of mitering/alignment, pinned lug brazing, shot blasting and staged paint cure. No universal fuel/alloy/coating chemistry, fixed curing duration, numerical resource demand, lifetime or product mass adopted. Actual foreground specifications govern."
  - id: "rivendell-sam"
    type: "literature"
    reference: "[Rivendell Sam Hillborne 2025](https://www.rivbike.com/products/frame-sam-hillborne-2025)"
    used_for: "FRAME, Frame Specification, BRAKES and LOOKS GOOD TO US: CrMo frame tubing, rim-brake compatibility, lug joints and crowned fork. This frameset page is configuration context, not complete-bicycle BOM/weight or acceptance evidence. No wheel-size/geometry, load, price, rider limit or lifetime adopted as a PCR constraint."
  - id: "cpsc-bicycle"
    type: "official_guidance"
    reference: "[CPSC Bicycles FAQ](https://www.cpsc.gov/FAQ/Bicycles)"
    used_for: "Purpose/definition/exemptions, general testing, assembly, braking, steering, pedals, chain, tyre/wheel/hub, frame/fork, seating, reflectors and instructions sections: US regulatory applicability and offered-for-sale/assembled condition. Use actual applicable market criteria and product exemptions; no numeric thresholds translated into universal production QA, net-M method or lifetime. This methodology is not certification."
