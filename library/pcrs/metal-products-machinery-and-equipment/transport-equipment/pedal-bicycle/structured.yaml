measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the actual accepted bicycle with suitable calibrated scale, measured fixture/tare, controlled installed-component list and serial release. Record pedal installation, tyre pressure/state, lubrication and all delivered integral parts. Reconcile component records against whole-bicycle measurement with uncertainty, scale resolution/date/operator and positive net M. Detached integral parts require measured records; catalogue estimates or a parts sum alone do not replace physical weighing."
  - id: energy_units
    applies_to: "each electricity row"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Use verified energy unit-group conversion 1 kWh = 3.6 MJ. Preserve actual electricity supply voltage and route, distinct from riding work, mass and fuel energy; no heating-value/density factor supplied."
