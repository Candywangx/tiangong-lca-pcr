  unresolved:
    evidence_needs:
      - Actual current lightweight/weight survey raw records, as-built
        hydrostatics/density/tank/add-remove measurements, signed net-configuration reconciliation
        and physical M are required; none supplied by this PCR. Acceptance-record interface alone is
        insufficient.
      - Actual hull grades/qualified welding/coating, complete BOM/supplier charge
        scope/refrigerant/engine mass and factory/launch/test measurements and causal allocation
        require foreground evidence.
      - Expand actual missing atomic BOM/service/chemical/resource/emission cards and
        upstream/transport/receiver links before completeness claims. Undated manufacturer
        architecture and historical NMA2020 procedure are limited evidence.
