allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared processes"
    rule: "First subdivide actual stock lots/nesting plans, job cards and stage meters by drawing/revision/alloy/temper. Shared machining uses demonstrated causal operation time and measured load/setup/idle records; cleaning uses actual cycle/load/chemistry records. Do not allocate aircraft service burdens to this part. A simple mass share requires a demonstrated causal relation and sensitivity, not an unsupported universal factor."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "offcuts chips and rejects"
    rule: "Consumed rejected stock and actual rework remain campaign inputs divided by accepted parts of the same configuration. Retained reusable plate is inventory, not waste; exported chips/offcuts require actual saleable co-product or waste classification. Document any co-product allocation basis and prices/physical relationship and sensitivity; never grant both avoided-metal recycling credit and saleable output benefit to the same mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "inspection"
      flow_role: "accepted complete rib"
      record_type: "calibrated complete-part net weighing"
      raw_fields: "model; configuration; serial; drawing/revision/lot; accepted net mass M; kg; tare; original readings; retained film; excluded tabs/fixtures/packing; accepted count"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each part or controlled same-drawing lot with actual representative individual readings"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and actual attributable stage/supply gates"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration, original tare/net readings and signed drawing-specific acceptance"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "specific stock and consumable inputs"
      record_type: "actual stock issue/return and consumption"
      raw_fields: "alloy/temper/stock lot; drawing/nesting/blank geometry; actual stock kg; named formulation/CAS/assay; supplied/concentrate mixture; issue/return/stock change; concentration; accepted count"
      collection_method: "Measure each actual attributable net input kg including consumed rejects/rework; reconcile received/issued/returned stock and usable retained offcut. Record actual chemical concentration and performed operation, and fresh makeup versus recirculation. Supplier grade/temper and local fluids are not invented from product marketing."
      unit: "kg"
      frequency: "each receipt/issue/return and actual campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and actual attributable stage/supply gates"
      aggregation_rule: "actual attributable input kg / accepted units of the same configuration"
      quality_evidence: "certified stock/drawings, calibrated weights/stock balances and SDS"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "actual stage electricity"
      record_type: "actual user-side meter records"
      raw_fields: "stage; meter kWh; actual period; provider/voltage/geography; actual causal shared load; accepted count"
      collection_method: "Read calibrated user-interface stage meters and attribute actual cutting/machining/wash/dry/metrology/idle/rework electricity using current causal records. Convert kWh to MJ by3.6 MJ/kWh before per-unit collection; rated spindle power is not actual campaign energy."
      unit: "MJ"
      frequency: "actual representative campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and actual attributable stage/supply gates"
      aggregation_rule: "actual attributable electricity MJ / accepted units of the same configuration"
      quality_evidence: "original meter/calibration, causal load and provider evidence"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "actual named exported waste"
      record_type: "export weighing composition and receiver records"
      raw_fields: "named waste; alloy/lot; dry/wet kg; entrained liquid; composition; receiver; retained offcut/reuse/export; accepted count"
      collection_method: "Measure each actually exported segregated waste kg with actual composition/receiver and dry-metal versus wet-liquid reconciliation. Usable stock retained for documented work is not discarded waste. Collected liquid is a receiver-bound technosphere waste, not untreated elementary water discharge."
      unit: "kg"
      frequency: "each export and actual campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and actual attributable stage/supply gates"
      aggregation_rule: "actual exported waste kg / accepted units of the same configuration"
      quality_evidence: "original weights, analysis, actual contracts and receiver manifests"
    - protocol_id: cp_emission
      process_id: "cleaning"
      flow_role: "conditional IPA air release"
      record_type: "compound-specific sampling or closed solvent balance"
      raw_fields: "CAS; actual air submedium; concentration; airflow/time; issue/recovery/residue/retention; detection/uncertainty; accepted count"
      collection_method: "Quantify actual post-control CAS67-63-0 outdoor release by matched sampling or documented closed issue/recovery/residue/retention balance. Preserve no-operation/unmeasured/below-detection distinctions; no complete-evaporation or generic VOC factor."
      unit: "kg"
      frequency: "actual representative solvent/control period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and actual attributable stage/supply gates"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling/calibration/lab records and solvent balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "part drawing and acceptance"
      record_type: "controlled material/part production records"
      raw_fields: "part number/drawing/revision/serial; alloy/temper/stock lot/grain; actual machining/wash route; actual inspection scope/results/calibration/disposition; uncoated state and missing later stages"
      collection_method: "Trace current approved stock certificate and drawing/job plan for this civil detail part. Record actually required dimensional, surface/cleanliness and any specifically required material/NDT inspection and disposition with methods and criteria from current controlled records. No universal NDT, fatigue test or threshold is inferred; declare later surface/assembly work separately."
      unit: "kg"
      frequency: "each drawing/material/lot/configuration change"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and actual attributable stage/supply gates"
      aggregation_rule: "qualifiers accompany each accepted same-configuration unit"
      quality_evidence: "signed stock/drawing/job/inspection and disposition records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_conversion
      applies_to: "period records"
      rule: "Attribute actual campaign stock/meter/export totals to one drawing/revision/alloy/temper configuration using current causal records; divide by actual accepted count to obtain q_item, retaining consumed rejects and rework in the numerator. Do not pool incompatible stock grades, geometries or later surface states silently."
      inputs:
        - cp_stock
        - cp_energy
        - cp_waste
        - cp_mass
      output: "q_item"
      source_ids: []
  data_quality_requirements:
    - id: mass_provenance
      applies_to: "cp_mass"
      requirement: "Weigh only after all included cleaning/drying and part acceptance in the declared delivered state. Positive M requires current actual calibrated individual complete-part weighing, capacity/resolution/calibration, original tare/net readings and signed drawing/configuration/serial. M excludes tabs removed before acceptance, fixtures and packaging. Independently reconcile attributable plate to accepted part kg, retained stock, dry offcut/chips and actual rejects with wet-liquid separation. CAD volume/density and nominal catalogue weight are checks, not substitutes for measured net M."
      evidence: "cp_mass; cp_stock; cp_waste; cp_configuration"
    - id: net_configuration
      applies_to: "finished_rib"
      requirement: "The reference is one clean monolithic uncoated detail part of the exact drawing/revision/alloy/temper and actual inspected condition. Include only actual permanent part material and documented retained film once; exclude fixtures, temporary tabs, coating/sealant, loose fasteners and packaging. Unperformed coating/NDT/assembly is disclosed, not passed by assumption. The constrained interface noun unit means one complete rib."
      evidence: "cp_mass; cp_configuration"
    - id: completeness_balance
      applies_to: "all exchanges"
      requirement: "Expand full actual jobs and supplier/utility records before a complete plant claim: actual saw lubricants, machining inserts and grinding media consumed, wash additives, compressed-air/heat providers, fixture wear, packaging/wipe media and extra waste fractions need their own specific exchanges. Reconcile plate nesting/stock/part/offcut/chips/rejects and all fluid issue/recovery/retention/waste/emissions without default yield. Link actual upstream/transport/receivers; disclose omissions, limits, uncertainty and allocation sensitivity."
      evidence: "cp_stock; cp_energy; cp_waste; cp_emission"
    - id: source_limits
      applies_to: "external sources"
      requirement: "Official Figeac material-removal descriptions and Airbus separate detail-part/section/final assembly descriptions support route/gate distinctions only. They do not certify this rib alloy, temper, drawing, bath chemistry, NDT requirement, actual throughput, yield or approved airworthiness. Current controlled foreground plans, actual weights and independent methodology review are required; no promotional machine count or aircraft supplier percentage is an inventory factor."
      evidence: "figeac-metal-processing; airbus-production-gates"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Verify exact reference product name equals finished_rib, complete uncoated monolithic wrought-plate civil wing rib and positive physical M kg with current accepted drawing/state. Blank candidate reference UUID is a declared identity gap, not licence to assign a composite, coated part or group of UAV materials."
    source_ids: []
  - rule_id: validation_process
    applies_to: "all_processes"
    rule: "Verify certified plate lot/temper/grain, actual stock/job sequence and approved cleaning/inspection with original results/disposition. Inspect only actually required NDT/material checks; no inferred default limits. Subsequent surface protection/structural assembly requires an independently supported extension; part conformity does not establish complete-aircraft approval."
    source_ids:
      - figeac-metal-processing
      - airbus-production-gates
  - rule_id: validation_identity
    applies_to: "flow rows"
    rule: "Verify state100 public original type, reference property/group/unit, material grade/route/state, medium/submedium and official bilingual names. Preserve Number/Area/Volume/Energy rather than rewrite Mass; use actual supported conversion only for a matching identity. Technosphere water and collected liquor are not resource water or direct effluent; immediate outdoor IPA is not bought solvent or indoor/long-term release."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "claims"
    rule: "PCR mechanical pass does not establish actual measured inventory, full cradle-to-gate coverage, scientific approval, airworthiness or fatigue/service equivalence. Disclose remaining identity/operation/measurement/BOM/utility/link and independent evidence gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured civil-aircraft aluminium structural detail-part stock-to-uncoated machining acceptance foreground; heading does not imply publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same drawing/material/state structural-detail-part manufacture by actual measured M, linked to actual plate and process providers and separately declared later production"
  excluded_use: "Whole-aircraft/flight/airworthiness, fatigue-life comparisons, painted/composite/assembled finished structures and repair/end-of-life service"
  required_metadata: "Part/drawing/revision/serial/lot, alloy/temper/thickness/grain and stock certificate, exact geometry/completeness/uncoated state, actual operations/inspection/acceptance, net M kg original weights, nesting/stock/waste/fluid balance, site/period/provider, allocation and upstream/later-stage/receiver links"
  required_quality_disclosure: "Identity/source/operation/measurement/completeness/link gaps, actual rejects/rework/retained offcut/recovery, detection/uncertainty/cut-offs and allocation sensitivity"
  update_trigger: "Drawing/revision/stock/alloy/temper/geometry, machining/cleaning/inspection, accepted net state, later surface/assembly, plant/provider/period or dispatch-packaging changes"
data_sources:
  - id: "figeac-metal-processing"
    type: "handbook"
    reference: "FIGEAC AERO, Metal processing, undated official page, Our specialised activity: metal machining by material removal; High-technology specialised machines; Continuously improving machining skills. https://www.figeac-aero.com/en/metal-processing"
    used_for: "Aluminium aerospace structural parts and material-removal machining from stock under customer specifications; no numeric yields, actual alloy/temper/chemical or mandatory test transferred."
  - id: "airbus-production-gates"
    type: "handbook"
    reference: "Airbus, Production, undated official page, Major components and aerostructures production. https://www.airbus.com/en/products-services/commercial-aircraft/the-life-cycle-of-an-aircraft/production"
    used_for: "Distinguishes detail-part manufacture, structural/section assembly and final aircraft assembly; no supplier percentage or universal part process recipe adopted."
