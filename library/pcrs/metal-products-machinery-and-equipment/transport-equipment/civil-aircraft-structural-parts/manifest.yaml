      reason_code: identity_not_established
      explanation: Public carbonate6827e314 explicitly uses hydrometallurgical
        recycling route;2099dae8 specifies95% natural-alkali processing and
        conflicting organic-acid classification. Actual anhydrous reagent
        supplier route/assay is not established; do not assume purity/state or
        default this conditional wash chemical.
    - row_id: ipa_cleaner
