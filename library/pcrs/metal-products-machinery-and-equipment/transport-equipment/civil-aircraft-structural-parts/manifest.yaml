review_metadata:
  semantic_boundary_decision: Create narrower monolithic civil-aircraft wing-rib
    detail-part machining from certified wrought aluminium plate, ending at
    clean uncoated drawing-specific acceptance. Existing aluminium plate/profile
    PCRs supply upstream material gates, not actual rib geometry/grain/lot
    traceability, machining removal, part inspection and net acceptance.
    Aircraft/engine/ground-equipment records have different product boundaries.
    Exclude later coating/peening/heat treatment, composites, other metals,
    assembled structures, spacecraft/military-only routes and service use. These
    are explicit author-selected route restrictions requiring current
    drawing/stock/work evidence, not industry necessities; old scaffold stays
    read-only and no mapping is accepted.
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
