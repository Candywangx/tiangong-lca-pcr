  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "The original current vessel acceptance mass record must implement mass_record_provenance. Retain actual physical lightship/weight inspection, observable method inputs/calibration and a signed item-level reconciliation to delivered net configuration; reconcile independently weighed installed modules and fluids. A catalogue or unexplained displacement/tonnage record is insufficient. Missing method, uncertain correction or configuration change prevents a complete quantitative dataset; resolve by new measurement/reconciliation, never an assumed weight."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile drawings/BOM and installed hull/machinery/pump drive, piping/electrical, control/safety/navigation and actual service-fluid masses, supplier scope and detached delivered parts. Add all actual missing components before completion; received complete modules count once."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, commissioning consumed versus retained fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_dredging
      applies_to: "dredging; acceptance"
      requirement: "Retain actual hull/module drawings and supplier assembly inclusions, cutter/ladder/pump/wear-material design, positioning arrangement, installed pipe/hydraulic circuits and measured mass. Retain afloat trial conditions: temporary versus retained contents, test medium composition/particle distribution, circulation/makeup/recovery/waste transfer, cutter and positioning actions, actual pump pressures/flow/load, duration and calibrated meters. No brochure soil-density/pump-output curve, nominal power or default test duration converts to exchange quantities. Dismantled delivery reconciles all integral modules to the same accepted net M; external pipelines remain excluded. Missing actual test/mass balances are scientific data gaps."
      evidence: "actual drawings, weighing and calibrated trial reports"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this vessel. PCR checking validates the declared relationship, not a real ship record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured steel-hulled diesel stationary cutter suction dredger and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational sediment/persons/fuel/fresh water/ballast and temporary loads, retain declared installed service fluids. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each atomic physical/chemical exchange, public reference property/unit group, route/state and supplier scope. Engine item count is not mass; a genset includes its engine once; CuO is not Cu2O paint; water supply is not effluent or resource withdrawal. Keep unsupported identity blank and add actual species/components before completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. Generic manufacturer certification does not certify this stationary cutter suction dredger; no universal numerical standard/test/load is adopted."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete steel-hulled diesel stationary cutter suction dredger foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching hull/pump drive/outfitting/coating, controlled net-mass scope, trial boundary, gate/site/period"
  excluded_use: "Operational dredging/excavation service or lifetime comparison, equal-mass capacity equivalence, other dredger architectures/materials and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model; hull serial/drawing revision; steel hull/module completeness; non-self-propelled diesel cutter-suction route; actual cutter/head drive, ladder, slurry pump/wear materials and onboard piping; spuds, winches, fixed-spud or carriage positioning; control/electrical/safety scope and retained working fluids; actual assembly/trial criteria and net delivery state; controlled positive M kg from current physical lightship/weight inspection with original measured inputs, calibration and signed correction balance; exclude external pipeline/booster/workboat, fuel/fresh water/ballast/persons, temporary test sediment/weights, protection and separate spares; actual site/period, supplier inclusions and gate"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Hull/pump drive/outfitting/coating, supplier modules, actual M evidence/corrections, trial state/boundary, manufacturing/acceptance regime, site/period changes"
data_sources:
  - id: "damen-csd350"
    type: "literature"
    reference: "[Damen CSD350](https://www.damen.com/vessels/dredging-and-dredging-equipment/cutter-suction-dredgers/csd350)"
    used_for: "Product-description and option paragraphs: dismountable modular architecture, cutter/pump and optional positioning/navigation packages. Undated publisher snapshot. No catalogue mass, power, depth, capacity, lifetime or manufacturing recipe adopted."
  - id: "ihc-beaver50-2023"
    type: "literature"
    reference: "[Royal IHC Beaver50 RevA110569933 July2023](https://www.royalihc.com/sites/default/files/documents/%E2%80%A2RIHC%20Dredging%20Productsheet%20Beaver%2050_110569933.pdf)"
    used_for: "PDF1–2: diesel cutter suction architecture, non-self-propelled model, pump/drive, hydraulic and positioning systems, assembly/afloat testing, detachable delivery and optional auxiliaries. Historical model example only; no present certificate, emissions compliance, recipe, nominal spud weight, fuel-consumption or pump-output factor adopted. Page2 curve limitations show performance dependence on material/site conditions."
  - id: "nma-lightship"
    type: "official_guidance"
    reference: "[NMA KS-0179-1E, Rev.07.01.2020](https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf)"
    used_for: "PDF/printed pp.5–7, sections3.1–3.4: ship identification, inspection state, completion/deduction weights, water density, tanks and draught/freeboard. Historical Norwegian method example; current actual vessel method and signed net-configuration corrections are required. No historical tank/trim thresholds or global legal requirement adopted. Retained original examined."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard, 2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2: historical allocation hierarchy only; require actual causal-driver evidence, no universal vessel allocation factor. Retained original examined."
