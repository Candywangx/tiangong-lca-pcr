  how_well: "Meet actual hull/module connection, pump/drive, cutter/ladder/positioning, hydraulic/electrical/safety and vessel-specific release criteria under documented test conditions. Equal mass does not establish equal soil type, dredging depth, pump output or service performance. No brochure capacity or power becomes a manufacturing factor."
