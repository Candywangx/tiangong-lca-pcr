      collection_method: "Collect material certificates/drawing revisions, weighed issues/returns/offcuts, actual forming/cutting operations and station meters."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared shipyard and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "originals, weighing, meters, supplier, trial, transfer and acceptance records"
    - protocol_id: cp_hull_join
