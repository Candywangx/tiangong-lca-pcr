review_metadata:
  scientific_review: pending
  semantic_boundary_decision: New complete steel-hulled diesel non-self-propelled
    stationary cutter suction dredger, including installed cutter/ladder/slurry
    pump/onboard piping/positioning/control systems. Narrower than CPC49319;
    excludes self-propelled and hopper/grab/bucket dredgers, floating
    cranes/docks, warships, drilling platforms, external discharge
    pipelines/boosters/workboats, operation/soil excavation service, repair and
    conversion. Existing ferry/ship-component PCRs have distinct product
    boundaries; no same complete cutter suction dredger material PCR found in
    this checkout.
  unresolved_flow_identities:
    - row_id: normal_hull_plate
      flow: Hot-rolled normal-strength certified shipbuilding steel plate
      reason: Public thick high-strength plate does not establish normal-strength
        shipbuilding grade/certification.
    - row_id: hull_profile
      flow: Hot-rolled steel ship-hull stiffener profile
      reason: Finished hull blocks and non-alloy Z-section candidates do not establish
        this stiffener grade/profile route.
    - row_id: solid_wire
      flow: Solid low-alloy steel gas-shielded welding wire
      reason: Self-shielded flux-cored wire cannot represent solid gas-shielded wire.
    - row_id: argon_mix
      flow: Argon/carbon-dioxide premixed welding shielding gas
      reason: Single CO2 identity does not establish premix composition.
    - row_id: weld_dust
      flow: Captured iron-oxide-rich hull-welding filter dust
      reason: Elemental airborne iron is not oxidized captured waste filter dust.
    - row_id: abrasive
      flow: Spherical cast-steel hull-blasting shot
      reason: Public shot/grit candidate has inconsistent non-ferrous ore
        classification and unresolved exact physical grade applicability.
    - row_id: epoxy_base
      flow: Formulated epoxy marine-coating base component
      reason: Pure DGEBA resin or generic coating does not establish formulated marine
        coating base.
    - row_id: epoxy_hardener
      flow: Polyamine marine-epoxy coating hardener formulation
      reason: Generic amine substances do not establish formulated marine-epoxy
        hardener.
    - row_id: cu2o_paint
      flow: Cuprous-oxide self-polishing marine antifouling paint formulation
      reason: CuO chemical/ore identity is not Cu2O formulated antifouling paint;
        refined chemical search still requires formulation identity.
    - row_id: spent_abrasive
      flow: Spent steel blasting shot with removed hull-coating residue
      reason: Generic spent abrasive does not establish this steel/paint-contaminated
        residue.
    - row_id: clean_effluent
      flow: Aqueous steel-hull cleaning effluent transferred for treatment
      reason: Discharged-to-water cleaning flow does not establish technosphere
        treatment transfer.
    - row_id: mineral_oil
      flow: Petroleum-fraction marine lubricating oil formulation
      reason: Public oil identity requires supplier formulation/state corroboration;
        no universal oil recipe.
    - row_id: coolant
      flow: Inhibited ethylene-glycol/water marine-engine coolant premix
      reason: Pure glycol or unspecified coolant does not establish inhibited marine
        engine premix.
    - row_id: test_diesel
      flow: Fossil low-sulphur marine diesel fuel supplied for commissioning
      reason: Fishing-vessel fuel-combustion identity is not supply; grade-unspecified
        diesel lacks low-sulphur fossil provenance.
    - row_id: spent_oil
      flow: Spent petroleum lubricating oil transferred for treatment
      reason: Regenerated waste-oil product route is not untreated spent-oil treatment
        transfer.
    - row_id: finished_machine
      flow: Accepted complete steel-hulled diesel stationary cutter suction dredger
      reason: Public CPC-wide other-vessels identity does not isolate cutter-suction
        non-self-propelled diesel configuration; retain exact reference-output
        identity pending review.
    - row_id: pump_drive
      flow: Complete diesel dredge-pump reduction-and-clutch assembly
      reason: Public candidates require actual component scope, hydraulic
        formulation/state and supplier route verification.
    - row_id: hydraulic_unit
      flow: Complete oil-hydraulic cutter/positioning power unit
      reason: Direct public hydraulic-power-unit candidate is energy-referenced
        metal-forming-press subsystem, not verified installed dredger hydraulic
        assembly; no energy-to-module-mass conversion evidence.
    - row_id: engine_cooling
      flow: Complete water-cooled diesel-engine heat-exchanger assembly
      reason: Public candidates require actual component scope, hydraulic
        formulation/state and supplier route verification.
    - row_id: cutter
      flow: Complete rotary dredging cutter-head assembly
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: ladder
      flow: Complete steel cutter-suction dredger ladder assembly
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: slurry_pump
      flow: Complete abrasion-resistant centrifugal dredging-slurry pump
      reason: Direct public Pump is Mass-referenced but broad fluid-pump scope lacks
        dredge slurry abrasion/wear-material and supplier assembly completeness;
        preserve exact component pending applicability review.
    - row_id: onboard_pipe
      flow: Finished steel onboard dredge-slurry pipe spool
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: spud
      flow: Finished steel dredger positioning spud
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: winch
      flow: Complete hydraulic dredger swing winch
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: wire_rope
      flow: Finished steel dredger swing wire rope
      reason: Direct public rope candidate is textile knotted netting, not
        manufactured steel swing rope.
    - row_id: anchor
      flow: Finished steel dredger swing anchor
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: spud_carriage
      flow: Complete steel dredger spud-carriage assembly
      reason: Generic metal/pump/machinery candidates do not by name alone establish
        this finished dredger component and supplier completeness.
    - row_id: cable
      flow: Insulated-copper marine electrical cable
      reason: Generic cable/harness candidates do not establish marine conductor
        insulation/completeness.
    - row_id: starter_battery
      flow: Filled lead-acid marine starter battery
      reason: Starting-type lead battery public original is Net calorific value
        referenced with BESS commentary; no defensible collected energy/property
        conversion for supplied filled marine starter mass.
    - row_id: window
      flow: Laminated safety-glass marine window pane
      reason: Generic glass candidate lacks laminated marine pane specification.
    - row_id: bilge_pump
      flow: Finished marine centrifugal bilge-water pump
      reason: Generic pumps need marine bilge design/completeness verification.
    - row_id: bilge_pipe
      flow: Finished carbon-steel marine bilge pipe
      reason: Generic pipe candidates do not establish marine bilge-pipe
        form/treatment.
    - row_id: control_cabin
      flow: Complete steel dredger control-cabin module
      reason: Verify actual fitted module/electrical inclusions rather than generic
        building cabin.
    - row_id: pressure_sensor
      flow: Complete dredge-slurry pressure-transducer assembly
      reason: Generic electronics require wetted-medium rating and supplier scope
        verification.
    - row_id: test_quartz
      flow: Silicon-dioxide quartz sand for commissioning tests
      reason: Direct public silica-sand candidate has 0.020–3.350mm particle limit and
        discordant washing/magnetic-separation bilingual routes; actual quartz
        purity and compatible supply route are unresolved.
    - row_id: quartz_test_slurry
      flow: Aqueous quartz-sand commissioning slurry transferred for treatment
      reason: Waste treatment transfer composition is not water-resource or
        environmental sediment emission.
  unresolved_quantity_ranges:
    - No current actual same-vessel net M or independent boundary-compatible
      manufacture intensity ranges are provided; later foreground records must
      establish amounts and QA limits.
  evidence_limitations:
    - PCR describes required current acceptance-mass provenance; no actual ship
      acceptance/weight record has been obtained or certified. Finite
      measurement consistency does not verify actual ship mass or scientific
      approval.
    - Historical 2020 Norwegian procedure is a limited method example, not
      confirmed current universal law. Undated shipyard and
      equipment-manufacturer architecture statements do not prove actual
      configuration, chemical recipe, capacity or certification.
    - No universal recipe, grade approval, vessel mass, lifetime, trial fuel use
      or emission factor adopted. Every actual BOM/species/service must be
      added; missing supplier upstream prevents complete cradle-to-gate claims.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  identity_rejections:
    - uuid: 7927c68b-2426-43a1-861c-3c159ec02563
      row_id: hydraulic_unit
      reason: Energy-referenced metal-forming-press HPU does not establish configured
        dredger hydraulic module; no material-mass conversion evidence.
    - uuid: f854fcea-1b30-4b25-8dfb-7829bcfb51cd
      row_id: starter_battery
      reason: Starting battery has energy reference property and conflicting BESS
        commentary; no physically supported collected conversion to filled
        component mass.
    - uuid: e3759580-0bc6-4410-a0fe-f8b239ba715d
      row_id: wire_rope
      reason: Textile netting is not steel swing rope.
    - uuid: 854527a0-1a8f-43af-b7c5-8c20d22e61ff
      row_id: test_quartz
      reason: Particle range and discordant bilingual wash/magnetic routes do not
        establish actual quartz commissioning medium.
