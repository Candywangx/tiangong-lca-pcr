  semantic_boundary_decision: "The existing PCR ID is retained and its existing methodology upgraded
    in place. The scoped CPC mapping is accepted; scientific approval, translation review and
    publication retain their separately recorded states. Classification rationale: The complete
    manual wheelchair fits 8713; mere frames, ordinary carts and wheelchair services are not the
    reference output. Historical author assessment:
    docs/reviews/pcr149-original-ids-20261127/49922.json."
  reference_identity_basis: Reference product and finished_machine exact name agree. State100 frame
    candidates represent frame-only coated/uncoated intermediates with class48171/48172, cannot
    represent complete wheelchair. Blank reference identity precisely registered;
    candidate/authored_methodology fallback applies. Net actual M kg supported independently, not
    catalogue chair weight/patient load.
  evidence_limitations: "Drive undated SilverSport2 product case supports powder-coated steel
    frame/vinyl/specific wheel and support configuration only. INTCO2026-09-03 component framework
    supports exact configuration/joins/folding/lock/acceptance controls but not numeric current
    standard requirements. RESNA2004 historical design describes welded tube/flat stock whereas
    prototype is brazed: neither universal joint recipe/grade/dimensions/ISO test cycles nor life
    adopted. Actual current released drawings and physical records govern."
  unresolved_flow_identities:
    - row_id: bracket_sheet
      selected_flow: Cold-rolled low-carbon steel wheelchair axle-bracket sheet
      reason: Cold Rolled Plate Chinese alloy rod/classification conflict; Steel Sheet Chinese silver
        plate/class41239 alloy further-worked scope does not establish unalloyed bracket sheet.
    - row_id: weld_wire
      selected_flow: Solid carbon-steel welding filler wire
      reason: Direct Solid Wire is copper electrical conductor/class41513 building power transmission, not
        steel welding filler. Refined flux-cored/strip candidates do not establish solid
        carbon-steel filler.
    - row_id: shield_argon
      selected_flow: Pure argon welding shielding gas
      reason: Initial/refined bounded30 candidates did not establish supplied pure welding argon;
        pharmaceutical and combined welding-service candidates not gas product.
    - row_id: powder_residue
      selected_flow: Unusable dry polymer powder-coating residue
      reason: Direct Waste powder coating paint reference property Aluminium content, not total dry
        formulated-polymer waste Mass; no aluminium content measured conversion available and no
        property rewritten.
    - row_id: rear_wheel
      selected_flow: Finished composite wheelchair rear wheel with solid polyurethane tyre and handrim
      reason: Refined candidates wind-turbine hubs/rotors or motor-car aluminium hub not wheelchair wheel
