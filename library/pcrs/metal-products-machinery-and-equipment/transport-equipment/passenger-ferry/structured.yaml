  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "The original current vessel acceptance mass record must implement mass_record_provenance. Retain actual physical lightship/weight inspection, observable method inputs/calibration and a signed item-level reconciliation to delivered net configuration; reconcile independently weighed installed modules and fluids. A catalogue or unexplained displacement/tonnage record is insufficient. Missing method, uncertain correction or configuration change prevents a complete quantitative dataset; resolve by new measurement/reconciliation, never an assumed weight."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile drawings/BOM and installed hull/machinery/propulsion, piping/electrical, passenger/safety/navigation and actual service-fluid masses, supplier scope and detached delivered parts. Add all actual missing components before completion; received complete modules count once."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, commissioning consumed versus retained fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this vessel. PCR checking validates the declared relationship, not a real ship record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured steel-hulled diesel ferry and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational cargo/persons/fuel/fresh water/ballast and temporary loads, retain declared installed service fluids. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each atomic physical/chemical exchange, public reference property/unit group, route/state and supplier scope. Engine item count is not mass; a genset includes its engine once; CuO is not Cu2O paint; water supply is not effluent or resource withdrawal. Keep unsupported identity blank and add actual species/components before completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. Generic manufacturer certification or an IMO overview does not certify this ferry; no universal numerical standard/test/load is adopted."
    source_ids:
      - imo-surveys
published_dataset_profile:
  dataset_role: "Configured complete steel-hulled diesel ferry foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching hull/propulsion/outfitting/coating, controlled net-mass scope, trial boundary, gate/site/period"
  excluded_use: "Passenger/freight service or lifetime comparison, equal-mass capacity equivalence, other propulsion/materials and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model; hull serial and drawing revision; ferry/passenger or RoPax configuration, principal dimensions and intended service area; hull/superstructure material grades, thickness and block supplier completeness; mechanical-diesel or diesel-electric propulsion architecture, engine/genset/thruster scope; installed piping/electrical/passenger/safety equipment and actual certificates if claimed; coating base/hardener/antifouling formulation; positive net M in kg from current controlled acceptance mass records; original actual lightweight/weight inspection, method/calibration and configuration correction ledger; exclusion of passengers/crew, cargo/vehicles, consumable fuel/fresh water/ballast, temporary testing loads, removable protection and delivery fixtures; installed service-fluid and detached integral delivered-part masses; commissioning scope and fuel origin; actual manufacturing/outsourcing, shipyard/site/period, delivery gate and supplier upstream linkage"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Hull/propulsion/outfitting/coating, supplier modules, actual M evidence/corrections, trial state/boundary, manufacturing/acceptance regime, site/period changes"
data_sources:
  - id: "remontowa-ferries"
    type: "literature"
    reference: "[Remontowa Shipbuilding: Ferries, 2021 file](https://remontowa-rsb.pl/wp-content/uploads/2018/08/FERRIES-2021_Druk-2.pdf)"
    used_for: "PDF p.5 (printed 3), General Description: separate outfitting disciplines; p.7 (printed 5) FINNØY and p.12 (printed 10) FILLA: historical diesel-electric versus mechanical propulsion and passenger/safety equipment examples. No rated powers, counts, dimensions, tank capacities, tonnage or weight adopted as factors/current requirements."
  - id: "remontowa-steel"
    type: "literature"
    reference: "[Remontowa: Steel cutting for car-passenger ferry](https://remontowa-rsb.pl/en/aktualnosci/steel-cutting-for-the-construction-of-car-passenger-ferry/)"
    used_for: "Opening paragraph reports steel cutting on 10 April 2015. Historical fabrication fact only; dual-fuel product is outside this PCR propulsion scope and supplies no fuel/weight/yield factor."
  - id: "nma-lightship"
    type: "official_guidance"
    reference: "[NMA KS-0179-1E, Rev.07.01.2020](https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf)"
    used_for: "PDF/printed pp.5–7, sections 3.2–3.4: actual survey state, water density, tank contents and draught/freeboard records. Historical Norwegian measurement-method example only; actual current vessel records/approved method must establish corrected net M. No historical numerical tank/trim thresholds or global legal requirement adopted."
  - id: "imo-surveys"
    type: "official_guidance"
    reference: "[IMO: Surveys, Verifications and Certification](https://www.imo.org/en/ourwork/iiis/pages/survey-verification-certification.aspx)"
    used_for: "Opening survey/certification paragraphs: flag-administration or authorized-organization responsibility. Overview only, not full applicable regime or this ferry certificate; no universal statutory test threshold inferred."
