review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "Narrower CPC 49311 boundary: new complete steel-hulled diesel passenger ferries, mechanical or diesel-electric with declared RoPax variants; exclude cruise/excursion, other hull materials, alternative/dual-fuel/traction-hybrid propulsion and operational services. Existing material motor-vehicle body method lacks hull/outfitting and actual lightship/acceptance-mass methodology. Legacy scaffold remains read-only; no classification acceptance claimed."
  unresolved_flow_identities:
    - row_id: "normal_hull_plate"
      flow: "Hot-rolled normal-strength certified shipbuilding steel plate"
      reason: "Public thick high-strength plate does not establish normal-strength shipbuilding grade/certification."
    - row_id: "hull_profile"
      flow: "Hot-rolled steel ship-hull stiffener profile"
      reason: "Finished hull blocks and non-alloy Z-section candidates do not establish this stiffener grade/profile route."
    - row_id: "solid_wire"
      flow: "Solid low-alloy steel gas-shielded welding wire"
      reason: "Self-shielded flux-cored wire cannot represent solid gas-shielded wire."
    - row_id: "argon_mix"
      flow: "Argon/carbon-dioxide premixed welding shielding gas"
      reason: "Single CO2 identity does not establish premix composition."
    - row_id: "weld_dust"
      flow: "Captured iron-oxide-rich hull-welding filter dust"
      reason: "Elemental airborne iron is not oxidized captured waste filter dust."
    - row_id: "abrasive"
      flow: "Spherical cast-steel hull-blasting shot"
      reason: "Public shot/grit candidate has inconsistent non-ferrous ore classification and unresolved exact physical grade applicability."
    - row_id: "epoxy_base"
      flow: "Formulated epoxy marine-coating base component"
      reason: "Pure DGEBA resin or generic coating does not establish formulated marine coating base."
    - row_id: "epoxy_hardener"
      flow: "Polyamine marine-epoxy coating hardener formulation"
      reason: "Generic amine substances do not establish formulated marine-epoxy hardener."
    - row_id: "cu2o_paint"
      flow: "Cuprous-oxide self-polishing marine antifouling paint formulation"
      reason: "CuO chemical/ore identity is not Cu2O formulated antifouling paint; refined chemical search still requires formulation identity."
    - row_id: "spent_abrasive"
      flow: "Spent steel blasting shot with removed hull-coating residue"
      reason: "Generic spent abrasive does not establish this steel/paint-contaminated residue."
    - row_id: "clean_effluent"
      flow: "Aqueous steel-hull cleaning effluent transferred for treatment"
      reason: "Discharged-to-water cleaning flow does not establish technosphere treatment transfer."
    - row_id: "reduction"
      flow: "Finished marine propulsion reduction gearbox"
      reason: "Wind-turbine gearbox does not establish marine reduction hardware."
    - row_id: "shaft"
      flow: "Finished steel marine propeller shaft"
      reason: "Wind-turbine main shaft does not establish marine shaft design."
    - row_id: "propeller"
      flow: "Finished nickel-aluminium-bronze marine propeller"
      reason: "Nickel metal/bronze strip cannot stand for a finished nickel-aluminium-bronze propeller."
    - row_id: "diesel_genset"
      flow: "Finished marine diesel electrical generating set"
      reason: "Wind generator and diesel combustion flows are not a finished marine genset."
    - row_id: "propulsion_motor"
      flow: "Finished marine electric propulsion motor"
      reason: "Generic small/traction motor scope does not establish marine propulsion motor rating/design."
    - row_id: "bilge_pump"
      flow: "Finished marine centrifugal bilge-water pump"
      reason: "Generic pumps need marine bilge design/completeness verification."
    - row_id: "bilge_pipe"
      flow: "Finished carbon-steel marine bilge pipe"
      reason: "Generic pipe candidates do not establish marine bilge-pipe form/treatment."
    - row_id: "cable"
      flow: "Insulated-copper marine electrical cable"
      reason: "Generic cable/harness candidates do not establish marine conductor insulation/completeness."
    - row_id: "starter_battery"
      flow: "Filled lead-acid marine starter battery"
      reason: "Battery charging/discharging activity is not finished marine starter supply."
    - row_id: "passenger_seat"
      flow: "Finished upholstered passenger-ferry seat"
      reason: "Furniture candidates do not establish fitted marine passenger-seat scope."
    - row_id: "window"
      flow: "Laminated safety-glass marine window pane"
      reason: "Generic glass candidate lacks laminated marine pane specification."
    - row_id: "radar"
      flow: "Finished marine navigation radar assembly"
      reason: "Navigation-electronics candidates need exact radar scope verification."
    - row_id: "liferaft"
      flow: "Packed inflatable marine liferaft"
      reason: "Generic boats are not packed inflatable marine lifesaving rafts."
    - row_id: "vehicle_ramp"
      flow: "Steel hydraulically actuated ferry vehicle-loading ramp assembly"
      reason: "Generic fabricated steel cannot establish complete ferry ramp/actuator scope."
    - row_id: "coolant"
      flow: "Inhibited ethylene-glycol/water marine-engine coolant premix"
      reason: "Pure glycol or unspecified coolant does not establish inhibited marine engine premix."
    - row_id: "test_diesel"
