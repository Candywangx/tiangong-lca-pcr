review_metadata:
  semantic_boundary_decision: Create narrower complete configured civil
    battery-electric quadrotor manufacturing integration method using supplied
    prewired carbon-composite frame/arm/gear and onboard
    power/control/communications modules, one specified supplied installed
    flight pack and physical net acceptance. Existing
    battery/motor/wiring/camera methodologies are upstream, not complete
    aircraft integration. Exclude military/other aircraft routes, incomplete
    kits, separate ground systems, customer missions/agricultural crop output
    and repair-service products. Legacy unmanned-aircraft leaf remains
    read-only, no identity promotion or accepted mapping.
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
    - row_id: body
      reason_code: identity_not_established
      explanation: Generic UAV structural materials and prepared metal structures do
        not identify this supplied cured carbon-composite central-body assembly.
    - row_id: arm
      reason_code: identity_not_established
      explanation: Bare motor or industrial-robot motor-drive inverter is not the
        supplied integrated arm/motor/ESC assembly.
    - row_id: landing_gear
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: battery_holder
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: propeller
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: flight_controller
      reason_code: identity_not_established
      explanation: Public80455535 bundles purchased avionics/electronics and is
        classified as electrical capacitors; it does not establish one complete
        enclosed controller design.
    - row_id: power_board
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: power_module
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: gnss
      reason_code: identity_not_established
      explanation: Broad purchased avionics/electronics candidate has contradictory
        capacitor classification and does not establish one GNSS module.
    - row_id: telemetry
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: command_receiver
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this particular
        supplied module design, material/state and completeness. Collection of
        actual supplier/BOM evidence and a matched identity remains required; no
        database-wide absence is asserted.
    - row_id: battery_pack
      reason_code: identity_not_established
      explanation: 5554faa4 has Number reference with chemical-dopant classification
        and does not establish actual series pouch-pack completeness;5a009c90
        is1000mAh cell with polar-baking route and Energy reference, not the
        supplied flight pack. Number is not rejected merely for differing from
        Mass; actual pack identity and legitimate measured conversion remain
        unestablished.
    - row_id: camera
      reason_code: identity_not_established
      explanation: Integrated camera submodules6e73e903 are optics/sensor/electronics
        inputs to finished video recorders; they do not establish a complete
        aircraft depth-camera payload, its interface, housing and scope.
    - row_id: nylon_standoff
      reason_code: identity_not_established
      explanation: Polyamide stock and unrelated spacer candidates do not establish
        this actual finished insulating standoff design.
    - row_id: ipa_cleaner
      reason_code: identity_not_established
      explanation: Isopropanol/propan-2-ol bounded searches returned elementary
        identities and related chemical candidates; these do not establish the
        actual supplied cleaning formulation/purity and product gate.
    - row_id: box
      reason_code: identity_not_established
      explanation: Corrugated-box candidate4f197bec specifies16.6% primary/83.4%
        recycled fibre, unverified for the actual supplied box. Do not adopt
        that mixture without supplier evidence.
    - row_id: solder_residue
      reason_code: identity_not_established
      explanation: Search does not establish actual segregated Sn-Ag-Cu solder-dross
        waste chemistry/receiver state; generic raw solder is a different flow
        type.
    - row_id: spent_ipa
      reason_code: identity_not_established
      explanation: Public elementary isopropanol and unrelated spent-liquid candidates
        do not establish this actual contaminated cleaning waste stream.
    - row_id: rejected_controller
      reason_code: identity_not_established
      explanation: Scrap printed wiring board fe1d2a9b is SMT/reflow assembly
        rejection, not a complete enclosed flight controller rejected in module
        integration.
    - row_id: rejected_pack
      reason_code: identity_not_established
      explanation: NCM end-of-life/recovered battery products do not establish the
        actual rejected lithium-ion-polymer flight pack chemistry/state and
        waste type.
  unresolved:
    evidence_needs:
      - Current actual full as-built civil aircraft configuration/BOM/module
        supplier inclusion, physical battery/payload scope, firmware/calibration
        and performed factory acceptance records. Kit/build example is not
        actual complete factory inventory.
      - Current calibrated complete net aircraft M originals with tare/state
        corrections and independently measured module/flight-pack mass balance;
        no kit/frame catalogue weight or capacity-to-mass substitute.
      - Actual approved optional repair/chemical records, all missing specific
        mounting/protection/packaging/test-service/transport/receiver exchanges
        and matched links; independent scientific review pending.
  inventory_contract:
    atomic_flows: v1
