allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared assembly/test"
    rule: "Subdivide orders/configurations and meters before allocation. Demonstrated actual station/test occupancy, measured tool/test/charger demand and causal time records may attribute shared work; aircraft count or kg alone is not a universal driver. Retain idle/rework/rejected trials, raw period totals and accepted same-configuration denominator with sensitivity. Source build-time claims are not labour/energy allocation factors."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "returns/waste"
    rule: "Track supplier returns, repair/reuse, solvent recovery and measured disposal as separate destinations. For actual valuable co-products use subdivision/causal relations first and disclose alternative allocation and sensitivity when unavailable. Do not infer recycled-battery/fibre credits, recovered-IPA yield or avoided electronics production."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference product"
      record_type: "calibrated complete-aircraft weighing"
      raw_fields: "model; configuration; serial; accepted net mass M; calibration/zero/tare; installed battery/payload/rotors; state corrections and independent module balance"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted aircraft/configuration change"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration/raw net readings and independent installed module mass"
    - protocol_id: cp_parts
      process_id: "all_processes"
      flow_role: "single supplied assembly"
      record_type: "receipt and installed component record"
      raw_fields: "one assembly/design/material/chemistry/serial/count; supplied and installed net kg; inclusions; return/reject; accepted count"
      collection_method: "Measure separately supplied/installed module kg, preserving count/serial and supplier inclusions. Reconcile preassembled arm, motor/ESC and battery internals once with whole-aircraft M; do not replace kg with item counts or catalogue weights."
      unit: "kg"
      frequency: "each lot/design and accepted order"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual installed supplied kg / accepted units of the same configuration"
      quality_evidence: "supplier BOM/serial, calibrated net receipt/installed weights and closure"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "single formulation or box"
      record_type: "issue/return and repair/packing record"
      raw_fields: "single chemical/alloy/formulation or box design; lot/SDS; issues/returns; retained amount; residue/recovery; accepted count"
      collection_method: "Weigh actual net issues/returns and retention for each one defined repair formulation or shipping box. Preserve solder alloy/flux scope and cleaner actual concentration; box and loose accessories are outside net M. No nominal mix/yield or implied repair occurrence."
      unit: "kg"
      frequency: "each lot/repair/dispatch period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual attributable stock kg / accepted units of the same configuration"
      quality_evidence: "scale/tare, SDS/alloy certificate and joint/packing balance"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "single AC supply interface"
      record_type: "meter and causal stage attribution"
      raw_fields: "meter/site/provider/voltage; actual imported kWh; stage/charger/test/idle/rework; accepted count"
      collection_method: "Read calibrated meters and attribute actual assembly/configuration/repair/charge/test/packing demand with causal records. Convert kWh to MJ using1kWh=3.6MJ. Preserve charger interface, initial/final pack charge and actual test energy; nominal capacity is not metered input."
      unit: "MJ"
      frequency: "each stage/test batch and period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual attributed stage MJ / accepted units of the same configuration"
      quality_evidence: "meter calibration, cycle records/provider boundary and energy reconciliation"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "one physical waste stream"
      record_type: "segregated receiver shipment"
      raw_fields: "single waste chemistry/complete module/serial/state; actual net kg/tare; source and receiver; recovery/return; accepted count"
      collection_method: "Weigh actually exported segregated waste excluding containers and retain receiver and analysed state. Separate solder residue, spent cleaner, complete controller and complete rejected flight pack; supplier repair return is not assumed disposal."
      unit: "kg"
      frequency: "each shipment/period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual exported net waste kg / accepted units of the same configuration"
      quality_evidence: "scale/tare, analytical/serial and receiver/source balance"
    - protocol_id: cp_emission
      process_id: "repair"
      flow_role: "single residual IPA air release"
      record_type: "compound-specific measurement"
      raw_fields: "CAS67-63-0; actual air submedium; post-control concentration/flow/time; limits/uncertainty; solvent balance; accepted count"
      collection_method: "Quantify actual post-control residual isopropanol by matched sampling or documented closed solvent balance resolving recovery/residue/retention. Distinguish absent, not measured and below detection; none automatically means zero or complete evaporation."
      unit: "kg"
      frequency: "representative actual repair/control period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling/lab calibration, actual operation and solvent mass balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "complete delivered aircraft"
      record_type: "as-built/firmware/test acceptance record"
      raw_fields: "serial/model; full BOM/module inclusions; battery/payload and rotor state; firmware/calibration/actuator mapping; performed tests/repair; delivery exclusions"
      collection_method: "Trace actual controlled as-built drawings/BOM, supplied completeness, wiring/firmware/configuration and ordered inspection/test/repair results. Declare ground systems/spares/packaging separately and preserve all measured test-state corrections for M."
      unit: "kg"
      frequency: "each aircraft/configuration and change"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "qualifiers accompany each same-configuration accepted unit"
      quality_evidence: "signed BOM/drawing/supplier/firmware/calibration/test and physical-state evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_conversion
      applies_to: "order records"
      rule: "Attribute measured period totals to one same accepted configuration using documented causal records, then obtain q_item from attributed exchange / accepted aircraft. Retain raw totals, accepted denominator and rework/reject burden; do not pool unlike battery/payload/module configurations without an explicit weighted physical model."
      inputs:
        - cp_parts
        - cp_stock
        - cp_energy
        - cp_mass
      output: "q_item"
      source_ids: []
  data_quality_requirements:
    - id: mass_provenance
      applies_to: "cp_mass"
      requirement: "Positive M must originate in current actual calibrated net weighing of the accepted same-serial complete configuration, with original readings, scale capacity/resolution/calibration, zero/tare, supports and uncertainty. Reconcile independently measured installed module/retained consumable mass with complete-aircraft M. If the actual safe test/weighing state removes battery or rotors, retain the actual original state and separately measured signed same-unit add/remove corrections; no guessed correction. No kit/frame weight, takeoff/payload limit, shipping weight or battery capacity-to-kg estimate establishes M."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: net_configuration
      applies_to: "accepted aircraft"
      requirement: "M includes the actual complete accepted airframe, four installed rotor/propulsion assemblies, permanent onboard power/controller/GNSS/radio/harness and the specified supplied installed flight battery once; declare and reconcile actual payload/protection equipment. Exclude ground controller, external charger, test leads/fixtures, loose spare battery/propeller, transport packaging and temporary test payload. Supplied battery cell electrolyte/hardware and arm motor/ESC/wiring are included once, without duplicate separate receipts. Record charge state and actual delivery configuration, not nominal endurance."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: route_and_balance
      applies_to: "all exchanges"
      requirement: "Current full as-built BOM, make-or-buy inclusion and controlled assembly/firmware/acceptance plan determine observed exchanges. Prewired base route does not require local solder/flux/cleaner; optional repair requires actual joint/SDS records. Expand all missing specific mounts/straps/antennas/pads/protection/payload/computing, supplied interfaces, packaging and receiver/transport/test-service links before completeness claims. Check stock-to-installed/return/reject/residue balances, charger energy and chemistry-specific emissions, with limits/uncertainty and allocation sensitivity. Do not infer battery cycle life, rejection fractions, composition or charging efficiency."
      evidence: "cp_parts; cp_stock; cp_energy; cp_waste; cp_emission; cp_configuration"
    - id: source_limits
      applies_to: "external evidence"
      requirement: "Holybro manufacturer snapshot describes a kit with preinstalled arm motors/ESCs and optional payloads, not a finished measured aircraft or a complete production inventory. PX4 v1.14 guide documents mechanical/electrical integration and model-specific setup; it shares the Holybro hardware and does not constitute independent quantitative observations. Do not adopt advertised build time, frame mass, hover time, battery capacity/voltage, software defaults or screw counts as manufacturing factors, universal acceptance criteria, lifetime or current legal mandates. Collect current actual plant and product records independently."
      evidence: "holybro-x500-v2; px4-x500-v114"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
