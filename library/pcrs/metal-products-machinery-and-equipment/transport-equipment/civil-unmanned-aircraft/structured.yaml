    role: "foreground"
    quantitative_reference: "same accepted aircraft; q_item / M"
  - id: electronics
    name: "Onboard control power and communication integration"
    inclusion: "required"
    inclusion_condition: "Install actual controller, power/GNSS/radio/harness and conditional declared payload; load/configure firmware"
    role: "foreground"
    quantitative_reference: "same accepted aircraft; q_item / M"
  - id: repair
    name: "Conditional localized solder repair and cleaning"
    inclusion: "conditional"
    inclusion_condition: "Only performed approved local connector repair or documented cleaning; prewired base assembly requires neither"
    role: "foreground"
    quantitative_reference: "same accepted aircraft; q_item / M"
  - id: battery
    name: "Flight-pack installation and actual charge testing"
    inclusion: "required"
    inclusion_condition: "Actual matched supplied installed flight pack with separately measured charger energy and state"
    role: "foreground"
    quantitative_reference: "same accepted aircraft; q_item / M"
  - id: acceptance
    name: "Configuration calibration tests and net-mass acceptance"
    inclusion: "required"
    inclusion_condition: "Complete delivered configuration, actual current sensor/actuator/radio/power tests and calibrated physical M"
    role: "final_product"
    quantitative_reference: "finished_aircraft; 1 kg"
  - id: packing
    name: "Conditional dispatch packaging"
    inclusion: "conditional"
    inclusion_condition: "Only actual separate dispatch box/packaging work"
    role: "foreground"
    quantitative_reference: "same accepted aircraft; q_item / M"
