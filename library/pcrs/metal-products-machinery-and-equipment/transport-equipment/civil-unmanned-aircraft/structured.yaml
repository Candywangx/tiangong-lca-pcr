product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.transport-equipment.civil-unmanned-aircraft"
  classification_refs: "CPC 3.0 49624; narrower semantic candidate; no accepted mapping"
  covered_products: "Complete accepted configured modular civil battery-electric quadrotor with supplied installed flight pack"
  excluded_products: "Other aircraft routes, military products, kit/loose parts, ground equipment and use/service/repair"
  representative_product: "X500v2 prewired four-arm architecture with actual complete configuration and battery separately established; no catalogue weight adopted"
  production_route: "Mechanical module assembly; onboard electronic integration/configuration; conditional local repair; supplied-pack installation/testing; complete calibration/mass acceptance; actual packaging"
  market_state: "New complete accepted civil aircraft at declared factory gate"
functional_unit:
  what: "Manufacture of one complete configured civil battery-electric quadrotor"
  how_much: "1 kg accepted net complete unit; actual verified M kg per accepted aircraft"
  how_well: "Meet current approved mechanical fastening/rotor match, wiring/power polarity, firmware/sensor orientation/calibration, control/radio and battery acceptance plan, preserving actual inspection/test results. No invented tolerances, flight endurance or legal conformity"
  how_long_or_cycle: "One manufacturing delivery; no mission/flight-hour/battery-cycle lifetime unit"
  reference_flow_link: "finished_aircraft"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Start at actual supplied independently scoped body/arm/gear and electronic/flight-pack module receipts at plant. End at complete configured manufacturing acceptance, including actual associated packaging work while excluding its mass from M. Include actual bolting/rotor installation, module wiring/configuration, battery installation and measured testing, sensor/control checks, trial/rework and conditional localized repair. Supplied prewired arms include motor/ESC/wiring once: simultaneous separate arm/motor/ESC/raw carbon inputs or upstream resin cure would duplicate the supply boundary. Local PCB/SMT, motor winding, cell/pack manufacture, composite fabrication or extensive fabrication would require another explicitly expanded boundary, not a claim that these occur here. Base example requires no local soldering; optional repair consumptions/emissions need actual approved records. Expand actual missing retaining straps, mounts, radio antennas, vibration pads, companion computer, protection equipment, test fixtures/service, return shipments, charging interfaces and each packaging component before claiming complete coverage. External suppliers, extraction, inbound transport and receiving waste treatment are covered only through independently matched datasets; no complete cradle-to-gate claim without links. Customer flight/agricultural output/service and ground systems remain outside."
      source_ids: []
    - rule_id: boundary_supplied
      applies_to: "assemblies"
      rule: "Document supplied completeness and independently measured module kg, included fluid/charge/hardware and installed count. The actual preassembled arm replaces its internal motor/ESC/lead receipts. Separate any supplier-complete frame/gear/holder inclusions before counting those split cards."
      source_ids:
        - holybro-x500-v2
    - rule_id: boundary_tests
      applies_to: "acceptance"
      rule: "Include actual ordered factory firmware/calibration/actuator/radio/charge and performed acceptance flight work with measured supply energy, fixture/service and rework. Actual rotor removal/test payload must be recorded and corrected physically for complete M; no customer mission or nominal flight-time proxy."
      source_ids:
        - px4-x500-v114
boundary_abstraction:
  declared_starting_condition: "At-plant supplied prewired structural/propulsion and onboard electronic/battery modules"
  starting_condition_role: "boundary_abstraction"
  product_classification_scope: "Complete modular civil battery-electric quadrotor; narrower CPC49624"
  recursive_input_rule: "Purchased complete aircraft is a distinct receipt and changes the final-manufacturing boundary; do not recursively duplicate its contained modules or supplier operations"
  upstream_dataset_requirement: "Match actual module geometry/material/chemistry/complete gate, wiring/voltage/provider geography, battery state/protection and receiver route"
  disclosure: "Manufacturing integration foreground only; disclose actual supply inclusion, unresolved identities, current BOM/measurement/test and missing links"
