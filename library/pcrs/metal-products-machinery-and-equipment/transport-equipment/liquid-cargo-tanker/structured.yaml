  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "The original current vessel acceptance mass record must implement mass_record_provenance. Retain actual physical lightship/weight inspection, observable method inputs/calibration and a signed item-level reconciliation to delivered net configuration; reconcile independently weighed installed modules and fluids. A catalogue or unexplained displacement/tonnage record is insufficient. Missing method, uncertain correction or configuration change prevents a complete quantitative dataset; resolve by new measurement/reconciliation, never an assumed weight."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile drawings/BOM and installed hull/machinery/propulsion, piping/electrical, cargo/crew/safety/navigation and actual service-fluid masses, supplier scope and detached delivered parts. Add all actual missing components before completion; received complete modules count once."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, commissioning consumed versus retained fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this vessel. PCR checking validates the declared relationship, not a real ship record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured steel-hulled diesel tanker and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational cargo/persons/fuel/fresh water/ballast and temporary loads, retain declared installed service fluids. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each atomic physical/chemical exchange, public reference property/unit group, route/state and supplier scope. Engine item count is not mass; a genset includes its engine once; Pure resin is not a formulated cargo-tank coating; CuO is not Cu2O paint; water supply is not effluent or resource withdrawal. Keep unsupported identity blank and add actual species/components before completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_cargo_system
    applies_to: "cargo containment and equipment"
    rule: "Reconcile actual cargo/slop segregation, pipe/manifold/vent/gauging drawings and material/coating compatibility with the declared petroleum-product configuration. Trace actual leak/tightness/functional test method, test media and outlets; include attributable construction testing only. Heating, inert-gas, foam and ballast-treatment applicability follows actual design and current verified acceptance requirements; no preliminary brochure count or universal threshold certifies the ship."
    source_ids:
      - damen-product-tanker
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. Generic manufacturer certification or an IMO overview does not certify this tanker; no universal numerical standard/test/load is adopted."
    source_ids:
      - imo-tankers
published_dataset_profile:
  dataset_role: "Configured complete steel-hulled diesel tanker foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching hull/propulsion/outfitting/coating, controlled net-mass scope, trial boundary, gate/site/period"
  excluded_use: "Passenger/freight service or lifetime comparison, equal-mass capacity equivalence, other propulsion/materials and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model; hull serial and drawing revision; double-hull steel oil-product cargo scope and compartment segregation; mechanical-diesel or diesel-electric architecture; hull/cargo bulkhead grades, thickness and supplier block completeness; cargo/slop pump, pipe/manifold, vent/vapour-return and gauging design; actual cargo-tank coating formulation and compatibility; conditional heating, inert gas, fixed cleaning, ballast treatment and fire/safety equipment; actual claimed flag/class acceptance; positive net M in kg from current controlled acceptance records with original actual lightship/weight inspection, calibration, hydrostatic/physical inputs and item-level net-configuration correction; excluded cargo/slops, persons, consumable fuel/fresh water, ballast and temporary test contents; installed service fluids and integral delivery-detached parts; actual supplier inclusion, manufacturing site/period, commissioning and delivery gate; upstream linkage"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Hull/propulsion/outfitting/coating, supplier modules, actual M evidence/corrections, trial state/boundary, manufacturing/acceptance regime, site/period changes"
data_sources:
  - id: "damen-product-tanker"
    type: "literature"
    reference: "[Damen: Combi Tanker 6000 preliminary sheet](https://medialibrary.damen.com/m/3a17769dc9b8dc79/original/product-sheet-combi-tanker-5800.pdf)"
    used_for: "PDF p.1 cargo systems, propulsion, deck/safety and optional systems; p.1–2 footer states preliminary data subject to change. Filename says 5800, actual document says 6000. Candidate equipment/configuration example only; no counts, flow rates, ratings, cargo capacity, deadweight or GT adopted as manufacturing values or net M."
  - id: "damen-seagoing"
    type: "literature"
    reference: "[Damen: Seagoing Transport](https://medialibrary.damen.com/m/95d5489057a4c08f/original/Seagoing-transport.pdf)"
    used_for: "PDF p.5 (printed 8–9) modular approach/building; p.8 (printed 14–15) product-tanker choices alongside separate gas carriers. Descriptive route/options only; no manufacturer performance claim, numerical benchmark or universal recipe adopted."
  - id: "nma-lightship"
