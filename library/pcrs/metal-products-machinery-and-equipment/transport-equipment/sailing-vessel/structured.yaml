    used_for: "Historical wet-laid monolithic glass/polyester hull/grid and injected glass/polyester/balsa deck architecture. No dimensions, engine maximum mass, recipe or actual M adopted."
  - id: "jeanneau-spec-2014"
    type: "handbook"
    reference: "Jeanneau, SUN ODYSSEY349 Model year2014 specification, updatedNovember2013, non-contractual, unnumbered physical pp.1–3. Manufacturer original retained from owner-community mirror: https://www.jeanneau349.com/index_htm_files/Jeanneau%20SO%20349%20Specs.pdf"
    used_for: "Historical fixed coated cast-iron keel/classic aluminium mast/stainless standing rig/woven Dacron sails, marine shaft engine and permanent outfit example. Alternative sail/keel/option routes are not pooled. No catalogue kg/area/performance, certification or factory quantities adopted."
