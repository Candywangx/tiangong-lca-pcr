system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins at actual raw formulation/reinforcement/core and supplied-component receipts at the declared yard and ends at complete configured factory acceptance. Hull and deck moulding, local joining/finishing, rig/propulsion/permanent outfitting, rework, actual factory launch/checks and receiver-bound wastes are included. Tooling service and actual mould maintenance are attributed by documented causal use; do not assume a mould lifetime or universally require replacement per boat. Supplied finished keel/coating, mast, engine, sails and internals are measured at their actual supply gate; do not repeat supplier manufacturing or contained fluids. Purchased finished hull/deck would change the declared local-moulding route and needs a documented separate applicability model, not simultaneous stock plus finished-hull inputs. Optional cleaning chemistry/curing initiator, local coatings, heating, compressed air, ancillary plant and dock/sea trials enter only if actual route requires/performs them, each as an explicit atomic card. No default packaging; actual shipping cradle/cover requires its own exchange and exclusion from M. Raw-material extraction, upstream manufacture, inbound transport and waste treatment are represented only by matched separately linked datasets; absent links are gaps and prohibit a full cradle-to-gate claim."
      source_ids: []
