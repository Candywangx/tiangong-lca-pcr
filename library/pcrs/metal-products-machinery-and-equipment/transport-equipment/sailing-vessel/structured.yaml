allocation_rules:
  - rule_id: allocate_order
    applies_to: "shared operations"
    rule: "Separate model/order and direct stage meters before allocation. For shared resin injection, cure/ventilation, mould maintenance and commissioning use recorded occupied tool time, monitored energy or demonstrated causal capacity, retaining rejected boats/rework and idle burden. Mass alone does not explain different laminate/rig/test complexity. Document actual driver totals/denominators and sensitivity; no universal coefficient."
    source_ids: []
  - rule_id: recovery_export
    applies_to: "single wastes"
    rule: "Track internal resin/solvent/material recovery without export double count. Separately measured offcuts, uncured resin and contaminated cleaning solution go to their actual receiver. Treat actual valuable co-products by documented subdivision/causal relation, with explicit alternate-model sensitivity if physical causality is unavailable; do not silently apply market-price allocation or recycling credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_vessel"
      record_type: "controlled physical acceptance mass"
      raw_fields: "configuration; accepted net mass M; boat/configuration ID; M kg; actual original weighing method and readings; calibration/tare/dry state; installed and unstepped parts; tank contents; signed net correction ledger; accepted counts"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted boat/configuration"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "current signed raw physical weighing and delivery-state correction evidence; survey_provenance and net_configuration"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "declared configuration"
      record_type: "as-built configuration and route record"
      raw_fields: "hull/BOM/drawing revisions; laminate/core/cure/joint plan; supplied scope/charges; rig/sails/engine/permanent fit; make-or-buy; actual tests; delivery state"
      collection_method: "Record actual controlled BOM, stage route and complete accepted configuration. Trace each component and chemical lot to supplier included scope and actual acceptance criteria/results; retain deviations/rework. Do not infer complete factory inventory from historical specifications."
      unit: "kg"
      frequency: "each order/design change/acceptance"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "qualifier records accompany actual exchange amounts; no nominal value substitution"
      quality_evidence: "controlled design/BOM; SDS/lot certificates; supply and test gate evidence"
    - protocol_id: cp_stock
      process_id: "hull_deck_assembly_acceptance"
      flow_role: "single formulation or dry stock"
      record_type: "net issued material balance"
      raw_fields: "one formulation/grade/fibre/core; lot; kg issue/return/stock; supplier included constituents; moisture/solids; actual retained/trim/waste; water density/temperature if metered"
      collection_method: "Weigh each actual material/formulation net issue separately; reconcile beginning/ending stock, returns, installed retention, collected waste and measured emissions. Supplied UPR/gelcoat/initiator each has its own included-constituent scope; purchased mixtures cannot be counted again as fresh constituent mass. For water meter actual volume and measured density at recorded temperature to obtain kg. No catalogue density or loss ratio."
      unit: "kg"
      frequency: "each issue/return/lot/stage"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable net material kg / accepted units of the same configuration"
      quality_evidence: "calibrated scales/meters; lot/SDS; stock and constituent balance"
    - protocol_id: cp_parts
      process_id: "assembly_rigging"
      flow_role: "single supplied component"
      record_type: "measured supplied installed part"
      raw_fields: "one supplied design/material/finish; kg and traceable count; included internals/working fluids; prefill; installation return; supplier boundary"
      collection_method: "Weigh each actual supplied installed component or use verified supplier raw measured mass of the identical configuration, preserving finish, internals and included charges. Weigh each finished mainsail and headsail independently, not sail area times catalogue cloth mass. Separate supplied assemblies from local material/fabrication and their excluded packaging. Trace additional retained working-fluid fills as distinct actual atomic cards; no supplier-precharge duplication."
      unit: "kg"
      frequency: "each actual component receipt/installation"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable installed component kg / accepted units of the same configuration"
      quality_evidence: "physical measurement; supplier included-scope certificate; installation ledger"
    - protocol_id: cp_count
      process_id: "assembly"
      flow_role: "marine_engine"
      record_type: "actual installed engine count"
      raw_fields: "marine duty/configuration; supplied installed Item(s); separately measured engine kg; included gearbox/heat exchanger/prefill; lot; installation ledger"
      collection_method: "Count actual supplied installed marine engines of the same design. Separately weigh or verify raw measured supplied engine kg and included precharge/completeness for physical boat mass; retain count as public exchange property. No default engine kg/item."
      unit: "Item(s)"
      frequency: "each supplied/installed engine"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable installed engine count / accepted units of the same configuration"
      quality_evidence: "marine-duty/supplier-scope certificate; engine kg/count ledger"
    - protocol_id: cp_energy
      process_id: "hull_deck_assembly_rigging_acceptance"
      flow_role: "electricity"
      record_type: "actual stage electricity"
      raw_fields: "site/order/stage; kWh/MJ; interval/calibration; pump/cure/ventilation/idle/rework attribution"
      collection_method: "Meter attributable actual stage electric energy; convert1 kWh =3.6 MJ and retain actual causal shared drivers. No power-rating or nominal cycle-time consumption."
      unit: "MJ"
      frequency: "each metered order interval"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable stage energy / accepted units of the same configuration"
      quality_evidence: "meter calibration; bill and actual stage driver"
    - protocol_id: cp_fuel
      process_id: "acceptance"
      flow_role: "test_diesel"
      record_type: "consumed trial-fuel balance"
      raw_fields: "one certified fossil grade; actual fill/consumed/return/residual kg; density/temperature if metered; actual test scope/time"
      collection_method: "Weigh or meter with actual density/temperature and reconcile consumed test fuel separately from delivered residual service fuel and net-M exclusions. Record actual manufacturing acceptance intervals; no use-voyage consumption or brochure factor."
      unit: "kg"
      frequency: "each actually performed acceptance trial"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable consumed test fuel kg / accepted units of the same configuration"
      quality_evidence: "fuel origin; calibrated meter/scale; actual test/tank ledger"
    - protocol_id: cp_waste
      process_id: "hull_deck_acceptance"
      flow_role: "single exported waste"
      record_type: "segregated receiver-gate waste"
      raw_fields: "single waste; composition/moisture; kg export/recovery; receiver/treatment gate"
      collection_method: "Weigh cured laminate offcuts, uncured resin, captured dust, spent acetone and spent aqueous solution as separate actual exports with contamination and receiver records. Internal recovery is not export; contained solutions are not natural-water emissions."
      unit: "kg"
      frequency: "each waste export/order"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable exported waste kg / accepted units of the same configuration"
      quality_evidence: "scale; composition/moisture; receiver receipt"
    - protocol_id: cp_emission
      process_id: "hull_acceptance"
      flow_role: "single actual air species"
      record_type: "species-specific post-control monitoring"
      raw_fields: "chemical/CAS/origin; immediate air/submedium; dust size; actual concentration/exhaust volume/reference conditions/interval; control/background/uncertainty"
      collection_method: "Measure species-specific actual post-control concentration and exhaust volume on identical reference conditions, integrate attributable intervals and correct measured background. Verify styrene/acetone chemical identity and fossil CO2 origin independently. Selected air submedium and dust size are unspecified; specific measurements require separately matched identities. No mandatory release or total-VOC-to-styrene equivalence."
      unit: "kg"
      frequency: "each representative actual emitting interval"
      temporal_coverage: "same declared manufacturing and acceptance period; disclose gaps"
      site_scope: "declared yard and controlled manufacturing acceptance trials"
      aggregation_rule: "attributable measured species kg / accepted units of the same configuration"
      quality_evidence: "monitoring/flow calibration; speciation/medium/origin evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: survey_provenance
      applies_to: "cp_mass; finished_vessel"
      requirement: "Require current controlled original physical weighing/weight-inspection records for this accepted boat, including calibrated adequate-capacity crane/gantry load-cell readings or another actually demonstrated traceable method, measured empty lifting-sling/support tare and zero, dry state/wind/stability conditions, repeated observations and uncertainty, date/operator/witness and signatures. WS2017 H.3.1 explains physical calibration, tare and keelboat lifting principles; do not import racing hull-weight definitions or minimums. Acceptance records must cite these actual originals; the collection interface alone does not establish M. No whole-boat platform scale is presumed. No actual boat measurements are supplied by this PCR."
      evidence: "ws-weighing-2017; cp_mass"
    - id: net_configuration
      applies_to: "cp_mass; cp_parts; cp_count"
      requirement: "Reconcile raw weighed assembly to exactly one complete accepted BOM: include hull/deck/keel, mast/boom/standing and running rig, both declared finished sails, engine and permanent accommodation/electrical/plumbing/safety outfit plus retained working lubricant/coolant. If mast/sails are delivered detached, independently measure the same identified accepted parts and sign the add/remove ledger; do not estimate missing rig mass. Exclude lifting gear/cradle/packaging, people/cargo/loose non-BOM gear, tank service fuel/freshwater/sewage, test ballast and unintended bilge water, each with actual measured correction. Reconcile constituent retained masses and independent supplied engine kg/prefill against net M; avoid double count. Displacement, deadweight, tonnage, catalogue estimate and full-tank weight are not substitute M."
      evidence: "cp_configuration; cp_mass; cp_stock; cp_parts; cp_count"
    - id: quality_coverage
      applies_to: "complete inventory"
      requirement: "Current controlled lay-up/core/cure/joint and as-built full BOM determine actual exchanges, not this illustrative list. Expand every actual additional roving/fabric, solvent, promoter, joint, local coating, working fluid, cabin fixture, exhaust/cooling/steering/navigation/safety unit, mould service, packaging, transport or receiving treatment as a separate specific card. Match supplier inclusions, actual stock/retention/export/emission balances and upstream links; report uncertainty and gaps. Missing original mass/route/BOM records prohibit claims of an observed physically complete dataset. No universal yield, dose, density, sail mass, engine mass, fluid fill, mould life or release factor."
      evidence: "cp_configuration; cp_stock; cp_parts; cp_waste; cp_emission"
    - id: quality_source_limits
      applies_to: "external architecture and weighing"
      requirement: "Jeanneau IndexA manual p.13 and model-year2014 specification unnumbered pp.1–3 (updatedNovember2013, non-contractual) establish a historical composite/rig/shaft-outfit example only. Manufacturer originals are retained from an owner-community mirror. WS manual January2017 physical pp.135–136/printedH47–H48 supplies historical measurement principles, not current regulatory obligations or complete-unit PCR definitions. No catalogue mass/area, numeric acceptance tolerance or operating fraction adopted. The method requires current independent physical records and scientific review."
      evidence: "jeanneau-owner-manual; jeanneau-spec-2014; ws-weighing-2017"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Check declared complete configuration, positive actual net M kg, cp_mass originals and independent survey_provenance/net_configuration. Preserve each public property and normalize its unit amount by M. Separate Item(s) engine count from supplied measured engine kg; retained precharge appears once."
    source_ids: []
  - rule_id: validation_route
    applies_to: "all processes"
    rule: "Require actual mould/lay-up/injection/cure/joint/trim records, resin/gelcoat/core/fibre identities and component supply gates; reconcile inputs, retention, exports and measured releases. Purchased assemblies do not duplicate constituent production. Review unlisted cabin/electrical/plumbing/navigation/safety and actual trial exchanges before completeness claims."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all rows"
    rule: "Verify substance/type/reference property/unit group plus actual route/state/concentration/medium and official bilingual names. Wafer-route acetone is not cleaning solvent; elementary acetone/styrene is not purchased product; waste solutions are not tap/resource water. Marine class43110 engine is not road class43123. Immediate air is not long-term/soil/indoor; unspecified dust is not a measured size fraction. Unresolved identities remain explicit row gaps."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset claims"
    rule: "A mechanical PCR check does not establish scientific approval, observed factory completeness, current class/legal conformity, sailing performance or lifetime. Missing actual mass survey, qualifier, BOM or linked upstream/receiver evidence must be disclosed before any complete dataset claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured composite auxiliary-diesel sailing-vessel manufacturing foreground; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete configured boat manufacture scaled by actual net M, with matched supplier/transport/receiver links separately disclosed"
  excluded_use: "Sailing trips/passenger/voyage transport/use fuel/maintenance/life/disposal, other hull/propulsion routes or methodology approval"
  required_metadata: "Reference qualifiers; current complete as-built BOM/route/chemical lots/supply gates; calibration/raw weights/tare/dry/delivery/add-remove records and signed M; engine count with independent supplied kg/precharge; sail inclusion; actual acceptance/fuel residual/water exclusions; site/period/allocation and matched links"
  required_quality_disclosure: "Identity/BOM/route/mass/raw-measurement/link gaps; source vintage/mirror/applicability; rework/recovery/exports; uncertainty and allocation sensitivity"
  update_trigger: "Hull/core/resin/cure/joint/finish route; keel/rig/sails/engine/permanent fit or supplier completeness; mass inspection/delivery/tank state; yard/period/test plan or allocation change"
data_sources:
  - id: "jeanneau-owner-manual"
