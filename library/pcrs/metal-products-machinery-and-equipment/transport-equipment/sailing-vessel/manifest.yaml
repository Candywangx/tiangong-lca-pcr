review_metadata:
  semantic_boundary_decision: "New complete non-inflatable cruising monohull
    sailboat manufacture: wet-laid glass/polyester hull/grid, injected
    balsa-sandwich deck, fixed iron keel, classic aluminium rig, woven-polyester
    sails and shaft-drive marine auxiliary diesel. Narrower than CPC49410; sail
    textile/propeller material records are upstream component methodologies and
    do not duplicate complete boat moulding, integration and accepted mass.
    Excludes inflatable/motorless/other hull-propulsion routes, incomplete
    craft, repairs, use/voyage services. Old leaf remains read-only; no retired
    identity or positive mapping promotion."
  scientific_review: pending independent methodology review
