  unresolved:
    evidence_needs:
      - Actual current physical boat weight-inspection originals,
        calibration/tare/dry readings, same-configuration
        add-remove/working-fluid/tank exclusion evidence and signed positive net
        M; not supplied by methodology.
      - Current full BOM/lay-up/resin/core/cure/joint records, supplier
        constituent/completeness/charges, actual engine kg/count and separate
        sail mass; actual factory inventories/trials/causal allocation.
      - Expand actual additional atomic
        materials/fixtures/working-fluid/service/transport/receiver cards and
        matched upstream links before complete-dataset claims. Historical
        manufacturer originals on owner-community mirror and WS2017 measurement
        principles are limited evidence.
