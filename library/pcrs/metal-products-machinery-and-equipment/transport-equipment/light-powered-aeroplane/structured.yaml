allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Prefer actual configuration work orders and metered issue/return/test attribution. Match reporting accepted counts to complete output; include actual reject/rework burdens, no dilution by sales or differing configurations."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "First separate processes. Where inseparable, use actual causal machine occupancy, joint length/work time, conditioned surface and test/support energy as appropriate, reconcile common meter totals, record driver units and compare plausible alternatives. No unmeasured equal-per-aircraft or mass share for fixed avionics testing."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "No automatic avoided virgin aluminium, recyclable material or returned fuel credit. Keep internal transfers, outgoing wastes, treatment and real co-products distinct. Economic allocation only for documented genuine co-products when causal physical basis unavailable, retaining actual price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "every accepted aircraft"
      temporal_coverage: "matched manufacture/acceptance period"
      site_scope: "actual acceptance/weighing hangar"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "current aircraft-specific method; calibrated all-support scale readings/tare; measured fuel-state corrections and fit-list"
    - protocol_id: cp_airframe
      process_id: "airframe"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "grade/temper/heat; sheet/tube/rivet issues and returns; cutting/forming/joining work orders; metered kWh; loose scrap measured bulk m3 and independent kg; actual exhaust sampling"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. For al_scrap measure loose bulk m3 including voids, independently weigh kg for balance. Record aircraft/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ; m3"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_coat
      process_id: "coat"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "formulation/SDS/solids; wet primer issues/returns/retained film; product water makeup; energy; separate residues and actual sampled species"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. For al_scrap measure loose bulk m3 including voids, independently weigh kg for balance. Record aircraft/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ; m3"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_systems
      process_id: "systems"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "supplied engine/propeller/gear/control/seat/avionics/harness model/serial; installed supplied kg; contained reduction gear/accessories/fluids; separately added oil/coolant; installation electricity"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. For al_scrap measure loose bulk m3 including voids, independently weigh kg for balance. Record aircraft/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ; m3"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "aircraft serial/configuration; current released ground/flight test endpoints/time; fuel certificate/lead and metered issues/returns/retained stocks; measured species/compartment; calibrated weighing/tare/net corrections and independent component mass balance"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. For al_scrap measure loose bulk m3 including voids, independently weigh kg for balance. Record aircraft/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ; m3"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
  calculation_rules:
    - id: normalize_mass
      applies_to: "sheet; steel_tube; solid_rivet; frame_power; al_scrap; particle_air; epoxy_primer; coat_water; coat_power; paint_residue; xylene_air; piston_engine; propeller; landing_gear; brake_unit; windshield; seat; radio; harness; battery; engine_oil; coolant; system_power; test_gasoline; test_power; used_oil; fossil_co2_air; no_air; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "Use current applicable manufacturer weighing procedure, complete equipment list and calibrated scales at all actual aircraft weighing points, indoors without wind, with original readings/tare, level/configuration, date/calibration/uncertainty and repeat closure. Independently measured installed airframe/engine/propeller/gear/system/retained-fluid masses reconcile net M. Missing physical originals block dataset use; FAA2016 illustrates method only, not current authorization or a prescribed calibration interval."
      evidence: "faa-weight-2016; current original weighing records"
    - id: quality_net
      applies_to: "finished_machine"
      requirement: "Keep measured as-weighed condition and signed physical correction schedule. Remove all actual fuel including unusable/residual fuel, people/baggage, temporary fixtures, detached spares and packaging. Include installed permanent ballast and declared retained technical lubricant/coolant/hydraulic fluid/electrolyte once. Trace residual-fuel corrections to current aircraft-specific draining/measurement records; never zero them by assumption or use FAA nominal density. Preserve original basic empty-weight/CG record separately and bridge states; no net M invented from BOM or catalogue estimates."
      evidence: "faa-weight-2016; signed fuel/stock corrections and supplier containment"
    - id: quality_classification
      applies_to: "finished_machine"
      requirement: "Independently document CPC/HS unladen condition for the actual manned aircraft and <=2000kg applicability, with original classification basis and state bridge to manufacturing M. MTOW, design payload or a historical brochure is not evidence of actual unladen mass. Reject outside-scope aircraft rather than automatically treating manufacturing M as classification unladen weight."
      evidence: "actual classification/configuration records; public class49622 flow"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "One exact grade/model/chemical/state per exchange. Installed propulsion is aviation spark-ignition reciprocating engine class43131, not class43110 excluding aircraft nor road diesel/turbine/ground-cart engine. Supplied engine kg and complete M independently reconcile; contained prefill not also external oil. Respect actual property reference, including loose-scrap Volume/m3 without public default density."
      evidence: "actual supplier certificates/fit-list and direct public identity/property"
    - id: quality_release
      applies_to: "elementary"
      requirement: "Collect only physically evidenced actual release with chemical/CAS, immediate medium/submedium, post-control species concentration/flow/time or actual fuel carbon balance. PM size unspecified is not captured dust; xylene not totalVOC; fossil CO2 not biogenic; NO not NO2/N2O/NOx. Separately characterise other actual combustion species and actual lead compounds if leaded fuel is used; no unavoidable lead species/factor assumed. Flight emissions need actual altitude/compartment applicability, not generic ground-air substitution."
      evidence: "original species sampling, actual fuel/SDS/carbon and control records"
    - id: quality_acceptance
      applies_to: "acceptance"
      requirement: "Keep current applicable released structural/joint conformity, flight-control travel/rigging, gear/brake, fuel/oil/cooling leak, electrical/avionics and actual ground/flight acceptance results including rework. Only verified actual aircraft approvals may be claimed; historical brochure equipment/power/speed/capacity/warranty does not set method thresholds."
      evidence: "current aircraft-specific released plans/results"
    - id: quality_completeness
      applies_to: "dataset"
      requirement: "Reconcile complete released installed fit-list with stock/supplier/utility totals. Add actual separate spars/extrusions, firewall, cowling/fairings, weld filler/shielding gas, fasteners/sealants, controls/linkages, tanks/pumps/hoses, coolers/exhaust, wheels/tyres, restraints, switches/antennas/instruments, coatings, treatment wastewater and packaging when not contained. Each added physical/chemical exchange gets its own card and protocol; no pooled inputs. State measured/calculated/estimated/missing/excluded/not-applicable status, uncertainty, supplier upstream/support/transport/treatment gaps."
      evidence: "complete fit-list and independently closed stock/meter/package records"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Exactly1kg complete accepted declared aircraft, measured cp_mass net M and independent component mass balance, same configuration and fuel correction originals. Formula consistency is not physical weighing or methodology approval."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "All rows link valid lowercase IDs/protocols and normalize_mass; match accepted count/period/numerator units. Reject mixed configurations, invalid quantity enum, Mass/Volume/Energy substitution or catalogue conversion."
    source_ids: []
  - rule_id: validation_scope
    applies_to: "dataset"
    rule: "Require actual independent classification unladen condition<=2000kg, aircraft engine route, bounded manufacturing support/trials and disclosed identities/upstream gaps. No transport function or cradle-to-gate completeness claim from foreground alone."
    source_ids: []
  - rule_id: validation_release
    applies_to: "elementary"
    rule: "Verify chemical/CAS/medium/time and actual conditional quantity; purchased water is product, outgoing wastewater treatment is waste, resource abstraction and direct emissions are separate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of a new complete manned fixed-wing single spark-ignition reciprocating piston-propeller aeroplane with sheet-aluminium wing and metallic fuselage structure, including declared steel-tube portions, actual cut/form/drill/rivet and qualified joining, supplied powerplant integration, fixed tricycle landing gear, flight-control/interior/electrical installation and bounded manufacturing acceptance. Riveting and tube joining follow actual released drawings; no particular alloy or joining technique is imposed on every product. Classification applicability requires independently established unladen weight not exceeding2000kg. This narrower route does not cover every aircraft in CPC49622."
  excluded_use: "Exclude unmanned aircraft, helicopters/rotorcraft, unpowered or powered gliders, turbine/turboshaft/turbofan propulsion, electric/hybrid propulsion, primarily composite airframes, kits, separately sold engines/parts/propellers, repairs/overhauls and air transport service. Exclude training/commercial flight, passenger-km, routine maintenance, airports and end of life. Actual factory acceptance flight belongs to declared manufacturing endpoints only, with measured attributable support inputs and release compartments; no lifetime or complete cradle-to-gate claim follows."
  required_metadata: "aircraft model/revision/serial and released equipment list; manned fixed-wing piston route; structure grades/tempers/thickness and joining work orders; supplied engine/propeller/gear/control/avionics fit-list and contained prefill; aircraft-specific approved fuel/fluids and actual trial plan; manufacturing sites/periods/accepted count/rework; current calibrated complete-aircraft weighing originals/tare/configuration and measured excluded-fuel/stock corrections; independent installed-component mass reconciliation and uncertainty; net M kg distinct from basic empty weight/MTOW and independently documented CPC unladen state<=2000kg; purchased utility/transport/treatment coverage and gaps"
  required_quality_disclosure: "Exact aircraft fit-list/engine route/supplier prefill and independent classification state; actual measured net M/raw corrections and component mass/uncertainty; actual period/site/count/rework/test endpoints; causal allocation/sensitivity; missing identities/physical records and upstream/treatment/support coverage; scientific review pending."
  update_trigger: "Structure/joining/finish or propulsion/gear/avionics configuration, supplier/make-or-buy/site/period, fluid/fuel chemistry, trial scope, weighing/delivery state, classification basis and new identity/evidence."
data_sources:
  - id: "tecnam-eaglet"
    type: "handbook"
    reference: "Tecnam, P92 Eaglet, undated archived manufacturer brochure, PDFp3 printed148 Construction/Engine and Propeller/Landing Gear/Interior; p4 equipment. https://www.tecnamair.com/wp-content/uploads/2015/05/P92-Eaglet.pdf"
    used_for: "Historical metallic/mixed tube-and-sheet piston aircraft route only. No current approval, compulsory model, output weight, performance, manufacturing quantities, warranty life or every join technique adopted. Actual released drawings and foreground records govern current route."
  - id: "faa-weight-2016"
    type: "official_guidance"
    reference: "FAA, Aircraft Weight and Balance Handbook FAA-H-8083-1B2016, ch3 printed3-3–3-6 (PDF35–38), preparation, equipment/fuel/fluid and weighing/tare. https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/FAA-H-8083-1.pdf"
    used_for: "Historical weighing-method and empty-weight state illustration only. Current actual manufacturer procedure/calibration and measured corrections required. No handbook nominal fluid density, example weight, calibration interval or present legal requirement adopted; aviation empty weight not automatically CPC unladen or net M."
