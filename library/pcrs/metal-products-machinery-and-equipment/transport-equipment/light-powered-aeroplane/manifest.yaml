    mapping_type: narrower
review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: Manufacture of a new complete manned fixed-wing
    single spark-ignition reciprocating piston-propeller aeroplane with
    sheet-aluminium wing and metallic fuselage structure, including declared
    steel-tube portions, actual cut/form/drill/rivet and qualified joining,
    supplied powerplant integration, fixed tricycle landing gear,
    flight-control/interior/electrical installation and bounded manufacturing
    acceptance. Riveting and tube joining follow actual released drawings; no
    particular alloy or joining technique is imposed on every product.
    Classification applicability requires independently established unladen
    weight not exceeding2000kg. This narrower route does not cover every
    aircraft in CPC49622. Exclude unmanned aircraft, helicopters/rotorcraft,
    unpowered or powered gliders, turbine/turboshaft/turbofan propulsion,
    electric/hybrid propulsion, primarily composite airframes, kits, separately
    sold engines/parts/propellers, repairs/overhauls and air transport service.
    Exclude training/commercial flight, passenger-km, routine maintenance,
    airports and end of life. Actual factory acceptance flight belongs to
    declared manufacturing endpoints only, with measured attributable support
    inputs and release compartments; no lifetime or complete cradle-to-gate
    claim follows. Existing aviation gasoline, aircraft piston engine/parts,
    wiring sets and ground flying trainer material PCRs cover inputs or ground
    equipment, not complete aircraft assembly. Old classification leaf remains
    read-only; no mapping promoted.
  reference_identity_basis: Public state100 class49622 finished manufactured
    product Mass/kg, qualified to actual narrower metallic piston aeroplane.
    Separate original classification unladen-state record and configuration
    corrections required, never infer from MTOW or catalogue empty weight.
  rejected_engine_scope: CPC43110 internal-combustion piston engines excludes
    aircraft and motor vehicles; not applicable to installed aircraft main
    powerplant. Adopted class43131 is spark-ignition aviation reciprocating
    engine; turbine/road/rail/ground support engines cannot substitute.
  unresolved_flow_identities:
    - row_id: steel_tube
      selected_flow: Aircraft chromium-molybdenum steel structural tube
      reason: Steel Pipe generic record does not establish chromium-molybdenum
        aviation tube grade and released supply; other candidates
        aluminium/titanium or pile column.
    - row_id: solid_rivet
      selected_flow: Solid aluminium-alloy aircraft rivet
      reason: Public generic rivet reference Volume does not identify solid versus
        bulk volume or precise aluminium aviation rivet. No same-part physical
        conversion established; do not relabel property Mass.
    - row_id: epoxy_primer
      selected_flow: Formulated epoxy aircraft corrosion-protection primer
      reason: Industrial Maintenance Coatings collective identity does not establish
        one aircraft primer formulation.
    - row_id: propeller
      selected_flow: Finished fixed-pitch wood-composite aircraft propeller assembly
      reason: Initial candidates marine bronze propellers and turboprop parts; refined
        wood-composite query returns doors/boards, not one released fixed-pitch
        aviation propeller assembly. Identity unresolved within bounded
        searches.
    - row_id: landing_gear
      selected_flow: Finished fixed tricycle aircraft landing-gear assembly
      reason: Initial and refined candidates semi-trailer landing gear/fishing gear,
        not actual fixed tricycle aircraft main/nose assembly. Identity
        unresolved; no database-absence claim.
    - row_id: brake_unit
      selected_flow: Finished aircraft hydraulic disc-brake unit
      reason: Brake system assembly candidate rail/vehicle scope does not establish
        one aircraft hydraulic disc unit.
    - row_id: windshield
      selected_flow: Finished PMMA aircraft windshield
      reason: Refined PMMA candidates beads and processing intermediates, not finished
        shaped aircraft windshield; monomer elementary exchanges cannot
        substitute. Identity unresolved.
    - row_id: seat
      selected_flow: Finished upholstered aircraft seat with installed restraint
      reason: Refined candidates whole aircraft/ground trainers, generic aircraft
        inputs and chair components, not one completed aircraft seat/restraint.
        No forced component-group identity.
    - row_id: radio
      selected_flow: Finished aircraft VHF communication radio
      reason: Bounded radio/navigation searches return radioactive species and general
        avionics/aircraft input groups; these do not establish one supplied VHF
        communication radio.
    - row_id: battery
      selected_flow: Finished lead-acid aircraft starter battery
      reason: Lead Acid Battery candidate Mass but public classification17100
        electrical energy conflicts with physical product; no forced adoption.
    - row_id: engine_oil
      selected_flow: Formulated aircraft piston-engine lubricating oil
      reason: Bounded aviation oil queries return engines/fuel/waste oil; no matching
        supplied actual formulated aircraft lubricating oil grade established.
        Waste/product and contained engine prefill cannot substitute.
    - row_id: coolant
      selected_flow: Formulated ethylene-glycol aircraft-engine coolant
      reason: Refined ethylene-glycol results include elementary releases and neat
        chemical, not supplied aqueous formulated coolant with actual
        concentration/aircraft qualification. Keep actual formulation identity
        gap.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
