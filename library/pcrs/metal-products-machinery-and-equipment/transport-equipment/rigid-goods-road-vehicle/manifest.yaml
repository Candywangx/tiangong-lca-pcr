review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "New complete diesel rigid goods road vehicle with a permanently mounted steel flatbed cargo body. Narrower than CPC 49114; excludes box/tank/refrigerated/tipping bodies, tractor units, trailers, incomplete chassis, off-road dumpers and alternative propulsion. Existing bodies-for-motor-vehicles PCR covers body component manufacture, not complete goods vehicle assembly and acceptance. Reuse as a linked component module when applicable without promoting legacy IDs or changing mappings."
  unresolved_flow_identities:
    - row_id: "waterborne_basecoat"
      flow: "Waterborne automotive cab basecoat formulation"
      reason: "Generic Base coat and oil-based Paint do not establish this waterborne automotive formulation."
    - row_id: "cleaning_effluent"
      flow: "Aqueous metal-part cleaning effluent transferred for treatment"
      reason: "Public cleaning wastewater direct record models release to water, incompatible with treatment transfer."
    - row_id: "frame"
      flow: "Finished steel ladder-frame assembly"
      reason: "Truck chassis candidate is crane-lorry input, not bare truck ladder frame."
    - row_id: "front_axle"
      flow: "Finished truck steering-axle assembly"
      reason: "Generic axle assembly does not identify steering axle; trailer axle is incompatible."
    - row_id: "rear_axle"
      flow: "Finished truck driven-axle assembly"
      reason: "Generic axle assembly does not establish driven axle reduction/complete scope."
    - row_id: "rim"
      flow: "Finished steel rigid-truck wheel rim"
      reason: "Trailer rim candidate does not establish truck wheel application."
    - row_id: "tyre"
      flow: "New radial pneumatic rubber heavy-truck tyre"
      reason: "Generic Tire spans metal/rubber without verified radial heavy-truck construction; motor-car tyre does not establish heavy-truck application. Item reference could be retained with real measured conversion if physical scope matched."
    - row_id: "suspension"
      flow: "Truck pneumatic air-spring suspension module"
      reason: "Search returned unrelated substances, no exact air-spring module."
    - row_id: "disc_brake"
      flow: "Truck pneumatic disc-brake caliper assembly"
      reason: "No matching pneumatic disc-brake caliper identity in bounded searches."
    - row_id: "gearbox"
      flow: "Finished truck automated mechanical gearbox assembly"
      reason: "Wind-turbine gearbox cannot represent truck transmission."
    - row_id: "shaft"
      flow: "Finished steel truck propeller-shaft assembly"
      reason: "Wind-turbine main shaft search result is not vehicle propeller shaft."
    - row_id: "cab"
      flow: "Finished painted and fitted truck cab assembly"
      reason: "Base-vehicle candidate includes chassis/driveline, not a standalone complete cab."
    - row_id: "fuel_tank"
      flow: "Finished aluminium rigid-truck diesel tank"
      reason: "Diesel fuel candidates are not fabricated aluminium tank."
    - row_id: "radiator"
      flow: "Finished truck engine-cooling radiator assembly"
      reason: "No exact radiator assembly identity established; require separate supplier evidence."
    - row_id: "exhaust"
      flow: "Finished diesel-truck SCR exhaust-aftertreatment assembly"
      reason: "Diesel fuel candidates are not SCR hardware; DPF inclusion must be declared."
    - row_id: "harness"
      flow: "Finished insulated-copper vehicle wiring harness"
      reason: "Formed wiring harness record is pre-end-of-line intermediate without exact finished vehicle conductor/completeness."
    - row_id: "starter_battery"
      flow: "Filled lead-acid truck starter battery"
      reason: "Battery candidate is charge/discharge treatment in battery box, not verified finished starter supply identity."
    - row_id: "vehicle_ecu"
      flow: "Finished rigid-truck electronic engine controller"
      reason: "Industrial-machine control scope does not establish a vehicle engine ECU."
    - row_id: "glycol_coolant"
      flow: "Formulated inhibited ethylene-glycol/water engine coolant premix"
      reason: "Wind-farm coolant candidate spans glycol or other fluids; pure glycol is not the formulated engine premix."
    - row_id: "lithium_grease"
      flow: "Lithium-soap mineral-oil chassis grease"
      reason: "Soap/lithium hydroxide candidates are not formulated grease."
    - row_id: "test_diesel"
      flow: "Fossil low-sulphur diesel fuel supplied for factory testing"
      reason: "Fuel-diesel elementary record is not techno supply; transport/agricultural combustion routes are incompatible. Newly retrieved mass-based diesel fuel leaves fossil origin and low-sulphur grade unspecified, so does not establish this specific fuel."
    - row_id: "urea_solution"
      flow: "Aqueous automotive urea solution, 32.5 mass percent"
      reason: "Urea nitrogen fertiliser as N is not vehicle SCR solution concentration."
    - row_id: "spent_coolant"
      flow: "Spent ethylene-glycol/water engine coolant sent to treatment"
      reason: "Spent coolant candidate is machining cutting emulsion, incompatible with engine glycol coolant."
    - row_id: "finished_machine"
      flow: "Accepted configured complete diesel rigid goods vehicle with steel flatbed"
      reason: "Repeated English/Chinese rigid goods vehicle searches return mass-distance freight services, incomplete chassis or mining vehicles, not this completed manufacturing output."
