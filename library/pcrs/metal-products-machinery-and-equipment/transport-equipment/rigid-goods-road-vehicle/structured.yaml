functional_unit:
  what: "Manufacture the configured complete diesel truck"
  how_much: "1 kg net accepted complete truck; convert actual per-machine records with measured M"
  how_well: "Producer configuration-specific dimensional, installation, functional and release acceptance; equal mass does not imply equal payload/service capability"
  how_long_or_cycle: "One manufacture and factory acceptance cycle; no imposed vehicle lifetime"
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_factory
      applies_to: "all processes"
      rule: "Include actual manufacturing, assembly, filling, rework and attributable release tests. Exclude freight operation and research/durability programmes not attributable to production batches; document any shared manufacturing development costs separately."
      source_ids:
        - scania-production
    - rule_id: boundary_modules
      applies_to: "supplier parts"
      rule: "Count complete supplied flatbed/subframe, cab, engine/gearbox, axle and filled battery once with included constituents/prefills; replace component cards if a complete rolling chassis is supplied. Add actual missing BOM components before dataset completion."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Received stock and finished component modules, with supplier completeness declared"
  starting_condition_role: "Foreground receipt-to-dispatch manufacture"
  product_classification_scope: "Complete diesel rigid truck with cargo body; no semi-trailer or transport service"
  recursive_input_rule: "Do not recursively generate a supplied complete truck from its same reference output; bought-in complete modules bypass their performed internal stages"
  upstream_dataset_requirement: "Match actual stock/module scope, propulsion, finish, formulation, geography and properties; disclose unmatched supplier production"
  disclosure: "VIN configuration, actual manufacturing/outsourcing, first fills, M, factory testing, gate/period/site and upstream omissions"
