validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require positive measured M and complete VIN configuration including cargo body, drivetrain, fitted cab, installed equipment and retained fills. Reject semi-trailer, cargo, gross train weight and transport service substitutions."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Verify atomic exchange, public identity, actual reference property/unit group, supply route, material state and medium. Engine exchange must use measured installed supplied engine kg normalized by vehicle M; item count is traceability only and cannot substitute for mass; an incomplete chassis is not a completed flatbed truck; cutting emulsion is not engine coolant; fertiliser as N is not automotive urea solution. Keep incompatible identities blank."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify collection/conversion against same configuration/period and measured M. Reconcile supplier prefills, retained test fuel and component masses without duplication, with no unknown-to-zero defaults."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable factory species and actual medium. Fossil CO2 is air-unspecified and requires fossil provenance; biogenic emissions, NO, NO2, N2O and captured wastes cannot be substituted or merged. Add actual species separately before dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete diesel rigid-truck foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset following qualified review and declared upstream linkage"
  allowed_use: "Supply-chain manufacturing models matching diesel architecture, axle/cab/body configuration, first-fill state, gate/site/period"
  excluded_use: "Freight service or lifetime comparison, equal-mass payload equivalence, alternative propulsion, trailers and unsupported complete cradle-to-gate claims"
  required_metadata: "manufacturer/model; VIN and configuration/drawing revision; diesel engine family and fuel compatibility; gearbox type and supplier prefill; axle arrangement, wheelbase and suspension; cab type and fitted completeness; steel flatbed grade/deck construction, dimensions, mounting/subframe/attachment interface; braking/steering architecture; tyre/rim specification; installed battery/controller/harness; cooling and exhaust-aftertreatment completeness; installed options; actual retained fuel, urea and service fluids; measured net M and scale calibration/tare; separately weighed detached integral components; actual make-or-buy route, site/period, gate and upstream coverage"
  required_quality_disclosure: "Identity/quantity gaps, uncertainty, conditional absence, full-BOM completion, source limitations, allocation and unlinked upstream"
  update_trigger: "Propulsion/fuel, axle/cab/body specification, supplier module scope, fills/M, manufacturing route, site/period and evidence resolution changes"
data_sources:
  - id: "scania-production"
    type: "literature"
    reference: "[Scania Asia P&L](https://www.scania.com/asia/en/home/our-business/p_l.html)"
    used_for: "Press Shop/BiW/Paint/Cab/Chassis paragraphs: separate cab preparation, component integration and end-flow functional inspection. Retrieved 2026-10-05. Example only, not compulsory automation or recipes. Powertrain future 2025 Q4 statement is not evidence of completed/current production; no quantities adopted."
  - id: "volvo-fm"
    type: "literature"
    reference: "[Volvo FM. The flexible specialist.](https://www.volvotrucks.com.au/en-au/trucks/models/volvo-fm.html)"
    used_for: "Opening product paragraph and Help for body builders: rigid diesel architecture and distinct bodybuilder integration, electrical interface, configuration-specific cab choices. Retrieved 2026-10-05. Model example only; electric variants, rated capacities and marketing performance are excluded from rules/factors."
  - id: "body-mount"
    type: "official_guidance"
    reference: "[Scania Parts for Bodybuilding: Chassis frame and subframe](https://truckbodybuilder.scania.com/content/dam/bodybuilder/tbb-files/scania-parts-for-bodybuilding/Chassis_frame_and_subframe.pdf)"
    used_for: "PDF page 1, bodywork attachment table/diagram (historical PDF metadata modified October 2021; no printed edition): chassis/subframe brackets, bolted and welded attachment alternatives. Retrieved 2026-10-05; no edition date visible. Historical interface examples only, not current part availability; bolt sizes are not universal requirements and no mass/loading factor is adopted."
  - id: "scania-spii"
    type: "official_guidance"
    reference: "[SPII - Scania Product Individual Information](https://bodybuilder.scania.com/trucks/en/tools-and-services/individual-chassis-information.html)"
    used_for: "SPII paragraph describes complete specifications and chassis-number lookup. Retrieved 2026-10-05. Supports serial-specific traceability; no specific vehicle record or certificate has been retrieved or validated."
