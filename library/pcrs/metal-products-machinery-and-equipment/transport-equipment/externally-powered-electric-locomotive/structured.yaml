  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_provenance using actual current traceable physical weighing and itemized net-configuration reconciliation. Every included wheel/axle belongs to the same unit and state; reconcile measured detachable fittings/fills and ensure no omitted/double-counted weight. Missing original method, calibration, state correction or positive M blocks a complete quantitative dataset and requires review/new measurement."
      evidence: "original weighing and configuration correction ledger"
    - id: quality_bom
      applies_to: "complete configuration"
      requirement: "Reconcile all actual body, bogie/wheelset, traction, brake, auxiliary/cab/control and service-fluid masses to accepted net M. Record purchased assembly inclusions; no duplicated motors in bogies or transformer/cooling prefills. Add actual omitted parts and exchanges before completion."
      evidence: "complete drawings/BOM/receipts/weighing/SDS"
    - id: quality_balance
      applies_to: "amounts and species"
      requirement: "Retain calibration, energy meters, issues/returns/reuse, measured fluid composition/density, waste manifests and actual emission method/species/medium. Define empirical QA limits from applicable measured records or verified comparable sources. No universal manufacturing intensity, vehicle mass or burner emission factor is supplied."
      evidence: "actual meter/stock/mass balances and uncertainty"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose period/site/configurations, conditional absence, subcontracting, identity/quantity uncertainty, range gaps and missing supplier upstream. Historical product/production examples do not establish present product certification or this locomotive M. This PCR specifies future record requirements; no actual locomotive weighing or plant inventory has been certified."
      evidence: "coverage and evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require covered complete overhead AC configuration and positive actual net M from cp_mass with mass_record_provenance. Reject nominal axle load, catalogue mass, train weight, operating-service equivalents and missing configuration corrections. Missing actual record evidence requires scientific/data review before a completed quantitative dataset."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "all exchanges"
    rule: "Verify atomic physical/chemical identity, public reference property/unit group, route/composition/state and supplier boundary. Pantograph is not battery foil, traction transformer is not a rated distribution transformer, motor inside bogie is not a second input, ester is not mineral oil, process water is not environmental withdrawal/effluent. Keep unsupported UUID blank."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all amounts"
    rule: "Verify amount, original unit, collection and q_item/M conversion, same serial/configuration/site/period, accepted count, calibration and justified allocation denominator. Energy, volume and item count never become mass by renaming the property. Unknown is not zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "conditional elementary releases"
    rule: "Require actual attributable factory-support species and medium. Selected fossil CO2, NO and NO2 are immediate air-unspecified releases; verify fossil provenance for CO2. Do not substitute total NOx, N2O, nitrogen/nitrite, biogenic CO2, water/soil or long-term flows. Captured filter dust is a waste; no exhaust is mandatory for this electric traction route."
    source_ids: []
  - rule_id: validate_release
    applies_to: "vehicle acceptance"
    rule: "Trace actual structural/electrical/brake test procedures, results, rework and release authorization for the same configuration and applicable jurisdiction when claimed. Historical brochure or other manufacturer/model certificate does not certify this vehicle. No universal voltage, brake threshold or test-energy saving is imposed."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configuration-specific complete electric locomotive foreground manufacture"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching AC traction, complete configuration, measured net scope, supplier boundary, gate/site/period"
  excluded_use: "Train-service/lifetime footprint, equal-mass haulage comparison, other power routes, or unsupported complete cradle-to-gate"
  required_metadata: "builder/model/serial and drawing revision; overhead AC voltage/frequency and pantograph configuration; transformer/converter/motor type, rating, cooling and supplier completeness; body steel grade/route; bogie/wheelset/gear/brake configuration; cab/control/auxiliary battery chemistry; actual first-filled fluids and fixed ballast; accepted complete net M in kg from traceable actual weighing records; packaging, persons, loose consumables, sand and temporary test/transport fixture exclusions; physically measured detached integral delivered fittings; acceptance test/gate/site/period; supplier upstream and shared-resource scope"
  required_quality_disclosure: "Identity/quantity/mass-provenance gaps, uncertainty, absence evidence, full BOM, allocation, acceptance and unlinked upstream"
  update_trigger: "Supply/traction/cooling/auxiliary chemistry, body/bogie/finish, supplier completeness, measured M corrections, test boundary and manufacturing site/period changes"
data_sources:
  - id: "siemens-electric"
    type: "literature"
    reference: "[Siemens Vectron X AC/DC/MS](https://www.mobility.siemens.com/global/en/portfolio/rail/rolling-stock/locomotives/vectron/ac-dc-ms.html)"
    used_for: "Publisher headings and paragraphs on AC/DC/MS variants, separated AC/DC main components and accessible control cables. Product-configuration context only; actual site records define this narrower AC route. No catalogue mass/rating or environmental factor adopted."
  - id: "siemens-environment"
    type: "literature"
    reference: "[Siemens: Locomotives, Sustainability on track (2013)](https://static.dc.siemens.com/mobility/webfeature/green-mobility/files/brochure/brochure-locomotives-sustainability-on-track.pdf)"
    used_for: "PDF/printed p.4 optional converter water-cooling and transformer ester; p.8 states features need individual contract confirmation. Historical design example only, not a current universal requirement. No 85 t example, recyclability, lifetime or regenerative-saving percentage adopted."
  - id: "akiem-vectron"
    type: "literature"
    reference: "[Akiem: Vectron BR 193 technical sheet](https://www.akiem.com/wp-content/uploads/2020/09/Fiche-Technique-Vectron-EN.pdf)"
    used_for: "PDF p.1 technical table identifies asynchronous traction motors and distinguishes the AC-only B18 column from multisystem columns. Operator/lessor product example only; do not transfer working-order 90 t, motor count, voltage, ratings or homologations to a generic locomotive or net M."
  - id: "alstom-production"
    type: "literature"
    reference: "[Alstom: First Prima M4 for ONCF, 30 December 2019](https://www.alstom.com/sites/alstom.com/files/2019/12/30/20191230_PR_Locos_Morocco_EN_0.pdf)"
    used_for: "PDF p.1 manufacturing/assembly and named site responsibilities for bogies, motors, traction components and electronics. Historical DC model is outside the covered AC route: used only to distinguish received modules, assembly and downstream testing/maintenance. No DC voltage, rated power or inferred recipe adopted."
