allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacture"
    rule: "Separate serial/configuration orders; directly attribute measured issues/returns, meters, work hours, tests and rework first. For inseparable shared utilities use demonstrated measured causal operating time/load or coating area/layer requirement: share = order driver / sum of drivers over all covered orders. Keep period, denominator and causality. Equal vehicle count, nominal traction power or axle load is not an automatic allocation rule."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "reuse and exported exchanges"
    rule: "Internal stock/water reuse is a transfer, not fresh input or automatic credit. Exported waste retains recipient and measured transfer, without presumed avoided production. Measure actual test electricity imports and exports separately; subtract export only under an explicit matching meter/system-boundary accounting rule with provider and timing, without a lifetime regeneration factor. Reconcile rejected/reworked units and work in progress to accepted output. Separate saleable co-products before reviewed residual allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete locomotive net mass"
      record_type: "traceable_weighing_record"
      raw_fields: "model; configuration; serial; accepted net mass M; original weighing record/date/method; calibrated instrument; wheel/axle measurements if used; measured fills/fixed ballast; measured additions/deductions; excluded persons/sand/test fixtures/packaging; detached integral parts; signed reconciliation; uncertainty"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "actual manufacturing/acceptance period"
      site_scope: "declared manufacturing acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original calibrated physical measurements and signed configuration mass balance"
