measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain original current calibrated actual complete-vehicle weighing or documented wheel/axle-load weighing covering all wheels of the same vehicle on the stated level method, with calibration, zero/tare, repeatability, serial/date/operator and uncertainty. Sum actual simultaneously applicable wheel/axle measurements, reconcile accepted configuration, measured fluid fills/fixed ballast and itemized temporary loads. Convert a working-order measurement to declared net scope only using traceable separately measured additions/deductions. No catalogue weight, design axle-load limit, gross/train weight or unexplained acceptance figure substitutes."
  - id: unit_conversion
    applies_to: "utilities and chemicals"
    required_property_ref:
      name: "original measured property"
      uuid: ""
    required_unit: "actual row unit"
    rule: "Keep Mass, Volume, energy and count distinct. Meter electricity in kWh; 1 kWh = 3.6 MJ from the verified energy unit group. Convert volume or purchased item count to mass only with actual same-formulation density/temperature or measured same-configuration item mass; retain original data. No assumed fluid density or component mass."
