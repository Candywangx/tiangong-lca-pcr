review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "New narrow overhead AC-only steel-bodied complete locomotive manufacturing PCR; separate from motor-vehicle body/material PCRs by rail running gear, HV traction integration and complete-vehicle acceptance. DC, multisystem DC, diesel/off-wire traction battery and EMU routes excluded. Old leaf remains untouched."
  unresolved_flow_identities:
    - row_id: "body_plate"
      flow: "Hot-rolled low-alloy steel locomotive carbody plate"
      reason: "HSLA thick-plate candidate has further-worked classification; exact carbody grade and processing state unresolved."
    - row_id: "body_profile"
      flow: "Hot-rolled steel locomotive underframe structural profile"
      reason: "Building rebar/steel and generic sections do not establish actual underframe profile grade/shape."
    - row_id: "solid_wire"
      flow: "Solid low-alloy steel gas-shielded welding wire"
      reason: "Flux-cored self-shielded wire is not this solid-wire route."
    - row_id: "argon_mix"
      flow: "Argon/carbon-dioxide premixed welding shielding gas"
      reason: "Pure CO2 cannot establish actual premix composition."
    - row_id: "weld_dust"
      flow: "Captured iron-oxide-rich welding filter dust"
      reason: "Airborne elemental iron is not captured oxidized filter waste."
    - row_id: "abrasive"
      flow: "Spherical cast-steel blasting shot"
      reason: "Shot/grit candidates require exact physical grade and route consistency."
    - row_id: "epoxy_base"
      flow: "Formulated epoxy rail-vehicle coating base component"
      reason: "Pure epoxy resin is not a formulated base component."
    - row_id: "epoxy_hardener"
      flow: "Polyamine rail-vehicle epoxy coating hardener formulation"
      reason: "Generic amine does not establish formulated hardener composition."
    - row_id: "spent_abrasive"
      flow: "Spent steel blasting shot with removed coating residue"
      reason: "Generic abrasive waste does not establish actual steel/coating contamination."
    - row_id: "clean_effluent"
      flow: "Aqueous steel-carbody cleaning effluent transferred for treatment"
      reason: "Environmental discharge water cannot represent technosphere treatment transfer."
    - row_id: "body_received"
      flow: "Complete finished steel locomotive carbody with underframe and roof"
      reason: "Public locomotive structural modules describe fabricated body/underframe modules but do not establish the selected complete body including roof, steel route and supplier completeness."
    - row_id: "wheelset"
      flow: "Finished forged-steel locomotive wheelset with axle and wheels"
      reason: "Raw steel/rebar is not a finished configured wheelset."
    - row_id: "pantograph"
      flow: "Complete overhead-wire locomotive pantograph current collector"
      reason: "Battery electrode current-collector foil is not a pantograph."
    - row_id: "main_breaker"
      flow: "Complete rail-locomotive high-voltage vacuum main circuit breaker"
      reason: "Generator circuit breaker and broad electrical-apparatus classes do not establish rail high-voltage vacuum design."
    - row_id: "traction_transformer"
      flow: "Complete oil-filled overhead-AC locomotive traction transformer"
      reason: "Distribution transformer with 400 kVA 10/0.4 kV rating is not an applicable traction transformer."
    - row_id: "traction_converter"
      flow: "Complete locomotive IGBT traction converter assembly"
      reason: "PV inverter and mixed apparatus categories do not establish locomotive traction converter."
    - row_id: "ester_fill"
      flow: "Synthetic-ester transformer insulating liquid formulation"
      reason: "Generic insulation oil does not distinguish synthetic ester from mineral/natural ester; retain actual SDS."
    - row_id: "coolant_fill"
      flow: "Inhibited ethylene-glycol/water traction-cooling fluid formulation"
      reason: "Pure glycol or unspecified coolant lacks actual aqueous concentration/additive formulation."
    - row_id: "copper_cable"
      flow: "Insulated copper rail-locomotive cable harness"
      reason: "Aluminium cable, magnet wire and generic cable lack exact rail harness insulation/completeness."
    - row_id: "aux_lead_battery"
      flow: "Filled lead-acid locomotive auxiliary-control battery"
      reason: "Industrial Lead-Acid Battery has Net calorific value as reference, incompatible with this Mass/kg inventory; do not rewrite public property."
    - row_id: "aux_nicd_battery"
      flow: "Filled nickel-cadmium locomotive auxiliary-control battery"
      reason: "Public nickel-cadmium identity describes cylindrical cells for small devices, with Number of items reference; it does not establish the selected filled locomotive auxiliary battery assembly. Item count alone is not the semantic rejection reason."
    - row_id: "air_compressor"
      flow: "Complete electric locomotive brake-air compressor unit"
      reason: "Generic compressor categories do not establish rail unit supply boundary."
    - row_id: "brake_valve"
      flow: "Complete pneumatic locomotive brake-control valve block"
      reason: "Generic valve/product classes do not establish rail pneumatic brake-control block."
    - row_id: "cab_glass"
      flow: "Laminated safety-glass locomotive cab windscreen"
      reason: "Generic glass does not establish laminated rail windscreen form."
    - row_id: "coupler"
      flow: "Finished steel locomotive automatic coupler assembly"
      reason: "Raw steel or road coupling component is not finished rail automatic coupler."
    - row_id: "adhesion_sand"
      flow: "Dry graded quartz locomotive adhesion sand"
      reason: "Generic sand lacks dry grading and rail adhesion purpose."
    - row_id: "burner_gas"
      flow: "Methane-rich fossil pipeline natural gas supplied to factory burner"
      reason: "Public pipeline candidate is a specific 2012 Jiangsu power-plant composition; cannot transfer that site gas to this factory."
    - row_id: "body_fabrication_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
    - row_id: "surface_finish_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
    - row_id: "running_gear_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
    - row_id: "traction_install_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
    - row_id: "outfitting_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
    - row_id: "acceptance_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
    - row_id: "packing_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Regional voltage/generation-specific public electricity candidates require actual factory intake/provider context; no generic universal grid identity selected."
  unresolved_quantity_ranges:
    - "No actual current locomotive mass, manufacturing intensity or empirical QA ranges supplied; obtain configuration-specific physical measurements and records before quantitative dataset completion."
  evidence_limitations:
    - "Manufacturer public pages and historical 2013/2019 sources support configuration/assembly context only; DC Alstom example does not prove the AC traction design."
    - "No actual locomotive weighing record or plant inventory has been obtained/certified; physical weighing and net-state reconciliation are required future foreground evidence, not established by a finite PCR measurement pass."
    - "No universal mass, lifetime, BOM recipe, threshold, grade certification, regeneration factor or compulsory emission adopted. Unlinked supplier production prevents complete cradle-to-gate claims."
