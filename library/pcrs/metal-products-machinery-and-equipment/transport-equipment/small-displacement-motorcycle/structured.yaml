allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Prefer actual configuration work orders and metered issue/return/test attribution. Match reporting accepted counts to complete output; include actual reject/rework burdens, no dilution by sales or differing configurations."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "First separate processes. Where inseparable, use actual causal machine occupancy, joint length/work time, conditioned surface and test/support energy as appropriate, reconcile common meter totals, record driver units and compare plausible alternatives. No unmeasured equal-per-scooter or mass share for fixed electrical testing."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "No automatic avoided virgin steel, recyclable material or returned fuel credit. Keep internal transfers, outgoing wastes, treatment and real co-products distinct. Economic allocation only for documented genuine co-products when causal physical basis unavailable, retaining actual price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "every accepted scooter"
      temporal_coverage: "matched manufacture/acceptance period"
      site_scope: "actual acceptance/weighing station"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "current scooter-specific method; calibrated all-wheel platform readings/tare; measured fuel-state corrections and fit-list"
    - protocol_id: cp_frame
      process_id: "frame"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "grade/heat/tube-sheet dimensions; issued-returned stock; qualified join work orders/wire/gas if used; kWh; dry offcuts; actual post-control species sampling"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. Record scooter/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_coat
      process_id: "coat"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "actual formulation/SDS and treated surface; wet primer/powder issues, returns/reclaim/retained film; cleaning water; cure/extraction demand and residues/wastewater"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. Record scooter/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "power-unit model/serial/displacement/stroke; supplied engine/CVT/accessories/prefill; installed independent kg; wheel/tyre/suspension/brake/saddle/panel/tank/electrical fit-list; additional oil/coolant and electricity"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. Record scooter/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "serial/configuration; actual test work orders/load/duration/endpoints; regular fuel composition/stock closure; sampling species/concentration/exhaust flow; electric meters; calibrated complete weighing/tare/measured net corrections and independent BOM"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated installed supplied component mass, utility metering or sampled species with measured exhaust flow/time. Record scooter/configuration work orders, accepted count, stock/rework and destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "certificate/SDS, metering/sampling uncertainty, issue-return-stock and count closure"
  calculation_rules:
    - id: normalize_mass
      applies_to: "steel_tube; bracket_sheet; weld_wire; shield_argon; frame_power; steel_scrap; particle_air; epoxy_primer; powder_finish; coat_water; coat_power; wet_paint_residue; xylene_air; power_unit; body_panel; wheel; tyre; front_fork; rear_shock; drum_brake; seat; exhaust; fuel_tank; harness; starter_battery; engine_oil; coolant; assembly_power; test_petrol; test_power; used_oil; fossil_co2_air; no_air; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "Use a calibrated complete-scooter weighing platform supporting all wheels, with controlled tare and no operator, side support or temporary fixture contribution. Preserve serial/configuration, original readings, instrument/calibration, date, repeat readings and uncertainty. Independently measured installed frame, engine-CVT, running gear, equipment and retained technical fluids reconcile M. Missing physical originals prevent dataset use; no catalogue81kg vehicle weight or payload conversion."
      evidence: "original complete weighing and independent installed component records"
    - id: quality_net
      applies_to: "finished_machine"
      requirement: "Preserve measured as-weighed state and signed corrections. Exclude all actual fuel including residual fuel, rider/baggage, temporary fixtures, transport cage/packaging, detached spares/tools. Include installed technical lubricant, coolant, damper oil and battery electrolyte once, in actual declared wet/dry supplied state. Trace corrections to actual draining and weighing records; neither zero residual fuel nor infer M from catalogue curb weight or a guessed BOM."
      evidence: "signed fuel/stock corrections and supplier containment"
    - id: quality_classification
      applies_to: "finished_machine"
      requirement: "Actual released engine identity and displacement documentation must establish reciprocating four-stroke spark-ignition petrol route and single cylinder and total cylinder capacity<=50cm3 for the actual model. The public class49911 flow is broader than this scooter route. Historical Honda49cm3/CVT specifications illustrate configuration only, not current model availability or a mandatory frame/coating recipe."
      evidence: "honda-giorno-2022; actual released model and engine records"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "One actual grade/model/chemical/state per exchange. A supplied complete engine-CVT-clutch/final-drive module requires its own documented identity and installed supplied kg: engine-only class43121 cannot be assumed to contain transmission, and >50cc powertrain or class43110 excluding motor vehicles cannot substitute. Respect official reference property and bilingual name; installed module kg and complete M independently reconcile. Count tracking is supplementary, never falsely Item(s) against Mass."
      evidence: "actual supplier fit-list, direct public identity/property chain"
    - id: quality_release
      applies_to: "elementary"
      requirement: "Collect only physically evidenced actual post-control release with chemical/CAS, immediate medium/submedium, species concentration/exhaust flow/time or actual fuel carbon balance. PM unspecified size is not captured dust, xylene not totalVOC, fossil CO2 not biogenic, NO not NO2/N2O/NOx. Expand other actual combustion/coating species separately when evidenced, and separate fuel biogenic carbon. None is assumed unavoidable; four-stroke route does not prescribe two-stroke premix oil."
      evidence: "original sampling, actual fuel/SDS/carbon and control records"
    - id: quality_acceptance
      applies_to: "acceptance"
      requirement: "Retain actual current released joint/frame alignment, supplied integrated power-unit mount/torque and rear running-gear clearance/interface, CVT clutch/function acceptance, wheel/tyre/suspension, brake/control, fuel/oil/cooling leak, electrical/light and bounded engine/roller function checks and rework. Test endpoints/load/time/fuel return and support inputs are measured. No historical maximum speed, power, fuel economy, tank capacity or regulatory limit establishes a required threshold here."
      evidence: "current model-specific released test plans/results"
    - id: quality_completeness
      applies_to: "dataset"
      requirement: "Reconcile full installed fit-list with issue/return/supplier/meter totals. Add actual separate fasteners/bearings, stand, lights/mirrors/switches/controls/cables, pump/hoses/cooling system, starter/ignition, additional specific panels, grade-specific finish chemicals, wastewater treatment and packaging if not contained. Different front/rear tyre sizes or physically different modules require separate cards; no miscellaneous parts pool or25% mass assumption. Every added exchange needs its own protocol/quantity basis. State measured/calculated/estimated/missing/excluded/not-applicable status, uncertainty and upstream/support/transport/treatment gaps."
      evidence: "complete fit-list and closed actual stock/meter/package records"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Exactly1kg complete accepted declared scooter, measured cp_mass net M and independent component mass balance, same configuration and fuel correction originals. Formula consistency is not physical weighing or methodology approval."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "All rows link valid lowercase IDs/protocols and normalize_mass; match accepted count/period/numerator units. Reject mixed configurations, invalid quantity enum, Mass/Volume/Energy substitution or catalogue conversion."
    source_ids: []
  - rule_id: validation_scope
    applies_to: "dataset"
    rule: "Require actual independent <=50cm3 four-stroke scooter engine/configuration applicability, bounded manufacturing support/trials and disclosed identities/upstream gaps. No transport function or cradle-to-gate completeness claim from foreground alone."
    source_ids: []
  - rule_id: validation_release
    applies_to: "elementary"
    rule: "Verify chemical/CAS/medium/time and actual conditional quantity; purchased water is product, outgoing wastewater treatment is waste, resource abstraction and direct emissions are separate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of a new complete two-wheel petrol scooter with single-cylinder reciprocating spark-ignition four-stroke piston engine of actual total cylinder capacity not exceeding50cm3, welded steel frame and one externally supplied complete engine-CVT-clutch-final-drive power unit; local manufacturing is frame fabrication/finishing, followed by unit mounting, running-gear/equipment integration and factory acceptance, not engine or CVT manufacture. The actual released frame cutting/forming/joining, conditional surface treatment/coating, installed power unit/running gear/body/electrical equipment and bounded factory acceptance define this foreground route. Frame stock grade/cross-section, joining method and supplied package configuration must be declared; no universal alloy, shielding gas or coating recipe imposed. This route is narrower than CPC49911."
  excluded_use: "Exclude >50cc scooters/motorcycles, two-stroke engines, electric/hybrid and non-reciprocating propulsion, horizontally opposed twin-cylinder motorcycles, external longitudinal shaft-drive/final-drive assembly manufacture or alignment, in-house engine/CVT manufacture, auxiliary-motor bicycles, sidecars, tricycles, primarily aluminium/composite frames, complete kits/parts sold separately, repair/overhaul and transport service. Exclude customer riding, passenger-km, fuel economy during use, maintenance, road infrastructure and end of life. Actual factory engine/roller and bounded acceptance movement belong to the manufacturing endpoint only with measured support inputs. Foreground alone is not complete cradle-to-gate or a lifetime mobility comparison."
  required_metadata: "model/released drawing revision/serial; two-wheel scooter, actual <=50cm3 total displacement, single cylinder and four-stroke spark ignition; frame grade/tube-sheet geometry and joining/finish; received power-unit supplier/engine-CVT-clutch-final-drive scope and independent installed kg/prefill; wheel/tyre/suspension/brake/body/saddle/tank/electrical fit-list; oil/coolant/battery chemistry and supplier wet/dry condition; site/period/accepted count/rework; current actual conformity and bounded factory-test plans/results; actual regular test-petrol grade/biogenic share and stock closure; calibrated complete-scooter weighing originals/tare/configuration/net fuel and temporary-stock corrections; independently measured installed BOM mass and uncertainty; net M kg distinct from catalogue vehicle/curb mass and rated payload; upstream utility/transport/treatment coverage and gaps"
  required_quality_disclosure: "Exact scooter fit-list/engine-CVT route/supplier prefill and actual cylinder displacement; actual measured net M/raw corrections and component mass/uncertainty; actual period/site/count/rework/test endpoints; causal allocation/sensitivity; missing identities/physical records and upstream/treatment/support coverage; scientific review pending."
  update_trigger: "Structure/joining/finish or power-unit/running-gear/electrical configuration, supplier/make-or-buy/site/period, fluid/fuel chemistry, trial scope, weighing/delivery state, classification basis and new identity/evidence."
