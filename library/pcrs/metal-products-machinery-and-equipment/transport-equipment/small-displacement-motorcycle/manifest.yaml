review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: Manufacture of a new complete two-wheel petrol
    scooter with single-cylinder reciprocating spark-ignition four-stroke piston
    engine of actual total cylinder capacity not exceeding50cm3, welded steel
    frame and one externally supplied complete engine-CVT-clutch-final-drive
    power unit; local manufacturing is frame fabrication/finishing, followed by
    unit mounting, running-gear/equipment integration and factory acceptance,
    not engine or CVT manufacture. The actual released frame
    cutting/forming/joining, conditional surface treatment/coating, installed
    power unit/running gear/body/electrical equipment and bounded factory
    acceptance define this foreground route. Frame stock grade/cross-section,
    joining method and supplied package configuration must be declared; no
    universal alloy, shielding gas or coating recipe imposed. This route is
    narrower than CPC49911. Exclude >50cc scooters/motorcycles, two-stroke
    engines, electric/hybrid and non-reciprocating propulsion, horizontally
    opposed twin-cylinder motorcycles, external longitudinal
    shaft-drive/final-drive assembly manufacture or alignment, in-house
    engine/CVT manufacture, auxiliary-motor bicycles, sidecars, tricycles,
    primarily aluminium/composite frames, complete kits/parts sold separately,
    repair/overhaul and transport service. Exclude customer riding,
    passenger-km, fuel economy during use, maintenance, road infrastructure and
    end of life. Actual factory engine/roller and bounded acceptance movement
    belong to the manufacturing endpoint only with measured support inputs.
    Foreground alone is not complete cradle-to-gate or a lifetime mobility
    comparison. Substantive architecture is single-cylinder four-stroke
    automatic scooter with external complete engine-CVT-clutch-final-drive
    supply, local welded-frame forming/joining/finishing and complete module
    mounting/fit-list/function acceptance. Foreground unit receipt/independent
    installed kg/contained-fluid reconciliation and mount/running-gear
    clearances differ from in-house opposed-twin propulsion or longitudinal
    shaft transmission manufacture/alignment. Opposed-twin/shaft-drive route
    explicitly outside scope; difference is architecture and make-or-buy
    work/acceptance, not CPC or displacement alone. Coordinator route
    description used only to delimit overlap, no other unfrozen canonical files
    read. Existing material road engines explicitly exclude complete
    vehicles/transmissions; harness and ignition/lighting PCRs represent inputs.
    No complete motorcycle material overlap identified. Old CPC leaf is
    retired/read-only, no alias/mapping/index promoted.
  reference_identity_basis: Public state100 class49911 finished manufactured
    Product flow reference Mass/kg qualified to complete actually configured
    <=50cc four-stroke petrol scooter. Net measured M and installed
    technical-fluid supply scope declared, no catalogue machine mass adopted.
  rejected_engine_scope: CPC43110 excludes motor vehicles and aircraft, cannot be
    scooter main powerplant. Direct class43121 is valid engine-only candidate,
    not automatically integrated engine-CVT/clutch assembly. Direct motorcycle
    powertrain explicitly>50cc rejected for current<=50cc module; retain precise
    power_unit gap.
  evidence_limitations: Honda March2022 specifications historical49cm3
    four-stroke/CVT configuration only, not current production, mandatory recipe
    or M. Yamaha general motorcycle/scooter/outboard process description
    supports process decomposition only; actual released scooter
    drawings/procedures and metering govern specific stock/join/finish and
    quantities.
  unresolved_flow_identities:
    - row_id: bracket_sheet
      selected_flow: Cold-rolled low-carbon steel frame-bracket sheet
      reason: Cold Rolled Plate public English sheet/Chinese alloy rod and alloy
        property conflict; alternative Steel Sheet direct official Chinese
        silver plate and alloy further-worked class41239 do not establish
        unalloyed cold-rolled frame-bracket sheet.
    - row_id: weld_wire
      selected_flow: Solid carbon-steel gas-shielded welding wire
      reason: Direct Flux Cored Wire is flux-cored/self-shielded route rather than
        solid gas-shielded wire; welding service not wire supply.
    - row_id: shield_argon
      selected_flow: Pure argon welding shielding gas
      reason: Initial and refined30 candidates did not establish pure supplied welding
        argon; unrelated pharmaceutical or multi-process welding identities
        rejected semantically.
    - row_id: epoxy_primer
      selected_flow: Formulated epoxy steel-frame anticorrosion primer
      reason: Industrial Maintenance Coatings is collective maintenance coating, not
        exact supplied frame primer formulation.
    - row_id: powder_finish
      selected_flow: Formulated polyester thermosetting frame-coating powder
      reason: Powdered Aluminium result is metallic aluminium powder, not formulated
        polyester thermoset coating.
    - row_id: power_unit
      selected_flow: Finished single-cylinder four-stroke <=50cc scooter engine-CVT
        power-unit assembly
      reason: Class43121 <=1000cc engine is engine alone; does not establish supplied
        engine-CVT-clutch module. Direct reciprocating ICE powertrain
        explicitly>50cc, outside this product. Whole motorcycle not a power
        unit.
    - row_id: body_panel
      selected_flow: Finished injection-moulded polypropylene scooter leg-shield panel
      reason: Refined candidates resin-related chemicals and broad plastic parts do
        not establish one finished actual scooter leg-shield panel.
    - row_id: wheel
      selected_flow: Finished cast-aluminium scooter road wheel
      reason: Aluminium hub direct Number of items and class49129 motor-car part do
        not establish motorcycle wheel scope; actual quantity-to-mass conversion
        alone cannot cure product mismatch.
    - row_id: front_fork
      selected_flow: Finished scooter telescopic front-fork assembly
      reason: Refined fork candidates optical/kitchen/tuning forks and generic
        frame/mechanical assemblies; not actual telescopic scooter front
        suspension.
    - row_id: rear_shock
      selected_flow: Finished scooter rear spring-damper unit
      reason: REE suspension query candidate is not a physical scooter spring-damper
        unit.
    - row_id: drum_brake
      selected_flow: Finished mechanically actuated scooter drum-brake unit
      reason: Direct Brake assembly synonyms wheelchair brake and class42999 generic
        metal goods do not establish specific finished scooter drum unit; pooled
        miscellaneous motorcycle parts likewise cannot substitute.
    - row_id: seat
      selected_flow: Finished upholstered scooter saddle assembly
      reason: Seat components metal/polymer is a collective component supply, not
        completed upholstered saddle.
    - row_id: exhaust
      selected_flow: Finished scooter exhaust silencer with catalyst
      reason: Refined whole vehicles, glider subassemblies and miscellaneous
        motorcycle parts are not one completed exhaust/catalyst package.
    - row_id: fuel_tank
      selected_flow: Finished steel scooter petrol tank
      reason: Tank queries return pyrolysis and waste activated-carbon identities, no
        matching supplied steel scooter tank established.
    - row_id: starter_battery
      selected_flow: Finished lead-acid scooter starter battery
      reason: Industrial Lead-Acid Battery public reference Energy/NCV and forklift
        scope do not establish scooter starter; other Mass candidate class17100
        electricity conflicts. No property rewritten.
    - row_id: engine_oil
      selected_flow: Formulated mineral four-stroke petrol-engine lubricating oil
      reason: Direct lubricating-oil reference specifically PAO full-synthesis
        contradicts required mineral formulation and its generic petroleum
        commentary; no route substitution.
    - row_id: coolant
      selected_flow: Formulated ethylene-glycol scooter engine coolant
      reason: Direct coolant explicitly for wind power plants
        replenishment/replacement, not scooter installed-engine formulation;
        neat ethylene glycol not supplied formulation.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
