  semantic_boundary_decision: "Manufacture of a new complete paired mechanical
    semi-trailer support assembly: matched driven two-speed internal-gear leg
    and follower leg, welded square-steel telescopic housings, screw/nut lifting
    mechanisms, rigid steel feet, connecting cross shaft and manual crank. This
    route fabricates housings, mounting flanges/stiffeners and rigid feet
    locally from identified stock and assembles supplied finished
    screw/gear/shaft components. Conditional actual local powder coating with
    electric cure is included. Gear cutting, casting, heat treatment or spindle
    machining inside bought modules is upstream, not presumed local. Actual
    released drawing, travel/mount/foot configuration and supplier contents
    control applicability. Exclude complete trailers/tractors, separately
    supplied spare single legs, general-purpose jacks,
    hydraulic/powered/electric landing gear, drop-leg/pin-only supports,
    airbag/cushion feet, complete-leg assembly-only routes and raw
    casting/gear-making routes. Other trailer axles, suspension, braking,
    couplings and freight-body parts are outside this output. Exclude
    installation onto a customer trailer, coupling/parking/lifting services,
    load transport, in-use maintenance and end of life. Factory setup,
    inspection and actual attributable acceptance/type/sample tests remain
    foreground; this module alone is not complete cradle-to-gate. Existing
    material agricultural self-loading/unloading trailer explicitly excludes
    sold parts. Existing pulley-tackle/hoists/winches/jacks PCR has broad
    standalone lifting-device scope and reusable generic
    material/utility/mass/allocation controls, but no linked driven/follower
    trailer support-pair output or paired shaft/stroke synchronization,
    trailer-specific mounting/overlap, standalone component dispatch and
    grease-content closure. This PCR is limited to that distinct paired
    trailer-component route; a standalone jack remains under the lifting-device
    PCR. No frozen material paired manual landing-support manufacturing method
    was found in current worktree scan. Specific need is housing weld/overlap,
    screw/nut load path, two-speed drive and follower synchronization,
    shaft/crank retention, precharge closure and complete paired
    acceptance/weighing. Not a duplicate trailer record or classification-only
    identity. Do not read other authors unfrozen canonicals; old leaf
    unchanged."
  reference_identity_basis: Direct public Semi-trailer landing gear is a purchased
    component installed in final assembly with class49129 and illustrative1%
    trailer-mass assumption; it does not specify complete paired manual
    internal-gearing rigid-foot supply contents at standalone manufacturer
    dispatch. Exact configured reference identity not established; original
    Mass/kg retained and no1% conversion adopted. Classification discrepancy
    disclosed, no database-absence claim. Exact reference name equals
    finished_machine output and precise candidate gap is registered.
  evidence_limitations: JOST retained official A440 structure, powder-coating
    capability and weld/housing slides establish bounded architecture/process
    examples only. LT LG400-01 RevD parts diagram physical page1 printed8of8
    supports historical component/content distinction, not current
    interchangeability. Dates not established; no dimensional specification,
    load rating, gear ratio, warranty/life,10-stage cleaning recipe or test
    threshold generalized. Current actual release records and
    weighing/acceptance required.
  unresolved_flow_identities:
    - row_id: plate
      selected_flow: Hot-rolled unalloyed steel mounting-and-foot plate stock
      reason: Direct Steel Plate candidate421db3a5 is low-alloy high-strength thick
        plate/class41239, not unalloyed specified stock. Candidate92714144
        Chinese pools steel/aluminium/alloy and incoming pipe-mill state;
        precise unalloyed plate identity not established.
    - row_id: weld_wire
      selected_flow: Solid carbon-steel welding filler wire
      reason: Generic Steel Wire has no welding-filler chemistry/supply qualification
        established; Flux Cored Wire has a flux-filled self-shield route, not
        actual solid wire. Refined search also returns copper electrical Solid
        Wire, not matched steel filler.
    - row_id: shield_co2
