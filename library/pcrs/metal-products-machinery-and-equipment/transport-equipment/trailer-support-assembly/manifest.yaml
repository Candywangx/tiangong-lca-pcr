      reason: Direct shielding-gas candidatecf3aee56 reference property Volume*time
        and proxy CO2-for-unspecified-mixture scope; no true gas-state/mass
        conversion originals available here. Property not rewritten Mass and
        elementary atmospheric CO2 not substituted.
    - row_id: powder_residue
