allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Attribute actual issues/returns/meters/work orders to the same drawing/configuration and accepted complete pair count. Include actual rejects/rework/sample-test burden; no sales/mixed-leg count, assumed yield or1% trailer-mass estimate."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "Separate operations first. If inseparable, document actual causal welding/fixture time, treated area/cure occupancy and test-station demand. Reconcile meter totals and test alternative drivers; fixed pair inspection not automatically mass-proportional."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "Distinguish internal reuse, outgoing scrap/residue treatment and genuine co-products. No automatic avoided steel/powder credit. Economic allocation only when actual genuine co-product and no causal physical driver, with actual price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "every accepted complete pair"
      temporal_coverage: "matched manufacturing period"
      site_scope: "actual complete weighing station"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "complete-pair calibrated weighing/tare/configuration; independent installed stock/module/grease mass closure"
    - protocol_id: cp_frame
      process_id: "frame"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "stock grade/heat/section/drawing; issues/returns/cuts; weld procedure/filler/shield identity; metered electricity; dry scrap and actual post-control sampling"
      collection_method: "Record each actual exchange separately by identified supplier issues/returns, independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier part contents/formulation; calibration/sampling uncertainty; issue-return-stock/count closure"
    - protocol_id: cp_coat
      process_id: "coat"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "actual cleaner/SDS/powder issue-return-reclaim/retained film; makeup water; electric cure/extraction; segregated wastewater/residue"
      collection_method: "Record each actual exchange separately by identified supplier issues/returns, independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier part contents/formulation; calibration/sampling uncertainty; issue-return-stock/count closure"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "matched pair/supplier part numbers and contents; installed component kg/count trace; thread/tooth/shaft/clearance/retention; incremental grease kg and precharged closure"
      collection_method: "Record each actual exchange separately by identified supplier issues/returns, independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier part contents/formulation; calibration/sampling uncertainty; issue-return-stock/count closure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "pair serial/drawing/configuration; current inspection/test plan results; accepted/reject/tested count; test-support meter; complete calibrated net weighing/tare and independent BOM mass"
      collection_method: "Record each actual exchange separately by identified supplier issues/returns, independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier part contents/formulation; calibration/sampling uncertainty; issue-return-stock/count closure"
  calculation_rules:
    - id: normalize_mass
      applies_to: "outer_tube; inner_tube; plate; weld_wire; shield_co2; fabrication_power; steel_scrap; particle_air; powder; water; coating_power; powder_residue; powder_particle_air; screw_nut; shift_module; bevel_gear; bearing; cross_shaft; crank; grease; cover_screw; assembly_power; test_power; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "Weigh the complete accepted same-configuration pair on a calibrated platform with all installed feet/shaft/crank/covers/retention and grease, controlled tare and no trailer, operator, test load or temporary support fixture in net M. Retain original readings/serial/configuration/date/instrument/calibration/repeats/uncertainty; independently reconcile housing/foot, supplied mechanisms, shafts/crank/fasteners/finish and retained grease masses to M. Missing originals block dataset use."
      evidence: "original complete-pair weighing and independent installed BOM masses"
    - id: quality_pair
      applies_to: "finished_machine; assembly"
      requirement: "One accepted unit means the matched drive/follower pair, not one leg. Declare actual travel/mount, rigid foot, cross-shaft length/interface, crank/hanger, covers and supplied bracket inclusion. Different leg types/variants separated; detached transport parts reassembled for complete weighing. Customer-trailer bracing/mount hardware excluded unless explicitly supplied in this reference; no loose spares/packaging in M."
      evidence: "parts-method; actual current fit-list and dispatch records"
    - id: quality_loadpath
      applies_to: "frame; assembly"
      requirement: "Trace released square tube grades/geometry, weld procedure/inspection, stiffener/foot interfaces, telescopic alignment/overlap/clearance, screw/nut thread/retention and thrust-bearing load path. Confirm actual two-speed shift engagement and synchronized drive/follower travel with compatible shaft/crank. Manufacturer weld slide supports fabrication example, not universal weld length/grade/thickness. Supplier heat treatment is upstream unless actually local."
      evidence: "build-method; jost-method; actual drawings and joint/fit acceptance"
    - id: quality_grease
      applies_to: "grease; screw_nut; shift_module; bearing"
      requirement: "Retain actual lubricant SDS/formulation/base-oil/thickener/temperature suitability and weighed initial fill/return/loss/retained mass. Supplier precharged grease counted inside modules once; only actual additional grease separately input. No wax-solvent lubricant, lithium hydroxide or generic oil substituted. Seal/pin/bushing contents tracked individually when not inside module."
      evidence: "jost-method; supplier SDS and measured fill balance"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "Retain actual public reference properties. Noncircular welded tube matches square stock, not circular Steel Pipe. Public Semi-trailer landing gear does not establish this exact complete standalone paired output and its classification49129 discrepancy/illustrative1% trailer share are disclosed, not adopted. Unresolved reference registered by exact finished_machine and matching name. Shield gas Volume*time is not measured kg; powder-waste Aluminium content not total mass."
      evidence: "direct public flow/property/unit-chain originals and supplier configuration"
    - id: quality_acceptance
      applies_to: "acceptance"
      requirement: "Require current released model-specific inspection/test plan and actual results for weld/geometry, full permitted stroke, shift engagement, paired travel, shaft/crank/foot retention, sealing/lubrication and finish. Actual contractual proof/type/sample load tests record configuration, support/bracing method, load/torque instruments, edition, laboratory, test count/period, consumed support and rejects; do not apply capacities conditional on installed trailer bracing as universal standalone acceptance or prescribe numeric test thresholds."
      evidence: "jost-method; actual current inspection/test contract and originals"
    - id: quality_release
      applies_to: "elementary"
      requirement: "Only actual evidenced post-control immediate-air particulate mass from sampling/concentration/exhaust/time or direct mass measurement. Captured dust/residue waste separate. No automatic VOC, welding-gas carbon emission or upstream electricity emissions as direct factory emissions; any actual species/gas/fuel needs separate matched atomic record."
      evidence: "actual original sampling and waste balance"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Close all actual drawing/fit-list/stock/meter items, including separate follower gear/shaft, pins/bushings/seals/springs/nuts/washers/grease fittings/covers/crank hanger, other plate grades, actual cleaners/wastewater/captured dust/packaging and utilities when not already contained. Add each actual physical/chemical exchange separately with quantity/protocol. Distinguish measured/calculated/estimated/missing/excluded/not-applicable; disclose upstream module/stock/transport/support/treatment gaps. No generic trailer-parts pool or invented completeness."
      evidence: "parts-method; current complete fit-list, stock/meter and supplier records"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Exactly1kg of complete accepted declared matched support pair; reference name equals finished_machine. Candidate blank UUID only with precise registered identity. Require original cp_mass M kg and independent complete-pair mass closure; finite checks do not approve physical data or methodology."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "Check actual lowercase row/rule/protocol references, same-configuration accepted pair denominator, period, original quantity units and normalize_mass links. Reject mixed pair/single-leg counts, catalogue/load/1% conversions and property substitution."
    source_ids: []
  - rule_id: validation_scope
    applies_to: "dataset"
    rule: "Verify actual local housing/foot fabrication, manual internal two-speed paired screw architecture, declared purchased contents and complete factory acceptance. Whole trailer manufacture/service, powered/hydraulic/drop legs and purchased complete-leg-only assembly do not inherit this scope."
    source_ids: []
  - rule_id: validation_release
    applies_to: "elementary"
    rule: "Actual medium/particle state and post-control mass only. Purchased tap-water product, resource abstraction, wastewater, captured dust treatment and direct air release remain separate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of a new complete paired mechanical semi-trailer support assembly: matched driven two-speed internal-gear leg and follower leg, welded square-steel telescopic housings, screw/nut lifting mechanisms, rigid steel feet, connecting cross shaft and manual crank. This route fabricates housings, mounting flanges/stiffeners and rigid feet locally from identified stock and assembles supplied finished screw/gear/shaft components. Conditional actual local powder coating with electric cure is included. Gear cutting, casting, heat treatment or spindle machining inside bought modules is upstream, not presumed local. Actual released drawing, travel/mount/foot configuration and supplier contents control applicability."
  excluded_use: "Exclude complete trailers/tractors, separately supplied spare single legs, general-purpose jacks, hydraulic/powered/electric landing gear, drop-leg/pin-only supports, airbag/cushion feet, complete-leg assembly-only routes and raw casting/gear-making routes. Other trailer axles, suspension, braking, couplings and freight-body parts are outside this output. Exclude installation onto a customer trailer, coupling/parking/lifting services, load transport, in-use maintenance and end of life. Factory setup, inspection and actual attributable acceptance/type/sample tests remain foreground; this module alone is not complete cradle-to-gate."
  required_metadata: "model/drawing revision/serial or lot; matched drive/follower pair; internal two-speed gear architecture; square tube grade/heat/section/wall/straightness/overlap; mounting flanges and rigid-foot geometry; actual stroke/gear ratio/crank/shaft interfaces; screw/nut/bearing/gear materials and supplier heat-treatment/contents; coating formulation and actual cure route; grease identity/incremental fill/precharged contents; complete dispatch inclusion of feet/shaft/crank/covers/fasteners; site/period/accepted pair count/rework/test attribution; current contractual acceptance; original calibrated complete-pair net M kg and independent installed BOM mass; upstream missing identities and scope"
  required_quality_disclosure: "Candidate scientific review pending. Actual pair net M originals/uncertainty/BOM closure, configuration and supplier prefill, current weld/fit/test results and count attribution, causal shared allocation, unresolved identities and upstream/support/transport/treatment gaps. Per-kg manufacture not lifting-service equivalence or approved complete cradle-to-gate."
  update_trigger: "Tube/plate/weld/foot/gear/shaft/crank/grease/finish and supply route changes; site/period/test scope/net weighing/configuration changes; new identities or evidence."
data_sources:
  - id: "jost-method"
    type: "handbook"
    reference: "JOST International, A440 Series official overview and gearbox/grease features; undated, unpaginated. https://jostinternational.com/landing-gear-a440-series"
    used_for: "Internal mechanical gearing, screw enclosure, supplier gear material/prefill and conditional installed-bracing context. Model-specific architecture only; no catalogue load/ratio/warranty life or universal material/process requirement adopted."
  - id: "build-method"
    type: "handbook"
    reference: "JOST International, Why I Should Buy A JOST Landing Gear, undated; PDF physical pages4-5, printed slides4-5. https://jostinternational.com/hubfs/Jost_International_April_2024/Pdf/Why-I-Should-Buy-A-JOST-Landing-Gear.pptx-compressed.pdf?hsLang=en"
    used_for: "Visually checked welded formed stiffeners and telescoping upper/lower housing as manufacturing example. No pictured dimensions, thickness or load threshold mandated. Current drawings determine actual stock and joint procedure."
  - id: "parts-method"
    type: "handbook"
    reference: "JOST International, LT LG400-01 RevD Parts Breakdown; undated historical diagram, PDF physical page1, printed page8of8. https://jostinternational.com/hubfs/Jost_International_April_2024/Pdf/Parts-Breakdown.pdf?hsLang=en"
    used_for: "Distinct housing, drive/follower, cross shaft, crank, bearings, gears and contents interfaces; historical assembly depiction only. No current interchangeability, fixed quantities or part numbers prescribed. Current actual supplied BOM overrides example."
  - id: "finish-method"
    type: "handbook"
    reference: "JOST International, Powder Coating official capability page; undated, unpaginated, Powder coating to the highest quality standards/Available services. https://jostinternational.com/powder-coating"
    used_for: "Surface preparation/powder finishing possibility, not proof every leg or factory uses it. No10-stage recipe, thickness, certifications, generic cure energy or life adopted; actual local process/SDS/meters required."
