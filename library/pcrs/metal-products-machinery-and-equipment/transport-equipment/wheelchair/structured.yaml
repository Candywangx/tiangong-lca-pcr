allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Prefer actual drawing/configuration work orders and stock/meter attribution. Match accepted complete chair count to the same manufacturing period; include actual rejects/rework/destructive test burden. Do not divide by sales, mixed configurations or assumed universal batch yield."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "First separate operations. If inseparable, actual causal machine occupancy/joint work, coated surface/cure occupancy and inspection/test equipment demand determine documented drivers. Reconcile shared meter totals and compare plausible alternatives; fixed inspection burden is not automatically proportional to chair mass."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "Separate internal recycle, outgoing scrap/powder waste, treatment and genuine co-products. No automatic avoided virgin steel/paint credit. Economic allocation only for documented genuine co-products when causal physical basis unavailable, with actual price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "every accepted wheelchair"
      temporal_coverage: "matched manufacture/acceptance period"
      site_scope: "actual complete weighing/acceptance station"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibrated all-wheel platform readings/tare; complete installed accessories and no operator/test masses/packaging; independent component mass"
    - protocol_id: cp_frame
      process_id: "frame"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "tube/sheet grade/heat/dimensions and issued-returned kg; drawing/joint procedure/jig orders; actual filler/gas if used; kWh; dry scrap; post-control species sampling"
      collection_method: "Record each actual exchange separately by identified supplier issue/return and independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier formulation/fit-list, calibration/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_coat
      process_id: "coat"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "actual formulation/SDS and treated surface; powder issue/return/reclaim/retained film; cleaning water/chemicals; cure/extraction meters and segregated residues"
      collection_method: "Record each actual exchange separately by identified supplier issue/return and independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier formulation/fit-list, calibration/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "actual wheel/caster/tyre/handrim/axle/lock and seat/back/support fit-list; supplier package contents; installed independent kg; pivot/fastener/retention and alignment/clearance/torque checks"
      collection_method: "Record each actual exchange separately by identified supplier issue/return and independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier formulation/fit-list, calibration/sampling uncertainty, issue-return-stock and count closure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "serial/configuration; released acceptance/type/sample plan/results/period/accepted/rejected count; test equipment meters; calibrated complete weighing/tare/accessory/temporary test mass and independent installed BOM"
      collection_method: "Record each actual exchange separately by identified supplier issue/return and independently weighed installed kg, calibrated utility meters or actual post-control species sampling/exhaust/time. Record model/drawing/configuration, work orders, stock/rework, same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual manufacturing/test sites and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier formulation/fit-list, calibration/sampling uncertainty, issue-return-stock and count closure"
  calculation_rules:
    - id: normalize_mass
      applies_to: "steel_tube; bracket_sheet; weld_wire; shield_argon; frame_power; steel_scrap; particle_air; coating_powder; coat_water; coat_power; powder_residue; powder_particle_air; rear_wheel; front_caster; wheel_lock; seat_sling; back_sling; footrest; armrest; grip; steel_screw; pivot_pin; assembly_power; test_power; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "Weigh the complete accepted same-configuration chair on a calibrated platform supporting all wheels, with controlled tare and no operator, support handle/fixture or added test load. Retain serial/configuration, original readings, instrument/calibration, date, repeats and uncertainty. Independent installed frame, cross-brace, wheel/caster, seating/support/lock/fastener/accessory masses reconcile M; missing physical originals prevent dataset use."
      evidence: "original complete weighing and independent component records"
    - id: quality_complete
      applies_to: "finished_machine"
      requirement: "Declare exact installed arm/footrest/seat/back/wheel and accessory configuration, including installed cushion/belt/anti-tip devices when supplied as part of the reference. Reassemble detached delivery supports before weighing; detached spares/cushions and packaging outside M. Retained bearing grease contained once. Catalogue folded/unfolded dimensions, brochure41lb or transport shipping weight cannot replace current complete M."
      evidence: "actual released installed fit-list and signed weighing state"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "One exact stock grade/formulation/part/medium per exchange. A frame-only or brake identity cannot represent complete wheelchair, even if Mass/kg agrees. Adopted purchased wheelchair brake is qualified to actual mechanical parking lock, not dynamic brake. Supplied powder is one identified dry formulation, not a coating service; powder-waste Aluminium-content property not total waste Mass. Actual public property retained; conversions need original evidence."
      evidence: "direct public identity/property and actual supplier drawings/SDS"
    - id: quality_architecture
      applies_to: "frame; assembly"
      requirement: "Trace actual welded steel tube/joint procedure and folding cross-brace/pivots to released drawings. Verify folding retention, axle/caster/handrim compatibility and clearances, seat/back attachment, footrest/arm locking and parking-lock alignment. Material name, cross-brace count or a standard citation alone does not prove strength or clinical fit. RESNA2004 brazed prototype is counterevidence to treating all steel chairs as one weld recipe."
      evidence: "intco-components; resna-india-2004; actual released drawings"
    - id: quality_acceptance
      applies_to: "acceptance"
      requirement: "Retain current applicable model/configuration conformity and factory inspection/test plans/results for joint/frame alignment, fold/pivot/retention, wheel/caster rotation/tracking, parking-lock holding/function, seating/arm/footrest attachment and finish. Type/sample/destructive tests need actual tested configuration, method/edition/laboratory/result, sampled count/period, support demand and reject attribution. No ISO threshold/cycle number/patient load or universal lifetime copied from source; actual contractual requirements independently evidenced."
      evidence: "intco-components; actual released inspection/test plans"
    - id: quality_release
      applies_to: "elementary"
      requirement: "Only actual evidenced post-control particulate release, immediate air/unspecified size with concentration/exhaust/time or directly measured mass. Captured powder/dust goes to waste, not air. Expand actual size-resolved particles or chemical species with distinct compatible identities if found; powder coating does not justify assumed solvent VOC, and upstream electricity emissions are not direct factory emissions."
      evidence: "original post-control sampling and measured waste balances"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Reconcile every installed drawing/fit-list item with supplier/stock/meter totals. Add actual different rear wheels/casters, bearings/axles/handrims, grips, arm pads, heel loops, cross-brace bushings, pins/bolts/nuts/washers, labels, optional anti-tip/belt/cushion and actual coating cleaners/wastewater/carton whenever not contained. Each physical/chemical exchange one card/protocol and quantity basis; no generic wheelchair-parts pool. Identify measured/calculated/estimated/missing/excluded/not-applicable status and uncertainty; disclose upstream stock/module/support/transport/treatment gaps."
      evidence: "complete actual fit-list, independently closed stocks/meters"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Exactly1kg complete accepted declared manual chair; reference name equals finished_machine name. Blank product UUID permitted only with precise candidate identity gap. cp_mass actual M and independent complete configuration/installed mass reconciliation required; formula pass does not approve physical data or methodology."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "Every row links supported lowercase IDs/protocols and normalize_mass. Verify same-configuration actual accepted count, period and numerator unit; reject mixed configurations, invalid enums, Mass/Energy/content/count substitution and catalogue conversions."
    source_ids: []
  - rule_id: validation_scope
    applies_to: "dataset"
    rule: "Require actual manual handrim/solid-tyre folding welded-steel architecture, declared make-or-buy local fabrication, mechanical acceptance and identity/upstream gaps. Clinical fit, mobility outcomes and cradle-to-gate completeness cannot be inferred from this foreground."
    source_ids: []
  - rule_id: validation_release
    applies_to: "elementary"
    rule: "Verify actual immediate-air particle state/medium and conditional quantity. Purchased tap water product, outgoing wastewater/waste dust treatment, resource abstraction and direct emission remain separate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of a new complete adult manual wheelchair with folding cross-brace welded steel-tube frame, powder-coated finish where applied, handrim rear wheels with solid polyurethane tyres, front casters and separately supplied seat/back slings, arm supports, swing-away footrests and mechanical parking wheel locks. Actual released tube cutting/bending/jigging/joining, conditional cleaning/powder/electric cure, component mounting/adjustment and configured factory acceptance form the foreground. Actual stock grade, joints, supplier module contents and complete installed accessories define this route, not a universal chair design or material recipe."
  excluded_use: "Exclude powered or power-assisted chairs/batteries/motors, attendant-only small-wheel transport chairs without handrims, rigid/sports/carbon/titanium/aluminium-frame chairs, pneumatic-tyre routes, reclining/standing or complex custom seating systems, repair/refurbishment and complete-frame assembly-only manufacture. Brazed-only frame route is outside this welded-frame boundary. Exclude clinical assessment/prescription/fitting, personal mobility service, occupied distance, user/attendant energy, use-phase maintenance and end of life. Bounded factory adjustment/inspection/type or sample tests belong to manufacturing when attributable; this foreground is not a complete cradle-to-gate or clinical-outcome/lifetime service model."
  required_metadata: "model/released drawing revision/serial; adult manual handrim/folding cross-brace architecture; seat width/depth/back and arm/footrest actual variant; frame tube/sheet grade/geometry/joint and finish; wheel/solid tyre/handrim/caster/fork/axle/lock/bearing specification and supplier contents; upholstery actual fabric/coating/seam/attachment; installed supports and accessories/cushion/anti-tip/belt inclusion; site/period/accepted count/rework and inspection/type/sample test basis; current applicable contract and configuration-specific conformity/acceptance; original complete calibrated weighing/tare/net state and independent installed component mass; net M kg excludes user/test masses/packaging/detached parts, differs from catalogue weight/load rating; upstream stock/component/utility/transport/treatment gaps"
  required_quality_disclosure: "Exact chair drawing/installed configuration and supplied-package state; actual complete M/calibration/tare/independent component mass/uncertainty; actual stock/meter/test periods and accepted/rejected counts; type/sample/inspection attribution and causal shared allocation sensitivity; missing physical records/identities and upstream/support/treatment scope; scientific review pending."
  update_trigger: "Frame grade/joint/folding mechanism/finish, wheel/caster/lock or seating/support configuration, supplier/make-or-buy/site/period, test scope, weighing/delivery state and new identities/evidence."
data_sources:
  - id: "drive-silversport"
    type: "handbook"
    reference: "Drive Medical, SilverSport2 SSP218FA-SF official product page, undated, About This Item steel frame/vinyl/solid polyurethane-composite wheels/supports/wheel locks and configuration options; unpaginated. https://shop.drivemedical.com/us/en/products/mobility/wheelchairs/standard-wheelchairs/silver-sport-2-wheelchair/p/SSP218FA-SF"
    used_for: "Specific finished configuration illustration only; no current clinical conformity, compulsory model/recipe,41lb net M, rated load, warranty life or factory quantity adopted. Actual supplier composition/complete installed weighing and released drawings govern."
  - id: "intco-components"
    type: "handbook"
    reference: "INTCO, Manual Wheelchair Anatomy and Components, site date3September2026; Frame and cross-brace / Wheels, casters... / Seating, backrest... / Brakes, locks...; unpaginated. https://www.intcowheelchair.com/news/manual-wheelchair-structure-and-components"
    used_for: "Component interfaces, exact configuration/fit-list, join/fold/retention/lock and supplier inspection/control context. Does not prove specific compliance or clinical suitability. Listed ISO numbers not adopted as numeric rules/current legal requirements; actual applicable contract/test originals required."
  - id: "resna-india-2004"
    type: "literature"
    reference: "RESNA2004 original proceedings, Design and development of a manual wheelchair for India, DESIGN and DEVELOPMENT, unpaginated HTML. https://www.resna.org/sites/default/files/legacy/conference/proceedings/2004/Papers/StudentScientific/Winners/Wheelchair.html"
    used_for: "Historical folding steel-tube/flat-stock manufacturing and component-quality illustration only; separates welded description from brazed prototype. No1020grade,2mmthickness, prototype mass, fatigue cycles, life, universal joint process or present standard compliance inferred."
