  semantic_boundary_decision: Manufacture of a new complete adult manual
    wheelchair with folding cross-brace welded steel-tube frame, powder-coated
    finish where applied, handrim rear wheels with solid polyurethane tyres,
    front casters and separately supplied seat/back slings, arm supports,
    swing-away footrests and mechanical parking wheel locks. Actual released
    tube cutting/bending/jigging/joining, conditional cleaning/powder/electric
    cure, component mounting/adjustment and configured factory acceptance form
    the foreground. Actual stock grade, joints, supplier module contents and
    complete installed accessories define this route, not a universal chair
    design or material recipe. Exclude powered or power-assisted
    chairs/batteries/motors, attendant-only small-wheel transport chairs without
    handrims, rigid/sports/carbon/titanium/aluminium-frame chairs,
    pneumatic-tyre routes, reclining/standing or complex custom seating systems,
    repair/refurbishment and complete-frame assembly-only manufacture.
    Brazed-only frame route is outside this welded-frame boundary. Exclude
    clinical assessment/prescription/fitting, personal mobility service,
    occupied distance, user/attendant energy, use-phase maintenance and end of
    life. Bounded factory adjustment/inspection/type or sample tests belong to
    manufacturing when attributable; this foreground is not a complete
    cradle-to-gate or clinical-outcome/lifetime service model. Existing material
    scan found no complete wheelchair overlap. Semantic need is load-bearing
    folding frame/pivot controls, handrim/caster/parking-lock compatibility,
    seating/support attachment, mechanical factory acceptance and complete
    installed configuration/net weighing; not a generic chair, motor vehicle or
    code-only identity. Old scaffold remains read-only, no alias/mapping/index
    promoted.
  reference_identity_basis: Reference product and finished_machine exact name
    agree. State100 frame candidates represent frame-only coated/uncoated
    intermediates with class48171/48172, cannot represent complete wheelchair.
    Blank reference identity precisely registered;
    candidate/authored_methodology fallback applies. Net actual M kg supported
    independently, not catalogue chair weight/patient load.
  evidence_limitations: "Drive undated SilverSport2 product case supports
    powder-coated steel frame/vinyl/specific wheel and support configuration
    only. INTCO2026-09-03 component framework supports exact
    configuration/joins/folding/lock/acceptance controls but not numeric current
    standard requirements. RESNA2004 historical design describes welded
    tube/flat stock whereas prototype is brazed: neither universal joint
    recipe/grade/dimensions/ISO test cycles nor life adopted. Actual current
    released drawings and physical records govern."
  unresolved_flow_identities:
    - row_id: bracket_sheet
      selected_flow: Cold-rolled low-carbon steel wheelchair axle-bracket sheet
      reason: Cold Rolled Plate Chinese alloy rod/classification conflict; Steel Sheet
        Chinese silver plate/class41239 alloy further-worked scope does not
        establish unalloyed bracket sheet.
    - row_id: weld_wire
      selected_flow: Solid carbon-steel welding filler wire
      reason: Direct Solid Wire is copper electrical conductor/class41513 building
        power transmission, not steel welding filler. Refined flux-cored/strip
        candidates do not establish solid carbon-steel filler.
    - row_id: shield_argon
      selected_flow: Pure argon welding shielding gas
      reason: Initial/refined bounded30 candidates did not establish supplied pure
        welding argon; pharmaceutical and combined welding-service candidates
        not gas product.
    - row_id: powder_residue
      selected_flow: Unusable dry polymer powder-coating residue
      reason: Direct Waste powder coating paint reference property Aluminium content,
        not total dry formulated-polymer waste Mass; no aluminium content
        measured conversion available and no property rewritten.
    - row_id: rear_wheel
      selected_flow: Finished composite wheelchair rear wheel with solid polyurethane
        tyre and handrim
      reason: Refined candidates wind-turbine hubs/rotors or motor-car aluminium hub
        not wheelchair wheel package. Generic tyre direct class36113 pneumatic
        rubber/Number of items not solid polyurethane completed wheel; count
        alone is not rejection.
    - row_id: front_caster
