review_metadata:
  scientific_review: pending
  semantic_boundary:
    decision: New complete non-self-propelled steel high-sided open railway freight
      wagon with integral flat floor, fixed end walls, high side walls, side
      doors and declared bogie/brake/coupling configuration, evidenced by the
      Tatravagonka Eanoss manufacturer original. Exclude
      box/flat/hopper/tank/refrigerated wagons, locomotives, passenger vehicles,
      bare components and rebuilding/transport services. Narrower than CPC49533;
      no claim to cover the entire leaf. Existing track-material PCR excludes
      rolling-stock parts and no same complete open-wagon material record was
      found.
  evidence_limitations:
    - No actual accepted net mass M, manufacturing quantities, current supplier
      formulations, calibrated test or emission records were obtained. These
      acquisition requirements remain mandatory for a completed quantitative
      dataset.
    - 2022 company-report evidence supports historical manufacturing-stage
      examples only; no empirical intensity/range or universal recipe adopted.
    - Body scope deliberately excludes box/flat/hopper/tank/refrigerated wagons
      and does not cover entire CPC49533.
