allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Avoid allocation by subdivision and actual order/serial stage metering first. Allocate remaining shared resources by demonstrated causal metered machine time, coated area for an identical coating/operation or measured test use, with original numerator/denominator and sensitivity. Do not assign mixed wagon bodies equally per unit or nominal tare."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_scrap
    applies_to: "steel offcuts"
    rule: "Measure generated steel offcuts/returns, separate internal recirculation and transferred waste once, preserve recipient/legal treatment state and actual coproduct status. No automatic avoided-virgin-steel or recycling credit. A demonstrated sold coproduct needs independently reviewed allocation with actual causal evidence and consistent upstream boundary."
    source_ids:
      - ghg-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete empty-wagon net mass"
      record_type: "controlled_acceptance_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; actual original calibrated rail/wheel weigh record; all supports/tare/static procedure; repeatability; retained lubricant; detached integral parts; measured cargo/test-load/persons/fixture/protection exclusions; signed configuration corrections and mass balance"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted wagon"
      temporal_coverage: "actual manufacturing/acceptance period"
      site_scope: "declared plant acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original actual calibrated measurements and reconciliation"
    - protocol_id: cp_body
      process_id: "body"
      flow_role: "Underframe and dry-freight body fabrication"
      record_type: "foreground_record"
      raw_fields: "serial/order and drawing/BOM; accepted count; each exchange identity/composition/property/unit; actual net issues/returns/stock change; supplier included constituents; electricity site/voltage/mix/meter; gas/air temperature/pressure/compressibility; coating/SDS/species/medium; waste recipient; shared driver and denominator; calibration/test coverage"
      collection_method: "Weigh each net stock/filler/shield-gas issue and actual scrap, reconcile returns and supplier assembly contents by serial order."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacture period"
      site_scope: "declared plant and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original supplier, weighing, meter, SDS, emission, transfer and test records"
    - protocol_id: cp_running_gear
      process_id: "running_gear"
      flow_role: "Running gear, brake and coupling integration"
      record_type: "foreground_record"
      raw_fields: "serial/order and drawing/BOM; accepted count; each exchange identity/composition/property/unit; actual net issues/returns/stock change; supplier included constituents; electricity site/voltage/mix/meter; gas/air temperature/pressure/compressibility; coating/SDS/species/medium; waste recipient; shared driver and denominator; calibration/test coverage"
      collection_method: "Retain serial/module scope and measured net mass; reconcile bogie inclusions versus separately supplied wheelsets/axleboxes/springs/brakes and actual couplings."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacture period"
      site_scope: "declared plant and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original supplier, weighing, meter, SDS, emission, transfer and test records"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "Conditional surface preparation and coating"
      record_type: "foreground_record"
      raw_fields: "serial/order and drawing/BOM; accepted count; each exchange identity/composition/property/unit; actual net issues/returns/stock change; supplier included constituents; electricity site/voltage/mix/meter; gas/air temperature/pressure/compressibility; coating/SDS/species/medium; waste recipient; shared driver and denominator; calibration/test coverage"
      collection_method: "Collect separate coating-component, solvent, grit, water and metered heater gas records, actual dry/retained and transferred residues, SDS and species-specific air measurements."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacture period"
      site_scope: "declared plant and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original supplier, weighing, meter, SDS, emission, transfer and test records"
    - protocol_id: cp_outfit
      process_id: "outfit"
      flow_role: "Freight fittings and final assembly"
      record_type: "foreground_record"
      raw_fields: "serial/order and drawing/BOM; accepted count; each exchange identity/composition/property/unit; actual net issues/returns/stock change; supplier included constituents; electricity site/voltage/mix/meter; gas/air temperature/pressure/compressibility; coating/SDS/species/medium; waste recipient; shared driver and denominator; calibration/test coverage"
      collection_method: "Weigh actual separate fitted mechanisms and retain BOM/drawing revision, supplier inclusions and net returns."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacture period"
      site_scope: "declared plant and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original supplier, weighing, meter, SDS, emission, transfer and test records"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "Empty-wagon inspection and acceptance"
      record_type: "foreground_record"
      raw_fields: "serial/order and drawing/BOM; accepted count; each exchange identity/composition/property/unit; actual net issues/returns/stock change; supplier included constituents; electricity site/voltage/mix/meter; gas/air temperature/pressure/compressibility; coating/SDS/species/medium; waste recipient; shared driver and denominator; calibration/test coverage"
      collection_method: "Retain actual acceptance/test/weighing records, calibrated meters and resource attribution by wagon serial; do not use payload or gross laden weight as net M."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacture period"
      site_scope: "declared plant and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original supplier, weighing, meter, SDS, emission, transfer and test records"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "Conditional delivery protection"
      record_type: "foreground_record"
      raw_fields: "serial/order and drawing/BOM; accepted count; each exchange identity/composition/property/unit; actual net issues/returns/stock change; supplier included constituents; electricity site/voltage/mix/meter; gas/air temperature/pressure/compressibility; coating/SDS/species/medium; waste recipient; shared driver and denominator; calibration/test coverage"
      collection_method: "Weigh actual dispatched protective film, reconciled returns, excluding its mass from empty-wagon M."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacture period"
      site_scope: "declared plant and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original supplier, weighing, meter, SDS, emission, transfer and test records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_origin with actual calibrated complete empty-unit measurement and signed corrections. Missing original measurement method or unbalanced configuration blocks quantitative completion."
      evidence: "original serial/calibration/weight/BOM balance"
    - id: quality_bom
      applies_to: "all processes"
      requirement: "Reconcile underframe/floor/end/side walls/doors, bogies/wheelsets/brakes/couplings/access, coating and retained lubricants. Supplier complete assemblies include constituents once; add omitted actual constituents and resources before completeness claims."
      evidence: "drawings, supplier inclusions, actual records"
    - id: quality_species
      applies_to: "finish"
      requirement: "No compulsory VOC/NOx/species or heater combustion is inferred. Actual formulation, direct outlet, detection limits, operating coverage and measured conversion basis are required; distinguish indoor/soil/long-term/isomer from specified immediate-air species."
      evidence: "SDS/speciated outlet/gas records"
    - id: quality_evidence
      applies_to: "dataset"
      requirement: "Declare site/period/gate, original lineage, empirical QA limits, conditional absence, allocation, uncertainty, identity/quantity/upstream gaps. Establish empirical ranges from actual calibrated records or independently verified compatible evidence, never invented mass/yield/life. PCR check establishes declared relations only, not scientific approval or actual factory records."
      evidence: "source and coverage register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_machine; cp_mass"
    rule: "Confirm complete steel high-sided open wagon, empty positive actual net M, physical calibrated mass_record_origin, exact configuration and fixed1kg output normalization. Reject cargo/gross laden/catalogue tare as M and other body types."
    source_ids:
      - tatra-model
  - rule_id: validate_rows
    applies_to: "all inventory rows"
    rule: "Each exchange has one identity/property/unit and exact direction/type, shared denominator and linked protocol/rule. Respect actual public reference property, compartment and route, official Chinese names; blank identities remain review gaps. No generic category row."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Reconcile stocks, supplier inclusions, assembled accepted mass, retentions and waste, shared driver and actual test scope. No double-counted bought bogie and constituents or recycled steel credit. All unmeasured quantities/conditional routes and missing upstream prevent unqualified completed cradle-to-gate claim."
    source_ids:
      - ghg-allocation
published_dataset_profile:
  dataset_role: "Configured steel high-sided open railway freight-wagon foreground manufacture"
  downstream_use: "secondary_dataset; background_dataset after qualified review and upstream linkage"
  allowed_use: "Compatible same body, running gear, coating, empty-net-M, site/period/gate manufacturing supply models"
  excluded_use: "Whole CPC49533, other body architectures, transport/loading service, equal-mass payload equivalence or unsupported cradle-to-gate"
  required_metadata: "producer/model, serial and drawing/BOM revision; high-sided open body, integral flat floor, fixed ends, side doors and locking/access fittings; steel grades and supplier completion; gauge, bogie/axle/wheelset arrangement, suspension, bearings, brakes and couplings; coating chemistry and actual heater/blasting route; complete empty net M kg and cp_mass, calibrated rail/wheel weighing and signed configuration corrections; retained bearing lubricant; exclude cargo, test loads, personnel, fixtures, packaging and loose spares; actual site/period and gate, supplier inclusions, conditional absence and outsourcing"
  required_quality_disclosure: "Actual net weighing and quantities, supplier inclusions, identity gaps, conditional stages, uncertainty, empirical limits and missing upstream"
  update_trigger: "Body/door/floor, steel grade, bogie/brake/gauge, supplier scope, coating/gas/air route, actual accepted M record or gate/site/period change"
data_sources:
  - id: "tatra-factory"
    type: "literature"
    reference: "[Tatravagonka company profile](https://tatravagonka.sk/company-profile/?lang=en)"
    used_for: "Company-profile material cutting and welding paragraphs. Undated manufacturer capability example; no capacity, grade, uniform process depth or intensity adopted."
  - id: "tatra-model"
    type: "literature"
    reference: "[Tatravagonka Eanoss](https://tatravagonka.sk/wagons/eanoss/?lang=en)"
    used_for: "Eanoss body paragraph and technical table: whole-metal high-sided body, integral flat floor/fixed fronts/side doors and bogie configuration; distinct tare, laden weight and payload. No nominal mass, numerical capacity, gauge/floor thickness or regulatory/certification claim adopted."
  - id: "greenbrier-2022"
    type: "literature"
    reference: "[Greenbrier 2022 ESG report](https://www.gbrx.com/wp-content/uploads/2022/12/Greenbrier-2022-ESG-Report.pdf)"
    used_for: "PDF/printed24,59,61,62: historical2022 welding quality, electricity/natural-gas cutting/heating, paint air and residual/solvent management. Mixed company/facility boundaries, not open-wagon unit intensities. No chart threshold, gas duty, compulsory VOC species, coating recipe, tank-specific inspection or life factor adopted."
  - id: "ghg-allocation"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2 historical avoid/subdivide and causal allocation hierarchy only. Actual causal shared-driver measurement, not numerical wagon allocation factor."
