measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_origin
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Require original serial-linked actual empty-wagon calibrated rail weighing or wheel-load measurement, calibration/instrument, all wheels/supports, tare and static procedure. Sequential wheel measurements require checked support coverage and repeatability. Reconcile actual detached integral parts and temporary loads with measured corrections and signed BOM/weight balance. Catalogue tare, payload, gross laden weight, axle rating or sums of nominal component masses do not establish M."
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Meter attributable electricity intake; verified kWh unit conversion is3.6 MJ/kWh. Nameplate kW is not energy; site/voltage/mix matching is required."
  - id: gas_air_volume
    applies_to: "gas; air"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Retain actual metered reference-temperature/pressure/compressibility volume. Gas supply and compressed-air test media are separate routes; use measured gas composition and physical state for any conversion to mass/energy, never generic density or nominal tank volume."
  - id: coating_species
    applies_to: "finish"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Separate actual coating base/hardener/solvent/grit, retained dry coating and waste. Emitted mixed xylenes require actual CAS-specific emission evidence and immediate air medium; total VOC or HAP is not that species. Fossil CO2 requires actual heater fossil-carbon basis, not upstream inventory."
