  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Acceptance records must implement mass_record_origin; original calibrated physical wheel/rail measurements, serial and all mass-state corrections are required. Missing actual method or unexplained catalogue/axle rating blocks a completed quantitative dataset."
      evidence: "original weight report/calibration/correction balance"
    - id: quality_bom
      applies_to: "all stages"
      requirement: "Reconcile frame/cab, all bogies/wheelsets, engine/transmission/cardans/axle gears, ballast, brakes/control and actual auxiliary/aftertreatment/fluid masses to accepted scope. Retain supplier inclusions and add each omitted actual BOM constituent without double counting."
      evidence: "drawings/BOM/supplier inclusions/measurements"
    - id: quality_trial
      applies_to: "acceptance"
      requirement: "Retain actual test protocol/track/stand, load/duration, sampled-unit coverage and net fuel/fluid returns. Exhaust species require integrated calibrated measurements with detection limits and actual medium; unsplit NOx is not NO/NO2 and biological fraction is not fossil CO2."
      evidence: "test, fuel and species originals"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Declare actual site/period, configuration/supplier scope, conditional absence, outsourcing, allocation, identity/quantity gaps, uncertainty, empirical QA limits and missing upstream. Establish actual QA ranges from calibrated records or verified compatible evidence, never invented yields/weights/lifetimes. This PCR check verifies declared relationships, not actual records or scientific approval."
      evidence: "coverage and original-record register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete hydrodynamic diesel-hydraulic locomotive and positive measured net M implementing cp_mass and mass_record_origin. Match gauge/axles/bogies, drivetrain, ballast and fluid state; reject catalogue total, rated axle load or nominal fill as weight evidence. Reference output name must match the reference product exactly."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Verify atomic substance/component, public state100 name, actual reference property/unit group, route/scope and completeness. Preserve engine Count; electricity Energy is not Mass. Hydrodynamic transmission is not hydrostatic hydraulic unit. Unsupported identity stays blank with exact row registration."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "supplier and test scope"
    rule: "Count complete supplier modules and prefills once; do not duplicate engine/bogie constituents. Verify represented acceptance-test coverage and consumed versus retained fuel/sand. Separate manufacturing trials from revenue hauling and supplier development tests. Missing actual quantity or underlying weighing method remains review."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial releases to exact medium/submedium. CO2 fossil, NO and NO2 identities here are immediate air-unspecified; not biogenic CO2, N2O, nitrogen/nitrite, soil/water or long-term release. Captured waste is not emitted species."
    source_ids: []
  - rule_id: validate_profile
    applies_to: "claimed completeness"
    rule: "Link actual upstream and supplier/period/geography before a cradle-to-gate claim; record original acceptance documentation and applicable actual regime for any certificate claim. Generic manufacturer capability does not approve this locomotive methodology or its specific vehicle."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete diesel-hydraulic locomotive foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and linked upstream scope"
  allowed_use: "Manufacturing supply-chain models matching gauge, hydrodynamic drive, bogies/ballast/outfitting/fluid state, accepted net-M scope and gate/site/period"
  excluded_use: "Train/shunting transport service, lifetime hauling fuel, equal-mass traction equivalence, other traction architectures or unsupported complete cradle-to-gate claims"
  required_metadata: "producer/model and serial; drawing/BOM revision; gauge, axle arrangement, wheelsets/bogies, axle gears and installed ballast; diesel engine number/type/serial and supplier inclusions; hydrodynamic converter/transmission, cardan shafts, final drive, cooling, brakes and controls; cab/coupler/safety/aftertreatment configuration and actual coatings; net delivery fluid state; accepted positive measured M kg and cp_mass, calibrated weighing evidence and signed corrections; exclude fuel, operational sand, persons, temporary test loads, packaging and loose spares; actual factory/site/period and gate, supplier completion and test coverage"
  required_quality_disclosure: "Identity/quantity and physical weight-record gaps, conditional stages, full BOM/supplier inclusions, test coverage/allocation, uncertainty, empirical limits and missing upstream"
  update_trigger: "Gauge/axles/bogies, drivetrain/supplier modules, ballast/fluid state, coating, actual weight-record correction or acceptance regime, plant/period change"
