    reference: "[Voith Drive New Ways,VT1570 en BDI2025-07](https://www.voith.com/corp-en/VT_Digest-Rail_25_BDI_VT1570_en_Digital.pdf)"
    used_for: "PDF/printed25,30–32,52: longitudinal axle gears, hydrodynamic converter components, dry-mass/oil-capacity fields, cardan drive and edition. Supplier architecture only; no transmission capacity/mass/recipe/lifetime or mandatory retarder adopted; distinguish railcar from locomotive application."
  - id: "voith-gears"
    type: "literature"
    reference: "[Voith gear units](https://www.voith.com/corp-en/drives-transmissions/gear-units.html)"
    used_for: "Diesel-hydraulic-locomotive section: outside-bogie hydrodynamic transmission and cardan/axle gear interfaces; supplier testing paragraph concerns product development. Undated configurable supplier example, no universal gear stage or per-locomotive endurance test imposed."
  - id: "ghg-allocation"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2: historical avoid/subdivide and causal allocation hierarchy. Actual measured compatible causal driver required; no nominal locomotive-mass or equal-count allocation factor."
