measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_origin
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Require actual calibrated rail weighing or wheel-load measurements, original serial/configuration-linked instrument and calibration records, all wheels/supports and tare, measured fuel/sand/temporary-load corrections, installed ballast and retained service fluids. Sum independently measured wheel loads only with all supports covered and declared static condition, simultaneous/sequential procedure, calibration and repeatability checks. Signed mass reconciliation establishes net delivery scope. Never infer M from catalogue or an invented per-unit weight."
  - id: engine_count
    applies_to: "engine"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "Retain public item-count reference for complete supplied diesel engines. Collect accepted installed engine serial count per locomotive; normalize q_item counts by the same measured M. Record independent actual engine/module mass for configuration and total mass reconciliation, not to rewrite the engine flow property as Mass."
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Meter attributable intake electricity; actual kWh converts with verified unit identity3.6 MJ/kWh. Record voltage/geography and provider route; nameplate kW is not energy."
  - id: fluid_scope
    applies_to: "first fill and trial fuel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure actual net fills and supplier-prefilled contents once, retained versus consumed/discharged. For a volume record require measured same-composition/state density and temperature; nominal tank/oil capacity and generic calorific value are not conversion evidence."
