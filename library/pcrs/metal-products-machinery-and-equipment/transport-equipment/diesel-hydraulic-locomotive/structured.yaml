system_boundary:
  rules:
    - rule_id: boundary_foreground
      applies_to: "all stages"
      rule: "Include actual producer operations and attributable rework/test and first-fill resources once through the declared gate. Supplier-completed fabrication/assembly is represented by its bought intermediate, not duplicated local resources. Report missing stages and conditional absences explicitly."
      source_ids:
        - zagro-production
    - rule_id: boundary_operations
      applies_to: "trials and downstream"
      rule: "Construction-acceptance testing belongs to manufacture only for demonstrated represented units and actual protocol. Exclude revenue shunting/hauling, maintenance, spare replacement, operation fuel/sand, infrastructure and lifetime transport service. A supplier development endurance run is not automatically a per-locomotive factory burden."
      source_ids:
        - voith-gears
    - rule_id: boundary_upstream
      applies_to: "bought inputs"
      rule: "Expose each actual received exchange and supplier manufacturing scope; missing upstream datasets prevent a complete cradle-to-gate claim. Declare outsourcing and actual transport/service links separately with physical measured basis; no unspecified service collection is an inventory flow."
