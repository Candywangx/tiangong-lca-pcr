allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacturing resources"
    rule: "Separate locomotive orders/configurations and subdivide directly metered stages first. Assign actual stock/module receipts, job/test resources and rework by measured records. An inseparable shared resource uses demonstrated causal operation time/load or layer-area driver: share = order driver / sum of drivers for all covered orders. Retain evidence, period, all orders and denominator. Nominal weight, horsepower or equal-unit shares are not automatically causal."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_recovery
    applies_to: "scrap and internal transfers"
    rule: "Internal stock/fluid/fuel reuse is a transfer, not repeated fresh input or a credit. Exported scrap/waste retains actual mass and recipient; no assumed avoided-steel/oil benefit. Separate genuine co-products; any residual allocation requires justified consistent driver and documented review. Reconcile rejected/reworked units and work-in-progress to accepted period output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete-locomotive net mass"
      record_type: "controlled_acceptance_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; original measured wheel/rail weight records; instrument/calibration; all supports and tare; retained service-fluid/ballast state; measured fuel/sand/persons/test-load exclusions; delivery corrections; verifier"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted locomotive"
      temporal_coverage: "actual manufacturing/acceptance period"
      site_scope: "declared manufacturer gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original actual calibrated measurements and signed configuration/mass reconciliation"
    - protocol_id: cp_frame
      process_id: "frame"
      flow_role: "Frame and cab fabrication"
      record_type: "foreground_record"
      raw_fields: "order/serial; configuration; accepted count; each exchange identity/property/unit; issues/returns/stock change; supplier inclusions; installed engine serial count and independent measured mass; electricity meter/unit/site/voltage; actual fills, test-fuel consumed/retained and blend; species/medium/outlet; shared driver/denominator; instrument/calibration"
      collection_method: "Collect drawing revisions, stock certificates, weighed issues/returns/offcuts and machining chips, weld/inspection records and actual station utilities."
      unit: "actual row unit, including Item(s) for engine and MJ for electricity"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared plant and disclosed suppliers"
      aggregation_rule: "attributable exchange amount / accepted units"
