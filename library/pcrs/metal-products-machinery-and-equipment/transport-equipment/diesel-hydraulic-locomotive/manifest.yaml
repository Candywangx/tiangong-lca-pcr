      direct_evidence_key: chips
    - uuid: cf3aee56-4f27-4e77-b96b-126016a1674f
      row_id: shield_co2
      reason: Original explicitly proxy for unspecified CO2/argon mixture, not
        verified actual pure gaseous CO2 supply.
      direct_evidence_key: shield
    - uuid: eafff56c-3487-4345-9f24-00429f61c556
      row_id: trans_oil
      reason: Actual Mass internalID1 retained; hydrostatic hydraulic-pressure-fluid
        formulation does not establish hydrodynamic transmission operating-oil
        grade.
      direct_evidence_key: transOil
    - uuid: f854fcea-1b30-4b25-8dfb-7829bcfb51cd
      row_id: starter_battery
      reason: Energy reference and conflicting BESS commentary, without actual
        supported filled-component mass conversion.
      direct_evidence_key: battery
    - uuid: bc015e4f-a244-428b-9632-3c350da8d1f5
