review_metadata:
  scientific_review: pending
  semantic_boundary_decision: New complete diesel-hydraulic rail locomotive using
    a diesel engine and hydrodynamic transmission with mechanical axle drive;
    exclude tenders, steam, electric, diesel-electric, railcars and
    operation/repair services. No same configured material PCR found in
    checkout; supplier component boundaries require independent checks. Actual
    scope excludes pure hydrostatic, hybrid/battery traction and reconstruction.
    Related non-rail engine PCR excludes railway propulsion and integration.
  unresolved_flow_identities:
    - row_id: steel_plate
      flow: Hot-rolled carbon-steel locomotive frame plate
      reason: Direct steel-plate candidate is explicitly hot-rolled low-alloy
        high-strength thick plate, not this declared carbon/non-alloy plate;
        mixed pipe-mill input and multilingual cold-rolled/rod candidates are
        not exact substitutes.
    - row_id: frame_module
      flow: Complete welded steel locomotive frame assembly
      reason: Generic fabricated component or bare steel is not the configured frame
        assembly.
    - row_id: weld_wire
      flow: Solid carbon-steel arc-welding filler wire
      reason: Direct Solid Wire candidate is copper building-power conductor by
        classification/route, despite a Chinese welding synonym; it is not solid
        carbon-steel welding filler. Other rod or flux-cored candidates do not
        establish the declared solid steel filler.
    - row_id: shield_co2
      flow: Gaseous carbon-dioxide steel-welding shielding supply
      reason: Direct CO2 shielding candidate explicitly represents a proxy for
        unspecified CO2/argon mixture. Actual independent pure-CO2 supply
        identity and chemistry/supplier state remain unresolved; environmental
        CO2 cannot substitute.
    - row_id: steel_chips
      flow: Segregated carbon-steel machining chips
      reason: Direct ferrous-swarf candidate unexpectedly references Aluminium
        content, not Mass; actual steel-chip reference conversion is unsupported
        and public property is not rewritten.
    - row_id: bogie
      flow: Complete locomotive bogie with declared included wheelsets
      reason: Exact bogie configuration and supplied completeness require verification.
    - row_id: wheelset
      flow: Finished steel locomotive wheelset assembly
      reason: Wheelset is not steel rail or individual wheel casting.
    - row_id: brake
      flow: Complete pneumatic locomotive brake-control assembly
      reason: Generic compressor is not brake-control assembly; actual pneumatic
        configuration required.
    - row_id: coupler
      flow: Finished steel rail-locomotive coupler assembly
      reason: Exact coupler interface and finished supplied scope unresolved.
    - row_id: transmission
      flow: Complete hydrodynamic locomotive transmission with torque converter
      reason: Hydrodynamic torque converter transmission is not a hydrostatic
        hydraulic pump or road automatic gearbox.
    - row_id: cardan
      flow: Finished steel locomotive cardan-shaft assembly
      reason: Exact rail drivetrain shaft geometry and supplied completeness require
        verification.
    - row_id: axle_gear
      flow: Complete locomotive bevel axle-gear unit
      reason: Finished axle gear unit is not generic gear or traction electric motor.
    - row_id: trans_oil
      flow: Petroleum-base formulated hydrodynamic transmission operating oil
      reason: Direct hydraulic-fluid candidate has Mass internalID1, but hydrostatic
        pressure-fluid composition/grade does not establish specified
        hydrodynamic transmission operating oil; actual approved formulation
        required.
    - row_id: coolant
      flow: Aqueous ethylene-glycol diesel-engine coolant formulation
      reason: Exact supplied water/glycol/inhibitor formulation and concentration
        require verification; neat glycol is not coolant.
    - row_id: epoxy_base
      flow: Formulated epoxy steel-primer base component
      reason: Pure resin does not establish formulated primer base.
    - row_id: hardener
      flow: Polyamine epoxy steel-primer hardener formulation
      reason: Pure amine does not establish hardener formulation.
    - row_id: effluent
      flow: Aqueous steel-surface cleaning effluent transferred for treatment
      reason: Treatment transfer is not water resource or elementary discharge.
    - row_id: starter_battery
      flow: Filled lead-acid locomotive starter battery
      reason: Public starting lead battery references Energy and has conflicting BESS
        commentary; no current supported supplied filled-mass conversion or
        locomotive completeness evidence.
    - row_id: cable
      flow: Insulated copper low-voltage locomotive electrical cable
      reason: Public control/power copper cable references Energy with no actual
        supported calorific-value-to-supplied-cable-mass conversion; retain kg
        row, no property rewrite.
    - row_id: compressor
      flow: Complete piston locomotive compressed-air compressor
      reason: Exact compressor technology, included drive and supplier completeness
        need verification.
    - row_id: fuel_tank
      flow: Finished welded steel diesel locomotive fuel tank
      reason: Fuel tank material/interface and finished supplier scope unresolved.
    - row_id: control
      flow: Complete locomotive electronic drivetrain control cabinet
      reason: Finished control cabinet supplier scope requires verification.
    - row_id: finished_machine
      flow: Accepted complete diesel-hydraulic rail locomotive
      reason: Public other-rail-locomotives/tenders candidate is Mass-referenced and
        manufactured, but combines distinct locomotive traction routes and
        unpowered tenders without configured hydrodynamic
        drivetrain/complete-unit scope. This exact reference remains blank
        pending narrower identity review, not because Mass is unavailable.
  unresolved_quantity_ranges:
    - No actual current same-locomotive net M, manufacture amounts or
      independent boundary-compatible quantity ranges supplied; actual
      foreground records must establish quantities and QA limits.
  evidence_limitations:
    - No actual current locomotive acceptance/weighing record acquired; symbolic
      M describes required future calibrated measurements, not validated vehicle
      data or scientific approval.
    - Manufacturer originals demonstrate limited architecture/process examples
      only; no universal mass, grade, braking system, chemical recipe, test
      cycle, lifetime or emission factor adopted. Undated model/group/gear pages
      do not establish current certificates or regulations.
    - Missing actual BOM constituents, compatible flow identities, amounts and
      supplier upstream datasets remain gaps before completed quantitative data
      or complete cradle-to-gate claim.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
