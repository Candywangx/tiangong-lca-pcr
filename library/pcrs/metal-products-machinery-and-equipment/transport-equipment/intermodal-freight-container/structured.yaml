  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_completeness
      applies_to: "complete container"
      requirement: "Reconcile actual BOM/drawing, shell/frame/corners, floor, doors/hardware, coating and integral fittings to measured empty M. Resolve included supplier constituents and detached-part masses; add omitted actual exchanges before dataset completion."
      evidence: "drawings, weighing and supplier scope"
    - id: quality_balance
      applies_to: "material and utilities"
      requirement: "Retain calibration, stock/issue/return/reuse balances, SDS/state/density, coating uptake/residue, gas meter conditions, actual emission measurements and waste recipients. QA limits must arise from site records or comparable primary evidence; no invented yields, ranges or mandatory losses."
      evidence: "stock, meters, measurements and transfers"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose site/period, configuration/approval scope, conditional absences, outsourcing, identity/quantity uncertainty and supplier upstream gaps. Model examples and approval overviews do not establish actual certificates, universal recipes or net M. No boundary-compatible empirical intensity ranges are adopted here."
      evidence: "coverage and evidence register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require positive measured M for the same complete empty closed steel dry-container configuration, including declared floor, fitted doors, corners and integral delivered parts. Reject cargo, nominal payload/gross weight, TEU or transport-service substitutions. Verify approval claims against actual scheme/plate records, not classification alone."
    source_ids:
      - imo-csc
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check atomic material/form, exact public reference property/unit group, route, state and environmental medium. Pure CO2 gas is not argon mixture; process water is not environmental water; captured dust/waste transfer is not air or water release. Retain blank UUID where identity applicability is not established."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Trace per-container or batch collection to the same measured M, configuration, site and period; verify unit conversions, gas meter conditions and shared-driver denominators. Prevent received-module constituent duplication and unknown-to-zero defaults."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable factory species/origins and actual medium. Fossil CO2 applies to air-unspecified only with fossil provenance. Distinguish CO2, CO, NO, NO2, N2O, biogenic origin and captured residues; add each actual species separately."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete empty closed steel dry-container foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching container dimensions, material/floor/door/coating configuration, supplier completeness and gate/site/period"
  excluded_use: "Freight service/lifetime equivalence, other container technologies, building conversion and unsupported complete cradle-to-gate claims"
  required_metadata: "manufacturer/model; serial and drawing revision; closed steel dry-container type and dimensions; wall/roof/frame steel grade/thickness; corner-fitting and interface specification; plywood veneer/bonding/treatment/floor construction; door layout, hinges, locking and gasket/sealant formulation; coating layer/formulation and make-or-buy completeness; installed integral fittings and detached delivered parts; empty condition excluding cargo, removable protection and transport fixtures; positive measured net mass M, scale calibration and tare; applicable approval scheme and trace if claimed; actual manufacturing/outsourcing route, factory/period, dispatch gate and upstream coverage"
  required_quality_disclosure: "Identity/quantity gaps, uncertainty, conditional absence, full-BOM completion, allocation, approval applicability and unlinked upstream"
  update_trigger: "Material/dimensions/door/floor/coating, supplier module scope, M, manufacturing route, approval scheme, site/period or evidence changes"
