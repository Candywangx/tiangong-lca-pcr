allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacture"
    rule: "Separate orders by dimensions/door/floor/coating configuration. Directly attribute measured issues, returns, station meters, rejects and rework first. Inseparable shared utilities use a demonstrated measured causal driver such as coated area with layer/process load or station time: share = order driver / sum of all covered drivers. Retain period, denominator and justification; container count or nominal tare alone does not establish causality between different configurations."
    source_ids: []
  - rule_id: allocation_residues
    applies_to: "reuse and exports"
    rule: "Internal reused stock, abrasive and water are transfers; count fresh supply and actual exports without double counting circulation. Waste keeps measured mass and destination with no automatic avoided-product credit. Separate saleable co-products before a documented reviewed residual allocation. Attribute production rejects/rework to accepted output over the same period and reconcile work in progress."
    source_ids: []
