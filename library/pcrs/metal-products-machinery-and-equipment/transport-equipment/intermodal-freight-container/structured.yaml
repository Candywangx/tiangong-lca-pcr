measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Collect actual factory intake/station kWh and convert by the verified unit-group identity 3.6 MJ/kWh. Nameplate kW is not energy; voltage-specific supply must match actual intake."
  - id: gas_volume
    applies_to: "curing_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Preserve the public volume reference property. Collect actual supplied pipeline gas m3 at recorded meter temperature/pressure; reconcile billing conversions and do not assume kg or a universal heating value."
  - id: formulation_mass
    applies_to: "liquid formulations"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh actual paint/sealant formulation; any volume-to-mass conversion requires foreground-measured density at declared composition/state/temperature. No catalogue coverage ratio is a manufacturing amount."
