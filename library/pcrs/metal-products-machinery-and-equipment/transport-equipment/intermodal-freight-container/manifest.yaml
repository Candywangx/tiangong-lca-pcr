review_metadata:
  scientific_review: pending
  semantic_boundary_decision: "Narrower CPC 49221 boundary: new complete closed
    steel dry intermodal containers with plywood floor. Existing material
    motor-vehicle body method lacks independent intermodal corner-interface,
    floor and empty-box acceptance rules; legacy scaffold not promoted. Exclude
    refrigerated/tank/open-top/flat-rack/bulk/non-steel/non-plywood, conversions
    and freight operation. No mapping acceptance claimed."
  unresolved_flow_identities:
    - row_id: weathering_sheet
      flow: Hot-rolled weathering-steel thin sheet for container panels
      reason: Bounded searches yielded rebar, generic alloys and thick high-strength
        plate; these do not establish thin weathering sheet grade/route.
    - row_id: weathering_profile
      flow: Formed weathering-steel container rail profile
      reason: Generic steel profiles do not establish weathering grade and formed
        container rail route.
    - row_id: corner_fitting
      flow: Cast-steel intermodal-container corner fitting
      reason: Structural shell manufacturing and cast-steel abrasive candidates are
        not a finished corner fitting.
    - row_id: welding_wire
      flow: Solid low-alloy steel gas-shielded welding wire
      reason: Public flux-cored self-shielded wire does not establish solid
        gas-shielded wire.
    - row_id: argon_co2
      flow: Argon/carbon-dioxide premixed welding shielding gas
      reason: Pure CO2 cannot stand for argon/CO2 premix; mixture ratio must be
        measured/documented.
    - row_id: weld_dust
      flow: Captured iron-oxide-rich welding filter dust transferred as waste
      reason: Airborne elemental iron candidates are not captured oxidized filter dust.
    - row_id: steel_shot
      flow: Cast-steel spherical blasting shot
      reason: Public shot candidate describes spherical shot but is classified as
        non-ferrous ore and spans shot/grit; this inconsistent identity requires
        review before selection.
    - row_id: spent_shot
      flow: Spent cast-steel blasting shot with removed iron-oxide coating residue
      reason: Clean steel offcuts are not contaminated spent blasting media.
    - row_id: epoxy_primer
      flow: Waterborne zinc-rich epoxy container primer formulation
      reason: Generic paint candidates do not establish waterborne zinc-rich epoxy
        composition.
    - row_id: acrylic_topcoat
      flow: Waterborne acrylic container topcoat formulation
      reason: Generic paint or manufacturer CARC option does not establish waterborne
        acrylic formulation.
    - row_id: paint_sludge
      flow: Waste waterborne epoxy/acrylic coating sludge
      reason: Liquid cleaner and generic sludge candidates do not establish this
        coating residue.
    - row_id: clean_effluent
      flow: Aqueous steel-cleaning effluent transferred for treatment
      reason: Public discharge-to-water identity cannot represent treatment transfer.
    - row_id: marine_plywood
      flow: Phenolic-bonded marine plywood container floor panel
      reason: Lumber-core plywood does not establish marine veneer
        construction/phenolic bonding; record actual preservative treatment
        separately if applied on site.
    - row_id: floor_screw
      flow: Steel threaded plywood-floor fixing screw
      reason: Generic bolts/nails do not establish this screw form and scope.
    - row_id: door_hinge
      flow: Steel intermodal-container door hinge
      reason: Public steel hinge receipt is generic hinge/tilt-lock hardware;
        container-door design and completeness compatibility remain unverified,
        not excluded merely by classification.
    - row_id: locking_rod
      flow: Steel container-door locking cam rod assembly
      reason: Steel wire and axle candidates do not establish locking cam rod assembly.
    - row_id: epdm_gasket
      flow: EPDM rubber container-door sealing gasket
      reason: Generic sealing elements do not identify EPDM formulation and gasket
        form.
    - row_id: pu_sealant
      flow: One-component polyurethane container-seam sealant
      reason: PU filler/adhesive and unspecified sealant do not establish
        one-component seam-sealant formulation.
    - row_id: plywood_offcut
      flow: Phenolic-bonded plywood floor offcut transferred as waste
      reason: Generic wood waste does not establish bonded/treated plywood floor
        offcut.
    - row_id: approval_plate
      flow: Stamped aluminium container safety-approval plate
      reason: Aluminium shells are not stamped container approval plates.
    - row_id: test_water_waste
      flow: Collected container leak-test water transferred for treatment
      reason: Process water input and elementary water discharge do not establish
        collected treatment-transfer waste.
    - row_id: electricity_stock_form
      flow: Alternating-current electricity supplied at the declared factory intake
      reason: Public voltage/region-specific supply candidates cannot be selected
        before actual site intake voltage and route are documented.
    - row_id: electricity_shell_join
      flow: Alternating-current electricity supplied at the declared factory intake
      reason: Public voltage/region-specific supply candidates cannot be selected
        before actual site intake voltage and route are documented.
    - row_id: electricity_surface_finish
      flow: Alternating-current electricity supplied at the declared factory intake
      reason: Public voltage/region-specific supply candidates cannot be selected
        before actual site intake voltage and route are documented.
    - row_id: electricity_floor_door
      flow: Alternating-current electricity supplied at the declared factory intake
      reason: Public voltage/region-specific supply candidates cannot be selected
        before actual site intake voltage and route are documented.
    - row_id: electricity_acceptance
      flow: Alternating-current electricity supplied at the declared factory intake
      reason: Public voltage/region-specific supply candidates cannot be selected
        before actual site intake voltage and route are documented.
    - row_id: electricity_packing
      flow: Alternating-current electricity supplied at the declared factory intake
      reason: Public voltage/region-specific supply candidates cannot be selected
        before actual site intake voltage and route are documented.
  unresolved_quantity_ranges:
    - No verified site/configuration net M or boundary-compatible independent
      manufacturing intensity ranges; foreground collection must establish
      amounts and QA limits.
  evidence_limitations:
    - Product/process examples and IMO overview do not establish full CSC
      normative tests or an actual approval certificate.
    - No universal steel grade, paint/sealant recipe, nominal mass, lifetime or
      emission factor is adopted.
    - Each actual BOM exchange and demonstrated species must be added; unlinked
      supplier upstream precludes complete cradle-to-gate claims.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
