allocation_rules:
  - rule_id: direct_attribution
    applies_to: "shared_operations"
    rule: "Use job tickets and submetering before allocation. Where a common meter remains, require a measured causal driver such as machine-hours for the identified operation, with all participating jobs and idle load disclosed; divide the attributable quantity by accepted units of the same configuration before mass normalization."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: coproduct_decision
    applies_to: "saleable_outputs"
    rule: "Do not assume scrap is a co-product. Disclose destination and legal/product status. If multiple saleable co-products actually occur, seek subdivision; justify a physical relation or, when unavailable, documented economic/other allocation with sensitivity. No universal mass share or avoided-steel credit is prescribed."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: rework_scrap
    applies_to: "manufacturing_losses"
    rule: "Retain rework and rejected-unit burdens attributable to the accepted reporting batch. Record recovered internal material once and exported wastes separately. Disclose upstream recycled-content method and any downstream treatment separately to prevent double credits."
    source_ids: []
