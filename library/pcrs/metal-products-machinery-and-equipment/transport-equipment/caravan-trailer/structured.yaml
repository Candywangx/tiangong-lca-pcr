      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration_trace
      applies_to: "all rows"
      requirement: "Trace every input to installed BOM, route and accepted unit; supplier finished parts do not also receive raw-stock burdens. Disclose remaining components as missing coverage until separate atomic records are added."
      evidence: "drawings, BOM, supplier receipts"
    - id: basis_quality
      applies_to: "cp_mass"
      requirement: "M must be positive measured net mass, with the same delivered configuration, fluid state and acceptance gate as all collected exchanges."
      evidence: "calibration and weighing records"
    - id: coverage_quality
      applies_to: "all processes"
      requirement: "Document full batch temporal coverage, meter overlap, rejects, rework, stock changes, outsourced stages and unmeasured emissions. A missing record is unknown, not zero or not_applicable."
      evidence: "ledger, coverage matrix and measurement uncertainty"
    - id: chemistry_quality
      applies_to: "panels; cabinetry; assembly; fitout"
      requirement: "Verify recipe, concentration and SDS for each supplied formulated chemical; characterize each outgoing waste stream and identify treatment separately from environmental emissions."
      evidence: "recipe, SDS, analyses and transfer tickets"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Reject missing qualifiers, LPG/water/payload-loaded or shipping-gross mass substitution, non-positive M or mismatch between configuration, cp_mass and finished_machine. Require 1 kg output and explicit normalize_mass on every non-reference applicable row."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "inventory"
    rule: "Require one physical exchange per row, verified public identity when supplied, correct property/unit, localized display and medium. Unresolved UUIDs do not authorize proxy substitution or mixed rows."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "coverage"
    rule: "Reconcile installed mass, stock, waste, retained fluids and purchased parts using the actual BOM; independently reconcile installed chassis/shell/panel/adhesive/cabinet/appliance/battery content and retained fluids with measured BOM mass; reconcile test water issue, internal reuse and drainage, propane consumption and measured external-air emissions. Reconcile utilities by stage; internal transfers cancel. Explain differences against recorded measurement uncertainty, without a fabricated numerical tolerance."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check every conditional stage against route evidence. Require missing chemicals, parts, test media and actual emissions to be split and collected before claiming a complete inventory; prohibit cradle-to-gate or service comparisons while upstream or functional coverage is incomplete."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared_operations"
    rule: "Require complete driver records and justification for allocation and scrap treatment; document sensitivity where another defensible allocation may change results."
    source_ids:
      - ghg-product-allocation-2011
published_dataset_profile:
  dataset_role: "Manufacturing foreground process for a configured accepted unit"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to a declared caravan supply model with identical configuration and disclosed upstream coverage"
  excluded_use: "Towing, customer camping/accommodation service or comparisons across berth/layout, chassis and appliance configurations without separate functional modelling"
  required_metadata: "Model, configuration, empty state, M, retained fluids, manufacturer/site, reporting period, process route, voltage/geography, supplier gates, transport/packaging scope and allocation"
  required_quality_disclosure: "Measured versus estimated quantities; unresolved identities; unmeasured emissions and components; upstream linkage completeness; uncertainty, data age and configuration limitations"
  update_trigger: "Changed chassis/axle/brake, shell/core/frame/adhesive chemistry, floor/furniture layout, appliance/battery/options, supplier module boundary, test/firing/drainage, energy mix, acceptance or mass protocol"
data_sources:
  - id: "swift-caravans-2026"
    type: "handbook"
    reference: "Swift Group, Touring Caravans2026 brochure, PDF p.4 / printed pp.6–7 SMART construction diagram; PDF p.17 / printed pp.32–33 specification and MRO footnotes. https://www.swiftgroup.co.uk/media/rs5dz3ji/2026_swift_caravan_brochure.pdf"
    used_for: "Edition-specific qualitative GRP/polystyrene/PU framing and plywood-floor architecture; branded floor insulation chemistry unresolved. Mass footnotes demonstrate catalogue MRO includes loose equipment/LPG allowances; these are not adopted as M. No thickness, prototype test limit, warranty/lifetime or material grade mandated."
  - id: "bailey-manufacturing"
    type: "handbook"
    reference: "Bailey of Bristol, Sustainable Manufacturing, undated publisher HTML, Green Products manufacturing-material paragraph. https://www.baileyofbristol.co.uk/why-bailey/sustainable-manufacturing/"
    used_for: "Independent qualitative example of water-based panel adhesive and paper-coated plywood furniture board. Does not establish PVAc resin, species, grade or mandatory timberless design. No holiday-carbon comparison, recyclability, electricity claim or waste percentage adopted."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard2011, chapter9, printed p.63 / PDF p.65, tables9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical allocation hierarchy; actual causal driver records required, no current comprehensive conformity claim."
