  "review_metadata": {
    "scientific_review": "pending",
    "semantic_boundary_decision": "New complete hardwall drawbar touring caravan trailer with configured fixed habitation; narrower than CPC49222. Exclude fifth-wheel/semi-trailers, motorhomes, tent/pop-up/static dwellings, cargo/agricultural trailers, spare chassis/body and refurbishment. Material agricultural self-loading trailer and standalone vehicle body/harness PCRs have distinct product gates; no complete caravan overlap found in checkout. Actual installed habitation/battery/options and retained service fluids define M, with tank/heater drainage and no towing vehicle, persons, LPG bottle/fuel, loose gear or packaging. Actual factory tests included, customer camping/towing excluded; old scaffold/shared mappings unchanged.",
    "unresolved_flow_identities": [
      {
        "row_id": "steel_channel",
        "selected_flow": "Cold-formed non-alloy steel caravan chassis channel",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only actual stock fabricated on site; record grade, gauge, zinc/surface state and weighed issue less unused return. A purchased finished galvanized chassis excludes this constituent input and its supplier fabrication. Galvanizing performed on site requires its own full atomic route, not an assumed coating allowance."
      },
      {
        "row_id": "solid_wire",
        "selected_flow": "Solid carbon-steel welding wire",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only actual qualified welding of chassis brackets; record wire designation, chemistry and weighed spool consumption. Flux-cored wire is a different identity and no welding route is prescribed for a purchased bolted chassis."
      },
      {
        "row_id": "argon",
        "selected_flow": "Pure argon welding gas",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only actual pure argon delivered in the documented welding route, measured by cylinder net mass. Mixed shielding gas and liquid argon are different supplied states; collect them separately if present."
      },
      {
        "row_id": "grp_skin",
        "selected_flow": "Finished glass-fibre-reinforced polyester caravan panel skin sheet",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only actual supplier-confirmed cured polyester GRP sheet for onsite panel fabrication; record resin, glass reinforcement, surface finish, geometry and issued mass. Swift supports GRP architecture, not polyester chemistry. Raw glass fibre or plate glass is not the finished composite sheet; supplier resin curing is outside this gate."
      },
      {
        "row_id": "ps_core",
        "selected_flow": "Finished expanded-polystyrene rigid caravan insulation board",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only actual supplier-confirmed EPS board; record polymer, additives, expansion state, dimensions, density evidence and mass. The brochure specifies polystyrene, not universally EPS versus XPS. Purchased sandwich walls already include their cores; do not duplicate."
      },
      {
        "row_id": "pu_frame",
        "selected_flow": "Finished hard-polyurethane caravan body framing profile",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only installed actual supplier-confirmed hard-PU framing profiles used in onsite panel build. Record composition, fillers, geometry and mass; do not identify a hard structural product as unspecified soft foam or prescribe all caravans as timberless."
      },
      {
