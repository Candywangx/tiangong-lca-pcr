        "selected_flow": "Water-based polyvinyl-acetate dispersion panel adhesive",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only an actual qualified PVAc formulation confirmed by supplier/SDS and joint records; record supplied wet mass, solids, additives and water fraction, issue less return. Bailey supports water-based panel adhesive, not PVAc resin or mandatory recipe. A two-component PU adhesive needs separate component rows; no substitution."
      },
      {
        "row_id": "eps_offcut",
        "selected_flow": "Segregated dry expanded-polystyrene board cutting waste",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only actual segregated characterized EPS offcuts exported untreated; weigh and identify coating/glue contamination and destination. Mixed bonded panel scrap is different."
      },
      {
        "row_id": "grp_offcut",
        "selected_flow": "Cured glass-fibre-reinforced polyester sheet cutting waste",
        "reason": "No unambiguous applicable public state100 identity verified for this physical product, chemistry, state and gate. Only segregated waste of the same characterized cured sheet; weigh and identify resin, glass and surface constituents and treatment. It is a waste transfer, not inevitable styrene or air particulate emission."
