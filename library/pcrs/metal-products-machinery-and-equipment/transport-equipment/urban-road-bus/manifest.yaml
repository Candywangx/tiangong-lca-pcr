  evidence_limitations:
    - Daimler9May2019 eCitaro manufacturing case establishes historical
      steel-body route, integration and acceptance architecture only; no bath
      volume, cure parameters, thickness, pack count, test distance, cable mass,
      production duration or LCI factor adopted.
    - Solaris2024 report original PDF/printedpage5 independently corroborates
      steel-frame and electric-component/battery-integration site roles as
      at31December2024; site roles are not current numerical activity,
      allocation weights or universal routes.
    - Volvo PDF/product-page acquisition returned technical-difficulties HTML;
      retained original-only records are unverified and excluded from adopted
      scientific evidence.
    - Reference product UUID remains unresolved under declared1kg/Mass basis,
      registered finished_machine with exact reference/output name. Public
      count-reference Vehicle can be applicable as identity but cannot be
      relabelled Mass; no shared checker changed.
    - HFC-134a air-unspecified CAS811-97-2 public identity has no official
      Chinese baseName; canonical code retained and absence explicitly disclosed
      in both renderings. All available official Chinese names used exactly.
    - All applicable amounts and quality parameters require current released
      BOM/supplier and measured foreground records. Conditional
      battery/chemistry/fluid/utility rows do not prescribe a universal product
      recipe. Narrower steel-frame single-deck pure-electric urban bus scope, no
      accepted mapping, full cradle-to-gate or methodology approval claimed.
