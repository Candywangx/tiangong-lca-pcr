  semantic_boundary_decision: "Complete new single-deck battery-electric urban
    passenger road buses with declared steel load-bearing body-frame route.
    Declare rigid/articulated layout, model/VIN, body/chassis make-or-buy,
    passenger layout, battery chemistry/capacity and included pack boundary,
    electric driveline, auxiliaries and actual delivery fluid/SOC state. This is
    narrower than CPC49112; manufacturing delivery is the reference function.
    Chassis-only and bare-body supply; coaches/intercity, double-deck,
    diesel/hybrid/fuel-cell/trolley buses and aluminium/composite
    structural-frame routes. Passenger transport service, passenger-km,
    driver/passenger/payload mass, depot chargers and infrastructure, route
    operation, lifetime battery replacement, maintenance and end-of-life are
    excluded. Factory acceptance charging/tests and rework remain manufacturing;
    shipment packaging and detached spare packs are outside M and separately
    disclosed. Material manifests inspected: no complete urban bus category
    overlap established; batteries, vehicle components and truck methodology do
    not cover this assembled passenger vehicle. Old leaf remains read-only empty
    scaffold. No classification mapping accepted."
