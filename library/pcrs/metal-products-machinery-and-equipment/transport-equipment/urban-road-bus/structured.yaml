allocation_rules:
  - rule_id: allocation_demand
    applies_to: "shared_operations"
    rule: "Subdivide by site/configuration/work order using measured cp_allocation demand first. Allocate shared cut/join, bath/oven, assembly and test load using measured causal load/time or attributable consumption, reconciled to total meter and excluded loads. No default kg, seat-count or passenger-km allocation."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "bus_variants"
    rule: "Keep pack chemistry/capacity, articulation, body/coating and supplied chassis variants separate. A residual mass/economic fallback needs measured justification, sensitivity and review; acceptance rejects/rework burden accepted output."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "outputs"
    rule: "Internal reusable steel/water/paint/charged energy transfers do not earn avoided-production credits. Record external scrap and actual treatment; no automatic recycling/module-D credit. Genuine marketable coproducts need explicit quality, amount and reviewed treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each VIN/configuration or traceable homogeneous batch"
      temporal_coverage: "same manufacturing period"
      site_scope: "same site and accepted complete delivery state"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "vehicle-scale calibration; empty-payload weighing; bound delivery-state record; signed release"
    - protocol_id: cp_body
      process_id: "body"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "tube/sheet grade/drawing/dimensions; issues/returns; weld map/wire/gas specification; cut/join time/kWh; scrap mass; captured dust; post-control particulate concentration/volume"
      collection_method: "Weigh each material net issue and segregated scrap; trace drawing/nesting/join work, meter electricity and actual gases; measure outdoor outlet particulate with sampling conditions, not a nameplate or default welding factor."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; released supplier/BOM; stock/count closure; missing data"
    - protocol_id: cp_coating
      process_id: "coating"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "supplier formulation/SDS/concentration/solids; bath make-up/purge/recovery; coating retained dry mass; kWh/gas reference state; sludge moisture; treatment handler; xylene speciation; fossil carbon retention/releases"
      collection_method: "Measure each supplied solution/coating and wet waste separately, reconcile bath stock and retained film; meter actual cure carriers. Measure post-control xylene species and gas volume/time; use actual fossil-carbon balance or direct monitoring for CO2. No historical bath volumes/cure temperatures or recipe assumed."
      unit: "kg; MJ; m3"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared production year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; released supplier/BOM; stock/count closure; missing data"
    - protocol_id: cp_chassis
      process_id: "chassis"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "supplier axle/driveline/wheel/tyre part numbers; supplied masses; included motor/brake/suspension scope; torque/fit records; kWh; rejects"
