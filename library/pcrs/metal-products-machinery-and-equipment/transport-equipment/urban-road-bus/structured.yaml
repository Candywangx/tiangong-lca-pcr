  calculation_rules:
    - id: normalize_mass
      applies_to: "steel_tube; steel_sheet; welding_wire; argon; body_electricity; steel_scrap; weld_pm; wash_water; sodium_hydroxide; zinc_phosphate; epoxy_primer; pu_topcoat; pu_adhesive; coating_electricity; natural_gas; wash_effluent; phosphate_sludge; paint_waste; fossil_co2_air; xylene_air; front_axle; drive_axle; traction_motor; inverter; bus_tyre; steel_wheel; chassis_electricity; lfp_pack; nmc_pack; nca_pack; vehicle_harness; coolant; electrical_electricity; passenger_seat; windscreen; passenger_door; air_conditioner; r134a_charge; interior_electricity; rain_test_water; release_electricity; hfc_air; pe_film; corrugated_board"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "flows"
      requirement: "Verify actual supplied material/state/chemistry/component boundaries and reference-property units; battery powder/cell/pack and transport service/vehicle are distinct."
      evidence: "supplier specifications; state100 identity/property/unit audit"
    - id: quality_complete
      applies_to: "bus"
      requirement: "Reconcile all fitted BOM components and retained fluids to measured complete M; no residual mass invented for unknown components. Complete actual route and supplier/waste/transport coverage before asserting completeness."
      evidence: "vehicle scale; VIN BOM; inventory/stock balances"
    - id: quality_acceptance
      applies_to: "release"
      requirement: "Retain actual released HV, electrical, brake, leak, door and other relevant tests with parameters/results; no inherited manufacturer approval or generic thresholds."
      evidence: "signed release; calibrated instruments; homologation records if held"
    - id: quality_period
      applies_to: "records"
      requirement: "Declare participating sites, matched representative period, make-or-buy/variants, primary coverage, allocation uncertainty and source age. Historical source architecture is not current numerical LCI."
      evidence: "work orders; supplier versions; meter closure; uncertainty"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require1kg reference output and cp_mass measured complete-unit M; bind empty-payload weighing to exact VIN/BOM and delivery fluid/SOC state. No GVW, curb catalogue value, passenger distance or battery capacity denominator."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "Each applicable non-reference row explicitly applies normalize_mass with linked protocol and same accepted count/period/configuration; units and reference properties must match one atomic exchange."
    source_ids: []
  - rule_id: validation_supply
    applies_to: "assemblies"
    rule: "Check bought-in body/chassis/pack boundaries, motors inside axle, refrigerant inside HVAC and internal subassemblies/recovery to prevent duplicate inputs. Three pack chemistries are conditional separate variants, not a recipe requiring all three."
    source_ids: []
  - rule_id: validation_emissions
    applies_to: "elementary"
    rule: "Require measured or measured-balance post-control particulate, xylene species, immediate fossil CO2 and factory R134a leakage with exact receiving medium. Captured dust, wastewater to treatment, biogenic CO2 and total VOC are not substitutes; no default leaks/exhaust or lifetime rates."
    source_ids: []
  - rule_id: validation_coverage
    applies_to: "dataset"
    rule: "Distinguish measured/calculated/estimated/missing/excluded/not-applicable. Report unresolved identities/providers/amounts and omitted route coverage; passing structural checks neither approves science nor establishes full cradle-to-gate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Exact configured steel-frame single-deck electric urban bus manufacturing module for declared sites/period, with expanded upstream modelling only after independent supplier/transport/treatment completeness assessment."
  excluded_use: "Passenger-km or lifetime public-transport comparison, generic bus average, operation/charging infrastructure, other structural/powertrain routes or unsupported complete cradle-to-gate claims."
  required_metadata: "PCR id; VIN/model/BOM; body/chassis/pack supplier boundaries; steel structure/articulation; passenger layout; chemistry/capacity/pack mass; driveline/HVAC/fluid/SOC state; measured M; site/period; actual tests/rework; utilities/providers/transport/waste; allocation; packing/exclusions; source version."
  required_quality_disclosure: "Primary measured coverage; unresolved identities/provider/amount; make-or-buy and omitted routes; balances/recovery; source-age/limits; allocation and unit corrections; uncertain release measurements and review status."
  update_trigger: "Body/chassis structure, battery chemistry/capacity/supplier boundary, driveline, interior/HVAC, delivery-state or test change; supplier/site/utility revision; new representative period or resolved gap."
