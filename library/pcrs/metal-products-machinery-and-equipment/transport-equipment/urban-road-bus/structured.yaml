process_map:
  - id: body
    name: "Steel body preparation and joining"
    inclusion: "required"
    inclusion_condition: "Actual cut/form/join route for steel tube/sheet structure; bought-in subframes replace contained site stock/work. Supplier rolling and frame work remain upstream when outsourced."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: coating
    name: "Corrosion protection and body coating"
    inclusion: "required"
    inclusion_condition: "Actual declared coating route; cleaning, phosphating, electrodeposition and cure are conditional site steps, not universal recipes. Outsourced painting and intersite transfer must be disclosed without duplicate coating inputs."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: chassis
    name: "Axles, wheels and driveline installation"
    inclusion: "required"
    inclusion_condition: "Install actual released steering/driven axles, wheels and drive components. Supplier assembly boundaries control contained motor/brake/suspension duplication; purchased complete chassis replaces those individual inputs."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: electrical
    name: "Traction storage and electrical integration"
    inclusion: "required"
    inclusion_condition: "Install one specified battery chemistry per variant and actual harness/cooling. Pack/cell manufacture is upstream when purchased; site module-to-pack work requires its own explicit inputs and measured utility inventory."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: interior
    name: "Passenger interior, glazing and auxiliaries"
    inclusion: "required"
    inclusion_condition: "Install actual seating, glazing, doors, HVAC and released interior; optional equipment remains separately specified. Refrigerant contained in supplied unit is not another fill input."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: release
    name: "Commissioning, acceptance and weighing"
    inclusion: "required"
    inclusion_condition: "Actual HV/electrical, brake/rain/road test and final release plan; record charging at wall, water make-up, recovery, defects/rework and declared handover SOC/fluid levels. No standard test distance or loss fraction assumed."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
  - id: packing
    name: "Shipment protection"
    inclusion: "conditional"
    inclusion_condition: "Actual separately measured protection material only; excludes detached spares from vehicle M, disclose their separate supply."
    role: "foreground_production"
    quantitative_reference: "per 1 kg reference flow"
