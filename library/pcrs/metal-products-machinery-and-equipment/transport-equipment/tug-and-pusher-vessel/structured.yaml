  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "The original current vessel acceptance mass record must implement mass_record_provenance. Retain actual physical lightship/weight inspection, observable method inputs/calibration and a signed item-level reconciliation to delivered net configuration; reconcile independently weighed installed modules and fluids. A catalogue or unexplained displacement/tonnage record is insufficient. Missing method, uncertain correction or configuration change prevents a complete quantitative dataset; resolve by new measurement/reconciliation, never an assumed weight."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile drawings/BOM and installed hull/machinery/propulsion, piping/electrical, towing/pushing/safety/navigation and actual service-fluid masses, supplier scope and detached delivered parts. Add all actual missing components before completion; received complete modules count once."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, commissioning consumed versus retained fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this vessel. PCR checking validates the declared relationship, not a real ship record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured steel-hulled diesel tug/pusher and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational cargo/persons/fuel/fresh water/ballast and temporary loads, retain declared installed service fluids. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each atomic physical/chemical exchange, public reference property/unit group, route/state and supplier scope. Engine item count is not mass; a genset includes its engine once; CuO is not Cu2O paint; water supply is not effluent or resource withdrawal. Keep unsupported identity blank and add actual species/components before completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_tow_push_gear
    applies_to: "towing/pushing configuration"
    rule: "Reconcile actual foundations, towing winch/hook/bitt, line material, fender geometry/composition and pushing/coupling hardware with drawings, supplier completeness and accepted vessel configuration. Retain actual functional and load-test method, calibrated measured force and test-media/outlet records. Bollard pull and brake/coupling ratings describe acceptance performance only; they never supply net M or inventory factors. Manufacturer optional gear and historical used-vessel records do not establish actual installation or current certification."
    source_ids:
      - damen-asd-tug
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. A manufacturer equipment sheet does not certify this particular tug/pusher; no universal numerical standard/test/load is adopted."
    source_ids:
      - damen-asd-tug
published_dataset_profile:
  dataset_role: "Configured complete steel-hulled diesel tug/pusher foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching hull/propulsion/outfitting/coating, controlled net-mass scope, trial boundary, gate/site/period"
  excluded_use: "Passenger/freight service or lifetime comparison, equal-mass capacity equivalence, other propulsion/materials and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model, hull serial/drawing revision, steel grade/thickness and supplier block completeness; mechanically driven diesel shaft or azimuth propulsion and supplier inclusions; actual towing/pushing or combined configuration, foundations, winch/hook/bitt, rope material, fender geometry/composition, push knees and coupling; auxiliary piping/electrical/navigation/safety, coating formulations and actual claimed acceptance regime; positive net M in kg from current controlled acceptance records with original actual lightship/weight inspection, traceable method/calibration/observable inputs and signed item-level configuration reconciliation; installed service fluids and integral delivery-detached parts; excluded persons, cargo, consumable fuel/fresh water, ballast, removable protection and temporary trial loads; actual construction trials, site/period/delivery gate and upstream linkage"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Hull/propulsion/outfitting/coating, supplier modules, actual M evidence/corrections, trial state/boundary, manufacturing/acceptance regime, site/period changes"
data_sources:
  - id: "damen-asd-tug"
    type: "literature"
    reference: "[Damen: Azimuth Stern Drive Tug 2813 STOCK](https://medialibrary.damen.com/m/3ffb16484e7ba471/original/product-sheet-asd-tug-2813.pdf)"
    used_for: "PDF p.1 functions, propulsion, epoxy painting, deck gear and fender configurations; the optional Ø marker applies to listed options. Undated equipment example only, not an actual delivered vessel specification. No rated forces, counts, dimensions, approximate displacement, GT, fuel capacity, mass or numerical intensity adopted."
  - id: "damen-tug-pusher"
    type: "literature"
    reference: "[Damen Trading: folio 07802 Tug/Pushboat](https://medialibrary.damen.com/m/bcd65829ff4b920/original/tug-pusher-damen-trading-07802.pdf)"
    used_for: "PDF p.1 identifies a 1980-built used vessel with later modifications and describes fixed-propeller diesel propulsion, bow push-chair/rubber fender and coupling/towing gear. Historical physical equipment example only. No repair/resale process, current certificate, numeric ratings or displacement figure used as manufacture data or net M."
  - id: "damen-seagoing"
    type: "literature"
    reference: "[Damen: Seagoing Transport](https://medialibrary.damen.com/m/95d5489057a4c08f/original/Seagoing-transport.pdf)"
    used_for: "PDF p.5 (printed 8–9) explicitly describes the modular approach as evident in tug building. Manufacturing route context only; no universal material recipe, current ship acceptance or numerical manufacturing factors adopted."
  - id: "nma-lightship"
    type: "official_guidance"
    reference: "[NMA KS-0179-1E Rev.07.01.2020](https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf)"
    used_for: "PDF/printed pp.5–7 sections 3.2–3.4: ship condition, tank contents, water density and draught/freeboard observations. Historical Norwegian method example only; current actual lightship/weight inspection and itemized net-configuration correction remain necessary. No historical numerical thresholds or universal legal applicability adopted."
