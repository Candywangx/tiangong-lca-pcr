review_metadata:
  scientific_review: pending
  semantic_boundary_decision: Exclude non-steel hulls,
    diesel-electric/traction-battery/hybrid or alternative-fuel propulsion,
    offshore anchor-handling specialist vessels, passenger/cargo carriers and
    unpowered barges, hull-only intermediates, repair/conversion/resale and
    operational towing/pushing/maintenance/end of life. Optional ancillary
    equipment is included only when installed in the declared tug/pusher, with
    complete supplier scope. This is narrower than CPC 49316. Towing/pushing
    foundations, deck gear and performance acceptance differ materially from
    passenger ferry or liquid-cargo tanker manufacture and material steel PCRs;
    the legacy leaf remains read-only. Scientific review remains pending.
  unresolved_flow_identities:
    - row_id: normal_hull_plate
      flow: Hot-rolled normal-strength certified shipbuilding steel plate
      reason: Public thick high-strength plate does not establish normal-strength
        shipbuilding grade/certification.
    - row_id: hsla_plate
      flow: Hot-rolled low-alloy high-strength thick shipbuilding steel plate
      reason: Public candidate describes hot-rolled HSLA thick plate but classifies
        further-worked alloy flat products; its actual processing state and
        shipbuilding grade applicability remain unresolved.
    - row_id: hull_profile
      flow: Hot-rolled steel ship-hull stiffener profile
      reason: Finished hull blocks and non-alloy Z-section candidates do not establish
        this stiffener grade/profile route.
    - row_id: solid_wire
      flow: Solid low-alloy steel gas-shielded welding wire
      reason: Self-shielded flux-cored wire cannot represent solid gas-shielded wire.
    - row_id: argon_mix
      flow: Argon/carbon-dioxide premixed welding shielding gas
      reason: Single CO2 identity does not establish premix composition.
    - row_id: weld_dust
      flow: Captured iron-oxide-rich hull-welding filter dust
      reason: Elemental airborne iron is not oxidized captured waste filter dust.
    - row_id: abrasive
      flow: Spherical cast-steel hull-blasting shot
      reason: Public shot/grit candidate has inconsistent non-ferrous ore
        classification and unresolved exact physical grade applicability.
    - row_id: epoxy_base
      flow: Formulated epoxy marine-coating base component
      reason: Pure DGEBA resin or generic coating does not establish formulated marine
        coating base.
    - row_id: epoxy_hardener
      flow: Polyamine marine-epoxy coating hardener formulation
      reason: Generic amine substances do not establish formulated marine-epoxy
        hardener.
    - row_id: cu2o_paint
      flow: Cuprous-oxide self-polishing marine antifouling paint formulation
      reason: CuO chemical/ore identity is not Cu2O formulated antifouling paint;
        refined chemical search still requires formulation identity.
    - row_id: spent_abrasive
      flow: Spent steel blasting shot with removed hull-coating residue
      reason: Generic spent abrasive does not establish this steel/paint-contaminated
        residue.
    - row_id: clean_effluent
      flow: Aqueous steel-hull cleaning effluent transferred for treatment
      reason: Discharged-to-water cleaning flow does not establish technosphere
        treatment transfer.
    - row_id: reduction
      flow: Finished marine propulsion reduction gearbox
      reason: Wind-turbine gearbox does not establish marine reduction hardware.
    - row_id: shaft
      flow: Finished steel marine propeller shaft
      reason: Wind-turbine main shaft does not establish marine shaft design.
    - row_id: propeller
      flow: Finished nickel-aluminium-bronze marine propeller
      reason: Nickel metal/bronze strip cannot stand for a finished
        nickel-aluminium-bronze propeller.
    - row_id: diesel_genset
      flow: Finished marine diesel electrical generating set
      reason: Wind generator and diesel combustion flows are not a finished marine
        genset.
    - row_id: bilge_pump
      flow: Finished marine centrifugal bilge-water pump
      reason: Generic pumps need marine bilge design/completeness verification.
    - row_id: bilge_pipe
      flow: Finished carbon-steel marine bilge pipe
      reason: Generic pipe candidates do not establish marine bilge-pipe
        form/treatment.
    - row_id: cable
      flow: Insulated-copper marine electrical cable
      reason: Generic cable/harness candidates do not establish marine conductor
        insulation/completeness.
    - row_id: starter_battery
      flow: Filled lead-acid marine starter battery
      reason: Battery charging/discharging activity is not finished marine starter
        supply.
    - row_id: window
      flow: Laminated safety-glass marine window pane
      reason: Generic glass candidate lacks laminated marine pane specification.
    - row_id: radar
      flow: Finished marine navigation radar assembly
      reason: Navigation-electronics candidates need exact radar scope verification.
    - row_id: liferaft
      flow: Packed inflatable marine liferaft
      reason: Generic boats are not packed inflatable marine lifesaving rafts.
    - row_id: azimuth
      flow: Finished mechanically driven marine azimuth-thruster assembly
      reason: Chemical search candidates do not establish a complete mechanically
        driven marine azimuth propulsion assembly; retain actual supplier
        completeness.
    - row_id: towing_winch
      flow: Finished hydraulically actuated marine towing winch
      reason: Sea towing service is not purchased marine towing winch hardware.
    - row_id: towing_hook
      flow: Finished forged-steel marine quick-release towing hook
      reason: Rebar/frame and trailer hitch identities do not establish marine
        quick-release towing hook.
    - row_id: towing_rope
      flow: Finished polyester-fibre marine towing rope
      reason: Polyester-cotton textile blend or raw polymer does not establish
        finished marine towing rope.
    - row_id: rubber_fender
      flow: Finished vulcanised-rubber cylindrical tug fender
      reason: Generic rubber candidates do not establish finished cylindrical marine
        fender geometry/formulation; actual material must be documented.
    - row_id: push_knee
      flow: Finished fabricated-steel marine push-knee assembly
      reason: Crane, loom and car-body structures do not establish marine push-knee
        assembly.
    - row_id: coupling
      flow: Finished steel pusher-barge coupling winch assembly
      reason: Road trailer coupling is not pusher-barge marine coupling winch hardware.
    - row_id: hydraulic_oil
      flow: Mineral-base hydraulic oil formulation supplied for marine equipment first
        fill
      reason: Generic public hydraulic fluid permits mineral or synthetic bases; this
        specific mineral formulation and supplier prefill scope remain
        unresolved.
    - row_id: coolant
      flow: Inhibited ethylene-glycol/water marine-engine coolant premix
      reason: Pure glycol or unspecified coolant does not establish inhibited marine
        engine premix.
    - row_id: test_diesel
      flow: Fossil low-sulphur marine diesel fuel supplied for commissioning
      reason: Fishing-vessel fuel-combustion identity is not supply; grade-unspecified
        diesel lacks low-sulphur fossil provenance.
    - row_id: spent_oil
      flow: Spent petroleum lubricating oil transferred for treatment
      reason: Regenerated waste-oil product route is not untreated spent-oil treatment
        transfer.
    - row_id: electricity_stock_form
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_hull_join
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_surface_finish
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_machinery
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_tow_push_gear
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_outfit
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_acceptance
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
    - row_id: electricity_packing
      flow: Alternating-current electricity supplied at the declared shipyard intake
      reason: Voltage/region-specific grid supply requires actual intake evidence
        before selecting a compatible identity.
  unresolved_quantity_ranges:
    - No current actual same-vessel net M or independent boundary-compatible
      manufacture intensity ranges are provided; later foreground records must
      establish amounts and QA limits.
  evidence_limitations:
    - PCR describes required current acceptance-mass provenance; no actual ship
      acceptance/weight record has been obtained or certified. Finite
      measurement consistency does not verify actual ship mass or scientific
      approval.
    - Historical 2020 Norwegian procedure is a limited method example, not
      confirmed current universal law. Manufacturer examples do not prove
      current actual configuration, performance or certification. The used
      1980-built tug/pushboat sheet is historical equipment context only; no
      resale/repair recipe is adopted.
    - No universal recipe, grade approval, vessel mass, lifetime, trial fuel use
      or emission factor adopted. Every actual BOM/species/service must be
      added; missing supplier upstream prevents complete cradle-to-gate claims.
    - Public finished tug/pusher identity is generic; applicability is
      restricted by explicit steel-hull, mechanical-diesel, actual
      towing/pushing equipment and net-mass qualifiers. Its Chinese general
      comment refers to operations, but public type, finished-manufactured route
      and classification identify the vessel product; towing service identity is
      separately rejected.
