system_boundary:
  rules:
    - rule_id: boundary_trials
      applies_to: "acceptance"
      rule: "Include actual serial roller/system acceptance inside the gate. Electrically driven cold engine tests before receipt are supplier processes; do not count them as petrol combustion here. Development, homologation and operating road-cycle fuel/emissions are excluded. Any extra in-house machining/welding/paint boundary needs separate evidenced atomic inventories, not silent inclusion."
