  - rule_id: validate_rows
    applies_to: "all inventory rows"
    rule: "Check one chemical/physical identity and actual direction/type per row, public state/property/unit and official Chinese name, measured normalization and all lowercase rule/protocol references. Preserve fuel Volume, not Mass. Unresolved identities stay declared review gaps; no false mandatory emissions or invented zeros."
