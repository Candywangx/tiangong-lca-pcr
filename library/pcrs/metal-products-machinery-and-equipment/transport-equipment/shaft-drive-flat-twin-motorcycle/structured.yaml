allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Avoid allocation by serial/order/station separation and submetering. Residual shared electricity or handling uses a demonstrated measured causal driver such as actual powered assembly time/load or roller duration/load, retaining numerator/denominator and sensitivity. Equal-per-bike allocation across CVT and flat-twin/shaft architectures, or catalogue mass allocation, is not presumed."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_returns
    applies_to: "spent_oil; protection"
    rule: "Distinguish supplier returns, internal reuse and transferred waste. Attribute reusable shipping racks from actual service/use records, not one new rack per vehicle or an invented lifetime. No automatic fuel/recycled-material avoided-burden credit. A genuine co-product requires separate reviewed causal allocation and compatible recipient boundary."
    source_ids:
      - ghg-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference product"
      record_type: "weighing_record"
      raw_fields: "serial; configuration; accepted net mass M; gross/tare/zero; scale/calibration/uncertainty; measured excluded fuel/item correction; retained fluids; acceptance; count"
      collection_method: "Weigh the accepted complete unit on a calibrated platform scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted serial and changed configuration"
      temporal_coverage: "actual manufacturing reporting period"
      site_scope: "declared final-assembly site"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original scale/calibration/BOM/fluid reconciliation and signed acceptance"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "inventory rows"
      record_type: "production_record"
      raw_fields: "serial; configuration; item/specification; measured net issue/return/stock; supplier inclusion; raw unit; accepted count; calibration; electricity kWh; petrol litres/temperature; actual species/concentration/exhaust flow/time; causal allocation numerator/denominator"
      collection_method: "Record supplier part/model/serial and completed supply boundary, measured received and returned net masses, installed bolts and retained specified lubricant; reconcile engine/gearbox/clutch inclusions. Collect each exchange separately in its declared unit: kg for physical items, MJ for electricity using3.6 per kWh, m3 for petrol using0.001 per litre. Calibrate instruments, retain net stock/return adjustments and measured emissions or explicit not-applicable/unknown status; no default factor."
      unit: "row-specific kg; MJ; m3"
      frequency: "each serial/order and measured actual test period"
      temporal_coverage: "actual reporting period"
      site_scope: "declared assembly site and separately disclosed subcontractor"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original module/SDS/meters/test/stock/waste records and measured allocation"
    - protocol_id: cp_outfit
      process_id: "outfit"
      flow_role: "inventory rows"
      record_type: "production_record"
      raw_fields: "serial; configuration; item/specification; measured net issue/return/stock; supplier inclusion; raw unit; accepted count; calibration; electricity kWh; petrol litres/temperature; actual species/concentration/exhaust flow/time; causal allocation numerator/denominator"
      collection_method: "Reconcile complete serial BOM, separately supplied modules and already-included subassemblies; measure net module quantities and actual oil/coolant/brake-fluid charge and returns; record installed option configuration. Collect each exchange separately in its declared unit: kg for physical items, MJ for electricity using3.6 per kWh, m3 for petrol using0.001 per litre. Calibrate instruments, retain net stock/return adjustments and measured emissions or explicit not-applicable/unknown status; no default factor."
      unit: "row-specific kg; MJ; m3"
      frequency: "each serial/order and measured actual test period"
      temporal_coverage: "actual reporting period"
      site_scope: "declared assembly site and separately disclosed subcontractor"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original module/SDS/meters/test/stock/waste records and measured allocation"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "inventory rows"
      record_type: "production_record"
      raw_fields: "serial; configuration; item/specification; measured net issue/return/stock; supplier inclusion; raw unit; accepted count; calibration; electricity kWh; petrol litres/temperature; actual species/concentration/exhaust flow/time; causal allocation numerator/denominator"
      collection_method: "Collect serial test/roller records, electric submeter readings, actual fuel grade/fossil share and measured quantity/density, outlet species/flow/time and calibrated scale/configuration records linked to accepted count. Collect each exchange separately in its declared unit: kg for physical items, MJ for electricity using3.6 per kWh, m3 for petrol using0.001 per litre. Calibrate instruments, retain net stock/return adjustments and measured emissions or explicit not-applicable/unknown status; no default factor."
      unit: "row-specific kg; MJ; m3"
      frequency: "each serial/order and measured actual test period"
      temporal_coverage: "actual reporting period"
      site_scope: "declared assembly site and separately disclosed subcontractor"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original module/SDS/meters/test/stock/waste records and measured allocation"
    - protocol_id: cp_protection
      process_id: "protection"
      flow_role: "inventory rows"
      record_type: "production_record"
      raw_fields: "serial; configuration; item/specification; measured net issue/return/stock; supplier inclusion; raw unit; accepted count; calibration; electricity kWh; petrol litres/temperature; actual species/concentration/exhaust flow/time; causal allocation numerator/denominator"
      collection_method: "Measure actual separately consumed wood/cardboard/film, return records and reusable rack service attribution; retain release gate and product net mass separate from packaging. Collect each exchange separately in its declared unit: kg for physical items, MJ for electricity using3.6 per kWh, m3 for petrol using0.001 per litre. Calibrate instruments, retain net stock/return adjustments and measured emissions or explicit not-applicable/unknown status; no default factor."
      unit: "row-specific kg; MJ; m3"
      frequency: "each serial/order and measured actual test period"
      temporal_coverage: "actual reporting period"
      site_scope: "declared assembly site and separately disclosed subcontractor"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original module/SDS/meters/test/stock/waste records and measured allocation"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_origin and mass_configuration with real calibrated serial complete-motorcycle weighing. Reject catalogue road-ready/fuelled weight, rider/load, packaging or unmeasured deductions. Required actual records are not provided by this methodology."
      evidence: "original serial scale/calibration/configuration/fluid and acceptance records"
    - id: quality_inclusions
      applies_to: "assembly; outfit"
      requirement: "Reconcile engine/clutch/gearbox supplier inclusions, shaft/final drive, suspension, wheels versus tyres/brakes, fuel tank, catalyst, battery chemistry, wiring, lighting and actual options/fluids. Add omitted actual constituents atomically; finished module and contained parts are not double counted."
      evidence: "actual approved BOM, supply completion, model/serial/SDS records"
    - id: quality_emissions
      applies_to: "petrol; co2_air; no_air; no2_air; co_air"
      requirement: "Preserve actual unleaded fuel specification, public Volume unit and temperature; separately establish fossil carbon origin and measured outlet species/subcompartment. NO is not NO2/N2O/totalNOx; CO chemical product is not air release. No operating WMTC factors are used for factory tests. Document abatement, uncertainty and detection limits."
      evidence: "actual fuel/SDS and calibrated speciated test evidence"
    - id: quality_evidence
      applies_to: "dataset"
      requirement: "Disclose actual site/period/gate, sources, supplier completion, conditional absences, measurement/identity/upstream gaps and uncertainty. Empirical QA ranges require compatible actual records or independent verified originals; no mass, yield, test duration or lifetime is invented. All quantitative acquisition remains pending; automated checks do not establish scientific review."
      evidence: "original evidence, scope and gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_machine; cp_mass"
    rule: "Check the flat-twin four-stroke shaft-drive six-speed complete architecture, actual serial above50cc and positive calibrated net M with fuel/fluid/options reconciliation. Fixed output is1kg; it is not a scooter/chain-drive substitution or service-km."
    source_ids:
