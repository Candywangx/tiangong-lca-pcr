measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: exchange_mass
    applies_to: "frame; engine; gearbox; clutch; shaft; final_drive; bolt; gear_oil; front_suspension; rear_swingarm; rear_strut; front_wheel; rear_wheel; front_tyre; rear_tyre; front_brake; rear_brake; brake_disc; abs; tank; exhaust; harness; battery; saddle; lamp; coolant; engine_oil; brake_fluid; co2_air; no_air; no2_air; co_air; spent_oil; wood; cardboard; film"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure each separately received/consumed/returned physical item in kg. Count statistics require actual measured per-item mass and inclusion scope. Public count/area properties, if later suitable, retain their own units and explicit measured conversion; never overwrite them with Mass."
  - id: electric_energy
    applies_to: "assembly_electricity; outfit_electricity; acceptance_electricity; protection_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the actual public energy property and meter kWh; 1 kWh =3.6 MJ. Supply technology/provider/voltage remain explicitly disclosed upstream gaps, not inferred from a foreground-use identity."
  - id: fuel_volume
    applies_to: "petrol"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Keep public Volume reference property. Measure actual net consumed unleaded petrol in litres under recorded batch/temperature conditions; 1 litre =0.001 m3. An independent mass/carbon balance requires measured density and fossil carbon composition; no assumed kg/litre conversion."
  - id: mass_configuration
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure accepted complete installed configuration after draining/documenting usable fuel. Include required retained operating oil/coolant/brake fluid and battery; exclude rider, luggage, temporary test ballast/fixtures, packaging and loose spares. If a scale reading contains excluded fuel/items, subtract separately measured masses with signed reconciliation, keeping original gross reading. Do not subtract dry-module mass from retained fluids twice."
  - id: mass_record_origin
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use real calibrated platform-scale readings of the serial complete motorcycle, with calibration/zero/tare, positive net M, BOM/options, fluid/fuel state, measurement uncertainty and acceptance signature. The manufacturer catalogue road-ready value includes at least90% usable fuel; it is neither net M nor an actual serial weighing record. Missing actual records remain a quantitative gap."
