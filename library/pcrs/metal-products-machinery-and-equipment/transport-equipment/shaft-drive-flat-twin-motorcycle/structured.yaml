        - bmw-production
    - rule_id: boundary_completeness
      applies_to: "dataset"
      rule: "This foreground gate is not complete cradle-to-gate. Required stages do not make every example exchange compulsory: separately supplied modules, actual oil changes, emissions and packing apply only with records. Add omitted actually used components/chemicals, compressed gas, cleaning, heat or outside tests as separate exact exchanges; disclose omissions/unknowns, never categorical rows or invented zero values."
