review_metadata:
  scientific_review: pending
  semantic_boundary:
    decision: Create narrower complete shaft-drive four-stroke flat-twin
      spark-ignition petrol motorcycle final-assembly methodology. Receive
      completed frame/engine/modules; integrate actual powertrain, running gear
      and complete outfitting; attributable roller/system acceptance, calibrated
      configured net weighing and conditional shipping protection. CNC, engine
      manufacture, welding, pre-receipt coating and vehicle use outside gate. No
      related material complete motorcycle found; engine/component PCRs remain
      upstream. R1250GS technical architecture is an example, not whole49912 or
      proof of current model manufacture.
    rationale: "Independent final-assembly architecture: load-bearing flat-twin
      frame/engine interface, oil clutch/six-speed gearbox/shaft/final-drive
      supply reconciliation and Telelever/Paralever running gear; not
      welded-steel-frame purchased engine/CVT scooter manufacture. Supplier
      engine machining/assembly/welding/paint and cold acceptance outside gate;
      actual complete-vehicle roller/system acceptance and calibrated net
      weighing inside. CPC displacement alone does not establish identity."
  evidence_limitations:
    - No actual configured serial M, calibrated exchange quantities, fuel/SDS
      composition, supplier inclusions or production acceptance/emission
      observations were obtained. These are mandatory acquisition requirements
      for quantitative completion.
    - R1250GS model architecture and current Berlin multi-model factory are
      bounded examples, not current model availability or universal
      manufacturing route. Catalogue fuelled mass and operating WMTC factors are
      not used.
    - Only final-assembly gate is authored, not complete cradle-to-gate; public
      foreground electricity supply remains unspecified and requires compatible
      upstream linkage.
