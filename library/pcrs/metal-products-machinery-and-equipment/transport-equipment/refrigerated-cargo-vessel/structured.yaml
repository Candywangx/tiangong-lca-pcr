  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "The original current vessel acceptance mass record must implement mass_record_provenance. Retain actual physical lightship/weight inspection, observable method inputs/calibration and a signed item-level reconciliation to delivered net configuration; reconcile independently weighed installed modules and fluids. A catalogue or unexplained displacement/tonnage record is insufficient. Missing method, uncertain correction or configuration change prevents a complete quantitative dataset; resolve by new measurement/reconciliation, never an assumed weight."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile drawings/BOM and installed hull/machinery/propulsion, piping/electrical, crew/safety/navigation and actual service-fluid masses, supplier scope and detached delivered parts. Add all actual missing components before completion; received complete modules count once."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, commissioning consumed versus retained fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_refrigeration
      applies_to: "refrigeration; acceptance"
      requirement: "Require actual circuit/hold design, compressor/condenser/cooler/skid inclusions, vapour barrier and insulation composition, charge purity/state and measured installed mass. Retain calibrated leakage/tightness and thermal commissioning protocols: ambient/hold conditions, empty or temporary test loading, temperatures, airflow, duration, meter start/end, refrigerant issue/return/recovery/waste/retention and any independently measured species/outlet. Temporary test cargo and its refrigeration energy are attributable construction trial inputs only, not operational freight. No universal hold temperature, leak percentage or refrigerant-charge intensity is adopted. Missing balance or undocumented test conditions remain scientific data gaps."
      evidence: "actual drawings, SDS, calibration and commissioning reports"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this vessel. PCR checking validates the declared relationship, not a real ship record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured steel-hulled diesel refrigerated cargo vessel and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational cargo/persons/fuel/fresh water/ballast and temporary loads, retain declared installed service fluids. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each atomic physical/chemical exchange, public reference property/unit group, route/state and supplier scope. Engine item count is not mass; a genset includes its engine once; CuO is not Cu2O paint; water supply is not effluent or resource withdrawal. Keep unsupported identity blank and add actual species/components before completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. Generic manufacturer certification does not certify this refrigerated cargo vessel; no universal numerical standard/test/load is adopted."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete steel-hulled diesel refrigerated cargo vessel foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching hull/propulsion/outfitting/coating, controlled net-mass scope, trial boundary, gate/site/period"
  excluded_use: "Cargo refrigeration/freight service or lifetime comparison, equal-mass capacity equivalence, other propulsion/materials and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model; hull serial and drawing revision; fixed refrigerated cargo hold arrangement, steel grades and block completeness; declared mechanical-diesel or diesel-electric propulsion; actual R717 ammonia refrigeration, direct or secondary-brine circuit, refrigerant purity/charge and retained service fluids; insulation chemistry/blowing agent, liner/vapour barrier, hold closures, air distribution and fitted handling equipment; actual test criteria and thermal design; controlled positive net M in kg, current original actual lightship/weight survey and signed net-configuration correction balance; exclusion of cargo, persons, consumable fuel/fresh water/ballast, temporary trial loads, cargo pallets and reefer containers; actual shipyard/site/period/route, supplier boundaries and delivery gate"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Hull/propulsion/outfitting/coating, supplier modules, actual M evidence/corrections, trial state/boundary, manufacturing/acceptance regime, site/period changes"
data_sources:
  - id: "kyokuyo-reefer"
    type: "literature"
    reference: "[Kyokuyo Shipyard: Reefer Ship](https://www.kyokuyoshipyard.com/en/products/reefer)"
    used_for: "Fresh Food Transporter and Customization At Will paragraphs: actual shipyard product architecture, thermal protection/airflow design and configuration dependence. Undated retained publisher snapshot, retrieved 2026-10-05. No capacity, temperature, vessel weight, recipe, certification or manufacturing intensity adopted."
  - id: "gea-reefer"
    type: "literature"
    reference: "[GEA: Reefer ships](https://www.gea.com/en/heating-refrigeration/marine/reefer-ships/)"
    used_for: "Cost Saving Solution and Focus on Sustainability paragraphs: conventional grating-floor and alternative cooler layouts, ammonia/CO2 refrigerant alternatives. Only ammonia architecture enters this narrower PCR; actual purity, machinery, circuit and charge need foreground records. No compulsory floor, universal refrigerant, energy savings or emission/leak factor. Undated retained snapshot, retrieved 2026-10-05."
  - id: "nma-lightship"
    type: "official_guidance"
    reference: "[NMA KS-0179-1E, Rev.07.01.2020](https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf)"
    used_for: "PDF/printed pp.5–7, sections3.1–3.4: ship identification, inspection state, completion/deduction weights, water density, tanks and draught/freeboard. Historical Norwegian method example; current actual vessel method and signed net-configuration corrections are required. No historical tank/trim thresholds or global legal requirement adopted. Retrieved shared original and verified 2026-10-05."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard, 2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2: historical allocation hierarchy only; require actual causal-driver evidence, no universal vessel allocation factor. Shared original read and verified2026-10-05."
