review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Manufacture of complete new steel-hulled dry
    general cargo vessels with mechanical diesel propulsion and a declared
    fixed-pitch propeller: hull-section fabrication and erection, actual surface
    finishing, purchased propulsion/piping integration, cargo-hold closures and
    ship outfit integration, launching, harbour/sea acceptance trials and
    net-mass acceptance. Select one actual hull number, released design and
    delivery configuration. This is a narrower methodology than CPC49314.
    Exclude tankers, container-only ships, ro-ro/passenger ships,
    self-discharging ships, unpowered barges, fishing/work/naval vessels,
    LNG/hybrid/electric propulsion, separately sold hulls/parts, repair and
    remanufacture. Cargo/passengers, commercial voyages, tonne-km, use-stage
    bunkering, maintenance, demolition and port service infrastructure are
    outside manufacture. Actual construction transfer/tow and acceptance trials
    are manufacturing support and require explicitly bounded measured modules;
    no service life or cargo-performance equivalence is assumed. Material
    propeller and wiring-harness PCRs cover upstream parts, not complete vessel.
    No material complete cargo-vessel scope found in this checkout. Old leaf
    read-only, no retired identity/mapping promoted."
  reference_identity_basis: Public manufactured CPC49314 category flow verified
    state100, reference Mass/kg; mandatory exact complete steel hull, diesel
    mechanical propulsion and cargo configuration qualifies broader identity. No
    category LCI, average mass or transport service inferred.
