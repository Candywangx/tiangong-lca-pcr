allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "First subdivide yard/work orders by hull, design and stage. Shared cutting, welding, blast/paint, lifting and dock/shore trial utilities use exchange-specific actual measured causal load/time or demand from cp_allocation, reconciled to supplied total and excluded work. No default deadweight, GT, engine power or hull-area shares."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "hulls"
    rule: "Each hull configuration retains its own measured M and numerator. Rework/reject burden attributed to accepted construction; pooled results only after separate normalization with disclosed measured weights. Residual physical/economic fallback needs actual causal records, sensitivity and review, not invented percentages."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "outputs"
    rule: "Recovered shot/flux/steel/water within yard are transfers, not automatic coproduct or avoided-production credits. External scrap/waste retains measured condition, treatment and responsibility. Saleable coproduct claims require actual quality/market records and reviewed handling; no future ship-recycling credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "trials"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted hull"
      temporal_coverage: "current completed acceptance cycle"
      site_scope: "same exact delivery configuration"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "quality_survey original current weight survey; signed correction schedule; fit-list and independent mass balance; uncertainty"
    - protocol_id: cp_hull
      process_id: "hull"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "drawing/grade/heat certificates; plate/profile issues and returns; cutting stock and nesting; weld procedure/wire/flux issues; block transfers; electricity; offcuts/slag/dust and measured outdoor particles"
      collection_method: "Weigh each grade/consumable and segregated outgoing stream, reconcile stock/block issues and returns; meter actual job demand. Record supplier-cut scope. Sample post-control outlet species/air volume/time and particle-size coverage only if release occurs."
      unit: "kg; MJ"
      frequency: "each hull/work order; stock/meter closure each reporting period"
      temporal_coverage: "whole declared construction cycle including rework; accepted hull count matched"
      site_scope: "all actually included yards/outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list; work orders; issue/return and acceptance records; missing-data log"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "surface area/location; actual abrasive/coating formulation, SDS/solids/mix; supply/recovery/film; water; electricity; waste composition; xylene speciation/air flow/time"
      collection_method: "Measure each actual supplied formulated product and distinct waste; reconcile stock/makeup/recovery and retained coating. Volume-to-mass needs same-product measured density/state. Verify each emitted species after controls; do not invent biocide water release during manufacture."
      unit: "kg; MJ"
      frequency: "each hull/work order; stock/meter closure each reporting period"
      temporal_coverage: "whole declared construction cycle including rework; accepted hull count matched"
      site_scope: "all actually included yards/outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list; work orders; issue/return and acceptance records; missing-data log"
    - protocol_id: cp_machinery
      process_id: "machinery"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "supplier part/model; engine actual count and independent measured dry/installed mass; scope/mass of gearbox/shaft/propeller/genset/pump/pipe/valve; prefill list; alignment and installation records; electricity"
      collection_method: "Count actual supplied assembled marine engines in Item(s), preserving the public property; independently weigh or obtain traceable actual engine weighing records for complete vessel mass reconciliation. Measure each other part supply and separately added fluid, reconcile contained versus installed configuration to hull-specific BOM."
      unit: "kg; MJ; Item(s)"
      frequency: "each hull/work order; stock/meter closure each reporting period"
      temporal_coverage: "whole declared construction cycle including rework; accepted hull count matched"
      site_scope: "all actually included yards/outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list; work orders; issue/return and acceptance records; missing-data log"
    - protocol_id: cp_outfit
      process_id: "outfit"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "hatch/steering/closure model and mass; actual insulation/facing; cable specification/mass; board voltage/inclusions; radar scope; safety/accommodation fit-list with measured masses; electricity"
      collection_method: "Measure each actual released installed part supply; split different product specifications and remove duplicates contained in bought-in modules. Cable energy property cannot become mass without actual supplier-specific conversion evidence. Record all additional actual fit-list exchanges separately."
      unit: "kg; MJ"
      frequency: "each hull/work order; stock/meter closure each reporting period"
      temporal_coverage: "whole declared construction cycle including rework; accepted hull count matched"
      site_scope: "all actually included yards/outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list; work orders; issue/return and acceptance records; missing-data log"
    - protocol_id: cp_trials
      process_id: "trials"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "hull/configuration and approved acceptance plan; launch/transfer/tow scope; trial fuel issued/returned/retained; oil/prefill/circuit state; metered water/actual sea intake density and return chemistry; trial duration/load; outlet gas species/flow/time; used oil/bilge waste; release/rework; signed lightweight survey and net corrections"
      collection_method: "Record actual trial plans/results and measured fuel/water/utilities, including rework. Retrieve signed current lightweight-survey original readings, hydrostatic calculation and measured add/remove item records, followed by documented net-delivery correction; retain full evidence under quality_survey. Meter/speciate actual gas emissions; aggregate NOx is not NO mass."
      unit: "kg; MJ"
      frequency: "each hull/work order; stock/meter closure each reporting period"
      temporal_coverage: "whole declared construction cycle including rework; accepted hull count matched"
      site_scope: "all actually included yards/outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list; work orders; issue/return and acceptance records; missing-data log"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_load"
      record_type: "measurement"
      raw_fields: "total supplied demand; actual submeter/load/time; served hulls; excluded work"
      collection_method: "Measure exchange-specific causal demand/time and all served work orders; document driver and reconcile all shares to actual supplied totals."
      unit: "MJ; h"
      frequency: "each shared batch and reporting-period closure"
      temporal_coverage: "same construction period"
      site_scope: "all served yards/hulls"
      aggregation_rule: "partition actual causal demand; attributable amount / accepted units"
      quality_evidence: "meter closure; sensitivity; uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "hull_plate; hull_profile; weld_wire; weld_flux; hull_power; steel_scrap; weld_slag; particle_air; blast_shot; epoxy_primer; antifoul_coat; finish_water; finish_power; spent_shot; paint_residue; xylene_air; diesel_engine; reduction_gear; propeller_shaft; propeller; diesel_genset; ballast_pump; steel_pipe; butterfly_valve; machinery_power; hatch_cover; steering_gear; watertight_door; insulation; copper_cable; switchboard; navigation_radar; outfit_power; trial_fuel; engine_oil; trial_water; sea_resource; trial_power; used_oil; oily_bilge; fossil_co2_air; nitric_oxide_air"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_survey
      applies_to: "finished_machine"
      requirement: "cp_mass acceptance records must originate in a current actual vessel lightweight/weight survey by a qualified responsible party. Retain original dated hull-specific draft/freeboard positions/readings and repeat checks, water density, verified reference geometry and hydrostatic model at actual trim/heel/deformation conditions, inspected/sounded tank contents and measured add/remove items. Retain traceable instruments, calculation/software/version, signatures and propagated uncertainty; reconcile to complete released fit-list and independent weighed stock/component balance. A displacement figure alone is insufficient. The NMA2020 example supports this method architecture only, not current statutory compliance or numeric thresholds. Missing physical survey/correction evidence blocks dataset use."
      evidence: "nma-lightship-2020"
    - id: quality_delivery_mass
      applies_to: "finished_machine"
      requirement: "Survey lightship condition and PCR net delivered condition must be explicitly reconciled. Include actual installed hull/outfit and declared retained technical oil/coolant in M once; exclude cargo/persons, bunkers, ballast, stores, temporary staging/test weights, packaging and detached spares. Document each correction from actual measured quantities/state, complete missing fit items before final acceptance or independently verify their measured installed mass. Fuel full-load mass, deadweight, gross/net tonnage, design/catalogue lightship estimates and residual guessed mass cannot replace M. No whole-vessel platform scale is presumed."
      evidence: "current survey; signed delivery correction; independent measured fit-list"
    - id: quality_prefill
      applies_to: "components"
      requirement: "Independently measured engine dry/installed masses and received module-contained prefill must reconcile to whole-vessel M. Separately issued oil/coolant counted only beyond supplier-contained fill; trial consumption/removed fluids and retained technical fill separated. No lubricating oil added twice through engine and trials; generator package engine not duplicated as propulsion engine."
      evidence: "supplier scope; weighing/fill records; hull BOM"
    - id: quality_identity
      applies_to: "flows"
      requirement: "Require actual grades, chemical/formulated supply, route/state and supplier-contained part scopes; preserve public reference property. Particle/xylene/fossilCO2/NO need actual immediate-air submedium/species evidence; direct seawater resource separate from product water and oily wastewater. No unmeasured default fuel carbon/sulfur, emissions or lifetimes."
      evidence: "supplier certificates/SDS; outlet samples and calibration; identity audit"
    - id: quality_acceptance
      applies_to: "trials"
      requirement: "Retain current hull/weld inspection, watertight/pressure-system, alignment, steering/electrical/safety and actual harbour/sea trial acceptance records as required by released design. Actual authority/class approvals when held must be traceable; manufacturer marketing cannot establish compliance, numerical pass limits or universal test load."
      evidence: "released vessel plan; actual survey/test approvals; bodewes-build"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Declare actual measured/calculated/estimated/missing/excluded/not-applicable states for every fit-list and route exchange; expand atomic rows for all actual equipment/chemicals/emissions and purchased tow/treatment services. Record primary coverage, uncertainty, provider versions and gaps. Sources supply architecture, not complete plant LCI."
      evidence: "work orders; meter/stock closure; complete fit-list; coverage register"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require1kg complete accepted output and same-hull controlled net M with quality_survey and quality_delivery_mass physical evidence. Do not accept a scale fiction, catalogue/deadweight/tonnage or displacement-only proxy. The finite measurement check validates declared q_item/M relation, not actual survey adequacy."
    source_ids:
      - nma-lightship-2020
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "Match accepted hull count, construction period, configuration and numerator units to normalize_mass and declared protocol. Engine Item(s) needs separate independent mass reconciliation; do not overwrite property or make power-to-mass assumptions."
    source_ids: []
  - rule_id: validation_modules
    applies_to: "manufacturing"
    rule: "Audit supplier blocks, propulsion/generator/outfit containment and prefill against installed BOM; actual missing outfit and alternative finish/joining/support routes require separate atomic inventories. Check trial versus commercial-operation scope and external tow/fuel duplication."
    source_ids: []
  - rule_id: validation_releases
    applies_to: "elementary"
    rule: "Verify species/CAS and actual medium/submedium/time after controls. NO is not total NOx as NO2 or N2O; fossilCO2 requires measured fossil origin. Size fractions replace unspecified duplicates. Clean seawater return, thermal exchange, treated effluent and actual pollutants individually evidenced, never assume all as oily bilge or marine emissions."
    source_ids: []
  - rule_id: validation_completeness
    applies_to: "dataset"
    rule: "Keep identity and physical-data gaps explicit. Complete actual survey/correction, production records, fit-list, supplier/transport/utilities/treatment coverage and applicable acceptance before use. Structural check pass does not grant scientific approval or full cradle-to-gate coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of complete new steel-hulled dry general cargo vessels with mechanical diesel propulsion and a declared fixed-pitch propeller: hull-section fabrication and erection, actual surface finishing, purchased propulsion/piping integration, cargo-hold closures and ship outfit integration, launching, harbour/sea acceptance trials and net-mass acceptance. Select one actual hull number, released design and delivery configuration. This is a narrower methodology than CPC49314."
  excluded_use: "Exclude tankers, container-only ships, ro-ro/passenger ships, self-discharging ships, unpowered barges, fishing/work/naval vessels, LNG/hybrid/electric propulsion, separately sold hulls/parts, repair and remanufacture. Cargo/passengers, commercial voyages, tonne-km, use-stage bunkering, maintenance, demolition and port service infrastructure are outside manufacture. Actual construction transfer/tow and acceptance trials are manufacturing support and require explicitly bounded measured modules; no service life or cargo-performance equivalence is assumed."
  required_metadata: "hull number/model; approved released drawings and revision; hull plate/section grades and certificates, thickness and make-or-buy; hold/tween-deck/hatch design and fitted cargo gear; marine engine supplier/model/count and independent measured mass, gearbox/shaft/propeller scope; generator/pump/pipe/valve supplier containment; electrical voltage/cable and radar configuration; safety, accommodation and insulation fit list; actual coating formulation/route; yard/sites, intersite tow, period and accepted count; current vessel-specific lightweight survey and hydrostatic/reference-position evidence; controlled acceptance net M and corrections; empty cargo/tank delivery state; retained technical oil/coolant versus excluded bunkers/ballast/stores; supplier prefill scope; survey/test instruments and uncertainty; upstream utilities/transport/treatment coverage"
  required_quality_disclosure: "Current released design, supplier containment and fit-list; survey original method/readings/calculation/version/uncertainty; corrected net M and delivery fluids; engine count and independent actual mass; yard/period/trial/rework/stock balance; actual missing exchanges and provider/upstream/tow/treatment gaps; allocation sensitivity; unresolved identities; evidence limitations and scientific review state."
  update_trigger: "Hull/design/plate grade, propulsion or cargo/outfit configuration, supplier/make-or-buy/coating route, yard/utility/trial method or period, survey/delivery state, physical evidence or identity resolution changes."
data_sources:
  - id: "damen-cf5000"
    type: "handbook"
    reference: "Damen Combi Freighter 5000, undated official HTML, product description and Performances / Capacities sections; no pagination. https://www.damen.com/vessels/cargo/multi-purpose-cargo-vessels/combi-freighter-5000"
    used_for: "Case architecture only: box cargo hold and fixed-pitch propulsion with generators. No numeric dimensions, weight/tonnage, power, service duration, fuel-efficiency or compliance claims adopted; optional batteries/biodiesel do not define this route."
  - id: "bodewes-build"
    type: "handbook"
    reference: "Royal Bodewes How we build, undated official HTML, Design & engineering; Building process; Christening and Launching; Seatrials and Delivery; no pagination. https://royalbodewes.com/how-we-build/"
    used_for: "Independent manufacturer sequence: supplied prepared plates/profiles, block assembly/welding, finishing, launch and trials. Site cutting/make-or-buy and launching technology must be actual records; no universal process quantity, place, certification limit or lifetime inferred."
  - id: "nma-lightship-2020"
    type: "official_guidance"
    reference: "Norwegian Maritime Authority KS-0179-1E OTI, Procedures for determination of light ship displacement and centre of gravity of Norwegian ships, Rev07.01.2020, PDF/printed pp4–7, sections2 and3.1–3.4. https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf"
    used_for: "Historical method architecture: responsible survey, completeness/add-remove state, tank evidence, water density and corrected draught/hydrostatic reference positions. Not current legal approval, numeric trim/tank thresholds or actual ship M. PCR net delivery adjustment is independently required foreground evidence."
