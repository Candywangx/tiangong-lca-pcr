measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: electricity_units
    applies_to: "hull_power; finish_power; machinery_power; outfit_power; trial_power"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Actual below1kV grid-user electricity measured as energy;1kWh =3.6MJ. No mass conversion or assumed heat value; different voltage/provider supply separately matched."
  - id: engine_count
    applies_to: "diesel_engine"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Actual supplied assembled marine engine count is q_item; preserve items numerator divided by M. Obtain separate traceable actual engine mass in kg for installed mass reconciliation; do not relabel public count property Mass or infer engine weight from count/power."
process_map:
  - id: hull
    name: "Hull-section fabrication and erection"
    inclusion: "required"
    inclusion_condition: "Receive actual shipbuilding plates/profiles; document ready-to-mount supplier scope versus site nesting/cutting/forming. Weld panels/blocks, erect hull and superstructure to released drawings. Actual bought-in blocks replace contained site stocks/work, not another complete vessel reference."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete vessel reference"
  - id: finish
    name: "Surface preparation and coating"
    inclusion: "conditional"
    inclusion_condition: "Include actual site/outsourced preparation and individual supplied coats; shot/epoxy/antifouling cards are conditional examples, not mandatory universal recipes. Prefinished blocks replace contained work; finishing may occur before/after erection or launching."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete vessel reference"
  - id: machinery
    name: "Propulsion and ship-system installation"
    inclusion: "required"
    inclusion_condition: "Install actual marine mechanical diesel drive, shaft/propeller, generators and declared pumps/piping. Supplier-contained equipment/fluids excluded from additional site supply; purchased components need compatible upstream modules."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete vessel reference"
  - id: outfit
    name: "Cargo-hold and ship outfitting"
    inclusion: "required"
    inclusion_condition: "Fit exact hatch/closure, steering, electrical, navigation, accommodation and safety design. Listed cards initialize individual exchanges; actual additional outfit such as rudder, anchors, chains, lifeboat and cabin panels must each be separately specified/measured before dataset completeness is claimed."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete vessel reference"
  - id: trials
    name: "Launch, acceptance trials and net-mass release"
    inclusion: "required"
    inclusion_condition: "Record actual launching method, transfer/tow modules, harbour/sea trial work, rework and accepted hull. Retrieve controlled current survey-derived net-mass acceptance records; no imaginary whole-ship scale. Record trial consumption separately from retained delivery stock and commercial operation."
    role: "foreground"
    quantitative_reference: "finished_machine"
