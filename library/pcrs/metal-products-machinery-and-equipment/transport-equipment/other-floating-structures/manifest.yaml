  evidence_limitations:
    - "No current actual platform weight/acceptance record is provided. PCR requires physical
      dry-weight/lightweight inspection and exact configuration reconciliation. Finite measurement
      consistency cannot certify real M or scientific approval."
    - "Ponton Made catalogue own-weight table is not actual same-configuration measurement.
      Manufacturer type approval/load ratings do not prove current acceptance of the product; Damen
      equipped-platform examples are narrowed to the structural scope. Koole cargo pontoon is
      excluded-purpose counterevidence."
    - "Historical Norwegian 2020 procedure is conditional survey-method context, not verified
      present universal law. No numerical thresholds, universal coating/welding recipes, lifetime,
      production intensity or compulsory emissions adopted."
    - "Reference candidate Other floating structures has a pleasure/sporting-boat general comment
      inconsistent with its name/classification; finished_machine UUID remains empty and exactly
      declared. Steel plate route/classification mismatch remains unresolved."
