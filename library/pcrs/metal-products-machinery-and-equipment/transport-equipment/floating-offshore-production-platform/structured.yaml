process_map:
  - id: hull
    name: "Pontoon, column and deck fabrication"
    inclusion: "required"
    inclusion_condition: "Receive actual drawing-qualified steel; cut/form/weld panels and blocks, erect complete pontoon/column/deck hull. Ready-cut or purchased blocks replace contained work and stocks."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete platform reference"
  - id: finish
    name: "Surface preparation and coating"
    inclusion: "conditional"
    inclusion_condition: "Include actual preparation/individual coat route where performed; coating may precede block assembly or follow integration. Prefinished supplies replace contained work."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete platform reference"
  - id: systems
    name: "Production and utility module assembly"
    inclusion: "required"
    inclusion_condition: "Install exact process separation, compression, injection and power systems actually fitted. The cards are conditional physical examples, not universal process duty or equipment count. Purchased complete module replaces contained component assembly."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete platform reference"
  - id: integration
    name: "Hull–topsides and outfit integration"
    inclusion: "required"
    inclusion_condition: "Lift/connect actual modules to hull; fit declared accommodation, electrical/utility/safety and onboard mooring equipment. Record interfaces and contained masses; no field mooring hookup."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete platform reference"
  - id: acceptance
    name: "Yard testing and net-mass acceptance"
    inclusion: "required"
    inclusion_condition: "Perform actual structural/system/pressure/electrical tests and precommissioning under released plan, including rework; retrieve current complete-unit weight inspection and controlled corrected net M before field deployment. No whole-platform scale presumed."
    role: "foreground"
    quantitative_reference: "finished_machine"
