    used_for: "Historical applicable-type and lightweight/inclining method architecture, including column-stabilised pontoon/waterplane condition. Not current compliance, numerical limits, M or permission to transfer TLP alternative methods. Actual current survey and independently measured net-delivery correction required."
  - id: "kbr-semisub-2022"
    type: "literature"
    reference: "Richard D’Souza and Shiladitya Basu, A Critical Assessment of Contracting Strategies and Cycle Times of Post-2014 Sanctioned Floating Platforms in the US Gulf of Mexico, Proceedings27th Offshore Symposium,22February2022; Appomattox Development, printed/PDF p3, publisher-retained technical paper. https://www.kbr.com/sites/default/files/documents/2023-10/TechnicalJournal2023_2028_Critical_Assessment_Contracting_Strategies_Cycle_Times_Post-2014_Sanctioned_Floating_Platforms_US_Gulf_of_Mexico_0.pdf"
    used_for: "Historical semisub case: separate hull/topsides fabrication, transport to integration yard, module lifting and precommissioning before field mooring/riser hook-up. No case weights/displacement, capacity, count, duration or life adopted."
  - id: "kiewit-appomattox"
    type: "handbook"
    reference: "Kiewit Appomattox Platform, undated official project HTML, project scope paragraphs, unpaginated. https://www.kiewit.com/projects/appomattox-platform/"
    used_for: "Independent fabricator corroborates topsides utility/power/process/accommodation and water-injection construction/integration; field suction piles separated from our yard-accepted output. No manufacturer numeric weights/capacity or universal process inventory adopted."
