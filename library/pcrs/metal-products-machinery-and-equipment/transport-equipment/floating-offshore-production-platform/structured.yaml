  data_quality_requirements:
    - id: quality_survey
      applies_to: "finished_machine"
      requirement: "cp_mass must retrieve current signed platform-specific actual lightweight/weight inspection records for the accepted near-complete unit under a qualified responsible survey plan. ABS2022 explicitly includes column-stabilised installations and describes inclining-test conditions; it is historical method support, not a current compliance claim. Retain actual inclining/weight-survey procedure, date, positions and raw draft/freeboard readings, observed water density, verified as-built hydrostatic geometry and software/version, trim/heel corrections, tank soundings/densities and measured missing/added/removed items. Apply the actual column-stabilised pontoon/waterplane condition under project-approved method; document effects of braces or other interfering geometry. Independently reconcile accepted hull weight and separately weighed module/equipment records, later changes and completed fit-list; propagate uncertainty and investigate residual. Do not use the TLP-only alternate hull-plus-topside paragraph as permission to omit actual whole-unit verification."
      evidence: "abs-fpi-2022"
    - id: quality_delivery_mass
      applies_to: "finished_machine"
      requirement: "Reconcile survey lightweight to declared net yard-delivered installed configuration item by item using actual measured corrections. Include complete installed steel/equipment and declared retained technical circuit fluids/permanent installed ballast once. Exclude temporary test/transport ballast, fuel bunkers, process oil/gas, operating water stocks, persons/stores, staging/test weights, packaging and detached spares. Record tank/fill condition and material density; actual fluids retained in permanent technical circuits are distinct from operational feed. Displacement alone, full-load fuel mass, deadweight, gross/net tonnage, design/catalogue weight or an unexplained balancing estimate cannot replace M. Missing actual survey, configuration or physical correction evidence blocks dataset use. No imaginary whole-platform scale."
      evidence: "current survey; measured corrections and signed acceptance balance"
    - id: quality_prefill
      applies_to: "components"
      requirement: "Independently measured supplied hull, topsides, pressure equipment and power packages must reconcile to installed configuration and whole-unit M. Identify engine/generator/driver/skid and all supplier-prefilled fluids within each received scope. Site additions counted only beyond prefill; testing consumption/removal and delivery retained stock separate. No double counted package equipment or contained steel/insulation."
      evidence: "supplier boundaries; weighed handover/fit-list/fill and tank records"
    - id: quality_identity
      applies_to: "flows"
      requirement: "Verify actual grade, pressure/voltage, formulation, state, route and installed supplied scope against each public identity; preserve public reference properties. Speciated immediate-air PM/xylene/fossilCO2/NO require actual medium/time/control records; no total VOC as xylene or NOx as NO. Water product, ocean resource and spent test water are separate. No assumed emissions, density, power-to-mass, module weights or life."
      evidence: "supplier certificates/SDS; species-specific samples; actual physical records"
    - id: quality_acceptance
      applies_to: "acceptance"
      requirement: "Retain current released platform-specific structural/weld, watertight, pressure, electrical, shutdown/safety and actual precommissioning acceptance evidence with loads/duration and rework. Project authorities/class requirements must be checked for current applicable design; cited historical rules and manufacturer cases do not establish approval or universal numeric pass limits."
      evidence: "current released plan; actual survey/test acceptance"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Declare measured/calculated/estimated/missing/excluded/not-applicable states for every actual route/fit-list exchange. Expand separate atomic cards for actual additional fairleads, hull openings, fire pumps, flare boom, instruments, insulation facings, sacrificial anodes, other coating/welding chemistry, packaging, hired lifting/transport and treatment. Only list as necessary when released configuration requires them. Selected examples are not complete plant LCI; actual records and compatible upstream datasets needed before completeness claims."
      evidence: "fit-list/work orders; inventory/meter closure; coverage/uncertainty register"
