allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "Subdivide work by hull/module/accepted configuration and yard first. Shared welding, finishing, heavy lifting and testing use exchange-specific measured demand/load/time from cp_allocation, with all served work and total supply reconciled. No default platform displacement, production capacity or lifted-weight share."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "configurations"
    rule: "Accepted units receive attributable rework and rejected-part construction burdens. Normalize each actual configuration using its own M and matched numerator before any measured-output weighted pooling. Residual allocation requires actual driver evidence, sensitivity and review."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "outputs"
    rule: "Internal recovered steel/abrasive/flux/water is transfer, not automatic saleable coproduct or avoided-production credit. Outgoing scrap/waste condition, responsibility and treatment retained. Actual saleable coproduct requires documented quality/market and reviewed handling; no future recycling credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted complete platform"
      temporal_coverage: "current completed acceptance cycle"
      site_scope: "same exact installed yard-delivery configuration"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "quality_survey and quality_delivery_mass original survey; signed correction schedule; module weighing and independent balance; uncertainty"
    - protocol_id: cp_hull
      process_id: "hull"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "drawing/grade/heat; stock issues/returns; block weld procedure/consumables; electricity; steel offcuts/slag; outdoor particle size/species and controls"
      collection_method: "Measure each actual physical supplied exchange, issues less returns and stock change, and independently characterized outgoing stream; meter attributable job demand. Reconcile module-contained scope, rework and matched accepted units. Sample actual release species/medium after controls only where evidenced."
      unit: "kg; MJ"
      frequency: "each platform/module work order; reporting stock/meter closure"
      temporal_coverage: "whole declared construction cycle including rework"
      site_scope: "all included fabrication/integration yards and outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; stock and supplier fit-list; work/test/acceptance records; physical coverage log"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "surface locations; supplied formulation/SDS/solids; abrasive/coating makeup/recovery/retained film; water; electricity; characterized residue; post-control xylene concentration, flow/time"
      collection_method: "Measure each actual physical supplied exchange, issues less returns and stock change, and independently characterized outgoing stream; meter attributable job demand. Reconcile module-contained scope, rework and matched accepted units. Sample actual release species/medium after controls only where evidenced."
      unit: "kg; MJ"
      frequency: "each platform/module work order; reporting stock/meter closure"
      temporal_coverage: "whole declared construction cycle including rework"
      site_scope: "all included fabrication/integration yards and outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; stock and supplier fit-list; work/test/acceptance records; physical coverage log"
    - protocol_id: cp_systems
      process_id: "systems"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "equipment part/model/pressure/material; measured received kg and supplier contained trim/driver/skid/prefill; actual module bill; pressure/weld test records; electricity"
      collection_method: "Measure each actual physical supplied exchange, issues less returns and stock change, and independently characterized outgoing stream; meter attributable job demand. Reconcile module-contained scope, rework and matched accepted units. Sample actual release species/medium after controls only where evidenced."
      unit: "kg; MJ"
      frequency: "each platform/module work order; reporting stock/meter closure"
      temporal_coverage: "whole declared construction cycle including rework"
      site_scope: "all included fabrication/integration yards and outsourced operations"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; stock and supplier fit-list; work/test/acceptance records; physical coverage log"
    - protocol_id: cp_integration
      process_id: "integration"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "module/hull identifiers; received installed masses and revisions; lift/connection and outfit fit-list; cable/voltage; contained insulation/equipment; actual shared lifting demand"
