review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Manufacture of one complete new steel
    column-stabilised semi-submersible offshore oil/gas production platform:
    pontoon/column/deck hull fabrication, actual preparation/coating,
    production/utility/power system assembly, hull–topsides and accommodation
    integration, yard tests and accepted net-mass release before field
    deployment. Choose one released platform identifier, hull geometry, actual
    process train and yard-accepted installed configuration. This scope is
    narrower than CPC49320. Exclude drilling/MODU units, ship-shaped FPSO, TLP,
    spar, submersible seabed-resting platforms, fixed platforms, offshore wind,
    conversions/repairs and separately sold modules. Exclude field
    sail-away/tow, anchor/chain/line installation, subsea wells/risers/export
    pipelines and field hook-up, oil/gas production, produced-water treatment in
    operation, maintenance and dismantling. Fitted yard-delivered
    fairleads/winches belong to the fit-list; separately delivered field mooring
    lines/anchors and subsea assemblies do not. Construction transport between
    included fabrication/integration yards is explicit measured support,
    distinct from excluded field deployment. No production-capacity, lifetime or
    per-tonne-petroleum equivalence. Existing material wiring/propeller PCRs
    concern upstream parts, not this complete hull–topsides architecture; no
    overlapping material platform PCR identified. Legacy leaf remains read-only;
    no mapping or old ID promoted."
  reference_identity_basis: Bounded30 expanded queries and three direct state100
    vessel candidates do not establish an applicable production-platform output.
    Class49319 explicitly excludes platforms. Exact finished_machine gap
    retained without claim of database absence.
