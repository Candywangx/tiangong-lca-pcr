review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Manufacture of a new complete locomotive-hauled
    seated air-conditioned railway passenger coach with welded stainless-steel
    carbody: actual underframe/body fabrication and surface finishing, supplied
    non-powered bogie/body mating, interior/brake/electrical/HVAC installation,
    bounded factory tests and corrected net-mass acceptance. One released
    model/revision, gauge, seating/door/brake/HVAC and supplied-package
    configuration defines applicability. Non-stainless portions of the actual
    underframe are declared separately. This product subset is narrower than
    CPC49532; it is a manufacturing module, not passenger transport performance.
    Exclude self-propelled EMU/DMU vehicles, locomotives, powered tramcars,
    complete trainsets, driving-cab/control coaches,
    sleeping/dining/mail/luggage-only special coaches, maintenance/service
    vehicles, parts sold separately, overhaul/rebuild and other body routes such
    as aluminium FSW. Exclude passenger-km, towing-locomotive
    manufacture/operating fuel, passenger service energy/water, in-service
    maintenance, railway infrastructure and end of life. No operational service
    is supplied by this reference. Actual contracted manufacturing and
    acceptance movements require explicit endpoints and attributable support
    inputs; do not silently omit them or claim complete cradle-to-gate coverage.
    Existing material railway track or road-engine scopes do not cover complete
    non-powered coach manufacturing; no overlapping complete-coach material PCR
    identified. Old legacy leaf retained read-only, no alias or mapping
    promoted."
  reference_identity_basis: Direct public state100 class49532 manufactured Product
    flow with Mass/kg. Broad public coach identity qualified to one actual
    seated air-conditioned non-powered stainless configuration; no
    production-average weight inferred.
