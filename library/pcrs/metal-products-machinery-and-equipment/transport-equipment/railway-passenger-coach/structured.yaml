      process_id: "all_processes"
      flow_role: "shared service attribution"
      record_type: "measured_activity"
      raw_fields: "shared meter totals; work-order hours; actual causal driver; accepted configurations/counts"
      collection_method: "Retain measured causal driver before dividing attributable demand by matched accepted count; reconcile sum to common totals and actual rework."
      unit: "kg; MJ"
      frequency: "each allocation period"
      temporal_coverage: "matched reporting period"
      site_scope: "all served manufacturing configurations"
      aggregation_rule: "partition demand; attributable amount / accepted units"
      quality_evidence: "common meter/work-order closure, driver evidence and sensitivity"
  calculation_rules:
    - id: normalize_mass
      applies_to: "stainless_sheet; underframe_plate; stainless_wire; shield_argon; body_power; stainless_scrap; steel_scrap; particle_air; primer; topcoat; coat_water; coat_power; paint_residue; wash_waste; xylene_air; bogie; coupler; brake_valve; air_reservoir; grease; running_power; seat; window; insulation; floor; door; hvac; r134a_fill; board; cable; battery; toilet; outfit_power; r134a_air; test_water; test_power; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "Obtain actual current accepted coach weighing on calibrated rail scale or traceable complete wheel/axle measuring system appropriate to its actual static/dynamic method. Keep coach serial/configuration, date/instrument/calibration/tare, all wheels/axles once, raw readings and repeat checks, units and method conditions. If readings are forces retain certified force-to-mass interpretation/local measurement conditions rather than assumed constants. Signed corrections remove measured actual excluded stocks and temporary fixtures; independently measured supplied installed body/bogies/interiors/HVAC/fluid masses reconcile full fit-list with uncertainty. Missing originals/corrections block dataset use. Catalogue tare, axle-load limit times axle count, capacity, design/BOM estimate or loaded-service mass cannot replace measured net M."
      evidence: "qlar-wheel-2012; current original calibration/axle observations and signed mass balance"
    - id: quality_delivery
      applies_to: "finished_machine"
      requirement: "Net configuration includes installed non-powered bogies and complete released fit-list, retained technical grease/refrigerant/electrolyte once. Exclude passengers/luggage, potable water and toilet service stocks, substitute loads, packaging, detached spares and temporary test equipment. Document dry/wet supplied modules, actual tanks and measured corrections; do not assume empty/full water tanks. A delivered separate accessory is outside this output unless explicitly installed and requalified."
      evidence: "released fit-list; supplier containment/prefill; tank/correction records"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "Verify one supplied grade/route/state per row with actual certificates/SDS. Non-powered supplied bogie scope excludes traction; do not multiply count by catalogue mass. Tempered double-glazed window assembly differs from laminated glass pane; hardwood treated floor differs from bamboo generic plywood. Low-voltage cables need exact property and actual conversion; never relabel Length/Energy Mass. Conditional R134a requires actual installed chemistry; its air flow CAS811-97-2 immediate unspecified air has no public Chinese baseName, retained HFC-134a is not an invented official translation."
      evidence: "supplier certificates/configuration/chemical identity; exact public flow references"
    - id: quality_release
      applies_to: "elementary"
      requirement: "Collect only actual measured/physically supported post-control release. Match PM size/medium, xylene CAS1330-20-7 versus totalVOC, R134a versus other refrigerants and recovered/retained charge; immediate air unspecified is not indoor/soil/long-term release. No prescribed leakage, fumes or other unavoidable emissions. Expand separately evidenced metals/NO/NO2 or other species, never pool into these cards."
      evidence: "original sampling species/flow/time and controls; refrigerant cylinder/charge recovery balance"
    - id: quality_acceptance
      applies_to: "acceptance"
      requirement: "Keep current actual released weld/dimensional, bogie/brake/pneumatic, electrical insulation, door/HVAC function, water-leak and complete coach acceptance evidence as applicable. Trial plan identifies static versus towed movement, dates/endpoints/duration/load and actual support energy, rework and net delivery state. Current approvals are only claimed when actually verified. Historical manufacturer features do not establish generic fire/speed/gauge/life thresholds."
      evidence: "current coach-specific released plans/results and support records"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Reconcile actual supplied packages with complete installed BOM and utilities/stock totals. Add separate actual fasteners, brake tubing/hoses, dampers/air springs when not contained, gangway/bellows, interior panels, fire-specific flooring/sealants, passenger information/lighting, sanitation/water tanks and actual packaging/treatment/support modules. Disclose measured/calculated/estimated/missing/excluded/not-applicable status for every route item, with uncertainty. Foreground-only coverage and identity gaps remain explicit until compatible upstream modules and actual physical records exist."
      evidence: "full fit-list, stock/meter/supplier scope closure and evidence-gap disclosure"
