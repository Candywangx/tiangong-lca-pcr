allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Prefer configuration/work-order metering and direct stock/test attribution. Rework and actual rejected-coach production burdens stay in matched accepted output; report rejects/returns, no hiding under sales totals."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "Partition shared cutting/welding/coating/assembly/test demand by measured machine occupancy, weld time/length, actual conditioned volume/time or test energy as causally appropriate, reconciled to common meter/work orders. State actual driver units and uncertainty, compare plausible alternatives; no unmeasured equal-per-coach or mass allocation for fixed tests."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "No automatic avoided virgin steel or recovered-refrigerant credit. Keep alloy-specific waste/treatment route, actual ownership and downstream modelling separate; internal recovered gas/water is a transfer with loss measured once. Economic allocation only for documented real co-products after physical causality is unavailable, with actual price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "every accepted coach"
      temporal_coverage: "matched manufacturing/acceptance period"
      site_scope: "actual acceptance/weighing site"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibration/raw complete wheel-axle weighing; signed net corrections; same fit-list"
    - protocol_id: cp_body
      process_id: "body"
      flow_role: "separate atomic exchanges for this process"
      record_type: "foreground_record"
      raw_fields: "stock grade/thickness/heat and returns; released cut/form/weld work orders; joining material/gas; kWh meter; alloy-specific offcuts; actual outlet species/flow"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated mass/energy meter or sampled species concentration times measured exhaust flow/time; match work orders and accepted configuration. Keep count and kg separately, technical prefill containment, stock/rework and outgoing transfer destinations."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and complete period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual fabrication/assembly and declared contracted sites"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier identity/SDS; meter sampling uncertainty; issue-return-stock and accepted count closure"
    - protocol_id: cp_coat
      process_id: "coat"
      flow_role: "separate atomic exchanges for this process"
      record_type: "foreground_record"
      raw_fields: "surface/formulation/SDS/solids; coat issues/returns/retained film; cleaning makeup; energy; residues/wastewater composition; post-control sampled xylene"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated mass/energy meter or sampled species concentration times measured exhaust flow/time; match work orders and accepted configuration. Keep count and kg separately, technical prefill containment, stock/rework and outgoing transfer destinations."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and complete period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
      site_scope: "actual fabrication/assembly and declared contracted sites"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier identity/SDS; meter sampling uncertainty; issue-return-stock and accepted count closure"
