      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated mass/energy meter or sampled species concentration times measured exhaust flow/time; match work orders and accepted configuration. Keep count and kg separately, technical prefill containment, stock/rework and outgoing transfer destinations."
      unit: "kg; MJ"
