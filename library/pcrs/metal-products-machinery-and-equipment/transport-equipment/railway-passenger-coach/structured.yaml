      record_type: "foreground_record"
      raw_fields: "coach serial/design; current tests/endpoints; municipal product water; support electricity; service/test stock corrections; complete-unit calibrated wheel/axle weighing readings and independent mass balance"
      collection_method: "Record each actual exchange independently by supplier issue/return, calibrated mass/energy meter or sampled species concentration times measured exhaust flow/time; match work orders and accepted configuration. Keep count and kg separately, technical prefill containment, stock/rework and outgoing transfer destinations."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and complete period"
      temporal_coverage: "same configuration manufacture and acceptance cycle"
