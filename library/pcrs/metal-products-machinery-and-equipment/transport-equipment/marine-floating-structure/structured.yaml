allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared shipyard resources"
    rule: "Separate hull orders/configurations and directly attribute measured stock issues/returns, finished-module/fitting receipts, work hours, meters, trials and rework first. Inseparable shared resources use a demonstrated measured causal driver such as operation time/load or coating area/layer requirement: share = order driver / sum of drivers for all covered orders. Retain period, denominator and causality; tonnage, nominal displacement or equal vessel count is not an automatic causal driver."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "internal reuse and waste"
    rule: "Internal reused stock/water/test fuel is a transfer, not repeated fresh input or an automatic credit. Exported waste retains its measured quantity and recipient with no assumed avoided-production benefit. Separate saleable co-products before a documented reviewed residual allocation. Reconcile rejected/reworked construction and work in progress to accepted output during the reporting period."
    source_ids: []
