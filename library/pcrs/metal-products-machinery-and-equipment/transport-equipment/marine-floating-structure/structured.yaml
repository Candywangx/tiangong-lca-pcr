  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "Original current records must implement mass_record_provenance. Reconcile the measured module masses, exact module count/layout, measured fitted/detached connectors and all net-scope corrections. Retain original instrument/method/calibration and signed delivery mass balance. Uncertain contents or configuration change requires new measurement/reconciliation; missing actual records blocks complete quantitative data, never replaced by catalogue estimates."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile actual shell/deck/partition drawings, module/connection scope, covers/seals and every integral conditional fitting/finish with delivered dry-net mass. Add all actual missing constituents and fabrication operations before completion; purchased finished modules and in-house constituents count once. Exclude external work equipment and site installation."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, yard-support trial consumed versus returned fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this platform. PCR checking validates the declared relationship, not a real platform weight record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured non-propelled steel floating platform and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational cargo/persons/fuel/fresh water/ballast and temporary loads, retain declared integral fitted components. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each single physical/chemical exchange, public reference property/unit group, exact route/state and supplier scope. Module count cannot stand for net mass; received completed modules replace included stock and work. CuO is not Cu2O paint, and product process water is not effluent or environmental withdrawal. Keep unsupported UUIDs blank with exact row reasons, including the reference product, and append actual omitted exchanges before dataset completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed yard-support trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_structure
    applies_to: "float modules and coupled layout"
    rule: "Reconcile actual module serials/count/layout, shell/deck/partition drawings, integrated connection slots, supplied plates/pins, inspection covers/seals and dry-net delivery scope. Trace actual weld and compartment-integrity method, calibrated test instruments, stated medium and attributable outlets/rework. Manufacturer load/float performance is not net M, a universal test pressure or proof of current product certification. Temporary tests and subsequent site deployment remain distinct."
    source_ids:
      - pontonmade-steel
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. Manufacturer examples do not certify this particular floating platform; no universal numerical standard/test/load is adopted."
    source_ids:
      - pontonmade-steel
published_dataset_profile:
  dataset_role: "Configured complete non-propelled steel floating platform foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching module layout/structure/fittings/coating, controlled net-mass scope, construction-integrity test boundary, gate/site/period"
  excluded_use: "Marine work/transport service or lifetime comparison, equal-mass load/flotation equivalence and other materials/platform purposes and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model, serial and drawing revision; steel grade/thickness, shell/deck/partition form, watertight compartments and supplier module completeness; accepted single-module or explicitly counted coupled platform configuration; fixed coupling plates/pins, covers/seals and conditional fender/bollard/guardrail/anode; coating formulation and manufacturing site/period/gate; positive dry-net M in kg from current controlled acceptance records based on actual weight/lightweight inspection, traceable physical method/calibration and signed itemized configuration reconciliation; integral detached delivered fittings; excluded external work equipment, accommodation, persons, loose cargo, ballast/water/fuel, removable protection, temporary test contents and site civil/anchor work; attributable fabrication test and support-resource scope; actual acceptance regime and upstream linkage"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Module layout/structure/fittings/coating, supplier modules, actual M evidence/corrections, construction test state/boundary, manufacturing/acceptance regime, site/period changes"
