measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "controlled acceptance mass records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Controlled acceptance records are an acquisition interface. Require current original actual dry-weight/lightweight inspection and serial/configuration/delivery-state records with a traceable physical method, calibration and item-level mass balance. Individually weighed complete modules and integral fittings may be reconciled to the exact accepted coupled configuration, with signed additions/deductions and no duplicate included constituents. If an actual afloat survey is used, retain observed draught/freeboard, measured water density, verified hydrostatics and measured tank/test contents, then correct to this dry-net scope. Do not infer an entire-platform scale or substitute catalogue own weight, deck capacity, buoyancy, displacement, deadweight or tonnage for net M. The historical NMA procedure is conditional method context only. [Source: nma-lightship]"
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Actual measured kWh converts by verified unit identity 3.6 MJ/kWh; retain intake voltage and site route. Plant nameplate kW is not measured energy."
  - id: formulation_mass
    applies_to: "liquid formulations"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the actual coating base, hardener, fuel or service-fluid formulation separately. Volume-to-mass requires measured density at declared composition/state/temperature; no tank capacity or brochure coating coverage factor."
