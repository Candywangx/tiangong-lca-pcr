review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "Exclude powered vessels, freight-carrying or liquid-cargo barges, floating docks/cranes or drilling/production/wind-energy platforms, buoys/rafts, non-steel or foam-filled float routes, installed civil infrastructure, repair/conversion/resale and operational lifting/dredging/piling/transport/maintenance/end of life. A trade name pontoon does not establish the same boundary: the Koole cargo-pontoon example carries cargo and fuel and is excluded. This scope is narrower than CPC 49390. Watertight structural flotation, modular connections and dry-net configuration acceptance differ materially from steel material or motor-vehicle body PCRs. Existing scaffold remains read-only; scientific review is pending."
  unresolved_flow_identities:
    - row_id: "normal_hull_plate"
      flow: "Hot-rolled normal-strength certified shipbuilding steel plate"
      reason: "Public thick high-strength plate does not establish normal-strength shipbuilding grade/certification."
    - row_id: "hsla_plate"
      flow: "Hot-rolled low-alloy high-strength thick shipbuilding steel plate"
      reason: "Public candidate describes hot-rolled HSLA thick plate but classifies further-worked alloy flat products; its actual processing state and shipbuilding grade applicability remain unresolved."
    - row_id: "hull_profile"
      flow: "Hot-rolled steel ship-hull stiffener profile"
      reason: "Finished hull blocks and non-alloy Z-section candidates do not establish this stiffener grade/profile route."
    - row_id: "solid_wire"
      flow: "Solid low-alloy steel gas-shielded welding wire"
      reason: "Self-shielded flux-cored wire cannot represent solid gas-shielded wire."
    - row_id: "argon_mix"
      flow: "Argon/carbon-dioxide premixed welding shielding gas"
      reason: "Single CO2 identity does not establish premix composition."
    - row_id: "weld_dust"
      flow: "Captured iron-oxide-rich hull-welding filter dust"
      reason: "Elemental airborne iron is not oxidized captured waste filter dust."
    - row_id: "abrasive"
      flow: "Spherical cast-steel hull-blasting shot"
      reason: "Public shot/grit candidate has inconsistent non-ferrous ore classification and unresolved exact physical grade applicability."
    - row_id: "epoxy_base"
      flow: "Formulated epoxy marine-coating base component"
      reason: "Pure DGEBA resin or generic coating does not establish formulated marine coating base."
    - row_id: "epoxy_hardener"
      flow: "Polyamine marine-epoxy coating hardener formulation"
      reason: "Generic amine substances do not establish formulated marine-epoxy hardener."
    - row_id: "cu2o_paint"
      flow: "Cuprous-oxide self-polishing marine antifouling paint formulation"
      reason: "CuO chemical/ore identity is not Cu2O formulated antifouling paint; refined chemical search still requires formulation identity."
    - row_id: "spent_abrasive"
      flow: "Spent steel blasting shot with removed hull-coating residue"
      reason: "Generic spent abrasive does not establish this steel/paint-contaminated residue."
    - row_id: "clean_effluent"
      flow: "Aqueous steel-hull cleaning effluent transferred for treatment"
      reason: "Discharged-to-water cleaning flow does not establish technosphere treatment transfer."
    - row_id: "connection_plate"
      flow: "Finished steel modular-pontoon coupling connection plate"
      reason: "Generic steel plate does not establish finished pontoon coupling geometry and supplier completeness."
    - row_id: "connection_pin"
      flow: "Finished steel modular-pontoon coupling pin"
      reason: "Road hinge/pin or raw steel does not establish finished pontoon coupling pin."
    - row_id: "inspection_cover"
      flow: "Finished steel watertight pontoon inspection manhole cover"
      reason: "Generic hatch/frame candidate lacks exact watertight pontoon-cover design and supplied completeness."
    - row_id: "epdm_seal"
      flow: "Finished EPDM-rubber pontoon manhole sealing gasket"
      reason: "Styrene-butadiene cover or raw elastomer does not establish finished EPDM manhole gasket."
    - row_id: "bollard"
      flow: "Finished welded-steel pontoon mooring bollard"
      reason: "Generic structural steel does not establish finished pontoon mooring bollard."
    - row_id: "rubber_fender"
      flow: "Finished vulcanised-rubber cylindrical pontoon fender"
      reason: "Generic rubber or raw elastomer does not establish finished cylindrical pontoon fender geometry/composition."
    - row_id: "guardrail"
      flow: "Finished coated-steel pontoon guardrail section"
      reason: "Building guardrail or raw steel requires actual marine structural design, finish and completeness verification."
    - row_id: "zinc_anode"
      flow: "Finished sacrificial-zinc pontoon anode with mounting insert"
      reason: "Zinc metal or galvanised stock does not establish finished sacrificial marine anode alloy and insert scope."
    - row_id: "test_diesel"
      flow: "Fossil low-sulphur diesel fuel supplied for yard-support construction testing"
      reason: "Combustion-service identity is not fuel supply; unspecified diesel does not establish low-sulphur fossil formulation."
    - row_id: "finished_machine"
      flow: "Accepted complete non-propelled steel floating work platform"
      reason: "Public Other floating structures candidate has conflicting pleasure/sporting-boat general comment; exact complete work-platform identity remains unresolved despite Mass/kg and broad matching classification."
    - row_id: "electricity_stock_form"
      flow: "Alternating-current electricity supplied at the declared fabrication-yard intake"
      reason: "Actual intake voltage/region and supply route needed to establish compatible identity."
    - row_id: "electricity_hull_join"
      flow: "Alternating-current electricity supplied at the declared fabrication-yard intake"
      reason: "Actual intake voltage/region and supply route needed to establish compatible identity."
    - row_id: "electricity_surface_finish"
