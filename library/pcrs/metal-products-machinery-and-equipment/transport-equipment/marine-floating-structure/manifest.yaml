    - row_id: "electricity_outfit"
      flow: "Alternating-current electricity supplied at the declared fabrication-yard intake"
      reason: "Actual intake voltage/region and supply route needed to establish compatible identity."
    - row_id: "electricity_acceptance"
      flow: "Alternating-current electricity supplied at the declared fabrication-yard intake"
      reason: "Actual intake voltage/region and supply route needed to establish compatible identity."
    - row_id: "electricity_packing"
      flow: "Alternating-current electricity supplied at the declared fabrication-yard intake"
      reason: "Actual intake voltage/region and supply route needed to establish compatible identity."
  unresolved_quantity_ranges:
    - "No boundary-compatible independent empirical ranges or current actual dry-net M provided; actual records must establish every amount and QA limit."
  evidence_limitations:
    - "No current actual platform weight/acceptance record is provided. PCR requires physical dry-weight/lightweight inspection and exact configuration reconciliation. Finite measurement consistency cannot certify real M or scientific approval."
    - "Ponton Made catalogue own-weight table is not actual same-configuration measurement. Manufacturer type approval/load ratings do not prove current acceptance of the product; Damen equipped-platform examples are narrowed to the structural scope. Koole cargo pontoon is excluded-purpose counterevidence."
    - "Historical Norwegian 2020 procedure is conditional survey-method context, not verified present universal law. No numerical thresholds, universal coating/welding recipes, lifetime, production intensity or compulsory emissions adopted."
    - "Reference candidate Other floating structures has a pleasure/sporting-boat general comment inconsistent with its name/classification; finished_machine UUID remains empty and exactly declared. Steel plate route/classification mismatch remains unresolved."
