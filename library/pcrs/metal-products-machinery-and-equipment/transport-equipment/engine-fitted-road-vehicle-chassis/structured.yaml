measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: delivery_configuration
    applies_to: "complete chassis"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Include actual OEM-accepted installed chassis systems and retained working fluids/fuel; include a permanently supplied/stowed wheel only if in the declared accepted chassis configuration. Exclude coachwork/cab, people, test loads, temporary transport driver seat/control fixtures, loose tools/spares and packaging. Record actual delivery scope. Catalogue running-order weight may include full fuel, spare wheel and tools, and cannot supply this M. If shipping shortens/dismantles the chassis, retain accepted complete-configuration weighing and traceable separate parts; do not substitute shipping weight or invented part mass."
  - id: electrical_energy
    applies_to: "electricity_fabrication; electricity_finishing; electricity_frame; electricity_integration; electricity_acceptance"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain metered kWh and convert1 kWh =3.6 MJ. Rated engine power or installed equipment ratings do not establish factory electricity."
  - id: component_count
    applies_to: "bus_tyre"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Retain public Number of items and actual installed count of each single tyre design. Actual lot-specific measured kg/item times installed count reconciles physical BOM mass only; it does not replace the exchange property. No default wheel count or catalogue tyre weight."
  - id: hydraulic_volume
    applies_to: "hydraulic_oil"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Retain metered net formulated-fluid volume; convert1 L =0.001 m3. For physical retained mass within M only, use measured density at recorded temperature and m = rho times V. No default density or nominal reservoir fill."
  - id: water_resource_volume
    applies_to: "groundwater"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Meter qualifying renewable freshwater groundwater with aquifer/site/country evidence; it is not tap water or wastewater."
  - id: material_mass
    applies_to: "other inputs/wastes/emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh each specified component/formulation/waste or measure each emitted species. Volume-to-mass conversion needs actual density and temperature/pressure evidence. NO, NO2 and N2O cannot be interchanged; constituent mass inside a purchased mixture is not another receipt."
