  classification_refs: "CPC 3.0 49121; narrower candidate; no accepted mapping asserted"
  covered_products: "New complete diesel bodyless steel ladder-frame road-bus chassis assemblies"
  excluded_products: "Complete vehicles/coachwork; unitary/body-integral platforms; other propulsion/non-road/trailer routes; loose parts/kits; use/services"
  representative_product: "One accepted bolted ladder-frame chassis with diesel engine, declared transmission, axles, air suspension, pneumatic drum brakes, wheels, hydraulic steering and actual supplied electrics/fluids"
  production_route: "Receipt/make-or-buy control; conditional stock fabrication/finishing; frame receipt or assembly; powertrain/running-gear/electrical integration; actual fills/checks/acceptance; dispatch protection"
  market_state: "Accepted net complete chassis at its declared factory gate, awaiting coachwork; not a roadworthiness assertion"
functional_unit:
  what: "Manufacture one declared complete diesel engine-fitted bodyless bus chassis configuration"
  how_much: "1 kg accepted net complete machine; one accepted complete machine is represented by physically measured M kg"
  how_well: "Meet actual OEM drawing/BOM and inspection plan for frame joints/alignment, engine/transmission/axle mountings, steering/brake connections, electrical checks and actual leak/function tests. Retain actual criteria/results; no universal bolt torque, pressure, tolerance or test duration"
  how_long_or_cycle: "One chassis manufacturing delivery; no passenger-km, road-mile or lifetime/cycle unit"
  reference_flow_link: "finished_chassis"
system_boundary:
  rules:
    - rule_id: boundary_frame
      applies_to: "fabrication; finishing; frame"
      rule: "Frame receipt or actual bolted assembly is required, not mandatory local raw-steel manufacture. Include local cutting/forming/drilling and finishing only when performed; purchased formed/coated rails or complete frame exclude their local stock and upstream operations. Mercedes p.2 supports one bolted ladder-frame example, not mandatory welding, LNE500, a fastener specification or powder coating. Expand actual nuts/washers/brackets, wet paint/solvents, machining fluid, blasting, heat/oven fuels or outsourcing as separate atomic cards before coverage claims."
      source_ids:
        - mercedes-of1721-chassis-2022
    - rule_id: boundary_integration
      applies_to: "integration"
      rule: "Required receipt/BOM verification and installation of actual engine/gearbox/driveline, axles/suspension/wheels, steering/brake circuits and supplied cooling/exhaust/electrics, connections, fills and adjustment. One supplier gate per assembly prevents duplicate compressor/starter/alternator, brakes, oil and wiring. The representative drum/air-bellows route is not universal: an actual disc brake, leaf suspension, different tank/rim or engine-placement route must expand and qualify its own cards. No coachwork or cab is installed within this scope."
      source_ids:
        - mercedes-of1721-chassis-2022
        - volvo-b8r-chassis-2019
    - rule_id: boundary_acceptance
      applies_to: "acceptance"
      rule: "Chassis acceptance is required. Include physical leak/brake/steering/drivetrain/electrical tests and engine runs only under actual OEM work records, with real criteria/results, duration, loads, fills/returns and monitored releases. No road-test distance, regulatory emission limit, wheel count or fuel-consumption rate is assumed. Reusable support rigs, temporary driver controls and test loads are factory fixtures; actual attributable replacement/service burden is separately evidenced. Downstream bodybuilder wheelbase extension and customer use are outside."
      source_ids: []
    - rule_id: boundary_emissions
      applies_to: "finishing; acceptance"
      rule: "Record only actual direct releases of individual species after controls. Separate groundwater resource from supplied water and contained wastewater, emitted particulate from collected dust, test-consumed from retained fuel and fossil from biogenic carbon. Actual other air submedia, measured particle fractions or water/soil species require matching cards. An absent card is not evidence of zero release."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Specified purchased rails/frame, diesel propulsion engine and rolling-chassis components plus actual local stock/consumables received at chassis factory"
  starting_condition_role: "Foreground receipt gate; upstream manufacture and incoming transport separately linked"
  product_classification_scope: "Cabless/bodyless diesel steel ladder-frame bus-chassis subset of CPC49121"
  recursive_input_rule: "Purchased complete frame/engine/axle replaces included parts and supplier/local operations. Local WIP transfers do not create external receipts"
  upstream_dataset_requirement: "Match frame finish/geometry, road-propulsion engine duty, axle geography and brake scope, component state/property, oil/fuel formulation, electricity source and actual waste receiver"
  disclosure: "Foreground configured chassis manufacture only; disclose local/bought/outsourced operations and missing upstream/transport/receiver links. No complete cradle-to-gate assertion"
