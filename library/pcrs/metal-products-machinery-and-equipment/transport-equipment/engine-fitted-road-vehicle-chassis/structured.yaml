allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "Separate configurations and orders by direct measurement first. Reconcile shared rail/finish/frame/integration/test electricity and consumables using measured causal material throughput, actual stage time/load and served orders, including idle/rework/reject burden. Unequal chassis are not allocated equally by count by default. Record driver justification, uncertainty and sensitivity from actual foreground records; no universal mass/time factor."
    source_ids: []
  - rule_id: allocation_receipts
    applies_to: "assemblies"
    rule: "Purchased/customer-furnished frame, engine, gearbox and axle carry actual upstream inventory burdens and gates; they are not zero-burden receipts. Their included components/fluids replace independent inputs and local manufacture. Actual reusable test fixtures/air supply/recovered fluid require causal service/replacement records, not whole-item consumption each chassis."
    source_ids: []
  - rule_id: allocation_balance
    applies_to: "batch_and_exports"
    rule: "Reconcile receipts, retained installed net mass, WIP, returns/recovery and each exported waste for the same configuration/period. Use actual measured tyre kg/item and fluid density only for physical mass checks; count/Volume properties remain. Separate consumed test fuel and delivery residual. Allocate rejects/rework to accepted units. No automatic avoided-material/disposal credit; real multi-output manufacture needs explicit functions and evidence-based allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "calibrated net weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M; scale/tare; installed systems; retained fluids/fuel; accepted geometry; acceptance; temporary/packaging exclusions"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each complete accepted configuration"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; net weigh ticket; complete-chassis acceptance"
    - protocol_id: cp_configuration
      process_id: "frame_integration_acceptance"
      flow_role: "configuration"
      record_type: "BOM/interface/acceptance ledger"
      raw_fields: "model/serial/drawing revision; ladder frame/joints; engine position/specification; gearbox/axles; suspension/brake/wheel/steering; cooling/exhaust/electrics; supplier scope; shipping versus accepted state; site/period; criteria/results"
      collection_method: "Crosswalk every actual BOM item and operation to an atomic exchange or justified exclusion; verify frame make-or-buy and bought internals. Record one actual configuration and acceptance geometry, excluded temporary seat/controls and retained fluids. Catalogue running-order/gross/axle values cannot supply M."
      unit: "kg"
      frequency: "each build revision/acceptance"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "one traceable complete configuration"
      quality_evidence: "signed BOM/drawing; supplier scope; checks/test results"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_integration_packout"
      flow_role: "single stock/consumable"
      record_type: "net issues and weighing"
      raw_fields: "single grade/design/formulation; state; kg; issues/returns/recovery; measured density/conditions if converted; served orders; accepted count"
      collection_method: "Weigh each actual specified plate, powder, disc, water, engine/gearbox oil, coolant, grease, exhaust solution and protection separately. Reconcile net fresh make-up, returns and remaining stock. Supplier-prefilled fluids and purchased mixture constituents are not repeated; no universal density, concentration or dose."
      unit: "kg"
      frequency: "each issue/return and batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable net mass / accepted machines of the same configuration"
      quality_evidence: "scale; SDS/certificate; inventory/served-order ledger"
    - protocol_id: cp_parts
      process_id: "frame_integration"
      flow_role: "single installed component"
      record_type: "component weighing and completeness"
      raw_fields: "part/design; received/installed kg; actual count; included internals/fluids; country/supply gate; make-or-buy; accepted count"
      collection_method: "Weigh each net specified frame/rail/crossmember/bolt/nut, engine/gearbox/shaft, axle/suspension/brake/steering/wheel rim, tank/cooling/exhaust/electrical component or use actual verified lot-specific mass/count records. Exclude supplier-included internals and expand actual missing mounts, hubs, brackets, reservoirs, filters, pipe fittings, brake linings, sensors and wiring cards before completeness claims."
      unit: "kg"
      frequency: "each supply lot/build batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable installed mass / accepted machines of the same configuration"
      quality_evidence: "scale; component design/certificate; supplier inclusion and BOM"
    - protocol_id: cp_count
      process_id: "integration"
      flow_role: "bus_tyre"
      record_type: "design-specific item count"
      raw_fields: "single tyre design; installed count; receipts/returns; bought inclusions; measured lot-specific kg/item; accepted count"
      collection_method: "Count actual installed tyres of each selected design, preserving public Number of items. Obtain actual lot-specific net kg/item through calibrated weighing for physical BOM mass reconciliation only; no universal wheel count or part weight."
      unit: "Item(s)"
      frequency: "each supply lot/build batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable installed item count / accepted machines of the same configuration"
      quality_evidence: "BOM/count ledger; calibrated part weighing"
    - protocol_id: cp_oil_volume
      process_id: "integration"
      flow_role: "hydraulic_oil"
      record_type: "net formulated-fluid volume"
      raw_fields: "formulation/oil fraction; metered L or m3; fills/returns/recovery; retained fill; actual density/temperature for physical mass; accepted count"
      collection_method: "Meter actual net mineral steering-fluid supply and retain public Volume; convert1 L =0.001 m3. Reconcile fill/return/recovery/retained amounts. Measure density at stated temperature to check physical kg within M, without replacing Volume or assuming reservoir capacity."
      unit: "m3"
      frequency: "each metered fill/return and batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable net fluid volume / accepted machines of the same configuration"
      quality_evidence: "meter calibration; composition; density/temperature and fill balance"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_frame_integration_acceptance"
      flow_role: "electricity"
      record_type: "meter and causal allocation"
      raw_fields: "stage; voltage/source; kWh; interval; actual load/time; idle/rework; shared total; accepted count"
      collection_method: "Meter actual stage energy; convert1 kWh =3.6 MJ and reconcile actual causal loads/times and shared measured totals. Engine rated power, bus duty or installed motor rating cannot prove factory consumption."
      unit: "MJ"
      frequency: "each metered interval/batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "meter calibration; bill; causal-load ledger"
    - protocol_id: cp_fuel
      process_id: "acceptance"
      flow_role: "test_diesel; delivery_diesel"
      record_type: "separate consumed/retained fuel ledger"
      raw_fields: "single petroleum grade; fossil/biogenic certificate; fills/returns; consumed kg; retained kg; supplied engine fuel; density/temperature if volume; actual test interval; accepted count"
      collection_method: "Weigh or meter with actual density/temperature fills, supplier fuel, returns and final residual; determine consumed test fuel from measured balance. Retain delivery residual separately, include its kg in M and exclude supplier-prefilled duplicates. No rated-power times hours fuel estimate without measured relation."
      unit: "kg"
      frequency: "each actual engine test/final fill"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "separate attributable consumed and retained kg / accepted machines of the same configuration"
      quality_evidence: "fuel meter/scale; composition/balance; test/acceptance record"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_acceptance"
      flow_role: "single exported waste"
      record_type: "segregated export weighing"
      raw_fields: "single waste; alloy/formulation; wet/dry; oil/water/metal content; exported kg; recovery; receiver; accepted count"
      collection_method: "Weigh each actual offcut, clean chip, spent disc, captured dust, powder overspray, contained cleaning solution and used steering oil separately. Record composition and receiver treatment. Internal recovered fluid is not export; actual direct water release requires separate species/medium cards."
      unit: "kg"
      frequency: "each export and batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; composition; receiver/treatment receipt"
    - protocol_id: cp_emission
      process_id: "finishing_acceptance"
      flow_role: "single air species"
      record_type: "species-specific post-control monitoring"
      raw_fields: "species; fossil/biogenic origin; medium/submedium; size; measured concentration/exhaust volume/time; identical reference conditions; controls/background; actual interval; accepted count"
      collection_method: "Measure actual post-control species concentration and exhaust volume on identical sampling/temperature/pressure/moisture conditions; integrate over actual attributable intervals, correct background and record uncertainty. Verify immediate unspecified air and unspecified size where selected. Measure NO and NO2 separately; NOx as NO2 equivalent is insufficient without speciation. CO2/CO need verified fossil carbon; no limit-based or mandatory emission quantity."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable measured species mass / accepted machines of the same configuration"
      quality_evidence: "monitoring; sampler/flow calibration; carbon/speciation/medium evidence"
    - protocol_id: cp_water_resource
      process_id: "finishing"
      flow_role: "groundwater"
      record_type: "well meter and aquifer record"
      raw_fields: "site/country; renewable freshwater aquifer; m3; interval; pumping/treatment; reuse; accepted count"
      collection_method: "Meter actual qualifying factory-well abstraction, expand pumping/treatment and exclude internal circulation. Evidence aquifer freshwater/renewability; no duplicate tap-water receipt."
      unit: "m3"
      frequency: "each metered interval/batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared engine-fitted chassis factory"
      aggregation_rule: "attributable abstracted volume / accepted machines of the same configuration"
      quality_evidence: "meter; aquifer/site evidence; water balance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Use identical model/configuration/period/count for physically measured positive M and every numerator. Reconcile frame/engine/axle supplier completeness, actual retained fluids/fuel, tyre counts/physical mass, steering fluid Volume/density and accepted versus shipping geometry. A catalogue net/running-order/gross rating does not meet cp_mass."
      evidence: "cp_configuration; cp_mass; cp_parts; cp_count; cp_oil_volume; cp_fuel"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Disclose unresolved identities, actual missing BOM/route cards, measurements, upstream/transport/receiver links and uncertainty. Initial component examples are not a complete bill of materials. Determine local/bought steel/finish, brake/suspension/engine variants and test operations from factory evidence. No universal grade/yield/part mass, fluid fill/density, wheel count, test duration, emission, life or allocation factor."
      evidence: "cp_configuration; cp_material; cp_energy; cp_waste; cp_emission; cp_water_resource"
    - id: quality_sources
      applies_to: "architecture_evidence"
      requirement: "Mercedes OF1721L/59 physical pp.1–2, printed February2022 on p.2, and Volvo B8R4x2 Euro6 pp.1–4 with2019-11-26 footer on pp.3–4, are historical model-specific evidence only. Mercedes p.2 gives bolted frame, air suspension, drum brakes and running-order weight inclusions; Volvo contrasts shipping geometry, engine/brake/electrical/fuel options. They do not prove universal ladder-frame construction, current conformity, actual net M, factory quantities or service life. No catalogue mass/rating/capacity adopted."
      evidence: "mercedes-of1721-chassis-2022; volvo-b8r-chassis-2019"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Require one complete configured bodyless/cabless diesel ladder-frame road-bus chassis, positive physically measured M kg and cp_mass record. Reference output is1kg; use normalize_mass for kg/MJ/m3/Item(s) numerators with unchanged public properties. A complete chassis is not a complete road vehicle; retain actual delivery exclusions and acceptance geometry."
    source_ids: []
  - rule_id: validation_bom
    applies_to: "inventory"
    rule: "Reconcile actual rails/crossmembers/joints, engine/gearbox/driveline, axles/suspension/wheels, brake/steering, fuel/cooling/exhaust/electrics and fluids with drawings/BOM and supplier gates. Distinguish frame receipt versus local assembly, drum versus disc, actual engine placement, received versus locally filled fluid and consumed versus residual diesel. Expand all actual missing cards/routes before completeness claims."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Verify public type, material/formulation/design, original reference property/unit group, route/state/completeness/geography and official bilingual names. Road engine is not a non-propulsion engine; trailer rim/axle is not an established bus component. NO is not NO2/N2O; fossil carbon is not biogenic, immediate unspecified air not long-term or soil. Groundwater is a resource, tap water a product, contained water/oil a waste, and emitted dust not captured dust."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset_claims"
    rule: "No complete cradle-to-gate claim without actual route and linked upstream/transport/receiver coverage. Manufacturing mass does not establish equal carrying function, roadworthiness, downstream body fit, lifetime or methodology approval. Independent scientific review remains pending."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground engine-fitted bodyless bus-chassis manufacture; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete chassis configuration manufacture scaled with measured M, with separately declared upstream/transport/treatment links"
  excluded_use: "Complete vehicles/coachwork, road passenger/goods services, use/maintenance/lifetime/end of life, other chassis/propulsion routes and methodology approval"
  required_metadata: "All reference qualifiers; drawings/BOM/serial; frame material/joints/make-or-buy; engine location/duty; driveline/brake/suspension/steering/wheel/electrical/cooling/exhaust design and supplier inclusions; actual formulated fills/residual fuel; calibrated M/tare/delivery exclusions/accepted geometry; actual checks/results; site/period/count; supplier/receiver gates and causal allocation"
  required_quality_disclosure: "Unresolved identities/BOM/routes/measurements/links; actual count/Volume/physical-mass reconciliation; rejects/rework/recovery; allocation/uncertainty and historical evidence limits"
  update_trigger: "Frame/engine/gearbox/axle/brake/suspension/steering/electrical design, supplier completeness, accepted/shipping configuration, fluid/finish formulation, actual manufacture/test plan, site/period or allocation change"
data_sources:
  - id: "mercedes-of1721-chassis-2022"
    type: "handbook"
    reference: "Mercedes-Benz, OF1721L/59 technical sheet, Spanish, physical pp.1–2 (unnumbered); p.2 printed Fecha de impresión: Febrero 2022. https://www.mercedes-benz-bus.com/content/dam/mb/ar/es/models/interurbanos/of1721/OF%201721%20L%2059.pdf"
    used_for: "Historical bodyless front-engine chassis and gearbox/axle architecture p.1; bolted ladder frame, air suspension, steering gear, drum/pneumatic brakes, wheels/electrics and empty running-order mass footnote p.2. Footnote includes full fuel, spare wheel, fire extinguisher/toolbox and excludes driver; catalogue mass is not our net M. No mandatory steel grade, local welding/finish, quantities, current conformity or life."
  - id: "volvo-b8r-chassis-2019"
    type: "handbook"
    reference: "Volvo Buses, B8R4x2 Euro6 data sheet, printed/physical pp.1–4; footer BED 380858 2019-11-26 on pp.3–4 (URL filename2020 is not the printed edition). https://www.volvobuses.com/content/dam/volvo-buses/markets/master/coaches/chassis/volvo-b8r/specifications/Data-sheet-B8R-4-2-Euro-6-EN-2020.pdf"
    used_for: "Historical bodyless rear-engine example and transport-versus-approved wheelbase p.1; actual engine/gearbox/suspension/fuel options p.2; disc brakes, steering/cooling/exhaust and spare-wheel/rim options p.3; separate starting/consumer electrical circuits p.4. Used to require actual configuration and avoid universal drum brakes, engine placement, fossil fuel or battery count; does not prove every B8R is a bolted ladder frame. No rated loads/tank sizes/catalogue masses, conversion factor, test recipe, current emission conformity or life adopted."
