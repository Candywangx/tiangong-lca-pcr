    - row_id: brake_pipe
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: fuel_tank
      reason_code: identity_not_established
      explanation: Diesel fuel is not a finished steel fuel tank; no compatible tank
        design established.
    - row_id: radiator
      reason_code: identity_not_established
      explanation: Central-heating radiators, compressed air and aluminium stock do
        not identify a bus engine radiator.
    - row_id: aftertreatment
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: starter_battery
      reason_code: identity_not_established
      explanation: f854fcea has starting qualifiers but BESS commentary and Net
        calorific value; e16524ea also references Net calorific value and
        industrial duty. No measured relationship supports this charged starter
        unit from those properties; neither property is silently replaced with
        Mass or electrical capacity.
    - row_id: engine_oil
      reason_code: identity_not_established
      explanation: Generic base oil and hydraulic-fluid candidates do not establish
        this delivered formulated engine oil and viscosity.
    - row_id: gearbox_oil
      reason_code: identity_not_established
      explanation: Generic hydraulic oil does not establish the
        automatic-transmission-fluid formulation.
    - row_id: coolant
      reason_code: identity_not_established
      explanation: Neat glycol and generic coolant candidates do not establish this
        specified purchased aqueous formulation.
    - row_id: grease
      reason_code: identity_not_established
      explanation: Sizing oil and unspecified processing aids do not establish this
        lithium-soap grease.
    - row_id: urea_solution
      reason_code: identity_not_established
      explanation: Neat urea or nitrogen emissions do not establish this concentration
        and delivered solution.
