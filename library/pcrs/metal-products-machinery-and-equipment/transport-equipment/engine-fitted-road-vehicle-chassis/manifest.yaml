review_metadata:
  semantic_boundary_decision: New cabless/bodyless diesel engine-fitted road-bus
    rolling-chassis manufacturing boundary with separate conventional steel
    ladder frame, narrower than CPC49121. Existing material
    bodies-for-motor-vehicles explicitly excludes engine-fitted chassis;
    loose/non-road engines and complete vehicles are different products. This
    record owns chassis frame/powertrain/running-gear integration, supplier
    completeness and measured net chassis delivery before coachwork. Excludes
    unitary/body-integral platforms, other traction, trailers/non-road
    machinery, loose parts/kits and use/services. Old classification scaffold
    remains read-only; no retired identity promotion or accepted mapping
    asserted.
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
    - row_id: hsla_plate
      reason_code: identity_not_established
      explanation: High-strength plate candidates do not establish this
        not-further-worked certified delivery state; no finished rail is
        identified by stock plate.
    - row_id: abrasive_disc
      reason_code: identity_not_established
      explanation: Abrasive searches did not establish this finished disc design;
        alumina powder is not a resin-bonded disc.
    - row_id: captured_dust
      reason_code: identity_not_established
      explanation: An air particulate identity does not identify contained waste;
        clean chips do not identify captured dust and its contamination.
    - row_id: powder_waste
      reason_code: identity_not_established
      explanation: Searches did not establish this contained spent powder formulation/state.
    - row_id: cleaning_water
      reason_code: identity_not_established
      explanation: Drinking water and water resources do not identify this
        contaminated receiver-bound aqueous solution.
    - row_id: frame_assembly
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: rail
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: crossmember
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: gearbox
      reason_code: identity_not_established
      explanation: Wind-turbine gearboxes and motorcycle powertrains do not establish
        an automatic bus gearbox and its supplier completeness.
    - row_id: propshaft
      reason_code: identity_not_established
      explanation: Wind turbine shafts or raw shaft stock do not establish this
        finished bus driveline.
    - row_id: air_bellows
      reason_code: identity_not_established
      explanation: Safety-airbag chemicals and unrelated suspension candidates do not
        identify this physical bus air spring.
    - row_id: damper
      reason_code: identity_not_established
      explanation: Rare-earth suspensions do not identify a road-bus shock absorber.
    - row_id: wheel_rim
      reason_code: identity_not_established
      explanation: c111cb85 explicitly identifies trailer wheels; a tyre, wind flange
        or trailer-specific rim does not establish this bus-wheel design.
    - row_id: steering_gear
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: brake_drum
      reason_code: identity_not_established
      explanation: A brake-system assembly is not an individual finished brake drum.
    - row_id: spring_brake_chamber
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
        substitutes.
    - row_id: brake_valve
      reason_code: identity_not_established
      explanation: English product/design and refined Chinese searches did not
        establish the specific delivered bus component and completeness; stock,
        unrelated vehicle parts and assembled whole vehicles are not
