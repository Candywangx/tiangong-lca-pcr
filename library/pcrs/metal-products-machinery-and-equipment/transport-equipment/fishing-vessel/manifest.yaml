review_metadata:
  semantic_boundary_decision: New configured welded-steel diesel mechanically
    propelled shrimp-trawler manufacture with fixed plate freezer/refrigerated
    hold, narrower than CPC49315. Existing material wiring/sails/propeller
    products do not cover full ship construction, outfitting, supplier
    completeness, commissioning and surveyed net mass. Distinguishes factory
    carriers, other fishing/propulsion/hull routes, use/catch/processing
    services and loose fishing gear. Old CPC scaffold remains read-only; no
    retired ID promotion or accepted mapping.
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
    - row_id: hull_assembly
      reason_code: identity_not_established
      explanation: Coated factory-ship hull candidate does not identify this uncoated
        shrimp-trawler hull/superstructure; actual supplied configuration and
        finish must be verified.
    - row_id: hull_plate
      reason_code: identity_not_established
      explanation: Hot-rolled high-strength plate candidate has a restricted
        alloy/delivery route; the required actual shipbuilding grade/condition
        is not established.
    - row_id: frame_section
      reason_code: identity_not_established
      explanation: Product/design and refined searches have not established this
        single configured supplied ship component; unrelated machinery,
        services, stock or food are not substitutes.
    - row_id: welding_wire
      reason_code: identity_not_established
      explanation: Public Flux Cored Wire commentary specifies self-shielded
        single-pass carbon-steel wire; it does not establish the gas-shielded
        qualified ship-joint consumable.
    - row_id: welding_co2
      reason_code: identity_not_established
      explanation: Search did not establish this supplied pure industrial
        shielding-gas state/property; elementary CO2 cannot identify a product
        receipt.
    - row_id: weld_slag
      reason_code: identity_not_established
      explanation: No verified matching contained slag identity; generic dregs with
        fixed hazardous composition/treatment are unsuitable.
    - row_id: blast_shot
      reason_code: identity_not_established
      explanation: Cast Steel Shot descriptive material is steel, but classification
        is non-ferrous ore; unresolved conflicting identity rather than forcing
        adoption.
    - row_id: epoxy_coating
      reason_code: identity_not_established
      explanation: Maintenance-coating and water-based resin candidates do not
        establish this newbuild marine epoxy mixture and curing/delivery state.
    - row_id: spent_shot
      reason_code: identity_not_established
      explanation: Fresh shot and metal-polishing discs are not this contaminated
        spent blasting medium.
    - row_id: captured_dust
      reason_code: identity_not_established
      explanation: Air emissions and clean offcuts do not identify collected
        contaminated dust.
    - row_id: paint_waste
      reason_code: identity_not_established
      explanation: Search results do not establish the actual uncured marine-epoxy
        formulation/state and receiver.
    - row_id: wash_waste
      reason_code: identity_not_established
      explanation: Tap water/resources do not identify contaminated receiver-bound
        spent solution.
    - row_id: reduction_gear
      reason_code: identity_not_established
