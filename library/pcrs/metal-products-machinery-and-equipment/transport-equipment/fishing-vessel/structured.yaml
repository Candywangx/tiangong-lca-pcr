  how_well: "Meet actual approved drawings/BOM and yard acceptance plan for hull joints/watertightness, shaft/rudder/deck equipment, electrical/safety/cold-plant function and mass configuration. Preserve actual criteria/results and applicable approvals; no universal tolerances or regulatory conformity assumed"
