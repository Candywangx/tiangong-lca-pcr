system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "hull; finishing"
      rule: "Local hull route tracks nesting/cutting/forming, joint preparation, qualified welding, panel/block erection and inspection/rework from actual plans. Optional actual blasting/cleaning/coating is separately metered. Purchased hull scope replaces those stocks and stages. Expand actual launch crane/tug/slipway, dry-dock, compressed air, heating and outsourced surface work as separate services/exchanges using measured causal activity; never infer whole equipment consumption per ship."
      source_ids: []
    - rule_id: boundary_outfit
      applies_to: "outfitting; acceptance"
      rule: "Track propulsion alignment, rudder/steering, fishing derricks/winches, fuel/bilge/cooling piping, electrical distribution, communications, accommodation/sanitary and safety equipment, and fixed processing/plate-freezer/refrigerated-hold integration. Trace actual completed BOM and add every missing component/formulation before declaring completeness. Bought charged cold plant replaces included compressor, heat exchangers, electrical internals, oils/refrigerant; separately supplied charge or actual leakage requires one species/formulation card with supplier/SDS or monitoring evidence, not an invented refrigerant."
      source_ids:
        - damen-shrimp-trawler-stock
    - rule_id: boundary_trials
      applies_to: "acceptance"
      rule: "Include actual yard-controlled launch, dock and sea commissioning required by the contract, their consumed fuel, measured emissions, rework and commissioning wastes. Separate subsequent fishing operation/catch/freezing, demonstration voyages and delivery transport. A test load is excluded from M; actual food used only for commissioning is a separate receipt/output, not marketed catch or a production co-product. No catalogue test consumption or duration adopted."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased specified steel or hull and complete ship machinery/outfit at the declared yard receipt gate"
  starting_condition_role: "Foreground receipt boundary; upstream manufacture and inbound transport linked separately"
  product_classification_scope: "Declared steel diesel mechanically propelled shrimp-trawler subset of CPC49315"
