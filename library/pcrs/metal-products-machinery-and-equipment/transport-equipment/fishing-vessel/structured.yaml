allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared_operations"
    rule: "Separate hull numbers/configurations by direct records first. Shared fabrication, crane/dock, coating, outfitting and test burdens use actual causal metered loads/activity/time and served orders, retaining idle/rework/reject burden and uncertainty/sensitivity. Unequal ships are not equally allocated by count. No universal mass/time factor; provide foreground evidence for the driver."
    source_ids: []
  - rule_id: allocation_completeness
    applies_to: "bought_assemblies"
    rule: "Bought/customer-supplied hull, engine, winch and refrigeration plant retain actual upstream burdens; no zero-burden assumption. Exclude supplier-included internals/precharges from separate receipts. Reusable fixtures/dock/tug services need causal utilization/replacement records, not whole-item consumption for each ship."
    source_ids: []
  - rule_id: allocation_balance
    applies_to: "mass_and_exports"
    rule: "Reconcile net stock/parts, installed retained mass, WIP/returns/recovery, coating solvent/slag and each waste/emission on the same hull and period. Counted engine and Volume hydraulic fluid require independent physical mass reconciliation. Fuel consumed in trials is separate from excluded delivery tank contents. Real joint output manufacture needs explicit allocation evidence; no automatic avoided-material or treatment credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "controlled survey-derived acceptance mass"
      raw_fields: "model; configuration; serial number; accepted net mass M; hull number; survey method/raw report; net configuration correction; retained working charge; signed acceptance"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted complete ship"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "current actual lightweight survey; raw measurements and corrections; signed mass balance; survey_provenance; net_configuration"
    - protocol_id: cp_configuration
      process_id: "hull_finishing_outfitting_acceptance"
      flow_role: "configuration"
      record_type: "as-built BOM/supplier and acceptance ledger"
      raw_fields: "hull/model/drawing/BOM; actual steel/weld/coating; main engine marine duty; shaft/propeller/rudder; winch/derricks; freezing/storage; accommodation/safety/electrics/navigation; supplied internals/charges; criteria/results; gate/period"
      collection_method: "Crosswalk every actual installed BOM item and operation to a single atomic card or justified exclusion. Record complete configuration, supplier inclusions, launch/test route and acceptance state; expand all missing cards including nozzle, mounts/bearings/seals, pipes/tanks, derricks, hatches/windows, sanitary, furniture, safety and communications. Verify actual refrigerant/charge and fill scope without choosing a nominal chemistry."
      unit: "kg"
      frequency: "each build revision/acceptance"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "one complete traceable accepted configuration"
      quality_evidence: "approved drawings/BOM; supply certificates; checks/results; mass corrections"
    - protocol_id: cp_stock
      process_id: "hull_finishing_outfitting"
      flow_role: "single stock/formulation"
      record_type: "net issues and formulation weighing"
      raw_fields: "single grade/design/formulation; state; net kg; issues/returns/recovery; actual composition/density/temperature; supplied inclusions; hull orders"
      collection_method: "Weigh each actual plate, angle, weld consumable, shielding gas, shot, coating, supplied water and separate machinery fluid on its actual whole-product basis. Record actual density/conditions if metered by volume; subtract returns and exclude supplier-preincluded fluids and mixture constituents. No catalogue tank capacity or generic mixture factor."
      unit: "kg"
      frequency: "each issue/return and hull batch"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable net mass / accepted units of the same configuration"
      quality_evidence: "scale/certificate/SDS; issues/returns; formulation and supply scope"
    - protocol_id: cp_parts
      process_id: "hull_outfitting"
      flow_role: "single installed component"
      record_type: "net component mass and supply completeness"
      raw_fields: "single component/design; received/installed kg; actual count; supplier-included internals/charges; measured lot mass; hull number"
      collection_method: "Weigh each actual specified supplied component or use verified current lot-specific measured mass/count records. Measure complete supplied refrigeration-unit mass and included charge scope; neither nominal cooling rating nor empty unit mass establishes installed mass. Distinguish bought assemblies from local fabrication and installed versus temporary items."
      unit: "kg"
      frequency: "each supply lot/installation"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable installed component mass / accepted units of the same configuration"
      quality_evidence: "scale; actual lot measurements; BOM/supplier completeness"
    - protocol_id: cp_count
      process_id: "outfitting"
      flow_role: "marine_engine"
      record_type: "marine engine count and independent kg"
      raw_fields: "actual installed engine count; marine duty/model; measured supplied engine kg; calibration; included auxiliaries/prefilled fluids; hull number"
      collection_method: "Count actual installed engines of the single marine design. Independently weigh the actual supplied engine, identifying included mounts/auxiliaries and prefilled fluids; verify measured kg/item against the installed engine and ship mass ledger. Preserve Item(s) exchange property; no default engine mass or duplicate supplied engine fluids."
      unit: "Item(s)"
      frequency: "each actual engine supply/installation"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable installed engine count / accepted units of the same configuration"
      quality_evidence: "marine-duty certificate; count ledger; calibrated engine kg/lot; included-fluid evidence"
    - protocol_id: cp_volume
      process_id: "outfitting"
      flow_role: "hydraulic_oil"
      record_type: "metered formulated-fluid volume"
      raw_fields: "single mineral formulation/petroleum fraction; L/m3; fills/returns/recovery; prefill; retained charge; measured density/temperature"
      collection_method: "Meter actual net supplied mineral hydraulic formulation volume; convert1 L =0.001 m3. Reconcile actual retained charge with measured density at recorded temperature for physical kg in M, without replacing public Volume or duplicating prefilled fluid."
      unit: "m3"
      frequency: "each metered fill/return"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable supplied volume / accepted units of the same configuration"
      quality_evidence: "meter; SDS/composition; density/temperature; charge balance"
    - protocol_id: cp_energy
      process_id: "hull_finishing_outfitting_acceptance"
      flow_role: "electricity"
      record_type: "stage-metered electric energy"
      raw_fields: "stage/order/site; kWh/MJ; meter interval/calibration; load/idle/rework; served hulls"
      collection_method: "Meter actual stage electricity. Convert1 kWh =3.6 MJ; justify shared causal drivers and separate auxiliary generator testing from purchased grid power. Installed engine/equipment ratings are not electricity consumption."
      unit: "MJ"
      frequency: "each metered interval/order"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable electricity / accepted units of the same configuration"
      quality_evidence: "meter calibration; bill; causal order ledger"
    - protocol_id: cp_fuel
      process_id: "acceptance"
      flow_role: "test_diesel"
      record_type: "consumed test-fuel balance"
      raw_fields: "single grade/fossil carbon certificate; fills/returns/stock; main/genset tests; measured consumed kg; residual delivery kg outside M; density/temperature; actual intervals"
      collection_method: "Weigh or meter fuel with actual density/temperature and reconcile fills, supplied fuel, consumption, recovery and residual at actual dock/sea test intervals. Allocate actual consumption to acceptance; subsequent voyages are separate. Preserve residual tank inventory for net-mass exclusions and ancillary supply disclosure; no nominal full tank or brochure hourly consumption."
      unit: "kg"
      frequency: "each actual dock/sea test"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable consumed test-fuel kg / accepted units of the same configuration"
      quality_evidence: "meter/scale; fuel origin; actual test and tank balance"
    - protocol_id: cp_waste
      process_id: "hull_finishing_acceptance"
      flow_role: "single exported waste"
      record_type: "segregated waste export"
      raw_fields: "single waste/alloy/formulation; wet/dry; composition; exported kg; recovery; receiver"
      collection_method: "Weigh each actual segregated offcut, slag, spent shot, captured dust, uncured coating, contained cleaning solution and used oil separately. Record water/metal/paint/oil contamination and receiver gate. Recovery is not export; contained liquids are not direct aquatic emissions."
      unit: "kg"
      frequency: "each export and order"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable exported waste mass / accepted units of the same configuration"
      quality_evidence: "scale; composition; receiver/treatment receipt"
    - protocol_id: cp_emission
      process_id: "finishing_acceptance"
      flow_role: "single air species"
      record_type: "species-specific actual monitoring"
      raw_fields: "species/origin; immediate medium/submedium; particle size; concentration/exhaust volume/time; matched conditions; controls/background; attributable interval"
      collection_method: "Measure actual post-control concentration and exhaust volume on identical reference conditions, integrate over attributable intervals and correct background with uncertainty. Verify fossil carbon and separate NO/NO2 speciation; NOx as NO2 equivalent cannot identify them. Selected air submedium and dust size are unspecified; specific measured media/size require matching separate identities. No necessary emission or limit-derived quantity."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared shipbuilding/test period; disclose gaps"
      site_scope: "declared yard and controlled dock/sea trials"
      aggregation_rule: "attributable measured species kg / accepted units of the same configuration"
      quality_evidence: "monitoring/flow calibration; speciation/carbon/medium evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "finished_vessel"
      requirement: "Require positive physically verified M and current raw survey/weight records for the same completed hull/configuration. Acceptance-record collection alone is insufficient without survey_provenance and net_configuration; disclose missing survey/corrections and do not present a physically complete dataset until resolved. Reconcile counted supplied engine kg, installed bought charged refrigeration kg and metered-fluid retained mass, avoiding supplier-precharge duplication."
      evidence: "cp_mass; cp_parts; cp_count; cp_volume; nma-lightship-2020"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Actual as-built BOM, supplier scope, stock/route records, qualified weld/coating plans and acceptance tests determine coverage. Expand missing components, service/resource/chemical/refrigerant/emission cards and upstream/transport/receiver links before completeness claims. No universal yield/grade/part mass, fill, refrigerant, trial duration/emission, life or allocation factor. No current ship measurements are supplied by this methodology."
      evidence: "cp_configuration; cp_stock; cp_parts; cp_fuel; cp_waste; cp_emission"
    - id: quality_source_limits
      applies_to: "architecture_and_method"
      requirement: "Damen undated stock/standard p.1 is one model example with similar-vessel picture, builder certificate only and loose fishing gear exclusion. It establishes neither material grade nor factory inventory/M. NMA Rev.07.01.2020 p.3 explicitly includes fishing vessels; pp.5–7 describe survey completeness, tanks and draft/hydrostatic context. Use as a historical method example, not current law; no thresholds, nominal masses or catalogue performance factors adopted."
      evidence: "damen-shrimp-trawler-stock; nma-lightship-2020"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Require complete declared ship configuration, positive surveyed net M kg, cp_mass and independent survey/configuration evidence; normalize each numerator by M with unchanged public properties. One kg manufactured ship is not equal fishing capacity or lifetime."
    source_ids: []
  - rule_id: validation_completeness
    applies_to: "inventory"
    rule: "Cross-check hull grades/sections/welds/coatings, engine/shaft/propeller/rudder, deck equipment, refrigeration/freezer, installed charges, accommodation/sanitary, piping/tanks/electrics/navigation/safety and actual launch/tests with as-built records. Track fuel/tank-content exclusions, supplier precharge and actual missing cards; no complete cradle-to-gate claim without matched links."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Verify public substance/type/property/unit group and actual design/route/state/completeness/geography; use official bilingual names. Marine engine is not a road class43123 engine; Number of items stays Item(s). Pure shielding gas is not an elementary emission, contained waste not resource water, NO not NO2/N2O and immediate air not soil/long-term. Unresolved identity remains an explicit gap."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset_claims"
    rule: "Manufacturing methodology and mechanical check do not establish scientific approval, current legal/class conformity, fishing service efficiency or measured factory completeness. Physical survey/configuration gaps prevent an asserted complete dataset."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured shrimp-trawler manufacturing foreground; section title does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same configured complete ship manufacture scaled by surveyed net M, with matched upstream/transport/receiver links disclosed separately"
  excluded_use: "Fishing/catch/processing/freezing services, voyage transport, use/maintenance/lifetime/end of life, other ship routes or methodological approval"
  required_metadata: "All reference qualifiers; actual as-built hull/outfit/charged-equipment configuration and gates; survey original method/observations/corrections/densities/tank inventories/signatures/net M; engine count with independent supplied kg; fuel consumption/residual separation; site/period/orders; actual launch/tests, allocation and links"
  required_quality_disclosure: "Identity/BOM/route/survey/mass/measurement/link gaps; source dates/limits, rework/recovery/exports, uncertainty and allocation sensitivity"
  update_trigger: "Hull/material/joint/finish route, propulsion/deck/cold plant configuration, supplier charge/completeness, mass survey/delivery state, yard/test plan, period or allocation change"
data_sources:
  - id: "damen-shrimp-trawler-stock"
    type: "handbook"
    reference: "Damen, Shrimp Trawler2607 Stock / Standard, undated public product sheet with appended presentation; physical p.1 (unnumbered). https://medialibrary.damen.com/m/1ca5a40fe0d02808/original/shrimp-trawler-2607-damen-trading-07813.pdf"
    used_for: "Model-specific mechanical propulsion, deck/plate-freezer/cold-storage/navigation/accommodation outfit and loose-gear delivery exclusion. Similar-vessel image and builder certificate only. No numerical inventory, material grade, recipe, refrigerant, actual M, regulatory approval or operational performance adopted."
  - id: "nma-lightship-2020"
    type: "standard"
    reference: "Norwegian Maritime Authority, KS-0179-1E OTI, Procedures for determination of light ship displacement and centre of gravity of Norwegian ships, Rev.07.01.2020, printed/physical pp.3,5–7. https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf"
    used_for: "Historical ship-survey method example, expressly including fishing ships on p.3; completeness/tank/draft/hydrostatic context pp.5–7. Supports requirement for actual controlled survey originals and net-configuration reconciliation; not a current legal obligation, vessel measurement, numeric limit or M conversion factor."
