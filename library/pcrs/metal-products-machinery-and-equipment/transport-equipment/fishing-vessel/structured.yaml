measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: survey_provenance
    applies_to: "finished_vessel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "cp_mass acceptance records must originate in a current actual lightweight/weight survey for this hull number. Require original draft/freeboard observations, survey water density, verified as-built hydrostatic geometry and trim corrections, tank soundings/composition/density, witnessed completeness and measured additions/removals. Reconcile certified lightship condition to this accepted net configuration with signed traceable kg corrections and uncertainty, checked against actual installed-component mass balance. Do not replace net M by a nominal displacement, deadweight, GT/NT, catalogue estimate or full-fuel weight. No whole-ship platform scale is presumed. Historical NMA pp.3,5–7 supports the survey method context; use actual vessel-appropriate approved method and records."
  - id: net_configuration
    applies_to: "finished_vessel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Include permanent installed hull/outfit and actual retained lubricating, cooling, hydraulic and refrigeration charge in closed machinery systems. Exclude fuel and fresh-water storage contents, ballast, sewage/bilge contents, catch/cargo/ice/packaging, people, loose fishing gear/tools/stores, temporary construction/test equipment and loads. Record each tank/system inventory and physical correction to net acceptance state. A fuel residual supplied with delivery is a separate ancillary output, outside this net ship reference; expand its receipt/output cards if included in the dataset. No service-tank capacity substitutes for measured correction."
  - id: engine_count
    applies_to: "marine_engine"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Retain actual supplied installed engine count, with unchanged public Number of items. Independently measure supplied engine kg per actual configuration/lot and supplier-prefilled scope to reconcile ship M; this physical kg/count relation is not a replacement exchange property. Road/aircraft propulsion engines are excluded from the selected class43110 identity."
  - id: electrical_energy
    applies_to: "electricity_hull; electricity_finishing; electricity_outfitting; electricity_acceptance"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain actual metered kWh;1 kWh =3.6 MJ. Installed power is not factory consumption."
  - id: hydraulic_volume
    applies_to: "hydraulic_oil"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Retain net supplied formulation volume;1 L =0.001 m3. Physical retained mass reconciliation uses measured density at recorded temperature, without changing public Volume or assuming nominal fills."
  - id: species_and_formulations
    applies_to: "hull_assembly; hull_plate; frame_section; welding_wire; welding_co2; offcut; weld_slag; blast_shot; epoxy_coating; cleaning_water; spent_shot; captured_dust; paint_waste; wash_waste; air_dust; reduction_gear; propeller_shaft; propeller; rudder; anchor; trawl_winch; steel_bolt; hydraulic_hose; genset; bilge_pump; electrical_cable; starter_battery; radar; plate_freezer; hold_refrigerator; hold_insulation; engine_oil; coolant; test_diesel; used_oil; air_co2; air_co; air_no; air_no2; finished_vessel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use whole specified formulation/component mass for kg exchanges. Constituents already in bought mixtures/assemblies are not duplicate receipts. Each measured emission is one chemical species/origin/medium; separate NO/NO2 and fossil/biogenic carbon. Metered volume-to-mass needs actual density/conditions."
