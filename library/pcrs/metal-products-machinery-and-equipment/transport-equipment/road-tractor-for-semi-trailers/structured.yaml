measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: engine_mass
    applies_to: "diesel_engine"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Collect net installed supplied engine-assembly mass in kg using cp_engine_mass; this mass is the engine q_item numerator per accepted finished machine. Keep engine count/serial for traceability only. Independently reconcile engine body, supplier-included components and retained prefilled fluids with the complete vehicle M; exclude duplicated component/first-fill inputs. No fixed kg per engine is assumed."
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert actual measured kWh with verified unit-group factor 3.6 MJ/kWh; record intake supply/voltage. Rated engine kW is not test energy."
  - id: liquid_mass
    applies_to: "liquid exchanges"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the actual supplied formulation or use measured density at declared composition/concentration/temperature for volume conversion; catalogue capacity is not fill amount."
