allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacture"
    rule: "Separate orders by VIN configuration and directly assign measured issues, returns, station meters and rework first. Inseparable shared resources use a measured causal driver such as station time/load: share = order driver / sum of drivers for all covered orders. Retain denominator, period and demonstrated causality; equal count between different cab/axle/powertrain configurations requires justification."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "recoveries and rejects"
    rule: "Internal reusable stock or test fluids are transfers, not repeated new inputs or automatic credits. Exported waste retains its measured amount and outlet with no assumed avoided-product benefit. Separate saleable co-products before documented reviewed residual allocation. Attribute rejected/reworked unit burdens to accepted output in the covered period and reconcile work in progress."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted net machine mass"
      record_type: "weighing_record"
      raw_fields: "model; configuration; VIN; accepted net mass M; scale_id; calibration; fifth_wheel; detached_integral_parts; retained_fuel_urea_service_fluids; operator_tare; packaging_tare"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each machine or representative same-configuration batch"
      temporal_coverage: "same manufacturing order period"
      site_scope: "declared factory"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration, tare, configuration, release record"
    - protocol_id: cp_frame_prepare
      process_id: "frame_prepare"
      flow_role: "Frame preparation"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Collect rail grade/thickness and drawing revision, weighed issues/returns/offcuts, operation time, dimensional acceptance and station meters."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
    - protocol_id: cp_surface_finish
      process_id: "surface_finish"
      flow_role: "Conditional surface preparation and finishing"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Retain paint SDS and layer recipe, weighed issues/returns, water/effluent transfers, coated part completeness, curing meter and actual emission measurements if present."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
    - protocol_id: cp_chassis
      process_id: "chassis"
      flow_role: "Rolling chassis and fifth-wheel assembly"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Trace serial BOM, supplier included parts, independent module masses, bolt torque/alignment, brake circuit and coupling installation acceptance."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
    - protocol_id: cp_engine_mass
      process_id: "powertrain"
      flow_role: "diesel_engine"
      record_type: "weighing_record"
      raw_fields: "VIN/order; configuration; engine model/serial; installed supplied engine mass kg; engine-body mass kg; included accessory masses kg; prefill formulations and actual retained kg; actual drained/returned kg; separately added fluid kg; count for traceability; accepted machine count; scale/calibration/tare; supplier gate"
      collection_method: "Weigh each net supplied engine assembly on a calibrated scale in its declared installed state, excluding shipping fixtures. Use independent traceable engine-body/component and actual retained-prefill weighing records to reconcile assembly scope; verify installed assembly mass against the same VIN BOM and accepted complete-vehicle M. Record actual drained/returned and separately added fluids, without a catalogue/default kg per engine. Exclude duplicate accessory and prefill inputs."
      unit: "kg"
      frequency: "each supply lot and installed configuration"
      temporal_coverage: "same declared manufacturing period"
      site_scope: "declared powertrain integrating factory"
      aggregation_rule: "attributable installed supplied engine mass / accepted machines"
      quality_evidence: "calibrated engine weighing; supplier BOM/scope; component/prefill balance; VIN installation and cp_mass record"
    - protocol_id: cp_powertrain
      process_id: "powertrain"
      flow_role: "Diesel powertrain and cab integration"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Use cp_engine_mass for independently weighed installed supplied engine kg, with count/serial only for traceability and prefill/inclusion reconciliation; collect gearbox/cab scope, fittings, exhaust architecture, tank material and station meters."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
    - protocol_id: cp_electrical
      process_id: "electrical"
      flow_role: "Vehicle electrical installation"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Retain wiring revision, battery chemistry/capacity and supplier condition, independent installed masses, software configuration and wiring test records."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "First fill and factory acceptance"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Record serial-linked fill/return/retained balances, actual fuel origin and test log, calibration, measured emissions, release record and accepted net M with packaging/operator tare."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "Dispatch protection"
      record_type: "foreground_record"
      raw_fields: "VIN/order; configuration; accepted count; exchange name/state/property/unit; issue; return; stock change; supplier included constituents; retained fill; electricity kWh; installed supplied engine mass kg; engine count for traceability; waste outlet; actual emissions; shared driver/denominator; calibration"
      collection_method: "Weigh material-specific protection, record tare/returns and exact dispatch completeness."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared factory and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "BOM, weighing, meters, transfers and acceptance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_bom
      applies_to: "complete tractor"
      requirement: "Reconcile VIN BOM, fifth wheel, frame/axles/wheels/brakes, engine/transmission, fitted cab, electrical installation, cooling/exhaust and retained first fills to measured net M. Resolve supplier module overlap and add omitted actual components."
      evidence: "weighing, configuration and supplier scope"
    - id: quality_balance
      applies_to: "flows and testing"
      requirement: "Retain calibration, issues/returns/stock balances, installed versus consumed fluid and test fuel, measured emission species/origins, waste outlet receipts and actual recipe/density conversions. Set QA limits from site records; no invented universal yield or test consumption."
      evidence: "stock, meters, test and transfers"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose geography/period, configurations, conditional absence, outsourcing, identity/quantity uncertainty and missing supplier upstream. Sources support examples of architecture/process, not manufacturer-wide recipes or current completion of old announced investments."
      evidence: "coverage and evidence register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require positive measured M and complete VIN configuration including fifth wheel, drivetrain, fitted cab, installed equipment and retained fills. Reject semi-trailer, cargo, gross train weight and transport service substitutions."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Verify atomic exchange, public identity, actual reference property/unit group, supply route, material state and medium. Road propulsion must match the motor-vehicle engine category and original Mass/kg reference; class43110 excludes motor vehicles and aircraft. Engine count is not the mass numerator; supplier prefill/components must not be counted twice. Trailer hitch is not a verified fifth wheel; cutting emulsion is not engine coolant; fertiliser as N is not automotive urea solution. Keep incompatible identities blank."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify collection/conversion against same configuration/period and measured M. Reconcile supplier prefills, retained test fuel and component masses without duplication, with no unknown-to-zero defaults."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable factory species and actual medium. Fossil CO2 is air-unspecified and requires fossil provenance; biogenic emissions, NO, NO2, N2O and captured wastes cannot be substituted or merged. Add actual species separately before dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete diesel road-tractor foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset following qualified review and declared upstream linkage"
  allowed_use: "Supply-chain manufacturing models matching diesel architecture, axle/cab/coupling configuration, first-fill state, gate/site/period"
  excluded_use: "Freight service or lifetime comparison, equal-mass towing equivalence, alternative propulsion, trailers and unsupported complete cradle-to-gate claims"
  required_metadata: "manufacturer/model; VIN and configuration/drawing revision; diesel engine family and fuel compatibility; gearbox type and supplier prefill; axle arrangement, wheelbase and suspension; cab type and fitted completeness; fifth-wheel material, mounting and lock interface; braking/steering architecture; tyre/rim specification; installed battery/controller/harness; cooling and exhaust-aftertreatment completeness; installed options; actual retained fuel, urea and service fluids; measured net M and scale calibration/tare; separately weighed detached integral components; actual make-or-buy route, site/period, gate and upstream coverage"
  required_quality_disclosure: "Identity/quantity gaps, uncertainty, conditional absence, full-BOM completion, source limitations, allocation and unlinked upstream"
  update_trigger: "Propulsion/fuel, axle/cab/coupling specification, supplier module scope, fills/M, manufacturing route, site/period and evidence resolution changes"
data_sources:
  - id: "scania-production"
    type: "literature"
    reference: "[Scania Asia P&L](https://www.scania.com/asia/en/home/our-business/p_l.html)"
    used_for: "Press Shop/BiW/Paint/Cab/Chassis paragraphs: separate cab preparation, component integration and end-flow functional inspection. Retrieved 2026-10-05. Example only, not compulsory automation or recipes. Powertrain future 2025 Q4 statement is not evidence of completed/current production; no quantities adopted."
  - id: "volvo-spec"
