  unresolved_quantity_ranges:
    - "No verified same-configuration net M or boundary-compatible independent manufacturing intensity ranges; foreground measurements must establish amounts and QA limits."
  evidence_limitations:
    - "Diesel-only manufacturing boundary narrower than CPC leaf; no classification mapping acceptance is claimed."
    - "Reference product identity unresolved; freight service and trailers are incompatible."
    - "Manufacturer configuration/process examples do not establish universally mandatory recipes, actual fill mass or vehicle lifetime."
    - "Scania future 2025 Q4 Powertrain statement is not evidence of completed/current plant output."
    - "Every actual BOM exchange and demonstrated species must be added before dataset completion; supplier upstream must be linked before complete cradle-to-gate claims."
    - "Road-engine public identity establishes motor-vehicle propulsion and Mass/kg, not actual supplier completeness or prefill amounts. Independently measured body/accessory/prefill/installed-assembly masses must reconcile to the same VIN and measured M; supplier-prefilled fluids are not repeated as first-fill inputs."
  rejected_flow_identities:
    - row_id: diesel_engine
      uuid: d3ac8612-80b9-4283-9439-62aa4986fce2
      reason: Public class43110 explicitly excludes motor vehicles and aircraft; this
        non-motor-vehicle engine cannot represent road-tractor propulsion. Its
        Number of items does not establish the replacement engine Mass/kg
        numerator.
  engine_flow_identity:
    row_id: diesel_engine
    status: verified_public_identity
    uuid: 2bc283a7-36f3-40f7-9e15-54851b888d33
    classification: "43123"
    reference_property: Mass
    reference_property_uuid: 93a60a56-a3c8-11da-a746-0800200b9a66
    unit: kg
    scope: One supplied compression-ignition piston engine for declared diesel
      road-tractor propulsion, with actual engine-body/accessory and
      retained-prefill scope measured and reconciled to installed assembly and
      complete vehicle M.
    remaining_evidence_needs: Actual supplied/installed engine kg, independent
      engine-body/component weighing, supplier prefill composition/retained kg,
      drained/returned and separately added fluid, VIN BOM and complete-vehicle M
      require foreground records; identity is not a measured quantity or fixed
      per-engine weight.
