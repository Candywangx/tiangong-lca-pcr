  unresolved_quantity_ranges:
    - "No actual current helicopter net mass, manufacturing intensity, component share, cure/flight duration or empirical QA range supplied. Obtain configuration-specific physical weighing, plant records and compatible source evidence before quantitative completion."
  evidence_limitations:
    - "Airbus and Robinson originals support configured product/component/production context only; neither supplies current serial aircraft mass or this plant inventory."
    - "FAA 2016 guidance supplies historical physical weighing principles, not present aircraft certification or universally applicable legal criteria; actual current manufacturer instructions and original calibration/state measurements required."
    - "No actual helicopter weighing or plant records obtained/certified; finite PCR measurement pass establishes only declared relationships. Required actual unusable/usable fuel and oil-state evidence remain scientific/data-production needs."
    - "Receipt-to-acceptance foreground is not complete cradle-to-gate; unlinked supplier manufacture and unresolved identities/quantity ranges remain explicit."
