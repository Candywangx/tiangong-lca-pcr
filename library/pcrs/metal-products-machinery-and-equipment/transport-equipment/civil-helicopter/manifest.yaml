review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "Create one narrower manufacture PCR for new complete civil manned single-turboshaft conventional-main/tail-rotor skid helicopters. Material vehicle-body, metal/composite and other transport records do not cover aircraft rotor/power integration, configured empty-state weighing and production-flight acceptance. Other power/rotor/gear or military/unmanned routes require separate review; old leaf unchanged and no mapping acceptance asserted."
  unresolved_flow_identities:
    - row_id: "aluminium_sheet"
      flow: "Wrought aerospace aluminium-alloy sheet with declared temper"
      reason: "Generic aluminium sheet does not establish actual aerospace alloy/temper and certified supplied processing state."
    - row_id: "chromoly_tube"
      flow: "Seamless chromium-molybdenum steel airframe tube"
      reason: "Titanium/aluminium or non-circular steel tubes do not establish this chromoly seamless aircraft tube."
    - row_id: "aluminium_rivet"
      flow: "Solid aluminium-alloy aircraft rivet"
      reason: "Public generic rivet permits metal/non-metal variants without establishing this alloy/solid aircraft configuration."
    - row_id: "machining_fluid"
      flow: "Water-miscible semi-synthetic metalworking-fluid concentrate"
      reason: "Pure lubricant and machine-tool products do not establish the actual formulated concentrate."
    - row_id: "aluminium_chips"
      flow: "Segregated untreated aerospace aluminium-alloy machining chips"
      reason: "Aluminium chip candidates require matching alloy/machining/contamination and transfer state."
    - row_id: "steel_chips"
      flow: "Segregated untreated chromoly-steel machining chips"
      reason: "Public generic steel-chip route does not establish alloy and chip contamination of this aircraft tube machining."
    - row_id: "carbon_prepreg"
      flow: "Uncured carbon-fibre epoxy aerospace prepreg"
      reason: "Public combined carbon/glass composite includes processed laminate/infusion routes, not this uncured epoxy prepreg."
    - row_id: "glass_prepreg"
      flow: "Uncured glass-fibre epoxy aerospace prepreg"
      reason: "Public combined composite does not resolve uncured glass/epoxy prepreg chemistry/state."
    - row_id: "pvc_core"
      flow: "Closed-cell rigid PVC structural sandwich foam core"
      reason: "PVC polymer or unspecified foam does not establish finished structural foam-core density/state."
    - row_id: "ptfe_release"
      flow: "Unlaminated PTFE mould-release film"
      reason: "PTFE polymer or solvent-based PTFE coating is not an unlaminated release film."
    - row_id: "carbon_trim"
      flow: "Cured carbon-fibre epoxy laminate trim transferred for treatment"
      reason: "Generic composite or raw carbon fibres do not establish cured trim/waste route."
    - row_id: "glass_trim"
      flow: "Cured glass-fibre epoxy laminate trim transferred for treatment"
      reason: "Generic composite does not establish cured glass/epoxy trim waste."
    - row_id: "isopropanol_solvent"
      flow: "Anhydrous isopropanol cleaning solvent"
      reason: "Direct public isopropanol product comment mixes neat alcohol with 70% ethanol/isopropanol disinfectant; elemental emissions are not supplied solvent."
    - row_id: "epoxy_primer"
      flow: "Formulated epoxy aircraft corrosion-primer base"
      reason: "Pure epoxy resin or generic coating lacks actual formulated primer base."
    - row_id: "primer_hardener"
      flow: "Polyamine epoxy aircraft primer hardener formulation"
      reason: "Generic amine does not establish formulated primer hardener."
    - row_id: "pu_base"
      flow: "Formulated polyurethane aircraft topcoat base"
      reason: "Generic solvent coating or polyurethane polymer is not actual topcoat base."
    - row_id: "pu_hardener"
      flow: "Polyisocyanate aircraft topcoat hardener formulation"
      reason: "Pure isocyanate does not establish formulated hardener and concentration."
    - row_id: "coat_overspray"
      flow: "Captured polyurethane aircraft-coating overspray waste"
      reason: "Generic coating or solvent emission is not captured polyurethane overspray transfer."
    - row_id: "clean_effluent"
      flow: "Aqueous aluminium-airframe cleaning effluent transferred for treatment"
      reason: "Environmental water release is not a technosphere effluent transfer."
    - row_id: "fuselage"
      flow: "Complete specified metallic/composite helicopter fuselage and tail-boom airframe assembly"
      reason: "Generic composite materials or aeroplane parts do not establish received complete helicopter structure."
    - row_id: "skid_gear"
      flow: "Complete aluminium helicopter skid landing-gear assembly"
      reason: "Tubing or road vehicle parts are not a complete skid gear."
    - row_id: "pilot_seat"
      flow: "Complete civil helicopter pilot seat assembly"
      reason: "Generic furniture does not establish aircraft seat assembly and supplied restraint/frame scope."
    - row_id: "windscreen"
      flow: "Formed PMMA acrylic helicopter windscreen"
      reason: "Raw acrylic sheet or polycarbonate/granulate does not establish shaped PMMA windscreen."
    - row_id: "turboshaft"
      flow: "Complete single helicopter turboshaft engine assembly"
      reason: "Directed aircraft-engine/turboshaft searches return piston/diesel, wind-turbine and part-preform identities; no route-matched complete turboshaft selected."
    - row_id: "main_blade"
      flow: "Finished composite helicopter main-rotor blade"
      reason: "Wind-turbine blade or broad complete rotor system is not an independently supplied finished helicopter blade."
    - row_id: "tail_rotor"
      flow: "Complete conventional helicopter anti-torque tail-rotor assembly"
      reason: "Generic rotor system has no documented main-versus-tail supply scope; no wind turbine/Fenestron substitution."
    - row_id: "main_gearbox"
      flow: "Complete helicopter main transmission gearbox"
      reason: "Wind-turbine gearbox is not helicopter transmission."
    - row_id: "tail_gearbox"
      flow: "Complete helicopter tail-rotor transmission gearbox"
      reason: "Rotor or wind-turbine identity does not establish complete tail gearbox."
    - row_id: "tail_shaft"
      flow: "Complete helicopter tail-rotor drive-shaft assembly"
      reason: "Wind-turbine main shaft is not helicopter tail drive."
    - row_id: "servo"
      flow: "Complete helicopter hydraulic flight-control servo actuator"
      reason: "Wind-turbine pitch drive does not establish helicopter flight-control actuator."
    - row_id: "hydraulic_hose"
      flow: "Reinforced synthetic-rubber aircraft hydraulic hose assembly"
      reason: "Generic tubing does not establish pressure/end fitting/aircraft supply scope."
    - row_id: "hydraulic_oil"
      flow: "Petroleum-mineral aircraft hydraulic-fluid formulation"
      reason: "Public hydraulic oil states mineral or synthetic base without actual aircraft formulation; reference Mass versus Volume checked without renaming."
    - row_id: "turbine_oil"
      flow: "Synthetic-ester aircraft turbine lubricating-oil formulation"
      reason: "Mineral lubricating oil or electrical insulating ester is not specified formulated turbine oil."
    - row_id: "gear_oil"
      flow: "Synthetic-ester helicopter transmission lubricating-oil formulation"
      reason: "Mineral or insulating oil does not establish specified transmission ester and additives."
    - row_id: "copper_harness"
      flow: "Insulated copper aircraft wiring-harness assembly"
      reason: "Magnet wire/aluminium cable is not complete insulated copper aircraft harness."
    - row_id: "nicd_battery"
      flow: "Filled nickel-cadmium aircraft starter battery assembly"
      reason: "Public NiCd identity describes cylindrical 1.2 V cells and classifies primary cells, without establishing a complete filled rechargeable aircraft starter battery. Its Number of items reference remains unchanged; mass-basis use would additionally require measured item-to-kg conversion, but that cannot cure supply-scope ambiguity. Lead-acid and NiMH are not substitutes."
    - row_id: "fuel_bladders"
      flow: "Complete flexible aviation-kerosene fuel-bladder tank assembly"
      reason: "Raw rubber/plastic or generic tank does not establish finished aircraft bladder/supplied enclosure/pump scope."
    - row_id: "metal_fabrication_electricity"
      flow: "Alternating-current electricity at factory intake"
      reason: "Actual site/voltage/provider-specific electricity identity must match plant records; no universal grid selected."
    - row_id: "composite_fabrication_electricity"
      flow: "Alternating-current electricity at factory intake"
