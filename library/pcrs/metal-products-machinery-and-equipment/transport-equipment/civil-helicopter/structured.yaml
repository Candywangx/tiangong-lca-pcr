allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacture"
    rule: "Directly attribute serial/configuration-linked material issues/returns, submetered power, composite cure batch occupancy and production test/rework records first. For inseparable shared utilities demonstrate a measured causal machine-time/load, occupied tooling/cure cycle or coating-area/layer driver: share = order driver / sum of covered order drivers. Retain period, full denominator and causal justification. Equal aircraft counts, advertised turbine power, MTOW, payload or lifetime flight hours are not default allocation drivers."
    source_ids: []
  - rule_id: allocation_fuel
    applies_to: "production tests and delivery fuel"
    rule: "Net attributable aviation kerosene issued less measured returns/stock change equals measured consumed fuel plus actual usable and unusable fuel retained at gate. Retained unusable fuel belongs to the declared basic-empty product M once; retained usable fuel is the separate delivery output and excluded from M, without automatic avoided-production credit. Keep ground and flight phases and stock reconciliation; releases use actual consumed fuel/species evidence, not issued total or lifetime operation. Separate any saleable products by actual records before reviewed residual allocation."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "reuse, rejects and wastes"
    rule: "Internal stock/water reuse is an internal transfer, not fresh input or credit. Exported wastes retain weighed amounts and actual recipients without presumed recycling/substitution benefit. Reconcile rejects, rework and work in progress against accepted serial outputs; neither scrap recovery nor failed acceptance creates an extra complete helicopter output."
    source_ids: []
