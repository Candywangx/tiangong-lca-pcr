measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use current same-serial complete-aircraft calibrated physical weighing with manufacturer-specified support points, rotor/aircraft position and actual equipment list. Retain each simultaneous support reading, zero/tare, calibration, date/operator, environment and uncertainty; sum readings net of measured fixtures. Document actual installed oil/hydraulic fluid, permanent ballast and measured unusable fuel, subtract actually measured usable fuel/persons/test loads and add physically measured integral detached delivered parts only when absent from the weighing. Fuel correction uses actual grade/density/temperature or direct mass, never tank capacity or nominal standard-weight tables. Missing actual method or mass balance requires scientific/data review."
  - id: unit_conversion
    applies_to: "individual exchanges"
    required_property_ref:
      name: "original measured property"
      uuid: ""
    required_unit: "actual row unit"
    rule: "Preserve Mass, Volume, Area, energy and count. Electricity: actual kWh to MJ using verified 1 kWh = 3.6 MJ. For purchased units or liquid volume, use traceable actual same-configuration part masses or same-grade density/temperature to convert to kg, retaining the original unit/readings. No assumed per-engine/blade mass, fuel density or advertised heat value."
