      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement independent mass_record_provenance: calibrated actual complete-aircraft support readings, manufacturer positioning, equipment list and measured tare/temporary-load/usable-fuel corrections; retain included oil/hydraulic and unusable fuel evidence. Reconcile integral detached parts and summed mass without duplication. Neither catalogue empty weight, maximum takeoff weight, tank capacity nor standard fluid density establishes M. Missing original measurements or uncertainty requires scientific/data review and blocks quantitative completion."
      evidence: "original actual weighing/equipment-state records and mass balance; FAA 2016 Chapter 3 method support only"
    - id: quality_bom
      applies_to: "complete configuration"
      requirement: "Reconcile actual airframe, skid/seat/window, rotor/blades/gearbox/engine, flight-control/electrical/fuel and declared fluids to accepted M. Trace supply completeness and approved drawings/material batches; do not double count blades in rotor assemblies, controls in engine, battery in powerplant or fluid prefills. Nickel-cadmium is not lead-acid; equipment/loose kit exclusions differ across models. Add every missing actual part/process/exchange before completed dataset release."
      evidence: "complete BOM/drawings/receipt/measurements/SDS and acceptance records"
    - id: quality_process
      applies_to: "actual manufacture and trials"
      requirement: "Retain actual alloy/temper, laminate fibre/resin/cure/trim/NDI, join/finish, attachment/balance, hydraulic leak/electrical and ground/flight acceptance records with serial-linked rework and release. Set empirical QA ranges only from compatible verified measured records or independent source synthesis. No universally required chemical recipe, autoclave cycle, life limit, certification or test duration is supplied."
      evidence: "actual production procedures, measurement uncertainty and original quality records"
    - id: quality_release
      applies_to: "fuel/species and coverage"
      requirement: "Keep actual fuel grade/carbon origin, weighed or measured-density fuel balance, phase location/height, exact species/medium, captured wastes and real recipients. Do not derive NO versus NO2 from a NOx total or apply high-altitude factors to ground tests. Disclose period/site, conditional absence, supplier gaps, unavailable quantitative ranges and missing actual weighing evidence. This candidate specifies future evidence; it certifies no actual helicopter or factory inventory."
      evidence: "fuel/trial/transfer originals and coverage-gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require the covered complete civil single-turboshaft conventional-main/tail-rotor skid configuration and positive actual M with cp_mass, mass_record_provenance and basic-empty equipment/fuel/oil reconciliation. Reject MTOW, advertised empty weight, payload and full tank weight as net M. Missing actual evidence requires review before quantitative completion."
    source_ids:
      - faa-weight-2016
  - rule_id: validate_atomic
    applies_to: "all exchanges"
    rule: "Check exact physical/chemical identity, public reference property/unit group, route/state and delivered completeness. Wind-turbine blade is not helicopter blade; piston/diesel is not turboshaft; cured laminate is not uncured prepreg; pure IPA is not disinfectant mixture; NiCd is not lead-acid; process water is not resource withdrawal or effluent. Public broad avionics/rotor names require one actual unit/system boundary, not a collection of interchangeable parts. Keep unsupported UUID blank."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all amounts"
    rule: "Verify original unit/property, collected accepted-unit denominator, explicit q_item/M conversion, same serial/configuration/site/period, actual calibration and causal allocation. Correct volume or count using actual grade-density or measured component mass, never by renaming public properties. Unknown is not zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "conditional elementary releases"
    rule: "Require actual measured/traceably justified attributable IPA or exact fossil CO2, NO or NO2 and medium. These selected identities are immediate air-unspecified only. Reject indoor, water/soil, long-term, biogenic, upper-air/stratospheric or total NOx/N2O/nitrogen substitutions. Ground and flight emissions require separate phase/location/height evidence; add matching extra atomic rows if medium differs. Captured dust/coating/trim is waste, not automatic airborne release."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "manufacturing release"
    rule: "Trace actual structural/material/component, rotor/drive/control and ground/flight procedures/results/rework and release for the same aircraft and claimed applicable civil authority/contract. Manufacturer brochure and FAA 2016 example do not certify this aircraft or impose current legal criteria. Record pre-gate production versus post-gate ferry/training/service boundary."
    source_ids:
      - airbus-production
published_dataset_profile:
  dataset_role: "Configured complete civil single-turboshaft helicopter foreground manufacture"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared compatible upstream linkage"
  allowed_use: "Manufacturing supply models matching complete engine/rotor/skid/mission/equipment configuration, measured basic-empty net scope, supplier boundary and gate/site/period"
  excluded_use: "Passenger/mission operation, flight-hour service/lifetime footprint, equal-mass performance comparisons, other power/rotor/gear routes, unsupported certification or complete cradle-to-gate"
  required_metadata: "manufacturer/model/serial/drawing revision and civil acceptance basis; engine type/control and supplier completeness; main/tail rotor type/blade material/count, transmission/shafts; skid gear; airframe alloy/temper/composite architecture, supplied/prefinished scope; avionics unit part numbers, cabin/seat/window, battery chemistry and actual mission options; supplier contained parts/prefills; installed operating oil/hydraulic fluid and permanent ballast; actual measured unusable fuel included in M and usable retained fuel excluded; actual positive configured basic-empty net M in kg with original calibrated weighing, rotor/aircraft position and tare; persons, payload, packaging, temporary loads, loose ground kits/spares excluded; physically measured integral detached delivery parts; serial-linked test phases/release, emission medium/height, manufacturing gate/site/period, allocation and upstream linkage"
  required_quality_disclosure: "Identity/quantity/range gaps, actual mass/fuel/oil evidence and uncertainty, complete BOM, supplier inclusions, causal allocation and acceptance/upstream limitations"
  update_trigger: "Aircraft engine/rotor/airframe/gear/mission configuration, composite/chemical or battery/fluid route, supplier completeness, measured net-state corrections, test phase boundary, manufacturing site/period changes"
data_sources:
  - id: "airbus-production"
    type: "literature"
