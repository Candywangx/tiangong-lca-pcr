allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "Subdivide by model/site/work order first. Shared cut/weld, finish, board machining, lifting and testing use exchange-specific measured causal load/time or attributable demand from cp_allocation, reconciled to total supplied demand and excluded work. No default payload, axle count, trailer mass or deck-area allocation."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "variants"
    rule: "Separate frame geometry/grade, deck species/state, running/brake/control and finish variants; each normalized with its own measured M. Residual physical/economic fallback requires actual records, sensitivity and review, not a fabricated percentage. Rework/reject burdens remain with accepted production."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "outputs"
    rule: "Internal steel, timber, paint and water recovery are transfers, not automatic avoided-production or recycling credits. External waste and treatment remain explicit. Marketable coproduct claims require measured quality/quantity and independently reviewed handling; no biogenic storage or future recycling credit from wood mass alone."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each VIN or traceable same-configuration batch"
      temporal_coverage: "same declared manufacturing period"
      site_scope: "same empty accepted delivery configuration"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "vehicle scale calibration; empty/no-tractor state; fitted accessory and grease/air declaration; signed acceptance"
    - protocol_id: cp_frame
      process_id: "frame"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "drawing/steel grade/thickness; exact sections and make-or-buy; net issues/returns; weld procedure/wire/gas; kWh; rejected/reworked jobs; offcuts/captured dust; post-control particle concentration/flow/time/size"
      collection_method: "Weigh exact steel/consumables and outgoing segregated scrap; reconcile nesting and reusable stock. Meter actual job demand and sample outlet particulate with receiving-air/size conditions. Captured dust is separately named waste, not release."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly stock closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing data log"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "supplier SDS/formulation/solids/concentration; net chemical/paint supply and recovery; retained film; purge/residue composition; kWh; outsourced scope; xylene speciation/air flow/time"
      collection_method: "Measure each actual supplied ingredient and separate wet waste stream; reconcile bath/paint stock, retained film and recovery. Sample post-control xylene species, never infer all VOC as xylene. Record actual alternative preparation/coating supplies individually."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly stock closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing data log"
    - protocol_id: cp_deck
      process_id: "deck"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "wood species/supplier/machining/treatment; actual moisture and received mass; dimensions; screw specification/net mass; offcuts/sawdust/recovery; kWh"
      collection_method: "Weigh received boards and outgoing offcuts separately at recorded moisture. Reconcile fitted-board geometry/measurement and issues/returns with work orders; separately identify sawdust, captured dust and any evidenced outdoor wood particulate. No default timber density, yield or biogenic-carbon storage credit."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly stock closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing data log"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "supplier scope/part numbers and released dry masses; axle/brake/suspension containment; wheel/tyre specifications/counts; tyre weighing; kingpin/support interfaces; air/electrical diagram; grease net fill; installed accessories; kWh"
      collection_method: "Reconcile each part and supplier-contained scope to VIN-bound released BOM and actual component weights. Count the exact new pneumatic tyre specification; retain Number of items for exchange and separate measured tyre mass for complete M balance. Record installation torque/alignment and actual lubricant fill."
      unit: "kg; MJ; Item(s)"
      frequency: "each work order/batch/VIN; monthly stock closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing data log"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "VIN/configuration/test plan; coupling/support/brake/leak/light/control inspection and acceptance results; rework; accepted count; meter kWh/compressor attributable load; empty complete M; retained grease/air state"
      collection_method: "Record actual released test outcomes and utilities including rework. Weigh the empty complete delivered trailer; remove tractor, crew/cargo, temporary test ballast and packing. Report any factory road-test tractor/transport demand as separately measured explicitly bounded support, never trailer propulsion or assumed service fuel."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly stock closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing data log"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "PE formulation/thickness/net mass; board flute/fiber/recycled content/mass; returns; detached spare list"
      collection_method: "Weigh each protective component separately outside M; retain spare and fitted-versus-detached accessory declarations."
      unit: "kg"
      frequency: "each work order/batch/VIN; monthly stock closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
