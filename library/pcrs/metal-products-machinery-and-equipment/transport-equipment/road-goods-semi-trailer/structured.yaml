measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: electricity_units
    applies_to: "frame_electricity; finish_electricity; deck_electricity; assembly_electricity; release_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Meter actual below1kV grid-user energy; convert kWh to MJ using3.6MJ/kWh. Preserve actual provider/voltage; no mass or heat-carrier substitution."
  - id: tyre_count
    applies_to: "pneumatic_tyre"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Collect actual installed tyre count per accepted unit; retain items as numerator divided by M, resulting in items/kg. Measure tyre net mass separately for complete trailer mass balance; never relabel public count property Mass."
process_map:
  - id: frame
    name: "Steel frame fabrication"
    inclusion: "required"
    inclusion_condition: "Receive steel stock and declared preformed parts; cut/drill/form/join main beams, crossmembers, side members and coupling/support interfaces according to released drawings. Purchased complete frame replaces its contained site material/work."
    role: "foreground"
    quantitative_reference: "internal transfer; complete accepted trailer reference"
  - id: finish
    name: "Frame surface preparation and finish"
    inclusion: "conditional"
    inclusion_condition: "Include actual site operations only. Washing/epoxy/polyurethane/electric curing are specific conditional examples, not inferred universal requirements; supplied prefinished frame or outsourced treatment replaces contained operations."
    role: "foreground"
    quantitative_reference: "internal transfer; complete accepted trailer reference"
  - id: deck
    name: "Hardwood platform fitting"
    inclusion: "required"
    inclusion_condition: "Fit actual declared hardwood boards and fastenings to frame. Manufacturer Keruing case does not prescribe species, board thickness or moisture for every trailer. Site machining versus purchased complete fitted deck explicitly separated."
    role: "foreground"
    quantitative_reference: "internal transfer; complete accepted trailer reference"
  - id: assembly
    name: "Running gear, coupling and equipment integration"
    inclusion: "required"
    inclusion_condition: "Install exact released running gear, kingpin/landing support, brake and electrical equipment; declare suspension/control variants and installed load-securing accessories. Avoid duplicating supplier-contained components."
    role: "foreground"
    quantitative_reference: "internal transfer; complete accepted trailer reference"
  - id: release
    name: "Factory tests, acceptance and weighing"
    inclusion: "required"
    inclusion_condition: "Perform actual drawing/model-specific dimensional, coupling/support, brake/leak, tyre/wheel, lighting/control and release inspections. Record rework, accepted counts and calibrated empty complete trailer M. No universal test pressure, braking threshold or headboard rating inferred."
    role: "foreground"
    quantitative_reference: "finished_machine"
  - id: packing
    name: "Shipment protection"
    inclusion: "conditional"
    inclusion_condition: "Only actual individually measured protective supply, outside trailer M; record detached spares separately."
    role: "foreground"
    quantitative_reference: "internal transfer; complete accepted trailer reference"
