  evidence_limitations:
    - Two independent manufacturers support straight steel-frame
      hardwood-platform configuration, not universal geometry, grade, timber
      species, payload, test thresholds, life or numerical plant LCI.
    - Dennison standard-platform body/summarized headboard ratings
      conflict19/17tonnes. Neither adopted. Undated manufacturer compliance and
      historic2012/EN25817 statements not current methodological approval.
    - Public manufactured CPC49229 product uses Mass and is restricted by
      required complete platform semi-trailer qualifiers. Public tyre identity
      retains Number of items and actual counted numerator; actual separate tyre
      weights are required for full mass reconciliation. No public property
      changed.
    - Conditional joining, coating, suspension/control and actual factory
      utilities require released drawings/BOM/SDS and measured foreground
      evidence; alternate supplies/outputs are individually added. No invented
      machine mass, grade, timber density, allocation percentage or emissions.
    - 19 precise unmatched selected exchanges remain registered in
      unresolved_flow_identities; bounded searches and contrary candidates do
      not prove database absence.
    - Foreground manufacturing module only. Complete cradle-to-gate requires
      independent supplier/transport/treatment coverage. Scientific review
      pending; zh-CN aligned, not reviewed or published.
