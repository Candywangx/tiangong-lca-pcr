review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Manufacture of complete new
    non-self-loading/non-self-unloading straight steel-frame hardwood-platform
    road goods semi-trailers: site frame fabrication, declared finishing,
    hardwood deck fitting, purchased running gear/coupling/support and
    braking/lighting integration, factory acceptance. Declare one exact
    model/VIN and released configuration. This narrower boundary within CPC49229
    does not cover every trailer type. Exclude full trailers, agricultural
    self-loading/unloading trailers, box/curtainsider, refrigerated, tank,
    tipping, skeletal-only, extendible and powered loading configurations;
    tractor, independently sold parts, remanufacture and repair. Cargo,
    transport service/tonne-km, tractor use and fuel, loading operations,
    distribution, maintenance and end-of-life are outside the reference
    boundary. Factory acceptance/rework are manufacturing. No payload, service
    life or fuel-saving equivalence is assumed. Existing agricultural
    self-loading/unloading trailer material PCR explicitly excludes ordinary
    freight trailers; no existing material scope establishes this complete
    straight hardwood-platform road semi-trailer route. Old leaf stays
    read-only; no retired ID or accepted mapping promoted."
  reference_identity_basis: Public manufactured CPC49229 category flow has Mass
    reference property and includes goods semi-trailers. Adopt category identity
    only with mandatory exact complete non-self-loading/non-self-unloading
    straight steel-frame hardwood-platform configuration qualifiers, not generic
    production mix or numerical LCI.
