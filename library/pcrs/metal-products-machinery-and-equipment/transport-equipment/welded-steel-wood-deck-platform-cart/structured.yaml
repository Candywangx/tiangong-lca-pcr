allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Avoid allocation by order/batch/station subdivision and measured submetering. Allocate residual shared saw/welder/blast/cure loads only by demonstrated causal measured active machine-time/load or compatible actual coated area and cure recipe, with numerator/denominator and sensitivity. No equal-cart allocation across materially different structures or nominal payload/mass driver without physical cause."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_recovery
    applies_to: "offcut; chips; spent_grit; waste_powder"
    rule: "Distinguish stock returns, internal abrasive/powder circulation, transfer to treatment and genuine co-products. Recirculated grit/powder is not repeatedly charged as virgin input; residual waste is measured once. No automatic avoided-steel credit or sale-as-co-product rule. Reviewed co-product treatment and recipient supply boundaries are separately documented."
    source_ids:
      - ghg-allocation
