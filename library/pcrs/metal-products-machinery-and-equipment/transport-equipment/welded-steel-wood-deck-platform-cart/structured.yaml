      collection_method: "Weigh the accepted complete unit on a calibrated platform scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted serial and changed configuration"
      temporal_coverage: "actual manufacturing reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original scale/calibration/BOM and signed acceptance"
