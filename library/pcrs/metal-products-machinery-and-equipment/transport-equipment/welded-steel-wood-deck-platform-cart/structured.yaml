  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_origin and mass_configuration with actual calibrated complete empty cart weighing and signed BOM/acceptance. Reject payload, proof load and gross shipping weight. Missing actual M remains a quantitative gap."
      evidence: "actual serial scale/calibration/configuration and acceptance"
    - id: quality_materials
      applies_to: "forming; welding; finishing; assembly"
      requirement: "Verify tube/profile grade and cross-section, welding consumable/gas procedure, abrasive composition, powder binder/SDS/cure route, actual wood-board type and finished castor inclusions. Beech-grain finish is not proof of solid beech or plywood. Add missing actual exchanges atomically; recycled powder and installed castor constituents are counted once."
      evidence: "actual drawing/BOM/SDS/supplier and measured stock records"
    - id: quality_shield_balance
      applies_to: "argon; shield_co2; weld_argon_air; weld_co2_air"
      requirement: "When these shielding gases are actually used, reconcile individual component issue/return/recovery/actual immediate-air release with original batch composition and measured fate. For CO2 separately establish fossil/biogenic origin; unknown origin cannot be labelled fossil. Do not presume total blended gas is Ar or combine shielding release with burner combustion. Missing actual recipient/vent/gas balance blocks quantitative completion."
      evidence: "actual gas batch/supplier/origin, calibrated issue/return/recovery and outlet/fate records"
    - id: quality_heat_emissions
      applies_to: "natural_gas; co2_air; no_air; no2_air"
      requirement: "Only actual in-gate fossil gas heat and separately measured immediate unspecified-air species qualify. Do not substitute bought heat, methane resource, NOx, N2O, workplace exposure or generic combustion factor. Retain calibrated outlet conversion, fossil composition and actual treatment/detection limits."
      evidence: "actual burner/meter/gas/SDS/speciated measured outlet evidence"
    - id: quality_evidence
      applies_to: "dataset"
      requirement: "Disclose actual site/period/gate/subcontract, coverage and uncertainty, all quantity/identity/upstream gaps and conditional absences. Empirical QA ranges need actual calibrated records or independent compatible verified originals. Manufacturer product/process pages do not provide factory observations or scientific approval."
      evidence: "source and actual acquisition/gap records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_machine; cp_mass"
    rule: "Verify manual nonpowered welded-steel wood-board2swivel/2fixedTPE locked-castor configuration and actual positive net M for the complete empty accepted cart; fixed output1kg. Reject other vehicle architectures and carrying/operating-service reference substitutions."
    source_ids:
      - fetra-product
  - rule_id: validate_rows
    applies_to: "all inventory rows"
    rule: "Verify one actual chemical/physical identity/direction/type, public reference property/unit and official Chinese name, source route/medium and legal lowercase linked rule/protocol. Preserve natural gas Volume and electric energy. Unresolved identities remain declared gaps; a mechanical pass does not prove scientific applicability."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Reconcile stock/cutting/weld addition, captured waste, abrasive/powder input/recirculation/retention/waste, finished panel/castors and actual net product. Quantitative completion requires actual M and all actual exchanges; complete cradle-to-gate additionally requires compatible upstream and treatment datasets."
    source_ids:
      - ghg-allocation
published_dataset_profile:
  dataset_role: "Configured welded-steel wood-deck manual cart foreground manufacturing"
  downstream_use: "secondary_dataset; background_dataset after qualified review and compatible upstream linkage"
  allowed_use: "Declared compatible frame/deck/castor/coat manufacture with actual net M and gate"
  excluded_use: "Whole CPC49930, other vehicle/frame routes, hydraulic/powered handling, operation and unsupported full lifecycle"
  required_metadata: "producer/model/serial and drawing revision; manually pushed nonpowered open platform with welded steel tube/profile frame and handle; actual stock grade/cross-section/manufacturing route; finished wood-derived-board deck with beech-grain surface and actual board composition; two TPE swivel castors with wheel locks and two TPE fixed castors, ball-bearing hubs and supplier inclusions; blast/powder formulation/SDS and actual cure heat route; complete empty accepted measured net M kg and cp_mass scale/calibration, installed configuration and packing/load exclusion; declared rated capacity and actual controlled acceptance, no catalogue mass substitute; actual site/period/subcontract/gate, shielding gas and fossil cure-fuel composition when applicable, upstream supply and waste recipients"
  required_quality_disclosure: "Actual quantities/M/calibration, stock/module inclusion, binder/abrasive/heat/gas conditions, measured emissions, allocation and empirical QA plus identity/upstream gaps"
  update_trigger: "Frame grade/geometry, deck composition, castor/lock, powder/blast/weld/heat route, supplier inclusions and actual scale/configuration/gate/site/period change"
data_sources:
  - id: "fetra-product"
    type: "literature"
    reference: "[fetra Open cart2500](https://www.fetra.com/carts/open_cart-2500)"
    used_for: "HTML Product information and Technical Data with variant context: welded tubular/profile steel, powder coat, wood-derived-board beech-grain platform,2swivel/2fixedTPE castors with ball-bearing hubs and swivel wheel locks. Base architecture only; options, dimensions/load rating do not set a universal recipe, proof test or net measured M. No assertion of solid wood/plywood composition."
  - id: "fetra-quality"
    type: "literature"
    reference: "[fetra Quality and production](https://www.fetra.com/quality)"
    used_for: "HTML Perfect workmanship, Flawless workmanship and Superb finish: automatic saws, tube bending/forming, welding robots and shot-blast/shot-peen pre-treatment followed by solvent-free powder coating. Manufacturer route context, not exact stock/filler/blend/abrasive/binder, heat source, curing factor, measured quantities or10-year lifetime."
  - id: "ghg-allocation"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2: historical allocation avoidance/subdivision and underlying physical relationship hierarchy only. Actual measured foreground causal drivers required; no cart numerical factor or current regulatory obligation inferred."
