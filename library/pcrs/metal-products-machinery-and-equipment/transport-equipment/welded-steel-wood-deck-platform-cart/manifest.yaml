review_metadata:
  scientific_review: pending
  semantic_boundary:
    decision: New complete nonpowered manual four-wheel open platform cart, welded
      tubular/profile steel frame/handle, wood-derived-board beech-grain deck,
      two TPE swivel castors with wheel locks and two TPE fixed castors.
      Foreground stock sawing/forming, frame welding, shot-blast/powder coating,
      supplied panel/castor assembly and controlled complete-cart acceptance/net
      weighing/release. Conditional weld consumables, gas heating/emissions and
      shipment protection use actual records. Narrower than49930; excludes
      two-wheel hand trucks, wheelbarrows, shelf/folding carts, hydraulic pallet
      trucks, powered carts and operating material handling. No overlapping
      material cart PCR found.
    rationale: Distinct stock-to-complete-cart manufacturing boundary requires steel
      cutting/forming/welding, dry blast/powder coating and declared
      wood-board/TPE castor integration and empty net acceptance. Excludes
      alternative frame/deck/castor architectures, powered/hydraulic and
      purchased whole-frame assembly. No material complete manual cart duplicate
      found; not identity creation solely for CPC leaf.
  evidence_limitations:
    - No actual serial net M, stock grade/board formulation, supplier module
      inclusions, measured quantities, welding procedure,
      powder/SDS/abrasive/heat route, gas or emission observations were
      obtained. Mandatory actual acquisition and scientific review remain.
    - fetra product and production pages are one manufacturer evidence family.
      They support the specified architecture and process route, not a universal
      recipe, empirical quantity ranges, mandatory gas burner or a
      guarantee-as-lifetime assumption.
    - Foreground stock-to-cart manufacture is not complete cradle-to-gate;
      public electricity use leaves upstream technology/provider/voltage
      unspecified.
