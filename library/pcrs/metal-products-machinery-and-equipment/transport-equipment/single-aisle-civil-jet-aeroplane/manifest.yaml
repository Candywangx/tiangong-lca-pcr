review_metadata:
  scientific_review: pending
  semantic_boundary:
    decision: New complete single-aisle twin-turbofan civil passenger aeroplane
      final assembly from supplied equipped major sections through complete
      cabin, propulsion, systems, actual painting/acceptance and delivery;
      narrower than CPC49623. Related piston-engine, wiring-harness and
      launch/trainer PCRs exclude complete aircraft. No duplicate complete jet
      PCR found; aircraft upstream components remain separate supplier datasets.
      Exclude widebody/rotorcraft/UAV/other power routes, unfinished development
      cabins, repair/conversion and operating transport.
  evidence_limitations:
    - No actual aircraft M, calibrated supplier component quantities, current
      formulations, production acceptance or emission records were obtained.
      These remain mandatory acquisition requirements for quantitative
      completion.
    - Airbus2021 development-aircraft evidence supports process examples with
      partial-cabin/FTI/type-development exclusions, not a universal series
      recipe. FAA2016 physical weighing guidance uses2025 addendum and requires
      current aircraft-manufacturer procedure; no illustrative density or
      interval adopted.
    - Scope is final assembly of complete single-aisle twin-turbofan civil
      passenger aircraft, narrower than CPC49623 and not an automatically
      complete cradle-to-gate.
  identity_rejections:
    - row_ids:
        - finished_machine
      candidate: f1d1367c-a03e-448a-a4ad-1e479517cb9f
      reason: Public Mass/CPC49623 finished manufacture is broad powered aircraft
        >2000kg, does not establish single-aisle twin-turbofan complete customer
        passenger-cabin configuration. Keep exact reference blank.
    - row_ids:
        - turbofan
        - apu
      candidate: fb78e875-8bc6-484d-b2c4-ede9c1726721
      reason: State100 CPC43132 generic Turbo-jets and turbo-propellers does not
        expressly establish high-bypass turbofan or aircraft auxiliary
        gas-turbine completed supply scope. Do not infer power route from
        generic turbine name.
    - row_ids:
        - turbofan
        - apu
      candidate: f3416290-addf-4b2d-bf02-4a2517b0200d
      reason: Aircraft spark-ignition piston engine explicitly Otto/piston route,
        incompatible with turbofan/APU gas turbine despite aviation
        classification and Mass property.
    - row_ids:
        - rivet
      candidate: d1dda16c-6766-4f42-bf41-3a52a5371ae0
      reason: "Public reference property Volume, general varying metal/nonmetal rivet,
        no solid aluminium-alloy aircraft joining specification. Volume alone is
        not rejection: actual volume/material/mass conversion plus exact
        completion would be needed; no such basis here. Keep row Mass and
        blank."
    - row_ids:
        - harness
      candidate: 795e6116-d121-486f-aa8f-fa78448351f0
      reason: Intermediate formed harness to end-of-line electrical test, not
        completed aircraft-qualified tested supplier harness.
    - row_ids:
        - nitrogen
      candidates:
        - 92233c86-8e75-441c-94de-03cc91bc7c10
        - 96ba4c16-fd7c-424e-b318-d87484d3d7c0
        - 50626f35-0e0d-4139-b9f9-7e9ff238ba62
      reason: Bottling vented makeup/protective atmosphere/purging and leak-testing
        routes do not establish retained aircraft landing-gear charging state.
        Volume property may be retained with actual state/mass conversion if
        exact route compatible, not rewritten.
    - row_ids:
        - xylene
      candidate: 72699e73-3cda-4e78-9ffe-d3a750347176
      reason: Elementary xylene, not supplied technosphere mixed solvent; retain
        separate product input blank.
    - row_ids:
        - turbofan
        - apu
      candidate_category: CPC43110
      reason: Explicitly excludes motor vehicles and aircraft; not adopted or proposed
        for installed aircraft power. Aircraft turbofan/APU and external ground
        support are separate routes.
