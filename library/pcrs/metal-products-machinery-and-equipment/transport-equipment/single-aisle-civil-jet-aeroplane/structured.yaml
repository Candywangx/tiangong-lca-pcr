measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: exchange_mass
    applies_to: "non-electric inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure each net physical exchange separately. Count-based supplier statistics require actual measured unit mass or serial assembly weighing; preserve an adopted public count/area property if a compatible identity is later demonstrated, with an explicit supported conversion rather than rewriting it to Mass."
  - id: electric_energy
    applies_to: "electricity_airframe; electricity_systems; electricity_propulsion; electricity_cabin; electricity_coating; electricity_acceptance; electricity_protection"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Actual process electricity kWh × 3.6 MJ/kWh; match supply geography/voltage/mix and preserve the public reference energy property. Allocate shared grid/ground-power consumption once with measured drivers."
  - id: species_mass
    applies_to: "xylene_air; co2_air; no_air; no2_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use exact measured chemical species, source and receiving medium; integrate actual concentration and exhaust flow on compatible state/time bases. No mandatory emission or default factor."
  - id: mass_record_origin
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use original actual complete-aircraft calibrated platform/ramp-wheel or load-cell weighing, following the current applicable aircraft manufacturer procedure. Retain all support readings, tare/zero/calibration and repeatability, clean indoor/level state, equipment list and serial configuration; measured signed additions/removals reconcile the accepted net M. Acceptance records are the collection interface, not a substitute for physical measurement. Nominal operating empty weight, maximum take-off weight, payload, design estimate or fuel-full value cannot substitute. Sources: faa-weight; faa-addendum"
  - id: mass_configuration
    applies_to: "cp_mass; finished_machine"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain delivered engines, complete cabin, gear, fitted systems, declared permanent ballast and specified operating oil/hydraulic-fluid and unusable-fuel state. Exclude usable fuel, people/cargo, temporary ballast/instrumentation, removable protection and loose spares. Measure quantities and densities at actual temperature/state for any fuel/fluid correction, never copy handbook example densities. Record separately potable water/lavatory charge excluded from this empty reference. Reconcile current manufacturer definition and delivery changes to weighing state; unmeasured corrections block completion. Sources: faa-weight"
