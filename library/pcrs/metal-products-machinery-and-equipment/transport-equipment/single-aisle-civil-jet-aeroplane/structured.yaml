allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Avoid allocation with subdivision and actual serial/order/station metering. Allocate residual shared resources by demonstrated causal measured joining machine-time, actual identical coating area and recipe, or attributable test/ground-power time and load, retaining numerator/denominator and sensitivity. No equal-per-plane allocation across different airframes/cabins/propulsion or nominal aircraft mass."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_returns
    applies_to: "chips; waste_paint; effluent"
    rule: "Distinguish net supplier returns, reusable tools/protection, internally retained material and transferred waste. Measure actual recipient/treatment state; no automatic avoided-primary-metal or fuel/recycling credit. A genuine coproduct requires separate reviewed causal allocation and matching upstream boundary, not inferred from sale alone."
    source_ids:
      - ghg-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete aircraft empty net mass"
      record_type: "controlled_acceptance_record"
      raw_fields: "type/model/serial; configuration; delivered cabin and propulsion configuration; accepted net mass M; actual original calibrated platform/wheel/load-cell readings; support/tare/zero/environment/leveling and repeatability; equipment list; measured fuel/oil/fluid/temporary-ballast/test-instrument/protection corrections; signed delivered-state mass reconciliation"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted aircraft"
      temporal_coverage: "actual manufacturing/acceptance period"
      site_scope: "declared final-assembly delivery gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original calibrated physical weighing and signed configuration reconciliation"
    - protocol_id: cp_airframe
      process_id: "airframe"
