  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_origin and mass_configuration with real calibrated complete-aircraft readings and measured corrections. Missing actual weighing method, equipment list or unreconciled cabin/fluid/propulsion state blocks quantitative completion."
      evidence: "original serial weighing/calibration/equipment/fluid reconciliation"
    - id: quality_bom
      applies_to: "all processes"
      requirement: "Reconcile equipped sections/wings/tails, gear, systems, turbine engine versus nacelle/pylon/APU inclusions, complete customer cabin and retained fluids. Actual omitted resources/components are added atomically before any completed dataset claim; supplier and FAL manufacture are not double counted."
      evidence: "current drawing/BOM/serial supplier completion and test records"
    - id: quality_route
      applies_to: "turbofan; apu; jet_fuel; co2_air; no_air; no2_air; xylene_air"
      requirement: "Verify aviation turbofan route and completed supply state, distinguish APU and outside ground engines. Retain actual Jet A-1 fuel grade/fossil share and measured air species/subcompartment; altitude-specific flight emissions need matching identities. Total VOC/NOx or piston/wind-turbine identity cannot substitute."
      evidence: "direct public flow fields, actual supplier SDS and measured test records"
    - id: quality_evidence
      applies_to: "dataset"
      requirement: "Disclose actual site/period/gate, source lineage and coverage, conditional absence, uncertainty, allocation, all identity/quantity/upstream gaps and empirical QA basis. Derive ranges from actual calibrated records or independently verified compatible evidence, never invent mass, yield, life or emission thresholds. This methodology contains no factory observations or scientific approval."
      evidence: "original evidence and gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_machine; cp_mass"
    rule: "Verify single-aisle twin-turbofan complete civil passenger configuration, original unladen category above2000kg, positive actual empty net M and fixed1kg output. Reject partial prototype cabin, catalogue/MTOW/payload mass and unsupported density corrections."
    source_ids:
      - faa-weight
  - rule_id: validate_rows
    applies_to: "all inventory rows"
    rule: "Every exchange has one actual chemical/physical identity, direction/type, compatible public reference property/unit, shared M and linked legal lowercase protocol/rule. Confirm Chinese official names, source, route and medium. Unresolved exact identities remain declared review gaps; an automated pass cannot establish their suitability."
    source_ids: []
  - rule_id: validate_scope_balance
    applies_to: "all processes"
    rule: "Reconcile net stocks, complete supplier inclusions, installed dry material and retained fluids, waste and actual ground/flight/test coverage. Unmeasured quantities, missing actual constituents/acceptance records or upstream datasets prevent an unqualified completed cradle-to-gate claim."
    source_ids:
      - ghg-allocation
published_dataset_profile:
  dataset_role: "Configured single-aisle civil passenger jet foreground final assembly"
  downstream_use: "secondary_dataset; background_dataset after qualified review and explicit upstream linkage"
  allowed_use: "Compatible airframe, propulsion, cabin, empty-M, supplier completion and gate manufacturing supply models"
  excluded_use: "Whole CPC49623, other aircraft power/family, incomplete prototype, flight transport, equal-mass passenger-km equivalence or unsupported full lifecycle"
  required_metadata: "producer/type/model and serial; current drawing/BOM and complete passenger cabin layout; twin high-bypass aircraft turbofan route, engine/nacelle/APU serials and supplier inclusion; equipped airframe section/wing/tail interfaces, landing gear and fitted systems; actual paint/SDS/abatement; actual accepted configured empty net M kg and cp_mass, original calibrated complete-aircraft weighing and signed measured configuration/fluid corrections; retain required installed equipment and declared permanent ballast, operating oil/hydraulic fluid and documented unusable fuel; exclude usable fuel, crew/passengers, cargo, temporary ballast/test instruments, packaging and loose spares; original actual unladen category above2000kg; actual site/period, test ground/flight subcompartment, outsourcing and delivery gate"
  required_quality_disclosure: "Actual weighing/quantity/calibration, configuration/fluid reconciliation, supplier inclusions, test medium and fossil share, empirical QA and identity/upstream gaps"
  update_trigger: "Aircraft/engine/cabin/section architecture, supplier boundary, paint/fluid/test/flight route, actual M origin, current weighing procedure, gate/site/period change"
data_sources:
  - id: "airbus-production"
    type: "literature"
    reference: "[Airbus Production](https://www.airbus.com/en/products-services/commercial-aircraft/the-life-cycle-of-an-aircraft/production)"
    used_for: "Sourcing/manufacture and FAL paragraphs: supplier-equipped major sections, cabins/seats/engines and single-aisle sites. Manufacturer process example only; no capacity, supplier-share, per-plane intensity or worldwide site assumption adopted."
  - id: "airbus-assembly"
    type: "literature"
    reference: "[Airbus First A321XLR development aircraft undergoes final assembly,2021-12](https://www.airbus.com/en/newsroom/news/2021-12-first-a321xlr-development-aircraft-undergoes-final-assembly)"
    used_for: "Coming together/station/next-steps paragraphs: section joining, wings/gear/tails/systems/cabin and engines/nacelles, painting and ground/flight sequence. Historical development aircraft has partial cabin and special FTI. No rivet counts, XLR tank capacity, fixed cycle time, compulsory chemistry or series certification campaign adopted. Actual series records are required."
  - id: "faa-weight"
    type: "official_guidance"
    reference: "[FAA-H-8083-1B Aircraft Weight and Balance Handbook,2016](https://www.faa.gov/sites/faa.gov/files/2023-09/Weight_Balance_Handbook.pdf)"
    used_for: "Printed3-2–3-5/PDF34–37: calibrated platform/ramp-wheel/load-cell weighing, actual equipment configuration, unusable versus usable fuel and oil/other fluid state. Historical physical guidance considered with2025 addendum and current manufacturer procedure. No example density, scale capacity, calibration interval or universal certification regime imposed."
  - id: "faa-addendum"
    type: "official_guidance"
    reference: "[FAA Weight and Balance Handbook Addendum,2025-10-20](https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/Weight_Balance_HB_Addendum_(MOSAIC).pdf)"
    used_for: "PDF/printed1: correction of chapter2 manufacturer-furnished empty-weight/EWCG record. Not evidence of actual factory weighing or light-sport applicability to this civil jet."
  - id: "ghg-allocation"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2: historical avoid/subdivide and causal allocation hierarchy only; actual foreground measured driver is required, no plane factor adopted."
