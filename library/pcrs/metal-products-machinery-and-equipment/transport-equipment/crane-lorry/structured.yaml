validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Require one complete road diesel telescopic crane configuration, carrier and upper together, positive physically measured M kg and cp_mass weighing/acceptance record. Reference output is1kg; normalize kg, MJ, m3 and Item(s) numerators by normalize_mass while preserving each public reference property. Keep retained fluids/fuel and delivery exclusions traceable."
    source_ids: []
  - rule_id: validation_bom
    applies_to: "inventory"
    rule: "Reconcile the actual carrier, intermediate/upper frames, boom/telescope, outriggers, slew/hoist/rope/hook, ballast/jib, cab/control/sensors, hydraulics and delivered fluids against BOM and supplier boundaries. Distinguish PTO versus separate upper engine, local fabrication versus receipts, consumed test fuel versus retained fuel and actual counts/volumes versus physical mass checks. Expand missing actual items/routes before complete coverage claims."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Verify public type, chemical/formulation/design, route/completeness/geography, original reference property and unit group, and official localized names. Upper non-propulsion engine is not a carrier engine; individual steel wire is not rope. NO is not NO2/N2O/NOx equivalent; immediate air is not long-term air/soil. Groundwater is a resource, supplied tap water a product, contained spent oil/water a waste and emitted dust not captured dust."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "dataset_claims"
    rule: "No complete cradle-to-gate claim without actual route and linked upstream/transport/receiver coverage. Manufacturing mass does not establish equal lift duty, road payload, lifetime, service performance, regulatory conformity or methodology approval. Scientific review remains pending."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground complete diesel telescopic crane-lorry manufacture; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete vehicle configuration manufacture scaled with measured M; upstream/transport/treatment separately declared"
  excluded_use: "Road travel/lifting services, customer operation/maintenance/lifetime/end of life, standalone cranes/components, other vehicle/traction routes and methodology approval"
  required_metadata: "All reference qualifiers; model/serial/drawing/BOM; carrier/upper supply gates and engine/PTO roles; installed/stowed counterweight/jib/hoist completeness; fluid formulations/actual fills/residual fuel; measured M and delivery exclusions; actual manufacturing/finish/test routes/criteria/results; material certificates; site/period/count; supplier/receiver links and causal allocation"
  required_quality_disclosure: "Unresolved identities/measurements/BOM/routes/links; actual count/volume/mass reconciliation; rejects/rework/recovery; allocation and uncertainty; historical manufacturer evidence limits"
  update_trigger: "Vehicle/boom/ballast/engine/PTO/BOM design, supplier completeness, local/bought route, finish/fluid formulation, test/acceptance/delivery state, site/period or allocation change"
