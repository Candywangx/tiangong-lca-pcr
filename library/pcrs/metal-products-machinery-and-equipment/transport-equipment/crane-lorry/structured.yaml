measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: delivery_configuration
    applies_to: "complete-machine delivery"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Include actual installed/stowed and OEM-accepted delivered crane parts, working fluids and measured residual fuel. Exclude people, test weights, external loading rigs, transport protection and loose optional ballast/spares not in the accepted vehicle. Record separate-package exclusions and actual completeness. If dispatch dismantles an included part, preserve the accepted complete-vehicle weighing plus traceable parts without substituting shipping weights or invented nominal masses."
  - id: electrical_energy
    applies_to: "electricity_fabrication; electricity_finishing; electricity_integration; electricity_acceptance"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain metered electrical kWh and convert1 kWh =3.6 MJ. Record source/voltage and actual stage load/time; rated installed power does not prove factory consumption."
  - id: component_count
    applies_to: "truck_tyre; upper_diesel_engine"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Retain public Number of items and actual installed count of each single design. Reconcile its physical BOM mass using actual lot-specific measured kg/item and installed count; this check does not alter the exchange property. Exclude items inside bought chassis/boom/engine assemblies."
  - id: hydraulic_volume
    applies_to: "hydraulic_oil"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Retain public Volume and metered net hydraulic-fluid receipts/fills/returns. Convert1 L =0.001 m3. For delivered physical mass reconciliation only, use measured density at recorded temperature and m = rho times V; no default density or tank capacity."
  - id: water_resource_volume
    applies_to: "groundwater"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Meter actual renewable freshwater groundwater with aquifer/site evidence. It is not purchased tap water or exported wastewater."
  - id: material_mass
    applies_to: "other stock/components/fluids/wastes/emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh each defined substance/component/waste or measure one emitted species. Volume-to-mass conversion requires actual density and temperature/pressure evidence; mixtures are not repeated constituent receipts. NO, NO2 and N2O cannot be interchanged."
