  classification_refs: "CPC 3.0 49115; narrower candidate scope; no accepted mapping asserted"
  covered_products: "New complete diesel telescopic dedicated road truck cranes"
  excluded_products: "Cargo loader-crane lorries; standalone cranes/components; non-road/all-terrain/rough-terrain/crawler cranes; other traction routes; use/service"
  representative_product: "One engine-fitted road carrier integrated with the declared telescopic upper crane, outriggers, hoist/rope/hook, controls and actual counterweight configuration"
  production_route: "Receipt and make-or-buy control; conditional steel fabrication/finishing; upper/crane-carrier integration and actual fills; factory checks/tests/acceptance; dispatch protection"
  market_state: "Accepted complete net delivered vehicle at declared factory gate"
functional_unit:
  what: "Manufacture one declared complete diesel telescopic road-crane configuration"
  how_much: "1 kg accepted net complete machine; one accepted complete machine is represented by physically measured M kg"
  how_well: "Meet the actual OEM drawing/BOM and inspection plan for structural assembly, hydraulics, telescope/luff/slew/hoist functions, limiter/interlocks, carrier brakes/steering and declared load checks as applicable. Retain actual criteria and results; no universal test load, overload ratio, tolerance or acceptance threshold"
  how_long_or_cycle: "One manufacturing delivery; no road-mile or lifting-cycle/lifetime unit"
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_fabrication
      applies_to: "fabrication; finishing"
      rule: "Include only actual local cutting/forming/machining and welding of steel structures, inspection and declared finishing. Bought finished boom/frame/outrigger excludes its local stock and fabrication; initial cards require expansion for actual machining fluids, fittings, sheaves, slewing drive, wiring, carrier parts or outsourced services. Powder coating is one conditional example; actual wet paint/solvent, blasting, refrigerant circuits, hydraulic flushing media, heat treatment and other utility routes must be separately expanded when present. No necessary process is inferred solely from brochure architecture."
      source_ids:
        - grove-tms800e-2020
        - liebherr-ltf1060-2023
    - rule_id: boundary_integration
      applies_to: "integration"
      rule: "Include receipt inspection, supplier/chassis mounting interface checks, actual upper/frame/boom/slew/outrigger/hoist/control installation and adjustments, hydraulic connection/fill, brakes/steering and complete-machine integration. Record one actual supply boundary for every item; self-made carrier or missing intermediate frame, telescope cylinders, counterweight mount, cable harness or limiter sensor requires actual atomic expansion, not a generic materials row."
      source_ids:
        - liebherr-ltf1060-2023
    - rule_id: boundary_tests
      applies_to: "acceptance"
      rule: "Acceptance is required; physical load/road/hydraulic tests and engine runs are included only as actually performed under the OEM plan. Record loads, radii, configurations, duration, test fuel/energy/fluids, emissions if monitored and reusable test fixtures. Test weights are factory equipment, not consumed crane mass; replacements attributable across served orders use measured records. No mandated overload percentage, cycle count or emission is invented. Customer travel/lifting after gate is outside."
      source_ids: []
    - rule_id: boundary_emissions
      applies_to: "finishing; acceptance"
      rule: "Monitor only actual direct releases. Separate post-control air species from collected waste and purchased fluids, and groundwater resources from contained wastewater. Fossil CO2/CO require verified fuel carbon; NO/NO2 require measured speciation. Other monitored species/air submedia or direct water/soil discharges require separate matching atomic cards and evidence. No zero-emission claim follows from an absent card."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Specified engine-fitted carrier chassis, finished crane components, local stock and consumables received at integrating factory"
  starting_condition_role: "Foreground receipts; supplier manufacturing and incoming transport separately linked"
  product_classification_scope: "Dedicated diesel telescopic road-crane subset of CPC49115"
  recursive_input_rule: "Bought carrier/boom/winch assemblies replace included parts, raw stock and supplier/local operations; local WIP transfers are not new external receipts"
  upstream_dataset_requirement: "Match actual chassis completeness, propulsion versus upper-engine role, steel state/design, oil composition/volume basis, component count, electricity voltage/geography and waste receiver gate"
  disclosure: "Foreground complete-vehicle manufacturing module only. Declare make-or-buy/outsourcing and missing upstream/transport/receiver links; do not claim complete cradle-to-gate coverage"
