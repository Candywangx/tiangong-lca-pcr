allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "Separate configurations/orders by direct measurement first. Reconcile shared fabrication/finishing/integration/testing electricity, gases, fluid issues and actual test equipment replacement with measured causal stage time/load/material use and served orders; include idle/rework/reject burden. Unequal cranes are not allocated equally per vehicle by default. Record driver rationale, uncertainty and sensitivity; use actual foreground evidence rather than a universal mass/time allocation factor."
    source_ids: []
  - rule_id: allocation_receipts
    applies_to: "chassis_and_assemblies"
    rule: "Purchased or customer-furnished chassis/components carry their actual supplier inventory burden and gate. Do not duplicate component manufacture, material receipts or included fuel/fluids inside supplied assemblies. Internal WIP, drained reusable test oil and reusable weights/fixtures are not fresh whole-item consumption on every order. Document actual replacement and service intervals."
    source_ids: []
  - rule_id: allocation_balance
    applies_to: "manufacturing_batch"
    rule: "Reconcile receipts, net installed/retained delivered mass, WIP, returns, recovered flows and each exported waste for the same period/configuration; count test-consumed versus delivery-retained fuel separately. Reconcile counts and volumes with physical mass only using measured part masses/densities. Assign rejects/rework to accepted machines. Scrap exits the receiver gate without automatic avoided-primary-material or disposal credit. A real multi-output manufacturing operation requires explicit functions and evidence-based allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "calibrated net weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M; scale/tare; installed/stowed parts; working fluids/residual fuel; acceptance; excluded protection"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each complete accepted configuration"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; net weigh ticket; complete-vehicle acceptance"
    - protocol_id: cp_configuration
      process_id: "integration_acceptance"
      flow_role: "configuration"
      record_type: "BOM/interface/acceptance ledger"
      raw_fields: "model/serial/drawing revision; carrier and upper engine roles; actual PTO; boom/outrigger/slew/hoist/control; ballast/jib; supply completeness; site/period; test criteria/results"
      collection_method: "Crosswalk every actual BOM item and factory operation to an atomic exchange or justified exclusion. Verify supplied internals, carrier/upper integration, actual test load/radius/configuration and delivered fluid/counterweight state. Catalogue operating weights and regulatory ratings cannot supply M or a test recipe."
      unit: "kg"
      frequency: "each build revision/acceptance"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "one traceable complete configuration"
      quality_evidence: "signed drawing/BOM; supplier scope; actual checks/test results"
    - protocol_id: cp_material
      process_id: "fabrication_finishing_integration_acceptance_packout"
      flow_role: "single stock/consumable"
      record_type: "net issues and weighing"
      raw_fields: "single grade/design/formulation; state; net kg; issues/returns; recovery; density/temperature/pressure if converted; served orders; accepted count"
      collection_method: "Weigh each specified stock, wire, gas, powder, disc, water, formulated oil/coolant/grease, exhaust fluid and protection separately. Reconcile net fresh make-up and remaining/returned material. Fluid already inside chassis/engine and constituents of purchased solutions are not repeated receipts; no universal density, concentration or dose."
      unit: "kg"
      frequency: "each issue/return and batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable net mass / accepted machines of the same configuration"
      quality_evidence: "scale; SDS/certificates; net inventory/served-order ledger"
    - protocol_id: cp_parts
      process_id: "integration"
      flow_role: "single installed component"
      record_type: "component weighing and completeness"
      raw_fields: "part/design; delivered/installed kg; actual count; included internals/fluids; supplier country; received/local route; accepted count"
      collection_method: "Weigh each net supplied chassis/boom/outrigger/bearing/hoist/cab/control/bolt/hose/cylinder/pump/axle/battery design or use actual verified lot-specific mass/count records. Record inclusion boundaries; supplied assemblies replace included parts and local manufacture. Expand actual missing fittings, wire harness, sensors and other BOM items before claiming completeness."
      unit: "kg"
      frequency: "each supply lot/build batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable installed mass / accepted machines of the same configuration"
      quality_evidence: "scale; supplier boundary; part design/certificate and BOM"
    - protocol_id: cp_count
      process_id: "integration"
      flow_role: "truck_tyre; upper_diesel_engine"
      record_type: "design-specific item count"
      raw_fields: "single design; installed count; receipts/returns; supplier included items; lot-specific measured kg/item; upper-engine non-propulsion duty; accepted count"
      collection_method: "Count actual installed items for each selected single design and preserve public Number of items. Obtain actual lot-specific net part kg/item by calibrated weighing for physical BOM reconciliation only. Carrier-engine or tyre inclusions in a purchased chassis are excluded; no universal wheel count or engine weight."
      unit: "Item(s)"
      frequency: "each supply lot/build batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable installed item count / accepted machines of the same configuration"
      quality_evidence: "BOM count; receipt/return ledger; calibrated part weighing"
    - protocol_id: cp_oil_volume
      process_id: "integration"
      flow_role: "hydraulic_oil"
      record_type: "net formulated-fluid volume"
      raw_fields: "supplier formulation/oil fraction; metered L or m3; fresh fill/top-up; returns/recovery; retained fill; actual density/temperature for mass check; accepted count"
      collection_method: "Meter actual net supplied mineral hydraulic-fluid volume; convert1 L =0.001 m3 and preserve public Volume. Reconcile received/fill/return/recovery/retained amounts. Measure density at stated temperature only to check retained kg within M; nominal reservoir capacity is not fill consumption."
      unit: "m3"
      frequency: "each metered fill/return and batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable net fluid volume / accepted machines of the same configuration"
      quality_evidence: "meter calibration; composition; actual density/temperature and fill balance"
    - protocol_id: cp_energy
      process_id: "fabrication_finishing_integration_acceptance"
      flow_role: "electricity"
      record_type: "meter and causal allocation"
      raw_fields: "stage; voltage/source; kWh; interval; actual load/time; idle/rework; shared totals; accepted count"
      collection_method: "Meter actual stage energy, convert1 kWh =3.6 MJ and reconcile shared measured totals with actual causal time/load and rework. Rated installed power, brochure lifting duty or engine power cannot establish factory electricity."
      unit: "MJ"
      frequency: "each actual metered interval/batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable electrical energy / accepted machines of the same configuration"
      quality_evidence: "meter calibration; bill; causal-load ledger"
    - protocol_id: cp_fuel
      process_id: "acceptance"
      flow_role: "test_diesel; delivery_diesel"
      record_type: "separate consumed and retained fuel ledger"
      raw_fields: "single petroleum grade; fossil/biogenic certificate; fills/returns; test-consumed kg; residual kg; received chassis fuel; measured density/temperature if volume; actual engine test interval; accepted count"
      collection_method: "Weigh or meter with actual density/temperature all fills, supplied residual, final retained fuel and returns. Determine consumed test fuel from reconciled measured fuel balance. Record delivery residual separately, include its kg in M and prevent double-counting fuel within received chassis. No engine-rated-power times hours calculation without measured fuel relation."
      unit: "kg"
      frequency: "each actual engine test/final fill"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "separate attributable consumed and retained kg / accepted machines of the same configuration"
      quality_evidence: "fuel meter/scale; composition and balance; test/acceptance record"
    - protocol_id: cp_waste
      process_id: "fabrication_finishing_acceptance"
      flow_role: "single exported waste"
      record_type: "segregated export weighing"
      raw_fields: "single waste; alloy/formulation; wet/dry; oil/water/metal content; exported kg; recovery; receiver/treatment; accepted count"
      collection_method: "Weigh each actual offcut, clean chip, weld spatter, spent disc, captured dust, powder overspray, contained cleaning solution and spent hydraulic oil separately. Record composition and receiver gate. Internal recovered fluids/powder are not exports, air dust is not captured waste and direct water discharge requires separate species/medium cards."
      unit: "kg"
      frequency: "each export and reconciled batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable exported waste mass / accepted machines of the same configuration"
      quality_evidence: "scale; composition; receiver/treatment receipt"
    - protocol_id: cp_emission
      process_id: "finishing_acceptance"
      flow_role: "single air species"
      record_type: "species-specific post-control monitoring"
      raw_fields: "species; fossil/biogenic origin; medium/submedium; particle size; measured concentration/exhaust volume/time; same reference conditions; controls/background; actual engine/finishing interval; accepted count"
      collection_method: "Measure actual post-control species concentration and exhaust volume on identical sampling/temperature/pressure/moisture conditions; integrate over the actual attributable interval, correct background and record uncertainty. Verify immediate unspecified air and unspecified size where selected. Measure NO and NO2 separately; NOx as NO2 equivalent cannot supply either species without speciation. Verify fossil carbon for CO2/CO. No mandatory emission or standards-based emission quantity."
      unit: "kg"
      frequency: "representative actual emitting intervals"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable measured species mass / accepted machines of the same configuration"
      quality_evidence: "monitoring; sampler/flow calibration; carbon/speciation/medium evidence"
    - protocol_id: cp_water_resource
      process_id: "finishing"
      flow_role: "groundwater"
      record_type: "well meter and aquifer record"
      raw_fields: "site/country; renewable freshwater aquifer; metered m3; interval; pumping/treatment; reuse; accepted count"
      collection_method: "Meter actual qualifying factory-well abstraction and expand pumping/treatment; exclude internal circulation. Record aquifer renewability/freshwater evidence; the same source cannot also be a tap-water purchase."
      unit: "m3"
      frequency: "each metered interval/batch"
      temporal_coverage: "same declared production period; disclose gaps"
      site_scope: "declared crane-lorry integrating factory"
      aggregation_rule: "attributable abstracted volume / accepted machines of the same configuration"
      quality_evidence: "meter; aquifer/site evidence; water balance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Use the identical model/configuration, production period and accepted count for physically measured positive M and every numerator. Reconcile chassis/upper supply completeness, installed/stowed ballast/jib, retained fluids/fuel and actual measured part mass/count/volume conversions. Catalogue road/operating/axle weights do not meet the net weighing rule."
      evidence: "cp_configuration; cp_mass; cp_parts; cp_count; cp_oil_volume; cp_fuel"
    - id: quality_coverage
      applies_to: "inventory_and_links"
      requirement: "Disclose missing actual BOM/route cards, UUIDs, measurements, supplier/transport/receiver links and uncertainty. Establish local/bought structure alternatives, actual powder/other finish and actual engine/load testing from site records. No universal steel grade, yield, component weight, fluid density/fill, wheel count, test load/duration, emission, life or allocation factor."
      evidence: "cp_configuration; cp_material; cp_energy; cp_waste; cp_emission; cp_water_resource"
    - id: quality_sources
      applies_to: "architecture_evidence"
      requirement: "Grove TMS800E copyright2020, pp.4–5 and physical p.64 footer, and Liebherr LTF1060-4.1 code lwe-td-199-06-defisr04-2023, pp.8,11,25 and physical p.32 footer, are historical model-specific configuration evidence. They do not prove actual factory stocks, supplier BOM completeness, current engine/regulatory options, net M or life. Numeric load charts, axle limits, tank capacities and catalogue masses are not adopted quantities."
