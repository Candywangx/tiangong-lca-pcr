review_metadata:
  semantic_boundary_decision: New complete dedicated road diesel hydraulic
    telescopic crane-lorry manufacturing boundary, narrower than CPC49115.
    Excludes goods/knuckle-boom loader-crane lorries, standalone crane/hoist
    systems, non-road/all-terrain/rough-terrain/crawler/pick-and-carry cranes,
    alternative traction, refurbishment and use/services. Existing material
    general-purpose crane PCR expressly excludes complete crane lorries; this
    record supplies complete road-vehicle integration/measurement methodology.
    Old plural scaffold remains read-only with no identity promotion; no
    accepted classification mapping is asserted.
  scientific_review: pending independent methodology review
  unresolved:
    inventory_flow_uuids:
      - row_id: hsla_plate
        reason_code: identity_not_established
        explanation: 421db3a5 describes high-strength plate but classifies
          further-worked alloy products; it does not establish this
          not-further-worked certified delivery state.
      - row_id: welding_wire
        reason_code: identity_not_established
        explanation: Steel-wire/rod searches did not establish finished ER70S-6 welding
          wire, alloy specification or spool delivery; generic wire is not
          sufficient.
      - row_id: shielding_co2
        reason_code: identity_not_established
        explanation: cf3aee56 explicitly uses a proxy because CO2/argon mix is
          unspecified and references Volume*time; neither proves this pure-gas
          consumption identity. No fabricated Mass property.
      - row_id: weld_spatter
        reason_code: identity_not_established
        explanation: Generic clean steel offcut/chip identities do not establish
          oxidised welding-spatter composition and state.
      - row_id: abrasive_disc
        reason_code: identity_not_established
        explanation: Abrasive searches did not establish this finished resin-bonded
          aluminium-oxide disc design; alumina powder is not the disc.
      - row_id: captured_dust
        reason_code: identity_not_established
        explanation: Air particulate is not a contained waste identity; clean chips do
          not establish captured grinding-dust contamination.
      - row_id: powder_waste
        reason_code: identity_not_established
        explanation: No compatible contained waste powder formulation/state established;
          fresh powder and coated articles are not this waste.
      - row_id: cleaning_water
        reason_code: identity_not_established
        explanation: Water-resource or drinking-water identities cannot identify this
          contaminated exported cleaning solution.
      - row_id: boom_assembly
        reason_code: identity_not_established
        explanation: Bounded product/design searches did not establish this specific
          delivered component and completeness. Raw stock, knuckle-boom
          assemblies, complete cranes and unrelated parts are not substitutes.
      - row_id: outrigger_beam
        reason_code: identity_not_established
        explanation: Bounded product/design searches did not establish this specific
          delivered component and completeness. Raw stock, knuckle-boom
          assemblies, complete cranes and unrelated parts are not substitutes.
      - row_id: slew_bearing
        reason_code: identity_not_established
        explanation: Bounded product/design searches did not establish this specific
          delivered component and completeness. Raw stock, knuckle-boom
          assemblies, complete cranes and unrelated parts are not substitutes.
      - row_id: hook_block
        reason_code: identity_not_established
        explanation: Bounded product/design searches did not establish this specific
          delivered component and completeness. Raw stock, knuckle-boom
          assemblies, complete cranes and unrelated parts are not substitutes.
      - row_id: steel_rope
        reason_code: identity_not_established
        explanation: 62bb3717 is individual steel wire, not finished stranded hoist
          rope; plastic ropes and waste wire-cord fabrics are incompatible.
      - row_id: counterweight
        reason_code: identity_not_established
        explanation: Pig iron, ferronickel and cast pipe fittings do not establish a
          machined cast-iron ballast block and its delivery geometry.
      - row_id: operator_cab
        reason_code: identity_not_established
        explanation: Bounded product/design searches did not establish this specific
          delivered component and completeness. Raw stock, knuckle-boom
          assemblies, complete cranes and unrelated parts are not substitutes.
      - row_id: moment_limiter
        reason_code: identity_not_established
        explanation: Bounded product/design searches did not establish this specific
          delivered component and completeness. Raw stock, knuckle-boom
          assemblies, complete cranes and unrelated parts are not substitutes.
      - row_id: direction_valve
        reason_code: identity_not_established
        explanation: Generic pipe-valve and diaphragm candidates do not establish this
          hydraulic directional-control valve and actuation design.
      - row_id: starter_battery
        reason_code: identity_not_established
        explanation: 0f7ce22c conflicts with electrical-energy classification. f854fcea
          has starter-type qualifiers but describes grid BESS and references Net
          calorific value; no evidenced relation from this battery reference
          property to the delivered charged starter unit is established. Net
          calorific value cannot be silently relabelled as electrical capacity
          or Mass.
      - row_id: engine_oil
        reason_code: identity_not_established
        explanation: General mineral-oil/lubricant candidates do not establish this
          actual formulated engine oil and viscosity delivery.
      - row_id: transmission_oil
        reason_code: identity_not_established
        explanation: Hydraulic fluid and neat base oil do not establish this
          transmission-lubricant formulation.
      - row_id: grease
        reason_code: identity_not_established
        explanation: FDY sizing oil and unspecified processing aids do not establish
          lithium-soap grease.
      - row_id: engine_coolant
        reason_code: identity_not_established
        explanation: Pure ethylene glycol and metalworking coolant do not establish this
          formulated engine-coolant concentration.
      - row_id: diesel_exhaust_solution
        reason_code: identity_not_established
        explanation: Fertiliser expressed as N and neat urea are not finished
          32.5%-by-mass engine exhaust-fluid solution.
    evidence_needs:
      - Actual calibrated complete-machine net M, BOM/supplier inclusions,
        design certificates, count/volume/physical-mass records, factory
        quantities and acceptance require foreground site evidence.
      - Expand actual missing BOM and process routes plus
        upstream/transport/receiver links before complete cradle-to-gate claims.
        Grove copyright2020 and Liebherr code04-2023 are historical
        configuration examples only.
