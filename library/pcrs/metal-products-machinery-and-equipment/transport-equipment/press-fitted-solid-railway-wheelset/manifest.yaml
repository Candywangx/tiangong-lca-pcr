review_metadata:
  scientific_review: pending
  semantic_boundary_decision: Create press-fitted-solid-railway-wheelset,
    restricted to new bare non-driven two-monobloc-steel-wheel
    one-solid-steel-axle assemblies with received heat-treated blanks, actual
    final machining and conventional cold interference fitting on cylindrical
    seats. Exclude shrink-fit/hollow/resilient/powered/disc/bearing variants,
    component production and maintenance. No existing material wheelset PCR
    found; this safety-critical interface, joint trace and final geometry
    acceptance differs materially from complete locomotive or freight wagon
    manufacture.
  evidence_limitations:
    - Product portfolios support the explicitly selected
      solid-axle/non-driven/monobloc subset; actual current drawings, approved
      fit/geometry limits, NDT and original acceptance/weighing records must
      establish a real order. No universal steel grade, press force, mass,
      lifetime or empirical range asserted.
    - BONATRANS2016 article is historical manufacturing-route evidence only. MAE
      is independent equipment-method evidence, CAF independent
      product/traceability and alternative-route evidence; manufacturer
      marketing energy/carbon claims are not adopted.
    - No actual M, physical quantities or production certificates were obtained.
      This PCR requires subsequent original foreground acquisition and
      scientific review, not a completed inventory.
    - No elementary exchanges are prescribed without an actual documented
      discharge/withdrawal; real site releases require atomic additions,
      measurement and identity review before quantitative completeness.
    - This received-blank-to-bare-wheelset foreground is not complete
      cradle-to-gate; supplier/energy/treatment links are unresolved.
  identity_rejections:
    - uuid: b5183f5e-96ba-4fae-a49f-20c222b9a6ee
      rows:
        - finished_machine
        - axle_blank
      reason: Direct public classification49129 and trailer axle synonyms describe
        road motor-vehicle axle assemblies, not a railway bare wheelset or solid
        railway axle blank.
    - uuid: a511bdc0-a8ac-443f-8dab-fc185d29aec3
      rows:
        - wheel_blank
        - axle_blank
      reason: Public prepared steel machining blank lacks railway wheel/solid-axle
        architecture and heat-treated supplier completion required here. No
        actual supplier equivalence established.
    - uuid: 01bb198f-c723-4513-8338-a9f7a6d551c0
      rows:
        - wheel_chips
        - axle_chips
      reason: Public comment specifically engine-parts machining and CN mix;
        independent generic machining-for-recycling waste identity instead
        directly verified.
    - uuid: c34be063-3b2d-45c1-86dd-9eadc5a9bd51
      rows:
        - wheel_chips
        - axle_chips
      reason: Public at-plant CN mix not established for this geographically unbound
        manufacturing method; adopt geography-unspecified for-recycling steel
        chips identity.
    - uuid: 576d250f-4f36-4385-939d-0f03b8f95a10
      rows:
        - coolant
      reason: Public cutting-fluid definition spans oils/emulsions/pastes/gels/gases
        and lacks purchased water-miscible concentrate state; exact supplier
        formulation/concentration and public completion compatibility remain
        unresolved. Do not substitute ready-use coolant mass for concentrate.
    - uuid: 6a16eab5-8097-4e37-8d28-aa1e81b8bb5c
      rows:
        - wheel_chips
        - axle_chips
      reason: Public CNC-specific generic alloy-unspecified scrap; broader actual
        steel machining for recycling identity directly verified instead. No
        numerical buy-to-fly or alloy factor adopted.
  unresolved_flow_identities:
    - row_id: wheel_blank
      flow: Heat-treated monobloc steel railway wheel blank for final machining
      reason: Generic machining steel blanks do not establish heat-treated monobloc
        railway-wheel geometry or supplier completion; no actual supplier
        equivalence is available.
    - row_id: axle_blank
      flow: Heat-treated solid steel non-driven railway axle blank for final machining
      reason: Road49129 axle assemblies and unspecified blanks do not establish
        heat-treated solid non-driven railway axle blank state and current
        supplier completion.
    - row_id: coolant
      flow: Formulated water-miscible steel-machining coolant concentrate
      reason: Direct public Cutting Fluid spans ready-use fluids and other states;
        actual purchased water-miscible concentrate formulation/state and
        dilution basis are unverified.
    - row_id: fit_lubricant
      flow: Approved formulated railway wheel-seat press-fit lubricant
      reason: Bounded lubricant queries do not establish the approved wheel-seat
        press-fit formulation, exact physical state and supplier specification;
        retain a single formulated exchange.
    - row_id: couplant
      flow: Formulated contact-ultrasonic wheelset inspection coupling gel
      reason: Bounded ultrasonic-couplant queries did not establish a matching
        supplied contact-ultrasonic coupling-gel identity; returned unrelated
        chemicals are not this gel.
    - row_id: spent_couplant
      flow: Spent ultrasonic wheelset inspection coupling gel
      reason: No directly verified spent contact-ultrasonic coupling-gel waste
        identity with the required contamination/state/treatment boundary
        established by bounded actual queries.
    - row_id: protective_oil
      flow: Formulated temporary steel-wheelset rust-preventive oil
      reason: Temporary rust-preventive oil needs actual single supplier formulation,
        retained-film state and mass compatibility; unrelated refined
        oil/solvent hits are not adopted.
    - row_id: finished_machine
      flow: Accepted bare non-driven solid-axle monobloc-wheel press-fitted railway
        wheelset
      reason: Bounded searches/direct reads do not establish this exact bare
        solid-axle non-driven monobloc-wheel conventional press-fitted
        final-machining output as a1kg Mass-compatible public reference.
        Preserve this precise name and exact finished_machine output row
        unresolved.
