measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: exchange_mass
    applies_to: "all kg inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure each physical exchange separately as net consumed/transferred mass with issue/return and stock balance. A count-based blank purchase needs actual weighed unit mass and exact supply state; preserve any later selected public nonmass property with documented conversion, never rewrite it as Mass."
  - id: electric_energy
    applies_to: "machining_electricity; pressing_electricity; inspection_electricity; release_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Meter kWh and convert1 kWh =3.6 MJ; preserve the selected public reference energy property and supplier/technology/voltage/site disclosures."
  - id: hydraulic_volume
    applies_to: "hydraulic_oil"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Preserve public Volume; measure actual net replacement/top-up volume with calibrated dispenser, declared fluid temperature and issue/return/stock records. Any litre conversion uses1 L =0.001 m3; any separately needed mass balance requires measured batch density and same temperature, never an assumed oil density."
  - id: mass_configuration
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure the complete accepted bare two-wheel/one-solid-axle assembly, including documented retained fit lubricant and temporary protective film of oil. Remove reusable supports/racks, test tools, detachable packaging and excluded bearing/disc/gear modules. Use actual installed state and record corrections by separately measured physical masses, never assumed accessory weights."
  - id: mass_record_origin
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use serial-linked complete-wheelset calibrated scale readings with zero, tare of supports, calibration certificate, capacity/range suitable to actual unit, repeatability and uncertainty. Reconcile weighed wheels/axle and actual retained film against measured M. No stock catalogue, nominal axle load or assumed steel density substitutes for the measured accepted configuration."
