allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Avoid allocation by order/serial, station subdivision and submetering. Allocate unavoidable shared machine/press/inspection overhead using demonstrated causal measured active time/load; retain numerator, denominator, excluded orders, idle-load attribution and sensitivity. Mass or equal-unit allocation across different wheel diameters, stock allowances or pressing routines requires actual causal justification."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_recovery
    applies_to: "wheel_chips; axle_chips; spent_coolant; spent_hydraulic_oil"
    rule: "Distinguish stock return, internal recirculation, external waste recovery and reviewed genuine co-products. Measure chips with retained liquid separately, record recipient and waste state, and avoid automatic virgin-steel displacement credits or sale-value co-product assumptions. Rework remains attached to original order; accepted output count excludes rejects. Document the chosen waste/recycling method and burden boundary consistently."
    source_ids:
      - ghg-allocation
