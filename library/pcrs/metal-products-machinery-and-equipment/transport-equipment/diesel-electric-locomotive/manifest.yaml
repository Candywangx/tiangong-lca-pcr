review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "Manufacturing one complete new diesel-only mainline
    heavy-haul diesel-electric locomotive with AC induction traction: actual
    underframe/carbody fabrication, surface finishing, supplied railway diesel
    prime mover/main alternator and rectifier/DC-link/inverter chain
    installation, bogie/wheelset/traction motor and brake assembly,
    cab/cooling/electrical outfit, bounded factory/static and acceptance testing
    and corrected net-mass release. Select one actual released locomotive
    number, gauge, axle/powered-axle arrangement and installed configuration.
    This scope is narrower than CPC49512. Exclude DC-traction locomotives,
    externally powered electric locomotives, battery/hybrid traction, gas/diesel
    dual-fuel, diesel-hydraulic/mechanical drive, shunters, multiple units,
    separately sold parts, overhaul and remanufacture. Auxiliary starting
    batteries are included when fitted and do not imply hybrid traction. Exclude
    commercial train haulage, tonne-km, operational fuel/maintenance,
    tracks/depots and end of life. Actual manufacturing-support transfers and
    acceptance runs require explicit measured endpoints, loads/time and
    coverage; service fuel or sand stores are not manufacturing consumption or
    net output mass. Existing material railway track and road-engine PCRs do not
    cover complete diesel-electric rail manufacture; no overlapping material
    locomotive scope identified. Legacy leaf read-only; no old identity/mapping
    promoted."
  reference_identity_basis: Direct state100 manufactured class49512
    diesel-electric-locomotive identity reference Mass/kg; actual AC-traction
    mainline configuration narrows broader category without inferring an average
    production mix or operating service.
