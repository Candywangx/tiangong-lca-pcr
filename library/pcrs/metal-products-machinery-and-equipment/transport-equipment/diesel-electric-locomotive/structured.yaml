allocation_rules:
  - rule_id: allocation_causal
    applies_to: "shared_operations"
    rule: "Subdivide work orders by accepted locomotive configuration and stage first. Shared cutting/welding/coating, lifting, mixed-model assembly and test rigs use actual exchange-specific metered causal demand/load/time from cp_allocation. Reconcile all served work to supplied totals; no universal installed mass, rated power, line speed or production-count share."
    source_ids:
      - wabtec-moving-2024
  - rule_id: allocation_rework
    applies_to: "configurations"
    rule: "Attribute actual rejected-part/rework burden to accepted construction. Each configuration retains independently measured M and matched numerator before pooling by disclosed measured accepted mass. Any residual physical/economic fallback requires actual driver/cost/market records, sensitivity and review; no invented percentages."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "outputs"
    rule: "Recovered internal steel/abrasive/flux/water is transfer, not automatic co-product or avoided production. Outgoing wastes keep condition, treatment and responsibility. Saleable co-product needs actual quality/market and reviewed allocation; no future locomotive-recycling credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted locomotive"
      temporal_coverage: "current completed acceptance cycle"
      site_scope: "same complete installed delivery configuration"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "quality_weighing actual calibrated rail/axle/wheel record; tank/net corrections; fit-list mass balance and uncertainty"
    - protocol_id: cp_structure
      process_id: "structure"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "steel grade/heat/thickness; stock issues/returns; cut/form/weld job; wire/flux; actual energy; offcuts/slag/particle controls"
      collection_method: "Measure each actual physical supply issue less return and stock change, independently characterised outgoing stream and attributable metered job demand. Trace part/package containment, rework and matched accepted units; sample actual post-control release species/air flow/time only where evidenced."
      unit: "kg; MJ"
      frequency: "each locomotive/work order; reporting stock and meter closure"
      temporal_coverage: "whole declared manufacture including rework"
      site_scope: "all included fabrication/assembly/test sites and outsourced work"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list/part labels; actual stock/work/test/acceptance logs; uncertainty"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "surface/formulation/SDS/solids; supplied primer/topcoat; abrasive makeup/recovery; retained film; residue; water/energy; post-control xylene flow/concentration/time"
      collection_method: "Measure each actual physical supply issue less return and stock change, independently characterised outgoing stream and attributable metered job demand. Trace part/package containment, rework and matched accepted units; sample actual post-control release species/air flow/time only where evidenced."
      unit: "kg; MJ"
      frequency: "each locomotive/work order; reporting stock and meter closure"
      temporal_coverage: "whole declared manufacture including rework"
      site_scope: "all included fabrication/assembly/test sites and outsourced work"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list/part labels; actual stock/work/test/acceptance logs; uncertainty"
    - protocol_id: cp_traction
      process_id: "traction"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "engine model/count and independent measured supplied kg; AC chain voltage/models/masses; supplied package and prefill scope; alignment/wiring/tests; actual utilities"
      collection_method: "Measure each actual physical supply issue less return and stock change, independently characterised outgoing stream and attributable metered job demand. Trace part/package containment, rework and matched accepted units; sample actual post-control release species/air flow/time only where evidenced."
      unit: "kg; MJ; Item(s)"
      frequency: "each locomotive/work order; reporting stock and meter closure"
      temporal_coverage: "whole declared manufacture including rework"
      site_scope: "all included fabrication/assembly/test sites and outsourced work"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list/part labels; actual stock/work/test/acceptance logs; uncertainty"
