measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: electricity_units
    applies_to: "structure_power; finish_power; traction_power; running_power; outfit_power; acceptance_power"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Actual below1kV grid-user metered electricity:1kWh =3.6MJ; preserve energy, no fuel heat-value/mass conversion. Other voltage/provider distinct."
  - id: engine_count
    applies_to: "diesel_engine"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Count actual supplied assembled railway engines in Item(s) as q_item; independently measure actual received/installed engine kg for complete-locomotive mass reconciliation. Do not relabel count Mass or infer kg from rated power/count. Road-propulsion class43123 excludes rail; non-road class43110 railway applicability is assessed separately."
  - id: glass_area
    applies_to: "cab_glass"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure actual supplied flat pane single-face area from traceable cut dimensions, no doubling both faces; preserve m2 numerator divided by M. Independently weigh the supplied/installed pane kg to close complete-unit mass; no theoretical glass-density conversion."
process_map:
  - id: structure
    name: "Underframe and carbody fabrication"
    inclusion: "required"
    inclusion_condition: "Receive actual released steel, cut/form/weld underframe and carbody to drawings; supplier-cut stock and purchased shells replace contained work."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete locomotive reference"
  - id: finish
    name: "Surface preparation and coating"
    inclusion: "conditional"
    inclusion_condition: "Include actual preparation and individual supplied coats where performed; prefinished supplies replace contained site work. No mandatory abrasive/paint recipe."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete locomotive reference"
  - id: traction
    name: "Diesel-electric traction-system installation"
    inclusion: "required"
    inclusion_condition: "Install actual prime mover/alternator, rectifier/DC link/inverters, traction motors and geared interfaces from exact released design. A complete supplied power package replaces its contained separately listed parts."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete locomotive reference"
  - id: running
    name: "Bogie, wheelset and brake assembly"
    inclusion: "required"
    inclusion_condition: "Assemble separately supplied frames, wheelsets, suspension and railway brake parts, marry body and bogies. Purchased complete powered bogies replace contained frame/wheelset/motor/gear/brake stocks; actual alternate supply receives its own complete-product card."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete locomotive reference"
  - id: outfit
    name: "Cooling, cab and electrical outfitting"
    inclusion: "required"
    inclusion_condition: "Fit exact cooling, cab, auxiliary starting battery, wiring/control and safety components; purchased cab/package interiors not repeated."
    role: "foreground"
    quantitative_reference: "internal transfer; accepted complete locomotive reference"
  - id: acceptance
    name: "Factory trials and net-mass acceptance"
    inclusion: "required"
    inclusion_condition: "Actual released pressure/brake/electrical/static and bounded acceptance runs, rework and current weighing/net-mass release. No commercial haulage inventory or assumed trial load."
    role: "foreground"
    quantitative_reference: "finished_machine"
