    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "locomotive configuration; current released plan; test loads/time/track; fuel issued/returned/retained; oil/coolant/tank state; actual gas species/flow; wastes; wheel/axle weighing and calibrated complete-unit M with signed corrections"
      collection_method: "Measure each actual physical supply issue less return and stock change, independently characterised outgoing stream and attributable metered job demand. Trace part/package containment, rework and matched accepted units; sample actual post-control release species/air flow/time only where evidenced."
      unit: "kg; MJ"
      frequency: "each locomotive/work order; reporting stock and meter closure"
      temporal_coverage: "whole declared manufacture including rework"
      site_scope: "all included fabrication/assembly/test sites and outsourced work"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier fit-list/part labels; actual stock/work/test/acceptance logs; uncertainty"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_load"
      record_type: "measurement"
      raw_fields: "total supply; actual meter/load/time; all served configurations; excluded work"
      collection_method: "Measure actual exchange-specific causal demand for all served work, document driver and reconcile shares to total supply; retain uncertainty and sensitivity."
      unit: "MJ; h"
      frequency: "each shared batch and report period"
      temporal_coverage: "same construction period"
      site_scope: "all served sites/configurations"
      aggregation_rule: "partition measured causal demand; attributable amount / accepted units"
      quality_evidence: "total meter/work-order closure and driver evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "body_plate; body_angle; weld_wire; weld_flux; structure_power; steel_scrap; weld_slag; particle_air; blast_shot; epoxy_primer; topcoat; finish_water; finish_power; spent_shot; paint_residue; xylene_air; diesel_engine; main_alternator; rectifier; traction_inverter; traction_motor; gear_set; traction_power; bogie_frame; wheelset; axlebox; spring; air_compressor; brake_valve; brake_cylinder; running_power; radiator; copper_cable; switchboard; starter_battery; cab_glass; insulation; outfit_power; test_diesel; engine_oil; coolant; test_water; test_sand; acceptance_power; used_oil; test_wastewater; fossil_co2_air; nitric_oxide_air"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "cp_mass requires actual current accepted complete-locomotive weighing with a calibrated railway scale/traceable wheel- or axle-load measuring system appropriate to the method used. Keep original serial/configuration, date, instrument/calibration/tare, all wheel/axle identifiers/readings, repeated checks and actual static/dynamic method conditions. The signed result must account for every axle once, support total mass without duplicated wheel/axle sums, and correct documented actual fuel/sand/test fixtures and other excluded stocks. Independently reconcile supplied installed engine, body, bogie, traction equipment, outfit and retained technical fluids against complete fit-list, actual measured corrections and uncertainty. Missing actual weighing or corrected delivery-state evidence blocks dataset use. Catalogue operating/adhesion weight, axle limit times count, rated power, fuel-full weight and guessed residual cannot replace M."
      evidence: "calibration and original locomotive-specific axle/wheel weighing; independent installed BOM"
    - id: quality_delivery
      applies_to: "finished_machine"
      requirement: "Reference output includes complete declared fitted body/bogies/traction/cab/cooling/braking/safety and auxiliary starter battery with retained technical oil/coolant/electrolyte once. Exclude fuel/sand service stores, persons/cargo, packaging, detached spares, temporary test rigs/load banks and transport attachments outside released product. Identify any permanent designed ballast in installed configuration; actual measured mass only. Document dry versus wet equipment and each measured tank/net correction; no assumed empty/full tank."
      evidence: "released fit-list; supplier containment; measured tank/correction and acceptance state"
    - id: quality_engine
      applies_to: "diesel_engine"
      requirement: "Keep actual supplied engine count under public Number of items and independently measured received dry/installed kg, model and serial. Railway prime mover class43110 differs from road-propulsion class43123 which excludes railway/tram rolling stock. Supplier contained alternator, starter, cooling or fluids must be reconciled to independently supplied items and whole M, with no second alternator/engine counted inside package. Taxonomy source supports distinction only, not engine weight or railway performance approval."
      evidence: "un-engine-scope; supplier model/serial and independent engine weighing"
    - id: quality_identity
      applies_to: "flows"
      requirement: "Require actual grade, chemical/formulation, route/state, voltage and supplied configuration; preserve public properties. Traction motor public expert mass-share example is not this locomotive inventory. Cable/battery energy property cannot be rewritten kg; same-product conversion evidence required or identity gap retained. Mineral oil not PAO, formulated coolant not pure glycol, dry traction sand not unqualified silica. PM/xylene/fossilCO2/NO need species/CAS/source and immediate-air medium evidence; no totalNOx as NO or totalVOC as xylene."
      evidence: "supplier certificates/SDS; outlet samples and physical identity records"
    - id: quality_tests
      applies_to: "acceptance"
      requirement: "Retain actual current released factory plan/results for weld/dimensional inspection, electrical insulation/controls, prime mover/traction chain, brake/air leak, cooling and static/load/acceptance running tests where applicable, plus exact loads/duration/endpoints and rework. Current authority/operator approvals only when actually established. Progress brochure case emission class, maintenance interval, power, fuel capacity and operating mass are not generic acceptance thresholds or lifetime rules. Separate test fuel consumed from retained delivery fuel and technical fills; no assumed emission factor."
      evidence: "released configuration-specific test records; progress-sd70ace"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Every actual fit-list/route exchange needs measured/calculated/estimated/missing/excluded/not-applicable disclosure. Add specific cards for actual additional couplers/draft gear, air reservoirs/pipes/hoses, exhaust/silencer/aftertreatment when fitted, resistor grid/fans, controls/safety cab parts, joining chemistry, separate coolant waste, packaging and contracted support/treatment. No mixture/collection row. Foreground records and compatible upstream modules required before complete-data or cradle-to-gate claims."
      evidence: "complete fit-list/work orders; coverage and stock/meter closure; uncertainty"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require 1kg accepted complete configured output and same-unit cp_mass actual weighing/net corrections with independent fit-list mass balance. The finite declared q_item/M check is not a physical weighing or scientific approval."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "Match configuration, accepted count, reporting cycle, numerator units and linked collection to normalize_mass. Engine Item(s) must retain separate actual kg evidence; no count/property rewriting."
    source_ids: []
  - rule_id: validation_packages
    applies_to: "manufacturing"
    rule: "Audit engine/alternator/powered-bogie/cab supplier scope and prefill against independent installed BOM. Reject duplicates and missing supplied interfaces. Check AC induction versus DC, hybrid/dual-fuel and excluded service-route differences before use."
    source_ids:
      - progress-sd70ace
  - rule_id: validation_release
    applies_to: "elementary"
    rule: "Verify actual post-control species/CAS, fossil provenance, medium/submedium/time and test boundary. NO is not NO2/N2O/totalNOx; captured dust not air release, wastewater not freshwater resource. Expand actual additional emissions when measured, never make all conditional releases mandatory."
    source_ids: []
  - rule_id: validation_completeness
    applies_to: "dataset"
    rule: "Keep unresolved identities and missing physical records explicit. Complete actual weighing/corrections, route/acceptance records, fit-list and supplier/utility/transport/treatment coverage before use; structural pass cannot confer methodology approval or complete cradle-to-gate coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_manufacturing_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing one complete new diesel-only mainline heavy-haul diesel-electric locomotive with AC induction traction: actual underframe/carbody fabrication, surface finishing, supplied railway diesel prime mover/main alternator and rectifier/DC-link/inverter chain installation, bogie/wheelset/traction motor and brake assembly, cab/cooling/electrical outfit, bounded factory/static and acceptance testing and corrected net-mass release. Select one actual released locomotive number, gauge, axle/powered-axle arrangement and installed configuration. This scope is narrower than CPC49512."
  excluded_use: "Exclude DC-traction locomotives, externally powered electric locomotives, battery/hybrid traction, gas/diesel dual-fuel, diesel-hydraulic/mechanical drive, shunters, multiple units, separately sold parts, overhaul and remanufacture. Auxiliary starting batteries are included when fitted and do not imply hybrid traction. Exclude commercial train haulage, tonne-km, operational fuel/maintenance, tracks/depots and end of life. Actual manufacturing-support transfers and acceptance runs require explicit measured endpoints, loads/time and coverage; service fuel or sand stores are not manufacturing consumption or net output mass."
  required_metadata: "locomotive identifier/model; released design/revision, gauge and axle/powered arrangement; underframe/carbody steel grade/thickness/heat certificate and weld route; make-or-buy and prefinished scope; supplied railway engine model/count and independent actual dry/installed kg; alternator/rectifier/DC-link/inverter/motor voltage/type and package containment; bogie/frame/wheelset/gear/brake/suspension configuration and independently measured masses; cab/safety/cooling/auxiliary battery and electrical fit-list; actual coating/SDS; supplier-prefilled versus separately added technical fluids; net delivery tank/sand/technical-fluid state; sites/period/accepted count; actual test loads/time/fuel returns/consumption; current calibrated railway weighing method and full axle/wheel record plus signed net corrections M; uncertainty/mass balance; provider/transport/utility/treatment coverage"
  required_quality_disclosure: "Actual configuration/gauge/axles and package boundaries; calibrated complete-unit weighing originals/conditions and corrected net M uncertainty; supplied engine count/independent mass and technical fills; full installed BOM; sites/period/accepted count/rework; bounded trials, stock/utility closure, allocation evidence/sensitivity, upstream gaps and unresolved identities; scientific review state."
  update_trigger: "Locomotive drive/engine/AC chain/gauge/axle/bogie/cab configuration; steel/coating/joining or supplier/make-or-buy scope; factory/test/weighing route or period; delivery fluids/state, physical evidence and identity changes."
data_sources:
  - id: "progress-sd70ace"
    type: "handbook"
    reference: "Progress Rail SD70ACe Freight Locomotive, document16-0096.4, undated official retained brochure, PDF pp1–2, product architecture/Features and Benefits. https://s7d2.scene7.com/is/content/Caterpillar/CM20170915-63120-28925"
    used_for: "Case diesel prime mover/control/AC traction and optional variants. No numeric weight, axle count, power, fuel capacity, operating factors, emission approval or maintenance/service life adopted; current released configuration/tests required."
  - id: "wabtec-moving-2024"
    type: "handbook"
    reference: "Wabtec On the Move,4December2024, official HTML, Contagem mixed-model assembly paragraphs, unpaginated. https://www.wabteccorp.com/trains-of-thought/on-the-move"
    used_for: "Independent manufacturer configuration-specific/shared assembly architecture; actual work orders, demand and allocation required. No moving-line mandate, line-speed factor, site requirement or fixed burden share."
  - id: "un-engine-scope"
    type: "official_guidance"
    reference: "UNSD ISIC Revision4, class2811 Manufacture of engines and turbines, except aircraft, vehicle and cycle engines; explanatory includes marine and railway engines and detailed structure CPC43110 link; unpaginated official classification HTML. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/en/27/2811"
    used_for: "Historical taxonomy distinction supports separate railway versus road-propulsion engine applicability alongside public original scope. No manufacturing LCI, engine mass, current railway approval or numeric conversion inferred."
