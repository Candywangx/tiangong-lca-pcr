  how_well: "Meet actual hull/weld tightness, outboard mounting/steering/fuel/electrical and fitted safety/functional release criteria under documented configuration-specific conditions. Equal mass does not imply equal passenger capacity, boat handling or travel service. No manufacturer marketing specification is imposed universally."
