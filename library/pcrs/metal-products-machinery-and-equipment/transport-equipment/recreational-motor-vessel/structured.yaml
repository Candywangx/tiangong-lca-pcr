measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "controlled acceptance mass records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Controlled acceptance mass is an acquisition interface, not proof of measurement. Require current original actual lightship/weight inspection, serial/configuration and delivery-state records, a traceable measured/checking method and itemized mass balance. Reconcile additions/deductions and installed service fluids to this PCR net scope. Where physically feasible, retain calibrated load-cell/weighing records and measured fixture/support tare for the actual complete boat or reconciled components; no whole-ship platform scale is prescribed. For afloat-survey-derived records retain observed draught/freeboard, actual water density, verified hull hydrostatics, instrument calibration and measured temporary/tank contents; no uncorrected displacement or design estimate replaces net M. The historical Norwegian procedure is a method example, not a current universal legal threshold. [Source: nma-lightship]"
  - id: installed_scope
    applies_to: "outboard; outfitting"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve independently measured installed assembly masses and supplier inclusions for net M; a complete outboard includes its powerhead/gear/propeller only as supplied. Do not add included constituents or supplier-prefilled fluids again. Catalogue dry hull and nominal engine mass cannot replace accepted complete configuration mass. The historical Anytec manual distinguishes empty boat without engine, empty boat with engine, trailering with fuel/liquids, and maximum loaded conditions: none is automatically this PCR net M."
  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Actual measured kWh converts by verified unit identity 3.6 MJ/kWh; retain intake voltage and site route. Engine/motor nameplate kW is not measured energy."
  - id: formulation_mass
    applies_to: "liquid formulations"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the actual coating base, hardener, fuel or service-fluid formulation separately. Volume-to-mass requires measured density at declared composition/state/temperature; no tank capacity or brochure coating coverage factor."
