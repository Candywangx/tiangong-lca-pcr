allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared shipyard resources"
    rule: "Separate hull orders/configurations and directly attribute measured stock issues/returns, machinery receipts, work hours, meters, trials and rework first. Inseparable shared resources use a demonstrated measured causal driver such as operation time/load or coating area/layer requirement: share = order driver / sum of drivers for all covered orders. Retain period, denominator and causality; tonnage, nominal displacement or equal vessel count is not an automatic causal driver."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_recovery
    applies_to: "internal reuse and waste"
    rule: "Internal reused stock/water/test fuel is a transfer, not repeated fresh input or an automatic credit. Exported waste retains its measured quantity and recipient with no assumed avoided-production benefit. Separate saleable co-products before a documented reviewed residual allocation. Reconcile rejected/reworked construction and work in progress to accepted output during the reporting period."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete-vessel net mass"
      record_type: "controlled_acceptance_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; original acceptance/weight-report id/date; actual lightship/weight-inspection method; instrument/calibration; delivery state; installed service fluids; itemized added/deducted masses; persons/test loads/fuel/fresh water/ballast/testing-load exclusions; detached integral parts; verifier; mass balance"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted vessel"
      temporal_coverage: "actual construction/acceptance period of that vessel"
      site_scope: "declared shipyard acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original actual inspection, configuration correction, mass-balance and verification records"
    - protocol_id: cp_stock_form
      process_id: "stock_form"
      flow_role: "Aluminium hull stock cutting/forming"
      record_type: "foreground_record"
      raw_fields: "hull serial/order; configuration; accepted count; exchange identity/state/property/unit; issues/returns/stock change; supplier inclusions; outboard serial and separate installed mass; electricity kWh/intake; fuel issues/returns/consumed/retained; actual species medium; waste recipient; shared driver/denominator; instrument/calibration"
      collection_method: "Collect drawing revisions and material certificates, weighed issues/returns/offcuts, cutting/forming station meters and job records."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared shipyard and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "originals, weighing, meters, supplier, trial, transfer and acceptance records"
    - protocol_id: cp_hull_join
      process_id: "hull_join"
