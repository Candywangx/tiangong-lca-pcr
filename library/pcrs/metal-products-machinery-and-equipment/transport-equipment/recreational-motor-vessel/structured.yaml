system_boundary:
  rules:
    - rule_id: boundary_construction
      applies_to: "all processes"
      rule: "Include actual manufacture, attributable rework, launching and construction commissioning to declared acceptance gate. Allocate independently measured production-support trial resources; exclude recreational boating/transport service and research/operational maintenance. Add every actual tug/dock/crane service or fuel as a separate declared exchange when included, with service boundary/duration and supplier scope. No lifetime voyage burden is inferred."
      source_ids: []
    - rule_id: boundary_modules
      applies_to: "purchased components"
      rule: "Count finished fabricated hulls, outboard packages and fitted control/safety modules once with constituents and prefills. Replace constituent cards for included supply. Actual in-house manufacture needs measured component inventories. Complete the full actual BOM, all conditional chemistries and demonstrated species before dataset release; the candidate cards are not an exhaustive vessel bill."
      source_ids: []
