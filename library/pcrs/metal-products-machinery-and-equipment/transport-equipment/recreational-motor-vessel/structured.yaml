      record_type: "foreground_record"
      raw_fields: "hull serial/order; configuration; accepted count; exchange identity/state/property/unit; issues/returns/stock change; supplier inclusions; outboard serial and separate installed mass; electricity kWh/intake; fuel issues/returns/consumed/retained; actual species medium; waste recipient; shared driver/denominator; instrument/calibration"
      collection_method: "Retain hull serial, actual weld procedures/inspection, filler/gas net issues, completed bought-hull scope and measured station utilities."
      unit: "actual unit for each row"
