    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "Construction commissioning and complete-boat acceptance"
      record_type: "foreground_record"
      raw_fields: "hull serial/order; configuration; accepted count; exchange identity/state/property/unit; issues/returns/stock change; supplier inclusions; outboard serial and separate installed mass; electricity kWh/intake; fuel issues/returns/consumed/retained; actual species medium; waste recipient; shared driver/denominator; instrument/calibration"
      collection_method: "Retain original actual complete-configuration weight/acceptance records, measurement method/calibration and tare/corrections, trial protocol/conditions and measured fuel/species/waste records."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared shipyard and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "originals, weighing, meters, supplier, trial, transfer and acceptance records"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "Conditional delivery protection"
      record_type: "foreground_record"
      raw_fields: "hull serial/order; configuration; accepted count; exchange identity/state/property/unit; issues/returns/stock change; supplier inclusions; outboard serial and separate installed mass; electricity kWh/intake; fuel issues/returns/consumed/retained; actual species medium; waste recipient; shared driver/denominator; instrument/calibration"
      collection_method: "Weigh each actual protection issue/return and reconcile detached integral delivered items."
      unit: "actual unit for each row"
      frequency: "each order/batch"
      temporal_coverage: "declared manufacturing period"
      site_scope: "declared shipyard and disclosed subcontractors"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "originals, weighing, meters, supplier, trial, transfer and acceptance records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass_origin
      applies_to: "cp_mass"
      requirement: "The original current vessel acceptance mass record must implement mass_record_provenance. Retain actual physical lightship/weight inspection, observable method inputs/calibration and a signed item-level reconciliation to delivered net configuration; reconcile independently weighed installed modules and fluids. A catalogue or unexplained displacement/tonnage record is insufficient. Missing method, uncertain correction or configuration change prevents a complete quantitative dataset; resolve by new measurement/reconciliation, never an assumed weight."
      evidence: "originals/correction ledger; nma-lightship is a method example only"
    - id: quality_bom
      applies_to: "complete vessel"
      requirement: "Reconcile drawings/BOM and installed hull/machinery/outboard drive, piping/electrical, control/safety/navigation and actual service-fluid masses, supplier scope and detached delivered parts. Add all actual missing components before completion; received complete modules count once."
      evidence: "original drawings, weighing and supplier scope"
    - id: quality_balances
      applies_to: "flows and trials"
      requirement: "Retain calibration, material issues/returns/reuse, actual formulation/density, commissioning consumed versus retained fuel and measured species/medium/outlets. Define QA limits from applicable actual records or verified comparable evidence; no invented yield, intensity range or universal commissioning consumption."
      evidence: "stock, meters, SDS, trial and transfer records"
    - id: quality_boat
      applies_to: "rigging; outfit; acceptance"
      requirement: "Reconcile hull-alloy/temper, actual joints and supplier hull scope; installed outboard/propeller/steering/fuel/electrical/safety components and actual working-fluid masses. Record actual construction trial loads/persons/tanks, speed/load/duration only as measured, calibrated station and engine-test energy/fuel, net returns/recovery/wastes and independently measured exhaust species. Development/model tests are not a mandatory per-boat manufacturing input. Missing net-configuration weight method or correction balance blocks complete quantitative data."
      evidence: "actual drawings, supplier scope, weighing and calibrated trial records"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose actual geography/period/configurations, conditional absence, outsourcing, identity/quantity uncertainty, empirical range gaps, missing upstream and applicable acceptance regime. Historical manufacturer/authority examples do not prove present certificates, current legal completeness or the actual M of this vessel. PCR checking validates the declared relationship, not a real ship record or scientific approval."
      evidence: "coverage/evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Require complete configured welded-aluminium petrol-outboard recreational motor vessel and positive actual net M from controlled records implementing mass_record_provenance. Exclude operational contents/persons/fuel/fresh water/ballast and temporary loads, retain declared installed service fluids. Reject tonnage, deadweight, catalogue/full-load displacement or full-fuel mass substitution. Missing underlying method or balance requires review and blocks completed quantitative data."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all rows"
    rule: "Check each atomic physical/chemical exchange, public reference property/unit group, route/state and supplier scope. Engine item count is not mass; a complete outboard includes its engine and fitted constituents once; CuO/Cu2O chemical powder is not formulated aluminium-compatible antifouling paint; water supply is not effluent or resource withdrawal. Keep unsupported identity blank and add actual species/components before completion."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all rows"
    rule: "Verify every amount/collection/conversion against same configuration, actual period/site, accepted count and net M. Reconcile installed prefills, consumed trial fuel and supplier constituents without duplication; verify calibration, density/unit conversions and shared denominator. Unknown is never zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary rows"
    rule: "Use only demonstrated attributable construction-trial species and actual environmental medium. These CO2/NO/NO2 identities are air-unspecified immediate releases; fossil CO2 requires fossil provenance. Total NOx without species split, N2O, nitrogen/nitrite, biogenic CO2, water/soil and long-term releases cannot substitute. Captured dust remains waste."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "claimed flag/class acceptance"
    rule: "Trace actual vessel-specific surveys/certificates and applicable administration/class regime when claimed. Generic manufacturer certification does not certify this recreational motor vessel; no universal numerical standard/test/load is adopted."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured complete welded-aluminium petrol-outboard recreational motor vessel foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching hull/outboard drive/outfitting/coating, controlled net-mass scope, trial boundary, gate/site/period"
  excluded_use: "Recreational boating/transport service or lifetime comparison, equal-mass capacity equivalence, other hull/propulsion categories and unsupported complete cradle-to-gate claims"
  required_metadata: "builder/model and hull serial; drawing/BOM revisions; welded aluminium monohull, alloy/temper and supplied hull completeness; installed petrol four-stroke outboard number/serial, mounts/propeller, steering and rigging; actual deck/seat/glass/foam/electrical/safety configuration, coatings and retained working fluids; actual assembly/acceptance criteria and corrected net delivery state; positive M kg from controlled acceptance records with current actual physical weight/lightship inspection, calibrated traceable inputs and signed itemized mass reconciliation; exclude persons, fuel/fresh water/ballast/test loads, trailer, removable protection and loose spares; actual factory/site/period, supplier boundaries and gate"
  required_quality_disclosure: "Identity/quantity and mass-provenance gaps, uncertainty, conditional absences, full BOM, allocation, actual acceptance scope and unlinked upstream"
  update_trigger: "Hull/outboard drive/outfitting/coating, supplier modules, actual M evidence/corrections, trial state/boundary, manufacturing/acceptance regime, site/period changes"
data_sources:
  - id: "buster-welding-2022"
    type: "literature"
    reference: "[Buster: Designers prioritise safety and performance,23March2022](https://www.buster.fi/en/news/buster-designers-prioritise-safety-and-performance)"
    used_for: "Design/manufacturing tools paragraphs: aluminium-boat MIG/manual/robotic example. New-model development-test section is counterevidence to assuming mandatory per-boat test hours; no duration, mass or production intensity reused. Historical factory example, no current robot or welding recipe mandate."
  - id: "buster-xl-config"
    type: "literature"
    reference: "[Buster XL configured product](https://www.buster.fi/en/models/buster-xl)"
    used_for: "Engine, standard accessories, factory options and hull-surface-treatment lists: complete outboard package, hydraulic steering, tempered glass, aluminium floor and optional primer/antifouling. Undated model snapshot; no catalogue weight, current certification, power, speed or recipe adopted. Supplier/configuration records govern actual supply."
  - id: "anytec-owner"
    type: "literature"
    reference: "[Anytec A21 Owner Manual,issued15February2019](https://www.anytec.se/s/a21_owner_s_manual_english.pdf)"
    used_for: "PDF11/33/35/51/53/73–74,printed3/25/27/43/45/65–66,sections1.1,3.1,3.3,4.1–4.2 and6.2.1–6.2.2: independent aluminium/outboard configuration, distinct model mass states with and without engine and operational contents, fuel/steering modules and optional/proprietary coating context. Historical model manual; operation/maintenance instructions, model weights, power/fuel thresholds and present compliance are not adopted. No proprietary M400 composition inferred."
  - id: "nma-lightship"
    type: "official_guidance"
    reference: "[NMA KS-0179-1E,Rev07.01.2020](https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf)"
    used_for: "PDF/printed5–7 sections3.1–3.4: physical survey identification, state, measured corrections/tanks/water density/draught. Historical Norwegian afloat-method example only; current actual calibrated weight/lightship inspection and net delivery correction record required. No global legal/tank/trim threshold or actual boat M supplied."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "[WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf)"
    used_for: "Printed63/PDF65 tables9.1–9.2: historical allocation hierarchy only, actual measured causal driver required; no equal-boat-count or nominal mass allocation factor."
