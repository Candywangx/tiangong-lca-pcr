review_metadata:
  scientific_review: pending
  semantic_boundary_decision: New complete welded-aluminium monohull recreational
    motor vessel with installed petrol outboard engine, rigging, controls and
    fitted safety/outfitting. Narrower than CPC49490; excludes
    inflatable/sailing/rowing/canoes/personal watercraft,
    professional/passenger/commercial boats, bare hull,
    inboard/sterndrive/diesel/electric variants, composite/wooden/steel hulls,
    trailer and service/operation/repair. Reviewed checkout material manifests
    and related scopes; no same configured complete recreational
    welded-aluminium petrol-outboard vessel material PCR found.
  unresolved_flow_identities:
    - row_id: al_offcut
      flow: Segregated untreated aluminium-alloy cutting offcuts
      reason: Direct compatible new-loose aluminium scrap candidate retains public
        Volume reference internalID0, with Mass as secondary property. This row
        reports independently weighed kg; no actual same-state bulk-volume
        collection/conversion has been established. Keep exact row unresolved
        without rewriting the public property or using its default bulk density.
    - row_id: fabricated_hull
      flow: Complete fabricated welded-aluminium bare recreation hull
      reason: Finished bare hull is not complete rigged boat or steel hull block.
    - row_id: al_wire
      flow: Solid aluminium-magnesium welding filler wire
      reason: Exact filler composition/grade and wire state require verification.
    - row_id: argon
      flow: Gaseous argon welding shielding supply
      reason: Gas supply is not liquid argon without documented actual vaporization
        and compatible supplier scope.
    - row_id: weld_dust
      flow: Captured aluminium-oxide-rich welding filter dust
      reason: Captured oxidized dust transferred as waste is not atmospheric aluminium.
    - row_id: epoxy_base
      flow: Formulated epoxy hull-primer base component
      reason: Pure resin is not complete formulated primer base.
    - row_id: epoxy_hardener
      flow: Polyamine hull-epoxy primer hardener formulation
      reason: Pure amine does not establish hardener formulation.
    - row_id: cu2o_paint
      flow: Formulated International Trilux33 aluminium-hull antifouling paint
      reason: Historical manual identifies one optional supplied paint trade product;
        generic CuO/Cu2O chemicals cannot establish its exact formulation and
        aluminium suitability. Supplier actual SDS/formulation required.
    - row_id: clean_effluent
      flow: Aqueous aluminium-hull cleaning effluent transferred for treatment
      reason: Water resource/discharge flow is not technosphere treatment transfer.
    - row_id: outboard
      flow: Complete petrol four-stroke marine outboard motor
      reason: Exact outboard completeness/fuel route and public reference property
        need verification.
    - row_id: steering
      flow: Complete hydraulic outboard steering system
      reason: Press hydraulic unit is not installed outboard steering assembly.
    - row_id: fuel_tank
      flow: Finished aluminium petrol boat fuel-tank assembly
      reason: Exact petrol-compatible sealed tank/interface and supplied completeness
        require verification.
    - row_id: battery
      flow: Filled lead-acid boat starter battery
      reason: Starting battery public energy reference must not be rewritten as
        component mass.
    - row_id: cable
      flow: Insulated copper marine low-voltage electrical cable
      reason: Exact conductor insulation and marine supplier scope require
        verification.
    - row_id: windshield
      flow: Tempered safety-glass boat windscreen pane
      reason: Direct tempered-glass candidate retains Area reference and inconsistent
        unworked-glass classification; actual finished marine pane completeness
        and independently measured area-to-component-mass conversion are not
        established for this kg row. No public property rewrite.
    - row_id: seat
      flow: Complete upholstered marine passenger seat
      reason: Seat covering, frame and supplier completeness require verification.
    - row_id: buoyancy
      flow: Closed-cell polyethylene boat buoyancy-foam block
      reason: Generic foam does not establish closed-cell polyethylene
        chemistry/design.
    - row_id: bilge_pump
      flow: Complete centrifugal boat bilge-water pump
      reason: Generic fluid pump needs actual bilge scope and supplier completeness.
    - row_id: test_petrol
      flow: Fossil petrol gasoline supplied for construction commissioning
      reason: Actual ethanol blend/fossil origin, grade and supplied route require
        verification.
    - row_id: finished_machine
      flow: Accepted complete welded-aluminium petrol-outboard recreational motor
        vessel
      reason: Direct public other-pleasure-vessels original has broad mixed
        sail/rowing/canoe category and conflicting railway generalComment,
        without configured aluminium/petrol-outboard supplier completeness;
        exact reference remains unresolved.
  unresolved_quantity_ranges:
    - No current actual same-vessel net M or independent boundary-compatible
      manufacture intensity ranges are provided; later foreground records must
      establish amounts and QA limits.
  evidence_limitations:
    - PCR describes required current acceptance-mass provenance; no actual ship
      acceptance/weight record has been obtained or certified. Finite
      measurement consistency does not verify actual ship mass or scientific
      approval.
    - Historical 2020 Norwegian procedure is a limited method example, not
      confirmed current universal law. Historical manufacturer manuals and
      undated configured model statements do not prove actual configuration,
      chemical recipe, capacity or certification.
    - No universal recipe, grade approval, vessel mass, lifetime, trial fuel use
      or emission factor adopted. Every actual BOM/species/service must be
      added; missing supplier upstream prevents complete cradle-to-gate claims.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  identity_rejections:
    - uuid: 10252154-c68d-418a-8805-cd2c45d3ee5f
      row_id: finished_machine
      reason: Public mass-referenced broad other-pleasure-vessels flow does not
        isolate configured aluminium petrol-outboard complete vessel and
        contains conflicting railway commentary; exact reference left
        unresolved.
    - uuid: e34ce81d-4b72-4ea7-b914-9ca973e2f017
      row_id: argon
      reason: Liquid argon supply is not declared gaseous shielding supply without
        actual vaporization/supplier-boundary evidence.
    - uuid: fe0acd60-3ddc-11dd-a354-0050c2490048
      row_id: argon
      reason: Elementary atmospheric argon is not a technosphere shielding-gas supply.
    - uuid: 0f5a6a98-22cc-4549-af43-6ed44014e5de
      row_id: al_offcut
      reason: Material/state candidate is compatible new loose fabrication scrap;
        public Volume internalID0 preserved and secondary Mass internalID1 is
        not the reference. This kg row lacks independent same-state bulk-volume
        collection/conversion; default bulk density not adopted.
    - uuid: a6841a63-fa81-448b-abd3-4bc732d8696d
      row_id: windshield
      reason: Area reference preserved; unworked-glass classification conflicts with
        tempered finished pane commentary. Actual marine pane supply scope and
        empirical area/component-mass conversion unavailable for this kg row.
    - uuid: f854fcea-1b30-4b25-8dfb-7829bcfb51cd
      row_id: battery
      reason: Energy-referenced starting-battery identity with conflicting BESS
        commentary lacks a supported conversion and supplier-completeness link
        to actual filled marine component mass; original property retained in
        receipt.
