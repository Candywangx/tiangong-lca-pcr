  semantic_boundary_decision: "Create a narrower complete dry nonpropulsive uncrewed aluminium-frame photovoltaic/Li-ion satellite-platform manufacturing PCR excluding mission payload and launch vehicle. Constituent material/electronic PCRs and vehicle-body records do not cover complete bus integration, configured dry weighing and tailored flight-unit environmental acceptance; no existing material platform in scanned snapshot. Old leaf and mapping remain unchanged."
  unresolved_flow_identities:
