      reason: "Public generic rechargeable battery has Number of items reference and does not establish the complete filled spacecraft pack/BMS supply; another candidate is a 1000 mAh cell with Net calorific value reference. Preserve these properties; actual item-to-mass conversion would not cure cell/pack and rating ambiguity. No lead-acid/NiCd substitution."
    - row_id: "power_board"
