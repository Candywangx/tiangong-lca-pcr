      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_provenance using current actual calibrated whole-platform readings, measured tare/temporary loads and same-serial dry flight BOM. Independently reconcile battery electrolyte, integrated thermal/power/attitude components and physically measured detached integral panels. No launcher limit, catalogue mass, U-size or inferred part sum substitutes for M. Missing physical originals or uncertainty blocks quantitative completion and requires scientific/data review."
      evidence: "actual weighing/calibration/BOM/release; GEVS 2.4.7 mission-dependent context only"
    - id: quality_atomic
      applies_to: "all exchanges"
      requirement: "One physical/formulated identity per row. Match actual public reference property/unit group, chemistry/state, supplied completeness and route. Space photovoltaic III-V panels differ from silicon terrestrial cells; Li-ion pack differs from lead-acid/NiCd; spacecraft computer differs from aircraft avionics; gas differs from liquid nitrogen and elementary nitrogen. Preserve blank identities with reasons."
      evidence: "supplier spec/SDS/receipt and public identity records"
    - id: quality_tests
      applies_to: "cp_acceptance"
      requirement: "Retain actual tailored serial-linked test plan/reports, functional and interface pass criteria, chamber/shaker/cleanroom resources, calibration, test fixtures and outsourcing. Qualification versus acceptance and thermal cycling versus thermal vacuum are different cases. Neither manufacturer tables nor historical GEVS makes every test or fixed level universal; disclose failed tests and attributable rework."
      evidence: "actual acceptance plan, meter/job/outsourcing originals"
    - id: quality_balance
      applies_to: "material, solvent and utilities"
      requirement: "Close input, accepted incorporation, measured returns/stock and waste/release balances on same period/configuration. Separate supplied process water, wastewater transfer and natural withdrawal; no mandatory natural-water flow. IPA releases require actually evidenced species/medium, not all solvent issue. Measure actual kWh and gas mass/state rather than nameplate power or nominal gas-volume conversion."
      evidence: "period balances, calibrated meters and transfer/release originals"
    - id: quality_completeness
      applies_to: "dataset and upstream links"
      requirement: "Separate measured, calculated, missing and demonstrated not_applicable. Disclose all omitted actual components/processes, supplier boundary mismatch, unresolved identities/ranges, uncertainty and shared test burden. No candidate completeness or cradle-to-gate claim until actual foreground and compatible upstream coverage are verified."
      evidence: "actual complete BOM/process map, quality and gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Check positive actual complete dry bus M and mass/acceptance protocol. Reference name exactly matches finished_platform, excluding payload/launch vehicle/propellant and temporary fixtures. Actual missing weighing or supplied completeness requires review; no complete-spacecraft identity forced onto a bus."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Check same lower-case row/rule/protocol ids, q_item per accepted unit, measured M kg, explicit normalize_mass application and identical EN/ZH bases. Preserve actual public properties rather than relabeling counts/area/energy as Mass."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "test and BOM"
    rule: "Audit actual acceptance versus qualification, outsourced versus in-house test resource, received versus fabricated assembly and detached integral versus simulator/packaging. Expand all actual exchanges beyond candidate cards; never count a whole purchased battery and its contained cells/electrolyte again."
    source_ids: []
  - rule_id: validate_profile
    applies_to: "dataset and intended use"
    rule: "Require scope/configuration, measurement and test provenance, omitted/unresolved data, allocation and compatible upstream unit disclosure. Finite measurement-check pass is not scientific approval, certification or mission-lifetime validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual-data completion and review"
  downstream_use: "Configured bus manufacturing input to a separately bounded complete-spacecraft model"
  allowed_use: "Compare compatible actual manufacturing gates, configurations, test coverage and upstream linkage per kg; no mission equivalence from equal mass"
  excluded_use: "Exclude complete payload-bearing spacecraft, launch vehicles/upper stages, propulsion/thrusters/propellant, crewed/deep-space/nuclear/fuel-cell platforms, composite-primary-frame and other undeclared power/structure routes, ground station/dispenser/launch adapter, payload instruments and integration after the platform gate, qualification-only engineering models, spares/repair/refurbishment, software R&D/training services, launch transport/ascent/deployment/in-orbit operation and end of life. Model operational lifetime or mission output separately."
  required_metadata: "manufacturer/model/serial and controlled configuration/drawings/BOM; flight hardware versus engineering model; aluminium alloy/temper and stock-versus-received-frame scope; bus-side payload interface with payload excluded; solar semiconductor technology/panel completeness/stowed delivery; filled Li-ion pack chemistry, BMS, state of charge and safety records; exact computer/radio/antenna/ADCS component part numbers and containment; actual thermal layers/pads and installed fittings; no propulsion/propellant; actual dry net M kg from calibrated complete-bus weighing with measured fixture tare and same-serial acceptance record; integral detached flight parts reconciled, no payload simulators/packaging/GSE; actual functional/environmental acceptance plan and tailored test levels/utility meters; manufacturing site/period/gate, outsourced services, allocation, upstream linkage, uncertainty and omissions"
  required_quality_disclosure: "Foreground measured/calculated/missing status, actual mass/test evidence, unresolved identities/ranges, omission and upstream mismatch, allocation and uncertainties; candidate status and pending scientific review"
  update_trigger: "Actual bus configuration/component chemistry or supplied scope, manufacturer acceptance/test plan, mass method, factory utilities or upstream data change"
data_sources:
