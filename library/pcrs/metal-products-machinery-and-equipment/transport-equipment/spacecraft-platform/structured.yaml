allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacturing utilities"
    rule: "Directly attribute serial/configuration-linked material net issues, submeters, assembly/test jobs and rework first. For inseparable shared resources use a measured causal occupied fixture/chamber time and actual electrical load or other documented actual driver: share = order driver / sum of covered order drivers. Retain full period and denominator. Equal bus counts, U-size, nameplate test power, launch payload capacity or mission lifetime are not defaults."
    source_ids: []
  - rule_id: allocation_tests
    applies_to: "acceptance and shared qualification"
    rule: "Keep flight-unit acceptance, qualification/prototype/destructive hardware and payload-interface test simulators distinguishable. Direct unit acceptance resources to the tested unit; document actual programme applicability and reviewed causal denominator before attributing shared qualification resources. Do not count destroyed/prototype mass as accepted platform output or charge independent R&D to this manufacturing foreground. Outsourced test resources and purchased services cannot both represent the same test twice."
    source_ids:
      - gsfc-gevs-2021
  - rule_id: allocation_recovery
    applies_to: "chips, rework and rejects"
    rule: "Document measured waste versus saleable output and actual scrap collection route. Internal rework remains in accepted production without making another product. Do not grant avoided-primary-aluminium or landfill credits solely because chips are recyclable. Disclose any actual co-product allocation method, causal evidence, alternatives and sensitivity before use; mass transfer alone is not economic/substitution evidence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference_product"
      record_type: "accepted physical weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M; actual equipment/BOM; all scale readings and fixture tare; detached integral parts; battery state; payload/GSE exclusions; calibration/uncertainty; signed mass reconciliation"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted unit"
      temporal_coverage: "actual manufacturing/acceptance period"
      site_scope: "declared platform acceptance gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original calibrated physical weighing with measured tare and controlled dry flight configuration"
    - protocol_id: cp_structure_fabrication
      process_id: "structure_fabrication"
      flow_role: "inventory"
