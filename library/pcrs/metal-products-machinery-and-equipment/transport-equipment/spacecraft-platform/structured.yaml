measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Physically weigh the actual complete dry accepted platform on calibrated suitable equipment with measured fixture/tare correction, controlled installed equipment list and serial/configuration release. Record stowed/detached integral parts, filled battery and actual included thermal/electronic state; remove measured temporary loads, payload simulators and ground fixtures. Reconcile component mass sum to actual whole-bus reading, uncertainty, scale resolution/calibration, date/operator and positive net M. Catalogue estimates, component sum alone or launcher limits do not replace weighing."
  - id: energy_units
    applies_to: "each electricity row"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Use verified energy unit-group conversion 1 kWh = 3.6 MJ; keep electrical intake energy distinct from semiconductor area, battery capacity, mass and generated orbit power. No heating-value or fuel density factor supplied."
