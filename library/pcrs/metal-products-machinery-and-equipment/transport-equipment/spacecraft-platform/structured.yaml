    used_for: "2026 online chapter: 3.2 current photovoltaic III-V junction architecture, 3.4 batteries and PMAD context. Technology identity and solar/battery configuration only; no efficiency, cell/pack mass, Wh/kg, lifetime or mandatory supplier choice used. Actual supplied chemistry and scope govern."
  - id: "nasa-structures"
    type: "official_guidance"
    reference: "[NASA Small Spacecraft Technology: 6.0 Structures, Materials, and Mechanisms](https://www.nasa.gov/smallsat-institute/sst-soa/structures-materials-and-mechanisms/)"
    used_for: "2026 online chapter, 6.1/6.2 structure material/modular-frame discussion and CubeSat primary structures: metallic/nonmetallic route differences, machined 6061/7075 examples and attached secondary thermal/power components. No nominal spacecraft weight limit, volume, universal alloy/temper or machining intensity adopted. 6061-T6 stock and thermal cards remain conditional actual foreground specifications."
  - id: "gsfc-gevs-2021"
    type: "standard"
    reference: "[GSFC-STD-7000B (2021): General Environmental Verification Standard](https://standards.nasa.gov/sites/default/files/standards/GSFC/B/0/gsfc-std-7000b_signature_cycle_04_28_2021_fixed_links.pdf)"
    used_for: "Sections 2.1 general verification, 2.4.7 mass properties and 2.6 thermal verification: mission-dependent configuration, analytical/measurement distinction and verification planning context. Historical Goddard standard, not current universal requirement or method approval. Physical net-M weighing is this declared foreground protocol and needs actual records; GEVS analysis allowance does not establish actual measured M. No test levels, tolerance, duration, cycles or temperature imposed."
