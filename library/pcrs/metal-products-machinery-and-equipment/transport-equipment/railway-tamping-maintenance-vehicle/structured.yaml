measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Obtain current calibrated actual complete-vehicle or documented wheel/axle-load weighing covering all wheels of the same vehicle and stated level method. Retain instrument calibration, zero/tare, repeatability, serial/date/operator and uncertainty. Sum actual appropriate wheel/axle measurements; reconcile installed units/fluid state/fixed ballast and physically measured integral detached parts. Deduct separately measured fuel, persons, protection and temporary loads from the weighed state with item-level signed balance. Working-order mass without traceable corrections is insufficient."
  - id: property_conversion
    applies_to: "components and utilities"
    required_property_ref:
      name: "original property"
      uuid: ""
    required_unit: "actual row unit"
    rule: "Preserve engine Number of items/Item(s), not kg. Record received item count and independently weighed installed engine mass for net-M balance; no fixed engine-mass factor is supplied. Keep energy and volume distinct from mass. Meter electricity kWh and convert 1 kWh = 3.6 MJ within the verified energy unit group. Convert liquid volume only with actual same-formulation density/temperature and source records; no presumed oil/fuel density."
