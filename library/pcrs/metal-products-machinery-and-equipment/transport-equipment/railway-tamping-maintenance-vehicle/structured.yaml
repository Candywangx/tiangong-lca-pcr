allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared manufacture"
    rule: "Directly attribute serial/configuration-linked net issues, meters, work-unit test time and rework first. Allocate inseparable shared utilities by demonstrated measured causal machine time/load or coated area/layer demand: share = order driver / sum of covered order drivers. Retain period, denominator and causality. Equal vehicle count, engine rating, axle-load limits or metres of track tamped are not default drivers."
    source_ids: []
  - rule_id: allocation_fuel
    applies_to: "commissioning and retained diesel"
    rule: "Reconcile actual diesel issued less measured returns/stock change with actual consumed fuel and separately measured fuel retained at the gate. Trial-diesel input covers attributable consumption plus retained delivery fuel; the separate fuel output receives no avoided-production credit and is excluded from M. Allocate any separately saleable product only after direct separation using justified actual records. Emissions use actual consumed trial fuel/species measurements, not the issued total or lifetime fuel."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "reuse, wastes and rejects"
    rule: "Internal steel/water/fluid reuse is a transfer, not fresh input or automatic credit. Exported waste retains measured amount and recipient without presumed avoided production. Reconcile rejected/reworked units and work in progress to accepted output; document resource attribution and no repeated accepted-output count."
    source_ids: []
