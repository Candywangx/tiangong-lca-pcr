  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_provenance using actual current traceable physical weighing and itemized net-configuration reconciliation. Every included wheel/axle belongs to the same unit and state; reconcile measured detachable fittings/fills and ensure no omitted/double-counted weight. Missing original method, calibration, state correction or positive M blocks a complete quantitative dataset and requires review/new measurement."
      evidence: "original weighing and configuration correction ledger"
    - id: quality_bom
      applies_to: "complete configuration"
      requirement: "Reconcile all actual frame, bogie/wheelset, diesel drivetrain, tamping/lifting/hydraulic, brake, auxiliary/cab/control and service-fluid masses to accepted net M. Record purchased assembly inclusions; no duplicate wheelsets/engines/work units inside purchased assemblies or prefilled hydraulic/engine oils; installed tools versus spares and retained diesel are reconciled separately. Add actual omitted parts and exchanges before completion."
      evidence: "complete drawings/BOM/receipts/weighing/SDS"
    - id: quality_balance
      applies_to: "amounts and species"
      requirement: "Retain calibration, energy meters, issues/returns/reuse, measured fluid composition/density, waste manifests and actual emission method/species/medium. Define empirical QA limits from applicable measured records or verified comparable sources. No universal manufacturing intensity, vehicle mass or burner emission factor is supplied."
      evidence: "actual meter/stock/mass balances and uncertainty"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Disclose period/site/configurations, conditional absence, subcontracting, identity/quantity uncertainty, range gaps and missing supplier upstream. Historical product/production examples do not establish present product certification or this tamping vehicle M. This PCR specifies future record requirements; no actual tamping vehicle weighing or plant inventory has been certified."
      evidence: "coverage and evidence limitations register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require the covered complete self-propelled diesel-hydraulic plain-line tamping/lifting/lining configuration, positive measured net M, cp_mass and independent mass_record_provenance. Reject catalogue weight, nominal axle-load multiplication, loose ballast/train weight or filled fuel tank as net M. Missing actual measurements or state reconciliation requires scientific/data review before quantitative dataset completion."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "all exchanges"
    rule: "Verify exact physical/chemical identity, public reference property/unit group, formulation/state and supplier completeness. Rail tamping unit is not a road compactor; tine is not rebar; hydraulic mineral and ester formulations differ; engine public item count is not Mass; filled assemblies do not create duplicate prefills. Supplied process water is not environmental resource or effluent. Keep unsupported UUID blank."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all quantities"
    rule: "Verify original property/unit, actual collection, q_item/M conversion, same serial/configuration/site/period, accepted count, calibration, fuel balance and causal allocation denominator. Energy, volume and item count must not be renamed Mass. Unknown amount is not zero."
    source_ids: []
  - rule_id: validate_species
    applies_to: "conditional trial releases"
    rule: "Require measured attributable species/outlet and exact medium. Selected fossil CO2, NO and NO2 describe immediate releases to air, unspecified; verify fossil fuel provenance. Do not substitute total NOx, N2O, nitrogen/nitrite, biogenic CO2, water/soil or long-term releases. Captured oxidized filter dust is a waste, not elemental airborne iron. No emission quantity is mandatory."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "work units and complete vehicle"
    rule: "Trace actual component performance/leak tests, complete structural/electrical/hydraulic/brake checks, measuring-system calibration and attributable factory track-trial results/rework/release for the same configuration. Document applicable contract/jurisdiction when claimed; public historical example does not certify this vehicle. No universal pressure, vibration frequency, cycle count or productivity threshold is imposed."
    source_ids:
      - plasser-production
published_dataset_profile:
  dataset_role: "Configured complete diesel-hydraulic plain-line tamping vehicle foreground manufacture"
  downstream_use: "secondary_dataset; background_dataset after qualified review and compatible upstream linkage"
  allowed_use: "Manufacturing supply-chain models matching diesel/hydraulic route, gauge/work-unit/configuration, complete measured net scope, supplier boundary, gate/site/period"
  excluded_use: "Track-maintenance or passenger/freight service, lifetime footprint, equal-mass tamping performance, other power/maintenance routes and unsupported complete cradle-to-gate"
  required_metadata: "builder/model/serial/drawing revision; plain-line and track gauge/sleeper compatibility; tamping-head/tine material/tip/count and vibration/squeeze configuration; lifting/lining clamp and geometry control; frame/bogie/wheelset/drive/brake scope; diesel engine/transmission and hydraulic pump/actuator/fluid formulation; cab/electronics/starter battery and actual safety/AC options; supplier assembly inclusions/prefills; actual installed service-fluid/fixed-ballast state; accepted complete fuel-excluded net M in kg from traceable actual same-vehicle weighing; excluded persons/loose ballast/spares/packaging/test loads, separately measured fuel at gate and integral detached delivered fittings; manufacturing/commissioning gate/site/period; upstream linkage and resource allocation"
  required_quality_disclosure: "Identity/quantity/mass-provenance gaps, uncertainty, absent optional stages, complete actual BOM, causal allocation, fuel balance, acceptance and unlinked supplier upstream"
  update_trigger: "Diesel/transmission, hydraulic/cooling chemistry, tamping/lifting/gauge/brake configuration, frame/finish, supplier completeness, measured M corrections, trial boundary or manufacturing site/period changes"
data_sources:
  - id: "plasser-production"
    type: "literature"
    reference: "[Plasser & Theurer: Production](https://www.plassertheurer.com/en/company/production)"
    used_for: "Manufacturer headings Cutting Shop, Welding Shops, Part Production, Complex Cylinders, Work Unit Production Shop, Bogie and Gearbox Production Shop, Electrical Pre-Assembly, (Final) Assembly and Commissioning. Supports stage distinctions and manufacturer-specific pre-installation test/commissioning context, not universal stock quantities, chemistry, pressures, temperatures or trial cycles. Actual site records govern included processes."
  - id: "matisa-compact"
    type: "literature"
    reference: "[MATISA: Compact tamping machines](https://www.matisa.ch/brochures_pdf/en/bourreuses_compactes_en.pdf)"
    used_for: "Undated model brochure, PDF p.3 (printed pp.4–5) B 45 D: plain-line vehicle, bogies, cabs and independent tamping units. Configuration example only; model-specific tool count, frequency, productivity, weight and numerical performance are not adopted. Other turnout models are outside scope."
  - id: "plasser-csm-case"
    type: "literature"
    reference: "[Plasser & Theurer: used 09-32 CSM](https://www.plassertheurer.com/en/fleet/used-machines/09-32-csm)"
    used_for: "Technical Specifications and Description identify a 1996 machine with diesel drive, hydraulic tamping/lifting/lining and pneumatic brakes. Historical configuration fact only; resale product itself is excluded. No published mass, engine rating, vibration frequency, tank capacity, geometry or named-oil chemistry is adopted as a present requirement or quantity."
  - id: "plasser-hybrid"
    type: "literature"
    reference: "[Plasser & Theurer: Unimat 09-32/4S Dynamic E3](https://www.plassertheurer.com/en/machine/universal-tamping-machines/unimat-09-32-4s-dynamic-e3)"
    used_for: "Hybrid drive paragraph: diesel or overhead-electric motor can power hydraulic work units. Excluded counterexample prevents treating hydraulic actuation as proof of diesel-only supply. No operating noise, emissions saving, battery benefit or production factor is adopted."
