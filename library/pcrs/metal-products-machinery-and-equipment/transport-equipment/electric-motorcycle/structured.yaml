system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "all_processes"
      rule: "Record actual received finished-module scope and chronological operations. Do not simultaneously count finished frame and its steel/coating upstream, or finished battery and its cells/electrolyte. Separate receipts only when outside supplied scope. Extend locally made modules with their actual atomic operations before completeness claims."
      source_ids:
        - bmw-ce04-architecture-2021
        - bmw-ce04-production-2021
    - rule_id: boundary_terminal
      applies_to: "finished_motorcycle"
      rule: "End at accepted configured vehicle factory gate; external charger, customer use, maintenance, lifetime disposal and riding distance are excluded. Manufacture1kg cannot compare transport services without an independent functional model."
      source_ids: []
    - rule_id: boundary_exchanges
      applies_to: "all_processes"
      rule: "Add every missing physical BOM item, actual utility, packaging and observed waste/release as a separate card before complete inventory claims. No generic parts/materials/VOC/waste exchange and no presumed mandatory emission."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Completed supplied chassis, powertrain, battery/electrical and body components at their documented gates; actual separately received fluids and utilities"
  starting_condition_role: "Integration foreground; earlier material production, welding/coating, motor/cell/pack manufacture are abstracted upstream even if on-site before this gate"
  product_classification_scope: "CPC3.0:49913 narrower complete battery-electric two-wheel road motorcycle"
  recursive_input_rule: "A same-category purchased complete motorcycle remains one visible input to a separately declared operation; do not recursively duplicate its manufacture or hide it as parts"
  upstream_dataset_requirement: "Match each actual component/chemical/electricity/packaging and receiver/transport service to actual technology, geography and time or disclose specific gaps"
  disclosure: "Module inclusions and prefill; same-site abstracted stages; actual tests/repair/idle; missing BOM and links; packaging, return and recovery destinations"
