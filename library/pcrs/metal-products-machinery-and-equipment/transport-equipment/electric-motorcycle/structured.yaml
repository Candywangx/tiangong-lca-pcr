measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: physical_component_mass
    applies_to: "component rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect independent actual supplied installed component kg with original weight/tare/inclusion and count trace. Do not use nominal battery kWh, power rating or catalogue vehicle weight as kg. Preserve public Number/Energy when a valid matching identity and actual conversion exist; never rewrite it as Mass."
  - id: electricity_units
    applies_to: "electricity rows"
    required_property_ref:
      name: "Energy"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Measure actual kWh at the declared supply interface and convert1kWh=3.6MJ. Retain imports/exports separately and charging meter boundary."
  - id: fluid_state
    applies_to: "fluid rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Wet supplied formulation mass, actual concentration and retained net fill; precharged modules counted once. Volume needs measured batch density and temperature, never an assumed water density."
