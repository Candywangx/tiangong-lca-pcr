allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all_processes"
    rule: "First subdivide model-specific orders/meters/operations. Assign actual material and test energy directly where traceable. Retain repair/reject burden with accepted output; do not drop failed vehicles from the period numerator."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "Where subdivision is unavailable use actual causal machine-time, metered cycles or documented occupied line-time for the relevant stage, supported by current foreground measurements. Declare formula, driver totals and residual shared loads; compare an alternative defensible driver. Do not allocate unlike battery variants merely by assumed catalogue mass."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "waste and returns"
    rule: "Track actual stock returns, internal recovery and exported receiver states. Waste exports are not motorcycle co-products. No avoided-production credit, arbitrary recovered-material substitution or unobserved scrap yield; any separate recovery model must declare actual receiver route and allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "complete motorcycle"
      record_type: "calibrated physical net weighing"
      raw_fields: "model; configuration; serial; accepted net mass M; scale/tare; installed battery and fluid state"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted vehicle/configuration"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original scale readings, calibration, tare and signed complete state"
    - protocol_id: cp_parts
      process_id: "all_processes"
      flow_role: "single finished assembly"
      record_type: "supplier/drawing and component weighing"
      raw_fields: "one part design/serial/material/chemistry; receipt/return/installed/rejected net kg; actual supplied installed weight; count; prefill/included hardware; accepted count"
      collection_method: "Independently weigh actual supplied installed assemblies with calibrated scales or traceable original same-lot weights; record counts only for trace. Verify installed pack kg independently of vehicle M and module supply inclusions. For the input numerator retain actual receipts less supplier returns, including consumed rejected/reworked components, separately from installed kg; reconcile destinations and allocate to accepted output. Do not infer kg from capacity, power or a parts mass share."
      unit: "kg"
      frequency: "each lot/order/configuration"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "actual attributable component kg / accepted units of the same configuration"
      quality_evidence: "signed drawings, inclusion certificate and independent weights/count reconciliation"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "single chemical or packaging product"
      record_type: "actual issue/return/fill records"
      raw_fields: "one formulation/SDS/concentration or box design; actual net supplied/issue/return/retained kg; fill/spill; prefill; accepted count"
      collection_method: "Measure actual net stock using calibrated weighing, subtract recorded returns and separate retained/collected/released destinations. Preserve wet composition; use measured batch density/temperature only when original volume requires kg conversion. Avoid duplicate prefill."
      unit: "kg"
      frequency: "each issue/fill/batch"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "actual attributable stock kg / accepted units of the same configuration"
      quality_evidence: "scale/tare, SDS, fill/return and material balance"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "single stage electricity"
      record_type: "metered electricity and actual commissioning logs"
      raw_fields: "stage/meter/voltage/provider/geography; raw kWh; charging import/export; initial/final charge; test cycles; idle/rework; accepted count"
      collection_method: "Read calibrated user-side meters and causally attribute actual stage totals, including charging and test equipment once. Convert1kWh=3.6MJ and keep exported recovered energy separate. Nominal pack kWh and motor ratings do not establish input."
      unit: "MJ"
      frequency: "each stage/test and reporting period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "actual attributable stage MJ / accepted units of the same configuration"
      quality_evidence: "meter calibration and actual charge/test/idle reconciliation"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "one exported waste stream"
      record_type: "segregated receiver shipment"
      raw_fields: "one waste chemistry/module serial/state; net wet kg/tare; source/receiver; return/recovery; accepted count"
      collection_method: "Weigh actually exported separately collected waste excluding containers and record analysed wet chemistry or complete module scope. Distinguish irreparable pack disposal from repairable supplier return and service end-of-life."
      unit: "kg"
      frequency: "each shipment/period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "actual exported net waste kg / accepted units of the same configuration"
      quality_evidence: "weighing/analysis/charge-state and source-receiver balance"
    - protocol_id: cp_emission
      process_id: "cleaning"
      flow_role: "single residual IPA air release"
      record_type: "compound-specific measurement"
      raw_fields: "CAS67-63-0; air submedium; post-control concentration/flow/time; solvent balance; limits/uncertainty; accepted count"
      collection_method: "Quantify actual residual release by matched sampling or a closed documented balance of IPA issue, recovery, residue and retention. No assumed complete evaporation or generic VOC factor; preserve absent/unmeasured/below-detection distinctions."
      unit: "kg"
      frequency: "representative actual cleaning/control period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling/calibration lab records and solvent balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "complete configured motorcycle"
      record_type: "as-built and factory acceptance records"
      raw_fields: "model/serial; complete BOM; make-or-buy/gate/inclusions; firmware; actual electrical/brake/leak/charge/drive tests; pack/fluid/delivery state"
      collection_method: "Trace current approved as-built drawings and supplier inclusions. Record actually performed commissioning, electrical safety, brake/drive function and relevant fluid leak tests against the actual factory plan and disposition; source examples do not prescribe universal thresholds. Declare all optional equipment and net delivery state."
      unit: "kg"
      frequency: "each vehicle/configuration change"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable line/module gates"
      aggregation_rule: "qualifiers accompany each accepted same-configuration unit"
      quality_evidence: "signed complete BOM, supplier, configuration/test/disposition records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_conversion
      applies_to: "period records"
      rule: "Attribute actual period exchange totals to one accepted configuration using current causal records; divide attributable amount by accepted unit count to obtain q_item. Retain rejects/rework in the numerator and reconcile stock, returned material and measured retained component mass. Do not pool different pack/drive configurations without a declared physical weighted model."
      inputs:
        - cp_parts
        - cp_stock
        - cp_energy
        - cp_mass
      output: "q_item"
      source_ids: []
  data_quality_requirements:
    - id: mass_provenance
      applies_to: "cp_mass"
      requirement: "Positive M requires current actual calibrated complete net weighing with scale capacity/resolution, calibration, zero/tare, original readings and signed serial/configuration. Independently measure installed traction/auxiliary packs and supplied motor/module kg; reconcile all permanent hardware and retained fluids against complete M. No catalogue unladen/gross weight, allowable load, battery energy-to-mass estimate or invented per-unit mass. If safe weighing removes a part, retain actual original state and independently measured same-unit add/remove correction."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: net_configuration
      applies_to: "finished_motorcycle"
      requirement: "M includes the actual complete vehicle, installed specified traction and auxiliary batteries, motor, inverter, gearbox/belt, onboard charger/converter, chassis/body/lights and retained fluid fills once. Exclude rider, luggage, temporary test equipment, external charger, loose charging cable/spare pack and shipping packaging; declare separate delivery products. Pack cell electrolyte and module prefilled lubricants/fluids are not duplicate separate inputs. Actual permanent accessories and all missing BOM items must be reconciled."
      evidence: "cp_mass; cp_parts; cp_stock; cp_configuration"
    - id: completeness_balance
      applies_to: "all exchanges"
      requirement: "Expand the controlled complete as-built BOM and real operating records: missing rear lights/indicators, controls, cables/hoses, mounts, mirrors, stand, secondary panels, lubricant, packaging and services each need their own specific exchange. This starting inventory cannot claim complete factory coverage without that expansion and matched upstream/transport/receiver links. Reconcile stock-to-installed/returned/rejected/waste balances, wet fluids and observed compound-specific emissions; report uncertainty, limits, cut-offs and allocation sensitivity."
      evidence: "cp_parts; cp_stock; cp_energy; cp_waste; cp_emission"
    - id: source_limits
      applies_to: "external sources"
      requirement: "2021 BMW documents are historical structure/plant examples, not independent quantitative factory observations or current universal recipes. They distinguish air-cooled traction battery from liquid-cooled motor and include local motor and pack-housing/module work before this declared completed-component gate. Do not transfer catalogue mass, range, charging time, green-power marketing, dimensions, pack chemistry fractions or production layout into default quantities or compliance claims. Collect current actual plant/provider/test evidence and independent measurement records."
      evidence: "bmw-ce04-architecture-2021; bmw-ce04-production-2021"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Verify complete declared battery-electric two-wheel road motorcycle, positive physical net M kg and independent pack/module measurements. Reference product name/UUID equals finished_motorcycle exactly; broader49913 identity does not imply side-car coverage, service equivalence or complete supplier inventory."
    source_ids: []
  - rule_id: validation_supply
    applies_to: "all_processes"
    rule: "Verify actual gates, module inclusions and prefilled fluid status, chronological assembly/test disposition, firmware/battery/drive compatibility and complete BOM. Supply gates cannot silently remove local motor/cell/pack manufacturing from broader claims. Apply actual approved factory acceptance and lawful product requirements independently of historical source examples."
    source_ids:
      - bmw-ce04-architecture-2021
      - bmw-ce04-production-2021
  - rule_id: validation_identity
    applies_to: "all flow rows"
    rule: "Verify actual public type, chemical/state/reference property/group/unit, route/supply scope and official bilingual names. Rail traction motor, robot inverter, wind-farm coolant, grouped miscellaneous motorcycle parts and lead-input-to-harness are not these finished individual modules. Preserve public Number/Energy rather than relabel Mass; leave specific unresolved row_ids when identity or conversion is unsupported. IPA air release is not purchased IPA or spent solution."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "claims"
    rule: "A mechanical PCR pass does not establish scientific approval, actual measured quantities, full cradle-to-gate coverage, current homologation or kilometre/lifetime equivalence. Report remaining identity, independent evidence, BOM, measurement and link gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured battery-electric motorcycle completed-component integration manufacturing foreground; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same complete configured motorcycle manufacture scaled by actual net M with matching upstream components and declared operations"
  excluded_use: "Passenger/vehicle-km service, use-phase charging, battery lifetime, repair/disposal service, combustion/other vehicle architectures and approval"
  required_metadata: "Full model/serial/as-built BOM and component gates; installed pack chemistry/voltage/charge/net kg and motor/inverter scope; actual prefill/fluid state; net complete M kg original weights and independent module balance; optional accessories; current plant/period/provider/test/firmware records; allocation and upstream/receiver links"
  required_quality_disclosure: "Configuration/BOM/identity/measurement/link and independent evidence gaps; historical source applicability, actual returns/rejects/recovery/exports; limits/uncertainty and allocation sensitivity"
  update_trigger: "Battery chemistry/installed scope, frame/drive/module supply, fluid/prefill, firmware/acceptance, net weighing state, plant/provider/period or packaging changes"
data_sources:
  - id: "bmw-ce04-architecture-2021"
    type: "handbook"
    reference: "BMW Motorrad USA, The new BMW CE 04,7July2021, Electric Drivetrain Technology; Innovative Electric Drive; Charging; ABS; One-piece Tubular Steel Frame; LED lighting. https://www.press.bmwgroup.com/usa/article/detail/T0337286EN_US/the-new-bmw-ce-04?language=en_US"
    used_for: "Historical model architecture only: steel frame, separate electric drive/pack/cooling/charging and running gear; no numerical mass/recipe/range/factor adopted."
  - id: "bmw-ce04-production-2021"
    type: "handbook"
    reference: "BMW Group, Start der Serienfertigung BMW CE 04 im BMW Group Werk Berlin,8November2021, Elektromobilitaet und Segmentvielfalt aus der Hauptstadt; Technologiekompetenz und Digitalisierung. https://www.press.bmwgroup.com/deutschland/article/detail/T0356512DE/start-der-serienfertigung-bmw-ce-04-im-bmw-group-werk-berlin?language=de"
    used_for: "Historical plant observation: local motor assembly and battery-housing/module work precede final assembly. Defines why completed-component gates need explicit upstream disclosure; same publisher as architecture, not independent quantities."
