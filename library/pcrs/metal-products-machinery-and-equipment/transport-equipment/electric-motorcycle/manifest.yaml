review_metadata:
  semantic_boundary_decision: Create narrower complete battery-electric two-wheel
    road motorcycle final manufacturing integration PCR with completed component
    gates, installed traction battery, actual retained fluids and calibrated
    physical net acceptance. Existing accumulator and motor records describe
    upstream components, not complete motorcycle assembly/commissioning and
    inclusion accounting. No existing material motorcycle record found in this
    worktree. Exclude pedal-assisted cycles, sidecars,
    combustion/hybrid/three-wheel routes, isolated parts and transport/use
    services. Legacy leaf remains read-only; no accepted mapping added.
    Historical BMW local motor/pack operations are upstream abstractions, not
    silently outsourced or universally required.
  scientific_review: pending independent methodology review
