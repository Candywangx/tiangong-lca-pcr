review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: Manufacture of complete new diesel single-chamber
    rear-loading refuse compactor road vehicles, with a purchased runnable
    cab-chassis, fabricated steel body/subframe and hydraulic packing/discharge
    equipment integrated and accepted by the vehicle converter. Declare one
    exact VIN/model and released body/chassis configuration. This is a narrower
    product and manufacturing-route boundary within CPC49119, not every
    special-purpose vehicle. Exclude body-only, chassis-only,
    rebuilt/remanufactured vehicles, multi-chamber and side/front-load
    architectures, electric/CNG propulsion, street sweepers, fire engines,
    mobile cranes, concrete mixers, ambulances and ordinary goods vehicles.
    Waste collection/transport/treatment service, transported waste mass,
    driver/crew/payload, operation, maintenance, distribution and end-of-life
    are outside scope. Factory functional/road tests and rework are
    manufacturing. No service life, collection yield or waste-throughput
    denominator is assumed. Existing material crane/attachment/works-truck
    methodologies have different host-machine boundaries; none establishes this
    complete rear-loader vehicle conversion. Old leaf remains read-only
    scaffold; no mapping accepted.
  reference_identity_basis: Public manufactured CPC49119 special-purpose vehicle
    product identity has Mass reference property. Adopted as the category
    identity with mandatory exact complete diesel rear-loader qualifiers; not a
    generic fleet mix or numerical supplier dataset.
  unresolved_flow_identities:
    - row_id: body_sheet
      selected_flow: Hot-rolled high-tensile steel sheet for compactor body
      reason: Generic sheet has contradictory Chinese silver-sheet label and
        unspecified rolling/strength; thick high-strength plate does not
        establish this thin body sheet.
    - row_id: wear_plate
      selected_flow: AR400 abrasion-resistant steel plate for refuse hopper
      reason: Public low-alloy Q345/Q355 thick plate does not establish AR400
        abrasion-resistant heat-treatment/grade.
    - row_id: subframe_channel
      selected_flow: Formed steel channel for compactor subframe
      reason: Cold-forming candidate has forging/wire-feed description and conflicting
        hot-rolled classification; exact formed channel supply not established.
    - row_id: welding_wire
      selected_flow: Solid low-alloy steel MIG welding wire
      reason: Flux-cored wire and welding-service candidates are not solid MIG wire.
    - row_id: argon
      selected_flow: Argon welding shielding gas
      reason: Search shielding gases do not establish pure argon; direct CO2 proxy
        also references Volume*time, not this mass-based pure argon supply.
    - row_id: epoxy_primer
      selected_flow: Formulated epoxy anticorrosion primer
      reason: Search candidates do not establish exact released physical supply
        specification and route.
    - row_id: pu_topcoat
      selected_flow: Formulated polyurethane vehicle body topcoat
      reason: Search candidates do not establish exact released physical supply
        specification and route.
    - row_id: wash_effluent
      selected_flow: Spent alkaline body washing solution for treatment
      reason: Direct candidate specifies15% NaOH/85%water; actual spent bath
        composition is not established as that recipe.
    - row_id: hydraulic_pump
      selected_flow: High-pressure hydraulic gear pump for compactor
      reason: Direct candidate is an energy-reference complete press hydraulic power
        unit, not standalone refuse compactor gear pump.
    - row_id: packing_cylinder
      selected_flow: Double-acting hydraulic packing cylinder
      reason: Cylinder candidates are unfinished machined parts/kits, not released
        complete double-acting cylinder.
    - row_id: tailgate_cylinder
      selected_flow: Single-acting hydraulic tailgate lift cylinder
      reason: Parts/kits do not establish complete tailgate lift cylinder supply.
    - row_id: ejector_cylinder
      selected_flow: Telescopic double-acting hydraulic ejector cylinder
      reason: Unfinished cylinder parts/kits do not establish complete telescopic
        ejector cylinder.
    - row_id: spool_valve
      selected_flow: Hydraulic spool valve for compactor control
      reason: Search candidates do not establish exact released physical supply
        specification and route.
    - row_id: oil_reservoir
      selected_flow: Finished steel hydraulic oil reservoir
      reason: Search candidates do not establish exact released physical supply
        specification and route.
    - row_id: pto
      selected_flow: Truck power-take-off gearbox for compactor pump
      reason: Search candidates do not establish exact released physical supply
        specification and route.
    - row_id: body_controller
      selected_flow: Finished refuse compactor electronic controller
      reason: Direct controller candidate describes machine-tool PLC/sensor/cabinet
        mix rather than one released automotive compactor controller.
    - row_id: body_harness
      selected_flow: Finished insulated copper compactor-body wiring harness
      reason: Formed wiring-harness candidate is intermediate before end-of-line QC,
        not this released finished harness.
    - row_id: hydraulic_oil
      selected_flow: Formulated mineral antiwear hydraulic oil, ISO VG 46
      reason: VG46 compressor washing oil is different use/formulation.
        Volume-reference generic hydraulic fluid can preserve Volume with
        measured density but does not establish this exact mineral antiwear VG46
        formulation.
    - row_id: bin_lifter
      selected_flow: Finished rear-mounted hydraulic refuse-bin lifter
      reason: Search candidates do not establish exact released physical supply
        specification and route.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  evidence_limitations:
    - Heil2025-labelled brochure case supports welded steel/subframe,
      actuation/controls and chassis interfaces; no thickness, weight, capacity,
      pressure, flow, cycle time, life, supplier activity or emission factor
      adopted. Specifications are subject to change.
    - Independent Dennis Eagle Olympus manufacturer
      single-compartment/lift/hydraulic-ram architecture; undated product page,
      no numerical LCI or universal test requirements adopted.
    - Scania attachment tables have no printed edition and metadata modified
      October2021; historical interface alternatives only, no current
      installation approval, part availability or universal fastener
      size/grade/torque.
    - Complete-vehicle UUID is a publicly verified manufactured CPC49119 product
      with Mass reference, qualified by exact diesel single-chamber rear-loader
      configuration. It does not supply a generic mix, supplier LCI or
      methodology approval.
    - Conditional formulations/components and emissions require actual released
      BOM/SDS/supplier and calibrated foreground evidence. No uniform machine
      mass, exhaust or leakage assumed. Unresolved individual identities remain
      explicit and block unsupported identity claims.
    - Manufacturing converter foreground only; complete cradle-to-gate requires
      independent supplier/transport/treatment coverage. Scientific review
      pending and Chinese aligned, not reviewed/published.
