allocation_rules:
  - rule_id: allocation_demand
    applies_to: "shared_operations"
    rule: "Subdivide by site/configuration/work order first. Shared cutting/welding, coating, crane handling and test demand use measured causal load/time or attributable exchange from cp_allocation, reconciled to total meter and excluded work. No default mass, GVW, body-volume or refuse-throughput allocation."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "variants"
    rule: "Keep body size, chassis, actuation, coatings and lifter variants separate; normalize each by its measured M. Any residual physical/economic fallback requires actual supporting records, sensitivity and review. Scrap/reject/rework burdens remain with accepted production."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "outputs"
    rule: "Internal steel/paint/water/oil recovery is a transfer; no automatic avoided-production or recycling credit. External scrap and waste treatment recorded explicitly. Marketable coproduct claims require actual quality, quantity and independently reviewed treatment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each VIN or traceable same-configuration batch"
      temporal_coverage: "same declared manufacturing period"
      site_scope: "same accepted complete delivery configuration"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "vehicle-scale calibration; empty-body record; delivery-fluid/BOM binding; signed release"
    - protocol_id: cp_body
      process_id: "body"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "steel grade/heat/thickness/drawing; purchased-channel versus site-forming; net issues/returns; weld map/wire/gas; meter kWh; rejects/scrap; captured dust; outlet particle concentration/flow/time"
      collection_method: "Weigh net stock issues and segregated offcuts; trace cut/form/weld jobs and actual utilities. Measure post-control outlet particulate with receiving-air conditions and recorded size fraction, not a generic welding factor."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing-data log"
    - protocol_id: cp_coating
      process_id: "coating"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "supplier SDS/recipe/concentration/solids; net ingredient issues; wet purge/residue chemistry; retained film; kWh; outsourced route; xylene speciation/air flow/time"
      collection_method: "Measure each supplied chemical/coating and separate wet waste; reconcile bath/paint stocks and recovered material to retained film. Meter actual utilities and sample post-control xylene species; do not infer all VOC as xylene."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing-data log"
    - protocol_id: cp_integration
      process_id: "integration"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "chassis VIN/supply scope/received mass and fuel-fluid state; exact component part numbers/dry masses; mounting design/torque; pump/cylinder/hose/control specification; oil grade/density/temperature/net fill/recovery; kWh"
      collection_method: "Reconcile purchased chassis and each installed body/hydraulic/control component to released BOM, measured or traceable supplier net mass. Record contained versus separate PTO/lifter/components; meter electric installation/test work and weigh oil fill/recovery/waste."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing-data log"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "VIN/test plan/results; engine/PTO operating time; new fuel mass; incoming/opening/closing tank stock; fossil/bio carbon composition; retained fuel/oil; actual road/leak/interlock tests; utilities; empty-body M"
      collection_method: "Collect actual factory fuel/test utilities and accepted counts including rework. Separate imported chassis fill, additional supply, recovery, consumption and delivered stock. For fossil CO2 use measured exhaust or measured consumed fossil-carbon balance, separating retained carbon and other carbon products; no fixed fuel factor. Record all other species individually when evidenced, never NOx as NO2."
      unit: "kg; MJ"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing-data log"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each atomic process row"
      record_type: "measurement"
      raw_fields: "actual PE formulation/thickness/mass; board flute/fiber/recycled-content/mass; returns; detached spare list"
      collection_method: "Weigh each actual packaging component separately and keep outside M; record detached spare supply separately."
      unit: "kg"
      frequency: "each work order/batch/VIN; monthly closure"
      temporal_coverage: "complete declared year or justified shorter complete batch; matched accepted count"
      site_scope: "same configuration/sites; outsourcing disclosed"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "calibration; supplier/BOM release; stock/count closure; missing-data log"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_load"
      record_type: "measurement"
      raw_fields: "total supplied demand; submeter load/time; served variants; excluded work"
      collection_method: "Measure exchange-specific causal demand/time and served work orders; justify driver and reconcile all shares to meter total."
      unit: "MJ; h"
      frequency: "each shared batch; monthly reconciliation"
      temporal_coverage: "same production period"
      site_scope: "all served sites/variants"
      aggregation_rule: "partition measured causal demand; attributable amount / accepted units"
      quality_evidence: "meter closure; sensitivity; uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "body_sheet; wear_plate; subframe_channel; welding_wire; argon; body_electricity; steel_scrap; weld_pm; wash_water; sodium_hydroxide; epoxy_primer; pu_topcoat; coating_electricity; wash_effluent; paint_waste; xylene_air; cab_chassis; hydraulic_pump; packing_cylinder; tailgate_cylinder; ejector_cylinder; spool_valve; hydraulic_hose; oil_reservoir; pto; steel_screw; body_controller; body_harness; hydraulic_oil; used_oil; integration_electricity; bin_lifter; diesel_fuel; test_water; release_electricity; fossil_co2_air; pe_film; corrugated_board"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "flows"
      requirement: "Verify exact material grade/state, supplied formulation and component completeness; distinguish chassis/body/service, parts/complete cylinders and commodity oil/formulated fluid. Preserve public reference properties."
      evidence: "released supplier specifications; identity/property/unit audit"
    - id: quality_complete
      applies_to: "vehicle"
      requirement: "Reconcile fitted components and delivered retained fluids to actual complete M. No invented residual mass, assumed body weight or invisible chassis emissions. Document upstream/treatment coverage gaps."
      evidence: "VIN BOM; calibrated scale; supplier scope; stock closure"
    - id: quality_acceptance
      applies_to: "release"
      requirement: "Retain actual mounting, leak/pressure, packing/ejector, interlock/emergency-stop, road/brake and applicable release results; no brochure values as acceptance defaults."
      evidence: "signed tests and release; calibrated instruments; actual approvals"
    - id: quality_period
      applies_to: "records"
      requirement: "Declare sites/representative period, supplier versions, primary coverage, allocation uncertainty and missing/excluded/not-applicable status. Historical interface examples are not current numerical plant data."
      evidence: "work orders; meter closure; sampling conditions; uncertainty"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require1kg complete reference output and measured cp_mass M linked to exact empty-body VIN/BOM and delivered fluid/accessory state. GVW, approximate body mass, refuse tonnes or service distance cannot be the denominator."
    source_ids: []
