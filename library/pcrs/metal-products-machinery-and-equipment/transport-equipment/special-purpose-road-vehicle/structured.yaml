    name: "Chassis mounting and hydraulic/control integration"
    inclusion: "required"
    inclusion_condition: "Receive complete runnable diesel cab-chassis; mount exact body/subframe, install hydraulic actuation, controls and actual optional lifter. Document interface approvals and contained supplier scope."
