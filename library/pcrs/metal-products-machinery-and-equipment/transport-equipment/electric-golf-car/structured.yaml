      collection_method: "For each atomic row, use calibrated meters, weighed issue/returns, supplier receipts and disposal tickets. Preserve property: kg for mass, MJ from electricity meters, m3 for directly abstracted groundwater, and Item(s) for physically counted finished tyres. Record installed tyre count from issue/return and BOM/acceptance inspection; measure tyre mass separately only for material reconciliation. Purchased-water mass is not converted to volume without measured density and conditions. Reconcile stage utility totals with the factory bill, and component/retained-fluid inclusion with the net-mass record."
