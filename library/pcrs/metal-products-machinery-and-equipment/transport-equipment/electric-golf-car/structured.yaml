  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration_trace
      applies_to: "all rows"
      requirement: "Trace every input to installed BOM, route and accepted unit; supplier finished parts do not also receive raw-stock burdens. Disclose remaining components as missing coverage until separate atomic records are added."
      evidence: "drawings, BOM, supplier receipts"
    - id: basis_quality
      applies_to: "cp_mass"
      requirement: "M must be positive measured net mass, with the same delivered configuration, fluid state and acceptance gate as all collected exchanges."
      evidence: "calibration and weighing records"
    - id: coverage_quality
      applies_to: "all processes"
      requirement: "Document full batch temporal coverage, meter overlap, rejects, rework, stock changes, outsourced stages and unmeasured emissions. A missing record is unknown, not zero or not_applicable."
      evidence: "ledger, coverage matrix and measurement uncertainty"
    - id: chemistry_quality
      applies_to: "wet_surface; powder_finish"
      requirement: "Verify recipe, concentration and SDS for each supplied formulated chemical; characterize each outgoing waste stream and identify treatment separately from environmental emissions."
      evidence: "recipe, SDS, analyses and transfer tickets"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Reject missing qualifiers, passenger/payload-loaded, battery-excluded or shipping-gross mass substitution, non-positive M or mismatch between configuration, cp_mass and finished_machine. Require 1 kg output and explicit normalize_mass on every non-reference applicable row."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "inventory"
    rule: "Require one physical exchange per row, verified public identity when supplied, correct property/unit, localized display and medium. Unresolved UUIDs do not authorize proxy substitution or mixed rows."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "coverage"
    rule: "Reconcile installed mass, stock, waste, retained fluids and purchased parts using the actual BOM; independently reconcile installed battery, chassis, drive, body and wheel/brake/suspension module content with measured BOM mass; count-property tyres retain Item(s), with separately measured tyre mass used only in the physical balance. Reconcile battery water issue, retention, waste and measured charging emissions without a default hydrogen factor. Reconcile utilities by stage; internal transfers cancel. Explain differences against recorded measurement uncertainty, without a fabricated numerical tolerance."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check every conditional stage against route evidence. Require missing chemicals, parts, test media and actual emissions to be split and collected before claiming a complete inventory; prohibit cradle-to-gate or service comparisons while upstream or functional coverage is incomplete."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared_operations"
    rule: "Require complete driver records and justification for allocation and scrap treatment; document sensitivity where another defensible allocation may change results."
    source_ids:
      - ghg-product-allocation-2011
published_dataset_profile:
  dataset_role: "Manufacturing foreground process for a configured accepted unit"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to a declared golf-car supply model with identical configuration and disclosed upstream coverage"
  excluded_use: "Customer charging, golf rounds or passenger transport service; performance comparison across battery/frame/brake configurations without separate functional modelling"
  required_metadata: "Model, configuration, empty state, M, retained fluids, manufacturer/site, reporting period, process route, voltage/geography, supplier gates, transport/packaging scope and allocation"
  required_quality_disclosure: "Measured versus estimated quantities; unresolved identities; unmeasured emissions and components; upstream linkage completeness; uncertainty, data age and configuration limitations"
  update_trigger: "Changed battery chemistry/model/count/pack boundary, chassis or body material, motor/controller/charger, braking/suspension, installed accessories, BOM, fluid/cleaner/coating recipe, purchased component, energy mix, acceptance or net-mass protocol"
data_sources:
  - id: "clubcar-tempo-2022"
    type: "handbook"
    reference: "Club Car, Tempo brochure GLF0003, copyright2022, imprint042822, PDF p.3 electric and lithium-ion specification columns, frame/steering/suspension/brakes and weight footnote; PDF p.2 optional equipment. https://storage.clubcar.com/-/media/project/milky-way/clubcar/clubcar-documents/pdf/literature/golf-fleet/golf-cars/tempo/glf0003-tempo-brochure---lr.pdf"
    used_for: "Historical qualitative golf-car architecture: aluminium frame, rack-and-pinion steering, leaf suspension and mechanical electric-vehicle rear drum brakes. Approximate brochure curb weight explicitly unsuitable for official documentation is not M. No manufacturing intensity, material grade, lifetime, battery chemistry or universal process inferred."
  - id: "ezgo-rxv-2024"
    type: "handbook"
    reference: "E-Z-GO/Textron, RXV spec sheet822013-G18, Rev.06/2024, copyright2024, PDF p.2 ELiTE and EX1-Gas columns, lithium/AC drive, seating, steering/suspension, service/parking brakes, welded powder-coated steel frame and injection-moulded TPO body; p.2 optional accessories. https://ezgo.txtsv.com/sites/default/files/2024-08/GOF-0524_RXV_SS_822013-G18.pdf"
    used_for: "Historical qualitative electric variant and alternative steel/TPO construction. Electric column has induction-motor service braking and electromagnetic parking braking; gasoline drum-brake column is not applied to electric. No numerical weight, capacity, current, power, speed, warranty, energy saving or factory acceptance threshold adopted."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard2011, chapter9, printed p.63 / PDF p.65, tables9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical allocation hierarchy only; actual causal allocation drivers required, no current comprehensive standards-conformance claim."
