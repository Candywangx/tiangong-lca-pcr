  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration_trace
      applies_to: "all rows"
      requirement: "Trace every input to installed BOM, route and accepted unit; supplier finished parts do not also receive raw-stock burdens. Disclose remaining components as missing coverage until separate atomic records are added."
      evidence: "drawings, BOM, supplier receipts"
    - id: basis_quality
      applies_to: "cp_mass"
      requirement: "M must be positive measured net mass, with the same delivered configuration, fluid state and acceptance gate as all collected exchanges."
      evidence: "calibration and weighing records"
    - id: coverage_quality
      applies_to: "all processes"
      requirement: "Document full batch temporal coverage, meter overlap, rejects, rework, stock changes, outsourced stages and unmeasured emissions. A missing record is unknown, not zero or not_applicable."
      evidence: "ledger, coverage matrix and measurement uncertainty"
    - id: chemistry_quality
      applies_to: "wet_surface; paint"
      requirement: "Verify recipe, concentration and SDS for each supplied formulated chemical; characterize each outgoing waste stream and identify treatment separately from environmental emissions."
      evidence: "recipe, SDS, analyses and transfer tickets"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Reject missing qualifiers, driver/payload-loaded, legal curb-mass convention or shipping-gross mass substitution, non-positive M or mismatch between configuration, cp_mass and finished_machine. Require 1 kg output and explicit normalize_mass on every non-reference applicable row."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "inventory"
    rule: "Require one physical exchange per row, verified public identity when supplied, correct property/unit, localized display and medium. Unresolved UUIDs do not authorize proxy substitution or mixed rows."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "coverage"
    rule: "Reconcile installed mass, stock, waste, retained fluids and purchased parts using the actual BOM; independently reconcile installed pack/drive/charger constituent gates, retained fluids and VIN/options with the weighed vehicle. Reconcile charging losses and initial/final charge state without inventing a capacity credit; reconcile paint stocks, recovered solvent, sludge and actual speciated releases. Reconcile utilities by stage; internal transfers cancel. Explain differences against recorded measurement uncertainty, without a fabricated numerical tolerance."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check every conditional stage against route evidence. Require missing chemicals, parts, test media and actual emissions to be split and collected before claiming a complete inventory; prohibit cradle-to-gate or service comparisons while upstream or functional coverage is incomplete."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared_operations"
    rule: "Require complete driver records and justification for allocation and scrap treatment; document sensitivity where another defensible allocation may change results."
    source_ids:
      - ghg-product-allocation-2011
published_dataset_profile:
  dataset_role: "Manufacturing foreground process for a configured accepted unit"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to a declared battery-electric passenger-car manufacturing model with identical configuration and disclosed upstream coverage"
  excluded_use: "Driving/transport service, customer charging or life-cycle comparisons across battery chemistries, range, seating and vehicle classes without separate functional modelling"
  required_metadata: "Model, configuration, empty state, M, retained fluids, manufacturer/site, reporting period, process route, voltage/geography, supplier gates, transport/packaging scope and allocation"
  required_quality_disclosure: "Measured versus estimated quantities; unresolved identities; unmeasured emissions and components; upstream linkage completeness; uncertainty, data age and configuration limitations"
  update_trigger: "Changed battery chemistry/capacity/constituent gate, drive/charger/control configuration, VIN/options, retained fluids, body-stock/coating recipe, supplier gate, factory charging/test route, energy supply, acceptance criteria or mass protocol"
data_sources:
  - id: "vw-id3-plant-2019"
    type: "handbook"
    reference: "Volkswagen AG, Production start of Volkswagen ID.3: The plant (2019), Transformation during normal operation; body production, painting and assembly paragraphs. https://www.volkswagen-newsroom.com/en/production-start-of-volkswagen-id3-6348/the-plant-6351"
    used_for: "Historical qualitative body/paint/assembly and cockpit-module example. Future plans, output capacity, automation ratios, renewable supply and carbon-neutral claims are not adopted as manufacturing amounts, current facts or mandatory routes."
  - id: "bmw-i4-plant-2020"
    type: "handbook"
    reference: "BMW Group, BMW Group Plant Munich gears up for fully electric future (22 July 2020), high-voltage battery body and assembly paragraphs. https://www.press.bmwgroup.com/global/article/detail/T0311207EN/bmw-group-plant-munich-gears-up-for-fully-electric-future"
    used_for: "Historical integration of an installed high-voltage battery into vehicle body/assembly. Does not specify NMC/LFP chemistry, present route, cell-production intensity or a universal factory configuration; actual chemistry and supplier gate require foreground receipts."
  - id: "ghg-product-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapter9, printed p.63 / PDF p.65, tables9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical allocation hierarchy; actual physical-driver evidence needed, no present comprehensive standard-conformance assertion."
