measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: vehicle_delivery_state
    applies_to: "delivery configuration"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Bind cp_mass to the same VIN/options, installed battery and retained-fluid/charge state. No driver, passengers, payload or handling tare enters M. Document removed transport protection separately; do not infer M from a legal curb-mass convention or catalogue weight."
  - id: energy_units
    applies_to: "electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the meter unit; convert kWh to MJ using exactly 1 kWh = 3.6 MJ. Do not interpret the electricity property name as a combustion inventory."
  - id: volume_units
    applies_to: "groundwater rows"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Retain measured volume and its conditions; do not invent gas density, water density or calorific value to switch to mass or energy."
