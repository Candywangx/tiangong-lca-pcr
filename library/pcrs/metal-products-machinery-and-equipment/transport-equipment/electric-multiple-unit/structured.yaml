        - cp_energy
        - cp_mass
      output: "q_item"
      source_ids: []
  data_quality_requirements:
    - id: survey_provenance
      applies_to: "cp_mass"
      requirement: "Controlled acceptance M must originate in the current actual calibrated static rail wheel/axle weighing inspection for every identified car of the complete same-configuration trainset, with original readings, date, zero/tare/calibration, track and coupling/support conditions and uncertainty. Sum distinct verified wheel/axle mass readings only once; if sensors report force in N, preserve the actual metrological force-to-mass conversion and local calibration basis rather than assuming a universal gravity value. Successive measurements must control load redistribution and configuration changes; demonstrate closure against complete-car/trainset weights and an independent supplied-component/retention balance. Dynamic axle limits, catalogue weights, tare labels without originals, payload capacities or arbitrary four-wheel totals cannot substitute. The2012 Schenck article illustrates static wheel/wheelset measuring equipment; it provides neither current records nor a universal whole-trainset protocol or legal mandate. If the actual measurement and balance cannot be established, retain a scientific/measurement gap and do not claim an observed physically complete dataset."
      evidence: "schenck-weight-2012; cp_mass; cp_parts; cp_configuration"
    - id: net_configuration
      applies_to: "accepted trainset"
      requirement: "M includes every accepted declared car and permanent installed mechanical/electrical/interior equipment, pantograph/couplers and retained working lubricants/coolants/refrigerant charges once. Record actual original as-weighed state and separately measured signed add/remove corrections for the same trainset. Exclude passengers/crew/cargo, service water/sewage, temporary test ballast, temporary supply leads, lifting/support fixtures and packaging. Separate supplied assembly mass and included precharge from local fluid top-ups: no double receipt or mass. Independently measured component mass must reconcile with whole-trainset M; vehicle count times a catalogue weight is invalid."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: quality_coverage
      applies_to: "all exchanges"
      requirement: "Current full as-built BOM, alloy/joint/finish procedures and supplied inclusions determine actual exchanges. Expand all additional specific stocks, weld/fusion consumables, floor/insulation/adhesive, battery/controls/safety, working fluid, packaging, returned test energy, transport and receiver exchanges before physical-completeness claims. Verify material/energy/water and emission/waste balances, detection limits, uncertainty and representative site/period; actual trial/rework burden remains. No universal yields, paint need, tool life, motor mass share, fluid fill or service-life values."
      evidence: "cp_configuration; cp_stock; cp_parts; cp_energy; cp_waste; cp_emission"
    - id: quality_evidence_limits
      applies_to: "external sources"
      requirement: "Hitachi2017 Class385 pp.104–106 supports historical AC trainset architecture/traction/controls/outfit;2020 article p.53 (header764–765) supports general A-Train double-skin extrusion/FSW without mandatory paint. These are not current production records, universal exact recipes, actual mass or regulatory conformity. Schenck September2012 is historical weighing-method evidence only; its standards claims are not adopted as current requirements. Missing current factory/weighing/supply records remain explicit scientific-review needs."
      evidence: "hitachi-class385-2017; hitachi-atrain-2020; schenck-weight-2012"
