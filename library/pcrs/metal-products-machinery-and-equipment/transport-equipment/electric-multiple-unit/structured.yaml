system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Receipt of certified unjoined aluminium stocks and supplied finished components starts this foreground; complete configured manufacturing acceptance ends it. Include actual local cutting/machining, fixture-controlled FSW and approved additional joining/inspection, conditional finishing, bogie/motor and electrical/outfit assembly, rework, formation and performed factory tests. Local fusion welds require distinct actual alloy filler and shielding-gas cards if used; FSW does not universally consume either. Approved joining and tool logs determine consumptions. Purchased bogies, motors, converters, doors and HVAC are measured at their actual supplied boundary with internals and precharges counted once. Buying finished carbodies changes this local fabrication route and requires a separate declared make-or-buy model, not simultaneous finished-body and stock inputs. Actual additional brake plumbing, battery, floor/insulation, adhesive, safety/electronic equipment, coolant/refrigerant, lubrication, compressed air, heating, packaging and transports must each be expanded as one specific exchange before claiming complete foreground coverage. Upstream extraction/component manufacture/inbound transport and receiving waste treatment are covered only by matched separately linked datasets; no complete cradle-to-gate claim without those links. Customer operation, infrastructure, maintenance and disposal stay outside."
      source_ids: []
