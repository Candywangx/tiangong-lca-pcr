    - id: period_conversion
      applies_to: "order records"
      rule: "For one same configuration, attribute actual period exchange totals to accepted finished trainsets using documented causal records. Compute q_item from attributed exchange / accepted trainsets, retain rework/reject burden and all intermediate quantities. Never pool three/four-car or motor/trailer variants without documented weighted configuration model."
