allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared manufacturing"
    rule: "Separate order/design/car position and meter each stage before allocation. Use actual weld-machine occupancy, recorded machine energy/time, finishing booth occupancy and performed test time only where a causal relationship is demonstrated. Retain idle/rework and rejected units in the period balance. Motor/trailer cars differ; neither car count nor kg alone is a universal driver. Report totals, accepted denominator and allocation sensitivity; no prescribed shares."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "single waste streams"
    rule: "Record internal stock reuse/recovery separately from measured receiver exports, maintaining one balance. For actual valuable co-products first use subdivision/causal relations; disclose explicit alternative allocation sensitivity if unavailable. Do not silently apply price allocation, avoided virgin aluminium credit, recovered-paint credit or theoretical regenerative-energy credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_trainset"
      record_type: "controlled acceptance mass"
      raw_fields: "configuration; accepted net mass M; trainset/car IDs/order; raw static wheel/axle loads; calibration; actual state and measured corrections; signed M kg; accepted counts"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted trainset/configuration"
      temporal_coverage: "same actual declared manufacturing reporting period; include rejected/reworked units"
      site_scope: "declared manufacturing site and identified trainset/order"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "current calibrated physical records plus survey_provenance and net_configuration"
    - protocol_id: cp_stock
      process_id: "body_finish"
      flow_role: "specific stocks/chemicals/tools"
      record_type: "net material issue record"
      raw_fields: "lot/formulation/alloy/temper; net receipt/issue/return kg; stock change; retention/offcut; tool use; accepted same-configuration units"
      collection_method: "Weigh net receipts, issues and returns by one specific stock/chemical and order. Record mix constituents and recovered material separately; reconcile actual consumption and accepted counts. Track attributable tooling by actual usage, not nominal lifetime."
      unit: "kg"
      frequency: "each lot/order/stage"
      temporal_coverage: "same actual declared manufacturing reporting period; include rejected/reworked units"
      site_scope: "declared manufacturing site and identified trainset/order"
      aggregation_rule: "attributable net material kg / accepted units of the same configuration"
      quality_evidence: "calibrated scale/lot/SDS/weld and coating plan; inventory and recovery balance"
    - protocol_id: cp_parts
      process_id: "running_electrical_outfit"
      flow_role: "single supplied component"
      record_type: "installed supplied mass record"
      raw_fields: "part/car/serial and count; supplier inclusion; measured supplied net kg; retained charges; returns; accepted trainsets"
      collection_method: "Measure each supplied installed component net kg independently from whole-trainset M. Retain supplier BOM and count/serial; subtract packaging and returns, retain supplied working-fluid scope once. Assembly receipts replace their included constituents."
      unit: "kg"
      frequency: "each receipt/installation/configuration"
      temporal_coverage: "same actual declared manufacturing reporting period; include rejected/reworked units"
      site_scope: "declared manufacturing site and identified trainset/order"
      aggregation_rule: "net installed supplied kg / accepted units of the same configuration"
      quality_evidence: "original receipt weights/tare/BOM/charge certificates and car-position reconciliation"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "specific voltage-interface electricity"
      record_type: "metered energy record"
      raw_fields: "interface/voltage/provider; meter readings kWh; gross imports/returns; time/idle/rework; causal allocation; accepted units"
      collection_method: "Read actual stage meters and test-boundary import/return meters. Convert measured kWh using1kWh=3.6MJ, keeping interfaces separate; document shared driver totals and meter losses. Do not infer use from installed ratings or regeneration theory."
      unit: "MJ"
      frequency: "each stage and actual test"
      temporal_coverage: "same actual declared manufacturing reporting period; include rejected/reworked units"
      site_scope: "declared manufacturing site and identified trainset/order"
      aggregation_rule: "attributable measured MJ / accepted units of the same configuration"
      quality_evidence: "meter calibration/raw logs, voltage topology and allocation ledger"
    - protocol_id: cp_water
      process_id: "acceptance"
      flow_role: "municipal test water"
      record_type: "test-water record"
      raw_fields: "supply quality; supplied/recovered kg; actual density/temperature if measured volume; test times; accepted units"
      collection_method: "Measure actual test water supply and separate reuse/discharge; convert volume to mass only with actual supported density at recorded conditions."
      unit: "kg"
      frequency: "each performed water test"
      temporal_coverage: "same actual declared manufacturing reporting period; include rejected/reworked units"
      site_scope: "declared manufacturing site and identified trainset/order"
      aggregation_rule: "net supplied water kg / accepted units of the same configuration"
      quality_evidence: "meter/scale calibration, supply quality and water balance"
    - protocol_id: cp_waste
      process_id: "body_finish_acceptance"
      flow_role: "single receiver-bound waste"
      record_type: "weighed receiver shipment"
      raw_fields: "single waste composition/state; gross/tare/net kg; internal reuse; receiver route; stock change; accepted units"
      collection_method: "Weigh each segregated actual waste shipment excluding container; retain state/analysis and receiver record, reconcile source process stock and reuse. Captured dust, paint residue and collected test water stay separate from emissions."
      unit: "kg"
      frequency: "each shipment/reporting period"
      temporal_coverage: "same actual declared manufacturing reporting period; include rejected/reworked units"
      site_scope: "declared manufacturing site and identified trainset/order"
      aggregation_rule: "net exported waste kg / accepted units of the same configuration"
      quality_evidence: "scale/tare/receiver tickets and substance balances"
