  unresolved:
    evidence_needs:
      - Current full trainset BOM/ordered formation/alloy-joint-FSW procedures,
        make-or-buy inclusions/charges and actual acceptance tests; historical
        sources are not complete factory observations.
      - Current calibrated actual static wheel/axle weighing originals for every
        car with coupling/support/state corrections, independently supplied
        component weights and physical balance establishing positive net M.
      - Expand all actual additional specific
        chemical/component/working-fluid/test-return/transport/receiver cards
        and matched upstream links; perform independent scientific review.
