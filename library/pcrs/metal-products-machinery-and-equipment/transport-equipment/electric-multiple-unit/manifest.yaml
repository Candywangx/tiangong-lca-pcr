review_metadata:
  semantic_boundary_decision: Complete configured aluminium double-skin FSW
    overhead25kV AC passenger electric multiple unit manufacturing foreground,
    with motor/trailer formation, permanent
    running/traction/brake/control/interior outfit and net trainset acceptance.
    Narrower than CPC49520; upstream aluminium/motor/component and
    track-material PCRs do not cover this complete product integration. Other
    propulsion/body routes, trams, locomotives,
    unpowered/freight/maintenance/incomplete cars and use/repair excluded.
    Read-only legacy leaf not promoted; no mapping acceptance.
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
    - row_id: fsw_tool
      reason_code: identity_not_established
      explanation: Bounded public searches do not establish the actual single supplied
        rail component design, configuration and completeness. Related services,
        stock and umbrella component flows do not identify this physical
        exchange; actual supplier evidence remains required.
    - row_id: traction_transformer
      reason_code: identity_not_established
      explanation: Public candidate734249ea is a400kVA10/0.4kV distribution
        transformer, not the declared rail traction transformer; Number property
        alone is not grounds for rejection.
    - row_id: traction_converter
      reason_code: identity_not_established
      explanation: Public39b22d41 is industrial robot servo-drive electronics;
        photovoltaic inverter candidates also do not identify railway traction
        equipment.
    - row_id: auxiliary_converter
      reason_code: identity_not_established
      explanation: Bounded public searches do not establish the actual single supplied
