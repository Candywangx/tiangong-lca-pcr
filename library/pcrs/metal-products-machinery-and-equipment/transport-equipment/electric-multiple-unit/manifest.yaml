    - row_id: pantograph
      reason_code: identity_not_established
      explanation: Publicbac03a9c has only a bare pantograph label with
        electrical-energy CPC17100 classification and no physical supply
        specification; identity inconsistencies require review rather than
        forced adoption.
    - row_id: traction_cable
      reason_code: identity_not_established
      explanation: Low-voltage49101b44 cannot identify25kV traction cable. Exact
