process_map:
  - id: prepare
    name: "Received tube inspection, butt-aware cutting and miter preparation"
    inclusion: "required"
    inclusion_condition: "Verify actual member grade/heat/profile and trim allowance; cut/miter/shape/drill and dry-fit to released geometry. Received tube butting is not local frame manufacture."
    role: "foreground_manufacturing"
    quantitative_reference: "1kg accepted finished frame; conditional exchanges only where actual"
  - id: join
    name: "Lugged frame alignment, brazing and braze-on completion"
    inclusion: "required"
    inclusion_condition: "Fit actual supplied upper/lower/seat lugs, shell and distinct rear dropouts; align/pin/qualify gaps and braze with actual thermal/filler/flux procedure; add specified bridge/bosses and inspect joints/alignment."
    role: "foreground_manufacturing"
    quantitative_reference: "1kg accepted finished frame; conditional exchanges only where actual"
  - id: finish
    name: "Surface preparation, metal primer and electric-baked enamel"
    inclusion: "required"
    inclusion_condition: "Actual flux removal, compatible conditional blasting, masking/primer/colour enamel/electric baking and conditional clear enamel; verify film/interface cleanliness. Exact chemicals and actual additions per supplier records, no universal duration or recipe."
    role: "foreground_manufacturing"
    quantitative_reference: "1kg accepted finished frame; conditional exchanges only where actual"
  - id: acceptance
    name: "Frame-only geometry/interface acceptance, weighing and dispatch"
    inclusion: "required"
    inclusion_condition: "Record current frame serial/configuration, datum alignment/dropout spacing/thread-seat/braze/finish checks and actual attributable sample/type tests; independently weigh complete finished frame without fork/running gear."
    role: "foreground_manufacturing"
    quantitative_reference: "1kg accepted finished frame; conditional exchanges only where actual"
