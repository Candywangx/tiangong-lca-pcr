allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Attribute actual member/part issue-return-stock and measured utility demand to drawing/size/grade/finish-specific work orders and matched accepted frame count. Include actual rework/rejects and sample-test burden. Different frame sizes/configurations not mixed under one mean M without disclosed stratification."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared operations"
    rule: "Separate operations first. If inseparable, document causal actual cutting/joining/fixture occupancy, sprayed area/bake rack occupancy and inspection/test demand. Reconcile totals and assess alternative drivers; fixed frame setup/inspection not automatically proportional to net frame kg."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste"
    rule: "Separate internal stock/shot reuse, outgoing clean offcuts, brazed/painted rejects, flux/wet-paint residues and genuine co-products. No automatic avoided steel/paint credit or3% assumed scrap factor. Economic allocation only with actual co-product and no causal physical basis, actual price period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted complete output"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Use traceable weighing records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "every accepted finished frame"
      temporal_coverage: "matched manufacturing/acceptance period"
      site_scope: "actual complete frame weighing station"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "calibrated complete frame readings/tare; no fork/running gear/support load/packaging; independent retained-member/filler/finish mass balance"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "drawing/grade/heat/member/butt profile/trim end; received and issued-returned kg; cut/miter geometry; meters; low-alloy offcuts"
      collection_method: "Record each actual exchange separately with identified supplier issues/returns and independent stock/part kg, calibrated utility meters, actual site supplied fuel calorimetry/reference volume, or post-control species sampling/exhaust/time. Record model/drawing/size/grade/finish configuration, work orders, stock/rework, matched same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacturing/acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier grade/profile/part/SDS contents; calibration/sampling/calorimetry uncertainty; stock/accepted count closure"
    - protocol_id: cp_join
      process_id: "join"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "lug/shell/left-right dropout/bridge/boss fit-list and supplier contents; actual kg; socket gap/datum/pin; filler/flux/SDS and thermal procedure; current fuel calorimetry/meter; joint/alignment and actual exhaust samples"
      collection_method: "Record each actual exchange separately with identified supplier issues/returns and independent stock/part kg, calibrated utility meters, actual site supplied fuel calorimetry/reference volume, or post-control species sampling/exhaust/time. Record model/drawing/size/grade/finish configuration, work orders, stock/rework, matched same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacturing/acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier grade/profile/part/SDS contents; calibration/sampling/calorimetry uncertainty; stock/accepted count closure"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "exact media/cleaner/primer/colour/clear SDS and issue-return-stock/film; actual water/meter/electric bake; species/exhaust/time and distinct waste masses"
      collection_method: "Record each actual exchange separately with identified supplier issues/returns and independent stock/part kg, calibrated utility meters, actual site supplied fuel calorimetry/reference volume, or post-control species sampling/exhaust/time. Record model/drawing/size/grade/finish configuration, work orders, stock/rework, matched same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacturing/acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier grade/profile/part/SDS contents; calibration/sampling/calorimetry uncertainty; stock/accepted count closure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "independent atomic exchanges"
      record_type: "foreground_record"
      raw_fields: "serial/drawing/size/complete frame-only inclusion; original geometry/interface/test results and accepted/reject/tested count/period; calibrated net readings/tare and independent finished frame mass balance"
      collection_method: "Record each actual exchange separately with identified supplier issues/returns and independent stock/part kg, calibrated utility meters, actual site supplied fuel calorimetry/reference volume, or post-control species sampling/exhaust/time. Record model/drawing/size/grade/finish configuration, work orders, stock/rework, matched same-configuration accepted count and waste destination."
      unit: "kg; MJ"
      frequency: "per batch/unit/test and full period"
      temporal_coverage: "same configuration manufacturing/acceptance cycle"
      site_scope: "actual manufacturing/test site and declared subcontractors"
      aggregation_rule: "attributable process exchange / accepted units"
      quality_evidence: "supplier grade/profile/part/SDS contents; calibration/sampling/calorimetry uncertainty; stock/accepted count closure"
  calculation_rules:
    - id: normalize_mass
      applies_to: "top_tube; down_tube; seat_tube; head_tube; chainstay; seatstay; cut_power; tube_scrap; upper_lug; lower_lug; seat_lug; bb_shell; left_dropout; right_dropout; brake_bridge; bottle_boss; brazing_rod; brazing_flux; hearth_gas; join_power; brazing_particle_air; fossil_co2_air; blast_media; etch_primer; colour_enamel; clear_enamel; wash_water; finish_power; paint_residue; spent_shot; xylene_air; inspection_power; film"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_weighing
      applies_to: "finished_machine"
      requirement: "Weigh the complete accepted finished frame with all permanently retained specified fittings, filler and dry coating using a calibrated appropriate-capacity instrument and controlled support/fixture tare. Exclude fork/headset/BB cartridge/wheels/rider/test loads/loose accessories/packaging; no frame-plus-fork catalogue mass. Retain serial/geometry/finish state, original readings/date/instrument/calibration/repeats/uncertainty. Independently reconcile received retained tube/part masses, trim/filing losses, retained filler and cured coating against M. Missing physical originals block dataset use."
      evidence: "original complete-frame net weighing and independent retained mass balance"
    - id: quality_members
      applies_to: "prepare; join"
      requirement: "Trace each member grade/heat/shape/wall/butt profile/end mark and received supply route. Preserve sufficient actual qualified thick-end joint length after trimming; use supplier profile and released drawing, no universal butt length/wall/density/strength. Head tube, front triangle and distinct left/right stays not a mixed tube set. Tube-maker seamless/welded/mandrel/heat treatment not presumed local."
      evidence: "reynolds-frame-method; joining-frame-method; butting-frame-method; actual member drawings"
    - id: quality_joining
      applies_to: "join"
      requirement: "Require actual matched tube/lug/shell/dropout geometry, capillary gap, datum/pinning and qualified filler/flux/thermal procedure with traceable temperature/time observations and inspections where required by the released plan. Actual overheating/misalignment/rework recorded. Brass rod identity is not a universal recommendation. Joining-sensitive heat-treated/silver-only grades, TIG wire/flux-cored wire and titanium/stainless not interchangeable. Supplier joining FAQ is grade-specific guidance, not legal certification or numeric factory pass thresholds."
      evidence: "joining-frame-method; mercian-frame-method; current qualified joint procedure/results"
    - id: quality_geometry
      applies_to: "join; acceptance"
      requirement: "Verify actual frame-datum geometry and alignment, head/seat tube and shell axes, rear dropout parallelism/spacing, integral hanger alignment, specified bridge/brake and braze-on positions. Inspect actual shell/head/seat thread/fit interfaces and remove coating intrusions without assuming fitted headset/BB. Current contractual frame-only test plan/results, sampled configuration/count/period/instruments/fixtures/reject attribution required; no imported rider load, fatigue cycles, riding life or whole-cycle compliance claim."
      evidence: "mercian-frame-method; current frame geometry and inspection/test originals"
    - id: quality_finish
      applies_to: "finish"
      requirement: "Trace actual metal etch primer, one colour enamel and optional one clear enamel chemistry/SDS/supplier batches and actual compatibility/cure schedule with cold-worked substrate/braze. Record masking, dry film/adhesion/appearance and interface cleanliness under current specifications. Blasting only actual approved media/thin-wall method; no presumed steel shot, universal blast pressure, coating thickness, four-week painting duration, recipe or environmental superiority. Received solvents inside paint counted once; actual additions/species separately."
      evidence: "mercian-frame-method; actual SDS/cure/masking and film records"
    - id: quality_identity
      applies_to: "all flows"
      requirement: "Actual public property/unit/state retained. Broad bicycle-parts or unfinished/spectacle-frame identity cannot establish exact finished bicycle-frame output. Project-specific2012NGCC gas/density/LHV not frame-maker fuel; flux Volume not powder kg. Brass rod and solvent-based paint qualify one actual formulation/supplied form, not all filler/resin choices. Low-alloy scrap uses actual clean measured offcuts, not3% example. Cast-steel shot/non-ferrous-ore and mixed spent abrasive/non-metal classes remain unresolved, not rewritten."
      evidence: "public flow/property/unit chain and actual supplier qualification"
    - id: quality_release
      applies_to: "elementary"
      requirement: "Only actual post-control particulate mass with unspecified size/air subcompartment, actual fossil CO2 origin/site carbon balance, or actual total xylene CAS1330-20-7 immediate-air species supported by current chemical/SDS/exhaust observations. No obligatory emissions, total VOC substituted as xylene, NOx guessed as NO2, fuel upstream emission as factory release or captured dust as air. Any actual metal/boron/fluoride/size species and actual wastewater/sludge separately identified with correct medium/property and measurements."
      evidence: "original post-control sampling/exhaust/time and current fuel/SDS balances"
    - id: quality_coverage
      applies_to: "dataset"
      requirement: "Close full actual member/part/chemical/meter/stock/test inventory. Add actual separate cable guides, eyelets, braze-on bosses/pins/clamp hardware, cleaners/added solvents/masking tape/decals/clearcoat or other finishes, captured dust, contaminated flux/shot/sludge/filters and packaging when present and not contained. Different grades/left-right parts/paint formulations each separate atomic row and protocol. Preserve measured/calculated/estimated/missing/excluded/not-applicable status and uncertainty, disclose upstream stock/component/transport/support/treatment gaps; no pooled parts or claim of complete cradle-to-gate."
      evidence: "complete actual frame BOM, supplier SDS/contents and stock/meter closure"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Exactly1kg complete accepted finished frame-only output; reference name equals finished_machine name. Candidate blank UUID only with precise registered gap. Require original cp_mass actual M kg and independent retained tube/part/filler/film closure. Formula/schema pass does not establish physical data or scientific approval."
    source_ids: []
  - rule_id: validation_basis
    applies_to: "inventory"
    rule: "Verify stable lowercase row/rule/protocol links, same-size/grade/finish accepted frame count, actual kg/MJ numerator and normalize_mass. Reject frameset/whole-bike/rider/mixed configuration denominators and catalogue/density/project gas conversions."
    source_ids: []
  - rule_id: validation_scope
    applies_to: "dataset"
