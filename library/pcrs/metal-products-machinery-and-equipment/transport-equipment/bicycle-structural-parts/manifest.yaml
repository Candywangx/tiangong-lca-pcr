  semantic_boundary_decision: Manufacture of a new standalone finished diamond
    frame for a nonmotorized bicycle, using identified cold-worked non-stainless
    chrome-moly steel tube members, supplied steel socket lugs/bottom-bracket
    shell/rear dropouts, qualified uncoated copper-zinc filler and formulated
    brazing flux. Scope starts at received manufactured tubes and components,
    includes local cut/trim/miter/fit/alignment and lug brazing, specified
    braze-ons, actual cleaning/surface preparation, spray-applied metal etch
    primer and solvent-borne alkyd colour stove-enamel with actual electric
    baking, conditional clear enamel, final interface/geometry/finish acceptance
    and independent frame-only dispatch. Actual matched grade/butt
    profile/socket/joining/finish qualification and released drawings govern; no
    universal material recipe or Mercian brand specification is mandated.
    Exclude complete bicycles and riding/service outputs, frame-and-fork sets,
    forks/headsets/bottom-bracket cartridges/wheels/brakes/transmission,
    wheelchair components, motorized/e-bike/motorcycle frames,
    aluminium/titanium/carbon/stainless frames,
    suspension/step-through/folding/tandem structures, TIG-welded or lugless
    fillet-only frames, uncoated intermediate-only outputs,
    bought-complete-frame finishing-only routes, repair/restoration and upstream
    tube butting/steelmaking/lug casting. Heat-treated or joining-sensitive
    grades requiring different qualified filler/thermal practice are outside
    this cold-worked brass-lug subroute. Customer complete-bike assembly,
    use/maintenance and end of life excluded. Attributable actual factory
    inspection/type/sample testing included; foreground alone is not full
    cradle-to-gate or proof of riding performance/life. Current worktree
    material scan found no authored bicycle/wheelchair frame method. Related
    complete-cycle/invalid-carriage/parts legacy leaves are empty scaffolds,
    kept read-only. Shared Mercian original used by complete-cycle evidence is
    reusable process evidence, not evidence that whole bicycle and independent
    frame have identical output identity. Distinct material need is
    member-specific butt/trim/heat compatibility, socket-braze capillary and
    dimensional alignment, head/seat/shell/dropout interfaces, retained
    filler/finish mass and frame-only acceptance/net dispatch. Complete-cycle
    rules may reuse this component foreground once scientifically reviewed but
    their whole-wheel/brake/drive output cannot substitute. Not a
    classification-code-only record; do not read other authors unfrozen
    canonical content.
  reference_identity_basis: Initial/refined public candidates are a broad parts
    category with unrelated construction-services comment, unspecified purchased
    bicycle-parts pool, unfinished parts, or surface-finished spectacle-frame
    components; no exact finished coated lug-brazed bicycle-frame identity
    established. Precise row registered; not a database-absence claim. Exact
    frame reference and finished_machine selected name agree, candidate gap
    precisely registered.
  evidence_limitations: Mercian shared official craft original supports hand lug
    brazing/alignment, specified fittings, blasting, etch primer/baked finish
    and final frame interface inspection; does not prove a specific
    grade/filler/fuel/alkyd chemistry or electric bake. Reynolds525 and
    joining/butting originals support cold-worked alloy, grade-specific joining,
    butt-profile trim and separate supplied tube manufacture; actual
    route/formulations/current drawings and measurements define this subset.
    Dates not established; historical grade examples limited, no
    density/UTS/temperature/paint duration/range/fatigue/lifetime or marketing
    environmental claims adopted.
