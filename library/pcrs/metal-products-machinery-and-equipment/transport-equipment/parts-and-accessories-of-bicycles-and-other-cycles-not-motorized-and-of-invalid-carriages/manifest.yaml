review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "The existing PCR ID is retained and its existing methodology upgraded
    in place. The scoped CPC mapping is accepted; scientific approval, translation review and
    publication retain their separately recorded states. Classification rationale: The independently
    supplied finished nonmotorized bicycle frame fits 8714.91; complete bicycles, motorcycle frames
    and raw tubes are separate products. Historical author assessment:
    docs/reviews/pcr149-original-ids-20261127/49942.json."
  reference_identity_basis: Initial/refined public candidates are a broad parts category with
    unrelated construction-services comment, unspecified purchased bicycle-parts pool, unfinished
    parts, or surface-finished spectacle-frame components; no exact finished coated lug-brazed
    bicycle-frame identity established. Precise row registered; not a database-absence claim. Exact
    frame reference and finished_machine selected name agree, candidate gap precisely registered.
  evidence_limitations: Mercian shared official craft original supports hand lug brazing/alignment,
    specified fittings, blasting, etch primer/baked finish and final frame interface inspection;
    does not prove a specific grade/filler/fuel/alkyd chemistry or electric bake. Reynolds525 and
    joining/butting originals support cold-worked alloy, grade-specific joining, butt-profile trim
    and separate supplied tube manufacture; actual route/formulations/current drawings and
    measurements define this subset. Dates not established; historical grade examples limited, no
    density/UTS/temperature/paint duration/range/fatigue/lifetime or marketing environmental claims
    adopted.
