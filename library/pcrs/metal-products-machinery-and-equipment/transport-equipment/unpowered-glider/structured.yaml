      rule: "The foreground begins with actual resin, dry reinforcement/core and independently scoped purchased equipment at plant and ends at complete configured manufacturing acceptance. Include actual mould preparation, measured layup/cure/temperature control, structural bonding, cured trimming/drilling/inspection, conditional finishing, outfitting, rework and performed acceptance work. Vacuum consolidation, oven post-cure, machining coolant, release agent, acetone cleaning and gelcoat are included only when actual controlled route records show them; no autoclave, solvent emission or cure condition is universally mandatory. Expand actual vacuum film, peel ply, breather, abrasives, filters, catalyst, radio/battery/wiring, lubrication, trim ballast, ballast plumbing, packaging, transport and other missing specific exchanges from the full BOM/route before claiming complete foreground coverage. Purchased complete airframe shells would change this local moulding boundary and cannot be counted with their duplicated resin/fibre/cure. Link upstream production and receiving treatment only through matched independent datasets; this document does not establish complete cradle-to-gate coverage. Operational flights, customer tow/winch and maintenance remain outside."
