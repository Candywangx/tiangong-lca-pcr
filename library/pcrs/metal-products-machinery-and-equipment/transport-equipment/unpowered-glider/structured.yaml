allocation_rules:
  - rule_id: allocation_direct
    applies_to: "shared tooling/production"
    rule: "Separate actual aircraft order/configuration and meter identifiable mould/cure/trim/finish/test work first. For shared cure batches use recorded thermal cycle, occupancy and metered demand with demonstrated causal allocation; aircraft count or kg is not universally causal. Preserve total energy/stock, actual rejected trials/rework and accepted denominator, with sensitivity and intermediate records."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "waste and reuse"
    rule: "Record internal dry-stock reuse and solvent recovery separately from actual exports. Use subdivision or demonstrated causal allocation for a real co-product; disclose alternatives and sensitivity if unavailable. No automatic recycling yield, avoided virgin fibre/resin credit or price-based rule. Capture and emission are separate mass destinations."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference product"
      record_type: "controlled complete-unit acceptance weight"
      raw_fields: "configuration; accepted net mass M; aircraft serial; original component/support weights; calibration/tare; dry tanks; installed equipment; independently measured state corrections and mass balance"
      collection_method: "Use controlled acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "each accepted aircraft/configuration change"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original actual calibrated empty-state weighings and independent component balance"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "single chemical/material stock"
      record_type: "stock issue and batch record"
      raw_fields: "single material/SDS/lot/formulation; issues; returns; retained amount; rejects/rework; mix/cure/ply record; accepted count"
      collection_method: "Weigh net actual stock issues/returns and match each approved ply/mix/joint/finish batch; retain supplied chemistry and inclusion. Record measured consumption, cured retention and residues separately. No catalogue resin/fibre fraction or repair mix-ratio proxy."
      unit: "kg"
      frequency: "each lot and reporting period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual attributable stock kg / accepted units of the same configuration"
      quality_evidence: "scale/tare, supplier/SDS, signed batch/ply/cure records and balances"
    - protocol_id: cp_parts
      process_id: "outfit"
      flow_role: "single supplied component"
      record_type: "receipt installed-weight and configuration record"
      raw_fields: "one component/drawing/material/serial/count; supplied net kg; installed kg; included hardware/charges; returns; accepted count"
      collection_method: "Measure actual installed supplied component kg, keeping count/serial for traceability. Reconcile complete modules and split gear/wheel receipts, avoiding included fastener/fluid duplication. Independent component mass checks complete M."
      unit: "kg"
      frequency: "each design/lot and aircraft"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual installed supplied kg / accepted units of the same configuration"
      quality_evidence: "calibrated receipt/installed weight, drawings and inclusion/serial reconciliation"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "single electricity interface"
      record_type: "meter and stage attribution"
      raw_fields: "meter/site/provider/voltage; gross energy kWh; period/batch/cycle/idle/rework; actual accepted count; causal attribution"
      collection_method: "Read calibrated electricity meters at the actual supply/stage interface; retain stage/batch duration and actual sharing evidence. Convert kWh to MJ using1kWh=3.6MJ, preserving imports and explicit supplier gate."
      unit: "MJ"
      frequency: "each batch/period and route change"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual attributed stage MJ / accepted units of the same configuration"
      quality_evidence: "meter calibration, invoices/cycles and causal balance"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "single physical waste stream"
      record_type: "segregated receiver shipment"
      raw_fields: "one waste chemistry/cure/contamination; net kg/tare; source process; reuse/recovery; receiver route; accepted count"
      collection_method: "Weigh each separately identified actual exported stream excluding container and retain receiver tickets and state analysis. Do not merge GFRP/CFRP, cured/uncured material, spent solvent and captured dust."
      unit: "kg"
      frequency: "each shipment and period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual exported net waste kg / accepted units of the same configuration"
      quality_evidence: "scale/tare, analytical and receiver/source balance"
    - protocol_id: cp_emission
      process_id: "join"
      flow_role: "single residual atmospheric substance"
      record_type: "sampled air release"
      raw_fields: "substance/CAS/particle fraction; air submedium; post-control sample concentration/flow/time; limits/uncertainty; actual accepted count"
      collection_method: "Quantify actual post-control particulate or separately acetone mass with compound/medium-specific measurements; for acetone a documented closed solvent balance may support quantity if recovery/residue/retention are resolved. Retain uncertainty and distinguish absent, not measured and below detection; none is automatic zero."
      unit: "kg"
      frequency: "representative actual route/control period"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling/lab calibration, operating duration and substance balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "complete glider configuration"
      record_type: "controlled as-built acceptance"
      raw_fields: "model/serial; full wing/winglet/tail configuration; complete BOM/route revision; equipment/ballast tanks; make-or-buy; actual tests; delivery state"
      collection_method: "Trace current approved as-built BOM, layup/cure/bond procedures, deviations and performed tests. Qualify complete delivered equipment and net empty state; retain independently measured state corrections rather than source catalogue weights."
      unit: "kg"
      frequency: "each aircraft/configuration and route change"
      temporal_coverage: "declared representative current production period"
      site_scope: "named actual manufacturing site"
      aggregation_rule: "qualifiers accompany each same-configuration accepted unit"
      quality_evidence: "signed drawing/BOM/procedure/inspection and physical-state records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_conversion
      applies_to: "order records"
      rule: "For one actual same configuration, attribute measured period totals to accepted aircraft through documented causal records and compute q_item from attributed exchange / accepted aircraft. Keep raw totals, rejects/rework, accepted count and intermediate values. Do not pool different wing/equipment configurations without an explicit physical model."
      inputs:
        - cp_stock
        - cp_parts
        - cp_energy
        - cp_mass
      output: "q_item"
      source_ids: []
  data_quality_requirements:
    - id: mass_provenance
      applies_to: "cp_mass"
      requirement: "Controlled acceptance M must originate in current actual calibrated empty-aircraft weighing for the same complete serial/configuration, preserving original readings, component/support identification, level/support conditions, calibration, zero, auxiliary support tare and uncertainty. The actual method may sum separately weighed distinct complete parts or use a demonstrated complete supported-aircraft weighing method; reconcile the same complete installed configuration and all independent component masses. No fictional whole-aircraft platform scale is prescribed. A measured support reaction reported as force requires the actual metrological force-to-mass basis, not an assumed universal gravity constant. The retained LS8 manual p.2-1 is historical physical-method evidence, not current model records or a universal new-aircraft acceptance protocol. Without actual originals and closure retain the measurement/scientific gap; do not claim observed physically complete data."
      evidence: "dg-ls8-historical; cp_mass; cp_parts; cp_configuration"
    - id: net_empty_configuration
      applies_to: "accepted glider"
      requirement: "M includes the accepted declared complete wings/winglets/tail, structural airframe, permanently installed controls/gear/canopy/seat/harness/instruments and actually delivered permanent non-propulsion equipment and retained working charges once. Declare original as-weighed state and separately measured signed corrections. Exclude pilot, removable service payload/parachute unless explicitly part of the permanent delivered configuration, water ballast, temporary balancing/test loads, supports, lifting equipment and packaging. Dry ballast tank hardware remains. Installed trim weights or cockpit battery must be individually identified and weighed if included. Do not use maximum takeoff mass, catalog empty mass, legal limits, a guessed resin fraction or ballast-filled weight as M."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: route_and_balance
      applies_to: "all exchanges"
      requirement: "The current approved full BOM, ply/core architecture, actual supplied chemistry and production travellers determine exact quantities and conditions. Check resin/hardener and adhesive mixture inclusion, reaction/retention and GFRP/CFRP stock-to-product-to-waste balances. Capture is not air emission. Add all actual missing specific equipment, vacuum consumables, charge, cleaning, packaging, test-service, transport and receiver exchanges before completeness claims; validate current acceptance criteria, rework, limits, uncertainty and supply links. No universal yield, resin ratio, cure cycle, core density, equipment weight or service life is set."
      evidence: "cp_stock; cp_parts; cp_energy; cp_waste; cp_emission; cp_configuration"
    - id: source_limits
      applies_to: "external evidence"
      requirement: "LS8 retained manual (December2009 baseline, later amendments through June2016) supplies historical system/physical-weighing context only. Its repair resin/fabric/core and finishing lists are not a new-production BOM, cure recipe, density conversion, current legal approval or lifetime mandate. Schempp-Hirth October2018 MINIMOA pp.04/07 supplies a separate historical carbon spar/production example, without proving this glider’s exact formulation, core chemistry or process conditions. Current plant qualification, weighing originals and complete configuration remain independent scientific-review requirements."
      evidence: "dg-ls8-historical; schempp-minimoa-2018"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Verify complete unpowered rigid-wing configuration, positive physically generated M kg and independent mass_provenance/net_empty_configuration. Reference product must equal finished_glider selected flow; a broader product UUID does not establish exact configuration or model weight."
    source_ids: []
  - rule_id: validation_route
    applies_to: "all processes"
    rule: "Check actual wet layup/core/cure/bond/finish qualification and performed trimming/outfit/tests, with stage meter and stock/rework/waste balances. No repair prescription substituted for current new-production evidence; purchased modules and internal stocks must not duplicate."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all flow rows"
    rule: "Verify actual type/substance, reference property and unit group, state/concentration/precursor, supply gate and official bilingual name. Bare glass fibre is not woven fabric; wafer-production acetone is not automatically cleaning supply; non-cellular plastic is not PVC foam; generic release agent is not demonstrated PVA solution. Indoor/soil/upper-air acetone is not immediate unspecified outdoor air. Keep unmatched rows unresolved by exact row_id; do not change public properties."
    source_ids: []
