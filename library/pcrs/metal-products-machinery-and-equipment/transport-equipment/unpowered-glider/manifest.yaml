    - row_id: acetone_cleaner
      reason_code: identity_not_established
      explanation: Acetone product d5d65ffc specifies wafer-production route; it is
        not established for the actual cleaning supply. Elementary acetone
        emissions are not a purchased solvent product.
    - row_id: gfrp_offcut
      reason_code: identity_not_established
      explanation: Bounded waste-composite search returns product/recycled-fibre/wood
        candidates, not the specific actual cured GFRP manufacturing waste
        stream.
    - row_id: cfrp_offcut
      reason_code: identity_not_established
      explanation: Recovered carbon-fibre product does not establish the actual cured
        carbon-epoxy laminate waste identity.
    - row_id: mixed_epoxy_residue
      reason_code: identity_not_established
      explanation: Search results do not identify actual mixed uncured lamination
        residue; ethylene oxide and raw epoxy product identities are not
        equivalent.
    - row_id: spent_acetone
      reason_code: identity_not_established
      explanation: Acetone product/5mol/L laboratory solution candidates do not
        identify the spent cleaning waste with actual resin contamination.
  unresolved:
    evidence_needs:
      - Current full aircraft BOM/model/wing/permanent-equipment configuration,
        actual supplied chemistry and approved wet-layup/core/cure/bond/finish
        factory procedures; historical repair specifications are not a
        production recipe.
      - Current calibrated actual empty-aircraft/component/support weight
        originals, tare/physical-state corrections and independent complete
        configuration mass balance establishing positive net M.
      - Expand all actual additional specific equipment/chemicals/vacuum
        consumables/charges/test-services/packaging/transport/receiver exchanges
        and matched links before physical-completeness claims; independent
        scientific review remains pending.
