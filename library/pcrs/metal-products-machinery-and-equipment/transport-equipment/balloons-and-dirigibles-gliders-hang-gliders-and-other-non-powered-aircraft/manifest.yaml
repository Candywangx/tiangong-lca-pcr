review_metadata:
  semantic_boundary_decision: "The existing PCR ID is retained and its existing methodology upgraded
    in place. The scoped CPC mapping is accepted; scientific approval, translation review and
    publication retain their separately recorded states. Classification rationale: The complete
    unpowered rigid-wing glider fits 8801; powered and unmanned aircraft are excluded. Historical
    author assessment: docs/reviews/pcr149-original-ids-20261127/49610.json."
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
    - row_id: hardener
      reason_code: identity_not_established
      explanation: Search candidates do not establish the actual single amine hardener formulation,
        constituent concentration and production qualification; a generic resin or pure amine is not
        equivalent.
    - row_id: pvc_core
      reason_code: identity_not_established
      explanation: Generic Foamed Plastic candidate has non-cellular classification and no PVC
        chemistry/state identity; the actual cellular PVC core identity remains unresolved.
    - row_id: pva_release
      reason_code: identity_not_established
      explanation: Public Releasing agent describes an emulsified surfactant product without establishing
        aqueous PVA chemistry/concentration; no forced match.
    - row_id: epoxy_adhesive
      reason_code: identity_not_established
      explanation: Solvent-based glue candidates do not establish this actual filled epoxy structural
        bonding formulation, concentration and supplied mix state.
    - row_id: canopy
      reason_code: identity_not_established
      explanation: Returned acrylic varnish/textile and polymer stock do not identify a complete framed
        canopy. Actual transparent material and frame scope require supplier evidence.
    - row_id: landing_gear
      reason_code: identity_not_established
      explanation: Semi-trailer landing-gear candidate is not glider gear. Record whether wheel/brake are
        included; this split module excludes separately received wheel.
    - row_id: wheel
      reason_code: identity_not_established
      explanation: Bounded public searches do not establish the particular supplied aircraft component
        design, completeness and approved material state; actual supplier/BOM evidence and a
