  unresolved:
    evidence_needs:
      - Current full aircraft BOM/model/wing/permanent-equipment configuration, actual supplied
        chemistry and approved wet-layup/core/cure/bond/finish factory procedures; historical repair
        specifications are not a production recipe.
      - Current calibrated actual empty-aircraft/component/support weight originals,
        tare/physical-state corrections and independent complete configuration mass balance
        establishing positive net M.
      - Expand all actual additional specific equipment/chemicals/vacuum
        consumables/charges/test-services/packaging/transport/receiver exchanges and matched links
        before physical-completeness claims; independent scientific review remains pending.
