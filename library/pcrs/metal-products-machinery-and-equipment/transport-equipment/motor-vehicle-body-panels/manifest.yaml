    - row_id: "finished_panel"
      flow: "Accepted unassembled unpainted cold-stamped steel body panel"
      reason: "Public ee49c265-7b54-4592-af6c-764a7c7e0184 covers parts/accessories for motor-vehicle bodies, not one isolated accepted unassembled unpainted cold-stamped steel panel. Keep exact configured atomic output registered; no public property rewritten or database-wide absence claimed."
  unresolved_quantity_ranges:
    - "No actual accepted panel M, stock/scrap yield, lubricant/cleaner demand, utility or empirical tolerance range obtained; actual same-configuration calibrated weighing and factory records required."
  evidence_limitations:
    - "BMW manufacturer pages establish process/boundary context only, not current actual part data; two pages are one publisher, not independent manufacturer corroboration."
    - "AHSS industry guidance is not low-carbon-steel numerical evidence; no load, temperature, lifetime or obligatory lubricant recipe transferred."
    - "Actual controlled part drawing, grade/state/SDS, per-panel net weighing, production quantity and factory acceptance originals remain prerequisites."
    - "Operating receipt-to-acceptance foreground excludes long-lived capital infrastructure and is not complete cradle-to-gate without verified compatible upstream links; scientific review pending."
