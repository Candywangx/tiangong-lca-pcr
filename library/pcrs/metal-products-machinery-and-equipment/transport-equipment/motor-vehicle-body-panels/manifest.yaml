review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "Existing material bodies-for-motor-vehicles covers assembled bodies and expressly excludes loose body parts/accessories. This record covers only single unassembled unpainted bare low-carbon steel cold-stamped panels; configured shape/holes, supplied-blank containment, trim-scrap separation and physical net-part weighing require distinct methodology beyond sheet material or assembled-body PCRs. Old 49231 leaf remains read-only empty scaffold; no retired identity or mapping promoted."
  unresolved_flow_identities:
    - row_id: "steel_sheet"
      flow: "Uncoated cold-rolled deep-drawing steel sheet"
      reason: "Public b28b440d-64c9-45d2-b8e0-a9f92a9bb067 English Cold Rolled Plate and official Chinese alloy-steel rod name conflict; composition qualifiers also include alloy steels. Public 13082a6a-e820-45ec-89f5-3c2c3650495b has steel/silver bilingual conflict and further-worked alloy-steel classification. Neither establishes declared uncoated low-carbon deep-drawing sheet identity. Mass is not the rejection reason."
    - row_id: "purchased_blank"
      flow: "Uncoated cold-rolled steel automotive-panel blank"
      reason: "Public sheet/plate and cold-formed shape candidates do not verify externally supplied drawing-specific uncoated automotive-panel blank shape/completeness. Internally transferred blanks are not boundary inputs."
    - row_id: "stamping_oil"
      flow: "Mineral-oil-based stamping lubricant"
      reason: "Direct public b6d54639-2da8-49b3-89d2-e14324bb14c8 is Hot rolling oil, not cold stamping formulation. Actual mineral-oil lubricant SDS and supply formulation remain unverified."
    - row_id: "blanking_steel_scrap"
      flow: "Low-carbon steel stamping offcut waste"
      reason: "Public 6cb5e364-ba39-4009-8b40-a76fdc88bc42 is a Product flow after pretreatment/melting/sorting, not this measured untreated steel offcut Waste flow leaving stamping."
    - row_id: "trimming_steel_scrap"
      flow: "Low-carbon steel stamping offcut waste"
      reason: "Public 6cb5e364-ba39-4009-8b40-a76fdc88bc42 is a Product flow after pretreatment/melting/sorting, not this measured untreated trim offcut Waste flow."
    - row_id: "spent_stamping_oil"
      flow: "Spent mineral stamping-oil waste"
      reason: "Actual public candidates do not establish the exact Spent mineral stamping-oil waste chemistry, supply/processing state and reference property together; keep concrete row unresolved. No database-wide absence claimed."
    - row_id: "sodium_carbonate"
      flow: "Sodium carbonate powder"
      reason: "Public 6827e314-666a-4786-ac60-00770c61678b and 5462c2da-d3dd-41f0-a78f-51024d2d1a69 are Mass/CAS497-19-8 but specify hydrometallurgical recycling route, not established actual purchased cleaning ingredient route/state. Basic CAS identity alone is insufficient."
    - row_id: "isopropanol"
      flow: "Anhydrous isopropanol cleaning solvent"
      reason: "Public c70f618b-5cdc-4513-b01b-ff7d03426485 specifies optical-assembly route and 70% rubbing-alcohol/disinfectant mixture comment, not verified anhydrous industrial cleaning solvent."
    - row_id: "cleaning_wipe"
      flow: "Nonwoven polyester cleaning wipe"
      reason: "Public 5ac0c411-47ce-40ed-8ce1-9aaf9c351ca4 is textile substrate rather than verified finished polyester cleaning wipe."
    - row_id: "cleaning_effluent"
      flow: "Aqueous oily steel-panel cleaning wastewater"
      reason: "Actual public candidates do not establish the exact Aqueous oily steel-panel cleaning wastewater chemistry, supply/processing state and reference property together; keep concrete row unresolved. No database-wide absence claimed."
    - row_id: "spent_wipe"
      flow: "Isopropanol-contaminated polyester wipe waste"
      reason: "Actual public candidates do not establish the exact Isopropanol-contaminated polyester wipe waste chemistry, supply/processing state and reference property together; keep concrete row unresolved. No database-wide absence claimed."
    - row_id: "carton"
      flow: "Corrugated cardboard box"
      reason: "Public 12d5d744-7725-4dbc-b102-43c80547f777 is unspecified folding paperboard box, not verified corrugated-board shipping box supply state."
    - row_id: "blanking_electricity"
      flow: "Factory-intake alternating-current electricity"
      reason: "Public AC candidates specify voltage or generation/supply route; actual panel factory intake/provider not yet established. Preserve energy/MJ and explicit metered conversion without choosing an unsupported supply identity."
