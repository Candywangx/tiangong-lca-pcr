measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: mass_record_provenance
    applies_to: "cp_mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Here complete unit means one finished single panel, not a vehicle. Physically weigh each accepted same-part/revision/handedness panel on a suitable calibrated scale; record scale readings, measured fixture tare, oil/cleaning state, operator/date, uncertainty and positive net M, linked to drawing and release. Batch quantity records require actual same-configuration count and traceable per-panel measurement distribution; no assumed average part weight. Weighing records must be reconciled with stock, scrap, rejected units and measured residual oil without treating oil mass as steel yield."
  - id: energy_units
    applies_to: "each electricity row"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Use verified energy unit-group conversion 1 kWh = 3.6 MJ. Record actual supply voltage/provider, press/cleaning/inspection meter boundaries and shared active/idle load. Press rated force, motor rating and nominal strokes are not electricity measurements."
