allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared utilities and tooling occupation"
    rule: "Directly attribute actual net issues, meters and stamping/cleaning/acceptance jobs including rework. For inseparable utilities use measured causal press occupation, actual active/idle load or another evidenced physical driver: share = order driver / sum of covered order drivers. Retain period and full denominator; panel counts, die tonnage or catalogue area alone are not default drivers."
    source_ids: []
  - rule_id: allocation_trials
    applies_to: "tool qualification and accepted production"
    rule: "Separate independent prototype/R&D from production. Production die tryout and destructive checks must be attributed to actual covered accepted order when causally applicable; destroyed/rejected trial panels do not enter accepted output. Record actual reuse/qualification scope and sensitivity, never an assumed die lifetime or fixed output count."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "offcuts, rejects and rework"
    rule: "Keep blanking skeleton and trimming offcuts distinct and count each physical transfer once. Attribute rework to accepted output. Determine actual waste versus co-product and destination; steel recyclability does not justify avoided-primary-steel or substitution credits. Any co-product allocation needs actual causal/economic originals and sensitivity."
    source_ids: []
