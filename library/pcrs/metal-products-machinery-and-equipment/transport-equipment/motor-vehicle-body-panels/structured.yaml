  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_mass
      applies_to: "cp_mass"
      requirement: "Implement mass_record_provenance using actual same-part/revision/handedness physical panel weighing with positive M kg, measured tare and recorded residual oil. No dimensional density, catalogue weight, gross rack load or assumed scrap ratio substitutes. Missing actual weighing originals requires scientific/data review."
      evidence: "actual scale/calibration/drawing/release originals"
    - id: quality_atomic
      applies_to: "every exchange"
      requirement: "Verify one physical or chemical identity, grade/concentration/processing/supply state and original reference property/unit. Uncoated low-carbon sheet is not AHSS, hot-rolling oil is not cold-stamping lubricant, powder sodium carbonate is not formulated wash, and anhydrous IPA is not disinfectant. Keep precise unresolved rows rather than substituting broad identities."
      evidence: "actual supplier drawings/spec/SDS and verified public records"
    - id: quality_acceptance
      applies_to: "cp_acceptance"
      requirement: "Use actual controlled drawing and calibrated checking fixture/scan, shape, hole location, edge, burr, surface, split/wrinkle/springback criteria and signed release. Record actual failed pieces and rework. Manufacturer camera inspection is context, not a mandated sensor or invented universal tolerance or crash approval."
      evidence: "actual drawing, inspection/metrology and release reports"
    - id: quality_balance
      applies_to: "steel, oil, solvent, water and electricity"
      requirement: "Reconcile period net stocks, incorporation, accepted/rejected panels, scrap and returns. Keep actual residual oil separate from steel yield. Distinguish technical process-water supply, treatment-bound wastewater and environmental release. IPA-air needs species-specific measured emission or closed balance accounting solvent in wiped waste/recovery, immediate air/unspecified; issue alone is not release. Add every actual heat/drying carrier with evidenced unit conversion; no mandatory emission inferred."
      evidence: "actual stock/spec/SDS balances, meters and transfers"
    - id: quality_coverage
      applies_to: "dataset/upstream coverage"
      requirement: "Separate measured/calculated/missing and demonstrated not_applicable. Audit actual complete process map, exchanges absent from candidate cards, supplier-contained blanking, capital exclusion, allocation and uncertainty. Compatible verified upstream links are necessary for complete cradle-to-gate claims. Finite measurement checking does not establish actual factory evidence or scientific approval."
      evidence: "actual process map, originals and transparent gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference/output"
    rule: "Require current actual positive M kg and cp_mass. Exact reference name equals finished_panel; empty UUID must register that exact row in unresolved_flow_identities. One accepted panel only; no rack, packaging, tool, scrap or rejected mass."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all rows and protocols"
    rule: "Verify identical ordered lower-case row/rule/protocol IDs and actual projection references in both languages. q_item is per accepted finished unit; M is kg; use explicit normalize_mass and identical same-configuration counts. Never relabel public number/area/energy properties as Mass."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "process map and exchanges"
    rule: "Verify received blank versus own blanking containment, integrated-die resource counting, distinct blanking/trim scrap, actual lubricant/cleaning chemistry, residual oil and evidenced emission. Candidate cards alone do not establish factory completeness; missing actual records or uncertain applicability requires review."
    source_ids: []
  - rule_id: validate_use
    applies_to: "dataset use"
    rule: "Disclose actual drawing/configuration, unassembled bare delivery state, manufacturing gate, mass origins, unresolved identities, gaps and upstream compatibility. Equal kg is not equal fit, corrosion protection, crash performance or lifetime. Candidate is not published or methodologically approved."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset after actual data completion and review"
  downstream_use: "Specified single body-panel manufacture input into a separately bounded assembled-body/vehicle model"
  allowed_use: "Compatible part/configuration and gate manufacturing comparison per kg, with actual mass/delivery state and upstream links disclosed"
  excluded_use: "Exclude assembled body shells, body-in-white, welded/bonded multi-panel closures, complete doors/vehicles, trailers and containers; aluminium/composite/coated or galvanized sheet, AHSS/hot-stamped panels, hydroformed/roll-formed and undeclared cutting routes, repair/remanufacturing, vehicle assembly/painting, transport/use/crash services and end of life. No welding, electrocoating, phosphating or paint cure is presumed inside this bare single-panel gate."
  required_metadata: "manufacturer/site/period; part number/revision/handedness, controlled drawing and actual shape/holes/edges; steel grade/heat/thickness and uncoated substrate state; coil-versus-received-blank supply completeness; press/die and actual cold forming/cutting sequence; cleaning recipe/SDS and residual oil condition; accepted dimensional/surface checks and rejection/rework; actual positive same-configuration calibrated net mass M kg, scale/tare/calibration/uncertainty and release; actual stock/scrap/solvent/water/electricity records and allocation; packaging/rack exclusion, upstream compatibility and data gaps"
  required_quality_disclosure: "Measured/calculated/missing status, weighing/acceptance originals, identities/gaps, steel/oil/solvent balances, allocation/capital exclusion and uncertainty; candidate and scientific review pending"
  update_trigger: "Actual part/revision/handedness, grade/coating/thickness, supply blank, forming/cutting/cleaning route, weighing/acceptance, site or upstream dataset changes"
