allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all_processes"
    rule: "First subdivide actual line/process meters, job cards, stock and waste records by caliper model/configuration. For shared machinery allocate using documented causal operation time with actual load/setup/idle evidence; washing use actual bath cycles/load evidence. A simple output mass share is allowed only with a demonstrated physical relationship and sensitivity disclosure. No unsupported universal allocation fraction."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "rejects and chips"
    rule: "Keep actual reject/rework burdens in attributable campaign inputs divided by accepted units. Declare whether exported metal chips are waste or a saleable co-product based on actual contracts/state. Avoid allocating both a waste treatment credit and a saleable output benefit to the same chip mass; no automatic avoided-primary-aluminium credit. Document chosen allocation rationale, prices/time basis where applicable and sensitivity; science review remains pending."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "complete configured caliper"
      record_type: "calibrated complete-unit net weighing"
      raw_fields: "model; configuration; serial; accepted net mass M; kg; zero/tare; raw readings; installed piston/seal/hardware kg; retained film and excluded fixtures/packaging; accepted count"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each unit or controlled representative same-configuration lot with actual individual measurements"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original calibrated scale readings, zero/tare and signed complete configuration acceptance"
    - protocol_id: cp_stock
      process_id: "all_processes"
      flow_role: "blank and process inputs"
      record_type: "actual stock issue/return and consumption"
      raw_fields: "lot; named compound/formulation/grade; blank kg; issue/return kg; stock change; concentration; actual operation; retained/removed liquid; accepted count"
      collection_method: "Measure actual attributable net stock input including rejects/rework, with receipts, returns and stock reconciliation; distinguish supplied emulsion from locally mixed constituents and fresh makeup from circulation. Record actual stage and concentration; conditional inputs require performed operation evidence."
      unit: "kg"
      frequency: "each issue/return and actual campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "actual attributable input kg / accepted units of the same configuration"
      quality_evidence: "calibrated weighing/stock balance, SDS and operation records"
    - protocol_id: cp_parts
      process_id: "assembly"
      flow_role: "finished supplied components"
      record_type: "component receipts and installed-mass reconciliation"
      raw_fields: "drawing; supplier; material/compound/coating; actual component kg; installed count; included parts/prefill; returns/rejects; accepted count"
      collection_method: "Independently weigh one design of separately received component in kg; counts provide traceability rather than an invented piece mass. Reconcile installed component net mass and full BOM against complete M; net consumption includes attributable rejects and rework."
      unit: "kg"
      frequency: "each lot/configuration and campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "actual attributable component kg / accepted units of the same configuration"
      quality_evidence: "drawing/certified compound, supplier and installed component weight records"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "stage electricity"
      record_type: "actual user-side electrical meter"
      raw_fields: "stage; meter; kWh; actual period; provider/voltage/geography; shared-load allocation; accepted count"
      collection_method: "Read calibrated actual user-interface stage meters and attribute actual idle, drying, test and rework loads using documented causal records. Convert kWh to MJ using 3.6 MJ/kWh before unit normalization; rated machine power is not measured consumption."
      unit: "MJ"
      frequency: "actual representative campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "actual attributable electricity MJ / accepted units of the same configuration"
      quality_evidence: "calibration/original meter records, causal load and supply identity"
    - protocol_id: cp_waste
      process_id: "all_processes"
      flow_role: "actual exported waste"
      record_type: "export weighing, composition and receiver records"
      raw_fields: "specific waste; wet/dry kg; entrained liquid; analysis; receiver; export/return/reuse; accepted count"
      collection_method: "Measure each actual exported named waste separately and retain composition and receiver; reconcile metal/liquid splits and internal recovery without double counting. Waste treatment/discharge must use the actual linked receiver, not an assumed untreated elementary release."
      unit: "kg"
      frequency: "each export and actual campaign"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "actual exported waste kg / accepted units of the same configuration"
      quality_evidence: "calibrated weights, composition, waste manifests and receiver"
    - protocol_id: cp_emission
      process_id: "cleaning"
      flow_role: "conditional IPA air release"
      record_type: "compound-specific sampling or closed solvent balance"
      raw_fields: "CAS; outdoor air submedium; concentration; actual airflow/time; recovery/residue/retention; detection limit/uncertainty; accepted count"
      collection_method: "Quantify actual residual release by matched sampling or a documented closed IPA issue/recovery/residue/retention balance. Preserve unmeasured and below-detection states; no generic VOC factor or assumption of complete evaporation."
      unit: "kg"
      frequency: "actual representative cleaning/control period"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "actual released kg / accepted units of the same configuration"
      quality_evidence: "sampling/calibration/lab records and solvent balance"
    - protocol_id: cp_configuration
      process_id: "all_processes"
      flow_role: "configured accepted caliper"
      record_type: "controlled as-built and acceptance records"
      raw_fields: "model/drawing/serial; piston/bore/count; body/piston grade; seal compound; coating; full BOM/gates; actual dimensional/cleanliness/leak/function tests and disposition; drained delivery state"
      collection_method: "Trace controlled drawings, full supplier inclusions and actual qualified operation plan. Record actual acceptance tests, thresholds, calibration and dispositions approved for this specific part; manufacturer examples prescribe no universal test pressures or limits. Declare optional hardware and delivered net state."
      unit: "kg"
      frequency: "each model/lot/configuration change"
      temporal_coverage: "actual declared representative production period"
      site_scope: "declared plant and attributable stage/supply gates"
      aggregation_rule: "qualifiers accompany each accepted same-configuration unit"
      quality_evidence: "signed drawings/BOM, certified materials and factory acceptance"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_conversion
      applies_to: "period records"
      rule: "Attribute actual stock/meter/export totals to one accepted configuration using current causal records; divide attributable exchange totals by the actual accepted count to obtain q_item. Preserve reject/rework burdens in the numerator. Different bores/piston counts/coatings/seal compounds must not be silently pooled."
      inputs:
        - cp_stock
        - cp_parts
        - cp_energy
        - cp_mass
      output: "q_item"
      source_ids: []
  data_quality_requirements:
    - id: mass_provenance
      applies_to: "cp_mass"
      requirement: "Positive M requires current actual calibrated complete net weighing: scale capacity/resolution/calibration, original readings, tare and signed configuration/serial. Independently weigh machined body and installed component designs, reconcile their mass plus actual retained lubricant/film against complete M. Do not use vehicle mass, brake-kit catalogue weight or generic item-to-kg factor."
      evidence: "cp_mass; cp_parts; cp_configuration"
    - id: net_configuration
      applies_to: "finished_caliper"
      requirement: "M includes actual permanently installed body, pistons, seals and declared hardware once, plus measured retained film/lubricant in the drained delivered state. Exclude rotor, pads, vehicle mounting hardware not supplied as part of this caliper, loose spares, temporary test fittings and shipping box. Deliberate wet prefill changes the reference state; independently reconcile fluid retained/exported without duplicate circulation or premixed-constituent inputs."
      evidence: "cp_mass; cp_stock; cp_configuration"
    - id: completeness_balance
      applies_to: "all exchanges"
      requirement: "Expand full actual BOM and operation records before a complete factory claim: extra plugs, fittings, connectors, seals, fasteners, packaging, actual bath additives, coating operations and compressed-air/heat utility each need a specific exchange if present. Reconcile blank-to-body/chips/rejects, components-to-installed/returns and all wet-fluid balances; identify receiver/upstream/transport links and document cut-offs, uncertainty and allocation sensitivity. No default material yield or universal chemistry/emission."
      evidence: "cp_stock; cp_parts; cp_waste; cp_energy; cp_emission"
    - id: source_limits
      applies_to: "external sources"
      requirement: "Akebono describes automotive opposed-piston architecture, not actual grades/compounds, manufacturing quantities or acceptance thresholds. Brembo2023 is a historical plant-stage statement only; no capacity, investment or employment number is an inventory factor. Publishers are independent of each other but neither document measures this configured foreground. Current actual certified material, factory records and independent scientific review remain necessary."
      evidence: "akebono-opposed-caliper; akebono-automotive-brakes; brembo-escobedo-2023"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference_flow"
    rule: "Verify exact finished_caliper name against reference product, complete cast-body opposed-piston road-car configuration, positive physical M kg and original independent component/mass reconciliation. Candidate empty reference UUID is a declared identity gap, not licence to reuse a broad/incompatible brake or material flow."
    source_ids: []
  - rule_id: validation_process
    applies_to: "all_processes"
    rule: "Verify actual machining, washing, assembly and accepted tests against controlled job/configuration records, including reject/rework and conditional operations. Certified aluminium piston and EPDM compound must be demonstrated; actual alternatives need a supported route expansion. Source product descriptions do not establish current lawful fitment or safety approval."
    source_ids:
      - akebono-opposed-caliper
      - akebono-automotive-brakes
      - brembo-escobedo-2023
  - rule_id: validation_identity
    applies_to: "flow rows"
    rule: "Check public state100 originals, type, actual reference-property/group/unit, route, composition and medium/submedium. Preserve public Number/Volume/Energy properties rather than rewrite Mass. Purchased water, collected effluent and natural water are distinct; outdoor immediate IPA is neither purchased cleaner nor indoor/long-term release. Register exact unresolved row_ids and official Chinese names."
    source_ids: []
  - rule_id: validation_claims
    applies_to: "claims"
    rule: "Mechanical check pass does not establish actual measurements, full cradle-to-gate completeness, scientific approval, stopping performance or lifetime. Disclose reference/component identity gaps, actual missing BOM/utility/upstream links and source/measurement limits."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured road-car cast-aluminium fixed hydraulic caliper machining/assembly manufacturing foreground; heading does not assert publication"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same configured complete drained caliper manufacture normalized by actual M, with matching body/component upstream gates and actual operations"
  excluded_use: "Road braking services or wear emissions, stopping-distance/life comparisons, other brake architectures, repair/remanufacturing and regulatory approval"
  required_metadata: "Drawing/model/serial/lot, fitment/handedness, piston/bore/count, certified body/piston alloy/seal compound/coating, complete BOM/gates, actual operation/test/disposition records, net M kg originals and independent component/fluid balance, exclusions/accessories, site/period/provider, allocation and upstream/receiver links"
  required_quality_disclosure: "Identity/BOM/operation/measurement/link gaps; actual rejects/rework/returns/recovery; source historic applicability; detection/uncertainty/cut-off and allocation sensitivity"
  update_trigger: "Body/piston/seal/coating, hydraulic geometry/fitment, supply/local operation gates, test/drain state, weighing configuration, plant/period/provider or packaging changes"
