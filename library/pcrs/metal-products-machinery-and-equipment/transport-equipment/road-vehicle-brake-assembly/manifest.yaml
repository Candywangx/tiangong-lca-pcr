review_metadata:
  semantic_boundary_decision: Create a narrower road-car fixed opposed-piston
    hydraulic caliper machining/assembly PCR with monobloc cast-aluminium blank,
    certified aluminium pistons and EPDM seals, complete drained acceptance
    reference. These are route restrictions requiring actual foreground
    certification, not universal industry recipes. Existing material/metal stock
    PCRs represent upstream materials, not configured caliper machining, seal
    integration, leak acceptance or net completeness. Exclude broader49129
    accessories, floating/drum/parking/motorcycle/rail/aircraft and
    use/remanufacturing. Old scaffold is read-only and no mapping is accepted.
  scientific_review: pending independent methodology review
  unresolved_flow_identities:
    - row_id: body_blank
      reason_code: identity_not_established
      explanation: Casting c6dddd18 is general iron/copper/aluminium casting and does
        not establish this alloy, monobloc caliper
        casting/heat-treatment/surface state; finished wheel hub and unwrought
        alloy cannot substitute the shaped blank.
    - row_id: wash_carbonate
      reason_code: identity_not_established
      explanation: Public carbonate5462c2da/6827e314/1a78f9db explicitly uses
        hydrometallurgical recycling route;2099dae8 specifies95% natural-alkali
        processing and conflicting organic-acid classification. Actual anhydrous
        reagent supplier route/assay is not established, so keep blank rather
        than assign pure Mass to a95% product.
    - row_id: piston
      reason_code: identity_not_established
      explanation: Bounded public searches have not established this specific physical
        component/formulation, reference property and supply/waste state. Verify
