      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report the metered volume and the reference temperature and pressure; convert supplier-normalized volumes only with the documented supplier or meter convention."
  - id: solution_active_mass
