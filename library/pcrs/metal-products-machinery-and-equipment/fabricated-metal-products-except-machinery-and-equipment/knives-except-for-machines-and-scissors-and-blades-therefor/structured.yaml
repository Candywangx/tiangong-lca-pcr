allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared lines, furnaces, finishing equipment, and assembly"
    rule: "Subdivide by product, batch, and process and use directly metered or time-resolved records before applying allocation."
    source_ids: []
  - rule_id: allocation_physical_fallback
    applies_to: "Residual shared foreground burdens"
    rule: "If subdivision is not practicable, use a documented physical relationship that reflects causality, such as machine time, furnace occupancy, or accepted product mass; justify the choice and report a sensitivity case when an alternative could change conclusions."
    source_ids: []
  - rule_id: allocation_scrap_no_hidden_credit
    applies_to: "Post-industrial steel scrap and other wastes"
    rule: "Report waste mass and destination explicitly. Do not subtract a recycling credit or avoided burden inside the foreground inventory; any recycling allocation beyond the factory gate belongs to the declared downstream system model."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Rework and rejected product"
    rule: "Assign rework energy and material losses to the product batch that caused them; do not count internally reworked material as both waste output and new external input."
    source_ids: []
