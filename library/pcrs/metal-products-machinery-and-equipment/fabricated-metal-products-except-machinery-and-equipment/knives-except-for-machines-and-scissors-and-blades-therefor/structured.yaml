  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = net exchange amount divided by accepted net reference-product mass; multiply by 1 kg."
      inputs:
        - "Net exchange amount"
        - "accepted net reference-product mass"
      output: "Exchange amount per 1 kg reference product"
      source_ids: []
    - id: calc_item_to_mass
      applies_to: "Count-based product records"
      rule: "Product mass = accepted item count multiplied by the documented product-specific mean item mass."
      inputs:
        - "Accepted item count"
        - "sampled item masses"
      output: "kg accepted reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity rows"
      rule: "Electricity in MJ = metered electricity in kWh multiplied by 3.6 MJ/kWh."
      inputs:
        - "Metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_sodium_hydroxide_dry_mass
      applies_to: "Sodium-hydroxide row"
      rule: "Dry sodium-hydroxide mass = delivered solution mass multiplied by measured or supplier-declared sodium-hydroxide mass fraction."
      inputs:
        - "Solution mass"
        - "sodium-hydroxide mass fraction"
      output: "kg sodium hydroxide"
      source_ids:
        - us-epa-metal-finishing-1992
    - id: calc_direct_fossil_co2
      applies_to: "Direct fossil carbon dioxide"
      rule: "Calculate only when direct measurement is unavailable: fossil CO2 = collected fuel quantity multiplied by documented site or supplier carbon content and oxidation term, with all unit conversions retained."
      inputs:
        - "Natural-gas quantity"
        - "reference conditions"
        - "supplier composition or site carbon content"
        - "oxidation record"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_steel_mass_balance
      applies_to: "Blade-stock transformation"
      rule: "On a consistent dry-metal basis, reconcile external steel input with accepted product metal, steel scrap, captured steel-bearing dust, rejected work in progress, and stock change; investigate rather than force-close unexplained differences."
      inputs:
        - "Steel inputs"
        - "product metal mass"
        - "steel scrap"
        - "captured dust"
        - "rejected work in progress"
        - "stock change"
      output: "Steel mass-balance residual"
      source_ids:
        - us-epa-metal-finishing-1992
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Preserve product form, product code, blade alloy, heat-treatment state, dimensions, edge geometry, finish, handle and pivot configuration, and packaging inclusion for every aggregated batch."
