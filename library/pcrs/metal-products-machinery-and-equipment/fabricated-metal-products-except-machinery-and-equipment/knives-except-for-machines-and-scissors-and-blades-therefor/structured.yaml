      evidence: "Bath log, laboratory report, discharge meter, and waste manifest"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm that the product is within the covered non-machine knife, scissors, or blade boundary and that all required qualifiers are present."
    source_ids:
      - un-cpc-3-0-structure-2025
      - un-cpc-1-1-chinese-2002
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Confirm that accepted net product mass excluding packaging equals the declared reference amount and that count-to-mass conversion, if used, is product specific."
    source_ids: []
  - rule_id: validate_route_applicability
    applies_to: "Conditional rows and processes"
    rule: "Confirm that each conditional exchange is included only when the declared technology, material, wet process, assembly, or packaging route applies; absent rows require an explicit not-applicable statement in the produced data package."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "Process inventory"
    rule: "Confirm that every exchange is one physical, chemical, waste, or energy flow and that electricity, fuels, materials, wastes, wastewater, and emissions are not combined into umbrella rows."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing flows"
    rule: "Confirm state-100 identity, flow type, classification, property, unit group, product state, geography, technology, and general comment before publication; unresolved UUID rows remain explicit review items."
    source_ids: []
  - rule_id: validate_steel_balance
    applies_to: "Steel transformation"
    rule: "Review the steel mass-balance residual against measurement uncertainty and investigate unexplained differences; do not force the balance by changing measured waste or output."
    source_ids:
      - us-epa-metal-finishing-1992
  - rule_id: validate_no_upstream_double_count
    applies_to: "Electricity and direct emissions"
    rule: "Confirm that direct fossil CO2 includes only foreground combustion and that upstream electricity or fuel emissions remain in their supplying datasets."
    source_ids: []
  - rule_id: validate_allocation_and_disclosure
    applies_to: "Shared operations and wastes"
    rule: "Confirm subdivision was attempted first, residual allocation follows a justified physical relationship, waste destinations are explicit, and recycling credits are not hidden in foreground amounts."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared knife, scissors, or corresponding blade product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon-footprint or LCA models that require factory-gate production of a product matching the declared form, alloy, performance, assembly, geography, technology, period, and packaging scope"
  excluded_use: "Machine knives, saw blades, razors, flatware, unidentified mixed products, service-life comparisons without equivalent performance and lifetime evidence, or datasets that omit material grade and route"
  required_metadata: "Canonical PCR id; product form and code; item count and net mass; alloy and grade; received stock state; forming route; heat source and treatment state; dimensions; hardness and test method; edge and sharpness test; surface finish or coating; handle and pivot materials; packaging scope; geography; technology; reporting period; allocation; exclusions; upstream dataset identities"
  required_quality_disclosure: "Temporal and technological representativeness; meter and scale control; shared-meter allocation; product aggregation; steel mass-balance residual; wet-finishing composition; unresolved UUIDs; missing-data treatment; supplier/background match; waste destinations; proxy sensitivity"
  update_trigger: "Change in product boundary, alloy family, forming or heat-treatment technology, finishing or cleaning route, handle system, packaging scope, geography, allocation, upstream dataset selection, or a foreground change material to reported results"
