measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and mass-based inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net saleable product mass at factory gate. Measure packaging separately and do not include packaging mass in the 1 kg reference product."
  - id: item_mass_conversion
    applies_to: "Production records available only as item counts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts using a product-specific mean mass from a documented representative sample; retain count, sample size, measured masses, and sampling period."
  - id: electricity_energy_conversion
    applies_to: "Electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve the metered kWh record and convert to MJ using 1 kWh = 3.6 MJ; do not mix purchased electricity with fuel energy."
  - id: gas_volume_conditions
    applies_to: "Natural-gas and industrial-oxygen rows"
    required_property_ref:
