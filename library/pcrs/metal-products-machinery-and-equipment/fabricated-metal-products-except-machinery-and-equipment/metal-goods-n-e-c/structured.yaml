system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include all on-site forming, fabrication, joining, heat treatment, cleaning, surface treatment, coating, finishing, rework, internal material handling, direct emissions and wastes needed to release conforming product at the factory gate."
      source_ids:
        - eu-jrc-sf-bref-2024
        - eu-jrc-stm-bref-2006
        - eu-jrc-sts-bref-2020
    - rule_id: boundary_route_disclosure
      applies_to: "heterogeneous product routes"
      rule: "Include a conditional process only when it occurs for the declared product and report it as not applicable only with drawing, routing or production-record evidence."
      source_ids:
        - un-cpc-3-0-explanatory-notes-2025
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link every purchased metal, electricity, fuel, water and chemical input to a supplier-specific or representative upstream dataset; do not embed upstream emissions in the foreground rows."
      source_ids: []
    - rule_id: boundary_exclusions
      applies_to: "post-gate stages"
      rule: "Exclude installation, distribution after the factory gate, use, maintenance and end-of-life unless the study explicitly extends the boundary and reports those stages separately."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased metal feedstock and auxiliaries received at the manufacturing site with supplier, material grade, supplied form, recycled-content basis and incoming mass declared"
  starting_condition_role: "Foreground factory-gate input condition; upstream production remains represented by linked datasets"
  product_classification_scope: "Only the declared residual CPC 42999 product subtype; a more specific product identity takes precedence"
  recursive_input_rule: "When a purchased component is itself a CPC 42999 metal good, record it as one upstream product input with its supplier dataset and do not recursively remodel its production inside the receiving foreground process"
  upstream_dataset_requirement: "Use supplier-specific datasets where available; otherwise use technologically and geographically representative datasets for every purchased metal, energy carrier, water and chemical input"
  disclosure: "Declare product subtype, alloy or grade, feedstock form, route steps, treatment and coating, site, reference period, upstream dataset choices, cut-offs, packaging treatment and any same-category purchased component"
