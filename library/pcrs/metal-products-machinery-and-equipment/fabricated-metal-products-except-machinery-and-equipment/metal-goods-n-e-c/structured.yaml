measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure accepted finished-product net mass after all included finishing; exclude pallets, returnable transport items and separately reported packaging."
  - id: material_mass_basis
    applies_to: "metal, chemical, coating, scrap and waste rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record as-received mass and separately retain composition, concentration, moisture or solids fraction needed to interpret the exchange."
  - id: electricity_energy_basis
    applies_to: "electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electrical energy; convert kWh to MJ using the exact identity 1 kWh = 3.6 MJ and disclose meter coverage and any allocation."
  - id: gas_volume_basis
    applies_to: "natural gas and oxygen rows"
    required_property_ref:
