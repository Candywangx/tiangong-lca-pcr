      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report metered volume at declared reference temperature and pressure; do not combine gases or convert volume without the stated reference conditions and conversion basis."
  - id: water_mass_basis
    applies_to: "process-water row"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use metered mass or convert measured volume with a documented density and temperature; distinguish make-up water from recirculated internal water."
  - id: mass_balance_check
    applies_to: "forming and fabrication process"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile each declared metal input with conforming product, separately recorded scrap, retained work in progress and measured inventory change over the same period."
