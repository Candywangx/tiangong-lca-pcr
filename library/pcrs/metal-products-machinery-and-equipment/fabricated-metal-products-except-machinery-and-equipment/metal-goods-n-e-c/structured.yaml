allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared fabrication, treatment and coating operations"
    rule: "Avoid allocation by separately metering or engineering the product-specific routing, machine time, treatment area, batch load and material issue wherever feasible."
    source_ids: []
  - rule_id: allocation_physical_fallback
    applies_to: "unavoidable shared utilities and common operations"
    rule: "When subdivision is not feasible, allocate electricity, fuel, water and common consumables using the closest causal physical driver, such as machine time, batch time, treated surface area or product mass; disclose the driver and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "recoverable metal scrap"
    rule: "Report scrap mass and destination as a separate output. Do not credit avoided primary metal production inside the foreground inventory unless the downstream study applies and discloses a separate recycling method consistently."
    source_ids: []
  - rule_id: allocation_no_hidden_netting
    applies_to: "rework, internal recycle and wastes"
    rule: "Keep internal recycle loops and rework visible in gross input and energy records; do not net waste, recovered material or direct emissions against the reference product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "forming_and_fabrication"
      flow_role: "metal feedstock"
      record_type: "receiving, inventory-issue and material-certificate records"
      raw_fields: "material identity; alloy or grade; supplied form; supplier; lot; gross issued mass; returns; opening and closing inventory"
      collection_method: "Reconcile purchasing, stores and production issue records by product routing"
      unit: "kg"
      frequency: "Each receipt and issue; aggregate monthly"
      temporal_coverage: "At least 12 representative months or the full campaign for campaign production"
      site_scope: "Every included production site and declared product route"
      aggregation_rule: "Net issued mass = issues minus documented returns, normalized to accepted output"
      quality_evidence: "Material certificates, calibrated scale records and stock reconciliation"
    - protocol_id: cp_energy_inputs
      process_id: "all_applicable_processes"
      flow_role: "electricity"
      record_type: "submeter and production records"
      raw_fields: "meter id; opening and closing readings; process coverage; downtime; product quantity; allocation driver"
      collection_method: "Read dedicated meters where available and reconcile with site electricity balance"
      unit: "kWh and MJ"
      frequency: "Continuous or each batch; aggregate monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included site and line"
      aggregation_rule: "Convert kWh to MJ and allocate only shared meters with the declared causal driver"
      quality_evidence: "Meter calibration, utility invoice reconciliation and allocation check"
    - protocol_id: cp_gas_inputs
      process_id: "forming_and_fabrication_organic_coating"
      flow_role: "natural gas and oxygen"
      record_type: "flowmeter, cylinder, tank and batch records"
      raw_fields: "gas identity; meter or container id; volume; reference temperature; reference pressure; process; batch; product quantity"
      collection_method: "Read process meters or reconcile container deliveries and inventory change"
      unit: "m3"
      frequency: "Each batch or continuous; aggregate monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included combustion or oxygen-assisted operation"
      aggregation_rule: "Allocate by measured process use; shared use requires time or heat-duty driver"
      quality_evidence: "Meter calibration, supplier statement and reference-condition record"
    - protocol_id: cp_product_output
      process_id: "forming_and_fabrication"
      flow_role: "conforming finished product"
      record_type: "production and quality-release records"
      raw_fields: "product subtype; drawing; grade; finish; accepted mass; rejected mass; batch; release status"
      collection_method: "Weigh or calculate from verified unit mass and accepted count"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "Same period as all inputs and outputs"
      site_scope: "Every included site and product subtype"
      aggregation_rule: "Sum accepted released mass only"
      quality_evidence: "Calibrated scale, unit-mass validation and quality release"
    - protocol_id: cp_scrap_output
      process_id: "forming_and_fabrication"
      flow_role: "steel scrap"
      record_type: "scrap-bin, weighbridge and recycler records"
      raw_fields: "material family; mass; contamination; destination; recovery route; batch or period"
      collection_method: "Weigh segregated scrap at transfer and reconcile with recycler ticket"
      unit: "kg"
      frequency: "Each transfer; aggregate monthly"
      temporal_coverage: "Same period as product output"
      site_scope: "Every included steel route"
      aggregation_rule: "Sum outgoing segregated steel scrap and exclude internal recirculation"
      quality_evidence: "Weighbridge ticket, recycler receipt and material balance"
    - protocol_id: cp_aqueous_inputs
      process_id: "aqueous_surface_treatment"
      flow_role: "water and sodium hydroxide"
      record_type: "water meter, purchase, bath make-up and laboratory records"
      raw_fields: "water mass or volume; density; sodium-hydroxide mass; concentration; bath id; treated mass; treated area"
      collection_method: "Meter water and reconcile chemical additions with purchasing and bath logs"
      unit: "kg and m2"
      frequency: "Each batch or daily; aggregate monthly"
      temporal_coverage: "Same period as treated output"
      site_scope: "Every included aqueous-treatment line"
      aggregation_rule: "Sum external make-up only and normalize to finished mass while retaining treated area"
      quality_evidence: "Meter calibration, purchase records, bath log and concentration test"
    - protocol_id: cp_aqueous_wastes
      process_id: "aqueous_surface_treatment"
      flow_role: "spent liquor and metal-bearing wastewater"
      record_type: "tank, discharge, manifest and laboratory records"
      raw_fields: "stream identity; mass or volume; density; metal species; concentration; pH; treatment state; destination"
      collection_method: "Meter transfers or discharges and sample by the site monitoring plan"
      unit: "kg, m3 and concentration units"
      frequency: "Each transfer or monitoring interval; aggregate monthly"
      temporal_coverage: "Same period as treated output"
      site_scope: "Every included aqueous-treatment line and discharge point"
      aggregation_rule: "Keep spent bath and wastewater separate; convert volume only with documented density"
      quality_evidence: "Waste manifest, meter calibration, chain-of-custody sample and laboratory result"
    - protocol_id: cp_coating_materials
      process_id: "organic_coating"
      flow_role: "solvent-based paint"
      record_type: "purchase, issue, return and formulation records"
      raw_fields: "product name; batch; issued mass; returned mass; solids; volatile fraction; coated mass; coated area"
      collection_method: "Reconcile stores issue and return records with coating batches"
      unit: "kg and m2"
      frequency: "Each batch; aggregate monthly"
      temporal_coverage: "Same period as coated output"
      site_scope: "Every included coating line"
      aggregation_rule: "Net paint input = issued minus documented uncontaminated return"
      quality_evidence: "Supplier technical data, scale calibration and batch reconciliation"
    - protocol_id: cp_coating_wastes
      process_id: "organic_coating"
      flow_role: "waste paint"
      record_type: "waste-container and manifest records"
      raw_fields: "waste identity; mass; composition; hazardous status; destination; batch or period"
      collection_method: "Weigh sealed waste containers at transfer"
      unit: "kg"
      frequency: "Each transfer; aggregate monthly"
      temporal_coverage: "Same period as coated output"
      site_scope: "Every included coating line"
      aggregation_rule: "Sum waste paint separately from emitted solvent and reusable returned paint"
      quality_evidence: "Scale record, waste manifest and treatment receipt"
    - protocol_id: cp_air_emissions
      process_id: "forming_and_fabrication_organic_coating"
      flow_role: "direct fossil CO2 and NMVOC"
      record_type: "stack tests, continuous monitoring, approved emission reports and coating mass balance"
      raw_fields: "pollutant; source; measured concentration and flow or approved mass-balance fields; capture; abatement; operating hours; product quantity"
      collection_method: "Use regulatory or quality-assured site method and reconcile source coverage"
      unit: "kg"
      frequency: "Per monitoring plan; aggregate to production period"
      temporal_coverage: "Same period as related fuel or coating use and product output"
      site_scope: "Every included emission point plus documented fugitive sources"
      aggregation_rule: "Sum direct on-site releases only and allocate shared sources with declared driver"
      quality_evidence: "Method, calibration, laboratory accreditation, mass-balance closure and emission report"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "Normalized amount = exchange amount attributable to the product route divided by conforming finished-product mass for the same period"
      inputs:
        - "attributable exchange amount"
        - "accepted output mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_material_balance
      applies_to: "each declared metal route"
      rule: "Closure = metal inputs minus conforming output minus separately recorded scrap minus inventory increase; investigate sign and magnitude before release"
      inputs:
        - "net issued metal"
        - "accepted output"
        - scrap
        - "work-in-progress change"
      output: "metal-balance closure and explanation"
      source_ids: []
    - id: calc_volume_to_mass
      applies_to: "water and liquid wastes when only volume is measured"
      rule: "Mass = measured volume multiplied by documented density at the stated temperature; do not assume density when composition makes it material"
      inputs:
        - volume
        - density
        - temperature
        - composition
      output: "kg exchange"
      source_ids: []
    - id: calc_kwh_to_mj
      applies_to: "electricity"
      rule: "Electrical energy in MJ = metered kWh multiplied by 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and material identity"
      requirement: "Retain product subtype, drawing or specification, alloy or grade, supplied form, treatment and coating for every represented route."
      evidence: "Released drawing, bill of materials, material certificate and route card"
    - id: dq_temporal
      applies_to: "all foreground exchanges"
      requirement: "Use the same representative production period for inputs, outputs, wastes and emissions; justify periods shorter than 12 months or campaign coverage."
      evidence: "Period reconciliation and representativeness note"
    - id: dq_completeness
      applies_to: "process and meter coverage"
      requirement: "Demonstrate that every included site, line, conditional process and material family is represented, and explain exclusions and data gaps."
      evidence: "Process-flow diagram, meter map, waste map and completeness check"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Use calibrated instruments or reconciled commercial records and retain conversions, reference conditions, detection limits and allocation drivers."
      evidence: "Calibration, invoice reconciliation, laboratory QA and calculation record"
    - id: dq_mass_balance
      applies_to: "metal routes"
      requirement: "Resolve material-balance gaps before dataset release; do not hide rework, work in progress or internal recycle by netting."
      evidence: "Signed balance and variance investigation"
    - id: dq_upstream
      applies_to: "linked datasets"
      requirement: "Match upstream metal form, alloy or grade, production technology, recycled-content basis, geography and electricity or fuel supply as closely as available; disclose proxies."
      evidence: "Supplier dataset, selection rationale and proxy disclosure"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "reference flow"
    rule: "Fail if product subtype, material or grade, supplied form, route, finish, net finished mass, site, period or factory-gate condition is missing, or if a generic Tiangong product UUID is substituted for the unresolved reference product."
    source_ids:
      - un-cpc-3-0-explanatory-notes-2025
  - rule_id: validate_route_coverage
    applies_to: "process map"
    rule: "Fail if an operation shown in route cards or production records is omitted without evidence, or if a conditional process is included without its process-specific rows."
    source_ids:
      - eu-jrc-sf-bref-2024
      - eu-jrc-stm-bref-2006
      - eu-jrc-sts-bref-2020
  - rule_id: validate_atomic_exchanges
    applies_to: "inventory"
    rule: "Fail if multiple metals, fuels, chemicals, wastes or emissions are combined into one selected flow, or if wastewater is substituted for its emitted elementary substances."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Fail if public state, English or Chinese base name, flow type, classification, property or unit group differs from the selected exchange; unresolved rows must remain UUID-empty."
    source_ids: []
  - rule_id: validate_period_and_balance
    applies_to: "normalized amounts"
    rule: "Fail if exchange periods do not match accepted output, electricity conversion differs from 3.6 MJ/kWh, gas reference conditions are absent, or metal-balance variance lacks investigation."
    source_ids: []
  - rule_id: validate_no_range_substitution
    applies_to: "important flows"
    rule: "Fail if a provisional or external range is used as the foreground result. This candidate PCR has no adopted external ranges; use collected values and retain the manifest evidence needs for later review."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one declared CPC 42999 product subtype and route"
  downstream_use: "secondary_dataset; background_dataset after methodology review and linkage of representative upstream datasets"
  allowed_use: "Product-footprint and lifecycle models requiring a mass-normalized factory-gate dataset for the same product subtype, material, performance, finish, route, geography and period"
  excluded_use: "Cross-subtype comparison; functional equivalence across unlike metal goods; substitution for a more specific PCR; use-phase or end-of-life claims; generic global average without representativeness review"
  required_metadata: "canonical PCR id; product subtype; drawing/specification; alloy or grade; supplied form; net mass; process route; treatment and coating; site and geography; reference period; upstream datasets; allocation; cut-offs; packaging treatment; unresolved identities"
  required_quality_disclosure: "measured versus allocated shares; meter and scale coverage; material-balance closure; treated/coated surface area; gas reference conditions; chemical concentrations; waste destinations; emission method; data gaps; proxies and uncertainty"
  update_trigger: "Change in product subtype, material or grade, supplied form, mass, route, treatment/coating, site, supplier technology, energy supply, allocation method, emission control, reference period or resolution of an unresolved Tiangong UUID"
