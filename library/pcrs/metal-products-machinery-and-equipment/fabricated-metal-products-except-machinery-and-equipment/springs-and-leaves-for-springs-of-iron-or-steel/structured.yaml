measurement_rules:
  - id: mu_reference_mass
    applies_to: "Reference product and all mass-normalized inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize to 1 kg net accepted spring product after inspection. Exclude separate packaging mass; include coating, preservative, and permanently assembled spring elements that are part of the sold product."
  - id: mu_feedstock_mass
    applies_to: "Purchased steel wire, strip, and rod"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record actual received mass by feedstock form and steel grade. Do not combine wire, strip, and rod or substitute nominal design mass for received mass."
  - id: mu_electricity_conversion
    applies_to: "Electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve meter data in kWh and convert to MJ using 1 kWh = 3.6 MJ before normalization; disclose the grid, voltage level, losses, and meter boundary."
  - id: mu_gas_volume
    applies_to: "Natural gas used in heat treatment"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered volume and its temperature, pressure, and dry or wet reference conditions. Do not mix standard and actual cubic metres without an explicit conversion."
  - id: mu_mass_balance
    applies_to: "Each foreground process and the total product system"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile steel entering, internal intermediate transfers, saleable output, offcuts, rejects, retained coating, and accumulated stock over the reporting period. Explain any residual greater than the facility's documented measurement uncertainty."
