allocation_rules:
  - rule_id: al_subdivide
    applies_to: "Shared forming, heat-treatment, and finishing equipment"
    rule: "Prefer subdivision by product lot, machine time, furnace charge, meter, tank balance, or production campaign before applying allocation."
    source_ids: []
  - rule_id: al_mass_energy_drivers
    applies_to: "Residual shared inputs and outputs"
    rule: "Allocate steel and mass-related consumables by measured product mass and process yield; allocate electricity and fuel by submetered use, equipment time multiplied by measured load, or furnace charge energy. Do not use revenue when a causal physical driver is available."
    source_ids: []
  - rule_id: al_scrap
    applies_to: "Steel offcuts and rejects"
    rule: "Record scrap mass and destination as a distinct output. Do not subtract avoided primary-steel burden or assign a recycling credit inside the foreground inventory unless a separately declared consequential or substitution model is required by the study."
    source_ids: []
  - rule_id: al_co_products
    applies_to: "Multiple saleable spring products from one run"
    rule: "Treat separately specified spring products as co-products only when outputs cannot be subdivided. Use documented mass allocation by default, or another causal physical relation when mass does not represent the shared process; report the method and sensitivity."
    source_ids: []
  - rule_id: al_no_double_count
    applies_to: "Internal intermediates and rework"
    rule: "Internal formed and heat-treated blank transfers carry no new upstream burden. Rework returned within the same reporting period is counted once and reconciled through stock and reject records."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "forming"
      flow_role: "steel wire, strip, and rod inputs"
      record_type: "purchase receipt, weighbridge record, stock ledger, material certificate"
      raw_fields: "supplier; steel grade; form; diameter or thickness; coating; heat-treatment state; received mass; opening stock; closing stock; lot ids"
      collection_method: "Reconcile certified receipts and physical stock to product-lot consumption"
      unit: "kg"
      frequency: "each receipt and monthly stock close"
      temporal_coverage: "At least one representative 12-month period, or the complete shorter campaign"
      site_scope: "All facilities producing the declared product"
      aggregation_rule: "Sum consumed mass by form and grade; normalize to accepted product mass"
      quality_evidence: "Calibrated scale records, material certificates, stock reconciliation, supplier invoice"
    - protocol_id: cp_forming_energy
      process_id: "forming"
      flow_role: "forming electricity"
      record_type: "submeter or equipment energy log"
      raw_fields: "meter id; opening and closing kWh; machine id; operating hours; product lot; production mass"
      collection_method: "Read dedicated meter; where shared, allocate measured load-hours to lots"
      unit: "kWh and MJ"
      frequency: "each shift or batch; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Forming equipment and direct auxiliaries"
      aggregation_rule: "Convert kWh to MJ; sum assigned energy; divide by accepted product mass"
      quality_evidence: "Meter calibration, load test, production log, allocation worksheet"
    - protocol_id: cp_forming_consumables
      process_id: "forming"
      flow_role: "forming lubricant"
      record_type: "purchase, issue, recovery, and stock records"
      raw_fields: "product name; composition or safety data sheet; mass purchased; opening stock; closing stock; recovered mass; lot ids"
      collection_method: "Tank or container mass balance"
      unit: "kg"
      frequency: "each issue; monthly stock close"
      temporal_coverage: "Same period as product output"
      site_scope: "Forming operations only"
      aggregation_rule: "Purchased plus opening stock minus closing stock, recovery, and transfers; divide by accepted product mass"
      quality_evidence: "Stock reconciliation, scale calibration, purchase and recovery records"
    - protocol_id: cp_forming_outputs
      process_id: "forming"
      flow_role: "formed blank and steel offcuts"
      record_type: "transfer weight, reject log, scrap ticket"
      raw_fields: "lot id; blank mass; offcut mass; reject mass; rework return; opening and closing work-in-process"
      collection_method: "Weigh transfers and scrap containers; reconcile work in process"
      unit: "kg"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Forming output boundary"
      aggregation_rule: "Sum net transfers and waste after stock change; normalize to accepted product mass"
      quality_evidence: "Scale calibration, transfer log, scrap ticket, reject disposition"
    - protocol_id: cp_heat_records
      process_id: "heat_treatment"
      flow_role: "heat-treatment inputs"
      record_type: "batch card, furnace meter, gas meter, oil stock record"
      raw_fields: "batch id; blank mass; furnace route; temperature-time program; kWh; gas m3 and reference conditions; oil additions; oil stock; quench medium"
      collection_method: "Capture furnace batch and dedicated meter records; balance quench oil"
      unit: "kg, kWh, MJ, m3"
      frequency: "each furnace batch; monthly utility reconciliation"
      temporal_coverage: "Complete included heat-treatment campaigns"
      site_scope: "Included furnaces and quench systems"
      aggregation_rule: "Assign batch-specific inputs to treated mass; normalize to accepted product mass"
      quality_evidence: "Calibrated meters, furnace chart, batch traceability, tank balance"
    - protocol_id: cp_heat_outputs
      process_id: "heat_treatment"
      flow_role: "heat-treated blank and spent quenching oil"
      record_type: "release weight, reject log, hazardous-waste manifest"
      raw_fields: "batch id; released mass; reject mass; spent oil mass; destination; stock change"
      collection_method: "Weigh released intermediates and outgoing oil containers"
      unit: "kg"
      frequency: "each batch or waste shipment"
      temporal_coverage: "Same period as heat-treatment inputs"
      site_scope: "Included heat-treatment and quench systems"
      aggregation_rule: "Sum released mass and removed oil; normalize to accepted product mass"
      quality_evidence: "Scale calibration, batch release, waste manifest, stock reconciliation"
    - protocol_id: cp_combustion_emissions
      process_id: "heat_treatment"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack test, continuous monitor, gas meter, approved calculation sheet"
      raw_fields: "measured CO2 mass or concentration and flow; gas volume; reference conditions; emission factor; oxidation factor; operating hours"
      collection_method: "Prefer direct measurement; otherwise calculate from metered gas using documented facility-approved factors"
      unit: "kg"
      frequency: "continuous, test campaign, or each reporting period"
      temporal_coverage: "Same period as gas consumption"
      site_scope: "Direct furnace emission points only"
      aggregation_rule: "Aggregate direct fossil CO2 and divide by accepted product mass"
      quality_evidence: "Monitor calibration, stack-test report, meter record, factor approval and calculation trace"
    - protocol_id: cp_finishing_records
      process_id: "finishing_inspection"
      flow_role: "finishing inputs"
      record_type: "transfer weight, submeter, water meter, chemical issue, shot inventory"
      raw_fields: "incoming blank mass by route; kWh; water mass or volume and density; sodium-hydroxide solution mass and concentration; shot additions, recovery, and stock; lot ids"
      collection_method: "Reconcile route-specific meters, batch sheets, chemical issues, and stock"
      unit: "kg, kWh, MJ"
      frequency: "each batch or shift; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Finishing and inspection equipment used by declared lots"
      aggregation_rule: "Calculate net make-up and route-specific use; normalize to accepted product mass"
      quality_evidence: "Meter and scale calibration, concentration certificate, stock reconciliation, route log"
    - protocol_id: cp_finishing_outputs
      process_id: "finishing_inspection"
      flow_role: "accepted product, spent shot, and wastewater"
      record_type: "final weight, inspection release, waste transfer, discharge meter"
      raw_fields: "accepted mass; rejected mass; inspection result; spent-shot mass; wastewater volume or mass; density; destination; lot ids"
      collection_method: "Weigh accepted product and wastes; meter wastewater; retain inspection disposition"
      unit: "kg and m3"
      frequency: "each lot and each waste transfer; monthly reconciliation"
      temporal_coverage: "Same period as finishing inputs"
      site_scope: "Final inspection and finishing waste boundary"
      aggregation_rule: "Sum accepted mass and each waste separately; normalize to accepted product mass"
      quality_evidence: "Calibrated scales and meters, inspection certificate, waste manifest, laboratory or density record"
  calculation_rules:
    - id: calc_normalize
      applies_to: "All inventory rows"
      rule: "normalized amount = reporting-period amount assigned to declared lots / reporting-period accepted net product mass"
      inputs:
        - "assigned flow amount"
        - "accepted reference-product mass"
      output: "amount per 1 kg accepted product"
      source_ids: []
    - id: calc_electricity
      applies_to: "Electricity rows"
      rule: "MJ = metered kWh × 3.6; normalized MJ = MJ / accepted product kg"
      inputs:
        - kWh
        - "accepted product kg"
      output: "MJ/kg reference product"
      source_ids: []
    - id: calc_sodium_hydroxide
      applies_to: "Sodium hydroxide"
      rule: "dry NaOH mass = solution mass × verified NaOH mass fraction"
      inputs:
        - "solution mass"
        - "concentration certificate or laboratory result"
      output: "kg NaOH/kg reference product"
      source_ids: []
    - id: calc_water_mass
      applies_to: "Process water and wastewater"
      rule: "mass = measured volume × measured period-representative density; do not assume density when dissolved or suspended solids make it material"
      inputs:
        - volume
        - density
        - "accepted product kg"
      output: "kg/kg reference product"
      source_ids: []
    - id: calc_internal_balance
      applies_to: "Internal intermediates"
      rule: "opening work in process + process output - closing work in process = downstream transfer + rejects + documented rework return"
      inputs:
        - "transfer weights"
        - "work-in-process stock"
        - rejects
        - rework
      output: "reconciled intermediate mass"
      source_ids: []
    - id: calc_total_mass_balance
      applies_to: "Total foreground system"
      rule: "steel inputs + retained non-steel material inputs = accepted product + exported wastes + stock increase + measured direct mass emissions + residual"
      inputs:
        - "all mass rows"
        - "stock change"
      output: "mass-balance residual and percentage"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and steel feedstocks"
      requirement: "Preserve lot traceability from material certificate through accepted product and declare grade, form, drawing, heat treatment, and surface state."
      evidence: "Material certificate, routing card, inspection release, product specification"
    - id: dq_measurement
      applies_to: "Mass, electricity, gas, water, and chemical records"
      requirement: "Use calibrated meters or documented stock balances; record calibration status, unit, reference conditions, detection limit where relevant, and uncertainty."
      evidence: "Calibration certificate, meter log, tank or stock reconciliation"
    - id: dq_temporal
      applies_to: "Foreground dataset"
      requirement: "Cover at least one representative 12-month period unless production is campaign-based or newer; explain shutdowns, atypical batches, and shorter periods."
      evidence: "Production calendar, monthly totals, representativeness review"
    - id: dq_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile purchased steel, internal transfers, accepted output, rejects, wastes, direct emissions, utilities, and stock changes; document excluded flows and their screening basis."
      evidence: "Mass and energy balance, waste register, permit inventory, exclusion log"
    - id: dq_route
      applies_to: "Conditional heat treatment and finishing"
      requirement: "Identify each route actually used and its production share. Do not average mutually exclusive furnace, quench, peening, cleaning, or coating routes without production-weighted primary records."
      evidence: "Routing cards, furnace recipes, bath logs, production shares"
    - id: dq_geography_technology
      applies_to: "Upstream datasets"
      requirement: "Match steel form and grade, energy geography, supplier technology, and reference year; disclose every proxy and its expected direction of bias."
      evidence: "Supplier dataset metadata, proxy assessment, geography and technology statement"
validation_rules:
  - rule_id: val_reference_flow
    applies_to: "Reference product"
    rule: "Confirm that the reference output uses UUID 650cda2f-7baa-413f-ac22-ff0da54ea8ba, Mass, kg, and exactly 1 kg net accepted product excluding separate packaging."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-prodcom-2006-springs
  - rule_id: val_product_scope
    applies_to: "Product identity"
    rule: "Confirm the product is principally an iron or steel spring, spring leaf, or spring unit and that excluded washers, shock absorbers, clock or watch springs, non-ferrous springs, and non-spring assemblies are not represented by this PCR."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-prodcom-2006-springs
  - rule_id: val_feedstock_route
    applies_to: "Forming inputs"
    rule: "Exactly the steel wire, strip, and rod forms actually consumed shall carry non-zero amounts, and each shall declare grade, dimensions, supplier, and incoming state."
    source_ids:
      - us-census-naics-2022-spring-manufacturing
  - rule_id: val_internal_transfers
    applies_to: "Internal intermediates"
    rule: "Reconcile formed and heat-treated blank outputs to downstream inputs after work-in-process stock change, rejects, and rework; do not create burden on internal transfers."
    source_ids: []
  - rule_id: val_conditional_processes
    applies_to: "Heat treatment and finishing"
    rule: "Verify every applied furnace, quench, grinding, cleaning, passivation, shot-peening, or corrosion-protection route has its atomic inputs and outputs recorded, and every non-applied route is explicitly documented."
    source_ids:
      - us-epa-james-spring-wire
      - eu-rfcs-lighttech-2020
  - rule_id: val_energy_emissions
    applies_to: "Energy and direct emissions"
    rule: "Reconcile electricity and gas meters to included equipment and confirm direct fossil CO2 excludes upstream supplier emissions. Any calculated emission shall retain its factor, oxidation basis, and calculation trace."
    source_ids: []
  - rule_id: val_mass_balance
    applies_to: "Foreground product system"
    rule: "Pass the documented facility mass-balance tolerance or explain the residual with measurement uncertainty, stock change, unmeasured coating retention, or a corrective action."
    source_ids: []
  - rule_id: val_data_period
    applies_to: "Dataset quality"
    rule: "Confirm input, output, waste, energy, and emission records cover the same representative period and facility scope."
    source_ids: []
  - rule_id: val_uuid_status
    applies_to: "UUID-bearing flows"
    rule: "Confirm every stored flow, flow-property, and unit-group UUID remains public at state code 100 and still matches the recorded English and Chinese base names, flow type, classification, property, and unit group."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground spring-manufacturing dataset suitable for review and later publication as a secondary_dataset or background_dataset"
  downstream_use: "Product carbon footprint, process LCA, supply-chain comparison, and lifecyclemodel construction for products consuming iron or steel springs or spring leaves"
  allowed_use: "Use for the declared spring form, steel grade, forming route, heat treatment, finishing state, facility geography, technology, and reference period, or with a documented representativeness assessment"
  excluded_use: "Do not use as a proxy for non-ferrous or polymer springs, spring washers, shock absorbers, clock or watch springs, unmodelled integrated steel production, downstream use or service life, or routes with materially different heat treatment or surface treatment without adjustment"
  required_metadata: "PCR id and version state; product and flow UUIDs; spring form and application; drawing or part family; steel grade and feedstock form; forming and heat-treatment route; quench medium; finishing and coating; net-mass and packaging treatment; facility geography; reference year and period; production volume; allocation; upstream dataset choices; cut-offs; unresolved UUID disclosures"
  required_quality_disclosure: "Primary-data share; meter and scale calibration; material and internal-transfer mass-balance result; temporal, geographic, and technological representativeness; route production shares; data gaps and proxies; uncertainty; excluded flows; direct-emission method; waste destination; reviewer status"
  update_trigger: "Update when product scope, steel grade family, feedstock form, forming technology, furnace or quench route, finishing or coating route, facility energy supply, allocation, waste treatment, reference period, or a material data source changes; also update when an unresolved flow UUID or range-evidence need is resolved"
