allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "multi-product manufacturing"
    rule: "Subdivide processes and use product-, line-, batch-, or recipe-specific measurements before applying allocation."
    source_ids:
      - loglisci-priarone-settineri-2013-tool-manufacturing
      - hsu-2024-turning-insert-lca
  - rule_id: allocation_shared_batch
    applies_to: "shared furnace, pressing, coating, and packaging batches"
    rule: "Allocate shared measured inputs by a documented causal driver; use conforming output mass when no stronger causal relation is demonstrated, and disclose the batch population, rejects, and driver."
    source_ids:
      - hsu-2024-turning-insert-lca
  - rule_id: allocation_scrap_boundary
    applies_to: "metal scrap and recovered hardmetal leaving the foreground"
    rule: "Record the measured waste or recovered-material flow at the factory boundary without avoided-production credit in the foreground inventory; model downstream recycling consistently in a separately declared scenario."
    source_ids:
      - ec-2001-non-ferrous-metals-bref
  - rule_id: allocation_internal_rework
    applies_to: "in-process rejects and returned material"
    rule: "Keep material returned to the same production system as an internal loop; include the additional energy and consumables and count only material that exits the boundary as waste."
    source_ids:
      - hsu-2024-turning-insert-lca
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "material_preparation"
      flow_role: "steel and powder inputs"
      record_type: "purchase, issue, return, and stock records"
      raw_fields: "material identity; grade; supplier; lot; recycled content; opening stock; receipts; issues; returns; closing stock; mass"
      collection_method: "reconcile traceable warehouse and recipe records"
      unit: "kg"
      frequency: "each lot and campaign"
      temporal_coverage: "representative production period, normally at least 12 months or a complete disclosed campaign"
      site_scope: "all in-scope production and storage locations"
      aggregation_rule: "opening + receipts - closing - documented transfers, allocated to conforming campaign output"
      quality_evidence: "supplier certificates, calibrated scales, stock reconciliation, recipe release"
    - protocol_id: cp_energy_meters
      process_id: "all_process_ids"
      flow_role: "electricity input"
      record_type: "meter and equipment log"
      raw_fields: "meter id; start/end reading; unit; process; operating state; batch; product output; allocation driver"
      collection_method: "calibrated submeter; otherwise verified load multiplied by logged time"
      unit: "kWh and MJ"
      frequency: "each batch or monthly with batch linkage"
      temporal_coverage: "same period as production output"
      site_scope: "all in-scope lines and attributable auxiliaries"
      aggregation_rule: "subtract non-production baseload when separately measured, then allocate by causal driver"
      quality_evidence: "calibration record, meter photographs/export, operating log, conversion record"
    - protocol_id: cp_fuel_combustion
      process_id: "thermal_consolidation"
      flow_role: "furnace fuel and direct carbon dioxide"
      record_type: "fuel meter, invoice, composition, and emissions record"
      raw_fields: "gas volume; reference conditions; carbon fraction; oxidation fraction; batch; furnace; direct emission measurement"
      collection_method: "calibrated meter or reconciled invoice; approved site calculation for CO2"
      unit: "m3 and kg"
      frequency: "each batch or monthly with furnace linkage"
      temporal_coverage: "same period as treated output"
      site_scope: "all in-scope direct combustion sources"
      aggregation_rule: "allocate metered fuel to batch; calculate CO2 only from documented composition and oxidation"
      quality_evidence: "meter calibration, supplier gas specification, calculation workbook, monitoring record"
    - protocol_id: cp_water_meters
      process_id: "thermal_consolidation_machining_grinding"
      flow_role: "process-water make-up"
      record_type: "meter, tank, and batch record"
      raw_fields: "source; meter readings; make-up mass/volume; density; recirculation; discharge; batch"
      collection_method: "calibrated meter or tank mass balance"
      unit: "kg"
      frequency: "batch or monthly with line linkage"
      temporal_coverage: "same period as production output"
      site_scope: "all in-scope water systems"
      aggregation_rule: "count only water crossing the foreground boundary and allocate by measured use or batch driver"
      quality_evidence: "meter calibration, tank log, density conversion, water-system diagram"
    - protocol_id: cp_consumables
      process_id: "machining_grinding"
      flow_role: "cutting fluid and grinding wheel"
      record_type: "purchase, issue, replacement, dressing, and stock record"
      raw_fields: "product identity; formulation; opening stock; receipts; additions; returns; closing stock; wheel initial/residual mass; batch"
      collection_method: "stock-change reconciliation with replacement and dressing logs"
      unit: "kg"
      frequency: "each addition or replacement; aggregate by campaign"
      temporal_coverage: "same period as machined output"
      site_scope: "all in-scope machine tools and coolant systems"
      aggregation_rule: "opening + receipts - closing - transfers, allocated to conforming machined output"
      quality_evidence: "invoices, safety data sheet, issue log, scale record, wheel-change log"
    - protocol_id: cp_waste_transfers
      process_id: "machining_grinding"
      flow_role: "steel scrap and grinding sludge"
      record_type: "container scale and waste transfer record"
      raw_fields: "waste identity; container tare/gross mass; destination; recovery/disposal route; dry matter; coolant carry-over; batch link"
      collection_method: "calibrated scale and legally or operationally controlled transfer note"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "same period as production output"
      site_scope: "all in-scope waste collection points"
      aggregation_rule: "sum net dispatched mass and allocate to linked campaigns; report dry-matter correction separately"
      quality_evidence: "scale calibration, transfer note, laboratory dry-matter result, destination receipt"
    - protocol_id: cp_coating_recipe
      process_id: "cvd_coating"
      flow_role: "coating gases"
      record_type: "recipe controller, gas meter, and cylinder stock record"
      raw_fields: "chemical identity; purity; recipe; flow/consumption; reference conditions; opening/closing cylinder mass; batch; conforming coated mass"
      collection_method: "controller export or gas-meter/cylinder mass balance"
      unit: "m3 or kg"
      frequency: "every coating batch"
      temporal_coverage: "all in-scope coating batches in the data period"
      site_scope: "all in-scope coating equipment, gas supply points, and batches"
      aggregation_rule: "allocate each atomic gas separately to conforming coated mass using the disclosed batch driver"
      quality_evidence: "recipe approval, controller export, meter calibration, cylinder reconciliation"
    - protocol_id: cp_packaging_dispatch
      process_id: "inspection_packaging"
      flow_role: "sales packaging"
      record_type: "bill of materials, packaging issue, and dispatch record"
      raw_fields: "component identity; material; unit mass; issued count; returned count; dispatched product mass; packaging configuration"
      collection_method: "verified component weighing and dispatch reconciliation"
      unit: "kg"
      frequency: "each packaging configuration and dispatch batch"
      temporal_coverage: "same period as finished output"
      site_scope: "all in-scope sales packaging"
      aggregation_rule: "net component count × verified unit mass, normalized by dispatched net product mass"
      quality_evidence: "packaging specification, calibrated scale, issue record, dispatch record"
    - protocol_id: cp_batch_outputs
      process_id: "all_process_ids"
      flow_role: "intermediate and final outputs"
      record_type: "batch traveller, acceptance, reject, rework, and mass record"
      raw_fields: "batch id; product id; route; input mass; intermediate mass; conforming mass; reject mass; rework return; item count; unit mass"
      collection_method: "calibrated weighing linked to quality release"
      unit: "kg"
      frequency: "every batch"
      temporal_coverage: "all batches represented by the dataset"
      site_scope: "all in-scope production lines, outsourced steps, and acceptance points"
      aggregation_rule: "sum conforming net mass; keep rework internal; normalize final output to 1 kg"
      quality_evidence: "scale calibration, batch traveller, quality release, reject/rework log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = campaign amount / conforming finished-product net mass"
      inputs:
        - "campaign exchange amount"
        - "conforming net output mass"
      output: "exchange per 1 kg net finished product"
      source_ids: []
    - id: calc_shared_batch_allocation
      applies_to: "shared thermal, coating, or packaging batch"
      rule: "allocated amount = measured batch amount × declared causal share; when mass is used, causal share = product conforming mass / total conforming batch mass"
      inputs:
        - "measured batch amount"
        - "product and total conforming output"
        - "declared driver"
      output: "product-attributed batch exchange"
      source_ids:
        - hsu-2024-turning-insert-lca
    - id: calc_furnace_co2
      applies_to: "out_furnace_co2_fossil"
      rule: "fossil CO2 mass = fuel mass × fossil carbon mass fraction × oxidation fraction × 44/12; if fuel is metered by volume, first apply the supplier density at declared conditions"
      inputs:
        - "metered fuel"
        - density
        - "fossil carbon fraction"
        - "oxidation fraction"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calc_material_balance
      applies_to: "each production campaign"
      rule: "unexplained difference = total material inputs - conforming output - measured internal carry-over - outputs leaving as scrap or waste - documented stock change"
      inputs:
        - material
        - product
        - intermediate
        - waste
        - "and stock records on one basis"
      output: "mass-balance residual and percentage"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "paper box and polypropylene tray"
      rule: "packaging mass = net dispatched component count × verified component unit mass"
      inputs:
        - "issue/return count"
        - "dispatched count"
        - "unit mass"
      output: "kg packaging per 1 kg net product"
      source_ids:
        - hsu-2024-turning-insert-lca
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all material flows"
      requirement: "Preserve product drawing, grade, chemical or commercial identity, supplier, lot, delivery state, coating state, and selected TianGong identity; document every unresolved UUID without substituting a proxy."
      evidence: "product specification, certificate, invoice, lot record, UUID audit"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Cover a representative continuous period, normally at least 12 months; a shorter campaign is allowed only when it captures a complete disclosed production campaign and seasonality or load variation is immaterial."
      evidence: "meter period, batch list, production schedule, representativeness statement"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile all process stages and actual atomic inputs, direct emissions, waste transfers, outsourced steps, rework loops, and packaging against production and purchasing records."
      evidence: "completeness checklist, ledgers, batch travellers, transfer notes"
    - id: dq_measurement
      applies_to: "meters, scales, and controller data"
      requirement: "Use calibrated instruments and retain raw readings, reference conditions, conversions, and data-gap treatment."
      evidence: "calibration certificates, raw exports, conversion workbook"
    - id: dq_allocation
      applies_to: "shared processes"
      requirement: "Demonstrate subdivision attempts and retain the causal basis, batch population, conforming mass, rejects, and sensitivity to the selected allocation driver."
      evidence: "process map, meter assignment, allocation workbook, sensitivity record"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match material grade, recycled content, production technology, geography, and delivery state; disclose and assess every proxy."
      evidence: "supplier dataset, technology note, geographic match review"
validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "reference product"
    rule: "Fail validation if the product is outside the covered CPC 42922 semantic boundary or if tool family, material/grade, geometry, route, coating state, factory-gate state, and net mass are not declared."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Require exactly 1 kg normalized conforming net finished-product mass and verify that packaging, rejects, fixtures, and reusable carriers are excluded."
    source_ids: []
  - rule_id: validate_route_processes
    applies_to: "process map"
    rule: "Require material preparation, machining/grinding, and final inspection/packaging; require thermal consolidation and CVD coating only when their declared route conditions apply, and require disclosure of outsourced steps."
    source_ids:
      - loglisci-priarone-settineri-2013-tool-manufacturing
      - hsu-2024-turning-insert-lca
  - rule_id: validate_atomic_inventory
    applies_to: "all inventory rows"
    rule: "Fail if a selected flow combines multiple chemicals, utilities, fuels, materials, wastes, or emissions, or if an actual recipe component is hidden under an umbrella row."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID-bearing rows"
    rule: "Require public state-100 identity, correct flow type, property and unit group, exact semantic fit, and the official TianGong Chinese baseName; reject narrower or proxy UUIDs."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "campaign inventory"
    rule: "Investigate and disclose the mass-balance residual; validation is inconclusive when stock changes, internal rework, coolant carry-over, or missing waste streams prevent reconciliation."
    source_ids: []
  - rule_id: validate_energy_and_gases
    applies_to: "energy, fuel, and coating gases"
    rule: "Verify kWh-to-MJ conversion, gas reference conditions, separation of methane precursor from natural-gas fuel, and separation of product carbon dioxide from elementary fossil CO2."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared batches and scrap"
    rule: "Require documented subdivision, causal allocation driver, batch population, reject treatment, and consistent no-credit treatment for foreground scrap."
    source_ids:
      - hsu-2024-turning-insert-lca
      - ec-2001-non-ferrous-metals-bref
  - rule_id: validate_unresolved_evidence
    applies_to: "unresolved UUIDs and ranges"
    rule: "Keep unresolved identity and range-evidence needs visible; do not invent UUIDs, proxies, single-value ranges, or source-backed ranges without two compatible independent original sources."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing data package for a declared CPC 42922 tool product and route."
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and unresolved items"
  allowed_use: "Cradle-to-gate product footprints, supply-chain inventories, process improvement, and downstream process or lifecyclemodel projections for matching tool family, grade, route, coating, geography, and period."
  excluded_use: "Comparative claims about tool service life or machining performance without a performance-equivalent functional unit; substitution across unlike tool families or grades; use as a generic proxy while reference-product or material identities remain unresolved."
  required_metadata: "PCR id and version; product drawing/family; net mass; material and grade; recycled content; route and equipment; coating chemistry/state; packaging state; site/geography; data period; upstream dataset choices; allocation; outsourced steps; unresolved items."
  required_quality_disclosure: "Measurement coverage and calibration; stock changes; mass-balance residual; allocation drivers; reject and rework treatment; waste destinations; gas reference conditions; data gaps; UUID and range-evidence status."
  update_trigger: "Change in product geometry or grade, material or recycled content, thermal/coating route, major equipment or energy supply, packaging, supplier geography, allocation method, or a material shift in normalized inventory."
data_sources:
  - id: "unsd-cpc-3-0-structure-2025"
