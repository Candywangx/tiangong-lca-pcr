    used_for: "WC-Co insert route, pressing/sintering, grinding, CVD gases, packaging, waste, batch allocation, and foreground collection."
  - id: "ec-2001-non-ferrous-metals-bref"
    type: "official_guidance"
    reference: "European Commission (2001). Reference Document on Best Available Techniques in the Non Ferrous Metals Industries. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2020-03/superseded_nfm_bref_1201.pdf"
    used_for: "Tungsten carbide production context, hardmetal inputs and residues, and recycled-hardmetal disclosure."
