  - id: "loglisci-priarone-settineri-2013-tool-manufacturing"
    type: "literature"
    reference: "Loglisci, G.; Priarone, P. C.; Settineri, L. (2013). Cutting tool manufacturing: a sustainability perspective. Proceedings of the 11th Global Conference on Sustainable Manufacturing, ISBN 978-3-7983-2609-5. https://d-nb.info/1078666539/34"
    used_for: "Steel tap route, machining/grinding inputs, metering, scrap, and process allocation."
  - id: "hsu-2024-turning-insert-lca"
