allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared lines and utilities"
    rule: "First subdivide by process, product family, batch, meter or machine time so only inputs and outputs directly attributable to the declared product remain."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_physical_relation
    applies_to: "inseparable shared operations"
    rule: "If subdivision is not possible, apply a documented relevant physical relationship: machine time or metered energy for utilities and measured mass for material losses. Demonstrate why the relationship represents causation and disclose the factor."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_other_relation
    applies_to: "no defensible physical relationship"
    rule: "Use another relationship only after documenting why subdivision, system expansion and a relevant physical relationship are infeasible; report a sensitivity check and do not use an undocumented default."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_scrap_boundary
    applies_to: "separated scrap and recovered abrasive"
    rule: "Record gross foreground inputs and outgoing waste or internally recovered material separately. Do not add an avoided-production credit inside this factory-gate inventory unless the downstream method and expanded boundary are explicitly declared."
    source_ids:
      - ec-pef-method-2021
      - ec-jrc-stm-bref-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "stock_receipt_and_preparation"
      flow_role: "stainless-steel stock"
      record_type: "scale ticket, receiving record and bill of material"
      raw_fields: "receipt mass; accepted mass; alloy grade; thickness; supplier; recycled content; lot id"
      collection_method: "reconcile calibrated receiving scale with purchasing and production issue records"
      unit: "kg"
      frequency: "each delivery and production lot"
      temporal_coverage: "representative 12 consecutive months or declared campaign"
      site_scope: "all receiving points serving included production"
      aggregation_rule: "sum attributable accepted and rejected mass, then normalize by accepted net product"
      quality_evidence: "scale calibration, material certificate and reconciliation log"
    - protocol_id: cp_process_energy
      process_id: "all_applicable_processes"
      flow_role: "electricity"
      record_type: "submeter or meter-group log"
      raw_fields: "start and end reading; kWh; meter id; process; product lot; operating time"
      collection_method: "direct submeter preferred; otherwise documented machine-time allocation from a stable meter group"
      unit: "kWh and MJ"
      frequency: "each batch or at least monthly"
      temporal_coverage: "same period as production"
      site_scope: "all included factory processes"
      aggregation_rule: "subtract documented non-production loads, convert kWh to MJ and normalize"
      quality_evidence: "meter calibration and allocation worksheet"
    - protocol_id: cp_intermediate_mass_transfer
      process_id: "stock_forming_thermal_and_finishing_processes"
      flow_role: "internal product transfer"
      record_type: "scale or verified count record"
      raw_fields: "gross mass; tare; item count; mean item mass; source process; destination process; lot id"
      collection_method: "weigh transfer container or convert verified counts using measured mean item mass"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "same period as production"
      site_scope: "all included transfers"
      aggregation_rule: "reconcile matched input and output transfers by lot"
      quality_evidence: "scale calibration, sampling record and transfer reconciliation"
    - protocol_id: cp_scrap_waste
      process_id: "stock_and_forming_processes"
      flow_role: "post-industrial steel scrap"
      record_type: "scrap-container weight and waste-transfer record"
      raw_fields: "gross mass; tare; grade; contamination; source process; destination; date"
      collection_method: "weigh segregated scrap containers before internal recycling or off-site transfer"
      unit: "kg"
      frequency: "each container or shipment"
      temporal_coverage: "same period as production"
      site_scope: "all included scrap points"
      aggregation_rule: "sum net scrap by source process and product allocation"
      quality_evidence: "scale calibration and destination receipt"
    - protocol_id: cp_cutting_fluid
      process_id: "forming_and_trimming"
      flow_role: "cutting fluid and waste cutting oil"
      record_type: "inventory issue, return, recovery and waste-transfer record"
      raw_fields: "issued mass; unchanged return; recovered mass; waste mass; formulation; water content; lot id"
      collection_method: "mass balance purchased or issued fluid, reusable return and off-site waste"
      unit: "kg"
      frequency: "each replenishment and waste shipment"
      temporal_coverage: "same period as production"
      site_scope: "included trimming equipment"
      aggregation_rule: "consumed fluid equals issues minus reusable returns, adjusted for stock change"
      quality_evidence: "stock reconciliation and waste manifest"
    - protocol_id: cp_thermal_fuel
      process_id: "thermal_treatment"
      flow_role: "natural gas"
      record_type: "calibrated gas-meter and furnace campaign log"
      raw_fields: "volume; temperature; pressure; dry or wet basis; meter id; campaign; product mass"
      collection_method: "read dedicated meter or documented shared-meter allocation"
      unit: "m3"
      frequency: "each campaign or daily"
      temporal_coverage: "same period as thermally treated production"
      site_scope: "included furnace units"
      aggregation_rule: "aggregate reference-condition volume by product campaign"
      quality_evidence: "meter calibration and conversion record"
    - protocol_id: cp_direct_co2
      process_id: "thermal_treatment"
      flow_role: "fossil carbon dioxide"
      record_type: "direct monitor or fuel-carbon calculation record"
      raw_fields: "measured CO2; fuel volume; carbon content; oxidation factor; reference conditions; campaign"
      collection_method: "use direct measurement or calculate from collected fuel and documented facility-specific carbon data"
      unit: "kg"
      frequency: "each campaign or reporting month"
      temporal_coverage: "same period as fuel record"
      site_scope: "included on-site combustion sources"
      aggregation_rule: "sum direct fossil CO2 and normalize; exclude upstream fuel and electricity emissions"
      quality_evidence: "monitor calibration or signed calculation sheet and supplier carbon data"
    - protocol_id: cp_surface_treatment_inputs
      process_id: "surface_finishing_and_cleaning"
      flow_role: "water, sodium hydroxide and abrasive"
      record_type: "line meter, bath log and material issue record"
      raw_fields: "water; chemical solution mass; concentration; abrasive issue; recovered abrasive; bath id; product lot"
      collection_method: "meter water and reconcile chemical or abrasive issues, returns and stock change"
      unit: "kg"
      frequency: "each shift or batch"
      temporal_coverage: "same period as finished production"
      site_scope: "all included finishing operations"
      aggregation_rule: "calculate neat chemical and net abrasive consumption, then normalize"
      quality_evidence: "meter calibration, bath analysis and stock reconciliation"
    - protocol_id: cp_wastewater
      process_id: "surface_finishing_and_cleaning"
      flow_role: "alkaline finishing wastewater"
      record_type: "discharge meter, tank-volume and laboratory record"
      raw_fields: "wastewater mass or volume; density; pH; metal concentration; treatment; destination; time"
      collection_method: "meter discharge or use calibrated tank change with density conversion"
      unit: "kg"
      frequency: "each discharge or continuously"
      temporal_coverage: "same period as finishing production"
      site_scope: "all included finishing drains"
      aggregation_rule: "aggregate before dilution and avoid double-counting treatment recirculation"
      quality_evidence: "meter calibration, laboratory report and transfer receipt"
    - protocol_id: cp_dust_and_pm
      process_id: "surface_finishing_and_cleaning"
      flow_role: "captured dust and direct PM10"
      record_type: "filter weight, container weight, source test or validated calculation"
      raw_fields: "gross and tare mass; filter change; PM10 result; airflow; run time; release point; compartment"
      collection_method: "weigh captured dust separately and measure or calculate uncaptured PM10 for the confirmed release point"
      unit: "kg"
      frequency: "each filter or container change and each required source test"
      temporal_coverage: "representative production period"
      site_scope: "all included finishing extraction points"
      aggregation_rule: "reconcile captured and released particulate without double-counting"
      quality_evidence: "scale calibration, source-test report and release-point record"
    - protocol_id: cp_packaging_materials
      process_id: "final_inspection_and_packaging"
      flow_role: "corrugated box and LDPE film"
      record_type: "packaging bill of material and supplier specification"
      raw_fields: "component id; unit mass; units issued; return; waste; product units; lot"
      collection_method: "verify unit mass by weighing and reconcile issues and returns"
      unit: "kg"
      frequency: "each packaging lot"
      temporal_coverage: "same period as finished production"
      site_scope: "all included packaging lines"
      aggregation_rule: "net component mass supplied with saleable product divided by net product mass"
      quality_evidence: "supplier specification, sample weighing and stock reconciliation"
    - protocol_id: cp_finished_product
      process_id: "finishing_and_packaging_processes"
      flow_role: "inspected and reference product"
      record_type: "final scale, item-count and release record"
      raw_fields: "net product mass; item count; mean item mass; rejects; specification; packaging tare; lot id"
      collection_method: "weigh accepted dry product before packaging and reconcile released quantity"
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "representative 12 months or declared campaign"
      site_scope: "all included product lines"
      aggregation_rule: "sum accepted net mass and set reference output to 1 kg"
      quality_evidence: "scale calibration, inspection release and count-to-mass record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground rows"
      rule: "normalized amount = attributable exchange amount / accepted net finished-product mass"
      inputs:
        - "attributable exchange"
        - "accepted net mass"
      output: "exchange per 1 kg net finished article"
      source_ids:
        - ec-pef-method-2021
    - id: calc_count_to_mass
      applies_to: "count-only records"
      rule: "mass = item count × measured product-specific mean item mass"
      inputs:
        - "item count"
        - "sampled item masses"
      output: "kg product or packaging"
      source_ids:
        - ec-pef-method-2021
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_cutting_fluid_consumption
      applies_to: "cutting fluid"
      rule: "consumed mass = opening stock + purchases or issues - closing stock - unchanged return - clean recovered fluid"
      inputs:
        - stock
        - issue
        - "return and recovery records"
      output: "net cutting-fluid consumption"
      source_ids:
        - us-epa-fabricated-metal-sector-notebook-1995
    - id: calc_direct_fossil_co2
      applies_to: "natural-gas combustion"
      rule: "use direct measured CO2; otherwise apply the documented facility-specific fuel-carbon and oxidation calculation to collected gas"
      inputs:
        - "direct monitor or gas volume"
        - "carbon content and oxidation method"
      output: "kg direct fossil CO2"
      source_ids:
        - ec-pef-method-2021
    - id: calc_metal_balance
      applies_to: "metal-bearing flows"
      rule: "input metal mass = net product metal + outgoing scrap + captured metal-bearing dust + direct metal release + documented stock change and retained intermediates"
      inputs:
        - stock
        - product
        - scrap
        - dust
        - "release and stock records"
      output: "mass-balance difference and reconciliation ratio"
      source_ids:
        - us-epa-fabricated-metal-sector-notebook-1995
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Retain product drawing or specification, material certificate, measured net mass, finish, component and packaging configuration and service-life claim."
      evidence: "approved specification, certificate and inspection release"
    - id: dq_temporal_alignment
      applies_to: "all foreground data"
      requirement: "Use one common representative period; disclose campaigns, shutdowns, rework and any extrapolation."
      evidence: "dated production, meter, stock and waste records"
    - id: dq_meter_traceability
      applies_to: "mass, energy, water and gas"
      requirement: "Identify each meter or scale, calibration status, resolution and allocation boundary."
      evidence: "current calibration certificate and meter map"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile purchasing, stock change, production output and waste transfers; explain every missing or estimated exchange."
      evidence: "signed reconciliation and completeness checklist"
    - id: dq_route_specificity
      applies_to: "conditional processes"
      requirement: "Document whether thermal treatment, chemical finishing, coating, joining and each packaging component applies; do not average absent operations into the product."
      evidence: "route sheet, batch traveller and bill of materials"
    - id: dq_background_linkage
      applies_to: "purchased inputs"
      requirement: "Use upstream datasets compatible with material state, alloy or formulation, supplier geography, technology and delivery boundary; disclose every proxy."
      evidence: "dataset metadata and proxy justification"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Fail the data package if product family, principal metal, alloy, net mass, route, finish, component set, factory geography, packaging or service-life qualifier is missing."
    source_ids:
      - un-cpc-3-0-2025
      - ec-pef-method-2021
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Confirm that the published reference output is exactly 1 kg net finished article and excludes all packaging mass."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_inventory_identity
    applies_to: "every inventory row"
    rule: "Require one atomic selected flow with a confirmed UUID or an explicit unresolved identity finding; reject umbrella utilities, materials, wastes or emissions."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "product route"
    rule: "Match every required process and each applicable conditional process to production records; record a justified not-applicable decision for omitted conditional stages."
    source_ids:
      - us-epa-fabricated-metal-sector-notebook-1995
      - ec-jrc-stm-bref-2006
  - rule_id: validate_metal_balance
    applies_to: "metal-bearing inventory"
    rule: "Investigate and disclose any unreconciled difference among input stock, net product, scrap, captured dust, direct release, stock change and retained intermediate mass."
    source_ids:
      - us-epa-fabricated-metal-sector-notebook-1995
  - rule_id: validate_utility_conversion
    applies_to: "electricity, gas and water"
    rule: "Recompute kWh-to-MJ, gas reference-condition and water volume-to-mass conversions from retained raw records."
    source_ids:
      - ec-pef-method-2021
  - rule_id: validate_waste_destination
    applies_to: "all waste outputs"
    rule: "Require measured mass, source process, composition qualifier and treatment or recycling destination for each concrete waste flow."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: validate_ranges
    applies_to: "important quantitative flows"
    rule: "Treat the absence of two independent compatible sources as an unresolved range-evidence need; do not invent an acceptance range or use a single published case as a range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Candidate foreground manufacturing dataset that may become a secondary_dataset or background_dataset after methodology review, UUID closure and dataset quality review"
  downstream_use: "Product-specific gate-to-gate process datasets and lifecyclemodel inputs for declared metal household articles"
  allowed_use: "Modelling the declared factory, product, alloy, route, finish and packaging configuration after all required qualifiers and unresolved identities are addressed"
  excluded_use: "Unqualified CPC-wide averages; automatic substitution among steel, copper, aluminium and iron products; cradle-to-grave or comparative claims without distribution, use, lifetime and end-of-life modelling"
  required_metadata: "PCR id; product specification; CPC context; principal metal and alloy; net mass and item count; route and conditional stages; finish and coating; site and period; energy and water supply; allocation; packaging; UUID and proxy status"
  required_quality_disclosure: "Measurement coverage and calibration; count-to-mass sampling; metal balance; meter allocation; data gaps; estimates; background-dataset compatibility; waste destinations; direct-release method; unresolved UUIDs and range evidence needs"
  update_trigger: "Material change in product design, alloy, supplier, forming or finishing technology, thermal route, packaging, energy or water supply, allocation, regulation, foreground period, or Tiangong flow identity"
