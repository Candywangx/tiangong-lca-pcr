system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts with receipt of purchased, specification-conforming metal stock and other purchased components and ends with the dry, inspected and packaged article at the factory gate. It includes stock handling, cutting, forming, trimming, route-required thermal treatment, mechanical or chemical surface preparation, finishing, cleaning, direct utilities, direct releases, waste collection, inspection and packaging. Upstream production and delivery of purchased metal, chemicals, fuels, electricity and packaging are represented by linked background datasets. Primary metal making is not duplicated in the foreground."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Conditional processes are included only when the declared product route uses them. A data package shall not replace a concrete exchange with a generic material, utility, waste or emission collection."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground system"
      rule: "Include all factory processes from purchased-stock receipt through inspected and packaged product dispatch; link purchased inputs to upstream datasets and keep distribution, use and end-of-life outside this gate-to-gate foreground boundary."
      source_ids:
        - ec-pef-method-2021
    - rule_id: boundary_route_instantiation
      applies_to: "product route"
      rule: "Instantiate only the processes used by the declared product, but preserve separate atomic rows for every material, energy, waste and direct elementary exchange."
      source_ids:
        - us-epa-fabricated-metal-sector-notebook-1995
    - rule_id: boundary_surface_treatment
      applies_to: "chemical or electrolytic surface treatment"
      rule: "When a water-based surface-treatment line is used, include pretreatment, core treatment, rinsing, drying, water and energy, bath chemicals, drag-out, wastewater, spent solution, sludge and direct air releases."
      source_ids:
        - ec-jrc-stm-bref-2006
boundary_abstraction:
  declared_starting_condition: "Purchased metal stock and purchased components meeting the declared alloy, form, finish and supplier specifications at the foreground factory receiving point"
  starting_condition_role: "foreground gate input with upstream production and inbound delivery represented by linked background datasets"
  product_classification_scope: "Classification is used to confirm covered product identity only; route, alloy, construction and market state are declared independently"
  recursive_input_rule: "A purchased input that is itself a finished covered household article is recorded as a separate product input with supplier identity and upstream dataset and is not recursively re-manufactured inside this foreground system"
  upstream_dataset_requirement: "Link each purchased metal, chemical, energy carrier, component and packaging input to a geography-, technology- and state-compatible upstream dataset; disclose any proxy rather than silently substituting it"
  disclosure: "Declare product identity, alloy, stock form, route, included and omitted conditional processes, coating and finish, packaging, site geography, reporting period, allocation and every foreground exclusion"
