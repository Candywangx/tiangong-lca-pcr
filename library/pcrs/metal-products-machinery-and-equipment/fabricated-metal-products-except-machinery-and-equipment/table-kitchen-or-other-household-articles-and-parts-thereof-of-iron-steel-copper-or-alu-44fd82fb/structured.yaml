      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer mass measurement; when a volume meter is used, retain volume and the measured or documented density used for conversion."
  - id: material_balance
    applies_to: "metal stock, product, scrap and captured dust"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile metal-bearing inputs with saleable product, transferred intermediates, scrap, captured dust and measured direct releases for the same reporting period and product allocation."
