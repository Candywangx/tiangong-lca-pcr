measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh saleable product after final inspection and before packaging. Exclude all packaging mass and normalize every foreground exchange to 1 kg net finished article."
  - id: item_to_mass
    applies_to: "count-based production and packaging records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert item counts using a measured, product-specific mean item mass and retain sample size, weighing date and dispersion; do not use a nominal catalogue mass without verification."
  - id: electricity_energy
    applies_to: "all electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered kWh in raw records and convert to MJ using 1 kWh = 3.6 MJ; disclose voltage, grid geography, contractual supply and whether losses are included."
  - id: gas_volume_basis
    applies_to: "natural-gas row"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record meter volume and its temperature, pressure and dry or wet reference conditions; convert only with a documented site or supplier method."
  - id: water_mass_basis
