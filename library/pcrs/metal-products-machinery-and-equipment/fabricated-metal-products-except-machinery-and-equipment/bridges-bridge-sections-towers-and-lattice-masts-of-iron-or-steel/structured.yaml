system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground_system_boundary"
      rule: "Include all material, energy, water, waste and direct-emission exchanges attributable to receiving, fabrication, joining, route-specific finishing, inspection, repair before release, internal movement and factory-gate dispatch preparation."
      source_ids:
        - eu-pef-2021-2279
        - fhwa-bridge-welding-reference-manual-2020
    - rule_id: boundary_outsourced_steps
      applies_to: "outsourced_fabrication"
      rule: "Include outsourced cutting, forming, welding, heat treatment, surface preparation or coating that is part of the released product, using supplier-specific activity data or a disclosed representative dataset; do not omit it because it occurs off site."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_exclusions
      applies_to: "downstream_and_capital_scope"
      rule: "Exclude construction-site erection, civil works, distribution after the factory gate, use, maintenance, demolition and end-of-life. Exclude capital goods only when the study's governing method permits it and disclose the exclusion."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_complete_atomic_flows
      applies_to: "foreground_inventory_completeness"
      rule: "Add every actual material, fastener, welding consumable, shielding gas, abrasive, chemical, coating component, fuel, utility, waste and elementary emission as a separate atomic exchange when it crosses the declared boundary, even when it is not one of the common rows below."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Purchased steel plate, structural sections, permanent bought-in components, welding consumables, auxiliaries, coating materials, fuels and utilities as received at the reporting factory boundary"
  starting_condition_role: "Purchased-input gate for foreground factory fabrication"
  product_classification_scope: "Factory-fabricated iron or steel bridges, bridge sections, towers and lattice masts; not completed construction assets or erection/construction services"
  recursive_input_rule: "If a purchased bridge section, tower section, or other input is itself within this PCR category, record it as a distinct product input with supplier quantity and an upstream dataset ending at that supplier's gate; do not silently fold it into the reporting factory's own output or create a self-referential aggregate."
  upstream_dataset_requirement: "Link each purchased material, utility, fuel, chemical and externally fabricated component to a geographically and technologically representative upstream dataset; disclose proxies and supplier-specific data gaps."
  disclosure: "Declare included factory operations, outsourced operations, coating route, joining route, treatment of internal returns, allocation method, cut-offs, added atomic exchanges, factory location, reporting period, and the exact factory-gate release condition."
