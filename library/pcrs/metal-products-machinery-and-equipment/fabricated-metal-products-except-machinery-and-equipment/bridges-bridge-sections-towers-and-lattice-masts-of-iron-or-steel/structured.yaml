allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by separately metering, batch-recording or otherwise subdividing operations and utilities directly attributable to the declared product lot."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_causality
    applies_to: "shared_factory_operations"
    rule: "When subdivision is not feasible, use a documented causal physical driver such as measured machine time, weld length, cutting time, coating area, lifted mass-distance or occupied process time. Product mass alone is permitted only when shown to represent the shared operation's physical causality."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "residual_multifunctionality"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision, system expansion and a relevant physical relationship are not feasible; disclose prices, period and sensitivity when economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap_no_hidden_credit
    applies_to: "post_industrial_steel_scrap"
    rule: "Record post-industrial steel scrap at its measured mass and destination. Do not apply an avoided-primary-steel credit or recycling substitution inside this factory-gate inventory unless the governing study method explicitly requires it and the method is disclosed without double counting."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_consumable_records
      process_id: "integrated_structural_fabrication"
      flow_role: "in_medium_plate; in_hot_rolled_large_section; in_flux_cored_wire; in_sodium_hydroxide; in_shg_zinc_metal; in_zinc_rich_epoxy_primer"
      record_type: "Purchase receipt, material certificate, stock issue/return, batch mix and bath inventory record"
      raw_fields: "product identity; supplier; lot; grade/formulation; gross issued quantity; unused return; concentration or solids; unit; date; linked product lot"
      collection_method: "Reconcile traceable receipt and issue records to the fabrication lot; use calibrated weighing where available and retain conversions"
      unit: "kg"
      frequency: "Per receipt and issue; reconcile per lot and reporting period"
      temporal_coverage: "Complete production period represented by the dataset"
      site_scope: "All included lines and storage/issue points at the reporting factory, plus in-scope outsourced records"
      aggregation_rule: "Sum consumed quantity by atomic product identity, subtract only documented reusable return, then normalize by released net product mass"
      quality_evidence: "Purchase records; material certificates; stock ledger; scale calibration; batch sheet; bath reconciliation; lot traceability"
    - protocol_id: cp_utility_and_fuel_records
      process_id: "integrated_structural_fabrication"
      flow_role: "in_industrial_oxygen; in_natural_gas; in_electricity; in_diesel_fuel; in_process_water"
      record_type: "Calibrated submeter, supplier invoice, tank/stock reconciliation or equipment log"
      raw_fields: "meter start/end; corrected quantity; unit; reference conditions; fuel grade; meter location; operating hours; allocation driver; lot; date"
      collection_method: "Prefer lot or process submeters; otherwise reconcile facility totals and allocate using the documented causal driver"
      unit: "m3, MJ or kg as specified by the row"
      frequency: "Continuous or per delivery, aggregated at least monthly and reconciled to the lot"
      temporal_coverage: "Same period as released product, with opening/closing inventory where relevant"
      site_scope: "All in-scope meters, tanks and equipment; exclude quantities already included in outsourced datasets"
      aggregation_rule: "Subtract exports and out-of-boundary uses, allocate only the remaining in-scope quantity, convert units audibly, then normalize"
      quality_evidence: "Meter calibration; invoices; tank dip or stock balance; equipment log; allocation worksheet; reference-condition record"
    - protocol_id: cp_product_release_records
      process_id: "integrated_structural_fabrication"
      flow_role: "out_reference_product"
      record_type: "Release certificate, calibrated scale record, shipping mass record or drawing-controlled permanent-component BOM"
      raw_fields: "product subtype; lot; drawing revision; component mass; permanent fastener mass; coating mass; excluded fixture mass; acceptance status; release date"
      collection_method: "Prefer direct calibrated weighing; otherwise sum verified permanent-component masses and reconcile against shipping or weighbridge data"
      unit: "kg"
      frequency: "Per released lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "All covered products released by the reporting factory"
      aggregation_rule: "Include accepted permanent product mass only; exclude reusable fixtures and unreleased/reworked inventory; sum lots before normalization"
      quality_evidence: "Release certificate; inspection acceptance; scale calibration; signed BOM; shipping mass reconciliation"
    - protocol_id: cp_scrap_and_waste_records
      process_id: "integrated_structural_fabrication"
      flow_role: "out_post_industrial_steel_scrap"
      record_type: "Segregated waste scale ticket and stock movement record"
      raw_fields: "waste identity; alloy/coating contamination; mass; container tare; source lot/process; internal reuse; destination; date"
      collection_method: "Weigh each outbound segregated scrap stream; reconcile internal return before classifying material as waste"
      unit: "kg"
      frequency: "Per shipment with monthly reconciliation"
      temporal_coverage: "Same period as production records"
      site_scope: "All fabrication, repair and rejection areas in scope"
      aggregation_rule: "Sum only scrap crossing the foreground boundary, net of documented internal reuse; keep other wastes as separate atomic rows"
      quality_evidence: "Calibrated scale tickets; waste transfer note; recycler receipt; internal return ledger"
    - protocol_id: cp_direct_combustion_records
      process_id: "integrated_structural_fabrication"
      flow_role: "out_co2_fossil_natural_gas; out_co2_fossil_diesel"
      record_type: "Continuous emission monitor or fuel-consumption and emission-factor calculation record"
      raw_fields: "fuel row; quantity; composition/grade; fossil fraction; factor value; factor unit; factor source and year; oxidation assumption; monitor result; lot allocation"
      collection_method: "Use direct monitoring when representative; otherwise multiply measured fuel use by a documented factor compatible with fuel, geography and period, and keep gas and diesel calculations separate"
      unit: "kg CO2"
      frequency: "Per monitoring interval or fuel reconciliation; aggregate with production period"
      temporal_coverage: "Same period as fuel and released-product records"
      site_scope: "All direct combustion sources inside the foreground boundary"
      aggregation_rule: "Sum direct fossil CO2 by fuel and source, exclude upstream supply emissions, allocate using the same causal driver as fuel, then normalize"
      quality_evidence: "Monitor QA record or complete factor citation; fuel record; calculation workbook; allocation record; independent check"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = period or lot amount × 1,000 / released net product mass in kg; calculate before rounding and preserve the unrounded value"
      inputs:
        - "atomic lot or period amount"
        - "released net product mass"
      output: "row amount per 1,000 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_released_net_mass
      applies_to: "out_reference_product"
      rule: "Prefer calibrated direct mass. If calculated, sum permanent accepted steel, permanent fasteners and shop-applied coating mass, subtract only documented reusable fixtures and packaging not sold as product, and reconcile with shipping mass."
      inputs:
        - "accepted component/BOM masses"
        - "coating mass"
        - "scale or shipping reconciliation"
      output: "released net product mass"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_resource_allocation
      applies_to: "Shared utilities and consumables"
      rule: "Allocate the reconciled in-scope total using the selected causal physical driver; allocation fractions across all products sharing the total must sum to 1 before normalization."
      inputs:
        - "reconciled resource total"
        - "product-specific driver values"
      output: "allocated lot resource quantity"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_direct_fossil_co2
      applies_to: "out_co2_fossil_natural_gas; out_co2_fossil_diesel"
      rule: "For each fuel separately, direct fossil CO2 = measured fuel quantity × documented compatible fossil CO2 factor, adjusted only for a documented fossil fraction; do not add upstream supply emissions to these elementary rows."
      inputs:
        - "measured fuel quantity"
        - factor
        - "fossil fraction"
        - "direct monitor result when used"
      output: "direct fossil CO2 mass by fuel"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_traceability
      applies_to: "Reference product and steel inputs"
      requirement: "Link each released lot to drawings, product subtype, steel grades, material certificates, component/BOM records, joining route, coating state and release acceptance."
      evidence: "Drawing register; material certificates; route card; release certificate"
    - id: dq_temporal_completeness
      applies_to: "All foreground rows"
      requirement: "Cover a representative continuous production period, normally at least 12 months where production is recurring; disclose shorter campaigns, shutdowns, atypical projects and inventory changes."
      evidence: "Production calendar; meter/invoice period reconciliation; lot list"
    - id: dq_atomic_completeness
      applies_to: "Foreground inventory"
      requirement: "Reconcile the actual BOM, consumable ledger, utility meters, fuel records, waste records and environmental permits. Add every additional crossing as an atomic row and justify any omission under the governing cut-off rule."
      evidence: "Signed completeness reconciliation and cut-off log"
    - id: dq_measurement_quality
      applies_to: "Measured quantities"
      requirement: "Record instrument, calibration status, resolution, reference conditions, conversion factors and estimation share; flag missing or expired calibration."
      evidence: "Calibration certificates; meter register; conversion worksheet"
    - id: dq_representativeness
      applies_to: "Upstream datasets and shared allocations"
      requirement: "Evaluate technological, geographical and temporal match; identify proxies and quantify the foreground share based on estimates rather than direct records."
      evidence: "Data-quality assessment; supplier geography; dataset metadata; allocation worksheet"
    - id: dq_route_separation
      applies_to: "Welding, coating, fuel and water rows"
      requirement: "Demonstrate that not-applicable routes were excluded and that route-specific exchanges were not averaged into products that did not undergo those operations."
      evidence: "Route card; work order; coating/welding procedure; lot-level allocation"
    - id: dq_emission_factor_provenance
      applies_to: "Calculated direct emissions"
      requirement: "Retain full factor identity, publisher, version/year, fuel basis, geography, units, oxidation and fossil-fraction assumptions; an undocumented default factor is not acceptable."
      evidence: "Factor source and calculation review record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference_flow_and_metadata"
    rule: "Confirm the reference UUID, 1,000 kg mass basis, product subtype, drawing/revision, steel grade, fabrication route, coating state, geography, period and factory-gate release condition."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-pef-2021-2279
  - rule_id: validation_process_coverage
    applies_to: "foreground_processes"
    rule: "Confirm all in-scope receipt, cutting/forming/machining, joining, route-specific finishing, inspection, repair, internal movement and dispatch-preparation operations are represented directly or through a disclosed in-scope outsourced dataset."
    source_ids:
      - eu-pef-2021-2279
      - fhwa-bridge-welding-reference-manual-2020
  - rule_id: validation_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm each exchange is one physical product, waste or elementary flow; split additional electrodes, fluxes, gases, fasteners, abrasives, coatings, fuels, water grades, wastes and emissions rather than using collection labels."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_mass_reconciliation
    applies_to: "steel_and_product_mass"
    rule: "Reconcile issued steel = released product steel content + post-industrial steel scrap + internal return + work-in-progress change + measured process loss, with every residual investigated and disclosed."
    source_ids: []
  - rule_id: validation_utility_reconciliation
    applies_to: "electricity_fuels_gases_water"
    rule: "Reconcile submeter or allocated lot totals to facility meters, invoices and opening/closing stocks; allocation fractions for each shared total must sum to 1."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_route_conditions
    applies_to: "conditional_rows"
    rule: "Verify each conditional input and output against work orders and procedure records; absent oxygen, natural gas, diesel, water, sodium hydroxide, galvanizing zinc, primer or direct-combustion routes must be marked not applicable rather than zero-filled into an average."
    source_ids:
      - fhwa-bridge-welding-reference-manual-2020
      - fhwa-thermal-spray-coatings-2014
      - fhwa-one-coat-steel-bridges-2011
  - rule_id: validation_coating_compatibility
    applies_to: "coated_products"
    rule: "Confirm coating identity, layer/system, surface preparation, application location, wet/dry basis and inclusion of permanent coating mass are consistent with the declared released product."
    source_ids:
      - fhwa-thermal-spray-coatings-2014
      - fhwa-one-coat-steel-bridges-2011
  - rule_id: validation_direct_emissions
    applies_to: "direct_combustion"
    rule: "Confirm natural-gas and diesel fossil CO2 rows include direct foreground combustion only, use measured fuel or representative monitoring, and retain compatible factor provenance and fossil fraction without double counting upstream emissions."
    source_ids: []
  - rule_id: validation_data_quality
    applies_to: "dataset_release"
    rule: "Confirm temporal coverage, calibration, source traceability, data gaps, proxy use, cut-offs, allocation and uncertainty disclosures are complete enough for the stated downstream role."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Product-specific or facility-average factory-gate inventory dataset for a declared iron/steel bridge, bridge section, tower or lattice mast product"
  downstream_use: "May be used as a secondary_dataset or background_dataset for construction, infrastructure, energy or communications systems when product subtype, geography, technology, period and factory-gate boundary match"
  allowed_use: "Product-specific modelling; supplier or facility benchmarking with aligned scopes; downstream construction and asset models that add transport, erection, use, maintenance and end-of-life explicitly"
  excluded_use: "Constructed-bridge or installed-tower results; erection/construction service datasets; generic structural steel production; use-stage durability claims; substitution or recycling credits not documented by the consuming method"
  required_metadata: "PCR id and version/status; reference UUID and amount; product subtype; complete/section scope; drawing/specification; steel grade; joining and coating routes; net-mass method; factory and geography; period; allocation; cut-offs; upstream dataset list; added atomic exchanges"
  required_quality_disclosure: "Foreground versus estimated shares; measurement/calibration status; temporal, geographical and technological representativeness; material and utility reconciliation; factor provenance; unresolved flow identities; uncertainty and proxy use"
  update_trigger: "Material change in product design or mass, steel grade or supplier route, welding/assembly technology, coating system, factory energy mix, fuel, allocation method, outsourced scope, emission factor, geography, or reporting period; or resolution of an unresolved UUID/range evidence need"
