    applies_to: "Reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure or calculate the released net mass of permanent product components, including permanent fasteners and shop-applied metallic or paint coatings; exclude reusable lifting and transport fixtures and separately shipped installation consumables."
  - id: mass_input_consistency
    applies_to: "Steel, welding consumables, chemicals, coatings and scrap"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record physical mass crossing the foreground boundary. For solutions or formulated coatings, record delivered product mass and declare concentration, solids content, density conversion, and unused return separately where relevant."
  - id: metered_electricity
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the original metered energy unit and apply an auditable exact unit conversion to MJ; do not derive electricity from cost. Declare grid, voltage level, geography, losses boundary, and any on-site generation or export separately."
