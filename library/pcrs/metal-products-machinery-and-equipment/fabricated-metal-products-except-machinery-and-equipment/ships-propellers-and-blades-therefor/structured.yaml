allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground operations"
    rule: "Avoid allocation by separately metering or engineering-allocation of pattern/mould, foundry, machining, balancing, and inspection operations to the production order."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: allocation_rule_2
    applies_to: "reusable patterns and shared tooling"
    rule: "Allocate net pattern and shared-tooling consumption over actual conforming output during the documented service life; disclose lifetime output, replacement, residual inventory, and allocation basis. Do not charge the full reusable pattern to every product."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: allocation_rule_3
    applies_to: "internal sand and alloy loops"
    rule: "Keep internally reclaimed sand and internally remelted alloy inside the foreground system. Report only virgin or externally purchased make-up and material that crosses the boundary, and reconcile the internal-loop quantities without applying an avoided-production credit."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: allocation_rule_4
    applies_to: "externally transferred recyclable metal"
    rule: "State whether externally transferred metal is treated by cut-off, substitution, or another study-required allocation method. The default dataset profile uses cut-off: no avoided-primary-metal credit is assigned to the propeller dataset, and recycling burdens belong to the subsequent product system."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: allocation_rule_5
    applies_to: "multiple propellers, blades, or alloy grades in one batch"
    rule: "Prefer batch-specific mass and energy records. If a shared measured total cannot be subdivided, allocate by a documented causal parameter; use processed metal mass only when no better driver exists and disclose the affected rows and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_metal_mass_balance
      process_id: "p_mould_and_cast_p_finish_and_release"
      flow_role: "alloy charge, rough casting, internal returns, external scrap and swarf"
      record_type: "batch weigh tickets and inventory movements"
      raw_fields: "batch id; alloy designation; charge mass; rough-casting mass; internal-return mass; external-scrap mass; swarf mass; other metal loss; destination"
      collection_method: "calibrated scales linked to production and waste-transfer records"
      unit: "kg"
      frequency: "each batch and transfer"
      temporal_coverage: "complete reporting period, normally at least 12 consecutive months or all production when shorter"
      site_scope: "all in-scope foundry and finishing operations"
      aggregation_rule: "reconcile by alloy and batch, allocate only documented shared streams, then divide by accepted product mass"
      quality_evidence: "calibration certificates; batch heat records; weigh tickets; recycler receipts; signed reconciliation"
    - protocol_id: cp_mould_materials
      process_id: "p_mould_and_cast"
      flow_role: "wood, silica sand, cement and spent moulding sand"
      record_type: "purchase, issue, recipe, inventory and waste records"
      raw_fields: "material identity; supplier; received mass; batch issue; reclaimed sand; pattern life output; closing inventory; spent-sand mass; binder system"
      collection_method: "weigh incoming and issued materials; reconcile pattern inventory and sand reclamation"
      unit: "kg"
      frequency: "each receipt, mould batch and waste transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope mould preparation, reclamation and knock-out"
      aggregation_rule: "net external input or output divided by accepted product mass; reusable wood is amortized over documented lifetime output"
      quality_evidence: "scale calibration; recipe sheets; stock counts; pattern register; waste manifests"
    - protocol_id: cp_mould_cast_energy
      process_id: "p_mould_and_cast"
      flow_role: "electricity and natural gas"
      record_type: "submeters, production logs and supplier invoices"
      raw_fields: "meter id; opening and closing reading; unit; reference conditions; furnace or burner id; batch id; operating hours; allocation driver"
      collection_method: "direct submetering preferred; reconcile to invoice totals"
      unit: "MJ for electricity; m3 for natural gas"
      frequency: "each batch or meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope pattern, mould and casting equipment"
      aggregation_rule: "convert electricity using 3.6 MJ/kWh; allocate verified shared meter totals causally; divide by accepted product mass"
      quality_evidence: "meter calibration; invoices; production logs; reconciliation statement"
    - protocol_id: cp_finish_energy
      process_id: "p_finish_and_release"
      flow_role: "electricity"
      record_type: "submeters, machine logs and supplier invoices"
      raw_fields: "meter id; readings; machine id; production order; operating hours; accepted output"
      collection_method: "direct machine or cell submetering preferred"
      unit: "MJ"
      frequency: "each production order or meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope machining, grinding, polishing, balancing and inspection equipment"
      aggregation_rule: "convert using 3.6 MJ/kWh, reconcile shared totals and divide by accepted product mass"
      quality_evidence: "meter calibration; invoices; machine logs; allocation workbook"
    - protocol_id: cp_water_and_cutting_fluid
      process_id: "p_finish_and_release"
      flow_role: "process water, cutting-fluid make-up and spent cutting fluid"
      record_type: "meters, purchase/issue records, tank inventory and waste manifests"
      raw_fields: "formulation; concentration; received mass; water volume; density; tank opening and closing stock; make-up; purge; waste mass; treatment route"
      collection_method: "meter or weigh net make-up and outgoing purge after recirculation"
      unit: "kg"
      frequency: "each make-up, purge or reporting interval"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope wet machining and aqueous cleaning"
      aggregation_rule: "reconcile formulation-specific input, retained inventory and output; divide net boundary crossings by accepted product mass"
      quality_evidence: "meter calibration; safety data sheet; density/concentration tests; stock reconciliation; waste manifest"
    - protocol_id: cp_direct_emissions
      process_id: "p_mould_and_cast"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack monitoring or verified facility emissions ledger"
      raw_fields: "source id; fuel type; monitoring result; production order; allocation driver; excluded upstream emissions"
      collection_method: "direct measurement preferred; otherwise use a facility ledger already verified under the declared reporting method"
      unit: "kg"
      frequency: "each monitored campaign or reporting interval"
      temporal_coverage: "complete reporting period"
      site_scope: "in-scope on-site combustion sources only"
      aggregation_rule: "remove out-of-boundary sources, allocate by documented causal driver and divide by accepted product mass"
      quality_evidence: "monitoring QA; instrument calibration; verified ledger; source-boundary reconciliation"
    - protocol_id: cp_product_release
      process_id: "p_finish_and_release"
      flow_role: "accepted reference product"
      record_type: "final inspection and dispatch records"
      raw_fields: "serial/order id; product form; alloy; drawing; net mass; dimensions; blade count; tolerance class; balance result; NDT result; surface finish; acceptance; dispatch date"
      collection_method: "calibrated final weighing linked to approved inspection dossier"
      unit: "kg"
      frequency: "each released product"
      temporal_coverage: "complete reporting period"
      site_scope: "all in-scope accepted output"
      aggregation_rule: "sum accepted net mass only; exclude rejects, packaging and unaccepted work in progress; normalize inventory to 1 kg"
      quality_evidence: "scale calibration; dimensional report; balance report; material certificate; NDT report; release certificate"
  calculation_rules:
    - id: calculation_rule_1
      applies_to: "all inventory rows"
      rule: "Normalized amount = attributable boundary-crossing amount / net accepted product mass."
      inputs:
        - "protocol-specific attributable amount"
        - "accepted net mass from cp_product_release"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calculation_rule_2
      applies_to: "electricity rows"
      rule: "Electricity (MJ) = metered electricity (kWh) × 3.6; retain unrounded source reading and report conversion precision."
      inputs:
        - "kWh meter reading"
      output: "MJ electricity"
      source_ids: []
    - id: calculation_rule_3
      applies_to: "metal balance"
      rule: "External alloy charge + opening in-process metal = accepted product + external scrap + measured other metal losses + closing in-process metal; internal remelt cancels inside the boundary. Investigate and disclose any residual."
      inputs:
        - "cp_metal_mass_balance fields"
      output: "reconciled metal balance and normalized metal rows"
      source_ids:
        - saai-et-al-2025-propeller-lca
    - id: calculation_rule_4
      applies_to: "reusable wooden pattern"
      rule: "Allocated pattern wood = net wood consumption during documented pattern life × production-order accepted output / total accepted output from that pattern, unless a stronger causal driver is documented."
      inputs:
        - "wood purchases and inventory"
        - "pattern register"
        - "accepted output"
      output: "kg wood assigned to the production order"
      source_ids:
        - saai-et-al-2025-propeller-lca
    - id: calculation_rule_5
      applies_to: "natural-gas reference conditions"
      rule: "Convert only with a documented gas-law or supplier factor that states source and target pressure, temperature and compressibility basis; do not mix standard and actual cubic metres."
      inputs:
        - "metered volume and reference conditions"
      output: "m3 at declared reference conditions"
      source_ids: []
  data_quality_requirements:
    - id: quality_requirement_1
      applies_to: "product identity"
      requirement: "Link every production order to the drawing, product form, alloy heat, dimensional and balance requirements, inspection plan, and release status."
      evidence: "material certificate, heat record, drawing revision, dimensional report, balance report, NDT report and release certificate"
    - id: quality_requirement_2
      applies_to: "temporal representativeness"
      requirement: "Use a continuous period that captures normal campaigns, rework, rejects and shutdown-related consumption; normally at least 12 months, or all production when the product is made less frequently."
      evidence: "period coverage table and explanation of missing or abnormal intervals"
    - id: quality_requirement_3
      applies_to: "completeness"
      requirement: "Reconcile purchased materials and energy with invoices, meters and stock movement; account for internal sand and metal recovery, external wastes, and direct emissions; quantify every exclusion."
      evidence: "signed mass/energy reconciliation and cut-off register"
    - id: quality_requirement_4
      applies_to: "measurement"
      requirement: "Use calibrated instruments appropriate to the quantity and retain units, conversion factors, uncertainty or resolution, and calibration status."
      evidence: "calibration certificates, meter specifications and conversion workbook"
    - id: quality_requirement_5
      applies_to: "technology and geography"
      requirement: "Identify mould/binder system, melting equipment, finishing technology, energy mix, supplier geography, foundry site and scrap-treatment destinations."
      evidence: "process description, supplier records, meter boundary map and waste manifests"
    - id: quality_requirement_6
      applies_to: "source and UUID gaps"
      requirement: "Do not substitute broader, narrower, wrong-state or wrong-property Tiangong flows for unresolved rows. Preserve the concrete row identity and resolve it before publication when an exact state-100 identity becomes available."
      evidence: "finalized UUID-search receipts and review metadata"
    - id: quality_requirement_7
      applies_to: "quantitative ranges"
      requirement: "Treat the case values in a single publication as process-decomposition evidence, not as a range. Add an external range only after two independent original sources with compatible boundary, unit, product state, geography and technology have been reviewed."
      evidence: "range synthesis record with independence keys or unresolved range-evidence entry"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow"
    rule: "Fail if the output is not exactly 1 kg net accepted product after normalization, or if product form, alloy, route, drawing/tolerance, balance, inspection status, geography, period, packaging treatment, or factory-gate boundary is missing."
    source_ids:
      - un-cpc-3-0-structure-2025
      - iacs-ur-w24-2024
  - rule_id: validation_rule_2
    applies_to: "process coverage"
    rule: "Fail if either required process is absent or if the sand-cast route omits applicable mould preparation, melting/casting, knock-out/cleaning, machining/grinding/polishing, balancing, inspection, or release operations without a quantified exclusion."
    source_ids:
      - saai-et-al-2025-propeller-lca
      - iacs-ur-w24-2024
  - rule_id: validation_rule_3
    applies_to: "metal mass balance"
    rule: "Fail if rough-casting output and input do not reconcile by batch, if internal remelt is counted as new external input, or if the metal-balance residual is neither corrected nor quantified and explained."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: validation_rule_4
    applies_to: "conditional rows"
    rule: "Fail if a declared wooden-pattern, cement-bound mould, gas-preheating, wet-machining, or aqueous-cleaning route lacks its corresponding atomic input and output rows; require explicit not-applicable evidence when a conditional row is absent."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: validation_rule_5
    applies_to: "energy and direct emissions"
    rule: "Fail if electricity and on-site fuel meters do not reconcile to the site boundary or if upstream electricity emissions are reported as direct elementary emissions."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: validation_rule_6
    applies_to: "alloy quality and release"
    rule: "Fail if the declared alloy lacks its chemical/mechanical test evidence, if required dimensional or geometrical checks are missing, or if balancing and specified non-destructive testing are incomplete."
    source_ids:
      - iacs-ur-w24-2024
  - rule_id: validation_rule_7
    applies_to: "waste and recycling"
    rule: "Fail if spent moulding sand, externally transferred casting scrap, machining swarf, or spent cutting fluid is merged into an umbrella row or if destination and allocation method are undisclosed."
    source_ids:
      - saai-et-al-2025-propeller-lca
  - rule_id: validation_rule_8
    applies_to: "evidence completeness"
    rule: "Mark validation inconclusive when an unresolved UUID is silently replaced, a numeric external range lacks two independent compatible original sources, or a required collection protocol has no retained evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset suitable, after review, for use as a secondary_dataset or background_dataset"
  downstream_use: "Cradle-to-gate modelling of ships, propulsion systems, shipbuilding and replacement-component supply chains requiring a mass-based finished propeller or blade input"
  allowed_use: "Use for the declared alloy, product form, sand-cast route, foundry technology, geography, production period, and quality class; aggregate to a larger ship system only after preserving these qualifiers"
  excluded_use: "Aircraft propellers, pumps, shafts, stand-alone pitch mechanisms, composite or additively manufactured propellers, repaired propellers, installation, vessel operation, maintenance, and end-of-life unless separately modelled"
  required_metadata: "PCR id and version; product form; pitch application; alloy and recycled content; mass and dimensions; blade count; drawing/tolerance; balance and inspection status; mould/binder and melting route; finishing route; site and supplier geography; period; allocation; cut-offs; scrap and waste destinations; packaging treatment; data-owner and review status"
  required_quality_disclosure: "Coverage period and completeness; primary-data share; meter and scale calibration; metal and energy reconciliation; allocation and pattern amortization; internal recovery; unresolved UUID and range evidence; source versions; deviations from IACS or purchaser requirements"
  update_trigger: "Change in alloy or recycled content, product form, mould/binder or melting technology, material recovery, machining route, energy mix, site geography, supplier structure, allocation method, quality standard, or a material shift in normalized inputs, wastes, emissions, or product yield"
