measurement_rules:
  - id: measurement_reference_mass
    applies_to: "reference product and solid material or waste rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory to 1 kg net accepted product mass after final balancing and inspection. Exclude packaging mass and record gross-to-net conversions separately."
  - id: measurement_electricity
    applies_to: "purchased electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered electrical energy and convert kWh to MJ using exactly 1 kWh = 3.6 MJ. Declare grid geography, voltage level, on-site generation treatment, and loss boundary."
  - id: measurement_natural_gas
    applies_to: "gaseous natural-gas input"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
