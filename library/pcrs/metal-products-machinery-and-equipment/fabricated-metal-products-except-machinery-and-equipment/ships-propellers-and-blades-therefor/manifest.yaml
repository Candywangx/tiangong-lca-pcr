review_metadata:
  goal_policy_fingerprint: sha256:ca4d48461138cec48aa51cf1438775f652663ac663b161c0203fabc5dc779d27
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: alloy_charge_input
        reason_code: no_exact_candidate
        explanation: No state-100 candidate identified the composition-controlled nickel-aluminium-bronze or other approved propeller-alloy melting charge in its supplied product state.
      - row_id: wood_pattern_material_input
        reason_code: no_exact_candidate
        explanation: Available lumber candidates imposed conflicting or unsupported wood form, species, or end-use restrictions and did not exactly identify net wooden pattern material.
      - row_id: rough_propeller_casting_output
        reason_code: internal_intermediate_needs_new_flow
        explanation: The rough cast propeller or blade blank is an unfinished internal intermediate; available candidates represented finished propellers and did not distinguish this product state.
      - row_id: rough_propeller_casting_input
        reason_code: internal_intermediate_needs_new_flow
        explanation: The machining input is the same unfinished internal rough casting and needs a product-state-specific flow identity.
      - row_id: spent_moulding_sand_output
        reason_code: no_exact_candidate
        explanation: Candidates represented spent abrasive, polishing media, or mortar rather than spent foundry moulding sand with its declared binder system.
      - row_id: casting_alloy_scrap_output
        reason_code: no_exact_candidate
        explanation: No candidate exactly represented segregated propeller-alloy gates, risers, and rejected casting metal sent to recycling or returned to melting.
      - row_id: machining_swarf_output
        reason_code: no_exact_candidate
        explanation: Candidates represented slag, ferrous chips, or generic metal scrap with a non-total-mass property rather than composition-controlled propeller-alloy swarf.
      - row_id: spent_cutting_fluid_output
        reason_code: no_exact_candidate
        explanation: Candidates were limited to waste oil, broader spent coolant, or a combined oil-and-coolant mixture and did not exactly cover the declared spent cutting-fluid formulation.
    range_evidence_needs:
      - row_id: alloy_charge_input
        reason_code: insufficient_independent_sources
        explanation: Obtain at least two independent, boundary-compatible production datasets for net alloy charge per kilogram of conforming product.
      - row_id: wood_pattern_material_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent production evidence for net wood consumption after pattern reuse allocation.
      - row_id: silica_sand_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent route-compatible data for virgin silica sand after internal reclamation.
      - row_id: cement_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent evidence for cement-binder consumption for applicable mould systems.
      - row_id: mould_cast_electricity_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent metered evidence for mould preparation, melting, pouring, knock-out, and cleaning electricity.
      - row_id: natural_gas_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent evidence for gas-fired ladle or melting-pot preheating under compatible reference conditions.
      - row_id: rough_propeller_casting_output
        reason_code: insufficient_independent_sources
        explanation: Obtain independent batch evidence for the mass relationship between the cleaned rough casting and accepted output.
      - row_id: rough_propeller_casting_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent batch evidence for rough-casting mass received by finishing under a compatible product state.
      - row_id: spent_moulding_sand_output
        reason_code: insufficient_independent_sources
        explanation: Obtain independent mass-balance evidence for spent moulding material after reclamation.
      - row_id: casting_alloy_scrap_output
        reason_code: insufficient_independent_sources
        explanation: Obtain independent production evidence for segregated casting returns and externally recycled scrap.
      - row_id: fossil_carbon_dioxide_output
        reason_code: insufficient_independent_sources
        explanation: Obtain independent direct-emission or verified fuel-carbon evidence compatible with the foreground combustion boundary.
      - row_id: finish_electricity_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent metered evidence for machining, grinding, polishing, balancing, inspection, and release electricity.
      - row_id: cutting_fluid_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent production evidence for net cutting-fluid make-up under wet-machining routes.
      - row_id: process_water_input
        reason_code: insufficient_independent_sources
        explanation: Obtain independent evidence for net process-water consumption under wet machining or aqueous cleaning routes.
      - row_id: machining_swarf_output
        reason_code: insufficient_independent_sources
        explanation: Obtain independent mass-balance evidence for machining and balancing swarf sent to the declared treatment route.
      - row_id: spent_cutting_fluid_output
        reason_code: insufficient_independent_sources
        explanation: Obtain independent evidence for spent cutting-fluid purge and disposal after recirculation.
      - row_id: reference_product_output
        reason_code: insufficient_independent_sources
        explanation: Obtain at least two independent, boundary-compatible datasets to set a yield or material-efficiency QA range; the reference amount itself remains exactly 1 kg by definition.
