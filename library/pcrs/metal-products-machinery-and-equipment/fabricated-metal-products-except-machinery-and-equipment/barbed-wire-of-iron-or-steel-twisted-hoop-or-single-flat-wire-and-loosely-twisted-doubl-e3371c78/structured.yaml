allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared site operations"
    rule: "Prefer subdivision, sub-metering, production orders, and material issues that assign forming and galvanising exchanges directly to the declared product route."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "remaining shared exchanges"
    rule: "When subdivision is not feasible, allocate shared exchanges by net mass of conforming wire products only after documenting why mass reflects the physical relationship; disclose the allocation fraction and sensitivity."
    source_ids: []
  - rule_id: allocation_scrap_and_dross
    applies_to: "steel-wire scrap and zinc dross"
    rule: "Report each residue at measured mass and destination without subtracting it from gross inputs or applying an avoided-burden credit inside this factory-gate dataset."
    source_ids:
      - eu-jrc-fmp-bref-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "barbed_wire_manufacturing"
      flow_role: "steel wire, acids, zinc, flux salts and steel strapping inputs"
      record_type: "purchase, goods receipt, issue, return and stock records"
      raw_fields: "material identity; supplier; batch; delivered state; concentration or grade; opening stock; receipts; issues; returns; closing stock; mass; applicable route"
      collection_method: "Reconcile net consumption as opening stock plus receipts minus returns and closing stock; link issues to production orders"
      unit: "kg"
      frequency: "monthly with annual reconciliation"
      temporal_coverage: "at least 12 consecutive months or documented representative campaign"
      site_scope: "all lines and stores serving the declared product at the reporting site"
      aggregation_rule: "Sum route-attributable net consumption and normalize to net conforming product mass"
      quality_evidence: "calibrated scales; inventory reconciliation; supplier certificates; batch and production-order linkage"
    - protocol_id: cp_energy_and_water
      process_id: "barbed_wire_manufacturing"
      flow_role: "electricity, natural gas and process water"
      record_type: "utility meter, sub-meter and invoice records"
      raw_fields: "meter id; opening and closing readings; unit; reference conditions for gas; allocation driver; downtime; product route; output mass"
      collection_method: "Prefer dedicated meters; otherwise reconcile site totals and allocate only documented route consumption"
      unit: "MJ, m3, kg"
      frequency: "monthly"
      temporal_coverage: "at least 12 consecutive months or documented representative campaign"
      site_scope: "equipment and utilities inside the declared foreground boundary"
      aggregation_rule: "Convert units under Section 4, sum eligible consumption, and normalize to net conforming product mass"
      quality_evidence: "meter calibration; invoices; site reconciliation; allocation worksheet"
    - protocol_id: cp_product_and_waste
      process_id: "barbed_wire_manufacturing"
      flow_role: "reference product, steel-wire scrap, zinc dross and acidic rinse wastewater"
      record_type: "production, scale, weighbridge, tank and waste-transfer records"
      raw_fields: "product code; construction; coating state; gross mass; tare; net mass; reject mass; waste identity; destination; recovery status; wastewater volume or mass; density"
      collection_method: "Weigh products and solid residues; meter or tank-balance wastewater before treatment; reconcile output and reject records"
      unit: "kg"
      frequency: "per batch or shipment, aggregated monthly"
      temporal_coverage: "same period as inputs"
      site_scope: "all forming, galvanising and dispatch operations in scope"
      aggregation_rule: "Sum each atomic output separately and normalize to 1,000 kg net conforming product"
      quality_evidence: "calibrated scales; tare records; waste manifests; tank calibration; production reconciliation"
    - protocol_id: cp_air_emissions
      process_id: "barbed_wire_manufacturing"
      flow_role: "direct fossil carbon dioxide and hydrogen chloride"
      record_type: "emissions inventory, fuel record and stack-test record"
      raw_fields: "emission identity; source equipment; measurement period; measured concentration and flow where applicable; reported mass; abatement status; allocation basis"
      collection_method: "Use facility-verified direct-emission records; for HCl prefer representative post-abatement stack measurement linked to operating hours"
      unit: "kg"
      frequency: "per test and monthly or annual emissions reconciliation"
      temporal_coverage: "representative tests plus the same production period as the inventory"
      site_scope: "only foreground combustion and pickling emission points"
      aggregation_rule: "Sum direct emissions attributable to the route and normalize to net conforming product mass"
      quality_evidence: "stack-test report; instrument calibration; fuel and operating-hour reconciliation; emissions approval record"
  calculation_rules:
    - id: calc_net_material_consumption
      applies_to: "product and packaging inputs"
      rule: "opening stock + receipts - returns - closing stock; assign only documented production-order issues"
      inputs:
        - stock
        - receipt
        - "return and issue records"
      output: "net kg of each atomic material input per reporting period"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "row reporting-period amount / net conforming product mass × 1,000 kg"
      inputs:
        - "reconciled row amount"
        - "net conforming barbed-wire output"
      output: "row amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_route_exclusion
      applies_to: "conditional coating and packaging rows"
      rule: "set the row to not applicable only when route records demonstrate the operation or shipped component is absent; do not enter an arbitrary zero"
      inputs:
        - "route declaration"
        - "coating sequence"
        - "purchase specification"
        - "packaging bill of materials"
      output: "documented applicability status for each conditional row"
      source_ids:
        - eu-jrc-fmp-bref-2022
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Match production records to declared construction, material, diameters, barb geometry, strength class, coating and coil mass; segregate nonconforming products."
      evidence: "product specification; inspection record; production order; supplier or customer certificate"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Cover at least 95% of production days in the reporting period and reconcile omitted days, stock changes, rework and abnormal operations."
      evidence: "coverage calculation; exception log; inventory reconciliation"
    - id: dq_route_consistency
      applies_to: "coating-related rows"
      requirement: "Demonstrate whether coating was purchased upstream or performed in-house and apply all applicable acid, flux, zinc, water, fuel, residue and emission rows consistently."
      evidence: "route diagram; purchase specification; bath log; meter and waste records"
    - id: dq_measurement
      applies_to: "meters and scales"
      requirement: "Use calibrated or verified instruments and document any allocation from shared meters, including sensitivity for material shared loads."
      evidence: "calibration certificates; meter map; allocation worksheet"
    - id: dq_temporal_geographic
      applies_to: "published dataset"
      requirement: "Report site geography, technology, data year, capacity utilisation and representativeness; do not combine sites without retaining site-level records and weighting."
      evidence: "site metadata; annual production report; site-level aggregation file"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Reject a data package that lacks any required qualifier or mixes barbed wire with baling wire, mesh, posts, gates, cable, or non-metal fencing products."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_mass_reconciliation
    applies_to: "steel and zinc material balance"
    rule: "Confirm that issued steel and zinc are reconciled against conforming product, stock change, scrap, dross and documented process losses; investigate unexplained imbalance."
    source_ids: []
  - rule_id: validate_coating_consistency
    applies_to: "coated product route"
    rule: "Require one declared coating sequence and verify that pre-coated purchased wire does not also receive upstream coating burdens in the foreground galvanising rows."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_direct_emissions
    applies_to: "elementary outputs"
    rule: "Confirm direct fossil carbon dioxide includes foreground combustion only and hydrogen chloride is specific to applicable post-abatement pickling emissions."
    source_ids:
      - eu-jrc-fmp-bref-2022
  - rule_id: validate_inventory_completeness
    applies_to: "reporting period"
    rule: "Reconcile product output, materials, utilities, wastes and direct emissions to the same site, route and time period; disclose exclusions and data gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Factory-gate background input for process and lifecyclemodel models that consume a declared barbed-wire coil"
  allowed_use: "Studies requiring iron or steel barbed or specified twisted fencing wire when construction, grade, dimensions, strength, coating, geography, technology and time period are compatible"
  excluded_use: "Baling wire, wire mesh or netting, fence posts or gates, stranded cable, insulated wire, non-ferrous or plastic fencing products, installed fence systems, or cradle-to-grave claims without additional life-cycle stages"
  required_metadata: "canonical PCR id; product construction; steel grade; line-wire and barb-wire diameters; strength class; barb geometry and spacing; coating material and mass or thickness; coating sequence; net coil mass; packaging; site geography; technology; reporting period; upstream steel-wire dataset"
  required_quality_disclosure: "foreground coverage; meter and scale quality; route applicability; allocation fractions; material and product reconciliation; direct-emission method; unresolved data and UUID identities; representativeness limitations"
  update_trigger: "Change in steel grade or wire construction, forming technology, coating material or sequence, energy source, abatement, packaging, site geography, allocation method, or data older than five years"
