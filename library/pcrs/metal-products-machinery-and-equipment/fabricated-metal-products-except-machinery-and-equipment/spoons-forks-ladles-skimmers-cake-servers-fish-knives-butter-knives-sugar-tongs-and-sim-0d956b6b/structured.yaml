validation_rules:
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Confirm exactly 1 kg net conforming dry finished ware, with removable packaging excluded and pieces per kilogram declared."
    source_ids:
      - "[]"
  - rule_id: validate_identity_qualifiers
    applies_to: "product identity"
    rule: "Reject a package missing article mix, alloy grade, finish, handle/coating route, packaging scope, manufacturing geography, or data period."
    source_ids:
      - "[]"
  - rule_id: validate_boundary
    applies_to: "foreground boundary"
    rule: "Confirm that all on-site forming, thermal, grinding/polishing, wet finishing, inspection, packing, pollution-control, waste, and direct-emission operations are included or explicitly absent, and that upstream and downstream stages are not double counted."
    source_ids:
      - unido-ethiopia-cutlery-project-1986
      - us-epa-fabricated-metal-products-1995
      - eu-jrc-surface-treatment-metals-2006
  - rule_id: validate_atomic_rows
    applies_to: "process inventory"
    rule: "Confirm each row is one physical, chemical, waste, or energy exchange with the stated direction and flow type; require separate foreground-instance rows for any additional coating metal, handle material, packaging component, chemical, fuel, waste, or emission."
    source_ids:
      - "[]"
  - rule_id: validate_uuid_alignment
    applies_to: "Tiangong-bearing rows"
    rule: "Confirm state-100 UUID identity, English and Chinese base names, flow type, property, and unit; unresolved rows must remain UUID-empty and listed in manifest review metadata."
    source_ids:
      - "[]"
  - rule_id: validate_balance
    applies_to: "metal and wet-process records"
    rule: "Require explained metal and water-balance discrepancies and prevent double counting between internally recycled scrap, dispatched waste, captured dust, wastewater, sludge, and elementary emissions."
    source_ids:
      - us-epa-fabricated-metal-products-1995
      - eu-jrc-surface-treatment-metals-2006
  - rule_id: validate_allocation
    applies_to: "shared operations"
    rule: "Confirm subdivision was attempted first, every remaining allocation uses a documented causal driver, and allocated totals reconcile to measured site totals."
    source_ids:
      - "[]"
  - rule_id: validate_range_status
    applies_to: "all important flows"
    rule: "Treat all amounts as foreground requirements. No external empirical range is authorized until at least two independent, original-text-verified, boundary-compatible sources support a reasoned synthesis; do not infer a range from a single case or duplicate scenario."
    source_ids:
      - "[]"
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset derived from a completed, reviewed foreground data package"
  downstream_use: "Product-level process datasets and lifecycle models requiring factory-gate burdens for the declared kitchen or table ware product"
  allowed_use: "Use for the declared article mix, alloy, manufacturing route, finish, packaging scope, geography, and period, or after transparent technology and geography adjustment"
  excluded_use: "Do not use as a generic proxy for ordinary cutting knives, hand tools, cookware, non-metal tableware, precious-metal ware, customer-owned-input manufacturing services, use-phase washing, or end-of-life without separate justification"
  required_metadata: "Canonical PCR id; CPC context; article mix and pieces per kilogram; alloy and recycled-content basis; handle/coating/passivation; route and outsourced steps; packaging; geography; period; reference flow; allocation; upstream datasets; unresolved-flow status"
  required_quality_disclosure: "Data coverage; meter and scale calibration; mass and water balances; allocation drivers; treatment boundary; direct-emission method; scrap and waste destinations; proxy use; uncertainty; cut-offs; deviations"
  update_trigger: "Material change in product mix, alloy or supplier, heat-treatment or finishing technology, coating/passivation, packaging, energy or water supply, wastewater/dust control, allocation driver, geography, or representative data period"
