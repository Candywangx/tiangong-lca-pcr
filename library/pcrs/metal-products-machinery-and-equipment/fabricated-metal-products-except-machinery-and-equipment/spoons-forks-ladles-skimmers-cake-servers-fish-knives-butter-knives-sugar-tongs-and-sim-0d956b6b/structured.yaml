measurement_rules:
  - id: reference_net_mass
    applies_to: "Reference product and all mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh conforming dry ware after final cleaning and inspection. Include integral handles and coatings; exclude removable sales and transport packaging. Normalize every inventory amount to 1 kg of this net product mass."
  - id: set_or_count_conversion
    applies_to: "Records kept as pieces, dozens, or sets"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts using measured net mass from the same product family and reporting period; retain article mix, sample size, mean mass, and variability. Do not apply a generic spoon or set mass."
  - id: electricity_energy
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity before normalization. When source records are in kWh, convert with 1 kWh = 3.6 MJ and disclose voltage, grid geography, and loss boundary."
  - id: gas_reference_conditions
    applies_to: "Gaseous natural gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report metered volume at the supplier or meter reference temperature and pressure; record those conditions and the lower or higher heating-value basis used by any accompanying energy or emission calculation."
  - id: solution_as_supplied
    applies_to: "Sodium hydroxide and nitric acid"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record solution mass as supplied and separately declare active-substance concentration. Do not equate solution mass with dry chemical mass."
