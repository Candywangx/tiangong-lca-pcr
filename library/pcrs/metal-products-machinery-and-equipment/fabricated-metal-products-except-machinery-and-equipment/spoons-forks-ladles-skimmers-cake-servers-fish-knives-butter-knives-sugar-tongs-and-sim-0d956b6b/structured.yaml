allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "mixed products, alloy grades, finishes, or production lines"
    rule: "Prefer sub-metering, batch records, material issue records, machine time, bath loading, and direct waste measurements to avoid allocation between unlike products or routes."
    source_ids:
      - eu-jrc-surface-treatment-metals-2006
  - rule_id: allocation_common_operations
    applies_to: "shared presses, furnaces, polishing lines, cleaning baths, utilities, and pollution control"
    rule: "Allocate a shared operation by the causal physical driver recorded for that operation, such as machine time, treated mass, surface area, bath loading, or metered energy. Document the selected driver and reconciliation to site totals."
    source_ids:
      - eu-jrc-surface-treatment-metals-2006
  - rule_id: allocation_scrap
    applies_to: "stainless-steel scrap leaving the foreground"
    rule: "Report scrap mass, alloy grade, and destination separately. Apply the study's declared recycling model consistently; do not credit avoided primary steel inside the foreground unless that system model explicitly requires it."
    source_ids:
      - us-epa-fabricated-metal-products-1995
  - rule_id: allocation_economic_exception
    applies_to: "inseparable co-products without a defensible physical driver"
    rule: "Economic allocation may be used only after subdivision and physical causality are shown impracticable; disclose prices, geography, averaging period, currency basis, and sensitivity."
    source_ids:
      - "[]"
