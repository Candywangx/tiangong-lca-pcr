measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and mass-normalized inputs/outputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh dry, unpackaged conforming product and normalize all inventory to 1 kg net product. Do not include pallets, reels, drums or removable packaging in reference mass."
