      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve measured material and alloy routes separately. Reconcile input metal mass to conforming product, segregated scrap, scale/sludge retained in other recorded waste, and documented inventory change."
