    rule: "Prefer subdivision using operation meters, batch records and product-specific material issues. Keep iron/non-alloy steel, alloy steel and copper routes separate whenever records permit."
    source_ids:
      - ec-fmp-bat-2022
  - rule_id: allocation_shared_operations
    applies_to: "Shared forming, heat treatment, cleaning, coating, testing and auxiliaries"
    rule: "If subdivision is not possible, allocate shared burdens by a documented causal driver such as machine time, furnace load-time, treated surface area, bath throughput or metered energy. Use mass only when no more causal driver exists and disclose the sensitivity."
    source_ids:
      - ec-fmp-bat-2022
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "Steel scrap, copper scrap and recovered treatment materials"
    rule: "Report all output masses and destinations. Do not assign avoided primary-metal or treatment credits inside the foreground inventory; apply any recycling or substitution convention in a separately disclosed downstream model."
    source_ids:
      - ec-fmp-bat-2022
      - us-epa-brass-wire-mill-1971
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "chain_manufacturing"
      flow_role: "Each metal feedstock row"
      record_type: "Purchase, issue, return and inventory records"
      raw_fields: "material/grade; supplier; lot; opening stock; receipts; issues; reusable returns; closing stock; mass"
      collection_method: "Calibrated scales reconciled to stores and production records"
      unit: "kg"
      frequency: "Each lot; aggregate monthly"
      temporal_coverage: "Representative continuous 12-month period or declared shorter campaign"
      site_scope: "All lines producing the declared product"
      aggregation_rule: "receipts + opening stock - closing stock - reusable returns, assigned by product route"
      quality_evidence: "Scale calibration, supplier certificates, lot traceability and stock reconciliation"
    - protocol_id: cp_energy_inputs
      process_id: "chain_manufacturing"
      flow_role: "Electricity and natural gas"
      record_type: "Utility meters, invoices and operating logs"
      raw_fields: "meter id; opening/closing reading; unit; reference conditions; operation; downtime; product quantity"
      collection_method: "Submeter preferred; otherwise site meter allocated by causal driver"
      unit: "kWh, MJ, m3"
      frequency: "Continuous or each shift; aggregate monthly"
      temporal_coverage: "Representative continuous 12-month period or declared shorter campaign"
      site_scope: "All attributable production and pollution-control equipment"
      aggregation_rule: "Net delivered amount less excluded uses, allocated and normalized to conforming product mass"
      quality_evidence: "Meter calibration, invoice reconciliation, allocation worksheet and operating-hours log"
    - protocol_id: cp_water_chemicals
      process_id: "chain_manufacturing"
      flow_role: "Each water or chemical row"
      record_type: "Meter, batch, purchase, issue and tank-inventory records"
      raw_fields: "substance; concentration; lot; opening/closing inventory; additions; recovered return; export; treated product mass"
      collection_method: "Calibrated flow meter or scale plus bath/tank balance"
      unit: "kg"
      frequency: "Each batch or shift; aggregate monthly"
      temporal_coverage: "Representative continuous 12-month period or declared shorter campaign"
      site_scope: "Each applicable cleaning, drawing, heat-treatment, coating or treatment line"
      aggregation_rule: "Net fresh input = additions + receipts + opening stock - closing stock - recovered export; normalize to product mass"
      quality_evidence: "Calibration, safety data sheet, concentration analysis, batch sheet and tank balance"
    - protocol_id: cp_product_output
      process_id: "chain_manufacturing"
      flow_role: "Reference product"
      record_type: "Release, scale and quality records"
      raw_fields: "product id; material/grade; dimensions; joining method; heat treatment; coating; test specification/result; dry net mass; rejects"
      collection_method: "Calibrated scale linked to release inspection"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Representative continuous 12-month period or declared shorter campaign"
      site_scope: "All conforming product made at the declared site"
      aggregation_rule: "Sum dry unpackaged released mass; exclude rejects, packaging and stock not released"
      quality_evidence: "Scale calibration, inspection record, material certificate and test certificate where applicable"
    - protocol_id: cp_waste_outputs
      process_id: "chain_manufacturing"
      flow_role: "Each waste row"
      record_type: "Waste scales/manifests, tank levels and recovery logs"
      raw_fields: "waste identity; composition; origin; mass; opening/closing inventory; recovery; destination; treatment"
      collection_method: "Weighbridge/scale or documented density-volume conversion with tank balance"
      unit: "kg"
      frequency: "Each shipment; reconcile monthly"
      temporal_coverage: "Representative continuous 12-month period or declared shorter campaign"
      site_scope: "All attributable waste and wastewater leaving the site"
      aggregation_rule: "Outbound mass + closing stock - opening stock; subtract internal reuse and prevent duplicate reporting"
      quality_evidence: "Scale calibration, manifest, laboratory composition/pH, tank record and recycler/treatment receipt"
    - protocol_id: cp_direct_emissions
      process_id: "chain_manufacturing"
      flow_role: "Each elementary emission row"
      record_type: "Continuous monitoring, stack tests, mass balance and fugitive estimate records"
      raw_fields: "pollutant; source; flow; concentration; test period; abatement status; reporting basis; operating time"
      collection_method: "Applicable calibrated monitoring or validated site calculation"
      unit: "kg"
      frequency: "Continuous where installed; otherwise each required test and monthly calculation"
      temporal_coverage: "Representative continuous 12-month period or declared shorter campaign"
      site_scope: "All attributable point and quantified fugitive sources"
      aggregation_rule: "Sum post-abatement releases by pollutant and normalize to conforming product mass"
      quality_evidence: "Calibration, sampling standard, laboratory report, detection limit, uncertainty and operating log"
  calculation_rules:
    - id: calc_normalized_amount
      applies_to: "Every inventory exchange"
      rule: "normalized amount = period exchange amount / dry unpackaged conforming product mass"
      inputs:
        - "Exchange record"
        - "cp_product_output mass"
      output: "Amount per 1 kg reference product"
      source_ids: []
    - id: calc_net_input
      applies_to: "Materials, water and chemicals"
      rule: "net fresh input = receipts + opening inventory - closing inventory - reusable material returned outside the accounted product system"
      inputs:
        - Purchase
        - stock
        - issue
        - "recovery and return records"
      output: "Net product input by atomic flow"
      source_ids:
        - ec-fmp-bat-2022
    - id: calc_net_waste
      applies_to: "Waste outputs"
      rule: "net waste crossing boundary = shipments + closing waste inventory - opening waste inventory; exclude material internally reused in the same period"
      inputs:
        - "Waste manifests"
        - scales
        - "tanks and inventory"
      output: "Net waste output by atomic flow"
      source_ids:
        - ec-fmp-bat-2022
        - us-epa-brass-wire-mill-1971
    - id: calc_electricity_mj
      applies_to: "Electricity"
      rule: "MJ = metered kWh × 3.6"
      inputs:
        - "Metered kWh"
      output: "Delivered electricity in MJ"
      source_ids: []
    - id: calc_shared_burden
      applies_to: "Unsubdivided shared operations"
      rule: "Allocate by the documented causal driver; if mass is the fallback, share = product mass / total conforming mass through the shared operation"
      inputs:
        - "Shared burden"
        - "driver by product"
        - "total driver"
      output: "Product-attributed shared burden"
      source_ids:
        - ec-fmp-bat-2022
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Retain product drawing/specification, material and grade, link/part geometry, joining method, heat treatment, coating, test status, net mass and lot identity."
      evidence: "Product specification, material certificate, route card, inspection and test records"
    - id: dq_time
      applies_to: "All foreground rows"
      requirement: "Use one representative continuous production period of at least 12 months where available; disclose shorter campaigns, shutdowns, abnormal operations and seasonal gaps."
      evidence: "Dated meters, batch records, production logs and completeness reconciliation"
    - id: dq_completeness
      applies_to: "Process and emissions inventory"
      requirement: "Reconcile material, energy, water, chemical, waste and emission records across every applicable operation and pollution-control unit; explain all missing or estimated exchanges."
      evidence: "Mass/energy/water balances, chemical inventory, waste and waste-gas/wastewater inventories"
    - id: dq_technology
      applies_to: "Conditional routes"
      requirement: "Identify forming/drawing, joining, furnace/quench, cleaning, coating, proof-test and abatement technology and whether each step is onsite, outsourced or absent."
      evidence: "Process flow sheet, equipment register and supplier records"
    - id: dq_measurement
      applies_to: "Meters, scales and analyses"
      requirement: "Retain calibration status, sampling method, detection limit, concentration/reference-condition conversion and uncertainty for every material measurement."
      evidence: "Calibration certificates, laboratory reports and conversion worksheets"
    - id: dq_upstream
      applies_to: "Linked datasets"
      requirement: "Match geography, material/alloy, product state, technology, recycled content and time; document any proxy and its expected direction of bias."
      evidence: "Supplier dataset or documented dataset-selection record"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference product"
    rule: "Fail if the product is articulated link chain, a chain assembly outside the boundary, a material other than iron/steel/copper, or lacks material/grade, dimensions, route, finish, test status and net-mass qualifiers."
    source_ids:
      - un-cpc-3-0-2025
      - eu-chain-certification-1973
  - rule_id: validate_reference_mass
    applies_to: "Reference flow"
    rule: "Confirm exactly 1 kg dry unpackaged conforming product and exclude rejects and packaging from the denominator."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "Process map"
    rule: "Confirm every onsite and outsourced drawing, forming, joining, heat-treatment, cleaning, coating, testing and treatment step is declared and every applicable exchange is present."
    source_ids:
      - ec-fmp-bat-2022
      - us-epa-brass-wire-mill-1971
  - rule_id: validate_balance
    applies_to: "Metal, water and chemicals"
    rule: "Require documented metal reconciliation and net-consumption treatment for recirculated water, acid, lubricant, quench oil and recovered coating metal; investigate unexplained imbalance."
    source_ids:
      - ec-fmp-bat-2022
      - us-epa-brass-wire-mill-1971
  - rule_id: validate_emissions
    applies_to: "Direct emissions"
    rule: "Confirm emissions are post-abatement foreground releases, use the declared compartment/reporting basis, exclude upstream electricity emissions and do not substitute nitrous oxide for unresolved NOx."
    source_ids:
      - ec-fmp-bat-2022
  - rule_id: validate_allocation
    applies_to: "Shared burdens and recyclable outputs"
    rule: "Confirm subdivision or causal allocation is documented and no avoided-burden recycling credit is embedded in the foreground inventory."
    source_ids:
      - ec-fmp-bat-2022
published_dataset_profile:
  dataset_role: "Product-specific or site-average factory-gate foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate product systems and downstream models requiring a qualified factory-gate chain or chain-part dataset"
  excluded_use: "Articulated link chain; chain slings/assemblies including accessories; other materials; use-phase performance; repair; end-of-life; or comparative assertions when material route, product state, geography, technology or data quality are incompatible"
  required_metadata: "PCR id/version; product and part/chain status; material/alloy/grade; dimensions; calibrated status where applicable; joining method; heat treatment; coating; proof/test specification and result where applicable; site/geography; period; net mass; process routes; allocation; upstream datasets; unresolved UUIDs"
  required_quality_disclosure: "Temporal coverage and completeness; meter/scale calibration; concentration and reference-condition conversions; route-specific allocation; metal/water/chemical balances; waste and emission methods; uncertainty; proxies; exclusions and outsourced steps"
  update_trigger: "Material, grade, feedstock, forming/joining technology, furnace/quench, cleaning chemistry, coating, abatement, supplier electricity/fuel, allocation method, site, production mix, regulation, reference-flow UUID or evidence changes materially"
