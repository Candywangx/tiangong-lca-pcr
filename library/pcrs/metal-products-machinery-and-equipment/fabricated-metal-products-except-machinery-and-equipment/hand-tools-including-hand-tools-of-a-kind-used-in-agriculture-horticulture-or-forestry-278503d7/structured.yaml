allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared equipment and multifunctional processes"
    rule: "Avoid allocation where practicable by submetering, production-order records, machine time, bath throughput or another subdivision that directly attributes inputs and outputs to the declared hand-tool product."
    source_ids:
      - eu-commission-environmental-footprint-2021
  - rule_id: allocation_physical_relation
    applies_to: "residual shared burdens after subdivision"
    rule: "If subdivision is not practicable, use a documented causal physical relationship such as machine time, treated mass, bath throughput or occupied furnace capacity. Demonstrate why the relationship represents resource use or emissions."
    source_ids:
      - eu-commission-environmental-footprint-2021
  - rule_id: allocation_other_relation
    applies_to: "multifunctional processes without a defensible physical relation"
    rule: "Use another relationship, including economic allocation only as a last step, and document why subdivision, system expansion and physical allocation were rejected, the prices and period used, and the sensitivity of results."
    source_ids:
      - eu-commission-environmental-footprint-2021
  - rule_id: allocation_scrap_and_rework
    applies_to: "internal rework and outgoing steel scrap"
    rule: "Keep internal rework inside the foreground mass balance without treating it as a co-product. Record outgoing scrap quantity and destination separately; any recycling credit or burden belongs to the declared study method and shall not be embedded silently in the foreground amount."
    source_ids:
      - eu-commission-environmental-footprint-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass
      process_id: "forming_machining_surface_finishing_assembly_packaging"
      flow_role: "purchased and issued materials, chemicals, handles, resins and packaging"
      record_type: "weighbridge ticket, purchase or issue record, formulation sheet, bill of materials"
      raw_fields: "material identity; UUID when available; supplier; grade or formulation; concentration; gross and tare mass; issued mass; returned mass; lot; date; process and product order"
      collection_method: "reconcile purchase, issue and return records with calibrated scale or supplier mass evidence"
      unit: "kg"
      frequency: "each receipt and issue; aggregate monthly"
      temporal_coverage: "at least one representative 12-month production period or the full shorter campaign"
      site_scope: "all sites and lines producing the declared product"
      aggregation_rule: "sum net material crossing each process boundary, allocate by production order, then divide by net conforming product mass"
      quality_evidence: "scale calibration; supplier specification; lot traceability; purchase-to-inventory reconciliation"
    - protocol_id: cp_energy_records
      process_id: "forming_machining_heat_treatment_surface_finishing_assembly_packaging"
      flow_role: "purchased electricity and natural gas"
      record_type: "utility meter, submeter, invoice and machine-hour record"
      raw_fields: "meter start and end; unit; period; line; product order; downtime; allocation driver; gas reference conditions; grid and supplier"
      collection_method: "use dedicated meters where available; otherwise reconcile invoices to submeters and allocate documented residuals"
      unit: "kWh, MJ, m3"
      frequency: "continuous or per batch; aggregate monthly"
      temporal_coverage: "same production period as product output"
      site_scope: "all included production lines and directly associated equipment"
      aggregation_rule: "subtract non-production and excluded uses, allocate shared consumption with the approved physical driver, convert units, divide by net conforming product mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; retained conversion record"
    - protocol_id: cp_intermediate_mass
      process_id: "forming_machining_heat_treatment_surface_finishing_assembly_packaging"
      flow_role: "internal semi-finished hand-tool blanks and parts"
      record_type: "batch traveller, production order and calibrated scale record"
      raw_fields: "input mass; output mass; rejects; returned material; process stage; product order; timestamp"
      collection_method: "weigh or count with a verified unit-mass conversion at each process transfer"
      unit: "kg"
      frequency: "each batch or production order"
      temporal_coverage: "same production period as product output"
      site_scope: "every included transfer between foreground processes"
      aggregation_rule: "aggregate stage transfers by product order; retain them for process mass balance and cancel internal transfers in the aggregated external inventory"
      quality_evidence: "scale calibration; batch reconciliation; documented count-to-mass factor where used"
    - protocol_id: cp_waste_mass
      process_id: "forming_machining"
      flow_role: "post-industrial steel scrap"
      record_type: "waste scale ticket and transfer record"
      raw_fields: "waste identity; mass; contamination; internal return; destination; date; product order"
      collection_method: "weigh each container or shipment and reconcile accumulation to production orders"
      unit: "kg"
      frequency: "each container or shipment; aggregate monthly"
      temporal_coverage: "same production period as product output"
      site_scope: "all included cutting, forming and machining areas"
      aggregation_rule: "sum outgoing scrap excluding internal returns, allocate shared containers by documented composition or production records, divide by net conforming product mass"
      quality_evidence: "calibrated scale; consignee ticket; destination evidence; mass-balance reconciliation"
    - protocol_id: cp_wastewater_records
      process_id: "surface_finishing"
      flow_role: "aqueous metal-finishing wastewater"
      record_type: "flow-meter, tank-transfer and laboratory record"
      raw_fields: "discharge volume or mass; density; sampling point; date; batch; treatment destination; pH; relevant metals and contaminants"
      collection_method: "meter discharge at the defined collection point; convert volume using retained density if mass is not measured"
      unit: "kg"
      frequency: "continuous or each discharge; composition at representative frequency"
      temporal_coverage: "same production period as product output"
      site_scope: "all included aqueous cleaning, pickling and rinsing lines"
      aggregation_rule: "sum discharge mass at the consistent boundary, exclude separately managed concentrated baths and sludge, divide by finished product mass"
      quality_evidence: "meter calibration; sampling plan; laboratory results; treatment transfer record"
    - protocol_id: cp_direct_combustion_emissions
      process_id: "heat_treatment"
      flow_role: "direct fossil carbon dioxide"
      record_type: "fuel meter, supplier composition, carbon analysis, oxidation record or stack measurement"
      raw_fields: "fuel quantity; reference conditions; carbon content; fossil fraction; oxidation fraction; measured CO2; period; furnace; product order"
      collection_method: "use calibrated direct measurement or a transparent carbon balance based only on collected fuel-specific data"
      unit: "kg CO2"
      frequency: "each campaign or continuous; aggregate monthly"
      temporal_coverage: "same production period as product output"
      site_scope: "all on-site natural-gas heat-treatment sources"
      aggregation_rule: "sum direct fossil CO2 and allocate using measured furnace throughput or another causal physical driver; exclude upstream supply emissions"
      quality_evidence: "meter calibration; supplier certificate or laboratory analysis; calculation worksheet; stack test where available"
    - protocol_id: cp_product_output
      process_id: "assembly_packaging"
      flow_role: "net conforming finished hand tools"
      record_type: "production count, product weight, quality release and packaging record"
      raw_fields: "product model; conforming count; unit net mass; total net mass; rejects; quality status; packaging mass; date; site"
      collection_method: "weigh net product before packaging or multiply conforming count by a verified model-specific net mass"
      unit: "kg"
      frequency: "each batch or production order; aggregate monthly"
      temporal_coverage: "same period as all inputs and outputs"
      site_scope: "all sites and lines in the declared dataset"
      aggregation_rule: "sum conforming net product mass; use it as the denominator and normalize to exactly 1 kg"
      quality_evidence: "calibrated scale; quality release; model-specific mass verification; reconciliation to sales or warehouse receipt"
  calculation_rules:
    - id: calculation_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount attributable to the declared product ÷ net conforming product mass for the same period"
      inputs:
        - "attributable row amount"
        - "net conforming finished-hand-tool mass"
      output: "row amount per 1 kg net finished hand tools"
      source_ids: []
    - id: calculation_electricity_conversion
      applies_to: "electricity recorded in kWh"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6 MJ/kWh"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calculation_volume_to_mass
      applies_to: "process water or wastewater measured by volume"
      rule: "mass = measured volume × measured or declared density at the recorded conditions"
      inputs:
        - volume
        - density
        - "temperature where relevant"
      output: "kg water or wastewater"
      source_ids: []
    - id: calculation_direct_fossil_co2
      applies_to: "on-site natural-gas combustion where direct measurement is unavailable"
      rule: "calculate fossil CO2 from collected fuel quantity, fuel-specific carbon content, fossil fraction and oxidation fraction; retain all input records and units"
      inputs:
        - "metered gas"
        - "reference conditions"
        - "carbon content"
        - "fossil fraction"
        - "oxidation fraction"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: calculation_product_group_weighting
      applies_to: "datasets covering more than one hand-tool model"
      rule: "aggregate each model's attributable inventory using actual net production mass for the data period; do not use an unweighted average"
      inputs:
        - "model-level inventory"
        - "model-level net production mass"
      output: "production-mass-weighted product-group inventory"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and all product inputs"
      requirement: "Verify product model, CPC boundary, material or chemical identity, supplied state and UUID semantics; do not reuse a UUID for a different concentration, stock form, polymer, waste or product state."
      evidence: "product specification, supplier documentation, direct-read identity audit and bill of materials"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use a common representative period, normally 12 consecutive months; explain shorter campaigns, abnormal downtime and seasonal or product-mix effects."
      evidence: "dated meters, production orders, invoices and representativeness statement"
    - id: dq_completeness
      applies_to: "each included process"
      requirement: "Reconcile material inputs, internal transfers, net product, scrap, wastewater and other wastes. Add every unlisted actual material, energy, waste or direct emission as one concrete atomic exchange."
      evidence: "process mass balance, route checklist, waste manifests and reconciliation record"
    - id: dq_measurement
      applies_to: "measured and converted amounts"
      requirement: "Use calibrated instruments or documented supplier records and retain original units, conversions, allocation drivers and uncertainty or data-gap notes."
      evidence: "calibration certificates, invoices, meter logs and calculation workbook"
    - id: dq_geography_technology
      applies_to: "foreground and upstream datasets"
      requirement: "Match the manufacturing geography, grid, fuel supply, material technology and treatment route as closely as available; disclose material mismatches."
      evidence: "dataset metadata and representativeness assessment"
    - id: dq_route_condition
      applies_to: "conditional processes and flows"
      requirement: "Demonstrate applicability or non-applicability from the declared bill of materials, process route and site records."
      evidence: "routing sheet, process flow diagram, work instructions and product specification"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm that the output is exactly 1 kg net conforming finished hand tools, the reference UUID is unchanged, packaging is excluded from net mass, and all required qualifiers are present."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_process_route
    applies_to: "process map and inventory"
    rule: "Every process that occurs for the declared product shall have a matching inventory section and records; every conditional process omitted shall have documented non-applicability."
    source_ids:
      - us-epa-metal-products-machinery-2003
  - rule_id: validation_atomic_flows
    applies_to: "inventory exchanges"
    rule: "Confirm that every row denotes one physical, chemical, waste, energy or elementary exchange. Reject collection labels, combined utilities, unspecified packaging, combined wastes and umbrella emissions."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "each foreground process and aggregated system"
    rule: "Reconcile input mass, internal transfers, conforming output, rejects, scrap, wastewater and inventory changes; investigate and disclose unexplained imbalance rather than forcing closure."
    source_ids:
      - us-epa-fabricated-metal-products-1995
  - rule_id: validation_energy_boundary
    applies_to: "electricity, natural gas and direct carbon dioxide"
    rule: "Confirm units and reference conditions, prevent double counting between shared meters, and include only direct on-site fossil CO2 in the elementary-flow row."
    source_ids: []
  - rule_id: validation_chemical_state
    applies_to: "sodium hydroxide and hydrochloric acid"
    rule: "Confirm as-supplied mass and concentration. The hydrochloric-acid UUID in this PCR is valid only for the explicit 32% solution row."
    source_ids: []
  - rule_id: validation_unresolved_identity
    applies_to: "UUID-empty rows"
    rule: "Treat the metal-finishing wastewater and hardwood-handle UUIDs as unresolved; do not substitute evaporation condensate, rough wood, pallets or another proxy."
    source_ids: []
  - rule_id: validation_source_and_allocation
    applies_to: "evidence and shared burdens"
    rule: "Confirm source references, collection records, allocation hierarchy, drivers and sensitivity disclosures."
    source_ids:
      - eu-commission-environmental-footprint-2021
published_dataset_profile:
  dataset_role: "Product-specific or production-mass-weighted foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Cradle-to-gate or broader LCA models for the declared hand-tool product or product group when geography, technology, product state, function and data period are representative"
  excluded_use: "Direct comparison of tools with different functions, quality levels, rated capacities or service lives without an additional functionally equivalent basis; powered tools; interchangeable machine or hand-tool inserts; unqualified global averages"
  required_metadata: "canonical PCR id; product model or weighted group; net reference mass; all required qualifiers; manufacturing sites and geography; data period; process-route applicability; purchased and outsourced operations; upstream dataset choices; allocation method; treatment destinations; unresolved UUIDs; added downstream stages"
  required_quality_disclosure: "foreground coverage and representativeness; meter and scale quality; material and energy reconciliation; mass-balance gaps; allocation drivers and sensitivity; supplier-data quality; UUID audit state; range-evidence gaps; deviations and exclusions"
  update_trigger: "material change in product design, alloy or handle composition, manufacturing route, heat treatment, surface finish, energy supply, site geography, packaging, allocation method, treatment route, supplier technology, or data older than the program's accepted representativeness period"
