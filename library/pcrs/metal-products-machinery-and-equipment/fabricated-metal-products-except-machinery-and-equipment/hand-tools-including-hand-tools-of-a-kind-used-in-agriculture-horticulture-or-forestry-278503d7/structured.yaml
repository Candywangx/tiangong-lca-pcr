measurement_rules:
  - id: measurement_reference_mass
    applies_to: "Reference product and all mass-normalized rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize the inventory to 1 kg net conforming hand-tool output. Exclude packaging from net reference mass and record packaging separately."
  - id: measurement_material_mass
    applies_to: "Metals, chemicals, handles, resins, packaging, wastes and intermediate parts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record as-received or as-supplied mass. Declare alloy, formulation, solution concentration, moisture or recycled content when it changes upstream modelling. Do not report the mass of a solute as if it were the mass of its supplied solution."
  - id: measurement_electricity
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity in its recorded unit and convert kWh to MJ using 1 kWh = 3.6 MJ. Declare grid geography, voltage and whether losses to the delivery point are included."
  - id: measurement_natural_gas
    applies_to: "Gaseous natural gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered delivered volume and its reference temperature and pressure. Do not apply a generic mass or energy conversion without supplier or measured composition data."
  - id: measurement_water
    applies_to: "Process water and aqueous wastewater"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Prefer measured mass. If volume is measured, convert using the measured or declared density and retain the volume, density, temperature and conversion record."
  - id: measurement_internal_parts
    applies_to: "Semi-finished hand-tool blanks and parts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record transferred mass at each process boundary for process-level mass balance. Internal transfers cancel in an aggregated factory-gate inventory and shall not be counted as additional external product inputs."
