allocation_rules:
  - rule_id: al_avoid
    applies_to: "all shared processes"
    rule: "Avoid allocation through process subdivision, dedicated meters, batch records, and direct assignment to the declared product family wherever practicable."
    source_ids: []
  - rule_id: al_mass_balance
    applies_to: "steel, barrier compound, coating, water, and packaging"
    rule: "Reconcile inputs, accepted product, internal returns, stock change, and measured waste before allocation; internal recycling shall not be counted as both a fresh input reduction and a credited output."
    source_ids: []
  - rule_id: al_shared_energy
    applies_to: "shared electricity"
    rule: "Allocate only the residual shared amount using a causal physical driver such as measured machine operating time multiplied by rated or measured load; document the driver and sensitivity."
    source_ids: []
  - rule_id: al_multi_product
    applies_to: "unavoidable multi-product production"
    rule: "If subdivision and causal assignment are infeasible, use mass allocation only when mass demonstrably represents resource use; otherwise select and justify another physical relationship and report an unallocated sensitivity case."
    source_ids:
      - epd-international-godrej-high-security-safes-2025
  - rule_id: al_scrap
    applies_to: "recyclable steel scrap and other wastes"
    rule: "Report the waste at the factory boundary and connect the chosen downstream treatment dataset; do not apply an avoided-production credit inside the foreground unless required by the declared study method and shown separately."
    source_ids:
      - epd-international-godrej-high-security-safes-2025
dataset_production:
