      flow_role: "finished_secure_storage_product"
      record_type: "final inspection and production record"
      raw_fields: "product type; model; protection designation; lock configuration; accepted count; net mass; rejected count"
      collection_method: "calibrated weighing and acceptance record"
      unit: "kg"
      frequency: "each product or statistically justified homogeneous batch"
      temporal_coverage: "same representative period as all inputs"
      site_scope: "all release points for the declared product"
      aggregation_rule: "sum accepted net mass before packaging; normalize to 1000 kg"
      quality_evidence: "scale calibration; inspection release; production ledger"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "material inputs and mass outputs"
      rule: "normalized amount = period exchange mass / period accepted net product mass × 1000 kg"
      inputs:
        - "exchange mass"
        - "accepted net product mass"
      output: "kg per 1000 kg finished product"
      source_ids: []
    - id: calc_energy_normalization
      applies_to: "electricity inputs"
      rule: "convert retained kWh reading to MJ with 3.6 MJ per kWh, then normalized energy = period MJ / period accepted net product mass × 1000 kg"
      inputs:
        - "meter reading"
        - "accepted net product mass"
      output: "MJ per 1000 kg finished product"
      source_ids: []
    - id: calc_welding_particulate
      applies_to: "welding_particulate"
      rule: "released particulate = measured exhaust mass, or consumable/activity amount × matched particulate factor × (1 − verified capture fraction); do not use a factor for a different welding process or electrode"
      inputs:
        - "source test or activity"
        - "matched factor"
        - "control performance"
      output: "kg particulate per 1000 kg finished product"
      source_ids:
        - us-epa-ap42-electric-arc-welding-1995
    - id: calc_mass_balance
      applies_to: "steel, barrier compound, coating, water, and packaging"
      rule: "input + opening stock = product incorporation + output waste + internal return + closing stock + documented discrepancy; investigate material discrepancies before normalization"
      inputs:
        - input
        - stock
        - "incorporated mass"
        - returns
        - wastes
      output: "reconciled mass balance and discrepancy"
      source_ids: []
  data_quality_requirements:
    - id: dqr_identity
      applies_to: "every exchange"
      requirement: "Preserve exact material, component, waste, and elementary-flow identity; do not aggregate atomic rows into utilities, energy carriers, materials, residues, or emissions groups."
      evidence: "purchase specification; process record; waste code; flow audit"
    - id: dqr_time
      applies_to: "foreground data"
      requirement: "Use at least 12 consecutive representative months or justify a shorter campaign for non-continuous production and disclose seasonality, start-up, and abnormal-operation treatment."
      evidence: "dated raw records; production calendar; exclusion log"
    - id: dqr_geography
      applies_to: "upstream data"
      requirement: "Match the manufacturing and supply geography and disclose any geographic proxy."
      evidence: "supplier location; dataset geography; proxy justification"
    - id: dqr_technology
      applies_to: "processes and upstream data"
      requirement: "Match the actual steel form, welding process and consumable, barrier formulation, lock type, finishing route, controls, and packaging design."
      evidence: "bill of materials; routing; equipment and control records"
    - id: dqr_completeness
      applies_to: "foreground inventory"
      requirement: "Reconcile all listed rows, report route-inapplicable rows as zero or not applicable, and document every omitted known exchange; absence of an exact UUID does not permit omission."
      evidence: "signed inventory checklist; mass and energy balances; omission register"
    - id: dqr_uncertainty
      applies_to: "measured and calculated values"
      requirement: "Record meter or scale uncertainty, sampling coverage, allocation uncertainty, conversion assumptions, and emission-factor uncertainty where used."
      evidence: "calibration certificates; sampling plan; calculation workbook"
    - id: dqr_consistency
      applies_to: "bilingual and structured records"
      requirement: "Keep English and Chinese row ids, UUIDs, process ids, units, route conditions, and rules aligned with the generated structured projection."
      evidence: "bilingual comparison; clean second sync; schema validation"
