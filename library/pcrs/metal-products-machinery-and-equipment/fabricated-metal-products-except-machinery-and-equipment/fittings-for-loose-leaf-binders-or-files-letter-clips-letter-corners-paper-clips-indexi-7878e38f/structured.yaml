allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared_foreground_operations"
    rule: "Avoid allocation by separately metering or batch-recording forming, finishing, assembly and packaging for the declared product family."
    source_ids: []
  - rule_id: allocation_internal_intermediates
    applies_to: "internal_intermediates"
    rule: "Internal intermediate transfers carry their measured burdens forward and receive no separate co-product credit or allocation."
    source_ids: []
  - rule_id: allocation_recycled_scrap
    applies_to: "recyclable_steel_scrap"
    rule: "Report segregated steel scrap as a separate product output. Do not apply avoided virgin-metal credit inside the foreground inventory; disclose the downstream recycling method used by any lifecycle model."
    source_ids: []
  - rule_id: allocation_multi_product_shared_loads
    applies_to: "shared_energy_and_materials"
    rule: "When subdivision is impracticable, allocate shared loads by a documented causal driver such as machine time, metered operating hours, bath throughput or treated surface area; use mass only when no better physical driver is available."
    source_ids: []
  - rule_id: allocation_economic_last_resort
    applies_to: "valuable_co_products"
    rule: "Use economic allocation only when physical subdivision or causal allocation cannot be supported; disclose prices, currency, period, geography and sensitivity."
    source_ids: []
  - rule_id: allocation_internal_rework
    applies_to: "internally_reworked_rejects"
    rule: "Material returned to the same production system is an internal loop, not a boundary output; count its additional energy and material use and prevent double counting of its mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_mass_balance
      process_id: "metal_forming"
      flow_role: "Metal stock, lubricant, accepted intermediate and steel scrap"
      record_type: "Weigh tickets, ERP issue/return records and batch traveller"
      raw_fields: "lot_id; SKU; stock_grade; opening_inventory; issued_mass; returned_mass; accepted_output_mass; scrap_mass; oil_makeup_mass"
      collection_method: "Reconcile calibrated scales and inventory movements by eligible lot"
      unit: "kg"
      frequency: "Each lot; monthly reconciliation"
      temporal_coverage: "Representative continuous 12-month period or declared campaign"
      site_scope: "All forming lines producing the declared product"
      aggregation_rule: "Sum eligible net inputs and outputs, reconcile mass balance, then divide by market-ready reference output mass"
      quality_evidence: "Scale calibration; signed weigh tickets; inventory reconciliation; unexplained mass-balance difference"
    - protocol_id: cp_forming_electricity
      process_id: "metal_forming"
      flow_role: "Forming electricity"
      record_type: "Submeter or equipment power log"
      raw_fields: "meter_id; opening_reading; closing_reading; eligible_runtime; shared_load_driver"
      collection_method: "Submeter preferred; otherwise allocate measured cell load by documented operating time"
      unit: "kWh"
      frequency: "Each lot or shift; monthly reconciliation"
      temporal_coverage: "Same period as product output"
      site_scope: "Forming cell and local extraction only"
      aggregation_rule: "Convert net kWh to MJ and divide by reference output mass"
      quality_evidence: "Meter calibration; coverage check; shared-load allocation record"
    - protocol_id: cp_finishing_mass_balance
      process_id: "surface_finishing"
      flow_role: "Chemicals, coating metals and accepted finished intermediate"
      record_type: "Supplier tickets, bath logs, tank inventory and batch traveller"
      raw_fields: "lot_id; chemical_identity; concentration; opening_inventory; additions; recoveries; closing_inventory; accepted_output_mass"
      collection_method: "Reconcile each atomic chemical or metal separately across eligible finishing lots"
      unit: "kg"
      frequency: "Each addition and lot; monthly reconciliation"
      temporal_coverage: "Same period as finished output"
      site_scope: "Controlled finishing lines only"
      aggregation_rule: "Net consumption equals opening plus additions minus closing, recovery and documented return; normalize by reference output mass"
      quality_evidence: "Supplier certificate; bath log; calibrated scale; recovery record"
    - protocol_id: cp_finishing_water
      process_id: "surface_finishing"
      flow_role: "Process water"
      record_type: "Water submeter and tank log"
      raw_fields: "meter_id; opening_reading; closing_reading; tank_change; density; eligible_lots"
      collection_method: "Submeter direct use; convert volume to mass only with documented density"
      unit: "kg"
      frequency: "Daily or each lot; monthly reconciliation"
      temporal_coverage: "Same period as finished output"
      site_scope: "Finishing and rinsing boundary only"
      aggregation_rule: "Net input minus returned water, divided by reference output mass"
      quality_evidence: "Meter calibration; density record; leak and recirculation check"
    - protocol_id: cp_finishing_electricity
      process_id: "surface_finishing"
      flow_role: "Finishing electricity"
      record_type: "Submeter, rectifier and equipment log"
      raw_fields: "meter_id; readings; rectifier_kWh; eligible_runtime; shared_load_driver"
      collection_method: "Sum metered finishing loads and allocate shared loads causally"
      unit: "kWh"
      frequency: "Each shift or lot; monthly reconciliation"
      temporal_coverage: "Same period as finished output"
      site_scope: "Finishing, ventilation and controlled treatment equipment"
      aggregation_rule: "Convert net kWh to MJ and divide by reference output mass"
      quality_evidence: "Meter calibration; operating log; allocation record"
    - protocol_id: cp_finishing_natural_gas
      process_id: "surface_finishing"
      flow_role: "Natural gas"
      record_type: "Supplier meter and burner log"
      raw_fields: "meter_id; opening_volume; closing_volume; temperature; pressure; standard_condition; eligible_runtime"
      collection_method: "Read dedicated meter or allocate shared burner fuel by measured thermal duty or runtime"
      unit: "m3"
      frequency: "Each shift or lot; monthly reconciliation"
      temporal_coverage: "Same period as finished output"
      site_scope: "Controlled finishing heat only"
      aggregation_rule: "Normalize declared-condition volume by reference output mass"
      quality_evidence: "Meter calibration; supplier statement; reference-condition record"
    - protocol_id: cp_finishing_waste
      process_id: "surface_finishing"
      flow_role: "Wastewater and metal-bearing sludge, recorded as separate exchanges"
      record_type: "Discharge meter, waste manifest and laboratory report"
      raw_fields: "stream_id; mass_or_volume; density; dry_solids; metals_analysis; treatment_destination; date"
      collection_method: "Meter wastewater; weigh sludge; retain composition and destination for each stream"
      unit: "kg"
      frequency: "Each discharge or shipment; monthly reconciliation"
      temporal_coverage: "Same period as finished output"
      site_scope: "All controlled finishing discharges"
      aggregation_rule: "Sum each atomic stream separately and divide by reference output mass"
      quality_evidence: "Meter or scale calibration; waste manifest; laboratory chain of custody"
    - protocol_id: cp_finishing_emissions
      process_id: "surface_finishing"
      flow_role: "Direct fossil carbon dioxide"
      record_type: "Stack measurement or fuel-based calculation record"
      raw_fields: "fuel_volume; reference_condition; emission_factor; factor_source; measured_co2; oxidation_basis; eligible_output_mass"
      collection_method: "Prefer compliant stack measurement; otherwise multiply collected fuel activity by a validated documented site factor"
      unit: "kg"
      frequency: "Each reporting period; reconcile monthly"
      temporal_coverage: "Same period as finished output"
      site_scope: "Onsite controlled natural-gas combustion only"
      aggregation_rule: "Use measured CO2 or fuel activity multiplied by the validated factor; divide by reference output mass"
      quality_evidence: "Measurement QA; factor approval; fuel-to-emission reconciliation"
    - protocol_id: cp_assembly_mass_balance
      process_id: "staple_strip_assembly"
      flow_role: "Formed staples, water-based adhesive, tissue strip and accepted staple strips"
      record_type: "Batch traveller, scale, adhesive container log and paper issue record"
      raw_fields: "lot_id; staple_mass; adhesive_opening; adhesive_additions; adhesive_closing; tissue_mass; accepted_strip_mass; rejects"
      collection_method: "Weigh each atomic input and accepted output by staple-strip lot"
      unit: "kg"
      frequency: "Each lot; monthly reconciliation"
      temporal_coverage: "Same period as staple-strip output"
      site_scope: "All assembly lines for the declared staple SKU"
      aggregation_rule: "Net input or output divided by market-ready reference output mass"
      quality_evidence: "Scale calibration; material issue record; line-cleanout and reject record"
    - protocol_id: cp_assembly_electricity
      process_id: "staple_strip_assembly"
      flow_role: "Assembly electricity"
      record_type: "Cell submeter or runtime log"
      raw_fields: "meter_id; readings; eligible_runtime; shared_load_driver"
      collection_method: "Submeter preferred; otherwise allocate measured cell load by runtime"
      unit: "kWh"
      frequency: "Each lot or shift; monthly reconciliation"
      temporal_coverage: "Same period as staple-strip output"
      site_scope: "Alignment, adhesive application, drying and cutting cell"
      aggregation_rule: "Convert kWh to MJ and divide by reference output mass"
      quality_evidence: "Meter calibration; runtime log; allocation record"
    - protocol_id: cp_packaging_mass_balance
      process_id: "inspection_packaging"
      flow_role: "Unpacked article, paper box and market-ready output"
      record_type: "Packaging BOM, supplier specification, count record and calibrated scale"
      raw_fields: "SKU; article_count; unpacked_mass; box_count; sampled_box_mass; packing_rejects; market_ready_net_mass"
      collection_method: "Weigh representative same-SKU samples and reconcile packaging BOM and counts"
      unit: "kg"
      frequency: "Each packaging lot; monthly reconciliation"
      temporal_coverage: "Same period as reference product output"
      site_scope: "All factory-gate sales packaging for declared product"
      aggregation_rule: "Sum paper-box mass and normalize all eligible flows by measured market-ready net article mass"
      quality_evidence: "Scale calibration; BOM revision; sampling record; count-to-mass check"
    - protocol_id: cp_packaging_electricity
      process_id: "inspection_packaging"
      flow_role: "Packaging electricity"
      record_type: "Cell submeter or runtime log"
      raw_fields: "meter_id; readings; eligible_runtime; shared_load_driver"
      collection_method: "Submeter preferred; otherwise allocate measured packaging-cell load by runtime"
      unit: "kWh"
      frequency: "Each lot or shift; monthly reconciliation"
      temporal_coverage: "Same period as reference product output"
      site_scope: "Inspection and packaging cell"
      aggregation_rule: "Convert kWh to MJ and divide by reference output mass"
      quality_evidence: "Meter calibration; runtime log; allocation record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = eligible exchange quantity / measured market-ready net article output mass"
      inputs:
        - "eligible exchange quantity"
        - "market-ready net article output mass"
      output: "Exchange per 1 kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "Count-only product or packaging records"
      rule: "mass_kg = eligible count x contemporaneous mean same-SKU item mass_kg"
      inputs:
        - "eligible count"
        - "sampled item masses"
        - "sample size"
      output: "kg of article or paper box"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Electricity rows"
      rule: "energy_MJ = metered_kWh x 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_forming_mass_balance
      applies_to: "Forming process"
      rule: "unexplained difference = net metal stock input - accepted intermediate output - segregated scrap output - documented internal inventory change"
      inputs:
        - "metal stock"
        - "accepted output"
        - scrap
        - "inventory change"
      output: "Forming mass-balance difference"
      source_ids: []
    - id: calc_finishing_consumption
      applies_to: "Bath chemicals and coating metals"
      rule: "net consumption = opening inventory + additions - closing inventory - documented recovery - documented return"
      inputs:
        - "opening inventory"
        - additions
        - "closing inventory"
        - recovery
        - return
      output: "Net consumed mass by atomic material"
      source_ids:
        - ec-jrc-ferrous-metals-processing-bref-2022
    - id: calc_direct_fossil_co2
      applies_to: "Natural-gas combustion"
      rule: "direct fossil CO2 = measured stack CO2 or declared-condition fuel volume x validated documented site emission factor"
      inputs:
        - "measured CO2"
        - "fuel volume"
        - "reference condition"
        - "site emission factor"
      output: "kg direct fossil CO2"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Retain SKU, product subtype, dimensions or gauge, metal grade, coating, count per sales unit, staple-strip status and packaging configuration."
      evidence: "Approved specification, drawing, label and batch traveller"
    - id: dq_temporal_representativeness
      applies_to: "Foreground inventory"
      requirement: "Use a representative continuous 12-month period or a declared campaign that covers normal operating modes; disclose shutdowns, start-ups and excluded abnormal events."
      evidence: "Production calendar, meter coverage and campaign rationale"
    - id: dq_meter_quality
      applies_to: "Mass, water, gas and electricity"
      requirement: "Use calibrated instruments with traceable units and document estimates used to bridge data gaps."
      evidence: "Calibration certificates, meter register and gap log"
    - id: dq_completeness
      applies_to: "All controlled processes"
      requirement: "Reconcile purchased inputs, internal transfers, accepted output, scrap, wastewater, sludge and direct emissions; explain every excluded material exchange."
      evidence: "Signed mass-balance review and completeness checklist"
    - id: dq_route_specificity
      applies_to: "Conditional finishing and staple assembly"
      requirement: "Mark every conditional process and flow applicable or not applicable and retain evidence for the route decision."
      evidence: "Process flow diagram, work instructions and supplier finish declaration"
    - id: dq_upstream_matching
      applies_to: "Purchased inputs"
      requirement: "Match upstream datasets to actual flow identity, product state, geography and technology; disclose proxies."
      evidence: "Supplier records and upstream dataset mapping table"
    - id: dq_uncertainty_and_ranges
      applies_to: "Important flows"
      requirement: "Do not treat this PCR as supplying empirical consumption ranges; report foreground variability and uncertainty and flag missing range evidence."
      evidence: "Lot-level statistics, uncertainty method and unresolved-evidence register"
