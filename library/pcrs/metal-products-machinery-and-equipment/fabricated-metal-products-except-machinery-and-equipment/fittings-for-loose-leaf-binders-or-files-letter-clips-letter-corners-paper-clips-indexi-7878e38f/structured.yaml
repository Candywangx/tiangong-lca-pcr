      - un-cpc-3-0-2025
  - rule_id: validation_atomic_inventory
    applies_to: "process_inventory"
    rule: "Confirm every row is one atomic exchange; reject collection labels, mixed materials, combined utilities and combined wastes."
    source_ids: []
  - rule_id: validation_process_map
    applies_to: "process_inventory"
    rule: "Confirm every required process has a detailed inventory and every conditional process and row carries an evidenced applicability decision."
    source_ids: []
  - rule_id: validation_uuid_semantics
