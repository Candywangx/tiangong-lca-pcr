      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net dry or as-sold metal-product mass consistently. Exclude corrugated boxes and pallets from the 1 kg product reference mass and record them as separate inputs."
  - id: piece_to_mass_conversion
    applies_to: "Production or sales records available only as piece counts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert count to mass with a batch-specific verified average mass per conforming piece; retain the count, sample size, weighing method and uncertainty."
