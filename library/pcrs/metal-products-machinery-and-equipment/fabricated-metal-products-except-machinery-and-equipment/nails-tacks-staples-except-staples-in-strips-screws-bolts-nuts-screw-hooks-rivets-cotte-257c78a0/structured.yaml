allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared lines and utilities"
    rule: "Prefer physical subdivision, submeters and batch records. Allocate only the residual shared consumption that cannot be directly assigned."
    source_ids:
      - "—"
  - rule_id: allocation_shared_operations
    applies_to: "residual shared electricity, water and consumables"
    rule: "Allocate residual shared inputs by a documented causal driver such as machine time, treated mass, bath throughput or metered load; mass allocation is allowed only when it reasonably represents the causal relationship."
    source_ids:
      - "—"
  - rule_id: allocation_scrap_outputs
    applies_to: "metal scrap and rejected parts"
    rule: "Record scrap leaving the foreground system as waste with its measured mass and destination. Do not credit avoided primary metal production inside this foreground inventory; any recycling substitution belongs to a separately declared downstream scenario."
    source_ids:
      - "—"
  - rule_id: allocation_no_double_counting
    applies_to: "internal recycle and outsourced treatment"
    rule: "Exclude internally recirculated material from both input consumption and waste output. For outsourced operations, include either the supplier process dataset or its disaggregated inventory, never both."
    source_ids:
      - "—"
dataset_production:
  collection_protocols:
    - protocol_id: cp_forming_records
      process_id: "forming_and_machining"
      flow_role: "metal feedstocks, electricity, cutting fluid and metal scrap"
      record_type: "purchase, inventory, meter, batch and weighbridge records"
      raw_fields: "batch_id; article_id; alloy_grade; feedstock_form; opening_stock; receipts; closing_stock; returned_material; electricity; cutting_fluid_makeup; scrap_mass; conforming_output_mass"
      collection_method: "reconcile material stores to batch issue/return records; read dedicated meters or allocate documented shared meters; weigh each scrap stream by metal"
      unit: "kg; MJ"
      frequency: "each batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period including product mix"
      site_scope: "all included forming and machining lines at the declared site"
      aggregation_rule: "sum net flows by article route and divide by conforming output mass"
      quality_evidence: "calibrated scales and meters; stock reconciliation; batch traveller; scrap tickets"
    - protocol_id: cp_heat_treatment_records
      process_id: "heat_treatment"
      flow_role: "natural gas, electricity, quenching oil and direct fossil CO2"
      record_type: "meter, fuel-quality, bath-maintenance and stack records"
      raw_fields: "batch_id; furnace_id; treated_mass; gas_volume; gas_reference_conditions; electricity; quench_makeup; recovered_oil; fuel_carbon_content; oxidation_factor; measured_co2"
      collection_method: "read furnace meters; reconcile quench-oil make-up; use stack measurement or documented fuel-carbon calculation"
      unit: "m3; MJ; kg"
      frequency: "each heat-treatment batch with monthly meter reconciliation"
      temporal_coverage: "representative continuous 12-month period covering furnace loads"
      site_scope: "all on-site heat-treatment equipment used for the product"
      aggregation_rule: "assign metered flows to treated batches by measured load or operating time, then normalize to conforming output"
      quality_evidence: "meter calibration; fuel certificate; bath log; calculation sheet; stack report when available"
    - protocol_id: cp_finishing_records
      process_id: "cleaning_and_surface_finishing"
      flow_role: "water, cleaning chemicals, pickling acid, zinc, electricity, wastewater, oil sludge and spent pickling liquor"
      record_type: "meter, bath log, purchase, inventory, laboratory and waste-transfer records"
      raw_fields: "batch_id; treated_mass; water_input; recycle_water; chemical_product; concentration; bath_charge; bath_makeup; zinc_stock; electricity; wastewater_mass_or_volume; density; oil_sludge_mass; sludge_water_content; spent_liquor_mass; free_acid; dissolved_metals; destination"
      collection_method: "meter water and electricity; reconcile bath additions and zinc inventory; weigh wastes or convert measured volume with measured density; retain analytical composition"
      unit: "kg; MJ"
      frequency: "each bath charge and product batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period covering finishing routes"
      site_scope: "all on-site and contracted finishing routes attributed to the product"
      aggregation_rule: "subtract internal recycle and stock returns; normalize net inputs and outputs to conforming product mass"
      quality_evidence: "calibrated meters and scales; bath analyses; chemical certificates; waste manifests; supplier finishing data"
    - protocol_id: cp_packaging_records
      process_id: "inspection_and_packaging"
      flow_role: "accepted product, corrugated boxes, wooden pallets and electricity"
      record_type: "release, scale, packaging bill, pallet-loop and meter records"
      raw_fields: "batch_id; accepted_piece_count; sampled_piece_mass; accepted_product_mass; rejected_mass; box_mass; box_count; pallet_mass; pallet_count; pallet_trips; returned_pallets; electricity"
      collection_method: "weigh released product and packaging; verify count-to-mass conversion; reconcile pallet reuse; read or allocate packaging meter"
      unit: "kg; MJ"
      frequency: "each released shipment batch with monthly reconciliation"
      temporal_coverage: "representative continuous 12-month period covering package formats"
      site_scope: "all inspection and packaging operations at the declared site"
      aggregation_rule: "divide net packaging consumption and electricity by accepted product mass; exclude rejected product and packaging mass from reference output"
      quality_evidence: "calibrated scales; acceptance records; packaging specifications; pallet-return records; meter allocation"
  calculation_rules:
    - id: calc_normalize_to_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = net flow assigned to the declared product / net conforming product mass; the denominator excludes transport packaging"
      inputs:
        - "net batch or reporting-period flow"
        - "conforming product mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - "—"
    - id: calc_piece_count_to_mass
      applies_to: "piece-count records"
      rule: "product mass = accepted piece count × verified batch-average mass per piece; use direct batch weighing when available"
      inputs:
        - "accepted count"
        - "sampled or directly measured mass per piece"
      output: "conforming product mass"
      source_ids:
        - "—"
    - id: calc_direct_fossil_co2
      applies_to: "heat_treatment_fossil_co2"
      rule: "use measured direct stack CO2; otherwise calculate from metered fuel quantity × documented fuel carbon content × oxidation factor × 44/12, with consistent volume-to-mass conversion"
      inputs:
        - "gas volume and reference conditions or gas mass"
        - "carbon content"
        - "oxidation factor"
      output: "kg fossil CO2"
      source_ids:
        - "—"
    - id: calc_reusable_pallet
      applies_to: "wooden_pallet_input"
      rule: "effective pallet input = new pallet mass / documented lifetime trips for closed reuse loops; otherwise use net pallet purchases plus opening stock minus closing stock and verified returns"
      inputs:
        - "new pallet mass"
        - trips
        - purchases
        - stocks
        - returns
      output: "kg wooden pallet input"
      source_ids:
        - "—"
    - id: calc_mass_balance_check
      applies_to: "metal feedstocks, product and metal scrap"
      rule: "compare metal-bearing inputs with conforming output, metal scrap, inventory change and measured treatment losses for each declared metal; investigate unexplained imbalance rather than forcing closure"
      inputs:
        - "metal input"
        - "product output"
        - "metal-specific scrap"
        - "stock change"
        - "measured losses"
      output: "disclosed mass-balance residual"
      source_ids:
        - "—"
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Identify article type, alloy/grade, dimensions, thread, mechanical class, heat treatment, coating and applicable acceptance standard for every represented product family."
      evidence: "product specification; certificate of conformity; batch traveller"
    - id: dq_temporal_coverage
      applies_to: "foreground records"
      requirement: "Use a representative continuous 12-month period or justify a shorter period that captures product mix, furnace loads, bath cycles, maintenance and seasonal effects."
      evidence: "dated meter, production, inventory and waste records"
    - id: dq_mass_completeness
      applies_to: "metal inputs and outputs"
      requirement: "Reconcile each metal route to conforming product, metal-specific scrap, stock change and measured loss; disclose the residual and corrective investigation."
      evidence: "signed mass-balance worksheet; scale calibration; scrap tickets"
    - id: dq_route_separation
      applies_to: "conditional heat treatment and finishing"
      requirement: "Do not average absent and present operations without reporting route shares and allocation drivers. Supplier finishing data must match the declared coating and geography."
      evidence: "route-specific batch records; supplier dataset and specification"
    - id: dq_measurement_traceability
      applies_to: "all collected rows"
      requirement: "Retain meter or scale identifier, calibration status, raw unit, conversion, allocation driver and responsible record owner."
      evidence: "calibration certificates; raw exports; calculation workbook"
    - id: dq_uuid_qualifiers
      applies_to: "UUID-bearing flows"
      requirement: "Confirm that foreground product state, concentration, grade, geography and technology remain compatible with the selected Tiangong identity; UUID identity does not replace these qualifiers."
      evidence: "supplier certificate; flow direct-read audit; process note"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "product and reference flow"
    rule: "Fail validation if the article is outside the covered list, the material is not iron, steel, copper or aluminium, required qualifiers are missing, or the reference output is not exactly 1 kg net conforming product."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_inventory_atomicity
    applies_to: "process inventory"
    rule: "Each inventory row must identify one product, waste or elementary exchange. Reject umbrella utilities, combined fuels, combined packaging, combined wastes or unspecified emissions."
    source_ids:
      - "—"
  - rule_id: validate_process_applicability
    applies_to: "process map"
    rule: "Required processes must have foreground records. Conditional heat-treatment, pickling and zinc-coating rows must be present only when the declared route applies; absent routes require an explicit not-applicable statement outside amount totals."
    source_ids:
      - us-epa-metal-fastener-pollution-prevention-1995
      - ec-jrc-metal-surface-treatment-2022
  - rule_id: validate_mass_and_units
    applies_to: "measurements and calculations"
    rule: "Check kg reference mass, kWh-to-MJ conversion, gas reference conditions, count-to-mass evidence, package-mass exclusion and metal-specific mass-balance residuals."
    source_ids:
      - "—"
  - rule_id: validate_waste_and_recycling
    applies_to: "scrap, wastewater, sludge and spent liquor"
    rule: "Require measured mass, composition where material, destination and internal-recycle exclusion. Do not apply avoided-burden credits in the foreground inventory."
    source_ids:
      - us-epa-metal-fastener-pollution-prevention-1995
      - ec-jrc-metal-surface-treatment-2022
  - rule_id: validate_source_and_dataset_fit
    applies_to: "evidence and upstream datasets"
    rule: "Confirm source identifiers resolve, external evidence is used only for the supported rule, and every upstream dataset is compatible in geography, technology, material grade, product state and delivery boundary."
    source_ids:
      - "—"
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for one declared metal fastener or similar article route."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprints, LCA process datasets and lifecycle models requiring a factory-gate inventory for a declared CPC 42944 article with compatible material, process and finishing qualifiers."
  excluded_use: "Undeclared averages across metals or article types; staples in strips; springs; tubular or bifurcated rivets; installation, use or end-of-life claims; comparison of products with incompatible specifications or system boundaries."
  required_metadata: "PCR id and version; article type; material/alloy and grade; dimensions and mass per piece; mechanical class; forming and machining route; heat treatment; coating/finish; site and geography; reporting period; allocation; scrap and waste destinations; packaging; upstream dataset identifiers and substitutions."
  required_quality_disclosure: "Completeness by process and flow; meter and scale coverage; count-to-mass method; mass-balance residual; allocation shares; route shares; bath and waste composition; supplier-data coverage; temporal representativeness; unresolved UUID and range-evidence needs."
  update_trigger: "Material change in article mix, alloy, feedstock form, forming technology, furnace or fuel, coating route, wastewater treatment, packaging, allocation method, site geography, upstream datasets, or an updated representative reporting period."
