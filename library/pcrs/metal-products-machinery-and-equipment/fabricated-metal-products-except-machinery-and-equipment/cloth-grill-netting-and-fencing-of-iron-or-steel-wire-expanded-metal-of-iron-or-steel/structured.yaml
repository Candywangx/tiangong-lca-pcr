validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Verify that the reported reference output is exactly 1 kg net conforming product and that all required qualifiers are present."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_route_consistency
    applies_to: "process route and conditional rows"
    rule: "Verify that wire rod, purchased wire, flat steel sheet, drawing lubricant, pickling acid, zinc, process water, natural gas, spent liquor, zinc dross, and direct CO2 are included only when the declared route and site operations make them applicable; zero or omission requires evidence of non-applicability."
    source_ids:
      - usitc-standard-steel-welded-wire-mesh-2021
      - eu-jrc-ferrous-metals-processing-2022
      - ppg-expanded-metal-process-2018
  - rule_id: validation_mass_balance
    applies_to: "material inputs and outputs"
    rule: "Verify campaign-level reconciliation of steel and zinc-bearing inputs, conforming product, stock change, internal rework, scrap, dross, liquor, and separately named outputs; investigate and disclose residuals."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "foreground and upstream datasets"
    rule: "Verify that every site operation and direct exchange is included once, purchased-input production is linked upstream rather than duplicated, and same-category intermediates follow the recursive-input rule."
    source_ids: []
  - rule_id: validation_atomic_flows
    applies_to: "inventory completeness"
    rule: "Reject combined utilities, fuels, chemicals, wastes, emissions, or packaging collections; each actual exchange must be one specific flow with its own property, unit, amount rule, and route condition."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Cradle-to-gate process datasets and lifecycle models for declared steel wire mesh, netting, fencing, grill, or expanded-metal products"
  allowed_use: "Products and routes within this PCR when required qualifiers, boundary, temporal coverage, technology, and geography are materially representative"
  excluded_use: "Barbed wire; non-steel mesh; installation services; use or end-of-life; products with undisclosed alloy, geometry, coating, route, or reference mass; substitution across wire-mesh and expanded-metal routes without representativeness review"
  required_metadata: "PCR id; product family; alloy and grade; recycled-content basis; geometry and construction; coating and finish; delivery form; route; starting feedstock state; included operations; site and geography; reference period; allocation method; upstream dataset choices; unresolved or estimated exchanges"
  required_quality_disclosure: "Meter and scale coverage; material-balance residual; submeter allocation; temporal completeness; product-weighting across batches; missing-data treatment; waste and emissions coverage; UUID audit status; deviations from this PCR"
  update_trigger: "Change in product family, alloy, geometry, forming or joining technology, coating route, starting feedstock, recycled-content claim, site energy or water system, allocation driver, waste treatment, geography, or data older than the declared representativeness period"
