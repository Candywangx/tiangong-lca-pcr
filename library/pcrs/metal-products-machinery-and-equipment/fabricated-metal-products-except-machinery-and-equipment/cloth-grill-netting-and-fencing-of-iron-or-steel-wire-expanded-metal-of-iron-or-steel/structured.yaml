allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "mixed product families or materially different routes"
    rule: "Prefer separate meters, batch records, and process subdivision for wire-mesh and expanded-metal routes and for coated versus uncoated production. Do not allocate one undifferentiated plant total when route-resolved records exist."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared electricity, gas, water, and finishing operations"
    rule: "Allocate a shared operation using a documented physical driver causally related to consumption, such as machine time, metered energy, bath throughput, or processed mass. Report the driver and allocation factor; use economic allocation only when no defensible physical relationship exists and disclose a sensitivity check."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "post-industrial steel scrap and zinc-bearing outputs"
    rule: "Record separately measured waste outputs without avoided-burden credit in the foreground inventory. If a study applies recycling, substitution, or co-product treatment downstream, report that modelling choice, boundary, factor, and sensitivity outside the measured foreground exchange."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "route_specific_fabrication"
      flow_role: "steel_wire_rod_input; steel_wire_input; steel_sheet_input; lubricating_oil_input; hydrochloric_acid_30_input; zinc_metal_input"
      record_type: "purchase, weighbridge, stores, bath-inventory, and issue records"
      raw_fields: "material identity; alloy/grade; form; coating state; solution concentration; supplier; received mass; opening stock; closing stock; returns; campaign id"
      collection_method: "Reconcile receipts and stores or bath inventory to material issued to each declared campaign"
      unit: "kg"
      frequency: "each receipt and campaign; aggregate monthly or by production campaign"
      temporal_coverage: "At least 12 consecutive representative months, or the full shorter campaign with justification"
      site_scope: "All foreground lines and stores serving the declared product"
      aggregation_rule: "Sum receipts + opening stock - closing stock - off-site returns; assign only material issued to the declared campaign"
      quality_evidence: "Calibrated scale records; invoices; batch certificates; stock reconciliation; concentration certificate; exception log"
    - protocol_id: cp_energy_meters
      process_id: "route_specific_fabrication"
      flow_role: "electricity_input; natural_gas_input"
      record_type: "utility invoices, main meters, submeters, and operating-hour records"
      raw_fields: "meter id; opening reading; closing reading; unit; reference conditions for gas; production line; operating hours; campaign id"
      collection_method: "Prefer route and line submeters; otherwise allocate a reconciled main-meter balance using documented causal operating data"
      unit: "kWh, MJ, or m3"
      frequency: "continuous or shift readings; reconcile monthly"
      temporal_coverage: "Same period as production output, normally at least 12 representative months"
      site_scope: "All included site operations and documented auxiliary loads"
      aggregation_rule: "Net imports minus separately metered exports; convert kWh to MJ; allocate shared consumption by the disclosed driver"
      quality_evidence: "Meter calibration; invoice reconciliation; submeter coverage; downtime and missing-data log"
    - protocol_id: cp_water_meter
      process_id: "route_specific_fabrication"
      flow_role: "process_water_input"
      record_type: "water meters, tank levels, make-up logs, and production records"
      raw_fields: "source; meter id; opening and closing readings; tank stock change; recirculation; discharge; campaign id"
      collection_method: "Measure fresh process-water make-up crossing the boundary and reconcile tank stock changes"
      unit: "kg or m3 with measured density"
      frequency: "daily or per batch; reconcile monthly"
      temporal_coverage: "Same period as production output"
      site_scope: "Cleaning, rinsing, bath make-up, and direct process cooling included in the route"
      aggregation_rule: "Fresh input + opening stock - closing stock - documented off-site return; do not count internal recirculation repeatedly"
      quality_evidence: "Meter calibration; tank reconciliation; water-source and quality record; density record when converting volume"
    - protocol_id: cp_output_and_waste_mass
      process_id: "route_specific_fabrication"
      flow_role: "reference_product_output; steel_scrap_output; spent_pickling_liquor_output; zinc_dross_output"
      record_type: "finished-goods scales, batch records, waste manifests, tank transfers, and recovery records"
      raw_fields: "product family; grade; geometry; coating; conforming mass; reject mass; scrap mass; liquor mass; dross mass; stock change; destination; campaign id"
      collection_method: "Weigh conforming output and each segregated waste; meter tank transfers where weighing is impracticable"
      unit: "kg"
      frequency: "each batch or shipment; reconcile monthly"
      temporal_coverage: "Same period as material and energy inputs"
      site_scope: "All included lines, finishing areas, and waste storage serving the declared product"
