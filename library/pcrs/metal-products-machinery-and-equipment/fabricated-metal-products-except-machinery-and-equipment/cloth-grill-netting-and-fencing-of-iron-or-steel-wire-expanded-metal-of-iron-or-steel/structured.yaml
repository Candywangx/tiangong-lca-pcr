measurement_rules:
  - id: reference_mass
    applies_to: "reference product and mass-based inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net dry mass of conforming product. Exclude detachable packaging, pallets, carriers, and unrecovered process scrap. Report moisture or retained process liquid if material to the delivered state."
  - id: area_to_mass
    applies_to: "production or sales records reported by area"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert m2 to kg only with measured lot- or product-specific mass per area that matches alloy, wire or strand dimensions, aperture, and coating. Do not use a category-wide default conversion."
  - id: electricity_energy
    applies_to: "purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity by delivery point and convert kWh to MJ using 1 kWh = 3.6 MJ; disclose voltage level, grid geography, and whether transformation or site-distribution losses are included."
  - id: gas_volume
    applies_to: "gaseous natural gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered gas volume at the stated temperature and pressure reference conditions. Convert to energy only with a measured or supplier-specific calorific value for the same period."
  - id: solution_mass
    applies_to: "Hydrochloric acid (30%) and other supplied solutions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record mass of the supplied solution and its concentration. Do not report active-acid mass as though it were supplied-product mass."
