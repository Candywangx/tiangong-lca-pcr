system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts with purchased metal sheet, coil or cast sanitary-ware blank received at the manufacturing-site gate. It includes onsite cutting, forming, annealing when used, joining, washing, grinding/polishing, conditional surface preparation, application of declared sound-deadening components, inspection and factory packaging. Upstream production and delivery of purchased materials and energy shall be represented by supplier-specific or otherwise representative cradle-to-site datasets. Building-site installation, use, maintenance and end-of-life are outside this PCR."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "all datasets"
      rule: "Include controlled onsite manufacture through inspection and factory packaging and stop at the manufacturing-site gate; exclude installation, use, maintenance and end-of-life."
      source_ids:
        - elkay-undermount-sink-epd-2023
    - rule_id: boundary_route_disclosure
      applies_to: "forming and finishing route"
      rule: "Include only route-applicable atomic exchanges and explicitly disclose annealing, joining, washing, polishing, surface treatment and sound-deadening operations."
      source_ids:
        - elkay-undermount-sink-epd-2023
        - usitc-drawn-stainless-steel-sinks-2024
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs"
      rule: "Link each purchased input to a cradle-to-site dataset matching its declared material, state and supply geography."
      source_ids: []
