allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared forming, finishing and packing operations"
    rule: "Avoid allocation by sub-metering production lines, products, campaigns and waste streams wherever practical."
    source_ids: []
  - rule_id: allocation_physical_causality
    applies_to: "residual shared inputs and outputs"
    rule: "Use a documented physical causal driver such as machine time, metered energy, processed metal mass or counted packed units; use output mass only when no more causal driver is available and disclose the sensitivity."
