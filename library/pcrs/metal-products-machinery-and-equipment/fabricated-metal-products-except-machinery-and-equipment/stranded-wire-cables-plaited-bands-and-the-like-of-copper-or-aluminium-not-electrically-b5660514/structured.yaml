system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground physical boundary"
      rule: "Include all on-site drawing, annealing, degreasing, cleaning, stranding, bunching, braiding, compaction, inspection, rework, internal handling and directly associated pollution-control operations performed before accepted bare product leaves the factory gate."
