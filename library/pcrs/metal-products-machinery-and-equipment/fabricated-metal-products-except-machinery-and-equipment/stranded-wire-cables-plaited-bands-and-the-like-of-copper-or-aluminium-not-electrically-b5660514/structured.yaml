allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "independently metered lines and process steps"
    rule: "Avoid allocation by subdividing preparation and stranding operations and by using line meters, batch records and material issues whenever practicable."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "internal rework"
    rule: "Keep same-period rework circulating within the process inventory. Count only net external inputs, accepted product, waste leaving the foreground and period-end stock change."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "copper or aluminium scrap"
    rule: "Report segregated scrap as a waste output at the measured foreground boundary. Do not subtract an avoided primary-metal burden or recycling credit inside this foreground inventory; apply any downstream recycling method outside the PCR foreground and disclose it."
    source_ids: []
  - rule_id: allocation_shared_services
    applies_to: "shared electricity, water, fuel and auxiliaries"
    rule: "Allocate shared services first by a measured causal driver such as line meter, machine time, throughput or furnace load. If no causal driver is available, use accepted product mass, document the affected share and test sensitivity for materially different conductor constructions."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_preparation_materials
      process_id: "wire_preparation"
      flow_role: "copper/aluminium wire input and prepared-wire transfer"
      record_type: "goods receipt, issue, transfer and stock record"
      raw_fields: "metal; alloy; temper; coating; opening stock; receipts; issues; transfers; closing stock; lot; scale id"
      collection_method: "reconcile weighbridge, scale and enterprise records by metal and lot"
      unit: "kg"
      frequency: "each receipt/transfer and monthly reconciliation"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "all included preparation lines"
      aggregation_rule: "net consumed or transferred mass divided by accepted reference-product mass and multiplied by 1,000"
      quality_evidence: "calibration record; supplier certificate; stock reconciliation; lot traceability"
    - protocol_id: cp_preparation_utilities
      process_id: "wire_preparation"
      flow_role: "electricity, water, lubricant, natural gas and sodium hydroxide"
      record_type: "meter, purchase, tank and bath-addition record"
      raw_fields: "meter opening/closing; kWh; water volume/mass; gas volume and reference conditions; product mass; concentration; internal recycle; allocation driver"
      collection_method: "use dedicated meters where available; otherwise documented causal allocation from facility records"
      unit: "MJ, kg or m3 as applicable"
      frequency: "continuous or each batch, reconciled monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "included preparation and pollution-control equipment"
      aggregation_rule: "subtract documented internal returns, apply required unit conversion, divide by accepted reference-product mass and multiply by 1,000"
      quality_evidence: "meter calibration; invoices; batch sheets; allocation worksheet; concentration certificate"
    - protocol_id: cp_preparation_wastes
      process_id: "wire_preparation"
      flow_role: "segregated metal scrap, spent lubricant and oily wastewater"
      record_type: "scrap ticket, waste manifest, tank drawdown and discharge meter"
      raw_fields: "waste identity; metal; mass/volume; density; origin; internal recycle; destination; treatment route; date"
      collection_method: "weigh each shipment or use calibrated tank/discharge records; keep internal recycle separate"
      unit: "kg"
      frequency: "each shipment or discharge, reconciled monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "all included preparation lines and directly associated treatment"
      aggregation_rule: "net mass leaving foreground divided by accepted reference-product mass and multiplied by 1,000"
      quality_evidence: "scale/meter calibration; waste manifest; destination receipt; density record; discharge log"
    - protocol_id: cp_preparation_emissions
      process_id: "wire_preparation"
      flow_role: "direct fossil carbon dioxide"
      record_type: "stack-monitoring or accepted site emissions record"
      raw_fields: "source id; fuel; monitoring period; measured CO2 mass; operating hours; allocation driver; data gaps"
      collection_method: "use measured site record and allocate only the included source share"
      unit: "kg"
      frequency: "continuous or reporting-period record"
      temporal_coverage: "same period as activity data"
      site_scope: "on-site fuel combustion serving included preparation"
      aggregation_rule: "attributable fossil CO2 divided by accepted reference-product mass and multiplied by 1,000"
      quality_evidence: "monitor QA/QC; emissions report; source-to-line allocation record"
    - protocol_id: cp_stranding_materials
      process_id: "stranding_and_finishing"
      flow_role: "copper/aluminium wire input, accepted product and segregated scrap"
      record_type: "material issue, production, inspection, rework, scrap and stock record"
      raw_fields: "metal; alloy; construction; opening stock; issues; accepted mass; rework return; scrap mass; closing stock; lot; scale id"
      collection_method: "reconcile line and warehouse records by product lot and conductor metal"
      unit: "kg"
      frequency: "each lot and monthly reconciliation"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "all stranding, braiding, compaction and final-inspection lines"
      aggregation_rule: "net input, accepted output and net outgoing scrap divided by accepted reference-product mass and multiplied by 1,000"
      quality_evidence: "calibration record; acceptance record; scrap ticket; stock reconciliation; lot traceability"
    - protocol_id: cp_stranding_utilities
      process_id: "stranding_and_finishing"
      flow_role: "electricity"
      record_type: "electricity meter and machine-time record"
      raw_fields: "meter opening/closing; kWh; operating time; product lot; shared auxiliary load; allocation driver"
      collection_method: "dedicated line meter or documented causal allocation"
      unit: "kWh retained and MJ reported"
      frequency: "continuous or per batch, reconciled monthly"
      temporal_coverage: "representative reporting year or declared campaign"
      site_scope: "stranding and directly associated finishing equipment"
      aggregation_rule: "convert kWh to MJ, divide by accepted reference-product mass and multiply by 1,000"
      quality_evidence: "meter calibration; machine log; allocation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every non-fixed inventory exchange"
      rule: "normalized amount = attributable reporting-period amount / accepted reporting-period product mass × 1,000"
      inputs:
        - "attributable exchange amount"
        - "accepted product mass in kg"
      output: "exchange amount per 1,000 kg accepted reference product"
      source_ids: []
    - id: calc_stock_adjusted_input
      applies_to: "copper wire, aluminium wire, lubricant and chemicals"
      rule: "consumed amount = opening stock + receipts - returns to supplier - closing stock - documented transfer outside the included process"
      inputs:
        - "opening stock"
        - receipts
        - returns
        - "closing stock"
        - transfers
      output: "stock-adjusted consumed mass"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "reported MJ = metered kWh × 3.6, followed by reference normalization"
      inputs:
        - "attributable kWh"
        - "accepted product mass"
      output: "MJ per 1,000 kg accepted product"
      source_ids: []
    - id: calc_metal_reconciliation
      applies_to: "each conductor metal separately"
      rule: "unexplained metal difference = opening metal stock + external metal inputs - accepted product - outgoing same-metal scrap - other measured same-metal outputs - closing metal stock"
      inputs:
        - "metal-specific stock"
        - "input and output records"
      output: "absolute and percentage unexplained metal difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and metal flows"
      requirement: "Retain product specification, alloy/temper certificate, strand geometry, construction, coating status, insulation status and lot link; copper and aluminium routes must not be aggregated into one physical dataset."
      evidence: "specification; certificate of analysis; inspection record; lot genealogy"
    - id: dq_measurement
      applies_to: "mass, energy, gas and water records"
      requirement: "Use calibrated devices within their valid range; retain raw readings, tare treatment, unit conversions, reference conditions and allocation worksheets."
      evidence: "calibration certificate; meter export; weigh ticket; conversion record"
    - id: dq_temporal
      applies_to: "foreground activity"
      requirement: "Cover a representative twelve-month period or disclose a shorter campaign, shutdowns, abnormal lots and seasonal effects."
      evidence: "production calendar; downtime log; reporting-period statement"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile purchase, meter, production, scrap, waste and stock records; investigate omitted baths, auxiliary systems, pollution controls and direct emissions before release."
      evidence: "reconciliation checklist; variance investigation; signed completeness review"
    - id: dq_upstream
      applies_to: "purchased wire, utilities and chemicals"
      requirement: "Document supplier, geography, technology, delivery boundary, dataset vintage and any recycled-content claim; prevent double-counting on-site drawing or annealing in upstream wire data."
      evidence: "supplier declaration; upstream dataset metadata; boundary comparison"
    - id: dq_unresolved_identity
      applies_to: "UUID-empty rows"
      requirement: "Keep the concrete flow name and foreground record, but do not substitute a proxy UUID. Resolve the reference product, wire-drawing lubricant and oily wastewater identities before publication."
      evidence: "finalized UUID-search review record; reviewer sign-off"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "functional unit and reference output"
    rule: "Confirm exactly 1,000 kg accepted bare product, carrier tare and packaging excluded, with every required qualifier declared."
    source_ids:
      - un-cpc-3-0-structure-2025
      - nist-wire-cable-terminology-circular-37
  - rule_id: validation_scope
    applies_to: "product eligibility"
    rule: "Reject datasets for insulated, optical-fibre, iron/steel-rope or non-copper/non-aluminium-core products and reject solid wire sold without stranding."
    source_ids:
      - un-cpc-3-0-structure-2025
      - nist-wire-cable-terminology-circular-37
  - rule_id: validation_process_map
    applies_to: "process coverage"
    rule: "Require stranding_and_finishing; require wire_preparation only when drawing, annealing, degreasing or cleaning is performed on site, and verify that upstream data do not duplicate those steps."
    source_ids:
      - us-epa-nonferrous-forming-guidance-1989
      - aluminum-association-processing-101
  - rule_id: validation_atomic_flows
    applies_to: "inventory structure"
    rule: "Confirm every selected flow is one product, waste or elementary exchange; reject combined utilities, fuels, chemicals, packaging, wastes or emissions."
    source_ids: []
  - rule_id: validation_metal_balance
    applies_to: "copper and aluminium mass balance"
    rule: "Reconcile each conductor metal independently and require the site to define, justify and investigate its material unexplained-loss threshold; never offset a copper difference with aluminium."
    source_ids: []
  - rule_id: validation_energy_and_water
    applies_to: "electricity, gas and water"
    rule: "Verify electricity conversion, gas reference conditions, water-density conversion, meter coverage and internal-recycle treatment; reject double-counted recirculation."
    source_ids: []
  - rule_id: validation_scrap_allocation
    applies_to: "scrap and rework"
    rule: "Confirm internal rework is netted within the process, outgoing scrap is measured, destinations are disclosed and no avoided burden is subtracted inside the foreground."
    source_ids: []
  - rule_id: validation_uuid_and_sources
    applies_to: "identity and evidence"
    rule: "Verify every UUID at public state 100 with matching flow type, property and unit group; require explicit unresolved metadata for UUID-empty rows and original-text evidence for any future external numeric range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for a declared bare copper or aluminium stranded product"
  downstream_use: "secondary_dataset; background_dataset after methodology review and resolution of publication blockers"
  allowed_use: "Product-system studies in which conductor metal, construction, plant geography, production route, starting-stock boundary and delivery state match the declared dataset"
  excluded_use: "Solid wire; insulated or optical cable; steel wire rope; composite/reinforced-core conductor; installation, use or end-of-life; substitution between copper and aluminium without a new foreground record"
  required_metadata: "PCR id and version; conductor metal/alloy/temper; coating; construction and lay/braid; strand geometry; cross-section; mass per length; electrical test basis; factory/geography; period; starting stock; included preparation; upstream datasets; scrap destination; water route; allocation; delivery form"
  required_quality_disclosure: "Meter and scale coverage; calibration; temporal representativeness; metal-balance result; stock adjustments; internal recycle; shared-service allocation; upstream boundary matching; data gaps; unresolved UUIDs; source and range limitations"
  update_trigger: "Change in conductor metal/alloy, construction, coating, wire gauge, drawing or annealing technology, lubricant or cleaning system, energy supply, water/discharge route, scrap treatment, facility, upstream wire boundary, or a material change in energy, yield or waste performance"
