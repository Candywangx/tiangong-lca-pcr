system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default boundary begins when purchased materials, bought-in components, energy carriers, water and process consumables cross the manufacturing-site boundary. It includes material preparation, forming and machining, permanent joining, assembly, conditional cleaning and heat treatment, inspection, NDT, factory pressure or leak testing, and protective packing. It ends with accepted complete equipment at the factory gate. The process sequence and pressure-equipment quality controls are supported by official pressure-equipment and NDT guidance (uk-pressure-equipment-guidance-2025, uk-hse-ndt-pressure-equipment, uk-hse-pressure-testing-gs4)."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include all in-factory preparation, joining, assembly, conditioning, inspection, testing and packing attributable to the accepted product; exclude customer-site installation and use unless separately modelled and disclosed."
      source_ids:
        - uk-pressure-equipment-guidance-2025
        - uk-hse-ndt-pressure-equipment
    - rule_id: boundary_pressure_controls
      applies_to: "pressure-bearing products"
      rule: "Include the actual permanent-joining qualification, NDT, final inspection and pressure or leak-test activities required by the declared design code or conformity regime."
      source_ids:
        - uk-pressure-equipment-guidance-2025
        - uk-hse-ndt-pressure-equipment
        - uk-hse-pressure-testing-gs4
    - rule_id: boundary_recursive_equipment
      applies_to: "same-category purchased equipment"
      rule: "Stop recursive foreground tracing at the purchased complete equipment boundary and require a separate upstream dataset for that input."
      source_ids: []
    - rule_id: boundary_direct_emissions
      applies_to: "site energy and treatment"
      rule: "Report only direct site emissions in this foreground inventory; keep upstream emissions within the corresponding purchased-input datasets."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased plates, tubes, welding consumables, bought-in components, gases, energy, water and packaging materials at the manufacturing-site gate, with specification, mass and supplier geography declared"
  starting_condition_role: "Upstream product inputs with complete upstream datasets; no unreported embedded production is treated as foreground"
  product_classification_scope: "Complete equipment within the CPC 42330 semantic boundary; boilers, turbines and separately supplied parts remain outside this PCR"
  recursive_input_rule: "A purchased complete CPC 42330 unit incorporated into a larger deliverable is recorded once as a product input with an upstream dataset and is not recursively decomposed by this foreground process"
  upstream_dataset_requirement: "Each purchased material, component, fuel, gas, electricity supply, water supply and packaging input requires a geographically and technologically representative upstream dataset or an explicit data gap"
  disclosure: "Declare manufacturing route, outsourced steps, cut-offs, site and period, material grades, product subtype, test route, packaging boundary, allocation drivers and any installation or use stages intentionally added"
