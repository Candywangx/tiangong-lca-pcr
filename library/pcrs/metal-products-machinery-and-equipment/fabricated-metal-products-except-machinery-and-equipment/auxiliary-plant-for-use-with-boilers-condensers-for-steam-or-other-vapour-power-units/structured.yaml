validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "Confirm exactly one 1 kg reference-product output uses the audited CPC 42330 UUID, Mass property and kg unit, and that removable packaging is excluded from net product mass."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_identity_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail completeness when product subtype, designation, technical specification, material grades, manufacturing geography, factory-acceptance state or applicable pressure/design qualifiers are missing."
    source_ids:
      - uk-pressure-equipment-guidance-2025
      - doosan-steam-condensers-heat-exchangers
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm each inventory row is one atomic exchange; each conditional row has a documented applicable route; UUID-bearing rows match flow type, property and unit; unresolved plate UUIDs remain explicitly flagged."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "metal inputs, product and scrap"
    rule: "Review the order-level material reconciliation and require an explanation for differences exceeding the site's documented measurement uncertainty."
    source_ids: []
  - rule_id: validate_energy_water_balance
    applies_to: "electricity, gases and water"
    rule: "Confirm meters, allocation drivers, reference conditions, density conversions, water reuse and normalization all refer to the same production period and accepted output."
    source_ids: []
  - rule_id: validate_direct_emissions
    applies_to: "fossil carbon dioxide"
    rule: "Confirm the row includes direct on-site natural-gas combustion only and that the factor or carbon balance is cited and applicable to the foreground site and period."
    source_ids: []
  - rule_id: validate_pressure_controls
    applies_to: "pressure-bearing equipment"
    rule: "Confirm required joining qualifications, NDT, final inspection and pressure or leak-test evidence are retained for the declared conformity route."
    source_ids:
      - uk-pressure-equipment-guidance-2025
      - uk-hse-ndt-pressure-equipment
      - uk-hse-pressure-testing-gs4
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after methodology review and dataset verification"
  downstream_use: "Cradle-to-gate process datasets and lifecycle-model inputs for complete CPC 42330 boiler auxiliary plant or steam/vapour power-unit condensers"
  allowed_use: "Product- and route-matched equipment with comparable pressure status, design/conformity basis, material system, manufacturing geography, factory-gate condition and packaging boundary"
  excluded_use: "Boilers, turbines, valves, standalone pumps or fans, separately supplied parts, customer-site installation, operational performance, maintenance, retrofit and end-of-life without added scenario data"
  required_metadata: "PCR id and version; product subtype; model or project; technical specification; pressure/design qualifiers; material grades; net product mass; manufacturing site and period; route and outsourced operations; allocation; data sources; cut-offs; packaging and test boundary"
  required_quality_disclosure: "Primary-data share; measurement and allocation methods; unresolved UUIDs; missing two-source ranges; material, energy and water reconciliation; factor citations; representativeness; uncertainty and verification status"
  update_trigger: "Material change in product design, mass or grade; manufacturing route, supplier, site, energy mix, test regime, packaging, allocation, applicable conformity requirement, foreground period or background data"
