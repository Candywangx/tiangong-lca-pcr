allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "product orders and distinguishable operations"
    rule: "Avoid allocation by submetering and assigning material issues, machine records, test records, scrap and packaging directly to the production order."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared electricity, gas, water and common operations"
    rule: "When direct assignment is not possible, use a documented physical driver that reflects causation, such as measured machine energy, machine hours, weld length, test volume or net processed mass; do not use revenue unless no defensible physical driver exists."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "steel scrap"
    rule: "Treat measured scrap as a waste output at the point it leaves the foreground process. Do not credit avoided primary metal in the foreground result; model receiving recycling or treatment separately under the chosen background convention."
    source_ids: []
  - rule_id: allocation_packaging
    applies_to: "product-specific timber and film"
    rule: "Assign product-specific packaging directly to the delivered order; allocate shared packaging by measured packaging mass or net packaged product mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_packaging_records
      process_id: "equipment_manufacturing_and_acceptance"
      flow_role: "metal inputs, welding wire, cleaning chemical, timber and LDPE film"
      record_type: "receiving tickets, certified material records, bill of materials, stores issues and returns, supplier invoices"
      raw_fields: "production_order; material_code; grade_or_formula; supplied_mass; concentration; issued_mass; returned_mass; packaging_mass; supplier; geography"
      collection_method: "reconcile certified bill-of-material and stores transactions to the accepted production order"
      unit: "kg and mass fraction"
      frequency: "each issue and return; aggregate per accepted order"
      temporal_coverage: "full manufacturing period for the order"
      site_scope: "all owned and contracted operations included in the boundary"
      aggregation_rule: "consumed mass = received or issued mass minus verified return, with concentration conversion where applicable; normalize by accepted net product mass"
      quality_evidence: "material certificate, invoice, calibrated scale record, stores ledger and approved bill of materials"
    - protocol_id: cp_energy_and_gas_records
      process_id: "equipment_manufacturing_and_acceptance"
      flow_role: "electricity, industrial oxygen and natural gas"
      record_type: "submeters, utility meters, cylinder or bulk-gas invoices and production logs"
      raw_fields: "timestamp; meter_start; meter_end; unit; production_order; machine_hours; gas_volume; reference_temperature; reference_pressure; grid_or_supplier"
      collection_method: "direct submetering preferred; otherwise allocate contemporaneous meter totals with the approved physical driver"
      unit: "kWh, MJ and m3"
      frequency: "each shift or batch; monthly utility reconciliation"
      temporal_coverage: "representative order period, with at least one complete production cycle"
      site_scope: "manufacturing site and declared contracted operations"
      aggregation_rule: "subtract unrelated loads, apply documented allocation, convert electricity with 3.6 MJ/kWh and normalize by accepted net product mass"
      quality_evidence: "meter calibration, invoices, shift logs and allocation worksheet"
    - protocol_id: cp_water_records
      process_id: "equipment_manufacturing_and_acceptance"
      flow_role: "process water and hydrostatic-test wastewater"
      record_type: "water meters, test sheets, tank-volume records, discharge manifests and reuse logs"
      raw_fields: "source; input_volume_or_mass; test_volume; reused_volume_or_mass; retained_water; discharged_volume_or_mass; density; additives; destination"
      collection_method: "meter or weigh each fill, reuse and discharge; reconcile water balance by test campaign"
      unit: "kg and m3"
      frequency: "each cleaning or test campaign"
      temporal_coverage: "full manufacturing and acceptance-test period"
      site_scope: "all water-using operations in the foreground boundary"
      aggregation_rule: "convert volume with documented density where needed; input = reuse + discharge + retained water + explained loss; normalize by accepted net product mass"
      quality_evidence: "calibrated meter, signed test sheet, discharge record and balance check"
    - protocol_id: cp_output_and_waste_records
      process_id: "equipment_manufacturing_and_acceptance"
      flow_role: "reference product and steel scrap"
      record_type: "final weighing, acceptance certificate, scrap scales, stock-return notes and waste transfer records"
      raw_fields: "production_order; accepted_product_mass; packaging_mass; scrap_mass; returned_to_stock_mass; receiver; treatment_route"
      collection_method: "weigh accepted equipment without removable packaging and weigh each scrap transfer"
      unit: "kg"
      frequency: "each accepted product and scrap transfer"
      temporal_coverage: "full production order"
      site_scope: "manufacturing site and included contractors"
      aggregation_rule: "sum accepted net product and attributable scrap over the same order; normalize all flows to 1 kg product"
      quality_evidence: "calibrated scale certificate, acceptance record, scrap ticket and receiver documentation"
    - protocol_id: cp_direct_combustion_records
      process_id: "equipment_manufacturing_and_acceptance"
      flow_role: "fossil carbon dioxide"
      record_type: "natural-gas records, supplier fuel properties, approved factor or carbon-balance worksheet"
      raw_fields: "gas_volume; reference_conditions; net_calorific_value_if_used; carbon_content_or_co2_factor; factor_source; oxidation_assumption; production_order"
      collection_method: "calculate only direct site CO2 from collected gas consumption and a cited factor applicable to the site and period"
      unit: "kg CO2 and m3 gas"
      frequency: "each reporting period containing on-site gas combustion"
      temporal_coverage: "same period as gas consumption"
      site_scope: "combustion inside foreground site only"
      aggregation_rule: "CO2 = attributable gas quantity multiplied by documented applicable factor, then normalized by accepted net product mass"
