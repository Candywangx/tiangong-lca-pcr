measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize to the measured net mass of complete factory-accepted equipment. Exclude removable transport packaging from reference product mass and report its inputs separately."
  - id: electricity_energy_conversion
    applies_to: "manufacturing_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electricity before conversion; convert kWh to MJ using 1 kWh = 3.6 MJ and disclose grid geography, voltage and loss boundary."
