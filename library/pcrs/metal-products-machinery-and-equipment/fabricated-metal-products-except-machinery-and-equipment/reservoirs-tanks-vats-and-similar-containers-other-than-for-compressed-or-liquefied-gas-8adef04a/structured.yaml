system_boundary:
  rules:
    - rule_id: boundary_factory_gate
      applies_to: "foreground manufacturing"
      rule: "Include purchased-input receipt, cutting/forming, welding/joining, route-specific surface finishing, inspection, on-site waste or emission control, and release of the finished product through the manufacturing gate."
      source_ids:
        - un-cpc-3-0-structure-2025
        - us-ecfr-40-cfr-63-subpart-xxxxxx
    - rule_id: boundary_conditional_finishing
      applies_to: "surface treatment and coating"
      rule: "Include aqueous treatment, cleaning, coating application, curing, and equipment cleaning only when performed for the declared product; record each chemical, coating, waste, and emitted substance as a separate exchange."
      source_ids:
        - eu-jrc-stm-bref-2006
        - us-ecfr-40-cfr-63-subpart-xxxxxx
    - rule_id: boundary_outsourced_operations
      applies_to: "outsourced fabrication"
      rule: "Include an outsourced operation by its supplier process dataset and the product or service crossing the reporting boundary; avoid double counting its direct energy, chemicals, wastes, or emissions at the reporting factory."
      source_ids:
        - eu-commission-recommendation-2021-2279
    - rule_id: boundary_exclusions
      applies_to: "downstream and non-product activities"
      rule: "Exclude installation, foundations, external piping, use, maintenance, decommissioning, and end-of-life from this factory-gate profile unless the study explicitly expands the boundary and reports them separately."
      source_ids:
        - un-cpc-3-0-structure-2025
