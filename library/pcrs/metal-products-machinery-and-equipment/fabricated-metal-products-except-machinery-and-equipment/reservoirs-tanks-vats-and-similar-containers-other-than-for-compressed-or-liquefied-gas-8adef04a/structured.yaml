allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared fabrication and utility systems"
    rule: "Avoid allocation by separately metering or otherwise subdividing product orders, process lines, and utility systems whenever technically feasible."
    source_ids:
      - eu-commission-recommendation-2021-2279
  - rule_id: allocation_shared_records
    applies_to: "unavoidable shared energy, water, and consumables"
    rule: "When subdivision is not feasible, apply a documented causal driver such as machine time, weld length, treated area, bath loading, or measured product mass; do not default to revenue without demonstrating the absence of a physical driver."
    source_ids:
      - eu-commission-recommendation-2021-2279
  - rule_id: allocation_scrap
    applies_to: "steel and aluminium scrap"
    rule: "Report measured scrap as a waste output at the point it leaves the foreground process. Do not subtract an avoided-primary-material credit from the foreground inventory; model recycling or treatment consistently in the downstream system and disclose the chosen convention."
    source_ids:
      - eu-commission-recommendation-2021-2279
  - rule_id: allocation_nonconforming_products
    applies_to: "rework and rejects"
    rule: "Assign rework inputs and unrecovered reject burdens to the production order that generated them when traceable; otherwise use the same documented causal allocation driver as the shared process."
    source_ids:
      - eu-commission-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_scrap
      process_id: "material_preparation_forming"
      flow_role: "metal inputs and segregated scrap outputs"
      record_type: "receiving, issue, return, weighbridge, and waste-transfer records"
      raw_fields: "order_id; material; grade/alloy; supplier; batch; gross_mass; returned_mass; scrap_mass; destination"
      collection_method: "Calibrated scale, stock ledger, and order reconciliation"
      unit: "kg"
      frequency: "Each receipt, issue, return, and transfer"
      temporal_coverage: "At least one representative production year; state shorter campaign coverage"
      site_scope: "All included production lines and outsourced forming declared"
      aggregation_rule: "Sum accepted issued mass net of returns and sum segregated scrap by metal; divide by conforming output mass"
      quality_evidence: "Calibration records, purchase documents, material certificates, stock reconciliation, waste transfer notes"
    - protocol_id: cp_process_energy
      process_id: "all_processes"
      flow_role: "process electricity"
      record_type: "utility meter and production log"
      raw_fields: "meter_id; start_reading; end_reading; unit; process_id; order_id; operating_time; allocation_driver; voltage; grid_or_onsite"
      collection_method: "Dedicated meter preferred; otherwise reconciled submeter or shared-meter allocation"
      unit: "kWh and MJ"
      frequency: "Per batch/order or monthly with production reconciliation"
      temporal_coverage: "Same representative period as output"
      site_scope: "All included site operations; outsourced energy excluded from site totals"
      aggregation_rule: "Convert kWh to MJ and allocate by measured causal driver; divide by conforming output mass"
      quality_evidence: "Meter calibration, invoices, interval data, allocation worksheet"
    - protocol_id: cp_welding_inputs
      process_id: "joining_assembly"
      flow_role: "welding wire, covered electrode, and argon"
      record_type: "stores issue/return, cylinder, and welding procedure records"
      raw_fields: "order_id; process_type; consumable_grade; issued_mass; returned_mass; gas_id; gas_volume_or_mass; reference_conditions; weld_length"
      collection_method: "Weighed issue/return and gas meter or cylinder inventory reconciliation"
      unit: "kg and m3"
      frequency: "Each order or shift"
      temporal_coverage: "Same representative period as output"
      site_scope: "All included welding cells and declared outsourced joining"
      aggregation_rule: "Net each atomic consumable separately; convert gas only with documented reference conditions; divide by conforming output mass"
      quality_evidence: "Purchase record, weld procedure, material certificate, scale/meter calibration, cylinder reconciliation"
    - protocol_id: cp_welding_emissions
      process_id: "joining_assembly"
      flow_role: "controlled PM10 release"
      record_type: "monitoring or engineering-calculation record"
      raw_fields: "process_type; electrode_type; base_metal; current; voltage; electrode_consumed; capture_efficiency; control_efficiency; measured_PM10; release_compartment"
      collection_method: "Direct monitoring preferred; otherwise documented approved calculation matched to actual process and controls"
      unit: "kg"
      frequency: "Each monitored campaign or calculation period"
      temporal_coverage: "Representative operating modes in the reporting year"
      site_scope: "Every included welding release point"
      aggregation_rule: "Determine post-control PM10 and divide by conforming output mass; no default compartment is assigned"
      quality_evidence: "Monitoring report, method detection limits, equipment settings, control inspection, calculation source and uncertainty"
    - protocol_id: cp_surface_finishing
      process_id: "surface_finishing"
      flow_role: "water, sodium hydroxide, coating, and wastewater"
      record_type: "meter, bath-addition, coating issue/return, concentration, and discharge records"
      raw_fields: "order_id; route; treated_area; water_in; water_reused; solution_added; NaOH_concentration; coating_issued; coating_returned; solids_fraction; wastewater_out; treatment_state"
      collection_method: "Calibrated meters/scales, bath log, supplier formulation, and discharge/transfer measurement"
      unit: "kg and m2"
      frequency: "Each batch/order, with bath additions and discharge events"
      temporal_coverage: "Same representative period as finished output"
      site_scope: "Every included preparation, bath, coating, curing, and on-site treatment operation"
      aggregation_rule: "Keep each chemical/coating atomic; calculate active NaOH; subtract only documented internal reuse/returns; divide by output mass"
      quality_evidence: "Meter/scale calibration, batch sheet, safety/technical data sheet, bath analysis, wastewater record"
    - protocol_id: cp_inspection_release
      process_id: "inspection_dispatch"
      flow_role: "test water, test drainage, inspection electricity, and finished product"
      record_type: "test sheet, water meter, electricity record, and release certificate"
      raw_fields: "order_id; nominal_capacity; test_method; water_charged; water_reused; water_drained; additives; inspection_energy; dry_product_mass; pass_fail; release_date"
      collection_method: "Calibrated meters/scales and signed quality-release record"
      unit: "kg, kWh, and MJ"
      frequency: "Each finished product or production lot"
      temporal_coverage: "Full reporting period"
      site_scope: "All products represented by the dataset"
      aggregation_rule: "Count only new water input and water leaving the boundary; normalize all accepted records by released dry product mass"
      quality_evidence: "Test procedure, meter/scale calibration, inspection result, nonconformance log, release certificate"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = period or order amount / conforming dry finished-product mass"
      inputs:
        - "atomic flow amount"
        - dry_product_mass
      output: "amount per 1 kg finished_tank_output"
      source_ids:
        - eu-commission-recommendation-2021-2279
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "electricity_MJ = electricity_kWh × 3.6"
      inputs:
        - "metered electricity_kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_active_sodium_hydroxide
      applies_to: "sodium_hydroxide"
      rule: "active_NaOH_mass = solution_mass × measured mass fraction of NaOH"
      inputs:
        - solution_mass
        - NaOH_concentration
      output: "kg active sodium hydroxide"
      source_ids:
        - eu-jrc-stm-bref-2006
    - id: calc_welding_pm10
      applies_to: "welding_pm10"
      rule: "Use measured post-control PM10; when measurement is unavailable, apply a documented factor valid for the actual process/electrode/base metal/conditions, then multiply by consumed electrode and by (1 − capture efficiency × control efficiency)"
      inputs:
        - "measured_PM10 or factor"
        - electrode_consumed
        - "process settings"
        - capture_efficiency
        - control_efficiency
      output: "kg PM10 released to the declared air compartment"
      source_ids:
        - us-epa-ap42-12-19-welding-1995
    - id: calc_water_reconciliation
      applies_to: "surface-treatment and hydrostatic-test water"
      rule: "external wastewater must be reconciled to new water input, retained water, evaporation, off-site transfer, and documented internal reuse without double counting circulation"
      inputs:
        - water_in
        - water_reused
        - water_retained
        - water_evaporated
        - water_transferred
        - wastewater_out
      output: "reconciled kg water inputs and waste outputs"
      source_ids:
        - eu-jrc-stm-bref-2006
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Verify >300 L capacity, metal type/grade, excluded gas service, absence of fitted mechanical/thermal equipment, dry product mass, finish, integral fittings, and release status for every represented product family."
      evidence: "Drawings, bill of materials, material certificates, inspection and release records; un-cpc-3-0-structure-2025"
    - id: dq_temporal_geographic
      applies_to: "all foreground and upstream data"
      requirement: "Foreground records shall cover a representative production period and identify site and geography; upstream datasets shall disclose temporal, geographic, and technological representativeness."
      evidence: "Record-period reconciliation and upstream dataset metadata; eu-commission-recommendation-2021-2279"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile purchasing/issue/return, utility, scrap, wastewater, emission-control, test, reject, and finished-output records; explain exclusions and missing periods."
      evidence: "Mass/energy reconciliation, meter coverage, waste manifests, monitoring reports, nonconformance records"
    - id: dq_route_specificity
      applies_to: "welding and finishing"
      requirement: "Preserve actual welding process/electrode/gas, base metal, treated area, chemical concentration, coating formulation, water reuse, and control technology; do not apply generic factors without a documented match and uncertainty."
      evidence: "Weld procedures, supplier data, bath logs, coating technical data, control records; us-epa-ap42-12-19-welding-1995; eu-jrc-stm-bref-2006"
    - id: dq_instrument_quality
      applies_to: "measured foreground data"
      requirement: "Retain instrument identity, calibration status, reading resolution, units, missing-data treatment, and responsible reviewer for meters, scales, and emission measurements."
      evidence: "Calibration certificates, raw readings, QA sign-off, and corrective-action records; us-ecfr-40-cfr-63-subpart-xxxxxx"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Fail validation if capacity is not greater than 300 L, compressed/liquefied-gas service is included, mechanical/thermal equipment is fitted, metal construction is not declared, or the output is an unfinished container body."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net conforming dry finished-product mass as normalization; test water, temporary fixtures, rejected products, and off-site installation items must not be included in the reference mass."
    source_ids: []
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Require every actual material, electricity, water, gas, coating component, waste stream, and elementary emission to be represented as an atomic exchange; flag merged utilities, merged chemicals, merged waste, or merged emissions."
    source_ids:
      - eu-commission-recommendation-2021-2279
  - rule_id: validate_mass_water_records
    applies_to: "metal and water balances"
    rule: "Require reconciliation of steel/aluminium input to finished product, segregated scrap, rejects, and stock returns, and reconcile new water to reuse, retained water, loss, transfer, and wastewater. Investigate rather than silently balancing unexplained differences."
    source_ids:
      - eu-jrc-stm-bref-2006
  - rule_id: validate_welding_emissions
    applies_to: "welding_pm10"
    rule: "Require actual welding process, electrode, base metal, operating conditions, capture/control, calculation or monitoring method, and release compartment; fail UUID completeness when the selected elementary-flow compartment does not match the declared release."
    source_ids:
      - us-epa-ap42-12-19-welding-1995
      - us-ecfr-40-cfr-63-subpart-xxxxxx
  - rule_id: validate_allocation
    applies_to: "shared processes and scrap"
    rule: "Require subdivision or a documented causal allocation driver, consistent scrap recycling convention, and sensitivity disclosure where allocation materially affects results."
    source_ids:
      - eu-commission-recommendation-2021-2279
  - rule_id: validate_unresolved_identity
    applies_to: "UUID-empty rows"
    rule: "Treat every UUID-empty row listed in manifest review metadata as unresolved; do not promote a generic, proxy, wrong-property, wrong-compartment, or wrong-product-state candidate."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for one declared large passive metal container product or a documented representative product family"
  downstream_use: "secondary_dataset; background_dataset after methodology review, UUID closure, upstream-link review, and external range-evidence review appropriate to the intended database"
  allowed_use: "Factory-gate product comparisons and lifecycle models where the product identity, material route, capacity, finishing route, geography, production period, allocation, and linked upstream datasets are compatible"
  excluded_use: "Pressure-gas containers; containers ≤300 L; equipped tanks; use-stage storage service; installation; end-of-life; comparisons that ignore capacity, material grade, finish, service conditions, or unresolved UUIDs"
  required_metadata: "PCR id and version when published; product drawing/BOM identity; metal/alloy and recycled content; capacity; dry mass; wall thickness; finish/lining; integral fittings; test method; process routes; site/geography; reporting period; upstream datasets; allocation; cut-offs; data owner; review status"
  required_quality_disclosure: "Meter and scale coverage; representativeness; shared-meter allocation; supplier-data gaps; mass/water reconciliation; welding-emission method and compartment; surface-treatment route; wastewater state; scrap treatment convention; uncertainty; unresolved UUID and range-evidence needs"
  update_trigger: "Material/alloy or capacity-family change; new forming/joining/finishing technology; coating/lining change; major supplier or electricity mix change; altered test-water reuse or emission controls; site/geography change; allocation change; material inventory revision; UUID resolution; or new two-source compatible range evidence"
data_sources:
  - id: "un-cpc-3-0-structure-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, *CPC Ver. 3.0 Structure*, 30 June 2025, row 42210. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv (retrieved 2026-09-05; retained bytes verified as SHA-256 5cd2c1c4890dd6be16af48e9bb940fed48efff9865f39ff15edaa921da25fb7c)"
