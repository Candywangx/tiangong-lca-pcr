    reference: "U.S. Environmental Protection Agency, 40 CFR Part 63, Subpart XXXXXX, *National Emission Standards for Hazardous Air Pollutants Area Source Standards for Nine Metal Fabrication and Finishing Source Categories*. https://www.ecfr.gov/current/title-40/chapter-I/subchapter-C/part-63/subpart-XXXXXX (retrieved 2026-09-05)"
    used_for: "Fabricated-plate-work operations, machining, grinding/polishing, welding, spray-painting preparation/application/curing/cleaning, particulate controls, and records"
