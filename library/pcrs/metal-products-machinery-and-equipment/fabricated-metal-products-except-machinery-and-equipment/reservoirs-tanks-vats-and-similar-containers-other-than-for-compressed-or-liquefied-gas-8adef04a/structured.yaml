    reference: "European Commission, Joint Research Centre, *Reference Document on Best Available Techniques for the Surface Treatment of Metals and Plastics*, August 2006. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/stm_bref_0806.pdf (retrieved 2026-09-05)"
    used_for: "Conditional aqueous chemical/electrolytic surface-treatment decomposition, water-based processing, corrosion-protection purpose, associated activities, and environmental records; no external range is adopted"
  - id: "eu-commission-recommendation-2021-2279"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279 of 15 December 2021 on the use of the Environmental Footprint methods, corrected 23 May 2022. https://eur-lex.europa.eu/eli/reco/2021/2279/corrigendum/2022-05-23/oj/eng (retrieved 2026-09-05)"
    used_for: "Subdivision/allocation hierarchy, inventory normalization, data quality, consistency, completeness, representativeness, and model disclosure"
