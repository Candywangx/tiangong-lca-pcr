allocation_rules:
  - rule_id: al_subdivision
    applies_to: "Manufacturing orders and sites"
    rule: "Prefer process subdivision and order-specific measurement so burdens follow the reactor and process that caused them."
    source_ids: []
  - rule_id: al_shared_utilities
    applies_to: "Shared electricity, gas, water and facility services"
    rule: "Use submetered consumption where available. Otherwise allocate by a documented causal driver such as machine-hours, furnace-hours, test-hours or occupied production time; do not allocate by reactor price when a physical driver is available."
    source_ids: []
  - rule_id: al_scrap
    applies_to: "Post-industrial steel scrap and recoverable alloy scrap"
    rule: "Record scrap mass and destination before applying the study's recycling convention. Do not add an avoided-primary-production credit inside the foreground unless the chosen LCA method requires it; disclose any cut-off, substitution or end-of-life approach."
    source_ids: []
  - rule_id: al_rework
    applies_to: "Rework, rejects and repair"
    rule: "Assign rework energy, consumables and rejected material to the order and process that caused them. Sale proceeds from scrap do not make reactor manufacturing a multifunctional process."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "pressure_boundary_fabrication_reactor_internals_fabrication"
      flow_role: "Steel plate, stainless-steel stock and design-specific alloy inputs"
      record_type: "Purchase receipt, bill of materials and material certificate"
      raw_fields: "material identity; grade; product form; heat or lot; received mass; returns; stock change; order id; supplier; site"
      collection_method: "Reconcile accepted receipts and issued material to the as-built bill of materials"
      unit: "kg"
      frequency: "Each receipt and manufacturing order"
      temporal_coverage: "Complete production period for the reference reactor"
      site_scope: "Every included fabrication site and supplier-controlled stock point"
      aggregation_rule: "Sum net mass assigned to the order; preserve grade and form as separate foreground attributes"
      quality_evidence: "Material certificates; calibrated scales; receipt/issue reconciliation; supplier approval records"
    - protocol_id: cp_welding_consumables
      process_id: "pressure_boundary_fabrication_reactor_internals_fabrication"
      flow_role: "Flux-cored welding wire"
      record_type: "Consumable issue and return records"
      raw_fields: "wire identity; batch; qualification; issued mass; returned mass; order id; process"
      collection_method: "Subtract returned unused wire from issued mass"
      unit: "kg"
      frequency: "Each issue/return"
      temporal_coverage: "Complete fabrication period"
      site_scope: "Every included welding location"
      aggregation_rule: "Sum net consumed mass by process and order"
      quality_evidence: "Welding-material batch record; qualified procedure; issue/return log"
    - protocol_id: cp_process_energy
      process_id: "all_processes"
      flow_role: "Purchased electricity and natural gas"
      record_type: "Meter, fuel invoice and equipment operating log"
      raw_fields: "meter id; opening/closing reading; unit; reference conditions for gas; process; order id; allocation driver"
      collection_method: "Read process meters; where shared, reconcile facility totals and apply the declared causal allocation driver"
      unit: "MJ for electricity; m3 for gas"
      frequency: "Continuous meter with monthly reconciliation or each batch"
      temporal_coverage: "Complete production and test period"
      site_scope: "Every included site"
      aggregation_rule: "Sum direct readings; allocate only the residual shared total; document conversion and loss treatment"
      quality_evidence: "Calibrated meter record; invoice reconciliation; operating-hour log"
    - protocol_id: cp_fabrication_gases
      process_id: "pressure_boundary_fabrication"
      flow_role: "Industrial oxygen"
      record_type: "Cylinder, bulk-tank or supplier record"
      raw_fields: "gas identity; purity; supplied quantity; returns; pressure; temperature; process; order id"
      collection_method: "Reconcile delivered and returned quantity, then normalize to declared reference conditions"
      unit: "m3"
      frequency: "Each delivery and order"
      temporal_coverage: "Complete fabrication period"
      site_scope: "Included oxy-fuel operations"
      aggregation_rule: "Sum normalized volume assigned to included operations"
      quality_evidence: "Supplier certificate; cylinder/bulk inventory; conversion record"
    - protocol_id: cp_process_water
      process_id: "all_processes"
      flow_role: "Process-water inputs"
      record_type: "Water meter, batch sheet or supplier record"
      raw_fields: "source; quality; meter reading or volume; density; temperature; recirculated quantity; process; order id"
      collection_method: "Measure input and subtract only documented same-boundary recirculation"
      unit: "kg"
      frequency: "Each batch or continuous meter with monthly reconciliation"
      temporal_coverage: "Complete production and test period"
      site_scope: "Every included water use point"
      aggregation_rule: "Sum net boundary-crossing water mass by process"
      quality_evidence: "Calibrated meter; water-quality record; density conversion; reconciliation"
    - protocol_id: cp_internal_intermediates
      process_id: "all_processes"
      flow_role: "Pressure-boundary and reactor-internals assemblies"
      record_type: "Internal transfer and acceptance record"
      raw_fields: "intermediate identity; configuration revision; acceptance status; mass; sending process; receiving process; order id"
      collection_method: "Match sending and receiving records one-to-one"
      unit: "kg"
      frequency: "Each transfer"
      temporal_coverage: "Complete assembly period"
      site_scope: "All included sending and receiving sites"
      aggregation_rule: "Use identical quantity on linked output and input; exclude transfer transport unless it crosses the declared foreground boundary"
      quality_evidence: "Accepted transfer record; calibrated scale; configuration control; discrepancy log"
    - protocol_id: cp_solid_wastes
      process_id: "pressure_boundary_fabrication_reactor_internals_fabrication"
      flow_role: "Post-industrial steel scrap"
      record_type: "Waste scale ticket and recycler manifest"
      raw_fields: "waste identity; alloy/contamination class; gross/tare/net mass; internal reuse; destination; order id; process"
      collection_method: "Weigh outbound scrap and reconcile internal return or reuse"
      unit: "kg"
      frequency: "Each shipment or collection container"
      temporal_coverage: "Complete fabrication period"
      site_scope: "Every included fabrication site"
      aggregation_rule: "Sum net scrap leaving the process by identity and destination"
      quality_evidence: "Calibrated scale; waste manifest; recycler receipt; mass-balance reconciliation"
    - protocol_id: cp_cleaning_chemicals
      process_id: "reactor_internals_fabrication"
      flow_role: "Sodium hydroxide"
      record_type: "Batch sheet and chemical receipt"
      raw_fields: "product mass; concentration; solution density; bath charge; replenishment; recovery; order id"
      collection_method: "Calculate pure sodium-hydroxide mass from delivered solution mass and verified concentration"
      unit: "kg NaOH"
      frequency: "Each bath charge"
      temporal_coverage: "Complete cleaning period"
      site_scope: "Included alkaline-cleaning operations"
      aggregation_rule: "Sum pure NaOH charged minus separately documented recovered product"
      quality_evidence: "Supplier certificate; concentration analysis; batch sheet; calculation record"
    - protocol_id: cp_liquid_wastes
      process_id: "reactor_internals_fabrication_final_assembly_and_testing"
      flow_role: "Waste alkaline liquor and test wastewater"
      record_type: "Tank meter, transfer note and treatment manifest"
      raw_fields: "waste identity; volume or mass; density; composition; pH; metal content; destination; order id; process"
      collection_method: "Measure mass directly or convert volume using documented density"
      unit: "kg"
      frequency: "Each discharge or transfer"
      temporal_coverage: "Complete cleaning and test period"
      site_scope: "Every included liquid-waste outlet"
      aggregation_rule: "Sum by concrete waste identity, process and destination"
      quality_evidence: "Calibrated tank/scale; sample analysis; manifest; water balance"
    - protocol_id: cp_component_acceptance
      process_id: "final_assembly_and_testing"
      flow_role: "Control-rod drive mechanisms"
      record_type: "As-built configuration and acceptance record"
      raw_fields: "mechanism identity; type; serial number; accepted count; installed location; duplicate-supply check; order id"
      collection_method: "Count accepted installed mechanisms and reconcile to the as-built configuration"
      unit: "Item(s)"
      frequency: "Each installation and final acceptance"
      temporal_coverage: "Complete assembly period"
      site_scope: "Final assembly site and supplier-controlled installation points"
      aggregation_rule: "Sum accepted installed items; exclude rejected, spare and separately supplied units"
      quality_evidence: "Configuration record; serial-number list; acceptance certificate; inspection record"
    - protocol_id: cp_test_fuel
      process_id: "final_assembly_and_testing"
      flow_role: "Diesel fuel and its direct fossil CO2"
      record_type: "Fuel issue, tank record and equipment test log"
      raw_fields: "fuel identity; mass or volume; density; biogenic fraction; issue/return; equipment; test id; emission factor and provenance"
      collection_method: "Reconcile net fuel consumed, convert volume to mass if needed, and calculate direct fossil CO2 from the documented factor"
      unit: "kg"
      frequency: "Each test campaign"
      temporal_coverage: "Complete factory-test period"
      site_scope: "Included test equipment under manufacturer control"
      aggregation_rule: "Sum net fossil diesel mass and associated calculated direct fossil CO2"
      quality_evidence: "Calibrated tank/scale; purchase/issue record; test log; factor certificate and calculation"
    - protocol_id: cp_product_acceptance
      process_id: "final_assembly_and_testing"
      flow_role: "Complete unloaded nuclear reactor"
      record_type: "Manufacturing acceptance and handover dossier"
      raw_fields: "product configuration; reactor technology; design rating; nuclear quality class; pressure-boundary extent; included assemblies; acceptance status; gross mass; serial id; handover date; gate"
      collection_method: "Count only reactors with a complete accepted dossier and declared fuel-free unirradiated state"
      unit: "Item(s)"
      frequency: "Each final acceptance"
      temporal_coverage: "Entire manufacturing order"
      site_scope: "Declared manufacturer gate"
      aggregation_rule: "One accepted dossier equals one reference item"
      quality_evidence: "Approved configuration; material traceability; NDT, heat-treatment, pressure/seal/electrical/functional-test, cleanliness and final-dimension records"
  calculation_rules:
    - id: calc_order_normalization
      applies_to: "All inventory rows"
      rule: "Normalized amount = net quantity assigned to the manufacturing order divided by the number of accepted complete reactors in that order. For this PCR the denominator is normally one; disclose any multi-unit batch allocation."
      inputs:
        - "Net order quantity"
        - "accepted reactor count"
        - "allocation record"
      output: "Inventory amount per one accepted complete reactor"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "Electricity rows"
      rule: "Electricity (MJ) = metered electricity (kWh) × 3.6 MJ/kWh. Preserve the original meter unit and conversion record."
      inputs:
        - "Metered kWh"
      output: "Electricity in MJ"
      source_ids: []
    - id: calc_solution_active_mass
      applies_to: "internals_sodium_hydroxide"
      rule: "Pure NaOH mass = delivered solution mass × verified mass fraction, adjusted for separately documented returned or recovered product."
      inputs:
        - "Solution mass"
        - "verified concentration"
        - "returned/recovered amount"
      output: "kg sodium hydroxide"
      source_ids: []
    - id: calc_direct_fossil_co2
      applies_to: "pressure_fossil_co2; final_fossil_co2"
      rule: "Direct fossil CO2 = recorded fossil-fuel quantity × documented site- or supplier-specific emission/carbon factor, with unit and oxidation-basis conversion shown. The factor shall not include upstream supply-chain emissions."
      inputs:
        - "Natural-gas or diesel record"
        - factor
        - "fossil fraction"
        - "conversion basis"
      output: "kg direct fossil carbon dioxide"
      source_ids: []
    - id: calc_internal_transfer_check
      applies_to: "Internal intermediate rows"
      rule: "The amount and identity of each upstream intermediate output shall equal its final-assembly input after unit conversion; investigate every difference rather than allocating it silently."
      inputs:
        - "Sending record"
        - "receiving record"
        - "unit conversion"
      output: "Reconciled internal transfer amount"
      source_ids: []
    - id: calc_manufacturing_mass_balance
      applies_to: "Each fabrication process and final assembly"
      rule: "Reconcile traceable material inputs with accepted outputs, measured scrap/waste, direct mass emissions and documented stock change. Report excluded minor materials and unresolved imbalance; do not infer missing emissions from imbalance alone."
      inputs:
        - "Material receipts"
        - "intermediate and product mass"
        - "waste records"
        - "stock change"
        - "direct emissions"
      output: "Process mass-balance reconciliation"
      source_ids:
        - iaea-np-t-3-21-2016
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Configuration, technology, design rating, pressure-boundary extent, included equipment, acceptance gate, gross mass and unloaded/unirradiated state shall be explicit."
      evidence: "Approved product configuration and handover dossier"
    - id: dq_material_traceability
      applies_to: "Nuclear-grade materials and welding consumables"
      requirement: "Preserve supplier, grade, heat/lot, product form, quantity, certificate, substitution and order linkage."
      evidence: "Material certificates, supplier approval and issue records"
    - id: dq_process_records
      applies_to: "Fabrication and assembly"
      requirement: "Retain welding procedure and consumable batch, heat-treatment, NDT, repair, pressure/seal/electrical/functional-test, calibration, cleanliness and final-dimension records applicable to the delivered configuration."
      evidence: "Manufacturing quality dossier; iaea-np-t-3-21-2016"
    - id: dq_temporal_coverage
      applies_to: "All foreground rows"
      requirement: "Cover the complete manufacturing order from first included receipt through final acceptance, including rework and rejected batches."
      evidence: "Order dates, production logs and completeness reconciliation"
    - id: dq_site_coverage
      applies_to: "Multi-site manufacture"
      requirement: "Include every site under the declared manufacturer boundary and disclose transfers that cross it."
      evidence: "Site list, transfer records and boundary statement"
    - id: dq_metering
      applies_to: "Energy, gases and water"
      requirement: "Use calibrated direct meters where available; disclose allocation drivers, conversion conditions and reconciliation gaps for shared meters."
      evidence: "Calibration certificates, invoices and reconciliation"
    - id: dq_waste_destination
      applies_to: "Scrap, alkaline liquor and wastewater"
      requirement: "Record concrete waste identity, contamination/composition, mass, destination and treatment route; do not combine distinct waste streams."
      evidence: "Scale tickets, analyses and manifests"
    - id: dq_uuid_resolution
      applies_to: "UUID-empty flows"
      requirement: "Preserve the concrete flow name and unresolved reason; do not substitute a nearby fuel, plant, raw-material or component UUID."
      evidence: "Finalized search receipts and manifest unresolved metadata"
    - id: dq_uncertainty
      applies_to: "All modelled or allocated values"
      requirement: "Disclose measurement uncertainty, allocation share and data gap; no external empirical amount range is asserted by this candidate PCR."
      evidence: "Meter/scale accuracy, calculation record and data-quality statement"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm that the output is one complete unloaded nuclear reactor, not a fuel element, separate part, complete power plant or boiler product, and that all required qualifiers are present."
    source_ids:
      - un-cpc-3-0-2025
      - iaea-ssg-56-2020
  - rule_id: val_process_coverage
    applies_to: "Foreground boundary"
    rule: "Verify that pressure-boundary fabrication, internals fabrication, final assembly and applicable factory tests are represented, with all included sites and rework covered."
    source_ids:
      - iaea-np-t-3-21-2016
      - us-nrc-ap1000-ser-ch4
  - rule_id: val_atomic_flows
    applies_to: "Inventory"
    rule: "Confirm that every inventory card contains one concrete exchange and that gases, fuels, electricity, water, chemicals, wastes and direct emissions are not combined."
    source_ids: []
  - rule_id: val_internal_transfers
    applies_to: "Internal intermediates"
    rule: "Confirm one-to-one identity and quantity matching for pressure-boundary and internals assembly outputs and inputs, and no double counting of upstream burdens."
    source_ids: []
  - rule_id: val_energy_and_emissions
    applies_to: "Energy and direct emissions"
    rule: "Reconcile purchased energy to meters or allocation records; direct fossil CO2 shall equal foreground natural-gas or diesel use times the documented factor, while upstream electricity and fuel emissions remain in linked datasets."
    source_ids: []
  - rule_id: val_material_and_waste_balance
    applies_to: "Fabrication processes"
    rule: "Reconcile material inputs, accepted intermediate/product mass, measured scrap/waste, stock change and reported direct mass emissions; investigate and disclose unresolved imbalance."
    source_ids:
      - iaea-np-t-3-21-2016
  - rule_id: val_quality_dossier
    applies_to: "Published dataset"
    rule: "Verify availability of material, welding, heat-treatment, NDT, pressure/seal/electrical/functional-test, calibration, cleanliness and final-dimension evidence applicable to the delivered configuration."
    source_ids:
      - iaea-np-t-3-21-2016
  - rule_id: val_unresolved_evidence
    applies_to: "Candidate limitations"
    rule: "Keep the reference product and other UUID-empty rows unresolved until an exact public state-100 identity is audited; do not treat absent two-source ranges as external benchmarks."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset suitable for publication as a secondary_dataset or background_dataset after review and resolution/disclosure of identified gaps"
  downstream_use: "Product-system modelling of complete unloaded nuclear-reactor manufacture and handover at the declared manufacturer gate"
  allowed_use: "Comparison or aggregation only among datasets with compatible reactor configuration, design rating, included equipment, nuclear quality class, manufacturer-gate boundary, geography and allocation/recycling conventions"
  excluded_use: "Electricity-generation impacts per kWh; complete nuclear-power-plant construction; fuel-cycle, site installation, operation, maintenance, spent-fuel or decommissioning results; representation of a separate reactor part or fuel element"
  required_metadata: "Canonical PCR id; reactor technology; thermal power/design rating; product configuration; pressure-boundary extent; included equipment; governing manufacturing code and nuclear quality class; design life; gross accepted mass; manufacturer geography; included sites; assembly location; handover gate; production period; allocation and recycling methods; upstream dataset choices; unresolved UUIDs and evidence needs"
  required_quality_disclosure: "Foreground coverage and completeness; material traceability; meter and scale calibration; allocation shares; rework and reject coverage; internal-transfer reconciliation; mass balance; waste destinations; direct-emission factors; data gaps, uncertainty and any proxy"
  update_trigger: "Change in reactor technology or configuration, design rating, pressure-boundary extent, material grades, manufacturing route/site, energy source, cleaning/testing route, allocation or recycling method, supplier data, exact Tiangong UUID resolution, or availability of two independent boundary-compatible range sources"
