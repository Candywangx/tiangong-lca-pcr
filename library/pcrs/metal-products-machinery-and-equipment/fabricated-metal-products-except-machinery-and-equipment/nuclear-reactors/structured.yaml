system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when traceable purchased materials, qualified parts and internal intermediates enter the manufacturing organization and ends when one complete unloaded reactor passes the declared manufacturing acceptance gate. Upstream production of purchased products is linked through background datasets; the foreground contains only exchanges under the manufacturer's operational control."
      source_ids: []
    - rule_id: sb_manufacturing_gate
      applies_to: "Foreground manufacturing"
      rule: "Include material receipt, forming, machining, welding, heat treatment, cleaning, nondestructive examination, dimensional inspection, assembly, pressure/seal/electrical/functional testing and manufacturer-gate handover when performed for the reference product."
      source_ids:
        - iaea-np-t-3-21-2016
        - us-nrc-ap1000-ser-ch4
    - rule_id: sb_product_exclusions
      applies_to: "Product boundary"
      rule: "Exclude fuel elements, separately supplied reactor parts, separate boilers or steam generators, complete power-plant construction, civil works, fueled commissioning, operation and end-of-life unless the study explicitly adds them as separate product systems."
      source_ids:
        - un-cpc-3-0-2025
        - iaea-ssg-56-2020
    - rule_id: sb_upstream_linkage
      applies_to: "Purchased inputs"
      rule: "Include purchased-input quantities in the foreground and link their production burdens through upstream datasets; do not reproduce upstream processes as direct foreground elementary emissions."
      source_ids: []
    - rule_id: sb_direct_emissions
      applies_to: "Foreground elementary flows"
      rule: "Report only emissions released by included manufacturing equipment. Upstream electricity and material-production emissions remain in linked upstream datasets."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Traceable purchased steel plate, stainless-steel stock, design-specific alloys, qualified welding consumables, control-drive equipment and utilities received at the first included manufacturing site"
  starting_condition_role: "Upstream-data handoff to reactor manufacturing foreground"
  product_classification_scope: "Complete nuclear reactor equipment; excludes fuel, separately supplied reactor parts, separate steam-generating equipment and complete power-plant construction"
  recursive_input_rule: "When a partly assembled reactor crosses between included sites, record one internal intermediate flow with identical identity and amount at both process boundaries; do not apply this PCR recursively or add upstream burdens a second time"
  upstream_dataset_requirement: "Each purchased material, component, fuel, chemical, water and electricity input shall link to a geographically and technologically representative upstream dataset, with supplier-specific data preferred where nuclear-grade production materially differs"
  disclosure: "Declare included sites, ownership/control boundary, assembly location, manufacturer-gate handover point, reactor technology and configuration, treatment of separately supplied components, excluded site work, and any data gap or proxy"
