measurement_rules:
  - id: mu_reference_item
    applies_to: "Reference product and accepted output"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Count only complete unloaded reactors accepted under the declared product configuration. Report gross accepted product mass separately as a required qualifier; do not convert a power plant, reactor part or fuel element into an item of reference product."
  - id: mu_mass
    applies_to: "Solid materials, liquid water, liquid wastes, scrap and direct carbon dioxide"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated mass records or a documented density conversion. State the density, temperature and composition when converting process water or wastewater volume to mass, and prevent double counting of internal intermediate transfers."
  - id: mu_gas_volume
    applies_to: "Natural gas and industrial oxygen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record metered volume and declare pressure, temperature and reference conditions. Convert supplier or meter units to the declared m3 basis without combining the two gases."
  - id: mu_electricity_energy
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve metered electrical energy by process. Convert kWh to MJ using 3.6 MJ per kWh; do not add upstream grid emissions as foreground elementary exchanges."
  - id: mu_component_count
    applies_to: "Control-rod drive mechanisms"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Count accepted installed mechanisms and identify the design-specific mechanism type. If mass is also available, retain it as supporting foreground data rather than replacing the item count."
