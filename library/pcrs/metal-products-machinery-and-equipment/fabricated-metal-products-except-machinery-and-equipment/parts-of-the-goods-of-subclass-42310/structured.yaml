      evidence: "supplier records, dataset metadata and allocation worksheet"
    - id: dq_range_status
      applies_to: "all 16 inventory rows"
      requirement: "No external typical or QA range is prescribed because two independent original-text sources with compatible boundary, functional unit and product state were not established. Foreground collection is mandatory and the evidence needs remain unresolved in the manifest."
      evidence: "manifest review_metadata.unresolved.range_evidence_needs"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "product and dataset metadata"
    rule: "Confirm that the output is a physical part solely or principally for a nuclear reactor and is not an excluded fuel element, boiler part, general-purpose good or service."
    source_ids:
      - un-cpc-3-0-structure-2025
      - china-tariff-2026-nuclear-reactor-parts
  - rule_id: validate_reference_flow
    applies_to: "reference amount"
    rule: "Confirm that accepted clean net product mass is positive and every row is normalized to exactly 1 kg of accepted finished part; packaging, fixtures, test media and rejects are excluded from reference output."
    source_ids:
      - eu-pef-2021-2279
      - iaea-tecdoc-2034
  - rule_id: validate_uuid_property_unit
    applies_to: "every UUID-bearing inventory row"
    rule: "Confirm the selected Tiangong UUID, flow type, flow property and unit group match the atomic exchange and that volume rows declare reference conditions. UUID-empty rows remain explicit unresolved findings, not proxy matches."
    source_ids: []
  - rule_id: validate_process_route
    applies_to: "process map and inventory"
    rule: "Confirm required processes are present, conditional processes match the declared route, and every applicable special process has qualification, parameter, inspection and acceptance evidence."
    source_ids:
      - iaea-tecdoc-2034
      - iaea-pub2068
  - rule_id: validate_inventory_completeness
    applies_to: "foreground inventory"
    rule: "Confirm that each material, electricity use, gas, water, chemical, waste and direct emission is represented by an atomic row or explicitly documented as not applicable; reconcile material and shared-resource totals."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_allocation
    applies_to: "multifunctional and shared operations"
    rule: "Confirm subdivision was attempted first, each residual allocation uses a causal physical driver, totals are conserved and any economic relation is separately justified."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_quality_release
    applies_to: "final product"
    rule: "Confirm critical characteristics, inspection status, manufacturing traceability and release evidence are complete before counting the part as reference product."
    source_ids:
      - iaea-tecdoc-2034
      - iaea-pub2068
published_dataset_profile:
  dataset_role: "Product-specific cradle-to-gate foreground dataset that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "Nuclear-reactor construction and equipment models requiring an accepted nuclear-reactor part at the manufacturer's gate"
  allowed_use: "Product systems matching the declared part function, material grade and state, manufacturing route, safety classification, geography, reference period and factory-gate boundary"
  excluded_use: "Complete reactor manufacture; fuel elements; boiler or steam-generator parts; site installation; reactor operation, maintenance or decommissioning; comparison of unlike safety classes or manufacturing routes without harmonization"
  required_metadata: "PCR id and version; part designation and drawing revision; reactor application; safety class; material grade, heat or lot and forging state; manufacturing and outsourced process route; acceptance plan and release status; site and geography; reference period; allocation and cut-off decisions; upstream dataset identities"
  required_quality_disclosure: "Coverage and calibration of foreground records; mass and energy reconciliation; special-process and acceptance traceability; direct-emission method; waste destinations; proxy and allocation choices; unresolved UUIDs and range-evidence needs"
  update_trigger: "Drawing, material specification, safety class, supplier, manufacturing route, site, allocation method, upstream technology, acceptance plan or representative-period change; resolution of either outstanding flow UUID; or availability of compatible independent range evidence"
