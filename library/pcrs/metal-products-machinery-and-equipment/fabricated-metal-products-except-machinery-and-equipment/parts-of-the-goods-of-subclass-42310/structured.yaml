    - id: dq_measurement
      applies_to: "meters, scales and analytical measurements"
      requirement: "Use calibrated equipment within its valid calibration interval and retain raw readings, units, conversions, uncertainty or resolution and anomaly disposition."
      evidence: "calibration certificates, raw logs and QA review"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Cover at least 12 consecutive representative months; for one-off or long-cycle parts, cover the complete manufacturing campaign and disclose why it is representative."
