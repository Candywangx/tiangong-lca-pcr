allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared or multifunctional manufacturing processes"
    rule: "Avoid allocation by subdividing processes or meters so inputs, wastes and direct emissions are assigned to the part and unit operation that caused them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "common electricity, gas, water, consumables, waste treatment and emissions"
    rule: "When subdivision is not feasible, use a documented causal physical driver such as machine time, metered energy, treated mass or bath loading. Economic allocation is permitted only after subdivision and physical relationships are shown infeasible and the justification is disclosed."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap_separate_output
    applies_to: "low-alloy machining chips and other recovered material"
    rule: "Record the actual scrap as a separate waste output at the factory gate. Do not silently subtract its mass, sale revenue or an avoided-primary-material credit from the foreground burdens; any recycling allocation belongs to the declared downstream LCA method."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_rejects
    applies_to: "rework, rejected parts and destructive-test specimens"
    rule: "Assign measured rework and reject burdens to accepted output from the same reporting period unless a physically separate product system is demonstrated. Disclose excluded abnormal-event campaigns separately."
    source_ids:
      - eu-pef-2021-2279
      - iaea-tecdoc-2034
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_bom
      process_id: "material_shaping"
      flow_role: "qualified forging input"
      record_type: "receiving record, bill of material and material certificate"
      raw_fields: "part_id; drawing_revision; heat_or_lot; material_grade; product_state; received_mass_kg; accepted_mass_kg; certificate_id"
      collection_method: "reconcile receiving scale data, BOM issues and certificate traceability to the accepted part lot"
      unit: "kg"
      frequency: "per receipt and production lot"
      temporal_coverage: "complete declared reference period"
      site_scope: "all sites supplying the foreground part"
      aggregation_rule: "sum accepted forging mass consumed; subtract only documented returns that leave unused"
      quality_evidence: "calibrated scale record; certificate; material acceptance and traceability record"
    - protocol_id: cp_electricity
      process_id: "all_included_processes"
      flow_role: "process electricity"
      record_type: "revenue meter, submeter or equipment energy record"
      raw_fields: "meter_id; process_id; start_reading; end_reading; unit; allocation_driver; accepted_output_kg"
