    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Reconcile BOM, energy, water, consumables, wastes, direct emissions and accepted output. No flow may be hidden in an umbrella row; omitted applicable operations or flows require an explicit gap statement."
