  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period row amount / reporting-period accepted net product mass"
      inputs:
        - "atomic flow amount"
        - "accepted net product mass from cp_accepted_output"
      output: "amount per 1 kg accepted finished part"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity_MJ = metered_kWh × 3.6"
      inputs:
        - "metered or allocated kWh"
      output: "electricity in MJ before reference-flow normalization"
      source_ids: []
    - id: calc_material_reconciliation
      applies_to: "forging, accepted product and solid material outputs"
      rule: "received forging mass = accepted product mass + separated machining-chip mass + other explicitly documented solid destinations ± verified stock change"
      inputs:
        - cp_material_bom
        - cp_waste
        - cp_accepted_output
      output: "reconciled material balance and unexplained difference"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_shared_resource_allocation
      applies_to: "common meters and shared treatment"
      rule: "assign only the measured common total using a causal physical driver; preserve total conservation across products"
      inputs:
        - "common-meter total"
        - "machine time"
        - "metered energy"
        - "treated mass or bath loading by product"
      output: "product-specific allocated amount and disclosed driver"
      source_ids:
        - eu-pef-2021-2279
