system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when the qualified low-alloy steel forging is accepted at the component manufacturer's gate. It ends when the finished nuclear-reactor part has passed the declared inspection and acceptance plan and is released at the same manufacturer's gate. Upstream production of the forging, purchased energy, gases, water and chemicals is represented by linked background datasets. The foreground includes on-site shaping, machining, applicable thermal operations, cleaning, direct releases, waste generation, non-destructive examination, hydrostatic testing when required, final acceptance and the share of common services physically attributable to the part."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "foreground system"
      rule: "Include manufacturing and acceptance from receipt of a qualified preform through release of the accepted finished part; exclude reactor-site installation, reactor operation, maintenance and decommissioning."
      source_ids:
        - un-cpc-3-0-structure-2025
        - iaea-tecdoc-2034
        - iaea-pub2068
    - rule_id: boundary_special_processes
      applies_to: "shaping, machining, welding, forming, cladding, heat treatment, surface treatment and non-destructive testing when performed"
      rule: "Declare every applicable special process, its site or supplier, qualification status and acceptance evidence. Omission is permitted only with an explicit not-applicable justification for the selected part and route."
      source_ids:
        - iaea-tecdoc-2034
        - iaea-pub2068
    - rule_id: boundary_company_specific
      applies_to: "bill of materials and foreground manufacturing"
      rule: "Collect company-specific bill-of-material, energy, consumable, waste and direct-emission data for the product and manufacturing processes in scope."
      source_ids:
        - eu-pef-2021-2279
