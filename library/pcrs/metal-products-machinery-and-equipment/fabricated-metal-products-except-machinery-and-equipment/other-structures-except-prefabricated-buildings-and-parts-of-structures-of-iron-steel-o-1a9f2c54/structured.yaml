allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "independently_measured_work_orders"
    rule: "Avoid allocation by subdividing work orders, lines, booths and meters whenever the declared product can be measured independently."
    source_ids:
      - aisc-sti-fabricated-hss-epd-2022
  - rule_id: allocation_rule_2
    applies_to: "shared_shop_resources"
    rule: "Allocate unavoidable shared electricity, fuel, handling, extraction and overhead material flows using a documented causal driver such as machine hours, arc hours, booth hours or equipment-specific throughput. Use product mass only when its relationship to resource use is demonstrated; report the driver and sensitivity."
    source_ids:
      - aisc-sti-fabricated-hss-epd-2022
  - rule_id: allocation_rule_3
    applies_to: "scrap_and_recycling"
    rule: "Report steel and aluminium scrap at the measured boundary and declare destination. Do not credit avoided primary production inside this gate-to-gate foreground process, and do not duplicate recycling burdens or credits already present in upstream or downstream datasets."
    source_ids:
      - aisc-sti-fabricated-hss-epd-2022
      - aec-aluminium-fabrication-services
  - rule_id: allocation_rule_4
    applies_to: "rejects_and_rework"
    rule: "Include burdens for in-boundary rework and rejected production in the denominator of net accepted product. Treat a separately sold co-product as a distinct output and document a reviewed causal allocation method before publication."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_receipts
      process_id: "structural_metal_fabrication"
      flow_role: "Purchased metal and fabrication consumables"
      record_type: "Purchase, goods-receipt, issue and stock records"
      raw_fields: "flow identity; material/alloy; grade/temper; product form; supplier; lot; received mass; issued mass; returns; opening and closing stock; upstream dataset"
      collection_method: "Reconcile invoices and goods receipts to calibrated scale, certified piece mass or drawing mass and stores issues"
      unit: "kg"
      frequency: "Per receipt and issue; monthly reconciliation"
      temporal_coverage: "Complete reporting period, normally 12 consecutive months or a complete representative production campaign"
      site_scope: "All included fabrication buildings and stores at the reporting site"
      aggregation_rule: "Sum consumed mass by atomic flow and work order; subtract documented returns and stock increase; normalize through calc_reference_normalization"
      quality_evidence: "Purchase documents, material certificates, scale calibration, stock ledger and upstream dataset link"
    - protocol_id: cp_energy_and_fuel
      process_id: "structural_metal_fabrication"
      flow_role: "Electricity, natural gas, oxygen and diesel"
      record_type: "Utility meter, tank, invoice and equipment-hour records"
      raw_fields: "meter id; opening and closing readings; purchased quantity; reference conditions; equipment/area; operating hours; work order; allocation driver"
      collection_method: "Use dedicated meters where available; otherwise reconcile site totals and allocate with a causal driver"
      unit: "MJ; m3; kg"
      frequency: "Continuous or per delivery, aggregated monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "All included site-controlled equipment and buildings"
      aggregation_rule: "Reconcile purchases and stock change, exclude supplier transport, allocate to included work orders and normalize through calc_reference_normalization"
      quality_evidence: "Meter calibration, invoices, tank reconciliation, equipment logs and allocation worksheet"
    - protocol_id: cp_surface_treatment
      process_id: "structural_metal_fabrication"
      flow_role: "Process water, sodium hydroxide, blasting medium, zinc, primer and wastewater"
      record_type: "Meter, bath, issue, formulation, stock and wastewater-transfer records"
      raw_fields: "route; bath or booth id; input mass/volume; concentration; solids/VOC or metal content; opening/closing stock; recirculation; wastewater quantity; treatment and destination"
      collection_method: "Meter water and wastewater; reconcile chemical and coating issues to bath or booth inventory and product route"
      unit: "kg; m3"
      frequency: "Per batch or transfer; monthly reconciliation"
      temporal_coverage: "Complete reporting period for each included finishing route"
      site_scope: "All on-site surface-preparation and finishing operations"
      aggregation_rule: "Calculate net consumption after documented returns and recirculation; keep each chemical, coating and waste stream separate; normalize through calc_reference_normalization"
      quality_evidence: "Meter calibration, formulation SDS/TDS, bath analyses, stock records, waste manifests and treatment records"
    - protocol_id: cp_product_mass
      process_id: "structural_metal_fabrication"
      flow_role: "Accepted product, rejects and work in progress"
      record_type: "Dispatch, acceptance, scale, piece-count and production records"
      raw_fields: "work order; material; drawing; piece count; gross and tare mass; accepted mass; reject mass; rework; work in progress; completion date"
      collection_method: "Determine net accepted mass by calibrated weighing or verified piece/drawing mass and reconcile to dispatch"
      unit: "kg"
      frequency: "Per completed batch or dispatch"
      temporal_coverage: "Complete reporting period"
      site_scope: "All accepted products from the reporting site"
      aggregation_rule: "Sum accepted net mass, exclude reusable racks and separately reported packaging, then normalize the dataset to 1,000 kg"
      quality_evidence: "Acceptance record, inspection release, dispatch record, scale calibration and mass reconciliation"
    - protocol_id: cp_waste_dispatch
      process_id: "structural_metal_fabrication"
      flow_role: "Steel scrap, aluminium scrap and spent blasting media"
      record_type: "Waste scale, container, stock and manifest records"
      raw_fields: "waste identity; material/alloy; contamination; gross/tare/net mass; opening/closing stock; transporter; destination; recovery/disposal route"
      collection_method: "Weigh each segregated waste shipment and reconcile temporary storage stock"
      unit: "kg"
      frequency: "Per shipment; monthly reconciliation"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "All included fabrication and finishing areas"
      aggregation_rule: "Dispatched mass plus closing stock minus opening stock; keep steel, aluminium and abrasive waste separate; normalize through calc_reference_normalization"
      quality_evidence: "Scale ticket, waste manifest, photos or segregation inspection and destination certificate"
    - protocol_id: cp_air_emissions
      process_id: "structural_metal_fabrication"
      flow_role: "Direct fossil CO2, NMVOC, NOx and particulate matter"
      record_type: "Fuel, coating, stack test, continuous monitor, capture-system and factor records"
      raw_fields: "source equipment; fuel quantity; carbon content/factor; coating mass; VOC content; stack concentration; gas flow; operating time; particle-size fraction; capture/destruction efficiency; compartment"
      collection_method: "Prefer calibrated direct monitoring; otherwise use a documented source-specific mass balance or factor calculation"
      unit: "kg; m3; mg/Nm3; Nm3; h"
      frequency: "Continuous, per batch or representative test as appropriate; aggregate monthly"
      temporal_coverage: "Same reporting period as product output and representative operating modes"
      site_scope: "Every included combustion, coating, welding, cutting and blasting source"
      aggregation_rule: "Calculate each pollutant separately; subtract only documented recovery or destruction; assign the correct receiving compartment; normalize through calc_reference_normalization"
      quality_evidence: "Calibration and stack-test reports, supplier analyses, factor source, maintenance records and abatement operating logs"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Every inventory row"
      rule: "normalized amount = reporting-period amount × 1,000 kg / reporting-period net accepted product mass"
      inputs:
        - "Reconciled atomic-flow amount"
        - "accepted product mass"
      output: "Amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity_input"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - "Metered and allocated kWh"
      output: "Electricity in MJ"
      source_ids: []
    - id: calc_metal_mass_balance
      applies_to: "Steel and aluminium routes"
      rule: "incoming metal = accepted product metal + segregated metal waste + returned metal + closing work-in-progress/stock − opening work-in-progress/stock ± documented transfers; investigate and disclose residual"
      inputs:
        - "Material receipts"
        - returns
        - "product composition"
        - "waste and stock records"
      output: "Material-family balance and unexplained residual"
      source_ids: []
    - id: calc_combustion_co2
      applies_to: "fossil_co2_air"
      rule: "Calculate separately for each fuel from measured fuel quantity × supplier carbon content or disclosed jurisdictional CO2 factor × applicable oxidation treatment; do not add upstream fuel emissions"
      inputs:
        - "Fuel records"
        - "supplier carbon content or factor"
        - "oxidation basis"
      output: "Direct fossil CO2 mass"
      source_ids: []
    - id: calc_nmvoc
      applies_to: "nmvoc_air"
      rule: "NMVOC emitted = solvent-containing product mass × supplier VOC fraction − documented solvent recovery − documented destroyed VOC; address retained or reacted fractions explicitly"
      inputs:
        - "Product issues"
        - "formulation data"
        - "recovery and abatement records"
      output: "Direct NMVOC mass to the declared air compartment"
      source_ids:
        - eu-jrc-stm-bref-2006
    - id: calc_stack_pollutant
      applies_to: "nox_high_stack_air; particulate_matter_air"
      rule: "For direct measurement, emitted mass = concentration × standardized dry-gas flow × operating time with unit conversion; otherwise use a disclosed equipment- and pollutant-specific factor with measured activity and control efficiency"
      inputs:
        - "Stack test or monitor data"
        - "gas flow"
        - hours
        - activity
        - "factor and control performance"
      output: "Direct pollutant mass by species/fraction and compartment"
      source_ids:
        - eu-jrc-stm-bref-2006
        - uk-hse-welding-controls
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and all exchanges"
      requirement: "Preserve one concrete flow identity per row. Match material/alloy, product state, flow type, property, unit and environmental compartment; keep unresolved UUIDs blank rather than using a proxy."
      evidence: "Material certificates, supplier specifications, finalized UUID audit receipts and unresolved manifest entries"
    - id: dq_temporal
      applies_to: "Foreground data"
      requirement: "Use one internally consistent reporting period, normally 12 consecutive months or a complete representative campaign. Explain shutdowns, start-ups and atypical work mix."
      evidence: "Dated production, meter, purchase, stock, waste and emission records"
    - id: dq_mass_balance
      applies_to: "Steel and aluminium routes"
      requirement: "Reconcile each material family from receipt through accepted product, waste, returns and stock change. Investigate rather than silently forcing unexplained residual to zero."
      evidence: "Signed mass-balance worksheet and source-record cross-check"
    - id: dq_route
      applies_to: "Conditional operations"
      requirement: "For every conditional row, provide a value and evidence when the route applies or document not_applicable with drawing, process-plan or facility evidence."
      evidence: "Route matrix, traveler, work instruction, supplier record and process declaration"
    - id: dq_completeness
      applies_to: "Site boundary"
      requirement: "Reconcile facility totals to included work orders and disclose exclusions, shared-meter allocation, subcontracting, rework, fugitive releases and waste destinations."
      evidence: "Site-to-product reconciliation and allocation worksheet"
    - id: dq_representativeness
      applies_to: "Upstream and direct data"
      requirement: "Declare geography, technology, material grade/temper, reporting age and proxy use. Do not compare datasets with different preparation, finish or structural-performance states without adjustment."
      evidence: "Dataset metadata, supplier EPD/LCI references and representativeness assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference_flow"
    rule: "Confirm that the normalized reference_product output is exactly 1,000 kg net accepted product and that every required qualifier is present."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "inventory_completeness"
    rule: "Confirm that every applicable material, consumable, energy, water, waste and direct-emission exchange is represented as one atomic row; no utilities, fuels, coatings, fasteners, wastes or emissions collection label may replace a concrete exchange."
    source_ids:
      - aisc-sti-fabricated-hss-epd-2022
      - eu-jrc-stm-bref-2006
  - rule_id: validation_rule_3
    applies_to: "conditional_routes"
    rule: "Confirm each route-conditioned exchange has a collected/calculated amount or documented not_applicable evidence consistent with the process plan and declared market state."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "mass_and_energy_reconciliation"
    rule: "Confirm accepted product, metal inputs, metal waste, returns and stock changes reconcile by material family; confirm electricity/fuel totals reconcile to meters, invoices and allocation drivers. Explain residuals."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "boundary_and_double_counting"
    rule: "Confirm upstream input datasets, on-site operations and subcontracted operations are disclosed and mutually exclusive; direct emissions exclude upstream supply-chain emissions."
    source_ids:
      - aisc-sti-fabricated-hss-epd-2022
  - rule_id: validation_rule_6
    applies_to: "flow_identity"
    rule: "Confirm every stored UUID remains public at state 100 and matches the authored English and Chinese baseName, flow type, classification, property and unit group. Keep the seven unresolved row UUIDs blank until exact candidates pass the same audit."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "emissions"
    rule: "Confirm receiving compartment, chemical identity, particle-size fraction, calculation factor, capture/destruction efficiency and direct-versus-upstream status for each reported air emission."
    source_ids:
      - eu-jrc-stm-bref-2006
      - uk-hse-welding-controls
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after methodology review and publication controls"
  downstream_use: "Foreground process packages and downstream process or lifecyclemodel projections for factory-gate fabricated iron, steel or aluminium structures and structural parts"
  allowed_use: "Product-specific gate-to-gate modelling when material/alloy, grade or temper, geometry, fabrication route, joining, finish, site geography, period, upstream datasets and waste destinations match or are transparently adjusted"
  excluded_use: "Unadjusted comparison of different structural functions, load capacities, design lives, product geometries, material systems, finish states or boundaries; representation of complete prefabricated buildings, erection, installation, use or end-of-life; replacement of unprepared mill-product datasets"
  required_metadata: "Canonical PCR id; CPC mapping context; reference product and required qualifiers; reporting organization, facility, geography and period; material and product-state breakdown; included and subcontracted operations; meter and allocation coverage; upstream dataset identities; flow UUID status; waste destinations"
  required_quality_disclosure: "Primary-data coverage; mass and energy reconciliation; allocation drivers and sensitivity; route-specific applicability; measurement and conversion methods; unresolved UUIDs and range-evidence needs; data age, geography, technology and proxy use; exclusions and uncertainty"
  update_trigger: "New exact TianGong identities; new compatible independent range evidence; material change in product scope, fabrication or finishing technology, supplier datasets, allocation, site boundary, regulation, classification mapping or reporting period"
