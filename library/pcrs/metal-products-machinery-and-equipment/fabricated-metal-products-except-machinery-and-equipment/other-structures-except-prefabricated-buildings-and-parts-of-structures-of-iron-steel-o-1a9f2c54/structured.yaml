system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground_start"
      rule: "Start at receipt of purchased metal products and ancillary materials at the reporting fabrication facility. Represent their prior production and inbound supply with explicit upstream datasets rather than recreating those burdens in the fabrication process."
      source_ids:
        - aisc-sti-fabricated-hss-epd-2022
    - rule_id: boundary_rule_2
      applies_to: "foreground_operations"
      rule: "Include all site-controlled handling, cutting, drilling, punching, forming, machining, welding, mechanical fastening, route-applicable surface preparation or finishing, inspection, rework and waste handling needed to release the declared factory-gate product."
      source_ids:
        - aisc-sti-fabricated-hss-epd-2022
        - aec-aluminium-fabrication-services
        - eu-jrc-stm-bref-2006
    - rule_id: boundary_rule_3
      applies_to: "conditional_finishing"
      rule: "Include abrasive preparation, aqueous cleaning, galvanizing, painting or other finishing only when it is part of the declared factory-gate product state. Identify on-site and subcontracted operations separately and prevent duplicate activity or transport burdens."
      source_ids:
        - aisc-sti-fabricated-hss-epd-2022
        - eu-jrc-stm-bref-2006
    - rule_id: boundary_rule_4
      applies_to: "exclusions"
      rule: "Exclude erection, installation, use, maintenance, demolition, post-use recovery, capital equipment and employee commuting. Disclose any study-specific addition instead of silently changing the boundary."
      source_ids:
        - aisc-sti-fabricated-hss-epd-2022
    - rule_id: boundary_rule_5
      applies_to: "elementary_emissions"
      rule: "Report only direct releases from processes inside the foreground boundary. Upstream electricity, fuel, metal and chemical emissions belong to their linked supplier datasets."
      source_ids:
        - eu-jrc-stm-bref-2006
        - uk-hse-welding-controls
boundary_abstraction:
  declared_starting_condition: "Purchased metal products and ancillary materials physically received at the reporting fabrication facility, identified by material/alloy, product form, preparation state, quantity, supplier and upstream dataset"
  starting_condition_role: "Foreground fabrication gate input; prior primary-metal, semi-finished-product and supplier transport burdens are upstream"
  product_classification_scope: "Project- or function-prepared iron, steel or aluminium structures, structural parts and temporary structural-support equipment consistent with CPC 3.0 code 42190"
  recursive_input_rule: "A purchased input already prepared within this same product category is recorded as a same-category product input with its own supplier dataset and declared preparation state; do not recursively rebuild its fabrication or count it again as unprepared basic metal"
  upstream_dataset_requirement: "Link every purchased metal, energy, fuel, chemical and subcontracted-operation input to geography-, technology-, grade- and state-appropriate upstream data, with proxy use and exclusions disclosed"
  disclosure: "Declare material/alloy and grade or temper, input product form and preparation state, drawing or geometry, joining and finishing routes, reporting facility/geography/period, meter and allocation coverage, rework, outsourced operations, waste destinations and all deviations from this boundary"
