measurement_rules:
  - id: measurement_rule_1
    applies_to: "Reference product and metal mass flows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use dry, net accepted product mass excluding reusable transport racks and separately reported packaging. Record weighbridge, scale, certified piece-mass or drawing-derived mass method and reconcile it to production and inventory records."
  - id: measurement_rule_2
    applies_to: "Electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ"
    rule: "Preserve the metered electricity quantity and convert kWh to MJ using 1 kWh = 3.6 MJ. Declare meter coverage and any allocation from shared meters."
  - id: measurement_rule_3
    applies_to: "Natural gas and industrial oxygen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200b9a66"
    required_unit: "m3"
    rule: "State the temperature, pressure and wet/dry reference conditions for reported gas volume; do not combine oxygen with fuel gas."
  - id: measurement_rule_4
    applies_to: "Material yield and waste mass balance"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile incoming metal by material family to accepted product, segregated metal waste, returned material, work in progress and measured stock change over the reporting period. Explain all residual imbalance."
  - id: measurement_rule_5
    applies_to: "Coatings and treatment chemicals"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report purchased or replenished product mass. Additionally disclose solids content, active concentration or metallic content when needed for emission or coating-mass calculations; do not replace product mass with active-substance mass."
