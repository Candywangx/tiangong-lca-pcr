                - ul-builders-hardware-pcr-2019
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "multiple products and production lines"
    rule: "Avoid allocation by subdividing meters, material issues, batch records and waste records to the declared product configuration wherever technically feasible."
    source_ids:
      - ul-builders-hardware-pcr-2019
  - rule_id: allocation_rule_2
    applies_to: "residual shared burdens"
    rule: "When subdivision is not feasible, allocate shared manufacturing burdens by net product mass. A different physical relationship may be used only when documented and consistently applied."
    source_ids:
      - ul-builders-hardware-pcr-2019
  - rule_id: allocation_rule_3
    applies_to: "metal scrap and recovered materials"
    rule: "Record scrap leaving the foreground as a waste output without an avoided-production credit inside this gate-to-gate dataset. Any recycling credit or substitution is reported separately in the downstream model with method and destination disclosed."
    source_ids:
      - us-epa-locking-devices-1995
dataset_production:
  collection_protocols:
    - protocol_id: cp_component_materials
      process_id: "component_fabrication"
      flow_role: "metal stock, cutting fluid and steel scrap"
      record_type: "purchase, issue, return and scale records"
      raw_fields: "material identity, grade, supplied mass, returned mass, internal recycle, scrap mass, batch id"
      collection_method: "reconcile purchasing and stores records with calibrated scales and batch travellers"
      unit: "kg"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "declared representative reporting period or production campaign"
      site_scope: "each fabrication site and controlled toll processor"
      aggregation_rule: "sum net inputs and outputs by product configuration, then normalize by net finished mass"
      quality_evidence: "invoices, certificates of analysis, scale calibration, material reconciliation and scrap transfer records"
    - protocol_id: cp_component_energy
      process_id: "component_fabrication"
      flow_role: "electricity"
      record_type: "meter or equipment energy log"
      raw_fields: "meter start and end, kWh, production hours, product mass, allocation driver"
      collection_method: "use submeter data; if shared, allocate by documented equipment time or another physical driver"
      unit: "kWh and MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "same period as product output"
      site_scope: "each fabrication site"
      aggregation_rule: "subtract non-production baseload where evidenced, convert kWh to MJ, normalize by net finished mass"
      quality_evidence: "meter calibration, bills and operating logs"
    - protocol_id: cp_heat_treatment
      process_id: "heat_treatment"
      flow_role: "natural gas, electricity and direct fossil CO2"
      record_type: "fuel meter, electricity meter and fuel-analysis records"
      raw_fields: "gas volume, reference conditions, kWh, carbon content, oxidation assumption, treated mass"
      collection_method: "read meters for included furnaces and retain supplier fuel specification or analysis"
      unit: "m3, kWh, MJ and kg"
      frequency: "each heat-treatment campaign; monthly reconciliation"
      temporal_coverage: "same period as treated output"
      site_scope: "each furnace site or controlled toll processor"
      aggregation_rule: "allocate by treated mass only after subdivision by furnace campaign; calculate direct CO2 from collected fuel data"
      quality_evidence: "meter calibration, fuel invoices, supplier specification and furnace log"
    - protocol_id: cp_surface_finishing
      process_id: "surface_finishing"
      flow_role: "electricity, water, each chemical, wastewater and sludge"
      record_type: "meter, bath, purchasing and waste-transfer records"
      raw_fields: "kWh, water volume or mass, chemical identity and concentration, make-up mass, wastewater mass, sludge wet mass and dry solids, batch id"
      collection_method: "reconcile meters and bath logs with purchase and waste manifests"
      unit: "kg, m3, kWh and MJ"
      frequency: "each bath make-up and batch; monthly reconciliation"
      temporal_coverage: "same period as finished components"
      site_scope: "each finishing line and wastewater-treatment unit"
      aggregation_rule: "keep each chemical and waste stream separate; subtract documented internal recycle; normalize by net finished mass"
      quality_evidence: "meter calibration, bath analysis, SDS or certificate, invoices, manifests and sludge solids test"
    - protocol_id: cp_assembly_packaging
      process_id: "assembly_packaging"
      flow_role: "electricity, each packaging material and finished product"
      record_type: "meter, bill-of-materials, issue, count, scale and shipment records"
      raw_fields: "kWh, packaging identity and mass, product count, net unit mass, rejected units, shipped mass, batch id"
      collection_method: "reconcile assembly and packaging issues with calibrated product scales and shipment records"
      unit: "kg, item, kWh and MJ"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "declared representative reporting period or production campaign"
      site_scope: "each final assembly and packaging site"
      aggregation_rule: "aggregate only equivalent product configurations; production-volume weight disclosed averages; normalize to 1 kg net finished product"
      quality_evidence: "scale and meter calibration, inspection release, bill of materials and shipment record"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "every inventory row"
      rule: "normalized amount = attributable row amount / net saleable product mass"
      inputs:
        - "attributable flow amount"
        - "net saleable product mass"
      output: "flow amount per 1 kg net finished product"
      source_ids: []
    - id: calc_count_mass
      applies_to: "product count conversion"
      rule: "net product mass = accepted product count × representative weighed mass per unit; stratify unlike configurations before aggregation"
      inputs:
        - "accepted count"
        - "weighed unit mass"
        - "configuration id"
      output: "kg net saleable product and units per kg"
      source_ids:
        - ul-builders-hardware-pcr-2019
    - id: calc_electricity_mj
      applies_to: "electricity rows"
      rule: "electricity MJ = metered kWh × 3.6"
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids: []
    - id: calc_water_mass
      applies_to: "process-water row"
      rule: "water mass = metered volume × documented density at the declared condition"
      inputs:
        - "water volume"
        - density
        - temperature
      output: "kg process water"
      source_ids: []
    - id: calc_co2_fossil
      applies_to: "direct natural-gas combustion"
      rule: "calculate fossil CO2 from measured gas volume, reference conditions, supplier or analysed carbon content and documented oxidation assumption; do not use upstream electricity emissions"
      inputs:
        - "gas volume"
        - "reference conditions"
        - "carbon content"
        - "oxidation assumption"
      output: "kg carbon dioxide (fossil)"
      source_ids: []
    - id: calc_material_balance
      applies_to: "metal fabrication and finished output"
      rule: "reconcile purchased metal + same-category components = net finished metal + segregated metal scrap + other measured metal residues ± inventory change"
      inputs:
        - "metal inputs"
        - "product output"
        - scrap
        - residues
        - "work-in-progress change"
      output: "disclosed metal mass-balance closure"
      source_ids:
        - us-epa-locking-devices-1995
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and all exchanges"
      requirement: "Retain supplier identity, grade or formulation, product state, UUID resolution, and batch or lot linkage. Do not substitute a broader flow for an unresolved exact identity."
      evidence: "supplier specification, certificate, SDS, direct-read UUID audit and batch record"
    - id: dq_measurement
      applies_to: "mass, energy, water and count data"
      requirement: "Use calibrated scales and meters suitable for the amount measured; document conversions, shared-meter allocation and excluded baseload."
      evidence: "calibration records, meter logs and calculation workbook"
    - id: dq_temporal
      applies_to: "foreground dataset"
      requirement: "Cover the declared reporting period or production campaign, demonstrate temporal representativeness, and disclose material seasonal or production-volume variation."
      evidence: "production calendar, batch list and variance review"
    - id: dq_completeness
      applies_to: "process map and inventory"
      requirement: "Reconcile product, metal and packaging records; add every route-specific chemical, fuel, waste and measured emission as its own atomic exchange even when not prelisted."
      evidence: "mass balance, purchase reconciliation, waste manifests and completeness checklist"
    - id: dq_geography_technology
      applies_to: "site and upstream data"
      requirement: "Declare manufacturing geography, equipment route, outsourced operations, electricity mix, water source and waste destination; justify proxies for missing upstream data."
      evidence: "site description, supplier geography and data-quality assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow"
    rule: "Verify that net finished output equals 1 kg after normalization and that product subtype, unit mass, units per kg, alloy, finish, performance class, accessories, site, period and gate condition are declared."
    source_ids:
      - un-cpc-3-0-2025
      - ul-builders-hardware-pcr-2019
  - rule_id: validation_rule_2
    applies_to: "process route"
    rule: "Every included process-map row must have collected inventory. Every omitted conditional process must have a documented non-applicability statement, including outsourced operations."
    source_ids:
      - us-epa-locking-devices-1995
  - rule_id: validation_rule_3
    applies_to: "atomic flows and UUIDs"
    rule: "Verify one physical, chemical, waste or energy exchange per row, correct direction and flow type, compatible property and unit, and an exact state-100 UUID before final dataset publication."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "metal mass balance"
    rule: "Investigate unexplained difference between metal inputs and net product, segregated scrap, other metal residues and work-in-progress change; disclose the reconciliation result."
    source_ids:
      - us-epa-locking-devices-1995
  - rule_id: validation_rule_5
    applies_to: "finishing water and wastes"
    rule: "When surface finishing is included, reconcile supplied water with internally recycled water, wastewater, evaporation and carry-out, and reconcile treatment sludge with waste-transfer records without combining wastewater and sludge."
    source_ids:
      - us-epa-locking-devices-1995
  - rule_id: validation_rule_6
    applies_to: "packaging"
    rule: "Confirm that each shipped packaging material is recorded separately and that net product mass excludes external packaging."
    source_ids:
      - ul-builders-hardware-pcr-2019
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after methodology review, exact flow resolution and dataset validation"
  downstream_use: "foreground process models for base-metal locks, keys, lock parts and fittings; product LCAs and lifecycle models needing a factory-gate hardware input"
  allowed_use: "Use for the declared product subtype, alloy, finish, production route, geography, technology and reporting period, or after a documented representativeness assessment."
  excluded_use: "Do not represent complete doors, furniture, saddlery or access-control systems; non-metal fittings; installation or use performance; or a materially different alloy, finish, security class or manufacturing route without adjustment."
  required_metadata: "canonical PCR id; product subtype and function; reference-flow UUID; net unit mass and units per kg; material composition; finish; performance class; included accessories; packaging; process map; site and geography; outsourced operations; reporting period; allocation; upstream data; unresolved-flow disposition"
  required_quality_disclosure: "primary-data share; meter and scale coverage; temporal coverage; product grouping and weighting; mass-balance closure; UUID audit status; proxy data; excluded operations; water and waste reconciliation; uncertainty and known limitations"
  update_trigger: "Reassess when product design, principal alloy, finish system, manufacturing route, site, supplier mix, energy mix, packaging, allocation method or annual inputs or outputs change materially, or when an unresolved exact flow is resolved."
