allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide by product family and route. If impracticable, use documented system expansion only for a substituted function; otherwise allocate shared exchanges by physical causality such as machine time, treated area, bath loading, or mass. Economic allocation is last resort and requires sensitivity analysis. Do not credit scrap without an explicit recycling convention and receiving-treatment boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_exchange_records
      process_id: "all"
      flow_role: "each atomic exchange"
      record_type: "meter, scale, invoice, batch or waste ticket"
      raw_fields: "value, unit, date, process, product, route, record id"
      collection_method: "reconcile readings with purchases, stock change, production, and dispatch"
      unit: "row unit"
      frequency: "batch or monthly"
      temporal_coverage: "representative 12 months"
      site_scope: "all included lines"
      aggregation_rule: "sum by row / conforming process output mass"
      quality_evidence: "calibration, record, reconciliation, variance review"
  calculation_rules:
    - id: calc_normalize
      applies_to: "every row"
      rule: "reporting-period exchange / conforming process output mass"
      inputs:
        - exchange
        - "output mass"
      output: "amount per kg output"
      source_ids: []
    - id: calc_balance
      applies_to: "each process"
      rule: "metal inputs = product metal + scrap + measured losses, adjusted for stock change"
      inputs:
        - "mass records"
      output: "residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_period
      applies_to: "foreground"
      requirement: "Representative continuous 12 months or justified shorter coverage."
      evidence: "dated records"
    - id: dq_route
      applies_to: "processes"
      requirement: "Keep forming, casting, wet treatment, and coating routes visible before aggregation."
      evidence: "routing records"
    - id: dq_balance
      applies_to: "metals"
      requirement: "Investigate and disclose mass-balance residual and recycling-loop accounting."
      evidence: "reconciliation"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Verify one 1 kg reference output; route completeness without double counting; links between intermediate outputs and inputs; metal balance; Section 4 units; atomic rows; measured direct fossil CO2 only; audited UUID identity/type/property/unit; and explicit unresolved UUID rows."
    source_ids: []
