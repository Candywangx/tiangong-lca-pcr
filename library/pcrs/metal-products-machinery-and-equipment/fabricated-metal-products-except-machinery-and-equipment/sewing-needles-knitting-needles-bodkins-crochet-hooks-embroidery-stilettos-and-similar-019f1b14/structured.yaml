allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared equipment and multi-product lines"
    rule: "First subdivide meters, production orders, bath additions, waste records and operating time so that exchanges are directly attributable to the covered product family."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "remaining shared foreground exchanges"
    rule: "If subdivision is not practicable, allocate using a documented physical relationship that drives the exchange, such as verified machine operating time and load for electricity or treated surface area for a plating bath. Use mass only when it demonstrably represents the driver for the co-produced article families."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "no defensible physical relationship"
    rule: "Use another relationship, including economic value, only after documenting why subdivision and a relevant physical relationship are not practicable; report the factor, period, co-products and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap_no_avoided_burden
    applies_to: "steel, brass and aluminium scrap outputs"
    rule: "Report scrap at the mass crossing the foreground boundary without subtracting an avoided primary-metal burden in this foreground dataset. Any recycling benefit or circular-footprint treatment belongs to the chosen downstream system model and must be disclosed separately."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_inputs
      process_id: "fabrication_finishing"
      flow_role: "metal feedstocks and lubricating oil"
      record_type: "weighbridge tickets, invoices, issue/return records and stock ledger"
      raw_fields: "product_family, order_id, material_id, alloy_grade, product_state, opening_mass, received_mass, issued_mass, returned_mass, closing_mass"
      collection_method: "Reconcile physical inventory and production-order issues; retain supplier and grade evidence."
      unit: "kg"
      frequency: "Each receipt and production order; monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months, or every batch for a shorter campaign"
      site_scope: "All equipment and stores serving the declared product"
      aggregation_rule: "Sum net consumption by exact material identity and normalize to accepted product mass."
      quality_evidence: "Calibrated scale records, purchase documents, inventory reconciliation and unexplained-loss review"
    - protocol_id: cp_energy_inputs
      process_id: "fabrication_finishing_inspection_dispatch"
      flow_role: "electricity and natural gas"
      record_type: "utility meters, submeter logs and equipment operating records"
      raw_fields: "meter_id, start_reading, end_reading, unit, reference_temperature, reference_pressure, equipment_id, operating_time, rated_or_measured_load, product_order"
      collection_method: "Prefer dedicated meters; otherwise allocate by verified operating time and load and document unrelated users."
      unit: "MJ for electricity; m3 for natural gas"
      frequency: "Meter interval or batch; monthly reconciliation"
      temporal_coverage: "At least 12 consecutive representative months, or every batch for a shorter campaign"
      site_scope: "All covered production and inspection equipment"
      aggregation_rule: "Convert electricity using 1 kWh = 3.6 MJ; normalize each energy carrier separately."
      quality_evidence: "Meter calibration, bills, allocation worksheet and reconciliation to site totals"
    - protocol_id: cp_surface_chemicals
      process_id: "fabrication_finishing"
      flow_role: "alkaline cleaner, pickling acid, zinc and nickel"
      record_type: "purchase, bath make-up, analysis, drag-out recovery and inventory records"
      raw_fields: "bath_id, chemical_identity, concentration, opening_inventory, additions, closing_inventory, recovered_mass, transfer_mass, product_order, treated_area"
      collection_method: "Close a bath-specific material balance; keep different chemicals and concentrations separate."
      unit: "kg"
      frequency: "Each addition and bath change; monthly balance"
      temporal_coverage: "Complete reporting period"
      site_scope: "Each bath serving the covered product"
      aggregation_rule: "Net consumption equals opening inventory plus additions minus closing inventory, recovery and transfer; normalize to accepted product mass."
      quality_evidence: "Supplier specification, bath-analysis results, calibrated dosing and inventory records"
    - protocol_id: cp_water_and_liquid_wastes
      process_id: "fabrication_finishing"
      flow_role: "process water and liquid wastes"
      record_type: "water meters, tank levels, density measurements, manifests and wastewater analysis"
      raw_fields: "stream_id, source_operation, volume, density, mass, pH, metal_concentration, acid_or_alkali_identity, destination, date"
      collection_method: "Meter each segregated stream where practicable; convert volume to mass only with a representative measured density."
      unit: "kg"
      frequency: "Continuous or per discharge/bath change; monthly reconciliation"
      temporal_coverage: "Complete reporting period including all discharges"
      site_scope: "All cleaning, pickling and plating streams serving covered orders"
      aggregation_rule: "Keep process water, spent alkaline liquor, spent acid, zinc rinse wastewater and nickel rinse wastewater separate; normalize mass to accepted product."
      quality_evidence: "Meter calibration, tank calibration, laboratory reports and waste manifests"
    - protocol_id: cp_solid_wastes
      process_id: "fabrication_finishing"
      flow_role: "metal offcuts and steel swarf"
      record_type: "bin weights, tare records and shipment manifests"
      raw_fields: "waste_identity, alloy, contamination_state, gross_mass, tare_mass, net_mass, destination, date, product_order"
      collection_method: "Weigh each segregated waste container and document moisture or oil basis for swarf."
      unit: "kg"
      frequency: "Each container or shipment"
      temporal_coverage: "Complete reporting period"
      site_scope: "All covered forming, machining, sharpening and grinding operations"
      aggregation_rule: "Sum by exact metal and physical state; subtract no recycling credit in the foreground inventory."
      quality_evidence: "Scale calibration, segregation inspection and receiving/recycling manifest"
    - protocol_id: cp_direct_air_emissions
      process_id: "fabrication_finishing"
      flow_role: "fossil CO2 and hydrogen chloride"
      record_type: "fuel meter, combustion factor record, stack flow and concentration measurements"
      raw_fields: "fuel_volume, reference_conditions, factor_id, stack_flow, HCl_concentration, sampling_time, control_status, production_order"
      collection_method: "Calculate fossil CO2 from collected fuel and a documented applicable factor; calculate HCl mass from representative concentration and stack flow or use direct mass measurement."
      unit: "kg"
      frequency: "Fuel each meter period; HCl at permit or representative campaign frequency"
      temporal_coverage: "Complete reporting period with operating and control-system coverage"
      site_scope: "Direct-fired equipment and hydrochloric-acid pickling exhaust serving covered orders"
      aggregation_rule: "Aggregate only periods with equivalent technology and abatement, then normalize to accepted product."
      quality_evidence: "Fuel records, factor provenance, accredited stack report, control-device logs and coverage statement"
    - protocol_id: cp_intermediate_and_output
      process_id: "fabrication_finishing_inspection_dispatch"
      flow_role: "internal transfer and accepted product"
      record_type: "production order, work-in-progress ledger, inspection and scale records"
      raw_fields: "product_family, order_id, transfer_mass, opening_wip, closing_wip, accepted_mass, reject_mass, rework_mass, scale_id"
      collection_method: "Reconcile transferred, accepted, rejected, reworked and work-in-progress masses by product family."
      unit: "kg"
      frequency: "Each batch or order"
      temporal_coverage: "Complete reporting period"
      site_scope: "All covered production and final-inspection points"
      aggregation_rule: "Adjust transfer for work-in-progress change; accepted output is the denominator for normalization."
      quality_evidence: "Calibrated scales, signed transfer records, inspection disposition and reconciliation"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory row"
      rule: "normalized exchange = reporting-period exchange / reporting-period accepted finished-product mass"
      inputs:
        - "exchange quantity"
        - "accepted mass from cp_intermediate_and_output"
      output: "exchange per 1 kg accepted finished product"
      source_ids: []
    - id: calc_material_consumption
      applies_to: "feedstocks and bath materials"
      rule: "net consumption = opening inventory + receipts or additions - closing inventory - unused return - documented recovery or transfer"
      inputs:
        - stock
        - purchase
        - issue
        - return
        - "recovery and transfer records"
      output: "kg consumed"
      source_ids: []
    - id: calc_energy_allocation
      applies_to: "shared electricity or gas meter"
      rule: "covered energy = meter difference × documented allocation fraction; fraction is based on verified operating time and measured or rated load unless a more direct physical driver is demonstrated"
      inputs:
        - "meter readings"
        - "operating time"
        - load
        - "covered orders"
      output: "MJ electricity or m3 natural gas"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_liquid_mass
      applies_to: "water and liquid waste recorded by volume"
      rule: "liquid mass = metered volume × representative measured density; retain reference temperature and density sampling basis"
      inputs:
        - volume
        - density
      output: "kg liquid"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "direct-fired natural-gas combustion"
      rule: "fossil CO2 mass = collected natural-gas quantity × separately documented applicable combustion factor; do not count upstream electricity emissions"
      inputs:
        - "natural-gas record"
        - "factor identity and unit conversion"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_hcl_air
      applies_to: "hydrochloric-acid pickling exhaust"
      rule: "HCl mass = representative measured HCl concentration × dry or wet stack-gas volume on a consistent condition basis; account for control bypass periods separately"
      inputs:
        - concentration
        - "stack flow"
        - "sampling duration"
        - "moisture/reference conditions"
      output: "kg HCl to air"
      source_ids:
        - eu-ferrous-metals-bat-2022
    - id: calc_metal_balance
      applies_to: "each declared metal route"
      rule: "metal-balance difference = feedstock metal + deposited coating metal - accepted product metal - segregated scrap - swarf - measured metal in liquid waste - documented inventory change; investigate material differences before release"
      inputs:
        - "material inputs"
        - "output composition"
        - "wastes and inventory change"
      output: "kg and percent mass-balance difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and feedstocks"
      requirement: "Declare product family, part or design, alloy, feedstock form, dimensions, heat-treatment state and finish; UUID identity does not replace these foreground qualifiers."
      evidence: "Product specification, bill of material, supplier certificate and inspection plan"
    - id: dq_temporal_representativeness
      applies_to: "all foreground exchanges"
      requirement: "Use at least 12 consecutive representative months unless the product is a shorter campaign; explain shutdowns, trials, abnormal batches and substitutions."
      evidence: "Reporting-period calendar, production log and exclusion record"
    - id: dq_meter_and_scale_control
      applies_to: "mass, electricity, gas and water"
      requirement: "Use calibrated instruments suitable for the measured range and retain calibration status for the reporting period."
      evidence: "Calibration certificate, verification log and instrument identifier"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Reconcile production, material, energy, water, waste and direct-emission records; disclose excluded exchanges and quantify any cut-off against the accepted-product mass where practicable."
      evidence: "Reconciliation worksheet and signed completeness review"
    - id: dq_route_specificity
      applies_to: "conditional operations"
      requirement: "Mark each heat-treatment, cleaning, pickling and plating route as performed, outsourced or not applicable; do not populate a route-specific row with zero merely because records are missing."
      evidence: "Process flow diagram, routing sheet, supplier operation record and operator confirmation"
    - id: dq_liquid_stream_identity
      applies_to: "surface-treatment wastes"
      requirement: "Keep spent baths and rinse waters separated by operation and dominant chemistry; retain pH, concentration, metal analysis and treatment destination."
      evidence: "Laboratory report, tank/bath identifier and waste manifest"
    - id: dq_geography_technology
      applies_to: "upstream datasets"
      requirement: "Match metal product state, alloy where possible, electricity grid, fuel delivery, geography and production technology; document proxies and sensitivity."
      evidence: "Supplier data, dataset metadata and representativeness assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the exact reference product UUID, Mass property, mass unit group and kg reference unit; reject datasets that omit any required qualifier."
    source_ids:
      - un-cpc-3-0-2025
  - rule_id: validate_inventory_reconciliation
    applies_to: "process inventory"
    rule: "Confirm that every one of the 26 prescribed atomic rows is present or explicitly marked not applicable under its route condition, and that no plural utility, chemical, packaging, waste or emission selector replaces an atomic exchange."
    source_ids: []
  - rule_id: validate_internal_transfer
    applies_to: "process linkage"
    rule: "Reconcile uninspected_article_output and uninspected_article_input after documented work-in-progress change."
    source_ids: []
  - rule_id: validate_metal_balance
    applies_to: "each metal route"
    rule: "Review the metal-balance difference by alloy route and do not release the dataset until unexplained losses, mixed scrap or unrecorded coating transfers are documented and judged acceptable."
    source_ids: []
  - rule_id: validate_energy_separation
    applies_to: "electricity and natural gas"
    rule: "Keep electricity and natural gas as separate exchanges; verify electricity conversion and natural-gas reference conditions."
    source_ids:
      - eu-ferrous-metals-bat-2022
  - rule_id: validate_surface_treatment
    applies_to: "cleaning, pickling and plating"
    rule: "For every performed bath operation, confirm separate chemical input, water input, spent-bath or rinse-waste output, direct HCl emission where applicable, and treatment destination; retain BAT or permit conformance separately from inventory amounts."
    source_ids:
      - us-epa-fabricated-metal-products-1995
      - eu-ferrous-metals-bat-2022
  - rule_id: validate_allocation
    applies_to: "shared processes"
    rule: "Verify the allocation hierarchy, physical driver, factor, co-products, period and sensitivity; reject undocumented mass or economic allocation."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "secondary_dataset and background_dataset for a declared product family and manufacturing route"
  downstream_use: "Foreground supply-chain modelling of covered small metal articles and aggregation into lifecyclemodel systems when product, alloy, finish, geography and technology are compatible."
  allowed_use: "Use for the declared factory-gate product family and route; scale by accepted product mass; combine with compatible upstream feedstock, energy, chemical and treatment datasets."
  excluded_use: "Do not use as a generic proxy for sewing-machine needles, general fasteners, locks, furniture fittings, unrelated ornaments, other alloys or finishes, use-phase performance, packaged retail product or cradle-to-grave comparison without added stages."
  required_metadata: "PCR id and version; reference UUID; product family and part/design; alloy and feedstock form; dimensions; heat treatment; finish and coating; route; performed and outsourced operations; site and geography; reporting period; accepted output; allocation method; packaging status; upstream dataset identities; unresolved UUID disclosures."
  required_quality_disclosure: "Temporal coverage; meter and scale calibration; data completeness; material and internal-transfer reconciliation; shared-meter and shared-line allocation; liquid-stream separation; direct-emission method; supplier-data quality; technological and geographic representativeness; cut-offs; proxy use and sensitivity."
  update_trigger: "Update when product family, alloy, feedstock form, forming technology, heat-treatment fuel, surface-treatment chemistry, coating system, abatement, waste route, supplier geography, electricity mix or allocation basis changes materially, or when more representative data or exact unresolved UUIDs become available."
