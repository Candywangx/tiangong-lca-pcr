measurement_rules:
  - id: reference_product_mass
    applies_to: "Accepted finished reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all exchanges to 1 kg of accepted finished article after final inspection. Exclude pallets, cartons, bags, reels and other packaging unless the study explicitly includes and inventories them."
  - id: count_to_mass_conversion
    applies_to: "Production records kept by item count"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts to mass using a representative, traceable batch weighing for the same product family, alloy, size and finish; retain sampled count, net mass, scale identifier and sampling date."
  - id: solution_mass_basis
    applies_to: "Sodium hydroxide and hydrochloric-acid solution inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report purchased solution on an as-received mass basis and declare concentration. The selected hydrochloric-acid UUID applies only to 30% solution; a different concentration requires its own exact flow identity and must not be silently converted to this flow."
  - id: gas_volume_basis
    applies_to: "Gaseous natural gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Report metered volume at declared reference temperature and pressure; disclose any conversion from operating to reference conditions and any allocation from a shared meter."
  - id: electricity_energy_basis
    applies_to: "Purchased electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the meter's energy quantity and convert kWh to MJ using 1 kWh = 3.6 MJ; disclose voltage level, grid geography, losses boundary and shared-meter allocation."
