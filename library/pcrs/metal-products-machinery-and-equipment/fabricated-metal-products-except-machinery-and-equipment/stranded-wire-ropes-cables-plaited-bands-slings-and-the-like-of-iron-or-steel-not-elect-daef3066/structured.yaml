allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared production lines and meters"
    rule: "Subdivide by product run, machine, or meter where records permit before applying allocation."
    source_ids: []
  - rule_id: allocation_shared_energy
    applies_to: "shared electricity and services"
    rule: "Allocate residual shared consumption using recorded machine operating time multiplied by rated or measured load; if unavailable, use a documented mass-throughput basis and disclose the sensitivity."
    source_ids: []
  - rule_id: allocation_no_avoided_scrap_credit
    applies_to: "waste steel wire"
    rule: "Report waste at the foreground boundary without an avoided-primary-steel credit. Any recycling substitution belongs to the downstream system model and must not be embedded in the foreground amount."
    source_ids: []
  - rule_id: allocation_reusable_packing
    applies_to: "returnable or pooled drums and reels"
    rule: "Allocate measured packing production burden over documented expected uses, include return logistics in the applicable system model, and disclose losses and the allocation denominator; do not assume reuse without records."
    source_ids: []
  - rule_id: allocation_no_co_product_default
    applies_to: "normal fabrication output"
    rule: "Treat the declared stranded product as the reference product and production rejects as waste. If another saleable co-product is intentionally produced, report it separately and document the physical or economic allocation selected for that dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_component_records
      process_id: "integrated_fabrication"
      flow_role: "steel wire, lubricant, fibre core, ferrule, and thimble inputs"
      record_type: "purchase receipt, stores issue/return, batch traveller, component count, supplier specification"
      raw_fields: "material identity; batch; quantity issued; quantity returned; unit; count; unit mass; product construction; supplier; coating or material grade"
      collection_method: "Reconcile receiving, stores, and batch records to conforming production; weigh representative count-based components when supplier mass is unavailable"
      unit: "kg and count"
      frequency: "each batch; aggregate monthly"
      temporal_coverage: "full reporting period, normally at least 12 consecutive months or the complete production campaign"
      site_scope: "all foreground lines producing the declared product"
      aggregation_rule: "Sum net issues by concrete material and normalize to conforming net product mass; retain each material as a separate exchange"
      quality_evidence: "calibrated scale records; purchase documents; batch traveller; supplier certificate; reconciliation log"
    - protocol_id: cp_electricity_meter_records
      process_id: "integrated_fabrication"
      flow_role: "purchased electricity"
      record_type: "revenue meter, submeter, machine log, production log"
      raw_fields: "meter start; meter end; kWh; meter boundary; downtime; machine hours; product mass; allocation key"
      collection_method: "Prefer dedicated submeters; otherwise reconcile site meter to included equipment and allocate documented shared load"
      unit: "kWh, converted to MJ"
      frequency: "continuous or each shift; aggregate monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "included fabrication, testing, ventilation, and packing equipment"
      aggregation_rule: "Net kWh multiplied by 3.6 and divided by conforming net product kg"
      quality_evidence: "meter calibration or utility invoice; reading log; allocation worksheet"
    - protocol_id: cp_packing_records
      process_id: "integrated_fabrication"
      flow_role: "wooden drum and steel band delivered with product"
      record_type: "packing bill, stores issue/return, shipment record, tare measurement, reuse register"
      raw_fields: "packing identity; mass issued; mass returned; tare mass; shipment; product mass; ownership; expected uses; actual returns; losses"
      collection_method: "Weigh or use verified supplier mass; link each packing item to shipment and reuse status"
      unit: "kg and count"
      frequency: "each shipment; aggregate monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all factory-gate packing included in the data package"
      aggregation_rule: "Sum single-use packing; for reusable packing apply the documented use denominator and normalize to net product kg"
      quality_evidence: "scale record; packing bill; shipment record; reuse ledger"
    - protocol_id: cp_output_batch_records
      process_id: "integrated_fabrication"
      flow_role: "conforming finished output and qualifiers"
      record_type: "production order, weigh ticket, test certificate, release record, packing list"
      raw_fields: "product identity; construction; coating; core; diameter; length; net mass; strength grade; termination; lubrication; test status; rejects; packing state"
      collection_method: "Reconcile released output to weigh tickets and production/test records; subtract packaging tare"
      unit: "kg and m"
      frequency: "each batch and shipment"
      temporal_coverage: "full reporting period"
      site_scope: "all included production lines"
      aggregation_rule: "Sum released net product mass; use it as the denominator for normalized inventory"
      quality_evidence: "calibrated scale; test certificate; release authorization; traceable batch identifier"
    - protocol_id: cp_waste_wire_records
      process_id: "integrated_fabrication"
      flow_role: "segregated waste steel wire"
      record_type: "waste container weight, transfer note, recovery receipt, batch scrap log"
      raw_fields: "gross mass; tare; net mass; wire identity; contamination; source batch; destination; treatment route"
      collection_method: "Weigh segregated containers and reconcile internal scrap logs with outbound transfer records"
      unit: "kg"
      frequency: "each container movement; aggregate monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all included lines and trimming/termination stations"
      aggregation_rule: "Sum net outbound waste steel wire by route and normalize to net product kg"
      quality_evidence: "scale record; transfer note; recovery receipt; mass-balance reconciliation"
  calculation_rules:
    - id: calc_normalize_mass
      applies_to: "every non-reference inventory row"
      rule: "normalized amount = reporting-period exchange amount / reporting-period conforming net finished-product mass"
      inputs:
        - "exchange mass or energy"
        - "conforming net product mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "electricity"
      rule: "electricity (MJ) = metered electricity (kWh) × 3.6; normalized electricity = electricity (MJ) / conforming net product mass (kg)"
      inputs:
        - "metered kWh"
        - "conforming net product mass"
      output: "MJ/kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "ferrules, thimbles, drums, or other count-recorded components"
      rule: "component mass = accepted component count × measured or verified supplier unit mass; reconcile rejects and returns separately"
      inputs:
        - "accepted count"
        - "unit mass"
        - "rejected count"
        - "returned count"
      output: "kg of each concrete component"
      source_ids: []
    - id: calc_wire_mass_balance
      applies_to: "steel-bearing material"
      rule: "steel-wire input = net steel mass in conforming product + segregated waste steel wire + closing work-in-progress change + documented steel loss or other separately identified steel output"
      inputs:
        - "wire issues and returns"
        - "product composition"
        - "waste mass"
        - work-in-progress
      output: "mass-balance residual and completeness finding"
      source_ids: []
    - id: calc_reusable_packing
      applies_to: "returnable wooden drum or reel"
      rule: "allocated packing mass per shipment = measured drum mass / documented expected uses, adjusted for recorded loss where the adopted system model requires it"
      inputs:
        - "drum mass"
        - "expected uses"
        - "return and loss records"
        - "shipped product mass"
      output: "allocated kg packing per kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "product and material rows"
      requirement: "Maintain batch-level linkage between the declared product construction and each steel-wire, core, lubricant, termination, and packing input; do not substitute a broader UUID for an unresolved exact flow."
      evidence: "batch traveller, supplier certificate, stores record, UUID audit status"
    - id: dq_mass_completeness
      applies_to: "reference product and steel-bearing flows"
      requirement: "Reconcile steel-bearing inputs, product, waste, and work-in-progress; investigate and disclose the residual and excluded steel-containing exchanges."
      evidence: "signed mass-balance worksheet and inventory reconciliation"
    - id: dq_meter_coverage
      applies_to: "electricity"
      requirement: "Cover all included operating, test, ventilation, and packing loads for the same temporal and site boundary as output; disclose shared-load allocation and unmetered equipment."
      evidence: "meter map, invoices or readings, machine logs, allocation worksheet"
    - id: dq_temporal_representativeness
      applies_to: "all foreground rows"
      requirement: "Use the same representative reporting period, normally at least 12 consecutive months; for campaign production use the complete campaign and disclose why it is representative."
      evidence: "reporting-period statement and production schedule"
    - id: dq_conditional_rows
      applies_to: "core, lubricant, terminations, and packing"
      requirement: "Mark each conditional atomic row as measured, calculated, or demonstrably not applicable for the declared product; omission without a product specification is not acceptable."
      evidence: "product specification, bill of materials, packing instruction, termination drawing"
    - id: dq_test_and_release
      applies_to: "reference product"
      requirement: "Retain the applicable production-test, acceptance, marking, and release evidence for the declared product specification."
      evidence: "test certificate, inspection record, release authorization, marking record"
validation_rules:
  - rule_id: validate_reference_amount
    applies_to: "reference flow"
    rule: "Confirm that the reference output equals exactly 1 kg net finished product and that separately reported packaging is excluded from net product mass."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "product identity"
    rule: "Fail completeness when product form, material grade, wire finish, construction, core, size, supplied length, mechanical specification, termination where applicable, lubricant state, test status, packing state, site, geography, or reporting period is missing without an explicit not-applicable statement."
    source_ids:
      - iso-2408-2017
      - iso-7531-1987
  - rule_id: validate_atomic_inventory
    applies_to: "process inventory"
    rule: "Confirm that each row is one concrete product, waste, or elementary exchange and that conditional construction variants did not create umbrella or Cartesian rows."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "Tiangong references"
    rule: "Confirm public state_code 100, base name, flow type, classification, property, unit group, and product state for every UUID; leave unresolved identities blank rather than selecting a proxy."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "steel-bearing flows"
    rule: "Recalculate the steel-wire mass balance and flag an unexplained residual or a missing steel-containing waste/output disclosure."
    source_ids: []
  - rule_id: validate_electricity_conversion
    applies_to: "electricity"
    rule: "Verify the kWh meter record, meter boundary, shared-load allocation, conversion by 3.6 MJ/kWh, and normalization denominator."
    source_ids: []
  - rule_id: validate_boundary_disclosure
    applies_to: "upstream processing"
    rule: "Confirm whether wire drawing, heat treatment, pickling, coating, component manufacture, and packing manufacture are upstream or separately included; verify that upstream electricity emissions are not reported as direct site emissions."
    source_ids:
      - eu-ferrous-metals-processing-bat-2022
  - rule_id: validate_sling_components
