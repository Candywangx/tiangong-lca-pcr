system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate
      applies_to: "foreground fabrication"
      rule: "Include stranding, closing or braiding, in-process lubrication, cutting, applicable sling termination, production testing, marking, and packing from received-component gate to finished-product factory gate."
      source_ids:
        - iso-2408-2017
        - iso-7531-1987
    - rule_id: boundary_upstream_wire_processing
      applies_to: "received steel wire"
      rule: "Treat steelmaking, wire-rod production, wire drawing, heat treatment, pickling, and metallic coating as upstream unless their separately metered processes are intentionally brought into the study boundary; disclose and link the applicable datasets."
      source_ids:
        - eu-ferrous-metals-processing-bat-2022
    - rule_id: boundary_no_electrical_insulation
      applies_to: "product identity"
      rule: "Exclude electrically insulated conductors and prevent classification similarity from broadening the material or insulation boundary."
      source_ids:
        - un-cpc-3-0-structure-2025
    - rule_id: boundary_direct_exchanges
      applies_to: "site operations"
      rule: "Report all product, waste, and elementary exchanges that actually cross the declared foreground boundary; do not add upstream electricity emissions as direct site emissions."
      source_ids: []
