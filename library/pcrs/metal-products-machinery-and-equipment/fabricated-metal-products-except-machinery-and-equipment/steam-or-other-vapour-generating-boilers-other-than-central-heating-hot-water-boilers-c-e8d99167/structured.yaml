allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared factory operations"
    rule: "Subdivide meters, work orders and material issues to the boiler process wherever practicable before applying allocation."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_second
    applies_to: "inseparable shared operations"
    rule: "If subdivision is not practicable, allocate by a documented causal physical relationship such as machine time, energy demand or processed mass; justify why that relationship represents the shared operation."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_last
    applies_to: "residual multifunctionality"
    rule: "Use another relationship, including economic allocation, only after documenting why subdivision and a causal physical relationship are not feasible; disclose the factor, period and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: scrap_no_unreported_credit
    applies_to: "steel scrap output"
    rule: "Report scrap mass and receiving route separately. Do not subtract an avoided-primary-steel credit inside the foreground inventory unless the downstream modelling method is explicitly declared and applied consistently."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_bom_mass_records
      process_id: "boiler_manufacture"
      flow_role: "material inputs and saleable boiler output"
      record_type: "controlled BOM, stores issue, return, job and final weight records"
      raw_fields: "product_id; material_grade; flow_identity; supplier; issued_mass; returned_mass; installed_mass; scrap_link; dry_product_mass; unit"
      collection_method: "reconcile ERP/BOM quantities to job records and calibrated weighing where available"
      unit: "kg"
      frequency: "each production order; aggregate for reporting period"
      temporal_coverage: "complete reporting period"
      site_scope: "all included production lines at the declared factory"
      aggregation_rule: "sum net issued atomic material and accepted dry output by product configuration, then normalize by dry saleable output mass"
      quality_evidence: "approved BOM revision; stores ledger; scale calibration; job closeout; mass reconciliation"
    - protocol_id: cp_energy_and_gas_records
      process_id: "boiler_manufacture"
      flow_role: "electricity, natural gas and industrial oxygen"
      record_type: "submeter, main meter, invoice and production-driver records"
      raw_fields: "meter_id; start_reading; end_reading; fuel_or_gas_identity; reference_temperature; reference_pressure; allocation_driver; product_id; unit"
      collection_method: "prefer process submeters; otherwise allocate the reconciled factory meter with a causal documented driver"
      unit: "MJ; m3"
      frequency: "monthly and each applicable test campaign"
      temporal_coverage: "complete reporting period"
      site_scope: "included fabrication, coating and testing areas"
      aggregation_rule: "subtract verified non-production use, allocate shared use, and normalize to dry saleable boiler mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation workbook; reference-condition record"
    - protocol_id: cp_hydrostatic_test_water_records
      process_id: "boiler_manufacture"
      flow_role: "test-water input and wastewater output"
      record_type: "test sheet, water meter and discharge record"
      raw_fields: "product_id; test_id; input_volume_or_mass; reused_quantity; retained_quantity; discharged_quantity; destination; density; unit"
      collection_method: "meter each fill and discharge or reconcile a dedicated tank balance"
      unit: "kg; m3"
      frequency: "each hydrostatic test"
      temporal_coverage: "complete reporting period"
      site_scope: "all included test bays"
      aggregation_rule: "convert to mass where needed, keep reuse explicit, sum fresh input and discharged output separately, normalize by dry saleable output mass"
      quality_evidence: "calibrated meter; signed test report; tank balance; discharge manifest"
    - protocol_id: cp_waste_dispatch_records
      process_id: "boiler_manufacture"
      flow_role: "steel scrap"
      record_type: "segregated bin weight and dispatch record"
      raw_fields: "waste_identity; alloy_family; gross_weight; tare; internal_reuse; destination; date; unit"
      collection_method: "weigh each dispatch and reconcile to production-area scrap bins"
      unit: "kg"
      frequency: "each dispatch; monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all included fabrication areas"
      aggregation_rule: "sum net externally dispatched scrap attributable to boiler production and normalize by dry saleable output mass"
      quality_evidence: "weighbridge ticket; waste manifest; bin reconciliation"
    - protocol_id: cp_air_emission_records
      process_id: "boiler_manufacture"
      flow_role: "welding particulate, coating VOC and fossil CO2"
      record_type: "stack test, CEMS, coating issue, supplier composition, consumable use, fuel and control records"
      raw_fields: "source_id; pollutant_identity; measured_concentration; gas_flow; operating_time; consumable_mass; VOC_fraction; recovered_mass; control_efficiency; gas_volume; carbon_content; unit"
      collection_method: "use compliant measurements where available; otherwise use a transparent source-specific mass balance tied to collected activity and control data"
      unit: "kg; m3"
      frequency: "each test campaign or monthly activity balance"
      temporal_coverage: "representative campaigns covering the reporting period and all applicable routes"
      site_scope: "all included emission points and documented fugitive releases"
      aggregation_rule: "calculate gross and controlled releases by route, avoid double counting, sum by atomic flow and normalize by dry saleable output mass"
      quality_evidence: "laboratory report; instrument calibration; supplier SDS; control log; activity reconciliation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period dry saleable boiler mass"
      inputs:
        - "collected atomic exchange amount"
        - "dry saleable boiler mass"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "purchased electricity"
      rule: "electricity_MJ = electricity_kWh × 3.6"
      inputs:
        - "calibrated electricity reading in kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_coating_voc
      applies_to: "coating VOC to air"
      rule: "released VOC = coating consumed × supplier VOC mass fraction − recovered solvent − VOC destroyed or removed by measured controls; do not apply the rule to powder coating with no declared VOC"
      inputs:
        - "coating mass"
        - "supplier VOC fraction"
        - "recovered solvent"
        - "measured control removal or destruction"
      output: "kg VOC released"
      source_ids:
        - us-epa-ap42-other-metal-coating
    - id: calc_welding_particulate
      applies_to: "welding particulate to air"
      rule: "use measured total particulate where available; otherwise multiply consumable use by a process/electrode-specific documented fume factor and then apply measured capture and control performance"
      inputs:
        - "consumable mass"
        - "welding process"
        - "electrode identity"
        - "fume factor"
        - "capture and control data"
      output: "kg particulate released"
      source_ids:
        - us-epa-ap42-electric-arc-welding
    - id: calc_mass_reconciliation
      applies_to: "product and material mass"
      rule: "compare dry saleable product plus separately measured scrap and wastes with net issued material; investigate rather than force-close differences due to emissions, stock change or measurement uncertainty"
      inputs:
        - "net issued material"
        - "dry product"
        - scrap
        - waste
        - "relevant emissions"
        - "stock change"
      output: "documented mass-balance difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve the required qualifiers and the approved product configuration so unlike boiler designs are not silently pooled."
      evidence: "product datasheet; nameplate specification; approved drawing; test certificate"
    - id: dq_temporal_coverage
      applies_to: "all foreground exchanges"
      requirement: "Cover one representative continuous 12-month period or document seasonality, production interruptions and the reason for a shorter period."
      evidence: "dated meter, ERP, invoice, test and dispatch records"
    - id: dq_meter_reconciliation
      applies_to: "energy, gas and water"
      requirement: "Reconcile submeters to site totals and disclose allocation and reference-condition conversions."
      evidence: "calibration certificates; invoices; reconciliation workbook"
    - id: dq_bom_completeness
      applies_to: "material inputs and output"
      requirement: "Reconcile the complete bill of materials and configuration-specific purchased components to dry shipped mass; do not hide omitted materials in a combined row."
      evidence: "controlled BOM; stores ledger; shipment weight; mass balance"
    - id: dq_emission_specificity
      applies_to: "direct air emissions"
      requirement: "Retain pollutant identity, emission point, measurement or factor source, control state and operating route; a species result shall not be reported as total particulate or total VOC."
      evidence: "stack report; laboratory result; SDS; factor citation; control log"
    - id: dq_upstream_representativeness
      applies_to: "purchased product inputs"
      requirement: "Use upstream datasets consistent with product grade/state, supplier geography and technology, and disclose proxies."
      evidence: "supplier declaration; dataset metadata; proxy justification"
validation_rules:
  - rule_id: validate_identity_and_reference
    applies_to: "dataset identity"
    rule: "Confirm the canonical PCR id, finished-boiler boundary, all required qualifiers, dry-mass reference amount and unresolved reference-product UUID status."
    source_ids:
      - un-cpc-3-0-structure-2025
      - eu-steam-boilers-ecodesign-2014
  - rule_id: validate_process_presence
    applies_to: "process inventory"
    rule: "Require boiler_manufacture and all applicable atomic input, waste and elementary flow cards; conditional rows must be present or explicitly shown not applicable with evidence."
    source_ids:
      - eu-steam-boilers-ecodesign-2014
      - us-epa-ap42-electric-arc-welding
      - us-epa-ap42-other-metal-coating
  - rule_id: validate_no_use_phase
    applies_to: "system boundary"
    rule: "Reject lifetime boiler fuel, generated steam or hot-water service, customer-site feedwater treatment and distribution from the factory-gate foreground inventory."
    source_ids:
      - eu-steam-boilers-ecodesign-2014
  - rule_id: validate_bom_mass
    applies_to: "mass reconciliation"
    rule: "Check that net issued material is reconciled to dry product, scrap, wastes, emissions and stock change; investigate material differences rather than balancing them with an unspecified flow."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_energy_separation
    applies_to: "energy inventory"
    rule: "Confirm electricity and natural gas remain separate atomic exchanges and that natural gas and direct fossil CO2 are either jointly applicable or their difference is explained."
    source_ids: []
  - rule_id: validate_water_balance
    applies_to: "hydrostatic testing"
    rule: "Confirm fresh test-water input, measured reuse/retention and wastewater discharge are not double counted and that temporary water is excluded from dry product mass."
    source_ids: []
  - rule_id: validate_allocation_disclosure
    applies_to: "shared operations"
    rule: "Confirm subdivision was attempted first and every remaining allocation driver, factor, period and sensitivity is disclosed."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_uuid_gaps
    applies_to: "unresolved identities"
    rule: "Keep UUID-empty carbon-steel plate, reference boiler, welding particulate and coating VOC rows unresolved until an exact public state-100 identity is confirmed; do not substitute a proxy."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Cradle-to-manufacturer-gate foreground data package and its process or lifecyclemodel projection for finished boiler manufacturing"
  allowed_use: "Comparative manufacturing studies after matching design, pressure, capacity, configuration, geography and time; contribution analysis of boiler materials and factory operations; background use when representativeness is documented"
  excluded_use: "Comparison of lifetime steam or heat service, operational efficiency, fuel performance, installed steam systems, central-heating boilers, or separately supplied auxiliary plant without additional downstream modelling"
  required_metadata: "canonical PCR id; outlet medium; design; rated output and capacity; working pressure; outlet temperature; fuel/heat source; integral-component scope; dry shipped mass; purchased-versus-fabricated split; factory geography; reporting period; allocation; unresolved UUIDs; exclusions"
  required_quality_disclosure: "primary-data coverage; BOM and mass reconciliation; meter coverage and allocation; upstream dataset representativeness; emission measurement/factor basis; water reuse; scrap destination; conditional-route applicability; proxy use; uncertainty and unresolved range evidence"
  update_trigger: "Material change in product design, pressure or capacity class, bill of materials, supplier geography, welding/coating/test route, factory energy mix, allocation method, emission controls, reference-product identity, or availability of independent range evidence"
