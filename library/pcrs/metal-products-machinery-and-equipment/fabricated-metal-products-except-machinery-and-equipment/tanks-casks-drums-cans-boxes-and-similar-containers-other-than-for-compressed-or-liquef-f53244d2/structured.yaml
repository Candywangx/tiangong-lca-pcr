allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all foreground processes"
    rule: "Avoid allocation by separating material routes, product forms, lines, batches, meters, tanks and emission controls wherever records permit."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, fuel, water and treatment services"
    rule: "Assign directly metered quantities first. If direct measurement is unavailable, use a documented physical driver such as equipment time, treated surface area or throughput mass; disclose the driver and sensitivity."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: allocation_metal_scrap
    applies_to: "steel and aluminium scrap"
    rule: "Report segregated scrap as waste output with measured mass and destination. Do not apply an avoided-primary-material credit inside the foreground inventory; any recycling substitution belongs to the declared downstream system model."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: allocation_rework_and_rejects
    applies_to: "internal rework and rejected containers"
    rule: "Keep internal rework loops inside the foreground system and include their incremental material and energy. Report only waste that crosses the boundary; do not count reworked mass as additional released product."
    source_ids:
      - us-epa-ap42-can-coating
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_mass_balance
      process_id: "sheet_preparation_and_forming"
      flow_role: "metal sheet inputs and segregated scrap"
      record_type: "purchase, coil/sheet issue, stock, scale and waste-transfer records"
      raw_fields: "material identity; alloy or grade; coating; thickness; opening stock; receipts; issued mass; closing stock; scrap mass; destination; lot"
      collection_method: "calibrated scales and reconciled inventory ledger"
      unit: "kg"
      frequency: "each receipt, issue and waste transfer; monthly reconciliation"
      temporal_coverage: "full reporting period"
      site_scope: "all included lines and stores"
      aggregation_rule: "reconcile separately by material and product route, then normalize to released mass"
      quality_evidence: "scale calibration; supplier certificate; inventory close; waste transfer note"
    - protocol_id: cp_process_electricity
      process_id: "all_included_processes"
      flow_role: "purchased electricity"
      record_type: "submeter and production records"
      raw_fields: "meter id; start/end reading; kWh; process; line; lot; operating time; shared-load driver"
      collection_method: "calibrated submeter or documented main-meter subtraction"
      unit: "kWh"
      frequency: "continuous or each shift; monthly close"
      temporal_coverage: "full reporting period"
      site_scope: "all included production and auxiliary equipment"
      aggregation_rule: "subtract excluded loads, allocate shared loads by documented physical driver, convert to MJ and normalize"
      quality_evidence: "meter calibration; single-line diagram; reconciliation to invoice"
    - protocol_id: cp_joining_consumables
      process_id: "seam_joining"
      flow_role: "flux-cored wire"
      record_type: "issue, return and batch records"
      raw_fields: "consumable identity; grade; diameter; issued mass; returned mass; lot; joining technology; product lot"
      collection_method: "calibrated issue scale and stores ledger"
      unit: "kg"
      frequency: "each issue and return"
      temporal_coverage: "full reporting period"
      site_scope: "all included joining lines"
      aggregation_rule: "net consumption by compatible joining route, normalized to released mass"
      quality_evidence: "material certificate; scale calibration; batch traceability"
    - protocol_id: cp_aqueous_pretreatment
      process_id: "aqueous_surface_pretreatment"
      flow_role: "water, sodium hydroxide and wastewater"
      record_type: "water meter, chemical issue, bath analysis, tank and discharge records"
      raw_fields: "water volume or mass; density; chemical solution mass; concentration; bath inventory; discharge mass; destination; line; lot"
      collection_method: "calibrated meters/scales, bath analysis and tank reconciliation"
      unit: "kg; m3; mass fraction"
      frequency: "each batch or continuous meter; each discharge"
      temporal_coverage: "full reporting period"
      site_scope: "all included aqueous treatment and rinse stages"
      aggregation_rule: "keep external water, each chemical and each waste stream separate; normalize net boundary-crossing mass"
      quality_evidence: "meter/scale calibration; analysis result; discharge manifest; bath balance"
    - protocol_id: cp_coating_fuel_and_formulation
      process_id: "coating_printing_and_curing"
      flow_role: "coating and natural gas"
      record_type: "formulation, coating issue/return, gas meter and production records"
      raw_fields: "formulation id; coating mass; returned mass; solids; water; solvent; gas volume; reference conditions; line; lot; coated area"
      collection_method: "calibrated scale and corrected gas meter"
      unit: "kg; m3"
      frequency: "each coating lot and shift; monthly close"
      temporal_coverage: "full reporting period"
      site_scope: "all included coating, printing and curing equipment"
      aggregation_rule: "aggregate only identical formulations and route conditions; normalize to released mass"
      quality_evidence: "safety/technical data sheet; scale and meter calibration; lot traceability"
    - protocol_id: cp_direct_air_emissions
      process_id: "coating_printing_and_curing"
      flow_role: "NMVOC and fossil CO2"
      record_type: "stack test, continuous monitor, capture/control and operating records"
      raw_fields: "pollutant; concentration; flow; duration; coating solvent input; capture; recovery; destruction; fuel; line; lot"
      collection_method: "site measurement or reconciled line-specific mass balance after control"
      unit: "kg"
      frequency: "each test and operating period required by site plan"
      temporal_coverage: "representative full reporting period"
      site_scope: "all direct exhausts from included coating and curing equipment"
      aggregation_rule: "sum direct releases after control; exclude upstream electricity and fuel-supply emissions"
      quality_evidence: "method report; calibration; control-device log; completeness reconciliation"
    - protocol_id: cp_released_product
      process_id: "inspection_and_release"
      flow_role: "released steel can"
      record_type: "production, inspection, tare and dispatch records"
      raw_fields: "product id; material; form; capacity; coating; closure; count; sampled tare; released mass; rejects; rework; date"
      collection_method: "calibrated production scale or count-to-mass protocol plus signed release"
      unit: "kg; item"
      frequency: "each released lot"
      temporal_coverage: "full reporting period"
      site_scope: "all included inspection and dispatch points"
      aggregation_rule: "sum conforming released mass only; reconcile rejects and rework"
      quality_evidence: "scale calibration; tare sample; inspection result; release authorization; dispatch record"
  calculation_rules:
    - id: calc_normalize_reference_mass
      applies_to: "every inventory row"
      rule: "normalized amount = reporting-period exchange amount / reporting-period released steel-can mass"
      inputs:
        - "exchange amount"
        - "released mass"
      output: "amount per 1 kg released steel can"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "all electricity rows"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - "metered kWh"
      output: "electricity in MJ"
      source_ids: []
    - id: calc_sodium_hydroxide_pure
      applies_to: "sodium hydroxide"
      rule: "pure-equivalent NaOH mass = delivered solution mass × measured or supplier-declared NaOH mass fraction"
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg NaOH"
      source_ids:
        - ec-jrc-stm-bref-2006
    - id: calc_count_to_mass
      applies_to: "released product when counted"
      rule: "released mass = conforming item count × contemporaneous average sampled tare"
      inputs:
        - "conforming count"
        - "sampled tare"
        - "sample statistics"
      output: "kg released product"
      source_ids: []
    - id: calc_metal_balance
      applies_to: "each metal route"
      rule: "imbalance = opening stock + receipts - closing stock - released product - segregated scrap - other documented outputs; investigate and disclose non-zero imbalance"
      inputs:
        - stock
        - receipt
        - "product and waste masses"
      output: "route mass-balance result"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Declare material, grade/alloy, form, capacity, gauge, joining route, coating, closure configuration and released specification for every modelled product."
      evidence: "supplier certificate; drawing/specification; release record"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Use one complete, representative reporting year or the full shorter production campaign; disclose shutdowns, trials and abnormal periods."
      evidence: "dated records; production calendar; exception log"
    - id: dq_measurement_traceability
      applies_to: "mass, energy, water and emissions"
      requirement: "Retain meter/scale identity, calibration status, raw readings, conversion basis and responsible record owner."
      evidence: "calibration certificate; raw log; signed reconciliation"
    - id: dq_route_separation
      applies_to: "material and technology variants"
      requirement: "Do not average iron/steel and aluminium routes, coated and uncoated routes, or materially different forming/joining technologies without disclosing composition and testing sensitivity."
      evidence: "route-specific batch and meter records"
    - id: dq_completeness
      applies_to: "foreground boundary"
      requirement: "Reconcile metal mass, purchased energy, water, chemicals, coating, waste and direct releases to the included process map and explain missing or estimated records."
      evidence: "signed mass/energy balance and completeness checklist"
    - id: dq_upstream_compatibility
      applies_to: "upstream product inputs"
      requirement: "Use upstream datasets compatible with declared geography, technology, product state and delivery boundary; document substitutions."
      evidence: "upstream dataset metadata and selection record"
validation_rules:
  - rule_id: validation_scope_identity
    applies_to: "product category and reference flow"
    rule: "Fail validation if the product is for compressed or liquefied gas, exceeds 300 L, includes mechanical or thermal equipment, is filled, or lacks the required product qualifiers."
    source_ids:
      - unsd-cpc-3-0-structure-2025
  - rule_id: validation_reference_mass
    applies_to: "reference product"
    rule: "Confirm that exactly 1 kg net mass of conforming released empty steel cans is the reference and that contents, transport packaging and separately supplied accessories are excluded."
    source_ids: []
  - rule_id: validation_process_alignment
    applies_to: "process map and inventory"
    rule: "Confirm every required process has a detailed inventory, every conditional process states applicability, and every selected flow is one atomic exchange."
    source_ids:
      - us-epa-ap42-can-coating
      - ec-jrc-stm-bref-2006
  - rule_id: validation_uuid_and_units
    applies_to: "UUID-bearing rows"
    rule: "Confirm public state 100, English and Chinese baseName, flow type, classification, property, unit group and reference unit match the selected row; keep unresolved rows UUID-empty."
    source_ids: []
  - rule_id: validation_balance_and_completeness
    applies_to: "foreground records"
    rule: "Confirm material-balance closure, released-product reconciliation, route-specific utility coverage, wastewater destination and direct-emission completeness; investigate unexplained gaps."
    source_ids:
      - ec-jrc-stm-bref-2006
  - rule_id: validation_no_double_counting
    applies_to: "emissions and recycling"
    rule: "Confirm upstream electricity and fuel emissions are not repeated as direct releases and no avoided recycling credit is embedded in foreground scrap outputs."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; may serve as background_dataset only for the declared material, product form, capacity, route, geography and plant-gate boundary"
  downstream_use: "Foreground process datasets and lifecycle models requiring manufacture of empty small metal containers"
  allowed_use: "Comparison or modelling within the declared material, form, capacity, joining, coating, geography and reporting-period qualifiers"
  excluded_use: "Compressed/liquefied-gas containers; containers above 300 L; equipped containers; filled packaging systems; a different material or product form without compatibility review; container use or end-of-life"
  required_metadata: "PCR id; product and CPC context; material and grade/alloy; form; capacity; gauge; joining route; coating/printing route; closure configuration; geography; reporting period; reference mass; process applicability; upstream dataset links; allocation; data quality"
  required_quality_disclosure: "Raw-record coverage; calibration; mass-balance result; count-to-mass sampling; route separation; shared-service allocation; direct-emission method; unresolved UUIDs; missing independent range evidence"
  update_trigger: "Material, gauge, forming/joining technology, coating formulation or control, fuel, capacity class, closure configuration, site geography, allocation, upstream dataset, reporting period or released-product specification changes materially"
