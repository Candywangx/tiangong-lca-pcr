allocation_rules:
  - rule_id: al_subdivision_first
    applies_to: "shared manufacturing operations"
    rule: "Avoid allocation by sub-metering, batch assignment, equipment time, furnace charge, surface area, joint length, test count, or another causal physical record before applying an allocation factor."
    source_ids:
      - ec-pef-method-2021
  - rule_id: al_shared_utilities
    applies_to: "utilities serving multiple products"
    rule: "Allocate only the residual shared quantity using a documented causal driver. Mass may be used only when it represents resource demand; otherwise use machine time, thermal load, surface area, or another justified driver and disclose a sensitivity check."
    source_ids:
      - ec-pef-method-2021
  - rule_id: al_scrap
    applies_to: "metal scrap outputs"
    rule: "Report steel and aluminium scrap as waste outputs at the point they leave the foreground process. Do not subtract an avoided-primary-metal credit from the foreground inventory; any recycling substitution belongs to an explicitly declared downstream method."
    source_ids:
      - ec-pef-method-2021
  - rule_id: al_rework
    applies_to: "internal rework"
    rule: "Keep rework that does not cross the process boundary inside the batch balance and assign its incremental energy and material use to the resulting accepted output. Record material leaving the system as waste only once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "material_preparation_and_shell_forming"
      flow_role: "Each metal stock input and each segregated metal scrap output"
      record_type: "Batch issue, weighment, return, scrap, and inventory record"
      raw_fields: "row_id; material/alloy; heat/cast; supplier; opening stock; receipts; issued mass; returned mass; accepted work-in-process; scrap mass; batch; unit"
      collection_method: "Reconcile calibrated scales, stock ledger, production issue, and scrap dispatch records for each material and row_id"
      unit: "kg"
      frequency: "Each batch with monthly closure"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope forming operations"
      aggregation_rule: "Sum only records assigned to the row and batch; prevent duplicate scrap assignment; normalize by accepted output"
      quality_evidence: "Scale calibration; material certificate; heat/cast traceability; stock reconciliation; scrap ticket"
    - protocol_id: cp_welding_consumables
      process_id: "pressure_shell_joining"
      flow_role: "Flux-cored welding wire"
      record_type: "Consumable issue and return record"
      raw_fields: "row_id; consumable grade; batch; opening stock; receipts; issued mass; returned mass; joint/work order; accepted output"
      collection_method: "Reconcile stores and work-order records for each qualified welding procedure"
      unit: "kg"
      frequency: "Each batch with monthly closure"
      temporal_coverage: "Complete reporting period"
      site_scope: "In-scope joined pressure shells and attachments"
      aggregation_rule: "Net consumption equals issue minus verified unused return; normalize by accepted joined-shell mass"
      quality_evidence: "Consumable certificate; qualified procedure; stores reconciliation; work order"
    - protocol_id: cp_energy_and_fuel
      process_id: "material_preparation_and_shell_forming_pressure_shell_joining_heat_treatment_machining_cleaning_and_finishing_inspection_pressure_test_and_release"
      flow_role: "One electricity, natural-gas, diesel, or oxygen row"
      record_type: "Meter, invoice, tank, or cylinder record"
      raw_fields: "row_id; meter/source id; opening/closing reading or stock; receipts; returns; reference conditions; calorific value; equipment/process; batch; allocation driver"
      collection_method: "Read calibrated meters or reconcile supplier and stock records separately for each carrier and row_id"
      unit: "MJ; kWh; kg; m3"
      frequency: "Each batch or monthly, with reporting-period closure"
      temporal_coverage: "Complete reporting period"
      site_scope: "All directly controlled in-scope equipment"
      aggregation_rule: "Apply declared unit conversion and causal allocation; never combine carriers; normalize to process or reference output"
      quality_evidence: "Calibration; invoice; tank/cylinder ledger; fuel specification; allocation worksheet"
    - protocol_id: cp_water_balance
      process_id: "heat_treatment_machining_cleaning_and_finishing_inspection_pressure_test_and_release"
      flow_role: "One process-water input or cleaning-wastewater output"
      record_type: "Meter and recirculation balance"
      raw_fields: "row_id; meter id; opening/closing reading; make-up; recirculated; discharged; transferred; temperature; density; process; batch"
      collection_method: "Reconcile inlet, reuse, inventory, and discharge meters; sample composition where wastewater crosses the boundary"
      unit: "kg; m3"
      frequency: "Each batch or monthly, with reporting-period closure"
      temporal_coverage: "Complete reporting period"
      site_scope: "In-scope quench, cleaning, rinsing, and hydrostatic-test systems"
      aggregation_rule: "Count only net make-up as input and boundary-crossing wastewater as output; convert volume to mass with documented density"
      quality_evidence: "Meter calibration; water balance; density record; wastewater analysis; discharge or transfer record"
    - protocol_id: cp_surface_chemicals
      process_id: "machining_cleaning_and_finishing"
      flow_role: "Sodium hydroxide, powder coating, and powder-coating waste as separate rows"
      record_type: "Chemical issue, concentration, recovery, return, and waste record"
      raw_fields: "row_id; chemical/product; concentration; batch; opening stock; receipts; issued; recovered; returned; closing stock; waste mass; destination"
      collection_method: "Reconcile each named chemical independently using calibrated mass records and measured concentration"
      unit: "kg"
      frequency: "Each batch with monthly closure"
      temporal_coverage: "Complete reporting period"
      site_scope: "Declared cleaning and coating route"
      aggregation_rule: "Calculate active sodium hydroxide separately; exclude reusable recovered powder from net input and waste; normalize by accepted finished output"
      quality_evidence: "Supplier specification; concentration test; scale calibration; stock balance; waste ticket"
    - protocol_id: cp_direct_emissions
      process_id: "heat_treatment"
      flow_role: "Fossil carbon dioxide from on-site fuel combustion"
      record_type: "Fuel-carbon balance or validated stack measurement"
      raw_fields: "row_id; fuel quantity; fuel carbon content; biogenic fraction; oxidation basis; stack result; monitoring period; assigned furnace output"
      collection_method: "Use one declared method per emission and period; reconcile calculated and measured values when both exist without double counting"
      unit: "kg"
      frequency: "Each furnace batch with annual/reporting-period closure"
      temporal_coverage: "Complete reporting period"
      site_scope: "In-scope fuel-fired heat-treatment equipment"
      aggregation_rule: "Apply cr_fossil_co2; allocate only assigned fuel or measured stack mass; normalize by accepted heat-treated output"
      quality_evidence: "Fuel analysis or supplier specification; calibrated meter; stack QA record; reconciliation worksheet"
    - protocol_id: cp_final_product_and_tests
      process_id: "inspection_pressure_test_and_release"
      flow_role: "Accepted product and rejected steel or aluminium container rows"
      record_type: "Test, inspection, weighment, marking, and rejection record"
      raw_fields: "row_id; serial/lot; material; route; empty mass; water capacity; service pressure; test pressure; test method; result; rejection reason; scrap mass; release date"
      collection_method: "Link calibrated weighing and required inspection/test records to each serial number or production lot"
      unit: "kg; item; pressure unit as declared"
      frequency: "Each item or prescribed lot"
      temporal_coverage: "Complete reporting period"
      site_scope: "All in-scope containers released or rejected"
      aggregation_rule: "Sum accepted net empty mass for the denominator; assign rejected material once by material; normalize all rows to accepted mass"
      quality_evidence: "Scale and pressure-gauge calibration; test certificate; material traceability; release authorization; rejection disposition"
  calculation_rules:
    - id: cr_reference_normalization
      applies_to: "every inventory row"
      rule: "Normalized amount = reporting-period row quantity / reporting-period net mass of conforming empty containers released within the same product system."
      inputs:
        - "Row quantity"
        - "accepted reference-product mass"
        - "product and period assignment"
      output: "Quantity per 1 kg reference product"
      source_ids: []
    - id: cr_active_sodium_hydroxide
      applies_to: "cleaning_sodium_hydroxide"
      rule: "Active sodium hydroxide mass = solution mass × measured mass fraction of sodium hydroxide; keep carrier water in the water balance when material."
      inputs:
        - "Issued solution mass"
        - "measured concentration"
      output: "kg active sodium hydroxide"
      source_ids: []
    - id: cr_fossil_co2
      applies_to: "heat_treatment_co2"
      rule: "Fossil CO2 mass = fossil fuel mass × fossil carbon mass fraction × oxidation fraction × 44/12, or the equivalent calculation from standardized gas volume; do not add a stack result representing the same emission."
      inputs:
        - "Fuel quantity"
        - "reference conditions or density"
        - "fossil carbon content"
        - "oxidation fraction"
      output: "kg fossil carbon dioxide"
      source_ids: []
    - id: cr_metal_balance
      applies_to: "steel and aluminium material rows"
      rule: "For each material and batch, input mass = accepted work-in-process mass + returned reusable stock + reported scrap/waste + documented inventory change; investigate and disclose residual imbalance."
      inputs:
        - "Material issue"
        - return
        - "accepted output"
        - scrap
        - "inventory change"
      output: "Material-specific reconciliation and normalized flows"
      source_ids: []
    - id: cr_recovered_powder
      applies_to: "powder_coating; powder_coating_waste"
      rule: "Net powder input = issued powder − unused return; waste output = collected residue dispatched as waste; powder recovered and reused within the process is neither a new input nor a waste crossing."
      inputs:
        - Issue
        - "unused return"
        - "recovered reuse"
        - "waste dispatch"
      output: "kg powder input and kg powder-coating waste"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Maintain serial- or lot-level linkage among material/alloy, manufacturing route, water capacity, service pressure, test pressure, applicable standard, included accessories, empty mass, and release status."
      evidence: "Product specification; drawing; material certificate; test and release record"
    - id: dq_primary_data
      applies_to: "foreground processes"
      requirement: "Use complete site-specific records for directly controlled material, energy, water, waste, test, and emission flows over one representative reporting period; explain missing records and substitutions."
      evidence: "Meter and stock reconciliation; invoices; production ledger; data-gap log"
    - id: dq_temporal
      applies_to: "all rows"
      requirement: "Align numerator and accepted-output denominator to the same reporting period and exclude abnormal shutdown, commissioning, or trial production unless separately disclosed."
      evidence: "Production calendar; meter dates; batch mapping; exception log"
    - id: dq_measurement
      applies_to: "measured quantities"
      requirement: "Use calibrated devices suitable for the quantity and retain raw readings, units, conversion factors, reference conditions, and correction records."
      evidence: "Calibration certificates; raw readings; conversion worksheet; QA approval"
    - id: dq_completeness
      applies_to: "all boundary crossings"
      requirement: "Reconcile material, water, fuel, and product balances; document each exclusion and its cumulative significance rather than relying on an automatic cut-off."
      evidence: "Balance worksheets; exclusion register; completeness review"
    - id: dq_upstream_matching
      applies_to: "linked datasets"
      requirement: "Match upstream datasets to material grade/state, energy carrier, geography, technology, and reference unit; disclose proxies and unresolved identities."
      evidence: "Supplier specification; dataset metadata; proxy justification"
validation_rules:
  - rule_id: vr_identity_complete
    applies_to: "reference product"
    rule: "Reject a data package that omits vessel family, refillability, shell material/alloy, stock form, seamless/welded route, water capacity, service pressure, test pressure, applicable standard, included accessories, surface finish, geography, reporting period, or net empty mass."
    source_ids:
      - un-cpc-3-0-structure-2025
      - us-dot-49-cfr-178-37
      - us-dot-49-cfr-178-46
      - us-dot-49-cfr-178-50
  - rule_id: vr_route_consistency
    applies_to: "process inventory"
    rule: "Require each reported flow and process to match the declared route. A conditional row may be absent only when its operation or material is demonstrably not applicable; zero must not substitute for missing data."
    source_ids:
      - us-dot-49-cfr-178-37
      - us-dot-49-cfr-178-46
      - us-dot-49-cfr-178-50
  - rule_id: vr_test_traceability
    applies_to: "inspection and release"
    rule: "Require traceable inspection and pressure/mechanical-test evidence at the frequency prescribed by the declared standard, and exclude failed containers from accepted output."
    source_ids:
      - us-dot-49-cfr-178-37
      - us-dot-49-cfr-178-46
      - us-dot-49-cfr-178-50
  - rule_id: vr_mass_balance
    applies_to: "metals and finished product"
    rule: "Require separate steel and aluminium balances to close within the site's documented measurement uncertainty; investigate residuals and prevent double counting of forming scrap, destructive-test specimens, and rejected containers."
    source_ids: []
  - rule_id: vr_energy_no_double_count
    applies_to: "electricity and fuels"
    rule: "Reconcile process-level energy with facility totals and reject overlap among forming, joining, heat treatment, finishing, testing, purchased heat, and upstream electricity emissions."
    source_ids: []
  - rule_id: vr_emission_no_double_count
    applies_to: "direct fossil carbon dioxide"
    rule: "Accept either a validated fuel-carbon calculation or a representative stack result for the same source and period; if both exist, use one and retain the other as a reconciliation check."
    source_ids: []
  - rule_id: vr_cutoff_and_allocation
    applies_to: "completeness and shared operations"
    rule: "Require disclosed exclusions, allocation drivers, residual shared quantities, and sensitivity where the allocation choice can materially affect results."
    source_ids:
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "Cradle-to-gate foreground production dataset for empty iron, steel, or aluminium compressed- or liquefied-gas containers"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product LCAs, supply-chain models, procurement comparisons, and lifecycle models that match the declared vessel design, material, route, service conditions, geography, included accessories, and factory-gate boundary"
  excluded_use: "Filled-gas packaging without a separate gas/filling model; composite vessels outside the scope; use-stage safety or lifetime claims; periodic requalification; repair; end-of-life; or comparison of containers with materially different pressure service without functional adjustment"
  required_metadata: "canonical PCR id; CPC context; vessel family; refillability; material/alloy; stock form; route; water capacity; service pressure; test pressure; standard; inspection plan; accessories; finish; empty mass; geography; reporting period; allocation; cut-offs; source and dataset versions"
  required_quality_disclosure: "Primary-data coverage; meter and scale calibration; material and test traceability; material/water/energy reconciliations; rejected-product handling; direct-emission method; allocation drivers; exclusions; proxies; unresolved UUIDs; uncertainty and representativeness"
  update_trigger: "Change in alloy or stock form, forming/joining/heat-treatment route, vessel design or pressure class, testing standard, finish, included accessories, site energy or water system, allocation, geography, or representative reporting period"
