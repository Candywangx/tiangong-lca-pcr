system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased metal feedstock, flux or agglomerated-powder ingredients, binders, energy, water and packaging cross the manufacturing-site gate. It ends with quality release and packaging of the finished consumable at that gate. It includes receiving and inspection; wire redrawing, straightening, cutting or pickling when performed; powder sieving, weighing, blending or agglomeration; wet mixing and briquetting where applicable; coating extrusion or metallic-strip forming, filling and closing; optional seam welding; drawing, annealing, drying or baking; surface treatment; winding or cutting; testing; and packaging. Use of the consumable in soldering, brazing, welding, deposition or metal spraying is outside this foreground boundary."
      source_ids: []
    - rule_id: boundary_supplier_gate
      applies_to: "foreground system"
      rule: "Include all on-site processes from receipt of purchased feedstocks through quality release and packaging; represent upstream supply with linked datasets and exclude use and downstream treatment."
      source_ids:
        - voestalpine-seamless-cored-wire-epd-2023
    - rule_id: boundary_route_disclosure
      applies_to: "route and formulation"
      rule: "Select the actual coated-electrode, cored-wire, cored-rod, agglomerated-powder wire/rod or other covered route and enumerate every physically present formulation ingredient as an atomic exchange."
      source_ids:
        - unido-welding-consumables-1984
        - us-patent-10124444-flux-cored-wire
        - us-patent-20080093350-thermal-spray-cored-wire
    - rule_id: boundary_completeness
      applies_to: "material, energy, waste and emission inventory"
      rule: "Do not omit a flow solely because its mass is small, confidential, hazardous, recycled or shared. Confidential formulations may mask public composition values, but the review package must retain auditable masses and identities."
      source_ids:
        - voestalpine-seamless-cored-wire-epd-2023
boundary_abstraction:
  declared_starting_condition: "Purchased wire, rod or metallic strip; individually identified mineral, metal, alloy or carbide powders; binder solution; process water; purchased energy; and individual packaging components at the manufacturing-site gate"
  starting_condition_role: "Supplier-gate inputs to the foreground consumable-manufacturing system"
  product_classification_scope: "The semantic covered-product boundary in section 2, using CPC 3.0 code 42950 only as classification context"
  recursive_input_rule: "If a purchased input is itself a covered CPC 42950 consumable or semi-finished covered product, record it once as an atomic product input and link a supplier-gate dataset; do not recursively decompose its manufacture inside the same foreground package"
  upstream_dataset_requirement: "Link geographically and technologically appropriate upstream datasets for every purchased metal, powder, binder, energy, water and packaging input; state unresolved supplier-data gaps"
  disclosure: "Declare product route, every formulation ingredient and concentration or mass, starting feedstock state, internal versus purchased intermediates, scrap recycling route, emission controls, packaging configuration, geography, technology and production period"
