allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "multiple product grades, routes or lines"
    rule: "Subdivide by formulation, route, line and production period and use direct material issues, meters and waste records before applying allocation."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "unavoidable shared preparation, utilities, finishing and packaging"
    rule: "Allocate remaining shared burdens using a documented physical driver that causes the burden, such as equipment time, metered energy, processed mass or packed-unit count; do not default to revenue when a causal physical driver exists."
    source_ids: []
  - rule_id: allocation_scrap_no_credit
    applies_to: "steel, alloy, flux or powder waste"
    rule: "Report the waste mass and destination at the point it leaves the foreground boundary. Do not apply an avoided-production or recycling credit inside this supplier-gate inventory; any substitution credit belongs to a separately declared downstream model."
    source_ids: []
  - rule_id: allocation_no_recipe_co_products
    applies_to: "coating and core formulation"
    rule: "Treat formulation ingredients as consumed inputs and the released consumable as the reference product. A returned in-process material is an internal stock transfer, not a co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_mass_balance
      process_id: "feedstock_preparation_finishing_packaging"
      flow_role: "material issues, packaging and released product"
      record_type: "batch issue, recipe, purchase and quality-release records"
      raw_fields: "product code; batch id; flow identity; supplier; lot; gross issue; return to stock; concentration; package specification; released net mass; rejected mass"
      collection_method: "calibrated scales and controlled recipe/ERP records reconciled to physical inventory"
      unit: "kg"
      frequency: "each batch, summarized monthly"
      temporal_coverage: "representative continuous 12-month period or documented campaign"
      site_scope: "all foreground lines and storage transfers at the declared site"
      aggregation_rule: "sum net issues and released masses by product and route; normalize each to released product mass"
      quality_evidence: "scale calibration, lot traceability, inventory reconciliation and release certificate"
    - protocol_id: cp_metered_energy
      process_id: "feedstock_preparation_product_forming_finishing_packaging"
      flow_role: "electricity and natural gas"
      record_type: "submeter, supplier invoice and equipment operating log"
      raw_fields: "meter id; opening and closing reading; unit; reference conditions for gas; line; product; operating and downtime hours; allocation driver"
      collection_method: "calibrated meters with invoice reconciliation"
      unit: "kWh and m3"
      frequency: "continuous or each billing period, reconciled monthly"
      temporal_coverage: "same representative period as production"
      site_scope: "all in-boundary preparation, forming, treatment, finishing and control equipment"
      aggregation_rule: "subtract excluded loads; allocate only residual shared use by documented causal driver; normalize to released mass"
      quality_evidence: "meter calibration, invoice reconciliation and operating log"
    - protocol_id: cp_water_balance
      process_id: "feedstock_preparation_product_forming"
      flow_role: "process water and pickling wastewater"
      record_type: "water meter, bath make-up, discharge meter and tank dispatch record"
      raw_fields: "meter id; water source; bath id; acid identity; make-up; rinse use; reuse; discharge; density; dissolved-metal analysis; destination"
      collection_method: "calibrated meters or weighed tanks reconciled through a site water balance"
      unit: "kg and retained m3"
      frequency: "each batch or continuous, reconciled monthly"
      temporal_coverage: "same representative period as production"
      site_scope: "all wet mixing, cleaning, pickling, rinsing and treatment within the site boundary"
      aggregation_rule: "count external make-up once; separate reuse; reconcile input, evaporation, product moisture, wastewater and stock change"
      quality_evidence: "meter calibration, laboratory analysis and treatment/dispatch record"
    - protocol_id: cp_waste_and_emissions
      process_id: "feedstock_preparation_product_forming"
      flow_role: "solid waste and direct air emissions"
      record_type: "waste weigh ticket, stack test, continuous monitor, control-device and emissions record"
      raw_fields: "flow identity; composition; mass; size fraction; compartment; measurement point; control efficiency; destination; reporting period"
      collection_method: "calibrated waste scales and legally or technically accepted emission measurements or audited site emissions records"
      unit: "kg"
      frequency: "each dispatch and each required monitoring period"
      temporal_coverage: "same representative period as production"
      site_scope: "all declared foreground emission points and waste dispatches"
      aggregation_rule: "exclude internal returns; aggregate by atomic flow, route and destination; normalize to released mass"
      quality_evidence: "weigh ticket, chain of custody, sampling plan, laboratory report and monitor QA/QC"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = exchange quantity assigned to the product / net quality-released product mass"
      inputs:
        - "assigned exchange quantity"
        - "released product mass"
      output: "exchange per 1 kg reference product"
      source_ids: []
    - id: calc_electricity_conversion
      applies_to: "electricity rows"
      rule: "MJ = metered kWh × 3.6; retain the original kWh record and then normalize"
      inputs:
        - "metered kWh"
        - "released product mass"
      output: "MJ per 1 kg reference product"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "corrugated fibreboard box"
      rule: "packaging mass = verified unit mass × number of boxes assigned to the released product"
      inputs:
        - "package specification"
        - "packed-unit count"
        - "released product mass"
      output: "kg box per 1 kg reference product"
      source_ids:
        - voestalpine-seamless-cored-wire-epd-2023
    - id: calc_batch_mass_reconciliation
      applies_to: "product, material, waste and direct-emission mass"
      rule: "reconcile opening stock + purchased input with closing stock + released product + returned stock + dispatched waste + measured direct releases; explain moisture, evaporation and any residual"
      inputs:
        - "batch and inventory records from all four protocols"
      output: "reconciled mass-balance statement and residual"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and formulation"
      requirement: "Trace each result to product code, applicable standard/classification, sheath or core metal, every coating/core ingredient, concentration, dimensions, moisture condition and packaging configuration."
      evidence: "approved specification, recipe revision, batch record and release certificate"
    - id: dq_measurement
      applies_to: "mass, energy, gas and water records"
      requirement: "Use calibrated instruments with units and boundaries recorded; preserve gas reference conditions and every conversion."
      evidence: "calibration certificates, meter map, raw readings and conversion worksheet"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Use a continuous representative 12-month period where available; otherwise document campaign dates, production volume, shutdowns and why the period represents the declared product."
      evidence: "production calendar, monthly reconciliation and representativeness note"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Account for every physically present recipe ingredient and packaging component and every material, energy, waste and elementary flow crossing the boundary; quantify and explain mass-balance residuals."
      evidence: "signed completeness checklist, purchasing reconciliation, waste register and emissions inventory"
    - id: dq_supplier_links
      applies_to: "upstream inputs"
      requirement: "Match upstream datasets to material grade, composition, product state, geography and supply technology, and disclose proxy or missing supplier data."
      evidence: "supplier declarations, certificates of analysis and dataset-link register"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Confirm exactly 1 kg net quality-released product, exclude separable packaging, and verify every required qualifier and exact product-flow identity."
    source_ids: []
  - rule_id: validate_route_and_recipe
    applies_to: "product route and inputs"
    rule: "Confirm that the declared route matches the process map and that every formulation ingredient and packaging component is represented by one atomic flow with route applicability."
    source_ids:
      - unido-welding-consumables-1984
      - us-patent-10124444-flux-cored-wire
      - us-patent-20080093350-thermal-spray-cored-wire
  - rule_id: validate_mass_balance
    applies_to: "mass exchanges"
    rule: "Reconcile material inputs, stock change, released product, returned material, waste and direct releases; investigate and disclose every non-trivial residual rather than forcing closure."
    source_ids: []
  - rule_id: validate_energy_and_emissions
    applies_to: "electricity, natural gas and direct fossil carbon dioxide"
    rule: "Reconcile meters to the production period; verify gas reference conditions; prevent upstream electricity emissions from being counted as direct foreground emissions."
    source_ids:
      - voestalpine-seamless-cored-wire-epd-2023
  - rule_id: validate_water_and_waste
    applies_to: "water, wastewater and solid waste"
    rule: "Prevent double counting of internal reuse or returned formulation and retain composition, destination and treatment evidence for each dispatched waste stream."
    source_ids: []
  - rule_id: validate_uuid_and_localization
    applies_to: "all UUID-bearing flows"
    rule: "Require public state-100 identity, compatible flow type, property and unit group; use the exact TianGong Chinese baseName in the aligned Chinese rendering. Keep unresolved rows UUID-empty."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for one declared covered consumable at one site and representative period"
  downstream_use: "secondary_dataset; may serve as background_dataset only for a compatible product route, formulation, product state, geography and technology"
  allowed_use: "Supplier-gate inventories of welding, brazing, soldering, hardfacing, deposition and metal-spraying consumables; linkage into downstream joining or coating models that separately model use"
  excluded_use: "Welding or thermal-spraying operation impacts; plain solid wire; separately marketed flux; welding equipment; graphite electrodes; substitution among materially different recipes or product forms without documented review"
  required_metadata: "canonical PCR id; product standard/classification; product form and use; full formulation disclosure in the review package; sheath/core/coating composition; dimensions; fill or coating ratio; moisture condition; seam and heat-treatment route; packaging; site; geography; technology; production period; allocation; upstream dataset links"
  required_quality_disclosure: "unresolved UUIDs and source gaps; foreground coverage; instrument calibration; temporal representativeness; mass-balance residual; shared-burden allocation; supplier proxies; waste destinations; emission-control and measurement basis"
  update_trigger: "Change in product identity, standard, formulation, metal or carbide grade, fill/coating ratio, route, major equipment, heat or surface treatment, packaging, energy supply, emission control, site, allocation method, upstream dataset or representative period"
