      - us-epa-mpm-2003
  - rule_id: validate_atomic_rows
    applies_to: "inventory"
    rule: "Require one exchange and one property/unit per row; reject combined utilities, chemicals, packaging, wastes or emissions."
    source_ids: []
  - rule_id: validate_uuid_semantics
    applies_to: "UUID rows"
    rule: "Confirm state 100, names, type, classification, property and unit group; never replace unresolved rows with proxies."
    source_ids: []
  - rule_id: validate_metal_balance
    applies_to: "route"
    rule: "Investigate residual against uncertainty, WIP and unmeasured residues."
    source_ids:
      - eu-jrc-fabricated-metal-products-2020
  - rule_id: validate_energy_emissions
    applies_to: "energy/CO2"
    rule: "Separate electricity/gas, verify conversion and ensure direct CO2 excludes upstream electricity."
    source_ids: []
  - rule_id: validate_waste_basis
    applies_to: "wastes"
    rule: "Verify destination, wet/dry basis, density/solids conversion and no wastewater/sludge/emission double count."
    source_ids:
      - us-epa-mpm-2003
  - rule_id: validate_source_period
    applies_to: "package"
    rule: "Confirm sources, period, coverage, calibration, gaps and absence of unsupported external ranges."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "Foreground factory-gate production dataset for later review as secondary_dataset or background_dataset"
  downstream_use: "CPC 42915 product systems with matching material, finish, technology, geography and packaging"
  allowed_use: "Cradle-to-gate and supply-chain models; comparisons only after function, performance, life and set configuration are equivalent"
  excluded_use: "Unlike functions/set contents; powered equipment; use-stage claims; other cutlery categories; use without unresolved-flow treatment"
  required_metadata: "PCR/version; product/set; net mass; alloy/composition; dimensions; performance; finish; site/geography; technology; period; packaging; outsourced work; allocation; UUID status"
  required_quality_disclosure: "Primary-data share; calibration; temporal/site coverage; supplier representativeness; balance residual; waste basis/destination; emission method; gaps/uncertainty"
  update_trigger: "Material/product/set, technology, heat source, chemistry, site, packaging, allocation, supplier data or waste-treatment change; or more than three years since reference period"
