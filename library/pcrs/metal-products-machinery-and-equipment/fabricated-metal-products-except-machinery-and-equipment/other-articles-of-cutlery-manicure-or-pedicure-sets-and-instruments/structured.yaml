allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared operations"
    rule: "Subdivide and use product-code meters/batch records so only attributable exchanges are assigned."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_physical_driver
    applies_to: "remaining shared operations"
    rule: "Use a documented causal physical driver such as metered energy, treatment time or processed mass; validate it and retain sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_other_relationship
    applies_to: "no defensible physical driver"
    rule: "Use another relationship, including economic value only last, and disclose rejected alternatives, data and sensitivity."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_scrap_boundary
    applies_to: "scrap/residues"
    rule: "Report factory-gate waste outputs without avoided-production credit; apply any downstream recycling model once and disclose it."
    source_ids:
      - eu-pef-method-2021
