allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared production and finishing lines"
    rule: "Prefer sub-metering, batch records, and physical subdivision. Do not allocate a site's unrelated production to the declared product."
    source_ids: []
  - rule_id: allocation_shared_utilities
    applies_to: "utilities serving multiple products"
    rule: "Allocate only residual shared utility use with a documented causal driver such as machine time, treated area, oven occupancy, or accepted mass; report the driver and share."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "aluminium and steel scrap outputs"
    rule: "Record gross scrap mass and destination as waste outputs. Do not subtract an avoided-burden credit from foreground inputs; any recycling benefit or load belongs to the explicitly declared downstream model."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework and rejected products"
    rule: "Include rework energy and materials in the batch that generated them; return internally recycled material only once and retain a mass-balance record preventing double counting."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_bom
      process_id: "integrated_fabrication_assembly"
      flow_role: "metal profiles, glazing, gaskets, and additional atomic BOM inputs"
      record_type: "purchase receipts, issue/return records, BOM, stock counts, reject logs"
      raw_fields: "material identity; supplier; alloy/composition; opening stock; receipts; issues; returns; closing stock; accepted and rejected product assignment"
      collection_method: "Reconcile purchasing and stores ledgers to product-level BOM and production orders"
      unit: "kg"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "representative reporting period, normally at least 12 consecutive months"
      site_scope: "all lines and stores serving the declared product"
      aggregation_rule: "(opening + receipts - returns - closing) divided by accepted reference-product mass"
      quality_evidence: "calibrated scales; supplier certificates; inventory reconciliation; product BOM revision"
    - protocol_id: cp_energy_gases
      process_id: "both_processes"
      flow_role: "electricity, natural gas, and industrial oxygen"
      record_type: "sub-meters, invoices, run-time logs"
      raw_fields: "meter start/end; invoice quantity; reference conditions; line; machine hours; oven occupancy; accepted output"
      collection_method: "Prefer sub-metering; reconcile to site invoice and allocate only residual shared use by a causal driver"
      unit: "MJ for electricity; m3 for gases"
      frequency: "continuous or per batch; monthly reconciliation"
      temporal_coverage: "same period as production"
      site_scope: "all meters and equipment serving the declared boundary"
      aggregation_rule: "eligible measured quantity divided by accepted product mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; grid and fuel metadata"
    - protocol_id: cp_water_records
      process_id: "surface_finishing"
      flow_role: "process water"
      record_type: "water sub-meter, tank make-up, discharge records"
      raw_fields: "meter readings; bath additions; rinse flow; density if converted; production assignment"
      collection_method: "Sub-meter the finishing line or reconcile tank and site water balances"
      unit: "kg and original m3"
      frequency: "continuous or daily; monthly reconciliation"
      temporal_coverage: "same period as finishing production"
      site_scope: "finishing and associated on-site treatment only"
      aggregation_rule: "net eligible water input divided by accepted product mass"
      quality_evidence: "meter calibration; balance closure; exclusion of sanitary water"
    - protocol_id: cp_finishing_chemicals
      process_id: "surface_finishing"
