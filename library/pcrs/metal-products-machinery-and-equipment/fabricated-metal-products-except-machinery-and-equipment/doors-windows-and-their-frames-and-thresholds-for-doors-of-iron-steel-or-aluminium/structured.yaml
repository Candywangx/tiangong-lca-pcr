validation_rules:
  - rule_id: validation_reference
    applies_to: "reference flow"
    rule: "Confirm that the quantitative reference is exactly 1 kg net accepted product and that the selected product UUID, mass property, unit group, and factory-gate state agree."
    source_ids: []
  - rule_id: validation_configuration
    applies_to: "product identity"
    rule: "Reject a dataset missing product form, alloy/grade, dimensions, surface finish, glazing/seal/hardware configuration, intended performance specification, site, geography, or reporting period."
    source_ids:
      - epd-international-windows-doors-cpcr-2026
  - rule_id: validation_boundary
    applies_to: "system boundary"
    rule: "Confirm inclusion of all on-site fabrication, assembly, finishing, rework, waste treatment, and direct-emission operations that occurred; confirm that excluded life-cycle stages are not silently included."
    source_ids:
      - eu-jrc-stm-bref-2006
  - rule_id: validation_atomicity
    applies_to: "inventory"
    rule: "Reject collective rows for metals, components, utilities, fuels, chemicals, packaging, wastes, wastewater, or emissions; each exchange shall have one concrete identity and one property/unit."
    source_ids: []
  - rule_id: validation_conditional
    applies_to: "conditional rows"
    rule: "For every conditional row, require measured/calculated data when the route applies and a documented not-applicable statement when it does not."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "production period"
    rule: "Require an investigated material balance linking received inputs, stock change, accepted output, rework, scrap, sludge, wastewater solids, and other losses; do not accept unexplained double counting or recycling credit."
    source_ids: []
  - rule_id: validation_uuid
    applies_to: "UUID-bearing rows"
    rule: "Confirm every selected UUID by public state-code-100 identity, compatible flow type, classification, property, unit group, product state, geography/technology qualifiers, and general comment; keep unresolved rows blank."
    source_ids: []
  - rule_id: validation_ranges
    applies_to: "QA ranges"
    rule: "Do not infer an external range from one source or incompatible cases. Until two independent, boundary-compatible original sources exist, require foreground collection and retain the manifest range-evidence need."
    source_ids: []
published_dataset_profile:
  dataset_role: "Product-specific or production-weighted secondary_dataset/background_dataset for the declared factory-gate configuration"
  downstream_use: "Foreground process and lifecyclemodel construction for building-product manufacture where the exact material, configuration, geography, technology, and factory-gate boundary are compatible"
  allowed_use: "Cradle-to-gate comparison or downstream modelling after checking alloy/grade, recycled content, dimensions, finish route, glazing/hardware composition, performance declaration, site, geography, period, and allocation"
  excluded_use: "Installed door/window service, use-stage energy performance, maintenance, replacement, end-of-life, curtain-wall systems, vehicle closures, or another material/configuration without explicit extension"
  required_metadata: "PCR id and version; product UUID; product form; product code; alloy/grade and recycled content when known; net mass and dimensions; finish and treated area; glazing, seals, thermal breaks, and hardware; performance specification; site and geography; reporting period; allocation; upstream datasets; unresolved UUIDs"
  required_quality_disclosure: "Data coverage and completeness; meter and scale quality; supplier representativeness; mass-balance closure; rework and rejects; scrap destinations; wastewater/sludge composition and treatment; direct-emission method; all proxies and exclusions"
  update_trigger: "Change in alloy/grade or recycled content, BOM or product form, glazing/thermal-break/hardware system, finish route, supplier geography or technology, factory/site, energy mix, waste treatment, allocation, performance specification, or reporting period"
