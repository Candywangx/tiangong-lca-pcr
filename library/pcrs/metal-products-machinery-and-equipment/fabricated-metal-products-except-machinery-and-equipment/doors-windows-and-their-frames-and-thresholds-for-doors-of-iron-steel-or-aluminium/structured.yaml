system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased metal profiles or formed sections, integral components, energy carriers, and process chemicals enter the manufacturing site. It includes cutting, drilling, punching, forming, machining, joining, in-process movement, conditional surface preparation and finishing, curing or drying, glazing and hardware assembly, final inspection, rework, on-site waste segregation, and on-site treatment before wastes or emissions cross the site boundary. Upstream production of purchased inputs is represented by linked supplier-specific or appropriate background datasets. The boundary ends at the factory gate for the accepted, uninstalled, unpackaged product."
      source_ids: []
    - rule_id: boundary_factory_gate
      applies_to: "all datasets"
      rule: "Include all on-site manufacturing operations from receipt of purchased inputs through accepted-product inspection; exclude installation, use, and end-of-life unless a separately declared extended system is created."
      source_ids:
        - epd-international-windows-doors-cpcr-2026
    - rule_id: boundary_product_scope
      applies_to: "product identity"
      rule: "Keep door, window, frame-only, and threshold-only configurations within the iron/steel/aluminium product boundary and disclose the exact represented configuration."
      source_ids:
        - un-cpc-3-0-structure-2025
    - rule_id: boundary_surface_treatment
      applies_to: "conditional surface finishing"
      rule: "Include aqueous pretreatment, coating or anodizing operations, rinsing, drying/curing, wastewater treatment, sludge, and direct emissions whenever performed on site; otherwise link the purchased prefinished profile or outsourced-treatment dataset."
      source_ids:
        - eu-jrc-stm-bref-2006
    - rule_id: boundary_additional_components
      applies_to: "product-specific bill of materials"
      rule: "Record every additional material or component crossing the foreground boundary as its own atomic exchange; do not substitute a collective hardware, packaging, chemical, or materials row."
      source_ids: []
