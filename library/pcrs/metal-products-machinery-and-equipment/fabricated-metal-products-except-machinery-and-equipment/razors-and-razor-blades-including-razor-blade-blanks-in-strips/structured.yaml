allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "separately metered products, lines, and campaigns"
    rule: "Prefer subdivision and direct measurement by product form and campaign before allocating shared inputs or wastes."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "inseparable shared electricity, water, cleaning, ventilation, and waste handling"
    rule: "Allocate using a documented physical driver that reflects causality, such as machine time, metered sub-load, treated surface area, bath loading, or measured mass throughput; do not default to revenue."
    source_ids: []
  - rule_id: allocation_internal_recycling
    applies_to: "steel scrap and polypropylene regrind returned within the same foreground system"
    rule: "Treat verified internal reuse as an internal loop and avoid double-counting it as both an output waste and a new input. Report losses and any material leaving the boundary."
    source_ids: []
  - rule_id: allocation_external_recovery
    applies_to: "scrap or waste leaving for recycling or recovery"
    rule: "Report the waste flow and destination at the factory gate without avoided-burden credit inside this gate-to-gate dataset; any downstream credit belongs to an explicitly declared expanded model."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_blade_steel_strip
      process_id: "razor_product_manufacturing"
      flow_role: "Blade-grade stainless-steel strip"
      record_type: "receiving, issue, and return record"
      raw_fields: "lot id; supplier; alloy grade; strip thickness; received mass; issued mass; returned mass; recycled content"
      collection_method: "calibrated scale and inventory reconciliation"
      unit: "kg"
      frequency: "per lot and campaign"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "all included lines at the declared site"
      aggregation_rule: "sum issued mass minus unchanged returned mass and normalize to released output"
      quality_evidence: "scale calibration; supplier certificate; lot traceability; inventory reconciliation"
    - protocol_id: cp_manufacturing_electricity
      process_id: "razor_product_manufacturing"
      flow_role: "Manufacturing electricity"
      record_type: "meter record"
      raw_fields: "meter id; start and end readings; kWh; covered equipment; allocation driver; downtime"
      collection_method: "revenue-grade site or submeter"
      unit: "kWh and MJ"
      frequency: "per billing interval and campaign where available"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "all included equipment and auxiliaries"
      aggregation_rule: "subtract excluded loads, allocate shared load by approved physical driver, convert kWh × 3.6, normalize to released output"
      quality_evidence: "meter calibration; one-line diagram; reconciliation to utility invoice"
    - protocol_id: cp_process_water
      process_id: "razor_product_manufacturing"
      flow_role: "Process water"
      record_type: "meter and water-balance record"
      raw_fields: "source; meter id; make-up volume or mass; recycle volume; discharge volume; density if converted"
      collection_method: "calibrated water meter or tank mass balance"
      unit: "kg"
      frequency: "per meter interval or campaign"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "all included water-using operations"
      aggregation_rule: "count boundary make-up once, reconcile intake, recycle, losses and outputs, normalize to released output"
      quality_evidence: "meter calibration; water mass balance; treatment log"
    - protocol_id: cp_sodium_hydroxide
      process_id: "razor_product_manufacturing"
      flow_role: "Sodium hydroxide active substance"
      record_type: "chemical batch and concentration record"
      raw_fields: "batch id; solution mass; NaOH mass fraction; bath make-up; inventory change; disposal"
      collection_method: "calibrated scale plus certificate or verified titration"
      unit: "kg active NaOH"
      frequency: "per batch"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "included alkaline cleaning baths"
      aggregation_rule: "sum solution mass × batch concentration, adjust for inventory change, normalize to released output"
      quality_evidence: "scale calibration; certificate of analysis or titration; bath log"
    - protocol_id: cp_ptfe_resin
      process_id: "razor_product_manufacturing"
      flow_role: "PTFE resin for edge coating"
      record_type: "coating batch record"
      raw_fields: "batch id; dispersion mass; PTFE solids fraction; recovered coating; inventory change; coated product mass"
      collection_method: "calibrated scale plus formulation or certificate"
      unit: "kg dry PTFE"
      frequency: "per coating batch"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "included PTFE coating line"
      aggregation_rule: "sum dispersion mass × verified solids fraction, subtract recovered unchanged material, normalize to released output"
      quality_evidence: "scale calibration; formulation; certificate of analysis; batch log"
    - protocol_id: cp_polypropylene
      process_id: "razor_product_manufacturing"
      flow_role: "Polypropylene for razor housing"
      record_type: "resin issue and regrind record"
      raw_fields: "lot id; resin grade; virgin mass; external recycled resin mass; internal regrind charged; returned stock; housing output"
      collection_method: "calibrated hopper or platform scale"
      unit: "kg"
      frequency: "per moulding batch"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "included polypropylene moulding lines"
      aggregation_rule: "sum externally supplied resin consumed; disclose but do not double-count internal regrind; normalize to released output"
      quality_evidence: "scale calibration; supplier certificate; batch genealogy"
    - protocol_id: cp_reference_product_output
      process_id: "razor_product_manufacturing"
      flow_role: "Net saleable reference product"
      record_type: "final release and mass record"
      raw_fields: "product code; product form; blade count; alloy; coating; housing material; gross mass; packaging tare; rejected mass; released mass"
      collection_method: "calibrated scale linked to lot-release record"
      unit: "kg"
      frequency: "per released lot"
      temporal_coverage: "declared representative production period covering complete campaigns"
      site_scope: "all included final inspection and release points"
      aggregation_rule: "sum released net unpackaged mass and normalize all exchanges to 1 kg"
      quality_evidence: "scale calibration; release authorization; tare verification; mass reconciliation"
    - protocol_id: cp_postindustrial_steel_scrap
      process_id: "razor_product_manufacturing"
      flow_role: "Post-industrial steel scrap"
      record_type: "scrap container and dispatch record"
      raw_fields: "container id; alloy where known; gross mass; tare; internal reuse; destination; date"
      collection_method: "calibrated floor or dispatch scale"
      unit: "kg"
      frequency: "per container or dispatch"
      temporal_coverage: "same period as product output"
      site_scope: "all included forming, trimming, and rejection points"
      aggregation_rule: "sum net scrap leaving the boundary, exclude internal reuse, normalize to released output"
      quality_evidence: "scale calibration; dispatch ticket; material segregation record"
    - protocol_id: cp_cleaning_wastewater
      process_id: "razor_product_manufacturing"
      flow_role: "Cleaning wastewater"
      record_type: "effluent meter and treatment record"
      raw_fields: "source operation; volume or mass; density; pH; metals; oil; treatment status; destination"
      collection_method: "calibrated meter or tank mass balance with representative sampling"
      unit: "kg"
      frequency: "continuous or per discharge batch"
      temporal_coverage: "same period as product output"
      site_scope: "all included cleaning and rinsing operations"
      aggregation_rule: "sum effluent leaving the boundary, exclude internal recycle, convert volume only with documented density, normalize to released output"
      quality_evidence: "meter calibration; sample chain of custody; laboratory result; water balance"
    - protocol_id: cp_grinding_dust
      process_id: "razor_product_manufacturing"
      flow_role: "Captured grinding dust"
      record_type: "dust collector clean-out record"
      raw_fields: "collector id; gross mass; tare; moisture; metal content; abrasive content; destination"
      collection_method: "calibrated scale at each clean-out"
      unit: "kg dry mass"
      frequency: "per clean-out"
      temporal_coverage: "same period as product output"
      site_scope: "all included dry grinding and filtration systems"
      aggregation_rule: "sum dry net dust leaving the boundary and normalize to released output"
      quality_evidence: "scale calibration; collector log; waste characterization; dispatch ticket"
    - protocol_id: cp_polypropylene_waste
      process_id: "razor_product_manufacturing"
      flow_role: "Polypropylene moulding waste"
      record_type: "scrap and regrind record"
      raw_fields: "batch id; runners; sprues; purge; rejects; internal regrind; mass leaving; destination"
      collection_method: "calibrated scale and batch reconciliation"
      unit: "kg"
      frequency: "per moulding batch"
      temporal_coverage: "same period as product output"
      site_scope: "included polypropylene moulding lines"
      aggregation_rule: "sum polypropylene waste leaving the boundary after internal regrind, normalize to released output"
      quality_evidence: "scale calibration; batch record; waste dispatch ticket"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = period exchange amount / period net released unpackaged product mass × 1 kg"
      inputs:
        - "exchange records"
        - cp_reference_product_output
      output: "exchange amount per 1 kg reference product"
      source_ids: []
    - id: convert_electricity_kwh
      applies_to: "manufacturing electricity"
      rule: "electricity MJ = metered kWh × 3.6 MJ/kWh"
      inputs:
        - cp_manufacturing_electricity
      output: "MJ electricity"
      source_ids: []
    - id: calculate_active_mass
      applies_to: "sodium hydroxide and PTFE resin"
      rule: "active mass = as-received solution or dispersion mass × verified batch mass fraction"
      inputs:
        - cp_sodium_hydroxide
        - cp_ptfe_resin
      output: "kg active NaOH or dry PTFE"
      source_ids: []
    - id: reconcile_material_mass
