      process_id: "closure_manufacturing"
      flow_role: "metal stock and forming lubricant inputs"
      record_type: "purchase receipts, stock issues and returns"
      raw_fields: "material identity; supplier; batch; substrate/grade; thickness; coating state; opening stock; receipts; issued mass; returned mass; closing stock"
      collection_method: "Reconcile ERP/warehouse records to production campaign and physical inventory"
      unit: "kg"
      frequency: "Per receipt and campaign; aggregate monthly"
      temporal_coverage: "At least 12 consecutive representative months or full campaign for seasonal/custom production"
      site_scope: "All facilities and lines represented by the dataset"
      aggregation_rule: "Net consumed mass = opening stock + receipts − closing stock − verified return; allocate shared consumption under section 7"
      quality_evidence: "Supplier specification, weighbridge/scale calibration, stock reconciliation and exception log"
    - protocol_id: cp_energy_meters
      process_id: "closure_manufacturing"
      flow_role: "purchased electricity"
      record_type: "interval or submeter readings"
      raw_fields: "meter id; start/end reading; multiplier; kWh; line state; downtime; production mass; grid/voltage"
      collection_method: "Read calibrated meters and reconcile with invoice totals"
      unit: "kWh and MJ"
      frequency: "At least monthly; campaign submetering preferred"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included presses and finishing auxiliaries"
      aggregation_rule: "Subtract documented non-production loads; convert kWh to MJ; normalize to conforming output"
      quality_evidence: "Meter calibration, invoice reconciliation and allocation worksheet"
    - protocol_id: cp_fuel_records
      process_id: "closure_manufacturing"
      flow_role: "direct natural gas"
      record_type: "meter and invoice records"
      raw_fields: "meter id; gas volume; pressure; temperature; wet/dry basis; net calorific value; production mass"
      collection_method: "Reconcile site meter to supplier invoice and attributable equipment runtime"
      unit: "m3 and MJ"
      frequency: "At least monthly"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included direct-fired equipment and controls"
      aggregation_rule: "Correct to stated reference conditions and normalize to conforming output"
      quality_evidence: "Meter calibration, invoice and supplier gas specification"
    - protocol_id: cp_water_and_chemicals
      process_id: "closure_manufacturing"
      flow_role: "process water and sodium hydroxide"
      record_type: "water meter, dosing and bath records"
      raw_fields: "water meter readings; bath volume; make-up volume; sodium-hydroxide product mass; concentration; purge; recirculation; production mass"
      collection_method: "Meter make-up/rinse water and reconcile chemical dosing to inventory"
      unit: "kg"
      frequency: "Per bath make-up and at least monthly"
      temporal_coverage: "Same representative period as product output"
      site_scope: "All included cleaning and rinse stages"
      aggregation_rule: "Count boundary-crossing make-up once; calculate active NaOH mass from product mass and concentration"
      quality_evidence: "Meter calibration, concentration test, dosing record and bath log"
    - protocol_id: cp_coating_ink_liner_records
      process_id: "closure_manufacturing"
      flow_role: "coating, ink and liner materials"
      record_type: "batch sheet and stock balance"
      raw_fields: "formulation id; colour; solids; volatile fraction; opening/closing stock; receipts; returns; applied mass; recovered mass; product mass"
      collection_method: "Reconcile batch and warehouse records for each concrete formulation"
      unit: "kg"
      frequency: "Per batch; aggregate by declared product"
      temporal_coverage: "Same representative period as product output"
      site_scope: "Each included coating, printing and lining station"
      aggregation_rule: "Calculate net as-supplied consumption separately for each formulation; prevent double counting of purchased compound and its upstream ingredients"
      quality_evidence: "Supplier SDS/specification, batch record, scale calibration and stock reconciliation"
    - protocol_id: cp_product_and_waste_mass
      process_id: "closure_manufacturing"
      flow_role: "conforming product, metal scrap, wastewater and waste oil"
      record_type: "production, quality, weighbridge and waste-transfer records"
      raw_fields: "gross/net product mass; piece count; sample mass; rejects; scrap composition; wastewater mass; waste-oil mass; destination; transfer date"
      collection_method: "Weigh outputs at defined transfer points and reconcile with production records"
      unit: "kg"
      frequency: "Per batch or transfer; aggregate monthly"
      temporal_coverage: "Same representative period as inputs"
      site_scope: "All included lines and output destinations"
      aggregation_rule: "Normalize each output to 1,000 kg conforming product; retain separate steel, aluminium, wastewater and oil streams"
      quality_evidence: "Scale calibration, quality release, waste manifest and mass-balance reconciliation"
    - protocol_id: cp_direct_air_emissions
      process_id: "closure_manufacturing"
      flow_role: "direct fossil CO2 and mixed-isomer xylene"
      record_type: "stack test, continuous monitor, solvent balance and fuel calculation"
      raw_fields: "pollutant; emission point; measured concentration/flow; test period; formulation xylene content; capture/destruction/recovery; gas composition; oxidation factor; production mass"
      collection_method: "Use direct measurement where representative; otherwise documented fuel or solvent mass balance"
      unit: "kg"
      frequency: "Per compliance test and monthly balance; update after material/control change"
      temporal_coverage: "Representative operating period aligned with product output"
      site_scope: "All stacks and fugitive sources attributable to included operations"
      aggregation_rule: "Sum controlled stack and fugitive releases without upstream electricity/fuel emissions; normalize to product mass"
      quality_evidence: "Laboratory accreditation, test method, control-efficiency evidence, supplier composition and calculation audit"
  calculation_rules:
    - id: calc_normalized_exchange
      applies_to: "every non-reference inventory row"
      rule: "normalized amount = period exchange × 1,000 / period conforming closure mass"
      inputs:
        - "period exchange"
        - "conforming product mass"
      output: "exchange per 1,000 kg reference product"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_piece_mass
      applies_to: "count-based product records"
      rule: "product mass = accepted piece count × campaign-specific sampled mean mass per closure"
      inputs:
        - "accepted count"
        - "sampled mean mass"
      output: "kg conforming product"
      source_ids:
        - customs-union-tr-cu-005-2011
    - id: calc_active_naoh
      applies_to: "sodium-hydroxide input"
      rule: "active NaOH mass = as-supplied solution mass × measured or supplier-certified NaOH mass fraction"
      inputs:
        - "solution mass"
        - "NaOH mass fraction"
      output: "kg active NaOH"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "fossil CO2 from natural gas"
      rule: "Use direct measured fossil CO2; otherwise calculate from metered gas, supplier carbon content or validated emission factor, oxidation fraction and molecular-mass conversion, documenting every factor and reference condition"
      inputs:
        - "gas volume"
        - "reference conditions"
        - "composition/factor"
        - "oxidation fraction"
      output: "kg fossil CO2"
      source_ids: []
    - id: calc_xylene_mixed_isomers
      applies_to: "mixed-isomer xylene to air"
      rule: "mixed-isomer xylene input in coating/ink/cleaner − xylene retained in product − recovered xylene − xylene transferred in wastes − xylene destroyed by control = mixed-isomer xylene released to air; include separately measured fugitives consistently"
      inputs:
        - "formulation records"
        - "stock balance"
        - "product/waste analyses"
        - "capture and destruction evidence"
      output: "kg mixed-isomer xylene to air"
      source_ids:
        - us-epa-metal-can-coating-background
        - eu-jrc-sts-bref-2007
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Declare closure subtype, substrate, thickness, coating/plating, liner/gasket, print state, dimensions, unit mass, compatibility application and conformity specification."
      evidence: "Product drawing, bill of materials, supplier specifications and quality-release record"
    - id: dq_temporal_representativeness
      applies_to: "all foreground data"
      requirement: "Use at least 12 consecutive representative months unless a full campaign is more representative; explain shutdowns, trials, abnormal production and substitutions."
      evidence: "Period coverage table and exception log"
    - id: dq_technology_geography
      applies_to: "foreground and upstream links"
      requirement: "Describe forming, coating, printing, lining, curing and control technologies and the manufacturing geography; justify all upstream dataset geography/technology matches."
      evidence: "Process map, equipment list and dataset-link register"
    - id: dq_completeness_mass_balance
      applies_to: "material inventory"
      requirement: "Reconcile metal and liner material inputs to conforming product, scrap, retained work-in-progress and other outputs; investigate and disclose unexplained imbalance."
      evidence: "Signed mass-balance worksheet and stock reconciliation"
    - id: dq_route_applicability
      applies_to: "conditional rows"
      requirement: "Mark each conditional flow applicable or not applicable with product and route evidence; zero is not a substitute for a missing applicability decision."
      evidence: "Bill of materials, routing, batch sheet and site interview"
    - id: dq_uncertainty_and_gaps
      applies_to: "calculated and allocated values"
      requirement: "Disclose measurement uncertainty, allocation sensitivity, missing UUIDs, missing external ranges and any proxy upstream dataset."
      evidence: "Uncertainty register, allocation worksheet and data-gap log"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow"
    rule: "Confirm exactly 1,000 kg of conforming finished base-metal closures and verify that dispatch packaging is excluded from that mass."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_identity_and_qualifiers
    applies_to: "product identity"
    rule: "Reject a data package missing any required reference-flow qualifier or mixing materially different substrate, liner or finishing routes without separate quantities."
    source_ids:
      - un-cpc-3-0-2025
      - customs-union-tr-cu-005-2011
  - rule_id: validate_atomic_inventory
    applies_to: "inventory rows"
    rule: "Confirm that every reported exchange is one concrete product, waste or elementary flow and that steel/aluminium scrap, electricity/gas, and distinct liner materials remain separate."
    source_ids: []
  - rule_id: validate_route_and_double_counting
    applies_to: "conditional operations"
    rule: "Confirm that purchased pre-coated or pre-printed stock does not duplicate on-site coating or printing burdens and that purchased PVC compound is not double-counted with its upstream resin ingredients."
    source_ids:
      - eu-jrc-sts-bref-2007
      - us-epa-metal-can-coating-background
  - rule_id: validate_mass_and_energy
    applies_to: "foreground balances"
    rule: "Reperform piece-to-mass, material-balance, kWh-to-MJ, gas-condition and normalization calculations from retained raw records."
    source_ids: []
  - rule_id: validate_emission_scope
    applies_to: "direct emissions"
    rule: "Confirm that fossil CO2 includes only on-site fossil combustion and that mixed-isomer xylene is reported only when formulation chemistry and environmental compartment match; do not include upstream electricity or fuel-supply emissions."
    source_ids:
      - us-epa-metal-can-coating-background
  - rule_id: validate_product_performance_metadata
    applies_to: "declared conformity"
    rule: "Confirm that applicable sealing, torque, pressure, corrosion, coating/liner resistance and food-contact test requirements are identified; this PCR does not invent universal pass limits."
    source_ids:
      - customs-union-tr-cu-005-2011
published_dataset_profile:
  dataset_role: "Foreground product-manufacturing dataset for one declared base-metal closure product or homogeneous product family"
  downstream_use: "secondary_dataset; background_dataset after review of representativeness and unresolved data gaps"
  allowed_use: "Cradle-to-gate product studies, packaging-component inventories, supplier comparisons and downstream models whose closure specification and system boundary match"
  excluded_use: "Complete container, filling or packaged-product claims; non-metal closure bodies; post-gate use/end-of-life claims; comparative assertions across unmatched closure functions, substrates, liners or performance specifications"
  required_metadata: "PCR id/version; product and required qualifiers; site geography; technology; reference period; ownership; foreground/background dataset links; allocation; cut-offs; data gaps; uncertainty; review status"
  required_quality_disclosure: "Meter and scale coverage; mass-balance result; route applicability; supplier-data quality; allocation sensitivity; control efficiency; unresolved UUID and range-evidence needs; deviations from this PCR"
  update_trigger: "Material, coating, ink or liner formulation change; substrate/thickness change; new forming/curing/control technology; facility or grid change; allocation change; performance specification change; data older than the intended representativeness period"
