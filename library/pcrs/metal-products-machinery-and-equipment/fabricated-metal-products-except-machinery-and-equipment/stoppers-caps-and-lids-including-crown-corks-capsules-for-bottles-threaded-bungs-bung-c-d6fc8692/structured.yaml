allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared lines and utilities"
    rule: "First subdivide meters, material issues, operating hours or equipment records so only exchanges attributable to the declared closures are included."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_then_other
    applies_to: "unavoidable multifunctionality"
    rule: "If subdivision or system expansion is not feasible, use a demonstrated relevant physical relationship; use another relationship only when physical allocation is not defensible, and disclose the rejected options, formula, factors and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_scrap_no_automatic_credit
    applies_to: "steel and aluminium scrap"
    rule: "Report scrap mass, composition, treatment destination and any revenue separately. Do not assign an avoided-primary-metal credit inside this foreground dataset unless the governing study method explicitly requires it."
    source_ids:
      - eu-pef-2021-2279
