system_boundary:
  rules:
    - rule_id: boundary_gate_to_gate_foreground
      applies_to: "foreground closure manufacture"
      rule: "Include all on-site material and energy exchanges from receipt of purchased metal stock through conforming closure output, including rejects, direct emissions and wastes sent to treatment."
      source_ids:
        - ep3663427b1-crown-cap
        - eu-jrc-sts-bref-2007
        - us-epa-metal-can-coating-background
    - rule_id: boundary_conditional_finishing
      applies_to: "purchased pre-finished stock"
      rule: "Include on-site cleaning, coating, printing and lining only when performed at the reporting site; otherwise require supplier datasets that include those operations and prevent double counting."
      source_ids:
        - eu-jrc-sts-bref-2007
        - us-epa-metal-can-coating-background
    - rule_id: boundary_packaging_exclusion
      applies_to: "filling, distribution, use and end-of-life"
      rule: "Exclude filling with packaged contents and all post-factory-gate stages unless the study goal explicitly expands the system boundary; disclose any expansion separately."
      source_ids:
        - eu-pef-2021-2279
    - rule_id: boundary_no_hidden_cutoff
      applies_to: "foreground completeness"
      rule: "Do not omit a material, energy, waste or elementary exchange solely because its mass is small; document measured zero, not applicable status, or an explicit data gap."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Purchased base-metal sheet, strip, or pre-finished stock enters the closure-manufacturing site; its substrate grade, thickness, coating/printing state and supplier gate are declared"
  starting_condition_role: "Foreground manufacturing gate for conversion of purchased semi-finished metal into closures"
  product_classification_scope: "Base-metal closure accessories represented by the reviewed semantic boundary; CPC 42932 is classification context, not canonical identity ownership"
  recursive_input_rule: "If a purchased input is itself a finished base-metal closure within this category, record it once as a supplied product with an upstream dataset and exclude its already-completed manufacturing steps from the foreground process"
  upstream_dataset_requirement: "Every purchased metal, polymer, chemical, coating, ink, electricity, fuel and treatment service must link to a geographically and technologically representative upstream dataset or remain an explicit data gap"
  disclosure: "Declare which forming, preparation, coating, printing, lining, curing, inspection and on-site treatment operations occur; identify purchased pre-coated/pre-printed stock and any excluded shared operations"
