allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared_operations"
    rule: "Avoid allocation by sub-metering, lot tracking, machine-hour records, and separate mass records for the declared part wherever practicable."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "unavoidable_shared_burdens"
    rule: "When subdivision is not practicable, allocate shared material and utility burdens using the most causally representative measured driver; use net product mass only when no better physical driver is available, and disclose the choice and sensitivity."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "steel_scrap"
    rule: "Record post-industrial steel scrap as a waste output with its measured mass and destination. Do not apply avoided-burden or substitution credit inside this foreground process unless the downstream study explicitly models and discloses that convention."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "rework_and_rejects"
    rule: "Attribute internal rework inputs and unrecovered rejects to the conforming output of the same lot; separately record scrap or other outputs that cross the site boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_bom
      process_id: "integrated_part_manufacturing"
      flow_role: "Plate, tubing, welding wire, and cleaning chemical inputs"
      record_type: "Purchase, warehouse issue, return, and bill-of-material records"
      raw_fields: "material identity; grade; lot; opening stock; receipts; issues; returns; closing stock; mass; supplier; origin"
      collection_method: "Reconcile lot-specific warehouse and production records to the released output lot"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Same reporting period as output"
      site_scope: "All in-boundary production areas at the declared site"
      aggregation_rule: "Sum net issues after documented returns; exclude material assigned to other products"
      quality_evidence: "Calibrated scales; traceable material certificates; stock reconciliation; approved bill of materials"
    - protocol_id: cp_utility_records
      process_id: "integrated_part_manufacturing"
      flow_role: "Electricity, natural gas, diesel, oxygen, and process-water inputs"
      record_type: "Meters, invoices, delivery tickets, tank issues, and test logs"
      raw_fields: "meter start and end; delivered quantity; unit; reference conditions; equipment; operating hours; allocation driver"
      collection_method: "Read dedicated meters or reconcile shared meters and delivery records to lot activity"
      unit: "MJ; m3; kg"
      frequency: "Meter interval and each lot"
      temporal_coverage: "Representative continuous period covering the production lots"
      site_scope: "Declared manufacturing site"
      aggregation_rule: "Subtract verified non-production and other-product use, then allocate remaining shared use by documented causal driver"
      quality_evidence: "Meter calibration; invoice reconciliation; reference-condition record; allocation worksheet"
    - protocol_id: cp_output_records
      process_id: "integrated_part_manufacturing"
      flow_role: "Conforming finished output"
      record_type: "Release, weighing, drawing, material, inspection, and test records"
      raw_fields: "part number; parent equipment; net mass; quantity; material; coating state; heat-treatment state; inspection status; release date"
      collection_method: "Link calibrated weighing records to accepted production-lot release records"
      unit: "kg"
      frequency: "Each production lot"
      temporal_coverage: "Full reporting period"
      site_scope: "Declared manufacturing site"
      aggregation_rule: "Sum accepted net mass; exclude rejected, reworked-not-released, packaging, and fixtures"
      quality_evidence: "Scale calibration; inspection release; approved drawing; material traceability; test acceptance record"
    - protocol_id: cp_waste_records
      process_id: "integrated_part_manufacturing"
      flow_role: "Post-industrial steel scrap output"
      record_type: "Scrap-container weights and dispatch records"
      raw_fields: "waste identity; alloy family; gross and tare mass; contamination; receiver; destination; date"
      collection_method: "Weigh each dispatch or container and assign by lot-specific collection or documented production allocation"
      unit: "kg"
      frequency: "Each dispatch and production lot"
      temporal_coverage: "Same reporting period as output"
      site_scope: "All in-boundary production areas"
      aggregation_rule: "Sum net dispatch mass by waste identity and destination without subtracting recycling credit"
      quality_evidence: "Calibrated scale; tare record; dispatch ticket; receiver documentation"
    - protocol_id: cp_emission_records
      process_id: "integrated_part_manufacturing"
      flow_role: "Direct fossil carbon dioxide to air"
      record_type: "Stack measurements or fuel-carbon calculation records"
      raw_fields: "fuel mass or volume; reference conditions; fossil carbon content; oxidation basis; measured CO2; operating period; equipment"
      collection_method: "Use calibrated stack data where available; otherwise calculate from collected fuel use and documented site-specific carbon and oxidation inputs"
      unit: "kg"
      frequency: "Each monitored event or reporting interval"
      temporal_coverage: "Same representative period as fuel and output"
      site_scope: "In-boundary combustion equipment"
      aggregation_rule: "Sum direct fossil CO2 and normalize by conforming output; keep electricity-chain emissions outside this row"
      quality_evidence: "Monitor calibration or fuel certificate; calculation sheet; reconciliation to fuel records"
  calculation_rules:
    - id: calc_net_material_input
      applies_to: "Material and consumable rows"
      rule: "Net input = opening stock + receipts - closing stock - documented returns - quantities assigned to other products"
      inputs:
        - "Lot-specific stock and issue records"
      output: "kg input per kg conforming finished output"
      source_ids: []
    - id: calc_electricity_mj
      applies_to: "Electricity row"
      rule: "Electricity (MJ) = purchased electricity (kWh) × 3.6, after documented subtraction and allocation"
      inputs:
        - "Metered kWh"
        - "allocation records"
        - "conforming output mass"
      output: "MJ per kg conforming finished output"
      source_ids: []
    - id: calc_gas_volume
      applies_to: "Natural-gas and oxygen rows"
      rule: "Convert measured volume only when needed to the declared reference temperature, absolute pressure, and moisture basis; retain the raw reading and conversion inputs"
      inputs:
        - "Meter volume"
        - temperature
        - pressure
        - "moisture basis"
        - "compressibility method when used"
      output: "m3 at declared reference condition per kg conforming finished output"
      source_ids: []
    - id: calc_fossil_co2
      applies_to: "Fossil carbon dioxide row"
      rule: "Use direct stack-measured fossil CO2, or calculate CO2 from collected fuel use × documented fossil-carbon content × documented oxidation basis × 44/12"
      inputs:
        - "Fuel record"
        - "carbon content"
        - "oxidation basis"
        - "conforming output mass"
      output: "kg fossil CO2 per kg conforming finished output"
      source_ids: []
    - id: calc_reference_output
      applies_to: "Reference product"
      rule: "Normalized amount = accepted net finished-part mass / accepted net finished-part mass"
      inputs:
        - "Accepted net mass from release records"
      output: "Exactly 1 kg reference product"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product and material rows"
      requirement: "Preserve part number, parent-equipment type, drawing revision, material grade, heat-treatment state, coating state, and inspection status; do not aggregate materially different products without a disclosed production-weighted composition."
      evidence: "Drawing, material certificate, route card, inspection release, aggregation worksheet"
    - id: dq_temporal
      applies_to: "All foreground rows"
      requirement: "Use one representative period covering normal production and all reported output; disclose shutdowns, start-ups, abnormal rework, and incomplete meter intervals."
      evidence: "Production calendar, meter coverage log, exception register"
    - id: dq_completeness
      applies_to: "All foreground exchanges"
      requirement: "Reconcile material input, conforming output, rework, scrap, utility, and direct-emission records; explicitly document each conditionally absent row and every additional specific exchange added for the actual route."
      evidence: "Mass reconciliation, meter reconciliation, waste dispatch log, route declaration"
    - id: dq_measurement
      applies_to: "Measured quantities"
      requirement: "Use calibrated or verified measuring equipment and retain raw readings, units, reference conditions, conversion factors, and allocation calculations."
      evidence: "Calibration certificates, raw logs, invoices, calculation sheets"
    - id: dq_geography_technology
      applies_to: "Upstream links"
      requirement: "Match material grade and production route, utility geography and voltage or pressure, fuel supply state, and waste destination as closely as available; disclose proxies."
      evidence: "Supplier datasets, contracts, technology description, proxy justification"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "product_identity"
    rule: "Confirm that the output is a separately supplied finished part dedicated to equipment in CPC 42320 or 42330 and is not complete equipment, a central-heating-boiler part, a nuclear-reactor part, or a generic commodity metal good."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_rule_2
    applies_to: "reference_flow"
    rule: "Confirm exactly 1 kg net conforming output and all required qualifiers; reject a dataset that includes packaging or removable fixture mass in the reference amount."
