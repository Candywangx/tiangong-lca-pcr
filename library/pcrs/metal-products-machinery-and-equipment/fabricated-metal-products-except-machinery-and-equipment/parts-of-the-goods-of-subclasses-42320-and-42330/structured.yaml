system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins when purchased metal stock, welding consumables, process chemicals, and utilities cross the manufacturing-site boundary. It includes on-site cutting, forming, machining, welding or joining, assembly, applicable heat treatment, applicable cleaning or surface preparation, hydrostatic testing when performed, inspection, rework, and factory release. Upstream production is represented by linked supplier or background datasets. Default exclusions are capital equipment, building construction, employee commuting, downstream installation, use, maintenance, and end-of-life."
      source_ids: []
    - rule_id: boundary_rule_1
      applies_to: "foreground_operations"
      rule: "Include every on-site operation that changes the covered part or is required to release it as conforming, including measured rework and testing."
      source_ids: []
    - rule_id: boundary_rule_2
      applies_to: "purchased_inputs"
      rule: "Link upstream production for every purchased input; do not substitute zero burden for recycled-content metal, recovered scrap, or a same-category unfinished part."
      source_ids: []
    - rule_id: boundary_rule_3
      applies_to: "route_exclusions"
      rule: "A conditionally absent heat-treatment, surface-treatment, hydrotest, diesel, gas, oxygen, water, or sodium-hydroxide row may be omitted only when the route declaration and production records demonstrate non-use."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased metal stock, consumables, process chemicals, and utilities as received at the manufacturing-site gate"
  starting_condition_role: "Foreground manufacturing input boundary"
  product_classification_scope: "Dedicated finished parts for equipment in CPC 42320 or CPC 42330; classification does not extend to complete equipment or generic multi-use metal goods"
  recursive_input_rule: "A purchased unfinished or previously fabricated item that itself falls in this product category is recorded as a distinct same-category product input with its supplied state, mass, and upstream dataset; its upstream manufacture is not recreated inside the receiving process"
  upstream_dataset_requirement: "Each purchased material, consumable, fuel, electricity supply, water supply, and same-category input requires a geographically and technologically representative upstream dataset or an explicit data gap"
  disclosure: "Declare starting stock form and grade, purchased-versus-in-house operations, route steps performed, coating and heat-treatment state, rejected or reworked mass, utility delivery conditions, and all default-boundary exclusions used"
