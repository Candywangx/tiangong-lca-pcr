allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared lines"
    rule: "Prefer submetering, batch records, time-resolved equipment data, and physical subdivision so allocation is avoided."
    source_ids: []
  - rule_id: allocation_shared_inputs
    applies_to: "unavoidable shared totals"
    rule: "Allocate by a causal physical driver such as machine-hours, processed metal mass, coated area, oven occupancy, or throughput; disclose any non-physical basis."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "scrap and coating wastes"
    rule: "Report gross input, product, each waste, internal recirculation, and destination separately; do not credit avoided primary production inside this foreground process unless a wider method requires it."
    source_ids: []
  - rule_id: allocation_consistency
    applies_to: "normalization"
    rule: "Apply one documented hierarchy across the period and reconcile allocated site totals before normalization."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_and_packaging
      process_id: "fabrication_finishing_packaging"
      flow_role: "Exact metal, chemical, coating, and package inputs"
      record_type: "Purchase, issue, return, BOM, and package records"
      raw_fields: "identity; supplier; grade or formulation; lot; issued and returned mass; package unit mass"
      collection_method: "Calibrated scales and reconciled stores records"
      unit: "kg"
      frequency: "Per batch; monthly aggregation"
      temporal_coverage: "12 representative months or full shorter campaign"
      site_scope: "All in-scope lines and outsourced steps"
      aggregation_rule: "Sum net issues by atomic flow and route; allocate causally; divide by net accepted mass"
      quality_evidence: "Calibration, supplier specification, stock reconciliation, batch traceability"
    - protocol_id: cp_utility_records
      process_id: "fabrication_finishing_packaging"
      flow_role: "Electricity, process water, and natural gas"
      record_type: "Meter, invoice, and equipment-hour records"
      raw_fields: "meter id; readings; unit; gas reference conditions; hours; downtime; shared loads"
      collection_method: "Read calibrated meters and reconcile invoices"
      unit: "MJ, kg, m3"
      frequency: "Batch or shift; monthly aggregation"
      temporal_coverage: "Same period as production"
      site_scope: "All in-scope utility users"
      aggregation_rule: "Subtract excluded loads; allocate causally; normalize"
      quality_evidence: "Calibration, invoices, boundary diagram, allocation worksheet"
    - protocol_id: cp_waste_records
      process_id: "fabrication_finishing_packaging"
      flow_role: "Each named waste"
      record_type: "Scale ticket, manifest, tank meter, and recycler receipt"
      raw_fields: "identity; origin; gross and tare; volume and density; date; destination; treatment; recovery"
      collection_method: "Weigh each transfer or use a calibrated meter"
      unit: "kg"
      frequency: "Each transfer; monthly aggregation"
      temporal_coverage: "Same period as production"
      site_scope: "Every storage and discharge point"
      aggregation_rule: "Sum net exported mass by atomic waste and route; normalize"
      quality_evidence: "Calibration, manifests, receipts, mass balance"
    - protocol_id: cp_fuel_co2
      process_id: "fabrication_finishing_packaging"
      flow_role: "Direct fossil CO2"
      record_type: "Gas meter and supplier fuel-quality records"
      raw_fields: "gas volume; temperature; pressure; carbon content or verified factor; oxidation basis"
      collection_method: "Calculate from collected gas and supplier-specific carbon data"
      unit: "kg CO2"
      frequency: "Monthly"
      temporal_coverage: "Same period as gas use"
