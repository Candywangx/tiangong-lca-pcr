allocation_rules:
  - rule_id: direct_attribution
    applies_to: "shared_operations"
    rule: "Use job tickets and submetering before allocation. Where a common meter remains, require a measured causal driver such as machine-hours for the identified operation, with all participating jobs and idle load disclosed; divide the attributable quantity by accepted units of the same configuration before mass normalization."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: coproduct_decision
    applies_to: "saleable_outputs"
    rule: "Do not assume scrap is a co-product. Disclose destination and legal/product status. If multiple saleable co-products actually occur, seek subdivision; justify a physical relation or, when unavailable, documented economic/other allocation with sensitivity. No universal mass share or avoided-steel credit is prescribed."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: rework_scrap
    applies_to: "manufacturing_losses"
    rule: "Retain rework and rejected-unit burdens attributable to the accepted reporting batch. Record recovered internal material once and exported wastes separately. Disclose upstream recycled-content method and any downstream treatment separately to prevent double credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted net mass"
      record_type: "weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each acceptance"
      temporal_coverage: "complete reporting batch"
      site_scope: "same model and configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration, weighing and signed acceptance records"
    - protocol_id: cp_forming
      process_id: "forming"
      flow_role: "Stock cutting, forming and machining"
      record_type: "meter_and_issue_records"
      raw_fields: "job and configuration; accepted unit count; each row-specific issued/returned amount and original unit; constituent/grade; meter readings; allocation driver; waste destination; route conditions"
      collection_method: "For each atomic row, use calibrated meters, weighed issue/returns, supplier receipts and disposal tickets. Preserve property: kg for mass, MJ from electricity meters, m3 for directly abstracted groundwater. Purchased-water mass is not converted to volume without measured density and conditions. Reconcile stage utility totals with the factory bill, and component/retained-fluid inclusion with the net-mass record."
      unit: "row-specific kg, MJ, m3"
      frequency: "each job and meter interval"
      temporal_coverage: "complete same-configuration batch in reporting period; disclose seasonality and mixed lines"
      site_scope: "declared factory, outsourced and purchased gates"
      aggregation_rule: "attributable row amount / accepted machines of the same configuration"
      quality_evidence: "calibration, supplier composition, job, allocation and disposal evidence"
    - protocol_id: cp_joining
