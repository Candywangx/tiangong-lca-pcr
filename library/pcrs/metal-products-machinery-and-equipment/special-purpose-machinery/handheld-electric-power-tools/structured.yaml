allocation_rules:
  - rule_id: allocation_direct
    applies_to: "manufacturing"
    rule: "Use direct work-order issues and meters first. Under cp_allocation, partition remaining shared demand by a measured causal driver: molding batch demand and shot mass/cycle; machining/winding machine time with measured power; assembly/test bench demand and actual station time; kit packaging measured product demand or geometric fit. Demonstrate the driver with foreground records and reconcile allocated plus excluded demand to the original total. No assumed fixed burden share."
    source_ids: []
  - rule_id: allocation_variants
    applies_to: "product_mix"
    rule: "Do not allocate all production by machine count when variants have different energy demand or configurations. A fallback mass or economic basis needs documented foreground justification, sensitivity and review; it is not a default imposed by this PCR."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "steel_offcuts"
    rule: "Keep virgin/material inputs and separately measured scrap outputs without an automatic avoided-steel credit. Report scrap price and destination when relevant; any co-product classification or recycling credit requires a separately declared reviewed model to prevent double credit. Clean polymer regrind recirculated internally is not a saleable co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "finished_machine"
      record_type: "measurement"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted configuration and sampled serial with traceable coverage"
      temporal_coverage: "same manufacturing period as activity records"
      site_scope: "accepted complete supply at one declared site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; declared bare/corded body; battery/case exclusions; fitted grease; detachable-part weights; acceptance sign-off"
    - protocol_id: cp_molding
      process_id: "molding"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "resin grade/formulation; issues/returns; drying/injection/cooling kWh; accepted housings; separated trim/regrind"
      collection_method: "Weigh each actual supplied compound and external waste; meter mold/cooling demand; reconcile internal regrind and stock; retain released part and supplier specifications."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "blank alloy/shape; issues/returns; gear/housing part mass; each swarf; cutting-fluid recipe if used; machining kWh; actual outdoor particle monitoring"
      collection_method: "Use part-linked work orders and stock/part/waste balances; meter actual machine and extraction demand; record any actual heat-treatment, cutting-fluid and waste route as additional specific rows."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_motor_build
      process_id: "motor_build"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "wire conductor/enamel/diameter; delivered insulated-wire mass; actual winding turns; stator/rotor boundary; varnish formulation; issues/returns; retained coating; wire/waste fractions; kWh"
      collection_method: "Weigh actual magnet wire and supplied parts, meter winding/balancing/curing and reconcile finished internal motor parts and waste. Do not use database length/mass relations as wire density or double-count a bought-in complete motor."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_electrical
      process_id: "electrical"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "alloy and flux composition; solvent purity; issues/returns; solder joints; captured/recovered solvent; contaminated wipe mass/composition; isopropanol outdoor species kg; kWh"
      collection_method: "Record separate supplied chemicals and net use; meter soldering and extraction. Measure solvent species or close an actual site balance across returned stock, retained liquid in waste, recovered solvent and emitted mass; retain uncertainty and control coverage."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "model/BOM revision; part number/material; motor brushed/brushless AC/DC; supplied assembly boundary; installed count; each part mass; grease formulation/fill; issues/returns; kWh"
      collection_method: "Use configuration-controlled received/issued/returned parts and grease records. Weigh each supplied part, reconcile installed cord/contact, motor/gearbox/controls and mandatory guards/handles; no contained-part duplication."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "serial/configuration; released test plan; duration/mode; drive speed/control response; electrical conformity; pass/fail/rework; bench wall-side kWh; test coupon grade/mass/reuse; steel swarf; bench battery boundary; measured M"
      collection_method: "Retain signed current model tests and acceptance results. Meter actual wall-side bench demand and trace loaded-test media and removed residues; include failed tests/rework. Do not replace tests with rated power times an assumed duration, or count a reusable test battery as a shipped body component."
      unit: "kg; MJ"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "each atomic row in this process"
      record_type: "measurement"
      raw_fields: "PE film mass; board flute/fibre/recycled content; issues/returns; kit shared packaging; dispatched serial"
      collection_method: "Weigh each actual packaging part, exclude it from M and reconcile shipment. Split shared kit packaging using measured product-specific packing demand or a justified measured geometric driver under cp_allocation; disclose method and closure."
      unit: "kg"
      frequency: "each batch/work order; each test; reconcile monthly"
      temporal_coverage: "one complete declared production year or justified shorter complete batch; same period as accepted counts"
      site_scope: "same site and configuration; include outsourced-work boundary explicitly"
      aggregation_rule: "attributable exchange amount / accepted machines"
      quality_evidence: "calibration; supplier specification; stock reconciliation; accepted count; excluded demand; missing-record disclosure"
    - protocol_id: cp_allocation
      process_id: "manufacturing"
      flow_role: "shared_demand"
      record_type: "measurement"
      raw_fields: "total utility; measured power/load; operating time; packaged product dimensions/area; accepted configuration counts; excluded demand"
      collection_method: "Submeter where possible; measure load and causal drivers for shared molding/machining/winding stations and document why the driver represents each shared exchange."
      unit: "MJ; h; m2"
      frequency: "each shared batch and monthly reconciliation"
      temporal_coverage: "same production interval"
      site_scope: "all consuming products and excluded operations at this site"
      aggregation_rule: "partition total by measured causal demand; then aggregate attributable amount / accepted machines"
      quality_evidence: "submeter agreement; total closure; driver uncertainty; sensitivity; approval record"
  calculation_rules:
    - id: normalize_mass
      applies_to: "abs_resin; pa6_gf30; molding_power; abs_trim; steel_blank; al_cast_housing; fabrication_power; steel_offcuts; al_swarf; machining_pm; winding_wire; stator_stack; winding_varnish; motor_build_power; winding_offcuts; solder_wire; rosin_flux; ipa_cleaner; electrical_power; spent_wipes; ipa_air; motor; housing; gearbox; chuck; bearing; switch; controller; cord; contact; brush; grease; assembly_power; test_power; test_coupon; test_swarf; film; board"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all_flows"
      requirement: "Match actual part/material grade, supplied state, concentration, geography, reference property and units. A UUID is identity only, not amount evidence or a provider dataset. Resolve blanks before treating an exchange as fully linked."
      evidence: "supplier sheet; flow/property/unit records; identity review"
    - id: quality_completeness
      applies_to: "complete_machine"
      requirement: "Reconcile all configured BOM components, required fitted guards/handles and cord/contact to M; inventory actual utilities, chemicals, each waste and emission. Measure missing parts rather than infer them as the residual of M. Report coverage and any unlinked provider."
      evidence: "BOM revision; weigh sheets; material balances; missing-data register"
    - id: quality_period
      applies_to: "production_records"
      requirement: "Use one declared factory and complete representative period; record model changes, seasonality, idle demand, outsourcing and rework; quantify primary coverage and uncertainty. Historic product cases cannot substitute for current production records."
      evidence: "work orders; acceptance ledger; meter calibration; source limits"
    - id: quality_test
      applies_to: "acceptance"
      requirement: "Use current released criteria for the actual motor/drive/control/output interface, required guards/handles and electrical conformity. Distinguish corded and cordless bench supply. Manufacturer user performance/safety advice is not a universal factory test limit or durability requirement."
      evidence: "signed test plan; serial/model results; calibration and conformity specification"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_machine"
    rule: "Require 1 kg reference output, cp_mass measured M, complete declared tool-body supply and installed cord/contact/guards/handles/grease boundary. Detachable battery/charger, consumables, case and packaging must not enter M; do not use kit gross mass."
    source_ids: []
  - rule_id: validation_normalization
    applies_to: "inventory"
    rule: "Every applicable non-reference row uses normalize_mass and a declared protocol; check q_item and M share configuration/period, correct division direction and preserved energy/volume/item numerator units."
    source_ids: []
  - rule_id: validation_route
    applies_to: "processes"
    rule: "Match site molding, gear machining, motor winding and electrical work to actual make-or-buy records; no duplication of resin and housing, wire and bought-in motor, bearings/grease and bought-in gearbox, or reusable bench battery and shipped tool."
    source_ids: []
  - rule_id: validation_species
    applies_to: "elementary_flows"
    rule: "Match isopropanol CAS67-63-0 and outdoor-air unspecified subcompartment, particulate particle-size coverage and post-control boundary. Indoor or upper-troposphere isopropanol identities do not match outdoor factory emissions; captured swarf/wipes remain waste. No emitted fraction or emissions factor presumed."
    source_ids: []
  - rule_id: validation_coverage
    applies_to: "dataset"
    rule: "Disclose measured, calculated, estimated, excluded, not-applicable and missing quantities distinctly; reconcile accepted outputs, scrap, stock and allocation closure. A method check or valid projection does not approve scientific methodology or establish cradle-to-gate completeness."
    source_ids: []
