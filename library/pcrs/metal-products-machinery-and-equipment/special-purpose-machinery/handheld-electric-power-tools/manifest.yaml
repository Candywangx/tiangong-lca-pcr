review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: "New general workshop/construction hand-held electric tool-body category. Distinguish corded installed-cord tool and cordless bare tool body; exclude detachable battery/charger, interchangeable consumables, kit cases, garden/forestry machinery, medical/food appliances, non-electric/pneumatic/hydraulic tools and fixed machine tools. No equivalent material PCR found; existing fixed machine-tool and lawn-mower records remain separate. Kit products are separated without mass pooling; old scaffold retained read-only and identity not promoted. Classification acceptance separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  evidence_limitations:
    - "Manufacturer model manuals support architecture and supply examples only; current BOM, work orders and actual release-test specifications govern each foreground dataset."
    - "No universal tool mass, lifetime, polymer recipe, motor technology, factory test consumption, machining loss or emissions factor prescribed."
    - "Process cards are concrete starting exchanges; actual missing BOM parts, chemicals, wastes and providers must be completed before inventory completeness claims."
  unresolved_flow_identities:
    - row_id: pa6_gf30
      selected_flow: "Polyamide-6 granulate with 30% glass fibre by mass"
      reason: "Returned neat-polyamide or differently reinforced resin categories do not verify this PA6-GF30 supplied compound."
    - row_id: abs_trim
      selected_flow: "Discarded ABS molding trim"
      reason: "Returned ABS raw-resin identities are products, not this discarded molding trim waste."
    - row_id: steel_blank
      selected_flow: "Prepared steel gear blank"
      reason: "Generic prepared steel blank does not verify gear geometry/alloy and actual supply boundary; agricultural or mixed-metal blanks are not equivalent."
    - row_id: al_cast_housing
      selected_flow: "Unmachined aluminium-alloy gearbox housing casting"
      reason: "Generic aluminium alloy or casting products do not identify the shaped gearbox-housing blank and delivered condition."
    - row_id: al_swarf
      selected_flow: "Untreated aluminium-alloy machining swarf"
      reason: "Search returned ferrous swarf, mixed alloy chips or recycling products rather than verified aluminium-alloy swarf of this delivered state."
    - row_id: stator_stack
      selected_flow: "Finished electrical-steel stator lamination stack"
      reason: "Broad electrical-steel or motor categories do not verify the finished stator-stack geometry and included-part boundary."
    - row_id: winding_varnish
      selected_flow: "Polyester motor-winding impregnation varnish"
      reason: "Returned varnish/resin or liquid-coating categories do not verify the supplied motor-impregnation formulation and concentration."
    - row_id: winding_offcuts
      selected_flow: "Discarded enamel-insulated copper winding-wire offcuts"
      reason: "Returned clean copper recycling, post-consumer domestic/imported scrap and municipal waste-wire identities do not establish manufacturing enamel-wire offcuts."
    - row_id: solder_wire
      selected_flow: "Flux-free tin-silver-copper solder wire"
      reason: "Returned optical-assembly solder or solder-with-flux does not verify this separately supplied SAC wire form/alloy boundary."
    - row_id: rosin_flux
      selected_flow: "Rosin-based solder flux in isopropanol"
      reason: "Returned resin/elementary compounds do not verify the formulated flux concentration and supplied solution state."
    - row_id: ipa_cleaner
      selected_flow: "Neat isopropanol cleaning solvent"
      reason: "Search/direct product candidate is China production mix and lacks concentration specification; target neat solvent is geographically unrestricted. Optical-assembly product or elementary air/water identities are not substitutes."
    - row_id: spent_wipes
      selected_flow: "Spent cotton wipes contaminated with isopropanol"
      reason: "Returned generic wastes do not verify cotton wipes contaminated with the stated solvent and delivered state."
    - row_id: housing
      selected_flow: "Finished glass-fibre-reinforced PA6 tool housing shell"
      reason: "Returned CN generic injection parts, keyboard/telephone housings and aggregated proxies do not establish the finished glass-filled PA6 tool-shell material and geometry."
    - row_id: gearbox
      selected_flow: "Finished steel-geared drill gearbox assembly"
      reason: "Returned wind-turbine gearboxes/nacelles/shafts are not a complete steel-geared handheld drill gearbox."
    - row_id: chuck
      selected_flow: "Finished steel drill chuck"
      reason: "Returned steel shot, well-drilling pipes, drilling waste and stationary machine-tool categories do not identify a finished drill chuck."
    - row_id: bearing
      selected_flow: "Finished steel ball bearing"
      reason: "Returned ball-or-roller bearing category and bearing cages do not resolve the specified complete steel ball-bearing material/type."
    - row_id: switch
      selected_flow: "Finished power-tool trigger switch"
      reason: "Returned ignition equipment or generic switching components do not establish the complete tool trigger-switch supplied boundary and rating."
    - row_id: controller
      selected_flow: "Finished brushless-motor control board"
      reason: "Returned generic electronic/chemical candidates do not establish a populated brushless-tool motor-control board and its included connectors."
    - row_id: cord
      selected_flow: "Finished insulated-copper mains cord with plug"
      reason: "Returned 20-pin ribbon-cable/dishwashing proxies, rubber and wiring categories are not the defined mains cord-with-plug product."
    - row_id: contact
      selected_flow: "Finished cordless battery-contact connector"
      reason: "Direct Battery contact is CN hearing-aid interface hardware, not a cordless power-tool connector; supply route and contact geometry differ."
    - row_id: brush
      selected_flow: "Finished graphite motor brush"
      reason: "Returned carbon electrolysis anodes/electrodes do not identify a finished graphite motor brush with lead boundary."
    - row_id: grease
      selected_flow: "Lithium-soap lubricating grease"
      reason: "Initial lithium-hydroxide and refined wax/solvent lubricant or elementary-compound candidates are not a lithium-soap formulated gearbox grease."
    - row_id: test_coupon
      selected_flow: "Cold-rolled carbon-steel drilling-test coupon"
      reason: "Generic steel sheet candidates do not verify actual coupon grade/form; conflicting Chinese names prevent adopting those identities."
