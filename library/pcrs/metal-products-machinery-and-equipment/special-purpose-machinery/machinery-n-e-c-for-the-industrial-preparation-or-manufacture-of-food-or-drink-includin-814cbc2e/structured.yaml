system_boundary:
  rules:
    - rule_id: principal_function
      applies_to: "foreground_system_boundary"
      rule: "CPC44516 explicitly includes fats/oils. Sigma is a decanter centrifuge and stays outside the complete reference under43931 despite olive-oil application. Census chapter84 is supplementary: HS8438 excludes fats/oils and must not narrow CPC44516. Review embedded modules separately from independently supplied whole machines."
      source_ids:
        - cpc
        - sigma
        - census
    - rule_id: source_architecture
      applies_to: "foreground_system_boundary"
      rule: "Anderson distinguishes mechanical pressing, extrusion preparation and customer solvent extraction; its full plant is not one universal44516 reference. Bucher hydraulic fruit presses require actual food principal function rather than pharmaceutical or lab/pilot default. Tetra distinguishes pump/transmission and homogenizing device; an independent high-pressure pump is not automatically a complete food homogenizer. Bühler conching shears/mixes chocolate mass and the five-roll refiner is not generic cereal milling."
      source_ids:
        - anderson-expeller
        - anderson-oil
        - bucher-press
        - tetra-handbook
        - buhler-conche
    - rule_id: supplied_configuration
      applies_to: "foreground_system_boundary"
      rule: "Handtmann forming/cutting, optional co-extrusion, rollers/water-spray and downstream weighing/packing interfaces follow actual orders; a depicted filler or packaging link does not establish included BOM. Anderson optional shaft water cooling/choke and closed-loop oil cooling require actual included interfaces/fills. Example empty/gross masses, throughputs, pressure, energy savings and food yields are not Dnet or factory defaults."
      source_ids:
        - handtmann-fs
        - anderson-expeller
        - sigma
    - rule_id: manufacture_and_tests
      applies_to: "foreground_system_boundary"
      rule: "Collect actual local cutting/forming/machining/welding/finishing/assembly and attributable inspection, factory trials, rejects and rework. No source establishes a universal material grade, factory route or acceptance recipe. Customer commissioning/recipe development and normal food production are separately scoped; charge factory food/media only when actual acceptance records establish attribution."
      source_ids:
        - anderson-expeller
        - bucher-press
        - buhler-conche
        - tetra-handbook
