allocation_rules:
  - rule_id: allocate_configuration
    applies_to: "foreground_burden_allocation"
    rule: "Separate actual configurations/site/process meters first. Allocate common-period residual by measured causal service demand or work, not catalogue food throughput. Include attributable failed trials/rework/rejects in accepted-machine burdens. Cancel paired internal transfers; disclose reusable returned test food, saleable co-products and receiver allocation/treatment without invented avoided burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted machine"
      record_type: "foreground_record"
      raw_fields: "model/configuration/serial; net mass; Naccepted; Dnet; included hardware/fills; excluded packing/spares"
      collection_method: "Calibrated traceable weighings reconcile accepted complete machines with actual order/BOM within one configuration/period. Sum accepted net mass excluding packing/spare stock/rejects/consumed trials. Include only actually retained shipped fill."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_materials
      process_id: "fabrication"
      flow_role: "local stock and chemical ingredients"
      record_type: "foreground_record"
      raw_fields: "Qattr; own gross mass/assay/moisture/density; alloy/formulation; stocks/returns/reactions/retained parts; actual local route"
      collection_method: "Weigh actual supplied stock and each local finishing/joining/cleaning ingredient; reconcile own-stream element/moisture/chemical contents with retained hardware, reaction products, baths/recovery/waste/stocks/returns. Actual surface alloy or sanitary approval is specific to the contacted part, never every frame. Embedded complete-module materials stay upstream once."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_modules
      process_id: "assembly"
      flow_role: "completed hardware and retained fill"
      record_type: "foreground_record"
      raw_fields: "Qattr; BOM/completion/options; hardware mass/length; separate fill formula/assay/T/P/density; receipts/installed/returns/stocks"
      collection_method: "Hardware branch weighs actual completed received/installed/returned assemblies and cable lengths, documenting remaining local work. Chemical branch independently measures local fill/lubricant/gas in its own native units and own composition/moisture/T/P/density, stocks/reactions/retention/returns. Complete bought modules embed their chemicals upstream once; whole hardware mass never substitutes chemical amount. First retained supply fill is distinct from trial consumption and customer maintenance."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "observed factory trial media"
      record_type: "foreground_record"
      raw_fields: "Qattr; actual acceptance order/trial/repeat/reject; water/food/gas receipts; own composition/state; returned/reused/sold/discarded stocks"
      collection_method: "Meter actual attributed factory tests and repeated/failed trials, using each food/chemical/water/gas own measured amount and composition. Record returned/reused/recovered and saleable food independently, never as disappearance. Exclude normal customer production, catalogue recipe/capacity, R&D demonstrations or customer commissioning unless an explicit declared manufacturing attribution is evidenced."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_utilities
      process_id: "services"
      flow_role: "each unassigned utility"
      record_type: "foreground_record"
      raw_fields: "Qattr; common period/site/import/self-generation/export/storage; assigned meters; gross/net heat datum; independent return; T/P/humidity/density"
      collection_method: "Reconcile each common-period imported and actually generated utility minus exports/storage with assigned local/test meters; allocate only residual once. Cable/energy/volume units remain native. Gross heat deducts separately measured same-datum return once; net heat never twice. Process water/DI/service water and internally circulated cooling flows are independent interfaces; paired returns cancel."
      unit: "native unit"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "each packaging item"
      record_type: "foreground_record"
      raw_fields: "Qattr; packing grade/moisture/dimensions; dispatch receipts; returns/reuse/stocks; packing outside Dnet"
      collection_method: "Weigh actual board/foil/pallet independently and reconcile dispatch/returns/reuse/stocks within the accepted configuration/period. No generic packaging ratio or catalogue shipping gross mass establishes net equipment mass."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_wastes
      process_id: "residues"
      flow_role: "each outgoing waste stream"
      record_type: "foreground_record"
      raw_fields: "Qattr; transfer weight; own composition/assay/moisture/density; stocks/returns/recovery; receiver/transport/treatment route"
      collection_method: "Measure each outgoing waste independently at its actual handover state; retain own-stream wet/dry/composition and chemical/metal contents, returned stock and receiver route. Wastewater/sludge/spent solvent/captured dust/food/oil remain separate. Treatment is distinct from direct environmental discharge; captured material is not air. Missing compatible identity remains a gap rather than wrong-origin waste proxy."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original receipts/calibration/own assays/acceptance/BOM/uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each direct emitted species"
      record_type: "foreground_record"
      raw_fields: "Qattr; CAS/species/origin/compartment; post-control concentration; simultaneous flow/time; T/P/wet-dry/O2 correction; fugitive sampling; capture/reaction/byproducts"
      collection_method: "Use independently observed post-control concentration times matched actual flow and time with unit/state correction plus separately sampled fugitives. Reconcile input/retained/recovered/destroyed/sludge/wastewater/stocks by own assays; capture is not destruction and non-air/unexplained residuals never infer air. Molecular NO2 differs from NOx-equivalent; contained Cr(VI)/Ni/Cu differs from total metal/oxide/salt/alloy and avoids PM overlap."
      unit: "kg"
      frequency: "each actual batch/matched interval"
      temporal_coverage: "one common production period"
      site_scope: "same declared configuration/site"
      aggregation_rule: "per 1 kg reference flow"
