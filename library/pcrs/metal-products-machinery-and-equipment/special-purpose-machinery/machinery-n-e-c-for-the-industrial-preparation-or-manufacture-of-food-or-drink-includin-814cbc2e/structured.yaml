  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Within one actual configuration/period divide attributable native-unit total by the sum of calibrated accepted complete-machine net masses. Retain per-machine quantities and actual denominator evidence."
      inputs:
        - Qattr
        - Dnet
        - Naccepted
        - cp_mass
      output: "native-unit amount per kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "Same configuration/period Qattr includes attributable manufacture/assembly/tests/reject/rework burden. Naccepted counts accepted machines; Dnet sums their calibrated net masses. M=Dnet/Naccepted; q_item=Qattr/Naccepted; q_ref=Qattr/Dnet. Catalogue empty/gross mass or food throughput is not a denominator."
      evidence: "calibrated configuration-specific accepted ledger"
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Every element/chemical term uses its own gross mass, assay/moisture/wet-dry basis, reactions/stocks/returns/retention. Alloy/sludge/solution mass differs from contained element/active chemical. Each water stream requires own water fraction/density at actual temperature, independent reaction/retained fill/evaporation/discharge/stocks; internal returns pair and cancel."
      evidence: "own-stream assays and state/stock/reaction records"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair; wastewater"
      requirement: "Reconcile each solvent own assay, stocks/reactions/retained/recovered/captured/destroyed/wastewater/spent-media terms against independently measured air. Capture differs from destruction; non-air and unexplained residual cannot become emitted IPA."
      evidence: "independent measured fate and air records"
    - id: quality_scope
      applies_to: "reference product"
      requirement: "Maintain the entire food/drink/fats/oils residual category with actual principal-function and configuration review. Food-contact grade/approval is component-specific, not a whole-frame claim. Catalogue option, empty/gross mass, customer recipe/yield/utility demand, marketing savings and maintenance consumables are not factory manufacture defaults."
      evidence: "actual order/BOM/acceptance and primary original technical body"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual published100/type/native reference internal ID/property/unitgroup and official bilingual names with full chemistry/CAS/grade/phase/provider/completion/compartment. Add every actual unlisted material, ingredient/fuel/fill/module/test food, transport, waste and emitted species as independently queried atomic measured exchanges. Unresolved identities remain gaps; missing differs from zero and not-applicable requires physical evidence."
      evidence: "own full direct and supplier/interface review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require complete accepted residual industrial food/drink/fats/oils machine function and equivalent bilingual one-kg net reference. Reject general centrifuges, independent pumps/filtration/packing, parts or customer foods as whole-equipment substitutes."
    source_ids:
      - cpc
      - census
      - sigma
  - rule_id: validate_makebuy
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual completed supply/order/BOM, food-contact component approval and local make/buy/test boundaries. Reject duplicate embedded upstream modules, assumed options/fills, catalogue factory recipes and lifetime customer consumables. Include attributable failed trials/rework/rejects."
    source_ids:
      - cpc
      - anderson-expeller
      - anderson-oil
      - bucher-press
      - buhler-conche
      - tetra-handbook
      - handtmann-fs
      - sigma
      - census
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require own-stream physical/chemical/water/solvent balances and post-control species concentration × matched flow/time/state plus independent fugitives. Common-period utilities reconcile imports/actual generation/exports/storage with assigned meters and residual only; gross heat return is independently deducted once."
    source_ids: []
  - rule_id: validate_species
    applies_to: "foreground_dataset_conformance"
    rule: "Require measured molecular NO2, actual Cr(VI), contained Ni/Cu and non-overlapping PM. Prefer individual Ni/Cu species if the actual LCIA method differentiates them. Fossil CO2 needs origin evidence distinct from biogenic food carbon. Captured/dissolved material remains non-air; report checks performed/skipped, findings and actual completeness."
    source_ids: []
