    - row_id: cutting_dust
      flow: Collected non-alloy steel laser-cutting filter dust
      reason: No directly verified collected dry steel laser-cutting filter-dust waste
        identity with actual composition and transfer state established.
    - row_id: abrasive_disc
      flow: Bonded aluminium-oxide abrasive deburring disc
      reason: No directly verified bonded aluminium-oxide deburring-disc
        formulation/state identity established; generic abrasive substance is
        not the complete consumable disc.
    - row_id: spent_disc
      flow: Spent bonded aluminium-oxide disc with steel deburring contamination
      reason: No directly verified spent bonded aluminium-oxide disc with steel
        contamination and actual waste-transfer state established.
    - row_id: weld_wire
      flow: Solid manganese-silicon carbon-steel MAG welding wire
      reason: Solid Wire direct public record is copper power-transmission conductor,
        not Mn-Si steel MAG wire; flux-cored and generic drawn steel wire do not
        establish this filler supply state.
    - row_id: shielding_mix
      flow: Compressed premixed welding gas 82vol% argon and18vol% carbon dioxide
      reason: Actual82vol%Ar18vol%CO2 compressed premix is supported as a commercial
        gas, but directly read generic gas identities reference
        Volume*time/Area*time with no real interface/conversion establishing
        this physical supplied mixture mass; public properties are preserved.
    - row_id: collected_fume
      flow: Collected iron-manganese-bearing solid MAG welding extraction dust
      reason: No directly verified captured iron-manganese-bearing solid MAG
        extraction-dust identity with actual contamination and recipient state
        established.
    - row_id: finished_machine
      flow: Accepted bare MAG-welded bent-steel tractor-bumper mounting frame
      reason: No directly verified Mass-compatible public identity for this complete
        bare same-drawing tractor-bumper mounting-frame component established by
        actual bounded queries. Keep exact finished_machine output name and
        precise registration, not a generic vehicle chassis.
