review_metadata:
  scientific_review: pending
  semantic_boundary_decision: "Create
    bare-mag-welded-tractor-bumper-mounting-frame: a drawing-defined complete
    bare non-alloy bent-plate weldment for a specific agricultural tractor and
    bumper module, with traceable mounting interfaces, nitrogen-assisted sheet
    laser cutting, actual in-gate bending, solid-wire MAG
    with82vol%Ar/18vol%CO2, qualified weld/geometry release and
    same-drawing/configuration calibrated net M. Generic structural fabrication
    techniques are reused, but dedicated dual mounting interfaces, machine/BOM
    compatibility, configured component completion and controlled weld
    acceptance supplement the existing structural-metal methodology. Not new
    identity merely for44199: building/support structures, other agricultural
    parts, all complete machinery and other joining/cutting/finishing routes
    excluded."
  evidence_limitations:
    - OEM current tractor/bumper interface drawing, weld specification, exact
      configuration and bare completion must be established by real order. No
      universal load/tolerance/grade/weight/lifetime or numerical inventory
      benchmark imposed.
    - GMI and GSM support product/process families, Linde blend identity and HSE
      species/capture concerns; selected route is conditional on actual
      foreground records, not an assertion that those manufacturers use this
      exact combination on every order.
    - No actual M, producer quantities, source carbon provenance, final external
      species measurements or plant quality certificates obtained. Scientific
      and quantitative acquisition remain pending.
    - Historical2011 allocation guidance is limited to methodology, not current
      regulatory force.
    - Received-sheet-to-bare-component foreground only; upstream
      supplier/gas/energy/treatment links require actual acquisition before
      extended lifecycle claims.
