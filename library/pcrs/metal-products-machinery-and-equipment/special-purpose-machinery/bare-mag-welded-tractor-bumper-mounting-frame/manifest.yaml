      reason: Hot rolled low-alloy high-strength plate is not the declared non-alloy
        sheet route; no actual supplier equivalence.
    - uuid: ab077147-ee7a-463a-b872-fbe013f419d4
      rows:
        - shielding_mix
      reason: Public unspecified gas has Volume*time reference; no real
        measurement/conversion establishes the required physical supplied82/18
        mixture mass. Public property preserved, no Mass rewrite.
    - uuid: 234763b4-106d-4271-93c2-c318eb20d0dc
      rows:
        - shielding_mix
      reason: Public gas reference Area*time and unspecified recipe do not establish
        this supplied82/18 mixture mass without real interface/conversion
        evidence.
  unresolved_flow_identities:
    - row_id: steel_sheet
      flow: Uncoated hot-rolled non-alloy structural steel sheet
      reason: Bounded plate queries and direct reads found conflicting aluminium
        classification/historical specification or low-alloy routes; no coherent
        current non-alloy hot-rolled sheet identity established for this actual
        supplier state.
    - row_id: cutting_residue
      flow: Solid non-alloy steel laser-cutting dross
      reason: No directly verified solid dry laser-cutting steel dross waste identity
