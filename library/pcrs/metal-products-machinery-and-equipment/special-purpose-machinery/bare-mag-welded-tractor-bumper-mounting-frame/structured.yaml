allocation_rules:
  - rule_id: allocation_orders
    applies_to: "shared resources"
    rule: "Avoid allocation by drawing/order, nesting subdivision and station submeter. Allocate unavoidable shared cutting, brake, weld/extraction and inspection loads using demonstrated measured machine time/load or other actual causal driver. Record numerator, same-configuration accepted count, stock changes, idle/rework attribution and sensitivity. Different material thickness, weld length or mounting designs are not automatically mass-equivalent."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_scrap
    applies_to: "steel_offcuts; cutting_residue; collected_fume; spent_disc; spent_oil"
    rule: "Separate unused stock return, internally reused pieces, transferred waste and any reviewed genuine co-product. No automatic avoided virgin-steel credit or co-product status from sale value. Weigh scrap/dust without duplicated retained fluids or filter hardware; actual recipient and treatment boundary must be stated."
    source_ids:
      - ghg-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "reference product"
      record_type: "weighing_record"
      raw_fields: "part number; drawing revision; configuration; tractor/bumper models; serial/lot; accepted net mass M; complete joined BOM; scale calibration/zero/tare/uncertainty; acceptance linkage"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted configuration and lot"
      temporal_coverage: "declared manufacturing period"
      site_scope: "complete bare-component release station"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "raw scale readings and calibration, same drawing/BOM/interface acceptance"
    - protocol_id: cp_cutting
      process_id: "cutting"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; drawing/BOM/configuration; order/lot; accepted units; issues/returns/stock; measured quantity/unit; submeter; rejects/rework; supplier/recipient and species observations"
      collection_method: "Record weighed net sheet issues/returns/stocks, nesting/order genealogy, nitrogen measured mass or actual metered-volume conversion, cut-piece and offcut masses, captured cutting residue and station kWh. Aggregate actual same-configuration order records, reconcile stock, allocate by recorded causal driver and divide attributable totals by the accepted complete units of that same configuration. Keep genuine zero, non-applicability and missing records distinct."
      unit: "kg for mass; m3 for hydraulic oil at recorded temperature; MJ for electricity after kWh conversion"
      frequency: "each order/lot and actual consumable or release observation"
      temporal_coverage: "complete stated period and inventory dates"
      site_scope: "actual included station or named subcontract gate"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original quantities, calibration, actual same-configuration count, supplier certificates/SDS and species/recipient records"
    - protocol_id: cp_forming
      process_id: "forming"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; drawing/BOM/configuration; order/lot; accepted units; issues/returns/stock; measured quantity/unit; submeter; rejects/rework; supplier/recipient and species observations"
      collection_method: "Retain part/order routing, bend setup and dimensional checks, actual oil dispensed volume and temperature, tank balance, weighed waste oil and station electricity. Aggregate actual same-configuration order records, reconcile stock, allocate by recorded causal driver and divide attributable totals by the accepted complete units of that same configuration. Keep genuine zero, non-applicability and missing records distinct."
      unit: "kg for mass; m3 for hydraulic oil at recorded temperature; MJ for electricity after kWh conversion"
      frequency: "each order/lot and actual consumable or release observation"
      temporal_coverage: "complete stated period and inventory dates"
      site_scope: "actual included station or named subcontract gate"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original quantities, calibration, actual same-configuration count, supplier certificates/SDS and species/recipient records"
    - protocol_id: cp_welding
      process_id: "welding"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; drawing/BOM/configuration; order/lot; accepted units; issues/returns/stock; measured quantity/unit; submeter; rejects/rework; supplier/recipient and species observations"
      collection_method: "Record wire net feed/returns/stub mass, gas net consumed mixture mass and certified composition, weld and rework time, extraction energy and weighed collected residue. Actual speciation and exhaust/fugitive tests establish elemental manganese release; actual carbon provenance and gas balance establish fossil CO2 only where justified. Aggregate actual same-configuration order records, reconcile stock, allocate by recorded causal driver and divide attributable totals by the accepted complete units of that same configuration. Keep genuine zero, non-applicability and missing records distinct."
      unit: "kg for mass; m3 for hydraulic oil at recorded temperature; MJ for electricity after kWh conversion"
      frequency: "each order/lot and actual consumable or release observation"
      temporal_coverage: "complete stated period and inventory dates"
      site_scope: "actual included station or named subcontract gate"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original quantities, calibration, actual same-configuration count, supplier certificates/SDS and species/recipient records"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; drawing/BOM/configuration; order/lot; accepted units; issues/returns/stock; measured quantity/unit; submeter; rejects/rework; supplier/recipient and species observations"
      collection_method: "Retain serial/lot, BOM/drawing revision, accepted count, geometry/weld inspection, calibration and complete net scale reading/tare. Measure only actual removable LDPE packing separately. Aggregate actual same-configuration order records, reconcile stock, allocate by recorded causal driver and divide attributable totals by the accepted complete units of that same configuration. Keep genuine zero, non-applicability and missing records distinct."
      unit: "kg for mass; m3 for hydraulic oil at recorded temperature; MJ for electricity after kWh conversion"
      frequency: "each order/lot and actual consumable or release observation"
      temporal_coverage: "complete stated period and inventory dates"
      site_scope: "actual included station or named subcontract gate"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "original quantities, calibration, actual same-configuration count, supplier certificates/SDS and species/recipient records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: electricity_conversion
      applies_to: "cutting_electricity; forming_electricity; welding_electricity; release_electricity"
      rule: "Convert actual kWh to MJ using1 kWh =3.6 MJ before normalize_mass; retain original meter and shared-load records."
      inputs:
        - "meter kWh"
      output: "q_item in MJ"
      source_ids: []
  data_quality_requirements:
    - id: interface_trace
      applies_to: "reference product"
      requirement: "Identify tractor/bumper models, part number, both interface datums/attachment holes and clearances under the actual OEM drawing. Inspect specified geometry and correct distortion before release; no inferred universal tolerance or static/fatigue load."
      evidence: "controlled drawing/revision, BOM, actual measurements and sign-off"
    - id: weld_quality
      applies_to: "welding; release"
      requirement: "Retain material certificate, approved procedure, wire/gas certificates, welder/operator competence, weld map, actual visual and specified additional testing, repairs and final weld disposition. Do not import manufacturer certification or every NDT test as this plant acceptance."
      evidence: "actual procedure, qualification and inspection records"
    - id: mass_and_completion
      applies_to: "cp_mass"
      requirement: "Same drawing/configuration and accepted bare completion define M; incomplete kits, separately supplied loose bolts, paint or complete bumper are not the measured output. Retain raw calibrated weighing with actual accepted count."
      evidence: "BOM/order/acceptance and scale records"
    - id: species_capture
      applies_to: "manganese_air; co2_air; collected_fume"
      requirement: "Measure actual final environmental discharge separately from workplace exposure, generated fume and collected residue. Preserve species as Mn rather than oxide/total dust, current air subcompartment, gas carbon provenance and actual release balance; no occupational limit reused as an emission factor."
      evidence: "species analysis, gas source, exhaust/time/flow and residue balances"
    - id: inventory_period
      applies_to: "all inventory rows"
      requirement: "Complete period/lot, net issue/return/stock change, rework/reject attribution and causal allocation are required. Add any actual additional fixture maintenance, grinding waste, utilities or measured species atomically before declaring quantitative completeness."
      evidence: "quantity/stock/recipient ledgers and uncertainties"
    - id: evidence_gaps
      applies_to: "dataset"
      requirement: "No actual M, order inventory, empirical range, supplier data or plant-quality record has been obtained for a particular producer. Require later foreground acquisition and scientific review. Blank UUIDs remain precise physical flows, not evidence of database absence."
      evidence: "future original records and compatible independently reviewed sources"
validation_rules:
  - rule_id: validate_identity
    applies_to: "dataset"
    rule: "Verify dedicated tractor-bumper double interface, complete bare bent-plate weldment, actual nitrogen laser/bending/solid-wire82/18 MAG route and explicit exclusions; CPC alone is not applicability."
    source_ids:
      - gmi-weldments
      - linde-corgon18
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Check exact same-drawing/configuration net M, cp_mass raw scale evidence and count denominator. Every non-reference row applies normalize_mass and its actual collection protocol; preserve public property/unit chain and do not invent density/weight."
    source_ids: []
  - rule_id: validate_acceptance
    applies_to: "release"
    rule: "Require controlled interface measurements and weld quality disposition linked to the same BOM/lot. Missing drawing tolerances, weld specifications or physical originals are acquisition/scientific gaps even if mechanical checks pass."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Check individual gases/formulations/residues/species, true environmental medium, actual conditional applicability, net masses and recipient boundaries; never replace captured dust with emitted Mn or supplied mixed gas with fossil CO2."
    source_ids:
      - hse-welding
      - hse-extraction
published_dataset_profile:
  dataset_role: "foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset only after actual quantitative completion and independent review"
  allowed_use: "Supplier input for the declared compatible tractor-bumper mounting-frame part and manufacturing gate"
  excluded_use: "All44199 coverage, generic steel structures, complete tractor/bumper, field performance/lifetime claims and unqualified mass-only comparison"
  required_metadata: "specific agricultural tractor model and bumper module; OEM part number, drawing revision and BOM; tractor-side and bumper-side attachment patterns, mounting-hole positions, datums and load/clearance interfaces under actual controlled drawings; all delivered welded plate members, excluded loose fasteners/bumper and bare uncoated state; received non-alloy hot-rolled uncoated sheet grade/thickness/certificate; actual nitrogen cutting and press-brake programme; approved solid Mn-Si wire MAG procedure, fixture, weld map/qualifications and actual82vol%Ar18vol%CO2 supply certificate; dimensional/weld acceptance criteria and records; complete net measured M kg of the same drawing/configuration, calibrated scale/tare/uncertainty; site/period/count/rework/allocation, actual supply links, measured conditional release medium and carbon provenance"
  required_quality_disclosure: "Measured M/uncertainty and complete same-drawing configuration; period/count/stock/rework/allocation; interface/weld coverage; supplied states, missing upstream links, measured conditional species, unresolved identities and ranges; scientific review status"
  update_trigger: "OEM interface/drawing/BOM, grade/thickness, wire/gas/cutting route, procedure/acceptance, completion/coating, site/energy/supply changes"
data_sources:
  - id: "gmi-weldments"
    type: "literature"
    reference: "Groupe Maillard Industrie, structural welding; https://www.groupgmi.com/en/expertise/metallurgy/machine-welding/ ; unpaginated Introductory workshops, Laser cutting, Cutting/folding/bending, Welding, Analysis and monitoring, Agricultural machinery"
    used_for: "Agricultural tractor-bumper brackets/frames and offered fabrication routes; dimensional/weld controls. Selected combination requires actual foreground order; no capacity, weight or carbon claims adopted."
  - id: "gsm-agriculture"
    type: "literature"
    reference: "GSM, Agricultural Equipment; https://www.gsmwinc.com/agricultural-equipment/ ; unpaginated equipment and component list"
    used_for: "Independent agricultural welded frames and mounting-bracket supply context, not a specific drawing or universal fabrication route."
  - id: "linde-corgon18"
    type: "literature"
    reference: "Linde Austria CORGON18; https://produkte.linde.at/industriegase/cyl_techgas/schweiss_gas/corgon_18.html ; composition table and applications, unpaginated"
    used_for: "Commercial82%argon18%CO2 MAG shielding mixture. Does not prescribe all agricultural welding or fossil gas origin."
  - id: "hse-welding"
    type: "official_guidance"
    reference: "UK HSE, Health risks from welding; https://www.hse.gov.uk/welding/health-risks-welding.htm ; Neurological effects, unpaginated"
    used_for: "Manganese in mild-steel welding fume: conditional species accounting. Occupational limits not reused as environmental emission factors or worldwide regulation."
  - id: "hse-extraction"
    type: "official_guidance"
    reference: "UK HSE, Welding fume avoid/reduce exposure; https://www.hse.gov.uk/welding/protect-your-workers/avoid-reduce-exposure.htm ; LEV section, unpaginated"
    used_for: "Capture versus uncaptured fume distinction; no universal removal efficiency or emission amount inferred."
  - id: "ghg-allocation"
    type: "official_guidance"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard2011; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf ; printed63 PDF65 Tables9.1–9.2"
    used_for: "Historical general allocation hierarchy; actual causal driver from foreground records, not current agricultural regulation."
