allocation_rules:
  - rule_id: allocation_orders
    applies_to: "all processes"
    rule: "Separate orders/configurations and station meters to avoid allocation. Unavoidable shared tools, inspection/support electricity require measured causal time/load or documented driver with numerator, idle/rework, accepted same-configuration count and sensitivity. No default mass allocation between differently adjusted stands."
    source_ids:
      - ghg-allocation
  - rule_id: allocation_rejects
    applies_to: "rejected_steel"
    rule: "Reconcile rejected modules, return, repair and segregated waste; retained rubber/coating contamination disclosed. Sales do not automatically create a co-product or avoided virgin steel credit. Do not apply a recycling benefit without an independently reviewed boundary."
    source_ids:
      - ghg-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "release"
      flow_role: "reference product"
      record_type: "weighing_record"
      raw_fields: "model; configuration; drawing/BOM revision; serial/lot; accepted net mass M; scale calibration/tare/uncertainty; assembled completion and acceptance linkage"
      collection_method: "Weigh the accepted complete unit on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted configuration and lot"
      temporal_coverage: "declared complete production period"
      site_scope: "assembled stand-only release station"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "original scale readings, calibration and complete BOM acceptance"
    - protocol_id: cp_assembly
      process_id: "assembly"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; configuration; drawing/BOM; lot; accepted units; issue/return/stock; measured quantity/unit; meter coverage; supplier/recipient; inspection/rework"
      collection_method: "Collect actual net component issues, original meters, actual waste transfer and packaging issues at this station. Reconcile inventory changes, attribute shared loads by real causal records and divide attributable totals by accepted complete units of the same configuration. Keep actual zero, absent exchange and missing record distinct."
      unit: "kg for mass; MJ for electricity after original kWh conversion"
      frequency: "each order/lot and actual exchange"
      temporal_coverage: "full declared period with stock dates"
      site_scope: "actual named assembly/acceptance/release station"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "BOM/delivery certificates, meter calibration, measured quantities, actual count and signed inspection/disposition"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; configuration; drawing/BOM; lot; accepted units; issue/return/stock; measured quantity/unit; meter coverage; supplier/recipient; inspection/rework"
      collection_method: "Collect actual net component issues, original meters, actual waste transfer and packaging issues at this station. Reconcile inventory changes, attribute shared loads by real causal records and divide attributable totals by accepted complete units of the same configuration. Keep actual zero, absent exchange and missing record distinct."
      unit: "kg for mass; MJ for electricity after original kWh conversion"
      frequency: "each order/lot and actual exchange"
      temporal_coverage: "full declared period with stock dates"
      site_scope: "actual named assembly/acceptance/release station"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "BOM/delivery certificates, meter calibration, measured quantities, actual count and signed inspection/disposition"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "individual inventory exchanges"
      record_type: "production_record"
      raw_fields: "row_id; configuration; drawing/BOM; lot; accepted units; issue/return/stock; measured quantity/unit; meter coverage; supplier/recipient; inspection/rework"
      collection_method: "Collect actual net component issues, original meters, actual waste transfer and packaging issues at this station. Reconcile inventory changes, attribute shared loads by real causal records and divide attributable totals by accepted complete units of the same configuration. Keep actual zero, absent exchange and missing record distinct."
      unit: "kg for mass; MJ for electricity after original kWh conversion"
      frequency: "each order/lot and actual exchange"
      temporal_coverage: "full declared period with stock dates"
      site_scope: "actual named assembly/acceptance/release station"
      aggregation_rule: "attributable exchange amount / accepted units"
      quality_evidence: "BOM/delivery certificates, meter calibration, measured quantities, actual count and signed inspection/disposition"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration_interface
      applies_to: "reference product"
      requirement: "Require current tabletop mounting pattern/support geometry, compatible head/table workstation, treadle mounting travel/clearance, height lock and levelling configuration; acceptance uses actual controlled drawing, fastener specification and inspection plan. No inferred universal load, torque or vibration performance."
      evidence: "current drawing/BOM, measured interfaces and signed checks"
    - id: completion_mass
      applies_to: "cp_mass"
      requirement: "Same drawing/configuration defines complete assembled stand M including feet/adjustment/fasteners and retained supplier coating. Keep separate tabletop/head/accessory supply and shipment packaging outside M. Actual calibrated complete weighing and same-configuration count are mandatory."
      evidence: "original scale/BOM/acceptance/order records"
    - id: supplier_states
      applies_to: "assembly"
      requirement: "Verify finished coated modules and exact rubber compound/insert/fastener states. Supplier welding/coating is not a local process. Preserve actual component supply identifiers; add upstream links before claiming extended completeness."
      evidence: "supplier drawings/certificates and gate records"
    - id: inventory_coverage
      applies_to: "all inventory rows"
      requirement: "Reconcile net issues, stock changes, accepted count, defects/rework and actual recipient. Add real cleaning chemicals, additional packaging or utilities atomically if used; missing data is not zero."
      evidence: "complete period ledgers and meter/order evidence"
    - id: scientific_gaps
      applies_to: "dataset"
      requirement: "No particular producer M, actual joint drawing, manufacturing quantities, acceptance originals, empirical ranges or complete supplier impact datasets have been obtained. These require later foreground acquisition and independent scientific review; a mechanical check does not approve them."
      evidence: "future physical originals and review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Verify the exact stand-only fixed-foot non-powered configuration, finished module route and special tabletop/treadle interfaces; no product applicability from classification alone."
    source_ids:
      - kessler-stand
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Reference name equals finished output; actual same-configuration complete net M and cp_mass support q_item/M for every non-reference row. Verify public property/unit chain without replacing count/area/volume with Mass."
    source_ids: []
  - rule_id: validate_quality
    applies_to: "acceptance"
    rule: "Require actual drawing and signed measured interface/adjustment/fastener/completion acceptance. Missing actual criteria or records remain scientific/acquisition gaps despite structural validity."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "all processes"
    rule: "No duplicated embedded coating/steel, upstream fabrication energy or invented local weld emissions; reconcile actual waste and conditionally used utilities/packing before quantitative-completeness claim."
    source_ids: []
