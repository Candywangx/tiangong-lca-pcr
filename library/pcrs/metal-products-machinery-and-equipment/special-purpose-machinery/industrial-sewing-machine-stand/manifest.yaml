review_metadata:
  scientific_review: pending
  semantic_boundary_decision: "Independent non-powered modular tubular-steel
    industrial sewing machine stand: externally finished powder-coated matched
    structural modules, non-tilting tabletop supports, adjustable treadle
    mounting bar, fixed rubber feet and levelling adjustment; receipt,
    mechanical assembly, dedicated sewing-workstation interface/adjustment
    acceptance and complete same-configuration net mass release. Tabletop, head,
    drive/control, treadle pedal itself, casters, tilt/electric/spring-assisted
    variants and generic metal structures excluded. Existing generic structural
    fabrication and complete lockstitch-workstation methods inform general rules
    but do not provide this separately supplied adjusted support module
    boundary. CPC alone does not justify identity. Local
    cutting/bending/welding/coating excluded from this assembly module; actual
    finished supplied states and upstream gaps are explicit."
  evidence_limitations:
    - Manufacturer product description establishes configuration family, not
      actual producer joint architecture or universal fabrication route. This
      module starts at finished external components.
    - No actual M, joint drawing, quantities, acceptance criteria/results or
      complete upstream supplier datasets acquired. Future foreground
      acquisition and independent scientific review required.
    - No exact weight/load/height/lifetime or inventory range inferred from
      catalogue. 2011 allocation source is historical general methodology only.
