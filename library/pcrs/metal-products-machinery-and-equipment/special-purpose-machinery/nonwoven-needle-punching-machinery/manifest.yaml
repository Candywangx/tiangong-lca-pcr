  semantic_boundary_decision: "New complete motor-driven flat pre/main needle-punching machine manufacture using reciprocating barbed felting needles, with separate single/top-bottom/double-zone, vertical/elliptical and fitted module configurations. Exclude fibre opening/carding, web formation/crosslapping, thermal/chemical/hydroentanglement bonding, external drafting/calendering/winding, complete production lines, circular/endless felt machines, special fork/crown velour structuring, tufting/sewing/knitting, separate needles/boards/spares, used/refurbished machines and customer fabric-production/use/services. Needle/board/plate matching, beam/drive timing, supplied needled-board completeness and first-fill factory acceptance materially differ from staple preparation and weaving. CPC 44629 reference is narrower context only; no mapping/alias or old-ID promotion."
