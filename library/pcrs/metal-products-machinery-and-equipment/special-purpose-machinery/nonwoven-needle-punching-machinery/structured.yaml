  market_state: "Accepted complete needleloom at declared factory dispatch gate, integral modules and first-fill completeness defined"
functional_unit:
  what: "Manufacture the configured complete flat nonwoven needle-punching machine"
  how_much: "1 kg net accepted complete machine, converted from per-machine records with measured M"
  how_well: "Document drawing-specific beam/needle/plate alignment, timing, drive and safety acceptance; no equal-mass fabric quality or throughput equivalence"
  how_long_or_cycle: "One manufacture and factory acceptance cycle; no imposed machine or needle life"
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: boundary_foreground
      applies_to: "all processes"
      rule: "Include actual manufacturing, installation, lubrication, rework and attributable factory acceptance. Exclude mill production/use, installation services, distribution after gate, maintenance and end of life. Customer fabric-production settings and energy intensities cannot substitute for factory machine manufacture."
      source_ids: []
    - rule_id: boundary_components
      applies_to: "supplier assemblies"
      rule: "Count configured bare boards plus separately fitted needles or complete needled boards once. Likewise avoid drive/guide, prefilled lubricant and integral control duplication. Central mill air/extraction and external forming/finishing are excluded from machine mass."
      source_ids:
        - andritz-needlepunch
boundary_abstraction:
  declared_starting_condition: "Purchased documented stock and finished assemblies received at reporting manufacturing site"
  starting_condition_role: "Foreground receipt-to-dispatch manufacture module"
  product_classification_scope: "Complete flat barbed-needle mechanical consolidation machine, not nonwoven fabric or full line"
  recursive_input_rule: "Do not generate a supplied complete needleloom/module recursively from this same reference output; disclose prior completion and omit its finished internal operations"
  upstream_dataset_requirement: "Match stock/components, needle type, module completeness, technology, supply state/geography and property; disclose unlinked upstream before a cradle-to-gate claim"
  disclosure: "Function/configuration, gate/site/period, actual make-or-buy route, first fill and M, factory trial, component exclusions and identity/quantity gaps"
