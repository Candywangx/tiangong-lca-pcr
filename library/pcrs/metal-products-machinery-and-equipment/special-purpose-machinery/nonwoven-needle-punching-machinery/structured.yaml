validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require positive measured M and complete flat barbed-needle configuration with beam/zone/board, installed needles, plates, drive/control, integral delivery and retained first fill declared. Reject fabric output or machine-throughput service as reference substitution."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "inventory rows"
    rule: "Each row must be one physically defined exchange with matching public identity, actual reference property, unit group, route and medium. Sewing needles are not felting needles; bare versus needled board scope cannot overlap; PAO lubricant is not mineral oil; technical compressed air is not ambient air withdrawal. Keep incompatible identities unresolved."
    source_ids: []
  - rule_id: validate_conversion
    applies_to: "inventory rows"
    rule: "Verify cp_mass and normalize_mass against the same accepted configuration/period and exact gas/air meter basis and electricity units. Reject duplicate purchased-module constituents, retained lubricant and recovered trial-web issues; no unknown-to-zero defaults."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Fossil CO2 requires actual attributable factory combustion measurements and air-unspecified subcompartment. Other demonstrated substances/mediums need separate cards; machining, powder coating and trial web alone do not establish mandatory emissions."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured flat nonwoven needle-punching machine foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after qualified review and declared upstream coverage"
  allowed_use: "Manufacturing supply-chain modelling for matching function, beam/board/drive configuration, delivery state, gate, site and period"
  excluded_use: "Nonwoven fabric output, lifetime service comparison, equal-mass needling performance, special structuring/endless felt machines and complete cradle-to-gate claims with missing upstream"
  required_metadata: "Reference qualifiers, complete configuration BOM, measured M/first fills, supplied board/needle scope, actual operations/trials, site/period/gates, collection/allocation evidence and upstream links"
  required_quality_disclosure: "Identity/quantity gaps, uncertainty, conditional absent rows, added BOM exchanges, source-edition limitations and unlinked supplier/upstream stages"
  update_trigger: "Width/zone/beam/trajectory, board/needle/plate pattern, drive/control/options, supplier completeness, M/fills, finishing route, factory period/geography or evidence resolution changes"
data_sources:
  - id: "dilo-loom"
    type: "literature"
    reference: "[DILO Needlelooms](https://www.dilo.de/en/machines/needlelooms/)"
    used_for: "Needlelooms paragraphs on single/double/elliptical beam arrangements and needleboard machining at Eberbach; snapshot 2026-10-04 UTC. Specific manufacturing/configuration example only; no universal board material, needle count, resource efficiency, machine mass or lifetime."
  - id: "dilo-range"
    type: "literature"
    reference: "[DILO Universal and high capacity needlelooms](https://www.dilo.de/en/machines/needlelooms/diloom-range/)"
    used_for: "OU/OUG paragraph and specific-feature list: separate drives/plates in OU, rocker-arm guidance, central lubrication and board clamping; snapshot 2026-10-04 UTC. Architecture example only, not all manufacturers; marketed speed, size, longevity and exchange time are not requirements or conversion factors."
  - id: "andritz-needlepunch"
    type: "literature"
    reference: "[ANDRITZ Increase your success with needlepunch, PNT.np.02.eng.07.25](https://www.andritz.com/resource/blob/334550/378a2fd581935553eb728ad6da438e72/brochure-needlepunch-line-solutions-data.pdf)"
    used_for: "©2025 brochure, PDF/printed page 38, Needlelooms and optional-equipment column: oil-lubricated modules, board and bed/stripper configuration; suction, air blowing and pneumatic pinning explicitly optional. Product example only; no compulsory lubricant composition, oil-change/life interval, speed/width or manufacturing quantities."
  - id: "groz-needles"
    type: "literature"
    reference: "[Groz-Beckert Products and services for the Nonwovens industry, EN 02.2026](https://www.groz-beckert.com/mm/media/en/web/pdf/Felting.pdf)"
    used_for: "PDF/printed page 11, felting/structuring portfolio: barbed felting needle geometry distinguished from fork/crown structuring tools for already consolidated webs. Tool/boundary evidence only; no exact steel grade, installed count, wear life, trial recipe or machine mass."
