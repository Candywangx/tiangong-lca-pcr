    - id: quality_balance
      applies_to: "mass and utilities"
      requirement: "Reconcile issues/returns, installed M, chip/residue transfers, retained/test lubricant, trial web and rework; retain scale/meter calibration and actual formulation/state conversions. Set site/configuration QA limits from measurements, not assumed yield, needle life or brochure speed/width."
