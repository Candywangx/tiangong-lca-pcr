  - id: energy_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert measured kWh using verified unit-group factor 3.6 MJ/kWh; declare supply voltage/geography/provider. Installed motor kW is not consumed energy."
