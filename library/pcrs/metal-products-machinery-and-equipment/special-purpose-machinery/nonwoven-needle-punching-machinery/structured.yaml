allocation_rules:
  - rule_id: allocation_order
    applies_to: "shared operations"
    rule: "Separate model, width, beam/zone, stroke path and fitted options by work order; directly assign issues, returns, meters, acceptance and rework first. For inseparable shared manufacturing resources use measured causal station time/load, share = order driver / sum of all covered order drivers; document causality, period and denominator. No unexplained equal-count allocation between different needling architectures."
    source_ids: []
  - rule_id: allocation_reuse
    applies_to: "scrap and trials"
    rule: "Internal recovered stock/web is a transfer, not repeated fresh input. Exported chips, residues and PET trial waste retain measured mass and destination without automatic avoided-product credit. Saleable trial fabric and other co-products require a separate decision and reviewed residual allocation after direct separation. Include rejected/reworked unit burdens in accepted output for the declared period and reconcile unfinished stock."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted net machine mass"
      record_type: "weighing_record"
      raw_fields: "model; configuration; serial number; accepted net mass M; scale_id; calibration; zone/beam/needleboard inclusion; installed_needles; retained_oil_grease; detached_integral_parts; trial_web_removed; packaging_tare"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each machine or representative same-configuration batch"
      temporal_coverage: "same manufacturing period as orders"
      site_scope: "declared factory/configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration, tare, completeness and acceptance receipts"
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each atomic exchange"
