allocation_rules:
  - rule_id: allocation_direct
    applies_to: "foreground_burden_allocation"
    rule: "Use direct part/batch metering and subdivision first. Attribute actual test, reject and rework burdens to accepted supplied parts of the same configuration and period; do not normalize by started count or complete-appliance mass. Shared services use only the unassigned residual on a documented physical driver."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "foreground_burden_allocation"
    rule: "Separate internal returns, sold co-products and discharged waste. State the recycling convention and provider interfaces; no automatic avoided-primary-metal credit or arbitrary negative burden. Use documented physical causality, with any economic fallback justified and sensitivity disclosed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted net component mass"
      record_type: "weighing"
      raw_fields: "part/configuration; accepted identifiers; calibrated net mass; Naccepted; Dnet; tare and packing; period"
      collection_method: "Weigh each accepted delivered part/module/assembly on a calibrated scale or use traceable weighing records for that exact configuration, excluding packing, rejected parts and consumed test loads."
      unit: "kg"
      frequency: "each batch and common reporting period"
      temporal_coverage: "same accepted-production period"
      site_scope: "declared sites and supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; assays; stocks; acceptance; uncertainty"
    - protocol_id: cp_inventory
      process_id: "components_fabrication_dispatch"
      flow_role: "each atomic bought/material/packing exchange"
      record_type: "material_record"
      raw_fields: "row identity; actual grade/state; supplier/provider; gross mass; own assay/moisture; receipts/issues/stocks/returns; route; part configuration; period; Qattr; native unit"
      collection_method: "Reconcile weighed receipts and issues with opening/closing stocks, actual supplier documents and paired internal transfers; separate bought finished modules from site manufacture and retain route-specific raw quantities."
      unit: "native"
      frequency: "each batch and common reporting period"
      temporal_coverage: "same accepted-production period"
      site_scope: "declared sites and supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; assays; stocks; acceptance; uncertainty"
    - protocol_id: cp_utilities
      process_id: "utilities"
      flow_role: "each carrier and residual service"
      record_type: "meter_record"
      raw_fields: "meter imports; on-site generation; exports; storage; fabrication/assembly/test/dispatch submeter; voltage/T/P/density/calorific value; heat gross/net datum; independent return mass/enthalpy; period; Qattr"
      collection_method: "Meter each utility with its own native unit over the common period; reconcile supply with actual end-use meters and only the remaining shared residual; investigate negatives and uncertainties without clipping."
      unit: "native"
      frequency: "each batch and common reporting period"
      temporal_coverage: "same accepted-production period"
      site_scope: "declared sites and supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; assays; stocks; acceptance; uncertainty"
    - protocol_id: cp_tests
      process_id: "test"
      flow_role: "actual factory test media and loads"
      record_type: "test_record"
      raw_fields: "part configuration; acceptance criteria; duration; instrument calibration; test media/input/output mass; water own density/fraction; recirculation/evaporation/discharge/retention; reject/rework; accepted period; Qattr"
      collection_method: "Use factory test logs and separate meters; identify each consumed medium as its own atomic exchange, retain actual load and water balance, and exclude downstream appliance-use estimates."
      unit: "native"
      frequency: "each batch and common reporting period"
      temporal_coverage: "same accepted-production period"
      site_scope: "declared sites and supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; assays; stocks; acceptance; uncertainty"
    - protocol_id: cp_residues
      process_id: "residues"
      flow_role: "each waste handover"
      record_type: "waste_record"
      raw_fields: "specific waste identity; gross wet mass; own moisture/water fraction; own species assay; treatment/provider; internal returns; retention/stocks; configuration; period; Qattr"
      collection_method: "Use calibrated transfer weighing, manifests and stream-specific laboratory assays; keep gross waste mass, water and contained species distinct, and match treatment interfaces."
      unit: "kg"
      frequency: "each batch and common reporting period"
      temporal_coverage: "same accepted-production period"
      site_scope: "declared sites and supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; assays; stocks; acceptance; uncertainty"
    - protocol_id: cp_emissions
      process_id: "residues"
      flow_role: "each measured elementary species"
      record_type: "emission_record"
      raw_fields: "species/CAS; fossil origin; actual compartment; post-control concentration; matching gas/liquid flow; same measurement period; T/P/dry-wet/oxygen corrections; fugitive independent measurement; capture/destruction/recovery; Qattr"
      collection_method: "Measure each species after actual controls with matched flow and time, apply documented state/unit corrections, and independently measure fugitives; no unexplained residual or carbon-only inference becomes an emission."
      unit: "kg"
      frequency: "each batch and common reporting period"
      temporal_coverage: "same accepted-production period"
      site_scope: "declared sites and supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; assays; stocks; acceptance; uncertainty"
  calculation_rules:
    - id: normalize_component
      applies_to: "all inventory rows"
      rule: "For one configuration and period, divide the attributable exchange total in its native unit by the sum of accepted net supplied-part masses; retain all raw totals and uncertainty."
      inputs:
        - Qattr
        - Dnet
        - cp_mass
      output: "native-unit exchange per kg component"
      source_ids: []
  data_quality_requirements:
    - id: quality_qnd
      applies_to: "all inventory rows"
      requirement: "For the same supplied-part configuration and period: Naccepted counts accepted delivered parts/modules/assemblies; Dnet sums measured accepted net component masses; Qattr is the attributable exchange total including reject/rework/test burdens in the row native unit. Mean net part mass=Dnet/Naccepted; per-part exchange=Qattr/Naccepted; per-kg exchange=Qattr/Dnet; the equivalent conversion divides per-part exchange by measured mean net part mass. No assumed component or whole-appliance weight."
      evidence: "calibrated net-mass and acceptance records"
    - id: quality_balances
      applies_to: "fabrication; residues; test"
      requirement: "Each element/species term uses its own gross mass and own assay, moisture and wet/dry basis, with stocks, reactions, retained product, recycling returns and discharge; gross alloy or wet sludge is not contained metal. Each water stream uses its own water fraction and actual temperature density, with reaction, retention, evaporation, discharge and stock; paired circuit returns cancel."
      evidence: "stream-specific assay and mass ledger"
    - id: quality_solvent
      applies_to: "ipa; spentipa; ipair"
      requirement: "Track each stream own IPA assay across input, product retention, recovered/captured liquid, wastewater, spent media, stocks, destruction and air. Capture is not destruction; non-air fates never become air and unexplained residual stays unresolved."
      evidence: "separate assays, recovery and emissions records"
    - id: quality_heat
      applies_to: "heat; utilities"
      requirement: "Reconcile common-period imports+generation minus exports and storage change with fabrication, assembly, test, dispatch and unassigned shared services only. Gross heat=independently measured supplied kg times its own MJ/kg minus independently measured return kg times its own MJ/kg on one datum; deduct gross return once, never deduct again from already-net heat. Steam and condensate physical masses remain separate."
      evidence: "matched meter and enthalpy datum"
    - id: quality_emission
      applies_to: "all inventory rows"
      requirement: "Each emitted species uses measured post-control concentration times its matched gas/liquid flow and same time interval, with actual unit/state corrections and separately measured fugitives. Do not infer CO or NO2 from carbon closure or confuse NO2 molecules with NOx as NO2-equivalent."
      evidence: "species-specific monitoring and corrections"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "The route cards are conditional atomic candidates, not a universal recipe. Add each actual unlisted alloy, polymer, chemical, fastener, bearing, cable, test load, freight service, steam/return or species as its own queried and measured row. Absent is not_applicable only with proof; unknown is not zero. Disclose missing original part-specific architecture and provider/UUID gaps rather than borrowing a shaver/vacuum/DHC construction."
      evidence: "actual BOM, process route, compatibility and gap disclosure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a whole-appliance output, wrong supplied state or implicit positive classification based on a spare-list label alone. Require full category applicability, actual principal use, component exceptions and compatible part evidence."
    source_ids:
      - un-cpc3-parts
      - braun-shaver-compatibility
      - nilfisk-vhs010-parts
      - stiebel-dhc-parts
  - rule_id: validate_mass
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive measured Dnet and same-period Naccepted/Qattr for one supplied-part configuration; independently reconcile net mass, rejected/reworked parts and test burdens. Packing and consumed loads cannot enter Dnet. Native numerator unit and per-kg denominator must agree in both languages."
    source_ids: []
  - rule_id: validate_physics
    applies_to: "foreground_dataset_conformance"
    rule: "Require element/species/water/solvent fates, post-control concentration-flow-time and fugitive evidence, actual utility residual and gross/net heat reconciliation. Investigate negative or unexplained closure; do not clip, fabricate emission factors, efficiencies, lifetime, yields or per-part weight."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Reject invented zeroes, duplicated module manufacture or internal transfer burdens, missing atomic exchanges and unresolved identity treated as a usable matched UUID. Report every performed/skipped check, finding and completeness; pending item-specific evidence must remain visible."
    source_ids: []
published_dataset_profile:
