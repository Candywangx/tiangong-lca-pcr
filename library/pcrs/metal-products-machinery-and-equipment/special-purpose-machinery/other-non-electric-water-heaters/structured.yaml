measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M = accepted net mass of one complete machine of the same configuration in kg; collect using cp_mass."
  - id: physical_basis
    applies_to: "material/water/species"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Each term uses its own assay, moisture, wet/dry basis, measured temperature/density, stocks and reactions; gross mass is not contained element."
  - id: gas_state
    applies_to: "test gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Declare meter reference state and actual T/P/humidity; mass/volume conversion uses actual composition/density, never power-plant case factors."
  - id: energy_interface
    applies_to: "energy"
    required_property_ref:
      name: "Delivered energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Electricity 1 kWh=3.6 MJ. Heat supply mass times own enthalpy minus independent return mass times own enthalpy/common datum; gross subtract return once, already-net never twice."
process_map:
