    role: "foreground"
    quantitative_reference: "per 1 kg reference flow"
  - id: integration
    name: "Heater integration"
    inclusion: "required"
    inclusion_condition: "Actual burner or indirect heat interface, controls, valves, fan/vent, refractory, seals and shipped accessories/fills; gas tankless does not require storage tank"
    role: "foreground"
    quantitative_reference: "per 1 kg reference flow"
  - id: test
    name: "Factory acceptance and rework"
    inclusion: "required"
    inclusion_condition: "Actual pressure/leak/corrosion integrity, burner ignition/gas safety/thermal function and electrical auxiliaries; trace fuel and test medium consumed; installer commissioning excluded"
    role: "foreground"
    quantitative_reference: "per 1 kg reference flow"
  - id: dispatch
    name: "Packing and accepted release"
    inclusion: "required"
    inclusion_condition: "Complete accepted actual supply list; exclude transport packaging and consumed test loads from net product mass"
    role: "foreground"
    quantitative_reference: "per 1 kg reference flow"
  - id: services
    name: "Residual utilities"
    inclusion: "conditional"
    inclusion_condition: "Only common-period unassigned residual and actual onsite generation, not duplicated whole-site imports"
    role: "foreground"
    quantitative_reference: "per 1 kg reference flow"
