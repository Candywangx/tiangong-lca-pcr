product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.other-non-electric-water-heaters"
  classification_refs: "CPC 3.0:44827; HS 2022:8419.11,8419.19"
  covered_products: "Complete other non-electric instantaneous/storage heaters; actual gas/storage/other-fuel/indirect configurations subject to principal-function and supplied-state review"
  excluded_products: "Solar/electric water heating, central heating boilers, separate tank/exchanger/burner/parts as complete output; industrial multifunction boundary unresolved until review"
  representative_product: "One declared complete accepted configuration, not one gas model universalized"
  production_route: "Actual make/buy vessel/exchanger/burner/controls/lining/insulation/integration and factory test route"
  market_state: "Complete accepted factory supply list including separately boxed included accessories and actual retained fill; installation-only supplies excluded"
functional_unit:
  what: "Supply a complete non-electric water heater, not consumer hot-water service"
  how_much: "1 kg accepted net complete machine mass of the same configuration"
  how_well: "Meets actual hydraulic, combustion, pressure, leak, safety and declared acceptance requirements"
  how_long_or_cycle: "One manufacturing/delivery period; no default lifetime"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground"
      rule: "Include receipt, actual site fabrication/corrosion/insulation, integration, factory acceptance/rework, services, wastes and packing to accepted release."
      source_ids:
        - rinnai-condensing
        - bw-gas-storage
        - bw-indirect
        - bock-oil
    - rule_id: make_buy
      applies_to: "supplier_interface"
      rule: "Bought complete tank/burner/exchanger/controller embeds its upstream materials and operations once. Own fabrication uses feedstocks and actual operations instead. Partial supplied modules disclose remaining work. Pair internal transfers and count each burden once."
      source_ids:
        - rinnai-condensing
        - bw-gas-storage
        - bw-indirect
        - bock-oil
    - rule_id: factory_use
      applies_to: "production"
      rule: "Include actual factory hydrostatic/leak and burner/function test water, gas/oil/electricity and losses; separate retained shipped fills and accessories. User fuel/hot water, installation vent/pipe/commissioning and use-phase condensate are outside factory production. Manufacturer installer instructions do not prove factory test amounts."
      source_ids: []
    - rule_id: bom_extension
      applies_to: "route"
      rule: "Atomic cards are conditional anchors, not a universal recipe. Add each actual grade, coating ingredient, foam precursor/blowing agent, weld gas, fuel, accessory, fill, waste and emitted species; require actual formulation/assay and route. not_applicable requires absence evidence; unknown is not zero."
      source_ids: []
    - rule_id: upstream
      applies_to: "links"
      rule: "Actual upstream production/transport and external treatment links need supplied state/geography/period. Supplier boiler fuel embedded in purchased heat is not onsite combustion; no complete cradle-to-gate claim before missing providers are resolved."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual input grade/completed state and supplier delivery interface"
  starting_condition_role: "Factory receipt boundary"
  product_classification_scope: "Complete other non-electric water heater, actual principal function and supplied state reviewed"
