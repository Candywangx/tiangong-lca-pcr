  unresolved_inventory_uuids: Every atomic identity actually searched; adopted locators require own direct state100/reference property/unit/compartment checks. Unmatched grades, chemicals, parts, waste treatment and molecular species remain explicit identity gaps requiring item-specific review.
  unresolved_foreground_evidence: Primary manufacturer documents support architecture and supplied-state distinctions, not a factory recipe, test burden, net mass, yield, intensity or performance default. Each site must supply actual BOM/make-buy/corrosion route/insulation formulation/accepted tests/fills/accessories/provider/assays/utility and species records.
  classification_review: CPC 3.0 44827 explicitly uses HS 2022 8419.11 and 8419.19; solar44826/8419.12, electric44817 and central boiler44825 are adjacent. HS84.19 separates general non-domestic thermal machines from non-electric instantaneous/storage water heaters by a semicolon; CPC448/4482 domestic parent alone cannot establish automatic domestic-only scope. Industrial or multi-service hybrids and generic indirect storage/exchanger units require actual principal-function and supplied-state classification review, not automatic44827 mapping.
