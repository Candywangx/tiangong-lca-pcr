system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "all processes"
      rule: "Include actual manufacturing, internal handling, rework, attributable utilities, acceptance testing and dispatch packaging within the declared site/process chain. Record outsourced heat treatment as supplier activity instead of also counting its fuel locally. This is a foreground protocol, not proof of complete cradle-to-gate coverage."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "thermal; joining"
      rule: "Select operations from drawings and route cards. Manufacturer examples support forging and heat treatment for some shares; DuraMaxx wear bodies illustrate absence of drilling/punching/welding. Neither is universal. Add each actual carburising medium, quench oil, cleaner, abrasive, structural tube, wheel, hose and safety component as an individually identified exchange before claiming configuration completeness."
      source_ids:
        - lemken-plough-bodies
        - kverneland-share-production
        - kverneland-steel-technology
    - rule_id: boundary_environment
      applies_to: "all processes"
      rule: "Elementary flows cross to the environment only. Supplied process water is a product input; externally treated rinse effluent is a waste output. Quantify route-specific air/water releases only from measurements or documented constituent balances; unknown species must not be invented or merged into NOx/VOC placeholders."
      source_ids: []
