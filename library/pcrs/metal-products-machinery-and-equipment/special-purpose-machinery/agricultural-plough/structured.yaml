allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Use direct job/lot records and subdivision first. For shared equipment measure job machine-hours and measured load, reconcile assigned plus unassigned consumption to the meter, and retain the physical causal basis. Mass allocation is allowed only when a site test establishes proportional processing demand; unequal plough configurations cannot automatically be allocated by unit count or finished mass."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "waste outputs"
    rule: "Record steel chips, offcuts and coating residue with destination and revenue status. Sale alone does not establish a co-product or authorize an avoided-steel credit. Keep waste-treatment and recycling burdens/benefits explicit in the chosen study method; disclose any economic allocation, price period and sensitivity when physical allocation is unsupported."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "forming; assembly"
    rule: "Attribute rejects and rework to their originating configuration and count accepted output once. Recoverable internal steel/powder circulations are tracked separately from net purchased inputs and external wastes."
    source_ids: []
