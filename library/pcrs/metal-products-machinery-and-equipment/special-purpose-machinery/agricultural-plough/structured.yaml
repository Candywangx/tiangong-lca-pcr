  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "reference product"
      requirement: "Keep body count, material, support, reset/hydraulic options and acceptance consistent with M; distinguish gross shipping mass and incomplete kit mass."
      evidence: "BOM and calibrated weighing"
    - id: quality_route
      applies_to: "all processes"
      requirement: "Specify foreground vs purchased parts; record heat treatment recipe and coating chemistry where used. A manufacturer example is route evidence, not a universal recipe, yield or lifetime."
      evidence: "lemken-plough-bodies; kverneland-share-production; kverneland-steel-technology"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Reconcile BOM and material balances, utility meters, inventory changes, rejects, packaging and waste destinations. Quantify omitted exchanges and justify each exclusion; gaps are not zero."
      evidence: "job ledger and reconciliation"
    - id: quality_range
      applies_to: "all inventory rows"
      requirement: "No transferable quantity ranges are established. Collect site-specific records and uncertainty; do not use advertised wear-life gains, carburising time or catalogue mass as factory inventory factors."
      evidence: "measurement records and explicit evidence gaps"
validation_rules:
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Require positive measured M, same accepted configuration, reference output exactly 1 kg, explicit normalize_mass application and compatible numerator units. Record gas conditions and electricity conversion evidence."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Verify each UUID public identity, reference property/unit, route, origin and environment compartment before dataset use. An unresolved flow remains a named exchange without UUID and blocks a claim of complete identity coverage; no forced substitute."
    source_ids: []
  - rule_id: validate_complete
    applies_to: "reference product"
    rule: "Check exact BOM coverage including wheels/rims, bolts/nuts, hoses, seals and overload mechanisms when fitted; add each missing atomic exchange and supplier activity. Check route omissions and direct emission species. Report performed, skipped, uncertainty and remaining gaps; manufacturing checks do not validate farm performance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configured foreground manufacture of a complete mouldboard plough"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply compatible configured plough manufacture to a separately modelled equipment life cycle; upstream use only after linkage and coverage review"
  excluded_use: "Crop yield, soil carbon, comparative hectares, universal lifetime, disc-plough manufacture, claims of complete cradle-to-gate without upstream verification"
  required_metadata: "Configuration qualifiers; M protocol; site/period; route; receiving state; supplier activities; boundary diagram; property/units; allocation; packaging; waste destinations"
  required_quality_disclosure: "Identity gaps; missing BOM/suppliers; measurement uncertainty; skipped processes; unverified emissions; range evidence gaps; upstream and transport completeness"
  update_trigger: "Configuration, steel grade, treatment route, coating, supplier, utility mix, measured mass or boundary changes"
data_sources:
  - id: "lemken-plough-bodies"
    type: "handbook"
    reference: "LEMKEN, Plough Bodies. https://lemken.com/en-en/agricultural-machines/soil-cultivation/ploughing/equipment/bodies"
    used_for: "Dural/DuraMaxx paragraphs: boron-steel shares, hardened slats, route exceptions and body variants. Manufacturer-specific; no lifetime or quantitative ranges adopted."
  - id: "kverneland-share-production"
    type: "handbook"
    reference: "Kverneland, HIGH quality production. https://uk.kverneland.com/about-kverneland/kverneland-technology/high-quality-production"
    used_for: "Share production paragraph: forging, hardening and tempering example only; no mandatory universal route."
  - id: "kverneland-steel-technology"
    type: "handbook"
    reference: "Kverneland, STEEL as a science. https://uk.kverneland.com/about-kverneland/kverneland-technology/steel-as-a-science"
    used_for: "Complex production processes paragraph: mouldboard carburising and specimen testing example; gas composition, cycle time and emissions must be measured for the actual route."
