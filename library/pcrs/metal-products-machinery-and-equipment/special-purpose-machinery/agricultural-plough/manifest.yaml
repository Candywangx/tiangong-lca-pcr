review_metadata:
  scientific_review: pending
  semantic_boundary_decision: New semantic successor; existing ploughs leaf is a read-only empty
    scaffold and retired locator. No material overlap found. Covers complete
    tractor-mounted/semi-mounted mouldboard plough manufacture; disc ploughs need a separate
    evidence-backed extension.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_uuids:
    - row_id: frame_section
      flow_name: Finished rectangular structural steel hollow section
      reason: EN rectangular structural hollow-section and ZH rectangular steel tube queries returned
        unmatched section/chemical candidates; plate or Z-section does not establish rectangular
        hollow-section identity.
    - row_id: wear_blank
      flow_name: Micro-alloyed boron steel ploughshare blank
      reason: Boron steel queries returned boron iron, raw alloy or nonmatching steel routes; boron iron
        is a ferroalloy, not certified micro-alloyed ploughshare stock.
    - row_id: quench_polymer
      flow_name: Polyalkylene glycol quench concentrate
      reason: Polymer quench queries returned quenching oils, not polyalkylene glycol concentrate of known
        formulation.
    - row_id: weld_slag
      flow_name: Solidified flux-cored steel welding slag
      reason: Specific welding slag query returned boiler/mineral/ferroalloy slags; these do not establish
        flux-cored steel welding residue identity.
    - row_id: rinse_effluent
      flow_name: Untreated aqueous metal-cleaning rinse effluent
      reason: Cleaning wastewater and treatment queries produced water-release or treated/other-industry
        records; none establish untreated metal-cleaning waste to external treatment.
    - row_id: purchased_share
      flow_name: Finished hardened boron-steel mouldboard ploughshare
      reason: Finished ploughshare query returned boron iron/carbide/raw steel or other equipment
        weldments; no finished hardened share confirmed.
    - row_id: purchased_mouldboard
      flow_name: Finished hardened steel plough mouldboard
      reason: Mouldboard query returned raw steel sheets/plate/materials; no finished hardened mouldboard
        identity confirmed.
    - row_id: steel_bolt
      flow_name: Finished steel hexagon bolt
      reason: EN hexagon bolt and ZH steel bolt queries produced collective unspecified fasteners or
        wooden shingle bolts; neither establishes this exact bolt.
    - row_id: steel_nut
      flow_name: Finished steel hexagon nut
      reason: EN and ZH steel nut queries produced food nuts, collective fasteners or screws; no hexagon
        nut confirmed.
    - row_id: steel_washer
      flow_name: Finished steel flat washer
      reason: Steel washer query produced nitrile/chloroprene rubber and unspecified fasteners; no single
        steel flat washer confirmed.
    - row_id: pivot_pin
      flow_name: Finished steel plough pivot pin
      reason: EN and ZH pivot pin queries produced chemicals, rivets or needle/pin intermediates; no
        finished plough pivot confirmed.
    - row_id: reset_spring
      flow_name: Finished steel overload-reset leaf spring
      reason: Leaf-spring query produced collective springs/leaves, wire or mattress innerspring; no
        specific overload-reset leaf spring confirmed.
    - row_id: support_tyre
      flow_name: Finished pneumatic rubber plough support tyre
      reason: Direct read of generic Tire 11c2e97a-624f-41de-957d-543cddb777ef uses Number of items and
        broad metal/rubber scope; it is not a mass-reference pneumatic rubber tyre. No forced
        conversion.
    - row_id: support_rim
      flow_name: Finished steel plough support-wheel rim
      reason: Wheel-rim query produced a trailer-specific rim; application to plough support wheel not
        established.
    - row_id: hydraulic_cylinder
      flow_name: Complete double-acting hydraulic steel cylinder
      reason: Hydraulic cylinder queries returned cylinder blanks/parts/kits or wind-turbine drives; no
        complete double-acting hydraulic steel cylinder confirmed.
  unresolved_range_evidence: No transferable independent factory ranges for steel yield, energy,
    water, waste or emissions. Require foreground records; manufacturer longevity and
    treatment-duration claims are not normalization factors.
  boundary_review: Candidate foreground manufacturing protocol only; completeness of each real
    configuration and unlisted BOM inputs must be checked.
  uuid_review: All adopted flows directly read at state-code 100; reference properties and public
    support-unit groups checked. Aluminium-content coating waste and count-reference generic tyre
    rejected.
