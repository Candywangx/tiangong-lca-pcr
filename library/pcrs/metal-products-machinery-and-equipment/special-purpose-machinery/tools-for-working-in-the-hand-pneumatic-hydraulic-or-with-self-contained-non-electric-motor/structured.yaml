product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.tools-for-working-in-the-hand-pneumatic-hydraulic-or-with-self-contained-non-electric-motor"
  classification_refs: "CPC 3.0 44231"
  covered_products: "This PCR covers production of complete tools designed to work in the hand, driven pneumatically, hydraulically or by a self-contained non-electric motor. Preserve rotary, impact, reciprocating, drilling, grinding, sawing, cutting, forestry and horticultural variants whose principal function and actual architecture fall in this category, including petrol chainsaws and compatible handheld brush/hedge tools. Auxiliary ignition electricity does not make a petrol principal motor electric. Reference mass is a production normalization, not functional equivalence between tool families. Declare ambiguous hybrid or mower architecture for item-specific boundary review."
  excluded_products: "Electric handheld tools; ordinary unpowered hand tools; standalone engines/power packs; separate parts, tool holders and interchangeable tools; non-handheld stationary machine tools; mowers with another principal function."
  representative_product: "Actual complete delivered pneumatic grinder, hydraulic breaker/chainsaw or petrol handheld chainsaw; no universal configuration."
  production_route: "Actual-architecture receipt, make/buy components, assembly, factory test and release/packing. Magnesium die casting, aluminium gravity casting, steel forging and reinforced plastics are source-evidenced routes only; actual grades/recipes separately verified."
  market_state: "Complete accepted tool and actual included construction; separate spares/power source are not the reference output."
functional_unit:
  what: "Complete powered handworking function of the declared configuration"
  how_much: "per 1 kg reference flow; no cross-tool functional equivalence"
  how_well: "Actual declared drive mechanism, rated conditions and acceptance criteria; catalogue values are not factory input defaults."
  how_long_or_cycle: "Manufacture to factory accepted release; record actual qualification cycles, no assumed customer lifetime."
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: gate
      applies_to: "foreground"
      rule: "Include actual receipt, site fabrication, mechanical/control assembly, integration, factory test/rework, common services, waste and packing through accepted release."
      source_ids:
        - un-cpc-44231
        - us-hs8467
        - jrc-metalworking
    - rule_id: make_buy
      applies_to: "supplier_interface"
      rule: "For each component choose its actual make/buy state: complete bought tool housing/air motor/hydraulic motor/petrol engine/drive/ignition module includes embedded inputs once; own fabrication uses actual feedstocks and operations instead. Charge only subsequent site work. Pair internal transfers; do not list site-made intermediates as purchased imports."
      source_ids:
        - un-cpc-44231
        - us-hs8467
        - jrc-metalworking
    - rule_id: factory_use
      applies_to: "production"
      rule: "Include actual factory rotational/impact/reciprocating hand-tool acceptance and documented loaded sawing/drilling/grinding or applicable gardening qualification trials, actual test materials, cleaning water, electricity and consumed lubricant. Recovered trial materials uses measured returns and stocks. Customer machined materials/wood/vegetation and downstream tool operation are not machine manufacturing output."
      source_ids:
        - un-cpc-44231
        - us-hs8467
        - jrc-metalworking
    - rule_id: bom_extension
      applies_to: "route"
      rule: "Cards are specific conditional anchors, not universal recipes. Audit actual BOM, formulations, test media, packaging, fuels, waste and species. Add each missing atomic actual exchange; document not_applicable only with absence evidence, unknown differs from zero. Unknown actual metal alloy/polymer reinforcement/two-component resin/coating/lubricant/fuel or treatment formulation requires actual supplied-state evidence."
      source_ids:
        - un-cpc-44231
        - us-hs8467
        - jrc-metalworking
    - rule_id: upstream
      applies_to: "links"
      rule: "Link supplier production and transport at actual grade, state, delivery geography/voltage and period; external treatment after measured waste transfer is distinct from site emissions. Without completed providers this factory package is not a complete cradle-to-gate result."
      source_ids:
        - un-cpc-44231
        - us-hs8467
        - jrc-metalworking
