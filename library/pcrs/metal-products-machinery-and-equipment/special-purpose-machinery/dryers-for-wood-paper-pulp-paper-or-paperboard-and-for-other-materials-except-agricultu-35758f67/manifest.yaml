  semantic_boundary:
    status: confirmed
    statement: Factory-gate manufacture of complete supplied drying machinery for wood, paper pulp, paper/paperboard and nonagricultural industrial materials; standalone drying sections remain covered while complete paper-making lines, civil works and drying services are excluded.
  reference_flow_identity:
    status: confirmed
  unresolved_inventory_uuids: Specific non-UUID cards require direct confirmation of actual grade, formulation, species, supply state and compartment before concrete dataset use. CN1-35kV purchased electricity identity applies only to matching supply interfaces; other geography/voltage remains unresolved.
  unresolved_provider_links: Actual factory location, upstream supplier, completed-state interfaces and period-specific supply datasets remain foreground collection requirements.
  unresolved_quantitative_ranges: No universal machine mass, recipe, yield, energy, emission factor, lifetime or empirical range adopted; actual same-configuration period collection required.
  unresolved_recipe_evidence: Conditional grades, insulation chemistry, coating formulation, refrigerant and test materials require actual BOM/SDS/supplier evidence, not inferred from manufacturer family pages.
  unresolved_mixed_use_boundary: Mixed-purpose dryers and embedded paper-machine supplies require actual principal-function and contractual-scope review.
  source_limitations: Manufacturer pages establish physical configurations and components but no factory inventory amounts. Nyle HTML and GEA detailed technology PDF access failed; downloaded Nyle Rev2024.01 PDF and GEA Chemical applications BCH0001-EN1603 original alternative were inspected. GEA has no explicit publication date and equipment lists do not prove fabrication recipes. Voith operational claims are not manufacturing intensity defaults.
