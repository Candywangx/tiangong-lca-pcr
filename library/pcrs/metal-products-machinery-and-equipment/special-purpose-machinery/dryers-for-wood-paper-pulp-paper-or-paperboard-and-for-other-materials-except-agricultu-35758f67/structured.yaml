  - id: web
    name: "Paper/pulp drying section assembly"
    inclusion: "conditional"
    inclusion_condition: "Standalone supplied web/contact-cylinder or airborne pulp drying assembly, not an entire paper-making line."
    role: "foreground"
    quantitative_reference: "finished_dryer"
  - id: industrial
    name: "Other-material dryer assembly"
    inclusion: "conditional"
    inclusion_condition: "Conveyor, direct/indirect rotary, contact paddle/vacuum, spray, flash/ring or fluid-bed drying configuration with nonagricultural principal purpose."
    role: "foreground"
    quantitative_reference: "finished_dryer"
  - id: test
    name: "Factory acceptance and retest"
    inclusion: "required"
    inclusion_condition: "Actual dimensional, pressure/leak, drive/control, airflow and conditional heated or wet-load factory tests; customer drying operation excluded."
    role: "foreground"
    quantitative_reference: "finished_dryer"
  - id: services
    name: "Unassigned factory services"
    inclusion: "conditional"
    inclusion_condition: "Only reconciled residual load after process assignments; own generation is separately inventoried."
    role: "foreground"
    quantitative_reference: "finished_dryer"
  - id: dispatch
    name: "Accepted supply and dispatch preparation"
    inclusion: "required"
    inclusion_condition: "One complete accepted machine or explicitly complete modular supply configuration at factory gate."
    role: "foreground"
    quantitative_reference: "finished_dryer"
