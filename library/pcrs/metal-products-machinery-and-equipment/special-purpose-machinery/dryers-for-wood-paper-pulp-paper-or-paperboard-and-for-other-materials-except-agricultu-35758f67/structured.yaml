allocation_rules:
  - rule_id: causal_allocation
    applies_to: "factory processes"
    rule: "Prefer direct configuration metering; allocate shared machinery using measured causal drivers such as machine hours, weld hours and heat-treatment lot load, with disclosure. Do not average unlike configurations into one reference."
    source_ids: []
  - rule_id: residual_only
    applies_to: "shared services"
    rule: "Shared services contain only unassigned residual for the same period/units; do not add whole-site meters on top of metered stages. Investigate negative residual, never clip to zero."
    source_ids: []
  - rule_id: scrap_recovery
    applies_to: "scrap and solvent"
    rule: "Cancel paired internal material, water-return and solvent-recycle transfers while retaining actual treatment energy. External scrap/co-products require actual legal/market state, treatment boundary and allocation disclosure; no automatic avoided-primary credit."
    source_ids: []
  - rule_id: reject_burden
    applies_to: "reject and trial"
    rule: "Rework, rejects and failed-test burdens remain in their attributable accepted-configuration period; their mass, trial material and packaging do not enter accepted net equipment denominator."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dispatch"
      flow_role: "accepted net equipment"
      record_type: "matched period records"
      raw_fields: "model; configuration; serial number; accepted net mass M; N; supplied modules; retained charge; tare; acceptance date"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
    - protocol_id: cp_material
      process_id: "actual_applicable_process"
      flow_role: "one physical input"
      record_type: "matched period records"
      raw_fields: "grade; species; formulation; provider; quantity; returns; opening/closing stocks; own assay/moisture; make/buy completed state"
      collection_method: "Calibrated weighing, each supplier certificate and representative assay; distinguish purchased assembly from internal inputs and verify actual recipe."
      unit: "kg"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
    - protocol_id: cp_energy
      process_id: "actual_applicable_process"
      flow_role: "one utility"
      record_type: "matched period records"
      raw_fields: "meter; period; imports; generation; exports; storage; assignments; actual fuel mass/volume/reference conditions/composition/NCV; steam supply mass/P/T/quality/enthalpy; separate condensate mass/T/enthalpy; causal driver"
      collection_method: "Use calibrated disjoint meters in one period; actual electricity kWh times 3.6 gives MJ. Actual steam supply mass times own state enthalpy minus independent return mass times own return enthalpy on one datum, or calibrated net heat meter. Match the actual steam/heat provider contract: gross delivered-energy interface requires separately credited return heat once; a provider already denominated in net heat receives no second return subtraction. Return counted once; purchased heat does not repeat own boiler fuel."
      unit: "MJ"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
    - protocol_id: cp_water
      process_id: "actual_water_process"
      flow_role: "one water exchange"
      record_type: "matched period records"
      raw_fields: "meter; temperature/density; own material moisture; stocks; evaporation; discharge; paired returns; reactions"
      collection_method: "Meter actual supplied, retained, evaporated and external discharged water and each material own moisture; convert volume using own temperature/density. Pair internal returns while retaining pumping/treatment energy."
      unit: "kg"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
    - protocol_id: cp_waste
      process_id: "actual_applicable_process"
      flow_role: "one waste stream"
      record_type: "matched period records"
      raw_fields: "net/tare; own species/moisture/metal assay; wet/dry basis; stocks; receiver; treatment; test material destination"
      collection_method: "Segregated weighing and matched own analysis including slag, sludge and wastewater; record actual receiver/treatment."
      unit: "kg"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
    - protocol_id: cp_emission
      process_id: "actual_release_point"
      flow_role: "one species/compartment"
      record_type: "matched period records"
      raw_fields: "species; compartment; concentration; gas/liquid flow; duration; own assay; sampling; capture; stocks; detection limit; uncertainty"
      collection_method: "Post-control and fugitive species monitoring; model/factor must match actual fuel, technology, control and species. Below detection is not known zero; do not treat material residual as air release."
      unit: "kg"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
    - protocol_id: cp_pack
      process_id: "dispatch"
      flow_role: "one packaging component"
      record_type: "matched period records"
      raw_fields: "species/polymer/grade; mass; reuse stock; returned quantity; shipments; configuration"
      collection_method: "Weigh each package separately and record actual reuse service/returns; exclude from machine net mass."
      unit: "kg"
      frequency: "each lot and configuration"
      temporal_coverage: "complete same period including rejects/rework"
      site_scope: "declared factory and supply interfaces"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibration; acceptance; assays; provider state; sampling/allocation uncertainty"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
    - id: period_accounting
      applies_to: "same configuration and period"
      rule: "Q includes attributable period rejects/rework; N is accepted complete units of one configuration; mean net mass is sum of accepted net masses/N; per-item exchange is Q/N; final per-kg exchange is Q/same accepted net mass sum."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_water
        - cp_waste
        - cp_emission
        - cp_pack
      output: "matched period inventory"
      source_ids: []
    - id: utility_residual
      applies_to: "cp_energy"
      rule: "Residual = imports + actual own generation - exports - net storage increase - already assigned fabrication, casting, finishing, family assembly, testing and dispatch consumption in same period/units. Allocate residual only using measured causal drivers; investigate negative values against meter topology and combined uncertainty, never clip. Own generation has its fuel and releases separately inventoried."
      inputs:
        - cp_energy
      output: "residual utility"
      source_ids: []
    - id: species_balance
      applies_to: "physical material/species records"
      rule: "For each element/chemical: external inputs and opening contained stocks plus reaction formation equal contained product, scrap, slag, sludge, wastewater, actual release and closing stock plus reaction consumption; every term uses its own matched assay and wet/dry basis; cancel paired internal transfers. Gross mass is not contained species."
      inputs:
        - cp_material
        - cp_mass
        - cp_waste
        - cp_emission
      output: "species residual"
      source_ids: []
    - id: water_balance
      applies_to: "physical water and moisture records"
      rule: "Supplied water + each input own moisture + opening water stocks + reaction-generated water = retained product water + each wet waste/sludge own water + external wastewater own water + evaporation + closing water stocks + reaction-consumed water; each term uses own moisture, density and wet/dry basis; pair water returns. Investigate closure with actual combined measurement/sampling/allocation uncertainty, no universal tolerance or assumed loss."
      inputs:
        - cp_material
        - cp_mass
        - cp_water
        - cp_waste
        - cp_emission
      output: "finite water residual"
      source_ids: []
    - id: solvent_balance
      applies_to: "actual solvent species"
      rule: "Partition solvent inputs/opening stock into retained product, recovered solvent, capture-media content, wastewater/sludge content, closing stock, verified actual destruction and species-specific air release; capture is not destruction and unclosed residual is not automatically air."
      inputs:
        - cp_material
        - cp_waste
        - cp_emission
      output: "solvent closure"
      source_ids: []
    - id: combustion_species
      applies_to: "actual factory combustion"
      rule: "Fuel carbon balance constrains fossil CO2 only with own carbon composition, oxidation partition and reaction/stock evidence; CO, NO and NO2 require their own monitoring or matching actual technology factors. Preserve distinction between NOx-as-NO2 and actual NO2."
      inputs:
        - cp_energy
        - cp_emission
      output: "species release"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "reference"
      requirement: "Retain actual dried material, principal function, supplied modules, make/buy, acceptance and calibrated net mass; classification title does not establish module completeness."
      evidence: "drawings; BOM; acceptance"
    - id: identity
      applies_to: "all interfaces"
      requirement: "Each specific flow and provider requires geography, species, physical/chemical state and completed supply interface; reference UUID does not resolve other material identities."
      evidence: "supplier certificates; direct flow reads"
    - id: coverage
      applies_to: "active routes"
      requirement: "Actual grade, formulation, medium, trial material, treatment and emissions require sufficiently specific cards/collection; disclose unknown, below-detection, not-applicable and zero distinctly."
      evidence: "SDS; production records"
    - id: uncertainty
      applies_to: "physical balances"
      requirement: "Investigate closure using actual combined measurement/sampling/allocation uncertainty; no universal recipe, yield, energy, lifetime or empirical range."
      evidence: "calibration; assays; allocation"
validation_rules:
  - rule_id: scope_identity
    applies_to: "reference"
    rule: "Require principal drying function and complete actual supplied scope; distinguish standalone pulp/web dryer section from entire paper line, and exclude agricultural, household and centrifugal clothes families."
    source_ids:
      - voith-drying
      - valmet-airborne
      - gea-chemical
  - rule_id: denominator
    applies_to: "inventory"
    rule: "Same-period/configuration accepted count and net mass must be positive, traceably calibrated and normalized; packaging, trial material, rejects and civil mass are outside denominator."
    source_ids: []
  - rule_id: single_account
    applies_to: "make/buy and utilities"
    rule: "Count upstream assemblies, internal transfers, supply/return steam heat, precharge and own generation once; residual and assigned loads reconcile one site period, without overlaying whole-factory meter totals."
    source_ids: []
  - rule_id: closure
    applies_to: "physical species records"
    rule: "Require each term own assay and finite water, element, solvent and release closure; investigate residual with actual combined uncertainty, no assumed air loss or destruction."
    source_ids: []
  - rule_id: completeness
    applies_to: "dataset"
    rule: "Report accepted input, performed/skipped checks, findings and completeness; missing quantity/interface/recipe or unsupported relationship is inconclusive, not validated publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground dataset-production guidance"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "declared-configuration dryer factory production and downstream process/lifecyclemodel projections with readiness disclosure"
  excluded_use: "drying service or user operation; equal-function/lifetime comparison using kg equipment alone; publication claims with unresolved data"
  required_metadata: "all reference qualifiers, factory period/geography, supply scope, make/buy, collection and allocation"
  required_quality_disclosure: "identity/provider gaps, recipe conditions, missing empirical ranges, calibration/sampling/closure uncertainty and unknowns"
  update_trigger: "change in dried material, principal function, supplied modules, alloy/recipe, heating architecture, provider, metering or evidence"
