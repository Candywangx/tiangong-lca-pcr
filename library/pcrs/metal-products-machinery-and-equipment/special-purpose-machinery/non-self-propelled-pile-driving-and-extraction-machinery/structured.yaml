      record_type: "meter_and_issue_records"
      raw_fields: "job and configuration; accepted unit count; each row-specific issued/returned amount and original unit; constituent/grade; meter readings; allocation driver; waste destination; route conditions"
      collection_method: "For each atomic row, use calibrated meters, weighed issue/returns, supplier receipts and disposal tickets. Preserve property: kg for mass, MJ from electricity meters, m3 for directly abstracted groundwater. Purchased-water mass is not converted to volume without measured density and conditions. Reconcile stage utility totals with the factory bill, and component/retained-fluid inclusion with the net-mass record."
      unit: "row-specific kg, MJ, m3"
      frequency: "each job and meter interval"
      temporal_coverage: "complete same-configuration batch in reporting period; disclose seasonality and mixed lines"
      site_scope: "declared factory, outsourced and purchased gates"
      aggregation_rule: "attributable row amount / accepted machines of the same configuration"
      quality_evidence: "calibration, supplier composition, job, allocation and disposal evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished machine; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids: []
  data_quality_requirements:
    - id: configuration_trace
      applies_to: "all rows"
      requirement: "Trace every input to installed BOM, route and accepted unit; supplier finished parts do not also receive raw-stock burdens. Disclose remaining components as missing coverage until separate atomic records are added."
      evidence: "drawings, BOM, supplier receipts"
    - id: basis_quality
      applies_to: "cp_mass"
      requirement: "M must be positive measured net mass, with the same delivered configuration, fluid state and acceptance gate as all collected exchanges."
      evidence: "calibration and weighing records"
    - id: coverage_quality
      applies_to: "all processes"
      requirement: "Document full batch temporal coverage, meter overlap, rejects, rework, stock changes, outsourced stages and unmeasured emissions. A missing record is unknown, not zero or not_applicable."
      evidence: "ledger, coverage matrix and measurement uncertainty"
    - id: chemistry_quality
      applies_to: "wet_surface; powder_finish"
      requirement: "Verify recipe, concentration and SDS for each supplied formulated chemical; characterize each outgoing waste stream and identify treatment separately from environmental emissions."
      evidence: "recipe, SDS, analyses and transfer tickets"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Reject missing qualifiers, payload/gross mass substitution, non-positive M or mismatch between configuration, cp_mass and finished_machine. Require 1 kg output and explicit normalize_mass on every non-reference applicable row."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "inventory"
    rule: "Require one physical exchange per row, verified public identity when supplied, correct property/unit, localized display and medium. Unresolved UUIDs do not authorize proxy substitution or mixed rows."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "coverage"
    rule: "Reconcile installed mass, stock, waste, retained fluids and purchased parts using the actual BOM; independently check clamp/hose configuration. Reconcile utilities by stage; internal transfers cancel. Explain differences against recorded measurement uncertainty, without a fabricated numerical tolerance."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check every conditional stage against route evidence. Require missing chemicals, parts, test media and actual emissions to be split and collected before claiming a complete inventory; prohibit cradle-to-gate or service comparisons while upstream or functional coverage is incomplete."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared_operations"
    rule: "Require complete driver records and justification for allocation and scrap treatment; document sensitivity where another defensible allocation may change results."
    source_ids:
      - ghg-product-allocation-2011
published_dataset_profile:
  dataset_role: "Manufacturing foreground process for a configured accepted machine"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to a declared machinery supply model with identical configuration and disclosed upstream coverage"
  excluded_use: "Pile installation/extraction service, field vibration/noise and life-cycle comparison across pile/soil or head configurations without separate functional modelling"
  required_metadata: "Model, configuration, empty state, M, retained fluids, manufacturer/site, reporting period, process route, voltage/geography, supplier gates, transport/packaging scope and allocation"
  required_quality_disclosure: "Measured versus estimated quantities; unresolved identities; unmeasured emissions and components; upstream linkage completeness; uncertainty, data age and configuration limitations"
  update_trigger: "Changed mechanism, capacity, BOM, coating chemistry, supplied component, energy mix, acceptance specification or mass protocol"
