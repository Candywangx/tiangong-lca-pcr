review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: steel_sheet
        reason_code: manual_review_required
        explanation: "The public Steel Sheet candidate has a contradictory Chinese baseName (银板材); do not assert this UUID until identity is corrected or adjudicated."
      - row_id: cutting_blade
        reason_code: no_exact_candidate
        explanation: "The ranked product candidates describe saw blades, whole mowers, mowing services or generic bladed parts; none identifies an installed mower cutting blade."
      - row_id: abs_moulding_scrap
        reason_code: no_exact_candidate
        explanation: "The ranked waste candidates describe plastic packaging waste or mixed metal/plastic scrap, not separately collected ABS injection-moulding scrap."
    range_evidence_needs:
      - row_id: finished_mower
        evidence_need: "Two independent, route-compatible net machine mass datasets with the same complete-machine boundary."
      - row_id: steel_sheet
        evidence_need: "Independent hot-rolled chassis sheet consumption and yield records for the same mower configuration."
      - row_id: abs_granulate
        evidence_need: "Independent in-house ABS moulding input and scrap records for comparable mower housings."
      - row_id: site_electricity
        evidence_need: "Independent factory-gate electricity records with consistent machine and process allocation."
      - row_id: diesel_test
        evidence_need: "Independent accepted-machine factory-test diesel records for comparable diesel mower routes."
      - row_id: cutting_blade
        evidence_need: "Independent installed mower-blade mass records by cutting system."
      - row_id: gasoline_test
        evidence_need: "Independent accepted-machine factory-test gasoline records for comparable gasoline mower routes."
      - row_id: corrugated_box
        evidence_need: "Independent packaging mass records excluding reusable pallets and other pack materials."
      - row_id: painted_metal_parts
        evidence_need: "Independent painted mower component mass records for comparable purchased-part routes."
      - row_id: gasoline_engine
        evidence_need: "Independent installed gasoline-engine mass records by mower configuration."
      - row_id: electric_motor
        evidence_need: "Independent installed electric-motor mass records by cutting and traction configuration."
      - row_id: liion_battery
        evidence_need: "Independent installed complete-battery item counts for comparable battery-powered mower configurations."
      - row_id: purchased_housing
        evidence_need: "Independent purchased moulded-housing mass records for comparable mower models."
      - row_id: steel_scrap
        evidence_need: "Independent steel-fabrication scrap records with compatible input and process boundaries."
      - row_id: abs_moulding_scrap
        evidence_need: "Independent separately collected ABS moulding scrap records for comparable housing routes."
      - row_id: diesel_engine
        evidence_need: "Independent installed diesel-engine item counts for comparable ride-on mower configurations."
