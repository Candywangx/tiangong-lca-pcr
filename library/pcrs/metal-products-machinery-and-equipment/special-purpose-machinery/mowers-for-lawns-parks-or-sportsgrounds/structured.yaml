functional_unit:
  what: "Supply a complete mower capable of cutting managed grass in a lawn, park or sportsground."
  how_much: "One accepted complete machine of the declared configuration."
  how_well: "Meets the manufacturer's declared cutting and acceptance specification; record cutting width, drive and power source."
